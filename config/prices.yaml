# USD per 1M tokens, for bench/costs.py (the spend report) and the per-call `cost_usd` in provenance records.
# OpenRouter calls report their own exact `usage.cost`; these prices are used only when a call has none (Bedrock, and
# OpenRouter calls logged before 2026-10-28). Bedrock prices are ESTIMATES until checked against the AWS bill: the
# instance role cannot read Cost Explorer (ce:GetCostAndUsage), so the report labels Bedrock totals as estimates.
# Update this file when a price changes; keep the old file in config/versions/.
as_of: 2026-10-28
models:
  bedrock/us.openai.gpt-6-luna:
    input: 0.10
    output: 0.50
    cached_input: 0.01
    source: OpenRouter list price for openai/gpt-6-luna on 2026-10-28 (Bedrock price not yet confirmed)
  bedrock/openai.gpt-oss-120b-1:0:
    input: 0.15
    output: 0.60
    source: Bedrock on-demand price for gpt-oss-120b (us-east-1), as used in DATAGEN-2026-10-28
  openrouter/openai/gpt-6-luna:
    input: 0.10
    output: 0.50
    cached_input: 0.01
    source: OpenRouter list price 2026-10-28
  openrouter/openai/gpt-oss-120b:
    input: 0.15
    output: 0.60
    source: OpenRouter list price 2026-10-28
  vllm/granite-4.2-8b:
    input: 0.0
    output: 0.0
    source: local GPU (instance hours are billed separately, not per token)
judge:
  # Jev (OpenRouter decisions API) is unlisted in OpenRouter's price list; its spend is inside OpenRouter's exact key usage.
  openrouter-decisions/typesafe/jev-1.14: {per_call: null}
