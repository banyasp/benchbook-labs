# Pipeline knobs (not model choices: those live in models.yaml). Flat on purpose; one line per knob.
# Read with pipeline.perturb.pconfig.get("<key>") (W2/W5 may read it the same way; unknown keys are ignored).
# Changing a value changes new runs only; every run records the values it used in lineage.detail / provenance.

# flip (design 6.3): share of listed-item flips realized INDIRECTLY (different terms / magnitude / split facts, with
# the lexical-overlap ceiling). The rest are realized as a PARAPHRASE of the would_change item (no overlap ceiling,
# model verification kept). Seeded choice per item. Peter may override.
indirect_share: 0.7

# revise_card (design 7.3 / 7.4): at most this share of revise targets may be hand-ups (move ask or refuse).
handup_cap: 0.3333333333

# Model attempts (validation + feedback loop) per perturb model call.
perturb_tries: 3

# pair (W2): card view and AR prompt assignment for train items (design §9.3)
thin_share: 0.0        # share of eligible train items served thin; 0 in the first SFT run, then 0.3
ar_share: 0.5          # share of train items with the analogical-reasoning prompt on
