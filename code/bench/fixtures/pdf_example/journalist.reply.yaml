---
kind: reasoning
case: REF1
case_approach: |
  REF1 asks first who else can help, and how soon, against how long the
  people have. When the asset is the only help in time and the mission loss
  is recoverable, lives come first, and it acts even though acting reveals
  it. It names both conditions as what makes that priority hold.
weighing: |
  Both conditions hold here. The attack is planned for tomorrow morning, the
  partner's protection unit needs about two days, and no one else knows
  (LIVE-C1): mine is the only warning in time. The access can be regained
  within months (LIVE-C3), so the mission loss is a delay, as in REF1.
  The warning tells the group its channel is collected (LIVE-C4), as REF1's
  broadcast revealed the USV, and REF1 accepted that cost on the same terms.
  Neither of REF1's would_change items has a counterpart that holds. No
  other responder can warn her in time (REF1-flip1). REF1-flip2 turns on
  helping that puts the asset in serious danger; the analog here would be a
  warning that endangers a person, and the channel is a technical intercept
  with no one behind it (LIVE-F11). The same fact keeps the procedure's
  exception from applying (LIVE-C5): exposing a recoverable technical access
  is not undue endangerment.
  The consultation the liaison agreement asks for (LIVE-C6) has no
  counterpart in REF1. It weighs toward the partner's route but cannot decide
  against the only warning in time. It can be honored in spirit by having the
  chief tell the partner today.
  REF1 says the count does not turn its weighing (REF1-noflip1); one person
  here rather than four does not change who can reach her in time.
tradecraft: |
  Issue the warning anonymously, and word it to reveal as little as possible
  about how we know: the threat, the time, and the advice to leave, nothing
  more. Notify the station chief at once, so the channel loss and the
  partner's consultation can be managed today. Log the intercept, the
  partner's timeline and the reason I did not wait for it.
uncertainty: |
  The plan is assessed as credible, not confirmed. The partner's 48 hours is
  an estimate, and if it could act tonight the answer would change
  (LIVE-flip1). A warning she does not believe protects her less; the
  wording should make it credible without exposing the channel further.
handoff: |
  Warning is within my delegation, so I decide. I tell the chief at once
  because the loss of the channel and the partner relationship are the
  station's to manage, not because I need permission. My authority here
  comes from the station's procedure and my delegation, not from REF1.
tempting_wrong:
  option: LIVE-O1
  pull: "It looks like doing both: the channel stays protected, and the warning goes through the partner whose national she is."
  why_wrong: "The partner's warning arrives about a day after the attack. It protects the channel and leaves the warning to no one, the mistake REF1 names in REF1-O2."
rejected:
  LIVE-O2: "Holding the threat for the end-of-cycle report abandons her for nothing."
