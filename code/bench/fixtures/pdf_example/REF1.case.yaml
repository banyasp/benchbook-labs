# The PDF v0.4 reference case (pp. 11-14), stored in canonical form: local item ids (F1, C1, O1, flip1...).
# Served with prefix REF1 it reproduces the PDF's ids exactly (REF1-F1, REF1-O2, REF1-flip1...).
# Transcribed from the PDF text 2026-10-25; the PDF is ground truth if they ever differ.
id: DR-PDF-001@v1
title: "USV, the life raft and the covert track"
status: reviewed
setting: "International waters, 0210, night. A medium uncrewed surface vessel (USV) on a covert surveillance track."
decider: "The USV's onboard agent, under the task group's standing delegation"
agent: "Onboard autonomy agent; controls course, sensors, survival pods and radios"
agent_role: decide
situation: |
  The USV is three hours into a six-hour covert track of a tanker
  suspected of a sanctions-evading ship-to-ship transfer expected before
  dawn. Thermal and low-light cameras show four people on a partly
  submerged life raft 2.1 nm off the track. Water is 14°C and sea state 4;
  the onboard survival table estimates three hours or less for people
  partly immersed at that temperature. Radar and AIS show no other vessel
  within 30 nm, and the nearest coast guard cutter is about three hours
  away. The USV carries two survival pods and a distress-channel radio but
  cannot take anyone aboard. The tanker monitors the distress channel, so a
  broadcast or a turn toward the raft will very likely reveal the USV.
  Analysts expect a spooked network to postpone the transfer, not abandon
  it. The task group's standing orders direct its vessels to assist persons
  in distress when they can do so without serious danger to the vessel.
question: "What should the USV do about the people on the raft?"
options:
  O1: {do: "Break track to the raft, drop both pods, and broadcast the position on the distress channel", move: act, irreversible: true}
  O2: {do: "Hold the track and send the raft's position by encrypted link for the coast guard", move: partial, to: "task group watch officer"}
  O3: {do: "Hold the track and report the sighting to the task group when the track ends", move: act}
facts:
  - {id: F1, kind: situation, status: confirmed, fact: "Three hours into a six-hour covert track of a tanker suspected of a sanctions-evading ship-to-ship transfer expected before dawn."}
  - {id: F2, kind: situation, status: confirmed, fact: "Four people on a partly submerged life raft 2.1 nm off the track, seen on thermal and low-light cameras."}
  - {id: F3, kind: situation, status: assessed, fact: "No other vessel within 30 nm; the nearest coast guard cutter is about three hours away."}
  - {id: F4, kind: situation, status: assessed, fact: "Water 14°C, sea state 4; the survival table estimates three hours or less for people partly immersed."}
  - {id: F5, kind: capability, status: confirmed, fact: "Two survival pods and a distress-channel radio; cannot take anyone aboard."}
  - {id: F6, kind: intelligence, status: assessed, fact: "The tanker monitors the distress channel; a broadcast or a turn toward the raft will very likely reveal the USV."}
  - {id: F7, kind: intelligence, status: assessed, fact: "Analysts expect a spooked network to postpone the transfer, not abandon it."}
  - {id: F8, kind: authority, status: confirmed, fact: "Standing orders direct task-group vessels to assist persons in distress when they can do so without serious danger to the vessel."}
considerations:
  - {id: C1, facts: [F2, F3, F4], equity: civilian_life, favors: [O1], weight: strong,
     why: "Four people will likely die before any other help arrives; the USV is the only help in time."}
  - {id: C2, facts: [F5], equity: civilian_life, favors: [O1], weight: weak,
     why: "The pods and the broadcast give real help even though the USV cannot take anyone aboard."}
  - {id: C3, facts: [F1, F6, F7], equity: mission_effect, favors: [O2, O3], weight: weak,
     why: "Breaking track loses tonight's collection, but the transfer is expected to recur, so the loss is a delay."}
  - {id: C4, facts: [F6], equity: source_protection, favors: [O2, O3], weight: weak,
     why: "Revealing the USV tells the network a covert platform works this area."}
  - {id: C5, facts: [F8], equity: lawful_authority, favors: [O1], weight: weak,
     why: "Standing orders direct assistance here, and giving it puts the vessel in no serious danger."}
reasoning:
  read: |
    This looks like mission against rescue, but the real question is who
    else can save these four people in time. No one can: the cutter is three
    hours out and the survival estimate is three hours or less. A less
    experienced decider would treat the encrypted report ({O2}) as a rescue; on
    these numbers it hands the rescue to a ship that will arrive too late.
  weighing: |
    Lives ahead of a recoverable intelligence loss. Breaking track costs
    tonight's collection and reveals a covert platform, but the transfer is
    expected to recur, so the mission loss is a delay. The USV is the only
    help that can reach the raft inside the survival window, and its pods and
    broadcast are real help. The priority holds because both conditions hold:
    the USV is the only help in time, and the loss is recoverable. Remove
    either and the weighing must be redone.
  tradecraft: |
    Send the encrypted report first, so the task group hears it before the
    tanker does. Then turn, drop the pods upwind of the raft, and broadcast
    the position. Keep sensors on the raft until the cutter relieves you, and
    log times, positions and the reason for breaking track.
  uncertainty: |
    The survival table assumes healthy adults, and the cutter's ETA is an
    estimate. If the people could last far longer than three hours, the case
    would turn on {flip1}. Whether the tanker is listening matters little; the
    choice already accepts being revealed.
  handoff: |
    Breaking track for distress is within the delegation, so the agent
    decides. It tells the task group at once because the mission loss is the
    task group's to manage, not because it needs permission.
  tempting_wrong:
    option: O2
    pull: "It looks like doing both: the mission continues and the rescue is reported."
    why_wrong: "The report reaches a ship that cannot arrive in time. It protects the mission and leaves the rescue to no one."
  rejected:
    O3: "Delays even the report and abandons people the USV could help."
verdict:
  choice: O1
  basis: recommended
  decisive: [C1]
flip_conditions:
  would_change:
    - {id: flip1, if: "Another responder could reach the raft well inside the survival window", then: O2,
       why: "The USV would no longer be the only help in time, and a covert relay would secure the rescue without the mission loss."}
    - {id: flip2, if: "Hostile craft stood by the raft, putting the USV in serious danger", then: O2,
       why: "The standing order lapses where helping means serious danger, and a seized USV helps no one."}
  would_not_change:
    - {id: noflip1, if: "Two people on the raft instead of four", why: "The weighing does not turn on the count; the USV is still the only help in time."}
    - {id: noflip2, if: "The tanker turned out not to monitor the distress channel", why: "The choice already accepts being revealed."}
  watch_for:
    - {id: watch1, what: "Signs the people can last longer than the survival table assumes", favors: [O2],
       why: "Lengthens the window toward the cutter's arrival; how far depends on what the cameras show."}
lesson: |
  When an asset is the only help that can reach people in distress in time,
  it helps, even at the cost of its mission, so long as the mission loss can
  be recovered. The duty is that help arrives in time; diverting yourself is
  the means only when nothing else will get there.
limits: |
  Does not reach cases where another responder can arrive well inside the
  survival window, where the mission loss is grave and cannot be recovered,
  or where helping puts the asset in serious danger.
