# Answer key for the PDF journalist scenario, relevant arm (REF1 = DR-PDF-001@v1 served as REF1).
# Gold = the PDF's own reply (pp. 14-18). Case items in global ids.
scenario: PDF-JOURNALIST
arm: relevant
served: DR-PDF-001@v1
options:
  LIVE-O1: {do: "Pass the threat to the partner's liaison desk for its protection unit to warn her", move: partial}
  LIVE-O2: {do: "Hold the threat for the end-of-cycle report to the collection manager", move: act}
  LIVE-O3: {do: "Warn her today through the station's duty-to-warn protocol", move: act, irreversible: true}
choice: LIVE-O3
relation: follows
frame:
  question: "What should I do about the plan to kill the journalist?"
  decider: "Me, under the station's delegation"
  my_role: "I may issue a duty-to-warn notice on my own authority and inform the station chief afterwards."
frame_map: {question: same_kind, decider: same_kind, role: same}
option_map: {LIVE-O1: DR-PDF-001@v1/O2, LIVE-O2: DR-PDF-001@v1/O3, LIVE-O3: DR-PDF-001@v1/O1}
fact_mapping:
  matched: []
  corresponding: []
  live_only: [LIVE-F1, LIVE-F2, LIVE-F3, LIVE-F4, LIVE-F5, LIVE-F6, LIVE-F7, LIVE-F8, LIVE-F9, LIVE-F10, LIVE-F11]
  case_only: [DR-PDF-001@v1/F1, DR-PDF-001@v1/F2, DR-PDF-001@v1/F3, DR-PDF-001@v1/F4, DR-PDF-001@v1/F5,
              DR-PDF-001@v1/F6, DR-PDF-001@v1/F7, DR-PDF-001@v1/F8]
consideration_mapping:
  matched:
    - {live: LIVE-C1, case: DR-PDF-001@v1/C1}
    - {live: LIVE-C2, case: DR-PDF-001@v1/C2}
    - {live: LIVE-C3, case: DR-PDF-001@v1/C3}
    - {live: LIVE-C4, case: DR-PDF-001@v1/C4}
    - {live: LIVE-C5, case: DR-PDF-001@v1/C5}
  live_only: [LIVE-C6]
governs: true
course: "Warn her today through the station's duty-to-warn protocol, anonymously, and tell the station chief at once."
decisive: [LIVE-C1]
now:
  - "Issue the anonymous warning: the threat, the time, and the advice to leave, nothing about how we know."
  - "Notify the station chief, asking that the partner be told today."
  - "Log the intercept, the partner's timeline and the reason for not waiting."
flip_conditions:
  - {id: LIVE-flip1, if: "The partner's protection unit can warn her before tomorrow morning", then: LIVE-O1}
  - {id: LIVE-flip2, if: "The threat is reassessed as bravado or deception rather than a plan", then: LIVE-O2}
provenance: {source: "Benchbook Research Plan v0.4, pp. 14-18", author: Peter Banyas}
