<table class="grid funnel"><tr><th>stage</th><th>count</th><th>detail</th><th>what blocks the next stage</th><th>source</th></tr>
{% for s in funnel %}<tr><td>{% if s.link %}<a href="{{ s.link }}">{{ s.stage }}</a>{% else %}{{ s.stage }}{% endif %}</td>
<td class="num big2">{{ s.count if s.count is not none else '—' }}</td><td class="small">{{ s.detail or '' }}</td>
<td class="small">{{ s.blocking or '' }}</td><td class="mono small">{{ s.where }}</td></tr>{% endfor %}</table>
