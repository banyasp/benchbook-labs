{% extends "base.html" %}{% block content %}
{% if tabs %}<p class="tabs"><a href="?which=observations" class="{{ 'on' if which=='observations' }}">Observations</a> <a href="?which=risks" class="{{ 'on' if which=='risks' }}">Risk register</a> <a href="?which=priorities" class="{{ 'on' if which=='priorities' }}">V2 priorities</a></p>{% endif %}
<p class="small muted mono">{{ d.path }} · {{ d.mtime }}</p>
{% if d.kind == 'md' %}<article class="md">{{ d.html|safe }}</article>{% else %}<pre class="wrap">{{ d.text }}</pre>{% endif %}
{% endblock %}
