# Where the model is told to put the documents, per reasoning mode (DECISIONS 2026-10-25). Appended after the
# format spec. {{STEPS}} is the number of documents. Versioned: copy to modes.v2.yaml before changing.
A: |
  Think through the decision freely first. Then, after your thinking, write the YAML documents as your reply. Nothing
  else in the reply.
B: |
  Write the YAML documents directly as your reply. Nothing else in the reply.
C: |
  Your thinking is the structure. Write the YAML documents inside your thinking, one after another, with nothing but
  the documents between them. Close your thinking with </think> after the last document before the verdict
  (the applicability document when the case does not govern), then write the verdict document as your reply.
Cprime: |
  Your thinking is the structure. Write the YAML documents inside your thinking, one after another. You may write
  short free-text notes between documents. Close your thinking with </think> after the last document before the
  verdict (the applicability document when the case does not govern), then write the verdict document as your reply.
