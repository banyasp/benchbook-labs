# Judge instructions, v2 (2026-11-09): only `choice.option` changed from v1 (tuned on 53 hand-labelled option pairs
# from all-pairs grid B2; results/allpairs/OPTION-JUDGE-TUNING-2026-11-09.md). Every other text is v1's, so their
# cached judge calls stay valid. v1 header follows.
# Judge instructions, v1 (2026-10-25). Each `choice` instruction frames one Jev Choice call; each `noul` question
# frames one Jev_Noul yes/no call. Changing any text here changes every cache key: copy to instructions.v2.yaml
# (and choice.v2.md / noul.v2.md if the templates change) and bump PROMPT_VERSION in scorers/judge.py rather than
# editing in place. All of these are drafts for Peter's review.
choice:
  fact: >-
    Which of the candidate facts states the same fact as the one given, with the same values (numbers, times,
    places, counts, names) and nothing that contradicts it? Extra detail is fine. A candidate that states the
    given fact together with other facts still counts.
  option: >-
    Each item is a course of action in one decision. Which candidate makes the same core choice as the one given:
    the same decision on the same question (for example act or refrain, approve or reject, include or omit, which
    body acts or decides)? Ignore implementation detail around the core choice: routing, channels, paperwork, timing
    words, and extra preparatory or follow-up steps. A candidate that bundles the same core choice with extra steps
    still counts. A candidate that makes a different or opposite choice does not, even if the wording overlaps.
  consideration: >-
    Each item is a consideration in a decision: the value at stake (equity), the reason, and the facts it rests
    on. Which candidate makes the same point as the one given, about the same value, for the same reason?
  now: >-
    Each item is an immediate action an agent says it will take. Which candidate is the same action (the same
    act, recipient and content)? Wording may differ.
  flip: >-
    Each item is a condition under which a decision would change, and what it would change to. Which candidate
    names the same condition (the same change in the facts)?
noul:
  frame_question: >-
    Do the reference and the candidate state the same decision question (the same choice about the same thing),
    possibly in other words?
  frame_decider: >-
    Do the reference and the candidate name the same decider (the same person, body or agent, deciding on the
    same authority)?
  frame_role: >-
    Do the reference and the candidate describe the same role and authority for the agent (what it may do on its
    own and whom it must inform or ask)?
  course: >-
    Do the reference and the candidate describe the same course of action, with no step in one that the other
    contradicts or omits in a way that matters?
