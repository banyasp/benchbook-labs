# baseline, seed 1: noise floor for comparing trials
# data: results/sft/autoresearch/subset-train-q1.jsonl; overrides: {"train.seed": "1"}
policy_role: policy
hf_ids:
  granite-4.2-8b: ibm-granite/granite-4.2-8b
model:
  attn_implementation: sdpa
data:
  path: null
  eval_path: results/sft/gen-val/golden.jsonl
  require_mode: B
  max_length: 16000
  verify_format: true
  drop_report_share_fail: 0.02
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
train:
  learning_rate: 0.0001
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 0.05
  lr_scheduler_type: cosine
  weight_decay: 0.0
  bf16: true
  gradient_checkpointing: true
  use_liger_kernel: false
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 100000
  save_strategy: steps
  save_steps: 50
  save_total_limit: null
  seed: 1
