# LoRA SFT, v3 (2026-11-13). Trains on the SFT targets of pipeline.sft.generate (results/sft/gen1/golden.jsonl:
# pairs-v1 train cells, format v4, mode B = no thinking block; Peter 2026-11-13), validation loss on the dev-split
# cells (results/sft/gen-dev/golden.jsonl). v2 stays as is (never overwrite). Stop vLLM first: both need the 48 GB.
#
#   PYTHONPATH=code .venv/bin/python -m training.sft_lora --config code/training/configs/sft_lora.v3-gen1.yaml --out results/sft/run-gen1
#
# Sizing: rows are <= ~11.4k tokens (prompt ~6.3k median, reply ~2.5k median), so the logits (11.4k x 100k vocab) are
# ~2.3 GB bf16 + the fp32 upcast; fine without liger-kernel at batch 1 with gradient checkpointing.
policy_role: policy
hf_ids:
  granite-4.2-8b: ibm-granite/granite-4.2-8b

model:
  attn_implementation: sdpa

data:
  path: results/sft/gen1/golden.jsonl
  eval_path: results/sft/gen-dev/golden.jsonl
  require_mode: B              # targets have no thinking block (Peter, 2026-11-13)
  max_length: 16000            # longer rows are DROPPED (never truncated) and logged
  verify_format: true
  drop_report_share_fail: 0.02

lora:
  r: 16                        # serve.sh LORA_RANK must be >= r
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  learning_rate: 1.0e-4
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 0.05
  lr_scheduler_type: cosine
  weight_decay: 0.0
  bf16: true
  gradient_checkpointing: true
  use_liger_kernel: false
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 50
  save_strategy: steps
  save_steps: 100
  save_total_limit: 6
  seed: 0
