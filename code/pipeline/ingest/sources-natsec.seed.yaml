# W8b (BUILD-BRIEF-v2.4 §W8b): national-security decision sources, tier 1 (strike and engagement decisions).
# Source catalog: docs/natsec-decision-sources-v1.md (Peter, 2026-10-27). These are the HELD-OUT test domain:
# split = test for every family; families are per incident (all documents about one incident share a family).
# Scope at extraction: the decision, not the technique (design §4.2) — who decided, options, equities, authority and
# legal standard (ROE, distinction, proportionality, precautions), stated reasoning, outcome. Strip munition/fuze,
# CDE mechanics, sensor/ISR procedure, attack geometry and tactics. Doctrine (catalog Part D3) is NOT ingested.
# Access: no user-agent spoofing or workarounds; hosts that block scripts (media.defense.gov, apps.dtic.mil, nsa.gov,
# rand.org, esd.whs.mil, ...) are used only through the mirrors the catalog lists; anything unfetchable goes to
# results/SOURCES-BLOCKED-2026-10-28.md for Peter to download into data/raw/manual/.
defaults:
  split: test
  held_out_domain: military-operational
  refusal_sensitivity: high
  license: public record (government investigation / parliamentary / tribunal report, or public mirror of one)
sources:
  - id: KUNDUZ-2009-BT
    family: KUNDUZ-2009
    content_domain: targeting
    title: "Bundestag inquiry report on the Kunduz tanker strike (4 Sep 2009), Drucksache 17/7400 (German)"
    url: https://dserver.bundestag.de/btd/17/074/1707400.pdf
