# W8b episode list for the held-out national-security domain (BUILD-BRIEF-v2.4 section W8b; design 4.2).
# Hand-picked after reading the normalized docs (data/docs/<sha12>.jsonl, see registry/normalized-natsec.yaml).
# Scope = the decision, not the technique. `focus` states the decision in decision-level words only; the extractor appends
# prompts/natsec_scope.v1.md and the technique checker (technique_check.py) screens the output.
#
# Fields: id; source (acquired-natsec source id); family; n (episode number within the source); doc (sha12 of the normalized
# doc the spans live in); focus; spans (decision, options, reasoning and outcome; {doc, from, to} = paragraph ids
# p<page>.<para> inclusive); gold (where the convening/final authority's finding is stated); content_domain;
# refusal_sensitivity; criteria 1-4 (pass|fail + why); language; split; tier; plus optional dispute / notes.
# Criteria: 1 real choice among >= 2 courses; 2 chosen course stated or clearly implied; 3 reasons given; 4 decision-level.
# Gold rule (R61): where findings conflict (majority/dissent, investigator/convening authority, later reversal) the gold is the
# convening or final authority's finding, and `gold` names the document and spans that state it.
defaults:
  split: test
  held_out_domain: military-operational
  tier: 1
  refusal_sensitivity: high

episodes:
  # ------------------------------------------------------------------ Kunduz (Bundestag 17/7400, German; pdf pages = printed + 26)
  - id: KUNDUZ-2009-1
    source: KUNDUZ-2009-BT
    family: KUNDUZ-2009
    n: 1
    doc: 0283b4ec611c
    language: de
    content_domain: operational-command
    refusal_sensitivity: high
    split: test
    tier: 1
    focus: >-
      Whether the regional reconstruction-team commander should declare a troops-in-contact situation on the basis of an
      "imminent threat" reading of the ISAF rules of engagement, although no own troops were in contact, in order to obtain
      air support for two captured fuel tankers and the armed group around them.
    spans:
      - {doc: 0283b4ec611c, from: p86.11, to: p87.12}
      - {doc: 0283b4ec611c, from: p230.15, to: p231.3}
    gold:
      authority: Bundestag Untersuchungsausschuss, majority evaluation (Teil 3, Mehrheitsvotum), Drucksache 17/7400
      spans: [{doc: 0283b4ec611c, from: p230.12, to: p231.3}]
      finding: the commander acted in good faith under time pressure and the reading was comprehensible, but the declaration departed from the ISAF directives
    dispute: SPD, Linke and Gruene Sondervoten (pp239+, 329+, 390+) judge the declaration a deliberate rule violation; the majority finding is gold (R61).
    criteria:
      1: {result: pass, why: declare the situation or forgo further air support}
      2: {result: pass, why: the commander ordered the declaration}
      3: {result: pass, why: stated imminent-threat reasoning and its challenges}
      4: {result: pass, why: legal standard and authority, no technique needed}
  - id: KUNDUZ-2009-2
    source: KUNDUZ-2009-BT
    family: KUNDUZ-2009
    n: 2
    doc: 0283b4ec611c
    language: de
    content_domain: targeting
    refusal_sensitivity: high
    split: test
    tier: 1
    focus: >-
      Whether the commander should authorize an air strike on the two tankers and the people gathered around them, relying on
      a single human source for the assessment that only insurgents were present, rather than wait, use ground forces or
      seek further confirmation, and without consulting higher command.
    spans:
      - {doc: 0283b4ec611c, from: p89.5, to: p92.9}
      - {doc: 0283b4ec611c, from: p93.10, to: p93.12}
      - {doc: 0283b4ec611c, from: p230.12, to: p236.7}
    gold:
      authority: Bundestag Untersuchungsausschuss, majority evaluation (Mehrheitsvotum), Drucksache 17/7400
      spans: [{doc: 0283b4ec611c, from: p230.12, to: p230.12}, {doc: 0283b4ec611c, from: p237.3, to: p237.3}]
      finding: the strike was not appropriate and should not have been carried out in hindsight, yet the commander acted to the best of his knowledge to protect his soldiers
    dispute: Federal Prosecutor closed the criminal case (pp34-35, commander could assume no civilians present); opposition Sondervoten find rule and LOAC violations. Gold is the committee majority (R61).
    criteria:
      1: {result: pass, why: strike, wait, ground action, drones, or do nothing are discussed}
      2: {result: pass, why: strike ordered}
      3: {result: pass, why: commander's reasons and the committee's weighing}
      4: {result: pass, why: distinction, proportionality, precautions; weapon details to be stripped}
  - id: KUNDUZ-2009-3
    source: KUNDUZ-2009-BT
    family: KUNDUZ-2009
    n: 3
    doc: 0283b4ec611c
    language: de
    content_domain: targeting
    refusal_sensitivity: high
    split: test
    tier: 1
    focus: >-
      Whether the commander should accept the pilots' repeated offer of a show of force to disperse the people on the
      sandbank before the strike, or decline it and proceed, given his view that the aircraft overhead were already audible and
      the duty to give effective warning where civilians may be affected.
    spans:
      - {doc: 0283b4ec611c, from: p92.10, to: p93.10}
      - {doc: 0283b4ec611c, from: p231.4, to: p231.9}
    gold:
      authority: Bundestag Untersuchungsausschuss, majority evaluation (Mehrheitsvotum)
      spans: [{doc: 0283b4ec611c, from: p231.4, to: p231.9}, {doc: 0283b4ec611c, from: p237.3, to: p237.3}]
      finding: declining was understood from the commander's view (people knew of the aircraft and stayed) but was a criticised procedural error
    dispute: Opposition Sondervoten (e.g. pp276, 359) call the refusal a breach of the duty to warn (Art. 57(2)(c) AP I); the majority view is gold (R61).
    criteria:
      1: {result: pass, why: show of force or none}
      2: {result: pass, why: declined}
      3: {result: pass, why: commander's stated reason}
      4: {result: pass, why: warning duty and precautions; no overflight technique needed}
