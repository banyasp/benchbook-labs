    episodes:
      - {n: 1, family: OGE-2635-302b-1, section: "2635.302", focus: "Example 1 to paragraph (b) of 2635.302: the GS-13 DHS employee who has long lent a vacation house rent-free to a friend who has now become the employee's direct supervisor. Decision point: whether the employee may keep allowing the supervisor's family to use the house rent-free."}
      - {n: 2, family: OGE-2635-303f-1, section: "2635.303", focus: "Example 1 to paragraph (f) of 2635.303: twelve subordinates take their AID supervisor, who is being reassigned abroad, to a farewell lunch and divide the cost of the supervisor's meal. Decision point: whether the supervisor may accept the paid-for lunch."}
      - {n: 3, family: OGE-2635-304b-4, section: "2635.304", focus: "Example 4 to paragraph (b) of 2635.304: the CFPB economist who overhears the supervisor's upcoming 50th birthday and wants to give the supervisor a $25 bottle of wine. Decision point: whether the employee may give the gift."}
