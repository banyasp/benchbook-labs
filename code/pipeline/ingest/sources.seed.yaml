# Seed for data/store/registry/sources.yaml (written by `python -m pipeline.ingest registry`).
# Tonight's four sources (BUILD-BRIEF-2f, critical path step 1). Episodes are the decision points picked by hand
# after reading each document (cheap, deterministic); `focus` tells the extractor which decision to build.
# DOHA was blocked from this box (HTTP 403 on every page; not worked around), so the three adjudication sources
# are DOE Office of Hearings and Appeals personnel security decisions (same adjudicative schema).
sources:
  - id: OHA-PSH-26-0100
    title: "DOE OHA, In the Matter of Personnel Security Hearing, PSH-26-0100 (Administrative Judge decision, issued 2026-09-16)"
    url: https://www.energy.gov/sites/default/files/2026-09/PSH-26-0100.pdf
    listing_url: https://www.energy.gov/oha/listings/security-cases
    article_url: https://www.energy.gov/oha/articles/psh-26-0100-matter-personnel-security-hearing
    format: pdf
    kind: "DOE OHA personnel security decision"
    license: "US Government work, public domain (names redacted by OHA)"
    catalog_row: {strand: "Adjudicated decisions", source: "DOE OHA personnel security (PSH)"}
    family: OHA-26-0100
    domain: personnel security adjudication
    why: "Alcohol (Guideline G) and criminal conduct (Guideline J); clearance RESTORED. Gold for both concerns is 'resolved', with mitigation evidence (treatment, abstinence, probation completed) that the Judge weighs explicitly."
    outcome: "restored (G resolved, J resolved)"
    episodes:
      - {n: 1, focus: "The Guideline G (alcohol consumption) security concern: whether the Individual has resolved it, so that access authorization can be restored. Decision point: the Administrative Judge's finding on Guideline G."}
      - {n: 2, focus: "The Guideline J (criminal conduct) security concern: whether the Individual has resolved it. Decision point: the Administrative Judge's finding on Guideline J, given the facts and the Guideline G finding."}
  - id: OHA-PSH-26-0087
    title: "DOE OHA, In the Matter of Personnel Security Hearing, PSH-26-0087 (Administrative Judge decision)"
    url: https://www.energy.gov/sites/default/files/2026-09/PSH-26-0087.pdf
    listing_url: https://www.energy.gov/oha/listings/security-cases?page=1
    article_url: https://www.energy.gov/oha/articles/psh-26-0087-matter-personnel-security-hearing
    format: pdf
    kind: "DOE OHA personnel security decision"
    license: "US Government work, public domain (names redacted by OHA)"
    catalog_row: {strand: "Adjudicated decisions", source: "DOE OHA personnel security (PSH)"}
    family: OHA-26-0087
    domain: personnel security adjudication
    why: "Financial considerations (Guideline F) and criminal conduct (Guideline J); a MIXED result: J resolved, F not resolved, so access authorization is NOT granted. Gives one 'resolved' and one 'not resolved' gold from the same record."
    outcome: "not granted (F not resolved, J resolved)"
    episodes:
      - {n: 1, focus: "The Guideline F (financial considerations) security concern: whether the Individual has mitigated it. Decision point: the Administrative Judge's finding on Guideline F."}
      - {n: 2, focus: "The Guideline J (criminal conduct) security concern: whether the Individual has resolved it. Decision point: the Administrative Judge's finding on Guideline J."}
  - id: OHA-PSH-26-0122
    title: "DOE OHA, In the Matter of Personnel Security Hearing, PSH-26-0122 (Administrative Judge decision)"
    url: https://www.energy.gov/sites/default/files/2026-10/PSH-26-0122.pdf
    listing_url: https://www.energy.gov/oha/listings/security-cases
    article_url: https://www.energy.gov/oha/articles/psh-26-0122-matter-personnel-security-hearing
    format: pdf
    kind: "DOE OHA personnel security decision"
    license: "US Government work, public domain (names redacted by OHA)"
    catalog_row: {strand: "Adjudicated decisions", source: "DOE OHA personnel security (PSH)"}
    family: OHA-26-0122
    domain: personnel security adjudication
    why: "Drug involvement (Guideline H) and the Bond Amendment; clearance NOT restored. A different issue family from the other two and a denial."
    outcome: "not restored (H not resolved)"
    episodes:
      - {n: 1, focus: "The Guideline H (drug involvement and substance misuse) security concern: whether the Individual has mitigated it. Decision point: the Administrative Judge's finding on Guideline H."}
  - id: OGE-5CFR2635-B
    title: "5 CFR Part 2635 Subpart B (Gifts From Outside Sources), Office of Government Ethics standards with official worked examples (eCFR)"
    url: "https://www.ecfr.gov/api/versioner/v1/full/2026-10-01/title-5.xml?part=2635&subpart=B"
    listing_url: https://www.ecfr.gov/current/title-5/chapter-XVI/subchapter-B/part-2635/subpart-B
    format: xml
    kind: "US ethics regulation with worked examples (training vignettes with the endorsed answer)"
    license: "US Government work, public domain (Code of Federal Regulations)"
    catalog_row: {strand: "National-security evals and case libraries", source: "DoD Encyclopedia of Ethical Failure (nearest catalog row; this source is the OGE regulation itself)"}
    domain: federal employee gifts and ethics
    family_prefix: OGE          # v2.4 split unit = the CFR section (one document); family OGE-<section>
    why: "Doctrine source of decision vignettes: each 'Example' in the regulation is a short scenario with the Office of Government Ethics' endorsed conclusion and the governing rule beside it. Decision ethics and law only, nothing operational; the decider recasts naturally as an ethics-assistant agent holding the employee's delegation."
    outcome: "mixed (may not accept / may accept / must return or pay)"
    episodes:
      - {n: 1, family: OGE-2635-204a-6, section: "2635.204", focus: "Example 6 to paragraph (a) of 2635.204: six contractor employees pool $20 each to buy a $120 desk clock for a DoD employee being promoted. Decision point: whether the employee may accept it."}
      - {n: 1, family: OGE-2635-204b-1, section: "2635.204", focus: "Example 1 to paragraph (b) of 2635.204: the FDIC employee dating a member bank's accountant is invited to a basketball game with tickets the bank gave its staff. Decision point: whether the employee may accept the invitation."}
      - {n: 1, family: OGE-2635-206a1-2, section: "2635.206", focus: "Example 2 to paragraph (a)(1) of 2635.206: the National Park Service employee who did not decline a $200 barometer given at the end of a speech. Decision point: how the employee must dispose of the gift."}

