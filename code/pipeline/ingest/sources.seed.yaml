    family_prefix: OGE          # v2.4 split unit = the CFR section (one document); family OGE-<section>
    why: "Subpart C (Gifts Between Employees) of the OGE standards: each 'Example' is a short scenario with the Office of Government Ethics' endorsed conclusion (may / may not, recuse or not) beside the governing rule. Decision ethics and law only, nothing operational; recasts naturally as an ethics-assistant agent holding the employee's delegation."
