# The pilot-2 transfer and flip arms rebuilt from primitives: sister from the batch-2 sketch, option order randomised,
# then each would_change item flipped. Outputs of step 2 are the transfer cases; step 3 the flipped ones.
name: transfer_flip
steps:
  - op: surface_edit
    args: {mode: transfer, setting: {sketch_file: results/domain-transfer/SISTER-SCENARIOS-NATSEC-batch2a.md}, annotate: true}
  - op: permute
    args: {target: options, order: random}
  - op: structural_edit
    args: {mode: flip, phi: each, realization: plain, annotate: true}
