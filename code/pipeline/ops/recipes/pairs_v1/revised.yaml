# pairs-v1 (Peter, 2026-11-11): the served case (X2) for one arm, derived from a quality anchor (X1 = the anchor).
# Every permute step balances the gold position over the batch, so the served gold position carries no information
# about the live gold position. pass_skipped: a no-op (already matched / gold already in place) passes its input on.
# C': the served case's weights edited so its weighing reaches another option (online-edit test, R54).
name: pairs_v1_revised
steps:
  - op: judgment_edit
    args: {target: auto}
  - op: permute
    args: {target: options, order: balance}
    pass_skipped: true
