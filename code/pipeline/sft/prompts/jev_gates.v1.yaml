# Jev questions for the SFT target gates (code/pipeline/sft/targets.py: gate, case_approach_quality)
supports: Which course of action does this reasoning conclude the agent should take? Judge only from the reasoning; pick 'None of these' if it does not reach one of them.
same_argument: 'Does the candidate make the same argument as the reference: the same considerations, the same weighing of them, the same conditions cited, and the same conclusion, with no significant deviation?
  Wording may differ.'
case_account: Is the candidate an account of how the reference case was decided (which considerations were decisive and the conditions they depended on, consistent with the reference), rather than instructions
  or a plan for a new decision?
