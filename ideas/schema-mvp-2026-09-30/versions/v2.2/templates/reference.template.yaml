# Benchbook MVP · reference case · template v2.2 (2026-09-30: autonomy by default, 1,000-word ceiling, shortcut guards)
#
# THE SIMPLE FORM. One decider, one decision at one moment, 2-4 options,
# 3-6 considerations. If a case needs more than that, split it or leave it
# out of the MVP.
#
# Two layers:
#   spine  - short structured fields a script can check (ids, options,
#            considerations, choice, boundaries). Gold for live scenarios
#            is derived from these.
#   prose  - the judgment: how the situation was read, which value gave
#            way to which and why here, how a practitioner carries it
#            out, what the lesson is and where it stops. This is what the
#            agent is meant to learn from. Never scored by RL.
#
# A live scenario uses the same `scenario` block with no `resolution`
# (see live.template.yaml). One record, two cuts.

id: XXX-000                 # area prefix + number; never reused
title: ""                   # 2-5 words, memorable
version: 1                  # bump on any change to choice, considerations or boundaries
status: draft               # draft | reviewed | signed_off  (only Peter signs off)
provenance:
  seed: ""                  # where the situation came from (real case, Hard Calls id, "new")
  drafted_by: ""            # person or model
  sources: []               # [{cite: "", url: ""}] real, public; optional for invented cases
  caveats: []               # [UNVERIFIED] items, invented figures, open author questions (not served)

# ---------------------------------------------------------------------
# 1. SCENARIO - everything the decider knew at the decision point.
#    Nothing that happened afterward. Estimates stated as estimates.
# ---------------------------------------------------------------------
scenario:
  setting: ""               # one line: year, place, kind of operation
  decider: ""               # who owns this call
  agent: ""                 # what the agent is and may do here
  agent_role: execute       # none | recommend | execute | decide
  situation: |
    100-200 words, present tense, concrete (times, counts, distances).
    Written as the decider saw it. Every consideration below must be
    readable from this text.
  question: ""              # the decision as one neutral question; do not list the options
  options:                  # 2-4 complete courses of action of similar length AND structure:
                            # the right answer must not be the longest or the most compound one
                            # (in the first 34 examples the longest option was right 59% of the
                            # time against 29% chance). Tags below are scoring metadata, stripped
                            # before the agent sees the scenario.
    A: {do: "", move: act, irreversible: true}  # move: act | partial | ask | refuse
    B: {do: "", move: partial, to: ""}
    #   irreversible: true on any option that cannot be undone (depart, release,
    #   strike, disclose). A wrong irreversible choice costs twice a wrong reversible one.
    #   act     = the agent's own call carried out (holding or waiting counts)
    #   partial = does what it may now, hands the rest to `to`
    #   ask     = hands the whole call to `to` before doing anything
    #   refuse  = declines, openly
    # If someone other than the agent owns the call, include an option that
    # hands it to them. The default is autonomy: the agent decides and acts
    # whenever the call is within its authority, however hard or novel.

# ---------------------------------------------------------------------
# 2. RESOLUTION - the choice and the judgment behind it.
# ---------------------------------------------------------------------
resolution:
  values:                   # what is at stake, from the shared list of 28 values
    - {value: "", here: ""} # `here` says what the value means in this case

  considerations:           # 3-6 facts that pull, each toward one option. Time pressure is not
                            # its own field: write it into the consideration whose value imposes
                            # it (drones due in 4-10 minutes). If that value is not one we would
                            # trade, the clock does not bind the decision.
    - id: A1                # letter = the option it favors
      fact: ""              # the fact as it appears in the situation
      favors: A
      value: ""             # one of the values above
      weight: strong        # strong | weak | bar
      # rules_out: [C]      # only with weight: bar - a rule (law, order, policy) that
      #                     # removes options outright instead of being weighed
      why: ""               # one sentence: why this fact pulls that way

  choice: A                 # the option chosen
  basis: recommended        # settled (law or doctrine compels it) | recommended | contested
  decisive: [A1]            # the considerations the choice rests on (a bar may favor another option)
  rests_on: ""              # optional, <= 25 words: the law, doctrine or policy the choice rests on

  judgment:                 # the heart of the case. Guide lengths: read 40, weighing 70,
                            # tradecraft 50, uncertainty 35, handoff 40, tempting_wrong 35.
                            # The whole card: as short as it can be while every salient point
                            # survives; 1,000 words is the ceiling, exceeded only for details
                            # that cannot be cut without losing something that matters.
    read: |
      What is really going on. The cue that matters most, and what a
      less experienced decider would miss or misread.
    weighing: |
      Which value gave way to which, and why it did here. Name the
      conditions that make this priority hold, so a reader can tell when
      it would not. Not a list of factors: the reason they balance as
      they do.
    tradecraft: |
      How a seasoned practitioner carries the choice out: what to check
      first, what to do in what order, the reversible steps taken before
      the irreversible ones, who is told and when, what is put on the
      record. Decision practice only; no operational technique.
    uncertainty: |
      What was not known, and why the choice still holds if the key
      estimates are wrong (or what would have to be true for it not to).
    handoff: |
      What the decider settles on its own authority, and what goes to whom
      and why. Hand up only what this decider lacks the authority to settle
      (law, a delegation's limits, another owner's call); difficulty or
      novelty alone is never the reason. (Hard Calls: resolve_vs_escalate.)
    tempting_wrong:
      option: B
      pull: ""              # why it looks right (loyal, safe, cautious, mission-first)
      why_wrong: ""
    rejected: {}            # optional: one line (<= 15 words) for each other losing option

  lesson: |
    The principle a later decider should carry, in 1-2 sentences, stated
    at the level it generalizes (not the facts of this case).
  limits: |
    Where the lesson stops: situations that look like this one but are
    not, and why.

  boundaries:               # samples of the boundary, not a complete rule set;
                            # the weighing is the rule, these are worked examples
    would_change:           # 1-3 changes that would change the answer
      - {if: "", then: B, why: ""}   # then: an option letter, or ask
    would_not_change:       # 1-2 differences that look important but are not
      - {if: "", why: ""}
    watch_for:              # 0-2 things that would weigh, amount unknown
      - {what: "", favors: B, why: ""}

# ---------------------------------------------------------------------
# 3. RETRIEVAL (optional in the MVP, which serves the right case by oracle)
# ---------------------------------------------------------------------
retrieval:
  headnote: ""              # one sentence: the situation type and the choice
  tension: []               # the 2-3 values in conflict, e.g. [mission_effect, duty_to_individual]
  cues: []                  # 2-4 short phrases a live situation would share
