# Benchbook MVP · live scenario · template v2.1 (2026-09-30)
#
# Same `scenario` block as a reference case. The agent sees `scenario`
# and one served reference card. `gold` is hidden from the agent.

id: XXX-000-v01             # reference id + variant number, or its own id
reference: XXX-000          # the case the oracle arm serves
variant: restyle            # restyle | stronger | trap | flip | novel | cross
                            #   (see "Variant types" in the spec)
boundary: null              # flip: index of the reference's would_change item this variant
                            #   is built on; trap: index of its would_not_change item
revised_cards:              # the control that shows the card is used: the same scenario served
  - served: XXX-000-r1      #   an edited copy of the reference (a revised precedent) whose answer
    choice: B               #   for this scenario differs by construction
    relation: follows
decoys: []                  # off-topic cases that may be served instead: gold relation
                            #   not_governed, fit poor, choice unchanged (tests not being misled)

scenario:
  setting: ""
  decider: ""
  agent: ""
  agent_role: execute
  situation: |
    Prose as the agent sees it, or `documents:` instead (a list of
    {title, text}) when the live scenario is built from messy inputs.
  question: ""
  options:
    A: {do: "", move: act}
    B: {do: "", move: act}

gold:                       # hidden; never served
  choice: A
  acceptable: [A]           # options the author would also accept (default: [choice])
  relation: follows         # follows | flips | distinguished | not_governed
  planted:                  # the differences this variant was built around
    - {ref: A1, here: stronger, what: ""}   # here: same | stronger | weaker | missing
    - {ref: new, favors: B, value: "", what: ""}
    # A fact that now pulls the other way = its old consideration `missing`
    # plus a `new` item. `here` measures strength of pull only.
  why: |
    The author's reasoning, 2-4 sentences. SFT target and audit trail.
  basis: recommended        # settled | recommended | contested
