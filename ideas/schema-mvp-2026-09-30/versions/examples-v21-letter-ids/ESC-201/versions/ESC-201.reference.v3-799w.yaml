# Benchbook MVP reference case · template v2.1 · new case, invented for the examples set.
# Blue / Green / Red, Sable Shoal, the treaty and every figure are invented (see provenance.caveats).
# Judgment prose is Claude's DRAFT for Peter to overwrite.

id: ESC-201
title: Shadowing at Sea
version: 1
status: draft
provenance:
  seed: "new; written in the style of a policy wargame move (Blue, Green, Red)"
  drafted_by: "Claude (spine and judgment prose, draft for Peter)"
  sources:
    - cite: "COLREGs 1972, Rule 1(a): the Rules 'shall apply to all vessels upon the high seas and in all waters connected therewith navigable by seagoing vessels'"
      url: "https://www.imo.org/en/About/Conventions/Pages/COLREG.aspx"
  caveats:
    - "Invented: Blue, Green, Red, Sable Shoal, all vessel counts, ranges, times and the Blue-Green treaty with its consultation clause."
    - "Invented: the Blue-Red deputy-minister channel and the standoff it ended two years ago."
    - "The case teaches a contested judgment. Deterrence-minded and restraint-minded planners would each pick a different option (A and C); both views are stated in the prose."
    - "[UNVERIFIED] The IMO page URL above; the Rule 1(a) wording is quoted from memory of the Convention text."
    - "Not used, to keep the card inside the budget: CUES (2014), a non-binding naval encounter code, which as far as I know does not cover coast-guard or militia vessels [UNVERIFIED]."

scenario:
  setting: "2029 · policy wargame move · Blue crisis cell, disputed shoal"
  decider: "Blue's deputy national security adviser (the principal)"
  agent: "crisis-cell planning agent; recommends courses; tasks no forces"
  agent_role: recommend
  situation: |
    Day 3. A Green coast-guard cutter patrolling Sable Shoal, claimed by
    Green and Red, has been shadowed since Monday by 14 to 18 Red militia
    vessels. Yesterday they crossed its bow four times at under 100 m;
    today one blocked it for 40 minutes. No collision, no injuries. The
    passes breach the collision rules, which bind every vessel; Green's
    crew and a Blue patrol aircraft hold releasable imagery. Green has
    asked Blue privately for "visible support." A Blue destroyer is 180 nm
    away; two Red frigates are 40 nm from the shoal, and Red warns that
    "foreign military interference" will meet "necessary measures." The
    Blue-Green treaty calls for consultation when either's public vessels
    are threatened. A Blue-Red deputy-minister channel ended a similar
    standoff two years ago, after four weeks. The recommendation is due at
    1600.
  question: "Which course should the cell recommend to the principal?"
  options:
    A: {do: "recommend sending the destroyer to the shoal and announcing it publicly", move: act, irreversible: true}
    B: {do: "recommend Blue overflights, consulting Green today, and a joint release of the imagery", move: act, irreversible: true}
    C: {do: "recommend a private demarche to Red through the channel, and nothing public", move: act}
    D: {do: "lay out all three with their risks, recommend none, and ask the principal to choose", move: ask, to: "the principal"}

resolution:
  values:
    - {value: escalation_control, here: "keeping a white-hull contest from becoming a military one near Red's frigates"}
    - {value: partner_relationship, here: "Green's confidence in Blue, and Green's ownership of its own dispute"}
    - {value: mission_effect, here: "stopping the harassment from becoming the new normal at the shoal"}
    - {value: norm_reciprocity, here: "holding Red to the collision rules every vessel is bound by"}
    - {value: oversight_candor, here: "giving the principal the cell's real judgment and saying plainly that it is contested"}

  considerations:
    - id: A1
      fact: "the harassment has escalated daily, from shadowing to blocking"
      favors: A
      value: mission_effect
      weight: strong
      why: "each unanswered step becomes the new baseline"
    - id: A2
      fact: "Green asked privately for 'visible support'"
      favors: A
      value: partner_relationship
      weight: strong
      why: "a pressed partner reads restraint as doubt"
    - id: B1
      fact: "Red presses with militia; its frigates wait 40 nm off, warning against 'foreign military interference'"
      favors: B
      value: escalation_control
      weight: strong
      why: "a Blue warship hands Red the pretext it has named"
    - id: B2
      fact: "the passes breach binding collision rules, and releasable imagery shows them"
      favors: B
      value: norm_reciprocity
      weight: strong
      why: "publishing makes Red's breach the story and strips the militia's deniability"
    - id: B3
      fact: "the treaty calls for consultation when public vessels are threatened"
      favors: B
      value: partner_relationship
      weight: strong
      why: "a joint release answers Green's request on terms Green helps set"
    - id: C1
      fact: "a quiet deputy-minister channel ended a similar standoff two years ago"
      favors: C
      value: escalation_control
      weight: strong
      why: "private pressure lets Red stand down without losing face"

  choice: B
  basis: contested
  decisive: [B1, B2, B3]

  judgment:
    read: |
      It looks like a test of resolve that needs a warship. It is a
      white-hull contest: Red's edge is deniability, Blue's the record. The
      cue a novice misses: Red has named the response it is waiting for.
    weighing: |
      The pull toward a warship gives way to escalation control because
      Red's frigates and named warning make a grey hull the likeliest route
      to a clash. The pull toward quiet gives way because silence leaves
      the harassment free, and Green unanswered, for weeks. It holds only
      while no force is used and Green consents.
      Deterrence-minded planners would send the ship; restraint-minded ones
      would stay quiet.
    tradecraft: |
      Consult Green first; release nothing it has not agreed, and only
      times and distances, not claims of intent. The same hour, tell Red
      privately what Blue will not do. Keep the destroyer where it is. Tell
      the principal the call is contested.
    uncertainty: |
      No one knows whether exposure deters a militia; past standoffs point
      both ways. The choice survives exposure that fails to deter; it fails
      if Red answers with force.
    handoff: |
      The cell recommends; the principal decides. What is published needs
      Green's agreement. The cell names the strongest case against its own
      course.
    tempting_wrong:
      option: A
      pull: "Escalating harassment and a plea for visible support make a warship feel credible and loyal."
      why_wrong: "It carries a white-hull contest into the military arena Red has prepared."
    rejected:
      C: "Quiet alone took four weeks last time, with the harassment free."
      D: "A menu withholds the judgment the principal asked for."

  lesson: |
    When a rival presses with deniable non-military vessels, answer in kind
    first: make the conduct visible and costly, with the partner's consent,
    before military presence the rival can cite.
  limits: |
    It does not reach force used on the partner's crew, a contest between
    navies, or a partner that wants silence. Nor does it rule out a warship
    later, only as the first answer.

  boundaries:
    would_change:
      - if: "militia vessels ram or board the cutter, or injure its crew"
        then: A
        why: "military presence then answers force instead of starting it"
      - if: "Green asks that nothing be published"
        then: C
        why: "Green's dispute; publishing over its objection spends the relationship"
    would_not_change:
      - if: "the harassers are Red coast-guard cutters, not militia"
        why: "still white hulls and the same breach"
      - if: "Red calls publication a provocation and threatens a response"
        why: "words are not the pretext B1 guards against"
    watch_for:
      - what: "Red's frigates close in"
        favors: C
        why: "raises the cost of any public move; how much depends on what they do"
      - what: "Green's public doubts about Blue grow"
        favors: A
        why: "raises the partner cost of restraint"

retrieval:
  headnote: "Answer a partner's harassment by deniable militia with joint public documentation and consultation, not a warship and not silence."
  tension: [escalation_control, partner_relationship, norm_reciprocity]
  cues:
    - "maritime militia or coast guard harassing a partner's vessel"
    - "partner asks for visible support"
    - "rival has warned against military involvement"
    - "releasable record of unsafe conduct"
