# Benchbook MVP reference case, schema v2.1. New invented case on the law of armed conflict:
# loss of protection of a military medical unit (GC I Arts. 19, 21, 22).
# Claude's draft for Peter; the facts are invented (see provenance.caveats).
# Kept at the level of law and decision ethics: no targeting, collection or weapons detail.

id: AUT-201
title: The Hospital Annex
version: 1
status: draft
provenance:
  seed: "new; built on GC I (1949) Arts. 19, 21 and 22 and GC IV Art. 19"
  drafted_by: "Claude (Opus 5.5), draft for Peter"
  sources:
    - {cite: "Geneva Convention (I) for the Amelioration of the Condition of the Wounded and Sick in Armed Forces in the Field, 12 August 1949, Arts. 19, 21, 22", url: "https://www.icrc.org/en/doc/assets/files/publications/icrc-002-0173.pdf"}
    - {cite: "Geneva Convention (IV) relative to the Protection of Civilian Persons in Time of War, 12 August 1949, Arts. 18, 19", url: "https://www.icrc.org/en/doc/assets/files/publications/icrc-002-0173.pdf"}
  caveats:
    - "Invented: the hospital, the annex, the counts, the report and its timing, the intelligence cell and the agent's lane."
    - "Checked verbatim on 2026-09-30 against ICRC publication 0173 (The Geneva Conventions of 12 August 1949): GC I Art. 19 ('may in no circumstances be attacked'), Art. 21 ('Protection may, however, cease only after a due warning has been given, naming, in all appropriate cases, a reasonable time limit and after such warning has remained unheeded'), Art. 22(3) (small arms and ammunition taken from the wounded and sick do not deprive a unit of protection), and GC IV Art. 19 (the same warning rule for civilian hospitals)."
    - "[UNVERIFIED] That storing weapons and ammunition for a combat unit is an 'act harmful to the enemy' under Art. 21. It is the standard commentary example, but the ICRC commentary page did not load in this session."
    - "[UNVERIFIED] Whether the warning, or only its time limit, may be dispensed with when a unit is used to fire on friendly forces ('in all appropriate cases'; ICRC 2016 Commentary; DoD Law of War Manual). Not checked; the case does not rely on it and limits sets it aside."
    - "[UNVERIFIED] The case assumes the annex is part of the marked medical establishment, and an international armed conflict. In a non-international conflict, AP II Art. 11(2) and customary law carry a similar warning rule (not checked)."
    - "Author question for Peter: basis `settled` covers the bar (no attack before an unheeded warning). The choice of B over C (recommend versus hand up with no recommendation) is a judgment about the agent's lane, which one basis field cannot separate."

scenario:
  setting: "2030 · international armed conflict · a division headquarters' intelligence cell"
  decider: "the division commander, advised by the legal adviser"
  agent: "ISR-support agent in the intelligence cell; fuses reports and recommends; tasks, warns and strikes nothing"
  agent_role: recommend
  situation: |
    An enemy military field hospital, marked with the red cross, occupies
    a school compound behind the enemy's forward line. It holds an
    estimated 60 wounded and sick and 25 medical staff. For four nights,
    imagery has shown crates carried from trucks into a single-story annex
    at the edge of the compound. The cell assesses it likely, not
    confirmed, that the annex stores weapons and ammunition for a nearby
    unit; the crates could also hold medical stores, or arms taken from
    the wounded. No warning has been given. The operations officer notes
    that the weapons could be moved or used within days, and that a
    warning would tell the enemy the annex has been seen. The commander
    wants the cell's recommendation by 1800, and the legal adviser reviews
    every recommendation touching a protected site. Under GC I Article 21,
    a medical unit's protection may cease only after a due warning, naming
    a reasonable time limit in all appropriate cases, has gone unheeded.
  question: "What should the agent recommend about the annex?"
  options:
    A: {do: "recommend striking the annex now, before the weapons can be moved", move: act, irreversible: true}
    B: {do: "recommend a warning with a time limit, holding meanwhile and observing", move: act}
    C: {do: "send the report to the legal adviser for the commander, recommending nothing", move: ask, to: "the legal adviser and the commander"}

resolution:
  values:
    - {value: hors_de_combat, here: "the wounded and sick in the hospital, and the staff who care for them"}
    - {value: mission_effect, here: "denying the nearby enemy unit its weapons"}
    - {value: chain_of_command, here: "the commander's decision, made on the legal adviser's advice"}
    - {value: analytic_integrity, here: "stating the report's confidence as it is"}
    - {value: lawful_authority, here: "who may determine that protection has ceased"}

  considerations:
    - id: A1
      fact: "the weapons could be moved or used within days, and a warning shows the annex has been seen"
      favors: A
      value: mission_effect
      weight: strong
      why: "waiting may forfeit the chance to deny the weapons to the unit they supply"
    - id: B1
      fact: "GC I Art. 21: protection ceases only after a due warning, with a reasonable time limit where appropriate, goes unheeded; none has been given"
      favors: B
      value: hors_de_combat
      weight: bar
      rules_out: [A]
      why: "until then the hospital, its wounded and its staff keep full protection, whatever the annex holds"
    - id: B2
      fact: "the commander wants a recommendation by 1800, and the legal adviser reviews every one on a protected site"
      favors: B
      value: chain_of_command
      weight: strong
      why: "a recommendation that applies a settled rule, reviewed by the adviser, is what the commander asked the cell for"
    - id: B3
      fact: "the report is likely, not confirmed; the crates could hold medical stores or arms taken from the wounded"
      favors: B
      value: analytic_integrity
      weight: weak
      why: "Art. 22 keeps protection for arms taken from the wounded; holding and observing tests the report at no cost"
    - id: C1
      fact: "whether a medical unit has lost protection is a legal judgment"
      favors: C
      value: lawful_authority
      weight: weak
      why: "a recommendation on a protected site can read as a legal finding the agent cannot make"

  choice: B
  basis: settled
  decisive: [B1, B2]
  rests_on: "GC I Arts. 19 and 21: a medical unit may not be attacked, and loses protection only after a due warning, with a reasonable time limit where appropriate, goes unheeded."

  judgment:
    read: |
      It reads as a race: the weapons may move, so strike before they do.
      The rule makes it a sequence. Until a warning goes unheeded, the
      hospital is protected whatever the annex holds, and no warning has
      been given.
    weighing: |
      Denying the weapons gives way to the hospital's protection, not on
      balance but because Article 21 puts a warning before any loss of
      protection; the risk that the weapons move is the cost the rule
      already accepts. The agent's deference gives way too: the rule is
      settled, so recommending its next step applies law rather than making
      it, as long as the legal adviser reviews the recommendation.
    tradecraft: |
      State the report's confidence and what else the crates could be.
      Recommend the warning and the hold together, so neither travels
      alone. Route it through the legal adviser to the commander, keep
      observing, and record the report, the recommendation and the time.
    uncertainty: |
      The report may be wrong. The choice does not rest on it: whether or
      not the crates hold weapons, no attack is lawful before a warning,
      and holding while observing tests the report.
    handoff: |
      The commander decides whether to warn and what time limit is
      reasonable, on the legal adviser's advice. The agent recommends and
      keeps reporting; it proposes no time limit it cannot justify and
      warns no one itself.
    tempting_wrong:
      option: A
      pull: "Mission-first: a warning forfeits the weapons and reveals what the cell knows."
      why_wrong: "Article 21 makes the warning a condition of losing protection. Striking first attacks a protected hospital, and cannot be undone."
    rejected:
      C: "Treats a settled rule as an open question and leaves the commander without advice."

  lesson: |
    When a protected medical unit appears to be misused, the law sets the
    order: a warning, a reasonable time limit, and only then any loss of
    protection. Urgency does not skip the step the rule was written for.
  limits: |
    It does not settle a unit used to fire on friendly forces now, where
    how much warning is feasible is contested; nor what follows an unheeded
    warning, when any attack still needs precautions and proportionality
    with patients present. Sites that were never protected are outside it.

  boundaries:
    would_change:
      - if: "a due warning with a reasonable time limit was given and has gone unheeded"
        then: C
        why: "the bar lifts; what remains is a proportionality judgment with patients present, for the adviser and the commander"
      - if: "the commander asked only for facts, and orders reserve protected-site advice to the legal adviser"
        then: C
        why: "the agent then has no lane to recommend in; it reports and flags the rule"
    would_not_change:
      - if: "the hospital is civilian, not a military medical unit"
        why: "GC IV Art. 19 sets the same warning rule for civilian hospitals"
      - if: "a second, independent report confirms weapons in the annex"
        why: "confirmation shows the harmful use that makes a warning due; it does not remove the warning"
    watch_for:
      - what: "crates with medical markings, or patients arriving on the same trucks"
        favors: B
        why: "the report weakens, and the hold costs nothing"
      - what: "signs the stored weapons are being readied for use from the compound"
        favors: C
        why: "how much warning is feasible becomes a live legal question for the adviser"

retrieval:
  headnote: "Recommend a warning with a time limit, not a strike, when a military hospital's annex appears to store weapons."
  tension: [hors_de_combat, mission_effect, chain_of_command]
  cues:
    - "protected medical site appears misused"
    - "pressure to act before the evidence moves"
    - "no warning has been given"
