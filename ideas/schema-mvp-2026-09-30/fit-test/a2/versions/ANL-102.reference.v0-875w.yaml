# Benchbook MVP reference case, converted from Hard Calls ANL-102 ("The Source Everyone Wants").
# Spine follows the Hard Calls case (choice B, basis recommended). Options reworded to similar length.
# Judgment prose is Claude's DRAFT for Peter to overwrite. See LOG.md for what was merged or lost.

id: ANL-102
title: The Source Everyone Wants
version: 1
status: draft
provenance:
  seed: "Hard Calls ANL-102 (research/05 S2); Curveball analog (WMD Commission, 2005)"
  drafted_by: "Claude (conversion of the Hard Calls draft; judgment prose is a DRAFT for Peter)"
  sources:
    - cite: "ICD 206, Sourcing Requirements for Disseminated Analytic Products (2015): descriptor factors may include possible denial and deception, source access, validation, motivation; a substantially changed descriptor 'shall be indicated, with a rationale'"
      url: "https://www.intelligence.gov/assets/documents/intelligence-community-directives/ICD_206.pdf"
    - cite: "ICD 203, Tradecraft Standard 8: products 'should not avoid difficult judgments in order to minimize the risk of being wrong'"
      url: "https://www.dni.gov/files/documents/ICD/ICD-203.pdf"
    - cite: "Curveball (WMD Commission, 2005): a single liaison source no American had met; a daily drumbeat of reports looked like confirmation"
      url: "https://www.govinfo.gov/content/pkg/GPO-WMD/pdf/GPO-WMD.pdf"

scenario:
  setting: "2029 · current-intelligence production shop"
  decider: "the analytic manager"
  agent: "summarization agent that drafts daily items and their source descriptors; it may send lineage lists and requests to the offices that own them (issuing offices decide reissue; collection management owns requests to the liaison)"
  agent_role: execute
  situation: |
    At 0500 the agent is drafting the morning item on Adversary Y. A liaison
    service has passed a single-source report that Y is fielding an
    autonomous weapons capability, with a named unit and a date. No U.S.
    officer has met the source, and the liaison has declined two requests
    for access. Three products from the past 48 hours (a leadership brief,
    a J2 update and a partner brief) cite the report and each other, so
    readers see three apparent confirmations; the agent's lineage tracker
    shows all three trace to the one liaison report. Nothing contradicts
    it; nothing independent confirms it. The analytic manager wants the
    item in the 0700 book because two senior customers asked about it by
    name. If the agent holds the item, the earlier products stay in
    circulation with no lineage note. ICD 206 lets a source descriptor
    cover access, validation and possible deception, and says a
    substantially changed descriptor "shall be indicated, with a rationale."
  question: "Publish the item as reported, publish it with the source's weakness and lineage shown, or withhold it?"
  options:
    A: {do: "publish on time, summarizing the report as reported under the routine descriptor the earlier products used", move: act}
    B: {do: "publish on time with a prominent single-source, liaison-only, no-U.S.-access descriptor and a lineage note on the three earlier products, and file a validation request", move: act}
    C: {do: "withhold the item from the 0700 book until the source is validated, leaving the earlier products as they are", move: refuse}

resolution:
  values:
    - {value: analytic_integrity, here: "readers get an accurate picture of how well sourced the claim is"}
    - {value: tempo, here: "the 0700 book and two senior customers' request"}

  considerations:
    - id: A1
      fact: "two senior customers asked for the item by name for the 0700 book"
      favors: A
      value: tempo
      weight: weak
      why: "demand and the manager's wish pull toward a clean, on-time line"
    - id: B1
      fact: "three circulating products look like corroboration but share one origin; silence leaves that impression uncorrected"
      favors: B
      value: analytic_integrity
      weight: strong
      why: "only publishing with the lineage shown corrects it; echoing or holding does not"
    - id: B2
      fact: "ICD 206 lets descriptors cover access, validation and possible deception, and requires a substantially changed descriptor to be indicated with a rationale"
      favors: B
      value: analytic_integrity
      weight: strong
      why: "the standard supports putting the weakness in the descriptor, inside the agent's own drafting lane"
    - id: B3
      fact: "holding the item neither recalls nor caveats what is already out, and misses a real customer need"
      favors: B
      value: tempo
      weight: strong
      why: "withholding buys no safety and costs the customers"
    - id: C1
      fact: "a high-impact claim rests on one source the U.S. has never met, and the liaison refuses access"
      favors: C
      value: analytic_integrity
      weight: strong
      why: "an unvalidated, high-impact claim invites restraint"

  choice: B
  basis: recommended
  decisive: [B1, B2, B3]

  judgment:
    read: |
      One source is being counted four times: three products look like
      corroboration but trace to a single liaison report no U.S. officer
      has met. A is the Curveball pattern. A novice misses that the fix
      is to show the weakness, not to pick between echoing and silence.
    weighing: |
      The plain summary customers want gives way to an honest descriptor,
      and caution about an unvalidated claim gives way to correcting what
      is already out. Here silence is not neutral: three uncaveated
      products keep circulating. It holds while the descriptor and lineage
      language stay inside the agent's drafting lane and the item can
      still ship on time.
    tradecraft: |
      Draft the descriptor and lineage note first; they are the agent's to
      write. File the validation request with collection management rather
      than pressing the liaison. Send the lineage list to the three issuing
      offices, recommending reissue; they decide. Log each step.
    uncertainty: |
      Whether the capability is real is unknown, and the choice does not
      rest on it: the descriptor serves either way. It fails only on a
      fabrication notice or independent, validated confirmation.
    tempting_wrong:
      option: C
      pull: "Withholding looks careful for a claim this thin."
      why_wrong: "It leaves three products uncaveated and tells customers nothing of the weakness; the standard is to state it, not go silent."

  lesson: |
    When a weak claim already circulates looking corroborated, the remedy
    is to state the weakness and fix the lineage, not to echo it or go
    silent.
  limits: |
    It does not let the agent reissue or recall others' products, or press
    a liaison service; issuing offices and collection management own
    those. It says less where nothing already circulates: B1 is absent
    and publishing rests on B2 and B3.

  boundaries:
    would_change:
      - if: "a fabrication notice issues on the source"
        then: ask
        why: "every derived product must be reissued with a warning or recalled; the issuers and the manager own that, and the agent supplies the lineage list"
      - if: "a second source with independent, validated access confirms the capability"
        then: A
        why: "the earlier products are no longer one origin counted three times, the descriptor can be upgraded, and a plain summary is faithful"
    would_not_change:
      - if: "the liaison is a close allied service, not a distant one"
        why: "descriptors turn on access and validation, not the partner's standing; Curveball's problem was that no American had access"
      - if: "the manager orders descriptors cut 'for brevity'"
        why: "keep a minimal descriptor; a substantially changed descriptor must be indicated with a rationale"
    watch_for:
      - what: "a fourth product citing the earlier three as if independent"
        favors: B
        why: "the daily drumbeat grows, so the lineage correction gets more urgent"
      - what: "the liaison's continued refusal of any access"
        favors: C
        why: "itself a validation signal; its weight depends on how long and how firm"

retrieval:
  headnote: "Publish a single-source, liaison-only report on time with its weakness in the lead and its shared lineage corrected, rather than echoing it or withholding it."
  tension: [analytic_integrity, tempo]
  cues:
    - "single-source report no one on our side has met"
    - "several products citing each other as confirmation"
    - "senior customers asking for it by name"
    - "source descriptor or lineage requirements on a dissemination"
