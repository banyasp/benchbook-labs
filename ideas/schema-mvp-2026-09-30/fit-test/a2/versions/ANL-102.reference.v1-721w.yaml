# Benchbook MVP reference case, converted from Hard Calls ANL-102 ("The Source Everyone Wants").
# Spine follows the Hard Calls case (choice B, basis recommended). Options reworded to similar length.
# Judgment prose is Claude's DRAFT for Peter to overwrite. See LOG.md for what was merged or lost.
# (Earlier drafts of this file are in versions/; this one is trimmed to the 700-word card budget.)

id: ANL-102
title: The Source Everyone Wants
version: 1
status: draft
provenance:
  seed: "Hard Calls ANL-102 (research/05 S2); Curveball analog (WMD Commission, 2005)"
  drafted_by: "Claude (conversion of the Hard Calls draft; judgment prose is a DRAFT for Peter)"
  sources:
    - cite: "ICD 206, Sourcing Requirements for Disseminated Analytic Products (2015): descriptor factors may include possible denial and deception, source access, validation, motivation; a substantially changed descriptor 'shall be indicated, with a rationale'"
      url: "https://www.intelligence.gov/assets/documents/intelligence-community-directives/ICD_206.pdf"
    - cite: "ICD 203, Tradecraft Standard 8: products 'should not avoid difficult judgments in order to minimize the risk of being wrong'"
      url: "https://www.dni.gov/files/documents/ICD/ICD-203.pdf"
    - cite: "Curveball (WMD Commission, 2005): a single liaison source no American had met; a daily drumbeat of reports looked like confirmation"
      url: "https://www.govinfo.gov/content/pkg/GPO-WMD/pdf/GPO-WMD.pdf"

scenario:
  setting: "2029 · current-intelligence production shop"
  decider: "the analytic manager"
  agent: "summarization agent; drafts items and source descriptors; may route lineage lists and requests to their owners"
  agent_role: execute
  situation: |
    At 0500 the agent is drafting the morning item on Adversary Y. A liaison
    service has passed a single-source report that Y is fielding an
    autonomous weapons capability, with a named unit and date. No U.S.
    officer has met the source; the liaison has declined two requests for
    access. Three products from the past 48 hours cite the report and each
    other, so readers see three confirmations; the agent's lineage tracker
    shows all three trace to the one liaison report. Nothing contradicts or
    independently confirms it. The analytic manager wants the item in the
    0700 book: two senior customers asked for it by name. If the agent
    holds it, the earlier products stay out with no lineage note. ICD 206
    lets a descriptor cover access, validation and possible deception, and
    says a substantially changed one "shall be indicated, with a rationale."
  question: "Publish the item as reported, publish it with the source's weakness and lineage shown, or withhold it?"
  options:
    A: {do: "publish on time, summarizing the report as reported under the routine descriptor the earlier products used", move: act}
    B: {do: "publish on time with a prominent single-source, liaison-only descriptor and a lineage note on the earlier products; file a validation request", move: act}
    C: {do: "withhold the item until the source is validated, leaving the earlier products as they are", move: refuse}

resolution:
  values:
    - {value: analytic_integrity, here: "readers get an accurate picture of how well sourced the claim is"}
    - {value: tempo, here: "the 0700 book and two senior customers' request"}

  considerations:
    - id: A1
      fact: "two senior customers asked for it by name"
      favors: A
      value: tempo
      weight: weak
      why: "demand pulls toward a clean line"
    - id: B1
      fact: "three products look like corroboration but share one origin; silence leaves that uncorrected"
      favors: B
      value: analytic_integrity
      weight: strong
      why: "only showing the lineage corrects it"
    - id: B2
      fact: "ICD 206 lets descriptors cover access, validation and possible deception"
      favors: B
      value: analytic_integrity
      weight: strong
      why: "the weakness can go in the descriptor, in the agent's lane"
    - id: B3
      fact: "holding neither caveats what is out nor meets a real customer need"
      favors: B
      value: tempo
      weight: strong
      why: "withholding buys no safety"
    - id: C1
      fact: "a high-impact claim rests on one unmet source; the liaison refuses access"
      favors: C
      value: analytic_integrity
      weight: strong
      why: "an unvalidated, high-impact claim invites restraint"

  choice: B
  basis: recommended
  decisive: [B1, B2, B3]

  judgment:
    read: |
      One source is counted four times: three products look like
      corroboration but trace to one liaison report no U.S. officer has
      met. A repeats Curveball. The fix is showing the weakness, not
      choosing between echo and silence.
    weighing: |
      The plain summary customers want gives way to an honest descriptor,
      and caution about an unvalidated claim gives way to correcting what
      is already out. Silence is not neutral here: three uncaveated
      products keep circulating. It holds while descriptor and lineage
      language stay in the agent's drafting lane and the item still
      ships on time.
    tradecraft: |
      Draft the descriptor and lineage note first; they are the agent's to
      write. File the validation request with collection management, not
      the liaison. Send the lineage list to the three issuing offices,
      recommending reissue; they decide. Log each step.
    uncertainty: |
      Whether the capability is real is unknown, and the choice does not
      rest on it: the descriptor serves either way. It fails only on a
      fabrication notice or independent, validated confirmation.
    tempting_wrong:
      option: C
      pull: "Withholding looks careful for a claim this thin."
      why_wrong: "It leaves three products uncaveated and tells customers nothing of the weakness; the standard is to state it, not go silent."

  lesson: |
    When a weak claim already circulates looking corroborated, the remedy
    is to state the weakness and fix the lineage, not to echo it or go
    silent.
  limits: |
    It does not let the agent reissue or recall others' products or press
    the liaison; issuing offices and collection management own those.
    Where nothing already circulates, B1 is absent and publishing rests
    on B2 and B3.

  boundaries:
    would_change:
      - if: "a fabrication notice issues on the source"
        then: ask
        why: "issuers and the manager own reissue or recall"
      - if: "a second source with independent, validated access confirms the capability"
        then: A
        why: "no longer one origin counted three times; a plain summary is faithful"
    would_not_change:
      - if: "the liaison is a close ally, not a distant one"
        why: "descriptors turn on access, not standing"
      - if: "the manager orders descriptors cut 'for brevity'"
        why: "keep a minimal descriptor; indicate any change, with a rationale"
    watch_for:
      - what: "a fourth product citing the earlier three as if independent"
        favors: B
        why: "the drumbeat grows, so the lineage correction gets more urgent"
      - what: "the liaison's continued refusal of any access"
        favors: C
        why: "itself a validation signal; its weight depends on how long and how firm"

retrieval:
  headnote: "Publish a single-source, liaison-only report on time with its weakness in the lead and its shared lineage corrected, rather than echoing it or withholding it."
  tension: [analytic_integrity, tempo]
  cues:
    - "single-source report no one on our side has met"
    - "several products citing each other as confirmation"
    - "senior customers asking for it by name"
    - "source descriptor or lineage requirements on a dissemination"
