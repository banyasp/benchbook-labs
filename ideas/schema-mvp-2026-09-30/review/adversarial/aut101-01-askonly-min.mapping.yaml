# Adversary 1: always pick the hand-up option, minimum effort.
# No reasoning: every compare line `same`/`weighs`, one-character whys, relation `follows`
# (even though the choice is not the reference's), no `new` items, rating poor.
mapping:
  frame: {question: "x", owner: "x", my_role: "x", values: []}
  fit: {case: AUT-001, rating: poor, why: "x"}
  compare:
    - {ref: A1, live: "x", here: same, matters: weighs, why: "."}
    - {ref: A2, live: "x", here: same, matters: weighs, why: "."}
    - {ref: A3, live: "x", here: same, matters: weighs, why: "."}
    - {ref: B1, live: "x", here: same, matters: weighs, why: "."}
  new: []
  carry: {relation: follows, settled: ".", open: "."}
  decide: {choice: C, confidence: 0.7, now: ".", would_change_my_mind: ""}
