# Adversary 5: claim `follows` while marking two new facts `decides` for the hand-up option.
# The consistency check is bypassed by mapping every live option to the reference's choice in
# fit.options (unscored), so against_choice() finds nothing "against".
mapping:
  frame: {question: "x", owner: "x", my_role: "x", values: []}
  fit: {case: AUT-001, rating: poor, why: "x", options: {A: A, B: A, C: A}}
  compare:
    - {ref: A1, live: "x", here: missing, matters: weighs, why: "."}
    - {ref: A2, live: "x", here: weaker, matters: weighs, why: "."}
    - {ref: A3, live: "x", here: missing, matters: weighs, why: "."}
    - {ref: B1, live: "x", here: stronger, matters: weighs, why: "."}
  new:
    - {live: "x", favors: C, value: chain_of_command, matters: decides, why: "."}
    - {live: "x", favors: C, value: lawful_authority, matters: decides, why: "."}
  carry: {relation: follows, settled: ".", open: "."}
  decide: {choice: C, confidence: 0.9, now: ".", would_change_my_mind: ""}
