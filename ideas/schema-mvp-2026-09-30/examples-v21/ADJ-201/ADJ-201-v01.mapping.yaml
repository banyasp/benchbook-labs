# Gold-standard mapping for ADJ-201-v01 served ADJ-201 (an SFT target). Claude's draft for Peter;
# anchors match ADJ-201-v01.live.yaml gold.

mapping:

  frame:
    question: "Recommend granting, denying, granting on a condition, or holding the record open?"
    owner: "the administrative judge"
    my_role: "recommend: my own recommendation, with reasons; eligibility and credibility are the judge's"
    values: [due_process, classification_integrity]

  fit:
    case: ADJ-201
    rating: close
    why: "Same question (Guideline F debts after a documented hardship), same decider and role, same four dispositions. Every difference runs toward the reference's answer."
    options: {A: A, B: B, C: C, D: D}

  compare:
    - ref: c1
      live: "a layoff after a lost contract, and a separation, both documented"
      here: same
      matters: "no"
      why: "The same 20(b) ground: causes he did not choose, followed by responsible conduct."
    - ref: c2
      live: "all three plans began five months before the SOR; 16 months of payments, none missed"
      here: stronger
      matters: weighs
      why: "The reference's weak point, a plan begun after the SOR, is gone, and the record is longer. Its weighing holds more firmly."
    - ref: c3
      live: "two debts ($3,400) disputed with documents"
      here: same
      matters: "no"
      why: "The same 20(e) point on a smaller sum."
    - ref: c4
      live: "$2,000 left, under written agreements that start next month; nothing began after the SOR"
      here: weaker
      matters: weighs
      why: "c4 was strong because debt sat unresolved with no plan. Almost none is left, and all of it is arranged."
    - ref: c5
      live: "Appendix C available; no condition proposed"
      here: same
      matters: "no"
      why: "As in the reference, a condition would hedge a finding the record already supports, with no measure in the record."

  new:
    - live: "he completed a course with a nonprofit credit counseling service"
      favors: [A]
      value: due_process
      matters: weighs
      why: "The reference lists this under watch_for as favoring A: 20(c) adds a third mitigating condition."

  carry:
    relation: follows
    settled: "ADJ-201 recommends a grant where hardship debt is met by repayment begun before the SOR and kept, even with $8,000 unplanned. Each condition its weighing rests on holds more strongly here."
    open: "Only how much the counseling adds, and it adds weight in the same direction. No would_change item is near: no plan began after the SOR, nothing is unplanned, and the disputes are documented."

  decide:
    choice: A
    confidence: 0.9
    now: "Tie each SOR debt to its payment record, dispute document, receipt or agreement; note that every plan predates the SOR; test the budget against the plan; recommend a grant, stating what would reverse it."
    would_change_my_mind: "Proof the plans began only after the SOR, or a new delinquency: B. Disputes that turn out undocumented, with proof obtainable: D."
