# Benchbook MVP reference case, schema v2.1. New invented case in the style of a DOHA
# industrial security clearance (ISCR) hearing decision under SEAD 4 Guideline F.
# Claude's draft for Peter; the facts are invented (see provenance.caveats).

id: ADJ-201
title: Clearance With Debts
version: 1
status: draft
provenance:
  seed: "new; modeled on DOHA ISCR hearing decisions under SEAD 4 Guideline F (financial considerations)"
  drafted_by: "Claude (Opus 5.5), draft for Peter"
  sources:
    - {cite: "Security Executive Agent Directive 4, National Security Adjudicative Guidelines (2017), Guideline F, paras 18-20; Appendix C", url: ""}
    - {cite: "DoD Directive 5220.6, Defense Industrial Personnel Security Clearance Review Program", url: ""}
    - {cite: "Department of the Navy v. Egan, 484 U.S. 518 (1988)", url: ""}
    - {cite: "ISCR Case No. 22-02575 (App. Bd. Nov. 24, 2025), on Appendix C conditional eligibility", url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/DOHA-Appeal-Board/2025-DOHA-Appeal-Board-Decisions/FileId/243064/"}
  caveats:
    - "Invented: the applicant, his debts, amounts, dates, budget and hardship, and the adjudication-support agent. DOHA has no such agent; judges write their own decisions."
    - "[UNVERIFIED] SEAD 4 Guideline F paras 20(b), (c), (d), (e) and (g) are paraphrased from memory; the wording was not re-checked in this session."
    - "[UNVERIFIED] Para 2(b) (any doubt resolved in favor of national security) and the whole-person factors at para 2(d): paragraph numbers from memory."
    - "[UNVERIFIED] Appendix C: ISCR 22-02575 (App. Bd. Nov. 24, 2025), as summarized by a fetch tool, describes conditional eligibility as for issue information 'partially but not completely mitigated' and notes the record there showed no proposed measures or evidence of their efficacy. Exact wording, and whether a DOHA judge may impose a condition in every case, not confirmed."
    - "[UNVERIFIED] Appeal Board doctrine that an applicant need not have paid every debt, only shown a plan and significant action to carry it out (often cited to ISCR 07-06482, App. Bd. May 21, 2008); and that the effect of a decision on the applicant's career or employer is not a factor. Cites from memory."
    - "Cut to fit the 800-word card: a consideration for D (the record can be held open) now lives only in the situation and in rejected.D. First draft, at 1,102 words, is in versions/."
    - "Author question for Peter: the options are the agent's recommendations, and the choice is the disposition the judge would adopt. The schema has no field for 'the decider's own decision' as distinct from the agent's recommendation."

scenario:
  setting: "2027 · DOHA industrial clearance hearing, SEAD 4 Guideline F"
  decider: "the DOHA administrative judge"
  agent: "adjudication-support agent; recommends, with reasons; decides nothing"
  agent_role: recommend
  situation: |
    The applicant, a contractor technician, needs a Secret clearance.
    The Statement of Reasons (SOR) lists nine delinquent debts, about
    $38,000. He documents the cause: a plant closure in 2025, 13 months
    without work, and a divorce. He disclosed the debts himself. Two
    months before the SOR he began plans on the two largest ($20,500) and
    has made every payment for ten months; a third plan ($3,500) began
    after it. Two debts ($6,000) are disputed with documents: a duplicate
    account and a waived lease fee. Four smaller debts (about $8,000) have
    no plan; he will start them when the largest plan ends in 14 months.
    His budget shows a $450 monthly surplus and no new delinquency. SEAD 4
    Appendix C permits a conditional grant for partly mitigated issues; no
    one has proposed one. The record can stay open two weeks.
  question: "Which disposition should the agent recommend to the judge?"
  options:
    A: {do: "recommend granting: hardship and his repayment record mitigate the concern", move: act}
    B: {do: "recommend denying: too much debt is unresolved to settle the doubt", move: act}
    C: {do: "recommend granting on condition he report his finances twice a year", move: act}
    D: {do: "ask the judge to hold the record open, recommending nothing yet", move: ask, to: "the administrative judge"}

resolution:
  values:
    - {value: due_process, here: "judging him on the whole record under the published mitigating conditions"}
    - {value: classification_integrity, here: "keeping classified information from someone whose finances cast doubt on his judgment"}

  considerations:
    - id: A1
      fact: "the debts began with a documented plant closure, long unemployment, and a divorce"
      favors: A
      value: due_process
      weight: strong
      why: "20(b) mitigates causes largely beyond his control, if he then acted responsibly"
    - id: A2
      fact: "two plans began before the SOR; ten months of payments, none missed"
      favors: A
      value: due_process
      weight: strong
      why: "good faith (20(d)) shown before his clearance was at stake is that responsible conduct"
    - id: A3
      fact: "two debts ($6,000) are disputed with documents"
      favors: A
      value: due_process
      weight: weak
      why: "20(e) removes them from what is unresolved"
    - id: B1
      fact: "$8,000 has no plan; the third plan began only after the SOR"
      favors: B
      value: classification_integrity
      weight: strong
      why: "unresolved debt is the concern, and doubt is resolved for national security"
    - id: C1
      fact: "Appendix C permits a condition for partly mitigated issues"
      favors: C
      value: classification_integrity
      weight: weak
      why: "periodic reports would confirm the plan is kept"

  choice: A
  basis: recommended
  decisive: [A1, A2]
  rests_on: "SEAD 4 Guideline F, paras 20(b) and 20(d), weighed under the whole-person concept."

  judgment:
    read: |
      Department Counsel frames this as money still owed. Guideline F asks
      about judgment, not the balance. The cue a newer reader misses is the
      dates: he began paying before the SOR.
    weighing: |
      Resolving doubt for national security gives way to his record only
      because three things hold together: the debts trace to documented events he did not choose, he
      began repaying before his clearance was at stake, and he has kept
      every payment. The unplanned $8,000 is then the plan's next step, not
      a pattern. Remove any one and the doubt stands; a condition would not
      cure it.
    tradecraft: |
      Go allegation by allegation: tie each debt to a payment record, a
      dispute document or nothing, and mark what predates the SOR. Test the
      budget against the plan. Name the weak points and what would reverse
      the call.
    uncertainty: |
      Ten months is a short record and the budget is his own. The call
      holds if payments continue and the surplus is real.
    handoff: |
      The judge decides eligibility and credibility; the agent recommends,
      with reasons. Imposing a condition is the judge's call alone.
    tempting_wrong:
      option: C
      pull: "The safe middle: grant him, but keep watch."
      why_wrong: "A condition is for partial mitigation with a measure in the record; here it hedges a finding the judge should make."
    rejected:
      B: "Treats the balance as the concern; ignores why and when repayment began."
      D: "The open question is weight, not proof."

  lesson: |
    Guideline F asks what debts show about judgment, not whether they are
    paid. Hardship debt, met by repayment begun unprompted and kept, can
    mitigate a balance still owed.
  limits: |
    It does not reach debts from choices, repayment begun only after the
    SOR, tax debts, or new delinquencies; nor does it bar a condition where
    mitigation is partial and a measure exists.

  boundaries:
    would_change:
      - if: "every plan began after the SOR, with no earlier creditor contact"
        then: B
        why: "action under pressure is not the judgment 20(b) and (d) seek"
      - if: "half the debt had no plan, and the record held a monitoring measure"
        then: C
        why: "partial mitigation plus a measure is what a condition is for"
      - if: "the disputes were only asserted, and proof is obtainable"
        then: D
        why: "20(e) needs proof, and it is within reach"
    would_not_change:
      - if: "the position needs Top Secret, not Secret"
        why: "the same guidelines apply at every level"
      - if: "his program manager says the program slips without him"
        why: "a decision's effect on his employer is not a factor"
    watch_for:
      - what: "counseling from a legitimate nonprofit service"
        favors: A
        why: "para 20(c): more sign the problem is under control"

retrieval:
  headnote: "Recommend granting a clearance despite unpaid debts from hardship, where repayment began before the SOR and has been kept."
  tension: [due_process, classification_integrity]
  cues:
    - "delinquent debts after a documented hardship"
    - "payment plans started, some before the SOR"
    - "conditional eligibility on the table"
