# Benchbook MVP reference case · template v2.1 · new case, invented for the examples set.
# Blue / Green / Red, Sable Shoal, the treaty and every figure are invented (see provenance.caveats).
# Judgment prose is Claude's DRAFT for Peter to overwrite.

id: ESC-201
title: Shadowing at Sea
version: 1
status: draft
provenance:
  seed: "new; written in the style of a policy wargame move (Blue, Green, Red)"
  drafted_by: "Claude (spine and judgment prose, draft for Peter)"
  sources:
    - cite: "COLREGs 1972, Rule 1(a): the Rules 'shall apply to all vessels upon the high seas and in all waters connected therewith navigable by seagoing vessels'"
      url: "https://www.imo.org/en/About/Conventions/Pages/COLREG.aspx"
  caveats:
    - "Invented: Blue, Green, Red, Sable Shoal, all vessel counts, ranges, times and the Blue-Green treaty with its consultation clause."
    - "Invented: the Blue-Red deputy-minister channel and the standoff it ended two years ago."
    - "The case teaches a contested judgment. Deterrence-minded and restraint-minded planners would each pick a different option (A and C); both views are stated in the prose."
    - "[UNVERIFIED] The IMO page URL above; the Rule 1(a) wording is quoted from memory of the Convention text."
    - "Not used, to keep the card inside the budget: CUES (2014), a non-binding naval encounter code, which as far as I know does not cover coast-guard or militia vessels [UNVERIFIED]."

scenario:
  setting: "2029 · policy wargame move · Blue national-security staff crisis cell, disputed shoal"
  decider: "Blue's deputy national security adviser (the principal), who takes one course to the leaders at 1800"
  agent: "planning-support agent in the crisis cell; drafts courses of action and recommends one; tasks no forces and contacts no government"
  agent_role: recommend
  situation: |
    Day 3 of the move. A Green coast-guard cutter on patrol near Sable
    Shoal, in waters both Green and Red claim, has been shadowed since
    Monday by 14 to 18 Red maritime-militia vessels, with two Red
    coast-guard cutters 10 nm off. Yesterday militia vessels crossed its
    bow four times at under 100 m; this morning one blocked its course for
    40 minutes. No collision, no injuries. The passes breach the collision
    regulations, which bind every vessel, militia included. Green's crew
    filmed each pass, and a Blue patrol aircraft on a routine flight
    recorded releasable imagery of two. Green's foreign minister has asked
    Blue privately for "visible support," without saying what kind. A Blue
    destroyer is 180 nm away. Two Red frigates sit 40 nm from the shoal,
    and Red's foreign ministry said Tuesday that "foreign military
    interference" will meet "necessary measures." Blue and Green's treaty
    calls for consultation when either's public vessels are threatened. A
    Blue-Red channel between deputy foreign ministers ended a similar
    standoff two years ago, after four weeks. The principal wants the
    cell's recommendation by 1600.
  question: "Which course should the cell recommend to the principal?"
  options:
    A: {do: "recommend sending the destroyer to the shoal and announcing it, to show Red that Blue stands with Green", move: act, irreversible: true}
    B: {do: "recommend keeping Blue aircraft overhead, consulting Green today, and publishing the record of the passes jointly with Green", move: act, irreversible: true}
    C: {do: "recommend a private demarche to Red through the deputy ministers' channel, with no public statement or change in posture", move: act}
    D: {do: "set out all three courses and their risks for the principal, recommend none, and ask the principal to set the priority", move: ask, to: "the principal"}

resolution:
  values:
    - {value: escalation_control, here: "keeping a white-hull contest from becoming a military one near Red's frigates"}
    - {value: partner_relationship, here: "Green's confidence that Blue stands with it, and Green's ownership of its own dispute"}
    - {value: mission_effect, here: "stopping the harassment from becoming the new normal at the shoal"}
    - {value: norm_reciprocity, here: "holding Red to the collision rules every vessel is bound by"}
    - {value: oversight_candor, here: "giving the principal the cell's real judgment and saying plainly that it is contested"}

  considerations:
    - id: A1
      fact: "the harassment has escalated each day, from shadowing to close passes to blocking"
      favors: A
      value: mission_effect
      weight: strong
      why: "each unanswered step becomes the new baseline, and a warship raises Red's cost fastest"
    - id: A2
      fact: "Green asked privately for 'visible support'"
      favors: A
      value: partner_relationship
      weight: strong
      why: "a partner under pressure reads restraint as doubt about the treaty"
    - id: B1
      fact: "the harassers are militia with coast guard behind; Red's frigates sit 40 nm off under a public warning about 'foreign military interference'"
      favors: B
      value: escalation_control
      weight: strong
      why: "a Blue warship hands Red the military pretext it has named; a non-military answer does not"
    - id: B2
      fact: "the passes breach collision rules that bind every vessel, and releasable imagery shows them"
      favors: B
      value: norm_reciprocity
      weight: strong
      why: "publishing makes Red's breach the story and costs the militia its deniability"
    - id: B3
      fact: "the treaty calls for consultation when either's public vessels are threatened"
      favors: B
      value: partner_relationship
      weight: strong
      why: "consulting and publishing jointly answer Green's request in terms Green helps set"
    - id: C1
      fact: "a quiet Blue-Red channel ended a similar standoff two years ago"
      favors: C
      value: escalation_control
      weight: strong
      why: "private pressure lets Red stand down without losing face; publicity makes it defend its militia"

  choice: B
  basis: contested
  decisive: [B1, B2, B3]
  rests_on: "A judgment, not a rule: the collision regulations make the passes documentable breaches, and the treaty makes Green a co-author of the response."

  judgment:
    read: |
      It looks like a test of resolve that calls for a warship. It is a
      white-hull contest: Red's edge is deniability, Blue's is the record.
      The cue a novice misses: Red has said in public which response it is
      waiting for.
    weighing: |
      The pull toward a warship gives way to escalation control because
      Red's frigates and named warning make a grey hull the likeliest path
      to a military clash. The pull toward quiet gives way because
      silence leaves the harassment free for weeks and Green unanswered.
      B holds while no force is used and Green consents to release.
      Deterrence-minded planners would still send the ship; restraint-minded
      ones would stay quiet.
    tradecraft: |
      Consult Green first; publish nothing it has not agreed. Release
      imagery with times and distances, not claims about intent. The same
      hour, tell Red privately what Blue will not do. Leave the destroyer
      where it is. Tell the principal the call is contested, and why.
    uncertainty: |
      No one knows whether exposure deters a militia; past standoffs point
      both ways. The choice survives if exposure merely fails to deter. It
      fails if Red answers publication with force.
    handoff: |
      The cell recommends; the principal decides and carries it to the
      leaders. Whether and what to publish is Green's to agree. The cell
      names the strongest case against its own course.
    tempting_wrong:
      option: A
      pull: "Three days of escalation and a partner asking for visible support make a warship feel like the credible, loyal answer."
      why_wrong: "It moves a white-hull contest into the military arena Red's frigates and public warning are waiting for."
    rejected:
      C: "Quiet alone worked once, after four weeks; the harassment stays free meanwhile."
      D: "The principal asked for the cell's judgment; a menu without one withholds it."

  lesson: |
    When a rival presses with deniable non-military vessels, answer first
    in kind: make the conduct visible and costly, with the partner's
    consent, before moving to military presence the rival may be waiting
    to cite.
  limits: |
    It does not reach a case where force has been used against the
    partner's crew, a contest between navies, or a partner that wants
    silence. Nor does it say a warship is never right; only that it is not
    the first answer here.

  boundaries:
    would_change:
      - if: "militia vessels ram or board the cutter, or injure its crew"
        then: A
        why: "force against a partner's public vessel is the step military presence answers rather than starts"
      - if: "Green asks that nothing be made public"
        then: C
        why: "it is Green's dispute; publishing over its objection spends the relationship B is meant to serve"
    would_not_change:
      - if: "the harassers are Red coast-guard cutters, not militia"
        why: "still white hulls; the escalation logic and the breach are the same"
      - if: "Red calls publication a provocation and threatens a response"
        why: "words about its own exposure are not the military pretext B1 guards against"
    watch_for:
      - what: "Red's frigates close on the shoal"
        favors: C
        why: "raises the cost of any public move; how much depends on what they do"
      - what: "Green's public doubts about Blue grow"
        favors: A
        why: "raises the partner cost of restraint"

retrieval:
  headnote: "Answer a partner's harassment by deniable militia with joint public documentation and consultation, not a warship and not silence."
  tension: [escalation_control, partner_relationship, norm_reciprocity]
  cues:
    - "maritime militia or coast guard harassing a partner's vessel"
    - "partner asks for visible support"
    - "rival has warned against military involvement"
    - "releasable record of unsafe conduct"
