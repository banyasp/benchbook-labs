  tagging_rules:
  - 'Tag a mitigating factor only if the record documents it; an applicant''s undocumented claim tags nothing (DOHA:
    ''It is reasonable to expect Applicant to present documentation about the resolution of specific debts'', quoted
    in ISCR 25-00880).'
  - A20b1 without A20b2 is common (judges' 'partially applies'); tag the prong that holds.
  - Tag a fact at A20d@established only if the judge credits a documented track record or the debt is resolved;
    a plan signed shortly before the decision is A20d@initiated.
  - Involuntary payment (garnishment) tags neither A20d level (ISCR 25-00377).
  - Tag B-factors per the judge's findings on SOR allegations (Findings of Fact), not per the SOR alone.
