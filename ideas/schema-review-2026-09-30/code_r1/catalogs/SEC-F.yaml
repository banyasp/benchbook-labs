  concern:
    cite: SEAD 4, App. A ¶ 18
    text: Failure to live within one’s means, satisfy debts, and meet financial obligations may indicate poor self-control,
      lack of judgment, or unwillingness to abide by rules and regulations, all of which can raise questions about
      an individual’s reliability, trustworthiness, and ability to protect classified or sensitive information.
      Financial distress can also be caused or exacerbated by, and thus can be a possible indicator of, other issues
      of personnel security concern such as excessive gambling, mental health conditions, substance misuse, or alcohol
      abuse or dependence. An individual who is financially overextended is at greater risk of having to engage
      in illegal or otherwise questionable acts to generate funds. Affluence that cannot be explained by known sources
      of income is also a security concern insofar as it may result from criminal activity, including espionage.
  issues:
    ELIG:
      question: Grant or continue national security eligibility?
      sides:
        A: favorable
        B: unfavorable
      means:
        A: grant or continue national security eligibility
        B: deny or revoke national security eligibility
      action:
        A: GRANT_ELIGIBILITY
        B: DENY_ELIGIBILITY
      default: B
      default_quotes:
      - cite: SEAD 4, App. A ¶ 2(b)
        text: Each case must be judged on its own merits, and the final determination remains the responsibility
          of the authorized adjudicative agency. Any doubt concerning personnel being considered for national security
          eligibility will be resolved in favor of the national security.
      - cite: SEAD 4, App. A ¶ 1(d)
        text: In accordance with EO 12968, as amended, eligibility for covered individuals shall be granted only
          when facts and circumstances indicate that eligibility is clearly consistent with the national security
          interests of the United States, and any doubt shall be resolved in favor of national security.
