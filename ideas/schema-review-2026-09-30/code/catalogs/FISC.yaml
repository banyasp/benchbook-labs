  version: '2026-09-29'
  standard:
    cite: 'FBI Querying Procedures § [IV].A.1 (text layer: ''Section N.A.1''), as quoted in the Opinion (p. 35)'
    text: Each query of FBI systems containing unminimized contents or noncontents (including metadata) acquired
      pursuant to section 702 of the Act must be reasonably likely to retrieve foreign intelligence information,
      as defined by [FISA], or evidence of a crime, unless otherwise specifically excepted in these procedures.
    prongs:
    - (a) the person conducting the query must have the purpose of retrieving foreign intelligence [information]
      or evidence of a crime;
    - (b) the person conducting the query must have a specific factual basis to believe that it is reasonably likely
      to [retrieve] foreign intelligence [information] or evidence of a crime; and
    - (c) the query must be reasonably tailored to retrieve foreign intelligence [information] or evidence of a
      crime without unnecessarily retrieving other information.
