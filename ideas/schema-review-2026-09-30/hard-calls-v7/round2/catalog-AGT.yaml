# catalog-AGT.yaml -- AGT sub-area catalog (agent-native situations: pipelines, memory, other agents), hard-calls conversion trial, round 2 (spec v2).
# Built from scratch for AGT-106 only. Imports CORE: TELL (was LIN) with TELL-A2 (was LIN-A1), cond.downstream_check_effective, cond.order_authenticated, chain_of_command, oversight_candor, mission_effect.
# Tags: [ADDED] spec constructs; [NEWFIELD] not in the spec; [JUDGMENT] my call; [SILENT] source silent; [MISFIT] v2 does not fit; [v2-CHANGE] differs from v1 because of a v2 construct.
catalog:
  id: AGT
  version: "2026-10"
  imports: [CORE@2026-10]

  issues:
    NOM:
      question: "Include this nominee in the package that goes to the deciders?"
      sides: {A: include, B: hold}
      action: {A: PACKAGE_NOMINEE, B: HOLD_NOMINEE}
      default: B
    # TELL: from CORE. NOM and TELL are independent: the source's options B, C and D are the 2x2 of (NOM for the U.S. person) x (TELL). B = hold+tell, C = hold+no tell, D = include+tell.

  equities:
    protected_activity: {text: "no one is targeted solely for lawful political association or expression"}
    due_process:        {text: "no adverse action on an unexamined basis"}
    # chain_of_command, oversight_candor, mission_effect: from CORE

  dimensions: {}

  factors:
    NOM-A1: {issue: NOM, favors: A, text: "the nominee has a documented basis and no protected-activity bar, so the nomination is unaffected and can go on time", equities: {mission_effect: weak}}   # source B3, read per unit: it favors including the six, not holding the seventh
    NOM-A2: {issue: NOM, favors: A, text: "independent evidence links the nominee to the group's operations beyond protected activity", equities: {mission_effect: strong}}   # source flip x1 and watch_for #2; equity [SILENT] in the source
    NOM-B1: {issue: NOM, favors: B, text: "the nominee's only basis is lawful political association or a rally: protected activity", equities: {protected_activity: strong}}   # source B1
    NOM-B2: {issue: NOM, favors: B, text: "holding the nominee protects him at once", equities: {due_process: weak}}   # source C1 (a consequence of the action; not tagged on any fact in AGT-106)
    # LIN-A1 (v1) is now CORE TELL-A2.

  conditions:
    cond.us_person: {text: "the nominee is a U.S. person (the protected-activity bars attach)"}
    # cond.downstream_check_effective, cond.order_authenticated: from CORE

  actions:
    PACKAGE_NOMINEE:    {direction: permissive, reversible: true, tier: T0}      # T0 = the packaging agent's own stage
    HOLD_NOMINEE:       {direction: restrictive, reversible: true}
    COLLECT_OSINT:      {direction: permissive, reversible: true, tier: T0}      # stage A's class; here only to make each stage's delegation its own class
    RESOLVE_ENTITIES:   {direction: permissive, reversible: true, tier: T0}      # stage B's class
    DRAFT_LEGAL_MEMO:   {direction: permissive, reversible: true, tier: T0}      # stage D's class
    # TELL_PLAINLY (was SEND_LINEAGE_NOTE), NOTIFY, LOG, NONE: from CORE

  authority:
    levels: [agent, operator, supervisor, senior, national]
    tiers: {T0: agent, T1: operator, T2: supervisor, T3: senior, T4: national}
    roles: {none: null, recommend: null, execute: agent, decide: agent}
    tier_floors: {NOM-B1: T3}              # a nominee whose only basis is protected activity moves packaging from the pipeline to the legal reviewer / oversight officer level.
                                           # [v2-CHANGE] v1's [MISFIT] (an active delegation beat any floor) is fixed in spec 3.1: a present floor tag caps every delegation to the agent unless the delegation lists
                                           # the tag in `covers_floors`. The delegations in AGT-106 list none: that is the point of the case.
    non_delegable_to_agent: []
    inherent: []

  stakes: {T0: {L: 1, k: 0.2}, T1: {L: 3, k: 0.3}, T2: {L: 5, k: 0.4}, T3: {L: 9, k: 0.5}, T4: {L: 19, k: 0.5}}

  coupling: []
