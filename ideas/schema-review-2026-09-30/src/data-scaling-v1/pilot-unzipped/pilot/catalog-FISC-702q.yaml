# Mini-catalog for the optional second domain: FBI queries of raw Section 702 information.
# Source: FISC Memorandum Opinion and Order, April 21, 2022 (released by ODNI May 19, 2023):
# https://www.intelligence.gov/assets/documents/702-documents/declassified/21/2021_FISC_Certification_Opinion.pdf
# md5 13de1911daaa716ddb1df6ada980f23b; quotes are from the PDF text layer; [brackets] fix OCR errors.
catalog:
  id: INT-702Q
  options: {A: "run the query against raw 702 information", B: "do not run it (refine it, or seek a basis or approval first)"}
  standard:
    cite: "FBI Querying Procedures § [IV].A.1 (text layer: 'Section N.A.1'), as quoted in the Opinion (p. 35)"
    text: "Each query of FBI systems containing unminimized contents or noncontents (including metadata) acquired pursuant to section 702 of the Act must be reasonably likely to retrieve foreign intelligence information, as defined by [FISA], or evidence of a crime, unless otherwise specifically excepted in these procedures."
    prongs: ["(a) the person conducting the query must have the purpose of retrieving foreign intelligence [information] or evidence of a crime;",
             "(b) the person conducting the query must have a specific factual basis to believe that it is reasonably likely to [retrieve] foreign intelligence [information] or evidence of a crime; and",
             "(c) the query must be reasonably tailored to retrieve foreign intelligence [information] or evidence of a crime without unnecessarily retrieving other information."]
  default: {outcome: B, basis: "the standard is affirmative ('must be reasonably likely'); with no basis, the query is not permitted", author: draft}
  equities:   # author: draft
    purpose:       "prong (a): why the query is being run"
    factual_basis: "prong (b): a specific fact tying this term to FI or to evidence of a crime"
    tailoring:     "prong (c): no more than needed; batch size"
    oversight:     "procedural checks (attorney approval for batch jobs of 100 or more queries; 'This query is reasonably likely to retrieve EOC because ...')"
    civil_liberties: "U.S. persons engaged in protest or political activity (author: draft; not a prong of the standard)"
  factors:    # author: draft for grouping and strength
    A1: {means: "purpose is to retrieve FI or evidence of a crime (prong a)", favors: A, equities: [[purpose, weak]]}
    A2: {means: "specific factual basis ties this term to a foreign power or FI activity (prong b)", favors: A, equities: [[factual_basis, strong]]}
    A3: {means: "specific factual basis that raw FISA holdings contain evidence of the crime under investigation (prong b, EOC)", favors: A, equities: [[factual_basis, strong]]}
    A4: {means: "query limited to the terms that carry the basis (prong c)", favors: A, equities: [[tailoring, weak]]}
    A5: {means: "attorney approval obtained for a batch job of 100 or more queries", favors: A, equities: [[oversight, weak]]}
    B1: {means: "terms chosen by category membership alone (arrestees, victims, donors, visitors, would-be sources)", favors: B, equities: [[factual_basis, strong]]}
    B2: {means: "purpose is a general check for 'derogatory information' or 'foreign ties' with no lead", favors: B, equities: [[purpose, strong]]}
    B3: {means: "batch query across many identifiers", favors: B, equities: [[tailoring, strong]]}
    B4: {means: "terms are U.S. persons tied to protest or political activity", favors: B, equities: [[civil_liberties, weak]], author: draft}
    B5: {means: "the querier cannot state or recall the basis", favors: B, equities: [[factual_basis, strong]]}
