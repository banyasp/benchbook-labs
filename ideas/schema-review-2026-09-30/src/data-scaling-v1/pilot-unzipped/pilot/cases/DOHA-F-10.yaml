case:
  id: DOHA-F-10
  source: {caseno: "ISCR Case No. 25-00377", date: 2026-08-21, judge: "Hogan", record: hearing, counsel: pro se,
           url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262208/"}
  holding: >
    Two past bankruptcies, then 23 new delinquencies (~$68,000); despite a large surplus he
    signed a partial debt plan the day before the hearing, let other debts become time-barred,
    and said he would pay once cleared. Denied (also Guideline E).
  options: {A: grant, B: deny}
  decided_by: DOHA administrative judge
  agent_role: recommend
  default: B
  facts:
    - {id: g1, factors: [B19a, B19c], status: found,
       text: "Chapter 7 discharges in 2007 and 2018; 23 delinquent accounts since, ~$68,000"}
    - {id: g2, factors: [A20b1], status: found, note: "'partially applies'",
       text: "Gaps between contracts and several divorces"}
    - {id: g3, factors: [A20c1], status: found,
       text: "Took financial counseling with each bankruptcy"}
    - {id: g4, factors: [A20d@initiated, BX1], status: found,
       text: "Debt plan signed the day before the hearing, first paid after it; covers 5 debts, $8,628"}
    - {id: g5, factors: [BX2], status: found, extension: true,
       text: "Treats five debts as time-barred under state law"}
    - {id: g6, factors: [], status: found,
       text: "One small debt paid by garnishment; two small debts resolved"}
    - {id: g7, factors: [], status: found,
       text: "Household surplus ~$6,545/month; says he can pay only if cleared"}
  outcome: B
  reason: [B19a, B19c]
  reason_cite: {page: 16, section: "Analysis, Guideline F",
                anchor: "Based on Applicant’s overall history of financial irresponsibility, I am not confident that he will establish payment plans, pay, or otherwise resolve his remaining SOR debts."}
  flip_rules:
    - {if: "+A20d@established (sustained plan performance)", then: "A (hedged)",
       basis: "p. 20: 'With continued effort to resolve his delinquent debts ... he may well be able to demonstrate persuasive evidence'", scope: future}
  watch_for:
    - {what: "'too soon' to credit a plan begun on the eve of hearing (p. 14)", favors: B}
    - {what: "garnishment is not a good-faith effort (p. 15)", favors: B}
    - {what: "unalleged debt to a relative (credibility and mitigation only)", favors: B}
    - {what: "Guideline E: SCA Section 26 omission mitigated (¶ 17(a)); pattern of rule violations not", favors: B}
conversion:
  split: casebook
  minutes: {llm_draft: 0.4, llm_read_share: 0.5, llm_validate_share: 0.1, decision_words: 9538, human_review_estimate: 21}  # wall clock from timing.log; human figure is an estimate, not measured
  misfits:
    - "Cross-guideline: the E finding (pattern of rule violations drawn from J conduct) sits outside the F catalog but shares the denial."
    - "Ability to pay plus paying only if cleared reads as 19(b), not cited; carried as an untagged fact."
    - "'Too soon' is a temporal judgment on A20d; encoded as the initiated step, which also let DOHA-F-04 win."
    - "Unalleged conduct may weigh only on credibility and mitigation; the schema has no flag for a use-limited fact."
