case:
  id: DOHA-F-08
  source: {caseno: "ISCR Case No. 25-00880", date: 2026-08-03, judge: "Dorsey", record: FORM (written record), counsel: pro se,
           url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262001/"}
  holding: >
    Unfiled federal and two states' returns across several years, a $13,417 federal tax
    balance, and two untouched consumer debts; he blamed divorce and unemployment, told the
    investigator non-filing was "deliberate," and documented none of his claimed fixes.
    Denied; a 2016 bankruptcy and now-current student loans were found for him.
  options: {A: grant, B: deny}
  decided_by: DOHA administrative judge
  agent_role: recommend
  default: B
  facts:
    - {id: g1, factors: [B19f], status: found,
       text: "Federal returns unfiled TY 2015, 2018, 2021, 2022; state returns unfiled 2015-2022"}
    - {id: g2, factors: [B19f, B19a], status: found,
       text: "Federal tax owed for TY 2017, ~$13,417; intermittent payments, no current plan shown"}
    - {id: g3, factors: [B19a, B19c], status: found,
       text: "Repossessed-vehicle balance unpaid since 2019; a second account he is not 'knowledgeable of'"}
    - {id: g4, factors: [A20b1], status: found,
       text: "Self-employment, unemployment and a 2017 divorce preceded the lapses"}
    - {id: g5, factors: [A20e1], status: claimed,
       text: "Says he does not know the second account; no dispute filed or documented"}
    - {id: g6, factors: [], status: claimed,
       text: "Says missing federal returns are now filed; no transcripts provided"}
  outcome: B
  reason: [B19f, B19a]
  reason_cite: {page: 7, section: "Whole-Person Concept",
                anchor: "However, Applicant has unmitigated federal and state income tax issues and has not attempted to resolve two consumer debts."}
  flip_rules:
    - {if: "-B19a on a debt (account current, small arrears)", then: "A on that allegation",
       basis: "student loans ¶¶ 1.h-1.i found For as current (p. 5)", scope: allegation}
    - {if: "old bankruptcy (>10 years) alleged alone", then: "A on that allegation",
       basis: "¶ 1.e found For: 'it has been over 10 years' (p. 5)", scope: allegation}
  watch_for:
    - {what: "told investigator non-filing was 'deliberate' and he would file if 'forced to' (p. 3)", favors: B}
    - {what: "undocumented claims of filing and payment", favors: B}
    - {what: "honorable Navy service", favors: A}
conversion:
  split: heldout
  minutes: {llm_draft: 0.3, llm_read_share: 0.5, llm_validate_share: 0.1, decision_words: 3048, human_review_estimate: 9}  # wall clock from timing.log; human figure is an estimate, not measured
  misfits:
    - "His 'deliberate' / 'forced to' statement reads as 19(b) unwillingness, but the judge did not cite 19(b); the attitude lives only in watch_for."
    - "A20e1 without A20e2: the judge called non-recognition 'a reasonable basis' but demanded documents; the split prongs fit well here."
    - "The prior bankruptcy is both a disqualifier and 'too old'; the catalog has no age-of-conduct scale for B-factors."
