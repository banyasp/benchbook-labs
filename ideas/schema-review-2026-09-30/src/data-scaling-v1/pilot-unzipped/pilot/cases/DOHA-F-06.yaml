case:
  id: DOHA-F-06
  source: {caseno: "ISCR Case No. 25-01544", date: 2026-09-10, judge: "Foreman", record: hearing, counsel: pro se,
           url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262170/"}
  holding: >
    A young engineer, owed no tax, left her 2024 federal and state returns unfiled while an
    identity-theft claim was pending, and still had not filed after the IRS cleared her and
    the record was held open. Denied; the late-filed 2023 return was found for her.
  options: {A: grant, B: deny}
  decided_by: DOHA administrative judge
  agent_role: recommend
  default: B
  facts:
    - {id: g1, factors: [B19f], status: found,
       text: "TY 2024 federal and state returns not filed when the record closed (August 31, 2026)"}
    - {id: g2, factors: [A20b1], status: found,
       text: "Identity theft: someone filed a 2023 return in her name; IRS verified her claim July 2026"}
    - {id: g3, factors: [], status: found,
       text: "No tax owed for 2023-2025 by her own computation from W-2s"}
    - {id: g4, factors: [], status: claimed, credibility: rejected,
       text: "Says she waited because she thought the IRS suspected her of fraud"}
  outcome: B
  reason: [B19f]
  reason_cite: {page: 5, section: "Analysis, Guideline F",
                anchor: "Applicant was a victim of identity fraud, which was a condition largely beyond her control, but she has not acted"}
  flip_rules:
    - {if: "-B19f for a tax year (return filed, with an outside cause)", then: "A on that allegation",
       basis: "Formal findings p. 7: 'For Applicant for tax year 2023 and against Applicant for tax year 2024'", scope: allegation}
  watch_for:
    - {what: "explanation found 'implausible and unpersuasive' (p. 3)", favors: B}
    - {what: "no taxes owed; filing is the concern, not money (ISCR 01-05340)", favors: B}
    - {what: "'exceeds' and 'far exceeds expectations' performance ratings", favors: A}
    - {what: "judge: she 'may be able to qualify ... at some time in the future' (p. 6)", favors: A}
conversion:
  split: casebook
  minutes: {llm_draft: 0.3, llm_read_share: 0.5, llm_validate_share: 0.1, decision_words: 2692, human_review_estimate: 8}  # wall clock from timing.log; human figure is an estimate, not measured
  misfits:
    - "Credibility finding decides the 20(b) 'acted responsibly' prong; the schema records it only as a watch_for."
    - "No money is owed, so the current_burden equity is empty; the concern is purely rule compliance, which the catalog handles only because B19f has its own equity."
    - "The 'at this time' judgment (temporal, too soon) has no representation beyond a watch_for."
