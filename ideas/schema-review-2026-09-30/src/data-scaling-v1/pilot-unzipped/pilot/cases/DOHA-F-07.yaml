case:
  id: DOHA-F-07
  source: {caseno: "ISCR Case No. 26-00114", date: 2026-08-20, judge: "Driskill", record: FORM (no response filed), counsel: pro se,
           url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262211/"}
  holding: >
    Six defaulted student loans and four consumer debts ($67,489), all unpaid; she left a
    teaching job expecting the cleared job to start, gave several hardship reasons, and
    planned to pay "as soon as" income was steady, but documented no payments. Denied.
  options: {A: grant, B: deny}
  decided_by: DOHA administrative judge
  agent_role: recommend
  default: B
  facts:
    - {id: g1, factors: [B19a, B19c], status: found,
       text: "Six student loans transferred due to delinquency and four consumer debts, $67,489 total"}
    - {id: g2, factors: [A20b1], status: found, note: "partly: some causes were her choices",
       text: "Single parenthood, a family medical expense, rising costs, a gap between jobs"}
    - {id: g3, factors: [], status: found,
       text: "$200 student-loan payments in April and May 2025 only; none since"}
    - {id: g4, factors: [], status: claimed,
       text: "Arranging a structured student-loan plan; will pay cards when income is stable"}
    - {id: g5, factors: [], status: found,
       text: "Own statement shows household net remainder of $2,633/month"}
  outcome: B
  reason: [B19a, B19c]
  reason_cite: {page: 5, section: "Analysis, Guideline F",
                anchor: "Not all of these factors are circumstances beyond her control but, even for those that are, she did not provide proof of responsible action taken toward the debts."}
  flip_rules: []
  watch_for:
    - {what: "did not respond to the FORM; no documents to rebut", favors: B}
    - {what: "positive monthly remainder yet no payments (ability without action)", favors: B}
    - {what: "voluntarily reported the student loans on her SCA", favors: A}
conversion:
  split: heldout
  minutes: {llm_draft: 0.2, llm_read_share: 0.5, llm_validate_share: 0.1, decision_words: 2343, human_review_estimate: 8}  # wall clock from timing.log; human figure is an estimate, not measured
  misfits:
    - "Ability to pay without paying (net remainder $2,633) points to 19(b) 'unwillingness', which the judge did not find; the catalog cannot record a condition the judge left unargued."
    - "A20b1 held only in part ('Not all of these factors are circumstances beyond her control'); the catalog has no partial-strength step for A20b1."
    - "SOR amount errors corrected in a footnote; notice sufficiency is procedural and outside the schema."
