case:
  id: DOHA-F-09
  source: {caseno: "ISCR Case No. 25-01260", date: 2026-08-20, judge: "Harvey", record: hearing, counsel: pro se,
           url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262221/"}
  holding: >
    Seven years of unfiled federal returns and ~$148,000 in tax owed after a divorce and
    shift work; he disclosed it on his SCA, filed the overdue returns in October 2024 and March 2025, and paid an
    accepted offer in compromise in full. Every tax-debt allegation was mitigated, but the
    filing history was not. Denied.
  options: {A: grant, B: deny}
  decided_by: DOHA administrative judge
  agent_role: recommend
  default: B
  facts:
    - {id: g1, factors: [B19f, B19c], status: found,
       text: "Federal returns for TY 2017-2023 not timely filed; under-withheld for years"}
    - {id: g2, factors: [B19f, B19a], status: found,
       text: "Federal tax owed TY 2016-2022, ~$148,000 on transcripts"}
    - {id: g3, factors: [A20b1], status: found, note: "'does not fully apply'",
       text: "Divorce, loss of home, shift work; a preparer who did not file"}
    - {id: g4, factors: [A20g], status: found,
       text: "Offer in compromise accepted 2025 and paid off May 2026; state returns filed and paid"}
    - {id: g5, factors: [BX1], status: found, extension: true,
       text: "Filing and payment plan may be related to the clearance process"}
    - {id: g6, factors: [], status: found,
       text: "Disclosed the tax problem on his August 2024 SCA"}
  outcome: B
  reason: [B19f, B19c]
  reason_cite: {page: 14, section: "Analysis, Financial Considerations",
                anchor: "his failures regarding filing his FIT returns in SOR ¶ 1.a are not mitigated; however, the other SOR allegations are mitigated."}
  flip_rules:
    - {if: "+A20g (tax debt settled and in compliance)", then: "A on the debt allegations",
       basis: "¶¶ 1.b-1.j found For Applicant (p. 14)", scope: allegation}
  watch_for:
    - {what: "'no harm, no foul' is inadequate after years of non-filing (ISCR 15-01031, quoted)", favors: B}
    - {what: "SCA disclosure is 'a positive consideration' (p. 10)", favors: A}
    - {what: "TY 2021-2022 balances may sit outside the OIC", favors: B}
    - {what: "OIC requires five years of timely filing and payment", favors: A}
conversion:
  split: casebook
  minutes: {llm_draft: 0.4, llm_read_share: 0.5, llm_validate_share: 0.1, decision_words: 6825, human_review_estimate: 17}  # wall clock from timing.log; human figure is an estimate, not measured
  misfits:
    - "The published Conclusion reads 'clearly consistent ... to grant' and then 'Eligibility ... is denied'; gold must come from Formal Findings, and a regex on the conclusion would mislabel it."
    - "One unmitigated allegation (1.a) outweighed nine mitigated ones; the reason model has no notion of allegation count or of one allegation sufficing."
    - "Timing doctrine (Appeal Board ISCR 24-02193) drives the result but is not a SEAD 4 condition (BX1 extension)."
    - "Privacy: VA rating and a health condition in the decision were dropped."
