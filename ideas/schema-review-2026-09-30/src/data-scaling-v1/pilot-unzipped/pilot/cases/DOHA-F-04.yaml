case:
  id: DOHA-F-04
  source: {caseno: "ISCR Case No. 26-00803", date: 2026-08-19, judge: "Foreman", record: FORM (written record), counsel: pro se,
           url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262217/"}
  holding: >
    Two charged-off debts (~$26,000) after pandemic income loss and an abrupt return from an
    overseas job to care for a child; she contacted creditors at the time and set up plans on
    both in March 2026, missing two payments when her hours were cut, then resuming. Granted.
  options: {A: grant, B: deny}
  decided_by: DOHA administrative judge
  agent_role: recommend
  default: B
  facts:
    - {id: g1, factors: [B19a, B19c], status: found,
       text: "Personal loan charged off ~$16,000 (2022); credit card charged off ~$10,300 (2022)"}
    - {id: g2, factors: [A20b1], status: found,
       text: "Pandemic income loss, underemployment, sudden sole custody in January 2022"}
    - {id: g3, factors: [A20b2], status: found,
       text: "Contacted creditor at the time of hardship; set up plans once she could keep them"}
    - {id: g4, factors: [A20d@initiated], status: found,
       text: "Plans since March 2026 (~$439 and ~$435/month); two missed payments, resumed June 2026"}
    - {id: g5, factors: [A20a], status: found,
       text: "19 on-time payments before the hardship; other obligations in good standing"}
  outcome: A
  reason: [A20a, A20b1, A20b2, A20d@initiated]
  reason_cite: {page: 5, section: "Analysis, Guideline F",
                anchor: "AG ¶ 20(d) is established because Applicant initiated, albeit recently, payment plans with both creditors"}
  flip_rules: []
  watch_for:
    - {what: "a long repayment horizon is not itself a reason to deny (ISCR 19-01624, fn. 1)", favors: A}
    - {what: "honorable Army service 1998-2006; federal contractor overseas", favors: A}
    - {what: "income again cut in early 2026 by regional instability", favors: B}
conversion:
  split: heldout
  minutes: {llm_draft: 0.2, llm_read_share: 0.5, llm_validate_share: 0.1, decision_words: 2367, human_review_estimate: 8}  # wall clock from timing.log; human figure is an estimate, not measured
  misfits:
    - "FORM case: judge states she could not assess credibility, yet found the promise to keep paying 'credible' from documents; demeanor-free credibility is not representable."
    - "Only ~3-4 payments ('albeit recently') satisfied 20(d) here, while 'too soon' defeated 20(d) elsewhere (DOHA-F-10); the A20d scale step is judge-dependent."
    - "Missed payments after the plan began were excused by an outside event; no factor for a lapse that has an outside reason."
