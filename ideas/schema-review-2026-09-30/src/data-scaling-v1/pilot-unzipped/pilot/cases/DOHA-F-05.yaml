case:
  id: DOHA-F-05
  source: {caseno: "ISCR Case No. 25-01037", date: 2026-09-08, judge: "Anderson", record: hearing, counsel: pro se,
           url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262176/"}
  holding: >
    Two medical collection accounts (~$130,000) from an emergency while thinly insured;
    after years of letting them age, he discharged them in Chapter 7 (filed after the SOR)
    and now carries adequate insurance and no other delinquencies. Granted, with a warning.
  options: {A: grant, B: deny}
  decided_by: DOHA administrative judge
  agent_role: recommend
  default: B
  facts:
    - {id: g1, factors: [B19a, B19c], status: found,
       text: "Two medical accounts in collection, ~$130,000, on 2024 and 2025 credit reports"}
    - {id: g2, factors: [A20b1], status: found,
       text: "Unexpected medical emergency in 2020; limited insurance; 4-6 weeks unpaid"}
    - {id: g3, factors: [BX2], status: found, extension: true,
       text: "Followed advice that the debts would drop off his credit report after seven years"}
    - {id: g4, factors: [A20d@initiated, A20d@established, BX1], status: found,
       text: "Chapter 7 filed September 2025 (SOR August 2025), discharged December 2025"}
    - {id: g5, factors: [A20a], status: found,
       text: "Now buys adequate insurance; no other account ever in collection; pays bills on time"}
  outcome: A
  reason: [A20b1, A20d@established, A20a]
  reason_cite: {page: 6, section: "Analysis, Guideline F",
                anchor: "To properly address these debts, he filed for Chapter 7 Bankruptcy, and had them both discharged.",
                note: "No mitigating subparagraph is named; the reason set is inferred."}
  flip_rules:
    - {if: "+B19a (new delinquencies)", then: B, basis: "p. 7: 'In the event that he does not continue to make his bills a priority to resolve, his security clearance will be immediately in jeopardy.'", scope: future}
  watch_for:
    - {what: "supervisor, subordinate and childhood friend describe him as responsible", favors: A}
    - {what: "age 22 and low income when the debt arose (¶ 2(d)(4) maturity)", favors: A}
conversion:
  split: casebook
  minutes: {llm_draft: 0.2, llm_read_share: 0.5, llm_validate_share: 0.1, decision_words: 2756, human_review_estimate: 8}  # wall clock from timing.log; human figure is an estimate, not measured
  misfits:
    - "No named mitigator: the analysis never cites a ¶ 20 subparagraph; the reason set is inferred."
    - "Bankruptcy as 'otherwise resolve debts' is a legal-status fact, not an effort; A20d@established stretches to cover it."
    - "The warning language approaches SEAD 4 ¶ 2(h) 'approval with a warning' (a third option) but the decision does not invoke ¶ 2(h)."
    - "Privacy: decision names specific diagnoses; converted at the level of the ¶ 20(b) example (unexpected medical emergency) only."
