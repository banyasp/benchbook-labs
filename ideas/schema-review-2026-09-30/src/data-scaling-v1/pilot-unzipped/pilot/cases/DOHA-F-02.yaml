case:
  id: DOHA-F-02
  source: {caseno: "ISCR Case No. 26-00201", date: 2026-09-01, judge: "Cefola", record: FORM (written record), counsel: pro se,
           url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262169/"}
  holding: >
    One $22,830 credit-card collection left from a period of overspending; the couple had
    already settled 14 other debts (>$44,000) through credit counseling, and a settlement
    plan on the last one began after the FSO flagged it. Granted.
  options: {A: grant, B: deny}
  decided_by: DOHA administrative judge
  agent_role: recommend
  default: B
  facts:
    - {id: g1, factors: [B19a, B19c], status: found,
       text: "Credit card in collection, $22,830, last payment October 2021"}
    - {id: g2, factors: [B19e], status: found,
       text: "He and his wife overextended themselves on several credit cards"}
    - {id: g3, factors: [A20c1, A20c2, A20d@initiated, A20d@established], status: found,
       text: "Used a credit counselor to settle 14 other debts totaling over $44,000"}
    - {id: g4, factors: [A20d@initiated], status: found,
       text: "Settlement for $9,133 at $254/month, first payment June 2026, after the FSO alert in April 2026"}
    - {id: g5, factors: [A20a], status: found,
       text: "Raise at work, spouse works part time; charges only what they can afford"}
    - {id: g6, factors: [BX1], status: found, extension: true,
       text: "Action on the SOR debt began only after the FSO alert (SOR issued April 10, 2026)"}
  outcome: A
  reason: [A20a, A20c2, A20d@established]
  reason_cite: {page: 5, section: "Analysis, SOR Paragraph 1",
                anchor: "His monthly income is substantial, he has a proven track record of paying down settled debt"}
  flip_rules: []
  watch_for:
    - {what: "22 years of Navy service; letter of appreciation from a Navy command", favors: A}
    - {what: "overspending history 'by itself, presents concerns about his judgment'", favors: B}
conversion:
  split: casebook
  minutes: {llm_draft: 0.2, llm_read_share: 0.5, llm_validate_share: 0.1, decision_words: 2044, human_review_estimate: 7}  # wall clock from timing.log; human figure is an estimate, not measured
  misfits:
    - "Track record on UNALLEGED debts carried the mitigation of the one alleged debt; the schema tags facts, not which debts they concern."
    - "Late remediation on the SOR debt (BX1) was present but not weighed; the grant shows the doctrine is not a rule."
    - "FORM case: no credibility finding possible, yet the judge accepts the wife's write-off belief as the reason for delay."
