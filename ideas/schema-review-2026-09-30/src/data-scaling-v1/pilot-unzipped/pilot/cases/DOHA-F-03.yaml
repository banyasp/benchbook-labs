case:
  id: DOHA-F-03
  source: {caseno: "ISCR Case No. 25-00861", date: 2026-08-31, judge: "Nagel", record: hearing, counsel: pro se,
           url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262165/"}
  holding: >
    Federal and county tax debts from an untaxed 401(k) hardship withdrawal, plus four
    charged-off accounts, arising while he was a parent's sole caregiver; he paid both tax
    debts, kept a debt-relief plan current, and hired a locator for two creditors no one
    could find, all before the SCA. Granted.
  options: {A: grant, B: deny}
  decided_by: DOHA administrative judge
  agent_role: recommend
  default: B
  facts:
    - {id: g1, factors: [B19a, B19c], status: found,
       text: "Four charged-off consumer accounts, ~$24,000"}
    - {id: g2, factors: [B19f], status: found,
       text: "Federal tax delinquency ~$15,000 (TY 2019-2022) and county property tax ~$2,300"}
    - {id: g3, factors: [A20b1], status: found,
       text: "Sole caregiver for his mother 2012-2023; did not foresee tax on the 401(k) withdrawal"}
    - {id: g4, factors: [A20g], status: found,
       text: "IRS plan March 2025, all payments made, paid off December 2025; property tax paid"}
    - {id: g5, factors: [A20d@initiated, A20d@established, A20b2], status: found,
       text: "Debt-relief plan since October 2023, $108 every two weeks 'without fail'"}
    - {id: g6, factors: [A20b2], status: found,
       text: "Two creditors cannot be located; pays a locator service $109/month"}
    - {id: g7, factors: [AX1], status: found, extension: true,
       text: "Most action taken before the SCA and the SOR"}
    - {id: g8, factors: [A20a], status: found,
       text: "Keeps a budget counting only base hours"}
  outcome: A
  reason: [A20a, A20b1, A20b2, A20d@established, A20g]
  reason_cite: {page: 6, section: "Analysis, Guideline F",
                anchor: "I conclude AG ¶¶ 20(a), 20(b), 20(d) and 20(g) apply."}
  flip_rules: []
  watch_for:
    - {what: "judge found him 'candid, sincere, forthcoming' and credible (p. 3)", favors: A}
    - {what: "a plan need not pay all debts at once (Appeal Board, ISCR 07-06482)", favors: A}
conversion:
  split: heldout
  minutes: {llm_draft: 0.2, llm_read_share: 0.5, llm_validate_share: 0.1, decision_words: 2571, human_review_estimate: 8}  # wall clock from timing.log; human figure is an estimate, not measured
  misfits:
    - "Credibility finding carries the unlocatable-creditor story; the schema has no slot for 'credible' as a modifier on a fact."
    - "Two unresolved debts were found For Applicant on intent plus effort, not resolution; A20d as written ('adhering to ... repay') fits only loosely."
    - "Caregiving for a parent is not in 20(b)'s example list; tagged A20b1 by analogy."
