case:
  id: FISC-01
  source: {doc: "FISC Memorandum Opinion and Order, Apr. 21, 2022 (released May 19, 2023)", page: 27,
           url: "https://www.intelligence.gov/assets/documents/702-documents/declassified/21/2021_FISC_Certification_Opinion.pdf"}
  holding: >
    A June 2020 batch query of raw FISA information using identifiers of 133 people arrested
    during protests, to look for counterterrorism derogatory information with no specific
    lead, did not meet the querying standard, over the FBI's objection.
  options: {A: run the query, B: do not run it}
  decided_by: DOJ NSD (compliance determination), reported to and relied on by the FISC
  agent_role: execute     # the querier decides whether to run it
  default: B
  facts:
    - {id: g1, factors: [B1, B4], text: "Terms = 133 arrestees 'in connection with civil unrest and protests'"}
    - {id: g2, factors: [B2], text: "Purpose: whether the FBI had 'any counter-terrorism derogatory information on the arrestees'"}
    - {id: g3, factors: [B3], text: "One batch query across all 133"}
    - {id: g4, factors: [], text: "Queriers knew of no 'specific potential connections to terrorist related activity'"}
    - {id: g5, factors: [], status: "FBI argument, rejected", text: "Arrest = evidence of a crime; other reporting (not relied on by the querier) suggested a foreign-power link"}
  outcome: B
  reason: [B1, B2]
  reason_cite: {page: 27, anchor: "NSD assessed that the queries were not reasonably likely to retrieve foreign intelligence information or evidence of a crime."}
  flip_rules:
    - {if: "+A2 (the querier knows and relies on a specific foreign-power link for these terms)", then: A,
       basis: "the FBI's rejected argument rested on other information that the person who ran the queries did not rely on (p. 27; that line is partly redacted in the release); prong (b) as codified (p. 35)"}
  watch_for:
    - {what: "arrest alone is not a factual basis for an evidence-of-crime query", favors: B}
    - {what: "the two agencies disagreed: a 'contested' item until NSD/FISC ruled", favors: B}
conversion:
  misfits:
    - "Two adjudicators disagree (FBI vs NSD); gold is NSD's call as adopted by the Court. It fits the 'contested' class, but this record has a final authority."
    - "The rejected FI argument depends on who knew what (information not relied on by the querier): a knowledge-state factor the schema lacks."
