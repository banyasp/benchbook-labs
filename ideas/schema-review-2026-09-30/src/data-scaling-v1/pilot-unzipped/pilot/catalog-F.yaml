# Benchbook factor catalog — SEC sub-area, Guideline F (Financial Considerations)
# Built 2026-09-29 for the DOHA pilot. Condition text is quoted verbatim from SEAD 4,
# Appendix A, ¶¶ 18-20, OCR'd (tesseract 300 dpi) from the official scanned PDF.
# Every value judgment made by the pilot author (equity grouping, strength, scale steps,
# forced significance, the doctrine extension) is marked `author: draft` for Peter to overwrite.

catalog:
  id: SEC-F
  sub_area: "personnel security adjudication — Guideline F, Financial Considerations"
  source:
    title: "Security Executive Agent Directive 4, National Security Adjudicative Guidelines"
    effective: "(EFFECTIVE: 08 JUNE 2017)"
    url: https://archive.dni.gov/files/NCSC/documents/Regulations/SEAD-4-Adjudicative-Guidelines-U.pdf
    mirror_same_md5: https://www.dni.gov/files/NCSC/documents/Regulations/SEAD-4-Adjudicative-Guidelines-U.pdf
    md5: b9fa37214027551849bfd0873201e02a
    retrieved: 2026-09-29
    note: "Scanned image, no text layer; OCR checked by eye against ¶¶ 18-20 and ¶ 2."

  options:
    A: {name: favorable, means: "grant or continue national security eligibility"}
    B: {name: unfavorable, means: "deny or revoke national security eligibility"}
    # SEAD 4 App. A ¶ 2(g) also allows approval "with an exception as defined in Appendix C"
    # and ¶ 2(h) approval "with a warning". Not used as options in this pilot (no DOHA F
    # decision in the sample used them); a C option would be "grant with exception".

  default:
    outcome: B
    quotes:
      - cite: "SEAD 4, App. A ¶ 2(b)"
        text: "Each case must be judged on its own merits, and the final determination remains the responsibility of the authorized adjudicative agency. Any doubt concerning personnel being considered for national security eligibility will be resolved in favor of the national security."
      - cite: "SEAD 4, App. A ¶ 1(d)"
        text: "In accordance with EO 12968, as amended, eligibility for covered individuals shall be granted only when facts and circumstances indicate that eligibility is clearly consistent with the national security interests of the United States, and any doubt shall be resolved in favor of national security."
    author: SEAD 4 (not a draft judgment)

  concern:
    cite: "SEAD 4, App. A ¶ 18"
    text: "Failure to live within one’s means, satisfy debts, and meet financial obligations may indicate poor self-control, lack of judgment, or unwillingness to abide by rules and regulations, all of which can raise questions about an individual’s reliability, trustworthiness, and ability to protect classified or sensitive information. Financial distress can also be caused or exacerbated by, and thus can be a possible indicator of, other issues of personnel security concern such as excessive gambling, mental health conditions, substance misuse, or alcohol abuse or dependence. An individual who is financially overextended is at greater risk of having to engage in illegal or otherwise questionable acts to generate funds. Affluence that cannot be explained by known sources of income is also a security concern insofar as it may result from criminal activity, including espionage."

  equities:   # all author: draft
    current_burden:
      rationale: "Is there an unresolved financial problem now? ¶ 18: an overextended person is at greater risk of questionable acts to generate funds."
      author: draft
    pattern:
      rationale: "Is the conduct a pattern likely to recur? ¶ 2(d)(3) frequency and recency; ¶ 2(d)(9) likelihood of recurrence."
      author: draft
    cause:
      rationale: "Did the problem come from outside events or from the person's own choices? ¶ 2(d)(2) circumstances; ¶ 18 'poor self-control'."
      author: draft
    responsible_conduct:
      rationale: "Once the problem arose, did the person act responsibly and in good faith? ¶ 2(d)(6) rehabilitation; the 'acted responsibly' prong of ¶ 20(b)."
      author: draft
    rule_compliance:
      rationale: "Voluntary compliance with government rules and systems; kept separate because DOHA treats tax-filing failures as their own concern, not just as debt."
      author: draft
    integrity:
      rationale: "Deception, concealment or unexplained money; the espionage-adjacent part of ¶ 18. Kept separate because it is much stronger than ordinary debt."
      author: draft
    gambling:
      rationale: "Gambling-driven finances (¶ 19(h)-(i)); separate because ¶ 18 ties it to other guidelines."
      author: draft

  # ---- B-factors: SEAD 4 App. A ¶ 19 "Conditions that could raise a security concern and may be disqualifying include:"
  factors_B:
    B19a: {para: "19(a)", text: "inability to satisfy debts;",
           equities: [[current_burden, strong]], author: draft}
    B19b: {para: "19(b)", text: "unwillingness to satisfy debts regardless of the ability to do so;",
           equities: [[responsible_conduct, strong]], author: draft}
    B19c: {para: "19(c)", text: "a history of not meeting financial obligations;",
           equities: [[pattern, strong]], author: draft}
    B19d: {para: "19(d)", text: "deceptive or illegal financial practices such as embezzlement, employee theft, check fraud, expense account fraud, mortgage fraud, filing deceptive loan statements and other intentional financial breaches of trust;",
           equities: [[integrity, strong]], forced_significance: true, author: draft,
           why_forced: "¶ 2(e): 'a single criterion may be sufficient to make an unfavorable eligibility determination'"}
    B19e: {para: "19(e)", text: "consistent spending beyond one’s means or frivolous or irresponsible spending, which may be indicated by excessive indebtedness, significant negative cash flow, a history of late payments or of non-payment, or other negative financial indicators;",
           equities: [[pattern, strong], [cause, strong]], author: draft}
    B19f: {para: "19(f)", text: "failure to file or fraudulently filing annual Federal, state, or local income tax returns or failure to pay annual Federal, state, or local income tax as required;",
           equities: [[rule_compliance, strong]], author: draft}
    B19g: {para: "19(g)", text: "unexplained affluence, as shown by a lifestyle or standard of living, increase in net worth, or money transfers that are inconsistent with known legal sources of income;",
           equities: [[integrity, strong]], forced_significance: true, author: draft}
    B19h: {para: "19(h)", text: "borrowing money or engaging in significant financial transactions to fund gambling or pay gambling debts; and",
           equities: [[gambling, strong], [cause, strong]], author: draft}
    B19i: {para: "19(i)", text: "concealing gambling losses, family conflict, or other problems caused by gambling.",
           equities: [[gambling, strong], [integrity, strong]], author: draft}

  # ---- A-factors: SEAD 4 App. A ¶ 20 "Conditions that could mitigate security concerns include:"
  # Conjunctive conditions are split into prongs under different equities (Benchbook rule:
  # factors that must hold together go under different equities).
  factors_A:
    A20a: {para: "20(a)", text: "the behavior happened so long ago, was so infrequent, or occurred under such circumstances that it is unlikely to recur and does not cast doubt on the individual’s current reliability, trustworthiness, or good judgment;",
           equities: [[pattern, strong]], author: draft}
    A20b1: {para: "20(b), prong 1", text: "the conditions that resulted in the financial problem were largely beyond the person’s control (e.g., loss of employment, a business downturn, unexpected medical emergency, a death, divorce or separation, clear victimization by predatory lending practices, or identity theft),",
            equities: [[cause, weak]], author: draft}
    A20b2: {para: "20(b), prong 2", text: "and the individual acted responsibly under the circumstances;",
            equities: [[responsible_conduct, strong]], author: draft}
    A20c1: {para: "20(c), prong 1", text: "the individual has received or is receiving financial counseling for the problem from a legitimate and credible source, such as a non-profit credit counseling service,",
            equities: [[responsible_conduct, weak]], author: draft}
    A20c2: {para: "20(c), prong 2", text: "and there are clear indications that the problem is being resolved or is under control;",
            equities: [[current_burden, weak], [pattern, weak]], author: draft}
    A20d:
      para: "20(d)"
      text: "the individual initiated and is adhering to a good-faith effort to repay overdue creditors or otherwise resolve debts;"
      scale:   # nested threshold factors; a fact at 'established' also tags 'initiated'
        initiated:   {id: "A20d@initiated",   means: "a plan or agreement exists; few or no documented payments, or begun on the eve of decision", equities: [[current_burden, weak], [responsible_conduct, weak]]}
        established: {id: "A20d@established", means: "documented, sustained performance or completed resolution (paid, settled, or discharged)", equities: [[current_burden, strong], [responsible_conduct, strong]]}
      author: draft
    A20e1: {para: "20(e), prong 1", text: "the individual has a reasonable basis to dispute the legitimacy of the past-due debt which is the cause of the problem",
            equities: [[cause, weak]], author: draft}
    A20e2: {para: "20(e), prong 2", text: "and provides documented proof to substantiate the basis of the dispute or provides evidence of actions to resolve the issue;",
            equities: [[current_burden, weak]], author: draft}
    A20f:  {para: "20(f)", text: "the affluence resulted from a legal source of income; and",
            equities: [[integrity, strong]], author: draft}
    A20g:  {para: "20(g)", text: "the individual has made arrangements with the appropriate tax authority to file or pay the amount owed and is in compliance with those arrangements.",
            equities: [[rule_compliance, strong], [current_burden, weak]], author: draft}

  # ---- Doctrine extension (NOT SEAD 4). Recurring DOHA Appeal Board rules quoted inside the
  # pilot decisions. Used only in run 2 of the held-out test to measure what SEAD 4 alone misses.
  factors_doctrine:
    BX1: {means: "remediation began only after the clearance process put the applicant on notice (interrogatories, SOR, or hearing)",
          favors: B, equities: [[responsible_conduct, strong]], author: draft,
          source: "ISCR Case No. 15-06440 at 4 (App. Bd. Dec. 26, 2017), as quoted in ISCR 25-00377: 'an applicant who begins to resolve financial problems only after being placed on notice that his clearance was in jeopardy may lack the judgment and self-discipline to follow rules and regulations over time or when there is no immediate threat to his own interests.'"}
    BX2: {means: "relied on debts aging off the credit report or becoming time-barred instead of resolving them",
          favors: B, equities: [[responsible_conduct, strong]], author: draft,
          source: "ISCR 25-00377 (quoting ISCR Case No. 01-09691 at 2): 'security clearance decisions are not controlled or limited by any statute of limitation.'"}
    AX1: {means: "remediation began before the SCA or SOR, without prompting by the clearance process",
          favors: A, equities: [[responsible_conduct, strong]], author: draft,
          source: "ISCR 25-00861: 'before an SOR was issued or he even submitted his SCA, he began working on his finances.'"}

  tagging_rules:   # how a fact earns a tag; author: draft
    - "Tag a mitigating factor only if the record documents it; an applicant's undocumented claim tags nothing (DOHA: 'It is reasonable to expect Applicant to present documentation about the resolution of specific debts', quoted in ISCR 25-00880)."
    - "A20b1 without A20b2 is common (judges' 'partially applies'); tag the prong that holds."
    - "Tag a fact at A20d@established only if the judge credits a documented track record or the debt is resolved; a plan signed shortly before the decision is A20d@initiated."
    - "Involuntary payment (garnishment) tags neither A20d level (ISCR 25-00377)."
    - "Tag B-factors per the judge's findings on SOR allegations (Findings of Fact), not per the SOR alone."
