cases:
  DOHA-F-01:
    case:
      id: DOHA-F-01
      source:
        caseno: ISCR Case No. 26-00215
        date: 2026-09-02
        judge: Cefola
        record: hearing
        counsel: pro se
        url: https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262192/
      holding: 'Credit-card delinquencies (~$28,000) traced to 18 months of pandemic unemployment; applicant pays
        $350/month through two credit counselors and has cut the balance by ~$4,000. Granted.

        '
      options:
        A: grant
        B: deny
      decided_by: DOHA administrative judge
      agent_role: recommend
      default: B
      facts:
      - id: g1
        factors:
        - B19a
        - B19c
        status: found
        text: Five past-due credit cards (~$28,000), all admitted
      - id: g2
        factors:
        - A20b1
        status: found
        text: Debts followed an 18-month unemployment, June 2020 to November 2021
      - id: g3
        factors:
        - A20c1
        status: found
        text: Enrolled with two credit-counseling companies
      - id: g4
        factors:
        - A20d@initiated
        - A20d@established
        - A20c2
        - A20b2
        status: found
        text: Documented monthly payments on three debts; one paid, one written off and reported as income
      outcome: A
      reason:
      - A20b1
      - A20c1
      - A20d@established
      reason_cite:
        page: 5
        section: Analysis, Guideline F
        anchor: Applicant’s financial difficulties were caused by COVID and a resulting 18-month period of unemployment.
        note: Judge wrote only 'Mitigation under AG ¶ 20 has been established' after listing 20(a)-(d); subparagraphs
          inferred from the facts he cited.
      flip_rules: []
      watch_for:
      - what: manager and community testify to her standing
        favors: A
    conversion:
      split: casebook
      minutes:
        llm_draft: 0.2
        llm_read_share: 0.5
        llm_validate_share: 0.1
        decision_words: 1899
        human_review_estimate: 7
      misfits:
      - 'Unspecified mitigator: the judge found ''Mitigation under AG ¶ 20'' without naming which of 20(a)-(d);
        the reason set is the converter''s inference (reason_confidence: low).'
      - 'Scale judgment: ~11 months of payments at $350 treated as A20d@established; the catalog has no bright line.'
      - Written-off debt reported as taxable income (1.d) has no catalog factor; tagged into g4 as resolution.
  DOHA-F-02:
    case:
      id: DOHA-F-02
      source:
        caseno: ISCR Case No. 26-00201
        date: 2026-09-01
        judge: Cefola
        record: FORM (written record)
        counsel: pro se
        url: https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262169/
      holding: 'One $22,830 credit-card collection left from a period of overspending; the couple had already settled
        14 other debts (>$44,000) through credit counseling, and a settlement plan on the last one began after the
        FSO flagged it. Granted.

        '
      options:
        A: grant
        B: deny
      decided_by: DOHA administrative judge
      agent_role: recommend
      default: B
      facts:
      - id: g1
        factors:
        - B19a
        - B19c
        status: found
        text: Credit card in collection, $22,830, last payment October 2021
      - id: g2
        factors:
        - B19e
        status: found
        text: He and his wife overextended themselves on several credit cards
      - id: g3
        factors:
        - A20c1
        - A20c2
        - A20d@initiated
        - A20d@established
        status: found
        text: Used a credit counselor to settle 14 other debts totaling over $44,000
      - id: g4
        factors:
        - A20d@initiated
        status: found
        text: Settlement for $9,133 at $254/month, first payment June 2026, after the FSO alert in April 2026
      - id: g5
        factors:
        - A20a
        status: found
        text: Raise at work, spouse works part time; charges only what they can afford
      - id: g6
        factors:
        - BX1
        status: found
        extension: true
        text: Action on the SOR debt began only after the FSO alert (SOR issued April 10, 2026)
      outcome: A
      reason:
      - A20a
      - A20c2
      - A20d@established
      reason_cite:
        page: 5
        section: Analysis, SOR Paragraph 1
        anchor: His monthly income is substantial, he has a proven track record of paying down settled debt
      flip_rules: []
      watch_for:
      - what: 22 years of Navy service; letter of appreciation from a Navy command
        favors: A
      - what: overspending history 'by itself, presents concerns about his judgment'
        favors: B
    conversion:
      split: casebook
      minutes:
        llm_draft: 0.2
        llm_read_share: 0.5
        llm_validate_share: 0.1
        decision_words: 2044
        human_review_estimate: 7
      misfits:
      - Track record on UNALLEGED debts carried the mitigation of the one alleged debt; the schema tags facts, not
        which debts they concern.
      - Late remediation on the SOR debt (BX1) was present but not weighed; the grant shows the doctrine is not
        a rule.
      - 'FORM case: no credibility finding possible, yet the judge accepts the wife''s write-off belief as the reason
        for delay.'
  DOHA-F-03:
    case:
      id: DOHA-F-03
      source:
        caseno: ISCR Case No. 25-00861
        date: 2026-08-31
        judge: Nagel
        record: hearing
        counsel: pro se
        url: https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262165/
      holding: 'Federal and county tax debts from an untaxed 401(k) hardship withdrawal, plus four charged-off accounts,
        arising while he was a parent''s sole caregiver; he paid both tax debts, kept a debt-relief plan current,
        and hired a locator for two creditors no one could find, all before the SCA. Granted.

        '
      options:
        A: grant
        B: deny
      decided_by: DOHA administrative judge
      agent_role: recommend
      default: B
      facts:
      - id: g1
        factors:
        - B19a
        - B19c
        status: found
        text: Four charged-off consumer accounts, ~$24,000
      - id: g2
        factors:
        - B19f
        status: found
        text: Federal tax delinquency ~$15,000 (TY 2019-2022) and county property tax ~$2,300
      - id: g3
        factors:
        - A20b1
        status: found
        text: Sole caregiver for his mother 2012-2023; did not foresee tax on the 401(k) withdrawal
      - id: g4
        factors:
        - A20g
        status: found
        text: IRS plan March 2025, all payments made, paid off December 2025; property tax paid
      - id: g5
        factors:
        - A20d@initiated
        - A20d@established
        - A20b2
        status: found
        text: Debt-relief plan since October 2023, $108 every two weeks 'without fail'
      - id: g6
        factors:
        - A20b2
        status: found
        text: Two creditors cannot be located; pays a locator service $109/month
      - id: g7
        factors:
        - AX1
        status: found
        extension: true
        text: Most action taken before the SCA and the SOR
      - id: g8
        factors:
        - A20a
        status: found
        text: Keeps a budget counting only base hours
      outcome: A
      reason:
      - A20a
      - A20b1
      - A20b2
      - A20d@established
      - A20g
      reason_cite:
        page: 6
        section: Analysis, Guideline F
        anchor: I conclude AG ¶¶ 20(a), 20(b), 20(d) and 20(g) apply.
      flip_rules: []
      watch_for:
      - what: judge found him 'candid, sincere, forthcoming' and credible (p. 3)
        favors: A
      - what: a plan need not pay all debts at once (Appeal Board, ISCR 07-06482)
        favors: A
    conversion:
      split: heldout
      minutes:
        llm_draft: 0.2
        llm_read_share: 0.5
        llm_validate_share: 0.1
        decision_words: 2571
        human_review_estimate: 8
      misfits:
      - Credibility finding carries the unlocatable-creditor story; the schema has no slot for 'credible' as a modifier
        on a fact.
      - Two unresolved debts were found For Applicant on intent plus effort, not resolution; A20d as written ('adhering
        to ... repay') fits only loosely.
      - Caregiving for a parent is not in 20(b)'s example list; tagged A20b1 by analogy.
  DOHA-F-04:
    case:
      id: DOHA-F-04
      source:
        caseno: ISCR Case No. 26-00803
        date: 2026-08-19
        judge: Foreman
        record: FORM (written record)
        counsel: pro se
        url: https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262217/
      holding: 'Two charged-off debts (~$26,000) after pandemic income loss and an abrupt return from an overseas
        job to care for a child; she contacted creditors at the time and set up plans on both in March 2026, missing
        two payments when her hours were cut, then resuming. Granted.

        '
      options:
        A: grant
        B: deny
      decided_by: DOHA administrative judge
      agent_role: recommend
      default: B
      facts:
      - id: g1
        factors:
        - B19a
        - B19c
        status: found
        text: Personal loan charged off ~$16,000 (2022); credit card charged off ~$10,300 (2022)
      - id: g2
        factors:
        - A20b1
        status: found
        text: Pandemic income loss, underemployment, sudden sole custody in January 2022
      - id: g3
        factors:
        - A20b2
        status: found
        text: Contacted creditor at the time of hardship; set up plans once she could keep them
      - id: g4
        factors:
        - A20d@initiated
        status: found
        text: Plans since March 2026 (~$439 and ~$435/month); two missed payments, resumed June 2026
      - id: g5
        factors:
        - A20a
        status: found
        text: 19 on-time payments before the hardship; other obligations in good standing
      outcome: A
      reason:
      - A20a
      - A20b1
      - A20b2
      - A20d@initiated
      reason_cite:
        page: 5
        section: Analysis, Guideline F
        anchor: AG ¶ 20(d) is established because Applicant initiated, albeit recently, payment plans with both
          creditors
      flip_rules: []
      watch_for:
      - what: a long repayment horizon is not itself a reason to deny (ISCR 19-01624, fn. 1)
        favors: A
      - what: honorable Army service 1998-2006; federal contractor overseas
        favors: A
      - what: income again cut in early 2026 by regional instability
        favors: B
    conversion:
      split: heldout
      minutes:
        llm_draft: 0.2
        llm_read_share: 0.5
        llm_validate_share: 0.1
        decision_words: 2367
        human_review_estimate: 8
      misfits:
      - 'FORM case: judge states she could not assess credibility, yet found the promise to keep paying ''credible''
        from documents; demeanor-free credibility is not representable.'
      - Only ~3-4 payments ('albeit recently') satisfied 20(d) here, while 'too soon' defeated 20(d) elsewhere (DOHA-F-10);
        the A20d scale step is judge-dependent.
      - Missed payments after the plan began were excused by an outside event; no factor for a lapse that has an
        outside reason.
  DOHA-F-05:
    case:
      id: DOHA-F-05
      source:
        caseno: ISCR Case No. 25-01037
        date: 2026-09-08
        judge: Anderson
        record: hearing
        counsel: pro se
        url: https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262176/
      holding: 'Two medical collection accounts (~$130,000) from an emergency while thinly insured; after years
        of letting them age, he discharged them in Chapter 7 (filed after the SOR) and now carries adequate insurance
        and no other delinquencies. Granted, with a warning.

        '
      options:
        A: grant
        B: deny
      decided_by: DOHA administrative judge
      agent_role: recommend
      default: B
      facts:
      - id: g1
        factors:
        - B19a
        - B19c
        status: found
        text: Two medical accounts in collection, ~$130,000, on 2024 and 2025 credit reports
      - id: g2
        factors:
        - A20b1
        status: found
        text: Unexpected medical emergency in 2020; limited insurance; 4-6 weeks unpaid
      - id: g3
        factors:
        - BX2
        status: found
        extension: true
        text: Followed advice that the debts would drop off his credit report after seven years
      - id: g4
        factors:
        - A20d@initiated
        - A20d@established
        - BX1
        status: found
        text: Chapter 7 filed September 2025 (SOR August 2025), discharged December 2025
      - id: g5
        factors:
        - A20a
        status: found
        text: Now buys adequate insurance; no other account ever in collection; pays bills on time
      outcome: A
      reason:
      - A20b1
      - A20d@established
      - A20a
      reason_cite:
        page: 6
        section: Analysis, Guideline F
        anchor: To properly address these debts, he filed for Chapter 7 Bankruptcy, and had them both discharged.
        note: No mitigating subparagraph is named; the reason set is inferred.
      flip_rules:
      - if: +B19a (new delinquencies)
        then: B
        basis: 'p. 7: ''In the event that he does not continue to make his bills a priority to resolve, his security
          clearance will be immediately in jeopardy.'''
        scope: future
      watch_for:
      - what: supervisor, subordinate and childhood friend describe him as responsible
        favors: A
      - what: age 22 and low income when the debt arose (¶ 2(d)(4) maturity)
        favors: A
    conversion:
      split: casebook
      minutes:
        llm_draft: 0.2
        llm_read_share: 0.5
        llm_validate_share: 0.1
        decision_words: 2756
        human_review_estimate: 8
      misfits:
      - 'No named mitigator: the analysis never cites a ¶ 20 subparagraph; the reason set is inferred.'
      - Bankruptcy as 'otherwise resolve debts' is a legal-status fact, not an effort; A20d@established stretches
        to cover it.
      - The warning language approaches SEAD 4 ¶ 2(h) 'approval with a warning' (a third option) but the decision
        does not invoke ¶ 2(h).
      - 'Privacy: decision names specific diagnoses; converted at the level of the ¶ 20(b) example (unexpected medical
        emergency) only.'
  DOHA-F-06:
    case:
      id: DOHA-F-06
      source:
        caseno: ISCR Case No. 25-01544
        date: 2026-09-10
        judge: Foreman
        record: hearing
        counsel: pro se
        url: https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262170/
      holding: 'A young engineer, owed no tax, left her 2024 federal and state returns unfiled while an identity-theft
        claim was pending, and still had not filed after the IRS cleared her and the record was held open. Denied;
        the late-filed 2023 return was found for her.

        '
      options:
        A: grant
        B: deny
      decided_by: DOHA administrative judge
      agent_role: recommend
      default: B
      facts:
      - id: g1
        factors:
        - B19f
        status: found
        text: TY 2024 federal and state returns not filed when the record closed (August 31, 2026)
      - id: g2
        factors:
        - A20b1
        status: found
        text: 'Identity theft: someone filed a 2023 return in her name; IRS verified her claim July 2026'
      - id: g3
        factors: []
        status: found
        text: No tax owed for 2023-2025 by her own computation from W-2s
      - id: g4
        factors: []
        status: claimed
        credibility: rejected
        text: Says she waited because she thought the IRS suspected her of fraud
      outcome: B
      reason:
      - B19f
      reason_cite:
        page: 5
        section: Analysis, Guideline F
        anchor: Applicant was a victim of identity fraud, which was a condition largely beyond her control, but
          she has not acted
      flip_rules:
      - if: -B19f for a tax year (return filed, with an outside cause)
        then: A on that allegation
        basis: 'Formal findings p. 7: ''For Applicant for tax year 2023 and against Applicant for tax year 2024'''
        scope: allegation
      watch_for:
      - what: explanation found 'implausible and unpersuasive' (p. 3)
        favors: B
      - what: no taxes owed; filing is the concern, not money (ISCR 01-05340)
        favors: B
      - what: '''exceeds'' and ''far exceeds expectations'' performance ratings'
        favors: A
      - what: 'judge: she ''may be able to qualify ... at some time in the future'' (p. 6)'
        favors: A
    conversion:
      split: casebook
      minutes:
        llm_draft: 0.3
        llm_read_share: 0.5
        llm_validate_share: 0.1
        decision_words: 2692
        human_review_estimate: 8
      misfits:
      - Credibility finding decides the 20(b) 'acted responsibly' prong; the schema records it only as a watch_for.
      - No money is owed, so the current_burden equity is empty; the concern is purely rule compliance, which the
        catalog handles only because B19f has its own equity.
      - The 'at this time' judgment (temporal, too soon) has no representation beyond a watch_for.
  DOHA-F-07:
    case:
      id: DOHA-F-07
      source:
        caseno: ISCR Case No. 26-00114
        date: 2026-08-20
        judge: Driskill
        record: FORM (no response filed)
        counsel: pro se
        url: https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262211/
      holding: 'Six defaulted student loans and four consumer debts ($67,489), all unpaid; she left a teaching job
        expecting the cleared job to start, gave several hardship reasons, and planned to pay "as soon as" income
        was steady, but documented no payments. Denied.

        '
      options:
        A: grant
        B: deny
      decided_by: DOHA administrative judge
      agent_role: recommend
      default: B
      facts:
      - id: g1
        factors:
        - B19a
        - B19c
        status: found
        text: Six student loans transferred due to delinquency and four consumer debts, $67,489 total
      - id: g2
        factors:
        - A20b1
        status: found
        note: 'partly: some causes were her choices'
        text: Single parenthood, a family medical expense, rising costs, a gap between jobs
      - id: g3
        factors: []
        status: found
        text: $200 student-loan payments in April and May 2025 only; none since
      - id: g4
        factors: []
        status: claimed
        text: Arranging a structured student-loan plan; will pay cards when income is stable
      - id: g5
        factors: []
        status: found
        text: Own statement shows household net remainder of $2,633/month
      outcome: B
      reason:
      - B19a
      - B19c
      reason_cite:
        page: 5
        section: Analysis, Guideline F
        anchor: Not all of these factors are circumstances beyond her control but, even for those that are, she
          did not provide proof of responsible action taken toward the debts.
      flip_rules: []
      watch_for:
      - what: did not respond to the FORM; no documents to rebut
        favors: B
      - what: positive monthly remainder yet no payments (ability without action)
        favors: B
      - what: voluntarily reported the student loans on her SCA
        favors: A
    conversion:
      split: heldout
      minutes:
        llm_draft: 0.2
        llm_read_share: 0.5
        llm_validate_share: 0.1
        decision_words: 2343
        human_review_estimate: 8
      misfits:
      - Ability to pay without paying (net remainder $2,633) points to 19(b) 'unwillingness', which the judge did
        not find; the catalog cannot record a condition the judge left unargued.
      - A20b1 held only in part ('Not all of these factors are circumstances beyond her control'); the catalog has
        no partial-strength step for A20b1.
      - SOR amount errors corrected in a footnote; notice sufficiency is procedural and outside the schema.
  DOHA-F-08:
    case:
      id: DOHA-F-08
      source:
        caseno: ISCR Case No. 25-00880
        date: 2026-08-03
        judge: Dorsey
        record: FORM (written record)
        counsel: pro se
        url: https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262001/
      holding: 'Unfiled federal and two states'' returns across several years, a $13,417 federal tax balance, and
        two untouched consumer debts; he blamed divorce and unemployment, told the investigator non-filing was "deliberate,"
        and documented none of his claimed fixes. Denied; a 2016 bankruptcy and now-current student loans were found
        for him.

        '
      options:
        A: grant
        B: deny
      decided_by: DOHA administrative judge
      agent_role: recommend
      default: B
      facts:
      - id: g1
        factors:
        - B19f
        status: found
        text: Federal returns unfiled TY 2015, 2018, 2021, 2022; state returns unfiled 2015-2022
      - id: g2
        factors:
        - B19f
        - B19a
        status: found
        text: Federal tax owed for TY 2017, ~$13,417; intermittent payments, no current plan shown
      - id: g3
        factors:
        - B19a
        - B19c
        status: found
        text: Repossessed-vehicle balance unpaid since 2019; a second account he is not 'knowledgeable of'
      - id: g4
        factors:
        - A20b1
        status: found
        text: Self-employment, unemployment and a 2017 divorce preceded the lapses
      - id: g5
        factors:
        - A20e1
        status: claimed
        text: Says he does not know the second account; no dispute filed or documented
      - id: g6
        factors: []
        status: claimed
        text: Says missing federal returns are now filed; no transcripts provided
      outcome: B
      reason:
      - B19f
      - B19a
      reason_cite:
        page: 7
        section: Whole-Person Concept
        anchor: However, Applicant has unmitigated federal and state income tax issues and has not attempted to
          resolve two consumer debts.
      flip_rules:
      - if: -B19a on a debt (account current, small arrears)
        then: A on that allegation
        basis: student loans ¶¶ 1.h-1.i found For as current (p. 5)
        scope: allegation
      - if: old bankruptcy (>10 years) alleged alone
        then: A on that allegation
        basis: '¶ 1.e found For: ''it has been over 10 years'' (p. 5)'
        scope: allegation
      watch_for:
      - what: told investigator non-filing was 'deliberate' and he would file if 'forced to' (p. 3)
        favors: B
      - what: undocumented claims of filing and payment
        favors: B
      - what: honorable Navy service
        favors: A
    conversion:
      split: heldout
      minutes:
        llm_draft: 0.3
        llm_read_share: 0.5
        llm_validate_share: 0.1
        decision_words: 3048
        human_review_estimate: 9
      misfits:
      - His 'deliberate' / 'forced to' statement reads as 19(b) unwillingness, but the judge did not cite 19(b);
        the attitude lives only in watch_for.
      - 'A20e1 without A20e2: the judge called non-recognition ''a reasonable basis'' but demanded documents; the
        split prongs fit well here.'
      - The prior bankruptcy is both a disqualifier and 'too old'; the catalog has no age-of-conduct scale for B-factors.
  DOHA-F-09:
    case:
      id: DOHA-F-09
      source:
        caseno: ISCR Case No. 25-01260
        date: 2026-08-20
        judge: Harvey
        record: hearing
        counsel: pro se
        url: https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262221/
      holding: 'Seven years of unfiled federal returns and ~$148,000 in tax owed after a divorce and shift work;
        he disclosed it on his SCA, filed the overdue returns in October 2024 and March 2025, and paid an accepted
        offer in compromise in full. Every tax-debt allegation was mitigated, but the filing history was not. Denied.

        '
      options:
        A: grant
        B: deny
      decided_by: DOHA administrative judge
      agent_role: recommend
      default: B
      facts:
      - id: g1
        factors:
        - B19f
        - B19c
        status: found
        text: Federal returns for TY 2017-2023 not timely filed; under-withheld for years
      - id: g2
        factors:
        - B19f
        - B19a
        status: found
        text: Federal tax owed TY 2016-2022, ~$148,000 on transcripts
      - id: g3
        factors:
        - A20b1
        status: found
        note: '''does not fully apply'''
        text: Divorce, loss of home, shift work; a preparer who did not file
      - id: g4
        factors:
        - A20g
        status: found
        text: Offer in compromise accepted 2025 and paid off May 2026; state returns filed and paid
      - id: g5
        factors:
        - BX1
        status: found
        extension: true
        text: Filing and payment plan may be related to the clearance process
      - id: g6
        factors: []
        status: found
