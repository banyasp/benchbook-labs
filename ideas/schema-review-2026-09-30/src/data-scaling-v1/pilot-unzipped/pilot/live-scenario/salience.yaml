  note: "The decision's summary says '$54,000' but its six itemized debts sum to ~$41,600; the scenario follows the itemization. The decision also names 1.c/1.f as the program debts in one place and 1.c/1.e in another; the scenario follows the SOR list (1.c, 1.e in program; 1.d, 1.f unlocatable)."

items:
