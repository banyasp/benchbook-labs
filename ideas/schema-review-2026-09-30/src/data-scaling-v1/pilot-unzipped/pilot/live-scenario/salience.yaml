            "Action: \"Was on a payment plan paying $135 month, had to stop in 2024. Will set up a new\n     plan with IRS.\"",
            "Entry #2  Pay | 2025-2026 (Est.) | County | Property | $2,000 (Est.) | Not satisfied",
            "ClearPath Debt Resolution, [city], AZ. \"Since Oct 2026, I pay $119 every 2 weeks, they\n   negotiate with the credit cards. Two of the cards they could not find.\"",
            "Entry #1  Summit Ridge FCU, credit card, ~$12,500, charged off 2023, \"in ClearPath program\"",
            "Entry #2  Pinecrest, loan, ~$6,000, charged off 2023, \"in ClearPath program\"",
            "Entry #3  \"Two other cards (Lantern, and a store card) - cant find who has them now\"",
            "Father: ESQUIVEL, Ignacio -- DECEASED 08/2026"]
