  place_employer: "unstated city, unnamed defense contractor -> Fountain / Colorado Springs, CO; Kestrel Ridge Technologies (invented)"
  parent: "mother (sole caregiver 2012-2023) -> father (2015-2026)"
  covid_stop: "IRS plan stopped 'due to Covid' -> overtime cut at the post (a 2024 pandemic would be anachronistic)"
  amounts: {fed_tax: "15,010.75 -> 16,812 (x1.12)", property_tax: "2,269.99 -> 2,066 (x0.91)",
            c: "11,737 -> 12,676 (x1.08)", d: "2,600 -> 2,990 (x1.15)", e: "7,000 -> 6,160 (x0.88)",
            f: "3,000 -> 3,210 (x1.07)", home: "45,000 / 12,000 down -> 49,500 / 13,200", program: "$108 -> $119 biweekly (x1.10)",
            locator: "$109 -> $98 monthly (x0.90)", early_irs_plan: "$120 -> $135 (x1.125)"}
  dates: {caregiving_start: "2012 -> 2015", k401: "2019 -> 2022", irs_plan_1: "10/2020 -> 10/2023", parent_death: "08/2023 -> 08/2026",
          program_enrolled: "10/2023 -> 10/2026", sca: "08/17/2024 -> 08/14/2027", irs_plan_2: "03/2025 -> 03/2028",
          sor: "07/25/2025 -> 07/21/2028", irs_payoff: "12/2025 -> 12/2028", hearing: "08/13/2026 -> 08/14/2029"}
