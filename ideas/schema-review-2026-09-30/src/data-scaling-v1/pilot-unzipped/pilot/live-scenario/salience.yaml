            "\"I only count my base hours, overtime goes to the IRS or the county when I get it.\""]
  - id: 06_SOR-and-answer
    role: decisive
    factors: [B19f, B19a, B19c]
    note: "The allegations; the answer's claims are corroborated elsewhere (items 08, 03)."
