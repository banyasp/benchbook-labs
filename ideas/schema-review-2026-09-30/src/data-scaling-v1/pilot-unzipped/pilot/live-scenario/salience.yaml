    factors: [A20g, A20a]
    note: "IRS installment agreement 03/2028, before the SOR. All returns filed, so B19f here is failure to PAY only. The PFS counts base hours only (A20a). The positive remainder is a near-miss for 19(b) 'unwillingness', which is wrong here because he is paying."
