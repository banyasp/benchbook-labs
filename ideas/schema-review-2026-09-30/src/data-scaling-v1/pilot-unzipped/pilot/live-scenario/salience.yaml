    factors: [B19a, B19c, A20a, A20d@initiated]
    note: "Four derogatory lines = SOR 1.c-1.f. 17 of 21 tradelines are noise. Near-misses: Monument Peak 'was 30 days 04/2024' (old, during the caregiving period); the paid 2021 medical collection; the Valora -4471/Northgate lines (a different account from 1.f's -7710). No public records: taxes never appear on credit reports."
    spans: ["SUMMIT RIDGE FCU MC (I)           2093  06/2016  05/2029  12,676     6,761    6,761    CHARGED OFF 01/2023; DOFD 06/2022;",
            "PAYING UNDER PARTIAL PMT AGREEMENT",
            "PINECREST CONSUMER FINANCE (I)    5518  08/2019  05/2029  8,000      3,388    3,388    CHARGED OFF 03/2023; DOFD 09/2022;",
            "LANTERN CARD SERVICES (I)         8830  02/2013  02/2024  3,000      2,990    2,990    CHARGED OFF 11/2022; ACCT CLOSED BY",
            "GRANTOR; NO CURRENT SERVICER REPORTED",
            "VALORA RETAIL CR/ALPINE OUTFTRS   7710  10/2017  09/2025  3,000      3,210    3,210    CHARGED OFF 04/2023; DOFD 10/2022",
            "CANYON STATE BANK MH LN (I)       0612  04/2022  05/2029  36,300     29,884   0        CURRENT, 0x30 -- manufactured home"]
  - id: 04_subject-interview-summary
    role: decisive
    factors: [A20b1, A20d@initiated, AX1, A20a]
    note: "Cause (caregiving, untaxed 401(k) distribution), the early IRS plan and why it stopped, program enrollment before the SCA (AX1). About 55% of the item is routine (residence, employment, travel, police, alcohol) noise."
