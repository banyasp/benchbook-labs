  - id: 02_SCA-excerpts
    role: decisive
    factors: [B19f, B19a, B19c]
    note: "Voluntary disclosure of taxes, program and collections on the SCA (whole-person: candor). ClearPath is a debt-settlement firm, not 'financial counseling' (near-miss for A20c1; the real judge did not apply 20(c)). Sections 11-23 are noise; 20C travel is a red herring."
    spans: ["26.3 In the last seven (7) years have you failed to file or pay Federal, state, or other\n      taxes when required by law or ordinance?  YES",
            "Entry #1  Pay | 2022-2025 (Est.) | IRS | Federal income | $17,000 (Est.) | Not satisfied",
