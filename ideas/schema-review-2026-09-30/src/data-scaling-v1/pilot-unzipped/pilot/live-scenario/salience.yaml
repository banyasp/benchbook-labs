  from_case: DOHA-F-03
  source_url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/ISCR-Hearing-Decisions/2026-ISCR-Hearing-Decisions/FileId/262165/"
  agent_role: recommend          # bench-support agent drafts a memo; the judge decides
  decision_point: "Recommend grant (A) or deny (B) on ISCR 28-01317, and flag post-record items"
  gold:
    r_gold: A                    # the real judge's outcome
    solver_on_gold_tags: {support: bounded, residual_equity: rule_compliance}   # from run_heldout.py (held-out)
    gold_tags: [B19a, B19c, B19f, A20a, A20b1, A20b2, A20d@initiated, A20d@established, A20g]
    gold_tags_extension: [AX1]
    real_reason: [A20a, A20b1, A20b2, A20d@established, A20g]
    expected_flags:
      - "CVP alert (item 10) arrived after the record closed and reports the SAME account as SOR 1.c (ending 2093, DOFD 06/2022, balance $6,761): not a new delinquency; the judge decides whether to reopen the record; ask whether the settlement terms carry over to the new holder."
      - "Northgate letter (item 08, AE E-3) settles a DIFFERENT Valora account (ending 4471), not SOR 1.f (ending 7710); 1.f stays unresolved."
    a_gold: null                 # Peter's blind label goes here before he reads r_gold
  size: {items: 15, case_file_items: 11, queue_items: 4, words: 4497}

