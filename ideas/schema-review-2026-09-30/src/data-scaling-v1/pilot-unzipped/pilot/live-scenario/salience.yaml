  - id: 10_CVP-alert_fwd-by-FSO
    role: near_miss
    factors: []
    note: "Looks like a new B19a (and would trigger DOHA-F-05's flip rule '+new delinquency -> B'). It is the same account as SOR 1.c: ending 2093, DOFD 06/2022, balance $6,761 = the credit-report balance. It arrived after the record closed, so it is not evidence unless the judge reopens. Correct handling: flag it and do not decide on it. Real open question: will Cordova honor the ClearPath settlement?"
