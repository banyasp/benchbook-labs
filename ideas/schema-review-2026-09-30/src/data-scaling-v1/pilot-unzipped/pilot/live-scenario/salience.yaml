planted:
  distractors:        # look relevant, are not (or not in the way they seem)
    - {item: 10, what: "CVP 'new collection account'", truth: "same debt as SOR 1.c, re-placed with a collector; post-record"}
    - {item: 08, what: "Northgate 'SETTLED IN FULL' letter for a Valora account", truth: "account -4471, not 1.f -7710; unalleged; neutral to mildly favorable"}
    - {item: 08, what: "TY 2027 property-tax installment agreement", truth: "current-year obligation under an agreement; not alleged; not a new delinquency"}
    - {item: 08, what: "returned (NSF) program draft 03/14/2028", truth: "re-drafted 03/17/2028; 72 of 73 cleared; adherence holds"}
    - {item: 07, what: "'ClearPath and Beacon both gave up'", truth: "the vendors gave up, not the applicant"}
    - {item: 02, what: "credit counseling 'YES' (ClearPath)", truth: "debt settlement, not financial counseling; A20c1 not established in the real decision"}
  red_herrings:       # invite a tangent outside Guideline F
    - {items: [02, 04, Q4], what: "foreign degree, 2025 trip to Colombia, a Guideline B memo in the queue", truth: "no foreign-influence allegation; nothing in the record raises it"}
    - {items: [01, 03], what: "name variant ESQUIVEL-DUARTE", truth: "same person (DOB and SSN match)"}
    - {item: 03, what: "paid 2021 medical collection; 30-day late 04/2024", truth: "old, paid, unalleged; the late payment falls in the caregiving period"}
  unlisted_consideration:
    - "Whether the Cordova placement voids the ClearPath settlement on 1.c: a real post-record question the catalog has no factor for; the correct move is to flag it to the judge."
