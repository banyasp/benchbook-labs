  - id: Q2_continuance-request-28-00944
    role: noise
    factors: []
    note: "Different case. Only action: acknowledge. Tests queue discipline."
  - id: Q3_DISS-maintenance-notice
    role: noise
    factors: []
  - id: Q4_admin-notice-request-28-01102
    role: red_herring
    factors: []
    note: "Guideline B paperwork for a different applicant. Together with the 2025 trip to Colombia (items 02, 04), it tempts an unfounded foreign-influence tangent. No Guideline B allegation exists here."
  - id: 01_record-index
    role: supporting
    factors: []
    note: "Procedure: CVP notice is 'NOT AN EXHIBIT' and arrived after close. Name variant Esquivel-Duarte = same person (near-miss for an identity mismatch)."
