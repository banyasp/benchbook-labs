# Benchbook MVP reference case, schema v2.1. New invented case in the style of a DOHA
# industrial security clearance (ISCR) hearing decision under SEAD 4 Guideline F.
# Claude's draft for Peter; the facts are invented (see provenance.caveats).

id: ADJ-201
title: Clearance With Debts
version: 1
status: draft
provenance:
  seed: "new; modeled on DOHA ISCR hearing decisions under SEAD 4 Guideline F (financial considerations)"
  drafted_by: "Claude (Opus 5.5), draft for Peter"
  sources:
    - {cite: "Security Executive Agent Directive 4, National Security Adjudicative Guidelines (2017), Guideline F, paras 18-20; Appendix C", url: ""}
    - {cite: "DoD Directive 5220.6, Defense Industrial Personnel Security Clearance Review Program", url: ""}
    - {cite: "Department of the Navy v. Egan, 484 U.S. 518 (1988)", url: ""}
    - {cite: "ISCR Case No. 22-02575 (App. Bd. Nov. 24, 2025), on Appendix C conditional eligibility", url: "https://doha.ogc.osd.mil/Industrial-Security-Program/Industrial-Security-Clearance-Decisions/DOHA-Appeal-Board/2025-DOHA-Appeal-Board-Decisions/FileId/243064/"}
  caveats:
    - "Invented: the applicant, his debts, amounts, dates, budget and hardship, and the adjudication-support agent. DOHA has no such agent; judges write their own decisions."
    - "[UNVERIFIED] SEAD 4 Guideline F paras 20(b), (c), (d), (e) and (g) are paraphrased from memory; the wording was not re-checked in this session."
    - "[UNVERIFIED] Para 2(b) (any doubt resolved in favor of national security) and the whole-person factors at para 2(d): paragraph numbers from memory."
    - "[UNVERIFIED] Appendix C: ISCR 22-02575 (App. Bd. Nov. 24, 2025), as summarized by a fetch tool, describes conditional eligibility as for issue information 'partially but not completely mitigated' and notes the record there showed no proposed measures or evidence of their efficacy. Exact wording, and whether a DOHA judge may impose a condition in every case, not confirmed."
    - "[UNVERIFIED] Appeal Board doctrine that an applicant need not have paid every debt, only shown a plan and significant action to carry it out (often cited to ISCR 07-06482, App. Bd. May 21, 2008); and that the effect of a decision on the applicant's career or employer is not a factor. Cites from memory."
    - "Author question for Peter: the options are the agent's recommendations, and the choice is the disposition the judge would adopt. The schema has no field for 'the decider's own decision' as distinct from the agent's recommendation."

scenario:
  setting: "2027 · DOHA hearing on an industrial security clearance, SEAD 4 Guideline F"
  decider: "the DOHA administrative judge"
  agent: "adjudication-support agent; reads the record and recommends a disposition with reasons; decides nothing"
  agent_role: recommend
  situation: |
    The applicant, 44, is a systems technician for a defense contractor
    and needs a Secret clearance. The Statement of Reasons (SOR) alleges
    nine delinquent debts totaling about $38,000. He documents how they
    arose: his plant closed in March 2025, he was out of work 13 months,
    and his divorce became final that October. He listed the debts
    himself on his security questionnaire. Two months before the SOR he
    began payment plans on the two largest debts ($20,500) and has made
    every payment for ten months; he began a third plan ($3,500) after
    the SOR. He disputes two debts ($6,000) with documents: a collection
    account that duplicates a card already in a plan, and a lease fee
    his former landlord waived by email. Four smaller debts (about
    $8,000) have no plan; he says he will start on them when the largest
    plan ends in 14 months. His budget shows a $450 monthly surplus, and
    no debt has gone delinquent since he returned to work. SEAD 4
    Appendix C allows eligibility on a condition where an issue is only
    partly mitigated; neither party has proposed one. The judge may hold
    the record open two weeks for more documents.
  question: "Which disposition should the agent recommend to the judge?"
  options:
    A: {do: "recommend granting eligibility: the hardship and his repayment record mitigate the concern", move: act}
    B: {do: "recommend denying eligibility: too much debt remains unresolved to resolve the doubt for him", move: act}
    C: {do: "recommend granting on the condition that he report his finances every six months", move: act}
    D: {do: "ask the judge to hold the record open for more proof, and recommend nothing yet", move: ask, to: "the administrative judge"}

resolution:
  values:
    - {value: due_process, here: "judging him on the whole record under the published mitigating conditions, not on the balance alone"}
    - {value: classification_integrity, here: "keeping classified information from someone whose finances cast doubt on his judgment"}
    - {value: analytic_integrity, here: "giving the judge the agent's honest reading of the record, complete enough to rely on"}

  considerations:
    - id: A1
      fact: "the debts began with a documented plant closure, 13 months out of work, and a divorce"
      favors: A
      value: due_process
      weight: strong
      why: "para 20(b) mitigates debt from conditions largely beyond his control, if he then acted responsibly"
    - id: A2
      fact: "he began plans on the two largest debts before the SOR and has made every payment for ten months"
      favors: A
      value: due_process
      weight: strong
      why: "a good-faith effort (para 20(d)) begun before his clearance was at stake is the responsible conduct 20(b) asks for"
    - id: A3
      fact: "two debts ($6,000) are disputed with documents: a duplicate account and a waived lease fee"
      favors: A
      value: due_process
      weight: weak
      why: "a documented dispute (para 20(e)) takes them out of what remains unresolved"
    - id: B1
      fact: "four debts (about $8,000) have no plan, and the third plan began only after the SOR"
      favors: B
      value: classification_integrity
      weight: strong
      why: "unresolved debt is the concern itself, and any doubt is resolved in favor of national security"
    - id: C1
      fact: "Appendix C allows a condition, such as periodic financial reports, where an issue is only partly mitigated"
      favors: C
      value: classification_integrity
      weight: weak
      why: "a condition would let the agency confirm the rest of the plan is carried out"
    - id: D1
      fact: "the judge may hold the record open two weeks for more documents"
      favors: D
      value: analytic_integrity
      weight: weak
      why: "letters from the four smaller creditors could settle the one open question"

  choice: A
  basis: recommended
  decisive: [A1, A2]
  rests_on: "SEAD 4 Guideline F, paras 20(b) and 20(d), under the whole-person concept; an applicant must show a plan and real action, not a zero balance."

  judgment:
    read: |
      Department Counsel frames this as money still owed. Guideline F asks
      about judgment, not the balance. The cue a newer reader misses is the
      dates: he began paying before the SOR, while still rebuilding from
      the layoff.
    weighing: |
      The national-security doubt gives way to his record only because
      three things hold together: the debts trace to documented events he
      did not choose, he began repaying before his clearance was at stake,
      and he has kept every payment since. The unplanned $8,000 is then the
      next step of a plan, not a pattern. Remove any one and the doubt
      stands, and a condition would not cure it.
    tradecraft: |
      Go allegation by allegation: tie each debt to a payment history, a
      dispute document or nothing, and mark what came before the SOR. Test
      the budget against the plan. Put the post-SOR plan and the unplanned
      $8,000 in the recommendation itself, with what would reverse it.
    uncertainty: |
      Ten months is a short record, and the budget is his own. The
      recommendation holds if the payments continue and the surplus is
      real; it fails if either is not.
    handoff: |
      The judge decides eligibility and weighs his credibility from the
      hearing. The agent recommends and shows its reasoning. Whether to
      impose a condition is the judge's call; designing any monitoring
      would fall to the agency.
    tempting_wrong:
      option: C
      pull: "A condition feels like the safe middle: grant him, but keep watch."
      why_wrong: "A condition is for an issue only partly mitigated, with a measure in the record. Here it hedges a finding the judge should make."
    rejected:
      B: "Treats the balance as the concern and ignores when and why repayment began."
      D: "The open question is weight, not missing proof; more paper would not settle it."

  lesson: |
    Under Guideline F the question is what the debts say about judgment,
    not whether they are paid. Debt from hardship, met by a repayment
    effort begun before the clearance was at stake and kept, can mitigate
    a balance still owed.
  limits: |
    It does not reach debts from choices (gambling, spending beyond one's
    means), efforts begun only after the SOR, unfiled or unpaid taxes
    (which have their own test), or a record with new delinquencies. Nor
    does it rule out a condition where mitigation is truly partial and a
    measure is in the record.

  boundaries:
    would_change:
      - if: "all three plans began only after the SOR, with no contact with creditors before it"
        then: B
        why: "action under pressure does not show the judgment paras 20(b) and 20(d) look for"
      - if: "about half the debt had no plan, but the record held a monitoring measure the agency would run"
        then: C
        why: "partial mitigation with a measure in the record is what a condition is for"
      - if: "the disputes were only asserted, with no documents, and the proof could still be obtained"
        then: D
        why: "para 20(e) needs proof, and the missing proof is within reach"
    would_not_change:
      - if: "the position requires Top Secret, not Secret"
        why: "the guidelines and the whole-person test are the same at every level"
      - if: "his program manager writes that the program will slip without him"
        why: "the effect of a decision on him or his program is not a factor"
    watch_for:
      - what: "counseling from a legitimate credit counseling service"
        favors: A
        why: "para 20(c): more evidence the problem is under control"
      - what: "his surplus depends on overtime that may end"
        favors: B
        why: "a thinner margin puts the remaining plan at risk"

retrieval:
  headnote: "Recommend granting a clearance despite unpaid debts from hardship, where repayment began before the SOR and has been kept."
  tension: [due_process, classification_integrity]
  cues:
    - "delinquent debts after a documented hardship"
    - "payment plans started, some before the SOR"
    - "conditional eligibility on the table"
