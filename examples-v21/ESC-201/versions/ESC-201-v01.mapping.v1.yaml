# Gold-standard mapping for ESC-201-v01 served ESC-201 (an SFT target). Claude's draft;
# anchors match ESC-201-v01.live.yaml gold (PROPOSED LABEL - for Peter).

mapping:

  frame:
    question: "Which course should the cell recommend when Green will land a construction crew on the shoal in two days?"
    owner: "the principal decides; Green owns its dispute and any joint release"
    my_role: "recommend: I give the cell's best course and say how contested it is; I task no forces and contact no government"
    values: [escalation_control, partner_relationship, norm_reciprocity, oversight_candor]

  fit:
    case: ESC-201
    rating: close
    why: "Same question, decider, role and options; the same white-hull contest. One added fact: Green is about to change the status quo itself."
    options: {A: A, B: B, C: C, D: D}

  compare:
    - ref: A1
      live: "harassment escalated daily, from shadowing to blocking"
      here: same
      matters: "no"
      why: "Unchanged; still the reason quiet has a cost."
    - ref: A2
      live: "Green asked privately for 'visible support'"
      here: same
      matters: "no"
      why: "Unchanged as a request. What visible support would now signal is weighed below."
    - ref: B1
      live: "militia pressing; Red's frigates 40 nm off with their warning"
      here: same
      matters: "no"
      why: "Still rules out the warship, for the reference's reason."
    - ref: B2
      live: "the passes still breach the collision rules, and the imagery is releasable"
      here: same
      matters: weighs
      why: "The breach is as real, but a release beside Green's landing blunts the rules argument it was meant to make."
    - ref: B3
      live: "the treaty still calls for consultation"
      here: same
      matters: "no"
      why: "Consultation is still owed and now more urgent. It is the joint release that changes."
    - ref: C1
      live: "the deputy-minister channel is still open"
      here: same
      matters: "no"
      why: "Unchanged."

  new:
    - live: "Green's cabinet will land a construction crew on the shoal Thursday; Blue publicly opposes new construction by any claimant"
      favors: C
      value: escalation_control
      matters: decides
      why: "The reference published to make Red's conduct the story at no military cost. Two days before the landing, a joint release makes Blue's backing of the landing the story and binds Blue to a move its own policy opposes."

  carry:
    relation: distinguished
    settled: "The warship is still out: a white-hull contest, Red's frigates and named warning (B1). The answer stays in non-military terms."
    open: "Whether to go public when the partner is about to change the status quo itself. The reference assumed Green was only the one pressed. Its weighing valued publication for exposing Red cheaply; here its main effect is tying Blue to Green's landing, so the quiet course is what that weighing leaves."

  decide:
    choice: C
    confidence: 0.6
    now: "Recommend C by 1600. Lead the note with Green's planned landing and Blue's stated policy; advise raising the landing with Green privately before anything goes public; hold the imagery; keep the destroyer where it is; say the call is contested and give the case for B."
    would_change_my_mind: "Green drops or postpones the landing, or it proves to be repair of an existing marker, not new construction: back to B."
