# Benchbook MVP reference case, converted from v6 AUT-001 (Peter's vessel case).
# v2 (2026-10-01, Peter's request): the stakes of capture are spelled out as what they
# are for, the lives of the fleet's other crews; the module carries no weight of its own.
# Values move from mission_effect to own_force_life.
# The spine (options, considerations, choice, boundaries) follows v6 exactly.
# The situation text and all judgment prose are Claude's DRAFT for Peter to
# overwrite: they are the author's reasoning, and the author is Peter.

id: AUT-001
title: Last Crew Member Ashore
version: 2
status: draft
provenance:
  seed: "Peter's v6 exemplar (benchbook-sections-v6.md)"
  drafted_by: "Peter (spine); Claude (situation text and judgment prose, draft)"
  sources: []
  caveats:
    - "Invented scenario: the vessel, the landing party, the fleet C2 module and every time and estimate are illustrative, not a real event."
    - "Situation text and judgment prose are Claude's draft for Peter to overwrite; the spine is his."
    - "Open author question: would_change[2] (likely alive and reachable -> ask) descends from v6's scaled B2, which the MVP card no longer lists as a consideration."

scenario:
  setting: "2029 · crewed patrol vessel extracting a landing party from a contested shore"
  decider: "the mission commander, aboard"
  agent: "ship-control agent; carries out the commander's orders"
  agent_role: execute
  situation: |
    The landing party is back aboard except one crew member. Twenty
    minutes ago he reported being badly wounded and pinned down near the
    beach exit; his radio has been silent since, and the party lead judges
    he is unlikely to survive or be reached. Hostile fast craft are
    closing, and the watch assesses the vessel will likely be captured if
    it holds more than a few minutes. Aboard is the fleet's
    command-and-control module. Captured intact, it would let the enemy
    read the fleet's tactical network and issue orders on it until every
    ship is rekeyed, about three days. Twenty-three ships and some 1,900
    sailors operate on that network, two of them escorting a supply
    convoy through the strait tonight. The module cannot be wiped or
    destroyed in the time left.
  question: "Depart now, leaving one crew member ashore, or hold for him?"
  options:
    A: {do: "depart now and report his last known position", move: act, irreversible: true}
    B: {do: "hold offshore until he is recovered or confirmed lost", move: act}

resolution:
  values:
    - {value: own_force_life, here: "the crews of the fleet's 23 ships at sea, whose positions and orders capture would be exposed"}
    - {value: duty_to_individual, here: "the crew member left ashore"}

  considerations:
    - id: c1
      fact: "the fleet's C2 module is aboard; captured, it would expose the positions and orders of 23 ships and some 1,900 sailors for about three days"
      favors: [A]
      value: own_force_life
      weight: strong
      why: "what is at stake is those crews' lives, not the equipment: exposed ships can be found, targeted or sent false orders"
    - id: c2
      fact: "capture is likely if the vessel holds"
      favors: [A]
      value: own_force_life
      weight: strong
      why: "waiting makes that exposure likely, not remote"
    - id: c3
      fact: "the module cannot be wiped or destroyed in time"
      favors: [A]
      value: own_force_life
      weight: strong
      why: "leaving is the only protection left for those crews"
    - id: c4
      fact: "one crew member is still ashore"
      favors: [B]
      value: duty_to_individual
      weight: strong
      why: "the vessel owes him recovery"

  choice: A
  basis: recommended
  decisive: [c1, c2, c3]

  judgment:
    read: |
      It looks like one life against a piece of equipment. It is one life,
      with slim odds, against some 1,900 sailors whose positions and orders
      capture would expose for days. The cue a novice misses: nothing else
      now protects them.
    weighing: |
      The duty to a crew member gives way only because three things hold
      together: the harm reaches the lives of crews beyond this vessel,
      waiting makes it likely, and only leaving prevents it. Take away any
      one and the duty to him governs. The module weighs nothing in itself;
      it counts only through the people its capture would expose. His low
      odds lighten the cost of leaving but are not the reason; if he could
      likely be saved, this case would not settle it.
    tradecraft: |
      Set a departure time from the capture estimate and keep to it. Until
      then, keep trying to reach him and re-check that the module has no
      other protection. Leave his last position for a later recovery, and
      report the decision and its reasons at once.
    uncertainty: |
      His condition, the capture estimate and the three-day exposure are
      judgments under pressure. The choice survives if he might live but
      cannot be reached in time; it fails if capture is unlikely or the
      fleet could rekey before anyone is exposed.
    handoff: |
      The commander owns this call, with no time to take it higher.
      It would go up only if the crew member were likely to be saved. The
      agent carries out the order and reports it; it does not re-weigh it.
    tempting_wrong:
      option: B
      pull: "'Never leave anyone behind' feels like the loyal answer."
      why_wrong: "It stakes the safety of crews across the fleet on a slim chance of saving one person."

  lesson: |
    A crew member may be left behind only when waiting would likely put
    other people's lives beyond the unit at risk and leaving is the only
    way to prevent it. Short of that, the duty to the individual governs.
  limits: |
    It does not reach local stakes (the vessel or its cargo alone), a
    threat that is possible rather than likely, equipment whose loss
    endangers no one or can be made harmless in time (destroyed, moved,
    or a network rekeyed before anyone is exposed), or a person who can
    probably be recovered. Nor does it transfer authority: a commander
    made this call, and an agent does not inherit it by analogy.

  boundaries:
    would_change:
      - if: "the module can be wiped or destroyed before capture"
        then: B
        why: "leaving is no longer the only protection"
      - if: "no fleet-wide module is aboard; only the vessel and its crew are at risk"
        then: B
        why: "a local loss does not outweigh the duty to him"
      - if: "he is likely alive and can be reached"
        then: ask
        why: "a savable life against fleet-wide exposure is a trade this case does not settle"
    would_not_change:
      - if: "the closing craft belong to a militia rather than a navy"
        why: "capture by anyone still exposes the fleet's crews"
      - if: "the person ashore is a contracted civilian mariner, not a sailor"
        why: "the duty runs to everyone in the vessel's charge"
    watch_for:
      - what: "holding would also put the crew aboard at risk"
        favors: [A]
        why: "a second reason to leave"
      - what: "a captured crew member could be exploited for what he knows"
        favors: [B]
        why: "a reason to recover him; its weight depends on what he knows"

retrieval:
  headnote: "Depart under threat, leaving a crew member ashore, so a captured C2 module cannot expose the fleet's crews."
  tension: [own_force_life, duty_to_individual]
  cues:
    - "someone left behind under time pressure"
    - "equipment whose capture would endanger people elsewhere"
    - "no time to destroy or remove it"
