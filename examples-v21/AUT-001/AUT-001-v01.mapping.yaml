# Gold-standard mapping for AUT-001-v01 (restyle) served AUT-001. Claude's draft (an SFT target).

mapping:

  frame:
    question: "Withdraw now, leaving one badly wounded soldier behind, or hold the column for him?"
    owner: "the convoy commander, in the command vehicle; there is no time to take it higher"
    my_role: "execute: I move the column on his order and report it. I map the case so I carry out his order without delay and can tell him if a boundary fires."
    values: [mission_effect, duty_to_individual]

  fit:
    case: AUT-001
    rating: close
    why: "Same question (leave one person behind under threat, or wait), same values in tension, same kind of decider: a commander on the spot with no time to go higher. Only the setting differs: a road instead of a shore, a theater node instead of a fleet module."
    options: {A: A, B: B}

  compare:
    - ref: c1
      live: "the theater's C2 node is in the column; every brigade relies on it"
      here: same
      matters: "no"
      why: "Its capture harms every unit that relies on it, as the fleet module's would. The harm still reaches beyond this convoy."
    - ref: c2
      live: "the intelligence cell assesses capture as likely if the column stays more than a few minutes"
      here: same
      matters: "no"
      why: "Likely, not remote, as in AUT-001."
    - ref: c3
      live: "the node cannot be wiped or destroyed in time, and its vehicle cannot leave without the column"
      here: same
      matters: "no"
      why: "Leaving is still the only protection. A convoy could split where a vessel cannot, so I checked: the node cannot go ahead alone."
    - ref: c4
      live: "one soldier is cut off, badly wounded, silent for fifteen minutes, judged unlikely to survive or be reached"
      here: same
      matters: "no"
      why: "The same duty, and odds as slim as the crew member's. AUT-001's 'likely alive and reachable' item does not hold."

  new: []

  carry:
    relation: follows
    settled: "All three conditions AUT-001 requires hold together: the harm reaches beyond the convoy, waiting makes it likely, and leaving is the only protection. So the duty to the soldier gives way, as it did to the crew member. His slim odds are not the reason; the three conditions are."
    open: "Nothing of substance. None of AUT-001's would-change items holds, and its would-not-change items (who captures, the person's status) are not in play. The call stays the commander's."

  decide:
    choice: A
    confidence: 0.85
    now: "Set the departure time from the capture estimate and give it to the commander; until then keep trying the soldier's radio and re-check that the node has no other protection; on his order, withdraw, log the soldier's last position for recovery, and report the decision and its reasons to theater command."
    would_change_my_mind: "Word that the node can be wiped in time, or that the column is not in fact at risk of capture: then AUT-001 says hold (B)."
