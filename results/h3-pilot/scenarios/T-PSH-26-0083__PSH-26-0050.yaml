case:
  id: DR-H3-PSH-26-0083-PSH-26-0050-PSH-26-0083@v1
  title: Guideline G Alcohol Consumption Security Concern – Access Authorization Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 26 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, was arrested for DUI in May
    2025 with a blood alcohol concentration of 0.302%, did not report the arrest to
    DOE, and was later diagnosed with severe Alcohol Use Disorder based on a January
    2026 psychological evaluation and a PEth test showing 1,476 ng/mL. Since the arrest,
    the Individual has attended AA meetings, enrolled in an outpatient treatment program,
    taken medication to suppress cravings, and used a handheld BAC device to record
    negative results for a week in July 2026, but has not completed the recommended
    intensive outpatient program or provided follow‑up PEth testing. The DOE Psychologist
    testified that the Individual has not satisfied treatment recommendations and
    his prognosis is guarded. The Local Security Office cited Guideline G of the Adjudicative
    Guidelines as the basis for the security concern.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge defers the decision pending further PEth testing.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge requests additional evaluation of the Individual’s
        treatment.
      move: ask
      irreversible: false
    O4:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with DUI in May 2025, with a blood
      alcohol concentration of 0.302% and a vehicle collision.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual did not report the arrest to DOE, believing reporting was
      required only for convictions.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The DOE Psychologist diagnosed the Individual with Alcohol Use Disorder,
      Severe, meeting eight DSM‑5‑TR criteria.
  - id: F4
    kind: situation
    status: confirmed
    fact: A PEth test performed in January 2026 was 1,476 ng/mL, indicating extremely
      high alcohol consumption over the prior thirty days.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual has attended AA meetings at least weekly since March 2026
      and obtained a sponsor in June 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual enrolled in an outpatient AUD treatment program in June 2026,
      began medication to suppress cravings, and reports his last drink was on June
      27 2026.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual used a handheld BAC device from July 5‑12 2026 and submitted
      negative BAC results for each day.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The DOE Psychologist testified that the Individual had not completed treatment
      recommendations, had not provided PEth testing, and his prognosis is guarded.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline G (Alcohol Consumption) of the
      Adjudicative Guidelines as the basis for the security concern.
  - id: F10
    kind: authority
    status: confirmed
    fact: The Administrative Judge must determine whether the Individual’s access
      authorization can be restored in accordance with 10 C.F.R. § 710.7(a).
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The DOE Psychologist diagnosed severe Alcohol Use Disorder, meeting eight
      DSM‑5‑TR criteria, and the PEth level of 1,476 ng/mL demonstrates extremely
      high recent alcohol consumption, satisfying Guideline G concerns of impaired
      judgment and unreliability.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The Individual has not completed the psychologist’s recommended intensive
      outpatient program, has provided no follow‑up PEth testing, and the psychologist
      testified that treatment progress is insufficient and prognosis is guarded,
      indicating the security concern remains unresolved.
  - id: C3
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: Regulation 10 C.F.R. § 710.7(a) imposes a presumption against granting or
      restoring a clearance when derogatory information raises a security concern;
      the judge must ensure the determination does not endanger the common defense.
  - id: C5
    facts:
    - F3
    - F4
    - F8
    equity: due_process
    favors:
    - O4
    weight: bar
    why: 'Guideline G mitigation factors ¶ 23(a)‑(d) are not met: the passage of time
      is insufficient, the Individual has not acknowledged a maladaptive pattern,
      treatment progress is unsatisfactory, and no successful completion of a program
      is shown.'
    rules_out:
    - O2
  reasoning:
    read: The judge must decide whether the Individual’s severe alcohol‑related conduct
      and diagnosis, evidenced by a high PEth biomarker and a DUI arrest, have been
      sufficiently mitigated under Guideline G to permit restoration of a security
      clearance.
    weighing: Considering C1’s demonstration of ongoing hazardous alcohol use, C2’s
      lack of required treatment completion, C3’s statutory presumption against clearance,
      and C5’s explicit finding that none of the mitigation criteria are satisfied,
      the balance heavily favors denial. The limited positive steps (AA attendance,
      short‑term BAC monitoring) are outweighed by the severity of the disorder and
      the absence of objective proof of sustained abstinence.
    tradecraft: The decision is recorded in the official OHA docket, citing the relevant
      regulations and adjudicative guidelines, and the Individual is advised of the
      right to appeal under 10 C.F.R. § 710.28.
    uncertainty: Uncertainty remains regarding the Individual’s future drinking behavior,
      but the current record does not meet the statutory mitigation thresholds.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to evaluate the evidence and render a final determination.
    tempting_wrong:
      option: O2
      pull: The Individual’s recent AA participation and a week of negative BAC readings
        might suggest reform.
      why_wrong: These actions are insufficient under Guideline G because they do
        not satisfy any of the four mitigation factors; the severe AUD diagnosis and
        lack of documented abstinence remain.
    rejected:
      O1: Deferring the decision would ignore the clear regulatory presumption and
        the judge’s authority to resolve the matter now.
      O2: Restoration is barred because none of the mitigation criteria are met and
        the security concern remains unresolved.
      O3: Additional evaluation would be redundant; the psychologist’s testimony already
        indicates that treatment recommendations have not been fulfilled.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual successfully completes an intensive outpatient program meeting
        the psychologist’s criteria (minimum three sessions per week for nine hours)
        and provides negative PEth test results for twelve consecutive months
      then: O2
      why: Meeting ¶ 23(d) would demonstrate a clear and established pattern of abstinence,
        satisfying the mitigation requirements for Guideline G.
    would_not_change:
    - id: noflip1
      if: the Individual only continues AA attendance without completing the recommended
        intensive outpatient program or providing follow‑up PEth testing
      why: Such limited activity does not satisfy any of the mitigation factors and
        therefore does not alter the denial.
    watch_for:
    - id: watch1
      what: future negative PEth testing over an extended period
      favors:
      - O2
      why: Objective biomarker evidence of sustained abstinence could satisfy mitigation
        factor ¶ 23(b) or (d).
  lesson: Under Guideline G, severe alcohol use disorder coupled with high biomarker
    levels and incomplete treatment cannot be mitigated; the individual must meet
    the specific mitigation criteria (¶ 23) before a clearance can be restored.
  limits: This analysis applies only to DOE personnel security clearances governed
    by 10 C.F.R. Part 710 and Guideline G. It does not extend to other adjudicative
    guidelines or to non‑DOE agencies.
