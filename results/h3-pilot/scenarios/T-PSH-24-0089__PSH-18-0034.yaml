case:
  id: DR-H3-PSH-24-0089-PSH-18-0034-PSH-24-0089@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 5 2024
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised substantial doubt about the Individual’s
    eligibility for access authorization under Guideline G, citing habitual or binge
    alcohol consumption that could impair judgment. The Individual has a long employment
    history with DOE and disclosed a DUI arrest on October 12 2023, reporting a blood
    alcohol concentration of 0.16% and significant alcohol intake that evening. He
    admitted to drinking to intoxication two to four times per month and operating
    a vehicle while intoxicated one to two times in the prior year. A DOE-contracted
    psychiatrist concluded the Individual habitually or binge consumes alcohol to
    the point of impaired judgment. The Individual completed an intensive outpatient
    alcohol treatment program and continues weekly aftercare, and submitted three
    negative PEth tests in 2024. Opinions differ on whether his treatment and abstinence
    evidence mitigate the security concern.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge grants restoration of the Individual’s access authorization
        under Guideline G.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending additional evidence
        of sustained abstinence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization
        under Guideline G.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline G (Alcohol Consumption) as a basis
      for substantial doubt about the Individual’s eligibility for access authorization.
  - id: F2
    kind: capability
    status: confirmed
    fact: The Individual admitted to consuming alcohol to intoxication two to four
      times monthly and operating a vehicle while intoxicated one to two times in
      the prior year.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual was arrested for DUI on October 12 2023 with a blood alcohol
      concentration of 0.16% and reported consuming 6-7 beers and 2 shots of whiskey
      over 3.5-4 hours.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A DOE psychiatrist concluded the Individual habitually or binge consumed
      alcohol to the point of impaired judgment based on self‑reported consumption.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual participated in an intensive outpatient program from October
      31 to December 14 2023 and continued weekly aftercare as of the hearing.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The Individual provided three PEth test results (April 4, April 18, May
      2 2024) that were negative for alcohol consumption.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Individual’s consultant opined that the Individual has a history of
      binge drinking but not a chronic pattern and could return to moderate drinking
      without difficulty.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The DOE psychiatrist testified that the Individual had not achieved one
      year of abstinence or reduced consumption as recommended and that moderate drinking
      would increase risk.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The Local Security Office and the DOE psychiatrist both concluded that the
      Individual habitually or binge‑consumed alcohol to the point of impaired judgment,
      satisfying the adverse finding under Guideline G.
  - id: C2
    facts:
    - F5
    - F6
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline G mitigation requires a year of abstinence or reduced consumption;
      the Individual has only about seven months of claimed abstinence and limited
      PEth testing, so the required mitigating condition is not met.
  - id: C3
    facts:
    - F2
    - F3
    - F5
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The recent DUI, the high BAC (0.16 %), the Individual’s age and decades of
      access, and his own evasive testimony demonstrate poor judgment that outweighs
      the modest treatment progress.
  - id: C4
    facts:
    - F5
    - F7
    equity: due_process
    favors:
    - O3
    weight: weak
    why: While the Individual is enrolled in after‑care and a consultant notes he
      could return to moderate drinking, this alone does not satisfy any of the Guideline G
      mitigating conditions that would overcome the security concern.
  reasoning:
    read: The LSO raised substantial doubt under Guideline G because the Individual’s
      pattern of alcohol use—habitual intoxication and a recent DUI—poses a risk to
      judgment and reliability. The trap is to treat short‑term treatment and a few
      negative tests as sufficient mitigation, whereas the Adjudicative Guidelines
      demand a longer, demonstrable period of abstinence.
    weighing: Considerations C1‑C3 each carry strong weight and collectively show
      that the security concern remains unresolved. C4 acknowledges a mitigating factor
      but is weak and cannot outweigh the stronger concerns. The balance therefore
      follows the source’s analysis that the Individual has not met the required mitigating
      conditions.
    tradecraft: The Administrative Judge records a denial, cites the relevant CFR
      and Guideline paragraphs, and files the decision in the OHA docket, noting that
      the decision is appealable under 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty lies in the duration and verification of
      abstinence; additional longitudinal testing could alter the assessment.
    handoff: The decision is made solely by the Administrative Judge, as authorized
      by 10 C.F.R. § 710.7(a). No further agency review is required beyond the statutory
      appeal process.
    tempting_wrong:
      option: O1
      pull: The Individual’s completion of an intensive outpatient program and three
        negative PEth tests suggest rehabilitation.
      why_wrong: Guideline G explicitly requires a year of abstinence or a clear pattern
        of reduced consumption; the evidence falls short, so granting would contravene
        the adjudicative standards.
    rejected:
      O1: Granting would ignore the unmet one‑year abstinence requirement and the
        recent seriousness of the DUI.
      O2: Holding pending further evidence would delay a decision despite the clear
        finding that the required mitigating conditions are not satisfied.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual achieves a continuous, documented year of abstinence (or
        reduced consumption) verified by reliable testing.
      then: O1
      why: Guideline G mitigation would be satisfied, removing the security concern.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Any evidence of relapse or further alcohol‑related incidents after the
        hearing.
      favors:
      - O3
      why: A relapse would reinforce the judgment and reliability concerns underlying
        Guideline G.
  lesson: Under Guideline G, short‑term treatment and isolated negative tests do not
    satisfy the mitigation requirement; a documented year of abstinence or a clear,
    sustained reduction in consumption is required to overcome a habitually binge‑drinking
    security concern.
  limits: This analysis applies only to DOE personnel‑security determinations that
    invoke Guideline G for alcohol consumption. It does not address other adjudicative
    guidelines or non‑DOE security contexts.
