case:
  id: DR-H3-PSH-25-0124-PSH-24-0083-PSH-24-0083@v1
  title: Guideline H Mitigation Decision on Access Authorization
  status: draft
  setting: DOE Office of Hearings and Appeals, August 2024
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee with a security clearance,
    tested positive for marijuana on November 6 2023 in a random employer‑conducted
    drug test, which the DOE Local Security Office reported as a security concern
    under the Bond Amendment and Guideline H. At the administrative hearing, the Individual
    testified that he was present in a non‑ventilated garage where friends smoked
    marijuana but denied personal use, stating his last use was twenty years ago.
    The drug test showed 38 ng/ml of marijuana metabolite and was flagged as “dilute,”
    and the administering doctor described the result as “very low” and the sample
    as possibly “tampered with.” The Individual submitted a psychologist’s letter
    attributing the positive result to secondhand exposure, evidence of ongoing participation
    in a Substance Use Program with subsequent negative tests, and academic articles
    supporting secondhand smoke causing positive results, but offered no witness corroboration
    from the friends present.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline H?
  options:
    O1:
      do: The Administrative Judge holds the decision pending further expert analysis.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge partially restores the Individual's access authorization
        with monitoring conditions.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge grants restoration of the Individual's access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge denies restoration of the Individual's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual holds a DOE security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: On November 6, 2023, the Individual tested positive for marijuana in an
      employer‑conducted random drug test, and the result was reported to the DOE
      Local Security Office.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office cited the Bond Amendment and Guideline H as the
      basis for a security concern.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Individual testified that he was in a non‑ventilated garage where three
      friends smoked marijuana, denied personal use, and said his last personal use
      was twenty years ago.
  - id: F5
    kind: situation
    status: confirmed
    fact: The drug test showed a marijuana metabolite level of 38 ng/ml and was marked
      as “dilute.”
  - id: F6
    kind: intelligence
    status: assessed
    fact: The administering doctor described the result as “very low” and noted the
      sample appeared “tampered with.”
  - id: F7
    kind: intelligence
    status: assessed
    fact: A psychologist’s letter stated the positive test likely resulted from secondhand
      exposure and documented the Individual’s participation in a Substance Use Program
      with subsequent negative tests.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Individual submitted three academic articles indicating that secondhand
      cannabis smoke can cause positive drug tests under certain conditions.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The Individual did not provide any witness testimony from the friends present
      at the gathering.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The positive test was confirmed, flagged as dilute, and the sample was described
      as possibly tampered with; the Individual offered no expert testimony and no
      corroborating witnesses, so the claim of secondhand exposure lacks credible
      support.
  - id: C2
    facts:
    - F4
    - F7
    - F9
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Guideline H mitigation requires evidence of disassociation, abstinence, and
      a credible plan; the Individual continued to associate with the same friends,
      provided no witness corroboration, and offered only unsubstantiated academic
      articles.
  - id: C3
    facts:
    - F2
    - F5
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: Less than a year has elapsed since the positive test, so the conduct is not
      sufficiently remote in time to satisfy the “long‑ago” mitigation factor.
  - id: C4
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O4
    weight: weak
    why: The Bond Amendment does not bar the clearance, but it does not overcome the
      unresolved Guideline H concern.
  reasoning:
    read: The Individual tested positive for marijuana after being in a non‑ventilated
      garage where friends smoked. He asserts the result stems from secondhand exposure,
      but the record contains a dilute, possibly tampered sample, no expert analysis,
      and no corroborating witnesses.
    weighing: Applying the source’s analysis, the judge found the lack of credible
      evidence of secondhand exposure (C1) and the failure to meet any Guideline H
      mitigation criteria (C2) outweighed any mitigating factors. The short time since
      the incident (C3) further precludes a finding that the behavior is unlikely
      to recur. Although the Bond Amendment does not bar the clearance (C4), the unresolved
      Guideline H concern governs the outcome.
    tradecraft: The Administrative Judge records a final decision denying restoration,
      cites the relevant regulations and adjudicative guidelines, and notes the appeal
      rights under 10 C.F.R. § 710.28.
    uncertainty: Some scientific uncertainty exists about secondhand cannabis exposure,
      but the record lacks expert testimony to resolve that uncertainty.
    handoff: The decision is made solely by the Administrative Judge, as authorized
      by 10 C.F.R. Part 710.
    tempting_wrong:
      option: O2
      pull: The psychologist’s letter, ongoing negative drug tests, and academic articles
        might suggest a partial restoration.
      why_wrong: Without expert corroboration, witness testimony, or demonstrable
        disassociation, the mitigation factors required by Guideline H are not satisfied.
    rejected:
      O1: Holding the decision pending further analysis is unnecessary because the
        record already provides sufficient basis for a denial.
      O2: Partial restoration would ignore the unmet mitigation criteria and the judge’s
        finding of ongoing reliability concerns.
      O3: Full restoration is unsupported given the unresolved Guideline H security
        concern.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had provided expert testimony that credible scientific studies
        show secondhand exposure in a non‑ventilated garage can produce the observed
        metabolite level.
      then: O2
      why: The source assigns little weight to the academic articles because they
        lack expert interpretation; expert testimony would satisfy the evidentiary
        requirement for mitigation.
    - id: flip2
      if: The Individual had fully disassociated from all drug‑using contacts and
        could demonstrate a sustained period of abstinence beyond one year.
      then: O2
      why: Guideline H mitigation factor (a) and (b) would be met, reducing the security
        concern.
    would_not_change:
    - id: noflip1
      if: The Individual continues participation in the employer‑mandated Substance
        Use Program without it being a prescribed drug‑treatment program.
      why: While the record reflects that the Individual is participating in the Substance
        Use Program at the direction of his employer, and the Psychologist’s letter
        reflects that the Individual is required to participate in substance use and
        misuse education, as well as regular drug screenings, there is no evidence
        in the record that the Substance Use Program is a prescribed drug treatment
        program.
    watch_for:
    - id: watch1
      what: Future expert analysis or testimony linking secondhand cannabis exposure
        to the specific metabolite level and dilution observed.
      favors:
      - O2
      why: Such evidence could overcome the current credibility gap identified in
        C1.
  lesson: Under Guideline H, a positive drug test must be mitigated by credible evidence
    of non‑use, disassociation from drug‑using contacts, and a demonstrable period
    of abstinence; absent such evidence, clearance restoration is denied.
  limits: This reasoning applies only where the record lacks expert testimony or corroborating
    witnesses; it does not address cases where the individual provides independent
    scientific validation of secondhand exposure or where statutory prohibitions other
    than Guideline H apply.
