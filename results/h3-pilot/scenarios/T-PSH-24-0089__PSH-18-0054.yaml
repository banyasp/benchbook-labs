case:
  id: DR-H3-PSH-24-0089-PSH-18-0054-PSH-24-0089@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 5 2024
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual has held a DOE access authorization for over thirty years.
    On October 12, 2023, he was arrested for DUI with a blood alcohol concentration
    of 0.16% after drinking at a bar. He reported varying amounts of alcohol consumption
    in his personnel security report and in response to a letter of interrogatory,
    acknowledging frequent intoxication and prior instances of driving while intoxicated.
    A DOE-contracted psychiatrist concluded that the Individual habitually or binge
    consumed alcohol to the point of impaired judgment. The Individual completed an
    intensive outpatient program and continues weekly aftercare, providing recent
    PEth tests that were negative for alcohol. The Local Security Office cited Guideline
    G as a security concern because of the Individual’s binge and habitual drinking
    and DUI arrest.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge requests additional alcohol testing before deciding
        on restoration of the Individual’s access authorization.
      move: ask
      irreversible: false
    O2:
      do: The Administrative Judge conditionally restores the Individual’s access
        authorization pending verification of continued abstinence.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization
        based on Guideline G concerns.
      move: act
      irreversible: false
    O4:
      do: The Administrative Judge grants restoration of the Individual’s access authorization
        despite Guideline G concerns.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual has possessed access authorization for over thirty years
      at a DOE site.
  - id: F2
    kind: situation
    status: confirmed
    fact: On October 12, 2023, the Individual was arrested for DUI with a blood alcohol
      concentration of 0.16% after consuming alcohol at a bar.
  - id: F3
    kind: situation
    status: assessed
    fact: In his personnel security report, the Individual stated he consumed 6-7
      beers and 2 shots of whiskey over 3.5 to 4 hours before driving.
  - id: F4
    kind: situation
    status: assessed
    fact: In response to the letter of interrogatory, the Individual admitted to drinking
      multiple beers and whiskey at lunch and the bar, drinking to intoxication two
      to four times a month, and operating a vehicle while intoxicated one to two
      times in the prior year.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE psychiatrist concluded the Individual habitually or binge consumed
      alcohol to the point of impaired judgment.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual participated in an intensive outpatient program from October
      31 to December 14, 2023, and continued weekly aftercare as of the hearing.
  - id: F7
    kind: situation
    status: confirmed
    fact: PEth tests conducted on April 4, April 18, and May 2, 2024 were negative
      for alcohol consumption.
  - id: F8
    kind: situation
    status: assessed
    fact: The Individual has not yet achieved the one year of abstinence or reduced
      consumption recommended by the DOE psychiatrist.
  - id: F9
    kind: situation
    status: assessed
    fact: The Individual intends to abstain from alcohol until at least October 2024,
      after which he may resume moderate drinking.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline G as a security concern because
      of the Individual’s binge drinking and DUI arrest.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The Individual’s DUI arrest, admission of frequent intoxication, and the
      DOE psychiatrist’s conclusion that he habitually or binge‑drinks to the point
      of impaired judgment satisfy Guideline G’s security‑concern threshold.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: due_process
    favors:
    - O3
    weight: weak
    why: While the Individual is participating in treatment (mitigating condition c)
      and has recent negative PEth tests, he has not achieved the one‑year abstinence
      or reduced‑consumption period required by mitigating condition b, so the mitigation
      is insufficient to outweigh the concern.
  - id: C3
    facts:
    - F8
    - F9
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The Individual has not yet completed the year of abstinence recommended by
      the psychiatrist and intends to resume moderate drinking after October 2024,
      leaving the risk of recurrence unmitigated.
  - id: C4
    facts:
    - F2
    - F4
    - F5
    - F9
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The recency of the DUI, the Individual’s age and decades of prior access,
      and his expressed intent to drink again create serious doubt about his judgment
      and reliability, outweighing any positive treatment evidence.
  reasoning:
    read: Guideline G requires that an individual who habitually or binge‑drinks to
      the point of impaired judgment either not pose a security risk or demonstrate
      sufficient mitigation. The record shows the Individual engaged in such drinking
      and was arrested for DUI, but has not yet satisfied the one‑year abstinence
      benchmark.
    weighing: I find that the Individual has not resolved the security concerns asserted
      by the LSO under Guideline G because the mitigating conditions required—one
      year of abstinence or reduced consumption—have not been met, and the seriousness
      and recency of the DUI create serious doubt about his judgment and reliability.
    tradecraft: The decision will be entered in the official OHA record, citing the
      relevant CFR provisions and Adjudicative Guidelines, and the denial will be
      communicated to the Individual with an explanation of the unresolved Guideline G
      concerns.
    uncertainty: The primary uncertainty is whether future evidence of a full year
      of abstinence could later satisfy the mitigating condition; however, at the
      time of the hearing the record is insufficient.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to resolve the security‑concern determination.
    tempting_wrong:
      option: O2
      pull: The Individual’s recent treatment and negative PEth tests might suggest
        a conditional restoration.
      why_wrong: Without the required one‑year abstinence or documented reduced consumption,
        the mitigation is not sufficient under Guideline G; granting or conditionally
        restoring would conflict with the Adjudicative Guidelines.
    rejected:
      O1: Additional testing would not address the underlying pattern of binge drinking
        and the unmet abstinence requirement.
      O2: The mitigating conditions required for a conditional restoration are not
        satisfied.
      O4: Granting restoration despite unresolved Guideline G concerns would ignore
        the clear security risk identified by the LSO and the psychiatrist.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual demonstrates a continuous one‑year period of abstinence or
        reduced alcohol consumption as recommended by the DOE psychiatrist.
      then: O2
      why: Meeting mitigating condition b would resolve the Guideline G security concern,
        allowing a conditional restoration.
    would_not_change:
    - id: noflip1
      if: Additional alcohol testing is provided but the one‑year abstinence period
        is still absent.
      why: Testing alone does not satisfy the required mitigating condition, so the
        denial stands.
    watch_for:
    - id: watch1
      what: If the Individual resumes moderate drinking after October 2024, the risk
        of future impairment returns.
      favors:
      - O3
      why: The DOE psychiatrist warned that moderate social drinking would significantly
        increase the risk of relapse, reinforcing the decision to deny restoration.
  lesson: Under Guideline G, a security‑clearance holder must either eliminate or
    substantially reduce hazardous alcohol use for a sustained period (typically one
    year) before the concern can be considered resolved. Participation in treatment
    alone does not suffice when the required abstinence benchmark is unmet.
  limits: This analysis applies only to cases where the individual’s alcohol‑related
    conduct is recent, involves a DUI, and the adjudicative record shows no documented
    year‑long abstinence. It does not extend to situations where the individual has
    already satisfied the abstinence requirement or where the conduct is unrelated
    to impaired judgment.
