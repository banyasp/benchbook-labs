case:
  id: DR-H3-PSH-26-0076-PSH-24-0004-PSH-26-0076@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 14 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised a security concern under Guideline G
    because the Individual, a DOE contractor employee requiring an access authorization,
    reported heavy alcohol use and was diagnosed with Alcohol Use Disorder, Moderate.
    Evidence includes the Individual’s self‑reported drinking in a Personnel Security
    Information Report, a DOE psychologist’s evaluation diagnosing AUD and noting
    binge drinking, PEth blood tests indicating heavy and significant consumption,
    and testimony from an alcohol counselor and a psychiatrist. The Individual testified
    that he had reduced his drinking to weekends only and denied having a problem.
    The Administrative Judge must decide whether the security concern is resolved
    and whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do about restoring the Individual’s
    access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires
      an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: In October 2025 the Individual reported seeking outpatient counseling because
      he felt he was having too many alcoholic drinks and was consuming eight alcoholic
      beverages several times per week.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The DOE psychologist evaluated the Individual in January 2026 and diagnosed
      Alcohol Use Disorder, Moderate, meeting DSM‑5‑TR criteria.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The DOE psychologist reported that the Individual’s consumption constituted
      binge drinking and habitual intoxication.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial
      doubt regarding the Individual’s eligibility, citing Guideline G.
  - id: F6
    kind: situation
    status: confirmed
    fact: A PEth test on 7 January 2026 returned 266 ng/mL, indicating heavy alcohol
      consumption.
  - id: F7
    kind: situation
    status: confirmed
    fact: A PEth test in June 2026 returned 91 ng/mL, indicating significant alcohol
      consumption.
  - id: F8
    kind: situation
    status: assessed
    fact: The Alcohol Counselor provided ten sessions, noted the Individual reduced
      weekday drinking but continued weekend drinking, and identified binge‑drinking
      concerns.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The Psychiatrist testified that the Individual does not meet DSM‑5‑TR criteria
      for AUD and has no concerns about his judgment or trustworthiness.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Individual testified that he now only drinks on weekends, does not consider
      himself an alcoholic, and believes his drinking no longer impairs judgment.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F6
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Guideline G is triggered by the DOE psychologist’s diagnosis of moderate
      AUD and evidence of binge and habitual intoxication, supported by a PEth level
      of 266 ng/mL indicating heavy consumption.
  - id: C2
    facts:
    - F7
    - F10
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Mitigating factor (a) is not met because the Individual’s reduced drinking
      is recent, uncorroborated, and the June PEth test still shows significant consumption
      (91 ng/mL).
  - id: C3
    facts:
    - F7
    - F10
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Mitigating factor (b) requires a clear, established pattern of modified consumption
      or abstinence; a single lower PEth test does not satisfy that burden.
  - id: C4
    facts:
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Mitigating factor (c) is unmet because the Individual was not enrolled in
      a formal treatment program; the counseling sessions were educational, not therapeutic,
      and no after‑care report exists.
  - id: C5
    facts:
    - F9
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: Although the Psychiatrist testified the Individual does not meet AUD criteria,
      that testimony did not outweigh the psychologist’s clinical judgment and the
      objective PEth evidence.
  reasoning:
    read: The LSO raised a Guideline G concern because the Individual’s self‑reports,
      psychologist diagnosis, and PEth results demonstrate habitual and binge drinking
      that could impair judgment. The Administrative Judge must decide if the concern
      is resolved under the mitigating factors listed in the Adjudicative Guidelines.
    weighing: I find that the Individual has not resolved the security concerns asserted
      by the LSO under Guideline G.
    tradecraft: The decision is recorded in the OHA administrative record, the denial
      is entered into the Individual’s personnel security file, and the Individual
      is notified of his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty is whether future, corroborated evidence
      of sustained abstinence could overturn the finding, but the current record is
      insufficient.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      Judge sole authority to weigh the evidence and apply the mitigating‑factor analysis.
    tempting_wrong:
      option: O1
      pull: The Individual’s testimony that he now only drinks on weekends and his
        desire to retain his clearance may tempt a more lenient view.
      why_wrong: The source emphasizes that uncorroborated self‑reports and a single
        lower PEth test do not meet the statutory burden to demonstrate a clear, established
        pattern of reduced consumption.
    rejected:
      O1: The security concern remains unresolved; the Individual has not satisfied
        any mitigating factor.
      O2: Holding the decision pending would be unnecessary because the record already
        shows the lack of mitigation; the Judge must render a final determination.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual completes an outpatient chemical‑dependency program of at
        least three months with regular laboratory testing and provides twelve consecutive
        months of negative PEth results.
      then: O1
      why: The psychologist’s own recommendation specifies these actions as required
        to demonstrate rehabilitation and reformation.
    would_not_change:
    - id: noflip1
      if: The Individual continues to rely solely on self‑reported weekend drinking
        without additional corroborating evidence.
      why: One test is not sufficient to demonstrate a clear and established pattern
        of modified consumption.
    watch_for:
    - id: watch1
      what: Any future evidence of sustained abstinence, such as multiple negative
        PEth tests over a twelve‑month period or a completed treatment program report.
      favors:
      - O1
      why: Such evidence would satisfy mitigating factor (b) and (d) as described
        in the Guidelines.
  lesson: Under Guideline G, a security clearance cannot be restored unless the individual
    can demonstrate a clear, documented pattern of reduced or abstinent alcohol use
    that satisfies the prescribed mitigating factors, not merely self‑reported changes.
  limits: This analysis applies only to security‑clearance determinations under DOE
    Guideline G; it does not address other adjudicative guidelines or criminal liability
    for alcohol‑related conduct.
