case:
  id: DR-H3-PSH-23-0012-PSH-22-0085-PSH-22-0085@v1
  title: Guideline J Criminal Conduct Mitigation Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised a security concern under Guideline J
    because the Individual was charged with battery against a household member and
    criminal damage to property on November 2, 2021. The Individual testified that
    the charges were later dropped and that he has been abstinent from alcohol since
    November 3, 2021, providing negative PEth and EtG test results. He has regularly
    attended Alcoholics Anonymous meetings and completed an intensive outpatient program,
    followed by a regular outpatient program, and the DOE Psychiatrist diagnosed him
    with Alcohol Use Disorder in early remission, noting his sobriety of less than
    twelve months. The DOE Psychiatrist also testified that the criminal conduct was
    directly linked to the Individual’s alcohol misuse and that continued sobriety
    mitigates the concern. The Administrative Judge must decide whether the Guideline
    J concern is sufficiently mitigated to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual's Guideline
    J security concern?
  options:
    O1:
      do: The Administrative Judge grants a temporary restoration of access authorization.
      move: partial
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual's access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge grants the Individual's access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge requests further evaluation before deciding the
        authorization.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged with Battery Against a Household Member and Criminal
      Damage to Property on November 2, 2021.
  - id: F2
    kind: situation
    status: assessed
    fact: The Individual testified that the charges were later dropped.
  - id: F3
    kind: situation
    status: assessed
    fact: The Individual completed a Fitness for Duty program in 2019 after a prior
      alcohol‑related incident.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual has abstained from alcohol since November 3, 2021, and provided
      monthly negative PEth tests from April through July 2022.
  - id: F5
    kind: situation
    status: confirmed
    fact: Random EtG tests on December 7, 2021, February 4, 16, and 28, 2022, were
      negative.
  - id: F6
    kind: situation
    status: assessed
    fact: The Individual has regularly attended AA meetings, with a log of in‑person
      attendance beginning June 2022.
  - id: F7
    kind: situation
    status: confirmed
    fact: The DOE Psychiatrist diagnosed the Individual with Alcohol Use Disorder,
      Moderate, in early remission, noting sobriety of less than twelve months.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline J based
      on the battery charge and criminal conduct.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The DOE Psychiatrist testified that the criminal behavior was a direct result
      of maladaptive alcohol use and that continued sobriety mitigates the concern.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline J mitigation factor (a) applies because sufficient time has elapsed
      since the battery incident and the Individual has demonstrated abstinence, as
      shown by negative PEth and EtG tests.
  - id: C2
    facts:
    - F7
    - F9
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The DOE Psychiatrist testified that the criminal conduct was a direct result
      of maladaptive alcohol use; once the alcohol issue is resolved, the related
      criminal conduct concern is mitigated.
  - id: C3
    facts:
    - F6
    - F4
    - F5
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Evidence of successful rehabilitation—completion of an IOP, ongoing ROP,
      regular AA attendance, and continuous negative alcohol tests—satisfies Guideline
      J mitigation factor (d).
  - id: C4
    facts:
    - F2
    equity: due_process
    favors:
    - O3
    weight: weak
    why: The charges were ultimately dropped, reducing the severity of the criminal
      conduct concern.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The Local Security Office correctly invoked Guideline J, but the mitigation
      analysis overrides the initial concern.
  reasoning:
    read: The security concern under Guideline J stems from a battery charge that
      occurred while the Individual was intoxicated. The core issue is whether the
      conduct, now linked to alcohol misuse, is sufficiently mitigated by the Individual’s
      sobriety and rehabilitation to permit restoration of his clearance.
    weighing: The Administrative Judge applied the Adjudicative Guidelines’ mitigation
      factors. {C1} establishes that enough time has passed and the Individual has
      not reoffended. {C2} ties the conduct directly to alcohol misuse, so resolving
      the alcohol issue also resolves the conduct concern. {C3} provides concrete
      evidence of rehabilitation—negative testing, completed treatment, and ongoing
      AA participation—satisfying factor (d). {C4} further lessens the gravity because
      the charges were dropped. Collectively these considerations outweigh any residual
      doubt, leading to a full grant.
    tradecraft: The decision is recorded in the official OHA decision, citing the
      specific guideline paragraphs and the psychiatrist’s testimony, and the clearance
      is reinstated without a temporary or conditional status.
    uncertainty: Minimal; the record contains objective test results and professional
      assessments confirming sustained sobriety and rehabilitation.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to weigh the evidence and issue the final determination.
    tempting_wrong:
      option: O2
      pull: A conservative bias toward denial in security matters could tempt a denial
        despite mitigation.
      why_wrong: Denial would ignore the explicit mitigating factors identified by
        the Guidelines and the psychiatrist’s conclusion that the risk has been mitigated.
    rejected:
      O1: A temporary restoration is unnecessary because the evidence meets the full
        mitigation standards, not just a partial one.
      O2: The mitigation factors under Guideline J are satisfied; denial would contradict
        the Judge’s own analysis.
      O4: Further evaluation is not required; the record already provides sufficient
        evidence of rehabilitation and low risk.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to relapse and produce a positive alcohol test within
        the next six months.
      then: O2
      why: A relapse would indicate that the mitigating factor of sustained sobriety
        is no longer met, re‑opening the security concern under Guideline J.
    would_not_change:
    - id: noflip1
      if: The charges remained dropped but the Individual continued abstinent and
        in treatment.
      why: The mitigation analysis already accounts for dropped charges; continued
        abstinence maintains the finding.
    watch_for:
    - id: watch1
      what: Any future criminal conduct unrelated to alcohol.
      favors:
      - O2
      why: New conduct would create a separate security concern not mitigated by the
        current analysis.
  lesson: When criminal conduct is directly linked to a treatable condition such as
    alcohol misuse, demonstrating sustained abstinence and successful rehabilitation
    can fully mitigate Guideline J concerns, allowing clearance restoration.
  limits: This reasoning applies only when the individual shows objective, verifiable
    evidence of continued sobriety and treatment; it does not extend to unrelated
    criminal behavior or relapse.
