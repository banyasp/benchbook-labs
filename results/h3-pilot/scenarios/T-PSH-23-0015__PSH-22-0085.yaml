case:
  id: DR-H3-PSH-23-0015-PSH-22-0085-PSH-23-0015@v1
  title: Guideline J Criminal Conduct Mitigation Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, March 2023
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised security concerns under Guideline J
    because the Individual was arrested for driving while intoxicated in July 2019,
    again in June 2022, and previously in April 2001 for a drug‑related DWI. The Individual
    has since completed a six‑week intensive outpatient program, attended after‑care
    sessions, and submitted eight negative PEth tests between July 2022 and February
    2023. A DOE‑appointed psychologist diagnosed the Individual with Alcohol Use Disorder
    in early remission but found adequate evidence of rehabilitation and a good prognosis.
    The Individual reports abstinence from alcohol since the June 2022 incident, and
    coworkers and friends attest to his honesty and lack of recent alcohol use.
  question: What should the Administrative Judge do regarding the Individual’s Guideline
    J security concern?
  options:
    O1:
      do: The Administrative Judge partially restores the Individual’s access authorization,
        requiring monthly testing.
      move: partial
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual’s request to restore access
        authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization
        without restrictions.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge places the Individual’s case on hold pending further
        monitoring.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The LSO invoked Guideline J based on the Individual’s arrests for DWI in
      July 2019, June 2022, and a drug‑related DWI in April 2001.
  - id: F2
    kind: situation
    status: confirmed
    fact: In July 2019 the Individual was arrested for DWI after consuming six to
      eight mixed drinks and one shot of whiskey.
  - id: F3
    kind: situation
    status: confirmed
    fact: In June 2022 the Individual was arrested for DWI after consuming four beers
      and three shots of alcohol.
  - id: F4
    kind: situation
    status: confirmed
    fact: In April 2001 the Individual was arrested for a DWI involving drugs, not
      alcohol.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed a six‑week intensive outpatient program at the
      VA from August to November 2022 and continues weekly after‑care sessions.
  - id: F6
    kind: situation
    status: confirmed
    fact: Eight PEth tests submitted from July 2022 to February 2023 were all negative.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The DOE psychologist diagnosed the Individual with Alcohol Use Disorder,
      Moderate, in Early Remission and found adequate evidence of rehabilitation with
      a good to very good prognosis.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual has abstained from alcohol since the June 2022 incident,
      as reflected in self‑reports and negative PEth tests.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Coworkers and a close friend testify that the Individual is honest, reliable,
      and has not consumed alcohol since the last incident.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline J mitigation factor (a) applies because the 2001 drug‑related DWI
      occurred over twenty years ago, making recurrence unlikely and not casting doubt
      on reliability.
  - id: C2
    facts:
    - F3
    - F5
    - F6
    - F8
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The Individual has abstained from alcohol since the June 2022 incident, demonstrated
      by self‑reports and eight consecutive negative PEth tests, satisfying mitigation
      factor (a) for recent criminal conduct.
  - id: C3
    facts:
    - F5
    - F7
    - F9
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: 'Evidence of successful rehabilitation: completion of a VA intensive outpatient
      program, ongoing after‑care, and positive character testimony, meeting mitigation
      factors (b) and (d) of Guideline J.'
  - id: C4
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The DOE‑appointed psychologist diagnosed the Individual with Alcohol Use
      Disorder in early remission but found adequate evidence of rehabilitation and
      a good to very good prognosis, directly supporting mitigation.
  - id: C5
    facts:
    - F9
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: Co‑workers and a close friend attest to the Individual’s honesty, reliability,
      and lack of recent alcohol use, reinforcing the conclusion that the security
      concern is mitigated.
  reasoning:
    read: The LSO raised Guideline J concerns based on three DWI arrests (2001, 2019,
      2022). The core issue is whether the Individual’s criminal conduct, tied to
      alcohol misuse, has been sufficiently mitigated to permit restoration of his
      access authorization.
    weighing: The Administrative Judge weighed the passage of time for the 2001 incident
      (C1), the Individual’s sustained abstinence and negative PEth results (C2),
      and the comprehensive rehabilitation record (C3‑C5). The psychologist’s professional
      assessment (C4) was given decisive weight. Collectively, these satisfy the mitigating
      factors listed in the Adjudicative Guidelines, leading to a finding that the
      security concern is resolved.
    tradecraft: The decision shall be recorded in the OHA docket, citing the Guideline
      J mitigation factors applied and attaching the psychologist report, PEth results,
      and treatment certificates. No additional monitoring conditions are imposed
      because the evidence meets the required standard.
    uncertainty: Minimal; the record contains consistent evidence of abstinence, treatment
      completion, and professional endorsement, leaving little doubt about the Individual’s
      rehabilitation.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to resolve substantial doubt after a hearing.
    tempting_wrong:
      option: O2
      pull: A bias toward protecting the program by imposing a denial despite evidence
        of rehabilitation.
      why_wrong: Denial would ignore the mitigating factors expressly recognized in
        the Guidelines and the psychologist’s positive prognosis, contrary to the
        statutory presumption that clearance may be restored when security concerns
        are mitigated.
    rejected:
      O1: Partial restoration with testing is unnecessary because the source found
        the full mitigation sufficient.
      O2: Denial conflicts with the conclusion that the Individual’s rehabilitation
        removes the security risk.
      O4: A hold is unwarranted; the evidence already resolves the concern.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to produce a positive PEth test after June 2022 indicating
        resumed alcohol use.
      then: O2
      why: A positive test would demonstrate a relapse, negating the mitigation factor
        of sustained abstinence and undermining the psychologist’s prognosis.
    - id: flip2
      if: The Individual failed to complete the intensive outpatient program or discontinued
        after‑care attendance.
      then: O2
      why: Without documented treatment completion, the mitigation factors (b) and
        (d) for successful rehabilitation would not be satisfied.
    would_not_change:
    - id: noflip1
      if: The 2001 drug‑related DWI were considered alone.
      why: The passage of more than twenty years satisfies mitigation factor (a) because
        it is unlikely to recur.
    watch_for:
    - id: watch1
      what: Any future arrest or positive substance test.
      favors:
      - O2
      why: A new criminal incident would re‑introduce substantial doubt under Guideline
        J.
  lesson: When evaluating Guideline J concerns, the adjudicator must consider both
    the elapsed time since the conduct and concrete evidence of rehabilitation, including
    treatment completion, ongoing monitoring, and professional assessments, before
    restoring access.
  limits: This analysis applies only to cases where the individual has demonstrable
    abstinence and documented treatment; it does not extend to situations lacking
    such evidence or involving more severe or recent criminal conduct unrelated to
    substance abuse.
