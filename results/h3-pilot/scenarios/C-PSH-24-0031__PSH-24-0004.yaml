case:
  id: DR-H3-PSH-24-0031-PSH-24-0004-PSH-24-0004@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: Office of Hearings and Appeals, DOE, January 2024
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual holds a DOE access authorization as a contractor employee.
    The Local Security Office raised a security concern under Guideline G, citing
    the Individual’s habitual or binge alcohol consumption and impaired judgment.
    A DOE‑contracted psychologist diagnosed the Individual with severe Alcohol Use
    Disorder and reported a high PEth test result indicating recent heavy drinking.
    The Individual reported limited recent alcohol use, claimed abstinence since mid‑August
    2023, and is enrolled in an inpatient and outpatient treatment program with monthly
    testing. Prior convictions for DUI in 2007 and 2009 are part of the record. The
    Administrative Judge must decide whether the security concern is resolved and
    whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: false
    O3:
      do: The Administrative Judge limits the Individual’s access authorization.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was granted an access authorization in connection with his
      employment by a DOE contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual disclosed his alcohol abuse and AA attendance to the Local
      Security Office via a Personnel Security Information Report after his manager
      advised him to self‑report.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a Letter of Interrogatory and a Notification
      Letter stating substantial doubt about the Individual’s eligibility under Guideline
      G.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A DOE‑contracted psychologist evaluated the Individual, diagnosing Alcohol
      Use Disorder, Severe, and concluded he habitually or binge consumed alcohol
      to the point of impaired judgment.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A phosphatidylethanol (PEth) test on the Individual returned a level of
      1,096 ng/mL, indicating recent heavy alcohol consumption.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual was arrested for DUI in March 2007 and again in December
      2009, pleading guilty to both offenses.
  - id: F7
    kind: situation
    status: assessed
    fact: The Individual claims he last consumed alcohol on August 18, 2023, is enrolled
      in a ten‑week outpatient program, and follows a zero‑tolerance agreement with
      monthly PEth testing beginning in November.
  - id: F8
    kind: authority
    status: assessed
    fact: The psychologist recommended either twelve months of treatment with aftercare
      and monthly testing or twenty‑four months of abstinence with monthly testing
      to demonstrate rehabilitation.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline G is triggered by the psychologist’s diagnosis of severe Alcohol
      Use Disorder and the high PEth result, establishing habitual or binge drinking
      that impairs judgment.
  - id: C2
    facts:
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Less than five months of abstinence does not satisfy mitigating condition
      (a) that the passage of time makes recurrence unlikely.
  - id: C3
    facts:
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The required twelve‑month documented abstinence with monthly PEth testing
      has not been met; the Individual provided no corroborating test results.
  - id: C4
    facts:
    - F4
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: No satisfactory evidence of progress in treatment is offered, and the Individual
      previously relapsed after earlier treatment, so mitigating condition (c) is
      not satisfied.
  - id: C5
    facts: []
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Regulations impose a presumption against granting or restoring a clearance
      when derogatory information raises substantial doubt.
  reasoning:
    read: The LSO raised a Guideline G concern that the Individual habitually or binge‑drinks
      to the point of impaired judgment. The Individual claims recent abstinence and
      treatment, but the record shows a recent high PEth level, a severe AUD diagnosis,
      and insufficient documented mitigation.
    weighing: 'Each consideration (C1‑C5) points to the same conclusion: the security
      concern remains unresolved. The judge therefore finds the balance of evidence
      favors denial, as the Individual has not satisfied any of the four mitigating
      conditions enumerated in the Adjudicative Guidelines.'
    tradecraft: The Administrative Judge will issue a written decision stating the
      denial, cite the relevant regulations and findings, and advise the Individual
      of the right to appeal under 10 C.F.R. § 710.28.
    uncertainty: While future compliance could alter the assessment, the current record
      does not provide the reliable, documented evidence required to overcome the
      presumption against restoration.
    handoff: The decision is made solely by the Administrative Judge; no further referral
      is required because the record is complete and the regulatory standard is clear.
    tempting_wrong:
      option: O2
      pull: A desire to assist the Individual in maintaining his career might tempt
        the judge to restore the clearance based on his self‑reported abstinence and
        enrollment in treatment.
      why_wrong: The source explicitly states that without documented abstinence and
        completed treatment the mitigating conditions are not met, so restoration
        would be contrary to Guideline G and the regulatory presumption.
    rejected:
      O2: The Individual has not provided sufficient evidence of sustained abstinence
        or completed treatment to resolve the Guideline G concern.
      O3: A partial limitation would still rely on the same unresolved security concern;
        the guidelines do not provide for a limited grant when the underlying risk
        remains.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual achieves twelve consecutive months of documented abstinence
        with monthly PEth testing as recommended by the DOE psychologist.
      then: O2
      why: The psychologist’s recommendation (p4.2) sets twelve months of abstinence
        with testing as a condition for rehabilitation; meeting it would satisfy mitigating
        condition (b).
    - id: flip2
      if: The Individual successfully completes the full inpatient program, the ten‑week
        IOP, and the required after‑care, providing documentation of progress.
      then: O2
      why: The fourth mitigating condition is inapplicable because the Individual
        has yet to complete the treatment and aftercare recommended by the DOE Psychologist.
    would_not_change:
    - id: noflip1
      if: The Individual continues to rely solely on self‑reported abstinence without
        any PEth testing or treatment documentation.
      why: While the Individual represents that he has received treatment that has
        helped him to take positive steps towards recovery, he has not provided any
        corroborating evidence to support his claimed abstinence and treatment and
        does not claim that he has fully complied with the treatment recommendations
        of the DOE Psychologist. Therefore, the Individual has not resolved the security
        concerns asserted by the LSO under Guideline G.
    watch_for:
    - id: watch1
      what: Any positive PEth test result after the decision date.
      favors:
      - O1
      why: A new positive test would reaffirm the ongoing risk under Guideline G.
  lesson: Under Guideline G, a clearance may be denied or not restored unless the
    individual can demonstrate, with documented evidence, a sustained period of abstinence
    and completion of the treatment program prescribed by the adjudicative guidelines.
  limits: This analysis applies only to cases where the security concern is alcohol
    consumption; it does not address other adjudicative guidelines or unrelated eligibility
    factors.
