case:
  id: DR-H3-PSH-22-0130-PSH-22-0085-PSH-22-0085@v1
  title: Guideline J Criminal Conduct Mitigation Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised security concerns under Guideline J
    because the Individual was charged with battery against a household member and
    criminal damage to property on November 2, 2021. The Individual admitted to drinking
    alcohol prior to the incident and had a pattern of intoxication once or twice
    a month in the months leading up to it. A DOE psychiatrist diagnosed the Individual
    with Alcohol Use Disorder, moderate, in early remission. Since the incident, the
    Individual has been abstinent, with negative PEth and EtG tests documented from
    December 2021 through July 2022. The Individual completed 13 weeks of an intensive
    outpatient program, is now in a regular outpatient program, and regularly attends
    Alcoholics Anonymous meetings. The criminal charges were later dropped, the restraining
    order was dismissed, and the Individual maintains a stable living situation with
    support from his girlfriend and brother.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline J?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks the DOE psychiatrist for further evaluation.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge holds the decision pending further evidence.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged with Battery Against a Household Member and Criminal
      Damage to Property on November 2, 2021.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual admitted to consuming alcohol prior to the incident and reported
      intoxication once or twice a month from August to November 2021.
  - id: F3
    kind: situation
    status: confirmed
    fact: A DOE psychiatrist diagnosed the Individual with Alcohol Use Disorder, Moderate,
      in early remission, meeting five diagnostic criteria.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual has been abstinent since November 3, 2021, with monthly negative
      PEth tests from April to July 2022 and negative EtG tests on December 7, 2021,
      February 4, 16, and 28, 2022.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed 13 weeks of an intensive outpatient program, is
      now attending a regular outpatient program, and regularly attends AA meetings.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline J based
      on the Individual’s criminal conduct.
  - id: F7
    kind: situation
    status: confirmed
    fact: The criminal charges were later dropped and the restraining order was dismissed.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual has a stable living situation and a support system including
      his girlfriend and brother.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Guideline J mitigation factor (a) is satisfied because sufficient time has
      elapsed since the battery incident, the charges were dropped, and there is no
      evidence of recurrence, making future misconduct unlikely.
  - id: C2
    facts:
    - F5
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The Individual has demonstrated successful rehabilitation through completion
      of an intensive outpatient program, ongoing regular outpatient counseling, and
      consistent AA attendance, supported by a stable living situation and a strong
      personal support network.
  - id: C3
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The DOE psychiatrist’s professional assessment confirms the Individual is
      in early remission from Alcohol Use Disorder, has a good prognosis, and meets
      the treatment recommendations, reinforcing the mitigation of the criminal‑conduct
      concern.
  - id: C4
    facts:
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Objective, documented negative PEth and EtG tests from December 2021 through
      July 2022 provide reliable evidence of sustained abstinence, satisfying the
      evidentiary standard for mitigation.
  reasoning:
    read: The Local Security Office raised Guideline J concerns because the Individual
      was charged with battery and property damage while intoxicated. The core issue
      is whether the Individual’s subsequent conduct and treatment eliminate the security
      risk posed by that criminal conduct.
    weighing: The Administrative Judge applied the Adjudicative Guidelines’ mitigating
      factor (a) – elapsed time and low likelihood of recurrence – and found it satisfied
      ({C1}). The Judge also weighed the Individual’s comprehensive rehabilitation
      record, including treatment completion, ongoing counseling, AA participation,
      and a supportive home environment ({C2}). The psychiatrist’s diagnosis of early
      remission and positive prognosis ({C3}) and the objective negative alcohol tests
      ({C4}) further reinforced that the conduct will not recur and that the Individual’s
      reliability, trustworthiness, and judgment are restored. Because all mitigating
      conditions are met, the balance tips decisively toward restoration.
    tradecraft: The decision is recorded in the Administrative Judge’s written Decision,
      citing the specific Guideline J mitigating factor and the supporting evidence,
      and the restoration order is entered into the DOE personnel security system.
    uncertainty: Minimal; the record provides clear, corroborated evidence of abstinence
      and rehabilitation, and the guidelines give a definitive framework for mitigation.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      Judge sole authority to resolve the security‑clearance determination after evaluating
      the evidence.
    tempting_wrong:
      option: O4
      pull: A residual concern that the Individual might relapse or that the original
        conduct reflects poor judgment could tempt a denial.
      why_wrong: The source explicitly finds the mitigating conditions satisfied and
        notes that the likelihood of relapse flattens after six months, making denial
        unsupported by the record.
    rejected:
      O2: Further psychiatric evaluation is unnecessary because the existing psychiatrist’s
        report already confirms remission and a good prognosis.
      O3: Holding the decision pending additional evidence is unwarranted; the record
        already contains sufficient, credible evidence of mitigation.
      O4: Denial would contradict the source’s finding that the Guideline J concerns
        are fully mitigated.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual tests positive for alcohol or is convicted of a new criminal
        offense after the date of this decision
      then: O4
      why: A new violation would demonstrate a failure to maintain the rehabilitation
        and low‑recurrence criteria required for Guideline J mitigation.
    would_not_change:
    - id: noflip1
      if: The Individual continues abstinent with negative testing and no further
        criminal conduct
      why: The mitigating conditions remain satisfied, so the restoration stands.
    watch_for:
    - id: watch1
      what: Any evidence of relapse to alcohol use or new domestic‑violence allegations
      favors:
      - O4
      why: Such evidence would re‑activate Guideline J concerns and could justify
        denial.
  lesson: When an individual’s criminal conduct is directly linked to a treatable
    condition, demonstrated sustained abstinence, and documented rehabilitation, the
    Adjudicative Guidelines allow mitigation of Guideline J concerns, permitting restoration
    of access authorization.
  limits: This reasoning applies only where the individual provides objective, corroborated
    evidence of ongoing sobriety and rehabilitation; it does not extend to cases lacking
    such documentation or where new criminal conduct arises.
