case:
  id: DR-H3-PSH-26-0025-PSH-23-0078-PSH-26-0025@v1
  title: Guideline J Criminal Conduct Security Concern – Access Authorization Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office cited Guideline J as a security concern because
    the Individual has a history of criminal conduct, including charges in 2018, 2019,
    and 2025. In 2019 the Individual was arrested and charged with battery, false
    imprisonment, and criminal damage to property, pled guilty, received a suspended
    sentence and completed two years of probation in October 2019. In 2025 the Individual
    was arrested for battery after an altercation with his girlfriend; the charge
    was dismissed after the girlfriend filed a notarized statement that she was not
    harmed, while the officer determined the Individual was the aggressor. The Individual
    denies striking his girlfriend, while the girlfriend alleges he punched her twice
    and later submitted a notarized statement that she was not harmed. The Individual
    has completed multiple alcohol‑treatment programs, earned nine months of negative
    PEth test results, and received a psychologist’s diagnosis of moderate Alcohol
    Use Disorder with a recommendation for continued abstinence. The Administrative
    Judge must determine whether the criminal‑conduct concerns under Guideline J have
    been mitigated sufficiently to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline J?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s security
        clearance access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge grants restoration of the Individual’s security
        clearance access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending further evidence on
        the 2025 incident.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge asks the Local Security Office for clarification
        of the criminal evidence.
      move: ask
      irreversible: false
      to: Local Security Office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In 2019 the Individual was arrested and charged with Battery, False Imprisonment,
      and Criminal Damage to Property, pled guilty, received a suspended sentence
      and two years of probation, which he completed in October 2019.
  - id: F2
    kind: situation
    status: confirmed
    fact: In 2025 the Individual was arrested for Battery after an incident with his
      girlfriend; the charge was dismissed after the girlfriend filed a notarized
      statement that she was not harmed, while the officer determined the Individual
      was the aggressor.
  - id: F3
    kind: situation
    status: confirmed
    fact: In 2018 the Individual was charged with Possession of Drug Paraphernalia,
      Possession of Marijuana, and Speeding, pled guilty, and completed probation
      in October 2019.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline J (Criminal Conduct) as a security
      concern based on the Individual’s 2018, 2019, and 2025 criminal charges.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE‑consultant psychologist diagnosed the Individual with moderate Alcohol
      Use Disorder, recommended abstinence for at least one year, and concluded the
      Individual had rehabilitated his AUD but did not address criminal‑conduct concerns.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual denied striking his girlfriend during the 2025 incident,
      while the girlfriend alleged he punched her twice and later submitted a notarized
      statement saying she was not harmed.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The officer observed odor of alcohol, boxing trophies, determined the Individual
      was the aggressor, and recorded no visible injuries on the girlfriend.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual completed employer‑sponsored fitness‑for‑duty, EAP, IOP,
      aftercare, and AA programs, and produced eight consecutive negative PEth test
      results from August 2025 through March 2026.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Reliable evidence shows the Individual committed the 2025 Battery; the officer
      determined he was the aggressor, satisfying Guideline J.
  - id: C2
    facts:
    - F2
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The most recent criminal conduct occurred within the past year, and no unusual
      circumstances apply, so ¶32(a) does not mitigate.
  - id: C3
    facts:
    - F6
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The Individual has not accepted responsibility for the alleged 2025 assault;
      this lack of acceptance blocks finding successful rehabilitation under ¶32(d).
  - id: C4
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The psychologist concluded the Individual’s AUD is in remission but did not
      address criminal‑conduct concerns, so the AUD rehabilitation does not offset
      Guideline J.
  reasoning:
    read: The Administrative Judge must decide whether the Individual’s recent battery
      charge and prior criminal history can be considered mitigated under Guideline
      J. The 2025 incident is recent, the officer found the Individual to be the aggressor,
      and the Individual has not taken responsibility, all of which keep the security
      concern unresolved.
    weighing: Considering C1‑C3, no mitigating condition under ¶32(a)‑(d) applies.
      The only positive factor (C4) relates to alcohol use, which does not affect
      the Guideline J analysis. Therefore the balance tips decisively toward denial.
    tradecraft: The Judge records the decision in the official OHA decision, cites
      the relevant Adjudicative Guidelines paragraphs, and notes the evidentiary basis
      (officer report, girlfriend’s statements, and lack of responsibility). The decision
      is final unless appealed under 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty lies in the contradictory statements of the
      girlfriend and the Individual; however, the officer’s observation and the lack
      of physical injury are deemed insufficient to overturn the finding of reliable
      evidence.
    handoff: The Administrative Judge decides alone, as the record already contains
      sufficient reliable evidence of the 2025 battery.
    tempting_wrong:
      option: O2
      pull: The Individual’s extensive treatment and nine months of negative PEth
        tests suggest rehabilitation, which might tempt a grant.
      why_wrong: Successful alcohol treatment does not mitigate criminal‑conduct concerns
        when the individual has not accepted responsibility and the offense is recent.
    rejected:
      O2: Granting would ignore the unresolved Guideline J concerns identified by
        the Judge.
      O3: Holding pending further evidence is unnecessary because the record already
        contains sufficient reliable evidence of the 2025 battery.
      O4: The LSO’s evidence is already fully presented; clarification would not change
        the finding that mitigation conditions are unmet.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to accept full responsibility for the 2025 battery and
        demonstrate remorse.
      then: O2
      why: Acceptance of responsibility could satisfy the rehabilitation condition
        under ¶32(d).
    would_not_change:
    - id: noflip1
      if: The Individual obtains additional negative PEth results extending beyond
        twelve months.
      why: Even with longer abstinence, the recent criminal conduct remains unresolved.
    watch_for:
    - id: watch1
      what: New credible evidence that the officer’s determination of aggression was
        erroneous or that the girlfriend’s statement fully exonerates the Individual.
      favors:
      - O2
      why: Such evidence could undermine the reliable‑evidence finding and open the
        door to mitigation.
  lesson: In DOE personnel security adjudications, recent criminal conduct that is
    not mitigated by acceptance of responsibility or demonstrated rehabilitation cannot
    be outweighed by unrelated treatment successes. The Adjudicative Guidelines require
    specific mitigating conditions for Guideline J, and absent those, clearance restoration
    is denied.
  limits: This analysis applies only to DOE security clearance determinations under
    Guideline J. It does not extend to other agencies, civil employment decisions,
    or situations where the criminal conduct is unrelated to national security concerns.
