case:
  id: DR-H3-PSH-24-0031-PSH-18-0034-PSH-18-0034@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: Department of Energy Personnel Security Hearing, July 2018
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: An Individual employed by a DOE contractor applied for a security clearance.
    The Individual was cited for Minor in Consumption in 2008 and currently reports
    drinking several beers weekly, with occasional binge episodes. A DOE‑appointed
    Psychologist evaluated the Individual and concluded he habitually or binge consumes
    alcohol to the point of impaired judgment, recommending twelve weeks of outpatient
    group therapy. The Individual has abstained from alcohol for fourteen weeks and
    began individual therapy, but has not enrolled in the recommended group program.
    The Psychologist testified that the Individual has not made satisfactory progress
    and that his prognosis remains somewhat guarded. The Administrative Judge must
    determine whether the Guideline G concerns are mitigated enough to grant or deny
    access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge grants the Individual’s security access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further treatment evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge asks for a revised psychologist assessment.
      move: ask
      irreversible: false
      to: Psychologist
    O4:
      do: The Administrative Judge denies the Individual’s security access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual applied for a DOE security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was cited for Minor in Consumption in 2008 after a college
      party.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual reports drinking four to five beers once or twice per week
      and binge drinking eight to nine beers once or twice per month since December
      2011.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The Psychologist concluded the Individual is a habitual or binge consumer
      of alcohol to the point of impaired judgment approximately twice monthly.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Psychologist did not diagnose Alcohol Use Disorder but recommended twelve
      weeks of outpatient group therapy and noted lack of rehabilitation evidence.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual abstained from alcohol starting March 2, 2018, achieving
      fourteen weeks of sobriety before the hearing.
  - id: F7
    kind: capability
    status: confirmed
    fact: The Individual began individual therapy in late May 2018 but did not enroll
      in the recommended group therapy and had not scheduled further sessions.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: The Psychologist testified that the Individual has not made satisfactory
      progress in treatment and his prognosis is somewhat guarded.
  - id: F9
    kind: authority
    status: confirmed
    fact: Guideline G allows mitigation if sufficient time has passed, the individual
      acknowledges the problem, participates in treatment, and makes satisfactory
      progress.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Local Security Office sent a Notification Letter stating substantial
      doubt about the Individual’s eligibility under Guideline G.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    - F7
    - F8
    - F9
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: Guideline G mitigation requires (a) sufficient time passed, (b) acknowledgment
      and corrective action, and (c) satisfactory treatment progress; the Individual’s
      14‑week abstinence and individual therapy do not satisfy these criteria.
  - id: C2
    facts:
    - F4
    - F8
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The Psychologist, the sole expert on the Individual’s alcohol use, maintained
      that the Individual remains a habitual/binge consumer and that his prognosis
      is “somewhat guarded,” indicating the security concern is unresolved.
  - id: C3
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: Regulations impose a presumption against granting a clearance; the LSO’s
      Notification Letter created “substantial doubt” that must be overcome, which
      the record does not.
  - id: C4
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O4
    weight: weak
    why: While the Individual presented evidence of abstinence, the period is too
      brief and the chosen treatment does not meet the Psychologist’s recommended
      twelve‑week group program, so the burden of mitigation is not satisfied.
  reasoning:
    read: The case hinges on whether the Individual’s past and current alcohol use,
      judged under Guideline G, still poses a security risk. The Individual believes
      that fourteen weeks of sobriety and individual therapy mitigate the concern,
      but the adjudicative framework treats Guideline G concerns as persisting until
      the specific mitigation factors are met.
    weighing: The Administrative Judge applied the strong considerations C1‑C3, echoing
      the source’s analysis that the Psychologist’s unchanged opinion, the lack of
      required treatment, and the statutory presumption against clearance together
      outweigh the Individual’s limited abstinence. Only a weak consideration (C4)
      favored the Individual, insufficient to tip the balance.
    tradecraft: The decision is recorded in the official OHA decision docket, citing
      the relevant CFR provisions and Adjudicative Guidelines, and the denial is communicated
      to the LSO and the Individual’s employer.
    uncertainty: The primary uncertainty is the Individual’s future drinking behavior,
      but the record provides no reliable evidence to reduce the risk assessment.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.7(a).
      No additional agency input is required.
    tempting_wrong:
      option: O1
      pull: The Individual’s recent abstinence and testimony may appear to demonstrate
        rehabilitation.
      why_wrong: Guideline G explicitly requires a longer period of abstinence or
        completion of the recommended group therapy; without those, the security concern
        remains unmitigated.
    rejected:
      O1: Granting would ignore the unmet mitigation criteria of Guideline G.
      O2: Holding pending further evidence would delay a decision despite clear regulatory
        guidance that the burden remains on the Individual.
      O3: A new psychologist assessment would not change the fact that the required
        treatment has not been undertaken.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual completes the twelve‑week outpatient group therapy and demonstrates
        a full year of abstinence
      then: O1
      why: Meeting both treatment and time‑based mitigation factors satisfies Guideline
        G paragraphs 23(a)–(c).
    would_not_change:
    - id: noflip1
      if: the Individual continues to consume alcohol at the levels described in F3
      why: The security concern remains unabated, reinforcing the denial.
    watch_for:
    - id: watch1
      what: evidence of sustained participation in the recommended group therapy and
        a documented year of sobriety
      favors:
      - O1
      why: Such evidence would satisfy the mitigation criteria under Guideline G.
  lesson: Under Guideline G, a security clearance can be denied when the individual
    has not met the specific mitigation requirements of time elapsed, acknowledged
    corrective action, and satisfactory treatment progress, even if short‑term abstinence
    is shown. The presumption against granting persists until those criteria are satisfied.
  limits: This analysis applies only to DOE personnel security determinations that
    invoke Guideline G for alcohol‑related concerns. It does not extend to other adjudicative
    guidelines or to non‑DOE clearance processes.
