case:
  id: DR-H3-PSH-25-0092-PSH-24-0095-PSH-24-0095@v1
  title: Guideline G Alcohol Consumption Security Clearance Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, December 2024
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual has a record of four alcohol-related arrests spanning
    from 2006 to 2023. The DOE Psychologist concluded that the Individual exhibits
    a pattern of problematic drinking and impaired judgment when intoxicated, though
    she does not meet criteria for an alcohol use disorder. The Individual submitted
    fourteen consecutive negative PEth tests covering October 2023 through October
    2024 and has attended numerous online AA and SMART meetings, without obtaining
    an AA sponsor or completing the Twelve‑Step program. The OM Psychologist diagnosed
    moderate Alcohol Dependence, noted sustained remission, and expressed a favorable
    prognosis based on the Individual’s recent abstinence and treatment. The Local
    Security Office invoked Guideline G, citing the arrests and the DOE Psychologist’s
    findings as creating substantial doubt about eligibility. Under the applicable
    DOE regulations, the presumption is against granting or restoring a clearance
    when security concerns exist.
  question: What should the Administrative Judge do regarding the Individual’s security
    clearance?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s security clearance.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge restores the Individual’s security clearance.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: 'The Individual has four alcohol-related arrests: DWI in August 2006, Open
      Container citation in November 2011, DUI in February 2014, and Aggravated DWI
      in September 2023.'
  - id: F2
    kind: situation
    status: assessed
    fact: The DOE Psychologist concluded the Individual has a history of impaired
      judgment when under the influence and a pattern of problematic drinking, but
      does not meet criteria for an alcohol use disorder.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual provided fourteen consecutive negative PEth test results
      from October 2023 through October 2024, indicating no recent alcohol consumption.
  - id: F4
    kind: situation
    status: assessed
    fact: The Individual has attended approximately twenty‑eight online AA meetings
      since January 5 2024 and SMART meetings since April 7 2024, but has not obtained
      an AA sponsor or worked the Twelve‑Step program.
  - id: F5
    kind: situation
    status: assessed
    fact: The OM Psychologist diagnosed the Individual with moderate Alcohol Dependence,
      noted sustained remission, and reported a good prognosis based on fourteen months
      of abstinence and treatment.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office invoked Guideline G, citing the DOE Psychologist’s
      findings, the four arrests, and the Individual’s problematic alcohol use as
      creating substantial doubt about eligibility.
  - id: F7
    kind: situation
    status: confirmed
    fact: DOE security regulations establish a presumption against granting or restoring
      a clearance when security concerns are present.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Guideline G was properly invoked; DOE regulations create a presumption against
      granting a clearance when security concerns exist.
  - id: C2
    facts:
    - F2
    - F1
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The DOE Psychologist identified a pattern of impaired judgment and problematic
      drinking tied to four alcohol‑related arrests, satisfying the statutory criteria
      for a disqualifying concern under Guideline G.
  - id: C3
    facts:
    - F4
    - F5
    equity: due_process
    favors:
    - O1
    weight: weak
    why: Although the Individual has attended AA/SMART meetings and the OM Psychologist
      notes remission, the Individual has not obtained a sponsor, completed the Twelve‑Step
      program, or fully acknowledged an alcohol problem, limiting the weight of mitigating
      evidence.
  - id: C4
    facts:
    - F3
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Fourteen months of negative PEth tests demonstrate abstinence, but the adjudicative
      guidelines require insight and commitment; the lack of self‑identification as
      an alcoholic undermines the credibility of the abstinence claim.
  - id: C5
    facts:
    - F2
    - F5
    equity: norm_reciprocity
    favors:
    - O1
    weight: weak
    why: Paragraph 23(c) mitigation is potentially present, yet the Judge finds the
      Individual’s progress unsatisfactory because of prior relapse and ongoing contemplation
      of drinking.
  reasoning:
    read: The case hinges on whether the Individual has resolved the security concern
      under Guideline G. The record shows a long history of alcohol‑related arrests,
      a professional assessment of impaired judgment, and recent abstinence documented
      by PEth testing, but also a lack of full acknowledgment of an alcohol problem
      and minimal engagement with AA’s core requirements.
    weighing: The Judge applied the presumption against restoration (C1) and gave
      decisive weight to the DOE Psychologist’s finding of a problematic drinking
      pattern (C2). While the Individual’s abstinence and treatment (C3‑C5) are positive,
      the Judge concluded they do not overcome the risk because the Individual has
      not demonstrated insight or a permanent commitment to sobriety, echoing the
      source’s language that “the risk is too great to resolve the security concerns.”
    tradecraft: The decision is recorded in the Administrative Judge’s formal Decision,
      citing the relevant CFR provisions and Adjudicative Guidelines, and the outcome
      is communicated to the Local Security Office for implementation.
    uncertainty: The primary uncertainty lies in the Individual’s future behavior;
      the Judge notes the possibility of relapse but finds the current evidence insufficient
      to mitigate the concern.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. §
      710.25(d)‑(g). No further agency referral is required.
    tempting_wrong:
      option: O2
      pull: The fourteen consecutive negative PEth tests and documented treatment
        could suggest rehabilitation.
      why_wrong: The source emphasizes that without self‑identification as an alcoholic,
        a sponsor, and a demonstrated commitment to permanent abstinence, the risk
        of future impaired judgment remains unacceptably high.
    rejected:
      O2: Restoration would ignore the unresolved insight and commitment issues highlighted
        by the DOE Psychologist and the Judge.
      O3: Holding the decision pending additional evidence is unnecessary because
        the record already shows the key mitigating factor—insufficient insight—has
        not been met.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual obtained an AA sponsor, completed the Twelve‑Step program,
        and demonstrated a permanent commitment to abstinence for at least one year
      then: O2
      why: Paragraph 23(c) mitigation would be satisfied, removing the risk of relapse
        that the Judge found decisive.
    would_not_change:
    - id: noflip1
      if: the Individual continued to lack insight into her alcohol problem despite
        abstinence
      why: The Judge expressly stated that lack of insight keeps the risk too great,
        so denial remains appropriate.
    watch_for:
    - id: watch1
      what: any future alcohol‑related arrest or positive PEth test
      favors:
      - O1
      why: A new incident would reaffirm the security concern under Guideline G.
  lesson: Under Guideline G, documented abstinence and treatment are insufficient
    if the individual does not demonstrate insight and a permanent commitment to sobriety;
    the presumption against clearance remains unless all mitigation criteria are fully
    met.
  limits: This reasoning applies only to security clearance determinations under DOE’s
    Part 710 and Guideline G. It does not extend to other adjudicative guidelines
    or to non‑DOE personnel security programs.
