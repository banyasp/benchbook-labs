case:
  id: DR-H3-PSH-24-0109-PSH-24-0031-PSH-24-0109@v1
  title: Guideline G Alcohol Consumption – Access Authorization Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, July 2024
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual has a positive PEth test indicating recent alcohol use,
    a negative EtG test, and a DOE psychologist’s report diagnosing Alcohol Use Disorder
    and describing heavy and binge drinking. The Individual told investigators he
    had only consumed a few drinks in the past month and that he drank two to three
    drinks at the event where he was cited for sexual battery, admitting to occasional
    intoxication. The LSO has raised a security concern under Guideline G, citing
    the alcohol test results, the psychologist’s diagnosis, and the Individual’s criminal
    conduct while intoxicated. The Individual has not followed the psychologist’s
    recommendation to abstain from alcohol for twelve months or to undergo periodic
    PEth testing, and he remains on probation for the battery charge. The Administrative
    Judge must determine whether the Guideline G concern has been resolved sufficiently
    to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending additional alcohol testing.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual’s PEth test result was 192 ng/mL, indicating recent alcohol
      consumption.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual’s EtG test was negative for traces of alcohol consumption.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The DOE psychologist concluded the Individual meets diagnostic criteria
      for Alcohol Use Disorder under DSM‑5 and described heavy and binge drinking.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual reported consuming only one to three alcoholic drinks in
      the past thirty days during the clinical interview.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual stated he consumed two to three drinks at the June 24, 2023
      event and that he had been intoxicated on three occasions in the prior twelve
      months.
  - id: F6
    kind: authority
    status: confirmed
    fact: The LSO cited Guideline G (Alcohol Consumption) as a security concern, alleging
      heavy alcohol use, binge drinking, and impaired judgment.
  - id: F7
    kind: capability
    status: assessed
    fact: The Individual has not complied with the DOE psychologist’s recommendation
      to abstain from alcohol for over twelve months and to undergo regular PEth testing.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual is on probation for the amended battery charge, which will
      continue until February 2025.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The PEth result of 192 ng/mL, together with the psychologist’s diagnosis
      of Alcohol Use Disorder and the Individual’s failure to follow the recommended
      abstinence, demonstrates ongoing heavy/binge drinking that threatens reliability
      and judgment.
  - id: C2
    facts:
    - F4
    - F5
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual’s self‑reports of only 1‑3 drinks in the past month conflict
      with the biomarker evidence and the psychologist’s assessment, indicating deliberate
      under‑reporting.
  - id: C3
    facts:
    - F8
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Probation for the battery charge remains in effect until February 2025, showing
      that the conduct that prompted the alcohol misuse is still recent and unresolved.
  - id: C4
    facts:
    - F1
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The adjudicative guidelines treat a positive PEth as strong evidence of recent
      alcohol consumption; the psychologist’s reliance on peer‑reviewed interpretation
      is consistent with agency practice.
  reasoning:
    read: The record shows a positive PEth biomarker, a negative EtG, a psychologist’s
      AUD diagnosis, and the Individual’s contradictory statements about his drinking.
      The security concern under Guideline G hinges on whether the Individual has
      remedied his problematic alcohol use.
    weighing: Applying the Adjudicative Guidelines, the Administrative Judge found
      that none of the mitigating conditions for Guideline G were satisfied. {C1}
      shows ongoing heavy use; {C2} shows intentional misrepresentation; {C3} shows
      the conduct remains recent; {C4} confirms the reliability of the biomarker.
      Consequently, the balance tips decisively toward denial.
    tradecraft: The decision is recorded in the official OHA decision, citing the
      relevant CFR provisions and the Guideline G analysis, and the denial is entered
      into the Individual’s security file.
    uncertainty: The only uncertainty is the negative EtG, which reflects only short‑term
      abstinence and does not outweigh the longer‑term PEth evidence.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to resolve the eligibility determination.
    tempting_wrong:
      option: O1
      pull: The Individual’s claim of minimal recent drinking and his participation
        in counseling might suggest a low risk.
      why_wrong: The claim is contradicted by objective biomarker data and the psychologist’s
        professional judgment, indicating a higher risk than the Individual asserts.
    rejected:
      O1: Granting would ignore the positive PEth, the psychologist’s AUD diagnosis,
        and the Individual’s failure to follow treatment.
      O3: Holding pending further testing would prolong a known security risk without
        addressing the underlying non‑compliance.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual abstains from alcohol for twelve consecutive months and provides
        negative PEth results during that period.
      then: O1
      why: Meeting mitigating condition (b) of Guideline G would demonstrate that
        the problematic behavior is unlikely to recur.
    would_not_change:
    - id: noflip1
      if: Only a negative EtG test is presented without a corresponding negative PEth
        or documented abstinence.
      why: EtG reflects only the prior 48‑96 hours and does not address the longer‑term
        binge‑drinking pattern identified by PEth.
    watch_for:
    - id: watch1
      what: Future compliance with the psychologist’s recommended twelve‑month abstinence
        and periodic PEth testing.
      favors:
      - O1
      why: Demonstrated sustained remediation would satisfy mitigating condition (b)
        and (d) of Guideline G.
  lesson: Under Guideline G, a positive PEth biomarker and failure to follow prescribed
    treatment outweigh any self‑reported low consumption; all mitigating conditions
    must be satisfied before clearance can be restored. Objective evidence of ongoing
    alcohol misuse is decisive.
  limits: This analysis applies only to DOE personnel‑security determinations governed
    by 10 C.F.R. Part 710 and the Adjudicative Guidelines; it does not extend to criminal
    sentencing or civilian licensing contexts.
