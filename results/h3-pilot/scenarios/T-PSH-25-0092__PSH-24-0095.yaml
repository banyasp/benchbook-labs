case:
  id: DR-H3-PSH-25-0092-PSH-24-0095-PSH-25-0092@v1
  title: Guideline G Alcohol Use Clearance Determination
  status: draft
  setting: DOE Office of Hearings and Appeals, September 2025
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised a security concern under Guideline G
    because the Individual was arrested for a DUI and was diagnosed with severe alcohol
    use disorder. The Individual presented evidence of abstinence, including negative
    PEth and breath tests covering ten months, an alcohol monitoring device that recorded
    no consumption, and participation in a weekly faith‑based recovery group. He also
    completed an intensive outpatient program, though he reported finding it of limited
    value. The DOE‑appointed psychologist reaffirmed the severe AUD diagnosis, noted
    the Individual’s limited insight, and concluded that the evidence of rehabilitation
    was insufficient, recommending a twelve‑month abstinence period that the Individual
    had not yet met. The regulatory framework presumes against granting a clearance
    and requires that any restoration not endanger national security. The Administrative
    Judge must decide whether the security concerns have been mitigated sufficiently
    to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge grants the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline G based
      on the Individual’s DUI arrest and a diagnosis of severe alcohol use disorder.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested in September 2024 for driving under the influence
      and violation of implied consent.
  - id: F3
    kind: situation
    status: confirmed
    fact: A DOE‑appointed psychologist diagnosed the Individual with severe alcohol
      use disorder in November 2024.
  - id: F4
    kind: situation
    status: confirmed
    fact: Four PEth tests and two breath alcohol tests conducted between March and
      June 2025 were negative, indicating ten months of abstinence.
  - id: F5
    kind: situation
    status: confirmed
    fact: Since December 2024 the Individual has attended a weekly faith‑based recovery
      group led by a pastor without formal substance‑abuse training.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual completed an intensive outpatient program from October to
      November 2024 but testified that he found the program not valuable.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The DOE psychologist concluded that the Individual had not provided adequate
      evidence of rehabilitation and gave a guarded prognosis, noting the need for
      twelve months of abstinence which the Individual had not yet achieved.
  - id: F8
    kind: authority
    status: confirmed
    fact: Regulatory standards under 10 C.F.R. § 710.7(a) presume against granting
      or restoring a security clearance and require that the decision not endanger
      the common defense and be clearly consistent with the national interest.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline G applies to excessive alcohol use; the LSO’s concern is based
      on a DUI arrest and a DOE‑psychologist diagnosis of severe AUD, which the regulations
      identify as a disqualifying condition.
  - id: C2
    facts:
    - F4
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The psychologist required twelve months of documented abstinence; the Individual
      has only ten months of negative PEth/breath tests, so the evidence falls short
      of the prescribed mitigation standard.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The recovery group is led by a pastor without substance‑abuse training and
      does not meet the definition of a qualified treatment program, so it cannot
      satisfy mitigating factor (c) or (d) of the Adjudicative Guidelines.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 10 C.F.R. § 710.7(a) creates a presumption against granting or restoring
      a clearance; the burden is on the Individual to prove that restoration will
      not endanger the common defense.
  - id: C5
    facts:
    - F3
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The psychologist noted the Individual’s limited insight into his alcohol
      problem, which undermines confidence that the behavior will not recur.
  reasoning:
    read: The case concerns whether the Individual has mitigated the security concern
      under Guideline G, focusing on recent DUI, severe AUD diagnosis, and the adequacy
      of rehabilitation evidence.
    weighing: The Administrative Judge applied the Adjudicative Guidelines’ mitigating
      factors and found none satisfied. {C1} establishes the statutory trigger; {C2}
      shows the abstinence period is insufficient; {C3} shows the recovery group is
      not a qualified program; {C4} reinforces the regulatory presumption; {C5} adds
      the psychologist’s concern about insight. The balance therefore tips decisively
      toward denial.
    tradecraft: The Judge records the decision in the official OHA decision, cites
      the relevant CFR provisions and Guideline paragraphs, and notifies the Individual
      of the right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty is whether future evidence of a longer abstinence
      period or participation in a qualified program could alter the assessment, but
      that does not affect the present ruling.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.27(d);
      no further agency review is required unless the Individual appeals.
    tempting_wrong:
      option: O1
      pull: The Individual’s ten‑month abstinence and negative tests might appear
        sufficient to some reviewers.
      why_wrong: The source explicitly states that the required twelve‑month period
        was not met and that the recovery group lacks qualified leadership, so granting
        would ignore the mandated mitigation standards.
    rejected:
      O1: The security concern remains unresolved because the Individual has not met
        the twelve‑month abstinence requirement, lacks adequate insight, and has not
        participated in a qualified treatment program.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual achieves twelve months of documented abstinence and completes
        a qualified substance‑abuse treatment program with a trained sponsor.
      then: O1
      why: Meeting the twelve‑month abstinence recommendation and participating in
        an appropriate treatment program would satisfy mitigating factors (b) and
        (d).
    would_not_change:
    - id: noflip1
      if: The Individual continues to lack insight into his alcohol problem despite
        abstinence.
      why: Limited insight into his alcohol problem remains a concern and prevents
        mitigation.
    watch_for:
    - id: watch1
      what: Any new, verifiable evidence of sustained abstinence beyond twelve months
        or enrollment in a DOE‑approved treatment program.
      favors:
      - O1
      why: Such evidence would directly address the deficiencies identified by the
        Judge.
  lesson: Under Guideline G, mitigation requires documented long‑term abstinence,
    participation in a qualified treatment program, and demonstrable insight into
    the alcohol problem; absent those, a clearance cannot be restored. The regulatory
    presumption against granting clearance remains decisive.
  limits: This analysis applies only to DOE personnel security clearances governed
    by 10 C.F.R. Part 710 and the Adjudicative Guidelines; it does not extend to criminal
    sentencing or civilian licensing contexts.
