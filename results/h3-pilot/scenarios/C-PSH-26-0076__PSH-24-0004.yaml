case:
  id: DR-H3-PSH-26-0076-PSH-24-0004-PSH-24-0004@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, January 2024
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, has a documented history of
    alcohol misuse, including two DUIs and prior treatment. In March 2023 he self‑reported
    ongoing alcohol issues to his manager and filed a Personnel Security Information
    Report. The Local Security Office issued a Letter of Interrogatory and a Notification
    Letter citing Guideline G because a DOE psychologist diagnosed him with severe
    Alcohol Use Disorder and cited a high PEth test result. The Individual claims
    he has abstained since August 2023, attended AA meetings, completed a short inpatient
    program, and is enrolled in a ten‑week IOP with monthly PEth testing, but he has
    provided no documented evidence of abstinence or treatment progress. The regulations
    place the burden on the Individual to resolve security concerns and presume against
    granting clearance.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge requests further documented proof of abstinence.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested and convicted of DUI in 2007 and again in 2009,
      receiving jail time, fines, license suspensions, and ignition interlock requirements.
  - id: F2
    kind: situation
    status: confirmed
    fact: In 2010 the Individual completed a nine‑month intensive outpatient program
      for alcohol‑related treatment and reported abstinence until 2014, when he resumed
      drinking.
  - id: F3
    kind: situation
    status: confirmed
    fact: On March 7, 2023 the Individual told his manager he was trying to stop drinking
      and was attending AA, and the next day filed a PSIR disclosing his alcohol abuse.
  - id: F4
    kind: situation
    status: confirmed
    fact: The LSO issued a Letter of Interrogatory and a Notification Letter stating
      substantial doubt about the Individual’s eligibility under Guideline G, based
      on alleged habitual or binge drinking and a severe AUD diagnosis.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A DOE‑contracted psychologist evaluated the Individual, diagnosed him with
      Alcohol Use Disorder, Severe, and concluded he habitually or binge consumed
      alcohol to the point of impaired judgment, citing a PEth level of 1,096 ng/mL.
  - id: F6
    kind: situation
    status: assessed
    fact: The Individual asserts he has been abstinent since August 18, 2023, began
      AA meetings in September, completed inpatient treatment September 14–October 11,
      and is enrolled in a ten‑week IOP with monthly PEth testing, but he has not
      provided documentation of abstinence or treatment progress.
  - id: F7
    kind: authority
    status: confirmed
    fact: Guideline G mitigation may apply if sufficient time has passed, the individual
      acknowledges the problem and shows a clear pattern of modified consumption or
      abstinence, participates in treatment with satisfactory progress, or completes
      treatment with aftercare.
  - id: F8
    kind: authority
    status: confirmed
    fact: The regulations at Part 710 require the Individual to provide evidence to
      resolve security concerns and presume against granting or restoring a clearance.
  considerations:
  - id: C1
    facts:
    - F5
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline G applies because the DOE psychologist diagnosed severe AUD and
      a high PEth level, creating substantial doubt under the Adjudicative Guidelines.
  - id: C2
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The Individual bears the burden to provide evidence of mitigation; he has
      not documented abstinence or treatment progress, so the mitigating conditions
      in §5.6‑5.8 are not satisfied.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The record shows a long history of alcohol misuse, multiple DUIs, and relapse
      after prior treatment, indicating a high risk of recurrence.
  - id: C4
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Although the Individual claims recent abstinence and enrollment in an IOP,
      no corroborating test results or professional testimony were offered.
  reasoning:
    read: The LSO raised a Guideline G security concern based on a severe AUD diagnosis
      and a PEth result indicating heavy recent drinking. The Individual must overcome
      that concern by meeting one of the statutory mitigation criteria, which he has
      not satisfied.
    weighing: The Administrative Judge applied the Adjudicative Guidelines (¶ 21‑22)
      and Part 710’s presumption against restoration. Because the Individual failed
      to demonstrate the required period of abstinence, documented treatment progress,
      or completion of a prescribed program ({C2}), the mitigating factors in §§ 5.6‑5.8
      are inapplicable ({C1},{C3}). The balance therefore tips toward denial.
    tradecraft: Record the denial in the official Decision, cite the specific regulatory
      paragraphs and the psychologist’s report, and note the lack of supporting documentation.
      Ensure the decision is entered into the DOE personnel security system and the
      Individual is notified of his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The only uncertainty is whether future, verifiable evidence of sustained
      abstinence could alter the assessment; the current record is conclusive for
      denial.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to weigh the evidence and issue the final determination.
    tempting_wrong:
      option: O2
      pull: The Individual’s self‑reported abstinence and enrollment in an IOP might
        appear sufficient to a lay observer.
      why_wrong: Without documented proof of abstinence or completed treatment, the
        statutory burden remains unmet, and granting clearance would contravene the
        presumption against restoration.
    rejected:
      O2: Restoration is rejected because the Individual has not satisfied any of
        the four mitigation conditions and the record still shows substantial doubt.
      O3: Holding the decision pending would unnecessarily delay a determination when
        the record already shows the mitigation criteria are unmet.
      O4: A request for additional proof is unnecessary at this stage; the decision
        can be rendered now because the burden has not been met.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provided documented evidence of at least twelve months of
        continuous abstinence verified by monthly PEth testing, or completed the full
        inpatient program plus after‑care as recommended.
      then: O2
      why: Meeting the 12‑month abstinence benchmark satisfies mitigation condition
        (b) and (d) of Guideline G, removing the substantial doubt.
    - id: flip2
      if: The Individual produced corroborating testimony or records from a qualified
        treatment professional showing satisfactory progress in the IOP.
      then: O2
      why: Satisfactory progress would satisfy mitigation condition (c) of Guideline G.
    would_not_change:
    - id: noflip1
      if: The Individual merely attends AA meetings without a sponsor or documented
        abstinence.
      why: Attendance alone does not meet any of the mitigation criteria outlined
        in §§ 5.6‑5.8.
    watch_for:
    - id: watch1
      what: Any future submission of verified PEth results showing zero alcohol consumption
        for a continuous twelve‑month period.
      favors:
      - O2
      why: Such evidence would directly satisfy the prescribed abstinence requirement.
  lesson: Under Guideline G, an individual must provide documented, sustained abstinence
    or completed treatment that meets the specific mitigation criteria; self‑reported
    progress without corroboration is insufficient to overcome a security concern.
  limits: This analysis applies only to security clearance determinations under DOE
    Part 710 and Guideline G. It does not address other adjudicative guidelines or
    non‑DOE personnel‑security contexts.
