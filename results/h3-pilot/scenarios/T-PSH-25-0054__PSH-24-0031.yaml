case:
  id: DR-H3-PSH-25-0054-PSH-24-0031-PSH-25-0054@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, February 2025
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual was arrested for driving under the influence on October
    28, 2023, with blood alcohol concentrations of .225 and .205. He later denied
    any alcohol consumption since that arrest during a psychological evaluation on
    June 24, 2024. A phosphatidylethanol (PEth) test taken on July 15, 2024 returned
    a positive result of 163 ng/mL, indicating alcohol use within the prior three
    to four weeks. The DOE Psychologist concluded the evidence was inconclusive regarding
    an alcohol use disorder but noted the Individual’s lack of candor. The Local Security
    Office cited Guideline G, asserting that the Individual habitually and binge‑consumed
    alcohol to the point of impaired judgment. The Individual later admitted to consuming
    twenty to thirty drinks over four days on a family vacation in early July 2024
    and continues to drink socially, becoming intoxicated on multiple occasions.
  question: What should the Administrative Judge do regarding the Individual’s Guideline
    G security concern?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization
        under Guideline G.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision on the Individual’s access authorization
        under Guideline G pending evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge grants restoration of the Individual’s access authorization
        under Guideline G.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested for DUI on October 28, 2023, with BAC .225 and
      .205.
  - id: F2
    kind: situation
    status: confirmed
    fact: During a psychological evaluation on June 24, 2024, the Individual denied
      any alcohol consumption since the October 2023 arrest.
  - id: F3
    kind: situation
    status: confirmed
    fact: A PEth test performed on July 15, 2024 was positive at 163 ng/mL, indicating
      recent alcohol use.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The DOE Psychologist concluded the evidence was inconclusive regarding an
      alcohol use disorder but noted the Individual’s lack of candor.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline G (Alcohol Consumption) as a basis
      for security concerns.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual reported consuming twenty to thirty drinks over four days
      on a family vacation in early July 2024.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual continues to consume alcohol socially several days per month
      and has become intoxicated on at least two occasions since the clinical interview.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The positive PEth test (163 ng/mL) and the Individual’s admission of consuming
      20‑30 drinks over four days, plus continued intoxication, demonstrate ongoing
      hazardous alcohol use, satisfying Guideline G’s concern of habitual or binge
      consumption.
  - id: C2
    facts:
    - F2
    - F4
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The Individual denied any alcohol use since the October 2023 DUI during the
      June 2024 psychological interview, yet biomarker evidence shows consumption,
      indicating lack of candor that aggravates the security concern under Guideline E
      and G.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Local Security Office correctly invoked Guideline G, and the Administrative
      Judge must apply the Adjudicative Guidelines, which place a presumption against
      restoration when unresolved alcohol misuse exists.
  - id: C4
    facts:
    - F1
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The prior DUI arrests (BAC .225/.205) illustrate a pattern of impaired judgment,
      reinforcing the assessment that the Individual’s alcohol behavior poses a reliability
      risk.
  reasoning:
    read: The record shows the Individual has repeatedly driven while intoxicated,
      denied alcohol use when questioned, and later produced biomarker evidence of
      recent drinking. The Judge must decide whether the Guideline G concern—habitual
      or binge alcohol consumption impairing judgment—has been mitigated.
    weighing: I find that the LSO’s allegations that the Individual engaged in habitual
      or binge consumption of alcohol to the point of impaired judgment are sufficiently
      supported to raise security concerns under Guideline G, that the Individual’s
      problematic alcohol consumption is likely ongoing, that none of the mitigating
      conditions under Guideline G apply, and therefore the Individual has not resolved
      the security concerns asserted by the LSO under Guideline G.
    tradecraft: The decision is entered into the official OHA record, cited to the
      relevant CFR §§ 710.5, 710.7, and the Adjudicative Guidelines. The denial is
      communicated to the Individual with a summary of the evidentiary basis and notice
      of appeal rights.
    uncertainty: The only residual uncertainty is whether the Individual might later
      provide credible evidence of sustained abstinence or completed treatment, which
      could alter the mitigation analysis.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      Judge sole authority to weigh the evidence and apply the Guidelines.
    tempting_wrong:
      option: O3
      pull: The Individual’s prior successful completion of a 2008 alcohol‑education
        class might suggest a chance for restoration.
      why_wrong: The source explicitly finds that the Individual has not engaged in
        any new treatment or demonstrated sustained abstinence, so the earlier class
        does not satisfy any mitigating condition.
    rejected:
      O2: Holding the decision pending further evidence would ignore the clear, contemporaneous
        biomarker and admissions that the source deemed sufficient to resolve the
        Guideline G concern.
      O3: Granting restoration would conflict with the source’s finding that none
        of the mitigating conditions under Guideline G are met.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual completed an approved alcohol‑treatment program and provided
        documented evidence of sustained abstinence for at least one year
      then: O3
      why: Such evidence would satisfy mitigating condition (b) and (d) under Guideline G,
        removing the unresolved alcohol‑misuse concern.
    would_not_change:
    - id: noflip1
      if: the Individual continued to deny any alcohol consumption despite the PEth
        result
      why: The source already found the lack of candor sufficient to sustain the Guideline G
        concern.
    watch_for:
    - id: watch1
      what: any future PEth tests returning negative results combined with verified
        treatment completion
      favors:
      - O3
      why: Negative biomarkers and documented treatment would address the unresolved
        alcohol‑use issue.
  lesson: When an individual’s recent alcohol consumption is proven by biomarker evidence
    and the person has not engaged in treatment or demonstrated sustained abstinence,
    Guideline G remains unresolved, justifying denial of clearance restoration. Lack
    of candor further reinforces the adverse finding.
  limits: This analysis applies only to DOE personnel‑security determinations under
    10 C.F.R. Part 710 and the Adjudicative Guidelines; it does not address criminal
    liability or civil employment rights outside the security‑clearance context.
