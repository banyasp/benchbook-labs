case:
  id: DR-H3-PSH-23-0055-PSH-19-0040-PSH-19-0040@v1
  title: Guideline F Financial Considerations – Clearance Determination
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, October 2019
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office alleged that the Individual failed to file
    Federal tax returns for 2015, 2016, and 2017 and failed to file state tax returns
    for multiple years between 2011 and 2017. The Individual later filed Federal returns
    for 2015 and 2016 on November 8 2017 and filed the 2017 Federal return by September 2019,
    and also filed the outstanding state returns for both State A and State B by early
    October 2019. He still owes taxes to the IRS and the two states and has entered
    a payment plan with the IRS but has not finalized repayment arrangements with
    the states. He hired a CPA in June 2019 to prepare and file the missing returns.
    Guideline F treats failure to meet financial obligations as a security concern,
    and the regulations allow mitigation only if certain conditions are met.
  question: What should the Administrative Judge do regarding the Individual's security
    clearance under Guideline F?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional proof of
        repayment plans.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge grants the Individual's security clearance under
        Guideline F.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge denies the Individual's security clearance under
        Guideline F.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge asks the Individual to submit finalized payment
        agreements before ruling.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office alleged the Individual failed to file Federal
      tax returns for 2015, 2016, and 2017.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office alleged the Individual failed to file state tax
      returns for 2011‑2017 in both State A and State B.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual filed his Federal tax returns for 2015 and 2016 on November 8 2017.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual filed his Federal tax return for 2017 by September 2019.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual filed all outstanding state tax returns for State A and State B
      by early October 2019.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual still owes $1,929 to the IRS for 2017 and various amounts
      to State A and State B for earlier years.
  - id: F7
    kind: situation
    status: assessed
    fact: The Individual has entered a payment plan with the IRS but has not finalized
      repayment plans with the state taxing authorities.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual hired a Certified Public Accountant in June 2019 to prepare
      and file the missing returns.
  - id: F9
    kind: authority
    status: confirmed
    fact: Guideline F treats failure to meet financial obligations as a disqualifying
      security concern.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The Individual’s prolonged failure to file Federal and state tax returns
      (2011‑2017) demonstrates poor judgment and unreliability, which the Guideline
      F security concern expressly treats as disqualifying.
  - id: C2
    facts:
    - F5
    - F7
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline F mitigation requires that the individual have finalized repayment
      arrangements or a good‑faith effort that is demonstrably under control; the
      record shows only pending plans and no final agreements.
  - id: C3
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The LSO correctly invoked Guideline F under the DOE regulations, and the
      Administrative Judge must apply that authority.
  - id: C4
    facts:
    - F5
    - F7
    equity: resource_stewardship
    favors:
    - O3
    weight: weak
    why: Although the Individual has now filed the missing returns, the outstanding
      tax debts remain and the lack of finalized payment plans leaves a financial
      vulnerability that could affect national security.
  reasoning:
    read: The case hinges on whether the Individual’s recent filing of overdue tax
      returns and entry into a payment plan sufficiently mitigates the financial‑consideration
      security concern. The trap is to assume that filing alone cures the concern,
      whereas the Guideline F mitigation criteria are stricter.
    weighing: The judge weighed the serious, repeated non‑filings (C1) against the
      absence of the specific mitigation factors listed in Guideline F (C2, C4). Because
      the LSO properly invoked Guideline F (C3) and none of the required mitigation
      conditions are satisfied, the balance favors denial.
    tradecraft: The decision is recorded in the Administrative Judge’s formal Decision,
      citing the relevant regulatory sections and the evidentiary record, and the
      parties are notified of their right to appeal under 10 C.F.R. § 710.28.
    uncertainty: There is uncertainty about the timing and amount of future repayments,
      but the lack of finalized agreements at the time of decision precludes reliance
      on speculative future compliance.
    handoff: The Administrative Judge decides alone, as the statutory authority vested
      in the OHA judge is exclusive for this adjudication.
    tempting_wrong:
      option: O2
      pull: The Individual has now filed all missing returns and entered a payment
        plan, which might suggest remediation.
      why_wrong: The source explicitly states that filing alone does not meet any
        of the mitigation conditions in Guideline F, so granting would contravene
        the regulation.
    rejected:
      O1: Holding the decision pending further proof would delay a required determination
        despite the clear regulatory finding that mitigation is absent.
      O2: Granting the clearance ignores the unmet mitigation criteria under Guideline F.
      O4: Requesting additional documents would be unnecessary because the record
        already shows the mitigation conditions are not satisfied.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had entered into finalized repayment agreements with the
        IRS and both State A and State B and demonstrated ongoing compliance.
      then: O2
      why: Guideline F mitigation under sections 20(d) and 20(e) would then be satisfied,
        allowing a grant.
    would_not_change:
    - id: noflip1
      if: The Individual had never filed any of the overdue returns.
      why: The security concern would remain disqualifying under Guideline F.
    watch_for:
    - id: watch1
      what: Evidence that the finalized payment plans have been executed and the debts
        are being satisfied.
      favors:
      - O2
      why: Such evidence would satisfy the mitigation criteria in Guideline F.
  lesson: Under DOE Guideline F, failure to meet financial obligations is a disqualifying
    security concern unless the specific mitigation conditions—such as finalized repayment
    arrangements or a demonstrated, lasting good‑faith effort—are met. Merely filing
    overdue returns does not automatically remove the concern.
  limits: This analysis applies only to DOE personnel‑security clearance determinations
    that invoke Guideline F. It does not extend to civilian employment decisions,
    criminal tax enforcement, or other agencies’ security programs.
