case:
  id: DR-H3-PSH-26-0025-PSH-23-0078-PSH-23-0078@v1
  title: Guideline J Criminal Conduct – Clearance Restoration Decision
  status: draft
  setting: Office of Hearings and Appeals, Department of Energy, July 2023
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual’s security clearance was revoked after the Local Security
    Office raised concerns under Guideline J for alleged criminal conduct. The Individual
    was arrested in June 2022 and charged with Felony Aggravated Battery of a Household
    Member, leading to a Temporary Order of Protection that was later dismissed. The
    criminal case itself was dismissed in March 2023. The Individual admitted to consuming
    alcohol before the incident and continues to drink, though he reports reduced
    use. A DOE‑consultant psychologist concluded the Individual frequently uses alcohol
    excessively and lacks candor, suggesting possible mental‑health concerns. The
    Individual has not submitted additional PEth tests or entered a treatment program,
    and there is no evidence of rehabilitation or community involvement.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline J?
  options:
    O1:
      do: The Administrative Judge asks the Individual to provide a treatment plan.
      move: ask
      irreversible: false
    O2:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending additional evidence
        of rehabilitation.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with Felony Aggravated Battery of
      a Household Member in June 2022.
  - id: F2
    kind: situation
    status: confirmed
    fact: A Temporary Order of Protection was issued after the arrest and was dismissed
      in August 2022.
  - id: F3
    kind: situation
    status: confirmed
    fact: The criminal matter was dismissed in March 2023.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual admitted consuming approximately five beers before the June
      2022 incident and was intoxicated at the time.
  - id: F5
    kind: situation
    status: assessed
    fact: The Individual reports current alcohol consumption of two to three drinks
      once or twice per week and says he is willing to reduce or abstain.
  - id: F6
    kind: situation
    status: confirmed
    fact: The DOE Psychologist concluded the Individual frequently uses alcohol excessively,
      beyond the level that impairs judgment, and noted a lack of candor indicating
      possible mental‑health issues.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline J concerns based on the June 2022
      alleged criminal conduct.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual has not submitted any PEth tests since the January 2023 evaluation
      and has not entered a treatment program for alcohol use.
  - id: F9
    kind: situation
    status: assessed
    fact: The Individual and his girlfriend have resumed cohabitation and are receiving
      individual counseling, but no joint treatment for the incident.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The alleged criminal conduct occurred only months before the hearing; the
      time elapsed is insufficient to satisfy mitigating factor (a) under Guideline
      J, which requires that so much time has passed that recurrence is unlikely.
  - id: C2
    facts:
    - F8
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: I have no evidence before me that the Individual has taken any PEth tests
      since the January 2023 evaluation and has not entered a treatment program for
      alcohol use.
  - id: C3
    facts:
    - F5
    - F6
    - F8
    equity: oversight_candor
    favors:
    - O2
    weight: strong
    why: Continued alcohol consumption and the psychologist’s finding of frequent
      excessive use, coupled with the Individual’s denial of a problem, undermine
      trustworthiness and reliability, a core concern of Guideline J.
  - id: C4
    facts:
    - F1
    - F2
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Police incident reports, the temporary order of protection, and the felony
      charge provide reliable evidence that the Individual engaged in violent conduct,
      satisfying the “evidence of criminal conduct” prong of Guideline J.
  reasoning:
    read: The Local Security Office cited Guideline J concerns based on the June 2022
      alleged criminal conduct.
    weighing: Each consideration (C1‑C4) points to an unmet mitigating factor under
      Guideline J. The Judge repeatedly notes the absence of elapsed time, rehabilitation,
      or evidence of changed behavior, and therefore concludes that restoring the
      clearance would endanger the common defense. The balance of the source’s analysis
      therefore supports denial.
    tradecraft: The Judge records the decision in the official OHA decision docket,
      cites the relevant CFR and Adjudicative Guidelines, and notifies the Individual
      of the denial and appeal rights per 10 C.F.R. § 710.28.
    uncertainty: The source expresses minimal uncertainty; the evidence is deemed
      sufficient to deny restoration.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. §
      710.25(d)‑(g). No additional agency involvement is required.
    tempting_wrong:
      option: O4
      pull: The criminal case was dismissed and the Individual claims reduced drinking,
        which might suggest a lower risk.
      why_wrong: The source finds that dismissal does not erase the reliable evidence
        of violent conduct nor the lack of demonstrated rehabilitation, so granting
        would conflict with Guideline J.
    rejected:
      O1: Asking for a treatment plan would not address the unmet mitigating factors
        already identified.
      O3: Holding the decision pending evidence would unnecessarily delay a decision
        when the record already shows no mitigation.
      O4: Granting restoration ignores the unresolved concerns under Guideline J as
        articulated by the Judge.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual completes twelve months of documented abstinence, provides
        negative PEth tests every six weeks, and submits a satisfactory treatment
        plan.
      then: O4
      why: This would satisfy mitigating factor (b) under Guideline J, showing successful
        rehabilitation and reduced risk.
    - id: flip2
      if: New credible evidence shows the Individual did not commit the alleged battery
        (e.g., exonerating testimony).
      then: O4
      why: Absence of reliable evidence of the criminal act would satisfy mitigating
        factor (c).
    would_not_change:
    - id: noflip1
      if: The Individual merely reduces his drinking frequency without abstaining
        or providing PEth verification.
      why: Reducing consumption alone does not meet any mitigating factor under Guideline
        J.
    watch_for:
    - id: watch1
      what: Submission of negative PEth test results and documented completion of
        an intensive outpatient program.
      favors:
      - O4
      why: These would demonstrate compliance with the psychologist’s recommendations
        and mitigate the alcohol‑related concerns tied to Guideline J.
  lesson: When criminal conduct is documented and no concrete evidence of rehabilitation
    or elapsed time is present, Guideline J requires denial of clearance restoration.
    Dismissal of charges alone does not satisfy the mitigating criteria.
  limits: This analysis applies only to DOE personnel security clearances governed
    by 10 C.F.R. Part 710 and the Adjudicative Guidelines; it does not extend to civilian
    employment decisions or criminal sentencing.
