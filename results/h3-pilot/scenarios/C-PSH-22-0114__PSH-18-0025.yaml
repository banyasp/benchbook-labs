case:
  id: DR-H3-PSH-22-0114-PSH-18-0025-PSH-18-0025@v1
  title: Guideline H Drug Involvement Security Concern
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, July 2 2018
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE employee with a security clearance, tested positive
    for marijuana in a random drug screening on November 28, 2017. The Individual
    had signed a 1988 DOE drug certification promising not to use illegal drugs while
    employed. He admitted the positive result and argued that the marijuana was unintentionally
    ingested in baked goods at a party two days earlier. He submitted a polygraph
    showing no intent to deceive, character letters, witness statements, and an email
    indicating he had advance notice of the screening and could have taken sick leave.
    The Local Security Office cited Guideline H, which treats illegal drug use as
    a security concern, and sought to deny restoration of the clearance. The Administrative
    Judge must decide whether the Individual’s explanations and mitigating evidence
    satisfy Guideline H so that the clearance can be restored.
  question: What should the Administrative Judge do regarding the Individual’s Guideline
    H security concern?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is a DOE employee who possesses a DOE security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: On November 28, 2017 the Individual tested positive for marijuana in a random
      drug screening.
  - id: F3
    kind: situation
    status: confirmed
    fact: In 1988 the Individual signed a DOE drug certification agreeing not to use
      illegal drugs while employed by DOE.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Individual claims the marijuana entered his system accidentally through
      baked goods consumed at a party on November 24, 2017.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual submitted a polygraph test indicating no intent to deceive
      about drug use, which the judge assigned minimal evidentiary weight.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual provided character letters, witness statements, and an email
      showing advance notice of the drug screening and the ability to take sick leave.
  - id: F7
    kind: authority
    status: confirmed
    fact: Guideline H treats illegal drug use as a security concern but allows mitigation
      if the behavior was accidental, infrequent, or unlikely to recur.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline H to argue that the Individual’s
      positive marijuana test warrants denial of clearance restoration.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline H expressly treats illegal drug use as a security concern, and
      the LSO correctly invoked it because the Individual tested positive for marijuana
      after signing a drug certification.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Individual’s claim of accidental ingestion rests on speculation and uncorroborated
      testimony; the polygraph was given minimal weight, and no independent evidence
      supports the allegation.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Guideline H mitigation factors (accidental, infrequent, unlikely to recur)
      are not satisfied; the Individual’s signed statement does not waive future clearance
      revocation and therefore provides no mitigation.
  - id: C4
    facts:
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Regulatory presumption is against granting or restoring a clearance; the
      burden is on the Individual to prove that restoration would not endanger the
      common defense, which he failed to meet.
  reasoning:
    read: The Administrative Judge must determine whether the Individual’s explanations
      and supporting evidence overcome the security concern raised under Guideline
      H. The core issue is the positive marijuana test after a sworn commitment not
      to use illegal drugs.
    weighing: The Judge applied the Guideline H standard (C1) and found the positive
      test sufficient to invoke the concern. The alleged accidental ingestion was
      deemed speculative (C2) and did not meet the mitigation criteria of Guideline
      H (C3). Because the regulatory framework places the burden on the Individual
      (C4) and that burden was not satisfied, the balance of considerations favors
      denial.
    tradecraft: The decision is recorded in the formal OHA Administrative Judge Decision,
      citing the relevant CFR sections and Guidelines, and the denial is entered as
      a final determination of the Individual’s access authorization status.
    uncertainty: The Judge noted the limited probative value of the polygraph and
      the lack of corroborating evidence, but concluded that the weight of the record
      leaves no reasonable doubt that the security concern remains unresolved.
    handoff: The Administrative Judge acted alone, as authorized by 10 C.F.R. § 710.25(d)-(g),
      and no further referral was required.
    tempting_wrong:
      option: O2
      pull: The Individual’s character letters, witness statements, and the fact that
        he had advance notice of the screening might tempt a more lenient view.
      why_wrong: These factors do not address the core violation of the drug certification
        nor provide credible proof of accidental ingestion; relying on them would
        contravene the explicit guidance of Guideline H.
    rejected:
      O2: Restoration was rejected because the Individual failed to provide sufficient
        evidence that the marijuana use was accidental, infrequent, or unlikely to
        recur, and because the positive test directly violated his signed drug certification.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had presented compelling, corroborated evidence that the
        marijuana was unintentionally ingested (e.g., an independent witness confirming
        the presence of marijuana in the baked goods).
      then: O2
      why: OHA has restored access authorizations in cases where individuals provided
        credible evidence of accidental ingestion.
    would_not_change:
    - id: noflip1
      if: The Individual relies solely on character letters, witness statements about
        his good character, and the email showing advance notice of the screening.
      why: These items were found insufficient to mitigate the Guideline H concern.
    watch_for:
    - id: watch1
      what: Any future shift in the weight given to polygraph results in security
        hearings.
      favors:
      - O2
      why: If polygraph evidence were treated as highly probative, it might offset
        the lack of other mitigation.
  lesson: Under Guideline H, a positive test for an illegal drug, especially after
    a signed certification, creates a security concern that cannot be mitigated by
    uncorroborated claims of accidental ingestion or character references alone.
  limits: This reasoning applies only when the individual cannot provide credible,
    independent evidence of accidental drug consumption and when the violation directly
    contravenes a signed drug certification. It does not address cases involving prescribed
    medication or lawful substances.
