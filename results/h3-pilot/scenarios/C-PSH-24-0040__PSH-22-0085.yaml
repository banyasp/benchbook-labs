case:
  id: DR-H3-PSH-24-0040-PSH-22-0085-PSH-22-0085@v1
  title: Guideline J Criminal Conduct Mitigation Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised security concerns under Guideline J
    because the Individual was charged with battery against a household member and
    criminal damage to property on November 2, 2021, after consuming alcohol. The
    Individual had a prior arrest in 2019 for intoxication and aggression at a concert.
    Since the November 2021 incident, the Individual has abstained from alcohol and
    provided negative PEth and EtG test results through July 2022. He completed an
    intensive outpatient program, began a regular outpatient program in May 2022,
    and regularly attends AA meetings. A DOE psychiatrist diagnosed him with moderate
    Alcohol Use Disorder in early remission and recommended continued monitoring.
    The Administrative Judge must decide whether the criminal conduct concern is mitigated
    enough to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline J?
  options:
    O1:
      do: The Administrative Judge requests further proof of the Individual’s sobriety.
      move: ask
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge defers the decision for a later review.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged with Battery Against a Household Member and Criminal
      Damage to Property on November 2, 2021.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual admitted to consuming alcohol prior to the November 2, 2021
      incident.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual was previously arrested in 2019 for intoxication and aggression
      at a concert.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual has abstained from alcohol since November 3, 2021.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual provided negative phosphatidylethanol (PEth) test results
      for each month from April through July 2022.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual had negative EtG random tests on December 7, 2021, February
      4, 16, and 28, 2022.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual enrolled in an intensive outpatient program in December 2021,
      completed 13 weeks, and began a regular outpatient program in May 2022.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual regularly attends Alcoholics Anonymous meetings, both virtual
      and in‑person, since November 2021.
  - id: F9
    kind: situation
    status: confirmed
    fact: A DOE psychiatrist diagnosed the Individual with Alcohol Use Disorder, Moderate,
      in early remission in February 2022 and recommended monitoring and continued
      abstinence.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline J based
      on the Individual’s criminal conduct.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    - F6
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Guideline J mitigating factor (a) is satisfied because sufficient time has
      passed since the criminal conduct and the Individual has demonstrated abstinence,
      reducing the likelihood of recurrence.
  - id: C2
    facts:
    - F7
    - F8
    - F9
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: 'The Individual has engaged in sustained rehabilitation: completed an intensive
      outpatient program, enrolled in a regular outpatient program, and regularly
      attends AA, meeting the Guideline J mitigating factor (d) of successful rehabilitation.'
  - id: C3
    facts:
    - F2
    - F3
    - F9
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: Once the Individual resolves the security concerns raised by his use of alcohol,
      the associated Guideline J concerns pertaining to his alcohol‑related arrests
      will also be mitigated.
  - id: C4
    facts:
    - F5
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Objective, documented negative alcohol tests (PEth, EtG) provide reliable
      evidence of continued sobriety, supporting the conclusion that the Individual
      poses no ongoing security risk.
  reasoning:
    read: The Local Security Office raised a Guideline J security concern because
      the Individual was charged with battery and property damage after drinking.
      The core issue is whether the criminal conduct, tied to alcohol misuse, is sufficiently
      mitigated to permit restoration of the clearance.
    weighing: The Administrative Judge applied the Adjudicative Guidelines, finding
      that mitigating factor (a) – elapsed time and low likelihood of recurrence –
      is met (C1). The Judge also found that the Individual satisfied mitigating factors
      (d) – evidence of successful rehabilitation – through treatment, AA attendance,
      and ongoing negative testing (C2, C4). Because the conduct stemmed from alcohol
      misuse, the Judge concluded that resolving the alcohol issue also resolves the
      criminal conduct concern (C3). The balance of these considerations, all weighted
      strong, leads to restoration.
    tradecraft: The decision is recorded in the formal OHA decision, citing the specific
      Guideline J mitigating factors and the supporting evidence, and the clearance
      is reinstated immediately per the Judge’s authority under 10 C.F.R. § 710.7(a).
    uncertainty: Minimal; the record contains objective test results and consistent
      testimony, leaving little doubt about continued sobriety and rehabilitation.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      Judge sole authority to resolve the security concerns after a hearing.
    tempting_wrong:
      option: O2
      pull: A residual concern that any prior violent act, regardless of mitigation,
        might still endanger the common defense.
      why_wrong: The source explicitly states that once the alcohol issue is mitigated,
        the related criminal conduct concern is likewise mitigated, making denial
        unsupported.
    rejected:
      O1: Further proof of sobriety is unnecessary because the record already includes
        multiple negative PEth and EtG tests and ongoing treatment.
      O2: Denial contradicts the source’s finding that the mitigating conditions under
        Guideline J are satisfied.
      O3: Deferral is unwarranted; the evidence is sufficient to make a final determination.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to relapse and test positive for alcohol use after the
        decision date
      then: O2
      why: A relapse would negate the mitigating factors of sustained sobriety and
        rehabilitation, re‑opening the Guideline J concern.
    would_not_change:
    - id: noflip1
      if: Additional time passes without any further incident
      why: More time further strengthens the mitigating factor of elapsed time, so
        the restoration decision remains appropriate.
    watch_for:
    - id: watch1
      what: Any new evidence of criminal conduct unrelated to alcohol
      favors:
      - O2
      why: Such evidence would introduce a new, unmitigated security concern under
        Guideline J.
  lesson: When criminal conduct is directly linked to a substance‑abuse issue, satisfying
    the Guideline J mitigating factors—elapsed time, lack of recurrence, and documented
    rehabilitation—allows a security clearance to be restored. Objective testing and
    consistent treatment participation are critical evidentiary pillars.
  limits: This analysis applies only where the offending behavior is causally tied
    to a treatable condition such as alcohol use disorder. It does not extend to violent
    or criminal acts that are unrelated to substance abuse or where rehabilitation
    evidence is absent.
