case:
  id: DR-H3-PSH-23-0013-PSH-22-0085-PSH-22-0085@v1
  title: Guideline J Criminal Conduct Mitigation Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual was charged with battery against a household member and
    criminal damage to property on November 2, 2021 after an alcohol‑related altercation
    with his girlfriend. He admitted to having consumed alcohol prior to the incident
    and the Local Security Office raised a Guideline J security concern based on the
    criminal conduct. The Individual later testified that the charges were dropped
    and a restraining order was dismissed. Since November 3, 2021 he has remained
    abstinent, providing negative PEth tests from April through July 2022 and undergoing
    random EtG testing. He completed thirteen weeks of an intensive outpatient program,
    is now in a regular outpatient program, and attends Alcoholics Anonymous meetings.
    The DOE Psychiatrist diagnosed him with moderate Alcohol Use Disorder in early
    remission, linked the criminal behavior to his alcohol misuse, and recommended
    ongoing monitoring and a year of abstinence, which the Individual has complied
    with.
  question: What should the Administrative Judge do about the Individual's access
    authorization concerning the Guideline J criminal conduct concern?
  options:
    O1:
      do: The Administrative Judge holds the Individual's case pending further evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge asks the DOE Psychiatrist for a review.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual's access authorization.
      move: act
      irreversible: false
    O4:
      do: The Administrative Judge denies the Individual's access authorization.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged with battery against a household member and criminal
      damage to property on November 2, 2021.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual admitted to having consumed alcohol prior to the altercation.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office raised a Guideline J security concern based on
      the Individual's criminal conduct.
  - id: F4
    kind: situation
    status: assessed
    fact: The Individual testified that the criminal charges were later dropped and
      the restraining order was dismissed.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual has been abstinent since November 3, 2021 and provided negative
      phosphatidylethanol (PEth) tests from April through July 2022.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual completed thirteen weeks of an intensive outpatient program,
      is now in a regular outpatient program, and regularly attends Alcoholics Anonymous
      meetings.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The DOE Psychiatrist diagnosed the Individual with moderate Alcohol Use
      Disorder in early remission and linked the criminal behavior to his alcohol
      misuse.
  - id: F8
    kind: capability
    status: confirmed
    fact: The DOE Psychiatrist recommended monitoring, random testing, and a year
      of abstinence; the Individual has complied with random alcohol and drug tests.
  considerations:
  - id: C1
    facts:
    - F5
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The Individual has remained abstinent since November 3, 2021 and provided
      continuous negative PEth and random EtG tests, satisfying the psychiatrist’s
      recommendation for a year of abstinence and demonstrating that the risk of recurrence
      is low.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: Completion of an intensive outpatient program, ongoing participation in a
      regular outpatient program, and regular AA attendance constitute successful
      rehabilitation, meeting Guideline J mitigation factor (d).
  - id: C3
    facts:
    - F4
    equity: due_process
    favors:
    - O3
    weight: weak
    why: The criminal charges were ultimately dropped and the restraining order dismissed,
      reducing the seriousness of the underlying conduct.
  - id: C4
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The LSO correctly invoked Guideline J, but the adjudicative guidelines allow
      mitigation when time has elapsed and rehabilitation is evident; the record shows
      those conditions are met.
  reasoning:
    read: The Guideline J concern arises from the Individual's November 2, 2021 battery
      and property damage incident, which the LSO linked to his Alcohol Use Disorder
      rather than viewing it as an isolated violent propensity.
    weighing: The Administrative Judge applied the Adjudicative Guidelines’ mitigating
      factor (a) – sufficient time elapsed and low likelihood of recurrence – and
      factor (d) – documented rehabilitation. The judge cited the psychiatrist’s opinion
      that the Individual’s prognosis is good and that his abstinence and treatment
      satisfy the recommended monitoring, thus concluding the security concern is
      mitigated.
    tradecraft: The decision is recorded in the formal OHA decision, citing the specific
      exhibits and testimony, and the restoration is entered into the DOE personnel
      security system.
    uncertainty: The judge notes a residual risk inherent in any early‑remission diagnosis
      but finds the weight of evidence (testing, treatment, support) sufficient to
      overcome that uncertainty.
    handoff: The Administrative Judge decides alone, as the record is complete and
      no further expert input is required; the DOE Psychiatrist’s testimony already
      addressed medical considerations.
    tempting_wrong:
      option: O4
      pull: The seriousness of a battery charge might suggest denial to protect the
        program’s integrity.
      why_wrong: Denial would ignore the mitigating evidence of sustained abstinence,
        successful treatment, and the fact that the conduct was directly linked to
        alcohol misuse, contrary to the guidelines.
    rejected:
      O1: Holding the case would unnecessarily delay a decision despite clear mitigation.
      O2: A further psychiatric review is unnecessary because the existing psychiatrist’s
        report already confirms remission and rehabilitation.
      O4: Denial fails to apply the mitigating factors expressly recognized in the
        Adjudicative Guidelines.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to test positive for alcohol or relapse into abusive
        behavior.
      then: O4
      why: A positive test or new incident would demonstrate that the risk of recurrence
        is no longer low, negating the mitigating factor (a).
    would_not_change:
    - id: noflip1
      if: The criminal charges remained dismissed but the Individual continued abstinent
        and in treatment.
      why: The mitigating factors already satisfied the guidelines; the status of
        the charges does not affect the assessment.
    watch_for:
    - id: watch1
      what: Any new criminal conduct, regardless of alcohol involvement.
      favors:
      - O4
      why: New conduct would create a fresh security concern under Guideline J.
  lesson: When criminal conduct is directly tied to a treatable condition such as
    alcohol misuse, the Adjudicative Guidelines allow clearance restoration if the
    individual demonstrates sustained abstinence, completes treatment, and shows no
    recurrence over a reasonable period.
  limits: This analysis does not apply to violent conduct unrelated to substance abuse
    or to cases where the individual fails to provide objective evidence of continued
    sobriety and rehabilitation.
