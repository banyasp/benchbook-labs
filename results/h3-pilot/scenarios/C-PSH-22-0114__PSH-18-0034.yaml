case:
  id: DR-H3-PSH-22-0114-PSH-18-0034-PSH-18-0034@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: Department of Energy Personnel Security Hearing, July 2018
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: An employee of a DOE contractor applied for a security clearance. The
    Local Security Office raised concerns under Guideline G because the employee had
    been cited for Minor in Consumption in 2008 and a psychologist evaluated him as
    a habitual or binge drinker whose consumption impaired judgment. The employee
    reported current drinking of four to five beers once or twice weekly and occasional
    intoxication, but testified that he had abstained since early March 2018 and had
    begun individual therapy, though he had not completed the psychologist’s recommended
    twelve‑week group program. Witnesses attested to his trustworthiness but did not
    confirm a long‑term abstinence plan. The psychologist maintained that the employee
    had not made satisfactory progress and reiterated the need for group therapy or
    a year of abstinence.
  question: What should the Administrative Judge do regarding the Individual’s eligibility
    for a security clearance under Guideline G?
  options:
    O1:
      do: The Administrative Judge shall grant the Individual an access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge shall defer the Individual’s access authorization
        until therapy is completed.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge shall request additional proof of the Individual’s
        abstinence before ruling.
      move: ask
      irreversible: false
    O4:
      do: The Administrative Judge shall deny the Individual an access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual applied for a DOE security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was cited for Minor in Consumption in 2008 after a college
      party.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual completed a three‑month diversion program and university
      counseling, complied with all requirements, and abstained for two months after
      the incident.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual reports current alcohol use as four to five beers once or
      twice per week and intoxication once or twice per month by drinking eight or
      nine beers.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE psychologist concluded the Individual is a habitual or binge consumer
      of alcohol to the point of impaired judgment approximately twice monthly.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The psychologist did not diagnose Alcohol Use Disorder but recommended twelve
      weeks of outpatient group therapy or one year of abstinence.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Individual testified that he had abstained from alcohol since March
      2, 2018, with his last hangover at least fourteen weeks before the hearing.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Individual began individual therapy in late May 2018, attended an evaluation
      and the first session, and intends to complete fifteen sessions but has not
      scheduled beyond the third.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Witnesses (colleagues, manager, girlfriend’s father) testified the Individual
      is trustworthy and may abstain or drink responsibly, but gave no specific commitment
      to future abstinence.
  - id: F10
    kind: intelligence
    status: assessed
    fact: The psychologist testified that the Individual has not made satisfactory
      progress in treatment, did not understand the recommendations, and revised the
      recommendation to one year of abstinence or twelve weeks of group therapy followed
      by re‑evaluation.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: Guideline G identifies habitual or binge drinking that impairs judgment as
      a disqualifying security concern; the psychologist’s assessment that the Individual
      habitually binge drinks satisfies this statutory condition.
  - id: C2
    facts:
    - F7
    - F8
    - F10
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Adjudicative Guidelines require mitigation through sustained abstinence
      or completion of the recommended treatment; the Individual’s 14‑week abstinence
      and only one individual therapy session do not meet the prescribed 12‑week group
      therapy or one‑year abstinence standard.
  - id: C3
    facts:
    - F9
    - F10
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Witnesses attest to trustworthiness but provide no concrete commitment to
      long‑term abstinence or treatment compliance, leaving the security concern unmitigated
      and preserving the agency’s credibility in enforcing the guidelines.
  - id: C4
    facts:
    - F5
    - F6
    - F10
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The psychologist’s unchanged opinion that the Individual remains a habitual/binge
      drinker indicates an ongoing risk to the common defense, outweighing any perceived
      benefit of granting the clearance.
  - id: C5
    facts:
    - F5
    - F6
    - F10
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The source’s analysis follows the Adjudicative Guidelines paragraph 23(a)–(c)
      and finds none of the mitigating factors satisfied; therefore the denial aligns
      with the prescribed analytical framework.
  reasoning:
    read: The case hinges on Guideline G, which flags habitual or binge alcohol consumption
      as a security concern. The Individual’s past MIC citation and the psychologist’s
      expert opinion establish the concern, while the Individual’s recent abstinence
      and limited therapy do not satisfy the mitigation thresholds set by the Guidelines.
    weighing: I find that the Individual has not succeeded in fully resolving those
      concerns.
    tradecraft: The decision is recorded in the official OHA decision memorandum,
      citing the relevant CFR provisions and Adjudicative Guidelines, and the denial
      is entered into the DOE personnel security database.
    uncertainty: The only uncertainty is whether the Individual’s self‑reported abstinence
      is accurate, but the psychologist’s expert testimony overrides that uncertainty
      under the Guidelines.
    handoff: The Administrative Judge acted alone, as authorized by 10 C.F.R. § 710.7(a),
      and no further agency review is required unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: The Individual’s recent 14‑week abstinence and testimonies of trustworthiness
        might suggest a low risk.
      why_wrong: Granting would ignore the explicit mitigation requirements of Guideline
        G and the psychologist’s unchanged adverse opinion, contrary to the presumption
        against clearance.
    rejected:
      O1: The mitigation standards for Guideline G were not met; abstinence alone
        for 14 weeks is insufficient.
      O2: Deferral would still leave the security concern unresolved; the Guidelines
        require concrete mitigation, not a procedural hold.
      O3: Additional proof of abstinence would not address the unmet treatment recommendation,
        which the Guidelines deem essential.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual completed the psychologist’s recommended twelve‑week outpatient
        group therapy program and demonstrated a sustained period of abstinence of
        at least one year
      then: O1
      why: Paragraph 23(a)–(c) of the Adjudicative Guidelines would then be satisfied,
        showing mitigation of the Guideline G concern.
    would_not_change:
    - id: noflip1
      if: the Individual only maintains the 14‑week abstinence without completing
        the recommended treatment
      why: Fourteen weeks is a relatively short period of time to have abstained,
        and the Individual has not demonstrated a clear and established pattern of
        modified consumption or abstinence in accordance with treatment recommendations.
    watch_for:
    - id: watch1
      what: evidence that the Individual has completed the twelve‑week group therapy
        or achieved a full year of abstinence
      favors:
      - O1
      why: Such evidence would satisfy the mitigating factors under Guideline G.
  lesson: Under Guideline G, a security clearance can be denied when habitual or binge
    drinking is established and the required mitigation—either a year of abstinence
    or completion of the prescribed treatment—has not been demonstrated. The adjudicative
    process gives weight to expert opinions and the specific mitigation criteria in
    the Guidelines.
  limits: This reasoning applies only to security clearances governed by DOE’s Part
    710 and the Adjudicative Guidelines; it does not extend to non‑security employment
    decisions or to cases where a different set of mitigating criteria applies.
