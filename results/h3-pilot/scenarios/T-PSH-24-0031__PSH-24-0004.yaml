case:
  id: DR-H3-PSH-24-0031-PSH-24-0004-PSH-24-0031@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, May 2024
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised substantial doubt about the Individual’s
    eligibility for access authorization under Guideline G, citing alleged habitual
    alcohol consumption to the point of impaired judgment. A DOE-contracted psychiatrist
    reported that the Individual habitually consumed alcohol to the point of impaired
    judgment, basing this conclusion on a PEth test and a definition of intoxication
    at a blood alcohol content of .06%. The Individual testified that she typically
    drinks two or three glasses of wine on weekends, occasionally more, and presented
    negative PEth test results for the months of January through May 2024. The Administrative
    Judge must evaluate whether the psychiatrist’s opinion and the Individual’s reported
    drinking behavior constitute a security concern that remains unresolved under
    Guideline G.
  question: What should the Administrative Judge decide about the Individual’s Guideline
    G security concern?
  options:
    O1:
      do: The Administrative Judge finds that additional information regarding the
        Individual’s recent alcohol consumption is needed and therefore asks the Local
        Security Office to provide a recent PEth test result.
      move: ask
      irreversible: false
    O2:
      do: The Administrative Judge finds that the Individual has satisfied the security
        concerns under Guideline G and therefore grants access authorization on that
        basis.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge finds that the Individual has not satisfied the
        security concerns under Guideline G and therefore denies access authorization
        on that basis.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge finds that the Individual has partially satisfied
        the security concerns under Guideline G and therefore conditions restoration
        of access authorization on completion of an abstinence program.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested for battery in 2021 and failed to report the
      arrest as required.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested for a DUI in 2000 and failed to disclose the
      offense on the QNSPs.
  - id: F3
    kind: situation
    status: confirmed
    fact: In February 2022 the Individual used cocaine, misused prescription medication,
      and was hospitalized for mental health reasons, and did not disclose these events.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The DOE Psychiatrist concluded that the Individual habitually consumed alcohol
      to the point of impaired judgment, based on a PEth test and a definition of
      intoxication at a BAC of .06%.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual reported typical consumption of two to three glasses of wine
      per weekend, occasional higher intake, and provided negative PEth test results
      for January–May 2024.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline G (Alcohol Consumption) as a basis
      for substantial doubt regarding the Individual’s eligibility.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Administrative Judge determined that the psychiatrist’s definition of
      intoxication at .06% BAC is not accepted and that there is insufficient evidence
      of habitual intoxication.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Administrative Judge found that the 2021 battery arrest was isolated
      and that earlier alcohol‑related offenses are mitigated by the passage of time.
  considerations:
  - id: C1
    facts:
    - F4
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Judge found the psychiatrist’s definition of intoxication at a .06% BAC
      unsupported and therefore rejected the opinion as insufficient to establish
      habitual intoxication.
  - id: C2
    facts:
    - F5
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual’s own testimony of moderate weekend drinking, coupled with
      negative PEth results for five consecutive months, provides no evidence of the
      monthly intoxication required by Guideline G.
  - id: C3
    facts:
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The 2021 battery arrest was an isolated, alcohol‑related incident; earlier
      alcohol‑related offenses are mitigated by the passage of time, satisfying the
      first mitigating condition for Guideline G.
  - id: C4
    facts:
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Although the LSO raised substantial doubt, the Judge concluded that the LSO’s
      allegation of habitual intoxication was not supported by the record.
  reasoning:
    read: The LSO alleged that the Individual habitually drank to the point of impaired
      judgment, relying on a psychiatrist’s opinion that used a non‑standard .06%
      BAC threshold and a single PEth result. The Individual countered with a pattern
      of modest weekend wine consumption and five months of negative PEth tests, and
      the Judge found the psychiatrist’s definition unsupported.
    weighing: Considering C1’s rejection of the psychiatrist’s definition, C2’s lack
      of objective evidence of intoxication, and C3’s mitigation of the lone alcohol‑related
      arrest, the balance tilts decisively toward finding no unresolved security concern
      under Guideline G. The weak concern noted in C4 does not outweigh the stronger
      considerations.
    tradecraft: The decision will be entered into the OHA record as a final administrative
      determination, citing the specific findings on the psychiatrist’s opinion, the
      PEth results, and the mitigating condition analysis.
    uncertainty: Minimal; the record contains clear negative PEth tests and no corroborating
      observations of intoxication.
    handoff: The Administrative Judge decides alone, as the record is complete and
      no further factual development is required.
    tempting_wrong:
      option: O1
      pull: Requesting additional PEth testing might appear prudent, but the Judge
        already concluded that the existing evidence disproves habitual intoxication.
      why_wrong: The source explicitly states that the psychiatrist’s opinion is unsupported
        and that the record shows no intoxication; further testing would be unnecessary
        and contrary to the Judge’s analysis.
    rejected:
      O1: The Judge already resolved the concern; additional testing is not required.
      O3: The evidence does not support a denial because the habitual intoxication
        element is unproven.
      O4: No condition is needed; the concern is fully resolved, not partially.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A future PEth test or credible observation demonstrates monthly intoxication
        at a level that impairs judgment.
      then: O3
      why: The presence of concrete evidence of habitual intoxication would satisfy
        Guideline G’s security concern.
    would_not_change:
    - id: noflip1
      if: The Individual’s prior undisclosed DUI remains undisclosed.
      why: The DUI is an alcohol‑related offense already mitigated by time and does
        not affect the determination of habitual intoxication under Guideline G.
    watch_for:
    - id: watch1
      what: Any new evidence of intoxication (e.g., positive PEth, arrest while visibly
        intoxicated).
      favors:
      - O3
      why: Such evidence would re‑open the Guideline G concern.
  lesson: When adjudicating Guideline G, the decision must be grounded in an accepted
    definition of intoxication and supported by concrete evidence of habitual impairment;
    unsubstantiated medical opinions cannot alone create a security concern. Mitigating
    conditions such as isolated incidents and the passage of time can resolve the
    concern if the habit element is lacking.
  limits: This analysis applies only to the alcohol‑consumption (Guideline G) security
    concern. Other guidelines (E, H, J) may still present unresolved issues that could
    affect the overall clearance decision.
