case:
  id: DR-H3-PSH-24-0089-PSH-18-0034-PSH-18-0034@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, July 2018
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: An employee of a DOE contractor applied for a security clearance. The
    Local Security Office raised concerns under Guideline G because the employee had
    been cited for Minor in Consumption in 2008 and a psychologist evaluated him as
    a habitual or binge drinker whose judgment was impaired about twice a month. The
    psychologist did not diagnose an alcohol use disorder but recommended twelve weeks
    of outpatient group therapy or a year of abstinence. The employee reported drinking
    four to five beers once or twice weekly and occasional larger binges since 2011,
    but testified he had abstained for fourteen weeks before the hearing and had begun
    individual therapy shortly before the hearing, without enrolling in the recommended
    group program. Witnesses attested to his trustworthiness and recent abstinence,
    while the psychologist testified that the employee had not made satisfactory progress
    and his prognosis remained guarded. The Administrative Judge must decide whether
    the Guideline G concern is mitigated enough to grant the clearance.
  question: What should the Administrative Judge do regarding the Individual’s eligibility
    for a security clearance under Guideline G?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s eligibility for a security
        clearance.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending an evaluation of the
        Individual’s alcohol consumption.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge grants the Individual’s eligibility for a security
        clearance.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge asks for additional evidence of the Individual’s
        treatment progress before deciding.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual applied for a DOE security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was cited for Minor in Consumption (MIC) in 2008 after a
      college party.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A psychologist concluded the Individual is a habitual or binge consumer
      of alcohol to the point of impaired judgment approximately twice monthly.
  - id: F4
    kind: capability
    status: assessed
    fact: The psychologist did not diagnose Alcohol Use Disorder but recommended twelve
      weeks of outpatient group therapy or one year of abstinence.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual reported current consumption of four to five beers once or
      twice per week and occasional binges of eight to nine beers once or twice per
      month, ongoing since December 2011.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual testified he had abstained from alcohol for fourteen weeks
      prior to the hearing (since March 2, 2018).
  - id: F7
    kind: capability
    status: assessed
    fact: The Individual began individual therapy in late May 2018 and attended one
      evaluation and one therapy session before the hearing, but did not enroll in
      the recommended group therapy.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The psychologist testified the Individual had not made satisfactory progress
      in treatment and his prognosis was somewhat guarded.
  - id: F9
    kind: situation
    status: confirmed
    fact: Colleagues, the manager, and the girlfriend’s father testified the Individual
      is trustworthy and had not consumed alcohol for about fourteen weeks.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The psychologist concluded the Individual habitually or binge consumes alcohol
      to the point of impaired judgment, and the record shows a history of frequent
      drinking and a 2008 MIC charge, establishing a Guideline G security concern.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline G mitigation requires either a long period of abstinence (typically
      one year) or completion of the recommended twelve‑week group‑therapy program;
      the Individual has only fourteen weeks of abstinence and has not enrolled in
      group therapy, and the psychologist testified that satisfactory progress has
      not been made.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The adjudicative guidelines list specific mitigating factors (time passed,
      pattern of modified consumption, satisfactory treatment progress); the record
      shows none of these factors are satisfied, so the concern remains unresolved.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The psychologist’s expert opinion that the Individual’s prognosis is “somewhat
      guarded” and that he has not made satisfactory progress is given controlling
      weight in the analysis.
  reasoning:
    read: The case centers on whether the Individual’s past and current alcohol use,
      evaluated under Guideline G, has been sufficiently mitigated to allow a DOE
      security clearance. The judge must apply the Adjudicative Guidelines, which
      place a heavy burden on the individual to demonstrate a clear, established pattern
      of modified consumption or successful completion of prescribed treatment.
    weighing: The judge weighed the four considerations above. {C1} establishes the
      underlying security concern. {C2} and {C3} show that the statutory mitigation
      criteria—one year of abstinence or twelve weeks of group therapy—have not been
      met; the psychologist’s testimony ({C4}) reinforces the lack of satisfactory
      progress. Because the presumption is against granting a clearance, the balance
      tips decisively toward denial.
    tradecraft: The decision is recorded in the Administrative Judge’s formal Decision,
      citing the relevant CFR provisions and Adjudicative Guidelines, and the parties
      are advised of their right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The only uncertainty is whether future treatment could alter the
      assessment, but at the time of the hearing the record does not satisfy the mitigation
      thresholds.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to evaluate the evidence and apply the guidelines.
    tempting_wrong:
      option: O3
      pull: The Individual’s recent abstinence and character witnesses suggest trustworthiness,
        tempting a grant despite incomplete mitigation.
      why_wrong: Guideline G requires a documented, sustained pattern of modified
        consumption or completion of the recommended treatment; the record falls short
        of those statutory requirements.
    rejected:
      O2: A hold would postpone a decision despite the clear regulatory standard that
        a denial is appropriate when mitigation is not demonstrated.
      O3: Granting would conflict with the explicit mitigation criteria in the Adjudicative
        Guidelines.
      O4: Additional evidence would not change the fact that the required mitigation
        (year of abstinence or group therapy) has not been satisfied.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual completes the twelve‑week outpatient group‑therapy program
        or demonstrates a full year of abstinence
      then: O3
      why: Guideline G mitigation would then be satisfied under paragraphs 23(a)–(c).
    would_not_change:
    - id: noflip1
      if: the Individual continues to rely solely on fourteen weeks of abstinence
        without completing the recommended treatment
      why: the mitigation criteria remain unmet, so the denial stands.
    watch_for:
    - id: watch1
      what: future evidence of sustained abstinence for at least one year or documented
        completion of group therapy
      favors:
      - O3
      why: Such evidence would satisfy the mitigation factors outlined in the Adjudicative
        Guidelines.
  lesson: Under DOE Guideline G, a security clearance cannot be granted until the
    individual demonstrates a clear, established pattern of modified alcohol consumption
    or completes the treatment prescribed by the expert, such as a year of abstinence
    or twelve weeks of group therapy.
  limits: This analysis applies only to DOE personnel security clearances governed
    by 10 C.F.R. Part 710 and Guideline G; it does not extend to other adjudicative
    guidelines or non‑security contexts.
