case:
  id: DR-H3-PSH-22-0084-PSH-21-0031-PSH-21-0031@v1
  title: Guideline H Drug Use Clearance Determination
  status: draft
  setting: DOE Office of Hearings and Appeals, June 2021
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: A DOE contractor employee who holds a security clearance disclosed on
    a questionnaire that she used marijuana edibles on two occasions while possessing
    a clearance. The Local Security Office raised concerns under Guideline H and the
    Bond Amendment, issuing a Letter of Interrogatory and a Notification Letter stating
    substantial doubt about her eligibility. At a hearing, the employee testified
    that the uses occurred in November 2017 to alleviate motion sickness, that she
    felt no effect, and that she has not used marijuana since. She provided a signed
    statement of intent to abstain from illegal drug use and disposed of the remaining
    edibles. Witnesses, including her husband and colleagues, testified they have
    never observed her using marijuana, that she has no drug‑using associates, and
    that she disposed of the edibles. The DOE’s April 2021 memorandum defines an unlawful
    user as a current user or one who has lost self‑control, and an addict as a habitual
    user, while the Bond Amendment bars clearance for such persons.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline H and the Bond Amendment?
  options:
    O1:
      do: The Administrative Judge holds the clearance decision pending further evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual’s security clearance.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s security clearance.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge grants the clearance with periodic drug testing.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires
      a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual disclosed on her questionnaire that she used marijuana candies
      on two occasions while possessing a security clearance.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a Letter of Interrogatory and a Notification
      Letter stating that the information created substantial doubt about the Individual’s
      eligibility under Guideline H and the Bond Amendment.
  - id: F4
    kind: capability
    status: assessed
    fact: The Individual testified that the two uses occurred in November 2017 to
      alleviate motion sickness, that she felt no effect, and that she has not used
      marijuana since then.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual provided a signed statement of intent dated September 2,
      2020 to abstain from illegal drug use.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual’s husband gave her marijuana edibles as a joke in December
      2016 and did not expect her to consume them.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Witnesses, including the husband and colleagues, testified they have never
      observed the Individual using marijuana, that she has no drug‑using associates,
      and that she disposed of the edibles.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE’s April 23, 2021 memorandum defines an unlawful user as a current user
      or one who has lost self‑control, and an addict as a habitual user endangering
      public morals.
  - id: F9
    kind: capability
    status: confirmed
    fact: The Individual’s last marijuana use was more than three and a half years
      before the hearing, and there is no evidence of current use.
  - id: F10
    kind: authority
    status: confirmed
    fact: The Bond Amendment prohibits granting a security clearance to an unlawful
      user or addict of a controlled substance.
  considerations:
  - id: C1
    facts:
    - F2
    - F8
    - F10
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The April 2021 DOE memorandum defines an unlawful user as a current user
      or one who has lost self‑control; the Individual’s last use was in 2017 and
      she shows no loss of control, so the Bond Amendment does not bar a clearance.
  - id: C2
    facts:
    - F4
    - F5
    - F9
    - F7
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline H allows mitigation when the conduct is remote, infrequent, and
      the individual has demonstrated abstinence, self‑disclosure, and disassociation
      from drug‑using environments, all of which the Individual satisfied.
  - id: C3
    facts:
    - F7
    - F8
    - F9
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Witness testimony corroborates the Individual’s lack of current use and reliable
      character, supporting the Administrative Judge’s finding that the security concerns
      are resolved.
  - id: C4
    facts:
    - F3
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: Although the LSO raised substantial doubt, the record shows the concerns
      are mitigated; the Judge must weigh the whole‑person concept rather than rely
      solely on the initial allegation.
  reasoning:
    read: The case hinges on whether the Individual’s two isolated marijuana edibles
      uses in 2017 constitute an unlawful user or addict under the Bond Amendment
      and whether Guideline H concerns are mitigated enough to restore clearance.
    weighing: The Judge applied the DOE’s April 2021 memorandum (see {C1}) and the
      Adjudicative Guidelines for Guideline H (see {C2}). The remote, infrequent nature
      of the conduct, the Individual’s full self‑disclosure, her abstinence, and corroborating
      witness statements (see {C3}) satisfy the mitigation criteria. While the LSO’s
      initial doubt (see {F3}) creates a presumption against clearance, the mitigating
      evidence outweighs that presumption, leading to restoration.
    tradecraft: The decision will be recorded in the OHA docket, citing the relevant
      regulation sections and the memorandum, and the clearance will be reinstated
      in the DOE personnel security system.
    uncertainty: Minimal; the only uncertainty would arise if new evidence of current
      use emerged.
    handoff: The Administrative Judge decides alone, as the OHA process grants the
      Judge sole authority to issue the final determination.
    tempting_wrong:
      option: O2
      pull: The LSO’s initial finding of substantial doubt could tempt a denial based
        on a strict presumption against clearance.
      why_wrong: Denial would ignore the clear mitigation under the Bond Amendment
        definition and Guideline H, contrary to the source’s analysis.
    rejected:
      O1: Holding the decision pending would unnecessarily delay resolution despite
        sufficient mitigating evidence.
      O2: Denial is inconsistent with the finding that the Individual is neither an
        unlawful user nor an addict and that Guideline H concerns are mitigated.
      O4: A conditional grant with testing is not required because the source concluded
        the risk is sufficiently mitigated.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Evidence showed the Individual was a current user of marijuana or had lost
        self‑control over its use
      then: O2
      why: The Bond Amendment would then bar a clearance as the Individual would be
        an unlawful user.
    would_not_change:
    - id: noflip1
      if: The Individual’s past use remained isolated and she continued abstinence
      why: Guideline H mitigation remains satisfied, so restoration stands.
    watch_for:
    - id: watch1
      what: Any future drug use or failure to comply with the signed abstinence statement
      favors:
      - O2
      why: New use would re‑trigger the unlawful user definition and invalidate the
        mitigation.
  lesson: Under DOE security policy, isolated, historic marijuana use that is not
    ongoing and is fully mitigated by self‑disclosure, abstinence, and character evidence
    does not bar a clearance. The Bond Amendment’s prohibition applies only to current
    unlawful users or addicts as defined by the agency’s policy.
  limits: This reasoning does not apply to cases involving habitual or recent drug
    use, to substances other than marijuana where different legal classifications
    may apply, or where the individual fails to demonstrate the required mitigation
    factors.
