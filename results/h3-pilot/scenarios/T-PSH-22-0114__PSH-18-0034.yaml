case:
  id: DR-H3-PSH-22-0114-PSH-18-0034-PSH-22-0114@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, November 15 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Administrative Judge must determine whether to restore the Individual’s
    access authorization after the Local Security Office raised concerns under Guideline
    G for alcohol consumption. The Individual is employed by a DOE contractor in a
    position requiring a security clearance. He has a record of multiple alcohol‑related
    arrests spanning from 2002 to 2021, including DUI, domestic violence, assault,
    and other offenses. A DOE‑appointed psychiatrist diagnosed him with mild Alcohol
    Use Disorder in early remission and concluded he binge‑drank to the point of impaired
    judgment. A PEth test in March 2022 was positive, indicating recent drinking,
    while later PEth and EtG tests through September 2022 were negative. The Individual
    has attended AA meetings since August 2022 but lacks a sponsor and cannot identify
    the twelve steps. Co‑workers testified to his reliability, yet the judge notes
    a prior relapse after three years of abstinence and only about seven months have
    passed since his last reported drinking.
  question: What should the Administrative Judge do with the Individual’s access authorization
    under Guideline G?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending further evidence of
        sustained abstinence.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge asks for an additional chemical expert report before
        deciding.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires
      a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual has been arrested multiple times for alcohol‑related offenses,
      including DUI (2002, 2009), domestic violence (2004), felony assault (2005),
      and several charges in September 2021 such as assault and battery.
  - id: F3
    kind: situation
    status: confirmed
    fact: A DOE psychiatrist diagnosed the Individual with Alcohol Use Disorder, Mild,
      in early remission and opined that he binge‑consumed alcohol to the point of
      impaired judgment.
  - id: F4
    kind: situation
    status: confirmed
    fact: A phosphatidylethanol (PEth) test taken on March 3 2022 was positive at
      77 ng/mL, indicating recent alcohol consumption.
  - id: F5
    kind: situation
    status: confirmed
    fact: PEth tests in June, July, August, and September 2022 were negative, and
      EtG urine tests from July 25 to October 6 2022 were also negative.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual has regularly attended AA meetings since August 24 2022 but
      does not have an AA sponsor and cannot name the twelve steps.
  - id: F7
    kind: situation
    status: confirmed
    fact: Management and supervisory personnel testified that the Individual is a
      trusted and reliable employee.
  - id: F8
    kind: situation
    status: assessed
    fact: The Individual previously relapsed after three years of abstinence following
      the 2009 arrest, and only about seven months have passed since his last self‑reported
      drinking.
  - id: F9
    kind: situation
    status: assessed
    fact: The DOE psychiatrist recommends moderate‑intensity treatment with an AA
      sponsor and rates the Individual’s prognosis as fair, noting he has not yet
      demonstrated rehabilitation.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The LSO’s security concern under Guideline G is supported by the Individual’s
      multiple alcohol‑related arrests and the psychiatrist’s diagnosis of Alcohol
      Use Disorder, indicating a pattern that could impair reliability and judgment.
  - id: C2
    facts:
    - F5
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The record shows only about seven months of abstinence since the last self‑reported
      drinking, which the Judge finds insufficient to overcome the doubt about future
      problematic consumption.
  - id: C3
    facts:
    - F6
    - F9
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The Individual has not satisfied the required treatment conditions—no AA
      sponsor, no demonstrated sustained abstinence—so the mitigating condition (d)
      under Guideline G is not met.
  - id: C4
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: While coworkers attest to the Individual’s reliability, the Judge gives greater
      weight to the documented alcohol‑related incidents and the psychiatrist’s professional
      opinion.
  reasoning:
    read: The Judge must decide whether the security concern under Guideline G—excessive
      alcohol consumption that raises questions about reliability, trustworthiness,
      and judgment—has been resolved. The record contains a long history of alcohol‑related
      arrests, a recent positive PEth test, and a psychiatrist’s finding of mild AUD
      in early remission, but also shows recent negative tests and AA attendance without
      a sponsor.
    weighing: Guideline G requires either a long period of abstinence, clear evidence
      of treatment compliance, or a demonstrated pattern of responsible consumption.
      The Judge finds that (a) the elapsed time is too short, (b) the Individual has
      not shown a sustained, sponsor‑guided abstinence, and (c) the psychiatrist rates
      his prognosis only as ‘fair.’ Consequently, the aggravating factors outweigh
      the limited mitigating evidence, leading to denial.
    tradecraft: The decision is entered as a final administrative determination, recorded
      in the OHA docket, and the Individual is notified of his right to appeal under
      10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty lies in the Individual’s future drinking
      behavior; the short abstinence period leaves open the risk of relapse, which
      the Judge deems material to national security.
    handoff: The Administrative Judge decides alone, as the regulations vest the adjudicator
      with sole authority to weigh the evidence and apply the Adjudicative Guidelines.
    tempting_wrong:
      option: O2
      pull: The Individual’s recent negative alcohol tests and coworker attestations
        of reliability suggest a possible restoration.
      why_wrong: The source emphasizes that without meeting the specific mitigating
        conditions—especially a sponsor‑guided treatment program and a longer, proven
        abstinence period—the security concern remains unresolved.
    rejected:
      O2: Granting would ignore the unmet mitigating conditions under Guideline G
        and the Judge’s finding of insufficient abstinence.
      O3: Holding pending further evidence is unnecessary because the record already
        shows the required mitigating conditions are not satisfied.
      O4: An additional chemical expert report would not change the conclusion, as
        the psychiatrist’s expertise on PEth interpretation was deemed sufficient.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual completed a moderate‑intensity treatment program with an
        AA sponsor and demonstrated at least one year of sustained abstinence in accordance
        with the psychiatrist’s recommendation
      then: O2
      why: Meeting mitigating condition (d) under Guideline G would remove the security
        concern and allow restoration.
    would_not_change:
    - id: noflip1
      if: the Individual continues to have only seven months of abstinence and no
        sponsor despite negative tests
      why: The Judge has already found the elapsed time insufficient and the treatment
        incomplete, so the denial stands.
    watch_for:
    - id: watch1
      what: any future alcohol‑related arrest or positive PEth/EtG test
      favors:
      - O1
      why: A new incident would reaffirm the security concern under Guideline G.
  lesson: Under Guideline G, a security clearance cannot be restored unless the individual
    satisfies a specific mitigating condition—such as a documented, sponsor‑guided
    treatment program and a substantial period of proven abstinence. Merely negative
    test results or coworker attestations are insufficient when the underlying pattern
    of alcohol‑related misconduct remains unresolved.
  limits: This analysis applies only to cases where the adjudicative guidelines require
    concrete evidence of rehabilitation. It does not address other security concerns
    (e.g., foreign influence) or situations where the individual has already completed
    the prescribed treatment program.
