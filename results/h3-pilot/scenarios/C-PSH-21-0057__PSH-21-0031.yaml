case:
  id: DR-H3-PSH-21-0057-PSH-21-0031-PSH-21-0031@v1
  title: Guideline H Drug Involvement Security Concern
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 2021
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor, disclosed on a security questionnaire
    that she used marijuana edibles on two occasions in November 2017 while holding
    a Department of Defense security clearance. The Local Security Office raised concerns
    under the Bond Amendment and Guideline H, citing the illegal drug use as a potential
    reliability issue. A hearing was held where the Individual testified that the
    use was intended to alleviate motion sickness, that she felt no effect, and that
    she has not used marijuana since 2017. She provided a signed statement of intent
    to abstain from illegal drugs and testified that she disposed of the remaining
    edibles. Witnesses, including the Individual’s spouse and colleagues, attested
    that they have never observed any loss of self‑control, current use, or drug‑related
    behavior. The DOE’s 2021 policy defines an unlawful user as a current user or
    someone who has lost self‑control, and the Bond Amendment bars clearance for unlawful
    users or addicts.
  question: What should the Administrative Judge do regarding the Individual’s Guideline
    H security concern and Bond Amendment applicability?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization
        with monitoring.
      move: partial
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge asks for additional evidence of drug use.
      move: ask
      irreversible: false
    O4:
      do: The Administrative Judge revokes the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual used marijuana lozenges on two occasions in November 2017
      while possessing a Department of Defense security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual self‑reported this marijuana use on the Questionnaire for
      National Security Positions in August 2019.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual testified that the edibles were consumed to treat motion
      sickness and that she felt no psychoactive effect.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual has not used marijuana since the November 2017 incidents.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual submitted a signed statement of intent dated September 2,
      2020, affirming she will abstain from illegal drug use.
  - id: F6
    kind: situation
    status: confirmed
    fact: Witnesses—including the Individual’s spouse, a colleague, and a research
      colleague—testified they have never observed loss of self‑control, current drug
      use, or drug‑related behavior, and that the edibles were discarded.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE policy defines an unlawful user of a controlled substance as a current
      user or a person who has lost self‑control, and the Individual’s last use was
      over three years ago with no evidence of loss of self‑control.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Bond Amendment bars the granting or renewal of a security clearance
      for a covered person who is an unlawful user of a controlled substance or an
      addict.
  - id: F9
    kind: authority
    status: assessed
    fact: Guideline H raises security concerns for illegal drug use while holding
      a clearance, but mitigation is possible if the behavior was infrequent, long
      ago, and the individual demonstrates abstinence and reliability.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The DOE’s 2021 policy defines an unlawful user as a current user or a person
      who has lost self‑control; the Individual’s last use was over three years ago
      and there is no evidence of loss of self‑control, so the Bond Amendment does
      not bar a clearance.
  - id: C2
    facts:
    - F1
    - F4
    - F5
    - F6
    - F9
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Guideline H allows mitigation when the conduct was infrequent, occurred long
      ago, and the individual demonstrates sustained abstinence and reliability; all
      such mitigating factors are satisfied.
  - id: C3
    facts:
    - F2
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Individual self‑disclosed the marijuana use on the QNSP and submitted
      a signed statement of intent to abstain, showing honesty and willingness to
      comply with security requirements.
  - id: C4
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Witnesses—including spouse and colleagues—attested that they have never observed
      loss of self‑control, current use, or drug‑related behavior, reinforcing the
      finding that the Individual is not an unlawful user or addict.
  reasoning:
    read: The case centers on whether the Individual’s two instances of marijuana
      edible use in 2017 constitute an unlawful user under the Bond Amendment and
      a lingering Guideline H concern. The trap is to treat any past illegal drug
      use as an automatic bar, ignoring the statutory definitions and mitigation provisions.
    weighing: I find that the Bond Amendment is not a bar to the Individual’s possession
      of a security clearance and that the Individual has brought forth sufficient
      evidence to resolve the Guideline H security concerns set forth in the Summary
      of Security Concerns. Accordingly, I have determined that the Individual’s access
      authorization should be restored.
    tradecraft: Record the finding that the Bond Amendment does not apply, note the
      mitigation under § 26(a) and § 26(b), and issue a restoration order without
      additional monitoring conditions, as the source’s decision did.
    uncertainty: Minimal; the record contains consistent testimony and documentary
      evidence. The only residual uncertainty would be future drug use, which the
      source addresses with a signed statement of intent.
    handoff: The Administrative Judge decides alone, as the OHA regulations grant
      the judge sole authority to issue the decision after the hearing.
    tempting_wrong:
      option: O4
      pull: The presumption against granting clearances and the seriousness of illegal
        drug use might suggest revocation.
      why_wrong: The source rejects that pull by showing the conduct does not meet
        the statutory definition of ‘unlawful user’ and that mitigation criteria are
        fully satisfied.
    rejected:
      O1: A partial restoration with monitoring is unnecessary because the source
        found no ongoing risk.
      O3: Additional evidence is not required; the record already establishes the
        mitigating facts.
      O4: Revocation would contradict the source’s analysis that neither the Bond
        Amendment nor Guideline H bars the clearance.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Evidence showed the Individual had used marijuana within the past year or
        had lost self‑control over drug use
      then: O4
      why: The Bond Amendment would then apply as the individual would be a current
        unlawful user, and Guideline H could not be mitigated.
    would_not_change:
    - id: noflip1
      if: The Individual’s prior use had been legal under state law at the time of
        consumption
      why: She testified that she did not understand that although marijuana usage
        was legal in her state, it was a federal violation.
    watch_for:
    - id: watch1
      what: Any future admission of illegal drug use or a positive drug test
      favors:
      - O4
      why: A new occurrence would satisfy the ‘current user’ prong of the unlawful‑user
        definition.
  lesson: When assessing drug‑related security concerns, the statutory definition
    of ‘unlawful user’ and the mitigation criteria in Guideline H control the outcome;
    isolated, historic use with demonstrated abstinence and honesty does not bar a
    clearance.
  limits: This reasoning applies only where the individual’s conduct meets the DOE’s
    definition of an unlawful user and where the mitigation factors of Guideline H
    are fully satisfied. It does not extend to ongoing or habitual drug use, or to
    substances not covered by 21 U.S.C. § 802.
