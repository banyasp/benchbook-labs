case:
  id: DR-H3-PSH-22-0118-PSH-21-0031-PSH-22-0118@v1
  title: Guideline H Drug Involvement – Clearance Restoration Decision
  status: draft
  setting: DOE Office of Hearings and Appeals, November 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires
    a security clearance. In March 2022 the Individual tested positive for hydrocodone
    and hydromorphone, both Schedule II controlled substances, during an employer‑conducted
    drug screening. The Local Security Office issued a Notification Letter citing
    Guideline H, Guideline J, and the Bond Amendment as reasons to doubt the Individual’s
    eligibility, and the Individual requested an administrative review hearing. At
    the hearing the Individual testified that she took a medication given by her Partner,
    believing it to be her migraine medicine, but the medication was the Partner’s
    prescription drug. The Partner testified that he mistakenly gave her his prescription,
    that he keeps his medications hidden, and that the pills were stored together
    in the kitchen. The Individual also presented seven negative drug‑test results
    from April through August 2022 and now stores her medication in her purse, being
    the only one who retrieves it.
  question: What should the Administrative Judge do regarding the Individual's access
    authorization under Guideline H and the Bond Amendment?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks the Individual to submit a signed abstinence
        statement.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge holds the decision pending additional drug‑testing
        evidence.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires
      a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In March 2022 the Individual tested positive for hydrocodone and hydromorphone
      in a drug test.
  - id: F3
    kind: situation
    status: confirmed
    fact: Hydrocodone and hydromorphone are Schedule II controlled substances.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial
      doubt about the Individual’s eligibility under Guideline H, Guideline J, and
      the Bond Amendment.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual exercised the right to request an administrative review hearing.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual testified that she took a medication given by her Partner,
      believing it to be her migraine medicine, but it was the Partner’s prescription
      drug.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Partner testified that he mistakenly gave the Individual his prescription
      medication, that he keeps his medications hidden, and that the pills were stored
      together in the kitchen.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual presented seven negative drug‑test results covering April
      through August 2022.
  - id: F9
    kind: situation
    status: assessed
    fact: The Individual now keeps her medication in her purse and is the only person
      who retrieves it.
  - id: F10
    kind: authority
    status: confirmed
    fact: The Bond Amendment defines an unlawful user of a controlled substance as
      someone who uses a controlled substance not as prescribed and whose recent use
      indicates active engagement.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Individual tested positive for Schedule II controlled substances (hydrocodone
      and hydromorphone), which directly triggers Guideline H and the Bond Amendment’s
      prohibition on unlawful users.
  - id: C2
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The Individual’s testimony was contradictory and confusing, and the Partner’s
      testimony raised unanswered questions about medication storage, undermining
      credibility and the ability to rely on her explanations.
  - id: C3
    facts:
    - F8
    - F9
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The mitigation conditions for Guideline H (pattern of abstinence, unlikely
      to recur) were not satisfied; seven negative tests over four months are insufficient
      to establish a reliable pattern.
  - id: C4
    facts:
    - F10
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Under the Bond Amendment, the Individual’s recent, non‑prescribed use indicates
      she is an unlawful user of a controlled substance.
  reasoning:
    read: The case hinges on whether the Individual’s single, non‑prescribed use of
      a Schedule II drug can be deemed a mitigated, isolated incident or a continuing
      security risk under Guideline H and the Bond Amendment.
    weighing: The Administrative Judge weighed the strong regulatory presumption against
      granting a clearance (10 C.F.R. § 710.7(a)) against the Individual’s evidence.
      Because the positive test involved a controlled substance not prescribed to
      her, her testimony was inconsistent, and she failed to meet the mitigation criteria
      listed in the Adjudicative Guidelines (p5.2‑p5.3), the balance tipped toward
      denial.
    tradecraft: The decision is recorded in the formal OHA Decision, citing the relevant
      CFR provisions and Guideline language, and the denial is made final and irreversible
      per the Judge’s authority.
    uncertainty: Some uncertainty remains about whether the incident was truly isolated,
      but the record’s contradictions and limited testing data prevent a finding of
      low risk.
    handoff: The Administrative Judge acted alone, as authorized by 10 C.F.R. § 710.7(a);
      no further agency review is required unless an appeal is filed.
    tempting_wrong:
      option: O4
      pull: The Individual’s seven negative drug tests and new medication‑storage
        practices might suggest rehabilitation.
      why_wrong: Without credible evidence that the behavior is unlikely to recur
        or a signed abstinence statement, the security concerns remain unresolved.
    rejected:
      O2: A request for a signed abstinence statement would not address the unresolved
        credibility and recurrence concerns.
      O3: Holding the decision pending additional testing would delay a necessary
        security determination and the record already shows insufficient mitigation.
      O4: Granting restoration ignores the failure to satisfy Guideline H mitigation
        and the Bond Amendment definition of unlawful use.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual could demonstrate that the incident was a one‑time mistake,
        that she has a sustained pattern of negative drug tests over a longer period,
        and that she provides a signed statement of intent to abstain from all non‑prescribed
        controlled substances.
      then: O4
      why: Guideline H allows mitigation when the behavior is infrequent, long ago,
        and the individual shows a pattern of abstinence; meeting those conditions
        would satisfy the security standard.
    would_not_change:
    - id: noflip1
      if: The Individual submits additional negative drug‑test results but does not
        provide a credible abstinence statement or evidence that the behavior is unlikely
        to recur.
      why: The Judge found the existing negative tests insufficient; additional tests
        alone do not meet the mitigation criteria.
    watch_for:
    - id: watch1
      what: If the Partner continues to hide his medication, creating an environment
        where the Individual could again inadvertently take non‑prescribed drugs.
      favors:
      - O1
      why: Ongoing access to uncontrolled medication sustains the risk identified
        under Guideline H.
  lesson: Under Guideline H and the Bond Amendment, a single instance of non‑prescribed
    controlled‑substance use, without credible mitigation or proof of a sustained
    abstinence pattern, justifies denial of access authorization.
  limits: This rule applies only when the misuse involves a Schedule II (or higher)
    controlled substance and the individual cannot satisfy the specific mitigation
    conditions outlined in the Adjudicative Guidelines; it does not extend to minor
    infractions that are fully remedied and documented.
