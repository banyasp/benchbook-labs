case:
  id: DR-H3-PSH-22-0084-PSH-21-0031-PSH-22-0084@v1
  title: Guideline H Drug Use – Access Authorization Decision
  status: draft
  setting: DOE Office of Hearings and Appeals, October 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee with a Q clearance granted
    in 2008, tested positive for marijuana metabolites in a November 2021 random drug
    test. The Local Security Office suspended the clearance, citing the Bond Amendment
    and Guideline H because the Individual had used THC‑containing products for chronic
    back pain. The Individual denied marijuana use, claimed to use CBD oil, and after
    a retest the positive result was confirmed. He testified he would cease using
    THC products but still kept at least one THC product at home and offered no drug‑test
    evidence of abstinence or a signed statement acknowledging future drug use would
    be grounds for revocation. His statements about the last use date were inconsistent.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline H?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization
        without restriction.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks the Individual for a recent negative drug
        test.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization
        conditionally, requiring a negative test.
      move: partial
      irreversible: false
    O4:
      do: The Administrative Judge denies the Individual’s access authorization without
        restriction.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is a DOE contractor employee who was granted a DOE Q clearance
      in approximately 2008.
  - id: F2
    kind: situation
    status: confirmed
    fact: On November 8, 2021 the Individual was selected for a random drug test that
      returned a positive result for marijuana metabolite.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Individual denied using marijuana, claimed to use CBD oil, and requested
      a retest, which confirmed the positive result.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office suspended the Individual’s access authorization
      and cited the Bond Amendment and Guideline H as the basis for ineligibility.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual used THC‑containing products, including a transdermal compound
      labeled as containing cannabis, vape pens with CBD:THC ratios up to 1:1, and
      a tincture, for several months to manage chronic back pain.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual testified that he would not use CBD or THC products in the
      future but still possessed at least one THC product at his home at the time
      of the hearing.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual did not provide drug‑testing evidence of abstinence nor a
      signed statement acknowledging that future drug use would be grounds for revocation.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Individual gave inconsistent statements about the last date of THC product
      use, ranging from over six months ago to as recent as September/October 2021.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F4
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The Bond Amendment (50 U.S.C. § 3343(b)) bars a clearance for any unlawful
      user of a controlled substance; THC is a controlled substance and the positive
      test shows recent use.
  - id: C2
    facts:
    - F5
    - F8
    - F7
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Guideline H requires mitigation; the Individual’s use was frequent, recent,
      and he offered no evidence of abstinence or a signed waiver, so none of the
      mitigating conditions are satisfied.
  - id: C3
    facts:
    - F8
    - F6
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Inconsistent statements about the last use date and the implausible belief
      that a clearly labeled controlled‑substance product was permissible undermine
      credibility.
  - id: C4
    facts:
    - F7
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Individual failed to provide any post‑test drug‑testing evidence or a
      signed statement acknowledging that any future drug use would be grounds for
      revocation, which are required to satisfy Guideline H mitigation.
  - id: C5
    facts:
    - F6
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: Retention of a THC product at the hearing demonstrates continued access to
      a prohibited substance, indicating the risk of future non‑compliance with security
      rules.
  reasoning:
    read: The Individual tested positive for marijuana metabolites while holding a
      Q clearance, admitted using THC‑containing products for pain, and cannot demonstrate
      that he has ceased such use or that the behavior is unlikely to recur.
    weighing: The Judge finds that the Individual’s frequent recent THC use, lack
      of certainty about the last use date, and failure to provide corroborating evidence
      mean he has not met his burden to show he is not an unlawful user, so the Bond
      Amendment bars the clearance, and none of the Guideline H mitigating conditions
      are satisfied, leading to denial.
    tradecraft: The decision is recorded in the official OHA decision docket, citing
      the relevant statutes, regulations, and adjudicative guidelines, and the denial
      is entered as a final administrative action subject only to appeal under 10
      C.F.R. § 710.28.
    uncertainty: The primary uncertainty lies in the Individual’s undisclosed actual
      date of last THC use, but the weight of the positive test and the absence of
      corroborating abstinence evidence outweigh any doubt.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to resolve eligibility after the hearing.
    tempting_wrong:
      option: O3
      pull: A conditional grant might appear compassionate given the Individual’s
        expressed intent to stop using THC and his pain‑management needs.
      why_wrong: The source finds the mitigating conditions unmet; granting even conditionally
        would conflict with the Bond Amendment’s categorical bar and the explicit
        guidance that no mitigation exists.
    rejected:
      O1: The source finds no evidence that the Individual has resolved the security
        concerns; the Bond Amendment provides a categorical prohibition.
      O2: The hearing is concluded; the judge must issue a final determination, not
        a request for additional evidence.
      O3: Mitigating conditions under Guideline H are not satisfied; a conditional
        grant would be inconsistent with the adjudicative guidelines.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provided a recent negative drug test and a signed statement
        acknowledging that any future drug use would be grounds for revocation.
      then: O3
      why: Such evidence would satisfy the second mitigating condition under Guideline
        H (pattern of abstinence) and could allow a conditional restoration.
    would_not_change:
    - id: noflip1
      if: The Individual merely asserts abstinence without corroborating evidence
        or removal of THC products from his home.
      why: The Individual’s testimony that he no longer uses THC products, unsupported
        by drug testing or other corroborating evidence, is insufficient to meet this
        burden.
    watch_for:
    - id: watch1
      what: Future submission of a verified negative drug test and a formal waiver
        statement.
      favors:
      - O3
      why: These would meet the mitigating criteria outlined in Guideline H and could
        justify a conditional grant.
  lesson: When a clearance holder tests positive for a controlled substance, the Bond
    Amendment imposes a categorical bar, and Guideline H mitigation requires concrete
    evidence of abstinence and a clear pattern of compliance; absent that, the clearance
    must be denied.
  limits: This reasoning applies only to cases involving controlled‑substance use
    that triggers the Bond Amendment and Guideline H; it does not address other adjudicative
    categories such as financial irresponsibility or foreign influence.
