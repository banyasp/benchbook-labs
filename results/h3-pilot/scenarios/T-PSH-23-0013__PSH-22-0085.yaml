case:
  id: DR-H3-PSH-23-0013-PSH-22-0085-PSH-23-0013@v1
  title: Guideline J Criminal Conduct Mitigation Decision
  status: draft
  setting: DOE Office of Hearings and Appeals, May 2023
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised security concerns under Guideline J
    because the Individual had alcohol‑related criminal offenses in 2002, 2005, and
    2022. The Individual was arrested on May 14, 2022; the assault and obstruction
    charges were later dismissed and he pleaded guilty only to public drunkenness.
    Since May 2022 he has remained abstinent, as shown by nine months of negative
    PEth and urinalysis tests, completed an eight‑week Intensive Outpatient Program,
    and continues weekly after‑care and AA participation three to four times per week.
    The DOE Psychologist concluded the Individual demonstrated more than adequate
    rehabilitation, a very positive prognosis, and a very low risk of relapse. The
    Administrative Judge must determine whether these facts mitigate the Guideline
    J concerns before deciding on the Individual’s access authorization.
  question: What should the Administrative Judge do with the Individual’s access authorization
    under Guideline J?
  options:
    O1:
      do: The Administrative Judge holds the Individual’s access authorization pending
        review.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline J because the Individual had alcohol‑related
      criminal offenses in 2002, 2005, and 2022.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested on May 14, 2022; the simple assault and obstruction
      charges were dismissed and he pleaded guilty to public drunkenness.
  - id: F3
    kind: capability
    status: confirmed
    fact: The Individual has maintained abstinence since May 15, 2022, supported by
      nine months of negative PEth and urinalysis tests.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual completed an eight‑week Intensive Outpatient Program on July
      25, 2022 and continues weekly after‑care and AA participation three to four
      times per week.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist concluded the Individual showed more than adequate
      evidence of rehabilitation, has a very positive prognosis, and a very low risk
      of relapse.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual’s criminal conduct was directly linked to his alcohol use
      disorder, and he has taken extensive steps to treat the disorder.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Administrative Judge must determine whether the Guideline J concerns
      are mitigated before deciding on the Individual’s access authorization.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The Administrative Judge found that the Individual’s criminal conduct was
      directly caused by his alcohol use disorder and that, because he has maintained
      nine months of documented abstinence, completed treatment, and continues weekly
      AA participation, the Guideline J concerns are mitigated under the elapsed‑time
      and rehabilitation criteria.
  - id: C2
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The DOE Psychologist’s professional opinion that the Individual shows more
      than adequate rehabilitation, a very positive prognosis, and a very low risk
      of relapse satisfies the adjudicative requirement for evidence of reformation.
  - id: C3
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Objective evidence—nine months of negative PEth and urinalysis tests, completion
      of an eight‑week IOP, and ongoing after‑care and AA attendance—demonstrates
      a clear and established pattern of abstinence consistent with treatment recommendations.
  - id: C4
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: Although the LSO initially raised Guideline J concerns because of the three
      alcohol‑related arrests, the adjudicative guidelines allow mitigation when the
      underlying disorder is treated and the conduct is unlikely to recur.
  reasoning:
    read: The situation is whether the Individual’s past alcohol‑related criminal
      conduct, cited under Guideline J, is sufficiently mitigated by his post‑arrest
      treatment and abstinence to permit restoration of his access authorization.
    weighing: The Administrative Judge weighed the mitigating factors listed in the
      Adjudicative Guidelines—elapsed time, rehabilitation, and demonstrated abstinence—against
      the presumption against granting a clearance. The Judge relied on the DOE Psychologist’s
      assessment (C2) and the objective test results and treatment records (C1, C3)
      to conclude that the risk of recurrence is minimal, satisfying the Guideline
      J mitigation condition.
    tradecraft: The decision is recorded in the official OHA decision memorandum,
      citing the relevant CFR provisions and the Adjudicative Guidelines, and the
      restoration order is entered into the Individual’s personnel security file.
    uncertainty: The primary uncertainty lies in the future risk of relapse; however,
      the psychologist’s very low‑risk prognosis and the Individual’s continued compliance
      with AA and after‑care reduce that uncertainty to a negligible level.
    handoff: The Administrative Judge makes the final determination alone, as authorized
      by 10 C.F.R. § 710.7(a); no further agency review is required unless an appeal
      is filed.
    tempting_wrong:
      option: O2
      pull: The presumption against granting a clearance and the seriousness of the
        assault charge could tempt a denial.
      why_wrong: Denying would ignore the substantial evidence of rehabilitation and
        the direct link between the conduct and a treatable disorder, contrary to
        the Guidelines’ mitigation provisions.
    rejected:
      O1: Holding the authorization pending further review is unnecessary because
        the record already satisfies the mitigation criteria.
      O2: Denial is inconsistent with the adjudicative finding that the Individual’s
        criminal conduct is unlikely to recur and does not now cast doubt on his reliability.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had failed to provide evidence of at least six months of
        continuous abstinence and had not completed the IOP program.
      then: O2
      why: Without documented abstinence and treatment, the Guideline J mitigation
        condition would not be met, leading to denial of the clearance.
    would_not_change:
    - id: noflip1
      if: The Individual’s past arrests occurred prior to 2005 and were unrelated
        to alcohol use.
      why: The Guideline J concern is specifically tied to alcohol‑related conduct;
        unrelated offenses would not affect the mitigation analysis for this case.
    watch_for:
    - id: watch1
      what: Any future alcohol‑related incident or positive PEth/urinalysis test.
      favors:
      - O2
      why: A relapse would indicate that the rehabilitation was not durable, re‑activating
        the Guideline J security concern.
  lesson: When criminal conduct is directly linked to a treatable substance‑use disorder,
    sustained abstinence, documented treatment completion, and a professional assessment
    of low relapse risk can fully mitigate Guideline J concerns and justify restoration
    of access authorization.
  limits: This rule applies only when the underlying conduct is clearly caused by
    the disorder and when objective evidence of long‑term abstinence and successful
    treatment is available; it does not extend to unrelated violent or non‑substance‑related
    crimes.
