case:
  id: DR-H3-PSH-23-0015-PSH-22-0085-PSH-22-0085@v1
  title: Guideline J Criminal Conduct Mitigation Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised a security concern under Guideline J
    because the Individual was charged with battery against a household member and
    criminal damage to property on November 2, 2021. The Individual admitted to drinking
    alcohol before the incident and had a pattern of intoxication once or twice a
    month from August to November 2021. Since November 3, 2021, the Individual has
    been abstinent, providing negative PEth tests from April through July 2022 and
    random EtG tests showing no alcohol use. He completed 13 weeks of an intensive
    outpatient program, is now in a regular outpatient program, and attends AA meetings
    regularly. The DOE Psychiatrist diagnosed him with moderate Alcohol Use Disorder
    in early remission, noting his rehabilitation efforts and strong support system.
    The LSO’s Guideline J concern is tied to the alcohol‑related arrests, and the
    Individual’s restraining order after the incident was later dismissed.
  question: What should the Administrative Judge do regarding the Individual’s criminal
    conduct security concern under Guideline J?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge asks the Local Security Office for documentation.
      move: ask
      irreversible: false
      to: Local Security Office
    O4:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged with Battery Against a Household Member and Criminal
      Damage to Property on November 2, 2021.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual admitted to consuming alcohol prior to the incident and had
      intoxication once or twice a month from August to November 2021.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline J (Criminal Conduct) as a basis
      for ineligibility.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual has been abstinent since November 3, 2021, and provided negative
      PEth tests from April to July 2022.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed 13 weeks of an intensive outpatient program, is
      now in a regular outpatient program, and regularly attends AA meetings.
  - id: F6
    kind: situation
    status: confirmed
    fact: The DOE Psychiatrist diagnosed the Individual with Alcohol Use Disorder,
      Moderate, in early remission and noted his rehabilitation efforts and support
      system.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual’s criminal behavior was directly linked to maladaptive alcohol
      use, forming the basis of the Guideline J concern.
  - id: F8
    kind: situation
    status: confirmed
    fact: A restraining order was granted after the incident but later dismissed at
      the girlfriend’s request.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The passage of time since the November 2021 incident, combined with continuous
      abstinence and lack of recurrence, satisfies Guideline J mitigating factor (a)
      that the conduct is unlikely to recur.
  - id: C2
    facts:
    - F5
    - F6
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Documented participation in intensive and regular outpatient programs, ongoing
      AA attendance, and negative PEth/EtG tests demonstrate successful rehabilitation,
      meeting Guideline J mitigating factor (d).
  - id: C3
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The LSO’s Guideline J concern is directly linked to alcohol‑related conduct;
      once the alcohol issue is mitigated under Guideline G, the associated criminal‑conduct
      concern is likewise mitigated per agency guidance.
  - id: C4
    facts:
    - F8
    equity: third_party_harm
    favors:
    - O2
    weight: weak
    why: The restraining order was dismissed at the girlfriend’s request, indicating
      that the immediate risk to the household member has been resolved.
  reasoning:
    read: The Individual’s criminal conduct stemmed from maladaptive alcohol use that
      led to a battery charge on 2 Nov 2021. The trap is to treat the charge as an
      automatic disqualifier, ignoring the substantial post‑incident rehabilitation
      and the passage of time.
    weighing: 'The Judge states: “I find that the Individual has mitigated the Guideline
      J concerns pursuant to the mitigating factor at ¶ 32(a).” He further notes that
      “adequate time has passed since the criminal behavior outlined in the Summary
      of Security Concerns occurred and that it happened under such circumstances
      that it is unlikely to recur.” These statements directly reflect the source’s
      narrative that the mitigating conditions of time elapsed and successful rehabilitation
      have been satisfied.'
    tradecraft: The Judge will issue a written decision restoring the Individual’s
      access authorization, cite the relevant regulatory provisions, and note the
      appeal rights under 10 C.F.R. § 710.28.
    uncertainty: Minimal; the decision rests on documented testing and treatment records.
      Future relapse would introduce uncertainty.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to resolve the security concern after evaluating the record.
    tempting_wrong:
      option: O4
      pull: The seriousness of a battery charge and the presence of a restraining
        order could suggest continued risk.
      why_wrong: Denying would ignore the clear evidence of sustained abstinence,
        successful treatment, and the agency’s own mitigating‑factor analysis.
    rejected:
      O1: Holding the decision would unnecessarily delay resolution despite sufficient
        mitigating evidence.
      O3: Additional documentation from the LSO is not required because the record
        already contains the necessary evidence of rehabilitation.
      O4: Denial fails to recognize that the Guideline J mitigating factors have been
        met, contrary to the adjudicative guidelines and the psychiatrist’s assessment.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to test positive for alcohol use or relapse into abusive
        behavior after the decision date
      then: O4
      why: A relapse would negate the time‑elapsed and rehabilitation factors that
        underlie the mitigation analysis.
    would_not_change:
    - id: noflip1
      if: Additional historical records of the 2019 arrest are produced but show no
        new criminal conduct after November 2021
      why: The new information does not affect the established mitigating factors
        of abstinence and treatment.
    watch_for:
    - id: watch1
      what: Any future positive PEth or EtG test
      favors:
      - O4
      why: Positive testing would indicate a breach of the abstinence condition that
        underpins the mitigation finding.
  lesson: When criminal conduct is directly tied to a treatable condition such as
    alcohol misuse, the adjudicative guidelines allow the conduct to be mitigated
    if sufficient time has passed, the individual remains abstinent, and documented
    rehabilitation is evident. The presence of a past restraining order does not preclude
    restoration if it has been dismissed and no ongoing risk exists.
  limits: This analysis applies only where the offending behavior is clearly linked
    to a substance‑use disorder and where the individual can demonstrate sustained
    abstinence and treatment. It does not extend to violent offenses unrelated to
    such a condition or where there is evidence of continued risk to others.
