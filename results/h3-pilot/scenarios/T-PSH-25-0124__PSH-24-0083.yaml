case:
  id: DR-H3-PSH-25-0124-PSH-24-0083-PSH-25-0124@v1
  title: Guideline H Drug Involvement Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, October 2025
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual held a DOE access authorization and was randomly drug‑tested
    in February 2025, resulting in a positive finding for marijuana metabolite. The
    Local Security Office issued a notification citing Guideline H and the Bond Amendment,
    indicating the Individual was an unlawful user of a controlled substance. The
    Individual claimed inadvertent ingestion via CBD‑laced brownies offered by a family
    member but offered no corroborating proof. He completed a two‑hour educational
    counseling session but could not produce the certificate at the hearing. Over
    the past ten years he had undergone roughly 75‑100 random drug screens, all previously
    negative. No evidence of abstinence, treatment program participation, or other
    mitigating factors was presented.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline H and the Bond Amendment?
  options:
    O1:
      do: The Administrative Judge holds the decision pending further medical evaluation.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge asks the Local Security Office for evidence of
        drug use.
      move: ask
      irreversible: false
    O4:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual had an active DOE access authorization prior to February
      2025.
  - id: F2
    kind: situation
    status: confirmed
    fact: In February 2025, the Individual was randomly selected for a drug test that
      returned positive for marijuana metabolite.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating the positive
      test created substantial doubt under Guideline H and the Bond Amendment, prohibiting
      the Individual from holding a clearance.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Bond Amendment bars granting a clearance to any person who is an unlawful
      user of a controlled substance.
  - id: F5
    kind: authority
    status: confirmed
    fact: Guideline H identifies illegal drug use as a security risk concerning reliability
      and trustworthiness.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual testified that he unintentionally ingested marijuana via
      CBD‑laced brownies offered by a family member and provided no corroborating
      evidence.
  - id: F7
    kind: situation
    status: assessed
    fact: The Individual completed a two‑hour educational counseling session recommended
      by a substance‑abuse counselor but could not produce the certificate at the
      hearing.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual had undergone approximately 75‑100 prior random drug screenings
      since receiving his clearance, all of which were negative.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The Individual did not present evidence of a pattern of abstinence, participation
      in a drug treatment program, or other mitigating factors listed in the Adjudicative
      Guidelines.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment expressly bars a clearance for any person who is an unlawful
      user of a controlled substance; the positive marijuana test satisfies that definition.
  - id: C2
    facts:
    - F2
    - F5
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Guideline H requires mitigation of drug‑involvement concerns; the Individual
      offered no evidence of abstinence, treatment, or other mitigating factors, so
      the security concern remains unmitigated.
  - id: C3
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual’s claim of inadvertent ingestion is uncorroborated; without
      supporting evidence the claim cannot overcome the statutory presumption against
      clearance.
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Adjudicative Guidelines list a satisfactory drug‑treatment program as
      a mitigating factor; the record shows no such program was completed, so the
      factor does not apply.
  reasoning:
    read: The Individual tested positive for marijuana metabolites after a random
      screening. He argues the ingestion was accidental via a family‑member’s CBD‑laced
      brownies, but he supplied no corroborating evidence and offered only a two‑hour
      counseling certificate that could not be produced at the hearing.
    weighing: Applying {C1} and {C2}, the Bond Amendment and Guideline H together
      create a statutory bar that is not offset by any mitigating factor. {C3} underscores
      the lack of credible evidence for the inadvertent‑use theory, and {C4} confirms
      that the limited counseling does not satisfy the required treatment‑program
      mitigation. The balance therefore tips decisively toward denial.
    tradecraft: The Administrative Judge records a final decision denying restoration,
      cites the specific statutory and guideline provisions, and notes the appeal
      rights under 10 C.F.R. § 710.28.
    uncertainty: The only uncertainty lies in the credibility of the Individual’s
      inadvertent‑use claim, but the record contains no supporting documentation,
      leaving the factual determination unresolved in his favor.
    handoff: The decision is made solely by the Administrative Judge, as authorized
      by 10 C.F.R. Part 710 and the OHA’s delegation.
    tempting_wrong:
      option: O4
      pull: The Individual’s claim of accidental exposure and completion of counseling
        might appear to merit a grant.
      why_wrong: Without corroborating evidence, the claim does not satisfy the Bond
        Amendment’s prohibition nor the Guideline H mitigation requirements.
    rejected:
      O1: Holding the case pending would ignore the clear statutory bar and the lack
        of mitigating evidence.
      O3: Requesting additional evidence from the LSO would be futile; the LSO already
        supplied the relevant drug‑test result, and the Individual bears the burden
        of proof.
      O4: Granting restoration would contravene the Bond Amendment and Guideline H,
        which the source explicitly found unmitigated.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provides credible evidence of a sustained pattern of abstinence
        and completes a recognized drug‑treatment program with a favorable prognosis.
      then: O4
      why: Mitigating factor (d) of Guideline H would be satisfied, allowing the security
        concern to be mitigated.
    - id: flip2
      if: The Individual produces verifiable documentation that the two‑hour counseling
        session was part of an approved drug‑treatment program and that a qualified
        medical professional has given a favorable prognosis.
      then: O4
      why: The counseling would then meet the definition of a satisfactory treatment
        program under mitigating factor (d).
    would_not_change:
    - id: noflip1
      if: The Individual only produces the counseling certificate without evidence
        that it constitutes a treatment program.
      why: Guideline H requires a full treatment program; a brief educational session
        does not satisfy mitigating factor (d).
    watch_for:
    - id: watch1
      what: Any future positive drug test for a controlled substance.
      favors:
      - O2
      why: A new positive result would reaffirm the Individual’s status as an unlawful
        user under the Bond Amendment.
  lesson: A positive test for a Schedule I controlled substance triggers the Bond
    Amendment’s prohibition, and Guideline H concerns are only mitigated by documented
    abstinence, treatment, or other statutory mitigating factors. Absent such evidence,
    clearance restoration must be denied.
  limits: This reasoning applies only where the adverse drug test involves a controlled
    substance classified as illegal under federal law and where the individual fails
    to meet the specific mitigating criteria outlined in Guideline H. It does not
    address cases involving legally prescribed medication or substances removed from
    the Controlled Substances Act.
