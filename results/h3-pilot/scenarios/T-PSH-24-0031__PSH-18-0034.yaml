case:
  id: DR-H3-PSH-24-0031-PSH-18-0034-PSH-24-0031@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: Office of Hearings and Appeals, May 2024, Department of Energy
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised a security concern under Guideline G,
    alleging that the Individual habitually consumed alcohol to the point of impaired
    judgment. The DOE-contracted psychiatrist testified that the Individual habitually
    drank to that level, citing a positive PEth test and a definition of intoxication
    at a blood alcohol content of .06%. The Individual reported moderate weekend drinking,
    occasional higher consumption, and denied any intoxication since the end of 2022.
    Additional monthly PEth tests from January through May 2024 were negative. The
    Administrative Judge must determine whether the evidence shows a pattern of habitual
    intoxication that warrants maintaining the security concern under Guideline G.
  question: What should the Administrative Judge do regarding the Individual’s Guideline
    G security concern?
  options:
    O1:
      do: The Administrative Judge finds that the Guideline G concern is resolved
        and allows the access authorization to proceed with respect to alcohol consumption.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks the DOE Psychiatrist for a supplemental evaluation
        of the Individual’s alcohol use before deciding on the Guideline G concern.
      move: ask
      irreversible: false
      to: DOE Psychiatrist
    O3:
      do: The Administrative Judge denies that the Guideline G concern is resolved
        and maintains the denial of access authorization on that ground.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline G (Alcohol Consumption) as a basis
      for substantial doubt about the Individual’s eligibility for access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office alleged five occasions on which the Individual
      was arrested after consuming alcohol.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The DOE psychiatrist concluded that the Individual habitually consumed alcohol
      to the point of impaired judgment.
  - id: F4
    kind: situation
    status: confirmed
    fact: A phosphatidylethanol (PEth) test performed in July 2023 was positive at
      97 ng/mL.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual reported typically drinking two or three glasses of wine
      per weekend, occasional higher consumption, and denied any intoxication since
      December 31 2022.
  - id: F6
    kind: situation
    status: confirmed
    fact: Monthly PEth tests from January through May 2024 were all negative for alcohol.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The adjudicative standard defines habitual alcohol consumption as intoxication
      at least once per month, with intoxication defined as a blood alcohol content
      of .08%.
  - id: F8
    kind: intelligence
    status: assessed
    fact: There is no evidence that the Individual was intoxicated monthly; the 2021
      battery arrest was not clearly alcohol‑related, and earlier alcohol‑related
      offenses were isolated and mitigated by time.
  considerations:
  - id: C1
    facts:
    - F7
    - F3
    - F4
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The adjudicative standard defines intoxication as a BAC of .08%; the psychiatrist’s
      definition of .06% is not accepted, so his opinion does not meet the statutory
      definition of habitual intoxication.
  - id: C2
    facts:
    - F8
    - F2
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: There is no evidence the Individual was intoxicated on a monthly basis; the
      2021 battery arrest was not clearly alcohol‑related and earlier alcohol‑related
      offenses are isolated and mitigated by the passage of time.
  - id: C3
    facts:
    - F6
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Recent monthly PEth tests (Jan‑May 2024) were all negative, and the Individual
      consistently reports no intoxication since 31 Dec 2022, supporting the conclusion
      that she does not habitually drink to impairment.
  - id: C4
    facts:
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The first mitigating condition of Guideline G (behavior infrequent, time
      elapsed, unlikely to recur) applies, resolving the security concern.
  reasoning:
    read: The LSO alleges a Guideline G concern based on the psychiatrist’s opinion
      that the Individual habitually drinks to the point of impaired judgment. The
      record contains a positive PEth test from July 2023, self‑reports of moderate
      drinking, and negative PEth tests in 2024, but no concrete evidence of monthly
      intoxication at the statutory .08% BAC level.
    weighing: Applying the adjudicative guidelines, the Judge finds the psychiatrist’s
      lower BAC threshold unsupported (C1) and notes the absence of monthly intoxication
      evidence (C2). The negative recent PEth results and the Individual’s consistent
      statements (C3) further undermine the habit‑to‑impairment claim. Because the
      first mitigating condition is satisfied (C4), the Guideline G concern is resolved.
    tradecraft: The decision will be entered into the official OHA record, citing
      the relevant CFR sections and adjudicative guidelines, and the finding will
      be communicated to the LSO and the Individual’s employer.
    uncertainty: Minimal; the only uncertainty lies in the reliability of the July 2023
      PEth result, which the Judge deemed insufficient to establish habitual intoxication.
    handoff: The Administrative Judge decides alone, as the record provides sufficient
      basis and no further expert input is required.
    tempting_wrong:
      option: O2
      pull: Requesting a supplemental psychiatric evaluation might appear prudent
        given the earlier positive PEth test.
      why_wrong: The Judge already concluded that the psychiatrist’s methodology is
        not aligned with the statutory definition, and additional opinion would not
        change the lack of objective evidence of monthly intoxication.
    rejected:
      O2: A supplemental evaluation is unnecessary because the existing evidence already
        fails to meet the statutory definition of habitual intoxication.
      O3: The security concern under Guideline G is not sustained; the record shows
        no monthly intoxication, the first mitigating condition applies, and recent
        PEth tests are negative.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Objective evidence shows the Individual intoxicated at least once per month
        with a BAC of .08% or higher (e.g., a positive PEth test above the high‑risk
        threshold or documented arrests for alcohol‑related offenses occurring monthly).
      then: O3
      why: Such evidence would satisfy the statutory definition of habitual intoxication,
        negating the mitigating condition and sustaining the Guideline G concern.
    would_not_change:
    - id: noflip1
      if: The 2000 DUI is considered,
      why: The Judge already treated the DUI as a minor, isolated oversight resolved
        by the third mitigating condition.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or documented incident of intoxication meeting
        the .08% BAC standard.
      favors:
      - O3
      why: New objective evidence of habitual intoxication would revive the Guideline G
        security concern.
  lesson: Guideline G concerns must be evaluated against the statutory definition
    of intoxication (.08% BAC) and require concrete evidence of monthly impairment;
    expert opinions using lower thresholds are insufficient. Mitigating conditions
    that show infrequency and low risk can resolve the concern.
  limits: This analysis applies only when the record lacks objective, reliable evidence
    of monthly intoxication at the statutory level. It does not apply where credible
    test results or documented incidents demonstrate such a pattern.
