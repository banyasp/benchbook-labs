case:
  id: DR-H3-PSH-24-0088-PSH-24-0055-PSH-24-0055@v1
  title: Guideline E Personal Conduct Mitigation Decision
  status: draft
  setting: DOE Office of Hearings and Appeals hearing, April 2024
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: During an administrative security clearance hearing, the Local Security
    Office raised a Guideline E concern alleging the Individual was not fully candid
    about his alcohol consumption and failed to cooperate with a breath test. The
    Individual reported drinking four to six cans of beer or alcoholic seltzer per
    month and claimed he had been intoxicated fifteen to eighteen times in the past
    year. The police report documented failed field sobriety tests, the smell of alcohol,
    and a refusal to submit a breath test. A DOE‑consultant psychologist performed
    a PEth test that returned 168 ng/mL and concluded the Individual consumed four
    or more drinks daily, also stating the Individual was not forthcoming about his
    intake. The psychologist’s curriculum vitae does not show medical qualifications
    to interpret PEth results. The Individual testified that he attempted to provide
    a breath sample but the device malfunctioned and that he misunderstood the term
    “intoxicated.” The Administrative Judge must decide whether these facts mitigate
    the Guideline E concern enough to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual's access
    authorization under Guideline E?
  options:
    O1:
      do: The Administrative Judge asks for another PEth test before deciding.
      move: ask
      irreversible: false
    O2:
      do: The Administrative Judge denies restoration of the Individual's access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual's access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge holds the decision pending further PEth evaluation.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office invoked Guideline E alleging lack of candor and
      false statements about alcohol consumption and breath test cooperation.
  - id: F2
    kind: capability
    status: confirmed
    fact: The Individual reported drinking four to six cans of beer or alcoholic seltzer
      per month and said he had been intoxicated fifteen to eighteen times in the
      last twelve months.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual failed field sobriety tests, smelled of alcohol, and refused
      a breathalyzer.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: A DOE psychologist’s PEth test showed 168 ng/mL and the psychologist concluded
      the Individual consumed four or more drinks daily, stating he was not forthcoming
      about his intake.
  - id: F5
    kind: authority
    status: confirmed
    fact: The DOE psychologist’s curriculum vitae does not indicate medical qualifications
      to interpret PEth test results.
  - id: F6
    kind: situation
    status: assessed
    fact: The Individual testified he attempted to provide a breath sample but the
      device appeared to malfunction and he was unsure about trying again.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Individual explained he misunderstood the term “intoxicated” and maintained
      that his testimony was truthful and consistent.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The DOE psychologist’s PEth result interpretation is not admissible because
      the psychologist lacks medical qualifications to interpret the test, so the
      alleged nondisclosure of alcohol consumption cannot be substantiated on that
      basis.
  - id: C2
    facts:
    - F3
    - F6
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual’s testimony about the breath‑test malfunction and his misunderstanding
      of “intoxicated” is consistent and credible; however, the record still shows
      failed field‑sobriety tests, odor of alcohol, and a refusal to submit a breath
      sample, which constitute conduct raising personal‑conduct concerns under Guideline E.
  - id: C3
    facts:
    - F1
    - F2
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Guideline E requires proof of deliberate omission or falsification; the judge
      found no such intent, but the LSO’s invocation remains justified because the
      overall conduct (arrest, refusal, repeated intoxication) creates substantial
      doubt about reliability.
  - id: C4
    facts: []
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Regulatory presumption against granting or restoring a clearance (10 C.F.R. §710.7(a))
      places the burden on the Individual to demonstrate that restoration would not
      endanger the common defense.
  - id: C5
    facts: []
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: The judge emphasizes the need for truthful, complete disclosures; the Individual’s
      partial disclosures and the unresolved breath‑test issue undermine confidence
      in his candor.
  reasoning:
    read: The LSO alleges that the Individual was not fully candid about his alcohol
      use and refused a breath test, invoking Guideline E. The judge must decide whether
      the Individual has mitigated that concern sufficiently to restore his clearance.
    weighing: The judge gives decisive weight to the lack of qualified expert analysis
      of the PEth result (C1) and to the factual record of failed sobriety tests and
      breath‑test refusal (C2). Although the Individual’s statements are deemed truthful
      (C3), the aggregate conduct still raises substantial doubt. The statutory presumption
      against restoration (C4) and the policy imperative for candor (C5) tip the balance
      toward denial.
    tradecraft: The decision is entered in the official OHA record, citing the relevant
      sections of 10 C.F.R. §710 and the Adjudicative Guidelines, and the judgment
      is signed by the Administrative Judge.
    uncertainty: The primary uncertainty lies in the interpretation of the PEth test;
      however, the judge explicitly rejects that interpretation due to the psychologist’s
      lack of qualifications, eliminating that uncertainty.
    handoff: The Administrative Judge decides alone, as the regulations vest the judge
      with sole authority to make the final determination after the hearing.
    tempting_wrong:
      option: O3
      pull: The Individual’s recent abstinence and therapy might suggest rehabilitation.
      why_wrong: The judge finds the abstinence period too short and the psychologist’s
        recommended six‑month abstinence and treatment not fulfilled, so the mitigation
        is insufficient under Guideline E.
    rejected:
      O1: A further PEth test is unnecessary because the current test’s interpretation
        is already deemed unreliable.
      O3: Restoration would be premature given the unresolved concerns and insufficient
        mitigation.
      O4: Holding the decision pending adds no value; the record already shows the
        required facts and the judge can rule now.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual remained abstinent for six months, completed the recommended
        treatment program, and provided regular PEth tests as the psychologist required.
      then: O3
      why: Guideline E mitigation factor (b) would be satisfied, showing sustained
        rehabilitation and reduced risk.
    would_not_change:
    - id: noflip1
      if: The psychologist’s PEth interpretation were accepted despite lack of qualifications.
      why: Even with that interpretation, the record still shows refusal to submit
        a breath test and failed sobriety tests, which alone sustain the Guideline E
        concern.
    watch_for:
    - id: watch1
      what: Any future alcohol‑related incident or failure to maintain abstinence.
      favors:
      - O2
      why: A repeat incident would reaffirm the lack of reliability and trustworthiness.
  lesson: Under Guideline E, an individual must demonstrate clear, sustained rehabilitation—including
    a qualified period of abstinence and compliance with treatment recommendations—to
    overcome personal‑conduct concerns; mere short‑term abstinence or unqualified
    expert opinions are insufficient.
  limits: This reasoning applies only to cases where the alleged nondisclosure concerns
    stem from alcohol‑related conduct and where the expert evidence lacks proper qualification.
    It does not extend to other types of personal‑conduct violations or to situations
    where a qualified medical professional provides conclusive evidence of low risk.
