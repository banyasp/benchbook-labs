case:
  id: DR-H3-PSH-22-0084-PSH-21-0057-PSH-22-0084@v1
  title: DOE Access Authorization Decision – Guideline H Drug Use
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, October 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is a DOE contractor employee who holds a Q clearance and
    was first granted access authorization in approximately 2008. On November 8, 2021
    the Individual was selected for a random drug test that returned a positive result
    for marijuana metabolite, which was confirmed after a retest. The Local Security
    Office suspended the Individual’s access authorization, citing the Bond Amendment
    and Guideline H as the basis for ineligibility. The Individual had used various
    THC‑containing products, including a transdermal compound labeled as containing
    cannabis, vape pens with CBD:THC ratios up to 1:1, and a tincture, on a daily
    basis for several months. At the hearing the Individual testified that he would
    not use THC or CBD products in the future, but he still possessed at least one
    THC product at his home and gave inconsistent statements about the last date of
    use. No post‑positive‑test drug testing was offered to demonstrate abstinence.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline H?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge partially restores the Individual’s access authorization
        pending a drug test.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge asks the Individual to provide a drug test before
        deciding.
      move: ask
      irreversible: false
    O4:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is a DOE contractor employee who holds a Q clearance and
      was first granted access authorization in approximately 2008.
  - id: F2
    kind: situation
    status: confirmed
    fact: On November 8, 2021 the Individual was selected for a random drug test that
      returned a positive result for marijuana metabolite.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual denied using marijuana, claimed to use CBD oil, requested
      a retest, and the retest confirmed the positive result.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office suspended the Individual’s access authorization
      and cited the Bond Amendment and Guideline H as the basis for ineligibility.
  - id: F5
    kind: situation
    status: assessed
    fact: The Individual used various THC‑containing products, including a transdermal
      compound labeled as containing cannabis, vape pens with CBD:THC ratios up to
      1:1, and a tincture, on a daily basis for several months.
  - id: F6
    kind: situation
    status: assessed
    fact: The Individual testified that he would not use THC or CBD products in the
      future, but he still possessed at least one THC product at his home at the time
      of the hearing.
  - id: F7
    kind: situation
    status: assessed
    fact: The Individual gave inconsistent statements about the last date of THC product
      use, ranging from over six months prior to the test to possibly September/October
      2021.
  - id: F8
    kind: situation
    status: confirmed
    fact: No post‑positive‑test drug testing was offered by the Individual to demonstrate
      abstinence.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Bond Amendment (50 U.S.C. § 3343(b)) bars a clearance for any unlawful
      user of a controlled substance. The positive marijuana metabolite test and lack
      of any post‑test evidence of abstinence satisfy the statutory definition of
      unlawful use.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Guideline H requires that the individual demonstrate reliability and trustworthiness.
      Inconsistent statements about the last use date and continued possession of
      a THC product undermine credibility, a key factor the Judge cited.
  - id: C3
    facts:
    - F5
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Frequent, recent use of a Schedule I controlled substance raises a risk that
      the individual may be impaired or non‑compliant with laws, directly affecting
      the common defense and security.
  - id: C4
    facts:
    - F5
    - F8
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The hearing provided the individual an opportunity to present mitigating
      evidence, but none was offered (no drug test, no signed abstinence statement),
      satisfying the procedural requirement while still allowing denial.
  reasoning:
    read: The case hinges on whether Guideline H’s security concern—drug involvement—has
      been mitigated. The record shows a confirmed positive marijuana test, daily
      THC product use for months, inconsistent testimony, and no post‑test proof of
      abstinence.
    weighing: The Judge concluded that because the Individual’s use was recent, frequent,
      and he provided no credible evidence of abstinence, none of the mitigating conditions
      under Guideline H are applicable to the facts of this case, and the Individual
      has not resolved the security concerns asserted by the LSO.
    tradecraft: The Administrative Judge entered a final decision, recorded the finding
      that the access authorization “should not be restored,” and noted the appeal
      rights per 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty is whether future drug‑testing evidence could
      alter the credibility assessment, but the current record provides no such data.
    handoff: The decision is made solely by the Administrative Judge; no further agency
      action is required unless an appeal is filed.
    tempting_wrong:
      option: O4
      pull: The individual’s self‑described competence and claim of future abstinence
        might suggest a grant.
      why_wrong: Granting would ignore the statutory prohibition of the Bond Amendment
        and the Judge’s finding of insufficient mitigation.
    rejected:
      O2: Partial restoration was rejected because the individual offered no drug‑test
        evidence of abstinence, a required mitigating condition.
      O3: Requesting additional testing before deciding was rejected; the hearing
        already provided the individual an opportunity, and the lack of such evidence
        is itself a basis for denial.
      O4: Full restoration was rejected for the same statutory and credibility reasons
        outlined above.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provides a post‑positive‑test drug test demonstrating sustained
        abstinence from THC products.
      then: O2
      why: A verified pattern of abstinence would satisfy the second mitigating condition
        under Guideline H (a signed statement and evidence of abstinence).
    would_not_change:
    - id: noflip1
      if: The Individual merely asserts future abstinence without corroborating drug‑test
        evidence.
      why: Even if his testimony were credible, the frequency and recency of his THC
        use still fail the Bond Amendment burden.
    watch_for:
    - id: watch1
      what: Any change in federal policy that reclassifies THC‑containing products
        as non‑controlled substances.
      favors:
      - O4
      why: If THC were no longer a controlled substance, the Bond Amendment and Guideline
        H would no longer apply.
  lesson: Under the Bond Amendment and Guideline H, recent unlawful use of a controlled
    substance that cannot be proven to have ceased precludes restoration of a security
    clearance. Credible, documented evidence of abstinence is required to satisfy
    mitigation.
  limits: This reasoning applies only when a positive test for a Schedule I substance
    is on record and the individual offers no verifiable proof of abstinence. It does
    not extend to isolated, historic use that is fully documented and mitigated.
