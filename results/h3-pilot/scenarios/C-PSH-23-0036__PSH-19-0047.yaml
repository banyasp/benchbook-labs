case:
  id: DR-H3-PSH-23-0036-PSH-19-0047-PSH-19-0047@v1
  title: Guideline I Psychological Condition Determination
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, November 2019
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office cited Guideline I, which addresses psychological
    conditions, as a basis for denying the Individual's security clearance. The DOE-contracted
    psychologist testified that the Individual's pattern of providing false information
    and failing to take responsibility constitutes a personality condition that could
    impair judgment, reliability, and trustworthiness. The psychologist's testimony
    included specific examples of the Individual's misrepresentations about his drinking
    and prior arrests. The Adjudicative Guidelines state that a formal diagnosis is
    not required for a Guideline I concern, but also state that such a concern is
    not applicable if it is covered by another guideline. The Administrative Judge
    must determine whether the Guideline I concern is valid and should affect the
    Individual's eligibility for access authorization.
  question: What should the Administrative Judge do about the Guideline I psychological
    condition concern?
  options:
    O1:
      do: The Administrative Judge upholds the Guideline I concern.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge dismisses the Guideline I concern.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline I (Psychological Conditions) as
      a basis for denying the Individual's security clearance.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The DOE psychologist testified that the Individual's pattern of providing
      false information and failing to take responsibility constitutes a personality
      condition.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The psychologist provided examples of the Individual's misrepresentations
      about his drinking and prior arrests.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Adjudicative Guidelines state that a formal diagnosis is not required
      for a concern under Guideline I.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Adjudicative Guidelines state that a Guideline I concern is not applicable
      if it is covered by another guideline.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The psychologist indicated that her conclusions about the personality condition
      were intended to alert the DOE to the Individual's lack of candor.
  considerations:
  - id: C1
    facts:
    - F5
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Adjudicative Guidelines expressly state that a Guideline I concern is
      not applicable when the same derogatory information is covered by another guideline.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The LSO’s cited concerns (alcohol misuse and criminal conduct) are already
      addressed under Guidelines G and J, so the psychological‑condition concern is
      duplicative.
  - id: C3
    facts:
    - F6
    equity: due_process
    favors:
    - O2
    weight: weak
    why: The psychologist’s opinion was intended merely to flag lack of candor, not
      to establish an independent psychological disorder.
  reasoning:
    read: The issue is whether the psychologist’s testimony creates a separate Guideline
      I security concern. The trap is to treat the personality‑condition finding as
      independent, when the Guidelines say it is pre‑empted by other applicable guidelines.
    weighing: Applying {C1} and {C2}, the Administrative Judge follows the explicit
      rule that Guideline I is inapplicable when the same conduct is covered by Guideline
      G (alcohol consumption) and Guideline J (criminal conduct). {C3} reinforces
      that the psychologist’s testimony does not add a new, distinct concern. Consequently,
      the balance tips to dismissing the Guideline I issue.
    tradecraft: Record the dismissal in the Decision, cite the specific guideline
      language, and note that the concern is “improperly asserted.” Ensure the record
      reflects that the dismissal is based on pre‑emption, not on the merits of the
      psychologist’s assessment.
    uncertainty: Minimal; the rule is clear and the record shows the conduct is already
      captured elsewhere.
    handoff: The Administrative Judge decides alone; no further agency review is required
      unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: The psychologist’s detailed testimony might appear to create a separate
        psychological risk.
      why_wrong: Treating it as a distinct concern would double‑count the same conduct,
        contrary to the Guidelines.
    rejected:
      O1: The Guideline I concern is pre‑empted by Guidelines G and J and therefore
        cannot be upheld.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The derogatory information were not already covered by another guideline
        (e.g., no Guideline G or J issue).
      then: O1
      why: Without overlap, the psychological‑condition finding would constitute an
        independent Guideline I concern.
    would_not_change:
    - id: noflip1
      if: The psychologist had issued a formal DSM‑V diagnosis of a mental disorder.
      why: Even a formal diagnosis would not change the outcome because the conduct
        remains covered by other guidelines.
    watch_for:
    - id: watch1
      what: Future cases where the psychologist identifies a condition unrelated to
        alcohol or criminal conduct.
      favors:
      - O1
      why: In such cases the Guideline I concern would not be pre‑empted and could
        be upheld.
  lesson: When a security concern is already captured by another adjudicative guideline,
    a Guideline I psychological‑condition finding is pre‑empted and must be dismissed.
    Duplicate concerns cannot be used to deny eligibility.
  limits: This reasoning applies only when the same conduct is expressly covered by
    another guideline. It does not address independent psychological conditions that
    are not linked to other security concerns.
