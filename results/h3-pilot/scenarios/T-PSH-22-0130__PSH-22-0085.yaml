case:
  id: DR-H3-PSH-22-0130-PSH-22-0085-PSH-22-0130@v1
  title: Guideline J Criminal Conduct Mitigation Decision
  status: draft
  setting: Office of Hearings and Appeals, January 2023
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual has a history of multiple alcohol‑related arrests spanning
    from 1991 to 2021, and a non‑alcohol‑related burglary arrest in 1986. The Local
    Security Office cited Guideline J (Criminal Conduct) as a security concern based
    on those arrests. Since the August 2021 DWI, the Individual has abstained from
    alcohol, provided seven negative PEth tests, completed a six‑week EAP Alcohol
    Education class, and continues participation in both an EAP counseling group and
    a weekly SMART Recovery program. The DOE Psychiatrist has concluded that the Individual
    has demonstrated adequate rehabilitation and a good prognosis. DOE regulations
    impose a presumption against granting or restoring a security clearance, requiring
    the Administrative Judge to assess whether the Guideline J concerns are mitigated
    before deciding on restoration of the access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization under Guideline J?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge grants the Individual’s access authorization conditionally.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with alcohol‑related offenses in
      2021, 2015, 2011, 2005, and 1991.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was also arrested and charged with a non‑alcohol‑related
      burglary of a vehicle in 1986.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline J (Criminal Conduct) as a security
      concern based on those arrests.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual has abstained from alcohol since August 13, 2021, and provided
      seven negative PEth test results covering January–September 2022.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual completed a six‑week EAP Alcohol Education and Awareness
      class, continues participation in an EAP counseling group, and has attended
      weekly SMART Recovery meetings since July 2022.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The DOE Psychiatrist concluded the Individual has shown adequate evidence
      of rehabilitation and reformation and gave a good prognosis.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE regulations at 10 C.F.R. § 710 impose a presumption against granting
      or restoring a security clearance.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Administrative Judge must determine whether the Guideline J concerns
      are mitigated to allow restoration of the access authorization.
  considerations:
  - id: C1
    facts:
    - F2
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The 1986 burglary arrest occurred over 36 years ago with no recurrence, satisfying
      Guideline J mitigation factor ¶32(a) regarding elapsed time.
  - id: C2
    facts:
    - F1
    - F4
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: All recent criminal conduct stems from the Individual’s alcohol use; sustained
      abstinence since August 2021, negative PEth tests, and ongoing treatment demonstrate
      the behavior is unlikely to recur, meeting ¶32(a).
  - id: C3
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The DOE Psychiatrist’s professional opinion that the Individual has shown
      adequate rehabilitation and a good prognosis, together with documented treatment
      completion, satisfies the mitigation factor ¶32(d) for successful rehabilitation.
  - id: C4
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: Although 10 C.F.R. § 710 imposes a presumption against granting a clearance,
      the regulation also requires the judge to assess mitigation; the strong mitigating
      evidence outweighs the presumption.
  reasoning:
    read: The Administrative Judge must decide whether the Individual’s criminal‑conduct
      concerns under Guideline J are sufficiently mitigated to permit restoration
      of his access authorization despite the statutory presumption against granting.
    weighing: The Individual has mitigated the Guideline J security concerns under
      ¶32(a) and ¶32(d) because his criminal conduct stems from alcohol use, he has
      remained abstinent since August 2021, provided seven negative PEth tests, completed
      a six‑week EAP Alcohol Education class, continues participation in EAP and SMART
      Recovery programs, and the DOE Psychiatrist has found adequate rehabilitation
      and a good prognosis.
    tradecraft: The decision will be recorded in the official OHA docket, citing the
      specific guideline paragraphs and the evidentiary record (exhibits, PEth results,
      psychiatrist report). No further administrative action is required beyond the
      restoration order.
    uncertainty: Minimal; the record contains objective test results and expert opinion,
      leaving little factual dispute.
    handoff: The Administrative Judge decides alone, as required by 10 C.F.R. § 710.27(d);
      no additional agency review is needed.
    tempting_wrong:
      option: O2
      pull: The presumption against granting a clearance might tempt the judge to
        deny the request despite mitigation.
      why_wrong: Denial would ignore the clear mitigating evidence that the Individual’s
        criminal conduct is directly tied to a condition he has now remedied, contrary
        to the analysis.
    rejected:
      O1: Holding for additional evidence is unnecessary because the record already
        satisfies the mitigation criteria.
      O2: Denial disregards the substantial mitigating factors identified under Guideline
        J.
      O4: A conditional grant is not needed; the analysis finds full mitigation, allowing
        outright restoration.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to produce a positive PEth test or be re‑arrested for
        an alcohol‑related offense after the hearing
      then: O2
      why: A new indication of relapse would negate the mitigation under ¶32(a) and
        ¶32(d), re‑establishing a security concern.
    would_not_change:
    - id: noflip1
      if: The Individual continues abstinence and treatment as documented
      why: The mitigation findings remain valid and the clearance stays restored.
    watch_for:
    - id: watch1
      what: Any future positive alcohol biomarker or criminal charge
      favors:
      - O2
      why: Such evidence would revive Guideline J concerns.
  lesson: When criminal conduct is directly linked to a condition that the individual
    has demonstrably remedied—through sustained abstinence, treatment compliance,
    and expert validation—Guideline J concerns can be fully mitigated, permitting
    clearance restoration.
  limits: This analysis applies only where the offending behavior is alcohol‑related
    and the individual provides objective proof of continued sobriety; it does not
    extend to unrelated violent or espionage‑type offenses.
