case:
  id: DR-H3-PSH-22-0102-PSH-22-0085-PSH-22-0085@v1
  title: Guideline J Criminal Conduct Mitigation Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office notified the Individual that security concerns
    existed under Guideline J because of a battery charge on November 2, 2021. The
    Individual had been drinking prior to the incident and had prior alcohol‑related
    arrests. Since the incident the Individual has been abstinent, completed most
    of an intensive outpatient program, enrolled in a regular outpatient program,
    and regularly attends AA meetings, with negative PEth and EtG tests documenting
    sobriety. The DOE Psychiatrist diagnosed him with Alcohol Use Disorder in early
    remission and noted the criminal conduct was linked to alcohol misuse. The Individual’s
    girlfriend testified that a restraining order was issued after the incident but
    later dismissed, and that he has not consumed alcohol since November 2021. The
    Administrative Judge must decide whether the criminal‑conduct concern under Guideline
    J is sufficiently mitigated to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s Guideline
    J security concern?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence
        of rehabilitation.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization
        immediately.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge asks the LSO for documentation of Individual’s
        conduct.
      move: ask
      irreversible: false
      to: LSO
    O4:
      do: The Administrative Judge denies the restoration of the Individual’s access
        authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged with Battery Against a Household Member and Criminal
      Damage to Property on November 2, 2021.
  - id: F2
    kind: situation
    status: assessed
    fact: The Individual admitted to consuming alcohol prior to the incident and reported
      drinking once or twice a month from August to November 2021.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline J (Criminal Conduct) as a basis
      for ineligibility because of the battery charge.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual has been abstinent from alcohol since November 3, 2021.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed 13 weeks of an intensive outpatient program, is
      enrolled in a regular outpatient program, and regularly attends AA meetings.
  - id: F6
    kind: situation
    status: confirmed
    fact: Negative phosphatidylethanol (PEth) tests from April to July 2022 and random
      EtG tests in December 2021 and February 2022 show no alcohol use.
  - id: F7
    kind: situation
    status: confirmed
    fact: The DOE Psychiatrist diagnosed the Individual with Alcohol Use Disorder,
      Moderate, in early remission and linked the criminal conduct to alcohol misuse.
  - id: F8
    kind: situation
    status: confirmed
    fact: A restraining order was issued after the incident but later dismissed, and
      the Individual’s girlfriend testified he has not consumed alcohol since November
      2021.
  - id: F9
    kind: situation
    status: confirmed
    fact: Guideline J mitigation criteria include elapsed time, lack of recurrence,
      and evidence of successful rehabilitation.
  considerations:
  - id: C1
    facts:
    - F4
    - F9
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Guideline J mitigation factor (a) is satisfied because sufficient time has
      elapsed since the battery incident and the conduct is unlikely to recur.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Individual has completed most of an intensive outpatient program, is
      enrolled in a regular outpatient program, attends AA regularly, and provides
      negative PEth and EtG tests, demonstrating successful rehabilitation.
  - id: C3
    facts:
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The DOE Psychiatrist diagnosed Alcohol Use Disorder in early remission and
      explicitly linked the criminal conduct to the Individual’s alcohol misuse, indicating
      that addressing the alcohol issue mitigates the conduct concern.
  - id: C4
    facts:
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: No further criminal activity has occurred; the restraining order was dismissed,
      showing the behavior has not recurred.
  - id: C5
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Regulatory guidance (Guideline J mitigation criteria) permits relief when
      elapsed time, lack of recurrence, and evidence of rehabilitation are present.
  reasoning:
    read: The security concern under Guideline J stems from a battery charge that
      was directly tied to the Individual’s alcohol misuse. The presumption against
      granting a clearance is offset by the source’s own analysis that the conduct
      was alcohol‑induced and that the Individual has taken substantial steps to remediate
      the underlying issue.
    weighing: The Administrative Judge applied the mitigating factors listed in the
      Adjudicative Guidelines. {C1} establishes that enough time has passed; {C2}
      provides concrete evidence of sustained sobriety and treatment; {C3} ties the
      conduct to the alcohol disorder, so eliminating the disorder removes the conduct
      risk; {C4} confirms no repeat offense; {C5} notes the regulatory allowance for
      mitigation. Collectively these considerations outweigh the initial concern,
      leading to restoration.
    tradecraft: The Judge will issue a written decision restoring the Individual’s
      access authorization, update the security file, and notify the Local Security
      Office and the Individual’s employer of the restored clearance.
    uncertainty: Low – the record contains multiple independent sources (psychiatric
      report, test results, testimony) confirming ongoing sobriety and rehabilitation.
    handoff: The decision is made solely by the Administrative Judge, as authorized
      by 10 C.F.R. § 710.7(a). No further agency action is required.
    tempting_wrong:
      option: O4
      pull: The longstanding presumption against granting clearances could tempt a
        denial despite mitigation.
      why_wrong: Denial would ignore the substantial evidence of rehabilitation and
        the explicit finding that the conduct was alcohol‑related and unlikely to
        recur.
    rejected:
      O1: Holding the decision pending additional evidence is unnecessary because
        the record already satisfies all mitigation criteria.
      O3: Requesting further documentation from the LSO would be redundant; the required
        evidence has already been provided.
      O4: Denial contradicts the Judge’s finding that the Guideline J concerns are
        mitigated.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to relapse to alcohol use and test positive on a subsequent
        PEth or EtG test
      then: O4
      why: A relapse would re‑activate the alcohol‑related risk and undermine the
        mitigation of the criminal conduct.
    - id: flip2
      if: New criminal conduct unrelated to alcohol were to occur
      then: O4
      why: Additional criminal behavior would create a fresh, unmitigated security
        concern under Guideline J.
    would_not_change:
    - id: noflip1
      if: Further documentation of the Individual’s past arrests is submitted
      why: The mitigating evidence already outweighs the historical arrests, so the
        decision to restore remains unchanged.
    watch_for:
    - id: watch1
      what: Any future positive alcohol test or evidence of renewed violent behavior
      favors:
      - O4
      why: Such evidence would indicate that the underlying risk has re‑emerged, warranting
        denial.
  lesson: When criminal conduct is directly linked to a substance‑use disorder, sustained
    abstinence, documented treatment, and the passage of time can satisfy Guideline
    J mitigation criteria, allowing restoration of access authorization. The adjudicative
    process must weigh concrete rehabilitation evidence against the presumption against
    clearance.
  limits: This reasoning applies only where the offending behavior is clearly tied
    to a treatable condition such as alcohol misuse and where the record shows continuous,
    verifiable sobriety. It does not extend to violent offenses unrelated to substance
    abuse or to cases lacking objective evidence of rehabilitation.
