case:
  id: DR-H3-PSH-22-0118-PSH-21-0031-PSH-21-0031@v1
  title: Guideline H Drug Use Clearance Determination
  status: draft
  setting: DOE Office of Hearings and Appeals, June 2021
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: A DOE contractor employee holds a position that requires a security clearance.
    The employee disclosed on a security questionnaire that she used marijuana edibles
    on two occasions while possessing a clearance. The Local Security Office raised
    substantial doubt about her eligibility under Guideline H and the Bond Amendment
    and issued a notification letter. DOE policy defines an unlawful user as a current
    user or someone who has lost self‑control, and an addict as a habitual user endangering
    public morals, health, safety, or welfare. The employee’s last use occurred in
    November 2017, and she has not used since, providing a signed statement of intent
    to abstain. Multiple witnesses testified they have not observed any loss of self‑control,
    current use, or association with drug users, and the employee disposed of the
    remaining edibles.
  question: What should the Administrative Judge do regarding the Individual’s security
    clearance under Guideline H and the Bond Amendment?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s security clearance.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further investigation.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge grants the Individual’s security clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is a DOE contractor employee in a position requiring a security
      clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual disclosed on a Questionnaire for National Security Positions
      that she used marijuana candies on two occasions while possessing a security
      clearance.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a Letter of Interrogatory and a Notification
      Letter stating substantial doubt about the Individual’s eligibility under Guideline
      H and the Bond Amendment.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Bond Amendment prohibits granting a security clearance to an unlawful
      user or addict of a controlled substance.
  - id: F5
    kind: authority
    status: confirmed
    fact: DOE’s new policy defines an unlawful user as a current user or a person
      who has lost self‑control, and an addict as a habitual user who endangers public
      morals, health, safety, or welfare.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual’s last marijuana use occurred in November 2017, more than
      three and a half years before the hearing, and she has not used since.
  - id: F7
    kind: capability
    status: confirmed
    fact: The Individual provided a signed statement of intent to abstain from illegal
      drug use dated September 2, 2020.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Witnesses, including the Individual’s spouse, a colleague, and a research
      colleague, testified they have not observed loss of self‑control, current drug
      use, or association with drug‑using individuals, and that the Individual disposed
      of the remaining edibles.
  - id: F9
    kind: capability
    status: confirmed
    fact: The Individual self‑disclosed the marijuana use on the security questionnaire
      and to the employer’s security officer before the hearing.
  - id: F10
    kind: authority
    status: confirmed
    fact: The Administrative Judge must determine whether the Bond Amendment bars
      the clearance and whether Guideline H concerns are mitigated under §§26(a) and
      (b).
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The DOE’s new policy defines an unlawful user as a current user or someone
      who has lost self‑control; the Individual’s last use was over three years ago
      and there is no evidence of loss of control, so the Bond Amendment does not
      bar a clearance.
  - id: C2
    facts:
    - F8
    - F10
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: Guideline H can be mitigated when the conduct was infrequent, long ago, and
      unlikely to recur; witnesses attest the Individual has not used drugs since
      and shows no loss of reliability.
  - id: C3
    facts:
    - F7
    - F9
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The Individual fully disclosed the drug use, provided a signed statement
      of intent to abstain, and demonstrated a pattern of abstinence, satisfying the
      §26(b) mitigation criteria.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: Witnesses corroborate the Individual’s self‑control and lack of association
      with drug users, reinforcing the factual basis for mitigation.
  reasoning:
    read: The case centers on whether historic, isolated marijuana use constitutes
      an unlawful user or addict under the Bond Amendment and whether Guideline H
      concerns are mitigated. The trap is to treat any illegal drug use as an automatic
      bar, ignoring the DOE’s updated definitions and mitigation framework.
    weighing: 'The Administrative Judge applied the Bond Amendment definition (C1)
      and found no current use or loss of self‑control. Then, under Guideline H, the
      Judge evaluated both mitigation prongs: the conduct’s age and rarity (C2) and
      the Individual’s admission, abstinence, disassociation, and intent statement
      (C3). Witness corroboration (C4) reinforced these findings. Because all statutory
      and policy criteria were satisfied, the balance tipped to granting the clearance.'
    tradecraft: The decision is recorded in the OHA administrative decision, citing
      the relevant CFR sections and DOE memorandum, and the judgment is entered into
      the personnel security database to restore the Individual’s access authorization.
    uncertainty: Minimal; the evidence is clear that the Individual has not used marijuana
      since 2017 and meets all mitigation requirements.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to resolve eligibility after the hearing.
    tempting_wrong:
      option: O1
      pull: A strict‑interpretation bias might suggest any illegal drug use automatically
        disqualifies the Individual.
      why_wrong: The DOE’s own policy expressly limits the unlawful‑user definition
        to current use or loss of self‑control; ignoring this would misapply the Bond
        Amendment.
    rejected:
      O1: Denied because the Bond Amendment does not apply to historic, isolated use
        without loss of self‑control.
      O2: Held pending because the record already provides sufficient evidence of
        mitigation; further investigation is unnecessary.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had used marijuana within the past year or demonstrated ongoing
        use.
      then: O1
      why: A recent or current use would meet the DOE definition of an unlawful user,
        making the Bond Amendment a bar.
    - id: flip2
      if: Evidence showed the Individual was habitually using marijuana and had lost
        self‑control.
      then: O1
      why: Habitual use would satisfy the ‘addict’ definition, also barring clearance.
    would_not_change:
    - id: noflip1
      if: The Individual continues to self‑disclose any future drug use promptly.
      why: Ongoing honesty maintains trustworthiness and does not alter the mitigation
        analysis.
    watch_for:
    - id: watch1
      what: Future cases where the individual’s drug use is more recent or involves
        a different controlled substance.
      favors:
      - O1
      why: More recent or different substance use could trigger the unlawful‑user
        definition.
  lesson: Under DOE policy, historic, isolated illegal drug use does not automatically
    bar a security clearance; the Bond Amendment applies only to current use or loss
    of self‑control, and Guideline H concerns can be mitigated by demonstrating abstinence,
    disassociation, and honest disclosure.
  limits: This analysis does not extend to ongoing drug use, habitual addiction, or
    use of other controlled substances that meet the ‘addict’ definition. It also
    assumes the individual continues to cooperate fully with security reporting requirements.
