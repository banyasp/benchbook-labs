case:
  id: DR-H3-PSH-23-0012-PSH-22-0085-PSH-23-0012@v1
  title: Mitigation of Guideline J (Criminal Conduct) for Access Authorization
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, February 2023
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual had been arrested and charged with Aggravated Driving
    While Intoxicated in February 2017 and again in April 2022 for a similar offense
    and leaving the scene of an accident. The 2022 criminal case was dismissed without
    prejudice in August 2022, and the Individual was placed on probation with conditions
    that prohibited alcohol consumption and required an ignition interlock. Since
    April 2022 the Individual has remained abstinent, submitting multiple negative
    EtG, PEth, and breath alcohol tests, and has participated in weekly SMART program
    sessions, one‑on‑one counseling, a twelve‑week employer‑sponsored education program,
    and Alcoholics Anonymous meetings. A DOE‑appointed psychologist diagnosed the
    Individual with moderate Alcohol Use Disorder but concluded the disorder is in
    remission and that the Individual has provided adequate evidence of rehabilitation.
    The Local Security Office invoked Guideline J (Criminal Conduct) as a security
    concern based on the arrests, and the Adjudicative Guidelines list mitigation
    factors such as elapsed time and successful rehabilitation.
  question: What should the Administrative Judge do regarding the Individual’s request
    to have his access authorization restored under Guideline J?
  options:
    O1:
      do: The Administrative Judge holds the decision for further abstinence evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual’s access authorization request.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with Aggravated Driving While Intoxicated
      in February 2017.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with Aggravated Driving While Intoxicated
      and Leaving the Scene of an Accident in April 2022.
  - id: F3
    kind: situation
    status: confirmed
    fact: The criminal matter was dismissed without prejudice in August 2022.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual was placed on probation with conditions including alcohol
      education, an ignition interlock device, and a prohibition on alcohol consumption.
  - id: F5
    kind: situation
    status: confirmed
    fact: Since April 2022 the Individual has abstained from alcohol and has submitted
      multiple negative EtG, PEth, and breath alcohol tests.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual has participated in weekly SMART program sessions, one‑on‑one
      counseling, a twelve‑week employer‑sponsored education program, and Alcoholics
      Anonymous meetings.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The DOE Psychologist diagnosed the Individual with moderate Alcohol Use
      Disorder but concluded the disorder is in remission and that the Individual
      has provided adequate evidence of rehabilitation.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Local Security Office invoked Guideline J (Criminal Conduct) as a security
      concern based on the arrests.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Adjudicative Guidelines list mitigation factors for Guideline J, including
      elapsed time, rehabilitation, and lack of recurrence.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F9
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The elapsed time since the last criminal incident and the individual's sustained
      abstinence demonstrate a low likelihood of recurrence, satisfying mitigation
      factor (a) for Guideline J.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Active participation in SMART, one‑on‑one counseling, employer‑sponsored
      education, and AA, together with consistently negative EtG, PEth, and breath
      tests, provide concrete evidence of rehabilitation.
  - id: C3
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The DOE‑appointed psychologist, a qualified professional, diagnosed the Individual’s
      AUD as in remission and affirmed adequate rehabilitation, a key mitigating factor
      under Guideline J.
  - id: C4
    facts:
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Local Security Office correctly invoked Guideline J, but the Adjudicative
      Guidelines expressly allow mitigation when rehabilitation and elapsed time are
      demonstrated, leading to restoration.
  reasoning:
    read: The case hinges on whether the Individual’s past alcohol‑related criminal
      conduct remains a security risk. Although two arrests occurred, the record shows
      sustained abstinence, extensive treatment, and professional affirmation of remission,
      which the Judge treats as sufficient mitigation under Guideline J.
    weighing: The Judge balances the seriousness of the arrests against the strong
      mitigating evidence (C1‑C4). The Individual’s abstinence, negative testing,
      and documented treatment satisfy the guideline’s mitigation criteria, outweighing
      the residual concern about prior conduct.
    tradecraft: The decision is recorded in the Administrative Judge’s written decision,
      citing the relevant CFR provisions and Adjudicative Guidelines, and the outcome
      is entered into the Individual’s Personnel Security File.
    uncertainty: Minimal; the psychologist’s assessment and objective test results
      leave little doubt about current sobriety, though future relapse could alter
      the analysis.
    handoff: The Administrative Judge decides alone, as the authority granted by 10
      C.F.R. § 710.25(d) allows the Judge to make the final determination after reviewing
      the record.
    tempting_wrong:
      option: O2
      pull: The instinct to deny because of the two arrests and the recent dismissal
        of the 2022 case.
      why_wrong: Denial would ignore the substantial evidence of rehabilitation and
        the psychologist’s conclusion that the disorder is in remission, contrary
        to the mitigation factors outlined in the Guidelines.
    rejected:
      O1: Holding for further evidence is unnecessary because the record already contains
        ample, credible evidence of rehabilitation.
      O2: Denial fails to recognize that the Adjudicative Guidelines permit clearance
        restoration when mitigation factors are met, which the source explicitly finds.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to test positive for alcohol consumption after the hearing
        (e.g., a positive EtG, PEth, or breath test).
      then: O2
      why: A positive test would indicate a relapse, negating the evidence of sustained
        abstinence and rehabilitation, thereby re‑establishing a security concern
        under Guideline J.
    would_not_change:
    - id: noflip1
      if: The Individual had not yet completed the full twelve‑month treatment recommendation
        at the time of the hearing.
      why: The psychologist testified that additional months would not be more persuasive;
        the clearance can be restored despite the incomplete period.
    watch_for:
    - id: watch1
      what: Any future positive alcohol test or new criminal charge related to alcohol.
      favors:
      - O2
      why: Such evidence would revive the security concerns under Guideline J.
  lesson: Demonstrated, documented rehabilitation and sustained abstinence can mitigate
    criminal‑conduct security concerns under Guideline J, allowing restoration of
    a clearance even after multiple alcohol‑related arrests.
  limits: This analysis applies only when the individual provides verifiable, ongoing
    evidence of sobriety and treatment; it does not extend to cases with ongoing substance
    abuse, lack of professional assessment, or new offenses.
