case:
  id: DR-H3-PSH-23-0055-PSH-19-0040-PSH-23-0055@v1
  title: Guideline F Financial Considerations – Access Authorization Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 2023
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: A DOE contractor employee required a security clearance but failed to
    file federal and state income tax returns for 2016‑2021. The Local Security Office
    raised a security concern under Guideline F, citing the failure to file taxes
    as a reliability issue. The employee later filed all delinquent returns in early
    2023 and submitted IRS and state documentation. He did not obtain financial counseling,
    extensions, or tax‑preparation help, and no corroborating evidence of his claimed
    learning disability was offered. Earlier assurances that he would file were not
    acted upon until months later. The Administrative Judge must decide whether the
    employee has mitigated the Guideline F concern and whether to restore his access
    authorization.
  question: What should the Administrative Judge do regarding the Individual’s access
    authorization?
  options:
    O1:
      do: The Administrative Judge asks the Local Security Office for more financial
        evidence.
      move: ask
      irreversible: false
    O2:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending review of the Individual’s
        financial records.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position requiring a
      security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual failed to file Federal and State personal income tax returns
      for the years 2016 through 2021.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline F of the Adjudicative Guidelines
      as the basis for denying the Individual’s security clearance.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual filed all delinquent Federal and State tax returns for 2016‑2021
      in February 2023, providing IRS transcripts and state filing screenshots.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual did not seek financial counseling, extensions, or tax‑preparation
      assistance for the delinquent years.
  - id: F6
    kind: situation
    status: confirmed
    fact: No corroborating evidence of the Individual’s learning disability severity
      was presented.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual assured investigators in June 2022 and November 2022 that
      he would file taxes, but did not do so until February 2023.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Individual failed to file Federal and State tax returns for six consecutive
      years, demonstrating a pattern of non‑compliance that the Adjudicative Guidelines
      identify as a reliability and trustworthiness concern under Guideline F.
  - id: C2
    facts:
    - F2
    - F4
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 'The record shows none of the mitigating factors listed in § 710.7(c)¶ 20
      (a)–(g) are satisfied: the behavior was recent, frequent, not beyond the Individual’s
      control, and no counseling or credible disability evidence was provided.'
  - id: C3
    facts:
    - F5
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual did not seek financial counseling or extensions, and offered
      no corroborating documentation of his claimed learning disability, undermining
      the credibility of his mitigation arguments.
  - id: C4
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Although the Individual eventually filed the delinquent returns in February 2023,
      the filing occurred only after the clearance suspension and does not erase the
      extended period of non‑filing.
  - id: C5
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline F expressly makes failure to file tax returns a disqualifying condition
      unless adequately mitigated; the LSO’s reliance on this guideline is a binding
      regulatory standard.
  reasoning:
    read: The Individual’s long‑standing failure to file tax returns creates a substantial
      doubt regarding his reliability and trustworthiness under Guideline F, and the
      recent filing does not eliminate that doubt.
    weighing: Considering {C1} and {C2}, the Administrative Judge found the six‑year
      non‑filing pattern and the absence of any mitigating factor under ¶ 20(a)–(g)
      to be decisive. {C3} reinforces the lack of remedial steps such as counseling,
      while {C4} notes that the belated filing does not erase the prior conduct. {C5}
      anchors the decision in the binding Guideline F requirement. The balance therefore
      tips firmly toward denial.
    tradecraft: The Judge records the decision in the official OHA docket, cites the
      specific regulatory provisions (10 C.F.R. § 710.7(c) and the Adjudicative Guidelines),
      and issues a written decision stating that the clearance will not be restored.
    uncertainty: Minimal; the source’s analysis is explicit and leaves little room
      for alternative interpretations.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      judge sole authority to resolve the security‑clearance eligibility question.
    tempting_wrong:
      option: O4
      pull: The Individual’s recent filing of all delinquent returns could appear
        to remediate the issue.
      why_wrong: The source explains that the filing occurred only after the clearance
        was suspended and does not satisfy the mitigating‑factor criteria; the underlying
        pattern remains unaddressed.
    rejected:
      O1: The record already contains sufficient evidence; further financial evidence
        would not change the conclusion.
      O3: Holding the decision pending adds no value because the mitigating factors
        are demonstrably absent.
      O4: Granting restoration ignores the unresolved Guideline F concerns identified
        in the analysis.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual had received financial counseling from a legitimate source
        and provided documentation of that counseling
      then: O4
      why: Factor ¶ 20(c) would then be satisfied, providing a credible mitigating
        circumstance.
    - id: flip2
      if: the Individual could produce corroborated medical evidence that his learning
        disability prevented timely filing
      then: O4
      why: Factor ¶ 20(b) would be met, showing the behavior was beyond his control.
    would_not_change:
    - id: noflip1
      if: the Individual had filed the delinquent returns earlier but still lacked
        counseling or disability documentation
      why: The lack of mitigating factors would remain, so the denial stands.
    watch_for:
    - id: watch1
      what: future claimants asserting a learning disability without supporting documentation
      favors:
      - O2
      why: The Individual’s disability claim was unsubstantiated and therefore not
        a valid mitigation.
  lesson: Under Guideline F, a multi‑year failure to file tax returns creates a serious
    reliability concern; mitigation requires timely corrective action, credible counseling,
    or documented circumstances beyond the individual's control. Late filing alone
    does not satisfy the mitigating‑factor analysis.
  limits: This reasoning applies only to personnel‑security clearance determinations
    governed by DOE 10 C.F.R. § 710 and the Adjudicative Guidelines. It does not extend
    to civil tax‑enforcement actions or to other agencies with different mitigation
    standards.
