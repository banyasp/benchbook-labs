case:
  id: DR-H3-PSH-26-0083-PSH-26-0050-PSH-26-0050@v1
  title: Guideline G Alcohol Consumption Concern – PEth Evidence
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, July 31 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor, had his security clearance suspended
    after an open‑container arrest on June 2 2025 and a psychologist’s diagnosis of
    Alcohol Use Disorder, Moderate, with a positive PEth test indicating heavy drinking.
    He previously completed a 12‑week intensive outpatient program in April 2024 and
    attended aftercare for a year, providing documentation of those efforts. He later
    submitted two negative PEth tests in May and June 2026, but also admitted drinking
    during a vacation in October 2025 and again in December 2025. The psychologist
    recommended inpatient treatment or 24 months of negative PEth tests, which the
    Individual has not fulfilled. The Local Security Office raised Guideline G concerns
    (alcohol‑related incidents, binge drinking, and diagnosis). The Administrative
    Judge must decide whether the Guideline G concerns are mitigated enough to restore
    the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s Guideline
    G security concern based on the PEth evidence and other facts?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional PEth testing.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested on June 2 2025 for an open‑container alcohol
      violation.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: A DOE consultant psychologist concluded in November 2025 that the Individual
      meets DSM‑5 criteria for Alcohol Use Disorder, Moderate, and habitually binge
      consumes alcohol to the point of impaired judgment.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The psychologist ordered a PEth test that returned a positive result of
      276 ng/mL, indicating heavy alcohol consumption in the prior two to four weeks.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual completed a 12‑week intensive outpatient program in April
      2024 and attended aftercare weekly for twelve months, with documentation of
      completion.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual submitted two negative PEth tests taken on May 6 2026 and
      June 5 2026.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual reported abstinence since February 25 2024 except for one
      beer on June 2 2025, but later admitted drinking during an October 2025 vacation
      and again in December 2025.
  - id: F7
    kind: authority
    status: confirmed
    fact: The psychologist recommended inpatient treatment or twenty‑four consecutive
      months of negative PEth tests, which the Individual has not completed.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline G (alcohol‑related
      incident, binge consumption, and diagnosis).
  - id: F9
    kind: authority
    status: confirmed
    fact: Regulations impose a presumption against granting or restoring a security
      clearance unless concerns are mitigated.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The LSO’s security concerns under Guideline G are substantiated by the June
      2025 open‑container arrest, the psychologist’s diagnosis of Alcohol Use Disorder,
      and the positive PEth test indicating heavy drinking.
  - id: C2
    facts:
    - F1
    - F6
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Mitigating condition (a) – sufficient time elapsed or unusual circumstances
      – does not apply because the Individual has repeated alcohol‑related incidents
      within a short period, showing a likelihood of recurrence.
  - id: C3
    facts:
    - F5
    - F7
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Mitigating condition (b) – a clear, established pattern of abstinence – is
      unmet; only two negative PEth tests in 2026 are far short of the 24‑month negative‑test
      regimen the psychologist required.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The psychologist’s recommended remediation (inpatient treatment or 24 months
      of negative PEth tests) has not been completed, so the security concern remains
      unmitigated.
  - id: C5
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulations impose a presumption against granting or restoring a clearance
      unless the LSO’s concerns are fully mitigated; this presumption is not overcome
      here.
  reasoning:
    read: The Individual’s record shows a diagnosed Alcohol Use Disorder, a 2025 open‑container
      arrest, a positive PEth biomarker, and subsequent limited negative tests, but
      no completion of the psychologist’s remediation plan. The core issue is whether
      these facts satisfy any of the Guideline G mitigating conditions.
    weighing: 'Each consideration weighted strong by the source: the documented incident,
      diagnosis, and biomarker evidence satisfy Guideline G concerns (C1). The Individual
      has not demonstrated the passage of time, abstinence pattern, or treatment completion
      required by mitigating conditions (C2‑C4). The statutory presumption against
      restoration (C5) therefore remains controlling. The balance, as the Administrative
      Judge stated, leads to a denial.'
    tradecraft: The Judge records the decision in the official OHA decision, cites
      the relevant CFR provisions, and notifies the Individual of the denial and appeal
      rights per 10 C.F.R. § 710.28.
    uncertainty: Minimal; the record provides clear evidence of unresolved Guideline G
      concerns.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.25(d)‑(g).
    tempting_wrong:
      option: O2
      pull: Two recent negative PEth tests might suggest recent sobriety.
      why_wrong: The source emphasizes that isolated negative tests do not satisfy
        the mandated 24‑month negative‑test regimen or inpatient treatment requirement;
        thus the underlying security risk remains.
    rejected:
      O1: Holding the decision pending further testing is unnecessary because the
        record already shows the Individual has not met any mitigating condition.
      O2: Restoring the clearance would ignore the unresolved Guideline G concerns
        and the regulatory presumption against restoration.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual completes twenty‑four consecutive months of negative PEth
        tests.
      then: O2
      why: This would satisfy mitigating condition (b) – a clear, established pattern
        of abstinence – and remove the security concern.
    - id: flip2
      if: The Individual completes the inpatient treatment program recommended by
        the psychologist.
      then: O2
      why: Completion of the recommended treatment would satisfy mitigating condition
        (d) and demonstrate reformation.
    would_not_change:
    - id: noflip1
      if: The Individual provides only additional negative PEth tests without completing
        the full 24‑month series or inpatient treatment.
      why: Isolated negative tests do not meet the mitigation standards set by the
        psychologist and the adjudicative guidelines.
    watch_for:
    - id: watch1
      what: Any future positive PEth result or new alcohol‑related incident.
      favors:
      - O3
      why: A positive biomarker or incident would reaffirm the unresolved Guideline G
        risk.
  lesson: Under Guideline G, a security clearance cannot be restored unless the individual
    satisfies a specific mitigating condition—such as a sustained abstinence record
    or completion of recommended treatment—because the presumption against clearance
    remains until the risk is fully mitigated.
  limits: This reasoning applies only to alcohol‑related security concerns under the
    DOE adjudicative guidelines; it does not address other eligibility factors (e.g.,
    financial or foreign influence) that might independently affect clearance decisions.
