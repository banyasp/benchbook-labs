case:
  id: DR-H3-PSH-22-0114-PSH-18-0025-PSH-22-0114@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, November 15 2022
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Administrative Judge must determine whether to restore the Individual’s
    access authorization under DOE regulations. The Individual, a DOE contractor employee,
    has a history of multiple alcohol‑related arrests spanning from 2002 to 2021,
    including DUI and assault charges. A DOE‑appointed psychiatrist diagnosed the
    Individual with mild Alcohol Use Disorder in early remission and noted binge drinking
    that impaired judgment. A PEth test taken in March 2022 was positive, contradicting
    the Individual’s self‑report of minimal drinking, while later tests through September
    2022 were negative. The Individual has attended Alcoholics Anonymous meetings
    since August 2022 but lacks a sponsor and cannot identify the program’s steps.
    The Local Security Office has raised a security concern under Guideline G, and
    the Judge must weigh mitigating factors such as time elapsed, treatment participation,
    and the psychiatrist’s fair prognosis.
  question: What should the Administrative Judge do about restoring the Individual’s
    access authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge holds the decision pending further evidence of
        sustained abstinence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Individual holds a DOE security clearance and is employed by a DOE contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual has been arrested multiple times for alcohol‑related offenses,
      including DUI in 2002 and 2009, domestic violence in 2004, felony assault in
      2005, and assault and related charges in September 2021.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: A DOE psychiatrist diagnosed the Individual with Alcohol Use Disorder, mild,
      in early remission and concluded the Individual binge‑consumed alcohol to the
      point of impaired judgment.
  - id: F4
    kind: capability
    status: confirmed
    fact: A phosphatidylethanol (PEth) test taken on March 3 2022 was positive at
      77 ng/mL, indicating recent alcohol consumption despite the Individual’s claim
      of only two beers.
  - id: F5
    kind: capability
    status: confirmed
    fact: PEth tests in June, July, August, and September 2022 were negative, and
      EtG urine tests from July 25 to October 6 2022 were negative, showing abstinence
      during that period.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual has regularly attended Alcoholics Anonymous meetings since
      August 24 2022 but does not have a sponsor and cannot name the twelve steps
      he claims to have completed.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The DOE psychiatrist opined that the Individual’s prognosis is “fair” and
      that he has not yet established rehabilitation, noting the lack of a sponsor
      and prior relapse after abstinence.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline G, citing
      the Individual’s alcohol‑related arrests and the psychiatrist’s diagnosis.
  - id: F9
    kind: authority
    status: confirmed
    fact: Guideline G mitigation criteria include elapsed time, acknowledgment and
      treatment, participation in counseling, and completion of a treatment program.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F8
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The LSO’s security concern under Guideline G is not mitigated because only
      about seven months have elapsed since the last alcohol consumption, which the
      Judge found insufficient to dispel doubts about reliability.
  - id: C2
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual has not completed the recommended treatment program nor obtained
      an AA sponsor, failing mitigation condition (d) of Guideline G.
  - id: C3
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: A positive PEth test in March 2022 demonstrates recent alcohol consumption
      contrary to the Individual’s self‑report, indicating ongoing misuse.
  - id: C4
    facts:
    - F2
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The record shows a pattern of alcohol‑related arrests and prior relapse after
      periods of abstinence, supporting the conclusion that the Individual’s judgment
      remains compromised.
  reasoning:
    read: The Judge must decide whether the security concern under Guideline G is
      resolved. Although recent tests are negative, the record shows a long history
      of alcohol‑related incidents, a recent positive PEth test, and incomplete treatment,
      creating a persistent doubt about reliability.
    weighing: The Judge applied the Adjudicative Guidelines, finding that none of
      the four mitigation criteria were satisfied (insufficient time, no sponsor,
      no completed program, and ongoing risk). Consequently, the balance of evidence
      favors denial, as articulated in the decision.
    tradecraft: The decision is recorded in the Administrative Judge’s formal Decision,
      citing the relevant regulations and guidelines, and is subject to appeal under
      10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty concerns the exact duration of abstinence
      required; however, the Judge explicitly stated that seven months is too brief,
      removing ambiguity for this case.
    handoff: The Administrative Judge decides alone, as the regulations grant the
      Judge sole authority to resolve the security concern after the hearing.
    tempting_wrong:
      option: O3
      pull: Recent negative alcohol tests and AA attendance might suggest rehabilitation.
      why_wrong: Without meeting the explicit mitigation conditions—especially a sponsor
        and a year of documented abstinence—the security concern remains unresolved.
    rejected:
      O1: Holding the decision pending would ignore the clear regulatory standard
        that the burden of proof lies with the Individual to demonstrate mitigation,
        which he has not met.
      O3: Granting restoration would contravene Guideline G because the required mitigation
        criteria are not satisfied.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual had completed a full treatment program with an AA sponsor
        and demonstrated at least one year of sustained abstinence
      then: O3
      why: All four mitigation criteria of Guideline G would be satisfied, removing
        the security concern.
    would_not_change:
    - id: noflip1
      if: further negative alcohol tests are presented but the elapsed abstinence
        period remains under one year
      why: The Judge explicitly stated that the seven‑month period is insufficient
        to resolve the concern.
    watch_for:
    - id: watch1
      what: any new alcohol‑related arrest or a positive alcohol biomarker test
      favors:
      - O2
      why: Such evidence would reinforce the finding that the Individual’s reliability
        remains compromised.
  lesson: Under DOE Guideline G, an access authorization can be restored only when
    the individual satisfies a specific mitigation condition—such as a substantial
    period of abstinence combined with completed treatment and sponsor support—otherwise
    the security concern persists.
  limits: This analysis applies solely to security clearance determinations governed
    by Guideline G; it does not extend to other adjudicative guidelines or non‑security
    personnel matters.
