    domain: personnel security adjudication
    family: H3-PSH-23-0036-PSH-19-0047-PSH-23-0036
    source: https://www.energy.gov/sites/default/files/2023-03/PSH-23-0036.pdf
    episode_focus: 'The Guideline I (Psychological Conditions) security concern: whether
      the Individual has resolved or mitigated it, so that access authorization can
