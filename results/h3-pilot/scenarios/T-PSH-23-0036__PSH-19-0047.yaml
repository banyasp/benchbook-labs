      option_words:
        O1: 9
        O2: 9
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
verdict_tier: source-endorsed
basis: The Administrative Judge concluded that the LSO had not shown an opinion by
  a duly qualified mental‑health professional that the individual has a condition
  that may impair judgment, stability, reliability, or trustworthiness, and therefore
  the Guideline I concern is resolved.
