  \ fact: \"The plan was discussed only on this channel; any warning that reaches her before tomorrow will very likely tell\
  \ the group the channel is collected.\"}\n  - {id: LIVE-F10, kind: intelligence, status: assessed, fact: \"If the channel\
  \ goes dark, access could be regained within months through a second route.\"}\noptions:\n  LIVE-O1: \"Pass the threat to\
