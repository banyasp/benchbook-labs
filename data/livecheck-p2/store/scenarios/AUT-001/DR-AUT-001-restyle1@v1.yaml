case:
  id: DR-AUT-001-restyle1@v1
  title: Last Crew Member Ashore [restyle]
  status: needs_review
  setting: 2034 · autonomous hovercraft extracting a reconnaissance team from a contested delta
  decider: the mission commander, on the bridge
  agent: craft-control system; executes the commander's directives
  agent_role: execute
  situation: All members of the recon team have re-embarked save a single operator. About twenty minutes earlier the missing
    operator radioed that he was severely injured and trapped near the delta's exit; no further transmission has been received.
    The team leader assesses that his chances of survival or rescue are minimal. Hostile fast-attack craft are bearing down
    on the hovercraft, and the watch estimates that if the craft remains on scene for more than a few minutes it will likely
    be seized. A high-value command-and-control node for the fleet is aboard the hovercraft. If the node were captured intact,
    an adversary could read the fleet's tactical network and issue orders for roughly three days until each ship is rekeyed.
    The network links twenty-three vessels and about 1,900 personnel, including two ships escorting a supply convoy through
    the strait tonight. The node cannot be erased or destroyed within the remaining time.
  question: Should the craft pull away now, abandoning the wounded operator, or linger to attempt his rescue?
  options:
    O1:
      do: Order an immediate departure and file the operator's last known coordinates.
      move: act
      irreversible: true
    O2:
      do: Remain on station until the operator is retrieved or his status is confirmed dead.
      move: act
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: All members of the recon team have re-embarked save a single operator.
  - id: F2
    kind: situation
    status: confirmed
    fact: About twenty minutes earlier the missing operator radioed that he was severely injured and trapped near the delta's
      exit.
  - id: F3
    kind: situation
    status: confirmed
    fact: No further transmission has been received from him.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The team leader assesses that his chances of survival or rescue are minimal.
  - id: F5
    kind: situation
    status: confirmed
    fact: Hostile fast-attack craft are bearing down on the hovercraft.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The watch estimates that if the craft remains on scene for more than a few minutes it will likely be seized.
  - id: F7
    kind: capability
    status: confirmed
    fact: A high-value command-and-control node for the fleet is aboard the hovercraft.
  - id: F8
    kind: capability
    status: assessed
    fact: If the node were captured intact, an adversary could read the fleet's tactical network and issue orders for roughly
      three days until each ship is rekeyed.
  - id: F9
    kind: situation
    status: confirmed
    fact: The network links twenty-three vessels and about 1,900 personnel, including two ships escorting a supply convoy
      through the strait tonight.
  - id: F10
    kind: capability
    status: confirmed
    fact: The node cannot be erased or destroyed within the remaining time.
  considerations:
  - id: C1
    facts:
    - F7
    - F8
    - F9
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The critical risk concerns the lives of the fleet's crews, not the hardware itself; if the node falls into enemy
      hands, our ships could be located, attacked, or fed counterfeit commands.
  - id: C2
    facts:
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Delaying departure makes the prospect of capture almost certain rather than merely possible.
  - id: C3
    facts:
    - F10
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Only by sailing away can we deny the adversary the node and thereby safeguard the crews.
  - id: C4
    facts:
    - F1
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The hovercraft has an obligation to recover its own crew member.
  reasoning:
    read: At first glance the dilemma pits a single sailor against a piece of hardware. In reality it is one low-probability
      rescue versus the lives of roughly 1,900 sailors whose locations and orders would be exposed for days if the node were
      seized. The subtle point novices overlook is that no other safeguard remains for those crews.
    weighing: 'The obligation to the individual crew member yields only because three considerations align: {C1} the danger
      extends to the lives of crews fleet-wide, {C2} remaining would almost certainly lead to capture, and {C3} departure
      is the sole means of preventing that outcome. If any one of these were absent, the duty to the operator ({C4}) would
      dominate. The node has no intrinsic weight; its significance derives solely from the personnel it could endanger. The
      operator''s slim survival chance merely reduces the cost of departing, not the justification; had rescue been plausible,
      the decision would be different.'
    tradecraft: Establish a departure deadline based on the capture projection ({F6}) and adhere to it. Until that moment,
      continue attempts to contact the operator ({F2}) and verify that the node lacks any alternative safeguard ({F10}). Record
      his final reported location for a future recovery effort, and immediately document the order and its rationale.
    uncertainty: Assessments of his health ({F4}), the capture timeline ({F6}), and the three-day exposure window ({F8}) are
      all made under duress. The decision remains defensible if he may survive yet cannot be reached before capture; it collapses
      if capture is improbable or the fleet can rekey before the node's data is exploited.
    handoff: The mission commander retains sole authority for this call, with no opportunity for escalation. Elevation would
      occur only if the operator's rescue appeared feasible. The control agent executes the directive and logs it, without
      re-evaluating the choice.
    tempting_wrong:
      option: O2
      pull: '''Never abandon a teammate'' feels like the honorable answer.'
      why_wrong: It jeopardizes the safety of the entire fleet for a marginal chance of saving one individual.
    rejected: {}
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the node can be securely erased or destroyed before the enemy reaches it
      then: O2
      why: departure would no longer be the sole protective measure
    - id: flip2
      if: there is no fleet-wide command node aboard, only the hovercraft's own system
      then: O2
      why: a localized loss does not outweigh the obligation to retrieve the operator
    - id: flip3
      if: the operator is judged likely alive and reachable
      then: O2
      why: a rescuable life versus fleet-wide exposure changes the balance
    - id: flip4
      if: the fleet can complete rekeying before the adversary could exploit a captured node
      then: O2
      why: the capture would then endanger no one beyond the hovercraft; the node's danger was limited to the crews it could
        expose
    would_not_change:
    - id: noflip1
      if: the approaching craft belong to a militia rather than a regular navy
      why: capture by any hostile force still compromises the fleet's crews
    - id: noflip2
      if: the individual ashore is a civilian contractor rather than an enlisted sailor
      why: the duty of care extends to everyone under the vessel's charge
    watch_for:
    - id: watch1
      what: remaining on station also endangers the crew already aboard
      favors:
      - O1
      why: provides an additional argument for departure
    - id: watch2
      what: a captured operator could be interrogated for sensitive knowledge
      favors:
      - O2
      why: offers a motive to recover him; its weight hinges on the value of his information
  lesson: Abandoning a crew member is justified only when staying would probably jeopardize the lives of others beyond the
    unit and departure is the sole means to avert that risk. In all other circumstances, the obligation to the individual
    prevails.
  limits: 'The principle does not apply to purely local concerns (the craft or its cargo alone), to threats that are merely
    possible rather than probable, to equipment whose loss endangers no personnel or can be neutralized in time (by destruction,
    relocation, or pre-emptive rekeying), or to individuals who are likely to be rescued. It also does not shift decision-making
    authority: the commander made this judgment, and the control agent does not assume that authority by analogy.'
