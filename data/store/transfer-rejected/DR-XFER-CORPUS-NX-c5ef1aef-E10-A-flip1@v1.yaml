case:
  id: DR-XFER-CORPUS-NX-c5ef1aef-E10-A-flip1@v1
  title: Honest Errors on Clearance Questionnaires
  status: draft
  setting: United States federal personnel-security system, during a congressionally chartered commission's review in 2024;
    the Security Clearance Review Commission and the security executive agent.
  decider: The Commission
  agent: The Commission
  agent_role: decide
  situation: The Commission is reviewing how the federal security-clearance system handles discrepancies on lengthy background
    questionnaires and ordinary foreign contacts. Adjudicators currently refer questionnaire omissions for possible false-statement
    prosecution. The forms ask many questions covering different look-back periods, and discrepancy records include wrong
    dates and forgotten trips. The Commission's review includes the existing criminal laws and the executive agent's administrative
    adjudication procedures. Its immediate task is only to obtain an enforcement standard from the security executive agent
    before selecting a treatment for these cases.
  question: What should the Commission do as its immediate next step regarding the security executive agent's treatment of
    technical or inadvertent questionnaire errors and innocent foreign contacts?
  options:
    O1:
      do: The Commission should ask the security executive agent to draft an enforcement standard for technical questionnaire
        errors and innocent foreign contacts.
      move: ask
      irreversible: false
      to: The security executive agent
    O2:
      do: The Commission should recommend that the security executive agent treat technical or inadvertent questionnaire errors
        and innocent foreign contacts as presumptive false statements for criminal referral.
      move: act
      irreversible: false
    O3:
      do: The Commission should recommend that the security executive agent treat technical or inadvertent questionnaire errors
        and innocent foreign contacts as administrative matters for correction and adjudication.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Commission endorses retaining criminal law for deliberate concealment in the clearance process and espionage.
  - id: F2
    kind: situation
    status: confirmed
    fact: The background questionnaire contains more than 100 questions, with look-back periods that vary by topic and extend
      as long as ten years.
  - id: F3
    kind: situation
    status: confirmed
    fact: A review of 1,140 discrepancy referrals logged examples including incorrect dates and omitted foreign trips.
  - id: F4
    kind: situation
    status: confirmed
    fact: Routine social and professional foreign contacts accounted for 390 requests for clarification in the reviewed records.
  - id: F5
    kind: authority
    status: confirmed
    fact: The security executive agent's procedures permit applicants to correct questionnaire entries and adjudicators to
      resolve eligibility administratively.
  - id: F6
    kind: situation
    status: confirmed
    fact: The median time to close a simple administrative correction was 45 days, compared with 14 months for a case referred
      for possible prosecution.
  - id: F7
    kind: authority
    status: confirmed
    fact: Adjudication guidance requires decision-makers to document an applicant's explanation and evidence bearing on candor
      when resolving a questionnaire discrepancy.
  - id: F8
    kind: situation
    status: confirmed
    fact: An annual review of 300 completed discrepancy cases recorded 112 eligibility grants following clarification and
      28 cases with documented intentional concealment.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Commission's immediate task is limited to obtaining an enforcement standard from the security executive agent
      before selecting a treatment for these cases.
  considerations:
  - id: C1
    facts:
    - F1
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Retaining criminal law for deliberate concealment and espionage provides an important boundary for the enforcement
      standard the Commission is currently seeking.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F9
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The questionnaire's length and varied look-back periods, along with recorded technical discrepancies and routine
      foreign contacts, are relevant matters for the requested standard to address before a treatment is selected.
  - id: C3
    facts:
    - F5
    - F6
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The executive agent has an administrative correction and adjudication route, and simple corrections can be resolved
      more quickly through it than through criminal referral; these procedures are relevant to the standard the Commission
      is asking the agent to draft.
  - id: C4
    facts:
    - F7
    - F8
    - F9
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The record includes both applicants who receive eligibility after clarification and cases with documented intentional
      concealment, so the requested standard should account for explanations and evidence bearing on candor.
  reasoning:
    read: The issue is the Commission's immediate next step, not its final choice of treatment. The trap is to mistake asking
      for an enforcement standard before selecting a treatment for either presumptively criminal treatment or a settled recommendation
      for administrative handling.
    weighing: The Commission's immediate task is only to obtain an enforcement standard before selecting a treatment {F9},
      so it should ask the security executive agent to draft that standard {O1}. The standard can preserve criminal law for
      deliberate concealment and espionage {C1}, address the questionnaire's technical errors and ordinary foreign contacts
      {C2}, account for available administrative procedures and their timing {C3}, and require attention to explanations and
      evidence bearing on candor {C4}. Those substantive considerations can inform the standard without prematurely selecting
      a treatment.
    tradecraft: Ask the security executive agent to draft an enforcement standard that accounts for the Commission's retained
      criminal-law position, the possibility of technical errors and innocent contacts, administrative correction procedures,
      and evidence bearing on candor. The Commission can select a treatment after obtaining the standard.
    uncertainty: The record does not specify detailed criteria for distinguishing inadvertent discrepancies from deliberate
      concealment or prescribe particular administrative measures.
    handoff: The Commission should ask the security executive agent to draft the standard before the Commission selects a
      treatment for these cases.
    tempting_wrong:
      option: O3
      pull: Administrative correction and adjudication may seem appropriate for technical errors and innocent contacts.
      why_wrong: That may inform the eventual standard, but the Commission's immediate task is only to obtain the standard
        before selecting a treatment.
    rejected:
      O2: It would select presumptive criminal referral before the requested standard is obtained.
      O3: It would select administrative treatment before the requested standard is obtained.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Commission's immediate task were not limited to obtaining an enforcement standard from the security executive
        agent before selecting a treatment, and it were ready to select the treatment.
      then: O3
      why: Without that sequencing constraint, the original recommendation for administrative treatment of technical or inadvertent
        errors and innocent contacts would be appropriate.
    would_not_change:
    - id: noflip1
      if: The questionnaire remains complex and technical or inadvertent discrepancies remain possible.
      why: Those circumstances support including protections for technical errors in the requested standard.
    watch_for: []
  lesson: When the immediate task is only to obtain an enforcement standard before selecting a treatment, ask the responsible
    agency to draft that standard. It can account for technical mistakes, innocent contacts, administrative procedures, and
    the distinction between inadvertence and deliberate concealment.
  limits: This immediate step concerns obtaining a standard for technical or inadvertent questionnaire errors and innocent
    foreign contacts; it does not select the ultimate treatment or remove criminal law for deliberate concealment or espionage.
    The record does not provide detailed criteria or administrative measures.
  library:
    domain: personnel security
    family: XFER-CORPUS-NX-c5ef1aef
    source: transfer of DR-CORPUS-NX-c5ef1aef-E10@v1
    episode_focus: The report supports retaining laws against bribery and corrupt practices while shifting technical or inadvertent
      disclosure errors and innocent private-sector contacts away from presumptive criminal treatment. Focus on the enforcement
      standard and the stated aim of clearing innocent officials while pursuing wrongdoers; exclude the separate choices about
      divestiture and post-employment restrictions.
    equities: pilot2
