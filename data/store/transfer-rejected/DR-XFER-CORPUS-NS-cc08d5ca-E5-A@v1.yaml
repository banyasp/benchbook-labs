case:
  id: DR-XFER-CORPUS-NS-cc08d5ca-E5-A@v1
  title: Isolating a Compromised Enclave
  status: draft
  setting: A joint command's cyber-defense organization; during an active incident involving a classified network enclave;
    the approved incident-response plan governs the decision.
  decider: The Network-Defense Commander
  agent: The Network-Defense Commander
  agent_role: decide
  situation: The approved incident-response plan names the Network-Defense Commander as the authority to isolate a classified
    network enclave. The enclave carries force-protection reporting for deployed units. The plan's trigger is confirmed adversary
    presence on a system in that enclave, and that condition is confirmed at the decision point. Under that condition, the
    plan calls for immediate isolation using any available defenders. Possible high-risk side effects include cutting off
    a partner unit that depends on the same reporting and diverting defenders from another mission; those risks may be held
    at joint headquarters. A possible medium-risk impact on the command's information activities may be held at the component
    level.
  question: What should the Network-Defense Commander do when the stated condition is met?
  options:
    O1:
      do: The Network-Defense Commander holds the decision pending a risk review.
      move: hold
      irreversible: false
    O2:
      do: The Network-Defense Commander declines to isolate the enclave under the stated condition.
      move: act
      irreversible: false
    O3:
      do: The Network-Defense Commander refers the decision to joint headquarters for risk review.
      move: ask
      irreversible: false
      to: joint headquarters
    O4:
      do: The Network-Defense Commander authorizes immediate isolation of the enclave under the stated condition.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The approved incident-response plan identifies the Network-Defense Commander as the authority to isolate the classified
      enclave.
  - id: F2
    kind: situation
    status: confirmed
    fact: Adversary presence is confirmed on a system within the classified enclave.
  - id: F3
    kind: situation
    status: confirmed
    fact: The enclave carries force-protection reporting used by deployed units.
  - id: F4
    kind: authority
    status: confirmed
    fact: The plan calls for immediate isolation using any available defenders when adversary presence on a system in the
      enclave is confirmed.
  - id: F5
    kind: situation
    status: assessed
    fact: Isolation could cut off a partner unit that depends on the same force-protection reporting.
  - id: F6
    kind: situation
    status: assessed
    fact: Isolation could divert defenders from another mission.
  - id: F7
    kind: authority
    status: assessed
    fact: The plan assigns the possible high-risk side effects to joint headquarters for risk holding.
  - id: F8
    kind: situation
    status: assessed
    fact: Isolation could have a negative impact on the command's information activities, identified as a medium-risk consideration.
  - id: F9
    kind: authority
    status: assessed
    fact: The plan assigns medium risk to the component level for risk holding.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The plan names the Network-Defense Commander as the authority and calls for immediate isolation when the stated condition
      applies.
  - id: C2
    facts:
    - F2
    - F3
    equity: own_force_life
    favors:
    - O4
    weight: strong
    why: The confirmed condition concerns a system in an enclave that carries force-protection reporting for deployed units,
      the context in which the plan directs immediate action.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: own_force_life
    favors:
    - O3
    weight: weak
    why: Possible disruption to a partner unit's reporting and diversion of defenders are high-risk considerations that may
      be held at joint headquarters.
  - id: C4
    facts:
    - F8
    - F9
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: A possible negative impact on the command's information activities is identified as medium risk that may be held
      at the component level.
  reasoning:
    read: The stated condition is met, and the plan assigns the Network-Defense Commander authority while calling for immediate
      isolation. The trap is treating the listed risk-holding levels as an instruction to defer every decision involving risk;
      the plan identifies possible side effects and their levels, but does not say that review suspends the immediate-isolation
      direction.
    weighing: The immediate rule and the Network-Defense Commander's identified authority are decisive {C1}, reinforced by
      the confirmed presence on a system in an enclave carrying force-protection reporting {C2}. The possible high-risk side
      effects and the medium-risk impact on information activities merit attention {C3} {C4}, but the plan does not make them
      prerequisites for referral or exceptions to the immediate direction. The balance depends on the stated condition applying;
      if it does not, this particular direction does not decide the matter.
    tradecraft: At the decision level, confirm that the stated condition is the one being applied, act under the identified
      authority, and record the decision and the risk considerations that informed it. This does not add technical steps for
      carrying out isolation.
    uncertainty: The side effects are framed as possibilities, not as findings that any particular disruption or impact will
      occur. The plan does not provide a separate procedure for resolving a conflict between an immediate-isolation direction
      and a risk review.
    handoff: The Network-Defense Commander is the identified authority to isolate the enclave. High risk may be held at joint
      headquarters and medium risk at the component level; those risk-holding levels do not themselves require referral before
      an immediate decision or transfer the authority named in the plan.
    tempting_wrong:
      option: O3
      pull: The possible high-risk side effects may make referral to joint headquarters seem prudent.
      why_wrong: The plan identifies joint headquarters as a possible holder of high risk, but separately calls for immediate
        isolation under the stated condition and identifies the Network-Defense Commander as the authority; it does not state
        that referral is a precondition.
    rejected:
      O3: Referral is not chosen because the plan does not make joint-headquarters risk review a prerequisite to the immediate
        direction.
      O2: Declining would not follow the plan's direction to isolate immediately when the stated condition applies.
      O1: Holding pending review would delay the immediate action the plan directs under the stated condition.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Confirmed adversary presence on a system in the enclave is not established.
      then: O1
      why: The immediate-isolation direction addressed here would no longer apply; holding for clarification of the applicable
        decision rule is a cautious alternative.
    would_not_change:
    - id: noflip1
      if: The listed high-risk side effects remain possible and high risk may be held at joint headquarters.
      why: Those considerations warrant attention, but the plan does not say that their possible presence displaces the immediate-isolation
        direction or changes the identified authority.
    watch_for:
    - id: watch1
      what: Whether isolation could cut off a partner unit that depends on the same force-protection reporting or divert defenders
        from another mission.
      favors:
      - O1
      why: These are examples of high-risk considerations that may be held at joint headquarters; their presence is relevant
        to risk accountability even though referral is not made a precondition.
  lesson: When an approved incident-response plan gives a conditional direction and names the decision authority, apply that
    direction when its condition is met. Risk-holding levels inform accountability, but do not create a referral requirement
    unless explicitly made one.
  limits: This conclusion applies only when confirmed adversary presence on a system in the specified enclave is established.
    It does not resolve other incident conditions, legal requirements, or risk procedures.
