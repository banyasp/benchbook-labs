case:
  id: DR-XFER-CORPUS-NX-e5bfbd43-E27-A@v1
  title: Declared Cyber-Response Posture
  status: draft
  setting: Meridian Republic, during a national review of cyber policy, National Strategic Policy Council
  decider: The national leadership of the Meridian Republic
  agent: The national leadership of the Meridian Republic
  agent_role: decide
  situation: The national leadership is considering a posture of disrupting a peer adversary first, an automatic response
    to warning indicators, or a response-only posture. Military writings favor disrupting the adversary first but do not address
    the adversary's warning systems or its ability to respond. An automatic response on warning indicators has also been discussed,
    though it would involve delegating authority and acting amid uncertain attribution. Senior civilian leaders have made
    public declarations about the country's response posture, while alternative proposals have arisen below that level. Both
    countries are assessed to retain the ability to disrupt each other's infrastructure after an initial move. The leadership
    is weighing these options against the expected consequences of a sustained cyber exchange for both societies.
  question: What should the national leadership of the Meridian Republic choose as its declared cyber-response posture?
  options:
    O1:
      do: The national leadership rejects the response-only posture and adopts a policy of disrupting the peer adversary first.
      move: act
      irreversible: false
    O2:
      do: The national leadership rejects the response-only posture and adopts an automatic cyber-response posture triggered
        by warning indicators.
      move: act
      irreversible: false
    O3:
      do: The national leadership adopts a response-only posture as its declared cyber policy.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The national leadership has considered disrupting the peer adversary first, responding automatically on warning
      indicators, and responding only after an attack.
  - id: F2
    kind: situation
    status: assessed
    fact: Meridian military policy writings often present disrupting the adversary first as a desirable option.
  - id: F3
    kind: capability
    status: assessed
    fact: Those discussions do not address the peer's warning systems or its capacity to disrupt Meridian infrastructure in
      response.
  - id: F4
    kind: situation
    status: assessed
    fact: The assessment records serious escalation risks associated with disrupting the peer first and judges practical adoption
      of that proposal unlikely.
  - id: F5
    kind: situation
    status: assessed
    fact: Automatic response on warning indicators has apparently been considered but is rarely discussed; it may have psychological
      value in reinforcing deterrence.
  - id: F6
    kind: authority
    status: assessed
    fact: An automatic response posture would require delegating decision authority to lower-level commanders and would raise
      command-and-control concerns.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Attribution of cyber incidents and warning indicators is uncertain, and a misread indicator could prompt mistaken
      action.
  - id: F8
    kind: authority
    status: confirmed
    fact: Senior civilian leaders have repeatedly declared a response-only posture in public policy statements.
  - id: F9
    kind: authority
    status: assessed
    fact: Proposals for disrupting first or responding automatically on warning have come from below the upper levels of civilian
      leadership.
  - id: F10
    kind: capability
    status: assessed
    fact: Each country is assessed to retain the ability to disrupt the other's infrastructure after an initial move, and
      a sustained exchange would cause severe harm to both societies.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: escalation_control
    favors:
    - O3
    weight: strong
    why: Although military writings favor disrupting the peer first, they do not account for the peer's warning systems and
      capacity to respond. The assessment identifies serious escalation risks and judges practical adoption unlikely.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Automatic response on warning may reinforce deterrence, but it would require delegating authority and raises command-and-control
      concerns. Uncertain attribution means indicators may be misread, creating a risk of mistaken action.
  - id: C3
    facts:
    - F8
    - F9
    equity: chain_of_command
    favors:
    - O3
    weight: strong
    why: Response-only is the longstanding posture declared by senior civilian leaders; proposals favoring the alternatives
      have come from below the upper levels of civilian leadership.
  - id: C4
    facts:
    - F10
    equity: civilian_life
    favors:
    - O3
    weight: strong
    why: Each side is assessed to retain a capacity to disrupt the other's infrastructure after an initial move, while a sustained
      exchange would cause severe harm to both societies.
  reasoning:
    read: This is a choice among declared cyber policies, not a claim that all options have equal standing or that private
      deliberations are fully known. The trap is to treat military writings favoring disruption first, or the possible deterrent
      value of automatic response on warning, as sufficient to outweigh the practical risks and the senior civilian leadership's
      declared response-only posture.
    weighing: The assessment weighs against disrupting the peer first the unaddressed warning and response capacities and
      the serious escalation risks {C1}; it weighs against automatic response on warning the delegation and command-and-control
      concerns and the possibility of mistaken action amid uncertain attribution, despite possible psychological value {C2}.
      Response-only is supported by senior civilian leaders' declarations and the lower-level origins of the alternatives
      {C3}, as well as by the mutual capacity for infrastructure disruption and the severe harm a sustained exchange would
      cause both societies {C4}. On that qualified record, response-only is the preferred posture; the balance depends in
      part on the assessments of each side's surviving capability and the risks of the alternatives.
    tradecraft: Record the choice as a declared-policy judgment, distinguish assessed capabilities and uncertain attribution
      from established certainty, and document why the risks of the alternatives and the credibility of a response-only posture
      support the decision. Revisit the judgment if the underlying capability, attribution, or authority assessments materially
      change.
    uncertainty: 'The assessment uses qualified language: disrupting first is judged unlikely to be adopted in practice, automatic
      response on warning has apparently been considered, and attribution is uncertain. It does not establish certainty about
      private deliberations or prove that every senior official shared the same view. The societal consequences described
      here are serious, but are not equivalent to nuclear annihilation.'
    handoff: This is a leadership-level policy choice. The assessment supports treating it as a decision for the national
      leadership, rather than inferring authority to act from discussion of automatic response on warning; that posture would
      require delegation to lower-level commanders.
    tempting_wrong:
      option: O2
      pull: Automatic response on warning may have psychological value in reinforcing deterrence.
      why_wrong: That possible value does not resolve the delegation and command-and-control concerns or the risk that uncertain
        attribution and misread indicators could prompt mistaken action.
    rejected:
      O2: Automatic response on warning was not preferred because its possible psychological value was outweighed by delegation
        and command-and-control concerns and the risk of mistaken action amid uncertain attribution.
      O1: Disrupting the peer first was not preferred because the military-writing rationale did not address the peer's warning
        and response capacities, and the assessment identified serious escalation risks and judged practical adoption unlikely.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership's assessment changed so that automatic response on warning no longer presented the cited delegation
        and command-and-control concerns or risks of mistaken action from uncertain attribution.
      then: O2
      why: Removing the assessment's principal stated objections could make automatic response's deterrent value decisive,
        though the source does not itself say this would occur.
    would_not_change:
    - id: noflip1
      if: Disrupting the peer first continued to be presented as desirable in military writings without addressing the peer's
        warning systems and response capacity.
      why: That presentation alone would not answer the assessment's practical objections or remove the serious escalation
        risks it identifies.
    watch_for:
    - id: watch1
      what: Whether each country's capacity to disrupt the other's infrastructure remains credible and is assessed to survive
        an initial move.
      favors:
      - O3
      why: The credibility of a response-only posture is tied to the assessment that either side retains a disruptive capacity
        after an initial move.
  lesson: Prefer a declared response-only posture over alternatives whose practical risks are left unresolved, especially
    when the assessment identifies severe consequences for both societies. Treat deterrent value as one factor, not as a substitute
    for assessing authority, attribution uncertainty, and the credibility of the posture.
  limits: This reasoning applies to the cyber-policy options and capabilities assessed for this period; it does not establish
    that response-only is appropriate under different capabilities, attribution conditions, risks, or political circumstances.
    The consequences described are severe but do not amount to nuclear annihilation. The assessment is qualified and does
    not reveal private deliberations with certainty.
