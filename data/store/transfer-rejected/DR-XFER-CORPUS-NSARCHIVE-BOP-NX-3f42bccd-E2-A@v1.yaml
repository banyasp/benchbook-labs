case:
  id: DR-XFER-CORPUS-NSARCHIVE-BOP-NX-3f42bccd-E2-A@v1
  title: Forward Airstrip on Private Land
  status: draft
  setting: North Kandar Province, 2021, Expeditionary Task Force Headquarters
  decider: Task Force Headquarters Claims Office
  agent: Task Force Headquarters Claims Office
  agent_role: decide
  situation: An expeditionary task force used a private estate for a forward airstrip and vehicle route under an open-ended
    oral arrangement made by a liaison officer. No written agreement was executed, and the department has stated that it is
    morally and legally bound to pay project costs when a claim is submitted. Heavy vehicles badly damaged 15 kilometers of
    estate road, gravel was quarried from the owner's land, and task force expenses included runway upkeep. Engineers estimate
    that the road requires full paving at a cost above the earlier repair approval, and the owner cannot raise the difference;
    Headquarters has authorized negotiation up to a stated ceiling. The liaison cell warns that delay could harm relations
    with the provincial governor and host-nation ministry and endanger the task force's basing. Payment for the gravel is
    to be made upon delivery of local title documents, with copies and a receipt sent to Headquarters.
  question: What should the Task Force Headquarters Claims Office do about the claimed project costs under the oral arrangement?
  options:
    O1:
      do: The Task Force Headquarters Claims Office authorizes reimbursement of submitted expenses under the oral arrangement.
      move: act
      irreversible: true
    O2:
      do: The Task Force Headquarters Claims Office declines reimbursement of submitted expenses under the oral arrangement.
      move: act
      irreversible: false
    O3:
      do: The Task Force Headquarters Claims Office requests supporting expense records from the liaison cell before reimbursement.
      move: ask
      irreversible: false
      to: the liaison cell
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: A site assessment records substantial damage to 15 kilometers of estate road used by task force vehicles.
  - id: F2
    kind: situation
    status: assessed
    fact: The owner's claim includes $85,000 for road repairs and $40,000 for gravel taken from the estate.
  - id: F3
    kind: situation
    status: assessed
    fact: The gravel payment is specified for delivery of local title documents, with copies and a receipt to be sent to Headquarters.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The liaison cell assesses that payment delay could harm relations with the provincial governor and host-nation ministry
      and endanger task force basing.
  - id: F5
    kind: situation
    status: assessed
    fact: An engineering estimate puts full road paving at $155,000, above the earlier $85,000 repair approval; the owner
      cannot raise the difference.
  - id: F6
    kind: authority
    status: confirmed
    fact: Headquarters authorized negotiation up to a maximum of $120,000 if necessary.
  - id: F7
    kind: situation
    status: confirmed
    fact: The task force project cost ledger lists $28,000 for runway upkeep on the estate.
  - id: F8
    kind: authority
    status: confirmed
    fact: The task force's use of the estate was governed by an open-ended oral arrangement made by a liaison officer; no
      written agreement was executed.
  - id: F9
    kind: authority
    status: assessed
    fact: The department's stated position is that it is morally and legally bound to pay project costs when a claim is submitted.
  considerations:
  - id: C1
    facts:
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The lack of a written agreement does not displace the department's stated moral and legal commitment under the open-ended
      oral arrangement to reimburse project costs when a claim is submitted.
  - id: C2
    facts:
    - F1
    - F2
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The road damage, gravel taken from the owner's land, and runway upkeep are treated as project-related costs; the
      department assesses the owner's claims as legitimate expenses under the arrangement.
  - id: C3
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The liaison cell warns that payment delay could harm relations with host-nation officials and endanger basing; payment
      of the gravel claim is tied to delivery of local title documents.
  - id: C4
    facts:
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O1
    - O3
    weight: weak
    why: The paving estimate exceeds the earlier road-repair approval, but Headquarters authorized negotiation up to $120,000
      if necessary. This supports reimbursement of legitimate costs within the authorized arrangement, while making the negotiated
      amount and supporting claim important to accountability.
  reasoning:
    read: This is a reimbursement decision under an open-ended oral arrangement, not a salary decision and not a choice to
      make an unbounded payment. The trap is treating the lack of a signed agreement as if it erased the department's stated
      moral and legal commitment, or treating that commitment as authorization to pay any amount without regard to the claim
      and the negotiated limits.
    weighing: The department's stated obligation to reimburse submitted project costs, the assessment that the claims were
      legitimate, and the serious basing and host-nation relationship consequences of delay favor {O3}. The higher paving
      estimate and the $120,000 negotiation authority make the amount and its support relevant, but do not overturn the stated
      reimbursement commitment; the balance depends on the expenses being claimed as project costs and on negotiation remaining
      within Headquarters' authority.
    tradecraft: Authorize reimbursement of submitted project costs, keeping the claims and negotiated amounts tied to the
      oral arrangement. For the gravel payment, obtain the local title documents and receipt and forward copies to Headquarters
      as specified; preserve supporting records so the authorization and amounts can be accounted for.
    uncertainty: The final negotiated road-repair amount and the item-by-item support for all claims are not specified here.
      The department's obligation was stated in relation to project costs incurred and submitted as claims, rather than as
      a fixed total payment.
    handoff: The Headquarters Claims Office is the decision-maker, and Headquarters has authorized negotiation up to the stated
      ceiling. The liaison cell should provide the submitted claims and the required local documents and receipt so Headquarters
      can maintain an accountable record.
    tempting_wrong:
      option: O2
      pull: Declining may seem prudent because no written agreement was executed and the road estimate exceeded the earlier
        approval.
      why_wrong: That would disregard the open-ended oral arrangement and the department's express position that it is morally
        and legally obligated to reimburse submitted project costs; it would also discount the stated risk that delay would
        harm host-nation relations and task force basing.
    rejected:
      O3: Requesting records before acting would delay payment despite the stated urgency, although the required title documents
        and receipt should still accompany the payment record.
      O2: Declining would conflict with the department's stated reimbursement obligation for submitted expenses under the
        oral arrangement.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A submitted claim could not be supported as a cost incurred for the task force project.
      then: O3
      why: The stated commitment covers project costs submitted for reimbursement; a support gap would justify obtaining records
        before authorizing payment.
    would_not_change:
    - id: noflip1
      if: The parties still had no written agreement.
      why: The department's stated moral and legal obligation arose under the open-ended oral arrangement despite the absence
        of a written agreement.
    watch_for:
    - id: watch1
      what: Delivery of the local title documents for the gravel payment, followed by forwarding copies and a receipt to Headquarters.
      favors:
      - O3
      why: These were specified as the basis for payment and for Headquarters' records.
  lesson: An unsigned agreement does not by itself defeat a reimbursement obligation when the responsible department has recognized
    an oral arrangement and committed to pay submitted project costs. Honor that commitment while linking payment to the claimed
    costs, the authority granted, and a record adequate to account for the decision.
  limits: This reasoning applies to costs claimed under the described oral arrangement and the department's stated reimbursement
    commitment. It does not establish that every claimed amount is automatically payable, or that the same obligation exists
    where a cost is outside the arrangement or the decision-maker lacks authority.
