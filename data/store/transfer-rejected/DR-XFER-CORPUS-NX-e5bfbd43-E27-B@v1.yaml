case:
  id: DR-XFER-CORPUS-NX-e5bfbd43-E27-B@v1
  title: Economic-Coercion Doctrine
  status: draft
  setting: Republic of Norland, during a review of financial statecraft toward a peer economy; Cabinet and Treasury
  decider: The government leadership
  agent: The government leadership
  agent_role: decide
  situation: The government is considering pre-emptive sanctions, automatic sanctions triggered by warning indicators, and
    sanctions imposed in response to the peer's actions. Economic-security staff favor pre-emption, but their proposals give
    limited attention to the peer's warning signals and capacity to retaliate. Other staff have discussed standing authority
    for Treasury officials to impose sanctions automatically when specified indicators appear. Those proposals raise questions
    about who would make the decision and how to interpret indicators that may be misread. Heads of government have consistently
    declared a response-only sanctions doctrine, while the alternatives have been raised at staff level. Both states retain
    substantial capacity to impose financial measures, and assessments consider the effects of a full exchange on both economies
    and global supply chains.
  question: What should the government leadership choose among pre-emptive sanctions, automatic sanctions on warning indicators,
    and response-only sanctions as its economic-coercion doctrine?
  options:
    O1:
      do: The government leadership adopts response-only sanctions as its declared doctrine.
      move: act
      irreversible: false
    O2:
      do: The government leadership rejects response-only sanctions and adopts pre-emptive sanctions as its doctrine.
      move: act
      irreversible: false
    O3:
      do: The government leadership rejects response-only sanctions and adopts automatic sanctions when warning indicators
        appear.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The government leadership is considering pre-emptive sanctions, automatic sanctions on warning indicators, and response-only
      sanctions.
  - id: F2
    kind: situation
    status: assessed
    fact: Economic-security staff papers present pre-emptive sanctions as a desirable option.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The staff papers advocating pre-emption do not address the peer's published warning signals or its listed financial
      countermeasures.
  - id: F4
    kind: capability
    status: assessed
    fact: Treasury scenario worksheets estimate that broad pre-emptive restrictions would expose Norland's exporters and financial
      institutions to substantial reciprocal measures from the peer.
  - id: F5
    kind: situation
    status: assessed
    fact: Automatic sanctions on warning indicators have been discussed in limited staff circulation; proponents describe
      their possible signaling value as reinforcing deterrence.
  - id: F6
    kind: authority
    status: assessed
    fact: Current rules reserve sanctions approval to the Treasury Secretary, while the proposed standing authority would
      permit officials below that level to act on indicators whose reliability is disputed.
  - id: F7
    kind: situation
    status: assessed
    fact: Response-only sanctions are the government's longstanding declared doctrine and are frequently affirmed by heads
      of government.
  - id: F8
    kind: authority
    status: assessed
    fact: Proposals for pre-emptive or indicator-triggered sanctions have come from staff and have not been adopted by the
      heads of government.
  - id: F9
    kind: capability
    status: assessed
    fact: Norland's financial measures and the peer's reciprocal tools are each assessed to have substantial reach across
      cross-border finance.
  - id: F10
    kind: situation
    status: assessed
    fact: Economic assessments project that a full exchange of financial sanctions would severely damage both economies and
      disrupt global supply chains, including trade in essential goods.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Although staff papers present pre-emption as desirable, they omit the peer's warning signals and retaliatory tools.
      Treasury scenarios indicate substantial exposure to reciprocal measures, leaving the practical risks of pre-emption
      unresolved.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Automatic sanctions may reinforce deterrence through their signaling value, but the proposal shifts decisions below
      the established approval level and relies on indicators whose reliability is disputed. A mistaken trigger could impose
      sanctions without the intended senior-level judgment.
  - id: C3
    facts:
    - F7
    - F8
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: Response-only sanctions are the longstanding declared doctrine affirmed by heads of government; the alternatives
      have been proposed by staff rather than adopted at the highest level.
  - id: C4
    facts:
    - F9
    - F10
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Both states retain substantial financial coercive capacity. A full exchange is assessed to severely damage both economies
      and disrupt global supply chains, with consequences extending to access to essential goods.
  reasoning:
    read: This is a choice among declared economic-coercion doctrines, not a claim that every option has equal standing or
      that private deliberations are fully known. The trap is to treat staff arguments for pre-emption, or the possible signaling
      value of automatic sanctions, as sufficient to outweigh the practical risks, the concerns about delegated authority,
      and the leadership's established response-only doctrine.
    weighing: The assessment weighs against pre-emption the omitted peer warning signals and retaliatory tools and the substantial
      exposure identified in Treasury scenarios {C1}; it weighs against automatic sanctions the authority shift and the risk
      of acting on disputed indicators, despite possible signaling value {C2}. Response-only sanctions are supported by heads
      of government's repeated declarations and their status as the established doctrine {C3}, as well as by the reciprocal
      capacity and the assessed damage to both economies and global supply chains in a full exchange {C4}. On that qualified
      record, response-only sanctions are the preferred doctrine; the balance depends in part on the assessment of reciprocal
      capacity and the risks of the alternatives.
    tradecraft: Record the choice as an economic-coercion policy judgment, distinguish assessed exposure and indicator reliability
      from certainty, and document why the risks of the alternatives and the credibility of response-only sanctions support
      the decision. Revisit the judgment if the underlying capability or authority assessments materially change.
    uncertainty: 'The assessment uses qualified language: pre-emption is presented as desirable in staff papers, automatic
      sanctions have been discussed in limited circulation, and the projected effects of a full exchange are assessments.
      It does not establish certainty about private deliberations or prove that every senior official shares the same view.'
    handoff: This is a leadership-level policy choice. The assessment supports treating it as a decision for the government
      leadership, rather than inferring authority to impose sanctions from staff discussion of automatic triggers; the standing
      proposal would shift decisions below the established approval level.
    tempting_wrong:
      option: O3
      pull: Automatic sanctions on warning indicators may have signaling value in reinforcing deterrence.
      why_wrong: That possible value does not resolve the authority shift or the risk of acting on disputed indicators, which
        could lead to sanctions without the intended senior-level judgment.
    rejected:
      O3: Automatic sanctions were not preferred because their possible signaling value was outweighed by the authority shift
        and the risk of mistaken action on disputed indicators.
      O2: Pre-emption was not preferred because the staff rationale did not address the peer's warning signals and retaliatory
        tools, while the scenario estimates show substantial exposure to reciprocal measures.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership's assessment changed so that automatic sanctions no longer presented the cited authority concerns
        or risks of action on mistaken indicators.
      then: O3
      why: Removing the assessment's principal stated objections could make the signaling value of automatic sanctions decisive,
        though the source does not itself say this would occur.
    would_not_change:
    - id: noflip1
      if: Pre-emption continued to be presented as desirable in staff papers without addressing the peer's warning signals
        and retaliatory tools.
      why: That presentation alone would not answer the assessment's practical objections or remove the substantial exposure
        to reciprocal measures.
    watch_for:
    - id: watch1
      what: Whether the peer's financial countermeasures remain credible and whether Norland retains the capacity to respond,
        as assumed in the assessment.
      favors:
      - O3
      why: The credibility of a response-only doctrine is tied both to reciprocal capacity and to the assessment that a full
        exchange would severely damage both economies and disrupt global supply chains.
  lesson: Prefer a declared and credible response-only doctrine over alternatives whose practical risks are left unresolved,
    especially when the assessment identifies severe economic harm to both sides and disruption to global supply chains. Treat
    signaling value as one factor, not as a substitute for assessing authority, indicator reliability, and the credibility
    of the policy.
  limits: This reasoning applies to the economic-coercion options and assumptions assessed for this period; it does not establish
    that response-only sanctions are appropriate under different capabilities, risks, or political conditions. The assessment
    is qualified and does not reveal private deliberations with certainty.
  library:
    domain: sanctions and economic statecraft
