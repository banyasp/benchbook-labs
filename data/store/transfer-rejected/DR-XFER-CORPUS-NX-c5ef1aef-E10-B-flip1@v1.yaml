case:
  id: DR-XFER-CORPUS-NX-c5ef1aef-E10-B-flip1@v1
  title: Inadvertent Licensing Violations
  status: draft
  setting: United States export-control framework, Washington, D.C., during a 2024 review by the Export Enforcement Office
    advisory panel.
  decider: The Advisory Panel
  agent: The Advisory Panel
  agent_role: decide
  situation: The Advisory Panel is reviewing how the Export Enforcement Office treats licensing violations and technical exchanges
    with foreign nationals. Export-control lists and license conditions can be complex. A wrong classification on a control
    list or a missed license-condition date can result from a technical mistake. Some exchanges with foreign nationals are
    innocent and technical in nature. Enforcement agents now open criminal cases in many such matters. The office also has
    civil penalty authority and a voluntary self-disclosure process, and its procedures call for prompt case disposition.
    The panel's immediate task is only to obtain an enforcement standard from the Export Enforcement Office before selecting
    a treatment for these cases.
  question: What should the Advisory Panel recommend for the Export Enforcement Office's treatment of technical licensing
    mistakes and innocent technical exchanges with foreign nationals?
  options:
    O1:
      do: The Advisory Panel should recommend that the Export Enforcement Office make presumptive criminal referrals for technical
        licensing mistakes and innocent technical exchanges with foreign nationals.
      move: act
      irreversible: false
    O2:
      do: The Advisory Panel should ask the Export Enforcement Office to draft an enforcement standard for technical licensing
        mistakes and innocent technical exchanges with foreign nationals.
      move: ask
      irreversible: false
      to: The Export Enforcement Office
    O3:
      do: The Advisory Panel should recommend that the Export Enforcement Office handle technical licensing mistakes and innocent
        technical exchanges with foreign nationals through civil or administrative penalties, resolved quickly.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Federal export-control statutes authorize criminal penalties for willful diversion of controlled items.
  - id: F2
    kind: situation
    status: confirmed
    fact: The control lists used to determine export licensing requirements are complex.
  - id: F3
    kind: situation
    status: confirmed
    fact: A wrong control-list classification or a missed license-condition date can result from a technical or inadvertent
      mistake.
  - id: F4
    kind: situation
    status: confirmed
    fact: Some technical exchanges with foreign nationals occur without an intent to divert controlled items.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Export Enforcement Office has civil penalty authority and a voluntary self-disclosure process.
  - id: F6
    kind: situation
    status: confirmed
    fact: Office procedures call for prompt disposition of enforcement matters.
  - id: F7
    kind: situation
    status: confirmed
    fact: The office's stated enforcement mission includes distinguishing compliant exporters from violators and pursuing
      willful violations.
  - id: F8
    kind: situation
    status: confirmed
    fact: Enforcement agents currently open criminal cases in many matters involving technical licensing mistakes or innocent
      technical exchanges.
  - id: F9
    kind: situation
    status: confirmed
    fact: The panel's immediate task is only to obtain an enforcement standard from the Export Enforcement Office before selecting
      a treatment for these cases.
  considerations:
  - id: C1
    facts:
    - F1
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The enforcement standard can preserve criminal penalties for willful diversion while the panel's immediate task is
      to obtain a standard before selecting treatment.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F9
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Given the complex control lists and the possibility of inadvertent errors or innocent exchanges, those distinctions
      should be addressed in a standard before the panel selects a treatment.
  - id: C3
    facts:
    - F5
    - F6
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The office has civil enforcement authority and procedures calling for prompt disposition; obtaining a standard is
      the appropriate immediate step before selecting how to use those tools.
  - id: C4
    facts:
    - F7
    - F9
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The standard can give effect to the mission of distinguishing compliant exporters from violators, and the panel's
      immediate task is to obtain that standard before choosing a treatment.
  reasoning:
    read: The immediate issue is what step the panel should take before selecting how to enforce export-control requirements
      for mistakes on complex control lists or innocent technical exchanges. The trap is to mistake obtaining a standard first
      for weakening criminal penalties for willful diversion.
    weighing: 'The Advisory Panel should choose {O2}: its immediate task is only to obtain an enforcement standard before
      selecting a treatment {C3}. The standard can preserve criminal penalties for willful diversion {C1}, while distinguishing
      technical or inadvertent errors and innocent exchanges from willful conduct {C2}. It can also implement the office''s
      mission to distinguish compliant exporters from violators and pursue willful violations {C4}. These substantive considerations
      inform the standard, but do not displace the stated next step of obtaining it before selecting a treatment.'
    tradecraft: Ask the Export Enforcement Office to draft an enforcement standard for the specified conduct before the panel
      selects a treatment. The standard should preserve the distinction between technical or inadvertent conduct and willful
      diversion, and account for prompt disposition.
    uncertainty: The source does not specify detailed criteria for distinguishing inadvertent errors from willful violations
      or prescribe particular civil or administrative measures.
    handoff: The Advisory Panel should ask the Export Enforcement Office to draft the standard. The panel can select a treatment
      after obtaining it.
    tempting_wrong:
      option: O3
      pull: Civil or administrative enforcement may appear to be the suitable treatment for technical mistakes and innocent
        exchanges.
      why_wrong: That may inform the eventual standard, but the panel's immediate task is only to obtain the standard before
        selecting a treatment.
    rejected:
      O1: It would presumptively refer conduct for criminal treatment that should not be presumed criminal.
      O3: It selects a treatment before the panel has obtained the enforcement standard, contrary to the stated immediate
        task.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The panel's immediate task were not only to obtain an enforcement standard from the Export Enforcement Office before
        selecting a treatment for these cases, and it could select a treatment now.
      then: O3
      why: Without the prerequisite to obtain a standard first, the original recommendation for civil or administrative treatment
        and prompt disposition would be the appropriate direct recommendation.
    would_not_change:
    - id: noflip1
      if: The control lists and license conditions remain complex, and technical or inadvertent mistakes remain possible.
      why: Those circumstances support, rather than reverse, the panel's position that such errors should not be presumed
        criminal.
    watch_for: []
  lesson: When the panel's immediate task is to obtain an enforcement standard before selecting treatment, request the standard
    first. It should distinguish technical mistakes and innocent exchanges from willful diversion, preserve criminal penalties
    for willful diversion, and account for prompt disposition.
  limits: This recommendation is limited to obtaining an enforcement standard before selecting a treatment for technical or
    inadvertent licensing mistakes and innocent technical exchanges with foreign nationals. It does not remove criminal penalties
    for willful diversion or decide the eventual treatment. The source does not provide detailed enforcement criteria or sanctions.
