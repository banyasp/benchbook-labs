- n: 1
  focus: 'The report describes the gear malfunction, the decision to return and land, and the reason for recovering promptly:
    switching to spare aircraft to launch again for the assigned mission. Treat this as an operational-command choice; exclude
    the flight procedures and fuel-management details used to carry it out.'
  span_range:
  - src:7f83f667f660#p13.5
  - src:7f83f667f660#p13.7
  decision: The mishap pilot decided to recover the flight after the wingman’s landing-gear malfunction, intending to move
    to spare aircraft and resume the combat mission.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The report states that radio contact attempts failed and the aircraft’s location could not be tracked, after which
    the operations supervisor immediately requested a host-nation SAR launch. The decision point is the response to the missing
    aircraft; exclude the search or recovery methods themselves.
  span_range:
  - src:7f83f667f660#p16.2
  - src:7f83f667f660#p16.4
  decision: The operations supervisor decided to request launch of a host-nation search-and-rescue helicopter after the mishap
    aircraft could not be located.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to end the mission after the malfunction or relaunch in replacement aircraft. The report
    states the direction and the mission-completion rationale; exclude the aircraft-handling details.
  span_range:
  - src:7f83f667f660#p33.7
  - src:7f83f667f660#p33.7
  decision: Operations supervision decided that, after the flight landed because of the wingman’s landing-gear-door malfunction,
    the pilots should move to replacement aircraft and relaunch to accomplish the combat mission.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to rely on existing written guidance or pursue a further formal instruction after learning
    that some pilots did not follow the published procedure. The stated aim was to strengthen guidance; exclude the pilots’
    procedural technique itself.
  span_range:
  - src:7f83f667f660#p24.5
  - src:7f83f667f660#p24.6
  decision: Squadron supervision decided to pursue a Flight Crew Information File to strengthen night-landing guidance.
  content_domain: operational-command
  refusal_sensitivity: low
