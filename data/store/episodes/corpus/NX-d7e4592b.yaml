episodes:
- n: 1
  focus: 'This is a choice about consolidating authority: the Services argued that attachés primarily served protocol and
    Service-specific needs, while the Secretary favored unified management to address duplication, parochialism, and waste.
    Exclude later attaché activities and any operational methods.'
  span_range:
  - src:2df64fe8ea0c#p14.3
  - src:2df64fe8ea0c#p14.4
  decision: The Secretary of Defense decided to place the Defense Attaché System under DIA rather than leave attaché management
    with the Services.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision followed the Secretary’s doubts that DIA had established independence from the Services and his concern
    that interested parties viewed campaign results too favorably. The source also says DIA analysts had already voiced doubts
    and coordinated with CIA; exclude strike tactics and target selection.
  span_range:
  - src:2df64fe8ea0c#p21.3
  - src:2df64fe8ea0c#p21.5
  decision: The Secretary of Defense decided to ask CIA for an independent evaluation of the bombing campaign rather than
    rely on DIA’s assessments alone.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The dispute concerned whether those groups counted as enemy combatants: MACV argued they were difficult to distinguish
    and often had little military capability, while CIA and DIA analysts favored higher totals that included them or other
    groups. The source also notes that a higher estimate could undermine public credibility and confidence in the war effort;
    exclude the technical methods used to count forces.'
  span_range:
  - src:2df64fe8ea0c#p24.4
  - src:2df64fe8ea0c#p25.2
  decision: The MACV commander pressed to exclude self-defense and secret self-defense forces from the enemy order-of-battle
    estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to proceed, postpone, or cancel after intelligence supported both possibilities. The
    DIA Director recommended proceeding, the Joint Chiefs leadership concurred, and the President ordered the operation, motivated
    in part by a desired public-relations victory and a message to Hanoi. Exclude operational planning and execution details.
  span_range:
  - src:2df64fe8ea0c#p35.4
  - src:2df64fe8ea0c#p36.3
  decision: The President ordered the Son Tay raid to proceed despite unresolved uncertainty about whether prisoners remained
    there.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 5
  focus: The decision point is whether to join the broader assessment or issue a dissent warning of a major North Vietnamese
    offensive. The stated basis was reporting that Hanoi was strengthening its forces while Saigon’s capabilities were weakening;
    exclude later aid decisions and political arguments that relied on the estimates.
  span_range:
  - src:2df64fe8ea0c#p42.2
  - src:2df64fe8ea0c#p42.3
  decision: The DIA analysts dissented from the community’s comparatively optimistic 1975 assessment of South Vietnam’s prospects.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to prepare for evacuation or wait to avoid signaling that the U.S. commitment was ending.
    The attaché judged the situation sufficiently dangerous to begin planning in March, then accelerated preparations as North
    Vietnamese forces advanced; exclude the subsequent logistical methods and execution of the evacuation.
  span_range:
  - src:2df64fe8ea0c#p44.4
  - src:2df64fe8ea0c#p44.5
  decision: The defense attaché in Saigon began evacuation planning despite the Ambassador’s opposition to countenancing evacuation.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision arose after the Khmer Rouge refused to release the ship and crew, with U.S. indications placing the
    crew on Koh Tang. The source says the President authorized force to avoid an incident like the capture of the USS Pueblo;
    exclude the operational details of the assault and intelligence collection.
  span_range:
  - src:2df64fe8ea0c#p46.9
  - src:2df64fe8ea0c#p47.4
  decision: The President decided whether to authorize force to recover the Mayaguez and its crew.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
