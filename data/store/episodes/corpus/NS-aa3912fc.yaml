episodes:
- n: 1
  focus: The standing order required notification at a set deviation; the commanding officer changed that threshold in the
    night orders, saying he wanted to give the officer of the deck more leeway to avoid contacts and get more sleep. Focus
    on that oversight-versus-discretion choice, not on the navigation techniques used to avoid vessels.
  span_range:
  - src:a4366c0b4952#p16.2
  - src:a4366c0b4952#p16.2
  decision: Fitzgerald commanding officer decides to double the allowed deviation from the planned track before the officer
    of the deck must notify him.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: At about four miles, the officer of the deck considered passing astern but rejected turning to starboard because
    it would take the destroyer closer to land; she also rejected a suggested slowdown, believing it would make the situation
    worse. Focus on the collision-avoidance judgment and its stated reasons, not on the mechanics of a maneuver.
  span_range:
  - src:a4366c0b4952#p20.4
  - src:a4366c0b4952#p20.5
  decision: Fitzgerald officer of the deck decides not to slow down or turn to starboard to pass astern of the nearby vessels.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: After seeing Fitzgerald approach and receiving no response to signaling attempts, the second officer expected Fitzgerald
    to alter course because it was the give-way vessel; the report says he did not take sufficient action when the destroyer’s
    intentions became doubtful. Focus on the decision to rely on the other vessel’s action under the collision rules, not
    on the later rudder orders or maneuvering technique.
  span_range:
  - src:a4366c0b4952#p21.3
  - src:a4366c0b4952#p22.3
  decision: ACX Crystal second officer decides to rely on Fitzgerald altering course rather than take earlier sufficient action
    to avoid collision.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The OOD had identified a CPA of 1,500 yards, within the CO’s standing-order reporting requirements, but planned to
    make an after-the-fact report instead. The stated reasons were that she was comfortable with the distance and intended
    to report later; focus on compliance with the standing orders and the safety judgment, not on navigation techniques.
  span_range:
  - src:a4366c0b4952#p35.4
  - src:a4366c0b4952#p35.4
  decision: The Fitzgerald OOD chose not to notify the CO that the ACX Crystal’s CPA was within the reporting threshold.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The CO knew the bridge and CIC teams would be relatively inexperienced after an extended period in the shipyard and
    arranged the watch bill to place senior personnel at controlling watch stations and provide forceful backup. Focus on
    the command choice and its stated rationale; exclude detailed navigation training methods.
  span_range:
  - src:a4366c0b4952#p29.6
  - src:a4366c0b4952#p29.7
  decision: The Fitzgerald CO chose the watch-team arrangements intended to manage the crew’s inexperience before getting
    underway.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The XO said he did not trust the OOD but relied on the captain’s judgment and did not stay up to provide support.
    He cited tiredness and concern about the next morning’s engineering drills; focus on the leadership and safety tradeoff,
    not on navigation procedures.
  span_range:
  - src:a4366c0b4952#p29.8
  - src:a4366c0b4952#p30.2
  decision: The Fitzgerald XO chose not to volunteer to remain awake and support the bridge watch despite distrusting the
    OOD.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The stated reason for granting investigators access was to aid the investigation, despite the documents not being
    releasable publicly. Treat this as a limited access and disclosure decision; exclude the contents of the protected materials
    and any investigative techniques.
  span_range:
  - src:a4366c0b4952#p49.3
  - src:a4366c0b4952#p49.3
  decision: The Navy decided to provide NTSB investigators access to protected accident-related documents while keeping them
    unavailable to the public.
