episodes:
- n: 1
  focus: The legislative counsel suggested a legal approach that would not require proving intent to harm the United States
    or aid a foreign power. A newspaper account framed the proposal as disregarding the Bill of Rights, after which he says
    no one at the Agency floated it again. Focus on the policy choice and reaction, not on statutory analogies beyond what
    is needed to understand the proposal.
  span_range:
  - src:3d33c380c95b#p1.34
  - src:3d33c380c95b#p1.37
  decision: The CIA legislative counsel decides whether to keep advocating a possession-based Official Secrets Act proposal
    after public criticism.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: A loyalty-board review had found that the accusation rested on a landlady’s report, and the counsel told the Senator
    he believed there was no case. The Senator offered to drop the matter if the Director signed a letter stating that this
    was the basis of the accusation; the counsel obtained the letter. Focus on the decision to resolve the case this way and
    the stated basis for it, not on the employee’s personal details.
  span_range:
  - src:3d33c380c95b#p1.102
  - src:3d33c380c95b#p1.104
  decision: The CIA legislative counsel decides whether to obtain a Director’s letter addressing a Senator’s accusation against
    an employee in exchange for the Senator dropping the case.
  content_domain: other:personnel-security-adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
