episodes:
- n: 1
  focus: The decision point is whether to treat the contemplated operation against a U.S. citizen as prohibited by federal
    homicide law or as authorized under the AUMF and the lawful conduct of war. The memorandum recommends the latter based
    on the represented facts about the target, the conflict, and compliance with applicable laws of war; exclude operational
    methods for carrying out the operation.
  span_range:
  - src:0f16cc2261c9#p9.5
  - src:0f16cc2261c9#p16.2
  decision: The Office of Legal Counsel advises the Attorney General that the contemplated DoD lethal operation in Yemen would
    be covered by the public-authority justification and would not be barred as an unlawful killing.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: 'The decision point is the legal classification of this particular proposed operation: apply the conflict-wide, context-specific
    approach or require a location-specific intensity threshold. The memorandum concludes the operation falls within the conflict
    based on AQAP’s organization and role, its presence and activities in Yemen, and the targeted leader’s continuing attack
    planning; exclude operational questions about carrying out an attack.'
  span_range:
  - src:0f16cc2261c9#p16.3
  - src:0f16cc2261c9#p17.4
  decision: The Office of Legal Counsel decides whether DoD’s proposed operation in Yemen should be treated as part of the
    United States’ non-international armed conflict with al-Qaida, rather than as outside that conflict absent a specified
    level of hostilities in Yemen.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: The memorandum concludes the described DoD operation would comply with applicable targeting principles and fall within
    the public-authority justification and congressional force authorization. Relevant factors include distinction, proportionality,
    efforts to minimize civilian casualties, the duty to abort an unlawful strike, and acceptance of surrender; exclude details
    about weapons or attack execution.
  span_range:
  - src:0f16cc2261c9#p18.2
  - src:0f16cc2261c9#p20.3
  decision: The Office of Legal Counsel decides whether the contemplated DoD operation against the identified enemy leader
    is legally permissible under the laws of war and the cited federal criminal law, rather than prohibited as an unlawful
    killing.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
  tags:
  - doctrine-derived
- n: 4
  focus: The memorandum concludes that the CIA operation, on the represented facts and in compliance with the laws of war,
    would receive the same relevant statutory treatment as the virtually identical DoD operation. It weighs the operation’s
    authorized-war context and the distinction between lack of combatant privilege and whether conduct violates the laws of
    war; exclude covert methods or operational implementation.
  span_range:
  - src:0f16cc2261c9#p20.4
  - src:0f16cc2261c9#p25.3
  decision: The Office of Legal Counsel decides whether the contemplated CIA operation against the same enemy leader is covered
    by the public-authority justification and is not prohibited by the cited federal criminal statutes, rather than treating
    CIA participation as making the operation unlawful.
  content_domain: intel-oversight
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
