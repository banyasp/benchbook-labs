- n: 1
  focus: The decision point is whether Congress should compel testimony under its immunity authority or avoid doing so to
    preserve possible prosecutions. Congress chose testimony to address an immediate crisis of political confidence and illuminate
    failures in the national security apparatus; exclude the report’s broader recommendations for future grants of immunity,
    which are not a separate case-specific decision.
  span_range:
  - src:49ce34ffe1d8#p1.1
  - src:49ce34ffe1d8#p1.18
  decision: Congress chose to compel public, use-immunized testimony from senior Iran/contra figures.
  content_domain: other:congressional oversight and criminal justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to exclude the witness as tainted or permit him to testify. The judge rejected the
    witness’s account as incredible based on demeanor, inconsistencies, and other indications of an untainted memory; exclude
    the underlying destruction of a document, which is not the decision at issue.
  span_range:
  - src:49ce34ffe1d8#p1.3
  - src:49ce34ffe1d8#p1.4
  decision: The district judge decided to permit a witness to testify after rejecting his claim that he could not distinguish
    his own recollection from exposure to immunized testimony.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to leave the conviction intact or set it aside and require further witness-by-witness
    review under the immunity rule. The majority found the trial safeguards inadequate to prevent evidentiary use of immunized
    testimony; exclude the dissent’s preferred approach except as context for the competing option.
  span_range:
  - src:49ce34ffe1d8#p1.4
  - src:49ce34ffe1d8#p1.7
  decision: The court of appeals majority set aside the North conviction and required a detailed inquiry into whether each
    witness’s testimony was tainted.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to uphold the convictions, remand for additional findings, or set them aside. The majority
    concluded that the trial measures did not ensure the immunized testimony was unused and that the evidence cited could
    not establish an untainted recollection; exclude the separate dissent’s critique except as context for the alternative.
  span_range:
  - src:49ce34ffe1d8#p1.8
  - src:49ce34ffe1d8#p1.9
  decision: The court of appeals majority set aside the Poindexter convictions and declined to remand for new findings under
    the North standard.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to continue the prosecution under the remand requirements or dismiss it. The Independent
    Counsel concluded that meeting those requirements would be very difficult and enormously burdensome; exclude the appellate
    court’s legal ruling itself, which is a separate decision point.
  span_range:
  - src:49ce34ffe1d8#p1.7
  - src:49ce34ffe1d8#p1.7
  decision: The Independent Counsel dismissed the North prosecution on remand rather than attempt to satisfy the appellate
