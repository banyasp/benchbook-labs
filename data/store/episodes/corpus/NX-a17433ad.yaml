episodes:
- n: 1
  focus: 'The decision point is how the SOF handled an emergency when the landing-gear damage and checklist applicability
    were uncertain: rely on the checklist and proceed, consult the manufacturer, or favor ejection. Examine the SOF’s stated
    belief that the checklist adequately addressed the situation and that manufacturer consultation depended on time and whether
    a checklist applied; exclude the technical details of carrying out the recovery options.'
  span_range:
  - src:79ffaafb6739#p18.2
  - src:79ffaafb6739#p20.4
  decision: The SOF, with the MP and MEL, chose to proceed with the checklist-based cable-arrestment plan rather than seek
    manufacturer advice or choose ejection.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision arose after the aircraft sustained landing-gear and hydraulic damage; the SOF considered cable arrestment
    and controlled ejection. The SOF relied on the situation appearing to match a flight-manual checklist, while the report
    notes that assistance was available and could have informed the choice. Keep the focus on command judgment, authority,
    and weighing safety; exclude procedural or technical details of either course.
  span_range:
  - src:79ffaafb6739#p38.3
  - src:79ffaafb6739#p45.3
  decision: The Supervisor of Flying chose not to seek manufacturer technical assistance and to pursue a cable arrestment
    rather than a controlled ejection.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The sequencer’s service life had expired, and the office approved a final extension through 31 July 2020 while replacement
    was planned during later maintenance. The stated reason was maintenance consolidation. Focus on the safety and maintenance-policy
    tradeoff in granting the extension; exclude technical operation of the sequencer.
  span_range:
  - src:79ffaafb6739#p27.7
  - src:79ffaafb6739#p27.7
  decision: The Air Force Life Cycle Management Center approved a final temporary service-life extension for the aircraft’s
    digital recovery sequencer.
  content_domain: other:military maintenance safety
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: After paramedics described extensive cranial injuries and multisystem trauma, the physician ordered cessation of
    life-saving measures. The decision point is whether to continue or stop those measures in light of the reported injuries;
    exclude medical procedures and treatment instructions.
  span_range:
  - src:79ffaafb6739#p26.6
  - src:79ffaafb6739#p26.6
  decision: The on-call physician ordered life-saving measures for the mishap pilot to cease.
  content_domain: other:emergency medical ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
