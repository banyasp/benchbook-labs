  natsec: true
- n: 2
  focus: The decision point is whether and how to make a public policy response to an operation assessed as intelligence collection,
    including whether its scale and broader Russian conduct warranted sanctions. Include the stated rationale and the concern
    that the response could appear hypocritical given allied intelligence practices; exclude technical details of the compromise.
  span_range:
  - src:2a9da4cbac80#p14.11
  - src:2a9da4cbac80#p15.5
  decision: The US government chose to publicly attribute the SolarWinds operation to Russia and impose targeted sanctions
    rather than respond without public attribution or punitive measures.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The administration had a potential armistice and UN basis for seeking the airmen’s release, while the CIA officers
    were civilians captured on a covert mission in a country with which the United States was not formally at war. The State
    Department legal adviser warned that pressing their case as POWs could jeopardize efforts for the airmen; exclude operational
    details of the underlying mission.
  span_range:
  - src:2a9da4cbac80#p23.15
  - src:2a9da4cbac80#p24.8
  decision: The president and secretary of state chose to focus UN diplomacy on the 11 uniformed airmen rather than advocate
    for the two CIA officers as prisoners of war.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The public urged forceful action, including a blockade, but the president dismissed a retaliatory blockade because
    it would constitute an act of war. Treat this as a decision about the policy use of force; exclude operational planning
    for any blockade.
  span_range:
  - src:2a9da4cbac80#p22.8
  - src:2a9da4cbac80#p24.4
  decision: The president rejected a retaliatory blockade of China as a response to the imprisonment of the Americans.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The United States continued to seek the two men’s release while not publicly or diplomatically identifying them as
    CIA officers. The article links this choice to preserving the use of cover in current and future operations and notes
    that Beijing demanded an end to subversive activity; exclude details of covert methods or missions.
  span_range:
  - src:2a9da4cbac80#p28.4
  - src:2a9da4cbac80#p29.6
  decision: The administration chose not to acknowledge the two detainees’ CIA affiliation in its later diplomatic efforts
    with China.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to continue pressing for more intelligence or ease demands given the informant’s serious
    health and the strain of the operation. Keep the focus on the office’s stated judgment and welfare rationale; exclude
    the operational details of the mission.
  span_range:
  - src:2a9da4cbac80#p41.6
  - src:2a9da4cbac80#p41.7
  decision: The Chicago FBI office decided not to press its informant for additional information at that time.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to provide the names requested by the Senate Internal Security Subcommittee or withhold
    information that could identify an informant. The FBI’s stated reason was the risk of endangering him; exclude details
    of travel or other operational security practices.
  span_range:
  - src:2a9da4cbac80#p40.4
  - src:2a9da4cbac80#p40.5
  decision: The FBI decided to withhold the requested informant-identifying information from the Senate subcommittee.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: In February 1864, after testing and formal legal approval, Confederate leadership authorized funding, construction,
    and recruitment for the program. The stated context is wartime efforts against Union military targets; exclude the device’s
    design, construction, and deployment methods.
  span_range:
  - src:2a9da4cbac80#p50.4
  - src:2a9da4cbac80#p50.7
  decision: The Confederate executive decides whether to authorize and fund a covert sabotage program against Union military
