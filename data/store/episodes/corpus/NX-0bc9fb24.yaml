- n: 9
  focus: This is a concrete choice among responses to reported Soviet missile deployments, with the stated reason that intelligence
    from human sources, aerial reconnaissance, and analysis gave the president confidence while airstrikes or an invasion
    risked escalation. Keep the scenario at the policy level; exclude operational details of reconnaissance and any implementation
    of the blockade.
