  focus: The decision point is how to distinguish tolerated state intelligence collection from commercial IP theft treated
    as intolerable, and how to signal those limits through engagement. Exclude the technical details of the cyber campaigns
    and any claim that the approach successfully prevented espionage.
  span_range:
  - src:2a9da4cbac80#p12.13
  - src:2a9da4cbac80#p12.17
  decision: The Obama administration chose public and private engagement with Beijing to shape, rather than broadly deter,
    Chinese cyber-espionage.
  content_domain: cyber-policy
  refusal_sensitivity: medium
