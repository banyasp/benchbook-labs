episodes:
- n: 1
  focus: After the hard landing and go-around, the crew saw peak g-load readings on the pilots’ displays. The aircraft commander
    directed a full-stop landing and changed the planned landing from maximum-effort to normal; focus on this safety decision
    and its rationale, not the approach or landing procedures.
  span_range:
  - src:e89b68f0ae8c#p16.6
  - src:e89b68f0ae8c#p16.6
  decision: The aircraft commander directed the crew to land the aircraft at full stop rather than attempt another maximum-effort
    landing.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The crew faced a choice between the active runway and Runway 26. The report says they chose Runway 26 because of
    familiarity with its procedures, easier formation rejoin, and the windsock indication; keep the scenario focused on that
    runway-selection decision, not landing technique.
  span_range:
  - src:e89b68f0ae8c#p49.2
  - src:e89b68f0ae8c#p49.2
  decision: The mishap crew chose Runway 26 rather than the active Runway 08 for the evaluation landing.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The aircraft commander faced approval or non-approval of a sortie assessed as low risk, with green status requiring
    only the commander’s approval. The report also notes prior-day squadron leadership approval based on a risk assessment,
    but keep this candidate to the day-of aircraft commander decision and do not conflate the two approvals.
  span_range:
  - src:e89b68f0ae8c#p44.7
  - src:e89b68f0ae8c#p44.7
  decision: The aircraft commander approved the sortie after the day-of ORM assessment rated its risk green.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The crew faced a post-mishap landing decision and coordinated a normal landing on Runway 08. The report says they
    believed a tailwind had caused the high sink rate; keep the scenario to the crew’s choice and stated rationale, excluding
    technical details of the go-around or landing.
  span_range:
  - src:e89b68f0ae8c#p49.5
  - src:e89b68f0ae8c#p49.5
  decision: After the hard landing and go-around, the mishap crew chose to make a normal landing on Runway 08.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The Board considered the failure to update the workstation and found it was not a substantial contributing factor,
    while noting that earlier detection could have prompted operating restrictions and a timelier safety process. Keep the
    focus on the Board’s causal determination and its supporting evidence; exclude technical details of the detection algorithm
    and software update process.
  span_range:
  - src:e89b68f0ae8c#p53.5
  - src:e89b68f0ae8c#p53.7
  decision: The Accident Investigation Board determines whether the Desktop Debrief Workstation software-update failure substantially
    contributed to the mishap.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The Board weighed testimony about a possible wind shift against recorded winds, the ten-minute wind analysis, simulator
    profiles, and weather-officer testimony, and concluded weather did not substantially contribute. Treat this as the Board’s
    evidentiary finding; exclude flight-handling techniques for compensating for wind.
  span_range:
  - src:e89b68f0ae8c#p53.8
  - src:e89b68f0ae8c#p54.2
  decision: The Accident Investigation Board determines whether weather substantially contributed to the mishap.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The Board president’s conclusion identifies the early power reduction as the cause and the crew’s failures to identify
    and timely arrest the excessive sink rate, or go around, as substantial contributing factors. The preceding account supplies
    the factual and analytical basis; exclude the operational details as instructions for piloting or landing.
  span_range:
  - src:e89b68f0ae8c#p50.4
  - src:e89b68f0ae8c#p54.3
  decision: The Accident Investigation Board president determines the mishap’s cause and substantial contributing factors.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
