  focus: The passage describes a doctrinal choice between keeping the machines classified and treating them as unclassified
    while unkeyed. The stated reason for the adopted approach was to make distribution to less-protected government and industry
    environments easier; exclude the technical design of the machines and key-distribution systems.
  span_range:
  - src:7b028afe8417#p29.1
  - src:7b028afe8417#p29.3
  decision: SIGSEC authorities decide to treat cryptographic machines as unclassified when they are unkeyed.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the trade-off between protecting communications that might otherwise remain insecure and the
    risk that wider access could facilitate adversarial cryptanalysis. Keep the focus on the policy choice and its stated
    rationale; exclude technical details of the cryptosystems and later general recommendations for cooperation.
  span_range:
  - src:7b028afe8417#p30.11
  - src:7b028afe8417#p31.10
  decision: SIGSEC authorities chose to distribute sophisticated cryptographic systems broadly to government and industry
    despite the risk of exposing cryptographic principles.
  content_domain: other:communications-security policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: The choice was whether to include the auditorium or treat it as an extraneous feature under military austerity standards.
    The Director argued it was essential for operations and should be modern and well constructed; exclude technical construction
    details.
  span_range:
  - src:7b028afe8417#p58.4
  - src:7b028afe8417#p58.6
  decision: The NSA Director justified and pursued construction of an auditorium in the new Operations building despite Army
    and Department of Defense objections.
  content_domain: other:organizational-facilities
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: After years of debate over whether individuals, including civilians, should be memorialized in a semipublic way,
    senior leadership votes were tied. The Director approved the memorial, citing the need for a collective sense of cryptologic
    history and heritage; exclude details of the later ceremony.
  span_range:
  - src:7b028afe8417#p61.2
  - src:7b028afe8417#p62.3
  decision: The NSA Director resolved a leadership deadlock by approving a memorial naming the auditorium for a cryptologist.
  content_domain: other:institutional-memorialization
