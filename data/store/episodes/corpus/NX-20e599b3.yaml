- n: 1
  focus: The decision point is whether to support the Americans, and whether to do so openly or secretly, given France’s financial
    and military weakness and the king’s reluctance to exploit England’s predicament. Exclude the later mechanics of the aid
    scheme and shipment operations.
  span_range:
  - src:e90823a9242c#p4.3
  - src:e90823a9242c#p6.1
  decision: The French cabinet decides to assist the American colonies secretly while maintaining a semblance of neutrality.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is how to provide assistance without making France’s violation of neutrality overt, while also
    addressing the government’s surplus supplies and treasury. Exclude the firm’s shipping, transfer, and other operational
    arrangements.
  span_range:
  - src:e90823a9242c#p6.3
  - src:e90823a9242c#p7.2
  decision: The French ministers reject a direct subsidy and authorize aid through a firm buying surplus French military supplies
    on credit.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to continue withholding overt intervention or proceed once the Americans have shown
    they can contend with trained European troops. Exclude the details of subsequent military operations and shipments.
  span_range:
  - src:e90823a9242c#p12.2
  - src:e90823a9242c#p12.2
  decision: The French foreign minister ends the delay in overt intervention after receiving news of the American victory
    at Saratoga.
