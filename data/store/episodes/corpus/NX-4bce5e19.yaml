- n: 3
  focus: The passage sets a high strategic threshold for accepting military assistance to China, citing uncertainty about
    China's political leadership and policy orientation and the risks of assistance. Treat this as a conditional foreign-assistance
    policy judgment, not as a decision to employ forces or provide operational guidance.
