  focus: The assessment presents a choice between pursuing broad agreements such as SALT or START and pursuing more limited
    agreements, arguing the latter may be more feasible and could constrain the Soviet Union without creating false confidence
    that arms control resolves strategic competition. Treat this as a policy recommendation, not as a concluded negotiation
    or a decision to employ force.
