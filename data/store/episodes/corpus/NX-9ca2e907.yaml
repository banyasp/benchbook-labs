- n: 1
  focus: The Coast Guard had an acute officer shortage because it was manning additional Navy craft as well as meeting its
    own expanding needs. The decision point is the personnel-allocation choice and its stated rationale; exclude the details
    of OSS training and operations.
  span_range:
  - src:d3c36e8ded9c#p22.21
  - src:d3c36e8ded9c#p23.4
  decision: The Coast Guard assistant commandant declined to commit the requested number of officers to OSS while making enlisted
    personnel available.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to authorize the vessel’s passage and provide protection from interference after being
    told its government work was secret. Exclude the operational details of the training activity and the mechanics of patrols.
  span_range:
  - src:d3c36e8ded9c#p23.9
  - src:d3c36e8ded9c#p23.15
  decision: The Coast Guard Captain of the Port renewed the MARIBEL’s permit and arranged special protection for its government
    service.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to rebuild dedicated intelligence expertise or continue relying on personnel whose
    primary specialties are elsewhere. The passage cites the disadvantage of that prior arrangement in developing long-term
    expertise; exclude the later list of authorized intelligence functions, which is not itself a decision.
  span_range:
  - src:d3c36e8ded9c#p26.6
  - src:d3c36e8ded9c#p27.10
  decision: Coast Guard leadership reestablished an enlisted intelligence specialty in 2007 rather than continuing to assign
    intelligence duties primarily to personnel from other specialties.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to reinforce the investigation with additional vetted personnel or continue with its
    existing staffing. The passage says management agreed to an almost tripling of personnel to reinforce the investigation
    and address new information; exclude the surrounding discussion of investigative sources and methods.
  span_range:
  - src:d3c36e8ded9c#p30.2
  - src:d3c36e8ded9c#p30.3
  decision: Senior CIA and FBI management agreed to substantially increase specially vetted personnel assigned to the joint
    Russian-penetration investigation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to retain the unit chief or replace her amid disagreement about withholding CIA information
    from the FBI and the FBI’s primacy in joint espionage investigations. The passage gives the stated bureaucratic and policy
    reasons and says the replacement was not a mole’s effort at self-protection; exclude the separate allegations about covert
    manipulation of the investigation.
  span_range:
  - src:d3c36e8ded9c#p31.8
  - src:d3c36e8ded9c#p32.2
  decision: The chief of the counterintelligence element replaced the head of the investigative unit after a dispute over
    information sharing with the FBI and the FBI’s lead role.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
