- n: 1
  focus: The decision point is whether to continue the conference or end it after the violence and amid claims of Communist-inspired
    disruption. The Secretary of State insisted it continue to deny international communism a victory; exclude the later dispute
    over which agency’s warnings reached officials.
  span_range:
  - src:9d24f0f53ba7#p6.2
  - src:9d24f0f53ba7#p10.1
  decision: The Secretary of State decides to continue the Bogotá conference despite the riots.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The Director had made abortive attempts to quash the investigation, but then appeared before the subcommittee and
    presented the Agency’s record. The stated considerations included defending the CIA’s performance and the President’s
    encouragement to confront critics; exclude the later press disclosure, which the subcommittee directed.
  span_range:
  - src:9d24f0f53ba7#p8.2
  - src:9d24f0f53ba7#p8.5
  decision: The Director of Central Intelligence decides to confront congressional critics by testifying about the Agency’s
    warning record.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: Staff discussed the possibility of disorders and reached a judgment that the Colombian government could control them;
    no warning was published in the listed intelligence products. The decision point is the analytic and publication choice
    to warn or not, excluding collection methods and later institutional reforms.
  span_range:
  - src:9d24f0f53ba7#p11.2
  - src:9d24f0f53ba7#p11.2
  decision: The Office of Reports and Estimates decides not to publish a warning about possible disorders during the Bogotá
    conference.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
