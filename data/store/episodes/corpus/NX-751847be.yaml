- n: 2
  focus: The source says officials decided either that China was bluffing or that intervention could no longer be effective,
    despite considerable warning from non-COMINT sources. The officials and their individual assessments are not identified;
    do not claim their choice was specifically a response to COMINT, since the source says reactions to COMINT indications
    are unknown.
  span_range:
  - src:04653067eb96#p12.1
  - src:04653067eb96#p12.1
