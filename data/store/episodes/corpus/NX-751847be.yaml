- n: 3
  focus: The decision point is whether to retain AFSA’s existing structure or strengthen central authority; the Brownell Committee
    described AFSA’s limited control over service agencies and inability to prevent duplication, amid dissatisfaction with
    its performance. Treat the President’s authorization of reorganization and the Secretary of Defense’s authorization of
    replacement as the linked steps the source describes, without adding unstated details about the new agency’s design.
  span_range:
