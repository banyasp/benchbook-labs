- n: 1
  focus: 'The decision point is whether to use the DNI’s joint designation authority to bring DEA’s intelligence office into
    the IC after years of negotiations. The source contrasts DEA’s earlier preference to remain a focused drug law enforcement
    agency with the reasons for integration: reporting on links between drug trafficking and terrorist groups, the need to
    connect intelligence and law enforcement capabilities, and IRTPA’s provision of a mechanism for designation. Exclude operational
    details of DEA investigations.'
