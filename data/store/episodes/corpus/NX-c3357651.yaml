episodes:
- n: 1
  focus: In the early implementation period, ODNI leadership faced limited and ambiguous statutory authority and skeptical
    agencies. The passage says leadership worked within IRTPA’s constraints and sought to empower agencies to lead reform;
    exclude operational intelligence practices and focus on the governance choice.
  span_range:
  - src:9da5000818fc#p5.4
  - src:9da5000818fc#p5.4
  decision: ODNI leadership chose to implement IRTPA through collaboration with intelligence agencies rather than seek immediate
    legislative changes or impose a unified command structure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The DNI suggested that daily in-person attendance was unnecessary, while the President expected it and explained
    that proximity would affect how others responded to the DNI. Treat this as a decision about leadership access and influence,
    not about the briefing’s intelligence content.
  span_range:
  - src:9da5000818fc#p7.4
  - src:9da5000818fc#p7.4
  decision: The President chose to require the DNI’s regular presence for the President’s Daily Brief to strengthen the DNI’s
    informal authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The order had not been updated since the Cold War, and working-level resistance had impeded revision. The President
    directed an NSC session and prompt update; exclude the order’s substantive operational provisions, which this passage
    does not describe.
  span_range:
  - src:9da5000818fc#p7.7
  - src:9da5000818fc#p7.12
  decision: The President chose to update Executive Order 12333 promptly after the President’s Intelligence Advisory Board
    urged revision.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
