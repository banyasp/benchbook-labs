- n: 1
  focus: The decision point is whether to use one census date nationwide or stagger dates during seasonal migration. The article
    says the staggered dates enabled double-counting migrants and favored the southern region, where the president drew support;
    exclude the technical details of census-taking beyond this policy choice.
  span_range:
  - src:66718615f5df#p5.1
  - src:66718615f5df#p5.3
  decision: Ghana's president chose to set different census cutoff dates for the north and south in the 1960 census.
  content_domain: other:public-statistics-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to disclose the census result of 1,089,000 or suppress it in favor of a higher estimate.
    The article gives reasons including embarrassment over the country's population, the usefulness of a larger figure in
    seeking foreign aid, and its implications for labor supply and investment; exclude any broader claims not grounded in
    this passage.
  span_range:
  - src:66718615f5df#p5.4
  - src:66718615f5df#p6.1
  decision: Liberia's president chose to suppress the disappointing census result rather than release it.
  content_domain: other:public-statistics-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to retain the 1960 administrative count of 3.5 million or adopt the later sample-based
    estimate of 4.4 million. The article says the higher estimate would lower per-capita statistics and portray the country
    as poorer; keep the focus on the government's use of the figures, not on the estimation method itself.
  span_range:
  - src:66718615f5df#p6.2
  - src:66718615f5df#p6.2
  decision: Upper Volta's government chose to keep using its old population figure for fiscal planning despite a better estimate.
  content_domain: other:public-statistics-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to accept the census results as a whole or accept the national total while rejecting
    regional figures. The passage connects the dispute over regional figures to political representation and describes a disparity
    between the populations and legislative seats of two areas; exclude the separate issue of the voter-registration total.
  span_range:
  - src:66718615f5df#p6.3
  - src:66718615f5df#p6.3
  decision: Sierra Leone's government chose to accept the census total but reject its regional breakdown.
  content_domain: other:public-statistics-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
