episodes:
- n: 1
  focus: The decision point is whether to hold proceedings in the host country or leave prosecution to proceedings elsewhere;
    the report gives reasons favoring on-site proceedings, including victim and community participation, while noting concerns
    about independence, expertise, and troop-contributing-country opposition. Exclude the separate question of how to conduct
    an investigation or protect evidence.
  span_range:
  - src:19ec39f501ed#p1.14
  - src:19ec39f501ed#p1.14
  decision: The Secretary-General endorsed holding troop-contributing countries’ court-martial proceedings in the host country
    for alleged crimes by deployed military personnel.
  content_domain: other:peacekeeping accountability policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: 'The decision point is how to allocate prosecution jurisdiction when a deployed troop member is accused of sexual
    violence: retain exclusive troop-contributing-country jurisdiction or allow host-state jurisdiction after a defined failure
    to act. The stated rationale is to address impunity while preserving an initial role for the contributing country and
    UN monitoring for international standards; exclude the mechanics of investigations or trials.'
  span_range:
  - src:19ec39f501ed#p1.15
  - src:19ec39f501ed#p1.16
  decision: The review panel recommended that UN agreements give troop-contributing countries primary, but not exclusive,
    jurisdiction, with host-state subsidiary jurisdiction if the contributing country fails to act promptly.
  content_domain: other:peacekeeping accountability policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to retain the units or replace them when the contributing country has not adequately
    investigated, held perpetrators accountable, or reported progress. The resolution ties replacement to accountability and
    requires the replacement contributor to meet conduct standards; exclude operational deployment details.
  span_range:
  - src:19ec39f501ed#p1.27
  - src:19ec39f501ed#p1.29
  decision: The Security Council requested that the Secretary-General replace a contributing country’s military or formed
    police units when that country fails to take appropriate steps on allegations against its personnel.
  content_domain: other:peacekeeping accountability policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
