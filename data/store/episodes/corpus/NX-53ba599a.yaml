- n: 1
  focus: The choice is between relying exclusively on photoreduction and maintaining parallel hard-copy and photoreduced files
    for the period when documents are most in demand. Focus on access, delay, and usability as reasons for the recommendation;
    exclude the technical details of photoreduction.
  span_range:
  - src:0ab60c8a770b#p4.4
  - src:0ab60c8a770b#p4.4
  decision: CIA central reference managers decide whether to keep current-year hard-copy documents alongside photoreduced
    files; the article recommends retaining both, then discarding hard copy after about a year.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision concerns the primary filing arrangement and its effects on direct analyst access. Include the stated
    advantages for country and functional analysts; exclude implementation details about numbering systems.
  span_range:
  - src:0ab60c8a770b#p5.1
  - src:0ab60c8a770b#p5.3
  decision: The federal intelligence reference system's managers decide whether to file raw documents by acquisition date
    or by country of origin; the article recommends country-of-origin files, broken down by issuing agency and chronology.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision is whether to preserve the existing coding organization or replace it with specialized, coordinated
    community coding. Focus on the stated expertise and completeness concerns; exclude operational examples of subjects that
    coders might classify.
  span_range:
  - src:0ab60c8a770b#p8.5
  - src:0ab60c8a770b#p9.3
  decision: The IAC Committee on Documentation and CIA decide whether to retain separate, limited-competence coding operations
    or reorganize and centralize coding across the community; the article recommends functionally and geographically specialized
    sections handling documents across agencies.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
