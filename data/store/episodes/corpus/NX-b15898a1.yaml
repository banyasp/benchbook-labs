- n: 1
  focus: The Committee considered examining systemic detention issues, but chose not to do so while other inquiries and investigations
    were addressing related matters. Focus on the scope decision and the risk of duplication or impeding those processes;
    exclude individual detention cases and operational conduct.
  span_range:
  - src:faea2c5856c0#p10.7
  - src:faea2c5856c0#p11.9
  decision: The Inquiry Committee decided not to examine systemic issues relating to detention and treatment of prisoners.
  content_domain: other:inquiry-scope
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The Government weighed protecting confidential Cabinet discussions and sensitive records against the Inquiry’s need
    to explain strategic decision-making and the public interest in its work. Focus on the exceptional disclosure decision
    under the agreed Protocol and its stated limits; exclude the underlying military and intelligence decisions described
    in the records.
  span_range:
  - src:faea2c5856c0#p14.8
  - src:faea2c5856c0#p15.7
  decision: The Government agreed to disclose exceptionally sensitive material for the Iraq Inquiry’s report.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision concerned whether to preserve confidentiality or permit the Inquiry to use legal advice, including advice
    on the basis for military action. Focus on the exceptional waiver and declassification, the stated public interest in
    maintaining confidentiality, and the limits on disclosure; exclude assessment of whether the military action was lawful.
  span_range:
  - src:faea2c5856c0#p17.3
  - src:faea2c5856c0#p18.7
  decision: The Attorney General and Government agreed to exceptional disclosure of legal advice covered by privilege and
    the Law Officers’ Convention for the Inquiry.
  content_domain: other:legal-privilege-disclosure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The Council gives Iraq a final opportunity to comply by a deadline, while authorizing Member States to use “all necessary
    means” if it does not. The decision point is the authority and policy choice to permit force after prior demands and sanctions;
    exclude the operational conduct of the subsequent campaign.
  span_range:
  - src:faea2c5856c0#p29.2
  - src:faea2c5856c0#p29.7
  decision: The Security Council decides whether to authorize Member States to use force if Iraq does not comply with its
    demands concerning Kuwait.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to continue the campaign into Iraq to remove the regime or stop at the objective of
    liberating Kuwait. The source gives reasons for stopping, including avoiding civil war and a prolonged occupation and
    leaving Iraq’s government to the Iraqi people; exclude battlefield details.
  span_range:
  - src:faea2c5856c0#p36.2
  - src:faea2c5856c0#p36.4
  decision: The coalition decides not to pursue the overthrow of Saddam Hussein after liberating Kuwait.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to use force to impose an air-exclusion zone in response to reported persecution, despite
    the absence of an express Security Council authorization for patrolling Iraqi airspace. The source describes the humanitarian
    rationale and the UK Government’s exceptional legal justification; exclude patrol methods, reconnaissance, and any engagement
    details.
  span_range:
  - src:faea2c5856c0#p38.4
  - src:faea2c5856c0#p39.6
  decision: The US, UK and French governments decide to establish the Southern No-Fly Zone in response to repression of Shia
    communities in southern Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to destroy the items on Iraq’s own initiative or await the resolution 687 process and
    international supervision. The passage gives Iraq’s stated reasons—fear of exaggeration and aggression, and a desire to
    act before receiving extensive destruction lists; treat these as Iraq’s account, not established fact. Exclude the separate
    later assessment of concealment plans.
  span_range:
  - src:faea2c5856c0#p53.5
  - src:faea2c5856c0#p53.10
  decision: Iraq’s leadership chose to destroy potentially prohibited nuclear-programme items unilaterally, before UN notification
    or supervision.
  content_domain: other:disarmament-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The decision point is the JIC’s estimate of whether a covert stockpile remained after declared stocks were destroyed.
    The assessment weighs the lack of direct evidence and the possibility that Iraq could produce necessary precursors through
    its civil chemical industry; exclude operational production details.
  span_range:
  - src:faea2c5856c0#p59.7
  - src:faea2c5856c0#p59.8
  decision: The JIC judged that Iraq may have retained a secret chemical-weapons stockpile, while noting it had no direct
    evidence.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is the JIC’s interpretation of the claim in light of Iraq’s disclosed crash programme. It assessed
    that the claim probably referred to that programme and that Iraq lacked sufficient fissile material; exclude technical
    details of nuclear-weapons development.
  span_range:
  - src:faea2c5856c0#p63.3
  - src:faea2c5856c0#p63.4
  decision: The JIC judged that Hussein Kamil’s claim that Iraq was three months from completing a nuclear weapon was very
    unlikely to be true.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to agree on access arrangements that accommodate Iraq’s stated security concerns while
    preserving UNSCOM’s ability to inspect under its mandate, or proceed without an agreement. Focus on that institutional
    and legal balance and the stated risk that the Commission’s work would be impaired; exclude the operational details of
    how inspections were conducted.
  span_range:
  - src:faea2c5856c0#p70.9
  - src:faea2c5856c0#p71.10
  decision: UNSCOM’s Executive Chairman and Iraq’s Deputy Prime Minister agreed on terms for inspection access at sensitive
    sites.
  content_domain: other:UN inspection policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: 'The decision point is the US position on the conditions for changing sanctions policy: accept compliance with weapons
    obligations as sufficient for lifting sanctions, or require compliance with all Security Council resolutions and evidence
    of peaceful intentions. Include the stated threat assessment and the commitment to minimize civilian suffering; exclude
    operational enforcement measures.'
  span_range:
  - src:faea2c5856c0#p75.4
  - src:faea2c5856c0#p76.5
  decision: The US administration chose to maintain UN sanctions on Iraq rather than support lifting them upon weapons-related
    compliance alone.
  content_domain: other:UN sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: 'The decision point is the Council’s response to repeated denials of access: adopt demands and a conditional warning
    of additional measures, rather than impose broader sanctions immediately or take a less forceful approach. The passage
    gives competing concerns about enforcement, disarmament, consensus, and humanitarian suffering; exclude any operational
    inspection details.'
  span_range:
  - src:faea2c5856c0#p81.3
  - src:faea2c5856c0#p83.4
  decision: The Security Council chose to condemn Iraq’s inspection obstruction, demand full cooperation, and signal targeted
    additional measures for continued noncompliance.
  content_domain: other:UN sanctions and inspection policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The decision point is whether to respond to UNSCOM’s reported obstruction and unresolved disarmament questions with
    stronger Council measures, despite disagreement over the balance and likely effectiveness of the draft. Focus on the Council’s
    authority, the compliance standard, and the competing case for pressure versus further dialogue; exclude inspection methods
    and operational details.
  span_range:
  - src:faea2c5856c0#p87.2
  - src:faea2c5856c0#p94.4
  decision: The Security Council decided to adopt resolution 1134 (1997), demanding full Iraqi cooperation with UNSCOM and
    threatening travel restrictions on officials responsible for non-compliance.
  content_domain: other:UN sanctions and disarmament policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The decision point is whether to impose targeted sanctions after Iraq conditioned cooperation and declined to reverse
    that position, or prioritize further diplomacy and de-escalation. Consider the Council’s compliance obligations alongside
    concerns about humanitarian impact, preserving inspections, and avoiding escalation; exclude the conduct of inspections
    and any operational surveillance details.
  span_range:
  - src:faea2c5856c0#p95.8
  - src:faea2c5856c0#p101.8
  decision: The Security Council decided to adopt resolution 1137 (1997), demanding that Iraq rescind its restrictions on
    cooperation with UNSCOM and imposing a travel ban on designated officials.
  content_domain: other:UN sanctions and disarmament policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: 'The decision point is how the Council should respond after inspectors returned: reaffirm unimpeded access and intensify
    implementation, while also addressing Iraq’s stated sovereignty and security concerns. Focus on the policy balance reflected
    in the statement and the stated link between Iraqi compliance and a possible transition from inspections to monitoring;
    exclude operational recommendations about equipment, aircraft, or surveillance.'
  span_range:
  - src:faea2c5856c0#p103.3
  - src:faea2c5856c0#p104.5
  decision: The Security Council decided to endorse UNSCOM’s recommendations in a Presidential Statement and reiterate demands
    for Iraqi cooperation while acknowledging Iraq’s legitimate concerns.
  content_domain: other:UN disarmament oversight policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The decision point is whether to do nothing, rely on diplomacy alone, or pair diplomacy with readiness to use force
    during the February 1998 inspection crisis. Focus on the policy rationale that readiness to use force would preserve leverage
    and support a diplomatic resolution; exclude operational military planning.
  span_range:
  - src:faea2c5856c0#p109.9
  - src:faea2c5856c0#p111.7
  decision: The UK Prime Minister and Cabinet chose a twin-track policy of pursuing inspections and diplomacy while keeping
    the threat of force credible.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 17
  focus: The decision point is whether the resolution should automatically authorize force after a violation or leave future
    action for the Council to assess and decide. Focus on the Council’s authority under the Charter and the need to judge
    circumstances; exclude any operational response to a violation.
  span_range:
  - src:faea2c5856c0#p111.8
  - src:faea2c5856c0#p114.10
  decision: The Security Council chose to warn of severe consequences for violations while retaining its authority to decide
    whether and when force was appropriate.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 18
  focus: 'The decision point is how to focus verification work when Iraq’s declarations remained incomplete: prioritize unaccounted
    weapons or pursue all unverified aspects equally. Focus on the stated rationale that resolving priority issues could support
    judgments about other gaps, while failure to resolve them could undermine confidence; exclude inspection or surveillance
    methods.'
  span_range:
  - src:faea2c5856c0#p122.5
  - src:faea2c5856c0#p122.7
  decision: UNSCOM chose to prioritize accounting for unaccounted prohibited weapons rather than fully verifying every production
    capacity and research activity.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The decision followed Iraq’s rejection of further substantive discussions and its demand for an immediate declaration
    of compliance. The stated reasons included Iraq’s view that it had met its obligations without progress toward lifting
    sanctions, and its allegations that UNSCOM was politically controlled and acting against Iraqi sovereignty; treat these
    as Iraq’s stated rationale, not established facts.
  span_range:
  - src:faea2c5856c0#p126.9
  - src:faea2c5856c0#p128.3
  decision: Iraq’s Revolutionary Command Council and Regional Command decided to suspend cooperation with UNSCOM in its current
    form and with the IAEA.
  content_domain: other:international-inspections-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 20
  focus: The decision point is whether to report at once or continue the proposed engagement and work programme. The account
    says Iraq rejected the proposals, demanded an immediate declaration of compliance, and treated further engagement as useless;
    exclude the substantive technical issues under discussion.
  span_range:
  - src:faea2c5856c0#p126.2
  - src:faea2c5856c0#p126.5
  decision: The UNSCOM Executive Chairman decided to report immediately to the Security Council after discussions with Iraq’s
    Deputy Prime Minister ended.
  content_domain: other:international-inspections-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 21
  focus: The Council acted under Chapter VII and conditioned a comprehensive review on restored cooperation and reports that
    UNSCOM and the IAEA could carry out their full activities. The decision point is the Council’s choice to defer the review
    while demanding renewed cooperation; exclude technical inspection details.
  span_range:
  - src:faea2c5856c0#p131.9
  - src:faea2c5856c0#p132.4
  decision: The Security Council decided not to conduct the scheduled sanctions review until Iraq rescinded its decision and
    inspectors could exercise their full mandates.
  content_domain: other:international-sanctions-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: The stated choice was whether to keep personnel in Iraq or withdraw them; the Executive Chairman identified staff
    safety as the prime consideration and consulted several UN representatives, while regretting that wider consultation was
    not possible. Keep the focus on the withdrawal decision and its rationale, not on operational arrangements.
  span_range:
  - src:faea2c5856c0#p142.8
  - src:faea2c5856c0#p142.9
  decision: The UNSCOM Executive Chairman decided to remove all Commission personnel from Iraq.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 23
  focus: The decision point is whether to proceed with the scheduled attack or pause to examine Iraq’s response and test its
    assurances in practice. Include the stated reasons for the pause; exclude the operational details of any prospective attack.
  span_range:
  - src:faea2c5856c0#p145.5
  - src:faea2c5856c0#p146.2
  decision: The US and UK governments decided to put the planned attack on hold for 24 hours and suspend further military
    action while they assessed Iraq’s assurances of renewed cooperation.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 24
  focus: The decision point is whether to participate in force, including whether to proceed while the Security Council was
    still discussing the reports and options or seek a further Council decision. Include the stated assessment of Iraq’s non-cooperation
    and the asserted legal authority; exclude operational planning and strike execution.
  span_range:
  - src:faea2c5856c0#p150.2
  - src:faea2c5856c0#p151.6
  decision: The UK Prime Minister authorized UK participation in military action and chose to proceed on 16 December 1998,
    relying on the reported failure of Iraqi cooperation and the Government’s interpretation of existing Security Council
    resolutions.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 25
  focus: The decision point is whether to define regime removal as an objective of this action or limit the stated objective
    to degrading Iraq’s capabilities and reducing the threat. Include the stated concerns about the scale of ground forces,
    legal authority and uncertain success; exclude operational details.
  span_range:
  - src:faea2c5856c0#p159.3
  - src:faea2c5856c0#p159.8
  decision: The UK Prime Minister decided not to make removing Saddam Hussein an objective of the December 1998 military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 26
  focus: 'This is a concrete policy choice after Operation Desert Fox: the administration weighs containment and conditional
    force against committing ground troops to overthrow the Iraqi government. Include the stated concerns about sustainable
    costs, a potentially years-long occupation, and the threat posed by renewed WMD programmes; exclude operational details
    of any strikes.'
  span_range:
  - src:faea2c5856c0#p166.7
  - src:faea2c5856c0#p167.4
  decision: The US administration chose to continue a policy of containment, rejecting a ground invasion to remove Saddam
    Hussein while retaining the possibility of force if Iraq rebuilt prohibited capabilities.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 27
  focus: The Joint Memorandum presents containment as the chosen policy, with walking away and regime change as alternatives,
    and the Prime Minister endorsed its conclusions. Consider the security, diplomatic, humanitarian, and sanctions-relief
    factors in the choice; exclude operational enforcement details.
  span_range:
  - src:faea2c5856c0#p179.5
  - src:faea2c5856c0#p181.2
  decision: The UK Prime Minister and ministers endorsed continued containment of Iraq rather than walking away or trying
    to topple Saddam Hussein.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 28
  focus: 'The Council chose a negotiated package after prolonged deadlock: stronger monitoring and access requirements, humanitarian
    changes, and conditional sanctions suspension. The passage records significant disagreement and abstentions; focus on
    the policy trade-offs and institutional decision, not inspection procedures.'
  span_range:
  - src:faea2c5856c0#p181.3
  - src:faea2c5856c0#p184.4
  decision: The Security Council adopted Resolution 1284, replacing UNSCOM with UNMOVIC and pairing renewed inspection requirements
    with humanitarian measures and a conditional route to sanctions suspension.
  content_domain: other:international sanctions and inspections policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 29
  focus: This is Russia’s distinct decision on whether to obstruct adoption or allow the resolution through. Consider its
    objections about sanctions, cooperation standards, and legal grounds for unilateral force alongside its stated reason
    for not blocking; exclude any operational force or inspection details.
  span_range:
  - src:faea2c5856c0#p184.5
  - src:faea2c5856c0#p185.7
  decision: The Russian delegation chose not to block Resolution 1284 despite opposing it, allowing its adoption after revisions
    it viewed as an opportunity to break the Iraq stalemate.
  content_domain: other:international sanctions and inspections policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 30
  focus: After a French civilian flight to Baghdad without approval, the FCO maintained its interpretation of the Security
    Council resolutions against the competing view that civilian flights without cargo were unrestricted. It relied on past
    practice and the need to protect the sanctions regime; exclude operational handling of flights.
  span_range:
  - src:faea2c5856c0#p196.5
  - src:faea2c5856c0#p197.4
  decision: The FCO chose to maintain that civilian flights to Iraq required Sanctions Committee approval and to resist a
    resumption of commercial flights.
  content_domain: other:sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 31
  focus: The Prime Minister favored linking sanctions changes with inspectors returning, rather than pursuing a sanctions
    shift independently. The stated reasons were to end sanctions, restore inspections, make any Iraqi obstruction apparent,
    and address a policy that was going nowhere and causing serious human consequences; exclude operational details of inspections.
  span_range:
  - src:faea2c5856c0#p205.9
  - src:faea2c5856c0#p206.9
  decision: The Prime Minister chose to link a shift in sanctions policy to Iraq’s return of inspectors.
  content_domain: other:sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 32
  focus: This is the Foreign Secretary’s February 2001 policy choice between continuing to pursue implementation of resolution
    1284 and adopting a sanctions and containment package not dependent on inspections returning. Include the stated reasons
    and the package’s policy aims; exclude the operational details of sanctions enforcement.
  span_range:
  - src:faea2c5856c0#p213.7
  - src:faea2c5856c0#p214.8
  decision: The Foreign Secretary chose to move UK policy away from relying on Iraq’s agreement to resume inspections and
    toward containment measures that could be sustained without Iraqi cooperation.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 33
  focus: The decision point is whether the humanitarian-necessity basis for continuing the No-Fly Zones remained legally arguable,
    given uncertainty about the consequences of stopping and diminished international support. Include the necessity, proportionality,
    civilian-protection and legal-uncertainty constraints; exclude operational patrol and response procedures.
  span_range:
  - src:faea2c5856c0#p224.2
  - src:faea2c5856c0#p226.2
  decision: The Attorney General concluded that continued UK and US operations in the No-Fly Zones could still be argued to
    be lawful on humanitarian grounds, subject to stated conditions.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 34
  focus: This is the decision whether the UK should join a specific proposed use of force while the Attorney General required
    a sound humanitarian and legal basis and officials weighed the consequences of non-participation. Include the legal standard,
    civilian-risk concerns and pressure to maintain cooperation with the US; exclude target selection and other operational
    details.
  span_range:
  - src:faea2c5856c0#p219.9
  - src:faea2c5856c0#p226.3
  decision: The Foreign Secretary and Defence Secretary, with the Attorney General’s legal advice, proceeded with UK participation
    in the February 2001 US-led attack after a dispute over its legal basis and authorization.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 35
  focus: The decision point is whether to retain broad trade sanctions or replace them with narrower controls, while preserving
    financial and military containment. The cited reasons include the humanitarian impact of broad sanctions and concern that
    Iraq was evading them; exclude later implementation details and any operational military measures.
  span_range:
  - src:faea2c5856c0#p236.2
  - src:faea2c5856c0#p237.9
  decision: The UK Prime Minister and US President agreed to refocus Iraq sanctions on weapons controls while retaining control
    over Iraqi oil revenues.
  content_domain: other:sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 36
  focus: The decision point is whether to continue the prior scope of patrolling or reduce it after regional reaction to the
    February attack. The passage attributes the reduction to commanders acting under discretionary authority, with government
    support; exclude specific patrol locations or operational methods.
  span_range:
  - src:faea2c5856c0#p246.4
  - src:faea2c5856c0#p246.5
  decision: Coalition operational commanders reduced the scope of No-Fly Zone patrolling during spring 2001.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 37
  focus: This is the policy choice to replace the comprehensive sanctions approach with more targeted controls, pursued through
    a Security Council resolution. Capture the balance between humanitarian relief, preventing access to funds and goods that
    could support weapons programmes, and the practical need for regional cooperation; exclude the detailed composition of
    goods lists and border-monitoring arrangements.
  span_range:
  - src:faea2c5856c0#p250.3
  - src:faea2c5856c0#p250.10
  decision: The UK Government chose to pursue a revised UN sanctions regime that would ease controls on civilian goods while
    retaining controls on weapons-related items and Iraqi oil revenues.
  content_domain: other:sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 38
  focus: Treat this as a policy decision about whether to continue the Zones, not as a decision about patrol tactics. The
    reasons included the assessed humanitarian risks of ending them, the southern Zone’s defensive value for Kuwait, the absence
    of a less risky alternative, and concerns about containment; include the competing view that legal justification was precarious
    and that patrols risked aircrew lives.
  span_range:
  - src:faea2c5856c0#p251.2
  - src:faea2c5856c0#p251.7
  decision: The Defence Secretary chose to maintain the No-Fly Zones and oppose a renewed effort to reduce or end their patrols.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 39
  focus: Frame the decision as whether to undertake a major attack in response to increased threats to coalition aircraft,
    and capture the US decision to defer alongside the UK debate about supporting or resisting such an operation. Relevant
    considerations included aircrew safety, civilian and regional risks, Arab opinion, legal concerns, and the possible damage
    to the sanctions and containment policy; exclude target selection and attack methods.
  span_range:
  - src:faea2c5856c0#p261.6
  - src:faea2c5856c0#p262.10
  decision: The US Administration chose to defer the proposed large-scale attack on Iraqi air-defence targets while considering
    its wider implications.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 40
  focus: The decision point is the President’s refusal of the commander’s request for more robust planning, with the stated
    reason that the time was not right; CENTCOM had also begun to dust off plans for a full invasion. Focus on the policy
    choice about whether to advance Iraq military-response planning, and exclude operational details of any invasion or military
    response.
  span_range:
  - src:faea2c5856c0#p267.3
  - src:faea2c5856c0#p267.3
  decision: The US President decided whether to authorize more robust CENTCOM planning for military responses in Iraq before
    9/11.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 41
  focus: The decision was made on 4 February 2003 to create a unit with FCO, MOD and DFID contributions to prepare practical
    post-conflict policy guidance. The stated reasons were that detailed management issues were likely to arise soon despite
    unresolved strategic questions, and that the unit could help address the prospect of the Coalition administering Iraq;
    exclude military operational planning techniques.
  span_range:
  - src:faea2c5856c0#p307.5
  - src:faea2c5856c0#p307.8
  decision: The cross-government officials meeting chaired by the Cabinet Office decided to establish an FCO-led, interdepartmental
    Iraq Operational Policy Unit.
  content_domain: other:government coordination
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 42
  focus: The decision point is the Prime Minister’s advice in September 2001 to delay action against Iraq and build the case
