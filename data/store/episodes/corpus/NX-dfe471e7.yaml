- n: 1
  focus: 'The decision point is whether to limit exclusions to the top three party ranks or extend them to the fourth rank,
    and the Order’s chosen scope: removal and future-employment bans for full members, with assessment of senior managers.
    The stated aims included preventing a return to power and making future officeholders acceptable to Iraqis; the debate
    also identifies risks to public services and innocent employees. Exclude the separate decision to dissolve the party and
    operational details of individual investigations.'
