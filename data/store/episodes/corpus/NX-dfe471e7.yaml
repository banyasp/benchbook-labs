  natsec: false
- n: 6
  focus: The decision point is whether to continue pressing for the existing rules or advocate relaxation and a more legal
    framework. The stated policy rationale was to draw disaffected former officers and officials back into government and
    security institutions, while supporting inclusion and reducing tensions. Exclude the accompanying media strategy and other
    recommendations not necessary to this decision point.
  span_range:
  - src:8cbb174a1a82#p44.4
