- n: 2
  focus: The decision point is whether to press for strict application or pragmatic implementation, including exemptions or
    probationary re-employment for people not shown to pose a concern. The stated reasons include preserving essential public
    services and avoiding a pool of alienated, hostile former party members. Exclude the broader decision on the Order’s initial
    scope and any operational security measures.
  span_range:
