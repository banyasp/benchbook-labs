- n: 4
  focus: The decision point is whether to keep the existing slower appeals process or make local education appeals effective
    immediately and accelerate pending cases. The stated reasons were complaints that the policy had been applied unevenly
    and unjustly, and the prospect of allowing thousands of teachers to return to work. Exclude broader claims about changing
    the de-Ba’athification policy itself, which the CPA Administrator said remained sound.
  span_range:
  - src:8cbb174a1a82#p34.5
