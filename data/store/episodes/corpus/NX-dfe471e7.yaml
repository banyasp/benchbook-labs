- n: 3
  focus: The decision point is whether the CPA should retain implementation or transfer it to an Iraqi body. The stated rationale
    was that an Iraqi body might better understand the policy’s nuances; the passage also records concerns that the transfer
    could encourage sweeping exclusions and instability. Exclude operational security actions and later implementation details.
  span_range:
  - src:8cbb174a1a82#p28.4
