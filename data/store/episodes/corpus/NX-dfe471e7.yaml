  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to offer limited amnesty or continue to pursue the covered minor-role conduct through
    ordinary punishment. The stated purpose was to let citizens rejoin civil society and participate in reconstruction rather
    than continue toward a lost cause; the order was limited to Iraqis and specified offenses. Exclude the separate order
    reintroducing the death penalty.
  span_range:
  - src:8cbb174a1a82#p37.9
  - src:8cbb174a1a82#p38.8
