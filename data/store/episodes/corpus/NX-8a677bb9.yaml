episodes:
- n: 1
  focus: The decision point is whether to continue separate, limited reciprocal exchanges or establish a general agreement
    governing cooperation, including exchanges of finished intelligence and the division of collection, analysis, and dissemination
    responsibilities. The passage identifies concerns about redundant operations and misallocated resources; exclude the operational
    details of collection and processing themselves.
  span_range:
  - src:0af922f9040a#p31.6
  - src:0af922f9040a#p32.4
  decision: The War Department and British cryptologic authorities decided to formalize their intelligence-sharing and division-of-effort
    arrangements in the BRUSA Agreement.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: In early 1944, after learning that the president seldom saw Army Magic summaries, the Army Chief of Staff created
    a presidential Black Book arrangement rather than relying on the existing summaries. Focus on this decision to change
    how intelligence reached the president; exclude assessments of the president’s broader wartime leadership.
  span_range:
  - src:0af922f9040a#p52.2
  - src:0af922f9040a#p52.3
  decision: The Army Chief of Staff established a new presidential briefing system for Magic intelligence.
  content_domain: other:intelligence dissemination
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: By early 1944, the Army had about 200,000 backlogged messages in systems it could now exploit, but judged that it
    would not read them while current intercepts continued to arrive. Focus on the choice to prioritize current work over
    retrospective analysis and the capacity and code-change concerns behind it; exclude technical cryptanalysis methods.
  span_range:
  - src:0af922f9040a#p45.3
  - src:0af922f9040a#p45.3
  decision: The Army’s analysts prioritized current intercepts over exploiting a large backlog of Japanese military messages.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to condemn the atrocities publicly while risking disclosure that might expose an intelligence
    source, or omit the reference to protect that source. The passage suggests that bolstering British support for the Soviet
    Union during a critical military situation may have motivated the choice; exclude speculation beyond the reasons stated.
  span_range:
  - src:0af922f9040a#p54.3
  - src:0af922f9040a#p54.5
  decision: The British prime minister chose to refer to German police executions in a public broadcast.
  content_domain: other:wartime public communication
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to release the police decrypts, classified as lower-grade material, while withholding
    concentration-camp messages containing SS Enigma material. The passage identifies the source classification as the basis
    for the distinction; exclude later decisions about whether prosecutors actually used the released material.
  span_range:
  - src:0af922f9040a#p55.3
  - src:0af922f9040a#p55.3
  decision: The director of GC&CS decided which wartime decrypts could be released to the Nuremberg War Crimes Commission.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to use available decrypts in prosecutions or rely on other evidence while protecting
    intelligence capabilities. The passage gives both the prosecution’s view that other evidence was sufficient and the Allies’
    concern about preserving cryptologic advantages; do not infer a single formal decision-maker beyond those described.
  span_range:
  - src:0af922f9040a#p56.1
  - src:0af922f9040a#p56.4
  decision: The American prosecution leadership and Allied intelligence officials chose not to use police decrypts as evidence
    at the Nuremberg trials.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to act to protect Danish Jews after learning of the impending nationwide roundup; the
    passage notes longstanding public support for the Jewish population and that virtually all were helped to escape. Keep
    the scenario at the level of the rescue decision and its humanitarian rationale; exclude any operational details of carrying
    it out.
  span_range:
  - src:0af922f9040a#p88.4
  - src:0af922f9040a#p88.5
  decision: The Danish underground chooses to help Denmark’s Jews escape to Sweden rather than leave them exposed to the planned
    German roundup.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether Vichy would assist the German roundup or resist and withhold cooperation, including
    where German control was limited. The source gives Vichy’s stated rationales about foreign Jews and repatriation; exclude
    the operational details of carrying out the roundup.
  span_range:
  - src:0af922f9040a#p95.7
  - src:0af922f9040a#p96.3
  decision: Vichy leadership chose to cooperate with German authorities in rounding up Jews in France, even offering to include
    Jews from the unoccupied zone.
  content_domain: other:government-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is whether to allow the children to leave, including in response to offers from abroad, or keep
    them in France. The source identifies possible considerations behind Vichy’s refusal, but presents them as explanations
    offered by others rather than confirmed internal deliberations; exclude the details of arranging the children’s transport.
  span_range:
  - src:0af922f9040a#p98.2
  - src:0af922f9040a#p98.4
  decision: Vichy leadership chose not to release orphaned children of foreign Jews for resettlement abroad.
  content_domain: other:refugee-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The decision point is whether to abrogate the statutes after liberation or continue them. Officials claimed repeal
    might incite the Arab population, while the passage notes that Muslims had refused to participate in Vichy’s anti-Jewish
    program and that many in the Muslim elite supported Jews; exclude the later propaganda and unrelated citizenship issues.
  span_range:
  - src:0af922f9040a#p98.5
  - src:0af922f9040a#p99.1
  decision: The post-liberation administration in French North Africa chose to retain Vichy’s anti-Jewish statutes rather
    than repeal them immediately.
  content_domain: other:colonial-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The decision point is whether to continue the restrictions or remove them once Vichy had effectively ceased to govern.
    The source says the administration saw no need to maintain the laws after Vichy’s disappearance; exclude administrative
    implementation details beyond the stated restoration of positions.
  span_range:
  - src:0af922f9040a#p99.4
  - src:0af922f9040a#p99.5
  decision: The colonial governor-general in Indochina chose to repeal Vichy’s anti-Jewish statutes and restore affected officials
    to their former positions.
  content_domain: other:colonial-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: The decision point is whether to send the available train or hold it while seeking agreement on the Jewish children’s
    rescue. The diplomats’ stated reason was to save as many children as possible despite the unresolved conditions; exclude
    transport logistics and details of the route.
  span_range:
  - src:0af922f9040a#p102.2
  - src:0af922f9040a#p102.3
  decision: Swiss diplomats in Budapest recommended sending a train of Christian children, including converts, while the proposed
    transfer of Jewish children remained blocked.
  content_domain: other:humanitarian-diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: 'The decision point is Tokyo’s 1942 policy choice: whether to accommodate German demands or continue treating Jews
    largely as other foreign nationals, with special categories for stateless refugees and Jews considered useful to Japan.
    Include the stated national policy against expulsion and the Axis-alliance modification; exclude descriptions of surveillance
    as an operational practice.'
  span_range:
  - src:0af922f9040a#p107.1
  - src:0af922f9040a#p107.3
  decision: Tokyo’s diplomatic leadership decided to reject German pressure to expel Jews from Japanese-controlled territory
    and retain a differentiated policy for Jewish residents.
  content_domain: other:wartime refugee policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The decision point is whether to participate in the German-sponsored forum or decline; Tokyo accepted observer attendance
    despite the ambassador’s concerns about Japan’s racial policy and Allied propaganda. Include the competing consideration
    of Axis solidarity and the anticipated political importance of the issue; note that the forum was ultimately postponed
    and never convened.
  span_range:
  - src:0af922f9040a#p108.3
  - src:0af922f9040a#p108.4
  decision: Tokyo’s leadership decided to accept the ambassador’s recommendation that Japan attend the proposed anti-Jewish
    forum as an observer.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: 'The decision point is Switzerland’s response to Allied demands: accept conditional asset blocking and monetary controls,
    or make the complete economic rupture sought by the Allies. The passage describes Allied pressure, including threatened
    loss of transport privileges, alongside Swiss concerns about trade, transit, stolen gold, account privacy, and preventing
    German assets from funding another war.'
  span_range:
  - src:0af922f9040a#p113.6
  - src:0af922f9040a#p114.6
  decision: The Swiss Federal Council decided to block German assets under conditions and accept controls on German monetary
    activity rather than make a complete break in economic relations with Germany.
  content_domain: other:wartime economic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The decision point is whether to continue disseminating reports of the massacres or treat the information as sufficiently
    understood and stop routine reporting. The stated reason was that the killings were already sufficiently appreciated;
    exclude speculation about the decider’s motives and any operational collection details.
  span_range:
  - src:0af922f9040a#p131.2
  - src:0af922f9040a#p131.2
  decision: The deputy director of GC&CS decided to stop routinely reporting decrypts about police killings unless further
    reporting was requested.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The agencies destroyed virtually all unprocessed intercept because victory ended its operational rationale, while
    retaining limited samples for training and traffic relevant to continuing postwar intelligence interests. Frame this as
    a records-retention decision; exclude the technical details of intercepting or analyzing communications.
  span_range:
  - src:0af922f9040a#p135.6
  - src:0af922f9040a#p135.6
  decision: After the war, the Army and Navy cryptologic agencies decided which unprocessed intercepts to destroy and which
    to retain.
  content_domain: other:records-retention-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
