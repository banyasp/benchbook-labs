- n: 1
  focus: The President had wanted a CIG daily summary, but the Secretary of State argued that foreign-affairs reporting belonged
    to his department. The compromise was factual CIG summaries alongside a State Department digest; exclude the broader institutional
    history of CIG.
  span_range:
  - src:a2206c69bf35#p3.5
  - src:a2206c69bf35#p3.7
  decision: The President decides that CIG’s daily summaries will be factual statements, while the State Department provides
    a separate digest.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The analysts weighed the possibility of near-term Soviet military action against the interpretation that events constituted
    a war of nerves intended to test US resolve. Their stated evidentiary standard was specific evidence of preparations for
    offensive operations; exclude other assessments of Soviet intentions in later crises.
  span_range:
  - src:a2206c69bf35#p9.4
  - src:a2206c69bf35#p9.5
  decision: ORE analysts decide that disturbing Soviet developments do not indicate likely near-term military action absent
    evidence of offensive preparations.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is the early-1950 revision of the earlier warning: analysts interpreted southward troop movements
    as defensive and judged South Korea’s army increasingly capable. They also considered the possibility of South Korean
    provocation; exclude the subsequent response to the June attack.'
  span_range:
  - src:a2206c69bf35#p10.2
  - src:a2206c69bf35#p10.4
  decision: ORE analysts revise their estimate to judge a North Korean invasion of South Korea unlikely unless the North develops
    clear military superiority.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: Analysts considered reports of troop movements and warnings alongside political and military arguments against intervention,
    including the risk of war with the United States and consequences for Soviet influence. They continued to assess intervention
    as unlikely even after Chinese troops entered combat; exclude any operational response to intervention.
  span_range:
  - src:a2206c69bf35#p11.1
  - src:a2206c69bf35#p11.4
  decision: ORE analysts judge that China is unlikely to commit forces openly in Korea despite reports suggesting intervention
    may be likely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision was to replace one office whose analytical mission had become confused by splitting national, current,
    and basic intelligence among three units. The passage gives that confusion as the reason; exclude broader judgments about
    ORE’s historical performance and any operational intelligence techniques.
  span_range:
  - src:a2206c69bf35#p16.3
  - src:a2206c69bf35#p16.3
  decision: The DCI and Deputy DCI abolished ORE and replaced it with three offices for national, research, and current intelligence.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
