episodes:
- n: 1
  focus: The President chose to proceed despite the Secretary of Defense’s warning that routing the transfer through Israel
    would not make it legal and that the proposed arrangement raised congressional-notification issues. The exchange offered
    hostage releases as the benefit; focus on the policy and legal decision, not shipment arrangements or other operational
    details.
  span_range:
  - src:4af053e8e6ac#p1.18
  - src:4af053e8e6ac#p1.21
  decision: The President decides whether to authorize the proposed November 1985 HAWK missile transfer to Iran through Israel
    in exchange for hostage releases.
  content_domain: 'other: arms-transfer policy'
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: At the January 7 meeting, the President chose the proposal to exchange 4,000 TOW missiles for the release of five
    hostages, over the objections of the Secretary of Defense and the Secretary of State. Focus on the competing policy positions
    and hostage-release rationale, not the transfer’s implementation.
  span_range:
  - src:4af053e8e6ac#p1.30
  - src:4af053e8e6ac#p1.31
  decision: The President decides whether to accept Israel’s proposed TOW-for-hostages arrangement in January 1986.
  content_domain: 'other: arms-transfer policy'
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: After the earlier proposal, the President chose direct dealings and signed a Finding authorizing the transfers, despite
    the Secretary of Defense’s continuing legal objections. The hostage-recovery context and the question of presidential
    authority are the decision point; exclude the mechanics of moving weapons or covert activity.
  span_range:
  - src:4af053e8e6ac#p1.31
  - src:4af053e8e6ac#p1.33
  decision: The President decides whether to authorize direct U.S. arms transfers to Iran under a presidential Finding, rather
    than proceed through Israel.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The court chose not to sustain the new indictment’s broadened obstruction charge, despite its being based on the
    same facts as the earlier indictment. The stated legal reason was that, under the court’s reading of the statute in light
    of Poindexter, obstruction did not include false statements; exclude the separate concern about the indictment’s failure
    to underline the allegedly false statements, which the court did not treat as dispositive.
  span_range:
  - src:4af053e8e6ac#p1.51
  - src:4af053e8e6ac#p1.51
  decision: The district court dismissed the broadened obstruction charge because the statute did not cover false statements.
  content_domain: other:criminal procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: 'The report describes a choice between producing personal notes and diaries that congressional committees had requested
    and withholding them; the secretary also denied having relevant records under oath. The stated motive was concealment:
    the notes contradicted his testimony about his knowledge and recorded potentially embarrassing discussions. Exclude the
    mechanics of storing or transferring the papers except insofar as they evidence the decision to withhold them.'
  span_range:
  - src:4af053e8e6ac#p1.61
  - src:4af053e8e6ac#p1.81
  decision: The secretary of defense withheld his requested notes and diaries from congressional Iran/contra investigators
    and denied having relevant records.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to continue the proposed arms initiative through the Israeli channel or choose among
    the alternatives discussed by senior advisers. The notes state that the President was worried about the hostages and expected
    the Israeli arms sales to help secure their return; include the Secretary of Defense’s legal objections as context, but
    exclude shipment logistics and other operational details.
  span_range:
  - src:4af053e8e6ac#p1.105
  - src:4af053e8e6ac#p1.115
  decision: The President chose to approve proceeding with arms transfers to Iran through Israel.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is whether to add a separate indictment count for the July testimony or treat it as a repetition
    of the same false testimony. The report says it was omitted to avoid unnecessary proliferation; focus on that charging
    rationale, not on the underlying testimony’s detailed content.
  span_range:
  - src:4af053e8e6ac#p1.102
  - src:4af053e8e6ac#p1.102
  decision: The Independent Counsel chose not to charge the July 1987 testimony as a separate count.
  content_domain: other:prosecutorial discretion
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The decision point is whether to prosecute based on testimony that was at least misleading, or treat the inconsistencies
    as grounds to impeach credibility without a prosecution. The stated reasons were the difficulty of proving intentional
    falsity and the absence of direct evidence of collusion; exclude the underlying events recorded in the notes.
  span_range:
  - src:4af053e8e6ac#p1.155
  - src:4af053e8e6ac#p1.158
  decision: The Independent Counsel decided not to prosecute the former deputy national security adviser for his 1987 testimony
    about the Secretary of Defense’s notes.
  content_domain: other:prosecutorial discretion
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The choice was whether to pursue charges based on the secretary’s later deposition despite the immunity agreement,
    or to forgo collateral prosecution. The report states that pursuing those charges was not an effective use of resources;
    exclude the underlying disputes about how the notes were maintained.
  span_range:
  - src:4af053e8e6ac#p1.158
  - src:4af053e8e6ac#p1.162
  decision: The Independent Counsel decided not to pursue collateral false-testimony charges against the former Secretary
    of Defense’s secretary.
  content_domain: other:prosecutorial discretion
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The decision point is whether to charge complicity based on the secretary’s conflicting accounts, or decline charges
    given the evidentiary problems. The report cites the credibility problems of the official whose account implicated her
    and the lack of direct proof of collusion; exclude the separate dispute over the interview record.
  span_range:
  - src:4af053e8e6ac#p1.166
  - src:4af053e8e6ac#p1.167
  decision: The Independent Counsel decided not to charge the former Secretary of Defense’s other secretary with complicity
    in withholding notes.
  content_domain: other:prosecutorial discretion
  refusal_sensitivity: low
  held_out: false
  natsec: false
