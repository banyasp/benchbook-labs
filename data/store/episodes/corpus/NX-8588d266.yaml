- n: 86
  focus: The agents faced whether to present the facts to federal prosecutors to seek a criminal warrant, but did not do so.
    The source describes concern that a refused criminal-warrant attempt could jeopardize a later FISA application, FBI headquarters’
    instruction that a criminal investigation could not be opened, and a mistaken belief that OIPR approval was needed before
    contacting prosecutors; exclude details of any search operation.
