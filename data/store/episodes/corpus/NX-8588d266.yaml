- n: 88
  focus: The Commission describes EPA’s lack of adequate data and health-based benchmarks, its use of standards developed
    for other circumstances, and its contrasting advice that Ground Zero workers use protective gear while the general population
    was told the air was safe. Focus on the evidentiary and public-health basis for that communication and the risks of reassurance
    under uncertainty; exclude scientific conclusions beyond what this passage supports.
