  focus: The decision point is whether to use force against the Afghanistan camps and al Shifa despite uncertainty about the
    intelligence, and whether to include the tannery. Include the stated threat assessment, concerns about evidence and civilian
    harm, and the reasons for excluding the tannery; exclude operational planning and strike execution.
  span_range:
  - src:f2e6e3daa724#p133.4
  - src:f2e6e3daa724#p134.4
