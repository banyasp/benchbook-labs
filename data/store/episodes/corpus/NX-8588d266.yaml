- n: 1
  focus: At 9:00, the airline’s executive vice president learned that communications with American 77 had been lost; shortly
    afterward, the airline suspected a hijacking and learned United had a missing aircraft. The decision is whether to keep
    flights on the ground as the threat picture escalates; exclude the later screening failures and details of the hijackings
    themselves.
  span_range:
  - src:f2e6e3daa724#p26.3
  - src:f2e6e3daa724#p26.4
  decision: American Airlines leadership orders a regional ground stop and then expands it nationwide.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: After multiple hijackings became apparent, a United dispatcher began warning transcontinental flights; the warning
    reached United 93 several minutes later. The decision is whether to alert airborne aircraft despite incomplete and conflicting
    information; exclude the mechanics of transmitting warnings and any inference that the FAA deliberately chose not to act.
  span_range:
  - src:f2e6e3daa724#p27.5
  - src:f2e6e3daa724#p28.3
  decision: United Airlines dispatch leadership decides to warn airborne flights about cockpit intrusion and the attacks.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: Callers shared news of the earlier attacks, and passengers and surviving crew voted on whether to rush the hijackers,
    then acted. The decision is whether to resist in light of the apparent threat and the information available to those aboard;
    exclude details of the assault and the hijacker’s aircraft maneuvers.
  span_range:
  - src:f2e6e3daa724#p29.5
  - src:f2e6e3daa724#p30.4
  decision: Passengers and crew on United 93 decide whether to attempt to retake the aircraft from the hijackers.
  content_domain: other:civilian self-defense
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to scramble immediately for a reported hijacked aircraft headed toward New York or
    wait for authorities through the established chain. Keep the focus on the authorization and urgency, not on the fighters’
    subsequent routing or search for the aircraft.
  span_range:
  - src:f2e6e3daa724#p37.4
  - src:f2e6e3daa724#p37.6
  decision: The NORAD regional commander authorized NEADS to scramble the Otis fighters before completing the usual approval
    process.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: After learning of the second World Trade Center strike, the commander considered whether to keep the fighters away
    from Manhattan or coordinate with the FAA to move them over the city. The rationale was the possibility of further attacks
    and the need to establish a defensive presence; exclude the operational details of fighter routing.
  span_range:
  - src:f2e6e3daa724#p40.6
  - src:f2e6e3daa724#p41.4
  decision: The NEADS mission crew commander decided to send the Otis fighters toward Manhattan rather than keep them in military
    airspace.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: After learning that the Pentagon had been struck, the manager chose an unprecedented nationwide landing order rather
    than continuing ordinary air operations. The report describes the threat context and the order’s execution; exclude technical
    air-traffic-control procedures.
  span_range:
  - src:f2e6e3daa724#p46.5
  - src:f2e6e3daa724#p46.5
  decision: The FAA Command Center national operations manager ordered all aircraft to land at the nearest airport.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The Secret Service considered Washington too unstable, while the President strongly preferred returning and only
    grudgingly agreed to go elsewhere; the group departed without a fixed destination to get airborne quickly and decide later.
    Treat the decision as deferring the destination, not as a final choice of where to go.
  span_range:
  - src:f2e6e3daa724#p56.4
  - src:f2e6e3daa724#p56.4
  decision: The President decided to leave Washington’s destination unresolved while Air Force One got airborne, rather than
    immediately return to Washington or choose another destination.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The Vice President said the patrol would be pointless without guidance on whether pilots could shoot if an aircraft
    would not divert, and recalled that the President approved that concept. The report notes the accounts are uncertain;
    preserve that evidentiary qualification and focus on authority and the decision standard, not the mechanics of engagement.
  span_range:
  - src:f2e6e3daa724#p57.4
  - src:f2e6e3daa724#p57.5
  decision: The President authorized a combat air patrol concept under which pilots could shoot down a hijacked aircraft that
    would not divert.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The Vice President was told the aircraft was 80 miles out and then 60 miles out; he authorized engagement both times,
    relying on his earlier conversation with the President. The aircraft was United 93, which had already crashed, and the
    report describes the information reaching the shelter as based on projections. Focus on the decision under uncertainty
    and the claimed authority; exclude operational details.
  span_range:
  - src:f2e6e3daa724#p58.3
  - src:f2e6e3daa724#p58.4
  decision: The Vice President authorized fighters to engage the aircraft reported inbound toward Washington, and reaffirmed
    that authorization when told it was closer.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 10
  focus: The decision point is whether to regulate domestic intelligence collection through guidelines or leave it less constrained,
    with the guidelines also intended to forestall stronger regulation. Focus on the balance between counterterrorism needs
    and risks to individual rights and religious freedom; exclude the mechanics of investigations.
  span_range:
  - src:f2e6e3daa724#p92.3
  - src:f2e6e3daa724#p92.4
  decision: The attorney general adopted domestic security guidelines to regulate FBI intelligence collection in the United
    States.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to attribute responsibility on the basis of early indications or hold judgment pending
    further evidence. Focus on analytic caution and the competing indications described in the passage; exclude technical
    details of evidence collection and forensic analysis.
  span_range:
  - src:f2e6e3daa724#p92.5
  - src:f2e6e3daa724#p93.3
  decision: The CIA Counterterrorist Center reserved judgment on who was responsible for the Pan Am Flight 103 bombing while
    evidence was assessed.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The decision point is whether to continue providing sanctuary or offer expulsion as a way to ease pressure. Focus
    on the foreign-policy pressures, including sanctions and demands concerning individuals sheltered in Sudan; exclude the
    details of Bin Ladin’s security arrangements or departure.
  span_range:
  - src:f2e6e3daa724#p79.3
  - src:f2e6e3daa724#p80.3
  decision: The Sudanese government offered to expel Bin Ladin to Saudi Arabia in response to mounting foreign pressure.
  content_domain: other:counterterrorism diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The decision point is whether the NSA should seek warrants itself or leave that responsibility to the FBI, in light
    of its view of agency roles and concern about targeting people in the United States or violating applicable law. Keep
    the focus on authority and institutional responsibility; exclude any account of collection techniques.
  span_range:
  - src:f2e6e3daa724#p104.5
  - src:f2e6e3daa724#p105.3
  decision: The NSA decided not to seek FISA Court warrants for the relevant U.S.-to-foreign communications, treating the
    matter as the FBI’s role.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is whether to ban knives or continue permitting small knives, weighing the perceived threat against
    detection limits and checkpoint burdens. Exclude operational details about screening methods.
  span_range:
  - src:f2e6e3daa724#p101.4
  - src:f2e6e3daa724#p101.4
  decision: The FAA rejected a proposal to ban knives altogether at airport checkpoints.
  content_domain: other:aviation-security-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: The decision point is whether CAPPS selectees should receive additional scrutiny of carry-on baggage or only the
    measures described in the report. The stated concerns included discrimination, passenger throughput, and the assessment
    that sabotage was the principal aviation threat; exclude procedural screening instructions.
  span_range:
  - src:f2e6e3daa724#p101.3
  - src:f2e6e3daa724#p101.3
  decision: The FAA and air carriers adopted a CAPPS policy that did not require selectees to receive extraordinary carry-on
    screening.
  content_domain: other:aviation-security-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The decision point is whether to deploy marshals domestically or reserve them for other assignments. The report links
    the policy to the FAA’s assessment that domestic hijacking was in check and the absence of a recent terrorist hijacking
    of a U.S. commercial aircraft; exclude deployment tactics.
  span_range:
  - src:f2e6e3daa724#p102.5
  - src:f2e6e3daa724#p102.5
  decision: The FAA decided not to deploy federal air marshals on U.S. domestic flights.
  content_domain: other:aviation-security-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The decision point is whether the Office should limit itself to the 1995 procedures or impose additional control
    over information-sharing. The report attributes the Office’s position to concern about the FISA Court’s view of the process
    and describes its threat to stop presenting FBI warrant requests; exclude details of intelligence collection.
  span_range:
  - src:f2e6e3daa724#p96.3
  - src:f2e6e3daa724#p96.4
  decision: The Office of Intelligence Policy and Review made itself the gatekeeper for passing FISA information to criminal
    prosecutors.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The decision followed the failed raid, U.S. casualties, and public images of an American corpse, with Congress applying
    pressure. Treat continuing the deployment as the alternative implied by the withdrawal; exclude the raid’s operational
    details.
  span_range:
  - src:f2e6e3daa724#p114.3
  - src:f2e6e3daa724#p114.3
