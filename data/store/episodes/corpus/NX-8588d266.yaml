- n: 90
  focus: After the September 11 attacks, Saudi officials sought help getting citizens out of the country, and the FBI considered
    whether to permit the departures without checks or facilitate them subject to screening. The account says the FBI approved
    the flights at section-chief level and explains that the opportunity to check passengers was useful because the government
    did not routinely check foreigners leaving the United States. Exclude the mechanics of passenger screening and flight
    monitoring.
  span_range:
