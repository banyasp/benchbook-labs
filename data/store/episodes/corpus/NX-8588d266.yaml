- n: 89
  focus: The passage says the Attorney General established a “hold until cleared” policy because of the high rate of flight
    from deportation proceedings; it also notes that release on bond followed FBI clearance. Focus on the detention-policy
    choice, its stated rationale, and the legal safeguards or costs implicated by holding people pending clearance. Do not
    treat the separate disputes over closed hearings and detainee-name secrecy as part of this decision.
