- n: 33
  focus: The decision point is whether to use military force or threaten it before attribution was sufficiently established,
    versus waiting for a stronger evidentiary basis. Keep the focus on the attribution threshold and the reasons for caution;
    exclude operational strike planning.
  span_range:
  - src:f2e6e3daa724#p210.4
  - src:f2e6e3daa724#p211.5
  decision: The President deferred military attacks on al Qaeda or an ultimatum to the Taliban until intelligence and law-enforcement
