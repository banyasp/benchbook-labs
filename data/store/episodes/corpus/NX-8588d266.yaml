  focus: The Attorney General had been briefed on the danger and was told that reported threats concerned overseas targets,
    but the FBI Director could not assure him there would be no domestic attack. The report says he assumed the FBI was doing
    what it needed to do and did not ask or issue directions; focus on that oversight choice, not on investigative methods.
