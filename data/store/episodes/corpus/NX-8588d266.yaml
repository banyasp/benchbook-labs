  focus: The decision point is the leadership’s choice between established members and the new recruits, based on the recruits’
    skills and Western familiarity; the account also identifies the choice of a group leader. Keep the focus on personnel
    selection and stated qualifications, excluding attack planning and execution details.
  span_range:
