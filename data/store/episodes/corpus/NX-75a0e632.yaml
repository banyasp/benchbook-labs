- n: 1
  focus: After an earlier flight over Communist Poland and East Germany returned usable imagery, the President authorized
    Soviet overflights to address serious gaps in knowledge of Soviet strategic capabilities. Frame the choice as authorizing
    or withholding the intelligence activity and weigh the stated intelligence need; exclude aircraft design, routes, and
    collection techniques.
  span_range:
  - src:c5fbbc4715e4#p12.2
  - src:c5fbbc4715e4#p12.5
  decision: The President decides whether to authorize U-2 overflights of Soviet territory.
  content_domain: intel-oversight
  refusal_sensitivity: medium
