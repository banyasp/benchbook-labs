  natsec: true
- n: 2
  focus: By the time of the A-12’s first deployment, the President faced whether to retain it or retire it amid political
    sensitivity about flights over denied areas, satellite collection, and the Air Force’s similar SR-71. Focus on the policy
    choice and the stated strategic and institutional reasons; exclude aircraft performance and mission details.
  span_range:
  - src:c5fbbc4715e4#p18.2
  - src:c5fbbc4715e4#p18.3
  decision: The President decides whether to retire the CIA A-12 reconnaissance program.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The CIA Director urged use of the A-12; the initially reluctant President approved the mission to locate the ship
    and assess whether North Korea was preparing for hostilities. Treat this as an authorization decision and examine the
    stated objectives and concern; exclude flight planning, routes, and collection methods.
  span_range:
  - src:c5fbbc4715e4#p20.2
  - src:c5fbbc4715e4#p20.4
  decision: The President decides whether to approve the CIA Director’s request for an A-12 reconnaissance mission after North
    Korea seized the USS Pueblo.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to authorize the proposed rescue despite the risks of endangering the six and causing
    serious embarrassment to the United States and Canada. The passage says options were considered and the President approved
    the operation; exclude the deception, document, and travel methods used in the plan.
  span_range:
  - src:c5fbbc4715e4#p25.2
  - src:c5fbbc4715e4#p25.4
  decision: The President approved a rescue operation to extract the six U.S. personnel sheltering in Iran.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to pursue the recovery for its intelligence value or abandon it; the passage gives
    the value as the reason CIA embarked on the effort. Keep the scenario at the level of authorizing the intelligence activity,
    and exclude the engineering and concealment methods used to carry it out.
  span_range:
  - src:c5fbbc4715e4#p23.3
  - src:c5fbbc4715e4#p23.4
  decision: CIA leadership chose to undertake Project AZORIAN to recover part of the lost Soviet submarine.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to continue limited support or provide the missiles as part of the more aggressive
    strategy. The passage connects the shift to the aim of inflicting a humiliating Soviet defeat and describes the intended
    strategic effect; exclude the mechanics of using the missiles.
  span_range:
