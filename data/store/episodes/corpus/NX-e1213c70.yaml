episodes:
- n: 1
  focus: The Court rejected the petitions after finding agreement on the authorities’ responsibility and a process for locating,
    identifying, and respectfully burying the dead. The reasons included respect for the dead, compliance with international
    law, and the parties’ shared interest in the arrangement, which was not claimed to endanger soldiers; exclude the separate
    debate over how combat was conducted.
  span_range:
  - src:a148d6be1a2b#p1.6
  - src:a148d6be1a2b#p1.12
  decision: The Supreme Court sitting as the High Court decides whether to grant the petitions barring the military authorities
    from locating and evacuating Palestinian bodies, or reject them in light of the agreed arrangements.
  content_domain: other:judicial adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The stated arrangement favors timely, respectful burial by the Palestinian side; if it refrains, the authorities
    will weigh burial by their own forces because of a security concern. The decision must respect the dead and religious
    customs without differentiating between civilians and armed members; exclude how bodies are located or handled operationally.
  span_range:
  - src:a148d6be1a2b#p1.8
  - src:a148d6be1a2b#p1.10
  decision: The military authorities decide who will carry out burial if the Palestinian side does not promptly bring the
    bodies to burial.
  content_domain: other:humanitarian-law implementation
  refusal_sensitivity: low
  held_out: false
  natsec: false
