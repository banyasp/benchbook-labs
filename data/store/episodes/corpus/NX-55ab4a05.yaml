episodes:
- n: 1
  focus: The decision point is whether to bring personnel on duty and make a rapid-response force available ahead of formal
    support requests, or wait for those requests. The source cites the White House lockdown and the commander’s anticipation
    of requests; exclude later operational details about force employment.
  span_range:
  - src:3b518e0db721#p16.2
  - src:3b518e0db721#p16.2
  decision: The commanding general of the District of Columbia National Guard advanced the June drill dates and activated
    the quick reaction force in response to the unfolding unrest.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to augment the District of Columbia National Guard with outside forces and, if so,
    at what scale. The source says the Secretary estimated 5,000 Guardsmen were required because of escalating criminal activity
    and violence; exclude force deployment methods and tactical assignments.
  span_range:
  - src:3b518e0db721#p16.3
  - src:3b518e0db721#p16.3
  decision: The Secretary of Defense directed the National Guard Bureau to obtain additional state and territorial forces
    for the District of Columbia response.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to revise existing guidance and training materials to account for armed personnel or
    retain the existing materials. The stated reason is that some personnel were armed; exclude the contents of the rules
    and any instructions for applying force in particular situations.
  span_range:
  - src:3b518e0db721#p27.3
  - src:3b518e0db721#p27.3
  decision: District of Columbia National Guard leadership updated its rules-of-force and conduct training materials when
    some personnel were armed.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to rely on the District of Columbia National Guard alone or request state forces to
    supplement it, and the authority and approval path used for the augmentation. Keep the focus on the authorization, not
    on operational tasks performed after deployment.
  span_range:
  - src:3b518e0db721#p42.4
  - src:3b518e0db721#p43.2
  decision: The Secretary of Defense and Chief of the National Guard Bureau sought governors’ consent to send selected state
    National Guard forces to augment the District of Columbia National Guard under Title 32.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: Examine the legal and policy choice between permitting the gesture for de-escalation and treating it as prohibited
    participation in a protest. Exclude any tactical instructions about how to conduct civil disturbance operations.
  span_range:
  - src:3b518e0db721#p36.2
  - src:3b518e0db721#p36.2
  decision: The National Guard Bureau decided that Soldiers could take a knee during civil disturbance operations to de-escalate
    a situation without violating rules against political participation in uniform.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to provide a full brigade or manage the deployment through a less unified force contribution.
    The source links the full-unit deployment to continuity and simpler communication and coordination; exclude details of
    unit tactics and procedures.
  span_range:
  - src:3b518e0db721#p38.2
  - src:3b518e0db721#p38.3
  decision: The Tennessee National Guard decided to deploy the 278th Armored Cavalry Regiment as a full brigade in response
    to the support request.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The report describes approvals made without written requests and recommends requiring a request from an authorized
    civil or federal official, justification that capabilities have or will be exhausted, and reimbursement except in dire
    circumstances. The decision point is the approval standard and authority for civil support; exclude operational force
    employment and tactics.
  span_range:
  - src:3b518e0db721#p53.2
  - src:3b518e0db721#p53.3
  decision: The Secretary of the Army, as approval authority, decides whether to approve District of Columbia National Guard
    civil-support requests without a written request and full justification of exhausted capabilities.
  content_domain: other:civil-support authorization
  refusal_sensitivity: high
  held_out: false
  natsec: false
