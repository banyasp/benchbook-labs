episodes:
- n: 1
  focus: The minister had learned that the French had abandoned the staged withdrawal plan but waited to report it until hearing
    the emperor confirm the change. The stated reason was concern about provoking a major outbreak of anti-French feeling
    in the United States; exclude the mechanics of diplomatic communication.
  span_range:
  - src:ce2eba07ce18#p6.3
  - src:ce2eba07ce18#p6.3
  decision: The U.S. minister in Paris delayed reporting the revised French evacuation plan to the Secretary of State until
    he had confirmation from the emperor.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Secretary dismissed the proposal rather than enter potentially time-consuming negotiations. The passage grounds
    the choice in the U.S. policy of recognizing the Mexican government and in the assessment that French withdrawal was already
    well advanced; exclude speculation beyond those stated considerations.
  span_range:
  - src:ce2eba07ce18#p15.5
  - src:ce2eba07ce18#p16.1
  decision: The Secretary of State rejected France’s proposal for a joint interim government in Mexico that would exclude
    the recognized Mexican government.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
