episodes:
- n: 1
  focus: The decision point is whether to withdraw or remain despite the risks and the possibility of continuing limited aid.
    Focus on the stated security and mandate-related reasons; exclude operational details of convoy security.
  span_range:
  - src:3bd57368e008#p1.18
  - src:3bd57368e008#p1.19
  decision: The ICRC decided to withdraw from Bosnia-Herzegovina after its head of delegation was killed and it could not
    secure adequate protection or assistance for victims.
  content_domain: other:humanitarian-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to propose protected zones as a response to endangered civilians and the lack of temporary
    asylum elsewhere. Focus on the humanitarian rationale and the proposed agreement and protection framework; exclude operational
    details of zone security.
  span_range:
  - src:3bd57368e008#p1.26
  - src:3bd57368e008#p1.27
  decision: The ICRC decided to propose protected zones for civilians endangered by ethnic cleansing and displacement in Bosnia-Herzegovina.
  content_domain: other:humanitarian-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to release detainees under a negotiated arrangement or continue holding them, and how
    to respect individual destination choices. Focus on the humanitarian conditions, negotiations, and risks described; exclude
    details of transport operations.
  span_range:
  - src:3bd57368e008#p1.20
  - src:3bd57368e008#p1.21
  decision: The parties to the Bosnia conflict decided, under ICRC-negotiated agreement, to release more than 1,300 detainees
    before winter and allow each detainee to choose a destination.
  content_domain: other:detainee-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to move from inquiry into alleged violations to an international criminal tribunal,
    and to establish it under Chapter VII with the stated jurisdiction. Focus on the accountability rationale and institutional
    authority; exclude later questions about particular prosecutions or testimony.
  span_range:
  - src:3bd57368e008#p1.33
  - src:3bd57368e008#p1.34
  decision: The UN Security Council decided to establish the ICTY to prosecute persons responsible for serious violations
    of international humanitarian law in the former Yugoslavia.
  content_domain: other:international-criminal-justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to use force in response to the renewed shelling and the unacknowledged ultimatum.
    Focus on the stated circumstances, purpose, and authority questions; exclude target selection, strike planning, and execution
    details.
  span_range:
  - src:3bd57368e008#p1.40
  - src:3bd57368e008#p1.41
  decision: NATO decided to conduct air strikes against Bosnian Serb military assets after an ultimatum went unacknowledged
    and Sarajevo came under renewed heavy fire.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 6
  focus: The decision point is whether to continue pursuing a negotiated settlement or use air strikes, following the failed
    Rambouillet and Paris negotiations and the Serbian delegation’s rejection of the agreement. Keep the analysis at the level
    of the decision to use force and its stated rationale; exclude operational planning and strike execution.
  span_range:
  - src:3bd57368e008#p1.61
  - src:3bd57368e008#p1.61
  decision: NATO decided to launch air strikes against the Federal Republic of Yugoslavia after negotiations failed.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 7
  focus: The decision point is whether to pledge reconstruction funds before or after the relevant Dayton provision was implemented.
    The stated reason is to press for implementation; exclude broader questions about the legal terms of detainee release.
  span_range:
  - src:3bd57368e008#p1.51
  - src:3bd57368e008#p1.51
  decision: The international community withheld reconstruction funding for Bosnia and Herzegovina pending implementation
    of the detainee-release agreement.
  content_domain: other:international aid conditionality
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The decision point is whether to maintain the threatened air raids or suspend the threat after the October agreement
    and the withdrawal of 10,000 Serbian policemen. Keep the focus on the policy choice and its context, not on how air raids
    might have been conducted.
  span_range:
  - src:3bd57368e008#p1.59
  - src:3bd57368e008#p1.59
  decision: NATO suspended its threat of air raids after Serbian forces agreed to withdraw and monitors were accepted.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to keep the representatives in Kosovo or withdraw them amid worsening security. The
    passage attributes the worsening situation to Serb paramilitary forces; exclude speculation about operational security
    procedures.
  span_range:
  - src:3bd57368e008#p1.67
  - src:3bd57368e008#p1.67
  decision: The ICRC withdrew its representatives from Kosovo as the security situation worsened.
  content_domain: other:humanitarian access
  refusal_sensitivity: low
  held_out: false
  natsec: false
