- n: 1
  focus: The acting chief of station chose not to take the proposed officer and offered another station instead. The stated
    concern was that assets in a hostile environment required experienced handling and that any compromise could seriously
    damage US-Iranian relations; exclude the later decision to offer Tehran again.
  span_range:
  - src:241d6626f895#p2.4
  - src:241d6626f895#p2.5
  decision: The acting chief of station declined to accept an inexperienced first-tour officer for assignment to Tehran.
  content_domain: other:intelligence personnel
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: At a meeting of National Security Council principals, the President allowed the Shah to enter despite the unstable
    relationship with Iran and warnings of danger to the Embassy. The choice was to admit or refuse him; the passage describes
    the medical rationale, advisers’ positions, and the President’s concern about possible hostage-taking.
  span_range:
  - src:241d6626f895#p5.4
  - src:241d6626f895#p5.7
  decision: The President authorized admitting the Shah to the United States for emergency medical treatment.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The officer weighed whether to refuse to speak against the risks of appearing suspicious, being broken under interrogation,
    or endangering colleagues, and set out the course he would follow. Treat this as a personal decision about duties and
    competing risks in captivity; exclude details of interrogation methods or any operational tradecraft.
  span_range:
  - src:241d6626f895#p11.9
  - src:241d6626f895#p12.9
  decision: The officer decided how to respond to anticipated interrogation while in captivity, prioritizing protection of
    classified information and colleagues but preserving an opportunity to escape.
  content_domain: other:captivity ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is the officer’s choice under armed threat between continuing to refuse and opening the vault,
    weighing protection of the secretary against the consequences for security and his credibility. Exclude the vault’s contents
    and any operational details about access or security procedures.
  span_range:
  - src:241d6626f895#p14.2
  - src:241d6626f895#p14.4
  decision: The embassy officer decides whether to open the vault when captors order him to do so, ultimately opening it rather
    than expose the secretary to possible coercion.
  content_domain: other:captivity ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to continue holding the hostages or direct their return. The account reports a direction
    to send them back and gives the stated rationale that they had been used to no further purpose; exclude the later mechanics
    of their transfer and release.
  span_range:
  - src:241d6626f895#p33.4
  - src:241d6626f895#p33.5
  decision: Iran’s Supreme Leader directs that the hostages be returned.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to begin serious negotiations or continue the confrontation over the hostages. The
    account links the move to the urgent Iraqi threat, the burden of holding the hostages, and the shift in control of the
    Iranian government; exclude the detailed conduct of the negotiations.
  span_range:
  - src:241d6626f895#p33.4
  - src:241d6626f895#p34.4
  decision: Iran’s government begins serious negotiations with the United States, with Algeria’s assistance.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is whether to resign before the attempt or wait until afterward. The stated reason for waiting
    was to avoid jeopardizing the operation’s security or undermining the President’s authority; exclude the merits or operational
    details of the rescue attempt itself.
  span_range:
  - src:241d6626f895#p42.3
  - src:241d6626f895#p42.3
  decision: The administration chose to delay the Secretary of State’s resignation until after the rescue attempt.
  content_domain: other:executive-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The decision point is whether to take retaliatory action after officials learned who carried out the bombing and
    where its headquarters was, or to refrain. The passage attributes the choice not to retaliate to the Defense Secretary’s
    concern about possible civilian casualties; exclude the author’s later claims about whether retaliation would have deterred
    subsequent attacks and any operational details of a hypothetical response.
  span_range:
  - src:241d6626f895#p44.9
  - src:241d6626f895#p44.10
  decision: The administration chose not to retaliate after the 1983 Beirut bombing.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
