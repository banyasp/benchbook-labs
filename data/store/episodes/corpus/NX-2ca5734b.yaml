episodes:
- n: 1
  focus: The decision point is whether to test AI collaboration in simulated games or through trial and error in high-stakes
    intelligence applications. The team chose war games because failure in high-stakes settings could be too costly, and the
    games offered an unclassified, low-risk environment for testing and feedback; exclude the games’ operational content.
  span_range:
  - src:0cafbdfe548a#p24.7
  - src:0cafbdfe548a#p24.9
  decision: The joint IQT-DDI team chose AI-enabled war games as a low-risk testbed for experimenting with human-AI teaming
    in intelligence workflows.
  content_domain: other:AI experimentation policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is how to configure the AI assistants for the first war game after the preliminary play-test revealed
    mismatched user expectations and little performance data to support personalization. The team provided a user guide, selected
    GPT-4o for better information-retrieval performance, and offered curated personas to demonstrate a range of behaviors;
    exclude the substantive geopolitical game scenario.
  span_range:
  - src:0cafbdfe548a#p26.3
  - src:0cafbdfe548a#p26.10
  decision: The joint IQT-DDI team chose a larger GPT-4o model and a curated set of AI assistant personas for War Game 1 rather
    than continuing with the smaller Mistral 7B model and personalized personas.
  content_domain: other:AI experimentation policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: The official was concerned about a major dam project in a region lacking electricity and much industrial capacity,
    yet publicly praised it; the account says criticism would have been difficult, if not unthinkable, given the persecution
    surrounding the Lushan Conference. Focus on the choice between public endorsement and criticism, not on construction or
    engineering decisions.
  span_range:
  - src:0cafbdfe548a#p46.4
  - src:0cafbdfe548a#p46.5
  decision: The CCP official visiting Gansu chose whether to publicly endorse the Yintao Dam project or criticize it.
  content_domain: other:political-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision arose as intellectual restrictions in Soviet Bloc countries eased after Stalin’s death, creating an
    opportunity for the program while managers sought to avoid retaliatory repression. Keep the focus on the program’s policy
    purpose, not on its distribution channels or methods.
  span_range:
  - src:0cafbdfe548a#p50.2
  - src:0cafbdfe548a#p50.2
  decision: Book Program managers chose to make the program an instrument of peaceful change rather than a catalyst for political
    uprisings.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: 'The passage identifies the presidential cancellation and the changed circumstances that made the program unnecessary:
    glasnost had weakened its premise, and the Soviet Union had dissolved. Treat this as an authorization decision; exclude
    the program’s operational distribution methods.'
  span_range:
  - src:0cafbdfe548a#p50.6
  - src:0cafbdfe548a#p50.6
  decision: The President chose to cancel the Finding authorizing the Book Program’s literature effort.
  content_domain: intel-oversight
