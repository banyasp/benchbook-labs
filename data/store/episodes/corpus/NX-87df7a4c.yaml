  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The officials judged that the information then available did not meet the Index criteria, while a later review concluded
    that he should have been included. Frame the choice as an assessment under the Index criteria; exclude any assumption
    that inclusion would have triggered a particular action, since the source says it would not have disseminated his name
    to the Secret Service.
  span_range:
  - src:4aea3550ca92#p57.2
  - src:4aea3550ca92#p58.1
  decision: FBI field agents and supervisors decide whether to place Oswald on the Security Index before the assassination.
