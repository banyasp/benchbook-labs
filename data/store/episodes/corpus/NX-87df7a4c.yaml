- n: 3
  focus: The decision point is the Committee’s contingency assessment and its choice not to assign responsibility for this
    scenario. The passage gives the competing possibility of attacks and the stated assessment that Castro was unlikely to
    risk a direct confrontation; exclude the separate operational activities against Cuba and the details of other contingencies.
  span_range:
  - src:4aea3550ca92#p21.1
  - src:4aea3550ca92#p22.2
