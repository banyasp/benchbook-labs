  focus: The decision was whether the FBI would pursue or otherwise act on the informant’s offer; the Bureau said it did not
    plan further pursuit and made no commitment. Keep the focus on the agency’s jurisdictional and oversight judgment, not
    on any means of assassination.
  span_range:
