  focus: The Bureau's proposed response expressly says it will conduct no investigation, relying on the prior investigation's
    lack of evidence of Cuban-government involvement; the responsible supervisor could not recall who made the decision or
    its precise basis. Keep the scenario on the decision to investigate or decline further inquiry, not on the alleged plot's
