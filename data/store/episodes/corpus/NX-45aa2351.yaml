episodes:
- n: 1
  focus: The Court chooses between the appellant’s position that occupation and Convention protections continued despite annexation,
    and the State’s position that occupation ended after conquest and subjugation. It reasons from the meaning of occupation,
    the facts that hostilities had ended and there was no resistance, and the domestic Act’s lack of an enforceable individual
    remedy; it dismisses the appeal. Exclude the operational legality of the military action, which was conceded and not decided
    in detail.
  span_range:
  - src:0a81cf8d5267#p1.8
  - src:0a81cf8d5267#p1.15
  decision: The Supreme Court decides whether to allow the appeal by holding that the Geneva Conventions still barred the
    order requiring the appellant to leave Goa.
