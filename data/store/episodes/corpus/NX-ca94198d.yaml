- n: 1
  focus: The decision point is the federal choice to standardize qualifying state and local IDs after the 9/11 attacks, rather
    than continue with differing forms. The passage gives the security context and stated purpose; exclude the later compliance
    extensions, whose decision-makers and specific reasons are not described.
  span_range:
  - src:4c8f9e161c61#p25.4
  - src:4c8f9e161c61#p25.4
  decision: Congress enacted the REAL ID Act to standardize state and local identification accepted for entry to federal facilities.
  content_domain: other:identity-document policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to preserve the existing unsalaried service or reform it through salaried officers
    and centralized fee handling. The passage documents corruption and abuses that motivated reform; exclude the broader history
    of consular administration beyond this specific legislative change.
  span_range:
  - src:4c8f9e161c61#p28.5
  - src:4c8f9e161c61#p29.1
  decision: Congress reorganized and professionalized the consular service, providing salaries and directing consular fees
    to the Treasury.
  content_domain: other:foreign-service administration
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to add a photographic requirement to passport identification after the fraud incident.
    The passage connects the new requirement to that incident; exclude the separate US passport rules described nearby.
  span_range:
  - src:4c8f9e161c61#p29.1
  - src:4c8f9e161c61#p29.3
  decision: British authorities required photographs for passports after a German spy was apprehended using a fraudulent US
    passport.
  content_domain: other:identity-document policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: OMGUS could stop its inquiry or pursue more interviews and request Fischer’s return; it chose to recommend both steps.
    The passage gives reasons including concerns about German assets in Switzerland, Fischer’s evasive account, and testimony
    linking him to Konti’s interests. Treat this as a recommendation, not evidence that the State Department acted or that
    repatriation was legally authorized.
  span_range:
  - src:4c8f9e161c61#p40.4
  - src:4c8f9e161c61#p41.5
  decision: OMGUS investigators recommend further investigation of Konti and that the State Department seek Fischer’s repatriation
    from Switzerland.
  content_domain: other:postwar repatriation policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The authorities could refuse entry or grant temporary visas; they granted visas while Swiss interests included access
    to useful German expertise and services. Keep the scenario to the admission decision and the economic, military, and diplomatic
    considerations described; exclude the men’s later escape routes and financial arrangements.
  span_range:
  - src:4c8f9e161c61#p42.3
  - src:4c8f9e161c61#p42.5
  decision: Swiss authorities grant short-term visas to three German officials in March 1945.
  content_domain: other:immigration policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: Swiss authorities could grant the US requests or refuse them; they rebuffed the requests because there was no proof
    the officials remained engaged in criminal acts. The passage does not specify a governing treaty or legal standard, so
    do not supply one.
  span_range:
  - src:4c8f9e161c61#p42.5
  - src:4c8f9e161c61#p42.5
  decision: Swiss authorities refuse US requests to extradite the three German officials.
  content_domain: other:extradition policy
  refusal_sensitivity: low
