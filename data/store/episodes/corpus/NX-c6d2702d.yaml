  focus: The decision was to neither stimulate nor thwart a coup, while refusing to approve or support assassination and declining
    responsibility for stopping every reported threat. Capture the tension between avoiding U.S. responsibility for killings
    and concerns that opposing the coup could lead to a bloodbath or prolonged civil war; exclude the mechanics of the plot.
  span_range:
  - src:726f3f321dc3#p8.3
  - src:726f3f321dc3#p8.8
  decision: U.S. policy officials decided how the United States would respond to the proposed coup and assassination plans
    against South Vietnam’s leaders.
  content_domain: intel-oversight
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: Washington considered replacing the contact because his visibility created security and professionalism concerns,
    while the ambassador resisted because the generals trusted him and the lead general was reluctant to deal with anyone
    else. The channel continued, with security practices improved; exclude the operational details of those practices.
  span_range:
  - src:726f3f321dc3#p9.2
  - src:726f3f321dc3#p9.4
  decision: The U.S. ambassador and intelligence leadership decided whether to retain the CIA officer as the principal channel
    to the plotting generals.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The officer delivered funds requested by the generals, including money described as a reward for military units joining
    the coup and later money requested for families of those killed. The decision raises questions about U.S. complicity and
    accountability for sensitive funds; exclude any details of the coup’s execution.
  span_range:
