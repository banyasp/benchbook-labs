- n: 1
  focus: The decision point is the administration’s stated response to a possible MiG delivery, weighed against its concern
    about the regional arms balance and its declared opposition to fighter aircraft being introduced into Nicaragua. Exclude
    operational plans for conducting an attack; the issue here is the policy choice to use force in that scenario.
  span_range:
  - src:dd28f342e44a#p3.10
  - src:dd28f342e44a#p3.10
  decision: The president and senior national-security team decide that the United States will attack and destroy MiG aircraft
    if Nicaragua acquires them.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the assessment’s judgment that Moscow would avoid provoking the United States with a near-term
    MiG delivery while pursuing longer-term influence and possible military access. The assessment weighs near-term risks
    against strategic gains; exclude collection methods and operational responses.
  span_range:
  - src:dd28f342e44a#p8.3
  - src:dd28f342e44a#p8.5
  decision: The CIA’s 1986 assessment judges whether the Soviet Union is likely to provide MiGs to Nicaragua soon or prioritize
    its longer-term strategic interests.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is Managua’s choice between accepting Cuba’s proposal for attack helicopters and seeking direct
    Soviet confirmation of the MiG commitment. The stated reasons include the perceived importance of MiGs as a signal of
    Soviet commitment and a possible defense guarantee; exclude aircraft employment or technical details.
  span_range:
  - src:dd28f342e44a#p9.3
  - src:dd28f342e44a#p9.5
  decision: Sandinista leadership, including the defense minister, decides to approach the Soviet Union directly to reaffirm
    the promised MiG delivery rather than let Cuba’s proposed helicopter substitution determine the issue.
  content_domain: other:arms-procurement policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
