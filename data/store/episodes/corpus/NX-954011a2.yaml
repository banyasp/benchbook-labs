episodes:
- n: 1
  focus: The choice was to deny the replacement generator and let power stop, or maintain power; the chief agreed after the
    liaison officer and airline manager argued that maintaining power would avoid needlessly provoking the hijacker and preserve
    future options. Focus on the command decision and the competing interests, not the mechanics of changing generators.
  span_range:
  - src:888f8c18f75e#p5.4
  - src:888f8c18f75e#p5.4
  decision: The Argentine Federal Police chief agreed to continue electrical power to the hijacked plane and allow a generator
    change.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The officer chose to keep the hijacker engaged in discussion rather than push for an immediate decision, reasoning
    that the hijacker appeared ready to surrender and that the treaty was needed for the next discussion. Focus on the judgment
    about timing and legal information; exclude the details of the radio communications and any physical boarding procedures.
  span_range:
  - src:888f8c18f75e#p9.3
  - src:888f8c18f75e#p9.4
  decision: The liaison officer advised the Argentine Federal Police chief not to press the hijacker for immediate surrender
    while awaiting the extradition treaty.
  content_domain: other:legal negotiation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The Argentine Federal Police chief rejected direct negotiations under the government’s policy but agreed to ask the
    President about a non-Argentine intermediary; the President approved that option and asked the liaison officer to undertake
    it. Focus on the policy exception and the aim of bringing about surrender; exclude the details of entering the aircraft
    or conducting the encounter.
  span_range:
  - src:888f8c18f75e#p6.5
  - src:888f8c18f75e#p7.1
  decision: The Argentine President authorized a non-Argentine intermediary to negotiate with the hijacker despite the government’s
    no-negotiations policy.
  content_domain: other:negotiation policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
