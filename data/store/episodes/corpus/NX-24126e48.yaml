- n: 1
  focus: In summer 1963, the panel assessed evidence amid disagreement over the missile’s size and a perceived Soviet requirement
    for a very large vehicle. It concluded the SS-8 was not as large as the Air Force suggested, citing indications of a small
    second-stage engine and a payload of only four to five thousand pounds. Exclude technical methods of analyzing telemetry;
    the decision point is the estimative judgment.
  span_range:
  - src:47fcf70377bd#p7.1
  - src:47fcf70377bd#p7.1
  decision: The civilian scientific panel decided whether the SS-8 was a large missile or a smaller one.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Board chose an estimate of a payload capability about the same as the SS-7, while the Air Force and DIA retained
    a qualification that the evidence did not rule out a larger nose cone. The preceding panel findings and the available
    indicators supported the small-missile judgment; exclude technical collection or analysis procedures.
  span_range:
  - src:47fcf70377bd#p7.1
  - src:47fcf70377bd#p8.1
  decision: The Board decided to describe the SS-8 as a small missile in its 1963 Soviet strategic weapons estimate.
  content_domain: intel-analysis
