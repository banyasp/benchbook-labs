- n: 1
  focus: The decision point is whether to keep the information restricted or distribute it through ordinary intelligence channels.
    The account connects the restriction to White House control over disclosure amid domestic political pressure; exclude
    the later collection decisions and any assessment of the underlying intelligence.
  span_range:
  - src:f23360c5ca1a#p6.3
  - src:f23360c5ca1a#p6.3
  decision: The President ordered the withholding of SA-2 intelligence from broader distribution until the White House chose
    to make it public.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to continue intrusive overflights or limit them because of the risk of an incident
    and its diplomatic and domestic consequences. The President approved the resulting schedule; exclude the specific flight
    paths and other operational details.
  span_range:
  - src:f23360c5ca1a#p7.1
  - src:f23360c5ca1a#p9.3
  decision: The National Security Adviser, Secretary of State, and President chose to restrict September U-2 overflights to
    less intrusive coverage.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to relax the existing restrictions in light of concern about possible offensive missiles,
    while weighing the danger of provoking an incident. The President approved a staged authorization; exclude the mission
    track, aircraft vulnerability mechanics, and collection procedures.
  span_range:
  - src:f23360c5ca1a#p14.3
  - src:f23360c5ca1a#p15.1
  decision: The Special Group Augmented and President chose an incremental easing of U-2 restrictions, authorizing a limited
    western-Cuba overflight rather than restoring unrestricted surveillance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision is whether the director should make statements about the photo gap or refrain from doing so, given the
    president’s concern that the issue could pit the intelligence agency against the State and Defense Departments. Exclude
    decisions about intelligence collection and the underlying causes of the photo gap.
  span_range:
  - src:f23360c5ca1a#p30.6
  - src:f23360c5ca1a#p30.6
  decision: The president asks the Director of Central Intelligence to avoid public statements about the photo gap that could
    worsen interdepartmental tensions, and the director agrees.
  content_domain: other:interagency communications
  refusal_sensitivity: medium
  held_out: false
