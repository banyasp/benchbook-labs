episodes:
- n: 1
  focus: The choice was whether to proceed on the weak evidence or shore up the case; the officers believed Dreyfus guilty,
    but the account also describes bias and their awareness of investigative flaws. Focus on the ethics and fairness of manipulating
    evidence and withholding it from the defense, not on how documents were falsified.
  span_range:
  - src:85993ddfae8e#p3.6
  - src:85993ddfae8e#p4.1
  decision: Senior General Staff officers decide to bolster the weak case against Dreyfus with forged material and secretly
    provide a file to the court-martial judges.
  content_domain: other:military justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The choice was whether to keep Picquart in a position to pursue the evidence or remove him from the inquiry. The
    passage gives the institutional reasons—preserving the army’s image and concealing officers’ misconduct; exclude operational
    details of the postings.
  span_range:
  - src:85993ddfae8e#p4.2
  - src:85993ddfae8e#p4.2
  decision: The deputy chief of the General Staff decides to transfer Picquart away after he presses superiors to arrest Esterházy.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The choice was whether to pardon Dreyfus or leave the sentence in force amid the political crisis. The account says
    the government sought a pardon because France was exhausted by the affair and subject to worldwide ridicule; exclude the
    separate question of full exoneration, which came later.
  span_range:
  - src:85993ddfae8e#p6.1
  - src:85993ddfae8e#p6.2
  decision: The president decides to grant Dreyfus a pardon after the second court-martial conviction.
  content_domain: other:executive clemency
  refusal_sensitivity: low
  held_out: false
  natsec: false
