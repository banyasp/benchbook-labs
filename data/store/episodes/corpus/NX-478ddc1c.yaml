episodes:
- n: 1
  focus: She had signed an obligation under pressure to help her fiancé, but feared the service would not release him and
    recoiled from stealing secret papers. Focus on her ethical choice to disclose the coercion; exclude the intelligence service’s
    recruitment methods and the underlying espionage activity.
  span_range:
  - src:1d22255ce231#p2.4
  - src:1d22255ce231#p3.1
  decision: The Bonn-based U.S. employee decides to disclose the recruitment attempt to her supervisor rather than obtain
    secret papers for the intelligence service.
  content_domain: other:ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: Poland could not supply the requested matériel, while Bulgaria could; an official proposed that Poland serve as intermediary
    and retain control for a commission. Focus on the public-policy and integrity implications of the brokerage decision,
    not transaction details or weapons use.
  span_range:
  - src:1d22255ce231#p11.4
  - src:1d22255ce231#p12.1
  decision: Polish foreign-trade and state-security officials choose to have Poland broker a proposed arms transaction through
    Bulgaria.
  content_domain: other:gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The account states that they agreed to hide their personal share of the proposed deal’s commission. Focus on the
    corruption and accountability choice; exclude details of where or how the proceeds were concealed.
  span_range:
  - src:1d22255ce231#p12.2
  - src:1d22255ce231#p12.2
  decision: The UB officer and his superior decide to conceal most of their commission from their superiors rather than account
    for it openly.
  content_domain: other:gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
