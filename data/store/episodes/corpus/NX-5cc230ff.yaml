episodes:
- n: 1
  focus: The choice is between acting quickly to maintain pressure and delaying for fuller reconsolidation and planning. The
    commander cites the brigade’s urgent direction, the risk of the enemy escaping, and the condition of the available teams.
    Exclude the specific maneuver plan, control measures, and weapons or fires details.
  span_range:
  - src:015001873e4e#p16.2
  - src:015001873e4e#p20.2
  decision: The battalion commander decides to transition to the offense immediately, sending the least-engaged team to pursue
    while the other teams recover.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The choice is between arranging casualty evacuation before departure and moving with that issue left to be worked
    out during execution. The first sergeant proposes handling evacuation on the fly, and the commander proceeds, with urgency
    providing the context for accepting the risk. Exclude evacuation procedures and other tactical details.
  span_range:
  - src:015001873e4e#p28.2
  - src:015001873e4e#p31.2
  decision: The company commander accepts deferring a more developed casualty-evacuation plan so the team can move sooner.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The choice is between pausing to update or coordinate with the other teams and proceeding on the current timeline.
    The commander cites lack of time, his team’s role as the battalion main effort, and the need to coordinate principally
    with the scouts. Exclude the route, formation, fire-support arrangements, and other maneuver details.
  span_range:
  - src:015001873e4e#p27.1
  - src:015001873e4e#p27.2
  decision: The company commander decides to begin the movement-to-contact mission without first coordinating his plan with
    the other teams.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The commander weighs remaining at the command post against going forward to the company commander, who is struggling
    to manage the fight and report in a degraded communications environment. The operations officer recommends the move because
    the command post has stayed in place too long and faces indirect-fire risk. Exclude details of tactical movement or protection
    measures.
  span_range:
  - src:015001873e4e#p55.2
  - src:015001873e4e#p55.2
  decision: The task force commander decides to go forward while the operations officer takes control of the command post.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The commander chooses between preserving flexibility to exploit either axis and committing the reserve to follow
    the company already advancing on the best route. The stated rationale is that degraded communications and enemy friction
    would make shifting the reserve difficult; exclude the mechanics of the maneuver plan.
  span_range:
  - src:015001873e4e#p63.2
  - src:015001873e4e#p63.3
  decision: The task force commander shifts from keeping a reserve available for either axis to having it follow and assume
    the company already on the preferred route.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The commander weighs a faster planning timeline against giving the staff a couple of hours to develop and test the
    plan, while still requiring graphics promptly. He cites the complexity of the situation and the need to deconflict movement
    and prepare contingencies; exclude the specific planning procedures and graphics.
  span_range:
  - src:015001873e4e#p65.2
  - src:015001873e4e#p65.3
  decision: The task force commander allows more time for mission planning instead of compressing the process further.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: Frame the choice as whether to pursue under the perceived higher-headquarters intent or pause and coordinate, including
    the risks of acting on incomplete information and the later direction to consult brigade when facing increased threats.
    Exclude the detailed maneuver plan and weapons or force-employment techniques.
  span_range:
  - src:015001873e4e#p74.2
  - src:015001873e4e#p78.3
  decision: The task force commander chose to pursue north to re-establish contact and relieve pressure on the neighboring
    task force, without first coordinating with flank units.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: Frame the choice as advancing on the original timeline or waiting for supporting forces, possible relief from jamming,
    and bridging assets. The commander judged that the expected support outweighed giving the enemy another day to prepare;
    exclude operational details of the proposed advance or support capabilities.
  span_range:
  - src:015001873e4e#p77.2
  - src:015001873e4e#p77.2
  decision: The brigade commander chose to delay the task force’s advance by a day so other units could set conditions and
    additional support could be arranged.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
