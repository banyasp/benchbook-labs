episodes:
- n: 1
  focus: The decision point is the advisor’s choice of a trust-based, noncoercive means of coordinating stakeholders around
    the minister’s stated priorities. Focus on the reasons given—shared understanding, unified effort, and preventing conflicting
    advisory efforts—and exclude operational military tactics.
  span_range:
  - src:22fe4089b36c#p52.1
  - src:22fe4089b36c#p52.2
  decision: A senior military advisor to a partner-nation defense minister chose to use a jointly approved bilingual contract
    to align advisors and staff with the minister’s priorities rather than compel compliance.
  content_domain: other:security-cooperation-advising
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The stated situation is coalition efforts to influence a minister, with resource denial available as leverage. The
    handbook recommends avoiding threats because they may work in the short term but can seriously damage the advisor’s relationship
    with the minister; if a threat must be delivered, another coalition leader should deliver it. Exclude the operational
    details of resource decisions beyond their role as leverage.
  span_range:
  - src:22fe4089b36c#p81.3
  - src:22fe4089b36c#p82.2
  decision: The senior advisor decides whether to threaten the minister with loss of coalition resources to influence the
    minister’s behavior.
  content_domain: other:military-advising
  refusal_sensitivity: low
  held_out: false
  natsec: false
