  focus: The decision point is whether to maintain measured hostility toward white South African leaders or encourage both
    whites and blacks to continue direct negotiations. The source attributes Cohen’s changed view to analysts’ assessments
    of prospects for meaningful change, together with information from respected South Africans; exclude details of intelligence
    collection methods.
