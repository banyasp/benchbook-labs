episodes:
- n: 1
  focus: The decision point is whether to continue negotiating and restraining the army or confront the fedayeen by force.
    The source says he wished to avoid civil war and Palestinian deaths, feared Iraq could tip the balance against him, and
    pursued negotiations; exclude later military tactics and the separate September decision to attack.
  span_range:
  - src:97a0f8052a28#p2.17
  - src:97a0f8052a28#p2.18
  decision: The Jordanian king chose to avoid a showdown with the fedayeen for eighteen months while seeking a modus vivendi.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to meet the hostage-takers’ demand and remove the aides or refuse it, weighing the
    hostages’ release against the effect on loyalists in the army. The source states that he removed them to obtain the hostages’
    release and that the choice antagonized army loyalists; exclude any operational details of the hostage-taking.
  span_range:
  - src:97a0f8052a28#p3.5
  - src:97a0f8052a28#p3.5
  decision: The Jordanian king chose to remove two senior military aides to secure the release of hostages held by the fedayeen.
  content_domain: other:crisis-diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is the king’s choice to initiate military action amid the fedayeen’s seizure of Irbid and the
    wider threat to his rule, after months of hesitation. The source describes his aim of recapturing control of the country;
    exclude battlefield methods, force employment details, and targeting choices.
  span_range:
  - src:97a0f8052a28#p4.3
  - src:97a0f8052a28#p4.5
  decision: The Jordanian king chose to order the army to attack the fedayeen on September 17, 1970, rather than continue
    postponing action.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
