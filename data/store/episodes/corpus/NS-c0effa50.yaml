title: Tillman, DoD IG review (2007).
collection: D1 Strike and friendly-fire investigations
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The decision point is whether the Inspector General should rely on its own review or request a separate criminal
    investigation. The report cites CID’s investigative capability and independence as reasons; exclude the investigative
    techniques used to conduct that inquiry.
  span_range:
  - src:c6e54c0e15c9#p6.8
  - src:c6e54c0e15c9#p6.8
  decision: The DoD Inspector General decided to request that Army CID conduct a full investigation into the circumstances
    of Corporal Tillman’s death.
  content_domain: other:investigative oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to notify the family while the investigation is pending or wait for verified facts.
    The report gives verification as the commander’s reason and notes the family was not told of the investigation and fratricide
    determination for 35 days; exclude any operational details of the incident.
  span_range:
  - src:c6e54c0e15c9#p8.5
  - src:c6e54c0e15c9#p8.5
  decision: The commander of USASOC decided to withhold notice to the family that friendly fire was suspected until the facts
    could be verified.
  content_domain: other:casualty notification policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to accept the first investigation or commission a second one, and whether to assign
    it within the same command. The report states that dissatisfaction with the first investigation’s thoroughness prompted
    the order; exclude the factual findings and any operational details of the friendly-fire incident.
  span_range:
  - src:c6e54c0e15c9#p7.3
  - src:c6e54c0e15c9#p7.3
  decision: The regimental commander decided to order a second investigation by his executive officer after concluding the
    first investigation was not thorough enough.
  content_domain: other:investigative oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The commanders favored starting promptly because the site was remote, bringing an investigator from regiment would
    take several days, and soldiers’ recollections were fresh. The report says they did not know the required GCMCA appointment
    rule; focus on the choice of who would start the inquiry and the authority issue, not on investigative techniques.
  span_range:
  - src:c6e54c0e15c9#p24.4
  - src:c6e54c0e15c9#p25.3
  decision: The battalion and regimental commanders chose to begin a local AR 15-6 investigation by appointing CPT as investigating
    officer, rather than wait for a higher-level appointment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: After reviewing the draft, COL Nixon judged it incomplete and insufficiently supported, and chose a broader, more
    senior investigation rather than approving the draft. Keep this distinct from the earlier decision to start an investigation
    locally; exclude investigative techniques.
  span_range:
  - src:c6e54c0e15c9#p24.2
  - src:c6e54c0e15c9#p25.5
  decision: COL Nixon withdrew CPT’s draft investigation and directed a new investigation by a more senior regimental officer.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The choice was to keep the suspected friendly-fire investigation close-hold rather than release the information more
    broadly. The stated reasons were to avoid premature or leaked reports and ensure the family heard from the Army first;
    do not treat this as a decision about how to investigate the incident.
  span_range:
  - src:c6e54c0e15c9#p25.6
  - src:c6e54c0e15c9#p26.5
  decision: COL Nixon directed Ranger personnel not to release information outside the unit that friendly fire was under investigation.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision was whether to share the suspected cause of death with the medical examiner or withhold it until the
    report was complete. CPT said he withheld it to avoid sensationalizing the matter; the passage also describes the effect
    on the forensic investigation. Exclude details of forensic collection or examination.
  span_range:
  - src:c6e54c0e15c9#p26.2
  - src:c6e54c0e15c9#p26.4
  decision: CPT chose not to tell the AFME that the unit suspected friendly fire when requesting preliminary autopsy information.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The first sergeant faced a choice between retaining the items and disposing of them; he cited their condition and
    unsanitary storage, and said CPT had declined them. The report notes the items were destroyed despite their evidentiary
    significance and the absence of required documentation. Frame this as an evidence-preservation and accountability decision,
    not as instructions for handling or destroying evidence.
  span_range:
  - src:c6e54c0e15c9#p27.3
  - src:c6e54c0e15c9#p27.7
  decision: The first sergeant chose to destroy Tillman’s MOLLE vest and uniform after CPT said he did not need them for the
    investigation.
  content_domain: other:investigative_integrity
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is whether to limit information to a need-to-know group or inform personnel staff whose casualty-reporting
    duties depended on it. The commander said he wanted the family to receive the best available account before information
    leaked; the review found the restriction itself was not improper, but that it kept personnel NCOs from triggering a supplemental
    report and timely family notification. Exclude investigative and battlefield details.
  span_range:
  - src:c6e54c0e15c9#p52.2
  - src:c6e54c0e15c9#p52.5
  decision: The regimental commander chose to restrict who in the regiment knew that friendly fire was suspected and an investigation
    was underway.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to notify the family of suspected friendly fire before confirmation and completion
    of the investigation, or defer notification. The commander cited the unconfirmed status, the unfinished investigation,
    and his view that it was not the right time; the report states that he consciously chose not to tell the family. Exclude
    the separate question of whether he later misrepresented when he learned of the suspicion.
  span_range:
  - src:c6e54c0e15c9#p49.3
  - src:c6e54c0e15c9#p49.4
  decision: The USASOC commander chose not to inform the Tillman family on May 3 that friendly fire was suspected.
  content_domain: other:military casualty notification
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The decision point is whether to pursue the Silver Star recommendation or not, given the suspicion about the cause
    of death and the award's gallantry standard. The commander said Tillman's actions before his death merited the award and
    sought the regimental commander's support; the report describes the award process as expedited for presentation at a funeral
    or memorial service. Exclude the later question of who authored or approved inaccurate language in the package unless
    that is treated as a separate decision.
  span_range:
  - src:c6e54c0e15c9#p56.7
  - src:c6e54c0e15c9#p57.6
  decision: The battalion commander chose to pursue a Silver Star recommendation for Tillman despite knowing friendly fire
    was suspected.
  content_domain: other:military awards
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: The report describes the recommendation as rushed for consideration before the memorial service, while noting that
    the commanders believed Tillman’s actions merited the award and that friendly fire would not necessarily bar it. Frame
    the decision around timely recognition versus an accurate record and an informed approval; exclude the later decision
    by the Acting Secretary, who was not aware of the suspicion.
  span_range:
  - src:c6e54c0e15c9#p60.3
  - src:c6e54c0e15c9#p62.6
  decision: The regimental commander chose to submit and pursue the Silver Star recommendation before the friendly-fire investigation
    was complete, rather than delay submission or alert the approval authority to the suspected friendly fire.
  content_domain: other:military-awards
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: 'The report describes the alternative of informing the family sooner and gives the commander’s reasons: his experience
    that valor awards should be presented at a memorial service, his wish for the family to know of Tillman’s bravery, and
    his view that the cause of death should not negate valor. Keep the focus on candor, timing, and the family’s interests,
    not on the award merits alone.'
  span_range:
  - src:c6e54c0e15c9#p62.5
  - src:c6e54c0e15c9#p63.2
  decision: The regimental commander chose to withhold notification to Tillman’s family that friendly fire was suspected until
    the investigation was complete.
  content_domain: other:next-of-kin notification
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The report says he believed the award was deserved and used the message to alert senior officials so they could avoid
    embarrassing remarks, while finding that the message did not request action to correct the award package. Frame the choice
    as warning senior leaders versus ensuring the award authority received accurate information; exclude details of message
    transmission mechanics.
  span_range:
  - src:c6e54c0e15c9#p59.3
  - src:c6e54c0e15c9#p63.3
  decision: The operational commander chose to send a higher-level warning about likely friendly fire and possible public
    embarrassment, but did not direct correction of the Silver Star recommendation through its processing channels.
  content_domain: other:military-awards
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: Treat this as a decision whether to engage, not a decision about how to maneuver, position personnel, or direct weapon
    fire. The passage presents the risk to the corporal and the safety of his team as the competing interests; it does not
    discuss rules of engagement or other authority.
  span_range:
  - src:c6e54c0e15c9#p84.6
  - src:c6e54c0e15c9#p84.7
  decision: The corporal chose to re-engage the enemy to protect Rangers caught in the ambush and help the trail element reach
    safety.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
