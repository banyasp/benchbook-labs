- n: 1
  focus: The Director weighs the Justice Department’s request for CIA participation against the Agency’s lack of domestic
    jurisdiction and the political and reputational risks of appearing deeply involved in domestic matters. Treat this as
    an authority and oversight decision; exclude the separate question of what information the liaison might provide.
  span_range:
  - src:258abaa9e331#p4.1
  - src:258abaa9e331#p5.1
  decision: The CIA Director decides to reject formal CIA participation in the Justice Department’s Intelligence Evaluation
    Committee while permitting a limited advisory liaison.
  content_domain: intel-oversight
