  held_out: false
  natsec: true
- n: 2
  focus: The choice is between formalizing the committee’s authority in writing and proceeding without a written directive,
    in a setting where committee authority was already unclear. The stated concern was that a directive could create congressional
    oversight and disclosure problems; keep the scenario on accountability and oversight, not committee operations.
  span_range:
  - src:258abaa9e331#p11.1
  - src:258abaa9e331#p11.2
  decision: The White House representative decides to avoid a written directive establishing the Intelligence Evaluation Committee.
