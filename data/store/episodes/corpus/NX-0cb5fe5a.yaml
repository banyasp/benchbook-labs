  natsec: true
- n: 2
  focus: The parties settled on DIA reporting to the Secretary of Defense through the Joint Chiefs, with the Chiefs providing
    input and guidance and a Military Intelligence Board serving temporarily in an advisory role. The choice balanced the
    Secretary’s aim of integration against the Chiefs’ stated concern that an agency under the Secretary alone would be less
    responsive to military needs; exclude collection or other operational techniques.
  span_range:
  - src:7c174cf748cc#p14.2
  - src:7c174cf748cc#p15.3
  decision: The Secretary of Defense and the Joint Chiefs agree on DIA’s authority and reporting arrangement.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The Activation Plan used interdependent functions rather than vertical arrangements, aiming to balance competing
    interests and prevent one Service from dominating particular functions. The passage also identifies the tradeoff: more
    direct reports to the Director and slower coordination. Exclude unrelated organizational chart details.'
  span_range:
  - src:7c174cf748cc#p17.5
  - src:7c174cf748cc#p17.6
  decision: DIA’s organizers choose a horizontal structure to limit Service dominance and internal stovepiping.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The Premier advanced deployment after viewing U.S. nuclear missiles stationed in Turkey as an insult and as evidence
    of a strategic imbalance; the Presidium approved the proposal. The decision point is the strategic choice to deploy, not
    the operational conduct of the deployment or the weapons’ technical characteristics.
  span_range:
  - src:7c174cf748cc#p24.2
  - src:7c174cf748cc#p24.3
  decision: The Soviet Premier and Presidium approve proposing and deploying nuclear missiles in Cuba.
  content_domain: other:strategic force posture
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is the choice between a blockade and direct military action, with action held in abeyance. The
    passage gives war-gaming, rather than DIA intelligence, as the reason the Secretary of Defense supported the blockade;
    exclude operational planning details.
  span_range:
  - src:7c174cf748cc#p29.8
  - src:7c174cf748cc#p30.2
  decision: The Executive Committee chose a naval blockade over immediate direct military action against Cuba.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether DIA should assert authority to coordinate intelligence requirements or defer to the
    Navy and the Atlantic command. The stated reasons include uncertainty about DIA’s authority, Service traditions, and the
    Director’s unwillingness to confront the Navy; exclude boarding procedures and collection methods.
  span_range:
  - src:7c174cf748cc#p31.4
  - src:7c174cf748cc#p31.5
  decision: The Director of DIA chose not to challenge the Navy’s authority over intelligence coordination for quarantine-related
    boardings.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to accept the negotiated exchange or continue the confrontation; the passage describes
    the agreement and the secret handling of the Turkey issue. The secrecy was intended to avoid a public impression that
    the United States had yielded to Soviet pressure; exclude negotiation tactics beyond what is needed to state that rationale.
  span_range:
  - src:7c174cf748cc#p32.4
  - src:7c174cf748cc#p32.4
  decision: The President accepted an agreement exchanging a U.S. pledge not to invade Cuba for the removal of Soviet missiles,
    while leaving the Turkey missile issue for later consideration.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
