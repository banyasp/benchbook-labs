  focus: The Secretary chose to pursue a centralized agency rather than leave intelligence functions fragmented among the
    Services, citing duplication, conflicting estimates, and the need for intelligence that could support flexible-response
    planning. Focus on the policy choice and its stated rationale; exclude the operational details of intelligence collection.
  span_range:
