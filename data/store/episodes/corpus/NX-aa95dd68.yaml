episodes:
- n: 1
  focus: The decision point is whether to redirect scarce investment and industrial capacity toward consumer welfare or retain
    the previous sectoral priorities. The estimate links the shift to consumer dissatisfaction and the prospect of tangible
    quality-of-life gains; exclude operational details of industrial production.
  span_range:
  - src:6388e6700d61#p17.11
  - src:6388e6700d61#p18.8
  decision: The Soviet General Secretary shifted investment priorities toward housing, food processing, and light industry,
    and directed the defense industry to take on more consumer-related production.
  content_domain: other:economic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to proceed with retail price reform or defer it to protect public support and limit
    adverse effects on consumers. The source also cites inflation concerns and public complaints about cooperative-sector
    prices; exclude general discussion of price-system mechanics beyond the policy choice.
  span_range:
  - src:6388e6700d61#p16.6
  - src:6388e6700d61#p16.15
  decision: The Soviet leadership postponed retail price reform rather than implement it on the earlier schedule.
  content_domain: other:economic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: This is an estimative judgment about the likely course of Soviet reform, with gradual implementation assessed as
    more likely than a rapid market transition. The stated rationale is that rapid change would be more disruptive and could
    jeopardize popular support; retain the estimate’s caveat that a radical shift could not be ruled out.
  span_range:
  - src:6388e6700d61#p20.3
  - src:6388e6700d61#p20.3
  decision: The National Intelligence Estimate assessed that Soviet state-sector reforms would most likely continue slowly
    rather than move rapidly toward a market economy.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: 'The report describes a course already being pursued: tolerating ethnic organizations and demands, showing restraint,
    and expecting political institutions to accommodate interests. The decision point weighs that approach against coercive
    limits; exclude operational details about any use of force.'
  span_range:
  - src:6388e6700d61#p38.5
  - src:6388e6700d61#p38.8
  decision: The Soviet General Secretary chooses to address ethnic grievances through dialogue, concessions, and expanded
    public expression rather than relying primarily on coercion.
  content_domain: other:Soviet domestic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The report contrasts proceeding with price reform against delay, and describes the stated aim of avoiding a potentially
    violent public response and buying social peace. Include the policy trade-off and its anticipated consequences, but exclude
    implementation techniques beyond the policy level.
  span_range:
  - src:6388e6700d61#p39.5
  - src:6388e6700d61#p40.3
  decision: The Soviet General Secretary chooses to postpone retail and wholesale price reform while pursuing financial stabilization.
  content_domain: other:Soviet economic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The report describes a chosen redefinition of the Party’s role, including relinquishing rulemaking and day-to-day
    command functions, and a proposed stronger role in policy and political competition. The decision weighs preserving the
    existing apparatus against political restructuring; exclude procedural details of party administration that do not bear
    on that policy choice.
  span_range:
  - src:6388e6700d61#p42.6
  - src:6388e6700d61#p43.8
  decision: The Soviet General Secretary chooses to transform the Communist Party from a command apparatus into a political
    body that guides and persuades, while shifting governing functions toward the Soviets.
  content_domain: other:Soviet political policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The Estimate describes a choice between compromise and measures ranging from lesser restrictions to a major crackdown,
    and assesses that Gorbachev would favor compromise and measures at the lower end of that range. The stated reasons include
    concern that bloodshed would worsen conflicts, doubts about the effectiveness of force, and the costs of broad coercion
    to reform and foreign policy; exclude operational details of any enforcement action.
  span_range:
  - src:6388e6700d61#p46.11
  - src:6388e6700d61#p47.3
  decision: The Soviet leadership under Gorbachev chooses how far to escalate its response to mounting instability.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: During open conflict over whether to retrench or pursue more radical change, Gorbachev moved against the orthodox
    wing at the September 1989 Central Committee plenum, removing five Politburo members. The passage links this choice to
    resistance to reform and Gorbachev’s effort to shift the leadership balance; exclude the separate decision to advance
    the Party Congress date.
  span_range:
  - src:6388e6700d61#p60.10
  - src:6388e6700d61#p61.4
  decision: Gorbachev decides to remove the Politburo’s orthodox wing from leadership positions.
  content_domain: other:political reform
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: This is an estimative judgment about two stated scenarios for the next two years, not a decision by the Soviet leadership.
    Analysts favor continuation of the current course while acknowledging the possibility of a crackdown; the passage gives
    reasons related to political reform’s growing base, the regime’s ability to maintain essential supplies, and the prospect
    of managing turmoil. Exclude the Soviet policy choices themselves.
  span_range:
  - src:6388e6700d61#p56.4
  - src:6388e6700d61#p56.8
  decision: The Intelligence Community’s analysts judge that the Soviet regime is more likely to continue and intensify its
    current reform course than to impose a repressive crackdown.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to grant greater political and economic autonomy within the existing state or permit
    steps toward secession. The stated policy supports federative authority and equal national rights but rejects secession
    and border changes, reflecting the leadership’s effort to accommodate national demands while preserving the union and
    its integrated economy. Exclude detailed institutional proposals except as context for that policy choice.
  span_range:
  - src:6388e6700d61#p68.7
  - src:6388e6700d61#p69.11
  decision: The Soviet General Secretary decides how far to extend republic autonomy while maintaining the union.
  content_domain: other:nationality policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The assessment says the leadership would first exhaust political and economic leverage and treat a general crackdown
    as a last resort. The decision weighs the risk of escalation and damage to reform and international standing against the
    perceived threat that allowing Baltic republics to leave could encourage other republics and endanger regime survival.
    Exclude operational details of coercive measures.
  span_range:
  - src:6388e6700d61#p69.11
  - src:6388e6700d61#p70.7
  decision: The Soviet leadership decides whether to use force against Baltic independence demands or first pursue nonmilitary
    pressure and accommodation.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 12
  focus: The estimate judges deterioration short of anarchy more likely than the alternative scenarios, while recognizing
    significant possibilities of anarchy, military intervention, or positive progress. The decision point is the analysts’
    comparative assessment of those scenarios, based chiefly on expected economic decline and the destabilizing Gorbachev–Russian
    Republic leadership conflict. Exclude subsequent policy choices for the United States, which are not resolved in this
    passage.
  span_range:
  - src:6388e6700d61#p89.5
  - src:6388e6700d61#p89.10
  decision: US Intelligence Community analysts decide which scenario best characterizes the USSR’s prospects over the next
    year.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The decision was to endorse a cautious transition that retained state orders, administered prices, and consumer subsidies,
    rather than move more rapidly toward a market. The source says the approach was intended to garner republic support and
    preserve central power, and carried less short-term risk, while warning that it was unlikely to deliver promised gains
    and could worsen longer-term political problems. Exclude operational implementation details.
  span_range:
  - src:6388e6700d61#p105.7
  - src:6388e6700d61#p106.10
  decision: The Soviet president and Supreme Soviet chose a gradual market-reform program over the faster Shatalin Plan.
  content_domain: other:economic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: 'The passage describes a shift from reformer to consolidator: the president sought to preserve central authority,
    party rule, and the planned economy through tactical expedients rather than broad repression. It gives both his political
    convictions and pressure from traditionalists seeking tougher measures as reasons. Exclude operational methods of repression
    or force.'
  span_range:
  - src:6388e6700d61#p114.7
  - src:6388e6700d61#p114.7
  decision: The Soviet president chose to pursue preservation of the center-dominated union and Communist Party rule without
    broadly using force.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 15
  focus: The analysts selected this scenario as more likely than anarchy, military intervention, or a hopeful transition,
    while acknowledging uncertainty and the potential for sudden departures. The passage grounds the assessment in weakening
    central control, worsening economic and political conditions, and growing unrest. Treat this as an estimative judgment,
    not as a policy decision by Soviet leaders.
  span_range:
  - src:6388e6700d61#p107.5
  - src:6388e6700d61#p107.11
  decision: Intelligence Community analysts assessed deterioration short of anarchy as the most likely Soviet trajectory over
    the coming year.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The estimate weighs four possible outcomes and concludes that system change or fragmentation is more likely than
    continued chronic crisis; it also judges regression least likely to last. Focus on the analytic judgment and the stated
    indicators and uncertainty, not on policy choices for Western governments.
  span_range:
  - src:6388e6700d61#p126.4
  - src:6388e6700d61#p128.3
  decision: The US Intelligence Community estimates which Soviet future is most likely over the next five years.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The estimate says the president will probably avoid rapid restrictions, balancing immediate social stability against
    longer-term economic health. Keep the focus on the policy choice over the pace of reform; exclude the separate decision
    about executive rule.
  span_range:
  - src:6388e6700d61#p151.3
  - src:6388e6700d61#p151.4
  decision: The Russian president decides how quickly to restrict government credit and spending while continuing price liberalization.
  content_domain: other:economic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The estimate predicts selective use of executive rule and says broader measures are less likely. Focus on the scope
    of emergency governing powers and the tradeoff between stability and political legitimacy; exclude operational details
    of suppressing unrest.
  span_range:
  - src:6388e6700d61#p151.5
  - src:6388e6700d61#p151.5
  decision: The Russian president decides whether to use selective executive rule or broader strong-arm measures to address
    local unrest.
  content_domain: other:executive-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
