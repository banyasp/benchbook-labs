episodes:
- n: 1
  focus: The decision point is whether to retaliate and expand U.S. military action or continue to refrain, as the administration
    had after an earlier attack. The passage describes the attack, the recommendation for sustained reprisal, and the political
    context; exclude operational details of the bombing and troop deployments.
  span_range:
  - src:67502d93c7f3#p9.4
  - src:67502d93c7f3#p10.14
  decision: The President chose to move from restraint to major escalation in Vietnam after the Pleiku attack.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to continue the commitment or begin withdrawal, including through negotiation or direct
    action. The passage gives the Secretary’s assessment of the situation and the expected security, human, political, and
    economic costs; treat the withdrawal position as his retrospective conclusion, not as an adopted presidential decision.
  span_range:
  - src:67502d93c7f3#p4.4
  - src:67502d93c7f3#p4.10
  decision: The Secretary of Defense concluded that the United States should have begun withdrawing from South Vietnam.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the Board’s estimative judgment between an inexorable domino effect and a more limited, contingent
    regional impact. The passage gives the Board’s conclusion and reasons, including the time available for circumstances
    to change and the influence of subsequent U.S. policy; exclude the later policy choices made in response to the estimate.
  span_range:
  - src:67502d93c7f3#p6.4
  - src:67502d93c7f3#p6.13
  decision: The Board of National Estimates judged that losing South Vietnam and Laos would not cause rapid, inevitable communist
    takeovers across the rest of the region.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
