episodes:
- n: 1
  focus: The decision point is whether to authorize the recommended overflights or withhold authorization, weighing the need
    for aerial coverage against the risks of aircraft loss and damage to the U.S. position on overflight rights. The passage
    says the President authorized recommended flights and describes the State Department’s concerns; exclude the operational
    details of dividing or scheduling missions.
  span_range:
  - src:f2c3142bf104#p15.4
  - src:f2c3142bf104#p16.6
  decision: The President, acting on recommendations reviewed by the Special Group, authorized recommended U-2 overflights
    of Cuba despite the risks of denied-territory flights.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is how to assess conflicting evidence and whether to conclude that a Soviet missile deployment
    was unlikely or give greater weight to indicators that it might occur. The review says estimators gave substantial weight
    to assumptions about Soviet policy and insufficient weight to indicators; exclude collection methods and later operational
    responses.
  span_range:
  - src:f2c3142bf104#p17.3
  - src:f2c3142bf104#p17.5
  decision: The intelligence estimators responsible for the 19 September estimate judged that Soviet deployment of MRBMs and
    IRBMs in Cuba was unlikely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to circulate sensitive reports broadly or restrict publication to designated recipients
    while preserving reporting to officials with a need to know. The passage identifies the pending-information context and
    the President’s instruction to maintain tight control; exclude collection activity and technical handling of intelligence.
  span_range:
  - src:f2c3142bf104#p20.7
  - src:f2c3142bf104#p21.3
  decision: The President restricted dissemination of information about potentially offensive weapons in Cuba while directing
    that collection, analysis, and reporting to designated officials continue.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
