episodes:
- n: 1
  focus: The decision point is whether to reduce the station’s presence during the months before the final evacuation or remain
    in place. The Chief of Station’s stated reason was the ambassador’s concern that a visible drawdown would cause panic
    among US officials and Vietnamese; exclude the broader question of whether South Vietnam could be saved.
  span_range:
  - src:162619206add#p13.15
  - src:162619206add#p13.17
  decision: The Saigon Chief of Station chose not to begin an earlier drawdown of station personnel.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to continue attempting an evacuation by fixed-wing aircraft or switch to helicopters
    after the runway was attacked and judged unusable. The ambassador inspected the airfield and consulted Washington before
    announcing the helicopter-only plan; exclude the mechanics of operating aircraft or landing sites.
  span_range:
  - src:162619206add#p12.3
  - src:162619206add#p12.6
  decision: The ambassador decided that the evacuation would proceed by helicopter after the airport runway was declared unusable.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to cease the evacuation on the expected timetable or continue while additional people
    sought evacuation, despite the limited remaining helicopter capacity and pressure to end the operation. The account says
    the ambassador bought time to evacuate as many people as possible; exclude the mechanics of helicopter operations and
    the separate presidential order that ultimately ended the evacuation.
  span_range:
  - src:162619206add#p13.18
  - src:162619206add#p15.2
  decision: The ambassador chose to delay ending the evacuation so that more people could leave.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
