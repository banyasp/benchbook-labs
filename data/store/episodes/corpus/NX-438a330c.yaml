episodes:
- n: 1
  focus: The decision point is whether to adopt a national strategic reorientation or continue the existing approach. The
    passage links the strategy’s direction to commission findings that the United States had not sufficiently responded to
    the foreign intelligence threat; exclude the operational methods used to carry out the strategy.
  span_range:
  - src:7d32c0b1514f#p16.11
  - src:7d32c0b1514f#p16.13
  decision: The President approved the 2005 National Counterintelligence Strategy, reorienting the counterintelligence enterprise
    toward proactive strategic operations against foreign intelligence threats.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the 1990s reform favoring analyst-consumer interaction over the earlier practice of keeping
    analysts more isolated. Include the rationale that closer contact was considered necessary for relevant, timely intelligence,
    along with the acknowledged risk of politicization; exclude later operational support examples and general recommendations.
  span_range:
  - src:7d32c0b1514f#p27.3
  - src:7d32c0b1514f#p27.7
  decision: The DCI chose to reduce analysts’ isolation by encouraging closer interaction between intelligence analysts and
    policymakers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to treat reports of a possible sudden Soviet attack as evidence of imminent military
    action or as pressure that did not indicate immediate war preparations. ORE rejected the imminent-attack interpretation;
    exclude later operational responses to the scare.
  span_range:
  - src:7d32c0b1514f#p39.3
  - src:7d32c0b1514f#p39.4
  decision: ORE analysts judged during the March 1948 war scare that the Soviet Union was not prepared to risk an immediate
    military venture in Europe or the Middle East.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to warn of likely invasion or judge it unlikely under the military balance then assessed.
    The analysts favored the latter while identifying troop movements and other developments; exclude any assessment of how
    either side should conduct military operations.
  span_range:
  - src:7d32c0b1514f#p39.5
  - src:7d32c0b1514f#p39.6
  decision: ORE analysts assessed in January 1950 that a North Korean invasion of South Korea was unlikely unless North Korean
    forces developed a clear military superiority.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether reports of Chinese troop movements and warnings justify estimating open Chinese intervention
    as likely, or whether political and military considerations make it unlikely. ORE chose the latter while acknowledging
    Chinese capability; exclude force employment and battlefield matters.
  span_range:
  - src:7d32c0b1514f#p40.4
  - src:7d32c0b1514f#p40.11
  decision: ORE analysts assessed in 1950 that China was unlikely to commit forces openly in Korea, including after reports
    and warnings of possible intervention.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The estimate weighs the possibility that Nasser would accept Soviet backing against the judgment that his primary
    motives were Egyptian nationalism and anti-imperialism. Keep this to the analysts’ estimate of his likely alignment, not
    to later outcomes or operational matters.
  span_range:
  - src:7d32c0b1514f#p54.11
  - src:7d32c0b1514f#p54.13
  decision: CIA analysts judged that Nasser would not permanently align Egypt with the Soviet Union during the Suez confrontation.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The estimate considers whether Israel would deliberately start a war and describes conditions that could alter that
    likelihood, including Western military action or sharply worsened Western-Egyptian relations. Keep the scenario focused
    on the analysts’ forecast and reasoning, not on military plans or methods.
  span_range:
  - src:7d32c0b1514f#p55.5
  - src:7d32c0b1514f#p55.8
  decision: CIA analysts judged that Israel was unlikely to initiate war against Egypt during the early phase of the Suez
    crisis, while identifying circumstances that could raise the risk.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision followed concerns about perceived abuses in the Phoenix program and the effect abuse allegations were
    having on U.S. support for the war. The commander sought to avoid U.S. personnel becoming involved in actions that could
    be construed as UCMJ violations; exclude the article’s operational descriptions of PRU missions.
  span_range:
  - src:7d32c0b1514f#p71.6
  - src:7d32c0b1514f#p71.10
  decision: The MACV commander changed U.S. military personnel assigned to PRUs from commanders to advisers and barred them
    from accompanying PRU teams in the field.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The decision followed heightened attention to the Department’s counterintelligence and security practices during
    the Wen Ho Lee case. The passage says the requirements were largely rolled back as publicity waned and other issues drew
    attention; exclude the broader, recurring reform pattern as a separate decision.
  span_range:
  - src:7d32c0b1514f#p78.4
  - src:7d32c0b1514f#p78.4
  decision: The Department of Energy decided in fall 2006 whether to retain or roll back its extensive employee polygraph
    requirements.
  content_domain: other:counterintelligence-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
