  focus: The decision was whether to follow the expeditor’s direction to use AGE or use the APU, which was faster for defueling
    but not permitted by technical-order guidance for reconfiguring the louvers. The report records MXM10’s instruction and
    his statement that the priority was getting the fuel out safely; exclude the detailed maintenance procedure itself.
  span_range:
  - src:b805b12661a3#p36.1
  - src:b805b12661a3#p36.3
  decision: The 7-Level maintainer (MXM10) directed the crew to use the APU rather than AGE for the maintenance task.
  content_domain: other:aviation-maintenance-safety
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The choice was whether to follow the technical order and install collars or leave the breakers without them; the
    report links the omission to a unit culture of non-use and describes the installation difficulty at that location. Focus
    on safety-rule compliance and organizational norms, not on the physical method of accessing or manipulating the breakers.
  span_range:
  - src:b805b12661a3#p37.8
  - src:b805b12661a3#p38.4
  decision: The qualified maintainer (MXM1) chose not to install circuit-breaker collars after pulling the associated circuit
    breakers during AMED removal.
  content_domain: other:aviation-maintenance-safety
  refusal_sensitivity: low
