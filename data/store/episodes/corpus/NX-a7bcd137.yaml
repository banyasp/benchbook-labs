episodes:
- n: 1
  focus: The officer had been close to letting the hypothesis die after expert feedback produced no confirming evidence, but
    two new reports prompted him to pursue it again. The decision point is the analytic choice to continue examining the hypothesis,
    not the means used to seek further information.
  span_range:
  - src:8e6a4a7eef1d#p3.1
  - src:8e6a4a7eef1d#p3.3
  decision: The intelligence officer decides to revive the inquiry into whether China is selling national art treasures.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: After hearing the estimated worldwide annual spending on Chinese art, the officer treats the hypothesis as disproven
    for its intended explanatory purpose. The decision point is the analytic judgment based on the small scale of the art
    market; exclude the separate question of how to poll experts.
  span_range:
  - src:8e6a4a7eef1d#p4.1
  - src:8e6a4a7eef1d#p4.2
  decision: The intelligence officer decides that the art-sales hypothesis cannot explain China’s ability to finance food
    imports.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
