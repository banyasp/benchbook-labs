episodes:
- n: 1
  focus: The decision point is whether to impose binding contractual requirements rather than leave supply-chain cybersecurity
    voluntary; the passage states that the Department of Defense implemented a rule mandating compliance in response to cyber
    supply-chain risks. Focus on the policy choice and its rationale, not the technical details of the security controls.
  span_range:
  - src:17bb08096283#p26.3
  - src:17bb08096283#p26.4
  decision: The Department of Defense establishes mandatory cybersecurity requirements for contractors and subcontractors
    handling covered defense information.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to continue sourcing from Supermicro or sever the relationship in response to the reported
    implant finding. The passage reports Apple’s confirmation and its action, but also notes that Supermicro denied the allegations
    and that researchers and the NSA expressed skepticism; do not treat the underlying allegation as uncontested fact.
  span_range:
  - src:17bb08096283#p42.1
  - src:17bb08096283#p42.2
  decision: Apple’s procurement decision-makers chose to sever the company’s relationship with Supermicro in 2015 after Apple’s
    research confirmed hardware implants on motherboards it had purchased.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to retain the prior self-certification approach or require measurable certification
    assessed by third parties and applied to prime and relevant subcontractors. The passage gives the rationale of protection
    gaps, inconsistent security practices, and concerns about self-certification; exclude the model’s detailed certification
    levels except where needed to explain the policy choice.
  span_range:
  - src:17bb08096283#p56.4
  - src:17bb08096283#p57.2
  decision: The Department of Defense chose to make CMMC certification a cybersecurity requirement for contract awards, replacing
    contractor self-attestation with independent assessment.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The passage describes the Navy’s concern that Lenovo-provided maintenance or remote access could compromise servers
    already integrated into Aegis, and states that the Aegis program office and Lockheed Martin were required to evaluate
    alternatives. Treat the decision as evaluating alternatives to mitigate the identified risk; do not imply that they ultimately
    replaced the servers or that a final procurement decision is documented.
  span_range:
  - src:17bb08096283#p65.2
  - src:17bb08096283#p65.3
  decision: The Aegis program office and Lockheed Martin respond to Lenovo’s acquisition of IBM’s server business by evaluating
    alternate hardware solutions rather than leaving the supply-chain risk unaddressed.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
