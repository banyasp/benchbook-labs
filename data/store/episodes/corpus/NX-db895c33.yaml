episodes:
- n: 1
  focus: The chair chose budget transparency and accountability rather than centering the inquiry on sensational allegations
    of domestic abuses. The stated grounds included taxpayers’ right to understand public spending and the possibility of
    tracing intelligence activities and priorities; exclude the later technical details of intelligence operations.
  span_range:
  - src:7ddbb4b616c6#p7.5
  - src:7ddbb4b616c6#p8.5
  decision: The House committee chair chose to make intelligence budgets the committee’s initial investigative focus.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision balanced public disclosure and congressional scrutiny against the asserted risk that disclosure would
    help foreign intelligence services estimate U.S. capabilities. The Director also argued that budget totals alone would
    not enable meaningful public or congressional judgment; exclude details of intelligence targets or methods.
  span_range:
  - src:7ddbb4b616c6#p8.6
  - src:7ddbb4b616c6#p9.2
  decision: The Director of Central Intelligence chose not to testify publicly about the intelligence budget, but to provide
    budget details in executive session.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The chair asserted that classification was an executive-branch function and that the committee could declassify and
    release information unilaterally; the surrounding inquiry concerned whether intelligence had correctly assessed the lead-up
    to war. The executive branch objected on national-security and source-protection grounds. Exclude the assessment’s operational
    details and discuss only the authority and disclosure judgment.
  span_range:
  - src:7ddbb4b616c6#p11.2
  - src:7ddbb4b616c6#p11.5
  decision: The House committee chair chose to release part of a classified intelligence assessment during the committee’s
    review of intelligence performance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The compromise followed a cutoff of access and disagreement over who controlled disclosure. The parties chose consultation
    and a presidential final-review role rather than a court test, balancing continued congressional investigation against
    executive concerns about release. Exclude any operational content of the classified materials.
  span_range:
  - src:7ddbb4b616c6#p12.2
  - src:7ddbb4b616c6#p12.4
  decision: The President and House committee leaders chose a compromise restoring the committee’s access to classified materials
    while making the President the final judge of future public releases.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The White House directed officials not to testify in open session, and the stated reason was that such hearings would
    benefit foreign intelligence services. The committee instead heard witnesses debating the legality and oversight of covert
    action. Exclude the operational particulars of the actions under investigation.
  span_range:
  - src:7ddbb4b616c6#p13.3
  - src:7ddbb4b616c6#p13.4
  decision: The White House chose to bar CIA officials from open-session testimony about covert-action investigations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The House chose a presidential certification condition rather than allowing the committee to release the report on
    its own authority. Supporters invoked national-security concerns, while debate also reflected members’ uncertainty about
    the report’s contents and the fact that portions had already leaked. Exclude the leaked report’s operational details.
  span_range:
  - src:7ddbb4b616c6#p15.7
  - src:7ddbb4b616c6#p16.3
  decision: The House chose to bar release of the committee’s report unless the President certified that it would not adversely
    affect CIA intelligence activities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
