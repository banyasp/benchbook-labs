episodes:
- n: 1
  focus: The decision followed a deadlock between military and civilian leaders amid extensive destruction and casualties.
    The source describes the Emperor’s exceptional intervention and indicates that he wished to end the war; exclude the Cabinet’s
    subsequent formal vote as a separate decision.
  span_range:
  - src:3d3eb713d16b#p12.3
  - src:3d3eb713d16b#p14.2
  decision: The Emperor directs Japan to accept the Potsdam terms rather than continue fighting or insist on the military
    leaders’ conditions.
  content_domain: other:surrender policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: Washington debated rejecting the proviso, which some believed could prolong fighting, against accepting it as a way
    to support postwar reform. The Secretary of State’s reply allowed the Emperor to remain but subordinated the Emperor and
    government to the Allied Supreme Commander; exclude the separate question of how the reply was transmitted.
  span_range:
  - src:3d3eb713d16b#p14.3
  - src:3d3eb713d16b#p14.5
  decision: The Secretary of State prepares an Allied reply accepting Japan’s Emperor-related proviso subject to the Supreme
    Commander’s authority.
  content_domain: other:surrender terms and postwar governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: Japan had not formally surrendered, Allied bombing was continuing, and the Japanese public did not know of the surrender
    offer or Allied response. The decision was to inform the public directly by leaflet and radio rather than leave the news
    to diplomatic channels; the stated urgency was to save lives of soldiers still fighting. Exclude the production and delivery
    logistics.
  span_range:
  - src:3d3eb713d16b#p15.2
  - src:3d3eb713d16b#p17.2
  decision: The White House directs the War Department and OWI to notify the Japanese people directly that their government
    offered to surrender and the Allies accepted.
  content_domain: other:wartime public-information policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: After renewed opposition and concern that the military might try to continue the war, the Emperor chose an unprecedented
    public announcement in his own voice. The source identifies the broadcast’s expected impact and the need to make the capitulation
    known; exclude the attempted seizure of the recordings and other operational details.
  span_range:
  - src:3d3eb713d16b#p19.6
  - src:3d3eb713d16b#p20.2
  decision: The Emperor decides to announce the capitulation to his subjects in a radio broadcast as well as through diplomatic
    channels.
  content_domain: other:surrender communications policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
