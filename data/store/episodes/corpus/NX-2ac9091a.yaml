episodes:
- n: 1
  focus: The choice was whether to continue the free service or end it. The stated reasons were that welfare support and facilities
    in southern Iraq had become comparable to those in other operational theatres, whereas the free service had originally
    recognized the difficult conditions and limited welfare support; exclude the logistics of delivering parcels.
  span_range:
  - src:3a52bd7be356#p12.3
  - src:3a52bd7be356#p12.4
  decision: The Minister of State for the Armed Forces decided to end the free packet service for personnel on Operation TELIC
    from 8 April 2004.
  content_domain: other:military-personnel-welfare
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The policy choice was whether to retain the 14-day desired notice period or extend it to 21 days. The report links
    the longer period to preserving the volunteer ethos and the goodwill of Reservists’ families and employers, while noting
    that operational requirements had left some TELIC 1 Reservists with only four days’ notice; exclude mobilisation procedures.
  span_range:
  - src:3a52bd7be356#p25.3
  - src:3a52bd7be356#p25.3
  decision: The Ministry of Defence revised its desired notice period for Reservist mobilisation from 14 to 21 days.
  content_domain: other:military-personnel-welfare
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to retain the aircraft’s scheduled procurement timeline or explore ways to acquire
    it earlier. The passage describes an overstretched and fragile air bridge, effects on rest and recuperation and operational
    effectiveness, and increased demand expected from Afghanistan; it records a direction to explore funding, not a final
    procurement decision. Exclude aircraft fitting and transport implementation details.
  span_range:
  - src:3a52bd7be356#p16.3
  - src:3a52bd7be356#p17.6
  decision: The Chief of the Defence Staff directed the Ministry of Defence to explore innovative funding arrangements for
    early procurement of a fifth C-17 aircraft.
  content_domain: other:defence-capability-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is the Chiefs of Staff’s choice between the military-preferred deployment of a brigade and a more
    limited immediate deployment, given personnel strain and uncertainty about the evolving situation. Keep the focus on the
    command-level choice and its sustainability rationale; exclude operational details of the deployment.
  span_range:
  - src:3a52bd7be356#p27.7
  - src:3a52bd7be356#p28.9
  decision: The Chiefs of Staff recommended deploying HQ ARRC and an associated battlegroup to Iraq while retaining the brigade
    in the UK for possible later deployment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is the Government’s choice to defer closure of the option while making no immediate commitment.
    The stated reasons were that there was no pressing military reason to send troops and little pressure from the US; exclude
    details of possible deployments beyond this policy choice.
  span_range:
  - src:3a52bd7be356#p29.5
  - src:3a52bd7be356#p29.6
  decision: The UK Government decided to keep open the possibility of sending additional troops to Iraq until around the NATO
    Summit, rather than commit to sending them immediately.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is Cabinet’s approval of the proposed deployment in light of competing assessments of feasibility,
    personnel pressures and concurrent commitments in Iraq. Include the Chiefs of Staff’s assessment that the demands were
    manageable and the personnel concerns recorded in the passage; exclude operational planning details.
  span_range:
  - src:3a52bd7be356#p30.3
  - src:3a52bd7be356#p31.7
  decision: The Cabinet approved the deployment of UK forces to Helmand in Afghanistan.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is the choice of an allowance designed to provide an immediate benefit, including to lower-paid
    personnel. The passage says tax-free pay was considered but rejected because it would not target the lowest paid and would
    be difficult to administer; exclude unrelated later support measures.
  span_range:
  - src:3a52bd7be356#p33.6
  - src:3a52bd7be356#p33.7
  decision: The Defence Secretary, in agreement with the Chancellor, chose to introduce a tax-free Operational Allowance for
    personnel completing operational tours rather than use tax-free pay while deployed.
  content_domain: other:military-personnel-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The decision was whether to act early on research into veterans’ health, despite an uncertain cost estimated at about
    £3 million. The official argued that the late response after the previous Gulf conflict damaged trust; exclude the study’s
    later findings and research methods.
  span_range:
  - src:3a52bd7be356#p62.2
  - src:3a52bd7be356#p62.8
  decision: The Parliamentary Under-Secretary of State for Defence agreed that the Government should support a large-scale
    study of the physical and psychological health of personnel deployed on Op TELIC.
  content_domain: other:military health policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is whether decompression should be required for formed units or left optional, with a formal route
    to opt out. The stated basis was military judgment that it promotes adjustment and reintegration, despite the absence
    of evidence of clinical efficacy; exclude the practical conduct of decompression.
  span_range:
  - src:3a52bd7be356#p64.3
  - src:3a52bd7be356#p64.6
  decision: The Ministry of Defence set a policy that formed units should undergo decompression unless the chain of command
    approved an opt-out.
  content_domain: other:military personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The decision was whether to provide equivalent welfare support to in-patients rather than leave them without benefits
    available during operations, and whether to bypass the delay of usual staff circulation. The account cites the loss of
    entitlements and the Vice Chief of Defence Staff’s insistence that the proposal could not bear that delay; exclude clinical
    treatment and hospital security arrangements.
  span_range:
  - src:3a52bd7be356#p54.2
  - src:3a52bd7be356#p54.8
  decision: The Service Personnel Board agreed an expedited package of welfare measures for hospitalised Service personnel,
    including extending the Operational Welfare Package and family-support arrangements.
  content_domain: other:military welfare policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The decision point is the choice between burial in theatre and return to the UK, and the MOD’s stated policy and
    exception for cases where repatriation was not possible or safe. The passage links the policy shift to the difficulty
    families faced travelling to graves after the Falklands conflict; exclude the practical methods for managing contamination
    risks.
  span_range:
  - src:3a52bd7be356#p83.8
  - src:3a52bd7be356#p84.5
  decision: The MOD adopted a policy to repatriate the remains of Service Personnel to the UK wherever possible, subject to
    exceptional circumstances.
  content_domain: other:repatriation-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: The decision point is whether to wait for the new compensation and pension schemes or provide an interim benefit,
    and on what eligibility basis. The passage cites the need to resolve uncertainty before conflict and limits the benefit
    to substantial relationships; exclude later scheme design beyond this interim decision.
  span_range:
  - src:3a52bd7be356#p88.7
  - src:3a52bd7be356#p89.4
  decision: The Government extended, with immediate effect, ex-gratia benefits to qualifying unmarried partners of Service
    Personnel who died as a result of service related to conflict.
  content_domain: other:bereavement-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The decision point is whether to retain existing compensation levels or raise payments, including for existing claimants.
    The passage records officials’ concern about disparities and the Defence Secretary’s view that the existing maximum was
    indefensible; exclude technical details of calculating individual awards.
  span_range:
  - src:3a52bd7be356#p74.3
  - src:3a52bd7be356#p74.6
  decision: The Government doubled the maximum Armed Forces Compensation Scheme lump-sum payment for the most serious injuries
    and increased all payments by at least 10 percent, applying the increases retrospectively.
  content_domain: other:military-compensation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The choice was between retaining the two-year limit as a firm rule and allowing consideration of longer or indefinite
    occupation; the recommendation noted that some bereaved spouses might seek to stay indefinitely. Capture the agreed safeguard
    requiring ministerial consultation, and exclude the later anecdotal recollection about how the change was handled.
  span_range:
  - src:3a52bd7be356#p93.3
  - src:3a52bd7be356#p93.5
  decision: The Defence Secretary agreed to make the policy on bereaved spouses’ retention of Service Family Accommodation
    less prescriptive, subject to ministerial consultation before withdrawal of entitlement after two years.
  content_domain: other:military personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: The choice was whether to add an independent reviewer or rely on the existing Board process and administrative measures,
    including improved family communication. The stated reasons against adding the reviewer were potential delay and no guarantee
    of added value, credibility or acceptability; exclude the separate question of the Board’s investigative findings.
  span_range:
  - src:3a52bd7be356#p103.4
  - src:3a52bd7be356#p103.6
  decision: The MOD personnel chief advised against adding an independent reviewer to assess whether a Board of Inquiry had
    completed its work successfully before publication.
  content_domain: other:inquiry oversight and disclosure policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The choice was between routinely providing next of kin the full report and using staged disclosure, while providing
    coroners the unredacted report. The instructions cite the need to observe information and privacy laws and explain that
    Part 1 synthesizes relevant information; include the use of identifiers in place of redacted names, but exclude the underlying
    investigative material itself.
  span_range:
  - src:3a52bd7be356#p110.2
  - src:3a52bd7be356#p110.10
  decision: The MOD decided that next of kin would initially receive Part 1 of a Board of Inquiry report, with requests for
    supporting material in Part 2 handled under the Freedom of Information Act.
  content_domain: other:inquiry disclosure policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The decision addressed how to manage coronial jurisdiction and workload while retaining RAF Brize Norton as the repatriation
    site. Focus on the alternatives considered and the aim of avoiding Oxfordshire’s involvement; exclude procedural details
    beyond the policy choice.
  span_range:
  - src:3a52bd7be356#p125.5
  - src:3a52bd7be356#p126.3
  decision: MOD and Ministry of Justice officials agreed to continue repatriations through RAF Brize Norton while notifying
    the deceased person’s local coroner and transferring the body there after the ceremony.
  content_domain: other:coronial policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The decision concerned whether the Ministry of Defence should fund costs associated with the inquest backlog, seek
    Reserve funding, or leave the costs to other departments or local government. Focus on the competing responsibility and
    funding arguments, the Treasury’s position, and the limited contribution; exclude the broader chronology of backlog clearance.
  span_range:
  - src:3a52bd7be356#p121.4
  - src:3a52bd7be356#p123.7
  decision: The Secretary of State for Defence agreed that the Ministry of Defence would contribute £125,000 toward the additional
    costs of the Oxfordshire Coroner’s office for 2006/07.
  content_domain: other:coronial funding policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 19
  focus: The decision followed concerns about delays, inconsistent practice, and the need for a step change in handling the
    process from investigation through inquest. Focus on choosing a central coordination unit while leaving Boards of Inquiry
    to the Services; exclude general descriptions of the Unit’s later support activities.
  span_range:
  - src:3a52bd7be356#p115.9
  - src:3a52bd7be356#p116.8
  decision: MOD ministers agreed to establish a single Defence Inquests Unit urgently to coordinate the Ministry’s work with
    coroners and drive progress on inquests.
  content_domain: other:coronial policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 20
  focus: The decision point is whether to permit US witnesses to participate and provide the requested report and explanatory
    representative, or to limit cooperation to other forms of evidence. The account gives US concerns about the material requested
    and possible UK civil actions, and records limits on disclosure and attendance; exclude the separate handling of the recording
    after it was leaked.
  span_range:
  - src:3a52bd7be356#p131.3
  - src:3a52bd7be356#p134.7
  decision: The US Government decided what forms of cooperation to provide to UK inquests into deaths involving US forces.
  content_domain: other:inquest evidence and cooperation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 21
  focus: At their April 2007 meeting, the ministers considered legal advice and representation separately from logistical
    and moral support. They agreed that their departments lacked resources to fund representation and that increased family
    and coroner support, alongside greater disclosure, would go a long way toward meeting families’ needs; the subsequent
    statement did not address legal representation. Exclude later legislative changes to legal-aid eligibility.
  span_range:
  - src:3a52bd7be356#p138.2
  - src:3a52bd7be356#p138.8
  decision: The ministers responsible for defence and justice decided not to fund family legal representation directly, relying
    instead on enhanced practical support and disclosure.
  content_domain: other:legal representation at inquests
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: The decision changed the previous approach, which distinguished among categories of operational death, to a formal
    ceremony for all operational deaths. The stated reasons were the difficulty of distinguishing deaths in direct enemy action
    from deaths in accidents supporting operations, and public and family expectations that those who died on operations be
    honoured. Exclude descriptions of ceremony procedures.
  span_range:
  - src:3a52bd7be356#p147.10
  - src:3a52bd7be356#p147.10
  decision: The Ministry of Defence decided that all deaths on operations would receive a formal repatriation ceremony.
  content_domain: other:military bereavement and commemoration policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 23
  focus: The MOD considered routine letters from the Prime Minister or Secretary of State against continuing the existing
    practice. Its advice cited the risk of generic, impersonal letters, the undesirability of distinguishing which deaths
    merited sympathy, questions about including Reservists and civilians, and difficulty in mass-casualty cases. Exclude later
    adjustments to who wrote to families during the Iraq operation.
  span_range:
  - src:3a52bd7be356#p149.2
  - src:3a52bd7be356#p149.4
  decision: The Ministry of Defence decided to retain the existing practice of one senior-officer condolence letter, with
    additional ministerial notes only in exceptional cases.
  content_domain: other:military bereavement policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 24
  focus: The decision arose while UK forces were already deployed in Iraq and some units and specialists were under pressure
    from operational commitments. The MOD advised that the Helmand deployment was achievable without serious damage to Harmony,
    although senior officials expressed concern about the risks; exclude the separate earlier decision to join the Iraq invasion.
  span_range:
  - src:3a52bd7be356#p159.7
  - src:3a52bd7be356#p160.11
  decision: The Cabinet approved deploying a UK military force to Helmand in January 2006.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 25
  focus: Officials assessed that fundraising might not reach the amount needed, and the MOD directed that it cover the balance
    required by the trustees. The decision point is whether to provide public funds to complete the memorial; exclude the
    later funding request, for which this passage does not state an outcome.
  span_range:
  - src:3a52bd7be356#p153.6
  - src:3a52bd7be356#p153.6
  decision: The MOD directed that it underwrite the Armed Forces Memorial project by £3.3 million in June 2006.
  content_domain: other:public memorial funding
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 26
  focus: After visits to injured personnel on civilian wards, the MOD assessed that a dedicated military environment could
    support recovery better, although it considered the clinical care at Selly Oak excellent. The decision point is the choice
    to establish a military-managed ward rather than rely only on the existing civilian-ward arrangements; exclude clinical
    treatment methods.
  span_range:
  - src:3a52bd7be356#p162.10
  - src:3a52bd7be356#p162.11
  decision: The MOD decided to establish a Military Managed Ward at Selly Oak hospital for injured Service Personnel.
  content_domain: other:military medical-care policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 27
  focus: The decision point is whether to authorize the attack given the estimated civilian casualties, the anticipated military
    advantage, and the possibility of reducing collateral harm. Keep the focus on authorization and the proportionality standard;
    exclude operational details of conducting the strike.
  span_range:
  - src:3a52bd7be356#p186.4
  - src:3a52bd7be356#p187.2
  decision: The Defence Secretary approved the proposed attack on a location believed to contain a senior Iraqi commander,
    after receiving a proportionality assessment; CENTCOM later approved it subject to a condition intended to reduce collateral
    damage.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 28
  focus: The decision point is whether to compensate the family after officials concluded that the deaths were caused by the
    attack, while the precise circumstances remained uncertain. Consider the stated legal and precedent-based reasons for
    declining compensation; exclude the separate decision to authorize the attack.
  span_range:
  - src:3a52bd7be356#p188.4
  - src:3a52bd7be356#p189.9
  decision: The Defence Secretary and Ministry of Defence chose not to offer compensation to the Hamoudi family for deaths
    and damage resulting from the attack.
  content_domain: other:compensation-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 29
  focus: The decision point is whether to collate and analyze existing reports despite acknowledged limits on reliability
    and completeness. The stated reasons included the desire for more accurate figures and concern about public and parliamentary
    scrutiny; exclude the separate question of how to conduct military operations.
  span_range:
  - src:3a52bd7be356#p191.3
  - src:3a52bd7be356#p192.3
  decision: The Defence Secretary directed an analysis of incident reports to estimate civilian deaths caused by UK forces
    after major combat operations.
  content_domain: other:casualty-accounting-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 30
  focus: The FCO weighed using available aggregate figures against the risk of endorsing unreliable estimates that the Government
    would have to defend to Parliament and the media. It recommended emphasizing individual atrocities instead; exclude the
    later decision to run a monitoring trial.
  span_range:
  - src:3a52bd7be356#p196.9
  - src:3a52bd7be356#p197.8
  decision: The FCO recommends that the UK avoid adopting an overall civilian-casualty estimate and focus public communications
    on specific terrorist atrocities.
  content_domain: other:government casualty reporting
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 31
  focus: The Prime Minister agreed to try daily monitoring so the Government could assess whether the information was credible
    and useful publicly, rather than rely only on the FCO’s recommendation to emphasize individual incidents. The decision
    concerns whether and how government should develop an aggregate casualty picture, not operational collection methods.
  span_range:
  - src:3a52bd7be356#p197.9
  - src:3a52bd7be356#p198.4
  decision: The Prime Minister agrees to a trial period of monitoring Iraqi civilian fatalities using available information.
  content_domain: other:government casualty reporting
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 32
  focus: The campaign urged an independent inquiry, arguing that casualty information was needed to assess compliance with
    humanitarian-law obligations and plan healthcare. The Prime Minister rejected the need for an inquiry, citing the Iraqi
    Ministry of Health figures as the most accurate available and disputing that an inquiry was legally required; exclude
    the separate question of how casualties should be counted.
  span_range:
  - src:3a52bd7be356#p207.2
  - src:3a52bd7be356#p207.5
  decision: The Prime Minister rejects commissioning a full independent inquiry into civilian casualties to meet the UK’s
    international legal obligations.
  content_domain: other:government accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 33
  focus: The Inquiry describes the Government’s consideration of casualty figures in response to media and NGO reporting,
    including the stated aim of sustaining domestic support. It also records that studies suggesting Coalition forces caused
    more deaths did not prompt further assessment or reassessment; do not infer that the Government deliberately falsified
    figures or treat this as a decision about operational tactics.
  span_range:
  - src:3a52bd7be356#p222.3
  - src:3a52bd7be356#p222.7
  decision: The UK Government chose to treat civilian-casualty estimates chiefly as a response to criticism, seeking figures
    that could rebut claims about Coalition responsibility and show insurgent responsibility.
  content_domain: other:casualty-accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 34
  focus: The decision point is the British Prime Minister’s response to Iraq’s requests for military equipment and a reactor,
    in the context of asking what Iraq wanted for its friendship during the Suez crisis. Focus on the policy choice and the
    stated diplomatic context; exclude technical details of the equipment and reactor.
  span_range:
  - src:3a52bd7be356#p236.7
  - src:3a52bd7be356#p236.8
  decision: The British Prime Minister agreed to Iraq’s requests for a fighter squadron and a nuclear reactor, and indicated
    that the promised tanks could be found.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 35
  focus: The decision point is Britain’s response to the immediate challenge to Kuwait’s independence, including military
    deployment and diplomatic action. Focus on the government’s choice and its stated commitment to Kuwait; exclude operational
    details of the force’s deployment.
  span_range:
  - src:3a52bd7be356#p237.4
  - src:3a52bd7be356#p237.4
  decision: The British government sent an expeditionary force to Kuwait and sought Arab League recognition of Kuwait’s independence
    after Iraq claimed sovereignty and mobilised troops on the border.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
