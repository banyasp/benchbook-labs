- n: 2
  focus: The decision point is whether to authorize the requested support promptly or delay while pursuing a political solution.
    Focus on authorization, timing, and the competing interests described; exclude the mechanics of air support or target
    reacquisition.
  span_range:
  - src:ad86b455269e#p8.3
  - src:ad86b455269e#p8.4
  decision: The UN Secretary-General’s Special Representative chose whether and when to authorize close air support for UNPROFOR
