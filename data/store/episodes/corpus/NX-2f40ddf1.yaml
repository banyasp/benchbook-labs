- n: 3
  focus: The decision point is whether to direct the wing’s operations centrally or delegate planning and execution within
    broad objectives while retaining authority to task by exception. Focus on the delegation, retained authority, and the
    stated circumstances; exclude strike-package planning and other operational methods.
