episodes:
- n: 1
  focus: The decision point is the DCI’s commitment to continue declassification while withholding material when release could
    jeopardize sources or methods, harm liaison relations, or interfere with the Agency’s mission. Exclude operational collection
    methods; the issue here is disclosure authority and its limits.
  span_range:
  - src:559101d4874b#p21.7
  - src:559101d4874b#p21.7
  decision: The Director of Central Intelligence decides whether to continue releasing Cold War intelligence materials, committing
    to further release subject to legal limits.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision balanced concern that a permanent intelligence organization could become an American Gestapo against
    the need to prevent another strategic surprise and provide policymakers timely intelligence. The chosen model coordinated
    departmental intelligence and produced high-level estimates; exclude later disputes over implementation.
  span_range:
  - src:559101d4874b#p28.3
  - src:559101d4874b#p28.4
  decision: The President chose to establish the Central Intelligence Group as a limited coordinating organization rather
    than a more independent intelligence agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The chair treated the committee’s task as estimating intelligence, not making appropriations or force-policy recommendations;
    the training recommendation was handled separately. Exclude the merits of universal military training itself and the Army’s
    budget advocacy.
  span_range:
  - src:559101d4874b#p37.2
  - src:559101d4874b#p38.8
  decision: The chair of the interdepartmental intelligence estimates committee refused to include a recommendation for universal
    military training in its intelligence estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The committee chose an evidence-qualified short-term assessment amid alarming reports and disagreement among departments,
    rather than endorsing an imminent-war warning. The stated basis included the absence of reliable evidence of Soviet intent
    to act within that period; exclude military deployment or response options.
  span_range:
  - src:559101d4874b#p36.3
  - src:559101d4874b#p38.9
  decision: The interdepartmental Intelligence Advisory Committee adopted an estimate that the Soviet Union was unlikely to
    initiate military action within 60 days.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to absorb the harvest shortfall domestically or import grain; the source says the leadership
    chose imports so the population would not bear the full brunt. Exclude CIA’s later forecasting work, which is discussed
    separately.
  span_range:
  - src:559101d4874b#p55.3
  - src:559101d4874b#p55.4
  decision: The Soviet leadership ordered purchases of 11 million tons of wheat and flour after the near-disastrous 1963 harvest.
  content_domain: other:economic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is the choice between the familiar Cobb-Douglas form and an alternative in which returns to capital
    decline as capital per worker rises. The source says debate over the appropriate form was inconclusive and CIA continued
    with the simpler, familiar form; exclude the Soviet growth forecasts themselves.
  span_range:
  - src:559101d4874b#p48.3
  - src:559101d4874b#p48.3
  decision: CIA analysts continued using the Cobb-Douglas production-function form for Soviet economic analysis rather than
    adopting the alternative declining-returns form.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to retain the earlier estimates of rapid growth or revise them in light of the reviewed
    evidence. The source says the change followed careful internal review of the physical estimates underlying spending estimates
    and identified a procurement plateau; exclude operational military assessments beyond this analytic revision.
  span_range:
  - src:559101d4874b#p59.3
  - src:559101d4874b#p59.3
  decision: The CIA’s Office of Strategic Resources revised its assessment of Soviet defense-spending trends to recognize
    a procurement plateau and slower overall growth.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: In June 1982, the President chose to expand the restrictions despite CIA assessments that the USSR could meet its
    gas commitments and could do without US compressors, while Western Europe opposed the US measure. The stated aim was to
    prevent foreign subsidiaries and licensees from supplying equipment; exclude operational details of pipeline construction.
  span_range:
  - src:559101d4874b#p69.6
  - src:559101d4874b#p70.2
  decision: The President extended the Siberia-to-Europe pipeline sanctions to cover foreign subsidiaries and licensees of
    US companies.
  content_domain: other:economic sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: In the early 1980s, the Deputy Director for Intelligence tried to end the dollar estimates, but pressure from Pentagon
    and congressional consumers led to their resumption. The passage also notes that these estimates reflected the Intelligence
    Community’s best estimates of underlying physical quantities and that alternatives could have been more alarmist; exclude
    debates over the estimates’ accuracy except as context for the decision.
  span_range:
  - src:559101d4874b#p77.5
  - src:559101d4874b#p78.2
  decision: CIA leadership resumed dollar-cost estimates of Soviet defense programs despite efforts to abolish them.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is the analysts’ choice between a single-successor model and collective leadership, including
    the alternative triumvirate they considered. They favored a single successor because they expected the transition to prioritize
    regime stability and believed Stalin could predetermine the transfer; exclude the passage’s broader discussion of later
    political developments.
  span_range:
  - src:559101d4874b#p87.4
  - src:559101d4874b#p87.5
  decision: CIA analysts assessed that a single successor, probably a senior Politburo member, was more likely than collective
    leadership to succeed Stalin.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is the estimate’s choice between expecting continued competition without general war and judging
    that Soviet aims could lead the leadership to provoke war. The estimate grounded its judgment in its view of Soviet objectives
    and the belief that those objectives could not be fully achieved without war; exclude operational military details not
    discussed in this passage.
  span_range:
  - src:559101d4874b#p90.6
  - src:559101d4874b#p91.3
  decision: National intelligence estimators judged that the Soviet Union might deliberately provoke general war during 1950–1954,
    with the greatest danger in 1952.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The decision point is the estimate’s choice between a frontal attack and less direct efforts to gain advantage. It
    cited Soviet concern for the risks to its own system and country, and awareness of US power; exclude other judgments in
    the surrounding passage about Germany unless separately treated.
  span_range:
  - src:559101d4874b#p91.4
  - src:559101d4874b#p91.4
  decision: National intelligence estimators judged that the Soviet Union would not launch a frontal military attack before
    the end of 1952 and would instead seek gains in former colonial regions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The estimate weighed the context of sharpened US rhetoric, NATO exercises, and Soviet activity, and concluded that
    the activity did not show authentic leadership fears of imminent conflict. Include the estimate’s acknowledgment of Soviet
    perceptions of a mounting US challenge and uncertainty about how Moscow assessed recent exercises; exclude operational
    details of the exercises or reconnaissance.
  span_range:
  - src:559101d4874b#p111.4
  - src:559101d4874b#p111.5
  decision: The analysts preparing SNIE 11-10-84 decide whether to interpret recent Soviet military-political activity as
    evidence of belligerent intent or imminent fear of conflict, or as activity explained by ordinary circumstances and planning;
    they choose the latter interpretation.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The estimate judged Gorbachev’s intent to be bold and visionary, and discussed possible paths of change; the NSA
    Director dissented, arguing that reform served party power and predicting backlash or retreat. Include the stated reasons
    and competing assessments, but exclude any implication that the estimate itself determined US policy toward the USSR.
  span_range:
  - src:559101d4874b#p115.3
  - src:559101d4874b#p116.2
  decision: The authors of NIE 11-18-87 decide whether to assess Gorbachev as pursuing bold systemic reform or primarily revitalizing
    party power; the estimate’s main judgment is that he intends significant change, while the NSA Director presents the alternative
    view.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The estimate assessed Gorbachev’s likely approach over the next two years, weighing economic pressures and new thinking
    against the importance of security issues and the Soviet goal of constraining SDI. Include the forecast and its stated
    evidentiary limits; exclude later policy choices by either government.
  span_range:
  - src:559101d4874b#p121.5
  - src:559101d4874b#p122.3
  decision: The analysts preparing SNIE 11-9-86 decide whether to forecast substantial Soviet compromise on arms control and
    security issues or continued resistance; they judge that Gorbachev is unlikely to compromise and may wait for a successor
    to the US President.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The decision point is whether to describe the policy as a radical departure or to qualify that judgment by framing
    it as consistent with a traditional Leninist strategy. The assessment recognized radical change but retained the qualifying
    frame; the text links analytic caution to the perceived policy importance of the judgment and a bias against overly optimistic
    conclusions. Exclude the underlying US policy response.
  span_range:
  - src:559101d4874b#p127.3
  - src:559101d4874b#p128.2
  decision: CIA Soviet foreign-policy analysts chose how to characterize Gorbachev’s policy in the February 1989 assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: 'The decision point is how to present foreign-policy implications amid substantial uncertainty: make a more predictive
    estimate or lay out several possible futures. The estimate chose the latter and considered four scenarios, including their
    implications for the West; exclude operational responses to those scenarios.'
  span_range:
  - src:559101d4874b#p125.5
  - src:559101d4874b#p126.2
  decision: The mid-1991 intelligence estimators chose to frame their assessment of the USSR’s future as speculative rather
    than predictive.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The decision point is executive authorization and assignment of responsibility for a high-altitude reconnaissance
    program. The President approved unconventional management to avoid Defense Department bureaucracy and service rivalries,
    and later settled the management question in favor of CIA because he did not want uniformed military personnel flying
    over the Soviet Union. Exclude the operational conduct of flights and collection techniques.
  span_range:
  - src:559101d4874b#p146.2
  - src:559101d4874b#p146.5
  decision: The President decides to authorize the U-2 project under CIA management, with Air Force assistance, rather than
    leave it under military control.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The decision point is the estimative judgment made amid conflicting interpretations of telemetry, trajectory, and
    reentry data. CIA analysts and scientific panels supported the smaller-missile assessment, while the Air Force and DIA
    retained a dissent; exclude technical collection methods and focus on the judgment, its evidentiary basis, and how disagreement
    was recorded.
  span_range:
  - src:559101d4874b#p153.4
  - src:559101d4874b#p154.4
  decision: The Intelligence Community estimate process decides to assess the SS-8 as comparable to the SS-7 in payload, rather
    than as a very large missile.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is CIA’s assessment of whether the Soviets would undertake a SAM upgrade that could affect the
    strategic balance. The estimate gives reasons for judging it unlikely, including Soviet conservatism, the uncertain value
    of such defenses, and the risk of detection as a treaty violation. Exclude the separate discussion of how intelligence
    might monitor treaty compliance.
  span_range:
  - src:559101d4874b#p155.2
  - src:559101d4874b#p155.4
  decision: CIA’s 1971 estimate judges that the Soviet Union is unlikely to upgrade its SAM systems for ABM defense.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The decision point is whether to reopen the estimate after Khrushchev announced a reduction and some CIA analysts
    thought his stated manpower figure might be correct. Include the DCI’s decision to seek a harder review and the resulting
    judgment; exclude the underlying intelligence-collection methods.
  span_range:
  - src:559101d4874b#p169.2
  - src:559101d4874b#p170.2
  decision: The DCI directs a special national intelligence estimate to reassess Soviet military manpower rather than rely
    on the existing estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The decision point is the interagency judgment in NIE 11-4-59 and related estimates, set against the Air Force’s
    dissenting view that the Soviets sought decisive superiority and conquest. Include the stated reasoning about deterrence,
    the risks of general war, and preferences for nonmilitary means; exclude operational force-employment details.
  span_range:
  - src:559101d4874b#p171.3
  - src:559101d4874b#p172.2
  decision: National estimators choose to assess Soviet strategic forces primarily as deterrent and retaliatory capabilities,
    rather than as preparations for a policy of military conquest.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 23
  focus: The decision point is the estimate of up to 100 deployed ICBMs by mid-1959 and up to 500 by mid-1961, despite lower
    estimates within the intelligence community. Include the stated uncertainty and prudential preference for worst-case judgments;
    exclude technical details of missile systems.
  span_range:
  - src:559101d4874b#p168.3
  - src:559101d4874b#p168.5
  decision: The national estimators adopt a worst-case projection of a rapid Soviet ICBM buildup in NIE 11-10-57 rather than
    the lower projections favored by some agencies.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 24
  focus: The proposed Team B exercise offered an alternative to relying only on the regular interagency estimating process;
    the DCI first rejected the proposal, then authorized it. The passage gives the proposal’s rationale—concern that official
    estimates were too complacent about Soviet capabilities and intentions—and describes the exercise’s limited contribution
    and subsequent leak. Exclude the substantive truth of Team B’s claims except insofar as it explains the decision’s context.
  span_range:
  - src:559101d4874b#p186.5
  - src:559101d4874b#p187.3
  decision: The DCI decides whether to authorize an outside panel to review the same intelligence data as the official estimators
    and produce a critique and alternative estimate.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 25
  focus: 'The passage describes an intervention in the estimating process: the National Security Adviser sought to clarify
    a draft judgment that contradicted a recent public statement by the Secretary of Defense, and the DCI asked the estimates
    board to review it. The language changed, but the underlying finding did not. Exclude any technical assessment of the
    missile itself.'
  span_range:
  - src:559101d4874b#p191.5
  - src:559101d4874b#p191.5
  decision: The DCI decides whether to ask the estimates board to revisit draft NIE language after the National Security Adviser
    objects to its assessment of a Soviet missile variant.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 26
  focus: The DCI introduced these assessments in the 1979 estimate to go beyond static indicators and evaluate force effectiveness;
    the passage also explains the objections that such assessments involved judgments about US and Western forces and that
    the military services considered those judgments a Pentagon responsibility. The controversy culminated in a split estimate
    the following year. Exclude operational war gaming or any technical method for assessing forces.
  span_range:
  - src:559101d4874b#p196.4
  - src:559101d4874b#p197.2
  decision: The DCI decides to include quasi-dynamic assessments of what forces could accomplish in a National Intelligence
    Estimate, rather than rely only on static measures of force size and performance.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 27
  focus: The choice was whether to compare Soviet capabilities only with US forces or to account for NATO forces and capabilities
    against the Warsaw Pact. The account says the DCI and DDI continued US-USSR comparisons despite requests for alliance
    comparisons, in part because adding allied forces could diminish the perceived Soviet threat.
  span_range:
  - src:559101d4874b#p198.2
  - src:559101d4874b#p198.3
  decision: The DCI and Deputy Director of Intelligence delayed adopting NATO-Warsaw Pact force comparisons in overall assessments
    to Congress and the public.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 28
  focus: The decision was whether to recognize fundamental changes in Soviet doctrine and war-fighting approach or retain
    a cautious assessment. The NIE said the evidence was not sufficiently convincing or compelling to warrant judging that
    such changes were already taking hold; exclude the later historical evaluation except as context for why the judgment
    mattered.
  span_range:
  - src:559101d4874b#p203.4
  - src:559101d4874b#p203.4
  decision: The estimators of NIE 11-3/8-88 chose a wait-and-see judgment on whether Gorbachev was bringing fundamental changes
    to Soviet security and military doctrine.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 29
  focus: The choice was whether to explain the doctrinal revisions and force reductions mainly as an economic measure or also
    as reflecting a new worldview and political objectives. The estimate favored the economic explanation; exclude the separate
    DIA dissent except as evidence that alternative interpretations remained available.
  span_range:
  - src:559101d4874b#p206.3
  - src:559101d4874b#p206.4
  decision: The estimators of NIE 11-14-89 assessed Gorbachev’s military initiatives as primarily an effort to shift resources
    from defense to the civilian economy.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 30
  focus: In January 1958, officials chose to reduce the list of recipients from its larger existing circulation to about 200,
    while allowing the bulletin a wider readership. The stated reason was concern that translated books containing anti-Soviet
    material were reaching a significant number of readers; exclude the broader censorship system and other distribution decisions.
  span_range:
  - src:559101d4874b#p226.3
  - src:559101d4874b#p226.4
  decision: The Central Committee’s Department of Agitation and Propaganda, in consultation with the Politburo, decided to
    reduce the authorized recipients of PROGRESS’s classified translations.
  content_domain: other:censorship and information-control policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 31
  focus: The passage links a CIA forecast of an oil-production plateau and decline to later increases in investment, employment,
    and imported equipment, while attributing the policy shift to Soviet leaders’ concern about the forecast. The causal link
    is presented as a reasonable conjecture, not established from open decision records; exclude claims that the report definitively
    caused the changes.
  span_range:
  - src:559101d4874b#p235.3
  - src:559101d4874b#p236.2
  decision: Soviet senior leadership chose to shift investment and oil-sector policies toward fuel production in response
    to forecasts of an approaching production crisis.
  content_domain: other:economic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 32
  focus: The passage identifies the data series, the rise that preceded its suppression, and the decision to stop open publication.
    It suggests agencies were reluctant to report bad news, but does not establish who ordered the decision or the full rationale;
    exclude any claim that an American report’s later effect on health policy is known.
  span_range:
  - src:559101d4874b#p237.3
  - src:559101d4874b#p237.5
  decision: Soviet statistical authorities chose to stop openly publishing infant-mortality data after rates began rising.
  content_domain: other:statistical transparency
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 33
  focus: The censorship organization initially restricted the book because it believed the estimates used secret Soviet statistics;
    an investigation found the underlying data came from open publications, after which the book was freed. Focus on the access
    decision and its stated basis, not on the book’s technical statistical methods.
  span_range:
  - src:559101d4874b#p239.2
  - src:559101d4874b#p239.2
  decision: GLAVLIT chose to release a US Census Bureau book from restricted storage into a general reference section after
    an interagency investigation.
  content_domain: other:censorship and publication access
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 34
  focus: The decision point is whether to make the historical analytic record public or keep more of it classified, balancing
    democratic accountability and public understanding against risks to lives and security relationships. Exclude the mechanics
    of document review; the passage describes review as a safeguard, not as the decision at issue.
  span_range:
  - src:559101d4874b#p263.4
  - src:559101d4874b#p264.2
  decision: The Director of Central Intelligence decides to release a large tranche of CIA analytic records on the Soviet
    Union and pursue further declassification.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 35
  focus: The decision point is how to respond to a radar under construction after the Intelligence Community assessed that
    its primary purpose was ballistic-missile tracking, contrary to the Soviet claim that it was for space tracking. Consider
    the treaty and policy response; exclude technical details about the radar or intelligence collection.
  span_range:
  - src:559101d4874b#p266.2
  - src:559101d4874b#p266.2
  decision: The Reagan Administration decides to declare the Krasnoyarsk radar a violation of the ABM Treaty and call for
    its dismantling.
  content_domain: other:arms-control policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 36
  focus: 'The decision point is how to allocate analytic capacity after the Soviet collapse: retain the former concentration
    on Russia or redirect resources toward cross-border threats and specialized topics. The stated rationale is the changing
    nature of threats and their cross-border character. Exclude general claims about adapting analysis that do not identify
    this resource shift.'
  span_range:
  - src:559101d4874b#p276.5
  - src:559101d4874b#p276.8
  decision: The CIA’s analytic leadership decides to shift analytic resources away from a Russia-centered structure toward
    transnational issues and specialized centers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 37
  focus: The decision point is whether to retain the estimate that Soviet spending was roughly equal to or slightly above
    U.S. spending, or revise it in light of the personnel and procurement comparisons. Focus on the analytic judgment and
    the Director’s reasons; exclude operational military details.
  span_range:
  - src:559101d4874b#p285.3
  - src:559101d4874b#p285.5
  decision: The Director of Central Intelligence decided to direct analysts to revisit the estimate of Soviet military expenditures.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 38
  focus: The decision point is whether to treat Sihanoukville as a major shipment route based on the Army’s inference from
    the volume of munitions reaching its forces, or withhold that assessment until hard evidence was available. Focus on the
    analysts’ evidentiary standard and the competing assessment; exclude collection methods.
  span_range:
  - src:559101d4874b#p286.4
  - src:559101d4874b#p286.4
  decision: CIA analysts decided not to assess Sihanoukville as a major port for North Vietnamese arms shipments absent hard
    evidence.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 39
  focus: The decision point is whether to pass along the incoming volume or reduce it through summaries and, at times, responses
    on the President’s behalf. Focus on the stated concern that the President was overwhelmed and the Advisor’s confidence
    in making those responses; exclude broader claims about how presidential decisionmaking should work.
  span_range:
  - src:559101d4874b#p289.5
  - src:559101d4874b#p290.2
  decision: The National Security Advisor decided to reduce the volume of material sent to the President from about 300 pages
    to about 40 pages a day.
  content_domain: other:presidential intelligence management
  refusal_sensitivity: medium
  held_out: false
  natsec: false
