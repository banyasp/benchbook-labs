- n: 2
  focus: The President had a committee’s recommendation to remove cryptology from Joint Chiefs of Staff control and place
    it under the Secretary of Defense, rather than retain the existing arrangement. Focus on the organizational authority
    decision and the stated failures of AFSA and interservice coordination; exclude operational collection details elsewhere
    in the history.
  span_range:
