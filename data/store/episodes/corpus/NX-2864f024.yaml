  held_out: false
  natsec: true
- n: 3
  focus: The envoy weighed recognizing the chief’s assistance against the diplomatic cost of appearing to endorse the Nationalist
    government during the conflict. The source records his recommendation and rationale; it does not establish the final disposition
    of the citation.
  span_range:
  - src:1edc44efcebe#p5.16
  - src:1edc44efcebe#p6.6
  decision: The U.S. special envoy urged the Secretary of the Navy to delay recognition of the KMT intelligence chief.
