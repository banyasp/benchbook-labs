- n: 2
  focus: The decision point is whether to deactivate the SSU or preserve its intelligence role under a different organizational
    arrangement. The source describes intelligence value alongside diplomatic concerns about association with the service
    and objections to its activities; exclude operational methods.
  span_range:
  - src:1edc44efcebe#p4.4
