  natsec: false
- n: 4
  focus: The envoy faced whether to continue mediation or conclude that his mission had become futile. The source cites the
    parties’ irreconcilable positions, lack of trust and his diminishing usefulness; exclude speculation about what alternative
    diplomatic strategy might have succeeded.
  span_range:
