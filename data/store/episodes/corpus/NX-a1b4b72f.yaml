  natsec: true
- n: 2
  focus: The decision arose after the chairman believed the administration had directed that parts of a project not be briefed
    to the committee. He chose to call agency units and cite the statutory duty rather than accept the limits; focus on the
    oversight authority and rationale, not the project’s operational details.
  span_range:
  - src:41f54b9bbdd5#p4.4
  - src:41f54b9bbdd5#p4.5
  decision: The HPSCI chairman decides to challenge restrictions on what the Intelligence Community briefs to Congress and
    invoke its duty to keep Congress fully informed.
