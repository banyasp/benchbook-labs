  focus: The decision was whether to accept politically charged amendments or insist on a clean bill as a condition of restoring
    the committee’s regular authorization process. The stated reasons were that such amendments had blocked prior bills and
    that authorization was key to effective oversight; exclude unrelated details of budget-review procedures.
  span_range:
  - src:41f54b9bbdd5#p6.5
  - src:41f54b9bbdd5#p6.7
  decision: The HPSCI chairman and ranking member decide to pursue intelligence authorization bills while removing political
    amendments that had stalled earlier bills.
  content_domain: intel-oversight
