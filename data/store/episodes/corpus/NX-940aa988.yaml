- n: 1
  focus: The decision point is whether to provide temporary assistance on the police department’s request and under what conditions.
    The stated reasons were the expected large crowds, the department’s need for an additional radio frequency, and the lack
    of available support from other agencies. Keep the focus on interagency assistance and its terms, not on how monitoring
    or communications were conducted.
  span_range:
  - src:dcab370e2ac5#p2.2
  - src:dcab370e2ac5#p2.3
  decision: The Office of Security decided to provide radio communications support to the Metropolitan Police Department for
    the 1969 inauguration, on the condition that CIA employees retain control of the vehicles and drivers.
  content_domain: other:interagency assistance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether the CIA should publish the requested second, unclassified edition for general law-enforcement
    use. The source states that the suggestion was rejected because the CIA considered it improper for the Agency to publish
    law-enforcement material for general usage. Exclude the earlier distribution of copies, for which the passage gives no
    comparable decision rationale.
  span_range:
  - src:dcab370e2ac5#p4.1
  - src:dcab370e2ac5#p4.2
  decision: The Office of Security decided to reject the Law Enforcement Assistance Administration’s request to republish
    an unclassified edition of the CIA-compiled reference booklet.
  content_domain: other:publication policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
