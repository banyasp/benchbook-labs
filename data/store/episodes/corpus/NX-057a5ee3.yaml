  focus: The passage describes the Great Leap target of doubling the reported 1957 harvest and says the Ministry was anxious
    to fulfill and overfulfill that goal; it later revised the 1958 figure downward. Treat this as a decision about official
    statistical reporting, not as a judgment about the actual harvest or a military decision.
  span_range:
  - src:ac4836dd3788#p8.3
  - src:ac4836dd3788#p9.3
  decision: The Ministry of Agriculture chose to report grain production of 375 million tons for 1958.
  content_domain: other:statistical governance
  refusal_sensitivity: low
