  natsec: false
- n: 2
  focus: The passage describes this as a response to the shortage of statistical workers, alongside attacks on experts and
    a training program intended to show that the masses could do the work. Keep the scenario at the level of staffing and
    statistical-governance policy; exclude the separate decision to report particular production figures.
  span_range:
  - src:ac4836dd3788#p9.3
  - src:ac4836dd3788#p9.4
  decision: The Chinese regime chose to shift statistical work from trained personnel to the broad masses and political cadres
    during the Great Leap.
  content_domain: other:statistical governance
