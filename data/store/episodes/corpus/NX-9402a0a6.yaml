- n: 1
  focus: 'The analysts judged that disturbing developments did not establish imminent Soviet attack: absent specific evidence
    of offensive military preparations, they interpreted them as a war of nerves intended to test US resolve and sustain Soviet
    bargaining position. Exclude the broader organizational dispute over intelligence missions and later assessments of other
    crises.'
  span_range:
  - src:b7a7afa6ac3b#p17.7
  - src:b7a7afa6ac3b#p18.6
  decision: ORE analysts decide whether to assess near-term Soviet military action in Europe as likely in July 1946.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: ORE assessed an armed invasion as unlikely until US troops withdrew or the Communists attempted unification by coup,
    while judging eventual armed conflict probable. The passage gives contemporaneous reasons, including Soviet withdrawal,
    road improvements, troop movements, and South Korean provocation concerns; exclude later reassessments and operational
    military decisions.
  span_range:
  - src:b7a7afa6ac3b#p19.4
  - src:b7a7afa6ac3b#p19.5
  decision: ORE analysts decide how to assess the likelihood of a North Korean armed invasion of South Korea in October 1948.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: Despite reports of Chinese troop movements in Manchuria and heightened speculation, ORE concluded that Beijing would
    not risk war with the United States. The passage describes the analysts’ reasoning about the risks of intervention and
    its potential effects on Soviet and Chinese interests; exclude later operational events and decisions by military or political
    leaders.
  span_range:
  - src:b7a7afa6ac3b#p20.3
  - src:b7a7afa6ac3b#p20.4
  decision: ORE analysts decide whether to assess Chinese intervention in the Korean War as likely in September 1950.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the analysts’ choice between an estimate of open intervention and one of restraint, despite
    Chinese capability to affect the war. Focus on their stated expectation that intervention risked war with UN nations;
    exclude operational military considerations beyond that policy-level estimate.
  span_range:
  - src:b7a7afa6ac3b#p21.4
  - src:b7a7afa6ac3b#p21.6
  decision: ORE analysts estimated whether Chinese Communist forces would intervene openly in Korea if UN forces crossed the
    38th parallel, concluding they probably would not.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is the analysts’ judgment between direct military participation by Albania, Yugoslavia, or Bulgaria
    and non-participation. The stated reasons were the international repercussions and the risk of drawing the unprepared
    USSR into world war; exclude any operational details of the Greek conflict.
  span_range:
  - src:b7a7afa6ac3b#p23.6
  - src:b7a7afa6ac3b#p23.7
  decision: CIG analysts assessed whether neighboring armies would directly assist Greek Communist guerrillas, concluding
    that such participation was unlikely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: 'The decision point is the analysts’ interpretation of the prolonged visit: evidence of alliance difficulties or
    not. They acknowledged that treaty negotiations might be difficult but judged serious trouble unlikely because Mao was
    an orthodox Stalinist and firmly controlled the Chinese Communist Party; exclude broader claims not needed to reconstruct
    this estimate.'
  span_range:
  - src:b7a7afa6ac3b#p24.5
  - src:b7a7afa6ac3b#p24.5
  decision: ORE analysts judged whether Mao’s extended Moscow visit signaled serious trouble in the Sino-Soviet relationship,
    concluding that it probably did not.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
