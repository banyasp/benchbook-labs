title: Donovan’s Original Marching Orders
collection: studies-in-intelligence
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The President weighs the proposed central service against the existing intelligence and government structure, endorsing
    it to address the need for comprehensive information relevant to national strategy. Focus on the authorization and its
    authority and scope; exclude the operational details of proposed activities and later jurisdictional disputes.
  span_range:
  - src:33a21fc9703b#p4.2
  - src:33a21fc9703b#p6.3
  decision: The President decides to authorize a Coordinator of Information and endorse a broad, initially vague intelligence
    mandate.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Secretary of War weighs the proposed military status against preserving the regular military chain of advice
    to the President, reasoning that a second military channel could function as a second Chief of Staff. Focus on the authority
    and institutional boundary decision; exclude any operational activity contemplated for the service.
  span_range:
  - src:33a21fc9703b#p13.4
  - src:33a21fc9703b#p16.4
  decision: The Secretary of War decides to oppose a military status for the Coordinator and support the role only as a civilian
    position.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The appointee faces the choice of leaving the information role for an Army command and military status, or remaining
    to develop the new service. Focus on his stated preference to make the information job substantive before seeking a commission
    later; exclude the proposed theory of guerrilla warfare and other operational details.
  span_range:
  - src:33a21fc9703b#p16.4
  - src:33a21fc9703b#p16.4
  decision: The COI appointee decides to remain in the civilian information post rather than take an Army command and military
    commission at that time.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision is whether to create a central coordinating office rather than rely on existing departmental intelligence
    units and scattered information. The proposal argues that existing arrangements lacked comprehensive, long-range analysis
    needed for strategic planning; the President’s order establishes the office and its authority. Exclude operational collection
    methods and any claim that the order settled later jurisdictional disputes.
  span_range:
  - src:33a21fc9703b#p33.4
  - src:33a21fc9703b#p36.1
  decision: The President decides to establish the Coordinator of Information and authorize it to gather, analyze, and share
    national-security information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision is to intervene in the overlap between the two offices rather than leave their functions in conflict.
    The stated reason is to prevent inconsistencies and conflicts; the passage notes that establishing the Office of Facts
    and Figures ended the Coordinator’s morale function. Exclude broader conclusions about the President’s administrative
    style or other jurisdictional disputes.
  span_range:
  - src:33a21fc9703b#p29.2
  - src:33a21fc9703b#p29.2
  decision: The President directs the presidential adviser handling the issue to prevent conflicts between the Coordinator
    of Information and the Office of Facts and Figures.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
