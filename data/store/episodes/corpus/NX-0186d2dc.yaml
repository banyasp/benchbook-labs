  focus: The decision point is whether the senator should seek broad release or leave the information unavailable for scholarly
    review; the stated reason was to enable informed conclusions about disputed allegations and names. Treat this as an oversight
    and disclosure decision, not as a judgment on the allegations themselves.
  span_range:
  - src:a05458db02d8#p8.5
  - src:a05458db02d8#p8.5
  decision: A US senator sought release of all VENONA information so scholars could assess the evidence amid controversy over
    wartime Soviet espionage.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The choice arose as the Navy needed to expand its cryptanalytic workforce during the war; advocates argued that women
    should be full members, with an opportunity to demonstrate leadership, rather than auxiliaries. Include the personnel-status
    decision, but exclude details about cryptanalytic work or operations.
  span_range:
  - src:a05458db02d8#p30.4
  - src:a05458db02d8#p30.5
  decision: US Navy leadership admitted women into the Navy’s ranks rather than treating them as an auxiliary.
  content_domain: other:military personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to formalize the growing training effort or leave it without official status; the source
    connects the choice to the volume of incoming employees and the program’s lack of formal standing. Exclude the cryptanalytic
    curriculum and operational work assignments that followed training.
  span_range:
  - src:a05458db02d8#p49.2
  - src:a05458db02d8#p49.4
  decision: The Signal Security Agency’s leader chose to formalize the training program and designated an experienced codebreaker
    to lead it.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The candidate considered using the allegation publicly, but the Army Chief of Staff persuaded him not to, citing
    the risk that disclosure could compromise intelligence capabilities important to ongoing operations and saving lives.
    Keep the decision focused on the political disclosure choice and its national-security rationale; exclude the technical
    details of codebreaking.
  span_range:
  - src:a05458db02d8#p51.1
  - src:a05458db02d8#p51.1
  decision: The Republican presidential candidate chose not to publicize an allegation about the president and prewar intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The President’s order shifted policy from broad exemptions toward scheduled downgrading and eventual declassification,
    while allowing secrecy to continue when release would pose a danger to national security. The passage also bars classification
    to conceal errors or avoid embarrassment; treat the stated balancing and safeguards as the rationale, and do not rely
    on the article’s speculation about political motives as established fact.
  span_range:
  - src:a05458db02d8#p58.5
  - src:a05458db02d8#p59.1
  decision: The President chose to impose a new government-wide declassification policy with time-based review and release
    requirements.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: Faced with a mandate to review records at least 30 years old and a massive workload, the NSA Director established
    a program and narrowed its initial focus to four historical subject areas. Center the scenario on the policy choice to
    prioritize review under the declassification mandate; exclude the technical contents of the listed records.
  span_range:
  - src:a05458db02d8#p60.4
  - src:a05458db02d8#p60.6
  decision: The NSA Director chose to establish a declassification program and prioritize selected historical records for
    review.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: In 1953, the vice director chose a panel rather than leaving the adjutant general to handle classification issues
    alone. The stated context was recurring classification errors, including overclassification and underclassification, and
    a particular need for help with technical material; exclude the panel’s later operational details.
  span_range:
  - src:a05458db02d8#p72.3
  - src:a05458db02d8#p72.4
  decision: The NSA vice director established a Classification Advisory Panel to assist the adjutant general with classification
    questions.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: In 1966, the deputy director accepted centralizing policy, downgrading, and declassification responsibilities while
    leaving advisory officers distributed across organizations. The stated reason was that separating them from technical
    and operational areas would erode their specialized expertise; exclude the article’s later description of the program’s
    structure.
  span_range:
  - src:a05458db02d8#p75.1
  - src:a05458db02d8#p75.2
  decision: The NSA deputy director centralized classification-management staff responsibility while retaining decentralized
    classification advisory officers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The 2020 program policy limited formal requirements for CAO review and preserved ad hoc reviews for education, training,
    and compliance. The stated concerns were that existing review mandates had not been coordinated with the program office
    and that CAO advice does not transfer individual classification responsibility; exclude the mechanics of classification
    marking.
  span_range:
  - src:a05458db02d8#p78.5
  - src:a05458db02d8#p78.5
  decision: The NSA classification advisory program prohibited mandatory CAO reviews without written approval from the program
    manager, while allowing ad hoc advisory reviews.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
