  focus: The decision concerns how to respond to evidence that a child had spied on the office and participated in revolutionary
    activity. The account gives the mother’s cooperation and wish to remove the girl from revolutionary influence as context,
    and later describes the chief’s choice to send them to safety rather than prison; exclude the surveillance that uncovered
    the activity.
  span_range:
  - src:2e6ac15a4ecc#p16.4
  - src:2e6ac15a4ecc#p17.6
  decision: The Warsaw Okhrana chief decides to expel the mother and induce her to take her daughter out of Warsaw, rather
    than imprison them.
