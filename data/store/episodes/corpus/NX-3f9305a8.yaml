- n: 2
  focus: The decision followed the exposure and publication of the agents’ identities and addresses. The stated reasons were
    that exposed agents would be useless, the service was discontinuing operations, and termination was intended to protect
    agents whose identities were known to terrorists; exclude the agents’ surveillance activities and the mechanics of their
    termination paperwork.
  span_range:
  - src:2e6ac15a4ecc#p7.5
  - src:2e6ac15a4ecc#p9.1
  decision: Paris Okhrana leadership decides to dissolve its exposed non-Russian agent network and terminate its agents rather
    than retain them.
