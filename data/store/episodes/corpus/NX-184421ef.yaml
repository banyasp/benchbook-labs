- n: 1
  focus: The decision concerned whether to follow the liaison and message-clearance directive or act independently. The source
    attributes the choice to the team leader’s wish to minimize Australian participation and resentment of the authority given
    to a sergeant; exclude the later technical details of communications.
  span_range:
  - src:3994cecd2f96#p2.3
  - src:3994cecd2f96#p2.3
  decision: The LAGARTO team leader chose to disregard the SRD directive requiring him to consult the Australian liaison officer
    and clear messages with him.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was whether to proceed with the existing relief plan or change it, and whether to inform the team. The
    stated reason was intelligence indicating that a questionnaire provided to the teams was in Japanese hands, raising concern
    that the relief plan might also be compromised; exclude the subsequent movements and observation methods.
  span_range:
  - src:3994cecd2f96#p5.2
  - src:3994cecd2f96#p5.2
  decision: SRD command changed the planned relief of LAGARTO and withheld the change from the team after suspecting the Japanese
    might know the relief plan.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
