title: The Fall of Lima Site 85
collection: studies-in-intelligence
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The decision point is whether to evacuate earlier, sacrificing the installation’s remaining capabilities, or continue
    operating while relying on air support and a planned evacuation. Include the intelligence warning, the expected value
    of continued operation, and the leaders’ assumptions about evacuation; exclude the technical operation of the radar and
    the details of air missions.
  span_range:
  - src:fec06bf4ea5a#p4.5
  - src:fec06bf4ea5a#p6.6
  decision: The US ambassador and senior Air Force leaders chose to keep Site 85 operating despite warnings that it was unlikely
    to hold.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to broaden strike authority around the site in response to intelligence of an impending
    attack, rather than keep the prior limits. Include the stated aim of deterring or dissuading the enemy and the evidence
    that bombing was ineffective against troops in deep jungle; exclude strike execution details.
  span_range:
  - src:fec06bf4ea5a#p6.7
  - src:fec06bf4ea5a#p6.11
  decision: The US ambassador authorized the local area defense commander to direct strikes within 12 kilometers of the summit.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The decision point is whether to evacuate during the night attack or wait until morning while the situation was judged
    manageable. Include the leaders’ assessment of the danger and the planned evacuation timing; exclude the mechanics of
    evacuation and the conduct of the attack.
  span_range:
  - src:fec06bf4ea5a#p7.6
  - src:fec06bf4ea5a#p8.1
  decision: The US ambassador and Air Force leaders deferred evacuation during the March 10 attack and chose to evacuate nine
    technicians at first light.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to conduct strikes against the captured site or leave it intact, given concern that
    the enemy might exploit the radar and its documentation. Include that the strikes risked obliterating the remains of missing
    Americans; exclude strike methods and execution details.
  span_range:
  - src:fec06bf4ea5a#p9.3
  - src:fec06bf4ea5a#p9.4
  decision: Air Force leaders chose to strike the captured summit repeatedly to destroy the radar and deny its exploitation
    by the enemy.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
