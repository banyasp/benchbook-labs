- n: 3
  focus: The commander chose a force-protection policy that could limit immediate assistance to a damaged ship, explaining
    that submarines might operate in pairs and endanger rescuers. Keep the scenario focused on the rescue-versus-additional-loss
    tradeoff; omit the order’s maneuver and rescue procedures.
  span_range:
  - src:2cf1dee8e07b#p1.211
  - src:2cf1dee8e07b#p1.215
  decision: The division commander decided that, if one destroyer were disabled by a mine or torpedo, the other vessels would
    prioritize protecting the force from further attack over stopping to rescue it.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to assist 11 survivors in a boat after their ship was sunk, given the possibility that
    the attacking submarine remained in the area. The commander chose to pick them up after concluding the immediate danger
    was sufficiently low; exclude the described identification and maneuvering details.
  span_range:
  - src:2cf1dee8e07b#p1.400
  - src:2cf1dee8e07b#p1.404
  decision: The U.S. destroyer commander decides to stop and rescue the survivors of a sunken ship rather than continue on
    patrol while a submarine may still be nearby.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: After rescuing some of the crew, the commander chose to search for others who might still be adrift rather than immediately
    resume patrol. The stated concern was that the survivors could be in danger and unable to reach land; exclude the search
    method and navigation details.
  span_range:
  - src:2cf1dee8e07b#p1.402
  - src:2cf1dee8e07b#p1.410
  decision: The U.S. destroyer commander decides to divert from patrol to search for the remaining survivors of the sunken
    ship.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to accept the risk of running out of fresh water on patrol or return for repairs. The
    commanding officer chose to return because the condenser and distilling-system leaks made the water supply unreliable;
    exclude the repair details themselves.
  span_range:
  - src:2cf1dee8e07b#p1.451
  - src:2cf1dee8e07b#p1.453
  decision: The destroyer’s commanding officer decided to return to port rather than continue to sea with defective freshwater
    systems.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to engage a suspected submarine under uncertain identification; the commanding officer
    chose to fire because he believed the vessel was a submarine. The vessel proved to be a British patrol boat, and firing
    ceased when it signaled its identity; exclude the mechanics of firing and describe only the identification judgment and
    engagement decision.
  span_range:
  - src:2cf1dee8e07b#p1.529
  - src:2cf1dee8e07b#p1.531
  decision: The destroyer’s commanding officer decided to open fire on a vessel he believed was a hostile submarine.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 8
  focus: 'The decision point is how to investigate a collision involving British and U.S. ships and officers: the vice admiral
    ordered a mixed court with equal national representation and an alternating president, with each commander-in-chief to
    consider any action concerning their own forces. The stated reason was that disputes between the two nations’ ships or
    personnel could arise; exclude the detailed navigation reconstruction except as context for the inquiry.'
  span_range:
  - src:2cf1dee8e07b#p1.567
  - src:2cf1dee8e07b#p1.589
  decision: The vice admiral decided to use a joint British-American court of inquiry to investigate the collision between
    the two nations’ ships.
  content_domain: other:military adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The convoy had been expected to disperse at the Smalls, but the Vice Admiral ordered all ships to Milford Haven because
    of enemy activity in the Irish Sea; the convoy commander carried out the order. Focus on the command decision to change
    the convoy’s destination, not on navigation or escort procedures.
  span_range:
  - src:2cf1dee8e07b#p1.818
  - src:2cf1dee8e07b#p1.822
  decision: The Vice Admiral orders the convoy to proceed to Milford Haven instead of dispersing at the Smalls.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 10
  focus: At the patrol boundary, the commander chose to let the Akassa proceed alone; the diary explains that it was not listed
    as a specially valuable ship. The passage later contrasts this with staying with a ship classified as specially valuable;
    exclude the tactical details of escorting either vessel.
  span_range:
  - src:2cf1dee8e07b#p1.781
  - src:2cf1dee8e07b#p1.781
  decision: The destroyer commander releases an ordinary merchant ship from escort at the patrol limit rather than continue
    escorting it.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 11
  focus: Nine of ten merchant ships remained together while the tenth was far astern and the convoy was making less than six
    knots. The commander chose not to hold everyone back because that could endanger the rest; exclude navigation or escort
    techniques.
  span_range:
  - src:2cf1dee8e07b#p1.969
  - src:2cf1dee8e07b#p1.969
  decision: The escort commander decides to leave the straggling merchant ship behind rather than slow the convoy.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 12
  focus: The storm made it impossible for the merchant ships to keep together, while the commander judged submarine attack
    not to be a danger in those conditions. The decision weighs continuing the escort against the risk of damaging the destroyers;
    exclude the specific ship-handling instructions.
  span_range:
  - src:2cf1dee8e07b#p1.970
  - src:2cf1dee8e07b#p1.970
  decision: The escort commander decides to separate the destroyers from the convoy during the severe storm and proceed toward
    the rendezvous.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 13
  focus: A destroyer reported a case of acute appendicitis and requested a doctor; the commander later ordered it to return
    to Queenstown so the patient could be operated on. The decision concerns medical urgency and escort-duty tradeoffs, not
    medical procedure.
  span_range:
  - src:2cf1dee8e07b#p1.971
  - src:2cf1dee8e07b#p1.977
  decision: The escort commander decides to send the destroyer back to port so a sailor with acute appendicitis can be operated
    on.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 14
  focus: The inquiry considered a collision after two ships emerged from a rain squall and sighted one another at close range;
    it found the collision unavoidable despite their actions to avoid it. Focus on the inquiry’s responsibility finding and
    evidentiary basis, not on navigational technique.
  span_range:
  - src:2cf1dee8e07b#p1.951
  - src:2cf1dee8e07b#p1.951
  decision: The court of enquiry decides that neither vessel’s crew was to blame for the collision.
  content_domain: other:military-inquiry
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: Ordered to assist another destroyer escorting two oilers, the commander could attempt to join in darkness or wait
    until daylight. He judged a nighttime search impracticable and dangerous; exclude the operational details of locating
    or joining the vessels.
  span_range:
  - src:2cf1dee8e07b#p1.912
