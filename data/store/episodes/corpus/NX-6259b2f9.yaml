  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 19
  focus: The escort faced a convoy scattered by heavy weather and poor visibility, including one merchant ship separated from
    the escorts. The officer directed the escorts to continue in their existing groups because of the gale; exclude the navigational
    and formation details beyond what is needed to frame that choice.
  span_range:
  - src:2cf1dee8e07b#p1.1224
  - src:2cf1dee8e07b#p1.1224
  decision: The senior officer of the escort squadron decided to keep the separated convoy groups in their existing arrangements
    rather than attempt to reunite them.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 20
  focus: Some merchant ships could not maintain eight knots in the prevailing heavy sea, while the escort sought to keep the
    convoy together. The decision point is the speed adjustment and its stated rationale; exclude further voyage details that
    do not bear on that choice.
  span_range:
  - src:2cf1dee8e07b#p1.1271
  - src:2cf1dee8e07b#p1.1271
  decision: The senior officer of the escort squadron decided to reduce the outbound convoy’s speed from eight knots to seven.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 21
  focus: The escort could try to meet the convoy before dark by steaming southwest at fairly high speed, or conserve fuel
    while waiting to meet it later. The officer chose to wait, citing fuel consumption and the need for some destroyers to
    proceed slowly on what was expected to be a long trip; exclude unrelated voyage details.
  span_range:
  - src:2cf1dee8e07b#p1.1272
  - src:2cf1dee8e07b#p1.1272
  decision: The senior officer of the escort squadron decided not to steam southwest at higher speed to meet the delayed homebound
    convoy earlier.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 22
  focus: The passage describes a choice between prioritizing submarine attacks and protecting merchant shipping, and says
    the commander favored attacks; merchant ships were consequently used as lures. Focus on the command-level allocation of
    priority and its stated rationale, not on how to attack submarines or use ships as lures.
  span_range:
