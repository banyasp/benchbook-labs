- n: 2
  focus: The commander’s order establishes a conditional decision to use force against a sighted enemy submarine, in a context
    where the diary notes reports of submarines operating in the Atlantic. Build the scenario around the authority and standard
    for engagement; exclude the signal, weapon, and maneuver instructions in the order.
  span_range:
