- n: 2
  focus: The decision point is the Agency’s estimate of whether the Soviets would pursue the program, weighing a possible
    defensive benefit against cost, uncertainty, and the risk of treaty violations. Exclude the technical details of how an
    upgraded system might function.
  span_range:
  - src:d2ab09a27f59#p13.4
  - src:d2ab09a27f59#p14.3
  decision: The CIA assesses that the Soviets are unlikely to adopt a SAM-upgrade program for ABM defense.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to seek inspection or other verification constraints to address concern that SAM systems
    could be upgraded in violation of ABM limits. The passage says the Soviets rejected on-site inspection and most initial
    provisions were later dropped; exclude the technical means of detecting upgrades.
  span_range:
  - src:d2ab09a27f59#p15.1
  - src:d2ab09a27f59#p15.3
  decision: U.S. arms-control negotiators include SAM-upgrade verification provisions in initial proposals, including on-site
