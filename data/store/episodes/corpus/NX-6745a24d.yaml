  focus: The Director faced a choice between handing over documents requested through a presidential aide and first verifying
    the request with the President. The Director sought that confirmation because the documents concerned prior administrations
    and might be used politically or reach the wrong hands; after receiving the President’s assurance about the purpose, the
    Director provided them. Exclude speculation about the President’s actual motives beyond what the passage states.
  span_range:
