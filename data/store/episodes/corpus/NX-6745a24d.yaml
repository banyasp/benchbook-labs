  held_out: false
  natsec: true
- n: 2
  focus: 'The Director described his choice when questioned by the Senate committee: disclose the operations or withhold them
    to comply with his statutory responsibility to protect intelligence sources and methods. The passage also identifies the
    unresolved question of which committees were entitled to operational details. Exclude the later statutory change establishing
    designated intelligence committees as the sole oversight authorities.'
  span_range:
  - src:fab79ef027c9#p1.121
  - src:fab79ef027c9#p1.122
  decision: The CIA Director decided not to disclose covert-operation details to a congressional committee he considered unauthorized
    to receive them.
