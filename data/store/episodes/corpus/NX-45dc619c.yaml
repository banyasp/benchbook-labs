  focus: The decision was whether to retain directorate-level authority or centralize review and release. The stated reasons
    were that the prior structure produced opaque and inconsistent decisions and lengthy disputes, while centralization was
    intended to support adequate searches and reasonable, timely, transparent, and credible decisions; exclude the merits
    of any particular release.
