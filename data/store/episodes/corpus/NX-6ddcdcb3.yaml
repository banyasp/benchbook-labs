- n: 2
  focus: The decision point is whether to adjust the training calendar to provide more time for the planned training and augmentees.
    The passage says the change was authorized and helped execute the plan; exclude the training tasks themselves.
  span_range:
  - src:316ac63c536c#p29.2
  - src:316ac63c536c#p29.3
  decision: The 244th DLD leadership, with brigade and State headquarters authorization, chose to extend the January training
    assembly from MUTA 4 to MUTA 6.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to equip DLDs organically or have them coordinate to use communications equipment provided
    by a gaining or host unit. Focus on the leadership’s force-design choice and its stated concerns about footprint, staffing,
    training, and coordination; exclude technical instructions for communications.
  span_range:
  - src:316ac63c536c#p57.3
  - src:316ac63c536c#p57.3
  decision: DLD senior leadership decided not to provide DLD units with organic communications equipment, relying instead
    on equipment supplied by the host nation or U.S. units already on the ground.
  content_domain: operational-command
  refusal_sensitivity: low
