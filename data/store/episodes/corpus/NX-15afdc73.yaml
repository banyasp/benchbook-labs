  focus: The decision point is the State Department’s coordinated response to several 1962 requests it treated as a concerted
    effort to obtain information on U.S. automation and computer technology. The alternatives included approving the requested
    access or applying different limits; the department cited intelligence assessments, reciprocity concerns, and the apparent
    attempt to bypass the exchange agreement. Exclude the underlying intelligence-gathering methods; focus on the government’s
    access and exchange decisions.
