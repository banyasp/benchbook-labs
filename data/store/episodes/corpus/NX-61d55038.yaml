episodes:
- n: 1
  focus: The decision point is whether to direct immediate, organized action or leave the existing limited effort unchanged.
    The source links the directive to concerns about Soviet deception of intelligence collection and policy intentions, including
    in arms control; exclude the technical methods of collection or countermeasures.
  span_range:
  - src:7a0746aa1fa1#p4.6
  - src:7a0746aa1fa1#p4.13
  decision: The President directs the intelligence community to establish and resource a focused capability to analyze and
    counter Soviet concealment, camouflage, and deception.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to create a dedicated DI analytic capability or defer to the DO’s claim of exclusive
    responsibility for KGB reporting. The source gives the group’s intended analytic purpose and the institutional rationale
    for making it a DI line unit; exclude any operational collection or countermeasure details.
  span_range:
  - src:7a0746aa1fa1#p6.10
  - src:7a0746aa1fa1#p7.3
  decision: The DDI establishes a dedicated analytic group to study foreign covert action and deception despite the DO’s objection
    to a separate unit studying Soviet intelligence.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to act on the review’s recommendations or leave declining capabilities and resource
    levels in place. The review found a dramatic decline since the Casey period, and the source describes the DCI’s concurrence
    and action memo; exclude the operational details of collection or countermeasures.
  span_range:
  - src:7a0746aa1fa1#p10.4
  - src:7a0746aa1fa1#p10.8
  decision: The DCI accepts the review’s recommendations and directs intelligence-community agencies to correct shortfalls
    and increase resources for denial-and-deception work.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
