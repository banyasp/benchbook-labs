episodes:
- n: 1
  focus: The decision point is whether to honor the charter’s limits on estimates or proceed with the Army’s preferred analytic
    role. The Army wanted a joint intelligence organization, and the estimate’s subject also suited the Navy’s views; exclude
    later Soviet estimates and operational planning.
  span_range:
  - src:a9b408cc65d3#p7.2
  - src:a9b408cc65d3#p7.4
  decision: The ranking Army officer on the JIC ordered the committee to produce its first interdepartmental intelligence
    estimate despite the charter’s restriction.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the JIC’s choice to request priority for Arctic defensive bases, rather than the broader increase
    in military spending urged by NSC 68. The source connects that recommendation to the assessed danger and potential immediate
    effects of an Arctic attack; exclude the operational details of any attack or defense.
  span_range:
  - src:a9b408cc65d3#p20.3
  - src:a9b408cc65d3#p21.2
  decision: The JIC and Joint Planning Staff recommended prioritizing defensive bases in the Arctic against a prospective
    Soviet surprise attack.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
