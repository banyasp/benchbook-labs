  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 46
  focus: The decision point is the conduct and posture UK commanders were instructed to adopt in the post-conflict phase.
    The directive favored working for Iraqis’ benefit and noted that UK forces might be the first coalition forces implementing
    Phase IV and would be under world media scrutiny; exclude tactical implementation details.
  span_range:
  - src:71b5f255ca8e#p364.3
  - src:71b5f255ca8e#p364.7
  decision: The General Officer Commanding directed UK commanders to avoid triumphalism and prioritize Iraqi dignity in Phase
    IV.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 47
  focus: The decision point is whether, and to what extent, DFID staff would be seconded into military planning structures.
    DFID officials recommended six advisers to help ensure humanitarian consequences were addressed; the record says the Secretary
    approved a limited number. Do not infer why the number was limited beyond the stated planning purpose.
  span_range:
  - src:71b5f255ca8e#p364.8
  - src:71b5f255ca8e#p365.2
  decision: The DFID Secretary of State approved a limited number of humanitarian-adviser secondments to UK and US military
    planning units.
