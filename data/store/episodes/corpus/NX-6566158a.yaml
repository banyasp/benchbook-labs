  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 61
  focus: 'The decision point is the design and timing of the transition: an Iraqi authority with some political control from
    the outset, but under Coalition oversight, rather than an immediate transfer of full authority. Include the stated aim
    of early Iraqi political participation and the Coalition’s retained control over the pace; exclude operational details
    of the occupation.'
  span_range:
  - src:71b5f255ca8e#p487.3
  - src:71b5f255ca8e#p487.5
  decision: The US President approves transferring governance to an Iraqi Interim Authority with exiles and Kurdish groups
    at its core, while the Coalition controls the pace of the transfer.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 62
  focus: The decision balanced the military case for preventing enemy forces outside the planned area from interfering with
    the UK effort against concerns that expansion could overstretch resources and detract from Phase IV preparations. Keep
    the focus on the authorization and its conditions, not operational movements or tactics.
  span_range:
  - src:71b5f255ca8e#p490.4
  - src:71b5f255ca8e#p492.5
  decision: The Prime Minister approved extending the UK Area of Operations northward during Phase III, subject to commanders
    judging it sensible.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 63
  focus: This decision point concerns the desired balance between visible UN authorization and Coalition control of practical
    administration. The stated reasons included public confidence and making clear that the UK was not taking possession of
    Iraqi oil; exclude the separate discussion of how military forces would handle communal violence.
  span_range:
  - src:71b5f255ca8e#p499.7
  - src:71b5f255ca8e#p500.2
  decision: The Prime Minister set out the UK position that post-conflict Iraq should appear to have UN authority, while the
    UN should not run the administration.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 64
  focus: The decision point is how to respond to US proposals that would leave the Coalition in control of reform and reconstruction
    despite the need for international support and Security Council authorization. The FCO favored pressing for the stated
    commitments while avoiding a prolonged Council dispute; the Inquiry notes that it did not address the implications if
    differences remained unresolved.
  span_range:
  - src:71b5f255ca8e#p503.4
  - src:71b5f255ca8e#p504.10
  decision: The FCO chose to press the United States to honor the Azores commitments and continue advising it on a post-conflict
    UN mandate.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 65
  focus: The decision package proposed keeping the UK task within military capability, focusing on south-east Iraq, limiting
    the role before a Security Council resolution, seeking partners and an exit strategy, and drawing down to about one third
    by autumn. The stated reasons included capability limits, the need for legal authorisation, and avoiding long-term damage
    to the Armed Forces; the Prime Minister agreed subject to further advice on the sector, duration and exit strategy. Exclude
    operational details about how forces would carry out their tasks.
  span_range:
  - src:71b5f255ca8e#p521.5
  - src:71b5f255ca8e#p529.10
  decision: The Prime Minister agreed to the Foreign and Defence Secretaries’ proposed limits and conditions for the UK’s
    post-conflict military contribution in Iraq.
  content_domain: other:post-conflict military commitment policy
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 66
  focus: The Prime Minister proposed that the Oil-for-Food resolution proceed quickly and that a resolution on post-conflict
    administration follow, while seeking a UN authorising role for post-conflict efforts. The stated considerations were timing,
    the importance of UN authorisation, and access to UN and international financial institution funding; exclude the wider
    unresolved question of how the administration would operate.
  span_range:
  - src:71b5f255ca8e#p530.4
  - src:71b5f255ca8e#p530.6
  decision: The Prime Minister chose to seek separate Security Council resolutions for the Oil-for-Food programme and post-conflict
    administration.
  content_domain: other:international authorisation policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 67
  focus: The decision point is whether to debate the resolution’s form immediately or postpone that debate; the Prime Minister
    chose postponement, saying the UK and US should wait until they had secured victory and were in a position of strength.
    Exclude the later resolution’s detailed terms and the conduct of military operations.
  span_range:
  - src:71b5f255ca8e#p540.8
  - src:71b5f255ca8e#p541.3
  decision: The Prime Minister chose to defer debate with the US President about the form of a post-conflict UN resolution
    until after military victory.
  content_domain: other:post-conflict diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 68
  focus: The decision point is whether to define the UK sector in advance or defer that choice; the FCO advised deferral and
    flexible planning. The stated reasons include uncertainty about the task, available forces and Iraqi attitudes; exclude
    operational details about how forces would carry out tasks in the sector.
  span_range:
  - src:71b5f255ca8e#p535.6
  - src:71b5f255ca8e#p535.7
  decision: The FCO advised UK decision-makers to keep the size and geography of a UK sector flexible until the military task
    and available Coalition resources were clearer.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 69
  focus: The decision point is whether to undertake broader reconstruction without a resolution or limit UK activity to the
    stated functions; DFID officials advised the latter, relying on the Attorney General’s advice. Keep the focus on the legal
    authority and policy boundary, not the details of delivering relief or reform.
  span_range:
  - src:71b5f255ca8e#p542.9
  - src:71b5f255ca8e#p542.12
  decision: DFID officials advised that, without a Security Council resolution, the UK should limit its post-conflict role
    to humanitarian relief and basic civil-administration reform needed for public security.
  content_domain: other:occupation law and reconstruction policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 70
  focus: The decision point is whether to plan for a reduced UK commitment or prepare for a substantial, potentially prolonged
    post-conflict role. The report says the plan rested on expectations that the US would lead, the UN would be authorised
    and take a significant role, and international partners would share the burden; exclude operational force-planning details.
  span_range:
  - src:71b5f255ca8e#p565.9
  - src:71b5f255ca8e#p566.5
  decision: The UK Government planned to reduce its military contribution in Iraq to medium scale within four months of the
    invasion.
  content_domain: other:post-conflict policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 71
  focus: The decision point is whether to continue pressing for UN leadership or accept the less ambitious Coalition-led model
    with UN authorisation and presence. The report links the shift to failure to persuade the US and records concerns about
    legal authority and securing international partners; exclude any operational details of the administration or military
    occupation.
  span_range:
  - src:71b5f255ca8e#p566.5
  - src:71b5f255ca8e#p567.2
  decision: By March 2003, the UK Government shifted from seeking a UN-led interim administration to seeking UN authorisation
    for a Coalition-led administration.
  content_domain: other:post-conflict policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 72
  focus: The decision point is whether to pursue the issue through the Security Council or proceed without that route. The
    UK had made clear that returning the issue to the Council was necessary for its participation in military action, and
    the UK was a key ally whose support the US wanted. Exclude later negotiations over the wording of resolutions.
  span_range:
  - src:71b5f255ca8e#p587.9
  - src:71b5f255ca8e#p588.4
  decision: The US President decided to take the Iraq issue back to the UN Security Council.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 73
  focus: The decision point is whether to pursue a peaceful alternative, as proposed by the Foreign Secretary, or prepare
    to support US military action. The Prime Minister’s assessment that war was likely and his stated view of the right course
    provide the rationale. Exclude later operational preparations and deployments.
  span_range:
  - src:71b5f255ca8e#p592.8
  - src:71b5f255ca8e#p593.2
  decision: The Prime Minister decided that war was likely and that, if conflict could not be avoided, the UK should fully
    support the US.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 74
  focus: The decision point is the UK’s choice in mid-March between acting with the US without majority Security Council support
    and not joining the action. The passage gives the Prime Minister’s commitment to stand alongside the US and the UK’s long-term
    national-interest rationale, while noting that diplomatic options were not exhausted. Exclude operational planning and
    conduct of the invasion.
  span_range:
  - src:71b5f255ca8e#p576.3
  - src:71b5f255ca8e#p577.5
  decision: The UK Government chose to support military action in Iraq rather than decline to join the US-led action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 75
  focus: The decision point is whether to continue with the existing timetable or seek flexibility and benchmarks to bring
    Council members together and preserve support for UK action. Exclude the detailed content of the proposed tests; the policy
    choice is the diplomatic attempt to secure agreement.
  span_range:
  - src:71b5f255ca8e#p601.8
  - src:71b5f255ca8e#p602.6
  decision: The Prime Minister decided to make a final attempt to secure a further Security Council resolution by proposing
    a short extension and tests for Iraqi compliance.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 76
  focus: The decision point is whether to continue diplomacy or move to an ultimatum and seek Parliamentary support for force.
    The stated context includes the failure to secure a further resolution and the Government’s view that Iraq had persistently
    failed to meet UN demands; exclude later military execution details.
  span_range:
  - src:71b5f255ca8e#p609.4
  - src:71b5f255ca8e#p609.10
  decision: The Cabinet decided that the diplomatic process had ended, to issue an ultimatum to Saddam Hussein to leave Iraq,
    and to seek Commons endorsement for military action if necessary.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 77
  focus: The decision point is Parliament’s choice whether to endorse the Government’s proposed use of force to enforce disarmament.
    The motion invoked Iraq’s weapons and continuing non-compliance, and upholding UN authority; exclude the operational conduct
    of any campaign.
  span_range:
  - src:71b5f255ca8e#p610.5
  - src:71b5f255ca8e#p612.5
  decision: The House of Commons voted to support the Government’s decision that the United Kingdom should use all means necessary
    to ensure Iraq’s disarmament.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 78
  focus: The decision point is whether to continue inspections and diplomacy or resort to force. The passage gives the Government’s
    WMD and non-compliance case, while also noting inspectors’ progress, the lack of Security Council support for ending inspections,
    and that diplomacy had not been exhausted; exclude operational military planning.
  span_range:
  - src:71b5f255ca8e#p616.2
  - src:71b5f255ca8e#p618.6
  decision: The UK Government chose in March 2003 to end the inspections and diplomatic process and proceed with military
    action against Iraq, without explicit Security Council authorisation.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 79
  focus: The decision point is the UK’s choice to partner with the US after the US shifted away from containment, despite
    the UK’s initial view that containment remained broadly effective. The stated considerations were protecting the strategic
    alliance and seeking to influence US policy from within; exclude later operational and post-conflict decisions.
  span_range:
  - src:71b5f255ca8e#p622.2
  - src:71b5f255ca8e#p622.8
  decision: The UK Government chose in late 2001 to offer to work with the US on an Iraq strategy as part of the second phase
    of the ‘War on Terror’, rather than maintain its existing containment policy or withhold support.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
