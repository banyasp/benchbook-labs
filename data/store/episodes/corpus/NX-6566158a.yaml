  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 48
  focus: The decision was whether to prepare for a broader, rapid humanitarian response or limit preparations to what DFID
    could fund and commit to, prioritising support through the UN and other international agencies. The Secretary of State
    rejected some preparations because they could imply military action was certain and DFID lacked a clear financial package,
    while accepting that this could leave DFID unready for an immediate crisis; exclude the operational details of proposed
    deployments.
  span_range:
  - src:71b5f255ca8e#p393.4
  - src:71b5f255ca8e#p397.15
  decision: The DFID Secretary of State chose to limit the department’s pre-conflict preparations and commitments for humanitarian
    work in Iraq.
  content_domain: other:humanitarian policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 49
  focus: The decision point was whether to accept a larger, longer UK sector-administering role or set limits on duration
    and require UN authority and transition. The IPU recommended a limit of 60 days absent those conditions, citing legal
    uncertainty, force and financial constraints, and political risks; this was a proposed UK negotiating position, not evidence
    that ministers finally adopted it.
  span_range:
  - src:71b5f255ca8e#p398.7
  - src:71b5f255ca8e#p401.12
  decision: UK policy planners recommended that the UK refuse a medium-term responsibility for an Iraqi sector without UN
    authorisation and an early transition to UN administration.
  content_domain: other:post-conflict policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 50
  focus: The decision point is the UK’s choice between committing early to a defined post-conflict role and preserving flexibility
    while seeking influence. The stated reasons include uncertainty about objectives, capacity, sector leadership and the
    Phase IV command chain and political and legal authority; exclude operational details of the aftermath itself.
  span_range:
  - src:71b5f255ca8e#p405.9
  - src:71b5f255ca8e#p405.11
  decision: 'The UK delegation set its Rock Drill position: support immediate aftermath operations in principle, but avoid
    commitment to a long-term sector plan.'
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 51
  focus: The decision point is whether to commit to a substantial UK bilateral humanitarian effort or rely primarily on UN
    channels, while limiting the resource commitment and making deployment conditional. The passage gives the mandate-related
    political constraints and funding implications; exclude the operational delivery routes as techniques.
  span_range:
  - src:71b5f255ca8e#p406.2
  - src:71b5f255ca8e#p406.2
  decision: The DFID leadership chose to plan humanitarian assistance primarily through UN agencies, with a more active bilateral
    role conditional on extra resources and UN progress.
  content_domain: other:humanitarian policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 52
  focus: The decision point is whether the UK should accept a leadership role within ORHA or decline it. The advice cited
    the absence of UN authority, legal concerns about the scope of occupation powers, and the political controversy and disorder
    likely to surround ORHA’s work; do not treat the recommendation as proof that the government ultimately declined.
  span_range:
  - src:71b5f255ca8e#p410.2
  - src:71b5f255ca8e#p412.5
  decision: The Iraq Planning Unit official advised the UK not to accept the expected offer to lead an ORHA sector.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 53
  focus: 'The decision was whether to prepare and deploy more extensively, or restrict DFID’s role while its authority and
    resources remained uncertain. The source gives the constraints: the UN mandate, DFID’s limited funds, and the department’s
    commitments to humanitarian partners; exclude the wider disagreement about which organization should deliver relief.'
  span_range:
  - src:71b5f255ca8e#p427.2
  - src:71b5f255ca8e#p429.5
  decision: The DFID Secretary of State chose to limit DFID’s operational deployment and substantive preparations for an exemplary
    humanitarian role unless there was appropriate UN authority and adequate funding.
  content_domain: other:humanitarian-aid-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 54
  focus: The decision was whether to seek UN authority for the post-conflict phase or proceed without it under the more limited
    law of belligerent occupation. The source explains that authority was considered important legally and politically, and
    that occupation powers were constrained; exclude detailed questions about administering justice or managing resources.
  span_range:
  - src:71b5f255ca8e#p431.5
  - src:71b5f255ca8e#p434.7
  decision: The Foreign Secretary chose to press for UN Security Council authority for the post-conflict occupation and administration
    of Iraq.
  content_domain: other:occupation-law-and-post-conflict-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 55
  focus: The decision was whether to present the vision immediately or keep it in reserve until the vote. The stated concerns
    were that an early announcement could appear to discount the Security Council’s role or confuse the public justification
    for military action, which rested on disarmament; exclude the merits of the vision’s proposed end-state.
  span_range:
  - src:71b5f255ca8e#p444.10
  - src:71b5f255ca8e#p445.2
  decision: The Foreign Secretary chose to defer launching or publicizing the UK’s vision for Iraq until after the Security
    Council vote on the second resolution.
  content_domain: other:government-policy-and-public-communication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 56
  focus: This is a policy choice between leading an exemplary effort in one area and directing limited resources to needs
    across Iraq, including through UN agencies and NGOs. The stated reasons include limited resources, substantial needs elsewhere,
    uncertainty about the UK’s role, and the risk of becoming the donor of last resort; exclude later ministerial planning
    decisions.
  span_range:
  - src:71b5f255ca8e#p453.3
  - src:71b5f255ca8e#p453.7
  decision: The Secretary of State for International Development agreed that DFID would not promise an exemplary or exclusively
    south-eastern Iraq humanitarian effort, and would work alongside the military only with the right UN mandate and authority.
  content_domain: other:humanitarian-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 57
  focus: The decision weighs seeking an expanded role against conserving forces and capacity for post-conflict duties, while
    leaving open consideration of US requests. The passage gives reasons tied to Phase IV resources, transition risks, and
    the judgment that a major late revision to the US plan was unwise; exclude the operational details of proposed missions.
  span_range:
  - src:71b5f255ca8e#p450.2
  - src:71b5f255ca8e#p451.11
  decision: The Defence Secretary and Chiefs of Staff decided that the UK would not actively seek a wider combat role, but
    would consider unsolicited US requests on their merits and pursue a limited niche contribution subject to conditions.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 58
  focus: The choice was to require an immediate coordinated plan for the British forces’ area despite DFID’s stated approach
    of prioritising areas of greatest need, rather than necessarily that area. The record cites the risk that a humanitarian
    crisis could cause military operational problems and public criticism; exclude the details of delivering aid.
  span_range:
  - src:71b5f255ca8e#p461.2
  - src:71b5f255ca8e#p461.10
  decision: The Prime Minister directed the departments to plan immediate humanitarian action in the area of operations of
    British forces.
  content_domain: other:humanitarian-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 59
  focus: The decision point is the UK’s chosen approach to Iraqi oil revenues if the regime falls and no effective Iraqi government
    is in place. Include the reasons of maintaining humanitarian arrangements and avoiding the perception that the Coalition
    is seeking to control Iraqi oil; exclude the separate question of military action.
  span_range:
  - src:71b5f255ca8e#p482.3
  - src:71b5f255ca8e#p482.8
  decision: The UK Government decides to seek a UN resolution keeping the Oil-for-Food programme functioning and transferring
    control of oil revenues to a properly representative Iraqi government, rather than to a less representative Iraqi entity.
  content_domain: other:post-conflict economic governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 60
  focus: The decision is whether to pursue broad removal of Ba’ath Party members or retain much of the existing administrative
    structure. Focus on the stated rationale of preserving administrative capacity; exclude subsequent implementation details.
  span_range:
  - src:71b5f255ca8e#p487.2
  - src:71b5f255ca8e#p487.5
  decision: The US President approves a policy of light de-Ba’athification to preserve Iraq’s administrative capacity.
