  focus: The US asked the UK to lead restoration of Iraq’s judicial system and police; FCO advice warned that this would be
    a massive undertaking with implications for the UK as an Occupying Power and argued for an international effort mandated
    by the UN. The Foreign Secretary instructed officials to help as much as possible, subject to practicality; exclude details
    of implementing police or judicial work.
  span_range:
  - src:71b5f255ca8e#p344.2
  - src:71b5f255ca8e#p344.9
  decision: The Foreign Secretary chose to offer practical UK assistance on police and judicial matters without undertaking
    to lead their restoration.
  content_domain: other:occupation-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 44
  focus: DFID advice discussed speaking or writing to the Chancellor to seek additional funds, but the Secretary of State
    rejected that approach and decided to write to the Prime Minister. The stated reason was to put humanitarian considerations
    into the Government’s mind, rather than simply squeeze out money; exclude budget calculations and the mechanics of obtaining
    funds.
  span_range:
  - src:71b5f255ca8e#p349.7
  - src:71b5f255ca8e#p350.4
  decision: The DFID Secretary of State chose to write to the Prime Minister rather than approach the Chancellor for humanitarian
    funding.
  content_domain: other:humanitarian-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 45
  focus: 'The decision point is how to present regime removal: as an explicit UK objective or as a measure tied to Iraq’s
    refusal to comply with UN resolutions. The draft linked removal to that refusal and framed the overall objective as disarmament;
    focus on the stated concern that other audiences might conclude the UK had sought regime change all along, not on campaign
    operations.'
  span_range:
  - src:71b5f255ca8e#p377.2
  - src:71b5f255ca8e#p378.17
  decision: The UK Government chose to frame its military campaign objectives around long-term disarmament under UN Security
    Council resolutions, while including removal of the Iraqi regime as a task.
