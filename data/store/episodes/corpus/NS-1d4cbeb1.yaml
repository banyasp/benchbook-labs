  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 28
  focus: The decision point is whether to preserve the assigned reconnaissance-related objective or, using command discretion,
    make attack the group’s primary mission. The commander cited his assessment that enemy forces were moving and the basic
    orders’ attack objective; the analysis faults the change as premature because he could have consulted CTF 17 and thereby
    allowed the superior commander to assess the situation. Exclude patrol deployments and attack methods.
  span_range:
  - src:28e4e4b3d44a#p277.3
  - src:28e4e4b3d44a#p278.6
  decision: The BESUGO wolf-pack commander independently shifted the group’s priority from preventing an undetected enemy
    sortie through Bungo Suido to attacking enemy forces.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 29
  focus: 'The decision point is the reallocation of forces during preparations for the decisive battle: retain the planned
    assignments or divert forces to support mobile counterattacks and reinforcements to Leyte. The account discusses competing
    priorities and possible motives, including strengthening the First Striking Force and concerns about the Main Force’s
    screening role; exclude the tactical details of force employment.'
  span_range:
  - src:28e4e4b3d44a#p283.6
  - src:28e4e4b3d44a#p288.2
