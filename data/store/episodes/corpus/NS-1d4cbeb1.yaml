  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 27
  focus: The decision point is whether to retain the special submarine dispositions or return the submarines to normal patrols
    while coordinating their operating areas with the Third Fleet. The account gives the fleet-action outlook and CINCPOA’s
    interest in moving submarines into interception positions as context, and questions the wisdom of the order given the
    impending Leyte operations; exclude patrol mechanics and geographic detail beyond what is needed to identify the decision.
  span_range:
