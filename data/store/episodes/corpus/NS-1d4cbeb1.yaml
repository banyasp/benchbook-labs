    local measures for the defense of the Philippines.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is whether to concentrate the fighter force immediately after reports of Allied activity near
    Suluan or wait because the activity might be a feint. Keep the scenario at the level of force commitment; exclude the
    ordered reconnaissance and any details of an attack.
  span_range:
  - src:28e4e4b3d44a#p218.4
  - src:28e4e4b3d44a#p218.5
  decision: The Commander of the Fourth Air Army delayed the planned concentration of fighter strength in the central and
    southern Philippines.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 21
  focus: The decision point is whether to put the carriers inside the Gulf to strengthen dawn and dusk air coverage or keep
    them outside and operate close to the entrance. The account weighs the expected coverage benefit against incomplete minesweeping,
    possible night torpedo-boat and air attacks, limited maneuvering room, and congestion; exclude the detailed mechanics
    of air operations.
  span_range:
  - src:28e4e4b3d44a#p226.2
  - src:28e4e4b3d44a#p227.2
  decision: CTF 77 decided not to send the escort carriers into Leyte Gulf on D-day.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 22
  focus: The source says CTF 71 feared his command might believe the Japanese claims and therefore sent a message quoting
    COMTHIRDFLT to remove apprehensions. Treat this as a decision about whether and how to communicate a corrective assessment;
    exclude any independent judgment about whether the quoted claim was accurate.
  span_range:
  - src:28e4e4b3d44a#p244.5
  - src:28e4e4b3d44a#p244.5
