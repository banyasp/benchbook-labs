episodes:
- n: 1
  focus: The decision point is whether to keep the original schedule or advance the operation after intelligence indicated
    unexpectedly weak Japanese air resistance in the Leyte area. The passage says the earlier date would advance the war effort
    and simplify future arrangements; exclude the operational details of the campaign.
  span_range:
  - src:28e4e4b3d44a#p46.6
  - src:28e4e4b3d44a#p47.1
  decision: The Joint Chiefs of Staff advanced the Philippines operation from its scheduled December 20 date to October 20.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: After searches failed to locate the Japanese SECOND Striking Force, COMTHIRDFLT judged that it was retiring and not
    seeking battle, then reassigned task groups to provide better support near Leyte. The decision point is the force-allocation
    judgment and its rationale; exclude operational details of searches or air operations.
  span_range:
  - src:28e4e4b3d44a#p50.3
  - src:28e4e4b3d44a#p50.3
  decision: COMTHIRDFLT reassigned its task groups on October 17 to improve air support for the Allied advance force.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The choice was whether to proceed with the planned withdrawal for logistics or retain the carrier groups in position
    as the landing approached. The passage cites reported Japanese forces and the imminent Allied landing as possible reasons;
    exclude details of carrier operations and searches.
  span_range:
  - src:28e4e4b3d44a#p55.2
  - src:28e4e4b3d44a#p55.2
  decision: COMTHIRDFLT cancelled TG 38.1’s planned withdrawal for replenishment and kept the carrier groups positioned to
    support the Leyte operation.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to proceed with the penetration operation or conserve fleet strength, given the expected
    Allied landing and the Navy’s limited carrier air support. The passage records the Navy’s reasons and the Army’s counterarguments,
    then says the Navy persisted; exclude operational plans for carrying out the penetration.
  span_range:
  - src:28e4e4b3d44a#p57.1
  - src:28e4e4b3d44a#p57.3
  decision: The Japanese Navy’s senior leadership persisted with plans for a fleet penetration into Leyte Gulf despite the
    Army’s opposition to risking the fleet.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision was whether to continue or delay the landings; the commander judged that proceeding might secure some
    or all objectives, while leaving subordinate commanders to assess whether their assigned tasks remained feasible. Focus
    on the command decision and its stated authority and rationale, not the execution of the landings.
  span_range:
