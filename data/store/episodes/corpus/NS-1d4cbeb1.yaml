- n: 8
  focus: The decision point is whether to continue toward the designated station or remain at a perceived traffic focal point.
    The report attributes the choice to vague orders permitting exploitation of traffic lanes and focal points, and notes
    the resulting gap in the defensive submarine screen; exclude the patrol’s tactical execution.
  span_range:
  - src:28e4e4b3d44a#p86.3
  - src:28e4e4b3d44a#p86.5
