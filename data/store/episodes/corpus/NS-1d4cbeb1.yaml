    daylight.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 18
  focus: The commander had received reports of several Allied task groups but held his attack group rather than launch an
    attack, citing the distance to the contacts and the time required to stage through Okinawa. Keep the focus on the decision
    whether to engage; exclude the detailed search, staging, and aircraft-operating procedures.
  span_range:
  - src:28e4e4b3d44a#p196.5
  - src:28e4e4b3d44a#p196.5
