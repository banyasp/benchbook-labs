  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 30
  focus: The decision point is whether to activate SHO One then or wait for clearer evidence of a major invasion. The passage
    gives the Army Section’s earlier reluctance, the Southern Army’s recommendation, and the requirement for joint Army-Navy
    designation; exclude the operational details of carrying out the operation.
  span_range:
  - src:28e4e4b3d44a#p296.2
  - src:28e4e4b3d44a#p297.3
  decision: The Army Section's decision-makers, with Navy Section concurrence, activated the SHO One operation in the Philippines
    after the Southern Army recommended activation.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 31
  focus: The decision point is whether to keep the earlier planned date or delay the operation to accommodate the forces’
    readiness. The account says the change followed the inability of the Main Force and First Striking Force to meet the earlier
    date, while noting uncertainty about when the Allied landing would occur and the risks of delay; exclude force movement
    and attack procedures.
  span_range:
  - src:28e4e4b3d44a#p292.6
  - src:28e4e4b3d44a#p293.3
  decision: The Chief of Staff, Combined Fleet, tentatively set X-day for October 24 rather than October 22.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 32
  focus: 'The analysis describes two speed options and infers a preference for 16 knots: the faster option would expose the
    force to concentrated air power during its approach, while the slower option allowed the approach in darkness and better
    fit the planned dawn penetration. The report says there is no record of him making representations about his concerns,
    so do not recast that silence as a separate decision.'
  span_range:
  - src:28e4e4b3d44a#p307.4
  - src:28e4e4b3d44a#p308.3
