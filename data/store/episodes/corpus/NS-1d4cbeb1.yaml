  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 11
  focus: The decision point is whether to issue the alert immediately or wait for further confirmation, given the report,
    the prior assessment of an imminent invasion, and the risk of another erroneous report. The passage also states that authority
    to designate the decisive-battle area remained with the central military authority, while the fleet commander had authority
    to issue an alert; exclude subsequent force movements and operational plans.
  span_range:
  - src:28e4e4b3d44a#p139.2
  - src:28e4e4b3d44a#p140.5
  decision: The Commander in Chief, Combined Fleet, ordered a SHO One alert for the Philippines without waiting to verify
    or amplify the Suluan sighting report.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 12
  focus: The decision point is whether to assign either escort carrier to a force or leave both in their existing duties.
    The analysis considers their limited value to the Main Force’s diversionary role and the possible benefit of SHINYO to
    the First Striking Force; exclude the passage’s discussion of how forces would conduct their operations.
  span_range:
  - src:28e4e4b3d44a#p153.4
  - src:28e4e4b3d44a#p154.4
  decision: The Chief of Staff, Combined Fleet, decided not to include the escort carriers KAIYO and SHINYO in either the
    Main Force or the First Striking Force for the time being.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 13
  focus: 'The decision point is how to allocate the aircraft still available in the homeland between the carrier Main Force
    and the land-based Sixth Base Air Force. The passage explains the inferred rationale: the land-based forces had been ineffective,
    while aircraft might strengthen the Main Force’s diversionary role; exclude details of carrier employment.'
  span_range:
  - src:28e4e4b3d44a#p155.2
  - src:28e4e4b3d44a#p155.5
  decision: Combined Fleet Headquarters decided to return the available remaining aircraft from specified air groups to the
    Main Force rather than retain them with the Sixth Base Air Force.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is how to restore the Main Force’s usefulness to the SHO plan despite its depleted carrier air
    strength. The source says the group would combine available aircraft from the 634th and 653rd Air Groups with carrier-capable
    aircraft and pilots from the 601st, and explains the aim of making the Main Force a credible diversion. Exclude aircraft-operating
    methods and any later combat employment.
  span_range:
  - src:28e4e4b3d44a#p159.5
  - src:28e4e4b3d44a#p161.4
  decision: The Commander of the Mobile Force, after learning of the invasion and the failure of land-based air forces, sought
    a conference on the Main Force’s role and agreed to organize a carrier-capable air group from available aircraft and pilots.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is whether to act on perceived delegated authority and shared intent or wait for direct orders,
    given the urgent need to arrange support for the force. The source characterizes this as a delicate command decision and
    links it to unity of effort. Exclude the oilers’ routes, escorts, and fueling procedures.
  span_range:
  - src:28e4e4b3d44a#p164.5
  - src:28e4e4b3d44a#p164.6
  decision: The Commander of the FIRST Striking Force directed oilers to Brunei without waiting for explicit orders, relying
    on his understanding of the CinC Combined Fleet’s intent.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 16
  focus: The decision point is whether to intervene in the plan or defer further action when support and refueling constraints
    made the planned timing doubtful. The source says the CinC was apparently satisfied that his Chief of Staff was pursuing
    the basic plan as closely as possible. Exclude the force’s routes, speeds, and other movement details.
  span_range:
  - src:28e4e4b3d44a#p158.3
  - src:28e4e4b3d44a#p158.4
  decision: The CinC Combined Fleet chose not to intervene after learning that the FIRST Striking Force could not meet the
    planned timing, and instead awaited developments.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 17
  focus: The commander received a report of an air attack on Okinawa, only 100 miles from Amami O Shima, and chose to delay
    entry; the later fighter sighting is contextual, not the stated basis for the decision. Exclude navigational or refueling
    details.
  span_range:
  - src:28e4e4b3d44a#p179.2
  - src:28e4e4b3d44a#p179.2
