  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 24
  focus: The source contrasts the original employment schedule with orders to retire TG 38.1 for replenishment and reposition
    other groups. It states that the commander judged the situation stable enough to plan rotations; the later analysis infers
    the threat-coverage rationale from the groups’ locations and composition. Keep the scenario at the level of force posture
    and logistics, not tactical employment or strike planning.
  span_range:
  - src:28e4e4b3d44a#p255.6
  - src:28e4e4b3d44a#p257.3
  decision: COMTHIRDFLT decided to revise the carrier groups’ employment and rotation plan to support logistics while maintaining
    forces positioned to cover the Leyte operation.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 25
  focus: The decision point is whether to accept increased risk to the task group in order to recover personnel and aircraft.
    The account offers possible motivations—including the value of the rescues, an apparently low enemy-attack risk, and precedent—but
    presents them as hypotheses, not a confirmed explanation; exclude tactical recovery methods.
  span_range:
  - src:28e4e4b3d44a#p261.4
  - src:28e4e4b3d44a#p262.2
