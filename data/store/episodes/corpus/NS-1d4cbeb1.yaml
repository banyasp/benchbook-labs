  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to follow the usual chain of command or exercise direct control of task groups after
    the torpedoing of the CANBERRA. The stated reasons include COMTHIRDFLT’s physical presence with the force, communications
    considerations, and the desire for more effective control; exclude the general discussion of command theory except as
    context for this specific choice.
  span_range:
  - src:28e4e4b3d44a#p98.3
  - src:28e4e4b3d44a#p98.5
