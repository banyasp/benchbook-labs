  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 26
  focus: The decision point is whether to follow the southward course to avoid the approaching typhoon or avoid moving closer
    to Luzon. The account says the commander judged the typhoon the greater danger and that concern about Luzon was later
    reduced by a report of successful Allied strikes; exclude navigational details beyond that choice and rationale.
  span_range:
  - src:28e4e4b3d44a#p267.9
  - src:28e4e4b3d44a#p268.2
