    Third Fleet losses.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 23
  focus: The source describes a change from the scheduled fueling area and specifies the commander’s weather-based reason.
    Frame the scenario around the command choice to alter the logistics plan in response to a typhoon forecast; exclude navigational
    or fueling procedures.
  span_range:
  - src:28e4e4b3d44a#p255.3
  - src:28e4e4b3d44a#p255.4
