- n: 1
  focus: The field office was overwhelmed by the refugee influx and lacked sufficient interviewers and facilities; the chief
    had repeatedly recommended a dedicated center, and the President approved the project. Focus on the authorization and
    assignment of responsibility, not the center’s interrogation procedures or collection methods.
  span_range:
  - src:27836a30020c#p1.40
  - src:27836a30020c#p1.42
  decision: The President approved establishing a formal Cuban refugee reception and interrogation center, after the Miami
    field-office chief proposed it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: An arriving refugee described a convoy carrying large, finned objects, and the account was identified as potentially
    significant and consistent with an SS-4. Focus on the decision to report promptly as an intelligence-warning judgment;
    exclude the interview and identification procedures.
  span_range:
  - src:27836a30020c#p1.56
  - src:27836a30020c#p1.58
  decision: The refugee-interrogation center decided to transmit a report of possible SS-4 missiles to Headquarters immediately.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
