episodes:
- n: 1
  focus: The officer testified that superiors had authorized fundraising activity but that he had been told not to solicit
    donations directly under the Boland prohibition. He said he instead provided information and left solicitation to others;
    assess the legal and ethical boundary, not the briefing or fundraising mechanics.
  span_range:
  - src:82c423aee0af#p1.6
  - src:82c423aee0af#p1.7
  decision: The NSC staff officer chose to brief potential donors about contra needs while leaving direct solicitation to
    private fundraisers.
  content_domain: other:gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: After a direct payment, the fundraiser raised concern that contra leaders might use donations unwisely, and the officer
    directed that funds instead go to the fundraiser’s firm; funds were then transferred to the Enterprise. Examine the decision
    about stewardship and official direction of private contributions, not the mechanics of accounts or transfers.
  span_range:
  - src:82c423aee0af#p1.7
  - src:82c423aee0af#p1.8
  decision: The NSC staff officer directed a private fundraiser to route contra donations through an intermediary rather than
    pay contra leaders directly.
  content_domain: other:gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
