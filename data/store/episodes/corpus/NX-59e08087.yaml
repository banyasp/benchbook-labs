episodes:
- n: 1
  focus: The regulation says opening the proceedings may be appropriate in this situation, identifying substantial public
    interest as the reason. Focus on the public-access decision; exclude rules about recording or broadcasting proceedings.
  span_range:
  - src:031d24bb6581#p15.6
  - src:031d24bb6581#p16.1
  decision: The appointing authority, or the IO or board president if the authority has not specified, decides whether to
    open proceedings when there is no respondent and the subject is of substantial public interest.
  content_domain: other:administrative investigations and public access
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 2
  focus: The decision turns on whether the error can be corrected without substantial prejudice to the individual’s rights.
    If it can, the case may be returned for corrective action; if it cannot, the regulation bars use of the affected portion
    as a basis for adverse action and provides options for setting findings aside or referring the case anew. Exclude unrelated
    procedural-error rules.
  span_range:
  - src:031d24bb6581#p20.3
  - src:031d24bb6581#p21.1
  decision: The approval authority decides whether to return a proceeding for correction or set aside affected findings and
    refer the matter to a new IO or board after a substantial error.
  content_domain: other:administrative investigations and procedural remedies
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 3
  focus: The regulation frames designation as a choice to provide a hearing to someone with a direct interest, and makes clear
    that a possible adverse finding or recommendation alone does not settle the choice. It does not specify which course the
    appointing authority should choose in a particular case; exclude later procedural protections except insofar as they explain
    the significance of respondent status.
  span_range:
  - src:031d24bb6581#p29.1
  - src:031d24bb6581#p29.1
  decision: The appointing authority decides whether to designate a person as a respondent, including when an adverse finding
    may be made or adverse action recommended against that person.
  content_domain: other:administrative investigations
  refusal_sensitivity: low
  relaxed:
  - choice_stated
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
  gold_tier: model-solved
