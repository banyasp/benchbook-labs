episodes:
- n: 1
  focus: The decision point is whether to eject or continue trying to recover the aircraft, which was still in a descending
    spiral despite the pilot’s control inputs. The report identifies the aircraft’s nonresponse and the approach to minimum
    ejection altitude as the circumstances; exclude the technical details of flight-control inputs.
  span_range:
  - src:b8897953b337#p1.264
  - src:b8897953b337#p1.264
  decision: The mission pilot decided to eject when the aircraft remained unresponsive and reached minimum uncontrolled ejection
    altitude.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the board’s causal finding among possible explanations for the aircraft’s behavior, including
    pilot input, hydraulic failure, and components affecting the flight controls. The report supports the finding with recorder
    data and component analysis, while leaving the precise failed component unresolved; exclude procedural advice about recovering
    the aircraft.
  span_range:
  - src:b8897953b337#p1.271
  - src:b8897953b337#p1.287
  decision: The AIB president determined that a hydro-mechanical flight-control failure caused the aircraft’s uncommanded
    flight-control outputs and nonresponse to the pilot.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
