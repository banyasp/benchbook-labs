- n: 2
  focus: The reported advice favors postponing the King’s return rather than allowing him to return immediately, pending a
    plebiscite. The stated considerations include avoiding the appearance of legitimizing abuses and the risk to the King’s
    safety; exclude operational security details beyond those policy-level reasons.
