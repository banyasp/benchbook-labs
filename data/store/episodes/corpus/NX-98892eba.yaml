episodes:
- n: 1
  focus: The decision point is the choice of a long-term campaign against Japanese coke production rather than nearer targets
    that could more immediately affect Japanese operations and save lives. The stated rationale was that sustained attacks
    would eventually constrain steel and armaments production; keep the focus on that strategic tradeoff and the stated uncertainty
    in the supporting intelligence, not on strike methods.
  span_range:
  - src:41ceb6314c21#p3.2
  - src:41ceb6314c21#p4.4
  decision: The Joint Chiefs of Staff chose the coke industry as the China-based XXth Bomber Command’s strategic target system.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 2
  focus: The decision point is selecting Yawata for the initial mission, reportedly because it was believed to contain Japan’s
    largest collection of coke ovens, despite the long-distance mission and available alternative priorities. Consider the
    target choice and the reliability of the intelligence behind it; exclude operational details and treat the mistaken damage
    to another industrial site as an outcome, not a separate decision.
  span_range:
  - src:41ceb6314c21#p4.1
  - src:41ceb6314c21#p6.2
  decision: Joint Chiefs of Staff planners selected the Yawata steel plant as the opening target for the China-based B-29
    mission.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
