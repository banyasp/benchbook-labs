episodes:
- n: 1
  focus: The decision point is whether to keep IC expertise and resources within the traditional mission or support a civilian
    health initiative; the document reports continuation of the effort and $375,000 identified for research. The stated reasons
    include the potential for IC resources to address wider public problems and the value of opening IC achievements and ideas
    to the community. Exclude technical details of the imaging tools.
  span_range:
  - src:f70207974650#p1.4
  - src:f70207974650#p1.8
  decision: The Acting Director of Central Intelligence and IC leadership chose to commit IC resources to identifying and
    transferring technologies for breast-cancer research, beyond the IC’s traditional national-security mission.
  content_domain: other:dual-use technology policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is how to pursue the display capability given the cost of an intelligence-only workstation and
    the IC’s limited potential purchases. The document says NIDL saw the larger medical market as leverage and reconciled
    the requirements of both user communities. Exclude the display’s technical specifications and design details.
  span_range:
  - src:f70207974650#p8.4
  - src:f70207974650#p8.8
  decision: NIDL leadership chose to use the medical-imaging market to help make a high-resolution display affordable for
    intelligence users, rather than develop an expensive display for the comparatively small IC market alone.
  content_domain: other:dual-use technology policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
