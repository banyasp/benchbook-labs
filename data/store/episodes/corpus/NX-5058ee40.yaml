episodes:
- n: 1
  focus: The decision point is whether to continue the check flight or stop after discovering the warning-system problem.
    Focus on the pilot’s risk judgment and the absence of explicit guidance prohibiting continuation; exclude the later aircraft-handling
    decisions and technical details of the flight profile.
  span_range:
  - src:550cd0713404#p24.11
  - src:550cd0713404#p24.11
  decision: The mishap pilot decided to continue the FCF above 15,000 feet despite an ineffective stall-warning system.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: At 15,000 feet, the pilot could stop the check flight or continue despite the warning-system problem; the pilot chose
    to continue into the high-altitude checks. Focus on the safety judgment and the lack of explicit guidance prohibiting
    continuation, not on the flight maneuvers or checklist procedures.
  span_range:
  - src:550cd0713404#p29.3
  - src:550cd0713404#p29.3
  decision: The mishap pilot decided whether to continue the functional check flight after observing that stall-warning tones
    were delayed or absent.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
