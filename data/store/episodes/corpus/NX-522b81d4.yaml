  focus: The decision point is whether to expand the MDRS program beyond its initial site or leave it at proof-of-purpose
    scale; the source says HQDA directed expansion after the initial effort was a resounding success. Exclude the detailed
    processes for receiving, repairing, and transferring equipment.
  span_range:
  - src:61abd5585719#p5.3
  - src:61abd5585719#p5.3
  decision: HQDA decided to direct AMC to establish 13 additional MDRSs after the Fort Cavazos proof-of-purpose site succeeded.
  content_domain: other:military logistics policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to retain these sites or close them and rely on the remaining MDRSs. The source cites
    resource constraints and declining usage, notes the installations have fewer large FORSCOM units, and says the remaining
    sites are close enough to accept their equipment; exclude site-level operating procedures.
  span_range:
  - src:61abd5585719#p7.3
  - src:61abd5585719#p7.3
  decision: ASC decided to close the Fort Irwin, Fort Johnson, and Fort Moore MDRS sites in late 2023.
  content_domain: other:military logistics policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to commit division funds to added maintenance capacity or operate without that contractor
    team. The source says the team increased MDRS processing velocity and helped remove equipment from tactical units’ property
    books, freeing unit resources and helping meet gaining-unit needs; exclude technical maintenance procedures.
  span_range:
  - src:61abd5585719#p17.4
  - src:61abd5585719#p17.4
  decision: The 1st Infantry Division decided to fund a 17-person contractor maintenance team for the Fort Riley MDRS.
