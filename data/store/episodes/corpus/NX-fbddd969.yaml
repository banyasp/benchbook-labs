episodes:
- n: 1
  focus: The decision is whether to retain the existing mix of liaison roles and rotating SOF augmentations or establish a
    dedicated, longer-term program to synchronize engagements with partner forces. The essay favors SOLT to address fragmented
    planning, weak regional expertise, and partner-force capacity gaps, while noting funding, career progression, authority,
    and concerns about militarizing foreign policy; exclude the proposed assignment and reporting mechanics as details rather
    than separate decisions.
  span_range:
  - src:48ad59e63c4a#p14.2
  - src:48ad59e63c4a#p21.2
  decision: USSOCOM leadership decides whether to transform the SOLO program into a regionally aligned, specially trained
    SOLT program.
  content_domain: other:security cooperation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The SATG commander wanted the force to develop capacity to train its own formations after narrow, repetitive JCETs
    proved insufficient; the SOF liaison element brought that preference to U.S. force providers, and an internal cadre resulted.
    Focus on the partner-capacity choice and its rationale, not on details of how the training was conducted.
  span_range:
  - src:48ad59e63c4a#p16.2
  - src:48ad59e63c4a#p16.3
  decision: The Chadian SATG commander and U.S. SOF force providers decide whether to build an internal Chadian training cadre
    or continue relying on episodic JCET training.
  content_domain: other:security cooperation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is the 2010 policy response to male soldiers’ interactions with Afghan women seriously damaging
    trust and productive relationships. The source says commanders recognized the need for female teams and describes their
    recruitment and preparation; exclude operational methods and training details.
  span_range:
  - src:48ad59e63c4a#p39.4
  - src:48ad59e63c4a#p40.3
  decision: U.S. military commanders decide whether to establish and recruit all-female Cultural Support Teams for engagement
    with Afghan women rather than continue relying on all-male units.
  content_domain: other:military personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The essay frames Afghanistan’s police-development mission amid terrorism, insurgency, corruption, and other security
    threats, compares the roles and capacities of the candidate organizations, and recommends Army Special Forces. Treat this
    as a policy choice about institutional responsibility; exclude operational procedures and force-employment techniques
    discussed in the essay.
  span_range:
  - src:48ad59e63c4a#p46.2
  - src:48ad59e63c4a#p51.2
  decision: U.S. decision-makers choose which organization should lead efforts to build and legitimize a fragile state’s police
    force, with Army Special Forces, military police, and State Department civilian police assistance as alternatives.
  content_domain: other:security assistance policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The essay recommends creating a dedicated, regionally trained SOF FID cadre rather than relying on existing FID practices
    and the FAO program alone. It gives reasons including FID failures, gaps in FAO capability, the value of long-term regional
    relationships, and expected costs; treat this as a proposed institutional policy choice, not an adopted decision. Exclude
    operational employment details and the unresolved question of officers’ status under a Status of Forces Agreement or State
    Department Country Team.
  span_range:
  - src:48ad59e63c4a#p61.4
  - src:48ad59e63c4a#p67.3
  decision: USSOCOM leadership decides whether to establish a Joint FID Management Office and a cross-service SOF FID officer
    specialization.
  content_domain: other:military personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
