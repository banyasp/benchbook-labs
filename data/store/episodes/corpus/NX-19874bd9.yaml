- n: 1
  focus: 'The decision followed staff interviews after major exercises: personnel found the old portal difficult to search,
    and the redesign aimed to make current, relevant information easier to find and reduce dashboard clicks. Focus on the
    organizational decision and its usability rationale; exclude implementation details of the site or dashboard.'
  span_range:
  - src:7ed3732094b0#p7.5
  - src:7ed3732094b0#p7.5
  decision: The Army service component command’s knowledge-management staff chose to revamp the SharePoint portal and Commander’s
    Dashboard rather than retain the existing design.
  content_domain: other:knowledge-management policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The stated aim was to reduce portal account approval time and avoid service requests for directorate content management.
    Focus on the delegation and access-governance choice; exclude technical instructions for administering permissions.
  span_range:
  - src:7ed3732094b0#p8.3
  - src:7ed3732094b0#p9.1
  decision: The Army South KM team chose to authorize KMRs to manage personnel and directorate content permissions instead
    of routing each request through a service request.
  content_domain: other:knowledge-management policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The policy set a two-year threshold and required annual review, balancing easier retrieval of operationally relevant
    information and storage management with access to historical documents; the source also conditions retention on legal
    requirements. Focus on the retention and archiving policy and its legal constraint, not document-handling procedures.
  span_range:
  - src:7ed3732094b0#p9.4
  - src:7ed3732094b0#p9.5
  decision: The Army South KM program assigned directorate KMRs to retain current, relevant portal information and archive
    older documents to the shared drive.
  content_domain: other:records-management policy
  refusal_sensitivity: low
  held_out: false
