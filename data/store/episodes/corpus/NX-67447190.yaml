episodes:
- n: 1
  focus: The decision was whether to entrust the fact-finding to the Attorney General or use another process. The stated reason
    was fragmented responsibilities, missing documentation, and confusion that made a coherent factual overview necessary;
    exclude later judgments about whether the inquiry was impartial.
  span_range:
  - src:899db722d2b3#p1.52
  - src:899db722d2b3#p1.53
  decision: The President accepted the Attorney General’s offer to conduct an internal fact-finding inquiry into the administration’s
    knowledge of the Iran arms sales.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to question the President about his knowledge and when he acquired it, a matter the
    passage identifies as central to the inquiry. The Attorney General said it did not seem important at that stage; exclude
    broader conclusions about his motives unless separately supported.
  span_range:
  - src:899db722d2b3#p1.52
  - src:899db722d2b3#p1.54
  decision: The Attorney General chose not to ask the President what he knew about the November 1985 shipment.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision was whether to allow disputed testimony to proceed or pause and correct it while the facts were checked.
    The passage links the decision to concerns about inconsistencies in the proposed testimony and a contemporaneous note;
    exclude details of how testimony was prepared beyond this corrective choice.
  span_range:
  - src:899db722d2b3#p1.43
  - src:899db722d2b3#p1.46
  decision: After learning of the factual dispute over the HAWK shipment, the Attorney General directed that nothing be said
    about it until the facts were clear and that the CIA Director’s testimony be changed.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The Attorney General agreed that the inquiry was aimed at gathering information to protect the President and address
    the political crisis, and that interviewees had no ordinary legal compulsion to answer. Treat the choice as one about
    the inquiry’s purpose and posture; exclude questions about the underlying arms-transfer operations.
  span_range:
  - src:899db722d2b3#p1.103
  - src:899db722d2b3#p1.104
  decision: The Attorney General chose to conduct the November 1986 inquiry as an informal, politically focused fact-gathering
    effort rather than a criminal investigation.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The report says the chief of staff knew the assertion was false but was unwilling to speak up until the legality
    of the shipment was determined. Focus on the choice between correcting the record and remaining silent, and the stated
    concern about the unresolved legal determination; exclude other attendees’ silence where their reasons are not specified.
  span_range:
  - src:899db722d2b3#p1.90
  - src:899db722d2b3#p1.91
  decision: The White House chief of staff chose not to correct the Attorney General’s assertion at the November 24, 1986
    meeting that the President had not known of the shipment.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: After a brief assessment, the Attorney General concluded that the Secretary of Defense could contribute little and
    that further interviewing was unnecessary. Focus on the investigative-scope decision and its stated rationale; exclude
    the later discovery of records except as context showing the consequence of that assessment.
  span_range:
  - src:899db722d2b3#p1.64
  - src:899db722d2b3#p1.64
  decision: The Attorney General decided not to interview the Secretary of Defense further during the initial Iran inquiry.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision was whether to allow the investigations to continue or briefly delay them while hostage-rescue efforts
    were underway. The Attorney General said the purpose was to avoid publicly exposing the Iran arms sales and jeopardizing
    the hostage-rescue operation; the report found no convincing evidence of another purpose. The accounts differ on timing,
    so do not treat the conflicting dates as resolved.
  span_range:
  - src:899db722d2b3#p1.112
  - src:899db722d2b3#p1.114
  decision: The Attorney General chose to delay FBI and Customs investigations of Southern Air Transport at the National Security
    Adviser’s request.
  content_domain: other:law-enforcement oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: After receiving the Attorney General’s request, the Assistant Attorney General asked the FBI Director to stop all
    non-urgent investigations, and the Director agreed. The stated reason was to avoid jeopardizing the hostage operation.
    Exclude operational details of the investigations themselves.
  span_range:
  - src:899db722d2b3#p1.114
  - src:899db722d2b3#p1.114
  decision: The Assistant Attorney General chose to ask the FBI Director to stop non-urgent investigations temporarily.
  content_domain: other:law-enforcement oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: A national security staff member asked the Associate Attorney General to seek intervention that would slow or narrow
    the Customs inquiry. The Associate Attorney General reported that the Attorney General discussed the matter with the Treasury
    Secretary, who planned to advise Customs about the sensitivity of Southern Air Transport’s connection to government operations;
    the accounts and the extent of any intervention are not fully consistent. The stated concern was avoiding disclosure of
    Iran covert-action roles, not the investigative methods or records themselves.
  span_range:
  - src:899db722d2b3#p1.115
  - src:899db722d2b3#p1.117
  decision: The Attorney General chose whether to intervene with Treasury officials over Customs’ Southern Air Transport investigation.
  content_domain: other:law-enforcement oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
