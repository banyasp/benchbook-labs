  focus: The policy favors capture and permits proposing lethal force only when capture is infeasible and no other reasonable
    alternative can effectively address the threat, taking account of the relevant threat and opportunity to act. Treat this
    as a policy-level conditional decision, not a specific strike authorization; exclude operational methods and targeting
    technique.
