- n: 1
  focus: The Board weighed retaining broad generalizations against allowing more specific first-person accounts, and adopted
    a case-by-case standard that permitted locations and general descriptions when they would not damage national security.
    Focus on the disclosure-review policy judgment and its limits; exclude the underlying operational activities and details
    of sources, cover, or facilities.
  span_range:
  - src:e0bd494eba32#p6.2
  - src:e0bd494eba32#p6.7
  decision: The Publications Review Board decided to relax prior restrictions for a former senior officer’s manuscript, allowing
    him to describe where he served and his work in general terms, subject to deletions protecting sensitive information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether the matter should remain in the employee’s component review process or be taken over
    by the Board. The document says Board review is generally used when a proposal has Agency-wide implications or involves
    equities beyond one directorate; exclude adjudication of the book’s underlying allegation, which the passage does not
    resolve.
  span_range:
  - src:e0bd494eba32#p5.3
  - src:e0bd494eba32#p5.5
  decision: The head of a current employee’s directorate requested, and the Publications Review Board undertook, review of
    the employee’s proposed book accusing the Agency of complicity in a Gulf War syndrome cover-up.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The choice was whether to challenge the review in court or not; the stated reason for declining was that the review
    appeared consistent with the Clarridge review. Keep the focus on this legal challenge decision, not on the manuscript’s
    operational content.
  span_range:
  - src:e0bd494eba32#p7.4
  - src:e0bd494eba32#p7.5
  decision: The American Civil Liberties Union decided not to litigate a Publications Review Board decision after concluding
    that the review conformed to the treatment given to the Clarridge manuscript.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
