  focus: The decision point is whether to disclose the unemployment data or withhold it, followed by the choice to resume
    publication with a different reported figure. The article connects the broader restriction of negative economic information
    to leaders’ concern that it could fuel public discontent, but does not establish that this was the specific reason for
    suspending this statistic; exclude speculation about the calculation method.
