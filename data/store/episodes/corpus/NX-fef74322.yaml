  focus: The author advocates proceeding with a network that links agency indexes while keeping substantive records separate,
    rather than leaving searches to disconnected manual systems. The stated reasons include faster responses, fewer missed
    name matches, and reduced labor; the passage presents a proposal and recommendation, not evidence that the committee approved
    or implemented it. Exclude the detailed name-matching and computer-processing procedures.
