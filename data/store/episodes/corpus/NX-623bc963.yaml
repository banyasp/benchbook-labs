- n: 1
  focus: The choice was to pursue discussions about a possible deal or decline further exploration. The President declined,
    weighing Hewitt’s proposed potential benefits against the Allied commitment to consult one another on peace and the risk
    of undermining relations with the Soviet Union. Exclude the mechanics of any clandestine meetings or communications.
  span_range:
  - src:c3de52bd6d5d#p6.4
  - src:c3de52bd6d5d#p11.5
  decision: The President decides whether to authorize further exploration of Himmler’s proposed arrangement with the Western
    Allies.
  content_domain: other:wartime diplomacy
