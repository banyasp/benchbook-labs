  natsec: false
- n: 2
  focus: The minister could tolerate continued contacts or recommend ending the officer’s presence in Sweden; he recommended
    removal, and the officer subsequently left. The stated concern was that the contacts were extremely dangerous and risked
    worsening suspicion among the Allies, especially amid reports of alleged separate-peace overtures. Exclude the proposed
    travel arrangements and other logistics.
  span_range:
  - src:c3de52bd6d5d#p8.2
  - src:c3de52bd6d5d#p9.3
  decision: The U.S. minister in Stockholm recommends that the OSS officer be removed from Sweden over his contacts with Himmler’s
    emissaries.
