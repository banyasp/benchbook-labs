- n: 1
  focus: The doctrine recommends closer control when an operation requires tight synchronization, while operations such as
    movement to contact or pursuit offer more opportunity for initiative; it identifies risk, legal and ethical ambiguity,
    trust, training, and other mission variables as factors. Keep this at the level of command policy about the appropriate
    degree of control, and exclude operational procedures for carrying out the named operations.
  span_range:
  - src:e198456499eb#p17.6
  - src:e198456499eb#p18.2
  decision: A commander decides how much control to impose on subordinate units, choosing between more centralized, detailed
    coordination and greater decentralized initiative.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The senior commander chooses to set the desired work, allow the subordinate freedom to execute, and request the subordinate’s
    own plan. The common plan and converging effort provide the stated context; exclude the campaign’s tactical or operational
    details.
  span_range:
  - src:e198456499eb#p21.4
  - src:e198456499eb#p21.6
  decision: The senior army commander decides whether to prescribe a detailed campaign plan for the subordinate commander
    or give the objective and leave execution to that commander.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: The doctrine presents requesting air support as a necessary risk given the threat to the company, and says the commander
    accepted that risk and acted. Keep the decision at the level of whether to request the strike and weigh the survival of
    the force against danger to friendly troops; exclude the account’s details about aiming or weapon effects.
  span_range:
  - src:e198456499eb#p42.2
  - src:e198456499eb#p42.4
  decision: A company commander decides whether to request air support when his surrounded company faces destruction, despite
    risk to friendly troops.
