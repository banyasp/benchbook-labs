- n: 4
  focus: The doctrine recommends allowing the decision when it does not endanger lives, so the subordinate can learn and trust
    can develop. Keep the issue to command judgment about tolerating risk in training; do not expand it into tactical instruction.
  span_range:
  - src:e198456499eb#p51.4
  - src:e198456499eb#p51.5
  decision: A commander decides whether to allow a subordinate’s excessively risky decision during training as a teaching
