- n: 5
  focus: The doctrine frames the decision for a commander when a subordinate reports that its resources are inadequate or
    that accomplishing its mission would impose unacceptable costs. The passage identifies the available courses and relevant
    considerations, but leaves the choice to the commander; do not supply an outcome the source does not state.
  span_range:
  - src:e198456499eb#p43.5
  - src:e198456499eb#p43.5
  decision: A commander decides whether to accept risk, allocate additional resources, or change a subordinate unit’s plan
    after it reports inadequate resources or unacceptable costs.
  content_domain: operational-command
