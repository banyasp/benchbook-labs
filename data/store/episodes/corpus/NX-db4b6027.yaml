- n: 1
  focus: The decision point is whether to create a separate command node despite the lack of dedicated personnel and equipment,
    or continue relying on existing headquarters and the MEB. The document says exercises exposed a need for additional command
    capacity, while the MEB lacked authority over corps and division units; exclude general SACP duties and design details.
  span_range:
  - src:69dc8b3667a8#p9.2
  - src:69dc8b3667a8#p10.3
  decision: Corps and division commanders chose to establish and internally resource a support area command post (SACP), rather
    than rely on the MEB or existing command posts alone, to exercise mission command in the support and consolidation areas.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether the SACP would merely coordinate or exercise control over units in the support area.
    Focus on the division’s command-design choice and its stated rationale; exclude the specific operational tasks and techniques
    the SACP might carry out.
  span_range:
  - src:69dc8b3667a8#p45.3
  - src:69dc8b3667a8#p45.3
  decision: The 1st Armored Division leadership chose to design its WFX 17-03 SACP as a controlling command post, rather than
    only a coordinating post.
  content_domain: operational-command
  refusal_sensitivity: low
