  focus: 'The decision point is the leadership’s choice between continuing to conceal foreign espionage and admitting selected
    past operations to the Soviet public. The article suggests possible reasons: framing the work as defensive and anti-Nazi,
    reassuring the public after Western espionage revelations, and improving intelligence-service morale; it also notes that
    the leadership judged the advantages to outweigh possible adverse effects. Treat these explanations as the author’s analysis,
    not confirmed internal deliberations, and exclude operational details of espionage.'
