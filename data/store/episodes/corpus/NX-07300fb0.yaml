episodes:
- n: 1
  focus: The decision weighs conversion to military service against keeping experienced civilian workers in place during wartime.
    Focus on the staffing and transition policy, not on the cryptologic work itself.
  span_range:
  - src:28e16b8b86b1#p8.6
  - src:28e16b8b86b1#p9.2
  decision: The head of the Navy cryptologic office chose to encourage civilian women to apply for naval service while retaining
    the civilian employment program and allowing a gradual transition.
  content_domain: other:personnel policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The office sought smaller groups spaced six weeks apart; the Navy arranged a less extensive stagger over several
    weeks. Focus on scheduling and continuity of staffing, excluding cryptologic methods or procedures.
  span_range:
  - src:28e16b8b86b1#p9.4
  - src:28e16b8b86b1#p9.4
  decision: Navy authorities chose to stagger the indoctrination of cryptologic office employees entering naval service rather
    than remove them all from work at once.
  content_domain: other:personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The choice was between maintaining strict silence and offering a bounded explanation to help operators understand
    the significance of their work. Focus on the authorization and limits of that disclosure; exclude technical details about
    the equipment or the result.
  span_range:
  - src:28e16b8b86b1#p14.3
  - src:28e16b8b86b1#p15.2
  decision: The chief of Bombe operations, with senior approval, chose to give operators a limited explanation of the importance
    of their work after a valuable result was mistakenly discarded.
  content_domain: other:information-secrecy policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
