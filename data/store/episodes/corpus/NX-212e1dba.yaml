episodes:
- n: 1
  focus: After revising the division plan to address the unexpected situation, the commander chooses to avoid trying to control
    every moving part and instead keep the force oriented toward a common aim. Focus on the balance between central control
    and subordinate flexibility, and exclude the specific attack plan and operational tasks.
  span_range:
  - src:81f49cfab75f#p28.2
  - src:81f49cfab75f#p30.2
  decision: The division commander decides whether to centrally control the changing operation or give subordinate units latitude
    while coordinating only what is essential.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The pilot judges that the standard reporting route could delay warning because weather has disrupted communications
    and the ground force faces an urgent threat. Focus on the choice of reporting channel and its urgency rationale; exclude
    the aircraft’s movement, landing, and any tactical engagement.
  span_range:
  - src:81f49cfab75f#p13.2
  - src:81f49cfab75f#p14.2
  decision: The attack-helicopter pilot decides whether to report the unexpected enemy force through the standard support
    channel or alert a nearby ground unit directly.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: On learning that a platoon has been attached to a neighboring company, the commander chooses not to contest the arrangement
    because the platoon is engaged in that company’s fight and unity of command favors having it answer to that company. Focus
    on the authority and coordination judgment; exclude the platoon’s combat actions.
  span_range:
  - src:81f49cfab75f#p34.3
  - src:81f49cfab75f#p35.2
  decision: The company commander decides whether to challenge or accept the attachment of his platoon to another company
    during the developing fight.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 4
  focus: The doctrine identifies analytical decisionmaking as potentially appropriate in this stated planning context, contrasting
    it with the faster intuitive approach. Keep the focus on selecting a decisionmaking approach and the stated time and information
    factors; exclude any operational plan or execution details.
  span_range:
  - src:81f49cfab75f#p109.3
  - src:81f49cfab75f#p110.2
  decision: A commander deciding whether to use analytical or intuitive decisionmaking for prehostility mobilization or contingency
    planning when time is available and extensive information can be gathered.
  content_domain: operational-command
  refusal_sensitivity: low
