episodes:
- n: 1
  focus: The decision followed the abduction of Israeli personnel and the refusal to provide information or permit Red Cross
    visits to them. The authorities chose to bar visits to the applicants, reasoning that this might help obtain information
    and that the applicants retained other means of contact with the outside world; exclude the separate question of whether
    the court ultimately found the ban reasonable.
  span_range:
  - src:717bfe63ca4c#p1.8
  - src:717bfe63ca4c#p1.15
  decision: The Attorney General and security authorities decide to suspend Red Cross visits to the applicants.
  content_domain: other:detention-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The court reviews the ban under the reasonableness standard, balancing humanitarian considerations against security
    concerns related to missing and abducted Israeli personnel. It concludes that the passage of time increases the humanitarian
    weight and diminishes the security justification, and orders visits; exclude the broader legal questions the court leaves
    for future determination.
  span_range:
  - src:717bfe63ca4c#p1.10
  - src:717bfe63ca4c#p1.14
  decision: The High Court decides to require the security authorities to arrange Red Cross visits to the applicants.
  content_domain: other:judicial-review
  refusal_sensitivity: low
  held_out: false
  natsec: false
