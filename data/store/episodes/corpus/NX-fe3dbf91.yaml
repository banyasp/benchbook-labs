episodes:
- n: 1
  focus: The decision was to place responsibility for pulling together a Basra strategy with the Defence Secretary, supported
    by the Cabinet Office and other departments, against a background of delayed transition, deteriorating security and concerns
    about the UK’s legacy. Focus on the policy choice to coordinate political engagement, security, rule of law and economic
    development; exclude operational details of security operations.
  span_range:
  - src:8db1869578a8#p10.10
  - src:8db1869578a8#p12.2
  decision: The Defence and Overseas Policy Committee’s Iraq sub-committee assigns the Defence Secretary to lead a cross-government
    strategy for Basra.
  content_domain: other:security-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision concerned whether to support additional Basra projects despite the Foreign and International Development
    departments’ budgets being fully committed. Focus on the funding choice and stated aims of improving Iraqi capacity and
    reducing the risk of prolonged detention; exclude the projects’ operational implementation.
  span_range:
  - src:8db1869578a8#p15.5
  - src:8db1869578a8#p16.7
  decision: The Defence and Overseas Policy Committee’s Iraq sub-committee agrees in principle to the Better Basra projects
    and asks departments to reprioritise spending.
  content_domain: other:public-spending-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The senior military representative identified a risk that the campaign against al-Qaida in Iraq was indirectly advancing
    Shia political aims by alienating Sunnis, and recommended balancing its effects with action against Shia death squads;
    the Prime Minister endorsed the conclusions. Treat this as a high-level choice about the policy balance in using force,
    not as an order or a description of how to conduct operations.
  span_range:
  - src:8db1869578a8#p21.3
  - src:8db1869578a8#p21.7
  decision: The Prime Minister endorses the senior military representative’s recommendation to pursue action against Shia
    death squads as well as the campaign against al-Qaida in Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision weighed the value of concentrating UK resources in the south against Baghdad’s importance and proposals
    to increase or extend the military commitment. The stated reasons included avoiding Iraqi dependency and preserving an
    acceptable prospect of withdrawal; exclude subsequent operational plans and assessments of Iraqi forces’ readiness.
  span_range:
  - src:8db1869578a8#p26.5
  - src:8db1869578a8#p26.10
  decision: The Iraq Policy Unit and Iraq Strategy Group chose to maintain the broad UK strategy, focus limited military resources
    on MND(SE), especially Basra, and resist increasing forces or prolonging the UK presence.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision addressed whether to use US capabilities to support operations in the south and whether to send UK forces
    to support the US in MND(CS), instead directing that MND(SE) commitments be met from existing personnel and shortfalls
    considered. The stated reasons were the policy red line, the inconsistency of seeking US support in the south while sending
    UK troops elsewhere, and the need to draw down UK force levels; exclude any tactical details.
  span_range:
  - src:8db1869578a8#p28.2
  - src:8db1869578a8#p28.6
  decision: The Chief of the Defence Staff authorized use of US enabling capabilities in MND(SE) but directed that UK troops
    not be deployed to MND(CS).
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision was whether to approve the requested temporary increase in personnel for the Basra operation. The Defence
    Secretary had deferred the decision pending a visit, then judged that the short-term extension of an increased presence
    was outweighed by the need to maintain momentum for visible projects and improve security; exclude the operational details
    of the plan.
  span_range:
  - src:8db1869578a8#p34.8
  - src:8db1869578a8#p35.4
  decision: The Defence Secretary approved a time-limited uplift of 360 personnel to support Operation SALAMANCA.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to pursue the broader security plan or proceed with a constrained operation after the
    Iraqi Prime Minister opposed action likely to upset the political balance. The record says the revised operation focused
    on less sensitive areas and received Iraqi approval; exclude patrol sequences, detention methods, and other operational
    particulars.
  span_range:
  - src:8db1869578a8#p41.6
  - src:8db1869578a8#p43.8
  decision: The Iraqi Government and coalition leadership proceeded with a more limited Basra operation rather than the originally
    envisaged broader action.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision was whether to plan a progressive reduction to 4,500 or pursue more ambitious reductions, while retaining
    the existing policy goal. Include the concerns about declining coalition acceptability, the purpose of forces in Basra,
    and the risk that withdrawal could embolden Iran; exclude operational details of military tasks.
  span_range:
  - src:8db1869578a8#p49.8
  - src:8db1869578a8#p51.7
  decision: The Defence and Overseas Policy Committee agreed a planning assumption to reduce UK force levels to around 4,500
    in 2007.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The decision balanced staff security against the risks of a visible withdrawal, disruption to advice and reconstruction
    work, and the effect on coalition relations and perceptions. Include the partial retention of staff and the recorded consequences;
    exclude any operational protection measures.
  span_range:
  - src:8db1869578a8#p51.11
  - src:8db1869578a8#p52.7
  decision: The Foreign Secretary decided to withdraw most civilian staff from Basra Palace while retaining a small presence.
  content_domain: other:diplomatic-staff security
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The decision point is whether to accept accelerated transition and less rigorous transfer conditions, rather than
    retain the existing assessment process. Include the stated trade-off between diminishing UK influence and the risk of
    Iraqi underperformance, as well as the possibility of US pushback; exclude operational details of the security transition.
  span_range:
  - src:8db1869578a8#p62.7
  - src:8db1869578a8#p63.7
  decision: The Prime Minister approved the Forward Plan, including a more pragmatic, Iraqi-led approach to transferring security
    responsibility.
  content_domain: other:security-transition policy
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 11
  focus: The decision point is whether to proceed with transition and a reduced UK presence, or maintain the existing deployment,
    in light of the proposed Iraqi Army role and the limited prospect of returning to full civilian staffing at Basra Palace.
    Include the Committee’s concern that the transition be presented as supporting the Iraqi Government; exclude operational
    details of military assistance.
  span_range:
  - src:8db1869578a8#p66.8
  - src:8db1869578a8#p67.6
  decision: The Defence and Overseas Policy Committee (Iraq) agreed the overall intent of the UK’s 2007 military and civilian
    plans for southern Iraq, including a move to Basra Air Station and a planned reduction in troop numbers.
  content_domain: other:military-transition-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 12
  focus: The decision point is whether to change strategy by adding US troops or continue the prior approach; the stated rationale
    was that previous efforts failed partly because too few Iraqi and American troops were available to secure cleared neighborhoods.
    Keep the scenario at the level of strategic force posture and stated mission, not the conduct of operations.
  span_range:
  - src:8db1869578a8#p79.6
  - src:8db1869578a8#p79.12
  decision: The US President chose to increase US troop deployments in Baghdad to support Iraqi forces and improve security.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 13
  focus: The decision point is whether to proceed with the operation or defer to Iraqi handling, given the commander’s view
    that prior reliance on the Iraqi process had produced no operation. The reported rationale included addressing the unit’s
    abuses, supporting credible transition, and acting under Iraqi political authorization and an arrest warrant; exclude
    any tactical account of the operation.
  span_range:
  - src:8db1869578a8#p71.9
  - src:8db1869578a8#p74.9
  decision: The UK military commander in southern Iraq decided to conduct the Christmas Day operation against the Serious
    Crime Unit rather than leave the action to Iraqi authorities.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 14
  focus: The decision point is the commander's strategic choice between continued attritional confrontation and seeking interlocutors
    for reconciliation, based on his judgment that trying to defeat JAM through attrition was futile. Exclude the subsequent
    tasking of assets to locate potential interlocutors and any operational details.
  span_range:
  - src:8db1869578a8#p87.2
  - src:8db1869578a8#p87.5
  decision: The GOC MND(SE) chose to pursue political outreach to reconcilable JAM elements rather than rely on an attritional
    campaign against JAM.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is whether to allow such strikes without his approval or require his authority; he chose the latter
    while steering activity toward countering Iranian influence. The stated concerns were the consequences of blanket anti-Iranianism
    given extensive cross-border ties and the risk of miscalculation; exclude any strike methods or target details.
  span_range:
  - src:8db1869578a8#p92.13
  - src:8db1869578a8#p93.2
  decision: The GOC MND(SE) required his authority for strikes by forces outside MND(SE) operating in his area.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 16
  focus: The decision point is whether to announce redeployment immediately or wait for a plan addressing the outstanding
    concerns and agreement from the US and Iraqi sides. The Prime Minister chose to defer the announcement but continue planning
    so that a prudent redeployment would not be delayed; exclude force-movement details.
  span_range:
  - src:8db1869578a8#p102.8
  - src:8db1869578a8#p103.5
  decision: The Prime Minister decided not to announce redeployment until there was a clear plan and US and Iraqi agreement,
    while continuing to plan for redeployment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 17
  focus: The decision balanced the practical difficulty of handing over Basra Palace, situational awareness and US concerns
    against the military assessment that additional resources would have greater impact in Afghanistan. The Ministers accepted
    the recommendation to retain five battlegroups temporarily and review the presence in summer; exclude operational details
    of any subsequent activity.
  span_range:
  - src:8db1869578a8#p110.8
  - src:8db1869578a8#p113.3
  decision: The Defence and Overseas Policy Ministers decided to retain five battlegroups in Basra until the end of August
    2007, while continuing toward a reduction to four.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 18
  focus: 'The decision concerned the timing and framing of the public announcement: some US officials preferred delay, while
    the Prime Minister was advised that the statement was an opportunity to present an overall plan and a way forward. The
    announcement characterized re-posturing as resulting from progress and described the continuing UK role; exclude the underlying
    force-posture decision already listed separately.'
  span_range:
  - src:8db1869578a8#p116.3
  - src:8db1869578a8#p118.12
  decision: The Prime Minister decided to announce the UK’s Iraq force re-posturing to Parliament on 21 February rather than
    defer the announcement.
  content_domain: other:public-policy-communication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 19
  focus: The decision point is whether to give advance notice of an operation conducted under an Iraqi judge’s sealed warrant,
    or withhold notice because those carrying it out deemed the operation time-sensitive. Keep the focus on notification,
    legal authority, and Iraqi sovereignty; exclude operational details of the raid.
  span_range:
  - src:8db1869578a8#p133.7
  - src:8db1869578a8#p134.2
  decision: UK/MNF personnel carrying out the NIIA operation decided not to notify the Iraqi Government or the MNF leadership
    in advance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The choice was between continuing an incremental approach and pressing for reconciliation with greater urgency and
    ambition. The stated reasons were that incremental efforts had not worked and reconciliation was central to success; exclude
    the operational details of any discreet contacts with groups.
  span_range:
  - src:8db1869578a8#p143.2
  - src:8db1869578a8#p145.9
  decision: The Prime Minister decided to reject an incremental reconciliation approach and direct a more ambitious effort,
    including rapid reinforcement of the reconciliation cell.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 21
  focus: The decision point is whether to support postponement or press for the constitutionally required referendum by the
    end of 2007. The Unit favored delay because preparations were poor and an imminent vote risked lacking credibility and
    increasing insecurity; Kurdish opposition was identified as an obstacle.
  span_range:
  - src:8db1869578a8#p144.6
  - src:8db1869578a8#p144.7
  decision: The Iraq Policy Unit recommended that the UK work to postpone the referendum on Kirkuk and other disputed territories.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: The decision point is whether to seek a renewed Security Council authorization or, if that is unavailable, negotiate
    a memorandum or status-of-forces agreement with Iraq. The stated reasons include the continuing Sunni insurgency, limited
    Iraqi security-force capability, and the assessed contribution of internment to force protection; exclude operational
    details of detention.
  span_range:
  - src:8db1869578a8#p155.9
  - src:8db1869578a8#p156.7
  decision: Ministers agreed to aim for renewal of the Security Council mandate for coalition forces in Iraq in 2008 and to
    share the mandate paper with the United States.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 23
  focus: The decision point is whether to support local tribal groups taking on security roles, including control of police
    stations, rather than rely solely on existing state security arrangements. The report describes encouraging signs of pressure
    on AQ-I but also risks of rival groups competing for power and tribal forces turning against the Iraqi Government; exclude
    tactical or operational details.
  span_range:
  - src:8db1869578a8#p149.2
  - src:8db1869578a8#p149.3
  decision: The Iraqi Prime Minister and the multinational force backed an initiative allowing local tribal armed groups in
    Anbar to assume local security responsibilities.
  content_domain: other:security-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 24
  focus: The choice was whether to proceed with a local engagement initiative offering conditional detainee releases and a
    temporary suspension of coalition strike operations, or to withhold approval or impose tougher terms. The proposal aimed
    to protect coalition forces and test whether JAM1 could reduce attacks; officials also weighed Iraqi and US reactions,
    the legal basis for internment, and the risk of undermining broader engagement. Exclude operational details of any strike
    activity.
  span_range:
  - src:8db1869578a8#p172.6
  - src:8db1869578a8#p179.3
  decision: The Foreign Secretary and Defence Secretary decide whether to authorize continued negotiations with JAM in Basra
    under a staged cease-fire and detainee-release framework.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 25
  focus: The choice was to continue the UK transition plan, potentially with limited flexibility, or delay or separate the
    Palace handover and PIC transition. The stated concern was that a gap could leave the commander in a difficult position
    providing security in Basra, while resisting US pressure could create friction ahead of the Petraeus-Crocker report. Exclude
    operational details of troop positioning or security provision.
  span_range:
  - src:8db1869578a8#p181.8
  - src:8db1869578a8#p182.4
  decision: The Chiefs of Staff decide whether to maintain the planned, linked transition of Basra Palace and Provincial Iraqi
    Control despite possible US pressure to delay.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 26
  focus: The stated course was not to halt engagement, despite uncertainty about the groups’ motives and concern that well-armed
    Sunni groups could heighten Iraqi Government and Shia opposition. The alternative was to stop the process; the Ambassador
    cited the US reporting timetable and recommended shaping the engagement to reduce risk. Exclude operational methods for
    identifying or engaging armed groups.
  span_range:
  - src:8db1869578a8#p174.4
  - src:8db1869578a8#p175.4
  decision: The British Ambassador to Iraq decides whether to halt engagement with armed Sunni groups or continue it while
    shaping the process to reduce risks.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 27
  focus: The decision weighs leaving the city against retaining a presence that offered a base for strike operations and situational
    awareness. The Chief of the Defence Staff agreed to relocation, with re-entry limited to exceptional circumstances and
    support for the Iraqi Army; exclude the separate question of when Basra should transition to Provincial Iraqi Control.
  span_range:
  - src:8db1869578a8#p192.2
  - src:8db1869578a8#p192.3
  decision: The Chief of the Defence Staff agrees to relocate UK forces from Basra Palace to Basra Air Station at the earliest
    practicable point.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 28
  focus: The decision was whether to authorize discussion, despite concerns about Iraqi and US opposition, the terms of any
    arrangement, and the risks of detainee releases or limiting strike activity. The Foreign Secretary authorized discussion;
    do not treat this as approval of a cease-fire or a final agreement, and exclude operational details of strike activity.
  span_range:
  - src:8db1869578a8#p194.8
  - src:8db1869578a8#p197.4
  decision: The Foreign Secretary authorizes officials to proceed with discussions about a proposed reduction in violence
    by JAM in Basra.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 29
  focus: The Prime Minister faced whether to announce a withdrawal timetable or leave the timing open. He said setting a timetable
    would be wrong at that stage and cited the UK’s obligations to the United Nations and Iraqi Government; exclude the broader
    question of the eventual withdrawal strategy.
  span_range:
  - src:8db1869578a8#p194.5
  - src:8db1869578a8#p194.6
  decision: The Prime Minister decides not to set a timetable for withdrawing UK troops from Iraq at that stage.
  content_domain: other:withdrawal policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 30
  focus: 'The decision was whether to leave as planned or remain to avoid the risks of an uncertain handover. The commander
    judged the Palace Protection Force was on track, but emphasized that no option was risk-free: leaving depended on Iraqi
    forces, while staying exposed UK forces to further deaths. Exclude the separate question of the wider Provincial Iraqi
    Control timetable.'
  span_range:
  - src:8db1869578a8#p220.3
  - src:8db1869578a8#p220.5
  decision: The theatre commander decided to proceed with the planned handover of Basra Palace to Iraqi forces at the end
    of August.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 31
  focus: The decision was whether to release four higher-risk detainees, including two suspected of involvement in British
    deaths, in pursuit of a negotiated reduction in violence. The stated rationale was that this was the only available plan
    to try to change security conditions, with US and Iraqi agreement obtained and further risks acknowledged. Focus on the
    policy choice to authorize releases; exclude the operational details of any strike or detention activity.
  span_range:
  - src:8db1869578a8#p218.5
  - src:8db1869578a8#p220.9
  decision: The defence minister authorized the release of four detainees nominated by JAM1 as part of an effort to secure
    a ceasefire in Basra.
  content_domain: other:detainee-release and ceasefire policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 32
  focus: 'This is the commander’s strategic choice after being briefed on negotiations. The cited context gives his reasons:
    the limits and costs of the existing approach, the urgency of the situation, and his belief that a political solution
    required engagement. Exclude the later ministerial approval of specific negotiation terms.'
  span_range:
  - src:8db1869578a8#p228.7
  - src:8db1869578a8#p229.4
  decision: The incoming UK commander in Basra chose to engage in reconciliation negotiations with credible JAM leaders rather
    than step back from them.
  content_domain: other:conflict-negotiation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 33
  focus: The decision is whether to authorize the next stage of negotiations and its proposed terms. The advice cites the
    aim of preserving negotiating leverage until an enduring agreement was in place, while noting the risk that the negotiations
    would become public; exclude operational details of any strike activity.
  span_range:
  - src:8db1869578a8#p234.2
  - src:8db1869578a8#p234.9
  decision: The MOD Duty Minister approved the Basra commander concluding a further stage of negotiations with JAM, on terms
    involving a further cease-fire period, continued limits on strike operations and conditional detainee releases.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 34
  focus: This is the command decision on whether and when to hand over the Palace, following a delay associated with security
    concerns and late-arriving equipment. The passage records that commanders judged the operational risk acceptable and that
    the gap before Provincial Iraqi Control should be kept short; exclude the operational conduct of the withdrawal.
  span_range:
  - src:8db1869578a8#p236.2
  - src:8db1869578a8#p237.9
  decision: The Basra military commanders chose to proceed with the handover of Basra Palace on 2/3 September after concluding
    that the conditions for handover were set.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 35
  focus: The President chose reductions rather than maintaining the existing troop level, accepting the commander’s recommended
    withdrawal of forces and a later reduction in combat brigades. The stated basis was that progress in security made it
    possible to maintain gains with fewer forces; exclude UK force-planning and operational implementation details.
  span_range:
  - src:8db1869578a8#p260.7
  - src:8db1869578a8#p260.8
  decision: The US President accepted the recommendation to reduce US troop levels in Iraq.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 36
  focus: The Defence Secretary chose to allow possible staged releases rather than defer any further releases until a longer-term
    strategy was agreed. The rationale was to preserve fragile discussions and reduce the risk that violence would resume,
    while the advice singled out one proposed release as appropriate only if absolutely essential; exclude the mechanics of
    negotiation.
  span_range:
  - src:8db1869578a8#p264.6
  - src:8db1869578a8#p264.10
  decision: The UK Defence Secretary approved authority for the local commander to release up to ten internees as a temporary
    measure.
  content_domain: other:detainee policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 37
  focus: This decision point is the planned change in UK force posture and numbers, with military advice and conditions on
    the ground informing the plan. Focus on the choice between continuing the existing deployment and moving to overwatch
    and a reduced presence; exclude the operational tasks and methods used to carry it out.
  span_range:
  - src:8db1869578a8#p278.3
  - src:8db1869578a8#p278.5
  decision: The Prime Minister set out the UK’s planned transition in Basra from a combat role to overwatch, including a reduction
    to around 2,500 troops from spring 2008.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 38
  focus: The decision was whether to approve further releases as a short-term support for the negotiation process, despite
    the risks associated with some people on the proposed list. Focus on the policy trade-off and the review process; exclude
    any operational details of detention or release.
  span_range:
  - src:8db1869578a8#p283.5
  - src:8db1869578a8#p283.8
  decision: The Secretary of State for Defence approved the release of three further detainees to help strengthen JAM1’s authority
    and control in Basra.
  content_domain: other:detainee policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 39
  focus: This decision point concerns whether to engage in dialogue with groups that had influence in Basra, rather than refuse
    contact. The stated rationale included the groups’ influence, the interests of Iraq and Basra, and awareness and support
    from the Iraqi Government and the US; exclude operational details of negotiations.
  span_range:
  - src:8db1869578a8#p281.3
  - src:8db1869578a8#p281.7
  decision: The Secretary of State for Defence approved the UK’s stated policy of engaging JAM and other militia groups as
    part of political reconciliation efforts.
  content_domain: other:reconciliation policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 40
  focus: 'This is a concrete choice about the legal and diplomatic basis for the UK’s future presence: press for language
    preserving the possibility of a further mandate, or accept the US position. The source explains that the UK would face
    greater legal constraints without a mandate, but that pressing the issue could send the wrong signal about future UK commitment
    and impede passage of the resolution. Exclude the separate question of what legal arrangement should replace the mandate
    after 2008.'
  span_range:
  - src:8db1869578a8#p297.5
  - src:8db1869578a8#p297.8
  decision: The UK Government decides to accept the next UN Security Council resolution as the last if the US rejects UK language
    making any 2009 resolution conditions-based.
  content_domain: other:international legal authority
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 41
  focus: The group’s reported agreement was to preserve the reduction in violence, embed the relationship in a wider process,
    and have the FCO develop a political strategy while the MOD continued the tactical deal. The reasons included the fragility
    of the cease-fire, the risk of appearing to back one JAM leader directly, and potential gains from bringing the Sadrists
