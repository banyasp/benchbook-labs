episodes:
- n: 1
  focus: The guidance makes capture the preferred option, citing its intelligence value and its potential to mitigate and
    disrupt threats; lethal action is reserved for when capture is infeasible and no other reasonable alternative effectively
    addresses the threat. Keep the focus on this policy choice and its reasons, not on operational methods for carrying out
    either option.
  span_range:
  - src:dc780da4f0d0#p1.6
  - src:dc780da4f0d0#p1.6
  decision: U.S. decisionmakers choose capture rather than lethal action when considering action against a terrorist suspect
    who threatens U.S. persons.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The policy makes an identified HVT eligible for lethal action only if the individual poses a continuing, imminent
    threat to U.S. persons and the legal, certainty, capture-infeasibility, and alternatives conditions are met. Deputies
    are directed to consider whether a response short of lethal action can minimize the threat and to account for credible
    information casting doubt on eligibility; exclude operational execution details.
  span_range:
  - src:dc780da4f0d0#p11.4
  - src:dc780da4f0d0#p14.11
  decision: The nominating agency’s Principal, or the President in specified cases, decides whether an identified HVT may
    be approved for lethal action under the stated threat and necessity standards.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: The guidance directs consideration of third-country custody when feasible and consistent with U.S. national security;
    if that is not feasible or consistent, it prefers prosecution in civilian court or a military commission and bars bringing
    additional detainees to Guantanamo. Keep the focus on disposition options and the stated security and prosecution considerations,
    not capture or detention techniques.
  span_range:
  - src:dc780da4f0d0#p10.10
  - src:dc780da4f0d0#p10.16
  decision: The Deputies recommend a long-term disposition for a suspect already in U.S. custody, with the appropriate Principal
    or the President receiving the decision as provided by the process.
  content_domain: other:detainee disposition
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
