- n: 2
  focus: The decision point is whether to transfer responsibility for the Service or keep it under FBI management. The assistant
    secretary cited the FBI’s performance and the risks of placing the work in untried hands; exclude operational details
    of the Service’s activities.
  span_range:
  - src:67275ffd4fbf#p13.4
  - src:67275ffd4fbf#p14.1
  decision: The assistant secretary of state opposed transferring the FBI’s Special Intelligence Service to the Coordinator
    of Information and backed retaining it within the FBI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue sharing the political reports and SIS coverage or restrict them after State
    officials compiled a list of mistakes in the FBI reports. The passage attributes the order to retaliation; exclude the
    separate post-war intelligence-role dispute and any operational details of SIS coverage.
  span_range:
