- n: 2
  focus: The decision point is the Agency’s final disposition of the appeal, following the advisory committee’s finding that
    promotion panels improperly applied operational criteria to specialists. Include the committee’s proposed remedy and the
    Deputy Director’s reason for declining GS-16; exclude the subsequent civil lawsuit and settlement.
  span_range:
  - src:c57701784feb#p6.3
  - src:c57701784feb#p7.1
  decision: 'The Deputy Director of Central Intelligence, acting for the Director, decides what remedy to grant on the appeal:
    retroactive GS-15 promotion alone or additional GS-16 promotion.'
  content_domain: other:employment-discrimination-adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is the Agency’s June 1980 choice to accept a settlement that included retroactive GS-16 promotion
    and revised promotion criteria, rather than continue litigating. Include the government lawyer’s advice to settle, the
    risk of putting the personnel system on trial, and the difficulty of presenting a strong defense; exclude the earlier
    decision against settlement, for which the passage gives no clear reason.
  span_range:
