- n: 3
  focus: The commander considered leaving deployments unchanged, reinforcing garrisons, strengthening outpost defenses, or
    withdrawing garrisons, then chose to reinforce defenses. The reasons weigh force protection and delaying an attack against
    preserving patrol and reaction forces and avoiding the political and security costs of withdrawal; exclude the specific
    defensive measures and their implementation.
  span_range:
  - src:456d204339c4#p54.2
  - src:456d204339c4#p56.2
  decision: The 1-24 battalion commander decides how to respond to intelligence of a pending attack on western Mosul outposts.
