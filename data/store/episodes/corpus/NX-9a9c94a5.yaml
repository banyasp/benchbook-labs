- n: 7
  focus: The decision point is the commander’s choice among route-security options, including the reasons for trying a new
    approach while continuing existing measures. Focus on the command-level choice and its stated aims; exclude the operation’s
    execution and vehicle-search procedures.
  span_range:
  - src:456d204339c4#p99.2
  - src:456d204339c4#p100.4
  decision: The battalion commander chose to add a traffic-stop operation to the route-security approach while retaining routine
