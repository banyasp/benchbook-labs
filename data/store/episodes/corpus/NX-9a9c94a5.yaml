  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The patrol commander had agreed on an air target, but a radio report identified the patrol’s red smoke as enemy marking.
    He delayed the bombing while the identity information was sorted out; focus on the decision to withhold force amid uncertainty,
    not on aircraft control or target-attack procedures.
  span_range:
  - src:456d204339c4#p123.2
  - src:456d204339c4#p124.1
  decision: The patrol commander delayed the planned air strike until the conflicting reports about friendly markings were
    resolved.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 9
  focus: The patrol commander weighed close air support against the risk of exposing troops to fire in compounds, with an
    early report that a woman and child had left the battle area and intelligence later assessed as confirming no civilians
    remained. Focus on the decision and its civilian-protection judgment; exclude the mechanics of directing aircraft or engaging
    individual compounds.
  span_range:
  - src:456d204339c4#p125.1
  - src:456d204339c4#p125.2
  decision: The patrol commander authorized Apache fires against compounds as clearing teams advanced into the village.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 10
  focus: The battalion commander replaced the prior consensus that an hour on an objective was acceptable with a 10-minute
    limit, citing the danger of remaining exposed while the enemy gathered assets and attacked. Focus on the command-level
    policy choice and the balance between completing an operation and reducing exposure; exclude implementation details.
  span_range:
  - src:456d204339c4#p108.2
  - src:456d204339c4#p108.2
  decision: The battalion commander imposed a 10-minute limit on actions at an objective after the VBIED attack.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 11
  focus: The passage presents the alternatives and explains that the force could not reliably distinguish insurgents from
    the population without local assistance; leaders expected a safer environment to build trust in the coalition and Iraqi
    institutions and have a longer-lasting effect. Treat this as an operational-command choice about objectives, not a decision
    about specific raids, reconnaissance, or other methods.
  span_range:
  - src:456d204339c4#p148.2
  - src:456d204339c4#p149.2
  decision: The cavalry squadron commander and staff chose to prioritize creating a safer environment and gaining population
    trust over trying to destroy or defeat the insurgency directly.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: At a meeting with tribal leaders, commanders faced calls for an assault like the earlier Fallujah operation and instead
    rejected what they considered an inappropriate amount of firepower. The passage says they favored developing their understanding
    and constricting insurgent safe havens; exclude the operational details of those activities.
  span_range:
  - src:456d204339c4#p146.3
  - src:456d204339c4#p147.1
  decision: The American and Iraqi commanders chose not to undertake the destructive assault tribal leaders requested, favoring
    a more restrained approach.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
