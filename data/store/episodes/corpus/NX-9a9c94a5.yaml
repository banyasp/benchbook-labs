  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The commanders could remain in command-and-control positions while organizing relief, or move forward with forces
    to provide immediate support and casualty evacuation. The source gives their choice and weighs the benefit of prompt support
    against the risk that they could become engaged and lose the ability to coordinate broader actions; exclude details of
    routes, weapons, and combat execution.
  span_range:
  - src:456d204339c4#p59.2
  - src:456d204339c4#p60.3
  decision: The battalion commander and company commander decide to move immediately toward COP Tampa while coordinating reinforcements
    and supporting fires.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: After ordering an evacuation, the battalion commander weighs abandoning the outpost against retaining and reinforcing
    it. The passage gives both the security risk of the location and the potential political and morale cost of appearing
    to concede a victory before the election; exclude the operational details of rebuilding and defending the perimeter.
  span_range:
  - src:456d204339c4#p64.1
  - src:456d204339c4#p65.1
  decision: The battalion commander decides to retain COP Tampa and expand its perimeter rather than permanently abandon it.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
