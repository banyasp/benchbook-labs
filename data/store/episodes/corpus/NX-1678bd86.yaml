- n: 1
  focus: The decision point is whether to declassify and release historically significant, highly sensitive briefing documents
    or continue withholding them, balancing public understanding against national security. Keep the focus on the release
    decision and its stated harm-based standard; exclude the broader history of the collection.
  span_range:
  - src:2ec38b51a56f#p4.2
  - src:2ec38b51a56f#p4.3
  decision: CIA and Intelligence Community reviewers decided to release a large collection of presidential intelligence briefings
    to the public in 2015.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether the president-elect would accept routine briefings from lower-level officers or limit
    his intelligence engagement, with consequences for the National Security Advisor’s role as gatekeeper. Use the stated
    context of Nixon’s prior experience and views of the Intelligence Community; exclude unrelated campaign events.
  span_range:
  - src:2ec38b51a56f#p23.6
  - src:2ec38b51a56f#p23.7
  decision: President-elect Nixon chose not to receive routine intelligence briefings from lower-level CIA officers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether the CIA Director should engage in policy discussion during a candidate briefing or
    confine the Agency’s role to intelligence, amid questions about foreign policy. The source presents avoiding politicization
    and adhering to a limited conception of the Director’s role as reasons; exclude the candidates’ electoral strategy and
    unrelated briefing content.
  span_range:
  - src:2ec38b51a56f#p24.1
  - src:2ec38b51a56f#p24.3
  decision: The CIA Director chose to keep the 1968 candidate briefing focused on intelligence facts and avoid policy discussion.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The adviser chose to restrict who could receive intelligence support at the facility, while allowing campaign staff
    access to classified publications after they arrived in Washington. The stated reason was that those staff did not need
    the material before then; exclude the separate question of how the publications were produced or delivered.
  span_range:
  - src:2ec38b51a56f#p26.5
  - src:2ec38b51a56f#p27.1
  decision: The president-elect’s national security adviser limited CIA intelligence support at the New York facility to the
    president-elect and himself.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: 'The office chose to provide a more contextualized briefing for the incoming team rather than rely only on the version
    tailored to the outgoing administration. The passage gives the reason: the incoming president and advisers lacked detailed
    familiarity with many ongoing issues, and the existing brief’s concise style and topic selection did not meet their needs;
    exclude the later mechanics of drafting and delivery.'
  span_range:
  - src:2ec38b51a56f#p27.2
  - src:2ec38b51a56f#p27.4
  decision: The CIA’s current-intelligence office, with senior-officer concurrence, adopted an expanded PDB for the incoming
    administration alongside the existing version.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The director chose to extend the PDB and intelligence support to the vice president, rather than leave him with the
    publications he already received. The passage cites preparation for a possible presidential transition and the risk of
    a successor lacking important information; exclude the later operational details of sensitive intelligence activities
    mentioned in the briefing account.
  span_range:
  - src:2ec38b51a56f#p31.4
  - src:2ec38b51a56f#p31.8
  decision: The director of central intelligence decided to provide the vice president direct, daily access to the PDB in
    preparation for a possible succession to the presidency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The adviser chose to withhold these estimates from the president-elect rather than permit a department or agency
    to present its views directly. He reasoned that no agency should gain an advantage over others and that an NIE represented
    the Intelligence Community as a whole; exclude the subsequent dispute over the content of a particular military briefing.
  span_range:
  - src:2ec38b51a56f#p28.2
  - src:2ec38b51a56f#p28.2
  decision: The president’s national security adviser directed that National Intelligence Estimates not be sent to the president-elect.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The division could leave the topic at the boilerplate level or provide broader treatment; it chooses expansion because
    the information is fairly extensive and appears to need it. Keep the focus on this editorial and analytic judgment, not
    on the general PDB workflow.
  span_range:
  - src:2ec38b51a56f#p42.5
  - src:2ec38b51a56f#p42.5
  decision: The Western Hemisphere Division agrees to expand its treatment of urban terrorism into an annex for the PDB.
