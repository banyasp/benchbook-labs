  focus: The Court weighs denying relief against awarding compensation under Article 32, and holds that sovereign immunity
    does not bar compensation for the violation of the right to life. It awards each family Rs. 100,000, emphasizing that
    compensation is to remedy the harm; exclude the separate question of criminal punishment, which the Court leaves to criminal
    courts.
