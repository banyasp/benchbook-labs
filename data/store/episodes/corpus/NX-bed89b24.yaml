episodes:
- n: 1
  focus: The decision point is the War Department’s choice to preserve segregated military organizations rather than intermingle
    personnel, in a September 1940 memorandum to the President. The source gives the stated rationales, including custom,
    morale, and national-defense preparation, alongside the racist assumptions used to support the policy. Exclude later personnel
    decisions and treat those rationales as claims made by policymakers, not established facts.
  span_range:
  - src:366029ab433f#p15.4
  - src:366029ab433f#p16.4
  decision: The War Department assistant secretary maintains the policy against placing Black and White personnel in the same
    regimental organizations.
  content_domain: other:federal employment policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is the 1944 choice to assemble Black hires as a separate unit and give them a work assignment,
    amid a reported hiring directive and a direction not to place them on other staffs. The later account identifies commercial-code
    work as the unit’s mission and notes that the work was available without requiring an integrated work unit. Exclude the
    technical details of message exploitation; the scenario concerns employment, segregation, and organizational placement.
  span_range:
  - src:366029ab433f#p24.2
  - src:366029ab433f#p28.3
  decision: The chief of the cryptanalysis effort keeps Black employees in a separate unit and assigns the unit worthwhile
    work.
  content_domain: other:federal employment policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The branch needed clerical support; after an employee objected, the chief moved her desk and hired the Black staff.
    Frame the decision as whether to accommodate the objection or proceed with an integrated workplace; exclude the technical
    work of the unit.
  span_range:
  - src:366029ab433f#p55.3
  - src:366029ab433f#p55.4
  decision: The chief of the Russian-plaintext exploitation branch chose to relocate an employee who objected to working beside
    Black coworkers and then bring Black clerical employees into the unit.
  content_domain: other:federal employment discrimination
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The account links the hiring decision to the volume of Black applicants and the absence of Black examiners. Treat
    this as a staffing and applicant-treatment decision; exclude polygraph techniques and examination methods.
  span_range:
  - src:366029ab433f#p51.5
  - src:366029ab433f#p52.2
  decision: The Security Division branch chief chose to recruit and hire a Black polygraph examiner to examine Black applicants.
  content_domain: other:security-clearance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: As examiner capacity became insufficient, supervisors successively permitted the examiner to interview white men
    and later white women. The account says supervisors wanted to avoid legitimate complaints; exclude polygraph methods and
    focus on the assignment and equal-treatment decision.
  span_range:
  - src:366029ab433f#p52.5
  - src:366029ab433f#p53.4
  decision: Security Division supervisors chose to expand the Black examiner’s applicant interviews in stages beyond Black
    applicants.
  content_domain: other:security-clearance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to proceed with the Fort Knox selection or resume the search, given AFSA’s space and
    standby-site needs and the anticipated effect on its civilian workforce. Do not infer why Fort Meade was ultimately selected;
    the passage does not explain that choice.
  span_range:
  - src:366029ab433f#p65.27
  - src:366029ab433f#p66.2
  decision: AFSA leadership reversed the Fort Knox site choice and continued the search for a headquarters and operations
    site after the prospect of mass civilian resignations became apparent.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
