episodes:
- n: 1
  focus: The decision followed reports of Iraqi preparations and an alarming warning that Kuwait could be cut off within days;
    the document says the intervention proceeded despite intelligence that could not be corroborated. Focus on the policy
    choice and its warning-based rationale, not operational deployment details.
  span_range:
  - src:aaf21fcfd47c#p5.2
  - src:aaf21fcfd47c#p5.8
  decision: UK leadership chose to dispatch British forces to Kuwait in July 1961 rather than refrain from intervention.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The Cabinet Secretary argued that alarmist, uncorroborated reports risked politically embarrassing and unnecessary
    military movements, and that more timely, reliable intelligence was needed; the Prime Minister approved the request. Focus
    on authorization, oversight, and the competing political and intelligence interests, excluding flight methods or other
    collection details.
  span_range:
  - src:aaf21fcfd47c#p8.2
  - src:aaf21fcfd47c#p8.4
  decision: The Prime Minister chose to authorize a reconnaissance flight over Iraq, with periodic reapproval, rather than
    rely solely on existing reporting and peripheral flights.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The UK lowered alert status in light of assessments that the Iraqi armored regiment had poor capability, morale,
    and loyalty; other Iraqi forces were deployed north, and an attack was judged to require reinforcement and training. Focus
    on the readiness decision and the weighing of warning against assessed Iraqi intent and capability; exclude collection
    methods.
  span_range:
  - src:aaf21fcfd47c#p10.12
  - src:aaf21fcfd47c#p10.15
  decision: UK defense leadership chose to lower British forces’ alert status during 1963 rather than maintain a heightened
    alert.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
