  focus: The decision point is whether to continue relying on one-time-tape systems or pursue an electronic alternative, with
    the stated requirements shaping that choice. Focus on the research and acquisition rationale; exclude the cryptographic
    design and operating procedures themselves.
  span_range:
  - src:d02ce52d08d9#p5.2
  - src:d02ce52d08d9#p6.2
  decision: The Record and Data group chief prioritized research into electronic TTY encryption as a replacement for the 5-UCO.
  content_domain: other:COMSEC acquisition policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is the differentiated disposition of cryptographic components and nonsensitive equipment during
    decommissioning. The stated rationale is that sensitive components could reveal information about cryptologic logic; exclude
    any procedural details beyond this general disposition policy.
  span_range:
  - src:d02ce52d08d9#p13.3
  - src:d02ce52d08d9#p13.3
  decision: NSA directed holders of KW-26 equipment to return sensitive components for secure destruction and dispose of the
    remaining equipment as scrap.
  content_domain: other:COMSEC material disposition
  refusal_sensitivity: low
