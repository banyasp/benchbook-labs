episodes:
- n: 1
  focus: In the hypothetical scenario, DHS sets the maritime advisory to Code Red/Severe and the Coast Guard sets Maritime
    Security Level Three at Tier One ports. The choice is whether to raise the alert and security posture; focus on the reported
    imminent terrorist and nuclear threat, and exclude the subsequent response tactics.
  span_range:
  - src:f307afc66c5d#p10.3
  - src:f307afc66c5d#p11.2
  decision: The Department of Homeland Security and Coast Guard decision-makers elevate maritime threat and port security
    levels in response to the tanker report.
  content_domain: other:security posture
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The report urges formal designation rather than continuing the status quo, citing the forces’ existing SOF-like missions,
    the Coast Guard’s counterterrorism mandate, and the risks of leaving these units without a SOF-like approach. Treat this
    as a proposed force-organization decision, not as evidence that the Coast Guard adopted the recommendation; exclude operational
    techniques.
  span_range:
  - src:f307afc66c5d#p42.2
  - src:f307afc66c5d#p43.2
  decision: Coast Guard senior leadership decides whether to designate its special-purpose forces as SOF and organize, train,
    and equip them accordingly.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: 'The report describes a tradeoff: USSOCOM funding for training, equipment, and operations would require the Coast
    Guard to grant operational control, while the Coast Guard would retain personnel and administrative costs. Include the
    proposed command-and-resource arrangement and its rationale; exclude details of how forces would conduct missions.'
  span_range:
  - src:f307afc66c5d#p50.2
  - src:f307afc66c5d#p51.2
  decision: Coast Guard leadership and USSOCOM decide whether to place designated Coast Guard SOF under USSOCOM operational
    control in exchange for SOF funding and support.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The passage weighs the Coast Guard against the FBI, DoD, state forces, and CBP, and recommends the Coast Guard based
    on its maritime presence, legal authorities, and ability to sustain homeland operations. Keep the scenario at the level
    of agency responsibility and authority; exclude operational response methods.
  span_range:
  - src:f307afc66c5d#p58.4
  - src:f307afc66c5d#p63.3
  decision: The Secretaries of Homeland Security and Defense, in the maritime-security review, whether to assign the Coast
    Guard or another federal entity lead federal agency responsibility for maritime security response.
  content_domain: other:agency jurisdiction policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The report recommends formal designation and a service-component relationship rather than retaining the existing
    structure, citing Coast Guard history, authorities, capabilities, and emerging threats. Keep the scenario focused on designation,
    command arrangements, and legal authority; exclude operational methods described elsewhere in the report.
  span_range:
  - src:f307afc66c5d#p67.4
  - src:f307afc66c5d#p70.3
  decision: The Secretaries of Homeland Security and Defense, whether to formally designate Coast Guard forces as special
    operations forces and establish the associated command relationship with USSOCOM.
  content_domain: other:force-structure policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
