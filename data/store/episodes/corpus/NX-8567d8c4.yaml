episodes:
- n: 1
  focus: The decision point is whether to retain the interdepartmental clearing-house arrangement or concentrate investigative
    responsibility in three agencies; the President chose the latter and directed other agencies to refer information. The
    Attorney General cited the committee’s ineffectiveness and the investigative agencies’ accumulated information, expertise,
    and capacity for coordination. Exclude operational investigative methods discussed elsewhere in the document.
  span_range:
  - src:71a3fe71524f#p12.7
  - src:71a3fe71524f#p14.18
  decision: The President directed that espionage, counterespionage, and sabotage investigations be handled by the FBI, Army
    Military Intelligence, and Naval Intelligence, with other investigative agencies referring relevant information to the
    FBI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The agreement assigns coordinating authority to the military commander in the stated martial-law scenario, while
    limiting that authority and requiring information-sharing with agency headquarters. Focus on the policy choice about responsibility,
    coordination, and authority; exclude operational intelligence activities.
  span_range:
  - src:71a3fe71524f#p37.19
  - src:71a3fe71524f#p38.9
  decision: The FBI, ONI, and MID chiefs agree that, if the President declares martial law, the military commander will coordinate
    intelligence activities while the agencies retain their own administration and discipline.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision is whether to retain the material without notice or inform the Soviet Government and offer access; the
    memorandum gives cooperation and preventing the material from reaching the enemy as reasons. Focus on the disclosure decision
    and its rationale, not on how the material was obtained or analyzed.
  span_range:
  - src:71a3fe71524f#p57.5
  - src:71a3fe71524f#p57.6
  decision: The State Department memorandum author decides to notify the Soviet Government through the established liaison
    channel about code-related material and offer it to the Soviets if they want it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The passage describes withholding an allegation about an assistant to a State Department official because the person
    is not yet identified, while inquiry continues. Focus on the disclosure threshold and the balance between informing another
    department and avoiding dissemination without identifying information; exclude investigative methods.
  span_range:
  - src:71a3fe71524f#p58.5
  - src:71a3fe71524f#p58.5
  decision: The FBI Director decides not to provide the State Department with an allegation about an unidentified aide until
    further identifying information is obtained.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The Director says the investigation is continuing but that he thought the President would want preliminary information
    immediately. The decision point is whether to brief the executive now or wait for further investigation; exclude the underlying
    espionage allegations as established facts, since the letter describes them as preliminary.
  span_range:
  - src:71a3fe71524f#p65.6
  - src:71a3fe71524f#p67.3
  decision: The FBI Director decides to send the President’s military aide preliminary information about suspected federal
    employees’ links to Soviet espionage before the investigation is complete.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The Director chose to transmit a detailed memorandum and raise related concerns about possible international financial
    leadership roles, rather than withhold or delay the information. The reasons stated include the pending appointment, the
    seriousness of the allegations, and the potential influence of those roles; the claims remain allegations in the passage,
    not adjudicated findings.
  span_range:
  - src:71a3fe71524f#p68.7
  - src:71a3fe71524f#p69.5
  decision: The FBI Director decides to alert the President’s military aide to allegations against the Treasury official whose
    appointment as a U.S. delegate to the International Monetary Fund was before Congress.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The analysts described the decryptions and codebook recovery as fragmentary and rapidly improving, so they proposed
    filing partial revisions with the report until enough material accumulated for a new report. Keep the decision at the
    level of analytic reporting; exclude the report’s cryptanalytic methods and individual covername identifications.
  span_range:
  - src:71a3fe71524f#p98.2
  - src:71a3fe71524f#p98.4
  decision: ASA I.D. analysts chose to keep the covername report provisional and update it through periodic revisions rather
    than issue complete supplements.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The memorandum distinguishes this allegation from the letter’s other claims, which it says were independently substantiated,
    and explains that investigation did not support it or identify a channel for passing information to Germany or Japan.
    Treat this as an evidentiary analytic judgment; exclude the alleged espionage operations and any methods of covert communication.
  span_range:
  - src:71a3fe71524f#p103.3
  - src:71a3fe71524f#p105.4
  decision: COMRAP investigators assessed the anonymous letter’s allegation that Soviet officials were betraying the Soviet
    Union as unsubstantiated and apparently inaccurate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The Attorney General weighs immediate deportation, which the State Department recommends, against retaining the defendant
    for the pending prosecution, including the possibility of considering deportation after trial. The stated reasons include
    the defendant’s importance to the case, the impact of his absence on the co-defendant’s defense, and concerns about the
    fairness and public perception of deporting him before trial; exclude any operational or investigative details.
  span_range:
  - src:71a3fe71524f#p120.4
  - src:71a3fe71524f#p121.8
  decision: The Attorney General recommends that the President authorize prosecution of the indicted foreign national and
    defer deciding whether to deport him until after trial.
  content_domain: other:criminal-justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The committee argues that delayed or incomplete access to counterespionage information impaired intelligence estimates,
    including an estimate concerning the Soviet atomic program, and recommends bringing the deficiency to a higher-level body.
    The decision point is whether to escalate the interagency information-sharing problem for remedy; exclude methods of espionage
    or intelligence collection.
  span_range:
  - src:71a3fe71524f#p133.8
  - src:71a3fe71524f#p134.4
  decision: The Joint Atomic Energy Intelligence Committee recommends elevating the counterespionage information-sharing deficiency
    to the Intelligence Advisory Committee for remedial action.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The concrete choice is whether to publicize the incident or withhold it while negotiations are in progress; the passage
    gives the latter as the outcome and the negotiations as the reason. Keep the focus on the disclosure decision, not the
    observation or photography.
  span_range:
  - src:71a3fe71524f#p159.5
  - src:71a3fe71524f#p159.6
  decision: FBI officials decide not to publicize the observed Soviet intelligence meeting.
  content_domain: other:public-disclosure-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 12
  focus: 'The decision point is the diplomatic response to an official’s request for photographs not commercially available:
    declare him persona non grata or choose a less severe response. The stated reason is abuse of diplomatic privileges; exclude
    the mechanics of obtaining the photographs.'
  span_range:
  - src:71a3fe71524f#p160.4
  - src:71a3fe71524f#p160.5
  decision: The State Department decides to declare a Soviet diplomatic official persona non grata after his request for noncommercial
    aerial photographs.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 13
  focus: The passage describes a January 1955 diplomatic note imposing restrictions, including limits on access to certain
    aerial photographs, and says the restrictions were comparable to those imposed on U.S. citizens in Russia. The decision
    point is imposing those reciprocal restrictions or leaving access unrestricted; exclude the subsequent circumvention methods
    described in the passage.
  span_range:
  - src:71a3fe71524f#p160.5
  - src:71a3fe71524f#p161.2
  decision: The State Department decides to restrict Soviet citizens’ acquisition of certain types of information in the United
    States.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 14
  focus: The decision followed the representative’s clandestine meetings in New York with someone he believed was a retiring
    American military officer, which the document characterizes as an abuse of his status. The implied alternative was to
    let him remain; exclude operational details of the meetings.
  span_range:
  - src:71a3fe71524f#p164.3
  - src:71a3fe71524f#p164.3
  decision: U.S. foreign-affairs authorities decided to declare a Soviet military representative to the United Nations persona
    non grata.
  content_domain: other:diplomatic countermeasure
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 15
  focus: The passage says the official was declared persona non grata for attempting to subvert a State Department employee
    to obtain information from department files. The implied alternative was to permit him to remain; exclude the attempted
    intelligence activity’s operational details.
  span_range:
  - src:71a3fe71524f#p164.4
  - src:71a3fe71524f#p164.4
  decision: U.S. foreign-affairs authorities decided to declare a Soviet Embassy second secretary persona non grata.
  content_domain: other:diplomatic countermeasure
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 16
  focus: The passage states that the attaché was declared persona non grata after using a false identity to solicit material
    from American military installations. The implied alternative was to allow him to remain; exclude the mechanics of soliciting
    or routing the material.
  span_range:
