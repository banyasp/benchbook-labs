- n: 1
  focus: The handbook recommends external visibility to enable other headquarters to learn, limiting access to internal users
    when the issue is specific to the originating HQ or too sensitive to share broadly. Focus on that sharing decision and
    its balance between wider learning and sensitivity; exclude the separate assignment of classification and releasability.
  span_range:
  - src:7ef9e5034058#p29.3
  - src:7ef9e5034058#p30.1
  decision: The originator decides whether an NLLP lesson is visible only internally or externally.
  content_domain: other:information-sharing policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 2
  focus: When a good practice is identified, the handbook advises caution before broad dissemination until its valid conditions
    and circumstances have been analyzed. It gives the reason that premature sharing may lead recipients to assume the practice
    is already a best practice and skip further institutionalization; exclude operational methods for implementing the practice.
  span_range:
  - src:7ef9e5034058#p43.2
  - src:7ef9e5034058#p43.2
  decision: Lessons-learned staff decide whether to disseminate a newly identified good practice immediately or wait for analysis.
  content_domain: other:information-sharing policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 3
  focus: In an abbreviated lessons-learned process, the Tasking Authority may choose among potential remedial actions, selecting
    the one likely to produce the best outcome within the required timescale even if it is not optimal. Focus on the decision
    standard and urgency; exclude the operational details of implementing any action.
  span_range:
  - src:7ef9e5034058#p50.1
  - src:7ef9e5034058#p52.2
  decision: The Tasking Authority chooses which proposed remedial action to implement for an urgent issue.
  content_domain: other:lessons-learned governance
