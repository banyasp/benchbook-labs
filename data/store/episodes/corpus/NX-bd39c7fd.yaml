  focus: The 9/11 Commission’s proposed restructuring faced opposition within the Intelligence Community; the Secretary of
    Defense saw the original version as threatening agencies under his command and negotiated modifications that produced
    a less powerful DNI office. Focus on this institutional authority and reform choice, not on operational intelligence activity.
  span_range:
