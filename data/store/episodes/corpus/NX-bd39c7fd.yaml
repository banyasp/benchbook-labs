- n: 2
  focus: The Principal Deputy DNI’s proposal competed with the position of NSA and NGA, which wanted their officers eligible
    for those posts; the issue was put on hold. Focus on the governance question of which agency’s officers could represent
    the DNI, not on station-level intelligence work.
  span_range:
  - src:3c286bfd1d7c#p2.7
  - src:3c286bfd1d7c#p2.7
  decision: The Principal Deputy DNI chose to put on hold a proposal making CIA station chiefs the DNI’s representatives to
    local intelligence services.
