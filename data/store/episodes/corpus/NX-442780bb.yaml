  - src:c4279819a928#p6.6
  decision: The CIA Career Service Board declined immediate corrective policies after the 1953 Petticoat Panel report and
    chose gradual improvement, primarily through educating supervisors.
  content_domain: other:employment-discrimination-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to investigate the concerns raised by agency employees or leave them unexamined; the
    Director chose to initiate a review, citing the questions raised and the need to address discrimination. Exclude the panel’s
    broader recommendations as separate decisions.
  span_range:
  - src:c4279819a928#p17.11
  - src:c4279819a928#p18.10
  decision: The CIA Director directs an Inspector General review of alleged gender disparities and establishes a women’s panel
    to examine women’s professional status.
  content_domain: other:federal employment equality policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is how to meet the federal sex-discrimination review mandate while addressing CIA’s concern that
    external review could expose classified material. The parties chose periodic progress reports and examples of changes,
    with the task force reserving further involvement if problems emerged; exclude the underlying personnel-policy questions
    as separate decisions.
  span_range:
  - src:c4279819a928#p19.7
  - src:c4279819a928#p19.11
  decision: The CIA representative and the Justice Department task force agree to defer external review of classified agency
    policies while CIA demonstrates a good-faith compliance effort.
  content_domain: other:federal employment law compliance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to investigate possible advancement barriers; the Director approved a recommendation
    from Senior Intelligence Service women, and the study examined agency data and employee experiences. The stated aim was
    to identify barriers, so do not treat the study’s findings or later reforms as part of this decision.
  span_range:
  - src:c4279819a928#p20.14
  - src:c4279819a928#p20.19
  decision: The CIA Director approves a study to determine whether career-advancement barriers affect agency professionals,
    particularly women and minorities.
  content_domain: other:federal employment equality policy
