- n: 1
  focus: The decision weighs pressure to meet the admiral’s timetable and demonstrate capability against the commander’s responsibility
    for crew safety and compliance with procedures. Keep the focus on the command and safety judgment, not on operational
    flight details.
  span_range:
  - src:fb36fa9672ab#p5.2
  - src:fb36fa9672ab#p12.2
  decision: The squadron commander decides whether to launch the scheduled exercise despite a missing operations briefing
    and an uncompleted preflight briefing, or delay until safety procedures are met; he launches on schedule.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The decision weighs improving the command climate and informing the commanding officer against possible damage to
    the officer’s relationships and career. The case also identifies his administrative responsibility to keep the commanding
    officer informed; exclude broader generalizations about personnel policy.
  span_range:
  - src:fb36fa9672ab#p13.2
  - src:fb36fa9672ab#p17.3
  decision: The administrative officer decides whether to raise concerns about harassment and unequal treatment with the commanding
    officer or address the male officers directly or remain silent; he approaches the commanding officer.
  content_domain: other:military personnel ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 3
  focus: The decision weighs loyalty to friends and the consequences of reporting against the ensign’s obligation to uphold
    the law and service standards. The senior officer reports the incident up the chain, leading to an investigation; distinguish
    that subsequent action from the ensign’s decision to consult.
  span_range:
  - src:fb36fa9672ab#p23.3
  - src:fb36fa9672ab#p27.2
  decision: An ensign decides whether to overlook fellow officers’ illegal drug use or seek help from a senior officer; he
    declines to join them and consults a senior officer the next day.
  content_domain: other:military personnel ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 4
  focus: The decision is whether to comply with the superior’s order or stand by the recommendation opposing delivery, weighing
    the perceived risk to U.S. forces against the possibility that superiors have more information and the major’s career
    risk. Keep the focus on the policy recommendation and the authority to direct it; exclude details about weapons or their
    use.
  span_range:
  - src:fb36fa9672ab#p92.2
  - src:fb36fa9672ab#p98.3
  decision: The major decides whether to change his recommendation supporting delivery of a classified munitions package to
    Iraq.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 5
  focus: The lieutenant must choose whether to provide testimony about command climate after being asked by the executive
    officer, with the commanding officer’s demand for loyalty and implied threat creating career pressure. The source says
    she testified because she believed supporting the allegations was the honorable course and silence would endorse the commanding
    officer’s behavior; exclude speculation about testimony beyond the described decision.
  span_range:
  - src:fb36fa9672ab#p63.2
  - src:fb36fa9672ab#p70.2
  decision: The junior lieutenant decides whether to testify in the Article 38 grievance process concerning the commanding
    officer.
  content_domain: other:military accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 6
  focus: After a prior race-discrimination complaint and a discussion of merit, possible bias, and fairness, the commanding
    officer must choose a selection approach. He ultimately chose to screen for the best-qualified applicants, reasoning that
    this would support the organization’s mission; exclude general arguments about selection not tied to this decision.
  span_range:
  - src:fb36fa9672ab#p71.2
  - src:fb36fa9672ab#p77.2
  decision: The commanding officer decides whether to give special consideration to minority applicants or select the best-qualified
    applicants for programs.
  content_domain: other:personnel selection policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 7
  focus: The guide frames reporting versus not reporting as the choice and says the officer is ethically and legally bound
    to report. It identifies safety risks, sworn duty, possible effects on the senior’s conduct, and career or peer pressure
    as relevant considerations; exclude details of the flying maneuver itself.
  span_range:
