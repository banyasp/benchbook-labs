collection: studies-in-intelligence
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The decision point is the early ODNI leadership’s choice of an implementation strategy amid ambiguous authorities
    and agency resistance. Keep the focus on authority, collaboration, and agency buy-in; exclude operational intelligence
    activities and general lessons that are not part of this choice.
  span_range:
  - src:8781e1646c92#p19.4
  - src:8781e1646c92#p22.3
  decision: ODNI leadership chose to implement IRTPA within its existing mandate by empowering intelligence agencies to lead
    reform, rather than first seeking stronger statutory authority or imposing unified command.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the President’s choice to expect the DNI’s regular presence at the briefing after the DNI questioned
    whether it was necessary. Focus on presidential direction and informal authority, not the briefing’s intelligence content
    or methods.
  span_range:
  - src:8781e1646c92#p21.3
  - src:8781e1646c92#p21.4
  decision: The President required the DNI to attend the President’s in-person daily intelligence briefing, using the access
    and relationship to strengthen the DNI’s informal authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to leave the existing intelligence-community executive order unchanged or direct its
    revision. The passage says the order had not been updated since the Cold War and that resistance faded after the President’s
    direction; exclude any operational details of intelligence activity.
  span_range:
  - src:8781e1646c92#p21.7
  - src:8781e1646c92#p21.12
  decision: The President chose to direct a prompt update of Executive Order 12333 after the Intelligence Advisory Board raised
    its importance despite bureaucratic resistance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the last-minute choice between accepting language that would clarify the DNI’s relationship
    to the Defense Secretary and failing to secure agreement on the bill. Focus on the balance between preserving the military
    chain of command, maintaining meaningful DNI authority, and getting the legislation passed; exclude operational military
    or intelligence activity.
  span_range:
  - src:8781e1646c92#p26.4
  - src:8781e1646c92#p28.1
  decision: The Senate conference negotiators decide whether to accept a four-word clarification preserving the Defense Secretary’s
    authority while retaining the DNI’s powers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to wait for a detailed plan and further direction or begin reforms, learn from early
    implementation, and adjust quickly. Focus on the official’s discretion in implementing an analytic-reform mandate and
    the competing concerns about urgency, oversight, and avoiding delay; exclude specific intelligence collection or operational
    methods.
  span_range:
  - src:8781e1646c92#p38.4
  - src:8781e1646c92#p38.5
  decision: The Deputy Director of National Intelligence for Analysis decides to begin implementation without first submitting
    a comprehensive plan, using an incremental approach instead.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to staff the new analytic-integrity function from within the Intelligence Community
    or seek outside leadership. Focus on the mandate to improve analytic products, the availability of internal expertise,
    and the stated value of signaling change and outside involvement; exclude operational or collection techniques.
  span_range:
  - src:8781e1646c92#p39.11
  - src:8781e1646c92#p40.3
  decision: The Deputy Director of National Intelligence for Analysis decides to recruit an outside expert to lead the analytic
    standards directorate rather than rely solely on internal personnel.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: 'The decision point is how to present the annual evaluation required by IRTPA: a community-wide report or agency-by-agency
    comparisons. Include the choice to keep agency-specific strengths and weaknesses as diagnostic information reported to
    the agency; exclude the broader merits of analytic standards.'
  span_range:
  - src:8781e1646c92#p43.3
  - src:8781e1646c92#p43.3
  decision: The DDNI for Analysis-led team chose to aggregate analytic performance information into one report to Congress
    rather than compare agencies individually.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: 'The decision point is the ODNI’s organizational design: separate directorates or a single unit combining collection
    and analysis. The passage says leaders believed analytic requirements could drive collection through other means and that
    separate units would better improve both functions; exclude operational collection methods.'
  span_range:
  - src:8781e1646c92#p49.6
  - src:8781e1646c92#p49.6
  decision: The DNI and PDDNI chose separate directorates for intelligence collection and analysis rather than placing both
    functions in one organizational unit.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to continue or cancel an acquisition that was not going well and was significantly
    over budget. The DNI relied on program reviews and discussions with Defense Department officials, concluding existing
    systems could cover the needs; exclude any technical details of the system or its capabilities beyond that rationale.
  span_range:
  - src:8781e1646c92#p51.5
  - src:8781e1646c92#p51.5
  decision: The DNI chose to cancel a troubled intelligence-system acquisition rather than continue it, after concluding existing
    systems could meet intelligence needs.
  content_domain: other:intelligence resource management
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 10
  focus: The drafters could pursue a separate appropriation, which might enable transfers and withholding but would require
    declassifying the budget top line, or direct OMB to apportion funds at the DNI’s exclusive direction. Focus on the statutory
    budget-authority choice and its secrecy and management tradeoffs; exclude later implementation details.
  span_range:
  - src:8781e1646c92#p58.6
  - src:8781e1646c92#p59.4
  decision: IRTPA drafters chose how to give the DNI greater control over intelligence funds without creating a separate intelligence
    appropriation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision arose because the existing legal interpretation barred NIP support for domestic-terrorism analysis without
    a foreign nexus, while I&A’s budget was entirely NIP-funded. Focus on the funding and mission-authority choice and its
    implications; exclude any collection methods or operational details.
  span_range:
  - src:8781e1646c92#p61.3
  - src:8781e1646c92#p61.5
  decision: The DHS under secretary for intelligence and analysis chose to create non-NIP funding for departmental work, including
    domestic violent extremism analysis.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The arrangement addressed a dispute over who could approve DOD personnel’s joint-duty credit waivers. Focus on the
    authority-sharing compromise and its stated benefits for resolving the impasse and improving coordination; exclude unrelated
    organizational history.
  span_range:
  - src:8781e1646c92#p68.5
  - src:8781e1646c92#p69.3
  decision: The defense under secretary for intelligence and the DNI’s senior leadership agreed to let the under secretary
    wear a second hat as Director of Defense Intelligence, including authority to grant joint-duty waivers for DOD personnel.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 13
  focus: The decision point is whether to create a department with authority over Defense Department intelligence elements
    or establish the ODNI with overlapping responsibilities shared with department heads. Focus on the president’s choice
    and the political and institutional constraints described; exclude later implementation issues.
  span_range:
  - src:8781e1646c92#p90.3
  - src:8781e1646c92#p90.5
  decision: The president chose to establish the ODNI as a matrix structure rather than pursue a Department of Intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is whether to retain presidential approval for these operations or delegate authority to the secretary
    of defense. The passage links delegation to persistent engagement and the need for cyber forces to remain in contact with
    competitors; exclude operational methods and details of any particular operation.
  span_range:
  - src:8781e1646c92#p75.6
  - src:8781e1646c92#p75.7
  decision: The president delegated key authorities to the secretary of defense for time-sensitive military operations in
    cyberspace.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is the boundary Congress set for the NCTC’s counterterrorism remit, including the distinction
    between leading and assisting domestic-terrorism efforts. Consider the stated civil-liberties concerns and institutional
    jurisdiction interests; exclude operational counterterrorism methods.
  span_range:
  - src:8781e1646c92#p79.5
  - src:8781e1646c92#p79.7
  decision: Congress limited the NCTC’s remit to foreign terrorism rather than giving it an independent domestic-terrorism
    lead role.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 16
  focus: The decision was how to resolve the conflict between creating a joint-duty path to senior promotion and protecting
    agency heads’ authority over senior promotions. The leaders settled on a voluntary, coordinated framework, later set out
    in ICD 610, rather than resolving the matter through White House direction; exclude later proposals for a more centralized
    program.
  span_range:
  - src:8781e1646c92#p95.11
  - src:8781e1646c92#p96.17
  decision: ODNI and IC agency leaders decide how to implement civilian joint duty while preserving department heads’ statutory
    personnel authorities.
  content_domain: other:personnel-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The leaders adopted a compromise that placed waiver authority with the Director of Defense Intelligence, subject
    to coordination with the DNI, as a way to advance the program without abrogating department authorities. Keep the focus
    on the authority arrangement and its rationale; the passage notes the authority was apparently never used.
  span_range:
  - src:8781e1646c92#p98.3
  - src:8781e1646c92#p98.11
  decision: The DNI and Secretary of Defense decide to give the Director of Defense Intelligence authority, coordinated with
    the DNI, to waive the joint-duty requirement for a particular senior promotion.
  content_domain: other:personnel-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The decision point is Congress choosing statutory safeguards after the failures surrounding 9/11 and Iraq WMD judgments.
    Include the requirements on alternative analysis, standards, and analytic-integrity oversight; exclude general descriptions
    of later training or advice to future intelligence leaders.
  span_range:
  - src:8781e1646c92#p112.7
  - src:8781e1646c92#p113.10
  decision: Congress enacted IRTPA provisions requiring intelligence analysis to consider alternatives and meet analytic-integrity
    standards.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: 'The decision point is CIA’s institutional position during the debate over creating the DNI. The source gives its
    reasons: the DCI was seen as having sufficient authority, post-9/11 coordination problems were viewed as already addressed,
    and CIA did not want to give up influence; exclude later assessments of how the new system performed.'
  span_range:
  - src:8781e1646c92#p116.6
  - src:8781e1646c92#p117.3
  decision: CIA leadership opposed creating the DNI rather than transferring intelligence-community leadership to a new office.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is whether to bring DEA’s intelligence office into the IC through joint designation after years
    of negotiations and congressional approval. The passage describes DEA’s prior preference to remain a focused law-enforcement
    agency and the aim of improving IC connections and analysis of the drug–terror nexus; exclude operational collection methods.
  span_range:
  - src:8781e1646c92#p112.4
  - src:8781e1646c92#p112.7
  decision: The DNI and Attorney General jointly designated DEA’s Office of National Security Intelligence as an Intelligence
    Community member.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
