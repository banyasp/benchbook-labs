episodes:
- n: 1
  focus: The decision point is the sponsors’ choice of a collaborative, largely closed-door legislative strategy after being
    assigned to develop reform legislation. Exclude the later substance of the bill; the stated rationale is that this approach
    was critical to winning committee, floor, and conference support.
  span_range:
  - src:d38c0857db7a#p2.5
  - src:d38c0857db7a#p2.5
  decision: The Senate committee chair and ranking member decide to negotiate the intelligence reform bill on a bipartisan
    basis, resolve differences privately where possible, and present a united front.
  content_domain: other:legislative process
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to retain those agencies in the bill or remove them as a compromise amid opposition
    over military readiness. Keep the focus on the legislative tradeoff and stated reason; exclude operational military or
    intelligence procedures.
  span_range:
  - src:d38c0857db7a#p5.4
  - src:d38c0857db7a#p5.5
  decision: The House intelligence committee ranking member and other conferees decide to remove individual service intelligence
    agencies from the bill to address concerns that reform could impair military readiness.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to accept a narrow clarification of the DNI–Defense Secretary relationship or risk
    losing support for the bill; the Senate conferees accepted the proposed language after the Senate conferee concurred.
    The stated balance was to affirm the military chain of command without detracting from the DNI’s authority; exclude operational
    command procedures.
  span_range:
  - src:d38c0857db7a#p4.5
  - src:d38c0857db7a#p6.1
  decision: The Senate conference chair and a Senate conferee decide to accept language stating that the bill shall respect
    and not abrogate the Defense Secretary’s authority, while preserving the DNI’s powers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
