  focus: The district attorney believed the newspaper allegations indicated that Shaw was a covert operative and expected
    the pressure of indictment to make him reveal more; senior aides urged him to abandon the case. Treat this as a prosecutorial
    judgment and exclude the later media tactics and the operational details of the alleged intelligence relationship.
  span_range:
  - src:0d37ab9c35fe#p7.2
  - src:0d37ab9c35fe#p7.3
  decision: The New Orleans district attorney chose to persist with the prosecution of Shaw rather than drop the case.
  content_domain: other:prosecutorial-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The choice was between controlled disclosure or assistance that might help Shaw rebut the allegations, and nonintervention.
    The account explains the perceived risks of disclosure and the possibility that a court would require the CIA to reveal
    material; exclude operational details of intelligence sources and methods.
  span_range:
  - src:0d37ab9c35fe#p11.4
  - src:0d37ab9c35fe#p12.1
  decision: The CIA general counsel recommended that the director take no action to assist Shaw’s defense, apart from actively
    resisting Garrison’s subpoenas.
