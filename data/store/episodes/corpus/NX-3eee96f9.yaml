episodes:
- n: 1
  focus: The decision point is whether to apply the IMC Rules or another maneuvering category for the training flight. Keep
    the focus on the lead’s choice of governing training rules and the stated weather rationale; exclude subsequent maneuvering
    and the pilot’s actions.
  span_range:
  - src:f4a116b550c2#p12.2
  - src:f4a116b550c2#p12.2
  decision: The mishap formation lead decided to declare the training flight under IMC Rules when clouds were present throughout
    the airspace.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: Frame the choice as continuing the training engagement or breaking it off after the reported miss. The report links
    the continued engagement to the miss call, but does not establish a broader rationale; exclude descriptions of the pilot’s
    maneuvers or weapon-employment technique.
  span_range:
  - src:f4a116b550c2#p14.2
  - src:f4a116b550c2#p15.1
  decision: The mishap pilot decided to continue the simulated engagement after the range training officer reported a simulated
    missile miss.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The choice is whether to stop tactical execution or continue the scenario while the mishap pilot is unresponsive.
    The report gives the contact attempts, lack of response, and the safety-related meaning of a knock-it-off call; exclude
    the later search-and-rescue response.
  span_range:
  - src:f4a116b550c2#p21.5
  - src:f4a116b550c2#p21.5
  decision: The instructor pilot decided to end the training scenario with a knock-it-off call after the mishap pilot did
    not respond to contact attempts.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the squadron’s choice of split operations to mitigate COVID-19 exposure, rather than operating
    as one group. Consider the stated readiness tradeoff only as context; exclude the mishap-causation findings, which do
    not attribute the mishap to operations tempo.
  span_range:
  - src:f4a116b550c2#p27.6
  - src:f4a116b550c2#p27.6
  decision: The 493 FS chose to divide squadron operations into two teams that alternated weekly between flying and simulator
    operations.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
