- n: 1
  focus: The decision point is whether to accept the arms offer or avoid a deal that could damage relations with the United
    States and raise security concerns. The account says Egypt’s reliance on cotton exports and the barter terms made the
    offer attractive, and that the president viewed accepting it as consistent with neutrality; exclude details of the weapons
    themselves.
  span_range:
  - src:be410aca02bd#p4.5
  - src:be410aca02bd#p5.1
  decision: Egypt’s president chooses to accept the Soviet-bloc arms offer in exchange for Egyptian cotton.
  content_domain: other:arms-procurement-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is the intelligence judgment about whether Israel will attack while Egypt is confronting Britain
    and France. The analysts weigh Israel’s likely preference to benefit from the Western dispute against the possibility
    that Western military action or worsening relations could make an Israeli attack more likely; exclude operational details
    of any attack.
  span_range:
  - src:be410aca02bd#p7.3
  - src:be410aca02bd#p8.4
  decision: CIA regional estimators judge that Israel is unlikely to initiate war with Egypt during the early phase of the
    canal crisis.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to use force against Egypt or pursue other responses to the canal nationalization;
    the leaders chose coordinated military action and sought to create circumstances for British and French intervention.
    The account notes concern that Israel would appear to be the aggressor and describes the claimed justification, but exclude
    the attack’s routes, sequencing, and other operational mechanics.
  span_range:
  - src:be410aca02bd#p11.1
  - src:be410aca02bd#p11.4
  decision: British, French, and Israeli leaders agree to initiate coordinated military action against Egypt during the canal
    crisis.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to use financial pressure or refrain from it as a means of compelling British withdrawal.
    The passage says the acting secretary of state helped persuade the president to issue the instruction and identifies the
    intended effect; it does not provide a fuller account of the options or legal authority, so do not infer either.
  span_range:
  - src:be410aca02bd#p14.3
  - src:be410aca02bd#p15.1
  decision: The US president directs the Federal Reserve to sell sterling as pressure on Britain to withdraw from Suez.
  content_domain: other:foreign-policy-economic-pressure
  refusal_sensitivity: low
  held_out: false
  natsec: false
