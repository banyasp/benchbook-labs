episodes:
- n: 1
  focus: The field favored Guatemalan participation, but headquarters rejected the request because the political repercussions
    were judged too great to justify it. Treat this as a policy decision about whether to involve Guatemala’s personnel; exclude
    any operational method of incorporating them into the teams.
  span_range:
  - src:c32ab7928c09#p25.11
  - src:c32ab7928c09#p26.11
  decision: CIA headquarters declined the request to include Guatemalan personnel in the anti-Castro effort.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The Agency had to decide whether to pay expenses claimed under an oral arrangement despite the absence of a written
    contract, weighing the claimed costs and its stated moral and legal obligation against project and liaison risks if payment
    was delayed. Focus on the authorization and accountability issues; exclude operational details of the training project.
  span_range:
  - src:c32ab7928c09#p35.6
  - src:c32ab7928c09#p37.15
  decision: CIA headquarters authorized reimbursement to Guatemalan property owners and authorized a higher negotiating ceiling
    for related road work.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The Agency chose to provide the requested assistance, with the stated purposes of training crews, supporting the
    cover for the exile program, and contributing to Guatemala’s defense against possible incursions. Frame this as a decision
    about military assistance; exclude weapons-use instructions and operational details.
  span_range:
  - src:c32ab7928c09#p28.3
  - src:c32ab7928c09#p28.11
  decision: The CIA accommodated the Guatemalan president’s request for ammunition for Guatemalan air-defense training and
    defense.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The request came during an urgent uprising, and the Deputy Director of Plans approved it on his own responsibility
    after he could not obtain a timely decision from the State Department. Treat this as a decision about authority to commit
    personnel in support of force, not about the landing or air operation’s execution; the later cable limited pilot use to
    volunteers.
  span_range:
  - src:c32ab7928c09#p47.10
  - src:c32ab7928c09#p50.1
  decision: The Deputy Director of Plans decides whether to approve the field request to commit Cuban trainees and volunteer
    pilots in support of the Guatemalan government.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 5
  focus: The message authorizes continued troop transport, makes materiel conditional on a specific government request and
    Ambassador concurrence, and permits B-26 provision only if need is critical, it offers substantial advantage, and Guatemala
    supplies pilots. It also directs decision-makers to consider whether the rebels might not be left-wing or anti-U.S.; exclude
    the separate operational details of the air and transport missions.
  span_range:
  - src:c32ab7928c09#p60.16
  - src:c32ab7928c09#p61.3
  decision: Headquarters, through a joint State–Agency message, sets conditions for continued U.S. transport, materiel, and
    aircraft support to the Guatemalan government.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The passage describes disagreement over whether presidential authorization was sufficient and the Army’s concern
    that personnel needed host-country protections against legal consequences. The eventual approach was to proceed on the
    basis of a Guatemalan assurance that Status of Forces protections would apply, although the account is partly based on
    recollection and the proposed agreement’s signing is disputed; exclude the covert travel and negotiation mechanics.
  span_range:
  - src:c32ab7928c09#p77.15
  - src:c32ab7928c09#p79.2
  decision: U.S. executive and Army decision-makers decide whether to make Army Special Forces trainers available to the Agency
    without a conventional signed Status of Forces Agreement.
  content_domain: other:military personnel authorization
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is how to document and authorize U.S. military training after Defense objected that the existing
    secret agreement would not provide suitable cover and State was reluctant to sign a document. Focus on the choice of diplomatic
    form, responsibility, and cover; exclude operational details of the training program.
  span_range:
  - src:c32ab7928c09#p81.15
  - src:c32ab7928c09#p83.2
  decision: Department of Defense and Department of State officials chose to use a memorandum signed by the Guatemalan ambassador,
    rather than a U.S.-signed agreement, to document the military-training arrangement.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to answer the Guatemalan president in writing or rely on the prior verbal exchange.
    The stated considerations are the letter’s sensitive subject matter and the Department’s view that the President’s March
    7 comments made a written reply unnecessary; exclude the merits of the proposed Cuba policy.
  span_range:
  - src:c32ab7928c09#p96.1
  - src:c32ab7928c09#p99.4
  decision: The Department of State chose to advise the White House that the Guatemalan president should receive no written
    reply to his letter urging early action against Cuba.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is whether to continue the support or end it after the existing commitment. The account gives
    the stated rationale—security amid press scrutiny and deterrence of revolutionary activity against the Guatemalan government;
    exclude the operational conduct of training.
  span_range:
  - src:c32ab7928c09#p103.12
  - src:c32ab7928c09#p104.8
  decision: CIA Headquarters approved continuing support for training a Guatemalan Special Battalion beyond the existing May
    commitment, through June.
  content_domain: other:foreign-assistance-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 10
  focus: The decision point is whether to proceed with commitments and base preparation or wait for explicit policy authorization,
    given the approaching deadline and the stated operational need. Keep this separate from the unresolved question of authorizing
    airstrikes from the base; the passage does not establish that such strikes were formally approved.
  span_range:
  - src:c32ab7928c09#p131.10
  - src:c32ab7928c09#p135.12
  decision: CIA leadership proceeded with preparing the Puerto Cabezas facility while formal policy approval for its use remained
    unresolved.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to permit official U.S. military personnel at the Nicaragua base or apply the existing
    Guatemala policy there as well. Focus on the authority and policy governing personnel deployments; exclude any account
    of unofficial personnel presence or operational duties.
  span_range:
  - src:c32ab7928c09#p148.13
  - src:c32ab7928c09#p149.7
  decision: Department of Defense leadership applied the Guatemala personnel policy to Nicaragua and did not officially permit
    Army Special Forces or Air Force assignees to move to Puerto Cabezas.
  content_domain: other:foreign-military-personnel-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: The decision point is whether to remove the detainees immediately or allow their continued custody temporarily. The
    passage links the delay to concern that their presence would expose the facility’s cover when commercial air traffic resumed;
    assess the detention and host-government decision, not the security methods or the later transport arrangements.
  span_range:
  - src:c32ab7928c09#p152.9
  - src:c32ab7928c09#p153.9
  decision: The Nicaraguan president ordered detainees removed from the Puerto Cabezas facility, then approved delaying their
    removal until the stated later date.
  content_domain: other:detention-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The decision point is the ambassador’s choice to oppose the proposed instructors and favor existing alternatives,
    balancing the risk of adverse local reaction and press against the progress of negotiations. Exclude operational details
    about training or the instructors’ activities; the passage does not establish the Agency’s final decision.
  span_range:
  - src:c32ab7928c09#p156.8
  - src:c32ab7928c09#p157.7
  decision: The U.S. ambassador in Nicaragua decided whether to object to the Agency’s proposal to use Cuban exiles as instructors
    for the Nicaraguan Air Force; he asked that his preference against using Cubans be conveyed to the Agency.
  content_domain: other:foreign-policy personnel support
  refusal_sensitivity: medium
  held_out: false
  natsec: false
