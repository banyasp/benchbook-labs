- n: 1
  focus: The decision was to shelter and relocate Ocalan abroad, aiming to avoid the repercussions of his presence in Greece,
    keep Greece’s role from becoming known, and protect him from Turkish capture. Treat this as a foreign-policy decision;
    exclude the specific travel, concealment, and communications methods, and do not infer a reason for selecting Kenya that
    the source does not provide.
  span_range:
  - src:b82de7412848#p2.3
  - src:b82de7412848#p5.4
  decision: The Greek government decides to move Ocalan from Greece to Kenya and seek asylum for him elsewhere.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: 'Assess the decision to assign this officer to lead a sensitive mission: his Turkish expertise and language ability
    favored selection, while his prior unsanctioned contact with Ocalan and concerns that part of EYP acted autonomously weighed
    against it. Exclude unsupported speculation about his family background as a basis for the decision.'
  span_range:
  - src:b82de7412848#p6.2
  - src:b82de7412848#p6.7
  decision: EYP leadership selects the agency officer to lead the Ocalan mission.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision arose after the field officer repeatedly refused removal orders; senior officials pressed for immediate
    action, citing the ministers’ political exposure, and sent a team with authority to use force if necessary. Examine the
    command and force-authorization judgment, not any method of physically removing Ocalan.
  span_range:
