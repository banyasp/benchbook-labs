episodes:
- n: 1
  focus: Congress faced the choice between stronger centralized intelligence coordination and preserving departmental autonomy,
    against the competing interests of national unity and distrust of concentrated military power. It established an independent
    central agency with analysis and intelligence duties, but without law-enforcement or policymaking powers and without control
    over departmental intelligence; exclude later changes to this framework.
  span_range:
  - src:9bbd203f49b6#p11.5
  - src:9bbd203f49b6#p14.4
  decision: Congress decides how to structure the CIA’s authority and its relationship to departmental intelligence agencies
    in the National Security Act of 1947.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Authority chose to centralize certain foreign-intelligence responsibilities in the Group while stopping short
    of controlling departmental analysis or compelling consolidation of clandestine activities. The passage explains that
    the limits were meant to allay departmental fears and preserve their capabilities; exclude operational methods for carrying
    out intelligence activities.
  span_range:
  - src:9bbd203f49b6#p12.7
  - src:9bbd203f49b6#p13.2
  decision: The National Intelligence Authority decides what authority to grant the Central Intelligence Group under Directive
    5.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: With intelligence budgets and personnel constrained while overseas deployments increased, the President directed
    the Intelligence Community to meet military operational needs as its first priority, diverting resources toward tactical
    support. The stated rationale was to give field commanders prompt, thorough intelligence and improve troop security; exclude
    any discussion of how intelligence is collected or used tactically.
  span_range:
  - src:9bbd203f49b6#p19.2
  - src:9bbd203f49b6#p19.4
  decision: The President decides to prioritize tactical intelligence support for military operations under PDD-35.
  content_domain: other:intelligence-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The commission weighs major restructuring against retaining the existing management arrangements, including the DCI–Secretary
    of Defense relationship. It recommends no major structural changes because efforts to strengthen community management
    while maintaining that relationship are bearing fruit; exclude operational intelligence activities.
  span_range:
  - src:9bbd203f49b6#p21.9
  - src:9bbd203f49b6#p22.1
  decision: The Hart-Rudman commission recommends whether to make major structural changes to Intelligence Community management.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
