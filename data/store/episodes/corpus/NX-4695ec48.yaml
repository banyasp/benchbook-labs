- n: 2
  focus: The report contrasts continued commitment with withdrawal before Kony is captured or the LRA threat is nearly eliminated,
    which it says could seriously damage local perceptions and trust. The President chose to extend the deployment; exclude
    details of field operations.
  span_range:
  - src:4cd9c2db6043#p22.2
  - src:4cd9c2db6043#p22.3
  decision: The President decides whether to extend the U.S. special operations advisor deployment for another year rather
    than withdraw it.
  content_domain: other:military deployment policy
  refusal_sensitivity: low
