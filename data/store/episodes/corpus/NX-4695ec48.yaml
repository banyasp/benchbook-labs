- n: 4
  focus: The decision point is whether to negotiate cross-border access or leave national borders closed, weighing regional
    sovereignty and cooperation against the risk that the LRA could use neighboring countries as safe havens. The report says
    negotiations enabled the crossings and explains that, without them, safe routes and havens would undermine the effort;
    exclude operational details of pursuit.
