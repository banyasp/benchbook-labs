  natsec: false
- n: 3
  focus: Assess the 2011 presidential choice to deploy troops rather than continue support without a U.S. military presence,
    including the stated national-security, foreign-policy, regional-cooperation, and humanitarian rationales and the criticism
    that the LRA posed no direct threat to the United States. Keep the focus on the policy decision and its constraints; exclude
    operational details of intelligence sharing, logistics, or joint operations.
