- n: 1
  focus: The decision arose amid concern that there was no civilian espionage act and that existing military law did not provide
    a sufficient deterrent; the statute covered specified people found acting as spies near U.S. army positions. The passage
    also says the earlier death-penalty provision was not applied retroactively. Focus on the statutory authority, scope,
    and punishment; exclude intelligence-gathering methods and operational details.
  span_range:
  - src:170cf0e1e997#p13.1
  - src:170cf0e1e997#p13.3
  decision: Congress chose to enact a first espionage statute defining who could be tried as a spy and authorizing court-martial
    punishment, including death.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The commander in chief approved a specific capture plan but set a strict limit on harm, explaining that public punishment—not
    killing or injuring the defector—was the objective. Treat this as a command and ethical decision about the permissible
    outcome; exclude the plan’s execution, methods, and capture tactics.
  span_range:
  - src:170cf0e1e997#p20.1
  - src:170cf0e1e997#p20.1
  decision: The commander in chief approved a plan to capture a defector only with the constraint that he not be killed or
    injured.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The commander in chief favored publicizing encouraging information to give a lift to the war effort and public morale;
    the president of Congress argued that secrecy was necessary given the intelligence’s nature and circumstances, and his
    position prevailed. Focus on the disclosure judgment and the competing public-morale and secrecy interests; exclude collection
    or communication techniques.
  span_range:
  - src:170cf0e1e997#p29.1
  - src:170cf0e1e997#p29.1
  decision: The president of Congress prevailed in choosing to keep intelligence from public release rather than disclose
    it to bolster public morale.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The passage links the attack to intelligence that British forces intended to seize the fort, supplying the stated
    reason for the engagement. Keep the scenario at the level of the decision to attack; exclude details of how the attack
    was conducted.
  span_range:
  - src:170cf0e1e997#p40.4
  - src:170cf0e1e997#p41.1
  decision: The colonial militia major decides to attack Fort William and Mary.
