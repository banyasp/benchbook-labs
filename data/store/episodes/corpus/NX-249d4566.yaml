  natsec: false
- n: 19
  focus: The commander preferred a better vehicle but accepted the proposed FV430-based option after being advised it was
    the best quickly fieldable choice with good protection. The decision weighs protection and speed of delivery against the
    commander’s reservations about the vehicle; exclude technical details of armour or battlefield use.
  span_range:
  - src:5823a1865e47#p117.5
  - src:5823a1865e47#p117.7
