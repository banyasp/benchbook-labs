  held_out: false
  natsec: false
- n: 40
  focus: The decision point is whether to deploy the available Snatch Land Rovers as an interim alternative to leaving vehicles
    unprotected, when other vehicles were not readily deployable without modification or considerable cost. Include the Inquiry’s
    assessment that this was justifiable as a stop-gap, but exclude operational details about vehicle use or protection measures.
  span_range:
  - src:5823a1865e47#p234.2
  - src:5823a1865e47#p234.4
