  focus: The proposal was to provide additional funding to begin up-armouring FV430s, rather than leave the fleet without
    that enhancement. The stated reasons included anticipated increased deployment beyond bases and the vehicles’ existing
    protection shortfall; exclude technical details of the armour modification.
  span_range:
  - src:5823a1865e47#p88.5
  - src:5823a1865e47#p88.8
