- n: 10
  focus: The Board faced a choice between evolving the Snatch fleet and pursuing a potentially new Snatch variant or Vector
    to meet protection requirements. The source says Snatch upgrades were the cheapest and, in a sensitivity analysis, the
    most cost-effective route, while also noting that the required proportion of higher-protection vehicles had not yet been
    established. Exclude later procurement decisions about Vector.
  span_range:
  - src:5823a1865e47#p68.3
  - src:5823a1865e47#p68.6
