- n: 11
  focus: The decision was whether to deploy the capability as soon as technically available, subject to UOR funding, or wait;
    the advice cited the developing PIR threat and an advanced stage of technical work, while warning that adversaries might
    adapt. Keep the focus on the authorization and funding condition, not technical operation of the countermeasure.
  span_range:
  - src:5823a1865e47#p72.9
  - src:5823a1865e47#p73.2
