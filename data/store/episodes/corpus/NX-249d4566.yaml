    with other helicopter proposals, including Danish Merlins.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 35
  focus: The decision weighed speed against the ordinary tender route, while recognising that the design was novel and that
    design and trials should not be compressed. Frame this as a procurement-governance choice and exclude construction specifications.
  span_range:
  - src:5823a1865e47#p206.3
  - src:5823a1865e47#p206.6
