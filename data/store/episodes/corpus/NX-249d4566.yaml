- n: 20
  focus: The revised arrangement divided initial and excess UOR costs between the Reserve, the MOD and the Treasury, with
    the MOD also receiving support for initial payments and undertaking to rebalance its equipment programme. The decision
    addressed concerns that UOR spending had become unsustainable and was supplementing routine procurement; exclude individual
    equipment requirements.
