    accommodation at Basra Air Station.
  content_domain: other:defence-procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 36
  focus: The decision balanced the need to preserve the project schedule against uncertainty about whether the build would
    remain necessary once other counter-indirect-fire measures were operating and whether its timeline fit the UK’s strategic
    plans. Treat the initial funding and conditions on further commitment as a staged funding choice; exclude construction
    details.
  span_range:
  - src:5823a1865e47#p208.2
  - src:5823a1865e47#p208.6
  decision: The Treasury agreed to fund the initial £14 million of long-lead items for hardened accommodation from the Reserve,
    while making further funding conditional on a continuing business case.
  content_domain: other:defence-procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 37
  focus: The decision was whether to relocate the support facility to Kuwait or continue basing it at Basra. The stated reason
    was to reduce force-protection risk to helicopters without impairing their operational tasking; a forward detachment would
    remain at Basra as the incident response team. Exclude the operational details beyond this basing decision.
  span_range:
  - src:5823a1865e47#p213.5
  - src:5823a1865e47#p213.6
