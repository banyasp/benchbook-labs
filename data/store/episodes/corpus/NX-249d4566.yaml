  natsec: true
- n: 31
  focus: The decision point is whether to pursue Predator B as a national capability or rely on other measures to address
    surveillance shortfalls, while preserving the longer-term Watchkeeper programme. The Chiefs described Predator B as the
    most coherent capability for UK needs; exclude the operational use of surveillance systems.
  span_range:
  - src:5823a1865e47#p184.8
  - src:5823a1865e47#p184.10
  decision: The Chiefs of Staff agreed that Predator B should be procured as soon as possible for use in Afghanistan, without
    prejudice to the Watchkeeper programme.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 32
  focus: The decision followed increased troop numbers in Afghanistan and a search for ways to increase helicopter capacity;
    the stated reason was to make the aircraft available as quickly as possible. Rebuild the choice between reverting them
    and continuing to seek a solution to the Mk3 airworthiness problems, and exclude technical modification details.
  span_range:
  - src:5823a1865e47#p189.3
  - src:5823a1865e47#p189.3
  decision: The Defence Secretary decided to revert the eight Chinook Mk3 helicopters to the Mk2 standard so they could enter
    operational use sooner.
  content_domain: other:defence-procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 33
  focus: The decision weighed added protection against the assessed threat, existing compartmentalisation and force-protection
    measures, cost, construction time, possible drawdown, and the signal hardening might send. Keep the scenario at the policy
    level of whether to invest in CITADEL; exclude engineering and force-protection implementation details.
  span_range:
  - src:5823a1865e47#p193.9
  - src:5823a1865e47#p195.2
