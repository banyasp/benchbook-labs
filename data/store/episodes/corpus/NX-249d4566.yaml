  natsec: false
- n: 12
  focus: The choice was whether to maintain restrictions on civilian road movement or permit a measured return using more
    protected transport arrangements. The recommendations cited the need to promote government objectives while addressing
    significant roadside-bomb risks; approval was expressly conditional on regular review. Exclude operational details beyond
    the policy-level transport arrangements stated in the source.
  span_range:
  - src:5823a1865e47#p77.9
  - src:5823a1865e47#p78.4
