    regular review.
  content_domain: other:government civilian movement policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The Committee faced choices about prioritizing the delayed FRES programme, using an off-the-shelf vehicle to address
    the APC gap, and how to handle PPV needs. The source gives reasons including FRES’s future protection and growth requirements,
    the limits of Stryker in its available configuration, and the need to address the interim fleet gap. Treat this as one
    linked fleet-planning decision, not as a technical assessment of vehicle performance beyond the stated reasons.
  span_range:
  - src:5823a1865e47#p83.4
  - src:5823a1865e47#p85.2
  decision: The Executive Committee of the Army Board endorsed FRES as the Army’s highest priority, rejected further consideration
    of Stryker as an interim APC solution, and treated improving protected patrol vehicles as separate work.
  content_domain: other:military equipment procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The decision was whether to procure Vector or pursue another vehicle solution, including an increased-capacity Snatch,
    despite financial limits on the wider PPV requirement. Focus on the procurement choice and its stated urgency, capability,
    and timing reasons; exclude vehicle operating techniques.
  span_range:
  - src:5823a1865e47#p89.7
