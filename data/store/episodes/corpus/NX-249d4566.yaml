  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The decision was to combine purchases of Vector and Cougar vehicles with further up-armouring of FV430s, rather than
    rely on a single solution. The stated context was a capability gap, no immediately available small but better-protected
    vehicle, and a need for feasible short-term options; exclude later operational-use details.
  span_range:
  - src:5823a1865e47#p108.2
  - src:5823a1865e47#p109.3
