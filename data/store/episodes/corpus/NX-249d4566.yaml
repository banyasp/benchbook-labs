  focus: The business case set out alternatives including doing the minimum, RG31, Cougar, and Bushmaster; Cougar was identified
    as the preferred solution and the MOD sought funding and permission to proceed with commercial arrangements. Focus on
    the choice, its delivery and protection rationale, and the Treasury’s conditional funding response; exclude vehicle employment
    methods.
  span_range:
  - src:5823a1865e47#p104.7
