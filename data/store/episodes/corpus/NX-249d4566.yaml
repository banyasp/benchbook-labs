    on a temporary basis.
  content_domain: other:civilian deployment and legal policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 42
  focus: The choice was whether and how far to expand UK support to ORHA despite concerns about the organisation and uncertainty
    about its needs. The stated reasons included that ORHA was the only available channel, UK secondees could influence US
    planning, and the UK’s reconstruction role should reflect its military contribution; exclude the operational details of
    individual postings.
  span_range:
  - src:5823a1865e47#p260.2
  - src:5823a1865e47#p262.7
  decision: The Prime Minister decided that the UK should significantly increase its political and practical support to ORHA,
