  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 38
  focus: The decision weighed proceeding with additional hardened accommodation against delaying it until force levels and
    the UK’s future posture were better known. The advice noted both an increased indirect-fire threat and the possibility
    that future options would make the tranche unnecessary, while accepting that delaying meant not providing hardened accommodation
    to all personnel as quickly as possible. Exclude later decisions about reconfiguring or transferring other structures.
  span_range:
  - src:5823a1865e47#p215.5
