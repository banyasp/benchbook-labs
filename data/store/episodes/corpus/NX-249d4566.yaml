  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 39
  focus: The decision concerned whether to pursue transfer of the structures to the United States rather than Iraq, in light
    of US preferences and the UK’s revised accommodation plan. The account identifies force-protection risk, the uncertainty
    of relying on personal protection instead of hardened accommodation, and the need for an agreement with the Iraqi Government.
    Exclude the technical details of the structures and any operational use of force.
  span_range:
  - src:5823a1865e47#p217.3
  - src:5823a1865e47#p217.10
