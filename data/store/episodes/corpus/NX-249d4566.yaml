- n: 41
  focus: The decision point is whether and how DFID should contribute to ORHA’s planning amid concerns about the legal basis
    for reconstruction without a UN mandate. Include the choice of a temporary advisory role outside ORHA; exclude details
    of the secondee’s subsequent work.
  span_range:
  - src:5823a1865e47#p252.3
  - src:5823a1865e47#p252.4
