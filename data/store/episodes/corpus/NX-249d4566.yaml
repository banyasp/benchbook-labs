    in Iraq at that stage.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 34
  focus: The decision concerned how to address helicopter availability amid crew-harmony concerns and doubts about sustainability,
    even though Afghanistan had seen few unsupported tasks and had not requested additional assets. Focus on the choice to
    approve the flying-hour increase while slowing other proposals pending clarity on requirements and funding; exclude flight
    operations.
  span_range:
  - src:5823a1865e47#p191.3
  - src:5823a1865e47#p191.8
