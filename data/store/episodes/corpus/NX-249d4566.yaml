- n: 9
  focus: The group’s options ranged from more Snatch 2 conversions to a larger Vector purchase; the revised requirement identified
    Option 2 as preferred. The decision point concerns balancing fleet numbers, capability and constrained funding, including
    the need for a more capable vehicle for Afghanistan; exclude technical specifications and operational employment.
  span_range:
  - src:5823a1865e47#p63.2
  - src:5823a1865e47#p64.8
