  focus: The group weighed protection, mobility, capacity, sustainability and the urgent delivery timetable. Its reasons included
    Tavern’s logistics and reliability concerns and the timing or availability problems with alternatives; it acknowledged
    that Snatch might not meet the local threat. Exclude technical vehicle specifications and later procurement decisions.
  span_range:
