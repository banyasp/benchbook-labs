- n: 30
  focus: 'The decision point was how to relieve immediate pressure on rotary-wing assets: release assets from other tasks,
    extract more from assets already in theatre, or wait for longer-term improvements. The Chiefs agreed to take greater risk
    on other operations and also seek continued allied helicopter support. Exclude operational flying procedures.'
  span_range:
  - src:5823a1865e47#p184.3
  - src:5823a1865e47#p184.6
