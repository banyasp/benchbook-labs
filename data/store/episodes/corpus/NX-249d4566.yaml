- n: 18
  focus: The Board approved procurement while warning that the rapid programme and survivability demands created cost and
    schedule risks; any cost growth would have to be absorbed within the approved amount, potentially by reducing vehicle
    numbers. The decision point is approval and its fiscal constraint, not vehicle employment.
  span_range:
  - src:5823a1865e47#p109.4
  - src:5823a1865e47#p109.6
