  focus: The decision was whether to retain the existing Sea King numbers or reduce them after changes to tasking lines and
    servicing routines. The Chiefs noted that flying hours would be sustained through more efficient use of other assets.
    Exclude operational details of aircraft tasking.
  span_range:
  - src:5823a1865e47#p173.8
  - src:5823a1865e47#p174.4
