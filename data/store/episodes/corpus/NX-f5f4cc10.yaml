- n: 1
  focus: The decision point is whether and by whom the government should organize foreign broadcast monitoring as a supplemental
    intelligence source, given concerns that war could disrupt diplomatic reporting. Keep the scenario at the level of institutional
    authority and the case for an official service; exclude the service’s monitoring methods and later operational work.
  span_range:
  - src:61af298f572f#p2.2
  - src:61af298f572f#p2.4
  decision: The FCC leadership chose to establish an official foreign-broadcast monitoring service rather than leave monitoring
    to private sources.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is how to recruit qualified linguists from internment camps amid a volatile atmosphere: public
    advertising or quiet recommendations by camp staff. Consider the risk of pressure on applicants and families alongside
    the need to recruit; exclude individual hiring outcomes and any operational intelligence methods.'
  span_range:
  - src:61af298f572f#p5.2
  - src:61af298f572f#p5.3
  decision: The WRA employment officials and FBIS recruitment staff chose discreet, camp-directed preselection of Japanese-American
    linguist applicants rather than public advertisements.
  content_domain: other:wartime personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether the FCC should defend employees facing congressional accusations or distance the agency
    from them. The defense cited their anti-fascist activity and argued that the accusations were contradicted by their public
    record; exclude the later congressional action cutting off compensation, which was a separate decision.
  span_range:
  - src:61af298f572f#p9.8
  - src:61af298f572f#p10.1
  decision: FCC leadership chose to stand behind the three FBIS employees accused of disloyalty rather than disavow them.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
