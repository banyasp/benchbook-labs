  focus: The decision was whether to create a U.S. clandestine capability or leave the field to rival services; the stated
    rationale was that the United States could not abdicate its role and needed to meet its rivals on even terms. The Act
    supplied authority through its “other functions and duties” language, while keeping intelligence collection primary and
    action functions secondary. Exclude operational methods and examples of particular clandestine activities.
