episodes:
- n: 1
  focus: The initial draft judged that Yugoslavia would muddle through; the National Intelligence Officer and caucus group
    found that conclusion unpersuasive because the Communist Party and military no longer seemed credible guarantors of cohesion.
    Focus on the analytic choice to reassign the draft and its basis, not on later operational or diplomatic responses.
  span_range:
  - src:b40cd8d85199#p18.9
  - src:b40cd8d85199#p19.1
  decision: The National Intelligence Officer for Europe chose to replace the initial drafter of the Yugoslavia estimate and
    pursue a darker assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The staff faced pressure from European governments to wait, while senior US officials were preoccupied with Iraq
    and unwilling to press the Yugoslavia issue. Focus on the choice to defer rather than press ahead with action; exclude
    operational detail.
  span_range:
  - src:b40cd8d85199#p22.10
  - src:b40cd8d85199#p22.11
  decision: The National Security Council staff agreed to defer action on Yugoslavia until after Serbia’s December 1990 elections.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The Secretary of State stated that US policy would not recognize Slovenia’s declaration, preferring negotiation and
    dialogue over unilateral action. Focus on the recognition and diplomatic-policy choice and its stated rationale; exclude
    subsequent operational events.
  span_range:
  - src:b40cd8d85199#p21.3
  - src:b40cd8d85199#p21.4
  decision: The US administration chose not to recognize Slovenia’s planned declaration of independence and favored a negotiated
    resolution.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The stated choice was against military intervention because the region was not judged strategically vital enough
    to justify the risks and costs. Focus on the policy threshold and rationale for committing force, not on any means of
    conducting an intervention.
  span_range:
  - src:b40cd8d85199#p25.3
  - src:b40cd8d85199#p25.5
  decision: The Secretary of Defense judged that the United States should not commit military force to the Yugoslavia conflict.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: 'This decision point concerns Germany’s diplomatic recognition decision and its stated context: public support for
    Slovenes and Croats and the foreign minister’s sympathies for their causes. Exclude the subsequent US reaction, which
    is described as a consequence rather than a separate, fully developed decision here.'
  span_range:
  - src:b40cd8d85199#p25.13
  - src:b40cd8d85199#p25.16
  decision: The German government decided to recognize Slovenia and Croatia as independent states in December 1991 rather
    than withhold recognition.
  content_domain: other:diplomatic recognition
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: This decision point concerns whether senior policymakers would support active steps to prevent a feared collapse
    or decline to do so. The passage links their reluctance to Yugoslavia’s diminished strategic importance after the Cold
    War and notes that officials at the senior working level could not persuade them; exclude unspecified operational details
    of any possible steps.
  span_range:
  - src:b40cd8d85199#p26.3
  - src:b40cd8d85199#p26.6
  decision: Senior US policymakers decided not to undertake active steps to prevent Yugoslavia’s disintegration.
