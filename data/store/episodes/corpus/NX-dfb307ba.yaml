episodes:
- n: 1
  focus: The decision point is whether to retain the imagery’s classification or release it for public, scientific, and historical
    use. The document says intelligence-community task forces concluded that the imagery had unusual public value and that
    declassification presented no national-security threat; the DCI approved their recommendations and the President ordered
    declassification. Exclude the technical details of image collection.
  span_range:
  - src:cec03d193038#p14.3
  - src:cec03d193038#p14.4
  decision: The President decided to declassify more than 800,000 early satellite images.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to continue the program or abandon it amid repeated launch, camera, and recovery failures.
    The account says officers persisted because intelligence needs about Soviet capabilities were urgent, U-2 coverage could
    not answer critical questions, and the missile-gap controversy heightened the stakes; exclude technical choices about
    conducting reconnaissance.
  span_range:
  - src:cec03d193038#p35.1
  - src:cec03d193038#p35.3
  decision: CORONA program officers chose to persist with the satellite reconnaissance program despite its early failures.
  content_domain: other:intelligence-program policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to keep launching amid repeated system failures or pause launches for intensive research
    and development. The stated reason was to identify and eliminate causes of failure; exclude the engineering details of
    diagnosing or correcting the system.
  span_range:
  - src:cec03d193038#p35.4
  - src:cec03d193038#p36.2
  decision: CORONA program leadership imposed a launch standdown from November 1959 to February 1960 to concentrate on research
    and development addressing the failures.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to protect the material through a special control system with access limited to personnel
    selected for major national-security needs, or allow broader access. Focus on the President’s approval and the assigned
    responsibilities for selecting and reviewing access; exclude technical details of reconnaissance or material handling.
  span_range:
  - src:cec03d193038#p88.6
  - src:cec03d193038#p88.8
  decision: The President approved the TALENT-KEYHOLE control system and restricted access to satellite reconnaissance products
    and information about the reconnaissance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to approve the proposed access billets after scrutiny of which roles actually required
    access, rather than retain the earlier, broader schedules. Focus on the review, the reduction in requested billets, and
    the recommendation for approval; exclude roster implementation details.
  span_range:
  - src:cec03d193038#p99.6
  - src:cec03d193038#p100.3
  decision: The Board considered whether to approve revised TALENT-KEYHOLE billet schedules after a functional-need review.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is which competing assessment to adopt given new evidence about missile tests, deployment complexes,
    and other reporting, alongside continuing gaps and alternate interpretations. Focus on the majority estimate and the dissent
    with its stated rationale; exclude operational collection methods and target details.
  span_range:
  - src:cec03d193038#p139.2
  - src:cec03d193038#p142.3
  decision: The intelligence community adopted a low estimate of current and near-term Soviet ICBM strength, while recording
    the Air Force intelligence office’s dissenting higher estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The report reconstructs a Soviet leadership choice between wider deployment of the first-generation system and limiting
    that force while pressing ahead with a successor. It gives the rationale that the first-generation missile was powerful
    and reliable but too cumbersome for large-scale deployment; exclude technical details about missile operation and the
    report’s separate force-level estimates.
  span_range:
  - src:cec03d193038#p150.4
  - src:cec03d193038#p151.2
  decision: Soviet leaders chose to deploy only a small force of first-generation ICBMs while continuing to develop second-generation
    systems.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
