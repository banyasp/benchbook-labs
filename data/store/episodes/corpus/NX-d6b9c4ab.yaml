- n: 1
  focus: The decision point is whether to end the planned training after weather prevented the air-to-air mission or continue
    with an alternate task once workable airspace was found. The report gives the weather and airspace circumstances and cites
    altitude separation as the reason for assigning separate blocks; exclude the attack and threat-reaction tactics themselves.
  span_range:
  - src:8095407a56e5#p11.7
  - src:8095407a56e5#p12.1
  decision: The mishap pilot changed the flight’s plan from returning to base to splitting the formation and conducting an
    alternate, unopposed training mission.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to initiate search and rescue or take another response after the wingman lost contact
    and the aircraft’s position indicator disappeared. The report states that the wingman initiated SAR and gives the loss
    of contact as context; exclude the subsequent search procedures and coordination details.
  span_range:
  - src:8095407a56e5#p24.3
  - src:8095407a56e5#p24.3
  decision: The mishap wingman initiated search and rescue after losing contact with the mishap pilot and aircraft.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue trying to execute the primary mission in the available weather or adapt
    the mission to use the airspace that remained workable. The report gives the weather constraint and the stated rationale
    for simplifying and splitting the formation; exclude the details of the simulated attacks and threat-reaction maneuvers.
  span_range:
  - src:8095407a56e5#p46.7
  - src:8095407a56e5#p47.1
  decision: The mishap pilot, acting as flight lead, chose to replace the primary mission with a simplified backup mission
    and split the formation into two flights.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
