episodes:
- n: 1
  focus: The agencies initially wanted the agreements to continue, but the Attorney General advised suspension until the programs
    could be reviewed. Focus on the legal and oversight choice to continue or suspend that support, not on the underlying
    intelligence collection.
  span_range:
  - src:f45f5dcbb652#p1.18
  - src:f45f5dcbb652#p1.19
  decision: The Attorney General advised the NSA Director to suspend watch-list information support to Justice agencies pending
    review, and the NSA did so.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The executive branch and some committee members favored a closed hearing because of classified-information risks
    and disputed legal questions. Focus on the chair’s decision to proceed publicly and the cited parliamentary advice and
    events preceding it; exclude details about intelligence collection itself.
  span_range:
  - src:f45f5dcbb652#p1.49
  - src:f45f5dcbb652#p1.54
  decision: The Senate committee chair proceeded with a public hearing on NSA and SHAMROCK rather than keeping the hearing
    closed.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The executive branch chose to restrict testimony rather than allow employees to answer questions on the hearing’s
    subject. Focus on the privilege and classification grounds, and the competing oversight interests; exclude witness-by-witness
    testimony details.
  span_range:
  - src:f45f5dcbb652#p1.61
  - src:f45f5dcbb652#p1.63
  decision: The Secretary of Defense and Attorney General directed subpoenaed government employees not to answer substantive
    questions at the House subcommittee hearing, invoking executive privilege.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The NSA sought an exception after DOJ directed agencies to obtain outside counsel. Focus on DOJ’s choice between
    private counsel and government representation, including the concern that refusing to defend the NSA could imply the activities
    lacked a legal basis; exclude the underlying collection practices.
  span_range:
  - src:f45f5dcbb652#p1.68
  - src:f45f5dcbb652#p1.70
  decision: The Department of Justice reversed its decision not to represent the NSA in the lawsuit and provided government
    counsel.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
