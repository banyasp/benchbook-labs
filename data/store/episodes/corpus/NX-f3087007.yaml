- n: 1
  focus: The decision point is the President’s choice to pursue a limited covert operation rather than accept public national-level
    commitment and broader resourcing. The essay argues that the operation’s scale made deniability unlikely and that secrecy,
    political constraints, and insufficient capabilities contributed to failure. Exclude the operation’s planning and execution
    details.
  span_range:
  - src:edd20c155241#p18.4
  - src:edd20c155241#p19.3
  decision: The President chose whether to limit the Bay of Pigs operation to a covert effort or publicly commit the United
    States, involve Congress, and resource it across government.
  content_domain: intel-oversight
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The choice followed months of negotiations and the MRTA leader’s restriction of medical visits, which harmed care
    for elderly hostages. The government had committed to seeking peace and using force only when hostages were in danger;
    the president ordered the military action while peaceful efforts had been pursued. Exclude the operational plan and execution
    of the rescue.
  span_range:
  - src:edd20c155241#p47.3
  - src:edd20c155241#p48.2
  decision: The Peruvian president decides whether to continue pursuing a peaceful resolution or authorize military action
    to rescue the remaining hostages.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: Japan urged a peaceful resolution and warned of the consequences of a raid, while Peru also faced pressure over the
    MRTA’s demands. The president rejected external pressure to preserve maneuvering room, while using diplomatic forums and
    trips to support a peaceful solution that did not tolerate blackmail. Exclude the military planning and operational consequences
    of this diplomatic strategy.
  span_range:
  - src:edd20c155241#p52.2
  - src:edd20c155241#p53.3
  decision: The Peruvian president decides to reject foreign pressure and pursue the government’s own diplomatic strategy
    during the hostage crisis.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The government carefully managed official statements and presidential silence despite press interest and international
    attention. The stated reason was to preserve secrecy around its military strategy and maintain control over events; the
    passage also notes that the lack of official information prompted press speculation. Exclude the separate decision to
    cut communications to the residence and any operational deception details.
  span_range:
  - src:edd20c155241#p48.5
  - src:edd20c155241#p48.5
  decision: The Peruvian government decides to limit official information and presidential statements to the press during
    the hostage crisis.
  content_domain: other:public-information policy
  refusal_sensitivity: low
