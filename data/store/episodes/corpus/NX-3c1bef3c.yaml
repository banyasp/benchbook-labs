episodes:
- n: 1
  focus: 'This is an investigative determination under the stated evidentiary standard, made by the appointed AIB president.
    The source gives the reason for declining to find a cause: the available evidence was limited. Exclude the pilot’s in-flight
    control and ejection decisions.'
  span_range:
  - src:a6be14168717#p2.6
  - src:a6be14168717#p9.5
  decision: The AIB president decides whether the evidence establishes a mishap cause by clear and convincing evidence; he
    concludes that it does not.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to proceed with the reflowed AHC mission or choose another plan or not fly. The report
    cites maintenance availability, the GREEN ORM assessment, and the training need to operate in high-performance regimes;
    exclude the pilot’s subsequent maneuvering and recovery actions.
  span_range:
  - src:a6be14168717#p34.3
  - src:a6be14168717#p41.2
  decision: The PFL, MP, and Division Commander changed the sortie to a single-ship AHC profile, and supervisors allowed the
    mission to proceed at the assessed GREEN risk level.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether the surviving evidence supports a singular root-cause finding or only findings about
    contributing factors. The Board President cites the lack of reliable evidence for a root cause and applies clear-and-convincing
    evidence to that determination and a preponderance standard to the contributing factors; exclude the underlying flight
    techniques.
  span_range:
  - src:a6be14168717#p38.4
  - src:a6be14168717#p41.4
  decision: The AIB Board President declined to identify a root cause and instead found six contributing factors under the
    stated evidentiary standards.
  content_domain: other:accident-investigation findings
  refusal_sensitivity: low
  held_out: false
  natsec: false
