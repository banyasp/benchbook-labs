- n: 1
  focus: The decision weighed the proposed trusteeship and opposition to French colonial restoration against France’s threat
    not to support US policies in postwar Europe or dealings with the Soviet Union. Keep the focus on the administration’s
    foreign-policy choice and its stated rationale, not on later military operations.
  span_range:
  - src:490f183927e5#p18.3
  - src:490f183927e5#p18.6
  decision: The Truman administration chose to acquiesce in and actively support France’s return to Indochina rather than
    pursue a UN trusteeship.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: 'The decision concerned which institution should control the expanding program: CIA or the military command. The
    passage gives both military objections to CIA’s role and the administration’s post-Bay of Pigs judgment about CIA’s capacity;
    exclude the subsequent change in the program’s operational methods.'
  span_range:
  - src:490f183927e5#p22.11
  - src:490f183927e5#p23.5
  decision: The Kennedy administration endorsed transferring the CIDG program from CIA to MACV rather than keeping it under
    CIA direction.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether the DCI should direct CIA involvement in the impending coup or leave personnel without
    such instructions. The passage gives his opposition to a coup and his predictions of political instability and military
    deterioration; exclude the mechanics of the coup and the liaison’s communications.
  span_range:
  - src:490f183927e5#p23.11
  - src:490f183927e5#p23.14
  decision: The DCI chose not to direct CIA personnel to support, hinder, or prevent the South Vietnamese generals’ coup against
    the Diem regime.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to preserve the CIA analysts’ estimate or accept the military’s figures in order to
    avoid a schism in the intelligence and defense communities; the president received a compromise count. Keep the focus
    on the assessment and its presentation, not on later operational consequences.
  span_range:
  - src:490f183927e5#p30.8
  - src:490f183927e5#p30.10
  decision: The CIA Director chose to accept the military’s lower order-of-battle estimate in key judgments, relegating the
    CIA’s higher estimate to the back pages.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is the choice between military intervention and diplomacy amid opposition to the Laotian government
    and the presence of US troops nearby. The passage gives the president’s view that Laos was remote and not vital to US
    interests; exclude the later operational details of interdiction and covert activity.
  span_range:
  - src:490f183927e5#p39.4
  - src:490f183927e5#p39.11
  decision: The President chose a diplomatic settlement and neutral Laos over risking a military conflict to preserve the
    existing Laotian government.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is the policy shift from an overt US presence to a CIA-led covert effort, as leaders came to view
    interdiction of the route as essential to stabilizing South Vietnam. The account also says the conflict was intended not
    to escalate; exclude the described operational methods of harassment, interdiction, intelligence collection, and logistical
    support.
  span_range:
  - src:490f183927e5#p39.12
  - src:490f183927e5#p40.3
  decision: The CIA chose a covert effort with Laotian and Hmong support in place of the overt US Special Forces presence
    for efforts along the Ho Chi Minh Trail.
  content_domain: other:covert-action-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 7
  focus: The passage says the President judged a rescue attempt to be the only option to prevent the hostages from being moved
    to the mainland and facing an uncertain fate. Focus on the policy choice to attempt a military rescue and its stated rationale;
    exclude operational planning and execution details, which the passage does not provide.
  span_range:
