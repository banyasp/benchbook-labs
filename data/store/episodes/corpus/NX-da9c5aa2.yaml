  natsec: true
- n: 2
  focus: The analysts inferred different functions from the photographic pattern, despite domestic experts' contrary view
    based on British practice and technical difficulty. The assessment mattered to the countermeasure programme; exclude technical
    instructions for radar or countermeasures.
  span_range:
  - src:ba1763798b4e#p6.2
  - src:ba1763798b4e#p7.1
  decision: Scientific-intelligence analysts decide whether German nightfighter radar stations use their two paraboloids for
    different aircraft or reserve one as a standby.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: Staff rejected the experts' 80-ton estimate in favor of an estimate of 12 tons with a 1-ton warhead, drawing on fragment
    observations and reports assessed as credible. The decision concerns the intelligence estimate and warning; exclude weapon
    construction or use details.
  span_range:
