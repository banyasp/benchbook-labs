- n: 2
  focus: The choice was whether to accept the initial, conventional-force-oriented plan or revise it toward a more central
    role for support to Afghan opposition forces. The stated concern was that the plan focused on striking terrorist targets
    despite inadequate intelligence and was unlikely to achieve the President’s objectives; exclude campaign execution details.
  span_range:
