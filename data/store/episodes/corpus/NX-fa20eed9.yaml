- n: 7
  focus: The decision point is the choice among a conventional-force deployment, air and cruise-missile attacks, and SOF,
    given the urgency of responding and Afghanistan’s terrain and limited infrastructure. The passage says conventional forces
    could take months to deploy and that bombing would not be decisive, leading staff officers to judge SOF the most appropriate
    short-term means; exclude operational methods of employing those forces.
  span_range:
