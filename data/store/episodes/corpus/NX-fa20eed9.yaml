- n: 4
  focus: The decision point is whether to aid the rebels or refrain from direct support amid pressure to act. Focus on the
    NSC’s escalation assessment, including the possibility of U.S.-Soviet armed conflict and nuclear use, and the election-year
    factor; exclude operational details of any possible support.
  span_range:
