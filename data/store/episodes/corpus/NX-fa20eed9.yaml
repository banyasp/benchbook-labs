- n: 3
  focus: The commander could pursue a large conventional invasion or troop insertion, or approve the proposed campaign centered
    on support to Afghan resistance forces. He approved the latter because it offered a quick, novel response with a small
    U.S. footprint and an Afghan face, consistent with senior leaders’ aims; exclude details of campaign execution.
  span_range:
