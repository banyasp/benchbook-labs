episodes:
- n: 1
  focus: The decision point is the analysts’ choice between treating the North Korean force buildup as preparation for invasion
    or as a defensive response to South Korean strength. They judged invasion unlikely without a clear-cut North Korean military
    advantage, noting that senior US officers considered the South Korean Army strong and that South Korean leadership had
    voiced reunification ambitions. Exclude later judgments about responses to the June attack.
  span_range:
  - src:e2ca8f38fb2f#p10.2
  - src:e2ca8f38fb2f#p10.4
  decision: ORE analysts assessed that a North Korean invasion of South Korea was unlikely in early 1950.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether reports of Chinese troop movements and warnings warranted judging open Chinese intervention
    likely, or whether political and military considerations made it unlikely. The analysts favored the latter, citing the
    risk of war with the United States and consequences for Soviet influence and prestige, and continued to assess the scale
    of intervention as limited. Exclude any operational response to intervention.
  span_range:
  - src:e2ca8f38fb2f#p11.1
  - src:e2ca8f38fb2f#p11.4
  decision: ORE analysts assessed that China was unlikely to openly commit forces to the Korean War in September 1950, and
    maintained that judgment as intervention began.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: After Britain announced it would withdraw forces and reduce assistance, CIG considered whether neighboring states’
    armies might assist Greek guerrillas or whether direct participation was unlikely. It judged direct intervention unlikely
    because of the international repercussions and risk of drawing the Soviet Union into a world war for which it was unprepared.
    Exclude recommendations about aid to Greece, which are distinct from this estimate.
  span_range:
  - src:e2ca8f38fb2f#p14.2
  - src:e2ca8f38fb2f#p14.5
  decision: CIG analysts assessed that Albanian, Yugoslav, and Bulgarian armies were unlikely to intervene directly in the
    Greek civil war.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision was to replace ORE’s combined analytical structure with separate offices for national estimates, research
    and reports, and current intelligence. The stated reason was to end confusion over the analytical mission by splitting
    competing functions; exclude judgments about the quality or effects of ORE’s analysis.
  span_range:
  - src:e2ca8f38fb2f#p16.3
  - src:e2ca8f38fb2f#p16.3
  decision: The incoming Director of Central Intelligence and Deputy Director decided to abolish ORE and replace it with three
    separate offices.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: This is an estimative judgment about the likelihood of Soviet action, weighing Soviet military capability against
    the deterrent of US war-making potential, the absence of conclusive evidence of preparations, and the increased risk of
    miscalculation. Include the committee’s conclusion and the Army intelligence director’s dissent on how to characterize
    that risk; exclude operational military methods.
  span_range:
  - src:e2ca8f38fb2f#p77.4
  - src:e2ca8f38fb2f#p77.8
  decision: The Joint Ad Hoc Committee decided to assess that a deliberate Soviet resort to direct military action against
    the West during 1949 was improbable.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is France’s choice to commit manpower and materiel to a military campaign, weighing its stated
    concerns about the China-Indochina border and regional security against effects on Western European defense, French recovery,
    and US interests. Exclude operational details of the campaign and the separate question of US aid.
  span_range:
  - src:e2ca8f38fb2f#p84.5
  - src:e2ca8f38fb2f#p85.3
  decision: The French government chose to shift forces and equipment from Germany and North Africa for an autumn campaign
    in Indochina.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The passage describes the Kremlin’s diplomatic choice to avoid a more truculent posture and maintain the status quo
    while preserving the CFM as a negotiating forum. The stated rationale includes concern that a harder line could strengthen
    Western resolve, rearmament, and continued financial support for the Cold War; exclude operational matters.
  span_range:
  - src:e2ca8f38fb2f#p89.5
  - src:e2ca8f38fb2f#p89.6
  decision: The Kremlin chose to preserve the status quo on Germany at the CFM while keeping the path open for future negotiations.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: This is an estimative judgment weighing the likelihood of deliberate action and unintended escalation against recent
    Soviet and Western developments. The passage gives the conclusion and supporting factors; exclude any operational military
    planning.
  span_range:
  - src:e2ca8f38fb2f#p93.5
  - src:e2ca8f38fb2f#p95.18
  decision: CIA analysts assessed that deliberate Soviet military action against the West was improbable and that the danger
    of war from miscalculation had declined.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to publish the estimate promptly with a clear CIA position and the agencies’ dissents,
    or delay publication while seeking interagency agreement. The CIA chose publication because the issues were important
    and time-sensitive, and it judged a straightforward estimate with contrary views more useful than a watered-down consensus;
    exclude the substantive estimates of Soviet intentions and capabilities.
  span_range:
  - src:e2ca8f38fb2f#p134.5
  - src:e2ca8f38fb2f#p134.7
  decision: The CIA decided to publish its estimate on Soviet possession of the atomic bomb as an interim report rather than
    wait for agreement among the intelligence agencies.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to retain the paper for dissemination and planning or withdraw it in favor of another
    assessment. The dissent says the paper minimized the Soviet threat, inadequately considered atomic weapons, and was too
    unclear to support firm conclusions; exclude the underlying question of which Soviet-threat estimate was correct.
  span_range:
  - src:e2ca8f38fb2f#p144.5
  - src:e2ca8f38fb2f#p144.6
  decision: The Assistant Chief of Staff, G-2, recommended withdrawing the subject paper and substituting JIC 502 as the basis
    for resolving differences.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to accept the demands or continue resisting them, despite the prospect of a cabinet
    crisis and a breakdown of the coalition. The passage reports Nagy’s fear that a breakdown could lead to civil war and
    continued Soviet troop presence; exclude the Soviet demands’ operational details beyond the policy dispute described.
  span_range:
  - src:e2ca8f38fb2f#p157.3
  - src:e2ca8f38fb2f#p157.5
  decision: Premier Nagy conceded most of the Soviet demands on the Hungarian government.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: The decision point is whether to seek leverage with the USSR by accommodating the Tudeh Party and taking severe measures
    against conservatives, or pursue another domestic and negotiating course. The report gives the stated purpose as improving
    Qavam’s position in negotiations; exclude speculation about Soviet choices not necessary to understand Qavam’s decision.
  span_range:
  - src:e2ca8f38fb2f#p153.5
  - src:e2ca8f38fb2f#p153.5
  decision: Premier Qavam chose to cultivate the Tudeh Party and repress conservative elements to improve Iran’s position
    in negotiations with the USSR.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: This is an estimative judgment made while weighing provocative rhetoric and incidents against the absence of unusual
    troop movements, supply buildups, shipping warnings, or an operational atomic bomb. Preserve the analysts’ caveat that
    direct action or satellite action could not be ruled out; exclude operational military responses, which the passage does
    not decide.
  span_range:
  - src:e2ca8f38fb2f#p179.5
  - src:e2ca8f38fb2f#p182.3
  decision: The intelligence analysts judged whether recent Soviet actions indicated imminent military action or an intensive
    war of nerves, concluding that the latter was more plausible absent evidence of military preparations.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is Turkey’s response to a proposal for Black Sea Powers’ responsibility and joint Soviet-Turkish
    defense of the Straits, which Turkey regarded as potentially enabling Soviet bases. The passage identifies sovereignty
    as the limit on negotiation and anticipated US and UK support; exclude any military preparations or operational response.
  span_range:
  - src:e2ca8f38fb2f#p172.3
  - src:e2ca8f38fb2f#p172.4
  decision: The Turkish premier chose to discuss the reasonable elements of the Soviet Straits proposal while refusing provisions
    that threatened Turkish sovereignty.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: 'The Austrian Government’s proposed course depended on agreement from the US, UK, and the Austrian coalition parties.
    The report gives its rationale: the Soviets appeared more willing to make concessions for a quick settlement, while the
    issue remained disputed in the Allied Commission; exclude broader claims about Soviet policy that do not bear on this
    choice.'
  span_range:
  - src:e2ca8f38fb2f#p196.3
  - src:e2ca8f38fb2f#p196.4
  decision: The Austrian Government planned to seek bilateral negotiations with the USSR over German assets in eastern Austria,
    rather than continue to address the issue through the Allied Commission.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The choice is between joining the program and refusing, despite the economic costs of exclusion. The analysis says
    participation would compromise Soviet control over Eastern European economies, while refusal risked violating the Soviet
    principle of participating in any powerful combination; exclude later propaganda tactics and their implementation.
  span_range:
  - src:e2ca8f38fb2f#p220.4
  - src:e2ca8f38fb2f#p220.6
  decision: The Soviet leadership decides to refuse participation in the European recovery program.
  content_domain: intel-analysis
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 17
  focus: The decision was whether to support the program, departing from France’s postwar policy of avoiding an East-West
    division, or yield to Soviet and domestic Communist pressure. The passage gives reasons and describes political efforts
    to sustain support; exclude the mechanics of those efforts.
  span_range:
  - src:e2ca8f38fb2f#p219.4
  - src:e2ca8f38fb2f#p219.5
  decision: The French foreign minister decides to support the European recovery program despite Soviet opposition.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The choice is between pursuing a French-influenced regime excluding Ho Chi Minh and engaging with Ho Chi Minh or
    moderate Viet Minh elements. The passage cites popular support for Ho, the weakness of alternative regimes, French military
    constraints, and unfavorable international reaction; exclude military operations and communications details.
  span_range:
  - src:e2ca8f38fb2f#p207.4
  - src:e2ca8f38fb2f#p208.3
  decision: French authorities decide to maintain contact with Ho Chi Minh’s government and consider negotiations rather than
    rely solely on a French-backed alternative regime.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 19
  focus: The officials’ stated recommendation includes assistance to South Korea and action in the UN Security Council; they
    argue that delay could damage U.S. leadership and invite further challenges, while defeat of South Korea could harm U.S.
    standing in other regions. Treat this as the officials’ policy recommendation, not as evidence that the U.S. government
    adopted it; exclude operational planning.
  span_range:
  - src:e2ca8f38fb2f#p263.5
  - src:e2ca8f38fb2f#p263.6
  decision: U.S. diplomatic officials in Moscow recommended that the United States respond firmly and swiftly to North Korea’s
    offensive, rather than accept neutralization or delay its response.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 20
  focus: 'The decision point is the analysts’ estimate among the Soviet courses described: localize the conflict, prolong
    it through support to North Korea, widen it with incidents elsewhere, or begin global war. Treat the predicted short-run
    choice and the stated tradeoffs as an intelligence judgment; exclude operational details about how forces or support might
    be used.'
  span_range:
  - src:e2ca8f38fb2f#p281.8
  - src:e2ca8f38fb2f#p283.7
  decision: CIA analysts assess that the Soviet leadership will probably choose, at least in the short run, to prolong the
    Korean fighting without openly committing Soviet forces or creating similar incidents elsewhere.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The estimate weighs the potential gains of intervention against the risks of war with the United States, domestic
    strain, lost prospects for UN membership, and dependence on Soviet support. It concludes that full-scale intervention
    was not probable in 1950 absent a Soviet decision for global war, with continued covert assistance more likely; treat
    this as an analytic judgment, not a documented Chinese decision.
  span_range:
  - src:e2ca8f38fb2f#p322.5
  - src:e2ca8f38fb2f#p323.7
  decision: CIA analysts estimated whether China would intervene openly in Korea in 1950 or continue indirect assistance.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The passage identifies three Soviet courses and judges nonintervention the most likely, despite the risk of defeat
    in North Korea. The reasons include the danger of general war and the political and diplomatic costs of reversing the
    USSR’s prior position; this is an estimate of Soviet policy, not evidence that Soviet leaders made a recorded decision.
  span_range:
  - src:e2ca8f38fb2f#p311.4
  - src:e2ca8f38fb2f#p313.5
  decision: CIA analysts assessed whether the USSR would intervene militarily, pursue a diplomatic settlement, or refrain
    from intervention after the UN landing at Inchon in September 1950.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 23
  focus: The report attributes the return to the USSR’s desire to regain diplomatic and propaganda maneuverability, use the
    UN to obstruct action on Korea, and potentially lay groundwork for a settlement. It contrasts those aims with the costs
    of the boycott; treat the passage as an analytic account of Soviet policy, not a first-hand record of the Kremlin’s deliberations.
  span_range:
  - src:e2ca8f38fb2f#p300.4
  - src:e2ca8f38fb2f#p301.4
  decision: CIA analysts assessed why the USSR returned to the UN in August 1950 rather than continuing its boycott.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 24
  focus: 'Treat this as an estimative judgment between limited objectives and broader intervention: the assessment identifies
    reasons for a limited aim and warns that escalation remains possible. Exclude the military conduct of the intervention
    itself.'
  span_range:
  - src:e2ca8f38fb2f#p335.4
  - src:e2ca8f38fb2f#p335.5
  decision: CIA analysts assess that China’s intervention in Korea is limited in purpose rather than a commitment to full-scale
    intervention.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 25
  focus: Frame the decision as a choice between compromise within the coalition and taking power, with the assessment attributing
    the choice to the leadership’s belief that electoral victory required control of the police. Exclude the passage’s descriptions
    of how the seizure was carried out.
  span_range:
  - src:e2ca8f38fb2f#p358.4
  - src:e2ca8f38fb2f#p358.5
  decision: The Czechoslovak Communist leadership chooses to seize complete control rather than accept a compromise that would
    leave it without control of the police.
  content_domain: other:political_power
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 26
  focus: This is an estimative judgment between the alternatives of Soviet military action and no such action during 1948.
    The committee cited the preponderance of available evidence and the logic of the situation for its conclusion, while noting
    Soviet military readiness, potential strategic advantages, and the possibility that the Kremlin might interpret US actions
    as preparations to attack. Exclude operational military planning.
  span_range:
  - src:e2ca8f38fb2f#p371.4
  - src:e2ca8f38fb2f#p371.6
  decision: The joint ad hoc intelligence committee judged that the USSR was unlikely to resort to direct military action
    during 1948, while recognizing that it remained possible.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 27
  focus: 'The decision point is whether to continue the conference or suspend it amid violence in Bogotá and elsewhere in
    Colombia. The report gives reasons for continuing: the government was making progress restoring order, and uprisings outside
    the capital were limited and quickly controlled; it also records severe damage, loss of life, and continuing danger in
    the capital. Exclude the competing claims about responsibility for the revolt, which are not the delegation leaders’ decision.'
  span_range:
  - src:e2ca8f38fb2f#p376.4
  - src:e2ca8f38fb2f#p376.4
  decision: The US delegation leaders in Bogotá favored continuing the conference unless conditions made it physically impossible.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 28
  focus: This is an analytic choice between the government’s alleged Communist-plot explanation and an account in which the
    revolt began spontaneously after Gaitán’s assassination, with Communists encouraging violence afterward. The CIA assessment
    explicitly favors the latter, citing the weight of available evidence. Exclude the separate, unsubstantiated claims about
    the assassin and arrests as decisions; they are reported allegations, not the basis of a stated decision by an identified
    decider.
  span_range:
  - src:e2ca8f38fb2f#p376.4
  - src:e2ca8f38fb2f#p376.5
  decision: The CIA analysts judged that Colombia’s Communists did not instigate the revolt but encouraged mob action after
    it began.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 29
  focus: The analytic choice is between interpreting the appeal as concern about U.S. aid and Nationalist strength, or as
    an effort to stop hostilities, enable Communist political influence, and gain propaganda benefits through mediation. Include
    the CIA’s stated considerations; exclude any operational conduct of the civil war.
  span_range:
  - src:e2ca8f38fb2f#p416.4
  - src:e2ca8f38fb2f#p417.3
  decision: CIA analysts decide how to assess the Soviet ambassador’s appeal to end the Chinese civil war.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 30
  focus: The memorandum favors an assessment of uneven and incomplete recovery over the aggregate production claim, while
    also judging that the state-controlled economy and emphasis on capital goods limit the effect of those weaknesses on Soviet
    policy. Treat this as an analytic judgment, not a decision by policymakers about export controls or trade concessions.
  span_range:
  - src:e2ca8f38fb2f#p447.7
  - src:e2ca8f38fb2f#p448.4
  decision: CIA analysts assess whether Soviet economic recovery is as strong as the USSR claims and whether economic constraints
    will alter Soviet policy.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 31
  focus: The passage favors the latter interpretation, citing the establishment of a separate eastern regime, the creation
    of a Communist ‘rump’ government, and the resulting obstacles to settlement. Include the analysts’ assessment of likely
    political consequences; exclude any framing of predicted service disruptions as a decision about how to cause them.
  span_range:
  - src:e2ca8f38fb2f#p451.5
  - src:e2ca8f38fb2f#p452.5
  decision: CIA analysts assess whether Soviet participation in Berlin currency negotiations reflects a genuine effort to
    settle the dispute or an effort to consolidate Soviet influence and increase pressure on the Western powers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
