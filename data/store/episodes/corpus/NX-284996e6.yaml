  focus: The President suggested making the assessment public, leaving the method to the Director. The Agency’s stated reasons
    included informing the public, supporting US policy against extending long-term credits to the USSR, the possibility of
    declassifying the report without changing its substance, and improving its prominence through CIA attribution. Exclude
    the later press conference, which was a separate response to reporters’ demand for equal briefing.
