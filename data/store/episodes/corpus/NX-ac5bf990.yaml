episodes:
- n: 1
  focus: The decision point is the adoption and review of common analytic standards, including requiring analysts to show
    their evidentiary basis. The account ties the reform to analytic failures and describes its intended rigor and accountability,
    while noting concerns about slower review and excessive emphasis on evidence; exclude broader training and cultural-change
    recommendations.
  span_range:
  - src:94fc04cc11d3#p18.6
  - src:94fc04cc11d3#p19.5
  decision: The DNI and IC leaders decide whether to standardize analytic work through mandatory analytic and sourcing requirements
    rather than leave tradecraft to existing practices.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the proposal to make broad access in each other’s intelligence facilities routine and to remove
    equivalent NOFORN restrictions. The author weighs efficiency, flexibility, productivity, and trust against compromise
    risk and acknowledges legal impediments; exclude implementation details about intelligence operations or access systems.
  span_range:
  - src:94fc04cc11d3#p15.3
  - src:94fc04cc11d3#p15.5
  decision: The DNI and Five Eyes intelligence leaders decide whether to retain exceptional, restricted access or normalize
    broader reciprocal access for partner intelligence officers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to act promptly through executive authority or wait for legislation, and which commission
    recommendations to implement. Include the creation of NCTC, compelled information sharing, civil-liberties safeguards,
    and strengthened leadership authority; exclude operational details of intelligence work.
  span_range:
  - src:94fc04cc11d3#p24.4
  - src:94fc04cc11d3#p24.10
  decision: The President chose to use executive orders to implement key 9/11 Commission intelligence reforms while Congress
    considered legislation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision is whether to retain the DNI’s existing authorities or strengthen them through an amendment to the governing
    executive order. Include the stated aim of strengthening the DNI’s position in foreseeable disputes; exclude operational
    intelligence activities.
  span_range:
  - src:94fc04cc11d3#p24.16
  - src:94fc04cc11d3#p25.2
  decision: The President chose to revise Executive Order 12333 to expand the DNI’s authority over agency leadership, major
    DoD acquisitions, and disputes with cabinet secretaries.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to centralize intelligence in a new department or domestic agency, or retain the existing
    department-linked structure and authorities. The account connects that choice to limiting centralized power and lessons
    from past intelligence abuses; exclude operational collection methods.
  span_range:
  - src:94fc04cc11d3#p30.3
  - src:94fc04cc11d3#p34.6
  decision: Congress chose in the IRTPA to preserve a confederated intelligence system rather than create a Department of
    Intelligence or a domestic intelligence agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision was a compromise between supplying NCTC with analysts and protecting their long-term career paths while
    NCTC lacked its own career service. Keep the focus on staffing and institutional interests; exclude operational intelligence
    work.
  span_range:
  - src:94fc04cc11d3#p39.3
  - src:94fc04cc11d3#p39.4
  decision: The CIA agreed to assign newly hired analysts to NCTC for initial two-year tours, after which they would return
    to CIA.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether and how to examine the Directorate’s prior analytic work, including the review group’s
    remit and the reasons for reassessing the analytic process. Exclude the underlying intelligence collection and any operational
    details.
  span_range:
  - src:94fc04cc11d3#p42.4
  - src:94fc04cc11d3#p42.5
  decision: The CIA Directorate of Intelligence leadership initiated an internal review of the Iraq WMD analysis after the
    intelligence failure.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to pursue and report the inquiry despite personal and professional risks, weighing
    the ombudsperson’s responsibilities against those risks. Keep the focus on oversight, analytic objectivity, and accountability;
    exclude any unrelated election analysis details.
  span_range:
  - src:94fc04cc11d3#p50.5
  - src:94fc04cc11d3#p50.9
  decision: The DNI’s analytic ombudsperson pursued an inquiry into alleged politicization and brought its findings to the
    Senate intelligence committee.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
