episodes:
- n: 1
  focus: The account says they believed they had to stay until the front advanced, to help the Army by continuing to cut supply
    lines. Treat this as a decision about whether to continue the mission in the area; exclude the operational methods used
    to disrupt routes.
  span_range:
  - src:c005c2e2acf0#p9.4
  - src:c005c2e2acf0#p9.4
  decision: The OSS officer and mission team decided to remain in Carnia rather than leave as the military situation worsened.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The account lays out several possible routes and explains why snow, enemy control, and the risks made them unattractive;
    it identifies waiting for the war to end as the best option. Focus on the choice among escape or waiting, not on travel
    or evasion techniques.
  span_range:
  - src:c005c2e2acf0#p11.5
  - src:c005c2e2acf0#p11.6
  decision: The isolated Allied officer decided to wait for the war to end rather than attempt an immediate escape from the
    Alps.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The account describes his initial refusal, assurances that the information would not reach American authorities,
    and the threat that he would not be sent to an officers’ prisoner-of-war camp unless he disclosed it. Focus on the ethical
    and legal choice under captivity and pressure; exclude the intelligence details disclosed.
  span_range:
  - src:c005c2e2acf0#p30.1
  - src:c005c2e2acf0#p31.1
  decision: The captured Allied officer decided to disclose mission information to his captors during interrogation.
  content_domain: other:law-of-war
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The deposition reports that the section chief said he wanted to get rid of the prisoner and then ordered subordinates
    to retrieve him; it also describes the killing. Treat the decision as an alleged unlawful custody decision, not as a legitimate
    policy choice, and exclude the method of killing, concealment, and other operational details.
  span_range:
  - src:c005c2e2acf0#p33.6
  - src:c005c2e2acf0#p34.4
  decision: The Gestapo section chief chose to order the killing of the Allied prisoner rather than retain, release, or transfer
    him.
  content_domain: other:detainee treatment
  refusal_sensitivity: high
  held_out: false
  natsec: false
