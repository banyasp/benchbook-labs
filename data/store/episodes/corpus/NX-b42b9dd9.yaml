- n: 1
  focus: The decision point is Congress’s choice between stronger centralization under the DNI and preserving departmental
    prerogatives, resulting in a compromise that included section 1018. Include the competing institutional interests and
    the authority structure chosen; exclude later implementation disputes except where they explain the compromise.
  span_range:
  - src:385939070a42#p2.3
  - src:385939070a42#p2.7
  decision: Congress chose a compromise in the 2004 Intelligence Reform and Terrorism Prevention Act that created a DNI with
    increased authority while preserving department heads’ statutory responsibilities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the President’s choice to revise the order after agencies used section 1018 to argue that ODNI
    initiatives impinged on departmental prerogatives and to decline participation. Include the legal-authority dispute and
    the revision’s effect; exclude operational intelligence methods.
  span_range:
  - src:385939070a42#p3.5
  - src:385939070a42#p3.9
  decision: The President revised Executive Order 12333 in July 2008 to limit who could invoke section 1018’s protection of
    departmental authorities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
