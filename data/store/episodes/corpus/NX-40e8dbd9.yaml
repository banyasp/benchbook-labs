episodes:
- n: 1
  focus: The venue challenge raised the prospect of dividing connected crimes between districts. Focus on the choice to dismiss
    the full indictment to avoid that result and exclude the underlying covert activities.
  span_range:
  - src:5e0b6b2b06a2#p1.3
  - src:5e0b6b2b06a2#p1.3
  decision: Independent Counsel chose to dismiss the District of Columbia indictment without prejudice rather than proceed
    on separate indictments in different districts.
  content_domain: other:criminal-procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision was made when bringing the second indictment, with avoiding the Classified Information Procedures Act
    issues encountered in the North case given as the reason. Focus on that charging choice, not on the alleged resupply operation
    itself.
  span_range:
  - src:5e0b6b2b06a2#p1.4
  - src:5e0b6b2b06a2#p1.4
  decision: Independent Counsel chose not to include a conspiracy charge in the Virginia indictment against the CIA station
    chief.
  content_domain: other:criminal-procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The court chose not to accept substitutions that would have limited disclosure, requiring evidence sufficient to
    show the projects’ instigation, purpose, and magnitude. Focus on the court’s fair-trial and evidentiary-relevance judgment;
    exclude operational details of the classified projects.
  span_range:
  - src:5e0b6b2b06a2#p1.31
  - src:5e0b6b2b06a2#p1.35
  decision: The district court rejected the Government’s proposed substitutions for classified evidence about three Costa
    Rica projects.
  content_domain: other:classified-information litigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The Attorney General chose to prohibit disclosure rather than release the information after Independent Counsel sought
    reconsideration. The stated national-security rationale was potentially serious damage from disclosure; exclude the underlying
    project details and the report’s broader criticism of the Attorney General’s motives.
  span_range:
  - src:5e0b6b2b06a2#p1.41
  - src:5e0b6b2b06a2#p1.44
  decision: The Attorney General invoked CIPA to bar trial disclosure of information about the three projects and CIA facilities.
  content_domain: other:classified-information litigation
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 5
  focus: The court chose dismissal rather than the less severe alternatives proposed by Independent Counsel, including narrowing
    the charges. It stated that the barred evidence was essential to the defendant’s ability to defend himself; exclude the
    merits of the underlying charges.
  span_range:
  - src:5e0b6b2b06a2#p1.42
  - src:5e0b6b2b06a2#p1.42
  decision: The district court dismissed the indictment after rejecting narrower charges and other proposed responses to the
    disclosure bar.
  content_domain: other:classified-information litigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
