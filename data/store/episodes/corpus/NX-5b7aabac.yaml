  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 20
  focus: The decision was whether to place PARU personnel in a new joint organization supervised by the army, partly to reassure
    the Prime Minister, rather than absorb or leave the unit unchanged. The account says the arrangement was established and
    that most of PARU remained under its existing control; exclude tactical or intelligence-gathering methods.
  span_range:
  - src:0d080a5a212a#p118.8
  - src:0d080a5a212a#p119.5
  decision: The Prime Minister establishes a mixed army-PARU unit under army supervision while retaining PARU as a separate
    unit.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The decision point is whether to authorize the full proposed program, begin at a smaller scale, or decline support.
    The passage ties the staged authorization to performance and urgency after the Hmong lost the Plain of Jars; exclude the
    logistics and methods of supplying the force.
  span_range:
  - src:0d080a5a212a#p143.3
  - src:0d080a5a212a#p144.3
  decision: Headquarters and the Executive Branch approve an initial force of 1,000 Hmong volunteers rather than the proposed
    10,000, with expansion contingent on the first group’s performance.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 22
  focus: The decision point is whether to proceed despite the narrow window before a possible enemy attack or delay until
    conditions are safer. The chief accepts the risk based on the local commander’s estimate that volunteers could be assembled
    and the enemy would need at least three days to attack; exclude the subsequent movement and air-transport details.
  span_range:
  - src:0d080a5a212a#p144.7
  - src:0d080a5a212a#p145.2
  decision: The station chief accepts the risk of proceeding with the Ban Pa Dông training plan on a very tight schedule.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 23
  focus: The decision point is whether to arm the group despite the commander’s warning about its reliability and the absence
    of positive evidence that its leader supports the Pathet Lao. The passage describes the competing judgment and the serious
    consequences; exclude the mechanics of the subsequent attack and reprisal.
  span_range:
  - src:0d080a5a212a#p156.6
  - src:0d080a5a212a#p157.2
  decision: The senior Hmong commander reluctantly authorizes weapons support for a Lao Theung group despite his reservations,
    after a CIA field officer urges approval.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 24
  focus: 'The decision point is how to staff the expanding program: attach Americans to every team or rely more on Thai personnel
    with selective American oversight. The passage gives reasons concerning cultural competence, continuity of Thai involvement,
    and the risk of Americans taking over, while also explaining why some American presence remained necessary; exclude individual
    staffing assignments and operational procedures.'
  span_range:
  - src:0d080a5a212a#p157.3
  - src:0d080a5a212a#p157.6
  decision: The CIA program leadership chooses to keep the American presence limited and rely principally on PARU personnel,
    while retaining American field representation and monitoring.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 25
  focus: The officer recognized that government approval was theoretically required, but assigned responsibility to the Hmong
    commander and proceeded amid urgency and bureaucratic delay. Frame the choice around sovereignty, authorization, and urgency;
    exclude the communications training methods.
  span_range:
  - src:0d080a5a212a#p160.5
  - src:0d080a5a212a#p160.7
  decision: The CIA field officer chose to send Laotian trainees to Thailand without first securing Laotian government approval.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 26
  focus: The passage contrasts step-by-step coordination with proceeding under a broad reading of the general’s endorsement,
    given the perceived urgency of contesting a communist advance and the risk of government paralysis. Focus on the scope
    of authorization and policy judgment; exclude subsequent military activities.
  span_range:
  - src:0d080a5a212a#p161.3
  - src:0d080a5a212a#p161.4
  decision: The ambassador and CIA leadership chose to treat the Laotian general’s approval in principle as broad authority
    for the Hmong program, rather than coordinate each step with the government.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 27
  focus: The CIA field officer preferred excluding the military because he expected its involvement to inhibit local leadership;
    his colleague argued that some role was needed to preserve military logistical support and forestall a transfer of the
    program. The resulting assignment was a compromise. Exclude the advisers’ training activities and other operational details.
  span_range:
  - src:0d080a5a212a#p161.5
  - src:0d080a5a212a#p162.2
  decision: The CIA station leadership chose to accommodate a limited US Special Forces role with the Hmong irregulars.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 28
  focus: The leaders faced a worsening threat, with the half-trained Hmong unable to repel a frontal attack and the advisers
    at risk of death or capture. They ordered withdrawal rather than hold the position. Focus on the command choice and its
    risks; exclude the subsequent pickup details.
  span_range:
  - src:0d080a5a212a#p170.6
  - src:0d080a5a212a#p171.2
  decision: The CIA and PARU field leadership ordered the withdrawal of the volunteers and advisers from Ban Sancho as enemy
    forces encircled the position.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 29
  focus: The Hmong commander initially resisted abandoning the position because of its symbolic importance and its connection
    to his authority, while the advisers urged withdrawal and evacuation of dependents. The attack and loss of air access
    changed the decision; the group then organized a withdrawal. Exclude details of the rear guard and movement.
  span_range:
  - src:0d080a5a212a#p173.2
  - src:0d080a5a212a#p173.5
  decision: The Hmong commander and his advisers chose to abandon Pa Dông temporarily and withdraw after the enemy assault
    made continued occupation untenable.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 30
  focus: The decision addressed the vulnerability of fixed command posts and the hardship of repeatedly moving combatants’
    families. The leaders considered alternative sites and chose a command location and a separate refuge/support center to
    balance security, military capacity, and civilian needs. Exclude site-specific operational characteristics and logistical
    methods.
  span_range:
  - src:0d080a5a212a#p174.2
  - src:0d080a5a212a#p175.5
  decision: The CIA field officer and Hmong leadership chose a dispersed command-and-refuge arrangement, selecting Long Tieng
    as the command post and Sam Thong as a civilian support center.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 31
  focus: The decision balanced the agreement and pressure for total withdrawal against concern that a complete departure would
    damage Hmong morale. The passage also describes how the two roles were divided to preserve the relationship with the Hmong
    commander. Focus on the exception and its rationale; exclude covert-presence methods.
  span_range:
  - src:0d080a5a212a#p178.4
  - src:0d080a5a212a#p178.8
  decision: US policymakers chose to leave two advisers at Long Tieng after the Geneva withdrawal deadline, restricting their
    role and location rather than withdrawing every American.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 32
  focus: The decision was whether to halt or continue the training and send additional trainees after the agreement. The stated
    legal interpretation overcame anticipated objections. Focus on the agreement’s scope and the authorization decision; exclude
    training content and the separate ammunition stockpiling decision.
  span_range:
  - src:0d080a5a212a#p179.1
  - src:0d080a5a212a#p179.2
  decision: US policymakers approved continued training of Laotian specialists abroad, interpreting the Geneva agreements
    as barring foreign troops and advisers but not Laotian military personnel returning from abroad.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 33
  focus: The prime minister sought to replace PARU by transferring its personnel into an army unit, while PARU and its parent
    ministry resisted full integration because army practices were incompatible with PARU’s approach and the army lacked arrest
    authority. A hybrid unit was proposed, and the legal issue helped block full integration. Focus on the institutional and
    legal decision; exclude operational doctrine and training details.
  span_range:
  - src:0d080a5a212a#p180.7
  - src:0d080a5a212a#p181.3
  decision: The Thai and US program leadership chose a hybrid arrangement rather than fully integrating PARU personnel into
    the Thai army unit proposed by the prime minister.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 34
  focus: The decision point is how to limit US military involvement in Laos while addressing MACV’s demand for a larger role.
    Focus on the Geneva agreements, the desired low profile, and the competing concern about North Vietnamese use of the corridor;
    exclude operational plans for attacking the trail.
  span_range:
  - src:0d080a5a212a#p188.4
  - src:0d080a5a212a#p189.3
  decision: Washington and the ambassador decide to keep most US operations in Laos under CIA management rather than give
    MACV a larger military role.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 35
  focus: Treat this as a decision about whether to use force and how to act within the stated policy restriction, including
    the choice to request a strike through a non-US military channel. Exclude the strike’s execution details and the later
    proposed road-cratering operation.
  span_range:
  - src:0d080a5a212a#p191.4
  - src:0d080a5a212a#p191.5
  decision: Washington decides to authorize an airstrike against a bridge in northern Laos despite restrictions on US Air
    Force strikes there.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 36
  focus: The decision point is whether to insist on the requested relief effort or accept the Hmong commander’s refusal. Focus
    on the force’s limited ability to reach the area and the risk of committing it to what appeared to be a doomed operation;
    exclude tactical details.
  span_range:
  - src:0d080a5a212a#p197.3
  - src:0d080a5a212a#p197.4
  decision: The CIA paramilitary operations manager decides not to press the Hmong commander to send forces to relieve the
    Ban Nambak garrison.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 37
  focus: The manager could abandon the request or pursue it through the chain of command; instead, he persisted and arranged
    acceptance without involving senior military or CIA officials. He cites his belief in the pilots’ capability and the example
    of Vietnamese students who had also faced low expectations but succeeded; exclude the subsequent details of training and
    combat missions.
  span_range:
  - src:0d080a5a212a#p202.3
  - src:0d080a5a212a#p202.4
  decision: The CIA Laos program manager decides to secure places for two Hmong pilots in a military aviation training program
    through an informal arrangement.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 38
  focus: The manager could have raised refuge planning with Hmong leadership or his superiors, but says he did not do so,
    even as the conflict intensified. The passage gives reasons including concern for Hmong morale, aversion to contemplating
    defeat, and uncertainty about the outcome in South Vietnam; exclude later refugee-relief decisions.
  span_range:
  - src:0d080a5a212a#p203.4
  - src:0d080a5a212a#p203.6
  decision: The CIA Laos program manager decides not to actively pursue contingency planning for Hmong refuge.
  content_domain: other:refugee-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 39
  focus: The prime minister viewed the former leaders’ continuing military prestige as a threat to civilian authority and
    accepted an officer’s offer to persuade them to leave, aiming to avoid a mutiny. The account says resignation alone was
    considered insufficient to ensure a bloodless end to unrest; exclude the intermediary’s personal career calculations except
    as context for the offer.
  span_range:
  - src:0d080a5a212a#p206.3
  - src:0d080a5a212a#p206.7
  decision: The incoming Thai prime minister decides to seek the former Thai leaders’ exile and accepts a senior army officer
    as intermediary.
  content_domain: other:government-transition-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 40
  focus: With repatriation not feasible and permanent settlement unacceptable to Thailand, the Thai National Security Council
    chairman sought a temporary arrangement that would let refugees become self-sufficient while awaiting emigration. The
    prime minister agreed to fund land purchase and press the United States for housing and sanitation assistance; exclude
    the operational details of relief delivery.
  span_range:
  - src:0d080a5a212a#p208.3
  - src:0d080a5a212a#p208.5
  decision: The Thai prime minister decides to provide temporary land and public funding for Hmong refugees while pressing
    the United States to support relief.
  content_domain: other:refugee-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
