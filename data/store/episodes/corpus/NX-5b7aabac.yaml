episodes:
- n: 1
  focus: The decision is whether to treat Thailand as an enemy or preserve the possibility of working with anti-Japanese Thai.
    Focus on the president’s policy choice and its stated rationale; exclude the later intelligence and resistance activities.
  span_range:
  - src:0d080a5a212a#p23.4
  - src:0d080a5a212a#p23.4
  decision: The US president decides not to reciprocate Thailand’s declaration of war and to treat it as issued under Japanese
    duress.
  content_domain: other:wartime diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision concerns whether to institutionalize the existing instructor cadre as a mobile reserve and which service
    should house it. Focus on the stated security concerns, police authority, and treaty constraint; exclude operational methods
    and tactical employment.
  span_range:
  - src:0d080a5a212a#p19.6
  - src:0d080a5a212a#p20.8
  decision: The Thai National Police director general decides to establish a mobile police reserve within the police, rather
    than leave the cadre provisional or place the capability in the army.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision was to embed the program in police detachments working among the population, instead of using an army
    concentrated in garrisons; the United States would provide logistical and training support. Focus on the institutional
    choice and its rationale, not on the operational methods of resistance.
  span_range:
  - src:0d080a5a212a#p41.5
  - src:0d080a5a212a#p41.5
  decision: Thai leadership chose the National Police, rather than the army, as the institution for the resistance program.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The advisers decided to include a unit explaining the perceived threat of international communism and Chinese domination,
    rather than relying only on practical instruction. The passage says they wanted trainees to understand why resistance
    mattered and that the instruction appeared to motivate them; exclude the instructional techniques themselves.
  span_range:
  - src:0d080a5a212a#p44.2
  - src:0d080a5a212a#p44.3
  decision: The American training advisers chose to add instruction on communism and the stakes of Thai independence to the
    course.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: After the first course, the police chief chose to keep ten graduates as the cadre and return the other forty to their
    districts. The passage identifies the cadre’s importance to making the Thai-run program sustainable; focus on this staffing
    and program-development decision, not on the graduates’ later combat activities.
  span_range:
  - src:0d080a5a212a#p44.6
  - src:0d080a5a212a#p46.8
  decision: The Thai police chief authorized the training program to retain its ten best graduates as a permanent instructor
    cadre.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: A senior police student had pressured the camp commander to dismiss an instructor for enforcing camp rules. The advisers
    used the required graduation certification, and the possibility of reporting the matter to the police chief, to secure
    the student’s compliance and restore the instructor; focus on rank, discipline, and program integrity, not on covert methods.
  span_range:
  - src:0d080a5a212a#p49.4
  - src:0d080a5a212a#p49.7
  decision: The senior American training adviser and the Thai camp commander chose to reinstate a low-ranking instructor and
    make the senior student’s graduation depend on correcting his disciplinary breach.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The officer faced the prospect of the cadre being dispersed or dissolved and proposed preserving it as a small unit
    to monitor and respond to external threats. Focus on the policy choice to create the unit and the proposed division of
    responsibilities and resources; exclude any later operational methods.
  span_range:
  - src:0d080a5a212a#p54.3
  - src:0d080a5a212a#p55.2
  decision: The U.S. security officer at Lop Buri chose to propose converting the training cadre into a Thai border-security
    unit.
  content_domain: other:security-assistance policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 8
  focus: The officers and station chief raised questions about legality and security risks from joining a foreign security
    service; Headquarters chose to permit the appointments, with any police emoluments reverting to the U.S. government. Focus
    on the agency’s authority and national-interest judgment, not on the officers’ subsequent work.
  span_range:
  - src:0d080a5a212a#p60.2
  - src:0d080a5a212a#p60.3
  decision: CIA Headquarters authorized two CIA officers to accept commissioned appointments in the Thai National Police.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision was to undertake a coercive law-enforcement operation rather than forgo it; the stated reasons included
    testing the new unit and demonstrating its utility, as well as addressing illegal trafficking that supported official
    bribery. Treat it only as a decision to authorize the operation; exclude intelligence collection, target selection, approach,
    tactics, and execution details.
  span_range:
  - src:0d080a5a212a#p69.3
  - src:0d080a5a212a#p69.7
  decision: The Thai unit commander and U.S. adviser, with police and CIA approval, chose to conduct a counternarcotics operation
    against illicit traffickers.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 10
  focus: The director general was angry about the member’s unprofessional conduct but chose a lesser personnel sanction after
    the U.S. adviser reported that he had not knowingly participated for profit and emphasized his leadership abilities. Focus
    on the accountability and proportionality judgment; exclude unrelated operational history.
  span_range:
  - src:0d080a5a212a#p66.7
  - src:0d080a5a212a#p67.3
  decision: The Thai National Police director general chose to transfer a unit member to the Provincial Police rather than
    cashier him after an opium-transport incident.
  content_domain: other:personnel accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The adviser had to decide how to dispose of reward money despite rules against double compensation and uncertainty
    about whether the Treasury would accept proceeds from a foreign police raid. He chose unit support, though the animals
    proved unsuitable for the lowland terrain; exclude the later assessment of their use as a separate decision.
  span_range:
  - src:0d080a5a212a#p72.3
  - src:0d080a5a212a#p72.4
  decision: The American adviser chose to use his reward share to support the unit, buying pack animals for an experiment
    rather than using the money personally or returning it to the Treasury.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 12
  focus: After the incumbent commander died, the adviser sought a capable long-term successor but anticipated resistance because
    his preferred candidate was too junior. The compromise addressed protocol while assigning operational leadership to the
    junior officer; the medical officer agreed to serve in the formal role until the captain’s promotion. Exclude the candidate’s
    training methods and later performance.
  span_range:
  - src:0d080a5a212a#p73.7
  - src:0d080a5a212a#p75.2
  decision: The American adviser recommended a junior captain for leadership, and the Thai police general approved a command
    arrangement with a major as formal commander and the captain leading operations and training.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 13
  focus: Neither the Thai police nor CIA management had issued detailed mission orders, and their guidance emphasized different
    objectives. The two leaders agreed that border security was legitimate and important while also accepting the unit’s potential
    role beyond Thailand, so they could serve both principals. Exclude the operational details of training or any specific
    deployment.
  span_range:
  - src:0d080a5a212a#p75.6
  - src:0d080a5a212a#p76.3
  decision: The American adviser and the unit commander chose to align the unit’s mission with both Thai border-security priorities
    and the US interest in possible deployment outside Thailand.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 14
  focus: The physician faced a specific request to leave camp for a seriously ill person while other villages also needed
    care. He declined, reasoning that the demand exceeded what he could provide; the episode presents an allocation choice
    between responding to this request and preserving limited capacity for others. Exclude medical diagnosis or treatment
    details.
  span_range:
  - src:0d080a5a212a#p95.3
  - src:0d080a5a212a#p95.4
  decision: The unit physician declined to travel to a distant village to treat a seriously ill woman because the clinic could
    not meet every request for aid.
  content_domain: other:medical aid allocation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: The decision point is whether to assist a foreign mission based on the belief that it serves a legitimate Cold War
    purpose and will not harm Thai interests, despite the risk of bypassing normal Thai approval. Exclude the arrangements
    for carrying out the mission; focus on authority, consent, and the interests weighed.
  span_range:
  - src:0d080a5a212a#p98.5
  - src:0d080a5a212a#p99.5
  decision: The U.S. field adviser and Thai unit commander decide whether to support a U.S. supply mission without notifying
    Thai authorities of its purpose.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The decision point is whether to act on an urgent foreign request while the new government may view uncoordinated
    movements with suspicion, or first obtain Thai approval. The passage states that they waited for authorization; exclude
    the deployment method and subsequent investigation.
  span_range:
  - src:0d080a5a212a#p115.9
  - src:0d080a5a212a#p116.5
  decision: The Thai unit commander and U.S. field adviser decide to seek Thai authorization before responding to the embassy’s
    request about the silent radar site.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 17
  focus: The decision point is whether to use conventional police recruits and training or obtain an exception for direct
    recruitment in border areas and a unit-run program. The stated rationale is the need for recruits with local aptitudes
    and knowledge and for unit ethos to be instilled from the outset; exclude the later recruiting campaign’s mechanics.
  span_range:
  - src:0d080a5a212a#p107.3
  - src:0d080a5a212a#p107.6
  decision: The unit’s U.S. adviser and Thai commander seek the police chief’s approval to bypass standard police recruiting
    and training procedures for the unit.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 18
  focus: The decision was whether to provide Thai army teams or PARU teams for the requested support role. The account gives
    the urgent timetable—about 30 days for army teams versus the next day for PARU teams—and the Prime Minister’s desire for
    action; exclude the teams’ operational methods.
  span_range:
  - src:0d080a5a212a#p134.3
  - src:0d080a5a212a#p134.8
  decision: The Prime Minister authorizes PARU teams, rather than Thai army personnel, to accompany Phoumi’s battalions in
    Laos.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 19
  focus: The decision was whether to release funds technically belonging to the Lao government to a faction in rebellion,
    or withhold them. The account cites the troops’ unpaid status and their need to be paid to fight; exclude the mechanics
    of the transfer.
  span_range:
  - src:0d080a5a212a#p132.2
  - src:0d080a5a212a#p132.3
  decision: Washington authorizes using part of the Lao government’s kip held in Bangkok to pay Phoumi’s forces.
