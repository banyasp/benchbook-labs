  focus: The decision point is whether to give a single summary figure for the two economies despite the divergent results
    from the two price systems. The article describes the geometric mean as the established choice and argues that it is a
    rough, useful comparison under an intermediate-output-pattern assumption; exclude the broader recommendation to focus
    policy analysis on separate economic sectors, which is not a specific decision.
