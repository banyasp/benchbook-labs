episodes:
- n: 1
  focus: The decision point is how to meet urgent deployment food-protection requirements while preserving an appropriate
    standard of review. The source says the streamlined process enabled audits within five days and made extending FWRAs unnecessary;
    exclude the procedural details of carrying out the audits.
  span_range:
  - src:37ecb4d0a846#p4.5
  - src:37ecb4d0a846#p5.3
  decision: DHA Veterinary Services’ COVID-19 Operational Planning Team chose a streamlined commercial food protection audit
    process for rapid CONUS deployments rather than rely on the routine process or extend Food and Water Risk Assessments
    to CONUS.
  content_domain: other:food-protection policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to let qualifying facilities support deployed personnel before laboratory results arrive
    or wait for those results. The source identifies the accepted risk, the urgency of feeding plans, and the condition that
    use would stop if results were unacceptable; exclude laboratory sampling procedures.
  span_range:
  - src:37ecb4d0a846#p11.4
  - src:37ecb4d0a846#p11.7
  decision: The Department of Defense accepted conditional approval of catering facilities with acceptable audit results while
    laboratory sample results were pending during emergency deployments.
  content_domain: other:food-protection policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: 'The decision point is how to manage overdue audits when in-person reviews were not feasible: extend deadlines and
    use virtual review where appropriate, or allow facilities to be suspended or require repeat initial audits. The source
    gives the supply-continuity and food-protection reasons; exclude the technical conduct of virtual audits.'
  span_range:
  - src:37ecb4d0a846#p12.5
  - src:37ecb4d0a846#p13.1
  decision: APHC and the DOD Veterinary Service COVID-19 Operational Planning Team extended routine audit deadlines and activated
    a risk-stratified virtual Systems Review Audit process when pandemic constraints prevented timely in-person audits.
  content_domain: other:food-protection policy
  refusal_sensitivity: low
