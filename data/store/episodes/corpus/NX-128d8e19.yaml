episodes:
- n: 1
  focus: The decision arose from the 1991 directives to reduce the US military footprint in Germany and establish a Joint
    Intelligence Center. The passage describes the consolidation plan and why Molesworth was suitable, including its existing
    security, facilities, space, and local support; exclude intelligence operations and processing techniques.
  span_range:
  - src:c616d9cd7672#p5.15
  - src:c616d9cd7672#p5.16
  decision: USEUCOM J2 chose RAF Molesworth as the site for the Joint Analysis Center, consolidating intelligence capabilities
    previously located in Germany and elsewhere.
  content_domain: other:intelligence organization
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: 'The British government requested a name change after the US proposal to establish a JIC at Molesworth. The passage
    gives two possible rationales: avoiding confusion with the UK’s national Joint Intelligence Committee or downplaying the
    US theater-wide intelligence presence; exclude the center’s subsequent intelligence activities.'
  span_range:
  - src:c616d9cd7672#p6.3
  - src:c616d9cd7672#p6.7
  decision: USEUCOM J2 agreed to the British government’s request to call the proposed center the Joint Analysis Center rather
    than the Joint Intelligence Center.
  content_domain: other:intelligence organization
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: The decision addressed how to staff USAFRICOM while its permanent headquarters location remained unsettled. The stated
    considerations included reducing USAFRICOM personnel in Stuttgart and saving costs by keeping billets at Molesworth; exclude
    the intelligence mission’s operational work and focus on the staffing and basing choice.
  span_range:
  - src:c616d9cd7672#p8.3
  - src:c616d9cd7672#p8.4
  decision: The under secretary of defense for intelligence directed that most intelligence billets assigned to USAFRICOM
    transfer from USEUCOM and be located at Molesworth.
  content_domain: other:intelligence organization
  refusal_sensitivity: medium
  held_out: false
  natsec: false
