  focus: The decision point is how to handle materials about allegations that came to the Commission’s attention after its
    inquiry began, when time did not permit a full investigation before the report deadline. The President requested the materials,
    and the Commission turned them over. Exclude the underlying alleged plans and any operational details.
  span_range:
