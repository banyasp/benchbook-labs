- n: 1
  focus: The decision point is whether to commit ground troops after the invasion and the rapid retreat of South Korean forces;
    the President chose to do so under the UN response. The passage cites the invasion, the assessment that it was Soviet-orchestrated,
    and the appeal to assist South Korea; exclude later battlefield command and tactics.
  span_range:
  - src:be005480ccd7#p11.8
  - src:be005480ccd7#p12.3
  decision: The President commits US ground forces to Korea after the North Korean invasion.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The President chose a change in agency leadership rather than leaving the incumbent in place, as a first step toward
    reform. The stated rationale was the absence of a definitive prediction and clear warning, despite the incumbent’s claim
    that warnings had been given; exclude the successor’s later operational reforms.
  span_range:
  - src:be005480ccd7#p12.5
  - src:be005480ccd7#p12.6
  decision: The President replaces the Director of Central Intelligence after the Korean intelligence failure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The analytic decision is whether to assess full-scale Chinese intervention as likely; the Office assessed that it
    was not probable despite statements, troop movements, and propaganda charges that raised concern. Focus on the estimate
    and its stated reasoning, not on collection methods or subsequent military events.
  span_range:
  - src:be005480ccd7#p15.3
  - src:be005480ccd7#p15.4
  decision: The Office of Research and Estimates judges that full-scale Chinese intervention in Korea is not probable in 1950.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The choice is whether to continue the northward advance or halt after Chinese forces have attacked UN units; the
    commander orders the advance after a pause to regroup. The passage places the order in the context of the UN hope that
    a final push would end the war and reunify Korea; do not infer additional reasons or assess the operational execution.
  span_range:
  - src:be005480ccd7#p29.5
  - src:be005480ccd7#p31.4
  decision: The Far East Command commander orders the UN advance north to resume toward the Yalu after the Chinese First Phase
    Offensive.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The assessment weighs conquest against not pursuing it, recognizing potential diplomatic and strategic gains but
    concluding that grave risks make the course inadvisable at that time. Treat this as an intelligence assessment or policy
    judgment, not as evidence that policymakers adopted the conclusion; exclude operational planning details.
  span_range:
  - src:be005480ccd7#p41.2
  - src:be005480ccd7#p43.4
  decision: The CIA assessment authors conclude that a UN military conquest of all Korea is too risky under the circumstances
    described in August 1950.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
