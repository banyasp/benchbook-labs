episodes:
- n: 1
  focus: The tribunals tried the airmen on allegations of unlawful bombing and strafing, and the proceedings resulted in death
    sentences. The law allowed lesser penalties, while the record describes contested evidence, no opportunity to obtain witnesses
    or evidence, and the defense’s claim that Tokyo had approved demanding death; do not treat the alleged offenses or disputed
    evidence as established facts.
  span_range:
  - src:860ea6ba3bd4#p1.4
  - src:860ea6ba3bd4#p1.8
  decision: The Japanese military tribunals decide whether to convict and sentence the captured American airmen under the
    Formosa Military Law.
  content_domain: other:military adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: After receiving final instructions from Tokyo, the commander ordered the executions. The defense claimed that Tokyo’s
    approval of the death penalty and the tribunal’s sentence left the commander obliged to issue the order; consider that
    asserted constraint and the available possibility of not proceeding or delaying, without treating the defense account
    as an established finding.
  span_range:
  - src:860ea6ba3bd4#p1.8
  - src:860ea6ba3bd4#p1.8
  decision: The Japanese commander decides whether to order the execution of the fourteen sentenced American airmen.
  content_domain: operational-command
