episodes:
- n: 1
  focus: The decision point is whether to recover earlier or keep the aerostat aloft while the director believed a later recovery
    window remained; the report attributes the delay to misinterpreting weather information and risk. Treat this as an operational-command
    decision about timing and safety, not as a decision about the subsequent winch operator’s recovery technique.
  span_range:
  - src:f12c3e91e506#p13.3
  - src:f12c3e91e506#p23.3
  decision: The Mishap Flight Director decided when to recover the aerostat, continuing adjustment operations before directing
    recovery at 2350Z despite forecasts of strong winds and turbulence.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to recover earlier in light of available weather warnings or delay based on the weather
    information the MFD 1 understood. The report attributes the delay to inadequate and misinterpreted weather data, including
    a warning understood as a cancellation; exclude the later physical recovery maneuvers.
  span_range:
  - src:f12c3e91e506#p26.3
  - src:f12c3e91e506#p27.7
  decision: The MFD 1 delayed deciding to recover the Mishap Aerostat until 2350Z rather than beginning recovery earlier.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue or stop the recovery when tension increased and winds buffeted the aerostat.
    The stated reason for continuing was that surface winds remained within Redbook limits; exclude the mechanics of inhaul
    or subsequent outhaul.
  span_range:
  - src:f12c3e91e506#p26.6
  - src:f12c3e91e506#p27.1
  decision: The MFC chose to continue the inhaul rather than stop it as cable tension exceeded limits and the aerostat encountered
    increasing winds.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
