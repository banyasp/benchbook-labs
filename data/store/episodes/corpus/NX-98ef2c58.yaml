- n: 1
  focus: The passage describes a late shift in the Soviet leadership’s balance toward intervention, amid concern that communist
    authority was threatened and pressure from within the leadership and from anxious Eastern European allies. Keep the scenario
    at the level of the decision to use force and its political context; exclude military preparations and invasion methods.
  span_range:
  - src:33af3f64e6b5#p9.4
  - src:33af3f64e6b5#p13.1
  decision: The Soviet leadership decided to intervene militarily in Czechoslovakia in August 1968 rather than continue to
    hold back.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: 'The passage presents competing interpretations: most analysts continued to expect restraint, while the Office of
    Strategic Research judged that preparations were sufficient to intervene if Soviet political leaders chose to do so. Focus
    on the estimative judgment and the evidence weighed; exclude the technical details of intelligence collection and military
    movements.'
  span_range:
  - src:33af3f64e6b5#p10.7
  - src:33af3f64e6b5#p11.2
  decision: U.S. intelligence analysts assessed whether Soviet military mobilization meant intervention was imminent or was
    intended to pressure Czechoslovakia into curbing reform.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The President rejected the warning that the meeting most likely presaged action over Czechoslovakia because he believed
    it concerned the scheduled U.S.-Soviet arms-limitation announcement. Treat this as a decision about interpreting and receiving
    intelligence warning, not as a decision on how to respond to the invasion.
  span_range:
  - src:33af3f64e6b5#p12.1
  - src:33af3f64e6b5#p12.2
  decision: The President decided to reject the CIA Director’s interpretation that an urgent Soviet leadership meeting signaled
    an impending crisis, believing it concerned the planned arms-control announcement.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The CIA analysis describes the Soviet leadership’s apparent reversal of the respite agreed at Cierna and its decision
    to execute the intervention plan. It cites the lack of visible reversal of reforms, pressure within the leadership, the
    approaching Czech party congress, and the burden of maintaining intervention forces; exclude operational details of the
    invasion.
  span_range:
  - src:33af3f64e6b5#p52.5
  - src:33af3f64e6b5#p54.3
  decision: The Soviet Politburo decided whether to honor the Cierna agreement and continue pressuring Czechoslovakia or reverse
    course and authorize military intervention in August 1968.
  content_domain: use-of-force-policy
