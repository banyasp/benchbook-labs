  focus: The decision point is the choice between continuing to focus on New York or shifting to a southern objective, with
    Yorktown later selected. The source cites objections from French allies and the commander’s advisers, the need for French
    assistance, and the strategy of avoiding direct battle against Britain’s superior force; exclude the mechanics of deception
    used to conceal the change in plans.
