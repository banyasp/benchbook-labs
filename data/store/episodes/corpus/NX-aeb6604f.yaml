episodes:
- n: 1
  focus: The Secretary weighed the possibility of opening a sustained dialogue and improving relations against risks including
    fraud and the uncertain consequences of the proposal. The decision point is the policy choice to signal receptiveness
    without committing to the proposed transfer; exclude the mechanics of the back-channel communication.
  span_range:
  - src:a98b97d1c61c#p1.36
  - src:a98b97d1c61c#p1.37
  decision: The Secretary of State chose to authorize a tentative, noncommittal positive response to an approach proposing
    an Iran dialogue linked to arms.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The Secretary’s choice was to recommend stopping rather than continuing an effort he viewed as paying for hostages.
    The reasons stated were that the arrangement broke U.S. principles and risked signaling to Iran that kidnapping could
    produce profit; exclude the operational details of the initiative.
  span_range:
  - src:a98b97d1c61c#p1.49
  - src:a98b97d1c61c#p1.50
  decision: The Secretary of State urged the national security adviser to stop the Iran arms-for-hostages effort.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The executive assistant faced a request for relevant department records and chose a limited production, while emphasizing
    that notes of confidential presidential conversations should reach only people with an absolute need to know. The decision
    point is the legal and ethical balance between investigative cooperation and confidentiality; exclude the mechanics of
    reviewing or copying notebooks.
  span_range:
  - src:a98b97d1c61c#p1.19
  - src:a98b97d1c61c#p1.22
  decision: The Secretary’s executive assistant chose to provide the FBI selected, excerpted records and to restrict access
    to especially sensitive notes.
  content_domain: other:investigative-integrity
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to press for ending the initiative or accept the White House’s account and allow it
    to continue. The Secretary of State demanded that it stop, objecting that the operation was wrong and illegal and exposed
    the administration’s chief executive. Do not include operational details of shipments or the planned trip.
  span_range:
  - src:a98b97d1c61c#p1.64
  - src:a98b97d1c61c#p1.65
  decision: The Secretary of State demanded that the White House stop the Iran arms initiative after the London disclosure.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to escalate concerns internally or remain silent about the initiative. The State Department
    official’s memorandum said the activity blatantly violated established hostage policy, warned that it would leak and damage
    the Administration, and urged the department to stop it. Exclude details of how the arms activity was conducted.
  span_range:
  - src:a98b97d1c61c#p1.70
  - src:a98b97d1c61c#p1.72
  decision: A State Department official chose to urge the department to stop the continuing Iran initiative in a memorandum
    to the department’s executive secretary.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is how to respond after learning that the ambassador had held unreported contacts with White House
    and other representatives outside the department’s chain of authority. The Secretary of State recalled the ambassador
    and directed future compliance with that chain. Exclude details of the contacts and hostage-related arrangements themselves.
  span_range:
  - src:a98b97d1c61c#p1.85
  - src:a98b97d1c61c#p1.85
  decision: The Secretary of State ordered the U.S. ambassador to Lebanon to return to Washington and follow the State Department
    chain of authority.
  content_domain: other:government oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is whether to proceed with contacts after public exposure of prior dealings, and on what policy
    terms. The Secretary of State allowed the meeting on the understanding that hostages must be released unconditionally
    and that further arms sales were barred unless Iran met specified conditions; after learning of a conflicting plan, he
    alerted the President and proceeded under his stated terms. Exclude the meeting’s covert or operational mechanics.
  span_range:
  - src:a98b97d1c61c#p1.85
  - src:a98b97d1c61c#p1.87
  decision: The Secretary of State allowed a meeting with Iranian representatives to proceed under stated U.S. conditions
    and rejected unauthorized understandings for further arms shipments.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: 'The decision point is how the Secretary prepared to give an account of the Iran arms events: rely on documentary
    materials and his recollection, or consult other participants. He said he avoided consultation to prevent an appearance
    of impropriety; exclude whether his resulting testimony was accurate.'
  span_range:
  - src:a98b97d1c61c#p1.110
  - src:a98b97d1c61c#p1.112
  decision: The Secretary of State chose to prepare his December 1986 congressional testimony from written materials without
    consulting other participants.
  content_domain: other:congressional testimony
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The aide described reviewing notes to find the key elements of the Secretary’s efforts to stop the arms sales, based
    on what the Secretary then recalled—not to locate every relevant notation. The passage also records that relevant notes
    were missed; do not treat that account alone as proof the omissions were intentional.
  span_range:
  - src:a98b97d1c61c#p1.151
  - src:a98b97d1c61c#p1.155
  decision: The senior State Department aide chose to provide selected notes for the Secretary’s December 1986 testimony rather
    than comprehensively identify all relevant entries.
  content_domain: other:congressional testimony
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The account describes the aide objecting to disclosure and urging that the legal adviser be stopped after the Justice
    Department requested records, while the President had authorized an investigation. The stated concern was that disclosure
    could be interpreted as implicating the former national security adviser in conduct that could expose him to prison; exclude
    any claim that this establishes the aide’s ultimate intent.
  span_range:
  - src:a98b97d1c61c#p1.120
  - src:a98b97d1c61c#p1.122
  decision: The senior State Department aide chose to resist providing his notebooks to the Justice Department after it requested
    the records.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 11
  focus: Before the Secretary’s 1987 testimony, the notes were supplied under restrictions; the Secretary and aide discussed
    keeping them out of the hearing room and retrieving them afterward, and the aide personally denied a staff attorney’s
    request to see originals. They cited confidentiality, the potentially damaging contents, and concern that the notes could
    become part of the public record; exclude operational details of the Iran initiative.
  span_range:
  - src:a98b97d1c61c#p1.124
  - src:a98b97d1c61c#p1.127
  decision: The Secretary of State and his aide chose to limit congressional access to the aide’s notes through excerpts and
    restrictions rather than provide unrestricted access.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 12
  focus: The report concludes that the aide deliberately withheld relevant notes while helping prepare testimony, despite
    a memorandum requiring production of all relevant documents. His stated reasons included limiting the review to information
    supporting the Secretary’s recollection and discounting information he considered unreliable or not sufficiently direct;
    exclude the separate question of whether to prosecute him.
  span_range:
  - src:a98b97d1c61c#p1.159
  - src:a98b97d1c61c#p1.177
  decision: The State Department aide reviewing his notebooks chose to provide selected notes rather than all notes relevant
    to the Iran arms sales.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The report found important aspects of the testimony incorrect but concluded the evidence did not establish beyond
    a reasonable doubt that the Secretary’s testimony was willfully false. The decision weighs the contemporaneous notes and
    the absence of notes showing that he remembered more than he testified to; exclude the aide’s separate document-production
    conduct.
  span_range:
  - src:a98b97d1c61c#p1.201
  - src:a98b97d1c61c#p1.202
  decision: The Independent Counsel decided not to prosecute the Secretary of State for allegedly willfully false congressional
    testimony.
  content_domain: other:criminal prosecution
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The report states that the evidence demonstrated beyond a reasonable doubt that the aide withheld relevant notes
    and helped prepare inaccurate testimony, but nevertheless concludes prosecution was inappropriate. It cites his subordinate
    role, a possible factual dispute about an oral waiver, the passage of time, and limited expected investigative value;
    exclude the underlying decision to withhold notes, which is a separate decision point.
  span_range:
  - src:a98b97d1c61c#p1.203
  - src:a98b97d1c61c#p1.203
  decision: The Independent Counsel decided not to prosecute the State Department aide for deliberately withholding relevant
    notes.
  content_domain: other:criminal prosecution
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: The report finds the former executive secretary’s omissions troubling but says the evidence of deliberate withholding
    was inconclusive. It cites the absence of direct evidence of collusion, the passage of time, and his limited role in preparing
    testimony; exclude the unresolved question of who redacted the note.
  span_range:
  - src:a98b97d1c61c#p1.204
  - src:a98b97d1c61c#p1.206
  decision: The Independent Counsel decided not to seek criminal charges against the former executive secretary for failing
    to produce relevant notes.
  content_domain: other:criminal prosecution
  refusal_sensitivity: low
  held_out: false
  natsec: false
