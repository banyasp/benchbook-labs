  span_range:
  - src:371f25e4a064#p26.4
  - src:371f25e4a064#p26.4
  decision: The NRO Director chose to lift special-access dissemination controls on DMSP data and release it for civil and
    scientific use.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: Assess the choice to expand the NRO’s support role and create a way for the Secretary of Defense to fund changes
    serving DoD interests beyond the DCI’s. Consider the stated mismatch between the NRO’s strategic mission and the needs
    of general-purpose forces; exclude operational use of reconnaissance capabilities.
  span_range:
  - src:371f25e4a064#p34.2
  - src:371f25e4a064#p34.4
  decision: The NRO Director chose to establish mechanisms, including the Defense Reconnaissance Support Program, for applying
    NRO capabilities to ongoing military operations and DoD interests.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to collocate the offices or leave the existing arrangement in place as constrained
    budgets forced desired technology programs to compete for funding. The internal study identified collocation as the solution;
    exclude technical collection methods and details of individual programs.
  span_range:
  - src:371f25e4a064#p36.3
  - src:371f25e4a064#p36.3
  decision: The NRO Director decided to collocate NRO program offices to address unhealthy competition over limited funds.
  content_domain: other:organizational-management
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether the NRO should remain covert or have its existence declassified as its customer base
    expanded. The account gives the rationale and approval path; exclude any operational details of intelligence collection.
  span_range:
  - src:371f25e4a064#p38.2
  - src:371f25e4a064#p38.3
  decision: The NRO Director pursued declassification of the NRO’s existence, ultimately obtaining Presidential approval.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to continue the contract or terminate a major portion when the program could not be
    executed with the resources allocated. The account links the funding problem to inaccurate assurances to Congress and
    OMB; exclude contract implementation details not stated in the passage.
  span_range:
  - src:371f25e4a064#p44.2
  - src:371f25e4a064#p44.2
  decision: The NRO Director decided to terminate a major portion of a contract for an important new program.
  content_domain: other:intelligence-acquisition
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is whether to continue concealing the existence of ground stations or declassify them to support
    the NRO’s broader intelligence role and integrated ground architecture. The account identifies the rationale and approval;
    exclude station locations, operations, and collection details.
