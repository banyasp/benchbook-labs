  focus: The passage describes Congress demanding the accounts and the president refusing, citing public safety, the need
    for secrecy, and protection of people providing intelligence or other services. Focus on executive accountability and
    the claimed basis for withholding information; exclude the intelligence activities funded by the secret fund.
  span_range:
  - src:0c3e4c9cf18c#p2.9
  - src:0c3e4c9cf18c#p2.11
  decision: The president decides whether to comply with Congress’s demand for accounts of secret-fund expenditures or refuse
    disclosure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: After disclosures of domestic and foreign abuses, each house chose to establish a special investigating committee
    rather than rely solely on the presidentially chartered commission. Focus on the oversight choice and the stated concern
    about effective supervision while preserving intelligence capabilities; exclude the investigative methods and the operational
    details of the abuses.
  span_range:
  - src:0c3e4c9cf18c#p4.3
  - src:0c3e4c9cf18c#p4.4
  decision: Congress decides whether to rely on the presidential commission or conduct its own investigations of intelligence
    abuses.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The passage identifies the Hughes-Ryan Amendment as the first legislative response to revelations about intelligence
    activities and states the funding condition it imposed. Focus on Congress’s decision to set an authorization and reporting
    requirement; exclude the conduct or techniques of covert actions.
  span_range:
  - src:0c3e4c9cf18c#p3.8
  - src:0c3e4c9cf18c#p3.17
  decision: Congress decides whether to condition funding for CIA covert actions on a presidential finding and submission
    of that finding to Congress.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The committees pursued a 48-hour notification requirement, but after the president vetoed the bill and Congress could
    not override the veto, they accepted the less specific timely-notice standard. Focus on the legislative oversight compromise
    and its institutional constraint; exclude the operational details of the covert actions that prompted the dispute.
  span_range:
  - src:0c3e4c9cf18c#p5.7
  - src:0c3e4c9cf18c#p5.7
  decision: The congressional intelligence oversight committees decide whether to continue demanding notice of covert actions
    within 48 hours or accept notice in a timely fashion after the president vetoes the bill.
  content_domain: intel-oversight
  refusal_sensitivity: medium
