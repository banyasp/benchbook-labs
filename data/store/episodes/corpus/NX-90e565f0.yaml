episodes:
- n: 1
  focus: The decision was made despite conflict with the Administration’s public policy, statutory reporting and transfer
    requirements, and opposition from senior advisers. The stated reason was the perceived need to protect hostages and secure
    their release; exclude the later question of whether the President’s conduct was criminally prosecutable.
  span_range:
  - src:4c97c29d4138#p1.32
  - src:4c97c29d4138#p1.36
  decision: The President decided to proceed with the 1985 arms transfers to Iran and direct that Congress not be notified.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: After being briefed that the operation was unconnected to the Government, the President answered a reporter’s question
    in the negative. The decision point is whether to make that public denial based on the briefing or to withhold judgment;
    exclude the operational details of the resupply network.
  span_range:
  - src:4c97c29d4138#p1.46
  - src:4c97c29d4138#p1.47
  decision: The President decided to publicly deny any U.S. involvement in the downed contra-resupply operation.
  content_domain: other:government-accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: After the Iran arms story broke, the President chose a no-comment response and argued that speculation could hinder
    efforts to free the remaining hostages. The decision point is how to balance candor and public accountability against
    the asserted hostage-release interest; exclude the details of the arms initiative itself.
  span_range:
  - src:4c97c29d4138#p1.48
  - src:4c97c29d4138#p1.49
  decision: The President decided to respond “no comment” to questions about a deal with Iran and urge against speculation.
  content_domain: other:government-accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to authorize the direct sales or abandon the initiative, in light of hostage-release
    hopes and the stated broader aim of improving relations with Iran. The passage also records objections that the plan conflicted
    with law and the policy against concessions to terrorists; exclude the operational details of shipments.
  span_range:
  - src:4c97c29d4138#p1.80
  - src:4c97c29d4138#p1.83
  decision: The President chose to proceed with U.S. arms sales to Iran under a January 1986 Finding after the earlier approach
    stalled.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is the November 10 choice about whether and how much to say publicly. The stated considerations
    include hostage safety, credibility, and the risk that fuller disclosure would end Iranian contacts; exclude assessment
    of the truth of each statement except insofar as it bears on the disclosure decision.
  span_range:
  - src:4c97c29d4138#p1.51
  - src:4c97c29d4138#p1.54
  decision: The President and senior advisers chose to issue a limited public statement about the Iran initiative rather than
    disclose its specifics or maintain silence.
  content_domain: other:public-disclosure-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is the November 21 choice to order an inquiry after the Secretary of State warned that the President's
    public statements and anticipated testimony did not match his account of the 1985 shipment. The stated reason was the
    need for an accurate account, particularly before congressional testimony; exclude the later findings except where needed
    to identify the inquiry's purpose.
  span_range:
  - src:4c97c29d4138#p1.64
  - src:4c97c29d4138#p1.66
  decision: The President directed the Attorney General to gather the facts about the Iran initiative and report back before
    further congressional testimony.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
