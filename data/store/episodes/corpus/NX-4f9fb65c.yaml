- n: 2
  focus: The commander faced the planned destination, assessed as having greater capability, versus a closer local hospital.
    The commander chose the closer hospital to help Soldiers return to the fight sooner and use less fuel; the passage says
    the deviation required higher-command coordination and should have been covered by the contingency plan. Focus on the
    command decision and coordination, not transport methods.
  span_range:
  - src:cdab234f98c6#p4.4
  - src:cdab234f98c6#p5.1
  decision: The on-scene commander chose a closer local Baltic hospital instead of the planned Polish military hospital.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The PECC had been using a single report containing information for hospital admissions and strategic evacuation,
    then discontinued it when concern arose that its PII could violate the cited health-privacy law. Focus on the reporting
    and privacy decision; exclude later recommendations about secure storage and need-to-know distribution as separate decisions.
  span_range:
