- n: 1
  focus: The decision point is whether to respond to the perceived risk of a surprise US nuclear attack with a major intelligence
    alert and joint KGB–GRU effort, rather than maintain ordinary warning posture. The source gives Andropov’s stated threat
    assessment but says the alert’s precise origins are unclear; exclude the program’s collection methods and tasking details.
  span_range:
  - src:945b5e66aa38#p4.7
  - src:945b5e66aa38#p4.8
  decision: Soviet leadership and the KGB chief decide to place intelligence services on alert and launch the joint RYAN warning
    effort.
