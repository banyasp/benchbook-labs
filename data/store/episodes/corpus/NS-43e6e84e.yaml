  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to engage the aircraft or refrain from firing as it was about to leave Soviet airspace.
    The source says the commander likely made an honest but serious mistake in an unusually tense, high-alert environment
    following reported US aircraft incursions; exclude the mechanics of the engagement.
  span_range:
  - src:945b5e66aa38#p15.4
  - src:945b5e66aa38#p17.1
  decision: The Soviet air-defense commander decides to order the shootdown of Korean Airlines Flight 007.
