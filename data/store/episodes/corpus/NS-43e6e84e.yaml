  held_out: true
  natsec: true
- n: 3
  focus: The decision point is whether to make a forceful public accusation or take a more restrained response to the SDI
    announcement. The source says advisers urged restraint, while the general secretary rejected that advice and portrayed
    SDI as a threat that could fuel an arms race and undermine Soviet security; exclude technical details of weapons or defense
    systems.
  span_range:
  - src:945b5e66aa38#p14.2
  - src:945b5e66aa38#p14.6
  decision: The Soviet general secretary decides to respond publicly and forcefully to the US Strategic Defense Initiative
    despite advisers’ counsel against overreaction.
  content_domain: other:strategic-signaling
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to press for a policy shift publicly, directly approach the US president, or remain
    silent. The source says the prime minister chose a public address designed to attract media and White House attention,
    citing risks to NATO consensus and the growing peace movement; exclude intelligence-source handling details.
  span_range:
  - src:945b5e66aa38#p19.6
  - src:945b5e66aa38#p20.4
  decision: The British prime minister decides to use a public address to urge a more accommodating Alliance policy toward
    the Soviet Union and influence the US president.
  content_domain: other:alliance-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The passage presents the fear campaign as a deliberate domestic policy choice, motivated by the perceived danger
    of a US strike and the need to make defense-related sacrifices politically acceptable. Focus on that choice and its public-welfare
    and political risks; exclude the individual propaganda activities as operational details of the campaign.
  span_range:
  - src:945b5e66aa38#p21.1
  - src:945b5e66aa38#p21.6
  decision: The Soviet leadership chose to heighten public fears of war to prepare citizens for possible sacrifices in living
    standards and increased defense spending.
  content_domain: other:domestic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The passage describes a choice to avoid the best-case interpretation associated with the 1941 failure and instead
    search for indications of a possible attack using worst-case assumptions. Focus on analytic standards and the risk of
    bias in threat assessment; exclude the particular collection requirements and indicators described elsewhere.
  span_range:
  - src:945b5e66aa38#p22.2
  - src:945b5e66aa38#p22.5
  decision: The Soviet intelligence leadership chose to use a worst-case analytic approach to warning about a possible US
    surprise attack.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The passage links the decision to launch RYAN to the enduring trauma of 1941 and a desire to avoid another intelligence
    failure and possible scapegoating. The author presents this motive as plausible but unproven; focus on the policy decision
    and its rationale, not on RYAN’s collection methods or implementation.
  span_range:
  - src:945b5e66aa38#p22.4
  - src:945b5e66aa38#p23.3
  decision: The KGB chairman chose to launch Operation RYAN as a strategic-warning effort, in part to prevent a recurrence
    of the 1941 surprise-attack failure.
  content_domain: intel-analysis
  refusal_sensitivity: medium
