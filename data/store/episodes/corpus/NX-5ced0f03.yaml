- n: 1
  focus: The plan chooses continued Fort Detrick support rather than having DIA assume the function, citing prohibitive transportation
    costs and increased security risks. Keep the scenario focused on the support arrangement and funding decision; exclude
    any procedures for handling or destroying classified waste.
  span_range:
  - src:0f6dfb6bf3bd#p1.255
  - src:0f6dfb6bf3bd#p1.257
  decision: DIA transition planners decide whether Fort Detrick or DIA will provide AFMIC’s classified-waste destruction support;
    they choose to continue Fort Detrick base support, funded through a MIPR.
  content_domain: other:organizational-transition
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The plan recommends keeping DIA’s printing of larger publications and AFMIC’s reproduction of short-turnaround studies,
    describing the distinct capabilities and product needs. Focus on the organizational allocation of printing responsibilities,
    not on production techniques.
  span_range:
  - src:0f6dfb6bf3bd#p1.329
  - src:0f6dfb6bf3bd#p1.330
  decision: DIA and AFMIC transition planners decide whether to retain divided printing responsibilities or consolidate them;
    they recommend that both continue their existing functions.
  content_domain: other:organizational-transition
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The plan says major changes are unnecessary and treats the existing process as a stabilizing influence that supports
    continuity; it also calls for DIA awareness while preserving MSIC’s consumer interface. Exclude the detailed mechanics
    of task routing and any unrelated production responsibilities.
  span_range:
  - src:0f6dfb6bf3bd#p1.780
  - src:0f6dfb6bf3bd#p1.781
  decision: DIA/MSIC transition planners decide to retain the existing scheduled production and tasking process during the
    transfer, making only limited adjustments for quick-reaction requirements.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The passage presents an operational, standards-compliant infrastructure, a proposed DIA connection, and competing
    positions on when hardware support should transfer. Focus on the policy choice about continuity and responsibility during
    transition; exclude technical implementation details of network connectivity.
  span_range:
  - src:0f6dfb6bf3bd#p1.805
  - src:0f6dfb6bf3bd#p1.807
  decision: DIA transition planners decide to preserve MSIC’s operational information-systems baseline and existing external
    support arrangements until DIA can provide those services, despite the Army’s stated disagreement.
