episodes:
- n: 1
  focus: The decision point is whether to make intelligence-authority and board-membership changes during the administration’s
    final weeks or defer action while the Defense Secretary develops recommendations. Include the competing concerns about
    integration, existing military expertise, and coordinating board membership with Defense reorganization; exclude operational
    intelligence collection or analysis methods.
  span_range:
  - src:a6cfee20e127#p1.6
  - src:a6cfee20e127#p5.2
  decision: The President and National Security Council chose to have the Secretary of Defense submit proposed revisions to
    the NSC Intelligence Directives for consideration at the next Council meeting, rather than immediately reorganize military
    intelligence or change membership on the intelligence board.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to adopt the policy with or without language favoring self-financing. The discussion
    gives financing and policy reasons for the amendment, while also raising concerns about Panama’s interests, political
    feasibility, and Congress; exclude any technical details about excavation methods.
  span_range:
  - src:a6cfee20e127#p5.6
  - src:a6cfee20e127#p7.11
  decision: The National Security Council adopted the proposed U.S. policy on a future inter-oceanic canal, amended to state
    a preference that the project be self-financing.
  content_domain: other:infrastructure and foreign policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to impose controls after the diplomatic break or defer the choice pending recommendations.
    The discussion identifies the required executive authority and weighs limited immediate economic effect against political
    and psychological considerations; exclude unrelated intelligence about Cuba and any covert activity.
  span_range:
  - src:a6cfee20e127#p8.8
  - src:a6cfee20e127#p11.6
  decision: The President chose to request a prompt study by the Secretary of State, consulting Treasury and Commerce, on
    whether to apply Trading-with-the-Enemy Act economic controls to Cuba rather than impose them immediately.
  content_domain: other:economic sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to make a major resource shift toward limited-war capability or retain a balanced military
    program while accepting identified deficiencies and planned improvements. Include the stated contingencies and the constraint
    against unacceptably degrading general-war capability; exclude operational plans and logistics techniques.
  span_range:
  - src:a6cfee20e127#p12.2
  - src:a6cfee20e127#p15.11
  decision: The National Security Council chose to characterize U.S. limited-war capabilities as substantial and improving,
    without requiring a radical increase in resources, subject to the stated limits on logistics support and general-war readiness.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
