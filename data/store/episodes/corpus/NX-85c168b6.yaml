- n: 1
  focus: In spring 1942, Army leaders could leave secret intelligence with the COI or create a separate Army service. The
    stated rationale was to operate more discreetly, cooperate with State, and undercut the case for the COI’s clandestine-collection
    unit; keep the scenario focused on institutional authority and policy, not collection methods.
  span_range:
  - src:d5fa915b2330#p3.3
  - src:d5fa915b2330#p4.2
  decision: Army G-2 and Military Intelligence Service leadership decide to establish a secret intelligence service separate
    from the COI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: In 1946, the bodies could centralize clandestine collection in the CIG or leave it distributed among agencies. The
    passage gives the secretary of war’s support for a more robust CIG and records both bodies’ agreement; exclude the separate
    question of whether to incorporate the Pond.
  span_range:
  - src:d5fa915b2330#p10.3
  - src:d5fa915b2330#p10.3
  decision: The Intelligence Advisory Board and National Intelligence Authority decide to centralize clandestine collection
    in the CIG.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: In 1954, CIA leadership could renew or end the contract. The article attributes the decision to the Pond’s scheming
    and questionable products; focus on the contract and oversight decision, not the activities behind the dispute.
  span_range:
  - src:d5fa915b2330#p16.4
  - src:d5fa915b2330#p17.2
  decision: CIA leadership decides not to renew the Pond’s contract.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: After a report disclosed a French official’s circulation of the DCI’s comments, CIA ordered the Pond to stop forwarding
    reports to the FBI. The relevant choice is the policy for sharing those reports and the stated concern about the indiscretion;
    exclude details of any intelligence collection or covert activity.
  span_range:
  - src:d5fa915b2330#p14.2
  - src:d5fa915b2330#p14.2
  decision: CIA leadership decides to stop the Pond from forwarding counterintelligence reports to the FBI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
