- n: 1
  focus: The decision point is choosing Yunis from among potential foreign-terrorist arrest targets. The account cites his
    suspected role in attacks involving US citizens, a DEA source who knew him, and the resulting opportunity to obtain evidence
    and make him accessible. Exclude the mechanics of the planned deception and capture.
  span_range:
  - src:501d67192364#p11.10
  - src:501d67192364#p12.5
  decision: White House- and NSC-led interagency planners select the Lebanese terrorist Yunis for an arrest operation.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision concerns which agency would make the arrest and how to preserve a lawful, unbroken path to US prosecution.
    The stated constraints were that CIA lacked arrest authority and that the arrest should avoid the territory of a sovereign
    nation. Exclude the operational arrangements used to bring Yunis into FBI custody.
  span_range:
  - src:501d67192364#p13.2
  - src:501d67192364#p13.10
  decision: Justice Department officials set the legal boundary that CIA would support the operation, while the FBI would
    arrest Yunis in international waters and retain custody.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to grant the source’s asylum request for himself and his family after his role in delivering
    Yunis to the FBI could become public. The account notes his drug-dealing record and says permission followed extensive
    discussion. Exclude the logistics of relocating the family.
  span_range:
  - src:501d67192364#p13.11
  - src:501d67192364#p13.11
  decision: Washington decisionmakers approve asylum in the United States for the DEA source and his family after considering
    his request for protection from retaliation.
  content_domain: other:source protection and asylum
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: In a time-sensitive assessment, the team integrates the output quickly, producing a coherent and actionable result;
    deeper scrutiny would require examining the system’s assumptions, training data, and edge cases. Keep the focus on the
    analytic tradeoff under time pressure, not on technical methods for examining the system.
  span_range:
  - src:501d67192364#p43.9
  - src:501d67192364#p43.10
  decision: The assessment team decides whether to integrate an automated system’s high-confidence output quickly or pause
    for deeper examination of its assumptions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is how to preserve analytic scrutiny as work increasingly favors integration and presentation
    over interrogation of assumptions. Include the leader’s reasons and the tradeoff of marginally slower preparation; exclude
    broader claims about digital environments that are not part of this specific choice.
  span_range:
  - src:501d67192364#p44.3
  - src:501d67192364#p44.5
  decision: A team leader chooses to introduce time-limited rotating failure-analysis responsibilities for selected briefs
    rather than slow production wholesale.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: In the fictitious crisis, analysts are warned that the religious opposition’s nationalist appeals may attract secular
    groups and that the regime’s response may not reliably indicate opposition strength. The stated prescription is to pay
    closer attention to the opposition because events could unravel quickly; exclude any operational collection methods.
  span_range:
  - src:501d67192364#p63.4
  - src:501d67192364#p63.5
  decision: Eastland analysts decide whether to prioritize reassessing the opposition’s strength or continue drawing conclusions
    from the monarch’s reactions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
