episodes:
- n: 1
  focus: The decision weighs the legal guarantee of correspondence against the stated danger to national security, and sets
    limits on the cooperation. Focus on the authority and justification for the exception; exclude the mechanics of interception
    and letter handling.
  span_range:
  - src:ce530e945e21#p2.4
  - src:ce530e945e21#p3.1
  decision: The Director General of the Central Office of Post and Telegraphs agrees to authorize cooperation in intercepting
    the attaché’s letters despite legal protections for private correspondence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision is whether to arrest the identified recipients immediately or wait, avoiding exposure of the source
    and seeking evidence that can support later arrests while learning more about the network. Focus on the arrest-timing
    and intelligence-preservation judgment; exclude surveillance procedures and other collection methods.
  span_range:
  - src:ce530e945e21#p5.4
  - src:ce530e945e21#p5.5
  decision: Czech counterintelligence leadership chooses to delay arrests based on the intercepted correspondence and pursue
    independent grounds while seeking to preserve the source and identify more important agents.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision weighs the immediate risk posed by an alleged spy working on mobilization plans against the counterintelligence
    service’s chance to identify and apprehend other agents without exposing its source. Focus on the senior command judgment
    and competing risks; exclude search and arrest procedures.
  span_range:
  - src:ce530e945e21#p6.1
  - src:ce530e945e21#p7.1
  decision: The Chief of the General Staff orders the immediate arrest of a staff officer implicated in espionage rather than
    allowing his reassignment or delaying action to preserve the broader investigation.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
