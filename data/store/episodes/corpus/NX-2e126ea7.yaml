episodes:
- n: 1
  focus: The decision point is whether to continue working with Pastora or develop an alternative southern-front organization
    by bringing commanders into UNO. The report gives reasons for the shift, including concerns about Pastora’s effectiveness,
    security and public-relations risks, diplomatic friction, and disagreement with U.S. objectives; exclude the subsequent
    operational steps used to carry out the realignment.
  span_range:
  - src:d2fd71e27955#p1.30
  - src:d2fd71e27955#p1.33
  decision: The chief of the CIA’s Central American Task Force chose to pursue a southern-front strategy that moved dissident
    commanders away from Pastora and toward UNO.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to facilitate lethal assistance to the commanders or refrain; the chief directed personnel
    to assist and emphasized the expected effect on force development and unity. Keep the focus on the authorization and policy
    rationale, and exclude the mechanics of arranging or executing the drop.
  span_range:
  - src:d2fd71e27955#p1.39
  - src:d2fd71e27955#p1.41
  decision: The chief of the CIA’s Central American Task Force directed CIA personnel to assist a lethal-supply drop to the
    Newly Aligned Commanders through UNO/FDN.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to accept the private alternative for lethal assistance or withhold support after the
    FDN mission was abandoned. The report presents urgent resupply needs and the fragile NAC alliance as context, and records
    that the task force chief concurred; exclude the flight, transfer, and delivery details.
  span_range:
  - src:d2fd71e27955#p1.42
  - src:d2fd71e27955#p1.49
  decision: The chief of the CIA’s Central American Task Force concurred in a private-benefactor lethal resupply mission to
    the southern forces after the FDN plan failed.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The officials reversed the earlier plan and informed the field that the contras would have to act on their own. The
    decision was whether the CIA would participate, not how a liaison would be placed; focus on the Boland Amendment and the
    officials’ assessment of legal and political risk.
  span_range:
  - src:d2fd71e27955#p1.53
  - src:d2fd71e27955#p1.53
  decision: The task-force chief and compliance officer decided that the CIA would not help place a contra liaison with the
    private benefactors at Ilopango.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The account describes an effort to obtain funds through Project Democracy because other funding options had not moved
    and food was urgently needed before government aid became available. Treat the proposed CIA equipment purchase as part
    of the financing decision, not as an operational procedure; the passage reports the plan but does not establish that it
    was completed.
  span_range:
  - src:d2fd71e27955#p1.54
  - src:d2fd71e27955#p1.55
  decision: The CIA task-force chief and a senior State Department official sought private bridge financing for contra support,
    with a proposed later CIA purchase to repay the loan.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The passage describes equivocal answers and denials despite the official’s knowledge, and says his aim was to protect
    North; later briefings also aimed to head off an effort to stop the aid package. Focus on the choice between candid disclosure
    and concealment, not on details of the resupply operation.
  span_range:
  - src:d2fd71e27955#p1.59
  - src:d2fd71e27955#p1.65
  decision: The CIA task-force chief chose to withhold his knowledge of the private resupply operation in congressional responses
    and testimony.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
