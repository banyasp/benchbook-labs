  focus: The decision point is whether to extend a priorities framework centered on designated high-priority targets or add
    a global-coverage responsibility for requirements beyond those priorities. The stated reasons include reduced resources
    and the need to prepare for and respond to issues not identified as top priorities; exclude later descriptions of implementation
    and proposed reforms.
