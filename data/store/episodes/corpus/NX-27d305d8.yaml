episodes:
- n: 1
  focus: The decision point is whether to seek foreign funding or let the contras’ operations falter as U.S. funds ran short.
    The report gives the President’s direction to keep the contras alive as the reason, and later records the legal condition
    that third-country aid could be accepted only if no U.S. funds were used for it and no repayment was expected; exclude
    later operational assistance to the contras.
  span_range:
  - src:da292607fe99#p1.5
  - src:da292607fe99#p1.10
  decision: The national security adviser decides to seek and channel Saudi donations to keep the contras funded despite the
    shortfall in U.S. appropriations.
  content_domain: other:foreign-aid policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is how to answer congressional inquiries after press reports and review of documents that raised
    questions about contra support. The report describes categorical denials and McFarlane’s later explanation that he understood
    Congress to be focused chiefly on fundraising; exclude the underlying operational activities and the separate document-alteration
    issue.
  span_range:
  - src:da292607fe99#p1.27
  - src:da292607fe99#p1.34
  decision: The national security adviser decides to send Congress denials of NSC staff involvement in contra assistance rather
    than disclose the assistance described in the documents.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to reject the proposed transfer or approve an Israeli delivery and possible replenishment.
    The account describes the aim of reopening ties with Iran, claims about the Iranian contacts’ legitimacy, and the hoped-for
    release of hostages; it also records earlier presidential reservations. Exclude the mechanics of the shipments and intermediary
    contacts.
  span_range:
  - src:da292607fe99#p1.37
  - src:da292607fe99#p1.49
  decision: The President decides to approve Israel’s delivery of U.S.-made TOW missiles to Iran and permit Israel to obtain
    replacement weapons from the United States.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The choice arose after the Defense Secretary, who opposed arms-for-hostages, learned that a shipment of the requested
    size would require congressional notification. The passage states that the President decided to proceed through Israel,
    with hostage release as the stated objective; focus on the policy and authority choice, not shipment logistics.
  span_range:
  - src:da292607fe99#p1.56
  - src:da292607fe99#p1.57
  decision: The President decides to proceed with an Israeli-mediated HAWK sale to Iran in connection with efforts to free
    hostages.
  content_domain: other:arms-transfer-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: At the December 7 meeting, senior officials considered whether to continue the initiative; the Defense and State
    Secretaries objected on legal and policy grounds, while the President insisted on not missing a chance to free the hostages.
    Focus on the choice to continue and its legal and policy considerations, not the subsequent meetings or operational arrangements.
  span_range:
  - src:da292607fe99#p1.61
  - src:da292607fe99#p1.62
  decision: The President decides that the Iran initiative should continue despite objections that an arms sale would violate
    the U.S. embargo.
  content_domain: other:arms-transfer-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The account describes a choice between retaining a clear description of the HAWK shipment and using the less specific
    term “equipment,” after legal concerns about the shipment were raised. It also records the adviser’s stated rationale
    that he did not want to accept an account he believed conflicted with his recollection, and that he did not regard his
    wording as false; assess the disclosure and candor decision, not the underlying arms-transfer mechanics.
  span_range:
  - src:da292607fe99#p1.78
  - src:da292607fe99#p1.80
  decision: The former national security adviser decides to revise the chronology for the President’s press conference by
    omitting explicit reference to the November 1985 HAWK shipment.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The report weighs a plea involving withholding material information from Congress against felony prosecution, including
    the strength and limits of the evidence, the difficulty of trying the adviser with other defendants, his early cooperation,
    and his health. Focus on the prosecutor’s charging and plea decision and its tradeoffs; exclude the underlying operational
    conduct except as relevant context for the charges.
  span_range:
  - src:da292607fe99#p1.98
  - src:da292607fe99#p1.102
  decision: The Independent Counsel decides to recommend a misdemeanor plea agreement for the former national security adviser
    rather than pursue more serious charges.
  content_domain: other:criminal-justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
