- n: 1
  focus: The decision point is whether to authorize the activity or decline to do so; keep the analysis at the level of executive
    authorization and policy, without describing operational methods. The passage notes that a CIA assessment immediately
    beforehand characterized Nicaragua as important to Moscow’s efforts to expand influence in Latin America at U.S. expense.
  span_range:
  - src:91ddde9113e6#p9.4
  - src:91ddde9113e6#p9.4
  decision: The President authorized a CIA covert-action finding for paramilitary operations against Nicaragua.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is how the Commission should handle the assassination-plots inquiry when it lacked time for a
    full investigation. Keep the focus on the oversight choice and its stated time constraint; exclude operational details
    of any plots.
  span_range:
  - src:91ddde9113e6#p8.6
  - src:91ddde9113e6#p8.8
  decision: The Rockefeller Commission chose to transfer its materials on assassination plots to the ongoing Senate investigation
    rather than complete its own investigation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to add video presentations to intelligence briefings. Include the stated rationale
    that the Agency thought the format might be helpful and that White House feedback was favorable; exclude the contents
    of any individual video.
  span_range:
  - src:91ddde9113e6#p10.5
  - src:91ddde9113e6#p10.6
  decision: The CIA Director approved producing intelligence videos for the President after the Agency proposed that format
    to the White House.
  content_domain: other:intelligence dissemination
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is the administration’s choice to use a coordinated pressure strategy, with the stated aim of
    weakening the Soviet alliance system and encouraging long-term liberalizing and nationalist tendencies. Exclude operational
    details about support to particular groups; the focus is the policy choice and its strategic rationale.
  span_range:
  - src:91ddde9113e6#p13.11
  - src:91ddde9113e6#p13.17
  decision: The Reagan administration chose an integrated strategy to exploit Soviet weaknesses through economic, political,
    and military pressure.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 5
  focus: 'The decision point is the policy set out in National Security Directive 23: encourage reform and cooperation while
    avoiding destabilization or pressure intended to exploit Soviet weakness. Consider the stated goals and the contrast with
    the Reagan administration’s approach; exclude operational measures.'
  span_range:
  - src:91ddde9113e6#p15.7
  - src:91ddde9113e6#p15.13
  decision: The Bush administration adopted a policy of encouraging Soviet reform without seeking to destabilize the existing
    regime.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to change policy in response to intelligence that hard-liners might act, or to continue
    supporting the Soviet leader. The account says the administration stayed with its established policy because officials
    feared a military crackdown if they shifted support; exclude the intelligence-collection problem and focus on the policy
    judgment.
  span_range:
  - src:91ddde9113e6#p15.5
  - src:91ddde9113e6#p15.11
  decision: In August 1991, the Bush administration chose to continue supporting the Soviet leader rather than shift its backing
    to the Russian leader, despite warnings of a possible coup.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is the analysts’ estimate of the likely Soviet response, weighing diplomatic pressure against
    military and technical alternatives and explaining why a crash program is unlikely. Treat this as an intelligence judgment,
    not as a decision by U.S. officials or a recommendation about how to develop or employ weapons.
  span_range:
  - src:91ddde9113e6#p23.4
  - src:91ddde9113e6#p24.9
  decision: The interagency intelligence analysts assess that the Soviet Union will rely principally on political and diplomatic
    efforts to counter the U.S. ballistic missile defense initiative in the near term, rather than undertake a crash military
    program.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is the analysts’ comparative assessment of the political significance of mass grievances and spontaneous
    unrest versus the narrower dissident movement. Include the stated reasons—popular accountability demands, spontaneity,
    and the risk that repression deepens alienation—and do not recast the analysis as a Soviet policy decision.
  span_range:
  - src:91ddde9113e6#p22.12
  - src:91ddde9113e6#p22.13
  decision: The National Intelligence Council analysts judge that popular civil unrest is likely a greater long-range challenge
    to the Soviet regime than the intellectual dissident movement.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is the analysts’ forecast about the direction of the leadership crisis, with accommodation and
    a dramatic showdown as competing possibilities. The assessment acknowledges uncertainty and disagreement, then gives reasons
    for its overall judgment; exclude any implication that U.S. policymakers chose or caused either outcome.
  span_range:
  - src:91ddde9113e6#p29.2
  - src:91ddde9113e6#p31.9
  decision: The senior Kremlin-watch analysts assess that developments in the Soviet leadership are more likely to move toward
    a dramatic confrontation than continued accommodation.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
