episodes:
- n: 1
  focus: The decision point is how analysts divided costs shared by military and non-military projects, rather than counting
    only clearly military defense-budget appropriations. Focus on the choice to charge an additional 6 billion francs to military
    aspects and its documentary and allocation basis; exclude the operational details of the nuclear program.
  span_range:
  - src:e715467e2434#p8.2
  - src:e715467e2434#p8.4
  decision: Intelligence analysts decided to attribute approximately 6 billion francs of France’s joint nuclear-program costs
    through 1964 to military activities.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to persist with budget-based documentary analysis or use a hybrid of relevant Soviet
    data and U.S.-cost analogies. Focus on the analysts’ choice of estimation method and stated reason; exclude details about
    how intelligence was collected.
  span_range:
  - src:e715467e2434#p12.4
  - src:e715467e2434#p12.4
  decision: Intelligence analysts adopted a mixed method to estimate the burden of the Soviet nuclear program after budget
    analysis failed to identify its allocations.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the analysts’ estimate of future military expenditures, including the chosen central figure
    and confidence range. Focus on the assumptions and evidence behind the estimate; exclude technical descriptions of facilities
    and weapons-development activities.
  span_range:
  - src:e715467e2434#p10.5
  - src:e715467e2434#p11.3
  decision: Intelligence analysts set a central estimate of about $6 billion, with a plus-or-minus $1 billion range, for French
    military nuclear-program expenditures in 1965–70.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
