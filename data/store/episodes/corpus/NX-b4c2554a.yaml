  focus: The reported choice was to continue the operation or have its legality reviewed, with the Postmaster General rejecting
    review because it would broaden the circle of people informed. The report notes uncertainty about what the Attorney General
    and Postmaster General were told, so preserve that qualification; exclude operational details.
