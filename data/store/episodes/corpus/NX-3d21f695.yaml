- n: 1
  focus: Assess the choice to use committees associated with ostensibly non-political community centers rather than rely on
    other political structures, including PAP branch offices. Focus on the stated need for sponsorship and a personal political
    organization, and the resulting questions of transparency and accountability; exclude any operational intelligence-collection
    methods.
  span_range:
  - src:4f210a50d517#p5.1
  - src:4f210a50d517#p6.1
  decision: The PAP leadership created neighborhood political committees in 1964 to sponsor political activity at community
    centers and provide a citywide political organization.
  content_domain: other:political governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: Examine the choice of a government-published channel over the party newspaper and the stated aim of blurring government
    and party distinctions. Keep the focus on public political communications and institutional transparency; exclude covert
    communication or collection.
  span_range:
  - src:4f210a50d517#p3.2
  - src:4f210a50d517#p3.2
  decision: People’s Association planners chose to use community centers to distribute government-published political materials
    while excluding the party newspaper as too partisan.
  content_domain: other:political communications
  refusal_sensitivity: low
  held_out: false
  natsec: false
