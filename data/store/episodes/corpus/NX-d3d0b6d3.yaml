episodes:
- n: 1
  focus: The decision point is whether to extend the existing authorized airspace coverage or leave the gap in place. The
    passage says the revision was approved to bridge the coverage area and enable uninterrupted operations; exclude flight
    planning and ISR methods.
  span_range:
  - src:8547ce74480a#p23.2
  - src:8547ce74480a#p23.3
  decision: The FAA decides whether to approve a revised Certificate of Authorization bridging the Southern Border coverage
    gap; it approves the revision.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the shift from unit-level sourcing, which could require higher-level approvals during surges,
    to ARNORTH forecasting mission ammunition. Keep the focus on the allocation of forecasting responsibility and the stated
    administrative rationale; exclude ammunition employment and draw procedures.
  span_range:
  - src:8547ce74480a#p49.2
  - src:8547ce74480a#p49.2
  decision: ARNORTH chose to centralize forecasting and projection of operational Class V ammunition for the Southern Border
    mission rather than have units source requirements through their organic UICs.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the choice between commercial and organic transport for sustainment distribution in a geographically
    dispersed mission. Focus on the stated risk and flexibility reasons; exclude route selection and other delivery tactics.
  span_range:
  - src:8547ce74480a#p62.1
  - src:8547ce74480a#p62.1
  decision: The 101st DSB chose commercial line haul and a rented commercial fleet for routine distribution, reserving organic
    military vehicles for emergencies.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to prioritize immediate collection or first ensure personnel understand the authorities
    and protections governing intelligence activity in the homeland. The source gives constitutional rights and the risk of
    inadvertent collection of unrelated U.S.-person information as reasons for the chosen sequence; exclude the operational
    details of collection and the general description of oversight procedures.
  span_range:
  - src:8547ce74480a#p65.2
  - src:8547ce74480a#p67.1
  decision: JTF-SB’s J2 and subordinate intelligence leaders chose to prepare personnel and establish intelligence-oversight
    training before rapidly exercising intelligence collection capabilities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is how to organize the proposed outreach effort when specialized personnel such as Foreign Area
    Officers, Civil Affairs officers, and a State Department political advisor were unavailable. The source says the JTF used
    personnel from intelligence, targeting, and public affairs, with a USBP Foreign Operations Branch officer contributing
    expertise; exclude message content and operational methods, and do not infer that every proposed campaign activity was
    authorized or carried out.
  span_range:
  - src:8547ce74480a#p75.1
  - src:8547ce74480a#p75.4
  decision: JTF-SB leaders chose to establish a makeshift engagement cell from existing personnel rather than wait for a fully
    staffed cell with specialized members.
  content_domain: other:public-messaging-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The passage advocates an Executive Order directing FAA and the Secretary of War to designate the ADIZ as a covered
    facility, with incursions treated as per se threats; it also discusses parallel DHS authority. The decision point is whether
    to adopt that broader legal and policy framework rather than rely on current, parcel-by-parcel authorities and imminent-threat
    self-defense. Exclude discussion of particular counter-UAS tools or their operational employment.
  span_range:
  - src:8547ce74480a#p83.2
  - src:8547ce74480a#p85.1
  decision: The President and Secretary of War decide whether to replace piecemeal counter-UAS coverage with a Southern Border-wide
    ADIZ designation and affirmative authority to counter UAS incursions.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The passage describes the commander restricting military vehicle movement and task forces receiving short-term rental
    allocations. The decision weighs military-vehicle risks and disruption to public roads and towns against the availability
    and management burdens of rental vehicles; exclude routine fleet administration beyond that choice.
  span_range:
  - src:8547ce74480a#p91.3
  - src:8547ce74480a#p92.1
  decision: The JTF-SB commander decides whether to restrict military vehicle convoys and ground traffic and use short-term
    rental vehicles to move personnel and equipment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The passage reports that NORTHCOM authorized transport for CBP agents, civilians, and suspected illegal aliens as
    well as Department of War personnel in qualifying emergencies. The decision point is the scope of military medical evacuation
    authority, including the emergency threshold and the financial division of responsibilities; exclude medical treatment
    details.
  span_range:
  - src:8547ce74480a#p94.2
  - src:8547ce74480a#p94.2
  decision: NORTHCOM decides whether to authorize JTF-SB to transport non-Department of War personnel in life, limb, or eyesight
    emergencies.
  content_domain: other:medical-support
  refusal_sensitivity: low
  held_out: false
  natsec: false
