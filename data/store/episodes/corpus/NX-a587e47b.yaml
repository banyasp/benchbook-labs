- n: 1
  focus: The decision point is whether to withdraw or remain amid the German advance; the ambassador chose to leave the officials
    in Paris, citing the opportunity to benefit from initial German cooperation and collect intelligence. Exclude the later
    details of intelligence collection and escape arrangements.
  span_range:
  - src:9d45a6b1dc55#p5.4
  - src:9d45a6b1dc55#p5.4
  decision: The US ambassador in Paris decided to keep the acting ambassador and military attachés in the city rather than
    have them leave with the departing French government.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was whether to appear alongside the German general at a public celebration; the attachés declined, explaining
    that it was the general’s division and glory and that they should not share it. Keep the focus on the diplomatic and reputational
    judgment, not the mechanics of the event.
  span_range:
  - src:9d45a6b1dc55#p5.3
  - src:9d45a6b1dc55#p5.3
  decision: The naval attaché and army attaché declined the German general’s invitation to join a military review in occupied
    Paris.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision arose after the British attack on the French fleet left the minister furious and feeling betrayed. The
    naval attaché persuaded him to renew the pledge; the broader stated concern was preventing Germany from taking the ships.
    Exclude any operational or tactical questions about the fleet.
  span_range:
  - src:9d45a6b1dc55#p5.5
  - src:9d45a6b1dc55#p5.6
  decision: The Vichy naval minister chose to renew his pledge to the US government to keep the remaining French fleet out
    of German control.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: This is an estimative judgment contrasting the apparent paralysis in Vichy with the attaché’s observations in North
    Africa. The stated basis included his assessment of the military’s strength and fighting spirit; keep the scenario to
    the judgment and its evidence, not collection methods.
  span_range:
  - src:9d45a6b1dc55#p6.3
  - src:9d45a6b1dc55#p6.4
  decision: The naval attaché assessed that French forces in North Africa retained the strength and will to fight if France
    reentered the war.
  content_domain: intel-analysis
  refusal_sensitivity: medium
