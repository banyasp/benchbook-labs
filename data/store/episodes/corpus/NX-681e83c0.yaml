- n: 1
  focus: The report recommends ending service nominations and developing a balanced list because the invited group had limited
    regional and national representation and was geographically skewed. Treat this as a proposed media-selection policy choice;
    exclude operational details of the exercises.
  span_range:
  - src:be741c2ede7c#p20.3
  - src:be741c2ede7c#p20.4
  decision: OASD(PA) decides whether to replace service-nominated media invitations with a geographically balanced regional
    and national media list.
  content_domain: other:public-affairs policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The report recommends an exception because existing travel restrictions prolonged media stays, limiting participation
    by quality regional and national representatives; it weighs those constraints against the public-affairs benefit of informing
    the public. Treat this as a proposed travel-policy exception, not as authority to use exercise aircraft for operational
    purposes.
  span_range:
  - src:be741c2ede7c#p21.2
  - src:be741c2ede7c#p21.3
  decision: OASD(PA) decides whether to grant an exception to DoD travel rules so media can use space-available industrial-fund
    airlift rather than remain in Europe for two weeks or longer.
  content_domain: other:public-affairs policy
  refusal_sensitivity: low
