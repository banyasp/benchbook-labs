- n: 1
  focus: The decision point is whether to preserve the task force’s established mission and culture or adapt its organization
    to the expanding AQI threat. Include the commander’s conclusion that adaptation was necessary and the reported resistance;
    exclude details of how operations were carried out.
  span_range:
  - src:cb056dca8f6d#p19.4
  - src:cb056dca8f6d#p20.3
  decision: The TF 714 commander decided to transform the task force from a specialized force for infrequent, surgical counterterrorism
    missions into an organization capable of sustained operations against the insurgency.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to keep the task force’s existing problem-solving structure or join it with partner
    agencies in a JIATF. The stated rationale is that the old approach was too deliberate and self-contained for the challenge;
    exclude intelligence collection methods and operational procedures.
  span_range:
  - src:cb056dca8f6d#p14.3
  - src:cb056dca8f6d#p14.4
  decision: TF 714 leadership decided to form a joint interagency task force with intelligence agencies rather than address
    the AQI challenge through its existing self-contained approach.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to retain top-down decision-making or empower personnel closer to the action. The passage
    gives speed and decision volume as the rationale; exclude any details about particular missions or target execution.
  span_range:
  - src:cb056dca8f6d#p14.4
  - src:cb056dca8f6d#p16.2
  decision: TF 714 leadership decided to decentralize decision authority to operational-level personnel rather than rely on
    senior leaders to disseminate commands.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to retain a tactical measure of success or adopt a broader campaign-level measure.
    Focus on the commander’s rationale that tactical successes were not translating into operational or strategic success;
    exclude the means used to capture or kill people.
  span_range:
  - src:cb056dca8f6d#p33.2
  - src:cb056dca8f6d#p33.3
  decision: TF 714’s commander decides to redefine mission success as winning against AQI, rather than counting individual
    captures or killings.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to preserve TF 714’s existing organizational model or bring intelligence agencies into
    a collaborative task force. The reasons include intelligence gaps and the need to understand a fast-changing networked
    adversary; exclude operational intelligence-collection methods.
  span_range:
  - src:cb056dca8f6d#p38.3
  - src:cb056dca8f6d#p39.2
  decision: TF 714’s commander decides to establish a joint interagency task force rather than continue relying on a compartmented,
    largely military organization.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to retain centralized command approvals or empower lower-level personnel to decide
    and act. The stated rationale is that decisions moving up and down the chain took too long in a fast-changing environment;
    exclude the operational examples and any particular strike or mission decision.
  span_range:
  - src:cb056dca8f6d#p41.3
  - src:cb056dca8f6d#p42.4
  decision: TF 714’s leadership decides to replace top-down decision-making with decentralized authority for personnel closer
    to problems.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision was whether to retain centralized control or empower lieutenant colonels and colonels to select and
    act on targets within established standards. The stated reasons were to reduce command delays, accelerate operations,
    and rely on trusted leaders with shared context; exclude the specific conduct of raids.
  span_range:
  - src:cb056dca8f6d#p70.4
  - src:cb056dca8f6d#p71.3
  decision: TF 714 senior leadership chose to delegate more operational decision-making authority to field commanders rather
    than require senior approval for each mission.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is the Group’s choice between continuing the existing combat role and recommending a transition
    to support and phased withdrawal. The cited reasons were worsening violence and its judgment that U.S. military action
    alone could not bring success; exclude operational details of combat or troop movements.
  span_range:
  - src:cb056dca8f6d#p101.25
  - src:cb056dca8f6d#p102.2
  decision: The Iraq Study Group decided to recommend changing the U.S. forces’ primary mission in Iraq to supporting the
    Iraqi army and phasing out U.S. combat brigades by the first quarter of 2008, whether or not the Iraqi government reformed.
  content_domain: use-of-force-policy
