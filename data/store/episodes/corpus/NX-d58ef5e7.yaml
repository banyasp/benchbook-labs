  focus: In the Central African Republic conflict, attacks against civilians began within weeks of the battalions’ arrival;
    the document lists several measures the commander could have undertaken, including clearer orders, investigations and
    punishment, changes to deployment, and removal of offending personnel. Treat these as available courses, not as measures
    the commander actually selected; the source does not identify a chosen course.
