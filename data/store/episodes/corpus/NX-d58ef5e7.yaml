- n: 2
  focus: The doctrine says military headquarters and warships cannot grant asylum, and that claimants do not thereby acquire
    a right to be taken to the UK. It requires taking them to a safe place or not returning them to the place they say they
    fled, because of non-refoulement; exclude decisions about granting asylum, which belong to the Home Office.
  span_range:
  - src:b93c34b7c1f9#p81.3
  - src:b93c34b7c1f9#p81.3
  decision: The commander decides how to handle people who claim refugee status or seek asylum, including whether to return
    them or take them to a safe place.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: The doctrine directs personnel to apply the most restrictive criteria where multinational and UK rules or directions
    are contradictory or confusing. The relevant choice is between the conflicting criteria, not how to conduct an operation;
    the surrounding passage identifies differing legal obligations and the need to meet UK political, legal and military requirements.
  span_range:
  - src:b93c34b7c1f9#p83.8
  - src:b93c34b7c1f9#p83.9
  decision: UK personnel decide which criteria to apply when multinational rules or directions contradict or conflict with
