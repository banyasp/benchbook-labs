  focus: The decision point is the analysts’ estimative judgment between the competing missile-shipment and no-shipment hypotheses,
    based on the evidence and starting odds described in the passage. The simulated analysis puts the mid-September odds three
    to one against shipment, then updates to even odds by early October as new evidence arrives; do not treat this as an operational
    decision or as proof that the simulation itself was the actual 1962 estimate.
