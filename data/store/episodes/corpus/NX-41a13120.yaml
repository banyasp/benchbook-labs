- n: 1
  focus: The decision point is whether to establish cross-border intelligence contact in response to the reported risk of
    an insurrection and possible outside support; the report says the French agreed and contact was established. Exclude any
    unstated collection methods or operational details.
  span_range:
  - src:5b58ea9c03d6#p6.3
  - src:5b58ea9c03d6#p6.3
  decision: The Italian prime minister proposed immediate contact between French and Italian military and civil intelligence
    services to thwart a feared Communist insurrection.
  content_domain: other:intelligence-cooperation
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is the choice between compromise within the coalition and seeking complete control, including
    retaining police control. The passage gives reasons tied to the prospect of electoral victory and the limits of power
    under parliamentary government; exclude the described mechanics of carrying out the coup.
  span_range:
  - src:5b58ea9c03d6#p20.4
  - src:5b58ea9c03d6#p21.3
  decision: The Czechoslovak Communist leadership chose to reject a compromise over police control and pursue complete control
    of the government rather than continue under a freely operating coalition.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The report gives the delegates’ stated preference and the security context: the government was making progress restoring
    order, and uprisings outside the capital were relatively small and quickly controlled. Keep the focus on whether to continue
    the diplomatic conference; exclude the disputed attribution of the uprising to Communists, which does not explain the
    conference decision.'
  span_range:
  - src:5b58ea9c03d6#p38.3
  - src:5b58ea9c03d6#p38.3
  decision: The leaders of the US delegation decide whether to continue the conference in Bogota or stop it; they favor continuing
    unless conditions make it physically impossible.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The assessment weighs the prestige cost of staying against the greater loss of prestige from withdrawal, and says
    that apparent disunity would encourage Soviet efforts to drive the western powers out. Treat this as the CIA’s policy
    assessment, not proof that the western governments formally made or implemented the decision. Exclude operational details
    of maintaining forces in the city.
  span_range:
  - src:5b58ea9c03d6#p61.4
  - src:5b58ea9c03d6#p61.4
  decision: The western powers decide whether to maintain their presence in Berlin or withdraw; the CIA assessment favors
    remaining.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The passage identifies competing claims to national representation and states the US plan to recognize the South
    Korean regime as the national government envisaged by United Nations resolutions. Keep the focus on recognition and its
    stated institutional basis; exclude the North Korean regime’s formation and military implications except as context.
  span_range:
  - src:5b58ea9c03d6#p76.3
  - src:5b58ea9c03d6#p76.3
  decision: The US government decides whether to recognize the South Korean regime as Korea’s national government; the excerpt
    says it plans to recognize it in that capacity.
  content_domain: other:diplomatic recognition
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: This is an intelligence estimate of the Kremlin’s likely policy choice, not confirmation that the Soviet leadership
    had made or implemented it. Focus on the reported limits of obtaining a settlement and the perceived need to prepare the
    Soviet public; exclude operational details of any later action.
  span_range:
  - src:5b58ea9c03d6#p101.5
  - src:5b58ea9c03d6#p101.5
  decision: The Soviet leadership weighed seeking a negotiated Berlin settlement against preparing further unilateral action
    in Germany, potentially including an eastern German state, and was assessed as preparing for the latter absent a face-saving
    compromise.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: Treat this as an intelligence estimate of both governments’ near-term political choices, not a confirmed joint agreement.
    The passage gives distinct reasons for each side’s restraint; exclude discussion of possible armed action as operational
    detail.
  span_range:
  - src:5b58ea9c03d6#p106.6
  - src:5b58ea9c03d6#p106.7
  decision: The Kremlin and Yugoslav leadership were assessed as choosing not to risk an immediate complete break, instead
    waiting for developments that might produce a solution to their impasse.
  content_domain: intel-analysis
