episodes:
- n: 1
  focus: The decision point is whether to consolidate special operations forces and their enablers in a unified command or
    retain them in separate structures. The passage links consolidation to the need for integrated forces and more effective
    capability in the contemporary operating environment; exclude later operational deployments and tactical methods.
  span_range:
  - src:a36bd7c905d1#p45.2
  - src:a36bd7c905d1#p45.3
  decision: The Canadian Chief of the Defence Staff decided to bring JTF 2 and the necessary enabling capabilities together
    under one commander, leading to the creation of CANSOFCOM.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: 'El pasaje plantea expresamente el dilema entre abandonar al Estado, con el riesgo de mayor caos y catástrofe humanitaria,
    y trabajar con su gobierno para promover reformas. Exclúyanse métodos operacionales de asistencia: el punto es la decisión
    de política, las restricciones legales —incluida la enmienda Leahy— y el riesgo humanitario.'
  span_range:
  - src:a36bd7c905d1#p67.4
  - src:a36bd7c905d1#p68.2
  decision: Los planificadores de asistencia militar deciden si mantener o suspender el apoyo a un Estado en riesgo cuyas
    fuerzas enfrentan acusaciones de abusos de derechos humanos, o continuar el apoyo condicionado a reformas y dentro de
    las restricciones legales.
  content_domain: other:foreign-security-assistance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: El pasaje dice que en Níger la creación de capacidades pasó a un segundo plano ante amenazas inmediatas específicas
    de Boko Haram, y contempla ampliar misiones cuando la amenaza supera la capacidad del Estado anfitrión. Exclúyanse detalles
    de ejecución operacional; el punto es la priorización y el alcance de la misión.
  span_range:
  - src:a36bd7c905d1#p70.4
  - src:a36bd7c905d1#p71.3
  decision: Los planificadores de la misión SOF en Níger deciden si mantener la creación de capacidades como prioridad o posponerla
    para atender las amenazas inmediatas de Boko Haram, incluso ampliando la misión a asesoramiento y asistencia operacional.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The passage presents asset freezes and travel bans as preferable when weak or corrupt governance compromises transparency
    in a partner country’s judicial system. Keep the focus on that policy choice and its stated evidentiary rationale; exclude
    operational methods for carrying it out.
  span_range:
  - src:a36bd7c905d1#p81.5
  - src:a36bd7c905d1#p81.5
  decision: Officials shaping responses to transnational organized crime in partner countries with compromised judicial transparency
    choose asset freezes and travel bans over relying on ordinary evidentiary and prosecution routes.
  content_domain: other:transnational-crime sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: El punto de decisión es aprobar una reforma integral con nuevas facultades o mantener el marco existente, tras los
    atentados de 2014 y las preocupaciones sobre simpatizantes y reclutas de EI. La ley incluyó intercambio de información,
    restricciones de viaje, arrestos preventivos y nuevas facultades sujetas en ciertos casos a orden judicial y aprobación
    ministerial; excluya cualquier valoración de cómo ejecutar medidas operativas.
  span_range:
  - src:a36bd7c905d1#p105.3
  - src:a36bd7c905d1#p106.2
  decision: El Parlamento de Canadá decidió aprobar la Ley Antiterrorista C-51 de 2015, ampliando las facultades de seguridad
    e inteligencia en respuesta a las amenazas terroristas.
  content_domain: other:counterterrorism legislation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: El punto de decisión es cómo diferenciar los cargos según el grado de participación de cada integrante. Limítese
    a la decisión de imputación y a la razón expresada —que los demás no estaban plenamente involucrados en el atentado planeado—;
    excluya los detalles de la conspiración y del informante.
  span_range:
  - src:a36bd7c905d1#p142.3
  - src:a36bd7c905d1#p142.3
  decision: Las autoridades fiscales canadienses decidieron imputar a cuatro integrantes del grupo Toronto 18 por la conspiración
    de atentado con bomba y formular cargos distintos relacionados con terrorismo contra otros miembros.
  content_domain: other:prosecutorial-charging
  refusal_sensitivity: low
  held_out: false
  natsec: false
