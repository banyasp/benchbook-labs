  focus: The panel had to decide whether to leave the conviction in place or set it aside, and what showing would be needed
    to establish that trial testimony was untainted. It held that refreshed or affected recollections could constitute prohibited
    use and required witness-by-witness review; exclude the dissent’s competing view of the proper procedure.
  span_range:
