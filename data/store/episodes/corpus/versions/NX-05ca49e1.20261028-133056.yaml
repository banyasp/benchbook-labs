- n: 3
  focus: The panel considered whether the trial court’s safeguards sufficed, or whether the convictions should be set aside;
    it also declined to return the case for new findings. Its stated reasons included the risk that exposed witnesses’ recollections
    were influenced by immunized testimony and its view that the trial judge’s credibility findings and circumstantial evidence
    could not establish an untainted memory. Exclude the dissent’s objections to that reasoning.
  span_range:
