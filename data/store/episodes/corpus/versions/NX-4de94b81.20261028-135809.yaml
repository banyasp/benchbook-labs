episodes:
- n: 1
  focus: The decision point is whether to investigate and address the concerns through a dedicated task force or leave them
    unresolved or handle them ad hoc. The DCI chose the task force, citing the need to address both actual policy-driven bias
    and perceptions of politicization, and to strengthen the quality of intelligence. Exclude the task force’s later recommendations
    as separate decisions unless treated as distinct reforms.
  span_range:
  - src:d794576f871c#p1.4
  - src:d794576f871c#p2.2
  decision: The DCI directs the Deputy Director for Intelligence to form a task force on politicization after the confirmation
    hearings.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is whether to retain the existing review arrangements or change them in response to reported internal
    pressures and concerns about distortion. The DCI chose to reduce review layers, reserve the DDI’s substantive review for
    sensitive products intended for high-level consumers, and promote supported alternative views in mainline products. Exclude
    unrelated personnel and training measures.
  span_range:
  - src:d794576f871c#p2.3
  - src:d794576f871c#p7.4
  decision: The DCI directs the DDI to reform analytic review by reducing review layers and broadening the inclusion of alternative
    views in finished products.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is whether officers responsible for implementing covert action may formally coordinate finished
    intelligence in those integrated areas or must be kept separate from that process. The DCI chose exclusion from formal
    coordination to guard against actual or perceived influence on analysis; the speech also stresses that relevant expertise
    and information should still reach analysts. Exclude the conduct of covert action itself.
  span_range:
  - src:d794576f871c#p6.2
  - src:d794576f871c#p8.4
  decision: The DCI directs that officers engaged in covert action in areas where policy implementation and analysis are integrated
    not participate in formal coordination of finished intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
