- n: 1
  focus: The decision arose while multiple NSA components sought the facility; the Center advocated a museum for contemporary
    education, and community officials offered support. Because the site could not secure classified material, exhibits would
    be unclassified, making public admission possible. Focus on the facility-use and public-access policy choice, not exhibit
    construction or operations.
  span_range:
  - src:3a5643a80e87#p4.4
  - src:3a5643a80e87#p4.5
  decision: NSA leadership approves the Center for Cryptologic History’s use of the adjacent motel facility for a museum that
    could admit the public.
  content_domain: other:public-affairs policy
  refusal_sensitivity: low
- n: 2
  focus: The museum was short of space, in disrepair, poorly accessible, and had lacked funding for improvements. The Director
    chose to allocate the building and direct repairs and upgrades rather than leave the museum in its existing condition;
    focus on that leadership and resource-allocation decision, not the specific renovation work.
  span_range:
  - src:3a5643a80e87#p12.3
  - src:3a5643a80e87#p13.1
  decision: The NSA Director directs immediate museum improvements and gives the museum leadership control of the whole building.
  content_domain: other:museum governance
  refusal_sensitivity: low
- n: 3
  focus: The Director viewed the museum as useful for public outreach and for improving NSA’s message to the media, then placed
    it under the Public and Media Affairs Office as part of a broader public-facing initiative. Focus on the institutional
    and communications-policy choice; exclude the content or techniques of intelligence operations discussed in exhibits or
    media coverage.
  span_range:
  - src:3a5643a80e87#p15.3
  - src:3a5643a80e87#p16.5
  decision: The NSA Director places the National Cryptologic Museum under Public and Media Affairs and makes it part of a
    strategy for greater media engagement.
  content_domain: other:public-affairs policy
  refusal_sensitivity: low
