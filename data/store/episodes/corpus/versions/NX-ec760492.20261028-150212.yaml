  focus: The decision point is whether to retain postmortems focused on intelligence deficiencies or add a two-stage process
    that also evaluates the validity of judgments after subsequent developments. The proposal was approved because existing
    postmortems did not address the validity of substantive judgments; exclude the individual estimates and later findings
    being reviewed.
