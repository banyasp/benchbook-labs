  - src:ce298ab8566e#p2.5
  decision: The IAC approved adding immediate postmortems and later validity reviews to its review procedures for national
    intelligence estimates.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is whether to require a postmortem for each estimate or reserve them for cases with sufficiently
    serious intelligence gaps or deficiencies affecting important national intelligence. The stated rationale is to focus
    postmortems on deficiencies consequential to quality and completeness; exclude the later, distinct reincarnated postmortem
    program.
  span_range:
  - src:ce298ab8566e#p7.3
  - src:ce298ab8566e#p7.3
  decision: The USIB directed that postmortems be produced selectively rather than with every estimate.
