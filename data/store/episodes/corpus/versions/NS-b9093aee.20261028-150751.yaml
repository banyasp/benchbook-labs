- n: 1
  focus: The decision point is the Appeals Chamber’s review of whether the Trial Chamber’s findings could stand on the evidence
    and support the convictions. The Appeals Chamber found the uniform 200-metre standard unsupported by the evidence, found
    error concerning targets of opportunity in Knin, and concluded that the remaining evidence did not sustain the findings;
    two judges dissented on key conclusions. This is judicial review, not a decision about conducting an attack.
  span_range:
  - src:3a104eba3fd2#p3.2
  - src:3a104eba3fd2#p5.1
  decision: The Appeals Chamber chose to reverse the findings that the Four Towns were subject to unlawful artillery attacks
    and that a joint criminal enterprise existed.
  content_domain: other:appellate adjudication
  refusal_sensitivity: low
- n: 2
  focus: The decision point is whether the Appeals Chamber could and would consider alternate modes of liability in this appeal,
    rather than decline to do so on jurisdictional or procedural grounds. It relied on its statutory power to revise decisions
    and its prior practice, while recognizing limits tied to fair-trial rights and jurisdiction. Exclude the later, appellant-specific
    assessments of the evidence.
  span_range:
  - src:3a104eba3fd2#p5.3
  - src:3a104eba3fd2#p6.1
  decision: The Appeals Chamber chose to consider whether convictions could be entered under alternate modes of liability
    after reversing the joint-criminal-enterprise convictions.
  content_domain: other:appellate adjudication
  refusal_sensitivity: low
- n: 3
  focus: After considering the Trial Chamber’s findings about awareness of crimes and failures to follow up, the Appeals Chamber
    declined to enter convictions for aiding and abetting or superior responsibility. It reasoned that the proposed additional
    measures were vague and that the evidence—including evidence of measures taken to maintain order—did not establish criminal
    liability beyond reasonable doubt. Exclude operational details about the measures themselves.
  span_range:
  - src:3a104eba3fd2#p6.4
  - src:3a104eba3fd2#p7.2
  decision: The Appeals Chamber chose not to enter alternate-mode convictions against the HV operational commander.
  content_domain: other:appellate adjudication
  refusal_sensitivity: low
- n: 4
  focus: The Appeals Chamber considered whether the Trial Chamber’s findings about failures to order investigations could
    support convictions for aiding and abetting or superior responsibility. It declined, citing the absence of findings on
    substantial contribution or effective control, the need for further fact-finding, and the risk to fair-trial rights. Exclude
    any operational account of the Special Police’s conduct.
  span_range:
  - src:3a104eba3fd2#p7.3
  - src:3a104eba3fd2#p8.2
  decision: The Appeals Chamber chose not to enter alternate-mode convictions against the Assistant Minister of the Interior
    and Special Police commander.
  content_domain: other:appellate adjudication
  refusal_sensitivity: low
