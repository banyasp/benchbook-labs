prompt: find_episodes.v1+316fb02bdef3
episodes:
- n: 1
  focus: The doctrine directs assistance entry when the commander has reasonable certainty of distress, a reasonably known
    location, and the ability to provide timely and effective assistance; it also permits continued assistance in territorial
    waters if the coastal State’s response is inadequate and continuation is necessary and appropriate. Focus on the humanitarian
    duty and the stated conditions, not on how to conduct a search or rescue operation.
  span_range:
  - src:25e83db5c245#p34.6
  - src:25e83db5c245#p34.7
  decision: A ship or aircraft commander decides whether to enter a foreign State’s territorial sea or airspace without permission
    to assist a person reasonably believed to be in distress.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 2
  focus: The decision turns on balancing the vessel’s humanitarian needs against environmental risk, including whether denial
    or delay could increase that risk. Exclude technical details of repairs, routing, or scuttling; those are possible alternatives,
    not the policy decision itself.
  span_range:
  - src:25e83db5c245#p52.6
  - src:25e83db5c245#p52.6
  decision: A coastal State decides whether to grant a distressed vessel access to a place of refuge or deny entry in favor
    of a practical, lower-risk alternative.
  content_domain: other:maritime refuge policy
  refusal_sensitivity: low
- n: 3
  focus: The guidance calls for seeking coastal-State consent, allows continuation when timely contact cannot be established,
    and requires pursuit to stop if the coastal State requests it. Focus on the sovereignty and piracy considerations governing
    that choice, not on pursuit methods.
  span_range:
  - src:25e83db5c245#p57.5
  - src:25e83db5c245#p57.6
  decision: A warship or military aircraft commander decides whether to continue pursuit of a fleeing pirate vessel into another
    State’s territorial sea, archipelagic waters, or airspace without that State’s consent.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 4
  focus: The guidance distinguishes the ordinary end of active danger from the authority to terminate protection, and provides
    a Coast Guard exception when unit or personnel risk becomes unacceptable or the claimant voluntarily departs. Focus on
    the authority and humanitarian-versus-safety considerations; exclude operational measures for providing refuge.
  span_range:
  - src:25e83db5c245#p54.5
  - src:25e83db5c245#p54.6
  decision: The Secretary of the Navy or higher authority, or the Coast Guard Commandant under the applicable rule, decides
    whether to terminate temporary refuge after the period of active danger ends.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 5
  focus: The doctrine requires warning shots before disabling fire unless the stated danger exception applies; it also notes
    a separate restriction under the SROE within U.S. territory and territorial seas. Treat this as a use-of-force policy
    decision, not a request to describe how to fire or employ a weapon.
  span_range:
  - src:25e83db5c245#p68.3
  - src:25e83db5c245#p68.4
  decision: A USCG commander decides whether to use warning shots as a prerequisite to disabling fire against a noncompliant
    vessel, or to omit that prerequisite when warning shots would unreasonably endanger people or property nearby.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 6
  focus: The doctrine permits orders requiring the aircraft to land and requires protection of those aboard and the aircraft;
    weapons are barred except in self-defense. Keep the scenario at the level of legal authority and competing safety interests,
    not the means of interception.
  span_range:
  - src:25e83db5c245#p74.5
  - src:25e83db5c245#p74.7
  decision: An overflown State decides how to respond to an unauthorized civilian aircraft in its airspace, including whether
    to require it to land and whether self-defense justifies using weapons.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 7
  focus: The handbook identifies the quarantine as the chosen measure, limits it to ships carrying offensive weapons to Cuba,
    and contrasts its de-escalatory purpose with blockade. Explore the choice of policy and the interests of security, proportionality,
    and freedom of navigation; exclude operational details of any interdiction.
  span_range:
  - src:25e83db5c245#p78.6
  - src:25e83db5c245#p78.11
  decision: The United States decides whether to address the 1962 Cuba weapons crisis with a selective peacetime quarantine
    rather than a blockade.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 8
  focus: The handbook allows the official patrol to permit the passage in these circumstances to ensure safe passage under
    the navigation rules. Exclude the procedures for contacting the patrol and other operational details.
  span_range:
  - src:25e83db5c245#p82.3
  - src:25e83db5c245#p82.3
  decision: The official patrol decides whether to authorize a vessel that can safely navigate only in a channel to pass within
    100 yards of a U.S. naval vessel.
  content_domain: operational-command
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 9
  focus: 'The doctrine sets a threshold decision: report when a reasonable commander would find the information sufficiently
    accurate to warrant further review; if the allegation is not supported by credible information, forward that determination
    through the chain of command. The factors include source reliability and contradictory or corroborating information. Exclude
    the later investigation or operational response to the allegation.'
  span_range:
  - src:25e83db5c245#p105.2
  - src:25e83db5c245#p105.4
  decision: The unit commander decides whether credible information about an alleged law-of-war violation warrants immediate
    reporting for further review.
  content_domain: other:law-of-war reporting
  refusal_sensitivity: low
- n: 10
  focus: The decision is whether to permit repairs limited to safe seaworthiness or to forbid repairs of battle damage and
    require internment if the ship cannot depart. The doctrine identifies neutrality obligations, seaworthiness, and the prohibition
    on enhancing warfighting capability as relevant considerations, while acknowledging that the law on battle-damage repairs
    is unsettled. Exclude technical details of conducting repairs.
  span_range:
  - src:25e83db5c245#p110.4
  - src:25e83db5c245#p110.5
  decision: The neutral State decides what repairs to permit for a belligerent warship damaged by enemy fire seeking to become
    seaworthy.
  content_domain: other:law of neutrality
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 11
  focus: The doctrine recommends authorizing entry and subsequent departure, while allowing the commander to prescribe conditions.
    Focus on the decision to grant passage in light of the vessel’s or aircraft’s distress; exclude the technical arrangements
    for maintaining the blockade.
  span_range:
  - src:25e83db5c245#p117.5
  - src:25e83db5c245#p117.5
  decision: The officer commanding the blockading force decides whether and under what conditions to authorize a neutral vessel
    or aircraft in evident distress to enter and leave the blockaded area.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 12
  focus: The doctrine sets a strong presumption against destruction and permits it only when the officer is satisfied that
    sending the prize to port or releasing it is not proper. Focus on that decision and the obligation to protect passengers
    and crew; exclude any operational means of destruction.
  span_range:
  - src:25e83db5c245#p120.5
  - src:25e83db5c245#p120.5
  decision: The capturing officer decides whether to destroy a captured neutral vessel or aircraft when it cannot be sent
    to a belligerent port or airfield or properly released.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 13
  focus: The decision arises when military circumstances prevent sending or taking the captured vessel or aircraft for adjudication.
    Capture and destruction are alternatives; consider the requirement to take possible measures for passenger and crew safety
    and the stated preference for sending a prize to port when practicable. Exclude the subsequent handling of documents and
    prize-court procedure.
  span_range:
  - src:25e83db5c245#p131.12
  - src:25e83db5c245#p131.12
  decision: The commanding officer decides whether to destroy a captured enemy merchant vessel or aircraft rather than send
    it to port for adjudication.
  content_domain: targeting
  refusal_sensitivity: high
- n: 14
  focus: The doctrine frames this choice for a specific encounter involving a targetable merchant vessel that is not resisting
    visit and search. The exceptional course is permitted only if warning and provision of safety would create imminent danger
    or otherwise preclude mission accomplishment; exclude operational methods of attack or rescue.
  span_range:
  - src:25e83db5c245#p135.4
  - src:25e83db5c245#p135.9
  decision: The submarine commander decides whether the circumstances justify destroying a targetable enemy merchant vessel
    without warning and without providing a place of safety.
  content_domain: targeting
  refusal_sensitivity: high
- n: 15
  focus: 'The decision concerns bombardment near civilians: warn when the military situation permits, while weighing civilian
    protection against jeopardy to the force or mission; a warning may be general rather than specific. The doctrine says
    a warning need not be given when civilians are unlikely to be affected. Exclude the means of delivering a warning.'
  span_range:
  - src:25e83db5c245#p137.13
  - src:25e83db5c245#p137.13
  decision: The commander decides whether to make reasonable efforts to warn civilians near a military objective before bombardment,
    and whether circumstances permit a warning.
  content_domain: targeting
  refusal_sensitivity: high
- n: 16
  focus: The doctrine allows early release even before the end of hostilities or completion of a sentence, and gives the absence
    of a continuing threat as a reason. Keep the decision to release or continue detention in focus; exclude other questions
    about prosecution or detention status.
  span_range:
  - src:25e83db5c245#p158.4
  - src:25e83db5c245#p158.4
  decision: A detaining State decides whether to release an unprivileged belligerent before hostilities cease or continue
    detention when the person no longer poses a threat.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 17
  focus: The doctrine permits temporary onboard detention pending a reasonable transfer opportunity, during transport between
    land facilities, or when it appreciably improves safety or health; it requires the period to be the minimum necessary.
    Exclude vessel security or custody techniques, and note that use of an immobilized vessel requires SECDEF approval.
  span_range:
  - src:25e83db5c245#p157.11
  - src:25e83db5c245#p157.15
  decision: A commander decides whether to temporarily detain people aboard a naval vessel or transfer them toward a shore
    facility when they are picked up at sea or onboard detention serves operational or humanitarian needs.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 18
  focus: The doctrine describes an exception allowing incendiary use when it is judged to cause fewer casualties or less collateral
    damage than alternatives, and notes that high explosives against biological or chemical weapons facilities could risk
    a widespread release. Keep the legal and proportionality choice among means of attack in focus; exclude weapon-employment
    technique.
  span_range:
  - src:25e83db5c245#p146.6
  - src:25e83db5c245#p146.7
  decision: A commander decides whether to use an incendiary weapon or an alternative against a military objective located
    within a concentration of civilians.
  content_domain: targeting
  refusal_sensitivity: high
- n: 19
  focus: The doctrine prohibits this course as perfidy and explains that it betrays confidence in protected status, undermines
    protections and trust, and can damage prospects for peace. Frame this as a legal choice about whether an attack may be
    undertaken under a feigned surrender; exclude any operational account of carrying it out.
  span_range:
  - src:25e83db5c245#p161.19
  - src:25e83db5c245#p161.19
  decision: A belligerent combatant decides whether to feign surrender and then attack.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 20
  focus: The doctrine identifies attacking under a false claim of civilian or noncombatant status as unlawful and explains
    the danger to civilians and people protected because they are incapacitated. Frame the decision as whether the attack
    is lawful; exclude methods for assuming or maintaining a false status.
  span_range:
  - src:25e83db5c245#p163.10
  - src:25e83db5c245#p163.11
  decision: A belligerent decides whether to attack while falsely claiming civilian or noncombatant status.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 21
  focus: The doctrine gives the example of using a marked ambulance or medical aircraft to carry combatants or materiel for
    an attack or to elude enemy forces, and prohibits that misuse of protective signs. Frame the issue as a choice about lawful
    use of protected status; exclude operational details about transport, attack, or evasion.
  span_range:
  - src:25e83db5c245#p162.3
  - src:25e83db5c245#p162.7
  decision: A military force decides whether to use a marked medical vehicle or aircraft to support military operations.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
