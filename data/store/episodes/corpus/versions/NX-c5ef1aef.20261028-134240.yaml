episodes:
- n: 1
  focus: The decision is whether to establish a separate agency, with Cabinet-level standing and responsibility for planning
    and coordination, instead of relying on existing fragmented structures or an NSC staff role. Keep the focus on governance
    design and accountability; exclude operational security procedures.
  span_range:
  - src:38ff07a2c24c#p31.9
  - src:38ff07a2c24c#p32.6
  decision: The President should propose, and Congress should decide whether to create, a National Homeland Security Agency
    rather than leave homeland-security coordination fragmented or assign it to an NSC staff official.
  content_domain: other:homeland-security governance
  refusal_sensitivity: low
- n: 2
  focus: The decision is whether to consolidate these border-security organizations under NHSA or retain their existing placement
    in separate departments. The passage weighs coordination, resources, oversight, and efficiency alongside their distinct
    missions; exclude operational border-control methods.
  span_range:
  - src:38ff07a2c24c#p32.7
  - src:38ff07a2c24c#p33.1
  decision: The President should propose whether to transfer Customs, the Border Patrol, and the Coast Guard to NHSA while
    preserving them as distinct entities, and Congress should decide whether to authorize the transfer.
  content_domain: other:homeland-security governance
  refusal_sensitivity: low
- n: 3
  focus: The decision is whether to retain the divided crisis-management and consequence-management arrangements, including
    initial DOJ control, or amend them in favor of one NHSA-managed response system coordinated with DOJ and the FBI. The
    stated reasons are duplication, confusion, and delay; exclude incident-response tactics.
  span_range:
  - src:38ff07a2c24c#p37.7
  - src:38ff07a2c24c#p37.8
  decision: Congress should decide whether to authorize NHSA to manage a single national incident-response system, replacing
    initial Department of Justice control in terrorist incidents while preserving the FBI’s traditional law-enforcement role.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 4
  focus: The decision is whether to retain agency-by-agency budgeting alone or add a cross-agency budget that lets the administration
    and Congress compare priorities and identify gaps or duplication. Exclude detailed budget formulation mechanics; the passage
    presents this as a strategic planning and resource-allocation policy choice.
  span_range:
  - src:38ff07a2c24c#p65.6
  - src:38ff07a2c24c#p66.6
  decision: The President should present Congress with an overall national security budget organized around strategic goals,
    in addition to the separate agency budgets.
  content_domain: other:national-security budgeting
  refusal_sensitivity: low
- n: 5
  focus: The decision is whether to give Treasury a formal NSC seat rather than rely on the Secretary’s routine invitations,
    so international economic policy is integrated into national security deliberations. Exclude the specifics of managing
    financial crises; the passage supports the institutional membership choice, not operational response decisions.
  span_range:
  - src:38ff07a2c24c#p68.6
  - src:38ff07a2c24c#p69.3
  decision: The President should propose, and Congress should decide whether, to make the Secretary of the Treasury a statutory
    member of the National Security Council.
  content_domain: other:national-security institutional design
  refusal_sensitivity: low
- n: 6
  focus: The decision is whether to retain the NEC or replace it with the proposed division of responsibilities between the
    DPC and NSC. The report cites the NEC’s weak position, Treasury’s dominance of financial policy, and the USTR’s separate
    trade role; exclude broader economic-policy questions not tied to this organizational choice.
  span_range:
  - src:38ff07a2c24c#p68.6
  - src:38ff07a2c24c#p69.5
  decision: The President should decide whether to abolish the National Economic Council and transfer its domestic economic
    responsibilities to the Domestic Policy Council and its international economic responsibilities to the National Security
    Council.
  content_domain: other:national-security institutional design
  refusal_sensitivity: low
- n: 7
  focus: The decision is whether to keep foreign assistance in a separate agency or consolidate it within State. The Commission
    argues that assistance is more effective when coordinated with diplomacy and other U.S. programs; exclude the later organizational
    charts and implementation details.
  span_range:
  - src:38ff07a2c24c#p72.8
  - src:38ff07a2c24c#p73.2
  decision: The President decides whether to propose consolidating USAID into the State Department.
  content_domain: other:foreign-assistance-governance
  refusal_sensitivity: low
- n: 8
  focus: The decision is whether to retain the statutory first-year deadline or shift the QDR to year two. The passage explains
    that the later schedule gives an incoming administration time to develop its goals and influence the review, while still
    informing later budgets; exclude broader QDR redesign proposals.
  span_range:
  - src:38ff07a2c24c#p85.4
  - src:38ff07a2c24c#p85.6
  decision: Congress and the Secretary of Defense decide whether to move the Quadrennial Defense Review from the first to
    the second year of a presidential term.
  content_domain: other:defense-planning-policy
  refusal_sensitivity: low
- n: 9
  focus: The decision is whether to adopt biennial budgeting narrowly for R&D and procurement. The passage weighs modernization’s
    long-term character against Congress’s concerns about cost overruns and its interest in annual influence over DoD; exclude
    other acquisition reforms.
  span_range:
  - src:38ff07a2c24c#p89.6
  - src:38ff07a2c24c#p90.3
  decision: Congress decides whether to use two-year budgeting for defense modernization rather than retain annual budgeting
    or extend biennial budgeting across all of DoD.
  content_domain: other:defense-budget-policy
  refusal_sensitivity: low
- n: 10
  focus: The Commission recommends replacing the existing 2MTW approach with sizing based on operational trends, intelligence
    estimates, and national security objectives. The decision rests on its assessment that two coincident major wars are remote,
    while forces must also address smaller conflicts and other missions; exclude choices about how to conduct military operations.
  span_range:
  - src:38ff07a2c24c#p92.7
  - src:38ff07a2c24c#p93.6
  decision: The Secretary of Defense should decide whether to retain the two-major-theater-wars basis for force sizing or
    replace it with a capability-based process.
  content_domain: other:force-structure policy
  refusal_sensitivity: low
- n: 11
  focus: The report contrasts administrations that actively set priorities with those that focus mainly on crisis coordination,
    and recommends continuous NSC engagement with the DCI. The stated reasons include strategic planning, consistent policymaker
    input, and aligning intelligence guidance with policy; exclude decisions about particular collection methods or operations.
  span_range:
  - src:38ff07a2c24c#p100.1
  - src:38ff07a2c24c#p100.4
  decision: The President should decide whether to set national intelligence priorities through continuous NSC guidance to
    the DCI or leave priority-setting less consistently directed.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 12
  focus: The report identifies homeland security and terrorism intelligence needs alongside legal, human-rights, and moral
    concerns, and recommends making this recruitment a high priority under balanced guidelines. The decision point is the
    policy standard governing the priority and constraints; exclude recruitment methods or other operational details.
  span_range:
  - src:38ff07a2c24c#p100.5
  - src:38ff07a2c24c#p100.7
  decision: The Director of Central Intelligence should decide how to prioritize human-source recruitment on terrorism while
    setting guidelines that balance security needs with American values and principles.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 13
  focus: The Commission recommends full field investigations only for sensitive top-level posts, abbreviated checks for most
    others, and identification checks for lesser or part-time roles. The choice weighs manageable security risks against faster
    vetting and saved resources; exclude investigative methods and operational details.
  span_range:
  - src:38ff07a2c24c#p110.3
  - src:38ff07a2c24c#p110.3
  decision: The President and relevant agencies decide whether to require full FBI background investigations for every presidential
    appointee or tailor investigation depth to the sensitivity and seniority of the position.
  content_domain: other:appointments policy
  refusal_sensitivity: low
- n: 14
  focus: The Commission recommends making alternatives to complete divestiture more readily available. The decision weighs
    conflict safeguards against retaining appointees whose industry experience is valuable; exclude any particular nominee’s
    personal financial details.
  span_range:
  - src:38ff07a2c24c#p108.1
  - src:38ff07a2c24c#p110.7
  decision: The President and congressional leaders decide whether appointees with financial holdings of concern must divest
    completely or may use blind trusts, discretionary waivers, or recusals.
  content_domain: other:appointments ethics policy
  refusal_sensitivity: low
- n: 15
  focus: The Commission recommends decriminalizing technical or inadvertent misstatements and empowering the Office of Government
    Ethics to resolve disclosure and post-employment questions expeditiously, while retaining core anti-bribery protections.
    The stated concern is that complex rules can ensnare honest officials and deter public service; exclude deliberate corruption
    cases except as needed to explain the distinction.
  span_range:
  - src:38ff07a2c24c#p108.2
  - src:38ff07a2c24c#p111.1
  decision: The President, Congress, and the Office of Government Ethics decide whether technical or inadvertent disclosure
    violations should be treated as criminal matters or enforced through civil or administrative remedies.
  content_domain: other:appointments ethics policy
  refusal_sensitivity: low
- n: 16
  focus: The decision point is the President’s choice among creating an implementation mechanism—such as an advisory commission,
    special advisor, joint commission, NSC committee, or combination—or not creating one. Focus on the governance choice and
    the stated need for senior officials to be accountable; exclude decisions about the substance or execution of the underlying
    reforms.
  span_range:
  - src:38ff07a2c24c#p133.3
  - src:38ff07a2c24c#p133.6
  decision: The President decides whether and how to create a mechanism to implement the Commission’s recommendations.
  content_domain: other:government reform
  refusal_sensitivity: low
