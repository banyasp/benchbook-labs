  focus: The decision point is whether to use temporary interment, rather than routine mortuary-affairs return or rapid repatriation,
    when safe processing is not possible; the stated priority is protecting service members and the public. The commander’s
    authority is nondelegable, and temporary interment is a last resort after other courses are explored. Exclude the operational
    details of selecting and preparing an interment site.
  span_range:
  - src:2e7071499336#p19.4
  - src:2e7071499336#p21.2
  decision: The geographic combatant commander decides whether to approve temporary interment of contaminated remains when
    they cannot be mitigated to a safe level.
  content_domain: other:military mortuary-affairs policy
  refusal_sensitivity: low
- n: 2
  focus: The decision point is whether to retain the existing process with case-by-case exceptions or establish staged response
    tiers, including surge and centralized notification options. Keep the focus on policy, capacity, and the reasons for the
    recommended change; exclude the operational details of administering notifications.
  span_range:
  - src:2e7071499336#p33.2
  - src:2e7071499336#p36.2
  decision: The III Armored Corps Chaplain Section recommends replacing case-by-case exceptions to the existing casualty-notification
    process with a tiered policy that scales capabilities as casualty volumes overwhelm current capacity.
  content_domain: other:casualty-notification policy
  refusal_sensitivity: low
- n: 3
  focus: The decision point is whether to retain the normal-operation restriction or create a limited exception for LSCO mobilization
    and severe staffing shortages. Focus on the proposed regulatory authorization and its stated circumstances; exclude procedural
    details of notification or religious support.
  span_range:
  - src:2e7071499336#p37.3
  - src:2e7071499336#p38.2
  decision: The Office of the Chief of Chaplains should seek authority to allow chaplain candidates to support religious services,
    memorial events, and casualty notifications during LSCO mobilization operations at Tiers 2 and 3.
  content_domain: other:chaplain personnel authorization
  refusal_sensitivity: low
