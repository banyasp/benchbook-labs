prompt: find_episodes.v1+316fb02bdef3
episodes:
- n: 1
  focus: The board weighed a strong DNI against leaving the existing arrangement in place and tied its recommendation to meaningful
    budgetary and personnel powers. It left the DNI’s institutional location unresolved because the board could not agree;
    exclude later implementation choices.
  span_range:
  - src:ad56cc1598ae#p11.3
  - src:ad56cc1598ae#p11.8
  decision: The President’s Foreign Intelligence Advisory Board (PFIAB) decided to recommend a Director of National Intelligence
    (DNI) with real authority over national intelligence agencies, budgets, and personnel, without choosing whether the DNI
    should be based in the White House or at CIA.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The board’s proposal favored CIA for administrative expediency and as a foundation for an autonomous center; it also
    sought presidential appointment of the center’s head and a distinct budget identity. Exclude operational counterterrorism
    methods and the later TTIC arrangement.
  span_range:
  - src:ad56cc1598ae#p10.3
  - src:ad56cc1598ae#p11.4
  decision: PFIAB decided to recommend housing the proposed National Counterterrorism Center (NCTC) within CIA as a separate
    entity, rather than placing it in DHS or making it part of a single agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The inquiry’s recommendation responded to reported failures to shift resources and develop an adequate interagency
    intelligence program after al-Qa‘ida became a recognized priority. The passage describes a strong DNI as its preferred
    remedy; exclude the later debate over which reform model Congress ultimately enacted.
  span_range:
  - src:ad56cc1598ae#p12.3
  - src:ad56cc1598ae#p12.6
  decision: The congressional Joint Inquiry decided to recommend creating a separate, Senate-confirmed DNI with strong authority
    over Intelligence Community personnel and resources.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The choice was between this more radical transfer and a less disruptive reorganization that retained the agencies
    in the Department of Defense. The stated reason was that the transfer seemed too disruptive during wartime, amid an intense
    military crisis in Iraq; exclude later legislative choices about the DNI’s authorities.
  span_range:
  - src:ad56cc1598ae#p16.7
  - src:ad56cc1598ae#p16.8
  decision: The President and senior White House principals rejected removing the national collection agencies from the Department
    of Defense and placing them under the new DNI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The choice was whether to declassify the budget’s top line as the Commission recommended or keep it classified. The
    passage attributes the rejection to accepting the argument that disclosure would expose intelligence programs and reflects
    concern about White House politicization; exclude the broader question of subsequent congressional budget control.
  span_range:
  - src:ad56cc1598ae#p17.2
  - src:ad56cc1598ae#p17.3
  decision: The President rejected declassifying the top line of the National Intelligence Program budget.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The choice was to accept the bill’s limited budget concessions and pursue enactment, or continue pressing for stronger
    provisions at the risk of losing the bill. The stated reasons were that the bill was near defeat, the Commission’s political
    leverage had peaked, and further substantive concessions were unlikely; exclude the separate merits of the final legislation’s
    individual provisions.
  span_range:
  - src:ad56cc1598ae#p18.3
  - src:ad56cc1598ae#p18.6
  decision: A former 9/11 Commission member chose to urge commissioners and congressional allies to accept the available compromise
    intelligence-reform bill.
  content_domain: intel-oversight
  refusal_sensitivity: medium
