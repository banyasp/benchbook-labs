  focus: The President accepted the recommendation to amend the order and set a disciplined, accelerated process, rather than
    defer the work or leave it to a new administration. The stated reasons included the need to align the order with the IRTPA,
    strengthen the DNI’s ability to lead the IC, and use trusted senior officials to reach agreement before a later team might
    pursue legislation with unpredictable results.
  span_range:
  - src:0e22b233fbb4#p5.2
  - src:0e22b233fbb4#p5.5
  decision: The President decides whether to launch and accelerate an amendment of EO 12333 in the administration’s final
    year.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The passage describes a choice between memorializing the expanded DNI authority in the executive order and using
    a side agreement. The Secretary of Defense worried that putting acquisition provisions in the order would draw congressional
    scrutiny and prompt legislation restoring authority he had relinquished; exclude acquisition implementation details.
  span_range:
  - src:0e22b233fbb4#p7.15
  - src:0e22b233fbb4#p8.3
  decision: The Secretary of Defense and DNI decide to extend shared acquisition authority through a side agreement rather
    than place the terms in EO 12333.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The dispute was whether the DNI would have a stronger selection or dismissal role or whether authority would remain
    with the Secretary of Defense. The compromise required the Secretary of Defense to consult the DNI but left the Secretary
    alone to recommend appointments and dismissals to the President; exclude personnel-selection mechanics beyond this allocation
    of authority.
  span_range:
  - src:0e22b233fbb4#p10.4
  - src:0e22b233fbb4#p10.8
  decision: The Secretary of Defense and DNI, with the National Security Advisor’s mediation, decide who controls recommendations
    on appointing and dismissing the Under Secretary of Defense for Intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The administration chose limited briefings for relevant committees instead of broader consultation, and declined
    requests for copies of the draft. The stated concern was that committee involvement could reopen provisions reflecting
    delicate executive-branch compromises; exclude the separate decision about when to announce the amendments.
  span_range:
  - src:0e22b233fbb4#p12.4
  - src:0e22b233fbb4#p12.7
  decision: The White House decides to give Congress notice and explanation of key EO amendments rather than consult extensively
    or provide the draft text.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The DNI and CIA held opposing views about overseas coordination, and a proposed compromise designating a DNI representative
    was abandoned. The final order gave the DNI a role in setting coordination policies while assigning roughly symmetrical
    coordination roles to the FBI domestically and CIA abroad; exclude any operational details about intelligence collection
    or covert activity.
  span_range:
  - src:0e22b233fbb4#p11.8
  - src:0e22b233fbb4#p12.4
  decision: The President and senior officials decide not to designate a DNI representative abroad and instead leave the order
    to assign coordination-policy and agency roles.
