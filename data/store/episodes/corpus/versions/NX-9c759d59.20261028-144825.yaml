episodes:
- n: 1
  focus: The decision point is whether to continue the existing approach or test a revised appraisal system. The source links
    the revision to a study that found a need for more supervisor training and describes goals including ongoing assessment
    and better use of employee abilities; exclude operational intelligence decisions.
  span_range:
  - src:d01ef6b39f25#p24.2
  - src:d01ef6b39f25#p25.3
  decision: NSA personnel officials decide to replace the AFSA-derived appraisal approach with a trial system using DA Form
    1052 and supporting supervisor guidance and training.
  content_domain: other:federal personnel policy
  refusal_sensitivity: low
- n: 2
  focus: The decision point is Congress’s choice to exempt NSA from the Act rather than leave the general appraisal requirements
    in place. The passage says the exemption’s origin is unclear, but a later memo cited the sensitivity of classified performance
    information and the risk its disclosure posed to NSA’s security and mission; do not claim that this rationale is documented
    as Congress’s deliberative basis.
  span_range:
  - src:d01ef6b39f25#p29.4
  - src:d01ef6b39f25#p29.13
  decision: Congress exempted NSA from the Performance Rating Act of 1950.
  content_domain: other:federal personnel policy
  refusal_sensitivity: low
- n: 3
  focus: In 1972, the Director chose to seek a new system rather than simply continue the existing one, and specified that
    it should reduce reliance on routine written reports while preserving useful records of performance. The stated concerns
    included inflated ratings, late appraisals, the cost of roughly 14,000 appraisals annually, and weak differentiation among
    performance levels; exclude later reform efforts not decided by this Director.
  span_range:
  - src:d01ef6b39f25#p35.14
  - src:d01ef6b39f25#p36.4
  decision: The NSA Director directed development of a replacement for the existing performance appraisal system.
  content_domain: other:federal personnel policy
  refusal_sensitivity: low
- n: 4
  focus: The Director chose to refocus the system from ranking employees against one another toward assessing performance
    against expectations and objectives. The passage attributes the changes to two years of experience, management surveys,
    and employee observations; exclude the detailed mechanics of individual forms and rating scales.
  span_range:
  - src:d01ef6b39f25#p42.6
  - src:d01ef6b39f25#p42.8
  decision: The NSA Director revised the Career Evaluation System effective January 1977, ending peer-group rankings and largely
    dropping forced-distribution guidance.
  content_domain: other:federal personnel policy
  refusal_sensitivity: low
- n: 5
  focus: After the General Counsel questioned whether rating definitions were clear enough for uniform interpretation, leadership
    could retain the fixed quota or revise the system. It redefined the rating levels, removed the cap on Level 7 ratings,
    and retained separate top-performer identification requirements; exclude the mechanics of recording those designations
    on forms.
  span_range:
  - src:d01ef6b39f25#p44.2
  - src:d01ef6b39f25#p44.7
  decision: NSA personnel leadership revised Level 7 ratings by removing the fixed 6% cap while retaining identification of
    top performers.
  content_domain: other:personnel policy
  refusal_sensitivity: low
- n: 6
  focus: The proposed changes addressed appraisal delays and supervisory workload, and concerns that lower-grade top-performer
    data was not useful and could cause inequities and poor morale. The Deputy Director for Operations approved the changes
    with a minor modification; exclude the form-filling details.
  span_range:
  - src:d01ef6b39f25#p44.9
  - src:d01ef6b39f25#p44.16
  decision: The Deputy Director for Operations approved streamlining the appraisal system by eliminating forms and some top-performer
    designations.
  content_domain: other:personnel policy
  refusal_sensitivity: low
- n: 7
  focus: NSA could have retained its existing system or voluntarily adopted a system parallel to the CSRA. The selected approach
    linked performance appraisals to salary increases and other personnel actions, with no preset rating quotas; exclude the
    specific forms and rating procedures.
  span_range:
  - src:d01ef6b39f25#p47.3
  - src:d01ef6b39f25#p47.15
  decision: The NSA Director and agency leadership chose a new appraisal system tied to performance-based personnel and salary
    decisions, despite NSA’s exemption from the CSRA.
  content_domain: other:personnel policy
  refusal_sensitivity: low
- n: 8
  focus: The Director faced a choice between stopping a survey already distributed and allowing it to continue, while the
    agency was considering replacing PPEC. The stated concern against stopping was that doing so could send a bad signal to
    employees; the survey was to inform the review, not determine whether PPEC would be retained. Exclude the merits of the
    survey’s design beyond this decision to proceed.
  span_range:
  - src:d01ef6b39f25#p50.4
  - src:d01ef6b39f25#p51.3
  decision: The NSA Director allowed the workforce survey on the PPEC system to proceed despite senior managers’ objections.
  content_domain: other:personnel policy
  refusal_sensitivity: low
- n: 9
  focus: The pilot raised concerns that behaviors overlapped objectives, were poorly defined, and could be arbitrary or subjective;
    the Task Force chose measurable objectives linked to the organization’s mission. Include the design tradeoff and its rationale,
    but exclude the system’s mechanics and later administrative changes.
  span_range:
  - src:d01ef6b39f25#p61.7
  - src:d01ef6b39f25#p63.1
  decision: The NSA Performance Management Reform Task Force chose to base P3 evaluations initially on measurable, weighted
    objectives rather than also rating performance behaviors.
  content_domain: other:personnel management
  refusal_sensitivity: low
- n: 10
  focus: The Secretary weighed current operational tempo and congressional concerns against the goal of a common performance-oriented
    framework. Include the choice to stop DCIPS implementation and the stated reasons; exclude the subsequent details of work-role
    mapping and routine ACE changes.
  span_range:
  - src:d01ef6b39f25#p74.6
  - src:d01ef6b39f25#p74.16
  decision: The Secretary of Defense decided not to implement DCIPS at NSA, retaining ACE while pursuing a common performance-oriented
    personnel framework.
  content_domain: other:personnel management
  refusal_sensitivity: low
- n: 11
  focus: The decision point is the working group’s 2011 recommendation to use pass-fail ratings rather than a more differentiated
    rating system. The stated reasons were simplicity and consistency, fewer grievances, and shifting managers’ attention
    from the final rating to performance throughout the year; do not treat the recommendation as an adopted policy.
  span_range:
  - src:d01ef6b39f25#p79.1
  - src:d01ef6b39f25#p79.1
  decision: A Department of Defense working group recommended rating all civilian employees on a pass-fail basis, with supervisors
    giving ongoing performance feedback.
  content_domain: other:personnel policy
  refusal_sensitivity: low
- n: 12
  focus: The stated concern was that Human Resources was already handling the Thrift Savings Plan and supporting employees
    eligible to convert from CSRS to FERS; additional change could overburden HR and employees. Treat the cautious approach
    as a recommendation, not evidence that it was adopted; the excerpt does not detail the alternatives or a final decision.
  span_range:
  - src:d01ef6b39f25#p119.1
  - src:d01ef6b39f25#p119.1
  decision: The chief of M33 recommended moving very cautiously on introducing a new performance appraisal system in 1987.
  content_domain: other:government personnel policy
  refusal_sensitivity: low
