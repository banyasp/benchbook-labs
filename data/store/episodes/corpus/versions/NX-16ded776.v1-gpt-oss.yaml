episodes:
- n: 1
  focus: The decision concerns granting exclusive use of a designated airspace for a training event versus allowing shared
    use. The AT&A Officer must weigh safety, emergency needs, and compatibility with other airspace users, following FAA regulations
    and ATC orders. The outcome determines if the training has sole access or must share the airspace.
  span_range:
  - src:7d3d18fd2ec8#p7.7
  - src:7d3d18fd2ec8#p7.10
  decision: Airspace Manager/AT&A Officer decides whether to grant exclusive use of the training airspace
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Installation Spectrum Manager must choose to approve EA requests for training ranges on an annual cycle, initiating
    the process 120 days before expiration to ensure continuous training. The decision balances the need for uninterrupted
    training against compliance with spectrum management policies and coordination timelines.
  span_range:
  - src:7d3d18fd2ec8#p18.1
  - src:7d3d18fd2ec8#p18.3
  decision: Installation Spectrum Manager decides on yearly Electronic Attack (EA) clearance approvals for MDO ranges
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The commander must decide to submit a TBCF request at least 90 days before the event, weighing the need for realistic
    threat simulation against resource availability and scheduling constraints. Authority rests with PEO STRI CT2 TSMO Operations,
    and the decision enables integrated threat capabilities for the training.
  span_range:
  - src:7d3d18fd2ec8#p14.6
  - src:7d3d18fd2ec8#p14.7
  decision: Unit commander decides whether to request Threat Battle Command Force (TBCF) support for a training event
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The unit (e.g., a brigade or battalion) must choose to request EA support, weighing the need to replicate near‑peer
    electromagnetic threats against spectrum‑management constraints and regulatory approvals. The decision follows CJCSM 3212.02F
    and requires coordination with the Installation Spectrum Manager (ISM), Army Frequency Management Office (AFMO), FAA and
    FCC.
  span_range:
  - src:7d3d18fd2ec8#p40.7
  - src:7d3d18fd2ec8#p40.14
  decision: Unit decides whether to submit an Electromagnetic Attack (EA) clearance request memorandum for training exercises.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The commander evaluates whether to apply emission control (EMCON) and related EP tasks to reduce detection by adversary
    sensors, mitigate friendly interference, and support OPSEC. The decision references FM 3‑12, 1‑51 and balances training
    realism with spectrum‑use constraints.
  span_range:
  - src:7d3d18fd2ec8#p33.11
  - src:7d3d18fd2ec8#p34.2
  decision: Unit commander decides to implement Electromagnetic Protection (EP) measures, specifically EMCON, for training
    and operational security.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The decision weighs the benefit of near‑real‑time intelligence dissemination against the need for authorized cryptologic
    keys, compliance with IBS producer restrictions, and coordination requirements. It is guided by the requirement that only
    authorized producers may publish to IBS and that receivers must have proper keys.
  span_range:
  - src:7d3d18fd2ec8#p39.9
  - src:7d3d18fd2ec8#p39.14
  decision: Brigade/S‑2 decides whether to incorporate the Integrated Broadcast Service (IBS) feed into training and operational
    communications.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
