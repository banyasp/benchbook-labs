episodes:
- n: 1
  focus: The document describes Congress facing the choice of compelling testimony with use‑immunity versus not compelling
    it, and explains that it chose to compel to restore political confidence and expose flaws in the national‑security apparatus.
  span_range:
  - src:49ce34ffe1d8#p1.1
  - src:49ce34ffe1d8#p1.1
  decision: Congress decided to compel immunized testimony from Iran/Contra figures under 18 U.S.C. 6002.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: Faced with the risk that congressional use‑immunity would undermine prosecution, the Independent Counsel chose to
    expedite certain investigative steps, memorialize pre‑immunity statements, and adopt procedures to prevent exposure to
    immunized disclosures.
  span_range:
  - src:49ce34ffe1d8#p1.2
  - src:49ce34ffe1d8#p1.2
  decision: The Office of Independent Counsel decided to implement prophylactic procedures (including “canning” statements)
    to shield the prosecution from taint by immunized testimony.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: Confronted with the issue that immunized testimony may have refreshed witnesses’ memories, the appellate panel chose
    to overturn the convictions and require the district court to conduct line‑by‑line hearings to determine whether each
    witness’s recollection was untainted.
  span_range:
  - src:49ce34ffe1d8#p1.5
  - src:49ce34ffe1d8#p1.5
  decision: The Court of Appeals majority decided to set aside the North and Poindexter convictions and remand for a detailed,
    witness‑by‑witness inquiry into possible taint from immunized testimony.
  content_domain: other:judicial-procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
