  focus: The decision point is whether to leave counterintelligence leadership fragmented and largely advisory or give the
    NCIX stronger community-wide authority. Keep the scenario at the level of governance, budgeting, coordination, and accountability;
    exclude operational counterintelligence methods.
  span_range:
