  refusal_sensitivity: medium
- n: 48
  focus: The decision point is how to govern interagency coordination and resolve conflicts over domestic foreign-intelligence
    activity. Exclude operational details of intelligence collection; the focus is institutional authority, coordination,
    and legal limits.
  span_range:
  - src:c9afb40358f9#p487.2
  - src:c9afb40358f9#p488.4
  decision: The Commission recommends that CIA–FBI domestic intelligence coordination be handled through a fluid system, with
    conflicts resolved by the DNI or, on questions of legality, the Attorney General, rather than through the FBI’s proposed
    restrictive controls.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 49
  focus: The decision point is whether to retain the divided organizational structure or establish a single senior official
    to supervise the Department’s national-security components. The source also discusses a possible Associate Attorney General
    structure, but the formal recommendation is the new Assistant Attorney General.
  span_range:
  - src:c9afb40358f9#p488.6
  - src:c9afb40358f9#p490.4
  decision: The Commission recommends that the Department of Justice place OIPR, Counterespionage, and Counterterrorism under
    a new Assistant Attorney General for National Security.
