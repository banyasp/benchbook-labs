    disputes unresolved or pushing them to overburdened senior managers. It recommends giving a single office under the DNI
    responsibility for sharing, technology, and security so those interests can be balanced through risk management; exclude
    specific network-security methods.
  span_range:
  - src:c9afb40358f9#p453.3
  - src:c9afb40358f9#p455.2
  decision: The DNI decides whether to place information-sharing and information-security responsibilities in one office or
    leave them in separate chains of command.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 47
  focus: The decision point is the commission’s policy choice among an in-FBI service, a separate intelligence agency, and
    the existing structure, and its reasons for preferring the in-FBI option. Treat this as a recommendation, not an enacted
    decision; exclude operational collection and implementation details.
  span_range:
  - src:c9afb40358f9#p482.3
  - src:c9afb40358f9#p485.4
  decision: The commission decides whether to recommend consolidating the FBI’s national-security divisions in a National
    Security Service within the FBI or creating a separate domestic intelligence agency; it recommends the in-FBI service.
