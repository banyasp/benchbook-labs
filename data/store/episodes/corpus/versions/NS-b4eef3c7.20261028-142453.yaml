  refusal_sensitivity: medium
- n: 55
  focus: The report recommends a remote, real-time decision process because time-sensitive interdictions may not wait for
    a weekly meeting, and targets can raise sensitive diplomatic and legal issues requiring NSC approval. Focus on approval
    and oversight procedures, not the execution of any interdiction operation.
  span_range:
  - src:c9afb40358f9#p543.3
  - src:c9afb40358f9#p543.5
  decision: The President should decide whether to establish a real-time interagency approval process for counterproliferation
    interdiction plans instead of relying on the existing weekly NSC meeting.
  content_domain: intel-oversight
  refusal_sensitivity: high
