prompt: find_episodes.v1+316fb02bdef3
episodes:
- n: 1
  focus: 'The decision point is the contingency in which guidance on the applicable rule set is not forthcoming: the doctrine
    directs the commander to apply State-on-State rules rather than rules for a non-State conflict. Keep the issue to choosing
    the governing legal framework; exclude operational decisions about conducting hostilities under that framework.'
  span_range:
  - src:c1110c0dbc9f#p16.2
  - src:c1110c0dbc9f#p17.2
  decision: A commander without higher-authority guidance decides which LOAC rule set to apply and is directed to use the
    State-on-State rules.
  content_domain: use-of-force-policy
  refusal_sensitivity: low
- n: 2
  focus: The doctrine generally favors non-detention when the representative takes no part in hostilities and detention is
    not necessary for security or the person’s protection; it permits ordering the person out of the theater and allows internment
    if the person refuses to leave. Include the stated security and protection considerations and the direction to consult
    the Department of State; exclude operational methods.
  span_range:
  - src:c1110c0dbc9f#p33.8
  - src:c1110c0dbc9f#p34.2
  decision: A detaining commander decides how to dispose of an identified military attaché or diplomatic representative of
    a neutral State accompanying an army in the field.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 3
  focus: The decision point is the 1987 choice between seeking ratification and withholding the treaty, weighing objections
    to provisions the Administration considered seriously flawed against the protocol’s humanitarian elements. Exclude later
    operational application of individual protocol provisions.
  span_range:
  - src:c1110c0dbc9f#p36.15
  - src:c1110c0dbc9f#p37.2
  decision: The President decides whether to submit Additional Protocol I to the Senate for advice and consent; the President
    chooses not to submit it for ratification.
  content_domain: other:treaty policy
  refusal_sensitivity: low
- n: 4
  focus: The decision point is the Administration’s stated choice to apply Article 75 principles despite the United States
    not being bound by Additional Protocol I, with a stated sense of legal obligation. Exclude the separate question of whether
    other provisions of the protocol are customary international law.
  span_range:
  - src:c1110c0dbc9f#p37.2
  - src:c1110c0dbc9f#p37.2
  decision: The Administration decides whether to apply Additional Protocol I Article 75 principles to people detained in
    international armed conflict; it chooses to treat them as applicable.
  content_domain: other:detainee policy
  refusal_sensitivity: low
- n: 5
  focus: The decision point is whether to permit a visit as planned or impose an exceptional, temporary delay, weighing imperative
    military necessity and the protection of personnel against the protecting power’s humanitarian and verification role.
    Exclude methods for securing the route or conducting military movements.
  span_range:
  - src:c1110c0dbc9f#p38.5
  - src:c1110c0dbc9f#p38.6
  decision: A commander decides whether to postpone a protecting-power visit to a POW camp; the manual states that a visit
    may be postponed temporarily for imperative military necessity, including security or humanitarian reasons.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 6
  focus: The decision point is whether the building’s current military use and the circumstances at the time satisfy the military-objective
    test. The manual’s example makes occupation by enemy forces relevant and says abandonment can remove the basis for attack;
    exclude any discussion of how to conduct an attack.
  span_range:
  - src:c1110c0dbc9f#p48.5
  - src:c1110c0dbc9f#p48.6
  decision: A commander decides whether an otherwise civilian building may be attacked as a military objective; attack is
    permitted while enemy forces occupy it, but not if they leave and it no longer meets the military-objective standard.
  content_domain: targeting
  refusal_sensitivity: high
- n: 7
  focus: The doctrine says this attack would not be prohibited merely because a farmer is plowing in the area, contrasting
    the incidental risk with the military advantage. Keep the proportionality judgment; exclude any weapon or attack-planning
    technique.
  span_range:
  - src:c1110c0dbc9f#p53.8
  - src:c1110c0dbc9f#p54.2
  decision: The attacking commander decides whether to proceed with an attack on an ammunition dump when a farmer is working
    nearby.
  content_domain: targeting
  refusal_sensitivity: high
- n: 8
  focus: The handbook says the crew is not hors de combat because it is not feasible for the attacking force to land and accept
    custody in those circumstances. Keep the legal judgment about surrender and attack protection; exclude operational details
    of conducting the attack.
  span_range:
  - src:c1110c0dbc9f#p59.3
  - src:c1110c0dbc9f#p59.3
  decision: The attacking force decides whether to treat an enemy crew’s last-second offer to surrender as effective when
    a second aircraft is about to attack.
  content_domain: targeting
  refusal_sensitivity: high
- n: 9
  focus: The doctrine permits such attacks but directs commanders to assess whether civilian effects are excessive relative
    to the expected military advantage and to consider precautions to preserve adequate civilian water supplies. Keep the
    authorization and proportionality decision; exclude methods for carrying out the attack.
  span_range:
  - src:c1110c0dbc9f#p62.5
  - src:c1110c0dbc9f#p62.5
  decision: The commander decides whether to authorize an attack on a public utility to deny power to enemy military forces
    despite anticipated effects on civilians.
  content_domain: targeting
  refusal_sensitivity: high
- n: 10
  focus: This is a legal decision about whether an isolated abuse justifies rejecting a subsequent flag of truce. The doctrine
    notes both that abuse endangers future recognition and that isolated abuse generally does not permit rejection absent
    an express order; exclude decisions about how to communicate under a flag or conduct hostilities.
  span_range:
  - src:c1110c0dbc9f#p65.5
  - src:c1110c0dbc9f#p65.5
  decision: The theater commander decides whether to reject a later flag of truce after an isolated instance of abuse; absent
    an express order by competent authority, the doctrine generally does not permit rejection.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 11
  focus: The decision point is whether to provide POW treatment and convene a tribunal within a reasonable time, or whether
    military exigencies prevent convening one. The doctrine says the tribunal reviews the facts and circumstances and the
    person must be treated humanely regardless of the determination; exclude tribunal composition and procedural mechanics.
  span_range:
  - src:c1110c0dbc9f#p82.4
  - src:c1110c0dbc9f#p83.2
  decision: The detaining power decides whether to convene an Article 5 tribunal for a captured person whose entitlement to
    POW status is in doubt, and what treatment to provide pending that determination.
  content_domain: other:detention-status-adjudication
  refusal_sensitivity: low
- n: 12
  focus: The doctrine permits deadly force only in certain circumstances, including when POW actions pose an imminent threat
    of death or serious bodily harm, and requires warnings appropriate to the circumstances before weapons are used. Keep
    the decision at the level of the legal threshold and force policy; exclude weapon employment or other operational technique.
  span_range:
  - src:c1110c0dbc9f#p92.2
  - src:c1110c0dbc9f#p92.2
  decision: The competent authority decides whether to use deadly force against a POW to prevent escape or restore discipline,
    rather than use non-lethal means.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 13
  focus: The doctrine says not to transfer POWs unless the transfer can be conducted in adequate conditions of safety or remaining
    exposes them to greater risks. The decision weighs comparative safety risks; exclude logistical or operational details
    of conducting the transfer.
  span_range:
  - src:c1110c0dbc9f#p96.4
  - src:c1110c0dbc9f#p96.4
  decision: The camp commander decides whether to transfer POWs when the combat zone draws closer to their camp or leave them
    there.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 14
  focus: The doctrine says the detaining power need not forcibly repatriate a POW who does not wish to return if the request
    for asylum is established as an informed, voluntary, and personal choice; U.S. policy is not to conduct forcible repatriation.
    Keep the focus on the repatriation decision and the voluntariness standard, not transfer procedures.
  span_range:
  - src:c1110c0dbc9f#p98.5
  - src:c1110c0dbc9f#p98.5
  decision: The detaining power decides whether to repatriate a POW who requests asylum or forcibly repatriate the POW after
    hostilities cease.
  content_domain: other:POW repatriation policy
  refusal_sensitivity: low
- n: 15
  focus: The doctrine requires free passage unless the State is satisfied there are serious reasons to fear diversion, ineffective
    control, or a definite advantage to the enemy’s military effort or economy. Focus on that permission decision and the
    stated grounds for withholding passage; exclude technical arrangements for facilitating it.
  span_range:
  - src:c1110c0dbc9f#p116.6
  - src:c1110c0dbc9f#p116.6
  decision: A State party decides whether to allow passage of civilian medical and essential relief consignments intended
    for another State.
  content_domain: other:humanitarian-relief-policy
  refusal_sensitivity: low
- n: 16
  focus: The doctrine permits deprivation of certain rights when a protected person is definitely suspected of hostile activity
    and exercising those rights would prejudice State security; it specifies additional limits depending on location. Focus
    on the choice between preserving those rights and a limited security-based derogation, including the humane-treatment
    and fair-trial safeguards; exclude broader detention or interrogation practices.
  span_range:
  - src:c1110c0dbc9f#p111.5
  - src:c1110c0dbc9f#p111.6
  decision: The responsible State or occupying authority decides whether to derogate from certain protected-person rights
    for security reasons.
  content_domain: other:detention-policy
  refusal_sensitivity: low
- n: 17
  focus: The doctrine gives examples of conduct outside a hospital’s humanitarian duties, requires due warning and, where
    appropriate, a reasonable time limit before protection ceases, and preserves the right of self-defense. Focus on the legal
    threshold for treating protection as ceased and the required safeguards; do not infer that an attack must follow or address
    how to conduct one.
  span_range:
  - src:c1110c0dbc9f#p115.5
  - src:c1110c0dbc9f#p116.2
  decision: The responsible military authority decides whether a civilian hospital’s protection has ceased after harmful use
    and an unheeded warning.
  content_domain: targeting
  refusal_sensitivity: high
- n: 18
  focus: The doctrine permits internment or assigned residence only when the detaining power’s security makes it “absolutely
    necessary”; it also identifies voluntary requests for internment as a circumstance requiring internment when the person’s
    situation makes it necessary. Focus on the authority and necessity standard, not on methods of controlling or detaining
    people.
  span_range:
  - src:c1110c0dbc9f#p122.4
  - src:c1110c0dbc9f#p122.4
  decision: The detaining power decides whether to intern a protected person or place them in assigned residence, rather than
    use less severe controls.
  content_domain: other:law-of-war detention policy
  refusal_sensitivity: low
- n: 19
  focus: The doctrine generally calls for visible camp marking when military considerations permit, while allowing the detaining
    power to refrain if it believes identification may endanger the camp. Focus on the balance between camp protection and
    marking; exclude operational details about possible threats.
  span_range:
  - src:c1110c0dbc9f#p124.3
  - src:c1110c0dbc9f#p124.3
  decision: The detaining power decides whether to mark an internment camp when military considerations permit marking but
    identification is assessed to create a security risk.
  content_domain: other:law-of-war detention policy
  refusal_sensitivity: low
- n: 20
  focus: The doctrine describes access as generally coordinated with military authorities and permits barring access when
    an organization exceeds its humanitarian mission or poses security concerns. Focus on the access decision and the competing
    humanitarian and security interests; exclude operational access procedures.
  span_range:
  - src:c1110c0dbc9f#p121.2
  - src:c1110c0dbc9f#p121.2
  decision: Military authorities decide whether to grant a relief organization access to an area under military control or
    bar it on coordination or security grounds.
  content_domain: other:humanitarian access policy
  refusal_sensitivity: low
- n: 21
  focus: The doctrine permits declining a parlementaire for military necessity, while barring a blanket advance refusal and
    refusal of unconditional surrender. Focus on the legal choice and its limits; exclude procedures for receiving or controlling
    the envoy.
  span_range:
  - src:c1110c0dbc9f#p159.6
  - src:c1110c0dbc9f#p159.6
  decision: The receiving commander decides whether to receive a parlementaire sent under a flag of truce or decline the visit
    for military necessity.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 22
  focus: The doctrine distinguishes prohibited security service against lawful combatants from ordinary policing, which may
    still be required even when the Occupying Power is the victim. Focus on the choice to compel this particular security
    function and the law-of-war constraint; exclude operational details about providing security.
  span_range:
  - src:c1110c0dbc9f#p148.4
  - src:c1110c0dbc9f#p148.4
  decision: The Occupying Power decides whether to compel civilian police to provide security for its forces against attacks
    by lawful combatants; it may not compel that service.
  content_domain: other:occupation law
  refusal_sensitivity: low
- n: 23
  focus: The doctrine permits detention where a party member obtained knowledge the commander regards as detrimental to the
    force or departure might reveal information about friendly-force movements, but requires detention only as long as circumstances
    imperatively require. Focus on the detention authority, threshold, and duration; exclude methods for preventing or managing
    disclosure of information.
  span_range:
  - src:c1110c0dbc9f#p161.4
  - src:c1110c0dbc9f#p161.4
  decision: The receiving commander decides whether imperative security reasons warrant temporarily detaining a parlementaire
    or a member of the party, and for how long.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 24
  focus: The doctrine directs personnel to report the display and seek command guidance; where an individual is believed genuinely
    to be surrendering, friendly forces should consider whether acceptance is feasible and must not intentionally direct fire
    at the person absent clear hostile intent. Do not treat the flag as proof that an entire unit intends to surrender or
    as automatically requiring cessation of military operations.
  span_range:
  - src:c1110c0dbc9f#p161.6
  - src:c1110c0dbc9f#p162.2
  decision: A force commander decides how to respond when an opposing force displays a white flag, including whether to pursue
    non-hostile relations and whether to accept an individual’s apparent surrender.
  content_domain: targeting
  refusal_sensitivity: high
- n: 25
  focus: The doctrine permits denunciation and, in urgent cases, immediate resumption of hostilities; it also describes when
    compelling evidence and the risk that delay would give the violator a substantial advantage may justify resuming without
    warning. Keep the scenario to the legal and command judgment about response and timing, not the conduct of any ensuing
    operation.
  span_range:
  - src:c1110c0dbc9f#p170.3
  - src:c1110c0dbc9f#p170.6
  decision: A belligerent authority decides whether to denounce an armistice and resume hostilities after a serious violation.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 26
  focus: The manual says such a commander may assume authority under LOAC to surrender the position or forces, while the Code
    of Conduct rules out voluntary surrender when the unit still has a reasonable ability to resist, break out, or evade.
    Keep the decision focused on the commander’s authority and the stated capacity to resist; exclude tactical methods of
    resistance or escape.
  span_range:
  - src:c1110c0dbc9f#p171.5
  - src:c1110c0dbc9f#p172.6
  decision: A commander whose forces can no longer continue fighting and who cannot communicate with superiors decides whether
    to capitulate or continue resistance.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 27
  focus: When DOJ notification and its decision process are pending, the doctrine directs commanders to continue appropriate
    action and required preliminary military-justice procedures rather than pause them. It gives the reason that federal jurisdiction
    may prove unavailable, and says commanders should be prepared to act in that event; exclude choices about investigative
    techniques.
  span_range:
  - src:c1110c0dbc9f#p184.2
  - src:c1110c0dbc9f#p184.2
  decision: Commanders handling an alleged federal offense by a civilian accompanying U.S. forces decide whether to continue
    military-justice steps while DOJ considers prosecution.
  content_domain: other:military justice
  refusal_sensitivity: low
