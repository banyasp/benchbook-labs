  focus: The decision was whether to create a central intelligence arrangement and how to balance presidential access and
    coordination with the existing departments’ roles. The President chose a committee-based authority after seeking recommendations
    from department heads, against alternatives including a service reporting directly to the President or an expanded FBI
    role; the stated concerns included fragmented reporting and the need for coordinated information. Exclude the operational
    methods of intelligence collection.
