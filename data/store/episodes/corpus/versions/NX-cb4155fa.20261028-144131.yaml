    a cabinet-level DNI separate from the CIA director and said he did not. Focus on the institutional tradeoff and his stated
    rationale; exclude operational intelligence activities.
  span_range:
  - src:260ed4d570df#p294.6
  - src:260ed4d570df#p294.6
  decision: The DCI chose to oppose separating the head of the Intelligence Community from the head of CIA.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 47
  focus: The 9/11 Commission recommended a center to integrate organizations and information; the President established the
    center by executive action, and Congress later codified its responsibilities. Focus on the policy choice to combine analysis,
    planning, and assignment of agency responsibilities; exclude any operational methods or plans.
  span_range:
  - src:260ed4d570df#p300.4
  - src:260ed4d570df#p304.2
  decision: The President and Congress chose to establish a National Counterterrorism Center with intelligence-analysis and
    strategic operational-planning responsibilities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 48
  focus: A bipartisan group urged waiting for the new Congress to consider reform more carefully, but Congress proceeded with
    unusually intense work and enacted a compromise bill. Focus on the legislative choice over reform timing and the allocation
    of authority between the DNI and the Secretary of Defense; exclude implementation details that do not bear on that policy
    choice.
  span_range:
  - src:260ed4d570df#p302.4
  - src:260ed4d570df#p303.3
  decision: Congress chose to enact a compromise intelligence-reform law creating a DNI rather than defer consideration for
    further deliberation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 49
  focus: The decision followed the post-9/11 conclusion that the DCI structure was insufficient for a broadened mission requiring
    better integration of foreign and domestic intelligence. Compare creating the DNI and center with retaining the existing
    structure or relying on the previously discussed centralization options; exclude operational intelligence-gathering methods.
  span_range:
  - src:260ed4d570df#p317.4
  - src:260ed4d570df#p317.5
  decision: The 9/11 Commission, the president, and Congress decide to replace the DCI as the singular intelligence-community
    leader with a DNI and a National Counterterrorism Center.
  content_domain: other:intelligence-community-management
  refusal_sensitivity: medium
- n: 50
  focus: The commission weighs improved coordination through centers against assigning mission managers, citing risks that
    centers could crowd out competitive analysis, create substantive stovepipes, and provoke turf wars. Keep the scenario
    at the level of intelligence-management policy, not operational collection or analysis techniques.
  span_range:
  - src:260ed4d570df#p318.3
  - src:260ed4d570df#p318.3
  decision: The WMD Commission recommends that the DNI use mission managers rather than create a broader network of intelligence
    centers for priority issues.
  content_domain: other:intelligence-community-management
  refusal_sensitivity: medium
