- n: 1
  focus: The pilot could have abandoned or changed the ROTC plan rather than try to meet both it and the overnight requirement;
    he believed the compressed timeline was safe and still wanted to support the event. Focus on the risk judgment and competing
    commitments, not the later flight mechanics or accident sequence.
  span_range:
  - src:57188a9196b4#p2.3
  - src:57188a9196b4#p2.4
  decision: The mishap pilot chose to preserve his ROTC commitment by flying an aggressive cross-country schedule under the
    squadron commander’s new overnight-at-Ellington policy.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 2
  focus: The decision point is whether to retain the existing arrangements or impose a uniform Ellington overnight requirement
    while revising reimbursement. The report gives centralization, concerns about policy complaints and additional costs,
    and the commander’s desire to end repeated discussion as reasons; exclude the subsequent flight-handling decisions.
  span_range:
  - src:57188a9196b4#p38.2
  - src:57188a9196b4#p39.2
  decision: The 50 FTS/CC changed the squadron cross-country policy to require overnight stays at Ellington Field and allow
    full per diem.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 3
  focus: After the commander changed the overnight requirement, the pilot faced whether to drop the Citadel event or attempt
    to satisfy both obligations, and whether to stop at Mobile rather than continue to Ellington. The report cites professional
    obligation, the aircraft’s required destination, and the pilot’s belief that time remained; exclude the flight-control
    and landing decisions.
  span_range:
  - src:57188a9196b4#p39.2
  - src:57188a9196b4#p42.4
  decision: The mishap pilot chose to keep the Citadel commitment and proceed with the Ellington overnight requirement rather
    than opt out or stop at Mobile.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 4
  focus: The decision point is whether to use the four-sortie schedule or a lower-tempo plan. The commander sought to complete
    training requirements, build proficiency, and stretch limited travel funds; the report also describes concerns about fatigue
    and whether the training benefit justified the risk. Exclude individual flight-procedure choices.
  span_range:
  - src:57188a9196b4#p51.3
  - src:57188a9196b4#p52.4
  decision: The squadron commander chose a high-tempo continuation-training cross-country schedule, including four sorties
    per day on Friday and Saturday.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 5
  focus: 'The decision point is whether to allow the Charleston overnight or require Ellington. The report gives the commander’s
    reasons: applying the cross-country policy consistently and avoiding actual or perceived favoritism, particularly given
    a fellow pilot’s concerns about squadron policy. Exclude the later flight procedures and mishap sequence.'
  span_range:
  - src:57188a9196b4#p60.3
  - src:57188a9196b4#p60.3
  decision: The squadron commander chose to require the mishap pilot to stay overnight at Ellington Field rather than follow
    the previously approved Charleston itinerary.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 6
  focus: The decision point is whether to gather details and elevate the concern for supervisory risk review or leave the
    matter with the pilot. The officer believed the plan could work if properly planned; the report says the concern was not
    escalated. Exclude the pilot’s later in-flight decisions.
  span_range:
  - src:57188a9196b4#p53.2
  - src:57188a9196b4#p53.2
  decision: The assistant operations officer chose not to elevate a concern about the pilot’s expected long day and left risk
