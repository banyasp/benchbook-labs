episodes:
- n: 1
  focus: The proposed transition paired Batista’s departure with assurances for his safety, associates, and assets, and envisioned
    later free elections. The stated aim was to weaken Castro’s support while seeking an orderly transfer; exclude the mechanics
    of the proposed mission and any operational planning.
  span_range:
  - src:646bd5e7e6a5#p18.3
  - src:646bd5e7e6a5#p20.3
  decision: Representatives of the Department of State and CIA chose to support a junta to replace Batista rather than allow
    the elected successor to take office.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
- n: 2
  focus: The directive treated the revolutionary government, for the time being, as basically non-Communist with legitimate
    reform goals deserving respect and support. It set conditions for re-examining direct action and instructed that violent
    action be discouraged pending a policy change; exclude contingency-asset planning and operational details.
  span_range:
  - src:646bd5e7e6a5#p36.9
  - src:646bd5e7e6a5#p37.5
  decision: The CIA policy-makers who approved the November 1959 Related Mission Directive chose rapprochement and non-forceful
    covert support unless specified conditions justified reconsidering direct action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 3
  focus: The proposed objective was removal of the Castro government within a year and a junta that would call elections;
    the memorandum also urged consideration of removing Castro because his successors were thought to lack his appeal. The
    passage records concurrence and approval. Treat this only as a decision about authorizing regime-change policy; exclude
    the listed operational measures and any method of violent removal.
  span_range:
  - src:646bd5e7e6a5#p37.6
  - src:646bd5e7e6a5#p39.12
  decision: The CIA Director, with concurrence from the Deputy Director for Plans, approved a covert-action policy aimed at
    overthrowing Castro and replacing his government with a U.S.-friendly junta.
  content_domain: other:covert-action-policy
  refusal_sensitivity: high
- n: 4
  focus: The decision point is whether to use the usual command channel or give the project chief a direct channel to the
    DDP. The stated reasons were the precedent of the Guatemalan operation and the view that the division chief was not effective
    enough for a fast-moving, large, complex paramilitary project; exclude speculation about personal or political motives.
  span_range:
  - src:646bd5e7e6a5#p47.5
  - src:646bd5e7e6a5#p48.3
  decision: The DDP decided that the Cuban project chief would have direct access to the DDP and would not have to route all
    project matters through the Western Hemisphere Division chief.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 5
  focus: The decision point is how to allocate the deputy’s responsibilities while the DDP devoted substantial time to the
    Cuba project. The account describes an informal division of labor and the need to oversee worldwide business; exclude
    speculation that the deputy stayed away to avoid blame, which the source presents only as a possibility raised by another
    officer.
  span_range:
  - src:646bd5e7e6a5#p50.3
  - src:646bd5e7e6a5#p51.4
  decision: The DDP and his deputy tacitly divided responsibilities so the deputy remained outside the Cuban project’s command
    line and handled other DDP business.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 6
  focus: The decision point is whether to proceed with a sugar-sabotage-focused plan or broaden the planning and defer action
    pending presidential review. The stated reasons included doubt that lost sugar revenues would materially constrain Castro’s
    financing and objection to centering the effort on economic sabotage; exclude the operational details of any proposed
    sabotage.
  span_range:
  - src:646bd5e7e6a5#p58.18
  - src:646bd5e7e6a5#p59.18
  decision: The President rejected a narrowly focused plan to identify assets specifically for sugar-industry sabotage, permitted
    broader asset identification, and required a comprehensive covert-action plan before approving action.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The decision point is whether to authorize the proposed covert-action policy or pursue less-than-preferred economic
    measures or a diplomatic approach. The President directed that the plan proceed, citing the need to undermine Castro’s
    position and prestige while anticipating Cuban reactions and seeking OAS support. Keep this at the level of policy authorization;
    exclude the operational details of the program.
  span_range:
  - src:646bd5e7e6a5#p80.10
  - src:646bd5e7e6a5#p82.2
  decision: The President approves the CIA’s anti-Castro policy and directs the Agency to proceed.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: The decision point is whether to press a possible jurisdictional objection or keep the issue low-profile while maintaining
    cooperation. The passage cites findings that the FBI’s work did not conflict with the CIA station and that the agencies’
    contacts benefited both. Exclude details of intelligence operations or information exchanges.
  span_range:
  - src:646bd5e7e6a5#p107.11
  - src:646bd5e7e6a5#p109.12
  decision: The CIA’s Western Hemisphere leadership chooses not to formally challenge the FBI’s Cuba activities or take the
    initiative to raise the jurisdictional issue.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 9
  focus: The decision point is whether to support the requested expansion immediately or seek higher-level consideration before
    the Agency incurs substantial expenditures. The Special Group chose referral because substantial commitments should not
    be made without reasonable assurance that the operation would go forward; the passage later says the requested FY 1961
    funds were made available. Exclude operational uses of the funds.
  span_range:
  - src:646bd5e7e6a5#p112.14
  - src:646bd5e7e6a5#p113.5
  decision: The Special Group decides to refer the CIA’s request for substantial additional project funds to higher authorities
    rather than proceed without further assurance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 10
  focus: The decision point is the Agency representatives’ agreement to reopen the basing question, subject to a readiness
    condition. The stated considerations include security and efficiency, the existing high-level decision to use third countries,
    and concerns that a move could constrain later operations; exclude the detailed facility and training requirements.
  span_range:
  - src:646bd5e7e6a5#p122.11
  - src:646bd5e7e6a5#p123.12
  decision: Agency representatives agree to ask the Special Group to reconsider whether Cuban exile training should remain
    in Guatemala or move to the United States, while ruling out a move before adequate staging facilities are ready.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 11
  focus: The decision concerns the legal and policy limits on using the naval base as refuge. The stated rationale is to avoid
    claims that the United States violated its agreement with Cuba; exclude the surrounding operational activity and any details
    of overflights.
  span_range:
  - src:646bd5e7e6a5#p128.20
  - src:646bd5e7e6a5#p129.5
  decision: The Agency decides that Guantanamo Bay will not be a safe haven for Cuban participants in anti-Castro activity
    and that those who land there will be turned over to Cuban authorities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 12
  focus: The decision point is whether to use U.S. contract personnel or rely on Cuban trainees for these roles. The stated
    reasons were the operational need for qualified, dependable personnel and the expected lack of qualified Cuban candidates;
    exclude the mechanics of maritime operations and any inference about authority beyond the authorization reported.
  span_range:
  - src:646bd5e7e6a5#p149.16
  - src:646bd5e7e6a5#p150.3
  decision: CIA project leadership authorized U.S. contract personnel to fill key maritime positions in training and operations
    when qualified Cubans were unavailable.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 13
  focus: The decision was whether to proceed with the proposed large force or reject that plan amid disagreement about covert
    intervention and possible overt U.S. involvement. The document says Defense supported the Agency proposal while State
    objected and suggested the opportunity for covert intervention might have passed; exclude the separately raised fake-attack
    and assassination topics as decisions or approved courses of action.
  span_range:
  - src:646bd5e7e6a5#p155.19
  - src:646bd5e7e6a5#p156.16
  decision: The Special Group rejected the proposed 3,000-person conventional force for a lodgment in Cuba at its 3 November
    1960 meeting.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 14
  focus: The choice was between the President’s proposed single overall coordinator and the Special Group’s division of overt
    and covert responsibilities. The President approved the reorganization with the stated aim of clarifying the State official’s
    authority to subordinate overt and covert activities and convey policy guidance; exclude the separate question of how
    covert liaison was to be conducted.
  span_range:
  - src:646bd5e7e6a5#p178.13
  - src:646bd5e7e6a5#p181.1
  decision: The President approved a two-official structure for managing the anti-Castro program, with the State Department
    official directly subordinate to the Secretary of State and responsible for conveying policy guidance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 15
  focus: The decision was whether to address the newspaper report or say nothing; the President chose silence because he thought
    his successor might later assist the refugee forces and wanted to preserve that option. Exclude operational details of
    the training and any assessment of the report’s accuracy.
  span_range:
  - src:646bd5e7e6a5#p205.5
  - src:646bd5e7e6a5#p205.7
  decision: The outgoing President chose not to respond publicly to the report of anti-Castro force training in Guatemala.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 16
  focus: The decision point is whether to use training sites in the United States or rely on other locations; the account
    says U.S. sites remained unavailable in part because they could compromise the U.S. position in the OAS or United Nations.
    Exclude the practical details of training or site selection.
  span_range:
  - src:646bd5e7e6a5#p199.10
  - src:646bd5e7e6a5#p199.16
  decision: The administration ruled out using U.S. training sites for the anti-Castro program because of diplomatic risks.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 17
  focus: 'The decision set a threshold for direct intervention: whether to act without such an incident or condition action
    on aggression against U.S. citizens or official property. The passage states the threshold but gives little explanation
    for why that standard was selected; do not infer additional legal or strategic reasoning.'
  span_range:
  - src:646bd5e7e6a5#p199.2
  - src:646bd5e7e6a5#p199.7
  decision: The administration decided that direct U.S. intervention in Cuba would not occur unless the Cuban government attacked
    U.S. citizens or damaged official U.S. property.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 18
  focus: The Agency considered whether to support the proposed force, whose sponsor sought financing and claimed substantial
    backing. It declined after reviewing the proposal, citing grandiose claims and unimpressive credentials; exclude the proposal’s
    operational details and focus on the policy choice about support.
  span_range:
  - src:646bd5e7e6a5#p277.9
  - src:646bd5e7e6a5#p279.11
  decision: The CIA decided not to support the exile leader’s proposed force to overthrow Castro.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 19
  focus: The candidate weighed publicly revealing the program and his support for it against protecting the program’s security
    and the lives of those receiving assistance. The account says he chose not to reveal it and opposed open aid; keep the
    focus on disclosure and public advocacy, not operational details.
  span_range:
  - src:646bd5e7e6a5#p282.13
  - src:646bd5e7e6a5#p283.6
  decision: The Vice President, then a presidential candidate, chose not to disclose the covert program during the debate
    and opposed the opponent’s call for open aid.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 20
  focus: The decision point is the choice by senior policymakers to pursue covert action to oust Castro, with the President
    approving the program and the CIA designated as its principal action agent. The stated reason was concern about the effect
    of overt U.S. activity on the United Nations and the Organization of American States. Exclude the program’s operational
    methods and later questions about assassination plots.
  span_range:
  - src:646bd5e7e6a5#p303.5
  - src:646bd5e7e6a5#p303.16
  decision: The President decided on 17 March 1960 to approve a covert program to replace the Castro regime, rather than pursue
    overt U.S. anti-Castro action.
  content_domain: other:covert-action-policy
  refusal_sensitivity: medium
- n: 21
  focus: The memorandum sets out treaty-based authority and compares collective action with direct unilateral military action,
    including the risks of acting without regional support and the costs of failing to act. It recommends positive action
    through the OAS and treats unilateral action as a later option; the passage establishes a recommendation, not that the
    policy was adopted. Exclude operational methods for carrying out any intervention.
  span_range:
  - src:646bd5e7e6a5#p343.7
  - src:646bd5e7e6a5#p345.9
  decision: U.S. policymakers decide whether to pursue collective action through the OAS against the perceived communist threat
    in Cuba, reserving unilateral military action for failure of other courses.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 22
  focus: The account describes the leader defending delayed elections on the ground that past elections produced bad government
    and that the people did not want elections, while the U.S. vice president urged an earlier return to elections. The decision
    point concerns democratic governance and the leader’s stated justification; do not treat the passage as establishing that
    the proposed four-year delay was ultimately carried out.
  span_range:
  - src:646bd5e7e6a5#p356.6
  - src:646bd5e7e6a5#p357.2
  decision: The Cuban head of government decides whether to hold elections at the earliest possible date or postpone them
