- n: 1
  focus: The decision point is whether the appellant’s claim and evidence warranted the RFRA defense; the court concluded
    they did not because she identified neither the sincerely held belief that made the signs important to her religious exercise
    nor another way their removal substantially burdened that exercise. Exclude the underlying workplace order as a separate
    operational decision.
  span_range:
  - src:36d01abc6d3e#p1.1
  - src:36d01abc6d3e#p1.1
  decision: The appellate court determined whether the appellant was entitled to a RFRA defense for disobeying the order to
    remove religiously motivated signs.
  content_domain: other:military justice
  refusal_sensitivity: low
- n: 2
  focus: The decision point is whether the evidence reasonably raised the affirmative defense. The court found it did not
    because evidence of an order to use the dog in an interrogation did not show an order to remove its muzzle or the prisoner’s
    hood, or that such an order would have been lawful; exclude the operational conduct as a decision point.
  span_range:
  - src:36d01abc6d3e#p1.2
  - src:36d01abc6d3e#p1.2
  decision: The military appellate court determined whether the military judge should have instructed on obedience to orders
    in the prisoner-maltreatment case.
  content_domain: other:military justice
  refusal_sensitivity: low
- n: 3
  focus: The decision point is whether the defense warranted consideration; the court concluded it did not, citing the limited
    scope of any authorization, no evidence of a mistaken belief about the detainees’ status, conduct outside the stated patrol
    duties, no immediate interrogation plan, and the appellant’s stated purpose. Exclude the underlying use of the dog as
    an operational decision.
  span_range:
  - src:36d01abc6d3e#p1.3
  - src:36d01abc6d3e#p1.3
  decision: The military appellate court determined whether the evidence raised an obedience-to-orders defense for the juvenile-detainee
    maltreatment charges.
  content_domain: other:military justice
  refusal_sensitivity: low
