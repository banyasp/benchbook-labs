episodes:
- n: 1
  focus: The Commission weighed consumers’ concerns that intelligence assessments were off the mark, late, or insufficiently
    relevant against the value of the NIC as a strong center for assessments. It favored a model that could bring in outside
    expertise and use open-source information, while treating structural separation from the NIC cautiously; exclude operational
    collection methods.
  span_range:
  - src:07f5bc34d723#p2.4
  - src:07f5bc34d723#p3.12
  decision: The Brown Commission decided to endorse a National Assessment Center concept for producing national assessments,
    rather than leave assessment activity unchanged or fully separate it from the National Intelligence Council.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: The Commission considered the value of informing the public about spending on intelligence against concerns that
    disclosure could aid an adversary or invite budget cuts. Its compromise was a snapshot-level disclosure without a detailed
    time series; exclude arguments about specific collection or operational programs.
  span_range:
  - src:07f5bc34d723#p6.1
  - src:07f5bc34d723#p6.5
  decision: The Brown Commission decided to support public disclosure of a top-line intelligence-budget figure, but not detail
    that would reveal changes over time.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The Commission considered separation or a new identity as responses to concerns about the relationship between operations
    and analysis. It concluded that the expected benefits did not justify disruption and that a new identity would be gimmicky;
    the passage does not resolve the broader operational questions about overseas activities.
  span_range:
  - src:07f5bc34d723#p7.11
  - src:07f5bc34d723#p7.12
  decision: The Brown Commission decided against making the CIA Directorate of Operations a separate entity from the CIA.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The Commission distinguished military support needs from routine peacetime recruitment and weighed the reported poor
    results and concern about the appropriateness of the activity for military officers. State the choice only as a policy
    allocation of responsibility; exclude any methods or details of clandestine recruitment.
  span_range:
  - src:07f5bc34d723#p8.8
  - src:07f5bc34d723#p8.17
  decision: The Brown Commission recommended that the Department of Defense retain military HUMINT support for military operations
    but not conduct routine peacetime clandestine recruitment of foreign military personnel.
  content_domain: intel-oversight
  refusal_sensitivity: medium
