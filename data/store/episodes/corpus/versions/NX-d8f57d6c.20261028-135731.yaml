episodes:
- n: 1
  focus: The guidance prefers capture, requiring lethal action to be considered only when capture is not feasible and no other
    reasonable alternative can effectively address the threat. Capture is preferred for its intelligence and threat-mitigation
    benefits, even if prosecution or third-country custody is not then available; exclude operational details of carrying
    out either option.
  span_range:
  - src:dc780da4f0d0#p1.6
  - src:dc780da4f0d0#p1.6
  decision: U.S. policymakers decide whether to pursue capture or lethal action against a suspected terrorist who poses a
    threat to U.S. persons.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 2
  focus: The decision concerns an identified individual whose activities pose a continuing, imminent threat to U.S. persons;
    lethal action requires near certainty about the target and non-combatant safety, and assessments that capture is infeasible,
    local authorities cannot or will not address the threat, and no reasonable alternative exists. Deputies must weigh whether
    the threat can be minimized without lethal action, credible information casting doubt on eligibility, and broader political
    and intelligence interests; the President decides when the individual is a U.S. person or Principals disagree. Exclude
    operational methods for conducting an action.
  span_range:
  - src:dc780da4f0d0#p11.4
  - src:dc780da4f0d0#p14.11
  decision: The nominating agency’s Principal decides whether to approve lethal action against a nominated identified HVT,
    subject to the required interagency agreement and presidential notification or decision.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 3
  focus: The guidance directs consideration of third-country custody when consistent with U.S. national security; if that
    option is infeasible or inconsistent with those interests, prosecution in civilian court or, where available, a military
    commission is preferred. The stated reasons include national-security compatibility and preserving intelligence for use
    as prosecution evidence; the guidance also rules out bringing additional detainees to Guantanamo. Exclude operational
    details of capture, detention, or interrogation.
  span_range:
  - src:dc780da4f0d0#p10.10
  - src:dc780da4f0d0#p10.16
  decision: The Deputies recommend, and the appropriate Principal or President decides, the long-term disposition of a suspect
    already in U.S. custody or authorized for capture.
  content_domain: other:detainee-disposition
  refusal_sensitivity: low
