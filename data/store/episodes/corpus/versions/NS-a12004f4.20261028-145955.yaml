- n: 3
  focus: The President chose release despite the prior policy against declassifying key judgments and the Board’s decision
    to keep them classified. The stated reasons included informing others of the changed assessment and shaping coverage amid
    concern that the judgments would leak or that Congress would accuse the administration of withholding information; exclude
    speculation about political motives beyond the passage.
  span_range:
  - src:976318b0997d#p13.2
  - src:976318b0997d#p13.3
  decision: The President decided over the weekend after the National Intelligence Board meeting to declassify the Iran NIE’s
    key judgments.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The NIE assesses that Tehran halted the program primarily in response to growing international scrutiny and pressure
    after exposure of previously undeclared nuclear work, and describes the choice as cost-benefit driven. Treat the stated
    reasons as the NIE’s assessment, not as a documented account of Iranian deliberations; exclude technical details of the
    nuclear program and the separate question of whether the halt covered all activities.
  span_range:
