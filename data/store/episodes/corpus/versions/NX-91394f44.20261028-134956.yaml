episodes:
- n: 1
  focus: After dissolving the wartime OSS, the President faced a delay before Congress could complete military reorganization,
    while officials believed the country needed a peacetime intelligence structure. The choice was to wait for that reorganization
    or establish an interim group to screen incoming intelligence and supervise remaining OSS functions; exclude the operational
    conduct of those functions.
  span_range:
  - src:497ad7e59f89#p12.2
  - src:497ad7e59f89#p12.3
  decision: The President creates the Central Intelligence Group as an interim peacetime intelligence organization.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The Authority chose to empower the CIG to centralize intelligence work that was not adequately performed, coordinate
    foreign intelligence, and conduct organized federal foreign espionage and counter-espionage, while stopping short of taking
    over departmental analytical offices or consolidating all clandestine activity. Focus on the allocation and limits of
    authority and the stated efficiency rationale; exclude operational methods.
  span_range:
  - src:497ad7e59f89#p12.4
  - src:497ad7e59f89#p13.2
  decision: The National Intelligence Authority issues NIAD-5, assigning the Director of Central Intelligence a central coordination
    role and specified intelligence responsibilities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: Congress chose a federalized model rather than either leaving intelligence fragmented or placing it under a fully
    controlling central agency. The account gives the reasons for balancing coordination and authoritative national intelligence
    against distrust of concentrated power and the desire to preserve departmental autonomy; exclude later implementation
    details and operational activity.
  span_range:
  - src:497ad7e59f89#p11.3
  - src:497ad7e59f89#p14.4
  decision: Congress enacts the National Security Act of 1947, establishing an independent CIA that coordinates but does not
    control departmental intelligence agencies.
  content_domain: intel-oversight
  refusal_sensitivity: medium
