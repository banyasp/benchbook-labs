  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 15
  focus: The President chose a standdown rather than continuing overflights, amid a forceful Soviet protest and efforts to
    reduce tensions and pursue arms negotiations. Focus on the authorization and diplomatic considerations; exclude technical
