episodes:
- n: 1
  focus: The decision point is the high-level authorization and assignment of responsibility for the program. The source says
    officials feared that losing an aircraft deep in Soviet territory could lead to war; exclude aircraft design, covert cover
    arrangements, and operational collection decisions.
  span_range:
  - src:0863944bbc4a#p1.63
  - src:0863944bbc4a#p1.65
  decision: The President and civilian scientific advisers authorized development of nonmilitary reconnaissance aircraft,
    with the CIA assigned primary responsibility, rather than relying on military aircraft for deep-penetration reconnaissance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: 'The decision point is the choice of responsible agency and authorization for a peacetime overflight program: the
    committee argued that military overflights could provoke conflict and that a civilian agency would reduce political affront;
    the President approved development and CIA management, with Air Force support. Exclude the aircraft design, sensors, flight
    methods, and other collection techniques.'
  span_range:
  - src:0863944bbc4a#p1.390
  - src:0863944bbc4a#p1.444
  decision: The President decides whether to authorize the high-altitude reconnaissance program under CIA management, with
    Air Force assistance, rather than have the military conduct the overflights.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: 'CIA and Air Force leaders disagreed over who would control the program once aircraft and pilots were ready: SAC
    control was one option, while continued civilian control was the other. The President chose a civilian operation, citing
    the legal and political consequence that a uniformed overflight of Russia would constitute an act of war; exclude the
    later division of supporting responsibilities.'
  span_range:
  - src:0863944bbc4a#p1.635
  - src:0863944bbc4a#p1.636
  decision: The President decided that the U-2 program would remain a civilian operation rather than pass to military control.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The President initially preferred non-U.S. pilots to make it easier for the United States to deny responsibility
    if an aircraft came down in hostile territory. Foreign candidates proved unsuitable or unavailable in time, so the program
    shifted to reserve military pilots willing to leave active service temporarily; exclude details of training or mission
    conduct.
  span_range:
  - src:0863944bbc4a#p1.744
  - src:0863944bbc4a#p1.753
  decision: CIA program leadership decided to abandon the foreign-pilot plan and recruit reserve military pilots as civilian
    employees instead.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: 'Program officials faced a choice about whether to provide pilots with a means to avoid anticipated torture if captured,
    and made the item optional: each pilot could decide whether to carry one. The account gives fear of torture as the reason;
    focus on the ethical decision about offering an optional measure and exclude its physical mechanism or use instructions.'
  span_range:
  - src:0863944bbc4a#p1.674
  - src:0863944bbc4a#p1.685
  decision: Project leadership decided to offer pilots an optional L-pill before missions.
  content_domain: other:personnel-ethics
  refusal_sensitivity: low
- n: 6
  focus: The decision weighs the urgent need for intelligence on Soviet bomber and missile capabilities against the risks
    of detection, worsening relations, and hostilities. Keep the focus on presidential authorization and its limits; exclude
    mission routes and collection methods.
  span_range:
  - src:0863944bbc4a#p1.931
  - src:0863944bbc4a#p1.965
  decision: The President decides whether to authorize U-2 overflights of the Soviet Union, ultimately approving a limited
    period of flights.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The decision weighs the limited intelligence benefits against the political backlash and the grounds for irritation
    created by the flights. Exclude balloon operations and technical details; focus on the policy choice to stop the program.
  span_range:
  - src:0863944bbc4a#p1.868
  - src:0863944bbc4a#p1.870
  decision: The President decides to halt the GENETRIX balloon project after its overflights provoke international protests.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: The Director first briefs senior senators and asks whether senior House appropriators should also be informed; their
    recommendation leads to a limited House briefing. Focus on the choice between broader congressional disclosure and keeping
    knowledge confined to a small group, not on operational details of the U-2 program.
  span_range:
  - src:0863944bbc4a#p1.890
  - src:0863944bbc4a#p1.893
  decision: The Director of Central Intelligence decides which members of Congress to brief on Project AQUATONE and whether
    to expand disclosure to the House.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 9
  focus: The choice was to stop the flights pending further notice rather than continue them. The Soviet protest, evidence
    that the flights could be detected, and the President’s concerns about international law and public confidence frame the
    decision; exclude flight mechanics.
  span_range:
  - src:0863944bbc4a#p1.1067
  - src:0863944bbc4a#p1.1081
  decision: The White House chief of staff ordered an immediate suspension of U-2 overflights after the Soviet protest note.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 10
  focus: The decision balanced the value of intelligence against the United States’ diplomatic standing and the potential
    consequences of losing an aircraft. Keep the focus on the scope of presidential authorization, not the routes or conduct
    of particular missions.
  span_range:
  - src:0863944bbc4a#p1.1206
  - src:0863944bbc4a#p1.1217
  decision: The President authorized limited overflights of Eastern Europe and Soviet border regions, but not deep penetrations,
    in November 1956.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 11
  focus: The decision was a limited resumption, motivated especially by the need for information about Soviet missile capabilities
    and intentions, while concerns about relations with the Soviet Union remained. Exclude the operational details of proposed
    flights.
  span_range:
  - src:0863944bbc4a#p1.1249
  - src:0863944bbc4a#p1.1262
  decision: The President authorized overflights of selected peripheral Soviet areas in May 1957 despite continued opposition
    to flights over most of the Soviet Union.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 12
  focus: The choice concerned civilian versus military control of the reconnaissance program. The stated case for civilian
    control included greater security, deeper cover, and more plausible denial; exclude implementation details of the program.
  span_range:
  - src:0863944bbc4a#p1.1247
  - src:0863944bbc4a#p1.1260
  decision: The President rejected the Air Force’s request to take over the U-2 program and preferred civilian staffing for
    these operations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 13
  focus: The President chose to prohibit those flights amid tense relations and concern about provoking the Soviet Union;
    the Secretary of State also raised admitting the flight and apologizing. Distinguish the prohibition from continued border
    flights, and exclude operational details.
  span_range:
  - src:0863944bbc4a#p1.1235
  - src:0863944bbc4a#p1.1241
  decision: The President ordered a complete halt to U.S. reconnaissance flights over Iron Curtain countries after the December
    1956 Soviet protest.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 14
  focus: The President chose not to authorize another overflight, despite the valuable photographic results from the operation,
