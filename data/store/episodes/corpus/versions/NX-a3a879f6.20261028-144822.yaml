    activity; exclude mission routes and collection details.
  span_range:
  - src:0863944bbc4a#p1.1373
  - src:0863944bbc4a#p1.1373
  decision: The President denied permission for an additional U-2 overflight during the aircraft’s return from Operation SOFT
