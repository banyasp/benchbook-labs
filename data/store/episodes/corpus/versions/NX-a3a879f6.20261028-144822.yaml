  focus: After a balloon entered Communist Bloc territory and the President concluded that the Air Force had disregarded his
    instructions, he chose cancellation and a funding halt rather than continuation. Keep the focus on oversight, compliance,
    and diplomatic consequences; exclude payload or timing procedures.
  span_range:
  - src:0863944bbc4a#p1.1422
  - src:0863944bbc4a#p1.1433
  decision: The President ordered the balloon project discontinued and halted further spending on projects involving Iron
    Curtain crossings.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 17
  focus: After a lengthy pause, the President chose to authorize a penetration overflight, weighing the intelligence objective
    against the danger of exposure and diplomatic consequences. The stated support was that the intelligence objective outweighed
    the danger; exclude the flight route, aircraft, and collection details.
  span_range:
  - src:0863944bbc4a#p1.1529
  - src:0863944bbc4a#p1.1540
  decision: The President authorized a U-2 overflight in July 1959 after the CIA and State Department supported the proposal.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 18
  focus: Officials believed a pilot could not survive a crash from that altitude and therefore chose the previously approved
    cover story rather than disclose the mission. The passage also describes tailoring the story to conceal Pakistan’s role;
    exclude the mechanics of preparing or transmitting that explanation.
  span_range:
  - src:0863944bbc4a#p1.1678
  - src:0863944bbc4a#p1.1680
  decision: CIA project officials chose to use the NASA weather-flight cover story after the U-2 went missing.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 19
  focus: The President faced the choice of allowing the CIA Director’s resignation or publicly assuming responsibility; the
    stated concern was avoiding the impression that he did not control his administration. The passage notes that he left
    future overflights unresolved despite an earlier recommendation to terminate provocative operations; exclude the later
    summit exchange, which is a separate decision point.
  span_range:
  - src:0863944bbc4a#p1.1696
  - src:0863944bbc4a#p1.1696
  decision: The President chose to take public responsibility for the U-2 mission rather than accept the CIA Director’s offer
    to resign.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 20
  focus: The choice was whether to resume overflights for higher-resolution intelligence or avoid the risks of sending a vulnerable
    aircraft over the Soviet Union. The passage records intelligence arguments for resumption, dissent by State Department
    and CIA members, and the eventual rejection; exclude technical proposals for making the aircraft or pilot more survivable.
  span_range:
  - src:0863944bbc4a#p1.1829
  - src:0863944bbc4a#p1.1835
  decision: The US Intelligence Board and the NSC Special Group rejected proposals to resume U-2 overflights of the Soviet
