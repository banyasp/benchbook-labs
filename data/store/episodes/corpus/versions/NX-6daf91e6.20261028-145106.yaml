episodes:
- n: 1
  focus: This is an interagency estimative judgment about the likelihood of Soviet action, weighing Soviet military capability
    against the deterrent of US war-making potential, the lack of conclusive evidence of preparations, and the risk of miscalculation.
    Include the committee’s differing view about the degree of miscalculation risk; exclude operational responses to a possible
    conflict.
  span_range:
  - src:59cd566e9702#p37.6
  - src:59cd566e9702#p37.9
  decision: The Joint Ad Hoc Committee decides how to assess the likelihood of direct Soviet military action against the West
    during 1949, concluding that deliberate action is improbable.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: 'Treat this as an estimative judgment: the memorandum reviews earlier assessments and weighs Soviet restraint, economic
    and satellite difficulties, China, and expected Western economic weakness before stating its conclusion. Exclude operational
    responses to the assessed threat; the decision point is the intelligence judgment itself.'
  span_range:
  - src:59cd566e9702#p53.5
  - src:59cd566e9702#p55.11
  decision: The intelligence memorandum’s authors decide whether to retain or revise the prior estimate of the risk of Soviet
    military action against the West; they conclude that the danger of deliberate action or miscalculation will be lower over
    the next year or two.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 3
  focus: 'The decision point is CIA’s choice to issue a straightforward interim estimate with the agencies’ dissenting views
    rather than wait for consensus or publish a watered-down version. The passage gives the reasons: substantial time had
    elapsed, the issues were important, and agreement could take too long or prove impossible; exclude the estimate’s substantive
    military and foreign-policy recommendations, which are not stated as adopted decisions here.'
  span_range:
  - src:59cd566e9702#p94.5
  - src:59cd566e9702#p94.7
  decision: CIA decides whether to publish its estimate on the effects of Soviet possession of the atomic bomb before the
    intelligence agencies reach agreement, or delay publication until they do.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 4
  focus: The analytic choice is between treating Communist doctrine and Russian history as reasons to expect restraint, and
    judging the possibility of force in light of Soviet objectives and the changing balance of power after Soviet acquisition
    of an atomic weapon. The organization concludes that there is no evidence of a fixed decision to use force at a particular
    time, but that Soviet leaders may use it if they judge it advantageous; exclude operational or military planning choices.
  span_range:
  - src:59cd566e9702#p102.7
  - src:59cd566e9702#p103.15
  decision: The Department of State Intelligence Organization concludes that Soviet willingness to use military force should
    be assessed pragmatically, according to whether it appears advantageous to Soviet leaders.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 5
  focus: The choice is whether to retain the subject paper for dissemination and planning or withdraw it and use JIC 502 instead.
    The dissent recommends withdrawal because it considers the paper’s treatment of the Soviet threat dangerously minimizing,
    its analysis inadequate on the atomic-bomb question, and its conclusions unclear; exclude the underlying question of how
    military operations would be conducted.
  span_range:
  - src:59cd566e9702#p104.3
  - src:59cd566e9702#p104.6
  decision: The Assistant Chief of Staff, G-2, recommends withdrawing ORE 91-49 and substituting JIC 502 as the basis for
    resolving differences in attitude and opinion.
  content_domain: intel-analysis
  refusal_sensitivity: medium
