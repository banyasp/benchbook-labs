- n: 1
  focus: The Commission weighed a single unclassified report against producing a separate secret report. It chose the unclassified-only
    approach because a secret version could fuel demands for the full, unabridged story; exclude the separate question of
    whether to include findings on foreign assassination allegations.
  span_range:
  - src:599a260b72e9#p7.2
  - src:599a260b72e9#p7.2
  decision: The Rockefeller Commission chose to issue only an unclassified report rather than prepare a classified version
    as well.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The Administration could have announced implementation of the Rockefeller recommendations or held back; the opportunity
    for quick action passed. The stated explanation is that no one in the White House pressed for action and advisers argued
    Congress would not act, making executive restrictions an unnecessary long-term limitation; exclude the later February
    reform initiative.
  span_range:
  - src:599a260b72e9#p8.3
  - src:599a260b72e9#p9.2
  decision: The Ford Administration chose not to issue restrictions implementing the Rockefeller recommendations around Labor
    Day 1975.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The available approaches included assigning oversight to PFIAB or creating a separate oversight body; the decision
    split the responsibility, recognizing PFIAB's potentially conflicting role in encouraging more and better intelligence.
    The new Board was nevertheless staffed by people on, or added to, PFIAB; exclude the Board's later implementation questions.
  span_range:
  - src:599a260b72e9#p19.2
  - src:599a260b72e9#p19.3
  decision: The President chose to divide executive oversight of intelligence propriety from the intelligence-advisory role
    of PFIAB by establishing a separate Intelligence Oversight Board.
  content_domain: intel-oversight
  refusal_sensitivity: medium
