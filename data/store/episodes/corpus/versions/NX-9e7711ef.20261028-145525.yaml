episodes:
- n: 1
  focus: The decision point is the postwar choice about who would synthesize intelligence for senior civilian and military
    decisionmakers. Focus on the rationale for a freestanding agency and its intended independence from departmental policy
    views; exclude the agency’s later operational activities.
  span_range:
  - src:e3ef059014a7#p12.5
  - src:e3ef059014a7#p13.3
  decision: The President chose to establish an independent central intelligence agency to synthesize departmental intelligence
    rather than assign the coordinating mission to the disbanded OSS.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision concerns the institutional home and coordination authority for the surviving wartime operational capabilities.
    Assess the stated concern that one agency’s secret activities could jeopardize another’s; exclude any methods or details
    of clandestine operations.
  span_range:
  - src:e3ef059014a7#p13.4
  - src:e3ef059014a7#p14.2
  decision: The DCI chose to place surviving OSS clandestine operational elements in the CIG rather than leave them within
    the War Department.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is the postwar allocation of intelligence responsibilities between the central group and departmental
    agencies. Focus on the stated need to secure Army and Navy assent and the consequences of preserving departmental boundaries;
    exclude operational or collection details.
  span_range:
  - src:e3ef059014a7#p14.3
  - src:e3ef059014a7#p14.5
  decision: The President chose to preserve the existing departments’ intelligence agencies and responsibilities rather than
    place them under strong centralized direction.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is the President’s choice to separate the review of covert activities from the broader intelligence
    survey, directing the two task-force leaders to avoid unnecessary duplication. Focus on the oversight mandate and division
    of review responsibility; exclude the covert activities themselves and any operational methods.
  span_range:
  - src:e3ef059014a7#p24.7
  - src:e3ef059014a7#p24.11
  decision: The President chose to have a separate panel review CIA covert activities while keeping them outside the Clark
    task force’s inquiry.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The task force faced a broad intelligence community spanning many departments and agencies, as well as a limited
    time and an inquiry it regarded as difficult to manage. Focus on its choice to narrow the review’s scope and the stated
    constraints; exclude judgments about collection activity or the quality of intelligence products.
  span_range:
  - src:e3ef059014a7#p25.1
  - src:e3ef059014a7#p25.5
  decision: The Clark task force chose to limit its inquiry to agencies whose primary responsibilities involved positive foreign
    intelligence for national defense and security.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The group considered whether to detach the DCI from CIA so the DCI could focus on community affairs, or instead preserve
    the DCI’s operating-agency command role and strengthen coordination through a permanent staff. Focus on the governance
    tradeoff and the majority’s rationale; exclude operational collection details.
  span_range:
  - src:e3ef059014a7#p27.4
  - src:e3ef059014a7#p27.9
  decision: The Joint Study Group chose to retain the DCI’s leadership of CIA while giving the DCI a permanent community-wide
    coordination staff.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The committee weighed prohibiting all covert action against preserving a limited capability, while recognizing the
    value of intelligence activities subject to proper oversight. Focus on the policy judgment and its stated rationale; exclude
    descriptions of covert operations or how they are conducted.
  span_range:
  - src:e3ef059014a7#p38.6
  - src:e3ef059014a7#p38.8
  decision: The Senate committee chose to retain a covert-action capability for extraordinary threats rather than recommend
    a total ban.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: The House and Senate reconciled competing bills and enacted a structure that separated community leadership from
    day-to-day CIA management. Focus on the legislative choice and the stated tensions over civil liberties, military support,
    and integrating intelligence agencies; exclude operational intelligence activity.
  span_range:
  - src:e3ef059014a7#p47.5
  - src:e3ef059014a7#p49.3
  decision: Congress chose to establish a Director of National Intelligence separate from the Director of the CIA, with community-wide
    coordinating authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 9
  focus: The order used executive authority to expand the DCI’s management role, including coordination and oversight responsibilities,
    while a statutory National Intelligence Director remained under consideration. Focus on the choice to act by executive
    order and its stated limits and interim purpose; exclude operational intelligence activity.
  span_range:
  - src:e3ef059014a7#p47.2
  - src:e3ef059014a7#p47.7
  decision: The President chose to issue an executive order strengthening the DCI’s community-management authority as an interim
    measure while Congress considered statutory reform.
  content_domain: intel-oversight
  refusal_sensitivity: medium
