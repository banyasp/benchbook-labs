episodes:
- n: 1
  focus: The regulation directs the investigating officer to suspend the investigation and notify the appointing authority
    and legal advisor; the appointing authority then notifies the combatant commander or delegate, who has authority to appoint
    the friendly-fire investigation. Focus on the investigation’s authority and coordination, not on how hostile fire or friendly
    fire occurred.
  span_range:
  - src:64660283e15d#p11.1
  - src:64660283e15d#p11.1
  decision: The investigating officer decides whether to suspend a hostile-fire investigation when evidence indicates the
    deaths may have resulted from friendly fire.
  content_domain: other:military investigations
  refusal_sensitivity: low
- n: 2
  focus: The regulation generally allows the alleged victim’s Special Victims’ Counsel to attend, but assigns the legal advisor
    the decision whether to exclude the SVC for good cause. The stated grounds include matters unrelated to the alleged victim,
    classified matters, or the alleged victim declining to participate; exclude operational details unrelated to this attendance
    decision.
  span_range:
  - src:64660283e15d#p15.3
  - src:64660283e15d#p15.5
  decision: The legal advisor decides whether to exclude a Special Victims’ Counsel from board proceedings when good cause
    exists.
  content_domain: other:military investigations
  refusal_sensitivity: low
- n: 3
  focus: The regulation generally calls for redacting third-party names and personally identifiable information, while preserving
    relevant witnesses’ and accusers’ names; third-party information should not be redacted if redaction would substantially
    impair the Soldier’s ability to respond. Focus on the privacy and response-rights balance, not on the substance of any
    proposed adverse action.
  span_range:
  - src:64660283e15d#p12.1
  - src:64660283e15d#p12.2
  decision: The servicing legal office decides whether to redact third-party identifying information from records provided
    to a Soldier facing proposed adverse action.
  content_domain: other:military investigations
  refusal_sensitivity: low
- n: 4
  focus: 'The regulation frames openness as a case-specific choice: substantial public interest may support opening proceedings
    even without a respondent, while classified subject matter may support excluding the public from some proceedings even
    when there is a respondent. Include the legal advisor’s role in excluding the public when there is a respondent; exclude
    the separate rule barring public and media recording.'
  span_range:
  - src:64660283e15d#p15.6
  - src:64660283e15d#p15.6
  decision: The appointing authority, or absent direction the IO or board president, decides whether investigation proceedings
    should be open or closed to the public.
  content_domain: other:administrative law
  refusal_sensitivity: low
- n: 5
  focus: The passage distinguishes evidence resulting from an official-capacity Fourth Amendment violation, which may be considered
    only if the legal advisor reasonably determines it would inevitably have been discovered, from other relevant evidence
    obtained through a search or inspection. Focus on the evidentiary admissibility decision and its legal standard; do not
    turn this into a scenario about how a search is conducted or evidence is collected.
  span_range:
  - src:64660283e15d#p18.1
  - src:64660283e15d#p18.1
  decision: The IO or board, applying the legal advisor’s determination where required, decides whether to consider evidence
    obtained through an unlawful official search.
  content_domain: other:administrative evidence law
  refusal_sensitivity: low
- n: 6
  focus: The regulation directs a conflicted or potentially biased authority not to appoint and to forward the matter; the
    superior authority then decides whether further investigation is warranted and which proceeding to use. Include the stated
    concern that the investigation may examine the potential appointing authority’s own policies or decisions; exclude general
    appointment procedures unrelated to conflicts.
  span_range:
  - src:64660283e15d#p22.1
  - src:64660283e15d#p22.1
  decision: A potential appointing authority with a likely witness role, actual or perceived bias, or an actual or perceived
    conflict decides whether to appoint an inquiry, investigation, or board or forward the matter to the next superior authority.
  content_domain: other:administrative law
  refusal_sensitivity: low
- n: 7
  focus: When the legal advisor or board president considers respondent designation advisable, proceedings are abated while
    a recommendation and supporting information are provided to the appointing authority. The decision balances providing
    a hearing to a person with a direct interest against the rule that a potentially adverse finding alone does not require
    respondent status; exclude the later mechanics of notice and evidence presentation.
  span_range:
  - src:64660283e15d#p29.1
  - src:64660283e15d#p29.2
  decision: The appointing authority decides whether to designate a respondent during board proceedings or continue without
    one.
  content_domain: other:administrative adjudication
  refusal_sensitivity: low
- n: 8
  focus: When the recorder considers requested evidence irrelevant, unnecessarily cumulative, or disproportionate in significance
    to the delay, expense, or difficulty of obtaining it, the request goes to the legal advisor or president for a compliance
    decision. The regulation supplies the factors but does not prescribe which outcome to choose; exclude the separate possibility
    that the respondent obtains evidence without recorder assistance.
  span_range:
  - src:64660283e15d#p31.2
  - src:64660283e15d#p31.2
  decision: The legal advisor or board president decides whether the recorder must assist a respondent in obtaining requested
    evidence or witnesses.
  content_domain: other:administrative adjudication
  refusal_sensitivity: low
  relaxed:
  - choice_stated
