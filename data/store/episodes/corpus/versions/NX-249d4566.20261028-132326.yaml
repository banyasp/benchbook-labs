- n: 2
  focus: The General Officer Commanding Multi‑National Division (South‑East) requested the creation of an EC staff to improve
    coordination of UORs. The MOD evaluated the request, commissioned a feasibility study, and decided to embed the EC Branch
    in theatre in early 2005. The decision was driven by identified shortfalls in capability integration and the desire for
    a central focus on UOR activity.
