- n: 1
  focus: The Ministry of Defence, led by the Parliamentary Under‑Secretary of State for Defence Procurement, decided whether
    to request and allocate additional Treasury Reserve funds for Phase IV UORs. The decision weighed the need for force‑protection
    and other capability gaps against budgetary constraints and Treasury approval. The outcome was the approval of 18 measures
    costing about £87 million, with further measures pending.
  span_range:
  - src:953cd3e412d7#p20.4
  - src:953cd3e412d7#p20.5
