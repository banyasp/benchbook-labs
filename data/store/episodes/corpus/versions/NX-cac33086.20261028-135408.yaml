prompt: find_episodes.v1+316fb02bdef3
episodes:
- n: 1
  focus: 'The decision point is the President’s response to opposition to the June 25 order: retain the Coordinator’s military
    authority or revise the arrangement. The revised order omitted “Strategic” and expressly protected the services’ advisers
    from interference; exclude later disputes about the agency’s activities.'
  span_range:
  - src:3a9cb4bb8801#p3.4
  - src:3a9cb4bb8801#p3.5
  decision: The President chose to replace the Coordinator of Strategic Information order with an order establishing the Coordinator
    of Information and protecting the regular military and naval advisers’ functions.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision followed a prolonged dispute over whether OSS would report through a committee where the services could
    stop its projects or act as the Joint Chiefs’ agency. The Joint Chiefs’ directive gave OSS that agency role while providing
    for interdepartmental planning and final Joint Chiefs approval; exclude the conduct of propaganda or other operations.
  span_range:
  - src:3a9cb4bb8801#p7.2
  - src:3a9cb4bb8801#p8.2
  decision: The Joint Chiefs of Staff chose to abolish the Joint Psychological Warfare Committee and designate OSS as their
    agency for the military psychological-warfare program, subject to planning and approval arrangements.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision arose after OSS protested the Navy’s refusal to share intercept-derived information and argued that
    it needed such material for its assigned intelligence work. The Joint Chiefs’ ruling preserved service discretion over
    particular disclosures rather than requiring broader release; exclude the underlying collection and operational uses of
    the information.
  span_range:
  - src:3a9cb4bb8801#p10.3
  - src:3a9cb4bb8801#p11.2
  decision: The Joint Chiefs of Staff chose to leave decisions on releasing particular intelligence items to Army and Navy
    representatives in the OSS Planning Group.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is the OSS Director’s conditional willingness to accept the secretaries as a board between the
    President and the director, rather than insisting on direct presidential responsibility alone. Include the insistence
    on administrative autonomy and ultimate presidential responsibility; exclude operational intelligence methods.
  span_range:
  - src:3a9cb4bb8801#p30.1
  - src:3a9cb4bb8801#p30.1
  decision: The OSS Director decides to accept a board above the proposed central intelligence director only if the director
    retains freedom to administer the agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The Staff moved from competing services and civilian proposals to a single plan combining central authority with
    departmental representation. Capture the chosen allocation of authority and the stated aim of accounting for conflicting
    interests while centralizing control; exclude descriptions of intelligence collection or covert operations.
  span_range:
  - src:3a9cb4bb8801#p31.1
  - src:3a9cb4bb8801#p31.5
  decision: The Joint Intelligence Staff chooses a compromise structure for a national intelligence system, placing the agency
    under a National Intelligence Authority and making departmental intelligence chiefs advisers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The committee accepted inspection of departmental intelligence operations but added a safeguard intended to prevent
    the power from jeopardizing military operations. Focus on the scope and condition of oversight authority; exclude any
    operational details about sources, methods, or inspections.
  span_range:
  - src:3a9cb4bb8801#p32.2
  - src:3a9cb4bb8801#p32.2
  decision: The Joint Strategic Survey Committee amends the proposed inspection power to require protection of intelligence
    sources and methods bearing directly on military operations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The Secretary of War weighs a separate agency with its own budget and authority against coordination controlled by
    the departments that retain operational responsibility. The stated grounds include keeping authority aligned with responsibility,
    avoiding expansion of the coordinating body’s operating functions, and postponing reorganization during hostilities; exclude
    operational intelligence methods.
  span_range:
  - src:3a9cb4bb8801#p35.1
  - src:3a9cb4bb8801#p35.2
  decision: The Secretary of War opposes an independent central intelligence agency and urges that coordination remain under
    department heads, with consideration deferred until hostilities end.
  content_domain: intel-oversight
  refusal_sensitivity: medium
