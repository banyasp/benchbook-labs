episodes:
- n: 1
  focus: The decision point is the choice between relying on blockade and air/sea bombardment and adopting a strategy that
    also planned for invasion. The source describes the Army’s view that invasion could secure surrender on Allied terms and
    the Navy and Army Air Force leaders’ differing views; exclude detailed operational planning and the later question of
    whether to execute the invasion.
  span_range:
  - src:8d1aaa543ec2#p4.6
  - src:8d1aaa543ec2#p5.3
  decision: The Joint Chiefs of Staff approved a Pacific strategy that included planning for an invasion of Japan to secure
    unconditional surrender.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 2
  focus: The decision point is choosing the target date, with 1 December 1945 as the alternative. The source gives weather
    uncertainty and the risk of delaying the end of the war as reasons for the earlier date; exclude operational details and
    do not infer reasons for selecting the overall commander.
  span_range:
  - src:8d1aaa543ec2#p6.3
  - src:8d1aaa543ec2#p6.4
  decision: The Joint Chiefs set 1 November 1945 as the target date for the Kyushu invasion.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 3
  focus: The decision point is the President’s choice to proceed with Kyushu preparations rather than halt or replace the
    plan, while postponing the Honshu decision. The source describes casualty concerns, expected Japanese resistance and reinforcement,
    and the value of reassessing after the Kyushu campaign and anticipated Soviet entry; exclude tactical details and do not
    treat the authorization to prepare as a final order to invade.
  span_range:
  - src:8d1aaa543ec2#p13.3
  - src:8d1aaa543ec2#p17.6
  decision: The President authorized continued preparations for the Kyushu invasion while deferring a decision on a follow-on
    invasion of Honshu.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 4
  focus: The decision point is the President’s adoption of the Interim Committee’s recommendation, amid debate about warning
    or demonstrating the weapon. The source cites hopes of ending the war quickly, avoiding invasion casualties, limiting
    Soviet postwar leverage, and avoiding debate over surrender concessions; exclude operational details of target selection
    and delivery.
  span_range:
  - src:8d1aaa543ec2#p29.3
  - src:8d1aaa543ec2#p30.5
  decision: The President adopted the policy of using the atomic bomb against Japan as soon as possible, without a prior warning.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 5
  focus: The decision point is whether to provide casualty figures or leave them out after they were deleted from the planners’
    draft. The account says the Army Chief of Plans requested figures and prepared a summary because he believed the senior
    military memorandum meant figures had to be offered; exclude the underlying military estimates and any claims about their
    accuracy.
  span_range:
  - src:8d1aaa543ec2#p47.2
  - src:8d1aaa543ec2#p47.3
  decision: The Army Chief of Plans chose to ensure casualty figures were available for the President’s 18 June briefing.
  content_domain: other:presidential decision support
  refusal_sensitivity: low
- n: 6
  focus: The account says the paper was withheld because disagreement persisted over its wording, while a summary and tables
    were presented instead. Treat this as a decision about what advice to submit to the President; exclude the underlying
    invasion planning and casualty calculations.
  span_range:
  - src:8d1aaa543ec2#p47.2
  - src:8d1aaa543ec2#p47.5
  decision: The Joint Chiefs’ planning leadership chose not to give the President the unagreed JCS 1388 paper at the 18 June
    meeting.
  content_domain: other:presidential decision support
  refusal_sensitivity: low
