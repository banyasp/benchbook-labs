- n: 1
  focus: The chief chose to develop an alternative organization and pursue the commanders’ alignment with UNO rather than
    continue relying on Pastora. The stated reasons were that a cohesive southern front had not emerged and officials lacked
    confidence in working with Pastora; exclude the later mechanics of carrying out the realignment.
  span_range:
  - src:d2fd71e27955#p1.31
  - src:d2fd71e27955#p1.33
  decision: The CIA Central American Task Force chief decides to shift the southern-front strategy from working with Pastora
    to bringing dissident commanders into UNO.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The choice was whether to concur in the private alternative or leave the southern forces without the urgently sought
    lethal supplies after the FDN mission could not proceed. The passage gives the coalition’s precarious position and the
    aim of relieving pressure on the northern front as reasons; exclude the route, aircraft, and other execution details.
  span_range:
  - src:d2fd71e27955#p1.45
  - src:d2fd71e27955#p1.49
  decision: The CIA Central American Task Force chief decides to concur in an alternative private lethal-resupply mission
    for the southern forces after the FDN-organized option fails.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: After a Costa Rican official publicly revealed the airstrip, these officials chose false press guidance rather than
    a truthful public account. The report says the task-force chief feared inquiries would expose the private resupply operation;
    exclude the content or methods of any covert activity.
  span_range:
  - src:d2fd71e27955#p1.25
  - src:d2fd71e27955#p1.26
  decision: The CIA Central American Task Force chief, the Assistant Secretary of State, and a National Security Council staff
    officer decide to prepare false press guidance about the Costa Rican airstrip.
  content_domain: other:government-ethics
  refusal_sensitivity: low
- n: 4
  focus: The decision point is whether the CIA should proceed with an already arranged plan or withdraw from involvement.
    The report says the compliance officer judged the plan too close to the Boland Amendment restrictions and persuaded the
    task-force chief that the legal and political risk required ending CIA participation; exclude implementation details.
  span_range:
  - src:d2fd71e27955#p1.53
  - src:d2fd71e27955#p1.53
  decision: The CIA task-force chief and the task-force compliance officer decide that the CIA must not participate in placing
    a contra liaison with the private benefactors.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The report describes an urgent funding gap before government aid would become available and says other funding options
    had not moved; the proposed bridge loan would fund food, with repayment anticipated through a later CIA purchase. Treat
    this as a funding and policy decision, and exclude the mechanics of the resupply operation.
  span_range:
  - src:d2fd71e27955#p1.54
  - src:d2fd71e27955#p1.55
  decision: The CIA task-force chief and the Assistant Secretary for Inter-American Affairs decide to seek private bridge
    financing for contra aid through the NSC official’s private resupply operation.
  content_domain: other:contra-aid financing
  refusal_sensitivity: medium
- n: 6
  focus: After the cargo-plane crash, the chief equivocated and denied knowledge in responses and testimony to congressional
    committees, despite information he had received. The report attributes his aim to protecting the NSC official and says
    later briefings sought to prevent opposition to the aid package; focus on the disclosure and oversight choice, not operational
    details of the flights.
  span_range:
  - src:d2fd71e27955#p1.59
  - src:d2fd71e27955#p1.65
  decision: The CIA Central American Task Force chief decides to withhold his knowledge of the private resupply operation
