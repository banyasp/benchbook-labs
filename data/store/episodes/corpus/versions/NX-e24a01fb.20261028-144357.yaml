episodes:
- n: 1
  focus: The decision point is whether the Director should meet with the negotiator while the Attorney General and another
    official determine what commitment the government can make. Include the congressional commitments limiting CIA use of
    covert resources and the possibility that Congress might reconsider; exclude the details of conducting negotiations.
  span_range:
  - src:cd41e444686d#p43.6
  - src:cd41e444686d#p43.7
  decision: The Director of Central Intelligence decides not to meet with the prisoner-release negotiator, citing commitments
    made to congressional committees.
  content_domain: intel-oversight
  refusal_sensitivity: low
- n: 2
  focus: The decision point is whether to begin political and propaganda efforts immediately or wait for an agreed policy.
    The source records agreement not to start the effort until the policy is decided; exclude the operational details of any
    later campaign.
  span_range:
  - src:cd41e444686d#p47.21
  - src:cd41e444686d#p47.24
  decision: The principals decide to defer political and propaganda action on Cuba until policy for pursuing a complete solution
    is settled.
  content_domain: other:political-policy
  refusal_sensitivity: low
- n: 3
  focus: The decision point is whether to move beyond the existing approach toward political pressure and possible armed intervention.
    The memorandum gives the perceived strategic risks and possible consequences; distinguish the Director’s recommendation
    from an adopted government decision, and exclude any operational plan for carrying out force.
  span_range:
  - src:cd41e444686d#p49.7
  - src:cd41e444686d#p50.9
  decision: The Director of Central Intelligence recommends a more aggressive Cuba policy, including immediate political action
    and, if needed, committing armed forces to occupy the country and remove the regime.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 4
  focus: The decision point is whether to interpret the costly, rapid installation of defensive systems as preparation to
    conceal later offensive weapons or as having another explanation. Include the assessment that the Soviets would weigh
    the gains of a major offensive buildup against the danger of U.S. intervention; exclude collection methods and subsequent
    policy choices.
  span_range:
  - src:cd41e444686d#p57.5
  - src:cd41e444686d#p57.6
  decision: The intelligence estimating authority judges that the Soviet defensive buildup in Cuba is more likely explained
    by motives other than concealing a later offensive buildup.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 5
  focus: The decision point is the analysts’ choice among competing interpretations of the site and its likely defensive purpose.
    Keep the assessment and its evidentiary reasoning; exclude the technical descriptions of missile systems and launch equipment.
  span_range:
  - src:cd41e444686d#p84.4
  - src:cd41e444686d#p86.2
  decision: CIA analysts assessed that the Banes site was more likely a short-range coastal-defense cruise-missile installation
    than another missile system.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 6
  focus: The decision point is the estimate’s judgment about the buildup’s primary purpose and the risk that Soviet deployments
    could become more offensive. Keep the competing interpretations and the stated rationale about deterrence and the risk
    of provoking intervention; exclude technical descriptions of weapons.
  span_range:
  - src:cd41e444686d#p100.4
  - src:cd41e444686d#p101.3
  decision: USIB chose to assess the Soviet military buildup in Cuba as primarily intended to strengthen and deter threats
    to the Castro regime, while judging that an offensive base could provoke US intervention.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: The President requested probabilistic wording because the photographs showed crates, not the bombers themselves;
    he also raised the political effect of releasing the information during the election campaign. The Director of Central
    Intelligence agreed to the wording. Focus on the choice between a definitive and qualified intelligence statement, not
    the underlying imagery or collection.
  span_range:
  - src:cd41e444686d#p126.6
  - src:cd41e444686d#p126.7
  decision: The President and the Director of Central Intelligence decide to describe the reported bomber evidence as probable
    rather than confirmed.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 8
  focus: The President requested that future information be suppressed; the Director of Central Intelligence warned that doing
    so would be extremely dangerous. The resulting arrangement restricted access to those responsible for advising the President
    while informing specified senior officials, rather than broadly circulating it to operational commands. Focus on the oversight
    and dissemination choice, not collection or covert communication.
  span_range:
  - src:cd41e444686d#p126.7
  - src:cd41e444686d#p127.3
  decision: The President and the Director of Central Intelligence decide to limit circulation of future Cuba intelligence
    while ensuring presidential advisers and senior officials receive it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 9
  focus: After receiving an initial assessment of offensive missile systems, the Deputy Director for Intelligence considered
    whether to wait for the next morning or alert key officials immediately. He chose to call the White House and State Department
    because early attention was important and he believed the White House had not yet been alerted. Focus on the timing and
    responsible dissemination of intelligence, not the content of the collection process.
  span_range:
  - src:cd41e444686d#p151.3
  - src:cd41e444686d#p151.5
  decision: The Deputy Director for Intelligence decides to alert White House and State Department officials that night rather
    than wait until morning about the newly identified missile evidence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 10
  focus: This is a concrete recommendation about whether to use force after a warning, with the Director citing the need to
    address the situation while avoiding an indictment for an unannounced attack. Treat the proposed sequence as the decision
    point; exclude the listed strike sites and other implementation details.
  span_range:
  - src:cd41e444686d#p161.3
  - src:cd41e444686d#p162.10
  decision: The CIA Director recommends warning Soviet and Cuban leaders and, if they do not begin removing the weapons, using
    military force.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 11
  focus: 'The October 19 memorandum describes a probable course if action is taken: begin with a limited blockade, potentially
    expand it, and withhold strikes or invasion pending developments. The stated reasons include retaining flexibility and
    avoiding the risks and reputational costs of a surprise military attack; exclude surveillance and blockade implementation
    details.'
  span_range:
  - src:cd41e444686d#p190.4
  - src:cd41e444686d#p191.6
  decision: The U.S. principals favor beginning with a limited blockade to prevent additional arms from reaching Cuba, while
    reserving more extreme action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 12
  focus: This is the former President’s stated policy recommendation, not a record that the President adopted it. The choice
    weighs military effectiveness against the legitimacy costs and dangerous precedent of an unannounced attack; exclude operational
    details of surveillance, strikes, and invasion.
  span_range:
  - src:cd41e444686d#p237.6
  - src:cd41e444686d#p238.2
  decision: The former President, advising the President, favors a blockade and warning with military action conditional on
    continued Soviet-Cuban deployment, rather than a surprise attack.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 13
  focus: The decision point is the evaluators’ choice between an immediate-capability interpretation and a systematic-readiness
    interpretation of the site evidence. Their stated indicators include the placement of launchers, missiles, and equipment;
    exclude the technical details as operational guidance.
  span_range:
  - src:cd41e444686d#p223.3
  - src:cd41e444686d#p223.6
  decision: The joint intelligence evaluators conclude that the Soviet objective was systematic preparation for full operational
    readiness, not immediate launch capability at each missile site.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 14
  focus: The decision point is the choice of a measured blockade/quarantine over immediate military attack, weighing the risk
    of missiles being fired, Soviet escalation (especially in Berlin), allied support, and the opportunity for the USSR to
    pause or withdraw. Include the recorded concerns about legality and OAS support as part of the policy context; exclude
    operational blockade procedures and invasion planning details.
  span_range:
  - src:cd41e444686d#p265.9
  - src:cd41e444686d#p268.6
  decision: The President and senior national-security advisers chose a naval quarantine of Cuba rather than immediate air
    strikes or invasion.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 15
  focus: The decision point is whether retaliation would require a presidential decision after immediate notification, and
    who could act if the President were unavailable. The discussion cites the urgency of the situation, but exclude the specific
    aircraft, weapons, and response mechanics; the scenario concerns authority to use force, not how to do so.
  span_range:
  - src:cd41e444686d#p272.3
  - src:cd41e444686d#p273.2
  decision: The Executive Committee set who could decide on retaliation if Soviet forces shot down a U-2, including a fallback
    authority for the Secretary of Defense.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 16
  focus: The decision point is whether to board the tanker already intercepted or defer boarding and choose the next Soviet
    ship. The record notes the BUCHAREST’s petroleum cargo and the possibility that the GROZNY’s deck load included missile
    field tanks; exclude tactical boarding methods.
  span_range:
  - src:cd41e444686d#p292.7
  - src:cd41e444686d#p292.7
  decision: The Executive Committee decided not to board the BUCHAREST and to board the next Soviet ship contacted, the GROZNY.
  content_domain: targeting
  refusal_sensitivity: high
- n: 17
  focus: The decision point concerns who would lead MONGOOSE amid disputed CIA, Lansdale, and military channels. The record
    cites Lansdale’s perceived lack of authority and CIA’s separate obligation to support the military; exclude operational
    plans and covert methods.
  span_range:
  - src:cd41e444686d#p304.6
  - src:cd41e444686d#p305.5
  decision: The MONGOOSE meeting reaffirmed Lansdale’s leadership of the operation’s government-wide remit.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 18
  focus: The decision point is the agency’s estimate of the intended scale of Soviet missile deployment, compared with the
    Soviet claim of 42 missiles. The stated basis includes the number of identified launchers, the usual missile-to-launcher
    pattern, and evidence suggesting additional planned deployment areas; exclude subsequent policy choices based on the estimate.
  span_range:
  - src:cd41e444686d#p336.5
  - src:cd41e444686d#p336.7
  decision: CIA analysts judged that the Soviets almost certainly intended to deploy substantially more than the 42 missiles
    they acknowledged and withdrew.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 19
  focus: The September 19 estimate concluded that deployment would be inconsistent with Soviet practice and policy, although
    it noted the possibility as a contingency. Focus on the choice of analytic judgment and the weighting of indicators against
    assumptions about Soviet intentions; exclude collection methods.
  span_range:
  - src:cd41e444686d#p345.5
  - src:cd41e444686d#p345.6
  decision: The intelligence community’s estimators judged that Soviet deployment of strategic missiles in Cuba was unlikely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 20
  focus: The choice was between broad dissemination and controlled circulation while information about suspected offensive
    weapons was still developing. The President sought tight control, while also directing that relevant information be collected,
    analyzed, and promptly reported to officials with a need to know; focus on the dissemination policy and its tradeoffs,
    not collection activity.
  span_range:
  - src:cd41e444686d#p348.6
  - src:cd41e444686d#p349.3
  decision: The President restricted dissemination of information concerning offensive weapons in Cuba to designated recipients.
  content_domain: intel-oversight
  refusal_sensitivity: medium
