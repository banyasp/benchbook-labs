- n: 1
  focus: The decision point is how to resolve uncertainty about whether capability might already exist or arrive in 1959 versus
    later, and what date planners should assume. The estimate cites the orderly test program, lower-than-expected test activity,
    uncertain evidence of production and facilities, and production lead times; some offices favored the first half of 1960.
    Exclude technical missile characteristics and deployment details.
  span_range:
  - src:5bdb02747581#p15.6
  - src:5bdb02747581#p16.7
  decision: The Intelligence Community estimate authors chose to use 1 January 1960 as the planning assumption for the date
    of an initial Soviet ICBM operational capability.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is the analytic classification of the Tyuratam launches amid Moscow’s stated scientific purpose
    and evidence that some Cosmos satellites from another rangehead did not fit a reconnaissance mission. The memorandum bases
    its judgment on observed mission characteristics and launch patterns. Exclude technical collection methods and operational
    details.
  span_range:
  - src:5bdb02747581#p22.6
  - src:5bdb02747581#p23.5
  decision: The CIA Directorate of Science and Technology and Directorate of Intelligence jointly assessed that most examined
    Cosmos satellites launched from Tyuratam likely had a military reconnaissance mission, rather than being solely scientific
    satellites.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 3
  focus: The analysts reject the Soviet explanation that the radar is for satellite detection and tracking, judging its primary
    mission to be ballistic-missile detection and tracking. Reconstruct the competing interpretations and the stated warning-coverage,
    siting, and cost considerations; exclude technical details about radar operation.
  span_range:
  - src:5bdb02747581#p49.8
  - src:5bdb02747581#p50.3
  decision: CIA Office of Scientific and Weapons Research analysts assess whether the Krasnoyarsk radar’s primary mission
    is ballistic-missile early warning or satellite detection and tracking.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 4
  focus: The estimate weighs the number of bombers that could reach North American target areas and the likelihood and scale
    of an initial attack; the USAF intelligence official offers a substantially higher alternative. Reconstruct the competing
    threat judgments and their stated assumptions, but exclude operational details about conducting an attack.
  span_range:
  - src:5bdb02747581#p34.3
  - src:5bdb02747581#p34.4
  decision: The intelligence estimators and the Assistant Chief of Staff, Intelligence, USAF, assess the scale of the Soviet
    bomber threat to North America in a possible attack.
  content_domain: intel-analysis
