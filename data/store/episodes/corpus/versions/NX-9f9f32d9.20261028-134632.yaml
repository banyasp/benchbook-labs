  focus: The decision concerned which service had authority over government radio operations and whether the Army should continue
    a station the Navy viewed as competing with and duplicating its Bar Harbor station. The account says the Navy had de facto
    control of government radio and Houlton could not readily be justified as supporting Army operations. Exclude the technical
