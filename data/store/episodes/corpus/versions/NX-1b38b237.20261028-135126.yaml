episodes:
- n: 1
  focus: The Joint Chiefs chose the earlier date over 1 December after the Pacific commanders argued that a December operation
    faced weather uncertainty that could delay the invasion until spring 1946 and prolong the war. Focus on this timing decision,
    not on operational details of the invasion or the separate choice of its commander.
  span_range:
  - src:19c26eae9ed1#p6.3
  - src:19c26eae9ed1#p6.4
  decision: The Joint Chiefs of Staff set 1 November 1945 as the target date for the Kyushu invasion.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 2
  focus: The President weighed the proposed invasion against the possibility of ending the war through isolation, blockade,
    and bombardment, amid concerns about casualties and Japanese reinforcement. Focus on the policy choice to continue Kyushu
    preparations; exclude any operational methods. The account says the plan was judged the best choice under the circumstances,
    while the President remained concerned about the human cost.
  span_range:
  - src:19c26eae9ed1#p13.4
  - src:19c26eae9ed1#p17.6
  decision: The President approved continuing preparations for the Kyushu invasion while leaving a decision on a later Honshu
    invasion for another time.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 3
  focus: At the same meeting, the President chose to postpone the Honshu decision rather than resolve it alongside the Kyushu
    preparations. The stated rationale was to assess the Kyushu campaign’s impact and anticipated Soviet entry into the war;
    the possible influence of the upcoming atomic bomb test is presented only as speculation.
  span_range:
  - src:19c26eae9ed1#p17.5
  - src:19c26eae9ed1#p17.6
  decision: The President deferred deciding whether to proceed with a follow-on invasion of Honshu.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 4
  focus: The decision point is the President’s acceptance of the Interim Committee’s recommendation to use the weapon as soon
    as possible, against a military-industrial target, without prior warning; the text notes debate over warning or demonstration
    and dissent from some scientists. Reasons included seeking a quick end to the war, avoiding invasion casualties, minimizing
    Soviet postwar leverage, and avoiding debate over concessions to surrender terms. Exclude the operational instructions
    for delivery and the disputed claim that later casualty estimates determined the decision.
  span_range:
  - src:19c26eae9ed1#p29.3
  - src:19c26eae9ed1#p30.5
  decision: The President chose to implement the recommendation to use the atomic bomb against Japan without prior warning.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 5
  focus: The JWPC draft included a casualty estimate of roughly a quarter of a million; the JPS version deleted casualty language,
    and a later enclosure proposed replacement figures requested by the Army’s chief of plans. The account attributes the
    deletions to sensitivity about confronting the President with estimates and says the Army’s chief of plans presumably
    believed figures were needed given the senior naval adviser’s memorandum; preserve that uncertainty and exclude any decision
    about whether to invade or use atomic weapons.
  span_range:
  - src:19c26eae9ed1#p47.1
  - src:19c26eae9ed1#p47.2
  decision: The JPS decides to remove casualty estimates from its version of the campaign paper, then propose replacement
    figures for the President’s briefing.
  content_domain: other:military decision support
  refusal_sensitivity: low
- n: 6
  focus: At the 18 June 1945 meeting, the Army Chief of Staff read the Army chief of plans’ summary and tables were used,
    while the full paper was withheld because disagreement over its wording persisted. Treat the decision as one about how
    to brief the President; exclude the underlying operational plans and any inference about the President’s ultimate decisions.
  span_range:
  - src:19c26eae9ed1#p47.3
  - src:19c26eae9ed1#p47.4
  decision: The JPS/JCS planners decide not to give the President the unagreed JCS 1388 paper and instead present a summary.
  content_domain: other:military decision support
  refusal_sensitivity: low
