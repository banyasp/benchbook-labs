- n: 2
  focus: After receiving intelligence about Allied landings and assessing the strategic situation, the Chief of Staff issues
    a tentative outline and then formally activates SHO One, setting X‑day for 24 October. The activation reflects a choice
    between maintaining the status quo or launching a coordinated counter‑operation, with reasons rooted in the perceived
    threat to Japanese holdings and the need for a unified response.
