- n: 1
  focus: The decision point is whether to create a DNI to provide oversight and integration across the intelligence community,
    or leave coordination with the existing structure. The stated reasons include the DCI’s competing responsibilities, agency
    silos and information-sharing failures, and the view that the agencies could not address these problems without direction
    from above; exclude later assessments of specific intelligence operations.
  span_range:
  - src:e9f0c3cb5096#p3.1
  - src:e9f0c3cb5096#p3.4
  decision: The Bush NSC staff favored creating a Director of National Intelligence rather than relying on the existing DCI
    structure and agencies to reform themselves.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is what authority the proposed DNI should receive, including whether the office should have authority
    over budgets and personnel or only a limited coordination role. The officials’ stated concern was that a weakly empowered
    DNI could not manage a large, complex community; exclude operational intelligence activities and focus on the proposed
    institutional authority and rationale.
  span_range:
  - src:e9f0c3cb5096#p6.4
  - src:e9f0c3cb5096#p6.6
  decision: The acting DCI and the NSA and NGA directors chose to urge creation of a DNI with substantial budgetary and personnel
    authority rather than a limited coordinating role.
  content_domain: intel-oversight
  refusal_sensitivity: medium
