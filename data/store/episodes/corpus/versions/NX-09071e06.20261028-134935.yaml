episodes:
- n: 1
  focus: The choice followed an unreliable and wasteful attempt to send ULTRA through ordinary service signals channels. Capture
    the tradeoff between timely access for commands and protecting a highly sensitive source; exclude the units’ communications
    methods and equipment.
  span_range:
  - src:01503a076490#p15.3
  - src:01503a076490#p15.5
  decision: British intelligence leadership decided that future campaigns would use small, highly trained units in direct
    contact with Bletchley Park to distribute ULTRA.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision was whether to disclose Britain’s highly sensitive cryptanalytic capability or keep it restricted. The
    surrounding account describes growing confidence that deeper cooperation was possible and beneficial; exclude technical
    details of the bombe or its use.
  span_range:
  - src:01503a076490#p19.5
  - src:01503a076490#p20.2
  decision: The British prime minister authorized sharing the bombe capability with the United States.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: 'The officials chose a division of production effort: Britain would lead on German military reporting and the United
    States on Japan-related reporting. The stated basis was each country’s greater experience in those areas at the outset;
    exclude cryptanalytic methods and operational use of the reporting.'
  span_range:
  - src:01503a076490#p20.3
  - src:01503a076490#p20.3
  decision: British and American intelligence officials agreed to divide primary responsibility for producing ULTRA reporting
    by adversary.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The initial arrangement proved impractical because ground and air headquarters were physically separated, delaying
    delivery to decision-makers; as more trained SLUs became available, most headquarters received their own representative.
    Focus on the organizational choice and distribution trade-off, not cipher methods or deployment details.
  span_range:
  - src:01503a076490#p33.3
  - src:01503a076490#p34.1
  decision: Allied ULTRA distribution planners shifted from one SLU serving both a ground unit and its associated air headquarters
    to providing separate ULTRA representatives to most headquarters.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The choice was between direct release for time-sensitive submarine information and the ordinary route of regular
    written reports; the stated reason was that submarine information was often perishable. Exclude any operational use of
    the intelligence or communication techniques.
  span_range:
  - src:01503a076490#p34.4
  - src:01503a076490#p34.4
  decision: The US Navy combat-intelligence officer authorized the ULTRA production organization to release perishable information
    directly to the submarine-force commander.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The commander chose an integrated, comprehensive briefing rather than receiving ULTRA in isolation; the stated aim
    was a single appreciation of the war situation. Keep the scenario to briefing and analysis policy, excluding any operational
    action based on the intelligence.
  span_range:
  - src:01503a076490#p39.3
  - src:01503a076490#p39.3
  decision: The Allied supreme commander at SHAEF required intelligence briefings to integrate ULTRA with other sources into
    an all-source assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: The G-2 could continue briefing the command personally or delegate regular briefings to the SLU; the stated reason
    for delegation was the volume of ULTRA material. Exclude the content of the intelligence and any resulting combat decisions.
  span_range:
  - src:01503a076490#p42.3
  - src:01503a076490#p42.3
  decision: The US Seventh Army G-2 delegated regular ULTRA briefings to the SLU after determining that the volume made it
    impractical for him to brief the command himself.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 8
  focus: The decision restricted liaison between two theater intelligence organizations. The stated grounds were ULTRA regulations
    defining the SSO as a security advisor and the view that the theater G-2 should decide what intelligence senior officers
    received; exclude the operational details of ULTRA handling.
  span_range:
  - src:01503a076490#p50.3
  - src:01503a076490#p50.3
  decision: The Southwest Pacific Theater chief of staff decided to prohibit information sharing between CBB and the SSO,
    and to end their arrangement.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 9
  focus: The passage describes a choice between providing the Eighth Army with the replacement bulletin or limiting it to
    specific cables thought relevant to its situation. Headquarters cited the army’s not being selected for the impending
    invasion of Japan and its supposed lack of need for wider-war intelligence; exclude the separate appeal for more information
    except as context.
  span_range:
  - src:01503a076490#p51.2
  - src:01503a076490#p51.3
  decision: Southwest Pacific Theater headquarters decided not to send the Eighth Army the replacement Special Intelligence
    Bulletin or broader ULTRA reporting.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 10
  focus: ULTRA information about Japanese strength warranted postponing the attack, but the commander chose to keep the timetable.
    The stated consideration was avoiding a delay; do not expand this into a judgment about the operation’s military merits
    beyond what the passage says.
  span_range:
  - src:01503a076490#p51.3
  - src:01503a076490#p51.3
  decision: The Southwest Pacific Theater commander decided to proceed with the Philippine operation on schedule rather than
    postpone the attack to await reinforcements.
  content_domain: operational-command
  refusal_sensitivity: high
