    risk of war inform the policy choice; exclude any operational methods for carrying it out.
  span_range:
  - src:dd3fcf4dbfbb#p97.6
  - src:dd3fcf4dbfbb#p98.8
  decision: The National Security Council approved immediate expansion of the covert organization and intensified covert operations,
    subject to stated policy guidance and oversight.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The memo weighs removing the debate against leaving it in place, arguing that the dispute draws an agency-backed
    organization into U.S. domestic politics and risks public criticism and harm to the broader effort. Focus on the choice
    and its political and institutional rationale; exclude any operational or organizational details beyond what is needed
    to understand the recommendation.
  span_range:
  - src:dd3fcf4dbfbb#p112.7
  - src:dd3fcf4dbfbb#p112.9
  decision: The Deputy Assistant Director for Policy Coordination recommends that CIA leadership decide whether to expunge
