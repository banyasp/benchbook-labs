- n: 1
  focus: The decision is whether to revise NSC 10/2 immediately or rely on the existing guidance arrangements while integrating
    OPC under the DCI. The stated reason is that revision is not immediately necessary to make OPC fully responsive to the
    DCI; exclude operational details of covert activity.
  span_range:
  - src:dd3fcf4dbfbb#p9.5
  - src:dd3fcf4dbfbb#p9.8
  decision: The Director of Central Intelligence decides that the Office of Policy Coordination is subject to his authority
    and command without an immediate revision of NSC 10/2, while State, Defense, and the Joint Chiefs continue to provide
    advice and policy guidance rather than instructions or orders.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The proposed amendment recommends deferring a decision to use the troops until the prospects of an acceptable immediate
    political settlement have passed. It weighs military utility against effects on negotiations, U.S. relations with other
    nations, and the risks of escalation; exclude operational details of troop employment.
  span_range:
  - src:dd3fcf4dbfbb#p41.4
  - src:dd3fcf4dbfbb#p42.3
  decision: U.S. policymakers decide whether to employ Chinese Nationalist troops in Korea immediately or defer their use.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 3
  focus: The memorandum recommends continuing the existing project-based approach rather than broadly subsidizing the association,
    citing concerns about the association's receptiveness and the risks of overt association with government support. Treat
    this as a policy choice about covert support, and exclude implementation details of covert activity.
  span_range:
  - src:dd3fcf4dbfbb#p43.5
  - src:dd3fcf4dbfbb#p44.9
  decision: The memorandum's recommending office decides whether to subsidize the National Student Association broadly or
    continue support through selected projects.
  content_domain: other:covert-action policy
