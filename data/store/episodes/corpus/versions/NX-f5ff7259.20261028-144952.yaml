  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The Director describes recent difficulties abroad as stemming largely from improperly trained or inferior personnel,
    with poor security practices also contributing, and says activities must be limited until a reserve of well-trained people
    is built. Focus on this organizational priority choice and its stated reasons; exclude operational details of any particular
    activity.
  span_range:
  - src:dd3fcf4dbfbb#p127.3
  - src:dd3fcf4dbfbb#p127.4
  decision: The Director decides to limit CIA activities to operations the Agency can perform well, rather than attempt broader
    coverage with underqualified personnel.
