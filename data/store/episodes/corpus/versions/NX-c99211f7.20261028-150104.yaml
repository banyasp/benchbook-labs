- n: 1
  focus: The CIA’s contra appropriation was nearly exhausted, and the CIA General Counsel had warned that exceeding its cap
    could expose officers to sanctions. The CIA Director pressed for a legal basis to facilitate third-country funding; the
    Attorney General viewed discussions as permissible if the countries used their own funds and were not reimbursed by the
    United States. Keep the scenario focused on authority, legal limits, and continued support for the contras, not on financial
    arrangements.
  span_range:
  - src:5b1074fc20cf#p1.5
  - src:5b1074fc20cf#p1.7
  decision: The CIA Director chose to pursue third-country contributions for contra support and seek a legal opinion on whether
    facilitating them was permissible under the Boland restrictions.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The CIA Director supported a draft policy that proposed limited arms sales as an opening to Iran, while the Secretaries
    of State and Defense opposed it and the draft was ultimately abandoned. The stated rationale was to increase U.S. leverage
    and prevent the Soviet Union from benefiting from change and turmoil in Iran. Keep the scenario at the level of policy
    choice; exclude the mechanics of arms transfers.
  span_range:
  - src:5b1074fc20cf#p1.20
  - src:5b1074fc20cf#p1.22
  decision: The CIA Director chose to endorse the proposed Iran policy emphasizing concrete steps to increase U.S. leverage
    and limit Soviet influence.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
- n: 3
  focus: At the January 7, 1986 meeting, the President decided to accept the proposed Israeli-Iranian offer involving arms
    sales in exchange for the release of hostages; the diary account records that the Vice President, the CIA Director, and
    others favored proceeding, while the Secretaries of State and Defense opposed it. The hostage-release objective is the
    stated context for the choice. Keep the scenario on the policy decision and competing judgments, not the implementation
    of arms transfers.
  span_range:
  - src:5b1074fc20cf#p1.29
  - src:5b1074fc20cf#p1.35
  decision: The President chose to proceed with the proposed arms-for-hostages initiative, despite opposition from the Secretaries
    of State and Defense.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is who would conduct the White House review after the arms sales were exposed. The source states
    the alternative and the national security adviser's reason for rejecting it; exclude the review's later findings.
  span_range:
  - src:5b1074fc20cf#p1.53
  - src:5b1074fc20cf#p1.53
  decision: The national security adviser chose the NSC counsel, rather than the White House counsel, to review the Iran affair.
  content_domain: intel-oversight
  refusal_sensitivity: medium
