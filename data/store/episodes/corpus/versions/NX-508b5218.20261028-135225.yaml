episodes:
- n: 1
  focus: The planned solo was precluded by the morning’s simultaneous-instruments weather status, and the originally assigned
    contingency instructor was unavailable; the student’s Flight Commander asked another instructor to fly, and that instructor
    accepted. Focus on the authorization and substitution decision, not on flight maneuvers or the accident sequence.
  span_range:
  - src:c3a4794eb25a#p21.6
  - src:c3a4794eb25a#p22.3
  decision: The 459th FTS Operations Supervisor authorized the sortie to proceed with an instructor accompanying the student
    instead of as the student’s planned solo sortie.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 2
  focus: The report says the flags normally precluded flying, but review identified them as mistakenly assigned squadron read
    files that did not apply to the MIP, who was assigned to another squadron; the formation then proceeded. Focus on the
    eligibility determination and its basis, not on flight or ejection-seat procedures.
  span_range:
  - src:c3a4794eb25a#p23.3
  - src:c3a4794eb25a#p23.3
  decision: The personnel conducting the go/no-go review treated the MIP as eligible to fly despite eight grounding flags
    on the report.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 3
  focus: At 1219L, shortly before the mishap, the Supervisor of Flying chose between the existing flying status and unrestricted
    status. The report says improving weather permitted the change; exclude the later mishap circumstances and any flight-technique
    details.
  span_range:
  - src:c3a4794eb25a#p37.3
  - src:c3a4794eb25a#p37.3
  decision: The Sheppard AFB Supervisor of Flying changed the T-6 flying status from “Simultaneous Instruments” to “Unrestricted.”
  content_domain: operational-command
  refusal_sensitivity: low
