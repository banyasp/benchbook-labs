episodes:
- n: 1
  focus: The Council considered whether to revise the directives and change the role of the Military Services and the Secretary
    of Defense in military intelligence and intelligence-board membership. It chose to seek the Secretary’s recommendations
    rather than settle the disputed organizational questions immediately; the discussion cites disagreement over expertise
    and representation and the short time remaining in the administration. Exclude the technical details of intelligence collection
    and analysis.
  span_range:
  - src:38fe346e27f9#p1.6
  - src:38fe346e27f9#p5.2
  decision: The National Security Council directed the Secretary of Defense to submit proposed revisions to the intelligence
    directives on Defense military-intelligence authority, leaving the broader reorganization and related board-membership
    questions for further consideration.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The Council chose to adopt the policy framework with amendments, rather than leave it unchanged or reject it. The
    discussion weighs possible harm to Panama, construction cost and feasibility, congressional and treaty considerations,
    and financing; it does not decide the canal’s location or authorize construction.
  span_range:
  - src:38fe346e27f9#p5.5
  - src:38fe346e27f9#p7.11
  decision: The National Security Council adopted the proposed policy statement on a future inter-oceanic canal, amended to
    express a preference that a new canal be self-financing.
  content_domain: other:canal-policy
  refusal_sensitivity: low
- n: 3
  focus: The choice was whether to impose controls after diplomatic relations were severed or first obtain recommendations
    on their application. The discussion notes that controls might have little economic effect but could have political or
    psychological value, and that an executive order would be required; exclude the broader diplomatic briefing that does
    not bear on this decision.
  span_range:
  - src:38fe346e27f9#p8.8
  - src:38fe346e27f9#p11.6
  decision: The President requested a prompt interdepartmental assessment before deciding whether to apply Trading-with-the-Enemy
    Act economic controls to Cuba.
  content_domain: other:economic-policy
  refusal_sensitivity: low
- n: 4
  focus: The Council chose not to recommend a radical shift of resources toward limited-war capabilities, while recognizing
    that capabilities would improve under the submitted budget and other actions. The record weighs limited-war readiness
    against preserving general-war capability and notes that studies cannot by themselves determine force requirements; exclude
    operational details about particular contingencies or logistics.
  span_range:
  - src:38fe346e27f9#p12.2
  - src:38fe346e27f9#p15.11
  decision: The National Security Council agreed that the existing balanced military program did not require a radical additional
    allocation of resources to limited-war capabilities.
  content_domain: use-of-force-policy
  refusal_sensitivity: medium
