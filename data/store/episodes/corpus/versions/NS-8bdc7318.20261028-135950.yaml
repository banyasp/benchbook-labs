  focus: The decision point is whether the departures, in the circumstances described, established forced displacement and
    the required intent, or should not be characterized as deportation. The Trial Chamber declined that characterization because
    it could not conclusively establish either element; exclude the separate question whether the attacks themselves were
    lawful.
