- n: 2
  focus: The decision point is whether the impact-site evidence supported findings of unlawful shelling or left reasonable
    doubt. The Appeals Chamber found the 200-metre standard inadequately supported and considered that possible mobile targets,
    together with the lack of a dependable range-of-error estimate, undermined the inference; exclude operational decisions
    about how artillery was used.
  span_range:
  - src:451acad79bbd#p1.23
  - src:451acad79bbd#p1.26
  decision: The Appeals Chamber decided whether the Trial Chamber’s findings of unlawful shelling could stand given the unsupported
    200-metre standard and the possibility of mobile targets.
