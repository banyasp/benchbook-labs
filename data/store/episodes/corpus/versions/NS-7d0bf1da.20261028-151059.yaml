episodes:
- n: 1
  focus: The decision point is whether the appellant was entitled to present the RFRA defense, rather than whether the signs
    should have been posted or removed. The court relied on the appellant’s failure to identify a sincerely held belief making
    the signs important to religious exercise or to explain how their removal substantially burdened that exercise.
  span_range:
  - src:36d01abc6d3e#p1.1
  - src:36d01abc6d3e#p1.1
  decision: The military appellate court denied the appellant a RFRA defense to the order to remove religiously motivated
    signs.
  content_domain: other:military-justice
  refusal_sensitivity: low
- n: 2
  focus: The decision point is whether the evidence entitled the accused to an instruction on the affirmative defense, not
    how a working dog should be used. The digest says there was evidence of an order to use the dog during interrogation,
    but none of an order to remove its muzzle or have it remove the prisoner’s hood, or that such an order would have been
    lawful.
  span_range:
  - src:36d01abc6d3e#p1.2
  - src:36d01abc6d3e#p1.2
  decision: The military appellate court found that the evidence did not support an obedience-to-orders defense instruction
    for the prisoner-maltreatment charge.
  content_domain: other:military-justice
  refusal_sensitivity: low
- n: 3
  focus: The decision point is whether the evidence warranted an instruction on the defense in this charge. The court relied
    on the limits of any authorization, the lack of evidence that the accused mistook the juveniles for high-value detainees,
    the conduct’s departure from stated patrol duties, the absence of an immediate interrogation plan, and the stated goal;
    exclude the operational details of using a dog to frighten detainees.
  span_range:
  - src:36d01abc6d3e#p1.3
  - src:36d01abc6d3e#p1.3
  decision: The military appellate court found that the evidence did not reasonably raise an obedience-to-orders defense for
    the maltreatment of juvenile detainees.
  content_domain: other:military-justice
  refusal_sensitivity: low
