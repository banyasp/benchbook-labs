episodes:
- n: 1
  focus: The doctrine directs planners/commanders to choose among three planning modes depending on how certain they are about
    future conditions. It excludes any operational technique for executing the plan; it only addresses the policy decision
    of which mode to adopt.
  span_range:
  - src:2b498b324714#p45.4
  - src:2b498b324714#p47.4
  decision: Selection of planning mode (commitment, contingency, or orientation) based on the assessed level of uncertainty.
  content_domain: other:planning-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 2
  focus: The doctrine directs planners to select deliberate planning when ample time exists and no speed advantage is needed,
    and rapid planning when time is short or speed offers benefit. Excludes the detailed steps of each planning mode.
  span_range:
  - src:2b498b324714#p51.5
  - src:2b498b324714#p52.5
  decision: Choose between deliberate planning and rapid planning based on time availability and operational advantage.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: Planners must decide whether to design plans with tightly coupled actions (high coordination) or loosely coupled
    actions (greater flexibility), weighing the likelihood of disruption and the nature of the operation. Excludes specific
    coordination mechanisms.
  span_range:
  - src:2b498b324714#p57.4
  - src:2b498b324714#p59.4
  decision: Select tight or loose coupling of plan elements based on expected disruption, friction, and predictability.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 4
  focus: Commanders must decide how much detail to include in a plan, aiming for the simplest plan that still provides necessary
    guidance, while allowing subordinates latitude. Excludes the actual content of the detailed tasks.
  span_range:
  - src:2b498b324714#p75.1
  - src:2b498b324714#p76.5
  decision: Determine the appropriate level of plan simplicity versus detail, balancing guidance needs with subordinate freedom.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 5
  focus: The commander must decide between routing an order through the normal chain of command (through the immediate superior)
    or bypassing intermediate echelons to issue directly to a lower unit. The doctrine specifies that bypass is only permissible
    in exceptional cases and requires notification of intermediates.
  span_range:
  - src:2b498b324714#p95.5
  - src:2b498b324714#p96.1
  decision: Whether to bypass intermediate echelons of command when issuing orders
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 6
  focus: The commander decides between issuing an oral order directly to principals or a written order. The doctrine recommends
    oral orders when urgency demands brevity and simplicity.
  span_range:
  - src:2b498b324714#p96.5
  - src:2b498b324714#p96.5
  decision: Whether to use oral orders instead of written orders in urgent situations
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 7
  focus: The planner/commander must choose between providing only the minimum instruction needed for effective execution or
    adding extensive detail that may repeat standard procedures. The doctrine directs that directives convey the minimum necessary
    and avoid over‑detail.
  span_range:
  - src:2b498b324714#p96.3
  - src:2b498b324714#p96.4
  decision: How much detail to include in a directive (minimum necessary instruction vs extensive detail)
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
