episodes:
- n: 1
  focus: The decision followed deteriorating weather at Ellsworth and concern that FELON 01 was nearing its minimum fuel to
    divert. Keep the focus on the mission-level choice and those reasons; exclude the subsequent flight and radio procedures.
  span_range:
  - src:c33bf3023ad3#p14.3
  - src:c33bf3023ad3#p14.5
  decision: The FELON flight lead chose to terminate the training mission and return toward Ellsworth rather than continue
    the tactical mission.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 2
  focus: The decision point is whether to proceed when the crews believed the minimum was 1/2 statute mile and had been told
    visibility was 5/8 mile, although an active NOTAM required 3/4 mile and Runway 13 horizontal visibility was unavailable.
    Focus on the weather-minimum and authorization judgment, not the mechanics of flying an approach.
  span_range:
  - src:c33bf3023ad3#p14.7
  - src:c33bf3023ad3#p15.4
  decision: The FELON crews, with the mishap instructor pilot relying on the reported weather, chose to request and begin
    the Runway 13 approach despite the visibility information available to them.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 3
  focus: 'The commander faced staffing choices amid limited manning: prioritize the B-1B training, test, and operational units
    and selected AFE/weapons roles, or fill more OSS ADO positions. The report gives operational readiness as the priority
    and describes the resulting leadership gap and delegation; exclude general descriptions of command structure not tied
    to this staffing decision.'
  span_range:
  - src:c33bf3023ad3#p42.4
  - src:c33bf3023ad3#p42.5
  decision: The 28 OSS/CC prioritized filling selected operational positions while accepting vacant ADO positions, then pushed
    decision-making authority downward.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 4
  focus: SFOX3 faced whether to approve the crew’s risk assessment and permit the step; the score of 17 required Top-3 review,
    and the step-to-fly ORM section was incomplete. The report says SFOX3 likely saw the score and signed, while aircraft
    delays and the later return to the aircraft also called for further assessment; exclude flight-performance details.
  span_range:
  - src:c33bf3023ad3#p44.2
  - src:c33bf3023ad3#p44.3
  decision: SFOX3 approved the crew’s mission-planning ORM assessment and allowed the crew to step despite the incomplete
    assessment.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 5
  focus: The crew faced whether to proceed with the opposite-direction approach without a current Rwy 13 visibility observation
    and without recognizing the NOTAM’s increased minimum. The report states the crew believed 1/2 SM applied; the MIP knew
    of the NOTAM but failed to recognize the aircraft did not meet its minimum. Keep the focus on the decision against the
    applicable weather standard, not on approach or landing technique.
  span_range:
  - src:c33bf3023ad3#p35.8
  - src:c33bf3023ad3#p45.3
  decision: The mishap crew commenced the Rwy 13 approach while believing the required visibility minimum was 1/2 SM, although
    the NOTAM required 3/4 SM and no prevailing visibility observation for that runway was available.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 6
  focus: The decision point is whether to continue the sortie or return as conditions deteriorated and dense fog approached
    the airfield. Keep the focus on the command judgment and stated weather rationale, not on the mechanics of flying or landing.
  span_range:
  - src:c33bf3023ad3#p51.5
  - src:c33bf3023ad3#p51.5
  decision: The mishap aircrew decided to terminate the training mission early and return to base as the weather worsened.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 7
  focus: The decision point is whether to attempt Rwy 13, favored for its better ceiling, or use the anticipated Rwy 31 approach;
    the report says Rwy 13 lacked valid required visibility and the attempt was unauthorized. Focus on the judgment against
    the weather restrictions and the stated rationale; exclude the technical conduct of the approach.
  span_range:
  - src:c33bf3023ad3#p53.1
  - src:c33bf3023ad3#p53.3
  decision: The mishap aircrew, following the Mishap FOX-3 recommendation, decided to attempt the Rwy 13 approach despite
    lacking the required visibility.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 8
  focus: The decision point is whether to provide the additional SOF oversight layer or conduct operations under the FOX-3
    arrangement, including during deteriorating weather when a junior, non-instructor pilot was performing FOX-3 duties. The
    report identifies the arrangement and deficiencies in scheduling oversight; do not treat its general discussion of organizational
    structure as a separate decision.
  span_range:
  - src:c33bf3023ad3#p53.2
  - src:c33bf3023ad3#p55.4
  decision: The 34th Bomb Squadron leadership and scheduling chain decided to conduct flying operations without a Supervisor
    of Flying in the tower, using the FOX-3 arrangement instead.
  content_domain: operational-command
  refusal_sensitivity: low
