- n: 1
  focus: 'The decision point is the November 1960 shift in the operation’s strategic approach: continue a clandestine buildup
    that was proving slow, or develop a larger, conventionally trained force. The report cites Castro’s growing military strength
    and tightened internal security as context; do not turn this into a scenario about operational planning or tactics, or
    imply that this passage establishes higher-level authorization for using the force.'
  span_range:
  - src:a82ea7f7b658#p1.197
  - src:a82ea7f7b658#p1.204
  decision: WH/4 project leadership chose to expand the Cuban force and redirect its training toward conventional military
    operations rather than continue relying primarily on a gradual clandestine resistance buildup.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 2
  focus: The Special Group considered the original plan obsolete but had not agreed on a substitute; trained Cuban refugees
    were seen as potentially useful under whatever policy was ultimately chosen. The President chose to keep preparations
    moving during the political interregnum, without authorizing military action itself. Exclude the later decisions about
    the operation’s final plan or execution.
  span_range:
  - src:a82ea7f7b658#p1.423
  - src:a82ea7f7b658#p1.432
  decision: The President directed the Agency to continue preparations for the Cuban operation while reserving the decision
    on whether the landing would occur to the incoming Administration.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 3
  focus: The paramilitary chief cited coordination problems and recommended integrating the independent air unit into the
    project; the DD/P rejected that option, citing technical efficiency. The report describes the resulting divided command.
    Keep the focus on organizational authority and coordination, not air operations or their techniques.
  span_range:
  - src:a82ea7f7b658#p1.371
  - src:a82ea7f7b658#p1.375
  decision: The Deputy Director for Plans rejected the recommendation to place the Development Projects Division’s air unit
    under the project chief’s command.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 4
  focus: The report contrasts cancellation, which would have caused embarrassment, with proceeding amid doubts about resistance,
    force disparity, terrain, and contingency planning; failure risked deaths, loss of property, and damage to U.S. prestige.
    The Agency chose to gamble as the odds worsened. Keep this at the level of the decision to proceed or halt and the risks
    weighed; exclude operational details of the invasion.
  span_range:
  - src:a82ea7f7b658#p1.488
  - src:a82ea7f7b658#p1.529
  decision: Agency leadership chose to proceed with the invasion rather than cancel it despite evidence that the plan’s assumptions
    and prospects had deteriorated.
  content_domain: targeting
  refusal_sensitivity: high
- n: 5
  focus: The report says this judgment became essential to proceeding after the original guerrilla-support concept was no
    longer maintainable. Keep the scenario focused on the evidentiary and analytic basis for accepting the uprising judgment;
    exclude the operational details of the invasion.
  span_range:
  - src:a82ea7f7b658#p1.653
  - src:a82ea7f7b658#p1.661
  decision: WH/4 and project leadership relied on the judgment that a landing could trigger a Cuban uprising as a basis to
    proceed with the operation, rather than retain the original premise of supporting existing effective guerrilla forces.
  content_domain: intel-analysis
  refusal_sensitivity: high
- n: 6
  focus: The decision followed the FRD organizer’s departure and aimed to preserve assets and capabilities while retaining
    influence over who might lead the anti-Castro community. Keep the scenario on the policy choice and its effects on FRD
    unity; exclude the operational details of aid or paramilitary activity.
  span_range:
  - src:a82ea7f7b658#p1.718
  - src:a82ea7f7b658#p1.725
  decision: The project changed its aid policy from centering support on the FRD to considering paramilitary-aid requests
    from any capable anti-Castro, non-Batista group.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 7
  focus: The report links the suspension to the growing reliance on the strike-force concept and notes that agents continued
    to request support, including appeals about risks to local groups. Keep the scenario on the policy decision to suspend
    or continue support and the competing commitments; exclude the mechanics of air drops.
  span_range:
  - src:a82ea7f7b658#p1.897
  - src:a82ea7f7b658#p1.919
  decision: Project leadership decided to suspend clandestine drops until after the amphibious assault as the project’s emphasis
    shifted toward the strike-force plan.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 8
  focus: The project leaders were concerned about the Cuban pilots’ motivation and ability to perform tactical missions, and
    sought authority to bring in American pilots. The Special Group authorized hiring but deferred the distinct decision about
    their actual use; exclude the later combat sorties, whose authorizing decision-maker is not identified here.
  span_range:
  - src:a82ea7f7b658#p1.1140
  - src:a82ea7f7b658#p1.1141
  decision: The Special Group authorized the hiring of American contract pilots while reserving a later decision on whether
    to use them.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 9
  focus: The vessel had just become ready for use, Miami Base protested, and Headquarters took it for a deception operation
    connected with the amphibious strike. The source does not explain why Headquarters overrode the base’s competing need;
    exclude details of how the deception operation was conducted.
  span_range:
  - src:a82ea7f7b658#p1.1027
  - src:a82ea7f7b658#p1.1027
  decision: The Headquarters unit commandeered the Sea Gull for a deception operation rather than leaving it available to
    Miami Base.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 10
  focus: The decision point is whether to authorize continued support for external action, weighing the prospect of weakening
    or overthrowing Castro against political costs, risks of failure, and the consequences of allowing opposition capacity
    to disappear. The document’s conclusions favor using the force, but do not establish that policymakers made the final
    authorization decision. Exclude the operational design and conduct of any proposed action.
  span_range:
  - src:a82ea7f7b658#p1.1301
  - src:a82ea7f7b658#p1.1378
  decision: U.S. policymakers decide whether to continue support for the Cuban opposition by employing its paramilitary force
    or instead refrain from using it and dissolve the force.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 11
  focus: The decision point is whether political leaders should receive advance consultation or phased, later briefings. The
    stated reason for withholding advance consultation is security, despite anticipated resentment and the expectation that
    leaders would seek credit and control; exclude the plan’s operational details.
  span_range:
  - src:a82ea7f7b658#p1.1623
  - src:a82ea7f7b658#p1.1627
