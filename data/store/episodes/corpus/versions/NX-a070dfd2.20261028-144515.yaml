episodes:
- n: 1
  focus: The estimate adopts the bomber-production projection, while acknowledging that Soviet leaders might shift effort
    toward guided missiles or revise force goals. It grounds the projection in current evidence and its judgment that aircraft
    would remain important for long-range attacks, but treats the forecast as uncertain. Exclude the hypothetical Soviet attack
    plans and operational details.
  span_range:
  - src:96f20903fdc7#p14.3
  - src:96f20903fdc7#p14.5
  decision: The intelligence estimate’s authors decide whether to project that the USSR will devote substantial effort to
    long-range bomber production through 1959 or instead prioritize guided missiles.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: The intelligence analysts assess that Soviet planners might choose a limited attack against specially selected targets,
    while security risks would probably rule out using large numbers of clandestinely delivered weapons. The reasons cited
    are the growing risk of compromise as the number of weapons increases, possible loss of surprise, and possible US military
    action if the plan is exposed. Keep the scenario at the level of whether and how extensively to use force; exclude delivery
    methods and operational details.
  span_range:
  - src:96f20903fdc7#p30.15
  - src:96f20903fdc7#p30.20
  decision: Soviet planners decide whether, and on what scale, to use clandestine nuclear attack against the United States.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 3
  focus: The passage presents a principal estimate of bomber and tanker strength and an Army intelligence dissent, with reasons
    bearing on production capacity, Soviet requirements, and whether tanker units should be counted separately. Treat the
    decision as an estimative judgment, not as a decision about Soviet operational employment.
  span_range:
  - src:96f20903fdc7#p39.3
  - src:96f20903fdc7#p39.13
  decision: The intelligence estimators, including the Assistant Chief of Staff for Intelligence, Department of the Army,
    decide what mid-1960 Soviet Long-Range Aviation strength to estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 4
  focus: The assessment describes a choice between continuing or expanding existing heavy-bomber production and curtailing
    it while pursuing advanced intercontinental systems. It gives reasons including technical shortcomings, US defensive improvements,
    confidence in missile programs, and the deterrent value of existing forces; exclude operational details of any attack.
  span_range:
  - src:96f20903fdc7#p47.12
  - src:96f20903fdc7#p48.3
  decision: Soviet leaders decide to forego a rapid buildup of the existing BISON and BEAR heavy-bomber force, accepting an
    interim risk while relying on other strategic capabilities.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 5
  focus: The choice was whether to deploy the first-generation SS-6 despite its successful launches or favor development of
    the SS-7. The source cites the SS-6’s size, non-storable cryogenic fuel, and resulting field-logistics problems; exclude
    technical details beyond these reasons for the acquisition decision.
  span_range:
  - src:96f20903fdc7#p53.3
  - src:96f20903fdc7#p53.3
  decision: Soviet military planners chose to forgo operational deployment of the SS-6 and develop its successor, the SS-7.
  content_domain: other:defense-procurement-policy
  refusal_sensitivity: low
- n: 6
  focus: 'The decision point is the estimate of Soviet objectives and likely ICBM force size: a substantial deterrent/preemptive
    capability versus an effort to attain decisive military superiority. The majority tied its view to the program’s orderly
    tempo, Soviet doctrine, and a balance among military capabilities; the dissent argued that Soviet objectives and perceived
    risks warranted a much larger force. Exclude operational attack planning and targeting details.'
  span_range:
  - src:96f20903fdc7#p69.14
  - src:96f20903fdc7#p70.7
  decision: The interagency intelligence estimators adopted a majority judgment that the Soviet ICBM program aimed at a substantial
    deterrent and preemptive capability, while the Air Force intelligence office dissented in favor of a much larger force
    estimate and a decisive-superiority interpretation.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: The estimate infers a change of course away from rapid heavy-bomber expansion, weighing disappointing bomber performance,
    improving North American air defenses, and growing confidence in ICBMs. Treat this as an inferred force-planning decision;
    exclude aircraft capabilities and operational details.
  span_range:
  - src:96f20903fdc7#p74.3
  - src:96f20903fdc7#p74.3
  decision: Soviet leaders decide to forego a rapid buildup of the heavy bomber force.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 8
  focus: The estimate judges that Soviet leaders would be unlikely to divert resources for this larger, faster buildup, and
    instead describes a deliberate program aimed at a substantial deterrent and pre-emptive capability. Treat this as an intelligence
    inference about force-planning choices; exclude calculations of attack effects and operational details.
  span_range:
  - src:96f20903fdc7#p79.6
  - src:96f20903fdc7#p79.9
  decision: Soviet leaders decide against a crash program to reach 480 ICBMs on launcher by mid-1961.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 9
  focus: The decision point is how to make an estimate when calculations are highly sensitive to uncertain inputs and operational
    factors. Keep the focus on the analysts’ choice of analytic approach and its stated limitations; exclude the underlying
    attack calculations and operational details.
  span_range:
  - src:96f20903fdc7#p104.7
  - src:96f20903fdc7#p105.13
  decision: US intelligence estimators chose not to treat calculated ICBM requirements as a reliable basis for estimating
    Soviet force goals, and instead assessed the range of judgments through three illustrative programs.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 10
  focus: The decision point is whether to extend the forecast beyond 1963 or stop at that horizon. Keep the focus on the stated
    uncertainty and reasons for limiting the estimate; exclude the force projections themselves as operational guidance.
  span_range:
  - src:96f20903fdc7#p106.5
  - src:96f20903fdc7#p106.5
  decision: US intelligence estimators chose not to project a Soviet strategic-force estimate beyond 1963, rather than extending
    even a tentative estimate to later years.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 11
  focus: This is the original estimate’s analytic judgment amid substantially different views from the Department of State,
    Army, Navy, and USAF. Focus on why the estimators selected the central estimate and how they weighed uncertainty about
    the program’s pace and intelligence coverage; exclude technical or operational missile details.
  span_range:
  - src:96f20903fdc7#p109.4
  - src:96f20903fdc7#p109.9
  decision: The intelligence estimators chose a probable mid-1961 Soviet ICBM force estimate of 50–100 operational launchers,
    with projections for subsequent years.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 12
  focus: The revised estimate followed new information and differed from the higher USAF assessment. Focus on the analytic
    choice, its evidentiary basis, and the stated uncertainty; exclude operational descriptions of missile deployment or capabilities.
  span_range:
  - src:96f20903fdc7#p114.5
  - src:96f20903fdc7#p126.6
  decision: The intelligence estimators revised the current Soviet ICBM estimate downward to 10–25 launchers and judged that
    the force would not increase markedly in the immediate months ahead.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 13
  focus: Treat this as an intelligence inference about a Soviet policy choice, not as a directly documented Soviet deliberation.
    The passage contrasts limited deployment of the cumbersome first-generation system with the pursuit of a newer system;
    exclude details about launcher operation and deployment methods.
  span_range:
  - src:96f20903fdc7#p125.4
  - src:96f20903fdc7#p126.5
  decision: The Soviet leadership was assessed to have decided around 1958 to deploy only a small force of first-generation
    ICBMs while pursuing second-generation systems.
  content_domain: intel-analysis
  refusal_sensitivity: medium
