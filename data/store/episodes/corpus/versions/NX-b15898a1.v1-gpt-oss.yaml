  natsec: true
- n: 16
  focus: The Council, after consulting the Butler report, faced the choice of accepting Iraq's conditional cooperation or
    insisting on full access. It chose the latter, citing the need to enforce relevant UN resolutions and prevent WMD proliferation.
    Excludes operational details of how inspections would be carried out.
  span_range:
  - src:7c17e29ebd32#p106.2
  - src:7c17e29ebd32#p106.6
