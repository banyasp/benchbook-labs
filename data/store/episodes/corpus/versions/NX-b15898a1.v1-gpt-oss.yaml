- n: 1
  focus: The Prime Minister announced the creation of an independent Privy Counsellor committee to examine UK involvement
    in Iraq from 2001‑2009. The decision involved choosing to set up a formal inquiry versus handling the matter through existing
    mechanisms, with the stated purpose of learning lessons and strengthening democracy, diplomacy and the military.
  span_range:
  - src:7c17e29ebd32#p6.2
  - src:7c17e29ebd32#p6.6
  decision: Prime Minister decides to establish the Iraq Inquiry (public independent investigation).
  content_domain: other:public-inquiry
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The Committee concluded that, as a non‑statutory public inquiry, it would not investigate individual detention cases
    but focus on government policy. The choice was between examining individual cases or limiting the scope to policy, with
    reasons including lack of statutory power, focus on systemic policy, and avoiding duplication with other investigations.
  span_range:
  - src:7c17e29ebd32#p10.7
  - src:7c17e29ebd32#p10.9
  decision: Inquiry Committee decides not to examine individual detainee cases.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: Baroness Scotland, the Attorney General, consented to waive LPP for legal advice given up to 20 March 2003, allowing
    the Inquiry to access the advice. The decision involved choosing to maintain privilege or waive it, with reasons citing
    exceptional public interest and the unique nature of the Inquiry.
  span_range:
  - src:7c17e29ebd32#p18.2
  - src:7c17e29ebd32#p18.3
  decision: Attorney General agrees to waive Legal Professional Privilege for pre‑2003 legal advice on military action.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The Security Council faced the choice of authorising or not authorising Member States to use all necessary means
    to enforce compliance with earlier resolutions. It chose to adopt Resolution 678, citing Iraq’s continued breach of peace
    and the need to restore international security. This decision set the legal basis for the Gulf War coalition’s military
    action.
  span_range:
  - src:7c17e29ebd32#p29.4
  - src:7c17e29ebd32#p29.6
  decision: UN Security Council authorises use of force against Iraq if it does not comply with resolutions (Resolution 678).
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: Faced with the choice of acting or refraining from enforcing the NFZs, the UK Government, represented by the Defence
    Secretary and Foreign Secretary, opted to support the zones, arguing that an overwhelming humanitarian catastrophe justified
    the action. The decision was justified by the need to protect civilians and to monitor compliance with Resolution 688,
    invoking customary international law and the principle of humanitarian necessity.
  span_range:
  - src:7c17e29ebd32#p38.9
  - src:7c17e29ebd32#p39.4
  decision: UK Government decides to enforce No‑Fly Zones over Iraq based on humanitarian necessity despite lack of explicit
    Chapter VII authorisation.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: In early April 1991 the UK, through the Foreign Secretary, chose to contribute aircraft and ground forces to a temporary
    safe haven north of the 36th parallel. The decision was driven by humanitarian concerns for Kurdish refugees and the desire
    to uphold Iraq’s obligations under Resolution 688, while maintaining Iraq’s territorial integrity. This established Operation
    HAVEN as part of the broader NFZ enforcement.
  span_range:
  - src:7c17e29ebd32#p37.6
  - src:7c17e29ebd32#p37.6
  decision: UK decides to create a Northern No‑Fly Zone (Operation HAVEN) to protect Kurdish refugees and monitor Iraqi compliance.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The Council faced a choice of how to enforce Iraq's disarmament obligations after the Gulf War. It chose a compulsory
    destruction regime, citing non‑proliferation and regional security concerns.
  span_range:
  - src:7c17e29ebd32#p48.8
  - src:7c17e29ebd32#p49.13
  decision: UN Security Council adopts operative paragraph 8 of Resolution 687, requiring Iraq to unconditionally destroy,
    remove, or render harmless all chemical and biological weapons, stocks, related components and delivery systems under
    international supervision.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: Faced with UNSCOM inspections, the committee chose a partial‑destruction and concealment strategy to preserve know‑how
    and avoid full exposure.
  span_range:
  - src:7c17e29ebd32#p57.6
  - src:7c17e29ebd32#p57.7
  decision: Iraqi high‑level committee, including the Deputy Prime Minister, decides to destroy only a portion of its declared
    chemical, biological and missile stockpiles, retain production capability and conceal the full extent of its programmes.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: UNSCOM faced the choice of conducting surprise inspections versus respecting Iraqi delays; it chose the former to
    address suspected concealment.
  span_range:
  - src:7c17e29ebd32#p64.7
  - src:7c17e29ebd32#p64.9
  decision: UNSCOM decides to request and carry out no‑notice inspections of Iraqi sites in March 1996 despite Iraqi objections,
    to verify compliance with disarmament obligations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The Council faced the choice of adopting a new resolution to implement a mechanism for monitoring sales or supplies
    of prohibited items versus taking no further action. It chose to adopt Resolution 1051, citing the need to enforce compliance
    with Section C of Resolution 687 and related resolutions. This decision set a legal framework for future inspections and
    reporting.
  span_range:
  - src:7c17e29ebd32#p65.7
  - src:7c17e29ebd32#p65.8
  decision: UN Security Council decides to adopt Resolution 1051 (1996) establishing a monitoring mechanism for items relevant
    to Resolution 687.
  content_domain: other:non-proliferation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The Council considered whether to issue a new resolution responding to Iraq’s repeated denial of inspector access.
    It chose to adopt Resolution 1115, stating that Iraq’s actions were a flagrant violation of prior resolutions and demanding
    immediate, unconditional, unrestricted access. The decision was driven by concerns over regional peace and security and
    the need to enforce compliance.
  span_range:
  - src:7c17e29ebd32#p81.3
  - src:7c17e29ebd32#p81.6
  decision: UN Security Council decides to adopt Resolution 1115 (1997) condemning Iraq’s refusal of access and demanding
    full cooperation with UNSCOM.
  content_domain: other:UN-sanctions
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: Faced with Iraq’s demand for conditions on inspections, Mr Ekéus chose to design a compromise procedure that permitted
    limited delays while preserving inspection authority. He argued the approach balanced Iraq’s security concerns with the
    Council’s mandate, though it was opposed by the US and UK. The decision aimed to maintain the effectiveness of the inspection
    regime.
  span_range:
  - src:7c17e29ebd32#p71.8
  - src:7c17e29ebd32#p71.10
  decision: Executive Chairman of UNSCOM (Mr Ekéus) decides to develop inspection modalities that allow delayed access without
    compromising control of sensitive sites.
  content_domain: other:inspection-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The panel faced the choice of accepting the FFCD or rejecting it and stopping assistance. The source states the panel
    concluded the declaration was incomplete and inaccurate, and therefore the Commission would not further assist.
  span_range:
  - src:7c17e29ebd32#p86.4
  - src:7c17e29ebd32#p86.5
  decision: UNSCOM expert panel decided to deem Iraq’s latest Full, Final, Complete Declaration (FFCD) unacceptable and to
    cease assisting Iraq in formulating its account.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 14
  focus: The Council chose to adopt a sanction‑or‑not resolution in response to Iraq’s alleged non‑co‑operation. The text
    records the adoption, the voting, and the intended measures.
  span_range:
  - src:7c17e29ebd32#p91.2
  - src:7c17e29ebd32#p91.7
  decision: UN Security Council adopted Resolution 1134 (1997) imposing travel restrictions on Iraqi officials if UNSCOM reported
    non‑compliance.
  content_domain: other:sanctions-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 15
  focus: Iraq faced the option of allowing U.S. inspectors and flights or imposing restrictions. The source records the decision
    to bar U.S. nationals and request suspension of U‑2 overflights.
  span_range:
  - src:7c17e29ebd32#p95.8
  - src:7c17e29ebd32#p96.3
