  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 26
  focus: 'The Joint Memorandum of May 1999 sets out the UK’s strategic choice: maintain a policy of containment (including
    sanctions and possible military force) versus seeking a different approach such as regime change. Reasons include the
    risk of Saddam re‑arming, the impracticality of a full withdrawal, and the need to protect regional security and British
    interests.'
  span_range:
  - src:7c17e29ebd32#p180.4
  - src:7c17e29ebd32#p180.6
  decision: UK Government (Joint Memorandum) decides that containment, backed by sanctions and the threat of force, is the
    only viable policy toward Iraq, with sanctions lifted only if Iraq complies with UN resolutions.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 27
  focus: Resolution 1284 (1999) reflects the Council’s decision to overhaul the weapons‑inspection regime, choosing a new
    commission (UNMOVIC) over retaining UNSCOM. The reasons cited include the need for a reinforced monitoring system, unresolved
    disarmament issues, and the desire to restore credibility to the non‑proliferation regime.
  span_range:
