  focus: The excerpt records the US National Security Advisor’s statement of policy after Operation Desert Fox, outlining
    the choice between continued containment (with possible force) versus attempting to dislodge Saddam by ground invasion.
    The decision is presented as a strategic policy choice, with reasons given about the unsustainability of a large‑scale
    ground campaign and the desire to avoid a prolonged occupation.
  span_range:
  - src:7c17e29ebd32#p166.9
  - src:7c17e29ebd32#p166.10
  decision: National Security Advisor (US) decides to contain Saddam Hussein in the short‑ and medium‑term, using force if
