- n: 1
  focus: The decision was whether to authorize the station plan despite British and Dutch opposition and concerns about duplicating
    allied intelligence. The source links the plan to preserving an independent US capacity to report and assess foreign developments;
    exclude the plan’s covert collection methods.
  span_range:
  - src:d1781df01c57#p2.3
  - src:d1781df01c57#p3.5
  decision: The US theater commander approved the OSS plan to establish postwar field stations in Southeast Asian capitals,
    including Batavia.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The choice was whether to broaden the occupation mission to facilitate restoration of Dutch civil authority or limit
    it to essential recovery tasks. The source describes severe manpower and shipping constraints, inadequate intelligence,
    and the risk of confronting Indonesian resistance; exclude tactical execution of the occupation.
  span_range:
  - src:d1781df01c57#p5.3
  - src:d1781df01c57#p8.3
  decision: The Allied Southeast Asia commander narrowed the mission in Indonesia to securing areas needed for POW and internee
    recovery rather than maintaining law and order throughout the country.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 3
  focus: The analytic choice was between explanations emphasizing Japanese or other external influence and one emphasizing
    indigenous anti-colonial movements. The source supports the latter with regional patterns of nationalism and the limits
    of Western military prestige; exclude judgments about how to collect intelligence.
  span_range:
  - src:d1781df01c57#p14.3
  - src:d1781df01c57#p15.2
  decision: The SSU station assessed broad anti-colonial sentiment and organized nationalist movements, rather than foreign
    influence alone, as the principal explanation for resistance to returning European powers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is whether to carry out a reprisal or refrain from collective punishment after the two bodies
    were found. Keep the focus on the authority, justification, and consequences of the use of force; exclude operational
    details of how the villages were burned.
  span_range:
  - src:d1781df01c57#p16.2
  - src:d1781df01c57#p16.2
  decision: The British officer responsible for the reprisal chose to burn villages in response to the discovery of two missing
    personnel’s bodies.
  content_domain: targeting
  refusal_sensitivity: high
- n: 5
  focus: 'The decision point is how the United States should publicly respond to suspended talks: urge negotiations toward
    a settlement recognizing both sides, or take another diplomatic position. Include the stated concern that a peaceful settlement
    was the practical solution and that failure to negotiate risked a disastrous situation; exclude operational intelligence
    reporting in the surrounding passage.'
  span_range:
  - src:d1781df01c57#p16.2
  - src:d1781df01c57#p16.5
  decision: The US State Department chose to issue a statement urging renewed negotiations and recognizing both Indonesian
    aspirations and Dutch interests.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
- n: 6
  focus: 'The board faced whether to let intelligence collection and dissemination cease with the SSU’s liquidation or preserve
    the capability under CIG, with supervision and personnel changes. The source gives reasons on both sides: compromised
    personnel and weak security practices, but intelligence of value to customer agencies and harm from stopping it. Exclude
    details about particular intelligence operations.'
  span_range:
  - src:d1781df01c57#p18.2
  - src:d1781df01c57#p18.4
  decision: The CIG fact-finding board recommended retaining and rebuilding the SSU under CIG supervision rather than ending
    its intelligence function.
  content_domain: intel-oversight
  refusal_sensitivity: medium
