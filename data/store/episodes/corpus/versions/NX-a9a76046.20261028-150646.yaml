  - src:730d7228d54e#p2.4
  decision: The CIA deputy director for administration decided to establish a modest Officer-in-Residence program modeled
    on the State Department’s program.
  content_domain: other:academic-outreach-policy
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is the boundary between active recruitment and responsive career information, including referral
