  content_domain: other:academic-outreach-policy
  refusal_sensitivity: medium
- n: 3
  focus: The decision followed an audit finding that program administration needed standardization and that decentralized
    arrangements could accommodate employees’ personal preferences. Focus on the choice to centralize selection and the stated
    governance reasons, not on the detailed application workflow.
  span_range:
  - src:730d7228d54e#p8.1
  - src:730d7228d54e#p8.4
  decision: The CIA Inspector General and program authorities decided to replace largely decentralized OIR selection with
    a more centrally managed process led by the Center for the Study of Intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The decision was whether to be open about the officer’s affiliation and purpose or to minimize visibility; the account
    contrasts this choice with a prior campus arrival that prompted suspicion and protest. Include the stated concern about
    recruitment perceptions and the dean’s public support, but exclude any covert methods or operational details.
  span_range:
