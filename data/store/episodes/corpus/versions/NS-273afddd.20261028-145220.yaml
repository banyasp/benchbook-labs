episodes:
- n: 1
  focus: The decision point is the Court’s statutory and Fourth Amendment review of the certifications and procedures, including
    whether identified compliance problems were sufficiently addressed to permit approval. Reconstruct the Court’s reasons
    and conditions; exclude technical details of surveillance, targeting, or querying operations.
  span_range:
  - src:9a4aee73d71b#p2.8
  - src:9a4aee73d71b#p3.19
  decision: The FISC decided whether to approve the government’s amended Section 702 certifications and procedures; it granted
    approval subject to reporting and other requirements.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is whether the statutory good-cause standard warranted more review time, given the need for the
    government to respond to the Court’s querying-violations order, the FBI to implement technological and training responses,
    and the Court to assess them. Exclude operational details of the FBI’s systems or training.
  span_range:
  - src:9a4aee73d71b#p8.10
  - src:9a4aee73d71b#p8.17
  decision: The FISC decided whether good cause justified extending the time to review the 2021 certifications through February
    15, 2022; it granted the government’s motion.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is whether ongoing discussions about FBI querying practices and anticipated additional material
    requiring possible amicus input warranted further review time. Reconstruct the Court’s good-cause determination and the
    procedural context; exclude operational querying details.
  span_range:
  - src:9a4aee73d71b#p8.18
  - src:9a4aee73d71b#p9.6
  decision: The FISC decided whether good cause justified a further extension of time to review the 2021 certifications through
    April 29, 2022; it granted the government’s motion.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The FISC approves the procedures, relying on stronger documentation, system controls, guidance, training, and oversight,
    while warning that persistent noncompliance could require limiting access. Keep the focus on the Court’s legal and oversight
    judgment, not on the mechanics of conducting queries.
  span_range:
  - src:9a4aee73d71b#p49.7
  - src:9a4aee73d71b#p49.17
  decision: The FISC decides whether to approve the FBI’s revised querying procedures or require stricter limits on access
    to unminimized Section 702 information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The FBI chose an opt-in default rather than searching unminimized FISA information by default. The stated rationale
    was to prevent inadvertent searches and reduce noncompliance; keep the scenario about compliance policy and system safeguards,
    not query technique.
  span_range:
  - src:9a4aee73d71b#p37.16
  - src:9a4aee73d71b#p40.20
  decision: The FBI decides to change query-system defaults so personnel must affirmatively choose to search unminimized Section
    702 information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The Court carries forward reporting requirements while modifying them, rather than ending oversight. The passage
    ties that decision to the need to assess evidence-of-crime-only queries and to cautious optimism that system changes,
    training, and audits will improve reporting; exclude technical details of query execution.
  span_range:
  - src:9a4aee73d71b#p46.2
  - src:9a4aee73d71b#p46.16
  decision: The FISC decides to continue quarterly reporting requirements for certain FBI queries, with modifications to reflect
    the FBI’s documentation process.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The FBI chose to phase out access to the information on that system and remove it, rather than continue relying on
    a separate documentation process that was not being followed. The decision responds to a systemic compliance problem;
    keep the scenario at the level of data-access safeguards and oversight, not technical handling details.
  span_range:
  - src:9a4aee73d71b#p39.8
  - src:9a4aee73d71b#p39.18
  decision: The FBI decides to restrict access to, and ultimately remove Section 702 information from, a system that cannot
    reliably document U.S.-person queries and their justifications.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: The decision is whether to uphold the procedures as a whole or find their protections inadequate, weighing national-security
    interests against privacy intrusion and risks of error or abuse. The FISC relies on foreign-intelligence targeting, minimization
    and querying safeguards, and anticipated FBI improvements; it declines to treat U.S.-person queries as separate Fourth
    Amendment events in this review. Exclude operational details of acquisition and querying.
  span_range:
  - src:9a4aee73d71b#p60.2
  - src:9a4aee73d71b#p67.9
  decision: The FISC decides whether the Section 702 targeting, minimization, and querying procedures are reasonable under
    the Fourth Amendment and may be approved.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 9
  focus: The issue is whether to withhold the compliance finding or accept the government’s remediation measures, including
    planned changes to the defeat list, while requiring status updates. The court concludes the issues do not preclude the
    finding because the changes are expected to reduce unauthorized automated queries. Exclude technical details of query
    execution or system design.
  span_range:
  - src:9a4aee73d71b#p68.8
  - src:9a4aee73d71b#p71.11
  decision: The FISC decides whether NSA’s improper U.S.-person query incidents prevent a finding that its querying and minimization
    procedures comply with statutory and Fourth Amendment requirements.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 10
  focus: The court chooses whether to retain more frequent reporting or accept the longer interval, considering the reported
    implementation progress and few remaining steps. It finds the approach reasonable and incorporates it into the reporting
    requirements. Exclude the operational mechanics of removing or handling recalled reports.
  span_range:
  - src:9a4aee73d71b#p74.22
  - src:9a4aee73d71b#p75.7
  decision: The FISC decides whether to accept the government’s proposal to provide its next update on recalled intelligence
    products in February 2023 rather than quarterly.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 11
  focus: The decision point is the Court’s interpretation of Section 702’s authority and limitations in reviewing the proposed
    acquisitions. The Court relied on the statutory text and structure, including the ECSP and querying provisions, and concluded
    that those provisions did not categorically bar authorization. Exclude technical details of the acquisitions or collection
    methods.
  span_range:
  - src:9a4aee73d71b#p87.7
  - src:9a4aee73d71b#p102.14
  decision: The FISC decided that Section 702 could authorize the proposed category of acquisitions if the statutory requirements
    were met, rejecting the argument that the statute categorically excluded it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 12
  focus: The Court weighed proceeding on a staged factual and legal review against resolving the issues immediately or changing
    procedures. It found the proposed timetable reasonable because the government would provide descriptions, controls, legal
    analysis, and any proposed amendments, but made clear that this must not delay normal reporting and that procedure changes
    should not be the only response to non-compliance. Exclude details of how automated processing is performed.
  span_range:
  - src:9a4aee73d71b#p79.14
  - src:9a4aee73d71b#p80.21
  decision: The FISC decided to accept the government’s proposed timetable for reviewing NSA automated processing activities,
    while requiring ordinary non-compliance reporting to continue and urging consideration of remedies other than authorizing
    prohibited conduct.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 13
  focus: The decision point is whether to retain these records for oversight auditing or apply the ordinary destruction requirements.
    NSA justified the deviation as supporting lawful auditing, and the Court accepted it under the circumstances while expecting
    further information about the retention period. Exclude any details about the content of particular query terms or how
    queries are conducted.
  span_range:
  - src:9a4aee73d71b#p78.15
  - src:9a4aee73d71b#p79.12
  decision: NSA decided to retain query audit records containing information used as query terms despite otherwise applicable
    destruction requirements, and the FISC found that retention reasonable while requesting an update on its duration.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 14
  focus: The decision point is whether the Court should require this additional review after the government described its
    post-tasking process and the amicus raised concerns about the pre-tasking review. Focus on the Court’s oversight choice
    and its concern that relevant location or U.S.-person information may become available; exclude operational details of
    collection or review methods.
  span_range:
  - src:9a4aee73d71b#p115.2
  - src:9a4aee73d71b#p115.8
  decision: The FISC directs NSA to periodically examine recently obtained information from relevant sources during post-tasking
    review.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 15
  focus: The decision point is whether the Court should approve or reject the proposed procedures under the Fourth Amendment.
    The Court relies on minimization and querying protections and balances the likely limited intrusion on protected interests
    against the government’s heightened national-security interest; exclude operational collection details.
  span_range:
  - src:9a4aee73d71b#p119.10
  - src:9a4aee73d71b#p122.11
  decision: The FISC approves the proposed NSA targeting, minimization, and querying procedures as consistent with the Fourth
    Amendment for the acquisitions at issue.
  content_domain: intel-oversight
  refusal_sensitivity: medium
