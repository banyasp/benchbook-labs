- n: 2
  focus: The NIC chose to proceed to approval without the usual peer and outside-expert review, rather than add those review
    steps to the process. The stated reason was the compressed schedule, with the NIC Vice Chairman describing the involvement
    of four National Intelligence Officers as a virtual peer review; exclude operational collection details and the merits
    of the NIE’s substantive conclusions.
