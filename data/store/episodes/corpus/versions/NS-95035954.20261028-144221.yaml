  focus: The decision was whether to commission a coordinated estimate or leave policymakers without one as Congress considered
    Iraq-related decisions. Congressional requests argued that a formal community assessment would inform executive and legislative
    policymakers, including an impending Senate resolution; exclude later judgments about whether the estimate’s conclusions
    were accurate.
