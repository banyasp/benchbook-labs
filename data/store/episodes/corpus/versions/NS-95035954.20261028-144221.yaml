  focus: 'The decision point is how analysts represented their assessments to policymakers: they could distinguish what they
    knew from what they inferred, but the NIE stated that Iraq had chemical and biological weapons and was reconstituting
    its nuclear program. The passage gives the analysts’ prior knowledge and the past Iraqi behavior that informed their assessment;
    exclude separate collection or policymaker decisions.'
