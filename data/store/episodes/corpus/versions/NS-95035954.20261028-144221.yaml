  focus: The National Intelligence Officer weighed including the uranium issue among the key judgments against leaving it
    in the body for completeness. The stated reasons were that the issue was not necessary to the case that Iraq was reconstituting
    its nuclear program and that support for elevating it was lacking; exclude the later accidental placement of INR’s dissent
    as a separate decision.
