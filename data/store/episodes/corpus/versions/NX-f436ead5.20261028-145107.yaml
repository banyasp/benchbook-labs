    pending free elections, rather than a handover to Batista’s designated successor.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 3
  focus: The November 1959 memorandum directs operations to treat the revolutionary government as basically non-Communist,
    support overt efforts at rapprochement, and avoid forceful means; it also sets conditions under which direct attacks would
    be reconsidered and says violent action should be discouraged pending a policy change. Keep the focus on the policy standard
    and conditional authority, excluding the separate, more aggressive program described afterward.
  span_range:
  - src:03dbcfcc930e#p1.282
  - src:03dbcfcc930e#p1.284
  decision: CIA policy leadership directs field operations to pursue rapprochement with the Cuban government and avoid force
    unless specified conditions warrant policy reconsideration.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 4
  focus: 'This is a policy choice about the scope and approval process for action against Cuba: the President rejected identifying
    assets specifically for sugar sabotage, asked for a broader plan, and delayed action pending his return. Keep the focus
    on that choice and its stated rationale; exclude any operational details of sabotage.'
  span_range:
  - src:03dbcfcc930e#p1.475
  - src:03dbcfcc930e#p1.485
  decision: The President declined to support a sugar-industry sabotage plan as the specific focus, instead backing broad
    identification of assets and requesting a comprehensive covert-action program for later consideration.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 5
  focus: The decision point is whether to proceed with the covert program or hold back in favor of other approaches, and the
    conditions the President set for proceeding. Consider the stated concerns about likely Cuban reactions, protection of
    U.S. people, regional support, and U.S. prestige; exclude operational details of the program’s component activities.
  span_range:
  - src:03dbcfcc930e#p1.739
  - src:03dbcfcc930e#p1.756
  decision: The President approved proceeding with the covert-action program against the Castro regime, while directing preparation
