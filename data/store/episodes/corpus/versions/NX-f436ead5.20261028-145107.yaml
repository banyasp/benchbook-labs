  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 6
  focus: The Agency sought an additional $10.75 million as program needs grew. The Special Group chose escalation before commitment
    because substantial expenditures were imminent and the operation should not proceed without reasonable assurance it would
