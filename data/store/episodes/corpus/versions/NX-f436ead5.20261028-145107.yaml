- n: 1
  focus: The foreword identifies a government policy decision to displace Castro, rather than a unilateral CIA initiative,
    and links the CIA-led, deniable approach to fears of censure by the UN or OAS. Treat this as a policy choice about the
    goal and public authority for the effort; exclude any operational methods of implementation.
  span_range:
  - src:03dbcfcc930e#p1.2
  - src:03dbcfcc930e#p1.10
  decision: U.S. policy makers decide in March 1960 to displace Castro and make the CIA the principal implementing arm under
    a plausible-deniability caveat.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 2
  focus: The account describes agency and State support for the junta plan, including assurances to Batista about the safety
    of himself and his associates; Batista ultimately did not accept it. The decision point is the proposed political transition
    and its objectives, not the particulars of any covert preparations or support activities.
  span_range:
  - src:03dbcfcc930e#p1.123
  - src:03dbcfcc930e#p1.151
