- n: 2
  focus: The decision point is whether to retain the prior flexibility for overnight locations or require everyone to stay
    at Ellington Field, while changing meal reimbursement to the full per diem rate. The report gives reasons including centralizing
    personnel, concerns about further policy complaints and expenses, and the commander’s stated fatigue with continued discussion;
    exclude the later flight execution details.
  span_range:
  - src:9087d45bf560#p38.2
  - src:9087d45bf560#p39.2
  decision: The 50 FTS/CC changed the squadron cross-country overnight-location policy to require personnel to remain at Ellington
    Field.
  content_domain: other:squadron travel policy
  refusal_sensitivity: low
- n: 3
  focus: The decision point is whether to preserve the Citadel commitment while complying with the revised Ellington requirement,
    despite knowing the schedule would be tight, or to abandon the event or stop short of Ellington. The report gives the
    pilot’s professional obligation and his belief that the aircraft had to be in Ellington and that he still had duty time;
    exclude the subsequent flying actions and aircraft-control decisions.
  span_range:
  - src:9087d45bf560#p41.8
  - src:9087d45bf560#p42.4
  decision: The mishap pilot chose to pursue both the Citadel commitment and the requirement to remain overnight at Ellington
    Field rather than opt out of the event or stay at Mobile.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 4
  focus: The commander chose a high-sortie training plan rather than a less demanding schedule. The stated reasons included
    completing training requirements, improving proficiency, and stretching a limited TDY budget to send more instructor pilots
    on cross-country trips; the report also describes concerns about fatigue and whether the training benefits justified the
    risk. Exclude aircraft-handling and flight-procedure details.
  span_range:
  - src:9087d45bf560#p51.3
  - src:9087d45bf560#p52.4
  decision: The 50 FTS/CC set the CT cross-country weekend plan to fly four sorties on Friday and Saturday.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 5
  focus: The commander changed the lodging requirement, and the report links that decision to the riskier schedule the MP
    ultimately flew. The stated reasons included avoiding perceived partiality after similar requests had been denied and
    concern that the accompanying pilot might use the trip to raise policy complaints; the commander nevertheless supported
    the Citadel activities. Exclude flight execution details.
  span_range:
  - src:9087d45bf560#p60.3
  - src:9087d45bf560#p60.3
  decision: The 50 FTS/CC required the MP to stay overnight at Ellington Field rather than follow the previously approved
    Charleston itinerary.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 6
  focus: The assistant operations officer left the concern at the existing level rather than referring it upward, despite
    the MP’s planned four sorties and the concern about the length of the day. The stated basis was that the plan could work
    if planned correctly; the report notes that the concern was not elevated. Exclude flight-procedure details.
  span_range:
  - src:9087d45bf560#p53.2
  - src:9087d45bf560#p53.2
  decision: The assistant operations officer chose not to elevate an instructor pilot’s concern about the MP’s expected long
