  focus: The report says the pilot chose to preserve the ROTC commitment, adapted the plan, and believed the aggressive timeline
    would still permit a safe arrival; it also identifies the resulting mission profile as unnecessarily risky relative to
    its benefits. Frame this as a mission-risk decision, and exclude the subsequent approach and landing decisions.
