- n: 1
  focus: The panel weighed the KINGFISH’s smaller radar cross section against the A-12’s somewhat better specifications, lower
    projected cost, and Lockheed’s stronger record for delivering projects on time and managing a classified program. Focus
    on the acquisition choice and its stated rationale; exclude aircraft design details.
  span_range:
  - src:64ef9cbb137f#p14.4
  - src:64ef9cbb137f#p15.4
  decision: The CIA/Defense/Air Force selection panel chose Lockheed’s A-12 over Convair’s KINGFISH for further development.
  content_domain: other:intelligence program acquisition
  refusal_sensitivity: medium
- n: 2
  focus: The decision followed design changes and a successful effort to meet the radar-cross-section requirement. The source
    explains that U-2 overflights of the Soviet Union had ended, CORONA’s reliability remained uncertain, and no other feasible
    vehicle was available; focus on the decision to proceed and its strategic rationale, not technical design or testing.
  span_range:
  - src:64ef9cbb137f#p16.2
  - src:64ef9cbb137f#p16.4
  decision: The CIA authorized design, construction, and testing of the A-12 and contracted for 12 aircraft.
  content_domain: other:intelligence program acquisition
  refusal_sensitivity: medium
- n: 3
  focus: Officials faced rising costs and repeated technical delays, with expenditures already at $136 million by October
    1961. Focus on the resource decision and the stated cost rationale; exclude the technical causes of the delays.
  span_range:
  - src:64ef9cbb137f#p21.4
  - src:64ef9cbb137f#p21.5
  decision: CIA project officials reduced planned A-12 production from 12 aircraft to 10.
  content_domain: other:program resourcing
  refusal_sensitivity: medium
- n: 4
  focus: The decision presents a choice between allowing ordinary insurance or legal processes to follow the damage and paying
    for it to protect the classified program. Focus on the secrecy, accountability, and legal-oversight tradeoff; exclude
    the logistics of transporting the aircraft.
  span_range:
  - src:64ef9cbb137f#p27.2
  - src:64ef9cbb137f#p27.3
  decision: OXCART project managers authorized payment for damage to a bus to avoid an insurance or legal inquiry that could
    compromise the program.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The choice was whether to reveal an aircraft as cover or preserve secrecy over the A-12; officials weighed the risk
    that disclosure could expose design innovations and compromise reconnaissance value against the likelihood of uncontrolled
    disclosure and the value of a public explanation. Keep the focus on the disclosure decision and its security rationale,
    not the aircraft’s technical characteristics or the speed-record proposal.
  span_range:
  - src:64ef9cbb137f#p37.3
  - src:64ef9cbb137f#p38.1
  decision: The President and national-security officials chose to disclose the Air Force YF-12A as the “A-11” while keeping
    the CIA A-12 classified.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The committee faced whether to accept deployment proposals despite analysts’ assessments that adversaries were unlikely
    to react publicly. It judged the intelligence requirements insufficiently urgent to justify political risks to relations
    and revealing capabilities; exclude the operational details of missions and basing procedures.
  span_range:
  - src:64ef9cbb137f#p42.2
  - src:64ef9cbb137f#p43.1
  decision: The 303 Committee rejected the proposed A-12 deployments to Okinawa for reconnaissance over China and North Vietnam.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The decision arose from concern that North Vietnam might deploy surface-to-surface missiles without detection; the
    CIA argued the A-12 offered useful collection advantages over other available systems. Treat this as an authorization
    decision and exclude flight profiles, route planning, and other operational collection details.
  span_range:
  - src:64ef9cbb137f#p43.1
  - src:64ef9cbb137f#p43.2
  decision: The President approved the CIA proposal to deploy the A-12 for reconnaissance over North Vietnam in May 1967.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: With the Pueblo seized and officials considering a forceful response, the choice was whether to use the A-12 to clarify
    the situation despite concern that it could be exposed or lost. The advisory group recommended a plan and the President
    approved it; focus on authorization and the intelligence-versus-escalation risk, not mission routing or collection procedures.
  span_range:
  - src:64ef9cbb137f#p47.2
  - src:64ef9cbb137f#p48.2
  decision: The President approved the first A-12 reconnaissance mission over North Korea during the Pueblo crisis.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 9
  focus: Officials considered maintaining both fleets, sharing SR-71s while mothballing A-12s, or ending the A-12 program;
    the decision weighed cost, fleet duplication, comparative capability, and SR-71 readiness, with the CIA Director arguing
    for continuation. Keep the issue at the level of program policy and resource allocation, not aircraft operations.
  span_range:
  - src:64ef9cbb137f#p51.1
  - src:64ef9cbb137f#p52.2
  decision: The President and senior officials chose to terminate the CIA A-12 program and transition reconnaissance responsibility
    to the Air Force’s SR-71 program.
  content_domain: other:intelligence-program policy
  refusal_sensitivity: medium
- n: 10
  focus: The decision point is whether to terminate the program or continue it after a fatal test accident. The passage links
    the decision to the crash and death; exclude technical details of the launch and any later operational use of the drones.
  span_range:
  - src:64ef9cbb137f#p62.5
  - src:64ef9cbb137f#p62.5
  decision: The Skunk Works program leader decided to end TAGBOARD after a launch mishap crashed the mother ship and killed
