  focus: The document describes a choice between maintaining very restrictive ROE/centralized TEA that limited the number
    of ISIS targets engaged and loosening those constraints to increase strike tempo. The decision was justified by evidence
    that the constraints created bottlenecks, reduced effectiveness, and that concerns about civilian casualties proved unfounded
    after relaxation.
  span_range:
