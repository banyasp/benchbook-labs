    forces, the decision makers evaluated land‑based convoys and air‑bridge deliveries as more reliable but unsafe. They chose
    airdrop despite higher risk of wastage and civilian crowding, using JPADS where possible, to provide aid under hostile
    conditions.
  span_range:
