  focus: The commander evaluated the strategic situation in October 2014‑January 2015, noting ISIS’s concentration of forces
    on Kobani. He chose to prioritize strikes against ISIS in Kobani, instead of reallocating assets to other theaters. The
    rationale was that ISIS had made Kobani its main effort and that sustained air pressure would blunt its momentum.
