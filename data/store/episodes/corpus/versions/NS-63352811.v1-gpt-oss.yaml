  focus: U.S. and Russian senior officials decided whether to formalize deconfliction procedures for manned and unmanned aircraft
    operating over Syria. The choice was to sign an MOU establishing safety‑of‑flight rules (including a de‑facto line at
    the Euphrates) or to operate without such an agreement, risking unintended air‑to‑air incidents. The decision was justified
    by the need to prevent escalation as Russian combat aircraft entered the theater and to preserve freedom of operation
    for coalition forces.
