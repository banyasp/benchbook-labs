  focus: The President of the United States faced the choice of authorizing a rapid USAF‑led airdrop of relief supplies to
    civilians trapped on Mount Sinjar or refraining due to operational risk and political considerations. The decision to
    proceed was based on the imminent risk of mass civilian casualties (potential genocide), a request from the Iraqi government,
    and the unique capability of U.S. airpower to deliver aid quickly in a non‑permissive environment.
  span_range:
