  focus: The FCO paper identifies serious obstruction and a pattern of lesser obstruction as possible grounds, and recommends
    urging the US to focus on serious violations or a pattern so as to preserve Security Council support for force. Treat
    this as a policy recommendation, not as evidence that the recommended threshold was formally adopted; exclude operational
    responses to any breach.
