  - src:1449eb6ac72a#p20.3
  decision: The incoming regimental commander chose to make providing information the regiment’s common purpose and to focus
    its MET training on movement to contact.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 2
  focus: The example presents five HQDA-directed METs and the commander’s choice to focus on two, rather than attempt to master
