  focus: The commander faced competing demands on a recently relocated, unsettled regiment and was asked how to prioritize
    its activities. The choice was to focus the organization on its information-providing purpose and the MET most directly
    supporting it, rather than simply rank or pursue the many mandated tasks; exclude operational details of carrying out
    the mission.
  span_range:
