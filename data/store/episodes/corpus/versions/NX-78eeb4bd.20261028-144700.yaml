episodes:
- n: 1
  focus: The decision was whether to let cryptanalytic activity continue across a growing number of agencies or restrict it
    to a smaller set of authorized bodies; the JCS cited security and the dispersal of scarce analytic resources, and the
    President issued the directive. Focus on the wartime authority and jurisdictional choice, not the operational allocation
    of targets or methods described elsewhere in the passage.
  span_range:
  - src:181266294934#p23.3
  - src:181266294934#p25.8
  decision: The President directed the discontinuation of cryptanalytic activities by the FCC, OSS, the Director of Censorship,
    and similar agencies, following the JCS recommendation to limit which government entities conducted cryptanalysis.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision weighs placing the board within the JCS against keeping it outside that framework. Focus on the chiefs’
    authority and their concern that JCS routing would expose sensitive intelligence to personnel without a need to know;
    exclude the board’s operational work.
  span_range:
  - src:181266294934#p32.1
  - src:181266294934#p32.6
  decision: The Army and Navy chiefs decide to establish the Army-Navy Communication Intelligence Board outside the Joint
    Chiefs of Staff structure and have it report directly to them.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The President weighs whether to continue the collaboration following a joint recommendation from the Secretaries
    of State, War, and the Navy. Focus on the authorization and its national-interest standard; exclude the technical details
    of the collaboration.
  span_range:
  - src:181266294934#p37.5
  - src:181266294934#p37.5
  decision: The President decides to authorize the Army and Navy to continue U.S.-U.K. communications-intelligence collaboration,
    with authority to extend, modify, or discontinue it in the U.S. interest.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The board chooses coordination under joint direction while retaining separate service organizations, amid disagreement
    over merger and pressure to establish centralized controls for postwar collaboration. Focus on the organizational policy
    choice and the interests in coordination versus service control; exclude operational task allocations and collection procedures.
  span_range:
  - src:181266294934#p44.4
  - src:181266294934#p45.5
  decision: The State-Army-Navy Communications Intelligence Board decides to adopt a joint Army-Navy working partnership rather
    than merge the services’ communications-intelligence organizations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The board’s leaders seek approval for State membership after State established its own communications-intelligence
    unit. Focus on the governance choice to include a civilian department and the aim of bringing U.S. activities under a
    common policy mechanism; exclude intelligence operations.
  span_range:
  - src:181266294934#p37.6
  - src:181266294934#p38.1
  decision: The Army-Navy board’s leaders decide to expand board membership to include the Department of State.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The decision followed competing proposals for centralized control or a status quo arrangement with advisory coordination.
    Consider the stated preference for centralization and the directive’s aim of coordinating federal foreign intelligence;
    exclude intelligence collection techniques.
  span_range:
  - src:181266294934#p54.3
  - src:181266294934#p55.1
  decision: The president chose to establish the National Intelligence Authority and Central Intelligence Group rather than
    retain independent departmental intelligence agencies without a central body.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The decision point is whether to allow the Air Force expansion to proceed or pause it while exploring consolidation.
    Focus on the stated concerns about duplication, costs, coordination, and cryptologic needs; exclude technical collection
    or analytic methods.
  span_range:
  - src:181266294934#p65.5
  - src:181266294934#p65.6
  decision: The Secretary of Defense postponed Air Force plans to expand its COMINT agency while considering whether to combine
    military COMINT activities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: The decision point is whether to adopt consolidation or retain the services’ separate arrangements, including how
    to address service and civilian-agency objections. Focus on the Secretary’s authority, unification and economy rationale,
    and the resulting directive; exclude the technical conduct of intelligence activities.
  span_range:
  - src:181266294934#p68.5
  - src:181266294934#p70.4
  decision: The Secretary of Defense ordered the creation of AFSA to consolidate military COMINT and communications-security
    activities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 9
  focus: The decision point is how to allocate tasking authority when the AFSA charter excluded mobile sites from AFSA control
    and the Air Force classified all its sites as mobile. Focus on the jurisdictional compromise and its stated context; exclude
    collection methods or site-level operational instructions.
  span_range:
  - src:181266294934#p77.3
  - src:181266294934#p77.5
  decision: AFSA and the Air Force agreed to share tasking authority over Air Force mobile collection sites.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 10
  focus: The decision point is whether to continue consideration of CONSIDO despite disagreement over who would control it,
    or remove it when members could not agree. The passage states that USCIB required unanimity and that the members were
    sharply divided; exclude the proposal’s operational functions.
  span_range:
  - src:181266294934#p83.4
  - src:181266294934#p83.5
  decision: USCIB members removed the CONSIDO proposal from the agenda rather than choose between USCIB and military control
    of the proposed structure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 11
  focus: The decision point is whether to accept AFSA’s proposed centralized direction or preserve Army control over its field
    operations. The Army said AFSA was not responsible for providing its field commanders combat COMINT and asserted its own
    authority; exclude the technical details of field collection and processing.
  span_range:
  - src:181266294934#p85.6
  - src:181266294934#p86.1
  decision: The Army rejected AFSA’s proposed operational direction of Army field processing and reserved control of its intelligence
    operations to itself.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 12
  focus: The decision point is the President’s choice to reorganize COMINT as a national responsibility and establish a National
    Security Agency under a revised authority structure. The Brownell Committee’s report recommended one organization to manage
    government COMINT and criticized military autonomy; exclude operational collection or analysis methods.
  span_range:
  - src:181266294934#p95.3
  - src:181266294934#p95.5
  decision: The President replaced AFSA with a national-level COMINT structure and made the Department of Defense the government’s
    executive agent, rather than leave control with the existing JCS-centered arrangement.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 13
  focus: The decision point is how to balance national COMINT unification against the services’ need to support forces in
    the field. Keep the focus on the allocation of authority and the stated military-staffing and field-support reasons; exclude
    operational collection methods.
  span_range:
  - src:181266294934#p100.6
  - src:181266294934#p101.1
  decision: The Brownell Committee recommended giving AFSA central operational and technical control while reserving direct
    field-support responsibilities to the military services.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 14
  focus: The decision point is whether to delegate NSA oversight to the JCS or place it in an office outside JCS organizational
    ties. The stated reason was fidelity to the earlier presidential guidance; exclude details of COMINT operations.
  span_range:
  - src:181266294934#p104.10
  - src:181266294934#p105.1
  decision: The Secretary of Defense rejected placing NSA oversight under the Joint Staff and kept supervisory responsibility
    within the Secretary’s own office.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 15
  focus: The decision point is whether to approve the proposed military agency or reject it in favor of preserving civilian
    participation in COMINT and all-source intelligence processes. Keep the focus on governance and the stated concerns about
    civilian input; exclude operational dissemination procedures.
  span_range:
  - src:181266294934#p110.8
  - src:181266294934#p111.1
  decision: USCIB rejected the Army proposal to establish CONSIDO with control over COMINT dissemination and related evaluation
    functions.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 16
  focus: The decision point is whether USCIB should continue requiring unanimity or use majority voting for its decisions.
    The passage ties the change to the board’s prior inability to function effectively; exclude intelligence collection or
    operational details.
  span_range:
  - src:181266294934#p102.4
  - src:181266294934#p103.5
  decision: The NSC directive adopted majority voting for USCIB decisions rather than retaining unanimity.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 17
  focus: The decision point is whether to create a centralized archival office or continue with the existing records-management
    arrangements. The passage cites the mandatory declassification of intelligence documents at least 30 years old and longstanding
    problems with records management as reasons; exclude operational intelligence decisions.
  span_range:
  - src:181266294934#p131.5
  - src:181266294934#p132.2
  decision: The NSA Director directed the establishment of a new archival office in 1977.
  content_domain: other:records-management
  refusal_sensitivity: low
