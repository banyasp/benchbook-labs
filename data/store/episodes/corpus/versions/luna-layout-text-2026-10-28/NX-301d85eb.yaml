- n: 1
  focus: The authorities could act on the translation suggesting possible Soviet occupation or seek verification; the reported
    logistical implausibility of moving forces over the Hindu Kush prompted a recheck. Focus on the analytic judgment and
    the risk of acting on a mistaken translation, not on intelligence collection methods.
  span_range:
  - src:a48ffc1fc4d8#p13.3
  - src:a48ffc1fc4d8#p14.1
  decision: British authorities in India request a recheck of an alarming translation of a Soviet message about Waziristan.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The War Office intended the section to focus on military ciphers, but little relevant intercept was available; the
    section head chose to use other available material. Focus on the analytic-priority decision and the stated rationale that
    experience with high-grade systems could be useful later, not on collection or cryptanalytic techniques.
  span_range:
  - src:a48ffc1fc4d8#p15.4
  - src:a48ffc1fc4d8#p16.1
  decision: The head of the Military Section chooses to work available nonmilitary traffic rather than restrict the section
    to military ciphers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The section head could keep handling routine work in Britain or transfer it to the bureau nearer to the intelligence
    users. The passage gives workload, language expertise, and proximity to the customer as reasons; exclude details of the
    cryptanalytic work itself.
  span_range:
  - src:a48ffc1fc4d8#p21.4
  - src:a48ffc1fc4d8#p22.1
  decision: The head of the Military Section transfers day-to-day work on Japanese military systems to the Far East Combined
    Bureau in Hong Kong.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: With an urgent shortage of Japanese linguists, the decision-maker believed job-specific reading skills could be taught
    in six months instead of the estimated three years and obtained approval to proceed. Focus on the training standard, urgency,
    and limits of the intended proficiency; exclude language-learning techniques.
  span_range:
  - src:a48ffc1fc4d8#p22.2
  - src:a48ffc1fc4d8#p22.3
  decision: The head of the Military Section chooses an accelerated Japanese-language training course rather than wait for
    a multi-year training pipeline.
  content_domain: other:intelligence training
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 5
  focus: The decision followed debate over whether to keep Enigma successes secret or disclose them to an ally that had openly
    shared its Purple work. The British official agreed to disclosure only after requiring a named recipient list and prior
    British approval for additions; exclude the technical details of Enigma exploitation.
  span_range:
  - src:a48ffc1fc4d8#p35.4
  - src:a48ffc1fc4d8#p37.3
  decision: The British official responsible for GC&CS decided to share information about the Enigma effort with the American
    delegation, subject to written limits on who could receive it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The parties weighed adopting the American system against British concerns about security, retraining, and wartime
    distribution, and agreed on a fallback arrangement. Focus on the policy choice for joint communications; exclude technical
    descriptions of cipher systems.
  span_range:
  - src:a48ffc1fc4d8#p49.3
  - src:a48ffc1fc4d8#p50.2
  decision: The British and American delegations decided to keep the M-209 in reserve while Britain continued developing its
    own tactical cipher system.
  content_domain: other:communications-security-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 7
  focus: The decision was whether to permit the visit or continue blocking it amid American suspicions about British Enigma
    disclosures. The account describes British assurances and a warning that continued opposition could imperil cooperation;
    exclude the technical details of the equipment being developed.
  span_range:
  - src:a48ffc1fc4d8#p51.2
  - src:a48ffc1fc4d8#p52.3
  decision: The U.S. acting chief of staff approved the British technical expert’s visit to Bell Laboratories after a dispute
    over access and Enigma cooperation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
