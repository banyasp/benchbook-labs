- n: 2
  focus: Under pressure to release the report, the CIA chose a version that omitted references to CIA sponsorship and psychological-warfare
    concerns rather than releasing the full report. Focus on disclosure and the reasons for limiting it; exclude the separate
    contacts with UFO researchers described nearby.
  span_range:
