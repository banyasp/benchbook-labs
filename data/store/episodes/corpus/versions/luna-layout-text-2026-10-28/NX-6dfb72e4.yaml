- n: 1
  focus: The officers chose to lead a patrol toward the reported crash site despite lacking authorization; the pilot might
    still need rescue, and a helicopter rescue near opposing forces was not feasible. Treat this as a field command decision
    about urgency, risk, and authority; exclude the patrol’s route and other execution details.
  span_range:
  - src:3f912bae9ab3#p12.1
  - src:3f912bae9ab3#p14.5
  decision: CIA field officers decide whether to begin an unauthorized search for a downed pilot or wait for instructions.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The withdrawal order followed political decisions tied to the Geneva Protocol, even though field reporting indicated
    North Vietnamese forces were not leaving. Agency officers argued against leaving the Hmong without support, and two advisers
    remained; focus on the policy choice and competing commitments, not covert implementation details.
  span_range:
  - src:3f912bae9ab3#p14.7
  - src:3f912bae9ab3#p15.2
  decision: U.S. policymakers decide whether to withdraw personnel from Laos under the neutrality protocol or retain a limited
    advisory presence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: As violations were verified and increased, the ambassador conceded that the communists were not abiding by the Protocol,
    and restrictions on U.S. activities gradually loosened. Focus on the evidentiary basis and authority for changing restrictions;
    exclude details of the activities enabled by that change.
  span_range:
  - src:3f912bae9ab3#p17.2
  - src:3f912bae9ab3#p17.2
  decision: The U.S. ambassador responsible for Laos decides whether to maintain or loosen restrictions on U.S. activities
