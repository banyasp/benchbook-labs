episodes:
- n: 1
  focus: The decision point is whether to allocate part of a newly acquired facility to the museum, despite competing requests
    from other NSA components, and to permit public access. The passage cites community support and the museum’s educational
    purpose; it also explains that the site could not secure classified material, requiring unclassified exhibits. Exclude
    later decisions about particular exhibits or media events.
  span_range:
  - src:f388f6ff56c5#p4.4
  - src:f388f6ff56c5#p4.5
  decision: NSA leadership approves the Center for Cryptologic History’s use of the motel facility for an unclassified museum
    with public admission.
  content_domain: other:agency public-access policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to retain the museum chiefly as a historical and visitor resource or use it as an instrument
    of broader public and media engagement. The stated rationale is to improve NSA’s message to the media and public understanding
    of its mission. Exclude the details of individual interviews and exhibit content except insofar as they illustrate implementation
    of that strategy.
  span_range:
  - src:f388f6ff56c5#p15.3
  - src:f388f6ff56c5#p16.3
  decision: The NSA director places the National Cryptologic Museum under the Public and Media Affairs Office and makes it
    part of the Agency’s public-facing media strategy.
  content_domain: other:agency public-affairs policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
