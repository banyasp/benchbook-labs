episodes:
- n: 1
  focus: The decision followed exercises showing commanders were challenged to exercise mission command over support-area
    forces; the handbook presents the SACP as the chosen response. Keep the scenario at the command-organization level, not
    the detailed operation of a SACP.
  span_range:
  - src:c82c31448314#p5.2
  - src:c82c31448314#p5.2
  decision: The FORSCOM commander directed division and corps commanders to establish support area command posts rather than
    continue without a dedicated support-area command post.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The division faced a non-doctrinal SACP that had to be resourced internally; the stated staffing constraint was to
    avoid degrading the main and tactical command posts. Focus on command assignment and the tradeoff in resourcing, not operational
    functions of the command posts.
  span_range:
  - src:c82c31448314#p32.7
  - src:c82c31448314#p33.2
  decision: The 1st Infantry Division commanding general appointed the deputy commanding general–support to command the SACP
    and kept OPCON staffing to a minimum.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is the division’s choice of SACP authority and design: the source says it should control units
    and perform functions including resource allocation, movement control, and terrain management. The division internally
    resourced the SACP and collocated it with the MEB for added security; exclude operational details of how those functions
    would be carried out.'
  span_range:
  - src:c82c31448314#p45.3
  - src:c82c31448314#p48.2
  decision: The 1st Armored Division chose to design its SACP as a controlling command post for support-area units, rather
    than merely a coordinating post.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
