- n: 2
  focus: The decision point is whether to rely on Army reporting alone or seek a separate intelligence assessment; the president-elect
    chose the latter because he was not comfortable relying exclusively on Army information. Focus on the choice to seek an
    independent assessment, not on the undisclosed meeting arrangements or operational details of the Korea trip.
  span_range:
  - src:fe7916119a60#p6.6
  - src:fe7916119a60#p6.10
  decision: The president-elect asks the DCI for an independent CIA assessment of Korea rather than relying exclusively on
    Army information.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is how to handle sensitive intelligence warning that Israel was completing mobilization and would
