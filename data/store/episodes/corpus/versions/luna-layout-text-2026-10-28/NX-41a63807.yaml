episodes:
- n: 1
  focus: The commander could hold the position or withdraw; the relayed captured-map report of an outflanking threat prompted
    the withdrawal, although the source later questions its reliability. Focus on the decision under uncertain intelligence,
    not on the force’s movements or defensive techniques.
  span_range:
  - src:4e9bc767f813#p8.3
  - src:4e9bc767f813#p8.4
  decision: The battalion commander decides to withdraw the blocking force after receiving a report that Japanese battalions
    may be moving to outflank it.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The commander could act on the reported information or wait; he sought corroboration and then designated the force
    for engagement. Focus on the decision to engage and the evidentiary basis, excluding the mechanics of identifying or attacking
    the force.
  span_range:
  - src:4e9bc767f813#p9.1
  - src:4e9bc767f813#p9.2
  decision: The field commander decides to authorize an air engagement against a reported Japanese force after receiving corroboration.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The commander faced a choice between stopping to protect the guide’s health and continuing because the mission depended
    heavily on him. Focus on the ethical conflict and the commander’s stated rationale; exclude medical or movement details.
  span_range:
  - src:4e9bc767f813#p15.3
  - src:4e9bc767f813#p15.3
  decision: The field commander decides to require the injured guide to continue rather than halt for treatment, overriding
    the doctor’s objection.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
