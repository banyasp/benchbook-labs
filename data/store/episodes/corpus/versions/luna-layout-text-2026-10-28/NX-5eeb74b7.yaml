- n: 1
  focus: The decision point is whether to keep special operations within MI-6 or establish a separate organization. The source
    says the growing importance of these functions led to SOE’s creation and describes its assigned authority; exclude the
    operational methods and missions themselves.
  span_range:
  - src:c18ce8171a9e#p2.3
  - src:c18ce8171a9e#p2.4
  decision: At the beginning of the war, British authorities created a separate agency, SOE, to take responsibility for special
    operations previously assigned to MI-6.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to consolidate covert operations under SIS or continue separate responsibility. The
    source gives reasons including unified authority, reduced duplication and friction, peacetime staffing needs, and the
    greater importance of strategic nonattributability; exclude operational techniques for achieving nonattributability.
  span_range:
  - src:c18ce8171a9e#p7.2
  - src:c18ce8171a9e#p8.2
  decision: At the end of the war, the Foreign Office and Chiefs of Staff returned responsibility for covert operations to
    the Secret Intelligence Service rather than retain a separate service.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
