- n: 1
  focus: The decision point is whether to require the stand-alone exercise or permit the waiver for the demonstration; the
    report says the waiver applied to this practice. Focus on the policy exception and its stated reasons—conserving fuel
    and maintaining flight safety—and exclude the mechanics of the maneuvers or the pilot’s execution of the exercise.
  span_range:
  - src:82a8d7f71b55#p12.1
  - src:82a8d7f71b55#p12.1
  decision: Air Combat Command authorized a waiver allowing Thunderbirds pilots to omit a stand-alone G-Exercise during public
    demonstrations.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is whether to proceed under the existing supervision arrangements or seek additional approval
    or supervision. The report says the squadron’s Operational Risk Management assessment was Green, Thunderbird #1 assessed
    risk as low, and no unusual circumstances were noted; exclude the later maneuver execution and accident cause.'
  span_range:
  - src:82a8d7f71b55#p23.14
  - src:82a8d7f71b55#p24.3
  decision: 'Thunderbird #1 assessed the practice flight as low risk and proceeded without additional supervisory approval.'
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is whether aircraft should remain to assist at the scene or return because of fuel limits, and
    who should continue coordinating at the site. The report identifies low fuel as the reason for releasing aircraft and
    says Thunderbird #1 remained; exclude search procedures and other technical response details.'
  span_range:
  - src:82a8d7f71b55#p17.4
  - src:82a8d7f71b55#p17.4
  decision: 'Thunderbird #1 released the low-fuel aircraft to return to Nellis while remaining at the impact site as on-scene
    commander.'
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision is whether to attribute the fatal mishap to G-induced loss of consciousness and identify the push-pull
    effect and reduced AGSM effectiveness as contributing factors, rather than to other explanations. The report states the
    finding and explains the physiological and flight-data basis for it; exclude the pilot’s operational maneuver choices
    and any instruction on performing them.
  span_range:
  - src:82a8d7f71b55#p33.1
  - src:82a8d7f71b55#p35.4
  decision: The Accident Investigation Board president determines the mishap’s cause and substantially contributing factors
    under the preponderance-of-evidence standard.
