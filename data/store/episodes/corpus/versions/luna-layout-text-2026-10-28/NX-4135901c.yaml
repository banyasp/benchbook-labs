episodes:
- n: 1
  focus: In January 1960, the First Secretary presented reliance on nuclear-missile forces as the force structure best suited
    to deter war and fight if necessary, with substantial manpower reductions and retirement of older forces. The source contrasts
    this with retaining conventional forces, which he judged increasingly obsolete; exclude operational decisions about how
    forces would be used.
  span_range:
  - src:cfa78edcfc3b#p18.4
  - src:cfa78edcfc3b#p18.4
  decision: The Soviet First Secretary chose to base military policy primarily on nuclear-missile forces, reduce manpower,
    and retire older forces.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: A 1964 policy statement placed unprecedented emphasis on long cruises, marking the beginning of more extensive deployments
    beyond home waters. The account frames the Navy as a diplomatic instrument and describes the growth of deployments; exclude
    the operational details of particular missions or force movements.
  span_range:
  - src:cfa78edcfc3b#p22.3
  - src:cfa78edcfc3b#p28.2
  decision: The Soviet Navy Commander-in-Chief chose to emphasize longer cruises and expand distant naval deployments.
  content_domain: other:naval-force-posture
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to keep the growing fleet nearer home waters or deploy it farther afield, especially
    to the Mediterranean. The passage cites the American deployment of ballistic-missile submarines as the reason and notes
    Soviet inexperience, training gaps, and logistical difficulties; exclude details of how forces would operate there.
  span_range:
  - src:cfa78edcfc3b#p33.1
  - src:cfa78edcfc3b#p33.1
  decision: The Soviet Navy commander-in-chief ordered an expanding surface fleet to deploy beyond home waters, prioritizing
    a continual Mediterranean presence.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to continue a confrontational course and arms competition or ease relations with the
    Western alliance. The passage identifies the economic burden as the reason and Glasnost as the associated easing; exclude
    the later consequences of the Soviet breakup.
  span_range:
  - src:cfa78edcfc3b#p33.3
  - src:cfa78edcfc3b#p33.3
  decision: The Soviet president chose a less confrontational approach toward the Western alliance as the naval arms race
    strained the Soviet economy.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to rely on the existing assessment or sponsor a broader interagency review with Navy
    participation. The passage says the review would assess Soviet capabilities more broadly and that the Navy could provide
    information about possible U.S. actions; exclude the substantive operational details of interdiction scenarios.
  span_range:
  - src:cfa78edcfc3b#p46.4
  - src:cfa78edcfc3b#p46.4
  decision: The Director of Central Intelligence planned to sponsor an interagency intelligence memorandum with Navy participation
    to reassess Soviet capabilities.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
