episodes:
- n: 1
  focus: The Senate moved from historically limited oversight to a formal confirmation process, with a 2014 resolution requiring
    review by both committees. Treat the decision as an oversight and confirmation-policy choice; exclude the broader history
    of directors’ service backgrounds.
  span_range:
  - src:908fd0f78cdd#p8.1
  - src:908fd0f78cdd#p9.1
  decision: The Senate decides whether to require formal advice-and-consent confirmation and review by both intelligence and
    armed-services committees for the NSA director.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The nominee commits to following the law and ensuring the agency does likewise, against a backdrop of concern about
    a prior warrantless program. Keep the focus on the legal standard and oversight commitment; exclude any operational account
    of surveillance.
  span_range:
  - src:908fd0f78cdd#p18.2
  - src:908fd0f78cdd#p18.3
  decision: The NSA director nominee decides how to respond to a senator’s hypothetical about being asked to bypass FISA Court
    approval for surveillance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: A senator seeks a categorical commitment to end such queries; the nominee instead promises adherence to Fourth Amendment
    requirements and FISA Court-approved procedures. Treat this as a legal-compliance and oversight decision, not as a description
    of querying methods.
  span_range:
  - src:908fd0f78cdd#p21.2
  - src:908fd0f78cdd#p22.1
  decision: The NSA director nominee decides whether to promise to end warrantless queries of U.S.-person data or commit to
    following applicable constitutional and statutory requirements.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
