- n: 1
  focus: The decision point is whether to disclose the accounts to Congress or withhold them; the President chose to withhold
    them. The stated justification is that emergencies and the need to protect confidential sources could make public disclosure
    harmful. Exclude the underlying intelligence activities funded by the account.
  span_range:
  - src:a98ffb51e6b9#p2.3
  - src:a98ffb51e6b9#p2.4
  decision: The President of the United States refused Congress’s demand for an accounting of secret-fund payments.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is Congress’s choice to create continuing legislative oversight after revelations of intelligence
    abuses, rather than leaving investigation and accountability to the presidentially chartered commission. The text cites
    the need for effective Congressional supervision and the limits of relying solely on that commission. Exclude details
    of the abuses themselves.
  span_range:
  - src:a98ffb51e6b9#p4.2
  - src:a98ffb51e6b9#p4.5
  decision: Congress established permanent intelligence oversight committees rather than relying solely on executive-branch
    investigation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
