episodes:
- n: 1
  focus: The decision was to split off the photographic subsystem rather than keep it within WS-117L, using a management approach
    considered successful for the U-2. Focus on the choice of program structure and management authority; exclude technical
    collection methods.
  span_range:
  - src:a503e74e34c1#p20.1
  - src:a503e74e34c1#p20.2
  decision: CIA-Air Force program managers decide to separate CORONA’s photographic subsystem from WS-117L and place it under
    joint covert management.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision followed reviews finding that release posed no national-security threat, while the imagery offered value
    for environmental study, science, scholarship, and history. Focus on the declassification judgment and its balance of
    security against public and scientific benefit; exclude imagery contents or collection details.
  span_range:
  - src:a503e74e34c1#p14.3
  - src:a503e74e34c1#p14.4
  decision: The President decides to declassify more than 800,000 early satellite images rather than keep them classified.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue the costly, failure-plagued program given the intelligence need to resolve
    uncertainty about Soviet forces and missile deployments. Exclude technical choices about launch, photography, or capsule
    recovery, and do not treat the animal-flight protest as the stated rationale for this decision.
  span_range:
  - src:a503e74e34c1#p35.2
  - src:a503e74e34c1#p35.3
  decision: CORONA program officers chose to persist with the satellite program despite repeated failures, rather than abandon
    it.
  content_domain: other:intelligence-program-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to retain the separate existing committees or create a coordinating committee for overhead
    reconnaissance after the U-2 loss and the advent of satellite photography. Consider the stated coordination purpose and
    changed reconnaissance context; exclude COMOR's general responsibilities and operational collection methods.
  span_range:
  - src:a503e74e34c1#p56.3
  - src:a503e74e34c1#p56.5
  decision: The Director of Central Intelligence established COMOR to coordinate overhead-reconnaissance requirements, superseding
    the existing ARC and SIRC arrangements.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to protect satellite-reconnaissance products and the fact of reconnaissance through
    strict access controls or a less restrictive approach. Focus on presidential authority, need-to-know selection, and accountability
    for access; exclude technical handling procedures.
  span_range:
  - src:a503e74e34c1#p88.6
  - src:a503e74e34c1#p88.8
  decision: The President approved the TALENT-KEYHOLE Control System and restricted access to personnel selected for major
    national-security needs.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to transmit sensitive mission reporting to the theater or withhold it pending suitable
    security arrangements. Focus on the sensitivity-versus-operational-need and secure-dissemination judgment; exclude transmission
    procedures or channels.
  span_range:
  - src:a503e74e34c1#p73.6
  - src:a503e74e34c1#p73.6
  decision: The COMOR agreed that OAK reports would not be transmitted to the theater until secure arrangements were established.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to approve broader staffing for exploitation and use of satellite materials while limiting
    access to personnel with functional requirements. The memorandum cites the intelligence uses of the imagery and reports
    that review reduced the requested billets; treat approval as a recommendation, not a confirmed Board outcome.
  span_range:
  - src:a503e74e34c1#p97.3
  - src:a503e74e34c1#p100.3
  decision: The COMOR recommended that the US Intelligence Board approve revised, expanded TALENT-KEYHOLE billets after renewed
    scrutiny of access needs.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: 'The decision point is the estimative judgment about current and near-term Soviet ICBM strength: the estimate places
    current strength in a low range, while the USAF representative argues for substantially higher numbers. Focus on how new
    test, photographic, and other reporting supports the estimate and on the documented dissent; exclude operational targeting
    implications.'
  span_range:
  - src:a503e74e34c1#p138.5
  - src:a503e74e34c1#p142.3
  decision: The US Intelligence Board adopted a lower estimate of current Soviet ICBM strength than the USAF intelligence
    representative advocated.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: This is an estimative judgment based on the assessment that only a few complexes are operational or under construction,
    balanced against limitations in intelligence coverage. Reconstruct the uncertainty and the competing low- and high-side
    possibilities; exclude the technical details of missile operations and photographic collection.
  span_range:
  - src:a503e74e34c1#p150.3
  - src:a503e74e34c1#p150.6
  decision: US intelligence estimators judge the USSR’s current operational ICBM capability to be limited, while retaining
    a range that allows for both a token force and some undetected operational complexes.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The report infers a policy choice between broader deployment of the first-generation system and limiting that force
    while pressing ahead with a successor. The stated rationale is that the first-generation system, though powerful and reliable,
    was too cumbersome for large-scale deployment; treat the Soviet deliberation as an intelligence inference, not a directly
    documented meeting or decision record.
  span_range:
  - src:a503e74e34c1#p150.4
  - src:a503e74e34c1#p151.3
  decision: Soviet leaders, as inferred by US intelligence, decide to deploy only a small force of first-generation ICBMs
    while prioritizing development of second-generation systems.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
