- n: 2
  focus: The decision point is whether to issue the report as written or alter it, despite anticipated congressional criticism.
    The passage says the ombudsperson presented documentation and that the DNI ensured the report went out unchanged; exclude
    the report’s underlying investigative techniques.
  span_range:
  - src:8940749cc19f#p5.4
  - src:8940749cc19f#p5.5
  decision: The DNI decided to release the politicization report without changes.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The analysts first sought help from their managers and, after receiving no satisfaction, approached agency ombudspersons,
    who brought the matter to the IC ombudsperson. Focus on the choice to raise concerns despite career risk, not on the substantive
    intelligence assessments at issue.
  span_range:
  - src:8940749cc19f#p4.3
  - src:8940749cc19f#p4.4
  decision: The analysts decided to escalate concerns about politicization to agency and IC ombudspersons after their managers
    did not address them.
