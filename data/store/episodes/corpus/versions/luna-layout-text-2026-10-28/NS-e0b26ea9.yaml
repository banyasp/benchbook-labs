  focus: At the 11 December assessment, the majority judged the battalion was intended to improve security and support a possible
    evacuation, rather than signal escalation into the Afghan conflict. A minority argued its anti-aircraft artillery suggested
    a possible operation risking a response from Afghan forces. Keep the focus on the competing intelligence judgments and
    their stated reasoning, not on how forces might conduct operations.
  span_range:
