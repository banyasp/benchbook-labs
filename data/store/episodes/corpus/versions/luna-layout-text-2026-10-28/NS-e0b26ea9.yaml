- n: 5
  focus: 'The 17 December meeting produced a package of policy choices: explore additional assistance to the rebels with Pakistan
    and the United Kingdom, increase worldwide messaging, and avoid going public with diplomatic demarches at that time. The
    stated reasons included making Soviet efforts more costly and the view that publicizing the demarches would bring no benefit
    then. Focus on the policy and interests weighed; exclude operational details of any assistance.'
  span_range:
  - src:a3e72c5e2432#p27.5
  - src:a3e72c5e2432#p28.3
  decision: Senior US national security officials chose a response to the Soviet military buildup, including exploring support
    for Afghan rebels, increasing public messaging, and keeping diplomatic demarches private for the time being.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: After evidence of border preparations made an additional Soviet move seem imminent, analysts agreed on that likelihood
    but continued to disagree about its scale and significance. The alert therefore presented both likely augmentation and
    the possibility of more substantial reinforcement, while distinguishing these from the larger forces needed for countrywide
    operations. Keep this as an estimative judgment and warning decision, not an account of how forces would operate.
  span_range:
  - src:a3e72c5e2432#p29.1
  - src:a3e72c5e2432#p29.2
  decision: 'US intelligence analysts chose the wording of the 19 December warning: further Soviet augmentation was likely
    soon, while preparations for a larger reinforcement might also be underway.'
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to commit Soviet combat forces immediately or hold off while the situation, including
    the Afghan Army’s reliability, became clearer. The stated concerns included the prospect of fighting the Afghan population
    and the political costs of intervention; exclude the operational details of force readiness and movement.
  span_range:
  - src:a3e72c5e2432#p32.4
  - src:a3e72c5e2432#p34.4
  decision: The Soviet Politburo decided to defer direct military intervention in Afghanistan while authorizing contingency
    preparations and other assistance.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
