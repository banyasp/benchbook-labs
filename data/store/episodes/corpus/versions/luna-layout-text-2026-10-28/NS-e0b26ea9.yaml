  natsec: true
- n: 8
  focus: The decision point is whether Soviet forces should directly intervene in Afghanistan’s internal political struggle
    by arresting Amin, or refrain and leave the contest to Afghan actors. The stated reason was that such an act would directly
    interfere in Afghanistan’s internal affairs and have far-reaching consequences; exclude the surrounding operational context
    and any methods of carrying out an arrest.
  span_range:
  - src:a3e72c5e2432#p35.4
  - src:a3e72c5e2432#p35.6
