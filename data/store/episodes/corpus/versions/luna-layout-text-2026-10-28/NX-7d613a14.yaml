episodes:
- n: 1
  focus: The decision point is the analysts’ allocation of joint costs between military and non-military activities, resulting
    in an estimate of 12.5 billion francs, or about two-thirds of total spending, associated with the military program. Rebuild
    the judgment from the stated documentary evidence and assumptions about different activities; exclude decisions about
    collecting intelligence or technical details of nuclear facilities.
  span_range:
  - src:e715467e2434#p8.2
  - src:e715467e2434#p8.4
  decision: French nuclear-program analysts decided how much of the program’s joint costs to attribute to military purposes,
    estimating that an additional 6 billion francs was properly chargeable to the military side.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is the forecast and its assumptions: analysts projected rising military expenditures based on
    appropriations, the historical military share of joint costs, planned facilities, and operating expenses, while recognizing
    uncertainty. Exclude technical descriptions of weapons or facilities; focus on the estimate, its basis, and its uncertainty.'
  span_range:
  - src:e715467e2434#p10.5
  - src:e715467e2434#p11.3
  decision: Intelligence analysts decided to estimate French military nuclear-program expenditures for 1965–70 at about 27.9
    billion francs, rounded to a central estimate of $6 billion with a stated uncertainty range.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is the choice of an alternative estimating method to assess the program’s burden on the Soviet
    economy: use relevant Soviet cost and activity data, supplemented where necessary by U.S.-based analogies. The passage
    later describes the resulting estimate; exclude intelligence collection methods and focus on the analytic approach and
    its justification.'
  span_range:
  - src:e715467e2434#p12.4
  - src:e715467e2434#p13.4
  decision: Soviet-program analysts decided to use a mixed documentary-and-analogy method after efforts to identify nuclear
    allocations in Soviet budgets proved largely unsuccessful.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
