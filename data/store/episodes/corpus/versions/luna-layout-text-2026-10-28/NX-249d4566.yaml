    battalions first.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The group compared Snatch and Tavern for the urgent requirement and considered other vehicle and procurement options.
    Its reasons included Tavern’s reliability and support issues, the time available, and concerns that Snatch might not provide
    the protection required; exclude technical details of vehicle protection or threat response.
  span_range:
  - src:953cd3e412d7#p34.7
  - src:953cd3e412d7#p35.7
  decision: The Protected Patrol Vehicle Working Group recommended using Snatch for the immediate Iraq requirement and considering
    a new vehicle purchase for the medium term.
  content_domain: other:military-equipment
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The Board’s spending-round decision balanced an earlier operational requirement for protected mobility against the
    longer-term programme and constrained resources. The proposed change accelerated one battlegroup’s worth of vehicles and
    cut the remaining capability; exclude vehicle design and deployment techniques.
  span_range:
  - src:953cd3e412d7#p40.8
  - src:953cd3e412d7#p41.5
  decision: The Defence Management Board agreed to reprofile Project DUCKBOARD funding, bringing forward 80 vehicles while
    reducing the remaining planned protected-vehicle capability.
  content_domain: other:military-equipment
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The Board faced competing ways to make near-cash reductions and accepted a FRES deferral that was expected to delay
    the programme by a few months. Keep the focus on the budget and procurement trade-off; exclude later FRES decisions and
    operational equipment use.
  span_range:
  - src:953cd3e412d7#p47.4
  - src:953cd3e412d7#p47.6
  decision: The Defence Management Board accepted a proposal to defer £13m from the FRES programme during the 2003/04 resource
    shortfall.
  content_domain: other:defence procurement and budgeting
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The team considered doing nothing, buying a commercial off-the-shelf vehicle, or developing a bespoke design. The
    source gives reasons for ruling out the first and third options and for preferring a modified commercial option; exclude
    technical details of vehicle employment.
  span_range:
  - src:953cd3e412d7#p51.5
  - src:953cd3e412d7#p51.9
  decision: The Specialist Utility Vehicle Integrated Project Team recommended a modified commercial off-the-shelf procurement
    for the Type B expeditionary protected patrol vehicle.
  content_domain: other:defence procurement and budgeting
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The planners compared three fleet mixes under constrained funding. The source identifies Option 2 as preferred and
    links the requirement to the need for a more capable vehicle for Afghanistan and continuing protected-mobility needs;
    exclude the operational use of the vehicles and treat the option as preferred rather than a final procurement approval.
  span_range:
  - src:953cd3e412d7#p63.7
  - src:953cd3e412d7#p64.8
  decision: 'MOD protected-patrol-vehicle planners identified Option 2 as the preferred fleet plan: convert 312 Snatch vehicles
    and procure about 100 Vector vehicles.'
  content_domain: other:defence procurement and budgeting
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The Board chose to proceed with the conversion despite the outstanding work to determine how many vehicles needed
    higher protection and to balance Snatch against Vector. The business case described evolving the Snatch model as the most
    cost-effective approach; exclude the technical design of vehicle protection.
  span_range:
  - src:953cd3e412d7#p68.3
  - src:953cd3e412d7#p68.6
  decision: The Investment Approvals Board approved converting the remaining Snatch 1/1.5 vehicles to Snatch 2 standard.
  content_domain: other:defence-procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision was to fund and provide additional Warrior armour in response to the changing threat and the possibility
    that Warriors would also be attacked. The source says Warrior was the only vehicle that could be better protected against
    the stated threat; exclude technical details of armour or countermeasures.
  span_range:
  - src:953cd3e412d7#p69.9
  - src:953cd3e412d7#p70.2
  decision: The Ministry of Defence approved an urgent requirement for additional armour for Warrior vehicles in Iraq.
  content_domain: other:defence-procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The decision concerned whether to deploy an available countermeasure capability against a serious and evolving threat,
    with an estimated initial cost and the prospect of further adversary adaptation. Keep the focus on the deployment and
    funding choice; exclude the capability's technical operation.
  span_range:
  - src:953cd3e412d7#p72.9
  - src:953cd3e412d7#p73.2
  decision: The Defence Secretary agreed that the UK should deploy the proposed PIR countermeasure capability once it became
    available, subject to funding.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 11
  focus: The choice was whether to continue restricting civilian movements or permit specified journeys using protected transport
    arrangements. The stated rationale was to enable HMG objectives while managing the significant security risk; exclude
    operational details of routes, escorts, or movement procedures beyond identifying the policy choice.
  span_range:
  - src:953cd3e412d7#p78.2
  - src:953cd3e412d7#p78.4
  decision: The Foreign Secretary approved a measured resumption of civilian road movements in southern Iraq, subject to regular
    review.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 12
  focus: The committee weighed the delayed FRES programme and the interim armoured-vehicle gap against the proposed alternatives,
    including buying Stryker and improving existing fleets. It rejected further consideration of Stryker, endorsed the aim
    of accelerating FRES and upgrading or replacing parts of the existing fleet, and treated protected-patrol-vehicle work
    separately; exclude vehicle engineering details.
  span_range:
  - src:953cd3e412d7#p83.4
  - src:953cd3e412d7#p85.2
  decision: The Executive Committee of the Army Board endorsed the FRES fleet review approach, including not pursuing Stryker
    further and treating interim vehicle upgrades as necessary.
  content_domain: other:defence-procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The business case weighed an increased-capacity Snatch, which could not meet the payload requirement, against buying
    a commercial off-the-shelf vehicle quickly; financial limits constrained the purchase below the stated global requirement.
    The case identifies Vector as a priority and approval followed. Exclude later decisions about medium-weight vehicles and
    operational use.
  span_range:
  - src:953cd3e412d7#p89.6
  - src:953cd3e412d7#p90.10
  decision: The MOD approves procurement of 62 Vector protected patrol vehicles for Afghanistan.
  content_domain: other:defence procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The decision was whether to add a medium-weight vehicle to planned light-vehicle and tracked-vehicle enhancements.
    The stated reasons were the increasingly potent threat, the need to reduce unnecessary casualties, and the operational
    flexibility of a balanced force. Exclude subsequent vehicle-selection and operational employment details.
  span_range:
  - src:953cd3e412d7#p98.5
  - src:953cd3e412d7#p98.9
  decision: The Chief of Joint Operations and Front Line Commands confirm a requirement for a medium-weight protected patrol
    vehicle for current operations.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 15
  focus: The business case compared doing the minimum, RG31, Cougar and Bushmaster, recommending Cougar for its demonstrated
    mine protection, payload and ability to meet the timeline; it also recognized limits in urban agility and residual threats.
    The Defence Secretary sought funding, and the Treasury agreed that commercial arrangements could proceed while reserving
    formal funding uplift pending final costs. Exclude vehicle-use tactics.
  span_range:
  - src:953cd3e412d7#p104.7
  - src:953cd3e412d7#p106.4
  decision: The MOD advances the Cougar 6x6 as its preferred medium-weight patrol vehicle and the Defence Secretary seeks
    additional funding for its procurement.
  content_domain: other:defence procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The decision addressed the gap between heavy armour and lighter patrol vehicles, with no small but better-protected
    vehicle immediately available. The stated rationale was to provide commanders a range of options with different levels
    of protection, mobility and profile; exclude technical vehicle specifications and operational use of the vehicles.
  span_range:
  - src:953cd3e412d7#p108.2
  - src:953cd3e412d7#p109.5
  decision: 'The Defence Secretary chose a combined short-term vehicle procurement package for Iraq and Afghanistan: additional
    Vector vehicles, up-armoured FV430s, and 100 Cougar vehicles.'
  content_domain: other:defence procurement policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The commander was presented with a choice after being advised that no suitable Snatch-dimension replacement was available
    quickly; the recommended workaround was to modernise the FV430. The account gives the reason for accepting that option
    and its perceived contribution in Iraq; exclude technical details of the modification or its battlefield employment.
  span_range:
  - src:953cd3e412d7#p117.5
  - src:953cd3e412d7#p117.7
  decision: The Army commander accepted the recommendation to up-armour and re-engine the FV430 series as the quickest available
    well-protected vehicle option for Iraq.
  content_domain: other:defence procurement policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The policy response followed sustained UOR spending and concerns that the scheme was supplementing the core Equipment
    Programme rather than addressing only urgent operational needs. The documented changes included Treasury clearance of
    every UOR and a shared funding arrangement; exclude the details of individual equipment requirements.
  span_range:
  - src:953cd3e412d7#p119.7
  - src:953cd3e412d7#p120.7
  decision: The Treasury and Ministry of Defence agreed tighter control and a revised funding arrangement for urgent operational
    requirements.
  content_domain: other:defence procurement policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 19
  focus: The decision weighed the protection and mobility needed for the teams against increased risk to personnel on the
    tasks losing Mastiff, reduced capacity in Afghanistan’s regeneration pool, and possible effects on Iraqi and local consent.
    Include the approval and its stated limits; exclude operational methods for carrying out the teams’ activities.
  span_range:
  - src:953cd3e412d7#p135.9
  - src:953cd3e412d7#p137.4
  decision: The Chiefs of Staff and Defence Secretary approved reallocating Mastiff vehicles to military training teams in
    Iraq, backfilling some other tasks with Vector and using Bulldog for the shortfall.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 20
  focus: The decision weighs the operational need for a light vehicle with Snatch’s size, weight and profile against its vulnerabilities
    and public and political concern. Include the commanders’ review and the decision to continue its role while pursuing
    modifications and replacement; exclude technical details of vehicle protection or operational use.
  span_range:
  - src:953cd3e412d7#p139.6
  - src:953cd3e412d7#p140.2
  decision: The Defence Secretary accepted commanders’ advice to retain Snatch as a mission-critical vehicle rather than withdraw
    it from operations.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 21
  focus: The decision weighs holding an inquiry against relying on existing examination and military advice that Snatch remained
    essential, alongside the operational limits and local effects of heavier vehicles. Include the decision and its stated
    reasons; exclude the separate question of vehicle procurement or deployment.
  span_range:
  - src:953cd3e412d7#p146.2
  - src:953cd3e412d7#p146.7
  decision: The Defence Secretary decided not to establish a public inquiry into the use of Snatch Land Rovers.
  content_domain: other:public-inquiry decision
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: The decision point is the Board’s choice to defer the programme in the context of required Equipment Programme savings,
    while accepting additional short-term costs to support older equipment. Keep the focus on the procurement timing and resource
    trade-off; exclude technical details of ISTAR collection.
  span_range:
  - src:953cd3e412d7#p157.4
  - src:953cd3e412d7#p157.4
  decision: The Defence Management Board approved deferring Watchkeeper by one year, with a limited interim capability planned
    to support deployments from 2006.
  content_domain: other:defence procurement and resource allocation
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 23
  focus: The Board weighed activity and funding reductions against the operational benefits of maintaining key helicopter
    capability, judging the added costs of restoring Chinook and Puma funding acceptable and requiring savings elsewhere instead
    of cutting Gazelle activity. Keep the focus on resource allocation and readiness; exclude helicopter operating tactics.
  span_range:
  - src:953cd3e412d7#p166.6
  - src:953cd3e412d7#p166.7
  decision: The Defence Management Board accepted reducing Joint Helicopter Command activity while restoring Chinook and Puma
    funding, and rejected a proposed reduction in Gazelle activity.
  content_domain: other:defence resource allocation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 24
  focus: The decision point is the allocation of Chinook between Iraq and preparations for Afghanistan, with Merlin used as
    the replacement in Iraq. The reasons given include Chinook’s suitability for Afghanistan’s demanding conditions and the
    opportunity to recuperate the force; exclude operational flying or transport procedures.
  span_range:
  - src:953cd3e412d7#p166.8
  - src:953cd3e412d7#p167.2
  decision: The Ministry of Defence withdrew Chinook helicopters from Iraq in 2005, replaced them with Merlin helicopters,
    and prepared Chinook for Afghanistan.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 25
  focus: The decision point is whether to divert limited helicopter capacity to meet the heightened security and staff-protection
    needs in Iraq, despite fleet-sustainability constraints. The source states the additional aircraft and hours were agreed,
    identifies the security need, and records the opportunity cost; exclude operational flying or tasking techniques.
  span_range:
  - src:953cd3e412d7#p169.4
  - src:953cd3e412d7#p169.8
  decision: The Assistant Chief of the Defence Staff (Operations) agreed to provide additional Merlin helicopters and increase
    monthly flying hours for Iraq, using capacity otherwise allocated to capability demonstrations in the US.
  content_domain: other:defence resource allocation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 26
  focus: The decision point is whether to reduce the deployed Sea King complement as part of the force-level review or retain
    it. The stated reason was that revised tasking lines and servicing routines could sustain flying hours; exclude the operational
    methods used to perform helicopter tasks.
  span_range:
  - src:953cd3e412d7#p173.7
  - src:953cd3e412d7#p174.2
  decision: The Chiefs of Staff endorsed reducing the helicopter force in Iraq by two Sea King aircraft while sustaining flying
    hours through more efficient use of other assets.
  content_domain: other:defence resource allocation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 27
  focus: The decision point is whether to accept greater risk to other operations and pursue allied support to relieve immediate
    pressure, rather than rely on existing allocations or wait for a longer-term solution. The minutes connect the choice
    to urgent demands in two theatres and constraints on hours, spares, crews, and sustainability; exclude technical employment
    of aircraft and the separate details of ISTAR collection.
  span_range:
  - src:953cd3e412d7#p184.3
  - src:953cd3e412d7#p184.7
  decision: The Chiefs of Staff agreed to release helicopter assets from other tasks and seek continued allied helicopter
    support to address urgent shortfalls in Iraq and Afghanistan.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 28
  focus: The decision weighed the additional protection CITADEL might provide against the assessed threat, cost, construction
    time, effects on troop living conditions, campaign drawdown and the message fortifying camps could send. Focus on that
    policy choice and its rationale; exclude implementation details of force-protection techniques.
  span_range:
  - src:953cd3e412d7#p193.9
  - src:953cd3e412d7#p195.9
  decision: The Chiefs of Staff recommended, and the Secretary of State for Defence endorsed, not introducing CITADEL hardened
    accommodation in Iraq and relying instead on compartmentalisation and active force-protection measures.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 29
  focus: The decision was whether to press ahead with the proposed acquisition or pause it pending further clarification.
    The ministers had noted that the assumed Afghanistan lift shortfall was not clearly reflected in tasking, while crew-harmony
    limits made action relevant; exclude subsequent aircraft employment details.
  span_range:
  - src:953cd3e412d7#p191.3
  - src:953cd3e412d7#p191.8
  decision: The Secretary of State for Defence directed that discussions on acquiring Danish Merlin helicopters should slow
    down until the requirement and funding were clearer.
  content_domain: other:defence procurement policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 30
  focus: The decision was whether to use the proposed exceptional contracting route rather than a tender process. The stated
    rationale was to accelerate delivery using a trusted prime contractor and proven specialist subcontractors, while retaining
    design and trials time because the protective structures were novel; exclude construction or protective-design instructions.
  span_range:
  - src:953cd3e412d7#p206.3
  - src:953cd3e412d7#p206.6
  decision: The Minister for Defence Equipment and Support approved using a single-contractor, non-competitive contracting
    mechanism for hardened accommodation at Basra air station.
  content_domain: other:defence procurement policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 31
  focus: The decision was whether to start the work before the UK posture was settled or wait, risking delay if troops remained.
    The Chief Secretary to the Treasury considered the case compelling for a prolonged presence and deemed the at-risk spending
    prudent, noting that sunk costs could be claimed against the Reserve if withdrawal came early. Exclude later tranches
    and operational details of the accommodation.
  span_range:
  - src:953cd3e412d7#p212.11
  - src:953cd3e412d7#p213.4
  decision: The Defence Secretary chose to proceed with initial hardened accommodation work at risk while awaiting clarity
    on the UK’s future presence in Basra.
  content_domain: other:defence-resource-allocation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 32
  focus: The decision was whether to continue building additional hardened accommodation immediately or defer it until the
    future force requirement was better established. The advice acknowledged increased indirect-fire risk and the consequence
    of not providing Tier 3 accommodation quickly for everyone, but emphasized uncertainty about force levels and the possibility
    that the tranche would not be needed. Exclude technical details of force protection.
  span_range:
  - src:953cd3e412d7#p215.5
  - src:953cd3e412d7#p215.9
  decision: The Defence Secretary agreed to put Tranche 3 of the hardened accommodation programme on hold until the UK’s likely
    presence in Iraq in 2009 was clearer.
  content_domain: other:defence-resource-allocation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 33
  focus: The decision point was whether to pursue the proposed disposition of the structures to the United States, in the
    context of stopping or completing work on Tranche 2 and the planned transfer of responsibility. The United States preferred
    the structures to be left empty for its purposes; the UK would need an agreement with the Iraqi Government, and officials
    had identified savings from stopping the work versus completing it as part of a wider arrangement. The Defence Secretary
    approved the proposal to seek Treasury approval, not a final transfer agreement.
  span_range:
  - src:953cd3e412d7#p216.9
  - src:953cd3e412d7#p217.10
  decision: The Defence Secretary approved pursuing Treasury approval to treat the hardened accommodation structures as a
    gift to the United States rather than transfer them to Iraq.
  content_domain: other:defence-resource-allocation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 34
  focus: The MOD had few rapidly available options for providing armoured vehicles, while UK forces faced a need to replace
    completely unprotected vehicles. The Inquiry describes the Snatch as the best available stop-gap and says the deployment
    was justified, while making clear it should have been treated as interim; exclude vehicle design or modification details.
  span_range:
  - src:953cd3e412d7#p234.2
  - src:953cd3e412d7#p234.4
  decision: The MOD decided to dispatch 180 Snatch Land Rovers to Iraq in September 2003.
  content_domain: other:military-equipment-procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 35
  focus: The choice addressed how DFID could contribute to ORHA’s planning while the Secretary was reluctant to place DFID
    officials in ORHA without a UN mandate for reconstruction. The agreed limited arrangement was intended to influence and
    help planning; exclude the separate question of the legality of ORHA’s activities beyond what is needed to understand
    this decision.
  span_range:
  - src:953cd3e412d7#p252.3
  - src:953cd3e412d7#p252.4
  decision: The International Development Secretary agreed to second one DFID official temporarily to work with, but not within,
    ORHA.
  content_domain: other:civilian-deployment-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 36
  focus: The decision point is how to prioritize scarce helicopter support between the concurrent Iraq and Afghanistan operations.
    The report links the Afghanistan priority to the assessment that support to Iraq was generally satisfactory; exclude technical
    or tactical decisions about helicopter use.
  span_range:
  - src:953cd3e412d7#p243.7
  - src:953cd3e412d7#p244.5
  decision: The Defence Secretary treated Afghanistan as the priority for helicopter support in December 2007.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 37
  focus: The decision was whether to expand UK engagement with ORHA and commit personnel; the stated principle was that the
    UK’s humanitarian and reconstruction role should be commensurate with its military contribution. Exclude later operational
    details about recruiting or assigning individual secondees.
  span_range:
  - src:953cd3e412d7#p262.5
  - src:953cd3e412d7#p262.7
  decision: The Prime Minister decided that the UK should significantly increase its political and practical support to ORHA,
    including seconding substantial numbers of staff in priority areas.
  content_domain: other:civilian deployment policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 38
  focus: The decision weighed DFID’s concern that ORHA’s security assurances were inadequate, including implications for contractors’
    insurance, against the judgment from officials and personnel on the ground that existing arrangements provided adequate
    security. Focus on whether to deploy while seeking more detailed plans; exclude protective equipment and other security
    implementation details.
  span_range:
  - src:953cd3e412d7#p265.8
  - src:953cd3e412d7#p266.10
  decision: The FCO Permanent Under Secretary decided to proceed with deploying additional UK secondees to ORHA despite unresolved
    security-plan concerns.
  content_domain: other:civilian deployment policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 39
  focus: The decision was whether MOD civilian deaths should be handled under the same policy as service personnel or receive
    lesser treatment; the proposal also distinguished accredited journalists, for whom repatriation without ceremony was proposed.
    The stated considerations included the civilians’ direct support to the military and the risk of causing offence or embarrassment
    to families; exclude logistical details of repatriation.
  span_range:
  - src:953cd3e412d7#p258.7
  - src:953cd3e412d7#p258.10
  decision: The MOD Permanent Under Secretary approved repatriation arrangements giving MOD civilian personnel killed in Iraq
    the same overarching treatment as service personnel.
  content_domain: other:casualty policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 40
  focus: The decision was whether to move staff from the existing Basra location or remain there; the security review described
    security at the compound as inadequate, while the condition preserved an assessment of the move’s effect on CPA work.
    Focus on the policy choice balancing staff safety and mission effectiveness, not on security procedures or protective
    techniques.
  span_range:
  - src:953cd3e412d7#p277.2
  - src:953cd3e412d7#p277.5
  decision: COBR agreed that staff in Basra should move to more secure locations at Basra Airport, subject to the CPA(South)
    head’s assessment of the effect on operational effectiveness.
  content_domain: other:civilian personnel security
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 41
  focus: The decision was whether to approve the requested £2 million for secure accommodation while staff remained in unsatisfactory
    temporary quarters. The stated reasons were the security shortcomings of existing accommodation and the need not to prolong
    those conditions; exclude construction or protective-design details.
  span_range:
  - src:953cd3e412d7#p289.3
  - src:953cd3e412d7#p289.5
  decision: The Treasury approved funding for secure accommodation for UK civilian staff in Baghdad.
  content_domain: other:public spending and civilian security
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 42
  focus: The decision was whether and on what conditions Treasury secondees should return after withdrawing following security
    incidents and concerns about accommodation. The record weighs the importance of their contribution to economic stability
    against security risks, and emphasizes suitable conditions, informed volunteers, and training; exclude travel or security
