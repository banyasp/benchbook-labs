- n: 1
  focus: 'This is a prioritization choice under uncertainty about the Phase IV concept of operations and available funding:
    advance some requirements while holding others until the way ahead is clearer. Focus on the rationale and criteria for
    that prioritization; exclude the technical details of individual equipment requirements.'
  span_range:
  - src:953cd3e412d7#p16.9
  - src:953cd3e412d7#p17.11
  decision: The MOD’s equipment-capability leadership holds 32 potential Phase IV UORs pending greater clarity about the operational
    concept, while identifying 33 as likely to be needed in any aftermath scenario.
  content_domain: other:defence procurement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision addressed how to meet the need for protected mobility in Iraq, while Northern Ireland also relied on
    those vehicles for its operations. The record says the effect on Northern Ireland operations would be limited but manageable;
    exclude the vehicle specifications and any operational techniques.
  span_range:
  - src:953cd3e412d7#p33.6
  - src:953cd3e412d7#p34.5
