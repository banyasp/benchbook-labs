  focus: The decision point is the shift from service-level control toward centralized NSA authority, culminating in NSCID
    No. 6 and its DoD implementation. The stated rationale is that ELINT needed coordination and a cohesive signal-analysis
    and processing effort; exclude the later operational collection and use of ELINT.
