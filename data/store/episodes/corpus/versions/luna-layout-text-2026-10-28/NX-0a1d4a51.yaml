  focus: The decision was whether to retain separate watch centers or consolidate them to provide faster crisis-information
    responses. The account cites the time and effort required to gather information during crises as the rationale, and mentions
    affordability and authority as obstacles. Exclude the EC-121 operational details; the decision at issue is organizational,
    not how to conduct reconnaissance or respond militarily.
  span_range:
  - src:eca87c273a55#p1.4
  - src:eca87c273a55#p1.8
  decision: The NSA deputy director for operations, with the NSA director, chose to consolidate the watch centers into a single
    office, the National Security Operations Center.
