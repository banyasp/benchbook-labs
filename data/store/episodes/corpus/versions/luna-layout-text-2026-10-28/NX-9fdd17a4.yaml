episodes:
- n: 1
  focus: The decision point is whether national-security concerns justified an otherwise illegal intrusion into private correspondence,
    and which senior postal authority had to consent. Include the stated legal constraint and safeguards on authorization;
    exclude the mechanics of the interception.
  span_range:
  - src:b7748ac8138b#p2.4
  - src:b7748ac8138b#p3.1
  decision: Czech counterintelligence leadership and the postal director decided to authorize an interception of the attaché’s
    mail despite the legal guarantee of correspondence secrecy.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision weighs immediate arrests against preserving the correspondence source and learning more about the network;
    the source says arrests required solid evidence unrelated to the Budapest correspondence. Include that rationale and standard,
    but exclude the surveillance methods used to pursue independent evidence.
  span_range:
  - src:b7748ac8138b#p5.4
  - src:b7748ac8138b#p5.5
  decision: Czech counterintelligence leadership decided to defer arrests of people identified in the intercepted letters
    until it could develop independent grounds for arrest.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision pits protecting a sensitive mobilization assignment against preserving the source and opportunity to
    identify other agents. Include the General’s stated urgency and the intelligence officer’s counterargument; exclude the
    subsequent search procedures.
  span_range:
  - src:b7748ac8138b#p6.1
  - src:b7748ac8138b#p7.2
  decision: The Chief of the General Staff ordered the immediate arrest of an officer identified in the intercepted correspondence,
    rejecting counterintelligence’s request to wait or transfer him.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
