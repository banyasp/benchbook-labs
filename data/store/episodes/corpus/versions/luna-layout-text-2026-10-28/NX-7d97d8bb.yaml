  focus: The agreement preserves each party’s freedom to transmit telemetry using various methods, including encryption, but
    bars deliberate denial when it impedes verification of treaty compliance. Treat this as a treaty-policy choice balancing
    transmission freedom against verification; exclude the technical means of collecting or analyzing telemetry. The document
    describes the agreed rule and its verification rationale, not the negotiations behind it.
