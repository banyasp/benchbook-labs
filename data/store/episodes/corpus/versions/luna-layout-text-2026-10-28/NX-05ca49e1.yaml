episodes:
- n: 1
  focus: The decision point is whether to grant immunity to obtain public testimony or preserve the possibility of prosecuting
    the officials without that testimony. The report gives the goals of addressing a crisis of political confidence and exposing
    flaws in the national security apparatus, while noting the risk to later prosecutions. Exclude the subsequent prosecutorial
    safeguards, which are procedural implementation rather than the policy choice.
  span_range:
  - src:49ce34ffe1d8#p1.1
  - src:49ce34ffe1d8#p1.2
  decision: Congress chose to compel public, use-immunized testimony from senior executive-branch officials in the Iran/contra
    investigation.
  content_domain: other:congressional oversight and criminal procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to uphold the trial court’s protections against use of immunized testimony or reverse
    and require a more demanding inquiry. The report describes the appellate court’s concern about refreshed or influenced
    witness testimony and its view that the trial instructions were inadequate. Exclude the separate dissent’s preferred assessment
    except as context for the competing judicial judgment.
  span_range:
  - src:49ce34ffe1d8#p1.4
  - src:49ce34ffe1d8#p1.6
  decision: The court of appeals chose to set aside the first defendant’s conviction and require a detailed witness-by-witness
    inquiry into possible taint.
  content_domain: other:criminal procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to remand for the trial court to reassess witness taint or set aside the convictions
    based on the existing record. The court’s reasons included its treatment of the key witness’s claimed recollection and
    its rule for substantially exposed witnesses who had not preserved their testimony beforehand. Exclude the dissent’s criticism
    except as context for the disputed choice.
  span_range:
  - src:49ce34ffe1d8#p1.8
  - src:49ce34ffe1d8#p1.9
  decision: The court of appeals chose to set aside the second defendant’s convictions without remanding for new findings
    under the first case’s standard.
  content_domain: other:criminal procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: After the appellate court required a detailed inquiry into witness testimony and possible taint, the independent
    counsel concluded that meeting those requirements would be very difficult and enormously burdensome, and dismissed the
    prosecution. The decision point is whether to continue attempting to meet the standard or dismiss; exclude the broader
    policy debate about congressional immunity.
  span_range:
  - src:49ce34ffe1d8#p1.5
  - src:49ce34ffe1d8#p1.7
  decision: The independent counsel chose to dismiss the first defendant’s prosecution rather than attempt to satisfy the
    appellate court’s remand requirements.
  content_domain: other:criminal procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
