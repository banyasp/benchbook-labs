episodes:
- n: 1
  focus: The decision point is whether to use direct approval by the Deputy Commanding General for Operations or the traditional
    board process. The source says the direct method enabled rapid decisions but disrupted synchronization between operations
    and intelligence; exclude any assessment of particular targets or methods of engagement.
  span_range:
  - src:9bca5508c33e#p57.3
  - src:9bca5508c33e#p57.3
  decision: During PMX24, the MNFS Deputy Commanding General for Operations approved target nominations directly rather than
    routing them through a traditional targeting board.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 2
  focus: The decision point is whether to use a separate planning line of effort or pursue broader integration of information
    forces. Focus on the stated constraints and reasons for the separate approach; exclude the details of the planned information
    activities.
  span_range:
  - src:9bca5508c33e#p71.4
  - src:9bca5508c33e#p71.5
  decision: The MNFS CJ39 chose to develop the OIE plan as a separate line of effort rather than integrate it with the information
    forces’ independent plans.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to emphasize non-lethal effects in targeting guidance amid concern about collateral
    damage and civilian casualties. Keep the focus on the commanders’ stated priorities and reasons; exclude target selection
    or methods of employing effects.
  span_range:
  - src:9bca5508c33e#p74.3
  - src:9bca5508c33e#p74.3
  decision: The MNFS and SOUTHCOM commanders heightened emphasis on non-lethal effects in MNFS targeting guidance to protect
    legitimacy and reduce civilian harm.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 4
  focus: The decision balanced security concerns following the severe vulnerabilities identified in the 2022 assessment against
    the interoperability and access delays caused by one-way trust. Focus on that choice and its stated consequences; exclude
    technical implementation details and the broader proposal for a future integrated solution.
  span_range:
  - src:9bca5508c33e#p87.3
  - src:9bca5508c33e#p88.5
  decision: SOUTHCOM’s Information Assurance team chose a one-way trust relationship from the SOUTHCOM IANTN domain to the
    DJC2 domain for PANAMAX 24 rather than the standard two-way trust.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to retain or revise mission language that the commander considered unrealistic for
    the headquarters’ role. The commander’s stated reason was that economic stabilization belonged to other institutions,
    while the military supported the diplomatic, informational, and economic elements; exclude unspecified changes to the
    statement and subsequent operational actions.
  span_range:
  - src:9bca5508c33e#p93.4
  - src:9bca5508c33e#p93.4
  decision: The Multinational Force South commander revised the headquarters mission statement and commander’s intent, including
    changing language assigning the military an economic-stabilization role.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
