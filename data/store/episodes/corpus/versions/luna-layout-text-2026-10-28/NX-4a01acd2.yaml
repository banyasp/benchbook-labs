episodes:
- n: 1
  focus: The decision point is whether the Justice Department should create a unit for this purpose, following the committee’s
    recommendation and the Attorney General’s stated need for comprehensive information. Exclude the unit’s collection, recordkeeping,
    and prediction practices; focus on the policy choice to establish it and its stated purpose.
  span_range:
  - src:a687a8ee14fc#p3.1
  - src:a687a8ee14fc#p3.3
  decision: The Attorney General of the United States decided to establish the Justice Department’s Interdivision Information
    Unit to organize and analyze information about people and groups involved in civil disorder.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether the CIA should take a formal role in the Justice Department’s domestic intelligence
    work or limit its involvement to liaison and advice. The stated concerns included political implications, the CIA’s lack
    of domestic jurisdiction, and the appearance of excessive involvement; exclude operational details of the liaison and
    any intelligence collection.
  span_range:
  - src:a687a8ee14fc#p4.1
  - src:a687a8ee14fc#p5.1
  decision: The CIA Director decided that the Agency would provide limited liaison and advice to the Justice Department rather
    than formally participate in its domestic intelligence evaluation body.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether the President should retain existing restraints or authorize their relaxation, amid
    dissatisfaction with domestic intelligence and arguments that the restraints impeded collection. The Attorney General
    later opposed the plan and it was withdrawn; exclude descriptions of the methods themselves and focus on authorization,
    legal safeguards, and decision-making authority.
  span_range:
  - src:a687a8ee14fc#p8.2
  - src:a687a8ee14fc#p9.2
  decision: The President decided to approve the White House recommendation to relax or remove legal restraints on specified
    domestic intelligence methods.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to give the committee a written charter or rely on informal authority. The stated concern
    was that a directive might create congressional oversight and disclosure problems; exclude the committee’s analytic work
    and focus on the authority and accountability tradeoff.
  span_range:
  - src:a687a8ee14fc#p11.1
  - src:a687a8ee14fc#p11.2
  decision: The White House representative favored operating the Intelligence Evaluation Committee without a written directive
    rather than formalizing its charter.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
