episodes:
- n: 1
  focus: The decision point is the choice between continuing the New York campaign and acting in Virginia after learning that
    the French fleet would stop in Chesapeake Bay. Focus on the strategic choice and the intelligence and allied-force considerations;
    exclude the deception used to conceal the troop movement.
  span_range:
  - src:0465bc0d7ea7#p35.1
  - src:0465bc0d7ea7#p35.2
  decision: The commander in chief decides to abandon the planned campaign against New York and turn south toward Yorktown.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is how to protect the French arrival when the British commander’s forces were moving toward Rhode
    Island and an attack on New York was not feasible. Focus on the choice and its stated rationale; exclude the mechanics
    of the feint.
  span_range:
  - src:0465bc0d7ea7#p25.2
  - src:0465bc0d7ea7#p26.1
  decision: The commander in chief decides to use a feint toward New York rather than attack it, to deter the British commander
    from moving against the arriving French forces.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the general’s choice to use his command for personal gain rather than remain loyal to the Continental
    Army. The account gives possible motives, including debt, desire for recognition, and resentment over perceived slights.
    Exclude the coded correspondence and the means of arranging the transfer.
  span_range:
  - src:0465bc0d7ea7#p28.2
  - src:0465bc0d7ea7#p32.1
  decision: The general commanding West Point decides to betray his military allegiance by offering the fort to the British
    in exchange for compensation.
  content_domain: other:military-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether the commissioners should honor the instruction to coordinate with France or negotiate
    independently; the account says the instruction was not understood because it was encoded, and that the lead commissioner
    was not inclined to follow it anyway. Exclude the cipher’s mechanics and focus on the commissioners’ diplomatic choice
    and its stated context.
  span_range:
  - src:0465bc0d7ea7#p47.2
  - src:0465bc0d7ea7#p48.2
  decision: The American peace commissioners chose to negotiate with the British without consulting France, rather than follow
    the instruction to act in accordance with France’s direction.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
