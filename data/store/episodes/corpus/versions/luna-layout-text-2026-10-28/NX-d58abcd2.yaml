episodes:
- n: 1
  focus: The choice was whether to risk contact or avoid a possible provocation and the loss of another Moscow officer. The
    passage gives the recent personnel losses and persona-non-grata declaration as risks, and says the intelligence sample
    did not meet headquarters’ apparent threshold of causing grave damage. Exclude the later approval and any details of contact
    methods.
  span_range:
  - src:fac5eab3ce60#p5.2
  - src:fac5eab3ce60#p5.4
  decision: CIA headquarters declined to authorize contact with the volunteer in early 1978.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The choice was whether to treat the volunteer as credible and proceed to a personal meeting, or continue to withhold
    that approval. The intelligence in the September messages and the volunteer’s report that he had substantial additional
    material tipped the balance. Exclude the methods and logistics of arranging the meeting.
  span_range:
  - src:fac5eab3ce60#p8.1
  - src:fac5eab3ce60#p8.3
  decision: CIA senior managers authorized arranging a personal meeting after deciding the volunteer was valid.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: Headquarters weighed arranging the agent’s departure sooner against keeping him in place to preserve access. The
    passage says it recognized the high risks but wanted to maximize the value of his continuing access. Exclude the operational
    details of exfiltration.
  span_range:
  - src:fac5eab3ce60#p22.6
  - src:fac5eab3ce60#p23.1
  decision: CIA headquarters chose to delay the offered exfiltration of the agent and his family for several years, if possible.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision balances the agent’s compensation request and the assessed value of his information against the security
    risk of conspicuously large ruble payments. Keep the focus on the compensation policy, not on the logistics of sourcing
    or passing the jewelry.
  span_range:
  - src:fac5eab3ce60#p30.4
  - src:fac5eab3ce60#p30.6
  decision: CIA officials managing the case chose to calculate the agent’s interest payment at the requested black-market
    exchange rate and to use antique jewelry for part of the compensation.
  content_domain: other:intelligence-agent-compensation
  refusal_sensitivity: medium
  held_out: false
  natsec: false
