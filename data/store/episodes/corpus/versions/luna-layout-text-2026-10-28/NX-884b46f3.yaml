title: The History of CIA’s Office of Strategic Research, 1967-81
collection: cia-csi-books
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: 'The decision followed planning for a unified military analytic organization and a recommendation to the DCI. The
    source gives the reason for the chosen name: to avoid directly challenging DIA and military-service intelligence prerogatives;
    exclude operational or collection details.'
  span_range:
  - src:4cc0425bec10#p22.2
  - src:4cc0425bec10#p22.3
  decision: The DCI approved creating a single military-analysis office in the DI and chose the name “Strategic Research”
    rather than “military research.”
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The DDI kept Vietnam analysis outside the newly formed OSR to preserve analytic continuity and avoid involving OSR
    in political controversies surrounding the conflict. Exclude operational decisions about the war itself.
  span_range:
  - src:4cc0425bec10#p23.3
  - src:4cc0425bec10#p23.3
  decision: The DDI assigned Vietnam war analysis and reporting to OER rather than OSR.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The preceding estimate had been criticized by the White House for inadequate intelligence input; the DCI then involved
    additional analytic components, and the new format included more detail and alternative outcomes. Treat this as a decision
    about analytic process, not as an operational intelligence-collection decision.
  span_range:
  - src:4cc0425bec10#p25.3
  - src:4cc0425bec10#p25.4
  decision: The DCI changed the process for the Soviet strategic forces NIE by involving OSR, OSI, and FMSAC more directly
    and adopting a more detailed format with alternative outcomes.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision arose from disagreement over whether CIA’s comparison of Soviet and U.S. capabilities was a proper intelligence
    function. The source gives the rationale for an independent CIA voice and the DCI’s view that it was not in the national
    interest for DoD to control all such comparisons; exclude operational intelligence activity.
  span_range:
  - src:4cc0425bec10#p34.4
  - src:4cc0425bec10#p34.4
  decision: The DCI and NFAC director chose to preserve the CIA judgment in the 1980 NIE and present separate key judgments
    for the DCI/CIA and DIA/military services.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The source describes the reorganization as a response to the A-Team/B-Team exercise and criticism of OSR assessments,
    with aims including stronger research, force-effectiveness analysis, and support for joint projects. Treat the choice
    as an organizational and analytic-policy decision; exclude any collection or operational methods.
  span_range:
  - src:4cc0425bec10#p33.4
  - src:4cc0425bec10#p33.4
  decision: The OSR director chose to reorganize the office and create a Military–Economic Analysis Center to strengthen military-program
    research after criticism of its Soviet defense-spending assessments.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: 'The passage contrasts the regional structure with the prior functional organization and states the reason: better
    serving key consumers, most of whom had a regional focus. The decision also transferred much of the former OSR staff to
    SOVA; exclude operational intelligence methods.'
  span_range:
  - src:4cc0425bec10#p36.3
  - src:4cc0425bec10#p36.3
  decision: The D/NFAC proposed, and the DCI approved, reorganizing the DDI along regional rather than functional lines by
    integrating functional offices into regional offices.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The choice was between the CIA interpretation and the Air Force/DIA interpretation of the sites’ purpose. Keep the
    decision at the level of analytic judgment and the evidence cited about site size and location; exclude the technical
    details of satellite collection.
  span_range:
  - src:4cc0425bec10#p65.4
  - src:4cc0425bec10#p65.5
  decision: The DCI backed the CIA’s assessment that the Tallinn sites were for air defense rather than a robust anti-ballistic-missile
    system.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The choice was whether ONE should remain under the DDI or operate under the DCI. The stated rationale was that estimates
    should be national products under the DCI’s direct authority, rather than products dependent on DI inputs; exclude broader
    discussion of later organizational changes.
  span_range:
  - src:4cc0425bec10#p73.5
  - src:4cc0425bec10#p73.6
  decision: The DDI transferred the Office of National Estimates from DDI control to the DCI.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision addressed whether military-costing work would be duplicated independently by DIA or assigned primarily
    to CIA, while still providing DoD with necessary data. Include the stated aim of avoiding costly duplication and the agreed
    data-sharing obligation; exclude the technical details of CIA’s costing model.
  span_range:
  - src:4cc0425bec10#p70.5
  - src:4cc0425bec10#p71.2
  decision: The DCI and Deputy Secretary of Defense assigned CIA primary responsibility for studies of foreign military and
    space program costs and resource impacts.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision was whether and how to form a single office for strategic military analysis, including which components
    to combine. The passage gives reasons for independent CIA analysis and specifies that Vietnam-support elements were excluded
    to avoid disrupting a high-priority effort; exclude details of intelligence collection or analytic techniques.
  span_range:
  - src:4cc0425bec10#p74.3
  - src:4cc0425bec10#p75.4
  decision: The DDI proposed, and the DCI approved, creating OSR by consolidating selected CIA military-analysis components
    into one office.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is the analytic judgment by DS&T, with OSR concurrence, rather than the Air Force’s more cautious
    alternative. The stated reason was that the warheads were not independently targetable; also note that the DCI later removed
    the judgment from the draft NIE at the Defense Secretary’s request. Exclude operational details of missile systems.
  span_range:
  - src:4cc0425bec10#p87.2
  - src:4cc0425bec10#p87.3
  decision: CIA analytic leadership judged that the Soviet SS-9 test was not a MIRV test and did not establish a Soviet first-strike
    capability.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The decision point is how to revise the estimate process after the DDI reported resistance to the requested format.
    The administration sought explicit reasoning, alternative outcomes, and differences of opinion so policymakers could assess
    the conclusions; exclude the estimate’s substantive military judgments.
  span_range:
  - src:4cc0425bec10#p95.3
  - src:4cc0425bec10#p96.3
  decision: The DCI shifted drafting authority for the next Soviet strategic estimate from the national estimates office to
    the DDI while retaining community coordination in the national estimates office.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The decision point is whether to subject the disputed CIA costing methodology to independent review or rely on the
    Agency’s existing analysis. The passage links the review to DIA’s challenge and the DCI’s concern that CIA’s estimate
    might be too low; exclude detailed costing methods.
  span_range:
  - src:4cc0425bec10#p112.5
  - src:4cc0425bec10#p113.2
  decision: The DCI and DDI established an outside expert panel to review CIA’s methodology for estimating Soviet defense
    spending.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: 'The decision point is whether to retain the existing estimates office or use senior regional and functional experts
    to coordinate community-wide assessments. The source gives the intended benefits: a single focal point on issues of national
    interest, closer contact with policymakers, and use of the best analytic experts. Exclude the later creation of other
    offices and publications.'
  span_range:
  - src:4cc0425bec10#p122.5
  - src:4cc0425bec10#p123.2
  decision: The DCI abolished the Office of National Estimates and replaced it with a team of National Intelligence Officers
    reporting directly to the DCI.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is whether to retain prior estimates or revise them in light of joint CIA-DIA debriefings and
    improved understanding of Soviet procurement prices. The source explains that most of the increase reflected better price
    information, not discovery of larger or new military programs, and says the revision did not change the assessment of
    force size or capability. Exclude subsequent political reactions except as context for the consequences of the analytic
    judgment.
  span_range:
  - src:4cc0425bec10#p139.2
  - src:4cc0425bec10#p139.4
  decision: CIA’s analytic leadership revised its estimate of Soviet defense spending in 1976, increasing the assessed ruble
    spending and its share of Soviet GNP.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The decision point is whether to permit parallel outside analysis alongside the Intelligence Community’s regular
    estimate, an approach opposed by senior intelligence officials but urged by PFIAB members dissatisfied with prior judgments.
    The source describes the experiment’s scope, including three B-Team topics and the exclusion of the ASW issue because
    of data sensitivity. Focus on the DCI’s policy choice to approve the experiment; exclude operational intelligence methods
    and the substantive merits of the teams’ later conclusions.
  span_range:
  - src:4cc0425bec10#p142.3
  - src:4cc0425bec10#p143.2
  decision: The DCI approved a competitive-analysis experiment on Soviet strategic issues after the President’s Foreign Intelligence
    Advisory Board renewed its request.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The estimate described conflicting views and identified limited evidence as a reason not to resolve them, giving
    recipients an account of the disagreement instead. Treat this as a decision about how to communicate an intelligence judgment,
    not about the underlying technical and military capabilities discussed in the estimate.
  span_range:
  - src:4cc0425bec10#p146.3
  - src:4cc0425bec10#p146.4
  decision: The DCI decided to present the 1977 estimate of Soviet strategic objectives with key judgments framed as questions
    rather than conclusions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The decision point is whether to include the comparisons despite objections from DIA and the military services. The
    DCI argued they could inform national decisionmakers about trends in relative capabilities; the analytic decision is in
    scope, while the calculations and mechanics of the hypothetical attacks are not.
  span_range:
  - src:4cc0425bec10#p160.3
  - src:4cc0425bec10#p161.4
  decision: The DCI decided to retain comparisons of residual U.S. and Soviet strategic forces after hypothetical counterforce
    attacks in the strategic forces estimates.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The decision was between keeping the offices in DS&T and moving them into the DI. The DDI favored concentrating CIA
    analytic production in the DI because the offices conducted in-depth research and analysis in support of national security;
    the DDCI supported the transfer, which was paired with moving FBIS to DS&T. The decision point is this specific restructuring
    choice.
  span_range:
  - src:4cc0425bec10#p151.3
  - src:4cc0425bec10#p151.3
  decision: The DDI, with DDCI support, decided to transfer OSI and OWI from DS&T into the DI.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: 'The decision point is whether the estimate should include this analysis: military intelligence organizations argued
    it could mislead and was a net assessment outside intelligence’s proper role, while the DCI said it mattered to decision-makers
    who viewed mutual residual destruction as central to deterrence. Keep the focus on analytic scope and institutional roles;
    exclude technical details of force calculations.'
  span_range:
  - src:4cc0425bec10#p178.5
  - src:4cc0425bec10#p179.2
  decision: The DCI chose to retain quasi-dynamic analysis of residual strategic forces in the estimate rather than remove
    it at the Defense Department’s request.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The decision point is whether to continue considering ratification or suspend debate pending an assurance about the
    unit’s role. The account identifies concern about the unit as the context; exclude the intelligence collection and any
    operational details.
  span_range:
  - src:4cc0425bec10#p176.3
  - src:4cc0425bec10#p176.3
  decision: The Senate chose to suspend debate on SALT II until the President could assure it that the Soviet unit in Cuba
    did not have a combat role.
  content_domain: other:arms-control ratification
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: 'The decision point is the organizational alternative selected to give policymakers a more unified point of contact:
    a Soviet center drawing analysts from functional offices, or regional offices aligned with customers’ organization. The
    account gives both opposition to the center and the rationale for the regional plan; exclude routine implementation and
    staffing details.'
  span_range:
  - src:4cc0425bec10#p197.4
  - src:4cc0425bec10#p198.3
  decision: The DCI and the D/NFAC chose a regional reorganization of the Directorate for Intelligence rather than creating
    a single integrated Soviet analysis center.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
