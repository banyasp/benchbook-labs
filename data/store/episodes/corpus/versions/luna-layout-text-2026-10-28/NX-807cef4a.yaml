episodes:
- n: 1
  focus: The report contrasts balancing flying hours with allocating missions by sortie-generation workload; HQ MAC says it
    will continue to distribute workload as equitably as possible. Include the short-notice, high-priority taskings and reported
    flying percentages as context, but exclude operational flight procedures.
  span_range:
  - src:c90c5d35decc#p9.12
  - src:c90c5d35decc#p10.5
  decision: HQ MAC airlift planners decide how to allocate aircraft and aircrew workload between the numbered air forces during
    the first week of October redeployment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The report describes personnel-management problems and rejects full publication as impractical, relying instead on
    existing notification procedures because staffing changes are too numerous for an accurate document. Keep the focus on
    the documentation and notification policy, not on access-control techniques.
  span_range:
  - src:c90c5d35decc#p14.8
  - src:c90c5d35decc#p15.3
  decision: HQ MAC personnel planners decide whether to publish a full augmentation document listing personnel names, line
    numbers, and positions.
  content_domain: other:personnel-management
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: Inbound aircraft lacked complete scheduling information, prompting a recommendation that the theater division assume
    command-and-control functions and receive diversion and reroute authority. HQ MAC instead says scheduling information
    should be distributed to all involved agencies and that authority remains with the agency exercising operational control
    under the operation order; exclude flight-control technique.
  span_range:
  - src:c90c5d35decc#p15.5
  - src:c90c5d35decc#p15.12
  decision: HQ MAC command planners decide whether to give the theater airlift division command-and-control and diversion
    authority over inbound C-130s or leave that authority with the agency holding operational control under the operation
    order.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
