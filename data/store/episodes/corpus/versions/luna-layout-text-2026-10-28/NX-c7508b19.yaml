episodes:
- n: 1
  focus: Frame the decision as whether to recover earlier or continue operations given the forecasts, observed conditions,
    and warning information. The report attributes the delay to the flight director’s belief that a later recovery window
    remained, including misinterpretation of weather data and an erroneous warning cancellation; exclude the later winch maneuver.
  span_range:
  - src:d902962d80ff#p13.1
  - src:d902962d80ff#p23.3
  decision: The flight director chose to continue operating the aerostat rather than recover it earlier, then ordered recovery
    as winds and turbulence increased.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to proceed with recovery given forecasts of worsening winds and the warning, versus
    defer or otherwise avoid recovery in those conditions. The report says the decision followed faulty or misperceived weather
    information, including a warning understood as a cancellation; exclude the mechanics of recovery.
  span_range:
  - src:d902962d80ff#p26.3
  - src:d902962d80ff#p27.7
  decision: The MFD 1 decided at 2350Z to proceed with recovery of the Mishap Aerostat rather than defer recovery.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue or stop recovery amid turbulence aloft, increasing tension and winds; the
    stated reason for continuing was that surface winds remained within Red Book limits. Exclude the physical mechanics of
    inhaul or recovery.
  span_range:
  - src:d902962d80ff#p26.5
  - src:d902962d80ff#p26.6
  decision: The MFC chose to continue the aerostat recovery rather than stop it as winds aloft and cable tension increased.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
