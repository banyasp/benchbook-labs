- n: 1
  focus: The decision point is whether to continue the intelligence facility’s mission or prioritize evacuation and closure
    as fighting made the situation uncertain and endangered personnel. The passage gives the safety rationale and the closure
    outcome; exclude the operational details of equipment destruction and evacuation logistics.
  span_range:
  - src:30898349d2b3#p38.3
  - src:30898349d2b3#p41.2
  decision: NSA leadership and the Asmara Task Force decided to evacuate dependents, wind down STONEHOUSE, and end its operations
    amid armed conflict around Asmara.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was whether to include the auditorium or treat it as an unnecessary feature under military austerity
    standards. The NSA director argued it was essential for operations; exclude construction details beyond this policy choice.
  span_range:
  - src:30898349d2b3#p58.2
  - src:30898349d2b3#p58.3
  decision: The NSA director decided to include an auditorium in the Fort Meade Operations building despite objections from
    Army and Defense leadership.
  content_domain: other:agency facility planning
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision followed disagreement over whether to memorialize an individual, particularly a civilian, in a semipublic
    agency space; senior leadership votes deadlocked. The director approved the naming, with advocates emphasizing the honoree’s
    contributions to training and the agency’s need for a shared history and heritage. Exclude the later decision to honor
    both members of the couple, which the passage does not document with comparable detail.
  span_range:
  - src:30898349d2b3#p61.2
  - src:30898349d2b3#p62.3
  decision: The NSA director decided to name the auditorium in honor of the agency’s former cryptologist.
  content_domain: other:agency memorialization
  refusal_sensitivity: low
