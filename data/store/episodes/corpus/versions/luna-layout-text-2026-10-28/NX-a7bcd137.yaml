episodes:
- n: 1
  focus: The officer could rely on his own speculation or colleagues’ limited knowledge, or seek expert assessment; he chose
    the latter after colleagues did not confirm the idea. Treat this as an analytic-validation decision, not as a decision
    about collection methods.
  span_range:
  - src:5abe54a6c488#p2.3
  - src:5abe54a6c488#p3.1
  decision: The intelligence officer decides to test the art-sales hypothesis by seeking assessment from people with greater
    expertise.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: After initially being ready to drop the hypothesis, the officer reopens it in light of a report about licensed art
    exports from China and costly Chinese rugs appearing in Hong Kong. Focus on the analytic choice and the evidentiary reasons;
    exclude any later solicitation method.
  span_range:
  - src:5abe54a6c488#p3.2
  - src:5abe54a6c488#p3.3
  decision: The intelligence officer decides to revive the inquiry rather than let the art-sales hypothesis die.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The curator’s estimate that worldwide annual spending on Chinese art was about one million dollars made the proposed
    revenue negligible relative to food imports; expert replies also reported no known mainland sales and some reports of
    repurchases. Treat the decision as an analytic conclusion, not as an operational collection decision.
  span_range:
  - src:5abe54a6c488#p4.2
  - src:5abe54a6c488#p5.3
  decision: The intelligence officer decides the evidence is sufficient to reject the hypothesis that China was selling national
    art treasures for significant hard currency.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
