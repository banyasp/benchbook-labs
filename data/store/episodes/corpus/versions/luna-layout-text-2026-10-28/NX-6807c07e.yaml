- n: 1
  focus: The directive calls for an organized capability and immediate actions to devote resources specifically to analysis
    and, where appropriate, countering Soviet CC&D. The decision concerns committing focused resources versus leaving the
    existing approach in place; exclude operational collection or countermeasure techniques.
  span_range:
  - src:df2a31800f75#p24.3
  - src:df2a31800f75#p24.5
  decision: The President decides whether to direct a dedicated intelligence effort to analyze and counter Soviet strategic
    deception.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to create the analytic group or defer to the DO’s claim of exclusive prerogative over
    KGB reporting. The passage gives the group’s analytic purpose and describes the resistance; exclude operational activity
    and collection methods.
  span_range:
  - src:df2a31800f75#p27.2
  - src:df2a31800f75#p27.5
  decision: The DDI decides to establish a DI capability to study foreign covert actions and deception despite the DO’s objections.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The review found a dramatic decline in capability and recommended more billets, leadership attention, and corrective
    actions; the DCI concurred and sent an action memo. The decision concerns directing a resource and coordination turnaround
    or leaving the shortfalls unaddressed; exclude specific collection methods.
  span_range:
  - src:df2a31800f75#p30.2
  - src:df2a31800f75#p30.4
  decision: The DCI decides whether to accept the capability review and direct community-wide corrective actions to rebuild
    the foreign D&D effort.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The passage describes the 1970 decision to train and mobilize Thai forces for combat in Laos, with protection of
    Thailand from a perceived threat of Vietnamese invasion as the stated rationale amid the US drawdown. Keep the scenario
    at the policy level; exclude force employment details and tactical coordination.
  span_range:
  - src:df2a31800f75#p41.3
  - src:df2a31800f75#p41.5
  decision: US and Thai leadership chose to create the UNITY Program and deploy Thai forces to Laos.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The passage links the program’s institutionalization to a fatal mistaken strike on Thai troops and the resulting
    need for more forward air control, while noting constraints on US personnel on the ground. Treat the decision as one about
    assigning strike-validation authority to locally recruited guides; exclude strike coordination procedures and other operational
    details.
  span_range:
  - src:df2a31800f75#p42.3
  - src:df2a31800f75#p43.4
  decision: CIA leadership chose to institutionalize a Thai ground-based forward-air-guide program and authorize its guides
    to clear US aircraft strikes.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 6
  focus: The decision point is the agency’s choice between prioritizing naval intelligence and continuing secondary domestic
    or undercover activity. The passage says the latter consumed time and energy and that poorly analyzed excess information
    obscured important signals; exclude any account of collection methods.
  span_range:
  - src:df2a31800f75#p63.3
  - src:df2a31800f75#p63.3
  decision: The Director of Naval Intelligence decided in 1930 to direct attachés to focus on naval matters rather than pursue
    undercover activity.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to restrict access to the instruments or allow their readings to remain available as
    radiation rose after the accident. The passage gives the stated rationale—avoiding panic and provocative rumors; exclude
    technical details about the instruments or their handling.
  span_range:
  - src:df2a31800f75#p54.2
  - src:df2a31800f75#p54.2
  decision: The KGB decided to seal radiation-monitoring instruments in Kiev after they registered increased radiation.
  content_domain: other:public-information policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The decision point is whether to attack at once, as subordinate commanders recommended, or hold back because of concern
    about a potential counteroffensive. Keep the scenario at the level of the command decision; exclude tactical details of
    any attack.
  span_range:
