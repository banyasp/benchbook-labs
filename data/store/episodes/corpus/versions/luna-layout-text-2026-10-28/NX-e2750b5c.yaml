episodes:
- n: 1
  focus: The researchers faced the choice of using the full indicator list or a sample; they chose 28 indicators described
    as important and representative. The stated reason was that the usefulness of this approach was not yet clear. Exclude
    any inference that this was an operational warning decision.
  span_range:
  - src:6c8d41f085a3#p2.5
  - src:6c8d41f085a3#p3.1
  decision: The study researchers decide to assess a selected sample of 28 indicators rather than all 123.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The researchers chose independent judgments by several experienced analysts to assess the relevance of indicators
    to the hypotheses. Their stated rationale was that the judgments were novel and their usefulness uncertain, and agreement
    among experts would provide a basis for further experimentation. Exclude the substance of any hypothetical hostile action.
  span_range:
  - src:6c8d41f085a3#p5.2
  - src:6c8d41f085a3#p5.5
  decision: The study researchers decide to have five experienced analysts independently weight each indicator against each
    hypothesis.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: After finding disagreement among judges, the researchers asked for explanations; they found that some differences
    arose from ambiguous terms and revised weights after resolving that ambiguity. The passage also reports a resulting decision
    to define each hypothesis more precisely across component features. Exclude disagreements that remained irreconcilable
    and any operational implications of the taxonomy.
  span_range:
  - src:6c8d41f085a3#p6.1
  - src:6c8d41f085a3#p6.3
  decision: The study judges and researchers decide to resolve some rating disagreements by clarifying hypothesis definitions
    and assigning revised weights.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
