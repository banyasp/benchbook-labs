episodes:
- n: 1
  focus: The decision point is whether to retain the earlier, lower estimates or revise them using the validated documentary
    record. The article says the records were considered authentic and a reliable baseline, and that the resulting memorandum
    revised prior estimates; exclude the operational details of how supplies were transported.
  span_range:
  - src:8eaa68c67c94#p8.5
  - src:8eaa68c67c94#p9.5
  decision: CIA analysts revise the estimates of military deliveries through Sihanoukville after reviewing newly available
    shipping records.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to order an inquiry into the intelligence failure; the President chose to direct the
    Board to investigate and give the case close attention. The stated concern was that a serious error on an apparently straightforward
    issue raised doubts about the reliability of other assessments; exclude any operational account of the supply route.
  span_range:
  - src:8eaa68c67c94#p10.4
  - src:8eaa68c67c94#p10.5
  decision: The President directs the Foreign Intelligence Advisory Board to investigate the intelligence community’s failure
    to assess Sihanoukville’s importance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to make personnel changes in response to pressure for a shakeup or retain the analysts;
    the Director backed the team and did not purge it. The article connects this choice to the analysts’ forthrightness in
    revisiting their analysis; exclude the operational details of the route and focus on institutional accountability.
  span_range:
  - src:8eaa68c67c94#p10.7
  - src:8eaa68c67c94#p11.3
  decision: The Director of Central Intelligence backs the analysts and avoids a personnel purge after the Sihanoukville estimate
    failure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
