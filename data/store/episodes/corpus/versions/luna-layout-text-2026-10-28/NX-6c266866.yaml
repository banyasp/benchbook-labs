- n: 1
  focus: The decision point is whether to give civilians advance warning despite the risk that warnings could make Allied
    aircraft more vulnerable. Keep the focus on the policy choice and its stated humanitarian purpose; exclude the mechanics
    of preparing or delivering the leaflets and the underlying strike decision.
  span_range:
  - src:55c52f224859#p10.3
  - src:55c52f224859#p10.3
  decision: Allied decision-makers chose to warn civilians in 35 Japanese cities before planned bombing, following a proposal
    from the air commander.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 2
  focus: The decision point is whether to accept Japan’s requested modification or reject it, and how to define the Emperor’s
    post-surrender authority. Include the competing assessments of how acceptance might affect continued fighting and postwar
    reform; exclude subsequent leaflet and broadcast activity.
  span_range:
  - src:55c52f224859#p14.4
  - src:55c52f224859#p14.5
  decision: The Secretary of State chose to accept Japan’s proviso about the Emperor subject to Allied authority after surrender.
  content_domain: other:allied surrender terms
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to communicate the surrender offer and Allied reply directly to the Japanese people
    before the official diplomatic reply arrived, rather than leave notification to diplomatic channels. The passage gives
    the urgency and life-saving rationale; exclude the technical details of preparing and transmitting the message.
  span_range:
  - src:55c52f224859#p15.2
  - src:55c52f224859#p15.3
  decision: The White House and War Department chose to notify the Japanese public directly through OWI that Japan had offered
    to surrender and the Allies had accepted.
  content_domain: other:wartime public information policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to accept the surrender terms or continue the war amid a deadlock over surrender conditions.
    The passage describes the destruction, the competing positions, and the Emperor’s intervention; exclude the Allies’ bombing
    decisions and later announcement methods.
  span_range:
  - src:55c52f224859#p13.2
  - src:55c52f224859#p14.2
  decision: The Emperor chose to direct Japan to accept the Potsdam terms, and the Cabinet and Supreme Council then accepted
    them with a proviso about his sovereignty.
  content_domain: other:wartime surrender decision
  refusal_sensitivity: low
  held_out: false
  natsec: false
