- n: 1
  focus: The decision point is whether to authorize a sustained campaign or refrain from one, in the context of deteriorating
    East-West relations and instructions to counter the Reagan administration’s stance. The article describes exploiting public
    concern about biological warfare and the uncertain origins of AIDS as reasons; exclude the campaign’s media-placement
    and other execution methods.
  span_range:
  - src:2a356d55f942#p10.2
  - src:2a356d55f942#p12.4
  decision: The KGB First Chief Directorate decided to launch an AIDS disinformation campaign against the United States.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was whether to endorse or publicly disseminate the claims, versus maintaining restrictive policy and
    leaving the scientist responsible for them. The passage gives concerns about the political implications and preserving
    an appearance of scientific independence; exclude the intelligence services’ methods for promoting the claims.
  span_range:
  - src:2a356d55f942#p19.2
  - src:2a356d55f942#p19.4
  decision: The East German party’s chief ideologue decided to keep the state’s AIDS information policy restrictive and avoid
    officially publishing the scientist’s claims.
  content_domain: other:state information policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to keep the campaign focused on the claim that the United States created AIDS or broaden
    it by combining that claim with existing ethnic-weapons themes. The passage presents the broader narrative as a means
    to tarnish America’s reputation and alienate developing countries; exclude the specific dissemination methods and individual
    media reports.
  span_range:
  - src:2a356d55f942#p22.3
  - src:2a356d55f942#p22.5
  decision: Soviet bloc intelligence leadership chose to broaden the AIDS disinformation campaign by linking it to claims
    that AIDS was an ethnic weapon.
  content_domain: other:information-influence policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is the staff’s choice to limit dissemination of a sensitive intelligence success, despite the
    potential value of informing the wider army. The stated reason was fear that broader disclosure would cause leaks; exclude
    the separate technical details of codebreaking.
  span_range:
  - src:2a356d55f942#p36.2
  - src:2a356d55f942#p36.3
  decision: The French senior military staff decided to keep the French success in breaking German codes within a limited
    circle rather than share it with the rest of the French army.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The faculty had access to Intellipedia and proprietary sources but avoided using that material, in keeping with the
    Institute for Analysis representatives’ request for research free of influence from an intelligence-community perspective.
    Focus on source independence and academic integrity; exclude the project’s research methods generally.
  span_range:
  - src:2a356d55f942#p51.2
  - src:2a356d55f942#p51.4
  decision: Faculty members chose not to use proprietary intelligence sources or steer students toward them.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The collaborators decided to use multiple avenues of research to capture more ideas, improve thoroughness, reduce
    biases associated with one approach, and preserve the prospect of delivering a product if one part was interrupted. Focus
    on the research-design choice and its tradeoffs; exclude the specific research techniques described elsewhere.
  span_range:
  - src:2a356d55f942#p52.2
  - src:2a356d55f942#p52.5
  decision: The project faculty and coordinator chose multiple research approaches rather than relying on a single approach.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: After evaluating the collected reports, the principal analyst found substantial problems with open-source metrics
    and substituted qualitative proxies, while allowing reliable quantitative data to be incorporated when identified. Focus
    on the analytic standard for handling unreliable data; exclude the examples of particular indicators as operational guidance.
  span_range:
  - src:2a356d55f942#p53.3
  - src:2a356d55f942#p53.4
  decision: The principal analyst chose qualitative proxies in place of poor, incomplete, or unreliable quantitative measures.
  content_domain: intel-analysis
