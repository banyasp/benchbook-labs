  focus: 'The decision point is the analysts’ revised estimate: they judged Castro disappointed by limited results and described
    insurgencies as hindered by disunity, weak popular support, and doubts among Soviet and regional communist leaders. Treat
    this as an estimative judgment, not a Cuban operational decision; exclude the operational details of insurgencies and
    intelligence activity.'
  span_range:
