  focus: The decision point is whether to accept the challenge’s transit-country framing or reframe the analysis around groups
    and their possible nodes of operation. Focus on the analytical rationale that the transit-country premise could constrain
    the inquiry; exclude any operational collection methods.
  span_range:
  - src:74bd6ca2b0f9#p5.2
  - src:74bd6ca2b0f9#p5.4
  decision: The project principal analyst chose to begin STORM with questions about a group’s goals, objectives, and resources
    rather than first identifying transit countries.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to rely on available quantitative metrics or substitute qualitative proxies when the
    metrics are poor, incomplete, corrupted, or inconsistently defined. Focus on the analytic standard for handling unreliable
    data; exclude examples that would become operational collection guidance.
  span_range:
  - src:74bd6ca2b0f9#p5.3
  - src:74bd6ca2b0f9#p5.4
  decision: The project principal analyst chose qualitative proxies for unreliable measures of STORM pathologies while allowing
    reliable quantitative data to be used.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to use available proprietary intelligence information or keep the classroom research
    independent of it. Focus on the stated aim of producing research free from an IC perspective; exclude details about any
    collection or access techniques.
  span_range:
  - src:74bd6ca2b0f9#p3.2
