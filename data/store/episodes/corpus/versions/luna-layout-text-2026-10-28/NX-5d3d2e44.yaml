episodes:
- n: 1
  focus: 'Reconstruct the choice following the wartime OSS experience: independent national control versus coordination while
    departments retained autonomy. Focus on departmental needs and the stated coordination compromise; exclude operational
    intelligence methods.'
  span_range:
  - src:3029bf442243#p1.12
  - src:3029bf442243#p1.13
  decision: The postwar policy-makers chose a coordinating intelligence group that preserved the Military and State Departments’
    control of their own intelligence resources, rather than an independent intelligence agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: Reconstruct the group’s choice between full integration and a central management and coordination authority, including
    its concern for the Services’ specialized skills and the need to oversee resources and reduce waste. Treat this as a recommendation,
    not an implemented decision; exclude collection or operational techniques.
  span_range:
  - src:3029bf442243#p1.83
  - src:3029bf442243#p1.85
  decision: The Joint Study Group chose to recommend an authoritative Defense intelligence focal point with broad managerial
    powers rather than a single intelligence service for all of DoD.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: Reconstruct the Secretary’s decision and its stated goals, including eliminating duplication and integrating Defense
    intelligence efforts; the later Joint Chiefs proposal illustrates an alternative that reserved more functions to the Services.
    Exclude operational intelligence methods and focus on organization, authority, and policy rationale.
  span_range:
  - src:3029bf442243#p1.106
  - src:3029bf442243#p1.115
  decision: The Secretary of Defense chose to establish DIA and directed the Joint Chiefs of Staff to develop an extensively
    integrated agency concept, rather than adopt the more limited integration later proposed by the Joint Chiefs.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
