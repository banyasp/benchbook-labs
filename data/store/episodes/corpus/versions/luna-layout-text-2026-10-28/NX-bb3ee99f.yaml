episodes:
- n: 1
  focus: The decision point is whether to bring further charges or decline prosecution. Focus on the stated evidentiary obstacle—the
    unavailability of key witnesses, especially the former CIA Director, whose potential knowledge and responsibility could
    undermine the Government’s case; exclude the separate existing indictment.
  span_range:
  - src:de26255aa8d7#p1.1
  - src:de26255aa8d7#p1.2
  decision: Independent Counsel decided not to seek additional indictments after completing the investigation.
  content_domain: other:prosecutorial decision
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to maintain the Finding’s congressional-notification ban or end it so CIA leaders could
    respond to congressional inquiries. Focus on the oversight and disclosure choice and its stated reason; exclude the operational
    history of the Iran initiative.
  span_range:
  - src:de26255aa8d7#p1.19
  - src:de26255aa8d7#p1.20
  decision: The National Security Adviser agreed to end the prohibition on notifying Congress about the Finding.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to disclose the contacts’ identities or protect them, including during the Attorney
    General’s investigation. Focus on the choice to withhold information from Justice Department officials and the stated
    concern for protecting sensitive contacts; exclude any methods of covert protection or communication.
  span_range:
  - src:de26255aa8d7#p1.37
  - src:de26255aa8d7#p1.38
  decision: The CIA Director and the counterterrorism intelligence officer agreed to withhold six Iranian contacts’ identities
    from investigators.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision followed a dispute with the NSC and disagreements within the CIA over the flight’s authorization and
    when the Agency learned arms were aboard. Focus on the choice and its effects on congressional oversight; exclude operational
    details of the arms shipment.
  span_range:
  - src:de26255aa8d7#p1.56
  - src:de26255aa8d7#p1.57
  decision: CIA leadership chose to give Congress an extremely unspecific and thin account of the November 1985 flight in
    the CIA Director’s prepared remarks.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The sentence was removed after an aide reported that a CIA lawyer was certain the Director knew within days that
    weapons were aboard. Focus on the choice to retain or delete the assertion in congressional testimony; exclude unrelated
    details of the shipment.
  span_range:
  - src:de26255aa8d7#p1.58
  - src:de26255aa8d7#p1.58
  decision: The CIA Director authorized removing a sentence from his draft testimony stating that neither the airline nor
    the CIA knew the flight carried missiles.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The report says the evidence could not establish beyond a reasonable doubt that concerted action violated federal
    law, principally because crucial witnesses were unavailable; it also notes that a similar category of alleged false statement
    had already been charged in the CIA officer’s case. Focus on the charging decision and its evidentiary and procedural
    reasons, not on the underlying shipment’s operational details.
  span_range:
  - src:de26255aa8d7#p1.60
  - src:de26255aa8d7#p1.61
  decision: The Independent Counsel decided not to prosecute CIA officials for concerted action in responding to congressional
    inquiries about the November 1985 shipment.
  content_domain: other:prosecution
  refusal_sensitivity: low
  held_out: false
  natsec: false
