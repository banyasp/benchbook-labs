episodes:
- n: 1
  focus: The decision point is whether to retain the prior exclusionary approach or permit return and reintegration, including
    for former insurgents. The account links the policy to the judgment that military gains alone were insufficient and that
    freedom and return to society could help end the insurgency; exclude operational pressure and intelligence methods.
  span_range:
  - src:21d457aece1c#p9.2
  - src:21d457aece1c#p10.3
  decision: The Thai prime minister, advised by the intelligence team, chose to issue Order 66/33 and allow CPT members who
    left the insurgency to return to Thai society.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to continue party-to-party support for the CPT or shift toward relations with the Thai
    government. The account says China needed Thailand in the context of Vietnam’s occupation of Cambodia and its regional
    military presence; exclude the mechanics of the VOPT broadcasts.
  span_range:
  - src:21d457aece1c#p8.2
  - src:21d457aece1c#p8.3
  decision: Chinese leadership chose to end support for the CPT and prioritize its state relationship with Thailand.
  content_domain: other:foreign_policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
