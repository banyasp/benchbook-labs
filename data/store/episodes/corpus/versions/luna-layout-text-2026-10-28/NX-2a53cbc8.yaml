- n: 2
  focus: A teenage volunteer offered to help, but the chief judged her to be younger than she claimed and learned that her
    mother did not know about the offer or the expensive coat given by the volunteer’s boyfriend. The decision point is whether
    to accept her help or protect her by declining and involving her mother; exclude general claims about women as agents.
  span_range:
