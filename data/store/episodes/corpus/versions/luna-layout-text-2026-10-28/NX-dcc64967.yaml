- n: 1
  focus: The Ambassador could order the evacuation earlier or delay it; he delayed while hoping for a negotiated settlement
    and resisting overt steps he believed could cause panic. The worsening military situation and the rocket attack on Tan
    Son Nhut preceded his order on the morning of April 29. Exclude the helicopter operations and evacuation logistics.
  span_range:
  - src:2f14061956e8#p10.1
  - src:2f14061956e8#p10.4
  decision: The Ambassador in Saigon decided when to order the emergency evacuation.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The crew faced attacking aircraft and chose to respond rather than refrain from engagement; the passage indicates
    the threat to Site 85 as the reason. Treat this only as a decision whether to engage, and exclude the account’s weapon-use
    and pursuit details.
  span_range:
  - src:2f14061956e8#p11.5
  - src:2f14061956e8#p11.5
  decision: The Air America pilot and flight mechanic decided to engage aircraft attacking Site 85.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The decision point is whether to begin evacuation or avoid actions that might signal abandonment while pursuing a
    negotiated settlement. Focus on the ambassador’s stated policy rationale and the risks to Americans; exclude the mechanics
    of evacuation.
  span_range:
  - src:2f14061956e8#p17.1
  - src:2f14061956e8#p17.3
  decision: The U.S. ambassador to South Vietnam chose to delay evacuating Americans and continue encouraging the South Vietnamese
    government to resist.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether Air America should provide helicopters for an emergency evacuation despite the pilot
    shortage and associated risks. Focus on the company’s commitment and the reasons for it; exclude landing-zone preparation,
    fueling, communications, and other operational details.
  span_range:
  - src:2f14061956e8#p17.4
  - src:2f14061956e8#p17.5
  decision: The Air America chief executive chose to commit the company’s helicopters to the planned Saigon evacuation.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to remain at the compound in expectation of security or evacuate when that protection
    was absent. Focus on the stated security conditions and the decision to leave; exclude the subsequent efforts to obtain
    fuel or transport.
  span_range:
  - src:2f14061956e8#p21.5
  - src:2f14061956e8#p22.2
  decision: The Air America chief executive ordered evacuation of the company’s Saigon compound rather than waiting for the
    expected Marine security force.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
