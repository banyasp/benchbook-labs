  focus: The decision concerns wartime publication of news about a cruiser’s loss, not the counterintelligence operation against
    the correspondents also mentioned in the passage. The stated reason for withholding was that the Germans did not know
    the cruiser had sunk and the Royal Navy needed that type of ship for convoy service.
  span_range:
  - src:de3626c816cc#p3.4
  - src:de3626c816cc#p4.1
  decision: Admiralty censors decide whether to release the correspondent’s report of the Queen Mary–Curacoa collision during
    the war; they withhold it until VE-Day.
  content_domain: other:wartime press censorship
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision is whether censors should stop a false report, not whether the report was accurate. The passage says
    the censors were not concerned with accuracy and saw no aid or comfort to the enemy in the story.
  span_range:
  - src:de3626c816cc#p5.4
