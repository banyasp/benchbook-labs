episodes:
- n: 1
  focus: This is a force-policy choice against retaining larger conventional forces, with the stated aims of deterring and
    fighting war while releasing resources for the civilian economy. Keep the focus on the policy choice and its economic
    and military rationale; exclude the operational details of force employment.
  span_range:
  - src:55d9338d71c2#p13.4
  - src:55d9338d71c2#p13.5
  decision: The Soviet leader chose to reorganize the armed forces around nuclear missile forces, substantially reduce manpower,
    and accelerate retirement of older weapons.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The passage situates the choice amid concern about Soviet strategic inferiority, US statements about the balance,
    and lack of expected concessions on Berlin; it describes both strategic and psychological purposes. Treat this as a policy
    decision about deployment and coercive leverage, not as a question of how to deploy or employ the missiles.
  span_range:
  - src:55d9338d71c2#p15.3
  - src:55d9338d71c2#p15.5
  decision: The Soviet leadership decided to deploy strategic missiles to Cuba to improve its strategic position and strengthen
    its political leverage.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the leadership’s choice to rely principally on strategic missiles to deter war, weighing lower
    costs against the military’s concern about forces needed if deterrence failed. Keep the scenario at the level of doctrine
    and resource priorities; exclude technical or operational details of nuclear warfare.
  span_range:
  - src:55d9338d71c2#p26.6
  - src:55d9338d71c2#p27.3
  decision: Soviet political leadership under the Soviet leader chose an openly deterrent military policy rather than preserving
    the larger, diverse forces favored by senior military leaders.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the choice between an economically difficult force expansion and improving the credibility
    of retaliation. The passage gives strategic and economic reasons; exclude the listed force-protection and delivery-system
    measures as operational detail.
  span_range:
  - src:55d9338d71c2#p28.4
  - src:55d9338d71c2#p28.6
  decision: Soviet leaders chose to strengthen retaliatory deterrence rather than build strategic attack forces large enough
    to make the United States fear a Soviet first strike.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to expand beyond limited deployment despite an unsatisfactory system and the great
    resources a broad program would require. Keep the focus on the commitment and its economic tradeoffs; exclude technical
    details of ABM development or operation.
  span_range:
  - src:55d9338d71c2#p23.5
  - src:55d9338d71c2#p24.3
  decision: Soviet leaders authorized only limited deployment of ABM defenses and had not committed to a large-scale deployment.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The estimate infers that the Soviet Government chose negotiations after delaying its response, weighing political
    opportunity, military bargaining position, and internal debate. Treat the stated motives as the estimate’s assessment,
    not confirmed Soviet deliberations; exclude force-employment details.
  span_range:
  - src:55d9338d71c2#p39.4
  - src:55d9338d71c2#p40.4
  decision: The Soviet Government chose to accept US arms-control talks.
  content_domain: other:arms-control-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 7
  focus: The estimate sets out three courses and judges that Soviet leaders would continue competing to maintain or improve
    the USSR’s relative position. It cites the sacrifice of recent gains, unacceptable economic costs, and likely US reaction
    as reasons; keep this as a conditional analytic assessment, not a verified Soviet decision.
  span_range:
  - src:55d9338d71c2#p40.5
  - src:55d9338d71c2#p40.5
  decision: Absent an arms-control agreement, Soviet leaders chose to continue the strategic arms competition rather than
    unilaterally de-escalate or seek superiority.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The estimate interprets Soviet policy as favoring qualitative advances over a rapid numerical buildup or matching
    the US in delivery vehicles. It attributes that assessment to the likelihood that the US would detect and match or exceed
    such a buildup, along with economic constraints; distinguish the analysts’ judgment from direct evidence of a Soviet decision.
  span_range:
  - src:55d9338d71c2#p52.6
  - src:55d9338d71c2#p53.3
  decision: Soviet leaders chose not to pursue numerical parity with US intercontinental forces, instead emphasizing qualitative
    improvements, according to the estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The estimators weigh new evidence of faster-than-expected single-silo construction against prior projections and
    the time needed for launchers to become operational. Focus on the estimative choice and its stated basis; exclude the
    technical details of missile systems and deployment.
  span_range:
  - src:55d9338d71c2#p61.3
  - src:55d9338d71c2#p61.6
  decision: The NIE 11-8-64 estimators decide to revise the mid-1966 Soviet ICBM launcher estimate upward to 350–400.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: A review changes the estimated 1966 force from about 45 ballistic-missile submarines to 36, leading the estimators
    to reduce the 1976 projection from 60–70 to 55–65. Focus on the decision to revise the estimate and its evidentiary basis;
    exclude submarine operational or technical details.
  span_range:
  - src:55d9338d71c2#p81.4
  - src:55d9338d71c2#p82.5
  decision: The intelligence estimators decide to lower the 1976 ballistic-missile-submarine projection after revising the
    estimated 1966 order of battle.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The estimates distinguish launchers normally unavailable for operational use from those that could be prepared to
    fire, while the Air Force representative argues that Tyuratam launchers pose a threat to US target areas and should count.
    Focus on the competing analytic classifications and their stated reasons; exclude any operational use details.
  span_range:
  - src:55d9338d71c2#p77.3
  - src:55d9338d71c2#p77.4
  decision: The NIE 11-8-66 estimators decide to exclude Tyuratam R&D launchers from the operational ICBM total, while the
    Air Force intelligence representative dissents and would include them.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The estimate describes arms control as an option to conserve resources and preserve the Soviet strategic position,
    while assessing that absent an agreement the USSR would continue the competition to maintain or improve its position.
    It weighs economic pressures, US strategic improvements, deterrence, and the likely US response; exclude the technical
    details of weapons and force deployments.
  span_range:
  - src:55d9338d71c2#p98.5
  - src:55d9338d71c2#p102.6
  decision: Soviet leaders decide whether to pursue strategic arms control or continue the arms competition with the United
    States.
  content_domain: other:strategic-arms-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 13
  focus: The estimate identifies competing interpretations—FOBS, a depressed-trajectory ICBM, or a system with both missions—and
    withholds a confident judgment about type, timing, and deployment because the evidence is inconclusive. Treat this as
    an analytic judgment; exclude technical descriptions of the system or testing.
  span_range:
  - src:55d9338d71c2#p99.4
  - src:55d9338d71c2#p99.4
  decision: National intelligence estimators decide whether to make a confident assessment of the purpose and prospective
    deployment of the Soviet space-related system under test.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The estimators favor the extended-range IRBM interpretation, citing the formidable logistical and operating problems
    and expense of deploying a roughly 3,000 n.m. missile where it could reach US targets. Treat this as an analytic classification
    under uncertainty, not a decision to deploy or employ the missile.
  span_range:
  - src:55d9338d71c2#p106.6
  - src:55d9338d71c2#p107.3
  decision: The intelligence estimators decide whether the missile being developed from the Scrooge TEL is more likely a mobile
    ICBM or an extended-range IRBM.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: 'The estimate describes rough parity as a likely minimum objective, while recording disagreement: one official assesses
    that major superiority is not feasible, and other officials assess that the Soviets are seeking some measure of superiority.
    Preserve the split judgment and its stated rationale; do not recast it as a decision by Soviet leaders or as a force-employment
    choice.'
  span_range:
  - src:55d9338d71c2#p119.7
  - src:55d9338d71c2#p119.8
  decision: The interagency estimators decide whether to assess Soviet strategic policy as seeking rough parity or some measure
    of superiority over the United States.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The analytic choice was whether to infer sufficient range from the missile’s potential capabilities or limit the
    estimate to demonstrated test performance. The passage gives the basis for the inference and notes the uncertainty; exclude
    any operational use of the weapon.
  span_range:
  - src:55d9338d71c2#p134.4
  - src:55d9338d71c2#p134.7
  decision: The intelligence estimators judged that the SS-9 Mod 2 could have sufficient range to reach all Minuteman targets,
    despite that range not having been demonstrated in tests.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: 'The decision point is how estimators handled uncertainty: offer a precise force-structure estimate or use several
    scenarios, while identifying the range they considered most likely. Treat this as an analytic-method choice, not as Soviet
    policy or a recommendation for US force planning.'
  span_range:
  - src:55d9338d71c2#p141.4
  - src:55d9338d71c2#p142.3
  decision: The estimate’s authors chose to represent future Soviet force structures with illustrative models rather than
    make an exact forecast.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
