  focus: The decision point is whether to keep U.S. personnel in command and accompanying teams, or limit them to advisory
    roles and keep them out of the field. The commander’s stated concern was that U.S. personnel might become involved in
    actions construed as violations of the Uniform Code of Military Justice, amid concerns about alleged abuses and their
    effect on support for the war; the author reports that the restriction weakened PRU morale and effectiveness. Exclude
    the operational details of PRU missions.
