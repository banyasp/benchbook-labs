episodes:
- n: 1
  focus: 'The decision point is whether to follow the OPLAN finance directives as written or adjust support arrangements to
    maintain scheduled paydays. The report gives the reason for the adjustment: uninterrupted payday support was treated as
    a peacetime mission. Exclude the routine details of check handling and distribution.'
  span_range:
  - src:ae438beed2f2#p16.3
  - src:ae438beed2f2#p16.3
  decision: USAREUR finance leadership altered the OPLAN finance-support directives and augmented the finance staff to preserve
    regularly scheduled paydays during REFORGER 83.
  content_domain: other:military administration
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The report says USACAE used agreements rather than formal contracts, explaining that many NATO governments regarded
    commercially oriented contract clauses as offensive. Treat this as a legal and policy decision about the authority and
    instrument for acquiring allied support; do not assume the report establishes that deleting statutory clauses was lawful.
  span_range:
  - src:ae438beed2f2#p97.5
  - src:ae438beed2f2#p97.7
  decision: USACAE decides whether to obtain REFORGER logistics support through formal contracts or NATO Mutual Support Act
    agreements that omit standard statutory clauses.
  content_domain: other:allied logistics policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The report recommends eliminating reefer vans during tactical phases because their use burdened normal theater commitments
    and conflicted with the exercise’s wartime-austerity realism; it also notes their use for hospital ice and restricted-diet
    items. Focus on the policy tradeoff between realism and support needs, not on operational logistics methods.
  span_range:
  - src:ae438beed2f2#p106.1
  - src:ae438beed2f2#p106.3
  decision: USAREUR logistics officials decide whether to continue using refrigerated vans during REFORGER’s tactical phases
    or eliminate their use.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The report describes excess supervision and staffing, alongside relatively light activity, as creating an overly
    optimistic picture of logistics capacity. It recommends limited events that stress selected sites while using only realistic
    assets; focus on the exercise-design choice and its rationale, not on techniques for conducting operations.
  span_range:
  - src:ae438beed2f2#p117.1
  - src:ae438beed2f2#p117.5
  decision: EUCOM exercise planners decide whether to preserve routine staffing and activity at logistics sites or impose
    realistic resource constraints and concentrated demand in selected exercises.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The report links three slips in the cutoff date to delayed receipt and approval of requests, a missed release date,
    and urgent, compressed processing. Treat reestablishing 1 June as the recommended course, not as proof that USAREUR ultimately
    adopted it; exclude the mechanics of processing loan requests.
  span_range:
  - src:ae438beed2f2#p136.3
  - src:ae438beed2f2#p136.4
  decision: USAREUR decides whether to reestablish the 1 June cutoff for temporary-loan requests rather than allow later cutoff
    changes.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The report describes U.S. forces seeking to impose their own standards despite relying on host nations for contracted
    support; the water contract specified potability but not U.S. military requirements. It recommends specifying required
    support in agreements and applying host-nation standards where standards differ; exclude technical medical guidance beyond
    this policy choice.
  span_range:
  - src:ae438beed2f2#p151.3
  - src:ae438beed2f2#p151.3
  decision: USAREUR and host-nation support planners decide which preventive-medicine standards govern when U.S. and host-nation
    standards differ.
  content_domain: other:host-nation support standards
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The report describes substantial support for invitees, unsatisfactory participation by influential media, and last-minute
    cancellations that wasted seats and support. It recommends reviewing the program’s benefits and cost-effectiveness, with
    cancellation if participation does not justify the expenditure; do not treat that recommendation as evidence that the
    program was actually canceled.
  span_range:
  - src:ae438beed2f2#p131.2
  - src:ae438beed2f2#p131.3
  decision: USEUCOM and the Department of Defense decide whether to continue the CONUS media tour or cancel it if its benefits
    do not justify its costs.
  content_domain: other:public-affairs resource allocation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: 'The decision point is the allocation of authority to control weapons-control orders while Corps monitored. The report
    gives reasons: the division managed multiple orders effectively, while higher-echelon changes were described as routine
    and not responsive to air activity. Exclude the specific order parameters and engagement example; the scenario concerns
    command authority, not how to employ weapons.'
  span_range:
  - src:ae438beed2f2#p168.1
  - src:ae438beed2f2#p168.2
  decision: During REFORGER 83, the division airspace-management element retained control of weapons-control-order requests
    for the division, rather than relying on routine higher-echelon changes.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is the tradeoff between preserving strategic lift and ensuring economical, manageable supply provision.
    The report says eliminating the carry-in requirement freed lift, but the lack of standardized unit loads led to inefficient
    want lists and storage; exclude the detailed package and inventory implementation steps.
  span_range:
  - src:ae438beed2f2#p209.1
  - src:ae438beed2f2#p209.4
  decision: USAREUR decides whether deploying units must bring initial Class II self-service supplies or receive locally procured
    supplies in theater; it eliminated the carry-in requirement and chose local procurement.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 10
  focus: The decision concerns how to reconcile wartime release procedures with the peacetime need to track and recover operational
    project stocks. The report cites confusion over the meaning of release, issue, and temporary loan, and recommends full
    accountability; exclude the listed forms, codes, and transaction steps.
  span_range:
  - src:ae438beed2f2#p211.2
  - src:ae438beed2f2#p212.2
  decision: The OPLAN proponent and USAREUR logistics authorities decide whether REFORGER releases of OP 39 stocks should
    follow wartime accountability exemptions or require peacetime accountability; the report recommends revising OP 39 for
    peacetime use and requiring full accountability.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
