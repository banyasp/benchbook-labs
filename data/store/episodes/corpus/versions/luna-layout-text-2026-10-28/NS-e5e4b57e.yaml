- n: 3
  focus: At 8:37, Boston Center reported a hijacked aircraft headed toward New York and asked for fighters. The NEADS commander
    ordered the fighters to battle stations, then sought authorization from the regional commander, who said to scramble them
    and obtain authorities later. Focus on the urgency and authority tradeoff; exclude fighter routing and other tactical
    details.
