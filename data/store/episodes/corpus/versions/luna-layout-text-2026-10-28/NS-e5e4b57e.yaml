- n: 1
  focus: At 9:07, Boston Center requested that Herndon send airborne aircraft a warning; the report says there is no evidence
    Herndon did so. FAA officials viewed notifying aircraft as the airlines’ responsibility, while the Commission judged that
    view inadequate. Focus on the division of responsibility and the choice to warn or not warn; exclude the mechanics of
    sending warnings.
  span_range:
