episodes:
- n: 1
  focus: The analyst’s assessment rested on authentic reports of opposition leaders describing a violent overthrow plan and
    its claimed forces. The stated reason for caution was that the plotters had no chance and knew it; exclude any question
    of operationally acting on the reported plot.
  span_range:
  - src:466cf86bcb96#p1.6
  - src:466cf86bcb96#p2.1
  decision: The Latin America analyst decides whether to assess the Bolivian opposition leaders’ reported coup plans as a
    credible, viable attempt or as unrealistic talk.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The report was authentic, but the analyst had to judge whether its substantive claim was true. The account says available
    information made the claim doubtful, while later evidence established that the Communist leader had exaggerated; exclude
    any operational response to the alleged cabinet members.
  span_range:
  - src:466cf86bcb96#p2.2
  - src:466cf86bcb96#p2.3
  decision: The Latin America analyst decides whether to credit the claim that three members of Venezuela’s new cabinet were
    Communist or assess it as an exaggerated boast.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The report came from a close associate of a known anti-government plotter and described action as imminent, but it
    was inconsistent with other evidence. The analyst judged that the source was stating a hope as if it were a plan; exclude
    how any coup might be carried out or countered.
  span_range:
  - src:466cf86bcb96#p2.4
  - src:466cf86bcb96#p2.5
  decision: The Latin America analyst decides whether to assess the report of an imminent Brazilian coup as a genuine plan
    or as a source’s hope presented as fact.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
