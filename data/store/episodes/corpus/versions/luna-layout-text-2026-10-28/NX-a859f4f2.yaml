  focus: The team performs some classified work but, on a day-to-day basis, uses open-source tools; other teams doing similar
    work were permitted to telework. The supervisor required this team to report to the office, citing distrust that employees
    would stay focused at home and concern about distractions and work quality; exclude broader claims about telework fairness
    across agencies.
  span_range:
