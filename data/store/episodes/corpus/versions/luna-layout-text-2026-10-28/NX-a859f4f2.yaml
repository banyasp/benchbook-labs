- n: 2
  focus: An employee concerned about exposing unvaccinated children asked the supervisor to help remind coworkers about the
    mask policy and safety measures; the supervisor declined to intervene. The supervisor expressed indifference to coworkers’
    noncompliance; exclude the article’s broader advice about organizational justice.
  span_range:
