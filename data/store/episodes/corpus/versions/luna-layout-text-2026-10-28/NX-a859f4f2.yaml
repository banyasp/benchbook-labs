- n: 3
  focus: The warning staff weighed whether to issue a warning against the prevailing view that Iraq would not attack. The
    staff relied on a theory and pathway for invasion preparations, including the detected movement of Republican Guard units
    and a large logistics buildup; exclude operational details beyond those facts as evidence informing the analytic judgment.
  span_range:
  - src:9c4ef13cc1f0#p32.3
  - src:9c4ef13cc1f0#p32.6
  decision: The NIO for Warning and staff decided to warn senior policymakers that an Iraqi military incursion into Kuwait
    was likely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The passage contrasts their assessment with the warning staff’s judgment. It says officials relied on assurances
    from regional leaders and the Soviet Union, along with the prevailing view that Saddam Hussein did not intend to attack;
    exclude the operational details of the buildup except as context for the competing assessment.
  span_range:
  - src:9c4ef13cc1f0#p32.5
  - src:9c4ef13cc1f0#p32.6
  decision: The intelligence and policy officials participating in the 31 July assessment decided that a major Iraqi attack
    was not likely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The passage describes analysts tracking increasingly large and intense demonstrations but not changing their assumption
    until November 1978, when the shah’s position was rapidly weakening. It attributes the persistence of the assumption to
    beliefs about the shah’s record of survival and the armed forces’ loyalty; exclude any broader claim about what analysts
    might have concluded under a different framework.
  span_range:
  - src:9c4ef13cc1f0#p33.3
  - src:9c4ef13cc1f0#p33.4
  decision: Intelligence analysts assessing Iran decided to retain the assumption that opposition would fracture rather than
    revise it as demonstrations grew.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is how analysts assessed the shah’s willingness to use force after he failed to crack down as
    expected in 1977 and 1978. The source says historical evidence of his past willingness to suppress opposition sustained
    the prevailing view; exclude the hypothetical KPAT assessment as an actual policy decision by the shah.
  span_range:
  - src:9c4ef13cc1f0#p34.4
  - src:9c4ef13cc1f0#p34.5
  decision: NFAC analysts decide whether the shah was likely to use decisive force against demonstrators; they retained the
    prevailing judgment that he would eventually suppress the opposition.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether analysts should update their view of opposition unity as demonstrations grew through
    1978. The source says the IC tracked the demonstrations but did not adjust its assumption until November, against a background
    of historical expectations of opposition disunity; exclude the operational conduct of demonstrations.
  span_range:
  - src:9c4ef13cc1f0#p34.5
  - src:9c4ef13cc1f0#p34.6
  decision: The Intelligence Community decides whether to revise its assessment that the opposition would fracture; it continued
    that assumption despite increasingly large and intense demonstrations.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to authorize the operation or leave the leader alive. The review says proposed approaches
    were judged operationally impractical and that senior officers disagreed about the likely consequences; the operation
    was never attempted. Exclude the operational plans and means.
  span_range:
  - src:9c4ef13cc1f0#p76.6
  - src:9c4ef13cc1f0#p77.2
  decision: SOE leadership decides whether to carry out the proposed assassination of the Nazi leader.
