episodes:
- n: 1
  focus: The decision point is whether and how to give the proposed central intelligence agency statutory status while military
    unification legislation was pending. Focus on the choice to keep the provision brief to avoid controversy that could endanger
    the larger bill; exclude the Act’s other provisions and later CIA activities.
  span_range:
  - src:b68f3250cc02#p23.2
  - src:b68f3250cc02#p23.2
  decision: The White House and Congress chose to establish the CIA through a brief, unspecific provision in the National
    Security Act of 1947.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is where to place responsibility for covert action after the Secretary of State rejected it because
    it could undermine diplomatic credibility, and whether to handle it within an existing CIA unit or create a dedicated
    office. Focus on the institutional assignment, reporting lines, and stated rationale; exclude descriptions of operations
    or methods.
  span_range:
  - src:b68f3250cc02#p23.3
  - src:b68f3250cc02#p24.1
  decision: The National Security Council chose to assign covert-action responsibility to the CIA and establish a dedicated
    office for it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to retain the office’s near-autonomous arrangement or place it under the DCI’s control.
    Focus on the stated concerns about its scale, lack of accountability and discipline, and potential harm to CIA’s intelligence
    mission; exclude operational activities.
  span_range:
  - src:b68f3250cc02#p17.3
  - src:b68f3250cc02#p17.3
  decision: The Director of Central Intelligence chose to bring the Office of Policy Coordination under his authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to extend a U.S. defense commitment to Taiwan and Korea or keep them outside the perimeter.
    The passage cites limited resources, the priority assigned to Europe, and military views that Taiwan did not warrant U.S.
    troops; exclude later judgments about whether the statement was ill-timed.
  span_range:
  - src:b68f3250cc02#p38.5
  - src:b68f3250cc02#p39.1
  decision: The Truman administration places Taiwan and Korea outside the U.S. defensive perimeter in its January 1950 policy
    statement.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision arose after the Soviet blockade cut off West Berlin’s land routes and left the city with limited food
    supplies. The passage explicitly describes the airlift as a compromise between retreat and war; exclude the broader sequence
    of Cold War escalation except as context for the choice.
  span_range:
  - src:b68f3250cc02#p33.2
  - src:b68f3250cc02#p33.2
  decision: The Truman administration chooses an airlift to supply West Berlin rather than retreating or going to war.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to make covert operations a permanent and broader instrument of U.S. policy, formalized
    by NSC 10/2. The passage gives the perceived challenge from the Cominform and the aim of preventing Communist parties
    from undermining Marshall Plan success as context; exclude the conduct of individual operations or techniques.
  span_range:
  - src:b68f3250cc02#p31.3
  - src:b68f3250cc02#p32.3
  decision: The National Security Council authorizes a permanent CIA covert-operations branch with an expanded mandate.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: After Chinese forces intervened, the administration faced a choice between escalation against China and a more measured,
    limited war. The passage says senior military advisers feared global war and that their argument prevailed; exclude the
    CIA’s subsequent operational support, which is mentioned separately.
  span_range:
  - src:b68f3250cc02#p43.3
  - src:b68f3250cc02#p43.3
  decision: The Truman administration adopts a limited-war response in Korea rather than the extreme measures urged by the
    military commander in the field.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The account presents the 1947 creation of the Agency as the President’s decision, with avoiding a confrontation as
    an alternative and the need for strategic direction and preparedness as reasons for creating it. Keep the focus on institution-building
    and presidential authority; exclude later operational activities and organizational descriptions.
  span_range:
  - src:b68f3250cc02#p61.3
  - src:b68f3250cc02#p62.3
  decision: The President decides whether to establish a centralized, permanent civilian intelligence agency or avoid taking
    on a greater role in confronting the Soviets.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The Director chose to merge two CIA organizations that competed for agents, networks, and liaison relationships.
    The account gives the rivalry and the resulting benefits of sharing experience and avoiding competition as context and
    reasons; exclude any operational details of their work.
  span_range:
  - src:b68f3250cc02#p58.1
  - src:b68f3250cc02#p58.1
  decision: The Director of Central Intelligence decides whether to merge the Office of Special Operations and the Office
    of Policy Coordination or leave them as separate organizations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The passage describes withholding the records at that time because release could generate headlines and the impression
    of renewed interference in Italian politics. Treat this as a disclosure and oversight decision; exclude details of the
    underlying election activities, which the passage does not provide.
  span_range:
  - src:b68f3250cc02#p66.4
  - src:b68f3250cc02#p66.4
  decision: Officials responsible for declassification decide whether to release records of CIA activity in Italian elections
    before an upcoming Italian election or defer release.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: NIE 25 concluded that the Soviets would not initiate global war even if they thought it advantageous, because they
    had advantageous options short of war. The passage frames this as a shift from earlier, more alarming estimates; exclude
    broader claims about Soviet intentions not tied to this stated assessment.
  span_range:
  - src:b68f3250cc02#p69.3
  - src:b68f3250cc02#p69.3
  decision: National intelligence estimators decide whether to assess that the Soviet Union would initiate global war or could
    pursue its aims short of global war.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The passage says an organization created without congressional participation could not exist for more than a year,
    prompting the lawyers to draft permanent-organization legislation. Keep the scenario to that legal and institutional choice;
    exclude later questions about CIA operations.
  span_range:
  - src:b68f3250cc02#p73.5
  - src:b68f3250cc02#p73.6
  decision: CIG’s General Counsel and Deputy General Counsel decide to draft legislation for a permanent intelligence organization
    rather than let the President-created group expire.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 13
  focus: ORE assessed that withdrawal would probably be followed by invasion and collapse, while the Army dissented that troop
    withdrawal would not be the major factor and other political factors would decide events. Treat this as a dispute over
    an intelligence estimate, not as a decision to withdraw troops or a recommendation about military operations.
  span_range:
  - src:b68f3250cc02#p71.2
  - src:b68f3250cc02#p71.4
  decision: ORE and Army intelligence make competing judgments about whether withdrawing U.S. troops from South Korea would
    lead to invasion and the collapse of the South Korean government.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The passage says details about CIA, including unvouchered funds, were omitted because they would overburden a larger
    national-security bill; the CIA Act of 1949 later supplied the authority. Keep the scenario to the legislative choice
    and its stated rationale, not to methods of conducting clandestine activities or spending funds.
  span_range:
  - src:b68f3250cc02#p75.3
  - src:b68f3250cc02#p75.4
  decision: The drafters of the CIA’s 1947 enabling legislation decide to omit detailed authority for confidential funds from
    that bill and leave the authority for separate legislation.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 15
  focus: The Agency had authority to review 11 significant covert actions, including three from the Truman period, and said
    it would be careful because people had provided help under promises of confidentiality and release could put them at grave
    risk. Keep the scenario to the balance between historical openness and protecting people; exclude operational details
    of the actions themselves.
  span_range:
  - src:b68f3250cc02#p78.4
  - src:b68f3250cc02#p79.1
  decision: CIA’s leadership decides to review selected Cold War covert-action records for possible declassification while
    proceeding cautiously rather than releasing them quickly.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The speaker recommends opening records from the Truman administration under an age-based standard, rather than relying
    on an ongoing political-sensitivity rationale or releasing only isolated documents. The reasons given include the limited
    likelihood that such old material would endanger current sources, methods, operations, or policy, and the historical value
    of access; present this as a recommendation, not an adopted Agency decision.
  span_range:
  - src:b68f3250cc02#p92.4
  - src:b68f3250cc02#p93.2
  decision: Agency declassification officials decide whether to keep Truman-era CIA records classified or open them, including
    entire files.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
