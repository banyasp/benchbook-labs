episodes:
- n: 1
  focus: The decision point is whether the authorities will carry out these responsibilities themselves or involve Red Cross,
    Red Crescent and local Palestinian representatives, and how to arrange timely, respectful burial. The stated reasons include
    international-law obligations, respect for the dead, avoiding rumors, and security conditions. Exclude the technical details
    of locating bodies or neutralizing explosives.
  span_range:
  - src:a148d6be1a2b#p1.5
  - src:a148d6be1a2b#p1.10
  decision: The military authorities, subject to the Military Commander’s judgment, decide how to conduct and oversee the
    location, identification, evacuation and burial of Palestinian bodies in Jenin.
  content_domain: other:humanitarian-law implementation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The Court rejects the petitions after the parties reach an arrangement for recovery, identification and respectful
    burial, with participation by humanitarian and local representatives subject to security and command judgment. Its reasons
    include that the arrangement is acceptable to the parties, advances humanitarian aims and was not shown to endanger soldiers.
    Exclude the separate dispute over how combat was conducted.
  span_range:
  - src:a148d6be1a2b#p1.6
  - src:a148d6be1a2b#p1.12
  decision: The Supreme Court, sitting as the High Court of Justice, decides whether to grant the petitions seeking to halt
    the authorities’ evacuation and burial of bodies in Jenin.
  content_domain: other:judicial adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
