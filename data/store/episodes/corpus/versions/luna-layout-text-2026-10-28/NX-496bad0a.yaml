  focus: The article recommends a new agency after comparing it with keeping OSINT within the current construct and having
    the government act only as a customer of private-sector data. It gives reasons including persistent access, skills, coordination,
    and resourcing problems, and identifies the White House and Congress as necessary actors for requesting and authorizing
    the agency; treat this as a proposed policy choice, not an enacted decision. Exclude operational examples and the agency’s
    proposed routine functions.
