episodes:
- n: 1
  focus: The decision point is whether to respect the electoral outcome and continue the existing diplomatic approach, or
    authorize a secret effort aimed at preventing inauguration. The source cites the President’s concern about communist expansion
    and describes the directive’s scope as broad, while noting that its precise limits were unclear; exclude the operational
    methods used to pursue it.
  span_range:
  - src:712c663fc4a1#p2.5
  - src:712c663fc4a1#p4.2
  decision: The President directed the CIA to pursue a covert effort to prevent the elected president from taking office.
  content_domain: intel-oversight
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The station weighed continuing contact against suspending it after concluding that the retired general lacked military
    support and might trigger a premature, counterproductive action. Keep the focus on the decision to halt or defer support,
    not on the mechanics of coup plotting.
  span_range:
  - src:712c663fc4a1#p7.5
  - src:712c663fc4a1#p8.1
  decision: The CIA station in Santiago decided to stop working with the retired general for the time being and try to deter
    his imminent move.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to keep backing an immediate coup attempt or tell the sole active plotter to delay
    and shift to a longer-term policy. The stated grounds were the low likelihood of success, the risk that failure would
    strengthen the incoming government, and the limited ability of the United States to influence events; exclude subsequent
    operational plotting.
  span_range:
  - src:712c663fc4a1#p11.6
  - src:712c663fc4a1#p12.3
  decision: The senior executive officials overseeing the effort decided to warn the retired general to stand down temporarily
    while developing a policy for dealing with the incoming government.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
