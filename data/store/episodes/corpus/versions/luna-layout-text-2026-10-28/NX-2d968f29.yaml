- n: 2
  focus: 'The decision point is the defense minister’s choice in March 1984 to seek a direct Soviet commitment after Cuba
    proposed substituting helicopters for MiGs. The source gives the competing considerations: helicopters were considered
    more useful against the Contras, while MiGs were valued as a signal of Soviet commitment; exclude aircraft employment
    details.'
  span_range:
