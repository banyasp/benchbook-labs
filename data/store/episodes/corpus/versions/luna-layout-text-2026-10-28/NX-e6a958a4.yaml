  focus: The decision point is the choice to provide covert funding for a cultural conference that officials believed would
    lack credibility if visibly sponsored by the US Government. Include the stated goal of countering Communist influence
    and the concern about overt sponsorship; exclude the conference’s operational arrangements.
  span_range:
  - src:8cee7064de4b#p5.2
  - src:8cee7064de4b#p6.3
  decision: OPC leadership chose covertly to fund the Berlin Congress for Cultural Freedom rather than sponsor it openly or
    leave it unsupported.
  content_domain: other:covert political influence
