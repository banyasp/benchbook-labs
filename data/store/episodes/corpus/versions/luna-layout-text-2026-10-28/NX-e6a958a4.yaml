  natsec: false
- n: 2
  focus: The decision point is whether to retain the visible organizer, whose contribution was credited with the Congress’s
    success, or remove him as a condition of OPC support. Include the tension between his value to the project and the risk
    that his government employment made US backing apparent; exclude the mechanics of his removal.
  span_range:
  - src:8cee7064de4b#p8.4
  - src:8cee7064de4b#p9.5
  decision: The OPC chief decided that the Congress could receive continued support only if its general secretary was removed
