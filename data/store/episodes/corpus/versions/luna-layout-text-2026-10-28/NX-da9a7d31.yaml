  focus: The analytic choice was whether to interpret the station as an ordinary power plant or as a dual-purpose reactor
    whose design and operating modes supported plutonium production. The analysts relied on the reactor and fuel estimates,
    low turbine efficiency, and cooling and water-flow analysis; exclude collection methods and reactor-operating instructions.
