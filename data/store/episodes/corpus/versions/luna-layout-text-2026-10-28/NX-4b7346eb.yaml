- n: 1
  focus: The choice was between proceeding to command a destroyer in Hawaii and serving in London as an observer; the senior
    officers favored the latter because the officer’s tactical and convoy expertise could benefit the service and extend the
    exchange of operational information. The formal attaché assignment and British clearance supplied the stated authority.
    Keep the scenario focused on the decision to authorize and assign the observer mission, not on collection methods or operational
    procedures.
  span_range:
