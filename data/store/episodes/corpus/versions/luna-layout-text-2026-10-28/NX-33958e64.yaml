episodes:
- n: 1
  focus: The decision point is whether to continue rescue efforts from the scene or transport the co-pilot, given the assessment
    that further hoisting could harm other injured crew members. Focus on the command decision and the competing rescue priorities;
    exclude the mechanics of hoisting or aircraft operation.
  span_range:
  - src:24cbc7bce38a#p23.3
  - src:24cbc7bce38a#p23.5
  decision: The lead pilot decided to depart with the injured co-pilot for medical care rather than remain to evacuate the
    other injured crew members.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The crew included members who were non-current for some events, while an instructor was assigned to provide instruction;
    the mission risk was assessed as on the low side of medium and the formation ORM was approved. Treat this as a mission-approval
    decision, and exclude the separate question of how to fly the formation.
  span_range:
  - src:24cbc7bce38a#p28.3
  - src:24cbc7bce38a#p31.5
  decision: Squadron leadership and mission risk approvers decide whether to approve the formation training mission with the
    assigned crew and identified readiness risks.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
