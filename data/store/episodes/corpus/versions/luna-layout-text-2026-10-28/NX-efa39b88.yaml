episodes:
- n: 1
  focus: The document recommends requiring LOGSTAT-based planning and coordinated support even for routine garrison exercises,
    and says commanders must set conditions to prevent units from bypassing that training. The stated reason is that the more
    convenient process deprives units of practice needed for large-scale combat operations; exclude the detailed logistics
    execution steps.
  span_range:
  - src:4eaba6e13de5#p19.5
  - src:4eaba6e13de5#p20.3
  decision: Installation and division commanders decide whether to require tactical sustainment planning for garrison support
    instead of allowing units to use direct commodity accounts and simple movement requests.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: 'The passage describes the tradeoff as a commander''s risk decision: EAB movement can free organic assets for other
    priorities, but may slow maintenance and leave repair-parts movements vulnerable to disruption. Keep the focus on allocation
    and accepted risk, not on movement methods.'
  span_range:
  - src:4eaba6e13de5#p23.3
  - src:4eaba6e13de5#p23.4
  decision: BCT commanders decide whether to use limited organic distribution capacity for Class IX repair parts or request
    EAB transport and preserve organic capacity for supplies more directly tied to combat power, such as Class V.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The passage describes medical personnel and providers being employed in garrison facilities and recommends freeing
    them for periods of tactical training, with brigade-level coordination to balance doctor and medic coverage. The stated
    reason is that rigorous practice is needed for readiness in tactical environments; exclude the specific medical exercise
    procedures.
  span_range:
  - src:4eaba6e13de5#p24.2
  - src:4eaba6e13de5#p24.3
  decision: Brigade, division, and installation commanders decide whether to temporarily release medical personnel from garrison
    duties for tactical training while balancing clinical coverage and readiness.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision arises amid incoming fire, a report of dismounts, and uncertainty about whether subordinate units received
    or understood the security order. Focus on the command choice and the stated coordination condition; exclude any tactical
    details of employing fires.
  span_range:
  - src:4eaba6e13de5#p133.5
  - src:4eaba6e13de5#p134.2
  decision: During an attack on the BSA, the BSB commander decides to order all fighting positions filled and have the S-3
    seek brigade indirect-fire support on reported dismounts, subject to coordination.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 5
  focus: The decision is whether to extend medical support forward with the FLE or keep it elsewhere; the text says most units
    push it forward when logistics and medical lines of communication are extended, while identifying security, resupply,
    and connectivity as considerations. Keep the scenario at the level of the command decision and its competing support and
    risk considerations; exclude tactical security procedures and communications-system details.
  span_range:
  - src:4eaba6e13de5#p150.2
  - src:4eaba6e13de5#p150.5
  decision: The BSB commander and sustainment planners decide whether to push Role 2 medical support and its accompanying
    patient-holding and mortuary-affairs components forward with the FLE.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The passage describes units delaying or obscuring NMC reporting, including to preserve a higher readiness rate, and
    recommends accurate reporting once a mechanic verifies a fault that cannot be fixed immediately. Frame the scenario around
    readiness-reporting integrity and the competing pressure to maintain reported readiness; exclude equipment-repair procedures.
  span_range:
  - src:4eaba6e13de5#p162.5
  - src:4eaba6e13de5#p163.2
  decision: Unit maintenance leaders decide whether and when to record equipment as non-mission capable on the equipment status
    report after a fault is verified and cannot be fixed immediately.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is the stated case of units close to Role 2 with low anticipated casualty numbers, weighed against
    the general responsibility of the higher role to evacuate patients to the next level of care. Exclude the broader evacuation-plan
    and platform-employment guidance.
  span_range:
  - src:4eaba6e13de5#p181.5
  - src:4eaba6e13de5#p181.5
  decision: Units operating in the rear area decide whether to evacuate their own casualties to Role 2 rather than rely on
    the higher role to evacuate them.
  content_domain: operational-command
  refusal_sensitivity: low
