- n: 1
  focus: 'The decision point is how to build the organization’s prewar knowledge base: the report contrasts technical military
    expertise with practical political, cultural, economic, linguistic, and behavioral knowledge. Keep the focus on the choice
    of expertise and its analytic purpose; exclude later operational uses of teams.'
  span_range:
  - src:9ec378720364#p26.3
  - src:9ec378720364#p27.2
  decision: The Coordinator of Information chose to recruit a broad group of roughly 300 experts in European societies and
    cultures, rather than relying primarily on specialists in the German military.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the organizational balance between a small, agile headquarters with delegated authority and
    more centralized direction. The report gives the rationale of agility, limited communications, and trust in commanders’
    local judgment; exclude descriptions of field operations themselves.
  span_range:
  - src:9ec378720364#p35.2
  - src:9ec378720364#p35.2
  decision: The Director of the Office of Strategic Services chose to keep headquarters small and give field commanders substantial
    decision-making autonomy.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether confidential wartime spending should receive the usual detailed accounting or a more
    limited endorsement-and-reimbursement process. The report says the reduced process was adopted to protect OSS security;
    exclude the specific covert activities the funds supported.
  span_range:
  - src:9ec378720364#p45.3
  - src:9ec378720364#p46.2
  decision: Congress authorized Office of Strategic Services special-fund expenditures under reduced accounting and oversight
    requirements rather than ordinary detailed accounting.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the use of direct commissions as an exceptional personnel authority. The passage gives reasons
    including protecting existing COI/OSS personnel from the draft, achieving parity with British counterparts, and employing
    civilian experts for military-government work; exclude the operational duties for which personnel were commissioned.
  span_range:
  - src:9ec378720364#p59.3
  - src:9ec378720364#p60.2
  decision: During World War II, OSS leadership, under authority granted by the JCS, chose whether to directly commission
    selected civilian experts and enlisted personnel rather than use non-uniformed employment or ordinary commissioning routes.
  content_domain: other:personnel-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
