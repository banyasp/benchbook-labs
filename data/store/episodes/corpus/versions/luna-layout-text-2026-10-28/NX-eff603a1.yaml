episodes:
- n: 1
  focus: The decision point is whether to retain an unsalaried consular system in which officers could keep fees, or establish
    salaried officers and centralize fee handling. Focus on corruption, public accountability, and administrative reform;
    exclude the later operational use of identity databases.
  span_range:
  - src:68db1569d3dc#p10.6
  - src:68db1569d3dc#p11.4
  decision: The Secretary of State and Congress chose to professionalize the consular service by providing salaries and requiring
    consular fees to be paid into the Treasury.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to impose federal standards on identification or leave state and local systems decentralized.
    Consider identity-document fraud and the post-9/11 security context alongside popular resistance and the costs of implementation;
    exclude technical details of identity verification.
  span_range:
  - src:68db1569d3dc#p7.3
  - src:68db1569d3dc#p7.6
  decision: The federal government chose to standardize state-issued identification through the REAL ID Act.
  content_domain: other:identity-document policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to add identity-document requirements in response to passport fraud and wartime security
    concerns. Keep the focus on the policy choice and its rationale; exclude any procedural details about producing or checking
    photographs.
  span_range:
  - src:68db1569d3dc#p11.4
  - src:68db1569d3dc#p11.7
  decision: British lawmakers chose to require photographs and physical descriptions on passports after a German spy was apprehended
    using a fraudulent US passport.
  content_domain: other:identity-document policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
