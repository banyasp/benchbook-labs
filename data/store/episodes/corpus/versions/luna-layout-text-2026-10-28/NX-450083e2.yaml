- n: 2
  focus: The CSM chose proactive personnel requests rather than waiting for Human Resources Command to manage the enlisted
    population under the existing process. The stated reasons included preserving personnel availability for training and
    deployment requirements and addressing manning guidance that did not account for regionally aligned deployments; exclude
    the broader discussion of personnel-management systems.
  span_range:
  - src:4beb5d1eaed1#p30.4
  - src:4beb5d1eaed1#p30.7
  decision: The brigade combat team command sergeant major decided to identify Soldiers with more than 26 months on station
    and request permanent changes of station aligned with manning cycles.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is the leader’s response to a specific reported delinquency: immediate correction versus first
    understanding the circumstances. Focus on the reasons to check for miscommunication or financial distress and help resolve
    the problem; exclude general hit-list reporting practices.'
  span_range:
  - src:4beb5d1eaed1#p39.2
  - src:4beb5d1eaed1#p39.2
  decision: A responsible leader decides whether to immediately correct a Soldier’s delinquent government credit-card item
