- n: 1
  focus: They choose to continue answering National’s requests while requiring responses to be cleared with the G2 or a watch
    officer and withholding information about ongoing or future operations. The stated reasons are to meet Washington’s requests
    for on-scene information without undermining operational security or the supported command’s trust; exclude details of
    intelligence collection or communications methods.
  span_range:
  - src:622e002419a1#p3.3
  - src:622e002419a1#p3.4
  decision: The NIST team and Task Force Eagle’s G2 decide how to handle Washington-based national intelligence agencies’
    requests for information from the field.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The choice responds to national intelligence production that had focused on Washington briefings rather than the
    tactical commander’s needs. The passage supports sending the requirements after the G2’s approval; exclude details of
    how intelligence is collected or produced.
  span_range:
  - src:622e002419a1#p3.5
  - src:622e002419a1#p4.1
  decision: The NIST-Tuzla team, with Task Force Eagle’s G2’s approval, decides to send the task force’s essential elements
    of information to national intelligence task forces.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
