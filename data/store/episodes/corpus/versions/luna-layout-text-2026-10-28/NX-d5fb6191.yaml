  focus: In 1930, the Director chose to rein in the office’s domestic focus and steer attachés toward information directly
    relevant to naval duties, rather than continue peripheral assignments. The stated reasons were that such work consumed
    time and energy needed for basic duties and that poorly analyzed information could obscure important signals; exclude
    the operational conduct of any collection activity.
