- n: 1
  focus: The decision followed poor intelligence performance at Nomonhan. The alternatives were to retain direct operational
    control by the Intelligence Section or centralize control under the new Kwantung Army Intelligence Group, allowing the
    Intelligence Section to focus on evaluation and estimates. Keep the scenario on organizational authority and oversight;
    exclude the agencies’ collection methods and operational activities.
  span_range:
  - src:6fd76364ff59#p3.1
  - src:6fd76364ff59#p3.3
  decision: The Kwantung Army reorganized intelligence by separating policy and planning from operations and placing the Army
    Special Services Agencies under an intermediate headquarters.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The General Staff assessed that the conflict would be long and chose a cautious posture rather than immediate action.
    Keep the scenario to this strategic command decision and its stated reasoning; exclude subsequent intelligence collection
    and force-reinforcement details.
  span_range:
  - src:6fd76364ff59#p9.3
  - src:6fd76364ff59#p9.3
  decision: After Germany attacked the Soviet Union, the Kwantung Army General Staff chose to watch and wait while tightening
    security measures against the Soviet Union.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The specific judgment was whether a two-hour interruption in Soviet Far Eastern communications warranted an alert.
    The Section treated the blackout as potentially significant; later information attributed it to propagation conditions
    and the alert was lifted. Keep the scenario to warning, uncertainty, and the decision threshold; exclude technical collection
    details.
  span_range:
  - src:6fd76364ff59#p12.1
  - src:6fd76364ff59#p12.1
  decision: The Kwantung Army Intelligence Section alerted relevant commanders and reported to Tokyo after a communications
    blackout raised concern about a possible Soviet move.
