- n: 1
  focus: The task force considered whether to release the imagery or keep it classified, and recommended full release to a
    public repository because the systems were obsolete and release posed no national-security threat. Keep this to the task
    force’s recommendation; do not conflate it with the President’s later authorization.
  span_range:
  - src:bea7281be5d8#p2.2
  - src:bea7281be5d8#p2.3
  decision: The Classification Review Task Force recommends whether to release imagery from the KH 1–6 satellite systems.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The President had to decide whether to declassify the imagery; legal advice in the passage says only the President
    could make that decision. The executive order authorized release and transfer to public repositories, while excluding
    intelligence reports derived from the imagery and other mission-related data; exclude operational collection details.
  span_range:
  - src:bea7281be5d8#p2.4
  - src:bea7281be5d8#p3.3
  decision: The President decides whether to declassify CORONA, ARGON, and LANYARD imagery and authorize its public release.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: After review, the Acting Director approved the volume for declassification and publication, balancing the Agency’s
    openness efforts against its continuing need to protect sources and methods. Treat this as a decision about the book’s
    text and redacted documents, not as authorization to release other intelligence products.
  span_range:
  - src:bea7281be5d8#p8.2
  - src:bea7281be5d8#p8.3
  decision: The Acting Director of Central Intelligence decides whether to approve declassification and publication of the
    CORONA document volume.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
