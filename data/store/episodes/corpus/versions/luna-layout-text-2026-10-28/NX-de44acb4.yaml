- n: 1
  focus: The decision point is whether to bring the military and civilian relief resources together to meet the enormous demand
    for assistance; the ambassador chose to do so and organized recurring coordination meetings. Keep the focus on the decision
    to coordinate the response and its rationale, not on the operational details of the relief effort.
  span_range:
  - src:5d2516d2e7f0#p25.2
  - src:5d2516d2e7f0#p25.3
  decision: The U.S. ambassador in Pakistan chose to coordinate military and civilian disaster-relief resources after the
    2005 earthquake.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is military assistance versus leaving the response to law enforcement and other civil authorities
    alone. The report gives the reason—narco-trafficking and related violence exceeded those authorities’ capacity—and describes
    the intended transition back to their traditional roles; exclude operational details of eradication, interdiction, or
    prosecution.
  span_range:
  - src:5d2516d2e7f0#p42.2
  - src:5d2516d2e7f0#p42.2
  decision: The Mexican federal government, under the President, chose to involve the armed forces in assisting with the counter-narcotics
    threat while civil authorities rebuilt their capacity.
  content_domain: other:military support to civil authorities
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is creating a unified border agency rather than retaining the prior allocation of immigration,
    customs, and agricultural responsibilities across departments. The report’s stated reason is that the fragmented arrangement
    was insufficient and a more efficient, effective organizational structure was needed; exclude later operational border-management
    practices.
  span_range:
  - src:5d2516d2e7f0#p51.3
  - src:5d2516d2e7f0#p51.3
  decision: The U.S. government chose to create Customs and Border Protection under the Department of Homeland Security to
    unify border functions previously divided among departments.
  content_domain: other:border governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
