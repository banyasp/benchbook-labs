episodes:
- n: 1
  focus: The President could identify a cause if it met the clear-and-convincing-evidence standard, or decline to assign a
    cause while identifying supported contributing factors. The report cites limited evidence and describes several interacting
    factors; exclude the pilot’s in-flight control choices and technical recovery procedures.
  span_range:
  - src:057c45c54272#p2.6
  - src:057c45c54272#p2.7
  decision: The AIB President decides whether the available evidence supports identifying a mishap cause or warrants findings
    limited to contributing factors.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: After maintenance and operations personnel determined that only one of the two aircraft would be available, the acting
    Operations Supervisor and pilot agreed on the alternate mission and a plan to share airspace. Assess this as a mission-planning
    and command choice; exclude the specific maneuvers, flight-control inputs, and other piloting techniques.
  span_range:
  - src:057c45c54272#p11.8
  - src:057c45c54272#p12.1
  decision: The acting Operations Supervisor and mishap pilot decide to replace the planned two-aircraft ACT test mission
    with an alternate single-ship AHC sortie.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the approval of the single-ship AHC profile after maintenance availability changed the plan,
    including the decision to proceed under the existing GREEN risk level. The report says supervisors accepted the risk because
    AHC training in demanding regimes was important to proficiency and the risk could not be fully mitigated. Exclude the
    pilot’s maneuver choices and spin-recovery actions; those are operational technique, not the command decision at issue.
  span_range:
  - src:057c45c54272#p34.3
  - src:057c45c54272#p41.2
  decision: The qualified operations supervisor and mission leaders decide whether to proceed with the changed single-ship
    AHC mission despite its operational risks.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
