- n: 2
  focus: The court considered whether treaty provisions or customary international law required POW treatment rather than
    domestic criminal jurisdiction. It found the Protocol not binding and the customary-law argument premature, but considered
    the legal developments relevant to sentence; exclude the separate choice of sentence itself.
  span_range:
  - src:6a6c7ba7d13e#p1.4
  - src:6a6c7ba7d13e#p1.5
  decision: The trial judge decided not to declare the accused prisoners of war, while taking developments in international
    humanitarian law into account at sentencing.
  content_domain: other:criminal-adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The judge weighed the possibility of deterrence and community interests against the accused’s youth, lack of prior
    convictions, political context, limited control over events, and the danger their actions posed to civilians. The decision
    resulted in nine years for accused 1 and 2 and eleven years for accused 3, without suspension; exclude operational details
    of the acts except as sentencing context.
  span_range:
  - src:6a6c7ba7d13e#p1.5
  - src:6a6c7ba7d13e#p1.7
  decision: The trial judge decided not to impose the death penalty and instead sentenced the accused to long terms of imprisonment,
    with no part suspended.
  content_domain: other:criminal-sentencing
