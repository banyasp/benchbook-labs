- n: 1
  focus: The decision point is whether to allow the defence to present this evidence; the judge allowed it and later accepted
    that the events probably affected the accused’s state of mind. Keep the focus on this evidentiary ruling and its relevance,
    not the ultimate sentence.
  span_range:
