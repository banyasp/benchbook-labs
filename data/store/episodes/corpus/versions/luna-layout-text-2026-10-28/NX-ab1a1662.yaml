- n: 1
  focus: The decision point is whether the military should take the lead in restoring public order or leave the response under
    civilian police leadership. The account cites presidential authorization and constitutional authority, and states the
    goals of reducing urban violence and reestablishing government authority; exclude the described patrols, sweeps, and attacks
    as operational actions.
  span_range:
  - src:a5d2adf4d898#p9.3
  - src:a5d2adf4d898#p10.1
  decision: The President authorizes the armed forces to lead Operation Rio, with operational control over federal and state
    police.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The state governor could accept or refuse an offer of federal police support and possible Army assistance. The account
    gives both the state’s public-security autonomy and concern that accepting help would imply the crisis could not be resolved
    without federal intervention as relevant context; exclude details about the attacks themselves.
  span_range:
  - src:a5d2adf4d898#p15.2
  - src:a5d2adf4d898#p16.2
  decision: The São Paulo state governor refuses federal security assistance offered during the May 2006 crisis.
  content_domain: other:federalism-and-public-security
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether the regulator may shut down service in response to state security authorities’ request,
    given the disruption to law-abiding customers and the stated legal-order requirement. Keep the focus on authority and
    competing public interests, not on the technical means of disrupting communications.
  span_range:
  - src:a5d2adf4d898#p31.2
  - src:a5d2adf4d898#p31.3
  decision: The national telecommunications regulator declines to shut down cell towers used by criminals without the required
    company acquiescence or a high-court order.
  content_domain: other:telecommunications-regulation
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision arose from the governor’s request for 4,000 Army troops to support public security. The President declined
    that request and ordered a deployment of the National Force; the passage’s account of the constitutional last-resort threshold
    and the governor’s failure to acknowledge that state law-enforcement agencies could not maintain order helps explain the
    choice. Exclude operational deployment methods.
  span_range:
  - src:a5d2adf4d898#p39.3
  - src:a5d2adf4d898#p42.2
  decision: The President of Brazil decides whether to authorize the governor’s request for Army troops or use the Public
    Security National Force instead.
