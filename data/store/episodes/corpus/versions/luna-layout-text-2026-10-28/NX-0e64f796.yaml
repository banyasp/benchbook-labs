- n: 2
  focus: The decision point is the Board president’s causal finding under a preponderance-of-the-evidence standard. The report
    explains that the opening could admit a parachute but not a person, and that the practice exposed the jumper to the hazard
    while he was donning his rucksack; exclude the separate question of how the ripcord was inadvertently pulled.
