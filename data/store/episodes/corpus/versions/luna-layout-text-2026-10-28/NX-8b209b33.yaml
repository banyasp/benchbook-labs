episodes:
- n: 1
  focus: The decision point is whether to proceed with a deception that could compromise an aid to navigation or call it off;
    the commandant’s concern about the importance of navigation aids is the stated reason. Exclude the proposed construction
    and the alternative smoke-screen procedure, which are operational methods.
  span_range:
  - src:f24af6271405#p3.5
  - src:f24af6271405#p4.1
  decision: The defense commander decides to abandon the proposed false lighthouse after consulting the naval district commandant.
  content_domain: other:operational-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: At 0200 on D day, the commander must choose whether to hold the current positions or withdraw after learning the
    invader’s strength and fearing the force would be in a precarious position by morning. Focus on the command judgment and
    its stated rationale, not on the later counterattacks or their execution.
  span_range:
  - src:f24af6271405#p7.3
  - src:f24af6271405#p7.3
  decision: The defense commander orders an overall withdrawal to the second position before daylight.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
