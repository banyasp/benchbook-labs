  focus: The decision point is the estimate’s choice between a defensive-buildup judgment and the alternative that the Soviets
    would establish a strategic offensive presence in Cuba. The estimate favored the defensive interpretation because it saw
    political benefits in protecting the Cuban regime and believed an offensive base could provoke US intervention; it also
    relied on prior Soviet practice. Exclude later general recommendations about analytic methods.
