  focus: 'The decision point is how to prioritize the reviewed observations: elevate cross-force issues for senior attention
    and action plans, or leave issues to lower-level resolution. The source gives the distinction used—whether an issue applied
    across the KSF or could be resolved mainly at brigade or battalion level; do not turn this into a scenario about operational
    methods.'
