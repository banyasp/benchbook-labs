- n: 2
  focus: The decision point is whether to build on the functioning KSF process or replace it with a different approach. The
    stated reasons were that the process was already in place and functioning, and the goal was to improve its ability to
    identify and resolve capability issues under the Commander’s guidance; exclude operational collection techniques.
