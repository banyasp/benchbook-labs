episodes:
- n: 1
  focus: The decision point is whether to undertake a capability study of a system known to have been designed for air defense,
    despite serious reservations among analysts. Focus on the intelligence-analysis choice and its rationale; exclude the
    study’s technical assumptions and findings as operational guidance.
  span_range:
  - src:2e277b2b24e4#p7.3
  - src:2e277b2b24e4#p8.2
  decision: The CIA Office of Scientific Intelligence decided to investigate whether the SA-2 could have a limited ABM role,
    rather than dismissing the possibility.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the Agency’s estimative judgment about whether Soviet leaders would pursue SAM upgrading for
    ABM defense. Focus on the stated likelihood assessment and the strategic, treaty, and institutional considerations behind
    it; exclude technical details of upgrading.
  span_range:
  - src:2e277b2b24e4#p13.4
  - src:2e277b2b24e4#p14.3
  decision: The CIA decided to assess a Soviet SAM-upgrade program as unlikely, rather than likely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is how to address the risk of SAM upgrading in arms-control terms: initial proposals included
    on-site inspection and detailed ancillary constraints, but most fell away during negotiations. Focus on the negotiated
    prohibition and the choice to rely on the prospect of detecting tests; exclude technical methods of detecting or modifying
    systems.'
  span_range:
  - src:2e277b2b24e4#p15.3
  - src:2e277b2b24e4#p16.1
  decision: U.S. arms-control negotiators decided to retain a treaty prohibition on giving non-ABM systems ABM capability
    or testing them in an ABM mode, while dropping most proposed additional verification provisions.
  content_domain: other:arms-control policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
