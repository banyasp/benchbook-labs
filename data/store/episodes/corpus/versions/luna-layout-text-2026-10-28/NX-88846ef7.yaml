- n: 2
  focus: The decision point is whether to approve the shift or maintain the existing deployment, with the President’s stated
    expectation about Lebanese control of the airport as the reason. Exclude any operational details beyond the high-level
    command decision.
  span_range:
  - src:5cc0a7fb531d#p1.4
  - src:5cc0a7fb531d#p1.4
  decision: The President approved shifting some military personnel in Beirut south while expecting Lebanese forces to take
    over the airport.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to prepare for a possible retaliatory response or refrain from doing so after the French
    bombing; the President also asked that intelligence efforts continue to try to prevent another attack. Focus on the conditional
    force-readiness policy and its stated rationale, not on cataloguing targets or other operational planning.
  span_range:
  - src:5cc0a7fb531d#p3.3
  - src:5cc0a7fb531d#p3.3
  decision: The President agreed to prepare for immediate retaliation if U.S. forces were attacked again in Lebanon.
  content_domain: use-of-force-policy
