  natsec: true
- n: 2
  focus: The decision point is whether to take effective measures against the armed group, including disbanding it, or leave
    it in place while promising a narrower clampdown. The document cites domestic political constraints on disbandment and
    Norway’s claim that the group would act against Poland; exclude the reported covert funding channels.
  span_range:
  - src:370316552181#p1.4
  - src:370316552181#p1.11
  decision: The Norwegian government chooses to promise a limited clampdown on anti-Danish activity but not to disband the
    insurgent army.
  content_domain: use-of-force-policy
