  focus: The decision point is whether to rely on diplomacy alone or prepare militarily while seeking a diplomatic settlement.
    The document says preparations were intended for the event diplomacy failed, and that placing units on alert would signal
    Denmark’s displeasure; exclude details of armament production and procurement as implementation rather than the policy
    choice.
  span_range:
  - src:370316552181#p1.6
  - src:370316552181#p1.9
  decision: The Danish government chooses to pursue diplomacy with Norway while mobilizing and accelerating military preparations.
  content_domain: use-of-force-policy
