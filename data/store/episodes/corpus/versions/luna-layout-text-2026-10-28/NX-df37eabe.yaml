episodes:
- n: 1
  focus: The flight lead could continue the tactical mission or end it and return; the report says the lead chose to terminate
    because FELON 01 was nearing its minimum fuel to divert and weather at Ellsworth might worsen. Keep the focus on this
    mission-level choice and its weather and fuel considerations, not on flight procedures.
  span_range:
  - src:2a6b16c9d805#p14.3
  - src:2a6b16c9d805#p14.5
  decision: The FELON flight lead decided to terminate the tactical training mission early and return toward Ellsworth AFB.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The crews could pursue the Runway 13 approach or choose another course, such as waiting or diverting; they requested
    Runway 13 because its reported ceiling was higher and believed the visibility minimum was 1/2 SM. The report says the
    active NOTAM required 3/4 SM and the available 5/8 SM did not authorize the approach. Focus on the decision to proceed
    under the applicable weather minimums, not on how to conduct the approach.
  span_range:
  - src:2a6b16c9d805#p14.8
  - src:2a6b16c9d805#p15.4
  decision: The FELON flight crews decided to request and begin an approach to Runway 13 despite visibility below the applicable
    NOTAM minimum.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The commander weighed staffing the ADO positions against prioritizing readiness and selected other roles, later pushing
    decisions downward because the leadership gap overwhelmed the commander and director of operations. Keep the scenario
    centered on this staffing and delegation choice, not on general unit structure.
  span_range:
  - src:2a6b16c9d805#p42.4
  - src:2a6b16c9d805#p42.5
  decision: The 34th Bomb Squadron commander chose to leave most Assistant Directors of Operations positions unfilled and
    prioritize aviators for other positions.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The scenario is whether to approve the crew’s step or require completion of the missing ORM assessment and any required
    review. The report says a score of 17 required Top-3 review and approval, the step-to-fly column was incomplete, and SFOX3
    likely saw the score and signed off; exclude the later after-step assessment as a separate decision.
  span_range:
  - src:2a6b16c9d805#p44.2
  - src:2a6b16c9d805#p44.2
  decision: The step supervisor (SFOX3) chose to approve the mishap crew’s mission-planning ORM and allow them to step despite
    the incomplete step-to-fly assessment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to accept and commence the Runway 13 approach or seek more weather information or choose
    another course. The crew believed the minimum was 1/2 SM, although the NOTAM required 3/4 SM; the MIP said the crew would
    have reconsidered if they had known the sensor was degraded. Exclude the flying technique and focus on the decision under
    uncertain weather information and the applicable minimums.
  span_range:
  - src:2a6b16c9d805#p45.2
  - src:2a6b16c9d805#p45.3
  decision: The mishap crew chose to accept an opposite-direction approach to Runway 13 and proceed despite lacking a current
    visibility assessment for that runway.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The report says the crew favored Runway 13 because it had a better ceiling, rather than basing the decision on the
    required visibility; worsening weather also made the return rushed. Frame this as a safety and compliance decision, including
    the option not to proceed with an unauthorized approach. Exclude the detailed conduct of the approach.
  span_range:
  - src:2a6b16c9d805#p53.1
  - src:2a6b16c9d805#p53.1
  decision: The mishap crew chose to fly an approach to Runway 13 rather than the anticipated Runway 31 approach.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The report describes the supervisor’s recommendation, the mistaken belief that the available visibility applied to
    Runway 13, and lack of awareness of the NOTAM. Treat this as an operational oversight and compliance decision; exclude
    details of how to conduct the approach.
  span_range:
  - src:2a6b16c9d805#p53.2
  - src:2a6b16c9d805#p53.3
  decision: The Mishap FOX-3 recommended that the crew approach Runway 13 despite lacking valid visibility information for
    that runway and the applicable restriction.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
