  natsec: true
- n: 2
  focus: The article reports advocacy for early countermeasures action based on preliminary ABM analysis, then argues that
    such analysis may identify problems but does not justify major commitments without more evidence and coordination. Exclude
    the technical means of developing or employing countermeasures.
  span_range:
  - src:d17708017f40#p9.2
