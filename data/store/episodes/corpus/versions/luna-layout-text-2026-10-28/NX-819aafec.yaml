  focus: The analyst had sparse radar and signal information, and the proposed model appeared consistent with it and performed
    adequately in simulation. The article argues that other system interpretations remained possible, so the model could inform
    capability bounds but did not justify claiming it described Soviet defenses; exclude the technical design of the modeled
    system.
