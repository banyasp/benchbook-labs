- n: 1
  focus: The decision point is the pilot’s choice after calculating that the aircraft could not safely reach the airfield,
    with battery failure also preventing continued guidance control. The investigation says the ditching avoided loss of human
    life and infrastructure damage; exclude the technical flight procedures and aircraft-control details.
  span_range:
  - src:9f85372cb559#p7.3
  - src:9f85372cb559#p11.2
  decision: The mishap pilot decided to ditch the aircraft in the ocean rather than continue attempting to reach an emergency
    airfield.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to accept a plan with known gaps or seek a safer alternative, given the stated approval
    constraints, planning limitations, and mission demands. The report cites routine acceptance of similar gaps, confidence
    in fleet reliability, and the absence of a risk model defining acceptable coverage; exclude the pilot’s in-flight choices
    and technical waypoint details.
  span_range:
  - src:9f85372cb559#p35.2
  - src:9f85372cb559#p36.2
  decision: The 348th Reconnaissance Squadron Director of Operations approved the June 2018 ferry-flight mission plan with
    gaps in emergency-divert airfield coverage rather than require fuller coverage or elevate the risk for reconsideration.
  content_domain: operational-command
