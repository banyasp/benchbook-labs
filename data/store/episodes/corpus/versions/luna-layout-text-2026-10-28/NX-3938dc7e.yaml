  focus: The decision point is whether to continue trying to recover the aircraft or, once recovery is judged impossible,
    follow the Director’s direction to deliberately lose it. The stated reason is that the aircraft could not return to the
    airbase; the report gives no further rationale or discussion of alternatives. Exclude the aircraft-control method used
    to carry out the direction.
