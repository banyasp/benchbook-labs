  focus: The decision point is whether to pursue fact-finding on such allegations or leave them uninvestigated, in light of
    prior missions’ findings of continued and intensifying chemical-weapons use. The resolution states that investigations
    should ascertain the facts; exclude any operational methods for conducting them.
