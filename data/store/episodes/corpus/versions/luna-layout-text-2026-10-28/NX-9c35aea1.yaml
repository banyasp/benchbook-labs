  focus: The decision point is whether to strengthen central coordination and establish a dedicated deputy role, rather than
    leave coordination arrangements unchanged. The stated reasons are to increase integration, reduce duplication, improve
    coordination, and strengthen the national intelligence effort; exclude operational intelligence methods and the later
    implementation of the role.
