episodes:
- n: 1
  focus: The decision point is the commander’s choice between an enemy-centric approach and prioritizing the Afghan population,
    including the stated reasons for changing course. Exclude operational methods for carrying out either approach.
  span_range:
  - src:3acd31594af8#p15.4
  - src:3acd31594af8#p16.3
  decision: The ISAF commander chose to shift the coalition toward a population-centric counterinsurgency approach.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to establish a flag-officer-level SOF command or leave the existing command arrangement
    in place. The source says senior meetings required flag rank and the existing commander was stretched between command
    and higher-level planning; exclude any operational procedures.
  span_range:
  - src:3acd31594af8#p17.3
  - src:3acd31594af8#p18.2
  decision: The USSOCOM commander pressed for, and the ISAF commander approved, a flag-officer-level SOF command in Afghanistan.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the choice of a dedicated, flexible SOF headquarters after consolidating in-country SOF under
    one commander. The source gives the rationale of avoiding an added coordination burden on the theater headquarters and
    enabling forces to be organized around a problem; exclude details of how missions are conducted.
  span_range:
  - src:3acd31594af8#p19.3
  - src:3acd31594af8#p20.1
  decision: USSOCOM chose to develop a special operations joint task force structure to coordinate in-country SOF rather than
    leave that burden with the four-star theater headquarters.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to keep relying on CJSOTF colonels to command combat forces while also representing
    SOF at higher headquarters, or create a senior headquarters to take on that coordination role. The source gives reasons
    including the colonels’ divided attention, rank restrictions on access to key meetings, and the need for continuity and
    alignment with campaign planning; exclude the operational details of SOF missions.
  span_range:
  - src:3acd31594af8#p34.2
  - src:3acd31594af8#p35.2
  decision: SOF leadership established the CFSOCC-A as a senior headquarters in Kabul and linked it to ISAF/USFOR-A command.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to establish a local armed force, and whether to make it an official government police
    entity rather than leave it as a militia outside central control. The stated conditions, temporary defensive role, and
    screening and oversight arrangements are relevant; exclude details of recruiting or employing the force operationally.
  span_range:
  - src:3acd31594af8#p52.3
  - src:3acd31594af8#p52.4
  decision: The President of Afghanistan accepted the Afghan Local Police program subject to naming it police and subordinating
    it to the Ministry of Interior.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to maintain the presence in Mushan or relocate. The passage says the area was too dangerous
    and residents were not ready for VSO/ALP; exclude later site-development details.
  span_range:
  - src:3acd31594af8#p68.3
  - src:3acd31594af8#p69.3
  decision: The village-stability team commander chose to relocate from Mushan to the Panjwai District Center and explore
    opportunities in more stable villages to the east.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether mission interests justified continuing religious messaging when the command staff had
    discouraged it. The source cites the hostage crisis, consultation with local interlocutors, and subsequent local support;
    exclude the wording and mechanics of the broadcast.
  span_range:
  - src:3acd31594af8#p64.4
  - src:3acd31594af8#p65.4
  decision: The VSP team commander chose to continue using religious discussion in local messaging despite staff discouragement.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to continue expanding ALP development across other areas or pause expansion to address
    the northern provinces first. The stated considerations were residents’ access to training and equipment and concerns
    about ethnic tensions or Taliban encroachment; exclude general ALP program history.
  span_range:
  - src:3acd31594af8#p86.4
  - src:3acd31594af8#p87.2
  decision: The Afghan Ministry of Interior withheld approval for further ALP expansion elsewhere until Parwan and Panshir
    forces were trained and equipped.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to preserve separate command relationships or place these forces under the theater
    commander, amid resistance from some organizations. Focus on the authority change and the stated rationale of unity of
    command and reducing friction between headquarters; exclude operational methods.
  span_range:
  - src:3acd31594af8#p113.5
  - src:3acd31594af8#p114.3
  decision: The Secretary of Defense directs operational control of the Marines and special operations forces to the theater
    commander.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to unify the SOF components under a dedicated commander or retain separate command
    structures. Consider the stated aims of providing one SOF voice, synchronizing missions, and allocating resources; exclude
    details of mission execution.
  span_range:
  - src:3acd31594af8#p115.3
  - src:3acd31594af8#p116.6
  decision: USSOCOM leadership directs establishment of the SOJTF-A under one commander for the in-country SOF components.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to create coordination structures to address the gap between top-down resourcing and
    village-level operations. Focus on the stated need to link governance and development efforts across levels; exclude details
    of field activities.
  span_range:
  - src:3acd31594af8#p102.3
  - src:3acd31594af8#p102.4
  decision: The CFSOCC-A commander establishes Village Stability Coordination Centers and District Augmentation Teams to connect
    village-level efforts with district, provincial, and national leadership.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 12
  focus: In fall 2010, the theater commander supported adding conventional forces under SOF leadership and requested Secretary
    of Defense approval. The stated rationale was that VSO/ALP exceeded SOF capacity; exclude details about how the teams
    were organized or operated.
  span_range:
  - src:3acd31594af8#p131.3
  - src:3acd31594af8#p131.4
  decision: The Afghanistan theater commander chose to seek approval to deploy a conventional infantry battalion to support
    VSO/ALP rather than rely on SOF alone.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
