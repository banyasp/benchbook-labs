- n: 2
  focus: The decision point is whether to end OSS as a wartime agency or continue it after its stated mission was complete.
    The catalogue gives the shutdown and a contemporaneous rationale that OSS had no mandate beyond defeating the wartime
    enemies; do not expand this into a broader history of successor agencies.
  span_range:
  - src:0869e77c57e1#p25.3
  - src:0869e77c57e1#p25.5
  decision: The President chose to shut down the Office of Strategic Services after the war.
