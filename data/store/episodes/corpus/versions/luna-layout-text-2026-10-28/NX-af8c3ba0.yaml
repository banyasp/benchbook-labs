  focus: The decision point is whether to retain the divided intelligence arrangements or establish a centralized organization;
    the catalogue links the failure to coordinate before Pearl Harbor with the need for a new agency. Keep the focus on organizational
    authority and rationale, not on the OSS activities later carried out.
  span_range:
