episodes:
- n: 1
  focus: The decision point is whether estimates should address adversary intentions despite the service-intelligence doctrine
    against doing so. The stated reason was that an estimate of the Soviet military stance would be incomplete without the
    best assessment of how the USSR was likely to use its forces; exclude the operational details of any possible conflict.
  span_range:
  - src:27305ebed197#p1.6
  - src:27305ebed197#p2.3
  decision: The CIA Director directed national estimators to include judgments about likely Soviet intentions in National
    Intelligence Estimates rather than confining them to military capabilities.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to commission the work outside the Agency, using unclassified public material, rather
    than forgo the study or conduct it within the Agency. The purpose was to inform estimates of Kremlin intentions by examining
    what Soviet leaders might know about U.S. capabilities and policy; exclude the report’s military and weapons details.
  span_range:
  - src:27305ebed197#p3.2
  - src:27305ebed197#p4.2
  decision: The CIA Projects Review Committee approved funding for an outside study of how the Soviets might estimate U.S.
    military capabilities and intentions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to impose a new government-wide protective framework rather than leave existing arrangements
    unchanged. The source describes the aim as protecting information with national-security sensitivity, especially operational
    military matters, and notes the President’s stated concern about public disclosure; distinguish that stated rationale
    from the essay’s account of the order’s context and press controversy.
  span_range:
  - src:27305ebed197#p8.2
  - src:27305ebed197#p9.4
  decision: The President issued Executive Order 10290 to provide special protection for classified security information across
    government.
  content_domain: other:security-classification
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to keep the completed report within the Agency or circulate it to the senior intelligence
    representatives. The stated purpose was to help them recognize how much could be learned about U.S. military strengths
    from public information; exclude the report’s sensitive factual inventory and any operational implications.
  span_range:
  - src:27305ebed197#p10.8
  - src:27305ebed197#p11.2
  decision: The CIA Director authorized distribution of one copy of the Yale Report to each Intelligence Advisory Committee
    principal.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
