episodes:
- n: 1
  focus: This is the legislative choice about how to strengthen the DNI’s budget authority while retaining existing departmental
    structures. The passage cites political opposition to a separate appropriation and moving agencies out of DOD; exclude
    the broader description of budget authorities not tied to this choice.
  span_range:
  - src:b64cf079e5c3#p4.4
  - src:b64cf079e5c3#p5.3
  decision: The IRTPA drafters chose to have OMB apportion intelligence funds at the DNI’s exclusive direction rather than
    create a separate intelligence appropriation or a Department of Intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision addressed how DHS could support departmental intelligence missions, including domestic violent extremism
    analysis, when the legal view described in the passage barred NIP funding absent a foreign nexus. Exclude operational
    details of collection or analysis and focus on the funding structure and authority question.
  span_range:
  - src:b64cf079e5c3#p7.3
  - src:b64cf079e5c3#p7.6
  decision: The DHS undersecretary for intelligence and analysis chose to create the Homeland Security Intelligence Program
    with non-NIP funding for specified departmental intelligence work.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The passage describes a proposed restriction that would have shut down open-source collection supporting domestic
    violent extremism and other departmental missions, followed by a modification supported by I&A and the FBI. Focus on the
    legislative choice and safeguards; exclude any collection methods or operational details.
  span_range:
  - src:b64cf079e5c3#p7.3
  - src:b64cf079e5c3#p7.4
  decision: Congress chose to modify a proposed restriction on I&A collection involving US persons absent a foreign nexus,
    allowing such collection with additional safeguards.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
