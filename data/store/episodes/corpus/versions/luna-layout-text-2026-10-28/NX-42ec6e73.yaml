- n: 2
  focus: Treat this as a command-level safety decision about continuing with a suspected malfunction and not disengaging the
    SYD. The report attributes the crew’s failure to act to incomplete diagnosis, limited training, and the appearance that
    the SYD was functioning; exclude the detailed aircraft-control procedure.
  span_range:
  - src:70a2589d5d3a#p57.2
  - src:70a2589d5d3a#p60.5
  decision: The mishap crew decides whether to leave the SYD engaged while continuing the flight despite suspected lateral-control
    problems, rather than disengaging it under the rudder-hunting procedure.
