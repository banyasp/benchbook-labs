episodes:
- n: 1
  focus: The planners judged that the existing process would stabilize the transfer and help production continue without interruption,
    while noting that the governing manual would need a later update. Keep the decision focused on continuity of production
    policy, not on the technical details of intelligence production or tasking.
  span_range:
  - src:b9edb294431f#p1.326
  - src:b9edb294431f#p1.327
  decision: DIA transfer planners decide whether to retain the existing scheduled intelligence-production process during AFMIC’s
    transfer or make major changes immediately; they retain it for the transition.
  content_domain: other:administrative policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The plan cites prohibitive transportation costs and increased security risks if DIA assumes the service, and directs
    continuation of Fort Detrick support. Extract the administrative decision and its stated rationale, not procedures for
    handling or destroying classified material.
  span_range:
  - src:b9edb294431f#p1.255
  - src:b9edb294431f#p1.257
  decision: DIA and AFMIC transfer officials decide whether classified-waste destruction should remain a Fort Detrick base
    service or be assumed by DIA; they choose to continue the base service.
  content_domain: other:administrative policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The plan says the existing process should remain largely unchanged for now, with the catalog and scheduling process
    supporting continuity; it also calls for adjustments so DIA remains informed while MSIC maintains consumer relationships.
    Treat this as a transition policy decision, and exclude the detailed tasking procedures themselves.
  span_range:
  - src:b9edb294431f#p1.779
  - src:b9edb294431f#p1.781
  decision: DIA/MSIC transfer planners decide whether to retain the existing scheduled intelligence-production process during
    the transfer or make major changes.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The plan recommends not disturbing the operational baseline and retaining DAMI/AIA support until DIA can provide
    the services; the Army disagrees and favors DIA assuming hardware support on 1 January 1992. The stated rationale is the
    functioning infrastructure and avoiding disruption; exclude the technical details of network configuration and connection.
  span_range:
  - src:b9edb294431f#p1.805
  - src:b9edb294431f#p1.807
  decision: DIA transition planners decide when DIA should assume hardware-support responsibility for MSIC’s information systems
    and whether existing external support should continue in the interim.
  content_domain: other:information-systems governance
  refusal_sensitivity: medium
  held_out: false
  natsec: false
