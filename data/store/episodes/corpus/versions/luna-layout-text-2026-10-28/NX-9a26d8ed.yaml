  natsec: false
- n: 2
  focus: The decision concerned whether a non-listed agricultural export met the Export Control Act’s economic-security criterion.
    The record gives competing agency views and intelligence that the machines were unlikely to significantly improve Soviet
    agriculture; it also summarizes the political and economic gains weighed against technological loss. Exclude technical
    details of the machinery.
  span_range:
  - src:24db2d816f07#p2.2
  - src:24db2d816f07#p10.2
  decision: The Secretary of Commerce, after review by the Export Control Review Board, decided whether to license Finley-Moody’s
    forage-harvester shipment to the USSR and approved it.
  content_domain: other:economic-export-controls
  refusal_sensitivity: low
