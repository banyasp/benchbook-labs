  focus: The decision weighed the risk of aiding Soviet strategic technology against Japan’s claim that the USSR already had
    comparable capability and the risk that routine U.S. objections could undermine COCOM. Focus on the exception, intelligence
    assessment, and policy rationale; exclude operational or technical details about the equipment.
  span_range:
  - src:24db2d816f07#p6.4
  - src:24db2d816f07#p7.2
  decision: The U.S. delegation, following EDAC’s recommendation, decided whether to object to Japan’s COCOM exception request
    for exporting electron-beam machiners to the USSR; it objected, preventing the export.
  content_domain: other:economic-export-controls
  refusal_sensitivity: low
