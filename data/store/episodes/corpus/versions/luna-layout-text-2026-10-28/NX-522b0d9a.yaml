episodes:
- n: 1
  focus: The decision was whether to authorize manned overflights to gain information about Soviet strategic weapons and military
    capabilities, despite the risk of violating Soviet airspace. Focus on the authorization and its stated intelligence rationale;
    exclude flight routes, equipment, and collection methods.
  span_range:
  - src:8a710f3c3dba#p2.3
  - src:8a710f3c3dba#p3.4
  decision: The US president authorized U-2 reconnaissance flights over the USSR for a ten-day period beginning in early July
    1956.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to engage an unidentified foreign aircraft after the Soviet leader demanded it be shot
    down. The stated considerations include the airspace violation, its occurrence on a national holiday shortly before a
    summit, and the leadership’s view that it was a political provocation; exclude the operational circumstances and mechanics
    of engagement.
  span_range:
  - src:8a710f3c3dba#p9.2
  - src:8a710f3c3dba#p10.3
  decision: The Soviet air-defense battalion officer ordered the U-2 engaged on 1 May 1960 rather than allowing it to continue
    its flight.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The decision was whether to respond to the shootdown with an immediate strike or avoid military escalation while
    diplomatic settlement remained possible. Focus on the choice and the stated escalation risk; exclude strike planning and
    operational details.
  span_range:
  - src:8a710f3c3dba#p14.2
  - src:8a710f3c3dba#p14.3
  decision: The US president rejected the Defense Department’s proposal for an immediate strike against Cuba after the Soviet
    shootdown of a U-2 in October 1962.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
