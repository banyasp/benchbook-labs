- n: 1
  focus: The decision point is whether the DCI should carry out the presidential order or refuse it, weighing the order against
    the risks of compliance and the possibility that refusal would only transfer the assignment to someone else. Keep the
    focus on authority and accountability; exclude any details of surveillance methods.
  span_range:
  - src:fda1b40901be#p12.2
  - src:fda1b40901be#p12.2
  decision: The DCI decided whether to comply with the President’s order to have the CIA spy on American antiwar protesters.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to resign at the President’s request or remain in office, with the DCI concerned that
    resignation would set a precedent politicizing the office. Exclude the later circumstances of his departure except as
    context for the decision.
  span_range:
  - src:fda1b40901be#p13.4
  - src:fda1b40901be#p13.4
  decision: The DCI declined the President’s request to submit his resignation after the 1972 elections.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to disclose the covert activity to the committee or withhold it, weighing the duty
    to testify accurately against the oath and statutory responsibility to protect intelligence sources and methods from unauthorized
    disclosure. Include the denial and the later no-contest plea as the stated outcome; exclude operational details of the
    activity.
  span_range:
  - src:fda1b40901be#p14.2
  - src:fda1b40901be#p14.2
  decision: The former DCI decided whether to disclose classified CIA activity when testifying to the Senate Foreign Relations
    Committee about influence on Chile’s 1970 presidential election.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
