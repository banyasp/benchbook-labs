episodes:
- n: 1
  focus: The decision followed staff feedback that the old portal made current, relevant documents difficult to find; the
    redesign aimed to build confidence in the tool and make daily information easier to access. Focus on the organizational
    choice and its rationale, not on implementation details.
  span_range:
  - src:24b81490208c#p7.5
  - src:24b81490208c#p8.2
  decision: The KM team and portal developers chose to redesign the SharePoint homepage and Commander’s Dashboard rather than
    retain the existing portal.
  content_domain: other:knowledge-management
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision delegated limited portal administration to trained representatives to reduce account-approval delays
    and avoid service requests for directorate content changes. Focus on the authority delegation and its rationale, not technical
    access procedures.
  span_range:
  - src:24b81490208c#p8.3
  - src:24b81490208c#p9.1
  decision: The KM program chose to authorize knowledge management representatives to manage personnel and content on their
    directorate sites rather than route each change through a service request.
  content_domain: other:knowledge-management
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The policy balanced faster retrieval and storage management with access to historical material and applicable retention
    rules; directorate representatives review records during annual cleanup. Focus on the retention and access policy, not
    technical storage practices.
  span_range:
  - src:24b81490208c#p9.4
  - src:24b81490208c#p9.5
  decision: The KM program chose to keep current, relevant documents on the portal and archive documents older than two years
    to a shared drive, subject to legal retention requirements.
  content_domain: other:knowledge-management
  refusal_sensitivity: low
  held_out: false
  natsec: false
