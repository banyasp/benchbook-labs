  natsec: true
- n: 2
  focus: The decision point is whether to continue the mission or stop after the fault indication. The report says the aircraft’s
    technical order did not specifically address the PFL’s implications, the PFL indicated the PMS retained engine control,
    and the decision to proceed followed squadron procedure and risk-mitigation practice; exclude the later in-flight troubleshooting
    and aircraft-handling choices.
  span_range:
  - src:557f10885bd4#p35.5
  - src:557f10885bd4#p36.2
  decision: The Top-3 and formation pilots decided to continue the sortie after the ENG_PMS 001 fail PFL appeared.
