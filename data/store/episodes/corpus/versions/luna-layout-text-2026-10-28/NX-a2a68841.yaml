  focus: The available courses were to curtail and return or continue the planned mission; the flight lead initially proposed
    a shorter mission, while the Top-3 authorized continuing the full mission. The stated basis was that the fault indication
    meant the system had accommodated a detected fault and retained engine control. Exclude later in-flight troubleshooting,
    divert, and ejection decisions, which concern operational technique rather than a decision-ethics, law, or policy question.
  span_range:
  - src:557f10885bd4#p12.1
  - src:557f10885bd4#p17.1
  decision: The squadron Top-3 decided whether the formation should continue the training mission after the aircraft displayed
    an ENG_PMS 001 caution.
  content_domain: operational-command
