  focus: The decision point is whether the person using the system may proceed or must refrain under the proportionality standard.
    Keep the focus on the person’s legal decision and the duty to reduce civilian-harm risk; exclude programming, monitoring,
    or other operational details about system use.
  span_range:
  - src:b3607c50ac53#p391.2
  - src:b3607c50ac53#p391.3
