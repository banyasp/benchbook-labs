  focus: The doctrine says a warning is not required in this stated circumstance because it would not yield a humanitarian
    benefit. Treat this as a decision about the legal precaution standard, not as guidance on how to conduct an attack or
    deliver a warning.
  span_range:
  - src:b3607c50ac53#p223.2
  - src:b3607c50ac53#p223.2
