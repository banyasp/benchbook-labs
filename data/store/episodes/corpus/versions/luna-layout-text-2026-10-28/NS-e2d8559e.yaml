  focus: The decision was whether to attack aircraft that the law of war permitted the Coalition to attack, or refrain because
    of the cultural-property risk. The commander weighed respect for the temple and the belief that the aircraft were effectively
    out of action, which limited the military value of destroying them, against the risk of temple damage; exclude any operational
    details about conducting an attack.
  span_range:
