  focus: The manual says blanket POW treatment may be justifiable, while a person believed to have participated should remain
    a POW until a competent tribunal determines otherwise. The stated alternative is an individual claim and tribunal determination;
    exclude operational methods of detention and any broader rules not tied to this scenario.
  span_range:
  - src:b3607c50ac53#p154.5
  - src:b3607c50ac53#p155.1
  decision: The invading force or detaining authority decides whether to treat all persons of military age in a locality where
    some inhabitants formed a levée en masse as POWs pending individual determination.
  content_domain: other:law-of-war status and detention
  refusal_sensitivity: low
  relaxed:
  - choice_stated
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
  gold_tier: model-solved
- n: 10
  focus: The manual describes captured medical personnel refusing to care for sick and wounded prisoners and reports that
    the South Vietnamese treated captured North Vietnamese medical personnel as ordinary POWs. It explains that refusal may
    be treated as a denial of professional status, while noting the legal basis for that response was uncertain; exclude decisions
    about how to deliver medical care.
  span_range:
  - src:b3607c50ac53#p161.1
  - src:b3607c50ac53#p161.9
  decision: The detaining power decides whether captured military medical personnel who refuse to provide medical care retain
    that status or are treated as ordinary prisoners of war.
  content_domain: other:law-of-war-status
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 11
  focus: The decision point is the choice of security personnel under the stated risk condition. The manual distinguishes
    security against criminal elements, which generally is not direct participation in hostilities, from security against
    enemy armed forces, which is; exclude details about how security is provided.
  span_range:
  - src:b3607c50ac53#p174.5
  - src:b3607c50ac53#p175.1
  decision: DoD commanders decide whether to assign civilian or military personnel to provide security when there is a significant
