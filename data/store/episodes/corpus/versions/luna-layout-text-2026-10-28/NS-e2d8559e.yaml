- n: 7
  focus: The decision point is whether to use military force when officials assessed that other tools were insufficient and
    cited compelling evidence of planned further attacks and an immediate threat. Focus on the authority and reasons for choosing
    force; exclude the execution of the strikes and any operational details.
  span_range:
  - src:b3607c50ac53#p114.5
  - src:b3607c50ac53#p114.6
