- n: 35
  focus: The doctrine says this shell is not prohibited where its military advantages are not clearly disproportionate to
    the injuries it inflicts. Frame the decision as a weapon-legality assessment under the superfluous-injury standard; exclude
    operational choices about how or where to employ the shell.
  span_range:
  - src:b3607c50ac53#p398.15
  - src:b3607c50ac53#p398.15
