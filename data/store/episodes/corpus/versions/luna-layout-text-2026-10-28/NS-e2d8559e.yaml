- n: 2
  focus: The decision point is whether to construe the statute to cover military conduct during armed conflict or to exclude
    it absent a clear statement from Congress. The opinion chose the latter, reasoning that the statute implemented a convention
    not understood to cover armed forces in conflict and that the contrary reading could criminalize lawful military action,
    including reasonable self-defense; exclude the operational circumstances of the aircraft’s downing.
  span_range:
  - src:b3607c50ac53#p40.5
  - src:b3607c50ac53#p40.6
  decision: The Office of Legal Counsel interpreted whether 18 U.S.C. § 32(b)(2) applies to U.S. military actions during hostilities,
    including the 1988 downing of Iran Air Flight 655.
  content_domain: other:statutory interpretation
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 3
  focus: The decision point is whether to continue relying on diplomatic or economic measures or to use force as a last resort.
    The stated reasons were that there was no reasonable prospect those alternatives would stop future attacks and that the
    response was intended to frustrate further unlawful action; exclude operational details about the target or conduct of
    the strike.
  span_range:
  - src:b3607c50ac53#p69.5
  - src:b3607c50ac53#p70.6
