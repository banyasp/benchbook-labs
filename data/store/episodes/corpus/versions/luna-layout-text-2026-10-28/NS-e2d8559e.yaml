  focus: The manual states that retreat does not remove combatants’ liability to attack and explains that retreating forces
    may recover, counterattack, consolidate a position, assist the war effort, or be using retreat as a ruse. Focus on the
    legal choice whether to attack or refrain; exclude means, timing, or tactics of attack.
  span_range:
  - src:b3607c50ac53#p237.4
  - src:b3607c50ac53#p238.1
  decision: A commander deciding whether to attack enemy combatants who are retreating.
