  focus: The decision point is whether to mandate a review and training changes after an investigation found deficiencies
    linked to civilian casualties. The stated reasons are to clarify confusing guidance, prevent similar incidents, and emphasize
    judgment and accountability; exclude any operational details of the Kunduz strike.
  span_range:
  - src:b3607c50ac53#p289.6
