- n: 4
  focus: The decision point is whether to rely on a standalone humanitarian-intervention theory or to justify the action through
    other stated factors. The passage identifies the latter course and lists humanitarian catastrophe, threats to neighboring
    states, violations of law and human-rights obligations, and Security Council resolutions as reasons; exclude operational
    conduct of the campaign.
  span_range:
  - src:b3607c50ac53#p74.2
  - src:b3607c50ac53#p74.6
