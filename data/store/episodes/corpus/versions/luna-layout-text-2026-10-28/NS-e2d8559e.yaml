  focus: The cited passage says an airstrike rather than an attempt to capture may be legally permissible if the President
    has determined that the person poses the specified threat and the risk to U.S. forces is deemed too great. The passage
    supplies a conditional legal standard and rationale, but does not report an actual decision or recommend one course. Exclude
    operational details of an airstrike or capture operation.
  span_range:
  - src:b3607c50ac53#p85.5
  - src:b3607c50ac53#p85.5
  decision: The President decides whether to authorize military force against a person assessed as a threat, while U.S. forces
