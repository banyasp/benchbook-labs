  focus: The doctrine describes subordinates discovering an unanticipated risk when updated instructions are not possible,
    and recognizes authority to take precautions or refrain if doing so would best achieve the commander’s intent with the
    new information. The reasons are the changed risk and the need to effectuate the commander’s intent; exclude operational
    details about attack methods or execution.
  span_range:
  - src:b3607c50ac53#p283.2
  - src:b3607c50ac53#p283.2
