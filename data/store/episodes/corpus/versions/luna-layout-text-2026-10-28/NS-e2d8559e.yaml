- n: 19
  focus: The manual says personnel may resist if they do not wear the enemy’s uniform or kill or wound treacherously, and
    says distinctive dress should resume as soon as practicable to help protect civilians from mistaken attack. Focus on the
    legal choice to resist under these conditions and the reason to resume distinguishing attire; exclude tactics for resisting
    the attack.
  span_range:
  - src:b3607c50ac53#p239.4
  - src:b3607c50ac53#p240.1
