  focus: The doctrine says age and gender may be relevant, but that this fact alone is speculation and insufficient to justify
    classifying the person as a military objective. Focus on the choice between treating the person as targetable on that
    basis or withholding that classification; exclude other identification or attack methods.
  span_range:
  - src:b3607c50ac53#p230.2
  - src:b3607c50ac53#p230.5
