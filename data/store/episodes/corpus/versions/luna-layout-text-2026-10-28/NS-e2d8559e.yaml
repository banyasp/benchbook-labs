  focus: The manual describes this as permissible when the use is judged to cause fewer casualties or less collateral damage
    than the alternatives. Treat the decision as a legal-policy choice about whether to use force; exclude weapon employment
    techniques. The passage authorizes the option but does not require or recommend choosing it.
  span_range:
