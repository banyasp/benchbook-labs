  focus: The passage reports a choice between accepting open-city status and retaining Rome’s military use, and states that
    the Fascist authorities refused. It connects the refusal to Rome’s use as a military center, including for munitions production
    and military transport; treat this as a reported historical decision, not as a general rule about the legal status of
    cities.
  span_range:
  - src:b3607c50ac53#p317.5
  - src:b3607c50ac53#p317.6
