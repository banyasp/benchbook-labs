- n: 8
  focus: The decision point is whether to restrict military action in response to civilian deaths in France, while weighing
    civilian protection against the operation’s effectiveness and the risk of additional allied casualties. Focus on the policy
    choice and stated tradeoffs; exclude operational methods or targeting details.
  span_range:
  - src:b3607c50ac53#p122.6
  - src:b3607c50ac53#p122.7
  decision: The President decided not to impose additional restrictions on commanders’ military action during preparations
