  focus: The decision point is whether to retain Kyoto as a target or remove it. The stated reasons were its status as Japan’s
    ancient capital and a shrine of Japanese art and culture, despite its considerable military importance. Exclude the separate
    approvals of other targets and any operational details about conducting attacks.
  span_range:
  - src:b3607c50ac53#p337.4
  - src:b3607c50ac53#p338.7
