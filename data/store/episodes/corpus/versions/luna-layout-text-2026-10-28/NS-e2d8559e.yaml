  focus: 'The decision concerns the legal assessment of the attack on the fuel tankers: whether anticipated civilian casualties
    made it obviously excessive in light of the military advantages. The quoted decision cites the anticipated civilian deaths,
    the military importance of destroying the tankers and senior Taliban figures, and the reduced risk of attacks; exclude
