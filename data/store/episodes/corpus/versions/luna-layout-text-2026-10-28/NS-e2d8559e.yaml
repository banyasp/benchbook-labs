  focus: The manual describes uncertainty such as a missing identity card or a detainee who does not disclose enemy armed-forces
    membership, and requires GPW protection until a competent tribunal determines status when doubt exists. Focus on the interim
    protection and referral decision; exclude tribunal procedures and other status questions not required by the cited rule.
  span_range:
  - src:b3607c50ac53#p210.3
  - src:b3607c50ac53#p211.2
