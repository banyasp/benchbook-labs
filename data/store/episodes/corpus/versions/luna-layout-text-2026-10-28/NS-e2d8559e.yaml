  focus: The manual says that seconds before a second aircraft attacks, the antiaircraft crew’s gesture does not make surrender
    feasible to accept because the opposing aircraft crew cannot land and take custody. It therefore does not require treating
    the crew as hors de combat in those circumstances; focus on the legal choice and feasibility standard, not on how to conduct
    an attack.
  span_range:
  - src:b3607c50ac53#p274.3
  - src:b3607c50ac53#p274.5
