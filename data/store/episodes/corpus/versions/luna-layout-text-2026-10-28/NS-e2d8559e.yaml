- n: 18
  focus: The manual contrasts immediate decisions based on professional judgment during contact with more extensive information
    gathering and review when planning time and resources are available. Focus on how the circumstances affect feasible verification;
    exclude the operational conduct of any attack or information-gathering technique.
  span_range:
  - src:b3607c50ac53#p231.2
  - src:b3607c50ac53#p232.1
