episodes:
- n: 1
  focus: At the August 1930 meeting, agencies faced overlapping radio-enforcement work and a lack of clearly delineated responsibilities.
    The committee assigned targets at sea to the Coast Guard, points of entry to Customs, inland targets to the Bureau of
    Prohibition, and transmitter-location expertise to the Radio Division; focus on the jurisdictional and policy choice,
    not collection or station-location methods.
  span_range:
  - src:64480f30c7d8#p15.3
  - src:64480f30c7d8#p18.1
  decision: The interagency committee chaired by the Department of Commerce Radio Division decides how to divide responsibility
    for Prohibition radio-enforcement targets among the participating agencies.
  content_domain: other:interagency enforcement policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: In September 1930, Customs sought the transfer, while the Coast Guard considered whether a field intelligence service
    supported by headquarters cryptanalysis could give enforcement agencies actionable information sooner. The commandant
    held the transfer in abeyance, and Customs agreed that the Coast Guard was the logical agency to handle the radio problem;
    exclude technical collection methods.
  span_range:
  - src:64480f30c7d8#p22.2
  - src:64480f30c7d8#p22.2
  decision: The Coast Guard commandant decides whether to transfer the cryptanalyst and her assistant to Customs or retain
    them while considering a Coast Guard radio-intelligence service.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: After the RCMP requested training, the officer considered whether to extend cooperation informally or seek higher-level
    authorization under the U.S.-Canada treaty. He recommended a formal request through the Coast Guard commandant and State
    Department, and identified the trainees’ status as a security concern because some radio operators were uninvestigated
    civilians, including former rumrunner operators; the document does not establish that training ultimately occurred.
  span_range:
  - src:64480f30c7d8#p35.1
  - src:64480f30c7d8#p35.2
  decision: The Coast Guard acting intelligence officer decides that proposed cryptographic training for Canadian personnel
    should proceed only through formal approval and with regular RCMP members as trainees.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
