episodes:
- n: 1
  focus: The decision point is whether to add an official FCC monitoring service or continue relying on private radio and
    newspaper sources; the stated reasons include possible embassy closures and the need for broader, more detailed coverage.
    Examine the authority and public purpose for assigning this intelligence function to the FCC; exclude the service’s later
    operating details.
  span_range:
  - src:7558877c570a#p2.2
  - src:7558877c570a#p2.4
  decision: The FCC, responding to the State Department’s concern about losing diplomatic reporting, decides to establish
    and fund an official foreign-broadcast monitoring service.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is how to recruit applicants amid camp tensions: quiet recommendations and preselection rather
    than public advertising. The passage gives concerns about pressure on applicants and families, as well as unrest at a
    camp; exclude the separate unresolved question of whether resident aliens could be hired.'
  span_range:
  - src:7558877c570a#p5.2
  - src:7558877c570a#p5.3
  decision: The FBIS recruiter and WRA camp officials choose quiet staff referrals over public advertisements when recruiting
    Japanese-American linguists in the camps.
  content_domain: other:personnel-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to continue paying the employees or use the appropriations provision to end their compensation
    and bar them from federal service. The passage says the action rested solely on a congressman’s accusations and notes
    that the provision was later ruled unconstitutional; exclude the broader political dispute except where it clarifies the
    basis and legality of this action.
  span_range:
  - src:7558877c570a#p9.6
  - src:7558877c570a#p10.2
  decision: The House Appropriations Committee decides to halt federal compensation for two FBIS employees accused of disloyalty.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
