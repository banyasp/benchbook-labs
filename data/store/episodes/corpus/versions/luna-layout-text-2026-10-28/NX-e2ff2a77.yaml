- n: 1
  focus: The brigade commander chooses to constrain the advance rather than continue at the prior pace, citing the exposed
    flank, limited evacuation support, and supply problems. Keep the focus on command judgment under those constraints; exclude
    tactical methods for conducting the advance.
  span_range:
  - src:367599bc05e6#p37.2
  - src:367599bc05e6#p39.3
  decision: The brigade commander decides to slow the task force’s advance after Task Force Griffon is rendered combat ineffective.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The task-force commander chooses to hold Cobra rather than let it continue north, while Anvil is still crossing and
    a face-to-face with host-nation forces is pending. Focus on the command choice and stated coordination context; exclude
    details of crossing or other tactical procedures.
  span_range:
  - src:367599bc05e6#p30.2
  - src:367599bc05e6#p30.3
  decision: The task-force commander orders Cobra to pause north of the phase line until Anvil crosses and the host-nation
    meeting can occur.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The task-force commander chooses to report what is known rather than avoid or delay reporting after a friendly-fire
    incident. The passage links this choice to his concern about prior deaths caused by taking the easier course; exclude
    the separate question of the officer’s award nomination.
  span_range:
  - src:367599bc05e6#p32.2
  - src:367599bc05e6#p32.3
  decision: The task-force commander directs that the known friendly-fire casualties be reported to brigade despite the prospect
    of another investigation.
  content_domain: other:command-accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The commander weighs the chance that the AGM will consolidate in Zhodkiva against ammunition shortages, casualties,
    and the risk of escalation with Arcania. Focus on the limited advance and the authority for it; exclude the tactical details
    of how units would move or deploy.
  span_range:
  - src:367599bc05e6#p41.2
  - src:367599bc05e6#p42.3
  decision: The division deputy commander authorizes the task-force commander to advance to RTE CONDOR rather than wait for
    additional forces or halt.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The commander could pause the meeting to address the aircraft report or continue the discussion, delegating the aircraft
    response to his executive officer. He continues because delay could give the AGM time to move into Zhodkiva and because
    the meeting is being held outside the city; exclude aircraft-recovery procedures.
  span_range:
  - src:367599bc05e6#p49.2
  - src:367599bc05e6#p49.3
  decision: The task-force commander decides not to reschedule the meeting with Bolcavian leaders after learning of a downed
    aircraft.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The brigade commander weighs Strike's leadership need after its senior enlisted leader is evacuated against the risk
    of weakening Anvil, which has also taken losses. The discussion notes Anvil's capable XO and the proposed alternatives;
    exclude unrelated personnel-management generalities.
  span_range:
  - src:367599bc05e6#p56.3
  - src:367599bc05e6#p57.2
  decision: The brigade commander assigns the senior enlisted leader selected for the academy to TF Strike rather than retaining
    him with TF Anvil.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The choice is whether to deny the officer's request to return after substantial blood loss or allow him to return
    because no replacement is expected for at least 48 hours. The passage makes the commander's risk condition explicit; exclude
    medical-treatment details and do not assess clinical fitness independently.
  span_range:
  - src:367599bc05e6#p57.3
  - src:367599bc05e6#p58.2
  decision: The brigade commander permits the wounded task-force operations officer to return to duty, subject to the task-force
    commander's acceptance of the risk.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The commander must choose whether to allow the host-nation soldiers to carry out executions on their commander’s
    order or intervene to prevent them. The text identifies the executions as a possible war crime and gives the commander’s
    stated response; focus on the legal and ethical basis for intervention, not the armed standoff or its tactics.
  span_range:
  - src:367599bc05e6#p83.2
  - src:367599bc05e6#p85.2
  decision: The task force commander intervenes to stop allied forces from executing detainees and orders them secured for
    processing.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The stated choice is to begin offensive operations rather than wait for the anticipated cease-fire process. The text
    says national leaders judged that Arcanian aggression could not stand and gives seizure of defensible terrain as the operational
    direction; exclude the detailed phases and tactics of the operation.
  span_range:
  - src:367599bc05e6#p94.3
  - src:367599bc05e6#p96.3
  decision: National leadership decides to proceed with the offensive to seize defensible terrain despite an expected cease-fire
    resolution.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to pause or proceed while awaiting attack-helicopter support. The commander cites the
    expected support, and the task-force commander sees the pause as time to improve positioning, rehearse, and refuel; exclude
    the detailed maneuver and preparation methods.
  span_range:
  - src:367599bc05e6#p104.2
  - src:367599bc05e6#p104.2
  decision: The brigade commander orders the task-force commander to hold for four hours rather than continue advancing.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
