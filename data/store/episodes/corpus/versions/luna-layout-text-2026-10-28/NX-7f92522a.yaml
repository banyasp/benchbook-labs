episodes:
- n: 1
  focus: The ambassador faced pressure to evacuate as military and intelligence reporting indicated an imminent attack, but
    he refused. The source gives his concerns about triggering panic among South Vietnamese and his belief that a communist
    takeover of Saigon was unthinkable; exclude the later details of how individuals departed.
  span_range:
  - src:67d3b260e4bc#p4.3
  - src:67d3b260e4bc#p5.2
  decision: The US ambassador chose not to authorize an evacuation from Saigon.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The commander heard an allied general and intelligence staff warn that Ban Me Thuot was the likely target, with intercepted
    communications supporting the warning. The source says he doubted an attack was being prepared and was unpersuaded; exclude
    speculation about what specific military preparations he could have ordered.
  span_range:
  - src:67d3b260e4bc#p3.2
  - src:67d3b260e4bc#p3.3
  decision: The South Vietnamese II Corps commander chose not to accept the warning that Ban Me Thuot would be attacked.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The operation chief faced a choice between waiting for authorization and getting personnel out without it; he chose
    the latter because he feared they would be captured or killed and felt responsible for their safety. Exclude the specific
    disguises and travel arrangements used to secure departures.
  span_range:
  - src:67d3b260e4bc#p5.2
  - src:67d3b260e4bc#p5.4
  decision: The NSA operation chief chose to send his personnel and their families out of Saigon despite the ambassador’s
    refusal to authorize an evacuation.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The general had an opportunity to leave with his family but refused because he would not abandon his troops and no
    evacuation order had been issued. The account later reports that his troops remained at their posts awaiting orders; exclude
    the details of the family’s passage through the airbase.
  span_range:
  - src:67d3b260e4bc#p6.3
  - src:67d3b260e4bc#p6.4
  decision: The South Vietnamese general chose to remain with his troops rather than leave Saigon with his family.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
