  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to use force against boats believed to be approaching with hostile intent or to refrain,
    given the SIGINT warning and the boats’ approach. The source states that firing was authorized if needed in self-defense
    and that the ship fired; exclude tactical firing details and the mechanics of the engagement.
  span_range:
  - src:3fb9a45b746f#p17.2
  - src:3fb9a45b746f#p17.4
  decision: The Maddox’s on-site commander decides to authorize firing against approaching North Vietnamese boats in claimed
