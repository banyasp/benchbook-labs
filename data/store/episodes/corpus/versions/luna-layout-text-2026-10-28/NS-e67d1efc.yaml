- n: 5
  focus: The decision point is the analysts’ interpretation and warning, not the underlying collection or transmission of
    intelligence. The source explains that the intercepted text did not identify a target or specify an attack, while the
    prior 2 August attack made the interpretation seem plausible; exclude technical details of interception and reporting.
  span_range:
  - src:3fb9a45b746f#p27.3
  - src:3fb9a45b746f#p29.4
  decision: Phu Bai SIGINT analysts chose to report the ambiguous North Vietnamese order for military operations as a planned
