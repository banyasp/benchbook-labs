  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: This is the authorization decision, with the account describing the disputed evidence, the administration’s rapid
    conclusion that an attack occurred, and possible political pressure to appear resolute. Include the uncertainty and the
