- n: 4
  focus: 'This is the administration’s initial response: the account contrasts retaliation with a diplomatic protest and explains
    the choice in terms of the absence of American casualties and a desire not to be provocative while still signaling resolve.
    Keep this separate from the later decision to authorize an air strike after the 4 August incident.'
  span_range:
