  natsec: true
- n: 8
  focus: The agencies faced a choice between broader disclosure and limiting what Congress received. The passage says they
    feared exposing current capabilities and ultimately provided the chronology; focus on the disclosure decision and its
    rationale, not the contents of the intelligence itself.
  span_range:
  - src:3fb9a45b746f#p45.3
  - src:3fb9a45b746f#p45.4
  decision: NSA and DIA officials decided to provide Congress a limited account of the Gulf of Tonkin intelligence rather
