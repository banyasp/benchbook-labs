  focus: The decision point is how to handle Soviet RDT&E when it is difficult to define and cannot be attributed precisely
    to particular weapon systems. The analysts instead separate it from weapon-system costing and derive aggregate figures
    from published Soviet data; exclude the technical details of how individual weapons are costed.
  span_range:
  - src:6e0bc06e22fb#p6.2
  - src:6e0bc06e22fb#p6.2
  decision: U.S. intelligence cost analysts decide not to allocate Soviet RDT&E costs to individual weapon systems, but to
    estimate RDT&E separately.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is how to represent uncertainty in Soviet force projections: as a confidence interval around
    one estimate or as a broad band of possible force structures, with a most-probable structure selected within the band.
    The passage favors the latter to accommodate varied circumstances and support contingency planning; exclude operational
    force-employment details.'
  span_range:
  - src:6e0bc06e22fb#p6.3
  - src:6e0bc06e22fb#p7.4
  decision: Analysts preparing the 1965 Soviet defense-expenditure study decide to present high- and low-force assumptions
    as a band of practical possibilities and select a most-probable force structure within it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
