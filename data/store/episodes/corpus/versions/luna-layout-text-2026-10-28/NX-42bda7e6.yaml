episodes:
- n: 1
  focus: The decision point is whether to change the leadership structure in response to intelligence-community dysfunction.
    Include the stated concerns about the DCI’s competing responsibilities, information sharing, and cross-agency coordination;
    exclude later questions about operational intelligence activity.
  span_range:
  - src:6f2e1e63d5ca#p3.3
  - src:6f2e1e63d5ca#p3.5
  decision: The Bush National Security Council staff chose to support creating a Director of National Intelligence rather
    than retain the DCI’s combined coordination and CIA leadership role.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the recommendation about how much authority a new DNI should receive, including whether the
    office could move people and resources and evaluate agency performance. Include the stated concern that a weakly empowered
    DNI would be ineffective and that clear authority was necessary amid war; exclude operational tasking details.
  span_range:
  - src:6f2e1e63d5ca#p6.3
  - src:6f2e1e63d5ca#p6.5
  decision: The deputy director of central intelligence and agency counterparts chose to recommend a DNI with substantial
    authority over budgets and personnel rather than a limited coordination role.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
