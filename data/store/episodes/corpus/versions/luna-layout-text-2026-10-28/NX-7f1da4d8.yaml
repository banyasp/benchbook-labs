  natsec: true
- n: 3
  focus: The decision point is whether to use bridge interdiction to impede German reinforcement of Normandy or continue with
    the marshalling-yard approach favored by the opposing strategists. The account says the bridge approach gained support
    from American air and ground-force leadership and was approved after a test produced persuasive evidence; exclude the
    test’s operational details.
  span_range:
