- n: 2
  focus: At the March 1944 policy meeting, the choice was between concentrating on oil to reduce German ground and air fighting
    capacity or attacking marshalling yards for more immediate help to the landings. The source gives the reason for the choice
    and later describes its reversal; exclude attack planning and execution details.
  span_range:
  - src:e997d84c679f#p3.3
  - src:e997d84c679f#p4.2
  decision: The Supreme Allied Commander chose marshalling-yard attacks rather than oil attacks as the immediate pre-D-Day
    bombing priority.
  content_domain: targeting
