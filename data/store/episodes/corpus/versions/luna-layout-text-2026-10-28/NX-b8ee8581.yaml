  focus: The Protocol permits the Party, if it determines that it cannot comply immediately, to declare a deferral of up to
    nine years when notifying consent to be bound; otherwise, it can comply without deferral. The stated reason is inability
    to comply immediately, and the Party must minimize use of non-compliant mines to the extent feasible during the deferral.
    Exclude technical implementation details and decisions about particular mine deployments.
