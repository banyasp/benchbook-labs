episodes:
- n: 1
  focus: The decision point is the delegation’s choice of conference scope amid Soviet pressure to link technical success
    to an end to testing. Keep the focus on diplomatic agenda-setting and the stated concern that a breakdown could be used
    for propaganda; exclude technical detection methods.
  span_range:
  - src:288e6971c762#p5.3
  - src:288e6971c762#p6.1
  decision: The Western delegation chose to keep the conference focused on technical detection questions rather than negotiate
    whether nuclear testing should cease.
  content_domain: other:treaty-verification-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: Frame this as a decision about whether to permit inspection as part of a test-suspension verification arrangement,
    not about how an inspection would be conducted. The account gives the unresolved-event problem, the deterrent rationale
    for inspections, and the delegation’s eventual acceptance; do not expand into inspection techniques.
  span_range:
  - src:288e6971c762#p10.4
  - src:288e6971c762#p11.1
  decision: The Soviet delegation chose to accept the principle of inspection of sites where monitoring could not resolve
    whether a suspected event was a nuclear test.
  content_domain: other:treaty-verification-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
