- n: 1
  focus: The decision point is how to allocate responsibility for establishing the ANA’s non-combat systems. The source says
    the officer judged that institutional sustainment and functional systems exceeded SOF’s capabilities; exclude the teams’
    subsequent operational methods.
  span_range:
  - src:22ea79f462d8#p59.3
  - src:22ea79f462d8#p59.4
  decision: The officer leading the effort to build the Afghan National Army chose to assign administration and logistics
    development to non-SOF Embedded Training Teams rather than rely on SOF advisors for those tasks.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to remain focused on tactical training or expand advising to address command, sustainment,
    and ministry-level deficiencies. The source gives the deficiencies prompting the expansion; exclude details of training
    and operational execution.
  span_range:
  - src:22ea79f462d8#p52.3
  - src:22ea79f462d8#p53.2
  decision: SOF advisors in Iraq chose to broaden their advisory mission from tactical training to developing national command
    structures and supporting institutional capabilities.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue concentrating advisory effort at the tactical level or redirect it toward
    higher headquarters and institutional capacity. The source cites Philippine plans, the success of tactical efforts, and
    gaps in planning and coordination; exclude the specific conduct of counterterrorism operations.
  span_range:
  - src:22ea79f462d8#p55.4
  - src:22ea79f462d8#p56.2
  decision: JSOTF-P leaders chose to shift SOF advising in the Philippines from primarily tactical units toward operational-level
    and institutional development.
  content_domain: operational-command
