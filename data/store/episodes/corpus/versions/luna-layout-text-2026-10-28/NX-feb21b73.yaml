  focus: The decision is whether to retain the separate departmental arrangement or consolidate certain functions under a
    new agency reporting through the Joint Chiefs of Staff; the source says the agency was established following a Joint Chiefs
    plan requested by the Secretary of Defense and with approval from the President’s Foreign Intelligence Advisory Board.
    The stated reasons include unity of effort, more efficient use of resources, more effective management, and reducing duplication;
    exclude operational intelligence-collection methods.
