  natsec: true
- n: 2
  focus: The decision is whether to approve the report or withhold approval; the stated basis is compliance with applicable
    guidance. Treat this as an administrative legal-review decision, not as a finding of civil or criminal liability.
  span_range:
  - src:5cf460a10c45#p1.4
  - src:5cf460a10c45#p1.5
  decision: The convening authority approved the accident investigation report after determining that it complied with applicable
    regulatory and statutory guidance.
  content_domain: other:administrative-law
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: Frame the decision as whether to continue the pass or abandon it and preserve separation from the known obstruction.
    The report attributes the choice to the pilot’s focus on the boat and describes it as violating flight rules and operating
    procedures; exclude the mechanics of flight or obstacle avoidance.
  span_range:
  - src:5cf460a10c45#p1.347
  - src:5cf460a10c45#p1.352
  decision: The mishap pilot chose to continue a low pass toward a boat despite knowing power lines were in the area and not
    having them in sight.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: 'Treat this as the flight lead’s safety-command choice: accept the acknowledgment or intervene to ensure the wingman
    recognizes the obstruction and avoids it. The report explains the lead’s assumption and the alternative expected response;
    exclude the specific wording or mechanics of radio procedures.'
  span_range:
  - src:5cf460a10c45#p1.358
  - src:5cf460a10c45#p1.359
  decision: The mishap flight lead chose not to confirm that the wingman saw the cables or direct him to avoid them after
    an ambiguous acknowledgment.
  content_domain: operational-command
  refusal_sensitivity: low
