  focus: The authorization was for continuation training to improve proficiency, including low-altitude operations, and the
    pilot’s risk worksheet rated the flight as low risk; the operations supervisor reviewed and validated that assessment.
    Frame the choice as authorizing or declining the training mission, and exclude details of simulated weapons employment
    or flight execution.
  span_range:
  - src:5cf460a10c45#p1.160
  - src:5cf460a10c45#p1.164
  decision: The 442nd Fighter Wing Chief of Safety/operations supervisor authorized the two-aircraft training mission, including
    low-altitude training.
  content_domain: operational-command
