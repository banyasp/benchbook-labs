- n: 1
  focus: The Secretary of Defense chose to implement a unified agency after reviewing the Stone Board report and amid efforts
    to economize, despite prior service disagreement about merger. Focus on the policy choice to centralize these responsibilities;
    exclude the agency’s later operational activities.
  span_range:
  - src:ebb06417166c#p4.1
  - src:ebb06417166c#p4.1
  decision: The Secretary of Defense orders the creation of AFSA to unify military COMINT and COMSEC activities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
