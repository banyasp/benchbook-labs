  natsec: true
- n: 2
  focus: The President and NSC chose restructuring over the existing AFSA arrangements after the committee identified jurisdictional
    problems, ineffective unanimous decision-making, poor COMINT results, and conflicts with consumers and other agencies.
    Focus on the choice of authority, reporting, and oversight structure; exclude technical collection or production methods.
  span_range:
  - src:ebb06417166c#p5.1
  - src:ebb06417166c#p6.1
  decision: The President and National Security Council adopt most Brownell Committee recommendations, replacing AFSA with
    NSA and revising its oversight and reporting structure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
