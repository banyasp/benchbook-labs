episodes:
- n: 1
  focus: 'The decision point is the Army’s organizational choice as the corps returned as a tactical echelon: retain ASOC
    support at division or relocate it to corps. The document states that FM 3-0 proposed retaining division alignment and
    gives reasons including the division’s tactical role and its more timely, accurate situational awareness; exclude the
    mechanics of airspace control and targeting.'
  span_range:
  - src:969bf1211739#p14.2
  - src:969bf1211739#p26.3
  decision: Army leadership chose to keep the Air Support Operations Center (ASOC) aligned with the division, rather than
    move it to the corps, while retaining the division’s JAGIC airspace-control capability.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision is whether to keep the ASOC aligned with a division or relocate it temporarily to corps, under the MOA
    authority, when operational requirements may warrant corps-level integration. The passage cites multiple divisions lacking
    JAGIC capability, restrictive terrain, and a wet gap crossing as possible circumstances, and says to weigh relocation
    costs against benefits; exclude the technical execution of airspace control.
  span_range:
  - src:969bf1211739#p29.3
  - src:969bf1211739#p29.3
  decision: The corps commander decides whether to temporarily relocate the ASOC from a division CP to the corps CP to form
    a JAGIC for airspace control.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
