  focus: The decision point is whether to offer incentives and explore immunity arrangements, or leave personnel facing the
    ordinary prospect of prosecution without such inducements. The Prime Minister said personnel needed to be found and that
    they might be too frightened to talk without an offer of immunity; he commissioned advice on a judge or lawyer to negotiate
    packages, and a later paper recommended combining incentives with deterrents. Treat this as a decision to pursue arrangements,
