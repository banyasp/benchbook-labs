episodes:
- n: 1
  focus: 'Treat this as an intelligence-estimative decision: the JIC had a limited picture and weighed evidence of research,
    procurement and possible mobile biological-agent production against important gaps, including no evidence that Iraq had
    filled weapons with agents since the Gulf War. Exclude operational details about weapons or facilities; the decision at
    issue is the assessment and its level of confidence.'
  span_range:
  - src:30e1ce1a0ab1#p17.2
  - src:30e1ce1a0ab1#p19.10
  decision: The JIC judged in April 2000 that Iraq was likely continuing to develop offensive chemical and biological warfare
    capabilities.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the March 2001 policy choice to focus controls on WMD and military programmes, against the
    alternative of removing wider trade sanctions while retaining controls on dual-use goods. The passage gives regional-support
    and non-proliferation considerations; exclude later judgments about how effective particular controls proved to be.
  span_range:
  - src:30e1ce1a0ab1#p27.5
  - src:30e1ce1a0ab1#p27.9
  decision: No.10 chose a revised Iraq-controls policy focused on WMD and military programmes rather than retaining broad
    trade sanctions.
  content_domain: other:sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is the JIC’s assessment of the likely overall impact of direct military action, including the
    alternative possibility that it could substantially constrain the programmes. The reasons were uncertainty about facility
    locations, activity at other sites, and the dual-use nature of civil facilities; exclude any operational choice of targets
    or methods.
  span_range:
  - src:30e1ce1a0ab1#p31.4
  - src:30e1ce1a0ab1#p31.5
  decision: The JIC assessed that direct military action against suspected Iraqi WMD facilities was unlikely to have a significant
    overall effect on Iraq’s programmes.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to retain the draft or rework it to address the changed threat, including the possibility
    of CBRN terrorism, while preserving proportion. The JIC discussion cited the unprecedented scale and novelty of the attacks
    and judged the draft’s treatment of CBRN threats inadequate; exclude operational counter-terrorism measures.
  span_range:
  - src:30e1ce1a0ab1#p41.4
  - src:30e1ce1a0ab1#p41.8
  decision: The JIC decided that its post-9/11 assessment of the UK terrorist threat needed substantial revision before circulation.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether the JIC should say more about WMD in the assessment or leave the discussion narrower;
    the JIC chose to expand it. The stated reasons were its importance to policy discussions with the US, differences between
    the Pentagon’s and UK’s nuclear timelines, and the value of giving ministers the JIC’s view. Exclude the underlying weapons
    capabilities as operational matters.
  span_range:
  - src:30e1ce1a0ab1#p52.2
  - src:30e1ce1a0ab1#p52.7
  decision: The JIC decided to include a fuller assessment of Iraq’s WMD aspirations and potential in its 27 February 2002
    assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is the JIC’s estimate of the likelihood of Iraqi WMD terrorism, including its stated exception
    for imminent regime collapse. The JIC weighed the lack of reliable evidence of intent or transfers against the possibility
    of use under collapse conditions and the risk of US retaliation. Exclude any operational details about constructing or
    dispersing agents.
  span_range:
  - src:30e1ce1a0ab1#p47.5
  - src:30e1ce1a0ab1#p47.10
  decision: The JIC decided to assess the threat of Iraqi WMD terrorism as slight except if the regime faced serious and imminent
    collapse.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: 'The decision point is the change in the estimate from the prior assessment and the evidence experts relied on: accumulating
    reports about possible mobile facilities, reviewed alongside earlier reporting and procurement intelligence. Keep the
    focus on the credibility and weight of that evidence and the uncertainty around it; exclude technical details about biological
    agents or production.'
  span_range:
  - src:30e1ce1a0ab1#p74.5
  - src:30e1ce1a0ab1#p74.8
  decision: The CIG/JIC experts strengthened the March 2002 assessment that Iraq could produce biological agents within days,
    rather than weeks.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision concerned whether to present a broad paper on several countries or focus the public document on Iraq,
    with a more general paper potentially following later. The stated reason was the intense focus on Iraq in the public debate
    and concern that covering other countries too would attempt too much; exclude judgments about the underlying WMD intelligence.
  span_range:
  - src:30e1ce1a0ab1#p83.13
  - src:30e1ce1a0ab1#p84.11
  decision: The Foreign Secretary, with No.10’s agreement, chose to replace the planned multi-country WMD paper with a paper
    focused solely on Iraq.
  content_domain: other:government communications policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The choice was whether to release the intelligence-derived paper before the meeting or delay publication; No.10 chose
    delay. The record identifies concerns about accuracy and consistency of the figures, as well as the timing of publication;
    exclude the merits of the underlying intelligence claims.
  span_range:
  - src:30e1ce1a0ab1#p85.8
  - src:30e1ce1a0ab1#p88.9
  decision: No.10 decided to postpone publication of the Iraq WMD paper until a decent interval after the Crawford meeting.
  content_domain: other:intelligence disclosure policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 10
  focus: The choice was between announcing defensible revised estimates, using less precise language, or retaining or disguising
    the discrepancy. Focus on the decision to make the correction explicit and the reasons of defensibility and transparency;
    exclude the technical calculation of the estimates.
  span_range:
  - src:30e1ce1a0ab1#p100.4
  - src:30e1ce1a0ab1#p101.9
  decision: The Foreign Secretary chooses to correct Parliament’s published chemical-weapons estimates using revised figures
    and to issue a press notice explaining the correction.
  content_domain: other:government communication
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 11
  focus: The group weighed preserving the WMD paper’s status as a considered intelligence assessment against the advantages
    of presenting the papers together, especially the connection between WMD and inspections. Treat this as the group’s advice,
    not a final ministerial publication decision; exclude the papers’ substantive claims about Iraqi capabilities.
  span_range:
  - src:30e1ce1a0ab1#p109.4
  - src:30e1ce1a0ab1#p109.7
  decision: The inter-departmental group favors releasing the WMD, weapons-inspections, and human-rights papers as a single
    package rather than publishing the WMD paper separately.
  content_domain: other:government communication
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 12
  focus: The choice was between publishing the wider paper alongside the Iraq dossier and delaying it. The stated concerns
    were awkward comparisons between Iraq and other states and doubts about the evidence; the group also recognized the argument
    for addressing all states of WMD concern. Exclude any technical intelligence-gathering methods.
  span_range:
  - src:30e1ce1a0ab1#p109.8
  - src:30e1ce1a0ab1#p109.11
  decision: The inter-departmental group, through its advice, favors delaying publication of the separate paper on wider WMD
    programmes of concern until the way forward on Iraq is clearer.
  content_domain: other:government communication
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 13
  focus: 'The Committee chose advance public disclosure as a way to build support in Parliament and among the public for a
    decision that could put service members’ lives at risk. The recommendation also recognized a limit: do not disclose material
    that could compromise intelligence sources or methods.'
  span_range:
  - src:30e1ce1a0ab1#p111.3
  - src:30e1ce1a0ab1#p111.4
  decision: The Foreign Affairs Committee recommended that the UK Government publish the fullest possible case for further
    military action before seriously contemplating it.
  content_domain: other:government-transparency
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 14
  focus: The decision point is whether to publish the existing material or delay and develop a dossier; the stated concern
    was that the evidence would not persuade public opinion of an imminent threat. Keep the focus on the publication decision
    and its evidentiary basis, not later dossier content or military planning.
  span_range:
  - src:30e1ce1a0ab1#p115.5
  - src:30e1ce1a0ab1#p115.6
  decision: The UK Government postponed publication of the Iraq paper and commissioned a public dossier after advice that
    the available evidence would not convince the public of an imminent threat.
  content_domain: other:public-information-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 15
  focus: The decision was to defer publication while keeping the material ready for changing circumstances. The stated concern
    was that publication then would make it look as though the Government was moving towards war or beginning another phase;
    exclude any assessment of whether military action itself was justified.
  span_range:
  - src:30e1ce1a0ab1#p111.5
  - src:30e1ce1a0ab1#p112.11
  decision: No.10 officials decided in mid-July to hold publication of the Iraq papers rather than release them at that time.
  content_domain: other:public-information-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 16
  focus: The choice was whether to publish in advance or wait for a policy decision and coordinated communications. Officials
    considered that advance publication could be interpreted as evidence of preparations for military action, and that related
    work could be misconstrued as signaling a policy decision.
  span_range:
  - src:30e1ce1a0ab1#p132.11
  - src:30e1ce1a0ab1#p132.15
  decision: Officials at the 19 August interdepartmental meeting decided to resist calls to publish the dossier until it was
    tied to a ministerial policy decision and a broader media campaign.
  content_domain: other:public-information-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 17
  focus: The decision point is whether to issue strong judgments that such use was likely despite little intelligence, or
    to express greater uncertainty. The Inquiry says the judgments rested mainly on the JIC’s own assessment and a precautionary
    premise; exclude operational details about possible targets or weapons use.
  span_range:
  - src:30e1ce1a0ab1#p136.2
  - src:30e1ce1a0ab1#p138.6
  decision: The JIC decides how strongly to assess Saddam Hussein’s likely use of missiles and chemical or biological weapons
    in a conflict.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The decision point is whether to publish intelligence-based material before key decisions or defer publication, balancing
    public explanation and debate against the unusual step of disclosing intelligence. The stated reasons include mounting
    public debate, information reaching the Prime Minister, and a desire to explain the government’s concerns; exclude any
    later decision about military action.
  span_range:
  - src:30e1ce1a0ab1#p143.9
  - src:30e1ce1a0ab1#p146.11
  decision: The Prime Minister decides to bring forward publication of the Iraq WMD dossier rather than wait until key decisions
    had been taken.
  content_domain: other:public intelligence disclosure
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 19
  focus: The decision point is the Committee’s choice to give Ministers a clear, categorical judgement rather than retain
    the draft’s more caveated language. The reported reasons were that this reflected the view shared around the Committee
    and that Ministers should be told that view clearly; exclude the operational scenarios for weapons use.
  span_range:
  - src:30e1ce1a0ab1#p167.9
  - src:30e1ce1a0ab1#p168.2
  decision: The Joint Intelligence Committee decided to state as a firm key judgement that Iraq possessed chemical and biological
    weapons and Saddam was prepared to use them, despite caveats in the draft.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The decision was to place responsibility for the intelligence-based public document under the JIC Chairman, with
    the JIC formally agreeing to take it on. The stated reasons were to establish clear ownership and ensure the dossier could
    be presented as the JIC’s assessment; exclude later disputes about how the process operated unless needed to explain this
    choice.
  span_range:
  - src:30e1ce1a0ab1#p176.2
  - src:30e1ce1a0ab1#p176.11
  decision: The JIC Chairman takes ownership of the dossier process instead of the OD Secretariat.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The JIC weighed the authority and impact that references to its assessments could lend against the risk of setting
    an unhelpful precedent, and chose not to quote specific or identified assessments directly. Keep the focus on that publication
    decision, not on the dossier’s broader drafting or intelligence claims.
  span_range:
  - src:30e1ce1a0ab1#p181.8
  - src:30e1ce1a0ab1#p182.2
  decision: The JIC decides not to quote directly from identified JIC assessments in the public dossier.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The SIS chief approved a restricted recipient list for a report described as high impact, with source protection
    given as the reason for limiting circulation. The decision point is restricted versus wider official distribution; exclude
    the sensitive intelligence’s substantive allegations and any collection details.
  span_range:
  - src:30e1ce1a0ab1#p194.4
  - src:30e1ce1a0ab1#p196.9
  decision: The SIS chief approves limiting distribution of a new intelligence report to named senior officials.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 23
  focus: The SIS chief considered the new reporting too risky to include because publication could lead Iraq to detain scientists;
    the JIC Chairman agreed it would not be used in that day’s discussion. Focus on the choice to withhold the report from
    that discussion and the source-protection concern, not on the report’s operational or source details.
  span_range:
  - src:30e1ce1a0ab1#p194.11
  - src:30e1ce1a0ab1#p195.2
  decision: The JIC Chairman agrees not to feed the new SIS report into that day’s dossier discussion.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 24
  focus: The report came from a new, unproven source, but the SIS chief said it was potentially important and could not be
    withheld during a crisis. Keep the decision about intelligence dissemination and the stated uncertainty; exclude any operational
    details about the source or collection.
  span_range:
  - src:30e1ce1a0ab1#p197.10
  - src:30e1ce1a0ab1#p198.6
  decision: The SIS chief decides whether to issue the 11 September intelligence report promptly or hold it pending further
    validation.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 25
  focus: The SIS chief said he barred the reporting because it was not assessed intelligence and because he wanted to retain
    the source for inspections. The Inquiry also records that the report influenced dossier judgments, so preserve that distinction
    and do not present the competing accounts as reconciled.
  span_range:
  - src:30e1ce1a0ab1#p198.7
  - src:30e1ce1a0ab1#p199.7
  decision: The SIS chief decides whether to allow reporting from the unproven source into the public dossier or exclude it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 26
  focus: The advisers noted that the dossier showed capability but did not establish motive or an imminent threat, and argued
    for presenting the case as enforcement of UN resolutions. The Prime Minister’s foreword was described as setting out that
    distinction; exclude decisions about military action, which this passage does not establish.
  span_range:
  - src:30e1ce1a0ab1#p206.5
  - src:30e1ce1a0ab1#p207.3
  decision: The Prime Minister’s advisers decide to frame the dossier’s public case around enforcing UN resolutions and returning
    inspectors, rather than claiming an imminent threat.
  content_domain: other:public-information-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 27
  focus: 'The Prime Minister describes publication as an unprecedented choice, made to share with the public the reasons for
    his concern about a current threat and amid debate about Iraq’s WMD. The account also gives the competing confidentiality
    interest: protecting sources and not publishing detailed raw intelligence. Exclude the underlying intelligence-gathering
    methods.'
  span_range:
  - src:30e1ce1a0ab1#p222.4
  - src:30e1ce1a0ab1#p222.5
  decision: The Prime Minister chose to publish an intelligence-based dossier on Iraq while withholding raw intelligence and
    source details.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 28
  focus: The decision followed a review prompted by a senior official’s email and was justified by the lack of a standing
    JIC assessment defining the posture as defensive or offensive, alongside recent reporting that situated Iraq’s WMD aims
    in its regional ambitions. The focus is the judgment and wording used in a public assessment, not any operational use
    of weapons.
  span_range:
  - src:30e1ce1a0ab1#p219.10
  - src:30e1ce1a0ab1#p220.3
  decision: The JIC chair and Assessment Staff chose to remove the qualification that Saddam Hussein would use chemical and
    biological weapons only if his regime were under threat.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 29
  focus: After receiving a minute questioning the strength of claims about the 45-minute timeframe and chemical-agent production,
    the official decided not to raise the matter further, reasoning that the issues had already been considered with the Cabinet
    Office or were supported by the broader intelligence record. The decision concerns escalation and scrutiny of analytic
    judgments, not operational weapons use.
  span_range:
  - src:30e1ce1a0ab1#p237.5
  - src:30e1ce1a0ab1#p237.9
  decision: The senior Defence Intelligence Staff official chose not to escalate a staff member’s reservations about the dossier’s
    wording to the JIC chair.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 30
  focus: The decision point is whether to adopt the DIS’s proposed qualification or retain stronger wording in the dossier.
    The Assessments Staff said the report was consistent with existing JIC judgments, added precision, and had no caveat of
    uncertainty; exclude the underlying intelligence-collection methods.
  span_range:
  - src:30e1ce1a0ab1#p239.3
  - src:30e1ce1a0ab1#p239.8
  decision: The JIC Assessments Staff chose to state the 45-minute claim as a judgment rather than qualify it as intelligence
    that merely suggested the claim.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 31
  focus: The decision balanced protection of a highly sensitive new source against expert assessment of the report’s credibility
    and significance. The inquiry found that expert access should have been arranged and that the restriction contributed
    to an overstrong dossier assessment; exclude any covert source-handling technique.
  span_range:
  - src:30e1ce1a0ab1#p246.3
  - src:30e1ce1a0ab1#p247.6
  decision: SIS senior managers chose to restrict the new report on chemical and biological weapons production rather than
    make it available to relevant DIS technical experts.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 32
  focus: The decision point is whether to make this categorical public assertion or use less conclusive language. The Prime
    Minister said he believed the claim and considered it the conclusion compelled by the dossier; the inquiry found that
    the assessments did not support the “beyond doubt” formulation. Exclude decisions about military action, which this passage
    does not establish.
  span_range:
  - src:30e1ce1a0ab1#p253.9
  - src:30e1ce1a0ab1#p254.7
  decision: The Prime Minister chose to make the public claim that assessed intelligence had established beyond doubt that
    Iraq continued to produce chemical and biological weapons.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 33
  focus: The decision point is whether to continue with diplomacy and UN demands while preparing for possible action, or to
    accept the risk of inaction. The Prime Minister justified the course by citing Iraq’s history, the perceived future threat,
    and the need to uphold the UN’s demands; exclude operational military planning and any later decision to go to war.
  span_range:
  - src:30e1ce1a0ab1#p276.2
  - src:30e1ce1a0ab1#p277.3
  decision: The Prime Minister chose to press for Iraqi disarmament through the UN while maintaining preparedness to use force
    if diplomacy failed.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 34
  focus: The choice was whether to publish the dossier then or continue holding it until the policy way ahead was clearer.
    The report says the announcement responded to intense speculation that a decision to use force had already been taken;
    exclude the separate question of whether military action was justified.
  span_range:
  - src:30e1ce1a0ab1#p284.9
  - src:30e1ce1a0ab1#p285.4
  decision: The Prime Minister decided on 3 September 2002 to announce publication of the Iraq dossier.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 35
  focus: The choice was whether to attach the JIC’s name and authority to the public dossier or keep intelligence assessment
    distinct from the Government’s policy case. The stated aim was to give the dossier authority with Parliament and the public;
    the Inquiry found that this risked placing more weight on the intelligence than it could bear. Exclude the operational
    substance of Iraq’s weapons claims.
  span_range:
  - src:30e1ce1a0ab1#p283.8
  - src:30e1ce1a0ab1#p285.12
  decision: The UK Government and the JIC decided to present the September 2002 dossier as a JIC product and give the JIC
    ownership of its content.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 36
  focus: The decision was whether to maintain preparations and the effort to build a case or pause while awaiting further
    evidence. The Prime Minister cited the declaration as patently false, the need for proof, his expectation that Saddam
    Hussein would not cooperate, and the possibility that inspectors might find evidence; exclude the operational details
    of how evidence might be obtained.
  span_range:
  - src:30e1ce1a0ab1#p315.7
  - src:30e1ce1a0ab1#p315.9
  decision: The Prime Minister chose to continue military preparations while seeking evidence of Iraqi non-compliance and
    to take stock in January.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 37
  focus: This is the JIC’s concrete assessment of whether the declaration resolved outstanding concerns, with the alternative
    being that it did. The stated basis included that much of the material had already been submitted, outstanding questions
    remained unanswered, and little new material had been found; exclude any implication that the UK dossier itself set the
    UN’s compliance standard.
  span_range:
  - src:30e1ce1a0ab1#p319.3
  - src:30e1ce1a0ab1#p320.4
  decision: The JIC judged that Iraq’s 7 December declaration failed to address outstanding UNSCOM issues and did not change
    UK assessments of Iraq’s WMD programmes.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 38
  focus: The decision point is the JIC’s estimate of whether use was likely in the stated conflict scenarios, including the
    possibility of restraint. The JIC weighed the potential political cost of use against the desire to widen the war or inflict
    casualties, while noting uncertainty about Iraqi stocks and limited corroboration; exclude weapon-delivery details.
  span_range:
  - src:30e1ce1a0ab1#p312.5
  - src:30e1ce1a0ab1#p313.5
  decision: The JIC judged that Saddam Hussein would use chemical or biological weapons if facing defeat and might use them
    earlier in a conflict.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 39
  focus: 'The decision point is the threshold the Prime Minister publicly stated for moving from inspections to force: allow
    inspectors time to assess cooperation, but treat non-cooperation as sufficient grounds for action. Include the stated
    reasons—his view of Iraq’s WMD and concealment, and the decision to pursue the UN route; exclude operational military
    planning.'
  span_range:
  - src:30e1ce1a0ab1#p328.5
  - src:30e1ce1a0ab1#p332.13
  decision: The Prime Minister set out the UK’s position that inspectors should have time to assess Iraqi cooperation, but
    that failure to cooperate would justify military action without a discovery of WMD.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 40
  focus: The decision point is whether and how to issue the report publicly to brief journalists and support the Government’s
    account of Iraqi concealment. Consider the stated aim of informing journalists and the handling of sources and quality
    control; exclude the report’s operational descriptions of Iraqi security activity.
  span_range:
  - src:30e1ce1a0ab1#p343.7
  - src:30e1ce1a0ab1#p345.10
  decision: The No.10 communications director commissioned, edited and arranged public release of a report about Iraq’s concealment
    and security apparatus using intelligence and other material.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 41
  focus: 'This is an intelligence-related judgment stated during the Security Council’s private discussion: the Foreign Secretary’s
    stated basis was that Iraq had possessed the materials and there was no evidence of their destruction. Keep the focus
    on that inference; do not recast it as a decision to use force.'
  span_range:
  - src:30e1ce1a0ab1#p357.7
