episodes:
- n: 1
  focus: The decision was to centralize coordination under one office rather than continue with multiple elements acting without
    a single focal point. The stated reasons were unsatisfactory coordination, the need to track the status of DIA actions
    in one place, and stronger management direction and control; exclude the later assignment of individual operational and
    analytic functions.
  span_range:
  - src:1d4c966e7613#p1.5
  - src:1d4c966e7613#p1.6
  decision: The DIA Director designated a DIA element as the Office of Primary Interest for terrorism intelligence and security
    matters.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was to merge or transfer terrorism-production resources rather than leave them distributed as before.
    The memo says consolidation would strengthen current terrorism support and provide a rotational base; exclude the assigned
    collection, analysis, and support tasks themselves.
  span_range:
  - src:1d4c966e7613#p1.8
  - src:1d4c966e7613#p2.3
  decision: The DIA Director ordered terrorism-production resources and personnel to be consolidated within designated DIA
    elements.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
