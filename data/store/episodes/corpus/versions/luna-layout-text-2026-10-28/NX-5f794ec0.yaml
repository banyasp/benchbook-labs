episodes:
- n: 1
  focus: In September 1962, the Board chose to assess such a deployment as incompatible with Soviet practice and policy, rather
    than treat it as a plausible course of action. Rebuild the estimate using the stated reasoning about Soviet precedent
    and increased risk; exclude the later operational discovery of the missiles.
  span_range:
  - src:3216c5a56c56#p10.5
  - src:3216c5a56c56#p11.2
  decision: The Board of National Estimates decided that a Soviet deployment of medium- and intermediate-range ballistic missiles
    to Cuba was unlikely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Director chose organizational replacement amid criticism that the Office's estimates were too academic, insufficiently
    useful to policymakers, or irrelevant; the passage also describes efforts to bypass the Office. Rebuild the institutional
    decision and the tension between detached objectivity and policy relevance, not intelligence collection or operational
    methods.
  span_range:
  - src:3216c5a56c56#p9.4
  - src:3216c5a56c56#p10.1
  decision: The Director of Central Intelligence decided to dissolve the Office of National Estimates and replace it with
    the National Intelligence Officers system.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'After U.S. intelligence failed to anticipate the North Korean invasion and the scale of Chinese involvement, the
    DCI chose a major change to the analytic process: coordinated national estimates and a dedicated office to produce them.
    The IAC generally assented to the estimates proposal, and the DCI called for the office to be established promptly. Exclude
    later staffing and leadership decisions.'
  span_range:
  - src:3216c5a56c56#p19.1
  - src:3216c5a56c56#p19.3
  decision: The DCI decides to establish National Intelligence Estimates and an Office of National Estimates within the CIA.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: At the 1950 IAC meeting, the DCI asserts final responsibility for the estimate, with agency participation and the
    option to state substantial dissent. The cited authority is the DCI’s national-intelligence responsibility; exclude later
    operational or collection decisions.
  span_range:
  - src:3216c5a56c56#p50.3
  - src:3216c5a56c56#p52.6
  decision: The DCI decides that National Intelligence Estimate findings are his, while other intelligence agencies may concur
    or record dissent rather than outvote him.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The DCI creates a new office focused on estimates and related matters, rather than leaving the work within the existing
    arrangement. The stated rationale is to make estimates a central function of national intelligence; exclude the office’s
    later operational procedures.
  span_range:
  - src:3216c5a56c56#p52.8
  - src:3216c5a56c56#p53.3
  decision: The DCI decides to establish a dedicated Office of National Estimates for producing national estimates.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The DCI establishes IAC adoption of an estimates plan and priority list, and the IAC adopts an initial program. The
    passage explains that requests came from many quarters and that an estimate engaged expertise across the intelligence
    community; exclude judgments about the substantive accuracy of individual estimates.
  span_range:
  - src:3216c5a56c56#p53.8
  - src:3216c5a56c56#p54.3
  decision: The DCI decides that the IAC will formally initiate and prioritize National Intelligence Estimates.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The choice was to retain the JAEIC’s technical drafting role while having the Board oversee the summary and conclusions,
    with JAEIC approval. The stated reason was that the estimate’s important audience was largely nonspecialist; exclude the
    technical substance of the estimate itself.
  span_range:
  - src:3216c5a56c56#p72.1
  - src:3216c5a56c56#p72.2
  decision: The DCI decided that the Soviet atomic-energy estimate would go through the Board of National Estimates before
    presentation to the IAC, rather than proceed directly from the JAEIC to the DCI and IAC.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The IAC changed the scheduling horizon because long-range plans were repeatedly disrupted. Keep the decision to the
    early-1953 planning change; the later return to annual firm scheduling is a separate subsequent change.
  span_range:
  - src:3216c5a56c56#p66.4
  - src:3216c5a56c56#p66.4
  decision: The IAC decided in early 1953 to plan firmly for the coming quarter and tentatively for the next three, instead
    of firmly scheduling the entire year.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The alternative was a special IAC meeting, with agency representatives assigned immediately to prepare a draft for
    discussion, revision, and approval; the passage gives a presidential request before a meeting with a senior military commander
    as an example. Focus on the choice of expedited governance under urgent conditions, not on drafting techniques.
  span_range:
  - src:3216c5a56c56#p62.14
  - src:3216c5a56c56#p63.1
  decision: The DCI established an expedited IAC process for crisis estimates, replacing the normal estimate-production procedure
    when a quick estimate was needed.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The Acting DCI could wait for the absent DCI and use ordinary estimating procedures, or convene an urgent community
    meeting and produce a rapid estimate. The threatening Soviet message and ongoing crisis prompted the abbreviated process;
    exclude operational decisions about the conflict itself.
  span_range:
  - src:3216c5a56c56#p82.3
  - src:3216c5a56c56#p82.3
  decision: The Acting DCI chooses an expedited process for producing and clearing an estimate during the 1956 Suez crisis.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The DCI could follow the advice literally, including moving to a downtown office and having the deputy serve as the
    Agency’s principal executive, or signal support for stronger community coordination while remaining in place. He chose
    to elevate the deputy to full USIB membership to represent CIA in community matters; exclude broader claims about whether
    the DCI could delegate responsibility for NIEs.
  span_range:
  - src:3216c5a56c56#p83.2
  - src:3216c5a56c56#p83.3
  decision: The DCI decides how to respond to advice to separate agency management from leadership of the intelligence community.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The Secretary of Defense had to resolve whether service intelligence chiefs would retain formal USIB membership as
    DIA expanded, or whether another arrangement would preserve their input. The resulting compromise removed their formal
    membership but retained observer status, working-level participation, and the ability to express divergent views; the
    stated concern included preserving service perspectives and reducing complaints of unfair treatment.
  span_range:
  - src:3216c5a56c56#p84.2
  - src:3216c5a56c56#p84.4
  decision: The Secretary of Defense settles the representation of service intelligence chiefs on the USIB during the Defense
    intelligence reorganization.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: After the State intelligence chief argued that the estimate was irrelevant or potentially offensive in light of his
    understanding of presidential policy, the Acting USIB chair refused to withdraw it and offered dissent as the alternative.
    The decision point is the procedural choice to continue consideration while preserving a dissenting channel; exclude the
    underlying Laos policy and any operational matters.
  span_range:
  - src:3216c5a56c56#p86.2
  - src:3216c5a56c56#p86.2
  decision: The Acting USIB chair decides whether to withdraw the Laos estimate or proceed while allowing the State intelligence
    chief to dissent.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The DCI rejected the draft’s view that any arms assistance would provoke strong Arab opposition, while acknowledging
    that substantial assistance could do so and judging that moderate, largely defensive assistance might avoid the worst
    consequences. He chose separate majority and DCI paragraphs rather than forcing colleagues into a dissent footnote; exclude
    the underlying US arms decision itself.
  span_range:
  - src:3216c5a56c56#p87.3
  - src:3216c5a56c56#p87.4
  decision: The DCI chose to present the IAC majority’s and his own judgments in separate paragraphs of the Arab-Israeli estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: After seeing the all-source version, the President judged that it exposed exceptionally sensitive sources, methods,
    and substance, and ordered circulation capped at one hundred. The decision point is the balance between limiting exposure
    and broader government dissemination; exclude any details about the intelligence sources or methods themselves.
  span_range:
  - src:3216c5a56c56#p91.4
  - src:3216c5a56c56#p91.4
  decision: The President directed the DCI to limit circulation of a highly sensitive Soviet-military estimate to one hundred
    copies.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The IAC had adopted validity studies to compare earlier judgments with later developments, but after nearly three
    years and reviews covering more than a hundred estimates, the effort struggled to evaluate less tangible judgments. The
    decision point is whether to continue an assessment program with limited ability to produce convincing evaluations; exclude
    any claim that the studies established an objective accuracy score.
  span_range:
  - src:3216c5a56c56#p89.1
  - src:3216c5a56c56#p89.4
  decision: The IAC allowed the validity-study program to lapse rather than continue requiring studies of completed estimates.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The DCI could issue the agreed text immediately or hold it; he chose to hold it, taking the time into account. Keep
    the scenario focused on this issuance decision and its stated timing rationale, not on later institutional procedures.
  span_range:
  - src:3216c5a56c56#p104.2
  - src:3216c5a56c56#p104.2
  decision: The DCI decided to delay issuing the agreed estimate until the participants had rested and reviewed it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The President could leave the estimate in circulation or require it to be withdrawn, reconsidered, and resubmitted;
    he chose the latter after discovering that a substantive dissent had not been recorded and the DCI had been unaware of
    it. Exclude operational details and focus on coordination, accuracy, and treatment of dissent.
  span_range:
  - src:3216c5a56c56#p105.8
  - src:3216c5a56c56#p105.8
  decision: The President decided to have the DCI withdraw and re-coordinate an estimate after learning that a general’s dissent
    was not included.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The DCI could retain title-only attribution or require personal identification of the approving members and dissenters;
    he chose named attribution after the Secretary of Defense challenged the anonymity of a dissenter. Focus on transparency,
    accountability, and the presentation of disagreement, not on the estimate’s substantive intelligence content.
  span_range:
  - src:3216c5a56c56#p105.5
  - src:3216c5a56c56#p105.5
  decision: The DCI decided to identify signatories and named dissenters on intelligence estimates after the Secretary of
    Defense questioned an unattributed dissent.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is whether substantive findings are determined by the Board as a committee of equals or by its
    chair, who says he is personally responsible to the Director of Central Intelligence for the estimates. The passage does
    not identify the estimate’s underlying issue or evidence, so exclude any attempt to reconstruct or assess its substantive
    conclusion.
  span_range:
  - src:3216c5a56c56#p131.3
  - src:3216c5a56c56#p131.4
  decision: The Director of the Office of National Estimates overrules dissenting Board members on a substantive issue in
    a draft national estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The passage presents an estimate that the chance of a productive conference was no better than roughly 10–20 percent,
    but not zero, and gives reasons involving Khrushchev’s conduct and Soviet interests. Treat this as an estimative judgment;
    exclude later events or conclusions not included in this passage.
  span_range:
  - src:3216c5a56c56#p141.2
  - src:3216c5a56c56#p141.2
  decision: The U.S. intelligence community judges how likely Khrushchev is to allow the Paris Summit to become a productive
    exercise.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The decision point is whether to disclose the ultimatum before the meeting or preserve secrecy while there remained
    a chance to salvage the Summit. The account says disclosure would make a Soviet retreat from the ultimatum harder and
    could eliminate the prospect of substantive discussion; exclude the separate military-alert decision.
  span_range:
  - src:3216c5a56c56#p143.1
  - src:3216c5a56c56#p144.2
  decision: Officials privy to the Soviet ultimatum chose to keep it confidential until the Four’s meeting.
  content_domain: other:diplomatic confidentiality
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 23
  focus: The decision point is whether to maintain the existing military posture or adopt an alert basis after the Secretary
    of Defense judged a breakup in the atmosphere of Khrushchev’s belligerency could carry military risks. The President approved
    the action; exclude the technical implementation of the alert and the later public disclosure of it.
  span_range:
  - src:3216c5a56c56#p144.3
  - src:3216c5a56c56#p144.5
  decision: The Secretary of Defense, with the President’s approval, chose to place the Armed Forces on an alert basis amid
    concern over a possible Summit breakup.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 24
  focus: 'The decision point is the estimative judgment in the September 1962 SNIE: assess the buildup as primarily defensive
    and strategic weapons as unlikely, or judge that the USSR would establish a strategic base in Cuba. The account grounds
    the judgment in the observed buildup and the estimators’ reading of Soviet risk-taking and foreign-policy precedent; exclude
    later operational responses to the crisis.'
  span_range:
  - src:3216c5a56c56#p151.3
  - src:3216c5a56c56#p156.7
  decision: The U.S. intelligence estimators chose to assess that Soviet strategic offensive weapons in Cuba were unlikely,
    rather than conclude that the buildup was creating a strategic base.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 25
  focus: The decision point is whether to reopen the standing estimate in response to early observer reports and other pre-October
    information, or leave it in place while current-intelligence channels carried new items to policymakers. The account says
    the evidence did not justify a dramatic revision and sets out the board’s criteria for revising estimates; exclude the
    later crisis decisions.
  span_range:
  - src:3216c5a56c56#p157.8
  - src:3216c5a56c56#p158.5
  decision: The estimates board chose not to recall or formally revise the Cuba estimate before the October photographs established
    the missile sites.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 26
  focus: The decision was whether to alert the President that evening or wait while the photointerpreters continued their
    work. The stated reasons were to give the President a night’s rest and allow another night of analysis; exclude any technical
    details of the imagery or its interpretation.
  span_range:
  - src:3216c5a56c56#p163.4
  - src:3216c5a56c56#p163.5
  decision: The White House national-security adviser decided to wait until the next morning to inform the President about
    the suspected Soviet missile sites.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 27
  focus: The committee set a sequence for advance briefings to allied governments, balancing the need to keep the Soviet Union
    unaware that the United States knew of the missile deployment against the aim of informing allies before the adversary.
    Focus on the timing and policy rationale, not the mechanics of transporting personnel or documents.
  span_range:
  - src:3216c5a56c56#p164.1
  - src:3216c5a56c56#p164.2
  decision: The Executive Committee of the National Security Council decided to notify principal allies of the chosen US course
    before the President’s public announcement.
  content_domain: other:diplomatic policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 28
  focus: The briefer faced pressure to help establish the credibility of the US account amid skeptical press coverage and
    concern about public support. The account describes seeking authorization for television use and then agreeing, after
    consultation with embassy officials, to release versions to the press; exclude the methods used to alter the photographs.
  span_range:
  - src:3216c5a56c56#p167.7
  - src:3216c5a56c56#p168.6
  decision: The CIA intelligence briefer in London decided to make sanitized photographs of the Soviet buildup available to
    the British press.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 29
  focus: The decision point is the President’s choice between keeping the ambassador close for advice and releasing him to
    take up his Paris assignment; the outcome was temporizing and a late departure. Keep the focus on that staffing tradeoff,
    not on later events or the ambassador’s biography.
  span_range:
  - src:3216c5a56c56#p177.5
  - src:3216c5a56c56#p177.5
  decision: The US President chose to delay the US Ambassador’s departure for France while retaining him in Washington for
    Soviet-matters support.
  content_domain: other:diplomatic staffing
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 30
  focus: The decision point is whether to release the photographs amid skeptical British press reaction. The British Ambassador’s
    appeal emphasized that publication—especially persuasive images—could help lay audiences accept that Soviet missiles were
    installed; exclude technical image-gathering or analysis methods.
  span_range:
  - src:3216c5a56c56#p177.16
  - src:3216c5a56c56#p178.1
  decision: The US President chose to publish photographs of the Cuban missile sites the following day.
  content_domain: other:public disclosure of intelligence
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 31
  focus: The decision point is the Prime Minister’s public proposal for an inspection and his subsequent clarification that
    it did not cast doubt on the evidence presented by the US President. The stated rationale was to prepare steps in the
    UN forum if the Soviet Union vetoed action or denied the missile bases; exclude any operational details of conducting
    an inspection.
  span_range:
  - src:3216c5a56c56#p180.1
  - src:3216c5a56c56#p180.4
  decision: The Canadian Prime Minister chose to propose an on-site inspection of Cuba as a possible means of preparing for
    further United Nations action.
  content_domain: other:multilateral diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
