episodes:
- n: 1
  focus: The choice was to consolidate the separate groups rather than leave them in their existing components. The stated
    reasons include concern that military intelligence assessments were tending toward worst-case judgments and that policymakers
    were ill-served; exclude later descriptions of OSR’s structure and work.
  span_range:
  - src:a88d8fc81a52#p1.2
  - src:a88d8fc81a52#p1.4
  decision: The DCI and DDI decide to combine the CIA’s military-analysis groups into a new Office of Strategic Research (OSR).
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision followed the PFIAB’s challenge to the accuracy of CIA’s Soviet strategic estimates; the alternative
    was the usual estimation process without competing teams. The passage reports that the exercise’s most contentious issue
    concerned Soviet strategic objectives and that the DCI later judged the effort contributed little; exclude the substantive
    operational details of Soviet capabilities.
  span_range:
  - src:a88d8fc81a52#p6.3
  - src:a88d8fc81a52#p6.5
  decision: The DCI decides that the 1976 Soviet strategic estimate will use competitive analysis with an Intelligence Community
    team and an outside-expert team.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The dispute concerned whether the Soviet Union had achieved strategic superiority and whether an intelligence estimate
    should make a net assessment of US and Soviet capabilities. The DCI favored an independent CIA voice, reasoning that it
    was less influenced by policy bias and could be more objective; exclude technical details of weapons or force capabilities.
  span_range:
  - src:a88d8fc81a52#p7.3
  - src:a88d8fc81a52#p7.5
  decision: The DCI decides to support the CIA’s judgment in the Soviet strategic-capabilities estimate rather than defer
    to the military services’ contrary assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
