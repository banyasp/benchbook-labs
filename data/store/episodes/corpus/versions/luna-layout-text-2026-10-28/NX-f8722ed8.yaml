episodes:
- n: 1
  focus: When a departure is necessary because of the immediacy or gravity of a threat to people, property, or national security,
    the Guidelines permit action without prior approval, with notification as soon as practicable and written notice to the
    specified Justice Department divisions. Frame the choice as prior approval versus the urgent exception and subsequent
    oversight; exclude any operational actions taken in response to the threat.
  span_range:
  - src:8189563fc484#p14.12
  - src:8189563fc484#p15.1
  decision: The FBI Director, Deputy Director, or designated Executive Assistant Director decides whether an urgent threat
    justifies departing from the Guidelines before obtaining prior approval.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The rule requires prompt transmission or referral, but permits withholding full disclosure for specified reasons
    and calls for limited disclosure when feasible, followed by full disclosure once the need for restriction ends. Keep the
    decision about disclosure and its safeguards; exclude investigative methods.
  span_range:
  - src:8189563fc484#p36.9
  - src:8189563fc484#p36.9
  decision: An FBI field office decides whether to promptly disclose credible information about serious criminal activity
    outside FBI jurisdiction, or restrict disclosure temporarily.
  content_domain: other:law-enforcement-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 3
  focus: The guideline permits action without the usual authorization in specified urgent circumstances, directs efforts to
    consult beforehand when feasible, and requires subsequent reporting. Keep the decision about the exception to prior authorization
    and its conditions; exclude any operational details of the activity.
  span_range:
  - src:8189563fc484#p34.6
  - src:8189563fc484#p34.6
  decision: An FBI agent or employee decides whether to engage in otherwise illegal activity without required prior authorization
    when an immediate threat, investigative compromise, or significant opportunity loss makes it necessary.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 4
  focus: The guideline requires Attorney General approval and limits approval to cases where dissemination is needed for specified
    national-security, foreign-intelligence, or foreign-affairs purposes; it also states exceptions for information about
    foreign intelligence services and White House contacts. Keep the authorization and purpose test; exclude the substance
    of any collection or dissemination technique.
  span_range:
  - src:8189563fc484#p40.1
  - src:8189563fc484#p40.1
  decision: The Attorney General decides whether compromising information about domestic officials or political organizations,
    or U.S. persons’ political activity, may be disseminated to the White House.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
