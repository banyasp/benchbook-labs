  focus: The decision point is whether to apply a precautionary default for US-person information or reveal entities without
    that safeguard; the passage states that the team instructed the vendor to use the precautionary default. Focus on the
    information-protection rule and note that the passage does not specify its governing legal authority; exclude technical
    means of establishing associations.
