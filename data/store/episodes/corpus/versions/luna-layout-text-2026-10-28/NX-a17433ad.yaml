episodes:
- n: 1
  focus: The MFL assessed the mission risk, the 77th Fighter Squadron Director of Operations approved the recorded risk level,
    and the morning Top 3 authorized the flight. The report identifies the risk factors and the omitted or incorrectly counted
    worksheet entries that would have required higher-level approval; exclude flight-planning and flying techniques.
  span_range:
  - src:f1b5ebd4296c#p11.6
  - src:f1b5ebd4296c#p12.2
  decision: The flight leadership approved and authorized the night training sortie at the recorded moderate risk level rather
    than elevating the risk decision to the Operations Group Commander.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The SOF believed the checklist adequately addressed the situation and that manufacturer consultation was for situations
    not covered by a checklist, depending on time available; the report notes that the manual called for technical assistance
    if time and conditions permitted. Keep the focus on the consultation decision and its rationale, excluding technical arrestment
    or ejection procedures.
  span_range:
  - src:f1b5ebd4296c#p20.2
  - src:f1b5ebd4296c#p20.4
  decision: The SOF chose not to seek Lockheed Martin technical assistance during the in-flight emergency, relying instead
    on the landing-gear checklist.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The checklist raised ejection if conditions were unfavorable, but the group proceeded with the cable option; the
    MEL considered the aircraft landable because the nose gear appeared down and locked, and the SOF later recommended continuing
    because the gear appeared down and unlikely to have unlocked in flight. The report says relevant favorable and unfavorable
    factors were not discussed; exclude the operational mechanics of the arrestment and ejection.
  span_range:
  - src:f1b5ebd4296c#p18.2
  - src:f1b5ebd4296c#p21.4
  decision: The SOF, MEL, and MP proceeded with the approach-end cable arrestment rather than choosing ejection after the
    landing gear was damaged.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to continue or stop resuscitation after the paramedics’ trauma assessment and physician
    consultation; the stated reason was the severity of the injuries. Exclude the medical treatment details themselves.
  span_range:
  - src:f1b5ebd4296c#p26.4
  - src:f1b5ebd4296c#p26.6
  decision: The on-call physician ordered the cessation of life-saving measures after assessing the severity of the pilot’s
    injuries.
  content_domain: other:medical ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to approve continued use of the expiring DRS or require replacement before further
    use. The source cites parts availability and maintenance consolidation as reasons; exclude technical analysis of the DRS
    failure itself.
  span_range:
  - src:f1b5ebd4296c#p27.7
  - src:f1b5ebd4296c#p27.7
  decision: AFLCMC approved temporary extensions of the DRS service life, including a final extension through July 31, 2020.
  content_domain: other:aviation maintenance safety
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to seek manufacturer assistance or rely on the available checklist and local judgment
    when the aircraft had damaged landing gear and a hydraulic failure. The SOF said the checklist appeared to cover the situation;
    exclude the technical procedures for cable arrestment or ejection.
  span_range:
  - src:f1b5ebd4296c#p44.5
  - src:f1b5ebd4296c#p45.2
  decision: The SOF chose not to request Conference Hotel technical assistance during the in-flight emergency.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
