episodes:
- n: 1
  focus: The decision point is the President’s choice of organizational structure amid the prospect of opposition from the
    Secretary of Defense, the Vice President, and congressional committees. Exclude the later day-to-day allocation of responsibilities
    except as context for the matrix structure.
  span_range:
  - src:67514690d679#p2.3
  - src:67514690d679#p2.5
  decision: The President chose an ODNI matrix structure rather than a Department of Intelligence that would place DOD intelligence
    agencies under DNI direction.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether DNI leadership would seek legal authorization to address longstanding FISA deficiencies,
    against a history of inaction and concern about controversy. Keep the focus on authorization and its stated national-security
    rationale; exclude collection methods and operational details.
  span_range:
  - src:67514690d679#p3.3
  - src:67514690d679#p3.5
  decision: The DNI leadership chose to pursue FISA authorization and implementation to address known deficiencies rather
    than leave them unaddressed.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
