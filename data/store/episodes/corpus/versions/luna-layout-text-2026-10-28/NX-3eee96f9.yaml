- n: 2
  focus: 'Treat this as an investigative factfinding decision: the AIB president considered competing explanations, including
    loss of consciousness and aircraft failure, and stated the evidence supporting the causal findings. Exclude the pilot’s
    in-flight maneuvers as a separate decision scenario; those concern operational technique.'
  span_range:
  - src:bcbc752c3c58#p32.2
  - src:bcbc752c3c58#p33.4
  decision: The AIB president determined, under a preponderance-of-the-evidence standard, that pilot fixation and failure
    to scan instruments caused the mishap, with reduced visibility and spatial disorientation substantially contributing.
