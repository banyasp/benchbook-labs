  focus: After the aircraft crashed, tactical execution briefly continued and formation members tried to contact the mishap
    pilot without response. The instructor pilot ended the scenario; focus on the command decision and its safety rationale,
    not on the subsequent search methods.
  span_range:
  - src:bcbc752c3c58#p21.5
  - src:bcbc752c3c58#p21.5
  decision: The instructor pilot decided to end tactical execution with a “Knock-it-off” call.
  content_domain: operational-command
  refusal_sensitivity: low
