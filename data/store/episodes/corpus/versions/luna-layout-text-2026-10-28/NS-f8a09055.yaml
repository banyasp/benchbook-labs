  focus: The account says the pilots apparently mistook the orange identification panels for rocket launchers; one pilot sought
    a marker to resolve confusion, but the other attacked without waiting, and the pilots still doubted the vehicles’ identity
    before a second attack. Treat this as a decision about whether to engage and under what authorization, not how the attack
    was carried out.
  span_range:
