prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: After the treaty was signed, the administration chose to channel reporting on compliance through the NSC committee
    and limit further dissemination. The stated reason was to preserve flexibility to raise problems with the Soviets without
    the issues appearing in the press or being exposed to Congress; exclude the merits of the treaty or any intelligence-collection
    methods.
  span_range:
  - src:dd799cf15c48#p9.3
  - src:dd799cf15c48#p9.4
  decision: The administration, at the National Security Adviser’s direction, restricted dissemination of intelligence about
    Soviet compliance with SALT I to a high-level NSC committee rather than sharing it more broadly, including with Congress.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: When the committee requested the photographs amid congressional concern about possible Soviet expansion, the DCI
    chose to accommodate the committee rather than follow the National Security Adviser’s preference to withhold them. The
    stated basis was the committee’s oversight role; exclude how the photographs were obtained or any technical details about
    them.
  span_range:
  - src:dd799cf15c48#p8.6
  - src:dd799cf15c48#p8.7
  decision: The DCI allowed the House Armed Services Committee to see reconnaissance photographs of the Soviet base at Cienfuegos
    despite the National Security Adviser’s objection.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: After a public hearing disclosed classified information, the President chose to suspend information-sharing with
    the committee rather than continue it under the existing arrangement. The stated condition for resuming access was an
    agreed process for deciding what information could be made public; exclude the substance of the committee’s intelligence
    inquiries.
  span_range:
  - src:dd799cf15c48#p11.2
  - src:dd799cf15c48#p11.3
  decision: The President halted the flow of information to the Pike Committee after classified information was disclosed
    at a hearing, pending agreement on a process for deciding what could be made public.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: A Member says the public needs to know the briefing’s contents and claims to be declassifying them; an analyst reminds
    her the briefing is classified, and staff prevent disclosure. Focus on the decision to disclose or restrain disclosure
    and the stated public-interest and classification concerns; do not infer the Member’s legal declassification authority
    or the staff’s formal authority.
  span_range:
  - src:dd799cf15c48#p23.1
  - src:dd799cf15c48#p23.1
  decision: Congressional staff restrain a Member’s attempted disclosure of a classified intelligence briefing.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: CIA accommodated the request by offering individual briefings to interested undecided Members, despite the risk that
    intelligence supporting the administration’s position could be perceived as partisan persuasion. The stated reasons included
    that Members on both sides of the aisle were encouraging colleagues to seek the briefing and that analysts would avoid
    policy prescriptions; exclude any broader claim that this resolved the risk of political influence.
  span_range:
  - src:dd799cf15c48#p43.7
  - src:dd799cf15c48#p44.1
  decision: CIA decides whether and how to brief undecided Members of Congress on a treaty at the administration’s request.
  content_domain: other:intelligence-sharing
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 6
  focus: Several Senators voted against the authorization after receiving repeated intelligence briefings that described Iraqi
    forces as highly capable, predicted chemical and biological weapons use, and forecast a prolonged conflict with many casualties.
    The passage later reports that coalition forces prevailed quickly with relatively few U.S. casualties; keep the decision
    focused on the Senators’ authorization vote and the intelligence informing it, not on operational military details.
  span_range:
  - src:dd799cf15c48#p51.7
  - src:dd799cf15c48#p52.1
  decision: Senators decide whether to authorize the President to send U.S. troops to the Persian Gulf.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
