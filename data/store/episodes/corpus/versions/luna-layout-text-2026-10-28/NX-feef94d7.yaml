  focus: The decision point is the Army’s institutional choice between centralized archiving and a branch-embedded model that
    routes operational feedback to capability developers. The source gives delay in turning field observations into DOTMLPF-P
    solutions, LSCO demands, and modernization schedules as reasons for the change; it does not identify a specific approving
    official or authority. Exclude later recommendations about reporting procedures and digital tools.
  span_range:
  - src:8429bcd7b04c#p5.1
  - src:8429bcd7b04c#p5.3
  decision: The Army chose to decentralize lessons-learned management through branch-level TLLMs rather than rely on the centralized
    CALL model.
  content_domain: other:military organizational policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The specific scenario is a unit preparing to incorporate the Newest C2 System despite lacking immediate access and
    training, while its incoming staff lacked visibility into outgoing-force data products. TLLM-C2ID chose an assistance
    plan rather than leaving the unit to navigate those barriers alone; the source describes the plan and the barriers, but
    does not state a distinct approving authority. Exclude the technical details of building dashboards and managing system
    access.
  span_range:
  - src:8429bcd7b04c#p10.1
  - src:8429bcd7b04c#p10.3
  decision: TLLM-C2ID chose to provide a Regional Support Group with an immediate, structured C2 training and continuity intervention
    before deployment.
