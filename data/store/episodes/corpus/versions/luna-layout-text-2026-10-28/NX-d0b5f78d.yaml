  focus: The doctrine distinguishes time-competitive decisions in execution, where it recommends rapid decisionmaking to gain
    tempo, from deliberate planning when time is not limiting, where it says not to rush unnecessarily. Keep the decision
    at this conditional policy level; exclude operational details about any particular action.
  span_range:
  - src:026989934151#p89.4
  - src:026989934151#p89.4
  decision: A military commander decides whether to accelerate a decision or take more time, depending on whether time is
    limiting.
