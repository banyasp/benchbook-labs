- n: 2
  focus: The doctrine recommends designating the second unit as the main effort and redirecting combat power to it, rather
    than continuing with the original effort or following a predetermined scheme. It gives the fleeting nature of gaps and
    the need to respond quickly to opportunity as reasons; exclude the operational details of exploiting the gap.
  span_range:
  - src:026989934151#p97.2
  - src:026989934151#p97.2
  decision: The commander decides whether to shift the main effort to a unit that has found a gap after the current main effort
    encounters a surface.
