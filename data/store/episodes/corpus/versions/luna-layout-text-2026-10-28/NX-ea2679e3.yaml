- n: 1
  focus: The decision point is the strategic choice to carry the war into Northern territory, with a hoped-for battlefield
    victory serving political aims. Consider the stated aims of forcing peace, affecting Northern elections, and influencing
    European recognition; exclude the specific military objectives and methods of the campaign.
  span_range:
  - src:d0578a3f4964#p3.1
  - src:d0578a3f4964#p3.2
  decision: The Confederate army commander chose to invade the North rather than continue the campaign solely on Southern
    soil.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is how to act on newly obtained intelligence while the commander believed the opposing force was
    substantially larger. Focus on the choice and the stated reasons for caution; exclude details of troop movements or how
    an attack might be conducted.
  span_range:
  - src:d0578a3f4964#p4.4
  - src:d0578a3f4964#p4.5
  decision: The Union army commander chose to advance cautiously after receiving the Confederate orders, rather than promptly
    exploit the apparent division of the opposing army.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the timing and political framing of the Proclamation in light of the military outcome. Consider
    the stated military, political, and psychological rationale and the contrast with issuing it after defeat; exclude speculation
    about the Proclamation’s broader effects beyond what the passage states.
  span_range:
  - src:d0578a3f4964#p5.4
  - src:d0578a3f4964#p5.4
  decision: The Union president chose to use the Antietam victory as the occasion to give public meaning to the Emancipation
    Proclamation.
  content_domain: 'other: emancipation policy'
