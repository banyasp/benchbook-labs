- n: 1
  focus: The decision point is whether to advance promptly or wait for firmer information about the location of the Confederate
    rear elements. The commander relied on Babcock’s emphatic report and other reports pointing the same way, although the
    report placed the rear of the Confederate army too far ahead; include the stated concern about protecting Washington and
    the margin for error, but exclude the intelligence-gathering methods.
  span_range:
  - src:cb7576566621#p14.4
  - src:cb7576566621#p15.1
  decision: The Union army commander orders the army to advance into Maryland after receiving reports that the Confederate
    army has crossed the Potomac.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to keep the army dispersed or urgently concentrate it near Gettysburg. The report came
    from a source the commander initially doubted, but the army’s wide dispersion left its elements vulnerable to being defeated
    separately, and the selected location was reachable by the infantry within a day or two; exclude the source’s collection
    or movement techniques.
  span_range:
  - src:cb7576566621#p16.2
  - src:cb7576566621#p16.3
  decision: The Confederate commander orders a concentration of the dispersed army around Gettysburg after receiving a report
    that Federal forces are in Maryland.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The choice was whether to retreat or remain in position for the next day’s fighting. The council rejected retreat,
    which the commander accepted as his decision; the intelligence assessment showed that nearly all Confederate infantry
    had fought and that the remaining division was present and expected to be committed, while fresh Union troops offered
    a substantial advantage. Include the demoralizing effect of retreat as a consideration, but exclude operational details
    of the anticipated attack.
  span_range:
  - src:cb7576566621#p17.4
  - src:cb7576566621#p18.2
  decision: The Union army commander decides to stand rather than retreat after the July 2 council of war at Gettysburg.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
