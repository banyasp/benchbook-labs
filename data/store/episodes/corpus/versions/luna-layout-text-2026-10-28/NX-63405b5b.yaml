  focus: In 1976, the President issued an executive order requiring covered employees to sign secrecy agreements and directing
    programs to protect intelligence sources and methods, establishing the basis for prepublication review boards. The alternative
    was to rely on secrecy agreements without a formal review process; the article cites concern that agencies otherwise could
    not be assured employees would not disclose sensitive information, and the Marchetti case as context. Exclude the operational
    details of intelligence activities and focus on the legal and policy choice to create review requirements.
