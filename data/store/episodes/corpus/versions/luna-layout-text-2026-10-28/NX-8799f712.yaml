episodes:
- n: 1
  focus: At the November 10 meeting, the chief of staff urged a public statement because the Administration was losing credibility,
    but the resulting statement did not confirm that arms sales had occurred. The President, Vice President, and national
    security adviser opposed telling the story publicly at that point because they considered it too risky. Exclude the operational
    details of the arms transactions.
  span_range:
  - src:88c0a340bba5#p1.6
  - src:88c0a340bba5#p1.8
  decision: The President and senior advisers chose a limited public statement about the Iran arms sales rather than fuller
    disclosure.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The chief of staff knew the President had been briefed about the shipment, yet did not correct the Attorney General’s
    claim that the President did not know. He explained that he wanted to establish whether there was a legal violation and
    understand the suspected diversion before speaking up. Exclude the shipment’s operational details; focus on the choice
    to correct or withhold correction of the record.
  span_range:
  - src:88c0a340bba5#p1.31
  - src:88c0a340bba5#p1.35
  decision: The White House chief of staff chose not to correct the Attorney General’s false account of the President’s knowledge
    of the 1985 HAWK shipment at the November 24 meeting.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The plan proposed that the national security adviser resign, that the operations be characterized as a rogue undertaking
    without the President’s knowledge or sanction, and that a review board examine NSC actions. The decision point is whether
    to take responsibility more broadly or contain the crisis by distancing the President and assigning blame to the NSC staff;
    exclude the underlying operational activities.
  span_range:
  - src:88c0a340bba5#p1.46
  - src:88c0a340bba5#p1.47
  decision: The White House chief of staff adopted a crisis-response plan that placed responsibility for the Iran/contra actions
    on the National Security Council staff and proposed personnel changes and a review board.
  content_domain: other:government-accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The President publicly urged use immunity as a way to obtain the full story and move past the controversy, while
    stating that it would not prevent the Independent Counsel from pursuing justice. The decision point is whether to seek
    immunity to enable testimony despite its possible effects on investigation and prosecution; exclude speculation about
    the witnesses’ testimony beyond what the passage states.
  span_range:
  - src:88c0a340bba5#p1.50
  - src:88c0a340bba5#p1.51
  decision: The President chose to ask the Senate intelligence committee to grant use immunity to the two former National
    Security Council officials so they could testify about the Iran/contra matter.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: 'Regan’s account describes the President as upset but deciding not to act after the fact; a possible hostage release
    was a stated consideration. Treat this as a reported decision, not a settled historical finding: Regan’s accounts changed,
    and the document notes conflicting testimony about prior authorization.'
  span_range:
  - src:88c0a340bba5#p1.55
  - src:88c0a340bba5#p1.57
  decision: The President chose to leave the August–September 1985 Israeli arms shipment to Iran alone after learning it had
    already occurred.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: Regan’s Grand Jury account says the President authorized replenishment because the shipment was a fait accompli and
    Israel was a staunch ally. Keep the decision distinct from leaving the original shipment alone, and note that Regan’s
    testimony on replenishment conflicted with his earlier accounts.
  span_range:
  - src:88c0a340bba5#p1.57
  - src:88c0a340bba5#p1.58
  decision: The President chose to authorize replenishment of Israeli weapons stocks after the 1985 shipment, according to
    Regan’s later testimony.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The report says this choice followed investigation of possible concealment and delayed production of notes. It cites
    the lack of usable evidence of orchestration, the notes’ investigative value, and the Chief of Staff’s apparently forthright
    testimony; exclude the separate question of whether the underlying arms transactions were lawful.
  span_range:
  - src:88c0a340bba5#p1.72
  - src:88c0a340bba5#p1.73
  decision: The Independent Counsel chose to develop the Chief of Staff as a witness rather than a target.
  content_domain: other:prosecutorial judgment
  refusal_sensitivity: low
  held_out: false
  natsec: false
