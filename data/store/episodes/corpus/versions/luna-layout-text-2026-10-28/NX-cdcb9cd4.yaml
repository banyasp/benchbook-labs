- n: 2
  focus: The DCI weighed stonewalling against giving committees a fuller account of Agency activities, and proposed cooperating
    while omitting names. The stated reasons include avoiding an ineffective stonewall, giving the committees context, and
    protecting people whose identities could put them at risk; exclude details of intelligence operations themselves.
  span_range:
  - src:75a2757ff785#p7.4
  - src:75a2757ff785#p7.7
  decision: The DCI chose to cooperate with congressional investigations while withholding the names of intelligence personnel
    and agents.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'After reviewing the program, Colby recommended ending it rather than continuing it: he identified conflicts with
    postal law and found no evident results. The later account confirms the program was cut off; exclude any description of
    how mail was opened or examined.'
  span_range:
  - src:75a2757ff785#p10.1
  - src:75a2757ff785#p12.2
  decision: The DCI, acting on Colby’s recommendation, chose to end the Agency’s mail-opening program.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The interview describes the director’s cooperation with the committees and his stated belief that he was constitutionally
    obligated to provide the documents; senior executive officials reportedly argued against sending them. The former director’s
    preferred alternative was to seek presidential support and, if necessary, have the question resolved by the Supreme Court.
    Exclude operational details of the secret activities documented in the files.
  span_range:
  - src:75a2757ff785#p20.4
  - src:75a2757ff785#p21.5
  decision: The CIA director decided whether to provide secret-operation documents requested by congressional committees or
    seek presidential backing to withhold them and litigate the disclosure question.
