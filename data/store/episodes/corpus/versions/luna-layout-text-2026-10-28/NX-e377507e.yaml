episodes:
- n: 1
  focus: The Director could refuse or authorize the profile; he proceeded after the White House asserted that the profile
    was needed and that CIA had the capability. Focus on the propriety of using CIA resources to profile a U.S. citizen for
    a politically charged purpose, and exclude the profile’s preparation or contents.
  span_range:
  - src:4af048689ff3#p4.6
  - src:4af048689ff3#p5.6
  decision: The Director of Central Intelligence decides to authorize CIA preparation of a psychological profile of a U.S.
    citizen at the White House’s request.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The White House asked CIA leadership to raise the possibility that the FBI investigation could encounter CIA operations;
    the Deputy Director conveyed that concern and urged the FBI to taper the inquiry, while the Director set limits on what
    should be said. Focus on the decision to intervene in an FBI investigation and the balance between protecting covert projects
    and allowing law enforcement to proceed; exclude investigative methods.
  span_range:
  - src:4af048689ff3#p8.4
  - src:4af048689ff3#p11.5
  decision: The Deputy Director of Central Intelligence, with the Director’s involvement, decides to ask the acting FBI director
    to limit or taper the Mexico portion of the Watergate investigation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The White House sought unvouchered CIA funds for bail and continued support for the arrested men. CIA leadership
    declined, citing the Director’s authority over such funds, required congressional reporting, and the danger of drawing
    CIA further into the scandal; exclude details of any covert financial mechanisms.
  span_range:
  - src:4af048689ff3#p11.4
  - src:4af048689ff3#p12.5
  decision: The Deputy Director of Central Intelligence refuses a White House request to use CIA funds for the Watergate defendants,
    with the Director affirming that the agency will not provide the funds.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to stay in the post or resign amid the controversies; the text says the director believed
    he could better care for the agency by staying. Exclude speculation about whether the president dismissed him because
    of Watergate, which the passage says is uncertain.
  span_range:
  - src:4af048689ff3#p14.5
  - src:4af048689ff3#p14.5
  decision: The CIA director chose to remain in office rather than resign during the Watergate-related controversies.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
