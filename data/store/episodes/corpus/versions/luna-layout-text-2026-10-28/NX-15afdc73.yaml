episodes:
- n: 1
  focus: The decision was whether to approve the proposed visit or hold it while reciprocity was reviewed. The Department
    treated the requests as part of a concerted effort to gain information on U.S. automation and computer technology, amid
    the USSR’s refusal to include automation specialists in the exchange agreement; exclude operational details about computer
    research.
  span_range:
  - src:cfc219b39c0b#p4.1
  - src:cfc219b39c0b#p4.4
  decision: The State Department deferred approval of the proposed two-month visit by two Soviet scientists to the NYU Computing
    Center pending a review of reciprocity requirements.
  content_domain: other:scientific-and-cultural-exchange-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision was whether to allow the proposed extensive itinerary or restrict the visit. The visitor was described
    as a capable economic expert with a record of involvement with Soviet intelligence services, and the requests were viewed
    as part of an effort to obtain information on U.S. automation and computer technology; exclude operational details about
    research or intelligence collection.
  span_range:
  - src:cfc219b39c0b#p4.2
  - src:cfc219b39c0b#p5.3
  decision: The State Department curtailed the proposed itinerary of the Soviet exchange visitor sponsored by the American
    Council of Learned Societies, limiting it to brief visits at eastern university computer centers conducting unclassified
    research.
  content_domain: other:scientific-and-cultural-exchange-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: The decision was whether to grant the plant visit and how to handle similar requests in future. The request was treated
    as part of a concerted effort to obtain information on U.S. automation and computer technology, and the Embassy had bypassed
    the State Department; exclude technical or operational details about the facility.
  span_range:
  - src:cfc219b39c0b#p4.1
  - src:cfc219b39c0b#p5.4
  decision: The State Department refused the Soviet educational delegation’s request to visit IBM’s Rochester plant and directed
    the Soviet Embassy to submit future requests of this kind through the Department rather than directly to a company or
    laboratory.
  content_domain: other:scientific-and-cultural-exchange-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
