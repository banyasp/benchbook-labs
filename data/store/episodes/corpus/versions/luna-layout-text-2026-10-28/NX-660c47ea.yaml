episodes:
- n: 1
  focus: The decision point is whether to follow the technical-order requirement for collars or omit them, despite the hazard
    of breakers being reset during later maintenance. The report attributes the omission partly to a unit culture of non-use;
    exclude the physical method of accessing or manipulating the breakers.
  span_range:
  - src:9ac45b0d766d#p35.2
  - src:9ac45b0d766d#p38.1
  decision: The maintenance technician responsible for AMED removal decides whether to install the required circuit-breaker
    collars after pulling the associated breakers.
  content_domain: other:maintenance-safety
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The report describes a choice between the directed, technical-order-compliant AGE method and use of the APU, which
    the supervisor was reported to have directed. It cites the APU’s speed and the view that the method did not matter if
    fuel was removed safely; exclude details of how to operate or reconfigure the aircraft.
  span_range:
  - src:9ac45b0d766d#p36.1
  - src:9ac45b0d766d#p36.3
  decision: The 7-Level maintenance supervisor decides whether to direct defueling with AGE as instructed or with the APU.
  content_domain: other:maintenance-safety
  refusal_sensitivity: low
  held_out: false
  natsec: false
