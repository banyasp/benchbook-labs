  focus: The decision point is the reorganization of national cryptology after AFSA failed to unify service agencies. The
    passage identifies fragmentation, duplication, shortcomings exposed in Korea, and civilian dissatisfaction as reasons
    for change; exclude the later headquarters-location decision.
