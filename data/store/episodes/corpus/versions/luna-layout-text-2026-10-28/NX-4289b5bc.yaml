episodes:
- n: 1
  focus: The decision point is Parliament’s choice of the scope of amnesty in the transition from apartheid, including immunity
    from criminal and civil liability for acts meeting the Act’s conditions. The court cites reconciliation and reconstruction
    as the constitutional rationale; exclude individual Committee decisions on amnesty applications.
  span_range:
  - src:e36f9b25e631#p1.2
  - src:e36f9b25e631#p1.15
  decision: Parliament chose to enact a comprehensive amnesty that did not distinguish between acts committed in defense of
    the old order and acts committed in resistance to it.
  content_domain: other:legislative policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The court faced the choice whether to invalidate section 20(7) or uphold it, considering the constitutional authorization
    for amnesty and the applicants’ arguments about prosecution and international law. The court emphasized reconciliation
    and the circumstances of internal conflict; exclude the Committee’s future decisions on individual applications.
  span_range:
  - src:e36f9b25e631#p1.4
  - src:e36f9b25e631#p1.15
  decision: The Constitutional Court rejected the challenge to the constitutionality of section 20(7), upholding the amnesty-related
    bar on criminal and civil liability.
  content_domain: other:constitutional adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
