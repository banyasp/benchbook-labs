  focus: After the 9/11 Commission recommended restructuring, the NSA director viewed the proposal as a threat to intelligence
    agencies and warned that a feckless DNI could make matters worse. The decision was to seek modifications that would create
    a less threatening office; exclude the separate question of whether the restructuring itself was desirable.
