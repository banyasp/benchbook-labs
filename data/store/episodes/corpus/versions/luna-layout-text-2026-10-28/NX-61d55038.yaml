- n: 2
  focus: The decision point is whether to create a dedicated analytic element despite the Directorate of Operations’ objection,
    rather than leave the issue without a specialized unit. Include the stated capability gap and the dispute over the group’s
    remit; exclude any special-collection initiatives or operational methods.
  span_range:
  - src:06e06a5fa0df#p6.6
