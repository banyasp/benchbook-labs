  focus: In response to the 1991 defense-intelligence restructuring directive, USEUCOM had to establish a JIC and select a
    site, with alternatives including other installations or retaining a distributed structure. The passage gives reasons
    for Molesworth, including its existing security and facilities, available space, and the broader pressure to reduce forces
    and consolidate capabilities; exclude the technical details of intelligence operations.
