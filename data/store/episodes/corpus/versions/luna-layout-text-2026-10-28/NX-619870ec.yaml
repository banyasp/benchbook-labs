title: A History of US Communications
collection: nsa-cch
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The decision point is whether to continue the Army program and disclose it to the incoming Secretary of War, given
    the concern that he might dismantle it. Exclude the technical details of COMINT operations and later dissemination arrangements.
  span_range:
  - src:9b9324f225ca#p24.2
  - src:9b9324f225ca#p24.2
  decision: The President directs that Army COMINT operations continue and that the Secretary of War not be informed of them.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to keep the material within its prior FBI-centered distribution or share it with other
    agencies. The stated reason is that the FBI was not properly sharing the material; exclude the underlying interception
    and cryptanalysis.
  span_range:
  - src:9b9324f225ca#p19.2
  - src:9b9324f225ca#p19.2
  decision: The Assistant Secretary of the Treasury directs Coast Guard intelligence to disseminate its COMINT to the State
    Department, Army, and Navy.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to share sensitive U.S. cryptologic information with Britain despite Navy opposition
    and concerns about reciprocal risk. The Army’s stated reasons include gaining access to foreign military traffic unavailable
    from U.S. resources and materially assisting Britain; exclude the mission’s travel and operational details.
  span_range:
  - src:9b9324f225ca#p29.3
  - src:9b9324f225ca#p30.2
  decision: Army leadership approves an exchange of COMINT information with the British, including information about the Japanese
    PURPLE system.
  content_domain: other:intelligence-sharing-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: In June 1942, the assistant chief of staff for intelligence recommended moving control from the Signal Corps to the
    Military Intelligence Service, rather than retaining the existing arrangement. The stated rationale was that COMINT operating
    decisions were intelligence decisions and Signal Corps officers lacked the necessary training and information; the proposal
    was rejected, but the passage does not explain the opposition’s reasons.
  span_range:
  - src:9b9324f225ca#p46.2
  - src:9b9324f225ca#p46.4
  decision: The Army’s senior intelligence leadership recommends transferring control of Army COMINT and cryptography to the
    Military Intelligence Service.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: After the theater commander requested COMINT and cryptographic personnel, citing delays in receiving intercepts from
    Washington, the War Department sent personnel and authorized the commander to assign intercept directives. Treat this
    as a decision about the allocation of intelligence authority and support; exclude the mechanics of interception or other
    collection procedures.
  span_range:
  - src:9b9324f225ca#p50.1
  - src:9b9324f225ca#p50.2
  decision: The War Department grants the Pacific theater commander a local COMINT unit and authority to set its intercept
    directives.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The passage contrasts divided authority between ONI and OP-20-G with Redman’s view that the division was unworkable;
    Horne chose to put COMINT policy entirely under Naval Communications while ONI retained an evaluative role. Focus on the
    allocation of authority and the stated rationale, not on COMINT collection or processing techniques.
  span_range:
  - src:9b9324f225ca#p57.1
  - src:9b9324f225ca#p57.1
  decision: The Chief of Naval Communications decided to place all Navy COMINT policy under Naval Communications, removing
    the Office of Naval Intelligence’s control.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: 'The passage states King’s dissemination rule and its purpose: avoiding any apparent correlation between the intelligence
    source and the operational outcome. Treat this as a policy decision about dissemination standards; exclude technical details
    of collection or communications.'
  span_range:
  - src:9b9324f225ca#p57.2
  - src:9b9324f225ca#p57.2
  decision: The Chief of Naval Operations decided that COMINT passed to subordinate commanders would be provided only as operational
    directives.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: Redman proposed that the Army assume all diplomatic coverage and processing, and the allocation committee formalized
    the division. The stated reasons were efficiency and the Navy’s greater Japanese naval workload; exclude technical details
    of cryptanalysis and processing.
  span_range:
  - src:9b9324f225ca#p62.1
  - src:9b9324f225ca#p62.3
  decision: The Director of Naval Communications decided to transfer diplomatic COMINT work to the Army, with the Navy retaining
    internal dissemination.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The Joint Chiefs recommended limiting COMINT processing to the Army, Navy, and FBI, and Roosevelt directed discontinuance
    of cryptanalytic units in other named agencies. Focus on the choice about agency responsibility and its stated organizational
    basis; the directive did not discontinue intercept activity generally.
  span_range:
  - src:9b9324f225ca#p63.2
  - src:9b9324f225ca#p64.1
  decision: The President decided to discontinue cryptanalytic units in the Office of the Director of Censorship, the FCC,
    and the OSS.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: Redman argued for a change because he viewed COMINT as requiring communications expertise and described the incumbent
    as a weak administrator without that training; the passage says the commander was replaced. Focus on the command and qualification
    judgment, not on the technical methods mentioned as background.
  span_range:
  - src:9b9324f225ca#p75.1
  - src:9b9324f225ca#p75.2
  decision: Navy leadership decided to replace the commander of the Pacific Fleet radio intelligence unit.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The commander objected that his communications officer held a private cipher system for direct communication with
    Washington that bypassed him, and required future messages to be cleared through his office. Focus on the authority and
    accountability decision; exclude details of cipher systems or communications methods.
  span_range:
  - src:9b9324f225ca#p76.3
  - src:9b9324f225ca#p76.3
  decision: The Pacific Fleet commander required messages to OP-20-G and the Director of Naval Communications to be cleared
    through him.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: After a management study recommended a Combat Intelligence Branch, the Commander-in-Chief decided to establish F-2
    on the COMINCH staff and route Navy Department-level COMINT there, rather than to multiple intelligence offices including
    ONI. Focus on the organizational choice and rationale for unified evaluation; exclude details of COMINT production or
    transmission.
  span_range:
  - src:9b9324f225ca#p87.3
  - src:9b9324f225ca#p88.1
  decision: The Commander-in-Chief established a Combat Intelligence Division to consolidate Navy-level evaluation of COMINT.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The Army draft would have had the Army produce a summary for both services, while material for outside dissemination
    would remain with the service that produced it. The Navy rejected the proposal because it risked creating the unified
    COMINT organization the Navy opposed and would shift dissemination away from the producing agency; exclude the operational
    details of COMINT production.
  span_range:
  - src:9b9324f225ca#p101.3
  - src:9b9324f225ca#p102.1
  decision: The Navy’s senior communications official rejected the Army proposal for a joint COMINT summary.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The decision arose amid a British request for access and Army officials’ concerns that Britain was withholding COMINT,
    alongside arguments about reciprocal access and security. The Chief of Staff denied the request, citing other War Department
    interests and a security hazard; exclude technical details of the scrambler project.
  span_range:
  - src:9b9324f225ca#p108.1
  - src:9b9324f225ca#p111.1
  decision: The Army Chief of Staff denied the British request for access to the Bell Labs scrambler project.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: 'The parties had considered incompatible approaches: the British initially reserved key German-system exploitation
    to the United Kingdom, while Army officials rejected exclusion and sought technical competence, reciprocal exchange, and
    continued cooperation. The agreement divided primary responsibilities, provided for exchanges and Army participation in
    ENIGMA work in the U.K., and set dissemination arrangements; exclude the subsequent operational implementation details.'
  span_range:
  - src:9b9324f225ca#p117.1
  - src:9b9324f225ca#p119.6
  decision: The War Department and British code-and-cipher authorities adopted a negotiated COMINT-sharing agreement rather
    than accept exclusion of Army participation or sever cooperation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The decision followed a Joint Chiefs recommendation to transfer the division. The President instead cited its value
    to civilian agencies; focus on the choice over jurisdiction and organizational control, not the division’s intercept activities.
  span_range:
  - src:9b9324f225ca#p132.4
  - src:9b9324f225ca#p133.1
  decision: The President decided not to disestablish the FCC’s Radio Intelligence Division or transfer its personnel and
    equipment to the Army.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The agreement barred transmission of the specified material to anyone in South America and limited authorized transcripts
    to the recipient’s personal use, with exceptions requiring mutual approval by senior officials. The passage connects the
    restriction to pre-invasion security concerns; exclude technical collection or communications methods.
  span_range:
  - src:9b9324f225ca#p137.3
  - src:9b9324f225ca#p138.1
  decision: Army and Navy intelligence officials, with a British representative, agreed to restrict dissemination of specified
    Latin American German clandestine COMINT during the pre-invasion period.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The Army had withheld Japanese Army material pending reciprocity; the Navy proposed liaison officers with access
    to the other service’s files, and the chiefs made that approach the basis of their agreement. Keep the scenario to the
    interservice sharing rules and security arrangements, not intelligence exploitation techniques.
  span_range:
  - src:9b9324f225ca#p142.4
  - src:9b9324f225ca#p143.2
  decision: The Army and Navy chiefs approved a reciprocal Japanese-intelligence sharing agreement based on liaison officers’
    access to each service’s files, while leaving handling and use under the producing service’s control.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The Navy’s decision was approved by the Director of Naval Communications. The passage gives reasons including the
    Navy’s view that it received nothing from the FBI and restrictions on providing FBI access to ENIGMA-derived material;
    focus on the policy choice over FBI access, not the underlying interception or cryptanalysis.
  span_range:
  - src:9b9324f225ca#p135.2
  - src:9b9324f225ca#p135.2
  decision: Navy intelligence officials decided to stop disseminating clandestine COMINT to the FBI in May 1943.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is the choice to address unequal liaison access through coordination while retaining an agreement
    signed by the service chiefs. Keep the focus on the policy and authority for interservice cooperation; exclude the technical
    intelligence exchanged under later agreements.
  span_range:
  - src:9b9324f225ca#p143.3
  - src:9b9324f225ca#p143.4
  decision: Army and Navy intelligence officials chose to preserve the King-Marshall Agreement and establish a coordinating
    committee rather than discard the agreement after liaison disputes.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The decision point is formalizing interservice oversight despite the Army staff's concerns about its own decentralized
    structure. The record cites the unofficial committee's success and the need for centralized coordination; exclude details
    of intelligence operations and organizational functions beyond that rationale.
  span_range:
  - src:9b9324f225ca#p146.1
  - src:9b9324f225ca#p147.3
  decision: The Army Chief of Staff and the Navy leadership accepted a permanent Army-Navy communications-intelligence board
    rather than leave coordination unofficial or defer a decision.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The decision point is whether to centralize AFPAC intelligence units during ongoing decisive operations or defer
    their absorption while pursuing centralization later. The stated reasons include avoiding disruption and ensuring the
    theater continued to receive intelligence promptly; exclude the mechanics of interception and transmission.
  span_range:
  - src:9b9324f225ca#p162.2
  - src:9b9324f225ca#p163.4
  decision: The Pacific theater commander, with the Army intelligence chief's concurrence, chose to preserve AFPAC's existing
    communications-intelligence structure until decisive Pacific operations were completed rather than absorb its units into
    a centralized Army system immediately.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
