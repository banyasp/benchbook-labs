episodes:
- n: 1
  focus: In late 1941 or early 1942, the Army and Navy weigh invasion against a less resource-intensive policy of severing
    communications and limiting support to their adversaries. Keep the focus on the strategic choice and its stated rationale—the
    Army’s troop commitments and the aim of keeping Allied forces on the defensive—not on the subsequent campaign details.
  span_range:
  - src:e4c97727da2b#p17.4
  - src:e4c97727da2b#p18.4
  decision: The Japanese Army and Navy agree to isolate and neutralize Australia and India rather than invade them.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The local commander requests carrier support and postponement because U.S. carrier activity has undermined confidence
    in air superiority; the fleet commander agrees. Center the scenario on proceeding with the invasion without that support
    versus delaying it, and exclude the tactical details of the ensuing operation.
  span_range:
  - src:e4c97727da2b#p22.3
  - src:e4c97727da2b#p23.2
  decision: The Japanese fleet commander approves delaying the Port Moresby operation until carrier support is available.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The passage contrasts the aggressive approach with the cautious policy of the predecessor and describes the threat
    to Samoa, Fiji, and U.S.-Australian supply routes, as well as intelligence that informed confidence in the raids. Keep
    the decision at the level of whether to undertake the raids; exclude tactical execution details.
  span_range:
  - src:e4c97727da2b#p19.3
  - src:e4c97727da2b#p20.3
  decision: The Pacific Fleet commander dispatches carrier task forces on raids against Japanese-held islands, under pressure
    for a more aggressive policy.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 4
  focus: The report challenged the prevailing Navy assessment, arguing that Japanese sea-power buildup threatened Australia
    and New Caledonia more than Port Moresby; it also reasoned that nearby land-based air could attack Port Moresby without
    a carrier task force. Keep the focus on this competing intelligence judgment and its stated rationale, not on whether
    the assessment was correct or on intelligence-collection methods.
  span_range:
  - src:e4c97727da2b#p34.3
  - src:e4c97727da2b#p34.4
  decision: The Army intelligence chief in MacArthur’s headquarters judged whether the Japanese buildup indicated an offensive
    against Port Moresby or a greater threat to Australia and New Caledonia.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The commander could continue the operation or disengage and defer the attack; the account states that losses, particularly
    among aircraft and pilots, prompted the choice. Keep the scenario to the command decision and its rationale, excluding
    tactical details of the engagement.
  span_range:
  - src:e4c97727da2b#p41.2
  - src:e4c97727da2b#p41.3
  decision: The Fourth Fleet commander chose to break contact and postpone the Port Moresby attack after Japanese aircraft
    and pilot losses.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 6
  focus: The decision shifted the operation’s timing after the Doolittle raid and selected early June to avoid disrupting
    the Ocean and Nauru operations in mid-May. The passage describes the strategic rationale and scheduling constraint; exclude
    force deployment details and the operational mechanics of the campaign.
  span_range:
  - src:e4c97727da2b#p50.3
  - src:e4c97727da2b#p50.4
  decision: The Imperial General Staff and Combined Fleet leadership moved the Midway–Aleutians operation ahead of the Fiji–Samoa
    operations and scheduled it for early June.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is the fleet commander’s choice in response to intelligence about Japanese intentions, despite
    the Hawaiian Army commander’s doubts and preference for basing estimates on Japanese capabilities. Include the review
    of the supporting intelligence and the outcome; exclude the later battle and tactical details.
  span_range:
  - src:e4c97727da2b#p57.3
  - src:e4c97727da2b#p58.2
  decision: The Pacific Fleet commander chose to defend Midway rather than concentrate the defense on Oahu.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to act on the intelligence assessment or treat it as a possible ruse. The passage says
    the commander distrusted the reports and deployed the main force about 400 miles south; exclude the operational details
    of subsequent engagements.
  span_range:
  - src:e4c97727da2b#p65.4
  - src:e4c97727da2b#p66.1
  decision: The Commander, Northwestern Sea Frontier, chose to deploy the main force well south of Kodiak despite intelligence
    warning of Japanese operations in the Aleutians.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to restrict publication of information that could reveal U.S. success in reading enemy
    communications, or leave publication unrestricted. The stated reason is to prevent the enemy from learning that its communications
    had been deciphered; exclude the journal’s separate argument about postwar censorship, which was commentary rather than
    an official decision.
  span_range:
  - src:e4c97727da2b#p79.2
  - src:e4c97727da2b#p79.4
  decision: The Secretaries of War and the Navy chose to add a wartime press rule barring mention of enemy codes, ciphers,
    or intelligence derived from intercepted enemy messages.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to continue prosecution after reviewing the law, evidence, and circumstances surrounding
    the disclosures. The prosecutor cited weaknesses and fairness concerns regarding the principals’ conduct and concluded
    that the case was not worth pursuing; do not treat the recommendation as a specific final decision by another official,
    which the passage does not identify.
  span_range:
  - src:e4c97727da2b#p77.3
  - src:e4c97727da2b#p79.4
  decision: The special prosecutor recommended dropping the prosecution arising from the newspaper disclosures rather than
    pursuing the case to trial.
  content_domain: other:criminal prosecution
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The decision point is whether OP-16 should continue issuing its daily bulletin or discontinue it after CINCPAC raised
    duplication and security concerns. Exclude the operational details of intelligence reporting; focus on the dissemination
    choice and its stated rationale.
  span_range:
  - src:e4c97727da2b#p88.2
  - src:e4c97727da2b#p88.2
  decision: OP-16 decides to discontinue its daily intelligence bulletin in response to concerns about duplicative reporting
