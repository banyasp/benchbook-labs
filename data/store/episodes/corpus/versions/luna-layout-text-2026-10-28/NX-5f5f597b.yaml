- n: 47
  focus: The decision point is whether to include military options and the proposed UK contribution in Cabinet’s discussion,
    or keep the meeting focused on the UN route. The report records that Cabinet was not briefed on the options and that the
    Prime Minister wanted government efforts focused on securing a second resolution; it also records the Defence Secretary’s
    understanding that discussion would not occur without the Prime Minister’s agreement. Exclude the separate decision to
    deploy forces on 17 January.
  span_range:
