- n: 43
  focus: The decision point is whether to continue pursuing transit through Turkey or shift away from the northern option
    toward a southern role. The account links the shift to the failure to secure Turkish agreement and describes the South
    as a possible UK contribution; exclude force-movement and campaign-execution details.
  span_range:
  - src:c1a1d9c95786#p376.9
