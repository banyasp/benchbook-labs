- n: 44
  focus: This was a choice among force-posture options amid serious doubt that Turkey would permit transit and a shrinking
    US planning timetable. The Chiefs weighed strategic influence and the perceived advantages of a southern role against
    operational and strategic risks; they sought ministerial approval, so do not portray their selection as final ministerial
    authorization to deploy.
  span_range:
