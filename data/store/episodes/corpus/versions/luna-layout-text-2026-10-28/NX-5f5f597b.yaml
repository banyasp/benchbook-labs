- n: 48
  focus: The decision followed consideration of alternative approaches to disarmament and advice that regime removal could
    bring military action to an earlier end and reduce the risk of Iraq restarting a WMD programme. The Prime Minister also
    stressed minimising civilian casualties and ensuring targets were appropriate and proportionate. Focus on the campaign-level
    policy and legal considerations; exclude operational target selection or attack methods.
  span_range:
