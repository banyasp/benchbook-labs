- n: 51
  focus: The decision weighs ring-fencing UK forces in a UK area against allowing contributions to wider Coalition operations
    while preserving the UK’s Phase IV role. The reasons included the Coalition’s need for UK combat power in the South and
    the need to balance completion of Phase III with an exemplary Phase IV; exclude the detailed mission assignments and methods
    of combat operations.
