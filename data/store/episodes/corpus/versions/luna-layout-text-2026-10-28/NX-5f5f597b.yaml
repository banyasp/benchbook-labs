- n: 46
  focus: The decision point is whether to accept the US-requested role and begin deployment planning or defer/reject it while
    legal and post-conflict questions remained unresolved. The stated rationale includes the role’s significance, timing and
    operational contribution, while the approval retained conditions on political commitment, US support and aftermath planning.
    Exclude the operational details of the force’s tasks.
  span_range:
