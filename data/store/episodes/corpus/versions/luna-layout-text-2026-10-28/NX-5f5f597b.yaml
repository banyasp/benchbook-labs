- n: 49
  focus: The decision point is whether to make an early, detailed commitment or preserve flexibility while seeking influence
    over aftermath planning. The stated reasons were the Prime Minister’s wish for maximum influence and the need to clarify
    the Phase IV command chain and governing political and legal authority; exclude later decisions about force levels or
    operational assignments.
