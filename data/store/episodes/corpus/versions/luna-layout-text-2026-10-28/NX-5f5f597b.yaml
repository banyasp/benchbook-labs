episodes:
- n: 1
  focus: The choice was between obtaining advice immediately and treating the issue as longer-term; the Chief of Staff proposed
    discussing it before Christmas, reasoning that Iraq was unlikely initially to reject resolution 1441. This is a decision
    about when to seek legal advice, not a decision authorising military action.
  span_range:
  - src:c1a1d9c95786#p10.3
  - src:c1a1d9c95786#p10.9
  decision: No.10 officials chose to defer the Attorney General’s requested advice on the legal position until nearer the
    point when Iraqi non-compliance might arise.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The choice was to pursue a second resolution, including seeking French sponsorship, or risk proceeding without one.
    The passage gives the stated rationale that demonstrating all possible efforts to secure a resolution would leave the
    UK in the strongest position if none were adopted; do not treat this as a decision that a second resolution was legally
    indispensable.
  span_range:
  - src:c1a1d9c95786#p20.13
  - src:c1a1d9c95786#p21.3
  decision: The Foreign Secretary agreed to pursue a draft second Security Council resolution and invite France to co-sponsor
    it.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: In his draft advice of 14 January 2003, the Attorney General concluded that a further Council decision was required,
    though it need not take the form of a resolution. The analysis weighs competing readings of resolution 1441, especially
    whether the Council retained a substantive role in assessing a breach; exclude operational military preparations and conduct.
  span_range:
  - src:c1a1d9c95786#p40.6
  - src:c1a1d9c95786#p44.2
  decision: The Attorney General decides whether resolution 1441 permits force under the revived authorization in resolution
    678 without a further Security Council decision.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the Attorney General’s choice between interpreting the resolution to permit force after further
    Council discussion and requiring a further Council determination. The passage records the competing interpretations and
    his conclusion that the Council had to determine what was required; exclude operational questions about conducting military
    action.
  span_range:
  - src:c1a1d9c95786#p55.3
  - src:c1a1d9c95786#p61.3
  decision: The Attorney General decided that resolution 1441 did not authorize the use of force without a further Security
    Council determination.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to maintain a commitment to obtain a further resolution or preserve room to act if
    a veto blocks it. The Prime Minister gave the stated reason that inaction would flout the will and spirit of resolution
    1441; exclude operational military planning and treat the veto scenario as conditional, not as an actual decision to use
    force.
  span_range:
  - src:c1a1d9c95786#p64.7
  - src:c1a1d9c95786#p64.10
  decision: The Prime Minister decided to leave open the possibility of UK action without a further Security Council resolution
    if a veto blocked action after a clear Iraqi breach.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to send a further written clarification after being told advice was not needed before
    the meeting. The Attorney General chose to write because he was concerned the Prime Minister might think he had been persuaded
    by the alternative arguments; exclude the substantive choice to use force, which is addressed separately.
  span_range:
  - src:c1a1d9c95786#p60.4
  - src:c1a1d9c95786#p61.8
  decision: The Attorney General decided to send the Prime Minister a written clarification of his legal position before the
    Prime Minister’s meeting with the US President.
  content_domain: other:government legal advice
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is whether to disclose the internal legal disagreement or qualify the commitment to the US, versus
    maintaining the public and private line while seeking to preserve coalition pressure. Include the stated political risks
    and concern about effects on the coalition and Iraq; exclude operational details.
  span_range:
  - src:c1a1d9c95786#p67.4
  - src:c1a1d9c95786#p68.7
  decision: The Prime Minister chose to maintain a firm commitment to the US while withholding his unresolved legal doubts
    until he knew a definitive view was necessary.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to accept the Legal Adviser’s view or challenge it in favour of an alternative interpretation
    of the existing resolutions. Include the Foreign Secretary’s arguments about legal uncertainty, ministerial responsibility,
    and the asserted basis in resolution 678; exclude the broader constitutional debate except where it explains the choice.
  span_range:
  - src:c1a1d9c95786#p69.2
  - src:c1a1d9c95786#p70.9
  decision: The Foreign Secretary chose to reject the departmental Legal Adviser’s view that a further Security Council decision
    was required before force could lawfully be used.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to treat a further Security Council resolution as legally necessary or to accept the
    revival argument as reasonably available, subject to strong factual grounds. Include the negotiating history, US arguments,
    and acknowledged ambiguity that informed the advice; exclude the separate question of whether to make the advice public.
  span_range:
  - src:c1a1d9c95786#p85.8
  - src:c1a1d9c95786#p87.3
  decision: The Attorney General chose to advise No.10 that there was a reasonable legal case for relying on resolution 1441
    to revive the force authorisation in resolution 678 without a further resolution, while regarding a further resolution
    as safest.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The choice was between treating a further Council decision as necessary and advising that the existing resolution
    could provide a reasonably arguable basis for force. The Attorney General accepted the latter only as a reasonable case,
    citing the text and negotiating history while warning that a court might require another decision and that strong evidence
    of Iraqi non-compliance was essential; exclude the separate question of whether the evidence ultimately met that standard.
  span_range:
  - src:c1a1d9c95786#p104.7
  - src:c1a1d9c95786#p105.10
  decision: The Attorney General decides whether to advise that the UK could rely on resolution 1441 to use force without
    a further Security Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 11
  focus: The Prime Minister proposed revising the draft resolution and stated that action despite a French veto would be politically
    and legally acceptable if nine votes were secured; without nine votes, action might be legal but politically difficult.
    Keep the decision at the level of legal and political authority for force, and exclude operational details.
  span_range:
  - src:c1a1d9c95786#p94.4
  - src:c1a1d9c95786#p94.8
  decision: The Prime Minister decides whether to regard UK participation in military action as acceptable if a further Security
    Council resolution receives nine votes but is vetoed.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 12
  focus: 'The decision point is the Attorney General’s 13 March conclusion after being pressed for a clear answer on whether
    the proposed action was lawful. The passage gives his reasoning: resolution 1441 did not require a further Security Council
    decision, Iraq remained in material breach, and the negotiation history supported revival of the earlier authorisation;
    exclude the separate question of whether to publish the advice.'
  span_range:
  - src:c1a1d9c95786#p127.7
  - src:c1a1d9c95786#p128.10
  decision: The Attorney General decided that, on balance, the UK had a lawful basis to use force against Iraq without a further
    Security Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 13
  focus: The decision point is the Foreign Secretary’s conditional recommendation about whether to press for a vote and how
    to proceed if a second resolution could not be secured. His reasons include the likely diplomatic and political costs
    of a defeat, the importance of UN legitimacy and the Charter, and the prospect of making the case to Parliament on the
    basis of Iraq’s non-compliance; exclude the separate contingency of UK participation in later campaign activities.
  span_range:
  - src:c1a1d9c95786#p116.5
  - src:c1a1d9c95786#p117.5
  decision: The Foreign Secretary advised the Prime Minister not to put a second Security Council resolution to a vote if
    it lacked nine votes or could not avoid a veto, and instead to rely on resolution 1441.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 14
  focus: The Attorney General moved from saying there was a reasonable legal case to giving an unequivocal view that the action
    would be lawful, while a second resolution appeared difficult to obtain. The decision point is the legal assessment and
    the standard of certainty he adopted; exclude the later work preparing public arguments for that view.
  span_range:
  - src:c1a1d9c95786#p130.2
  - src:c1a1d9c95786#p132.9
  decision: The Attorney General decides whether to give a qualified view or conclude that military action is lawful without
    a further Security Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 15
  focus: The Attorney General sought the Prime Minister’s considered judgment on the factual predicate for the revival argument,
    and the Prime Minister confirmed further material breach based on his assessment of inspector reports and intelligence.
    The decision point is the Prime Minister’s assessment of failure; the Inquiry also notes the absence of considered advice
    across government and reports of increased cooperation and no Iraqi nuclear programme.
  span_range:
  - src:c1a1d9c95786#p137.5
  - src:c1a1d9c95786#p142.6
  decision: The Prime Minister decides whether Iraq had failed to take the final opportunity to comply with resolution 1441.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 16
  focus: The account describes the choice not to pursue a vote as prospects for agreement diminished, with officials reporting
    no prospect of consensus and the Prime Minister warning that losing a vote might create legal difficulties. It also records
    the concern that a vote’s outcome could affect the UN’s ability to act after the conflict; exclude the separate question
    of how military action would be conducted.
  span_range:
  - src:c1a1d9c95786#p143.10
  - src:c1a1d9c95786#p146.4
  decision: The Prime Minister and the Government decide not to put the draft second Security Council resolution to a vote.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 17
  focus: The Attorney General gave Parliament his view of the legal basis, while distinguishing that public view from formal
    legal advice. The decision point is disclosure and the choice of who should explain the Government’s position; exclude
    the underlying legal merits already covered by the other candidates.
  span_range:
  - src:c1a1d9c95786#p148.2
  - src:c1a1d9c95786#p150.3
  decision: The Attorney General decides to state publicly his view of the legal basis for force rather than keep that view
    undisclosed under the usual confidentiality convention.
  content_domain: other:government legal advice disclosure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The decision point is whether to proceed toward force after the Government concluded that a second resolution was
    unattainable, or continue pursuing diplomatic alternatives. The Cabinet cited Iraq’s continuing non-compliance, the diplomatic
    impasse, and its view that existing resolutions provided legal authority; exclude operational conduct of any military
    action.
  span_range:
  - src:c1a1d9c95786#p152.7
  - src:c1a1d9c95786#p154.10
  decision: The UK Cabinet decided to endorse an ultimatum to Saddam Hussein and ask the House of Commons to support military
    action, if necessary, without a further Security Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 19
  focus: The decision point is whether to advise that resolution 1441 revived the authorization in resolution 678 absent a
    new resolution, or instead require the safer course of obtaining one. The advice depended on whether strong factual grounds
    showed that Iraq had failed to take its final opportunity; exclude operational military considerations.
  span_range:
  - src:c1a1d9c95786#p168.12
  - src:c1a1d9c95786#p170.7
  decision: The Attorney General concluded that the better legal view permitted force against Iraq without a further Security
    Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is whether to disclose a Law Officer’s legal view in an exceptional case or keep it confidential
    under the usual practice. The passage links disclosure to the issue’s exceptional importance and public and parliamentary
    calls for the Government to state its legal position; exclude the substance of military operations.
  span_range:
  - src:c1a1d9c95786#p166.7
  - src:c1a1d9c95786#p167.5
  decision: The Attorney General decided to disclose his view of the legal basis for using force against Iraq publicly.
  content_domain: other:legal-advice-disclosure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 21
  focus: 'This is a policy choice made amid ministerial concern about possible US military action against Iraq. The source
    identifies the chosen approach and its purpose: influencing US policy and presentation; exclude decisions about whether
    to launch military action, which the passage says had not been taken.'
  span_range:
  - src:c1a1d9c95786#p192.7
  - src:c1a1d9c95786#p192.9
  decision: The Prime Minister chose to engage the US Government closely to shape its Iraq policy and how that policy was
    presented.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: The account presents a choice between publicly supporting the US strategy to retain influence and distancing the
    UK from it. It reports the Prime Minister’s position and the reasons discussed, including the desire to influence strategy
    and concerns about Iraq’s threat; exclude the operational details of any military option.
  span_range:
  - src:c1a1d9c95786#p201.5
  - src:c1a1d9c95786#p205.3
  decision: The Prime Minister chose to align the UK with the US in confronting Iraq, including if that led to military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 23
  focus: At the April meeting, the Defence Secretary sought further examination of contributions short of a full ground offensive
    and allowed preliminary thinking to continue under close hold. The reasons included unresolved legal questions, uncertainty
    about the successor regime and the need to understand how far in advance preparations would be required; exclude force-generation
    and deployment details.
  span_range:
  - src:c1a1d9c95786#p208.10
  - src:c1a1d9c95786#p209.3
  decision: The Defence Secretary chose to continue closely held exploratory work on possible UK contributions to Iraq, including
    smaller options, without committing forces.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 24
  focus: The decision was whether to join the US planning process or stay outside it, while making clear that no UK political
    decision to participate had been made. The record links planning access to informing UK thinking and influence, and records
    the safeguard against the US treating participation in planning as a commitment; exclude the operational details of any
    campaign plan.
  span_range:
  - src:c1a1d9c95786#p227.6
  - src:c1a1d9c95786#p228.9
  decision: The Defence Secretary approved sending a UK team to join US Iraq planning, on the condition that this did not
    commit the UK to military participation.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 25
  focus: The choice was whether to raise the UK’s warning-time constraint in general terms during discussions with the US.
    The Defence Secretary argued that disclosure would reinforce the need for early access to US thinking; the Prime Minister’s
    note rejected that approach as sending a ‘wobbly message.’ Exclude the separate question of whether the UK would ultimately
    participate in military action.
  span_range:
  - src:c1a1d9c95786#p220.10
  - src:c1a1d9c95786#p221.6
  decision: The Prime Minister rejected the recommendation to tell the US Defence Secretary that the UK needed substantial
    warning time to contribute forces.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 26
  focus: The meeting record says to work on the assumption of UK participation and to tell US military officials that the
    UK was considering options, but also says fuller US planning was needed before firm decisions. Treat the choice as provisional
    policy positioning, not as a decision to deploy forces or as operational planning.
  span_range:
  - src:c1a1d9c95786#p245.5
  - src:c1a1d9c95786#p246.4
  decision: The Prime Minister and senior ministers adopted the provisional assumption that the UK would participate in possible
    military action, while withholding a firm commitment.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 27
  focus: 'The Prime Minister’s note weighs the options at the level of campaign policy: he considered the rapid option riskier
    and preferred the build-up option for its perceived lower risk and political-signalling value. Exclude the quoted descriptions
    of force movements, targets, and military methods.'
  span_range:
  - src:c1a1d9c95786#p247.11
  - src:c1a1d9c95786#p248.5
  decision: The Prime Minister preferred a force build-up and later-start option over a rapid-start option for possible military
    action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 28
  focus: The account says the Prime Minister did not want to take a decision or accept any of the options, with the stated
    reason that the UK was pressing the US to consider the UN route and he did not want to signal enthusiasm for a military
    alternative. Treat this as a decision to defer commitment, not as a decision to reject military action permanently.
  span_range:
  - src:c1a1d9c95786#p252.7
  - src:c1a1d9c95786#p252.10
  decision: The Prime Minister chose not to accept or select a military contribution option at that stage, preserving the
    diplomatic route through the United Nations.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 29
  focus: The decision was whether to disclose the potential constraint on UK force contributions before the Camp David discussions
    or defer disclosure. The account says the Prime Minister hoped to discuss the issue with the Defence Secretary the following
    week; exclude the wider decision about whether the UK would ultimately join military action.
  span_range:
  - src:c1a1d9c95786#p265.8
  - src:c1a1d9c95786#p265.10
  decision: The Prime Minister decides not to tell the US about the impact of Operation FRESCO for the moment.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 30
  focus: The decision point is how far to signal or prepare a UK land contribution after the Prime Minister learned the US
    expected the UK to lead in the North. The reported constraints were that the UK could not offer Package 3 in the required
    timeframe and faced Operation FRESCO; exclude the operational details of any reconnaissance or exercise preparations.
  span_range:
  - src:c1a1d9c95786#p273.7
  - src:c1a1d9c95786#p273.7
  decision: The Prime Minister decides that there should be no visible preparations for a month or so, while considering a
    contribution short of the northern invasion role the US expected.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 31
  focus: 'The Defence Secretary faced a choice about what prospective contribution to communicate to the US: a ground-force
    offer or a more limited offer. The stated reasons were the firefighters'' strike and the risk that movement of UK ground
    assets would become visible prematurely during the diplomatic and UN process; exclude the military planning details of
    particular force packages.'
  span_range:
  - src:c1a1d9c95786#p275.2
  - src:c1a1d9c95786#p275.6
  decision: The Defence Secretary tells the US that the UK expects to offer maritime and air assets, not more ground forces
    than it could deliver.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 32
  focus: The decision concerned preserving the land option while publicly presenting Package 2 and minimizing publicity about
    preparations. The Prime Minister was cautious about Package 3’s viability, costs, and implications for other contingencies;
    the record also notes a genuine misunderstanding about what had been agreed and that the Ministry of Defence had already
    told the US it was still considering a land option.
  span_range:
  - src:c1a1d9c95786#p282.5
  - src:c1a1d9c95786#p283.11
  decision: On 23 September 2002, the Prime Minister agreed to limited preparations for a possible UK land contribution, while
    choosing to keep the major land option out of the presentation to the US planning conference.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 33
  focus: The decision was to seek an in-principle decision promptly, rather than leave the land contribution unresolved or
    rule it out. The cited reasons included the US planning timetable, the diplomatic cost of withdrawing after Exercise Internal
    Look, the prospect of influencing US planning, and the value of military preparations to the coercive strategy; this was
    a decision to seek ministerial authorization, not the final authorization to deploy.
  span_range:
  - src:c1a1d9c95786#p292.7
  - src:c1a1d9c95786#p294.9
  decision: On 9 October 2002, the Chiefs of Staff agreed to seek a non-public ministerial decision in principle to offer
    Package 3 to the US, ideally by 21 October.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 34
  focus: The decision was whether US planning should assume a UK land contribution despite the UK position being uncertain,
    or proceed without that assumption. They agreed on the former because it was easier for US planning and they considered
    that their interests would be best served by that approach; this planning assumption was not itself final UK authorization
    to deploy.
  span_range:
  - src:c1a1d9c95786#p295.2
  - src:c1a1d9c95786#p295.5
  decision: On 10 October 2002, the Chief of the Defence Staff and the US Central Command commander agreed that US planning
    should proceed on the assumption that Package 3 would be available.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 35
  focus: The Prime Minister chose not to commit at that stage, while preserving the possibility of Package 3. The decision
    involved costs, unresolved questions about the UN process and legal basis, and risks concerning feasibility and Turkish
    cooperation; exclude the operational details of force planning.
  span_range:
  - src:c1a1d9c95786#p302.4
  - src:c1a1d9c95786#p304.9
  decision: The Prime Minister decides on 17 October whether to commit the UK to Package 3 or defer commitment while keeping
    that option open.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 36
  focus: The choice was to let the US plan on the basis that a UK land contribution might be available, rather than allow
    the option to lapse, while reserving a later political decision on deployment. Reasons included preserving influence in
    US planning and keeping the option open; costs remained a concern, and the record does not show whether they had been
    discussed with the Treasury. Exclude operational force-planning details.
  span_range:
  - src:c1a1d9c95786#p314.2
  - src:c1a1d9c95786#p315.5
  decision: The Prime Minister decides on 31 October to offer Package 3 to the US for planning, without making a final commitment
    or authorising a warning to Reservists at that stage.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 37
  focus: The decision point is whether to offer significant ground forces for planning, given the wish to support the US and
    avoid a later follow-on role, against the risk that the offer would constrain future choices and create post-conflict
    obligations. Include the stated rationale and the Inquiry’s finding that key strategic risks were not considered collectively;
    exclude the later choice of deployment location.
  span_range:
  - src:c1a1d9c95786#p323.11
  - src:c1a1d9c95786#p328.8
  decision: The Prime Minister decided to offer UK ground forces (Package 3) to the US for planning purposes.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 38
  focus: The decision point is whether to open alternative planning with the US or continue pursuing the UK’s preferred northern
    option while seeking a Turkish decision. Include the uncertainty about Turkish cooperation and the Chiefs of Staff’s preference;
    exclude the detailed force structures and operational planning.
  span_range:
  - src:c1a1d9c95786#p340.9
  - src:c1a1d9c95786#p341.2
  decision: The Chief of the Defence Staff decided to defer discussing alternative deployment options with the US while the
    UK continued to press Turkey on the northern option.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 39
  focus: The choice was whether to proceed with preparations or risk foreclosing military options while US readiness advanced,
    despite uncertainty about timing, Turkey and the political decision to use force. The stated reasons were to keep options
    open and realign readiness; exclude the operational details of individual deployments and media handling beyond the decision
    to defer a change in media posture.
  span_range:
  - src:c1a1d9c95786#p350.2
  - src:c1a1d9c95786#p354.10
  decision: The Prime Minister authorizes the MOD to proceed with visible military preparations to preserve the UK’s ability
    to participate.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 40
  focus: The choice was whether to assign the UK task group an early role or have the US divert other forces, accepting delay
    and greater risk; the northern option also remained uncertain because of Turkey. The Chiefs cited UK participation and
    strategic, operational and economic or environmental benefits, while recognizing support-helicopter risks. Exclude the
    tactical details of the proposed operation.
