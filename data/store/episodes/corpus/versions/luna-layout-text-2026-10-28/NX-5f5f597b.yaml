- n: 42
  focus: The decision was to make visible preparations to maintain pressure on Iraq while stating that force was not inevitable
    and no commitment to action had been made. The stated reason was to persuade Iraq to comply with Resolution 1441 and keep
    a credible threat of force; exclude details of the forces and their deployment.
  span_range:
  - src:c1a1d9c95786#p373.4
  - src:c1a1d9c95786#p374.4
