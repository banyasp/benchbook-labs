- n: 52
  focus: The Attorney General identified possible legal bases, rejected self-defence and humanitarian catastrophe as applicable,
    and regarded a further resolution as the safest course while accepting a conditional argument that resolution 1441 could
    revive earlier authorization. The decision point is the legal standard and evidentiary conditions for relying on that
    argument; exclude decisions about campaign targets or operational conduct.
