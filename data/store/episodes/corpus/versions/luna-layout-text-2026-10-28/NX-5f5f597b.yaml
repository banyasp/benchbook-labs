- n: 50
  focus: The decision weighs pursuing a wider role against limiting UK forces to their planned area and remaining receptive
    to requests. The passage explains that assigning 7 Armoured Brigade to combat elsewhere could leave the division split
    and reduce forces available in south-eastern Iraq for Phase IV; exclude the operational details of any particular deployment.
  span_range:
