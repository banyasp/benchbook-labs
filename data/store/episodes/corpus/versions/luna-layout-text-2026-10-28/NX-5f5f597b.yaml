- n: 41
  focus: The decision point is the chiefs’ recommendation among a two-brigade northern package, a single brigade integrated
    into a US formation, and southern options. The recommendation responded to the changed US force offer and weighed a more
    balanced, less risky division against additional personnel and disruption to Op FRESCO; exclude the operational details
    of force composition and deployment.
  span_range:
