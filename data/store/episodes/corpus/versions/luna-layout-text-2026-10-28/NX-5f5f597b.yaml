  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 45
  focus: The decision was whether to clarify that the northern option might not proceed or to leave the possibility open.
    The stated reasons were to maintain pressure on Saddam Hussein and preserve the possibility of Turkish agreement; exclude
    the separate decision about switching the UK force to the South.
  span_range:
  - src:c1a1d9c95786#p395.6
