- n: 54
  focus: The decision point is whether the final assessment should say more about Iraq’s WMD aspirations and potential. The
    JIC chose to expand that coverage so Ministers would have its assessment for policy discussions with the US, particularly
    given a difference between Pentagon and UK views; exclude the underlying weapons analysis except as context for that choice.
  span_range:
