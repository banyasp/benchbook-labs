- n: 45
  focus: The Prime Minister argues against striking Iraq while the Afghanistan operation is under way, proposing that the
    immediate phase focus on Afghanistan and that broader action be considered later. The stated reasons include the risk
    of losing Arab, Russian and European support and of reinforcing claims that the campaign was West versus Arab; exclude
    propaganda or operational details.
  span_range:
  - src:7c17e29ebd32#p341.7
  - src:7c17e29ebd32#p342.8
  decision: The Prime Minister decides to defer action against Iraq and distinguish the Afghanistan campaign from a later
    phase of counter-terrorism policy.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 46
  focus: The Chief of Staff argues that inspections and revised sanctions are unlikely to address the risks, and recommends
    prioritizing regime change, while distinguishing that objective from bombing Baghdad. The Prime Minister agrees and plans
    to set out a way forward to the US President; keep the focus on the policy choice and stated rationale, not on methods
    of supporting opposition groups.
  span_range:
  - src:7c17e29ebd32#p349.5
  - src:7c17e29ebd32#p350.10
  decision: The Prime Minister accepts the Chief of Staff’s recommendation to make Saddam Hussein’s removal the overriding
    Iraq objective rather than prioritizing renewed inspections.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
