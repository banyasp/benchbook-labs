episodes:
- n: 1
  focus: The decision point is whether to establish a broad, independent inquiry or leave the events without such an inquiry
    or examine a narrower period. Focus on the stated aim of learning lessons and strengthening democracy, diplomacy and the
    military; exclude the later conduct of the inquiry.
  span_range:
  - src:7c17e29ebd32#p6.2
  - src:7c17e29ebd32#p6.6
  decision: The Prime Minister decided to establish an independent inquiry into the UK’s involvement in Iraq from summer 2001
    through July 2009.
  content_domain: other:public-inquiry
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether the Committee should investigate detention issues itself or leave them to the existing
    inquiries and investigations. Focus on its concern about duplication or impeding their progress, alongside its policy-level
    remit; exclude individual allegations and operational detention practices.
  span_range:
  - src:7c17e29ebd32#p10.7
  - src:7c17e29ebd32#p11.8
  decision: The Iraq Inquiry Committee decided not to examine issues relating to detention.
  content_domain: other:inquiry-scope
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to preserve confidentiality or permit disclosure of sensitive records, including Cabinet
    material, UK–US exchanges and intelligence assessments. Focus on the balance between confidentiality and the Inquiry’s
    ability to give a sufficient account, and on the stated limits and non-precedent; exclude the underlying intelligence
    or operational content.
  span_range:
  - src:7c17e29ebd32#p14.8
  - src:7c17e29ebd32#p15.5
  decision: The Government agreed to disclose exceptionally sensitive material for inclusion in the Iraq Inquiry’s report,
    limited to what was strictly necessary.
  content_domain: other:government-transparency
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to disclose the draft advice or preserve legal professional privilege and the Law Officers’
    confidentiality convention. Focus on the exceptional circumstances of the Inquiry, the advice’s stated unique status and
    the continuing public interest in confidentiality; do not assess the legality of military action itself.
  span_range:
  - src:7c17e29ebd32#p18.3
  - src:7c17e29ebd32#p18.5
  decision: The Government decided to declassify the draft legal advice on the proposed military action for the Iraq Inquiry.
  content_domain: other:legal-privilege
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is the Council’s choice of sanctions as an enforcement measure after Iraq failed to comply with
    the withdrawal demand, including the humanitarian exceptions. Reconstruct the policy choice and its stated purpose; exclude
    later sanctions arrangements and operational enforcement details.
  span_range:
  - src:7c17e29ebd32#p29.2
  - src:7c17e29ebd32#p29.2
  decision: The UN Security Council decided to impose comprehensive economic sanctions on Iraq to secure compliance with its
    demand to withdraw from Kuwait.
  content_domain: other:UN sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is the Council’s grant of conditional authority to use force, following demands for Iraqi compliance
    and a final opportunity to do so. Focus on the authorization, conditions, and collective-security basis; exclude military
    operations and methods of employing force.
  span_range:
  - src:7c17e29ebd32#p29.4
  - src:7c17e29ebd32#p29.6
  decision: The UN Security Council decided to authorize Member States cooperating with Kuwait to use all necessary means
    if Iraq did not comply by the deadline.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is the shift from reluctance to intervene to action, with concerns about internal interference
    and civil conflict weighed against outrage, alleged expectations created by coalition rhetoric, and urgent humanitarian
    needs. Focus on the policy choice to intervene; exclude operational details of relief missions and no-fly-zone enforcement.
  span_range:
  - src:7c17e29ebd32#p34.4
  - src:7c17e29ebd32#p35.2
  decision: Coalition governments decided to take action in response to the repression of Iraqi civilians and the refugee
    crisis, leading to humanitarian relief for the Kurds.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision followed destruction of the programme and Iraq’s stated concern that undisclosed activity or equipment
    might be treated as incompatible with resolution 687. Iraq also said fear of exaggeration and the costs of implementing
    the resolution influenced its actions. Focus on the policy choice to disclose, not on the technical details of the programme.
  span_range:
  - src:7c17e29ebd32#p52.2
  - src:7c17e29ebd32#p53.10
  decision: The Iraqi government decided to disclose details of its nuclear programme to the UN in July 1991.
  content_domain: other:international disarmament compliance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The report describes a leadership decision to provide only partial disclosures, retain capabilities and documentation,
    and conceal programmes; it also records unilateral destruction contrary to the resolution’s declaration and international-supervision
    requirements. Focus on the compliance decision and its stated objectives, not on the mechanics of destruction or on operational
    details of the weapons programmes.
  span_range:
  - src:7c17e29ebd32#p49.2
  - src:7c17e29ebd32#p57.7
  decision: Iraq’s senior leadership decided to conceal prohibited programmes and unilaterally destroy some prohibited items
    rather than disclose and submit them to UN-supervised disposition.
  content_domain: other:international disarmament compliance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The JIC weighed intelligence it considered generally credible against its assessment that the described route could
    not have yielded sufficient fissile material, while acknowledging major gaps in knowledge. Focus on the evidentiary judgment
    and calibrated uncertainty, not on technical enrichment methods.
  span_range:
  - src:7c17e29ebd32#p54.5
  - src:7c17e29ebd32#p54.9
  decision: The JIC judged that the available intelligence did not establish that Iraq had obtained enough fissile material
    for a nuclear weapon by the described route, while retaining the possibility that more material had been produced.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to accept a limited accommodation for Iraq’s security concerns while preserving the
    Commission’s ability to inspect under its mandate, or insist on immediate access without that arrangement. The account
    cites the risk of further Council action and of irreparably harming the Commission’s usefulness if no agreement were reached;
    exclude the operational details of the inspection modalities.
  span_range:
  - src:7c17e29ebd32#p70.10
  - src:7c17e29ebd32#p71.10
  decision: The UNSCOM Executive Chairman and Iraq’s deputy prime minister agreed on access arrangements for inspections at
    sensitive sites, including some delay before access.
  content_domain: other:inspection-access-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: The decision point is whether to lift sanctions if Iraq complies with its weapons obligations or retain them until
    it demonstrates peaceful intentions and complies with all relevant Security Council resolutions. The speech gives security
    and regime-intentions reasons for maintaining sanctions, while also recognizing the need to minimize Iraqi citizens’ suffering;
    exclude broader judgments about the Iraqi government that are not part of this sanctions choice.
  span_range:
  - src:7c17e29ebd32#p75.4
  - src:7c17e29ebd32#p76.7
  decision: The US Secretary of State maintained the policy of keeping UN sanctions on Iraq rather than supporting their removal
    upon Iraq’s compliance with weapons obligations.
  content_domain: other:sanctions-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The decision point is the Council’s choice of a conditional, targeted response demanding cooperation, rather than
    immediate broader sanctions; the debate reflects both concern about Iraq’s obstruction and humanitarian costs and the
    value of Council consensus. The Council adopted the resolution unanimously, while members articulated different views
    about sanctions and the purpose of the response; exclude claims about inspection operations themselves.
  span_range:
  - src:7c17e29ebd32#p81.3
  - src:7c17e29ebd32#p83.4
  decision: The UN Security Council adopted a resolution condemning Iraq’s repeated inspection-access refusals and threatening
    additional targeted measures if it did not comply.
  content_domain: other:sanctions-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The Council adopted the resolution under Chapter VII after reports of Iraqi obstruction, while several members argued
    for more time, a more balanced text, or further dialogue. Extract the choice to proceed despite those objections and the
    competing concerns about inspection access, compliance, and Council unity; exclude operational details of inspections.
  span_range:
  - src:7c17e29ebd32#p91.2
  - src:7c17e29ebd32#p95.6
  decision: The Security Council decided whether to adopt Resolution 1134, including a conditional threat of travel restrictions
    on Iraqi officials.
  content_domain: other:UN sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: The decision followed Iraq’s stated concerns that the United States was using UNSCOM for hostile purposes and reflected
    its dispute over the Commission’s neutrality. Extract the policy choice between unrestricted cooperation and imposing
    this condition, and the stated grounds for it; exclude technical details of surveillance or inspection activity.
  span_range:
  - src:7c17e29ebd32#p95.7
  - src:7c17e29ebd32#p96.3
  decision: The Iraqi Government decided to condition continued UNSCOM cooperation on excluding U.S. nationals from its activities
    in Iraq.
  content_domain: other:inspection-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The Council unanimously adopted targeted sanctions after Iraq refused to rescind its restrictions on UNSCOM cooperation.
    Extract the choice to impose the travel ban while pursuing compliance, against alternatives such as further dialogue or
    de-escalation, and the concerns about proportionality, humanitarian effects, and escalation; exclude operational inspection
    details.
  span_range:
  - src:7c17e29ebd32#p99.2
  - src:7c17e29ebd32#p101.8
  decision: The Security Council decided to impose a travel ban on designated Iraqi officials through Resolution 1137.
  content_domain: other:UN sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The decision point is the UK leadership’s choice between a diplomatic-only approach and a twin-track policy that
    preserved force as leverage. Focus on the stated reasons—maintaining leverage and preventing inaction from undermining
    the effort to get inspectors back in—and exclude operational military planning or media strategy.
  span_range:
  - src:7c17e29ebd32#p108.5
  - src:7c17e29ebd32#p109.9
  decision: The UK Government chose to keep the use of force available while pursuing diplomacy to secure Iraqi co-operation
    with inspections.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 18
  focus: The decision point is pursuing negotiation and a peaceful agreement rather than allowing the crisis to proceed toward
    force. The stated reasons include the Secretary-General’s responsibility to seek peaceful resolution, avert a threat to
    international peace and security, and provide an incentive for Iraqi co-operation; exclude the mechanics of inspections.
  span_range:
  - src:7c17e29ebd32#p110.4
  - src:7c17e29ebd32#p112.10
  decision: The UN Secretary-General chose to pursue a personal diplomatic mission to Iraq to resolve the inspection-access
    crisis.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 19
  focus: The decision point is the Council’s adoption of a resolution warning of severe consequences for violations while
    preserving its authority to assess circumstances and decide any response. The debate identifies concerns about delegated
    authority, automaticity, and the need for a timely assessment; exclude operational military options.
  span_range:
  - src:7c17e29ebd32#p111.8
  - src:7c17e29ebd32#p114.10
  decision: The Security Council chose to endorse the Iraq inspection agreement while reserving decisions on any future use
    of force to the Council rather than authorizing force automatically.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is whether to continue cooperation, suspend it, or seek changes to the inspection regime. The
    stated reasons include Iraq’s belief that cooperation had not led to sanctions relief and its allegations that UNSCOM
    was politically controlled and infringed Iraqi sovereignty; exclude the technical merits of those allegations except as
    context for the decision.
  span_range:
  - src:7c17e29ebd32#p126.9
  - src:7c17e29ebd32#p128.3
  decision: Iraq’s Revolutionary Command Council and Ba’ath Party Regional Command decided to suspend cooperation with UNSCOM
    in its current form and with the IAEA, while allowing monitoring to continue subject to conditions.
  content_domain: other:international inspection policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 21
  focus: The decision point is whether to proceed with the scheduled review or condition it on restored Iraqi cooperation
    and verification access. The passage grounds the Council’s response in Iraq’s suspension of cooperation and the resulting
    inability to carry out mandated activities; exclude any inference that the resolution authorized force, which the text
    expressly disclaims elsewhere.
  span_range:
  - src:7c17e29ebd32#p131.3
  - src:7c17e29ebd32#p132.4
  decision: The Security Council decided to withhold the scheduled sanctions review until Iraq rescinded its suspension decisions
    and inspectors could exercise their full mandates.
  content_domain: other:UN sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: The decision point is whether to maintain the suspension or resume cooperation during the crisis. The stated considerations
    include Iraq’s trust in the Secretary-General, uncertainty over the review process, and messages from other states; exclude
    the separate question of how inspections were to be conducted.
  span_range:
  - src:7c17e29ebd32#p143.6
  - src:7c17e29ebd32#p144.4
  decision: Iraq’s leadership decided to resume cooperation with UNSCOM and the IAEA and permit them to perform their normal
    duties.
  content_domain: other:international inspection policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 23
  focus: The decision point is whether to proceed with the imminent attacks or pause in response to Iraq’s communication that
    it would resume cooperation. The stated reasons are to examine the details, resolve whether compliance is unconditional,
    and test Iraq’s assurances in practice; exclude operational details of any attack.
  span_range:
  - src:7c17e29ebd32#p145.5
  - src:7c17e29ebd32#p146.3
  decision: The UK Prime Minister and the US decide to hold the planned attacks for 24 hours and suspend further military
    action while assessing Iraq’s assurances.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 24
  focus: The decision point is whether to use force after the latest UNSCOM report found that Iraq had not provided promised
    cooperation and inspectors could not conduct substantive disarmament work. The UK Prime Minister had authorized UK participation
    if the US proceeded; the stated rationale included Iraq’s non-compliance, the perceived threat, and the Government’s view
    that existing Security Council resolutions provided legal authority. Exclude operational planning and target selection.
  span_range:
  - src:7c17e29ebd32#p147.4
  - src:7c17e29ebd32#p151.5
  decision: The UK Prime Minister decides that the UK will participate in the US-led military action against Iraq on 16 December
    1998.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 25
  focus: The decision point is whether to make Saddam Hussein’s removal an objective of the military action or limit the operation
    to degrading weapons capabilities and reducing the threat to neighbouring states. The Prime Minister says he cannot responsibly
    commit to removal through this action, citing the scale of ground forces that would be required and the lack of any guarantee
    of success; exclude operational methods for achieving either objective.
  span_range:
  - src:7c17e29ebd32#p158.4
  - src:7c17e29ebd32#p159.8
  decision: The UK Prime Minister decides that removing Saddam Hussein will not be an objective of the December 1998 military
    action, while supporting efforts toward regime change by other means.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 26
  focus: The decision point is whether to pursue removal through a costly ground occupation or continue containment, with
    force reserved for a possible Iraqi rebuilding of prohibited capabilities. Include the stated concerns about costs, sustainability,
    and the risk of a long occupation; exclude operational details of the air campaign.
  span_range:
  - src:7c17e29ebd32#p166.7
  - src:7c17e29ebd32#p167.11
  decision: The Clinton Administration chose to rule out a US ground campaign to remove Saddam Hussein and pursue containment
    in the short and medium term, while working toward a new Iraqi government over the long term.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 27
  focus: The decision point weighs regional security and British interests against containment’s costs and humanitarian consequences,
    and considers whether to offer incentives for Iraqi cooperation without prematurely lifting sanctions. Include the stated
    alternatives and the Prime Minister’s endorsement; exclude details of how inspections or military measures would be carried
    out.
  span_range:
  - src:7c17e29ebd32#p179.5
  - src:7c17e29ebd32#p181.2
  decision: The UK Prime Minister and ministers endorsed continued containment of Iraq rather than walking away or pursuing
    regime change, while seeking a revised sanctions and compliance package.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 28
  focus: The decision point is whether to block the resolution or allow it to pass after changes to its sanctions and disarmament
    provisions. The stated reason was that the changes created an opportunity to break the Iraq stalemate, though the delegation
    retained concerns about unilateral force and other provisions; exclude operational military matters.
  span_range:
  - src:7c17e29ebd32#p184.6
  - src:7c17e29ebd32#p185.4
  decision: The Russian delegation to the Security Council chose not to block adoption of resolution 1284, despite objecting
    to remaining provisions and warning against forcible implementation.
  content_domain: other:UN policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 29
  focus: The decision was whether to maintain the existing approach or move toward targeted sanctions and suspend broader
    economic sanctions in connection with inspectors returning. The Prime Minister favored the linked approach because it
    could end the sanctions burden, restore inspections, make Iraqi non-cooperation visible, and address the human consequences;
    exclude operational details of NFZ patrols.
  span_range:
  - src:7c17e29ebd32#p205.3
  - src:7c17e29ebd32#p206.9
  decision: The Prime Minister chose to link a shift in sanctions with the return of UN inspectors to Iraq.
  content_domain: other:sanctions-and-inspections policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 30
  focus: This is the UK’s preferred policy over tougher sanctions, military action or regime overthrow, with an implementation
    package intended to restore P5 unity. The stated reasons include humanitarian costs and the unsustainability of the status
    quo; treat this as the Foreign Secretary’s recommendation, not proof of final government adoption.
  span_range:
  - src:7c17e29ebd32#p208.6
  - src:7c17e29ebd32#p209.8
  decision: The Foreign Secretary recommends that the UK pursue containment through full implementation of Security Council
    Resolution 1284 and persuade the US to support it.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 31
  focus: The proposed shift follows his judgment that Resolution 1284 is no longer sustainable and that Saddam Hussein will
    not comply. The proposed package includes sanctions and diplomatic measures; exclude the operational details of any military
    activity and do not treat the proposal as evidence that the government adopted it.
  span_range:
  - src:7c17e29ebd32#p213.7
  - src:7c17e29ebd32#p214.3
  decision: The Foreign Secretary proposes that the UK give up trying to secure inspectors’ return and pursue an Iraq policy
    not dependent on Iraqi cooperation.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 32
  focus: The legal judgment weighs the uncertain humanitarian consequences of ending patrols against the increasingly questionable
    legal basis for continuing them, including necessity, proportionality, civilian protection and diminished international
    support. The Attorney General accepts that the legal argument remains available on balance, while stressing its narrow
    and precarious character and ruling out other purposes as justification.
  span_range:
  - src:7c17e29ebd32#p224.3
  - src:7c17e29ebd32#p226.2
  decision: The Attorney General concludes whether continued UK and US operations in the No-Fly Zones can still be justified
    on humanitarian-necessity grounds.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 33
  focus: The decision point is the shift from the existing sanctions regime to a revised framework that permits civilian trade
    while preserving controls intended to limit rearmament and illicit revenue. Include the humanitarian, enforcement, regional-consensus
    and security considerations; exclude the technical design of border monitoring and controlled-goods enforcement.
  span_range:
  - src:7c17e29ebd32#p236.2
  - src:7c17e29ebd32#p241.6
  decision: UK policy leaders decide whether to replace broad economic sanctions with targeted controls on military and dual-use
    goods while retaining UN control of Iraqi oil revenues.
  content_domain: other:sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 34
  focus: The decision point is how much to press for inspections inside Iraq, given that an in-country presence could constrain
    WMD activity but was not considered a guaranteed solution and might allow Saddam Hussein to provoke crises. The framework
    retained a role for UNMOVIC outside Iraq and provided for inspections inside if Iraq complied; exclude inspection procedures
    and other operational details.
  span_range:
  - src:7c17e29ebd32#p230.2
  - src:7c17e29ebd32#p241.4
  decision: UK policy leaders decide whether to seek UNMOVIC inspections inside Iraq or retain the inspectors’ role outside
    Iraq unless Iraq complies.
  content_domain: other:arms-control policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 35
  focus: The policy choice was whether to end southern No-Fly Zone patrols or continue them in a modified form. The source
    weighs protection of Kuwait and the force requirements of alternatives against risks to aircrew, regional reaction and
    political concerns; exclude the operational conduct of patrols or engagements.
  span_range:
  - src:7c17e29ebd32#p230.5
  - src:7c17e29ebd32#p241.3
  decision: UK policy leaders decide whether to retain southern No-Fly Zone patrols, rather than abolish them, while reducing
    their scope or risk.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 36
  focus: The decision point is the UK/US shift toward fast-tracking goods outside an agreed controlled-goods list while retaining
    UN control of oil revenues and strengthening controls against sanctions-breaking. The stated reasons included refocusing
    controls on WMD, easing humanitarian-programme administration, and limiting Iraq’s access to hard currency; exclude the
    operational details of border enforcement.
  span_range:
  - src:7c17e29ebd32#p250.3
  - src:7c17e29ebd32#p250.9
  decision: The UK Government chose to pursue a new, more targeted UN sanctions regime rather than retain the existing broad
    contract-review arrangements.
  content_domain: other:sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 37
  focus: The decision point is the Defence Secretary’s rejection of the Foreign Secretary’s proposal to reconsider or end
    southern-zone patrols. The stated grounds were continuing humanitarian and defensive needs, the lack of a safer alternative,
    and the risk of undermining containment; exclude decisions about patrol patterns or other operational conduct.
  span_range:
  - src:7c17e29ebd32#p251.5
  - src:7c17e29ebd32#p251.7
  decision: The Defence Secretary chose to oppose ending or reducing No-Fly Zone patrols and to maintain the zones as policy.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 38
  focus: The decision point is whether to proceed with a substantial response to increased threats to coalition aircraft or
    defer it. The source records the US decision to defer and UK concerns about regional reaction, propaganda effects, and
    harm to wider Iraq policy; exclude target selection and attack planning details.
  span_range:
  - src:7c17e29ebd32#p261.8
  - src:7c17e29ebd32#p262.4
  decision: The US Administration chose to defer a proposed substantial attack on Iraqi air-defence targets while considering
    its wider implications.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 39
  focus: The decision point is whether the UK should participate in a joint contingency plan despite the Attorney General’s
    advice about legal challenge and possible UK disassociation. The stated concern was that disassociation could damage bilateral
    relations; exclude the plan’s operational triggers and target details.
  span_range:
  - src:7c17e29ebd32#p266.5
  - src:7c17e29ebd32#p266.7
  decision: The Prime Minister agreed that the UK would join a contingency plan for attacks, subject to excluding three regime
    targets from UK participation.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 40
  focus: The decision point is the veto of disclosure versus allowing the minutes to be released. The stated reasons emphasize
    candid private deliberation, collective ministerial responsibility, and preserving Cabinet as a space for frank discussion;
    the account also recognizes public accountability through other channels. Exclude the separate underlying decision to
    deploy armed forces.
  span_range:
  - src:7c17e29ebd32#p272.6
  - src:7c17e29ebd32#p273.4
  decision: The Lord Chancellor decided whether to use the section 53 Freedom of Information Act override to withhold the
    minutes of Cabinet meetings on 13 and 17 March 2003.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 41
  focus: The decision was to create a dedicated cross-government unit despite unresolved strategic questions about US plans
    and the future administration of Iraq. Focus on the policy and coordination reasons for establishing it and its intended
    remit; exclude operational military planning techniques.
  span_range:
  - src:7c17e29ebd32#p307.2
  - src:7c17e29ebd32#p307.8
  decision: The Cabinet Office, FCO, MOD and DFID officials agreed to establish an inter-departmental Iraq Operational Policy
    Unit, led by an FCO official, to prepare practical policy guidance for the aftermath of a possible conflict.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
