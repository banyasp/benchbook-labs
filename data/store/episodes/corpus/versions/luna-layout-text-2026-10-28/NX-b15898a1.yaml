- n: 60
  focus: The decision point is whether to pursue the UN and inspections route, accept containment, or make regime change the
    objective of possible military action. The advice weighs international law, the need for a credible end state, uncertain
    evidence of an imminent threat, and the prospects of political support; do not infer that the passage establishes the
    legality of any eventual use of force.
  span_range:
  - src:7c17e29ebd32#p474.6
  - src:7c17e29ebd32#p477.9
  decision: The Foreign Secretary recommends that the Prime Minister pursue a UN-led route on Iraq, with inspectors and WMD
    elimination as the objective and force, if necessary, not regime change as an end in itself.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 61
  focus: The decision point is whether to state publicly that further Security Council action is likely needed, or use language
    that leaves the legal position open while negotiations continue. The passage gives the stated reason of protecting the
    negotiating position and records legal advice warning of difficulties without further Council action; exclude any conclusion
    that this public framing settled the legal question.
  span_range:
  - src:7c17e29ebd32#p477.8
  - src:7c17e29ebd32#p478.11
  decision: The Foreign Secretary chooses to preserve the UK’s public negotiating position on the legal basis for force while
    privately seeking to persuade the US to take the UN route.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 62
  focus: The decision point is the Prime Minister’s choice between supporting the US while seeking influence over its approach,
    or distancing the UK, and his preference for a UN ultimatum rather than immediate military action. The reasons included
    retaining influence, building international support and giving Saddam Hussein a chance to comply. Exclude operational
    military planning and treat this as a policy choice, not a final authorization of force; the account says that decision
    had not yet been made.
  span_range:
  - src:7c17e29ebd32#p490.5
  - src:7c17e29ebd32#p497.9
  decision: The UK Prime Minister chose to support the US on Iraq while pressing for greater US engagement and a UN inspectors
    route that gave Iraq an opportunity to comply before action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 63
  focus: The decision point is how to balance the value of a further UN resolution for international and domestic support
    against preserving flexibility if Iraq rejected an ultimatum. Keep the focus on the policy and legal-authority question;
    exclude operational planning.
  span_range:
  - src:7c17e29ebd32#p512.10
  - src:7c17e29ebd32#p513.3
  decision: The Prime Minister and Cabinet chose to prioritize a UN process and international support while avoiding a commitment
    that a further Security Council resolution was an absolute precondition for military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 64
  focus: The decision point is whether to assure the US President of UK support for possible force, or limit the response
    to sanctions and inspections; the Prime Minister described force as conditional on diplomatic alternatives failing. Exclude
    any details of military planning or execution.
  span_range:
  - src:7c17e29ebd32#p523.5
  - src:7c17e29ebd32#p523.10
  decision: The Prime Minister conditionally committed at Crawford to support confronting Iraq, including with force if diplomacy
    offered no other way to address the threat.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 65
  focus: The decision point is whether to continue pursuing regime change after Iraq allowed inspectors to return, judged
    against the stated WMD-removal objective and legal and political justification. Treat this as the Foreign Secretary’s
    policy advice, not an operational decision; exclude the adjoining reference to intelligence activity.
  span_range:
  - src:7c17e29ebd32#p514.2
  - src:7c17e29ebd32#p514.6
  decision: The Foreign Secretary’s position was that UK support for regime change could be justified only to remove the WMD
    threat, and should end if inspectors’ return achieved that purpose.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 66
  focus: The decision was whether to engage in US planning or remain outside it, despite the possibility that planning could
    lead to forcible removal of Saddam Hussein. The stated reasons included the importance of the US alliance and the value
    of being involved in the planning; do not treat contingency planning as a decision that war had been agreed.
  span_range:
  - src:7c17e29ebd32#p526.2
  - src:7c17e29ebd32#p526.6
  decision: The UK Prime Minister decided to join US planning for possible action against Iraq, accepting that participation
    in planning meant being open in principle to participating in action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 67
  focus: 'The decision point is the UK’s proposed policy approach: seek Iraqi compliance with UN resolutions through an ultimatum
    while aligning with the US without adopting its regime-change objective. The passage says the proposal was made and considered,
    not that force or the ultimatum was finally authorized; exclude later decisions not described here.'
  span_range:
