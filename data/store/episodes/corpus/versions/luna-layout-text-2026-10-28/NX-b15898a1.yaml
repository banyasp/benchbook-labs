- n: 55
  focus: 'The decision point is the Cabinet’s endorsement of a strategic direction amid concerns about the Iraqi threat, US
    unilateralism, legality, effectiveness and international support. Distinguish this agreement from authorisation of military
    action: the Cabinet expressly made no such decision.'
  span_range:
  - src:7c17e29ebd32#p429.10
  - src:7c17e29ebd32#p431.7
  decision: The Cabinet agreed that the UK should engage closely with the US to shape its Iraq policy and presentation, while
    pursuing a measured response and taking no decision to launch military action.
