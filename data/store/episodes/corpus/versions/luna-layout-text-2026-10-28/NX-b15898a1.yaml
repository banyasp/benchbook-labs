- n: 42
  focus: The Committee reviewed the objectives of reducing the threat from Iraq and, over the longer term, reintegrating a
    territorially intact Iraq. The passage identifies toppling Saddam as an alternative but says it lacked useful international
    support; exclude later policy changes and operational details of containment.
  span_range:
  - src:7c17e29ebd32#p320.2
