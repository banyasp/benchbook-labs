- n: 57
  focus: The decision was to offer UK support as a way to influence US policy, rather than simply continue managing the issue
    through containment. The stated reasons included the perceived threat, the need to build a legitimate international case,
    and the risks of failure or destabilising the region; exclude operational military planning.
  span_range:
  - src:7c17e29ebd32#p452.10
  - src:7c17e29ebd32#p454.11
  decision: The Prime Minister chooses to support the US objective of regime change, while requiring a convincing strategy
    and pursuing international support through the UN.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
