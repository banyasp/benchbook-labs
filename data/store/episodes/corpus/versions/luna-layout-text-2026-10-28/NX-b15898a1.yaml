- n: 44
  focus: 'The decision point is the President’s post-9/11 reassessment of Iraq: he contrasts the earlier possibility of managing
    Saddam Hussein with confronting the threat, citing the risk that WMD could reach terrorists and the lesson that waiting
    for danger to materialize could be too late. Keep the focus on this strategic choice; exclude operational military planning.'
  span_range:
  - src:7c17e29ebd32#p334.8
  - src:7c17e29ebd32#p334.11
  decision: The President decides to confront the threat from Iraq rather than continue to manage it through containment.
