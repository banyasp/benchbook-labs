  natsec: true
- n: 59
  focus: The decision point is whether to enter US military planning and prepare to contribute forces, or hold back unless
    the US has a plausible plan with a reasonable prospect of success and consistent with international law. Include the stated
    planning, deployment, successor-government and prolonged-presence concerns; exclude operational details of any campaign.
  span_range:
  - src:7c17e29ebd32#p470.8
  - src:7c17e29ebd32#p471.8
  decision: The Defence Secretary recommends that the UK support the US and prepare a military contribution, while seeking
