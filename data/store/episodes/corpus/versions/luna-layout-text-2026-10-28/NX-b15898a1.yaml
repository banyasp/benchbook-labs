- n: 56
  focus: The source records the Prime Minister’s public statements about Iraq and the contemporaneous explanation that he
    had decided this was the best position to adopt to gain influence. Treat this as a decision about public positioning in
    foreign policy, not as a decision to use force or a finding that the public claims were accurate.
  span_range:
  - src:7c17e29ebd32#p422.8
  - src:7c17e29ebd32#p423.3
