  natsec: true
- n: 47
  focus: Officials recommend dropping provisions perceived as imposing new obligations on neighbouring states, arguing that
    consensus and a Goods Review List could help sustain containment and preserve the coalition against terrorism. The Foreign
    Secretary’s office agrees subject to further consultation; exclude detailed sanctions implementation.
  span_range:
  - src:7c17e29ebd32#p337.5
  - src:7c17e29ebd32#p338.2
  decision: The Foreign Secretary endorses the FCO proposal to revise the draft Iraq sanctions resolution to improve prospects
    for Security Council consensus.
  content_domain: other:foreign-policy
