- n: 43
  focus: The passage presents immediate action against Iraq and diplomatic resolution as alternatives; the President chose
    diplomacy absent definitive evidence and saw success in Afghanistan as the best way to demonstrate resolve. The account
    is attributed to his memoir, so retain that source qualification; exclude subsequent Iraq policy and military planning
    details.
  span_range:
  - src:7c17e29ebd32#p329.9
  - src:7c17e29ebd32#p329.10
  decision: The US President decided on 16 September 2001 to pursue Iraq diplomatically unless definitive evidence linked
    Iraq to the 9/11 plot, while prioritising success in Afghanistan.
