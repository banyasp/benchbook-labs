  natsec: true
- n: 58
  focus: The choice was between involving the Attorney General while policy options were being formulated and deferring engagement
    until after the summit. The stated context was that military decisions were not imminent and formal advice was unlikely
    to be sought before the summit; exclude the substantive merits of any possible legal justification for force.
  span_range:
  - src:7c17e29ebd32#p451.5
  - src:7c17e29ebd32#p451.10
