- n: 48
  focus: In December 2001, the FCO weighed stronger containment, including renewed inspections and clearer conditions for
    any military action, against supporting regime change by force. It recommended the containment route because there were
    no anti-terrorist grounds for action, the legal basis for force was doubtful and a new Security Council resolution would
    almost certainly be needed; exclude later implementation details of the proposed measures.
  span_range:
  - src:7c17e29ebd32#p363.4
  - src:7c17e29ebd32#p365.10
  decision: The FCO recommends that the UK intensify containment and seek Iraqi compliance rather than support military regime
    change.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 49
  focus: In the paper sent to the US President on 4 December 2001, the Prime Minister proposed building a coalition and pressure
    over time, with military action remaining possible if necessary, rather than immediate action. The stated reasons included
    limited international support for immediate force and the risk of losing allies; exclude the proposed covert activity
    and operational details of supporting an uprising.
  span_range:
  - src:7c17e29ebd32#p372.6
  - src:7c17e29ebd32#p374.7
  decision: The Prime Minister proposes a gradual US-UK strategy for Iraq that builds support and pressure before any possible
    military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 50
  focus: The decision point is the Prime Minister’s choice to support dealing with Iraq and to shape the US approach through
    a staged strategy, including an ultimatum and the UN route. The stated considerations include the changed assessment of
    risk after 9/11, Iraq’s obligations under UN resolutions, the perceived threat from its capabilities, and the difficulty
    of securing international support. Exclude operational details of any military action.
  span_range:
  - src:7c17e29ebd32#p376.8
  - src:7c17e29ebd32#p377.12
  decision: The Prime Minister chose to treat Iraq as part of the post-9/11 response and pursue a strategy that could lead
    to regime change, rather than address the issue only sequentially or through containment.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 51
  focus: The decision point is the UK officials’ recommendation to seek agreement on strict, unconditional inspections and
    implement existing resolutions. They reasoned that compliance could address the WMD concern, while refusal or renewed
    obstruction could strengthen the moral and legal case for action. Exclude the operational conduct of inspections and any
    military planning.
  span_range:
  - src:7c17e29ebd32#p395.3
  - src:7c17e29ebd32#p395.10
  decision: UK officials chose to advocate a tough UN inspections regime as an alternative to military action against Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 52
  focus: The decision point is whether to continue contingency planning after the military briefing or rely on the prospect
    of diplomacy and pressure. The stated reason for continuing was the concern that WMD might reach terrorists, despite optimism
    that diplomacy could succeed. Exclude the force composition, routes, timing, and other operational planning details.
  span_range:
  - src:7c17e29ebd32#p383.2
  - src:7c17e29ebd32#p383.6
  decision: The US President chose to continue developing an Iraq military contingency plan while maintaining that diplomacy
    and international pressure might disarm the regime.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 53
  focus: The decision point is whether to advance policy work on SIS support for opposition groups, rather than rely solely
    on a military solution. Keep the focus on this high-level decision, not on operational methods or any later implementation;
    the source notes doubts about the option’s prospects but does not describe an operational authorization.
  span_range:
  - src:7c17e29ebd32#p401.4
  - src:7c17e29ebd32#p401.9
