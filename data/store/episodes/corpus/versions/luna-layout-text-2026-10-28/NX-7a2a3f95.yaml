- n: 1
  focus: The decision point is whether to staff and use the field hospital or redirect its personnel to evacuation teams;
    the stated reason was that 95% of casualties reached civilian hospitals for advanced treatment within 47 minutes. Keep
    the focus on allocation of medical capacity and exclude clinical procedures or broader claims about evacuation doctrine.
  span_range:
  - src:66a73524c654#p14.4
  - src:66a73524c654#p14.5
  decision: IDF medical leadership chose not to use the brigade-level field hospital during the war and instead redistributed
    its medical personnel to augment battalion evacuation teams.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to vaccinate immediately or defer action after polio was detected in Gaza sewage, with
    forces soon expected to operate there. Focus on the urgency, force-health protection, and logistical constraints; exclude
    the vaccination’s execution details.
  span_range:
  - src:66a73524c654#p46.2
  - src:66a73524c654#p46.2
  decision: The IDF Surgeon directed an immediate large-scale polio vaccination operation for Soldiers preparing to operate
    in Gaza.
  content_domain: other:medical-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to continue providing morale-boosting hot meals through risky sources or restrict unsafe
    foods and emphasize controlled supply chains after outbreaks. Focus on the tradeoff between morale and food safety/readiness;
    exclude food-preparation instructions.
  span_range:
  - src:66a73524c654#p40.6
  - src:66a73524c654#p41.2
  decision: The theater-level commander prohibited unsafe food sources and backed a public awareness campaign after foodborne
    illness outbreaks.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to retain the existing holding period or shorten it in response to large numbers of
    stray dogs crossing the border and attacking livestock. Focus on the legal and public-interest tradeoff behind the amendment;
    exclude euthanasia methods and operational implementation.
  span_range:
  - src:66a73524c654#p48.2
  - src:66a73524c654#p48.2
  decision: Israeli authorities amended animal-welfare law to reduce the stray-animal holding period from 10 days to 4 before
    euthanasia could be considered.
  content_domain: other:animal-welfare-law
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The choice was whether to continue routine testing or suspend it; the Ministry authorized suspension after October
    7, citing the state of emergency and low risk in October. Keep the focus on the public-health decision and its stated
    rationale, not blood-processing procedures generally.
  span_range:
  - src:66a73524c654#p62.6
  - src:66a73524c654#p62.6
  decision: Israel’s Ministry of Health authorized suspending West Nile virus testing for blood collected during the emergency
    period.
  content_domain: other:public-health policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is choosing a storage option after the earlier coolers proved logistically burdensome and required
    frequent resupply; the source says commercial refrigerators were ultimately selected. Exclude engineering modifications
    and operational details; focus on the equipment-choice rationale and reliable temperature control.
  span_range:
  - src:66a73524c654#p63.6
  - src:66a73524c654#p63.6
  decision: IDF decision-makers transitioned ground evacuation platforms to commercial beverage refrigerators for whole-blood
    storage.
  content_domain: other:medical logistics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision was to self-deploy medical extraction teams rather than rely solely on the limited available air assets;
    the initiative was reported as successful and later integrated at brigade level. Exclude details of landing-zone assessment,
