episodes:
- n: 1
  focus: The decision point is the analysts’ choice between treating alarming Soviet activity as preparation for near-term
    military action and interpreting it as a war of nerves absent specific evidence of offensive preparations. Focus on the
    evidentiary basis and the judgment; exclude operational collection or military-response decisions.
  span_range:
  - src:ef6fe339be9a#p7.4
  - src:ef6fe339be9a#p8.7
  decision: ORE analysts judged in July 1946 that recent Soviet actions did not indicate an imminent military attack on the
    West.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to assess an invasion as likely or unlikely given observed troop movements and improvements,
    the perceived strength of the South Korean Army, and the possibility of provocation. Keep the focus on the estimate and
    its stated rationale; exclude any operational response to a possible invasion.
  span_range:
  - src:ef6fe339be9a#p9.4
  - src:ef6fe339be9a#p9.7
  decision: ORE analysts assessed in early 1950 that a North Korean invasion of South Korea was unlikely unless North Korean
    forces gained clear superiority.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to assess Chinese intervention as likely or unlikely in light of reports of troop movements
    and public warnings. The analysts’ stated reasons include risks to Soviet influence over Korea and China, and the prospect
    of a wider war; exclude operational military-response choices.
  span_range:
  - src:ef6fe339be9a#p10.2
  - src:ef6fe339be9a#p11.4
  decision: ORE analysts judged in September 1950 that Chinese Communist forces were unlikely to intervene in Korea despite
    reports of troop movements and warnings.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: 'The decision point is the analysts’ interpretation of a potentially concerning nine-week visit: possible disagreement
    over a revised treaty versus an assessment of continued ideological and political alignment. Exclude any inference about
    an operational response; the passage concerns an intelligence judgment.'
  span_range:
  - src:ef6fe339be9a#p14.5
  - src:ef6fe339be9a#p14.6
  decision: ORE analysts judged whether Mao’s prolonged Moscow visit indicated serious Sino-Soviet friction or whether he
    would remain aligned with Soviet leadership; they assessed that he was unlikely to prove intractable.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to maintain an uncertain assessment of Ho’s relationship with Moscow and the possibility
    of neutrality, or to adopt a more adverse estimate after Soviet recognition. Exclude any decision about operational support
    or military action; the passage describes analysis and its implications.
  span_range:
  - src:ef6fe339be9a#p15.5
  - src:ef6fe339be9a#p15.7
  decision: ORE analysts revised their assessment of Soviet aims in Indochina after the USSR recognized Ho Chi Minh’s government,
    forecasting Soviet efforts to displace France and establish a Communist-dominated government.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to maintain the earlier concern that Israel could become a Soviet client or assess
    that Soviet support was waning. The cited reason was the Soviet view that Israel had already disrupted the Arab world
    and that further aid could harm Soviet interests; exclude any policy response by the US government.
  span_range:
  - src:ef6fe339be9a#p15.4
  - src:ef6fe339be9a#p15.6
  decision: ORE analysts reassessed whether Soviet support for Israel was likely to continue, concluding in November 1948
    that Soviet enthusiasm was diminishing.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
