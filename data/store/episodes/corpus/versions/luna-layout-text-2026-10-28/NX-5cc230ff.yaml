episodes:
- n: 1
  focus: The decision point is whether to exploit the enemy’s retreat now or delay while forces recover and plans are refined.
    The commander cites the risk that the enemy will escape and the need to relieve pressure on the adjacent task force; exclude
    the detailed movement plan and other tactical procedures.
  span_range:
  - src:d0833ff10c40#p16.2
  - src:d0833ff10c40#p19.3
  decision: The battalion commander orders an immediate transition to pursuit rather than waiting for the battalion to fully
    reconsolidate.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision is whether to pause for coordination or proceed under the existing order. The commander chooses to proceed
    because time is short, the company is the battalion’s main effort, and he considers coordination with the scouts most
    important; exclude the route, formation, and other execution details.
  span_range:
  - src:d0833ff10c40#p26.3
  - src:d0833ff10c40#p27.3
  decision: The company commander decides to begin the movement-to-contact mission without further coordination with the other
    teams.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to spend more time arranging casualty evacuation or proceed with an improvised plan.
    The commander acknowledges that “something had to give” as the team prepares to move quickly; exclude medical procedures
    and movement details.
  span_range:
  - src:d0833ff10c40#p27.2
  - src:d0833ff10c40#p29.2
  decision: The company commander accepts reduced casualty-evacuation planning in order to expedite the advance.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The commander could continue pressing forward or slow the operation and support the isolated company; he chooses
    to stop rushing after reports of disrupted communications, interdicted UAVs, and an enemy contact. Keep the focus on this
    command-level risk and tempo decision, not on the scouts’ or company’s engagements.
  span_range:
  - src:d0833ff10c40#p54.2
  - src:d0833ff10c40#p54.3
  decision: The task force commander chooses to stop rushing the advance and get additional help to the company team.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The staff considers keeping the reserve available to exploit whichever axis succeeds, but recommends committing it
    to one axis because degraded communications and enemy friction could make a later shift difficult. The commander accepts
    that plan and directs host-nation forces to follow the other team; exclude the tactical details of movement.
  span_range:
  - src:d0833ff10c40#p63.2
  - src:d0833ff10c40#p63.3
  decision: The task force commander approves a plan to have the reserve follow and assume the company team’s axis rather
    than remain positioned to exploit either axis.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The commander initially requires rapid graphics, then offers the staff more time to assess the plan and its contingencies.
    He cites the prior rushed operation, added complexity, and the need to ensure branches remain sound; exclude the mechanics
    of planning and graphic production.
  span_range:
  - src:d0833ff10c40#p65.2
  - src:d0833ff10c40#p65.3
  decision: The task force commander allows more time for planning rather than rushing the military decisionmaking process.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The commander could halt or continue; after learning aviation support is unavailable for hours, he decides to move
    the company teams before the enemy can reinforce. The passage also notes unreliable communications and his consideration
    of going to ground; exclude the subsequent combat and movement techniques.
  span_range:
  - src:d0833ff10c40#p48.3
  - src:d0833ff10c40#p49.2
  decision: The company commander chooses to resume the advance despite the loss of near-term aviation support.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to pursue on the commander’s initiative or pause to coordinate with flank units and
    higher headquarters. Keep the analysis at the level of command authority, coordination, and the risk to the neighboring
    unit; exclude the mechanics of the advance.
  span_range:
  - src:d0833ff10c40#p74.2
  - src:d0833ff10c40#p74.3
  decision: The task-force commander chose to pursue north to re-establish contact and relieve pressure on the neighboring
    task force.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to proceed immediately or wait for neighboring units to set conditions and for additional
    support to become available. Consider the commander’s assessment of flank risk, jamming, and possible bridging support;
    exclude the detailed maneuver plan.
  span_range:
  - src:d0833ff10c40#p77.2
  - src:d0833ff10c40#p79.2
  decision: The brigade commander chose to approve the task-force plan but require a one-day delay before the advance.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
