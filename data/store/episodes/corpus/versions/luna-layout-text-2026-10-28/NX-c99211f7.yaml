episodes:
- n: 1
  focus: The decision point is whether to pursue foreign contributions and obtain a legal basis for doing so, or stop seeking
    that funding in light of the restrictions. The report gives Casey’s stated concern about authority and the Attorney General’s
    condition that the foreign governments use their own funds without U.S. reimbursement; exclude the mechanics of accounts
    and transfers.
  span_range:
  - src:5b1074fc20cf#p1.5
  - src:5b1074fc20cf#p1.7
  decision: CIA Director chooses to seek legal clearance for third-country contributions to sustain contra support despite
    Boland concerns.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to notify Congress under the National Security Act or defer notice on grounds of extreme
    sensitivity. Casey agreed that a Finding was necessary and forwarded the draft; the report says the President reportedly
    signed it, while noting that no signed copy was located and the President did not recall signing. Exclude the operational
    details of the assistance.
  span_range:
  - src:5b1074fc20cf#p1.26
  - src:5b1074fc20cf#p1.28
  decision: CIA Director backs a presidential Finding that would defer congressional notification of Iran-related assistance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: At the January 7, 1986 meeting, the President chose to proceed with the Israeli-Iranian offer, despite opposition
    from the Secretaries of State and Defense. The report places this choice against the Administration’s concern for hostages
    and records disagreement among senior officials; exclude the mechanics of weapons transfers.
  span_range:
  - src:5b1074fc20cf#p1.29
  - src:5b1074fc20cf#p1.34
  decision: President chooses to proceed with the proposed Iran arms sale linked to the release of American hostages.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The CIA Director had heard reports of a possible diversion but omitted them from his testimony; later, he said he
    withheld them to protect an ongoing operation he hoped would help secure hostages’ release. Focus on the choice to disclose
    or withhold the suspicions from congressional oversight, not on the underlying covert operation.
  span_range:
  - src:5b1074fc20cf#p1.76
  - src:5b1074fc20cf#p1.78
  decision: The CIA Director decided not to disclose suspected diversion to the congressional intelligence committees during
    his November 21 testimony.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The CIA Director acknowledged that he did not inform the President of diversion rumors, explaining that he did not
    think they warranted the President’s attention. Focus on the decision to escalate or withhold the information from the
    President, not on operational details of the diversion.
  span_range:
  - src:5b1074fc20cf#p1.74
  - src:5b1074fc20cf#p1.76
  decision: The CIA Director decided not to tell the President about diversion rumors.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: After the CIA Director recommended a White House Counsel review, the National Security Adviser chose NSC counsel
    instead, saying he did not trust White House counsel to keep the matter confidential. Focus on the choice of reviewer
    and the stated trust rationale, not on the Iran operation itself.
  span_range:
  - src:5b1074fc20cf#p1.53
  - src:5b1074fc20cf#p1.53
  decision: The National Security Adviser decided to have NSC counsel, rather than White House counsel, conduct the review
    of the Iran affair.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
