- n: 2
  focus: The researcher compares the Arab opposition party, the African party’s radical faction, and the possibility of an
    unplanned uprising, then settles on a revised reconstruction based on the evidence. Exclude the operational details of
    the revolt and focus only on the analytic choice and its evidentiary grounds.
  span_range:
  - src:9a02d2bd7fcb#p7.1
  - src:9a02d2bd7fcb#p9.1
  decision: A CIA historical researcher rejected the initial attribution and favored an account in which the African-majority
    party’s radical faction had planned for revolution, but events began spontaneously and ahead of schedule.
