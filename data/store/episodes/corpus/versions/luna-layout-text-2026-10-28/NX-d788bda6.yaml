episodes:
- n: 1
  focus: The choice was whether Treasury would defer to Justice’s delegated authority or conduct parallel investigations under
    its asserted earlier authority. The document describes McAdoo’s position that limited resources required marshaling all
    available investigative help; exclude the operational conduct of any investigation.
  span_range:
  - src:296bf758a6b8#p9.4
  - src:296bf758a6b8#p11.2
  decision: Treasury Secretary directs the Secret Service to investigate alien enemies despite the wartime proclamation assigning
    that activity to Justice.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The options were centralizing intelligence in a new bureau or coordinating existing agencies through weekly meetings
    under Justice’s auspices. The passage gives the centralization proposal’s opposition and the War Department representatives’
    support for the alternative; exclude any operational investigative details.
  span_range:
  - src:296bf758a6b8#p13.2
  - src:296bf758a6b8#p13.3
  decision: Representatives at the interdepartmental intelligence conference choose weekly coordination under Justice rather
    than McAdoo’s central Bureau of Intelligence proposal.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The Attorney General chose to fight the proposed expansion of military authority rather than accept military control
    over large areas of civilian society. His stated reasons were that the home front was peaceful, civil courts were functioning,
    and such a drastic measure was dangerous and unnecessary; exclude the bill’s lobbying tactics except as context.
  span_range:
  - src:296bf758a6b8#p13.5
  - src:296bf758a6b8#p14.3
  decision: Attorney General opposes legislation creating broad domestic war zones under military authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
