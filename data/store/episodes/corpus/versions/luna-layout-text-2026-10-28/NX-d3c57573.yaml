episodes:
- n: 1
  focus: The doctrine recommends prompt dissemination when time is at a premium, with a caveat that the information is unprocessed
    and may be unreliable. Focus on the trade-off between timeliness and reliability; exclude operational collection methods.
  span_range:
  - src:6129bd96c07a#p79.3
  - src:6129bd96c07a#p79.3
  decision: Intelligence staff decide whether to disseminate time-sensitive information immediately in unprocessed form or
    wait for full processing and analysis.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The doctrine frames a choice between protecting the source and distributing valuable information, and requires J2
    advice, including consultation with the originator, before the decision. It identifies tear-lines as a possible way to
    balance security and distribution, but does not specify the commander’s ultimate choice; exclude technical details of
    source protection.
  span_range:
  - src:6129bd96c07a#p79.5
  - src:6129bd96c07a#p79.5
  decision: The commander decides whether to accept possible source compromise in order to distribute intelligence, after
    receiving J2 advice and consulting the originator.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  relaxed:
  - choice_stated
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
  gold_tier: model-solved
- n: 3
  focus: At the course-of-action validation and decision stages, the staff assesses the options independently and recommends
    the one with the highest probability of success at an acceptable level of risk; the commander then identifies the optimum
    course for detailed development. Keep the decision at the level of command choice and the stated success-and-risk standard;
    exclude operational techniques for carrying out any course.
  span_range:
  - src:6129bd96c07a#p172.8
  - src:6129bd96c07a#p172.9
  decision: The commander chooses which course of action the staff will develop in detail after comparing the available courses.
  content_domain: operational-command
