episodes:
- n: 1
  focus: 'The decision point is how to frame the Academy’s response while the pandemic’s course was uncertain: address the
    immediate return question alone or plan across recurring academic, training, and commissioning milestones. Include the
    stated aim of buying decision time while protecting the force and sustaining Cadet development; exclude the mechanics
    of the planning process.'
  span_range:
  - src:b2b29486f64b#p8.2
  - src:b2b29486f64b#p14.3
  decision: The USMA Superintendent directed the planning team to build and approve a long-term campaign plan tied to known
    Academy events, rather than focus narrowly on whether Cadets should return after spring break.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The choice involved competing for Camp Buckner with summer training and selecting a suitable controlled staging location.
    The report gives reasons for the move, including reduced travel and testing time and adequate control at the USMAPS site;
    exclude the detailed reception and testing procedures.
  span_range:
  - src:b2b29486f64b#p20.3
  - src:b2b29486f64b#p22.1
  decision: USMA RSOI planners chose to relocate later Cadet reception and staging from Camp Buckner to the USMA Preparatory
    School compound rather than continue using Camp Buckner.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether universal testing was warranted for returning Cadets coming from across the country
    and soon departing for follow-on training. The report says the risks of not testing were too high and cites both force
    protection and limiting onward transmission; exclude testing procedures and specimen handling.
  span_range:
  - src:b2b29486f64b#p28.1
  - src:b2b29486f64b#p28.1
  decision: USMA command decided to test every returning member of the class of 2020 rather than test only selected Cadets
    or conduct no testing.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to retain the customary stadium venue or use a larger venue better suited to distancing
    the graduating class and ceremony participants. Focus on the venue choice and its public-health rationale; exclude ceremony
    logistics and the unrelated question of family attendance.
  span_range:
  - src:b2b29486f64b#p42.3
  - src:b2b29486f64b#p43.1
  decision: USMA leadership moved the 2020 graduation from Michie Stadium to the Plain.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to host parents and families in person or have them witness the ceremony virtually
    amid unchanged health-protection conditions. Focus on that attendance decision and the applicable health guidance; exclude
    the separate venue decision and mask implementation details.
  span_range:
  - src:b2b29486f64b#p44.1
  - src:b2b29486f64b#p45.2
  decision: USMA leadership held the graduation without in-person family attendance and made it virtual for friends and families.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to continue using Camp Buckner or relocate RSOI to USMAPS. Focus on the competing facility
    needs and benefits cited for relocation; exclude the detailed transport and testing procedures.
  span_range:
  - src:b2b29486f64b#p37.1
  - src:b2b29486f64b#p37.3
  decision: USMA leadership relocated the remaining Cadet RSOI process from Camp Buckner to the USMAPS facility.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to conduct R-Day as a single-day event or spread the incoming class across three days.
    Focus on the crowd-size and distancing rationale; exclude the event schedule and parent arrangements.
  span_range:
  - src:b2b29486f64b#p39.1
  - src:b2b29486f64b#p39.1
  decision: USMA leadership expanded R-Day into a three-day event, dividing incoming Cadets across the days.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to publish quickly or coordinate and verify information to reduce the risk of misinformation
    and public panic. The source says the aim was to issue the most accurate message in a coordinated and timely manner; exclude
    other communications activities not tied to this tradeoff.
  span_range:
  - src:b2b29486f64b#p66.1
  - src:b2b29486f64b#p66.2
  decision: The West Point public affairs office, working with G-5 engagements staff and the KACH preventative medicine advisor,
    chose to balance speed with accuracy in public COVID-19 messaging.
  content_domain: other:public-health-communications
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is whether to use redundant channels or consolidate public information in fewer places. The passage
    gives broad reach across the community and the use of trusted portals as the reasons; exclude the individual web resources
    except as context for that choice.
  span_range:
  - src:b2b29486f64b#p71.1
  - src:b2b29486f64b#p71.1
  decision: West Point communicators chose to repeat COVID-19 resources across multiple websites and media portals rather
    than rely on a single channel.
  content_domain: other:public-health-communications
  refusal_sensitivity: low
  held_out: false
