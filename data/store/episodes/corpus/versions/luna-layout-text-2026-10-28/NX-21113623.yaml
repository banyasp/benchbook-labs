episodes:
- n: 1
  focus: The decision point is whether to proceed with one hybrid commission or separate executive and congressional investigations.
    The chair argued that two inquiries would be redundant and wasteful; the senator agreed after securing congressional representation
    and influence over the commission’s staff leadership. Exclude the later substantive intelligence-reform choices.
  span_range:
  - src:bec833dcabe0#p4.2
  - src:bec833dcabe0#p5.3
  decision: The PFIAB chair and the Senate intelligence committee’s vice chairman agreed to propose a joint presidential-congressional
    commission rather than two separate inquiries.
  content_domain: other:commission design
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether the commission should address oversight or leave that subject to congressional committees.
    The staff director chose the latter division of responsibility; exclude the commission’s broader reform topics and any
    operational intelligence methods.
  span_range:
  - src:bec833dcabe0#p10.5
  - src:bec833dcabe0#p10.5
  decision: The commission staff director decided to leave intelligence oversight outside the commission’s scope and focus
    its work on intelligence gathering, analysis, and dissemination.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to provide a public hearing during an otherwise largely closed inquiry. The stated
    reasons were to give the public a chance to be heard and to demonstrate some openness, reassuring the public that intelligence
    agencies were back on track. Exclude the hearing’s witness testimony and the commission’s substantive recommendations.
  span_range:
  - src:bec833dcabe0#p19.4
  - src:bec833dcabe0#p19.4
  decision: The acting commission chair and staff decided to hold a public hearing near the end of the inquiry rather than
    conduct the entire process behind closed doors.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the commission’s choice among proposals including removing the Directorate of Operations from
    the CIA, making the DCI an intelligence czar, or placing all intelligence in the Department of Defense, versus limited
    changes such as special deputies and a constrained role in agency-head appointments. The commission said the more radical
    proposals’ deficiencies outweighed their virtues; focus on the policy tradeoff over authority and institutional balance,
    not operational intelligence activity.
  span_range:
  - src:bec833dcabe0#p26.2
  - src:bec833dcabe0#p26.4
  decision: The commission decided against radical restructuring of the Intelligence Community and recommended a more limited
    increase in the DCI’s authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The commission chose disclosure rather than continued nondisclosure of the aggregate figure, presenting it as an
    oversight measure. The passage gives a brief rationale and public-pressure context; exclude any question of disclosing
    more detailed or operationally sensitive information, which is not addressed here.
  span_range:
  - src:bec833dcabe0#p27.2
  - src:bec833dcabe0#p27.2
  decision: The commission decided to endorse public release of the aggregate intelligence budget figure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
