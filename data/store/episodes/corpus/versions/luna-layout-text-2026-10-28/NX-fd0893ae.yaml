  focus: The Director chose centralized administrative support over separate administrative staffs for the Clandestine Services
    and other units, despite opposition. The account cites repeated disputes over administration and the need to make responsibility
    clear; exclude the later implementation details and personalities involved.
  span_range:
  - src:858cba182cb6#p11.3
  - src:858cba182cb6#p14.1
  decision: The Director of Central Intelligence centralized agency-wide administrative responsibility under the Assistant
    Deputy Director for Administration.
  content_domain: other:agency administration
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The Director overruled the medical director’s refusal and approved the employee’s proposed travel despite a known
    heart problem and a lengthy sea voyage. The stated considerations were the employee’s value to the office and the need
    to cover overseas posts; exclude medical advice or any assessment not stated in the passage.
  span_range:
  - src:858cba182cb6#p10.3
  - src:858cba182cb6#p10.4
  decision: The Director of Central Intelligence approved a medically contested overseas trip for a senior employee.
  content_domain: other:employee welfare
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The Executive Director declined the requested use rather than granting an exception, even after pressure from the
    Senator’s office. He cited employees still being present and the precedent such an exception would set; exclude the surrounding
    details of the phone calls and golf outing.
  span_range:
  - src:858cba182cb6#p23.3
  - src:858cba182cb6#p24.1
  decision: The Executive Director denied a Senator’s request to use the agency parking lot for a private event.
  content_domain: other:facility governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to have the employee retire immediately or allow him to take sick leave first; the
    Executive Director chose the latter, citing both the employee’s accrued leave and reluctance to see his career end that
    way. Keep the focus on this personnel-management judgment, not the employee’s earlier conduct as an operational matter.
  span_range:
  - src:858cba182cb6#p24.6
  - src:858cba182cb6#p24.6
  decision: The Executive Director allowed an employee facing retirement after repeated intoxication at meetings to use accrued
    sick leave before retiring.
  content_domain: other:personnel management
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is choosing the next Executive Director after the incumbent announced his retirement; the deputies
    and others considered a successor, and the Director approved their choice. The passage gives only brief reasons for the
    selection, so exclude the incumbent’s separate decision to retire and do not infer unstated qualifications or selection
    criteria.
  span_range:
