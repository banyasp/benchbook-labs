  focus: The passage presents three planning models and recommends model C, in which the cross-government strategy is developed
    first and the military response supports it. Focus on the policy choice and its rationale; exclude operational planning
    techniques and the separate models of inter-agency working.
  span_range:
  - src:f3d55e3f1504#p56.7
