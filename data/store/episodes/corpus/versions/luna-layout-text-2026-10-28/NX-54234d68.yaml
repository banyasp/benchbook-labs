episodes:
- n: 1
  focus: The decision point is the Director’s 1941 authorization and push for a transfer of Mexican coverage. The stated considerations
    include avoiding duplicated effort and freeing FBI agents for other work; exclude the operational details of intelligence
    activity.
  span_range:
  - src:dc29b7225596#p8.3
  - src:dc29b7225596#p9.3
  decision: The FBI Director authorizes his deputy to offer the Navy intelligence service full responsibility for intelligence
    coverage in Mexico rather than retain or divide that work within the FBI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the January 1942 jurisdictional resolution after proposals for the Coordinator of Information
    to take over the SIS. The article presents the concern that divided responsibility in delicate foreign work could cause
    confusion and buck-passing; exclude covert operational methods.
  span_range:
  - src:dc29b7225596#p11.2
  - src:dc29b7225596#p11.5
  decision: The Attorney General and intelligence leaders resolve the proposed transfer of Latin American intelligence responsibilities
    by retaining the FBI as the single agency responsible for the SIS, rather than transferring the work to the Coordinator
    of Information or dividing it among agencies.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
