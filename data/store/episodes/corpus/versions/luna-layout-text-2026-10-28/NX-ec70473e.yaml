episodes:
- n: 1
  focus: The decision followed repeated efforts to get departmental intelligence services to cooperate, which had produced
    little apparent progress. Focus on the choice to create a nondepartmental office with broad coordinating and supplementary-activity
    authority; exclude the later operational work of the office.
  span_range:
  - src:0efe6ca64bdc#p3.3
  - src:0efe6ca64bdc#p3.5
  decision: The President creates a new civilian Coordinator of Information office rather than relying on existing agencies
    to coordinate intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The President chose to keep the Foreign Information Service’s attributable broadcasting mission out of military hands
    while transferring the remainder of COI to the Joint Chiefs. Focus on this division of institutional responsibility and
    propaganda authority; exclude the methods of propaganda or later OSS operations.
  span_range:
  - src:0efe6ca64bdc#p6.1
  - src:0efe6ca64bdc#p6.2
  decision: The President separates the Foreign Information Service from COI, placing it in the Office of War Information
    while moving the remaining office under the Joint Chiefs as OSS.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision was an exception to a policy that constrained contacts with German peace feelers, amid concern about
    Allied policy and Soviet suspicions. Focus on whether to authorize the meeting and the competing policy interests and
    reported outcome; exclude the mechanics of conducting the contacts.
  span_range:
  - src:0efe6ca64bdc#p16.2
  - src:0efe6ca64bdc#p16.2
  decision: Higher authority in Washington permits the OSS station chief in Bern to meet an SS general about surrendering
    German forces in Italy, despite the unconditional-surrender policy.
  content_domain: other:surrender-negotiation-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision arose after Thai opposition leaders offered intelligence and proposed resistance to Japan, while OSS
    officers also saw support as a way to bolster Thailand’s postwar independence amid suspected British imperial designs.
    Focus on the policy choice to promise support and its subsequent endorsement; exclude the operational details of organizing
    or supporting the force.
  span_range:
  - src:0efe6ca64bdc#p24.2
  - src:0efe6ca64bdc#p24.3
  decision: OSS officers promise American support for a projected Thai guerrilla force, and the Department of State retroactively
    endorses the resulting change in U.S. policy.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is the President’s postwar choice, formalized in Executive Order 9621, to dissolve OSS despite
    Donovan’s protest and assign its components to other departments. The stated context includes pressure for rapid demobilization,
    congressional opposition to war agencies, and the President’s distrust of Donovan; exclude later organizational outcomes
    and operational activities.
  span_range:
  - src:0efe6ca64bdc#p26.4
  - src:0efe6ca64bdc#p27.1
  decision: The President chose to dissolve OSS and transfer its branches to the State and War Departments rather than preserve
    OSS or immediately create Donovan’s proposed permanent agency.
  content_domain: other:intelligence organization policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 6
  focus: 'The decision point is how to handle OSS components outside the Research and Analysis Branch once rapid closure became
    necessary: the staffer assigned them to the War Department for salvage and liquidation, with possible temporary continuation
    of some functions. Focus on the organizational disposition and rationale of urgency; exclude any details about overseas
    networks’ operations.'
  span_range:
  - src:0efe6ca64bdc#p26.5
  - src:0efe6ca64bdc#p26.5
  decision: A Budget Bureau staffer chose to transfer the remainder of OSS to the War Department for salvage and liquidation
    after the White House ordered OSS closed quickly.
  content_domain: other:intelligence organization policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is the Assistant Secretary’s interpretation of the President’s liquidation directive and choice
    to retain the branches as a going operation; the Secretary of War confirmed the directive and emphasized functions valuable
    for permanent peacetime purposes. Assess the authority and policy judgment behind preserving those capabilities; exclude
    how the branches conducted intelligence activities or operated overseas networks.
  span_range:
  - src:0efe6ca64bdc#p27.4
  - src:0efe6ca64bdc#p27.4
  decision: The Assistant Secretary of War chose to preserve the SI and X-2 Branches as an operating unit in the Strategic
    Services Unit rather than liquidate them with the rest of OSS.
  content_domain: other:intelligence organization policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
