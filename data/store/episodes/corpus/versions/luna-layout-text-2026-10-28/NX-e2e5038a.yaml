  focus: The DCI plans to support strengthening DIA as an adjunct to the JCS, while arguing that DIA should focus on essentially
    military intelligence and CIA on matters extending beyond military implications. The stated rationale is DIA’s role supporting
    JCS command responsibilities and the need to distinguish agencies’ work and avoid duplication; exclude operational collection
    or clandestine methods.
