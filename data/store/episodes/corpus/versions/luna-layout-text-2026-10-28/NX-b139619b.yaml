episodes:
- n: 1
  focus: The decision point is whether to keep the MQ-9 on its training mission or redirect it for search-and-rescue assistance
    after the crash. The stated reason was to help locate the aircraft and crew; exclude the aircraft’s subsequent search
    methods and other assets’ actions.
  span_range:
  - src:98ed805f752d#p20.3
  - src:98ed805f752d#p20.4
  decision: The Supervisor of Flying at Holloman Tower redirected an MQ-9 from a training mission to assist in locating the
    mishap aircraft and crew.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to authorize the helicopter’s recovery assistance or hold it back. The report states
    that the flight surgeon concurred and that Holloman EOD had conducted a preliminary risk assessment; exclude the recovery
    procedures themselves.
  span_range:
  - src:98ed805f752d#p20.9
  - src:98ed805f752d#p21.1
  decision: The Holloman AFB Incident Commander cleared RESCUE671 to assist in recovering the mishap pilot’s remains.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is the guidance governing which selector mode crews could use: AFT could initiate both ejections,
    while SINGLE required each crew member to initiate separately. The reported reasons for avoiding AFT were a prior seat
    issue, incomplete fleet modifications, and the absence of an Embraer operational bulletin; exclude detailed ejection mechanics.'
  span_range:
  - src:98ed805f752d#p28.6
  - src:98ed805f752d#p28.8
  decision: A-29 flight-manual and guidance authorities directed aircrews to use the ejection-seat selector in SINGLE mode
    rather than AFT mode.
  content_domain: other:aviation safety policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
