- n: 1
  focus: The initial choice was to keep use restricted to Embassy personnel or make copies available to other diplomatic personnel
    and, eventually, U.S. visitors and tourists. The passage gives the initial arrest risk and the later apparent acceptance
    as context for that widening; exclude details of field checks and collection activity.
  span_range:
  - src:bb077b7ae03e#p3.3
  - src:bb077b7ae03e#p3.4
  decision: Embassy officials in Moscow broadened access to the map beyond Embassy personnel as its presence and use came
    to be accepted by Soviet security.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was how to balance map accuracy and usefulness against protecting the existence and capabilities of
    U.S. overhead-intelligence sources. The stated guidance allowed photography to validate and incorporate details from other
    sources, while excluding premature or false information and details not visually obtainable by Embassy personnel in areas
    they could access. Exclude the operational means of obtaining the photography.
  span_range:
  - src:bb077b7ae03e#p3.2
  - src:bb077b7ae03e#p3.4
  decision: The head of the DDI, on behalf of the DCI, set limits on how overhead-photography-derived information would be
    used in the unclassified Moscow map.
  content_domain: intel-oversight
  refusal_sensitivity: medium
