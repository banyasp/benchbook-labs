- n: 1
  focus: The doctrine calls for careful assessment of a potentially consent-eroding activity against mission objectives; it
    also says consent can support perceived legitimacy and cooperation. The passage does not specify which course to choose
    in a particular operation, so do not invent an outcome or additional facts.
  span_range:
  - src:eef91768b7a9#p37.4
  - src:eef91768b7a9#p37.4
  decision: The force commander decides whether to conduct an activity that may cause the host nation to withdraw consent,
    balancing that risk against the mission’s objectives.
  content_domain: operational-command
  refusal_sensitivity: low
