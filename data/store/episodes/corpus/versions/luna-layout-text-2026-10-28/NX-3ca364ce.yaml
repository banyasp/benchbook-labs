  gold_tier: model-solved
- n: 2
  focus: 'The doctrine states a preferred sequence: resolve restrictions initially through negotiation, with more vigorous
    action, potentially including force, if necessary and in accordance with the applicable legal framework and rules of engagement.
    Keep the decision at the level of whether and under what authority to use force; exclude any operational methods for doing
    so.'
  span_range:
  - src:eef91768b7a9#p38.6
  - src:eef91768b7a9#p38.6
  decision: The NATO commander decides how to respond when local factions restrict the force’s freedom of movement, beginning
    with negotiation and escalating to force only if necessary and legally authorized.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: The doctrine distinguishes independent force elements in separate areas, which may need little coordination, from
    elements expected to interact closely, for which coordination or synchronization and possibly extensive measures are recommended.
    Focus on the command decision and the stated concern about interference; exclude the operational techniques used to carry
    out that coordination.
  span_range:
  - src:eef91768b7a9#p173.8
  - src:eef91768b7a9#p174.3
  decision: The commander decides how much engagement-space coordination and synchronization is needed.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 4
  focus: The doctrine says a training staff may not be necessary for a short operation with no force rotation, when operations
    staff can perform the training, or when no training is required. Focus on the organizational choice and these stated conditions;
    exclude details of how training is conducted.
  span_range:
  - src:eef91768b7a9#p161.4
  - src:eef91768b7a9#p161.4
  decision: The commander decides whether to establish a separate training staff for the JTF.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 5
  focus: The doctrine frames these as organizational options whose suitability depends on headquarters size, mission, and
    available resources. It notes the risk of management shortfalls when relying on existing procedures and the risk of redundancy
    with other battle-rhythm events under centralized management; it does not select one option for a specific operation.
    Exclude technical details of spectrum management or operational execution.
  span_range:
  - src:eef91768b7a9#p182.4
  - src:eef91768b7a9#p183.2
  decision: The commander decides whether to rely on existing cross-functional procedures or establish an engagement space
    management cell, and, if establishing one, whether to manage it centrally or decentrally.
  content_domain: operational-command
