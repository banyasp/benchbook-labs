episodes:
- n: 1
  focus: The Chamber rejects the Defence account that the damage was incidental to attacks on military positions, finding
    the claimed positions in the Old Town unsupported and the shelling disproportionate in scale and duration to the asserted
    targets. Keep this as an adjudicative finding about the justification and character of the attack, not as guidance on
    how to conduct artillery operations.
  span_range:
  - src:8c9c506ac414#p1.9
  - src:8c9c506ac414#p1.13
  decision: The Trial Chamber decides whether the Old Town shelling was a response to Croatian military positions or instead
    deliberate shelling of the Old Town.
  content_domain: other:legal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: Choosing between competing prior approaches, the Chamber holds that use of the cultural property itself—not merely
    its location near military activity—determines whether it loses protection. The Chamber explains that nearby military
    activity may affect whether an attack was directed against the cultural property, and notes that military necessity did
    not arise on these facts; exclude operational advice about selecting or attacking targets.
  span_range:
  - src:8c9c506ac414#p1.48
  - src:8c9c506ac414#p1.53
  decision: The Trial Chamber decides whether cultural property loses protection because military activity or installations
    are nearby.
  content_domain: other:legal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: Although the Prosecution alleged an international armed conflict and partial occupation, both parties agreed that
    the conflict’s nature was not an element of the charged crimes. The Chamber therefore declines to decide that issue; keep
    the decision focused on the court’s reason for leaving the legal classification unresolved.
  span_range:
  - src:8c9c506ac414#p1.14
  - src:8c9c506ac414#p1.15
  decision: The Trial Chamber decides whether it needs to determine the international or non-international character of the
    conflict for the charges under Article 3.
  content_domain: other:legal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The Chamber finds effective control, concludes that the commander was on notice during the attack, and holds that
    he failed to obtain reliable information, take reasonable steps to stop the shelling, or investigate and discipline those
    responsible. Focus on the Article 7(3) liability determination and its reasons; exclude the underlying operational details
    of the shelling.
  span_range:
  - src:8c9c506ac414#p1.67
  - src:8c9c506ac414#p1.81
  decision: The Trial Chamber decides whether the commander bears superior responsibility for the unlawful shelling of the
    Old Town.
  content_domain: other:international criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The Appeals Chamber rejects the Trial Chamber’s stronger-risk formulation, applies the ‘reason to know’ standard
    to the commander’s prior knowledge and the warning received during the attack, and allows the prosecution’s appeal on
    this issue. Focus on the legal standard and its application; exclude operational methods or details.
  span_range:
  - src:8c9c506ac414#p1.97
  - src:8c9c506ac414#p1.99
  decision: The Appeals Chamber decides whether the commander’s information triggered the Article 7(3) duty to investigate
    and prevent crimes.
  content_domain: other:international criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The Chamber applies the materially-distinct-elements test and enters convictions only for attacks on civilians and
    destruction or wilful damage of cultural property, finding those counts comprehensively reflect the conduct in this case.
    Focus on the choice among cumulative convictions and the court’s reasons; exclude details of the attack itself.
  span_range:
  - src:8c9c506ac414#p1.82
  - src:8c9c506ac414#p1.86
  decision: The Trial Chamber decides which convictions to enter when multiple counts arise from the same attack.
  content_domain: other:international criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: Applying the case-specific nexus test, the Chamber concludes that the driver’s activities when injured did not establish
    a nexus to acts of war intended to harm enemy forces, and dismisses this ground of appeal. Focus on the legal classification
    and evidentiary reasoning; exclude general operational examples of participation in hostilities.
  span_range:
  - src:8c9c506ac414#p1.87
  - src:8c9c506ac414#p1.94
  decision: The Appeals Chamber decides whether to uphold the finding that the injured municipal driver was not actively participating
    in hostilities.
  content_domain: other:international criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
