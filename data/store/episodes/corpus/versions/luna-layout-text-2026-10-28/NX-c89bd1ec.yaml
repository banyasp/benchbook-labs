- n: 1
  focus: The example recommends activating and moving to the alternate base when the primary base is degraded by a high threat
    of ground attack, provided the alternate base is ready, host-nation security is available, and the COM JTF has authority.
    Treat retaining the primary base as the alternative; exclude operational movement procedures.
  span_range:
  - src:994caff0f27a#p69.2
  - src:994caff0f27a#p69.8
  decision: The COM JTF decides whether and when to activate the alternate theatre logistic base and move forces and equipment
    there.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The decision arises after the staff has prioritized and recommended courses of action and briefed their analysis;
    the commander considers the staff recommendation and their own estimate, experience, and judgment. The doctrine gives
    possible responses but does not identify a particular option for a specific set of operational facts; exclude the operational
    details of any course of action.
  span_range:
  - src:994caff0f27a#p118.6
  - src:994caff0f27a#p120.12
  decision: The operational commander decides which course of action to develop further, including whether to accept, modify,
    merge, or replace the staff-recommended option.
  content_domain: operational-command
  refusal_sensitivity: low
  relaxed:
  - choice_stated
  held_out: false
  natsec: true
