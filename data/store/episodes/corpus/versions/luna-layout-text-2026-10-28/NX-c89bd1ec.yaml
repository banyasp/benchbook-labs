  - doctrine-derived
  gold_tier: model-solved
- n: 3
  focus: The doctrine’s example recommends delaying or forgoing short-term exploitation when doing so is necessary to preserve
    operational objectives, protect an area or population, provide security, prevent lawlessness, or protect vital installations.
    Treat this as a command-level choice about whether to exploit, not as guidance on how to pursue, engage, or use force.
  span_range:
  - src:994caff0f27a#p148.3
  - src:994caff0f27a#p148.7
  decision: A commander decides whether to exploit a fleeting opportunity against a fleeing enemy or allow the enemy to escape.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
