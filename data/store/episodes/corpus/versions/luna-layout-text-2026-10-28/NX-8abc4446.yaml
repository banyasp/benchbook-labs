title: AC-130J AIB Report, Eglin AFB (Apr 2015)
collection: usaf-aib
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The decision was whether to authorize test maneuvers into a condition the aircraft’s technical order prohibited,
    or retain that prohibition. The report identifies AFMC/A3 as the waiver authority and explains that testing sought to
    evaluate flying qualities across the designed envelope; exclude the mechanics of conducting the maneuver.
  span_range:
  - src:0b4710fb4d45#p9.6
  - src:0b4710fb4d45#p13.2
  decision: AFMC/A3 waived the manual prohibition on intentionally maneuvering the AC-130J into a RUDDER alert for flight
    testing.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to proceed with testing toward the edge of the flight envelope despite uncertainty,
    or pause, limit, or defer testing until better data were available. The report says the team proceeded cautiously to investigate
    the aircraft’s changed flying qualities, while acknowledging uncertainty about stability margin; exclude details of how
    the flight-test maneuvers were performed.
  span_range:
  - src:0b4710fb4d45#p10.2
  - src:0b4710fb4d45#p11.5
  decision: The AC-130J test team chose to continue toward the RUDDER alert despite lacking predictive flight data and real-time
    access to relevant aircraft data.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to retain or withdraw the SQ/CZ’s authorization amid disagreements over test thoroughness,
    direction to fly cards out of order, and concerns about data integrity from poorly defined criteria. Keep the focus on
    the authority and organizational decision; exclude the flight-test maneuvers themselves and the team’s lack of awareness
    of the withdrawal.
  span_range:
  - src:0b4710fb4d45#p25.9
  - src:0b4710fb4d45#p25.9
  decision: The SQ/CZ decided to withdraw signature authority—and therefore authorization—from the MOT.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision was whether the test method itself substantially contributed to the mishap. The president declined to
    classify it that way, citing differing views on technical adequacy, the test team’s prior successful points, and the view
    that the test could have been safely executed as planned; exclude the operational merits of specific test procedures.
  span_range:
  - src:0b4710fb4d45#p40.8
  - src:0b4710fb4d45#p41.3
  decision: The AIB president decided not to classify the Method of Test as a substantially contributing factor.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The board considered whether the technical director’s withdrawal from test-card review and rescission of his signature
    reflected ignored safety concerns or otherwise contributed to the mishap. The president declined to attribute substantial
    contribution, citing the lack of evidence of safety concerns, the views expressed by the technical director, and the inconclusive
    evidence about distraction or team effects.
  span_range:
  - src:0b4710fb4d45#p41.5
  - src:0b4710fb4d45#p41.7
  decision: The AIB president decided not to classify the technical director’s rescission of his signature from the Method
    of Test as a substantially contributing factor.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision was whether the erroneous test-card limits should be treated as a contributing factor. The president
    found that they were, reasoning that the crew treated the stated alert limits as the aircraft’s envelope and that correct
    limits might have prompted an earlier termination; the report acknowledges that the actual impact is undetermined and
    the counterfactual is speculative.
  span_range:
  - src:0b4710fb4d45#p40.4
  - src:0b4710fb4d45#p42.5
  decision: The AIB president decided that inaccurate procedural guidance substantially contributed to the mishap.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The board considered whether the distraction contributed to the mishap, despite its possible role in delaying the
    transition from departure recovery to dive recovery. It declined to classify it as substantially contributing because
    the aircraft was already out of the rudder-overbalance condition and the departure recovery had already been undercontrolled
    when the distraction occurred.
  span_range:
  - src:0b4710fb4d45#p42.2
  - src:0b4710fb4d45#p42.2
  decision: The AIB decided not to classify the cockpit distraction as a substantially contributing factor.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
