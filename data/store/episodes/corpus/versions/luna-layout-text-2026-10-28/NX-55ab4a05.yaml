episodes:
- n: 1
  focus: The decision point is whether to mobilize the quick reaction force and advance the drill dates or leave the existing
    schedule in place. The stated reason was the unfolding unrest and White House lockdown, which led the commander to anticipate
    requests for Guard support; exclude subsequent operational execution details.
  span_range:
  - src:c00b7965bc08#p16.2
  - src:c00b7965bc08#p16.2
  decision: The District of Columbia National Guard commanding general moved the June drill dates forward and activated a
    150-person quick reaction force on 29 May 2020.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether, and at what scale, to augment the District of Columbia National Guard with forces
    from other states and territories. The stated basis was rapidly escalating criminal activity and violence and the need
    to support civilian law enforcement; exclude details of force employment.
  span_range:
  - src:c00b7965bc08#p16.3
  - src:c00b7965bc08#p16.3
  decision: The Secretary of Defense directed the National Guard Bureau to obtain additional forces from states and territories,
    based on an estimated requirement of 5,000 Guardsmen.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision arose because the District of Columbia National Guard’s missions exceeded its capacity and the situation
    was described as in extremis. The source cites speed as a benefit of verbal approval and says Title 32 provided appropriate
    pay and benefits; exclude tactical employment details.
  span_range:
  - src:c00b7965bc08#p33.2
  - src:c00b7965bc08#p43.2
  decision: The Secretary of Defense and National Guard Bureau leadership, with the consent of selected governors, chose to
    deploy other states’ Guard units to Washington, D.C. under Title 32, using verbal approvals rather than the normal staffing
    process.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision addressed whether de-escalation through this gesture was permissible in uniform, given concern that
    it might violate rules against political participation. Keep the focus on the policy interpretation and its legal rationale;
    exclude tactical advice about managing a crowd.
  span_range:
  - src:c00b7965bc08#p36.2
  - src:c00b7965bc08#p36.2
  decision: The National Guard Bureau decided that a Soldier may take a knee during civil-disturbance operations to de-escalate
    a situation without that act constituting participation in a political protest.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The report recommends standardizing the cell to provide strategic-level mission command and allow the Guard to focus
    on its tactical mission. Focus on the command-arrangement choice and the stated political sensitivity, fluid circumstances,
    and reporting relationship; exclude tactical deployment details.
  span_range:
  - src:c00b7965bc08#p52.4
  - src:c00b7965bc08#p52.4
  decision: Department of Defense leadership decides whether to standardize a liaison cell co-located with the District of
    Columbia National Guard tactical command post during national-level civil unrest in Washington, D.C.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The report recommends making these requirements part of approving District of Columbia National Guard civil support,
    while describing the existing practice and the relevant approval authorities. Focus on the approval standard, legal authority,
    and interests in justification and reimbursement; exclude operational details of any support mission.
  span_range:
  - src:c00b7965bc08#p53.2
  - src:c00b7965bc08#p53.3
  decision: The Army decides whether to approve civil-support requests without written justification or require a written
    request, evidence that civil authorities have exhausted or will exhaust their capabilities, and reimbursement agreement
    except in dire circumstances.
  content_domain: other:civil-support-approval
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The report recommends designating military police as the initial response and gives reasons including relevant training,
    experience working with civilian law enforcement, and the operational and political risks of using combat-arms forces.
    Focus on force assignment policy and its stated rationale; exclude equipment specifications and methods of force.
  span_range:
  - src:c00b7965bc08#p53.4
  - src:c00b7965bc08#p54.2
  decision: Army leadership decides whether military police or other forces, including combat-arms forces, should serve as
    the initial response for civil-disturbance missions within their respective authorities.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
