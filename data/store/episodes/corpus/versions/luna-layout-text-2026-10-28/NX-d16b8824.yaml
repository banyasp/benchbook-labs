  natsec: false
- n: 4
  focus: The passage contrasts an earlier reluctance to publicize U.S. assistance, motivated by concern about provoking China,
    with a more transparent posture after concerns grew that Taiwan was more vulnerable. Treat this as a public-posture decision;
    exclude the separate question of restoring the advisory group, which is presented only as a renewed call.
  span_range:
  - src:5e94c4640c92#p47.4
  - src:5e94c4640c92#p47.4
  decision: U.S. policymakers chose to speak more openly about military support for Taiwan after 2022.
