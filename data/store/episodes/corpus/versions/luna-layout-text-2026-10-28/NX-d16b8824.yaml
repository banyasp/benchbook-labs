- n: 1
  focus: The decision point is whether to provide the missiles as indirect assistance or avoid or limit that support. The
    passage gives the stated strategic aims—punishing Soviet interference in Vietnam and containing further expansion—and
    says the political risk was considered acceptable despite Soviet awareness, partly because no U.S. conventional or special
    operations forces were deployed. Exclude the weapons’ operational employment and the mechanics of covert assistance.
  span_range:
  - src:5e94c4640c92#p18.2
  - src:5e94c4640c92#p18.2
  decision: U.S. foreign-policy decision makers chose to provide covert U.S.-manufactured Stinger missiles to the Mujahadin
    in Afghanistan in 1986.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is the force-allocation tradeoff between retaining IW capacity and prioritizing conventional warfighting
    preparation. Focus on the stated risk acceptance and its strategic and resource reasons; exclude details of information
    operations or other operational methods.
  span_range:
  - src:5e94c4640c92#p31.3
  - src:5e94c4640c92#p31.3
