- n: 3
  focus: The decision point is the choice to emphasize the indirect dimension of IW, rather than treating non-attributable
    or asymmetric activity as the distinctive focus for general-purpose forces. Consider the stated force-design context and
    reasons; exclude operational details of engaging networks or conducting covert activities.
  span_range:
  - src:5e94c4640c92#p34.2
  - src:5e94c4640c92#p35.3
  decision: USMC leadership chose to focus its general-purpose forces’ IW institutionalization on indirect activities involving
