  natsec: false
- n: 5
  focus: The decision point is whether to continue costly fighter scrambles or emphasize an alternative tracking posture after
    the increase in incursions made the existing response unsustainable. Keep the focus on the policy and resource tradeoff;
    exclude any technical account of how tracking systems operate.
  span_range:
  - src:5e94c4640c92#p62.3
  - src:5e94c4640c92#p62.3
  decision: Taiwan’s defense authorities shifted the response to PLA aircraft incursions from fighter scrambles toward surface-to-air
    missile-system tracking.
  content_domain: other:air-policing policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is how to address arms-trafficking and Saudi security concerns while permitting legitimate commercial
    and humanitarian shipments. The passage describes the blockade’s humanitarian consequences and the supported alternative;
    exclude operational details of vessel screening or interdiction.
  span_range:
  - src:5e94c4640c92#p69.2
  - src:5e94c4640c92#p69.3
  decision: The Maritime Coalition Coordination Cell and its partners chose an independent cargo-processing and inspection
    mechanism over continuing the Saudi-led blockade of commercial maritime traffic into Yemen.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether the military should remain the visible, long-term lead or enable a nonmilitary and
    international solution. The passage gives the reasons for pursuing transfer, including regional demands, risks to legitimacy,
    and competing U.S. military priorities; exclude operational procedures for maritime enforcement.
  span_range:
  - src:5e94c4640c92#p71.3
  - src:5e94c4640c92#p71.4
  decision: Fifth Fleet senior leaders empowered the Maritime Coalition Coordination Cell to pursue transferring long-term
    responsibility for Yemen maritime access and deconfliction from the military to specialized nonmilitary and international
    organizations.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: 'The decision point is whether to retain a dedicated riverine mission and its identity or shift the force toward
    its remaining roles. The source gives the Navy’s stated rationale: riverine warfare was no longer an assigned mission
    and the legacy name no longer described the force’s roles; it also links the change to a broader shift from irregular
    warfare toward great-power competition. Exclude operational riverine methods.'
  span_range:
  - src:5e94c4640c92#p92.2
  - src:5e94c4640c92#p92.3
  decision: Navy leadership decided to remove riverine warfare as an assigned mission and rebrand the Coastal Riverine Force
    as Maritime Expeditionary Security Forces.
  content_domain: other:defense-force-structure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is whether to establish a multinational coordination mechanism to support maritime access and
    humanitarian aid, or rely on other arrangements. The source says the Navy recognized Yemenis’ dependence on maritime food
    imports and describes the cell’s coordination, access, and humanitarian effects. Exclude any operational procedures for
    managing access or sharing information.
  span_range:
  - src:5e94c4640c92#p97.4
  - src:5e94c4640c92#p97.4
  decision: Navy leadership decided to establish a Maritime Coalition Coordination Cell for maritime operations related to
