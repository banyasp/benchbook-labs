  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 10
  focus: 'The decision point is the leadership’s strategic response after the Iran-Iraq War: conventional military efforts
    had yielded little success and Iran lacked international support, while proxy partnerships offered a way to impose costs
    on U.S. regional interests without escalating to conventional war. Exclude operational details about proxy attacks, weapons,
    and capabilities; the focus is the policy choice and its rationale.'
  span_range:
  - src:5e94c4640c92#p105.3
  - src:5e94c4640c92#p105.3
  decision: Post-revolutionary Iranian leadership chose to develop an asymmetric strategy using non-Iranian proxy partners
    to project power rather than rely on conventional war.
