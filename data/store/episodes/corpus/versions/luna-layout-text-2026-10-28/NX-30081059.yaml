  focus: The decision point is whether State or another department should lead coordination, and how to distinguish that role
    from on-the-ground implementation. The report says Iraq experience created a need for stronger capability, identifies
    State as suited to policy coordination and DoD as best equipped for implementation, and records Congress’s authorization
    and NSPD-44’s assignment of the lead. Exclude the later unresolved dispute over Provincial Reconstruction Team staffing
    as a separate decision.
