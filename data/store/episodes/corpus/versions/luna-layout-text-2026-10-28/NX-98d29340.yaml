title: DoDI 3000.17 Civilian Harm Mitigation and Response (21 Dec 2023)
collection: doctrine
doctrine: true
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The initial review may recommend not proceeding when it identifies no potentially causative U.S. operation, and the
    approving official may concur or direct another review, an assessment, or an investigation. Focus on the disposition of
    the report and the review’s objectivity; exclude operational details of the underlying event.
  span_range:
  - src:b9ed55d4f1ba#p33.5
  - src:b9ed55d4f1ba#p33.16
  decision: The commander or designee decides whether to proceed with a civilian harm assessment or initiate an investigation
    after an initial review cannot identify a U.S. military operation that may have caused the reported harm.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The doctrine recognizes that responding individually to every affected person or damaged object may not be practicable
    and says community-level responses may be more appropriate. Focus on the choice of response level and its feasibility;
    exclude operational details of any military operation associated with the harm.
  span_range:
  - src:b9ed55d4f1ba#p41.10
  - src:b9ed55d4f1ba#p41.12
  decision: The commander decides whether to respond to civilian harm individually or at the community level when individual
    responses may not be practicable.
  content_domain: other:civilian-harm-response
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 3
  focus: The doctrine permits omission or limited publication in specified exceptional circumstances and separately allows
    withholding, delay, or limits to protect pending investigations, legal processes, or privacy. Focus on the disclosure
    decision and the interests the CCDR must weigh; exclude any sensitive operational details that might be implicated in
    the information withheld.
  span_range:
  - src:b9ed55d4f1ba#p44.4
  - src:b9ed55d4f1ba#p44.6
  decision: The CCDR decides whether to omit or limit public reporting of a civilian-harm incident or review in exceptional
    circumstances, including when disclosure could impede an inquiry or amplify disinformation.
  content_domain: other:civilian-harm-reporting
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 4
  focus: The instruction permits the CCMD to omit the report in this specified situation, while leaving publication as an
    option. Treat the absence of reportable incidents or review activity as the stated factors; do not infer a stronger rationale
    than the text provides.
  span_range:
  - src:b9ed55d4f1ba#p44.8
  - src:b9ed55d4f1ba#p45.3
  decision: A CCMD decides whether to publish its periodic report when, during or at the end of the preceding quarter, there
    were no newly identified or received civilian-casualty incidents and no related reviews, assessments, or investigations
    pending or newly completed.
  content_domain: other:public reporting policy
  refusal_sensitivity: low
  relaxed:
  - choice_stated
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
  gold_tier: model-solved
