- n: 1
  focus: The decision is whether to approve a broad security response to the suspected Soviet threat, and the authority for
    NSA to carry it out. Focus on the threat assessment, the need to examine equipment more thoroughly away from the embassy,
    and the concern that the Soviets might learn of or interfere with the effort; exclude the operational details of the equipment
    swap and examination.
  span_range:
  - src:9f6173f9bd91#p9.1
  - src:9f6173f9bd91#p10.1
  decision: The President decides whether to authorize NSA’s plan to replace and examine the U.S. embassy’s equipment in Moscow.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision is whether to expand a tightly restricted briefing list to enable State Department cooperation, balancing
    secrecy against the liaison’s concern that he might otherwise be unable to reach the Secretary of State when assistance
    was needed. Exclude the technical and logistical details of the project.
  span_range:
  - src:9f6173f9bd91#p10.2
  - src:9f6173f9bd91#p10.2
  decision: The Deputy National Security Advisor decides whether to permit briefing the Under Secretary for Political Affairs
    about GUNMAN.
