  focus: The minister chose to recommend rapid removal rather than allow the officer to remain amid contacts with Himmler’s
    emissaries. The stated concerns were that the contacts were extremely dangerous and could undermine Allied relations with
    the Soviet Union; exclude the operational details of those contacts.
  span_range:
