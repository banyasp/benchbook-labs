- n: 2
  focus: The President faced the choice of allowing further talks or rejecting them, and declined further exploration after
    the OSS Director advised against proceeding. The relevant considerations were the Allied commitment to consult one another
    on peace, the unconditional-surrender policy, and the risk of damaging solidarity with the Soviet Union; exclude the mechanics
    of arranging or conducting any meeting.
  span_range:
  - src:197d194670f8#p10.2
  - src:197d194670f8#p11.5
  decision: The President declined to authorize further exploration of Himmler’s offer to negotiate.
