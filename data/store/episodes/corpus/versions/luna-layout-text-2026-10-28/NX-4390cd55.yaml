- n: 3
  focus: The doctrine normally recommends LEGAD support, but allows temporary authorization without formal review if orders
    permit, urgency requires it, and the commander is satisfied the use complies with LOAC. It expressly says to deny authorization
    for a weapon altered to increase suffering; focus on authorization and legal judgment, not weapon operation.
