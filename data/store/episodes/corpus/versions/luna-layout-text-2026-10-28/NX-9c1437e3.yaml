  focus: 'The directive frames approval at two gates: the reviewers assess the system against requirements for human judgment,
    risk to non-targets, reliability, legal review, and other safeguards; approval permits progression, while denial means
    it should not be developed or fielded. Treat this as a policy-authorization decision, and exclude any operational details
    about target selection or engagement.'
