episodes:
- n: 1
  focus: The decision point is whether to make an unqualified public claim of legality or wait for, or qualify the claim pending,
    legal advice. The source says the Attorney General had no assurance from the Office of Legal Counsel and had just learned
    of shipments before a presidential Finding; exclude the underlying arms-transfer operations.
  span_range:
  - src:899db722d2b3#p1.9
  - src:899db722d2b3#p1.11
  decision: The Attorney General chooses to insist that the November 10 public statement say no laws or policies had been
    violated, before receiving completed legal analysis.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is the inquiry’s purpose and posture: pursue an impartial account of the shipment or, as the
    report concludes, build a case preserving presidential deniability. The source describes one-on-one interviews without
    notes and failures to protect documents; exclude procedural detail beyond what is needed to identify the accountability
    concern.'
  span_range:
  - src:899db722d2b3#p1.2
  - src:899db722d2b3#p1.5
  decision: The Attorney General chooses to conduct the HAWK fact-finding inquiry as the President’s counselor and friend,
    rather than as an independent law-enforcement inquiry.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to correct the proposed congressional testimony with the known discrepancy or hold
    statements until the facts are established. The source records the Attorney General’s direction and the factual dispute;
    distinguish that stated rationale from the later failure to disclose the Administration’s participation in the shipment.
  span_range:
  - src:899db722d2b3#p1.43
  - src:899db722d2b3#p1.47
  decision: The Attorney General chooses to defer statements about the November 1985 shipment until its facts are clear and
    directs that the CIA Director’s proposed testimony be changed.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The adviser cited the risk that a conversation could appear to coordinate their accounts and could affect the Attorney
    General’s ability to obtain the Secretary’s views independently. The decision point is the advice about avoiding contact;
    exclude any assumption about whether the Secretary followed it.
  span_range:
  - src:899db722d2b3#p1.63
  - src:899db722d2b3#p1.63
  decision: The State Department legal adviser advised the Secretary of State not to speak with the former national security
    adviser during the investigation.
  content_domain: other:government-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The report says the Attorney General quickly concluded that the Secretary of Defense could contribute little and
    that further interviewing was unnecessary. The decision point is whether to pursue that witness further; exclude assumptions
    about what the Secretary would have disclosed.
  span_range:
  - src:899db722d2b3#p1.64
  - src:899db722d2b3#p1.64
  decision: The Attorney General decided not to interview the Secretary of Defense further about the Iran arms sales.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The report describes information from the Secretary of State and others that contradicted the Attorney General’s
    claim, and says he had been told the President’s knowledge could have legal significance. It characterizes insulating
    the President from responsibility as the most plausible explanation; preserve that as the report’s inference, not an established
    motive.
  span_range:
  - src:899db722d2b3#p1.79
  - src:899db722d2b3#p1.91
  decision: The Attorney General told senior advisers that the President had not been informed about the November 1985 shipment,
    despite contrary information available to him.
  content_domain: other:government-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The report says the chief of staff knew the claim was false but was unwilling to speak up until the legality of the
    shipment was determined. The decision point is whether to correct the account immediately or remain silent pending that
    determination.
  span_range:
  - src:899db722d2b3#p1.91
  - src:899db722d2b3#p1.91
  decision: The White House chief of staff chose not to correct the Attorney General’s claim about the President’s knowledge
    at the senior advisers’ meeting.
  content_domain: other:government-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The report says the passage of time made the claimed memory failure too difficult to refute beyond a reasonable doubt.
    The decision point is whether the evidence justified prosecution; exclude conclusions about the Attorney General’s actual
    memory or intent beyond what the report states.
  span_range:
  - src:899db722d2b3#p1.92
  - src:899db722d2b3#p1.93
  decision: The Independent Counsel’s office decided not to pursue a perjury case against the Attorney General based on his
    claimed failure to recall the 1986 discussions.
  content_domain: other:criminal-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is whether to let the investigations continue or pause them while personnel were needed for the
    Iran initiative. The stated reason was to protect the hostage-rescue operation and avoid exposing the Iran arms sales;
    weigh that rationale against the public-interest and law-enforcement costs of delaying investigations that could also
    expose contra-resupply activity. Exclude operational details of the covert activities and treat any contrary motive as
    unproven, consistent with the report’s conclusion.
  span_range:
  - src:899db722d2b3#p1.112
  - src:899db722d2b3#p1.115
  decision: The Attorney General decides to seek a temporary delay in the FBI and Customs investigations of Southern Air Transport.
  content_domain: other:law-enforcement policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
