- n: 1
  focus: The decision point is whether to advocate ending the congressional inquiries or allowing them to continue. The member
    argued that the Commission’s work met the public’s need to know and that further investigations risked harming intelligence
    capabilities; exclude operational details of intelligence activity.
  span_range:
  - src:db316e1074f4#p8.3
  - src:db316e1074f4#p8.9
  decision: A member of the Rockefeller Commission publicly urged Congress to end its ongoing investigations of intelligence
    activities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Commission faced a choice between completing a full investigation and transferring its materials to the ongoing
    Senate inquiry. The source says it ran out of time and transferred the materials; exclude details of any assassination
    operation.
  span_range:
  - src:db316e1074f4#p8.9
  - src:db316e1074f4#p8.9
  decision: The Rockefeller Commission transferred its materials on assassination plots to the Senate Church Committee rather
    than complete its own investigation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: Reconstruct the choice in light of the warning that hardliners might act, the absence of specific information about
    what would happen or when, and the administration’s policy of seeking change without backing a particular Soviet leader.
    Include the President’s concern that abandoning the Soviet leader could provoke a more severe military crackdown and reverse
    progress; exclude operational intelligence-gathering details.
  span_range:
  - src:db316e1074f4#p14.4
  - src:db316e1074f4#p15.8
  decision: The President chose to continue supporting the Soviet leader rather than shift U.S. support toward the Russian
    leader after receiving warning of a possible coup in August 1991.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The analysts weigh assigning probabilities against withholding them while assessing a volatile situation; they state
    they are loath to assign probabilities and do not agree on whether a showdown will occur or who would prevail. Focus on
    this analytic judgment and its uncertainty, not on the separate suggestion to forward the memorandum to policymakers.
  span_range:
  - src:db316e1074f4#p29.2
  - src:db316e1074f4#p29.3
  decision: CIA Soviet-analysis leadership declines to assign probabilities to possible Soviet leadership-crisis scenarios.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The assessment says the leadership has undertaken the hazardous path of radical reform because it believes the old
    system is failing and inaction would be more dangerous; it also notes destabilization risks. Focus on that broad policy
    choice and its stated rationale, not on predictions about which faction might prevail or on specific implementation measures.
  span_range:
  - src:db316e1074f4#p33.3
  - src:db316e1074f4#p33.5
  decision: Soviet leadership pursues radical reform rather than preserving the existing system or doing nothing.
  content_domain: other:Soviet domestic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
