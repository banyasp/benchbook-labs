  natsec: true
- n: 2
  focus: The decision point is the commander’s choice, under the cited Air Force instruction, between allowing the pilot to
    remain CMR on probation and placing him on regression. The report connects the initial shortfall to limited aircraft availability;
    exclude later piloting actions and the mishap’s operational details.
  span_range:
  - src:798728f471e3#p24.4
  - src:798728f471e3#p24.5
  decision: The squadron commander decided to place the pilot on probation while allowing him to remain CMR after he failed
    sortie look-back requirements.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to use the customary early descent to isolate aircraft and give controllers more time
    to manage those still entering the arc, or follow the depicted and briefed timing. The report says the early descent reduced
    the margin for error; exclude detailed flight-control or recovery maneuvers.
