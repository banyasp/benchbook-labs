episodes:
- n: 1
  focus: The DCI could retain the authority granted to his predecessor or agree to withdraw it. He expected withdrawal to
    improve relations with departmental agencies; the Secretaries also raised concerns about friction and the appearance of
    CIG acting like a Gestapo. Exclude the separate dispute over IAB review procedures.
  span_range:
  - src:ff1a6bb92011#p8.3
  - src:ff1a6bb92011#p9.1
  decision: The DCI chose to relinquish his authority to act as executive agent for the Secretaries of State, War, and the
    Navy.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The DCI faced a choice between blocking the directive and letting it proceed despite its restrictions on his recommendations.
    The account says he hoped tempers would cool, expected the directive not to remain controlling, and intended to preserve
    his independent right to make recommendations. Exclude operational intelligence matters except as background to the authority
    dispute.
  span_range:
  - src:ff1a6bb92011#p10.3
  - src:ff1a6bb92011#p11.2
  decision: The DCI chose to allow the Eleventh NIA Directive, including restrictions involving the IAB, to take effect rather
    than withhold his approval.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The DCI could accept the committee’s revisions, which strengthened IAC influence over the DCI and reduced his supervisory
    authority, or reject them and advance changes of his own. The account records his rejection and the ensuing support for
    his position, including the Defense Secretary’s backing and concerns about the CIA’s ability to produce scientific intelligence.
    Exclude technical or operational intelligence procedures.
  span_range:
  - src:ff1a6bb92011#p22.1
  - src:ff1a6bb92011#p24.4
  decision: The DCI chose to reject the Ad Hoc Committee’s revisions as a whole and submit a modified approach to the intelligence
    chiefs and NSC.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
