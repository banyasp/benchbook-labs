episodes:
- n: 1
  focus: 'The decision point is the choice of a target system and its stated rationale: sustained attacks were projected to
    create coke and then steel shortages that would constrain Japan’s armament industry. Include the staff’s concern that
    the analysis rested on inadequate data and the rejection of its alternative plan; exclude operational details of conducting
    attacks.'
  span_range:
  - src:15d973abd5f4#p3.2
  - src:15d973abd5f4#p4.4
  decision: The Joint Chiefs of Staff chose to direct the China-based B-29 command against Japan’s coke industry rather than
    the alternative strategic targets proposed by theater staff.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 2
  focus: The decision point is whether to proceed with the proposed Tokyo mission from the China bases or abandon it. The
    stated concern was that the aircraft could carry only a few hundred pounds per plane at that distance; exclude any operational
    detail beyond that policy-level rationale.
  span_range:
  - src:15d973abd5f4#p2.4
  - src:15d973abd5f4#p3.1
  decision: The Joint Chiefs of Staff representatives dropped the proposed China-based B-29 mission against Tokyo after the
    theater air commander objected to its limited expected payload.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The decision point is the choice of Yawata as the initial target, reportedly because Washington believed it contained
    Japan’s largest collection of coke ovens. The account questions the evidence behind that belief and later reports the
    target was undamaged; exclude the mechanics of the mission and photography.
  span_range:
  - src:15d973abd5f4#p4.5
  - src:15d973abd5f4#p6.1
  decision: The XXth Bomber Command selected the Yawata steel plant for its initial mission against Japan.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
