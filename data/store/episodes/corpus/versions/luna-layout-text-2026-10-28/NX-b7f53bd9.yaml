episodes:
- n: 1
  focus: The decision point is whether to deploy forces to defend Kuwait despite intelligence reporting that could not be
    corroborated. The assessment warned of a potentially imminent attack with virtually no warning; exclude the operational
    details of reconnaissance and force movement.
  span_range:
  - src:0cb262ea0ba8#p5.12
  - src:0cb262ea0ba8#p5.15
  decision: UK decision-makers dispatched British military units to Kuwait in July 1961 in response to the assessed Iraqi
    threat.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to maintain a heightened alert or lower it amid reports of Iraqi military activity.
    The JIC cited low readiness and morale, Baghdad’s internal power struggles, and calm in Kuwait; U.S. officials disputed
    the assessment. Exclude the technical details of intelligence collection.
  span_range:
  - src:0cb262ea0ba8#p10.2
  - src:0cb262ea0ba8#p10.4
  decision: UK forces lowered their alert status in 1963 following the Joint Intelligence Committee’s assessment that an Iraqi
    attack was unlikely.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to proceed with the planned withdrawal or retain forces despite assessed Iraqi capabilities.
    The Chiefs of Staff judged an attack unlikely while the Gulf remained stable and noted Iraq’s internal tensions and Kuwait’s
    capacity to control opposition; the defense commitment had also lapsed. Exclude operational force-disposition details.
  span_range:
  - src:0cb262ea0ba8#p12.8
  - src:0cb262ea0ba8#p12.10
  decision: UK decision-makers withdrew British forces from the Gulf in 1971 as planned rather than extending their military
    presence to deter a possible Iraqi attack on Kuwait.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
