episodes:
- n: 1
  focus: The decision was between joining the action without support from a majority of the Security Council and not joining
    it. The passage gives the pressure to stand alongside the US as a reason, while noting that diplomatic options had not
    been exhausted; exclude operational invasion planning.
  span_range:
  - src:7b7b9dce7fcd#p9.5
  - src:7b7b9dce7fcd#p10.6
  decision: The UK Government, led by the Prime Minister, chose in March 2003 to join US-led military action if Saddam Hussein
    did not accept the ultimatum.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to pursue the UN route—using a resolution and an ultimatum—or leave open unilateral
    action. The stated considerations include avoiding unilateral US action, building international support, and the UK’s
    requirement that Iraq be taken back to the Security Council; exclude military or other operational planning.
  span_range:
  - src:7b7b9dce7fcd#p9.4
  - src:7b7b9dce7fcd#p21.5
  decision: The UK Government chose to make UN action and a Security Council process a condition of UK participation in possible
    military action against Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision concerned how to reduce the threat from Iraq and pursue its longer-term reintegration: continue containment
    and disarmament efforts or try to topple Saddam Hussein. The passage says containment was considered the only viable approach
    and that a toppling policy would lack useful international support; exclude later military planning and operational activity.'
  span_range:
  - src:7b7b9dce7fcd#p10.9
  - src:7b7b9dce7fcd#p11.9
  decision: The Ministerial Committee on Defence and Overseas Policy chose containment as the UK’s Iraq strategy in May 1999
    rather than pursuing regime change.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to continue the UN route and seek enough support for a further resolution, rather than
    allow the military timetable to proceed without it. The stated reasons include trying to secure nine Council votes and
    parliamentary support; exclude the operational details of military planning.
  span_range:
  - src:7b7b9dce7fcd#p34.10
  - src:7b7b9dce7fcd#p35.7
  decision: The UK Prime Minister decided to make a final effort to secure a second Security Council resolution, proposing
    a short extension and tests of Iraqi compliance.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to continue pursuing a peaceful UN resolution and inspections or to end that route
    and seek authority for military action. The passage cites the failed prospect of Security Council consensus, Iraq’s alleged
    persistent refusal to meet UN demands, and the stated aim of enforcing disarmament and UN authority; exclude tactical
    or operational conduct of the campaign.
  span_range:
  - src:7b7b9dce7fcd#p41.10
  - src:7b7b9dce7fcd#p42.11
  decision: The UK Cabinet decided to end the diplomatic process, issue an ultimatum to Iraq, and seek parliamentary endorsement
    for UK participation in military action if necessary.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is the House’s choice to support or reject the Government’s request after the UN route had ended
    and before military action. The stated basis was disarmament of Iraq’s WMD; exclude the operational conduct of any ensuing
    military action.
  span_range:
  - src:7b7b9dce7fcd#p42.7
  - src:7b7b9dce7fcd#p43.6
  decision: The House of Commons decided whether to support the Government’s proposed use of all necessary means to secure
    Iraq’s disarmament.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The decision was presented as necessary to enforce Iraq’s disarmament obligations and address the perceived threat,
    but the Inquiry records that inspections and diplomatic options had not been exhausted and that the UK went to war without
    explicit Security Council authorisation. Include the competing assessments of the threat and the risk that military action
    would increase terrorism; exclude operational planning and conduct of the conflict.
  span_range:
  - src:7b7b9dce7fcd#p45.3
  - src:7b7b9dce7fcd#p55.2
  decision: The UK Prime Minister and Government decide whether to proceed with military action against Iraq rather than continue
    inspections and diplomacy.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The Government chose full support, reasoning that it would protect the strategic alliance and allow the UK to influence
    US policy from within. The Inquiry notes that the UK could have maintained its differing position without necessarily
    causing lasting damage to the relationship; exclude operational military planning.
  span_range:
  - src:7b7b9dce7fcd#p55.3
  - src:7b7b9dce7fcd#p58.8
  decision: The UK Government decides whether to give the United States unqualified support on Iraq or maintain support subject
    to UK conditions.
  content_domain: other:foreign-policy
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is the Attorney General’s choice between the safer legal course of securing a second resolution
    and advising that the existing resolutions could provide a basis for action. The advice acknowledged legal uncertainty
    and depended on strong factual grounds that Iraq had failed to take its final opportunity; exclude the Prime Minister’s
    separate determination that Iraq was in breach.
  span_range:
  - src:7b7b9dce7fcd#p69.4
  - src:7b7b9dce7fcd#p70.11
  decision: The Attorney General decided on 13 March 2003 that, on balance, the legal basis for UK military action without
    a further Security Council resolution was the better view.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is Cabinet’s endorsement of the policy, in circumstances where members were given the Government’s
    legal position but not the competing legal arguments or the basis for the Prime Minister’s breach determination. The stated
    rationale was that the diplomatic process had ended and force might be needed to enforce compliance; exclude operational
    military options, which were not substantively discussed.
  span_range:
  - src:7b7b9dce7fcd#p67.5
  - src:7b7b9dce7fcd#p73.4
  decision: Cabinet decided on 17 March 2003 to confirm that diplomacy was at an end and that Parliament should be asked to
    endorse military action to enforce Iraq’s compliance.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to publish the dossier or continue to withhold it while the policy direction remained
    unsettled. The report says the announcement responded to intense speculation and that the dossier was intended to make
    the case for urgent action and secure parliamentary and public support; exclude judgments about dossier content that are
    not part of the publication decision.
  span_range:
  - src:7b7b9dce7fcd#p76.6
  - src:7b7b9dce7fcd#p76.12
  decision: The Prime Minister decided on 3 September 2002 to announce publication of the Iraq dossier.
  content_domain: other:intelligence-publication
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 12
  focus: The decision was whether to deploy the brigade to support security efforts in Baghdad or leave the task to US forces.
    The Chiefs weighed the potential contribution against the risk of tying UK forces down outside the UK’s area of responsibility;
    exclude tactical details of the proposed work.
  span_range:
  - src:7b7b9dce7fcd#p92.10
  - src:7b7b9dce7fcd#p93.2
  decision: The Chiefs of Staff decided against deploying 16 Air Assault Brigade to Baghdad in May 2003.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 13
  focus: The decision joined plans for Iraqiisation in southern Iraq with a substantial deployment to Afghanistan, against
    the stated need to balance resources across both commitments. The Inquiry notes that the transfer rested on high-risk
    assumptions about Iraqi forces and would constrain a possible reinforcement of Iraq; exclude operational details of either
    deployment.
  span_range:
  - src:7b7b9dce7fcd#p104.2
  - src:7b7b9dce7fcd#p104.9
  decision: The Defence and Overseas Policy Sub-Committee on Iraq agreed proposals in July 2005 to transfer security responsibility
    in MND(SE) to Iraqi forces and deploy a UK force to Helmand.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is whether to advise that force required a second resolution or that resolution 1441 could revive
    the earlier authorisation. Include the competing legal interpretations and the stated judgment that Iraq had materially
    breached resolution 1441; exclude the later question of how military action would be conducted.
  span_range:
  - src:7b7b9dce7fcd#p123.3
  - src:7b7b9dce7fcd#p124.3
  decision: The Attorney General concluded that military action could lawfully proceed under the revival argument without
    a further Security Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is whether to seek additional support or deploy UK troops beyond MND(SE), against the stated objective
    of drawing down forces and the concern that available resources might not suffice. Include the acceptance of US enablers
    and the restriction to existing MND(SE) personnel; exclude operational details of the operation itself.
  span_range:
  - src:7b7b9dce7fcd#p109.5
  - src:7b7b9dce7fcd#p110.3
  decision: The Chief of the Defence Staff set limits on UK force commitments and support for Operation SALAMANCA.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The decision point is how to allocate a finite UK force capacity between Iraq and Afghanistan. Include the eight-battlegroup
    constraint and the advice prioritising Afghanistan; note that the advice did not assess Basra security or the effect on
    conditions-based drawdown. Exclude tactical employment of forces.
  span_range:
  - src:7b7b9dce7fcd#p111.2
  - src:7b7b9dce7fcd#p111.5
  decision: The Defence and Overseas Policy Committee agreed to allocate two additional battlegroups to Afghanistan, reducing
    the force balance available for Iraq.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
