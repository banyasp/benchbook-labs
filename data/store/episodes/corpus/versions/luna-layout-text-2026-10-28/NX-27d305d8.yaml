episodes:
- n: 1
  focus: In 1984, with contra funding running short and the President directing that the contras be kept viable, the National
    Security Adviser pursued foreign support and passed along an account number for contributions. The passage also records
    concerns about legality, secrecy, and congressional reaction; exclude the operational details of how the funds were used.
  span_range:
  - src:da292607fe99#p1.5
  - src:da292607fe99#p1.10
  decision: The National Security Adviser decides to pursue third-country funding for the contras, including accepting a Saudi
    contribution.
  content_domain: other:foreign-aid-and-congressional-constraints
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: In 1985, after Congress requested information and documents about contra assistance, the National Security Adviser
    sent categorical denials and did not provide the requested records to Congress. The passage contrasts those responses
    with evidence available to him and describes his later explanation of how he understood the inquiries; exclude the underlying
    assistance operations.
  span_range:
  - src:da292607fe99#p1.27
  - src:da292607fe99#p1.34
  decision: The National Security Adviser decides how to answer congressional inquiries about NSC staff support for the contras
    and whether to provide responsive records.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: After initially rejecting a direct U.S. sale, the President approved an Israeli transfer and possible replenishment
    following discussions with senior officials. The passage places the proposal amid efforts to reopen ties with Iran and
    claims that arms might help secure hostage releases; exclude shipment logistics and intermediary activity.
  span_range:
  - src:da292607fe99#p1.43
  - src:da292607fe99#p1.50
  decision: The President decides whether to authorize Israel to transfer U.S.-made TOW missiles to Iran and permit Israel
    to obtain replacement weapons from the United States.
  content_domain: other:arms-transfer-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision followed a request to arrange a large HAWK sale and a warning that shipping that quantity could require
    congressional notification. The record states that the President chose the Israeli route in the expectation of hostage
    releases; exclude the later logistical steps and do not infer that using Israel resolved the legal or notification concerns.
  span_range:
  - src:da292607fe99#p1.56
  - src:da292607fe99#p1.56
  decision: The President decides whether to proceed with the proposed hostage-linked HAWK sale through Israel rather than
    directly through the United States.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: At the December 7 meeting, the principals considered whether the initiative should continue. The President favored
    continuing because he did not want to miss a chance to free the hostages, while the Secretary of Defense and others objected
    that the sale would be illegal even through Israel; exclude the subsequent meeting arrangements as separate operational
    details.
  span_range:
  - src:da292607fe99#p1.61
  - src:da292607fe99#p1.62
  decision: The President decides whether to continue the Iran arms initiative despite objections that the sale would violate
    the U.S. embargo.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The adviser stated that the President’s instructions were to discontinue the talks if this attempt produced no results,
    invoked the U.S. position on Kuwait’s judicial process, and set a deadline for hostage releases. He then ordered the party
    to pack and depart; exclude the aircraft movements and other logistics from the decision scenario.
  span_range:
  - src:da292607fe99#p1.73
  - src:da292607fe99#p1.75
  decision: The national security adviser decides whether to continue the Tehran dialogue or terminate it after the Iranian
    side fails to meet the hostage-release conditions.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: After learning that lawyers had identified a problem with the shipment, the adviser revised a chronology to refer
    to a shipment of equipment rather than HAWKs. The account says he was unwilling to accept the claim that he had not learned
    of the HAWK shipment until later and believed his wording did not state something he knew to be false; do not convert
    that account into a finding about his intent or legal liability.
  span_range:
  - src:da292607fe99#p1.78
  - src:da292607fe99#p1.80
  decision: The national security adviser decides how specifically to describe the November 1985 HAWK shipment in a chronology
    for the President’s public account.
  content_domain: other:official candor
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The report describes the choice to recommend a plea to four misdemeanors in exchange for cooperation, rather than
    pursue possible felony charges. It gives evidentiary, procedural, and tactical considerations, as well as the adviser’s
    early cooperation and personal circumstances; keep the scenario focused on the prosecution decision and its tradeoffs.
  span_range:
  - src:da292607fe99#p1.98
  - src:da292607fe99#p1.102
  decision: The Independent Counsel decides whether to accept a misdemeanor guilty plea and cooperation agreement rather than
    pursue more serious charges against the former national security adviser.
  content_domain: other:criminal prosecution
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: At the hearing, he gave limited answers about reported Saudi contributions and denied soliciting funds, while later
    explaining that he wanted to preserve a confidence and believed the contribution would be understood as welcome. The decision
    point is whether to disclose what he knew fully or give a limited answer; exclude facts about other funding arrangements
    not established in this passage.
  span_range:
  - src:da292607fe99#p1.93
  - src:da292607fe99#p1.94
  decision: The former national security adviser decides how to answer congressional questions about foreign contributions
    to the contras under oath.
  content_domain: other:congressional testimony
  refusal_sensitivity: low
