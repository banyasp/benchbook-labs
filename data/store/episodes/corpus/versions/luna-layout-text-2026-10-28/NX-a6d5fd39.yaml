- n: 1
  focus: The decision point is whether to continue confinement or process the defector into society; the report notes that
    most defectors were processed within months, while this person was confined for three years. The stated reason was doubt
    about the defector’s bona fides; keep the scenario focused on the legal and ethical basis for confinement, not conditions
    or methods of custody.
  span_range:
  - src:c499e83a9bf1#p23.7
  - src:c499e83a9bf1#p24.2
  decision: The Director of Central Intelligence approved the prolonged confinement of a defector at a CIA installation.
  content_domain: other:detention policy
