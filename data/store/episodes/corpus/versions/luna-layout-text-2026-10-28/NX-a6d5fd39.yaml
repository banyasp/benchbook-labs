  natsec: false
- n: 2
  focus: The decision followed the Inspector General’s discovery of the testing; the report says the tests were clearly illegal
    and that one person apparently died as a result. Frame this as a human-subjects ethics and legality decision, not as a
    question of how to conduct tests.
  span_range:
  - src:c499e83a9bf1#p29.3
  - src:c499e83a9bf1#p29.3
  decision: The CIA Directorate of Science and Technology decided to prohibit drug testing on people unaware they were being
    tested and end the remaining testing programs.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The report describes a choice to stop or continue a program that had produced information valuable to law-enforcement
    officials, and says the legal opinion prompted immediate termination. Keep the scenario centered on legality, authority,
    and consultation; exclude any details of how the monitoring was conducted.
  span_range:
  - src:c499e83a9bf1#p29.1
  - src:c499e83a9bf1#p29.1
  decision: The CIA Directorate of Operations decided to terminate its monitoring program after the CIA General Counsel determined
    it was illegal.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The CIA had recruited 19 agents over more than two and a half years to assist the Bureau in uncovering possible corruption;
    the report says the Director’s termination directive was correct because the CIA’s statute forbade this law-enforcement
    participation. Focus on statutory authority and the choice to end CIA involvement, not recruitment methods.
  span_range:
  - src:c499e83a9bf1#p31.3
  - src:c499e83a9bf1#p31.3
  decision: The CIA Director decided to terminate the Agency’s project recruiting agents for the Bureau of Narcotics and Dangerous
