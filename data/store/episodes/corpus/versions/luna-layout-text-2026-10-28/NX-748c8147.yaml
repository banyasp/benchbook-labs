  focus: The decision point is whether to proceed with the congressional briefing or delay it, distinguishing a request based
    only on timing or a desire to prepare a response from a demonstrable problem such as a promise of confidentiality to a
    foreign government. The passage favors proceeding in the former circumstances, allows greater latitude in the latter,
    and says to consult the congressional requestor if a substantial delay is expected; exclude operational intelligence details.
