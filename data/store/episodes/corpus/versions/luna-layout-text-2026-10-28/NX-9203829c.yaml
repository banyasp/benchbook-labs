  focus: The decision point is the Council’s choice to legislate, rather than leave the emblem’s protection to existing arrangements
    or take no legislative action. The preamble cites Ghana’s treaty obligations and the aims of giving relevant Convention
    provisions force of law and prohibiting abuse; exclude later general authorization powers, which do not describe a specific
    exercise of discretion.
  span_range:
