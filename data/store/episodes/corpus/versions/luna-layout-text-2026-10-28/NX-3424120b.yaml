episodes:
- n: 1
  focus: The decision point is whether to begin reforms through small, testable steps or spend time defending a detailed plan
    before acting. The stated reasons included urgency, avoiding delay over imperfect plans, and learning from mistakes; exclude
    the reforms’ operational implementation details.
  span_range:
  - src:cf57a72e2789#p2.3
  - src:cf57a72e2789#p2.6
  decision: The Deputy Director of National Intelligence for Analysis chose an incremental reform approach rather than waiting
    to submit a comprehensive plan to congressional and other overseers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was whether to lock in the organization chart and responsibilities early or defer them until the Deputy
    Director understood staff capabilities, ideas, and other ODNI offices’ efforts. The passage gives the rationale for deferring;
    exclude the separate decision to transfer high-level meeting materials to the National Intelligence Council.
  span_range:
  - src:cf57a72e2789#p3.3
  - src:cf57a72e2789#p3.4
  decision: The Deputy Director of National Intelligence for Analysis chose to delay fixing the new analysis office’s structure
    and divisions of responsibility while building the team and soliciting input.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to preserve restrictive dissemination practices or reduce barriers so analysts can
    identify relevant intelligence across agencies. The stated rationale was that restrictions impeded collaboration and analysts
    should determine what information they need; exclude any methods of collecting intelligence or handling specific reports.
  span_range:
  - src:cf57a72e2789#p7.6
  - src:cf57a72e2789#p8.4
  decision: ODNI analytic leadership chose to challenge agency-controlled restrictions on intelligence dissemination and pursue
    community-wide discovery and retrieval for analysts.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
