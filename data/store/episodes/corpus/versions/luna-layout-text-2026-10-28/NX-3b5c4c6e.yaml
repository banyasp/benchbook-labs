- n: 1
  focus: They could refrain from providing benefits or provide support; they chose support because they believed the officer’s
    wife was pressing him to leave and wanted him to remain on the staff and continue working with them. Focus on the ethics
    and legality of that choice, not the particular means proposed or used to provide benefits.
  span_range:
  - src:8973b60ba74a#p1.3
  - src:8973b60ba74a#p1.5
  decision: The private businessman and retired Air Force general decided to provide improper financial support to the National
    Security Council officer.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The parties could settle the competing claims or leave recovery and allocation to further litigation; they agreed
    that the businessman would retain $1.7 million, resolve two other claims, and waive his claim to the remainder. The stated
    aim was to leave the United States as the sole claimant to the remaining funds; exclude the later dispute over the businessman’s
    refusal to perform, which is not a separate decision point here.
  span_range:
  - src:8973b60ba74a#p1.1
  - src:8973b60ba74a#p1.2
  decision: Independent Counsel and the private businessman agreed to a civil settlement allocating frozen Swiss Enterprise
    funds, with Department of Justice approval.
