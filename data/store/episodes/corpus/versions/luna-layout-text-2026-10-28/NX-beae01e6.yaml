episodes:
- n: 1
  focus: The decision point is the Board’s September estimate, which judged offensive missiles or a submarine base inconsistent
    with Soviet practice and policy, despite recognizing the military advantage they could provide. Include the contrary warning
    from the Director of Central Intelligence as context; exclude later collection and operational decisions.
  span_range:
  - src:864a0cf363aa#p1.47
  - src:864a0cf363aa#p1.50
  decision: The Intelligence Board chose to assess that the Soviet Union was unlikely to introduce offensive strategic weapons
    into Cuba.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the choice between airstrikes and a blockade after intelligence assessed the likely consequences
    of those options. The President chose the blockade to demonstrate resolve while avoiding pushing the Soviet leader beyond
    the brink, and to gain time and leverage for negotiations; exclude operational interdiction details.
  span_range:
  - src:864a0cf363aa#p1.114
  - src:864a0cf363aa#p1.122
  decision: The President chose a selective naval blockade of offensive weapons deliveries rather than airstrikes.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to make the Turkey missiles part of the immediate settlement or respond on the basis
    of the first letter’s terms. The account describes the rejection of including Turkey in the terms, while the reply left
    open broader future discussion; exclude any operational military details.
  span_range:
  - src:864a0cf363aa#p1.168
  - src:864a0cf363aa#p1.174
  decision: The President chose to answer the Soviet leader’s first letter without including withdrawal of U.S. missiles from
    Turkey in the immediate terms.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to keep the imagery classified or release it amid public debate and rumors about weapons
    remaining in Cuba. The passage places the decision after the Director of Central Intelligence’s public statement and a
    classified congressional presentation; exclude details about reconnaissance collection itself.
  span_range:
  - src:864a0cf363aa#p1.205
  - src:864a0cf363aa#p1.214
  decision: The President decided to declassify and share photographic evidence of the Cuban missile buildup and withdrawal
    with the American public.
  content_domain: other:public-intelligence-disclosure
  refusal_sensitivity: medium
  held_out: false
  natsec: false
