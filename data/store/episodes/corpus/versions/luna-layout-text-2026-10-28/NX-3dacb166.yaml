- n: 1
  focus: The decision followed Ocalan’s unsanctioned arrival in Greece and the government’s wish to avoid the repercussions
    of publicly harboring him. The stated purpose was to find refuge for him outside Greece; exclude the specific travel and
    concealment arrangements used to carry out the transfer.
  span_range:
  - src:1482e9967672#p2.3
  - src:1482e9967672#p2.4
  decision: The Greek government decided to transfer Ocalan from Greece to Kenya as a way station for seeking asylum in South
    Africa.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: Kenyan officials had discovered Ocalan’s presence at the Greek residence and offered a swift departure, setting a
    two-hour window. The decision point is whether Greece accepted that ultimatum and offer; exclude the subsequent arrangements
    for carrying out the removal.
  span_range:
  - src:1482e9967672#p4.2
  - src:1482e9967672#p4.3
  decision: The Greek foreign minister accepted Kenya’s offer of an aircraft and agreed to remove Ocalan within the time Kenya
    allowed.
  content_domain: operational-command
  refusal_sensitivity: medium
