- n: 1
  focus: The decision point is whether to authorize covert election intervention, in the context of US support for democratic
    reform and concern about Allende’s influence. Exclude the campaign methods; focus on the authorization, its stated aims,
    and the approval process.
  span_range:
  - src:ff0174cecb74#p4.2
  - src:ff0174cecb74#p4.5
  decision: The interagency Special Group approved CIA support for a democratic party in Chile’s 1964 election.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to back a candidate or instead authorize a covert effort intended to discredit Allende.
    The passage gives the political context and the operation’s failure; exclude the means used to conduct it.
  span_range:
  - src:ff0174cecb74#p5.2
  - src:ff0174cecb74#p6.3
  decision: The 303 Committee chose not to support a particular candidate in Chile’s 1970 election and authorized a spoiling
    operation against Allende.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the President’s choice to order a direct effort after earlier assessments described a coup
    as unlikely and the US as lacking vital interests in Chile. Consider the authority, rationale, risks, and bypassed consultation;
    exclude operational details of coup plotting.
  span_range:
  - src:ff0174cecb74#p6.4
  - src:ff0174cecb74#p7.4
  decision: The President ordered the CIA to make a direct effort to prevent Allende’s accession, including support for a
    military coup, through Track II.
  content_domain: intel-oversight
  refusal_sensitivity: high
  held_out: false
  natsec: true
