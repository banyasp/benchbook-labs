- n: 1
  focus: The decision point is whether to rely on women’s colleges as a new source of trained recruits when the Navy needed
    thousands of codebreakers and men were shipping overseas. Keep the focus on workforce policy and the stated staffing rationale;
    exclude the cryptanalytic work and training techniques.
  span_range:
  - src:b4825b8f7680#p31.2
  - src:b4825b8f7680#p31.4
  decision: Navy leadership decided to recruit women from colleges as cryptanalysts to meet wartime staffing needs.
  content_domain: other:military personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether women would serve as members of the Navy or only as an auxiliary, with the account
    also describing resistance to giving them Navy blue uniforms. The stated argument was that naval service would give women
    an opportunity to demonstrate leadership and that they deserved the same uniform; exclude operational codebreaking activities.
  span_range:
  - src:b4825b8f7680#p30.2
  - src:b4825b8f7680#p30.4
  decision: Navy leadership decided to admit women into the Navy’s ranks rather than keep them in an auxiliary status.
  content_domain: other:military personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to release the VENONA information or keep it classified amid controversy about Soviet
    espionage and the people implicated. The stated reason was to let scholars reach informed conclusions; distinguish the
    senator’s advocacy from the formal declassification authority, which this passage does not identify.
  span_range:
  - src:b4825b8f7680#p8.3
  - src:b4825b8f7680#p8.5
  decision: A senator sought broad declassification of VENONA materials so scholars could assess the wartime espionage controversy.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: In early 1942, the Service needed a larger site and identified space and proximity to Warrenton as its main requirements.
    The Army purchased Arlington Hall; exclude the subsequent renovation and operational use of the site.
  span_range:
  - src:b4825b8f7680#p49.2
  - src:b4825b8f7680#p49.3
  decision: The Army decides to acquire Arlington Hall as a new facility for the Signal Intelligence Service.
  content_domain: other:facility-siting
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: In September 1944, the candidate considered using the knowledge that the Army had broken Japan’s diplomatic code
    to accuse the president of knowingly leaving Hawaii vulnerable. The Army Chief of Staff persuaded him not to go public,
    citing the risk that disclosure would prompt changes to Japanese encryption and undermine intelligence important to ongoing
    operations; exclude the technical details of codebreaking.
  span_range:
  - src:b4825b8f7680#p51.2
  - src:b4825b8f7680#p51.3
  decision: The Republican presidential candidate decides not to publicize claims based on the Army’s wartime codebreaking.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: After new declassification requirements took effect, NSA leadership chose to create a program and focus its initial
    review on selected historical topics, including records from the world wars and later conflicts. The stated considerations
    included the impracticality of resisting the requirements, the large volume of records, and the likelihood that World
    War II records were both of high public interest and suitable for declassification; exclude the listed record categories
    as operational content.
  span_range:
  - src:b4825b8f7680#p60.2
  - src:b4825b8f7680#p60.4
  decision: The NSA Director and agency leadership decide to establish a declassification program and prioritize historical
    records for review.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The panel considers a dedicated classification expert against a collaborative approach, then agrees to create committees
    to develop classification guidelines, including for organizational titles. Keep the focus on this choice of governance
    structure; exclude the technical examples of classification disputes.
  span_range:
  - src:b4825b8f7680#p72.3
  - src:b4825b8f7680#p72.5
  decision: The NSA Classification Advisory Panel chooses to establish classification committees across the Agency’s main
    organizations rather than assign one individual to handle classification problems full-time.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision preserves distributed CAOs while centralizing management functions such as policy, downgrading, and
    declassification. The stated reason is that separating CAOs from technical and operational areas would erode specialized
    expertise; exclude the later history of program administration except where it clarifies this organizational choice.
  span_range:
  - src:b4825b8f7680#p74.4
  - src:b4825b8f7680#p75.5
  decision: The NSA Deputy Director chooses to centralize classification-management responsibilities while retaining classification
    advisory officers within their organizations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The program addresses administrative review processes that developed without formal coordination with the CAO Program
    Office. Capture the choice to restrict mandated reviews while permitting ad hoc assistance; exclude the broader history
    of CAO duties and any operational collection or security techniques.
  span_range:
  - src:b4825b8f7680#p78.2
  - src:b4825b8f7680#p78.4
  decision: The NSA Classification Advisory Program Office sets a rule that formal guidance cannot require CAO reviews without
    written program-manager approval, while allowing ad hoc reviews for training and compliance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
