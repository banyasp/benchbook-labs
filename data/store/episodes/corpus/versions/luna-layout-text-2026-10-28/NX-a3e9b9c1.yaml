episodes:
- n: 1
  focus: The decision point is whether to preserve the OSS or wind it down as a wartime organization, and how to handle its
    remaining functions. The account cites the view that the OSS should not be superimposed on the peacetime government structure
    and describes the transfers; exclude the operational details of the activities being transferred.
  span_range:
  - src:89e7439fe464#p3.2
  - src:89e7439fe464#p5.1
  decision: The President decides to terminate the Office of Strategic Services and distribute its functions and assets between
    the State and War Departments.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is who should lead the development of a government-wide foreign-intelligence system, amid competing
    proposals for central coordination and departmental roles. The directive sought complete foreign-intelligence coverage
    and effectiveness for both individual agencies and the government as a whole; exclude later operational implementation
    details.
  span_range:
  - src:89e7439fe464#p3.3
  - src:89e7439fe464#p4.3
  decision: The President decides to direct the Secretary of State to lead development of a coordinated foreign-intelligence
    program.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to adopt the State Department’s McCormack plan or the Joint Chiefs’ framework, which
    the Secretaries had agreed upon and brought to the White House. The account describes concerns about departmental dominance
    and the advantages claimed for shared participation; the final directive also made the President’s representative part
    of the Authority. Exclude the technical conduct of intelligence operations.
  span_range:
  - src:89e7439fe464#p16.3
  - src:89e7439fe464#p18.2
  decision: The President decides to adopt the Secretaries’ Joint Chiefs-based framework for a central intelligence organization,
    with changes to meet legal and budgetary requirements.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
