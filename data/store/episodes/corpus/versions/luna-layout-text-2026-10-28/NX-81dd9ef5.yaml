episodes:
- n: 1
  focus: The decision point is whether to accept the existing estimate of 4.325 million or reopen the assessment after the
    Soviet leader announced a force level of 3.624 million and a planned reduction. The review found that several services’
    figures were poorly supported and concluded that the Soviet leader’s figure was substantially correct; exclude the subsequent
    intelligence-collection methods.
  span_range:
  - src:7bd4ed1d7924#p8.2
  - src:7bd4ed1d7924#p9.2
  decision: The Director of Central Intelligence called for a special national estimate in 1960 to reassess Soviet military
    manpower rather than rely on the existing estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to assess Soviet military buildup as preparation for conquest or primarily as deterrence
    and support for foreign policy. The estimate adopted the latter view, while Air Force Intelligence dissented; exclude
    operational plans and the separate question of how the United States should respond.
  span_range:
  - src:7bd4ed1d7924#p10.3
  - src:7bd4ed1d7924#p11.2
  decision: The national estimators issuing NIE 11-4-59 judged in February 1960 that Soviet military power was principally
    intended to deter attack and that the Soviet leadership was unlikely to initiate general war.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is how to estimate Soviet deployment when evidence about test results, production capacity, and
    leadership intentions was uncertain. The estimates leaned toward a worst-case projection, although Army and Navy estimates
    were lower; exclude the technical means used to acquire intelligence.
  span_range:
  - src:7bd4ed1d7924#p7.3
  - src:7bd4ed1d7924#p7.5
  decision: The intelligence agencies producing NIEs from late 1957 to mid-1961 adopted high projections of Soviet ICBM deployment,
    including the December 1957 estimate of 100 missiles by mid-1959 and up to 500 by mid-1961.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to permit an outside group with more skeptical views of Soviet objectives to participate
    in this way while the interagency estimate was being prepared. The passage gives the surrounding rationale—concern that
    official estimates were too complacent and criticism of détente and arms control—but does not state the DCI’s own reasons
    for approving the proposal. Exclude the panel’s substantive conclusions and later claims about their accuracy.
  span_range:
  - src:7bd4ed1d7924#p25.5
  - src:7bd4ed1d7924#p26.4
  decision: The DCI decided to authorize an outside panel to review the same data as official estimators and produce a critique
    and alternative estimate.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is how to handle a draft analytic judgment that conflicted with a recent public statement by the
    Secretary of Defense after the National Security Adviser asked the DCI to clarify it. The passage states that the review
    changed the language but not the finding. Exclude technical details about missile capabilities beyond what is needed to
    identify the disputed estimate.
  span_range:
  - src:7bd4ed1d7924#p30.5
  - src:7bd4ed1d7924#p30.5
  decision: The DCI decided to refer the SS-9 variant’s MIRV assessment for review and revise its wording, while retaining
    the underlying finding.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to retain or remove a judgment that the Soviets could not attack the United States
    without receiving unacceptable retaliation. The passage says the DCI agreed to delete the paragraph and that State Department
    intelligence later included it as a dissent; it does not provide a fuller account of the DCI’s rationale. Exclude operational
    analysis of any attack scenario.
  span_range:
  - src:7bd4ed1d7924#p30.5
  - src:7bd4ed1d7924#p30.6
  decision: The DCI decided to delete a paragraph from a draft estimate after the Secretary of Defense objected to it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to present the balance in Europe as a bilateral comparison or account for both alliances.
    Exclude the broader history of force estimates; focus on the stated concern that adding allied forces could diminish the
    perceived Soviet threat.
  span_range:
  - src:7bd4ed1d7924#p37.2
  - src:7bd4ed1d7924#p37.3
  decision: The DCI and Deputy Director of Intelligence chose to keep overall Soviet-versus-US military assessments focused
    on US-USSR comparisons rather than include NATO-Warsaw Pact comparisons.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: 'The decision point is how to assess uncertain evidence of change: retain a cautious continuity judgment or recognize
    that fundamental change was underway. Exclude later events except as context; focus on the estimators’ stated evidentiary
    standard and their judgment that convincing or compelling evidence was lacking.'
  span_range:
  - src:7bd4ed1d7924#p42.4
  - src:7bd4ed1d7924#p42.4
  decision: The estimators of NIE 11-3/8-88 chose a wait-and-see judgment rather than conclude that Gorbachev’s changes had
    already altered Soviet security concepts or nuclear-war doctrine.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
