- n: 2
  focus: The decision point is whether to retain the earlier interpretation of peaceful space use or establish a legal basis
    for national-security uses; the Diet enacted the law in 2008. Consider the stated security rationale and the preceding
    policy debate. Exclude technical details of satellite capabilities or their operational employment.
  span_range:
  - src:dcd17f6626d9#p12.2
  - src:dcd17f6626d9#p13.4
  decision: The Diet chose to enact the Space Basic Law, authorizing Japan to develop and use space-based systems for national-security
