  focus: The decision point is whether to proceed with the proposed program or leave it under study; the LDP and Cabinet moved
    forward with four satellites. Consider the stated security, disaster-assessment, and coastal-monitoring rationales and
    the political context. Exclude satellite design, collection methods, and operational use.
