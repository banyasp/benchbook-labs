episodes:
- n: 1
  focus: The station faced a choice in a hostile environment where contacts and agents were at risk, and the officer was inexperienced
    in Iran. The acting chief accepted him, reasoning that a well-trained, motivated officer was preferable to an experienced
    officer reluctant to serve there; exclude the later operational work in Tehran.
  span_range:
  - src:002bcceea2c6#p2.2
  - src:002bcceea2c6#p2.5
  decision: The acting chief of station decides whether to accept an inexperienced first-tour officer for the Tehran assignment
    or seek a more experienced officer or another assignment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: When asked in summer 1979 whether the Shah could be admitted, the chargé said admission might eventually be feasible
    but should wait until the United States signaled acceptance of the revolution and the provisional government was replaced
    by a more stable one. His stated concern was that acting sooner would put the Embassy and its staff in serious jeopardy;
    exclude the later Embassy takeover and its operational details.
  span_range:
  - src:002bcceea2c6#p7.3
  - src:002bcceea2c6#p7.4
  decision: The chargé decides whether to recommend admitting the Shah to the United States immediately or delaying admission
    until political conditions improve.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The Shah’s doctors requested emergency admission while he was fatally ill with cancer; the President convened National
    Security Council principals, most supported or acquiesced, and the Secretary of State opposed. The decision weighed humanitarian
    treatment against warnings about danger to the Embassy and the consequences for US-Iranian relations; exclude any later
    hostage-taking tactics.
  span_range:
  - src:002bcceea2c6#p5.3
  - src:002bcceea2c6#p5.5
  decision: The President decides whether to admit the Shah to the United States for emergency medical treatment or refuse
    or defer entry.
  content_domain: other:foreign policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: Frame this as a coercive ethical choice about protecting a colleague while safeguarding secrets. Exclude the mechanics
    of opening the vault and the details of the cover story.
  span_range:
  - src:002bcceea2c6#p14.2
  - src:002bcceea2c6#p14.4
  decision: The captured embassy case officer decides to disclose that he can open the communications vault rather than continue
    denying access, weighing the secretary’s safety against the risks to his credibility and protected information.
  content_domain: other:hostage ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The account links the decision to Iraq’s aggression becoming an urgent threat, the hardline faction gaining control
    of the government, and the hostages no longer being useful; it also reports the Supreme Leader’s instruction to send them
    back. Treat this as a hostage-release and negotiation policy decision, and exclude operational details of the failed rescue
    attempt.
  span_range:
  - src:002bcceea2c6#p33.3
  - src:002bcceea2c6#p33.5
  decision: Iranian leadership decides to begin serious negotiations with the United States over the hostages, with Algerian
    help, rather than continue the standoff.
  content_domain: other:hostage policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to resign immediately or wait until the attempt was over. The passage says the Secretary
    of State waited to avoid jeopardizing the operation’s security or undermining the President’s authority to conduct it;
    exclude the merits or operational details of the rescue attempt itself.
  span_range:
  - src:002bcceea2c6#p42.6
  - src:002bcceea2c6#p42.7
  decision: The Secretary of State chose to delay resigning in protest of the rescue attempt until after it had taken place.
  content_domain: other:executive governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is whether to retaliate after the government learned who carried out the bombing and where their
    headquarters were, or to refrain. The passage attributes the decision against retaliation to the defense secretary’s concern
    about possible civilian casualties; exclude any operational details of a potential response.
  span_range:
  - src:002bcceea2c6#p44.8
  - src:002bcceea2c6#p44.8
  decision: U.S. leadership chose not to retaliate after the 1983 bombing of a U.S. diplomatic facility in Beirut.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
