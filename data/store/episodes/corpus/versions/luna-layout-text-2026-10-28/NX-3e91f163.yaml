- n: 2
  focus: The review says the Agency infiltrated and reported on groups of American protesters, and that the DCI accepted responsibility
    while attributing the decision to presidential insistence. The alternative of refusing or threatening resignation is raised;
    focus on authority and legality, not on how the activity was conducted.
  span_range:
  - src:cf60cae4ee67#p9.3
  - src:cf60cae4ee67#p9.5
  decision: The DCI decided whether to comply with the President’s insistence on CIA activity concerning domestic political
    unrest despite the Agency’s charter.
