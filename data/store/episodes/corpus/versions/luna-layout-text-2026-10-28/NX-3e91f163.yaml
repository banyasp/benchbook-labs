  focus: After an independent review recommended accepting the defector, senior officers differed over whether to accept or
    retain him, and the DCI agreed to rehabilitation, resettlement, and an Agency contract. The decision concerned how to
    resolve uncertainty and what status to grant him; exclude the operational details of the preceding interrogation and confinement.
