- n: 2
  focus: The decision point is the commander’s engagement decision in the setting of heightened air-defense alert and concern
    about incursions; the article characterizes the shootdown as a serious error and says Soviet intelligence later reached
    the view that the forces probably did not know it was a civilian airliner. Keep the scenario at the level of the decision
    to engage and the competing risks, excluding weapon or interception procedures.
  span_range:
