  focus: The decision point is the Community’s analytic judgment to play down the alert and propaganda rather than treat them
    as credible indicators of Soviet fear. Focus on the stated evidentiary limits and source-protection constraints; exclude
    the article’s broader retrospective debate about the true causes of the scare.
