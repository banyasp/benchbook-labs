episodes:
- n: 1
  focus: The analysts weighed clues from the divided fuel store, its capacity, and personnel assignments against the possibility
    that the bomb arrived with its own fuel tank already full. They chose the peroxide-motor hypothesis, which proved wrong;
    exclude details of weapon design or operation.
  span_range:
  - src:7903a6c26fba#p4.3
  - src:7903a6c26fba#p5.3
  decision: Scientific-intelligence analysts tentatively judged that the flying bomb itself was powered by a hydrogen-peroxide
    rocket motor, rather than using those fuels only in its launch catapult.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The analysts had to assess photographs that suggested different functions for the dishes despite domestic radar experts’
    contrary view based on British practice and technical difficulty. The account says the German system did use the inferred
    arrangement; exclude technical details of countermeasure implementation.
  span_range:
  - src:7903a6c26fba#p6.2
  - src:7903a6c26fba#p7.1
  decision: Scientific-intelligence analysts judged that the German nightfighter radar stations used their two dishes to track
    different aircraft, rather than keeping one as a standby.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: After fragments from a trial rocket and reports about its fuels challenged the experts’ assumptions, analysts reassessed
    the threat and used the fuel evidence to evaluate the reliability of reports. The decision was which weight estimate to
    provide to the War Cabinet; exclude technical instructions about rocket construction or operation.
  span_range:
  - src:7903a6c26fba#p7.2
  - src:7903a6c26fba#p8.1
  decision: Scientific-intelligence analysts advised the War Cabinet that the German rocket weighed about 12 tons with a 1-ton
    warhead, rather than accepting domestic experts’ estimate of about 80 tons.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
