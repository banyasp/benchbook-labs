- n: 1
  focus: In a time-sensitive assessment, the team recognizes that interrogating the system’s assumptions would require shifting
    to a building posture, but defers that work to avoid delay and distraction from coordination. Keep the decision at the
    level of analytic judgment; exclude technical details of examining the system.
  span_range:
  - src:0d026bdf9d57#p3.5
  - src:0d026bdf9d57#p3.6
  decision: The assessment team chooses to integrate the automated system’s high-confidence output quickly and defer deeper
    examination of its assumptions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: After noticing that integration and presentation are crowding out opportunities to question assumptions, the leader
    introduces rotating responsibility for explaining how an assessment could fail. Focus on this analytic-process choice
    and its balance between audit and tempo; exclude operational details unrelated to that judgment.
  span_range:
  - src:0d026bdf9d57#p4.5
  - src:0d026bdf9d57#p5.3
  decision: The team leader chooses bounded friction in selected briefs rather than slowing analytic production wholesale.
  content_domain: intel-analysis
  refusal_sensitivity: medium
