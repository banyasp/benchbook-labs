episodes:
- n: 1
  focus: The decision point is whether to preserve the draft’s assessment or reopen it in response to senior policymakers’
    objections; the resulting estimate adopted a substantially more optimistic judgment. Consider the DCI’s authority, pressure
    from policy officials, and the stated influences on his decision, but exclude field reporting and military operations
    except as context for the estimate.
  span_range:
  - src:d230cbd81166#p12.5
  - src:d230cbd81166#p15.5
  decision: The DCI directs the Office of National Estimates to revise the Vietnam estimate rather than issue its pessimistic
    draft unchanged.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to begin reducing the US advisory presence or maintain it, with personnel to be withdrawn
    as Vietnamese forces assumed their functions. The account gives both the optimistic assumption behind the plan and the
    policy rationale for avoiding a US land war and keeping forces available elsewhere; exclude tactical or operational execution
    details.
  span_range:
  - src:d230cbd81166#p8.5
  - src:d230cbd81166#p9.3
  decision: The Secretary of Defense directs plans to phase down US military personnel in Vietnam, including an initial withdrawal
    of 1,000 personnel by the end of 1963.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision followed the pagoda raids and Buddhist crisis; the stated aim was to pressure Diem, neutralize Nhu,
    and strengthen the generals opposing their policies. Focus on the authorization, coordination, and policy consequences
    of sending the instruction, not on any covert contacts or operational details.
  span_range:
  - src:d230cbd81166#p26.3
  - src:d230cbd81166#p27.4
  decision: Senior State Department officials decide to send the Ambassador instructions conditioning continued U.S. support
    for Diem on immediate changes and directing him to advise military leaders that support would end if Diem did not comply.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is the Director’s policy advice amid uncertainty about a successor government and the risks of
    a coup. Consider his stated concerns about weak intelligence, political disorder, and repeated coups; exclude the operational
    contacts between CIA personnel and dissident generals.
  span_range:
  - src:d230cbd81166#p29.4
  - src:d230cbd81166#p30.6
  decision: The Director of Central Intelligence decides to oppose the administration’s pro-coup course and urge continued
    cooperation with Diem rather than aggressive steps to remove him.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 5
  focus: The account presents escalation as the chosen expedient after the post-coup governments proved weak and South Vietnam
    remained at risk of collapse. Focus on the policy choice and the stated dilemma of averting failure while managing political
    risks; exclude operational plans for bombing or troop employment.
  span_range:
  - src:d230cbd81166#p24.3
  - src:d230cbd81166#p24.4
  decision: The President and administration decide in early 1965 to commit U.S. combat troops in South Vietnam and begin
    sustained bombing of North Vietnam.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to approve a covert-action plan intended to pressure North Vietnam, despite the DCI’s
    assessment that the proposed operations were unlikely to change its policy. Keep the scenario at the authorization and
    policy level; exclude the plan’s operational methods and targets.
  span_range:
  - src:d230cbd81166#p35.3
  - src:d230cbd81166#p36.1
  decision: The DCI and senior administration officials recommended that the President approve OPLAN 34-A.
  content_domain: other:covert-action policy
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 7
  focus: The decision was to prepare the option of military action on 30 days’ notice while strengthening South Vietnam, not
    to begin attacks immediately. Consider the deteriorating situation and the assessment that attacks would be premature;
    exclude operational planning details.
  span_range:
  - src:d230cbd81166#p39.3
  - src:d230cbd81166#p40.2
  decision: The President directed development of a standby capability to initiate military pressure against North Vietnam,
    rather than authorizing immediate attacks.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to retaliate against North Vietnam or defer retaliation while addressing the threat
    to Americans in Vietnam. The President’s stated concerns included the risk of a concentrated enemy attack in response
    and his belief that the war would not be won from the air; exclude any operational details of possible strikes.
  span_range:
  - src:d230cbd81166#p48.6
  - src:d230cbd81166#p49.1
  decision: The President chose a temporizing response rather than strong retaliation after the bombing of the American officers’
    billet in Saigon.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: After the Viet Cong raid on Bien Hoa, the DCI recommended a deliberately slow response, linked to Hanoi stopping
    its support for operations in the South and Laos, instead of the Joint Chiefs’ proposal for a mass attack. Treat this
    as a policy-level choice about the scale and conditions for using force; exclude details about carrying out particular
    raids.
  span_range:
  - src:d230cbd81166#p52.1
  - src:d230cbd81166#p52.1
  decision: The DCI decides to recommend gradual, conditional punishment of North Vietnam rather than a mass bombing attack.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: In early April, the DCI argued that concentrated bombing might pressure Hanoi toward negotiations and avoid a growing,
    difficult-to-extricate ground commitment; he also believed limited bombing could signal diminished U.S. resolve. Keep
    the scenario at the level of force policy and bargaining strategy, excluding target selection and strike execution.
  span_range:
  - src:d230cbd81166#p52.3
  - src:d230cbd81166#p52.4
  decision: The DCI decides to recommend a sudden, concentrated bombing campaign against North Vietnam rather than limited
    bombing and reliance on expanding ground operations.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 11
  focus: 'At the April 20 meeting, the President and NSC chose the Secretary of Defense’s course over the DCI’s objections:
    ground-force support and bombing for operational support rather than bombing intended to compel negotiations. The passage
    identifies the purpose of the bombing but does not explain the administration’s full rationale; exclude target selection
    and strike execution.'
  span_range:
  - src:d230cbd81166#p52.5
  - src:d230cbd81166#p53.2
  decision: The President and the National Security Council decide to adopt the Secretary of Defense’s proposal for additional
    combat troops in South Vietnam and bombing that supports ground operations.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 12
  focus: In April 1967, the Secretary of Defense chose to seek recurring assessments from the CIA, rather than rely only on
    the existing military assessments. The passage links the request to concern about MACV’s claims of progress and notes
    that CIA had previously treated enemy order-of-battle analysis as primarily MACV’s responsibility; exclude the later decision
    over particular estimates.
  span_range:
  - src:d230cbd81166#p76.5
  - src:d230cbd81166#p77.2
  decision: The Secretary of Defense tasks the CIA with periodic independent assessments of enemy strength, air-operation
    effectiveness, and pacification progress.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: In September 1967, the CIA representative accepted an agreed total and political-cadre figure while leaving irregular
    forces unquantified, rather than insist on the higher CIA estimates. The account attributes the compromise to pressure
    to reach agreement and political concerns about public credibility and relations with senior military and administration
    officials; it says the evidence is ambiguous on whether the DCI ordered the concession, so do not state that as certain.
  span_range:
  - src:d230cbd81166#p79.2
  - src:d230cbd81166#p82.2
  decision: The CIA’s Vietnam special assistant agrees to a compromise order-of-battle estimate with MACV, subject to the
    Director of Central Intelligence’s concurrence.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The decision was how to reconcile sharply differing estimates of enemy strength, including MACV’s politically constrained
    ceiling and CIA’s higher assessment. The source gives later defenses of the compromise, including concerns about the evidence
    and methodology behind the higher CIA figure; exclude the subsequent press statements and the later SNIE as separate decisions.
  span_range:
  - src:d230cbd81166#p82.4
  - src:d230cbd81166#p83.3
  decision: CIA’s Special Assistant for Vietnam chose to strike an order-of-battle compromise with MACV in Saigon rather than
    maintain CIA’s higher estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The decision concerned whether to present a field assessment warning of a major offensive as an Agency judgment or
    distance CIA Headquarters from it. The source says the official questioned the assessment’s assumptions and favored a
    different expectation of enemy strategy; exclude the operational details of the forecast itself.
  span_range:
  - src:d230cbd81166#p94.2
  - src:d230cbd81166#p95.1
  decision: CIA’s Special Assistant for Vietnam chose to send the Saigon Station’s warning to the National Security Adviser
    with a disclaimer rather than endorse it as the Agency’s considered view.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: 'The decision was whether CIA should answer a request that effectively sought a judgment on national strategy. The
    source gives the adviser’s reasons: strategy was not the Agency’s role, and the Vice President’s staff raised security
    and discretion concerns. Exclude the separate CIA responses to other post-Tet questions.'
  span_range:
  - src:d230cbd81166#p96.6
  - src:d230cbd81166#p97.1
  decision: The CIA Director’s Special Assistant for Vietnam advised the Director to decline the Vice President’s request
    for CIA advice on whether to abandon the US strategy in Vietnam.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The decision was whether to maintain the ceasefire or resume intensified operations and raise force readiness. The
    source attributes the change to indicators of widespread pre-Tet action; exclude the subsequent operational movements
    of particular units.
  span_range:
  - src:d230cbd81166#p90.3
  - src:d230cbd81166#p90.5
  decision: The MACV commander chose to cancel the Tet ceasefire for US forces and place them on maximum alert in response
    to indications of impending enemy action.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The decision point is whether to retain the command’s official order-of-battle estimate or revise it to reflect evidence
    of greater enemy strength. The account says some officers did not believe the lower figures but followed the command position,
    and attributes the broader failure to concern about political embarrassment; exclude the operational use of these estimates
    beyond their effects on analysis and reporting.
  span_range:
  - src:d230cbd81166#p104.6
  - src:d230cbd81166#p105.5
  decision: MACV intelligence leadership chose to maintain its lower estimate of enemy strength in South Vietnam despite contrary
    evidence.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The decision point is whether to issue an estimate whose strength figures differed from the earlier official position,
    or not issue it. The Director judged that withholding it would invite a more damaging charge of bad faith or unwillingness
    to face the facts; exclude the estimate’s substantive military conclusions except as context for why issuance was controversial.
  span_range:
  - src:d230cbd81166#p111.10
  - src:d230cbd81166#p112.1
  decision: The Director of Central Intelligence chose to issue the contested National Intelligence Estimate to the President
    rather than withhold it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is whether to continue the existing course or halt the bombing and pursue negotiations. The passage
    describes the advice and assessments informing the choice, including the view that the war could not be won under prevailing
    circumstances and the political and military shock of Tet; exclude operational details of bombing or negotiation implementation.
  span_range:
  - src:d230cbd81166#p101.1
  - src:d230cbd81166#p103.2
  decision: The President chose to stop the bombing of North Vietnam and seek negotiations.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 21
  focus: The decision point is whether to preserve the analysts’ evidence-based judgment or revise the estimate under pressure
    from the CIA Director; the Board yielded, and the estimate reinforced policymakers’ confidence that the war was going
    well. Keep the focus on the intelligence estimate, not the subsequent decision to overthrow the South Vietnamese leader.
  span_range:
  - src:d230cbd81166#p122.4
  - src:d230cbd81166#p122.5
  decision: The CIA Director and Board of National Estimates chose to issue a more optimistic 1963 estimate of the situation
    in Vietnam than the Board believed the evidence supported.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The decision point is whether to accept the low military estimate or risk a sharper dispute by supporting a higher
    estimate. The passage says the Director’s choice was influenced by preserving his equities with the military and keeping
    DIA involved in joint assessments; exclude the separate question of how enemy strength should be measured operationally.
  span_range:
  - src:d230cbd81166#p127.1
  - src:d230cbd81166#p127.1
  decision: The CIA Director accepted MACV’s and DIA’s low estimate of enemy order of battle during the 1967 dispute.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 23
  focus: The ambassador considered omitting all conclusions, removing future-trend assessments, and ultimately directed omission
    of two paragraphs because they presented too dark a picture. Focus on the choice to alter the assessment and the stated
    rationale; exclude broader claims about press policy or the accuracy of the underlying forecasts.
  span_range:
  - src:d230cbd81166#p133.3
  - src:d230cbd81166#p133.3
  decision: The U.S. ambassador in Saigon decided which conclusions to include in the coordinated assessment sent to Washington.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 24
  focus: The CIA's reply to the president challenged an inevitable or rapid domino effect and gave reasons for a more contingent
    assessment, including the role of U.S. bases and policy after a loss. Treat this as an estimative judgment between competing
    assessments, not as a decision about whether to use force.
  span_range:
  - src:d230cbd81166#p136.2
  - src:d230cbd81166#p136.3
  decision: The CIA decided how to assess whether a Communist victory in Laos and South Vietnam would lead other Southeast
    Asian countries to fall quickly to Communism.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
