- n: 2
  focus: The decision point is whether to exploit identified Dutch policy differences or continue with the standard political
    line. The source says the head of state chose the latter and gives his view of the Netherlands as part of the imperialist
    bloc; exclude unrelated collection details and assess only this intelligence-informed policy choice.
  span_range:
  - src:c40a2be53b12#p12.3
  - src:c40a2be53b12#p12.4
  decision: The GDR head of state chose not to use the HVA’s analysis of Dutch policy differences from the United States and
