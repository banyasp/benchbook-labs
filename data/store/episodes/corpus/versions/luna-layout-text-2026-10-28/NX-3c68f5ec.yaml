  focus: The decision point is whether to tolerate the IKV’s changed position and cross-border contacts or treat them as a
    threat and use state power to suppress them. The source gives the leadership’s stated rationale and the decision to act;
    exclude the campaign’s specific influence and coercion methods.
  span_range:
  - src:c40a2be53b12#p7.2
  - src:c40a2be53b12#p8.3
  decision: The SED leadership directed the state apparatus to suppress the Dutch IKV after it expanded its peace work to
    criticize repression in Eastern Europe and build contacts with dissidents.
