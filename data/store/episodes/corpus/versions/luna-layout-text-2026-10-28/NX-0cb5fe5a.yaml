episodes:
- n: 1
  focus: The Secretary of Defense sought a centralized agency to reduce duplicative work and conflicting estimates and to
    support flexible-response planning, using authority granted by the 1958 Reorganization Act. Keep the scenario at the level
    of organizational authority and policy; exclude operational intelligence-collection methods.
  span_range:
  - src:85fce109fae1#p13.3
  - src:85fce109fae1#p13.6
  decision: The Secretary of Defense chose to pursue an integrated Defense Intelligence Agency rather than retain the Services’
    fragmented intelligence arrangements.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision balanced the Secretary of Defense’s authority over the agency against the Joint Chiefs’ concern that
    intelligence remain responsive to military needs. Focus on the reporting and advisory arrangement, not on how intelligence
    is collected or operationally used.
  span_range:
  - src:85fce109fae1#p14.1
  - src:85fce109fae1#p15.3
  decision: The Secretary of Defense and the Joint Chiefs agreed that the new agency would report to the Secretary through
    the Joint Chiefs.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The Secretary chose an officer he regarded as discreet and impartial, able to balance competing Service interests,
    despite that officer’s limited experience in foreign intelligence and reluctance to take the position. Keep the case focused
    on appointment judgment and qualifications; exclude unrelated biographical detail.
  span_range:
  - src:85fce109fae1#p16.4
  - src:85fce109fae1#p17.3
  decision: The Secretary of Defense selected the agency’s first Director from the candidates available through the Joint
    Chiefs process.
  content_domain: other:leadership-selection
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The strategic choice was whether to pursue this deployment or refrain from it; the source links the decision to perceived
    U.S. superiority and the Jupiter missiles in Turkey. Exclude the weapons’ composition, deployment details, and any operational
    employment methods.
  span_range:
  - src:85fce109fae1#p24.2
  - src:85fce109fae1#p24.3
  decision: The Soviet premier chose to seek approval for deploying nuclear missiles to Cuba as a response to the U.S. strategic
    advantage and missiles in Turkey.
  content_domain: other:strategic-deterrence-policy
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 5
  focus: The ExComm faced a choice between the blockade and direct military action; the Joint Chiefs favored an assault, while
    McNamara supported the blockade after wargaming led him to expect an attack would cause war. Keep the scenario at the
    level of national policy and the competing risks, not military planning or target details.
  span_range:
  - src:85fce109fae1#p28.5
  - src:85fce109fae1#p30.2
  decision: The ExComm chose a naval blockade, announced as a quarantine, rather than immediate direct military action against
    Cuba.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The choice was whether DIA would take the initiative to coordinate collection requirements with the quarantine force
    or defer to Service and Navy authority. The passage gives authority uncertainty, Service traditions, and the Director’s
    reluctance to confront the Navy as reasons; exclude the operational details of any collection activity.
  span_range:
  - src:85fce109fae1#p31.4
  - src:85fce109fae1#p31.5
  decision: The DIA Director refrained from asserting DIA authority to coordinate intelligence requirements for the Navy’s
    quarantine operation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The President chose a negotiated settlement rather than continuing toward possible military action; the agreement
    also included a secret understanding about later consideration of the Jupiter missiles. The stated reason for secrecy
    was to avoid the public impression of yielding to Soviet blackmail; do not infer additional motives not supplied by the
    passage.
  span_range:
  - src:85fce109fae1#p32.4
  - src:85fce109fae1#p32.4
  decision: The President accepted an agreement exchanging a U.S. pledge not to invade Cuba for removal of Soviet missiles,
    while keeping the Jupiter-missile issue for later consideration.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
