- n: 1
  focus: 'The decision point is who should lead the overflights: CIA-led missions were presented as less provocative and non-military,
    while Air Force involvement risked appearing to provoke war. Keep the focus on authorization and agency responsibility;
    exclude operational details of the flights or intelligence collection.'
  span_range:
  - src:6d9c2dc21e25#p4.2
  - src:6d9c2dc21e25#p4.4
  decision: The President decides whether the CIA, rather than the Air Force, should undertake overflights of the Soviet Union.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The choice was between assigning the program to the CIA independently of the Air Force’s larger satellite effort
    and placing it within that effort. The stated reasons were the CIA’s ability to maintain security and act quickly; exclude
    the technical mechanics of satellite reconnaissance.
  span_range:
  - src:6d9c2dc21e25#p7.2
  - src:6d9c2dc21e25#p7.4
  decision: The President decides whether the CIA, supported by the Air Force, should lead the covert CORONA satellite program.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision followed advice that technical projects should not be managed under the directorate responsible for
    clandestine operations, which the advisers considered incompatible with a science-and-technology mission. The Director
    replaced the Directorate of Research with the Directorate of Science and Technology; exclude general descriptions of the
    new organization beyond this structural choice.
  span_range:
  - src:6d9c2dc21e25#p9.3
  - src:6d9c2dc21e25#p9.4
  decision: The Director of Central Intelligence decides whether to place the CIA’s scientific and technical work in a separate
    directorate rather than under the Plans Directorate.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
