episodes:
- n: 1
  focus: The Board could have made a firm judgment that the SS-8 was large or small, but instead stated that the evidence
    did not resolve the question and gave conditional estimates for both possibilities. The passage describes a prolonged
    analytic deadlock and data too limited for more than tentative conclusions; exclude the later panel rulings and the final
    estimate.
  span_range:
  - src:d8d7a8d3bc94#p5.1
  - src:d8d7a8d3bc94#p6.2
  decision: The Board of National Estimates chose to present the SS-8’s size as unresolved in its memorandum to holders of
    the prior estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The panel assessed competing size judgments and found indications of a small second-stage engine, implying a payload
    of only four to five thousand pounds, while acknowledging that a larger vehicle might meet a Soviet requirement. Focus
    on its analytic conclusion and evidentiary basis; exclude the panel’s separate observations about the SS-7.
  span_range:
  - src:d8d7a8d3bc94#p7.1
  - src:d8d7a8d3bc94#p7.1
  decision: The outside civilian-scientist panel concluded that the SS-8 was not as large as the Air Force proposed.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The Board chose the small-missile assessment over an unresolved or large-missile estimate; the Air Force and DIA
    recorded a qualified dissent. The stated basis included the Hyland Panel’s concurrence with the earlier panel finding
    and the Army’s agreement; exclude the later confirmation from the 1964 parade.
  span_range:
  - src:d8d7a8d3bc94#p7.3
  - src:d8d7a8d3bc94#p8.1
  decision: The intelligence board approved an estimate describing the SS-8 as a small missile with payload capability about
    equal to the SS-7.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
