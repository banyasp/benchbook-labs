episodes:
- n: 1
  focus: The decision point is whether to continue seeking cooperation or prosecute despite the immunity grant and the risk
    of a classified-information challenge. The report says prosecution was viewed as key to uncovering the affair and that
    the refusal to negotiate left prosecution as the chosen course; exclude the underlying covert activities themselves.
  span_range:
  - src:e67565fc95f8#p1.4
  - src:e67565fc95f8#p1.4
  decision: Independent Counsel chooses to prosecute the NSC official after he refuses a cooperation agreement.
  content_domain: other:criminal prosecution
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to permit disclosure so the trial can proceed or withhold the information through a
    CIPA affidavit, risking dismissal of charges. The report identifies sensitive country and official identities and intelligence
    reports as the information at issue; exclude operational details of the underlying activities.
  span_range:
  - src:e67565fc95f8#p1.17
  - src:e67565fc95f8#p1.18
  decision: Intelligence-agency heads decide to withhold classified information from the trial, with the Attorney General
    prepared to seek dismissal if necessary.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to pursue an appeal that could delay trial or negotiate a narrower case to preserve
    the remaining counts. Independent Counsel chose the negotiated course because an appeal was unlikely to succeed and would
    postpone trial, while the agreement reduced the risk that additional counts would be dismissed; exclude the classified
    operational facts underlying the charges.
  span_range:
  - src:e67565fc95f8#p1.19
  - src:e67565fc95f8#p1.20
  decision: Independent Counsel chooses to seek dismissal of the conspiracy and theft counts in exchange for assurances that
    other country identities will not be withheld.
  content_domain: other:prosecution strategy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The court first left the President subject to call if the defense could support a claim of presidential authorization,
    then quashed the subpoena after finding no evidence supporting that claim and no showing that the testimony was necessary
    for a fair trial. Focus on the court’s evidentiary and fair-trial standard; exclude the separate subpoena concerning the
    President-elect.
  span_range:
  - src:e67565fc95f8#p1.51
  - src:e67565fc95f8#p1.52
  decision: The trial judge decided whether to enforce the subpoena requiring the President to testify for the defense.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The judge imposed probation, a fine, and community service rather than jail, stating that imprisonment would only
    harden the defendant’s misconceptions about public service. The judge also characterized the defendant as a subordinate
    and explained the community-service requirement; exclude later commentary about the sentence’s effects on cooperation
    or other cases.
  span_range:
  - src:e67565fc95f8#p1.54
  - src:e67565fc95f8#p1.57
  decision: The sentencing judge decided whether to impose imprisonment or a noncustodial sentence on North.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The court remanded for a witness-by-witness inquiry, reasoning that the trial court had not examined whether prosecution
    witnesses used the immunized testimony to refresh or organize their memories or shape their testimony. Focus on the use-immunity
    standard and the required inquiry; exclude operational details of the underlying Iran/contra activities.
  span_range:
  - src:e67565fc95f8#p1.58
  - src:e67565fc95f8#p1.59
  decision: The Court of Appeals decided whether to affirm North’s convictions or remand for further review of possible use
    of his immunized testimony.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: After a witness testified that his trial testimony had been colored by the defendant’s immunized testimony, the Independent
    Counsel consented to dismissal of the remaining counts. Focus on the prosecution decision in light of the remand testimony;
    exclude unrelated criticisms of the immunity grant.
  span_range:
  - src:e67565fc95f8#p1.59
  - src:e67565fc95f8#p1.60
  decision: The Independent Counsel decided whether to continue prosecuting the remaining counts or consent to their dismissal
    after the remand hearings.
  content_domain: other:criminal prosecution
  refusal_sensitivity: low
  held_out: false
  natsec: false
