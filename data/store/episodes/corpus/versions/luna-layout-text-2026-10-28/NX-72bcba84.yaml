- n: 2
  focus: The passage links these exceptional measures to killings, panic, insecurity, and a collapse in law and order. Consider
    the choice between these measures and continued ordinary state governance and policing; exclude the conduct of the operations
    themselves.
  span_range:
  - src:47e5ce82f5eb#p27.2
  - src:47e5ce82f5eb#p27.2
  decision: The Government of India imposes President’s Rule in Assam, invokes the Assam Disturbed Areas Act and the Armed
    Forces Special Powers Act, and initiates Army and paramilitary operations in November 1990.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The stated alternative was to continue the operation through the election period; the Government ended it to facilitate
    restoration of the democratic process. Focus on the decision to suspend the operation and its electoral rationale, not
    operational details.
  span_range:
  - src:47e5ce82f5eb#p28.2
  - src:47e5ce82f5eb#p28.2
  decision: The Government calls off Operation Bajrang on 20 April 1991 ahead of Assam’s state elections.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The Government had chosen a cease-fire to facilitate consultations, but ended it after concluding that ULFA was using
    the period to intensify violence and extortion. Focus on whether to continue or end the cease-fire and the reasons for
    that choice; exclude operational responses to renewed violence.
  span_range:
  - src:47e5ce82f5eb#p30.2
  - src:47e5ce82f5eb#p30.2
  decision: The Government of India ends its unilateral cease-fire with ULFA after six weeks in 2006.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision followed demands for a political settlement within India and appeals to end violence; the alternative
    was not to grant the requested statehood arrangement. Focus on the political accommodation and its stated context, not
    subsequent security operations.
  span_range:
  - src:47e5ce82f5eb#p34.2
  - src:47e5ce82f5eb#p34.4
  decision: The Government of India accepts the Naga People’s Convention’s demand for a separate state of Nagaland within
    the Indian Union.
  content_domain: other:constitutional policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to continue the suspension or resume the government’s response and prohibit the organizations.
    The source says talks had failed, the underground organizations were not complying with the agreement, and there had been
    an attempt on the Chief Minister’s life; it identifies the Unlawful Activities (Prevention) Act as the authority for the
    bans. Exclude the groups’ preceding internal violence as separate decision points.
  span_range:
  - src:47e5ce82f5eb#p40.3
  - src:47e5ce82f5eb#p41.2
  decision: The Government of India called off the suspension of operations and declared the underground organizations unlawful.
  content_domain: other:insurgency legal policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is whether to pursue an armed struggle or a negotiated settlement within the Constitution, and
    the reciprocal terms accepted by the parties. The source says the TNV leadership judged independence impossible and a
    peaceful settlement preferable, and describes the surrender commitment and government undertakings. Exclude the earlier
    attack details and the later formation of other groups.
  span_range:
  - src:47e5ce82f5eb#p60.4
  - src:47e5ce82f5eb#p61.2
  decision: The Government of India and the TNV representatives entered into a 1988 settlement providing for cadre surrender
    and government measures addressing tribal concerns.
  content_domain: other:peace agreement
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The decision point is whether to retain the cease-fire’s extension into Naga-inhabited areas outside Nagaland or
    restrict it to Nagaland. The source describes public fears that the extension could dismember Manipur, a fierce agitation,
    deaths during police firing, and the government’s subsequent reversal. Do not treat the police firing as a separate engagement
    decision.
  span_range:
  - src:47e5ce82f5eb#p49.3
  - src:47e5ce82f5eb#p50.3
  decision: The Government of India limited the Naga cease-fire to Nagaland’s boundaries after protests over its extension
    to neighboring states.
  content_domain: other:cease-fire policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is the committee’s policy recommendation on whether to retain or repeal the Act amid civil-society
    demands for repeal. The committee’s stated reason was its conclusion that the law had become a symbol of oppression and
    an instrument of discrimination and high-handedness. This is the committee’s recommendation, not a claim that the government
    ultimately repealed the Act.
  span_range:
  - src:47e5ce82f5eb#p55.2
  - src:47e5ce82f5eb#p55.2
  decision: The government-appointed committee recommended repealing the Armed Forces (Special Powers) Act rather than retaining
    it unchanged or giving it a human face.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is the government’s choice to proceed with border fencing rather than leave the border unfenced,
    in response to concerns about illegal migration and its effects on security, social harmony, and economic well-being.
    Keep the focus on the border-management policy and its stated rationale; exclude operational details of patrols or construction.
  span_range:
  - src:47e5ce82f5eb#p75.4
  - src:47e5ce82f5eb#p75.4
  decision: The Government of India decided to fence much of the Bangladesh border to stem migration.
  content_domain: other:border-management policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
