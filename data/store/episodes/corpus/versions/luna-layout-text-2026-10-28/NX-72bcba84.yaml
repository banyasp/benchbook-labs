- n: 1
  focus: The decision followed violence that the Assam Police and Assam Rifles could no longer control; the alternative was
    to leave responsibility with the existing forces. Focus on the authority and rationale for assigning the Army this role,
    and exclude the conduct or techniques of counterinsurgency operations.
  span_range:
  - src:47e5ce82f5eb#p34.2
  - src:47e5ce82f5eb#p34.2
  decision: The Government of India transfers law-and-order responsibility in the Naga Hills to the Army in April 1956.
  content_domain: use-of-force-policy
