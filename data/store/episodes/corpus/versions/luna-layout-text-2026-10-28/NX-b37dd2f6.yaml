episodes:
- n: 1
  focus: The group weighs proceeding with third-country solicitations against waiting for legal guidance after the Secretary
    of State warns that an approach could be an impeachable offense. The Attorney General’s view is that such discussions
    are permissible if the countries use their own funds and are not reimbursed by the United States; exclude the separate
    Saudi funding already arranged before the meeting.
  span_range:
  - src:4390d48d22ad#p1.4
  - src:4390d48d22ad#p1.5
  decision: The National Security Planning Group decides to pause approaches to foreign governments for contra funding until
    the Attorney General provides a legal opinion.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The group considers whether to continue concentrating contra forces and U.S. efforts in the north or encourage opposition
    in the south to enter Nicaragua. The stated reasons are to relieve pressure on northern forces, which were vulnerable
    to attack and tested Honduras’s tolerance, and to escalate pressure on the Sandinista regime; exclude the operational
    details of implementing the plan.
  span_range:
  - src:4390d48d22ad#p1.11
  - src:4390d48d22ad#p1.12
  decision: The Restricted Interagency Group decides to open a southern front in the Nicaraguan conflict.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: After a records search turns up memoranda that could support congressional allegations of NSC involvement in contra
    activities, the national security adviser chooses concealment and false responses rather than disclosure. The context
    indicates the choice protects the staff’s activities and an aide; exclude the underlying assistance operations except
    as the subject of the congressional questions.
  span_range:
  - src:4390d48d22ad#p1.16
  - src:4390d48d22ad#p1.17
  decision: The national security adviser decides not to disclose documents to Congress and instead to give Congress false
    answers about NSC staff activities.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The President faces opposition from senior advisers and questions about whether the United States should sell weapons
    directly, permit Israeli sales, or replenish Israel afterward. The report links the initiative to possible hostage releases
    and improved relations with Iran, including concern about Soviet influence; it notes that the President’s approval is
    established through the national security adviser’s account and that Congress was not notified.
  span_range:
  - src:4390d48d22ad#p1.35
  - src:4390d48d22ad#p1.40
  decision: The President decides to authorize Israeli arms sales to Iran and replenish Israel’s weapons, as part of an effort
    tied to improving relations and securing hostages’ release.
  content_domain: other:arms-transfer-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to continue the Israeli proposal or stop it after advisers raised legal and policy
    objections. Include the stated prospect of hostage recovery and the view that the immediate downside was limited; exclude
    the shipment logistics and the mistaken signing of the draft Finding the day before.
  span_range:
  - src:4390d48d22ad#p1.58
  - src:4390d48d22ad#p1.59
  decision: The President chooses to proceed with the proposed Iran arms initiative despite senior advisers’ objections.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to notify Congress or halt the sales, versus proceeding under a different legal theory
    without prior notice. Include the stated reporting constraints, Iran’s status as a terrorism sponsor, and the officials’
    asserted statutory authority; exclude the transfer mechanics and logistics.
  span_range:
  - src:4390d48d22ad#p1.59
  - src:4390d48d22ad#p1.60
  decision: The National Security Adviser and senior officials choose to pursue direct arms sales without prior congressional
    notice after identifying notice barriers to the Israeli resale plan.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to produce and preserve the Finding or destroy it after the Attorney General’s staff
    sought relevant NSC documents. The account gives the stated reason—fear of political embarrassment—and describes the ethical
    and oversight stakes; exclude other document-destruction details.
  span_range:
  - src:4390d48d22ad#p1.77
  - src:4390d48d22ad#p1.77
  decision: The National Security Adviser chooses to destroy the signed retrospective Finding rather than preserve it for
    the Attorney General’s inquiry.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
