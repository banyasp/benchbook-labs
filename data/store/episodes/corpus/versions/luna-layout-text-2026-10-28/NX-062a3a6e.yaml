- n: 1
  focus: The decision point is whether to preserve the existing schedule of meetings or sharply reduce it. Focus on the commander’s
    stated concerns about unsustainable meeting demands, estimates updated only once daily, unused briefing slides, and time
    needed to lead outside the command post; exclude details about how to conduct operations.
  span_range:
  - src:53b7616d66d8#p9.3
  - src:53b7616d66d8#p9.3
  decision: The brigade commander reorganizes the battle rhythm, retaining only the commander’s update brief, operations synchronization,
    and targeting board.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to wait for the higher order or begin preparing for it in advance. The order was expected
    that afternoon, and the brigade was already in a close fight while needing to secure defensible terrain; exclude operational
    methods or tactical details.
  span_range:
  - src:53b7616d66d8#p14.4
  - src:53b7616d66d8#p14.4
  decision: The brigade commander directs the staff to begin planning before the anticipated higher-headquarters order arrives.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The vignette contrasts this directive schedule and delegation with a broad timeline that produced incomplete analysis
    and poor synchronization. Focus on the executive officer’s staff-planning choice and the stated benefits; exclude the
    substantive conduct of targeting or information collection.
  span_range:
  - src:53b7616d66d8#p31.2
  - src:53b7616d66d8#p31.3
  decision: The executive officer in Vignette 2 chooses a structured mission-analysis schedule and delegates attendance at
    the targeting working group to an assistant or NCO.
