episodes:
- n: 1
  focus: The board weighed recommending an empowered DNI against leaving the DCI without those authorities; it said it would
    withdraw the DNI recommendation if the President judged such authority inadvisable. Focus on the board’s policy recommendation
    and its stated aims of improving management, resource allocation, and innovation, not on later implementation.
  span_range:
  - src:7af1cafac9a3#p11.2
  - src:7af1cafac9a3#p11.5
  decision: The President’s Intelligence Advisory Board decided to recommend a Director of National Intelligence with substantial
    authority over national intelligence agencies and resources.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The board considered organizational placement for a new center amid the need to integrate counterterrorism intelligence
    across agencies. Focus on its choice of administrative home and the stated rationale of administrative expediency and
    organizational independence; exclude operational collection or counterterrorism methods.
  span_range:
  - src:7af1cafac9a3#p10.2
  - src:7af1cafac9a3#p11.5
  decision: The President’s Intelligence Advisory Board decided to recommend housing the proposed National Counterterrorism
    Center within the CIA as a separate entity rather than in the Department of Homeland Security.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The commissioners approved a proposal for a small White House office with substantial budget authority, intended
    to oversee intelligence across foreign and domestic domains. Focus on the Commission’s institutional and authority choices
    and their stated rationale; exclude operational planning details about the NCTC.
  span_range:
  - src:7af1cafac9a3#p15.2
  - src:7af1cafac9a3#p15.4
  decision: The 9/11 Commission chose to recommend a powerful, White House-based DNI rather than place the role within an
    existing intelligence or defense agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision was between a more radical transfer of collection agencies and a less disruptive DNI arrangement; the
    passage says wartime disruption, amid the Iraq crisis, weighed against the transfer. Keep the focus on organizational
    authority and policy, not on collection methods.
  span_range:
  - src:7af1cafac9a3#p16.4
  - src:7af1cafac9a3#p16.4
  decision: The President and senior White House principals rejected removing national collection agencies from DoD and placing
    them under the DNI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The choice was whether to accept the Commission’s recommendation to disclose the budget’s top line or keep it classified.
    The passage attributes the rejection to concern that disclosure would expose U.S. intelligence programs, while arguing
    that this rationale was a weak sound bite; do not infer additional reasons.
  span_range:
  - src:7af1cafac9a3#p17.2
  - src:7af1cafac9a3#p17.2
  decision: The President rejected declassifying the top line of the National Intelligence Program budget.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
