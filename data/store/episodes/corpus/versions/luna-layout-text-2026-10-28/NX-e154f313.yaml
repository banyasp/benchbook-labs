episodes:
- n: 1
  focus: The Army favored analysis and estimates, while the Navy opposed prediction; the Navy’s position prevailed because
    its agreement was indispensable to creating the joint committee. Focus on that choice of institutional remit, not on later
    operational events.
  span_range:
  - src:44b77084d26e#p3.2
  - src:44b77084d26e#p3.3
  decision: The Army and Navy planning chiefs set the US Joint Intelligence Committee’s role as presenting facts without making
    estimates.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The choice responded to a headless committee where unanimity could produce vague or meaningless estimates; the proposed
    alternative retained departmental contributions while assigning final text decisions to an independent chair. Treat this
    as a decision about estimate governance, not a general description of the later system.
  span_range:
  - src:44b77084d26e#p5.4
  - src:44b77084d26e#p6.1
  decision: In autumn 1944, the Joint Intelligence Staff chose to recommend an independent, presidentially appointed chair
    with authority to settle estimate wording and record agency dissents.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The CIG had been producing estimates largely from its own research and seeking agency concurrence on a take-it-or-leave-it
    basis; the Director chose a cooperative process based on agency contributions, consultation, and final IAC consideration.
    Focus on the institutional decision and its rationale, not on intelligence collection or operational methods.
  span_range:
  - src:44b77084d26e#p7.4
  - src:44b77084d26e#p8.1
  decision: In 1950, the Director of Central Intelligence established the Office of National Estimates and restored cooperative
    interagency consideration of national estimates.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
