episodes:
- n: 1
  focus: The decision point is the DCI’s choice to proceed without an immediate revision, while maintaining State, Defense,
    and JCS advice as guidance rather than orders to OPC. Focus on the authority and institutional balance; exclude the operational
    conduct of covert activities.
  span_range:
  - src:3d2ee40e22f9#p9.5
  - src:3d2ee40e22f9#p9.8
  decision: The DCI decides whether to seek an immediate revision of NSC 10/2 or treat the existing guidance arrangement as
    sufficient while bringing OPC fully under his authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The estimate concludes that full-scale intervention is possible but not probable absent a Soviet decision for global
    war, and expects continued covert assistance instead. Treat this as an estimative judgment under uncertainty; exclude
    any operational details of military or covert activity.
  span_range:
  - src:3d2ee40e22f9#p10.5
  - src:3d2ee40e22f9#p15.4
  decision: The interagency estimators decide whether to assess full-scale Chinese Communist intervention in Korea as probable
    in 1950.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The estimate concludes that the Soviet Union is unlikely to intervene directly unless its leaders decide, on broader
    grounds, to precipitate global war. Focus on how the analysts weigh the potential strategic and prestige losses against
    the risk of war; exclude operational military details.
  span_range:
  - src:3d2ee40e22f9#p16.4
  - src:3d2ee40e22f9#p18.5
  decision: The interagency estimators decide whether to assess direct Soviet military intervention in Korea as likely in
    1950.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The estimate judges an open invasion improbable in 1950, while expecting increased military assistance to the Viet
    Minh. Focus on the assessment of intent and the reasons for the probability judgment; exclude operational details of military
    activity or assistance.
  span_range:
  - src:3d2ee40e22f9#p22.6
  - src:3d2ee40e22f9#p25.4
  decision: The interagency estimators decide whether to assess an open Chinese Communist invasion of Indochina as probable
    in 1950.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The passage recommends deferring use of the troops until the prospects for an acceptable political settlement have
    passed, weighing military utility against escalation risks, effects on negotiations, and consequences for UN and Asian
    support. Exclude operational details of troop employment; the decision is whether and when to commit the force.
  span_range:
  - src:3d2ee40e22f9#p41.5
  - src:3d2ee40e22f9#p42.3
  decision: U.S./UN policymakers decide whether to use Chinese Nationalist troops in Korea during cease-fire negotiations
    or defer that decision.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: On October 23, 1951, the Council chose to expand and intensify covert activity, with the Director of Central Intelligence
    responsible for conduct under existing policy and the Psychological Strategy Board reviewing programs, priorities, timing,
    and support. The stated aims were to strain Soviet power, strengthen resistance to Soviet domination, and develop resistance
    capabilities, while accounting for the risk of war; exclude operational methods and individual projects.
  span_range:
  - src:3d2ee40e22f9#p97.6
  - src:3d2ee40e22f9#p98.8
  decision: The National Security Council approved the immediate expansion of the covert organization and intensified covert
    operations as a national responsibility.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The memo weighs leaving the dispute unresolved in public against ending the debate, and recommends the latter to
    avoid CIA involvement in domestic political issues and protect the committee’s work. Treat this as a recommendation under
    consideration, not as proof that the proposed course was adopted; exclude operational details unrelated to the policy
    and ethics question.
  span_range:
  - src:3d2ee40e22f9#p112.7
  - src:3d2ee40e22f9#p112.9
  decision: The Deputy Director for Plans recommends that CIA leadership end the American Committee for Cultural Freedom controversy
    by removing the debate from the record and communicating a neutral position.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The directive chooses unified field command and administration while preserving the long-range espionage and counterespionage
    mission from short-term variations in other clandestine activities. The stated authority is delegated responsibility under
    NSCID-5 and NSC 10/2 and 10/5; exclude the listed operational missions and techniques.
  span_range:
  - src:3d2ee40e22f9#p122.7
  - src:3d2ee40e22f9#p122.10
  decision: The Director of Central Intelligence establishes a single overseas clandestine service with one chain of command,
    rather than separate worldwide commands.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: At the staff conference, the Director responds to recent difficulties by choosing a limited number of activities
    until the Agency can build a reserve of well-trained personnel. The stated concerns include poor performance, security
    practices, and preserving the Agency’s primary intelligence mission; exclude operational methods.
  span_range:
  - src:3d2ee40e22f9#p127.3
  - src:3d2ee40e22f9#p127.4
  decision: The Director of Central Intelligence limits CIA activity to operations it can perform well with available personnel,
    rather than pursuing broader coverage with inadequately trained staff.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
