- n: 2
  focus: The decision point is whether to preserve open dissemination of fundamental research or impose restrictions, and
    under what circumstances. The preceding NAS panel concluded that broad controls could weaken security by hampering scientific
    advancement; exclude operational research methods.
  span_range:
  - src:7dbf7e971d60#p3.3
  - src:7dbf7e971d60#p4.4
  decision: The President issued NSDD 189, affirming that federally funded fundamental research should remain unrestricted
    to the maximum extent possible, with classification used when national security requires control.
  content_domain: other:research-security-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
