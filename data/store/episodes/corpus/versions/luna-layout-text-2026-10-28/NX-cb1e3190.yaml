- n: 2
  focus: The decision point is whether to establish a statutory authorization and review framework for domestic electronic
    surveillance, rather than leave the matter to existing practice or impose broader operational restrictions. Focus on the
    special court, application standards, and the balance between oversight and intelligence needs; exclude surveillance techniques.
  span_range:
  - src:415a925f4876#p16.4
  - src:415a925f4876#p16.6
  decision: Congress enacts FISA to require judicial review and standards for qualifying domestic electronic surveillance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the analytic judgment about the scale of deliveries, against MACV’s higher estimate and incomplete,
    unevenly reliable reporting. Focus on the estimate and the stated limits of the available sources; exclude any operational
    use of the intelligence.
  span_range:
  - src:415a925f4876#p20.3
  - src:415a925f4876#p20.5
  decision: CIA analysts assess that munitions delivered through Sihanoukville were likely substantially less than MACV estimated.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to adopt the estimate despite its divergence from MACV’s higher figures and the acknowledged
    limitations of the evidence. Focus on the assessment standard and the authenticated Cambodian records cited as grounds
    for treating the estimate as the best available; exclude the logistics routes and shipment-handling details.
  span_range:
  - src:415a925f4876#p26.5
  - src:415a925f4876#p26.6
  decision: CIA leadership accepted OER’s 1970 tonnage estimate as the best supportable baseline for reporting on deliveries
    through Cambodia.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to impose personnel consequences, as senior administration officials sought, or retain
    and support the analysts after the intelligence failure. Focus on accountability and the stated value of their forthright
    reassessment as reliable data emerged; exclude any intelligence-collection techniques.
  span_range:
  - src:415a925f4876#p28.6
  - src:415a925f4876#p28.8
  decision: The Director of Central Intelligence chose not to punish or purge the analysts responsible for the Sihanoukville
    assessment, instead backing and praising them for revisiting it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The choice was to retain the draft’s severe criticisms of South Vietnam or soften them; the article says policymaker
    protests pressured ONE to revise the Estimate, whose first sentence then said the situation was improving. The stated
    reason for the change is that pressure, not a newly described evidentiary reassessment; exclude the underlying military
    and political policy decisions.
  span_range:
  - src:415a925f4876#p41.3
  - src:415a925f4876#p41.5
  decision: ONE decides to revise the draft NIE 53-63 on South Vietnam in a more optimistic direction.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: When the White House requested its view of the domino thesis in mid-1964, ONE rejected the prediction of rapid regional
    domino effects. The article points to independent national movements, limits on outside Communist direction, and Sino-Soviet
    competition; exclude subsequent choices about military intervention or force.
  span_range:
  - src:415a925f4876#p40.3
  - src:415a925f4876#p40.8
  decision: ONE decides that the loss of South Vietnam and Laos would not cause the rapid, successive communization of the
    other Far Eastern states.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision followed a task force’s finding that PMI-based training did not teach staff how to apply project-management
    principles in the DS&T mission environment. Focus on the choice of training approach and its stated rationale; exclude
    the article’s general project-management model and operational examples.
  span_range:
