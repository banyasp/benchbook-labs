  natsec: false
- n: 2
  focus: In September 1945, the Budget Bureau proposed ending the OSS and allocating its branches between two departments;
    the President agreed and signed the order. Consider the choice between continuing the OSS and dissolving it through this
    transfer, including the stated postwar drawdown context; do not infer legal conclusions about the order’s timing or authority
    beyond the passage.
  span_range:
  - src:10d9276670b0#p8.5
  - src:10d9276670b0#p9.3
  decision: The Budget Director and President chose to dissolve the OSS and transfer its functions between the State and War
    Departments.
