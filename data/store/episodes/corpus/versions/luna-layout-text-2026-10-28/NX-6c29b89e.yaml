  focus: The OSS director had been urged to release information, and agreed to speak publicly amid what he regarded as misleading
    negative coverage. The stated reason was to counter that coverage; exclude the underlying covert operations and assess
    only the decision to disclose information publicly.
  span_range:
  - src:10d9276670b0#p8.3
  - src:10d9276670b0#p8.4
  decision: The OSS director chose to publicize selected OSS accomplishments and explain the agency’s future to news reporters.
