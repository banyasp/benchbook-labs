- n: 1
  focus: After the president declined to establish a commission and the committee heard that the intelligence director opposed
    the proposal, the chair directed the committee’s general counsel to draft legislation for the annual authorization bill.
    The choice contrasted relying on a presidentially appointed commission with creating one through legislation and involving
    Congress in appointments; the stated motivation included concern that the Ames case was fueling anti-intelligence sentiment
    and a perception that the administration was uncooperative. Exclude the later dispute over which particular individuals
    should be appointed.
  span_range:
