- n: 2
  focus: The Prime Minister is asked whether to amend the Act and says its provisions are adequate; the exchange also gives
    the stated basis that the publication did not prejudice current security and any breach was inadvertent, while the Act’s
    requirements were widely understood and observed. Focus on whether to amend the law, not on the separate decision whether
    to prosecute.
  span_range:
  - src:006db6b06643#p5.3
  - src:006db6b06643#p5.4
  decision: The Prime Minister declines to consider strengthening the Official Secrets Act in response to the book’s publication.
