  focus: The Attorney General faces a request to authorize prosecution over the book’s publication and answers no, citing
    a lack of evidence that an offense was committed. Keep this to the prosecution decision; the Prime Minister’s later position
    on amending the Act is a separate decision point.
  span_range:
