- n: 1
  focus: The decision point is the minister’s choice to protect Americans and U.S. property by relocating the community and
    seeking support, rather than leaving people in Seoul without those precautions. Keep the focus on the protective policy
    response and its stated reason; exclude the details of the unrest as a standalone decision.
  span_range:
  - src:d3f48ca44d80#p6.2
  - src:d3f48ca44d80#p6.3
  decision: The U.S. minister in Seoul ordered Americans to leave Seoul for Chemul’po and sought naval, Marine, and Korean
    assistance during the coup-related unrest.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to clarify the report and defuse the resulting threat, or allow the mistaken account
    and escalating suspicions to stand. Keep the focus on diplomatic crisis management; exclude any operational or intelligence-collection
    details.
  span_range:
  - src:d3f48ca44d80#p10.2
  - src:d3f48ca44d80#p10.4
  decision: The U.S. chargé d’affaires in Seoul chose to correct the mistranslation and reassure the British, Korean, and
    Chinese representatives to ease the crisis.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is the Department’s choice between recalling the attaché and preserving his valuable diplomatic
    and informational role in Korea. The Department cited concern about causing a diplomatic incident and the attaché’s three
    years of service; include the minister’s stated reasons for opposing recall as relevant competing interests.
  span_range:
  - src:d3f48ca44d80#p12.5
  - src:d3f48ca44d80#p13.1
  decision: The Department of State directed the Navy to recall the naval attaché from Korea rather than retain him there
    despite the U.S. minister’s objections.
  content_domain: other:diplomatic-personnel-policy
  refusal_sensitivity: medium
  held_out: false
