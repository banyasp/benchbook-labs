episodes:
- n: 1
  focus: The decision point is whether to bring DEA’s national-security intelligence function into the IC or keep DEA outside
    it as a small, focused drug-law-enforcement agency. The account cites the drug–terror nexus and IRTPA’s joint-designation
    authority as reasons and mechanism; exclude the author’s personal career history and any operational investigative details.
  span_range:
  - src:0406637f68bb#p9.6
  - src:0406637f68bb#p10.5
  decision: The DNI and attorney general jointly designated DEA’s Office of National Security Intelligence as part of the
    Intelligence Community.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to impose common statutory analytic requirements or leave standards to existing agency
    practices. The article connects the requirements to failures in pre-9/11 and Iraq WMD assessments, including weak evidence,
    assumptions, and insufficiently clear analytic judgments; exclude any general discussion of intelligence methods beyond
    those policy standards.
  span_range:
  - src:0406637f68bb#p10.5
  - src:0406637f68bb#p11.5
  decision: Congress required statutory standards for intelligence analysis, including analysis of alternatives and analytic-integrity
    safeguards.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
