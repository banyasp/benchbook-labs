episodes:
- n: 1
  focus: The decision point is whether to replace a dispersed, department-centered approach to executive intelligence coordination
    with a presidentially supervised central authority, while preserving departmental operations. Include the proposal’s stated
    limits and reasons—policy-level coordination, reduced duplication and waste, and support for informed decisions; exclude
    intelligence collection methods.
  span_range:
  - src:59c3b3e824e8#p8.3
  - src:59c3b3e824e8#p10.6
  decision: The OSS Director recommends that the President establish a permanent central intelligence authority reporting
    directly to the President while leaving operational intelligence functions in the existing departments.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to obtain broad interagency input before proceeding with the proposed service or to
    proceed without that consultation. The letter gives the reason that numerous departments and agencies have a direct interest;
    exclude any operational intelligence activity.
  span_range:
  - src:59c3b3e824e8#p10.10
  - src:59c3b3e824e8#p11.2
  decision: The President directs the OSS Director to solicit views from the chiefs of foreign-intelligence and internal-security
    units and other interested agencies on the proposed central intelligence service.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
