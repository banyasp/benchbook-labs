episodes:
- n: 1
  focus: The decision point is whether to continue sharing decrypted messages with ONI or withhold them; the source says the
    CNO chose to withhold them in retaliation after ONI returned the secret fund to the Treasury. Focus on the intelligence-sharing
    policy, not the fund’s possible uses.
  span_range:
  - src:faba4d898b97#p11.4
  - src:faba4d898b97#p11.5
  decision: The CNO ordered that ONI no longer receive decrypted messages from 1931 to 1933.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is how to divide responsibility: the services considered a division based on technical hearability,
    while the Navy also urged relinquishing the diplomatic target; the approved arrangement assigned the Navy odd days and
    the Army even days. Focus on interservice responsibility for deciphering and translation, and exclude the operational
    details of intercept sites or collection.'
  span_range:
  - src:faba4d898b97#p21.4
  - src:faba4d898b97#p22.1
  decision: The Navy and Army approved an alternating-day division of responsibility for deciphering and translating Japanese
    diplomatic and consular messages.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: After the new keying system was understood, policymakers chose current-cipher work over continued emphasis on older
    traffic. The stated reason was the hope of reading current messages by January 1941; focus on analytic priorities, not
    cryptanalytic techniques.
  span_range:
  - src:faba4d898b97#p24.5
  - src:faba4d898b97#p25.2
  decision: Washington policymakers directed all units, including Hawaii, to work on the current JN-25 cipher.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: 'The decision point is the cancellation of WPL13 on 11 June 1941, against the alternative of continuing Pacific-first
    planning. The surrounding discussion gives the strategic context: Germany-first priorities, support for Britain, and the
    limits of operating in both theaters; exclude operational details of any campaign.'
  span_range:
  - src:faba4d898b97#p32.4
  - src:faba4d898b97#p33.5
  decision: The Chief of Naval Operations canceled War Plan Orange as U.S. planning shifted away from a Pacific-first strategy.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The President regarded relocation as a necessary countermeasure to growing Japanese bellicosity, while the fleet
    commander objected that Pearl Harbor exposed the fleet and that an offensive west of Hawaii could not be supported. The
    decision point is whether to relocate the fleet; exclude tactical or operational details beyond that choice.
  span_range:
  - src:faba4d898b97#p38.2
  - src:faba4d898b97#p38.4
  decision: The President supported moving the U.S. fleet’s headquarters from San Pedro to Pearl Harbor.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to keep the surface fleet deployed south or return it to Manila to join the defense
    of the Philippines. The source says the commander sensed a change in U.S. policy and proposed joining the defense; exclude
    later deployments and operational details.
  span_range:
  - src:faba4d898b97#p47.2
  - src:faba4d898b97#p47.2
  decision: The Commander in Chief, Asiatic Fleet, decided on 27 October 1941 to bring the fleet back to Manila without first
    obtaining Washington’s approval.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to impose a movement restriction after a report that troop-concentration information
    had leaked to a foreigner. The stated reason was to preserve security; exclude any covert-communications or collection
    technique.
  span_range:
  - src:faba4d898b97#p59.2
  - src:faba4d898b97#p59.2
  decision: The Hainan Guard District decided to prohibit people from entering or leaving Hainan beginning 24 November 1941.
  content_domain: other:wartime security policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: 'The decision point is the ambassador’s choice of a diplomatic course and his stated reasons: avoiding responsibility
    for the rupture and addressing the secrecy surrounding Japan’s intentions. The source records a recommendation to Tokyo,
    not whether Tokyo adopted it; exclude operational planning or execution.'
  span_range:
  - src:faba4d898b97#p66.2
  - src:faba4d898b97#p66.2
  decision: The Japanese ambassador in Washington recommends a formal break in diplomatic relations rather than proceeding
    to operations without prior announcement.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is whether to warn Pacific commands in light of intelligence indicating Japanese forces may be
    preparing to move and an aggressive move may occur within days. The passage states the warning and its assessed threat;
    it does not detail the decision process or alternatives. Exclude the operational measures recipients might take in response.
  span_range:
  - src:faba4d898b97#p73.3
  - src:faba4d898b97#p74.3
  decision: OPNAV issues a Pacific-wide war warning on 27 November 1941, alerting commands to a possible imminent Japanese
    move.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
