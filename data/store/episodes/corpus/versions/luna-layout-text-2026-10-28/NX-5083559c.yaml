- n: 1
  focus: 'The estimate attributes this policy choice to the Soviet leadership and gives its reasons: the war impaired the
    regime’s domestic and foreign agenda, and Moscow was pessimistic about creating a viable client regime. The analysts describe
    signing an agreement, withdrawing without one, or delaying as alternatives; treat the account as an intelligence assessment
    of Soviet decisionmaking, not a record of US policy. Exclude operational details of the withdrawal.'
  span_range:
  - src:5bb748ad1bc1#p6.3
  - src:5bb748ad1bc1#p6.4
  decision: The Soviet leadership chose to withdraw its forces from Afghanistan, preferring withdrawal under the Geneva accords
    but proceeding even if the talks deadlocked.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: 'The estimate describes unilateral reductions as already announced and explains their assessed purpose: demonstrate
    resolve, put pressure on the West, encourage negotiations, and save resources, while Moscow still preferred negotiated
    reductions that preserved rough parity. This is an intelligence assessment of Soviet policy; exclude technical details
    of force structure or weapons.'
  span_range:
  - src:5bb748ad1bc1#p28.3
  - src:5bb748ad1bc1#p28.5
  decision: The Soviet leadership chose to make unilateral force reductions part of its arms-control policy rather than leave
    reductions entirely contingent on negotiated agreements.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is the leadership’s choice to reduce or store tactical nuclear warheads, including proposals whose
    implementation would eliminate or constrain several service-level capabilities. The assessment cites nuclear security
    and the value of presenting the Soviet leader as a credible negotiating partner; it also says improved conventional forces
    made reductions appear less costly to military capability. Exclude implementation details and subsequent negotiating positions.
  span_range:
