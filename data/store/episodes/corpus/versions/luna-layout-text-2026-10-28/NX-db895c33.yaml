- n: 1
  focus: The decision weighs congressional and public accountability for intelligence spending against the risk that disclosure
    of the budget total could harm intelligence capabilities. Keep the focus on the choice of public versus closed disclosure
    and its stated rationale; exclude operational intelligence details.
  span_range:
  - src:6f88e529d2aa#p8.6
  - src:6f88e529d2aa#p9.2
  decision: The Director of Central Intelligence declined to testify publicly about the intelligence budget and instead provided
    details in executive session.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was a compromise between maintaining the access cutoff and allowing committee access subject to executive
    authority over public release. The stated aim was to avoid a court test; exclude details about the classified material
    itself.
  span_range:
  - src:6f88e529d2aa#p12.2
  - src:6f88e529d2aa#p12.4
  decision: The President agreed to restore the Pike Committee’s access to classified materials in exchange for making the
    President the final judge of future disputes over public release.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The House chose conditional withholding over immediate committee publication, amid claims that release could endanger
    national security and concern that many members had not read the report. Keep the focus on the institutional authority
    and competing interests in public release; exclude the report’s operational contents.
  span_range:
  - src:6f88e529d2aa#p15.5
  - src:6f88e529d2aa#p16.3
  decision: The House directed the Pike Committee not to release its report until the President certified that it would not
    adversely affect CIA intelligence activities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
