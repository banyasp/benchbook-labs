- n: 2
  focus: The decision point is whether to limit distribution of sensitive reporting while the suspected missile installation
    is being assessed; the President chose tight controls on publication and designated recipients. Keep the scenario on dissemination
    authority and the balance between secrecy and timely access by officials with a need to know; exclude methods of intelligence
    collection.
  span_range:
