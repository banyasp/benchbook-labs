  focus: The decision point is whether to approve aerial reconnaissance despite the risks of overflying denied territory;
    the source reports that the President authorized recommended flights and the Special Group approved them, with a modification
    after the Secretary of State raised concerns about international waters and the U.S. position if an aircraft were lost.
    Keep the scenario to authorization, authority, and risk-balancing; exclude flight routes, scheduling, and other collection
    details.
