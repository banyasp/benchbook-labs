- n: 3
  focus: The September 19 estimate judged such deployment unlikely, while acknowledging that the contingency warranted careful
    examination. The review says estimators gave substantial weight to Soviet practice and policy and insufficient weight
    to warning indicators; keep the scenario on analytic judgment and uncertainty, not collection methods.
