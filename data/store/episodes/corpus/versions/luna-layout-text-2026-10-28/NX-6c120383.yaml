  focus: The decision point is whether the Department of Justice would retain responsibility for investigating and considering
    prosecution, as it generally did for other agencies, or defer those functions to the CIA because of national-security
    secrecy concerns. Exclude operational details; the issue is the allocation of law-enforcement authority and the balance
    between prosecution and protecting sensitive information.
