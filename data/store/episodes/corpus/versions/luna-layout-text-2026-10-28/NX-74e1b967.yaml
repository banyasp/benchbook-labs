- n: 2
  focus: The decision point is how the committee revised its earlier estimate in light of developments within the Soviet orbit,
    in Europe, and in the United States. Include the distinction between deliberate action and conflict through miscalculation,
    and the Navy’s disagreement over the evidentiary basis; exclude operational or covert measures discussed in the text.
  span_range:
  - src:94d3306bad9f#p8.4
  - src:94d3306bad9f#p11.3
  decision: The joint ad hoc intelligence committee decided that events in the first half of 1948 had slightly increased the
    possibility of Soviet military action, but had not made deliberate action probable.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the committee’s assessment of whether adverse strategic developments outweighed the deterrents
    to preventive war. Include its analysis of Soviet capabilities, perceived threats, political alternatives, and the risk
    of miscalculation; exclude the operational details of any hypothetical intervention or conflict.
  span_range:
  - src:94d3306bad9f#p12.4
  - src:94d3306bad9f#p15.7
  decision: The joint ad hoc intelligence committee decided that deliberate Soviet military action against the West during
