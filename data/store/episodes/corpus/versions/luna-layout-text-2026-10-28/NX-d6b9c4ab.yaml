episodes:
- n: 1
  focus: Assess the flight lead’s choice between ending the sortie and adapting it after weather prevented the planned air-to-air
    training. The report cites workable airspace and altitude separation for the two pairs; exclude the details of attack
    and threat-reaction maneuvers.
  span_range:
  - src:6242db2cc3e0#p11.7
  - src:6242db2cc3e0#p11.8
  decision: The flight lead decided to change the flight’s plan from returning to base to splitting the formation into two
    pairs for unopposed training attacks.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The weather left no workable airspace for the primary mission, so the pilot simplified the plan and split the formation
    into two flights; the instructor pilot agreed that the backup attacks would provide the best available training. Treat
    this as a mission-planning decision, and exclude the tactical details of carrying out the simulated attacks.
  span_range:
  - src:6242db2cc3e0#p46.7
  - src:6242db2cc3e0#p47.1
  decision: The mishap pilot, acting as flight lead, decided to abandon the primary mission plan and reorganize the formation
    to fly backup training missions.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The report describes the pilot's ejection while disoriented and evaluates whether he perceived recovery as possible,
    including the aircraft's condition and the safety briefing he had previously given. Frame this as the high-level emergency
    choice between ejecting and continuing recovery; exclude aircraft-control and ejection procedures.
  span_range:
  - src:6242db2cc3e0#p42.3
  - src:6242db2cc3e0#p49.1
  decision: The mishap pilot decided to eject rather than continue attempting to recover the aircraft.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The report describes the pilot’s impaired visual scan, weather, aircraft attitude and speed, and resulting misjudgment
    of the imminent need to eject; the chosen course was ejection. Treat this as an emergency safety decision, and exclude
    the technical details of the ejection sequence and injuries.
  span_range:
  - src:6242db2cc3e0#p49.2
  - src:6242db2cc3e0#p50.2
  decision: The mishap pilot decides whether to continue trying to recover the aircraft or eject while spatially disoriented.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
