episodes:
- n: 1
  focus: The decision point is whether to follow announced policy and statutory reporting requirements or proceed secretly,
    weighing the hostages’ safety against legal and congressional oversight concerns. Keep the focus on presidential authority,
    the legal conflict, and the stated hostage-related rationale; exclude details of how the transfers were carried out.
  span_range:
  - src:4c97c29d4138#p1.31
  - src:4c97c29d4138#p1.36
  decision: The President chose to proceed with the 1985 Iran arms transfers and to withhold notice to Congress.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to suspend support or pursue outside funding, with Boland restrictions and the risk
    of an impermissible quid pro quo as constraints. The report describes Attorney General advice permitting solicitation
    without a quid pro quo and the President’s support for continued contra assistance; exclude the separate, unauthorized
    diversion of Iran-sale proceeds.
  span_range:
  - src:4c97c29d4138#p1.8
  - src:4c97c29d4138#p1.17
  decision: The President and national security officials chose to seek third-country support for the contras during the congressional
    aid cutoff.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to give an accurate account or allow a false account that denied prior knowledge and
    authorization. The report places this amid efforts to contain public and congressional fallout; exclude the operational
    details of the arms initiative.
  span_range:
  - src:4c97c29d4138#p1.3
  - src:4c97c29d4138#p1.4
  decision: After the Iran initiative became public, the President permitted a false account of the arms sales to be disseminated.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to proceed with arms transfers as part of an initiative intended to free hostages and
    improve relations with Iran, despite advisers’ legal and policy objections. Include the stated rationale and the authority
    concerns; exclude the operational details of the transfers.
  span_range:
  - src:4c97c29d4138#p1.80
  - src:4c97c29d4138#p1.83
  decision: The President decides to authorize direct U.S. arms sales to Iran under the January 17 Finding after the indirect
    Israeli plan fails.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is how much to disclose amid public criticism and concern that statements could endanger hostages
    or disrupt ongoing contacts. Include the competing arguments about credibility, hostages, and the contacts; exclude the
    press statement’s factual claims except as evidence of the chosen approach.
  span_range:
  - src:4c97c29d4138#p1.51
  - src:4c97c29d4138#p1.54
  decision: The President and senior advisers decide to release a limited public statement about the Iran initiative rather
    than disclose more or maintain no comment.
  content_domain: other:government disclosure policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to initiate a fact-finding inquiry after the Secretary of State reports discrepancies
    in accounts of arms shipments and before congressional testimony. Include the need for an accurate account and the possible
    legal problem; exclude the inquiry’s subsequent operational handling.
  span_range:
  - src:4c97c29d4138#p1.64
  - src:4c97c29d4138#p1.66
  decision: The President directs the Attorney General to conduct a weekend inquiry into the Iran initiative and report the
    findings.
  content_domain: other:executive accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
