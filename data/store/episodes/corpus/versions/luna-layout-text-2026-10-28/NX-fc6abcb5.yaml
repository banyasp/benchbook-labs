episodes:
- n: 1
  focus: The memorandum compares Soviet courses of action and judges that the more cautious course of prolonging US involvement
    is likely at least in the short run. The stated considerations include the risks of global war, Soviet political gains,
    and damage to US prestige. Exclude the operational means described for prolonging or widening the conflict.
  span_range:
  - src:7d51c92c8253#p25.7
  - src:7d51c92c8253#p27.4
  decision: CIA analysts assess that the Kremlin will initially prolong the Korean conflict without openly committing Soviet
    forces, rather than localize the fighting or immediately widen it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the analysts’ estimate of Soviet intentions, based on the USSR’s apparent reluctance to use
    its own troops despite potential advantages and Iran’s alignment and confidence in US support. Treat the invasion-versus-pressure
    alternatives as context for the analytic judgment; exclude the passage’s descriptions of possible invasion pretexts and
    methods.
  span_range:
  - src:7d51c92c8253#p38.5
  - src:7d51c92c8253#p40.3
  decision: CIA analysts assessed whether Soviet leaders would openly attack Iran or continue pressure without open military
    action, and judged an attack unlikely absent a change in Soviet policy.
  content_domain: intel-analysis
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the analysts’ estimate of the Soviet choice among relying on North Korean forces, committing
    Chinese or Soviet troops, or seeking a diplomatic settlement. The assessment favors nonintervention because intervention
    risked general war and undermined the USSR’s effort to distance itself from the conflict; exclude operational details
    of military activity.
  span_range:
  - src:7d51c92c8253#p55.4
  - src:7d51c92c8253#p57.5
  decision: CIA analysts assessed whether the USSR would intervene militarily in Korea after the Inchon landing or refrain
    from intervention, and judged nonintervention the most likely course.
  content_domain: intel-analysis
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the estimate of Chinese leadership’s choice about overt military intervention, in light of
    the risk of general war and political costs to China and the USSR. The passage also considers indirect assistance, but
    the scenario should focus on the policy-level choice and its assessed likelihood, not methods of providing assistance.
  span_range:
  - src:7d51c92c8253#p53.4
  - src:7d51c92c8253#p54.5
  decision: CIA analysts assessed whether Chinese Communist leaders would openly commit forces in Korea or limit support to
    indirect assistance, and judged direct intervention unlikely.
  content_domain: intel-analysis
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The assessment weighs the risks and incentives for open intervention and concludes that, absent a Soviet decision
    for global war, it is not probable and assistance will probably remain covert. Treat this as an intelligence-estimative
    judgment, not a Chinese policy decision; exclude operational details of assistance.
  span_range:
  - src:7d51c92c8253#p66.6
  - src:7d51c92c8253#p67.4
  decision: CIA analysts decide whether to assess full-scale Chinese Communist intervention in Korea as probable in 1950 or
    expect assistance to remain covert.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: On 30 October, the analysts judge direct intervention unlikely while identifying a possible limited move to protect
    the Suiho plant and other border installations, or an attempt to mislead and slow UN forces. Keep the focus on evaluating
    competing interpretations of the reports, not on troop movements as operational advice.
  span_range:
  - src:7d51c92c8253#p74.5
  - src:7d51c92c8253#p74.5
  decision: CIA analysts decide whether to assess reported Chinese troops in Korea as evidence of direct intervention or as
    a limited border-protection measure.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The 3 November assessment favors a limited ‘cordon sanitaire’ interpretation while acknowledging that full-scale
    intervention cannot be excluded. It grounds that judgment in reported Chinese forces and possible Soviet air support,
    as well as the strategic importance of the border and Suiho system; exclude operational implementation details.
  span_range:
  - src:7d51c92c8253#p78.5
  - src:7d51c92c8253#p78.6
  decision: CIA analysts decide whether to assess China’s increased support in Korea as preparation for full-scale intervention
    or as a limited effort to secure the Manchurian border and Suiho power supply.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
