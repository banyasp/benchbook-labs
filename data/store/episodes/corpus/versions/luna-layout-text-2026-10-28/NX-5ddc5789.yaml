- n: 1
  focus: The decision point is whether to provide security support for recruiters, or leave them to conduct visits without
    it, given harassment, danger, and the Agency’s responsibility for its own personnel and operations. Focus on the protective-policy
    choice; exclude the operational details of monitoring, communications, or campus response.
  span_range:
  - src:887c0d023425#p1.2
  - src:887c0d023425#p2.1
  decision: In February 1967, the CIA Deputy Director for Support directed the Office of Security to provide protective assistance
    to Agency recruiters facing hostile campus conditions.
  content_domain: other:protective-security
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether the CIA should investigate further or refer the matter to the FBI and end its use of
    the asset. The stated concern was that further investigation could involve the Agency in forbidden domestic activity;
    exclude details of how the information was obtained.
  span_range:
  - src:887c0d023425#p4.2
  - src:887c0d023425#p4.2
  decision: After an asset found that an infiltrated organization received foreign financial support, the Director of Central
    Intelligence arranged to transfer the information and the asset to the FBI rather than continue the CIA’s involvement.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue the CIA project or end it once local police had developed a capability
    to collect information on dissident groups. The source says the two developments were related; exclude the project’s collection
    methods.
  span_range:
  - src:887c0d023425#p4.2
  - src:887c0d023425#p4.3
  decision: By late 1968, the Office of Security phased out its Washington-area dissident project after the Metropolitan Police
    Department developed its own collection capability.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to continue or discontinue the reports and broader project as the activity they covered
    declined. Focus on the stated reason and termination decision; exclude details of the information-gathering process.
  span_range:
  - src:887c0d023425#p7.3
  - src:887c0d023425#p7.3
  decision: The Office of Security discontinued its dissident-activity reporting in late 1972 and the broader project in June
    1973 as dissident activity tapered off.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
