episodes:
- n: 1
  focus: The trucker says he will keep the emblem, citing its protective value when crossing a front line and his humanitarian
    deliveries; he also claims the ICRC authorized its use. Focus on his choice and its legal and ethical basis, not on operational
    details of crossing a front line.
  span_range:
  - src:27c60314d79a#p1.1
  - src:27c60314d79a#p1.2
  decision: The aid trucker decides whether to keep using the red cross emblem on his aid lorry or remove it after the British
    Red Cross’s warning; he chooses to keep it.
  content_domain: other:humanitarian-law emblem regulation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The letter gives the trucker a deadline to arrange removal and threatens further action otherwise. The stated concern
    is unauthorized use and the need to control who uses the emblem; exclude the discussion prompt’s hypothetical question
    about whether to seek punishment despite the trucker’s safety concerns.
  span_range:
  - src:27c60314d79a#p1.2
  - src:27c60314d79a#p1.2
  decision: The British Red Cross’s international-law leadership decides whether to demand removal of the emblem and pursue
    further action or tolerate its use; it demands removal and warns of further action.
  content_domain: other:humanitarian-law emblem regulation
  refusal_sensitivity: low
  held_out: false
  natsec: false
