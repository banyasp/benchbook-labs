episodes:
- n: 1
  focus: The decision point is the administration’s choice of a civilian air proprietary as a means of assisting the French
    while avoiding a direct US military commitment. Exclude the flight arrangements and execution of the airlift.
  span_range:
  - src:8f7990763e05#p4.3
  - src:8f7990763e05#p4.4
  decision: The Eisenhower administration chose to use CAT pilots and US-supplied aircraft to airlift supplies for French
    forces in Laos rather than commit US military personnel.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to support a local armed force as an alternative to direct US military intervention,
    amid the crisis in Laos and concern about Soviet involvement. Exclude the details of training, weapons delivery, and subsequent
    operations.
  span_range:
  - src:8f7990763e05#p12.1
  - src:8f7990763e05#p14.1
  decision: The Eisenhower administration authorized the CIA’s proposal to arm and train a Hmong force rather than introduce
    US troops into the conflict in Laos.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to maintain the halt on arms shipments under the Geneva settlement or resume them after
    reports that North Vietnamese forces remained in Laos and were attacking positions. The passage also identifies a defensive-use
    limitation; exclude the logistics of the clandestine flights.
  span_range:
  - src:8f7990763e05#p17.4
  - src:8f7990763e05#p17.4
  decision: The assistant secretary of state authorized resuming Air America arms shipments to the Hmong, with instructions
    that the supplies be used only for defense.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
