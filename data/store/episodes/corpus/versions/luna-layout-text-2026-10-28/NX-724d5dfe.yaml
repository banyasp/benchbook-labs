  focus: The decision point is the IC’s adoption of formal analytic standards after the WMD estimate was fundamentally wrong,
    including regular review for compliance. The article contrasts codification with the prior guild-like, on-the-job model
    and gives reasons including greater rigor, clearer treatment of evidence, and accountability; exclude later implementation
    disputes as separate decisions.
