episodes:
- n: 1
  focus: The Navy had relied on Hebern machines but doubted their integrity and balked at a further procurement contract,
    then sought other options. Keep this at the level of procurement and security judgment; exclude the technical details
    of cipher-machine design.
  span_range:
  - src:4d985705e22d#p18.2
  - src:4d985705e22d#p18.3
  decision: Navy cryptologic leadership decided not to procure more Hebern machines and to seek a more secure alternative.
  content_domain: other:cryptographic procurement policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The Army’s R&D budget was depleted, making SIGABA fielding unaffordable; it used a small available sum for retrofits
    instead. Treat this as a resource-allocation decision and exclude the mechanics of the retrofit.
  span_range:
  - src:4d985705e22d#p17.2
  - src:4d985705e22d#p17.3
  decision: Army leadership decided to use its limited remaining funds to retrofit existing M-134 machines rather than field
    SIGABA.
  content_domain: other:cryptographic procurement policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: As the Battle for France unfolded, Navy officials concluded that further delay was unwarranted and prepared production
    contracts. The decision point is the timing of procurement and fielding; exclude machine operation and design details.
  span_range:
  - src:4d985705e22d#p22.2
  - src:4d985705e22d#p22.3
  decision: Navy leadership decided that the time had come to field SIGABA and proceed with full-scale production.
  content_domain: other:cryptographic procurement policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to retain SIGABAs in exposed locations or substitute a less powerful machine that,
    if compromised, would not reveal SIGABA’s principles. Focus on the security tradeoff and the reason for the substitution;
    exclude the machines’ technical operation.
  span_range:
  - src:4d985705e22d#p32.2
  - src:4d985705e22d#p32.3
  decision: Army and Navy cryptographers decided to remove SIGABAs from locations where they might be compromised and replace
    them with SIGRODs.
  content_domain: other:cryptographic-security-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to relax wartime safeguards after hostilities or maintain stringent protection for
    the machines. Focus on the security rationale and mandated protection; exclude guard procedures or other operational details.
  span_range:
  - src:4d985705e22d#p32.2
  - src:4d985705e22d#p32.5
  decision: The sister services decided to require round-the-clock armed guards and secure storage for SIGABAs after the war.
  content_domain: other:cryptographic-security-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to replace the rotors across the inventory or accept the risk posed by the suspected
    compromise. The passage says the replacement was ordered despite later assessments that the effort was unwarranted, because
    the commander would not imperil operations or troops’ lives; exclude rotor configuration details.
  span_range:
  - src:4d985705e22d#p36.2
  - src:4d985705e22d#p36.2
  decision: The senior commander decided to field a new rotor set for each SIGABA after a suspected physical compromise.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
