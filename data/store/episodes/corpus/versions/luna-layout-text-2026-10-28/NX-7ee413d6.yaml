  focus: Treat this as a specific forecast about the likelihood and status of a split, grounded in the estimate’s assessment
    that fundamental differences remained unresolved. Exclude the later policy choices about exploiting the split and the
    operational details of intelligence collection.
  span_range:
  - src:ab47c9cf6ec2#p1.4
  - src:ab47c9cf6ec2#p1.6
  decision: The authors of NIE 11-5-62 assessed in February 1962 that Sino-Soviet relations were near, but had not reached,
    a definitive split, with the chance of avoiding one no better than even.
  content_domain: intel-analysis
  refusal_sensitivity: medium
