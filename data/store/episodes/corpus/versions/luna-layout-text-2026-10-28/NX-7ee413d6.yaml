  focus: The staff recommended an estimate, but some Board members resisted, and the interagency process watered down the
    draft judgments. The source attributes the skeptics’ position to their interest in maintaining the world Communist threat
    framing and to their view that Sino-Soviet discord was a fraud; exclude unrelated historical and bibliographic material.
