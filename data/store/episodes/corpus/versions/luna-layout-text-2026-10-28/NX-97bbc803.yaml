episodes:
- n: 1
  focus: The decision point is how to process current Soviet scientific literature when the number of journals was small but
    procurement was erratic. The stated alternative was not to translate every article; exclude later changes to the program.
  span_range:
  - src:6ed349cc30e8#p2.6
  - src:6ed349cc30e8#p2.6
  decision: CIA components chose to abstract all articles and translate in full only selected articles beginning in August
    1947.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to provide a screening service or leave agencies to handle the expanding literature
    through their own abstract files. The source gives the resource constraint and the digest’s intended coverage; exclude
    the separate Air Force abstracting program.
  span_range:
  - src:6ed349cc30e8#p3.2
  - src:6ed349cc30e8#p3.4
  decision: In April 1956, CIA chose to issue a screened digest as a common service for agencies unable to manage large volumes
    of abstract cards.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to translate the entire available body of literature or maintain a prioritized screening
    system. The stated reasons include the scale and cost of full translation, limited linguist availability, and the difficulty
    of analyzing an indiscriminate mass; exclude the separate investigation into correlating scattered missile-related information.
  span_range:
  - src:6ed349cc30e8#p6.2
  - src:6ed349cc30e8#p6.3
  decision: The intelligence community chose selective alerting and screening rather than translating every Soviet scientific
    publication.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
