- n: 2
  focus: The article treats the close match between estimates from production data and national-income figures as support
    for this accounting interpretation, and notes that budget residuals could accommodate sums of this size. The decision
    point is the analyst’s inferential judgment about how military production was accounted for; exclude the underlying arithmetic
    as a separate decision.
  span_range:
  - src:f240033520a2#p6.3
  - src:f240033520a2#p7.1
  decision: The CIA analyst concluded that Soviet military capital-equipment production was recorded as an increment to defense
    reserves and charged to the budget as accumulation rather than current expenditure.
