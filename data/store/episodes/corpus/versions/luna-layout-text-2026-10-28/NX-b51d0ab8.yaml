  focus: The analyst favored this hypothesis over treating the reported repair category as continuing to cover repair work
    generally, resolving a mismatch between the published aggregate and other repair and machine-building data. The stated
    support was the distribution of repair labor and the post-1957 enterprise-based statistical rule, though the article acknowledges
    there is no direct evidence of the change.
  span_range:
