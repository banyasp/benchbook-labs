episodes:
- n: 1
  focus: The review followed concern that the DCI had not known about matters connected to Watergate; the stated aim was to
    identify questionable activities and correct them. Keep the scenario focused on the decision to review and document compliance,
    not on any surveillance or other collection described elsewhere.
  span_range:
  - src:996b7d6d1688#p20.3
  - src:996b7d6d1688#p20.4
  decision: The incoming DCI and his successor chose to order an internal review of activities that might have exceeded the
    Agency’s charter.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The DCI and his predecessor agreed that the relevant congressional committees should be informed, and the DCI briefed
    committee members. The decision point is disclosure to Congress rather than keeping the review internal; exclude the operational
    details of any activities under review.
  span_range:
  - src:996b7d6d1688#p20.6
  - src:996b7d6d1688#p21.3
  decision: The DCI chose to brief congressional intelligence overseers about the internal review and its findings.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: A committee member suggested release as a way to achieve catharsis; the DCI rejected it, predicting that public release
    would be sensationalized and disastrous. Keep the scenario to the choice between public release and withholding the material;
    do not turn it into a decision about the underlying collection activities.
  span_range:
  - src:996b7d6d1688#p21.3
  - src:996b7d6d1688#p21.3
  decision: The DCI declined a congressional overseer’s suggestion to release the review publicly.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to stonewall the committees or provide a broad account of the Agency’s activities while
    protecting identities. Focus on the Director’s stated balance between congressional oversight, giving investigators context,
    and protecting personnel; exclude operational details about agents.
  span_range:
  - src:996b7d6d1688#p23.6
  - src:996b7d6d1688#p24.5
  decision: The Director of Central Intelligence chose to cooperate with the congressional investigations while withholding
    the names of intelligence personnel.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to allow the planned disclosure or seek judicial protection for the officer’s identity.
    The stated reason was concern that disclosure could expose the officer to violent retribution; exclude details about the
    officer’s work or identity.
  span_range:
  - src:996b7d6d1688#p24.5
  - src:996b7d6d1688#p24.6
  decision: The Director of Central Intelligence chose to seek a court injunction to prevent a congressional committee from
    disclosing an intelligence officer’s name.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to continue or terminate the mail-opening activity after the Director’s review. He
    cited conflict with postal law and lack of results; exclude how the mail was examined or what information the activity
    sought.
  span_range:
  - src:996b7d6d1688#p26.3
  - src:996b7d6d1688#p27.3
  decision: The Director of Central Intelligence recommended ending the Agency’s mail-opening program and the program was
    later stopped.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to continue the existing leadership and arrangements or make a direct change after
    concerns about the division’s work and fragmented handling of intelligence. The Director says he ultimately installed
    a new chief, staff, and systems; exclude operational methods or details of individual cases.
  span_range:
  - src:996b7d6d1688#p27.3
  - src:996b7d6d1688#p28.2
  decision: The Director of Central Intelligence chose to replace the counterintelligence chief and staff and reorganize responsibility
    for counterintelligence.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is the September 1962 estimate’s choice between the defensive-buildup judgment and the possibility
    of strategic weapons in Cuba. The article gives the estimate’s conclusion and reasons, including historical precedent
    and the expectation that an offensive base would provoke a US response; exclude later general advice about analytic methods.
  span_range:
  - src:996b7d6d1688#p37.5
  - src:996b7d6d1688#p38.5
  decision: The CIA Board of National Estimates and SNIE drafters judged that the Soviets were unlikely to introduce strategic
    weapons into Cuba.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
