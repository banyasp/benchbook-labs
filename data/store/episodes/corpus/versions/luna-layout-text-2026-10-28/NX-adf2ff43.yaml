  focus: The team favored using the tribal unit in Fallujah, but the command chose to preserve its work with the Albu-Nimr
    in the Corridor. The stated reasons were that teams were already operating around Fallujah and the Corridor effort mattered
    more to the broader campaign; exclude details of how the unit supported operations.
