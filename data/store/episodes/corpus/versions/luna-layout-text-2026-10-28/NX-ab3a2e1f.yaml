title: T-6A AIB Report, Randolph AFB (Sept 2018)
collection: usaf-aib
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The decision point is the crew’s response to confirmed abnormal fuel-flow indications while approaching Randolph.
    Focus on the safety choice and the stated reason; exclude the subsequent aircraft-configuration details and technical
    flying actions.
  span_range:
  - src:e26e7d3cbcd8#p12.6
  - src:e26e7d3cbcd8#p12.7
  decision: The mishap instructor pilot, acting for the crew, chose to make a full-stop landing at Randolph rather than continue
    traffic-pattern training.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to eject or continue attempting to reach a safe landing after the engine failure. The
    report establishes the loss of usable thrust and that the aircraft was below the energy profile needed to glide to a suitable
    landing surface; exclude the mechanics or procedure of ejection.
  span_range:
  - src:e26e7d3cbcd8#p12.10
  - src:e26e7d3cbcd8#p13.8
  decision: The mishap instructor pilot decided to eject after the engine failed and usable thrust was lost.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The supervisor approved a sortie with an ORM score of 6, the minimum score requiring Operations Supervisor approval.
    The assessment included an automatically assigned risk point for ongoing OBOGS issues, plus points for the instructor
    pilot’s nine-day flying absence and the thermal heat index; exclude the pilots’ separate flight-response decisions.
  span_range:
  - src:e26e7d3cbcd8#p29.5
  - src:e26e7d3cbcd8#p29.6
  decision: The Operations Supervisor decided whether to approve the sortie after the crew’s ORM assessment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The instructor pilot chose a full-stop landing, truncating the planned training, after the student pilot reported
    unusually high fuel-flow readings that changed to dashes; the instructor pilot acknowledged and observed the indications.
    The report says these readings alone did not indicate impending engine failure, so do not recast the choice as a decision
    to climb or as a response to a known imminent failure.
  span_range:
  - src:e26e7d3cbcd8#p30.5
  - src:e26e7d3cbcd8#p33.6
  decision: The instructor pilot decided to end further training and make the approach a full-stop landing after observing
    abnormal fuel-flow indications.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
