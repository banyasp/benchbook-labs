  focus: 'This is a recovery-destination decision: the crew declared an intention to proceed to KAF, while Bagram, Kabul,
    and FOB Shank were nearer options that the report says were reachable for some period. The report attributes the choice
    to the crew’s confidence in restarting an engine and a squadron preference for returning to KAF; exclude the engine-restart
    procedures and other cockpit actions.'
  span_range:
