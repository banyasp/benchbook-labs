episodes:
- n: 1
  focus: The decision point is whether to evacuate the technicians or continue operating the site despite the estimate that
    it could fall by 10 March. The passage says authority remained at Embassy level and gives the belief that the site could
    still be defended and that personnel could be evacuated; exclude the later, specific evacuation orders.
  span_range:
  - src:fb9f6e2a14ca#p6.2
  - src:fb9f6e2a14ca#p6.4
  decision: The Ambassador and 7th Air Force retained the Phou Phathi site in operation in late February despite warnings
    that it was likely to fall.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision concerns who could authorize strikes in the area and the scope of that authority, as enemy forces encircled
    the site. The stated rationale was that the Embassy and Air Force believed bombing could deter or dissuade the enemy;
    exclude the operational details of directing or conducting individual strikes.
  span_range:
  - src:fb9f6e2a14ca#p6.2
  - src:fb9f6e2a14ca#p6.2
  decision: On 21 February, the Ambassador authorized the Local Area Defense Commander to use the radar to direct strikes
    within 12 kilometers of the summit.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The decision point is whether to evacuate immediately or wait until morning, with the deputy Air Force commander
    advocating evacuation only as a last resort. The account says officials still viewed the danger as manageable and the
    ridgeline as secure; exclude the later rescue actions and their tactical details.
  span_range:
  - src:fb9f6e2a14ca#p7.5
  - src:fb9f6e2a14ca#p8.3
  decision: On the night of 10 March, the Ambassador deferred evacuation until the following morning and initially ordered
    the evacuation of only nine technicians.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision concerns whether to use airstrikes to deny the enemy the captured equipment and operational information.
    The source states the purpose and reports the ensuing strikes; exclude details about how the attacks were executed.
  span_range:
  - src:fb9f6e2a14ca#p9.3
  - src:fb9f6e2a14ca#p9.4
  decision: After Site 85 was captured, the Air Force decided to strike the summit to destroy the radar and prevent its exploitation
    by the North Vietnamese.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
