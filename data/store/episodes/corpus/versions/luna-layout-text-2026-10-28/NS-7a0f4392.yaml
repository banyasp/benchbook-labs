- n: 2
  focus: He tactfully raises his concerns with the commanding officer. The case weighs the risk to his rapport and career
    against equal treatment, the command climate, and his responsibility to keep the commanding officer informed; exclude
    any general claim that every concern must follow the same reporting path.
  span_range:
  - src:3258411ad2cc#p13.2
  - src:3258411ad2cc#p17.3
  decision: The administrative officer decides whether to raise concerns about women’s treatment and the closed female lavatory
    with the commanding officer or address the male officers directly or remain silent.
