- n: 4
  focus: The lieutenant weighs supporting the XO’s effort to address alleged misconduct against career risk, pressure to show
    loyalty to the CO, and the consequences of withholding relevant testimony. She chooses to testify, judging that silence
    would endorse the CO’s behavior and undermine the unit; exclude speculation about reactions beyond those stated in the
    case.
  span_range:
