  - doctrine-derived
- n: 3
  focus: After initially staying silent, he reports the incident to the commanding officer, concluding that inaction would
    condone the disclosure and that leaks could damage morale, cohesion, and performance. The commanding officer investigates
    privately and relieves the personnel officer; exclude the broader lesson as a universal reporting rule.
  span_range:
  - src:3258411ad2cc#p29.3
