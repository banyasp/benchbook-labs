episodes:
- n: 1
  focus: The decision point is whether to persist with the prosecution or drop it after the foreign press linked Shaw to the
    CIA. The account says the district attorney persisted because he believed Shaw was an important covert operative and expected
    the indictment to make Shaw fold; exclude the truth of the assassination allegations except as context for the decision.
  span_range:
  - src:46a8515de4c9#p7.2
  - src:46a8515de4c9#p7.3
  decision: The district attorney decides to continue prosecuting Shaw despite aides’ opposition.
  content_domain: other:prosecutorial discretion
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to provide the defense team information that might help it answer the allegations or
    withhold assistance. The Agency judged cooperation too risky because Garrison might exploit it; exclude the separate question
    of whether the CIA should publicly rebut the allegations.
  span_range:
  - src:46a8515de4c9#p11.1
  - src:46a8515de4c9#p11.2
  decision: CIA officials decide not to share information with Shaw’s defense team.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to provide exculpatory information to Shaw’s defense or take no action and resist subpoenas.
    The recommendation weighs the difficulty of controlled disclosure against the risk that silence could leave Shaw unable
    to refute allegations; exclude operational monitoring during the trial.
  span_range:
  - src:46a8515de4c9#p11.4
  - src:46a8515de4c9#p12.1
  decision: The CIA general counsel recommends that the director take no action on trial preparation except resist subpoenas.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
