- n: 1
  focus: The decision point is the choice to prioritize collective defense against Russian aggression rather than continue
    the broader out-of-area focus associated with Afghanistan. Exclude the summit’s other initiatives unless they are needed
    to explain this strategic reorientation.
  span_range:
  - src:62bbbbea15d1#p17.2
  - src:62bbbbea15d1#p17.2
  decision: NATO leaders at the 2014 Wales Summit chose to shift the alliance’s strategic focus toward territorial defense
    and deterrence.
  content_domain: other:nato force posture
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is the choice of a continuous presence through rotations and a rapidly deployable force, while
    not establishing permanent NATO forces in the east. The stated reason is the desire to avoid escalation in light of prior
    agreements with Russia; exclude details of force movements or exercise execution.
  span_range:
  - src:62bbbbea15d1#p17.3
  - src:62bbbbea15d1#p17.3
  decision: NATO chose enhanced troop rotations and a high-readiness force in its eastern member states rather than a permanent
    military presence.
  content_domain: other:nato force posture
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: 'The decision point is Poland’s choice of exercise scenario and its stated reason: avoiding antagonism toward Russia
    while conducting the exercise. Keep the focus on scenario selection and its policy significance; exclude the exercise’s
    operational design and execution.'
  span_range:
  - src:62bbbbea15d1#p48.2
  - src:62bbbbea15d1#p48.2
  decision: Poland’s exercise planners chose a fictitious-enemy scenario for Anakonda 16 rather than one depicting Russia
    as the attacker.
  content_domain: other:exercise scenario policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: 'The decision point is the choice of CTC location: Ukrainian senior leaders preferred improving nearer-front facilities,
    while U.S. planners considered the western site more prudent because the nearer locations were vulnerable and the western
    site had land and infrastructure for a CTC. Include the stated transportation-cost concern and the dialogue that built
    acceptance; exclude subsequent facility-management and training procedures.'
  span_range:
  - src:62bbbbea15d1#p60.4
  - src:62bbbbea15d1#p61.2
  decision: USAREUR planners chose to develop Ukraine’s enduring CTC capability at the International Peacekeeping and Security
    Center in western Ukraine rather than at training sites nearer the Donbas front.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is which force-request process to use for this particular security-cooperation mission. The source
    explains that Title 22 security-cooperation authorities led planners to use SCET, and describes the process’s approval
    and sourcing implications; exclude generic descriptions of either process that do not bear on this choice.
  span_range:
  - src:62bbbbea15d1#p64.5
  - src:62bbbbea15d1#p66.2
  decision: USAREUR and EUCOM planners used the SCET request process, rather than the request-for-forces process, to obtain
    support for the JMTG-U training mission.
  content_domain: other:security-cooperation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is the statutory authority used for the National Guard contribution. The source states that JMTG-U
    used 12301(d) at the outset and compares the authorities’ consequences, including lead time, duration, benefits, unit
    cohesion, and equipment sourcing; do not treat those considerations as proof of a specific motive beyond what the text
    supports.
  span_range:
  - src:62bbbbea15d1#p67.5
  - src:62bbbbea15d1#p67.7
  decision: Planners used the voluntary active-duty authority, 12301(d), to bring National Guard personnel onto the JMTG-U
    mission rather than using the involuntary mobilization authority, 12304b.
  content_domain: other:reserve mobilization authority
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is how to organize command across a 4,000-kilometer area with limited assets. The source describes
    the chosen split and its benefits; exclude unrelated convoy procedures and later recommendations.
  span_range:
  - src:62bbbbea15d1#p74.3
  - src:62bbbbea15d1#p74.4
  decision: The sustainment brigade chose to divide mission-command responsibilities for forward elements between its combat
    sustainment support battalion and movement control battalion, with one responsible in the north and the other in the south.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to use temporary facilities or wait for permanent facilities while equipment was arriving.
