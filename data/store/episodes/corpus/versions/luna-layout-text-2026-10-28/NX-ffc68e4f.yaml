episodes:
- n: 1
  focus: The decision point is whether to make incremental changes based on unit-level performance or first examine the headquarters-
    and Service-level institutions governing Romanian SOF. The Chief chose the systemic approach because prior U.S. training,
    equipment, and exercises had improved tactical capabilities but had done little to change the policies, structures, and
    rules needed for sustained institutional reform; exclude the tactical activities themselves.
  span_range:
  - src:c7075d22007a#p20.3
  - src:c7075d22007a#p20.4
  decision: Romania’s Chief of the General Staff chose to pursue a systemic, institution-level review of Romanian SOF before
    making organizational changes, and sought U.S. assistance for that effort.
  content_domain: other:security-cooperation policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is the institutional choice of how to qualify and retain candidates across land and maritime SOF.
    Include the low accession rates and the loss of promising candidates through injuries as the reasons; exclude detailed
    physical training methods.
  span_range:
  - src:c7075d22007a#p21.3
  - src:c7075d22007a#p22.2
  decision: The Romanian SOF design team chose to establish a joint initial qualification school with rehabilitation and coaching
    rather than retain a training approach that sought to eliminate as many candidates as possible.
  content_domain: other:defense institution building
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is prioritizing expansion of basic-training throughput while maintaining quality over focusing
    solely on recruiting or incentive changes. The stated evidence is that 3,500 qualified candidates were available but training
    could accommodate only 2,500 annually; exclude implementation details not given in the passage.
  span_range:
  - src:c7075d22007a#p23.1
  - src:c7075d22007a#p24.1
  decision: The Romanian design team and Ministry of Defense, with U.S. collaboration, chose to address basic-training capacity
    rather than treat recruiting funds and pay incentives as the primary solution to force-generation shortfalls.
  content_domain: other:defense institution building
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is the command structure selected through the design inquiry. The passage links the choice to
    the aim of transforming Romanian SOF into a joint strategic force and to obstacles in existing structures and rules; exclude
    tactical command procedures.
  span_range:
  - src:c7075d22007a#p22.2
  - src:c7075d22007a#p22.3
  decision: Romanian leadership chose to establish a joint SOF command with peacetime and operational authority over both
    land and maritime SOF rather than leave those forces under separate arrangements.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
