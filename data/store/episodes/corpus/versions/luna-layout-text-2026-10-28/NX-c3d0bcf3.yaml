episodes:
- n: 1
  focus: The decision contrasted the planned sequence with an accelerated entry, prompted by intelligence suggesting the Rumaylah
    oilfields might be destroyed. Keep the scenario at campaign-command level; exclude operational details of the advance.
  span_range:
  - src:460d3f0d71fb#p16.6
  - src:460d3f0d71fb#p16.8
  decision: The US campaign commander chose to shorten the planned air-operation period and bring ground forces into Iraq
    after about 24 hours.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision was to preserve the national infrastructure and protect electricity supplies for hospitals, rather than
    include the power grid in the target set. Exclude other Phase II activities and any details about targeting methods.
  span_range:
  - src:460d3f0d71fb#p14.8
  - src:460d3f0d71fb#p14.9
  decision: The US campaign planners chose not to include Iraq’s electrical power infrastructure among Phase II targets.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The decision arose amid resistance in Basra, concern that 1 (UK) Division lacked sufficient forces for a successful
    opposed entry, and the competing demand to preserve the Coalition’s main effort toward Baghdad. The stated reasons included
    urban-combat risk and the assessment that Baghdad’s fall would bring Basra’s fall, while the reverse was unlikely; exclude
    the operational details of patrols and testing tactics in nearby towns.
  span_range:
  - src:460d3f0d71fb#p42.13
  - src:460d3f0d71fb#p46.8
  decision: The UK land command decides whether to commit forces to enter Basra or keep them available for the advance on
    Baghdad; it adopts a posture of screening Basra and isolating Iraqi irregular forces rather than attempting an opposed
    entry.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to enter Basra while irregular forces remained organised and civilian support for the
    Coalition was limited, or continue pressure while avoiding a costly assault. The stated reasons included the risk of significant
    British and civilian casualties, infrastructure damage and political harm; exclude the specific raids, patrols and other
    operational methods described.
  span_range:
  - src:460d3f0d71fb#p55.10
  - src:460d3f0d71fb#p57.2
  decision: The UK division commander continued a gradual pressure strategy around Basra rather than entering the city immediately;
    authority to decide entry rested with the Coalition land commander.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is how to prioritise limited forces between Baghdad and Basra, including whether to reinforce
    operations to enter Basra. The source gives the US commanders’ stated priorities and reasons; exclude the operational
    details of particular attacks, routes or force movements.
  span_range:
  - src:460d3f0d71fb#p55.6
  - src:460d3f0d71fb#p56.7
  decision: US commanders maintained Baghdad as the main effort and did not commit additional forces to secure entry into
    Basra at that stage.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to organise a coordinated communications strategy to support the campaign and explain
    the prospective future of Iraq. The source cites concerns about strategic coherence, public support and the need for realistic
    promises; exclude the proposed unit-by-unit messaging methods as implementation detail.
  span_range:
  - src:460d3f0d71fb#p59.6
  - src:460d3f0d71fb#p60.3
  decision: The Prime Minister proposed a coordinated UK-US communications effort, including a cross-Atlantic media and communications
    “War Room,” rather than relying on ad hoc messaging.
  content_domain: other:strategic-communications-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: 'The decision point is the commanders’ choice about when to enter Basra: delay or proceed once conditions and the
    opportunity appeared favorable. The account cites the aim of reducing casualties and the commanders’ assessment of the
    situation; exclude the detailed raids, force movements, and other operational methods.'
  span_range:
  - src:460d3f0d71fb#p80.2
  - src:460d3f0d71fb#p81.5
  decision: The UK divisional commander, with Coalition land-component authorization, decided to enter Basra on 6 April rather
    than wait.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision was between possible areas of UK responsibility; the Prime Minister said the South followed from the
    choice to make the UK military contribution through the South. The stated rationale was that the South seemed more manageable
    and likely to be relatively supportive. Exclude later force-sizing and exit-strategy discussions.
  span_range:
  - src:460d3f0d71fb#p97.6
  - src:460d3f0d71fb#p97.8
  decision: The Prime Minister decided that the UK would take responsibility for the South sector of Iraq.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 9
  focus: The Chiefs of Staff chose to adopt the proposed approach for coordinating military and civil decision-making with
    Iraqi authorities and other organisations. The draft described it as a familiar crisis-coordination model that could support
    military authority while fostering civilian ownership, with a later transition to civilian leadership. Exclude the operational
    details of implementing the model.
  span_range:
  - src:460d3f0d71fb#p100.3
  - src:460d3f0d71fb#p106.2
  decision: The Chiefs of Staff agreed that UK forces should use the Joint Commission approach to local government in Phase
    IV.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to advocate an immediate, full ORHA presence or a limited initial role focused on humanitarian
    and reconstruction work. Include the concern about local confidence, military efforts and political timing; exclude the
    operational methods used to clear towns.
  span_range:
  - src:460d3f0d71fb#p109.4
  - src:460d3f0d71fb#p110.5
  decision: The UK Defence Secretary agreed to press the US Secretary of Defense for a cautious, limited ORHA role in southern
    Iraq rather than an immediate broad political and governmental deployment.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The decision point is whether to extend the UK area beyond Basra to include all of Maysan, conditional on al-Amara
    being secure. Include the stated rationale of preparing for reconstruction, engaging local leaders and the assessment
    of the area’s burden; exclude the military movement details.
  span_range:
  - src:460d3f0d71fb#p112.4
  - src:460d3f0d71fb#p113.2
  decision: The UK Defence Secretary approved extending the UK Area of Operations to all of Maysan province once al-Amara
    was secure.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 12
  focus: The decision point is whether to plan for a four-province area, with a possible fifth, or a smaller commitment. Include
    the conditions of a permissive environment and partner contributions, and the intended alignment with ORHA’s region; note
    the passage’s concerns about coordination and capacity. Do not treat this conditional planning assumption as a formal
    final decision on the area’s boundaries.
  span_range:
  - src:460d3f0d71fb#p123.8
  - src:460d3f0d71fb#p124.9
  decision: UK ministers endorsed an assumption that the UK military area would comprise four southern Iraqi provinces, subject
    to conditions, with a possible fifth if other countries supplied the necessary forces.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 13
  focus: This is a UK negotiating-policy choice about who should shape the interim Iraqi administration and the role of the
    UN. The stated reasons include legal limits on an occupying power’s authority, the need for Iraqi and international support,
    and the view that the Security Council would not accept overt US/UK control. Exclude operational details and distinguish
    the UK position from proposals that were still under negotiation.
  span_range:
  - src:460d3f0d71fb#p141.7
  - src:460d3f0d71fb#p142.5
  decision: The UK Government chose to advocate a UN-facilitated process for establishing an Iraqi interim authority with
    genuine executive powers, rather than a Coalition-created authority subordinate to the Coalition.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The decision point is whether to resolve the disagreement over the UN’s role and the future Iraqi government immediately
    or postpone it until the Coalition was in a stronger position. The stated reasons were to avoid exposing the difference
    prematurely and to preserve leverage; exclude covert or operational techniques, which are not at issue here.
  span_range:
  - src:460d3f0d71fb#p143.11
  - src:460d3f0d71fb#p144.7
  decision: The Prime Minister chose to defer public or substantive resolution of the US-UK disagreement over post-conflict
    administration until after the conflict, while pursuing quiet diplomacy.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: The decision point is whether to retain the narrower Basra-focused area or accept responsibility for all four provinces
    covered by CPA(South). The stated rationale was alignment with the CPA’s area; the passage also records fragile security,
    reduced UK force strength, and the absence of robust analysis of strategic and resource implications. Do not infer a fuller
    justification than the report provides.
  span_range:
  - src:460d3f0d71fb#p130.2
  - src:460d3f0d71fb#p133.3
  decision: The UK Government chose to assume military responsibility for four southern Iraqi provinces, expanding its area
    of responsibility to match CPA(South).
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 16
  focus: The decision point is the negotiation over whether the UN would be excluded, lead the administration, or have a substantial
    supporting role. The stated reasons included legitimacy, engaging international financial institutions and donors, and
    enabling the UK to secure its exit; exclude the separate question of the precise Security Council resolution format.
  span_range:
  - src:460d3f0d71fb#p158.4
  - src:460d3f0d71fb#p159.8
  decision: The UK Prime Minister and the US President chose to secure a significant UN role in post-conflict Iraq, without
    making the UN the lead administrator.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The decision point is whether to proceed quickly with the proposed conference and authority or allow more time for
    a representative process. The UK’s stated concern was that a rushed process would give exiles disproportionate influence
    and lack Iraqi buy-in; exclude later constitutional and electoral implementation details.
  span_range:
  - src:460d3f0d71fb#p157.7
  - src:460d3f0d71fb#p165.4
  decision: The UK Prime Minister and the US President chose to slow the formation of the Iraqi Interim Authority to improve
    its representativeness and Iraqi acceptance.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The decision point is whether to remain at arm’s length from ORHA to limit potential UK responsibility or participate
    more fully while negotiating safeguards. The record identifies legal exposure, the need for UK influence commensurate
    with its military contribution, and concern about ORHA imposing reforms without further authority; exclude the staffing
    and practical execution of particular ORHA roles.
  span_range:
  - src:460d3f0d71fb#p156.8
  - src:460d3f0d71fb#p168.9
  decision: The UK Government chose to increase and formalise its support for ORHA while seeking consultation, joint decision-making,
    and limits on actions lacking legal authority.
  content_domain: other:occupation authority and governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 19
  focus: The choice was whether to authorize the proposed accelerated return of about 3,500 troops or defer it. The briefing
    described which personnel were to redeploy, were needed in the UK, or had completed redundant war-fighting tasks; officials
    also cautioned against creating the impression that the UK was leaving amid disorder and suggested awaiting further details.
    Exclude tactical deployment methods.
  span_range:
  - src:460d3f0d71fb#p174.3
  - src:460d3f0d71fb#p178.6
  decision: The Defence Secretary approved a substantial withdrawal of UK ground troops from Iraq while retaining forces for
    continuing security responsibilities.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is the UK’s negotiating approach after it judged the US draft unacceptable in the Security Council.
    The source says the UK had proposed addressing issues one by one because this resolution was necessary and the draft risked
    failing; exclude the later details of negotiations except as context for that choice.
  span_range:
  - src:460d3f0d71fb#p175.4
  - src:460d3f0d71fb#p175.6
  decision: The Foreign Secretary chose to pursue a more negotiable, issue-by-issue approach to the post-conflict UN resolution
    rather than accept the US omnibus draft as written.
  content_domain: other:international policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 21
  focus: The choice was whether to continue involving the department responsible for development or exclude it once the policy
    parameters were considered settled. The source links the decision to the Foreign Secretary’s understanding that the International
    Development Secretary intended to resign and his view that negotiations should proceed; assess the consultation and accountability
    implications, not the resolution’s substantive merits.
  span_range:
  - src:460d3f0d71fb#p192.4
  - src:460d3f0d71fb#p192.5
  decision: The Foreign Secretary decided not to involve the International Development Department in the final phase of negotiating
    the Iraq resolution.
  content_domain: other:government accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: The choice was between deploying the brigade for a short-term security and police-training role in Baghdad and relying
    on US forces while pursuing police-training plans. The Prime Minister accepted the MOD advice, which cited limited likely
    effect, risks to the brigade and the UK’s position in the South, and the US view that deployment was unnecessary; exclude
    the operational details of any deployment plan.
  span_range:
  - src:460d3f0d71fb#p213.3
  - src:460d3f0d71fb#p213.10
  decision: The Prime Minister decided whether to deploy 16 Air Assault Brigade to Baghdad or accept the Chiefs of Staff’s
    advice against deployment.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 23
  focus: The choice was whether to state the Occupying Powers status explicitly or avoid the term. The UK representative advised
    that explicit recognition clarified the applicable international-law framework and could help secure Security Council
    agreement; the governments chose to take responsibility for that status. Exclude later disputes about the extent of the
    UK’s territorial responsibility, except as context.
  span_range:
  - src:460d3f0d71fb#p207.5
  - src:460d3f0d71fb#p207.7
  decision: The UK and US governments decided to identify themselves as Occupying Powers in the Security Council resolution.
  content_domain: other:occupation-law-and-status
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 24
  focus: The decision point is whether to limit exclusion to senior or committed regime figures, or apply a broader policy.
    The passage records the broad policy and describes arguments for removing regime-linked officials, alongside concerns
    about excluding people who joined for practical reasons and the need to plan for replacements; it also notes pressure
    from Iraqis who had suffered under the regime. Exclude the separate decision to dissolve the military and later implementation
    details.
  span_range:
  - src:460d3f0d71fb#p198.7
  - src:460d3f0d71fb#p199.5
  decision: The CPA Administrator decided how broadly to exclude members of the Ba’ath Party from public roles.
  content_domain: other:occupation-governance-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 25
  focus: The decision point is the choice between this arrangement and a National Conference as the means of establishing
    a representative interim body. Include the legitimacy concerns and the proposed role of the UN Special Representative;
    exclude later institutional details not needed to reconstruct this choice.
  span_range:
  - src:460d3f0d71fb#p215.3
  - src:460d3f0d71fb#p215.5
  decision: FCO officials agree to use an Advisory Council to identify prospective members of an Iraqi Interim Administration,
    with formal approval by the Coalition.
  content_domain: other:political-transition-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 26
  focus: The decision point is whether to deploy the headquarters or hold back pending clarification, weighing the UK’s strategic
    role against risks to its priority effort in the South. Exclude operational deployment methods and focus on the policy-level
    rationale for deferral.
  span_range:
  - src:460d3f0d71fb#p224.7
  - src:460d3f0d71fb#p226.9
  decision: The Chiefs of Staff defer a decision on deploying the Allied Rapid Reaction Corps headquarters until US command-and-control
    arrangements are clarified.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 27
  focus: The decision point is the legal boundary between facilitating an Iraqi interim administration and controlling the
    political process. Include the resolution’s stated mandate and the requirement for strict compliance; exclude unrelated
    reconstruction powers and specific institutional proposals.
  span_range:
  - src:460d3f0d71fb#p224.11
  - src:460d3f0d71fb#p225.10
  decision: The Attorney General concludes that resolution 1483 authorizes the Coalition to facilitate an Iraqi political
    process, but not to control it or engineer its outcome.
  content_domain: other:international-law-authority
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 28
  focus: The decision was whether the CPA should set deadlines or leave that responsibility to the Iraqi people. Focus on
    the policy choice and the stated reason of Iraqi ownership; exclude later developments in the political process.
  span_range:
  - src:460d3f0d71fb#p236.5
  - src:460d3f0d71fb#p236.5
  decision: The CPA Administrator decided not to impose deadlines for the political process after the councils were established.
  content_domain: other:political-transition-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 29
  focus: The decision concerned whether to adjust force levels in response to increased tasks, unsustainable workload and
    the lack of an uncommitted reserve. Focus on the force-level recommendation and its rationale; exclude operational methods
    for employing forces or specialist capabilities.
  span_range:
  - src:460d3f0d71fb#p252.10
  - src:460d3f0d71fb#p254.3
  decision: The Chiefs of Staff agreed to recommend additional force capacity for the UK area in Iraq and referred the recommendations
    to Ministers.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 30
  focus: The decision point is whether to continue the planned process or pursue an earlier handover, including a provisional
    assembly or government. The source gives concerns about legitimacy, constitutional and practical obstacles, and the risk
    that an early transfer would not deliver a democratic and stable Iraq; exclude the operational details of election design.
  span_range:
  - src:460d3f0d71fb#p275.7
  - src:460d3f0d71fb#p276.9
  decision: The UK foreign-policy leadership chose to stick with the existing political transition plan toward elections in
    mid-2004, keeping an accelerated or two-stage transfer of sovereignty as a fallback.
  content_domain: other:political-transition
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 31
  focus: The decision point is whether to reinforce UK forces in response to the changing security situation and the CPA’s
    planned emergency infrastructure work. The source states the requirement and its context, including the expanding range
    of tasks; exclude tactical employment or other operational methods.
  span_range:
  - src:460d3f0d71fb#p272.4
  - src:460d3f0d71fb#p274.3
  decision: The Defence Secretary chose to deploy two additional infantry battalions and specialist capabilities to Iraq,
    while preparing a further brigade-related contingency.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 32
  focus: The decision point is the extent of UK funding for the plan, with the balance expected from the CPA in Baghdad. The
    stated reason was to avoid implying that the UK government was taking full responsibility for southern Iraq and future
    infrastructure funding; exclude the plan’s implementation details.
  span_range:
  - src:460d3f0d71fb#p271.5
  - src:460d3f0d71fb#p271.6
  decision: The development minister chose to commit £20 million to the southern Iraq essential-services plan rather than
    meet its full cost.
  content_domain: other:reconstruction-funding
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 33
  focus: The choice was between an early handover and retaining executive authority under the Coalition for the time being.
    The Prime Minister supported the latter because he believed Iraqis preferred Coalition-backed stability to instability
    under an Iraqi government.
  span_range:
  - src:460d3f0d71fb#p283.9
  - src:460d3f0d71fb#p283.11
  decision: The UK Prime Minister decided to oppose an early transfer of executive power to an Iraqi administration.
  content_domain: other:political-transition-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 34
  focus: The choice was whether to keep pursuing a full constitutional process before transfer or use an interim political
    arrangement and transfer sovereignty sooner. The proposed timetable responded to doubts that a full constitutional process
    and credible elections could be completed in time; exclude operational security measures except as context for the timing.
  span_range:
  - src:460d3f0d71fb#p296.4
  - src:460d3f0d71fb#p297.7
  decision: The UK Prime Minister accepted a timetable for elections to an assembly and transfer of sovereignty to a transitional
    Iraqi government in 2004.
  content_domain: other:political-transition-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 35
  focus: The legal choice was whether authorising a multinational force ended the occupation immediately or whether occupation
    continued until a representative Iraqi government assumed the CPA’s responsibilities. The adviser concluded the latter,
    relying on the resolution’s stated condition for the occupation to end; this is a preliminary legal view, not a record
    of a final adjudication.
  span_range:
  - src:460d3f0d71fb#p290.5
  - src:460d3f0d71fb#p290.7
  decision: The UK legal adviser concluded that Security Council resolution 1511 did not itself end the UK’s status as an
    Occupying Power.
  content_domain: other:international-law-interpretation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 36
  focus: 'The decision replaced the stalled political process with a staged constitutional and electoral sequence, including
    provincial caucuses rather than immediate direct elections for the transitional assembly. The passage identifies the deadlock
    behind the change: the Coalition wanted constitutional principles before elections, while Grand Ayatollah al-Sistani opposed
    a constitution written or influenced by non-Iraqis; exclude later disputes over implementation.'
  span_range:
  - src:460d3f0d71fb#p298.8
  - src:460d3f0d71fb#p300.4
  decision: The Iraqi Governing Council and Coalition adopted the 15 November Agreement, setting a process for a transitional
    assembly and government and a 30 June 2004 transfer of sovereignty.
  content_domain: other:political-transition-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 37
  focus: The Force Level Review found existing resources insufficient to maintain security while training and mentoring Iraqi
    security forces, and recommended additional forces; the Defence Secretary subsequently announced the deployment. Focus
    on the policy and command choice about committing forces and the stated training and security needs, not tactical employment.
  span_range:
  - src:460d3f0d71fb#p312.2
  - src:460d3f0d71fb#p314.8
  decision: The Chief of Defence Staff and Defence Secretary approved deploying an additional battalion and two platoons of
    Royal Military Police to Iraq for six months beginning in January 2004.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 38
  focus: 'The task force was created to increase understanding of the insurgency, while the Chief of Defence Intelligence
    explicitly identified the cost: reduced assessment of non-insurgent activity in Iraq and less regionally experienced cover
    in the Gulf branch. Treat this as an intelligence-analysis resource-allocation decision; exclude any operational intelligence-collection
    methods.'
  span_range:
  - src:460d3f0d71fb#p301.6
  - src:460d3f0d71fb#p301.8
  decision: The Chief of Defence Intelligence established a task force to increase analytical effort on the insurgency in
    Iraq, accepting a short-term reduction in analysis elsewhere.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 39
  focus: The decision point is whether to maintain the handover date despite political and security difficulties. The stated
    reasons included protecting UK and coalition credibility, avoiding an appearance of indefinite occupation, enabling UN
    engagement, and ending the political vacuum; exclude the detailed election-selection process itself.
  span_range:
  - src:460d3f0d71fb#p330.6
  - src:460d3f0d71fb#p331.5
  decision: The UK Prime Minister pressed the US President to keep the 30 June 2004 sovereignty-transfer deadline rather than
    postpone it.
  content_domain: other:political-transition policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 40
  focus: The decision point is the UK’s preferred legal and policy basis for a continued multinational force presence after
    the handover, balancing operational freedom with Iraqi sovereignty and consent. Exclude the specific operational powers
    listed except as context for the framework, and do not treat them as instructions for action.
  span_range:
  - src:460d3f0d71fb#p324.10
  - src:460d3f0d71fb#p325.5
  decision: The UK government endorsed a post-handover security framework based on Iraqi invitation and a further UN resolution,
    while seeking coalition operational freedom and an Iraqi role.
  content_domain: other:post-transition legal and security framework
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 41
  focus: The decision point is whether the transitional framework should acknowledge the existing Kurdish regional administration
    or avoid that recognition amid concerns about federalism and special treatment. The stated rationale was that the administration
    had governed effectively and broader federalism questions could be left to later Iraqi discussions; exclude the subsequent
    constitutional negotiations beyond that rationale.
  span_range:
  - src:460d3f0d71fb#p335.7
  - src:460d3f0d71fb#p335.7
  decision: UK foreign-policy officials supported retaining recognition of the Kurdish Regional Government in the Transitional
    Administrative Law rather than omitting it.
