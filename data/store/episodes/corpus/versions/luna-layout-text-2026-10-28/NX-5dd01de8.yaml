episodes:
- n: 1
  focus: The commander rejects a packed schedule of meetings in favor of a smaller set of battle-rhythm events. The stated
    reasons are that the former schedule left staff estimates updated only once daily, produced slides that went unused, and
    left too little time for the commander to visit units. Exclude general lessons about staff processes beyond this specific
    decision.
  span_range:
  - src:84c77604c467#p16.3
  - src:84c77604c467#p17.2
  decision: The brigade commander decides to reduce the brigade battle rhythm to the commander’s update brief, operations
    synchronization, and targeting board.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision reallocates forces to reinforce the battalion’s effort at Batoor after its commander reports inadequate
    combat power, significant casualties, and difficulty advancing on two objectives. Exclude the movement instructions and
    any tactical details about how the units would fight.
  span_range:
  - src:84c77604c467#p19.2
  - src:84c77604c467#p20.3
  decision: The brigade commander decides to place two rifle companies and a sapper platoon under the control of the battalion
    struggling to seize its objectives.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The commander directs an immediate reassessment and changes to planning products and requests after the joint headquarters
    reports possible long-range artillery and air-defense assets. The stated reason is that waiting for a scheduled event
    to update execution products and estimates would be a failure. Exclude the operational details of collection, targeting,
    or employing assets.
  span_range:
  - src:84c77604c467#p38.2
  - src:84c77604c467#p38.3
  decision: The brigade commander decides that staff must reassess the plan immediately in light of newly reported enemy artillery
    and air-defense threats rather than wait for the next battle-rhythm event.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision weighs more advantageous terrain against the time and combat power needed to reach it, prepare the defense,
    and transfer terrain to Razorback. Include the commander’s reasons for stopping the advance and withholding the reserve;
    exclude the tactical details of constructing obstacles or fighting positions.
  span_range:
  - src:84c77604c467#p53.2
  - src:84c77604c467#p73.3
  decision: Cajun 6 decides whether to continue Copperhead’s advance to Low Water Crossing 5 or stop short and establish the
    defense at the crossings already seized.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision weighs survivability and continuity of command against personnel limits, reduced functionality, and
    the lack of rehearsal. Include Cajun 6’s authorization and conditions; exclude technical setup details.
  span_range:
  - src:84c77604c467#p58.3
  - src:84c77604c467#p59.2
  decision: Cajun 6 decides whether to establish a TAC as a redundant command-and-control node after the TOC is attacked.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The immediate choice is whether to commit the reserve or retain it for other contingencies; the situation includes
    Gator’s heavy contact and request for reinforcement. Include the command decision and its context, but exclude the subsequent
    tactical employment of the reserve.
  span_range:
  - src:84c77604c467#p68.3
  - src:84c77604c467#p69.1
  decision: Cajun 6 decides whether to commit the BCT reserve to reinforce Gator after the enemy’s second echelon reaches
    EA LION.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The commander delays commitment while staff assess whether the contact is a main attack or heavy reconnaissance.
    The stated reasons are that the reserve criteria in the DSM are not met and the reports and battle-damage assessment need
    to be reconciled; exclude later reserve decisions and tactical response details.
  span_range:
  - src:84c77604c467#p80.2
  - src:84c77604c467#p81.2
  decision: The brigade commander decides whether to commit the reserve to Copperhead or wait for clearer evidence that the
    attack warrants it.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: After hostile aircraft expose serious vulnerabilities around the TOC, the XO initially favors planning the move and
    starting it in the morning, while the S-3 urges sending the TAC out immediately. The decision weighs force protection
    and continuity of command against staff exhaustion; exclude the mechanics of the displacement.
  span_range:
  - src:84c77604c467#p92.3
  - src:84c77604c467#p93.2
  decision: The brigade command team decides whether to begin displacing the TOC immediately or delay the move until morning.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 9
  focus: The judge advocate advises additional confirmation and caution because the location may be on the no-strike list;
    the brigade commander directs that the target be attacked, citing confidence in the signal, an imminent threat, and the
    target’s military character. Keep the focus on the authority, legal standard, and collateral-risk judgment, not weapon
    selection or strike execution.
  span_range:
  - src:84c77604c467#p112.2
  - src:84c77604c467#p113.2
  decision: The brigade commander decides whether to strike a suspected enemy command-and-control target associated with a
    mosque despite the no-strike-list concern.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 10
  focus: Gator reports heavy contact, a company displaced from its positions, and its committed company nearly out of combat
    power; Cajun 6 commits the reserve. The decision point is how to allocate a limited reserve amid immediate need and the
    possibility of competing demands. Exclude the specific movements or methods of combat employment.
  span_range:
  - src:84c77604c467#p133.3
  - src:84c77604c467#p134.6
  decision: Cajun 6 decides whether to commit the BDE reserve to reinforce Gator during heavy contact.
