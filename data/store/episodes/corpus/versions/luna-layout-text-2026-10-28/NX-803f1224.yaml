episodes:
- n: 1
  focus: The decision point is whether to continue the planned training sortie or discontinue/avoid training as weather developed.
    The report says the instructor pilot assessed the mission at 25 risk points—within the low category that allowed the aircraft
    commander to accept the risk—and the crew assessed conditions as acceptable; exclude the later flight-control and recovery
    decisions.
  span_range:
  - src:bd5723d151c3#p10.3
  - src:bd5723d151c3#p10.9
  decision: The mishap instructor pilot, acting as aircraft commander, accepted the assessed low risk and continued the return
    sortie into the MOA for training despite developing clouds.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether the instructor pilot should retain control or yield it to the other pilot, who had
    better situational awareness and opposed ejection. Focus on the emergency judgment and responsibility for control; exclude
    flight-control techniques and recovery procedures.
  span_range:
  - src:bd5723d151c3#p32.3
  - src:bd5723d151c3#p32.3
  decision: The instructor pilot decided to transfer aircraft control to the mishap pilot after the instructor pilot lost
    situational awareness.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to order ejection or continue the emergency recovery attempt after the other pilot
    took control but the aircraft did not immediately respond. Focus on the safety judgment and its rationale; exclude ejection
    procedures and aircraft-control details.
  span_range:
  - src:bd5723d151c3#p32.3
  - src:bd5723d151c3#p32.4
  decision: The instructor pilot decided to command ejection after the aircraft showed no immediate correction.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
