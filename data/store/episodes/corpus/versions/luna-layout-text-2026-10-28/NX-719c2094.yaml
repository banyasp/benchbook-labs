- n: 1
  focus: The decision point is whether to subject the effort to NSC oversight or allow it to proceed without that additional
    oversight. The stated reason was to prevent what the DCI considered reckless activity; exclude operational details of
    the effort.
  span_range:
  - src:151567fe5de4#p5.2
  - src:151567fe5de4#p5.2
  decision: The DCI decided to place the MONGOOSE interagency effort under an NSC oversight group.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to require broad internal reporting of potentially charter-inconsistent activity after
    revelations about past Agency conduct. The source says the DCI wanted to avoid being blindsided again; exclude details
    of the activities listed in the resulting report.
  span_range:
  - src:151567fe5de4#p7.2
  - src:151567fe5de4#p7.2
  decision: The DCI ordered CIA employees to report activities that might appear inconsistent with the Agency’s charter.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to retain a freer hand in managing covert action or require review against defined
    standards. The DCI’s stated standards were competence, practicality, and consistency with American foreign policy and
    values, in a period when restoring public and congressional credibility was a priority; exclude operational methods.
  span_range:
  - src:151567fe5de4#p10.3
  - src:151567fe5de4#p10.4
  decision: The DCI established rigorous internal standards for reviewing covert action proposals and activities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
