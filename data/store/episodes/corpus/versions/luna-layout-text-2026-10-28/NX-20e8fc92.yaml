  focus: The decision point is whether to leave intelligence estimates based on inconsistent approaches or develop shared
    methods; the subcommittee undertook studies, and a working-level agreement on road capacity was reached in 1961. The stated
    reasons were that divergent estimates confused policymakers and that a common understanding was needed for reasonably
    uniform conclusions. Exclude the technical formulas and their application to Tibet as separate decision points.
