  focus: The decision point is whether to adapt commercial audits to meet deployment timelines or use FWRAs outside their
    stated policy scope. The source says streamlined audits made an extension of FWRAs unnecessary and preserved the commercial-audit
    standard; exclude the process’s procedural details.
  span_range:
  - src:5b0ae1029d9c#p4.7
  - src:5b0ae1029d9c#p5.3
  decision: The Food Protection sub-working group of the DOD Veterinary Service COVID-19 OPT chose a streamlined commercial
    food-protection audit process for rapid CONUS COVID-19 deployments rather than extending use of FWRAs to CONUS.
  content_domain: other:food-protection-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The choice was to allow use before test results arrived or wait for those results and delay feeding plans. The source
    explains the limited risk accepted and the safeguard if results proved unacceptable; exclude laboratory procedures.
  span_range:
  - src:5b0ae1029d9c#p11.5
  - src:5b0ae1029d9c#p11.7
  decision: DOD food-protection authorities conditionally approved catering facilities with acceptable audit results for use
    during emergency deployments while laboratory results were pending.
  content_domain: other:food-protection-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: 'The decision point is how to maintain food-protection oversight when in-person audits were not feasible: extend
    deadlines and use virtual reviews where appropriate, or suspend facilities or rely on the usual audit schedule. The source
    gives the supply and risk-management reasons; exclude virtual-audit implementation details.'
  span_range:
  - src:5b0ae1029d9c#p12.6
  - src:5b0ae1029d9c#p13.1
  decision: APHC and the DOD Veterinary Service COVID-19 OPT chose to extend routine audit deadlines and activate a risk-stratified
    virtual Systems Review Audit process when pandemic constraints prevented timely in-person audits.
  content_domain: other:food-protection-policy
