- n: 1
  focus: The passage describes the staff turning to an unofficial reporting method amid the burden of maintaining information
    across multiple systems; the result was that command nodes and subordinate brigades lacked real-time tracking. Frame the
    issue as a command information-management and SOP-compliance decision, not as guidance on conducting the air assault or
    gap crossing.
  span_range:
  - src:0186e0fde94a#p23.5
  - src:0186e0fde94a#p23.6
  decision: A division staff chose whether to use its planned command-and-control reporting architecture or an Excel checklist
    for an air assault and gap crossing, and used Excel.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is how to staff distributed command-post functions when officer availability is limited and the
    division is at roughly two-thirds authorized strength. Consider the choice to entrust NCOs with those responsibilities
    and the stated reasons; exclude general recommendations about NCO participation in planning.
  span_range:
  - src:0186e0fde94a#p53.4
  - src:0186e0fde94a#p53.4
  decision: Division G-2 leaders assigned NCOs responsibility for critical staff positions, including responsibilities sometimes
    above their rank, during warfighter exercises.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
