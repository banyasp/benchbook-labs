episodes:
- n: 1
  focus: The directive resolves threshold uncertainty in favor of informing the intended victim when none of the listed waiver
    justifications is present. Focus on that default and the factors that could justify a waiver; exclude the broader description
    of the duty to warn as a general policy principle.
  span_range:
  - src:8f33b6d570c9#p2.3
  - src:8f33b6d570c9#p2.4
  decision: An IC element decides whether to warn when it is uncertain that threat information meets the duty-to-warn threshold
    and no waiver justification applies.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The directive permits expeditious warning in this exigent circumstance and requires subsequent notification. Keep
    the focus on whether prior consultation may be bypassed; exclude any details about how to communicate the warning.
  span_range:
  - src:8f33b6d570c9#p3.3
  - src:8f33b6d570c9#p3.3
  decision: An IC element decides whether to warn without prior consultation or notification when a threat is so imminent
    that consultation or notification is infeasible.
  content_domain: intel-oversight
  refusal_sensitivity: medium
