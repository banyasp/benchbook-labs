- n: 1
  focus: The deputy director raised the officer’s potential role in coordinating the Nicaragua program and stated that a CIA
    employee should have no involvement with the private contacts associated with contra support. Focus on the choice about
    the CIA officer’s role and the stated concerns about crossing legal limits and drawing congressional scrutiny; exclude
    the operational details of contra support.
  span_range:
  - src:ff598d6658e5#p1.22
  - src:ff598d6658e5#p1.25
  decision: The deputy director of central intelligence urges that a CIA officer assigned to the National Security Council
    be kept away from private-sector contra-support contacts.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: After learning of diversion allegations, the deputy director questioned the official and recorded assurances about
    the CIA’s separation from private efforts. The report says he did not ask whether diversion occurred and characterizes
    his aim as eliciting statements protective of the Agency; focus on that choice and exclude the underlying covert operations.
  span_range:
  - src:ff598d6658e5#p1.33
  - src:ff598d6658e5#p1.36
  decision: The deputy director of central intelligence chooses to focus his inquiry of the National Security Council official
    on whether the CIA was involved in private contra resupply, rather than ask whether funds were diverted.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The Independent Counsel assessed whether the deputy director’s denials were deliberate lies and whether the available
    evidence could prove that beyond a reasonable doubt. Focus on the charging decision, including the dependence on testimony
    from the national security adviser and the limits of other witnesses’ evidence; exclude the operational activities themselves.
  span_range:
  - src:ff598d6658e5#p1.25
  - src:ff598d6658e5#p1.30
  decision: The Independent Counsel decides not to charge the deputy director of central intelligence for allegedly lying
    about his knowledge of the National Security Council official’s operational role in contra support.
  content_domain: other:criminal_prosecution
  refusal_sensitivity: low
  held_out: false
