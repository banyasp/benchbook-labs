- n: 3
  focus: The decision point is whether to address reintegration through a dedicated, cross-functional cell and coordinated
    policy rather than leave it to conventional headquarters planning. The passage cites prior schemes’ poor design, poor
    execution and corruption, which had fostered cynicism, and describes coordination with ISAF reintegration teams. Exclude
    operational methods beyond this policy and organizational decision.
  span_range:
