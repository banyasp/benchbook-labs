- n: 2
  focus: The decision point is whether to permit the Polish airmen and airwomen to fly operationally; the RAF first withheld
    permission, citing language and morale concerns, then accepted them as the shortage worsened. Keep the focus on the personnel
    and command decision, not on combat tactics or aircraft employment.
  span_range:
  - src:f68170ec0eb5#p52.3
  - src:f68170ec0eb5#p52.5
  decision: RAF leadership decided to accept Polish exiles for operational flying and form two Polish fighter units as the
    trained-pilot shortage became critical.
  content_domain: operational-command
  refusal_sensitivity: low
