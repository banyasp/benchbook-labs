- n: 2
  focus: The decision point is whether and how to structure the operation so that CIA activity stayed within its authority
    while the FBI made the arrest and retained custody, with the suspect apprehended outside any sovereign nation's territory.
    The stated reasons were that CIA lacked authority to arrest individuals and that planners wanted a clean, unbroken line
    of jurisdiction; exclude the operational details of the transfer.
