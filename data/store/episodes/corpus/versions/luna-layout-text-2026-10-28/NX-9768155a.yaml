- n: 2
  focus: The committee considered requiring court orders and whether any federal judge could issue them, then concluded that
    a defined group with authority over classified cases was necessary. The stated reason was that a full background investigation
    of all federal judges would be impractical; exclude the mechanics of conducting surveillance or intercepts.
  span_range:
