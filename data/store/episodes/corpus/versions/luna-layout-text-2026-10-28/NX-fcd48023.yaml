episodes:
- n: 1
  focus: The decision point is whether to treat the contemplated operation as authorized force against enemy forces under
    the AUMF and as covered by the public-authority justification, or to conclude that federal criminal law bars it. The memorandum’s
    stated reasons include the represented facts about the target’s role and threat, the AUMF’s scope, the citizen’s status,
    and whether the operation would comply with the laws of war; exclude any operational method or the separate CIA analysis,
    which is not developed in this excerpt.
  span_range:
  - src:60f8e587db54#p9.5
  - src:60f8e587db54#p14.2
  decision: The Office of Legal Counsel advises the Attorney General whether the contemplated Department of Defense lethal
    operation in Yemen against a U.S. citizen described as an AQAP leader is legally permissible.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The decision point is whether to apply the law of armed conflict to the operation based on the conflict as a whole
    and the stated links among AQAP, al-Qaida, and the target, rather than exclude it because of the operation’s location
    or local hostilities. OLC concludes that the operation would be part of the non-international armed conflict and, on the
    represented facts and safeguards, would comply with the applicable law of war and federal public-authority justification.
    Exclude operational methods; the focus is the legal basis for the contemplated use of force.
  span_range:
  - src:60f8e587db54#p16.3
  - src:60f8e587db54#p20.3
  decision: The Office of Legal Counsel (OLC) decides whether the contemplated Department of Defense operation in Yemen falls
    within the U.S.–al-Qaida armed conflict and may be treated as lawful conduct of war.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: The decision point is whether the CIA’s participation makes the contemplated operation legally prohibited, or whether
    the public-authority justification covers it as it does the DoD operation. OLC concludes that the justification applies,
    relying on the operation’s stated connection to authorized hostilities, compliance with humanitarian law, and the absence
    of a statutory intent to bar such authorized government action. Exclude operational details and focus on agency authority
    and statutory interpretation.
  span_range:
  - src:60f8e587db54#p20.4
  - src:60f8e587db54#p25.3
  decision: OLC decides whether federal criminal law’s public-authority justification encompasses the contemplated CIA operation
    against the same target.
  content_domain: intel-oversight
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 4
  focus: The decision point is whether the government must provide further process or refrain from lethal force, or whether
    the represented threat, senior-level review, and infeasibility of capture justify proceeding without it. OLC concludes
    that due process does not require additional process and that the use of force would be reasonable under the Fourth Amendment
    on those facts. Exclude operational planning; focus on the constitutional standard and the balance between the individual’s
    interests and the government’s asserted interests.
  span_range:
  - src:60f8e587db54#p29.2
  - src:60f8e587db54#p31.5
  decision: OLC decides whether the Constitution requires additional process before executive officials may use lethal force
    against the U.S. citizen under the stated circumstances.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
