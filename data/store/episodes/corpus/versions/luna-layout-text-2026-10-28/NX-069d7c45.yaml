- n: 1
  focus: The crew assessed the bird hazard as moderate, and the Operations Supervisor approved the planned ORM before the
    aircraft departed. The mission required low-level night training, described as essential preparation; assess the go/no-go
    risk-acceptance decision, not the flight route or other operational techniques.
  span_range:
  - src:8df133be4cb9#p14.4
  - src:8df133be4cb9#p16.11
  decision: The 56th Rescue Squadron Operations Supervisor decides whether to approve the planned risk assessment and allow
    the night training mission to proceed.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision was whether to begin the mission or withhold approval. The report identifies the supervisor’s authority,
    the low overall ORM rating, and the crew’s documented consideration of moderate bird activity; exclude flight procedures
    and the later accident sequence.
  span_range:
  - src:8df133be4cb9#p35.6
  - src:8df133be4cb9#p40.7
  decision: The 56th Rescue Squadron Operations Supervisor authorized the training mission despite the assessed bird hazard.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision was whether to remain near the original point or relocate; strong winds had pushed the formation toward
    the populated area, and concern about aircraft noise motivated the move. Keep the focus on the command judgment and civilian-noise
    concern, not on the route or flight technique.
  span_range:
  - src:8df133be4cb9#p40.2
  - src:8df133be4cb9#p40.2
  decision: The Flight Lead Pilot moved the formation’s operating point eastward to avoid noise over a populated area.
  content_domain: operational-command
  refusal_sensitivity: low
