episodes:
- n: 1
  focus: The decision point is whether to index incoming FBI reports automatically or require a prior relevance determination
    under the agency’s criteria. The passage explains that routine indexing had produced many generally unevaluated references
    to Americans; exclude the separate question of what reports the FBI should send to the CIA, which is described only as
    a procedure being worked out.
  span_range:
  - src:cb66b0b76002#p3.2
  - src:cb66b0b76002#p3.2
  decision: The CIA Operations Directorate stopped indexing FBI reports on Americans unless an appropriate division or staff
    first determined that the indexing criteria were met.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is how to handle existing file material that does not satisfy current criteria: retain it in
    active files or segregate it for eventual destruction. The stated reason is that the material fails those criteria; exclude
    the operational details of the underlying investigations.'
  span_range:
  - src:cb66b0b76002#p4.2
  - src:cb66b0b76002#p4.2
  decision: The CIA divisions and staffs reviewing existing files on Americans placed material that failed current criteria
    in sealed envelopes, with the stated intention of destroying it after current investigations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue purging material of no current value or suspend that effort during external
    investigations. The report states the suspension and its reason; it does not identify a particular official or explain
    the practical consequences of either course.
  span_range:
  - src:cb66b0b76002#p8.2
  - src:cb66b0b76002#p8.2
  decision: The CIA suspended Office of Security efforts to purge reference indices and impersonal files while the Commission
    and Congress completed their investigations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
