- n: 1
  focus: The decision was to pause new recruitment rather than continue preparing trainees for deployment, while retaining
    existing recruits for possible later recall. The stated reasons were unsettled conditions in Guatemala and saturation
    of training facilities at TRAV; exclude the operational details of training and movement.
  span_range:
  - src:5de60e2ea972#p59.4
  - src:5de60e2ea972#p59.15
  decision: CIA headquarters decided to suspend recruitment of paramilitary ground trainees and keep those already recruited
    on call.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to furnish combat-aircraft and ammunition support or withhold it. The reported reasons
    were that government forces needed air support while pursuing rebels, Guatemalan B-26s were damaged and unfit for flight,
    and the ambassador concurred that support should be provided; exclude aircraft operation and combat tactics.
  span_range:
  - src:5de60e2ea972#p45.7
  - src:5de60e2ea972#p46.6
  decision: The ambassador decided to support transfer of two MADD B-26 aircraft and ammunition to the Guatemalan government.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is the choice of documentation and approval route for releasing the trainers: the Defense official
    was reluctant to have a department representative sign, while the proposed alternative recorded the understanding through
    the Guatemalan ambassador and was accepted as suitable. Focus on the authority and process for proceeding; exclude the
    trainers’ activities and any operational details.'
  span_range:
  - src:5de60e2ea972#p72.3
  - src:5de60e2ea972#p74.8
  decision: The Deputy Secretary of Defense accepted a Guatemalan-ambassador-signed memorandum for the record as the basis
    for proceeding with the special-force trainers, rather than requiring a Defense Department representative to sign the
    agreement.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to intervene to stop the planned use of the Cuban trainees in a domestic rebellion
    or allow their deployment. The account presents the revolt as a purely Guatemalan conflict and describes the ambassador’s
    intervention; exclude aircraft movements and other operational details.
  span_range:
  - src:5de60e2ea972#p87.1
  - src:5de60e2ea972#p88.1
  decision: The U.S. ambassador to Guatemala intervened with the Guatemalan president to prevent Cuban trainees from being
    used against the Guatemalan army revolt and to have them returned to their base.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
