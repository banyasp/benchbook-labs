  natsec: true
- n: 2
  focus: The decision was how much personnel support SAC could commit and where to place it, including whether to meet the
    request for observers at more locations. Focus on resource constraints and SAC's stated purpose of evaluating future participation;
    exclude the observers' exercise-planning work.
  span_range:
  - src:135d17f2bfc8#p10.4
  - src:135d17f2bfc8#p11.2
  decision: HQ SAC chose to provide nine observers at specified headquarters for Able Archer 83, rather than the 14 personnel
    requested, and not to support the additional requested location.
  content_domain: operational-command
