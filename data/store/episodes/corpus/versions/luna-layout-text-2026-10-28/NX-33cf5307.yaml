title: F-16CM AIB Report, South Carolina (July 2015)
collection: usaf-aib
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The controller withheld an advisory for 2–3 minutes while assuming the VFR aircraft would remain below 1,000 feet
    in the airport traffic pattern, then advised the F-16 after the aircraft climbed above that altitude. Frame the choice
    as whether to issue the advisory sooner or wait on that assumption; exclude the technical details of visual search or
    aircraft maneuvering.
  span_range:
  - src:12fda9c5a8e1#p37.1
  - src:12fda9c5a8e1#p37.2
  decision: The mishap controller decided when to advise the F-16 pilot of the VFR aircraft’s presence.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The controller chose an immediate left turn, believing it would deconflict the aircraft more quickly and that the
    F-16 could turn very quickly; the report says those assumptions were wrong and that a right turn or climb would have avoided
    the conflict. Frame the decision around the controller’s safety judgment and the available alternatives, not the mechanics
    of executing a turn.
  span_range:
  - src:12fda9c5a8e1#p37.4
  - src:12fda9c5a8e1#p38.1
  decision: The mishap controller decided to issue an immediate left-turn instruction to the F-16 in response to the potential
    aircraft conflict.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The pilot acknowledged the immediate instruction and began the turn without having the other aircraft in sight. The
    report describes the rule that a pilot may deviate from an ATC direction only to protect life, for safety of flight, or
    in an in-flight emergency, and concludes the pilot had no basis to disregard the instruction; exclude the technical execution
    of the maneuver.
  span_range:
  - src:12fda9c5a8e1#p29.5
  - src:12fda9c5a8e1#p37.10
  decision: The F-16 pilot decided whether to comply with the controller’s immediate left-turn instruction or deviate from
    it for safety.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
