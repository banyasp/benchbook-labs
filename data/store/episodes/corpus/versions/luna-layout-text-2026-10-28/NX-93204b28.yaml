  focus: The President makes a causal finding under a clear-and-convincing-evidence standard, attributing the crash to a brief
    attitude-gyro failure and describing how erroneous inputs led to repeated pitch overcorrection. Treat this as an investigative
    judgment among possible causes; exclude the Mishap Controller’s operational responses during the emergency.
  span_range:
