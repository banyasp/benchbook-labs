- n: 2
  focus: The Vice Commander approves the report after determining that it complies with applicable regulatory and statutory
    guidance. Treat this as an administrative/legal review decision; exclude the underlying flight-control and accident-response
    decisions.
  span_range:
  - src:126b17a3079e#p1.10
  - src:126b17a3079e#p1.11
  decision: The ACC Vice Commander decides whether to approve the accident investigation report.
