  natsec: false
- n: 3
  focus: The decision point is the MC’s fitness-to-fly judgment in light of limited sleep. The report says he believed his
    alertness was unaffected and the MMC observed no symptoms; it also notes proper crew-rest opportunity. Exclude the later
    aircraft-control decisions and the general medical-oversight concern, which do not document a specific policy choice and
    outcome.
  span_range:
  - src:126b17a3079e#p1.273
  - src:126b17a3079e#p1.275
  decision: The Mishap Controller decided whether to voluntarily disqualify himself from flying after sleeping 4½ hours; he
    flew the mission.
