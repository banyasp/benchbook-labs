  focus: The author rejects the standard, broad secrecy oath as incompatible with freedom to publish, but negotiates a narrower
    agreement covering CIA-sourced material and proceeds. The decision weighs access to records against publication independence
    and the risk of censorship; exclude the historical operations being researched.
