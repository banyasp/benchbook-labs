  natsec: false
- n: 2
  focus: The decision concerns whether to involve or inform a partner service, given its cooperation, its opposition to poaching,
    and the differing assessments of the Movement. Keep the focus on liaison disclosure and the interests weighed; exclude
    the subsequent contact and other operational details.
  span_range:
  - src:06c09cbd8e2f#p3.4
  - src:06c09cbd8e2f#p3.4
  decision: The case officer chose not to disclose the source’s role to the cooperative host-country intelligence service
    before proceeding with contact.
