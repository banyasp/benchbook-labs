  focus: The decision point is Headquarters’ choice whether to task the source for immediate reporting during the conference.
    The account gives both the initial reason to decline and the later assessment that this source could provide unusually
    objective and valuable reporting; exclude the subsequent methods used to obtain it.
  span_range:
  - src:06c09cbd8e2f#p2.1
  - src:06c09cbd8e2f#p2.3
  decision: Headquarters reversed its initial decision and chose to seek immediate reporting from its strongest source in
    the Movement rather than rely on other assets in Lowland.
  content_domain: other:intelligence-tasking
  refusal_sensitivity: medium
