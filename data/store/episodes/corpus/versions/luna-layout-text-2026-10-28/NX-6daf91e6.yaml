episodes:
- n: 1
  focus: The committee’s concrete analytic choice is whether to assess deliberate Soviet action against the West as likely
    or improbable; it concludes such action is improbable while warning that miscalculation could still cause an unintended
    outbreak. Include the stated evidence and uncertainty behind this estimate, but exclude operational military planning
    or any decision to use force.
  span_range:
  - src:d280050aa8d1#p37.6
  - src:d280050aa8d1#p37.9
  decision: The Joint Ad Hoc Committee decides its estimate of the likelihood that the USSR will resort to direct military
    action during 1949.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the strategic allocation of French forces and equipment to the Indochina campaign rather than
    retaining them in Europe or North Africa. The passage gives French reasons—securing the China-Indochina border and stabilizing
    Southeast Asia—and identifies costs to Western Union, France’s recovery, and US interests; exclude any operational details
    of the campaign.
  span_range:
  - src:d280050aa8d1#p44.5
  - src:d280050aa8d1#p45.2
  decision: French authorities chose to divert manpower and materiel from forces in French-occupied Germany and North Africa
    to an autumn campaign against Communist-led rebels in northern Indochina.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is the Kremlin’s response to the CFM meeting: continue the partition and avoid a more confrontational
    push for German unification, while leaving room for later negotiations. The analysis gives reasons tied to anticipated
    Western economic weakness and the risk that a more truculent stance would strengthen Western unity; exclude other predictions
    about Soviet negotiating proposals not described as chosen.'
  span_range:
  - src:d280050aa8d1#p49.4
  - src:d280050aa8d1#p49.5
  decision: The Soviet leadership chose to preserve the status quo in Germany while keeping the Council of Foreign Ministers
    negotiating channel open.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the USSR’s change of position on Jerusalem and its support for internationalization. The passage
    attributes motives including gaining a direct voice in the area and encouraging instability, and links the shift to stronger
    US-Israeli ties; exclude broader Soviet policy toward Palestine except where it explains this choice.
  span_range:
  - src:d280050aa8d1#p72.5
  - src:d280050aa8d1#p72.5
  decision: The Soviet leadership chose to support internationalization of Jerusalem rather than continue supporting Israel
    on that issue.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to publish a timely, candid estimate with agency disagreements included or delay publication
    while seeking consensus. CIA cited the importance of the subject, the lack of prospect for early agreement, and the value
    of presenting a clear view alongside contrary opinions; exclude the estimate’s substantive judgments about Soviet intentions
    and US policy.
  span_range:
  - src:d280050aa8d1#p94.4
  - src:d280050aa8d1#p94.5
  decision: CIA decided to publish the Soviet atomic-bomb estimate as an interim report rather than wait for agreement among
    the intelligence agencies.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to retain ORE 91-49 or withdraw it and use JIC 502, given the Army intelligence office’s
    view that the assessments diverge too sharply for the current paper to resolve them. Keep the stated concerns about minimizing
    the Soviet threat, omitting atomic considerations, and obscuring conclusions; exclude operational military planning.
  span_range:
  - src:d280050aa8d1#p104.3
  - src:d280050aa8d1#p104.5
  decision: The Assistant Chief of Staff, G-2 recommends withdrawing ORE 91-49 and substituting JIC 502 as the basis for resolving
    differences in intelligence assessments.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: 'The decision point is which analytic basis to use: inferences from Communist doctrine and Russian history, or a
    contemporaneous assessment of strategic advantage. The passage concludes there is no evidence of a present Soviet determination
    to use force, while warning that atomic capability may change the calculation; exclude any operational use of military
    forces.'
  span_range:
  - src:d280050aa8d1#p102.7
  - src:d280050aa8d1#p103.5
  decision: The Intelligence Organization of the Department of State assesses Soviet intentions to use military force by whether
    force would appear advantageous to the Soviet Union at the time.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
