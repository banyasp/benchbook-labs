- n: 1
  focus: In 1971, younger committee members were demanding reforms, and the chair chose a younger member who had their confidence
    to forestall trouble. Focus on the oversight-structure decision and its rationale, not the appointee’s biography or later
    work.
  span_range:
  - src:d581fa4128c1#p18.2
  - src:d581fa4128c1#p18.3
  decision: The House Armed Services Committee chair decides whether to preserve the existing seniority-based arrangement
    or appoint a younger member to chair the Intelligence Subcommittee.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: As the program expanded and became increasingly visible, the Agency recognized the committee’s interest and briefed
    members beginning in 1962. Focus on the oversight and disclosure choice; exclude the conduct or details of the covert
    program itself.
  span_range:
  - src:d581fa4128c1#p7.4
  - src:d581fa4128c1#p8.2
  decision: CIA officials decide whether to maintain plausible denial of the Laos program or brief members of the Senate Foreign
    Relations Committee.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: After allegations and suspicions began circulating, the chair insisted they be explained or investigated and launched
    an intensive inquiry. Focus on the oversight decision and its findings; exclude operational details unrelated to the inquiry.
  span_range:
  - src:d581fa4128c1#p19.2
  - src:d581fa4128c1#p19.3
  decision: The House Armed Services Intelligence Subcommittee chair decides whether to investigate the Watergate allegations
    concerning the Agency or leave them unresolved.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: During the chair’s get-acquainted briefings, the Agency answered his questions and made highly sensitive material
    available. Focus on disclosure to an oversight chair and its implications for accountability and credibility; exclude
    the substantive operational information disclosed.
  span_range:
  - src:d581fa4128c1#p18.4
  - src:d581fa4128c1#p20.1
  decision: CIA officials decide whether to answer the new Intelligence Subcommittee chair’s questions fully and provide access
    to sensitive material or limit disclosure.
  content_domain: intel-oversight
