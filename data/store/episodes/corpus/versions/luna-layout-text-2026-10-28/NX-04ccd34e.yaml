- n: 2
  focus: The decision point is whether to authorize this agent’s contribution to deception, balancing the value of the contribution
    against the risk to Allied operations. Exclude the specific deceptive content and methods of transmitting it.
  span_range:
  - src:e3d426a2db0e#p5.3
  - src:e3d426a2db0e#p5.4
  decision: The 212 Committee approves Frutos’s participation in deception while restricting information that could endanger
