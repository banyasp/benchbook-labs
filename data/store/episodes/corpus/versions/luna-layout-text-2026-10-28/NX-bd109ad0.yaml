- n: 2
  focus: The decision point is whether to abandon the meeting or set another meeting for the following day. The French President
    relies on the Soviet leader’s prior assurances that the conference should proceed, notes that the new condition is impossible
    for the President of the United States to accept, and invokes the hopes placed in the meeting by the world’s people. Exclude
    the later procedural dispute over written communications.
  span_range:
  - src:cb5fa3b10c4b#p3.5
  - src:cb5fa3b10c4b#p4.1
  decision: The French President decides to reconvene the summit the next day despite the Soviet leader’s threat not to attend.
