  focus: 'The decision point is the President of the United States’ diplomatic response to the demand: apologize or refuse
    while trying to mollify the Soviet leader. The account cites the President’s responsibility to assess the Soviet threat
    and the delegation’s resolve not to permit public humiliation. Keep the focus on the diplomatic choice; exclude the operational
    details or merits of intelligence collection.'
