- n: 1
  focus: The Bureau told the informant that the offer was outside its jurisdiction, made no commitment, and did not plan further
    pursuit. Focus on the Bureau’s choice about its authority and response to the offer; exclude any operational details of
    an assassination attempt.
  span_range:
  - src:4aea3550ca92#p16.2
  - src:4aea3550ca92#p16.2
  decision: The FBI decided not to pursue an informant’s offer to arrange an assassination attempt against the Cuban leader.
  content_domain: intel-oversight
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The committee judged that the Cuban government would not risk a major confrontation with the United States and regarded
    attacks on U.S. officials at home as unlikely; it assigned no agency to that contingency. Focus on the committee’s risk
    judgment and contingency-planning choice, not on operational responses to any attack.
  span_range:
  - src:4aea3550ca92#p21.1
  - src:4aea3550ca92#p22.2
  decision: The Cuban Coordinating Committee decided not to treat attacks on U.S. officials inside the United States as a
    likely retaliation contingency or assign an agency responsibility for it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The committee could have withheld its findings, but chose to make them public because its investigation could not
    reach a final resolution and the public had a right to know how intelligence agencies fulfilled their responsibilities.
    Focus on the disclosure decision and its stated justification; exclude speculation about unresolved findings.
  span_range:
  - src:4aea3550ca92#p12.2
  - src:4aea3550ca92#p13.1
  decision: The Select Committee decided to make its findings public despite being unable to resolve outstanding questions,
    citing the public’s right to know.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The passage describes the choice to leak rather than keep the report confidential, and attributes the purpose to
    blunting the drive for an independent investigation. Focus on the integrity of the Bureau’s public handling of the investigation;
    exclude the underlying assassination allegations as a separate decision point.
  span_range:
  - src:4aea3550ca92#p40.2
  - src:4aea3550ca92#p41.1
  decision: The FBI Director chose to leak information about the Bureau’s preliminary report to the press to blunt support
    for an independent investigation.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The choice was between acting immediately and holding discipline in abeyance to avoid a leak or the public interpreting
    discipline as an admission of negligence. The Director rejected delay, reasoning that gross incompetence could not be
    overlooked; exclude the underlying investigative techniques.
  span_range:
  - src:4aea3550ca92#p56.1
  - src:4aea3550ca92#p57.1
  decision: The FBI Director decided to proceed with disciplinary action against employees for shortcomings in the pre-assassination
    Oswald investigation rather than defer action until the Warren Commission reported.
  content_domain: other:agency accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The choice was whether to proceed with further discipline or avoid it because the Commission’s criticism was public
    and discipline might be seen as confirming the criticism. The Director chose to proceed, saying the Bureau was wrong and
    he would not palliate actions that damaged it; exclude the merits of the underlying investigative steps.
  span_range:
  - src:4aea3550ca92#p59.2
  - src:4aea3550ca92#p61.1
  decision: After the Warren Commission report, the FBI Director decided to stand by further administrative action against
    personnel despite advice that it could worsen the Bureau’s public position.
  content_domain: other:agency accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: 'The decision point is the agency’s investigative priority: pursue possible pro-Castro or anti-Castro connections
    or leave the inquiry largely to other agencies and pass along information as it arose. Witnesses cited the FBI’s primary
    responsibility and the absence of hard information implicating Cubans. Keep the scenario at this policy level and exclude
    collection methods or operational details.'
  span_range:
  - src:4aea3550ca92#p64.1
  - src:4aea3550ca92#p65.1
  decision: The CIA investigators responsible for the assassination inquiry chose a passive posture toward possible Cuban
    involvement rather than affirmatively pursuing that line.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The choice was whether to employ investigators beyond the Commission’s legal staff or rely on federal and state agencies.
    The Commission’s stated rationale was the diligence, cooperation, and facilities of those agencies, although the passage
    notes that the Commission consequently depended heavily on intelligence agencies for facts and preliminary analysis. Exclude
    any operational investigative methods.
  span_range:
  - src:4aea3550ca92#p51.2
  - src:4aea3550ca92#p52.2
  decision: The Warren Commission decided that its legal staff would conduct the inquiry without hiring outside investigators,
    relying instead on investigative agencies for factual material and follow-up.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: After the Secret Service forwarded the allegation, the FBI chose not to investigate, relying on the Bureau’s prior
    investigation and a Domestic Intelligence Division assessment that found no evidence of Cuban-government involvement.
    Focus on the decision to investigate or decline further inquiry and the stated basis; exclude the underlying assassination
    plots and investigative methods.
  span_range:
  - src:4aea3550ca92#p86.2
  - src:4aea3550ca92#p88.1
  decision: FBI senior officials decide not to open an investigation into the allegation that Castro retaliated for U.S. assassination
    efforts.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: In 1965, the CIA chose to terminate the operation rather than continue contact after concluding that the group’s
    insecurity made further contact a menace to CIA operations. Focus on the decision whether to continue the intelligence
    activity and its stated security rationale; exclude operational details of the plot.
  span_range:
  - src:4aea3550ca92#p84.2
  - src:4aea3550ca92#p84.2
  decision: CIA officials decide to terminate the AMLASH operation after receiving information that the group was insecure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to brief the President on those phases, which the CIA Inspector General’s report treated
    as an assassination operation. The source says the Director did not brief the President because he did not regard AMLASH
    as an assassination agent; exclude operational details of the project.
  span_range:
  - src:4aea3550ca92#p92.1
  - src:4aea3550ca92#p92.1
  decision: The CIA Director chose not to brief the President on the 1964 and 1965 phases of the AMLASH project.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The decision point is whether to preserve or destroy records after the assassination. An agent testified that the
    supervisor ordered their destruction, while another account attributed the agent’s action to avoiding embarrassment to
    the Bureau; the source also records conflicting testimony about the order and the supervisor’s knowledge.
  span_range:
  - src:4aea3550ca92#p103.1
  - src:4aea3550ca92#p103.3
  decision: The Dallas field-office supervisor allegedly ordered the destruction of the Oswald note and a related memorandum.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
