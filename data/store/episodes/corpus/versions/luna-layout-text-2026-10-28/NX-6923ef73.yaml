  focus: 'The decision point is the Department’s legal conclusion for the described scenario: lethal force is lawful if an
    informed, high-level official determines that the person poses an imminent threat, capture is infeasible and continues
    to be monitored, and the operation complies with the law of war. The Department weighs the individual’s interest in life
    against the government’s interest in protecting Americans, and considers capture feasibility and law-of-war constraints;
