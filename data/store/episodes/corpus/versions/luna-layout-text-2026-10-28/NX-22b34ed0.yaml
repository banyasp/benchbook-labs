  focus: The passage attributes the removal order to concern that Hitler could use evidence of the networks as a pretext to
    attack the Soviet Union. Treat this as a strategic decision about whether to maintain the networks amid escalation risk;
    exclude the networks’ operational methods.
  span_range:
  - src:1ab9e1224e41#p1.21
  - src:1ab9e1224e41#p1.25
  decision: Soviet leadership decides whether to remove its intelligence networks from Germany rather than leave them in place.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The counsel’s sentencing argument gives reasons including deterrence, peacetime context, proportionality, and possible
    future prisoner exchange; the court ultimately imposed prison terms. Keep the decision point on sentencing advocacy and
    the legal and national interests raised, not on treating counsel’s arguments as the court’s stated rationale.
  span_range:
  - src:1ab9e1224e41#p1.52
  - src:1ab9e1224e41#p1.63
  decision: Defense counsel decides to argue that the sentencing court should impose imprisonment rather than death on the
    convicted foreign intelligence officer.
