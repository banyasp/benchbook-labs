episodes:
- n: 1
  focus: The decision point is whether to concentrate authority in NSA or preserve component-level authority under an advisory
    central capability. Focus on the stated concerns about NSA’s authority and influence over other components and the Privacy
    Act; exclude the later creation of the evaluation center.
  span_range:
  - src:1e3f823ac30b#p1.45
  - src:1e3f823ac30b#p1.51
  decision: The Assistant Secretary of Defense (Comptroller) declined to make NSA the central technical authority for DoD
    computer security, leaving the central capability advisory and evaluation authority with DoD components.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to locate the center with NSA or the National Bureau of Standards, and whether to approve
    the NSA project-management-office proposal despite concerns about working relationships. Consider the expertise, interagency
    trust, budget, and standards concerns described in the passage; exclude technical evaluation procedures.
  span_range:
  - src:1e3f823ac30b#p1.61
  - src:1e3f823ac30b#p1.76
  decision: The Deputy Secretary of Defense approved assigning NSA responsibility for a DoD computer security evaluation center
    organized as a project management office.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether NSA should retain the broad federal role established by NSDD-145 or whether standards
    for sensitive but unclassified federal systems should be assigned to the National Bureau of Standards with NSA collaboration.
    Focus on the stated concerns about military influence in civilian computer security; exclude implementation details of
    the standards.
  span_range:
  - src:1e3f823ac30b#p1.104
  - src:1e3f823ac30b#p1.110
  decision: Congress transferred responsibility for standards protecting federal sensitive-but-unclassified information technology
    to the National Bureau of Standards, requiring it to work with NSA.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to continue using the TCSEC or transition to shared international criteria. The passage
    cites the old criteria’s rigidity, limited scope, lengthy and expensive evaluations, and vendors’ preference for international
    criteria; exclude technical details of the criteria themselves.
  span_range:
  - src:1e3f823ac30b#p1.119
  - src:1e3f823ac30b#p1.123
  decision: NSA, NIST, and partner governments adopted the Common Criteria to replace the Trusted Computer System Evaluation
    Criteria.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
