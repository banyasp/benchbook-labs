- n: 3
  focus: The choice was between the prior directorate-based structure and corporate-level centralization. The passage says
    the prior arrangement produced opaque, inconsistent decisions and lengthy disputes, while centralization would strengthen
    the information-management chief’s ability to ensure searches and decisions were adequate, timely, transparent, and credible.
  span_range:
  - src:8f43356c0b9c#p17.1
  - src:8f43356c0b9c#p17.2
  decision: CIA leadership decided to centralize declassification review and release programs at the corporate level.
