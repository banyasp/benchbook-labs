- n: 2
  focus: The choice was whether to release these historical records or continue protecting them as classified; the stated
    outcome was preparation to release most of them. The passage weighs public and historical understanding, the records’
    age and prior press coverage against the need to protect sources, methods, and ongoing relationships; exclude any operational
    details contained in the records.
  span_range:
