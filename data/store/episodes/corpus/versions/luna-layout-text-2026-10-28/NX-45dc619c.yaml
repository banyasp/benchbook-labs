  focus: The choice was to leave the staff in its existing structure or give it a more central position under the Deputy Director
    for Intelligence. The stated reasons were the staff’s role in providing evidence of the Sino-Soviet split, despite opposition,
    and the aim of freeing analysts from current-production deadlines and restrictive review; exclude the operational content
    of the studies themselves.
