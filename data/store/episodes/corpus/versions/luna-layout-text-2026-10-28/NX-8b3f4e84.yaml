episodes:
- n: 1
  focus: The decision point is the President’s choice to establish a centralized coordinating structure rather than leave
    foreign-intelligence activities solely within separate departments; the stated aim is the most effective accomplishment
    of the national-security intelligence mission. Keep the focus on institutional authority and coordination, not on intelligence-collection
    techniques.
  span_range:
  - src:4215a7139148#p1.2
  - src:4215a7139148#p1.3
  decision: The President decides to place federal foreign-intelligence coordination under a National Intelligence Authority,
    supported by a Central Intelligence Group and Director of Central Intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is allocating responsibility for specified functions to the Director rather than leaving them
    distributed among departments; the directive says central performance can be more efficient. Treat this only as a decision
    about authority and organization, and exclude any methods or operational details.
  span_range:
  - src:4215a7139148#p6.29
  - src:4215a7139148#p7.10
  decision: The National Intelligence Authority decides to centralize specified federal foreign-intelligence functions under
    the Director of Central Intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
