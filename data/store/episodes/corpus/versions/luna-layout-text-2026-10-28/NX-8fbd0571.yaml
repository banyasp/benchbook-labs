episodes:
- n: 1
  focus: The decision point is whether to preserve OSS as a permanent intelligence organization or liquidate it while transferring
    selected functions to existing departments. The passage cites postwar demobilization, OSS’s status as a wartime agency,
    and concerns raised about its organization; exclude later efforts to reassemble intelligence capabilities.
  span_range:
  - src:e3759322cb4f#p2.3
  - src:e3759322cb4f#p3.5
  decision: The President chose to dissolve OSS, transfer its Research and Analysis Branch to the State Department, and send
    the remainder to the War Department.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the disposition of OSS’s remaining intelligence functions while the government considered a
    permanent peacetime arrangement. The stated rationale was to preserve functions and facilities with potential future value
    pending review; exclude the conduct of intelligence or counterespionage operations.
  span_range:
  - src:e3759322cb4f#p4.5
  - src:e3759322cb4f#p5.4
  decision: The Assistant Secretary of War chose to preserve OSS’s intelligence and counterespionage components together as
    the Strategic Services Unit rather than liquidate or absorb them into Army intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is how to organize central intelligence and allocate oversight amid competing departmental proposals.
    The passage says the Joint Chiefs’ plan appeared simpler and more workable, while the services resisted State Department
    control; exclude the later conduct of clandestine activities.
  span_range:
  - src:e3759322cb4f#p6.3
  - src:e3759322cb4f#p7.5
  decision: The President chose the Joint Chiefs’ proposed framework for a Central Intelligence Group over a State Department-led
    arrangement, establishing the Group under the National Intelligence Authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
