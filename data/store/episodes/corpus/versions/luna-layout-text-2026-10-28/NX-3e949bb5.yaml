- n: 2
  focus: The decision arose from a congressional investigation into funds used in connection with the Ashburton agreement.
    The passage gives the statutory basis and the President’s reasons for withholding details; exclude the underlying publicity
    activity as operational conduct.
  span_range:
  - src:a2e531b318d3#p6.2
  - src:a2e531b318d3#p6.3
