  natsec: true
- n: 3
  focus: The widows of civilian observers sought information about a fatal military-aircraft crash, while the Air Force claimed
    the material concerned a secret mission and could not be disclosed without harming national security. The decision point
    is whether to compel disclosure or uphold the privilege; exclude technical details of the equipment or mission.
  span_range:
  - src:a2e531b318d3#p10.2
  - src:a2e531b318d3#p10.2
  decision: The Supreme Court decides whether to require the Air Force to disclose information sought in a damages suit; it
    accepts the Air Force’s claim of privilege.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The dispute arose during a criminal prosecution involving a false report to government agencies, and the employee
    was held in contempt after refusing the court’s order. The passage describes the competing confidentiality claim and the
    court’s reasons for rejecting it; exclude details of intelligence collection or informant handling.
  span_range:
  - src:a2e531b318d3#p10.3
  - src:a2e531b318d3#p11.2
  decision: The trial court decides whether a CIA employee must answer questions after the Agency directs him not to testify;
