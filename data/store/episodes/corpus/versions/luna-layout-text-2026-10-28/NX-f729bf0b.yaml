  focus: The decision point is whether to lodge a formal protest or take no such diplomatic action, after the War Crimes Bureau
    recommended a protest and the Foreign Office agreed. The stated reason was the allegation that POWs had been compelled
    to work under artillery fire, which the Bureau considered a serious violation of the 1929 POW Convention; treat the facts
    as allegations, and exclude the general description of Protecting Power communications and operational details of the
    work.
