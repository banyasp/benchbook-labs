  natsec: true
- n: 2
  focus: The DCI-designate could decline the nomination, which carried serious professional and political costs, or accept
    it as a call to public service. The account describes his concerns about the agency and his political future, and his
    stated reason for accepting; exclude unrelated details about his diplomatic service.
  span_range:
  - src:a32a971e4b90#p4.3
  - src:a32a971e4b90#p4.4
  decision: The DCI-designate decides whether to accept the President’s nomination to lead the CIA.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The DCI-designate could pledge to forgo a possible future candidacy to reassure senators about his impartiality,
    or oppose making that pledge a condition of confirmation. He objected that a call to future public service should not
    bar confirmation, while stating he would not pursue the vice presidency while serving as DCI; exclude speculation about
    whether he might later be selected.
  span_range:
  - src:a32a971e4b90#p7.3
  - src:a32a971e4b90#p7.5
  decision: The DCI-designate decides whether to make confirmation conditional on renouncing a possible vice-presidential
    candidacy.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: After confirmation hearings deadlocked amid concern that the nominee might leave for a campaign, the President could
    maintain his earlier position or pledge to exclude the nominee from running-mate consideration. The account says he made
    the pledge to avoid a confirmation setback while trying to retain a trusted nominee; exclude the wider electoral campaign
    narrative.
  span_range:
  - src:a32a971e4b90#p8.3
  - src:a32a971e4b90#p8.5
  decision: The President decides to pledge that he will not consider the DCI-designate as his 1976 vice-presidential running
    mate.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
