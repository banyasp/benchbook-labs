- n: 1
  focus: The President could retain the incumbent or choose another successor, but ultimately nominated the ambassador despite
    concerns that his political background could undermine confidence in the CIA’s impartiality. Focus on the President’s
    choice, confidence in the nominee, and the need for a trusted leadership team; exclude the broader account of the administration’s
    personnel changes.
  span_range:
