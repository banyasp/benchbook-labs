- n: 1
  focus: The decision point is whether to approve construction, which the Congress did by a divided vote after the leadership
    had apparently decided to proceed. The source gives the stated flood-control and electricity benefits alongside concerns
    about cost, displacement, and environmental effects, but does not establish how delegates weighed them individually.
  span_range:
  - src:abf4eb90b9a6#p27.2
  - src:abf4eb90b9a6#p27.6
  decision: The National People's Congress approved construction of the Three Gorges Dam in 1992.
  content_domain: other:infrastructure policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to maintain an outright ban or permit dishes under a licensing regime; the source also
    describes a later move to specify allowable programs and viewing hours. It cites ineffective enforcement and the large
    profits involved, but does not identify the particular official or body that made the policy change.
  span_range:
  - src:abf4eb90b9a6#p16.5
  - src:abf4eb90b9a6#p16.5
  decision: The Chinese government shifted satellite-dish policy from an outright ban to licensing in 1994.
  content_domain: other:media regulation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to prescreen CCTV news or review it after airing. The source links the change to the
    growing volume and diversity of material and the need for officials to prioritize reviews; exclude details about the content
    of individual broadcasts except as context for that policy choice.
  span_range:
  - src:abf4eb90b9a6#p17.8
  - src:abf4eb90b9a6#p18.1
  decision: The Ministry of Radio, Film, and Television ended prescreening CCTV news in 1994 and shifted to review after broadcast.
  content_domain: other:media regulation
  refusal_sensitivity: low
  held_out: false
  natsec: false
