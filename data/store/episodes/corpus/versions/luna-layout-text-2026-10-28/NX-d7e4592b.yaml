episodes:
- n: 1
  focus: The intelligence panel judged the Saigon government’s prospects extremely grim and sustained attacks unlikely to
    break Hanoi’s will; the Joint Staff representative rejected that assessment and argued that force could compel Hanoi to
    withdraw support for the insurgency. The president delayed the commitment until after the 1964 elections, then chose sustained
    action. Keep this at the level of the policy choice to use force; exclude bombing methods, targets, and operational planning.
  span_range:
  - src:798e40966bca#p19.2
  - src:798e40966bca#p19.3
  decision: The president decided to commit to sustained military action against North Vietnam, leading to Operation ROLLING
    THUNDER.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: After intensified attacks failed to make Hanoi back down, the Secretary questioned whether DIA could provide an independent
    assessment, believing interested parties viewed operations too optimistically. The source says he requested a separate
    CIA evaluation, while also noting that DIA analysts had already expressed doubts and coordinated with CIA; exclude the
    operational details of the bombing campaign.
  span_range:
  - src:798e40966bca#p21.3
  - src:798e40966bca#p21.5
  decision: The Secretary of Defense decided to have the CIA independently evaluate the bombing campaign and report directly
    to him.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The estimate dispute concerned whether these forces belonged in the enemy combatant total. MACV argued they were
    difficult to distinguish reliably and that many members were unarmed civilians with little military capability; excluding
    them also affected the reported total and the credibility of the claimed crossover point. The source describes conflicting
    analytic judgments and a disputed definition, so do not present deliberate manipulation as established fact.
  span_range:
  - src:798e40966bca#p24.3
  - src:798e40966bca#p25.2
  decision: MACV leadership decided to exclude the NLF self-defense and secret self-defense forces from its enemy order-of-battle
    estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The passage describes DIA’s dependence on MACV-screened intelligence and the Director’s effort to avoid conflict,
    despite the Agency’s managerial responsibility and analysts’ independent position. Focus on institutional authority, analytic
    independence, and the consequences of deference; exclude the mechanics of intelligence processing.
  span_range:
  - src:798e40966bca#p26.6
  - src:798e40966bca#p27.3
  decision: The DIA Director chose whether to assert an independent DIA position on enemy order-of-battle estimates or defer
    to MACV’s reporting.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The Director presented evidence on both sides, recommended proceeding, and the Joint Chiefs and Secretary of Defense
    advised the President to go forward; the President ordered the operation. Focus on the decision under uncertainty and
    the stated interests, including the desire for a public-relations victory and to send a message to Hanoi; exclude operational
    planning and execution.
  span_range:
  - src:798e40966bca#p35.4
  - src:798e40966bca#p36.3
  decision: The President chose whether to proceed with the Son Tay rescue operation despite conflicting intelligence about
    whether prisoners remained at the camp.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 6
  focus: The May 1974 estimate records DIA’s dissent from the more optimistic community judgment, and the passage gives the
    analysts’ warning about a major offensive. Focus on the evidentiary judgment and the choice to dissent; exclude any operational
    response to the warning.
  span_range:
  - src:798e40966bca#p42.2
  - src:798e40966bca#p42.3
  decision: DIA analysts chose whether to dissent from the community’s assessment that a full-scale North Vietnamese invasion
    in early 1975 was unlikely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The passage identifies the formal request, the worsening crisis, and the President’s order to evacuate the children.
    Focus on the humanitarian and policy decision to initiate the evacuation; exclude the aircraft loading and other operational
    arrangements.
  span_range:
  - src:798e40966bca#p43.3
  - src:798e40966bca#p43.4
  decision: The President chose to order an evacuation of Vietnamese war orphans after South Vietnam requested their immediate
    removal.
  content_domain: other:humanitarian-evacuation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The attaché began preparations in March, contrary to the Ambassador’s wishes, and accelerated them as North Vietnamese
    forces advanced toward Saigon. Focus on the choice to prepare early despite diplomatic concerns about signaling reduced
    U.S. commitment; exclude the mechanics of evacuation and later airlift operations.
  span_range:
  - src:798e40966bca#p44.3
  - src:798e40966bca#p44.5
  decision: The defense attaché chose to begin evacuation preparations despite the Ambassador’s opposition to evacuation planning.
  content_domain: other:evacuation-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is whether to authorize force after the Khmer Rouge refused to release the ship and crew; the
    President chose authorization, citing the desire to avoid a repeat of the Pueblo incident. Keep the focus on the authority
    and policy choice, and exclude the subsequent assault’s operational planning and execution.
  span_range:
  - src:798e40966bca#p46.9
  - src:798e40966bca#p47.2
  decision: The President authorized the use of force to recover the Mayaguez and its crew.
  content_domain: targeting
