  natsec: true
- n: 2
  focus: The decision point is whether to continue trying to recover the aircraft or prioritize the pilot’s safety by ejecting.
    The report links the choice to unsuccessful restart attempts and reaching the minimum controlled-ejection altitude; exclude
    the procedural details of the restart and ejection.
  span_range:
  - src:8a35683bc90b#p11.3
  - src:8a35683bc90b#p11.4
  decision: The mishap pilot chose to eject after restart attempts failed and the aircraft reached the minimum controlled-ejection
    altitude.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The maintenance manual left it to the technician to decide when covering was applicable, and a witness said he had
    never found masking necessary. Frame this as a decision about applying ambiguous maintenance policy; exclude instructions
    on how to perform the cleaning or masking.
