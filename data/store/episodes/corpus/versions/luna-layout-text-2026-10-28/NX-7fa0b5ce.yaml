  focus: The pilot could see both fields and assessed Volk as the nearest suitable runway, then turned toward it. Keep the
    scenario focused on this emergency destination choice and its stated basis; exclude the flight procedures used while attempting
    recovery.
  span_range:
  - src:8a35683bc90b#p11.2
  - src:8a35683bc90b#p11.3
  decision: The mishap pilot chose to divert toward Volk Airfield rather than Truax Field.
  content_domain: operational-command
  refusal_sensitivity: low
