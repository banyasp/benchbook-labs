  focus: The doctrine directs a response that imposes costs and denies benefits if tailored deterrence fails, with the aim
    of clarifying NATO’s understanding, will, means, and the threshold for armed conflict. Focus on this policy choice and
    its rationale; exclude operational methods for carrying out a response.
  span_range:
