episodes:
- n: 1
  focus: The President’s advisers were divided between accepting the military status quo and pressing for a settlement backed
    by a possible rollback of Serb gains; the President chose the latter course. Focus on the policy choice, its stakes for
    U.S. and allied leadership, and the stated risk of a quagmire; exclude operational details of any military action.
  span_range:
  - src:47b37234ef71#p15.3
  - src:47b37234ef71#p16.2
  decision: 'The President chooses a hard-line Bosnia policy: pursue a unified Bosnia in negotiations and, if negotiations
    fail, support the Bosnians on the battlefield.'
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The choice was whether to grant the Serbian leader’s request for sanctions relief before negotiations or preserve
    sanctions as leverage. The account says officials held firm because sanctions relief could help secure compliance; exclude
    negotiating tactics beyond this policy choice.
  span_range:
  - src:47b37234ef71#p17.3
  - src:47b37234ef71#p17.5
  decision: The President and senior U.S. officials decide to withhold sanctions relief until an agreement is reached and
    implemented.
  content_domain: other:sanctions-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The President chose non-enforcement despite the existing embargo and pressure to lift it outright. The passage cites
    congressional support and renewed Serb aggression as reasons; exclude any operational methods of enforcement or non-enforcement.
  span_range:
  - src:47b37234ef71#p11.5
  - src:47b37234ef71#p11.5
  decision: The President decides that the United States will no longer enforce the arms embargo in Bosnia.
  content_domain: other:arms-embargo-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The President faced public and congressional opposition to deployment, while the peace plan called for an international
    force to supervise its implementation. He justified deployment as serving U.S. strategic interests and fundamental values,
    with a limited, achievable mission and most forces supplied by other countries; exclude troop employment details.
  span_range:
  - src:47b37234ef71#p12.3
  - src:47b37234ef71#p13.3
  decision: The President decides to send U.S. troops to help implement the Dayton peace plan.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to move to military intervention or first exhaust other options; the committee was
    reluctant to recommend intervention, and the military briefing described high expected civilian casualties and other serious
    costs. Treat this as a policy decision about whether to use force, not as a decision about strike targets or military
    methods.
  span_range:
  - src:47b37234ef71#p23.13
  - src:47b37234ef71#p40.3
  decision: The NSC Principals Committee chose to defer recommending military intervention in Bosnia while other policy options
    remained.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is how much aid to deliver and what supplies to prioritize in light of projected winter conditions,
    combat intensity, and civilian needs. Exclude the mechanics of transporting supplies; focus on the policy trade-offs and
    the scenario analysis that informed the decision.
  span_range:
  - src:47b37234ef71#p24.3
  - src:47b37234ef71#p25.2
  decision: The Deputies Committee decided to double the humanitarian airlift and change the mix of supplies for Bosnia.
  content_domain: other:humanitarian policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is whether to continue considering airstrikes when a report suggested shelling that could justify
    them, or halt that discussion after the report was checked. Focus on the evidentiary basis for the policy decision; exclude
    any targeting or strike-planning details.
  span_range:
  - src:47b37234ef71#p29.3
  - src:47b37234ef71#p29.4
  decision: The NSC halted discussion of airstrikes after the BTF reported that the allegation of Serbian shelling was inaccurate.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to withdraw on the initially anticipated timetable or extend the presence while Dayton
    provisions remained incomplete. The source says an intelligence memorandum advocating flexibility and assessing positive
    trends influenced the extension; do not infer additional reasons or authorities beyond the passage.
  span_range:
  - src:47b37234ef71#p31.2
  - src:47b37234ef71#p31.4
  decision: Senior U.S. policymakers decided to extend the U.S. military presence in Bosnia rather than bring the forces home
    on the expected schedule.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The passage recommends an intensive settlement effort this year, including greater flexibility on the map and constitutional
    arrangements and new inducements, instead of allowing withdrawal and a potentially protracted transition to dominate policy.
    Focus on the strategic choice and its stated rationale; exclude the operational details of any later withdrawal or military
    campaign.
  span_range:
  - src:47b37234ef71#p46.4
  - src:47b37234ef71#p46.5
  decision: U.S. diplomatic policymakers decide whether to make an all-out effort to reach a political settlement in 1995
    rather than defer to a post-UNPROFOR withdrawal strategy.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The proposal favors a multilateral lift as part of a resolution ending UNPROFOR’s mandate and authorizing withdrawal,
    to give Bosnia the capability to survive and level the military playing field. Consider the diplomatic and policy tradeoffs,
    including the stated conditions for securing Russian abstention; exclude any discussion of how arms would be employed.
  span_range:
  - src:47b37234ef71#p47.2
  - src:47b37234ef71#p47.3
  decision: U.S. policymakers decide whether to pursue a multilateral lifting of the arms embargo after UNPROFOR withdrawal,
    including through a Security Council resolution.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The cable recommends resuming bombing that night and argues it could encourage flexibility in Sarajevo and improve
    U.S. leverage in talks with Belgrade; it also recognizes that a pause could become more useful later and says full compliance
    would require stopping. Focus on the policy choice, rationale, and limits of the recommendation; exclude targeting, weapon
    employment, and other operational details.
  span_range:
  - src:47b37234ef71#p49.12
  - src:47b37234ef71#p52.6
  decision: U.S. diplomatic leadership decides whether to resume or continue bombing during the Geneva negotiations rather
    than suspend it, absent full compliance with the stated demands.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
