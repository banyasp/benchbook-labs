- n: 83
  focus: The choice was whether to match the US offer of a 100-percent write-off after the Paris Club deal or stop at the
    multilateral agreement. Treasury advised against the extra relief because poorer countries had not received comparable
    treatment, Iraq lacked a poverty-reduction track record, the cost would be substantial, and the decision could set a precedent;
    the Inquiry says Brown’s response to the advice is not recorded, so do not imply a documented personal decision by him.
  span_range:
