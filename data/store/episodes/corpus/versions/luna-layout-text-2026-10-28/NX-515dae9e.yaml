- n: 82
  focus: The choice was whether to advocate Iraqi debt relief on its own or use that support to seek more generous HIPC treatment;
    the Prime Minister agreed to take the proposal to the French President, and the UK later maintained the linkage. The stated
    considerations include avoiding aid diversion and the Treasury’s assessment that Iraqi relief could cost more than relief
    for all HIPC beneficiaries; exclude the subsequent detailed Paris Club negotiations.
  span_range:
