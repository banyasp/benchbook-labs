  focus: The decision point is whether to discuss the resolution immediately or defer the issue until the Coalition has secured
    victory and is in a stronger position. The account states that the Prime Minister chose to park the question for the first
    evening, then raised Phase IV issues the following day; exclude the later merits of particular resolution provisions.
