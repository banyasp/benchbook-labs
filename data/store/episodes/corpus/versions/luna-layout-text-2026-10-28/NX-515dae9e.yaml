- n: 84
  focus: The choice was whether to proceed with planned returns before the Iraqi Interim Government signed an MOU or defer
    them while seeking agreement. The stated reasons included the risks of alienating Iraqi and Kurdish authorities, uncertainty
    about destination safety, and the timing of returns during military operations and Ramadan; the Home Office’s view that
    Iraq had an obligation to readmit its nationals is relevant context, not the decision’s sole legal basis.
