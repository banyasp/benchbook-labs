- n: 10
  focus: The choice was whether and when to encourage renewed exports while authority over Iraqi oil and revenues remained
    contested. The source gives the humanitarian and reconstruction rationale, describes competing Security Council interests,
    and sets out a proposed staged transfer of control toward Iraqi authorities. Exclude technical or commercial details of
    oil production.
