  focus: The decision was whether the UK should fill the near-term rehabilitation gap in the South or leave delivery to ORHA
    and other partners. The paper cited slow ORHA mobilisation, the UK’s responsibility in the region, and the risk that slow
    visible progress would erode consent; the agreed concept included reallocating £20m from IDP support to quick impact projects.
    Exclude later project-level implementation details.
