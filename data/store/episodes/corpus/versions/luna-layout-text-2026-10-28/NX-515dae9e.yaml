  focus: DFID considered no engagement, full engagement, or limited engagement. The Secretary chose a small presence and case-by-case
    assessment, citing ORHA’s weaknesses, DFID’s distinct responsibilities, and the need not to deploy staff merely in response
    to external pressure. Exclude the wider UK decision to increase ORHA support.
