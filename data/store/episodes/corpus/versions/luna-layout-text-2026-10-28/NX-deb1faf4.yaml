  focus: The decision is whether to make an advance commitment to a German employee of the Nazi diplomatic service or accept
    her offer without one. Exclude the subsequent information-gathering and escape arrangements.
  span_range:
  - src:bd7b875ee008#p3.1
  - src:bd7b875ee008#p3.2
  decision: The US ambassador decides whether to promise Nele safe passage to America in exchange for information; he declines
    to promise it but agrees to receive the information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to pass the warning to the British after receiving reporting about the German transmissions.
    The source does not explain the British response; exclude operational details of the transmissions.
  span_range:
  - src:bd7b875ee008#p3.3
  - src:bd7b875ee008#p3.4
  decision: The US ambassador decides to inform the British that a German agent is transmitting important information related
    to the British.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision is whether to facilitate her departure despite the diplomatic risk of acting in neutral Turkey. Treat
    this only as a high-level protection decision; exclude the escape plan and its operational methods.
  span_range:
  - src:bd7b875ee008#p3.5
  - src:bd7b875ee008#p4.2
  decision: US officials, with the embassy’s concurrence, decide to help Nele leave Turkey rather than leave her exposed to
    the German effort to capture her.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
