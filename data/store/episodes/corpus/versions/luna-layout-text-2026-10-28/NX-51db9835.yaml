episodes:
- n: 1
  focus: In September 1944, OSS wanted to absorb GBT, but its leader insisted that independence was essential to effectiveness.
    OSS agreed to provide support if an OSS officer joined the group. Keep the focus on the choice of organizational relationship
    and the reasons for it; exclude the group’s intelligence-collection methods.
  span_range:
  - src:39a65f733d9d#p2.4
  - src:39a65f733d9d#p3.4
  decision: OSS field leadership chooses limited support and a liaison arrangement with GBT rather than taking over the group.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: After a senior OSS officer’s conduct caused a serious dispute with Chinese leadership, the theater commander requested
    a new OSS chief with authority over China intelligence; the OSS chief accepted the arrangement. Focus on the command decision
    and the stated reason for accepting it, not on subsequent operations.
  span_range:
  - src:39a65f733d9d#p10.2
  - src:39a65f733d9d#p10.5
  decision: The OSS chief accepts the theater commander’s proposed restructuring of OSS command in China and appointment of
    a new China chief.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'In 1945, an AGAS official presented the GBT leader with an ultimatum: OSS would support the group under its overall
    control, or the leader could serve as an advisor on activities not involving Vietnamese partners. The leader chose to
    join OSS. Focus on the governance choice and GBT’s dependence on support; exclude the details of its intelligence activities.'
  span_range:
  - src:39a65f733d9d#p12.3
  - src:39a65f733d9d#p12.5
  decision: The GBT leader accepts bringing the group under OSS control rather than lose its support, with a civilian-advisor
    role offered as an alternative.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
