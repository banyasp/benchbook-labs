episodes:
- n: 1
  focus: The decision point is whether Article 5 protection and its procedural safeguards apply automatically, or only after
    a doubt about POW status arises. The Privy Council held that no doubt arose merely because the accused landed with Indonesian
    armed forces, and upheld the convictions in these cases; exclude the separate case in which counsel expressly raised a
    status claim.
  span_range:
  - src:3bf8066f703b#p1.5
  - src:3bf8066f703b#p1.7
  decision: The Privy Council decides whether the trials of accused who raised no POW-status doubt were mistrials for lack
    of Convention notices.
  content_domain: other:judicial-adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The court considered whether to disregard the claim, require the accused to prove entitlement, or apply Article 5’s
    temporary protection while status is determined or the trial is deferred pending notices. It held that the claim raised
    a doubt, found a mistrial, and ordered the conviction quashed and the case remitted; exclude the separate no-claim cases.
  span_range:
  - src:3bf8066f703b#p1.7
  - src:3bf8066f703b#p1.8
  decision: The Privy Council decides how a trial court must respond when the accused’s counsel claims POW protection.
  content_domain: other:judicial-adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
