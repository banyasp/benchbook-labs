- n: 1
  focus: The decision point is whether the cited reports warranted an estimate of Soviet intentions or deployment, or whether
    they required corroboration before being treated as persuasive. The authors say the reports had weak or absent source
    evaluations, conflicted with other evidence, and could not reliably be separated from a record of false reporting; exclude
    any assessment of collection methods.
  span_range:
  - src:ee4322d111b4#p2.1
  - src:ee4322d111b4#p3.1
  decision: CIA estimators decided how much weight to give clandestine reporting on Soviet intentions and missile deployment
    in the September estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was whether to resume a maximum reconnaissance effort despite possible embarrassment from using the
    asset, or continue with less-than-thorough coverage. The stated reason was that the risks of failing to use the asset
    outweighed the embarrassment, and reporting had strengthened the case for fuller coverage; exclude operational details
    of how reconnaissance was conducted.
  span_range:
  - src:ee4322d111b4#p3.2
  - src:ee4322d111b4#p6.4
  decision: U.S. policymakers decided in late September to restore thorough aerial reconnaissance over Cuba.
  content_domain: other:intelligence collection policy
  refusal_sensitivity: medium
  held_out: false
