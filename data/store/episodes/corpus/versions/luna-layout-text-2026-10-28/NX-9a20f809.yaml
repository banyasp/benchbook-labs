episodes:
- n: 1
  focus: The DCI interprets a senior Israeli official’s remarks as indicating that Israel can no longer avoid a decision to
    attack, and sends the President an “Eyes Only” warning. The decision point is whether to convey that warning; exclude
    the details of intelligence collection or covert communication.
  span_range:
  - src:039be4c353f7#p7.4
  - src:039be4c353f7#p8.1
  decision: The DCI decides to warn the President that Israel will probably start a war within days.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The President declines both forms of support after receiving intelligence assessments that Israel would prevail if
    attacked. The decision point is the policy choice about U.S. support; exclude the underlying military capabilities analysis
    except as the stated basis for the choice.
  span_range:
  - src:039be4c353f7#p7.2
  - src:039be4c353f7#p7.3
  decision: The President decides not to airlift special military supplies to Israel or publicly support it.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: After the Soviet premier threatens possible military action unless Israel halts its advance, the President dispatches
    the fleet on the Defense Secretary’s recommendation, endorsed by those present. The stated purpose was to convey resolve
    without backing the Soviets into a corner; exclude operational details of the fleet’s movement.
  span_range:
  - src:039be4c353f7#p9.3
  - src:039be4c353f7#p10.1
  decision: The President decides to dispatch the Sixth Fleet to the eastern Mediterranean after a Soviet threat.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
