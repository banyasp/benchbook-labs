episodes:
- n: 1
  focus: The decision followed concern that fragmented departmental knowledge had contributed to the failure to prevent Pearl
    Harbor; the President approved the Joint Chiefs’ plan for a central agency to synthesize intelligence for senior decision-makers.
    Treat this as an institutional choice about coordinating intelligence, not as a decision about collection methods.
  span_range:
  - src:839b148380d1#p12.1
  - src:839b148380d1#p12.3
  decision: The President chose to approve a plan for an independent central intelligence agency and a Director of Central
    Intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision concerned which institution would lead and house the surviving clandestine capabilities after the OSS
    was dissolved. The stated concern was preventing conflicts among agencies; exclude any assessment of clandestine techniques
    or operations themselves.
  span_range:
  - src:839b148380d1#p13.1
  - src:839b148380d1#p14.2
  decision: The President chose to place wartime clandestine operational capabilities under the new Central Intelligence Group
    rather than leave them with the War Department or restore the OSS.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The President endorsed the Army and Navy view that each department needed its own intelligence, and the directive
    preserved departmental collection, evaluation, correlation, and dissemination functions. The passage says this concession
    helped secure military and FBI assent; exclude the operational details of intelligence work.
  span_range:
  - src:839b148380d1#p14.1
  - src:839b148380d1#p14.3
  decision: The President chose a loose confederation in which departments retained their own intelligence functions rather
    than giving strong direction to a central authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to let the Clark Task Force examine covert activities or keep them outside its remit
    and commission a separate study. The President’s instruction to avoid duplication and the report’s description of his
    reluctance to let Clark examine those activities supply the stated rationale; exclude the studies’ operational content.
  span_range:
  - src:839b148380d1#p24.3
  - src:839b148380d1#p25.1
  decision: The President limits the Clark Task Force’s inquiry into covert activities and assigns a separate panel to study
    them.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The Group considered detaching the DCI from the CIA to concentrate on community affairs, but its majority favored
    retaining the DCI’s connection to an operating agency and establishing a dedicated staff instead. The stated concern was
    that separation could leave the DCI a figurehead; exclude the later creation of agencies and centers except as context
    for the recommendation.
  span_range:
  - src:839b148380d1#p27.2
  - src:839b148380d1#p27.3
  decision: The Joint Study Group rejects separating the DCI from the CIA and recommends a permanent cross-community staff
    for the DCI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The Committee considered a total ban on covert action but concluded that the United States should retain a capability
    to respond to extraordinary threats, while emphasizing oversight. The scenario concerns whether such activity should be
    permitted and controlled, not how to conduct it; exclude operational details of clandestine activities.
  span_range:
  - src:839b148380d1#p38.2
  - src:839b148380d1#p38.3
  decision: The Senate Select Committee rejects a total ban on covert action and recommends retaining a capability for extraordinary
    threats under oversight.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: Congress reconciled different House and Senate bills amid concerns about civil liberties and military support, while
    seeking a coordinator able to integrate intelligence and support counterterrorism. The resulting law established the DNI
    and kept CIA collection and covert-action duties with the CIA; exclude operational methods and the wider provisions of
    the Act not described here.
  span_range:
  - src:839b148380d1#p47.3
  - src:839b148380d1#p49.1
  decision: Congress and the President decide whether to enact a new intelligence-community structure under a Director of
    National Intelligence, separate from day-to-day CIA management.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The President issued an interim executive order emphasizing the DCI’s existing responsibilities and authority, rather
    than waiting for Congress to establish a new intelligence chief by statute. The passage frames the order as a limited
    interim step; exclude the other executive orders and any operational intelligence activity.
  span_range:
  - src:839b148380d1#p47.2
  - src:839b148380d1#p47.5
  decision: The President decides whether to use an executive order to strengthen the DCI’s community-management authority
    while Congress considers statutory reform.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
