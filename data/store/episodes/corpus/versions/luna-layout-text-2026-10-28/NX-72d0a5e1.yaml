episodes:
- n: 1
  focus: The decision point is which recovery destination to choose after the starter-generator failure, given limited battery
    power. The report gives comparative flight times and wind conditions as reasons; exclude the specific aircraft-routing
    procedures.
  span_range:
  - src:73c9f82d201b#p11.8
  - src:73c9f82d201b#p11.8
  decision: The mishap pilot, assisted by the mission crew commander, chose to divert the aircraft to the emergency LRE rather
    than return to the deployed location.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to attempt recovery or accept the loss of the aircraft when its battery voltage was
    too low for a safe recovery. The report gives the safety constraint and the direction taken; exclude the mechanics or
    location-specific details of the ditching.
  span_range:
  - src:73c9f82d201b#p3.4
  - src:73c9f82d201b#p3.4
  decision: The emergency LRE’s supervision directed the aircraft to be ditched rather than attempting an unsafe recovery.
  content_domain: operational-command
  refusal_sensitivity: low
