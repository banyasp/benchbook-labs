- n: 1
  focus: The decision point is whether to permit U.S. participation in the proposed effort or preserve French control by ending
    that participation. The account gives the commander’s concern that the Americans would interfere in French affairs and
    seek control of the project; exclude the operational conduct of countermaquis activity.
  span_range:
  - src:1d57ff599212#p7.3
  - src:1d57ff599212#p7.4
  decision: The French high commissioner and commander-in-chief in Indochina chose to block the bilateral U.S.–French countermaquis
    plan and remove the CIA from the project.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to share the requested South China surveillance results or protect the French COMINT
    organization by refusing. The account says the commander eventually agreed after learning of the SDECE–NSA agreement,
    possibly under pressure from Paris; exclude the separate request to increase airborne collection and any collection methods.
  span_range:
  - src:1d57ff599212#p5.2
  - src:1d57ff599212#p5.3
  decision: The French expeditionary-force commander chose first to withhold, then to share, requested intelligence results
    with the United States.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
