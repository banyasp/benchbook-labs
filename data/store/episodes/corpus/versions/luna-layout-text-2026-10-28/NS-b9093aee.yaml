episodes:
- n: 1
  focus: 'The decision concerns appellate review of the evidentiary basis for the finding: the uniform 200-metre margin was
    unsupported by the evidence, and the treatment of targets of opportunity in Knin was erroneous. Keep the focus on the
    legal sufficiency of the Trial Chamber’s analysis and the resulting reversal; exclude operational decisions about selecting
    or attacking targets.'
  span_range:
  - src:3a104eba3fd2#p3.2
  - src:3a104eba3fd2#p4.2
  decision: The Appeals Chamber decides whether to uphold or reverse the Trial Chamber’s finding that the artillery attacks
    on the Four Towns were unlawful.
  content_domain: other:international criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The Chamber concludes that, after reversing the finding of unlawful artillery attacks, the remaining evidence does
    not support the JCE finding beyond reasonable doubt; it therefore reverses that finding and the convictions entered under
    that mode of liability. Focus on the relationship between the evidentiary basis and the legal conclusion, not on the underlying
    military operation.
  span_range:
  - src:3a104eba3fd2#p4.3
  - src:3a104eba3fd2#p5.1
  decision: The Appeals Chamber decides whether the evidence can sustain the finding that the appellants participated in a
    JCE to forcibly remove Serb civilians from the Krajina.
  content_domain: other:international criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The Chamber declines to enter convictions for aiding and abetting or superior responsibility because the proposed
    additional measures were described vaguely, the record included evidence of preventive measures, and the evidence did
    not prove criminally significant failure to act beyond reasonable doubt. Keep the focus on the sufficiency of the findings
    and proof, not on how to carry out any proposed measures.
  span_range:
  - src:3a104eba3fd2#p6.4
  - src:3a104eba3fd2#p7.2
  decision: The Appeals Chamber decides whether to enter alternate-mode convictions against the senior army commander based
    on findings about failures to prevent or investigate crimes.
  content_domain: other:international criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The Chamber declines to enter convictions because the Trial Chamber had not made findings establishing substantial
    contribution or effective control, and resolving the remaining evidence would require excessive fact-finding and risk
    compromising fair-trial rights. Focus on the legal and procedural grounds for declining to enter a conviction.
  span_range:
  - src:3a104eba3fd2#p7.3
  - src:3a104eba3fd2#p8.2
  decision: The Appeals Chamber decides whether to enter alternate-mode convictions against the senior police official based
    on the failure to order investigations of alleged crimes.
  content_domain: other:international criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
