episodes:
- n: 1
  focus: The decision point is whether to retain the existing review workflow, which could take weeks or months, or change
    it to reduce delivery delays. Focus on the process-policy choice and the stated aim of getting products to customers faster;
    exclude technical details of the electronic system.
  span_range:
  - src:6326a6885e65#p4.2
  - src:6326a6885e65#p4.4
  decision: The DDI and DI leadership chose to replace the paper-heavy product review process with an electronic, more collaborative
    process.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to retain existing promotion criteria or make field experience and language ability
    prerequisites. Focus on the stated goal of strengthening analysts’ subject-matter expertise and product quality; exclude
    details of how to conduct any overseas assignment.
  span_range:
  - src:6326a6885e65#p5.4
  - src:6326a6885e65#p5.5
  decision: The DDI chose to require relevant country or regional experience and working-level language ability before promotion
    to GS-13 or GS-14 analyst positions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to implement a policy of regularly removing the lowest performers or refrain from doing
    so. The passage says the DDI stood down after HR officials raised civil-service protections and counterintelligence risks;
    focus on those constraints and exclude broader downsizing measures.
  span_range:
  - src:6326a6885e65#p6.3
  - src:6326a6885e65#p6.5
  decision: The DDI chose not to adopt systematic removal of the lowest-performing ten percent of DI employees.
  content_domain: other:personnel-management
  refusal_sensitivity: medium
  held_out: false
  natsec: false
