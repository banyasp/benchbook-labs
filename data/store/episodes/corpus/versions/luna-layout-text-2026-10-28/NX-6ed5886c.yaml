episodes:
- n: 1
  focus: The brigade commander weighs mission progress against the danger reported by battalion commanders, including credible
    concerns about fog, rain, and flooding. Keep the focus on risk escalation and the decision to pause; exclude tactical
    movement details.
  span_range:
  - src:63a3fe72de04#p13.2
  - src:63a3fe72de04#p13.3
  decision: The brigade commander chooses to consult the division commander rather than order battalions to continue moving
    through hazardous weather; the division commander directs them to hold until conditions permit.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to maintain the planned pace or adjust it in light of lost air support and reduced
    cavalry combat power. Exclude the details of the cavalry troop’s subsequent maneuver and the Apache engagement.
  span_range:
  - src:63a3fe72de04#p14.3
  - src:63a3fe72de04#p14.4
  decision: The brigade commander accepts a slower operational tempo after the squadron reports it cannot pass maneuver battalions
    forward on schedule without the planned Apache support.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The commander describes this as a conscious, difficult choice during an 18-month period building the battalion’s
    vision before a training-center rotation. Focus on the balance between subordinate discretion and the commander’s responsibility
    for risk, and the stated rationale of developing leaders and organizational growth; exclude battlefield maneuver or other
    tactical execution details.
  span_range:
  - src:63a3fe72de04#p39.3
  - src:63a3fe72de04#p39.4
  decision: The battalion commander decides to underwrite risk to company-level commanders during the unit’s training progression
    rather than retain that risk at battalion level.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision occurred during the FSCOORD’s initial counseling, about 10 days before deployment. The commander could
    have retained closer control or delegated; exclude the later general discussion of fires employment and operational techniques.
  span_range:
  - src:63a3fe72de04#p68.2
  - src:63a3fe72de04#p68.2
  decision: The BCT commander chose to trust and empower the newly appointed FSCOORD to manage the fires enterprise within
    the commander’s intent.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
