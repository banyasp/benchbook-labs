- n: 1
  focus: After 60 days in the role, the CSM learns he is seen as difficult and a micromanager, and that his approach is failing
    the organization. He chooses to ask the first sergeants for feedback rather than continue unchanged; exclude general leadership
    advice beyond this response to the specific feedback.
  span_range:
  - src:4beb5d1eaed1#p10.3
  - src:4beb5d1eaed1#p11.1
  decision: The battalion CSM decides to seek candid feedback from the first sergeants and change his leadership approach.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The BCT CSM identifies Soldiers with more than 26 months on station and requests PCS transitions in exchange for
    requisitions, aiming to sustain personnel availability for training and deployment. Frame the decision as making that
    request rather than as authority to order assignments; exclude detailed manning-system procedures.
  span_range:
  - src:4beb5d1eaed1#p30.4
  - src:4beb5d1eaed1#p30.7
  decision: The brigade CSM decides to identify long-serving Soldiers and request transition PCS moves aligned with manning
    cycles rather than wait for HRC to manage the enlisted population.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision followed discovery of inconsistent company practices, nonstandard terminology that presented a safety
    issue, and a negligent discharge during a live-fire exercise. Focus on the CSM’s choice to use the board as a diagnostic
    venue and the safety and training concerns behind it; exclude weapon-handling or training techniques.
  span_range:
  - src:4beb5d1eaed1#p35.1
  - src:4beb5d1eaed1#p35.2
  decision: The battalion CSM chose to use promotion boards as an additional check on the unit’s marksmanship training and
    standards.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
