  decision: FEA, State, and Treasury policymakers establish SAFEHAVEN to identify and block German assets abroad.
  content_domain: other:economic-security policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The passage states that OSS participation was authorized and links the organizational change to improved dissemination
    and evaluation of intelligence. The alternative was continuing without formal OSS participation and centralized reporting;
    exclude intelligence-gathering techniques.
  span_range:
