  natsec: true
- n: 2
  focus: The choice was between the JCS plan’s compact authority-and-agency structure and State’s more elaborate committee
    system. Include the President’s stated preference and the resulting establishment of the NIA and CIG; exclude the CIG’s
    later operational activities.
  span_range:
  - src:39bd6d70d524#p16.4
  - src:39bd6d70d524#p17.3
  decision: The President chose the Joint Chiefs of Staff plan over the State Department plan and established the NIA and
    CIG.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: Congress could accept the bill’s brief reference to the presidential directive or specify the agency’s powers and
    limits in the statute. Focus on the stated concerns about unchecked executive authority, a feared ‘Gestapo,’ and protecting
    the FBI; exclude the agency’s methods of carrying out its functions.
  span_range:
  - src:39bd6d70d524#p20.3
  - src:39bd6d70d524#p21.2
  decision: Congress chose to spell out the intelligence agency’s functions and restrictions in statute rather than rely on
