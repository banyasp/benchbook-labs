  focus: The committee faced competing proposals for a central agency and the prospect of continuing departmental self-coordination.
    Focus on why the military members accepted the agency’s functions only with NIA control; exclude the operational details
    of intelligence work.
  span_range:
  - src:39bd6d70d524#p9.1
  - src:39bd6d70d524#p9.3
  decision: The Joint Intelligence Committee chose to accept a new central intelligence agency subject to control by a National
    Intelligence Authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
