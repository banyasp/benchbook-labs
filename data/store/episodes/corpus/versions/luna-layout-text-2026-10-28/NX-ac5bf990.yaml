- n: 1
  focus: The decision point is whether to retain existing information-sharing restrictions or pursue broader access for partner
    intelligence officers. Focus on the DNI’s policy rationale—efficiency, flexibility, productivity, and trust weighed against
    legal impediments, cultural change, and compromise risk; exclude implementation details.
  span_range:
  - src:c8e80ba4f25e#p15.3
  - src:c8e80ba4f25e#p15.7
  decision: The DNI advocated eliminating NOFORN restrictions and extending comparable access privileges to Five Eyes partners.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to retain existing arrangements or act on the 9/11 Commission’s recommendations for
    stronger integration and leadership. Focus on the President’s choice and the stated shortcomings and circumstances prompting
    it; exclude operational details of counterterrorism activity.
  span_range:
  - src:c8e80ba4f25e#p24.3
  - src:c8e80ba4f25e#p24.5
  decision: The President chose to advance post-9/11 intelligence reforms by signing orders establishing the National Counterterrorism
    Center, compelling information sharing, creating a civil-liberties safeguard, and strengthening the DCI’s authority pending
    legislation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision was whether to staff NCTC through temporary tours by new CIA hires, rather than continue resisting requests
    for analysts or make the assignments permanent. The passage cites NCTC’s lack of a permanent career service, the analysts’
    expected return to CIA, and the aim of reducing the need to borrow staff from CIA and other agencies.
  span_range:
  - src:c8e80ba4f25e#p39.3
  - src:c8e80ba4f25e#p39.4
  decision: CIA leadership agreed to assign a set number of newly hired analysts to NCTC for their initial two-year tours.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision was whether to send new CIA analysts to the ODNI course or limit participation because CIA already had
    its own Career Analyst Program. The passage also gives the operational burden of taking analysts offline while offices
    faced expanding workloads; exclude the broader merits of community-wide training programs.
  span_range:
  - src:c8e80ba4f25e#p42.3
  - src:c8e80ba4f25e#p42.4
  decision: CIA’s analytic directorate chose token participation in ODNI’s four-week Analysis 101 course.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: After analysts’ complaints and agency ombudspersons’ concerns about tradecraft violations, the ombudsperson had to
    decide whether to pursue the inquiry despite personal and professional risk or stop short of a documented finding. The
    account cites the duty to support the analysts, the evidence gathered, and the risk that the issue would otherwise remain
    unresolved; exclude any operational intelligence-gathering methods.
  span_range:
  - src:c8e80ba4f25e#p49.5
  - src:c8e80ba4f25e#p50.6
  decision: The IC analytic ombudsperson chose to pursue and document an inquiry into alleged politicization of election-interference
    analysis.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is the defendant’s refusal to confess, despite the government’s stated offer to spare her life,
    based on her belief that she and her spouse had done nothing wrong and her unwillingness to betray her beliefs or her
    spouse’s memory. Exclude the underlying espionage activity and the reviewer’s broader judgments about the case.
  span_range:
  - src:c8e80ba4f25e#p62.4
  - src:c8e80ba4f25e#p62.5
  decision: The condemned espionage defendant chose whether to confess in exchange for having her life spared.
  content_domain: other:criminal-justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
