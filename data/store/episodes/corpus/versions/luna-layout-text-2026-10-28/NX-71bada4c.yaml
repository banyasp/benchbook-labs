episodes:
- n: 1
  focus: The planners disagree over whether the naval commander should coordinate plans with the land commander or conduct
    naval and amphibious phases in conformity with the land campaign plan. The approved directive gives the Army commander
    primary responsibility for OLYMPIC, while preserving naval responsibility for naval and amphibious phases and providing
    for naval control of the actual assault in exigencies; the planners’ reasons concern integrated command, land-campaign
    priorities, and practical naval responsibilities. Exclude the operational details of conducting the assault.
  span_range:
  - src:cede6b197c43#p2.7
  - src:cede6b197c43#p8.1
  decision: The Joint Chiefs of Staff decide the command arrangement for Operation OLYMPIC, including primary responsibility
    for the campaign and the Navy’s authority over naval and amphibious phases.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The memorandum weighs invasion against continued isolation, blockade, and bombardment, and compares southern Kyushu
    with alternatives including Korea and northwestern Kyushu. The stated reasons include the expected military value and
    feasibility of southern Kyushu, uncertain results and potentially long duration of blockade alone, and estimated casualties
    and timing for later options. The document presents a planned course and leaves the post-Kyushu decision contingent on
    developments; do not treat its casualty estimates as certain outcomes.
  span_range:
  - src:cede6b197c43#p25.2
  - src:cede6b197c43#p32.2
  decision: 'The Joint Chiefs of Staff choose the planned campaign course against Japan: proceed with the southern Kyushu
    invasion, prepare for a possible Tokyo-area invasion, and reserve the post-Kyushu choice between that invasion and further
    blockade or operations for later developments.'
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the choice to proceed with the Kyushu invasion on the stated timetable, weighing its role in
    isolating Japan and enabling a possible later invasion of the Tokyo Plain against the costs and risks of an assault. Treat
    the casualty estimates and operational assessments only as reasons informing the policy choice; do not extract operational
    techniques or plans as decisions.
  span_range:
  - src:cede6b197c43#p49.4
  - src:cede6b197c43#p55.2
  decision: The Joint Chiefs of Staff directed an invasion of southern Kyushu around 1 November 1945 rather than relying on
    blockade and bombardment alone or choosing another landing area.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to attack Korea or pursue another course, including operations in the Japanese home
    islands. The passage weighs strategic benefits against the scale of forces, reinforcement risks, terrain, and logistical
    burden; exclude any tactical details as standalone decisions.
  span_range:
  - src:cede6b197c43#p44.1
  - src:cede6b197c43#p44.2
  decision: The staff planners recommended against an invasion of Korea as the next operation after Okinawa, concluding that
    its expected results did not justify its costs.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is the U.S. position on command arrangements for the Pacific war. The passage gives the existing
    U.S.-led arrangement and concerns about combined control; exclude general descriptions of command organization that do
    not bear on this choice.
  span_range:
  - src:cede6b197c43#p58.5
  - src:cede6b197c43#p58.5
  decision: The Joint Chiefs of Staff favored retaining U.S. control and direction of the Pacific war rather than adopting
    combined control with Britain.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is how far the United States should seek additional Soviet commitments, including possible U.S.
    basing or operations in Soviet territory. The paper weighs the military value of Soviet action against the view that U.S.
    forces could defeat Japan in the main islands and the risk of costly operations in the Kuriles-Karafuto area.
  span_range:
  - src:cede6b197c43#p55.3
  - src:cede6b197c43#p56.3
  decision: The Joint Chiefs of Staff favored not pressing the Soviet Union for further commitments, while remaining willing
    to consider Soviet proposals and recognizing the value of Soviet participation against Japanese forces on the mainland.
  content_domain: other:allied-war-planning
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The President considers proceeding with Kyushu versus relying on air power, delaying, or taking further action later;
    the Chiefs argue that Kyushu is strategically necessary, while the President and advisers weigh expected casualties, timing,
    possible Russian involvement, and political concerns. The stated outcome is to proceed with Kyushu and decide on the final
    campaign later. Exclude the operational details of planning or conducting the invasion.
  span_range:
  - src:cede6b197c43#p71.2
  - src:cede6b197c43#p74.3
  decision: The President and Joint Chiefs of Staff decide to proceed with the Kyushu invasion while deferring the decision
    on subsequent action.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The stated choice is to shift effort from the planned Ryukyu expansion toward developing Okinawa, with the aim of
    bringing greater effort to bear on Japan sooner and avoiding operations that could delay the southern Kyushu invasion.
    Treat this as a force-prioritization decision, not a description of operational methods.
  span_range:
  - src:cede6b197c43#p76.2
  - src:cede6b197c43#p76.3
  decision: The Joint Chiefs of Staff decide to curtail planned seizures of Miyako Jima and Kikai Jima and accelerate Okinawa’s
    development.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: In response to intelligence reporting increased Japanese defenses in southern Japan, the planners recommend against
    changing the current directive for now, while seeking continued assessment and contingency plans. The decision point is
    whether to change the directive immediately or preserve it pending further review; exclude the operational details of
    any alternate plans.
  span_range:
  - src:cede6b197c43#p99.5
  - src:cede6b197c43#p100.6
  decision: The Joint Staff Planners recommend retaining the current OLYMPIC directive while requiring commanders to review
    the situation and prepare alternate plans.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to use the atomic bombs or refrain from doing so, in light of the estimated casualties
    of an invasion and Japan’s rejection of the ultimatum. The account says the July directive put military preparations in
    motion, but the final decision remained with the President and was made after the rejection; exclude the operational selection
    of targets and delivery of the weapons.
  span_range:
  - src:cede6b197c43#p117.8
  - src:cede6b197c43#p118.2
  decision: The President decided to order the atomic bomb attacks on Japan after the Potsdam ultimatum was rejected.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 11
  focus: The reviewer changed the casualty wording to avoid a conflict between estimates and deleted a sentence judged likely
    to be unfairly used by political opponents. The decision point concerns what to include and how to present the public
    historical explanation; exclude the underlying 1945 operational decisions.
  span_range:
  - src:cede6b197c43#p116.5
  - src:cede6b197c43#p116.10
  decision: A White House staff reviewer decided how to revise the President’s draft response to a historian about the circumstances
    of the atomic bomb attacks.
  content_domain: other:public-information-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
