  focus: The decision point is whether to retain engagement decisions at higher echelons or delegate them to lower levels,
    and how to allocate authority under the published ROE. The source says the authority was refined with HICON and records
    the resulting allocation; exclude the operational mechanics of conducting engagements.
  span_range:
  - src:304970e4280d#p8.4
  - src:304970e4280d#p9.3
  decision: During rotation 25-02, the C/6-56 ADA battery commander and HICON set and published which echelon had authority
    to engage different categories of air threats.
  content_domain: targeting
