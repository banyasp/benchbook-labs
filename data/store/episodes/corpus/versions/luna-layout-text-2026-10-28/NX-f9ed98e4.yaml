- n: 2
  focus: The decision point is whether to augment the ADAM cell with battery personnel or leave it to manage its workload
    with its existing staffing. The commander provided personnel to help the cell manage the fight, but the source reports
    that this caused mission creep; exclude details of battle drills and command-post procedures.
  span_range:
  - src:304970e4280d#p5.4
  - src:304970e4280d#p5.5
  decision: The C/6-56 ADA battery commander decided to provide battery personnel to augment the understaffed ADAM cell during
    rotation 25-02.
  content_domain: operational-command
