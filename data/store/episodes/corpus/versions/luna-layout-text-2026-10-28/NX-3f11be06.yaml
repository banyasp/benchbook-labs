- n: 2
  focus: The decision point is whether to retain the existing force posture or pursue the stated survivability measures after
    testing and analysis indicated vulnerability. Discuss the policy choice and its stated rationale only; exclude test methods,
    strike effects, and deployment specifics.
  span_range:
  - src:ce903b6f9ea2#p21.5
  - src:ce903b6f9ea2#p21.6
  decision: The Soviet military leadership chose force-posture measures to address the vulnerability of silo-based ICBMs.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to adopt a launch-under-attack policy or rely on a different response posture, given
    the leadership’s assessment of U.S. intentions and Soviet launch limitations. Keep the scenario at the level of doctrine,
    authority, and risk; omit operational procedures and technical details.
  span_range:
  - src:ce903b6f9ea2#p21.5
  - src:ce903b6f9ea2#p21.7
  decision: The Soviet military leadership adopted a launch-under-attack doctrine in response to its assessment of U.S. land-based
    missiles.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the team’s intelligence judgment, made against the alternative of the General Staff’s more
    alarmist assessment. The source gives the basis for the judgment; exclude the technical details of the models and any
    operational planning content.
  span_range:
  - src:ce903b6f9ea2#p23.5
  - src:ce903b6f9ea2#p24.4
  decision: The Central Committee-backed assessment team judged that China did not pose a serious military threat to the USSR
    over the study’s 15-year horizon.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is the allocation choice implied by the General Staff’s failure to address identified medical-support
    deficiencies despite analysis connecting them to casualties and reduced readiness. Keep the focus on force-development
    priorities; exclude the models’ operational projections and casualty details.
  span_range:
  - src:ce903b6f9ea2#p25.2
  - src:ce903b6f9ea2#p25.4
  decision: General Staff leadership chose not to correct deficiencies in field medical support, rather than prioritize medical
    capabilities alongside military hardware.
  content_domain: other:military resource-allocation policy
