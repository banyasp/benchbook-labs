title: Tillman, DoD IG review (2007).
collection: D1 Strike and friendly-fire investigations
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The Inspector General chose to request a CID investigation while conducting a review of the prior investigations
    and related matters. The stated reasons were remaining questions about the incident and CID’s investigative capability
    and independence; exclude the investigative techniques themselves.
  span_range:
  - src:05e1cc37910c#p6.8
  - src:05e1cc37910c#p6.8
  decision: The DoD Inspector General requested that Army CID investigate the facts and circumstances of Tillman’s death and
    the deaths and injuries of others in the incident.
  content_domain: other:investigative oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to advise the family promptly that friendly fire was suspected or delay notice pending
    verification. The report gives verification as the reason for withholding and notes the regulatory expectation to provide
    next of kin additional information as it becomes available; exclude speculation about undisclosed motives.
  span_range:
  - src:05e1cc37910c#p8.5
  - src:05e1cc37910c#p8.5
  decision: The Army representative at the memorial service, the commander of USASOC, withheld notice to the family that friendly
    fire was suspected and under investigation until the facts could be verified.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The report states that the office chose an unclassified issuance to promote utility and avoid delays associated with
    a classified report. The decision point is the publication and classification choice; exclude details of the classified
    activities themselves.
  span_range:
  - src:05e1cc37910c#p3.7
  - src:05e1cc37910c#p3.7
  decision: The DoD Inspector General’s office chose to issue this report unclassified despite some related Army activities
    remaining classified.
  content_domain: other:classification policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to start promptly with an available battalion officer or wait for an investigator from
    the regiment. The stated reasons were the incident site's remoteness, the delay in getting a regimental investigator there,
    and the value of beginning while events were fresh; the report also notes that the appointing officers lacked the required
    authority. Exclude the investigative methods and evidence-gathering details.
  span_range:
  - src:05e1cc37910c#p24.5
  - src:05e1cc37910c#p25.3
  decision: COL Nixon chose to have the battalion begin the initial investigation by appointing CPT as investigating officer
    rather than waiting for a regimental investigator.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to accept or finalize the initial draft, or replace it with a further investigation
    by a more senior officer. COL Nixon cited deficiencies in thoroughness, unsupported conclusions, and unresolved questions
    about responsibility; the broader review was intended to address those concerns. Exclude the details of how the investigation
    was conducted.
  span_range:
  - src:05e1cc37910c#p24.2
  - src:05e1cc37910c#p25.5
  decision: COL Nixon chose to withdraw CPT’s investigation and appoint LTC to conduct a further investigation at the regimental
    level.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to disclose the suspicion promptly or restrict disclosure until the facts were better
    understood and the Army could inform the family. The stated reasons included concern about leaks and premature or incomplete
    information reaching the press or family. The passage also describes failures to share the suspicion with AFME and CID;
    do not recast those separate actions as deliberate orders by COL Nixon where the source does not establish that.
  span_range:
  - src:05e1cc37910c#p25.6
  - src:05e1cc37910c#p26.4
  decision: COL Nixon chose to keep information about the suspected friendly fire investigation within the unit rather than
    release it outside the unit while the investigation was ongoing.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: This is a concrete choice between promptly updating the family with the suspicion and waiting for confirmation or
    completion of the investigation. The commander cited the unconfirmed status, the unfinished investigation, and that it
    was “not the right time”; assess that decision against the notification requirements described in the passage. Exclude
    later disputes about the commander’s testimony except as context.
  span_range:
  - src:05e1cc37910c#p45.8
  - src:05e1cc37910c#p49.6
  decision: The Commander, USASOC, decided not to inform the Tillman family on May 3, 2004, that friendly fire was suspected.
  content_domain: other:military casualty notification policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The decision point is whether to restrict access to the information or inform personnel staff who needed it to correct
    the casualty report and trigger a family update. The commander said he wanted to prevent leaks and ensure the family received
    the command’s best account; the report says the restriction deprived personnel NCOs of information needed for their duties.
    Exclude operational details of the incident and focus on information access, reporting obligations, and family notification.
  span_range:
  - src:05e1cc37910c#p48.3
  - src:05e1cc37910c#p52.4
  decision: The regimental commander decided to limit which personnel were informed that friendly fire was suspected and under
    investigation.
  content_domain: other:military casualty notification policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The decision point is the award level recommended, given the commander’s assessment that the service member’s actions
    before his death demonstrated valor, even though friendly fire was suspected. The passage gives the commander’s stated
    reasons and the award standard; consider the accuracy of the supporting material as a separate issue, without implying
    that the commander knowingly submitted false statements. Exclude the mechanics of the firefight.
  span_range:
  - src:05e1cc37910c#p55.5
  - src:05e1cc37910c#p57.7
  decision: The battalion commander decided to recommend a Silver Star for the deceased service member rather than pursue
    the initially contemplated Bronze Star with V device.
  content_domain: other:military awards
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The commanders moved from a Bronze Star proposal to a Silver Star recommendation, relying on Tillman’s actions in
    responding to the ambush and facing potential enemy fire, among other factors. The passage describes the award standard
    and the commanders’ reasoning; exclude whether friendly fire itself disqualifies an award, which the report says it does
    not.
  span_range:
  - src:05e1cc37910c#p60.3
  - src:05e1cc37910c#p62.2
  decision: The battalion and company commanders chose to recommend a Silver Star rather than a Bronze Star for Corporal Tillman.
  content_domain: other:military awards
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: 'The report says the commander could have delayed submission until the investigation was complete or immediately
    informed the approving authority, but instead pursued the award in time for the memorial service. It gives his reasons:
    he believed the valor merited recognition regardless of the cause of death and wanted the family to receive the award
    at the service; exclude the merits of any particular combat action.'
  span_range:
  - src:05e1cc37910c#p62.4
  - src:05e1cc37910c#p62.6
  decision: The regimental commander chose to pursue the Silver Star recommendation before the friendly-fire investigation
    was complete, rather than delay it or alert the approving authority to the suspected friendly fire.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 12
  focus: The report describes the choice to withhold the suspected cause of death from the family while pursuing a memorial-service
    award. It gives the commander’s reasons—his wish to recognize Tillman’s bravery at the service and his belief that the
    source of the fatal fire should not affect recognition—and finds that the decision left the family feeling misled.
  span_range:
  - src:05e1cc37910c#p62.5
  - src:05e1cc37910c#p63.2
  decision: The regimental commander chose to delay notifying the family that friendly fire was suspected until the investigation
    was complete.
  content_domain: other:next-of-kin notification
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The message alerted higher commanders that friendly fire was highly possible and that the award was still considered
    merited, while asking them to warn senior officials against potentially embarrassing remarks. The report says it did not
    call for correcting the award package; focus on the choice of notification and its stated rationale, not on operational
    matters.
  span_range:
  - src:05e1cc37910c#p59.3
  - src:05e1cc37910c#p63.3
  decision: The operational commander chose to alert senior commanders about suspected friendly fire through a personal message,
    but did not ensure the award-processing channels or approving authority were informed.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is whether the fire-team leader would continue the engagement despite mortal danger or withdraw,
    with the stated reason of protecting fellow Rangers and helping them reach safety. Exclude the specific movements, positions,
    and weapons described in the passage.
  span_range:
  - src:05e1cc37910c#p84.6
  - src:05e1cc37910c#p84.7
  decision: The corporal leading the fire team chose to continue the attack under fire rather than withdraw, to protect fellow
    Rangers trapped in the ambush.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
