- n: 1
  focus: The decision point is whether to create the requested plan with agreed milestones and metrics or rely on existing
    processes for identifying and incorporating requirements. Focus on the stated rationale that current governance already
    accommodates this work; exclude the report’s separate discussion of how analytic resources should be allocated.
  span_range:
  - src:6ddb760a9a19#p17.4
  - src:6ddb760a9a19#p18.2
  decision: The DIA Director chose not to concur with the IG’s recommendation for a plan to capture non-traditional intelligence
    requirements, relying instead on existing DIAP governance and its annual Open Season process.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to set a specified time threshold or use a broader, in-depth analytic concept. The
    team cited the absence of a formal definition and the risk that a fixed threshold would turn the assessment into a product-production
    metric review; exclude substantive resource-allocation decisions.
  span_range:
  - src:6ddb760a9a19#p12.2
  - src:6ddb760a9a19#p12.2
  decision: The DoD IG assessment team chose not to impose a fixed time-frame definition of long-term intelligence analysis,
    instead allowing stakeholders latitude to describe their concerns.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to accept the IG’s original wording or propose a revised formulation tied to the Department’s
    ongoing approach to developing analytic expertise. The comments describe training, education, mentoring, and joint-duty
    opportunities as context; exclude any assumption that the certification program had already been implemented.
  span_range:
  - src:6ddb760a9a19#p23.7
  - src:6ddb760a9a19#p23.8
  decision: The Deputy Under Secretary of Defense for Intelligence and Security chose to propose revised wording for the IG’s
    analyst-certification recommendation, aligning it with the Department’s existing efforts.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
