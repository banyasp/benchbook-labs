  focus: The decision point is whether to mobilize Guard personnel before a formal support request, after observing unrest
    and the White House lockdown. Include the stated anticipation of requests and the force’s four-hour response readiness;
    exclude later operational details.
  span_range:
  - src:c00b7965bc08#p16.2
  - src:c00b7965bc08#p16.2
  decision: The commanding general of the District of Columbia National Guard decided to reschedule drill dates and activate
    a 150-member quick reaction force.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to augment the District of Columbia National Guard as unrest and violence escalated,
    including the stated estimate of a 5,000-member requirement. Include the stated aims of assisting civilian law enforcement
    and protecting federal functions, people, and property; exclude tactical deployment details.
  span_range:
  - src:c00b7965bc08#p16.3
  - src:c00b7965bc08#p16.3
  decision: The Secretary of Defense decided to direct the National Guard Bureau to obtain additional state and territorial
    forces for the District of Columbia response.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether that conduct is permissible under DOD and Army regulations, given the concern that
    it could be seen as joining a protest while in uniform. Focus on the legal and policy judgment and its de-escalation rationale;
    exclude operational methods of managing a crowd.
  span_range:
  - src:c00b7965bc08#p36.2
  - src:c00b7965bc08#p36.2
  decision: The National Guard Bureau decided that Soldiers could take a knee during civil disturbance operations to de-escalate
    a situation without treating the act as participation in a political protest.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to provide a major command as a unit or contribute personnel in a less cohesive arrangement.
    The source says the unit deployment simplified communications and coordination and supported continuity; exclude discussion
    of unit-specific tactics and procedures.
  span_range:
  - src:c00b7965bc08#p38.2
  - src:c00b7965bc08#p38.3
  decision: Tennessee National Guard leadership chose to provide a full brigade, deploying the 278th Armored Cavalry Regiment
    as a unit, in response to the support requirement.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to use expedited verbal approvals and Title 32 status rather than await normal staffing
    or use another status. The source cites the in-extremis circumstances, the District of Columbia National Guard’s capacity
    limits, faster response, and pay and benefits; exclude tactical employment details.
  span_range:
  - src:c00b7965bc08#p42.4
  - src:c00b7965bc08#p43.2
  decision: Defense leadership, with the consent of selected governors, chose to approve the urgent deployment of out-of-state
    National Guard personnel using verbal orders and Title 32 status.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The passage describes Army approvals without written requests and recommends requiring a request from an authorized
    civil authority showing that its capabilities have been or will be exhausted, with reimbursement agreed to except in dire
    circumstances. Focus on the approval threshold, statutory and delegated authority, and the balance between timely aid
    and accountability for military support costs. Exclude tactical deployment decisions and methods of suppressing violence.
  span_range:
  - src:c00b7965bc08#p53.2
  - src:c00b7965bc08#p53.3
  decision: The Secretary of the Army, as approval authority, decides whether to approve District of Columbia National Guard
    civil-support requests without a written request and full justification, except in dire circumstances.
