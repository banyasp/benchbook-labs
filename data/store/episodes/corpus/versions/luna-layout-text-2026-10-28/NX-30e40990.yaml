episodes:
- n: 1
  focus: The decision point is how to reconcile the interagency promotion requirement with departments’ protected authority
    over senior appointments. Focus on the choice to coordinate on promotions and preserve agency authorities while requiring
    qualifying interagency service; exclude the broader merits of joint duty and later recommendations for reform.
  span_range:
  - src:f1560e05f8f1#p3.5
  - src:f1560e05f8f1#p4.7
  decision: The DNI and IC agency leaders chose to implement the civilian joint-duty requirement through a voluntary, coordinated
    agreement and ICD 610, rather than claim unilateral control over agency personnel decisions.
  content_domain: other:intelligence-community personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is the 2007 refinement intended to address a stalled, agency-dependent assignment process while
    retaining coordination with the DNI on waivers. Focus on the leadership and authority arrangement and the reasons for
    it; exclude operational intelligence activities and the article’s later proposals for a broader succession-management
    system.
  span_range:
  - src:f1560e05f8f1#p6.3
  - src:f1560e05f8f1#p6.6
  decision: The DNI and Secretary of Defense chose to designate the Director of Defense Intelligence as a coordination and
    management mechanism for civilian joint duty, rather than rely solely on the decentralized post-and-pray process.
  content_domain: other:intelligence-community personnel policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
