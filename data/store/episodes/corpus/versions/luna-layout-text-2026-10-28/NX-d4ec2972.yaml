episodes:
- n: 1
  focus: The decision point is whether to continue trying to use the airport or switch to helicopters, following the attack
    and the ambassador’s own inspection. Keep the focus on the command decision and its rationale; exclude the mechanics of
    helicopter operations.
  span_range:
  - src:1b42d213c4f5#p12.1
  - src:1b42d213c4f5#p12.2
  decision: The US ambassador decided to proceed with a helicopter-only embassy evacuation after the airport runway was deemed
    unusable.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to reduce station staffing earlier or maintain it, amid a deteriorating situation and
    pressure from the former division chief to do more on evacuation. Focus on the judgment about timing and the perceived
    effects on US officials and Vietnamese; exclude evacuation procedures and logistics.
  span_range:
  - src:1b42d213c4f5#p13.3
  - src:1b42d213c4f5#p13.4
  decision: The Saigon chief of station decided not to begin reducing station personnel earlier, accepting the ambassador’s
    concern that doing so would cause panic.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to end the evacuation when the president wanted the ambassador to leave or continue
    it longer to get more people out. Focus on the ambassador’s stated reason and the limits imposed by the presidential order;
    exclude the physical details of how people were evacuated.
  span_range:
  - src:1b42d213c4f5#p14.3
  - src:1b42d213c4f5#p15.3
  decision: The US ambassador decided to delay ending the evacuation so more people could leave, until the president ordered
    him to depart.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
