- n: 2
  focus: The choice was whether to extend the deployment or withdraw while Kony remained uncaptured and the LRA threat persisted.
    The report says withdrawal before capture or the near-elimination of the threat would damage local perceptions and trust,
    while extension signaled U.S. commitment and was welcomed by African partners. Exclude the separate March 2014 augmentation
    and any operational details.
