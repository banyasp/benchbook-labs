- n: 1
  focus: The decision point is the choice to construct new, larger schools despite the document’s account that village schools
    were widespread and adequate for basic education. Examine the stated hearts-and-minds rationale against local usefulness,
    upkeep costs, and community benefit; exclude general conclusions about the campaign’s success.
  span_range:
  - src:06372e5e6856#p3.14
  - src:06372e5e6856#p4.25
  decision: Philippine and US authorities decided to build new schools as a hearts-and-minds project rather than prioritize
    existing schools or other local needs.
  content_domain: other:humanitarian-development policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is the commanders’ selection of a small sanitation project after considering local needs, village
    participation, local materials and expertise, and the burden of maintaining larger structures. The project also served
    counterinsurgency goals by building relationships and access; consider that policy tradeoff, but exclude tactical presence,
    intelligence collection, or other operational methods.
  span_range:
  - src:06372e5e6856#p6.8
  - src:06372e5e6856#p7.9
  decision: The AFP and US commanders decided to pursue a locally built outhouse project in Maimbung instead of a large project
    such as a new school complex.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the commander's choice to expand the project portfolio in parallel after nearby village leaders
    requested projects and some arranged volunteers and materials. The stated aims were to broaden AFP influence and keep
    insurgents uncertain about priorities; assess those aims and the resource choice, but exclude squad assignments, HUMINT
    tasking, or collection methods.
  span_range:
  - src:06372e5e6856#p9.4
  - src:06372e5e6856#p9.13
  decision: The AFP battalion commander decided to initiate four village outhouse projects simultaneously rather than proceed
    with a single project at a time.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
