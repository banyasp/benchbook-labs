  focus: The decision point is whether to institutionalize interagency participation in the command structure or retain the
    prior, frequently ad hoc approach. The stated reasons include the complexity of coordinating national-security objectives
    across the region and the aim of improving inclusion and alignment with U.S. foreign-policy objectives; exclude the command’s
    specific operational activities.
  span_range:
  - src:cdb02d6937c2#p38.4
  - src:cdb02d6937c2#p38.6
  decision: The Department of Defense and its interagency partners chose to establish USAFRICOM with an integrated interagency
    structure rather than continue relying on ad hoc coordination.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to remain or withdraw amid the perceived threat to personnel. The stated reason was
    that the organization’s vehicles had become indistinguishable from Coalition vehicles, which MSF believed increased danger
    to its representatives; exclude operational details beyond that policy rationale.
  span_range:
  - src:cdb02d6937c2#p73.3
  - src:cdb02d6937c2#p73.3
  decision: Doctors Without Borders leadership decided to withdraw its representatives from Afghanistan in summer 2004 rather
    than continue operating there.
