episodes:
- n: 1
  focus: 'The decision point is the 1946 allocation of authority: centralize missions considered more efficient to perform
    nationally, without subordinating departmental intelligence offices to the new group. Keep the focus on institutional
    authority and the stated concerns about efficiency and departmental autonomy; exclude operational methods.'
  span_range:
  - src:d5ee6963bf48#p12.3
  - src:d5ee6963bf48#p13.2
  decision: The National Intelligence Authority chose to assign the Central Intelligence Group a central role in foreign intelligence
    while leaving departmental analytical capabilities outside its control.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is Congress’s 1947 statutory settlement between a central agency and departmental autonomy, including
    the limits placed on the new Agency. The passage explains both the post-Pearl Harbor case for coordination and the concerns
    about concentrated power; exclude details of intelligence operations.
  span_range:
  - src:d5ee6963bf48#p10.4
  - src:d5ee6963bf48#p15.4
  decision: Congress chose to establish an independent Central Intelligence Agency with national intelligence and clandestine
    responsibilities, while preserving departmental intelligence organizations and denying the Agency policymaking and law-enforcement
    powers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the allocation of scarce intelligence resources between immediate tactical support and national
    strategic missions amid multiple overseas deployments and declining budgets. The stated rationale was to give commanders
    prompt, thorough intelligence to inform decisions and protect troops; exclude any operational methods of providing that
    support.
  span_range:
  - src:d5ee6963bf48#p22.1
  - src:d5ee6963bf48#p22.3
  decision: The President chose to make support for military operations the Intelligence Community’s first priority under
    the 1995 presidential directive.
  content_domain: other:intelligence resource prioritization
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is Congress’s choice not to replace the confederated arrangement with either greater decentralization
    or command authority for the DCI. The passage cites disagreement among stakeholders and concerns about preserving departmental
    and military autonomy and preventing concentrated political power; exclude the directives’ operational assignments and
    general descriptions of agency duties.
  span_range:
  - src:d5ee6963bf48#p26.2
  - src:d5ee6963bf48#p27.1
  decision: Congress declined sweeping reform of the Intelligence Community, leaving the decentralized system and the DCI’s
    limited coordinating authority in place.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is the Director’s appointment of a deputy with a community-wide coordination remit, which the
    President endorsed. The stated reasons are to identify ways to increase integration, reduce duplication, and improve coordination,
    with the work conducted in consultation with agency representatives; exclude the broader standing duties in the later
    directives.
  span_range:
  - src:d5ee6963bf48#p59.5
  - src:d5ee6963bf48#p59.6
  decision: The Director of Central Intelligence chooses to appoint a Deputy Director for Coordination to review integration,
    duplication, and coordination across the intelligence community.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to require reductions to current intelligence programs in response to constrained resources,
    and the President’s choice to order a joint budget review and specific cuts. Keep the focus on resource policy and the
    stated rationale that savings were urgent and collection accounted for the largest share of the intelligence budget; exclude
    operational collection methods and any later implementation details.
  span_range:
  - src:d5ee6963bf48#p90.4
  - src:d5ee6963bf48#p90.4
  decision: The President directs the Office of Management and Budget, the Director of Central Intelligence, and the Secretary
    of Defense to review the FY 1973 intelligence budget and propose specific reductions, with particular attention to tactical
    intelligence.
  content_domain: other:intelligence-resource-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
