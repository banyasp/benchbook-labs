- n: 1
  focus: The decision concerns whether to keep potentially compromised variables in use or replace them as a precaution. Focus
    on the risk to the security of systems if variables were compromised; exclude the technical details of the equipment and
    cryptography.
  span_range:
  - src:3d976afaf65f#p11.2
  - src:3d976afaf65f#p11.3
  decision: NSA decides to take all jeopardized variable keying materials out of use and supersede them as soon as possible.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision is between continued use without restrictions and warning holders and restricting use while replacement
    is pending. The stated constraint is that widespread use made immediate supersession impossible; exclude details of the
    cryptographic systems.
  span_range:
  - src:3d976afaf65f#p12.3
  - src:3d976afaf65f#p12.3
  decision: NSA decides to warn holders of operational codes and the authentication system and limit their use until replacements
    are available.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
