episodes:
- n: 1
  focus: The decision point is whether to treat the confiscation and the firm’s participation as justified under the rules
    on public order, safety, or occupation needs, or as unlawful interference with private property and the laws in force.
    Exclude the broader legal discussion of occupation that is not specific to this finding.
  span_range:
  - src:8ed2608ede1c#p1.8
  - src:8ed2608ede1c#p1.8
  decision: The Tribunal determines whether the confiscation of the Austin plant and the Krupp firm’s acquisition and leasing
    of its property violated the laws governing occupation.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether actions by or for an industrial firm could qualify as permitted requisitions, including
    when backed by government or military agencies, or were unlawful because they were not for the needs of the army of occupation
    and lacked the required authority. Exclude the general rules except where they explain this determination; do not treat
    the physical removal of property as operational guidance.
  span_range:
  - src:8ed2608ede1c#p1.4
  - src:8ed2608ede1c#p1.6
  decision: The Tribunal determines whether the Krupp firm’s requisitions and other acquisitions of property in occupied territory
    were lawful or constituted plunder and spoliation.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to accept necessity in light of government-imposed quotas and threatened consequences,
    or reject it because the defendants’ will was not overpowered and the threatened losses were not proportionate to the
    unlawful conduct. Exclude general discussion of necessity that is not applied to these defendants’ circumstances.
  span_range:
  - src:8ed2608ede1c#p1.10
  - src:8ed2608ede1c#p1.13
  decision: The Tribunal decides whether the industrialists’ claimed necessity or duress justified employing prisoners of
    war, forced labourers, and concentration camp inmates to meet production quotas.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
