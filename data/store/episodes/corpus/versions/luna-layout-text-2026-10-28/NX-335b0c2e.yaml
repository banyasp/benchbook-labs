- n: 2
  focus: The stated situation is a BCT bypassing enemy forces en route to its main objective, with a choice between treating
    the terrain and bypassed threats as part of the close-area fight or establishing a consolidation area to distinguish it
    from the decisive close fight. The passage favors the consolidation-area framework because it helps the BCT focus on the
    close fight and provides a way to consolidate gains; do not turn this into a scenario about how to conduct security or
    fires.
  span_range:
  - src:bb8595b6cbca#p152.2
  - src:bb8595b6cbca#p152.4
  decision: The BCT commander decides whether to designate bypassed terrain as a consolidation area rather than treat it as
    part of the close area.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The passage identifies circumstances in which the BCT may need all maneuver battalions in the close fight or the
    consolidation-area threat may be low, and contrasts assigning a combined-arms battalion with the proposed BEB-led model.
    It recommends the BEB with suitable attached assets and a C2 element, citing the BEB’s ability to secure LOCs and key
    terrain and provide staff synchronization when augmented; exclude tactical details of security operations.
  span_range:
  - src:bb8595b6cbca#p152.5
  - src:bb8595b6cbca#p153.2
  decision: The BCT commander decides which formation will lead the consolidation-area effort, including whether to assign
    the BEB with attached capabilities rather than commit a combined-arms battalion.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: During the transition from garrison to field operations, the passage describes locating the FTCP in the BSA as the
    doctrinally favored course and gives its force-protection, sustainment-synchronization, and communications benefits. It
    also notes that LSCO conditions may require detaching the FTCP to avoid concentrating forces and electromagnetic signatures;
    treat this as a location tradeoff, not a communications or concealment procedure.
  span_range:
