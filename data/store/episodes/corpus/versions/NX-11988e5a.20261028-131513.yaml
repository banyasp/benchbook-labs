episodes:
- n: 1
  focus: The doctrine frames the decision for commanders to either be centrally involved in planning or delegate it entirely.
    It states that commanders must be centrally involved and provides the rationale for this involvement.
  span_range:
  - src:2b498b324714#p3.2
  - src:2b498b324714#p3.2
  decision: Commanders must be centrally involved in planning, making planning a fundamental responsibility of command.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 2
  focus: The doctrine presents a decision point for planners to choose among three planning modes. It specifies which mode
    to use under given conditions and explains why.
  span_range:
  - src:2b498b324714#p45.4
  - src:2b498b324714#p48.4
  decision: Select the appropriate planning mode—commitment, contingency, or orientation—based on the level of uncertainty
    and planning horizon.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 3
  focus: The doctrine defines a decision about which tier of planning to conduct and who should lead each tier, providing
    the rationale for this division of labor.
  span_range:
  - src:2b498b324714#p42.4
  - src:2b498b324714#p44.5
  decision: Determine the level of planning (conceptual, functional, detailed) and assign responsibility—commander for conceptual,
    staff for functional and detailed.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 4
  focus: The doctrine advises planners to decide how far ahead to plan, warning against excessive foresight. It states the
    recommended action and the reasons for it.
  span_range:
  - src:2b498b324714#p30.5
  - src:2b498b324714#p32.3
  decision: Limit the planning horizon to avoid forecasting too far into the future, thereby preventing over‑detail and loss
    of relevance.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 5
  focus: The doctrine frames the decision of when to transition a planning product from a plan to an executable order, stating
    the condition and its purpose.
  span_range:
  - src:2b498b324714#p25.4
  - src:2b498b324714#p25.5
  decision: A plan becomes an order when it is directed for execution; until then it remains a plan.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 6
  focus: The doctrine states that planners should generally plan in greater detail for a deliberate attack than for a hasty
    attack, weighing uncertainty and time available. Excludes the actual execution techniques of the attack.
  span_range:
  - src:2b498b324714#p49.3
  - src:2b498b324714#p49.3
  decision: Planner decides the level of detail/specificity in a plan (deliberate attack vs hasty attack)
  content_domain: operational-command
  refusal_sensitivity: low
- n: 7
  focus: Guidance on choosing a planning horizon that balances preparedness and relevance, based on uncertainty and the phase
    of the operation. Does not describe specific operational steps.
  span_range:
  - src:2b498b324714#p49.4
  - src:2b498b324714#p49.4
  decision: Planner selects the appropriate planning horizon (close vs distant) for each mode of planning
  content_domain: operational-command
  refusal_sensitivity: low
- n: 8
  focus: The text directs planners to employ deliberate planning when sufficient time exists and rapid planning when time
    is short or there is an incentive to act quickly. Excludes the mechanics of the planning process itself.
  span_range:
  - src:2b498b324714#p51.5
  - src:2b498b324714#p52.2
  decision: Commander decides whether to use deliberate planning or rapid planning based on time availability
  content_domain: operational-command
  refusal_sensitivity: low
- n: 9
  focus: Guidance on selecting coupling style; tight coupling for actions requiring precise coordination, loose coupling for
    flexibility under uncertainty. Does not detail specific coordination mechanisms.
  span_range:
  - src:2b498b324714#p57.4
  - src:2b498b324714#p58.3
  decision: Planner chooses tight or loose coupling of plan elements based on the nature of the action and expected friction
  content_domain: operational-command
  refusal_sensitivity: low
- n: 10
  focus: Doctrine states that plans should be as simple as the situation allows, balancing the need for detail against flexibility
    and execution ease. Excludes the actual execution steps.
  span_range:
  - src:2b498b324714#p75.1
  - src:2b498b324714#p75.5
  decision: Planner decides the appropriate level of simplicity versus complexity in a plan
  content_domain: operational-command
  refusal_sensitivity: low
- n: 11
  focus: The text raises the trade‑off between generating/evaluating courses of action and preparing for execution, asking
    whether to prioritize one over the other. No explicit recommendation is given.
  span_range:
  - src:2b498b324714#p51.3
  - src:2b498b324714#p51.4
  decision: Planner allocates limited planning time between decision planning and execution planning
  content_domain: operational-command
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 12
  focus: The doctrine states that a commander may tap the intuitive skills of staff and use them to brainstorm or help articulate
    ideas, especially when the commander’s intent is vague. Exclude any discussion of how staff actually conduct the brainstorming;
    focus only on the decision to involve them.
  span_range:
  - src:2b498b324714#p94.4
  - src:2b498b324714#p95.2
  decision: Commander decides whether to involve staff members in brainstorming and articulating the commander’s ideas.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 13
  focus: The text warns that an isolated, autonomous planning staff is less effective and recommends close linkage with executors,
    ideally the same people. Exclude technical details of planning processes; focus on the authority‑structure decision.
  span_range:
  - src:2b498b324714#p95.3
  - src:2b498b324714#p95.3
  decision: Planner decides whether to keep the planning staff isolated with sole authority or to integrate it closely with
    executors.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 14
  focus: The doctrine says bypassing echelons should occur only by exception, and when it does both issuing and receiving
    commanders must notify intermediates promptly. Exclude the mechanics of the notification; focus on the decision to bypass
    or not.
  span_range:
  - src:2b498b324714#p95.5
  - src:2b498b324714#p95.5
  decision: Commander decides whether to bypass intermediate echelons of command when issuing orders.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 15
  focus: The text directs that directives should convey only the minimum instruction necessary, should not repeat training
    or standard procedure, and should not trespass on subordinates’ authority. Exclude the content of any specific directive;
    focus on the scope‑limiting decision.
  span_range:
  - src:2b498b324714#p96.3
  - src:2b498b324714#p96.4
  decision: Planner decides how much instruction to include in a directive, specifically whether to trespass on subordinates’
    province or repeat standard training.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 16
  focus: The doctrine states that directives should be as clear, simple, and concise as the situation permits, with greater
    brevity needed in urgent situations, and that oral orders are preferred when possible. Exclude the specific wording of
    orders; focus on the decision about level of detail.
  span_range:
  - src:2b498b324714#p96.5
  - src:2b498b324714#p96.5
  decision: Commander decides the level of brevity and simplicity required in directives, especially under urgent conditions.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 17
  focus: The doctrine advises that directives should contain a brief, unambiguous, compelling statement of intent to ensure
    subordinate initiative. Exclude the actual content of any statement; focus on the decision to include it.
  span_range:
  - src:2b498b324714#p97.3
  - src:2b498b324714#p97.3
  decision: Planner decides whether to include a brief statement of intent in an order.
  content_domain: operational-command
  refusal_sensitivity: low
