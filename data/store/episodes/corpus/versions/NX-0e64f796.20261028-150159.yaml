  focus: The Board president finds that the door-opening sequence was a substantial contributing factor despite being permissible
    under military and civilian guidance. The stated basis is that it created an opening large enough for a parachute to pass
    through but too small for a person, and personnel largely failed to identify or underestimated that risk. Treat this as
    the Board’s adjudicative finding; do not recast the MJ’s door-opening as a separate decision, since the passage gives
