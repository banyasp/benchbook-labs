episodes:
- n: 1
  focus: In spring and summer 1941, the FBI Director sought to transfer the SIS, and later authorized his deputy to pursue
    a proposal giving the Navy responsibility for Mexico. The stated considerations included avoiding duplicated coverage
    and freeing FBI agents for other work; exclude the operational details of intelligence activity. The Navy ultimately rejected
    the proposal.
  span_range:
  - src:18ce92e50f87#p8.3
  - src:18ce92e50f87#p9.1
  decision: The FBI Director recommended transferring the SIS from the FBI to the Office of Naval Intelligence or the Military
    Intelligence Division, including offering the Navy full responsibility for Mexico.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: At the end of 1941, the FBI Director urged a complete transfer rather than divided responsibility or continued FBI
    control. He argued that the work was delicate, that one agency should be responsible, and that divided authority risked
    buck-passing; exclude operational details of the SIS’s work.
  span_range:
  - src:18ce92e50f87#p10.19
  - src:18ce92e50f87#p11.2
  decision: The FBI Director recommended that the Attorney General relieve the FBI of all SIS responsibility and place it
    with the Coordinator of Information’s organization.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: In summer 1942, reported overlap and confusion between the organizations prompted the FBI Director to tell the head
    of Military Intelligence that he was willing to withdraw. The stated considerations included avoiding a fight over prerogatives
    and the FBI’s existing responsibilities; exclude the agents’ recruitment and other operational details.
  span_range:
  - src:18ce92e50f87#p11.11
  - src:18ce92e50f87#p12.13
  decision: The FBI Director offered to withdraw the FBI entirely from Latin America in response to conflicts between SIS
    and military attachés operating under the American Intelligence Command.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: In 1945, the FBI Director urged the Attorney General to expand the Bureau’s intelligence role rather than limit it
    to the Western Hemisphere. He grounded the proposal in the SIS’s reported success and the FBI’s experience; distinguish
    this policy proposal from its eventual rejection, and exclude operational details of SIS activities.
  span_range:
  - src:18ce92e50f87#p13.11
  - src:18ce92e50f87#p14.2
  decision: The FBI Director proposed extending the FBI’s Western Hemisphere intelligence system to worldwide coverage after
    the war.
  content_domain: intel-oversight
  refusal_sensitivity: medium
