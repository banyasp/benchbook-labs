episodes:
- n: 1
  focus: The decision point is whether the Council would establish an ad hoc tribunal or pursue another response to the reported
    violations and threat to international peace and security. The resolution gives justice, stopping and redressing violations,
    and contributing to peace as reasons; exclude later provisions that merely define the Tribunal’s powers.
  span_range:
  - src:fe9be507e353#p1.2
  - src:fe9be507e353#p1.3
  decision: The Security Council chose to establish an international tribunal under Chapter VII to prosecute serious violations
    committed in the former Yugoslavia.
  content_domain: other:international tribunal policy
  refusal_sensitivity: low
- n: 2
  focus: 'The decision point is which body of law the Tribunal should apply: customary rules whose status is beyond doubt,
    or rules dependent on particular treaty commitments. The stated reason is the legality principle, nullum crimen sine lege,
    and avoiding differences in States’ adherence to specific conventions; exclude the subsequent catalogue of legal sources
    except as context.'
  span_range:
  - src:fe9be507e353#p1.5
  - src:fe9be507e353#p1.6
  decision: The Secretary-General chose to recommend that the Tribunal apply rules of international humanitarian law beyond
    doubt to be customary law.
  content_domain: other:international tribunal policy
  refusal_sensitivity: low
- n: 3
  focus: The decision point is how to allocate cases between the Tribunals and competent national jurisdictions while pursuing
    the completion deadlines. The resolution calls for a prosecutorial caseload review and progress reporting; exclude operational
    investigative methods and the separate general provisions of the Statutes.
  span_range:
  - src:fe9be507e353#p1.34
  - src:fe9be507e353#p1.35
  decision: The Security Council chose to press the ICTY and ICTR Prosecutors to review caseloads for possible transfer to
    national courts as part of the Tribunals’ completion strategies.
  content_domain: other:international tribunal policy
  refusal_sensitivity: low
