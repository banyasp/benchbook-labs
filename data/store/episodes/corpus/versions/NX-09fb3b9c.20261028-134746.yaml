- n: 1
  focus: The decision point is whether to rely on existing, inconsistently implemented and largely self-certified requirements
    or require measurable third-party assessment across the defense industrial base. The report gives the rationale—gaps in
    protection of controlled information and inconsistent practices—and describes certification levels, subcontractor flow-down,
    and phased implementation. Exclude general C-SCRM recommendations and the technical details of CMMC controls.
  span_range:
  - src:2b2a5334cbfe#p55.3
  - src:2b2a5334cbfe#p57.2
  decision: DoD acquisition authorities chose to require CMMC certification at the appropriate level as a condition of contract
    award, replacing contractors’ self-attestation.
  content_domain: cyber-policy
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is the Joint Staff’s 2016 warning, in light of concerns that Lenovo devices could introduce compromised
    hardware and facilitate Chinese cyber intelligence gathering. Treat the outcome as a warning against purchase, not as
    a binding procurement ban; exclude technical details about how a compromise might be carried out.
  span_range:
  - src:2b2a5334cbfe#p65.2
  - src:2b2a5334cbfe#p65.3
  decision: The Pentagon’s Joint Staff decided to warn DOD and its personnel against purchasing Lenovo computers.
  content_domain: cyber-policy
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is the 2017 call to accelerate DOD-wide cloud adoption rather than proceed at the existing pace.
    The stated rationale is modernization and ready access to data as a warfighting advantage; do not attribute later-described
    hypothetical attack scenarios as considerations the Deputy Secretary personally weighed.
  span_range:
  - src:2b2a5334cbfe#p75.2
  - src:2b2a5334cbfe#p75.2
  decision: The Deputy Secretary of Defense decided to call for accelerated adoption of an enterprise-wide DOD cloud-services
    solution.
  content_domain: cyber-policy
  refusal_sensitivity: medium
