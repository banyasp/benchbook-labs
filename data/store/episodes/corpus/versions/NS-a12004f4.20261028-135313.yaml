episodes:
- n: 1
  focus: The NIC faced a congressional requirement for a comprehensive estimate and chose a series of three estimates to make
    the task more manageable. Frame the issue as analytic scope and workload, not as a judgment about Iran’s nuclear intentions
    or capabilities.
  span_range:
  - src:7435c1c4677b#p11.2
  - src:7435c1c4677b#p11.3
  decision: The National Intelligence Council chose to produce three Iran estimates rather than one comprehensive estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is whether to proceed on the existing draft or pause to evaluate and cross-check the new information,
    then revisit prior assessments. Keep the focus on analytic reliability and uncertainty; exclude any details about collection
    methods.
  span_range:
  - src:7435c1c4677b#p12.3
  - src:7435c1c4677b#p12.5
  decision: The NIC estimate team delayed completion and reassessed its judgments after significant new information emerged
    in 2007.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 3
  focus: The choice was whether to keep the key judgments classified or release them publicly. The stated considerations included
    explaining a changed intelligence assessment after years of using assessments to persuade other countries, the likelihood
    of leaks, and the desire to shape public reporting; exclude speculation about whether the estimate was politically motivated.
  span_range:
  - src:7435c1c4677b#p13.2
  - src:7435c1c4677b#p13.3
  decision: The President chose to declassify and release the key judgments despite the prior expectation that they would
    remain classified.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: Treat this as an estimative decision among competing assessments of whether the program had halted and why. The estimate
    cites exposure of previously undeclared nuclear work and assesses that Tehran’s choices reflected costs and benefits;
    retain its confidence limits and exclude operational details of nuclear activities.
  span_range:
  - src:7435c1c4677b#p24.2
  - src:7435c1c4677b#p25.7
  decision: The intelligence community’s 2007 Iran estimate judged that Tehran halted its nuclear weapons program in fall
    2003, primarily in response to international scrutiny and pressure.
  content_domain: intel-analysis
  refusal_sensitivity: medium
