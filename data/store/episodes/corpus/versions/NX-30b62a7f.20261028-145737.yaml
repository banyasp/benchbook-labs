prompt: find_episodes.v1+316fb02bdef3
episodes:
- n: 1
  focus: The directive permits emergency authorization when delay risks losing significant foreign intelligence and substantially
    harming national security, or when a person’s life or physical safety or government property is in immediate danger; it
    also specifies probable-cause, notification, and follow-up approval requirements. Frame this as a choice between waiting
    for prior approval and authorizing under the stated emergency authority. Exclude any technical means of collection.
  span_range:
  - src:8d3b89fe949d#p7.9
  - src:8d3b89fe949d#p9.9
  decision: DIRNSA/CHCSS decides whether to authorize emergency collection of information to, from, or about a U.S. person
    outside the United States when prior Attorney General approval is impractical.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The directive sets destruction of inadvertently intercepted communications solely between U.S. persons as the baseline,
    then permits a waiver for specified kinds of information. Frame the choice as destruction versus waiver under those criteria,
    and exclude any operational details of interception or processing.
  span_range:
  - src:8d3b89fe949d#p13.7
  - src:8d3b89fe949d#p14.5
  decision: DIRNSA/CHCSS decides whether to waive destruction of covered communications when they contain specified foreign-intelligence,
    crime or serious-harm, or communications-security information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The default is to omit the identity, but the directive allows identification under specified conditions and when
    the recipient needs it for official duties; it also assigns approval authority according to the circumstances. Frame the
    decision around that privacy-versus-intelligence or official-duty standard, and exclude any operational collection details.
  span_range:
  - src:8d3b89fe949d#p16.3
  - src:8d3b89fe949d#p18.9
  decision: The authorized approval official decides whether a SIGINT report may identify a U.S. person rather than use a
    generic description.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The procedure requires immediate termination and bars resumption unless subsequently approved under the Act; personnel
    must alert NSA's Office of General Counsel to information indicating a material change. Focus on the legal authority to
    continue or resume surveillance, not collection methods.
  span_range:
  - src:8d3b89fe949d#p32.16
  - src:8d3b89fe949d#p32.16
  decision: Collection or processing personnel must decide whether to terminate an electronic surveillance when they have
    reason to believe the target no longer qualifies or no longer occupies the authorized premises.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The procedure sets prompt destruction as the default but permits dissemination for specified foreign-intelligence,
    crime-evidence, or technical-database grounds. Focus on the legal minimization and disclosure decision; exclude collection
    and technical processing.
  span_range:
  - src:8d3b89fe949d#p33.8
  - src:8d3b89fe949d#p34.1
  decision: NSA personnel must decide whether to destroy a domestic communication or disseminate it under an enumerated exception.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The procedure favors de-identification, while allowing identified dissemination only to an official-duty recipient
    when a listed criterion is met. Focus on the privacy, need-to-know, and legal grounds for including an identity; exclude
    how information is collected.
  span_range:
  - src:8d3b89fe949d#p35.3
  - src:8d3b89fe949d#p36.1
  decision: An intelligence-report recipient must decide whether a U.S. person's identity may be included or must be removed
    and replaced with a generic term or symbol.
  content_domain: intel-oversight
  refusal_sensitivity: medium
