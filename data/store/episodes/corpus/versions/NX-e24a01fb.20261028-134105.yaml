episodes:
- n: 1
  focus: The decision point is the Director’s choice between accepting the defensive explanation and continuing to warn that
    the installations could facilitate a later offensive missile deployment. The Director’s stated reasons include the possibility
    that defenses could make later preparations harder to detect and that acting after a deployment could pose unacceptable
    dangers; exclude the operational details of reconnaissance.
  span_range:
  - src:8f205e90c33a#p35.7
  - src:8f205e90c33a#p37.4
  decision: The Director of Central Intelligence maintains a warning judgment that Soviet defensive installations in Cuba
    could precede deployment of offensive missiles, despite the Board of National Estimates’ contrary assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: The decision is whether to use CIA covert resources to support the negotiations or refrain; the Director identifies
    the congressional commitments as precluding their use and says he should not meet with the negotiator. Keep the focus
    on authority and oversight, not on any covert methods.
  span_range:
  - src:8f205e90c33a#p43.6
  - src:8f205e90c33a#p43.7
  decision: The Director of Central Intelligence decides that the CIA will not use covert resources for the prisoner-release
    negotiations under the existing commitments to congressional committees.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision was whether to keep the information broadly disseminated or tightly restricted pending the presidential
    briefing; the President chose restriction and prohibited action based on it. Focus on the authority and balance between
    briefing needs and wider access, not on the underlying intelligence collection.
  span_range:
  - src:8f205e90c33a#p51.5
  - src:8f205e90c33a#p51.6
  decision: The President restricted access to Cuba-related information to a minimum need-to-know group preparing his briefing
    and directed that no action be taken on the information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is whether to revise the estimate after the Director of Central Intelligence urged careful reconsideration,
    or retain the already approved conclusion. The document records the judgment’s stated strategic-risk rationale and that
    no change was made; exclude operational reconnaissance details.
  span_range:
  - src:8f205e90c33a#p58.7
  - src:8f205e90c33a#p60.5
  decision: The intelligence community left unchanged its estimate that Soviet introduction of medium- or intermediate-range
    ballistic missiles in Cuba was unlikely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 5
  focus: The decision point is the analysts’ choice among competing interpretations of the site and the evidence supporting
    a coastal-defense assessment. Exclude technical descriptions of missile capabilities; the focus is the estimate and its
    rationale.
  span_range:
  - src:8f205e90c33a#p85.3
  - src:8f205e90c33a#p86.2
  decision: CIA analysts judged the Banes site more likely to be a short-range coastal-defense missile installation than a
    site for the other missile systems considered.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 6
  focus: The decision point is the estimate of the buildup’s principal purpose, including the competing possibility that an
    offensive base could provoke US intervention. Keep the focus on the assessment and its stated reasoning, not on military
    capabilities or responses.
  span_range:
  - src:8f205e90c33a#p100.4
  - src:8f205e90c33a#p100.5
  decision: The US intelligence-estimating community assessed that the main purpose of the Soviet military buildup in Cuba
    was to strengthen the Cuban regime against a perceived threat of US overthrow.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: The decision point is whether to continue the existing, cautious posture or move toward a more active approach; the
    group chose to seek new approaches and revise its guidelines. The stated context includes dissatisfaction with lack of
    progress and concern about hesitation over actions attributable to the United States. Exclude the specific operational
    proposals discussed in the memorandum.
  span_range:
  - src:8f205e90c33a#p116.7
  - src:8f205e90c33a#p118.2
  decision: The Special Group decided that the existing Phase Two approach to the Cuba program was inadequate and directed
    development of more dynamic policy options.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 8
  focus: The President requested qualified wording because the photographs showed crates, not the bombers themselves, and
    the Director of Central Intelligence agreed. Keep the scenario focused on how to characterize uncertain intelligence;
    exclude the separate question of delaying publication for electoral reasons.
  span_range:
  - src:8f205e90c33a#p126.7
  - src:8f205e90c33a#p126.7
  decision: The President and the Director of Central Intelligence decide to describe the photographic evidence as indicating
    a probability, rather than confirming the presence of bombers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 9
  focus: The President sought suppression of future information amid concern that disclosure would inject a more violent Cuba
    issue into the election campaign; the Director of Central Intelligence warned that suppression was dangerous. The resulting
    arrangement limited access while keeping senior advisers and specified officials informed; exclude operational details
    about intelligence collection.
  span_range:
  - src:8f205e90c33a#p126.7
  - src:8f205e90c33a#p127.3
  decision: The President and the Director of Central Intelligence agree to restrict distribution of subsequent Cuba intelligence
    to officials responsible for advising the President, rather than suppressing it outright or broadly disseminating it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 10
  focus: The Director of Central Intelligence was concerned about the negotiator’s personal safety amid publicity and directed
    that contact be made; he concluded the negotiator should be brought out unless talks were going well. The Attorney General
    expressed less concern about the safety risk, creating a decision point about whether to continue the negotiations or
    withdraw the negotiator; exclude covert-communication methods.
  span_range:
  - src:8f205e90c33a#p128.3
  - src:8f205e90c33a#p128.4
  decision: The Director of Central Intelligence decides to bring the negotiator out of Cuba unless the negotiations are progressing
    satisfactorily.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 11
  focus: The Attorney General chose daily meetings, with the possibility of reducing their frequency later, after the President’s
    dissatisfaction with the operation’s limited results. Frame the decision around oversight intensity and accountability;
    exclude details of proposed sabotage or other operational actions.
  span_range:
  - src:8f205e90c33a#p153.6
  - src:8f205e90c33a#p154.3
  decision: The Attorney General decides to increase personal oversight of Operation Mongoose by holding daily meetings with
    its agency representatives.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 12
  focus: This is the CIA Director’s stated recommendation among possible responses to the missile deployment. Focus on the
    choice to warn before using force and the reasons given, including the need to address the buildup while avoiding the
    lasting charge of a surprise attack; exclude operational details about strike targets or execution.
  span_range:
  - src:8f205e90c33a#p161.5
  - src:8f205e90c33a#p162.10
  decision: The CIA Director recommends warning Soviet and Cuban leaders and, if they do not comply, taking military action
    against the buildup.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 13
  focus: The memorandum describes a probable policy choice, not a final presidential order. Focus on why the group favored
    a limited, adjustable measure and weighed its legal framing and political risks; exclude surveillance details and any
    operational implementation of the blockade.
  span_range:
  - src:8f205e90c33a#p190.4
  - src:8f205e90c33a#p191.6
  decision: The principals’ group indicates a probable choice of a limited blockade to prevent further arms imports, while
    reserving more extreme action for later developments.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 14
  focus: The meeting weighs the limits of an air strike and the risk that warning could lead to missile movement; the military
    advisers say a strike cannot assure destruction of all missiles. Focus on the policy choice about the scale of military
    action, and exclude the specific target package and strike planning.
  span_range:
  - src:8f205e90c33a#p235.4
  - src:8f205e90c33a#p235.8
  decision: The senior national-security meeting decides that contemplated military action against Cuba must include an invasion
    and occupation, rather than relying on an air strike alone.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 15
  focus: The reported recommendation weighs the military advantage of surprise against the broader consequences of a surprise
    attack, including condemnation, heightened tensions, and the precedent it could set for other states. Exclude the operational
    details of any later air strikes or invasion.
  span_range:
  - src:8f205e90c33a#p237.5
  - src:8f205e90c33a#p238.2
  decision: The former president recommends that the President reject a surprise attack in favor of a blockade, surveillance,
    and notice of possible subsequent military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 16
  focus: The memorandum records his preference for an unannounced strike, his view that a blockade would be ineffective, and
    his eventual reluctant agreement after learning of the former president’s support for the proposed plan. Keep the focus
    on the policy choice and stated rationale; exclude strike or invasion planning details.
  span_range:
  - src:8f205e90c33a#p239.7
  - src:8f205e90c33a#p239.10
  decision: The Vice President, after favoring an unannounced strike, reluctantly agrees with the proposed blockade-first
    course of action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 17
  focus: The President weighed a blockade against doing nothing and stronger military action, including a strike or invasion,
    while recognizing the risk that missiles might be fired and that the Soviet Union could respond elsewhere, especially
    in Berlin. The record says the blockade would give the other side a chance to pause and that doing nothing would be a
    serious mistake; keep the focus on the policy choice and its risks, not blockade procedures or military planning.
  span_range:
  - src:8f205e90c33a#p265.9
  - src:8f205e90c33a#p266.3
  decision: The President chose a naval blockade of Cuba as the initial response rather than immediate military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 18
  focus: The evaluators chose between two assessments of Soviet deployment intent, citing comparative photographic coverage.
    Treat this as an intelligence judgment about readiness and intent; exclude technical details about missile systems or
    site identification.
  span_range:
  - src:8f205e90c33a#p254.5
  - src:8f205e90c33a#p254.9
  decision: The joint intelligence evaluators assessed that the Soviet objective in Cuba was full operational capability at
    all sites as soon as possible, rather than emergency launch capability as equipment arrived.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 19
  focus: After discussion of a possible summit, the President agreed that a meeting would be useless until the rules of the
    confrontation were established and that the next 14 hours could bring important developments. Focus on the diplomatic
    timing choice and its stated rationale, not on any undisclosed negotiations or operational details.
  span_range:
  - src:8f205e90c33a#p285.6
  - src:8f205e90c33a#p286.2
  decision: The President agreed to wait for developments in the ship confrontation rather than pursue a summit meeting immediately.
  content_domain: other:diplomacy
  refusal_sensitivity: low
- n: 20
  focus: The committee weighed boarding Soviet ships against allowing them to proceed under surveillance; the GROZNY’s deck
    cargo might be missile field tanks, while the BUCHAREST reported petroleum as its cargo. Keep the scenario at the level
    of the decision to enforce the quarantine by boarding, not the mechanics of interception or boarding.
  span_range:
  - src:8f205e90c33a#p292.7
  - src:8f205e90c33a#p292.7
  decision: The Executive Committee decided that the Navy would board the next Soviet ship contacted, the GROZNY, but not
    board the BUCHAREST.
  content_domain: targeting
  refusal_sensitivity: high
- n: 21
  focus: The decision weighs sharing information to support the U.S. representative’s UN effort against the need to protect
    intelligence sources. Exclude the logistics of preparing or delivering the briefing.
  span_range:
  - src:8f205e90c33a#p327.6
  - src:8f205e90c33a#p327.7
  decision: The CIA Director authorized releasing relevant intelligence on the Cuban buildup to the U.S. representative at
    the United Nations, while protecting intelligence sources.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 22
  focus: The decision point is whether missile removal alone should suffice or whether the U.S. position should also address
    the risk of leaving Castro able to sustain a subversive threat to other Latin American nations. Keep the scenario focused
    on the diplomatic position and its stated rationale, not on operational measures against Cuba.
  span_range:
  - src:8f205e90c33a#p327.8
  - src:8f205e90c33a#p327.10
  decision: The CIA Director directed the agency’s contribution to the proposed reply to Khrushchev to oppose a settlement
    that left Castro a sanctuary.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: medium
- n: 23
  focus: The decision was to limit dissemination while continuing collection and analysis, with the aim of controlling sensitive
    information and ensuring it reached officials with a need to know. Exclude the intelligence community’s later misinterpretation
    and failures to transmit reports except as consequences of the policy.
  span_range:
  - src:8f205e90c33a#p348.6
  - src:8f205e90c33a#p349.3
  decision: The President restricted publication of information about suspected offensive weapons in Cuba to designated recipients.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 24
  focus: The decision point is the estimators’ judgment about the likelihood of deployment despite available indicators and
    an acknowledged contingency that warranted careful examination. Focus on how they weighed indicators against assumptions
    about Soviet policy; exclude later hindsight as if it had been available at the time.
  span_range:
  - src:8f205e90c33a#p345.5
  - src:8f205e90c33a#p345.6
  decision: The intelligence estimators issued the September 19 assessment that Soviet deployment of medium- and intermediate-range
    ballistic missiles in Cuba was unlikely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
