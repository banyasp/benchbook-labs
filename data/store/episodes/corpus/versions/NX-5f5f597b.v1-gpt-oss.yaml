episodes:
- n: 1
  focus: The decision point is the issuance of formal instructions to the Attorney General, reflecting a choice to seek legal
    advice now rather than later, and the reasons for delaying an immediate answer.
  span_range:
  - src:c1a1d9c95786#p8.5
  - src:c1a1d9c95786#p8.5
  decision: Government decides to issue formal instructions to the Attorney General on 9 December 2002 to provide legal advice
    on the basis for military action, specifying that an immediate response is not required.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the Cabinet’s political stance on whether a second UN resolution is required; the Foreign Secretary
    chooses to assert that it is not required, providing the rationale for swift action.
  span_range:
  - src:c1a1d9c95786#p15.4
  - src:c1a1d9c95786#p15.5
  decision: Foreign Secretary states in the 14 November 2002 Cabinet meeting that the key aspect of UN Security Council resolution 1441
    is that military action could be taken without a further resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the choice to include in the instructions to the Attorney General that “No advice is required
    now”, thereby delaying formal legal advice despite ongoing policy development.
  span_range:
  - src:c1a1d9c95786#p34.8
  - src:c1a1d9c95786#p34.9
  decision: Senior Legal Adviser, Foreign and Commonwealth Office decides whether to request the Attorney General’s legal
    advice on the use of force now or to defer it.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The draft advice of 14 January 2003 concludes that resolution 1441 does not, by itself, revive the 1990 authorisation
    and that a further Council decision (not necessarily a resolution) is needed.
  span_range:
  - src:c1a1d9c95786#p40.7
  - src:c1a1d9c95786#p40.9
  decision: Attorney General decides that a further Security Council decision is required before the 1990 authorisation to
    use force can be revived.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The Prime Minister acknowledges that while preparations began early, the government could not take action without
    the Attorney General’s advice confirming legality.
  span_range:
  - src:c1a1d9c95786#p36.8
  - src:c1a1d9c95786#p36.9
  decision: Prime Minister decides that formal legal advice from the Attorney General must be obtained before proceeding with
    military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The passage records Lord Goldsmith’s legal analysis of the UN Charter and resolution 1441, weighing the possibility
    of a P5 veto against the need for a subsequent Council resolution. He concludes that without a new Council decision there
    is no legal basis for military action, thereby setting the policy stance on the legality of force.
  span_range:
  - src:c1a1d9c95786#p45.8
  - src:c1a1d9c95786#p45.10
  decision: Attorney General (Lord Goldsmith) decides that a further UN Security Council decision is required before the use
    of force can be lawfully authorised under resolution 1441.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: During parliamentary statements and Prime Minister’s Questions, the Prime Minister asserts that, despite preferring
    a second resolution, the UK would still act if a material breach is recognised and a veto is deemed unreasonable. This
    reflects a policy choice between waiting for a second resolution and proceeding without it.
  span_range:
  - src:c1a1d9c95786#p47.6
  - src:c1a1d9c95786#p47.11
  decision: Prime Minister (office of the Prime Minister) decides to publicly state that the UK will not rule out military
    action if a second UN resolution is vetoed.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: Lord Goldsmith proposes that the former UN Legal Adviser be consulted to obtain a fuller picture of the negotiation
    history and alternative legal arguments. The decision involves whether to incorporate external expertise into the legal
    assessment of the UN resolution.
  span_range:
  - src:c1a1d9c95786#p46.8
  - src:c1a1d9c95786#p46.9
  decision: Attorney General (Lord Goldsmith) decides to seek external legal advice by arranging a meeting with the former
    UN Legal Adviser on the interpretation of resolution 1441.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The Prime Minister faced the choice of either telling the US President about the internal legal advice that a further
    Security Council resolution was needed, or withholding that information to preserve political cohesion and avoid a coalition
    collapse. He elected to withhold the advice, citing political implications, the need to keep maximum pressure on Iraq,
    and the risk of a political catastrophe if doubts were raised.
  span_range:
  - src:c1a1d9c95786#p66.7
  - src:c1a1d9c95786#p66.12
  decision: Prime Minister chose not to inform the US President that legal advice required a second UN resolution before authorising
    force
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The Government Legal Adviser evaluated whether to rely on a second UN resolution or to argue that resolution 1441
    alone revived the authority for force. He concluded that seeking an additional resolution was the safest legal route,
    emphasizing the need to avoid undermining the legal case and to provide clear authority for action.
  span_range:
  - src:c1a1d9c95786#p85.8
  - src:c1a1d9c95786#p85.10
  decision: Lord Goldsmith advised that the safest legal course was to secure a further Security Council resolution before
    using force
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 11
  focus: Faced with legal advice stating a second resolution was necessary, the Minister chose to contest that advice, arguing
    that ministers are not bound by departmental legal advisers when reasonable contrary views exist. He emphasized constitutional
    principles of ministerial responsibility and the danger of a doctrine that would give undue power to legal advisers.
  span_range:
  - src:c1a1d9c95786#p73.10
  - src:c1a1d9c95786#p73.13
  decision: Foreign Secretary decided to challenge the legal advice that a second UN resolution was required and to assert
    ministerial right to weigh alternative legal views
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 12
  focus: The Attorney General evaluates the ‘reasonable case’ that resolution 1441 can revive the authorisation in resolution
    678 based on negotiating history, US arguments, and evidence of Iraq’s non‑compliance. He concludes that a reasonable
    case exists, but notes the need for strong factual grounds.
  span_range:
  - src:c1a1d9c95786#p105.5
  - src:c1a1d9c95786#p105.6
  decision: Attorney General decides whether resolution 1441 alone provides sufficient legal authority to use force without
    a second UN resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 13
  focus: The Prime Minister proposes to the US President that, even without a second resolution, the UK could legally and
    politically participate in action if nine votes are obtained, accepting the risk of a French veto. He frames this as an
    acceptable course given the failure to secure a second resolution.
  span_range:
  - src:c1a1d9c95786#p94.5
  - src:c1a1d9c95786#p94.9
  decision: Prime Minister decides whether to proceed with military action if nine Security Council votes are secured despite
    a possible French veto.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 14
  focus: The Permanent Under‑Secretary highlights uncertainty over the UN scenario and the need for full UN cover. He recommends
    a meeting of senior ministers (including the Attorney General and Defence Secretary) so that the Chief of the Defence
    Staff receives a lawful instruction.
  span_range:
  - src:c1a1d9c95786#p95.5
  - src:c1a1d9c95786#p95.9
  decision: Permanent Under‑Secretary of State for Defence advises the Prime Minister to convene a special ‘war’ cabinet to
    obtain clear legal and constitutional authorisation before any offensive operation.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 15
  focus: The Attorney General faced the choice of either requiring a second resolution to authorise military action or relying
    on the existing resolution 1441 and the revival doctrine. He chose the latter, stating that the legal arguments and material
    breach findings met the threshold for a lawful use of force. This decision underpinned the government's ‘green‑light’
    for the invasion.
  span_range:
  - src:c1a1d9c95786#p108.5
  - src:c1a1d9c95786#p108.7
  decision: Attorney General concluded on 13 March 2003 that there was a lawful basis for the use of force without a further
    UN Security Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 16
  focus: Faced with the risk of a French (or other P5) veto, the Foreign Secretary could either continue to seek a second
    resolution and risk diplomatic fallout, or halt that effort and proceed on the basis of the existing resolution. The choice
    was to rely on 1441, arguing that a veto defeat would damage the UK's moral standing and make parliamentary approval harder,
    while a strategy based on 1441 would be politically safer.
  span_range:
  - src:c1a1d9c95786#p116.5
  - src:c1a1d9c95786#p116.9
  decision: Foreign Secretary advised on 11 March 2003 not to push a second UN resolution if nine votes could not be secured,
    opting to rely on resolution 1441 as the legal basis.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 17
  focus: The diplomatic team could either continue pressing the original resolution 1441 text or modify the approach by introducing
    a revised draft and side‑statement to keep Council engagement alive. The chosen course was the revised approach, arguing
    it would maintain pressure, avoid a deadlock, and buy time for further negotiations.
  span_range:
  - src:c1a1d9c95786#p120.6
  - src:c1a1d9c95786#p120.9
  decision: UK Permanent Representative recommended on 12 March 2003 to table a revised draft UN resolution and a side‑statement
    with six tests, rather than persisting with the original draft.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 18
  focus: The passage records Lord Goldsmith’s shift from offering a ‘reasonable case’ to stating that the use of force is
    lawful, driven by requests from the Chief of Defence Staff and the Civil Service for a clear yes/no answer. It shows the
    options (maintain a cautious reasonable‑case view vs adopt a definitive lawful stance), the authority (Attorney General’s
    legal advice to the Government), and the reasons (need for operational certainty, political pressure, and the difficulty
    of obtaining a second resolution).
  span_range:
  - src:c1a1d9c95786#p129.4
  - src:c1a1d9c95786#p131.16
  decision: Attorney General (Lord Goldsmith) decides to give a definitive legal opinion that the existing UN resolutions
    (including 1441) provide a sufficient legal basis for the use of force without a second Security Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 19
  focus: The excerpt describes the Chiefs of Staff discussing the legal basis and collectively agreeing to request the Attorney
    General’s assurances, mirroring a similar request made for Kosovo. The decision involves the option to proceed without
    formal legal confirmation versus obtaining a written assurance, with the authority lying in the Attorney General’s legal
    opinion and the interest in operational legitimacy.
  span_range:
  - src:c1a1d9c95786#p129.6
  - src:c1a1d9c95786#p129.9
  decision: Chiefs of Staff (including the Chief of the Defence Staff) decide to seek formal legal assurance from the Attorney
    General that the proposed military action would be in accordance with national and international law.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 20
  focus: The passage records Lord Goldsmith’s written response to a parliamentary question, where he chose to disclose the
    Government’s view that the authority to use force existed under resolutions 678, 687 and 1441. The decision contrasts
    with the usual confidentiality of legal advice and reflects weighing public demand, parliamentary scrutiny, and the convention
    of keeping law‑officer advice private.
  span_range:
  - src:c1a1d9c95786#p147.2
  - src:c1a1d9c95786#p148.12
  decision: Attorney General (Lord Goldsmith) decides to publish a Written Answer on 17 March 2003, publicly stating the legal
    basis for the use of force against Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 21
  focus: The Cabinet met at 16:00 on 17 March 2003 and endorsed the decision to issue an ultimatum to Saddam Hussein and to
    ask the House of Commons to endorse the use of military force. The choice was between continuing diplomatic efforts (seeking
    a further UN resolution) and proceeding with force under the legal basis of UN resolutions 678, 687 and 1441. Reasons
    cited include Iraq’s material breach, the French veto, and the need to maintain UN authority.
  span_range:
  - src:c1a1d9c95786#p152.7
  - src:c1a1d9c95786#p152.9
  decision: Cabinet (17 March 2003) decided to give Saddam Hussein an ultimatum and to seek parliamentary approval for military
    action against Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 22
  focus: Lord Goldsmith, the Attorney General, decided whether to give Cabinet the complete, balanced legal advice on the
    authority to use force or to provide a brief, unqualified answer framed as a Parliamentary Question. The decision was
    motivated by concerns about leaks, the desire for a clear yes/no answer, and political considerations about timing and
    the military’s need for certainty.
  span_range:
  - src:c1a1d9c95786#p155.4
  - src:c1a1d9c95786#p155.6
  decision: Lord Goldsmith chose to present a concise Parliamentary Question‑style answer rather than the full detailed legal
    opinion to Cabinet.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 23
  focus: Facing a French veto and diplomatic dead‑lock, the Prime Minister and Cabinet weighed the option of waiting for a
    further resolution against acting on the basis that resolution 1441 revived the 1990 authorisation (resolution 678). They
    concluded that the lack of consensus and Iraq’s continued breach justified immediate action, despite the legal debate
    over the need for a second resolution.
  span_range:
  - src:c1a1d9c95786#p165.5
  - src:c1a1d9c95786#p165.8
  decision: Prime Minister and Cabinet decided to proceed with military action without securing a second UN Security Council
    resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 24
  focus: The document records a decision on who should present the legal basis for military action to Parliament, deviating
    from the usual practice of the responsible minister doing so.
  span_range:
  - src:c1a1d9c95786#p171.9
  - src:c1a1d9c95786#p171.11
  decision: Lord Goldsmith to lead the explanation of the Government's legal position to Parliament rather than the Prime
    Minister or the responsible Secretary of State
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 25
  focus: Cabinet decided to commit ground forces to the US to avoid exclusion from US plans and to retain influence, without
    a formal Cabinet Committee review.
  span_range:
  - src:c1a1d9c95786#p178.2
  - src:c1a1d9c95786#p179.4
  decision: Offer of UK ground forces (Package 3) to the United States for planning purposes on 31 October 2002
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 26
  focus: Decision to earmark 3 Commando Brigade for initial invasion stages as an alternative to larger ground forces, based
    on the risk of Turkish denial.
  span_range:
  - src:c1a1d9c95786#p179.4
  - src:c1a1d9c95786#p179.5
  decision: Identification of the deployment of 3 Commando Brigade in December 2002 as a valuable contribution if Turkey refused
    transit for UK ground forces
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 27
  focus: The Security Council faced the choice of authorising or not authorising an international security force after a request
    from the Afghan Interim Authority. It chose to adopt the resolution, citing the Afghan request, the need for security
    and law‑and‑order, and the principle of Afghan responsibility for security.
  span_range:
  - src:c1a1d9c95786#p194.6
  - src:c1a1d9c95786#p194.6
  decision: UN Security Council adopts Resolution 1386 authorising the International Security Assistance Force (ISAF) in Afghanistan
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 28
  focus: Defence Secretary considered whether the UK should back US operations against Iraq and aim for a role in US planning.
    He advised supporting the US President and pursuing a comprehensive public‑handling strategy, emphasizing counter‑proliferation
    and strategic influence.
  span_range:
  - src:c1a1d9c95786#p195.4
  - src:c1a1d9c95786#p195.6
  decision: UK Defence Secretary advises the Prime Minister to support US military action in Iraq and seek inclusion in US
    planning
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 29
  focus: The Cabinet considered whether to commit British troops to the ISAF mission in Kabul. It decided to deploy an infantry
    battlegroup, emphasizing self‑defence, support for the Afghan Interim Authority, and a non‑occupational role.
  span_range:
  - src:c1a1d9c95786#p195.2
  - src:c1a1d9c95786#p195.2
  decision: Cabinet approves deployment of UK forces to Afghanistan (Operation VERITAS) and outlines the limited scope of
    the mission
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 30
  focus: The senior official faced a choice to either proceed with additional contingency planning work or halt it. He chose
    to proceed, citing the need to reduce risks and improve readiness times, and noted that proper preparations would require
    broader MOD involvement and discreet industry engagement.
  span_range:
  - src:c1a1d9c95786#p219.4
  - src:c1a1d9c95786#p219.5
  decision: The senior official agreed to undertake further work to refine contingency planning for Iraq, to be submitted
    in mid‑June.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 31
  focus: Faced with two possible approaches to the US—probing strategic intent or focusing on practical constraints— the senior
    official selected the latter to avoid sending a misleading signal and to preserve UK influence. He argued that emphasizing
    practicalities would reinforce the need for early US disclosure of plans and protect UK strategic interests.
  span_range:
  - src:c1a1d9c95786#p221.2
  - src:c1a1d9c95786#p221.4
  decision: The senior official chose to raise practicalities with the United States rather than simply probing the US Secretary
    of Defense on Washington thinking.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 32
  focus: The senior official had to decide whether to send a small UK contingent to US CENTCOM planning. He chose to send
    the team, but only if it was clear that no political commitment to military action had been made, thereby preserving political
    flexibility while gaining insight into US plans.
  span_range:
  - src:c1a1d9c95786#p228.3
  - src:c1a1d9c95786#p228.5
  decision: The senior official approved the deployment of a six‑man UK team to Tampa to join US planning, conditional on
    no political decision having been taken in the UK.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 33
  focus: The decision point is whether to disclose the constraints imposed by a potential firefighters’ strike (Op FRESCO)
    to US planners before the Camp David meeting. The excerpt records that the Prime Minister chose to withhold this information.
  span_range:
  - src:c1a1d9c95786#p265.8
  - src:c1a1d9c95786#p265.11
  decision: The Prime Minister decides not to inform the United States about the impact of Operation FRESCO on UK military
    capability at that stage.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 34
  focus: The decision concerns the level of UK military contribution to a US‑led operation. The passage records that the MOD
    official explained the UK could not offer a full division due to the firefighters’ strike and would therefore offer only
    maritime and air capabilities.
  span_range:
  - src:c1a1d9c95786#p275.6
  - src:c1a1d9c95786#p275.7
  decision: The MOD Director General Operational Policy decides to limit the UK’s contribution to maritime and air assets
    rather than land forces because of Op FRESCO constraints.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 35
  focus: The decision point is the recommendation of a concrete force package to the Chiefs of Staff, weighing political profile,
    capability and resource limits. The excerpt shows the recommendation and the rationale that it balances military contribution
    with political considerations.
  span_range:
  - src:c1a1d9c95786#p276.5
  - src:c1a1d9c95786#p276.6
  decision: The Deputy Chief of Defence Staff (Operations) recommends a specific land‑force package (divisional HQ and a square
    armoured brigade) as the balanced UK contribution.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 36
  focus: The Chiefs of Staff evaluated force size options and concluded that an armoured brigade is the minimum viable autonomous
    contribution, subject to resolving identified constraints.
  span_range:
  - src:c1a1d9c95786#p280.3
  - src:c1a1d9c95786#p280.5
  decision: Chiefs of Staff decided that an armoured brigade is the smallest force that can act autonomously for the northern
    option (Package 3).
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 37
  focus: The Prime Minister authorised the MOD to move forward with the land contribution (Package 3) only if the conditions
    set by the MOD (cost, reserves, caveats) were satisfied.
  span_range:
  - src:c1a1d9c95786#p282.6
  - src:c1a1d9c95786#p282.8
  decision: Prime Minister gave conditional go‑ahead to the MOD to proceed with Package 3, subject to meeting identified conditions.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 38
  focus: The Ministry of Defence decided whether to present the larger land contribution (Package 3) to the US planning conference,
    framing it as an optional add‑on.
  span_range:
  - src:c1a1d9c95786#p281.1
  - src:c1a1d9c95786#p281.4
  decision: MOD sought the Prime Minister’s agreement to offer Package 3 as a “possible add‑on” to CENTCOM for planning purposes.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 39
  focus: 'The Prime Minister faced three options: (1) offer Package 3, (2) decline to offer it, or (3) keep the option open
    without a firm commitment. He chose to offer Package 3 on the same basis as Package 2, but without issuing a reservist
    warning at that stage. Reasons cited include influencing US planning, reducing the UK’s vulnerability to costly post‑conflict
    requests, and maintaining political solidarity with the US.'
  span_range:
  - src:c1a1d9c95786#p314.2
  - src:c1a1d9c95786#p315.6
  decision: Prime Minister decides to keep the option open and offer Package 3 (UK ground forces) to the US on the same basis
    as Package 2 for planning purposes.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 40
  focus: 'The Foreign Office weighed two courses: make an immediate decision on military preparations or wait for a UN resolution
    providing a legal basis. The advice was to delay the decision, citing concerns about international legality, domestic
    and international perception, and the need for Turkish consent. The recommendation was to postpone the decision pending
    UN approval.'
  span_range:
  - src:c1a1d9c95786#p303.5
  - src:c1a1d9c95786#p303.8
  decision: Foreign Office senior official advises that the UK should postpone any decision on military action until a UN
    Security Council resolution is obtained.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 41
  focus: The MOD considered whether to inform the US that the UK could provide Package 3 for planning purposes. Options were
    to signal availability or to withhold the signal. The Ministry recommended signalling availability, arguing it would keep
    the UK’s influence over US planning and lower the risk of being asked to fund costly post‑conflict operations.
  span_range:
  - src:c1a1d9c95786#p312.6
  - src:c1a1d9c95786#p312.8
  decision: Defence Ministry advises signalling to the US that a UK land contribution (Package 3) would be available for planning,
    to preserve influence and reduce vulnerability to post‑conflict requests.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
