  focus: The choice was whether to seek Senate advice and consent or withhold submission; the stated concerns included potential
    ICC jurisdiction over personnel of non-party states and procedural protections for accused U.S. persons. Exclude later
    questions about how to conduct ICC cooperation or investigations.
