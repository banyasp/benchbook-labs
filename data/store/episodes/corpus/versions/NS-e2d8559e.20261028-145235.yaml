  focus: The decision point is whether to give unconditional consent or impose conditions preserving the listed uses in specified
    peacetime military and peacekeeping contexts. The certification describes these as situations not triggering the laws
    of war for U.S. forces; exclude decisions about the operational employment of riot control agents.
