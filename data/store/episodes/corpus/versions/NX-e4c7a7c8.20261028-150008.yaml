- n: 1
  focus: The decision point is the analysts’ choice between competing assessments of which route Hanoi was actually using,
    not the operational details of either route. The source says they regarded the overland route as the basic channel and
    reasoned that Hanoi would not depend heavily on a route it did not control and Cambodia could obstruct; exclude the later
    collection and transport details.
  span_range:
  - src:7a456c5d3722#p8.4
  - src:7a456c5d3722#p8.5
  decision: CIA analysts chose to treat the overland route through Laos as the principal supply channel and assign lower importance
    to the Sihanoukville route.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is whether to revise and disseminate the prior estimate after receiving a large body of shipping
    records. The source says CIA treated the records as authentic and virtually complete, and they established the route’s
    importance; exclude the logistical particulars of the deliveries.
  span_range:
  - src:7a456c5d3722#p8.6
  - src:7a456c5d3722#p9.5
  decision: CIA chose to revise its estimates of deliveries through Sihanoukville and send the revised assessment to national-level
    decisionmakers and theater commanders.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is the President’s choice to order an inquiry into the intelligence failure, rather than leave
    the matter without a board investigation. The stated concerns were the scale of the misjudgment, the reliability of intelligence
    assessments, and whether the President had been given warped evaluations; exclude the operational history of the supply
    route.
  span_range:
  - src:7a456c5d3722#p10.10
  - src:7a456c5d3722#p10.14
  decision: The President chose to direct the Foreign Intelligence Advisory Board to investigate the intelligence community’s
    misreading of Sihanoukville.
  content_domain: intel-oversight
  refusal_sensitivity: medium
