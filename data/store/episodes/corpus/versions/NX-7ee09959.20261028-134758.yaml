- n: 2
  focus: The passage links the reorganization to intelligence failures before the Korean War and infighting among operations
    officers, and describes centralization and the creation of the Office of National Estimates. Focus on the organizational
    choice and its stated context; exclude any operational details of espionage or covert action.
  span_range:
  - src:3e82c10291eb#p17.3
  - src:3e82c10291eb#p17.3
  decision: The DCI chose to centralize intelligence functions and reorganize the Agency in response to failures and internal
    infighting.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is the President’s September 1945 choice to dissolve OSS and transfer its branches and remaining
    activities to other departments. The extractor should focus on the demobilization pressure, congressional and administrative
    constraints, and concerns about OSS and its director; exclude the later question of how the surviving intelligence structure
    should be organized.
  span_range:
  - src:3e82c10291eb#p28.2
  - src:3e82c10291eb#p30.2
  decision: The President decides to dissolve the Office of Strategic Services rather than preserve it or convert it into
    a permanent peacetime intelligence agency.
  content_domain: other:intelligence organization policy
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is the September 1945 direction to preserve selected OSS intelligence assets in the SSU while
    the government considered their permanent disposition. The account grounds the choice in retaining capabilities potentially
    useful to the country and awaiting a State Department survey; exclude the unit’s subsequent intelligence activities.
  span_range:
  - src:3e82c10291eb#p31.3
  - src:3e82c10291eb#p32.3
  decision: The Assistant Secretary of War decides to preserve the Strategic Services Unit as a unit rather than immediately
    liquidate or absorb it into Army intelligence.
  content_domain: other:intelligence organization policy
  refusal_sensitivity: medium
- n: 5
  focus: The decision point is the President’s December 1945 selection of the Joint Chiefs’ proposal, followed by creation
    of the Central Intelligence Group under a modified version of that plan. The account describes competing views over departmental
    control and the President’s judgment that the Joint Chiefs’ proposal was simpler and more workable; exclude operational
    intelligence collection or clandestine methods.
  span_range:
  - src:3e82c10291eb#p33.5
  - src:3e82c10291eb#p34.3
  decision: The President decides to base the new central intelligence organization on the Joint Chiefs of Staff proposal
    rather than the competing State Department approach.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The decision point is whether the DCI should rely only on intelligence evaluated by departments or develop independent
    analysis; the passage gives the concern that departments could assess information through parochial lenses and describes
    ORE as the chosen approach. Exclude the separate decisions about intelligence collection and control of Latin American
    operations.
  span_range:
  - src:3e82c10291eb#p52.1
  - src:3e82c10291eb#p52.2
  decision: The DCI established an independent research and analysis capability in the CIG by setting up the Office of Reports
    and Estimates.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: The decision point is the DCI’s choice to seek congressional legislation establishing a central intelligence organization
    and to oppose service efforts to retain control. The passage gives the reason that presidential-directive authority alone
    left the DCI without real power; exclude other provisions of the National Security Act not described here.
  span_range:
  - src:3e82c10291eb#p53.1
  - src:3e82c10291eb#p53.1
  decision: The DCI lobbied for statutory authority for a central intelligence organization rather than allowing the military
    services to retain control over U.S. intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: The decision point is the DCI’s response to perceived analytic deficiencies, including inadequate warning, by consolidating
    analytic functions and placing strategic estimates under central oversight. The passage identifies the prior dispersed
    structure and describes the resulting offices and directorate; exclude operational collection or covert-action decisions.
  span_range:
  - src:3e82c10291eb#p67.1
  - src:3e82c10291eb#p67.2
  decision: The DCI centralized CIA analysis in functional offices and a directorate rather than retaining its dispersed,
