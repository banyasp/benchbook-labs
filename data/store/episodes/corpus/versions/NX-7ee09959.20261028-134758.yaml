  focus: 'The passage presents this as the DCI’s response to the CIA’s mid-1970s political crisis: cooperate selectively and
    end some activities rather than resist investigators or preserve the status quo. Focus on the oversight and institutional-reputation
    rationale; exclude details of covert activities themselves.'
  span_range:
  - src:3e82c10291eb#p17.1
  - src:3e82c10291eb#p17.1
  decision: The DCI chose to pursue controlled cooperation with congressional investigators and terminate selected questionable
    activities.
  content_domain: intel-oversight
