  focus: The decision was whether to create a CIA counterpart to the State Department’s ambassador-in-residence program. The
    stated rationale was a perceived benefit to students and faculty, the officer, and the Agency; exclude later questions
    about how individual OIRs taught or interacted with campuses.
  span_range:
  - src:2c576a28d662#p1.5
  - src:2c576a28d662#p2.5
  decision: The Deputy Director for Administration decides to establish a CIA Officer-in-Residence program at universities.
  content_domain: other:intelligence-academic outreach
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is whether OIRs may actively recruit on campus or instead may answer questions and refer interested
    individuals to official recruitment channels. The text links the restriction to campus sensitivity about officers using
    academic access to identify potential recruits; exclude individual hiring assessments and the student anecdotes.
  span_range:
  - src:2c576a28d662#p4.5
  - src:2c576a28d662#p5.3
  decision: The CIA, through its Officer-in-Residence program rules and university agreements, decides to prohibit OIRs from
    actively recruiting students or others.
  content_domain: other:intelligence-academic outreach
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is whether to retain decentralized, informal selection or centralize program oversight and candidate
    matching. The Inspector General audit identified inconsistent administration and the risk that assignments could accommodate
    employees’ personal preferences; exclude later candidate qualifications and university-selection considerations except
    as implementation details.
  span_range:
  - src:2c576a28d662#p8.1
  - src:2c576a28d662#p8.4
  decision: The CIA’s Center for the Study of Intelligence adopts a more centralized process for selecting OIRs and host institutions.
  content_domain: intel-oversight
