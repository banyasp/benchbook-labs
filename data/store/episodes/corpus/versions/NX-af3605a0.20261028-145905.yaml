episodes:
- n: 1
  focus: The Committees faced a choice between granting immunity to obtain testimony and delaying or avoiding grants to protect
    possible criminal prosecutions. Independent Counsel warned that immunity and highly public testimony could seriously impair
    prosecutions and urged delay; the Committees proceeded because central figures would not testify voluntarily and the Committees
    faced public-hearing and reporting deadlines. Exclude the separate details of OIC’s prosecution safeguards except where
    they explain the competing interests.
  span_range:
  - src:d85b0cf55edb#p1.28
  - src:d85b0cf55edb#p1.33
  decision: The Select Iran/contra Committees decided to grant immunity to central figures who had refused to testify voluntarily.
  content_domain: intel-oversight
  refusal_sensitivity: low
- n: 2
  focus: In late June 1987, OIC weighed an indictment based on obstruction and contra-support evidence against waiting for
    Swiss financial records and a more comprehensive case. It chose to wait, citing incomplete evidence, the value of including
    diversion-related charges, and the risk that an indictment immediately before testimony would trigger a damaging confrontation
    and threaten the prosecution and ongoing investigation. Exclude the later indictment itself as a separate decision.
  span_range:
  - src:d85b0cf55edb#p1.35
  - src:d85b0cf55edb#p1.36
  decision: Independent Counsel decided not to indict the central figures immediately before their scheduled congressional
    testimony.
  content_domain: other:criminal-investigation
  refusal_sensitivity: low
- n: 3
  focus: After the testimony raised serious immunity-taint concerns, OIC considered whether to continue the prosecution, abandon
    it, or try to use the witness instead. It chose to proceed after legal review, citing the absence of possible cooperation,
    prior court holdings, and the principle that a subject’s popularity should not deter equal application of the law; it
    left the adequacy of safeguards to the courts. Exclude the technical details of staff screening and exposure tracking.
  span_range:
  - src:d85b0cf55edb#p1.38
  - src:d85b0cf55edb#p1.39
  decision: Independent Counsel decided to continue pursuing the prosecution of an immunized central figure after his public
    congressional testimony.
  content_domain: other:criminal-investigation
  refusal_sensitivity: low
- n: 4
  focus: The decision was whether to disclose the information for the prosecution or maintain its classified status; the Administration
    refused, and the case was ultimately dismissed. Focus on the conflict between the prosecution’s need for the evidence
    and the intelligence agencies’ insistence that it remain officially deniable, not on the underlying classified material.
  span_range:
  - src:d85b0cf55edb#p1.47
  - src:d85b0cf55edb#p1.48
  decision: The Attorney General and Administration decided not to authorize disclosure of classified information needed for
    the Fernandez prosecution.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The decision was whether to continue seeking voluntary cooperation or compel testimony after negotiations failed.
    Focus on the investigative need to question him about his notebooks and prior congressional testimony, not on the detailed
    subject matter of the questioning.
  span_range:
  - src:d85b0cf55edb#p1.53
  - src:d85b0cf55edb#p1.54
  decision: The Independent Counsel decided to seek immunity and a court order compelling the former National Security Council
    staff member’s Grand Jury testimony.
  content_domain: other:criminal investigation
  refusal_sensitivity: low
- n: 6
  focus: The decision point is whether to prosecute based on the evidence or not; the resulting plea and cooperation followed
    from that decision. Focus on the evidentiary basis and the decision to pursue prosecution, not on operational details
    of the underlying contra-support activity.
  span_range:
  - src:d85b0cf55edb#p1.70
  - src:d85b0cf55edb#p1.72
  decision: The Independent Counsel decided that prosecution of the CIA task-force chief was necessary and pursued a plea
    agreement.
  content_domain: other:criminal prosecution
  refusal_sensitivity: low
- n: 7
  focus: The decision was whether to refer the pardon for Grand Jury consideration after it was granted shortly before trials,
    amid concern it might prevent further revelations. Focus on the stated evidentiary threshold and the decision not to refer;
    do not treat the report’s unanswered question about the President’s motive as a finding.
  span_range:
  - src:d85b0cf55edb#p1.83
  - src:d85b0cf55edb#p1.84
  decision: The Independent Counsel decided not to take the question of the President’s pardon to the Grand Jury absent evidence
    of corruption.
  content_domain: other:criminal investigation
  refusal_sensitivity: low
