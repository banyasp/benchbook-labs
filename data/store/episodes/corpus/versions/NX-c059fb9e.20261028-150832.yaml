- n: 2
  focus: The decision point is whether production quotas, labour shortages and threatened government consequences made the
    defendants’ conduct necessary or compelled. The Tribunal rejected the defense, reasoning that the defendants’ will was
    not overpowered and that the likely consequences of disobedience were loss of the plant or their posts; exclude general
    discussion of emergency defenses beyond this application.
  span_range:
