episodes:
- n: 1
  focus: After the Korean armistice, the existing priorities were criticized for favoring military information despite estimates
    emphasizing political warfare, risks to Free World unity, and intelligence needs concerning friendly and neutral states.
    The decision was to include significant non-military concerns, distinguish among military objectives, and avoid a single
    absolute ranking because it risked rigidly distorting priorities. Exclude the later operational formulation of particular
    collection requirements.
  span_range:
  - src:d480ba7039f7#p3.2
  - src:d480ba7039f7#p4.2
  decision: The Board of National Estimates proposed, and the Director of Central Intelligence with Intelligence Advisory
    Committee concurrence adopted, a revision broadening priority intelligence objectives and organizing them into categories
    rather than one absolute ranking.
  content_domain: other:intelligence-policy
  refusal_sensitivity: medium
- n: 2
  focus: After a Board recommendation to review procedures linking collection requirements to national priorities, the Special
    Assistant studied the issue and rejected creation of a single community-wide coordination mechanism. The stated concern
    was that such a mechanism would be cumbersome and more hindrance than help; exclude the operational details of collection
    itself.
  span_range:
  - src:d480ba7039f7#p7.2
  - src:d480ba7039f7#p7.3
  decision: The Special Assistant to the Director of Central Intelligence for Planning and Coordination concluded that no
    procedural action was advisable to establish a community-wide mechanism for coordinating and prioritizing collection requirements.
  content_domain: other:intelligence-policy
  refusal_sensitivity: medium
