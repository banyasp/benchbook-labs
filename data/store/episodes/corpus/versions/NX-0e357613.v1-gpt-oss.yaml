  focus: Lee ordered Anderson’s I Corps to rest after taking Corbin’s Bridge, but due to fires in the Wilderness making rest
    impossible, Anderson chose to march through the night to reach the vicinity of Blockhouse Bridge. This decision was made
    to meet Lee’s timetable for reaching Spotsylvania and to avoid losing the initiative.
  span_range:
