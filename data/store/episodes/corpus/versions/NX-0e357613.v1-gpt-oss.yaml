- n: 13
  focus: The IX Corps commander, acting under orders from the senior Union commanders, faced the choice of executing a frontal
    attack on a well‑entrenched Confederate position at Ox Ford or aborting that plan. He chose to cancel the attack, citing
    the strength of Mahone’s defenses and the likely heavy Union casualties, and instead ordered a crossing at Quarles’ Mill
    to flank the enemy.
  span_range:
  - src:c0ba13544364#p95.1
  - src:c0ba13544364#p95.1
  decision: Burnside cancels the planned assault on Ox Ford and redirects his forces to cross at Quarles’ Mill.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 14
  focus: The senior Union commander, after reviewing the condition of exhausted troops, the state of Confederate preparations,
    and logistical delays, considered whether to launch the attack on 2 June as scheduled, to delay it to later that day,
    or to postpone it further. He chose to postpone the assault to 3 June, reasoning that additional preparation time would
    improve coordination and reduce the risk of a costly failure.
  span_range:
  - src:c0ba13544364#p105.2
  - src:c0ba13544364#p105.2
  decision: The senior Union commander postpones the planned Union assault on Cold Harbor from the morning of 2 June to the
    morning of 3 June.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 15
  focus: Facing limited options for further offensive action around Richmond, the senior Union commander evaluated whether
    to continue the Overland push, remain entrenched, or undertake a bold flanking maneuver across the river. He chose the
    latter, planning a complete base shift, massive engineering effort for pontoon bridges, and a rapid march to capture the
    rail hub at Petersburg, aiming to cut Confederate supply lines despite the risk of being attacked while corps were separated.
  span_range:
  - src:c0ba13544364#p107.2
  - src:c0ba13544364#p107.2
  decision: The senior Union commander decides to disengage from the Confederates at Cold Harbor, shift his base, and execute
    a large‑scale crossing of the river to seize Petersburg.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 16
  focus: The passage describes the President’s authority to change the command structure by pushing a bill through Congress
    to restore the historic rank of lieutenant general and then ordering the General in Chief’s promotion to that rank, making
    him General in Chief. It shows the choice between keeping the existing senior‑staff arrangement (the Chief of Staff) versus
    creating a single commander with overall authority, and the reasons tied to political pressure, upcoming election, and
    the need for vigorous leadership.
  span_range:
  - src:c0ba13544364#p125.1
  - src:c0ba13544364#p125.2
  decision: The President decides to restore the rank of lieutenant general and promote the General in Chief of the Union
    armies to that rank.
  content_domain: other:military‑policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The General in Chief evaluates two possible axes of advance—above Lee (left) versus around Lee’s right (southeast).
    He weighs the advantages of open terrain versus supply line security and naval support, and selects the right‑hand route
    despite its restricted terrain, aiming to keep initiative and force Lee into unfavorable ground.
  span_range:
  - src:c0ba13544364#p127.1
  - src:c0ba13544364#p127.2
  decision: The General in Chief decides to adopt the right‑hand axis (southeast route) for the Overland Campaign advance.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 18
  focus: The Confederate Commander receives intelligence that Grant is moving toward the Wilderness and must choose whether
    to wait for Longstreet’s reinforcement or attack immediately. He opts for an aggressive stance, ordering Ewell to press
    forward, based on his assessment that the Union would be vulnerable in the dense terrain and that a timely attack could
    offset his numerical disadvantage.
  span_range:
  - src:c0ba13544364#p129.1
  - src:c0ba13544364#p129.2
  decision: The Confederate Commander decides to engage Union forces in the Wilderness before Longstreet’s corps arrives.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 19
  focus: The decision point concerns the timing of the coordinated Union assault, weighing the desire for initiative against
    the risk of allowing Confederate forces to regroup. The passage details the original order, the army commander’s request,
    and the compromise.
  span_range:
