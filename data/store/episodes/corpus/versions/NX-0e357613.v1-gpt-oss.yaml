  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 21
  focus: The decision involves selecting an attack route (flank via railroad grade versus a frontal assault) and assigning
    command authority. The passage explains the reconnaissance, the choice of the unguarded grade, and the delegation to the
    aide.
  span_range:
  - src:c0ba13544364#p161.2
  - src:c0ba13544364#p161.3
