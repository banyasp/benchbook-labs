  - src:c0ba13544364#p197.1
  decision: Grant’s decision to launch a coordinated simultaneous attack at 1700 and later to modify the plan by withdrawing
    the II Corps and using it as bait
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
