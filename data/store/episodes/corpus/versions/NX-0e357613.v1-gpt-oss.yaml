- n: 22
  focus: The document describes Meade weighing whether to place senior officer Sedgwick or junior but trusted Warren in command
    of the two‑corps attack. He ultimately tells Warren to “cooperate” with Sedgwick, but Warren refuses, forcing Meade to
    leave the command decision unresolved and not take personal command. The decision reflects Meade’s assessment of seniority,
    trust, and his own preoccupation with other maneuvers.
  span_range:
