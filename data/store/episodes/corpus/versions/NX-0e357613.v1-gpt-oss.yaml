  focus: Union cavalry commander faced the choice of supporting the Union Army commander’s offensive against Richmond or continuing
    his own raid. He declined to assist, citing the high risk of pressing into the city and a desire to avoid further entanglement,
    and subsequently left the commander’s forces on 17 May. The decision is documented in the discussion of the May 15‑17
