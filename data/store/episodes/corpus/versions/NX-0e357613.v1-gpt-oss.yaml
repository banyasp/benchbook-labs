  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 20
  focus: The commander faced a choice to order immediate entrenchments for the corps or to defer to the corps commander’s
    judgment to rest the troops. He chose to let the corps commander’s decision stand, balancing troop fatigue against defensive
    preparation.
  span_range:
  - src:c0ba13544364#p154.2
  - src:c0ba13544364#p154.2
  decision: The commander of the Confederate army authorized the corps commander to let his men sleep rather than entrench,
