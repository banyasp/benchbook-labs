  focus: During the night of 23 May Lee convened his staff, weighed options of defending the Chesterfield Bridge, falling
    back to higher ground, or further south, and chose the inverted V to force Grant to commit to crossing both flanks and
    to enable a potential counter‑attack. The passage explains his intent and the strategic reasoning.
  span_range:
  - src:c0ba13544364#p279.2
  - src:c0ba13544364#p279.2
