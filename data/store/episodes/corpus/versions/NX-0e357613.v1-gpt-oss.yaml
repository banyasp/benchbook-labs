  natsec: true
- n: 30
  focus: 'On 26 May Grant evaluated two options: a southeast move offering a secure water line of communication and proximity
    to Butler’s forces, versus an inland advance that could surprise Lee but risked losing supply lines. He ultimately selected
    the southeast river route, citing safety and logistical advantages.'
  span_range:
