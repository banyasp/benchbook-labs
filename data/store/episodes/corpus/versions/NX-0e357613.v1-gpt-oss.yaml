- n: 23
  focus: 'Grant initially orders a synchronized assault by all four Union corps at 1700 to exploit perceived weaknesses in
    Lee’s line. When the plan begins to unravel, he revises it: withdrawing most of the II Corps across the Po River, leaving
    a division as bait, and reshaping the main effort around the V Corps. The decision balances the desire for a decisive
    breakthrough against the realities of fragmented Union attacks and Confederate strength.'
  span_range:
