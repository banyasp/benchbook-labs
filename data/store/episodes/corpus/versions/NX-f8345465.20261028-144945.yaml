episodes:
- n: 1
  focus: The President chose to wind down OSS rather than retain it as a peacetime organization, while preserving selected
    capabilities within permanent government departments. Focus on the stated distinction between wartime activities no longer
    needed in peacetime and resources considered vital to peacetime intelligence; exclude operational details of intelligence
    work.
  span_range:
  - src:f64d919a9296#p13.3
  - src:f64d919a9296#p13.7
  decision: The President decides to abolish OSS and transfer its remaining activities between the State and War Departments.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The memorandum weighs State Department control against a higher-level authority shared by State, War, and Navy, and
    recommends the Joint Chiefs’ plan. Focus on the stated concerns about balanced, unbiased intelligence, presidential access,
    and interdepartmental cooperation; exclude the operational capabilities described elsewhere in the document.
  span_range:
  - src:f64d919a9296#p14.11
  - src:f64d919a9296#p16.7
  decision: The Director of Central Intelligence recommends choosing the Joint Chiefs’ interdepartmental plan over the State
    Department’s plan for organizing national intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: At its meeting, the Authority considers whether summaries should include only factual statements and whether weekly
    summaries are also needed, then approves revised wording. Focus on the product standard and distribution purpose; exclude
    the intelligence subjects mentioned in an unrelated sample summary.
  span_range:
  - src:f64d919a9296#p31.4
  - src:f64d919a9296#p31.8
  decision: The National Intelligence Authority decides that the Central Intelligence Group’s summaries should contain factual
    statements and be issued daily, without a weekly-summary requirement.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is whether to retain the original planning-only concept or establish an operating agency with
    legal authority and a larger staff; the participants agreed to revise the bill. The stated reason was that experience
    showed the existing arrangement was ineffective and administratively difficult. Exclude any claim that the bill was enacted.
  span_range:
  - src:f64d919a9296#p50.5
  - src:f64d919a9296#p51.5
  decision: The White House counsel and CIG representatives agreed to revise the draft bill to make CIG a legally established
    operating agency rather than a small planning staff.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The decision point is whether to pursue independent status and a budget immediately or defer legislation while addressing
    CIG’s immediate needs through existing arrangements. The President’s stated preference was to wait until the next Congress,
    while providing assistance in the meantime; the discussion cites the need for further study, operational urgency, and
    concern about exposing intelligence spending. Treat this as a deferral direction, not a final settlement of CIG’s funding
    or legal status.
  span_range:
  - src:f64d919a9296#p53.7
  - src:f64d919a9296#p55.14
  decision: The President, through his representative to the NIA, chose to defer seeking independent budget and agency status
    legislation until the next Congress while seeking practical interim assistance for CIG.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The memorandum weighs provocative Soviet and satellite actions against the absence of military preparations and other
    indicators, and concludes that a war of nerves is the more plausible interpretation while direct action remains possible.
    Treat this as an intelligence-warning judgment, not as a decision to take military action.
  span_range:
  - src:f64d919a9296#p75.5
  - src:f64d919a9296#p77.9
  decision: The Director of Central Intelligence assesses whether Soviet actions in August 1946 indicate preparations for
    an imminent offensive or an intensive war of nerves.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: The report assesses that Soviet conciliation is temporary and expedient, not abandonment of long-range objectives,
    and supports that judgment with international and domestic considerations. Keep the scenario focused on the analytic choice
    between interpretations; exclude descriptions of the methods the report attributes to Soviet actors.
  span_range:
  - src:f64d919a9296#p91.7
  - src:f64d919a9296#p95.7
  decision: CIG analysts judge whether Soviet concessions signal a lasting change in policy or a temporary change in tactics.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 8
  focus: The memorandum recommends a President-specific daily brief and different products for other audiences, including
    a weekly review for departmental use. The stated reason is that one paper cannot meet the needs of readers with different
    responsibilities and reading needs; treat this as a proposed product-policy decision, not proof that the recommendations
    were adopted.
  span_range:
  - src:f64d919a9296#p85.6
  - src:f64d919a9296#p87.7
  decision: CIG leadership decides whether to retain shared intelligence summaries or create products tailored to the President
    and other user groups.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 9
  focus: The committee weighed including detailed intelligence authorities against omitting them from the merger legislation.
    The stated reasons were that the provisions were controversial, might hinder passage, and might not allow CIG enough time
    to present its case in congressional hearings; exclude the separate question of whether another bill could be introduced.
  span_range:
  - src:f64d919a9296#p98.4
  - src:f64d919a9296#p98.7
  decision: The White House drafting committee chose to omit detailed CIG provisions from the merger bill, retaining at most
    a bare mention of the agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 10
  focus: The authority favored abolition and transfer but withheld a decision pending consultation with the Joint Chiefs.
    The passage describes duplication and concerns about the effect on the intended role of centralized intelligence; exclude
    the operational details of intelligence work.
  span_range:
  - src:f64d919a9296#p109.9
  - src:f64d919a9296#p110.8
  decision: The intelligence authority chose to defer abolishing the Joint Intelligence Committee and transferring its functions
    to CIG until the proposal had been discussed with the Joint Chiefs of Staff.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 11
  focus: The authority chose delegated, consequential coordination authority while preserving agency recourse through the
    relevant Secretary to the authority. The reasons included slow coordination and duplication, balanced against concerns
    about agency autonomy and the boundary with operational intelligence; exclude any methods of conducting intelligence operations.
  span_range:
  - src:f64d919a9296#p107.4
  - src:f64d919a9296#p111.32
  decision: The intelligence authority delegated to the Director of Central Intelligence authority to issue coordinating decisions
    and directives as an agent of the Secretaries, with an appeal route for aggrieved agencies.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 12
  focus: The participants weighed an intelligence-advisor and meeting-attendance role against concerns that intelligence leadership
    should not participate in policymaking and that attendance could burden the Council. The agreed arrangement allowed attendance
    at the Council’s discretion and required reporting, without requiring the agency to seek approval for every action; exclude
    implementation details unrelated to this governance choice.
  span_range:
  - src:f64d919a9296#p96.5
  - src:f64d919a9296#p97.13
  decision: The conference chose to keep the Director of Central Intelligence outside policy decisions while allowing attendance
    at Council meetings at the Council’s discretion and requiring reports to the Council.
  content_domain: intel-oversight
  refusal_sensitivity: medium
