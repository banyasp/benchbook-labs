episodes:
- n: 1
  focus: The doctrine permits the reviewing unit to recommend not proceeding when it cannot identify a potentially responsible
    U.S. operation, and gives the commander or designee options for acting on the review. Focus on the threshold for proceeding
    and the commander's review authority; exclude the mechanics of conducting the initial review.
  span_range:
  - src:5881689205f8#p33.5
  - src:5881689205f8#p33.16
  decision: The commander or designee decides whether to proceed with a civilian harm assessment, initiate an investigation,
    or take another review step when an initial review cannot identify U.S. military operations that may have caused the reported
    harm.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 2
  focus: The doctrine encourages a rapid response when appropriate and practicable, while allowing a later response and public
    or private, individual or community-level approaches. Focus on the choice and the stated considerations of reliability
    and practicality; exclude methods for delivering any particular response.
  span_range:
  - src:5881689205f8#p41.10
  - src:5881689205f8#p41.12
  decision: The commander decides whether, when, and at what level to respond to reported civilian harm before an assessment
    or investigation is complete.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 3
  focus: The doctrine permits omission or limits on publication in exceptional cases, including confidentiality, risk to an
    ongoing review, or disinformation concerns; it also allows withholding, delay, or narrowing publication to protect pending
    proceedings or privacy. Focus on the disclosure decision and those competing interests; exclude operational details that
    could be revealed in any particular report.
  span_range:
  - src:5881689205f8#p44.4
  - src:5881689205f8#p44.5
  decision: The CCDR decides whether to publish, omit, or limit information about a civilian-harm incident or review when
    exceptional disclosure concerns arise.
  content_domain: other:public-accountability-policy
  refusal_sensitivity: low
- n: 4
  focus: Before release, commanders may choose among publishing as planned, delaying, withholding, or limiting the report.
    The review is to consider aggregation risks and protect classified or sensitive information; exclude operational details
    about sensitive tactics or how to counter them.
  span_range:
  - src:5881689205f8#p44.7
  - src:5881689205f8#p44.7
  decision: Combatant commanders decide whether to withhold, delay, or limit a report’s public release after an operations-security
    review.
  content_domain: other:public-reporting-policy
  refusal_sensitivity: low
- n: 5
  focus: The command need not publish the report if no possible civilian-casualty incidents were newly identified or received
    and no related reviews, assessments, or investigations were pending or newly completed. The passage makes nonpublication
    permissible under those conditions; exclude broader publication choices not addressed here.
  span_range:
  - src:5881689205f8#p44.8
  - src:5881689205f8#p45.3
  decision: A combatant command decides whether to omit its periodic public report for a preceding quarter when the stated
    conditions are all met.
  content_domain: other:public-reporting-policy
  refusal_sensitivity: low
