  focus: The decision point is how to balance reduced risk to coalition forces against the risk of mission failure, and increased
    operational control against risks to coalition legitimacy and unity if the force exceeded its UN authority. The commander
    chose the increased-posture option because it offered the best chance of achieving the military end state within the time
    available, securing key terrain, retaining relative advantage, enabling New Centralia forces to take the lead, and controlling
    transition criteria. Exclude tactical implementation details.
  span_range:
  - src:671a4a36cebf#p18.2
  - src:671a4a36cebf#p18.2
  decision: The MNFS commander chose the increased coalition-posture course of action over the reduced-footprint course of
    action for New Centralia.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 2
  focus: The decision point is whether to preserve a dedicated targeting approval forum or consolidate it into a broader command
    decision forum. The source says the change addressed the commander’s overloaded meeting schedule, but the combined forum
    then became overloaded and delayed target approvals. Exclude decisions about selecting targets or authorizing particular
    engagements.
  span_range:
  - src:671a4a36cebf#p51.2
  - src:671a4a36cebf#p51.4
  decision: The MNFS CJ3 and chief of staff chose to replace the doctrinal Targeting Decision Board with a combined Commander’s
    Guidance and Decision Board.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 3
  focus: The decision point is whether to make the claim or withhold it despite the potential information advantage. Focus
