  span_range:
  - src:f7aedcd94aaf#p11.2
  - src:f7aedcd94aaf#p11.3
  decision: The United States decides whether to endorse NATO’s requirement for Gender Advisor review before target validation,
    or to follow its national review process instead.
  content_domain: targeting
  refusal_sensitivity: high
