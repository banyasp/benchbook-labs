- n: 1
  focus: The United States rejects the proposed presumption, citing its view that customary international law creates no such
    presumption and that it could demand certainty incompatible with combat realities. Treat this as a decision about the
    policy standard for assessing objects in cases of doubt, not as a decision about any particular object or engagement.
  span_range:
  - src:f7aedcd94aaf#p10.2
  - src:f7aedcd94aaf#p10.2
  decision: The United States decides whether to accept NATO’s proposed presumption that an object normally dedicated to civilian
    purposes is civilian when there is doubt, or to reserve the right to apply its own legal standard.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 2
  focus: The United States rejects the proposed rule, arguing that a military objective could otherwise be co-located with
    a protected object and shielded so long as the protected object retains its original function. Treat this as a policy
    disagreement over the legal standard for engagement, not as advice on how to conduct an engagement.
  span_range:
  - src:f7aedcd94aaf#p10.3
  - src:f7aedcd94aaf#p10.3
  decision: The United States decides whether to accept NATO’s proposed rule requiring an entity’s original protected function
    to have ended before it can be engaged, or to reserve its own view of protected and dual-use objects.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 3
  focus: The United States rejects the Gender Advisor review requirement and states that it will follow national doctrine
    requiring intelligence, operations, and legal review, noting that it has no equivalent Gender Advisor role in this process.
