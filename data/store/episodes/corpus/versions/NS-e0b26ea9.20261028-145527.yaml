  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: The first session deferred direct intervention while the leadership sought a clearer picture of the Afghan Army’s
    reliability and who Soviet forces might have to fight. The subsequent position ruled out deployment for the time being,
    citing the risk of fighting the Afghan population and damaging détente, while permitting contingency readiness and other
    assistance; exclude the military preparations as operational details.
  span_range:
  - src:c6dee2b78930#p32.4
  - src:c6dee2b78930#p34.6
  decision: The Soviet Politburo decided in March whether to commit combat forces to Afghanistan immediately or defer that
