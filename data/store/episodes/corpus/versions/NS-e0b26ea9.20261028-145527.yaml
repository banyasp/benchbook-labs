- n: 5
  focus: At the 11 December meeting, most analysts judged the battalion’s purpose to be increased security, particularly in
    case evacuation became necessary; a minority saw its antiaircraft capability as evidence of possible preparations for
    a larger operation. Center the scenario on the competing analytic judgments and their stated reasoning, not on military
    deployment methods.
  span_range:
  - src:c6dee2b78930#p26.6
  - src:c6dee2b78930#p26.6
  decision: Senior intelligence analysts decide whether the Soviet battalion deployed to Bagram signals intent to enter combat
