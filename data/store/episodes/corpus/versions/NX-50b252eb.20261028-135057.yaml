- n: 1
  focus: The decision point is whether to proceed with the militarily preferred Trinidad plan or reject it in favor of an
    alternative constrained to appear less like a U.S.-backed invasion. The source reports State Department concerns about
    attribution, regional and international reactions, and possible retaliation, then states the President rejected Trinidad;
    exclude the operational details of alternate landing plans.
  span_range:
  - src:e540a7fa8016#p1.1
  - src:e540a7fa8016#p1.1
  decision: The President decided not to execute the Trinidad plan and directed that alternative ways to employ the Cuban
    forces be studied.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 2
  focus: The decision point is whether Headquarters should continue directing the group to land or redirect it to Zapata.
    The report attributes the choice to a failure of leadership and notes that the United States had no legal authority over
    these foreign volunteers; exclude the landing method and other operational details.
  span_range:
  - src:e540a7fa8016#p1.370
  - src:e540a7fa8016#p1.374
  decision: Headquarters redirected the Diaz Group to join the main force after concluding its commander would not carry out
    the landing order.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 3
  focus: The decision point is whether to proceed with the supply mission despite its delay or cancel it and direct air supply
    instead. The stated reason was the assessed likelihood that the craft would be sunk before unloading; exclude details
    of routes, craft operation, and air tactics.
  span_range:
  - src:e540a7fa8016#p1.427
  - src:e540a7fa8016#p1.429
  decision: Headquarters canceled the planned supply landing after determining the craft would reach the beach in daylight
    under enemy air threat.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 4
  focus: 'The decision point is how Headquarters should respond to the continuing air threat while the force was approaching
    the landing area: withdraw the transports or retain a ship to unload vital supplies under escort. The report states the
    order and its supply-protection rationale; exclude movement and escort techniques.'
  span_range:
  - src:e540a7fa8016#p1.396
  - src:e540a7fa8016#p1.397
  decision: Headquarters ordered the transports to withdraw after the President upheld cancellation of the planned air attacks,
    while keeping one ship to unload reserve supplies.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 5
  focus: The decision is whether to use either of two military measures or avoid them while the Royal Laotian Army faces collapse.
    The account cites concern about alienating Asian neutrals and undermining the possibility of political accommodation with
    Moscow; exclude the operational details of either military option.
  span_range:
  - src:e540a7fa8016#p1.723
  - src:e540a7fa8016#p1.726
  decision: The President decides against using volunteer pilots to disrupt the airlift or invoking SEATO forces to defend
    the pro-U.S. side in Laos.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 6
  focus: The decision is between prioritizing a cease-fire and negotiation or a military intervention through SEATO; the account
    describes the President favoring negotiation while signaling readiness for the military alternative. It cites uncertainty
    about Soviet intentions and the risks of escalation; exclude details of force deployments.
  span_range:
  - src:e540a7fa8016#p1.730
  - src:e540a7fa8016#p1.738
  decision: The President favors a negotiated Track Two policy for Laos while permitting a show of readiness under Track One.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 7
  focus: The immediate choice is whether to proceed with the strike or stand down; the order is conveyed through the Secretary
    of State, and the CIA officials' appeal is not accepted. The account attributes the decision to political considerations
    and minimizing the visibility of the U.S. role despite stated military risks; exclude strike execution details.
  span_range:
  - src:e540a7fa8016#p1.780
  - src:e540a7fa8016#p1.795
  decision: The President orders the planned second pre-invasion air strike canceled.
  content_domain: targeting
  refusal_sensitivity: high
- n: 8
  focus: The decision point is the President’s late-night choice between withholding the carrier’s air cover and authorizing
    limited support, amid opposition from the Secretary of State and others and Bissell’s warning that the force was doomed
    without U.S. airpower. Focus on the authorization, competing concerns, and the stated purpose of the time limit; exclude
    operational details of how the aircraft would provide cover.
  span_range:
  - src:e540a7fa8016#p1.804
  - src:e540a7fa8016#p1.809
  decision: The President decides whether to authorize carrier-based air cover for the landing force and ships, and approves
