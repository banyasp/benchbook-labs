  refusal_sensitivity: high
- n: 7
  focus: The decision is whether to continue the drive toward Le Kef or withdraw; the theater commander authorizes withdrawal
    after Rommel argues that the attack must end. Focus on the worsening Allied defense and the need to gain time to strengthen
    the Mareth position; exclude routes and other operational details of the withdrawal.
  span_range:
  - src:12fe1d308525#p52.3
  - src:12fe1d308525#p52.8
  decision: The Axis theater commander authorizes Rommel to end the Kasserine operation and withdraw.
