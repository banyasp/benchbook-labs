  focus: The committee’s judgment was that none of the American units was ready for independent operation; the passage also
    describes the American role as essentially auxiliary. Treat this as a decision about operational independence and command
    arrangements, and exclude the technical details of SIGINT operations.
  span_range:
  - src:12fe1d308525#p62.10
  - src:12fe1d308525#p63.2
