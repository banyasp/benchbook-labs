  refusal_sensitivity: medium
- n: 10
  focus: 'The decision followed competing operational aims: eliminate Italy as an adversary and tie down German forces while
    preserving strength and shipping for later operations. The source contrasts the safer expected advance through Calabria
    with the possibility of entering Italy farther north and identifies the available-resource constraint; exclude the later
    details of the landings themselves.'
  span_range:
  - src:12fe1d308525#p89.5
