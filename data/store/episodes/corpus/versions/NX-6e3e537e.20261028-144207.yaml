episodes:
- n: 1
  focus: In January 1942, the service chiefs could continue overlapping diplomatic-traffic production or allocate processing
    between the services. The account connects their agreement to reducing duplication; exclude broader descriptions of service
    organization and technical SIGINT methods.
  span_range:
  - src:12fe1d308525#p22.1
  - src:12fe1d308525#p23.1
  decision: The Army and Navy SIGINT chiefs agreed that the Army would process diplomatic traffic and provide the Navy with
    translations of messages relevant to it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: Before Rommel’s 1942 attack from the Gazala area, the officer weighed SIGINT interpretations against other intelligence;
    the account says the other sources proved incorrect and SIGINT was confirmed, after which SIGINT was more readily accepted.
    Keep the focus on the decision to credit or discount an intelligence assessment, not on collection or analytic techniques.
  span_range:
  - src:12fe1d308525#p25.7
  - src:12fe1d308525#p25.8
  decision: The British Eighth Army operations officer chose to discount Army SIGINT interpretations unless they included
    readable message text, favoring inferences from other intelligence.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is the Allies’ choice to seize North Africa rather than attack Germany directly at that stage,
    given the assessment that an attack on Germany was not yet practicable and that Allied forces and seapower could support
    the North African campaign. Exclude later theater-boundary and command-structure changes, which are not the decision to
    undertake the campaign.
  span_range:
  - src:12fe1d308525#p30.5
  - src:12fe1d308525#p30.6
  decision: Allied leadership chose to occupy French North Africa as a step toward closing the ring around Germany.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 4
  focus: The decision point is the change from the planned offensive to cut the Axis coastal supply line toward a posture
    able to counter an Axis thrust. The stated rationale was that the British pursuit could leave veteran German armor free
    to attack an inexperienced U.S. II Corps in an area of Axis air superiority; exclude later battlefield outcomes and force-employment
    details.
  span_range:
  - src:12fe1d308525#p44.2
  - src:12fe1d308525#p44.2
  decision: The Allied command abandoned the planned II Corps drive to Sfax and shifted toward concentrating the 1st Armored
    Division on the southern flank.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 5
  focus: The decision point is whether to continue resistance or execute the cease-hostilities order amid deteriorating conditions.
    The commander waited for written confirmation, then cited the worsening military situation and the judgment that effective
    resistance was no longer possible; exclude the subsequent negotiation of settlement terms.
  span_range:
  - src:12fe1d308525#p39.3
  - src:12fe1d308525#p39.7
  decision: The French North African regional commander chose to cease firing after receiving and confirming an order to suspend
    hostilities.
  content_domain: targeting
  refusal_sensitivity: high
- n: 6
  focus: The high command chooses between the proposed objectives, rejecting a drive across the Algerian border in favor of
    threatening the British First Army’s line of communications. Focus on the strategic objective and the stated aim of weakening
    Allied defenses and helping expand the Tunisian bridgehead; exclude the proposed supporting military movements.
  span_range:
  - src:12fe1d308525#p51.20
  - src:12fe1d308525#p52.2
