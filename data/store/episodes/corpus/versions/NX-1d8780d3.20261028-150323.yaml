- n: 2
  focus: The DCI could withhold approval or let the directive proceed despite restrictions on how he sent recommendations
    to his superiors. He accepted it amid high tensions, regarding it as temporary, while intending to preserve his independent
    right to make recommendations to the NSC. Exclude the directive’s detailed procedures except as needed to define the choice.
  span_range:
  - src:0b7167a5d858#p10.3
  - src:0b7167a5d858#p11.2
  decision: The DCI chose to allow the Eleventh NIA Directive, requiring IAB review of his recommendations, to take effect.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The DCI had proposed a subcommittee of the Secretaries of State and Defense, with an alternative adding the service
    secretaries; after the Army Secretary objected to the smaller body, the DCI withdrew the proposal at the NSC Executive
    Secretary’s urging. The stated concern was that the small board excluded other service secretaries and conflicted with
    the NSC’s role as an entity. Exclude the separate question of the DCI’s advisory committee.
  span_range:
  - src:0b7167a5d858#p14.4
  - src:0b7167a5d858#p15.1
  decision: The DCI chose to withdraw his proposal for a small NSC subcommittee to direct CIA affairs.
