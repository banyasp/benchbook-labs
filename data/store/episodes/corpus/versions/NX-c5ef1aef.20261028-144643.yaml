  focus: The decision is whether to retain separate authorization and appropriations processes or combine them in the relevant
    committees. The report favors merging, citing the bureaucratic burden of the existing budget process, the expansion of
    authorization across spending areas, and the benefits for oversight; exclude other committee reforms not necessary to
    this choice.
  span_range:
  - src:eb26486a42cc#p129.5
