- n: 1
  focus: The decision point is Congress’s 1947 choice between stronger central coordination after Pearl Harbor and safeguards
    against concentrated power, reflected in the CIA’s independence, limits, and relationship to departmental agencies. Keep
    the scenario at the level of statutory design and authority; exclude operational details of intelligence activities.
  span_range:
  - src:739a9b782410#p7.4
  - src:739a9b782410#p12.4
  decision: Congress chose to establish an independent CIA that would coordinate national intelligence without controlling
    departmental intelligence agencies.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: 'The decision point is the Authority’s allocation of functions under Directive 5: central performance where it was
    judged more efficient, without subordinating departmental analytical capabilities or consolidating all collection operations.
    Frame the issue as authority and interagency boundaries; exclude any description of operational methods.'
  span_range:
  - src:739a9b782410#p9.3
  - src:739a9b782410#p10.2
  decision: The National Intelligence Authority chose to assign certain intelligence functions centrally to the Central Intelligence
    Group while preserving departmental autonomy in analysis and some operations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is how to prioritize shrinking intelligence resources between immediate tactical support for deployed
    forces and national strategic intelligence. The passage gives troop security and commanders’ decision needs as reasons,
    and notes the resulting diversion of strategic resources; exclude operational details of military or intelligence activity.
  span_range:
  - src:739a9b782410#p19.1
  - src:739a9b782410#p20.3
  decision: The President chose to make support for military operations the Intelligence Community’s first priority under
    PDD-35.
  content_domain: other:intelligence-prioritization
  refusal_sensitivity: medium
- n: 4
  focus: In 2001, the commission recommended no major structural changes rather than a fundamental reorganization, noting
    that efforts to strengthen community management while maintaining the DCI–Secretary of Defense relationship were bearing
    fruit. Treat this as the commission’s policy recommendation, not as a binding government decision; exclude the broader
    historical discussion of centralization and decentralization.
  span_range:
  - src:739a9b782410#p22.8
  - src:739a9b782410#p23.1
  decision: The Commission on National Security/21st Century decided what structural changes to recommend for management of
    the Intelligence Community.
  content_domain: intel-oversight
  refusal_sensitivity: medium
