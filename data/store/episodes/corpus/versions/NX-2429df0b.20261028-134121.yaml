  span_range:
  - src:ed0634cb2fb3#p285.3
  - src:ed0634cb2fb3#p285.5
  decision: The Director of Central Intelligence directed analysts to reexamine the estimate of Soviet military expenditures.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 34
  focus: The analysts faced a choice between maintaining the evidentiary threshold they stated and accepting the Army’s inference
    from the volume of munitions reaching its forces. The passage reports their rationale and that later evidence showed their
    assessment was wrong; exclude any inference about collection methods.
  span_range:
  - src:ed0634cb2fb3#p286.4
  - src:ed0634cb2fb3#p286.4
  decision: CIA analysts maintained that there was not hard evidence that Sihanoukville was a major port for North Vietnamese
