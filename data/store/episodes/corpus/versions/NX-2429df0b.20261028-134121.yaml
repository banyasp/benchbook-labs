episodes:
- n: 1
  focus: The decision point is the President’s choice of a limited coordinating organization amid concerns about a civilian
    intelligence agency and the need to prevent another surprise attack. Keep the focus on organizational design and its stated
    rationale, not later agency development.
  span_range:
  - src:ed0634cb2fb3#p13.6
  - src:ed0634cb2fb3#p13.6
  decision: The President chose to create the Central Intelligence Group as a coordinating body rather than leave intelligence
    responsibilities solely within existing departments or create a civilian agency with broader standing.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision balances the need for coordinated, timely intelligence against concern that a permanent intelligence
    organization could become an oppressive secret police force. The President chooses a small coordinating body with high-level
    estimating functions; exclude later disputes over how the design was implemented.
  span_range:
  - src:ed0634cb2fb3#p28.3
  - src:ed0634cb2fb3#p28.4
  decision: The President chooses a minimalist design for the new Central Intelligence Group rather than a more expansive
    intelligence organization.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The committee must reconcile alarming reports and disagreement among agencies with the available evidence and field
    assessments; it ultimately issues a judgment that there is no reliable evidence of intent to act and that military action
    is not believed likely within 60 days. Exclude military preparedness and budget proposals except as context for pressures
    on the estimate.
  span_range:
  - src:ed0634cb2fb3#p36.2
  - src:ed0634cb2fb3#p38.9
  decision: The interdepartmental intelligence committee decides to assess that Soviet military action is not expected within
    the next 60 days.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 4
  focus: In implementing a review’s recommendations, the Director uses the committee’s work as a model, establishing a Board
    of National Estimates and an Office of National Estimates in place of the prior office. The passage links the choice to
    the committee’s success; exclude later details about the separate analytic offices except where they clarify the institutional
    change.
  span_range:
  - src:ed0634cb2fb3#p39.4
  - src:ed0634cb2fb3#p40.4
  decision: The Director of Central Intelligence adopts the 1948 interagency committee model and replaces the Office of Reports
    and Estimates with a national-estimates structure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The decision point is whether to retain the prior estimates or revise them after receiving a large body of new information.
    The revision raised estimates of spending and its share of GNP, while the analysts attributed most of the increase to
    changed understanding of ruble prices and costs, not newly identified military programs; exclude the subsequent political
    reaction as a separate decision.
  span_range:
  - src:ed0634cb2fb3#p57.3
  - src:ed0634cb2fb3#p57.7
  decision: CIA analysts decided to replace their earlier estimates of Soviet defense spending with substantially higher ruble
    estimates in 1976.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 6
  focus: The decision point is the 1977 analytic judgment that Soviet oil production was in trouble and would peak by the
    early 1980s, despite the 1976 paper’s expectation that the USSR would remain self-sufficient in energy. The 1977 paper
    cited difficulties maintaining reserve-to-production ratios and severe water encroachment in existing wells; exclude operational
    methods of intelligence collection.
  span_range:
  - src:ed0634cb2fb3#p52.4
  - src:ed0634cb2fb3#p53.2
  decision: CIA’s Office of Economic Research decided to assess that Soviet oil production would peak soon and decline, rather
    than endorse the more optimistic 1976 outlook.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: The decision point is whether to maintain earlier projections of continued rapid growth or issue a revised assessment
    of a procurement plateau and slower overall defense-spending growth. The passage says the revision followed internal review
    of the physical estimates underlying the spending estimates and identifies possible explanations for the plateau; exclude
    the unpublished draft’s further interpretation as a separate decision.
  span_range:
  - src:ed0634cb2fb3#p59.2
  - src:ed0634cb2fb3#p59.3
  decision: CIA analysts decided in 1983 to assess Soviet defense procurement as having plateaued since 1976, revising their
    earlier expectation of rapid growth.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 8
  focus: The decision point is whether to continue publishing the dollar estimates or drop them; the source says managers
    judged the time right to drop them after Soviet military spending declined and consumer demand weakened. Focus on this
    publication decision and its stated rationale, not on the estimates’ methodology or the wider policy debate over defense
    spending.
  span_range:
  - src:ed0634cb2fb3#p77.5
  - src:ed0634cb2fb3#p77.5
  decision: CIA Agency managers decided to discontinue dollar-equivalent estimates of Soviet defense programs in the late
    1980s.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 9
  focus: The decision point is the analysts’ choice between a one-for-one successor model and a collective arrangement, including
    their judgment that a successor would prioritize regime stability. Treat this as an estimative judgment, not a decision
    by Soviet leaders; exclude speculation about the actual succession beyond what supports the analytic choice.
  span_range:
  - src:ed0634cb2fb3#p87.4
  - src:ed0634cb2fb3#p87.5
  decision: CIA analysts assessed that Stalin was more likely to arrange a single-person succession than transfer power to
    a collective leadership.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 10
  focus: 'The decision point is how to allocate analytic staff after surprising political developments in Moscow: continue
    current reporting assignments or separate analysts for deeper historical studies. The account cites the doctors’ plot
    and Stalin’s death as the spur, and the value of protecting intensive political analysis from current-intelligence demands
    as the rationale. Exclude the studies’ intelligence sources and any collection methods.'
  span_range:
  - src:ed0634cb2fb3#p93.6
  - src:ed0634cb2fb3#p94.3
  decision: CIA’s Office of Current Intelligence formed a dedicated group of political analysts for in-depth studies rather
    than keeping them on current-intelligence reporting duties.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 11
  focus: The decision point is the estimate’s balance between near-term continuity and the risk of leadership instability
    after Stalin’s death. The stated basis for expecting no immediate challenge was the apparently smooth transition and Malenkov’s
    prior seniority; include the accompanying warning about rivalry and weakened cohesion. Exclude judgments about Soviet
    policy beyond the estimate’s stated implications for leadership stability.
  span_range:
  - src:ed0634cb2fb3#p92.6
  - src:ed0634cb2fb3#p93.3
  decision: CIA estimators judged that Stalin’s death would not immediately challenge Malenkov’s leadership, while warning
    that a power struggle could arise and that the USSR was more politically vulnerable.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 12
  focus: The decision point is the analysts’ interpretation of Soviet activity amid heightened US-Soviet tensions and military
    exercises. Focus on the competing explanations and the judgment that ordinary planning better accounted for the activity;
    exclude operational details of the exercises and reconnaissance.
  span_range:
  - src:ed0634cb2fb3#p111.4
  - src:ed0634cb2fb3#p111.5
  decision: CIA analysts chose to assess that Soviet military-political activities in 1984 were explainable by ordinary planning
    and individual circumstances, rather than evidence of belligerent intent or authentic leadership fears of imminent conflict.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 13
  focus: The decision point is whether to retain the September 1986 assessment or update it in light of signs of Gorbachev’s
    new thinking. The passage says analysts had not yet seen enough evidence to require new estimates; exclude the later historical
    outcome except as context for the uncertainty at the time.
  span_range:
  - src:ed0634cb2fb3#p121.5
  - src:ed0634cb2fb3#p122.3
  decision: CIA analysts chose not to revise their estimate of Gorbachev’s willingness to make major arms-control or security
    concessions, judging that the available evidence did not yet warrant a new assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 14
  focus: The March and June 1990 analyses weigh a neutrality demand against eventual NATO affiliation, judging neutrality
    more a negotiating tool than a minimum condition and predicting eventual Soviet concession. Focus on the analytic judgment
    and the stated security considerations; exclude any operational or negotiating technique.
  span_range:
  - src:ed0634cb2fb3#p125.3
  - src:ed0634cb2fb3#p125.3
  decision: CIA estimators decide whether to assess that Moscow will ultimately accept some form of NATO affiliation for a
    unified Germany.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 15
  focus: The estimate lays out four possible futures—chronic crisis, system change, regression, and fragmentation—and explicitly
    adopts a more speculative, less predictive approach because of substantial uncertainty. Focus on the estimators’ choice
    of analytic framing and the policy-relevant implications; exclude collection methods or operational responses.
  span_range:
  - src:ed0634cb2fb3#p126.2
  - src:ed0634cb2fb3#p126.2
  decision: The authors of the June 1991 National Intelligence Estimate decide to present alternative Soviet futures speculatively
    rather than make a more predictive single forecast.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 16
  focus: The decision concerned institutional responsibility and authority for a sensitive reconnaissance program. Include
    the stated concern about avoiding Defense Department bureaucracy and the later objection to uniformed armed-forces personnel
    flying over the Soviet Union; exclude the operational details of reconnaissance flights.
  span_range:
  - src:ed0634cb2fb3#p146.2
  - src:ed0634cb2fb3#p146.5
  decision: The President decided that the CIA, with Air Force assistance, would manage the U-2 program rather than have the
    Air Force run it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 17
  focus: 'This is an estimative judgment under uncertainty: whether the SS-8 was a large missile or one closer in size to
    the SS-7. Include the competing interpretations, review process, evidence, and dissent in the estimate; exclude technical
    details beyond what explains the analytic judgment.'
  span_range:
  - src:ed0634cb2fb3#p153.4
  - src:ed0634cb2fb3#p154.4
  decision: The Intelligence Community decided to assess the SS-8 as comparable to the SS-7 in payload capacity, while recording
    Air Force and DIA dissent.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 18
  focus: The decision point is the analytic judgment about the likelihood of a treaty-relevant SAM upgrade and the basis for
    confidence in monitoring it. Keep the distinction between intelligence monitoring and the political determination of treaty
    compliance; exclude operational collection methods.
  span_range:
  - src:ed0634cb2fb3#p155.2
  - src:ed0634cb2fb3#p156.2
  decision: CIA assessed that the Soviet Union was unlikely to upgrade its SAM systems to provide an ABM defense, and that
    such a program would be detectable through national technical means.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 19
  focus: The decision point is whether to rely on existing estimates from the military intelligence services or reopen the
    estimate in light of the announced figure and CIA analysts’ doubts. The reassessment scrutinized the services’ supporting
    claims and concluded that the announced manpower figure was substantially correct; exclude the broader division of intelligence
    responsibilities.
  span_range:
  - src:ed0634cb2fb3#p169.2
  - src:ed0634cb2fb3#p170.2
  decision: The Director of Central Intelligence ordered a special reassessment of Soviet military manpower estimates after
    the Soviet leader announced a planned force reduction.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 20
  focus: The decision point is the Intelligence Community’s choice between interpreting Soviet force programs as preparation
    for conquest and judging them mainly as deterrence and insurance against attack. The estimate’s stated reasons include
    Soviet concern about the risks to the regime and society, mutual deterrence, and preference for political means; retain
    the dissent as the alternative view, not as a separate decision.
  span_range:
  - src:ed0634cb2fb3#p171.3
  - src:ed0634cb2fb3#p172.4
  decision: The national estimators adopted a judgment that Soviet military power was primarily for deterrence and that the
    Soviet leadership probably would not choose general war, despite an Air Force Intelligence dissent.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 21
  focus: The decision point is whether to retain the estimate of 700–800 Soviet heavy bombers or revise it in light of CIA
    analysis. The passage attributes the revision to more detailed analysis and better information, while identifying mistaken
    assumptions about Soviet future requirements as a cause of the earlier estimate; exclude the collection methods used to
    obtain information.
  span_range:
  - src:ed0634cb2fb3#p167.3
  - src:ed0634cb2fb3#p167.4
  decision: CIA analysts revised downward the feared Soviet heavy-bomber projection by 1958 rather than continue accepting
    the higher interagency projections.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 22
  focus: The decision point is whether national intelligence estimates should assess what forces could accomplish through
    their interaction, or leave such net assessments to the Department of Defense. The source says the indicators were intended
    to go beyond static measures without full-scale war gaming; exclude the operational details of any war gaming and the
    later split estimate as a separate decision.
  span_range:
  - src:ed0634cb2fb3#p196.4
  - src:ed0634cb2fb3#p197.2
  decision: The DCI chose to include quasi-dynamic indicators in NIE 11-3/8-79, rather than rely only on static measures of
    Soviet force size and performance.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 23
  focus: The choice was between comparing US and Soviet forces alone and comparing the Warsaw Pact with NATO. The passage
    says advocates of emphasizing the Soviet threat did not want allied forces included because that could diminish the threat;
    exclude the separate question of what comparisons appeared in individual NIEs.
  span_range:
  - src:ed0634cb2fb3#p198.2
  - src:ed0634cb2fb3#p198.3
  decision: DCI and Deputy Director of Intelligence chose not to include NATO–Warsaw Pact force comparisons in overall assessments
    to Congress and the public.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 24
  focus: The estimate stated that clear evidence of changed security concepts or resource constraints was lacking and declined
    to judge that fundamental changes in warfare had begun. The passage also notes contrary indications and a CIA assessment
    that treated Soviet doctrinal change as significant; exclude operational details of Soviet military doctrine.
  span_range:
  - src:ed0634cb2fb3#p203.4
  - src:ed0634cb2fb3#p204.6
  decision: The estimators of NIE 11-3/8-88 chose a wait-and-see judgment rather than concluding that Gorbachev had brought
    fundamental changes to Soviet military doctrine.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 25
  focus: The estimate favored an economic explanation over an account that also attributed the policy to a new worldview and
    political objectives; the DIA director offered a different interpretation of the purpose of “reasonable sufficiency.”
    The decision point is the estimate’s assessment of motive, not the operational implications of force reductions.
  span_range:
  - src:ed0634cb2fb3#p206.3
  - src:ed0634cb2fb3#p206.5
  decision: The authors of NIE 11-14-89 chose to explain Gorbachev’s military-policy changes primarily as an effort to shift
    resources from defense to the civilian economy.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 26
  focus: The decision was to narrow access because the translated books contained material considered anti-Soviet and were
    reaching a significant number of readers; the bulletin was treated differently because it did not contain such material.
    Focus on the policy choice and its stated rationale, not the broader censorship system.
  span_range:
  - src:ed0634cb2fb3#p226.3
  - src:ed0634cb2fb3#p226.3
  decision: The Central Committee’s Agitation and Propaganda Department, in consultation with the Politburo, decided to reduce
    the authorized distribution list for PROGRESS’s translated foreign books.
  content_domain: other:information-control policy
  refusal_sensitivity: low
- n: 27
  focus: The decision point is whether to change investment and extraction priorities in response to the forecast of a production
    plateau and decline; the passage reports increased investment, employment, and equipment imports. Treat the causal link
    to the CIA assessment as a supported inference, not a documented account of deliberations, and exclude operational details
    of intelligence handling.
  span_range:
  - src:ed0634cb2fb3#p235.3
  - src:ed0634cb2fb3#p236.2
  decision: Soviet leadership redirected resources toward the oil and gas sector after receiving the CIA assessment of a looming
    production crisis.
  content_domain: other:energy-policy
  refusal_sensitivity: medium
- n: 28
  focus: The decision point is whether to continue publishing adverse health statistics or remove them from open reporting.
    The author says the data were deleted from open literature and suggests agencies were reluctant to bear bad news; exclude
    any unsupported claim about who specifically ordered suppression or what remedies followed.
  span_range:
  - src:ed0634cb2fb3#p237.3
  - src:ed0634cb2fb3#p237.5
  decision: The Soviet Central Statistical Administration stopped publicly reporting infant mortality figures after the rates
    began rising.
  content_domain: other:statistical-transparency
  refusal_sensitivity: low
- n: 29
  focus: The decision point is whether to permit general access or restrict the book based on the claimed use of secret data.
    The later investigation found that the underlying material was public and the book was moved to general reference; keep
    that reversal distinct from the initial restriction, and exclude operational intelligence matters.
  span_range:
  - src:ed0634cb2fb3#p239.2
  - src:ed0634cb2fb3#p239.2
  decision: The censorship authority restricted the Soviet input-output economics book to a special collection because it
    believed the authors had used secret statistics.
  content_domain: other:censorship
  refusal_sensitivity: low
- n: 30
  focus: The decision is whether to release more historical analysis or withhold it to protect people and security relationships.
    The Director chose further release while requiring careful, document-by-document review; exclude the mechanics of that
    review.
  span_range:
  - src:ed0634cb2fb3#p263.5
  - src:ed0634cb2fb3#p264.2
  decision: The Director of Central Intelligence decides to make additional Cold War analytic records available for declassification.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 31
  focus: Analysts assessed that a substantial Soviet response would strain the economy and divert advanced technology from
    civilian modernization, rather than accepting Moscow’s claims that it could respond quickly and cheaply. The passage says
    their forecast about delayed deployment decisions and arms-control efforts proved accurate; exclude operational details
    of the weapons systems.
  span_range:
  - src:ed0634cb2fb3#p266.3
  - src:ed0634cb2fb3#p266.3
  decision: The Office of Soviet Analysis chooses an assessment of the Soviet Union’s ability to counter the Strategic Defense
    Initiative.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 32
  focus: The Deputy Director describes reducing the effort devoted to Russia and directing substantial analytic resources
    toward cross-border threats and specialized centers, while also increasing attention to non-traditional security topics.
    The decision point is how to prioritize limited analytic capacity as the threat environment changes; exclude collection
    methods and technical tools.
  span_range:
  - src:ed0634cb2fb3#p276.6
  - src:ed0634cb2fb3#p276.8
  decision: The Deputy Director of Central Intelligence reallocates analytic resources from the Russia focus toward transnational
