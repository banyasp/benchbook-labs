episodes:
- n: 1
  focus: The decision point is whether to approve the revised system after its trial period, rather than reject it or require
    further revision. The passage cites the system’s generally satisfactory results and incorporation of supervisors’ constructive
    suggestions; exclude individual employee ratings and other personnel actions.
  span_range:
  - src:319579b78168#p24.2
  - src:319579b78168#p25.3
  decision: The Civil Service Commission approved NSA’s revised performance-rating system as its official system in April
    1956.
  content_domain: other:federal personnel policy
  refusal_sensitivity: low
- n: 2
  focus: Congress could have left NSA subject to the Act or exempted it; Public Law 88-290 provided the exemption, allowing
    NSA to develop its own appraisal systems. A later memorandum cited the sensitivity of employee duties and the security
    risk of disclosing classified performance information as the rationale; exclude operational intelligence activity.
  span_range:
  - src:319579b78168#p29.3
  - src:319579b78168#p29.5
  decision: Congress exempted NSA from the Performance Rating Act of 1950.
  content_domain: other:personnel policy
  refusal_sensitivity: low
- n: 3
  focus: The Director chose more specific target distributions, including limiting the majority to Level 4 and setting small
    shares for the lowest and highest ratings, rather than leaving the previous distribution in place. The passage gives the
    stated concerns and expectations; exclude appraisal techniques beyond this policy choice.
  span_range:
  - src:319579b78168#p41.3
  - src:319579b78168#p41.4
  decision: The NSA Director revised the 1976 rating-distribution targets to address inflated ratings and weak identification
    of low performers.
  content_domain: other:personnel policy
  refusal_sensitivity: low
- n: 4
  focus: 'After agency experience, surveys, and employee observations, the Director changed the system for the next cycle:
    it moved to five levels, removed peer rankings, and retained distribution limits only for the highest rating. The stated
    rationale was to assess past performance and future expectations against defined objectives rather than use finite relative
    rankings.'
  span_range:
  - src:319579b78168#p42.2
  - src:319579b78168#p42.5
  decision: The NSA Director refocused the career evaluation system on performance against expectations rather than ranking
    employees against one another.
  content_domain: other:personnel policy
  refusal_sensitivity: low
- n: 5
  focus: The General Counsel found that the system could be lawful if rating definitions were clear enough for uniform interpretation.
    Personnel revised the definitions, removed the cap on Level 7 ratings, and retained separate identification of top performers
    by grade; exclude general discussion of later appraisal reforms.
  span_range:
  - src:319579b78168#p44.2
  - src:319579b78168#p44.5
  decision: NSA personnel leadership and the DDO decide how to revise the 1977 career evaluation ratings and quota rules.
  content_domain: other:personnel-policy
  refusal_sensitivity: low
- n: 6
  focus: NSA could have continued without a CSRA-style system or adopted an agency system; leadership chose the latter and
    tied salary increases, including WGIs, to appraisal. The passage cites the CSRA’s performance-based requirements and the
    goal of making ratings consequential; exclude the forms and mechanics of administering PPEC.
  span_range:
  - src:319579b78168#p47.2
  - src:319579b78168#p47.4
  decision: The NSA Director and personnel leadership decide to establish PPEC, an agency appraisal system linked to compensation
    and personnel actions, despite NSA’s exemption from the CSRA.
  content_domain: other:personnel-policy
  refusal_sensitivity: low
- n: 7
  focus: The General Counsel warned that Galaxy lacked legally adequate job-duty justification and documentation for ratings,
    and recommended P1C as an interim alternative; the interim system subsequently used P1C. Focus on the choice between proceeding
    with Galaxy and using the interim form, not on the form’s administrative details.
  span_range:
  - src:319579b78168#p52.3
  - src:319579b78168#p52.5
  decision: NSA personnel leadership decides to abandon the proposed Galaxy appraisal design and use Form P1C as an interim
    measure.
  content_domain: other:personnel-policy
  refusal_sensitivity: low
- n: 8
  focus: The Task Force weighed the proposed objectives-and-behaviors model against an objectives-only approach after the
    pilot. The pilot raised concerns that behaviors overlapped objectives, were poorly defined, and seemed arbitrary or subjective;
    the Task Force chose measurable job objectives to support a more level assessment. Exclude broader descriptions of P3
    and its later history.
  span_range:
  - src:319579b78168#p61.5
  - src:319579b78168#p63.1
  decision: The NSA Personnel Reform Task Force chose to base P3 ratings initially on measurable weighted objectives, rather
    than also rating performance behaviors.
  content_domain: other:personnel-performance policy
  refusal_sensitivity: low
- n: 9
  focus: The decision followed an independent assessment and congressional concerns. The Secretary chose not to implement
    DCIPS, citing operational tempo and those concerns, while supporting a common performance-oriented personnel framework;
    NSA retained its grade structure and continued ACE. Exclude the separate mechanics of rating and compensation calculations.
  span_range:
  - src:319579b78168#p74.2
  - src:319579b78168#p74.5
  decision: The Secretary of Defense decided not to implement DCIPS at NSA, retaining the existing pay structure while continuing
    ACE performance evaluations.
  content_domain: other:personnel-performance policy
  refusal_sensitivity: low
- n: 10
  focus: The passage presents a choice to simplify employee appraisals, citing the supervisory time consumed by the previous
    system. Keep the decision at the level of personnel policy; do not infer details about who approved it or when beyond
    what the passage states.
  span_range:
  - src:319579b78168#p121.2
  - src:319579b78168#p121.3
  decision: NSA decision makers instituted a satisfactory/unsatisfactory appraisal system with no intermediate rating instead
    of the previous, more detailed system.
  content_domain: other:personnel policy
  refusal_sensitivity: low
