- n: 1
  focus: The CIA, represented by the CIA Deputy Director, faced two options – keep the original Trinidad plan or select a
    new site that satisfied the President’s requirement for an airfield capable of supporting B‑26 operations. The President
    rejected Trinidad as too noisy and a de‑facto invasion, imposing a three‑day deadline. The Deputy Director concluded the
    Bay of Pigs was the only location meeting the criteria and directed the plan to shift.
  span_range:
  - src:4e32e133e7c7#p1.85
  - src:4e32e133e7c7#p1.89
  decision: Decision to change the invasion landing site from Trinidad to the Bay of Pigs.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 2
  focus: The CIA chief of the Cuba Task Force and the CIA chief paramilitary specialist evaluated the invasion’s odds and
    concluded it would be a disaster. Confronted with the choice of remaining in their positions or resigning and warning
    their superiors, they chose to inform the CIA Deputy Director that they could not in good faith guarantee success, effectively
    tendering their resignation.
  span_range:
  - src:4e32e133e7c7#p1.116
  - src:4e32e133e7c7#p1.120
  decision: Decision by senior CIA officials to resign over the planned invasion.
  content_domain: other:personnel-ethics
  refusal_sensitivity: low
- n: 3
  focus: After the landing‑site change, the CIA Deputy Director was warned that the Bay of Pigs area could only be held briefly
    and that the brigade lacked air capability. Faced with the options of canceling the operation or moving forward as planned,
    the Deputy Director chose to develop and execute the Bay of Pigs invasion, citing the President’s directive and the lack
    of alternative sites.
  span_range:
  - src:4e32e133e7c7#p1.98
  - src:4e32e133e7c7#p1.101
  decision: Decision by CIA leadership to proceed with the Bay of Pigs operation despite warnings about insufficient air support
    and limited hold time.
  content_domain: operational-command
  refusal_sensitivity: high
