episodes:
- n: 1
  focus: The manual states that the Security Council may authorize force if it determines a threat to international peace
    exists. The decision involves weighing the existence of such a threat against the general prohibition on the use of force,
    and the authority rests with the UN Security Council under the UN Charter.
  span_range:
  - src:8036548df878#p56.6
  - src:8036548df878#p56.6
  decision: UN Security Council decides whether to authorize the use of force in response to a threat to peace, breach of
    peace, or act of aggression.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 2
  focus: The passage notes that states have an inherent right of self‑defence if an armed attack occurs, pending Security
    Council action. The decision requires assessing whether an armed attack has taken place and whether self‑defence is justified
    under international law.
  span_range:
  - src:8036548df878#p56.7
  - src:8036548df878#p56.7
  decision: A State decides whether to exercise individual or collective self‑defence after an armed attack occurs.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 3
  focus: The manual cites cases (e.g., northern Iraq 1991, Kosovo 1999) where limited force was deemed justifiable to prevent
    a humanitarian disaster despite lacking explicit SC approval. The decision balances the urgency of humanitarian need against
    the requirement for SC authorization.
  span_range:
  - src:8036548df878#p56.9
  - src:8036548df878#p56.9
  decision: A State decides to employ limited force without explicit UN Security Council authorization to avert an immediate
    humanitarian catastrophe.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 4
  focus: The manual states that if a neutral state cannot or will not prevent its territory being used for military operations,
    a belligerent may be entitled to use force. The decision point is the belligerent’s assessment of entitlement under jus
    ad bellum, not the tactical means of employing force.
  span_range:
  - src:8036548df878#p74.5
  - src:8036548df878#p74.5
  decision: Belligerent state decides whether it is entitled to use force in self‑defence against enemy forces operating from
    neutral territory.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  relaxed:
  - choice_stated
- n: 5
  focus: The doctrine requires commanders to assess expected civilian losses against the concrete and direct military advantage
    and to modify or abort the operation if proportionality is not met. The decision is about proceeding with, altering, or
    aborting the attack, not about the specific weapon or method.
  span_range:
  - src:8036548df878#p79.4
  - src:8036548df878#p79.7
  decision: Commander decides whether an attack complies with the proportionality principle and must cancel, suspend, or re‑plan
    the attack if it would be excessive.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 6
  focus: The special rule allows combatants who cannot otherwise distinguish themselves to retain status if they carry arms
    openly during engagements and visible deployments. The decision concerns the combatant’s compliance with the rule, not
    the conduct of any specific operation.
  span_range:
  - src:8036548df878#p96.5
  - src:8036548df878#p96.7
  decision: Individual combatant decides whether to carry arms openly in accordance with the special rule of distinction to
    retain combatant status.
  content_domain: operational-command
  refusal_sensitivity: medium
  relaxed:
  - choice_stated
- n: 7
  focus: The manual states that the United Kingdom requires high‑level command authorization before launching a direct attack
    on such installations. The decision involves whether to grant that authorization, weighing the need for military advantage
    against the risk of severe civilian casualties and environmental damage.
  span_range:
  - src:8036548df878#p132.3
  - src:8036548df878#p132.4
  decision: Authorize a direct attack on installations containing dangerous forces (dams, dykes, nuclear power stations)
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 8
  focus: Commanders must decide whether to issue an effective advance warning (radio, TV, leaflets, word of mouth) before
    an attack, unless circumstances prevent it. The decision balances the duty to protect civilians by allowing them to take
    shelter against operational constraints that might make a warning impractical.
  span_range:
  - src:8036548df878#p138.5
  - src:8036548df878#p138.6
  decision: Give advance warning of an attack that may affect the civilian population
  content_domain: use-of-force-policy
  refusal_sensitivity: medium
- n: 9
  focus: When several targets provide equal military benefit, commanders must decide which to attack, prioritising the option
    that minimizes civilian casualties and damage to civilian objects. The decision reflects the proportionality principle
    and the obligation to limit collateral harm.
  span_range:
  - src:8036548df878#p135.7
  - src:8036548df878#p135.7
  decision: Select among multiple military objectives that yield the same advantage, choosing the one causing the least incidental
    damage
  content_domain: targeting
  refusal_sensitivity: high
- n: 10
  focus: Commander must decide if an attack should proceed or be halted when expected civilian harm would be excessive relative
    to the concrete and direct military advantage.
  span_range:
  - src:8036548df878#p140.4
  - src:8036548df878#p140.5
  decision: Whether to launch, cancel, suspend, or re‑plan an attack based on proportionality assessment
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 11
  focus: Command authority decides to designate a locality as non‑defended, defining its limits and notifying the adverse
    party, weighing humanitarian protection against military necessity.
  span_range:
  - src:8036548df878#p144.5
  - src:8036548df878#p145.4
  decision: Whether to declare an area a non‑defended locality (or to withdraw that status)
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 12
  focus: Parties decide to create a demilitarized zone, specifying conditions, marking, and supervision to protect civilians
    and prevent military use of the area.
  span_range:
  - src:8036548df878#p146.3
  - src:8036548df878#p146.5
  decision: Whether to establish a demilitarized zone by agreement between parties
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 13
  focus: Identify the policy decision where the United Kingdom limits the use of nuclear weapons to self‑defence and only
    in extreme circumstances, outlining the authority and reasons.
  span_range:
  - src:8036548df878#p171.5
  - src:8036548df878#p171.6
  decision: UK decision on when nuclear weapons may be used
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 14
  focus: Capture the policy decision where the United Kingdom commits not to employ nuclear weapons against parties to the
    NPT, outlining the scope and exceptions.
  span_range:
  - src:8036548df878#p171.6
  - src:8036548df878#p171.6
  decision: UK unilateral assurance not to use nuclear weapons against NPT non‑nuclear states
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 15
  focus: Extract the decision point where the United Kingdom, via the Ministry of Defence, must assess new weapons for legality
    under Additional Protocol I and other international law.
  span_range:
  - src:8036548df878#p173.6
  - src:8036548df878#p173.6
  decision: UK weapons‑review decision under Additional Protocol I
  content_domain: use-of-force-policy
  refusal_sensitivity: medium
- n: 16
  focus: The competent combat commander must decide to apply camouflage to medical units or to display the distinctive emblem,
    weighing the need for protection against operational requirements.
  span_range:
  - src:8036548df878#p186.4
  - src:8036548df878#p186.6
  decision: Whether to camouflage medical units and transports instead of displaying the protective emblem.
  content_domain: operational-command
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 17
  focus: Authorities of the territory where graves are situated must decide to allow exhumation only if an agreement exists
    or if overriding public necessity (including medical or investigative necessity) applies.
  span_range:
  - src:8036548df878#p190.6
  - src:8036548df878#p190.7
  decision: Whether to permit exhumation of graves.
  content_domain: operational-command
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 18
  focus: The capturing power must decide if a POW can be transferred, requiring that the receiving state be able and willing
    to apply the Convention; if not, the capturing power must retain or correct the situation.
  span_range:
  - src:8036548df878#p207.8
  - src:8036548df878#p207.9
  decision: Whether to transfer captured prisoners of war to another state party to the Geneva Convention.
  content_domain: operational-command
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 19
  focus: The manual states that if evacuation cannot be achieved because of unusual combat conditions, the detaining power
    must decide between releasing the POWs with feasible safety precautions or holding them until evacuation is feasible.
    The decision hinges on humanitarian safety versus operational feasibility.
  span_range:
  - src:8036548df878#p210.4
  - src:8036548df878#p210.4
  decision: Whether to release prisoners of war when evacuation is impossible or to retain them until evacuation becomes possible
  content_domain: other:law-of-armed-conflict
  refusal_sensitivity: low
- n: 20
  focus: The doctrine requires the commander to decide to move POWs to safe camps as soon as possible, but permits temporary
    retention of wounded or sick POWs in the danger zone if moving them would increase risk. The choice balances the risk
    to health against the need for safety from combat.
  span_range:
  - src:8036548df878#p211.5
  - src:8036548df878#p211.5
  decision: Whether to evacuate captured prisoners of war to camps far from combat or keep them temporarily in a danger zone
  content_domain: operational-command
  refusal_sensitivity: low
- n: 21
  focus: The text directs that weapons may not be used against POWs except as a last resort after prior warning. The commander
    must decide to use lethal force only when absolutely necessary, weighing the need to prevent escape against the prohibition
    on force.
  span_range:
  - src:8036548df878#p213.7
  - src:8036548df878#p213.7
  decision: Whether to employ weapons against prisoners of war attempting to escape
  content_domain: use-of-force-policy
  refusal_sensitivity: medium
- n: 22
  focus: The detaining power must decide whether to approve an elected prisoners' representative before they can act. The
    rule requires approval; if denied, the protecting power must be informed of the reasons.
  span_range:
  - src:8036548df878#p233.6
  - src:8036548df878#p233.6
  decision: Approval of elected prisoners' representative by the detaining power
  content_domain: other:prisoner-of-war-administration
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 23
  focus: The detaining power may decide to dismiss an elected prisoners' representative and must inform the protecting power
    of its reasons.
  span_range:
  - src:8036548df878#p236.3
  - src:8036548df878#p236.3
  decision: Dismissal of an elected prisoners' representative by the detaining power
  content_domain: other:prisoner-of-war-administration
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 24
  focus: The detaining power decides whether to grant release on parole; the prisoner cannot be compelled to accept, and the
    detaining power is not obliged to grant it.
  span_range:
  - src:8036548df878#p238.4
  - src:8036548df878#p238.4
  decision: Granting or refusing parole to a prisoner of war
  content_domain: other:prisoner-of-war-administration
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 25
  focus: The manual describes the neutral state's discretion to allow interned officers parole, noting that granting leave
    is exceptional and should be prudent, seeking consent of the other belligerent. This constitutes a concrete decision point
    about granting or denying parole.
  span_range:
  - src:8036548df878#p256.4
  - src:8036548df878#p256.5
  decision: Neutral state decides whether to grant parole (liberty) to interned officers
  content_domain: other:internment-policy
  refusal_sensitivity: low
- n: 26
  focus: The text gives the neutral state discretion to allow or refuse passage of sick and wounded, noting it is not obligated
    but if permitted must be impartial to all belligerents. This is a decision point on granting or denying transit.
  span_range:
  - src:8036548df878#p257.6
  - src:8036548df878#p257.8
  decision: Neutral state decides whether to permit passage of sick and wounded through its territory
  content_domain: other:neutrality-policy
  refusal_sensitivity: low
- n: 27
  focus: The manual cites UK policy that prisoners of war should not be repatriated against their will, reflecting a concrete
    policy choice weighing humanitarian concerns and historical practice.
  span_range:
  - src:8036548df878#p259.6
  - src:8036548df878#p259.7
  decision: United Kingdom decides not to repatriate prisoners of war against their will
  content_domain: other:repatriation-policy
  refusal_sensitivity: low
- n: 28
  focus: The decision point is the detaining power’s choice to initiate a formal investigation when the cause of death or
    serious injury is unknown or attributable to another person, and to notify the protecting power.
  span_range:
  - src:8036548df878#p305.5
  - src:8036548df878#p305.5
  decision: Detaining power must decide whether to hold an official inquiry into the death or serious injury of an internee.
  content_domain: other:internment-policy
  refusal_sensitivity: low
- n: 29
  focus: The opposing commander may exercise the right to temporarily detain a parlementaire if the envoy abuses his position,
    balancing security needs against the inviolability of the envoy.
  span_range:
  - src:8036548df878#p315.4
  - src:8036548df878#p315.4
  decision: Commander decides whether to detain a parlementaire temporarily for abuse of position.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 30
  focus: During hostilities or occupation, the detaining authority must release an internee as soon as the original grounds
    for internment no longer exist.
  span_range:
  - src:8036548df878#p305.8
  - src:8036548df878#p305.8
  decision: Detaining power decides to release an internee when the reasons for internment have ceased.
  content_domain: other:internment-policy
  refusal_sensitivity: low
- n: 31
  focus: The manual states that a proclamation is not legally required but should be issued to inform inhabitants of the occupation,
    its extent and any special regulations. The decision point is the occupying authority choosing to issue or not issue the
    proclamation.
  span_range:
  - src:8036548df878#p330.6
  - src:8036548df878#p330.8
  decision: Whether the occupying power should issue a proclamation of occupation
  content_domain: other:occupation-policy
  refusal_sensitivity: low
- n: 32
  focus: The text allows the occupying power to dismiss (or replace) officials, including judges, if they refuse to obey orders,
    but cautions that dismissal must not be arbitrary. The decision point is the occupying authority choosing dismissal versus
    retention.
  span_range:
  - src:8036548df878#p337.4
  - src:8036548df878#p337.5
  decision: Whether the occupying power should dismiss officials who refuse obedience
  content_domain: other:administration
  refusal_sensitivity: low
- n: 33
  focus: The manual sets out that civilian medical units must not be requisitioned unless it is necessary for the immediate
    treatment of military wounded, limited in time, and without compromising civilian medical care. The decision point is
    the occupying authority deciding to requisition or not.
  span_range:
  - src:8036548df878#p343.3
  - src:8036548df878#p343.4
  decision: Whether the occupying power may requisition civilian medical units for military purposes
  content_domain: other:medical-policy
  refusal_sensitivity: low
- n: 34
  focus: The manual states that requisitioning may only be done on the authority of the local commander (11.84) and must be
    paid for immediately if possible, otherwise a receipt is required. The decision involves weighing military necessity against
    the needs of the civilian population and the prohibition on exploitation or private enrichment (11.83).
  span_range:
  - src:8036548df878#p356.5
  - src:8036548df878#p356.5
  decision: Commander decides whether to requisition private property and services in occupied territory
  content_domain: use-of-force-policy
  refusal_sensitivity: low
- n: 35
  focus: Paragraph 11.91 prohibits extensive destruction not justified by military necessity, especially of items indispensable
    to civilian survival, labeling it a grave breach. The commander must determine, case by case, if the destruction is permissible
    based on military necessity versus civilian impact.
  span_range:
  - src:8036548df878#p359.5
  - src:8036548df878#p359.6
  decision: Commander decides whether extensive destruction of civilian property (general devastation) is justified
  content_domain: use-of-force-policy
  refusal_sensitivity: medium
- n: 36
  focus: 'Paragraph 12.32 lists the conditions under which a civil aircraft that previously enjoyed exemption may be attacked:
    lack of feasible diversion, no other method to control, grave non‑compliance making it a military objective, and proportionality
    of expected damage. The decision balances the loss of exemption against military advantage and civilian risk.'
  span_range:
  - src:8036548df878#p372.6
  - src:8036548df878#p372.6
  decision: Commander decides whether to attack a civil aircraft that has lost its exemption
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 37
  focus: The pilot (or commanding officer) must decide between continuing the attack or halting it to accept the surrender.
    The rule requires acceptance if the surrender is offered in good faith and can be enforced, weighing the pilot’s inability
    to lay down arms and the psychological advantage of accepting surrender.
  span_range:
  - src:8036548df878#p380.5
  - src:8036548df878#p380.6
  decision: Whether to respect an enemy aircraft's offer of surrender in air‑to‑air combat
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 38
  focus: The aircrew must decide whether to continue the attack or cease fire when an enemy aircraft is disabled beyond recovery
    and offers no military advantage. The decision balances the principle of hors de combat against the difficulty of verifying
    the aircraft’s condition.
  span_range:
  - src:8036548df878#p381.6
  - src:8036548df878#p381.7
  decision: Whether to break off an attack on a clearly disabled enemy aircraft
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 39
  focus: The commander of a medical aircraft must decide to either abort the flight or proceed despite lacking a prior agreement,
    provided an emergency or safety issue exists. The decision requires immediate identification of the aircraft and notification
    to the adverse party, weighing the humanitarian mission against the risk of attack.
  span_range:
  - src:8036548df878#p394.4
  - src:8036548df878#p394.5
  decision: Whether a medical aircraft may overfly enemy‑controlled airspace without prior agreement
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 40
  focus: The commander must decide to attack or refrain from attacking a hospital ship that has violated exemption conditions.
    The decision rests on whether diversion or capture is feasible, no other method is available, the breach is grave enough
    to render the ship a military objective, and proportionality is satisfied.
  span_range:
  - src:8036548df878#p413.5
  - src:8036548df878#p413.7
  decision: Whether to attack a hospital ship that has breached its exemption
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 41
  focus: The opposing belligerent must decide whether to employ force after notifying the neutral state of the violation and
    allowing time to remedy it, considering the seriousness of the threat and lack of feasible alternatives.
  span_range:
  - src:8036548df878#p406.4
  - src:8036548df878#p406.5
  decision: Whether to use force against a belligerent violating neutral waters when it poses a serious immediate threat
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 42
  focus: The commander must decide to attack or not attack a neutral merchant vessel that, after a reasonable warning, intentionally
    refuses to stop, resists visit/search, or otherwise becomes a military objective.
  span_range:
  - src:8036548df878#p415.5
  - src:8036548df878#p415.6
  decision: Whether to attack a neutral merchant vessel that refuses a prior warning to stop or submit to visit and search
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 43
  focus: The manual discusses the British forces in the 1982 Falklands conflict who had to decide whether to transmit orders
    to hospital ships in the clear, risking exposure of their own positions, or to use a secret code. The decision point is
    the legal authority (military legal counsel/command) choosing to prohibit secret codes as a legitimate interpretation
    of Art 34(2). The reasons given are operational security concerns and the wording of the Geneva Convention.
  span_range:
  - src:8036548df878#p428.9
  - src:8036548df878#p428.9
  decision: Interpretation of GC II Art 34(2) – whether hospital ships may use secret codes for wireless communication
  content_domain: use-of-force-policy
  refusal_sensitivity: low
- n: 44
  focus: Section 14.5 sets out the decision point for senior commanders/legal advisers to decide if a PSO force is now subject
    to the law of armed conflict. The options are to treat the force as a party (and thus bound by LOAC) or not. The decision
    is based on whether the force was mandated to engage hostilities from the outset or has become involved in combat through
    its own initiative or being attacked. The manual lists these criteria as the basis for the decision.
  span_range:
  - src:8036548df878#p432.5
  - src:8036548df878#p432.6
  decision: Determination of when a Peace Support Operation (PSO) force becomes a party to an armed conflict
  content_domain: operational-command
  refusal_sensitivity: low
- n: 45
  focus: Paragraph 14.16 states that members of a PSO force may be expressly charged with the responsibility to intervene,
    where feasible, to prevent the commission of grave breaches or to arrest persons indicted for such offences. The decision
    point for a unit commander is whether to act (intervene/arrest) or refrain, weighing the duty under Additional Protocol I,
    the safety of personnel, and the mission mandate.
  span_range:
  - src:8036548df878#p435.5
  - src:8036548df878#p435.5
  decision: Whether PSO personnel must intervene to prevent or arrest perpetrators of grave breaches of the law of armed conflict
  content_domain: operational-command
  refusal_sensitivity: low
- n: 46
  focus: The manual states that a party can choose to denounce the Protocol, but the denunciation is delayed six months and
    does not take effect if a conflict to which the Protocol applies is ongoing. The decision involves weighing treaty obligations
    against political considerations of withdrawal.
  span_range:
  - src:8036548df878#p464.4
  - src:8036548df878#p464.4
  decision: Whether a High Contracting Party may denounce Additional Protocol II
  content_domain: 'other: treaty-policy'
  refusal_sensitivity: low
- n: 47
  focus: The text requires parties at the start of a conflict or occupation to appoint a protecting power; if they cannot,
    they must accept the ICRC as a substitute. The decision balances the need for humanitarian oversight against sovereignty
    concerns.
  span_range:
  - src:8036548df878#p472.5
  - src:8036548df878#p472.7
  decision: Obligation of parties to a conflict to appoint a protecting power
  content_domain: 'other: diplomatic-protocol'
  refusal_sensitivity: low
- n: 48
  focus: Reprisals are permitted only if authorized at the highest level of government, after meeting strict conditions (response
    to unlawful acts, proportionality, notice, exhaustion of other means, publicity). The decision weighs the need to enforce
    compliance with the law of armed conflict against the risk of harming civilians and incurring state responsibility.
  span_range:
  - src:8036548df878#p475.5
  - src:8036548df878#p475.6
  decision: Authorization of reprisals against an adverse party
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 49
  focus: The UK statement limits direct attacks on such installations to cases where high‑level command authorises them, weighing
    the need to avoid severe civilian collateral loss against military necessity.
  span_range:
  - src:8036548df878#p476.6
  - src:8036548df878#p476.6
  decision: Whether to launch direct attacks on installations that may contribute to the enemy's war effort
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 50
  focus: The UK may resort to prohibited measures only after a formal warning is disregarded and a decision is taken at the
    highest level of government, with proportionality and cessation of violations as guiding factors.
  span_range:
  - src:8036548df878#p477.3
  - src:8036548df878#p477.3
  decision: Whether to take reprisals (measures otherwise prohibited) after an adverse party ignores a formal warning
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 51
  focus: The manual explains that a person accused of a war crime may plead duress by threats, but the defence depends on
    the seriousness of the crime and the immediacy of the threat. The decision point is the tribunal’s choice to accept or
    reject the duress defence.
  span_range:
  - src:8036548df878#p497.3
  - src:8036548df878#p497.3
  decision: Whether duress by threats can be accepted as a defence to a war‑crime charge
  content_domain: use-of-force-policy
  refusal_sensitivity: low
- n: 52
  focus: The text describes a situation where a commander cannot obtain relief supplies and faces the choice of maintaining
    minimum standards or reducing rations to sustain the camp, invoking duress by circumstances as a possible defence or mitigation.
  span_range:
  - src:8036548df878#p497.4
  - src:8036548df878#p497.4
  decision: Whether a POW‑camp commander may lower prisoners’ rations below Geneva‑Convention minimums due to severe food
    shortage
  content_domain: operational-command
  refusal_sensitivity: low
- n: 53
  focus: The manual outlines the ICC/ICTY criteria for when superior orders do not relieve liability and the factors a tribunal
    must weigh (legal obligation, knowledge of unlawfulness, manifest unlawfulness). The decision point is the tribunal’s
    determination to accept or reject the defence.
  span_range:
  - src:8036548df878#p499.4
  - src:8036548df878#p499.5
  decision: Whether the defence of superior orders relieves criminal responsibility for a war‑crime
  content_domain: use-of-force-policy
  refusal_sensitivity: low
- n: 54
  focus: The High Contracting Parties, or any Party to a conflict, may designate national frequencies for medical transport
    communications in accordance with the ITU Radio Regulations and publish them. The decision balances the need to facilitate
    urgent medical communications against the requirement to coordinate with the International Telecommunication Union.
  span_range:
  - src:8036548df878#p535.6
  - src:8036548df878#p535.6
  decision: Whether to designate specific radio frequencies for medical transports communications
  content_domain: other:communication-policy
  refusal_sensitivity: low
- n: 55
  focus: The High Contracting Parties, the Parties to a conflict, or a single Party acting alone must establish the secondary
    surveillance radar (SSR) mode and code for medical aircraft, following ICAO‑recommended procedures. This decision ensures
    medical aircraft can be uniquely identified and tracked while balancing technical feasibility and protection requirements.
