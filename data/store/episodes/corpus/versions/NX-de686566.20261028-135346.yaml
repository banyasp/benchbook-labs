    would be even-handed and nonpartisan, and that candidates did not need separate clearances. Focus on candidate access
    and the Director’s role; exclude the underlying dispute about the nominee’s email handling.
  span_range:
  - src:9c882ce3a05d#p18.3
  - src:9c882ce3a05d#p19.2
  decision: The Director of National Intelligence decided whether to withhold intelligence briefings from the Democratic presidential
    nominee after congressional Republicans requested that they be stopped.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The Director chose a single career briefer for continuity and to reduce concerns about political agendas or lobbying
    to retain office; he also kept the candidate-briefing team separate from the team supporting the sitting administration.
    Focus on impartiality and continuity in briefing leadership, not the substantive intelligence topics or briefing techniques.
  span_range:
  - src:9c882ce3a05d#p6.2
  - src:9c882ce3a05d#p6.3
  decision: The Director of National Intelligence decided to assign a career intelligence officer, rather than a political
    appointee, to lead briefings for both presidential candidates and the eventual president-elect.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The FBI Director disclosed the dossier’s existence and contents while clarifying that the FBI was not endorsing its
    allegations, because he believed the material created a potential vulnerability the president-elect needed to know about.
    Focus on the decision to inform and its stated rationale; exclude the truth of the claims and subsequent disputes over
    the leak.
  span_range:
  - src:9c882ce3a05d#p22.3
  - src:9c882ce3a05d#p23.2
  decision: The FBI Director decided to tell the president-elect that a dossier containing damaging, unsubstantiated claims
    about him was circulating.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is whether to restart enhanced interrogation or refrain, given the stated legal constraints and
    the nominees’ views; the president said he would accept their judgment and would not insist on the techniques if they
    opposed them. Focus on the policy choice and its legal and effectiveness considerations, not on the techniques themselves.
  span_range:
  - src:9c882ce3a05d#p26.3
  - src:9c882ce3a05d#p28.2
  decision: The president decides whether to resume enhanced interrogation and chooses to leave that judgment to his senior
