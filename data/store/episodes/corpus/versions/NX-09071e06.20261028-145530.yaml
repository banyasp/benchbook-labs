source: NX-09071e06
prompt: find_episodes.v1+316fb02bdef3
episodes:
- n: 1
  focus: The decision followed the failed effort to pass ULTRA through usual signals channels during the Battle of France,
    which produced an unreliable feed and wasted intelligence; leadership chose dedicated units in direct contact with Bletchley
    Park. Focus on the policy choice and the balance between timely access and protecting the source, not the units’ communications
    or field procedures.
  span_range:
  - src:3974d748773e#p15.6
  - src:3974d748773e#p15.7
  decision: British leadership decides to replace unreliable dissemination through ordinary service channels with small, specially
    trained units for future campaigns.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: After the visit, British officials judged that the American visitors were professional and that cooperation could
    be beneficial, despite earlier concerns about their ability to keep secrets. Focus on the authorization and its trust-versus-secrecy
    rationale; exclude technical details of the method disclosed.
  span_range:
  - src:3974d748773e#p19.10
  - src:3974d748773e#p20.3
  decision: The British prime minister authorizes disclosure of the bombe method to the American delegation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The agreement assigned Britain the lead on German military reporting and the United States the lead on Japanese reporting,
    reflecting each country’s experience; Britain required strict access and distribution controls, which the United States
    accepted. Focus on the policy choices about sharing, safeguards, and responsibilities, not the intelligence collection
    or cryptanalytic methods.
  span_range:
  - src:3974d748773e#p20.3
  - src:3974d748773e#p20.4
  decision: British and American senior intelligence officials agree on formal SIGINT cooperation, strict access procedures,
    and a division of production responsibilities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is whether to use the normal reporting channel or authorize direct release when intelligence was
    exceptionally urgent and perishable. Keep the focus on the authority and reason for the exception; exclude details of
    how information was transmitted.
  span_range:
  - src:3974d748773e#p34.15
  - src:3974d748773e#p34.16
  decision: The Navy combat intelligence officer authorized the ULTRA production organization to release urgent information
    directly to the submarine force commander.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The decision point is whether the G-2 should continue briefing the commander personally or delegate regular briefings
    because the volume of ULTRA material made personal briefing impracticable. Keep the focus on briefing responsibility and
    the G-2’s stated role in deciding whether to take important updates to the commander; exclude operational details of the
    intelligence itself.
  span_range:
  - src:3974d748773e#p42.12
  - src:3974d748773e#p42.12
  decision: The Seventh Army G-2 delegated regular ULTRA briefings to the SLU while retaining a decision role for important
    incoming intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The staff could preserve the sharing arrangement or cancel it; they chose cancellation, citing ULTRA rules that made
    the SSO an advisor on security and left decisions about intelligence for senior officers to the theater G-2. Keep the
    focus on the authority and policy governing dissemination, not on communications procedures.
  span_range:
  - src:3974d748773e#p50.15
  - src:3974d748773e#p50.18
  decision: The theater chief of staff and chief signal officer canceled the arrangement for sharing ULTRA information between
    CBB and the SSO.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The choice was whether to continue broad distribution or provide only intelligence headquarters judged applicable
    to a unit. The stated rationale was that the Eighth Army had not been selected for the planned invasion and therefore
    supposedly did not need wider-war intelligence; exclude the later appeals as separate decisions.
  span_range:
  - src:3974d748773e#p50.24
  - src:3974d748773e#p51.4
  decision: Theater headquarters discontinued the daily Special Intelligence Bulletin and withheld its replacement from the
    Eighth Army, limiting distribution to cables it judged relevant to each army.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: The decision was whether to proceed on schedule or delay in light of intelligence about Japanese strength; the stated
    reason for proceeding was preserving the operation’s timetable. Keep the scenario at the level of command judgment about
    timing, not the conduct of the attack.
  span_range:
  - src:3974d748773e#p51.6
  - src:3974d748773e#p51.9
  decision: The theater commander proceeded with the Manila operation on schedule rather than postpone it despite ULTRA information
    indicating Japanese strength that warranted waiting for reinforcements.
  content_domain: operational-command
  refusal_sensitivity: high
