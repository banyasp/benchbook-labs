- n: 2
  focus: The decision point is whether the SS-8 should be judged a small missile or whether the evidence still allowed for
    a much larger payload. The estimate adopted the smaller-missile conclusion after review panels considered the data, while
    Air Force and DIA said a larger payload could not be excluded; exclude the later resolution of the issue and technical
    collection methods.
  span_range:
  - src:f2db0c61a80d#p22.4
  - src:f2db0c61a80d#p23.4
  decision: The Intelligence Community decided to assess the SS-8 as comparable to the SS-7 in payload capacity in the October
    1963 estimate, while recording Air Force and DIA dissent.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is CIA’s judgment about whether Soviet leaders were likely to upgrade SAM systems to alter the
    strategic balance, in the context of ABM treaty concerns. The estimate judged such a program unlikely based on Soviet
    defense conservatism, doubts about the systems’ effectiveness, and the risks of detection; exclude the technical details
    of monitoring or collection.
  span_range:
  - src:f2db0c61a80d#p24.2
  - src:f2db0c61a80d#p24.4
  decision: CIA assessed in NIE II-3-71 that the Soviets were unlikely to undertake a SAM-upgrade program for ABM defense.
