  refusal_sensitivity: medium
- n: 53
  focus: Focus on the analytic choice to treat Curveball’s reporting skeptically and communicate its limitations, or discount
    the warning signs and present the assessment with inadequate caveats. The report cites signs of unstable behavior and
    analysts’ attachment to a source that supported their assumptions; exclude the separate operational question of validating
    or collecting from the source.
  span_range:
