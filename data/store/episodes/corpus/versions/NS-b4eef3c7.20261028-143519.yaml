  decision: Analysts working the Iraq biological-weapons account decide how much weight to give Curveball’s reporting and
    whether to convey source concerns in the October 2002 NIE; they discount early warning signs and rely heavily on the source.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 54
  focus: Treat this as an estimative choice about the purpose and possible threat posed by Iraq’s UAVs. The report says the
    conclusion rested on little hard evidence and that analysts gave inadequate consideration to alternatives and contrary
    evidence; exclude operational use or targeting scenarios.
  span_range:
