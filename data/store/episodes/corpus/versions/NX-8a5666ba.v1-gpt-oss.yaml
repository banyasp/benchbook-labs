- n: 1
  focus: The Senate, via Resolution 21, decided whether to create a special committee to investigate intelligence activities.
    The decision includes the authority granted, the mandate, and the reasons (allegations of abuse and public concern).
  span_range:
  - src:a1e324821097#p10.2
  - src:a1e324821097#p10.2
  decision: Establishment of the Senate Select Committee on Intelligence Activities
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The Committee decided whether to retain or delete the chapters titled “Cover,” “Espionage,” and “Budgetary Oversight”
    after agencies cited protection of sources and methods. The choice was to delete them.
  span_range:
  - src:a1e324821097#p4.1
  - src:a1e324821097#p4.1
  decision: Deletion of three chapters from the public report at agency request
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The Committee concluded that activities such as illegal surveillance, assassination plots, and mail opening are not
    legitimate national secrets, deciding they must be disclosed to oversight bodies rather than kept secret.
  span_range:
  - src:a1e324821097#p20.2
  - src:a1e324821097#p20.3
  decision: Determination that illegal or improper intelligence acts are not valid national secrets and should be disclosed
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision was made in the immediate post‑World War II period to centralize intelligence collection and coordination
    while avoiding military dominance of the new agency. It weighed the need for a unified civilian body against resistance
    from the armed services and the State Department, and concluded a civilian CIA would better serve peacetime and wartime
    intelligence needs.
  span_range:
  - src:a1e324821097#p28.3
  - src:a1e324821097#p28.4
  decision: The President and senior advisers decided to create a civilian Central Intelligence Agency rather than a military‑run
    intelligence service.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: Legislators chose to enact comprehensive intelligence reform, creating new statutory bodies to coordinate national
    security. The act responded to post‑war intelligence fragmentation and the perceived need for unified direction, balancing
    executive authority with congressional oversight.
  span_range:
  - src:a1e324821097#p29.1
  - src:a1e324821097#p29.2
  decision: Congress passed the National Security Act of 1947, establishing the National Security Council, the Director of
    Central Intelligence, and the CIA.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: Faced with the massive scope of U.S. intelligence activities, the Committee chose to focus on the NSC, DCI, CIA,
    State Department, and Department of Defense. This decision balanced the need for a thorough inquiry with practical constraints
    of time and resources, aiming to uncover abuses while assessing legitimate intelligence requirements.
  span_range:
  - src:a1e324821097#p25.1
  - src:a1e324821097#p25.1
  decision: The Senate Select Committee on Intelligence decided to limit its investigation to five principal intelligence
    institutions.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The President faced the choice of permitting a covert armed operation against Cuba or refraining from it. The decision
    rested on the President’s claimed constitutional authority to conduct foreign relations and use force in the absence of
    an imminent threat, weighed against constitutional limits on war powers and the risk of entering a state of war without
    congressional approval. The outcome was the authorization of the CIA‑led invasion, later judged constitutionally questionable.
  span_range:
  - src:a1e324821097#p45.1
  - src:a1e324821097#p45.1
  decision: President authorizes the CIA to secretly direct and finance the Bay of Pigs invasion of Cuba
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: Congress considered whether to add statutory conditions on CIA covert operations. The options were to allow covert
    actions to proceed without additional oversight or to require the President to certify each operation’s national‑security
    importance and to report its scope to congressional committees. The decision was driven by concerns for checks‑and‑balances,
    transparency, and preventing unchecked executive use of covert force.
  span_range:
  - src:a1e324821097#p48.1
  - src:a1e324821097#p48.1
  decision: Congress imposes a reporting and presidential‑finding requirement for CIA covert actions (1974 amendment to the
    Foreign Assistance Act)
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: In response to past covert‑action controversies, the President decided to restructure oversight by establishing a
    new inter‑agency group and formalizing the doctrine of plausible denial. The choice was between maintaining the existing,
    less‑formal oversight structure or instituting a formal group with explicit authority to approve and conceal covert operations.
    The rationale cited the need for effective control, protection of the President from embarrassment, and alignment with
    national‑security objectives.
  span_range:
  - src:a1e324821097#p54.2
  - src:a1e324821097#p54.2
  decision: The President's Executive Order 11905 creates the Operations Advisory Group and adopts a “plausible denial” policy
    for covert actions
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is the change in approval authority for covert actions, moving from a committee-based process
    to direct presidential approval, with the Operations Advisory Group providing policy input.
  span_range:
  - src:a1e324821097#p66.1
  - src:a1e324821097#p66.1
  decision: The President decided to shift final approval authority for covert operations from the 40 Committee to the President
    alone, creating an Operations Advisory Group for policy recommendations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: OMB’s authority to review and release reserve funds, exercising a ‘double key’ by approving additions and disbursements,
    with occasional reductions or turndowns.
  span_range:
  - src:a1e324821097#p68.1
  - src:a1e324821097#p68.3
  decision: The Office of Management and Budget (OMB) decides whether to approve, reduce, or deny releases from the CIA Contingency
    Reserve Fund for covert operations.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 12
  focus: DCI’s discretionary choice to notify or not notify the Senate and House Armed Services, Foreign Relations, and Appropriations
    committees about covert actions.
  span_range:
  - src:a1e324821097#p63.2
  - src:a1e324821097#p63.2
  decision: The Director of Central Intelligence (DCI) decides whether to inform the six congressional committees of approved
    covert action operations before implementation.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 13
  focus: The decision point concerns whether to retain or remove the paragraph despite a request from the Secretary of Defense’s
    office. The DCI exercised authority over the NIE content, weighing the risk of contradicting the Secretary’s public position
    against the integrity of the intelligence judgment.
  span_range:
  - src:a1e324821097#p86.1
  - src:a1e324821097#p86.1
  decision: The DCI decided to delete a paragraph from the Board of National Estimates draft that asserted the Soviets were
    unlikely to achieve a first‑strike capability.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The decision involved whether to send the analysts’ assessment, which warned of limited prospects for a successful
    U.S. operation, to senior policymakers. The DCI judged that sending a negative assessment would be counter‑productive
    and that the analysts lacked knowledge of the imminent operation, so the document was withheld.
  span_range:
  - src:a1e324821097#p88.1
  - src:a1e324821097#p88.3
  decision: The DCI decided not to forward the “Stocktaking in Indochina Longer Term Prospects” memorandum to the White House
    before the Cambodia incursion.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: Facing criticism that the Board “fuzzed over differences of opinion” and diluted the DCI’s judgments, the DCI chose
    to restructure the intelligence‑producing apparatus. The new arrangement gave each NIO staff responsibility for a geographic
    or functional area and shifted coordination of NIE drafting to the NIOs, eliminating collective board review.
  span_range:
  - src:a1e324821097#p83.1
  - src:a1e324821097#p83.1
  decision: The DCI decided to replace the Board of National Estimates with a system of eleven National Intelligence Officers
    (NIOs).
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 16
  focus: The decision point is the DCI's choice to rely on the Key Intelligence Question (KIQ) management system to shame
    recalcitrant agencies into action, reflecting limited formal authority over resource allocation.
  span_range:
  - src:a1e324821097#p99.4
  - src:a1e324821097#p100.1
  decision: DCI chose to use the KIQ process as a surrogate authority to pressure agencies into allocating resources, rather
    than direct allocation.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 17
  focus: The decision point is the President's choice to create a new coordinating body (CFI) with budget and policy authority,
    versus maintaining the existing structure.
  span_range:
  - src:a1e324821097#p101.1
  - src:a1e324821097#p101.4
  decision: The President decided to reorganize the intelligence community by issuing an Executive Order establishing the
    Committee on Foreign Intelligence (CFI) chaired by the DCI.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 18
  focus: The decision point is the DCI's choice to intervene with the President against a Defense budget proposal, weighing
    agency interests against inter‑service budget pressures.
  span_range:
  - src:a1e324821097#p102.3
  - src:a1e324821097#p102.3
  decision: DCI decided to directly object to Defense Department budget recommendations to secure Presidential support for
    a CIA‑developed technical collection system.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 19
  focus: The passage describes the Director’s option to be assertive and claim the Agency’s authority versus remaining passive.
    He opted for the latter, citing personal temperament, aversion to confrontation, and a reluctance to take an aggressive
    coordinating role. This decision affected the CIA’s ability to influence community budgeting and technical‑collection
    policy.
  span_range:
  - src:a1e324821097#p122.1
  - src:a1e324821097#p122.1
  decision: The Director of Central Intelligence chose not to assert the CIA’s position aggressively in the intelligence community
    over overhead reconnaissance and military estimates.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: In early 1956 the President established an advisory board composed of retired senior officials to advise on intelligence
    matters. The decision involved creating a new oversight body with no direct authority over the DCI or the intelligence
    community, reflecting a choice to formalize advisory input rather than leave oversight informal.
  span_range:
  - src:a1e324821097#p122.2
  - src:a1e324821097#p122.2
  decision: The President decided to create the President’s Board of Consultants on Foreign Intelligence Activities (PBCFIA).
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: 'Facing a dispute over jurisdiction of satellite‑reconnaissance systems, the agencies chose a compromise: create
    EXCOM with the Director of Central Intelligence, an Assistant Secretary of Defense, and the President’s Scientific Advisor,
    and give the Director the authority to appeal decisions to the President. This balanced Air Force and CIA interests while
    defining a clear decision‑making structure.'
  span_range:
  - src:a1e324821097#p125.2
  - src:a1e324821097#p125.2
  decision: The CIA and the Department of Defense agreed to establish a three‑person Executive Committee (EXCOM) in 1965 to
    govern overhead reconnaissance, granting the Director of Central Intelligence a right of appeal to the President.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The decision point concerns the legislative choice to authorize flexibility for CIA covert operations versus limiting
    the agency to foreign intelligence collection only. The excerpt details congressional intent, debate, and the resulting
    enactment of broad provisions.
  span_range:
  - src:a1e324821097#p138.3
  - src:a1e324821097#p141.1
  decision: Congress decided whether to include provisions that would protect and enable CIA clandestine and covert activities
    in the 1949 Central Intelligence Agency Act.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 23
  focus: The NSC decision point involved whether to direct the CIA to conduct covert psychological actions as a tool of U.S.
    foreign policy, weighing the need to counter Soviet influence against the risks of secret activity.
  span_range:
  - src:a1e324821097#p140.3
  - src:a1e324821097#p140.3
  decision: The National Security Council authorized the CIA to undertake covert psychological operations in December 1947.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 24
  focus: The legislative decision point was whether to impose reporting and funding restrictions on CIA covert actions, balancing
    the need for national‑security secrecy against congressional oversight and accountability.
  span_range:
  - src:a1e324821097#p142.1
  - src:a1e324821097#p143.3
  decision: Congress enacted the 1974 amendment requiring presidential reporting and limiting CIA covert‑action funding, thereby
    exercising oversight over covert operations.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 25
  focus: The decision was made after briefings to senior congressional members, with some members objecting. The executive
    and the 40 Committee chose to increase funding despite objections, weighing anti‑communist objectives against congressional
    concerns. The approval authorized a specific dollar amount for covert assistance.
  span_range:
  - src:a1e324821097#p160.1
  - src:a1e324821097#p160.1
  decision: The President and the 40 Committee approved additional covert military assistance to the FNLA and UNITA in Angola.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 26
  focus: Legislators decided to amend the 1974 Foreign Assistance Act, creating a statutory reporting requirement and expanding
    the committees notified. The choice balanced the need for secrecy against congressional oversight and national security
    interests. The amendment was passed to increase transparency of covert operations.
  span_range:
  - src:a1e324821097#p159.2
  - src:a1e324821097#p159.2
  decision: Congress enacted the Hughes‑Ryan amendment to require reporting of covert actions to Congress.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 27
  focus: The Secretary of State testified that using the CIA was a convenience to avoid overt military or diplomatic actions,
    citing lower accountability. The decision reflected a policy judgment weighing secrecy, accountability, and foreign policy
    effectiveness. It justified the use of covert action despite concerns about its appropriateness.
  span_range:
  - src:a1e324821097#p165.1
  - src:a1e324821097#p165.1
  decision: The Executive chose to employ the CIA for covert operations because it was perceived as less accountable than
    other agencies.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 28
  focus: The decision point is the Director's choice to end the inter‑agency liaison versus maintaining it, based on a disagreement
    about source disclosure. The passage states the action taken and the reason (source‑disclosure dispute).
  span_range:
  - src:a1e324821097#p178.1
  - src:a1e324821097#p178.1
  decision: The FBI Director terminated formal liaison with the CIA in 1970 over a source‑disclosure dispute (the case involving
    a CIA source).
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 29
  focus: The decision point is the agencies’ choice to adopt a formalized coordination protocol versus continuing ad‑hoc practices.
    The passage outlines the agreement’s terms and the rationale for preventing conflicts.
  span_range:
  - src:a1e324821097#p180.2
  - src:a1e324821097#p180.2
  decision: In 1966 the FBI and CIA negotiated an informal agreement to regularize coordination, requiring CIA to seek FBI
    concurrence before clandestine activity in the United States and allowing FBI to concur if no conflict existed.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 30
  focus: The decision point is the President’s choice to enact the committee’s prohibition versus allowing continued covert
    funding. The passage cites the recommendation and the President’s acceptance, with reasons tied to protecting institutional
    independence.
  span_range:
  - src:a1e324821097#p194.1
  - src:a1e324821097#p195.1
  decision: The President, acting on the Katzenbach Committee’s recommendation, adopted a policy prohibiting any federal agency
    from providing covert financial assistance to U.S. educational or private voluntary organizations.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 31
  focus: The decision point is the CIA’s February 11 1976 policy change on relationships with U.S. media. It identifies the
    decider (CIA leadership), the two alternative courses (continue paid/contractual ties vs ban them), the authority (internal
    CIA policy authority), the interests weighed (credibility of the press, risk of domestic propaganda fallout), and the
    stated reason for the ban.
  span_range:
  - src:a1e324821097#p200.1
  - src:a1e324821097#p200.2
  decision: CIA leadership decides to prohibit any paid or contractual relationship with full‑time or part‑time U.S. news
    correspondents.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 32
  focus: The decision point is the Committee’s recommendation (p199.2) to change CIA policy on using American academics. It
    shows the decider (Select Committee), the options (maintain current policy vs amend directives and broaden prohibition),
    the authority (legislative oversight), the interests (integrity of academic institutions, risk of covert exploitation),
    and the reasons (ethical concerns, preservation of trust).
  span_range:
  - src:a1e324821097#p199.2
  - src:a1e324821097#p199.2
  decision: Select Committee recommends that the CIA amend its internal directives to require informing academics and to extend
    the prohibition on operational use of individuals funded by U.S. government‑sponsored exchange programs.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 33
  focus: The decision point is the CIA’s February 11 1976 announcement (p210.1) ending operational use of religious personnel.
    It identifies the decider (CIA leadership), the alternatives (continue using clergy vs prohibit), the authority (internal
    CIA policy), the interests (protecting religious integrity, avoiding fallout), and the reasons (sensitivity, risk to trust).
  span_range:
  - src:a1e324821097#p210.1
  - src:a1e324821097#p210.1
  decision: CIA announces a policy prohibiting any operational use of American clergy or missionaries, effectively banning
    paid or contractual relationships with them.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 34
  focus: 'The Office of Security faced a choice: terminate the use of proprietary firms that performed investigations (to
    comply strictly with the Anti‑Pinkerton Act) or continue the practice by invoking the broad spending authority of the
    CIA Act of 1949. The decision was justified by the need to conduct investigations without revealing government interest
    and by legal counsel’s opinion that the CIA’s statutory authority superseded the anti‑Pinkerton restrictions.'
  span_range:
  - src:a1e324821097#p222.2
  - src:a1e324821097#p222.3
  decision: CIA leadership decided to continue using proprietary companies for investigative work despite the Anti‑Pinkerton
    Act.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 35
  focus: Following the deaths of four airmen in the Bay of Pigs, the agency chose between continuing ad‑hoc payments to families
    or creating a dedicated insurance entity. The decision to create the complex was driven by the need for a legitimate,
    flexible mechanism to fund benefits without exposing government involvement and to address the “sketchy” prior arrangements.
  span_range:
  - src:a1e324821097#p223.1
  - src:a1e324821097#p224.2
  decision: CIA leadership decided to establish a formal insurance‑investment complex to provide benefits to covert agents
    after the Bay of Pigs deaths.
  content_domain: other:insurance‑complex
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 36
  focus: 'In the late 1940s‑1950s the CIA faced a choice: divest the Air America airline to avoid competition with private
    carriers or keep it under CIA control to deny assets to Communist China and support covert airlift needs. The decision
    to retain and subsidize the airline was justified by strategic necessity, lack of private industry alternatives, and a
    policy judgment that the benefits outweighed competition objections.'
  span_range:
  - src:a1e324821097#p229.1
  - src:a1e324821097#p230.3
  decision: The Director of Central Intelligence and the National Security Council decided to retain ownership and subsidy
    of Air America despite competition concerns.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 37
  focus: The Director of Central Intelligence authorized the divestiture of Air America and SAT on April 21 1972, choosing
    to eliminate proprietary air assets rather than retain them. The decision weighed excess air capability, changing political
    realities, and the desire to avoid conflict‑of‑interest and windfall profits.
  span_range:
  - src:a1e324821097#p249.1
  - src:a1e324821097#p249.1
  decision: DCI decides to divest CIA ownership and control of the Air America complex and Southern Air Transport (SAT)
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 38
  focus: After evaluating three alternatives (dissolve, sell assets, sell to management), the Director of Central Intelligence
    approved the sale to the former owner on Jan 19 1973, citing the need to preserve a useful carrier, avoid public scrutiny,
    and prevent windfall profits.
  span_range:
  - src:a1e324821097#p250.3
  - src:a1e324821097#p250.3
  decision: DCI approves sale of Southern Air Transport to its former owner rather than dissolution or sale to other carriers
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 39
  focus: In response to rising drug abuse among U.S. troops and heroin entering U.S. markets, the CIA shifted its early attitude
    and joined the 1971 effort to stop opium trafficking, weighing national security concerns against the drug problem.
  span_range:
  - src:a1e324821097#p238.1
  - src:a1e324821097#p238.1
  decision: CIA changes policy to join anti‑narcotics effort to halt opium/heroin flow from Burma, Laos, and Thailand
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 40
  focus: The CIA leadership decided whether to continue operating the proprietary airline Air America or to terminate it.
    The choice was to phase it out, ending the covert airlift capability and returning estimated funds to the Treasury. The
    decision was based on the decline of paramilitary operations in Southeast Asia, reduced need for a large proprietary,
    and budgetary considerations.
  span_range:
  - src:a1e324821097#p257.1
  - src:a1e324821097#p257.1
  decision: Decision to phase out Air America and end CIA‑owned airlift capability by 30 June 1976, returning $20 million
    to the Treasury.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 41
  focus: The CIA’s General Counsel faced the choice of allowing proprietary earnings to be retained for covert operations
    or mandating their return to the Treasury. The ruling required profits to be treated as miscellaneous receipts, prohibiting
    their use for the Contingency Reserve. This was intended to increase transparency, prevent abuse of proprietary funds,
    and align with budgetary law.
  span_range:
  - src:a1e324821097#p260.1
  - src:a1e324821097#p261.1
  decision: General Counsel ruling (3 Feb 1975) that all proprietary profits and liquidation proceeds must be returned to
    the Treasury and cannot be used to augment the Contingency Reserve.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 42
  focus: The CIA Comptroller, in coordination with the Directorates of Operations and Administration, decided whether to maintain
    the existing limited‑visibility budgeting for proprietaries or to create more detailed budget schedules and review mechanisms.
    The choice was to develop new procedures, aiming to enhance congressional and OMB oversight and reduce the risk of profit‑related
    misuse. The rationale cited past abuses, the need for transparency, and the desire to preclude the necessity for additional
    legislation.
  span_range:
  - src:a1e324821097#p262.1
  - src:a1e324821097#p262.1
  decision: Decision to develop comprehensive budgetary presentation and review procedures for CIA proprietaries to improve
    visibility and prevent abuse.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 43
  focus: The CIA leadership decided to structure the promotion system so that the most outstanding lower‑level analysts are
    singled out for advancement into managerial positions, a system that works well for the Directorate of Operations but
    reduces analysts' time for analysis when applied to the Directorate of Intelligence.
  span_range:
  - src:a1e324821097#p277.2
  - src:a1e324821097#p277.2
  decision: CIA promotion system prioritizes operations experience over analytical expertise for supervisory roles
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 44
  focus: Facing growing demand for day‑to‑day intelligence, DDI leadership chose to devote considerable resources to rapid
    current‑events reporting, accepting that this reduced capacity for longer‑range analytical work.
