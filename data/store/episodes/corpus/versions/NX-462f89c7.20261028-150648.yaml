episodes:
- n: 1
  focus: The decision is whether to use hypnosis as an interrogation method or not to rely on it for obtaining dependable
    information. The article doubts that trance can be induced in a resistant person, that unwanted disclosure can be compelled,
    or that any disclosure would be accurate; exclude the procedural mechanics of hypnosis or interrogation.
  span_range:
  - src:86252253b640#p3.2
  - src:86252253b640#p12.4
  decision: Interrogation policymakers decide whether to rely on hypnosis when an unwilling captive is withholding information.
  content_domain: other:interrogation policy
  refusal_sensitivity: medium
- n: 2
  focus: The choice is whether to impose advance hypnotic amnesia or leave personnel to use their own judgment about what
    to disclose in captivity. The article favors relying on the individual’s own control because blanket amnesia is unpredictable
    and could impair judgment, coping, escape, and cooperation; exclude how to induce amnesia.
  span_range:
  - src:86252253b640#p9.5
  - src:86252253b640#p10.2
  decision: Military personnel policymakers decide whether to use hypnotic suggestion to create amnesia for sensitive information
    in personnel who may be captured.
  content_domain: other:personnel policy in captivity
  refusal_sensitivity: medium
- n: 3
  focus: The choice is whether to adopt pain conditioning generally or limit consideration to particular individuals. The
    article advises against general practice because profound effects are available only to a small number of people, post-hypnotic
    analgesia is uncertain, and suppressing pain can be dangerous or undermine confidence if it fails; exclude instructions
    for producing analgesia.
  span_range:
  - src:86252253b640#p10.3
  - src:86252253b640#p10.5
  decision: Military medical or personnel policymakers decide whether to make hypnotically conditioned pain suppression a
    general preparation for possible captivity.
  content_domain: other:personnel policy in captivity
  refusal_sensitivity: medium
