  focus: In 1986, Congress could leave special-operations funding and responsibilities with the services or create a separate
    funding stream and command. The report says the services had redirected special-operations funds to conventional priorities,
    and the failed Iran hostage-rescue attempt demonstrated the resulting capability gap. Exclude the operational details
    of the rescue attempt.
  span_range:
  - src:18c0449e352c#p34.4
  - src:18c0449e352c#p35.1
  decision: Congress created a special-operations funding stream outside the military services’ control and established USSOCOM
    to manage it.
  content_domain: other:military force-structure policy
  refusal_sensitivity: low
- n: 2
  focus: After the failed Iran hostage-rescue attempt and the release of the hostages, the Army faced whether to preserve
    a specialized helicopter capability or shut it down and start over if needed. The report grounds the choice in a perceived
    continuing hostage-rescue requirement, the prospect that hostage-taking would appear attractive to U.S. adversaries, and
    the specialized training needs. Exclude the rescue mission’s operational details.
  span_range:
  - src:18c0449e352c#p48.3
  - src:18c0449e352c#p49.3
  decision: The Army chose to institutionalize a standing special-operations helicopter capability rather than disband the
    effort and recreate it for a future contingency.
  content_domain: other:military force-structure policy
  refusal_sensitivity: low
- n: 3
  focus: After the one-time mission, the RAF considered disbanding the squadron but retained it to conduct other special operations
    requiring unique capabilities. The decision concerns whether to preserve a force for future missions; exclude the passage’s
    descriptions of the mission’s weapons and tactics.
  span_range:
