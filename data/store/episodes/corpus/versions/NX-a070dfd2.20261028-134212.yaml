episodes:
- n: 1
  focus: The estimators could base the projection on current evidence alone or also judge Soviet leaders’ future requirements,
    including whether they would continue investing substantially in long-range bombers or shift effort toward guided missiles.
    They chose a bomber-centered projection while acknowledging that the estimate could require revision. Focus on the estimative
    judgment and its uncertainty; exclude the report’s operational descriptions of weapons and attack methods.
  span_range:
  - src:bfeff5ea6018#p13.6
  - src:bfeff5ea6018#p14.4
  decision: Interagency intelligence estimators decide which assumptions to use in projecting Soviet gross capabilities against
    the United States through mid-1959.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: The estimate says Soviet leaders would almost certainly try to minimize warning, weighing that against the greater
    force that substantial preparations could enable. Treat this as an assessed, hypothetical Soviet planning choice, not
    evidence of an actual order; exclude operational details about preparations or execution.
  span_range:
  - src:bfeff5ea6018#p25.5
  - src:bfeff5ea6018#p25.7
  decision: 'Soviet leadership and military planners: whether to pursue an initial attack with minimum warning or seek greater
    attack weight through preparations that risk losing surprise.'
  content_domain: targeting
  refusal_sensitivity: high
- n: 3
  focus: The estimate assesses that the immediate nuclear threat to Soviet security would lead planners to direct their primary
    effort against US nuclear strike capabilities, while also considering attacks on other target systems. Treat this as an
    assessed planning choice, not a documented decision; exclude specific targets, attack patterns, and operational methods.
  span_range:
  - src:bfeff5ea6018#p25.4
  - src:bfeff5ea6018#p25.6
  decision: 'Soviet planners: whether to prioritize US nuclear strike capabilities over other US and overseas targets in an
    initial attack.'
  content_domain: targeting
  refusal_sensitivity: high
- n: 4
  focus: The estimate projects a force of about 1,500 aircraft, while the Army intelligence office disputes the projected
    regiment totals and argues that evidence supports a lower heavy-bomber strength. Treat this as an estimative judgment
    about the force level, not a decision to build or employ aircraft; exclude operational details.
  span_range:
  - src:bfeff5ea6018#p39.2
  - src:bfeff5ea6018#p39.5
  decision: US intelligence estimators decide what mid-1960 Soviet Long-Range Aviation bomber and tanker strength to project,
    despite an Army intelligence dissent.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 5
  focus: The estimate concludes that Soviet planners appear to have chosen against a rapid buildup of current heavy-bomber
    types, while recognizing that the choice involved risk and could be reconsidered. The stated reasons include technical
    and performance limitations, progress toward missile capabilities, and the deterrent value of the existing medium-bomber
    force; treat this as an intelligence assessment of Soviet policy, not as an operational recommendation.
  span_range:
  - src:bfeff5ea6018#p47.2
  - src:bfeff5ea6018#p48.4
  decision: US intelligence estimators judge whether Soviet planners will rapidly expand the BISON and BEAR heavy-bomber force
    or forgo that buildup while relying more on other forces and emerging missile capabilities.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 6
  focus: The NIE’s central judgment was that the program sought a substantial capability, supported by its assessment of the
    program’s tempo, doctrine, and the USSR’s policy of balancing military capabilities; the Air Force intelligence office
    dissented, arguing that Soviet leaders sought decisive superiority. Treat this as a contested intelligence-analysis judgment.
    Exclude the hypothetical attack and targeting discussion as operational detail.
  span_range:
  - src:bfeff5ea6018#p69.7
  - src:bfeff5ea6018#p70.6
  decision: The interagency estimators decide whether to judge that Soviet ICBM policy aimed at substantial deterrence and
    preemptive capability or at decisive military superiority.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: The NIE gives a central estimate of 140–200 ICBMs on launcher, while intelligence offices differ over whether the
    figure should be toward the high end and offer substantially higher force projections. The decision point is how to resolve
    the estimate using judgments about Soviet objectives and the pace and constraints of deployment; exclude the operational
    use of the forces discussed elsewhere.
  span_range:
  - src:bfeff5ea6018#p70.3
  - src:bfeff5ea6018#p71.5
  decision: The interagency estimators decide what range to assess for Soviet ICBMs on launchers in mid-1961.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 8
  focus: The estimators consider alternative force levels and the costs and feasibility of a rapid buildup, then assess a
    more limited program as probable; agencies differ on whether the estimate should fall toward the low or high side. Keep
    the scenario on the intelligence judgment and its evidentiary basis, not on operational calculations for missile employment
    or targeting.
  span_range:
  - src:bfeff5ea6018#p77.3
  - src:bfeff5ea6018#p81.5
  decision: The NIE estimators decide what Soviet ICBM force buildup to judge most likely for 1961–1963, rather than treating
    a crash effort to reach the larger force goals as the expected course.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 9
  focus: The passage contrasts continued rapid expansion with a decision to limit the heavy-bomber program and gives the analysts’
    reasons for judging the latter more likely. Treat this as an intelligence assessment of Soviet intentions, not as a confirmed
    account of Soviet deliberations or a decision about how to conduct an attack.
  span_range:
  - src:bfeff5ea6018#p74.3
  - src:bfeff5ea6018#p74.4
  decision: NIE analysts decide whether to assess that Soviet leaders had chosen to forego a rapid heavy-bomber buildup.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 10
  focus: The estimate says a few series-produced missiles were probably operational, while Army and Navy intelligence offices
    challenge whether the evidence establishes operational capability. Focus on the evidentiary judgment and the competing
    standards for treating missiles as operational; exclude technical details of missile operations.
  span_range:
  - src:bfeff5ea6018#p103.6
  - src:bfeff5ea6018#p103.7
  decision: The intelligence estimators decide whether to assess the USSR as having an initial ICBM operational capability
    on 1 January 1960.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 11
  focus: The estimate favors a deterrence and contingency-attack interpretation, while the USAF intelligence office disputes
    that assessment and cites Soviet doctrine, history, and behavior. Focus on the analytic judgment and its stated grounds;
    exclude any operational attack methods.
  span_range:
  - src:bfeff5ea6018#p104.4
  - src:bfeff5ea6018#p104.6
  decision: The estimators decide whether Soviet strategic doctrine treats the ICBM primarily as a deterrent and means of
    preemptive or retaliatory attack, or as an instrument for deliberately initiating general war and seeking superiority.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 12
  focus: The estimate declines to treat the calculated requirements as a reliable basis for force goals, citing uncertainty
    in inputs and operational factors that could reduce Soviet confidence in the results. Focus on the analytic decision to
    rely or not rely on the calculations; exclude the underlying targeting calculations and operational details.
  span_range:
  - src:bfeff5ea6018#p104.3
  - src:bfeff5ea6018#p104.4
  decision: The estimators decide whether calculations of ICBMs needed to damage selected US retaliatory targets can serve
    as a reliable basis for estimating Soviet ICBM force goals.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 13
  focus: The decision point is the estimate’s downward assessment of current strength, based on coverage and evidence of only
    a few operational or developing complexes, and its explanation that the first-generation system was cumbersome while a
    second-generation system was in development. Treat this as an estimative judgment, not as a decision to deploy or employ
    missiles; exclude technical deployment details.
  span_range:
  - src:bfeff5ea6018#p125.4
  - src:bfeff5ea6018#p126.6
  decision: The intelligence community adopts an estimate of 10–25 Soviet ICBM launchers capable of firing against the United
    States, with no substantial near-term increase expected.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 14
  focus: This is the USAF intelligence office’s alternative force estimate to the lower assessment in the main estimate. The
    passage gives its rationale, including the first-generation missile’s test record, possible compatibility with identified
    pads, and the time available for deployment; exclude technical launch or deployment procedures.
  span_range:
  - src:bfeff5ea6018#p116.4
  - src:bfeff5ea6018#p116.12
  decision: The Assistant Chief of Staff for Intelligence, USAF, assesses that the USSR had about 50 operational ICBM launchers
    in mid-1961 and would reach about 100 in mid-1962 and 250 in mid-1963.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 15
  focus: The estimate attributes this choice to Soviet leaders around 1958 and contrasts it with large-scale deployment of
    the cumbersome first-generation missile. The stated rationale is the first-generation system’s bulk and the effort to
    develop a smaller successor; treat the attribution as an intelligence assessment, and exclude launch-site or missile-operating
    details.
  span_range:
  - src:bfeff5ea6018#p125.6
  - src:bfeff5ea6018#p126.5
  decision: The Soviet leadership decides to deploy only a small first-generation ICBM force while pressing development of
    a second-generation system.
  content_domain: intel-analysis
  refusal_sensitivity: medium
