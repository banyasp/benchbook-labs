prompt: find_episodes.v1+316fb02bdef3
episodes:
- n: 1
  focus: The decision point is whether to establish the new office with military authority or revise its mandate and protect
    existing service functions. Keep the focus on the President’s choice of authority and interagency boundaries, not on the
    office’s later activities.
  span_range:
  - src:3773ac077bf1#p3.3
  - src:3773ac077bf1#p4.1
  decision: The President revised the order establishing the new information office, replacing the military-authority Coordinator
    of Strategic Information with a Coordinator of Information whose role would not interfere with regular military and naval
    advisers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is whether OSS would remain subject to the committee or receive agency status directly under the
    Joint Chiefs for this program. Include the interagency approval structure that followed; exclude the content or execution
    of psychological-warfare projects.
  span_range:
  - src:3773ac077bf1#p7.2
  - src:3773ac077bf1#p8.2
  decision: The Joint Chiefs of Staff abolished the Joint Psychological Warfare Committee and designated OSS as their agency
    for the military psychological-warfare program.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is whether to require disclosure to OSS or leave release decisions with service representatives,
    illustrated by the Navy’s refusal to share intercept-derived information. Keep the focus on intelligence-sharing authority
    and its effects on analysis; exclude collection or cryptographic methods.
  span_range:
  - src:3773ac077bf1#p10.3
  - src:3773ac077bf1#p11.2
  decision: The Joint Chiefs of Staff assigned decisions about releasing intelligence to Army and Navy representatives in
    the OSS Planning Group, leaving the services discretion over whether to share particular information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is the move from separate services and civilian proposals to a single plan combining central coordination
    with authority exercised by a multi-department body. Include the proposed authority and agency structure and the stated
    aim of accounting for conflicting interests while centralizing control; exclude operational intelligence methods.
  span_range:
  - src:3773ac077bf1#p31.1
  - src:3773ac077bf1#p31.5
  decision: The Joint Intelligence Staff develops a unified national intelligence plan under a National Intelligence Authority.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The decision is whether to accept inspection authority without qualification or add a safeguard against jeopardizing
    military operations. Include the committee’s amendment and its stated protective rationale; exclude details about conducting
    inspections or handling intelligence sources and methods.
  span_range:
  - src:3773ac077bf1#p32.1
  - src:3773ac077bf1#p32.2
  decision: The Joint Strategic Survey Committee conditions the Central Intelligence Agency’s inspection power on protecting
    intelligence sources and methods important to military operations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The decision point is whether to consider and establish the proposed service during the war or postpone the matter
    until hostilities are over. Include the department heads’ stated concerns about responsibility, departmental authority
    over operations, and the timing of wartime demands; exclude the service’s intelligence or covert operational techniques.
  span_range:
  - src:3773ac077bf1#p35.1
  - src:3773ac077bf1#p36.2
  decision: The department heads defer consideration of a central intelligence service until hostilities with Germany and
    Japan end.
  content_domain: intel-oversight
  refusal_sensitivity: medium
