episodes:
- n: 1
  focus: The decision point is whether to stop or seek proper authorization and disclose the activity, versus continuing it
    while deceiving Congress. The report says officials feared Congress would stop the effort and feared the political consequences
    of exposure; exclude the operational details of the support network.
  span_range:
  - src:2ace216b7b26#p1.5
  - src:2ace216b7b26#p1.29
  decision: NSC leadership chose to continue unauthorized support for the contras and conceal it from Congress.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: 'The decision concerns who would control and benefit from proceeds of government arms sales: the Government or a
    privately controlled fund for unauthorized purposes. The report identifies covert funding and private benefits as motives;
    exclude the mechanics of transferring or hiding the funds.'
  span_range:
  - src:2ace216b7b26#p1.5
  - src:2ace216b7b26#p1.26
  decision: NSC officials chose to direct Iran arms-sale proceeds into a fund controlled by the conspirators rather than return
    them to the Government.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The choice was whether to give a truthful account or conceal the operation, responsibility for directing it, and
    control of its funds. The report identifies concealment as the reason; exclude the underlying operational details.
  span_range:
  - src:2ace216b7b26#p1.28
  - src:2ace216b7b26#p1.28
  decision: An NSC staff officer chose to lie to the Attorney General about the secret resupply operation and personal responsibility
    for it.
  content_domain: other:government ethics
  refusal_sensitivity: low
- n: 4
  focus: The report describes Congress’s broad prohibition as applying to entities involved in intelligence activities, including
    those directing or supervising them, and gives statements from the legislative process expressly applying it to the NSC.
    Focus on the scope of Congress’s restriction and its aim of ending U.S. support for the contras; exclude the later operational
    conduct of NSC staff.
  span_range:
  - src:2ace216b7b26#p1.52
  - src:2ace216b7b26#p1.54
  decision: Congress, when renewing the Boland Amendment for fiscal year 1986, chose whether its contra-aid restriction covered
    the NSC and staff or only agencies with operational intelligence responsibilities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: 'The Finding limited the initiative to specified objectives: pursuing a more moderate government, obtaining intelligence,
    and advancing hostage release and preventing terrorism. Focus on the authorization and its limits; exclude the arms-transfer
    logistics and the undisclosed surplus-fund arrangement, which the Finding did not authorize.'
  span_range:
  - src:2ace216b7b26#p1.59
  - src:2ace216b7b26#p1.60
  decision: The President chose whether to authorize arms transfers to elements in Iran under the January 17, 1986 Finding,
    and authorized them for specified purposes.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The report describes the proposed contra allocation, the officials’ use of the initiative to generate funds for unauthorized
    goals, and the conflict with the Finding’s specified purposes and congressional oversight. Focus on the decision to divert
    funds and its authority and ethics implications; exclude transaction mechanics and operational details of contra support.
  span_range:
  - src:2ace216b7b26#p1.64
  - src:2ace216b7b26#p1.80
  decision: Senior NSC officials chose to use excess proceeds from the Iran initiative to support the contras, despite the
    congressional restriction and the absence of an explicit presidential authorization for that purpose.
  content_domain: intel-oversight
  refusal_sensitivity: medium
