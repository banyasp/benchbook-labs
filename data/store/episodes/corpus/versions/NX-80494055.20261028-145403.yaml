episodes:
- n: 1
  focus: The choice was whether to authorize an exchange or withhold cryptanalytic information because of concerns that disclosure
    could help Britain break U.S. codes. The Army favored cooperation for national defense and proposed keeping U.S. cryptographic
    systems off the table; the secretary of war secured the Navy secretary’s and secretary of state’s support, and the president
    approved. Exclude the technical details of cryptanalysis and intercepts.
  span_range:
  - src:fd718e11c0ae#p17.7
  - src:fd718e11c0ae#p18.5
  decision: The U.S. secretary of war, with senior civilian approval, decided to proceed with a cryptanalytic information
    exchange with Britain despite Navy opposition.
  content_domain: other:intelligence-sharing-policy
  refusal_sensitivity: medium
- n: 2
  focus: Initially, British officials barred Enigma discussion; the U.S. delegation’s disclosure of its success against Purple
    and presentation of a Purple analog persuaded London to reverse course and share information about Enigma and the bombe.
    The decision point is the policy choice to disclose, not the technical methods or machinery involved.
  span_range:
  - src:fd718e11c0ae#p9.5
  - src:fd718e11c0ae#p9.5
  decision: The British government reversed its restriction on discussing Enigma and authorized disclosure of its success
    to the U.S. delegation.
  content_domain: other:intelligence-sharing-policy
  refusal_sensitivity: medium
- n: 3
  focus: The president chose to accept Britain’s offer of a technical mission rather than decline it; the British offered
    to disclose equipment and devices without demanding specific commitments, while hoping for reciprocal discussion. The
    U.S. response was bounded by the requirement that any items procured from U.S. industry be approved as nonessential to
    national defense. Exclude the technologies’ operational use.
  span_range:
  - src:fd718e11c0ae#p14.3
  - src:fd718e11c0ae#p14.4
  decision: The U.S. president decided to accept a British technical mission for secret defense discussions, subject to limits
    on what the United States could provide.
  content_domain: other:technical-cooperation-policy
  refusal_sensitivity: medium
- n: 4
  focus: The choice was between continuing to withhold the Enigma work or disclosing it under restrictions; the British intelligence
    chief acted after the Bletchley deputy commander argued that continued secrecy threatened future cooperation, and the
    chiefs of staff favored disclosure. The prime minister approved disclosure confined to methods and machinery, not intelligence
    results, subject to written secrecy and onward-disclosure controls; exclude the later technical explanation of the bombe.
  span_range:
  - src:fd718e11c0ae#p35.1
  - src:fd718e11c0ae#p35.6
  decision: The British intelligence chief, with the prime minister’s approval, chose to authorize a limited disclosure of
    Enigma work to the American delegation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The officers faced signing the undertaking or refusing it; they initially hesitated because they believed they lacked
    authority to make such an agreement without their superiors’ approval. They signed after the British host warned that
    refusal could collapse the exchange; exclude the undertaking’s technical provisions except as context for the authorization
    and secrecy decision.
  span_range:
  - src:fd718e11c0ae#p35.6
  - src:fd718e11c0ae#p35.13
  decision: The American delegation members chose to sign the British secrecy undertaking despite doubts about their authority
    as junior officers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The passage describes the exchange as offering mutual intelligence value and as helping ensure continuity if Britain
    fell. Treat the choice as whether to share or withhold sensitive material; exclude the technical contents of the exchange
    and how cryptanalysis was conducted.
  span_range:
  - src:fd718e11c0ae#p45.3
  - src:fd718e11c0ae#p48.6
  decision: US and British cryptologic authorities proceed with a reciprocal exchange of cryptologic materials and information
    during the 1941 mission.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The decision followed the US Army’s need for its own Enigma capability to support forces in North Africa and British
    concerns that US security practices could expose Ultra. Consider the choice between a joint arrangement with agreed safeguards
    and continuing without that arrangement; exclude operational details of codebreaking.
  span_range:
  - src:fd718e11c0ae#p46.1
  - src:fd718e11c0ae#p46.1
  decision: The US and UK governments enter a permanent intelligence-sharing agreement, stationing US personnel at Bletchley
    Park in exchange for US adoption of British security practices.
  content_domain: intel-oversight
  refusal_sensitivity: medium
