episodes:
- n: 1
  focus: The committee concludes that Soviet leaders are unlikely to choose the invasion, even if they could obtain a negotiated
    peace, because expected political risks outweigh substantial potential gains; continuing global war would also leave Soviet
    resources inadequate to defend the conquered areas. Treat this as an analytic judgment about the likelihood of Soviet
    action, not as a decision by the committee to conduct military operations.
  span_range:
  - src:37c9214389f0#p5.6
  - src:37c9214389f0#p7.5
  decision: The joint CIA and interagency ad hoc committee estimates whether Soviet leaders are likely to invade Western Europe
    and the Near East before 1950.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: The committee judges that recent events have slightly increased the possibility of deliberate Soviet action, but
    have not made it probable; it also identifies increased risk of war through miscalculation. The assessment weighs political
    and strategic developments against the USSR’s continued ability to pursue nonmilitary means; exclude operational methods
    of military or covert action.
  span_range:
  - src:37c9214389f0#p8.4
  - src:37c9214389f0#p11.3
  decision: The joint ad hoc committee revises its estimate of the likelihood of deliberate Soviet military action during
    1948–49.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 3
  focus: The committee concludes preventive war is unlikely during 1949 and that Soviet leaders will probably prefer preparations
    and political and psychological counterefforts, while recognizing limited contingencies and the risk of unintended conflict.
    The assessment gives reasons including the deterrent of US war potential, the risks of a decisive conflict, and the possibility
    of future nonmilitary gains; exclude operational details of any contemplated action.
  span_range:
  - src:37c9214389f0#p12.4
  - src:37c9214389f0#p15.7
  decision: The joint CIA and interagency ad hoc committee estimates whether the USSR will resort to direct military action
    during 1949.
  content_domain: intel-analysis
  refusal_sensitivity: medium
