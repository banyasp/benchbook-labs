  focus: The Secretary of State faced whether to pass along a long German diplomatic message carried through US channels;
    he initially held it because he objected to those channels carrying German traffic, then sent it after receiving assurances
    that it had to be transmitted. Exclude the code systems and message-routing mechanics.
