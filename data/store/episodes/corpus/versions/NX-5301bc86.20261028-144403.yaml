- n: 48
  focus: The decision point is the choice between requiring reasonable suspicion at the preliminary stage and permitting a
    lower, defined threshold before corroboration is complete. Exclude the investigative techniques that may follow; focus
    on the authorization standard and the stated concern that a higher initial threshold could block inquiry into dangerous
    allegations from anonymous or unreliable sources.
  span_range:
  - src:03fa2b5a8e47#p336.2
  - src:03fa2b5a8e47#p337.2
  decision: The Committee chooses a specific-allegation or specific-or-substantiated-information threshold for preliminary
    preventive intelligence investigations, with reasonable suspicion required for a full investigation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 49
  focus: The decision point is the Committee’s rejection of the alternative that would allow surveillance of an American absent
    probable cause of criminal activity based on undefined clandestine-intelligence activity. Exclude surveillance procedures
    and techniques; focus on the warrant requirement, the legal standard, and the Committee’s reasons for rejecting inherent
    executive authority and undefined grounds.
  span_range:
  - src:03fa2b5a8e47#p341.1
  - src:03fa2b5a8e47#p341.2
  decision: The Committee chooses to require a judicial warrant based on probable cause of criminal activity before the government
    may target an American for electronic surveillance.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 50
  focus: The choice is whether to endorse limited preventive intelligence despite an uncertain record of effectiveness, or
    withhold authorization until a stronger case is made. The author argues that the evidence does not justify endorsement
    yet, citing the small number of substantiated cases and the risks to political liberty; exclude operational details about
    surveillance and informants.
  span_range:
