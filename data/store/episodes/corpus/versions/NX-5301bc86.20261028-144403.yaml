- n: 51
  focus: The Committee would allow temporary targeting so the FBI could develop enough information to establish probable cause,
    then require termination if probable cause was not established within five months. The passage contrasts this with requiring
    the high standard before targeting and raises whether a judge or the Attorney General should authorize targeting; exclude
    operational details about informant use.
