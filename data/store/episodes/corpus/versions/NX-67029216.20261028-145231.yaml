- n: 1
  focus: After the Bay of Pigs, the White House was overwhelmed by duplicative intelligence publications, and important information
    was being missed. The choice was to provide a single, tailored summary rather than leave the president with the existing
    flow of publications; exclude operational intelligence collection and the product’s technical production details.
  span_range:
  - src:56787a7b2bf9#p12.2
  - src:56787a7b2bf9#p12.6
  decision: CIA current-intelligence leadership chose to create a concise daily intelligence product for the president.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 2
  focus: After the president’s death, CIA staff did not know how much the successor knew, and the product did not appeal to
    him as it had to his predecessor. They responded by adding background and broadening distribution to officials including
    the secretaries of state and defense, and later the vice president; exclude any broader claim about access policy beyond
    this described adjustment.
  span_range:
  - src:56787a7b2bf9#p12.9
  - src:56787a7b2bf9#p12.13
  decision: CIA briefing staff chose to broaden distribution of the intelligence product to senior officials during the president’s
    administration.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 3
  focus: From January through April 1969, the CIA provided a morning and afternoon product to accommodate the national security
    advisor’s request for current intelligence as events unfolded. The decision point is the briefing cadence and recipient;
    exclude the contents of the reports and any operational response to the intelligence.
  span_range:
  - src:56787a7b2bf9#p5.16
  - src:56787a7b2bf9#p5.16
  decision: The CIA chose to provide the national security advisor with an afternoon PDB in addition to the president’s morning
    PDB in early 1969.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 4
  focus: The aide chose to broaden access beyond the existing recipients, against a backdrop of concern about the Checklist’s
    security and a need to help staff answer the President’s frequent questions. Keep the focus on the policy choice and its
    competing access and security interests, not on handling or transmitting classified material.
  span_range:
  - src:56787a7b2bf9#p18.5
  - src:56787a7b2bf9#p18.6
  decision: The White House military aide decided to expand distribution of the President’s Checklist to additional senior
    officials, with permission.
  content_domain: intel-oversight
  refusal_sensitivity: medium
