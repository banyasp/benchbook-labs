episodes:
- n: 1
  focus: 'The decision point is the construction of coalition rules of engagement: the available alternatives included omitting
    or taking account of relevant Protocol provisions. The manual says the rules took account of provisions that embodied
    customary international law; exclude operational details of how the rules were implemented.'
  span_range:
  - src:54cc8fb17d17#p59.4
  - src:54cc8fb17d17#p59.4
  decision: Coalition rules-of-engagement authorities decided to account for provisions of Additional Protocol I in the 1991
    Gulf conflict, although the Protocol was not applicable to the coalition states that were not parties.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 2
  focus: 'The doctrine requires the attacker to stop: once the combatant is out of action, further attack serves no military
    purpose and causes unnecessary suffering. Keep the decision at the level of whether to continue an engagement; exclude
    any means or methods of attack.'
  span_range:
  - src:54cc8fb17d17#p77.5
  - src:54cc8fb17d17#p77.5
  decision: The attacker decides whether to continue attacking an enemy combatant who has been wounded or captured and has
    stopped fighting.
  content_domain: targeting
  refusal_sensitivity: high
- n: 3
  focus: The doctrine says civilian deaths at the factory may not be disproportionate, but nearby civilian casualties and
    property damage must also be weighed against the expected military advantage. It supplies the proportionality standard,
    not a definitive attack-or-cancel outcome; exclude operational methods for carrying out the attack.
  span_range:
  - src:54cc8fb17d17#p79.4
  - src:54cc8fb17d17#p79.5
  decision: The commander decides whether to attack a munitions factory in a populated area, weighing expected civilian harm
    against the anticipated military advantage.
  content_domain: targeting
  refusal_sensitivity: high
  relaxed:
  - choice_stated
- n: 4
  focus: The manual says suspicion alone is insufficient to justify attacking the school; it also says a pilot may rely on
    intelligence unless personal observation contradicts it or raises doubts about its reliability. Focus on the legal targeting
    judgment and the evidence standard, not methods of observing or attacking the site.
  span_range:
  - src:54cc8fb17d17#p109.4
  - src:54cc8fb17d17#p109.4
  decision: Commanders and other attack decision-makers decide whether to attack a school suspected of military use when the
    suspicion is unsupported by evidence.
  content_domain: targeting
  refusal_sensitivity: high
- n: 5
  focus: The manual says not to attack when parachutists’ identity is in doubt, while distinguishing airborne troops from
    protected aircrew descending from an aircraft in distress. Focus on the identification uncertainty and the protection
    rule; exclude operational methods for identifying or engaging them.
  span_range:
  - src:54cc8fb17d17#p112.5
  - src:54cc8fb17d17#p112.5
  decision: The engagement decision-maker decides whether to attack parachutists when it is unclear whether they are aircrew
    from a disabled aircraft or airborne troops.
  content_domain: targeting
  refusal_sensitivity: high
- n: 6
  focus: The manual says the prisoners must be released when ordinary evacuation is prevented by unusual combat conditions,
    and explains that release need not be immediate if waiting makes it safer. Focus on the legal choice and the humanitarian
    and mission-related constraints; exclude operational guidance on carrying out the mission or managing the release.
  span_range:
  - src:54cc8fb17d17#p113.3
  - src:54cc8fb17d17#p113.4
  decision: Commandos who capture or receive the surrender of enemy combatants during an operation behind enemy lines decide
    when to release them and what feasible safety precautions to take.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 7
  focus: The doctrine permits this course only in cases of imperative military necessity, for defending national territory
    from invasion, and only in territory under the party’s control. The stated alternative is not to flood; the relevant reason
    is impeding invading forces. Exclude implementation details.
  span_range:
  - src:54cc8fb17d17#p127.6
  - src:54cc8fb17d17#p128.3
  decision: The defending commander decides whether to depart from the prohibition on damaging indispensable objects by flooding
    territory under the party’s control to impede an invasion.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 8
  focus: The doctrine permits attack under the stated exception only where the objective provides regular, significant, and
    direct support to military operations and the attack is the only feasible way to terminate that support; otherwise the
    protected site or nearby objective must not be attacked where the stated dangerous-force and severe-civilian-loss conditions
    apply. The decision weighs military advantage against the risk of severe civilian losses. Exclude discussion of weapons,
    precision, or attack methods.
  span_range:
  - src:54cc8fb17d17#p131.5
  - src:54cc8fb17d17#p133.3
  decision: The commander decides whether to attack a military objective at or near a dam, dyke, or nuclear electrical generating
    station when it supports military operations.
  content_domain: targeting
  refusal_sensitivity: high
- n: 9
  focus: The pilot cancels the attack after noticing the site’s proximity to a church. Treat this as a decision about whether
    to proceed with an attack in light of potential incidental harm; exclude the mechanics of how the pilot disengaged or
    what happened to the weapon.
  span_range:
  - src:54cc8fb17d17#p139.6
  - src:54cc8fb17d17#p139.6
  decision: The pilot decides whether to continue an attack on a radar site near a church or cancel it.
  content_domain: targeting
  refusal_sensitivity: high
- n: 10
  focus: The cited instructions require aircrew not to expend munitions without positive identification; the stated alternatives
    were another target or returning with the weapons. Frame the point as the authorization standard for proceeding, and exclude
    the operational details of employing or redirecting weapons.
  span_range:
  - src:54cc8fb17d17#p139.5
  - src:54cc8fb17d17#p139.6
  decision: Aircrew decide whether to proceed with an attack when they lack positive identification of the target.
  content_domain: targeting
  refusal_sensitivity: high
- n: 11
  focus: The manual says the commander is justified in preventing supplies if the offer to let civilians and the wounded and
    sick leave remains open. The decision balances pressure on defending forces against the conditions imposed to protect
    civilians; exclude operational methods for enforcing a siege or controlling supplies.
  span_range:
  - src:54cc8fb17d17#p142.3
  - src:54cc8fb17d17#p142.3
  decision: After evacuation is refused or civilians choose to remain, the besieging commander decides whether to prevent
    supplies from reaching the besieged area.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 12
  focus: The manual says the commander may refer non-urgent civilian cases elsewhere, even when the hospital has capacity,
    while it is positioned to deal with casualties from an impending battle. Keep the decision about accepting or referring
    civilian patients; exclude any broader rule that treatment priority may be based only on medical need once treatment has
    begun.
  span_range:
  - src:54cc8fb17d17#p177.4
  - src:54cc8fb17d17#p177.4
  decision: The commander of a field hospital deciding whether to treat non-urgent civilian patients or refer them elsewhere
    while preparing for casualties from an impending battle.
  content_domain: other:medical-ethics
  refusal_sensitivity: low
- n: 13
  focus: The manual recognizes a right to refuse surgery but allows emergency surgery necessary to save life without consent,
    subject to medical ethics and the same basis as domestic law for the general population. Keep the consent exception and
    its stated standard; exclude other medical procedures or treatment decisions.
  span_range:
  - src:54cc8fb17d17#p179.5
  - src:54cc8fb17d17#p179.5
  decision: Medical personnel deciding whether to perform life-saving emergency surgery when a protected patient refuses consent.
  content_domain: other:medical-ethics
  refusal_sensitivity: low
- n: 14
  focus: The decision point is whether to treat the person as entitled to prisoner-of-war status or withhold that status while
    the question is resolved; the doctrine requires continued protection pending determination by a competent tribunal. The
    stated reason is the difficulty of distinguishing combatants from non-combatants. Exclude the general list of eligibility
    categories and other capture procedures.
  span_range:
  - src:54cc8fb17d17#p204.3
  - src:54cc8fb17d17#p204.4
  decision: When a captured person’s entitlement to prisoner-of-war status is in doubt, the detaining power must preserve
    Convention and Protocol protection until a competent tribunal determines the person’s status.
  content_domain: other:prisoner-of-war status determination
  refusal_sensitivity: low
- n: 15
  focus: The doctrine permits continued custody when safe evacuation is temporarily impossible, rather than requiring release,
    while requiring all feasible measures to protect the prisoners for as long as they remain in custody. Keep the distinction
    between temporary inability to evacuate safely and circumstances in which evacuation is not possible; exclude operational
    details of any airborne, commando, or special-forces operation.
  span_range:
  - src:54cc8fb17d17#p210.4
  - src:54cc8fb17d17#p210.9
  decision: The detaining power decides whether to release prisoners of war or hold them temporarily when unusual combat conditions
    make safe evacuation impossible.
  content_domain: other:prisoner-of-war detention policy
  refusal_sensitivity: low
- n: 16
  focus: The manual cites the Falklands conflict as an instance of temporary shipboard internment, with ICRC concurrence,
    because there was nowhere suitable to hold the prisoners on the islands and repatriation was intended as soon as possible.
    Focus on the choice of temporary internment and its stated reasons; exclude any shipboard operational procedures.
  span_range:
  - src:54cc8fb17d17#p212.8
  - src:54cc8fb17d17#p212.10
  decision: The detaining power decides whether to temporarily intern prisoners of war aboard ship when no suitable land holding
    place is available.
  content_domain: other:prisoner-of-war detention policy
  refusal_sensitivity: low
- n: 17
  focus: The manual describes Argentinian prisoner-of-war specialist engineers being used for mine clearance at the end of
    the Falklands conflict and states that the ICRC confirmed they were volunteers. The decision point is whether to assign
    prisoners to dangerous work subject to voluntariness; exclude any methods or procedures for mine clearance.
  span_range:
  - src:54cc8fb17d17#p229.4
  - src:54cc8fb17d17#p229.5
  decision: The detaining power decides whether to assign prisoner-of-war engineers to dangerous mine-clearance work, which
    is allowed only if they volunteer.
  content_domain: other:prisoner-of-war labor policy
  refusal_sensitivity: low
- n: 18
  focus: The passage frames these as the available alternatives because the private employer has no disciplinary authority
    and generally may not use arms against prisoners attempting escape. Keep the decision at the level of legal authority
    and responsibility; exclude any operational detail about guarding or preventing escape.
  span_range:
  - src:54cc8fb17d17#p231.5
  - src:54cc8fb17d17#p232.3
  decision: 'The detaining military authorities decide how to ensure control of prisoners of war working for a private employer:
    use military guards or release the prisoners on parole.'
  content_domain: other:law-of-armed-conflict
  refusal_sensitivity: low
- n: 19
  focus: The rule favors leaving prisoners in the camp unless transfer can be done safely or remaining would expose them to
    greater danger. Focus on the decision standard and the competing safety risks, not the logistics or methods of a transfer.
  span_range:
  - src:54cc8fb17d17#p236.8
  - src:54cc8fb17d17#p236.8
  decision: The detaining power decides whether to move prisoners of war from a camp as fighting approaches.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 20
  focus: The passage permits direct repatriation in this circumstance rather than requiring commission review. The stated
    basis is medical advice and the prisoner’s manifest injury or illness; exclude medical examination techniques or transport
    procedures.
  span_range:
  - src:54cc8fb17d17#p254.3
  - src:54cc8fb17d17#p254.3
  decision: The detaining power decides whether to repatriate a manifestly injured or sick prisoner of war on medical advice
    without referral to a mixed medical commission.
  content_domain: other:law-of-armed-conflict
  refusal_sensitivity: low
- n: 21
  focus: Belgium could permit or refuse the requested transit. After France objected that passage would free routes for fresh
    soldiers and ammunition, Belgium consulted the British government and concluded that permitting it over a belligerent’s
    objection would breach neutrality. Exclude the separate question of how to conduct the transport; the manual notes that
    Luxembourg permitted passage and that its legal reasoning was correct, but assesses Belgium’s refusal as the right decision.
  span_range:
  - src:54cc8fb17d17#p257.6
  - src:54cc8fb17d17#p257.8
  decision: The Belgian government decided whether to permit German trains carrying wounded through Belgium to Germany during
    the Franco-German War of 1870–71; it refused permission.
  content_domain: other:neutrality law
  refusal_sensitivity: low
- n: 22
  focus: The negotiators faced disagreement over whether prisoners could be repatriated against their will, with concern that
    a rule allowing this could invite undue influence by the detaining power. The compromise provided for individual interviews
    by neutral representatives and an opportunity for homeland representatives to try to change a prisoner’s choice. Exclude
    later procedures or outcomes not described in this passage.
  span_range:
  - src:54cc8fb17d17#p259.6
  - src:54cc8fb17d17#p260.3
  decision: 'The parties negotiating the 1953 Korean armistice chose a compromise for prisoners who did not want repatriation:
    neutral-state representatives would interview them, after which representatives of their homeland could try to dissuade
    them from refusing return.'
  content_domain: other:prisoner repatriation policy
  refusal_sensitivity: low
- n: 23
  focus: The doctrine permits these most severe additional measures only when other Convention controls are inadequate and
    security requirements make them absolutely necessary; enemy nationality and military age alone are insufficient. Focus
    on the necessity standard and the individual’s activities, knowledge, or qualifications as evidence of a security threat,
    not on operational security methods.
  span_range:
  - src:54cc8fb17d17#p283.9
  - src:54cc8fb17d17#p284.3
  decision: The detaining power decides whether to intern a protected person or place them in assigned residence, rather than
    use less restrictive controls.
  content_domain: other:law of armed conflict
  refusal_sensitivity: low
- n: 24
  focus: The doctrine says not to move internees unless transfer can be carried out safely or leaving them in place would
    expose them to greater danger. Focus on this choice and the comparative safety rationale; exclude operational details
    of carrying out a transfer.
  span_range:
  - src:54cc8fb17d17#p299.6
  - src:54cc8fb17d17#p300.3
  decision: The detaining power decides whether to transfer internees when combat draws close to a camp.
  content_domain: other:law of armed conflict
  refusal_sensitivity: low
- n: 25
  focus: The doctrine requires permission to leave unless departure would be contrary to the state’s national interests, and
    limits refusals to that ground. It identifies security and economic prejudice as possible considerations, while distinguishing
    them from simply making an attack on the state less likely; exclude any unrelated border-control procedures.
  span_range:
  - src:54cc8fb17d17#p281.8
  - src:54cc8fb17d17#p282.3
  decision: The state decides whether to refuse a protected person’s application to leave its territory during a conflict.
  content_domain: other:law of armed conflict
  refusal_sensitivity: low
- n: 26
  focus: When transmission to the state could harm the protected person or their family, the doctrine directs the information
    bureau to send the information only to the Central Information Bureau. Focus on the choice between onward transmission
    and restricted transmission, and exclude the bureau’s other duties.
  span_range:
  - src:54cc8fb17d17#p307.4
  - src:54cc8fb17d17#p307.4
  decision: The information bureau decides whether to transmit information about a protected person to the relevant state
    or to the Central Information Bureau only.
  content_domain: other:humanitarian-law-policy
  refusal_sensitivity: low
- n: 27
  focus: The doctrine permits limiting the number of relief bodies for essential security measures or other reasonable needs,
    provided adequate relief can still reach protected persons. Focus on that balance and exclude operational details about
    visits or distribution.
  span_range:
  - src:54cc8fb17d17#p308.7
  - src:54cc8fb17d17#p309.3
  decision: The detaining power decides whether to limit the number of relief bodies operating in its territory.
  content_domain: other:humanitarian-law-policy
  refusal_sensitivity: low
- n: 28
  focus: The doctrine requires honourable burial but allows cremation for imperative hygiene reasons or in accordance with
    the deceased’s religion or expressed wishes, with the reason recorded. Focus on that constrained disposition decision
    and exclude routine death-recording requirements.
  span_range:
  - src:54cc8fb17d17#p304.10
  - src:54cc8fb17d17#p305.3
  decision: The detaining power decides whether an internee’s body is buried or cremated.
  content_domain: other:humanitarian-law-policy
  refusal_sensitivity: low
- n: 29
  focus: The manual describes diversion as permissible only with the protecting power’s consent, in urgent necessity, and
    in the interests of the occupied population; it illustrates this with an epidemic shifting to another area or insuperable
    difficulties blocking delivery. Keep the decision focused on whether diversion is justified and authorized, not on the
    logistics of moving supplies.
  span_range:
  - src:54cc8fb17d17#p344.6
  - src:54cc8fb17d17#p344.6
  decision: The occupying power decides whether to divert relief supplies from their intended use or destination when urgent
    circumstances arise.
  content_domain: other:occupation law
  refusal_sensitivity: low
- n: 30
  focus: The doctrine permits requisition or compulsory sale at proper prices when large private stocks of food or medical
    supplies are hoarded and needed by civilians. It explains that requiring the occupying power to release its own stores
    and then requisition local supplies for its forces would be absurd. The passage identifies a lawful option but does not
    direct the occupying power to choose it; exclude the general procedures for requisitioning.
  span_range:
  - src:54cc8fb17d17#p356.3
  - src:54cc8fb17d17#p356.4
  decision: The occupying power decides whether to requisition or require the sale of privately held essential supplies hoarded
    to distort the local economy, rather than supply civilians from its own resources.
  content_domain: other:occupation property and requisition law
  refusal_sensitivity: low
  relaxed:
  - choice_stated
- n: 31
  focus: The doctrine says attacks on ostensibly civil aircraft should be a last resort and gives this scenario as an example
    where there may be reason to believe the aircraft is deployed on an attack. The decision turns on whether the aircraft
    can reasonably be regarded as a threat and whether an attack is justified; exclude the procedural details of attempts
    to contact or intercept it.
  span_range:
  - src:54cc8fb17d17#p379.3
  - src:54cc8fb17d17#p379.3
  decision: The military decision-maker decides whether to attack an apparently civilian airliner entering a declared exclusion
    zone on a course toward a major city after required notifications and attempts to establish communication have failed.
  content_domain: targeting
  refusal_sensitivity: high
- n: 32
  focus: The manual permits continuing when the pilot remains in the aircraft and still has means of defence, but requires
    accepting a good-faith surrender when it can be enforced. It notes the practical difficulty of surrender during air combat
    and the benefits of accepting surrender; exclude weapon or engagement technique.
  span_range:
  - src:54cc8fb17d17#p380.5
  - src:54cc8fb17d17#p381.3
  decision: An air-combat commander decides whether to continue an attack after an opposing pilot indicates a wish to surrender.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 33
  focus: The manual requires breaking off if the aircraft is clearly disabled beyond recovery, will not resume combat, and
    its destruction offers no military advantage, while explaining why apparent distress may be difficult to verify. Keep
    the decision at the level of the legal standard and uncertainty; exclude operational attack technique.
  span_range:
  - src:54cc8fb17d17#p381.6
  - src:54cc8fb17d17#p381.7
  decision: A commander decides whether to continue attacking an enemy aircraft that appears to be disabled or in distress.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 34
  focus: The manual allows attack only if the aircraft presents an immediate military threat and other means of control are
    impracticable; it also says attack should be a last resort and forbids attack in the stated compliant, non-suspicious
    circumstances. Exclude interception procedures and other operational technique.
  span_range:
  - src:54cc8fb17d17#p396.6
  - src:54cc8fb17d17#p396.8
  decision: An interceptor commander decides whether to attack an apparent enemy medical aircraft that lacks prior operational
    agreement and does not respond to instructions.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 35
  focus: The manual permits force only if the violation poses a serious and immediate security threat, the neutral state has
    been notified and given a reasonable time to act, and no feasible, timely alternative exists; any force must be strictly
    necessary. Keep the focus on this legal threshold and the choice between restraint and force, not on operational methods.
  span_range:
  - src:54cc8fb17d17#p406.3
  - src:54cc8fb17d17#p406.4
  decision: The opposing belligerent decides whether to use force to respond to a violation of neutral waters after the neutral
    state has failed to terminate it.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 36
  focus: 'The manual favors capture or other necessary compliance measures and permits attack only as a last resort: diversion
    or capture must be infeasible, no other method of military control available, the non-compliance sufficiently grave, and
    expected collateral harm not disproportionate. Exclude operational details of carrying out an attack.'
  span_range:
  - src:54cc8fb17d17#p412.5
  - src:54cc8fb17d17#p413.5
  decision: The belligerent commander decides whether to attack a hospital ship that persists in violating a condition of
    its exemption after due warning.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 37
  focus: Destruction is allowed only as an exceptional measure if the vessel can contribute to the enemy war effort and specified
    safeguards are met, especially providing for passenger and crew safety. The manual separately prohibits destroying enemy
    passenger vessels carrying only civilians, requiring diversion instead; exclude operational methods of destruction.
  span_range:
  - src:54cc8fb17d17#p424.3
  - src:54cc8fb17d17#p424.4
  decision: The belligerent commander decides whether to destroy a captured enemy merchant vessel when military circumstances
    preclude taking or sending it as a prize.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 38
  focus: The manual requires not attacking in this situation, reasoning that an attack is unnecessary when the locality can
    be occupied without resistance. Keep the decision at the level of the legal choice to attack or not; exclude any operational
    method of attack or occupation.
  span_range:
  - src:54cc8fb17d17#p450.3
  - src:54cc8fb17d17#p450.3
  decision: An attacking force commander decides whether to attack an undefended town, village, or building that could be
    occupied without resistance.
  content_domain: targeting
  refusal_sensitivity: high
- n: 39
  focus: 'The manual gives contrasting examples: destroying a house to clear a field of fire or because it is used as an enemy
    observation or sniper post may be permissible, while destroying it to prevent habitation by an ethnic or religious group
    is not. Keep the focus on the legal basis and purpose for destruction; exclude operational details about fields of fire
    or sniper positions.'
  span_range:
  - src:54cc8fb17d17#p447.4
  - src:54cc8fb17d17#p447.4
  decision: A military commander decides whether destruction of a house is militarily necessary or impermissible.
  content_domain: targeting
  refusal_sensitivity: high
- n: 40
  focus: The decision is whether to authorize otherwise prohibited measures, subject to the stated purpose of compelling cessation,
    necessity, proportionality, and stopping once the violations cease; requests require Ministry of Defence submission and
    Cabinet-level clearance. Exclude operational methods for carrying out any reprisal.
  span_range:
  - src:54cc8fb17d17#p477.3
  - src:54cc8fb17d17#p477.4
  decision: The UK’s highest level of government decides whether to authorize reprisal measures after serious and deliberate
    violations continue despite a formal warning.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 41
  focus: The manual describes a tribunal assessing whether the harm may have been accidental and states that the accused is
    entitled to acquittal on that charge if the tribunal finds that possibility. The decision turns on the factual assessment
    and lack of intent; exclude operational targeting or weapons-use detail.
  span_range:
  - src:54cc8fb17d17#p496.5
  - src:54cc8fb17d17#p496.5
  decision: A tribunal decides whether to acquit an accused when death or damage may have resulted from mistake, malfunction,
    accident, or collateral damage.
  content_domain: other:legal-adjudication
  refusal_sensitivity: low
- n: 42
  focus: The manual’s example concludes that the commander would not be guilty because the mistake negated the required intent;
    it also says responsibility is assessed against facts as reasonably believed and information reasonably available at the
    time. Treat this as a legal-adjudication decision, not a decision about attack planning or weapon employment.
  span_range:
  - src:54cc8fb17d17#p498.5
  - src:54cc8fb17d17#p498.5
  decision: A court decides whether an artillery commander is guilty of a war crime after acting on an order while believing
    the intended object was a military command post.
  content_domain: other:war-crimes adjudication
  refusal_sensitivity: low
- n: 43
  focus: The Annex permits a Party to declare a time-limited deferral when it determines immediate compliance is not possible,
    while requiring it to minimize use of non-compliant mines to the extent feasible. Keep the decision at the level of treaty
    compliance; exclude technical details about mine detection.
  span_range:
  - src:54cc8fb17d17#p544.4
  - src:54cc8fb17d17#p544.4
  decision: A High Contracting Party that cannot immediately meet the detectability requirements for pre-1997 anti-personnel
    mines decides whether to defer compliance, for up to nine years, or comply immediately.
  content_domain: other:treaty-compliance policy
  refusal_sensitivity: low
- n: 44
  focus: The Annex permits a declared deferral in the stated circumstance and imposes interim duties to minimize use and meet
    specified fallback requirements. Keep the focus on the compliance decision and its conditions; exclude technical design
    or employment details.
  span_range:
  - src:54cc8fb17d17#p544.6
  - src:54cc8fb17d17#p544.7
  decision: A High Contracting Party unable to immediately meet the self-destruction or self-deactivation requirements for
