  focus: 'Use the rule for choosing the audience of an observation: share externally as much as possible, limiting access
    to internal users when the issue is specific to the originating HQ or too sensitive to share more broadly. Focus on the
    policy balance between cross-HQ learning and sensitivity; exclude technical access controls.'
