  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 16
  focus: The decision was to release this historical imagery within 18 months, rather than retain its classified status, and
    transfer it to the National Archives with a copy to the USGS. The stated reasons were its scientific and environmental
    usefulness, balanced against national security; exclude later imagery-review procedures.
  span_range:
  - src:0317a4d25faf#p360.5
  - src:0317a4d25faf#p360.5
  decision: The President decided to declassify and publicly release historical imagery from the Corona, Argon, and Lanyard
    missions.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 17
  focus: The order directs a review program intended to make as much imagery public as possible while protecting national
    defense and foreign-policy interests, and sets a five-year deadline for review of obsolete broad-area film-return systems
    other than the named missions. The excerpt does not provide the referenced release criteria, so do not infer their substance
