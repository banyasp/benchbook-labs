episodes:
- n: 1
  focus: The decision point is whether to keep the subsystem within the larger program or separate it for joint management.
    The stated reason was the subsystem’s prospect of earlier success, with the U-2 management approach as a precedent; exclude
    technical design and collection choices.
  span_range:
  - src:0317a4d25faf#p20.2
  - src:0317a4d25faf#p20.2
  decision: U.S. program leadership chose to separate the photographic subsystem from the larger program and place it under
    joint CIA–Air Force management.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision followed task-force reviews and approval of their recommendations by the Director of Central Intelligence.
    The stated rationale was that declassification posed no national-security threat and the imagery had value for environmental
    study, scholarship, and history; exclude technical imagery details.
  span_range:
  - src:0317a4d25faf#p14.3
  - src:0317a4d25faf#p14.4
  decision: The President chose to declassify more than 800,000 images from early satellite systems rather than keep them
    classified.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is whether to continue the program or abandon it after substantial resources had been expended
    without usable results. The passage says the officers persisted because intelligence needs were considered overwhelming,
    describing uncertainty about Soviet forces and the missile-gap controversy. Exclude the engineering remedies and launch
    procedures.
  span_range:
  - src:0317a4d25faf#p35.1
  - src:0317a4d25faf#p35.3
  decision: CORONA program officers chose to persist with the program despite repeated launch, camera, and recovery failures.
  content_domain: other:intelligence-program policy
  refusal_sensitivity: medium
- n: 4
  focus: After a consultant panel attributed the failures to a need for more qualification, requalification, and component
    testing, the project office submitted an amendment seeking additional funds. The decision point is whether to seek that
    added support rather than continue without the expanded testing; exclude the technical details of the tests themselves.
  span_range:
  - src:0317a4d25faf#p33.3
  - src:0317a4d25faf#p34.2
  decision: The CORONA project office chose to seek additional approval and funds for qualification and testing of component
    parts.
  content_domain: other:intelligence-program policy
  refusal_sensitivity: medium
- n: 5
  focus: The decision point is whether to impose strict, centrally overseen controls on satellite-reconnaissance products
    and who may access them. Focus on the President’s approval of the control system, agency heads’ selection responsibilities,
    and the DCI’s oversight; exclude the underlying reconnaissance activity.
  span_range:
  - src:0317a4d25faf#p88.6
  - src:0317a4d25faf#p88.8
  decision: The President establishes TALENT-KEYHOLE controls and limits access to personnel selected for major national-security
    needs.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The decision point is whether to broaden certified access to support the stated intelligence, military, and research
    uses, while excluding personnel whose positions alone do not establish a need. The memo recommends approval of revised
    billet schedules after scrutiny and reductions; do not treat the proposed expansion as a confirmed final board approval.
  span_range:
  - src:0317a4d25faf#p97.3
  - src:0317a4d25faf#p100.3
  decision: The intelligence oversight board considers whether to approve expanded TALENT-KEYHOLE billets after agencies reassess
    functional need.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: The decision point is whether to send the report to theater users or withhold transmission pending suitable security
    arrangements. The minutes state that transmission will not occur at that time because of the material’s sensitivity and
    the absence of secure arrangements; exclude technical communications details.
  span_range:
  - src:0317a4d25faf#p73.6
  - src:0317a4d25faf#p73.6
  decision: The participating agencies decide not to transmit the OAK report to the theater while secure arrangements are
    unavailable.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: 'The decision point is which estimate to use: the intelligence community’s lower assessment based on new information
    or the dissenting Air Force assessment of a substantially larger force. The passage gives the estimate and the dissent’s
    reasons; focus on the estimative judgment and uncertainty, not operational responses to the assessed threat.'
  span_range:
  - src:0317a4d25faf#p136.8
  - src:0317a4d25faf#p141.8
  decision: The intelligence estimators adopt the lower estimate of Soviet ICBM strength, with the Air Force intelligence
    representative dissenting.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 9
  focus: The estimate weighs a low-side possibility of only a token salvo against a higher-side possibility of several operational
    but undetected complexes, citing both intelligence coverage limits and evidence that coverage was adequate to judge the
    force small. The Assistant Chief of Staff, USAF, dissented from the force-level estimate; exclude the Soviet leadership’s
    inferred deployment decision, which is not the U.S. estimators’ decision.
  span_range:
  - src:0317a4d25faf#p150.3
  - src:0317a4d25faf#p151.2
  decision: National intelligence estimators chose to state the current Soviet ICBM capability as a range rather than a single
    force level.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 10
  focus: The estimators explicitly withhold a longer-term numerical projection, while noting that annual growth at a stated
    rate might be feasible. They cite unresolved Soviet force goals, technological and political uncertainties, and their
    inability to reassess those factors using the new evidence; exclude the described intelligence-collection methods.
  span_range:
  - src:0317a4d25faf#p152.3
  - src:0317a4d25faf#p152.3
  decision: National intelligence estimators chose not to make a numerical Soviet ICBM force projection beyond mid-1963.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 11
  focus: The estimate weighs whether the newer 2,000-mile system would supplement or replace existing missiles, alongside
    new target coverage needs and pressure from Soviet field forces. It forecasts a change in force mix rather than major
    numerical expansion; exclude operational details about missile employment or site characteristics.
  span_range:
  - src:0317a4d25faf#p154.5
  - src:0317a4d25faf#p155.2
  decision: National intelligence estimators chose a forecast of 350–450 Soviet medium- and intermediate-range missile launchers
    in 1962–1963, with the force relatively stable thereafter.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 12
  focus: The decision point is the analysts’ classification of the facilities, including the uncertainty expressed by “probable.”
    The report cites their association with explosives plants and test-cell features as grounds for that judgment; exclude
    operational details about the facilities and any methods of intelligence collection.
  span_range:
  - src:0317a4d25faf#p217.5
  - src:0317a4d25faf#p218.3
  decision: NPIC analysts judged the five identified installations to be probable solid-propellant test facilities rather
    than leaving their function undetermined or assigning another interpretation.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 13
  focus: 'Frame this as an estimative judgment under uncertainty: the test site appeared nearly ready, but the available evidence
    suggested China probably lacked sufficient fissionable material, while an undiscovered production source remained possible.
    Focus on how the estimators weighed these competing indications and reached their timing assessment; exclude technical
    details about constructing or conducting a nuclear test.'
  span_range:
  - src:0317a4d25faf#p244.6
  - src:0317a4d25faf#p249.9
  decision: The intelligence estimators responsible for SNIE 13-4-64 judged whether China would conduct its first nuclear
    test in the next few months, concluding that a test before the end of 1964 could not be ruled out but was more likely
    after 1964.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 14
  focus: The decision point is whether to retain the site in the listings or remove it after assessing the reported damage.
    The report states that all launch positions were destroyed and the guidance area partly destroyed, giving the reason for
    dropping it. Exclude any question about the bombing itself.
  span_range:
  - src:0317a4d25faf#p313.3
  - src:0317a4d25faf#p313.3
  decision: NPIC analysts decide to drop the Vinh Linh B29-2 SAM site from NPIC listings.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 15
  focus: The choice was to investigate a nonmilitary use for color imagery after it proved less useful for military targets;
    the report links that choice to the imagery’s potential for geological and economic intelligence and to geological features
    in the available coverage. Treat this as an intelligence-analysis and imagery-use decision, not a decision about collecting
    imagery. Exclude the contractor’s mapping and image-interpretation procedures.
  span_range:
  - src:0317a4d25faf#p317.2
  - src:0317a4d25faf#p323.3
  decision: NPIC and CIA decide to assess whether CORONA color imagery can support nonmilitary mineral-resources analysis,
