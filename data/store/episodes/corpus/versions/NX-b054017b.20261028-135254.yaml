episodes:
- n: 1
  focus: The decision point is the DCI’s response to pressure to change testimony about CIA’s involvement in the flight. The
    account says he told staff to stick with their story, while making a limited wording change that obscured who requested
    CIA assistance. Exclude operational details of the shipment.
  span_range:
  - src:7453b1518032#p5.3
  - src:7453b1518032#p5.7
  decision: The DCI chose to retain CIA’s factual account of its role in the November 1985 shipment rather than adopt the
    NSC official’s denial of any U.S. government connection.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is whether to retain or delete a statement about CIA’s contemporaneous knowledge of the cargo.
    The account says the DCI removed the sentence after senior administration officials expressed concern about the draft;
    do not treat the author’s account as independently establishing what the DCI knew.
  span_range:
  - src:7453b1518032#p7.3
  - src:7453b1518032#p8.7
  decision: The DCI chose to remove from his prepared testimony the sentence stating that neither the airline nor CIA knew
    the November 1985 cargo consisted of missiles.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is whether to disclose suspicions or limit testimony to what officials considered established
    knowledge. The account says the suspicions were a hypothesis rather than hard evidence and explains why including them
    was considered irresponsible; exclude any operational mechanics of the diversion.
  span_range:
  - src:7453b1518032#p11.4
  - src:7453b1518032#p11.7
  decision: The DCI chose not to include unverified suspicions of a diversion in his November testimony, and later defended
    the account that no one at CIA had certain knowledge of the scheme.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is whether and how to respond publicly to negative coverage, including the split between Iran-Contra
    questions and discussion of the Agency’s accomplishments. Keep the focus on communications strategy and the stated aim
    of countering the press treatment; exclude the Director’s interview performance as a separate decision.
  span_range:
  - src:7453b1518032#p14.5
  - src:7453b1518032#p15.9
  decision: The CIA Public Affairs Director arranges a Time interview and sets ground rules to counter unfavorable press coverage.
  content_domain: other:public-affairs
  refusal_sensitivity: low
- n: 5
  focus: The decision point is whether the Director should continue working or step away while under severe stress and sleep
    deprivation. The stated reasons are the need to regain stamina and staff concerns about exhaustion; exclude later medical
    events and testimony decisions.
  span_range:
  - src:7453b1518032#p15.3
  - src:7453b1518032#p15.7
  decision: The CIA Deputy Director and the Director’s spouse arrange for the Director to take a long weekend away from the
    office.
  content_domain: other:leadership-and-fitness-for-duty
  refusal_sensitivity: low
- n: 6
  focus: The decision point is whether to include an expression of regret in testimony to the Senate intelligence committee.
    The Director rejects an apology because he believes the committee would treat regret as evidence of guilt, while staff
    hoped it might deflect the committee’s anger; exclude the separate question of why the original testimony omitted the
    diversion.
  span_range:
  - src:7453b1518032#p16.2
  - src:7453b1518032#p16.7
  decision: The CIA Director rejects apologizing to Congress in his draft testimony about the omitted possibility of diversion
    of Iranian profits to the Contras.
  content_domain: intel-oversight
  refusal_sensitivity: low
