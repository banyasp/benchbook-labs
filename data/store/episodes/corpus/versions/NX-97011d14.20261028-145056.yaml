  focus: The decision point is the commander’s choice to prioritize protecting and gaining the support of the Afghan population
    rather than focusing on seizing terrain or destroying insurgent forces. Consider the stated concern that enemy-centric
    actions could worsen the insurgency and the crisis of confidence; exclude discussion of operational techniques for carrying
    out the campaign.
  span_range:
  - src:204734aa4eb9#p15.5
  - src:204734aa4eb9#p32.4
  decision: The ISAF commander chose to shift the campaign from an enemy-centric approach to population-centric counterinsurgency.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 2
