  refusal_sensitivity: medium
- n: 2
  focus: The assessment says intentions could change quickly and therefore directs attention to capabilities, including estimates
    of acquisition timeframes. Treat this as an analytic-priority decision; exclude any operational response to the missile
    threat.
  span_range:
  - src:672869b44d92#p25.7
