  focus: 'The decision point is whether to withdraw the reports or retain them with a qualification: the alleged sub-source
    denied being their source, and SIS said the chain was discredited while noting that this did not necessarily invalidate
    the contents. Keep the focus on the reporting decision; exclude the separate question of which recipients received the
    memorandum.'
  span_range:
  - src:672869b44d92#p389.7
