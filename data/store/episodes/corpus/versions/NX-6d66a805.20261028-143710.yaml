  focus: The revised framework follows US-UK discussion of a policy with broader support in the Middle East, while preserving
    controls on dual-use goods and sanctions relevant to WMD. Examine the policy choice and its stated context; exclude any
    subsequent enforcement or operational implementation.
  span_range:
  - src:672869b44d92#p27.5
