    publication might signal movement toward military action against the possibility of increasing pressure on Saddam Hussein;
    exclude any operational or intelligence-collection details.
  span_range:
  - src:672869b44d92#p109.5
  - src:672869b44d92#p109.11
  decision: The inter-departmental group recommended holding the Iraq papers for an appropriate moment and presenting the
    WMD and inspections papers as a package.
  content_domain: other:public-information-policy
  refusal_sensitivity: medium
