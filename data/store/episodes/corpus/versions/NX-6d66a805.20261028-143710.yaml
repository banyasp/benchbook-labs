  refusal_sensitivity: medium
- n: 49
  focus: The decision point is whether to continue relying on the source’s reporting or withdraw it; SIS formally withdrew
    it after doubts about what the source had said, a lack of concrete corroboration, and irreconcilable inconsistencies.
    Focus on the reliability judgment and withdrawal, not on collection or handling methods.
  span_range:
  - src:672869b44d92#p403.8
  - src:672869b44d92#p403.10
  decision: SIS decides to formally withdraw all reporting from the Curve Ball source.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 50
  focus: The decision point is whether to report the withdrawals publicly or limit notification to the Intelligence and Security
    Committee; the Foreign Secretary announced them to Parliament. The passage identifies exceptional parliamentary and public
    interest, including the prominence of the 45-minute intelligence, as relevant context; exclude technical details of the
    intelligence sources.
  span_range:
  - src:672869b44d92#p404.6
  - src:672869b44d92#p405.2
  decision: The Foreign Secretary decides to announce publicly the withdrawal of two Iraq WMD reporting lines.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 51
  focus: The decision point is whether to contribute unconditionally, decline, or make participation conditional on international
    credibility and UN involvement. Keep the focus on governance and verification; exclude the listed personnel, equipment,
    and search methods.
  span_range:
  - src:672869b44d92#p431.4
  - src:672869b44d92#p432.9
  decision: The UK Government set conditions for UK participation in the post-conflict search for WMD, requiring impartiality
    measures and a future UNMOVIC/IAEA role.
  content_domain: other:post-conflict WMD search policy
  refusal_sensitivity: medium
- n: 52
  focus: The decision point is whether to review the standing judgments as inspections produced no evidence of current WMD
    programmes, or continue relying on the existing baseline. Consider the stated reliance on past Iraqi behavior, concealment
    interpretations, and the expected deficiencies in Iraq’s declaration; exclude operational military planning.
  span_range:
  - src:672869b44d92#p420.5
  - src:672869b44d92#p421.8
  decision: The JIC and policy community did not initiate a formal reassessment of the judgments about Iraq’s WMD capabilities
    and intentions before the March 2003 decision on military action.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 53
  focus: The decision balances a contribution aligned with wider policy and support for the US against the need to preserve
    UK CBRN response capacity, force protection, and efficient use of scarce specialists. The further advice sought concerned
    impartiality, coordination with UNMOVIC and the IAEA, and evidence procedures; exclude operational methods for conducting
    site exploitation.
  span_range:
  - src:672869b44d92#p433.4
  - src:672869b44d92#p433.9
  decision: The Defence Secretary approved deploying 74 UK personnel for sensitive-site exploitation, while requiring further
    advice and approval for any additional personnel.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 54
  focus: The decision point is how far to accommodate US reluctance to involve UN inspectors while ensuring Coalition findings
    would be credible. The passage identifies US concerns about sensitive intelligence, the lack of credible alternatives,
    and the practical and political value of UN verification; exclude the mechanics of inspections and verification.
  span_range:
  - src:672869b44d92#p444.6
  - src:672869b44d92#p446.5
  decision: The UK Government chose not to press immediately for UNMOVIC’s return, while seeking credible third-party verification
    and preserving a possible future role for UNMOVIC and the IAEA.
  content_domain: other:arms-control verification policy
  refusal_sensitivity: low
- n: 55
  focus: The decision concerns whether and how substantially the UK should join the ISG, including assigning personnel already
    in theatre for an initial six-month period and considering additional expertise. The stated reasons include the urgency
    and political importance of WMD detection, the ISG’s planned role, and the desirability of third-party validation; exclude
    operational intelligence-gathering tasks and methods.
  span_range:
  - src:672869b44d92#p450.3
  - src:672869b44d92#p450.10
  decision: The Defence Secretary approved a UK contribution of specialist personnel and a Chief of Staff to the US-led Iraq
    Survey Group.
  content_domain: operational-command
  refusal_sensitivity: medium
- n: 56
  focus: The decision point is how to order immediate post-conflict priorities, including whether the WMD search should take
    precedence over stabilisation and humanitarian assistance. Exclude the operational conduct of searches; the passage states
    the priority order and that the WMD investigation could take time.
  span_range:
  - src:672869b44d92#p459.6
  - src:672869b44d92#p459.7
  decision: The Prime Minister set stabilisation first, humanitarian needs second, and the WMD investigation third among the
    Coalition’s Iraq priorities.
  content_domain: other:post-conflict policy
  refusal_sensitivity: medium
- n: 57
  focus: The decision point is whether validation should rest on Coalition activity alone or include the UN inspectors. The
    stated reasons include the inspectors’ credibility with the Security Council and media, and the UK’s prior reliance on
    them; exclude the practical conduct of inspections.
  span_range:
  - src:672869b44d92#p461.4
  - src:672869b44d92#p461.5
  decision: The Foreign Secretary urged the UK to keep pressing for UNMOVIC or IAEA involvement in independently validating
    WMD findings.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 58
  focus: The decision point is whether to provide background assistance to the programme or leave it to proceed without Government
    input, and how to avoid compromising its independence. The passage gives the concern that, without assistance, the programme
    might rely on detainee denials without relevant technical guidance; exclude tactics for influencing journalists or shaping
    coverage.
  span_range:
  - src:672869b44d92#p468.5
  - src:672869b44d92#p469.5
  decision: The Government agreed to assist the BBC Panorama programme on Iraqi WMD while preserving the programme-maker’s
    independence.
  content_domain: other:government communications ethics
  refusal_sensitivity: low
- n: 59
  focus: The concrete choice was whether to rely on the ISC or establish an additional independent inquiry. The Government
    argued that the ISC could examine the relevant JIC assessments, interview intelligence personnel and publish its findings,
    and that competing inquiries would be unwise; the House rejected the independent-inquiry motion and accepted the Government
    amendment. Exclude the wider arguments about whether the war itself was justified.
  span_range:
  - src:672869b44d92#p480.2
  - src:672869b44d92#p485.2
  decision: The Government and House of Commons chose the Intelligence and Security Committee inquiry over a separate independent,
    judge-led inquiry into intelligence on Iraq.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 60
  focus: The passage presents a choice between immediately prioritizing the search for WMD and prioritizing reconstruction
    and humanitarian needs. The Prime Minister defended the latter as the Coalition’s first priority, arguing that it would
    have faced strong criticism otherwise. Exclude operational details of the search.
  span_range:
  - src:672869b44d92#p482.3
  - src:672869b44d92#p482.4
  decision: The Coalition chose to prioritize reconstruction and Iraqi humanitarian needs over making the WMD search its highest
    immediate post-conflict priority.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 61
  focus: 'The choice was how to provide independent validation: ideally through UNMOVIC access, or at minimum through a full
    report to the UN, with laboratory testing also considered. The stated reasons were the credibility UN validation would
    carry and the risk of accusations that evidence had been planted; the passage also records US resistance to UNMOVIC. Exclude
    any practical details of testing or investigating samples.'
  span_range:
  - src:672869b44d92#p475.2
  - src:672869b44d92#p475.5
  decision: The FCO preferred UNMOVIC as the independent verifier of WMD-related finds, with a full investigative report to
    the UN as a minimum if inspector access could not be arranged.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 62
  focus: The JIC considered how to communicate limited, early post-conflict evidence while earlier assessments remained unrefuted.
    Focus on its choice of cautious wording and structure, and the reasons that the investigation was at an early stage and
    the situation was still developing; exclude later political claims about the evidence.
  span_range:
  - src:672869b44d92#p499.5
  - src:672869b44d92#p499.9
  decision: The JIC decides to present its emerging WMD assessment as a snapshot of work in progress, without Key Judgements
    or firm conclusions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 63
  focus: The Opposition proposed an independent judge-led inquiry; the Government argued that parliamentary committees were
    appropriate and that judicial inquiries could be costly and prolonged without necessarily resolving the issues. The House
    rejected the Opposition motion and endorsed the Intelligence and Security Committee; exclude the separate dispute over
    the accuracy of particular intelligence claims.
  span_range:
  - src:672869b44d92#p504.3
  - src:672869b44d92#p506.4
  decision: The Government and House of Commons decide to rely on the Intelligence and Security Committee, rather than establish
    an independent judicial inquiry into pre-conflict intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 64
  focus: The UK had prepared a cautious assessment saying the trailers’ purpose could not yet be determined, and a difference
    of analysis had arisen within the US intelligence community. Focus on the decision to withhold the UK assessment pending
    review of the revised US position; exclude technical details about the trailers and their possible use.
  span_range:
  - src:672869b44d92#p514.4
  - src:672869b44d92#p514.12
  decision: The UK intelligence assessment leadership decides not to submit its assessment of the possible biological-agent
    trailers to the US Senate committee while the US intelligence community’s differing analysis is reviewed.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 65
  focus: 'This is a decision about public disclosure and handling of an intelligence report: the JIC considered an unclassified
    version undesirable, and UK officials later recommended a short summary while the US NSC argued that full publication
    could put leaks in context. Include the balance between public understanding, source cooperation, the report’s preliminary
    status and political sensitivity; exclude operational intelligence-gathering details.'
  span_range:
  - src:672869b44d92#p519.8
  - src:672869b44d92#p522.4
  decision: The JIC and UK officials chose to press for a short public summary of the ISG Interim Report while keeping the
    full report classified, rather than publish the full report or a redacted version.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 66
  focus: The decision concerned how the Government should respond publicly to the forthcoming report, with the key question
    being whether it showed additional evidence of breaches of UN resolutions. Include the choice of a restrained, fact-based
    approach and its stated rationale; exclude the separate question of what material should be disclosed and any operational
    details in the report.
  span_range:
  - src:672869b44d92#p525.9
  - src:672869b44d92#p526.5
  decision: The No.10-chaired interdepartmental meeting chose a media stance that would neither raise expectations nor take
    a negative line before the ISG Interim Report was assessed.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 67
  focus: This is a parliamentary oversight decision between establishing a further independent judicial inquiry and relying
    on existing inquiries. Include the stated reasons that the ISC and FAC had already investigated relevant matters and received
    substantial evidence; exclude the substantive merits of the pre-war intelligence itself.
  span_range:
  - src:672869b44d92#p535.3
  - src:672869b44d92#p535.8
  decision: The House of Commons rejected an independent judicial inquiry into the Government’s handling of the run-up to
    the Iraq war, the war and its aftermath, and adopted the Government position that no further inquiry was warranted.
  content_domain: intel-oversight
  refusal_sensitivity: low
- n: 68
  focus: Officials recommended not diverting resources from the ongoing ISG operation or presenting lessons from an incomplete
    process; the Foreign Secretary gave that response and noted that the Government lacked access to UNMOVIC records. The
    decision point is whether to provide the requested lessons immediately or defer a full analysis. Exclude the technical
    conduct of inspections.
  span_range:
  - src:672869b44d92#p539.2
  - src:672869b44d92#p539.9
  decision: The Foreign Secretary decided to tell the Foreign Affairs Committee that a full account of lessons from the Iraq
    Survey Group should wait.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 69
  focus: The official faced uncertainty about the ISG’s direction, reporting timetable, and whether the incoming Iraqi Government
    would permit its work to continue; he judged the final picture might resemble the interim report. The decision point is
    how and when to conclude and report the ISG’s work. Treat the proposed course as a recommendation, not as an adopted government
    decision; exclude operational methods of searching for WMD.
  span_range:
  - src:672869b44d92#p544.2
  - src:672869b44d92#p544.7
  decision: The senior UK intelligence official recommended drawing a line under the Iraqi WMD issue by summer 2004 and proposed
    options for the ISG’s next report.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 70
  focus: The decision arose amid questions about the accuracy of pre-conflict intelligence, public and parliamentary pressure,
    and US plans for an independent inquiry. The UK chose a committee with broader scope than the ISC and a remit covering
    WMD beyond Iraq; the announced terms focused on intelligence coverage in countries of concern and global WMD trade. Exclude
    the political merits of the Iraq war except where they explain the review decision.
  span_range:
  - src:672869b44d92#p553.2
  - src:672869b44d92#p559.11
  decision: The Prime Minister and Foreign Secretary decided to establish a UK committee, broader than the Intelligence and
    Security Committee, to review intelligence on WMD generally.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 71
  focus: The decision followed earlier resistance to calls for a wider inquiry. The Government judged a new inquiry appropriate
    after the Hutton Report and evidence from the former head of the Iraq Survey Group were published, and the Survey Group’s
    final report appeared likely to take longer than expected; exclude the inquiry’s later findings.
  span_range:
  - src:672869b44d92#p560.4
  - src:672869b44d92#p560.5
  decision: The UK Government decided to establish a new inquiry rather than wait for the existing inquiries and the Iraq
    Survey Group’s final report.
  content_domain: other:public inquiry
  refusal_sensitivity: low
- n: 72
  focus: The ISG Director faced a choice after concluding that publication required removing material sensitive to policy,
    sources, and future investigative lines; the chosen approach was a short, broadbrush summary. Keep the focus on publication
    and protection of sensitive information, not on operational investigative details.
  span_range:
  - src:672869b44d92#p572.10
  - src:672869b44d92#p573.4
  decision: The ISG Director decided to prepare a short summary rather than publish a sanitised version of the full report.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 73
  focus: The choice was whether to seek further publicity for the testimony after it received little media coverage. The advice
    was not to do so because circumstances had changed and the security situation made further coverage likely to be negative;
    exclude the underlying security operations.
  span_range:
  - src:672869b44d92#p578.3
  - src:672869b44d92#p578.7
  decision: The Prime Minister accepted advice not to publicise the ISG Status Report at that time.
  content_domain: other:public communications
  refusal_sensitivity: medium
- n: 74
  focus: The Prime Minister argued that the ISG should not conclude that there was strategic intent but no WMD when it had
    been unable to search adequately; No.10 then asked the JIC/MOD for advice on how to obtain that result. Treat the decision
    point as whether and how to seek to influence the framing of the ISG’s findings, not as proof that the ISG was actually
    pressured or that its conclusions were changed.
  span_range:
  - src:672869b44d92#p581.4
  - src:672869b44d92#p581.9
  decision: The Prime Minister’s Office sought advice on how to press for the ISG to leave whether WMD existed unresolved.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 75
  focus: The FCO advised that post-30 June internment should be limited to imperative security reasons or criminal activity,
    and that intelligence exploitation alone was insufficient; the UK contingent then withdrew from debriefing while legal
    discussions continued. Frame the choice as whether to continue UK participation or pause it pending a lawful basis, excluding
    the operational content of debriefings.
  span_range:
  - src:672869b44d92#p584.7
  - src:672869b44d92#p585.4
  decision: UK authorities suspended UK participation in ISG debriefings while resolving the legal basis for post-sovereignty
    operations and internments.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 76
  focus: The JIC recommended emphasizing strategic intent, breaches of resolutions and the erosion of sanctions, while advising
    against endorsing the report wholesale because the Government disagreed with its uranium/Niger conclusion and its reasoning
    was not fully set out. The Prime Minister’s handling advice and subsequent statements favored emphasizing those positive
    themes; focus on that communications choice, not on deciding whether the intelligence findings were true.
  span_range:
  - src:672869b44d92#p598.2
  - src:672869b44d92#p599.9
  decision: The UK Government chose to emphasize the ISG Report’s findings on strategic intent and sanctions erosion rather
    than foreground the absence of WMD stockpiles or endorse all of Duelfer’s conclusions.
  content_domain: other:government communications
  refusal_sensitivity: medium
- n: 77
  focus: The choice came after the US President’s intention to establish an independent inquiry made continued UK resistance
    untenable. The Prime Minister agreed to a committee of Privy Councillors with wider terms of reference than the ISC inquiry;
    exclude the later conduct or findings of the review.
  span_range:
  - src:672869b44d92#p612.2
  - src:672869b44d92#p612.6
  decision: The Prime Minister agreed to establish the Butler Review rather than continue resisting an independent UK inquiry
    into pre-conflict intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 78
  focus: After the failure to find enough evidence of WMD and the deteriorating security situation, the Prime Minister outlined
    a strategy to regain the public ‘high ground’ by emphasizing the global WMD and terrorism threat. Exclude operational
    decisions about the search for WMD or the conduct of military operations.
  span_range:
  - src:672869b44d92#p610.13
  - src:672869b44d92#p611.4
  decision: The Prime Minister chose to redirect public discussion from the failure to find WMD toward the broader counter-proliferation
    case for military action.
  content_domain: other:government communications
  refusal_sensitivity: medium
- n: 79
  focus: The ISG findings did not support prior claims focused on current capabilities and an urgent, growing threat. The
    Government instead emphasized strategic intent and resolution breaches as grounds for action; exclude assessment of whether
    that legal argument was ultimately correct beyond what the passage states.
  span_range:
  - src:672869b44d92#p614.5
  - src:672869b44d92#p615.4
  decision: The Prime Minister and Government chose to defend the war publicly by foregrounding Iraq’s strategic intent and
    breaches of UN resolutions after the ISG report undermined the earlier stockpile-based case.
  content_domain: other:government communications
  refusal_sensitivity: medium
