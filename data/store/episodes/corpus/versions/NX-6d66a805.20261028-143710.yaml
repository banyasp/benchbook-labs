  focus: The decision point is whether to withdraw reports once their underlying sourcing was discredited, while considering
    the concern that withdrawal could undermine confidence in other reporting. Focus on the withdrawal decision and its stated
    reasons; exclude the methods used to contact or assess the source.
  span_range:
  - src:672869b44d92#p388.6
