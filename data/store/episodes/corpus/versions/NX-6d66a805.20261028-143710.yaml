- n: 1
  focus: The decision point is the JIC’s choice to describe the evidence as clear and assess continuing activity as likely,
    despite a limited picture and a new, unvalidated report about mobile production facilities. Consider the stated basis
    for the judgment and the later finding that the key judgment was firmer than the supporting analysis; exclude the operational
    details of any alleged facilities.
  span_range:
  - src:672869b44d92#p17.4
  - src:672869b44d92#p20.3
  decision: The Joint Intelligence Committee (JIC) decided how firmly to assess whether Iraq was continuing biological-warfare
    activity in its April 2000 assessment.
