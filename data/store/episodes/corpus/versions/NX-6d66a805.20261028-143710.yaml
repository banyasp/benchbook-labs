  focus: The assessment weighs the possibility of destroying some facilities against uncertainty about programme locations
    and the ability to continue activity at other or civilian sites; it concludes action would at best delay some development.
    Treat this as an intelligence assessment of likely effects, not a decision to strike or guidance on how to conduct military
    action.
  span_range:
  - src:672869b44d92#p28.8
