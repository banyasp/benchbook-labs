  focus: 'The Prime Minister rejects both taking military action come what may and walking away from the disarmament demand:
    he presents a new UN resolution and diplomatic process as the immediate course, backed by genuine preparedness and planning
    for action if diplomacy fails. His stated reasons include Iraq’s history of rejecting UN demands, the risk that inaction
