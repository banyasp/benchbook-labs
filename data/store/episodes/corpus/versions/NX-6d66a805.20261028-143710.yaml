  focus: The decision was between addressing Iraq alone and covering Iraq alongside other countries; officials later contemplated
    a separate, more general paper. The stated context was the public focus on Iraq and concern that the draft was trying
    to do too much. Exclude the separate question of how to present intelligence claims in the dossier.
  span_range:
  - src:672869b44d92#p83.13
