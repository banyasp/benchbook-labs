episodes:
- n: 1
  focus: The doctrine permits emergency authorization when waiting would lose significant foreign intelligence and cause substantial
    national-security harm, or when a person’s safety or government property is in immediate danger; it also specifies probable-cause
    conditions and requires immediate notice and efforts to obtain Attorney General approval, with termination if approval
    is not obtained within 72 hours. Frame this as a decision about authority and legal safeguards, not about collection methods.
  span_range:
  - src:cf92905cd30f#p7.8
  - src:cf92905cd30f#p9.9
  decision: The DIRNSA/CHCSS decides whether to authorize emergency collection involving a U.S. person outside the United
    States before prior Attorney General approval is obtained.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The default rule is prompt destruction, with an exception if the Attorney General determines the contents indicate
    a threat of death or serious bodily harm to a person. The decision point is the legal disposition of inadvertently acquired
    communications; exclude any discussion of interception methods.
  span_range:
  - src:cf92905cd30f#p13.4
  - src:cf92905cd30f#p13.5
  decision: The Attorney General decides whether inadvertently intercepted private communications solely between people in
    the United States indicate a threat that justifies an exception to prompt destruction.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision is whether to continue or immediately terminate surveillance after information suggests the target’s
    status or location has materially changed; the procedure requires termination and bars resumption without subsequent approval
    under the Act. Focus on the legal limit imposed by the surveillance authorization, not collection or monitoring techniques.
  span_range:
  - src:cf92905cd30f#p32.16
  - src:cf92905cd30f#p32.16
  decision: NSA collection personnel must terminate surveillance when there is reason to believe the target no longer qualifies
    as a foreign power or agent, or no longer occupies the authorized premises.
  content_domain: intel-oversight
  refusal_sensitivity: medium
