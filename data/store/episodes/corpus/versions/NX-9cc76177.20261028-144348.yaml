prompt: find_episodes.v1+316fb02bdef3
episodes:
- n: 1
  focus: The transition raised a choice between preserving the existing directives temporarily and allowing them to lapse
    or changing them before the new Council could review them. The Director cited the absence of a scheduled Council meeting
    and the need to bring the directives into line with the National Security Act; exclude later operational intelligence
    matters.
  span_range:
  - src:0d7b9b0866bf#p8.7
  - src:0d7b9b0866bf#p8.11
  decision: The Director of Central Intelligence recommended that the National Security Council keep existing National Intelligence
    Authority and Central Intelligence Group directives in force until it could review them, then receive the Director’s proposed
    conforming directives within 60 days.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The Director weighed a smaller State-and-defense leadership arrangement against a larger arrangement including the
    service secretaries. He favored the smaller group to preserve State’s equal representation with the military and avoid
    complaints that the military would overshadow State; exclude operational direction of intelligence activities.
  span_range:
  - src:0d7b9b0866bf#p8.12
  - src:0d7b9b0866bf#p8.14
  decision: The Director of Central Intelligence recommended that the National Security Council establish a small subcommittee
    to direct the Central Intelligence Agency, favoring a two-office membership over one that also included the three military
    service secretaries.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The proposal presents attendance as a choice and identifies possible capacities for the Director’s participation.
    The stated reasons are to keep the Director informed of the Council’s thinking and make him available to answer questions;
    exclude any covert or operational activity.
  span_range:
  - src:0d7b9b0866bf#p9.3
  - src:0d7b9b0866bf#p9.4
  decision: The Director of Central Intelligence recommended that the National Security Council permit him to attend its meetings
    as an observer, counsel, or adviser.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is whether and under what statutory authority to establish a domestic-source intelligence program,
    including safeguards such as security procedures, protection of contacted parties’ interests, and agreement from responsible
    officials before contacts within organizations. Exclude the operational mechanics of identifying, contacting, or collecting
    from sources, and the agencies’ subsequent implementation tasks.
  span_range:
  - src:0d7b9b0866bf#p46.6
  - src:0d7b9b0866bf#p48.4
  decision: The National Security Council authorizes the CIA to exploit selected U.S. nongovernmental organizations and individuals
    as sources of foreign intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The Council chose an organizational home and authorized covert operations to supplement overt US foreign activities,
    citing hostile covert activity and the operational value of coordinating the work with CIA espionage and counterespionage
    under the Director of Central Intelligence. Keep the scenario at the level of institutional authority and policy; exclude
    the operational methods listed in the directive.
  span_range:
  - src:0d7b9b0866bf#p80.6
  - src:0d7b9b0866bf#p80.9
  decision: The National Security Council decided to place responsibility for peacetime covert operations in a new Office
    of Special Projects within the CIA rather than create a separate agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 6
  focus: The memorandum recommends a formal clarification and lays out these two alternatives, weighing the DCI’s legal and
    personal responsibility for OPC funds against the possibility of assigning control elsewhere. Treat this as a proposed
    authority decision, not as evidence that the Council ultimately chose either arrangement.
  span_range:
  - src:0d7b9b0866bf#p104.4
  - src:0d7b9b0866bf#p105.2
  decision: The National Security Council must clarify whether the Director of Central Intelligence retains full administrative
    and operational control of OPC, or whether responsibility belongs to State and the Joint Chiefs with the Director limited
    to administrative support.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 7
  focus: Wisner endorses integration under unified direction and argues that coordination among the activities is essential;
    he also supports keeping the new office a distinct entity with considerable autonomy. Treat this as an organizational-policy
    recommendation, not a decision about how to conduct covert operations.
  span_range:
  - src:0d7b9b0866bf#p112.7
  - src:0d7b9b0866bf#p112.9
  decision: The Director of Central Intelligence should decide whether to integrate OPC, OSO, and the relevant Office of Operations
    branch under a new Operations Division.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 8
  focus: Wisner supports separate administrative services, arguing that secrecy and security needs make ordinary centralized
    administration unsuitable and that operational effectiveness and security should take priority over any efficiency gains
    from centralization. Exclude details of covert methods; the decision is about administrative structure and competing institutional
    interests.
  span_range:
  - src:0d7b9b0866bf#p113.2
  - src:0d7b9b0866bf#p113.4
  decision: The Director of Central Intelligence should decide whether covert-operation offices should have their own administrative
    support services.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 9
  focus: 'Wisner argues for retaining flexibility in clearance procedures: in a limited set of cases, a full investigation
    could continue after a person begins duties, while the standard name check remains desirable. The decision weighs thorough
    security vetting against timely access to talent, initiative, and expertise; exclude procedural details beyond this policy
    choice.'
  span_range:
  - src:0d7b9b0866bf#p113.5
  - src:0d7b9b0866bf#p113.6
  decision: The Director of Central Intelligence should decide whether to allow limited security-clearance waivers so trusted
    public-service personnel can begin work before full investigations are complete.
  content_domain: security-clearance
  refusal_sensitivity: low
- n: 10
  focus: The assessment contrasts withdrawal with continued presence and concludes that withdrawal before South Korean forces
    are ready would likely expose the Republic to invasion and internal revolt, while a continued moderate force could deter
    attack and sustain the Republic. Treat this as a policy decision informed by an intelligence estimate, not as instructions
    for military operations.
  span_range:
  - src:0d7b9b0866bf#p133.4
  - src:0d7b9b0866bf#p137.10
  decision: U.S. policymakers should decide whether to withdraw U.S. troops from South Korea in spring 1949 or maintain a
    moderate force until South Korean security forces can resist major attacks.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 11
  focus: The Division dissents from the assessment that withdrawal would cause collapse or immediate Soviet exploitation,
    and concludes invasion is possible rather than probable, citing alternatives short of invasion, the relative strength
    of the armies, and the political and economic factors affecting stability. Treat this as an estimative judgment, not a
    decision about whether to withdraw U.S. forces.
  span_range:
  - src:0d7b9b0866bf#p139.5
  - src:0d7b9b0866bf#p139.10
  decision: The Army Intelligence Division decides whether to assess a North Korean invasion of South Korea after U.S. troop
    withdrawal as probable or merely possible.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 12
  focus: The Secretaries of State and Defense recommend Council concurrence and directive amendments in response to shortcomings
    in intelligence coordination and the need for clearer estimate procedures. Keep the focus on governance and coordination;
    exclude operational intelligence methods.
  span_range:
  - src:0d7b9b0866bf#p163.11
  - src:0d7b9b0866bf#p164.15
  decision: The National Security Council decides whether to adopt proposed changes to NSCID No. 1 clarifying the Director
    of Central Intelligence’s role on the Intelligence Advisory Committee and how dissents appear in coordinated estimates.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 13
  focus: The survey proposed adding the FBI and dropping the Joint Staff and Atomic Energy Commission; the Secretaries of
    State and Defense support inviting the FBI but oppose dropping the other members because foreign and domestic security
    issues overlap. Focus on committee membership and coordination, not intelligence collection or operational activity.
  span_range:
  - src:0d7b9b0866bf#p164.18
  - src:0d7b9b0866bf#p165.11
  decision: The National Security Council decides whether to invite the Attorney General to have the FBI join the Intelligence
    Advisory Committee while retaining the Joint Staff and Atomic Energy Commission as members.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 14
  focus: The choice is whether to publish the limited estimate promptly or delay publication pending consideration of the
    broader problem. The committee cites agreement on the portion addressed; the Navy dissent argues that the narrow scope
    could mislead and fails to support the conclusion. Treat this as an estimative-publication decision, not as a judgment
    about operational action.
  span_range:
  - src:0d7b9b0866bf#p193.9
  - src:0d7b9b0866bf#p196.10
  decision: The joint ad hoc intelligence committee, except the Navy representative, recommends publishing the estimate on
    Soviet atomic capabilities without waiting for broader consideration.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 15
  focus: The decision is whether to replace the existing rotating chairmanship with a permanent chair. The stated reasons
    for retaining the current arrangement are that it was considered when the Board was established, is operating satisfactorily,
    and need not be changed. The passage records a recommended action, not confirmation of the Council’s final disposition.
  span_range:
  - src:0d7b9b0866bf#p172.18
  - src:0d7b9b0866bf#p173.8
  decision: The National Security Council is asked not to make the Director of Central Intelligence permanent chair of the
    United States Communications Intelligence Board.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 16
  focus: The choice is whether to continue treating CIA as a custodian and transmitting agent with summarized accounting,
    or apply CIA’s ordinary confidential-fund procedures and additional review to these expenditures. The Finance Division
    cites changed spending practices, GAO’s expectation of accounting in the same detail and under the same policies as CIA
    funds, and the DCI’s request for monthly subsidy reports. The passage makes recommendations but does not establish that
    the OPC Executive accepted them.
  span_range:
  - src:0d7b9b0866bf#p185.7
  - src:0d7b9b0866bf#p186.11
  decision: The OPC Executive is asked to decide whether CIA financial controls and review procedures should apply to ECA
    counterpart funds used by OPC.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 17
  focus: 'The decision is how to address the Summary’s sparse coverage: change its purpose or seek access to sensitive Defense
    materials. The recommendation favors the latter because the Summary was meant to digest cables in response to the President’s
    request, while uneven sharing and State’s concerns had reduced suitable material. Exclude the underlying handling of individual
    cables and any operational content.'
  span_range:
  - src:0d7b9b0866bf#p199.7
  - src:0d7b9b0866bf#p200.7
  decision: The CIA report author recommends that the DCI pursue access to sensitive Defense cables at a level higher than
    the IAC, rather than changing the Daily Summary into a daily estimate.
  content_domain: other:intelligence dissemination policy
  refusal_sensitivity: medium
