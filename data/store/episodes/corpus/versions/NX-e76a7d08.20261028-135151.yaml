  - src:ab94f6ef50ce#p13.2
  decision: The mishap instructor pilot chose to serve both as the student’s instructor and as FAC(A) for both flights, rather
    than leave FAC(A) control to the qualified JTACs.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 2
