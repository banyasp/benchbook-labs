  focus: This is a command decision about allocating oversight and control responsibilities during a complex training mission.
    The syllabus allowed either a FAC(A) or a JTAC, and qualified JTACs were present; the stated rationale for the plan was
    to qualify both student pilots while the other instructor lacked a required qualification. Exclude the detailed flight
    and weapons procedures.
  span_range:
