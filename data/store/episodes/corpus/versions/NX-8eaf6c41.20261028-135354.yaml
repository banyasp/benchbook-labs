- n: 1
  focus: The decision point is the President’s approval of Donovan’s proposal for a new service, with a military character
    but outside the existing emergency-management structure. The proposal argued that the country lacked effective, comprehensive
    long-range information for strategic planning; exclude the later operational details of intelligence and special activities.
  span_range:
  - src:50672a5483c8#p4.2
  - src:50672a5483c8#p6.3
  decision: The President chooses to establish a separate Coordinator of Strategic Information, outside the Office of Emergency
    Management, to address gaps in national-security information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is the final choice of a civilian post after Army leaders objected that a military Coordinator
    could create a rival channel of military advice to the President. The final order omitted military status and retained
    a guarantee against interference with the regular advisers; exclude the separate question of how the office would conduct
    intelligence or special activities.
  span_range:
  - src:50672a5483c8#p13.4
  - src:50672a5483c8#p18.3
  decision: The President and order drafters settle on a civilian Coordinator of Information rather than a military officer,
    preserving the regular military and naval advisers’ responsibilities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision was whether to create a central coordinating service or rely on the existing departmental intelligence
    units. The proposal cited scattered information and inadequate long-range analysis for strategic planning, while stating
    that the new service would not displace existing agencies; exclude operational collection methods and later disputes over
    the office’s activities.
  span_range:
  - src:50672a5483c8#p33.4
  - src:50672a5483c8#p35.7
  decision: The President establishes the Coordinator of Information with authority to coordinate national-security information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 4
  focus: The choice was whether the two offices could proceed with potentially overlapping roles or whether the President
    should require coordination; he directed an advisor to prevent inconsistencies. The establishment of the Office of Facts
    and Figures subsequently ended the Coordinator’s morale function; exclude the offices’ operational activities.
  span_range:
  - src:50672a5483c8#p29.2
  - src:50672a5483c8#p29.2
  decision: The President directs coordination between the Coordinator of Information and the Office of Facts and Figures
    to prevent conflicting functions.
  content_domain: intel-oversight
