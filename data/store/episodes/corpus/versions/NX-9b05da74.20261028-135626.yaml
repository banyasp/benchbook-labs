  focus: The account describes destruction after the war and later destruction of the remaining machines and records; it says
    the concern was that revealing the technology could put Allied cryptanalytic capability at risk. The decision point is
    whether to preserve or destroy the systems and documentation, not how the computers worked.
  span_range:
