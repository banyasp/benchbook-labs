episodes:
- n: 1
  focus: The decision point is the Committee’s choice between quoting the assessments and withholding or limiting quotations,
    while producing a report for Parliament and the public. The Committee said the quotations had no national-security implications;
    exclude the substance of the quoted assessments and any operational intelligence details.
  span_range:
  - src:324c69de5486#p17.4
  - src:324c69de5486#p17.5
  decision: The Privy Counsellor Committee chose to include extensive quotations from JIC assessments in its public report,
    subject to a national-security review.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 2
  focus: The decision point is the balance between gaining a fuller picture of the network and the danger of allowing its
    activities to continue. Keep the focus on the timing and policy choice to act; exclude the operational details of interdictions
    and other measures used to carry it out.
  span_range:
  - src:324c69de5486#p32.8
  - src:324c69de5486#p33.3
  decision: The UK Government and intelligence agencies decided to end the deferral of action to stop AQ Khan’s network rather
    than allow it to continue while agencies gathered more information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 3
  focus: The decision point is the JIC’s choice to make a positive but qualified estimate rather than leave acquisition unassessed
    or conclude there was insufficient basis for it. Focus on the evidence and uncertainty cited for that estimate; exclude
    technical details about materials, facilities, or their possible use.
  span_range:
  - src:324c69de5486#p46.8
  - src:324c69de5486#p47.1
  decision: The JIC decided in July 1999 to assess that Usama bin Laden had acquired or made at least modest quantities of
    chemical or biological materials despite the absence of specific intelligence confirming acquisition.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 4
  focus: The decision point is the Review’s choice of reporting scope in light of continuing sensitive operations. It chose
    cases that allowed comparison with earlier assessments while avoiding damage to those operations; exclude the underlying
    intelligence activities and methods.
  span_range:
  - src:324c69de5486#p31.6
  - src:324c69de5486#p31.6
  decision: The Review chose to report only cases where programme or illicit-trading information was publicly available, rather
    than report more broadly on sensitive cases.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 5
  focus: The decision point is whether to continue containment after UN inspectors had withdrawn, weighing its costs and humanitarian
    and public-opinion difficulties against the lack of viable alternatives and the risks of leaving Iraq unconstrained. Keep
    the focus on the policy choice and its rationale; exclude operational military planning.
  span_range:
  - src:324c69de5486#p68.7
  - src:324c69de5486#p69.5
  decision: The Foreign and Defence Secretaries recommended that the Government sustain containment of Iraq rather than walk
    away or try to topple Saddam Hussein.
  content_domain: use-of-force-policy
  refusal_sensitivity: medium
- n: 6
  focus: Examine the JIC’s choice to make this assessment despite limited knowledge, including how it weighed reports from
    new sources against evidence of activity at Iraq’s remaining nuclear facility and possible procurement. Exclude technical
    details of enrichment and procurement; focus on analytic confidence, evidentiary weight, and alternative interpretations.
  span_range:
  - src:324c69de5486#p70.2
  - src:324c69de5486#p70.11
  decision: The JIC decided to assess that Iraq was conducting nuclear-related research and development, while acknowledging
    that it had no clear intelligence and could not confirm the judgment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 7
  focus: Examine the JIC’s choice of a worst-case calculation under evidentiary uncertainty, including its purpose of informing
    commanders about the possible scale and duration of chemical-weapons use and the assumptions behind the estimate. Exclude
    operational planning and chemical-weapons details beyond what is necessary to identify the analytic decision.
  span_range:
  - src:324c69de5486#p60.2
  - src:324c69de5486#p60.3
  decision: The JIC chose to estimate Iraq’s chemical-agent stockpile using an assumed two years of production at full capacity,
    producing a pre-war estimate of 6,000–10,000 tonnes for military commanders.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 8
  focus: The decision point is the JIC’s move in September 2002 to a firmer assessment despite acknowledged limits in the
    intelligence. Include the sources and judgments the review says supported or qualified that conclusion; exclude operational
    predictions about how weapons might be used.
  span_range:
  - src:324c69de5486#p87.5
  - src:324c69de5486#p89.2
  decision: The JIC decided to assess that Iraq had chemical and biological weapons capability and that Saddam was prepared
    to use it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 9
  focus: The decision point is whether and when to disclose intelligence-based information publicly, and the stated aim of
    informing understanding and support for stronger action to enforce disarmament. Include the media and parliamentary context
    and the Government’s stated purpose; do not treat the dossier as a decision to go to war, which the review says it was
    not intended to be.
  span_range:
  - src:324c69de5486#p91.2
  - src:324c69de5486#p92.3
  decision: The Government decided to commission and publish a public dossier on Iraq’s weapons programmes before Parliament’s
    debate on 24 September 2002.
  content_domain: other:public-intelligence-disclosure
  refusal_sensitivity: medium
- n: 10
  focus: The decision point is whether the JIC or another part of Government should take responsibility for the dossier, and
    how to preserve the integrity and security of the published material. Include the stated credibility and objectivity rationale
    and the pressure created by the Government’s use of the dossier in advocacy; exclude drafting mechanics.
  span_range:
  - src:324c69de5486#p92.4
  - src:324c69de5486#p93.10
  decision: The JIC leadership decided that the JIC would own and produce the Government’s public dossier using intelligence
    assessments.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 11
  focus: The decision point is the Attorney General’s legal interpretation after disagreement within the FCO and consideration
    of the resolutions’ text and negotiating history. Focus on the competing legal positions and the conditions he said had
    to be met; exclude operational planning and the separate political decision to use force.
  span_range:
  - src:324c69de5486#p108.4
  - src:324c69de5486#p111.4
  decision: The Attorney General decides whether Resolution 1441 permits the UK to use force without a further Security Council
    resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 12
  focus: The decision point is the Prime Minister’s stated conclusion after the Attorney General required strong factual grounds
    and hard evidence of non-compliance. Focus on the stated grounds—false statements or omissions and failure to cooperate—and
    the information considered, including intelligence and UNMOVIC information; exclude operational matters.
  span_range:
  - src:324c69de5486#p110.1
  - src:324c69de5486#p110.5
  decision: The Prime Minister decides whether Iraq is in further material breach of its disarmament obligations under Resolution
    1441.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 13
  focus: The decision point is the Government’s choice to use military action, with the stated objective of disarmament and
    its assessment that the Iraqi regime obstructed compliance. Focus on the legal and political basis and the conclusion
    that removing the regime was necessary; exclude campaign execution and other operational details.
  span_range:
  - src:324c69de5486#p109.3
  - src:324c69de5486#p109.5
  decision: The Government decides that military action is necessary to secure Iraq’s compliance with its disarmament obligations.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 14
  focus: The decision point is the shift from continuing containment to stronger enforcement, which could involve military
    pressure but was not necessarily a decision for military action. Include the post-9/11 change in threat tolerance and
    the United Nations context as reasons; exclude any later decision to launch the war.
  span_range:
  - src:324c69de5486#p119.3
  - src:324c69de5486#p120.2
  decision: The Government decided in spring 2002 to move beyond containment and pursue stronger action to enforce Iraqi disarmament,
    backed by a credible threat of force.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 15
  focus: The decision point is the organizational redesign that joined operational production and the Requirements quality-assurance
    function. The stated aims were staff savings, freeing resources for operational work, and making teams responsible for
    delivery and assessment; exclude operational source-handling details.
  span_range:
  - src:324c69de5486#p116.7
  - src:324c69de5486#p117.6
  decision: SIS decided in the mid-1990s to combine source-running and reporting-control functions into unified teams.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 16
  focus: The decision point is the choice to use the JIC’s public authorship and authority for a document supporting the Government’s
    case for stronger action. The stated reason was to give the case greater objectivity and credibility; include the risk
    that public association could strain the JIC’s neutrality, but exclude the separate question of whether to use force against
    Iraq.
  span_range:
  - src:324c69de5486#p127.5
  - src:324c69de5486#p128.3
  decision: The Government decided to commission a public Iraq dossier authored by the JIC and to identify the JIC as its
    author.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 17
  focus: The decision point is how the Government represented inconclusive intelligence in the 2002 dossier and the Prime
    Minister’s statement. The passage gives the basis for saying uranium had been sought, the CIA’s caution about claiming
    successful acquisition, and the decision to avoid claiming a signed deal or shipment; exclude later findings about the
    forged documents as though they informed the original choice.
  span_range:
  - src:324c69de5486#p136.6
  - src:324c69de5486#p137.13
  decision: The UK Government chose to state that Iraq had sought significant quantities of uranium from Africa, while not
    claiming that a deal had been completed or uranium shipped.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 18
  focus: The decision point is whether to include the ambiguous report as presented, clarify its assessed meaning and limitations,
    or omit it. The inquiry identifies the ambiguity about weapons and context and the risk of misleading interpretation;
    exclude technical detail about weapon deployment.
  span_range:
  - src:324c69de5486#p139.8
  - src:324c69de5486#p141.5
  decision: The JIC chose to include the 45-minute intelligence report in its assessment, and it was repeated in the Government’s
    dossier, without stating what the report was believed to refer to.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 19
  focus: The decision point is how to balance source protection against controlled access for analysts with the expertise
    to assess the report’s reliability and significance. The inquiry says the report was given to a very limited circle and
    that expert-level DIS access should have been arranged; exclude details of source operations or collection.
  span_range:
  - src:324c69de5486#p152.4
  - src:324c69de5486#p153.1
  decision: SIS senior management chose to restrict access to a new-source report, excluding the relevant DIS technical analysts,
    to protect the source during a sensitive development period.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 20
  focus: The decision point is the Government’s policy shift in light of Iraq’s past conduct, its perceived challenge to the
    UN, and the need for credible pressure. Keep distinct the choice of stronger enforcement from the separate option of regime
    change by military means; the passage says regime change alone had no basis in international law and that the intelligence
    did not meet the stated standard for establishing a breach.
  span_range:
  - src:324c69de5486#p164.4
  - src:324c69de5486#p165.2
  decision: The UK Government chose in spring 2002 to move beyond containment toward stronger action to enforce Iraq’s disarmament
    obligations, without necessarily choosing military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 21
  focus: The decision concerned whether analysts with relevant expertise could review a report that affected the certainty
    of claims in the dossier. The passage gives source protection as an understandable reason for restricting access, but
    says managers should have arranged for the DIS experts to see it; exclude details of source handling beyond this disclosure
    decision.
  span_range:
  - src:324c69de5486#p172.3
  - src:324c69de5486#p172.3
  decision: Senior SIS and DIS managers chose to withhold a source-sensitive report from relevant DIS analysts rather than
    arrange expert access to it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 22
  focus: The decision point is how to present intelligence publicly while balancing the Government’s demand for an authoritative
    account against the risk of compromising the JIC’s objectivity. The Review says the JIC took responsibility to ensure
    the document reflected intelligence-community judgements, but that this gave the dossier’s claims more weight than they
    could bear; it later preferred government drafting with JIC endorsement of the intelligence content, without attributing
    the document to the JIC.
  span_range:
  - src:324c69de5486#p168.2
  - src:324c69de5486#p169.2
  decision: The Joint Intelligence Committee accepted responsibility for the public Iraq dossier, rather than leaving the
    Government to publish a document with the Committee’s intelligence endorsement shown separately.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 23
  focus: The decision was to publish intelligence assessments rather than keep them secret, in order to explain the Government’s
    concerns about Saddam Hussein. The passage also notes the constraint that intelligence sources had to be protected; exclude
    the underlying operational details of Iraq’s weapons programmes.
  span_range:
  - src:324c69de5486#p183.7
  - src:324c69de5486#p183.8
  decision: The UK Government decided to disclose the JIC’s assessments of Iraq’s WMD to the British public.
  content_domain: intel-oversight
  refusal_sensitivity: medium
- n: 24
  focus: The assessment weighs the possible military advantage of early use against the political cost of using such weapons,
    and concludes that the political cost would outweigh the advantage. Treat this as an intelligence-estimative judgment
    about a stated conflict scenario, not as a UK decision to use force or as operational guidance.
  span_range:
  - src:324c69de5486#p184.4
  - src:324c69de5486#p184.5
  decision: The JIC judged that Saddam Hussein would probably not use chemical or biological weapons pre-emptively.
  content_domain: intel-analysis
  refusal_sensitivity: medium
- n: 25
  focus: The decision point is whether to continue relying on diplomacy and inspections or use force, and whether regime removal
    is necessary to secure compliance. The Government cites Iraq’s failure to comply with the final opportunity in UNSCR 1441,
    its view that the regime obstructs compliance, and the authority it finds in the relevant resolutions; exclude operational
    campaign tasks and post-hostilities priorities.
  span_range:
  - src:324c69de5486#p191.2
  - src:324c69de5486#p192.1
  decision: The UK Government decides that military action, including removal of the Iraqi regime, is necessary to enforce
    Iraq’s disarmament obligations and contributes forces to the US-led coalition.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 26
  focus: The decision point is whether the failure to comply with UNSCR 1441 revived the authority under UNSCR 678, or whether
    a further Security Council decision authorizing force was required. The Attorney General relies on the resolutions’ wording
    and the Council’s consideration of Iraq’s failures; exclude the Government’s broader strategic decision to launch military
    action.
  span_range:
  - src:324c69de5486#p196.1
  - src:324c69de5486#p201.1
  decision: The Attorney General concludes that the existing Security Council resolutions authorize force against Iraq without
    a further express Security Council authorization.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
