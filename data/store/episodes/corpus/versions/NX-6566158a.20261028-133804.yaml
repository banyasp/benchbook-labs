  - src:5be338935c81#p370.7
  decision: The Foreign and Commonwealth Office chose to issue contingency guidance to overseas posts on post-Saddam Iraq
    despite the UK’s stated objective of disarmament rather than regime change.
  content_domain: other:diplomatic contingency-planning policy
  refusal_sensitivity: low
- n: 47
  focus: On 18 February, the Secretary of State chose not to approve a forward base or proposed deployments and limited DFID’s
    planned role, while accepting that this could leave it unprepared for an immediate crisis. The reasons included the lack
    of a clear financial package, concern that preparations would imply military action was certain or commit DFID to a larger
    role, and the priority of supporting the UN and wider international effort. Exclude the specific logistics of deployment
    and the later assessment of what officials should have done.
  span_range:
  - src:5be338935c81#p396.7
  - src:5be338935c81#p397.15
  decision: The DFID Secretary of State decided to limit immediate humanitarian preparations and deployments before military
    action in Iraq.
  content_domain: other:humanitarian policy
  refusal_sensitivity: low
- n: 48
  focus: The IPU recommended resisting responsibility for a sector beyond a short period without express UN authorisation
    and an early move to UN transitional administration; it would not accept medium-term administration under an unauthorised
    US occupation. The choice weighed legality, cost, force and administrative capacity, international legitimacy, and the
    risk of resentment or undermining Iraqi unity. This was a proposed negotiating position, not evidence of a final ministerial
    decision; exclude operational details of administering the sector.
  span_range:
  - src:5be338935c81#p398.7
  - src:5be338935c81#p401.12
  decision: UK officials decided to recommend that the UK accept responsibility for a sector in Iraq only on limited, internationally
    authorised terms.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
- n: 49
  focus: The proposed line was to commit in principle to immediate aftermath operations while withholding commitment to a
    long-term plan. The stated reasons included preserving UK influence while more was learned about objectives, capability,
    sustainment, the command chain and whose political and legal authority would prevail; exclude later decisions about the
    size or deployment of forces.
  span_range:
  - src:5be338935c81#p405.7
  - src:5be338935c81#p405.11
  decision: The UK delegation decided what position to take on its post-conflict commitment at the US Rock Drill.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
- n: 50
  focus: The choice was whether to accept or decline a UK role leading one of ORHA’s sectors. The advice cited the political
    controversy and likely disorder of ORHA’s work without a UN mandate, and concerns that its reform and reconstruction ambitions
    exceeded the authority of an occupying power; exclude operational details of sector administration.
  span_range:
  - src:5be338935c81#p410.2
  - src:5be338935c81#p412.5
  decision: The Iraq Planning Unit official advised against the UK accepting a likely offer to lead an ORHA sector.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
- n: 51
  focus: The choice was between relying primarily on UN agencies and taking a more active bilateral role in a UK-controlled
    zone. The stated plan made the bilateral option conditional on extra funding, while the broader account notes that effective
    involvement depended on UN cover; exclude the operational details of aid delivery.
  span_range:
  - src:5be338935c81#p420.2
  - src:5be338935c81#p422.4
  decision: DFID chose to plan to deliver humanitarian assistance primarily through UN agencies, with a more active bilateral
    role conditional on additional resources.
  content_domain: other:humanitarian policy
  refusal_sensitivity: low
- n: 52
  focus: The decision point is whether DFID should prepare and deploy for a wider humanitarian role alongside UK forces, given
    the stated constraints of UN authority, available funds and humanitarian principles. Keep the focus on the policy and
    authority decision; exclude the details of military planning and supply pre-positioning.
  span_range:
  - src:5be338935c81#p428.4
  - src:5be338935c81#p429.5
  decision: The DFID Secretary of State chose to maintain limits on DFID’s operational post-conflict role rather than authorize
    substantive preparations for an exemplary deployment.
  content_domain: other:humanitarian policy
  refusal_sensitivity: low
- n: 53
  focus: The decision point is whether to seek specific UN authority for post-conflict tasks or proceed under the narrower
    legal framework governing occupation. The stated reasons include legal limits on an occupying power and the political
    value of UN authority; exclude operational administration details.
  span_range:
  - src:5be338935c81#p431.5
  - src:5be338935c81#p434.7
  decision: The UK Foreign Secretary chose to press for UN Security Council authority for post-conflict occupation and administration
    rather than rely solely on the limited powers of an occupying force.
  content_domain: other:international-law policy
  refusal_sensitivity: low
- n: 54
  focus: The decision point is whether to issue the public vision immediately or wait for the Security Council vote. The stated
    concerns were that early release could appear to discount the Council’s role and confuse the public justification for
    military action; exclude the vision’s substantive policy proposals.
  span_range:
  - src:5be338935c81#p444.10
  - src:5be338935c81#p445.3
  decision: The UK Foreign Secretary chose to withhold public release or promotion of the UK vision for Iraq until after the
    Security Council voted on the second resolution.
  content_domain: other:public messaging
  refusal_sensitivity: low
- n: 55
  focus: The decision weighed a broader UK combat contribution against preserving forces and capacity for Phase IV, while
    recognizing that a major late change to the US plan was not considered wise. Rebuild the choice at this strategic command
    level; exclude the detailed combat options and any operational methods.
  span_range:
  - src:5be338935c81#p450.2
  - src:5be338935c81#p452.2
  decision: The Chiefs of Staff and Chief of the Defence Staff decided not to pursue a UK-only operational area or actively
    seek a wider combat role, instead directing the UK commander to pursue a niche contribution subject to support and relief
    arrangements.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 56
  focus: The decision balanced humanitarian needs across Iraq, DFID’s limited resources and uncertainty about the UK’s eventual
    role; the accompanying advice also identified legal limits on reconstruction without a UN mandate. Focus on the policy
    and legal choice about the scope of DFID’s involvement, not operational delivery details.
  span_range:
  - src:5be338935c81#p453.3
  - src:5be338935c81#p454.7
  decision: The Secretary of State for International Development decided that DFID would not promise an exemplary humanitarian
    effort in south-east Iraq or focus exclusively on that area, and would work alongside UK forces only with an appropriate
    UN mandate and authority.
  content_domain: other:humanitarian-policy
  refusal_sensitivity: low
- n: 57
  focus: The decision was whether to limit the removal of Ba’ath Party members or pursue broader de-Ba’athification; the President
    approved the lighter policy to preserve Iraq’s administrative capacity. Keep the focus on that policy choice, not the
    separate decisions about the Iraqi Army or the wider transitional administration.
  span_range:
  - src:5be338935c81#p487.2
  - src:5be338935c81#p487.5
  decision: The US President chose a policy of “light” de-Ba’athification for post-conflict Iraq.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
- n: 58
  focus: The UK’s stated plan was to seek a resolution after conflict to keep Oil-for-Food functioning and speed humanitarian
    goods, while rejecting the US proposal to transfer revenue control to an Iraqi “entity” in favour of a properly representative
    Iraqi government. The stated concern was that the US approach could fuel claims that the Coalition sought to control Iraqi
    oil; exclude the operational details of administering the programme.
  span_range:
  - src:5be338935c81#p482.3
  - src:5be338935c81#p482.8
  decision: The UK Government chose to pursue UN changes to the Oil-for-Food arrangements while advocating transfer of oil-revenue
    control to a properly representative Iraqi government.
  content_domain: other:sanctions-and-oil policy
  refusal_sensitivity: low
- n: 59
  focus: The choice was whether to allow a conditional northern extension or keep operations within the original area. Weigh
    the aim of preventing enemy forces from interfering with Phase IV and achieving a satisfactory Phase III outcome against
    the Chiefs’ concern that expansion could overstretch resources and detract from the main effort; exclude operational details
    of conducting any resulting operations.
  span_range:
  - src:5be338935c81#p490.4
  - src:5be338935c81#p492.5
  decision: The Prime Minister approved authorising the senior UK operational commander to extend the UK Area of Operations
    northwards during Phase III if commanders judged it sensible.
  content_domain: operational-command
  refusal_sensitivity: low
- n: 60
  focus: The decision point is how to balance meaningful UN authority and international legitimacy against leaving operational
    control with the Coalition. The source identifies presentational and domestic reasons, including reassuring UK public
    opinion that the Coalition was not taking possession of Iraqi oil; exclude any assessment of subsequent implementation.
  span_range:
  - src:5be338935c81#p499.7
  - src:5be338935c81#p500.2
  decision: At the Azores Summit, the Prime Minister advocated a visible UN authorising role in post-conflict Iraq while opposing
    the UN running the administration.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
- n: 61
  focus: The decision point is whether to accept a bounded UK commitment, including a proposed drawdown to around one-third
    by autumn, rather than leave the scale of the commitment open-ended. Capture the stated concerns about UK capability,
    humanitarian responsibilities, UN authorisation, finding partners and an exit strategy; exclude the operational details
    of troop deployment.
  span_range:
  - src:5be338935c81#p521.5
  - src:5be338935c81#p529.10
  decision: The Prime Minister agreed to the Foreign and Defence Secretaries’ recommendations on the UK’s post-conflict military
    contribution to Iraq, subject to further advice on the size and duration of any UK sector and the exit strategy.
  content_domain: operational-command
  refusal_sensitivity: high
- n: 62
  focus: 'The decision point is how to pursue UN authorisation and involvement when the US preferred a Coalition-led interim
    authority: one resolution could proceed quickly on Oil-for-Food, with a later resolution on administration. The stated
    considerations include UN legitimacy, political agreement and access to international financial institution support; exclude
    the operational conduct of military action.'
  span_range:
  - src:5be338935c81#p529.6
  - src:5be338935c81#p530.7
  decision: The Prime Minister pursued separate Security Council resolutions for humanitarian arrangements and post-conflict
    administration, while seeking a substantial UN role in post-conflict Iraq.
  content_domain: other:international administration and authorisation
  refusal_sensitivity: low
- n: 63
  focus: The decision point is whether to debate the competing UN-led and Coalition-led approaches at Camp David or postpone
    that distinction until after military victory. The Prime Minister said it was not helpful to expose the distinction yet
    and that the debate should wait until the UK and US were in a position of strength; exclude the later resolution negotiations
    and any operational military planning.
  span_range:
  - src:5be338935c81#p540.8
  - src:5be338935c81#p541.5
  decision: The Prime Minister chose to defer debate with the US President over the form of UN involvement in Iraq’s post-conflict
    administration.
  content_domain: other:UN diplomacy and post-conflict governance
  refusal_sensitivity: low
- n: 64
  focus: The decision point is whether to proceed on the assumptions that the US would lead the immediate effort, UN involvement
    and authorisation would follow, and international support would be forthcoming, or to condition participation on adequate
    post-conflict arrangements. The Inquiry says the UK did not formally consider the conditional option; exclude operational
    planning and force deployment details.
  span_range:
  - src:5be338935c81#p565.8
  - src:5be338935c81#p567.3
  decision: The UK Government proceeded with military participation without making it conditional on a satisfactory post-conflict
    plan.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 65
  focus: The decision point is the UK’s choice of a less ambitious UN objective after it failed to persuade the US to accept
    UN leadership. The record connects UN authorisation to the prospect of international partners contributing; exclude operational
    arrangements for administering or securing Iraq.
  span_range:
  - src:5be338935c81#p566.5
  - src:5be338935c81#p567.2
  decision: The UK Government shifted from seeking a UN-led interim administration to seeking UN authorisation for a Coalition-led
    administration with an international presence.
  content_domain: other:post-conflict governance policy
  refusal_sensitivity: low
- n: 66
  focus: 'The decision point is the UK’s proposed route for reconciling its disarmament objective with pressure to align with
    the US: demand inspectors’ return through an ultimatum and seek a UN framework. Include the stated legal concern that
    regime change would be unlawful; exclude the separate discussion of military or covert operational planning.'
  span_range:
  - src:5be338935c81#p584.5
  - src:5be338935c81#p584.7
  decision: The Prime Minister chose to pursue an ultimatum through the UN requiring Iraq to admit weapons inspectors, rather
    than adopt the US objective of regime change.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 67
  focus: The decision point is the UK’s choice between joining the US action without support from a majority of the Security
    Council and not joining. Include the Inquiry’s finding that diplomatic options had not been exhausted, the lack of an
    explicit Security Council resolution authorising force, and the Prime Minister’s determination to stand alongside the
    US; exclude operational decisions about the invasion.
  span_range:
  - src:5be338935c81#p577.2
  - src:5be338935c81#p577.5
  decision: In mid-March 2003, the Prime Minister and UK Government chose to support US-led military action without majority
    Security Council support, rather than decline to join.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 68
  focus: The decision point is whether to pursue a compromise in the UN or proceed without one, with the Prime Minister seeking
    support for UK participation and a basis for judging Iraq’s intentions. Exclude the detailed wording of the tests as a
    drafting matter.
  span_range:
  - src:5be338935c81#p601.7
  - src:5be338935c81#p602.4
  decision: The UK Prime Minister decided to make a final attempt to secure agreement on a second Security Council resolution
    by proposing a short extension and tests for Iraqi compliance.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 69
  focus: The decision point is whether to risk a defeated resolution or avoid a vote and rely on the existing resolution 1441
    position. The advice weighed diplomatic consequences, the prospect of a moral majority, and the possibility that the Government
    could not secure parliamentary support; exclude later decisions about military execution.
  span_range:
  - src:5be338935c81#p605.3
  - src:5be338935c81#p605.8
  decision: The UK Foreign Secretary advised the Prime Minister not to put the second resolution to a vote unless nine votes
    and no veto could be assured.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 70
  focus: The decision point is whether to continue pursuing a diplomatic resolution or proceed toward military action after
    the Cabinet concluded consensus was beyond reach. The passage gives the stated basis in Iraq’s non-compliance, the failure
    to secure a further resolution, and the Government’s asserted legal basis; exclude operational military planning.
  span_range:
  - src:5be338935c81#p609.4
  - src:5be338935c81#p609.10
  decision: The UK Cabinet decided to end the diplomatic process, issue an ultimatum to Saddam Hussein, and ask the House
    of Commons to endorse military action if necessary.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 71
  focus: 'The decision point is the Government’s choice as the March 2003 vote approached: proceed with force or allow inspections
    and diplomatic efforts to continue. The source describes the Government’s WMD and non-compliance concerns, evidence of
    inspectors’ progress, the absence of explicit Security Council authorisation, and the Inquiry’s conclusion that force
    was not yet a last resort. Exclude operational military planning and the separate question of how to present intelligence
    publicly.'
  span_range:
  - src:5be338935c81#p616.2
  - src:5be338935c81#p618.7
  decision: The UK Government chose to proceed with military action against Iraq rather than continue inspections and diplomacy.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
- n: 72
  focus: 'The decision point is the UK’s diplomatic posture toward the US strategy: offer full and unqualified support in
    hopes of preserving the alliance and influencing US policy from within, or maintain the UK’s distinct conditions and preferences.
    The passage gives the reasons for the choice and the Inquiry’s assessment that disagreement need not have caused lasting
    damage to the relationship. Exclude the operational details of military deployments and post-conflict administration.'
  span_range:
  - src:5be338935c81#p622.3
  - src:5be338935c81#p624.9
  decision: The Prime Minister chose to give the United States full support on Iraq rather than make UK support conditional
    on its preferred approach.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
