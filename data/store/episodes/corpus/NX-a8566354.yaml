- n: 1
  focus: The decision point is whether to keep relying primarily on military measures and the legal barriers to return, or
    offer CPT members freedom and assistance to rejoin society. The account says military power could not remain the primary
    focus and describes the amnesty as a way out for insurgents facing intense pressure; exclude operational details of military
    pursuit.
  span_range:
  - src:eac04b146866#p9.9
  - src:eac04b146866#p10.4
  decision: Thai executive and senior security leadership chose to make amnesty and reintegration, rather than military pressure
    alone, central to counterinsurgency policy through Order 66/33.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to continue party-to-party support for the CPT or end it in favor of state-to-state
    relations with Thailand. The account links the change to China’s need for Thai support concerning Cambodia and Vietnam;
    exclude technical details about the radio broadcasts.
  span_range:
  - src:eac04b146866#p8.3
  - src:eac04b146866#p8.8
  decision: Chinese leadership chose to end support for the Communist Party of Thailand and prioritize relations with Thailand.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
