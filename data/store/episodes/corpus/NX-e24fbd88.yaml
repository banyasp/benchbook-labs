episodes:
- n: 1
  focus: In January 1945, the military members had to produce an acceptable alternative to the Donovan proposal after the
    competing plans remained deadlocked. The passage gives their reasons for yielding and the control they required; exclude
    operational methods associated with the agency’s functions.
  span_range:
  - src:cd2e4b206655#p9.1
  - src:cd2e4b206655#p9.3
  decision: The military members of the Joint Intelligence Committee accepted a new central intelligence agency subject to
    National Intelligence Authority control.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The President reviewed competing organizational plans and favored the JCS plan, judging it simpler and more coherent
    than the State plan. The passage also notes that he delayed implementation for further analysis; exclude the later conduct
    of intelligence operations.
  span_range:
  - src:cd2e4b206655#p16.4
  - src:cd2e4b206655#p17.1
  decision: The President favored the Joint Chiefs of Staff plan over the State Department plan for organizing postwar intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: During consideration of the 1947 bill, members rejected relying on a brief reference to the President’s earlier directive
    and insisted on spelling out what the agency could and could not do. Their concerns included fears of unchecked presidential
    power, a domestic ‘Gestapo,’ and interference with FBI work; exclude details of intelligence operations.
  span_range:
  - src:cd2e4b206655#p20.3
  - src:cd2e4b206655#p21.2
  decision: Congress required the intelligence agency’s functions and limitations to be specified in law rather than left
    to a presidential directive.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
