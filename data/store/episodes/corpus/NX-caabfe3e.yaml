episodes:
- n: 1
  focus: The decision point is the legislative choice between a separate appropriation, which could have enabled cross-department
    budget influence, and the apportionment approach adopted in IRTPA. Include the concern that a separate appropriation would
    require declassifying the intelligence budget top-line and the stated aim of achieving similar management benefits without
    it; exclude broader descriptions of budget authorities.
  span_range:
  - src:1d6dd518c2a2#p4.6
  - src:1d6dd518c2a2#p5.3
  decision: IRTPA drafters chose to direct OMB to apportion intelligence funds at the DNI’s exclusive direction rather than
    create a separate intelligence appropriation.
  content_domain: other:intelligence-budget-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to continue relying on NIP funding despite the legal view that it could not support
    domestic-terrorism work without a foreign nexus, or create a non-NIP budget structure. The stated purposes included supporting
    departmental work and integrating DHS intelligence components; exclude the details of any collection activity.
  span_range:
  - src:1d6dd518c2a2#p7.3
  - src:1d6dd518c2a2#p7.5
  decision: The DHS under secretary for intelligence and analysis chose to create a non-NIP-funded Homeland Security Intelligence
    Program for departmental intelligence work.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
