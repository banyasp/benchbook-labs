episodes:
- n: 1
  focus: The decision followed a review of imagery provided to Israel, which showed that Israeli officials had obtained information
    about countries well beyond Israel’s borders despite the U.S. policy limiting access to imagery of potential direct threats.
    The available options included continuing broader access or imposing geographic limits; exclude the operational details
    of imagery collection or its use.
  span_range:
  - src:558a3672e970#p1.54
  - src:558a3672e970#p1.59
  decision: The Deputy Director of Central Intelligence restricts Israel’s access to U.S. satellite imagery to areas within
    250 miles of Israel, with other requests subject to case-by-case approval.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision followed repeated difficulties obtaining satellite intelligence from the United States and the refusal
    of Israeli requests for an independent system or unfettered access. The passage gives the stated reason as the importance
    of warning capabilities to Israel’s survival and the need for an independent capability; exclude technical design, construction,
    and launch details.
  span_range:
  - src:558a3672e970#p1.87
  - src:558a3672e970#p1.99
  decision: Israeli officials commit to developing an independent space program and reconnaissance satellite rather than relying
    on U.S. satellite intelligence.
  content_domain: other:intelligence-capability policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
