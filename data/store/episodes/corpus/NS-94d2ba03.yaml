- n: 61
  focus: The choice was between relying on the ISC and establishing a separate independent inquiry. The Government argued
    that the ISC could examine the JIC assessments, interview those who prepared them, and publish a report; it also argued
    that two inquiries should not compete. Exclude the underlying merits of the intelligence and the separate Foreign Affairs
    Committee inquiry.
  span_range:
  - src:672869b44d92#p480.4
  - src:672869b44d92#p482.9
