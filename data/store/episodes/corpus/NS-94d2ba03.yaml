  focus: The decision point is whether to establish a new comprehensive judicial inquiry or rely on existing parliamentary
    inquiries. The adopted amendment cited the ISC and Foreign Affairs Committee inquiries and the substantial evidence already
    provided; exclude the wider merits of the war decision.
  span_range:
  - src:672869b44d92#p535.3
  - src:672869b44d92#p535.6
