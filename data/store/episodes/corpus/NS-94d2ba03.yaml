  focus: The decision point is whether to publish the report openly, publish a summary, or keep the full report classified,
    and how to coordinate its release with allies. The stated concerns were that an unclassified report would expose limits
    in knowledge, deter sources, and fuel political scepticism; exclude operational details of the WMD search.
  span_range:
  - src:672869b44d92#p519.8
  - src:672869b44d92#p522.4
