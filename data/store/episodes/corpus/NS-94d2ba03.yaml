  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 79
  focus: The report describes the US government rejecting the report author’s proposed disclaimer and issuing a government/congressional
    version alongside an online version with US names excised. The stated legal constraint was that an official CIA report
    could not name US individuals or entities; the UK considered the approach preferable to removing only US and UK names.
    Exclude the underlying procurement allegations and any inference of guilt from a company being named.
  span_range:
  - src:672869b44d92#p598.11
  - src:672869b44d92#p599.2
  decision: The US government chose to publish an online version of the ISG report with references to US companies and individuals
    removed, rather than rely on a disclaimer or publish the same text in both versions.
  content_domain: other:report publication policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 80
  focus: The decision point is whether to continue relying on existing reviews or establish an additional independent inquiry;
    the Prime Minister chose the latter after it became untenable to resist one once the US President had decided to create
    a commission. Include the stated context that the Government had previously relied on the ISC, FAC and Hutton reviews;
    exclude the reviews’ substantive findings.
  span_range:
  - src:672869b44d92#p611.12
  - src:672869b44d92#p612.6
  decision: The Prime Minister agreed to establish a Privy Council review of intelligence on WMD, with broader terms than
    the existing Iraq-focused review.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 81
  focus: The decision point is the choice of public framing after the failure to find enough WMD and the deterioration of
    security in Iraq; the Prime Minister’s stated strategy was to focus the public on the broader threat and global agenda.
    Assess the choice and its stated rationale, not the truth of the underlying intelligence claims or military operations.
  span_range:
  - src:672869b44d92#p611.3
  - src:672869b44d92#p611.4
  decision: The Prime Minister chose to redirect public discussion of Iraq from the failure to find sufficient WMD to the
    broader counter-proliferation agenda.
