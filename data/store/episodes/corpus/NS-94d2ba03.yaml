  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 74
  focus: The passage describes a choice between sanitizing the full report and preparing a short summary, followed by the
    decision to focus on the summary. The stated concern was protecting operationally sensitive investigative information;
    exclude the underlying investigative methods and the merits of the report’s WMD assessments.
  span_range:
  - src:672869b44d92#p572.9
  - src:672869b44d92#p573.4
