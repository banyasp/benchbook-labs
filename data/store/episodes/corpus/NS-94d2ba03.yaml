  focus: The choice was whether to divert resources from the ongoing ISG operation and report lessons immediately, or defer
    a full account. The stated reasons were that the process was incomplete and the Government lacked access to UNMOVIC records;
    exclude the earlier, separate lessons from weapons inspections since 1991.
  span_range:
  - src:672869b44d92#p539.4
  - src:672869b44d92#p539.9
