  focus: The decision point is whether to make WMD investigation an immediate priority or subordinate it to stabilising Iraq
    and addressing humanitarian needs. The Prime Minister stated that it was third and could take time; exclude operational
    decisions about how to conduct the search.
  span_range:
  - src:672869b44d92#p457.11
  - src:672869b44d92#p459.9
  decision: The Prime Minister set the Coalition’s priorities for post-conflict Iraq, placing the WMD investigation after
