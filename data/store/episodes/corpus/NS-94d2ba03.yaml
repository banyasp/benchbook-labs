  focus: The decision followed the publication of the Hutton Report, evidence from the former head of the Iraq Survey Group,
    and a delay to the Group’s final report. Focus on the Government’s choice to establish the inquiry and those stated reasons;
    exclude the inquiry’s later findings and general arguments about public understanding of intelligence.
  span_range:
  - src:672869b44d92#p560.3
