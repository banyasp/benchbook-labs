    Report.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 75
  focus: The choice was whether to seek additional publicity or refrain from doing so after the testimony received little
    coverage. The adviser cited changed circumstances and the likelihood that further coverage would be negative, particularly
    given the security situation; exclude the report’s substantive findings.
  span_range:
  - src:672869b44d92#p578.3
  - src:672869b44d92#p578.7
  decision: The Prime Minister’s senior adviser recommended not publicizing the ISG testimony further at that time.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 76
  focus: The Prime Minister objected to a conclusion of strategic intent but no WMD if the ISG had been unable to search adequately,
    and said WMD should remain an open issue; No.10 then asked for advice on how to get that result. Treat the decision as
    seeking advice on the report’s framing, not as proof that the ISG’s findings were changed. Exclude operational search
    methods and the merits of the underlying WMD estimates.
  span_range:
  - src:672869b44d92#p581.4
  - src:672869b44d92#p581.8
  decision: No.10 officials sought JIC/MOD advice on how to obtain the Prime Minister’s preferred treatment of the ISG’s WMD
    findings.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 77
  focus: The FCO advised that post-30 June internment required imperative security reasons or criminal activity, and that
    intelligence exploitation alone was insufficient; the UK element then withdrew from debriefing while discussions continued.
    Focus on the UK’s legal authority and participation decision, not on how debriefings were conducted. Exclude the ISG’s
    operational capability except as context for the policy trade-off.
  span_range:
  - src:672869b44d92#p584.7
  - src:672869b44d92#p585.4
  decision: The UK government limited UK participation in ISG activity after sovereignty transferred, including withdrawing
