- n: 56
  focus: The choice was whether to press for an immediate inspector return or accept the immediate US position while pursuing
    credible third-party verification and a possible restructured UN role later. Reasons included US concerns about intelligence
    exposure, the need for credibility, the lack of obvious alternative validators, and the practical value of UN bodies in
    destruction and monitoring; exclude the operational details of inspections.
  span_range:
  - src:672869b44d92#p444.6
  - src:672869b44d92#p445.8
