  focus: The decision point is whether to inform the public through a ministerial statement, rather than notify the Intelligence
    and Security Committee alone. The stated context includes the Butler findings and exceptional parliamentary and public
    interest, particularly in the 45-minute intelligence; exclude the substantive merits of the underlying WMD judgments.
  span_range:
  - src:672869b44d92#p404.6
  - src:672869b44d92#p405.2
  decision: The Foreign Secretary decided to announce publicly the withdrawal of two lines of Iraq WMD reporting.
