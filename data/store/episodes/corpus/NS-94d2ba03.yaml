  focus: Treat this as an intelligence estimate choosing among possible locations and the possibility of no use, not as a
    decision to employ force. The stated reasons were the relative weakness of Iraqi forces in the south and their expected
    exposure to the brunt of a Coalition attack; exclude operational details of any possible use.
  span_range:
  - src:672869b44d92#p363.8
  - src:672869b44d92#p364.5
