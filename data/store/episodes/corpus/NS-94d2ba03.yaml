  focus: Treat this as an intelligence-analytic decision about how to characterize limited post-conflict evidence. The JIC
    said the investigation was at an early stage and the evidence did not yet warrant changing prior judgments; exclude the
    underlying search and collection activity.
  span_range:
  - src:672869b44d92#p499.5
