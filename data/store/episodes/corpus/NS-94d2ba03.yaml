  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 53
  focus: The decision point is whether to present the earlier judgments definitively or qualify them given incomplete findings,
    limited intelligence and withdrawn reporting. The resulting review distinguished judgments that were wrong or unsubstantiated
    from those that remained reasonable on the information available at the time; exclude operational decisions about Iraq.
  span_range:
  - src:672869b44d92#p405.3
  - src:672869b44d92#p406.10
  decision: The JIC decided how to qualify its retrospective review of 2002 Iraq WMD judgments in light of later investigations.
