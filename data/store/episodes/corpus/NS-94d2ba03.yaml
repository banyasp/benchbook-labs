- n: 54
  focus: The decision point is whether to reopen the September 2002 baseline judgments as inspections produced no evidence
    of current WMD programmes and UNMOVIC’s Executive Chairman challenged the account of Iraqi obstruction, or to continue
    relying on those judgments. The Inquiry says no review occurred and describes the tendency to attribute failures to find
    weapons to concealment and limitations in UNMOVIC. Exclude the separate question of whether to use military force.
  span_range:
  - src:672869b44d92#p420.5
  - src:672869b44d92#p422.5
  decision: The JIC and the policy community did not formally reassess the Iraq WMD judgments before the March 2003 decision
    on military action.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 55
  focus: The decision was how large a UK contribution to make, balancing support for the US and wider policy objectives against
    domestic CBRN response, force protection and Home Base demands. Exclude the requested follow-up advice on specialist management,
    impartiality and evidence handling as separate procedural matters.
  span_range:
  - src:672869b44d92#p433.4
  - src:672869b44d92#p433.9
