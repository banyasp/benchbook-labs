- n: 50
  focus: The decision point is whether to withdraw reports whose alleged sub-source denied providing the information, even
    though some contents may have been consistent with other reporting. Keep the focus on the reliability judgment and withdrawal,
    not on the later question of which offices received the memorandum.
  span_range:
  - src:672869b44d92#p389.7
  - src:672869b44d92#p389.7
  decision: SIS decided to withdraw the September 2002 reports after the sourcing chain was discredited.
