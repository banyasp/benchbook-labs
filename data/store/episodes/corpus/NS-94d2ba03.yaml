  focus: The choice was to submit the UK assessment as drafted or wait while a difference within the US intelligence community
    was reviewed. The stated reason for holding it was that review; do not recast the decision as a judgment that the trailers
    were or were not a production system.
  span_range:
  - src:672869b44d92#p514.4
  - src:672869b44d92#p514.12
  decision: The Chief of SIS chose to withhold the UK assessment of the possible biological-agent trailers from submission
