  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 72
  focus: The decision point is whether to refer the issue solely to the ISC or establish a separate review, and how broadly
    to set its scope. The record identifies concerns about intelligence accuracy and the need to examine WMD intelligence
    beyond Iraq, alongside US plans for a commission; exclude later arguments about how the Government publicly presented
    the ISG’s findings.
  span_range:
  - src:672869b44d92#p554.8
  - src:672869b44d92#p559.12
  decision: The Prime Minister and Government decided to establish a UK committee, chaired by Lord Butler, to review intelligence
