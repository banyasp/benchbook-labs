- n: 46
  focus: 'The decision was whether to support the impending action or resign and oppose it in Parliament. The source gives
    his reasons: he could not support war without international agreement or domestic support, and he argued that containment
    and inspections had constrained Iraq’s capabilities. Exclude any broader claim that this was the Government’s decision
    on whether to use force.'
  span_range:
  - src:672869b44d92#p375.9
  - src:672869b44d92#p376.3
