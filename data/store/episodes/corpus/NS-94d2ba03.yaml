episodes:
- n: 1
  focus: The decision point is how the JIC characterized the strength of its assessment, particularly its judgement about
    biological activity and mobile production facilities. The passage gives the reported evidence and its limitations; exclude
    operational details about production or facilities. The later Butler review notes that the key judgement was more firmly
    expressed than the analysis supported and that the new reporting had not yet been validated.
  span_range:
  - src:672869b44d92#p17.2
  - src:672869b44d92#p19.10
  decision: The Joint Intelligence Committee chose to assess Iraq as likely continuing biological warfare activity, with its
    key judgement describing the evidence as clear.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the choice of a revised controls framework, against the stated alternative of removing wider
    trade sanctions while retaining controls on dual-use goods. The reasons included concern about Iraq’s WMD activity and
    the aim of securing wider regional support; exclude later operational or intelligence details not bearing on this policy
    choice.
  span_range:
  - src:672869b44d92#p27.5
  - src:672869b44d92#p27.9
  decision: No.10 adopted a revised Iraq-controls policy focused on WMD and military programmes rather than maintaining the
    broader trade-sanctions approach.
  content_domain: other:sanctions policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is the JIC’s strategic assessment of whether military action would substantially constrain the
    programmes or have only limited effects. Its reasons included uncertainty about facility locations and the ability to
    conduct CBW activity in civil facilities; exclude any operational details about selecting or attacking facilities.
  span_range:
  - src:672869b44d92#p31.4
  - src:672869b44d92#p31.5
  decision: The JIC assessed that direct military action against suspected Iraqi WMD facilities would be unlikely to have
    a significant overall effect on Iraq’s WMD programmes.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the JIC’s revised threat assessment following the Prime Minister’s request and the 9/11 attacks.
    The assessment weighed the new benchmark and possible future threats against intelligence about capability, intent, disruption,
    and the likelihood that major attacks would remain infrequent; exclude descriptions of attack methods or operational responses.
  span_range:
  - src:672869b44d92#p41.4
  - src:672869b44d92#p44.6
  decision: The JIC assessed the nature and scale of the UK terrorist threat after 11 September 2001, including the likelihood
    and potential severity of further attacks.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The JIC judged the threat slight except if the regime faced serious and imminent collapse, weighing the absence of
    reliable evidence of intent or transfers against Iraq’s capability and the risk of US retaliation. Focus on this estimative
    judgment and its evidentiary basis; exclude operational questions about carrying out or countering an attack.
  span_range:
  - src:672869b44d92#p47.5
  - src:672869b44d92#p47.10
  decision: The JIC assessed the likelihood of Iraqi WMD terrorism in November 2001.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The JIC chose to say more about Iraq’s WMD aspirations and potential in its final assessment, citing the issue’s
    importance to policy discussions with the US, differing US and UK views on the nuclear timeline, and the need to inform
    ministers. Focus on this choice about analytic scope and briefing; exclude the separate operational implications of the
    capabilities discussed elsewhere in the passage.
  span_range:
  - src:672869b44d92#p52.3
  - src:672869b44d92#p52.4
  decision: The JIC decided to expand its assessment of Iraq’s WMD aspirations and potential in February 2002.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is the shift from an earlier estimate of weeks to days, based on accumulated reporting about mobile
    facilities, a new source, and procurement of growth media. Keep the focus on the evidential basis and uncertainty behind
    the analytic judgment; exclude technical details about biological-agent production.
  span_range:
  - src:672869b44d92#p74.5
  - src:672869b44d92#p74.8
  decision: CIG analysts strengthened the assessment that Iraq could produce significant quantities of biological agents within
    days of a decision.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The choice was between an Iraq-only paper and a paper covering several countries; the stated context was the intense
    public focus on Iraq and concern that the broader draft was trying to do too much. Examine the policy and communication
    choice, not the accuracy of every individual intelligence claim in the paper.
  span_range:
  - src:672869b44d92#p83.13
  - src:672869b44d92#p84.12
  decision: The Foreign Secretary and No.10 chose to make the public WMD paper about Iraq alone, with a broader paper on other
    countries left as a possible later publication.
  content_domain: other:public-information policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 9
  focus: The decision was whether to issue the dossier soon or defer publication; No.10 chose delay, while officials identified
    concerns about the estimates and consistency with US figures. The earlier proposal to publish before Crawford to avoid
    appearing to act at the US President’s prompting is relevant context, but do not treat the dossier’s media tactics as
    operational decisions.
  span_range:
  - src:672869b44d92#p88.2
  - src:672869b44d92#p88.9
  decision: No.10 decided to postpone publication of the Iraq WMD dossier until a decent interval after the Crawford meeting.
  content_domain: other:public-information policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 10
  focus: The decision was whether to retain the earlier figures, use less precise language, or publish revised estimates and
    correct the parliamentary record. The revised figures were judged defensible, and the Foreign Secretary asked for the
    correction and immediate press notice so the Government could not be accused of concealing it. Exclude the separate question
    of when to release the wider dossier.
  span_range:
  - src:672869b44d92#p98.9
  - src:672869b44d92#p101.9
  decision: The Foreign Secretary decides to correct the Government’s public chemical-weapons estimates in Parliament and
    issue an accompanying press notice.
  content_domain: other:public-information policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 11
  focus: The choice was whether to link the dossier’s release to the Goods Review List or keep the publication separate. The
    stated concerns included avoiding an impression of imminent military action, preventing the WMD dossier from eclipsing
    the humanitarian message, and accounting for regional reaction. Exclude operational planning and the substance of any
    military action.
  span_range:
  - src:672869b44d92#p104.3
  - src:672869b44d92#p105.6
  decision: The Foreign Secretary decides to separate publication of the Iraq WMD dossier from action on the Goods Review
    List.
  content_domain: other:public-information policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 12
  focus: The group weighed immediate publication against keeping the drafts ready for a later, carefully judged release. It
    recognized that publication could be taken as a sign that the Government was closer to military action, while a coordinated
    release could increase pressure on Saddam Hussein. Treat this as the group’s recommendation, not as evidence that ministers
    ultimately adopted it.
  span_range:
  - src:672869b44d92#p108.9
  - src:672869b44d92#p109.5
  decision: The inter-departmental group recommends holding the Iraq public documents until an appropriate moment rather than
    issuing them immediately.
  content_domain: other:public-information policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 13
  focus: The choice was whether to publish the paper then or delay and develop a dossier. The source says officials had been
    advised that the evidence would not convince public opinion of an imminent threat; exclude the separate question of whether
    military action was justified.
  span_range:
  - src:672869b44d92#p115.2
  - src:672869b44d92#p115.6
  decision: No.10 decided to postpone publication of the Iraq paper and coordinate a public dossier.
  content_domain: other:government communications policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The decision was whether to publish the documents then or keep them on hold while remaining ready to act if circumstances
    changed. The recorded concern was that publication could make it look as though the Government was going to war; exclude
    any assessment of the merits of military action itself.
  span_range:
  - src:672869b44d92#p112.5
  - src:672869b44d92#p112.11
  decision: No.10 officials decided to hold the Iraq public documents rather than publish them in July 2002.
  content_domain: other:government communications policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: The choice was whether to strengthen public lines and develop a contingent information strategy or drop the proposals
    for the time being. The source records that No.10 was not enthusiastic and that the proposal would be dropped unless the
    MOD offered further arguments; exclude the operational details of any prospective military campaign.
  span_range:
  - src:672869b44d92#p129.2
  - src:672869b44d92#p129.10
  decision: No.10 decided not to pursue the proposed public messaging and information strategy in early August 2002.
  content_domain: other:government communications policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The decision was whether to wait until key decisions had been taken or publish earlier; the Prime Minister chose
    earlier publication to explain the Government’s concerns amid renewed urgency and public debate. Keep the focus on the
    decision to disclose and its stated rationale, not on whether the underlying intelligence claims were correct or on the
    separate decision about military action.
  span_range:
  - src:672869b44d92#p143.9
  - src:672869b44d92#p146.9
  decision: The Prime Minister decided to bring forward publication of the Iraq dossier.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The decision point is the JIC’s August 2002 estimative judgment about Iraqi intentions in the stated scenario of
    a US-led conflict, despite little intelligence on CBW doctrine or activity. Examine the judgment, its evidential limits,
    and the precautionary assumptions; exclude operational details about attacks or weapon employment.
  span_range:
  - src:672869b44d92#p136.2
  - src:672869b44d92#p138.6
  decision: The JIC decided to assess that Saddam Hussein would order missile attacks and likely use CBW in a conflict.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The choice was whether to add facility-specific examples to make the public paper more compelling despite caveats
    that some conclusions rested on inference. The passage also records a concern that naming sites could let Iraq undermine
    the dossier’s impact; treat this as a draft-content decision, not proof that every example appeared in the final publication.
  span_range:
  - src:672869b44d92#p133.8
  - src:672869b44d92#p135.4
  decision: The Assessments Staff, led by the JIC Chairman, decided to include examples of suspicious facilities in the draft
    public dossier.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The account describes competing views about who should write the dossier and the eventual assignment to the JIC Chairman
    and Assessments Staff. The stated reason was that the dossier’s credibility depended on it being, and being seen to be,
    the work of the intelligence assessment team; exclude the separate question of whether military action against Iraq was
    justified.
  span_range:
  - src:672869b44d92#p157.6
  - src:672869b44d92#p174.5
  decision: No.10 decides that the JIC Chairman and Assessments Staff will produce the Iraq dossier rather than No.10 or the
    Foreign Office.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The JIC consciously distinguished caveats in the body of the paper from the firmer key judgments it wanted Ministers
    to receive. The stated basis was the committee’s view of the intelligence and its assessment of Saddam’s intent; the Inquiry
    also records that much of the evidence was limited or inferential. Exclude the operational scenarios for how weapons might
    be used.
  span_range:
  - src:672869b44d92#p167.9
  - src:672869b44d92#p168.2
  decision: The JIC decides to state firmly that Iraq has chemical and biological weapons capability and that Saddam is prepared
    to use it, rather than preserve the more caveated wording.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: At Camp David, the Prime Minister stated that the UK would publish a dossier and that the US and UK needed to persuade
    the international community and explain the case to public opinion. The reasons given included addressing public uncertainty
    about the threat and explaining why action was being considered then; exclude any assessment of the dossier’s later accuracy
    or the decision to use force itself.
  span_range:
  - src:672869b44d92#p159.9
  - src:672869b44d92#p160.7
  decision: The Prime Minister decides that the UK will publish a dossier and make a public case about the threat from Iraq.
  content_domain: other:public-communications-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: The decision was to put the intelligence-based document under the JIC Chairman’s control, rather than the OD Secretariat’s.
    Focus on the claimed need for clear ownership and for the published account to represent the JIC’s assessment; exclude
    later disputes about particular claims in the dossier.
  span_range:
  - src:672869b44d92#p176.2
  - src:672869b44d92#p176.11
  decision: The JIC Chairman decides that the JIC, rather than the OD Secretariat, will own and direct the dossier.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 23
  focus: The choice was between quoting identified assessments and describing the Committee’s key judgements without direct
    quotations. The stated reason was to avoid setting an unhelpful precedent; exclude broader decisions about the dossier’s
    tone or substantive claims.
  span_range:
  - src:672869b44d92#p181.8
  - src:672869b44d92#p182.2
  decision: The JIC decides not to quote directly from specific or identified JIC assessments in the public dossier.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 24
  focus: The choice was between wider circulation and limited distribution; the report was restricted to named senior officials
    because of source-protection concerns, and the SIS head personally approved the distribution. Focus on the authority and
    competing interests involved in dissemination; exclude the report’s operational details.
  span_range:
  - src:672869b44d92#p194.7
  - src:672869b44d92#p196.9
  decision: The SIS head decides to restrict distribution of a high-impact intelligence report to named senior officials.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 25
  focus: The choice was to issue a potentially important report during a crisis or hold it back; the SIS chief said it could
    not be sat on and that a ministerial inquiry was likely. The source was developmental and unproven, and the reporting
    later materially affected dossier judgments. Exclude operational details about the source or sourcing chain.
  span_range:
  - src:672869b44d92#p198.4
  - src:672869b44d92#p199.3
  decision: SIS leadership decided whether to issue the 11 September intelligence report despite the new source being unproven.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 26
  focus: The stated strategic choice was to disclose intelligence to support renewed inspections, not to claim Iraq was about
    to launch a strike. The Prime Minister said the call to disclose intelligence and the persuasive JIC advice informed this
    approach. Exclude later decisions about military action not described in this passage.
  span_range:
  - src:672869b44d92#p201.2
  - src:672869b44d92#p201.5
  decision: The Prime Minister chose to present the dossier as a case for returning to a tough inspection regime, rather than
    as an immediate justification for conflict.
  content_domain: other:public intelligence disclosure
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 27
  focus: The Prime Minister’s office suggested clearer wording for nuclear timelines, while the JIC chairman reported that
    the timelines would not change because they summarized the JIC position. This is a decision about preserving an intelligence
    assessment amid requests to revise its presentation; exclude technical details about nuclear weapons.
  span_range:
  - src:672869b44d92#p205.5
  - src:672869b44d92#p208.8
  decision: The JIC chairman chose to retain the JIC nuclear-weapons timelines in the dossier rather than adopt the Prime
    Minister’s suggested changes.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 28
  focus: 'This is a specific drafting judgment: retain or remove the condition. The stated reasons were the absence of a standing
    JIC assessment defining the posture as defensive or offensive and recent reporting that placed the importance of these
    weapons in a broader regional context. Exclude any assessment of operational use of the weapons.'
  span_range:
  - src:672869b44d92#p219.10
  - src:672869b44d92#p220.3
  decision: The JIC chair and Assessment Staff decided to remove the qualification that Saddam Hussein might use chemical
    and biological weapons only if his regime was under threat.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 29
  focus: 'The decision point is whether to adopt political-office drafting suggestions or preserve the JIC’s evidentiary standard.
    The inquiry account gives the stated reason for accepting or rejecting changes: consistency with available intelligence.
    Exclude the broader question of whether the dossier should support any particular policy direction.'
  span_range:
  - src:672869b44d92#p231.5
  - src:672869b44d92#p231.7
  decision: The JIC chair accepted Downing Street’s proposed dossier wording changes only where they were consistent with
    the intelligence available to the JIC, and rejected inconsistent suggestions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 30
  focus: The decision point is whether to escalate the written reservations or leave the wording undisturbed. The official’s
    stated reasons were that the issues had already been considered with the Cabinet Office or were within the general thrust
    of known intelligence. Exclude the underlying details of the weapons assessments except as context for why the reservations
    mattered.
  span_range:
  - src:672869b44d92#p234.5
  - src:672869b44d92#p237.9
  decision: The senior Defence Intelligence Staff official decided not to raise the remaining staff reservations about the
    dossier with the JIC chair.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 31
  focus: The decision was whether to present the claim as a judgement or qualify it as something intelligence merely suggested.
    The chair said the wording reflected the assessment and intelligence, and that the Executive Summary expressed a judgement;
    exclude the underlying intelligence-collection methods.
  span_range:
  - src:672869b44d92#p239.3
  - src:672869b44d92#p239.8
  decision: The JIC assessment chair chose to strengthen the dossier’s 45-minute claim rather than adopt the DIS’s proposed
    qualification.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 32
  focus: The decision concerned balancing protection of a new, sensitive source against expert assessment of the reports’
    credibility and significance. The Inquiry and Butler Review found that expert access should have been arranged; exclude
    any operational details about sources or intelligence collection.
  span_range:
  - src:672869b44d92#p246.3
  - src:672869b44d92#p247.6
  decision: Senior SIS leadership chose to restrict circulation of the September intelligence reports rather than provide
    access to relevant DIS experts.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 33
  focus: The decision was whether to escalate the expert’s concern or leave consideration to those responsible for the final
    dossier judgement. The manager cited the late stage of production, the limited scope for editorial changes, and an assumption
    that the final decision-makers had access to the new intelligence; exclude operational intelligence details.
  span_range:
  - src:672869b44d92#p243.2
  - src:672869b44d92#p243.6
  decision: A DIS senior manager chose to take no further action after a chemical-warfare expert raised doubts about resumed
    production.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 34
  focus: The decision was between pressing for compliance through the UN with force as leverage, accepting continued non-compliance,
    or taking military action without first pursuing that process. The stated reasons included Iraq’s long record of rejecting
    disarmament demands, the perceived future threat, and the need for international resolve; exclude operational military
    planning.
  span_range:
  - src:672869b44d92#p276.3
  - src:672869b44d92#p277.3
  decision: The Prime Minister chose to pursue Iraqi disarmament through a renewed UN process, backed by genuine preparedness
    to use force if diplomacy failed.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 35
  focus: 'The decision point is how strongly to characterize intelligence publicly: use categorical claims or qualify them
    to reflect gaps and uncertainty. The Prime Minister said the statement was intended to explain the government’s concerns
    and relied on JIC assessments and briefings, while the Inquiry concluded that some characterizations exceeded what the
    intelligence supported; exclude the underlying intelligence-collection methods.'
  span_range:
  - src:672869b44d92#p273.7
  - src:672869b44d92#p280.3
  decision: The Prime Minister chose to present the intelligence case to Parliament in categorical terms, including describing
    the intelligence picture as “extensive, detailed and authoritative.”
  content_domain: other:public intelligence communication
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 36
  focus: The report says Ministers had previously considered publication premature until the policy was clearer, but the Government
    announced publication amid intense speculation that military force had already been decided. The dossier was intended
    to make the case for urgent action and secure Parliamentary and public support; exclude the underlying merits of the Iraq
    WMD assessments.
  span_range:
  - src:672869b44d92#p284.9
  - src:672869b44d92#p285.5
  decision: The UK Government decides to announce publication of the Iraq dossier on 3 September 2002 rather than continue
    to defer publication.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 37
  focus: The Government intended the dossier’s assessments to carry the JIC’s authority with Parliament and the public, although
    the document also advocated urgent action. The report identifies the tension between independent assessment and policy
    advocacy; exclude particular WMD claims and operational or military planning.
  span_range:
  - src:672869b44d92#p283.9
  - src:672869b44d92#p285.12
  decision: The UK Government decides to present the dossier as a product of the JIC while using it to make the case for policy
    action.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 38
  focus: The review of Iraq’s rebuttal was described as finding it weak and not credible in key areas, and the Chief of the
    Assessments Staff concluded that no fuller reply was needed. The report notes that the press lines did not address Iraq’s
    explicit denials and that the risks of a detailed rebuttal being tested by inspections were not considered; exclude the
    truth of individual WMD allegations.
  span_range:
  - src:672869b44d92#p296.3
  - src:672869b44d92#p297.5
  decision: The Chief of the Assessments Staff decides that the Government need not issue a fuller reply to Iraq’s rebuttal
    of the dossier.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 39
  focus: The decision point is whether to treat Iraq’s announcement of unconditional compliance as sufficient reassurance
    or continue coercive pressure. The UK chose scepticism and maintained the threat of force, citing Iraq’s history of deceit
    and the need to judge its actions rather than its words; exclude any assessment of whether force was legally justified
    or operationally planned.
  span_range:
  - src:672869b44d92#p306.6
  - src:672869b44d92#p306.9
  decision: The UK Government chose to remain sceptical of Iraq’s compliance and maintain the threat of military force.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 40
  focus: The decision point is whether to commit to military action on the basis of the declaration and existing case, or
    continue preparations while seeking a convincing evidentiary basis and maintaining the option of a further UN resolution.
    The Prime Minister said the declaration needed proof and preparations should continue; an intelligence chief reported
    that the Government would need clear evidence beyond an audit to commit. Exclude the operational means proposed for obtaining
    evidence.
  span_range:
  - src:672869b44d92#p314.3
  - src:672869b44d92#p315.12
  decision: The Prime Minister and UK Government chose to continue military preparations while withholding commitment to military
    action pending stronger evidence of Iraqi non-compliance.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 41
  focus: 'The decision point is the Prime Minister’s stated threshold for moving from inspections to force: wait for inspectors
    to assess cooperation, but do not require them to find WMD if Iraq fails to cooperate. Include the stated rationale about
    outstanding weapons information, concealment and compliance; exclude operational military planning and the separate question
    of how inspections should be conducted.'
  span_range:
  - src:672869b44d92#p328.5
  - src:672869b44d92#p332.9
  decision: The Prime Minister decided that Iraq should be given time for inspections to establish whether it was cooperating,
    while treating failure to cooperate as sufficient grounds for military action even without a discovery of WMD.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 42
  focus: The decision point is whether and how to publish a media briefing intended to explain Iraq’s concealment and obstruction,
    including the choice to use material from a published article without attribution and to release the paper publicly. Include
    the stated communications purpose and the reported provenance and oversight concerns; exclude the underlying intelligence-collection
    methods and later general guidance as a separate decision.
