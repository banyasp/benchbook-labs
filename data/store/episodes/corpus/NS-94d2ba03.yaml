- n: 48
  focus: The decision was whether to broaden circulation, keep the reports restricted, or withdraw them while the sourcing
    chain was in doubt and direct verification remained unavailable. SIS reissued them, citing reduced source-protection sensitivity,
    collateral reporting, and no present reason to dismiss the material, while adding caveats about verification and a notable
    similarity to a fictional depiction. Exclude any operational source-handling details.
  span_range:
  - src:672869b44d92#p385.11
  - src:672869b44d92#p387.7
