- n: 57
  focus: The decision was whether and how substantially the UK should support the US-led ISG, including assigning existing
    personnel and pursuing additional expertise. The advice cites the ISG’s role as the main detection vehicle, the urgent
    priority attached to WMD, the need to redirect resources, and the value of third-party validation and coordinated public
    handling; exclude the teams’ collection or exploitation methods.
  span_range:
  - src:672869b44d92#p450.3
