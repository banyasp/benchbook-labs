- n: 47
  focus: The decision point is whether to retain or revise the capability assessment in light of reports that weapons were
    disassembled, deployment intelligence was sparse or inconsistent, and Iraq might lack suitable missile warheads. The JIC
    recorded its judgment after revisiting the issue; the account says the reports were interpreted in the context of assessed
    concealment and dispersal. Exclude operational details about weapons or their use.
  span_range:
  - src:672869b44d92#p380.2
  - src:672869b44d92#p382.4
  decision: The JIC chose to assess that Iraq retained a usable chemical and biological warfare capability after reconsidering
    recent reporting.
