- n: 60
  focus: The decision point is whether to provide government assistance to the programme or leave it without that support,
    and how to do so without hijacking it. The stated rationale was that assistance could help the programme assess evidence
    and avoid taking detainee denials at face value, while independent advice and the programme’s overall independence should
    be maintained.
  span_range:
  - src:672869b44d92#p468.5
  - src:672869b44d92#p469.5
