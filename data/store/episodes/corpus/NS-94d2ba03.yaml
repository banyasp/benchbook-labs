  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 49
  focus: The decision was whether to withdraw the reports or leave them in circulation after the sub-source denied providing
    the information and SIS concluded its source had lied. SIS moved to notify recipients and withdraw the reporting, despite
    concern that withdrawal could damage confidence in other chemical-weapons reporting. Exclude any source-protection or
    collection methods.
  span_range:
  - src:672869b44d92#p388.5
  - src:672869b44d92#p389.5
  decision: SIS officials chose to withdraw the reports after concluding that the source had fabricated the information.
