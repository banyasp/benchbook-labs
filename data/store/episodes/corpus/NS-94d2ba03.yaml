  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 78
  focus: The Prime Minister’s stated handling was to treat the absence of found stockpiles as “yesterday’s story” and encourage
    focus on new material; he also said the presentation should address the whole story, including sanctions’ failure and
    Saddam’s intent to rebuild capability. Treat this as a public-communications decision, not as a decision about the report’s
    analytic conclusions. Exclude judgments about whether those claims were accurate.
  span_range:
  - src:672869b44d92#p599.4
  - src:672869b44d92#p599.8
  decision: The Prime Minister chose to present the ISG report by emphasizing strategic intent, concealment and sanctions
    failure rather than the failure to find WMD stockpiles.
