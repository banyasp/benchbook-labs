- n: 44
  focus: 'Frame the decision point as an evidentiary judgment: presume continued possession or leave the status unresolved.
    The stated rationale was Iraq’s history of possession and the absence of evidence that the weapons had been destroyed,
    with danger to regional and national security as the consequence; exclude any later decision on military action.'
  span_range:
  - src:672869b44d92#p357.7
  - src:672869b44d92#p357.8
  decision: The Foreign Secretary stated in the Security Council’s private discussion on 14 February that, absent evidence
