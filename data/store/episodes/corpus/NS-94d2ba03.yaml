  focus: 'The decision was to create a two-track structure rather than leave coordination to existing arrangements: the JIC
    Sub-Committee would address strategic, parliamentary and media issues, while the Task Force focused on the ISG and information
    flows. The passage gives the rationale of managing a complicated government response and avoiding overlap. Exclude the
    operational conduct of searches or intelligence collection.'
  span_range:
  - src:672869b44d92#p487.3
