- n: 59
  focus: The decision point is whether the Coalition should rely on its own findings or support UN involvement in validation.
    The stated reasons include credibility with the Security Council and media, consistency with the role previously given
    to UNMOVIC, and maintaining the moral high ground; exclude the operational conduct of inspections.
  span_range:
  - src:672869b44d92#p458.3
