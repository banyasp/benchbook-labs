  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 69
  focus: The decision point is whether to respond to the ISC report immediately or defer the formal response until the Hutton
    Inquiry concluded. The report records advice to delay and that the Government response was sent in February 2004; exclude
    the substance of the ISC’s findings on intelligence presentation.
  span_range:
  - src:672869b44d92#p523.7
  - src:672869b44d92#p524.2
  decision: The Government delayed its formal response to the ISC report until after the Hutton Inquiry.
