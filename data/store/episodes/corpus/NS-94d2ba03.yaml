- n: 62
  focus: The Prime Minister defended the Coalition’s prioritization when asked whether delay could let weapons reach terrorist
    groups. The stated reason was that reconstruction and the humanitarian position of Iraqis had to come first, and the Coalition
    would have been criticized for doing otherwise. Exclude operational details of any search.
  span_range:
  - src:672869b44d92#p482.3
  - src:672869b44d92#p482.4
