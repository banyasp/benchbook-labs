  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 71
  focus: The decision addressed the Intelligence and Security Committee’s recommendation that formally submitted concerns
    about JIC assessments be brought to the Chairman. The Government’s stated reason for not adopting that requirement was
    the importance of preserving line-management authority; exclude the separate dispute over the merits of particular WMD
    assessments.
  span_range:
  - src:672869b44d92#p551.11
  - src:672869b44d92#p552.5
  decision: The Government decided to preserve JIC members’ line-management discretion rather than require them to refer formally
