    existing oversight was appropriate; exclude the inquiry’s later findings, which are not in this passage.
  span_range:
  - src:672869b44d92#p505.11
  - src:672869b44d92#p506.4
  decision: The House of Commons, on the Government’s position, chose to rely on parliamentary intelligence oversight rather
