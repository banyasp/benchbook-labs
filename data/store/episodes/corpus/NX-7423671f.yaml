episodes:
- n: 1
  focus: The decision was whether to provide the incoming leaders the brief before inauguration or withhold it until they
    took office. The stated reason was to give them the same information as those responsible for national security during
    the transition; exclude later briefing arrangements.
  span_range:
  - src:2a42205938c9#p2.5
  - src:2a42205938c9#p2.5
  decision: The outgoing President directed that the President’s Daily Brief be made available immediately to the President-elect
    and Vice President-elect.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to use the opportunity of their impending flight together to advocate for daily briefings,
    rather than leave the President-elect outside the current analytic stream. The stated reasons include timely intelligence,
    access to a professional officer for questions and follow-up, and the Agency’s need for customer feedback; exclude the
    mechanics of producing or transmitting the brief.
  span_range:
  - src:2a42205938c9#p2.11
  - src:2a42205938c9#p3.3
  decision: The Vice President-elect chose to urge the President-elect to receive daily personal intelligence briefings during
    the transition.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The briefers faced a choice between including information overheard during their access to the incoming leadership
    and keeping it out of their reporting. They chose to exclude gossip and personal information; the scenario should focus
    on professional restraint and privacy, not on the sensitive intelligence they were briefing.
  span_range:
  - src:2a42205938c9#p5.6
  - src:2a42205938c9#p5.7
  decision: The intelligence briefers decided not to report overheard transition conversations or personal reactions unless
    directly relevant to intelligence support.
  content_domain: other:intelligence ethics
  refusal_sensitivity: medium
  held_out: false
  natsec: false
