  focus: The decision point is the president-elect’s choice between pursuing a negotiated truce and seeking military victory
    through escalation, including plans that could involve atomic weapons. Focus on the policy rationale stated in the passage—the
    grave risk of enlarging the war and the absence of a likely positive victory—and exclude operational details of the proposed
    offensive.
  span_range:
  - src:1e7307274efd#p2.2
  - src:1e7307274efd#p2.3
  decision: The president-elect chose to prioritize ending the Korean War through an armistice rather than expanding the war
    with a renewed offensive.
