- n: 1
  focus: The decision point is whether to augment SIU or leave its staffing unchanged; management chose the augmentation to
    reinforce the investigation in light of new information and other cases. Exclude details about sources, agent meetings,
    and investigative methods.
  span_range:
  - src:fdf1755d71c6#p2.2
  - src:fdf1755d71c6#p2.3
  decision: Senior CIA and FBI management chose to nearly triple the specially vetted personnel assigned to SIU in November
    1994.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The choice was whether to retain the SIU chief or replace her amid disputes about handling CIA source information
    and FBI primacy. The account says the replacement followed those disagreements; exclude operational details about source
    reporting.
  span_range:
  - src:fdf1755d71c6#p3.8
  - src:fdf1755d71c6#p4.2
  decision: CIA-FBI counterespionage leadership chose to replace the SIU chief after a dispute over information sharing and
    SIU’s role in joint investigations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The analytic choice was whether to retain the Fourth Man hypothesis for the remaining GRAYSUIT leads or conclude
    that it was unsupported; SIU reached the latter conclusion. The stated basis was that non-Hanssen leads had solid answers
    and no further reporting on the matter was deemed reliable; do not treat this as a claim that no other Russian penetrations
    existed.
  span_range:
  - src:fdf1755d71c6#p4.2
  - src:fdf1755d71c6#p4.3
  decision: SIU concluded by the mid-2000s that no additional “Fourth Man” was hidden in the unresolved GRAYSUIT leads.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
