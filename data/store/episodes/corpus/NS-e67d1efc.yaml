  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 5
  focus: 'The decision point is the administration’s diplomatic posture after an attack that caused no American casualties:
    respond forcefully enough to deter further action, but avoid being provocative or overplaying the incident. Exclude subsequent
    force deployments and patrol operations, which are separate decisions.'
  span_range:
  - src:b6804d0166ea#p19.7
  - src:b6804d0166ea#p19.8
  decision: The President chose to downplay the 2 August attack publicly while sending North Vietnam a stern protest and warning
    of grave consequences for further unprovoked action.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is the analytic interpretation and precedence assigned to an ambiguous intercept, including the
    alternative reading that the message concerned movement or salvage activity. Exclude the later ship movements and engagement;
    focus on the warning judgment and its evidentiary basis.
  span_range:
  - src:b6804d0166ea#p27.7
  - src:b6804d0166ea#p27.10
  decision: The Phu Bai SIGINT site chose to characterize an intercepted order for unspecified military operations as a planned
    operation against the Desoto patrol and issue a Critic warning.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to authorize retaliation promptly or wait for verification amid conflicting radar,
    sonar, visual, and intelligence reports. The account identifies both political pressures and the SIGINT report treated
    by senior officials as compelling evidence; exclude the strike’s execution details.
  span_range:
  - src:b6804d0166ea#p25.5
  - src:b6804d0166ea#p27.2
  decision: The President approved a retaliatory air strike against North Vietnamese naval bases after the 4 August reports,
    despite emerging doubts about whether an attack had occurred.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 8
  focus: The decision point is whether to connect the intercept to the current attack or treat it as possibly referring to
    the 2 August action. The passage says analysts relied on the coincidence in timing despite no explicit link; exclude the
    separate question of why the final translation used “boats” rather than “comrades.”
  span_range:
  - src:b6804d0166ea#p39.5
  - src:b6804d0166ea#p39.6
  decision: NSA watch-center analysts classified an ambiguous intercept as relating to the ongoing 4 August attack and issued
    a translation that supported that interpretation.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to provide the underlying SIGINT broadly or restrict disclosure to the chronology.
    The passage identifies concern about compromising current intelligence capabilities as the reason for reluctance; exclude
    the substance of the committee’s evaluation of the attack.
  span_range:
  - src:b6804d0166ea#p45.8
  - src:b6804d0166ea#p45.8
  decision: NSA and DIA officials limited the Gulf of Tonkin SIGINT material provided for the 1968 Senate inquiry to the chronology.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to keep the previously shelved resolution on hold or use the incident to secure its
    passage. The passage links the resolution to the administration’s aim of expanding its authority and notes that it was
    presented as a measure to prevent the spread of war; exclude the later question of whether a particular military action
    was justified under that authority.
  span_range:
  - src:b6804d0166ea#p47.5
  - src:b6804d0166ea#p47.6
  decision: The Johnson administration chose to use the 4 August incident to advance the Tonkin Gulf Resolution and obtain
    broad authority to use military force.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to include the broader, contradictory SIGINT record or emphasize evidence supporting
    an attack; the account says the latter course continued beyond the immediate crisis. Include the analysts’ stated belief
    that an attack occurred and their rationalization of contrary evidence, but exclude speculation about an undocumented
    plan or operational collection details.
  span_range:
