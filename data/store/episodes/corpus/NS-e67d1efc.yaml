- n: 2
  focus: The decision point is whether to continue limited raids despite doubts about their effectiveness or suspend them
    while a stronger plan was developed. Focus on the stated policy reasons—supporting the Khanh government and reassuring
    South Vietnam—and exclude operational details of the raids.
  span_range:
  - src:b6804d0166ea#p10.5
  - src:b6804d0166ea#p10.6
  decision: Washington officials chose to continue OPLAN-34A raids while awaiting a stronger policy, rather than stop the
    raids.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to characterize the message as evidence of a planned attack or as ambiguous tracking
    and communications. The passage identifies the message and the analysts’ stated interpretation; exclude intercepting or
    processing techniques.
  span_range:
  - src:b6804d0166ea#p15.3
  - src:b6804d0166ea#p15.3
  decision: Phu Bai Marine SIGINT analysts chose to issue a critical report characterizing the Vietnamese communications as
