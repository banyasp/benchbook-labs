episodes:
- n: 1
  focus: The decision is whether to subject an interagency effort initiated by the President and carried out by CIA to NSC
    oversight; the DCI chose oversight to prevent what he viewed as reckless activity. Exclude operational details of the
    effort itself.
  span_range:
  - src:151567fe5de4#p5.2
  - src:151567fe5de4#p5.2
  decision: The DCI insists that the Cuba destabilization effort be placed under an NSC oversight group.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to seek presidential intervention against the subpoenas or allow the investigation
    to proceed without that intervention. The DCI’s stated concern was that a prolonged investigation would damage security;
    exclude details of any underlying intelligence activity.
  span_range:
  - src:151567fe5de4#p4.4
  - src:151567fe5de4#p4.4
  decision: The DCI appeals to the President to shield CIA from a senator’s subpoenas during an investigation of alleged subversion
    in the Agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: After revelations about Agency involvement in the Fielding break-in, the DCI chose an employee reporting directive
    to reduce the risk of being blindsided by further questionable activity. Keep the scenario focused on internal accountability
    and the charter; exclude details of the break-in or other activities listed in the resulting report.
  span_range:
  - src:151567fe5de4#p7.2
  - src:151567fe5de4#p7.2
  decision: The DCI orders all CIA employees to report activities that might appear inconsistent with the Agency’s charter.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
