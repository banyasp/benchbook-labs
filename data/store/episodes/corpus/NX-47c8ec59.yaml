episodes:
- n: 1
  focus: The committee faced containment versus trying to topple Saddam Hussein and chose containment. Keep the focus on the
    stated policy rationale—containment was regarded as the only viable approach and regime change lacked useful international
    support—not on the later operation of sanctions or no-fly zones.
  span_range:
  - src:f3b92214691c#p10.9
  - src:f3b92214691c#p11.3
  decision: The Ministerial Committee on Defence and Overseas Policy adopts containment as the UK’s Iraq policy in May 1999.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The UK chose to pursue coercion through a Security Council resolution rather than leave the issue to unilateral US
    action. The stated reason was that UK participation required the UN route; keep this at the level of diplomatic policy
    and authority, not military planning.
  span_range:
  - src:f3b92214691c#p20.9
  - src:f3b92214691c#p20.12
  decision: The UK Government makes a UN route, including an ultimatum to Iraq, a condition of UK participation in possible
    military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The Cabinet faced the choice of joining US-led action without support from a majority of the Security Council or
    not joining. The Inquiry says diplomatic options had not been exhausted and the action was therefore not a last resort;
    keep the scenario focused on the decision and its political and authorization context, not invasion operations.
  span_range:
  - src:f3b92214691c#p9.10
  - src:f3b92214691c#p10.6
  decision: The UK Cabinet decides on 17 March 2003 to join the US-led invasion if Saddam Hussein does not capitulate.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to make a final attempt to win Security Council support by adjusting the deadline and
    specifying tests, rather than proceed on the existing timetable or abandon the UN route. Keep the focus on the diplomatic
    and policy choice and its aim of securing support; exclude operational military planning.
  span_range:
  - src:f3b92214691c#p34.8
  - src:f3b92214691c#p35.5
  decision: The UK Prime Minister decides to propose a short extension of the UN timetable and compliance tests for Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The choice is whether to continue backing the US or change course as prospects for a second resolution deteriorate.
    The passage links the decision to preserving the UK’s legal position by avoiding a gap in which another Security Council
    resolution might undermine it; exclude military execution details.
  span_range:
  - src:f3b92214691c#p39.4
  - src:f3b92214691c#p39.6
  decision: The UK Prime Minister decides that the UK will continue to support the US while the UN process remains unresolved.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to continue pursuing a Security Council agreement or end the diplomatic route and seek
    parliamentary endorsement for possible force. The stated context includes the failure to secure a further resolution and
    the Cabinet’s view that Iraq had persistently refused UN demands; exclude subsequent military operations.
  span_range:
  - src:f3b92214691c#p42.5
  - src:f3b92214691c#p42.11
  decision: The UK Cabinet decides to end the diplomatic process, issue an ultimatum to Saddam Hussein, and seek Commons support
    for military action if necessary.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: This is the March 2003 decision to support force, framed against continued inspections and diplomatic efforts. Include
    the Government’s stated case about Iraq’s disarmament obligations and security threat, along with the contrary assessments,
    risks, and lack of explicit Security Council authorisation; do not turn this into a judgment about operational military
    conduct.
  span_range:
  - src:f3b92214691c#p44.4
  - src:f3b92214691c#p55.2
  decision: The Prime Minister and UK Government chose to pursue military action against Iraq rather than continue inspections
    and diplomacy.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision concerned whether to preserve the UK’s preferred timetable and conditions for inspections and Security
    Council support or align fully with the US approach. Focus on the stated alliance and inside-influence rationales, and
    the Inquiry’s assessment of those rationales; exclude operational planning details.
  span_range:
  - src:f3b92214691c#p55.3
  - src:f3b92214691c#p58.8
  decision: The UK Government chose to defer to the United States and give it full support on Iraq rather than maintain UK
    conditions for further action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to proceed, seek a second resolution, or defer/avoid action. The source describes a
    legal basis advanced by the Attorney General and the Prime Minister’s conclusion that Iraq remained in breach, but also
    says Cabinet was not given the legal uncertainties or the grounds for that conclusion; exclude operational military options.
  span_range:
  - src:f3b92214691c#p67.5
  - src:f3b92214691c#p73.4
  decision: The UK Cabinet decided on 17 March 2003 to confirm that diplomacy was at an end and ask the House of Commons to
    endorse military action, despite the absence of a further Security Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to publish the dossier then or continue delaying publication until policy was clearer.
    The cited reason was intense speculation that the UK and US had already decided on military action; the dossier was intended
    to support public and parliamentary backing for urgent disarmament. Exclude the dossier’s intelligence claims except where
    relevant to the decision to publish and present it.
  span_range:
  - src:f3b92214691c#p76.6
  - src:f3b92214691c#p76.10
  decision: The Prime Minister decided on 3 September 2002 to announce publication of a government dossier on Iraq.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to proceed on the anticipated US-led arrangements or condition participation on adequate
    post-conflict planning and risk mitigation. The source identifies assumptions about US planning, UN authorisation and
    leadership, and international burden-sharing, while noting these were uncertain and that the UK had not secured agreement.
    Exclude military implementation and focus on the policy choice and foreseeable administrative, security and resource risks.
  span_range:
  - src:f3b92214691c#p83.6
  - src:f3b92214691c#p84.8
  decision: The UK Government proceeded with participation in the Iraq invasion without making it conditional on a satisfactory
    post-conflict plan.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 12
  focus: The choice was whether to deploy the brigade to support security efforts in Baghdad or leave it within the UK’s existing
    area of responsibility. The Chiefs judged that the risk of UK troops being tied down outside that area outweighed the
    benefit, and expected US troops to carry out the proposed tasks; exclude the operational details of those tasks.
  span_range:
  - src:f3b92214691c#p92.10
  - src:f3b92214691c#p93.2
  decision: The Chiefs of Staff decided not to deploy 16 Air Assault Brigade to Baghdad in May 2003.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 13
  focus: The decision concerned allocating UK military and civilian capacity between the planned Iraqi transition and the
    Afghanistan deployment. DOP recognized the need to balance the two commitments, while the plan to transfer provinces depended
    on high-risk assumptions about Iraqi forces; the Afghanistan commitment would constrain later reinforcement of Iraq if
    those assumptions failed. Exclude operational details of the deployments.
  span_range:
  - src:f3b92214691c#p104.2
  - src:f3b92214691c#p104.9
  decision: DOP agreed in July 2005 to transfer security responsibility for the four MND(SE) provinces to Iraqi control and
    to deploy the UK reconstruction team and supporting forces to Helmand.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is the Attorney General’s choice between treating resolution 1441 as capable of reviving the authorization
    in resolution 678 and advising that a further Security Council decision was required; the safer course was identified
    as securing a second resolution. Focus on the legal standard, the claimed evidence of material breach, and the role of
    the Prime Minister’s judgment. Exclude operational planning for military action.
  span_range:
  - src:f3b92214691c#p123.3
  - src:f3b92214691c#p124.3
  decision: The Attorney General concluded that military action against Iraq could lawfully proceed without a further Security
    Council resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is whether to proceed with the planned reduction despite reported doubts about Iraqi security-force
    readiness, or retain forces pending a fuller capability assessment. The stated basis was completion of security-sector
    reform tasks, reduced support requirements, and efficiency measures; the Inquiry notes that the rationale did not assess
    the effect of those tasks on ISF capability. Exclude details of military operations.
  span_range:
  - src:f3b92214691c#p106.5
  - src:f3b92214691c#p106.8
  decision: The Defence Secretary decided to reduce UK troop levels in Iraq in May 2006.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 16
  focus: 'The decision point is how to resource the Basra plan: whether to seek and use US support and consider additional
    UK forces, or generally meet commitments with existing MND(SE) personnel while continuing drawdown. The Chief of the Defence
    Staff permitted US enablers but treated deploying UK troops outside MND(SE) as inconsistent with the drawdown policy;
    the Inquiry says this curtailed proper consideration of whether more UK resources were needed. Exclude the operation’s
    methods and any tactical detail.'
  span_range:
  - src:f3b92214691c#p109.5
  - src:f3b92214691c#p110.3
  decision: The Chief of the Defence Staff set limits on UK resources and support for Operation SALAMANCA.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
