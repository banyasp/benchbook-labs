- n: 1
  focus: The decision arose after Beijing identified the two men as CIA officers and officials faced questions about their
    status. The administration kept to the existing cover and routed inquiries through State; the passage gives the concern
    that changing the story was difficult and that the president would not make government officials appear to have lied.
    Exclude the separate decision about which prisoners to prioritize in UN diplomacy.
  span_range:
  - src:ab93f0bb0cd6#p5.3
  - src:ab93f0bb0cd6#p5.7
  decision: The Eisenhower administration chose to maintain the Army-civilian cover for the two CIA officers in its public
    responses rather than disclose their CIA status.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The State Department legal adviser recommended focusing on the 11 because the CIA officers’ civilian status and mission
    made it difficult to claim their release under the armistice, and including them might jeopardize the airmen’s release.
    The president then distinguished the uniformed soldiers from the two civilians, and diplomatic efforts reflected that
    distinction. Exclude the separate question of whether officials should publicly disclose the CIA affiliation.
  span_range:
  - src:ab93f0bb0cd6#p6.3
  - src:ab93f0bb0cd6#p6.8
  decision: The Eisenhower administration chose to center its UN and diplomatic effort on the 11 uniformed airmen rather than
    treat the two CIA officers as part of the same prisoner-of-war claim.
  content_domain: other:diplomatic policy
