episodes:
- n: 1
  focus: The decision point is whether to accept the existing estimate or reopen it after the Soviet leader announced a one-third
    manpower reduction and some CIA analysts thought the announced figure might be correct. The Director sought a harder review
    because the estimate and the announcement differed; the review found the announced figure substantially correct. Exclude
    the separate question of intelligence collection methods.
  span_range:
  - src:fa8cd68390e2#p8.2
  - src:fa8cd68390e2#p9.2
  decision: The Director of Central Intelligence commissions a special national estimate in 1960 to reassess Soviet military
    manpower rather than rely on the existing estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is how to characterize Soviet intentions: as primarily deterrent and defensive, or as pursuing
    conquest and decisive superiority. The estimate gave reasons involving Soviet views of mutual deterrence, the risks of
    general war, and preference for political means, while Air Force Intelligence dissented. Exclude operational force employment
    details.'
  span_range:
  - src:fa8cd68390e2#p10.3
  - src:fa8cd68390e2#p11.2
  decision: National estimators adopt a judgment in the 1960 Soviet policy estimate that Soviet military power was primarily
    intended for deterrence and survival, not consistent military conquest.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to restrict dissemination of the estimate or circulate its conclusions more widely
    while omitting direct references to the underlying documents and the restrictive codeword. The passage says the omissions
    permitted wider dissemination and notes that the relevant officials had the required clearance. Exclude the source’s identity
    and any details of intelligence operations.
  span_range:
  - src:fa8cd68390e2#p18.2
  - src:fa8cd68390e2#p18.2
  decision: The drafters and coordinators of the 1961 Special National Intelligence Estimate permit wider circulation of its
    conclusions without directly citing sensitive documentary material or using its restrictive codeword.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision was whether to authorize a competitive outside review or leave the estimating process to the usual interagency
    participants. The passage gives the criticism that prompted the proposal and notes the initial rejection before approval;
    exclude the accuracy of Team B’s later claims as a separate decision.
  span_range:
  - src:fa8cd68390e2#p25.5
  - src:fa8cd68390e2#p26.2
  decision: The DCI in 1976 authorized an outside panel to review the same intelligence data as official estimators and produce
    an alternative estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is how to respond to the National Security Adviser’s request to reconsider a draft judgment that
    conflicted with a public statement by the Secretary of Defense. The passage says the language changed but the finding
    did not; exclude the later dispute over a different NIE paragraph.
  span_range:
  - src:fa8cd68390e2#p30.5
  - src:fa8cd68390e2#p30.5
  decision: The DCI directed a review of the draft NIE’s judgment about the SS-9 variant and accepted revised language while
    retaining the basic finding.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision concerned whether national estimates should include assessments of how forces might perform in interaction,
    beyond static descriptions. The passage gives the DCI’s rationale and the military intelligence leaders’ objections; exclude
    any operational modeling details not described in the text.
  span_range:
  - src:fa8cd68390e2#p35.4
  - src:fa8cd68390e2#p36.2
  decision: The DCI chose to include quasi-dynamic assessments of force effectiveness in the 1979 NIE rather than limit it
    to static measures of force size and characteristics.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The choice was whether to continue emphasizing US–Soviet comparisons or include the alliance-level comparison requested
    by CIA analysts and members of Congress. The passage says the latter was resisted because adding NATO forces could diminish
    the perceived Soviet threat; exclude other issues about net assessments.
  span_range:
  - src:fa8cd68390e2#p37.2
  - src:fa8cd68390e2#p37.3
  decision: The DCI and Deputy Director for Intelligence delayed adopting NATO–Warsaw Pact force comparisons in overall assessments.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to judge that fundamental change was already underway or withhold that judgment pending
    stronger evidence. The estimate chose to wait, citing a lack of convincing or compelling evidence; exclude the later assessment
    of how quickly events proved that judgment wrong.
  span_range:
  - src:fa8cd68390e2#p42.4
  - src:fa8cd68390e2#p42.4
  decision: The estimators of NIE 11-3/8-88 chose a wait-and-see judgment on whether Gorbachev was bringing fundamental changes
    to Soviet military doctrine.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The choice was to issue a public-facing account that emphasized Soviet capabilities without adequate indication of
    countervailing US and NATO forces, rather than provide a balanced presentation or refrain from the publication. The passage
    gives the stated purpose of rallying support for the US military buildup; exclude details about the underlying intelligence
    sources.
  span_range:
  - src:fa8cd68390e2#p38.3
  - src:fa8cd68390e2#p38.3
  decision: The Department of Defense chose to issue Soviet Military Power as a public information publication using presentation
    that magnified the Soviet threat.
  content_domain: other:public-information-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 10
  focus: The choice was whether to assess that military-technical doctrine had changed or retain the judgment that the Soviets
    would remain committed to offensive operations. The estimate cited a lack of detected changes that clearly demonstrated
    such a shift; exclude the separate political-level doctrine judgment.
  span_range:
  - src:fa8cd68390e2#p46.5
  - src:fa8cd68390e2#p46.6
  decision: The estimators of NIE 11-14-89 judged that Soviet military-technical doctrine remained offensive despite evidence
    and debate about a defensive shift.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
