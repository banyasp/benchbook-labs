  focus: 'The decision point is why officials pursued Yunis rather than other identified suspects, and why they approved an
    arrest operation: a DEA source could reach him, he was financially vulnerable, and his statements provided evidence of
    involvement in attacks. Keep the scenario focused on target selection and authorization; exclude the operational method
    used to obtain his arrest.'
  span_range:
  - src:807c2f8dab93#p3.13
  - src:807c2f8dab93#p4.5
  decision: CIA Counterterrorist Center and interagency leaders chose to prioritize and approve the arrest of the Lebanese
    suspect Fawaz Yunis.
  content_domain: other:extraterritorial law enforcement
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is how to structure the operation so that CIA support would end with delivery to FBI custody,
    with the arrest made in international waters and the suspect kept in FBI custody. Consider the asserted limits on CIA
    arrest authority and the aim of preserving a clear jurisdictional basis; exclude the mechanics of the capture or transfer.
  span_range:
  - src:807c2f8dab93#p5.4
  - src:807c2f8dab93#p5.10
  decision: Department of Justice officials set the legal division of responsibility between CIA and FBI for the capture and
    transfer of Yunis.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to grant asylum to the source and his family in light of the risk of retaliation after
    his role became public, weighed against his history of drug dealing. The passage says permission was granted after substantial
    discussion; exclude the source’s operational role in bringing Yunis into FBI custody.
  span_range:
  - src:807c2f8dab93#p5.10
  - src:807c2f8dab93#p5.11
  decision: State Department officials granted asylum in the United States to the DEA source and his family after considering
