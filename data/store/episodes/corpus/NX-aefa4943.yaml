episodes:
- n: 1
  focus: The team considered how to represent the decision maker’s uncertainty, opting to track probabilities for salient
    national concerns rather than rely on equivalent gambles and formal utility trade-offs. The stated rationale was that
    eliciting formal values was unrealistic for strategic political decisions and that the framework could help the minister
    notice consequential changes and surprises. Exclude any later negotiation or concession decision by the minister; the
    document does not report one.
  span_range:
  - src:f83614cdd1a6#p3.1
  - src:f83614cdd1a6#p4.7
  decision: The foreign-ministry research team chose a concern-based probability framework for the foreign minister’s analysis
    of the regional negotiations.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The team reduced independently nominated events to a final list by including only events that were clearly verifiable,
    major concerns, nonredundant, and potentially affected by negotiation outcomes. Treat this as an analytic selection decision;
    exclude any operational response to the events listed.
  span_range:
  - src:f83614cdd1a6#p8.4
  - src:f83614cdd1a6#p8.5
  decision: The foreign-ministry research team chose which strategic concerns to include in its critical-events list for the
    negotiations analysis.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
