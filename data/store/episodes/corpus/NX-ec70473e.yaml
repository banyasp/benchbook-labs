title: 'The Office of Strategic Services: America’s First Intelligence Agency'
collection: cia-csi-books
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The President could leave intelligence coordination with the existing departmental services or create a central office
    after efforts to secure cooperation appeared ineffective. The stated reasons were to take a strategic approach to national
    challenges and avoid having the President arbitrate interdepartmental disputes; exclude later operational missions of
    the office.
  span_range:
  - src:4d8277803fc0#p3.3
  - src:4d8277803fc0#p3.5
  decision: The President creates a new civilian Coordinator of Information office to coordinate national intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The choice was how to place the office: under military control, outside it, or in a divided arrangement. The account
    says the move was intended to preserve the office’s autonomy while gaining military support and resources, while the President
    wanted the official propaganda service kept out of military hands; exclude the methods of propaganda or clandestine operations.'
  span_range:
  - src:4d8277803fc0#p6.1
  - src:4d8277803fc0#p6.2
  decision: The President transfers most of the Coordinator of Information office to the Joint Chiefs while moving its official
    propaganda service to the Office of War Information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is whether to pursue the proposed strategic sequence of attacks, not how to locate or strike
    individual facilities. The account gives the rationale: weakening the Luftwaffe would enable attacks on fuel production,
    identified as a critical constraint on the German war effort; exclude technical targeting and bombing methods.'
  span_range:
  - src:4d8277803fc0#p8.3
  - src:4d8277803fc0#p8.4
  decision: Allied commanders adopt a bombing campaign prioritizing German fighter-aircraft factories and then synthetic-fuel
    production.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 4
  focus: 'The decision was whether to maintain the general policy without exception or authorize a meeting about a possible
    surrender in Italy. The account identifies the constraints and the reason for the exception: the surrender policy and
    concern about Soviet suspicions limited such contacts, but the proposal offered a chance to end the Italian campaign early
    and save lives; exclude the mechanics of the contacts.'
  span_range:
  - src:4d8277803fc0#p16.2
  - src:4d8277803fc0#p16.2
  decision: Senior Washington authorities permit the OSS station chief in Bern to meet with a German SS general about surrendering
    German forces in Italy, despite the unconditional-surrender policy.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision was whether to support the Thai resistance movement or withhold a commitment; Washington later endorsed
    the officers’ promise retroactively. The stated considerations included resistance to Japanese power and the possibility
    that a Thai force could bolster the country’s postwar independence amid concern about British imperial aims; exclude the
    training and operational conduct of guerrillas.
  span_range:
  - src:4d8277803fc0#p24.2
  - src:4d8277803fc0#p24.3
  decision: OSS officers in Bangkok promise American support for proposed Thai guerrillas, a commitment later endorsed by
    the State Department.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision arose amid pressure for rapid demobilization, congressional opposition to wartime agencies, and the
    President’s concerns about Donovan’s proposed intelligence establishment. Focus on the President’s authority and policy
    choice to dissolve OSS and transfer its components; exclude later agency histories and operational activity.
  span_range:
  - src:4d8277803fc0#p26.4
  - src:4d8277803fc0#p27.1
  decision: The President chose to dissolve OSS and distribute its branches between the State and War Departments rather than
    preserve OSS or immediately establish Donovan’s proposed permanent agency.
  content_domain: other:intelligence organization policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 7
  focus: The Assistant Secretary interpreted the President’s liquidation directive broadly and directed preservation of functions
    and facilities considered valuable for permanent peacetime purposes; the Secretary of War confirmed the direction. Focus
    on the policy judgment to retain these intelligence components under the stated national-interest and peacetime-purpose
    standards, not on their operations or overseas networks.
  span_range:
  - src:4d8277803fc0#p27.4
  - src:4d8277803fc0#p27.4
  decision: The Assistant Secretary of War chose to preserve SI and X-2 as a continuing unit in the Strategic Services Unit
    rather than liquidate them with the rest of OSS.
  content_domain: other:intelligence organization policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
