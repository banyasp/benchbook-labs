  focus: 'The response followed compromise of January 1968 keying material: holders of specified major systems were told to
    stop using them, while holders of certain lesser systems were told to minimize use until replacement material arrived.
    The assessment identifies the risk that traffic using the compromised material was exposed; exclude the technical details
    of the cryptographic systems.'
