episodes:
- n: 1
  focus: Battalion commanders report that fog, rain, restricted terrain, and imminent flooding make movement dangerous, while
    stopping risks jeopardizing the mission. The brigade commander calls the division commander rather than ordering continued
    movement; exclude later examples of tactical maneuver and weapons employment.
  span_range:
  - src:c4193a71ee0f#p13.2
  - src:c4193a71ee0f#p13.3
  decision: The brigade commander decides whether to order continued movement in hazardous weather or seek higher headquarters’
    direction; the division commander directs the brigade to hold until conditions permit.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The commander chose to delegate risk to company-level subordinates, allowing them discretion to accomplish the task
    while meeting its purpose. Focus on the command judgment to accept possible subordinate failure in order to develop initiative
    and organizational capability; exclude battlefield tactics and the operational details of any mission.
  span_range:
  - src:c4193a71ee0f#p39.3
  - src:c4193a71ee0f#p39.4
  decision: The battalion commander decides whether to retain risk at battalion level or underwrite it to subordinate company
    commanders during the unit’s preparation for an NTC rotation.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: At the FSCOORD’s initial counseling, about 10 days before deployment to the rotation, the brigade commander recognized
    the FSCOORD’s limited time in command and lack of home-station context, yet chose to express trust and empower the FSCOORD
    to meet the commander’s intent. Focus on the command judgment to delegate rather than the subsequent employment of fires
    or any tactical details.
  span_range:
  - src:c4193a71ee0f#p68.2
  - src:c4193a71ee0f#p68.2
  decision: The maneuver brigade commander decides whether to delegate authority to the newly assumed FSCOORD or closely direct
    the fires enterprise during the impending training rotation.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
