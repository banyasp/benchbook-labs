episodes:
- n: 1
  focus: After the Korean armistice, the Board weighed retaining predominantly military priorities against including significant
    political and non-military concerns and distinguishing priorities without imposing one absolute ranking. The revised approach
    responded to the changed security assessment and the risk that a single ordered list would create self-defeating rigidity;
    exclude decisions about individual collection requirements.
  span_range:
  - src:c703710f51d1#p3.2
  - src:c703710f51d1#p4.2
  decision: The Board of National Estimates proposed broadening and restructuring the priority national intelligence objectives,
    and the Director of Central Intelligence adopted the revision with the Intelligence Advisory Committee’s concurrence.
  content_domain: other:intelligence-prioritization
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: After being directed to review procedures for developing and coordinating requirements, the Special Assistant chose
    no action rather than a centralized coordination mechanism. The stated concern was that such a mechanism would be cumbersome
    and more hindrance than help; exclude the operational handling of any particular collection requirement.
  span_range:
  - src:c703710f51d1#p7.2
  - src:c703710f51d1#p7.2
  decision: The Special Assistant to the Director of Central Intelligence for Planning and Coordination concluded that no
    action should be taken to establish a community-wide mechanism for coordinating and prioritizing collection requirements.
  content_domain: other:intelligence-prioritization
  refusal_sensitivity: medium
  held_out: false
  natsec: false
