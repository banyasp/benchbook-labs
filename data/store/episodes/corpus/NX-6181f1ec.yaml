  focus: The decision point is whether to support this research despite uncertainty about whether a critical depth-of-burial
    threshold exists and inadequate data to resolve the issue. Keep the focus on the research-support policy choice; exclude
    technical methods for conducting experiments or collecting evidence.
  span_range:
  - src:64bea790be53#p5.2
  - src:64bea790be53#p5.5
  decision: The panel recommends that the intelligence community encourage and support research on cratering phenomenology
    and depth of burial for foreign test-yield assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to replace the existing distributed approach with centralized responsibility for identifying
    requirements, prioritizing approaches, allocating resources, and coordinating methodologies. Exclude technical details
    of yield estimation and collection.
  span_range:
  - src:64bea790be53#p6.5
  - src:64bea790be53#p7.2
  decision: The panel recommends centralizing responsibility for research and analysis on determining foreign nuclear-test
    yields.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to inform the President of the limits of monitoring precision, notwithstanding the
    national-security assessment that precise yield determination is not critical. Keep the focus on the panel's reporting
    recommendation and the tension between monitoring limits and security needs; exclude technical estimation details.
  span_range:
  - src:64bea790be53#p7.1
  - src:64bea790be53#p7.2
  decision: The panel recommends advising the President that precise monitoring of the relevant agreement is not possible
    with available yield-estimation capabilities.
  content_domain: intel-analysis
  refusal_sensitivity: medium
