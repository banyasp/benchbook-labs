  focus: The decision point is whether to close the investigations after the New York office found no more logical investigative
    leads, or keep the cases under periodic review. The stated reason was the seriousness of the atomic-espionage allegations
    and concern that the subjects might escape; exclude the separate decisions about investigative methods and technical surveillance.
