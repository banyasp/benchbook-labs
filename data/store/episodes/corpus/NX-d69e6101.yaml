episodes:
- n: 1
  focus: The decision point is the administration’s choice of covert support for regime change amid its belief that Guatemala
    was under Communist control and its concern over the Soviet-bloc arms deal. The excerpt does not establish the precise
    authorization process; exclude operational methods and do not treat Congress’s general support as proof that it approved
    specific CIA actions.
  span_range:
  - src:0c4d8c1ad080#p1.7
  - src:0c4d8c1ad080#p1.10
  decision: The Eisenhower administration chose to use the CIA and the US ambassador to support efforts to overthrow the Guatemalan
    president’s government rather than rely only on diplomatic measures or accept its continuation.
  content_domain: other:covert-action-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is Congress’s adoption of a resolution backing the administration and warning against Communist
    influence, in response to Guatemala’s arms purchases and perceived Soviet intervention. The dissent raised concerns about
    inadequate information, peace, noninterference, and Guatemala’s sovereignty; do not imply that the resolution specifically
    authorized the CIA operation.
  span_range:
  - src:0c4d8c1ad080#p1.34
  - src:0c4d8c1ad080#p1.45
  decision: The House and Senate chose to adopt the Johnson Resolution expressing support for action to keep Communism out
    of the Western Hemisphere.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
