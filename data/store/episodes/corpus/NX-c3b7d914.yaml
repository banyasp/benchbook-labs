    not on intelligence collection procedures.
  span_range:
  - src:c7a3d027d829#p17.3
  - src:c7a3d027d829#p17.9
  decision: The authors of the 1984 Special National Intelligence Estimate decide whether the Soviet war scare reflects genuine
