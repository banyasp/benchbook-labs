episodes:
- n: 1
  focus: The board president chose a causal finding under the stated clear-and-convincing-evidence standard, and identified
    a contributing factor under the preponderance standard. The stated basis is the crew’s failure to recognize the aircraft’s
    position or take corrective action, with spatial disorientation identified as the only plausible explanation. Exclude
    operational flight procedures and any inference about individual culpability beyond these findings.
  span_range:
  - src:67e91ac89d06#p3.6
  - src:67e91ac89d06#p3.6
  decision: The accident board president determined that unrecognized spatial disorientation caused the mishap and that failure
    to crosscheck and heed the sink-rate caution substantially contributed.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The investigator weighs three explanations and concludes, under a clear-and-convincing-evidence standard, that spatial
    disorientation best accounts for the flight data and lack of response to alerts. Treat this as an accident-investigation
    judgment; exclude the operational details of aircraft recovery and control inputs.
  span_range:
  - src:67e91ac89d06#p39.6
  - src:67e91ac89d06#p41.2
  decision: The accident investigator finds that unrecognized spatial disorientation caused the mishap, rather than aggressive
    aircraft handling or mechanical failure.
  content_domain: other:accident-investigation
  refusal_sensitivity: low
  held_out: false
  natsec: false
