  focus: The Second Common Understanding allowed each party to use different methods of transmitting telemetry, including
    encryption, but prohibited deliberate denial when it impeded verification of treaty compliance. Treat this as a treaty-level
    choice balancing freedom over test telemetry against verification; exclude the technical means of collecting or analyzing
    telemetry.
