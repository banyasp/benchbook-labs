  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision was whether to broaden CIA oversight through a joint committee or retain the existing committee arrangements.
    Focus on the oversight structure and the stated concerns about committee jurisdiction and existing briefings; exclude
    operational details mentioned in the report’s discussion of covert action.
  span_range:
  - src:adc6aa9725ed#p58.1
  - src:adc6aa9725ed#p59.1
  decision: The Senate did not adopt the proposed joint congressional oversight committee for the CIA.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The choice was to create a formal committee or retain the existing, limited oversight arrangements. The debate included
    concerns that oversight could compromise security and foreign liaison relationships, as well as senators’ reluctance to
    seek sensitive information absent a responsibility to do so; exclude later changes to subcommittee arrangements.
  span_range:
  - src:adc6aa9725ed#p60.1
  - src:adc6aa9725ed#p61.1
  decision: The Senate decided whether to establish a formally designated CIA oversight committee; it defeated the resolution.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The choice was to consolidate the work in a branch or leave it dispersed among the existing divisions. The stated
    concern was that the services might view consolidation as a unilateral CIA move into areas of primary military concern;
    exclude the underlying intelligence-production methods.
  span_range:
  - src:adc6aa9725ed#p66.1
  - src:adc6aa9725ed#p66.1
  decision: The DCI decided whether to establish a Military Economics Branch consolidating the intelligence work then dispersed
    across the Economic Research Area; he rejected the proposal.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The choice was to keep the allocations within the CIA or transfer them to the Defense Department. The passage identifies
    concern about exposure from a large, sustained CIA presence and long-term associations as the reason; exclude operational
    details of the Laos activities.
  span_range:
  - src:adc6aa9725ed#p75.1
  - src:adc6aa9725ed#p75.1
  decision: The DCI decided to transfer the budgetary allocations for operations in Laos from the CIA to the Defense Department
    in 1970.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: In 1965, the CIA and Air Force disputed control of reconnaissance development and the program’s orientation, while
    the Secretary of Defense wanted independent access to the resulting information for weapons and strategic-planning judgments.
    The agreement gave the DCI and Secretary of Defense decisionmaking authority, with the DCI able to appeal disagreements
    to the President; focus on governance and competing institutional interests, not collection requirements or technical
    methods.
  span_range:
  - src:adc6aa9725ed#p80.2
  - src:adc6aa9725ed#p81.1
  decision: The DCI and Secretary of Defense establish shared decisionmaking authority over the national reconnaissance program.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: In 1965, the CIA’s prior economic-analysis remit was limited, and the State Department retained authority over Free
    World economic reporting. The DCI and Secretary of State agreed to formally sanction CIA activity in this area; focus
    on the jurisdictional choice and the stated policy needs, not collection or analytic techniques.
  span_range:
  - src:adc6aa9725ed#p85.2
  - src:adc6aa9725ed#p85.2
  decision: The DCI and Secretary of State authorize the CIA to conduct economic intelligence research worldwide.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The existing estimates process was described as insulated from policymakers, internally narrow, and lacking sufficient
    access to consumers and relevant expertise. The DCI chose a replacement structure in which senior specialists would coordinate
    intelligence production and advise on priorities; focus on that management and analytic-design decision, not the substantive
    content of any estimate.
  span_range:
  - src:adc6aa9725ed#p92.1
  - src:adc6aa9725ed#p93.2
  decision: The DCI abolishes the Board of National Estimates and ONE and replaces them with National Intelligence Officers.
