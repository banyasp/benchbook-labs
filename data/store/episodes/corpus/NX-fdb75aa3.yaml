  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: Congress responded to increased concern about intelligence oversight by requiring additional committees to be briefed
    and the President to inform Congress and certify that covert programs were essential to U.S. policy. The enacted approach
    expanded reporting but did not require prior notification or approval; focus on oversight authority and accountability,
    not the conduct of covert operations.
  span_range:
  - src:adc6aa9725ed#p94.2
  - src:adc6aa9725ed#p95.1
  decision: Congress adopts the Hughes-Ryan Amendment requiring expanded reporting of covert-action decisions and presidential
    certification.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
