  focus: The President’s account describes an instruction to determine whether a political opponent could be elected by Congress,
    with political, economic, and military-faction support among the means discussed. The record presents conflicting accounts
    about whether this authorized a coup; keep that dispute central and exclude operational details of coup planning.
