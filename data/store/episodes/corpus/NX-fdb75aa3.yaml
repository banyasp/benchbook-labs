episodes:
- n: 1
  focus: The passage describes a choice between a central agency with sole responsibility for intelligence functions and a
    coordinating body that preserved departmental capabilities; the Presidential Directive adopted the latter arrangement.
    Focus on the institutional authority and rationale for that choice, not on later collection or operational practices.
  span_range:
  - src:adc6aa9725ed#p13.1
  - src:adc6aa9725ed#p14.3
  decision: The President and the departments chose to establish the Central Intelligence Group as a coordinating body while
    retaining the departments’ intelligence capabilities.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether the CIG would remain dependent on departmental intelligence production or receive authority
    to conduct independent research and analysis; the passage states that the Authority granted that authorization. Exclude
    the subsequent details of intelligence collection and production practices.
  span_range:
  - src:adc6aa9725ed#p20.1
  - src:adc6aa9725ed#p20.2
  decision: The National Intelligence Authority authorized the Central Intelligence Group to conduct independent research
    and analysis beyond work then performed by other departments.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The passage presents a choice between settling the CIA’s duties in specific terms and assigning general tasks while
    leaving room for later direction by the National Security Council; the National Security Act adopted the latter approach.
    Focus on the statutory design and the stated concern about tension during service unification, not on how the CIA carried
    out its functions.
  span_range:
  - src:adc6aa9725ed#p21.2
  - src:adc6aa9725ed#p21.3
  decision: Congress chose to give the CIA a broadly defined statutory mission rather than specify its duties in detail.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The DCI faced a choice between accepting the IAC’s direction or asserting his own authority over national estimates.
    The passage says the IAC’s supervisory role weakened the DCI’s ability to secure departmental cooperation; exclude the
    separate design of the Office of National Estimates.
  span_range:
  - src:adc6aa9725ed#p24.1
  - src:adc6aa9725ed#p24.1
  decision: The DCI chose not to submit to IAC direction while continuing to invite its participation in discussing and approving
    estimates.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision concerned how to divide political and economic intelligence responsibilities between the CIA and State.
    The source gives State’s objection to CIA political summaries and describes the resulting allocation; exclude later operational
    or organizational details not needed to assess that jurisdictional choice.
  span_range:
  - src:adc6aa9725ed#p26.1
  - src:adc6aa9725ed#p26.1
  decision: The Deputy DCI chose to leave political research to the State Department and assign the CIA economic research
    on the Soviet Bloc.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The NSC first approved a recommendation assigning coordination to the Secretary of State, then reversed course and
    placed responsibility with the CIA. The stated concerns included the risk that exposure would embarrass State and discredit
    U.S. foreign policy, and the CIA’s existing personnel and capabilities; exclude descriptions of particular covert methods
    or operations.
  span_range:
  - src:adc6aa9725ed#p34.1
  - src:adc6aa9725ed#p35.1
  decision: The NSC chose to assign covert psychological operations to the CIA rather than to the State Department.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision was whether to retain loose policy guidance or establish a body to approve covert action; the DCI had
    sought clearer direction and proposed a PSB role. Focus on the authority and oversight arrangement, not on any covert
    project or its implementation.
  span_range:
  - src:adc6aa9725ed#p41.1
  - src:adc6aa9725ed#p41.1
  decision: The NSC made the Psychological Strategy Board the approval body for covert action.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision was whether to preserve separate components or integrate them; OSO leaders favored integration under
    OSO control, while the DCI was committed to an integrated structure. Focus on the organizational authority and coordination
    choice, not on the covert operations or collection activities themselves.
  span_range:
  - src:adc6aa9725ed#p43.1
  - src:adc6aa9725ed#p44.2
  decision: The DCI chose to integrate OPC and OSO into the Directorate of Plans.
