episodes:
- n: 1
  focus: The president chose to provide candidate briefings rather than leave the candidates without them before taking office.
    The stated reasons were his own experience of entering office without sufficient intelligence and his aim of enabling
    continuity in foreign policy; exclude the later conduct and content of the individual briefings.
  span_range:
  - src:54e604a99bff#p30.2
  - src:54e604a99bff#p31.2
  decision: The president decides to authorize classified intelligence briefings for both major-party presidential candidates
    in 1952.
  content_domain: other:presidential-transition-intelligence
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The candidate chose CIA reports over a meeting and communications from the outgoing administration, citing political
    considerations, the absence of a national emergency, and the need to retain freedom to discuss foreign programs. Exclude
    the subsequent details of briefing sessions and any operational content.
  span_range:
  - src:54e604a99bff#p32.2
  - src:54e604a99bff#p33.2
  decision: The Republican presidential candidate declines the outgoing president’s proposed meeting with the cabinet but
    accepts weekly CIA reports.
  content_domain: other:presidential-transition-intelligence
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to give a presidential candidate access to sensitive communications intelligence; the
    CIA provided the Republican candidate otherwise similar material but withheld this category from the Democratic candidate.
    Focus on the disclosure decision and its stated rationale, not on the underlying intelligence or collection methods.
  span_range:
  - src:54e604a99bff#p46.3
  - src:54e604a99bff#p46.3
  decision: The CIA decided not to provide the Democratic presidential candidate the communications-intelligence material
    it provided to the Republican presidential candidate during the 1952 campaign.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is how much sensitive information about intelligence capabilities to disclose to candidates who
    asked about alternatives to the U-2. Examine the DCI’s choice to limit disclosure and the stated security concern; exclude
    technical details about the capabilities themselves.
  span_range:
  - src:54e604a99bff#p60.3
  - src:54e604a99bff#p60.3
  decision: The DCI chose to answer the candidates’ questions about capabilities to replace the U-2 only in general terms
    and not provide more detailed briefings absent further direction.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: 'The decision point is whether to give the opposing presidential candidate a defense secretary’s briefing: the White
    House initially declined the request, then approved it. Consider the stated fairness concern and the administration’s
    unease about the candidate hearing competing accounts of Soviet capabilities; exclude the technical substance of those
    accounts.'
  span_range:
  - src:54e604a99bff#p60.3
  - src:54e604a99bff#p61.3
  decision: The White House changed its initial position and authorized the Secretary of Defense to brief the Democratic presidential
    candidate during the 1960 campaign.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The outgoing president chose case-by-case disclosure rather than a broad briefing on worldwide operations, approving
    discussion of Cuba and certain covert reconnaissance-satellite operations but no other subjects. The stated considerations
    were helping the incoming president while protecting confidential deliberations, including NSC proceedings; exclude the
    operational details of the programs themselves.
  span_range:
  - src:54e604a99bff#p68.2
  - src:54e604a99bff#p69.2
  decision: The outgoing president decides which CIA operations the director may disclose to the president-elect during the
    transition.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The briefers chose to acquaint the president-elect with the operation rather than ask him for a yea-or-nay decision.
    They cited the operation’s momentum and the untenable position of continuing without informing him; exclude the operational
    particulars of the proposed actions.
  span_range:
  - src:54e604a99bff#p64.2
  - src:54e604a99bff#p66.2
  decision: The CIA director and deputy director for plans decide to brief the president-elect on Cuba without seeking his
    approval or disapproval.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: After the president showed reluctance to receive intelligence through the usual channel, managers developed a shorter,
    more accessible publication; the military aide approved the trial, and the president began reading it. The account notes
    the managers acted without their superiors’ knowledge, making authority and institutional process relevant; exclude the
    underlying intelligence content.
  span_range:
  - src:54e604a99bff#p74.2
  - src:54e604a99bff#p75.2
  decision: CIA current-intelligence managers decide to create a president-specific briefing publication and route it to the
    president through his military aide.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: After considering political and security issues, the president postponed an announcement, directed that more aircraft
    be produced and deployed, and later disclosed the program. Keep the scenario focused on the timing and disclosure decision;
    exclude technical or operational details about the aircraft or its use.
  span_range:
  - src:54e604a99bff#p78.3
  - src:54e604a99bff#p79.2
  decision: The president decides to postpone public disclosure of the reconnaissance-aircraft program until aircraft production
    and deployment have advanced.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The agency chose a new publication designed around the president’s reading habits, rather than continuing the existing
    products and their wider readership. The reasons included concern about security from expanded circulation and doubt that
    the president read the Checklist; exclude the intelligence subjects covered in the publications.
  span_range:
  - src:54e604a99bff#p84.2
  - src:54e604a99bff#p85.2
  decision: The CIA director and senior managers decide to discontinue the Checklist and Review and replace them with a new
    presidential intelligence brief.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The existing brief was tailored to the outgoing administration, while the incoming president and his advisers needed
    more background and continuity; CIA leaders concurred in sending a new version, which the national security adviser-designate
    approved. Focus on the intelligence product and its presentation, not on how intelligence was collected.
  span_range:
  - src:54e604a99bff#p95.2
  - src:54e604a99bff#p95.3
  decision: CIA leadership decided to send the incoming administration a longer, redesigned President’s Daily Brief rather
    than rely on the outgoing administration’s version.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The adviser barred estimates from reaching the president-elect, rejecting the argument that they represented the
    Intelligence Community rather than a single agency. Examine the tension between controlling access and ensuring the president-elect
    receives community-wide analysis; exclude operational intelligence methods.
  span_range:
  - src:54e604a99bff#p97.2
  - src:54e604a99bff#p97.3
  decision: The incoming national security adviser decided that national intelligence estimates would not be sent to the president-elect.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The vice president already received the National Intelligence Daily; the director invited him for briefings and agreed
    to add the President’s Daily Brief and assign ongoing support. The stated reasons included preparing the vice president
    in case the president could no longer serve and avoiding a gap in the vice president’s knowledge; exclude collection or
    operational techniques.
  span_range:
  - src:54e604a99bff#p104.3
  - src:54e604a99bff#p105.2
  decision: The CIA Director decided to provide the vice president with the President’s Daily Brief and continuing intelligence
    support.
  content_domain: other:intelligence-support-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 14
  focus: The national security adviser had conveyed that the director should brief the council and then depart, but the director
    stayed when the president invited attendees to lunch and continued attending later meetings. The director’s stated reason
    was that policymakers might need factual updates during deliberations; exclude unrelated disputes over intelligence estimates.
  span_range:
  - src:54e604a99bff#p102.3
  - src:54e604a99bff#p102.3
  decision: The CIA Director decided to remain in National Security Council meetings after the intelligence briefing rather
    than leave before policy discussions.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: 'The decision followed competing recommendations about who should brief the candidate and when: the DCI proposed
    an initial meeting followed by professional briefings, while the national security advisor favored DCI-chaired sessions
    throughout. Focus on the chosen division of roles and timing; exclude the briefing content and travel arrangements.'
  span_range:
  - src:54e604a99bff#p115.1
  - src:54e604a99bff#p115.2
  decision: The president decided that the DCI would meet with the pre-nomination candidate to set briefing parameters, with
    intelligence professionals providing in-depth briefings after the nomination.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The DCI considered some questions outside the guidelines set by the president, and briefers limited later answers
    to essential facts rather than addressing complicated policy issues that had not been approved for discussion. Focus on
    the authority boundary and the choice to limit responses; exclude any operational details underlying the questions.
  span_range:
  - src:54e604a99bff#p123.2
  - src:54e604a99bff#p123.3
  decision: The DCI decided to keep answers to the candidate’s team within the president’s pre-election briefing guidelines
    and not address sensitive policy and operational questions beyond them.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The DCI weighed whether to stay against the risk of a political outcry and the need for the incoming president to
    have confidence in, and direct access to, the intelligence chief. Focus on the leadership and transition decision; exclude
    the sensitive program briefing that followed.
  span_range:
  - src:54e604a99bff#p127.3
  - src:54e604a99bff#p128.2
  decision: The DCI decided that he should leave office rather than remain through the presidential transition.
  content_domain: other:intelligence leadership
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 18
  focus: 'The decision point is the president’s choice of a daily intelligence-delivery process: work through the national
    security advisor or receive direct CIA feedback while reading the PDB. The passage says he believed this arrangement was
    good management and that the advisor could flag matters requiring presidential action; exclude the intelligence content
    itself.'
  span_range:
  - src:54e604a99bff#p139.3
  - src:54e604a99bff#p139.3
  decision: The president decides to receive the daily intelligence briefing through the national security advisor rather
    than have a CIA briefer present.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The DCI faced a choice between fuller disclosure and limiting detail because the recipient was a candidate, not yet
    president-elect, and the program was sensitive. The passage gives both security concerns, including the implications for
    a cooperating foreign partner, and the concern that the candidate might make statements he would later regret; exclude
    any operational details of the program.
  span_range:
  - src:54e604a99bff#p144.3
  - src:54e604a99bff#p145.2
  decision: The DCI decides how much sensitive covert-action information to disclose to a presidential candidate during a
    pre-election briefing.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is whether to allow copies of the PDB to circulate or to control access through presentation and
    retrieval. The president-elect sought to prevent inadvertent disclosure of sensitive sources and methods and believed
    tighter control would allow the Agency to include more sensitive material; exclude the contents of any intelligence reports.
  span_range:
  - src:54e604a99bff#p161.3
  - src:54e604a99bff#p161.3
  decision: The president-elect decides to tighten control of PDB access by showing it to authorized recipients and retrieving
    it rather than leaving copies with them.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The choice is whether to provide the challenger with intelligence briefings before inauguration or reserve them for
    the incoming administration. The outgoing president’s experience providing transition briefings and the established precedent
    support providing them; exclude the later details of briefing content and logistics.
  span_range:
  - src:54e604a99bff#p165.1
  - src:54e604a99bff#p166.2
  decision: The outgoing president approves intelligence briefings for the president-elect during the 1992 transition.
  content_domain: other:presidential-transition intelligence support
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 22
  focus: The decision is whether and when to establish a CIA presence to provide timely intelligence support during the transition.
    The passage describes waiting until the election was decided, then acting amid concern about having high-quality materials
    ready; exclude the office’s physical-security and communications arrangements.
  span_range:
  - src:54e604a99bff#p167.3
  - src:54e604a99bff#p168.2
  decision: The CIA director, with the outgoing president’s approval, establishes a Little Rock presence to support intelligence
    briefings for the president-elect after the election.
  content_domain: other:presidential-transition intelligence support
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 23
  focus: The president-elect controls the future distribution list and accepts the suggestion to include the Treasury secretary.
    The stated rationale is the growing importance of economic issues; exclude the separate choices about other recipients
    and the tailored supplement.
  span_range:
  - src:54e604a99bff#p169.3
  - src:54e604a99bff#p170.2
  decision: The president-elect decides to add the secretary of the treasury to regular presidential daily intelligence briefings
    after inauguration.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 24
  focus: The choice was to start briefings during the unresolved election or wait for the Court’s decision. Keep the focus
    on the timing and the stated concern about delay or anticipation of the legal outcome, not the logistics of delivering
    the briefings.
  span_range:
  - src:54e604a99bff#p194.2
  - src:54e604a99bff#p194.3
  decision: The outgoing president decided to begin intelligence briefings for the apparent president-elect before the Supreme
    Court resolved the election.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 25
  focus: The decision point is whether to brief the incoming president before inauguration or defer until the new administration
    was established, absent urgent developments. Include the competing concerns about readiness for sudden decisions and the
    transition team’s need to get settled; exclude the programs’ operational details.
  span_range:
  - src:54e604a99bff#p199.2
  - src:54e604a99bff#p199.3
  decision: CIA leadership decided to brief the president-elect on a broad range of covert-action and other sensitive programs
    shortly before inauguration.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 26
  focus: The decision point is whether to keep distribution narrow or circulate the brief more broadly. The account links
    narrow distribution to the president’s demand for more sensitive operational information; exclude the content or methods
    of any operations described in the brief.
  span_range:
  - src:54e604a99bff#p206.2
  - src:54e604a99bff#p206.3
  decision: The president decided to restrict distribution of the President’s Daily Brief to a small group of senior officials.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 27
  focus: The administration chose to provide both candidates comprehensive briefings on international developments while withholding
    information on intelligence programs and operations before the election. After the election, it allowed the president-elect
    access to the PDB and operational information, with advance approval required for briefings on covert action or other
    sensitive policy matters. Focus on the balance between equal treatment, transition needs, and protection of sensitive
    information; exclude operational details.
  span_range:
  - src:54e604a99bff#p218.2
  - src:54e604a99bff#p218.3
  decision: The outgoing administration decided what intelligence to provide presidential candidates before the election and
    the president-elect after it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 28
  focus: The administration considered delaying the briefing, as had occurred in a prior transition, but arranged briefings
    before inauguration, including on a politically charged program. The stated reason was the need to clear the air about
    ongoing activities and ensure the incoming administration was informed. Keep the focus on disclosure timing and oversight;
    exclude descriptions or demonstrations of techniques.
  span_range:
  - src:54e604a99bff#p232.3
  - src:54e604a99bff#p234.2
  decision: The outgoing administration decided to brief the president-elect on covert action programs before the inauguration
    rather than wait until afterward.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 29
  focus: The passage reports that the incoming president quickly imposed this limit, following campaign statements that torture
    undermined long-term security and damaged the country’s ability to gain international cooperation against terrorism. Treat
    this as a policy decision about permissible intelligence activity; exclude any description of interrogation methods.
  span_range:
  - src:54e604a99bff#p222.3
  - src:54e604a99bff#p223.2
  decision: The incoming president decided to limit CIA interrogation to techniques approved by the Army Field Manual.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 30
  focus: The president-elect chose new intelligence leadership despite the outgoing president’s recommendation to retain the
    experienced incumbents. The source links the choice to politically charged disputes over intelligence performance and
    interrogation practices, along with other considerations; exclude the later nomination and confirmation mechanics.
  span_range:
  - src:54e604a99bff#p242.2
  - src:54e604a99bff#p243.2
  decision: President-elect decides to replace the incumbent DNI and CIA Director rather than retain them.
  content_domain: other:intelligence-leadership
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 31
  focus: After the president found the usual oral briefing often unnecessary or repetitive, the DNI used most of the allotted
    time for later-arriving updates and material elaborating on the PDB. The decision was cleared with the national security
    advisor; exclude the mechanics of preparing or prioritizing individual items.
  span_range:
  - src:54e604a99bff#p243.3
  - src:54e604a99bff#p244.2
  decision: DNI shifts presidential briefing time toward newly available information rather than repeating material the president
    has read.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 32
  focus: When a candidate requested a topic outside the Intelligence Community’s proposed list, the rule was to inform the
    other major-party candidate and offer the same briefing. The DNI proposed this framework and the White House chief of
    staff approved it; exclude other briefing ground rules not needed to assess this reciprocity decision.
  span_range:
  - src:54e604a99bff#p255.2
  - src:54e604a99bff#p255.3
  decision: DNI establishes reciprocal access to a requested preelection briefing topic to preserve nonpartisanship.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 33
  focus: The DNI chose continuity for the sitting president’s briefer while selecting one different lead for both candidates
    and, after the election, the president-elect. The DNI favored this arrangement to support continuity and avoid politicization,
    and delegated topic and expert selection to the lead briefer; exclude those subordinate selection tasks.
  span_range:
  - src:54e604a99bff#p256.2
  - src:54e604a99bff#p256.3
  decision: DNI assigns a separate career intelligence officer to lead candidate briefings through the transition, distinct
    from the incumbent president’s briefer.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 34
  focus: The decision was to continue providing briefings to the candidate rather than withhold them. The stated basis was
    that nominees received briefings by virtue of their status, without separate security clearances, and that access should
    be even-handed and nonpartisan; exclude the broader political dispute over the candidates’ handling of classified information.
  span_range:
  - src:54e604a99bff#p268.3
  - src:54e604a99bff#p269.2
  decision: The Director of National Intelligence decided whether to withhold classified briefings from an officially nominated
    presidential candidate at the request of political leaders.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 35
  focus: The FBI Director chose to disclose the dossier’s existence and contents in a private exchange, explaining that the
    material’s circulation created a potential vulnerability. Keep the focus on the disclosure judgment and its stated rationale;
    exclude the truth of the allegations and the subsequent dispute over who leaked the dossier.
  span_range:
  - src:54e604a99bff#p272.3
  - src:54e604a99bff#p273.2
  decision: The FBI Director decided whether to alert the president-elect that a dossier containing unsubstantiated allegations
    about him was circulating.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 36
  focus: The decision was to task the broader Intelligence Community with finding the facts and presenting findings before
    the President left office; the CIA, FBI, and NSA contributed. The stated reason was the importance of the election-interference
    issue. Exclude the agencies’ collection methods and the assessment’s detailed evidentiary claims.
  span_range:
  - src:54e604a99bff#p269.3
  - src:54e604a99bff#p270.2
  decision: The President directed an Intelligence Community-wide assessment of Russian interference in the election, rather
    than limiting the work to the CIA.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 37
  focus: The decision was whether to use the briefing for substantive intelligence or for sensitive activities. The DCI chose
    substantive issues, reserving sensitive activities for after inauguration; exclude any operational details about those
    activities.
  span_range:
  - src:54e604a99bff#p294.2
  - src:54e604a99bff#p294.2
  decision: The outgoing DCI decided to use the sole pre-inauguration briefing opportunity with the president-elect to cover
    substantive issues and defer sensitive activities until after inauguration.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 38
  focus: The decision point is whether to proceed with the program or act on the senior leaders’ doubts about its probable
    outcome. The passage says they felt obligated to act and did not want to let down the outgoing president pressing for
    action or the incoming president committed to the program; exclude operational methods and execution details.
  span_range:
  - src:54e604a99bff#p301.3
  - src:54e604a99bff#p301.3
  decision: CIA senior leaders decided to proceed with the Cuba program despite their doubts about its likely outcome.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 39
  focus: The decision was whether to offer a different interpretation and policy advice when the president sought a CIA briefing
    beyond the Army’s assessment, or to stay within an intelligence role. The DCI chose to stick to facts and make no recommendations;
    exclude the substance of any military operational advice.
  span_range:
  - src:54e604a99bff#p301.2
  - src:54e604a99bff#p301.2
  decision: The DCI decided to provide the president with facts and analysis on Korea without making policy recommendations.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
