episodes:
- n: 1
  focus: The estimate lays out three force-goal options, explains why leaders viewed destroying US nuclear forces before launch
    as impracticable and a city-only capability as inadequate, and concludes they would seek a larger capability. Keep the
    focus on this strategic force-policy choice; exclude weapon design, deployment details, and operational targeting.
  span_range:
  - src:8e62988756f1#p9.9
  - src:8e62988756f1#p10.3
  decision: Soviet leaders chose to pursue a larger strategic nuclear strike capability rather than a first-strike force or
    a capability limited to attacking cities.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The memorandum describes the post-Cuban-crisis imbalance that prompted the decision and identifies the selected deployment
    approach, including the decision not to match the US bomber fleet numerically. Focus on the resource and force-policy
    choice; exclude technical characteristics and deployment details.
  span_range:
  - src:8e62988756f1#p23.3
  - src:8e62988756f1#p25.2
  decision: Soviet leaders chose a sustained, high-priority strategic-force deployment effort, centered on ICBMs and ballistic-missile
    submarines, rather than continuing their prior limited buildup or matching US bomber numbers.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue the existing Moscow ABM deployment or shift to a different system after
    recognizing that multiple warheads and penetration aids could defeat the original design. The source cites the old system’s
    limitations and says the replacement system was cheaper and could be deployed faster; exclude technical details of how
    the system would engage targets.
  span_range:
  - src:8e62988756f1#p29.2
  - src:8e62988756f1#p29.3
  decision: Soviet leaders abandoned half of the ABM sites begun around Moscow and pursued a new ABM system.
  content_domain: other:military-force-planning
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to enter arms-limitation negotiations and what strategic aims to pursue there. The
    source gives political and strategic reasons, including stabilizing the relationship, recognition of equal security, and
    narrowing competition while preserving modernization; exclude operational details of weapons or force employment.
  span_range:
  - src:8e62988756f1#p31.6
  - src:8e62988756f1#p32.4
  decision: Soviet leaders chose to enter SALT negotiations in 1968 while seeking limits on aspects of strategic competition
    rather than an end to modernization.
  content_domain: other:arms-control-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to accept treaty limits on ABM defenses or continue pursuing broader active defenses.
    The source says the agreement likely reflected a desire to limit competition where the United States had a technical advantage,
    while also describing the defensive tradeoff; exclude operational details of missile defense or attack planning.
  span_range:
  - src:8e62988756f1#p44.4
  - src:8e62988756f1#p45.4
  decision: Soviet leaders agreed to the ABM Treaty, accepting limits on active missile defenses beyond Moscow and relying
    primarily on offensive deterrence against other missile threats.
  content_domain: other:arms-control-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to anchor projections to the treaty ceiling or retain wider uncertainty about future
    force levels. The passage says SALT reduced uncertainty and that projections of treaty-limited forces then accurately
    reflected the Soviet force. Exclude judgments about whether the Soviets should enter or comply with SALT; the stated decision
    is an analytic one.
  span_range:
  - src:8e62988756f1#p64.6
  - src:8e62988756f1#p64.6
  decision: The Intelligence Community chose to use the SALT ceiling, together with an assumption of Soviet compliance, to
    govern projections of Soviet strategic nuclear delivery vehicles beginning in 1971.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: 'The decision point is which projection to treat as the baseline amid economic and political uncertainty: continuity
    under current pressures, or a more substantial policy discontinuity. The report identifies the baseline as most consistent
    with available evidence and explains that external challenges, doctrine, and defense institutions were expected to outweigh
    economic concerns to a large extent. Exclude the Soviet leaders’ hypothetical policy choices; the decision here is the
    analysts’ choice of forecast.'
  span_range:
  - src:8e62988756f1#p77.3
  - src:8e62988756f1#p77.5
  decision: Intelligence Community analysts chose a baseline projection of Soviet military development through 1990, while
    also presenting less likely alternative projections.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
