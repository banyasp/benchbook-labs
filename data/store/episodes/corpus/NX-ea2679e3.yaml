- n: 1
  focus: The decision point is whether to carry the campaign into Northern territory or not, with the commander seeking a
    battlefield victory that could strengthen the Confederacy’s political position, affect Northern elections, and encourage
    foreign recognition. Keep the focus on the strategic choice and its stated reasons; exclude the march plan, troop dispositions,
    and bridge objectives as operational details.
  span_range:
  - src:9b8cfe2d3eaa#p3.1
  - src:9b8cfe2d3eaa#p3.2
  decision: The Confederate army commander chose to invade the North after Second Bull Run.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is how to proceed after the orders revealed that the opposing army was divided: exploit that
    information with an immediate attack or continue cautiously. The passage attributes caution to the commander’s belief,
    based on faulty intelligence, that the opposing army was substantially larger; exclude the mechanics of any attack.'
  span_range:
  - src:9b8cfe2d3eaa#p4.4
  - src:9b8cfe2d3eaa#p4.5
  decision: The Union army commander chose to advance cautiously rather than attack decisively after receiving the captured
    Confederate orders.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether and when to issue the proclamation, with the president treating a Union victory as
    necessary to give the measure force and credibility. The passage gives military, political, psychological, and foreign-public-opinion
    considerations; exclude broader counterfactual claims about the war’s outcome.
  span_range:
  - src:9b8cfe2d3eaa#p5.4
  - src:9b8cfe2d3eaa#p5.5
  decision: The Union president chose to issue the Emancipation Proclamation after Antietam rather than issue it following
    a Northern defeat.
  content_domain: other:wartime executive policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
