episodes:
- n: 1
  focus: Treat this as an estimative judgment amid competing interpretations of the buildup, including the possibility of
    a submarine base and the contrary view of the Director of Central Intelligence. Focus on the Board’s assessment and its
    stated reliance on prior Soviet practice and policy; exclude the later operational discovery of the missiles.
  span_range:
  - src:1292cd7cd1be#p1.47
  - src:1292cd7cd1be#p1.51
  decision: The Intelligence Board issued an estimate that the Soviet Union was unlikely to introduce offensive strategic
    weapons into Cuba.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: Frame the choice as a policy decision between the military options under Executive Committee consideration. The source
    says the President sought to demonstrate resolve while avoiding pushing the Soviet leader beyond the brink, and to gain
    time and leverage for negotiations; exclude operational plans for either option.
  span_range:
  - src:1292cd7cd1be#p1.114
  - src:1292cd7cd1be#p1.122
  decision: The President chose a selective naval blockade of offensive weapons deliveries to Cuba rather than airstrikes.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: Focus on the choice to pursue an immediate settlement based on stopping work on the Cuban sites, removing the offensive
    weapons, lifting the quarantine, and assuring against invasion, while leaving the Turkey issue for possible broader discussions.
    Exclude diplomatic wording or any unsupported claims about private motives for omitting Turkey.
  span_range:
  - src:1292cd7cd1be#p1.162
  - src:1292cd7cd1be#p1.174
  decision: The President chose to answer the Soviet leader’s first message on withdrawal terms, without including withdrawal
    of U.S. missiles from Turkey in the immediate agreement.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: Treat this as a disclosure decision after public rumors and congressional debate persisted despite classified evidence.
    The source links the decision to the need to show the public the basis for the government’s conclusions; exclude details
    of imagery exploitation or the mechanics of preparing the briefing.
  span_range:
  - src:1292cd7cd1be#p1.205
  - src:1292cd7cd1be#p1.213
  decision: The President decided to declassify and share photographic evidence of the Soviet buildup and withdrawal with
    the American public.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
