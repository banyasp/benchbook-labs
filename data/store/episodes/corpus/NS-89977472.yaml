  focus: The decision point is whether to authorize engagement or withhold it pending confirmation and the required ground-control
    authority. The pilots had mistaken the patrol’s markings for hostile indicators after being told friendly forces were
    well clear; the Board found the engagement was not authorized by MANILA HOTEL. Exclude attack mechanics.
  span_range:
  - src:e916fbc16632#p1.376
  - src:e916fbc16632#p1.400
  decision: POPOFF 35 decided whether to authorize POPOFF 36 to engage vehicles believed to be hostile, without obtaining
    MANILA HOTEL’s clearance for that newly identified target.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 2
  focus: The decision point is whether to continue or cease the engagement after red smoke was seen and a warning about friendly
    forces and an abort instruction were received. The source says POPOFF 35 stopped a third attack; exclude details of attack
    execution.
  span_range:
  - src:e916fbc16632#p1.381
  - src:e916fbc16632#p1.381
  decision: POPOFF 35 decided to stop further engagement after indications that the vehicles were friendly and MANILA 34’s
