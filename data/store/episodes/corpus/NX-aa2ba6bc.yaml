episodes:
- n: 1
  focus: The delegation could accept the Soviet attempt to link technical discussions to stopping tests or insist on the technical
    agenda. It held to the latter despite the risk that the USSR could exploit a breakdown for propaganda; exclude the technical
    design of the detection system.
  span_range:
  - src:3736371d3f84#p5.3
  - src:3736371d3f84#p5.3
  decision: The Western delegation chose to keep the conference focused on technical detection methods rather than agree in
    advance that a successful conference would require nuclear testing to cease.
  content_domain: other:arms-control policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The Soviet delegation could continue to defer agreement on inspection or accept the inspection principle. The passage
    connects acceptance to the goal of reaching an agreed report; exclude the practical methods of conducting inspections.
  span_range:
  - src:3736371d3f84#p10.4
  - src:3736371d3f84#p11.2
  decision: The Soviet delegation agreed to include site inspection for suspected nuclear explosions in the conference conclusions.
  content_domain: other:arms-control policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The analyst weighed the possibility that Soviet negotiating behavior reflected plans for concealed testing against
    the interpretation that the USSR sought to avoid politically sensitive verification arrangements while reaching agreement.
    The conclusion relied on Soviet concessions and support for a highly sensitive system; exclude the technical design of
    that system.
  span_range:
  - src:3736371d3f84#p11.2
  - src:3736371d3f84#p12.1
  decision: The article's analyst assessed that the USSR did not then intend to conduct a concealed nuclear test during a
    moratorium and would openly abrogate an agreement rather than risk detection.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
