  focus: The decision point is how to distribute finite development resources when Jolo City was assessed as the campaign’s
    center of gravity. Keep the focus on that allocation and its rationale; exclude the article’s later assessment of the
    projects’ effectiveness.
  span_range:
  - src:06372e5e6856#p2.25
  - src:06372e5e6856#p3.6
  decision: Higher headquarters decided to allocate a greater share of limited humanitarian assistance to Jolo City and surrounding
    villages rather than to other parts of the island.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the commanders’ selection of a locally useful, modest project after considering what larger
    projects had failed to accomplish. Include the village’s hygiene needs, local participation and maintainability as reasons;
    exclude construction instructions and the project’s later intelligence or military effects.
  span_range:
  - src:06372e5e6856#p6.8
  - src:06372e5e6856#p7.9
  decision: The AFP and US commanders decided to make an outhouse, rather than a large project such as a new school complex,
    their village development project.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to scale the locally requested projects concurrently or sequentially. The stated reasons
    were to extend AFP influence and keep insurgents uncertain about AFP priorities; exclude squad-level assignments and intelligence-gathering
    details.
  span_range:
