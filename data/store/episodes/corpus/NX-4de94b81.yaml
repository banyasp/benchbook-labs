title: Guarding Against Politicization
collection: studies-in-intelligence
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: The decision is to change the review and coordination process rather than retain its existing layers and practices.
    Focus on the DCI’s stated aim of reducing distortion and misperception; exclude general advice about how analysts and
    managers should communicate.
  span_range:
  - src:c9e4cf01e070#p7.11
  - src:c9e4cf01e070#p7.13
  decision: The DCI directs the DDI to reduce layers of DI review and encourage fuller debate and alternative views in analytic
    products.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision is to create an independent, informal channel with access to senior leadership and analytic products,
    rather than rely only on existing complaint routes. Focus on the stated purpose and authority of the role; exclude the
    appointee’s personal identity and general discussion of workplace trust.
  span_range:
  - src:c9e4cf01e070#p7.14
  - src:c9e4cf01e070#p7.15
  decision: The DCI directs the DDI to appoint a full-time ombudsman to handle politicization concerns across the Agency and
    the NIC.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision is to separate covert-action implementers from formal coordination of finished intelligence, rather
    than allow them to participate in that process. Focus on the stated need to insulate intelligence production from the
    influence of those implementing or supervising covert action; exclude operational details of covert action.
  span_range:
  - src:c9e4cf01e070#p8.2
  - src:c9e4cf01e070#p8.14
  decision: The DCI directs that officers responsible for implementing covert action not participate in formal coordination
    of finished analytic products in integrated policy-and-analysis settings.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
