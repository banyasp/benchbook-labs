episodes:
- n: 1
  focus: The decision point is whether to continue seeking efficiencies within the defense sector or impose stronger cuts
    and redirect resources to consumer and civilian investment. The estimate cites stalled economic growth, consumer dissatisfaction,
    and Five-Year Plan deadlines as reasons; exclude operational force planning and assessments of how the reductions affect
    military capability.
  span_range:
  - src:92da36d1d457#p5.3
  - src:92da36d1d457#p5.7
  decision: The Soviet leadership chose in 1988 to move beyond efficiency measures and shift resources from defense to civilian
    priorities through force, spending, and production reductions.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether defense doctrine and resource choices remain primarily shaped by the professional military
    hierarchy or are directed more firmly by party leadership. The source connects the shift to party control and economic
    priorities; exclude the technical organization or conduct of military operations.
  span_range:
  - src:92da36d1d457#p12.10
  - src:92da36d1d457#p13.4
  decision: Gorbachev and the Soviet party leadership chose to reassert party authority over military doctrine and defense-resource
    decisions, promoting reasonable and defensive sufficiency.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the estimate of whether further defense cuts and resource shifts would follow the already announced
    measures. The majority forecast continued reductions, while the DIA alternative emphasized uncertainty and judged large
    additional reductions less likely; exclude operational military judgments unrelated to this forecast.
  span_range:
  - src:92da36d1d457#p5.7
  - src:92da36d1d457#p10.5
  decision: The Intelligence Community’s majority assessed that the Soviet leadership would continue shifting resources from
    defense to the civilian sector, despite the DIA Director’s more cautious alternative judgment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The analytic choice is between treating the changes as a real reduction in capability and viewing them as less consequential
    than advertised. Include the assessment of withdrawals alongside restructuring and modernization, and the evidence that
    equipment from departing units was being used in remaining divisions; exclude technical force details beyond what supports
    the judgment.
  span_range:
  - src:92da36d1d457#p43.3
  - src:92da36d1d457#p44.5
  decision: The National Intelligence Officer responsible for general purpose forces and coordinating intelligence representatives
    judged that the Soviet withdrawal from Eastern Europe was genuine and would reduce the combat capability of remaining
    Soviet forces there.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The analytic choice was between judging the Pact still capable of an unreinforced attack and judging that capability
    virtually eliminated. The assessment cited completed force cuts and political turmoil that undermined reliance on non-Soviet
    Pact forces and Soviet transit through Eastern Europe; exclude operational attack planning.
  span_range:
  - src:92da36d1d457#p58.4
  - src:92da36d1d457#p58.8
  decision: The National Intelligence Council analysts assessed whether completed Warsaw Pact unilateral reductions left the
    Pact able to launch an unreinforced conventional attack on NATO.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The analysts weighed the possibility that the Pact could attack with less preparation against the assessment that
    it would need substantial reinforcements and mobilization, extending warning time. The estimate states assumptions and
    acknowledges a less-prepared attack possibility; exclude operational advice on attack execution or force movement.
  span_range:
  - src:92da36d1d457#p75.4
  - src:92da36d1d457#p75.8
  decision: The National Intelligence Council analysts assessed how Warsaw Pact force reductions affected the warning time
    NATO could expect before a conventional attack.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The estimate chooses to withhold a judgment that fundamental change has begun and to adopt a wait-and-see stance,
    despite the possibility of a less threatening doctrine. The stated reasons are that the evidence does not show changes
    in core defense practices and that key doctrinal issues remain unsettled; exclude the underlying weapons and force details.
  span_range:
  - src:92da36d1d457#p82.4
  - src:92da36d1d457#p82.5
  decision: US Intelligence Community estimators decide whether to assess Gorbachev’s reforms as a fundamental change in Soviet
    nuclear-war policy or retain a wait-and-see assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The estimate expects Gorbachev to avoid unilateral cuts to strategic forces and continue pursuing deep negotiated
    reductions and slower defense-spending growth. It gives political and military reasons for avoiding unilateral cuts, alongside
    economic and foreign-policy incentives for arms control; exclude details about force composition or employment.
  span_range:
  - src:92da36d1d457#p85.5
  - src:92da36d1d457#p85.5
  decision: Gorbachev decides whether to make unilateral strategic-force cuts or seek reductions through arms control while
    slowing defense spending.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The passage says Soviet leaders have adjusted production and deployment plans in preparation for START, with political
    leaders seeking expenditure reductions and a climate favorable to foreign aid, and military leaders seeking modernization,
    strategic balance, and predictability. Treat this as a decision to plan around anticipated treaty limits, not as a settled
    decision to implement the treaty; exclude operational force details.
  span_range:
  - src:92da36d1d457#p103.3
  - src:92da36d1d457#p103.5
  decision: Soviet political and military leaders decide whether to adjust strategic programs to anticipated START limits
    or continue building beyond those levels.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is the NIE’s estimate of likely military cohesion, weighing continued unit integrity and support
    for civilian authority against worsening shortages, weakened discipline, and possible local autonomy or collapse. Exclude
    Soviet commanders’ possible operational actions and treat the less-likely outcomes as alternatives considered, not separate
    decisions.
  span_range:
  - src:92da36d1d457#p115.3
  - src:92da36d1d457#p116.6
  decision: The Director of Central Intelligence, advised by the Intelligence Community, judges whether the Soviet armed forces
    are likely to maintain cohesion through the winter or instead rapidly fragment or collapse.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
