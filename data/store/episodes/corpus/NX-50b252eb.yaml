episodes:
- n: 1
  focus: The decision point is whether to remain in Guatemala despite the State Department’s concern that the project could
    undermine the host government, or move to alternatives that were opposed, unavailable, or would cause delay and logistical
    problems. Exclude the specific mechanics of training and base operations.
  span_range:
  - src:5e34c18e2c92#p1.159
  - src:5e34c18e2c92#p1.160
  decision: Project authorities chose to keep the Cuban force’s training base in Guatemala rather than withdraw or relocate
    it.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision weighs the military advantages of Trinidad against State Department concerns about attribution, regional
    and international reaction, and possible retaliation; the ensuing guidance sought a quieter landing that appeared to arise
    internally. Exclude the detailed landing, air-attack, and deception plans.
  span_range:
  - src:5e34c18e2c92#p1.241
  - src:5e34c18e2c92#p1.248
  decision: The President rejected the Trinidad plan and directed that alternative methods of employing the Cuban forces be
    studied.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to proceed on the proposed early-April date or delay for a major diplomatic visit,
    with the account noting that the later date reduced the available moonlight. Exclude the operational mechanics of the
    landing and the separate subsequent postponement to 17 April.
  span_range:
  - src:5e34c18e2c92#p1.286
  - src:5e34c18e2c92#p1.288
  decision: The President chose not to conduct the operation before 10 April, postponing the proposed 3 April date because
    of the scheduled visit by the British Prime Minister.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to retain the cancellation or restore the planned attacks, after senior officials warned
    that Castro still had an effective air capability and that the landing force and its supply ships were at risk. The account
    identifies the higher-level policy limit on D-Day attacks and records the President’s decision; exclude the detailed target
    list and the mechanics of air operations.
  span_range:
  - src:5e34c18e2c92#p1.334
  - src:5e34c18e2c92#p1.397
  decision: The President, on the Secretary of State’s recommendation, kept the cancellation of the planned D-Day air attacks
    in effect rather than reconsidering it.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 5
  focus: The decision is whether to proceed with the loaded supply craft or cancel the run and use air supply instead. The
    stated reasons are the craft’s slow speed, daylight arrival, and the assessed certainty that enemy fighters would sink
    them; exclude the operational details of the route and unloading procedure.
  span_range:
  - src:5e34c18e2c92#p1.427
  - src:5e34c18e2c92#p1.429
  decision: Operation Headquarters cancelled the planned nighttime supply run to the beach after judging that the landing
    craft would arrive in daylight under enemy air threat.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to order another attempt at the original landing or redirect the group to the main
    force. The account gives the commander’s assessment that the group would not land as ordered and records the redirection;
    exclude the landing and navigation procedures.
  span_range:
  - src:5e34c18e2c92#p1.370
  - src:5e34c18e2c92#p1.374
  decision: Operation Headquarters redirected the Diaz Group to join the main force at Zapata after concluding that its repeated
    failure to land reflected failed leadership.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision was whether to intervene militarily through either of two proposed measures or refrain from both. The
    account gives concerns about alienating Asian neutrals, undermining a possible political accommodation with Moscow, and
    disagreement within the administration; exclude operational details of the proposed air action.
  span_range:
  - src:5e34c18e2c92#p1.723
  - src:5e34c18e2c92#p1.726
  decision: The President decides not to use either air action against the airlift or SEATO forces to support the pro-U.S.
    side in Laos.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The decision concerns the extent of air support authorized for the invasion, with political concerns about masked
    aggression and international reaction weighed against military assessments of what the operation required. Treat the restrictions
    as one decision to constrain air support; exclude the operational mechanics of conducting the strikes.
  span_range:
  - src:5e34c18e2c92#p1.766
  - src:5e34c18e2c92#p1.776
  decision: The President decides to bar U.S. airpower from being on call and limit the exile force to two pre-invasion air
    strikes.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 9
  focus: After the first strike, the decision was whether to proceed with the next planned strike or cancel it; CIA officials
    warned that cancellation would leave ships and troops vulnerable, while the account says political considerations were
    taking precedence. Exclude discussion of how the strike would have been carried out.
  span_range:
  - src:5e34c18e2c92#p1.792
  - src:5e34c18e2c92#p1.795
  decision: The President, acting through the Secretary of State, cancels the planned air strike on the morning of the landing.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 10
  focus: The decision point is whether to commit U.S. airpower after the intelligence official said the expedition was at
    the point of no return and the men ashore were doomed without it. The President’s compromise authorized limited cover
    despite opposition from the Secretary of State and others; exclude the specific timing and operational details of the
    cover.
  span_range:
  - src:5e34c18e2c92#p1.806
  - src:5e34c18e2c92#p1.808
  decision: The President decides whether to authorize carrier aircraft to provide air cover for the landing force and its
    ships.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
