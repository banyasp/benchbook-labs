episodes:
- n: 1
  focus: The chiefs were assigned to define the committee’s functions, and the Army and Navy proposed competing roles for
    it. The Navy’s factual-only position prevailed because the Army needed Navy agreement to create a joint committee; exclude
    the later order to produce an estimate in violation of the charter.
  span_range:
  - src:2a8fd0b67fd8#p3.3
  - src:2a8fd0b67fd8#p3.3
  decision: The Army and Navy planning chiefs decide whether the interdepartmental intelligence committee may make estimates
    or must limit itself to factual evidence.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The staff’s proposal responded to a headless committee that produced vague estimates and to competing plans that
    excluded interdepartmental coordination. The resulting recommendation gave the DCI a central estimating role while requiring
    consultation with departmental intelligence chiefs and reporting their concurrence or dissent; exclude Truman’s later
    adoption and subsequent implementation.
  span_range:
  - src:2a8fd0b67fd8#p5.4
  - src:2a8fd0b67fd8#p7.1
  decision: The Joint Intelligence Staff chooses and recommends an interdepartmental system for producing national intelligence
    estimates, including the Director of Central Intelligence’s role and how departmental dissent is recorded.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
