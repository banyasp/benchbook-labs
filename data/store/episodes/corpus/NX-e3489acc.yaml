title: ICD 206 Sourcing Requirements for Disseminated Analytic Products (2007)
collection: doctrine
doctrine: true
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: When urgent requirements make it infeasible to include all appropriate sourcing before dissemination, the directive
    requires reissuance with sourcing as soon as feasible and within 30 days. The decision point is the timing tradeoff between
    delaying dissemination and issuing the product promptly with later correction; exclude operational details of any crisis
    or military operation.
  span_range:
  - src:2dc3dc3044e6#p1.72
  - src:2dc3dc3044e6#p1.72
  decision: The producing IC element decides whether to disseminate a covered analytic product before its sourcing information
    is complete and reissue it later.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: For products intended for public release, the directive specifies that sourcing information will be removed before
    publication, within the wider requirements for classification, control markings, and foreign disclosure. Focus on the
    policy choice about public-release sourcing; exclude methods for sanitizing or preparing the released product.
  span_range:
  - src:2dc3dc3044e6#p1.61
  - src:2dc3dc3044e6#p1.62
  decision: The IC element preparing a covered analytic product for public release decides whether to retain or remove sourcing
    information.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: When necessary to keep an endnote within the main body’s classification, the directive permits omitting one or more
    source-reference elements while retaining enough information to find the source in an appropriately authorized system.
    Focus on the balance between classification limits and source discoverability; exclude technical procedures for locating
    sources.
  span_range:
  - src:2dc3dc3044e6#p1.64
  - src:2dc3dc3044e6#p1.65
  decision: The producer of a downgraded or sanitized covered analytic product decides whether to omit sourcing-citation elements
    that would exceed the classification of the main body.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
