  focus: After a study found that critical information could take more than 24 hours to reach the White House and averaged
    nine and a half hours, the President approved the recommendation to address the problem, leading to action on communications
    facilities and procedures. Treat this as the policy decision to pursue reform rather than as a decision about the later
    operation of the CRITIC system.
