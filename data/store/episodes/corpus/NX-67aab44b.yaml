episodes:
- n: 1
  focus: The decision point is whether to consolidate the groups or leave them separate, and why CIA should provide an independent
    assessment alongside military intelligence. Keep the focus on analytic independence and the stated concern about worst-case
    judgments; exclude operational intelligence methods.
  span_range:
  - src:718ba8583283#p1.2
  - src:718ba8583283#p1.11
  decision: The DCI and DDI chose to combine the CIA’s separate military-analysis groups into a single Office of Strategic
    Research.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether and how to change the estimate process after the White House criticized the 1969 estimate
    for insufficient intelligence input. Include the new, more detailed format and alternative outcomes; exclude the estimate’s
    substantive military findings.
  span_range:
  - src:718ba8583283#p3.5
  - src:718ba8583283#p3.5
  decision: The DCI chose to revise the process for the Soviet strategic-forces estimate, including greater OSR and DS&T involvement
    in drafting CIA’s contribution.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to use competitive analysis in response to challenges to the accuracy of prior estimates.
    Include the stated team structure and the context of the accuracy challenge; exclude the teams’ substantive conclusions
    except as needed to identify the decision.
  span_range:
  - src:718ba8583283#p6.3
  - src:718ba8583283#p6.4
  decision: The DCI agreed to the PFIAB request for competitive analysis of the 1976 Soviet strategic estimate using an IC
    team and an outside-experts team.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to retain functional offices or reorganize around regional analysis, with the resulting
    placement of OSR analysts and work. The stated rationale was to better serve intelligence consumers, most of whom had
    a regional focus; exclude operational intelligence methods.
  span_range:
  - src:718ba8583283#p8.5
  - src:718ba8583283#p8.14
  decision: The deputy director for operations proposed, and the DCI approved, replacing NFAC’s functional organization with
    regional offices, dissolving OSR in the process.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
