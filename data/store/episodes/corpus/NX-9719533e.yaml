- n: 2
  focus: The decision point is whether MSF should continue operating in-country or withdraw, given its assessment that the
    perceived similarity between its vehicles and Coalition vehicles put its personnel at increased risk. Keep the focus on
    the organization’s safety judgment and stated rationale; exclude operational details about vehicles.
  span_range:
