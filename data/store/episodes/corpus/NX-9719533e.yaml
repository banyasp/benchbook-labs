  focus: The decision point is whether to institutionalize interagency coordination in a command structure incorporating State,
    USAID, and other components, or retain the prior fragmented arrangement. Focus on the rationale of reducing ad hoc coordination
    and addressing the complexity of pursuing diplomatic, economic, and informational objectives across Africa; exclude operational
    activities of the command.
