episodes:
- n: 1
  focus: The decision point is whether to keep the photographic subsystem within WS-117L or separate it under joint CIA–Air
    Force management. The passage presents separation as offering the prospect of earlier success and says the U-2 development
    model informed the choice; exclude technical design and collection details.
  span_range:
  - src:1b414b2077b8#p20.1
  - src:1b414b2077b8#p20.3
  decision: Joint CIA–Air Force program leadership decides to separate CORONA’s photographic subsystem from WS-117L and manage
    it as a covert joint project.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision is whether to keep the historical imagery classified or release it for public, scientific, and historical
    use. The task forces concluded that the imagery had unusual research value and that declassification presented no national-security
    threat; exclude the technical content of the imagery and its collection.
  span_range:
  - src:1b414b2077b8#p14.3
  - src:1b414b2077b8#p14.4
  decision: The President decides to declassify more than 800,000 images from early satellite reconnaissance systems.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The passage frames persistence versus abandoning the program and explains the choice through urgent intelligence
    gaps, uncertainty about Soviet capabilities, and limits on U-2 coverage. Keep the decision at the program level; exclude
    the technical details of satellite operation and recovery.
  span_range:
  - src:1b414b2077b8#p35.2
  - src:1b414b2077b8#p35.3
  decision: CORONA program leadership chose to continue the program despite repeated technical failures.
  content_domain: other:reconnaissance program policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to pause launches for corrective work or continue launching; the passage states that
    a standdown was used to permit intensive R&D to identify and address failure causes. Exclude the technical failure mechanisms
    and corrective procedures themselves.
  span_range:
  - src:1b414b2077b8#p35.4
  - src:1b414b2077b8#p35.4
  decision: CORONA leadership imposed a standdown to allow intensive research and development after repeated mission failures.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The passage describes a directive following discovery of coins in a recovered payload; the choice was to tolerate
    or prohibit the practice, and the office chose prohibition. Focus on program control and accountability, not payload design
    or launch procedures.
  span_range:
  - src:1b414b2077b8#p41.5
  - src:1b414b2077b8#p42.3
  decision: The Washington CORONA program office directed the West Coast project office to stop personnel from adding unauthorized
    souvenirs to payloads.
  content_domain: other:program governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The agreement weighs the intelligence value of theater access against the sensitivity of the material and the absence
    of secure transmission arrangements. Keep the scenario about dissemination authority and safeguards; exclude transmission
    procedures.
  span_range:
  - src:1b414b2077b8#p73.4
  - src:1b414b2077b8#p73.5
  decision: The participating agencies decide not to transmit the OAK report to theater while secure arrangements are not
    established.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: After experience with a prior mission, COMOR recommends accepting delays when needed to preserve the quality of duplicate
    materials. The stated reason is that enlargement is required before exploitation and poor-quality duplicates would impair
    it; exclude technical reproduction instructions.
  span_range:
  - src:1b414b2077b8#p91.9
  - src:1b414b2077b8#p92.8
  decision: COMOR prioritizes the quality of duplicate photographic materials over faster delivery for exploitation.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision establishes strict controls for satellite-reconnaissance products and makes agency heads responsible
    for selecting personnel whose roles require access. The stated considerations include the sensitivity of the products
    and the need to limit access; focus on authorization and oversight, not implementation details of the control system.
  span_range:
  - src:1b414b2077b8#p88.6
  - src:1b414b2077b8#p88.8
  decision: The President approves a special TALENT-KEYHOLE security system and limits access to personnel with major national-security
    needs.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The Board is asked to approve revised billet schedules after agencies re-examine who needs access; the review reduces
    the proposed totals and distinguishes functional need from access based merely on position. Keep the scenario focused
    on access governance and the balance between mission needs and limiting exposure; do not infer the unreadable totals.
  span_range:
  - src:1b414b2077b8#p99.6
  - src:1b414b2077b8#p100.3
  decision: The US Intelligence Board considers approving revised, reduced agency billets for access to TALENT-KEYHOLE material
    after renewed scrutiny of functional need.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The estimate presents a majority judgment and a materially higher dissent, including competing assessments of the
    force and its threat. The majority cites new information as providing a firmer basis; the dissent gives its own supporting
    considerations. Keep the scenario about evidence evaluation and uncertainty, not operational response.
  span_range:
  - src:1b414b2077b8#p138.6
  - src:1b414b2077b8#p141.8
  decision: The interagency estimators adopt a substantially lower estimate of current Soviet ICBM strength than the USAF
    intelligence representative’s dissenting estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is how to assess current force levels given incomplete coverage and differing judgments within
    the intelligence community. Reconstruct the bounded estimate and its stated uncertainty; exclude launch procedures and
    other operational characteristics.
  span_range:
  - src:1b414b2077b8#p150.3
  - src:1b414b2077b8#p151.3
  decision: The intelligence community estimates the USSR’s current operational ICBM capability as a range rather than a single
    precise force level.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The decision point is the force-level estimate drawn from photographic coverage and other evidence, despite uncertainty
    about individual sites’ operational status and missile types. Focus on the evidentiary basis and uncertainty; exclude
    target locations and missile employment details.
  span_range:
  - src:1b414b2077b8#p152.5
  - src:1b414b2077b8#p154.3
  decision: The intelligence community estimates that the USSR has about 250–300 operational launchers equipped with medium-range
    ballistic missiles.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: 'The analytic judgment rests on the facilities’ proximity to explosives plants capable of producing at least two
    explosives bases and the presence of test cells with concrete-faced probable bunker/deflectors. Preserve the report’s
    uncertainty: the photography’s quality and scale prevented definite identification of most structures and functions; exclude
    operational details about the sites.'
  span_range:
  - src:1b414b2077b8#p204.4
  - src:1b414b2077b8#p217.8
  decision: National Photographic Interpretation Center analysts classified the facilities at five Soviet cities as probable
    solid-propellant test facilities rather than leaving their function unidentified.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The SNIE weighs evidence that the Lop Nor site may soon be ready against estimates of when China could obtain sufficient
    fissile material, and issues a qualified judgment that a test is more likely after the end of 1964. Focus on the estimative
    judgment, its uncertainty, and the competing evidence; exclude technical details of the site and intelligence collection.
  span_range:
  - src:1b414b2077b8#p244.10
  - src:1b414b2077b8#p249.9
  decision: The intelligence estimators decide whether to assess that China will conduct a nuclear test in the next few months
    or later.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The report says the site’s launch positions were destroyed and its guidance area partly destroyed, then states that
    the site is dropped from NPIC listings. The implied alternative is to retain it; focus on the analytic listing decision
    and exclude any decision to conduct the bombing or operational details of it.
  span_range:
  - src:1b414b2077b8#p313.3
  - src:1b414b2077b8#p313.3
  decision: NPIC analysts decide to remove the Vinh Linh B29-2 SAM site from NPIC listings.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The choice followed an evaluation finding that color imagery was less useful than black-and-white for military analysis
    but might contribute to geological and other regional studies. The report states that the study was undertaken to assess
    color imagery and the system’s potential for resources exploration; do not recast this as a decision about how to collect
    imagery.
  span_range:
  - src:1b414b2077b8#p322.4
  - src:1b414b2077b8#p323.3
  decision: CIA/NPIC chose to evaluate KH-4B color imagery for nonmilitary intelligence, focusing the study on mineral-resources
    exploration.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The decision point is whether to retain the historical imagery as classified or release it, and the order chooses
    release subject to procedures approved by the Director of Central Intelligence and the Archivist. The stated rationale
    is the imagery’s scientific and environmental usefulness, consistent with national security; exclude the separate, incomplete
    provisions for reviewing imagery from other systems.
  span_range:
  - src:1b414b2077b8#p360.5
  - src:1b414b2077b8#p360.6
  decision: The President ordered historical imagery from the Corona, Argon, and Lanyard missions declassified and made publicly
    available within 18 months.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
