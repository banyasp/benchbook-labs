- n: 1
  focus: The leadership offered the captured officer and another prisoner in exchange for a US official, intending to make
    it harder for their officer’s captors to kill him. Focus on the high-level exchange decision and its protective purpose;
    exclude the negotiations’ operational details.
  span_range:
  - src:f68b7606913a#p7.7
  - src:f68b7606913a#p7.10
  decision: North Vietnamese leadership decides to offer a prisoner exchange involving its captured security chief.
  content_domain: other:prisoner-exchange-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The officer ordered the prisoner killed to prevent his release by the advancing victors; the account also notes concern
    that the prisoner, described as a trained terrorist, might not be magnanimous. Focus on the lethal-force decision and
    its stated rationale, not on any method of execution.
  span_range:
  - src:f68b7606913a#p10.4
  - src:f68b7606913a#p10.5
  decision: A senior South Vietnamese officer decides to order the captured security chief’s execution as communist forces
    approach Saigon.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The US interrogator conveyed the agreement to a prisoner despite the South Vietnamese intelligence organization’s
    formal responsibility for his detention. Focus on the choice to disclose the agreement and the stated basis of compliance;
    exclude interrogation methods and the later effect on the prisoner’s resistance.
  span_range:
  - src:f68b7606913a#p9.6
  - src:f68b7606913a#p9.8
  decision: The US interrogator decides to inform the detained prisoner about the Paris Peace Agreement and its exchange provisions
    without prior South Vietnamese authorization.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
