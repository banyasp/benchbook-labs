episodes:
- n: 1
  focus: The decision concerned how to allocate scarce intelligence resources, with the stated rationale that success against
    high-grade ciphers seemed unlikely and German efforts against medium- and low-grade systems had been supported by World
    War I experience. Keep the scenario at the level of analytic priorities and resource allocation; exclude cryptanalytic
    techniques.
  span_range:
  - src:52b8d331890b#p34.2
  - src:52b8d331890b#p34.2
  decision: German intelligence leadership chose at the outset of World War II to prioritize efforts against low- and medium-grade
    cipher systems rather than high-grade ciphers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Admiralty faced a choice about whether to credit and relay warnings indicating that German naval units might
    engage the evacuating force; the account says it regarded the reports as unproven and had little understanding of traffic
    analysis. Focus on warning assessment and dissemination, not the subsequent engagement or operational measures the carrier
    might have taken.
  span_range:
  - src:52b8d331890b#p33.2
  - src:52b8d331890b#p34.1
  decision: The British Admiralty dismissed traffic-analysis warnings about German naval activity and did not send a warning
    to the carrier’s command.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The commander had accurate intelligence about the German fleet’s return direction and faced a choice between acting
    on it to seek a major engagement or preserving the British fleet. The account attributes the decision to distrust of intelligence
    and concern for preserving the fleet; exclude tactical details of any engagement.
  span_range:
  - src:52b8d331890b#p17.1
  - src:52b8d331890b#p18.1
  decision: The British fleet commander chose not to rely on intelligence indicating the German fleet’s return route, foregoing
    an opportunity to engage it.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: Policymakers faced the choice of confronting the Soviets after intelligence established their role in the air war,
    or allowing the air forces to continue fighting without public acknowledgment. The stated concern was the possibility
    that confrontation could start a third world war; exclude combat operations and intelligence collection methods.
  span_range:
  - src:52b8d331890b#p39.3
  - src:52b8d331890b#p40.2
  decision: U.S. policymakers chose not to confront the Soviet air forces in Korea and instead allowed the fighting to continue
    under false pretenses.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is the analysts’ judgment, based on the accumulating communications indicators, that a major thrust
    was likely in the Dak To area between 30 October and 4 November, and their choice to issue that assessment. Keep the focus
    on the warning and its evidentiary basis; exclude the later U.S. strikes and troop deployments.
  span_range:
  - src:52b8d331890b#p42.2
  - src:52b8d331890b#p44.1
  decision: The 330th unit’s analysts decide whether to issue a warning that a major North Vietnamese attack is imminent and
    assess its likely timing and location.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is the representative’s choice to stand by the no-MiG-threat judgment after an officer announces
    a MiG alert. Focus on the confidence and evidence behind that analytic position; exclude the raid’s route, flight profile,
    and other operational details.
  span_range:
  - src:52b8d331890b#p45.2
  - src:52b8d331890b#p46.1
  decision: The NSA representative to the Pentagon decides whether to maintain the assessment that North Vietnamese MiGs do
    not threaten the Son Tay raid.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: 'The decision point is the Soviet response to the Polish political change: the Soviets were preparing to use force
    to oust the new president, then called off their troops after his assurance. Keep the focus on the choice and the stated
    reason; do not infer unstated legal authority or additional motives.'
  span_range:
  - src:52b8d331890b#p47.3
  - src:52b8d331890b#p48.2
  decision: Soviet leaders decide whether to continue the troop movement toward Poland or call the troops off after Gomulka
    assures them that political and military ties with Russia will be maintained.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
