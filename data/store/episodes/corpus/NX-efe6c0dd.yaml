  focus: 'The decision point is whether to continue or resume the overflights: diplomatic efforts and Soviet complaints weighed
    against pressure to establish the true state of the Soviet ICBM program. Keep the scenario at the level of presidential
    authorization and competing policy interests; exclude operational details of the flights.'
  span_range:
