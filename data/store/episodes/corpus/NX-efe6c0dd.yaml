  - src:1e16b47e17cf#p14.4
  decision: The President suspended and later reauthorized U-2 overflights of the Soviet Union amid competing diplomatic and
    intelligence pressures.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision was whether to continue with divergent agency assessments or coordinate a rapid review of the evidence;
    USIB chose cooperation and temporary groups as a highest-priority task. Keep the focus on analytic coordination and sharing
    evidence, not on evaluating specific launch locations.
  span_range:
  - src:1e16b47e17cf#p28.3
  - src:1e16b47e17cf#p29.3
  decision: USIB directed member agencies to reexamine Soviet ICBM deployment evidence and established temporary working groups
    to address the disagreement.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The choice was to keep the relevant CIA expertise distributed or integrate it in a temporary task force; the Director
    approved the proposed consolidation. Extract the organizational and analytic decision, excluding the task force’s later
    research or collection methods.
  span_range:
  - src:1e16b47e17cf#p30.3
  - src:1e16b47e17cf#p31.4
  decision: The CIA Director approved an ad hoc CIA Guided Missile Task Force to consolidate missile analysis across offices.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the formal estimative judgment to place current Soviet strength at 10–25 launchers rather than
    retain the much higher prior projections. The stated basis was new information providing a firmer estimating foundation;
    include the panel’s supporting assessment, but exclude the operational details of reconnaissance or sources.
  span_range:
  - src:1e16b47e17cf#p39.5
  - src:1e16b47e17cf#p40.3
  decision: The US intelligence community adopted a sharply lower estimate of current Soviet ICBM strength in NIE 11-8/1-61.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The analysts had continued to find negative evidence of a large Soviet ICBM force, but lacked a sufficient basis
    for replacing the existing estimate; the resulting NIE set out differing CIA, Air Force, Army, and Navy judgments. Focus
    on the choice to delay and then publish an estimate with unresolved dissent, not on the missile figures as operational
    guidance.
  span_range:
  - src:1e16b47e17cf#p49.4
  - src:1e16b47e17cf#p50.3
  decision: Intelligence-estimate producers decide to issue the 1960 NIE after a deliberate delay, retaining agency disagreements
    rather than forcing a consensus.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: After reviewing how assumptions had produced the earlier bomber-gap estimate, the President felt secure in resisting
    the new missile-gap claims; he also told a senator that the senator’s Air Force sources lacked access to what senior officials
    knew. Focus on the President’s assessment and response, not on the undisclosed collection details mentioned in the passage.
  span_range:
  - src:1e16b47e17cf#p52.4
  - src:1e16b47e17cf#p52.5
  decision: The President decides to resist claims of a missile gap rather than accept the critics’ account of the Soviet
    threat.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The Air Force opposed hardened shelters while pursuing dispersal and airborne-alert measures. The passage gives cost
    and radiation-protection concerns as stated reasons and describes preserving budget-favorable programs as an institutional
    interest; focus on this force-posture policy choice, not on operational implementation.
  span_range:
  - src:1e16b47e17cf#p51.2
  - src:1e16b47e17cf#p51.3
  decision: Air Force leaders decide to resist hardened shelters for SAC bombers rather than adopt that part of the vulnerability-reduction
    program.
