- n: 1
  focus: The commander could retain the existing recovery timelines or adjust them after repeated delays; the account links
    the delays to the loss of experienced section chiefs and younger NCOs’ skill gaps. Focus on the command tradeoff between
    the training schedule and developing capability for reliable recovery; exclude tactical or technical procedures.
  span_range:
  - src:672c0961f22b#p24.2
  - src:672c0961f22b#p24.3
  decision: The battalion commander decides to extend recovery timelines, add NCO professional development, and schedule section
    certification.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The Soldier raised financial concerns, and the leader asked whether he was comfortable sharing details and interested
    in finding community resources; the Soldier agreed. Focus on the decision to offer and support access to assistance while
    respecting the Soldier’s choice and managing unit time; exclude personal financial details beyond the context needed to
    understand the decision.
  span_range:
  - src:672c0961f22b#p34.2
  - src:672c0961f22b#p34.3
  decision: The squad leader decides to facilitate the Soldier’s voluntary referral to Army Community Services and make time
    for appointments.
  content_domain: other:military personnel welfare
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The family could not view housing during mandatory quarantine, and the sponsor chose to volunteer time to help them
    evaluate options; the housing office then reserved a home. Focus on the decision to provide exceptional sponsorship support
    under those circumstances; exclude communication methods and incidental details not needed to assess the choice.
  span_range:
  - src:672c0961f22b#p35.2
  - src:672c0961f22b#p35.3
  decision: The sponsor decides to help the quarantined incoming Soldier’s family assess on-post housing and secure a home
    before they arrive.
  content_domain: other:military personnel welfare
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: After reviewing a packet documenting nine failures to report but only two weak counseling statements, the battalion
    commander declines to proceed, citing the company chain of command’s failure to establish accountability. The decision
    point is whether to advance punitive action and discharge paperwork now or first require documented counseling and a plan
    of action, with escalation if violations continue; exclude the handbook’s general training-management material.
  span_range:
  - src:672c0961f22b#p63.4
  - src:672c0961f22b#p64.2
  decision: The battalion commander decides whether to proceed with field-grade Article 15 punishment and chapter paperwork
