episodes:
- n: 1
  focus: Assess the decision about the scale and coverage of SAC’s exercise participation. The stated reasons were doubts
    about Able Archer’s direction and value, prior commitments, and the reduced number of available personnel; exclude details
    of exercise tasking or procedures.
  span_range:
  - src:8683d8e2fbf9#p3.1
  - src:8683d8e2fbf9#p4.1
  decision: SAC and Seventh Air Division leadership chose a limited observer-level contribution to Able Archer 83 rather than
    the large-scale ADVON presence initially envisioned, and the division left Vicenza without a deployer when SAC could provide
    only nine personnel.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: Assess the command’s choice to keep SAC’s exercise role separate from nuclear activities, against the alternative
    of some form of alignment. The passage grounds the choice in SAC’s predominantly conventional presence in Europe; exclude
    any nuclear procedures or operational details.
  span_range:
  - src:8683d8e2fbf9#p3.1
  - src:8683d8e2fbf9#p3.1
  decision: The SAC command chose to avoid any actual or simulated alignment with nuclear activities during Able Archer 83.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: Assess the recommendation to withhold future participation under the exercise conditions described, while recognizing
    that changes to exercise emphasis and allowances could leave participation open. The stated grounds include limited realistic
    tasking, little training value, and the exercise’s primarily nuclear-procedures focus; exclude employment procedures.
  span_range:
  - src:8683d8e2fbf9#p4.1
  - src:8683d8e2fbf9#p5.2
  decision: The Seventh Air Division after-action report recommended against future SAC participation in Able Archer unless
    the exercise allowed more realistic simulated bomber and tanker employment.
  content_domain: operational-command
  refusal_sensitivity: low
