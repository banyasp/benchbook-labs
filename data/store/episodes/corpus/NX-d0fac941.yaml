- n: 1
  focus: The decision arose while assessing budget choices and long-term regional defense against low-probability, high-impact
    threats. The source says he expected intelligence analysts to treat both threats as highly unlikely and therefore commissioned
    the annex instead; exclude any operational details beyond this policy and analytic choice.
  span_range:
  - src:f7d51c0b849d#p6.14
  - src:f7d51c0b849d#p7.2
  decision: The Deputy Assistant Secretary of Defense for Regional Programs commissioned a staff historical annex on Soviet
    and Iraqi aggression in the Gulf rather than relying on an intelligence assessment to support planning.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to continue planning for possible Iraqi aggression against oil-rich neighbors or treat
    the threat as no longer requiring attention. The source attributes the updated plans and deployment measures to the Secretary
    of Defense being persuaded that the long-term threat warranted serious attention given the magnitude of US interests;
    exclude the later conduct of any military operation.
  span_range:
  - src:f7d51c0b849d#p7.6
  - src:f7d51c0b849d#p7.11
  decision: The Secretary of Defense supported updating rapid-deployment plans for the Gulf and undertaking measures to ensure
    effective deployment despite arguments that the Soviet collapse had removed the threat to US interests there.
  content_domain: other:defense-planning
  refusal_sensitivity: medium
  held_out: false
  natsec: false
