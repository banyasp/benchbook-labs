- n: 1
  focus: The policy choice was whether to precommit to attacking bloc countries or preserve the option to decide based on
    each country’s conduct. The Department argued that automatic attack would bind the United States to war with countries
    that might not participate against it and could instead rebel against Soviet control; the passage does not say what policy
    the NSC ultimately adopted.
  span_range:
  - src:cf07507e85b0#p17.1
  - src:cf07507e85b0#p17.2
  decision: The State Department argued against an automatic US decision to attack Warsaw Pact countries at the outset of
    war.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The estimative choice was whether Soviet measures had made the forces dependable enough to count on, or whether political
    autonomy and nationalism made them unreliable. The estimate judged that discipline, Communist indoctrination, and officer
    selection would ensure initial reliability; keep the focus on that analytic judgment and exclude operational use of the
    forces.
  span_range:
  - src:cf07507e85b0#p8.1
  - src:cf07507e85b0#p8.5
  decision: The writers of the 1966 special national intelligence estimate judged that East European forces would initially
    be reliable in a war, despite growing nationalism and variation among allies.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The analytic choice was between expecting initial compliance and judging the allies broadly unreliable; the estimate
    adopted a qualified, conditional judgment. It cited Soviet command-and-control procedures and distinguished initial obedience
    from later effects of a static front or Warsaw Pact reverses; exclude operational employment details.
  span_range:
  - src:cf07507e85b0#p12.4
  - src:cf07507e85b0#p12.7
  decision: The Intelligence Community’s 1983 national estimate judged that Soviet orders would generally reach and be obeyed
    by Non-Soviet Warsaw Pact line units initially, while reliability could decline as a conflict developed.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
