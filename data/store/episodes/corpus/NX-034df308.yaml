- n: 1
  focus: The decision point is whether to continue funding the ALP or allow it to end through the FY2020 budget process. Reconstruct
    the Coalition’s reasons, including force reductions, competing priorities, and the view that the Afghan government could
    not sustain the program; exclude the unsupported claim that Congress formally canceled it.
  span_range:
  - src:f2cb0c057f0a#p9.6
  - src:f2cb0c057f0a#p11.1
  decision: Coalition funding authorities chose not to provide FY2020 funding for the Afghan Local Police, effectively ending
    the program.
  content_domain: other:security-assistance-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to dissolve the ALP at once or phase its dissolution using assessments of unit effectiveness
    and local security risks. The adopted plan dissolved the most effective units first and sought to preserve security gains
    by transitioning guardians into other Afghan forces; exclude operational techniques for carrying out security missions.
  span_range:
  - src:f2cb0c057f0a#p11.2
  - src:f2cb0c057f0a#p11.4
  decision: The ALP Special Operations Advisory Cell and Afghan Ministry of Interior leadership adopted a phased plan to dissolve
    the ALP and transition personnel.
  content_domain: operational-command
