- n: 50
  focus: 'The decision point is the UK’s negotiating objective for Resolution 1441: pursue a text combining inspections and
    a final opportunity for Iraq to disarm with the possibility of force without another Council resolution, rather than make
    force contingent on a later Council decision. The stated reasons included bringing the issue back to the UN, prioritizing
    disarmament and peaceful inspections, and avoiding another round of Council decision-making. Exclude operational military
    planning and later disputes about the resolution’s legal effect.'
