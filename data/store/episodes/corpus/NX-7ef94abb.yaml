episodes:
- n: 1
  focus: 'The UK position was that it would support action if the US President decided to act, but first the UN inspectors
    route had to be exhausted, progress made on stabilising the Arab-Israeli situation, and public opinion prepared. The account
    also gives reasons for remaining engaged: the Prime Minister did not want the US left to act alone and hoped UK engagement
    could improve the chance of persuading the US to return to the UN. Exclude military contribution planning and operational
    details.'
  span_range:
  - src:eaa4640e53c4#p18.6
  - src:eaa4640e53c4#p20.8
  decision: The Prime Minister chose to signal UK support for possible US military action, subject to conditions.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The officials considered alternative objectives, including explicit regime change and eliminating Iraq’s WMD, and
    settled on an objective centred on a stable, law-abiding Iraq abiding by its WMD obligations. The reasons included legal
    limits on the aims of force and concerns about whether broader objectives were credible or achievable. Exclude the military
    planning itself and treat this as an objective-setting policy decision.
  span_range:
  - src:eaa4640e53c4#p22.9
  - src:eaa4640e53c4#p25.5
  decision: The Foreign Secretary and Defence Secretary chose a preliminary UK objective for contingency planning that focused
    on Iraq meeting its international obligations rather than making regime change the stated objective.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The Defence Secretary advised that revealing the constraints on UK force availability could reduce UK influence,
    while the UK needed greater clarity about US plans to advance its own planning. The Prime Minister decided not to expose
    those constraints. Exclude force composition, timing, and other operational planning details.
  span_range:
  - src:eaa4640e53c4#p25.8
  - src:eaa4640e53c4#p26.2
  decision: The Prime Minister chose not to disclose the UK’s military contribution constraints to the US Secretary of Defense.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision was between foregrounding conditions for British involvement and assuring the US of support while explaining
    what would make action successful. Capture the reasons given for that framing, including avoiding a wavering signal and
    building a broad coalition; exclude the operational details of military planning.
  span_range:
  - src:eaa4640e53c4#p27.3
  - src:eaa4640e53c4#p27.13
  decision: The Prime Minister chose to present UK support to the US as a commitment to work together for a successful military
    strategy, rather than as a list of conditions for UK participation.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The choice was whether to engage in US planning or stand aside and risk losing influence; engagement could also imply
    support for action and lend credibility to a plan lacking a political framework. Focus on the policy reasons and risks,
    not the contents or methods of military planning.
  span_range:
  - src:eaa4640e53c4#p32.7
  - src:eaa4640e53c4#p35.9
  decision: The Defence Secretary intended for a small UK team to join US planning, while withholding a decision on UK military
    participation pending a coherent strategic framework.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision was whether to publish the documentation then or wait for a later phase. The source gives the concern
    that publication could raise the issue prematurely or make it appear that military action had already been decided; exclude
    judgments about the underlying intelligence beyond what is needed to explain the timing decision.
  span_range:
  - src:eaa4640e53c4#p43.7
  - src:eaa4640e53c4#p44.8
  decision: The Prime Minister and his communications advisers chose to defer publication of documentation on the Iraq threat
    rather than publish it at that stage.
  content_domain: other:public-communications
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The Prime Minister agreed to a strategy that linked possible UK participation to an ultimatum and legal basis, regional
    neutrality, a persuasive case, a convincing military plan and preparation for the aftermath. The advice explicitly favored
    not rushing and waiting until autumn if the operation was not ready; this was not a final authorization to use force.
  span_range:
  - src:eaa4640e53c4#p54.7
  - src:eaa4640e53c4#p55.2
  decision: The Prime Minister accepted a conditional road map for UK support for US action against Iraq, while allowing for
    delay if preparations were not ready.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The meeting record states the participation assumption but also says firm decisions required a fuller picture of
    US planning. The account gives the political rationale of staying close to the United States and seeking influence, while
    recording concerns about domestic support and military and political feasibility; do not treat this as final authorization.
  span_range:
  - src:eaa4640e53c4#p63.6
  - src:eaa4640e53c4#p66.8
  decision: At the 23 July meeting, the Prime Minister directed that the UK work on the assumption it would participate in
    any military action, pending fuller planning.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The meeting record assigns the Foreign Secretary the task of working up an ultimatum, despite reported US reluctance
    to pursue that route. The stated rationale was that an Iraqi refusal could strengthen the legal and political case for
    force; this is a decision to explore the diplomatic and legal route, not a decision to issue the ultimatum or use force.
  span_range:
  - src:eaa4640e53c4#p64.2
  - src:eaa4640e53c4#p65.4
  decision: The Foreign Secretary was tasked with discreetly developing an ultimatum to Iraq concerning the return of UN weapons
    inspectors.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: Treat this as the decision to offer support as a means of influencing how the US handled Iraq. The reasons included
    the value of a broad coalition, UN authority and avoiding unintended consequences; exclude the separate legal determination
    about what authority force required.
  span_range:
  - src:eaa4640e53c4#p76.6
  - src:eaa4640e53c4#p83.9
  decision: The Prime Minister chose to assure the US President of UK support while urging a coalition and a UN-centred approach,
    rather than withholding support or opposing action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to rely on previous resolutions or require a fresh Security Council determination before
    UK participation. The Attorney General advised that action without one would be unlawful, and the Prime Minister later
    said that advice convinced him a new resolution was necessary; exclude debates over how to frame an ultimatum.
  span_range:
  - src:eaa4640e53c4#p88.3
  - src:eaa4640e53c4#p90.10
  decision: The Prime Minister accepted that UK military action required a fresh Security Council resolution establishing
    at least a material and flagrant breach by Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 12
  focus: The Prime Minister’s note proposed using the UN to build a coalition and establish a framework for action, including
    an ultimatum; he also conveyed that UK participation would be impossible unless action went through the UN. Focus on this
    policy choice, its multilateral and UK strategic rationale, and the potential to make later withdrawal of UK support difficult.
    Exclude operational military planning and the unconsulted status of the proposals except as context.
  span_range:
  - src:eaa4640e53c4#p94.6
  - src:eaa4640e53c4#p94.11
  decision: The Prime Minister chose to press the US President to pursue a UN-based route before possible military action
    against Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 13
  focus: The Ministry of Defence presented three broad contribution options but said the US plan remained unsettled and it
    could not yet recommend an option; the Prime Minister was told no decision was needed. The Prime Minister declined to
    accept an option, with the stated retrospective explanation that he did not want to signal enthusiasm for a military alternative
    while pressing the UN route. Exclude the operational details of the packages.
  span_range:
  - src:eaa4640e53c4#p98.2
  - src:eaa4640e53c4#p100.10
  decision: The Prime Minister chose to defer selecting or accepting a UK military contribution option in July 2002.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 14
  focus: The UK had deliberately restrained EU discussion because officials judged debate futile and likely to expose differences
    among partners; the report notes that speculation about military action made this restraint increasingly difficult to
    sustain. Focus on the diplomatic choice to avoid or permit EU-level debate and its implications for consensus. Exclude
    military planning and treat the passage as describing a collective government policy rather than identifying an individual
    decision-maker.
  span_range:
  - src:eaa4640e53c4#p101.7
  - src:eaa4640e53c4#p101.9
  decision: The UK Government chose to keep Iraq off the EU agenda during the early debate over possible military action.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: This is the President’s choice of diplomatic course in late August 2002, with the competing concerns that the UN
    process could delay action but could also secure international support. Focus on the policy choice and its stated rationale;
    exclude operational planning and the proposed details of inspections or military measures.
  span_range:
  - src:eaa4640e53c4#p129.8
  - src:eaa4640e53c4#p131.6
  decision: The US President chose to pursue the UN route on Iraq rather than proceed directly with a unilateral ultimatum
    and military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 16
  focus: The decision point is the UK’s choice to pursue the UN route before possible military action, including the stated
    condition that the international community’s failure to act could require action. Consider the reasons given for seeking
    a UN challenge and coalition support; exclude operational planning and the proposed details of any resolution.
  span_range:
  - src:eaa4640e53c4#p130.3
  - src:eaa4640e53c4#p131.3
  decision: The UK Prime Minister chose to make a UN challenge on Iraqi disarmament the next step, while retaining action
    as a possibility if the UN could not address the issue.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 17
  focus: This is the choice of a diplomatic and political course over simply continuing containment or treating military action
    as inevitable. The reasons include the perceived limits of containment, the need to address public concerns and build
    international support, and the stated view that inaction was not an option; exclude the separate work on military planning
    and operational details.
  span_range:
  - src:eaa4640e53c4#p134.8
  - src:eaa4640e53c4#p136.5
  decision: The Prime Minister chose to pursue a UN-centred strategy for Iraq, including a resolution setting demanding conditions
    and making conflict dependent on Iraq’s response.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 18
  focus: The decision point is whether and when to publish the dossier amid public demands for evidence and questions about
    the case for action. The passage says earlier publication could help explain the Prime Minister’s concerns and calm the
    situation; exclude assessment of the dossier’s underlying intelligence, which is addressed elsewhere.
  span_range:
  - src:eaa4640e53c4#p142.3
  - src:eaa4640e53c4#p143.7
  decision: The Prime Minister chose to bring forward publication of the Iraq dossier rather than wait until key decisions
    had been taken.
  content_domain: other:government-communications
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 19
  focus: The choice was between a tougher draft with expanded inspector powers and enforcement provisions, and a more limited
    resolution based on existing inspection arrangements. The recommendation reflected doubts that the harder approach could
    be negotiated, concern that it would lack Security Council support, and the need to prepare the ground with Russia; exclude
    operational arrangements for inspectors or any military enforcement plan.
  span_range:
  - src:eaa4640e53c4#p152.4
  - src:eaa4640e53c4#p153.13
  decision: The Foreign Secretary recommended seeking a Security Council resolution that declared Iraq’s non-cooperation a
    breach and set an ultimatum for inspectors’ return, rather than pursuing a more demanding enforcement draft.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is the US President’s choice of a UN route over moving directly toward unilateral action, with
    military pressure intended to support diplomacy. Focus on the balance between international support, the UN’s credibility,
    and the risk that diplomacy would fail; exclude operational military planning.
  span_range:
  - src:eaa4640e53c4#p163.4
  - src:eaa4640e53c4#p164.5
  decision: The US President chooses to seek a UN resolution and pursue coercive diplomacy before resorting to military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 21
  focus: 'The decision point is the UK Prime Minister’s preferred structure for UN action: set stringent initial conditions
    and retain the option of returning to the Security Council before force. Focus on the tension between stronger initial
    demands, international backing, and the risk of failing to secure a second resolution; exclude details of military deployments.'
  span_range:
  - src:eaa4640e53c4#p166.6
  - src:eaa4640e53c4#p167.9
  decision: The UK Prime Minister favors a tough initial Security Council resolution, leaving open a second resolution if
    Iraq breaches it.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 22
  focus: 'The decision point is the UK’s prospective military commitment after the Prime Minister receives military advice:
    avoid promising a contribution beyond what the UK can deliver, while considering a more limited package. Focus on capability,
    timing, and the constraints imposed by Operation FRESCO; exclude the operational composition or employment of forces.'
  span_range:
  - src:eaa4640e53c4#p172.3
  - src:eaa4640e53c4#p172.8
  decision: The UK Prime Minister rules out offering Package 3 at that time, considers Package 2 with possible additions,
    and delays visible preparations.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 23
  focus: The decision point is whether to make inspections an indispensable stage of the UN process or treat an unsatisfactory
    Iraqi declaration as sufficient grounds to move toward enforcement. Include the stated reasons of credibility, genuine
    use of the UN route and building international support; exclude the operational pace or selection of inspection teams.
  span_range:
  - src:eaa4640e53c4#p179.4
  - src:eaa4640e53c4#p181.2
  decision: The UK Prime Minister and senior officials decided to insist on intrusive UN inspections before addressing enforcement,
    rejecting a declaration-only route that could lead directly to force.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 24
  focus: The decision point is pursuing the UN route before action, rather than proceeding without it. Include the stated
    coalition, domestic political and legal considerations; exclude later operational or military planning.
  span_range:
  - src:eaa4640e53c4#p195.4
  - src:eaa4640e53c4#p196.8
  decision: The UK Prime Minister decided to secure US agreement to pursue a UN resolution and give Iraq a final chance before
    any action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 25
  focus: The decision point is whether to recall Parliament for a one-day debate before the Government’s next steps. Include
    the reasons given—Parliament’s central role in the national debate, forthcoming UN discussions and publication of a dossier—and
    the stated prospect of parliamentary views if military commitments later arose.
  span_range:
  - src:eaa4640e53c4#p177.8
  - src:eaa4640e53c4#p177.12
  decision: The UK Prime Minister decided to seek Parliament’s recall for a debate on Iraq and weapons of mass destruction.
  content_domain: other:parliamentary accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 26
  focus: The UK could pursue a two-stage approach or seek to put as much as possible into the first resolution. The chosen
    negotiating position was to seek strong breach and inspection terms promptly, while keeping the second-resolution question
    open; the stated rationale was that a tougher first resolution might make military action less likely, and the US would
    not accept a two-stage approach at that point. Exclude later decisions about military deployments or the resolution’s
    eventual legal effect.
  span_range:
  - src:eaa4640e53c4#p214.3
  - src:eaa4640e53c4#p215.2
  decision: The UK Prime Minister and Foreign Secretary decide to press for a strong first Security Council resolution while
    leaving open whether a second resolution will be needed.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 27
  focus: The choice was whether to treat Iraq’s offer as sufficient or continue pursuing a resolution establishing requirements
    and a benchmark for compliance. They chose to continue, citing scepticism about Iraq’s intentions, concern that the offer
    did not guarantee immediate and unrestricted access, and the need to sustain pressure and deprive Iraq of the argument
    that military action was inevitable regardless of its conduct. Exclude operational details of inspections.
  span_range:
  - src:eaa4640e53c4#p216.3
  - src:eaa4640e53c4#p216.9
  decision: The UK Prime Minister and US President decide to continue seeking a new Security Council resolution despite Iraq’s
    offer to readmit inspectors.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 28
  focus: The alternatives were to demand a comprehensive declaration before inspectors returned or to incorporate a declaration
    into the inspection process. The UK position was an update pursued in parallel so it would not delay inspectors’ return;
    the stated concern was that a comprehensive declaration could be used as a casus belli, invite a strategically crafted
    response, and rely on subjective judgments before inspectors could verify it. Exclude practical inspection arrangements.
  span_range:
  - src:eaa4640e53c4#p211.3
  - src:eaa4640e53c4#p215.2
  decision: The UK Foreign Secretary and Prime Minister decide to seek an Iraqi WMD declaration as an update pursued alongside
    inspectors’ return, not as a prerequisite or a basis for immediate military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 29
  focus: 'The decision point is the UK’s negotiating strategy: pursue a UN resolution and seek broad support, including by
    advancing a position the UK thought might be difficult to agree, rather than take unilateral action. Focus on the rationale
    of demonstrating a genuine effort to make inspections work and securing support for any later action; exclude the technical
    drafting of inspection provisions.'
  span_range:
  - src:eaa4640e53c4#p221.8
  - src:eaa4640e53c4#p222.6
  decision: The Prime Minister and Foreign Secretary decide to test the negotiability of the US draft resolution with France
    and Russia, rather than proceed unilaterally.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 30
  focus: The decision concerns whether to advance a land-force option despite concerns about viability, cost, and competing
    commitments such as Operation FRESCO; the eventual direction was to proceed cautiously and heavily caveat the possibility.
    Exclude force composition and campaign-planning details except as context for the policy commitment.
  span_range:
  - src:eaa4640e53c4#p223.2
  - src:eaa4640e53c4#p224.11
  decision: The Prime Minister decides whether to authorize contingency preparations for a possible UK land-force contribution
    and how cautiously to present that possibility to the United States.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 31
  focus: The decision point is the conditional policy choice between continuing inspections and diplomacy, backed by a credible
    threat of force, and accepting non-compliance or seeking another course. The stated reasons include enforcing the UN’s
    demands, the perceived risks of inaction, and the importance of the US relationship; exclude arguments about particular
    weapons capabilities except as evidence cited for the policy.
  span_range:
  - src:eaa4640e53c4#p237.2
  - src:eaa4640e53c4#p239.4
  decision: The Prime Minister decides to pursue disarmament through the UN while making clear that the UK may support military
    action if Iraq does not comply.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 32
  focus: The Foreign Secretary said a further resolution was desirable, but not essential, and regarded existing resolutions
    as providing ample authority and evidence of material breach. The decision point is the legal and policy choice between
    requiring a fresh Council decision and relying on existing resolutions; exclude the separate question of what legal advice
    would apply in particular future circumstances.
  span_range:
  - src:eaa4640e53c4#p245.2
  - src:eaa4640e53c4#p245.8
  decision: The Foreign Secretary decides whether a new Security Council resolution is legally indispensable before the UK
    could use force against Iraq.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 33
  focus: The Prime Minister considered a two-resolution route, a flexible approach that did not rule out a second resolution,
    and the risk of requiring a second resolution that could not be obtained. He proposed wording expressing the Council’s
    readiness to authorize force, while saying the UK and US would act if the Council did not; focus on this authorization
    strategy and its trade-offs, not operational military planning.
  span_range:
  - src:eaa4640e53c4#p261.6
  - src:eaa4640e53c4#p262.7
  decision: The Prime Minister decides what approach to propose for Security Council authorization of force if Iraq does not
    comply with a new resolution.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 34
  focus: The decision point is the UK’s position against the view that no new resolution was legally necessary before inspectors
    returned. The stated reasons were to establish effective inspection arrangements and demonstrate Security Council unity
    and willingness to enforce its decisions; exclude the operational details of inspections.
  span_range:
  - src:eaa4640e53c4#p265.2
  - src:eaa4640e53c4#p266.6
  decision: The UK Government chose to insist that UN weapons inspectors not return to Iraq until a new Security Council resolution
    and inspection arrangements were in place.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 35
  focus: The decision point is whether to frame the first resolution as authorizing force or to require a further Council
    decision. The passage records the FCO’s stated position and legal concerns about relying on the first resolution alone;
    exclude operational planning and the separate question of how force might be used.
  span_range:
  - src:eaa4640e53c4#p266.8
  - src:eaa4640e53c4#p269.3
  decision: The UK Foreign and Commonwealth Office chose to pursue a draft resolution understood to require a further Security
    Council resolution before the use of force.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 36
  focus: The decision point is whether to provide a fuller official response or rely on the existing assessment and press
    lines. The stated reason was that the rebuttal was judged weak and did not undermine the dossier; the passage also notes
    that Iraq’s explicit denials and the risks of making a detailed rebuttal were not addressed.
  span_range:
  - src:eaa4640e53c4#p264.5
  - src:eaa4640e53c4#p264.11
  decision: The Chief of the Assessments Staff concluded that the UK did not need to issue a fuller reply to Iraq’s rebuttal
    of the UK dossier.
  content_domain: other:public-communications
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 37
  focus: Congress chose to grant force authorization while also expressing support for efforts to enforce relevant UN resolutions
    and obtain Security Council action. The stated grounds included defending US national security against the threat posed
    by Iraq and enforcing UN resolutions; do not treat the authorization as a decision that force had already been ordered.
  span_range:
  - src:eaa4640e53c4#p287.2
  - src:eaa4640e53c4#p288.3
  decision: The US Congress authorized the President to use military force against Iraq if he determined it necessary and
    appropriate.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 38
  focus: The US position favored one resolution with clear, immediate requirements, rather than a process requiring a second
    Council decision before further measures. The stated rationale was to make Iraq’s obligations and the consequences of
    non-compliance clear, promote compliance, and reduce the risk of miscalculation; exclude operational inspection methods.
  span_range:
  - src:eaa4640e53c4#p300.7
  - src:eaa4640e53c4#p301.6
  decision: The US government chose to pursue a single, firm Security Council resolution setting Iraq’s requirements and consequences
    for non-compliance.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 39
  focus: France proposed an initial resolution defining inspection requirements and warning Iraq, followed by an immediate
    Council meeting to decide appropriate measures if inspectors found non-cooperation. Its stated reasons were to preserve
    Council unity, fairness, legitimacy, and Council control, and to avoid automaticity in the use of force; exclude inspection
    techniques themselves.
  span_range:
  - src:eaa4640e53c4#p302.3
  - src:eaa4640e53c4#p302.8
  decision: France chose to advocate a two-stage Security Council process, with a further Council decision on measures if
    Iraq failed to cooperate.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 40
  focus: The Foreign Secretary argued that a second resolution explicitly authorizing force would almost certainly be needed
    legally and politically, and urged the Prime Minister to make that case to the US President. The reasons included securing
    a defensible legal basis, broader Security Council support, and sufficient UK Cabinet and parliamentary backing; the Prime
    Minister’s qualification that this was not necessary in every circumstance means this should not be presented as a settled
    government decision.
  span_range:
