episodes:
- n: 1
  focus: This is the 1947 statutory compromise between the perceived need for unified intelligence after Pearl Harbor and
    distrust of concentrated power. Include the choice of institutional structure and the reasons for limiting it; exclude
    later descriptions of how intelligence operations were conducted.
  span_range:
  - src:6bfd55d65f83#p10.5
  - src:6bfd55d65f83#p15.2
  decision: Congress chose to establish an independent CIA that could coordinate intelligence but would not control departmental
    intelligence agencies or exercise law-enforcement powers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision arose amid congressional scrutiny and the President's concern that Congress would rewrite the statutes
    governing intelligence. Focus on the choice to act through an executive order and its balance of executive authority with
    restrictions; exclude operational details of intelligence activities.
  span_range:
  - src:6bfd55d65f83#p18.2
  - src:6bfd55d65f83#p18.4
  decision: The President chose to replace the NSC intelligence directives with Executive Order 11905, setting intelligence
    responsibilities and restrictions by executive order.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision involved directing shrinking intelligence resources toward tactical support amid continuing overseas
    deployments, with the stated aim of informing commanders and maximizing troop security. Include the tension with national
    strategic intelligence priorities; exclude operational advice about supporting any particular deployment.
  span_range:
  - src:6bfd55d65f83#p22.1
  - src:6bfd55d65f83#p22.3
  decision: The President directed the Intelligence Community to prioritize intelligence support for military operations under
    PDD-35.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The commission weighed structural reform against maintaining the existing arrangement, including the DCI–Secretary
    of Defense relationship; it recommended no major changes because current efforts to strengthen community management while
    preserving that relationship were bearing fruit. Keep the focus on this institutional oversight recommendation, not the
    broader history of intelligence organization.
  span_range:
  - src:6bfd55d65f83#p25.8
  - src:6bfd55d65f83#p26.1
  decision: The Hart-Rudman commission recommended retaining the Intelligence Community’s existing management structure rather
    than making major structural changes.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision is to add a coordination role under the Director, rather than rely on existing arrangements alone. The
    stated reasons are the value of stronger centralized direction and the potential to strengthen the national intelligence
    effort; exclude operational activities the deputy might later coordinate.
  span_range:
  - src:6bfd55d65f83#p59.4
  - src:6bfd55d65f83#p59.6
  decision: The President approves the Director of Central Intelligence’s appointment of a Deputy Director for Coordination
    to review and recommend ways to improve integration, reduce duplication, and coordinate the intelligence community.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to require reductions to existing intelligence programs or preserve them, and why the
    President chose a reductions review focused especially on tactical intelligence. The stated reasons are the urgent need
    for savings and that collection accounts for the largest share of the intelligence budget; exclude choices about how to
    conduct collection or implement particular cuts.
  span_range:
  - src:6bfd55d65f83#p90.4
  - src:6bfd55d65f83#p90.4
  decision: The President directed the Office of Management and Budget, jointly with the Director of Central Intelligence
    and the Secretary of Defense, to review the FY 1973 intelligence budget and propose program reductions, with particular
    attention to tactical intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
