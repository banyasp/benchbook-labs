episodes:
- n: 1
  focus: The companies were surrounded or cut off, routes back to the main position were blocked, and one company was running
    out of ammunition. Focus on the command choice to withdraw and the risks of remaining or attempting to regroup; exclude
    the tactical routes and methods of breaking out.
  span_range:
  - src:9b18e7ab4422#p8.5
  - src:9b18e7ab4422#p9.1
  decision: The GM 30 commander orders isolated companies to break out and withdraw toward Dong Hene rather than remain in
    their positions or continue trying to rejoin the main force.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The request was for a strike on enemy forces in the school yard, while the rules barred strikes near structures;
    the senior commander also urged withdrawal. Focus on the decision and the governing constraint, not on how an air strike
    would be conducted.
  span_range:
  - src:9b18e7ab4422#p10.3
  - src:9b18e7ab4422#p10.6
  decision: The air-support authority declines the deputy commander’s request for an air strike near the school, applying
    the rules of engagement.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The pilots discuss whether to proceed; one says the troops need the supplies, and the other agrees. Focus on the
    decision to accept the flight risk to resupply the force; exclude flight and parachute-delivery details.
  span_range:
  - src:9b18e7ab4422#p10.7
  - src:9b18e7ab4422#p10.8
  decision: The civilian transport pilots decide to deliver ammunition to the isolated position despite ground fire and the
    absence of fighter cover, rather than return with their loads.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
