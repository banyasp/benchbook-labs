episodes:
- n: 1
  focus: The decision point is whether to support training amid COVID-19 or continue restricting it, under the local discretion
    provided by the Army’s June 2020 EXORD. The document weighs the backlog and readiness need against infection risk, and
    describes the policy as a means to support training while protecting the force; exclude the policy’s individual implementation
    measures as separate decision points.
  span_range:
  - src:2e7359edbb58#p1.8
  - src:2e7359edbb58#p2.7
  decision: The Fort McCoy garrison commander chose to enable approved units to resume training under Policy Letter 38’s risk-mitigation
    requirements rather than keep training suspended.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to require a pre-training quarantine or rely on pre-movement screening and movement
    restrictions for personnel who tested positive or displayed symptoms. The stated reason was the nature of Army Reserve
    training requirements and limited available training days; exclude the screening procedures themselves except as context
    for the policy choice.
  span_range:
  - src:2e7359edbb58#p3.2
  - src:2e7359edbb58#p3.3
  decision: Fort McCoy leadership chose not to require incoming units to complete a 14-day restriction of movement before
    training.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
