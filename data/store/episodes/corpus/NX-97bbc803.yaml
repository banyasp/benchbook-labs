- n: 2
  focus: The decision point is the Air Force’s choice to increase journal coverage rather than rely on narrower or screened
    coverage. The stated rationale is its perceived need to abstract more of the expanding literature; exclude the separate
    CIA digest decision.
  span_range:
  - src:99cc4b2f60f2#p3.2
  - src:99cc4b2f60f2#p3.3
  decision: The Air Force chose to expand its cover-to-cover abstracting program as Soviet scientific literature grew.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is CIA’s choice to screen and digest the literature for other community members rather than leave
    them to handle extensive abstract-card files themselves. Keep the rationale centered on their limited facilities and differing
    analytical needs; exclude the Air Force’s separate comprehensive abstracting program.
  span_range:
  - src:99cc4b2f60f2#p3.2
  - src:99cc4b2f60f2#p3.4
  decision: CIA chose to issue a twice-monthly screened digest as a service of common concern for agencies unable to manage
    large volumes of abstract cards.
