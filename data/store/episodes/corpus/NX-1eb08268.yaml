episodes:
- n: 1
  focus: The decision point is whether to establish a dedicated cryptographic organization or continue sending messages without
    that protection. The account says plain-text communications caused concern and that secure communications were urgently
    needed to support leadership and command; exclude the technical design or use of cryptographic systems.
  span_range:
  - src:63db14b38e15#p22.2
  - src:63db14b38e15#p22.5
  decision: The General Staff leadership decides to establish a military cryptographic section to protect command communications.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is how to choose personnel for a sensitive new assignment when the organization needs reliable
    staff. The account identifies selection criteria and links them to the reliability demands of the work; exclude technical
    training or cryptographic methods.
  span_range:
  - src:63db14b38e15#p23.1
  - src:63db14b38e15#p23.2
  decision: The cryptographic mission’s leadership decides to select initial personnel based on trustworthiness, literacy,
    and availability for an assignment requiring total reliability.
  content_domain: other:personnel-security
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether the sector would resist after French forces opened fire and occupied Nam Bo, and Central’s
    subsequent approval. Exclude the communications and cryptographic arrangements used to report or implement the decision.
  span_range:
  - src:63db14b38e15#p29.4
  - src:63db14b38e15#p30.2
  decision: The Nam Bo Sector Committee decided to resist the French forces’ occupation, and Central agreed with that resolution.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 4
  focus: The decision point is whether to comply with the French ultimatum or reject it and authorize armed resistance. The
    passage grounds the order in the ultimatum to disarm the army and occupy the Hanoi public security office, and the government’s
    rejection; exclude the coded messages and other implementation details.
  span_range:
  - src:63db14b38e15#p31.1
  - src:63db14b38e15#p31.14
  decision: The Central Party Standing Committee resolved to open fire against French forces, and the High Command ordered
    a coordinated attack on 19 December 1946.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 5
  focus: The decision point is whether to resist the offensive threatening the resistance base and main forces. The source
    gives the stated threat and the decision to defeat the offensive; exclude the subsequent assignments of units and routes,
    which are operational details.
  span_range:
  - src:63db14b38e15#p39.3
  - src:63db14b38e15#p39.5
  decision: The Central Party Standing Committee decided to counter the French winter offensive in Viet Bac, and the High
    Command issued orders to implement that direction.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 6
  focus: The decision followed compromise of cryptographic techniques among organizations outside the army; the stated response
    was to unify and standardize the task and develop systems for Intersector use. Frame the choice as centralized common
    organization versus retaining separate arrangements, and exclude technical details of cryptographic systems or their use.
  span_range:
  - src:63db14b38e15#p46.8
  - src:63db14b38e15#p46.8
  decision: The Intersector Party Committee chose to establish a common cryptographic organization for the entire Intersector.
  content_domain: other:communications-security policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 7
  focus: The passage describes a time-sensitive campaign decision based on the assessed movements of two enemy forces and
    the risk that they would join. Focus on the command choice and its stated urgency; exclude the order’s operational details
    and any further description of targets or tactics.
  span_range:
  - src:63db14b38e15#p58.3
  - src:63db14b38e15#p59.5
  decision: The Border Campaign command chose to act against one enemy force before it could link up with another, rather
    than delay or prioritize a different course.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 8
  focus: The decision concerns personnel eligibility and reassignment, with organizational security given as the reason; the
    passage also describes political education as a route for non-members to qualify. Focus on the policy, its rationale,
    and its consequences for personnel, not on cryptographic procedures.
  span_range:
  - src:63db14b38e15#p67.13
  - src:63db14b38e15#p67.16
  decision: The army’s political directorate and General Staff decided to use Party membership as a selection criterion for
    cryptographic personnel and to transfer unsuitable personnel to other duties.
  content_domain: other:personnel-security-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The Committee faced the choice of opening a campaign or not responding with this campaign to the enemy’s planned
    offensive against Hoa Binh and its threat to communications and supply. Focus on the authority, threat assessment, and
    decision to use force; exclude operational plans and conduct of the campaign.
  span_range:
  - src:63db14b38e15#p74.2
  - src:63db14b38e15#p74.3
  decision: The Main Military Committee decided to open the Hoa Binh Campaign with three divisions on the main front and coordinated
    forces in the enemy’s rear.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 10
  focus: The decision point is the Party leadership’s choice to commit to a campaign at Dien Bien Phu, where the opposing
    force was building a strong defensive position. The stated context includes the expectation of a major battle in the Northwest
    and the aim of fixing the enemy at Dien Bien Phu; exclude subsequent tactical plans and cryptographic arrangements.
  span_range:
  - src:63db14b38e15#p84.13
  - src:63db14b38e15#p84.22
  decision: The Politburo decided to open the Dien Bien Phu campaign and establish a campaign Party Committee and command
    post.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether to let the enemy withdrawal proceed or direct the division to pursue and engage the
    withdrawing force. The stated reason was intelligence that the French planned to evacuate Lai Chau; exclude the passage’s
    specific route and maneuver instructions.
  span_range:
  - src:63db14b38e15#p83.9
  - src:63db14b38e15#p84.3
  decision: The Deputy Chief of the General Staff, acting through headquarters, ordered the 316th Division to engage the French
    force withdrawing from Lai Chau.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 12
  focus: The decision follows a sixfold increase in contact points, a fivefold increase in message volume, and growing demands
    for personnel, research, production, and distribution. Treat the choice as whether to retain the bureau structure or elevate
    it to a directorate with stronger responsibilities and organization; exclude the technical details of cryptographic systems
    and materials.
  span_range:
  - src:63db14b38e15#p100.17
  - src:63db14b38e15#p101.5
  decision: The Ministry of National Defense decides to transform the General Staff Cryptographic Bureau into the General
    Staff Directorate of Cryptography.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 13
  focus: The decision is tied to the military mission and second five-year military plan, with the stated aim of meeting leadership
    and command requirements. Treat the choice as whether to realign and expand the organizational system or retain the prior
    arrangement; exclude the later technical details of cryptographic liaison.
  span_range:
  - src:63db14b38e15#p103.12
  - src:63db14b38e15#p103.15
  decision: The Central Secretariat decides to realign the central and other cryptographic organizations and expand the army
    branch’s organization in the North and South.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is whether to evacuate or remain after receiving a warning specifying the likely day and hour
    of the enemy strike. The source says HQ ordered evacuation and that the next morning’s strike caused no loss of people
    or equipment; exclude details of message handling.
  span_range:
  - src:63db14b38e15#p123.2
  - src:63db14b38e15#p123.2
  decision: MR HQ ordered its organizations, units, and the people to evacuate the night before the anticipated strike near
    the HQ cantonment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is the conditional choice to use air power in response to an enemy strike above the specified
    line, rather than withhold that response. The passage describes the threat assessment, the plan’s condition, and its implementation;
    exclude the tactical details of the air operation.
  span_range:
  - src:63db14b38e15#p123.2
  - src:63db14b38e15#p123.3
  decision: HQ, applying the standing committee-approved plan, directed the air force to attack if the enemy struck north
    of the twentieth parallel.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 16
  focus: The Secretariat acted after widespread communications growth and reported secrecy failures, including cleartext messages
    and independently created systems that could expose secrets to enemy collection. The decision point is the allocation
    of oversight authority and the rules imposed; exclude technical details about cryptographic systems or communications.
    The passage does not enumerate alternatives, but implies a choice between centralized control and continued decentralized
    practices.
  span_range:
  - src:63db14b38e15#p126.10
  - src:63db14b38e15#p127.6
  decision: The Central Party Secretariat decided to centralize authority over cryptographic systems and radio-station administration
    and to prohibit unauthorized or insecure communications practices.
  content_domain: other:communications-security-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The committee set military-wide rules after identifying serious weaknesses in radio and cryptographic practices,
    including lax telegraph discipline and failures to protect message and station secrecy. The decision point is the choice
    of binding oversight and compliance rules; exclude operational or technical instructions for using cryptography or radio.
  span_range:
  - src:63db14b38e15#p127.11
  - src:63db14b38e15#p128.10
  decision: The Standing Committee of the Central Military Committee decided to require military command echelons to oversee
    communications compliance, require cryptographic capability for radio use, prohibit cleartext and locally devised secret
    codes, and address violations.
  content_domain: other:communications-security-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The decision point is how to preserve the leader’s participation while accommodating repeated health attacks. Consider
    the choice between retaining prior work arrangements and changing them; exclude later communications or secrecy directions.
  span_range:
  - src:63db14b38e15#p141.10
  - src:63db14b38e15#p141.10
  decision: The Politburo reorganized its working methods in 1968 so that the Party leader could participate in discussions
    of major undertakings despite his declining health.
  content_domain: other:leadership governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
