  focus: Assess the strategic choice to launch the offensive in the context of the perceived opportunity and the enemy’s defensive
    preparations. Exclude the operational details of campaign communications and execution.
  span_range:
  - src:63db14b38e15#p147.1
  - src:63db14b38e15#p147.7
