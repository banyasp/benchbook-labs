  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is the Politburo’s choice of strategic objective, direction, and sequencing after assessing the
    victories’ significance. Assess the command-level choice and stated rationale; exclude the cryptographic transmission
    of orders and the operational details of the attacks.
  span_range:
  - src:63db14b38e15#p162.6
  - src:63db14b38e15#p162.8
