episodes:
- n: 1
  focus: The DCI initially questions why the agency should assess the subject, weighs his concern that the subject is a US
    citizen against the White House’s national-security rationale and pressure, and ultimately directs CIA staff to proceed.
    Include the authorization and its stated rationale; exclude the profile’s contents or production process.
  span_range:
  - src:0d346e440e67#p12.7
  - src:0d346e440e67#p13.14
  decision: The DCI decides whether to authorize a CIA psychological profile of a US citizen at the White House’s request.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Deputy Director agreed to convey a request concerning the investigation, while the CIA director cautioned him
    to stay within legitimate parameters tied to possible CIA operations and the FBI-CIA delimitation agreement. Include the
    agency’s asserted jurisdictional concern and the resulting delay to the Mexico inquiry; exclude operational details of
    CIA activity.
  span_range:
  - src:0d346e440e67#p16.7
  - src:0d346e440e67#p19.4
  decision: The Deputy Director of Central Intelligence decides whether to accede to the White House’s request to have the
    FBI taper its Watergate investigation in Mexico.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The Deputy Director pushed back on the request to use CIA funds for the arrested men, judging that involving the
    agency would greatly magnify the scandal and implicate people not otherwise touched by it. Include the decision and that
    institutional-risk rationale; exclude any mechanics of covert funding.
  span_range:
  - src:0d346e440e67#p19.6
  - src:0d346e440e67#p19.9
  decision: The Deputy Director of Central Intelligence decides whether the CIA should use unvouchered funds to pay the Watergate
    burglars’ bail or salaries.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision was whether to comply with a White House request for funds or refuse it. The CIA Director said the agency
    could not comply, noting that only the Director could release unvouchered funds and that doing so would require reporting
    to congressional appropriations committees; he also sought to keep the agency out of the burglary. Exclude operational
    details of the burglary.
  span_range:
  - src:0d346e440e67#p20.4
  - src:0d346e440e67#p20.6
  decision: The CIA Director decided not to provide CIA funds to pay the Watergate burglars.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The decision was whether to involve congressional committees or handle the matter within the agency. The Director
    said he saw nothing he needed to report and believed he was successfully keeping the CIA out of the burglary; the account
    says he thought Congress would not help protect the agency. Exclude broader judgments about his conduct beyond this reporting
    decision.
  span_range:
  - src:0d346e440e67#p20.10
  - src:0d346e440e67#p20.12
  decision: The CIA Director decided not to report the White House episode to Congress.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The decision was whether to allow FBI interviews of the employees or ask the FBI to forgo them. The CIA Director
    cited leaks from the FBI’s Alexandria office and said there was no need to involve active-duty agency employees; the account
    notes that one interview had already occurred. Exclude investigative techniques and focus on interagency cooperation and
    accountability.
  span_range:
  - src:0d346e440e67#p21.4
  - src:0d346e440e67#p21.6
  decision: The CIA Director decided to ask the FBI Director not to interview two current CIA employees about the Watergate
    matter.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision was whether to retain the draft’s emphasis on Iranian culpability or revise it to weigh Libya more seriously.
    The coordinators challenged the inference that Iran was the likeliest culprit, citing Iranian denials and apparent lack
    of self-interest, other countries’ attribution to Libya, and unusual conduct by a Libyan-flagged ship. Exclude operational
    details of mining and mine countermeasures.
  span_range:
  - src:0d346e440e67#p29.20
  - src:0d346e440e67#p29.25
  decision: UK Joint Intelligence Committee coordinators decided to make the draft assessment of responsibility for the Red
    Sea mining more balanced, reducing its emphasis on Iran and strengthening the case against Libya.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to leave the larger Soviet mines largely unaddressed, as the IC apparently did because
    the explosions seemed relatively small, or to examine them and alternative explanations for the mining campaign. Keep
    the focus on the analytic judgment and its stated rationale; exclude technical details about mine functioning or detection.
  span_range:
  - src:0d346e440e67#p34.10
  - src:0d346e440e67#p34.13
  decision: The intelligence community decided how much analytic attention to give reports of larger Soviet mines in Libya’s
    arsenal.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
