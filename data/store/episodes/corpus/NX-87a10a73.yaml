episodes:
- n: 1
  focus: The company had underreported training after relying on too few trained operators; an earlier workaround left duties
    with a platoon sergeant and an understudy, but a later error exposed the single point of failure. Focus on the decision
    to establish operator redundancy and review data, not on how to use the DTMS.
  span_range:
  - src:4a13ade3e8ed#p13.2
  - src:4a13ade3e8ed#p13.3
  decision: The company commander and first sergeant decide how to prevent inaccurate training data from recurring by assigning
    primary and secondary DTMS operators in each platoon and reviewing entries before reporting.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The incoming commander asked the outgoing commander to have the S-3 request the MTT and block calendar time, aiming
    to develop leaders, create the first quarterly training brief, and align the plan with brigade guidance. Focus on the
    choice to arrange this preparation and its stated benefits; exclude procedural details of training management.
  span_range:
  - src:4a13ade3e8ed#p15.3
  - src:4a13ade3e8ed#p15.3
  decision: The incoming battalion commander decides to request a unit training management mobile training team and reserve
    four days for training management development before assuming command.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The sergeant major describes using a tasking matrix during competing demands across the RAG cycle and explains that
    concentrating taskings on the red-cycle company preserved some training opportunity elsewhere. Focus on the allocation
    choice and its readiness rationale; exclude the illustrative training activities mentioned in the account.
  span_range:
  - src:4a13ade3e8ed#p22.3
  - src:4a13ade3e8ed#p22.3
  decision: The battalion operations sergeant major decides to direct taskings first to the red-cycle company until it is
    out of Soldiers, to preserve training capacity in amber- and green-cycle companies where possible.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The commander chose a blended exercise to make cost-effective use of limited time and bring several training events
    into one cohesive activity. Treat the decision as a training and resource-allocation choice; exclude the exercise’s operational
    mechanics.
  span_range:
  - src:4a13ade3e8ed#p62.3
  - src:4a13ade3e8ed#p62.4
  decision: The battalion commander decides whether to combine multiple training activities into one multiechelon exercise
    during a limited training window.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The first sergeant describes prioritizing deadline-critical and next-day-essential work while pushing other tasks
    to the next day, citing thin staffing and the risks of overwork. Keep the focus on workload and personnel management,
    not maintenance procedures.
  span_range:
  - src:4a13ade3e8ed#p53.2
  - src:4a13ade3e8ed#p53.2
  decision: The FSC first sergeant decides whether to defer noncritical maintenance work rather than extend the team’s workday.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The FSC suspended its planned maintenance training after the battalion found additional vehicles not fully mission
    capable and overdue for service, and sent its team to assist. The passage identifies the readiness need and the training
    costs; exclude the mechanics of maintenance or vehicle movement.
  span_range:
  - src:4a13ade3e8ed#p50.2
  - src:4a13ade3e8ed#p50.3
  decision: FSC leadership decides whether to suspend approved maintenance training and assist the battalion with its vehicle
    fleet.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
