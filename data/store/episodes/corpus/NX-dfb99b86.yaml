  natsec: true
- n: 2
  focus: The decision point is whether to use guards to deter personnel from leaving or rely on leadership presence. Include
    the perceived overly restrictive effect of guards and the burden of tracking entries and exits, weighed against the maintenance
    objective; exclude details of guard procedures.
  span_range:
  - src:cfd460572281#p4.1
  - src:cfd460572281#p4.1
  decision: The battalion leadership chose not to emplace entry-control guards and instead increased leader presence in company
    motorpool areas.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is how often to establish the full command-and-control node during AAO. Include the tradeoff between
    exercising communications capability and the setup time and effort diverted from maintenance; exclude technical setup
    instructions and equipment-specific implementation details.
  span_range:
  - src:cfd460572281#p4.2
  - src:cfd460572281#p4.2
  decision: The battalion leadership chose to establish the full TOC twice per six-week cycle and use a TAC on the other weeks.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to preserve competing events or make AAO the battalion’s main effort by clearing the
    schedule. Include the reported effects on attendance, supervision, maintenance hours, and equipment readiness; exclude
    the detailed daily timetable except where it explains the choice.
  span_range:
  - src:cfd460572281#p5.2
  - src:cfd460572281#p5.2
  decision: The battalion leadership chose to remove training distractors from the first duty day of each week and protect
    the AAO schedule.
  content_domain: operational-command
