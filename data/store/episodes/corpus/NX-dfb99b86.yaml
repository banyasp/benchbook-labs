  focus: The decision point is how to keep personnel available for afternoon maintenance while addressing objections to meal
    charges. Include the initial BAS recoupment concern and the later discovery that DFAC-provided mermite meals could be
    supplied without charge for qualifying field training; exclude meal logistics beyond that policy choice.
  span_range:
  - src:cfd460572281#p3.4
  - src:cfd460572281#p3.4
  decision: The battalion leadership chose to provide meals at the motorpool rather than release personnel for lunch.
  content_domain: operational-command
