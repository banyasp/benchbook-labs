  focus: The decision point is whether to formalize notification commitments within the law or leave the timing undefined,
    against the background of Congress learning of the Iran-Contra finding more than a year late. The stated reasons were
    to rebuild trust with Congress and improve internal management; exclude operational details of any covert activity.
