episodes:
- n: 1
  focus: Frame the decision as whether and under what standard to authorize force in response to a hostile attack, including
    the stated limits on the action. Exclude operational details of carrying out an engagement; the stated purpose is destruction
    of identified attack forces.
  span_range:
  - src:d327c0a53840#p22.19
  - src:d327c0a53840#p23.1
  decision: JCS approved rules directing the patrol ships and aircraft to use force against hostile attackers, including limited
    pursuit when necessary to destroy identified attack forces.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: Examine the command choice to keep the patrol prepared to proceed under the original itinerary while the reported
    attack remained uncertain. The stated reason was the need for more concrete evidence; exclude operational navigation or
    patrol instructions.
  span_range:
  - src:d327c0a53840#p16.6
  - src:d327c0a53840#p16.7
  decision: CINCPAC directed the patrol to prepare to initiate or repeat its planned patrol while seeking more concrete evidence
    that the destroyers had actually been attacked.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: Focus on the analytic choice to qualify the initial warning rather than pass it on as referring only to the U.S.
    patrol. The source grounds the qualification in an alternative interpretation of the reported DRV concern; exclude the
    underlying collection methods.
  span_range:
  - src:d327c0a53840#p9.4
  - src:d327c0a53840#p9.4
  decision: NSA’s B2 Operations Center issued an amplifying assessment that the warning of a possible attack on the Desoto
    patrol could also concern South Vietnamese raiders.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to proceed or postpone the patrol amid the situation in South Vietnam, and the Joint
    Chiefs’ choice to proceed while retaining limited flexibility to delay. Focus on that command-level timing decision; exclude
    patrol routes and intelligence-collection methods.
  span_range:
  - src:d327c0a53840#p45.6
  - src:d327c0a53840#p48.1
  decision: The Joint Chiefs of Staff decided to proceed with the DeSoto patrol while authorizing a delay of up to 24 hours.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to elevate SIGINT readiness in response to recent actions against the patrol; the stated
    choice is to declare Readiness Bravo. Exclude the ensuing procedural instructions on reporting and distribution.
  span_range:
  - src:d327c0a53840#p97.7
  - src:d327c0a53840#p97.8
  decision: The Director of the National Security Agency declared SIGINT Readiness Bravo for the addressed units.
  content_domain: other:intelligence-readiness policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 6
  focus: Frame the choice as whether to continue holding fire or engage after the contacts continued closing; the report cites
    their speed and continued approach as context. Exclude weapon employment details and do not treat the uncertain identification
    of the contacts as resolved.
  span_range:
  - src:d327c0a53840#p103.2
  - src:d327c0a53840#p104.2
  decision: The Desoto patrol commander ordered fire on closing contacts after warning shots failed to stop their approach.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 7
  focus: Focus on the choice between resuming the patrol and holding it pending further authorization, given uncertainty about
    whether the destroyers had actually been attacked. Exclude operational details of the patrol and the separate OPLAN 34A
    timing instruction.
  span_range:
  - src:d327c0a53840#p130.6
  - src:d327c0a53840#p134.8
  decision: CINCPAC withheld authorization to resume the Desoto patrol until directed, while JCS approval remained pending.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: Treat this as an estimative judgment between hostile-intent and precautionary interpretations of ambiguous communications.
    The report points to the absence of evidence of attack preparations and messages warning against provocation; exclude
    collection methods and technical details.
  span_range:
  - src:d327c0a53840#p152.2
  - src:d327c0a53840#p153.2
  decision: NSA analysts judged that DRV naval references to battle preparation and alerts probably reflected precautionary
    procedures, not preparations to attack the U.S. destroyers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The report weighs whether the activity indicated a significant connection to the Gulf incident, noting no apparent
    resumption of activity, no unusual ship activity or concentrations, and routine communications. The stated disposition
    was to issue a final report unless potentially significant developments appeared; exclude technical collection details.
  span_range:
  - src:d327c0a53840#p170.4
  - src:d327c0a53840#p171.1
  decision: NSA reporting officials assessed that the reported communications activity was not significant and closed reporting
    absent further developments.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The translation and comment present competing interpretations of the message and weigh it against prior North Vietnamese
    concern about South Vietnamese raiders. Preserve the uncertainty in the assessment; exclude the underlying communications
    collection process.
  span_range:
  - src:d327c0a53840#p172.3
  - src:d327c0a53840#p172.3
  decision: NSA analysts judged that a message about guarding against raiders could concern South Vietnamese vessels as much
    as U.S. destroyers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision followed suspension of further Gulf patrols, and the message expressly cites the lack of extensive North
    Vietnamese reactions as an additional reason. The relevant choice is whether to maintain or terminate the elevated readiness
    posture; exclude operational details of intelligence collection.
  span_range:
  - src:d327c0a53840#p179.15
  - src:d327c0a53840#p179.18
  decision: The NSA Director terminated the elevated SIGINT readiness posture and resumed normal reporting.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
