episodes:
- n: 1
  focus: The decision point is how to set dwell-time standards when operational requirements make uniform compliance difficult.
    The report gives the policy options and cites both the need for recovery time and emerging operational demands; exclude
    individual unit-level deployment decisions.
  span_range:
  - src:a9fb710bfd2f#p37.5
  - src:a9fb710bfd2f#p38.2
  decision: USSOCOM leadership updated the deployment-to-dwell policy, retaining a 1:1 requirement while encouraging a 1:2
    ratio and setting a long-term 1:3 goal.
  content_domain: other:military_health_policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to rely on the immediate post-deployment assessment or add a later reassessment for
    concerns that may emerge over time. The report explains why follow-up was considered warranted; exclude the specific screening
    questions and clinical procedures.
  span_range:
  - src:a9fb710bfd2f#p40.3
  - src:a9fb710bfd2f#p41.1
  decision: The Department of Defense mandated a second post-deployment health assessment within three to six months of return.
  content_domain: other:military_health_policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: 'The decision point is how to schedule the transition period: as part of the deployment cycle or as an extension
    after it. The report says this change reduced resistance and increased support, including among spouses; exclude the details
    of conducting assessments during the period.'
  span_range:
  - src:a9fb710bfd2f#p53.2
  - src:a9fb710bfd2f#p53.3
  decision: NSW program leadership built the third-location decompression period into the deployment schedule rather than
    treating it as extra time appended at the end.
  content_domain: other:military_health_policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to discontinue the NSW survey as duplicative or retain it alongside the annual survey.
    The passage says the discontinuation rested on an assumption of duplication, while explaining that the online survey served
    a distinct purpose by allowing timely, ongoing feedback; exclude broader recommendations about future data collection.
  span_range:
  - src:a9fb710bfd2f#p71.4
  - src:a9fb710bfd2f#p72.2
  decision: NSW decision-makers discontinued the always-available anonymous online survey after USSOCOM introduced its annual
    survey.
  content_domain: other:behavioral-health-support-policy
