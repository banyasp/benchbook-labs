- n: 2
  focus: The decision point is whether to distribute the Daily broadly or limit its readership because each issue combined
    sensitive material and broader circulation increased security risk. Include the protective jacket as context for the restricted-distribution
    choice, but exclude printing and handling mechanics.
  span_range:
  - src:caee44faf90f#p6.1
  - src:caee44faf90f#p6.3
  decision: The Agency's Daily planners decided to restrict the newspaper's circulation to a small group of senior policymakers.
  content_domain: intel-oversight
  refusal_sensitivity: medium
