  natsec: true
- n: 3
  focus: The decision was whether to make the Daily the primary publication or not continue it in that role after the experiment.
    The source presents favorable reader responses alongside staffing demands, diverted analytical work, and human wear-and-tear;
    exclude production-process details.
  span_range:
