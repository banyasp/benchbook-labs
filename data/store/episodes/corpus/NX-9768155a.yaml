- n: 2
  focus: The committee chose to require a written record rather than leave serious covert action off the record, while avoiding
    a blanket prohibition that could prevent the CIA from doing its job. Focus on the authority and accountability standard;
    exclude operational details of covert actions.
  span_range:
  - src:f0283e944d8c#p9.3
  - src:f0283e944d8c#p9.5
  decision: The Church Committee recommended requiring a presidential finding or memorandum of reasons for serious covert
    operations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The committee considered whether any federal judge could issue orders and concluded that a defined group of judges
    should handle classified matters. Focus on the institutional design and judicial authorization standard; exclude surveillance
    or collection methods.
  span_range:
  - src:f0283e944d8c#p9.8
  - src:f0283e944d8c#p10.3
  decision: The Church Committee chose a specialized court of designated judges to review intelligence intercept applications
    rather than requiring applications to go to any federal judge.
  content_domain: intel-oversight
  refusal_sensitivity: medium
