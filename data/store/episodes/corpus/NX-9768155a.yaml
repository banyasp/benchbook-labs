  focus: The DCI faced pressure from the White House to withhold cooperation, but chose to adjust to the new political realities
    and provide information. Focus on the oversight decision and its institutional rationale; exclude details of the underlying
    covert activities.
  span_range:
  - src:f0283e944d8c#p8.5
  - src:f0283e944d8c#p8.6
  decision: The Director of Central Intelligence chose to cooperate with the Church Committee rather than stonewall it.
  content_domain: intel-oversight
