  focus: The decision point is whether to act promptly to protect debilitated POWs who might be abandoned or left without
    food, despite the risk of entering territory with hostile or uninformed units. The account gives the urgency and reports
    that teams were assembled and launched, but does not identify the specific deciding office or describe a formal authority
    or standard. Exclude the teams’ insertion methods and other operational details.
