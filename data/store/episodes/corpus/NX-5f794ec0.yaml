episodes:
- n: 1
  focus: The decision point is the Board’s estimative judgment in the September 1962 Special National Intelligence Estimate,
    including its assessment of the possibility and implications of deployment. Consider the stated reliance on Soviet practice
    and policy and the defensive character of the buildup; exclude the operational details of reconnaissance and collection.
  span_range:
  - src:c77e1ac3e5b4#p10.5
  - src:c77e1ac3e5b4#p11.2
  decision: The Board of National Estimates judged that Soviet deployment of medium- and intermediate-range ballistic missiles
    to Cuba was unlikely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision followed failures to anticipate the North Korean invasion and China’s subsequent involvement. The DCI
    sought coordinated estimates that would be authoritative guides for policymakers; the passage does not detail alternatives
    beyond creating this function or not.
  span_range:
  - src:c77e1ac3e5b4#p19.1
  - src:c77e1ac3e5b4#p19.3
  decision: The DCI, with the Intelligence Advisory Committee’s assent, established the National Intelligence Estimates function
    and the Office of National Estimates.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The choice was between a large office and a much smaller one. The stated rationale was that the smaller staff could
    do the job well; exclude any inference about specific estimates or operational methods.
  span_range:
  - src:c77e1ac3e5b4#p24.14
  - src:c77e1ac3e5b4#p24.14
  decision: The head of the Office of National Estimates chose a staff of about 60 rather than the 1,000 people the DCI thought
    the office might require, and the office’s later head maintained a staff of roughly 60–70.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: 'In 1950, the DCI established how disagreements over an NIE would be resolved: the estimate would state the DCI’s
    findings, and agencies unable to agree could record dissent rather than compel a different result. The source grounds
    this arrangement in the DCI’s statutory responsibility to produce national intelligence and the aim of coordinated, authoritative
    estimates; exclude later examples of analytic judgments or policy reactions.'
  span_range:
  - src:c77e1ac3e5b4#p50.4
  - src:c77e1ac3e5b4#p52.6
  decision: The DCI decides that the DCI has final authority over National Intelligence Estimate findings, while participating
    intelligence agencies may concur or formally dissent but cannot outvote the DCI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The passage describes the DCI’s adoption of a process under which requests from various officials and bodies were
    referred for IAC authorization, with the Board able to redirect unsuitable topics or argue against taking them forward.
    The stated rationale is that an estimate involving substantial community resources should be initiated by the community’s
    highest body; exclude the separate choice of which subjects to prioritize and in what order.
  span_range:
  - src:c77e1ac3e5b4#p53.8
  - src:c77e1ac3e5b4#p54.2
  decision: The DCI and IAC decide that formal initiation of a National Intelligence Estimate requires IAC action, rather
    than allowing a request alone to initiate one.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision arose when the DCI needed several estimates in a hurry and assigned a CIA officer to coordinate with
    counterparts in other intelligence agencies. The source says direct contact achieved more helpful compliance; exclude
    the operational details of the estimates themselves.
  span_range:
  - src:c77e1ac3e5b4#p57.3
  - src:c77e1ac3e5b4#p57.4
  decision: The DCI chose to require direct, in-person coordination for six urgent national intelligence estimates rather
    than rely on the earlier predominantly written process.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The source describes a shift from informal specialization to formal panels, with time savings weighed against narrower
    scrutiny and greater influence for panel chairs. Treat the decision as an analytic-review design choice; exclude general
    organizational history beyond that tradeoff.
  span_range:
  - src:c77e1ac3e5b4#p56.5
  - src:c77e1ac3e5b4#p57.1
  decision: ONE leadership established area-focused Board panels and tacitly discouraged members from reviewing estimates
    outside their assigned panels.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: 'The source describes a specific change in 1953: the JAEIC retained responsibility for the technical body, while
    the Board shaped the portions most likely to be read by a non-specialist audience. Focus on the balance between expert
    authorship and accessible national-level assessment; exclude the technical subject matter of the estimate.'
  span_range:
  - src:c77e1ac3e5b4#p72.1
  - src:c77e1ac3e5b4#p72.2
  decision: The DCI changed the review route for the annual Soviet atomic-energy estimate, sending the JAEIC’s completed work
    to the Board for presentation and Board-led drafting of the summary and conclusions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The DCI chose this arrangement after being urged to focus on coordinating the intelligence community, while the DDCI
    would serve as the Agency’s principal executive officer. Focus on this division of responsibility and the DCI’s authority
    over national intelligence; exclude the broader question of whether the DCI should relocate offices.
  span_range:
  - src:c77e1ac3e5b4#p83.2
  - src:c77e1ac3e5b4#p83.4
  decision: The DCI decides to make the DDCI a full USIB member and representative of the CIA in community matters.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision resolves how service intelligence chiefs would participate after the creation and expansion of DIA.
    Focus on the compromise between consolidating Defense intelligence and preserving service contributions and a formal avenue
    for their views; exclude any operational intelligence practices.
  span_range:
  - src:c77e1ac3e5b4#p84.2
  - src:c77e1ac3e5b4#p84.4
  decision: The Secretary of Defense and intelligence-community leaders decide that military service intelligence chiefs will
    lose formal USIB membership but retain observer status and rights to participate in NIE work and express divergent views.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The Soviet leader’s threatening message arrived amid an ongoing crisis, and its official translation reached the
    estimators only shortly before the meeting. The Acting DCI convened the IAC and the estimate was drafted and cleared within
    hours; focus on the choice to compress the estimating and clearance process and its urgency-related tradeoffs, not on
    the crisis’s military operations.
  span_range:
  - src:c77e1ac3e5b4#p82.3
  - src:c77e1ac3e5b4#p82.6
  decision: The Acting DCI decides to convene the IAC and use an expedited process to produce and clear an estimate during
    the 1956 Suez crisis.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: A State Department intelligence chief considered the estimate irrelevant or potentially offensive in light of his
    understanding of the President’s policy and sought its withdrawal. The chair refused, offered dissent as the alternative,
    and continued the meeting; focus on the chair’s handling of disagreement and the member’s right to dissent, not on the
    underlying policy toward Laos.
  span_range:
  - src:c77e1ac3e5b4#p86.2
  - src:c77e1ac3e5b4#p86.2
  decision: The USIB chair decides not to withdraw the Laos estimate after a member objects, allowing him to dissent while
    continuing the meeting’s business.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: 'The decision point is how to handle disagreement over the likely Arab response to US arms assistance to Israel:
    force a dissent into a footnote, dissent from the Director’s own paper, or present the majority and the Director’s views
    separately. Exclude the underlying US arms decision; the passage concerns how the estimate records disagreement.'
  span_range:
  - src:c77e1ac3e5b4#p87.3
  - src:c77e1ac3e5b4#p87.4
  decision: The Director of Central Intelligence chose to state the IAC majority’s judgment and his own view in separate paragraphs
    of the estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is whether to place the South Korea estimate in the regular NIE series or create a special series
    that could be specially handled and circulated narrowly. The stated concern was that regular recipients who did not receive
    it might notice a gap and request the document; exclude the estimate’s substantive military-policy content.
  span_range:
  - src:c77e1ac3e5b4#p89.8
  - src:c77e1ac3e5b4#p90.1
  decision: ONE chose to create a separate special-estimate series for a sensitive paper that required limited distribution.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is whether to allow broader circulation or hold distribution to an even hundred after the President
    recognized that the paper contained exceptionally sensitive sources, methods, and substance. Exclude the estimate’s military
    findings and any technical details about intelligence sources or methods.
  span_range:
  - src:c77e1ac3e5b4#p91.4
  - src:c77e1ac3e5b4#p91.4
  decision: The President chose to cap dissemination of a highly classified Soviet military estimate at one hundred copies.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The DCI chose to hold issuance rather than release the agreed text immediately, taking the timing into account. Exclude
    broader rules about exceptional urgency; focus on this specific delay decision.
  span_range:
  - src:c77e1ac3e5b4#p104.2
  - src:c77e1ac3e5b4#p104.2
  decision: The DCI delayed issuing an agreed estimate until the participants had slept on it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: After a senior official questioned who an unnamed dissenter was, the DCI chose a format identifying signatories,
    concurring members, and dissenters rather than relying on titles alone. Focus on accountability and attribution in estimate
    issuance; exclude unrelated disputes over the estimate’s substantive findings.
  span_range:
  - src:c77e1ac3e5b4#p105.5
  - src:c77e1ac3e5b4#p105.5
  decision: The DCI adopted named signatures and attribution of concurrence and dissent on new NIE covers and footnotes.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The President chose withdrawal, renewed coordination, and resubmission rather than accepting the estimate while the
    dissent remained outside it. The account says the dissent was then considered and recorded in a footnote; exclude any
    operational implications of the estimate itself.
  span_range:
  - src:c77e1ac3e5b4#p105.8
  - src:c77e1ac3e5b4#p105.8
  decision: The President directed the DCI to withdraw and recoordinate an estimate after an unrecorded dissent was raised.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The analytic judgment is that the chance is about 10–20 percent, rather than zero. The source gives reasons tied
    to Khrushchev’s actions and to Soviet interests that a breakup might not advance; exclude the separate operational arrangements
    for delivering intelligence.
  span_range:
  - src:c77e1ac3e5b4#p141.2
  - src:c77e1ac3e5b4#p141.2
  decision: The US intelligence community estimates the chances that Khrushchev will allow the 1960 Summit to be productive.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is whether to preserve the possibility of substantive summit talks by limiting disclosure, or
    inform a wider group despite the risk of a leak. Keep the focus on the policy choice and its effect on the summit; exclude
    details of how the secret was maintained.
  span_range:
  - src:c77e1ac3e5b4#p143.1
  - src:c77e1ac3e5b4#p144.1
  decision: The US delegation chose to keep Khrushchev’s ultimatum within a small circle in Paris rather than disclose it
    more widely before the Four’s meeting.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 21
  focus: The decision is whether to take a precautionary military-readiness step or refrain, given concern about the implications
    of a belligerent Summit breakup. Include the President’s approval and the stated rationale; exclude the technical implementation
    of the alert and the specific commands or facilities involved.
  span_range:
  - src:c77e1ac3e5b4#p144.3
  - src:c77e1ac3e5b4#p144.5
  decision: The President approved the Secretary of Defense’s proposal to place the Armed Forces on an alert basis amid concern
    that the Summit might break up.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The decision point is the estimators’ judgment about whether the Soviet buildup signaled an intention to establish
    a strategic base in Cuba, based on limited evidence and their assessment of Soviet risk-taking. Include the competing
    possibility and the stated reasoning; exclude collection methods and technical descriptions of weapons or imagery.
  span_range:
  - src:c77e1ac3e5b4#p151.3
  - src:c77e1ac3e5b4#p156.7
  decision: US intelligence estimators and the US Intelligence Board judged that Soviet strategic offensive weapons in Cuba
    were unlikely, issuing that judgment in the September 1962 estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 23
  focus: The decision is whether to reopen the standing estimate in light of early reports or leave it in place while disseminating
    incoming items through current intelligence. Include the board’s standards for importance and evidentiary firmness; exclude
    the underlying collection and imagery processes.
  span_range:
  - src:c77e1ac3e5b4#p157.8
  - src:c77e1ac3e5b4#p158.5
  decision: The estimates board chose not to formally recall or revise the Cuba estimate before the October 14 photographs,
    relying on current-intelligence reporting unless new evidence met its revision criteria.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 24
  focus: The choice was to inform the President that night or give the photo interpreters another night to work and the President
    a night’s rest. Keep the focus on the timing of the intelligence notification, not on how the imagery was collected or
    interpreted.
  span_range:
  - src:c77e1ac3e5b4#p163.4
  - src:c77e1ac3e5b4#p163.5
  decision: McGeorge Bundy, as the official receiving the intelligence report, decided to wait until the next morning to inform
    the President about the suspected missiles.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 25
  focus: Examine the choice of public and policy terminology and its diplomatic implications. The passage says “blockade”
    was avoided as more provocative, while acknowledging that either term could offend the Soviet Union; do not recast this
    as a fully documented choice among the substantive military response options.
  span_range:
  - src:c77e1ac3e5b4#p163.5
  - src:c77e1ac3e5b4#p163.5
  decision: The President chose to call the response a “quarantine” rather than a “blockade.”
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 26
  focus: The briefer could withhold the images, allow television use only, or also release sanitized versions for publication;
    the account describes the request, headquarters’ permission, and the decision to release them. Focus on intelligence disclosure
    and credibility concerns, not on imagery collection methods or the technical preparation of the photographs.
  span_range:
  - src:c77e1ac3e5b4#p167.7
  - src:c77e1ac3e5b4#p168.6
  decision: The CIA intelligence briefer in London agreed to release sanitized photographs of the Soviet buildup to the British
    press.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 27
  focus: The choice balanced the ambassador’s French posting against the President’s and Secretary of State’s need for his
    close attention to Soviet matters after the Cuban missile discovery. Exclude any broader claims about the ambassador’s
    duties that are not stated here.
  span_range:
  - src:c77e1ac3e5b4#p177.5
  - src:c77e1ac3e5b4#p177.5
  decision: The President decided whether to keep the newly appointed ambassador to France in Washington or release him to
    take up his post, and delayed his departure.
  content_domain: other:diplomatic-staffing
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 28
  focus: The British ambassador urged publication because skeptical British reactions made it important to persuade laypeople
    that Soviet missiles were installed; the President reviewed the photographs and agreed. Exclude technical analysis of
    how the photographs were obtained or interpreted.
  span_range:
  - src:c77e1ac3e5b4#p177.16
  - src:c77e1ac3e5b4#p178.1
  decision: The President decided to publish the missile-site photographs the following day.
  content_domain: other:public-disclosure-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 29
  focus: The Prime Minister’s stated purpose was to have steps ready for action by the UN’s deliberative body in the event
    of a Soviet veto or denial; he later clarified that the proposal did not express doubt about the evidence. Keep this at
    the level of international policy and exclude any operational details of conducting an inspection.
  span_range:
  - src:c77e1ac3e5b4#p180.1
  - src:c77e1ac3e5b4#p180.4
  decision: The Canadian Prime Minister proposed an international on-site inspection in Cuba to prepare for possible United
    Nations action if the Soviet Union vetoed or denied the missile bases.
  content_domain: other:international-diplomacy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
