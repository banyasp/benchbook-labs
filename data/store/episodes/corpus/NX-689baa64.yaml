- n: 2
  focus: The judge rejected the view that the Court could simply declare the accused prisoners of war, reasoning that Protocol
    I was not binding on South Africa and had not yet gained sufficient support as customary international law. The judge
    nevertheless treated developments in humanitarian law and the accused persons’ status as relevant to sentencing; exclude
    the distinct sentencing choice.
  span_range:
  - src:6a6c7ba7d13e#p1.4
  - src:6a6c7ba7d13e#p1.5
  decision: The trial judge decided whether the accused should be treated as prisoners of war or remain subject to the Court’s
    criminal jurisdiction.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The judge rejected capital punishment but imposed long prison terms, weighing deterrence and community interests
    against the accused persons’ youth, lack of prior convictions, political context, constrained circumstances, and the foreseeable
    risk of harm to civilians. Keep the focus on sentencing, not the operational conduct described as part of the case facts.
  span_range:
  - src:6a6c7ba7d13e#p1.5
  - src:6a6c7ba7d13e#p1.7
  decision: The trial judge decided whether to impose the death penalty or a term of imprisonment, and what prison terms to
    impose.
  content_domain: other:criminal adjudication
