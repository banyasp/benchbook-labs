  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to leave rolling stock dispersed and traffic operating or centralize equipment and
    halt traffic after Villa captured trains and controlled the railroad south of Chihuahua. The stated reason was to reduce
    the rolling stock vulnerable to capture; exclude the operational details of carrying out the order.
  span_range:
  - src:3d03d7523b41#p73.20
