- n: 7
  focus: The decision point is whether to prepare for a possible attack and pursue Villa despite the governor’s view that
    an attack on Torreón was improbable. The minister ordered preparation after reports that Villa had occupied Bermejillo
    and was moving south; exclude tactical details of the pursuit.
  span_range:
