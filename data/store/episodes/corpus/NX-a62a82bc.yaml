- n: 3
  focus: The choice was whether to release the decrypts or protect the secret source; the British government authorized release
    because it judged the potential benefit against the Indian revolutionaries greater than the risk of damage from disclosure.
    Include the stated view that the messages also provided information about German activity; exclude the technical means
    of obtaining or decrypting them.
  span_range:
  - src:3d03d7523b41#p38.8
  - src:3d03d7523b41#p38.12
  decision: The British naval intelligence leadership authorized release of decrypted cables about Indian conspirators to
    the United States.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The department faced a tension between preserving the secrecy of the messages’ sources and helping prosecutors establish
    admissible evidence. The passage says it would not explain how most copies were obtained and was not prepared to send
    a decryption witness, while warning that the prosecution might fail without adequate proof; exclude the technical details
    of the messages and their decryption.
  span_range:
  - src:3d03d7523b41#p38.12
  - src:3d03d7523b41#p40.12
  decision: The State Department chose not to disclose how it obtained certain encrypted messages or provide a department
    representative to explain their decryption in court.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision is whether the US official may release books he had promised to keep under his control, and whether
    the Bureau qualifies as part of his office so the loan remains consistent with that promise. Include the changed postwar
    circumstances and the continuing concern that disclosure could harm people connected with how the books were acquired;
    exclude the books’ technical use.
  span_range:
  - src:3d03d7523b41#p44.24
  - src:3d03d7523b41#p45.6
  decision: The US peace-commission secretary and the British embassy official decide to lend two codebooks to the US Cipher
