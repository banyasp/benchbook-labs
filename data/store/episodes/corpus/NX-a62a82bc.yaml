- n: 2
  focus: The department could suppress the activity at Britain’s request or decline to act; it declined because the activity
    had not violated US law. Keep the scenario focused on the legal basis for refusing foreign pressure, not on later investigations
    or prosecutions.
  span_range:
  - src:3d03d7523b41#p33.11
  - src:3d03d7523b41#p34.2
