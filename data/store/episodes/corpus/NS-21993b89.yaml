episodes:
- n: 1
  focus: The decision point is how to assign command as the plan grew from a SOF mission into an operation integrating U.S.,
    coalition, and Afghan forces. The source says the planners chose CFLCC-Fwd because that integration was complex; exclude
    later operational maneuvers and force-employment details.
  span_range:
  - src:5ac87a3c8c3e#p27.7
  - src:5ac87a3c8c3e#p27.18
  decision: The initial planning team chose for CFLCC-Fwd to assume command of Operation ANACONDA rather than leaving command
    with 10th Mountain, the 101st Airborne, or a SOF commander.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The commander weighed broad attacks on cave complexes against limiting strikes to targets with a basis for assessing
    their value; he said he did not want to attack caves arbitrarily without knowing what they contained. Keep this to the
    decision and its evidentiary rationale, not the later target-nomination or weapons details.
  span_range:
  - src:5ac87a3c8c3e#p59.2
  - src:5ac87a3c8c3e#p59.5
  decision: The CJTF Mountain commander chose not to attack cave complexes indiscriminately before the operation.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: The decision point is whether to establish a forward ASOC or continue relying on the CAOC’s existing ASOC-like functions
    and the perceived lack of demand. Focus on the command and preparedness choice and its stated practical and operational
    rationales; exclude technical communications and equipment details.
  span_range:
  - src:5ac87a3c8c3e#p53.17
  - src:5ac87a3c8c3e#p54.4
  decision: CFLCC and CFACC leadership did not formally request an ASOC for CJTF Mountain before Operation ANACONDA.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The division made force-composition choices to keep its footprint small while deployed for a force-protection mission;
    the source contrasts the omitted TACPs with the air-defense capability it brought. Rebuild the choice as a staffing and
    resource tradeoff, and exclude technical details of air support or air defense employment.
  span_range:
  - src:5ac87a3c8c3e#p54.18
  - src:5ac87a3c8c3e#p55.1
  decision: 10th Mountain Division leadership chose a reduced deployment that omitted its usual embedded TACPs and included
    more air defense.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The Afghan commander faced continuing the advance or withdrawing temporarily after the force came under fire and
    suffered casualties. Focus on the command choice and the stated need to regroup, obtain vehicles, and re-arm; exclude
    the details of force movements and combat.
  span_range:
  - src:5ac87a3c8c3e#p64.20
  - src:5ac87a3c8c3e#p65.2
  decision: The Afghan force commander decides to pull back to Gardez to regroup, obtain vehicles, and re-arm rather than
    continue the operation immediately.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The aircraft commander faced releasing weapons or withholding them when asked whether the crew could see the AC-130
    below and could not. Focus on the decision under uncertainty and the risk of conflicting aircraft; exclude weapon-delivery
    procedures and the later, separate cancellation for medical evacuation activity.
  span_range:
  - src:5ac87a3c8c3e#p67.21
  - src:5ac87a3c8c3e#p68.2
  decision: The B-52 aircraft commander decides to withhold weapons when unable to confirm the AC-130’s position below.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 7
  focus: CJTF Mountain declared the entire village hostile after mortar attacks continued and enemy forces regenerated positions;
    the CAOC questioned whether the request was permitted, and USCENTCOM confirmed a strike was allowed if CJTF Mountain made
    that declaration. Focus on the designation, authority, and basis for the decision; exclude attack methods and effects.
  span_range:
  - src:5ac87a3c8c3e#p68.5
  - src:5ac87a3c8c3e#p68.12
  decision: CJTF Mountain decides to declare Marzak hostile, permitting a strike under the stated USCENTCOM rules of engagement.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 8
  focus: The truck appeared to be resupplying enemy forces, but it was behind the battle lines and the ASOC had urgent troops-in-contact
    requests; CJTF Mountain reiterated the order to engage it. Focus on the target-priority decision and the competing protection
    needs; exclude surveillance details and the mechanics of locating or attacking the truck.
  span_range:
  - src:5ac87a3c8c3e#p72.7
  - src:5ac87a3c8c3e#p73.4
  decision: CJTF Mountain decides to prioritize an attack on a truck over competing troops-in-contact requests for close air
    support.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 9
  focus: The decision was whether to rely only on immediate requests or also use preselected targets in designated zones when
    the ground situation was too fluid for advance tasking. The stated reasons included maintaining pressure on enemy forces
    and making use of aircraft that otherwise might not receive an immediate XCAS task; exclude the later dispute between
    the CAOC and ASOC over sortie ownership.
  span_range:
  - src:5ac87a3c8c3e#p92.12
  - src:5ac87a3c8c3e#p93.8
  decision: The CAOC, acting on CFLCC-Fwd guidance, established engagement zones and authorized pre-planned XCAS strikes in
    those zones without waiting for an immediate ground-controller request.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 10
  focus: The decision point is whether to permit strikes outside the designated zones under the ordinary theater rules or
    reserve that authority at higher headquarters. The source cites collateral-damage and infrastructure concerns, uncertainty
    about civilians and humanitarian activity, and ongoing time-sensitive targeting; exclude the separate question of which
    particular target should be struck.
  span_range:
  - src:5ac87a3c8c3e#p93.9
  - src:5ac87a3c8c3e#p94.2
  decision: USCENTCOM’s senior command authorities withheld strike authority for targets outside designated engagement zones,
    requiring higher approval for those strikes.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 11
  focus: The concrete choice was whether to engage a suspected supply location or refrain given uncertainty about the location
    of friendly teams. The source gives the reason for not striking; do not infer the supplies’ identity or describe how the
    crew searched for or engaged targets.
  span_range:
  - src:5ac87a3c8c3e#p94.19
  - src:5ac87a3c8c3e#p94.22
  decision: The AC-130 crew did not strike suspected al-Qaeda supplies near Marzak because two SOF teams were believed to
    be nearby and their locations were unknown.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 12
  focus: The decision was whether to proceed with the planned operation or postpone it until weather conditions improved.
    The account links the cancellation and delay to poor weather and says commanders reassessed conditions before proceeding
    later; exclude the details of the strike itself.
  span_range:
  - src:5ac87a3c8c3e#p97.15
  - src:5ac87a3c8c3e#p97.20
  decision: CJTF Mountain delayed the Objective Ginger seizure after poor weather led to cancellation of the planned Cobra
    strike.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 13
  focus: The decision point is whether to create a senior air liaison presence at the land-component headquarters or continue
    without one. The account says Anaconda made clear that a trusted liaison could help work through issues and improve component
    commanders’ visibility; exclude the operational details of air support and later ACCE assignments to other headquarters.
  span_range:
  - src:5ac87a3c8c3e#p124.10
  - src:5ac87a3c8c3e#p124.17
  decision: The CFACC, with approval from the theater commander and Air Force Chief of Staff, decided to establish the Air
    Component Coordinating Element and send a senior Air Force representative to the CFLCC headquarters.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
