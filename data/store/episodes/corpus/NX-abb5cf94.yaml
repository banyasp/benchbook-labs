episodes:
- n: 1
  focus: The decision point is whether to interpret alarming Soviet behavior as preparation for imminent military action or
    as pressure short of war. The analysts cited the absence of specific evidence of offensive military preparations and judged
    that Moscow needed to avoid conflict; exclude later crises and operational responses.
  span_range:
  - src:cf58b567c54e#p7.7
  - src:cf58b567c54e#p8.6
  decision: ORE analysts judged in July 1946 that the Soviet Union was unlikely to attack the West in the near term.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to assess invasion as likely or unlikely, given developments including Soviet withdrawal,
    military improvements, and troop movements. The estimate identified conditions that could change the risk; exclude later
    hindsight about the outbreak of war except where it clarifies the contemporaneous assessment.
  span_range:
  - src:cf58b567c54e#p9.3
  - src:cf58b567c54e#p9.5
  decision: ORE analysts judged in 1948 that a North Korean armed invasion of South Korea was unlikely under the conditions
    then assessed.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to assess Chinese intervention as likely or unlikely as UN forces advanced and reports
    accumulated. The analysts reasoned that intervention could increase the risk of global war and affect Soviet-Chinese relations;
    exclude military advice about how to respond to intervention.
  span_range:
  - src:cf58b567c54e#p10.3
  - src:cf58b567c54e#p11.6
  decision: ORE analysts judged in 1950 that China was unlikely to intervene directly in the Korean War, despite evidence
    of capability and reports suggesting intervention was likely.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to interpret the length of Mao’s visit as evidence of a strained alliance or as something
    other than a sign of serious conflict. Keep the focus on the analysts’ assessment and their stated reasons; exclude operational
    implications.
  span_range:
  - src:cf58b567c54e#p14.5
  - src:cf58b567c54e#p14.6
  decision: ORE analysts judge that Mao’s extended Moscow visit does not signal serious trouble in the Sino-Soviet alliance.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to continue treating Ho’s relationship with the USSR as obscure and neutrality as possible,
    or to assess Soviet recognition as evidence of a more consequential alignment. Include the analysts’ stated expectations
    about regional influence and Soviet aims; exclude any operational response to France’s predicament.
  span_range:
  - src:cf58b567c54e#p15.4
  - src:cf58b567c54e#p15.5
  decision: ORE analysts revise their assessment of Ho Chi Minh’s government after Soviet recognition of it.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether Soviet support is likely to continue as a means of expanding influence or whether its
    strategic purpose has been achieved and further aid would be counterproductive. Include the analysts’ reasoning about
    Israel’s effect on the Arab world and its pro-Western sympathies; exclude the underlying movement of arms or people.
  span_range:
  - src:cf58b567c54e#p15.5
  - src:cf58b567c54e#p15.6
  decision: ORE analysts revise their assessment of whether continued Soviet support for Israel serves Soviet interests.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
