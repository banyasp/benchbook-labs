episodes:
- n: 1
  focus: The analyst chose to contact DHS and research the target’s status rather than detask the facilities that day, despite
    indicators the user might be a United States person. The assessment attributes the delay to a misunderstanding of the
    prompt-detasking requirement; exclude collection methods and technical details.
  span_range:
  - src:5a59c1180290#p30.3
  - src:5a59c1180290#p30.3
  decision: The NSA analyst decided whether to promptly detask facilities or continue researching a target’s United States-person
    status while awaiting a DHS response.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The team noted that the incident involving multiple targets might ultimately be assessed as detasking delays, but
    counted the associated errors as tasking errors in the meantime. Its stated reason was consistency with the corresponding
    Section 707 Report while NSD’s investigation remained open; exclude the underlying operational details.
  span_range:
  - src:5a59c1180290#p27.5
  - src:5a59c1180290#p27.5
  decision: The joint oversight team decided to count a still-investigated incident as tasking errors pending the investigation’s
    conclusion, rather than classify it as detasking delays.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to address recurring non-compliant queries through mandatory retraining and conditional
    access, rather than leave access unchanged. The assessment connects the measures to efforts to address issues causing
    non-compliant queries; exclude the broader training program details and later compliance statistics.
  span_range:
  - src:5a59c1180290#p41.4
  - src:5a59c1180290#p42.2
  decision: FBI leadership made revised query training mandatory and temporarily suspended unminimized-information access
    for users who did not complete it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to access results from a United States-person query conducted solely for evidence of
    a crime unrelated to national security, or first seek the required FISC order or refrain from access. The agent believed
    the Capitol Breach implicated national security, while NSD assessed the query as solely for a crime unrelated to national
    security; exclude details about conducting the query itself.
  span_range:
  - src:5a59c1180290#p57.5
  - src:5a59c1180290#p58.2
  decision: An FBI agent accessed query results concerning the Capitol Breach without first obtaining a FISC order under Section
    702(f)(2)(A).
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether the agent could use the information for this personal, work-adjacent purpose without
    a specific factual basis linking the person to foreign intelligence or evidence of a crime. The agent said the query was
    intended to check for derogatory information before agreeing to speak; NSD found the required justification absent. Exclude
    the mechanics of the query.
  span_range:
  - src:5a59c1180290#p56.2
  - src:5a59c1180290#p56.3
  decision: An FBI agent chose to query unminimized FISA information about a United States person before deciding whether
    to speak to the person’s company security team.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is FBI’s adoption of preapproval for batch jobs of 100 or more queries, later expanded to all
    batch jobs. Focus on the balance between operational flexibility and privacy and civil-liberties safeguards; exclude the
    mechanics of conducting queries.
  span_range:
  - src:5a59c1180290#p61.5
  - src:5a59c1180290#p62.5
  decision: FBI decides whether to require attorney preapproval for batch queries and expands the requirement to all batch
    jobs.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is changing the system default from including Section 702 data unless a user opted out to excluding
    it unless a user opts in. Focus on the choice of a default safeguard and its privacy rationale; exclude system-operation
    details beyond that policy choice.
  span_range:
  - src:5a59c1180290#p62.2
  - src:5a59c1180290#p62.2
  decision: FBI decides to make exclusion of Section 702-acquired information the default query-system setting.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is replacing pre-populated justification options with free-text, case-specific explanations for
    queries involving United States person identifiers when users seek Section 702 content. Focus on accountability and oversight;
    exclude the substantive conduct of any query.
  span_range:
  - src:5a59c1180290#p62.3
  - src:5a59c1180290#p62.3
  decision: FBI decides to require user-written, case-specific justifications for certain queries instead of menu-selected
    justifications.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
