collection: cia-csi-books
doctrine: false
prompt: find_episodes.v1+find_episodes.natsec-corpus.v2
episodes:
- n: 1
  focus: Assess the President’s choice to consult allied governments and frame aid as an incentive for reform, given the crisis’s
    potential consequences for East-West relations and concern about Soviet reaction. Exclude operational contingency planning
    and any details not about this diplomatic and economic policy choice.
  span_range:
  - src:5315af4e52d9#p25.1
  - src:5315af4e52d9#p25.3
  decision: The President chose to coordinate with allied leaders on a response to the Polish crisis and recommend that Western
    economic aid encourage systemic reform.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: 'Assess the DCI’s warning in light of the competing interpretations in the intelligence: unusual activity could reflect
    preparation, but evidence was sparse and did not indicate an imminent operation. Exclude technical collection methods
    and focus on the analytic judgment and its uncertainty.'
  span_range:
  - src:5315af4e52d9#p27.1
  - src:5315af4e52d9#p28.1
  decision: The DCI chose to warn senior officials that recent Soviet military activity suggested preparation to intervene
    if the Polish crisis was not brought under control.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: Assess the officials’ choice to use allied signaling for deterrence and to prepare a coordinated response, given
    the perceived possibility of intervention and the prospect that strong Western reaction and Polish resistance could deter
    it. Exclude operational military plans and focus on the policy decision and its stated rationale.
  span_range:
  - src:5315af4e52d9#p29.3
  - src:5315af4e52d9#p30.1
  decision: Senior US national security officials chose to seek allied warnings to deter Soviet intervention and develop coordinated
    measures to impose costs if intervention occurred.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether and how to make the U.S. opposition to intervention explicit, while reassuring the
    Soviet leader that the United States did not intend to exploit Poland’s situation. The officials weighed the reported
    buildup and historical precedent against the consequences for East-West relations; exclude operational details of any
    military response.
  span_range:
  - src:5315af4e52d9#p49.1
  - src:5315af4e52d9#p50.1
  decision: The President and senior national-security officials decided on 3 December to send a private warning to the Soviet
    leader and issue a public statement opposing intervention in Poland.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to publicize the intelligence and alert political leaders or hold back. Officials weighed
    the source’s credibility and other corroborating indicators against doubts about the analysis, including uncertainty about
    Polish cooperation and the risk of needless panic or damage to U.S. credibility; exclude details of the reported intervention
    plan.
  span_range:
  - src:5315af4e52d9#p53.1
  - src:5315af4e52d9#p54.2
  decision: Senior U.S. officials decided on 6 December to suspend public disclosure of the intervention intelligence and
    not brief Congress or the President-elect at that time.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether to reverse the previous day’s restraint and take public and diplomatic action after
    receiving a report that intervention might begin within hours. The officials weighed the urgency and apparent corroboration
    of the warning against earlier doubts about its accuracy and the risk of panic or loss of credibility; exclude operational
    details of the reported plan.
  span_range:
  - src:5315af4e52d9#p55.1
  - src:5315af4e52d9#p55.2
  decision: The President and senior officials decided on 7 December to brief congressional leaders and proceed with a public
    statement and diplomatic initiatives warning against Soviet intervention.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: 'The decision was to act publicly and diplomatically despite uncertainty, rather than remain silent or delay: the
    message said the probability of intervention was sufficiently high to justify steps to affect Soviet decision-making.
    The stated aims were to deter intervention, demonstrate Western resolve, and warn the Polish people; exclude the operational
    details of the press briefing.'
  span_range:
  - src:5315af4e52d9#p56.3
  - src:5315af4e52d9#p57.2
  decision: The President and National Security Council decide to issue a public warning and urge allied governments to signal
    opposition to possible Soviet intervention in Poland.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 8
  focus: The task force was reportedly ready to act, subject to party authorization, but the leadership backed down at the
    last minute. The reported reason was that the country was not yet ready; exclude the operational details of the proposed
    crackdown.
  span_range:
  - src:5315af4e52d9#p65.1
  - src:5315af4e52d9#p65.2
  decision: The Polish party leadership decides not to authorize the prepared crackdown on strikes and protests in August
    1980.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The account infers that Soviet leaders chose to postpone the exercise rather than proceed, after concluding that
    pressure on Polish leaders was producing results and that they could grant more time. The relevant choice concerns whether
    to move forces into Poland; exclude military planning and execution details.
  span_range:
  - src:5315af4e52d9#p71.1
  - src:5315af4e52d9#p73.2
  decision: Soviet political leaders decide to defer the planned military maneuvers in Poland after the Moscow summit.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to act on uncertain warning evidence or wait for greater confidence; the participants
    chose to wait, citing doubts about intelligence accuracy, especially reporting about Polish cooperation. Keep this distinct
    from the later diplomatic and public actions, and exclude operational details.
  span_range:
  - src:5315af4e52d9#p77.3
  - src:5315af4e52d9#p79.1
  decision: The U.S. policy principals at the 6 December meeting chose to recommend withholding action until they were fairly
    certain Soviet intervention was imminent.
  content_domain: other:foreign-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 11
  focus: 'The decision point is how to interpret limited mobilization and logistics: the December assessment said evidence
    did not show the buildup expected for a large-scale invasion, while the passage identifies a plausible collaborative scenario
    that the assessment omitted. Focus on analytic framing and its assumptions; exclude intelligence collection methods.'
  span_range:
  - src:5315af4e52d9#p79.1
  - src:5315af4e52d9#p81.2
  decision: CIA analysts chose to assess the observed preparations against the expected indicators of a large-scale Soviet
    invasion, rather than foregrounding a possible Polish-led, Soviet-backed use of force.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The decision point is the estimate’s increased likelihood of Polish-imposed force, considered alongside the possibility
    of Soviet intervention. The stated reasons include evidence of Polish planning and Moscow’s reluctance to bear the costs
    of direct intervention; exclude operational details of any contemplated action.
  span_range:
  - src:5315af4e52d9#p92.3
  - src:5315af4e52d9#p94.1
  decision: The intelligence analysts chose to assign a higher probability to the Polish regime imposing martial law in response
    to a major confrontation in their late-January estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The decision point is whether to make a public warning or remain publicly restrained as the Warsaw Pact exercise
    was extended and intelligence indicated possible Polish or Soviet force. The administration chose to warn, citing those
    concerns and the potentially grave effects of external intervention or repression on East-West relations. Exclude operational
    assessments of troop movements and force readiness.
  span_range:
  - src:5315af4e52d9#p119.1
  - src:5315af4e52d9#p119.2
  decision: The US administration decided to publicly warn Warsaw and Moscow against using force in Poland.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 14
  focus: The Commission weighed reinstating the strike call against accepting the agreement and ratified cancellation, despite
    members’ objections to the agreement’s vague or missing commitments. The source says restarting the strike would be difficult
    and could leave the Polish regime no room to avoid martial law. Exclude the tactical organization of strike preparations.
  span_range:
  - src:5315af4e52d9#p121.1
  - src:5315af4e52d9#p121.2
  decision: Solidarity’s National Coordinating Commission decided to ratify cancellation of the threatened general strike.
  content_domain: other:labor-policy
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 15
  focus: The decision point is whether to make concessions to Solidarity or face the threatened strike and the possibility
    of martial law. The government agreed to investigate the Bydgoszcz violence, advance union-registration measures, and
    permit Rural Solidarity to function in practice; the account links the compromise to leaders’ concern that they could
    not control events once a general strike began. Exclude the operational details of martial-law planning and implementation.
  span_range:
  - src:5315af4e52d9#p120.2
  - src:5315af4e52d9#p122.1
  decision: The Polish government, led by the prime minister and party leader, agreed to concessions that suspended the threatened
    general strike.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 16
  focus: The decision point is whether to escalate the warning beyond preceding assessments or preserve greater uncertainty
    about Soviet intent. The source gives the case for escalation and the counterarguments, including the lack of additional
    mobilization and doubts that the available force could invade unilaterally; exclude the underlying collection methods.
  span_range:
  - src:5315af4e52d9#p122.3
  - src:5315af4e52d9#p124.2
  decision: The DCI and intelligence analysts decide to issue an Alert Memorandum warning that Soviet intervention in Poland
    is likely and could occur imminently.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The decision was whether to accept the meeting request, which offered an opportunity to influence and assess the
    Polish leadership, or reject it. The source says Soviet officials wanted to urge severe measures and convey their position
    personally; exclude the military arrangements surrounding the meeting.
  span_range:
  - src:5315af4e52d9#p130.2
  - src:5315af4e52d9#p131.2
  decision: The Soviet Politburo decides to approve the Polish leaders’ request for a meeting to press them toward martial
    law.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 18
  focus: The Polish leaders faced signing the directives and committing to the planned crackdown, or refusing and preserving
    time and discretion. The source connects their refusal to favorable reactions to the strike moratorium, concern about
    violence and unreliable forces, and their effort to avoid being locked into Moscow’s preferred course; exclude implementation
    details of the plans.
  span_range:
  - src:5315af4e52d9#p133.1
  - src:5315af4e52d9#p134.1
  decision: The Polish prime minister and party leader decide not to sign and date the Soviet-proffered martial-law directives.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 19
  focus: The decision point is whether to publicly challenge the letter or refrain; the US issued a statement calling it interference
    in Poland’s internal affairs and inconsistent with the Helsinki Final Act. The stated rationale was concern about possible
    Soviet military action, alongside the letter’s interference with Polish internal affairs; exclude any assessment of whether
    the concern was correct.
  span_range:
  - src:5315af4e52d9#p147.1
  - src:5315af4e52d9#p147.1
  decision: The US Government publicly objected to the Soviet letter to Poland.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 20
  focus: The decision point is the analysts’ estimate of whether Moscow would intervene before the congress or wait to assess
    its outcome. They concluded Moscow would allow it to proceed, reasoning that the Soviets would first see whether pressure
    moderated reform and would base their next move on the resulting balance of forces; do not treat this inference as a confirmed
    Soviet decision.
  span_range:
  - src:5315af4e52d9#p151.1
  - src:5315af4e52d9#p151.1
  decision: US intelligence analysts judged that Soviet leaders would let the Polish party congress proceed before deciding
    their next move.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The decision point is the Embassy’s estimate of the regime’s likely choice in the existing situation and its prospects
    for success. It assessed an attempt as less than fifty-fifty, citing risks of resistance, unreliable security forces,
    possible civil conflict or Soviet intervention, and economic catastrophe; exclude the operational modalities of imposing
    martial law mentioned in the cable request.
  span_range:
  - src:5315af4e52d9#p163.1
  - src:5315af4e52d9#p164.1
  decision: The US Embassy in Warsaw assessed whether the Polish regime would impose martial law and whether such an attempt
    could succeed.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The decision point is the analysts’ estimative framing of the martial-law evidence, including whether to connect
    the Politburo discussion to the prior National Defense Committee meeting and the broader leadership. Keep the focus on
    analytic judgment and its stated evidentiary basis; exclude the operational details of martial-law planning.
  span_range:
  - src:5315af4e52d9#p168.1
  - src:5315af4e52d9#p169.1
  decision: CIA intelligence analysts chose to characterize the September Politburo discussion as only possible hardening
    among some senior military officers.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 23
  focus: The decision point is whether to use military personnel in domestic functions or rely on other government measures,
    and the policy reasons for that choice. Exclude deployment logistics and other operational details; retain the stated
    public rationale and analysts’ assessment of the move’s broader significance.
  span_range:
  - src:5315af4e52d9#p179.2
  - src:5315af4e52d9#p180.1
  decision: The Polish government chose to assign the military a domestic role in maintaining law and order and addressing
    local problems.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 24
  focus: The decision point is the choice between the parliamentary resolution and pressing for formal legislation, in light
    of the ongoing strikes and parliamentary resistance. Distinguish the NID’s description of a moderate choice from the alternative
    explanation that the prime minister was avoiding a confrontation with parliament; exclude unrelated operational matters.
  span_range:
  - src:5315af4e52d9#p181.2
  - src:5315af4e52d9#p182.2
  decision: The Polish prime minister chose to pursue a parliamentary resolution demanding an end to strikes rather than immediately
    confront Solidarity with a formal strike-ban law.
  content_domain: other:domestic labor and emergency law
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 25
  focus: The decision point is the DIA’s estimate of the likelihood and timing of martial law, rather than the less alarming
    interpretation in other reporting. Reconstruct the factors the analysts weighed, including leadership changes, regime
    measures, pressure from the USSR and military hierarchy, and unrest; exclude implementation details.
  span_range:
  - src:5315af4e52d9#p183.1
  - src:5315af4e52d9#p183.3
  decision: DIA analysts assessed that martial law might be imposed in Poland during the winter.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 26
  focus: The decision point is whether to pursue binding legal restrictions on strikes after the earlier appeal for a voluntary
    end to strikes. The source says this fulfilled a prior pledge and describes the regime’s stated aim of curbing labor unrest,
    alongside anticipated opposition and risks to talks; exclude speculation about the bill’s unknown terms as established
    fact.
  span_range:
  - src:5315af4e52d9#p189.4
  - src:5315af4e52d9#p190.1
  decision: The Polish head of government directs the government to submit a draft anti-strike law to parliament.
  content_domain: other:labor law and policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 27
  focus: The decision point is whether to use force to end the occupation after the academy was surrounded and a crowd gathered.
    The intelligence report assessed that the regime sought to demonstrate resolve against future strikes; treat that as an
    attributed assessment, not a confirmed motive, and exclude operational details of the police action.
  span_range:
  - src:5315af4e52d9#p190.3
  - src:5315af4e52d9#p191.1
  decision: The Polish regime chooses to use police force to remove striking cadets from the firefighters’ academy.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 28
  focus: The decision point is the union commission’s choice to authorize a strike conditionally rather than refrain from
    collective action while the bill was pending. The surrounding account identifies the bill and the union’s objections;
    exclude the separate threats concerning broadcasting and the rejected trade-union-law provision as distinct decisions.
  span_range:
  - src:5315af4e52d9#p191.2
  - src:5315af4e52d9#p192.2
  decision: Solidarity’s National Commission approves a conditional 24-hour general strike if parliament passes the government’s
    extraordinary-powers bill.
  content_domain: other:labor and political strategy
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 29
  focus: The decision point is whether to impose martial law immediately or wait until the regime had more time to win support.
    The First Secretary argued that immediate action could trigger a nationwide strike and street protests, overwhelm Polish
    resources, require allied intervention, and set back socialism for decades; exclude later assessments of the Soviet invasion
    question.
  span_range:
  - src:5315af4e52d9#p216.2
  - src:5315af4e52d9#p217.1
  decision: The Polish First Secretary chose to delay imposing martial law in September 1981.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 30
  focus: The decision point is whether to proceed with a crackdown despite the risk of mass resistance, breakdown of control,
    and possible appeals for Soviet military assistance. The passage says he came to believe an attempt was necessary, while
    also describing his concern about widespread violence and reluctance to rely on Soviet forces; exclude tactical details
    of the martial-law plan.
  span_range:
  - src:5315af4e52d9#p216.2
  - src:5315af4e52d9#p218.1
  decision: The Polish military-party leader chose to proceed with imposing martial law in December 1981.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 31
  focus: 'The decision point is whom to support as the Polish First Secretary’s replacement amid the crisis: a hardliner or
    the military leader whom Soviet leaders believed had the authority to carry out martial law. The passage reports the Soviet
    leadership’s conclusion and a failed earlier effort to install a hardliner, while noting that the extent of Soviet pressure
    on the eventual replacement is disputed.'
  span_range:
  - src:5315af4e52d9#p217.1
  - src:5315af4e52d9#p217.3
  decision: The Soviet political leadership chose to support replacing the Polish First Secretary with the Polish military
    leader, rather than a party hardliner.
  content_domain: other:political succession
  refusal_sensitivity: high
  held_out: false
  natsec: false
