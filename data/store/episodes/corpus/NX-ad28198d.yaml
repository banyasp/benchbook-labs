episodes:
- n: 1
  focus: The decision point is the President’s choice among competing organizational plans for a peacetime intelligence office;
    the account says he found the Joint Chiefs’ proposal simpler and more workable, then created a diluted version. Exclude
    later operational activities and the separate question of what intelligence the group should collect.
  span_range:
  - src:911857f393f3#p11.1
  - src:911857f393f3#p11.2
  decision: The President chose to create the Central Intelligence Group on the Joint Chiefs’ model, rather than adopt the
    State Department’s proposal.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is which agency should have this responsibility: the account describes State Department concerns
    about diplomatic harm and the CIA’s existing capabilities and funds, while noting the DCI’s misgivings. Keep the scenario
    at the level of agency assignment and accountability; exclude choices of targets or methods.'
  span_range:
  - src:911857f393f3#p16.6
  - src:911857f393f3#p17.4
  decision: The National Security Council assigned responsibility for peacetime covert psychological operations to the CIA
    under NSC 4-A.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is how to assign and supervise the government’s covert-action responsibility amid competing views
    about CIA control and the need for a political-warfare capability. Exclude the listed operational activities and any question
    of their execution; focus on institutional authority and oversight.
  span_range:
  - src:911857f393f3#p18.3
  - src:911857f393f3#p18.9
  decision: The National Security Council established a new office for covert action, administratively within the CIA but
    supervised by State and the military, under NSC 10/2.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The Director of Central Intelligence raised concern that covert action, especially in support of the Korean War effort,
    was diverting the Agency from intelligence gathering and analysis. The National Security Council’s NSC 10/5 endorsed the
    anti-Communist campaign and expanded CIA authority over guerrilla operations; the Director of Central Intelligence reluctantly
    accepted it. Exclude operational methods and details of particular operations.
  span_range:
  - src:911857f393f3#p24.1
  - src:911857f393f3#p24.2
  decision: The National Security Council decided whether to constrain or expand CIA covert-action authority after the Director
    of Central Intelligence sought a ruling on its proper scope and magnitude.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
