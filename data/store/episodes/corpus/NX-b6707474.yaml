- n: 1
  focus: The choice was whether to declassify the estimate or keep it classified; the President ordered declassification because
    he feared an optimistic finding would leak and wanted to contain damage to diplomatic efforts. Treat this as a decision
    about intelligence disclosure and policy, not as a finding that analysts had intentionally shaped their judgment.
  span_range:
  - src:28321d8c1f82#p3.6
  - src:28321d8c1f82#p3.6
  decision: The President decided to declassify the 2007 National Intelligence Estimate on Iran’s nuclear program.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The President chose to issue a briefing directive after complaining that intelligence projections had underestimated
    Soviet deployments. His stated rationale was that he, as the official responsible for forming the opinion and bearing
    responsibility for outcomes, needed careful separation of fact and opinion; exclude broader claims about whether analysts
    were actually politicized.
  span_range:
  - src:28321d8c1f82#p4.3
  - src:28321d8c1f82#p4.7
  decision: The President directed intelligence officers to distinguish facts from opinions in their briefings.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The choice was whether to request a new estimate and public summary or rely on existing intelligence products. The
    article notes that Congress was approaching a vote on authorizing force and says legislators had a duty to seek accurate,
    timely intelligence; it also raises, but does not establish, a possible partisan motive, which should not be treated as
    fact.
  span_range:
  - src:28321d8c1f82#p6.6
  - src:28321d8c1f82#p7.4
  decision: Senators decided to request a new National Intelligence Estimate on Iraq’s weapons programs and an unclassified
    summary.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
