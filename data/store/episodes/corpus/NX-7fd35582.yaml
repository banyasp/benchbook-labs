  focus: The estimate used “serious possibility,” based on Satellite military and propaganda preparations, while the text
    says the estimators’ duty was to assess likelihood and communicate their judgment. The passage documents substantial disagreement
    over what that wording meant; exclude broader recommendations for a standardized vocabulary except as context.
