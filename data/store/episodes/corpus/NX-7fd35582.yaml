  focus: The consumer says the information is essential for planning and presses the estimators to respond despite the subject’s
    uncertainty; the estimators accept and describe caveats, contingencies, and ranges as safeguards. Exclude the technical
    characteristics of missiles and any details about weapons; the decision point is the analysts’ response to an unanswerable
    or highly uncertain request.
