- n: 2
  focus: The managers could respond to the patent information or keep quiet; the account says they chose silence to avoid
    signaling that the USSR was developing a new uranium-enrichment method, accepting that the West would assume gaseous diffusion
    remained in use. Exclude technical details about centrifuge design or enrichment.
  span_range:
  - src:075122ba24af#p10.3
  - src:075122ba24af#p10.5
  decision: Soviet atomic-project managers decide to remain silent after learning that a centrifuge design had been patented
    in the West.
