- n: 1
  focus: The decision weighs concealment of steam from cooling towers against the concern that the lake could serve as an
    aerial-reconnaissance landmark; the science director argues that the many similar lakes in the Urals make that concern
    unconvincing. The account says the site near Lake Kyzyltash was proposed and that Ozersk was established there. Exclude
    technical details beyond this siting rationale.
  span_range:
  - src:075122ba24af#p3.13
  - src:075122ba24af#p3.27
  decision: The Special Committee decides whether to move Plant 817 from the initially proposed remote Ufa River site to Lake
    Kyzyltash.
