episodes:
- n: 1
  focus: The decision was how to use imagery to improve the map while protecting the existence and capabilities of the overhead
    sources. Include the stated rules for validating details and limiting the map to information observable from areas where
    Embassy personnel had access; exclude the technical process of collecting or interpreting imagery.
  span_range:
  - src:348cfa136f91#p3.1
  - src:348cfa136f91#p3.10
  decision: The head of the DDI, on behalf of the DCI, set limits on using overhead photography in an unclassified Moscow
    map.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The initial choice was to restrict distribution to Embassy personnel because people displaying maps in public risked
    arrest and espionage charges; distribution later expanded to friendly diplomatic personnel and US visitors and tourists.
    Keep the focus on dissemination under those risks, not on how the map was produced or used for intelligence collection.
  span_range:
  - src:348cfa136f91#p3.2
  - src:348cfa136f91#p3.8
  decision: The Embassy broadened access to the Moscow map beyond Embassy personnel as Soviet security appeared to accept
    its presence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
