episodes:
- n: 1
  focus: The decision point is whether cryptanalysts should primarily study cryptographic features for possible use in Navy
    systems or exploit message content for intelligence. The source gives the policy’s rationale and notes that it remained
    in place until 1942; exclude collection methods and technical cryptanalysis.
  span_range:
  - src:7fcb4c69f4c7#p9.4
  - src:7fcb4c69f4c7#p9.5
  decision: OP-20-G maintained a policy of prioritizing cryptographic features over the underlying intelligence in intercepted
    messages.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: 'The decision point is the Navy’s proposed allocation of targets in response to its workload: the Army would handle
    counterpart Army communications and diplomatic traffic except that of four major naval powers. The stated rationale was
    to reduce the Navy’s workload and the expected delay in solving the Japanese naval code; exclude collection-site capabilities
    and technical cryptanalysis.'
  span_range:
  - src:7fcb4c69f4c7#p18.3
  - src:7fcb4c69f4c7#p18.14
  decision: The Navy proposed dividing cryptanalytic responsibility with the Army, leaving the Navy responsible for Japanese
    diplomatic traffic and assigning the Army other specified targets.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is whether to divide responsibility or continue duplicative work: the approved arrangement assigned
    the Navy odd days and the Army even days. The stated benefit was avoiding conflicting translations reaching the president,
    though the arrangement did not resolve the Navy’s workload problem; exclude collection activity and cryptanalytic techniques.'
  span_range:
  - src:7fcb4c69f4c7#p21.3
  - src:7fcb4c69f4c7#p22.2
  decision: Army and Navy authorities approved an alternating-day division of responsibility for deciphering and translating
    Japanese diplomatic and consular messages.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision was to prioritize current traffic over continued work on older traffic, with the aim of reading a new-year
    message on the day it was sent. Keep the scenario focused on this intelligence-work priority and its timeliness rationale,
    not on cryptanalytic methods.
  span_range:
  - src:7fcb4c69f4c7#p24.4
  - src:7fcb4c69f4c7#p24.5
  decision: Washington policymakers chose to redirect all units, including Hawaii, to work on the current JN-25 cipher.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is the choice to prioritize the British war effort and defense of the hemisphere over Pacific
    operations, given the assessment that available forces could operate in only one theater. Keep the scenario on strategic
    priorities and the choice to avoid antagonizing Japan; exclude operational planning details.
  span_range:
  - src:7fcb4c69f4c7#p32.3
  - src:7fcb4c69f4c7#p33.5
  decision: The Chief of Naval Operations chose a Germany-first, defensive strategic posture and sought to avoid even a limited
    war with Japan.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The scenario concerns the decision to relocate the fleet headquarters despite the commander’s objections that Pearl
    Harbor exposed the fleet and that an offensive west of Hawaii could not be supported. The stated rationale was that the
    move countered growing Japanese bellicosity; exclude tactical or operational details of fleet defense.
  span_range:
  - src:7fcb4c69f4c7#p38.5
  - src:7fcb4c69f4c7#p38.6
  decision: The President chose to move the U.S. fleet headquarters from San Pedro to Pearl Harbor.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision changed how regional intelligence reports, including those from the Hawaiian command, were to be assembled
    and routed. The stated reason was that the Asiatic Fleet’s perspective was judged superior to Hawaii’s and to fragmentary
    or conflicting reports from other sources; exclude collection methods and assess the order’s limited immediate effect
    separately.
  span_range:
  - src:7fcb4c69f4c7#p40.10
  - src:7fcb4c69f4c7#p40.11
  decision: The Chief of Naval Operations ordered the Commander in Chief, Asiatic Fleet, to consolidate and evaluate reports
    on Japanese activity and report directly to the Chief of Naval Operations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to keep diplomatic intercepts in Washington or share them directly with theater commanders;
    the stated reasons were protecting the source and retaining centralized evaluation of diplomatic material. Include the
    stated exception that warnings based partly on those messages were sent, but exclude the underlying collection or decoding
    methods.
  span_range:
  - src:7fcb4c69f4c7#p45.8
  - src:7fcb4c69f4c7#p45.15
  decision: The War Department G-2 and Navy ONI policy authorities decided ordinarily not to distribute MAGIC material based
    on Japanese diplomatic messages to commanders outside Washington.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to keep the surface fleet deployed south or return it to Manila as the perceived U.S.
    policy changed; the source says the commander sensed a change and proposed joining the defense of the Philippines. Include
    Washington’s later disapproval as context, but exclude subsequent patrol activity and tactical details.
  span_range:
  - src:7fcb4c69f4c7#p46.7
  - src:7fcb4c69f4c7#p47.2
  decision: The CINC Asiatic Fleet decided in late October 1941 to return the fleet to Manila and propose joining the defense
    of the Philippines with the Army command.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether to move the destroyer division west and place it under allied command after confirmation
    that a Japanese amphibious force was crossing the Gulf of Siam. The passage presents the confirmed movement as the immediate
    reason; exclude patrol methods and any details of reconnaissance or combat employment.
  span_range:
  - src:7fcb4c69f4c7#p47.3
  - src:7fcb4c69f4c7#p47.3
  decision: The CINC Asiatic Fleet decided on 6 December 1941 to send a destroyer division west from Borneo to Singapore and
    place it under the British Fleet commander.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is the ambassador’s choice of what course to recommend to Tokyo; the stated reason was that a
    formal break would avoid responsibility for the rupture. The passage does not establish that Tokyo adopted the recommendation,
    so do not present it as Japan’s final decision or elaborate on the planned operations.
  span_range:
  - src:7fcb4c69f4c7#p66.2
  - src:7fcb4c69f4c7#p66.2
  decision: The ambassador in Washington recommended that Japan formally break diplomatic relations with the United States
    rather than begin its planned operations without prior announcement.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
