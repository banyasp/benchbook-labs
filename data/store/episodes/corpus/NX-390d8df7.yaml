episodes:
- n: 1
  focus: The decision is whether to challenge a punishment when the charges cannot be verified, amid immediate danger and
    concern about appearing unsupportive. Focus on the operator’s ethical choice and stated reasons; exclude operational details
    of the surrounding danger.
  span_range:
  - src:3d0295569a15#p28.2
  - src:3d0295569a15#p28.2
  decision: The Allied team radio operator decides whether to protest the local forces’ abuse and execution of a person accused
    of informing the Germans; he does not protest.
  content_domain: other:wartime conduct ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The commander faces remaining at a base under an advancing attack or abandoning the plan to hold it. The account
    gives the risk assessment and chosen course; exclude the mechanics of movement and evasion.
  span_range:
  - src:3d0295569a15#p28.3
  - src:3d0295569a15#p29.1
  decision: The SAS commander decides to abandon the threatened base and break up the force for withdrawal.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: Trainees who volunteer for the assignment may leave before or during jump training, while OSS could have required
    them to continue. Focus on the voluntary-service personnel policy and its stated basis; exclude parachuting instruction
    and procedures.
  span_range:
  - src:3d0295569a15#p12.2
  - src:3d0295569a15#p12.2
  decision: OSS administrators honor trainees’ choice to leave parachute training and transfer them without prejudice.
  content_domain: other:personnel-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The team weighed following the SAS toward an uncertain destination against continuing to work with the local Resistance
    in the Côtes-du-Nord. Focus on the command choice and its stated reasons; exclude the movements and tactics used to carry
    it out.
  span_range:
  - src:3d0295569a15#p29.4
  - src:3d0295569a15#p29.4
  decision: The Jed team decided to proceed independently rather than join the departing SAS groups.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The team reconsidered whether to move south or reorganize and pursue its original mission locally. The account gives
    the mission’s need for a radio and the consultation informing the choice; exclude the subsequent radio-recovery methods.
  span_range:
  - src:3d0295569a15#p33.4
  - src:3d0295569a15#p35.3
  decision: After consulting the SAS sergeant, Team Frederick decided to remain in the Côtes-du-Nord rather than go south
    to the base of the SAS commander.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 6
  focus: The team operated amid a divided Resistance whose groups had differing political loyalties, and chose to rely on
    the nominal structure and its commander rather than take a partisan political position. Focus on the liaison and neutrality
    decision; exclude intelligence sharing, communications, and operational support details.
  span_range:
  - src:3d0295569a15#p42.5
  - src:3d0295569a15#p43.1
  decision: The Allied team chose to work through the FFI’s nominal departmental organization and its commander while remaining
    outside French Resistance factional politics.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The team had considered joining nearby groups for safety, but remained separate after those groups suffered significant
    casualties. The stated reasons also included the security advantages of the terrain and the small group’s ability to blend
    into its surroundings; exclude the details of transmission security and other operational methods.
  span_range:
  - src:3d0295569a15#p57.3
  - src:3d0295569a15#p57.3
  decision: Team Frederick leadership chose to remain a small, separate group rather than join the larger maquis groups.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The directive changed the mission as Allied forces moved rapidly toward Brittany, emphasizing preservation of key
    routes over the earlier destructive tasks. The passage also describes the Resistance response; exclude the scouting, force
    placement, and other operational implementation details.
  span_range:
  - src:3d0295569a15#p59.2
  - src:3d0295569a15#p59.6
  decision: Special Forces headquarters chose to shift the Resistance’s mission from destruction to preserving key roads and
    preventing German demolitions as Allied forces advanced.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 9
  focus: The commander faced a request for urgent assistance amid reports of serious German activity and atrocities, while
    the maquis lacked the weapons to attack effectively. The account says the commander was persuaded that the threat was
    too dangerous to leave to his rear; exclude the details of the ensuing attack and its methods.
  span_range:
  - src:3d0295569a15#p62.4
  - src:3d0295569a15#p63.3
  decision: The general commanding the advance tank column chose to divert a large force toward Paimpol to assist the Resistance
    against German positions.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
