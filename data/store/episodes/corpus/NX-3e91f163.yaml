- n: 1
  focus: The decision point is whether the DCI would follow the White House demand or insist that the FBI continue its investigation,
    given his stated belief that the CIA was not involved. The stated concern was that a broader inquiry might expose Agency
    assets; exclude the mechanics of how the message was conveyed.
  span_range:
  - src:48f86d7526c1#p2.5
  - src:48f86d7526c1#p3.4
  decision: The DCI chose to comply with the White House demand to limit the FBI’s Watergate investigation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to continue treating the defector as suspect or accept him and provide a future role,
    despite continuing internal disagreement. The independent review questioned the rationale for a false-defector theory,
    while some senior officers saw potential value in retaining him; exclude details of subsequent identity arrangements.
  span_range:
  - src:48f86d7526c1#p6.6
  - src:48f86d7526c1#p7.2
  decision: As DCI, the Director agreed to accept, rehabilitate, and resettle the defector and retain him under Agency contract.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to comply with the President’s demand or refuse, including by threatening resignation,
    when the requested activity touched domestic political groups. The review says the Agency violated its charter and attributes
    the DCI’s choice to presidential insistence; exclude how the activity was carried out.
  span_range:
  - src:48f86d7526c1#p9.3
  - src:48f86d7526c1#p9.4
  decision: The DCI chose to comply with presidential insistence that the CIA investigate domestic political unrest, despite
    the Agency’s charter limits.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
