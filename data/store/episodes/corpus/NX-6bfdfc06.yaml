  focus: The decision was to conduct additional practice instructional training, including the planned instrument-approach
    training, rather than limit the sortie to its authorized continuation-training mission. The report says the pilot sought
    the practice ride to replicate the instructor-upgrade syllabus and the qualified instructor agreed to supervise; the operations
    supervisor was not informed, and the additional training was not included in the risk briefing. Exclude the pilots’ in-flight
    maneuver choices and the accident-causation analysis.
