episodes:
- n: 1
  focus: The choice is between allowing broader circulation or action on the memorandum and restricting both pending the Executive
    Director’s clearance. The stated reason is that the DIA director spoke as a friend and in confidence; exclude the substantive
    topics discussed in the memorandum.
  span_range:
  - src:44033eba3315#p1.6
  - src:44033eba3315#p1.6
  decision: The Executive Director requests that the memorandum be closely held and that working-level staff take no action
    on its items without his prior clearance.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The choice is joint training or separate training. The cited concerns are compartmentation needed to protect CIA
    security requirements and the prospect that DIA trainees may be temporary or reassigned; exclude course content and training
    techniques.
  span_range:
  - src:44033eba3315#p3.2
  - src:44033eba3315#p3.3
  decision: CIA and Defense training officials decide against joint clandestine training, with the CIA favoring separate training
    until DIA personnel are more permanent.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to withhold the material under the restrictions or send it to the relevant military
    recipient. The stated reason is that the recipient needed it when the President had indicated a possible attack the next
    day; exclude any assessment of whether to attack or operational details about the material.
  span_range:
  - src:44033eba3315#p7.7
  - src:44033eba3315#p7.7
  decision: The DIA director decides to send material about offensive missiles despite dissemination restrictions, taking
    responsibility for the disclosure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
