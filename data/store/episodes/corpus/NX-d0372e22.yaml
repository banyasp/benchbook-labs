- n: 2
  focus: Former Vietnam War protesters alleged that their communications were intercepted; the government invoked the state-secrets
    privilege, and the court considered classified affidavits and testimony before dismissal. Focus on the court’s handling
    of the privilege and the plaintiffs’ claims, not on surveillance methods.
  span_range:
