  natsec: true
- n: 3
  focus: After the agency denied publication of classified portions of an article, the former officer challenged the classification
    decision. The court chose de novo review while giving weight to reasoned, detailed agency explanations; focus on that
    judicial-review standard, not the article’s operational allegations.
