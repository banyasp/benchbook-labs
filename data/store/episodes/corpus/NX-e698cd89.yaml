episodes:
- n: 1
  focus: The decision point is how the commander balanced completing required tasks against preserving the planned early release
    for family time, including the expectation that subordinate leaders propose a mitigation plan. Exclude general time-management
    advice and any operational task details beyond this stated command choice.
  span_range:
  - src:b71d74626c36#p34.3
  - src:b71d74626c36#p34.3
  decision: The troop commander decided whether to approve platoon leaders’ and platoon sergeants’ requests that tasks keep
    Soldiers from the Friday 1500 closeout formation; when their mitigation plans or task management were inadequate, the
    commander denied the requests and required them to find another way to complete the work.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The commander and first sergeant faced a hazardous fire environment and considered alternate training if operations
    were ceased or delayed; the company executed lower-level training at the range-control sites. The stated reason was to
    preserve training opportunities and build proficiency despite the hazard. Exclude any procedures for conducting range
    or ammunition activities.
  span_range:
  - src:b71d74626c36#p58.2
  - src:b71d74626c36#p58.2
  decision: The company commander chose to use range-control sites for squad- and individual-level training during a red-cycle
    support period when fire hazards could stop or delay other training.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: 'The commander weighed the company’s assessed proficiency, higher commanders’ priorities, and the theater mission:
    Movement to Contact was already proficient, while Area Defense skills had atrophied and aligned with the company’s mission.
    The plan then transitioned to Area Security after sufficient proficiency. Exclude tactical methods for executing these
    tasks.'
  span_range:
  - src:b71d74626c36#p68.2
  - src:b71d74626c36#p68.3
  decision: The tank company commander chose to train Conduct an Area Defense first, then Conduct Area Security, and obtained
    the squadron commander’s approval for the plan.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to retain the company’s allocated simulator window or share it to help the sister company
    prepare. The stated context is the sister commander’s difficulty meeting pre-gunnery requirements, and the offer followed
    a discussion of the company’s training plan. Exclude simulator operation and gunnery procedures.
  span_range:
  - src:b71d74626c36#p64.2
  - src:b71d74626c36#p64.2
  decision: The company commander chose to offer one of the company’s AGTS training windows to a sister company struggling
    with pre-gunnery preparation.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The stated choice is to complete services before the exercise rather than let them become overdue or disrupt the
    exercise. Focus on balancing maintenance standards, training demands, and coordination with support personnel; exclude
    maintenance procedures.
  span_range:
  - src:b71d74626c36#p87.5
  - src:b71d74626c36#p88.2
