  focus: The decision point is whether to retain ELINT management within the military departments or centralize it under NSA;
    the passage cites fragmented management and the need for coordinated signal analysis and processing as reasons for the
    change. Treat this as an intelligence-authority and management decision, and exclude the operational details of ELINT
    collection or use.
  span_range:
  - src:d509d15635b8#p6.2
  - src:d509d15635b8#p9.1
  decision: Presidential-level national security leadership chose to place most DoD ELINT activities under NSA’s operational
    and technical control through NSCID No. 6.
