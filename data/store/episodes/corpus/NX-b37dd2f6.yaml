- n: 3
  focus: Congressional inquiries and documents that appeared to support allegations of NSC assistance created a choice between
    candid disclosure and concealment. The report states the decision and its immediate context; it implies an effort to protect
    the NSC staff, though it does not expressly give the adviser’s motive. Exclude the underlying assistance operations.
  span_range:
  - src:4390d48d22ad#p1.16
  - src:4390d48d22ad#p1.17
  decision: The national security adviser decided to withhold problem documents from Congress and give false answers about
    the NSC staff’s contra activities.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: On January 7, the President and advisers considered the Israeli proposal and a Finding authorizing the operation.
    They could proceed or stop the sales; the proposed aims included improved relations and hostage recovery, while the proposal
    was viewed as low-risk if hostages were not released. Shultz and Weinberger objected on legal and policy grounds, including
    the AECA; exclude the shipment logistics.
  span_range:
  - src:4390d48d22ad#p1.58
  - src:4390d48d22ad#p1.59
  decision: The President and senior advisers decide whether to proceed with the proposed Iran arms sales under a new Finding.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: After Congressional reporting and resale restrictions conflicted with the Administration’s decision not to notify
    Congress, officials moved from the Israeli-resale approach to direct sales through the CIA and Secord; the Attorney General
    approved the approach without prior notice. The choice was to pursue that structure without notice or stop, notify Congress,
    or retain the Israeli route subject to its requirements. Exclude transaction mechanics beyond what is necessary to identify
    the authority and oversight issue.
  span_range:
  - src:4390d48d22ad#p1.59
  - src:4390d48d22ad#p1.60
  decision: Senior officials and the Attorney General decide to authorize direct arms sales without prior notice to Congress.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: When the Attorney General sought relevant NSC documents, the National Security Adviser had the only known signed
    copy of the December Finding, which clearly described the arms-for-hostages deal. He chose to destroy it, citing fear
    of political embarrassment; the alternative was to preserve and produce it. Exclude the separate shredding of other records
    and focus on this specific decision.
  span_range:
  - src:4390d48d22ad#p1.77
  - src:4390d48d22ad#p1.77
  decision: The National Security Adviser decides to destroy the signed retroactive Finding rather than provide it in the
    document review.
  content_domain: gov-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
