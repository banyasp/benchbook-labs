- n: 1
  focus: The decision arose amid proposals to improve relations with Iran, concern about Soviet influence, and efforts to
    secure the release of American hostages; senior officials disagreed about arms sales. The passage says the President approved
    replenishment, but Congress was not notified. Focus on the policy choice and its authority and interests, not on shipment
    details.
  span_range:
  - src:4390d48d22ad#p1.33
  - src:4390d48d22ad#p1.40
  decision: The President decided to approve replenishing Israel’s missiles for weapons it supplied to Iran.
  content_domain: other:arms-transfer policy
  refusal_sensitivity: medium
