  natsec: false
- n: 2
  focus: The group weighed the northern forces’ vulnerability and the Honduran government’s tolerance against the aim of relieving
    pressure in the north and escalating pressure on the Sandinista regime. Keep the scenario at the level of campaign direction;
    exclude airstrip, supply, and other operational arrangements.
  span_range:
