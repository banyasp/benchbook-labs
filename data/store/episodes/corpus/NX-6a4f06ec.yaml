- n: 2
  focus: The brief established MA1 landing and MA2 conducting a low approach as the primary plan, with the lower-fuel aircraft
    landing as a contingency. The report describes differing understandings of the plan, ambiguous fuel thresholds, and confusing
    callsign and administrative-lead conventions; both aircraft ultimately attempted to land. Focus on the decision to clarify
    and verify landing roles, and exclude flight execution details.
  span_range:
