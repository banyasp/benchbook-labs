  focus: 'The decision point is how to structure and combine intelligence for a policy assessment: the existing metrics did
    not show implications for future enemy activity, so the NSC staff devised a capability-focused format and CIA used it.
    Exclude the underlying interdiction operations and the President’s later policy choices, which are not described in enough
    detail here.'
  span_range:
  - src:9aac65db0f21#p2.4
  - src:9aac65db0f21#p3.4
  decision: The NSC staff and CIA chose to assess the effects of LAMSON 719 using an analytical format tied to North Vietnamese
    military capabilities, rather than relying on existing tonnage and truck-kill measures.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to produce a synthesized assessment after six months of discrete reporting. The stated
    reasons include the continuing Arab-Israeli confrontation, possible agreements, U.S. interests, and the need to make policy
    implications clear; exclude any operational intelligence-collection methods.
  span_range:
  - src:9aac65db0f21#p8.3
  - src:9aac65db0f21#p8.3
  decision: The intelligence officer’s supervisor agreed to pursue an analytical summary of the Soviet presence in Egypt and
    its policy implications, rather than continuing with disconnected reporting alone.
  content_domain: intel-analysis
  refusal_sensitivity: medium
