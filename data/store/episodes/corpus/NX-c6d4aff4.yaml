- n: 1
  focus: The decision arose amid widely divergent bridge-damage counts; analysts judged pilot observations unreliable because
    of speed and obscured target areas, then reviewed reconnaissance photography with DIA and imagery analysts. Keep the scenario
    focused on choosing and applying an evidence standard for an intelligence estimate, not on conducting reconnaissance or
    imagery collection.
  span_range:
  - src:fb52b71ce50d#p3.2
  - src:fb52b71ce50d#p3.3
  decision: CIA Office of Economic Research analysts decided to use aerial photographs, rather than pilot reports, as the
    sole source for hard estimates of damaged bridges.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The analysts could not use the preferred approach—North Vietnamese construction costs converted into US dollars—because
    the necessary statistical data were unavailable, so they adopted a proxy methodology and checked it against regional engineering
    estimates. Keep the scenario about selecting a defensible estimation method and communicating its limits, not about bridge
    construction techniques.
  span_range:
  - src:fb52b71ce50d#p5.1
  - src:fb52b71ce50d#p5.3
  decision: CIA Office of Economic Research analysts decided to estimate North Vietnamese bridge reconstruction costs using
    comparable US bridge costs adjusted for North Vietnamese construction inputs.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
