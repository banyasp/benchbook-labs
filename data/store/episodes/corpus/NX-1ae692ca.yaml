- n: 1
  focus: The decision point is the choice between continuing the planned effort against New York and shifting the campaign
    south, given the French fleet’s destination and the opportunity to act against Cornwallis. Focus on the commander’s strategic
    judgment and reasons; exclude the intelligence-gathering and deception methods described elsewhere.
  span_range:
  - src:c9eb960a4046#p35.1
  - src:c9eb960a4046#p35.2
  decision: The commander in chief chose to abandon the New York campaign and redirect the allied army toward Yorktown after
    learning that the French fleet would stop in Chesapeake Bay.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to exploit the apparent weakening of New York or prioritize protecting the French arrival
    at Newport. The account says the available troops were too few to attack successfully and that deterring the British movement
    would suffice; exclude the details of how the feint was carried out.
  span_range:
  - src:c9eb960a4046#p25.2
  - src:c9eb960a4046#p26.1
  decision: The commander in chief chose not to attack New York in 1780 and instead to move his troops in a feint to deter
    the British from sailing against the French forces at Newport.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: Congress’s instructions recommended following France’s direction, but a cipher problem left an important part unread
    by a commissioner, who was also not inclined to follow it. The commission negotiated with the British without consulting
    France; exclude the cipher’s design and mechanics.
  span_range:
  - src:c9eb960a4046#p47.2
  - src:c9eb960a4046#p48.2
  decision: The peace commission decides whether to follow Congress’s recommendation to consult France or negotiate with the
    British without consulting France.
  content_domain: other:diplomatic policy
  refusal_sensitivity: low
