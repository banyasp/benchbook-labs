  focus: The decision point is the late-1970s choice between replacing the older SS-12 missiles with a limited SS-20 deployment
    and deploying a larger warhead total. The interviewee says the replacement itself was justified, but that the leadership’s
    decision to deploy more warheads was a mistake because it failed to account adequately for political consequences, including
    the U.S. decision to deploy Pershing II and cruise missiles. Exclude operational details of missile employment.
