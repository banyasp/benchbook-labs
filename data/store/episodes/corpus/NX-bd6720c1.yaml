episodes:
- n: 1
  focus: The decision point is the alliance’s choice to increase exercises and rotate forces while stopping short of permanent
    deployment, in light of the Russia-related security shift and prior NATO-Russia agreements. Keep the focus on the alliance-level
    posture decision and its stated aim of avoiding escalation; exclude implementation details of the exercises and deployments.
  span_range:
  - src:1d2f945d8dee#p17.2
  - src:1d2f945d8dee#p17.3
  decision: NATO leaders chose a continuous eastern presence through enhanced troop rotations rather than a permanent NATO
    military presence.
  content_domain: other:alliance-defense-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: Treat this as a strategic policy choice between continuing assurance and emphasizing deterrence through a more visible
    U.S. commitment. Consider the stated interests in allied security, conflict prevention, and making U.S. commitments credible;
    exclude the operational details of force deployments.
  span_range:
  - src:1d2f945d8dee#p30.3
  - src:1d2f945d8dee#p30.4
  decision: The President chose to shift U.S. strategy in Europe from assurance toward deterrence, backed by an expanded military
    commitment to the region.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The decision was how to obtain support for a large security-cooperation mission funded and authorized under Title
    22. Focus on the choice of sourcing process and the authority and coordination issues it raised; exclude the general descriptions
    of how each process works.
  span_range:
  - src:1d2f945d8dee#p64.5
  - src:1d2f945d8dee#p66.3
  decision: USAREUR planners chose the SCET process rather than a request for forces to source personnel and equipment for
    JMTG-U.
  content_domain: other:security-cooperation force sourcing
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision weighed the Ukrainian leaders’ preference for existing rear-area facilities near the front against the
    U.S. planners’ preference for a site farther west. Consider site suitability, vulnerability, and sustained transportation
    costs; exclude operational methods for defending or operating the facility.
  span_range:
  - src:1d2f945d8dee#p60.4
  - src:1d2f945d8dee#p61.2
  decision: U.S. planners selected the International Peacekeeping and Security Center in western Ukraine for the enduring
    training-center capability rather than enhancing facilities nearer the Donbas front.
  content_domain: other:defense institution building
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision concerned which statutory authority to use for National Guard personnel supporting a Title 22 mission.
    Compare the authorities’ effects on unit cohesion, lead time, duration, benefits, and voluntary extensions; do not treat
    the passage’s general statutory explanation as a separate decision.
  span_range:
  - src:1d2f945d8dee#p67.5
  - src:1d2f945d8dee#p68.3
  decision: JMTG-U planners used 10 U.S.C. § 12301(d), rather than § 12304b, to place National Guard personnel on active duty
    for the mission.
  content_domain: other:National Guard mobilization authority
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: This was an organizational command choice made under limited-asset and wide-area-support constraints; the selected
    arrangement divided northern and southern responsibilities and used rotating company-level command elements. The source
    gives unity of command, leader development, and mission accomplishment as reasons. Exclude convoy procedures and other
    logistics techniques.
  span_range:
  - src:1d2f945d8dee#p74.4
  - src:1d2f945d8dee#p74.4
  decision: The sustainment brigade leadership chose to divide theater mission-command responsibilities between the combat
    sustainment support battalion and movement control battalion, with forward command elements rotating by location.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
