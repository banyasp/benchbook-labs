  focus: The decision point is whether to continue using existing instruments or develop instruments suited to intelligence
    measurement requirements; the stated reason was that many available instruments were designed for map compilation and
    did not meet those requirements. Exclude the technical design or operation of the instruments and the separate question
    of how to measure imagery.
