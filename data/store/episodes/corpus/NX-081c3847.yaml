episodes:
- n: 1
  focus: The Independent Counsel viewed prosecution or cooperation as key to uncovering the Iran/contra affair; after cooperation
    was declined, the report says prosecution was the only alternative despite unusual obstacles. Keep the scenario to the
    prosecution decision and its immunity and classified-information challenges, not to the underlying covert operations.
  span_range:
  - src:e67565fc95f8#p1.4
  - src:e67565fc95f8#p1.4
  decision: The Independent Counsel decides to prosecute the NSC official after he refuses plea negotiations leading to cooperation.
  content_domain: other:criminal-justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The agency heads considered disclosure against seeking an affidavit that would force dismissal, and chose to block
    disclosure; the Attorney General confirmed the refusal, putting central counts at risk. Focus on the balance between protecting
    classified information and allowing a fair trial to proceed, not on the underlying intelligence operations.
  span_range:
  - src:e67565fc95f8#p1.17
  - src:e67565fc95f8#p1.20
  decision: The intelligence agency heads and Attorney General decide to withhold classified information rather than permit
    its disclosure at trial.
  content_domain: other:classified-information disclosure
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: 'After judging an appeal unlikely to succeed and likely to delay trial, the Independent Counsel pursued a negotiated
    compromise: relinquish two major counts to preserve the remaining case. Keep the scenario on the legal and prosecutorial
    tradeoff, not on the operations described in the classified evidence.'
  span_range:
  - src:e67565fc95f8#p1.19
  - src:e67565fc95f8#p1.20
  decision: The Independent Counsel decides to seek dismissal of the conspiracy and theft counts in exchange for assurances
    that certain country identities will not be withheld.
  content_domain: other:criminal-justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether the defense had shown that the President-elect possessed specific, relevant information
    making his appearance necessary. The judge found no such showing; exclude broader questions about presidential authorization
    or the separate subpoena to the former President.
  span_range:
  - src:e67565fc95f8#p1.51
  - src:e67565fc95f8#p1.51
  decision: The trial judge decided whether to compel the President-elect to testify at North’s trial or quash the subpoena,
    and quashed it.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether the record supported the defense claim that the former President authorized or knowingly
    condoned the charged conduct, such that his testimony was necessary for a fair trial. The judge found no supporting evidence
    in the materials reviewed; exclude the separate subpoena to the President-elect.
  span_range:
  - src:e67565fc95f8#p1.51
  - src:e67565fc95f8#p1.52
  decision: The trial judge decided whether to compel the former President to testify at North’s trial or quash the subpoena,
    and quashed it.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is sentencing after conviction, including whether incarceration or a noncustodial sentence best
    served the purposes of sentencing. The judge said jail would harden North’s misconceptions about public service and characterized
    him as a subordinate rather than a leader; exclude later commentary on the sentence’s effects on cooperation and other
    cases.
  span_range:
  - src:e67565fc95f8#p1.54
  - src:e67565fc95f8#p1.57
  decision: The trial judge decided whether to impose jail time or a noncustodial sentence on North, and chose probation,
    a fine, and community service.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is the standard and remedy for ensuring that prosecution witnesses’ testimony was not influenced
    by North’s immunized congressional testimony. The court found the existing safeguards insufficient and required witness-by-witness
    review, while leaving intact findings that prosecutors had not directly used the testimony; exclude the later rehearing
    and dismissal proceedings.
  span_range:
  - src:e67565fc95f8#p1.58
  - src:e67565fc95f8#p1.59
  decision: The Court of Appeals decided whether to affirm North’s convictions or remand for further review of possible use
    of his immunized testimony, and remanded them for a detailed inquiry.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: After remand hearings, a prosecution witness testified that his trial testimony had been colored by and deeply affected
    by North’s immunized testimony. The decision point is whether to proceed despite that testimony or dismiss the remaining
    counts; exclude the appellate court’s earlier ruling except as procedural background.
  span_range:
  - src:e67565fc95f8#p1.59
  - src:e67565fc95f8#p1.60
  decision: The Independent Counsel decided whether to continue prosecuting the remaining counts or consent to dismissal,
    and consented to dismissal.
  content_domain: other:criminal adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
