episodes:
- n: 1
  focus: The decision weighed reliance on nuclear forces and reduced manpower against the military leadership’s preference
    for maintaining large forces across service arms. The stated rationale included deterring and fighting war while releasing
    resources for the civilian economy; exclude operational details of force employment.
  span_range:
  - src:d822a3633f69#p13.4
  - src:d822a3633f69#p14.3
  decision: The Soviet head of government and party chose in January 1960 to reorganize the armed forces around nuclear missile
    forces and substantially reduce military manpower.
  content_domain: other:military-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The passage describes the deployment as a choice to improve the Soviet strategic position and create foreign-policy
    opportunities, with psychological pressure and deterrence among the expected effects. The courses are not fully enumerated,
    so keep the scenario to the stated choice and rationale; exclude operational deployment details.
  span_range:
  - src:d822a3633f69#p15.3
  - src:d822a3633f69#p15.5
  decision: The Soviet political leadership chose to deploy strategic missiles to Cuba in response to its perceived strategic
    inferiority and the need to improve its position relative to the United States.
  content_domain: other:military-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision followed concerns about air defenses, security, relations with the United States, and the adequacy of
    Soviet capabilities after US force decisions and the Berlin discussions. The passage identifies demonstrative policy moves;
    exclude any technical details of nuclear testing or military operations.
  span_range:
  - src:d822a3633f69#p14.5
  - src:d822a3633f69#p14.5
  decision: The Soviet leader chose to suspend the announced manpower reductions and resume nuclear testing after developments
    undermined confidence in the existing military posture.
  content_domain: other:military-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is the announced manpower reduction and its implementation, which shifted resources away from
    large conventional forces while strategic forces grew. The report gives the economic and deterrence rationale and describes
    opposition from military leaders; exclude later forecasts about force levels.
  span_range:
  - src:d822a3633f69#p26.6
  - src:d822a3633f69#p29.5
  decision: Khrushchev chose to reduce Soviet military manpower, chiefly by cutting general-purpose and theater forces, rather
    than maintain their previous scale.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: 'The decision point is the reported alternative for strengthening deterrence: improve the survivability and retaliatory
    capacity of Soviet forces instead of pursuing a much larger force buildup. The report cites US force growth and economic
    feasibility as reasons; exclude technical details of weapons and force protection.'
  span_range:
  - src:d822a3633f69#p28.4
  - src:d822a3633f69#p28.6
  decision: Soviet leaders chose to strengthen retaliatory capabilities rather than expand strategic attack forces enough
    to make a US first strike prohibitively risky.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is the leadership’s agreement to discuss arms control, made amid rising military costs and resource-allocation
    pressures. The report also notes that the Czechoslovak intervention soured relations and obstructed a possible agreement;
    exclude any claim that talks produced an agreement.
  span_range:
  - src:d822a3633f69#p35.5
  - src:d822a3633f69#p37.6
  decision: The Soviet leadership agreed to discuss strategic arms control with the United States rather than continue without
    talks.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: 'The estimate describes the delayed acceptance as a decision and gives possible political and military reasons: a
    changed political climate, a chance to influence the U.S. position in Paris, and time to strengthen the Soviet position
    through force buildup. Treat rejection or further delay as the alternatives; exclude the separate, unresolved question
    of whether the USSR would ultimately accept an agreement.'
  span_range:
  - src:d822a3633f69#p39.4
  - src:d822a3633f69#p40.4
  decision: The Soviet Government decided to accept the U.S. proposal for arms-control talks.
  content_domain: other:arms-control policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: 'The passage sets out three policy courses and states that the USSR would probably continue the competition. It gives
    reasons for rejecting the alternatives: unilateral de-escalation would sacrifice recent gains, while seeking superiority
    would impose unacceptable economic costs and provoke a strong U.S. response. Exclude force-design and deployment details.'
  span_range:
  - src:d822a3633f69#p40.4
  - src:d822a3633f69#p40.5
  decision: In the absence of an arms-control agreement, Soviet leaders chose to continue the arms competition rather than
    adopt minimum deterrence or seek strategic superiority.
  content_domain: other:arms-control policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: 'This is a conditional force-employment decision: the stated trigger is the Soviet leadership’s assessment of an
    imminent Western attack, and the stated course is preemption to blunt that expected blow. The passage also notes the flexibility
    and coordination difficulties of the mixed force. Exclude any operational details about carrying out an attack.'
  span_range:
  - src:d822a3633f69#p51.3
  - src:d822a3633f69#p51.4
  decision: Soviet leaders would launch available ready forces preemptively if they concluded that the West was irrevocably
    committed to an imminent nuclear attack on the USSR.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 10
  focus: The decision point is whether new deployment evidence warrants raising the longer-term force estimate or whether
    the evidence is still too uncertain. Include the estimate and its stated reason for retaining the range; exclude operational
    details about missiles and launch sites.
  span_range:
  - src:d822a3633f69#p62.5
  - src:d822a3633f69#p62.6
  decision: The estimators of the 1965 Soviet strategic attack memorandum decide whether to revise the five-year estimate
    of Soviet ICBM force levels in light of faster-than-expected silo deployment; they retain the 400–700 launcher range.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is the analytic judgment between a feasible first-strike capability and continued deterrence-oriented
    force development. Include the stated technological, economic, and US-response considerations and the recorded dissent;
    exclude operational attack mechanics.
  span_range:
  - src:d822a3633f69#p68.5
  - src:d822a3633f69#p68.6
  decision: The estimators of the 1966 Soviet strategic attack estimate decide whether Soviet forces are likely to enable
    a deliberate first strike that limits damage to the USSR; they judge this unlikely within the estimate period.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The decision point is the analytic correction from the earlier estimate of about 45 ballistic-missile submarines
    to 36, with corresponding changes to future projections. Include the order-of-battle review and the stated consequences
    for the estimates; exclude submarine operational or patrol details.
  span_range:
  - src:d822a3633f69#p81.4
  - src:d822a3633f69#p82.5
  decision: The estimators preparing the March 1967 memorandum to holders decide whether to retain or revise the 1966 estimate
    of the Soviet missile-submarine order of battle; they revise the ballistic-missile submarine count downward.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The estimate weighs arms control, unilateral de-escalation, seeking strategic superiority, and continued competition,
    and judges continued competition most likely absent an agreement. Treat this as an intelligence estimate of a high-level
    policy choice, not as proof that Soviet leaders had made a final decision; exclude weapon-development and deployment techniques.
  span_range:
  - src:d822a3633f69#p101.5
  - src:d822a3633f69#p102.6
  decision: Soviet leadership is assessed as choosing to continue the strategic arms competition with the US if no arms-control
    agreement is reached.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The analysts judge an extended-range IRBM more likely than a full-range ICBM, weighing the possible missile configurations
    against the logistics and expense of deploying an ICBM in the Soviet northeast. Keep the focus on the analytic choice
    and its stated rationale; exclude missile-development or deployment details.
  span_range:
  - src:d822a3633f69#p106.6
  - src:d822a3633f69#p107.4
  decision: Intelligence analysts assess whether the missile observed on the Scrooge TEL is an ICBM or an extended-range IRBM.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The estimate places the force goal between 1,100 and 1,500 launchers, with lower and higher force alternatives described.
    The passage identifies strategic requirements, US improvements, risk of prompting a US buildup, and the wider balance
    of offensive and defensive forces as considerations; exclude technical or operational employment details.
  span_range:
  - src:d822a3633f69#p109.6
  - src:d822a3633f69#p110.3
  decision: Intelligence estimate authors set a projected range for the Soviet ICBM force goal for 1971–1978.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: Despite the absence of tests demonstrating the required range, analysts estimate that the Mod 2 could have sufficient
    range and see no reason to doubt it could be used against Minuteman targets in a general war. Keep the focus on the assessment
    and its evidentiary uncertainty; exclude operational targeting guidance.
  span_range:
  - src:d822a3633f69#p122.4
  - src:d822a3633f69#p123.5
  decision: Intelligence analysts assess whether the SS-9 Mod 2 could reach most or all US Minuteman complexes.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The analytic choice was whether to assess the Mod 2 as capable of reaching those complexes despite the absence of
    a test demonstrating that range. The estimate concluded it could, reasoning that its range could be increased by using
    more propellant and removing telemetry packages; exclude any question of how the missile might be employed.
  span_range:
  - src:d822a3633f69#p134.4
  - src:d822a3633f69#p135.3
  decision: Intelligence Community analysts judged whether the SS-9 Mod 2 had sufficient range to reach US Minuteman complexes.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The estimate placed the most likely future force structure in the B-model area, between more extreme alternatives,
    while emphasizing that the models were illustrative rather than confident projections for planning. The passage identifies
    differences in MIRV deployment pace and broader force structure; exclude treating the models as actual Soviet decisions
    or as operational guidance.
  span_range:
  - src:d822a3633f69#p129.3
  - src:d822a3633f69#p130.3
  decision: Intelligence estimators judged which illustrative model best represented likely Soviet intercontinental attack
    forces.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
