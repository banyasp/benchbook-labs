  focus: The decision is whether to continue the existing collaborative approach or pursue major DIA reforms or a separate
    intelligence service for civilian Defense leadership. The memo favors continuing the current approach because it may protect
    DIA morale, develop its analysts, and preserve or improve the quality of analysis, with possible loss of efficiency; exclude
    the rejected structural alternatives as separate decision points.
