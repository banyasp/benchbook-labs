- n: 2
  focus: The board could reopen the estimate or leave it in place while current intelligence carried new reports to policymakers.
    The passage says the reports did not warrant a major shift, were disseminated through current-intelligence channels, and
    did not meet the board’s standards of firm evidence and significant departure; exclude details of intelligence collection.
  span_range:
