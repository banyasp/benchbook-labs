- n: 1
  focus: The decision point is the UK’s choice to support possible military action through Cabinet endorsement and a Commons
    vote, rather than withhold that support. The stated purpose was to ensure disarmament; exclude legal advice and deliberations
    not included in this passage.
  span_range:
  - src:77f85715d610#p19.7
  - src:77f85715d610#p19.12
  decision: The UK Cabinet and House of Commons endorse seeking an ultimatum and authorize military action if necessary to
    secure Iraq’s disarmament.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to include or exclude the power grid and related infrastructure from the campaign’s
    target set, with preservation of national infrastructure and hospital electricity given as the reason for exclusion. Keep
    the focus on that policy choice and civilian interests; exclude operational targeting methods.
  span_range:
  - src:77f85715d610#p14.9
  - src:77f85715d610#p14.9
  decision: The US campaign planners exclude Iraq’s electrical power infrastructure from Phase II targets to preserve essential
    services.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 3
  focus: 'The decision point is whether, when and how to confront the remaining opposition in Basra, including the option
    of entering the city by force. The source supports the choice to keep Basra screened: an opposed entry risked dividing
    the Coalition effort, the division lacked sufficient forces, and the main effort was Baghdad; exclude operational tactics
    for carrying out any entry or isolation.'
  span_range:
  - src:77f85715d610#p39.5
  - src:77f85715d610#p46.8
  decision: The commander of 1 (UK) Division chose to screen Basra and isolate irregular forces from civilians rather than
    attempt an opposed entry while the Coalition prioritized its advance on Baghdad.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision was whether to adjust the Government’s public posture in response to reports of resistance and difficult
    fighting. The Prime Minister judged there was no case for changing it before the pattern on the ground was clearer, because
    the campaign was only 72 hours old and the resistance appeared limited relative to the campaign’s overall progress; exclude
    later assessments or other media-policy discussions.
  span_range:
  - src:77f85715d610#p35.2
  - src:77f85715d610#p35.2
  decision: The Prime Minister chose not to change the Government’s public presentational posture about the campaign at that
    stage.
  content_domain: other:government-communications
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to enter a city where irregular forces remained organised and civilian support for
    the Coalition was limited, or to continue pressure and wait for circumstances to improve. The passage says immediate entry
    would be highly risky and likely require attritional tactics causing substantial military and civilian casualties and
    infrastructure damage; it also identifies the Coalition land commander as the decision authority. Exclude the operational
    details of raids and other activity.
  span_range:
  - src:77f85715d610#p56.7
  - src:77f85715d610#p57.2
  decision: The Coalition land commander decides whether to enter Basra immediately or continue a proactive approach while
    waiting for conditions that make entry acceptably safe.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision point is whether and when to enter Basra, given the commanders’ concern that a more direct approach
    could cause heavy casualties and their assessment that the opportunity had improved. The report says the commander obtained
    Coalition land-component clearance; exclude the detailed operational plan, force movements and strike-related information.
  span_range:
  - src:77f85715d610#p79.7
  - src:77f85715d610#p81.5
  decision: The UK divisional commander decided to enter Basra on 6 April rather than wait for a later opportunity.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether the UK should assume responsibility for the South or take a different approach to its
    post-conflict role. The Prime Minister said the South seemed more manageable and likely to be relatively supportive, and
    described sector responsibility as following from the decision to contribute forces through the South. Exclude later operational
    decisions about how forces carried out their tasks.
  span_range:
  - src:77f85715d610#p97.6
  - src:77f85715d610#p97.8
  decision: The Prime Minister decided that the UK would take responsibility for the South sector of Iraq.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether to plan for a larger, longer UK contribution or set a limit and draw down by autumn.
    The recommendation cited avoiding long-term damage to the Armed Forces and staying within defence planning assumptions;
    the Prime Minister agreed to the recommendations subject to further advice on the sector’s size, duration and exit strategy.
    Exclude subsequent operational force-allocation details.
  span_range:
  - src:77f85715d610#p95.5
  - src:77f85715d610#p96.5
  decision: The Prime Minister agreed to reduce the UK’s post-conflict military contribution to nearer a third by autumn and
    to tell the US this was the upper limit.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether to press for a rapid, broad ORHA deployment or a limited, gradual approach. Include
    the uncertain authority and organization of ORHA, the risk to UK forces’ relationship with local people and the concern
    that ORHA could disrupt UK efforts; exclude operational details of military activity.
  span_range:
  - src:77f85715d610#p109.2
  - src:77f85715d610#p110.5
  decision: The Defence Secretary agrees to urge the US Secretary of Defense to deploy ORHA cautiously, initially focusing
    on humanitarian and reconstruction work rather than taking a major political or governmental role.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The decision point is whether to keep the UK area limited or extend it across Maysan, ahead of Phase IV. The stated
    reasons include the area’s assessed stability, preparation for reconstruction and local engagement, and enabling US forces
    to be reassigned; exclude the details of moving forces or encountering Iraqi forces.
  span_range:
  - src:77f85715d610#p111.7
  - src:77f85715d610#p113.2
  decision: The Defence Secretary approves extending the UK Area of Operations to include all of Maysan province once al-Amara
    is secure.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 11
  focus: The decision point is whether the UK should lead ORHA’s regional office or defer or decline the commitment. The passage
    weighs the value of UK influence and ORHA’s role in reconstruction against legal responsibility for actions by US forces
    that the UK could not control, and calls for a scoping study; exclude the office’s organizational mechanics.
  span_range:
  - src:77f85715d610#p120.3
  - src:77f85715d610#p121.4
  decision: The Prime Minister supports the UK taking a regional lead in ORHA, subject to a study finding that the commitment
    is feasible.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: The decision point is whether to plan for a four-province UK sector, potentially larger than the two provinces initially
    expected, or limit the commitment. The stated conditions are the security environment and partner contributions, with
    alignment to ORHA’s regional boundaries also at issue; note that the Inquiry found no evidence of a formal decision fixing
    the area’s final geography, and exclude force-deployment details.
  span_range:
  - src:77f85715d610#p123.8
  - src:77f85715d610#p124.9
  decision: Ministers endorse planning on the assumption that the UK military area will comprise four southern provinces,
    conditional on a permissive environment and contributions from other nations.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 13
  focus: Assess the decision to accept responsibility for four provinces rather than retain a narrower area, in light of the
    stated aim of matching CPA(South), fragile security, the UK force reduction, and the lack of robust analysis of strategic
    and resource implications. Exclude the later conduct of military operations within the area.
  span_range:
  - src:77f85715d610#p130.6
  - src:77f85715d610#p132.11
  decision: The UK Government decides to expand its military Area of Responsibility from Basra to four southern provinces,
    matching the area of CPA(South).
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 14
  focus: Examine the choice to pursue further UN authorization rather than rely solely on the Coalition’s powers as an Occupying
    Power. The stated reasons include legal limits on reform, the need for international legitimacy, and access to funding
    and contributors; exclude the detailed negotiation of resolution text except where it bears on authority.
  span_range:
  - src:77f85715d610#p137.9
  - src:77f85715d610#p144.7
  decision: The UK Government decides to seek a further Security Council resolution to authorize and legitimize post-conflict
    administration and political reform in Iraq.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: Assess the timing choice between pressing for agreement during the conflict and waiting until the UK and US have
    greater leverage. The passage links deferral to negotiating from a position of strength and avoiding premature exposure
    of differences over who would shape Iraq’s future administration; exclude covert or operational methods.
  span_range:
  - src:77f85715d610#p143.11
  - src:77f85715d610#p146.11
  decision: The Prime Minister decides to defer bringing the post-conflict resolution debate to a head until the military
    campaign has reached or neared its end, using quiet diplomacy in the meantime.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The decision point is whether to limit the UN’s role or secure its meaningful involvement in the political transition
    and reconstruction. The UK argued that UN involvement would support legitimacy, international participation and an eventual
    exit; the outcome was agreement to seek Security Council resolutions and give the UN a vital role, not to make it the
    administrator of Iraq.
  span_range:
  - src:77f85715d610#p158.4
  - src:77f85715d610#p160.5
  decision: The UK Prime Minister and US President agreed that the UN should have a vital role in post-conflict Iraq, without
    giving it the lead role.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: The decision point is whether to form the interim authority quickly or allow more time for Iraqi consultation and
    representation. UK officials warned that a rushed process could lack Iraqi buy-in and be dominated by exiles; the Prime
    Minister urged a slower approach, which became US policy.
  span_range:
  - src:77f85715d610#p157.7
  - src:77f85715d610#p165.5
  decision: The UK and US leaders chose to slow formation of the Iraqi Interim Authority until after an Iraqi conference and
    a more representative process.
  content_domain: other:post-conflict governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The decision point is whether to deepen UK involvement in ORHA despite concerns that formal participation could increase
    UK responsibility for its actions, including outside UK-controlled areas. The UK chose greater support and prominent involvement,
    while seeking safeguards and retaining the option to reconsider if ORHA imposed radical restructuring without UN authority;
    the passage also records advice to defer a regional-office commitment until its implications were understood.
  span_range:
  - src:77f85715d610#p156.9
  - src:77f85715d610#p169.2
  decision: The UK government chose to increase and formalise its support for ORHA while seeking consultation, joint decision-making
    and a right of veto in extremis.
  content_domain: other:occupation law and administration
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 19
  focus: The decision point is whether to accelerate the return of about 3,500 troops or defer it, given that some personnel
    were needed for later operations and others were no longer required. Include the concern that a rapid drawdown could signal
    abandonment amid disorder and harm Coalition cooperation; exclude the separate question of force levels in Baghdad.
  span_range:
  - src:77f85715d610#p174.3
  - src:77f85715d610#p178.6
  decision: The UK Defence Secretary approves a substantial withdrawal of UK ground troops from Iraq while retaining forces
    for continuing tasks.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 20
  focus: The choice is between an all-in-one resolution and advancing issues individually if a comprehensive text cannot be
    agreed. The stated reason is to obtain UN involvement without jeopardising Coalition achievements; exclude the detailed
    drafting and negotiation tactics.
  span_range:
  - src:77f85715d610#p176.8
  - src:77f85715d610#p176.12
  decision: 'The UK Prime Minister chooses a negotiating strategy for a post-conflict Iraq Security Council resolution: pursue
    an omnibus agreement if achievable, otherwise seek progress on separable issues.'
  content_domain: other:UN policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 21
  focus: 'The decision point is whether to continue involving that department or proceed without it after the policy parameters
    were considered settled. The source records the stated reasons: concern about the minister’s position and the view that
    policy was settled; exclude the underlying dispute over the resolution’s merits except as context.'
  span_range:
  - src:77f85715d610#p192.4
  - src:77f85715d610#p192.5
  decision: The UK Foreign Secretary decides to exclude the department responsible for international development from the
    final phase of Security Council resolution negotiations.
  content_domain: other:government process
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: The decision followed assessments that Baghdad’s security was fragile and that the brigade could help, but the Chiefs
    of Staff judged its effect would be marginal, risk tying down UK forces and harm the UK’s effort in the South; they also
    considered US forces able to address the problem and noted the US did not view a UK deployment as necessary. The Prime
    Minister accepted that advice despite contrary views about the urgency and potential benefit; exclude the brigade’s operational
    plan and tactical methods.
  span_range:
  - src:77f85715d610#p212.9
  - src:77f85715d610#p213.10
  decision: The UK Prime Minister decides whether to deploy 16 Air Assault Brigade to Baghdad to support security and police
    training, or accept the Defence Ministry’s advice against deployment.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 23
  focus: The report describes the legal and political choice over how the UK’s status and responsibilities would be stated
    in Resolution 1483. Reasons for accepting joint status included securing a UK role in Baghdad and sharing responsibility,
    while legal concerns included possible responsibility beyond the South-East and potential joint responsibility for the
    CPA; witnesses disagreed about the decision and its consequences. Exclude implementation of occupation authority and other
    operational conduct.
  span_range:
  - src:77f85715d610#p207.5
  - src:77f85715d610#p209.3
  decision: The UK Government decides whether to accept explicit recognition of the UK as an Occupying Power under unified
    command with the United States, rather than seek authority limited to the area under UK forces’ actual control.
  content_domain: other:international law
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 24
  focus: The decision point is the choice of a Coalition-approved selection process for the interim administration, weighing
    a workable technocratic arrangement against Iraqi legitimacy, consultation, and the UN representative’s role. Exclude
    the later details of proposed institutional structures except where they explain this choice.
  span_range:
  - src:77f85715d610#p215.3
  - src:77f85715d610#p215.5
  decision: The FCO agreed that the Coalition could use an Advisory Council to help select members of an interim Iraqi administration,
    rather than proceeding directly through a National Conference.
  content_domain: other:political-process
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 25
  focus: The decision point is whether to deploy the headquarters before command-and-control arrangements are clarified. The
    stated considerations include the UK’s priority of conducting exemplary operations in the South and the risk associated
    with deployment to Baghdad; exclude operational deployment details beyond this policy-level choice.
  span_range:
  - src:77f85715d610#p226.8
  - src:77f85715d610#p226.9
  decision: The Chiefs of Staff deferred a decision on deploying the headquarters of the Allied Rapid Reaction Corps to Iraq
    pending clarity about US command arrangements.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 26
  focus: The decision point is whether to act against the Badr Brigade or defer while prioritizing perceived threats from
    former regime members and possible al-Qaida elements. The source gives the administrator’s stated prioritization and concern
    about opening a second front; exclude any tactical or operational method of action.
  span_range:
  - src:77f85715d610#p229.6
  - src:77f85715d610#p229.8
  decision: The Coalition Provisional Authority administrator decided not to take action against the Badr Brigade at that
    stage.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 27
  focus: The decision was whether to impose deadlines or let Iraqis set them; the stated reason for the latter was that responsibility
    should lie with the Iraqi people. Exclude the separate question of the overall political timetable and any operational
    matters.
  span_range:
  - src:77f85715d610#p236.5
  - src:77f85715d610#p236.5
  decision: The CPA Administrator chose not to impose deadlines for the political process after the councils were established,
    leaving responsibility for setting them to Iraqis.
  content_domain: other:governance-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 28
  focus: The choice was whether to adjust force levels or continue with existing resources. The review described additional
    commitments that left no reserve and an unsustainable tasking burden; the Chiefs agreed the recommended adjustment and
    reserve preparation, but the passage does not establish the Ministers’ final decision. Exclude tactical employment or
    deployment methods.
  span_range:
  - src:77f85715d610#p252.10
  - src:77f85715d610#p254.3
  decision: The Chiefs of Staff agreed to the Chief of Joint Operations’ recommendations for additional UK force capacity
    in southern Iraq and directed that they be submitted to Ministers.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 29
  focus: The decision was made amid worsening security and an expanding set of tasks, including support for urgent reconstruction
    work. The available choice included reinforcing forces while avoiding a larger symbolic deployment that could leave civilian
    infrastructure needs unaddressed; exclude detailed force employment or operational methods.
  span_range:
  - src:77f85715d610#p266.7
  - src:77f85715d610#p274.3
  decision: The UK Government, led by the Defence Secretary, decided to deploy two additional infantry battalions and specialist
    capabilities to Iraq temporarily.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 30
  focus: The minister chose to fund part of the plan while leaving the balance to the Coalition Provisional Authority in Baghdad.
    The stated concern was that full UK funding could imply that the UK Government was taking responsibility for the South
    and future infrastructure costs; exclude the plan’s operational implementation.
  span_range:
  - src:77f85715d610#p271.5
  - src:77f85715d610#p271.6
  decision: The UK development minister approved £20 million for the southern Iraq essential-services plan rather than committing
    to its full cost.
  content_domain: other:development funding
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 31
  focus: The UK’s stated priority was to continue with the process intended to lead to elections in mid-2004, rather than
    activate an early sovereignty transfer or provisional-government route immediately. The reasons given included constitutional
    and practical obstacles, concerns about legitimacy, and the assessment that the existing process remained achievable;
    exclude the mechanics of any election process.
  span_range:
  - src:77f85715d610#p275.7
  - src:77f85715d610#p276.9
  decision: The UK foreign-policy leadership chose to retain the existing political transition timetable while exploring an
    alternative transition only as a contingency.
  content_domain: other:political process
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 32
  focus: The decision point is whether to hand over executive power early or retain it under the Coalition umbrella, with
    the stated reason that Iraqis were thought to prefer Coalition stability to instability under an Iraqi government. Exclude
    later decisions about the timetable and constitutional process.
  span_range:
  - src:77f85715d610#p283.9
  - src:77f85715d610#p283.11
  decision: The UK Prime Minister chose to oppose an early transfer of executive power to an Iraqi administration.
  content_domain: other:political-transition-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 33
  focus: 'The decision point is whether to attempt a wholesale transfer by spring or use a staged process: strengthen the
    Governing Council, establish an Assembly and transfer sovereignty to a transitional government in September. The stated
    concern was that security and other advances would not be sufficient for a wholesale transfer by spring; exclude the separate
    question of how to conduct security operations.'
  span_range:
  - src:77f85715d610#p296.4
  - src:77f85715d610#p297.7
  decision: The UK Prime Minister endorsed a staged political timetable transferring sovereignty to a transitional Iraqi government
    in September 2004.
  content_domain: other:political-transition-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 34
  focus: The decision point is whether to retain the existing plan or replace it, given concern that it would not produce
    credible elections based on a legitimate constitution quickly enough. The reported outcome was to accelerate the plan
    while exploring alternatives; exclude operational security measures discussed elsewhere.
  span_range:
  - src:77f85715d610#p293.4
  - src:77f85715d610#p294.3
  decision: The US administration chose to maintain and accelerate the Seven Step Plan while also examining alternatives.
  content_domain: other:political-transition-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 35
  focus: 'The decision point is choosing the staged constitutional and political process over direct elections or the prior
    approach. The passage describes the stalemate the agreement was intended to resolve: disagreement over whether constitutional
    principles should precede elections and whether non-Iraqis could shape Iraq’s constitution; exclude later disputes over
    implementation.'
  span_range:
  - src:77f85715d610#p298.8
  - src:77f85715d610#p300.4
  decision: The Coalition Provisional Authority and Iraqi Governing Council adopt the 15 November transition agreement, including
    provincial caucuses to select the transitional assembly and a transfer of sovereignty by 30 June 2004.
  content_domain: other:political transition
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 36
  focus: The decision concerns whether to add forces to support security and training as the political timetable accelerates.
    The review found existing resources could not maintain security and train Iraqi forces simultaneously; exclude tactical
    details of the deployment.
  span_range:
  - src:77f85715d610#p312.2
  - src:77f85715d610#p314.8
  decision: The Defence Secretary decides to deploy an additional infantry battalion and two Royal Military Police platoons
    to Iraq for six months.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 37
  focus: The decision point is prioritising additional analysis of the insurgency despite the stated cost of reducing assessment
    of other Iraq-related activity and using less regionally experienced analysts elsewhere. Keep the focus on analytic resourcing
    and its trade-offs, not on operational methods for identifying or tracking insurgents.
  span_range:
  - src:77f85715d610#p301.5
  - src:77f85715d610#p301.8
  decision: The Chief of Defence Intelligence’s organisation establishes an Iraq Security Task Force and reallocates analytical
    effort toward the insurgency.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 38
  focus: The decision point is whether to keep the deadline or delay the transfer. The advice cited credibility, UN engagement,
    security risks from continued occupation, and the need to end the political vacuum; the Prime Minister said the deadline
    must hold. Exclude the separate question of which Iraqi political mechanism would implement the transition.
  span_range:
  - src:77f85715d610#p330.9
  - src:77f85715d610#p331.5
  decision: The Prime Minister decided to press the US President to maintain the 30 June 2004 handover deadline rather than
    postpone it.
  content_domain: other:political-transition policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 39
  focus: The decision point is whether to seek an agreed Iraqi basis and new UN endorsement, rather than rely on the US view
    that existing authorities were sufficient. UK lawyers doubted that view, officials worried about perceptions that occupation
    would continue, and a new basis mattered to multinational partners. Exclude the operational powers sought under the agreement
    and any question of how forces would exercise them.
  span_range:
  - src:77f85715d610#p330.6
  - src:77f85715d610#p330.9
  decision: UK officials decided to advocate an exchange of letters with the Governing Council and a further Security Council
    resolution to establish the post-transition basis for Coalition forces in Iraq.
  content_domain: other:post-transition legal authority
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 40
  focus: The decision point is whether to recognize the existing Kurdish regional government in the interim framework or avoid
    that provision amid concerns about special treatment and federalism. The document says UK officials considered recognition
    appropriate because the regional government had administered the north effectively, and the reference was retained after
    persuasion of Washington. Exclude the later substantive settlement of federalism, which the text says was for Iraqis to
    address.
  span_range:
  - src:77f85715d610#p335.7
  - src:77f85715d610#p335.7
  decision: UK officials, with the Coalition Provisional Authority, chose to retain recognition of the Kurdistan Regional
    Government in the draft Transitional Administrative Law rather than omit it.
  content_domain: other:constitutional transition policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 41
  focus: The commander faced a request to comply with wider-command orders or retain the existing approach. The stated reasons
    were that local conditions differed, current measures were effective, the movement had political support, and an Iraqi
    solution was preferable. Exclude tactical details of any operations.
  span_range:
  - src:77f85715d610#p351.8
  - src:77f85715d610#p352.3
  decision: The UK commander in south-east Iraq declined the request to close Sadr movement offices and the Mahdi Army in
    his area of command.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
