  focus: The decision point is whether to follow the service-intelligence doctrine that treated intentions as a commander's
    responsibility or include the estimators’ best judgment of likely Soviet courses of action. Focus on the scope and completeness
    of intelligence analysis; exclude the substantive accuracy of any particular estimate.
  span_range:
  - src:3153f6d37d63#p1.6
  - src:3153f6d37d63#p2.3
  decision: The Director of Central Intelligence decides that National Intelligence Estimates should address likely Soviet
    intentions rather than confine themselves to military capabilities.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to commission the work within the Agency or have outside researchers use unclassified
    sources, including to assess what a foreign intelligence service could learn with minimal effort. Focus on the purpose
    and terms of the study; exclude the report’s military details and any techniques for gathering information.
  span_range:
  - src:3153f6d37d63#p3.2
  - src:3153f6d37d63#p4.1
  decision: The CIA Projects Review Committee approves an outside, public-source study of U.S. military capabilities and intentions
    from a Soviet perspective.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to establish a new government-wide pattern for safeguarding sensitive classified material
    or retain the existing approach. The passage links the order to concern about how much military information was publicly
    available and describes its intended special protection; exclude later disputes about press coverage except as context
    for the decision.
  span_range:
