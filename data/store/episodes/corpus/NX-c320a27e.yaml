episodes:
- n: 1
  focus: The decision point is the shift toward a shorter, attention-prioritized product for the president, prompted by White
    House concerns about efficiency and what merited presidential attention. Exclude the content of the intelligence assessments
    and any operational or collection details.
  span_range:
  - src:dfcbe6a726bd#p18.8
  - src:dfcbe6a726bd#p18.8
  decision: CIA leadership chose to begin producing a concise President’s Intelligence Check List for the president instead
    of relying only on the larger flow of reports.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The analytic decision is whether insurgencies were gaining momentum or instead weakening; the analysts chose the
    latter assessment. Focus on their reasons in the passage, including limited progress and the lack of major effects from
    Cuban support; exclude operational details about aid or training.
  span_range:
  - src:dfcbe6a726bd#p21.6
  - src:dfcbe6a726bd#p21.7
  decision: CIA analysts in the February 1967 special memorandum judged that Latin American insurgencies had regressed and
    had poor near-term prospects.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is the NIE’s judgment about the likelihood and likely timing of successful revolution, rather
    than a forecast of imminent success. Use the stated reasons—unorganized or noncritical discontent and weak leadership
    among radical organizations—and exclude discussion of how insurgencies operated.
  span_range:
  - src:dfcbe6a726bd#p22.15
  - src:dfcbe6a726bd#p22.17
  decision: CIA analysts in the March 1969 NIE judged that successful revolutionary change in Latin America was unlikely in
    the near term.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to leave the seminar findings as discussion or require agency components to examine
    them for possible implementation; the DDCI chose to order follow-up discussions. The stated rationale was that the findings
    merited serious study and that creativity and willingness to consider risks were major challenges. Exclude the broader
    history of the seminars except as context for this direction.
  span_range:
  - src:dfcbe6a726bd#p30.6
  - src:dfcbe6a726bd#p30.7
  decision: The DDCI directed CIA operating components to discuss the creativity seminars’ findings in special staff meetings.
  content_domain: other:agency_management
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 5
  focus: The Director faced White House pressure to withhold information but chose to provide documents and information to
    the committee, believing that cooperation and adjustment to new political realities would help preserve the agency. Focus
    on the oversight and accountability judgment; exclude operational details of the intelligence activities under investigation.
  span_range:
  - src:dfcbe6a726bd#p44.4
  - src:dfcbe6a726bd#p44.6
  decision: The Director of Central Intelligence chose to cooperate with the Senate committee’s investigation rather than
    stonewall it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The committee considered requiring court orders and weighed use of any federal judge against a defined group authorized
    to hear classified cases. The account says the committee adopted the special system because investigating every federal
    judge’s background would create practical disorder; focus on the judicial authorization framework, not surveillance techniques.
  span_range:
  - src:dfcbe6a726bd#p45.8
  - src:dfcbe6a726bd#p46.3
  decision: The Senate committee chose a special, limited group of judges to hear classified surveillance-warrant applications
    rather than allowing applications to go to any federal judge.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The president weighs retaining the director against replacing him after his disclosures to Congress anger the White
    House and undermine its effort to manage the crisis. Focus on the leadership and oversight rationale; exclude details
    of the gadget displayed at a hearing.
  span_range:
  - src:dfcbe6a726bd#p48.5
  - src:dfcbe6a726bd#p48.7
  decision: The president decides to remove the incumbent CIA director amid the intelligence investigations and appoint a
    successor.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: 'The nominee weighs accepting against the costs: potential damage to U.S.-China goodwill, loss of political prospects,
    and the agency’s controversy. He accepts because he sees service to the country and president as a duty; exclude operational
    matters unrelated to the appointment.'
  span_range:
  - src:dfcbe6a726bd#p49.10
  - src:dfcbe6a726bd#p50.5
  decision: The CIA-director nominee decides whether to accept the president’s offer to lead the agency.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The president weighs the nominee’s experience and ability to lead against concerns that his party leadership and
    political ambitions could compromise the agency’s nonpartisan standing and provoke a difficult confirmation. Focus on
    the appointment rationale and institutional independence; exclude campaign and intelligence-operation details.
  span_range:
  - src:dfcbe6a726bd#p50.7
  - src:dfcbe6a726bd#p51.1
  decision: The president decides to nominate the ambassador to China as CIA director despite concerns about his political
    background.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: After the Senate committee deadlocks over concerns that the nominee may soon leave for a campaign, the president
    chooses to make a public commitment that he will not consider him as a running mate. The account says the president acted
    to avoid a confirmation setback; exclude speculation about later political careers beyond this confirmation issue.
  span_range:
  - src:dfcbe6a726bd#p54.8
  - src:dfcbe6a726bd#p54.11
  decision: The president decides to promise not to consider the CIA-director nominee as his vice-presidential running mate
    to help secure confirmation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
