  focus: The decision point is whether the editor should accept the DCI’s revision or challenge it as ambiguous; the DCI then
    chose to give the editor discretion over further editing. Keep the focus on editorial judgment and the integrity of the
    analytic text, not on broader claims about the officials’ character.
  span_range:
  - src:797d7b2cd930#p2.4
  - src:797d7b2cd930#p2.4
  decision: The CIA editor challenged the DCI’s wording change and, after the DCI accepted the objection, took responsibility
    for editing the text.
  content_domain: intel-analysis
