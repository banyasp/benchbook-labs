  natsec: true
- n: 2
  focus: The decision point is whether to establish a civilian analytic office for independent, all-source strategic assessment
    when the military found the work difficult and did not want a civilian agency doing it. Exclude technical methods of intelligence
    collection or assessment; the relevant issue is the organizational and analytic policy choice.
  span_range:
  - src:797d7b2cd930#p2.5
  - src:797d7b2cd930#p3.1
  decision: The DDI established an Office of Strategic Research to produce independent strategic assessments of military developments
    and trends.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether the directorate should accept requests as they arrive or screen them and refuse low-priority
    work. The stated concern was that analysts were spending months on requests from junior State Department officers; exclude
    any operational details not present in this policy-level account.
  span_range:
  - src:797d7b2cd930#p3.2
  - src:797d7b2cd930#p3.2
  decision: The DDI instituted review of analytic requests and directed staff to decline low-priority requests.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
