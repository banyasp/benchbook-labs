- n: 1
  focus: In June 1941, British and American authorities moved beyond an exchange focused largely on army-planning intelligence,
    and London instructed officials to cooperate more fully; the stated exception protected a sensitive SOE activity in Thailand.
    Treat this as a decision about intelligence-sharing policy, not as a scenario about the operation or methods used to conduct
    it.
  span_range:
  - src:6f4c83f14e63#p2.11
  - src:6f4c83f14e63#p3.1
  decision: British authorities decide to expand intelligence sharing with the United States in the Far East while withholding
    information about the SOE station in Thailand.
  content_domain: other:intelligence-sharing
