  focus: In 1962, North Vietnam retained troops in Laos and resumed its offensive despite agreements to neutralize the country
    and withdraw foreign forces. The decision weighed supporting the neutralist government against avoiding direct, open US
    military intervention and a full-scale war; exclude the later operational details of the program.
