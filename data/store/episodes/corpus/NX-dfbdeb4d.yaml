- n: 2
  focus: During the attack on the Japanese-held airfield, the units had faced heavy counter-fire for hours, suffered casualties,
    and were running out of ammunition without reinforcement. The decision point is whether to continue the assault or withdraw;
    exclude the mechanics of the attack.
  span_range:
  - src:8b48dfd5849c#p5.5
  - src:8b48dfd5849c#p5.5
  decision: The OSS field leaders withdrew their units from the attack after ammunition ran low and reinforcements did not
    arrive.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: After the crash, the agencies’ public account omitted or misstated details that would expose the covert US role,
    while the stated policy was to maintain the appearance of non-intervention. The decision point is whether to disclose
    the role accurately or preserve that façade; exclude the crash’s technical and recovery details.
  span_range:
  - src:8b48dfd5849c#p10.4
  - src:8b48dfd5849c#p10.8
  decision: The CIA and other US agencies chose to withhold and obscure the US role in Laos in public reporting after the
    helicopter crash.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: Following public criticism and a congressional investigation, the agency adopted a memorial and later an annual ceremony,
    while its operations branch had opposed releasing information about officers. The decision point is whether and how to
    recognize fallen officers while preserving secrecy; exclude the memorial’s physical description and individual family-invitation
    outcomes.
  span_range:
  - src:8b48dfd5849c#p14.2
  - src:8b48dfd5849c#p14.3
  decision: CIA leadership decided to establish a memorial and annual commemoration for officers who died in the line of duty.
