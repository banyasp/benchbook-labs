- n: 1
  focus: The stated constraint was preserving the appearance of Laotian neutrality, which ruled out U.S. or South Vietnamese
    forces; irregulars were selected to contest Pathet Lao presence and seek information about North Vietnamese activity.
    Keep the decision at the force-posture and neutrality-policy level, not the operational details of intelligence collection
    or deployment.
  span_range:
  - src:219b1434a439#p12.3
  - src:219b1434a439#p12.3
  decision: U.S. and Royal Lao Government decision-makers choose station-directed irregulars in eastern Laos rather than deploying
    U.S. or South Vietnamese forces.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The unit was a training operation, not a force tasked with defending a fortified position, and the leaders chose
    withdrawal to preserve the force for later action. Focus on the command choice and its stated rationale; exclude the mechanics
    of the movement.
  span_range:
  - src:219b1434a439#p10.3
  - src:219b1434a439#p10.4
  decision: The field adviser and local unit leaders choose to disperse rather than defend the training site as North Vietnamese
    forces approach.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: Although CIA personnel were civilian and not technically required to leave, Washington judged their continued presence
    broadly provocative; it nevertheless kept two officers in place because preserving the Hmong leader’s confidence was considered
    too important to risk. Treat the limited retention as part of the withdrawal decision, not as a separate episode.
  span_range:
  - src:219b1434a439#p20.5
  - src:219b1434a439#p20.5
  decision: Washington decides to withdraw most U.S. personnel from Laos after the Geneva agreements while retaining two officers
    with the Hmong leader.
  content_domain: other:intelligence-presence policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: After the coup, the central government was preoccupied with internal competition and had no countryside-security
    strategy. The station chief turned to province-level contacts, while retaining the option of working through or waiting
    for the central government; exclude the programs’ operational methods.
  span_range:
  - src:219b1434a439#p26.3
  - src:219b1434a439#p27.2
  decision: The station chief chose to pursue provincial-level contacts and rural-security programs rather than rely on the
    central military government to develop a strategy.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The proposal was made amid a collapsing government position in the countryside, and its proponents expected it to
    challenge Viet Cong influence; the account says legal questions were left to Headquarters, which raised no concerns. Include
    the decision to approve the program and its legal oversight, but exclude operational methods and target selection.
  span_range:
  - src:219b1434a439#p29.2
  - src:219b1434a439#p29.3
  decision: CIA station leadership and Headquarters approved a counter-terror program despite acknowledged uncertainty about
    the legality of lethal force.
  content_domain: intel-oversight
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The decision followed preliminary results in Kien Hoa and Quang Ngai, with the absence of alternatives also cited
    as justification. The account contrasts expansion with limiting the effort to existing provinces; exclude details of implementation
    in individual districts.
  span_range:
  - src:219b1434a439#p33.4
  - src:219b1434a439#p34.4
  decision: The station and Washington chose to expand rural-pacification programs into additional provinces.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The pilots sought authorization to attack civilian boats, but could not explain how they would determine which boats
    were suspicious; the officer refused without consulting headquarters. Focus on the authorization decision and the absence
    of a defensible standard, not on any operational method of attack or surveillance.
  span_range:
  - src:219b1434a439#p46.3
  - src:219b1434a439#p46.3
  decision: The CIA field officer denied the pilots permission to attack civilian boats on Lake Tanganyika.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 8
  focus: The case officer found that the asset’s claimed provincial organizing had produced only empty talk and that the asset
    had misappropriated funds; he dissolved the operation. Focus on the decision to terminate the operation and the integrity
    rationale, not on the covert agent’s placement or handling.
  span_range:
  - src:219b1434a439#p54.5
  - src:219b1434a439#p55.2
  decision: The CIA case officer dissolved the one-person covert influence operation after discovering financial misconduct.
  content_domain: other:covert-action management
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 9
  focus: After anxious deliberations, Washington directed the evacuation in mid-1972; the Ambassador and State Department
    had weighed family safety against the possible effect of their departure on Cambodian confidence. Focus on that risk and
    commitment judgment, not on evacuation logistics.
  span_range:
  - src:219b1434a439#p68.4
  - src:219b1434a439#p69.2
  decision: Washington ordered the evacuation of all embassy families from Cambodia after weighing their safety against the
    effect on Cambodian confidence in the US commitment.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 10
