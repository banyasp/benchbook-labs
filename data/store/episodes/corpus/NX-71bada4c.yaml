episodes:
- n: 1
  focus: Army planners argued for an integrated campaign with the land campaign primary, while Navy planners argued that the
    commanders’ plans should be adjusted to one another and that the naval commander retain decision authority for the operation
    he was responsible for. The approved directive assigned primary responsibility to the Army commander, including control
    of the amphibious assault in exigencies, and made the land campaign primary; exclude the operational details of the invasion
    itself.
  span_range:
  - src:6e292feb953f#p2.7
  - src:6e292feb953f#p8.2
  decision: The Joint Chiefs of Staff resolve how to allocate command authority and coordinate Army and Navy plans for Operation
    OLYMPIC.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The campaign memorandum weighs southern Kyushu against Korea and northwestern Kyushu and gives reasons for selecting
    southern Kyushu, including its relationship to Okinawa-based support, shorter communications, potential airfield development,
    and contribution to isolating Japan and defeating its forces. Treat this as a strategic decision about whether and where
    to employ force; exclude the operational details of conducting the invasion.
  span_range:
  - src:6e292feb953f#p27.1
  - src:6e292feb953f#p29.3
  decision: The Joint Chiefs of Staff choose southern Kyushu as the next major operation rather than Korea or northwestern
    Kyushu.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The memorandum says no post-Kyushu operation has yet been directed because the choice should await further developments,
    while planning proceeds for a Tokyo-area invasion and preparations also cover a northwestern Kyushu alternative. The stated
    uncertainty about whether blockade and bombardment could compel surrender, along with the differing possible casualty
    and timing consequences, provides the decision context; distinguish this deferral and contingency planning from a final
    decision to invade Tokyo.
  span_range:
  - src:6e292feb953f#p27.1
  - src:6e292feb953f#p32.2
  decision: The campaign planners defer a final decision on operations after southern Kyushu while preparing for a Tokyo-area
    invasion and a possible extension of blockade positions to northwestern Kyushu.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The decision rests on the stated strategic value of southern Kyushu and comparisons with the costs, force requirements,
    and military disadvantages of the alternatives. Keep the scenario at the campaign-policy level; exclude landing plans
    and other operational techniques.
  span_range:
  - src:6e292feb953f#p49.4
  - src:6e292feb953f#p51.6
  decision: The Joint Chiefs of Staff direct an invasion of southern Kyushu for about 1 November 1945 rather than choose Korea
    or northwestern Kyushu.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to proceed toward a later invasion or rely on continued blockade and bombardment, with
    execution contingent on what follows the Kyushu operation. Exclude the operational details of any invasion or bombardment.
  span_range:
  - src:6e292feb953f#p49.5
  - src:6e292feb953f#p50.1
  decision: The Joint Chiefs of Staff plan and prepare for an invasion of the Tokyo Plain while deferring the decision to
    execute it until after the southern Kyushu operation and further developments.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: 'The decision concerns command authority in discussions with the British: continue U.S. leadership or adopt combined
    control. Keep the scenario focused on the reasons for the command arrangement, not on command procedures or operational
    methods.'
  span_range:
  - src:6e292feb953f#p58.5
  - src:6e292feb953f#p58.5
  decision: The Joint Chiefs of Staff decide to retain U.S. control and direction of the Pacific war and oppose placing it
    under combined control.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The policy choice is whether to seek specific Soviet commitments or simply remain open to Soviet proposals, while
    valuing early Soviet participation against Japanese forces in Manchuria. Exclude details of any proposed convoy route
    or other operational arrangements.
  span_range:
  - src:6e292feb953f#p55.3
  - src:6e292feb953f#p56.3
  decision: The Joint Chiefs of Staff favor early Soviet entry into the war against Japan but decide not to press the Soviet
    Union for further information or commitments.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: high
  held_out: false
  natsec: false
- n: 8
  focus: The decision point is whether to proceed with the proposed invasion despite anticipated casualties, or rely on alternatives
    such as air power and blockade and await further developments. The President accepted the Chiefs’ unanimous recommendation
    to proceed, weighing military necessity, expected losses, weather and timing, possible Soviet action, and political concerns
    about Japanese resistance; exclude the later operational details of how the campaign would be conducted.
  span_range:
  - src:6e292feb953f#p71.2
  - src:6e292feb953f#p74.3
  decision: The President, with the Joint Chiefs of Staff, decided to proceed with the Kyushu invasion plan while deferring
    the decision on subsequent operations.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is whether the reported strengthening of Japanese forces in southern Japan warrants changing the
    current OLYMPIC directive or whether it should remain in force while alternatives are studied. The passage says the buildup
    was not yet considered sufficient to require a change, while directing continued review and alternate planning; exclude
    the operational details of any alternate invasion plans.
  span_range:
  - src:6e292feb953f#p99.5
  - src:6e292feb953f#p100.5
  decision: The Joint Staff Planners recommended keeping the OLYMPIC directive in place while asking theater commanders to
    review the changed Japanese defenses and prepare alternatives.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 10
  focus: The President’s retrospective account says he considered invasion casualty estimates, sought an ultimatum that Japan
    rejected, and then ordered the bombs; he says the final decision came after returning from Potsdam. The passage also notes
    the July 25 directive and explains it as preparation, so preserve the timing ambiguity; exclude target-selection and delivery
    details.
  span_range:
  - src:6e292feb953f#p117.8
  - src:6e292feb953f#p118.2
  decision: The President decides whether to use atomic bombs against Japan or pursue an alternative such as invasion.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 11
  focus: The reviewer removed the sentence because it could be unfairly used by political opponents, while acknowledging that
    it stated a fundamental truth. Treat this as a choice about public communication and political considerations; exclude
    the separate edits to casualty wording and factual chronology.
  span_range:
  - src:6e292feb953f#p116.5
  - src:6e292feb953f#p116.10
  decision: A White House staff reviewer decides to omit a truthful sentence from the President’s historical account.
  content_domain: other:government communication
  refusal_sensitivity: low
  held_out: false
  natsec: false
