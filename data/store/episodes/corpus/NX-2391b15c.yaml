episodes:
- n: 1
  focus: The decision point is whether to grant clemency to the six defendants, including the former Secretary of Defense,
    shortly before his trial. The stated rationale was the President’s view that the prosecutions represented the criminalization
    of policy differences; exclude speculation about other motives.
  span_range:
  - src:be4ef57624ad#p1.1
  - src:be4ef57624ad#p1.1
  decision: The President pardoned the former national-security and intelligence officials charged in the Iran/contra investigation.
  content_domain: other:executive clemency
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to accept a narrowly limited interview or continue seeking questioning that serves
    the investigation’s broader purpose. The Independent Counsel declined because the limited interview would not serve a
    basic investigative purpose and could misleadingly suggest cooperation; exclude conjecture about the President’s motives.
  span_range:
  - src:be4ef57624ad#p1.5
  - src:be4ef57624ad#p1.5
  decision: The Independent Counsel declined the President’s offer to limit an interview to the non-production of his diary
    and personal notes.
  content_domain: other:criminal-investigation procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to use a grand-jury subpoena despite the President’s refusal to be deposed. The Independent
    Counsel judged it inappropriate absent a reasonable likelihood of criminal prosecution, and also sought to avoid using
    the grand jury to obtain material for a report or appearing retaliatory for the pardon; exclude operational details of
    the Iran/contra activity.
  span_range:
  - src:be4ef57624ad#p1.30
  - src:be4ef57624ad#p1.30
  decision: The Independent Counsel decided not to seek a grand-jury subpoena for the President.
  content_domain: other:criminal-investigation procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to permit the interviews under a broad non-waiver agreement or refuse that condition.
    The Independent Counsel had agreed to protect the President’s privileges other than the Fifth Amendment privilege, but
    refused a broader agreement that would cover the interviewees’ Fifth Amendment privilege and effectively allow testimony
    under immunity; exclude speculation about the witnesses’ reasons for refusing the interviews.
  span_range:
  - src:be4ef57624ad#p1.24
  - src:be4ef57624ad#p1.26
  decision: The Independent Counsel refused to extend the proposed non-waiver agreement to the former counsel and deputy counsel’s
    Fifth Amendment privilege.
  content_domain: other:criminal-investigation procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
