    policy. Its stated reasons were to avoid entanglement in public controversies and preserve an objective, impartial approach;
    exclude the Commission’s substantive classification recommendations.
  span_range:
  - src:eb47db48ca92#p341.3
  - src:eb47db48ca92#p341.3
  decision: Commission on Government Security decides not to hold public hearings or make public statements about its work.
  content_domain: other:commission-procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 46
  focus: The committee chose to recommend replacing or supplementing executive-order-based classification with a statutory
    framework, citing defects in E.O. 11652 and the need to protect congressional access and oversight. Focus on the legal
    authority and accountability structure; exclude operational handling of classified material.
  span_range:
  - src:eb47db48ca92#p353.2
  - src:eb47db48ca92#p354.3
  decision: The House Foreign Operations and Government Information Subcommittee recommended that Congress enact a statutory
    security-classification system covering executive agencies.
  content_domain: other:government-information-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 47
  focus: The subcommittee favored case-specific congressional authorization over relying on general authority in treaties
    or congressionally authorized programs. Its stated rationale was that overseas forces and bases can assure host governments
    of U.S. commitments and therefore warrant congressional scrutiny; exclude operational military details.
  span_range:
  - src:eb47db48ca92#p365.1
  - src:eb47db48ca92#p365.2
  decision: The Senate Foreign Relations Subcommittee on Security Agreements and Commitments Abroad recommended that no U.S.
    forces be stationed or bases established abroad without specific prior congressional authority.
  content_domain: other:executive-agreements
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 48
  focus: The Senate selected an approval requirement for agreements establishing, extending, or significantly changing certain
    installations, including those with more than 500 assigned or authorized personnel. The committee said such foreign-policy
    questions should be addressed explicitly by the relevant committees rather than through appropriations alone; exclude
    operational details about the bases.
  span_range:
  - src:eb47db48ca92#p368.3
  - src:eb47db48ca92#p369.2
  decision: The Senate passed a provision conditioning funds for specified foreign military-base agreements on congressional
    approval or Senate advice and consent to a treaty.
  content_domain: other:executive-agreements
  refusal_sensitivity: low
  held_out: false
  natsec: false
