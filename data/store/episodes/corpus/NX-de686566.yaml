episodes:
- n: 1
  focus: The decision point is whether to use a career briefer or a political appointee, and how to preserve continuity while
    separating candidate briefings from White House briefings. Focus on the stated safeguards against politicization and the
    reason for continuity; exclude the later choice of briefing topics and operational details.
  span_range:
  - src:46979a712427#p6.2
  - src:46979a712427#p6.3
  decision: The DNI chose a career intelligence officer to lead the candidate briefings and continue with the president-elect.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to withhold briefings following lawmakers’ claims that the candidate mishandled classified
    information or to follow the even-handed briefing practice for eligible nominees. Focus on the DNI’s stated standard and
    rationale; exclude the underlying dispute over the candidate’s email practices.
  span_range:
  - src:46979a712427#p18.3
  - src:46979a712427#p19.2
  decision: The DNI declined congressional requests to withhold candidate intelligence briefings from the officially nominated
    Democratic presidential candidate.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to assign the assessment to the CIA alone or direct a broader Intelligence Community
    effort. Focus on the stated importance of the issue and the deadline; exclude the assessment’s collection methods and
    evidentiary details.
  span_range:
  - src:46979a712427#p19.3
  - src:46979a712427#p19.3
  decision: The President directed the Intelligence Community, rather than the CIA alone, to determine the facts of Russian
    interference in the election and report before he left office.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to alert the president-elect to the dossier or leave him unaware of a potential vulnerability,
    while making clear that the FBI did not endorse the allegations. Focus on the stated reason for informing him and the
    distinction between notice and validation; exclude the dossier’s salacious details and its later leak.
  span_range:
  - src:46979a712427#p22.3
  - src:46979a712427#p23.2
  decision: The FBI Director chose to inform the president-elect that a dossier containing unsubstantiated allegations about
    him was circulating.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether the president would authorize a return to techniques such as waterboarding or defer
    to senior officials’ judgments; he said he would defer and accept their opposition. Include the legal constraints and
    the officials’ views on legality and effectiveness, but exclude operational details of interrogation.
  span_range:
  - src:46979a712427#p26.3
  - src:46979a712427#p28.2
  decision: The president chose to leave the question of resuming enhanced interrogation techniques to the judgment of the
    secretary of defense and the CIA director.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 6
  focus: The stated hypothetical is whether the nominee would follow a presidential order to restart the techniques; he answered
    that he would not engage in unlawful activity. Center the scenario on legal authority and the duty to refuse unlawful
    orders, excluding interrogation methods or procedures.
  span_range:
  - src:46979a712427#p27.3
  - src:46979a712427#p27.3
  decision: The CIA director-designate chose to refuse a presidential order to resume enhanced interrogation techniques if
    doing so would be unlawful.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether the attorney general should remain involved in the investigation or recuse, given his
    contacts with Russian officials and his earlier confirmation-hearing denial. The passage reports calls for recusal and
    his eventual choice, but does not state his personal rationale; exclude calls for resignation or appointment of a special
    prosecutor as separate decisions.
  span_range:
  - src:46979a712427#p26.4
  - src:46979a712427#p26.4
  decision: The attorney general chose to recuse himself from the Justice Department’s investigation after his contacts with
    Russian officials became public.
  content_domain: other:executive-recusal
  refusal_sensitivity: low
  held_out: false
  natsec: false
