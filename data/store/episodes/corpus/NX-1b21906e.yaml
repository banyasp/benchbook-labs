episodes:
- n: 1
  focus: 'The decision point is the boundary between preparatory activity and authorization to conduct an intelligence operation:
    officials approved preparations and related spending but explicitly withheld authority to deploy or fly. Exclude the operational
    plan and deployment logistics.'
  span_range:
  - src:45b112b38944#p22.3
  - src:45b112b38944#p23.1
  decision: The senior intelligence and defense officials agreed to authorize preparations for possible OXCART operations
    over Communist China, while reserving any deployment or flight authorization to the President.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The Committee weighed the proponents’ case for better intelligence against opponents’ concern about political risks
    from basing the aircraft in Okinawa and revealing its capabilities. The decision was to withhold deployment authorization
    while retaining readiness; exclude the detailed deployment plan and flight procedures.
  span_range:
  - src:45b112b38944#p24.4
  - src:45b112b38944#p25.3
  decision: The 303 Committee declined to authorize OXCART deployment to the Far East and instead approved maintaining a quick-reaction
    capability.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: 'The decision point is whether to deploy OXCART after earlier proposals had been rejected: the passage identifies
    the intelligence concern, the aircraft’s asserted advantages, and the President’s approval. Exclude the deployment plan
    and any details of reconnaissance operations.'
  span_range:
  - src:45b112b38944#p26.4
  - src:45b112b38944#p27.1
  decision: The President approved proceeding with the BLACK SHIELD deployment after renewed concern that the United States
    might not detect a missile development in North Vietnam.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision followed a study of alternatives to reduce costs, including maintaining both fleets, sharing SR-71 aircraft,
    or ending OXCART. The stated case for termination was reducing the combined programs’ projected expense and relying on
    the SR-71; the CIA Director objected that SR-71 readiness was uncertain and argued for retaining an independent CIA capability.
    Exclude the subsequent operational phase-out details.
  span_range:
  - src:45b112b38944#p32.2
  - src:45b112b38944#p33.2
  decision: The President directs termination of the OXCART fleet by 1 January 1968 rather than retaining a separate fleet
    or sharing the SR-71 capability.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The CIA Director assessed four continuation or transfer alternatives and chose to advocate for continued independent
    CIA operation. His stated reasons included doubts about the proposed cost savings, security concerns about collocating
    the fleets, and the value of a covert reconnaissance capability under civilian management. This is a recommendation to
    senior officials, not the later decision by the Secretary of Defense and President.
  span_range:
  - src:45b112b38944#p34.3
  - src:45b112b38944#p35.1
  decision: The CIA Director recommends continuing OXCART at its own base under CIA management rather than transferring, collocating,
    or terminating the fleet.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
