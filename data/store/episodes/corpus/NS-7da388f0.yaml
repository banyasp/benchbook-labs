  focus: The analytic choice was between treating the SA-2s as part of Cuba’s air defenses and interpreting them as a means
    to conceal offensive missile sites; the source notes that officials disagreed. Focus on the Director’s stated inference
    and its evidentiary basis, not on reconnaissance operations or the technical characteristics of the missile system.
  span_range:
  - src:bdc60a28a8ba#p8.1
  - src:bdc60a28a8ba#p8.2
  decision: The Director of Central Intelligence judged that the Soviet purpose of deploying SA-2 missiles in Cuba was to
    prevent U.S. reconnaissance from discovering offensive missile installations.
