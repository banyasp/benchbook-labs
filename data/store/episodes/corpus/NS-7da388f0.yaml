- n: 2
  focus: The decision point is the President’s choice of a quarantine amid a crisis in which the Executive Committee considered
    diplomatic and military options, with the stated aim of preventing additional armaments and seeking removal of the missiles.
    The passage does not establish the legal authority or fully compare the alternatives; exclude operational details of enforcing
    the quarantine or any ship engagement.
  span_range:
