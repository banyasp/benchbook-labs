episodes:
- n: 1
  focus: The decision point is whether command would pursue the operation against Mount Srdj while limiting fire to military
    objectives, or launch and continue fire that struck the Old Town. The judgment describes the objective of taking Srdj
    before an anticipated ceasefire and a claimed retaliatory rationale, but finds that the shelling of the Old Town was deliberate
    and not justified by military targets there; exclude weapon employment and targeting technique.
  span_range:
  - src:8c9c506ac414#p1.6
  - src:8c9c506ac414#p1.45
  decision: JNA senior command chose to launch and continue the 6 December 1991 artillery attack that deliberately shelled
    Dubrovnik’s Old Town.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 2
  focus: The Trial Chamber weighed the Defence account—that shelling was directed at Croatian military positions or was a
    consequence of fire errors—against evidence about the locations and scale of the shelling, the absence of military positions
    in the Old Town, and the known civilian population. It found deliberate targeting and no military necessity; exclude operational
    details about weapons, firing positions, or targeting methods.
  span_range:
  - src:8c9c506ac414#p1.9
  - src:8c9c506ac414#p1.45
  decision: The Trial Chamber decided that the Old Town shelling was not a military-target response or incidental damage,
    but a deliberate attack on civilians and civilian objects.
  content_domain: other:international-criminal-law
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is the commander’s choice to order the operation to capture Srdj, with supporting action against
    positions threatening its success, rather than not ordering the operation. The judgment identifies capture of Srdj as
    the objective and finds that the order did not authorize a general attack on Dubrovnik; exclude discussion of weapons,
    firing positions, and other operational details.
  span_range:
  - src:8c9c506ac414#p1.60
  - src:8c9c506ac414#p1.61
  decision: The commander of the 2nd Operational Group ordered an operation to capture Srdj on 6 December 1991.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 4
  focus: The Appeals Chamber chose to reject the Trial Chamber’s requirement of notice of a substantial or strong risk, holding
    that sufficiently alarming information indicating a risk and the need for further inquiry can satisfy the standard. It
    applied that standard to the commander’s prior knowledge and failure to make further enquiries; exclude general discussion
    of participation in hostilities and unrelated appeal grounds.
  span_range:
  - src:8c9c506ac414#p1.97
  - src:8c9c506ac414#p1.99
  decision: The Appeals Chamber allowed the prosecution’s appeal on the standard for a commander’s duty to prevent crimes
    after receiving alarming information.
  content_domain: other:judicial-adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The Chamber chose the counts that most comprehensively reflected the conduct, applying the rule that cumulative convictions
    require materially distinct elements and finding that other counts added no distinct element in these circumstances. Include
    the choice and its reasoning about overlap; exclude the underlying shelling’s operational details.
  span_range:
  - src:8c9c506ac414#p1.82
  - src:8c9c506ac414#p1.85
  decision: The Trial Chamber entered convictions only for attacks on civilians and destruction or wilful damage of cultural
    property, rather than recording convictions on all established counts.
  content_domain: other:judicial-adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
