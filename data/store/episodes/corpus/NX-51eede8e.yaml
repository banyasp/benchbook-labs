- n: 1
  focus: The decision point is whether to retain the sabotage mission or limit it to espionage; the stated reason for changing
    course was embassy protest. Exclude the agents’ subsequent activities and any details about how the clandestine work was
    conducted.
  span_range:
  - src:d274e84bc022#p13.6
  - src:d274e84bc022#p13.7
  decision: German intelligence leadership revised the agents’ mission from sabotage to espionage only after protests from
    the German embassy.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the choice of organizational home for communications intelligence, including intercept and
    direction-finding functions. The source gives technical, security, and budgetary reasons for placing it with communications;
    exclude descriptions of collection operations or techniques.
  span_range:
  - src:d274e84bc022#p21.9
  - src:d274e84bc022#p22.2
  decision: Naval authorities placed communications intelligence under the Office of Naval Communications rather than the
    Office of Naval Intelligence.
  content_domain: other:intelligence organization
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: After Brazilian police arrested agents and the U.S. embassy was involved, the Navy considered disclosure dangerous
    but agreed to provide evidence with caveats, limiting it to messages encoded in a superseded system and pausing further
    transmissions pending a releasability decision. Focus on the disclosure choice and the competing interests of supporting
    the investigation and protecting intelligence sources; exclude operational collection details.
  span_range:
  - src:d274e84bc022#p28.7
  - src:d274e84bc022#p29.2
  decision: The Navy decided to provide Brazilian authorities with limited decrypted evidence, subject to safeguards.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: After the Brazilian roundup raised concern about premature arrests and disclosure, the participants chose a general
    approval rule rather than allowing agencies to act unilaterally. Focus on the authority and source-protection rationale
    for requiring joint approval before closure, apprehension, or other action requiring disclosure; exclude the technical
    details of intercepting communications.
  span_range:
  - src:d274e84bc022#p29.3
  - src:d274e84bc022#p29.5
  decision: The interagency conference decided that action exposing clandestine-radio intercepts required joint Army and Navy
    approval.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: After concerns about duplicated effort and incomplete coordination, officials recommended ending cryptanalytic work
    in other agencies; the recommendation was approved and implemented, including the transfer or abolition of smaller units.
    Focus on the choice about which agencies would hold cryptanalytic responsibility and the coordination rationale; exclude
    operational cryptanalytic methods.
  span_range:
  - src:d274e84bc022#p29.6
  - src:d274e84bc022#p30.6
  decision: The President and the Bureau of the Budget centralized cryptanalysis in the Army, Navy, and FBI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: In February 1942, the Coast Guard changed dissemination practice after becoming concerned that some recipient agencies
    used verbatim intelligence too freely. Focus on the choice between verbatim dissemination and restricted, translated reporting,
    and the security interests involved; exclude the details of message collection or decryption.
  span_range:
  - src:d274e84bc022#p33.4
  - src:d274e84bc022#p33.6
  decision: The Coast Guard decided to stop distributing verbatim clandestine-message texts broadly, limiting them to the
    Navy and British liaison and sending others translations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: After the Coast Guard’s solutions raised security concerns, the services chose to withhold the sensitive messages
    from the FBI and have the Navy provide summaries that concealed the source. Focus on the interagency sharing decision
    and the security rationale, including the British concern; exclude cryptanalytic methods and operational details.
  span_range:
  - src:d274e84bc022#p35.3
  - src:d274e84bc022#p35.3
  decision: The Army and Navy decided not to provide the FBI verbatim intelligence derived from the Enigma system, using summarized
    reporting instead.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision was whether to proceed with the proposed arrangement or use the ambassador’s alternative, amid concerns
    about Colombian approval and sovereignty. Navy leadership approved the plan after arrangements established Colombian authority
    and responsibility and made U.S. operators temporary instructors; exclude the technical details of operating the equipment.
  span_range:
  - src:d274e84bc022#p40.4
  - src:d274e84bc022#p40.6
  decision: Navy leadership approved a conditional Colombia DF arrangement that preserved the proposed role for U.S. operators
    rather than adopting the ambassador’s alternative.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: Naval leadership chose to adhere to the agreements’ allocation of responsibility instead of assigning American operators
    to run the equipment alone. The stated reasons were to respect Ecuador’s rights and responsibilities and avoid encroachment;
    exclude any details about intercepting or locating transmissions.
  span_range:
  - src:d274e84bc022#p42.1
  - src:d274e84bc022#p42.2
  decision: Naval leadership required Ecuador to operate the DF equipment with Ecuadoran trainees rather than acceding to
    a request for operation solely by American naval personnel.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The choice was whether to continue the unit or suspend and disband it. The investigation found the American operators
    dangerously exposed and the Guayaquil reporting unreliable, although the investigator considered clandestine activity
    possible; the passage records a recommendation to disband and the subsequent suspension. Exclude operational details of
    DF or intercept work.
  span_range:
  - src:d274e84bc022#p42.5
  - src:d274e84bc022#p43.5
  decision: Navy leadership suspended its Ecuador DF operation after an investigation raised serious safety and intelligence-validity
    concerns.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The proposed liaison raised a security concern because the local company head was known as a Fascist, so the service
    lead intended to investigate before taking action. The text only conjectures that the network passed review; do not treat
    that inferred result as certain.
  span_range:
  - src:d274e84bc022#p58.5
  - src:d274e84bc022#p58.6
  decision: The monitoring-service lead chose to investigate the security of a proposed British-network liaison before acting
    on the request.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: In response to a question about rebuilding Cuba, the Navy official judged the network adequate and additional personnel
    or equipment unprofitable; Bogotá could close if Colombian personnel were unavailable, and Cuba need not be rebuilt. Treat
    these as linked sustainment and resource decisions, not as operational instructions for locating stations.
  span_range:
  - src:d274e84bc022#p60.3
  - src:d274e84bc022#p60.4
  decision: The assistant secretary of the Navy decided against expanding the regional network, would allow the Bogotá station
    to close if Colombia would not staff it, and saw no need to rebuild the Cuban station.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The Navy Department stated that it had no interest in continuation by Brazilian authorities and proposed referring
    the question to Treasury, which oversaw the Coast Guard. The decision concerns agency responsibility and whether the monitoring
    service should continue, not how it would operate.
  span_range:
  - src:d274e84bc022#p60.5
  - src:d274e84bc022#p60.8
  decision: The Navy Department declined to continue Brazilian monitoring itself and referred the continuation question to
    the Treasury Department because the Coast Guard might be interested.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is whether to analyze the traffic under the Enigma hypothesis or continue treating the cipher
    as unidentified. The source cites the German language, word separators, and reciprocal letter relationships as grounds
    for the hypothesis; exclude the subsequent cryptanalytic procedures.
  span_range:
  - src:d274e84bc022#p92.11
  - src:d274e84bc022#p93.5
  decision: Coast Guard cryptanalysts decided to treat the intercepted circuit as encrypted on an Enigma machine.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is whether to limit the machine hypothesis to the four machines known to the group or consider
    an otherwise unknown machine. The stated basis is that the group had employed only those four; exclude the described cryptanalytic
    testing methods.
  span_range:
