episodes:
- n: 1
  focus: The decision point is whether to adopt the Israeli estimate of Arab military superiority or stand by the CIA's contrary
    assessment. Focus on the analytic judgments and their stated basis; exclude the separate question of how intelligence
    channels were managed.
  span_range:
  - src:c05df3e76e1c#p6.1
  - src:c05df3e76e1c#p7.2
  decision: CIA analytic leadership rejects the Israeli intelligence estimate and issues its own judgment that Israel could
    defeat the Arab states and that the Soviet Union was unlikely to intervene.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The choice is whether to provide the requested kinds of additional support or withhold them in light of the intelligence
    assessment. Focus on the president's foreign-policy decision and its reliance on the assessment; exclude the underlying
    military forecast as a separate decision point.
  span_range:
  - src:c05df3e76e1c#p7.2
  - src:c05df3e76e1c#p7.3
  decision: The President decides not to airlift special military supplies to Israel or publicly support it during the crisis.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision is whether to respond to the Soviet message with a naval deployment or another course. The stated rationale
    was to signal American resolve without pushing the Soviets into a corner; exclude any operational details of the fleet's
    movement.
  span_range:
  - src:c05df3e76e1c#p9.3
  - src:c05df3e76e1c#p10.1
  decision: The President decides to dispatch the Sixth Fleet to the eastern Mediterranean after receiving a Soviet threat
    tied to Israel's advance.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
