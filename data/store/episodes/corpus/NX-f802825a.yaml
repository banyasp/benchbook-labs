  focus: The decision point is whether the President would leave the negotiations to the usual lower-level process or take
    a direct role, and whether the leaders would negotiate face-to-face or through intermediaries. The account says their
    relationship was so hostile that the President judged separation necessary; exclude the specific persuasive gestures except
    as context for the diplomatic objective.
  span_range:
  - src:d7e5f1d2486f#p2.3
  - src:d7e5f1d2486f#p2.4
  decision: The President chose to personally mediate the Camp David negotiations and keep the Israeli and Egyptian leaders
    separated, working through their delegations.
