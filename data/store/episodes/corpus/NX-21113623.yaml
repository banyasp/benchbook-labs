episodes:
- n: 1
  focus: The ranking minority member of the Senate intelligence committee rejected the offer to join a presidential inquiry
    and proceeded with plans for a separate congressional panel; the presidential commission’s chairman then proposed a hybrid
    commission as the alternative to parallel inquiries, and the senator agreed. The choice weighed duplication and waste
    against competing political interests in the inquiry’s composition and direction; Congress subsequently approved the joint
    commission.
  span_range:
  - src:6fd541b40133#p4.2
  - src:6fd541b40133#p5.3
  decision: The commission’s sponsors chose a joint presidential-congressional inquiry instead of two separate investigations.
  content_domain: other:commission-structure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: 'The staff director announced that oversight would be left to congressional intelligence committees, while the commission
    focused on improving intelligence gathering, analysis, and dissemination. Treat this as an initial scope decision, not
    a permanent exclusion: oversight returned to the commission’s agenda at a later commissioner’s insistence.'
  span_range:
  - src:6fd541b40133#p10.5
  - src:6fd541b40133#p10.5
  decision: The commission staff director initially excluded intelligence oversight from the inquiry’s scope.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The commissioners considered whether to disclose the aggregate figure and agreed to release it without additional
    budget details. The stated justification was that disclosure would enhance the commission’s credibility; do not infer
    a broader decision to declassify agency-level or program-level spending.
  span_range:
  - src:6fd541b40133#p23.4
  - src:6fd541b40133#p24.5
  decision: The commission chose to disclose the aggregate annual intelligence budget figure while withholding further budget
    details.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is how far to strengthen the DCI amid fragmentation in the Intelligence Community and the commission
    chair’s opposition to a dominant intelligence chief. The commission proposed deputies and a say in appointments subject
    to cabinet-secretary concurrence, while withholding final appointment and budget authority; exclude other recommendations
    in the report.
  span_range:
  - src:6fd541b40133#p26.4
  - src:6fd541b40133#p26.4
  decision: The commission chose a limited expansion of the DCI’s authority rather than giving the DCI final control over
    other agencies’ leadership or budgets.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to disclose the aggregate budget or keep it undisclosed, with oversight and the press’s
    demand for information noted as considerations. Exclude later budget announcements by agency officials, which are separate
    actions.
  span_range:
  - src:6fd541b40133#p27.2
  - src:6fd541b40133#p27.2
  decision: The commission chose to endorse public release of the aggregate intelligence budget figure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
