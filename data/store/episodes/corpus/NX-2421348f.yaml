- n: 1
  focus: The decision point is whether command responsibility, on the charge and facts presented, permits personal criminal
    liability for failing to take measures within the commander’s power to prevent atrocities. The majority finds the charge
    sufficient under the cited law-of-war duties; the dissent argues that applying ordinary command standards amid overwhelming
    attack would be unfair and unsupported by established law. Exclude the operational details of what measures the commander
    could have taken.
