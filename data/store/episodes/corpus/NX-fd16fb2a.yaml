  focus: The decision point is whether to continue the ISR mission or return to base. The report says the sustained temperature
    prompted checklist use and that the flight manual directed a return; the crew then notified the launch-and-recovery element
    and air traffic control of its intent to return. Exclude the later landing and emergency flight-control choices, which
    concern operational technique.
