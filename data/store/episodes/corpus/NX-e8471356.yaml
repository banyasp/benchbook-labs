episodes:
- n: 1
  focus: The decision point is whether to use force to preserve communist rule and Soviet influence or renounce intervention;
    the account says the foreign minister chose renunciation and explains the perceived risk that force could precipitate
    a violent collapse. Keep the focus on the policy choice and its rationale, not on any operational details of military
    action.
  span_range:
  - src:476cb5e2b206#p23.4
  - src:476cb5e2b206#p24.3
  decision: The Soviet foreign minister made renunciation of military intervention in Eastern Europe a centerpiece of Soviet
    foreign policy.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to wait amid uncertainty about the Soviet leader’s durability or pursue bilateral agreements
    while also seeking changes in Eastern Europe and German unification within NATO. The administration chose both tracks
    and urgency because it feared a successor might be less willing to offer concessions; exclude operational intelligence
    or military details.
  span_range:
  - src:476cb5e2b206#p26.6
  - src:476cb5e2b206#p26.6
  decision: The President’s foreign-policy team chose a two-track approach toward the Soviet Union and to pursue agreements
    quickly.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is the estimative judgment about whether the Soviet crisis would remain manageable or lead to
    escalating instability and loss of control. The majority judgment and CIA dissent, along with their stated reasoning,
    make this an analytic decision; exclude unrelated operational intelligence details.
  span_range:
  - src:476cb5e2b206#p25.3
  - src:476cb5e2b206#p26.4
  decision: The Intelligence Community’s estimators judged that continuation and intensification of the Soviet leadership’s
    course was most likely, while CIA analysts dissented toward a more pessimistic outlook.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is the U.S. president’s choice to support reunification, including the alliance question, rather
    than hold back or condition support. Keep the focus on the diplomatic choice and its stated importance to U.S. policy;
    exclude the Soviet leader’s separate decision to accept it, whose reasons are not sufficiently established here.
  span_range:
  - src:476cb5e2b206#p30.3
  - src:476cb5e2b206#p31.2
  decision: The U.S. president chose to back German reunification unequivocally and press for the Germans’ right to choose
    their own alliance.
  content_domain: other:diplomacy-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to insist on restrictions on the U.S. missile-defense program and avoid the specified
    Soviet reductions, or accept those terms to conclude the treaty. Keep the analysis at the level of arms-control policy
    and the stated opposition within the Soviet establishment; exclude technical details of weapons or treaty implementation.
  span_range:
  - src:476cb5e2b206#p45.4
  - src:476cb5e2b206#p45.4
  decision: The Soviet president and foreign minister chose to accept major concessions to secure the START agreement.
  content_domain: other:arms-control-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to retain the existing tactical nuclear deployments, planned missile deployments, and
    alert posture, or make the announced reductions and cancellations while Soviet political authority was at risk. Focus
    on the stated opportunity to reduce nuclear dangers and concern about weapons amid Soviet instability; exclude operational
    or technical implementation details.
  span_range:
  - src:476cb5e2b206#p45.3
  - src:476cb5e2b206#p46.2
  decision: The U.S. president chose unilateral nuclear-force reductions and changes to U.S. force posture in September 1991.
  content_domain: other:arms-control-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
