episodes:
- n: 1
  focus: The decision point is whether and how to consolidate CIA’s military analysis into a distinct organization rather
    than leave the work distributed or defer to DoD. Include the stated mission and the jurisdictional reason for the office’s
    name; exclude later organizational history.
  span_range:
  - src:55b1eee02d1b#p22.3
  - src:55b1eee02d1b#p22.3
  decision: The DCI approved creating OSR as a separate office for independent strategic military assessment, using a name
    intended to avoid directly challenging DIA and the military services’ intelligence prerogatives.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the response to CIA and Air Force disagreement over whether the SS-9 could carry MIRVs, amid
    competing judgments about Soviet intent and the implications for US policy. Include the order for an independent assessment
    and its stated rationale; exclude technical detail beyond what is needed to identify the analytic dispute.
  span_range:
  - src:55b1eee02d1b#p24.5
  - src:55b1eee02d1b#p25.2
  decision: The NSC adviser ordered an independent assessment of the disputed Soviet SS-9 judgment so the NSC staff could
    draw its own conclusions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is how to represent sharply conflicting assessments in a national estimate, including whether
    the DCI should express an independent view and whether the estimate should preserve competing judgments. Include the stated
    dispute over net assessment and the DCI’s national-interest rationale; exclude the underlying military analysis beyond
    that context.
  span_range:
  - src:55b1eee02d1b#p34.4
  - src:55b1eee02d1b#p34.4
  decision: The DCI backed CIA’s judgment in the 1979 Soviet strategic-capabilities estimate and allowed the 1980 estimate
    to present separate CIA/DCI and DoD judgments.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to accept a compromise or preserve the disputed CIA and Air Force assessments in the
    national estimate. The source gives the analytic basis for the disagreement and explains that the range avoided open disagreement
    in the main text; exclude the broader question of why the DCI permitted independent CIA analysis, which the source says
    is unknown.
  span_range:
  - src:55b1eee02d1b#p45.3
  - src:55b1eee02d1b#p46.2
  decision: ORR military analysts chose not to adopt the Air Force’s higher Soviet bomber production estimates; the 1957 NIE
    presented both estimates as a range.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision was whether to retain the existing branch organization or reorganize around offensive and defensive
    missile analysis. The stated rationale was to better meet the Pentagon’s need for weapons-system and military-mission
    analysis; exclude the operational details of missile analysis.
  span_range:
  - src:55b1eee02d1b#p57.2
  - src:55b1eee02d1b#p58.2
  decision: The DDI approved reorganizing OSI’s missile branches into offensive- and defensive-missile divisions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The decision was whether to establish a new division bringing together analysts from the Industrial Division and
    the Guided Missile Task Force or leave them in their existing units. The source links the proposal to the need for broader
    systems analysis; exclude the division’s internal staffing and branch-level implementation details.
  span_range:
  - src:55b1eee02d1b#p58.3
  - src:55b1eee02d1b#p58.3
  decision: The DDI approved creating a Military-Economic Division within ORR to consolidate military analysts and expand
    strategic military research.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is the CIA’s assessment, supported by the DCI, amid disagreement with the Air Force and DIA over
    the sites’ purpose. The stated reasons included the sites’ size and location, while later imagery strengthened—but did
    not conclusively settle—the air-defense assessment; exclude the technical details of imagery collection.
  span_range:
  - src:55b1eee02d1b#p65.4
  - src:55b1eee02d1b#p66.2
  decision: The DCI and CIA analysts judged that the Soviet Tallinn missile sites were primarily for air defense, not a robust
    ABM system.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision arose after DIA sought CIA’s costing data while developing an independent capability, and the DCI asked
    the Secretary of Defense to centralize the work in CIA. The agreement gave CIA primacy while requiring it to provide DoD
    with needed data; exclude technical details of the costing system.
  span_range:
  - src:55b1eee02d1b#p70.4
  - src:55b1eee02d1b#p71.2
  decision: The DCI and the Deputy Secretary of Defense agreed that CIA would have primary responsibility for studies of the
    cost and resource impact of foreign military and space programs.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision was whether to retain separate components or combine them into a single office; the stated rationale
    included the need for independent analysis for the President and more effective management of strategic military intelligence.
    The plan also sought to avoid disrupting Vietnam support, adding resources, or provoking the Pentagon; exclude operational
    intelligence activities described elsewhere in the passage.
  span_range:
  - src:55b1eee02d1b#p74.3
  - src:55b1eee02d1b#p76.2
  decision: The Deputy Director for Intelligence proposed, and the DCI approved, creating the Office of Strategic Research
    by combining existing military-analysis components.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision followed the administration’s dissatisfaction with the prior estimate and ONE’s resistance to a format
    that would provide detailed reasoning, alternatives, and differences of opinion. Keep the focus on the allocation of drafting
    and coordination authority and the goal of making estimates more useful to policymakers; exclude the substantive military
    judgments in the estimate.
  span_range:
  - src:55b1eee02d1b#p95.3
  - src:55b1eee02d1b#p96.3
  decision: The DCI gives the DDI, rather than ONE, drafting authority for the next Soviet strategic estimate while retaining
    ONE’s Community-coordination role.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: DIA challenged CIA’s estimates and methodology, and the DCI supported an external review amid concerns that the spending
    estimate was too low. The decision point is whether to subject CIA’s analytic methodology to outside expert scrutiny;
    exclude the panel’s later findings, which are not described here.
  span_range:
  - src:55b1eee02d1b#p112.5
  - src:55b1eee02d1b#p113.2
  decision: The DCI establishes an outside expert panel to review CIA’s methodology for estimating Soviet defense spending.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The DCI sought a focal point for broader strategic analysis, and a joint DI/DS&T study recommended creating the center
    in OSR. The decision point is the organizational choice to establish and locate the center; exclude the separate estimative
    judgments about Soviet intentions discussed nearby.
  span_range:
  - src:55b1eee02d1b#p114.4
  - src:55b1eee02d1b#p114.4
  decision: The DCI establishes a Strategic Evaluation Center within OSR to expand strategic military analysis with political,
    economic, and technical expertise.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The decision point is whether to retain the existing estimates office or replace it with regional and functional
    intelligence officers who would coordinate community-wide expertise. The stated rationale was to create a senior focal
    point on issues of national interest, strengthen direct DCI attention and produce assessments relevant to policymakers;
    exclude the later details of individual officers’ careers.
  span_range:
  - src:55b1eee02d1b#p122.5
  - src:55b1eee02d1b#p123.2
  decision: The DCI abolished the Office of National Estimates and replaced it with National Intelligence Officers reporting
    directly to him.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The decision point is whether to authorize parallel outside analysis after PFIAB members challenged recurring intelligence
    judgments, despite senior intelligence officials’ opposition to parallel estimates. The passage gives the context and
    describes the experiment’s design; exclude the technical substance of weapons assessments except as context for the analytic
    dispute.
  span_range:
  - src:55b1eee02d1b#p142.3
  - src:55b1eee02d1b#p142.5
  decision: The DCI approved an experiment in competitive analysis of Soviet strategic forces estimates.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The decision point is whether to retain earlier spending estimates or revise them after CIA-DIA debriefings and reassessment
    of prices paid for weapons. The passage explains the evidentiary basis and distinguishes the spending revision from a
    change in the estimated size or capability of Soviet forces; exclude operational intelligence-collection details.
  span_range:
  - src:55b1eee02d1b#p139.2
  - src:55b1eee02d1b#p139.4
  decision: CIA’s military-economic analysts revised their estimates of Soviet defense spending based on new information about
    ruble prices and procurement costs.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: 'The decision point is how to present an intelligence estimate when agencies hold sharply conflicting views and little
    hard evidence resolves the issue: state a conclusion or present the competing judgments without resolving them. The stated
    purpose was to help recipients understand the differing opinions; exclude speculation about which view was correct.'
  span_range:
  - src:55b1eee02d1b#p146.3
  - src:55b1eee02d1b#p146.4
  decision: The DCI released an estimate of Soviet strategic objectives with key judgments framed as questions rather than
    conclusions.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The decision point is whether to raise U.S. forces’ alert status after reports of Soviet airborne forces on alert
    and a Soviet threat of intervention, with the stated aim of signaling Moscow. The source gives the crisis context and
    rationale but does not describe legal authority or alternative force postures; exclude any operational procedures.
  span_range:
  - src:55b1eee02d1b#p122.3
  - src:55b1eee02d1b#p122.3
  decision: The Secretary of State and National Security Advisor placed U.S. military forces on alert as a signal to Moscow
    during the October 1973 crisis.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 18
  focus: The decision point is whether to include these comparisons despite DIA and military-service objections. Focus on
    the DCI’s stated view that the comparisons could inform national decisionmakers about relative-capability trends; exclude
    the underlying attack calculations.
  span_range:
  - src:55b1eee02d1b#p160.3
  - src:55b1eee02d1b#p161.4
  decision: The DCI chose to retain comparisons of residual US and Soviet strategic forces after hypothetical counterforce
    attacks in the 1978 estimate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 19
  focus: The decision point is whether to give the administration confidence in the treaty’s monitorability or withhold that
    assurance. The source cites a detailed assessment and the analysts’ ability to assemble evidence; exclude the technical
    collection methods and site arrangements discussed elsewhere in the passage.
  span_range:
  - src:55b1eee02d1b#p175.4
  - src:55b1eee02d1b#p175.4
  decision: The DCI chose to assure the administration that intelligence capabilities were sufficient to monitor SALT II compliance
    and support ratification.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 20
  focus: The decision point is the organizational allocation of analytic offices and the broadcast information service between
    the two directorates. The stated considerations were concentrating analytic production and providing the service with
    technical collection support; exclude broader organizational history not tied to this choice.
  span_range:
  - src:55b1eee02d1b#p151.3
  - src:55b1eee02d1b#p151.3
  decision: The DDCI chose to move the scientific and weapons analysis offices into the analytic directorate while transferring
    the broadcast information service to the technical directorate.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 21
  focus: The decision was whether to keep this analysis in the intelligence estimate or leave such net assessments to DoD.
    The DCI argued it was important to policymakers who viewed mutual residual destruction as central to deterrence; exclude
    the operational details of nuclear forces and focus on analytic scope and institutional roles.
  span_range:
  - src:55b1eee02d1b#p179.2
  - src:55b1eee02d1b#p179.2
  decision: The DCI retained quasi-dynamic residual-force analysis in the 1979 Soviet strategic NIE despite DIA and the military
    services urging its removal.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 22
  focus: The choice was between a Soviet center combining political, economic, and military analysts and reorganizing the
    Directorate for Intelligence into regional offices. The account gives the customer-facing rationale for the regional structure
    and records concerns about removing analysts from functional offices and creating coordination problems; exclude the organizational
    chart details.
  span_range:
  - src:55b1eee02d1b#p197.4
  - src:55b1eee02d1b#p198.3
  decision: The DCI approved the D/NFAC’s regional reorganization of analytic offices instead of establishing a separate Soviet
    analysis center.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 23
  focus: The choice was whether intelligence would continue producing net-force comparisons or leave them to DoD. The text
    links the decision to the Pentagon’s recurring objections that such assessments could mislead about strategic balance
    and were not a proper intelligence function; exclude the underlying force comparisons.
  span_range:
  - src:55b1eee02d1b#p179.2
  - src:55b1eee02d1b#p196.3
  decision: The DCI agreed that future net-force Soviet/US assessments would be left to DoD after renewed Pentagon objections
    to an intelligence estimate’s net assessment.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
