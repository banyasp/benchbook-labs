- n: 1
  focus: The decision point is whether to proceed with withdrawal without an accord or delay, given Moscow’s preference for
    Geneva cover but its concern that an agreement could restrict aid and further undermine the Kabul regime’s legitimacy.
    The estimate cites the war’s costs to Soviet domestic and foreign policy and pessimism about the client regime’s prospects;
    it predicts heavier fighting if withdrawal proceeds without the draft accord’s constraints. Exclude operational details
    of troop movements or fighting.
  span_range:
  - src:560a281e8174#p6.3
  - src:560a281e8174#p6.4
  decision: The Soviet leadership decides to begin withdrawing from Afghanistan in 1988 even if the Geneva talks deadlock,
    rather than make withdrawal contingent on an agreement.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: 'The estimate describes a shift toward political approaches and gives the leadership’s reasons: earlier military
    policies prompted counterproductive Western responses, while the benefits of relations with the European Community were
    judged to outweigh risks to Warsaw Pact cohesion. Keep the focus on this strategic policy choice; exclude the planned
    visit and other diplomatic activity as implementation details.'
  span_range:
  - src:560a281e8174#p31.15
  - src:560a281e8174#p31.18
  decision: The Soviet leadership chooses whether to pursue relations with Western Europe through political initiatives rather
    than military intimidation.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The estimate says Moscow almost certainly accepts current alignments because NATO is seen as contributing to stability,
    managing the German question, inhibiting an independent European military organization, and influencing the United States;
    changing the division of Europe also risks instability in Eastern Europe. Treat this as a strategic policy choice, and
    exclude broader objectives that are not part of this specific decision.
  span_range:
  - src:560a281e8174#p32.3
  - src:560a281e8174#p32.3
  decision: The Soviet leadership decides whether to accept Europe’s existing alliance alignments for the foreseeable future
    or pursue steps to end the political division of Europe and decouple the United States from Western Europe.
  content_domain: other:foreign-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The memorandum describes unilateral reductions and reciprocal proposals, and assesses motivations including nuclear
    security, removing warheads located outside Russia, and establishing credibility as a negotiating partner; it also says
    conventional improvements made reductions less costly to military capability. Keep the scenario at the arms-control policy
    level, excluding technical details of warhead dismantlement or storage.
  span_range:
  - src:560a281e8174#p48.4
  - src:560a281e8174#p50.3
  decision: The Soviet president decides whether to reduce tactical nuclear warheads unilaterally and propose reciprocal reductions,
    rather than retain the existing inventory.
  content_domain: other:arms-control
