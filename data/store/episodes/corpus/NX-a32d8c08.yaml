episodes:
- n: 1
  focus: The decision point is whether to proceed with an indigenous satellite program or leave Japan without that capability;
    the LDP and government chose to proceed, approving a four-satellite program. The document cites security concerns about
    North Korean launches and potential benefits for disaster assessment and coastal monitoring; exclude contractor-selection
    details and technical design.
  span_range:
  - src:c078fbb6a307#p5.2
  - src:c078fbb6a307#p6.4
  decision: Japanese political leaders and the government decide to establish a national reconnaissance-satellite program
    after North Korea’s 1998 missile launch.
  content_domain: other:intelligence policy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: 'The decision point is how to assess competing accounts of the explosion’s damage: North Korea’s public account versus
    the assessment based on imagery and independent review. Policymakers, including the prime minister, judged the damage
    less extensive and concluded that North Korea exaggerated it to seek international aid; exclude any discussion of imagery
    collection methods.'
  span_range:
  - src:c078fbb6a307#p8.4
  - src:c078fbb6a307#p8.6
  decision: Japanese policymakers decide that North Korea overstated the damage from the 2004 Ryongchon explosion.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to retain the prior, contested interpretation of the peaceful-use policy or establish
    explicit statutory authority for national-security uses of space. The Diet enacted the law after broad bipartisan support;
    the text cites legal uncertainty and the value of enabling national-security systems. Exclude later operational or technical
    satellite development choices.
  span_range:
  - src:c078fbb6a307#p12.7
  - src:c078fbb6a307#p13.7
  decision: Japan’s Diet decides to enact the Space Basic Law, expressly permitting space-based systems for national security
    purposes.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
