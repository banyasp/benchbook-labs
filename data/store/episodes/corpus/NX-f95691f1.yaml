episodes:
- n: 1
  focus: The Senate moved from limited oversight to formal confirmation and added SSCI jurisdiction alongside SASC. The source
    connects this change to NSA’s increased public visibility after the Snowden disclosures and the rise of cyber intrusions;
    exclude the later details of individual nominees’ confirmation procedures.
  span_range:
  - src:40f71fe0d774#p6.1
  - src:40f71fe0d774#p8.1
  decision: The Senate decides to require formal advice-and-consent confirmation of NSA directors and review by both SASC
    and SSCI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: Asked what he would do if asked to avoid court approval based on a secret legal analysis, the nominee said he would
    follow the law and ensure the Agency did too. Treat this as a stated commitment about legal authority and oversight, not
    as a decision to conduct surveillance or as a description of surveillance methods.
  span_range:
  - src:40f71fe0d774#p18.2
  - src:40f71fe0d774#p18.3
  decision: The NSA director nominee decides how to respond to a hypothetical request to bypass FISA Court approval.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: In response to a senator’s hold and request for a categorical commitment, the nominee instead pledged to adhere to
    Fourth Amendment requirements and FISC-approved procedures, including statutory requirements. The decision point is the
    scope of the nominee’s commitment to legal safeguards; exclude operational details about querying or accessing data.
  span_range:
  - src:40f71fe0d774#p21.2
  - src:40f71fe0d774#p22.1
  decision: The NSA director nominee decides whether to promise a categorical end to warrantless queries of U.S.-person data
    or commit to compliance with governing law and procedures.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
