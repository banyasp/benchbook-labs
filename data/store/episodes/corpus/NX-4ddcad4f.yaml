episodes:
- n: 1
  focus: The decision point is whether the president receives the briefing from the agency head or from working-level analysts.
    The source gives reasons including direct discussion of the analysis, access to intelligence without another official’s
    interpretation, and supporting analyst morale; exclude operational intelligence methods.
  span_range:
  - src:aea134c9128c#p15.2
  - src:aea134c9128c#p16.7
  decision: The president in the first Bush administration chose working-level CIA officers rather than the DCI to deliver
    his briefings.
  content_domain: other:intelligence-policy process
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to circulate and leave the PDB with senior officials or limit access and retrieve it.
    The source explains the choice as protecting sensitive material and sustaining intelligence producers’ confidence that
    they could provide frank assessments; exclude technical details about sources or methods.
  span_range:
  - src:aea134c9128c#p16.8
  - src:aea134c9128c#p16.13
  decision: The president in the first Bush administration restricted PDB access and required briefers to retrieve copies
    after reading.
  content_domain: other:intelligence dissemination
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether deep-dive discussions remain between the president and intelligence briefers or include
    relevant policy principals. The source says officials were concerned that policy discussions were occurring without those
    principals, and reports that scheduling and broader attendance followed; exclude any operational subject matter of the
    briefings.
  span_range:
  - src:aea134c9128c#p8.6
  - src:aea134c9128c#p9.1
  decision: The Bush administration’s chief of staff and senior officials decided to schedule deep-dive briefings and include
    relevant cabinet-level policy officials.
  content_domain: other:intelligence-policy process
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to retain the usual briefing format or add sessions where the president could engage
    directly with analysts and relevant policy principals. The passage gives the president’s initial skepticism, his agreement
    to try the approach, and reasons for broadening the discussion; exclude the later general proposals about intelligence
    products and formats.
  span_range:
  - src:aea134c9128c#p28.3
  - src:aea134c9128c#p28.8
  decision: The president adopted deep-dive intelligence briefings, with senior policy officials participating.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
