  focus: The decision is whether to pursue arrests across the laundering chain, including smaller and medium-sized actors,
    or to disrupt laundering selectively to induce a cartel representative to travel and advance the broader consolidation
    strategy. The stated rationale is that narcotics demand will continue and a single dominant cartel is expected to reduce
    cross-border violence; exclude the operational details of carrying out the plan.
