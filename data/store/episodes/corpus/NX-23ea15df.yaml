- n: 1
  focus: The decision point is whether to advance toward talks despite uncertainty about Kesselring’s cooperation, rather
    than wait for firmer assurances. The stated rationale is the possible opportunity to shorten the war, secure North Italy,
    and prevent further destruction; exclude the proposed meeting’s covert logistics and communications arrangements.
  span_range:
  - src:e13a9379f369#p10.4
  - src:e13a9379f369#p11.6
  decision: AFHQ decides to proceed with exploratory surrender talks with German representatives in North Italy.
  content_domain: other:allied surrender diplomacy
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to continue or break off the surrender contact. The stated reasons were the assessment
    that the German commander in Italy did not intend to surrender on acceptable terms and complications with the Soviet Union;
    exclude later developments and the operational means of communicating the order.
  span_range:
  - src:e13a9379f369#p22.2
  - src:e13a9379f369#p22.4
  decision: The Joint Chiefs of Staff, following a decision by the U.S. and British governments, decide to terminate contact
    with the German emissaries.
  content_domain: other:allied surrender diplomacy
  refusal_sensitivity: medium
