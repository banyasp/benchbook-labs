episodes:
- n: 1
  focus: The President weighed the nominee’s experience, integrity, and personal trust against concerns that his Republican
    Party background and political ambitions could compromise the agency’s independence and make confirmation contentious.
    Keep the focus on the appointment and its institutional implications; exclude biographical details that do not bear on
    that choice.
  span_range:
  - src:42c992b942d5#p3.10
  - src:42c992b942d5#p5.1
  decision: The President decides to nominate the Beijing envoy to replace the outgoing CIA director.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The nominee considered accepting or declining a role that could end his political future, complicate relations with
    China, and place him in a troubled agency during contentious congressional inquiries. He accepted because he understood
    the offer as a call to serve the country and the President; exclude later confirmation disputes and operational matters.
  span_range:
  - src:42c992b942d5#p4.3
  - src:42c992b942d5#p4.5
  decision: The nominee decides whether to accept the offer to become CIA director.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The director-designate rejected a proposed political safeguard requiring him to surrender a possible future candidacy,
    while stating that he was not seeking the vice-presidential slot and would not campaign while serving as director. The
    issue was whether impartial service required a categorical pledge or whether confirmation should not condition a legitimate
    future call to public service; exclude the Senate’s eventual vote and the President’s later separate pledge.
  span_range:
  - src:42c992b942d5#p7.3
  - src:42c992b942d5#p7.9
  decision: The CIA director-designate decides whether to renounce any possible vice-presidential candidacy as a condition
    of confirmation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: After the Senate committee deadlocked and aides anticipated a narrow confirmation, the President reversed course
    and made the pledge to reduce the risk of a confirmation setback during the campaign year. Treat this as a distinct decision
    from the original nomination; exclude speculation about the nominee’s ultimate political future.
  span_range:
  - src:42c992b942d5#p8.9
  - src:42c992b942d5#p8.11
  decision: The President decides to pledge that he will not consider the CIA director-designate as his vice-presidential
    running mate.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
