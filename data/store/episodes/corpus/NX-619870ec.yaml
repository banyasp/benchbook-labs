episodes:
- n: 1
  focus: The decision point is whether to exchange sensitive COMINT information with Britain or withhold it; the Army cited
    potential access to intelligence unavailable from U.S. resources and benefits to U.S. security, while the Navy objected
    to disclosure without reciprocal value. Keep the scenario focused on alliance-sharing policy and the competing security
    interests; exclude cryptographic or other technical details.
  span_range:
  - src:7e96cbc1330c#p28.1
  - src:7e96cbc1330c#p30.2
  decision: The Army Chief of Staff approves a broad COMINT exchange with Britain, including U.S. information on foreign code
    and cipher systems, despite Navy reservations.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to cooperate while Yardley remained or make his discharge a condition of cooperation;
    the head of GC&CS chose the latter. The passage identifies Yardley as discredited but gives no further explanation of
    that assessment; exclude technical cryptanalytic activity.
  span_range:
  - src:7e96cbc1330c#p33.1
  - src:7e96cbc1330c#p33.1
  decision: The head of GC&CS conditioned cooperation with the developing Canadian counterpart organization on its discharging
    the American cryptanalyst Yardley.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The vice chief chose exclusive naval-communications control over a divided authority arrangement after the Redman
    brothers and ONI leadership could not agree on how COMINT should be directed. Keep the focus on authority and the retained
    evaluation function; exclude the broader organizational history.
  span_range:
  - src:7e96cbc1330c#p57.1
  - src:7e96cbc1330c#p57.1
  decision: The vice chief of naval operations places COMINT policy entirely under naval communications, ending ONI’s control
    over policy while retaining ONI’s evaluative role.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The officials weighed taking action against stations against preserving COMINT, with an exception for an immediate
    threat to shipping and an approval requirement. Keep the focus on the policy governing seizure and authorization; exclude
    any operational details about locating or exploiting stations.
  span_range:
  - src:7e96cbc1330c#p58.3
  - src:7e96cbc1330c#p58.3
  decision: War and Navy department officials agree that exploited enemy clandestine radio stations should not be seized absent
    an immediate threat to shipping, and require departmental approval for seizure.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The president chose to end specified agencies’ cryptanalytic units rather than retain them, relying on the Joint
    Chiefs’ view that the three named agencies could process current intercepted material. Keep the focus on the institutional
    boundary and presidential direction; exclude technical cryptanalysis and interception details.
  span_range:
  - src:7e96cbc1330c#p63.2
  - src:7e96cbc1330c#p64.1
  decision: The president directs the budget director to discontinue cryptanalytic units in the Censorship Office, FCC, and
    OSS, following the Joint Chiefs’ recommendation to limit processing to the Army, Navy, and FBI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: 'The decision followed a review of naval COMINT leadership: the DNC argued that technical control belonged with communications
    specialists and criticized the incumbent’s administrative and communications qualifications. Keep the focus on the command
    appointment and the competing expertise rationale; exclude the operational techniques mentioned as background.'
  span_range:
  - src:7e96cbc1330c#p75.1
  - src:7e96cbc1330c#p75.2
  decision: Navy communications leadership replaces the FRUPAC commander, concluding that the command should be led by someone
    with communications expertise rather than retained under the existing arrangement.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether the local COMINT unit could communicate directly with Washington or had to route messages
    through the theater commander. The source says the commander found the existing bypass intolerable; exclude the mechanics
    of the private cipher system and focus on authority and command oversight.
  span_range:
  - src:7e96cbc1330c#p76.3
  - src:7e96cbc1330c#p76.3
  decision: The CINCPAC commander required FRUPAC communications to OP-20-G or the DNC to be cleared through him.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is whether COMINT evaluation would remain distributed among Navy intelligence units or be consolidated
    in a new COMINCH division. The source links the choice to a management study recommending unified COMINT evaluation; exclude
    the division’s subsequent operational duties and organization except as needed to identify the decision.
  span_range:
  - src:7e96cbc1330c#p87.3
  - src:7e96cbc1330c#p87.5
  decision: The COMINCH commander decided to establish a Combat Intelligence Division and direct Navy Department-level COMINT
    to that division rather than ONI.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 9
  focus: The decision point is how MIS should rank competing traffic priorities, including the prior emphasis on German traffic
    and the increased emphasis on Japan. The source gives the stated strategic rationale and the Pacific coordination context;
    exclude technical details about the systems or methods used to process traffic.
  span_range:
  - src:7e96cbc1330c#p93.1
  - src:7e96cbc1330c#p93.2
  decision: The MIS set revised Army COMINT priorities that placed Japanese Army and selected diplomatic traffic in the top
    group while assigning German military traffic a lower priority.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 10
  focus: The decision point is whether FRUMEL would exchange intelligence with CBB or continue separately. The source attributes
    reasons to the FRUMEL commander, including doubts about CBB’s capabilities, security, and relevance to naval work, while
    also presenting CBB’s contrary account; preserve that disagreement and exclude technical details of the intelligence involved.
  span_range:
  - src:7e96cbc1330c#p97.4
  - src:7e96cbc1330c#p98.2
  decision: The FRUMEL commander declined reciprocal COMINT cooperation with Central Bureau Brisbane.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 11
  focus: The parties faced a dispute over U.S. participation in ENIGMA and related intelligence, including whether the United
    States could build technical competence and receive intelligence while the British retained primary responsibility for
    some systems. U.S. officials argued that severing relations was not viable and sought a foothold, reciprocal exchange,
    and improved joint coverage; the resulting agreement divided responsibilities and provided for exchanges and U.S. participation
    in the United Kingdom. Exclude operational details of cryptanalysis and dissemination procedures.
  span_range:
  - src:7e96cbc1330c#p117.1
  - src:7e96cbc1330c#p119.7
  decision: U.S. and British COMINT officials adopt a negotiated cooperation agreement rather than severing exchanges or accepting
    the British proposal unchanged.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 12
  focus: The decision weighs the Joint Chiefs’ concerns about security, military control, and resource demands against the
    Division’s value to civilian agencies. Focus on the authority and institutional balance behind retaining it; exclude descriptions
    of the Division’s intercept and direction-finding work.
  span_range:
  - src:7e96cbc1330c#p132.4
  - src:7e96cbc1330c#p133.1
  decision: The president decides to retain the FCC Radio Intelligence Division rather than disestablish or transfer it to
    the Army.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The decision reverses the Navy’s tentative nondissemination policy and provides the FBI summaries without verbatim
    intercepts or source disclosure. Focus on the agencies’ competing sharing and security interests; exclude technical details
    of interception or cryptanalysis.
  span_range:
  - src:7e96cbc1330c#p135.2
  - src:7e96cbc1330c#p136.2
  decision: Navy and Army intelligence leadership agree to resume sharing Western Hemisphere clandestine COMINT summaries
    with the FBI under the existing agreement.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: The agreement responds to the Army’s withholding of Japanese army material pending reciprocity and adopts the Navy’s
    proposal for exchanged liaison officers and file access. Focus on the sharing rules and the producing service’s continued
    control over handling and use; exclude operational details of COMINT exploitation.
  span_range:
  - src:7e96cbc1330c#p142.3
  - src:7e96cbc1330c#p143.2
  decision: The Army and Navy chiefs approve a reciprocal Japanese COMINT arrangement based on liaison officers’ access to
    each service’s files.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: The choice was whether to formalize the successful but unofficial ANCICC or leave coordination informal while the
    services addressed their organizational differences. The proposal cited the benefits of centralizing control and coordination;
    Army officials raised concerns about the Army’s decentralized structure before the board was approved. Exclude operational
    COMINT methods.
  span_range:
  - src:7e96cbc1330c#p146.1
  - src:7e96cbc1330c#p147.1
  decision: The Army chief of staff and the Navy commander-in-chief establish ANCIB as a permanent Army-Navy COMINT policy
    and coordination board.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 16
  focus: The decision resolved a dispute over whether Army COMINT should be controlled by intelligence or signal authorities,
    including proposals for unified control, no change, and divided responsibilities. The resulting order split operational
    control from administration and training, with G-2 also given specified personnel and liaison authority. Exclude the COMINT
    activities themselves.
  span_range:
  - src:7e96cbc1330c#p154.1
  - src:7e96cbc1330c#p157.4
  decision: The deputy chief of staff orders operational control of the SSA and Second Signal Service transferred to the Army
    G-2, while leaving their administration and training with the Chief Signal Officer.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 17
  focus: The choice was whether to implement worldwide centralization immediately or retain AFPAC’s existing structure during
    the decisive operations. The decision followed the theater commander’s objections to distant control and concerns about
    disruption and timely intelligence; the Army G-2 still favored centralization later. Exclude the technical details of
    intercepting or transmitting intelligence.
  span_range:
  - src:7e96cbc1330c#p162.3
  - src:7e96cbc1330c#p163.2
  decision: The Army G-2 decides to defer incorporating AFPAC COMINT units into centralized Army control until decisive Pacific
    operations are complete, preserving their existing operational structure in the meantime.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
