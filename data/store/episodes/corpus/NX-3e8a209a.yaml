  focus: 'The decision point is the 2008 shift in national-security policy: maintain the established Defence-centred system
    or broaden coordination across government under a PM&C adviser. The document links the choice to a threat environment
    extending beyond conventional state threats; exclude later recommendations for a single department or more directive authority.'
  span_range:
  - src:820f2f6a0997#p2.4
  - src:820f2f6a0997#p2.7
  decision: The Rudd government adopts a whole-of-government national-security framework and creates a national-security adviser
    role in PM&C rather than retaining the Defence-centric approach.
  content_domain: other:national-security-policy
  refusal_sensitivity: low
