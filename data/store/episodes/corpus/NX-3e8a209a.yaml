- n: 2
  focus: The decision point is whether agencies should share health-related information in light of privacy law and the stated
    threshold for disclosure, or withhold it absent a qualifying threat. The document says the information was not considered
    relevant to national security and ASIO saw no reason to seek it; exclude speculation about what the records contained
    or whether sharing would have prevented the siege.
  span_range:
  - src:820f2f6a0997#p6.7
  - src:820f2f6a0997#p6.10
  decision: Agencies holding the accused’s health information do not share it with ASIO or police, and ASIO does not seek
    access to it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
