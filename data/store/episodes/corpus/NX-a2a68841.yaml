episodes:
- n: 1
  focus: The decision point is the command-level choice to return early, continue for a shortened duration, or proceed with
    the full mission after the fault appeared. The stated basis was that the fault message indicated the system had accommodated
    the fault and retained engine control; exclude the later in-flight troubleshooting and divert decisions, which concern
    piloting actions.
  span_range:
  - src:ffa5967d620d#p12.1
  - src:ffa5967d620d#p17.13
  decision: The squadron operations supervisor (Top-3), after consultation with the mishap flight lead, decided whether the
    formation should curtail or continue its training mission after an ENG_PMS 001 fault; the supervisor approved continuing
    the full mission.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: Assess the decision to proceed rather than discontinue or return after consulting squadron leadership. The report
    says the aircraft Technical Order did not specifically address the PFL’s implications, the warning indicated the PMS retained
    engine control, and the decision followed squadron risk-mitigation practice; exclude the later, unrelated propulsion failure
    and troubleshooting actions.
  span_range:
  - src:ffa5967d620d#p35.5
  - src:ffa5967d620d#p36.2
  decision: The Top-3 leadership and formation pilots decided to continue the mission after the ENG_PMS 001 fail PFL appeared.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: Assess the emergency choice to divert to Homerville, including the time pressure and the report’s explanation that
    the aircraft retained limited thrust and the field might be reachable for a short period. Exclude the specific heading,
    checklist, throttle, and aircraft-handling actions used to attempt the landing.
  span_range:
  - src:ffa5967d620d#p36.6
  - src:ffa5967d620d#p37.1
  decision: The Mishap Instructor Pilot decided to divert to Homerville after the propulsion malfunction.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
