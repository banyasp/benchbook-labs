- n: 1
  focus: The planned solo sortie was precluded by the simultaneous-instruments weather status, and the instructor originally
    scheduled as a contingency was unavailable; the Flight Commander asked the MIP, who accepted. Frame the choice as whether
    to use the available instructor for the sortie or not to proceed as planned. Exclude sortie maneuvers and any assessment
    of fatigue, which the passage does not identify as a reason for this decision.
  span_range:
  - src:ca9146fc89a2#p22.2
  - src:ca9146fc89a2#p22.2
  decision: The MSP’s Flight Commander asks the MIP to serve as the instructor contingency for the student’s planned solo
    sortie.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to retain the existing flying status or change it after the weather improved. Focus
    on the SOF’s weather-based judgment; exclude flight procedures and the mishap itself.
  span_range:
  - src:ca9146fc89a2#p37.3
  - src:ca9146fc89a2#p37.3
  decision: The Sheppard AFB Supervisor of Flying changed T-6 flying status from “Simultaneous Instruments” to “Unrestricted”
    on 13 May 2024.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether the MIP would accept the additional sortie or decline it, given the staffing and weather
    situation. The report states the original instructor was unavailable and the weather did not support the student flying
    solo; exclude judgments about the mishap’s technical causes.
  span_range:
  - src:ca9146fc89a2#p42.5
  - src:ca9146fc89a2#p42.6
  decision: The MIP accepted the MSP flight commander’s request to fly a second sortie that afternoon.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 4
  focus: The decision point is whether to authorize the formation flight after checking the crew’s plan, risk-management entry,
