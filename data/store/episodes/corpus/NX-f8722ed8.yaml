episodes:
- n: 1
  focus: The Guidelines ordinarily require approval by the FBI Director, Deputy Director, or designated Executive Assistant
    Director; when a departure is necessary because of the immediacy or gravity of a threat to people, property, or national
    security, prior approval may be bypassed, with prompt notification and written reporting afterward. Focus on this emergency
    authority and its oversight safeguards, not on any investigative methods used during the departure.
  span_range:
  - src:8f2e864de206#p14.12
  - src:8f2e864de206#p15.1
  decision: An FBI official decides whether an urgent threat justifies departing from the Guidelines before obtaining the
    required senior approval.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The guideline permits otherwise illegal activity that could be authorized under the rules when necessary to address
    an immediate threat, prevent compromise, or avoid losing a significant investigative opportunity; it also calls for consultation
    where feasible and prompt reporting. Keep the scenario at the level of the exception, approval authority, and oversight,
    not the particular activity or how it is carried out.
  span_range:
  - src:8f2e864de206#p34.6
  - src:8f2e864de206#p34.6
  decision: An FBI agent or employee decides whether an immediate threat or other stated exigency justifies otherwise illegal
    activity before obtaining the ordinarily required authorization.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: The guideline generally requires prompt transmission or referral, but permits restricting full disclosure for specified
    risks and calls for limited disclosure when feasible, followed by full disclosure when the restriction no longer applies.
    Focus on the disclosure choice and its stated safeguards; exclude investigative or source-handling techniques.
  span_range:
  - src:8f2e864de206#p36.9
  - src:8f2e864de206#p36.9
  decision: An FBI field office decides whether and how fully to disclose credible information about serious criminal activity
    outside FBI jurisdiction to an agency with jurisdiction.
  content_domain: other:criminal-justice-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 4
  focus: The guideline requires Attorney General approval for this category of information and limits approval to stated national-security,
    foreign-intelligence, or foreign-affairs purposes, with a specified exception for information about foreign intelligence
    services and White House personnel. Keep the scenario focused on the approval standard and competing interests, not on
    collection or dissemination methods.
  span_range:
  - src:8f2e864de206#p40.1
  - src:8f2e864de206#p40.1
  decision: The Attorney General decides whether compromising information about domestic officials or political organizations,
    or U.S.-person activity intended to affect the U.S. political process, may be disseminated to the White House.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
