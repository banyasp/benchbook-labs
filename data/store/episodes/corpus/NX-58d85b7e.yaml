- n: 1
  focus: The decision point is whether to act on the brothers’ accusations or retain the leaders pending further assessment.
    The source says the leader was convinced by the accusations and recommended expulsion; exclude the agents’ methods of
    spreading those accusations.
  span_range:
  - src:548c5979869a#p14.1
  - src:548c5979869a#p14.1
  decision: The opposition movement’s leader recommends expelling two German leaders after receiving accusations of sabotage
    and disloyalty.
  content_domain: other:organizational discipline
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to end contact and restrict access or continue the relationship and provide information.
    The source reports continued correspondence and the sharing of names and addresses after warnings, with the applicant’s
    explanations apparently reassuring the leader; exclude details of communications or covert methods.
  span_range:
  - src:548c5979869a#p18.2
  - src:548c5979869a#p19.2
  decision: The opposition movement’s leader continues corresponding with a suspected applicant and shares movement information
    despite warnings about his loyalty.
  content_domain: security-clearance
  refusal_sensitivity: medium
  held_out: false
  natsec: false
- n: 3
  focus: The decision followed an investigation whose findings the leader accepted as showing that the accusers were acting
    against the movement. The source says he was convinced the French group was working with the movement’s enemies; exclude
    the underlying covert activity and focus on his organizational judgment and the resulting split.
  span_range:
  - src:548c5979869a#p26.4
  - src:548c5979869a#p27.1
  decision: The movement leader chose to end contact with the persistent accuser and her French allies, while accepting the
    two intermediaries’ account of the accusations.
  content_domain: other:organizational-governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: They declined despite requests to give the judge what they knew, saying that involvement with police examiners could
    lead to their expulsion because their association with the movement had been clandestine. Focus on the choice to cooperate
    with a legal inquiry or refuse, not on any covert methods.
  span_range:
  - src:548c5979869a#p34.3
  - src:548c5979869a#p35.1
  decision: The two Paris movement intermediaries chose not to provide statements to the investigating judge about the hospitalization.
  content_domain: other:legal-process
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The source describes concerns about the follower’s finances, behavior, and unexplained departure and return, as well
    as an aide’s recommendation to investigate. It attributes the decision not to act to the leader’s obstinacy and resistance
    to others’ advice; focus on the vetting judgment, not on investigative methods.
  span_range:
  - src:548c5979869a#p44.2
  - src:548c5979869a#p45.1
  decision: The exile leader chose to continue accepting a new follower and oppose a recommendation to investigate his loyalty,
    despite his own suspicions.
  content_domain: other:personnel-security
  refusal_sensitivity: medium
  held_out: false
  natsec: false
