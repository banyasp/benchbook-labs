  focus: In February 1967, CIA chose coordinated interagency analysis over continuing with scattered, largely unverified information
    and an overly broad use of “Viet Cong.” The stated reasons include difficulty understanding events, gaps in knowledge
    about North Vietnamese intelligence structures, and counterintelligence resources being diverted to tactical requirements.
    Exclude the task forces’ field use and any operational collection or targeting decisions.
