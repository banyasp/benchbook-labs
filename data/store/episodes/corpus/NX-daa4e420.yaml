episodes:
- n: 1
  focus: The decision point is whether to rely on one research design or use several complementary approaches. The authors
    cite breadth of ideas, reduced risk of bias, thoroughness, and continuity if one team’s work faltered; exclude the specific
    research techniques used by the student teams.
  span_range:
  - src:c2018cfe02f6#p4.2
  - src:c2018cfe02f6#p4.4
  decision: The CSU project leaders chose to use multiple research approaches rather than a single approach for the transit-country
    challenge.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to retain the challenge’s term or use a broader analytic concept. The professor judged
    that “transit country” implied too small a subset and was too narrow to capture the phenomenon; exclude any operational
    meaning of the term or the student teams’ subsequent research methods.
  span_range:
  - src:c2018cfe02f6#p3.4
  - src:c2018cfe02f6#p3.8
  decision: The Tracking Terrorism professor chose to replace the narrow term “transit country” with “terrorist node of operation”
    for the class’s analysis.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to rely on deficient quantitative indicators or substitute qualitative proxies while
    retaining high-quality quantitative data when available. The reason was that student teams found many metrics corrupted
    or unreliable; exclude the particular proxy examples and any methods for gathering information.
  span_range:
  - src:c2018cfe02f6#p5.3
  - src:c2018cfe02f6#p5.6
  decision: The project leadership chose to use qualitative proxies when quantitative open-source measures were poor, incomplete,
    or unreliable.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
