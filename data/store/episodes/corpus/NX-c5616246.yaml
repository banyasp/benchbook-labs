  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to retain the prior estimates of rapid spending growth or issue revised estimates indicating
    a plateau. The passage describes internal review of the physical estimates and resistance to the change; exclude the separate
    question of how to collect intelligence on Soviet forces.
  span_range:
  - src:a309c205aef4#p15.5
  - src:a309c205aef4#p16.3
  decision: The CIA’s Office of Strategic Resources chose to revise its Soviet defense-spending estimates in 1983 to reflect
    a procurement plateau and slower overall growth.
