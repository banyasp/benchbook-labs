- n: 2
  focus: The decision point is the CIA’s shift from its 1976 outlook toward a forecast of an impending Soviet oil crisis,
    based on concerns about reserves and water encroachment in existing wells. Include the uncertainty and the later account
    of why the forecast was premature; exclude any operational intelligence-collection methods.
  span_range:
  - src:a309c205aef4#p9.4
  - src:a309c205aef4#p10.3
  decision: The CIA’s Office of Economic Research chose to forecast a near-term peak and possible decline in Soviet oil production
    in its 1977 assessment.
