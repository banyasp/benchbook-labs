- n: 1
  focus: The decision point is whether to create a new intelligence capability and which agency should lead it, given the
    stated lack of effective warning and intelligence about Soviet capabilities and intentions. Keep the analysis at the level
    of presidential authorization and institutional responsibility; exclude aircraft design, covert support, and collection
    procedures.
  span_range:
  - src:1c3e865ba36e#p3.2
  - src:1c3e865ba36e#p3.4
  decision: The President directs the CIA to establish and lead the U-2 intelligence program.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to undertake a major arms buildup amid domestic pressure and Soviet claims of military
    superiority. The stated reason for resisting was intelligence from the U-2, corroborated by other means, indicating there
    was no bomber or missile gap; exclude the operational means by which that intelligence was collected.
  span_range:
  - src:1c3e865ba36e#p4.7
  - src:1c3e865ba36e#p4.7
  decision: The President resists domestic pressure for a massive arms buildup rather than expand forces in response to claims
    of Soviet bomber and missile advantages.
  content_domain: other:defense policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
