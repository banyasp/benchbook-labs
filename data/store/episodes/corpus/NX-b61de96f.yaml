- n: 2
  focus: The decision point is whether the DI should send its new analysts to ODNI’s four-week course or limit participation
    because the DI already had its own training and faced a high workload. Focus on the choice between community-wide training
    and preserving analyst time for the DI’s workload; exclude course content beyond that rationale.
  span_range:
  - src:ae6430356af0#p6.3
  - src:ae6430356af0#p6.5
  decision: CIA’s Directorate of Intelligence leadership agreed to only token participation in ODNI’s Analysis 101 course
    for new analysts.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to continue routine analytic production without a focused review or devote organizational
    attention to examining the Iraq WMD failure and lessons for future analysis. The article says routine production continued
    during the stand-down, so do not characterize it as a full halt; exclude collection or operational methods.
  span_range:
