episodes:
- n: 1
  focus: 'The court held that Article 5 did not operate automatically: where no doubt was raised at trial, the prosecution
    did not have to prove that the accused lacked POW protection, and the proceedings were not a mistrial for want of notices.
    The choice was between treating the safeguard as automatic or requiring a doubt to arise; exclude the separate appeal
    in which counsel did raise status.'
  span_range:
  - src:3bf8066f703b#p1.5
  - src:3bf8066f703b#p1.7
  decision: The Privy Council decides whether the absence of a prisoner-of-war status claim at trial required protection under
    Article 5 and invalidated the convictions in the other appeals.
  content_domain: other:judicial-adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The court held that the claim was sufficient to raise doubt, requiring the accused to receive Convention protection
    for the time being while status was determined, or for the trial to be paused in the absence of required notices. It allowed
    the appeal, quashed the conviction, and remitted the case for retrial; exclude the separate appeals in which no claim
    was made at trial.
  span_range:
  - src:3bf8066f703b#p1.7
  - src:3bf8066f703b#p1.8
  decision: The Privy Council decides whether the trial court should have treated the accused’s POW-status claim as raising
    doubt and what to do before continuing the trial.
  content_domain: other:judicial-adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
