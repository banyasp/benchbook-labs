episodes:
- n: 1
  focus: The intelligence had been assessed as indicating offensive missiles in Cuba, but the initial report was not yet complete.
    The Deputy Director chose to notify senior officials promptly so they could give the matter early attention; exclude the
    secure-telephone details and intelligence-handling procedures.
  span_range:
  - src:fbad360dee75#p16.3
  - src:fbad360dee75#p16.4
  decision: The Deputy Director for Intelligence decided to alert White House and State Department officials that evening
    rather than wait until morning.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: After noting that the year-old operation had produced discouraging results and had not significantly influenced events
    in Cuba, the Attorney General chose to convene daily meetings with agency representatives. The decision point is the oversight
    cadence and accountability response; exclude operational proposals or methods discussed in the operation.
  span_range:
  - src:fbad360dee75#p18.4
  - src:fbad360dee75#p19.3
  decision: The Attorney General decided to take more personal oversight of Operation MONGOOSE by instituting daily interagency
    meetings.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The CIA Director judged the situation intolerable but argued against acting without warning, proposing notice and
    an opportunity to remove the systems before a possible U.S. response. The decision point is the policy choice between
    warning and immediate action; exclude the specific military targets and strike methods mentioned in the recommendation.
  span_range:
  - src:fbad360dee75#p26.5
  - src:fbad360dee75#p27.10
  decision: The CIA Director recommended warning Soviet and Cuban leaders and demanding removal of the missile systems before
    the United States resorted to force.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The memorandum reports a probable, conditional preference for a limited blockade, while noting disagreement and that
    the course was not unanimous. Focus on the policy choice, its legal framing, and the reasons weighed; exclude the blockade’s
    operational implementation.
  span_range:
  - src:fbad360dee75#p55.4
  - src:fbad360dee75#p56.5
  decision: The President and senior policy principals decide whether to begin with a limited blockade rather than take immediate
    military action, and whether to avoid a formal declaration of war unless legally necessary.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The evaluation adopts a cautious planning assumption while acknowledging evidentiary uncertainty. Focus on the analytic
    judgment and its stated basis; exclude intelligence-collection methods and technical weapon details.
  span_range:
  - src:fbad360dee75#p50.7
  - src:fbad360dee75#p52.3
  decision: Joint intelligence evaluators decide whether to treat nuclear warheads as potentially available in Cuba despite
    lacking positive evidence of their presence.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The record describes the Vice President’s initial preference for an unannounced strike and his reluctant eventual
    agreement with a plan involving a blockade and later military action if warranted. Reasons included his concern that a
    blockade would be ineffective and would reveal U.S. intentions; the record says he agreed after hearing the arguments
    and learning of the former President’s support. Treat this as the Vice President’s assent, not as proof of a formal presidential
    authorization; exclude operational strike planning and intelligence-collection methods.
  span_range:
  - src:fbad360dee75#p104.8
  - src:fbad360dee75#p104.10
  decision: The Vice President ultimately accepted the agreed blockade-and-notice approach rather than an unannounced strike.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 7
  focus: This is an estimative judgment about likely Soviet responses across U.S. policy options, including the analysts’
    caveat that the comparison could not be made with great assurance. Reasons include Soviet pressure to respond to U.S.
    force, possible retaliation in Berlin, and the prospect that rapid occupation might make the Soviets pause before opening
    another theater. Extract the assessment and its uncertainty, not operational recommendations or retaliation methods.
  span_range:
  - src:fbad360dee75#p77.5
  - src:fbad360dee75#p80.3
  decision: U.S. intelligence analysts assessed that Soviet military retaliation was more likely after U.S. force against
    Cuba than after a blockade, and that rapid invasion might be less likely to prompt retaliation outside Cuba than limited
    strikes.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: The decision point is the choice among the quarantine, an air strike, and invasion, weighing the risk of Soviet retaliation
    and allied consequences against the risk of inaction. Keep the focus on the policy choice and its rationale, not on enforcement
    procedures or military preparations.
  span_range:
  - src:fbad360dee75#p130.8
  - src:fbad360dee75#p133.6
  decision: The President chooses a Cuba quarantine rather than immediate military action.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 9
  focus: The decision concerns who may authorize a response and how the decision is to be made under this contingency. Keep
    it at the level of authority and accountability; exclude operational details of any response.
  span_range:
  - src:fbad360dee75#p138.2
  - src:fbad360dee75#p138.2
  decision: The President sets contingent authority for a retaliatory response if a U-2 is fired upon, including authority
    for the Secretary of Defense if the President is unavailable.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 10
  focus: The decision point is whether to pursue a summit immediately or wait for developments to establish the circumstances
    for productive negotiations. Exclude the separate question of how to respond to the ships.
  span_range:
  - src:fbad360dee75#p150.12
  - src:fbad360dee75#p151.2
  decision: The President defers a summit meeting until the ship confrontation and the next day’s developments clarify the
    situation.
  content_domain: other:diplomacy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The decision is whether to board particular ships under the quarantine, based on the reported cargo and suspected
    military significance. Keep the account to the decision and its basis; exclude boarding procedures or other operational
    details.
  span_range:
  - src:fbad360dee75#p157.7
  - src:fbad360dee75#p157.7
  decision: The Executive Committee directs the Navy to board the next Soviet ship contacted, identified as the Grozny, but
    not to board the Bucharest.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 12
  focus: The decision point is the oversight and coordination channel for intelligence activity during the crisis. The stated
    reasons include the need for intelligence and possible military handoff, and the view that the existing process is too
    cumbersome; exclude the project’s collection methods and assets.
  span_range:
  - src:fbad360dee75#p161.6
  - src:fbad360dee75#p162.4
  decision: CIA leadership favors direct CIA–Joint Chiefs coordination and control for the crisis project rather than routing
    it through the MONGOOSE Special Group process.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 13
  focus: The decision point is the analytic choice to use an armed-warhead assumption despite no direct knowledge of warheads
    in Cuba. Keep the focus on the estimate and its uncertainty; do not turn it into a decision to strike or conduct surveillance.
  span_range:
  - src:fbad360dee75#p184.4
  - src:fbad360dee75#p184.5
  decision: The intelligence committees and photographic analysis center judge it prudent to assume the Soviet missile force
    in Cuba is thermonuclearly armed.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 14
  focus: Examine the choice to reaffirm the designated director’s leadership amid reported uncertainty about the director’s
    authority and channels to Defense and the Joint Chiefs. Exclude the specific transmitter project, agent infiltration,
    and other operational tasks; the decision here is about interdepartmental command and responsibility.
  span_range:
  - src:fbad360dee75#p169.7
  - src:fbad360dee75#p170.5
  decision: The MONGOOSE leadership group reaffirms the designated director’s authority over the operation’s covert activities
    across departments.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 15
  focus: 'Assess the disclosure decision: what intelligence to share in support of the UN operation and the stated protection
    for sources. Keep the focus on authority and disclosure limits, not on conducting reconnaissance or the operation’s technical
    details.'
  span_range:
  - src:fbad360dee75#p192.3
  - src:fbad360dee75#p192.6
  decision: The Executive Committee authorizes the Director of Central Intelligence to release pertinent Cuba-buildup information
    to the UN operation while protecting intelligence sources.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
