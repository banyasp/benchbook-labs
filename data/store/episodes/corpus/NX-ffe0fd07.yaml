- n: 1
  focus: In early 1963, working-level analysts had identified serious weaknesses in South Vietnam’s forces and leadership,
    but policymakers protested the draft estimate. The Office of National Estimates agreed to mute its criticism and change
    the estimate’s tone; exclude the later riots and other events that followed.
  span_range:
  - src:2c1ced6345ed#p5.10
  - src:2c1ced6345ed#p5.15
  decision: The Office of National Estimates, under pressure from senior policymakers, chose to issue a revised, more optimistic
    estimate of South Vietnamese military progress.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: When asked by the White House in mid-1964 for its view of the domino thesis, the Office of National Estimates gave
    a conclusion contrary to the prevailing administration position. The article grounds that judgment in the independence
    and nationalist character of regional movements and the growing Sino-Soviet estrangement; exclude the broader later consequences
    of the Vietnam War.
  span_range:
  - src:2c1ced6345ed#p4.7
  - src:2c1ced6345ed#p5.1
  decision: The Office of National Estimates chose to assess that losing South Vietnam and Laos would not rapidly cause successive
    communization elsewhere in the Far East.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The officers weighed uncertain effects of attacks against the North against the risk of major war and concern among
    the US public, Congress, and other countries, given South Vietnam’s weakness. This is an advisory policy judgment, not
    evidence that national decisionmakers adopted it; exclude operational details about conducting attacks.
  span_range:
  - src:2c1ced6345ed#p9.9
  - src:2c1ced6345ed#p10.3
  decision: CIA officers advising on the 1964 war game recommended that the United States move against North Vietnam only
    if South Vietnam had sufficient military-political potential to make the effort worthwhile.
  content_domain: use-of-force-policy
