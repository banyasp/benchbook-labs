- n: 1
  focus: The decision point is how to maintain on-scene oversight after STRIKE flight could not proceed to the site because
    of fuel limits and the mishap wingman reported only 10 minutes of fuel remaining. Focus on the Supervisor of Flying’s
    choice to send HOSS and coordinate the response; exclude the flight and rescue procedures themselves.
  span_range:
  - src:03ce521ff028#p1.133
  - src:03ce521ff028#p1.135
  decision: The Supervisor of Flying directs HOSS flight to proceed to the crash site and relieve the mishap wingman as on-scene
    commander.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is the pilot’s choice between remaining grounded and returning to duty after learning of his grandfather’s
    death. The report says he had recognized the emotional impact the previous day, then appeared focused and told his division
    commander he was ready; exclude any conclusion that the commander independently authorized or cleared him based on reasons
    not stated here.
  span_range:
  - src:03ce521ff028#p1.237
  - src:03ce521ff028#p1.237
  decision: The mishap pilot decided to return to flying on 28 June after removing himself from the flying schedule the previous
    day.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
