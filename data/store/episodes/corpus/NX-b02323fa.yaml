  natsec: false
- n: 2
  focus: The Principals Committee recommended a review in September 2008, and the President ordered it shortly afterward amid
    worsening conditions in Afghanistan and sustained security gains in Iraq. Focus on the choice to undertake the review;
    do not treat the review’s later counterinsurgency recommendation as adopted policy.
  span_range:
  - src:f1e34b51dc4c#p5.5
  - src:f1e34b51dc4c#p5.10
  decision: The President chose to order a comprehensive review of U.S. policy and strategy toward Afghanistan and Pakistan.
