  focus: In late 2007 and early 2008, the staff judged Afghanistan’s policy more at risk of failure as violence worsened there
    and declined in Iraq. Focus on the choice to redirect attention and resources, and the stated reasons; exclude later recommendations
    about the form or resourcing of a counterinsurgency campaign.
  span_range:
  - src:f1e34b51dc4c#p5.1
  - src:f1e34b51dc4c#p5.5
  decision: The NSC staff chose to refocus policymaker attention and resources on Afghanistan rather than continue prioritizing
    Iraq.
  content_domain: other:national-security-policy
