- n: 1
  focus: The decision point is whether to give NSA the central role or retain an advisory capability while DoD components
    evaluate systems within their own jurisdictions. Include the stated concerns about other agencies’ authority and influence
    and NSA’s and DIA’s secretive missions in light of the Privacy Act; exclude technical details of computer security.
  span_range:
  - src:37f8762e2175#p1.49
  - src:37f8762e2175#p1.52
  decision: The Assistant Secretary of Defense (Comptroller) declined to make NSA the DoD’s central technical authority for
    ADP security.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to locate and organize the proposed center at NSA or pursue an alternative federal
    center with NBS, and whether NSA should receive the DoD responsibility despite component concerns. Include the stated
    concerns about interagency relationships, NSA influence, and standards that could be too costly or complex for other departments;
    exclude technical evaluation methods.
  span_range:
  - src:37f8762e2175#p1.59
  - src:37f8762e2175#p1.76
  decision: The Deputy Secretary of Defense approved an NSA-based Project Management Office and assigned NSA responsibility
    for DoD computer security evaluation.
  content_domain: cyber-policy
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether NSA should retain the broad responsibility established by NSDD-145 or whether the NBS
    should lead protection of federal SBU information technology under the Computer Security Act. Include the stated concerns
    about military influence in civilian computer security and the requirement for NSA to work with NBS; exclude technical
    standards or security procedures.
  span_range:
  - src:37f8762e2175#p1.104
  - src:37f8762e2175#p1.110
  decision: Congress transferred responsibility for protecting federal sensitive-but-unclassified information technology to
    the National Bureau of Standards, with NSA assisting on standards and guidelines.
  content_domain: cyber-policy
  refusal_sensitivity: medium
