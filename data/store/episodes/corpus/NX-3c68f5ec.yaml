- n: 2
  focus: The decision followed the IKV’s outreach to Eastern dissidents and its proposed peace platform with East German dissidents.
    The article attributes the order to the leadership’s view of the group as a divisive force; focus on the policy choice
    and rationale, excluding the subsequent campaign’s operational measures.
  span_range:
  - src:dd8135503b1f#p7.2
  - src:dd8135503b1f#p7.9
  decision: The East German leader ordered the state office responsible for religious affairs to use state influence to eliminate
    the IKV’s perceived divisive role.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: An intelligence assessment before the leader’s 1987 state visit identified Dutch positions that diverged from US
    and NATO policies. The leader nevertheless used standard rhetoric because he regarded the Netherlands as part of the imperialist
    bloc; focus on the decision to disregard the assessment, not collection or tradecraft.
  span_range:
  - src:dd8135503b1f#p12.8
  - src:dd8135503b1f#p12.13
  decision: The East German leader chose not to adapt diplomatic messaging to exploit Dutch policy differences from the United
