- n: 1
  focus: The choice was between the Treasury Secretary’s proposed centralized bureau and weekly coordination of existing services;
    the conference rejected centralization and favored regular meetings coordinated by the Department of Justice. The scenario
    should focus on agency authority and coordination, excluding investigative activity.
  span_range:
  - src:f9b283f4c694#p13.2
  - src:f9b283f4c694#p13.3
  decision: At the January 1918 interdepartmental conference, the participating agencies rejected the Treasury Secretary’s
    centralization proposal and chose weekly intelligence coordination under the Department of Justice.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The choice was whether to support broad military control around war-related sites or oppose it and retain civilian
    authority. The Attorney General cited the functioning civil court system, the peaceful home front, and the danger of a
    drastic expansion of military control; exclude operational security practices.
  span_range:
  - src:f9b283f4c694#p14.1
  - src:f9b283f4c694#p14.3
  decision: The Attorney General chose to oppose legislation that would place broad areas of the home front under military
    authority, arguing that civil courts and ordinary law enforcement remained adequate.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
