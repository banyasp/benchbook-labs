episodes:
- n: 1
  focus: The decision point is whether to keep the profits transparently attributed to him or conceal his interest; the report
    identifies concealment of untaxed wealth as a central purpose. Focus on the ethical and legal choice, not the mechanics
    of managing accounts.
  span_range:
  - src:b009963c339f#p1.2
  - src:b009963c339f#p1.4
  decision: The retired Air Force major general chose to conceal his Enterprise profit interest by having distributions held
    under a shell-company account.
  content_domain: other:government ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision point is whether to provide a personal benefit to a government official or refrain from doing so; the
    reported assassination threat is relevant context, while the report also gives the interest in retaining the official
    in his role as a reason. Exclude details of the security system itself and focus on the gratuity and conflict-of-interest
    judgment.
  span_range:
  - src:b009963c339f#p1.11
  - src:b009963c339f#p1.12
  decision: The retired Air Force major general chose to fund a home-security benefit for an NSC staff member whose continued
    service helped sustain the Enterprise’s profitable operations.
  content_domain: other:government ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to permit an accurate account of the payment or endorse backdated billing documents
    intended to make it appear otherwise. Keep the focus on concealment and legal accountability; exclude any technical details
    about the security system.
  span_range:
  - src:b009963c339f#p1.12
  - src:b009963c339f#p1.12
  decision: After the Iran/contra affair became public, the retired Air Force major general chose to endorse a cover-up of
    the personal benefit provided to the NSC staff member.
  content_domain: other:government ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
