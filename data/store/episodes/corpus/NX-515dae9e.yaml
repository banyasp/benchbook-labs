  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 20
  focus: The choice was whether to approve the full £40m request or provide only immediate funding. The decision cited reports
    that US funding was becoming available; exclude the separate later bid for media-network funding.
  span_range:
  - src:c63b98d349ef#p133.8
  - src:c63b98d349ef#p134.6
