- n: 1
  focus: The choice was whether to release Reserve funds for the proposed humanitarian response; the request specified an
    initial contribution to the UN appeal, support for the Red Cross and NGOs, and DFID’s bilateral contribution. Exclude
    reconstruction funding, which the request expressly left for later consideration.
  span_range:
  - src:c63b98d349ef#p14.3
  - src:c63b98d349ef#p16.5
  decision: The UK Chief Secretary to the Treasury approved the International Development Secretary’s request for £120 million
    from the Reserve for humanitarian assistance in Iraq.
  content_domain: other:humanitarian-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The policy choice was to arrange for the existing food-and-goods programme to continue under revised post-conflict
    arrangements rather than risk a break in distribution. The stated reason was the risk of humanitarian catastrophe for
    a population heavily dependent on the programme; exclude operational details of the programme’s implementation.
  span_range:
  - src:c63b98d349ef#p13.4
  - src:c63b98d349ef#p14.2
  decision: The UK Government pursued continuity of the Oil-for-Food programme through a Security Council resolution, and
    the Security Council adopted Resolution 1472 transferring temporary administration to the UN Secretary-General.
  content_domain: other:humanitarian-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The choice was whether to halt the UK’s partner-solicitation effort or continue despite US concern that the two campaigns
    were uncoordinated and might compete for the same contributions. The counsellor chose to continue, citing prior UK efforts
    to keep the US informed and unwillingness to wait for US inter-agency coordination; exclude the military capabilities
    sought and other operational details.
  span_range:
  - src:c63b98d349ef#p24.4
  - src:c63b98d349ef#p24.6
  decision: The British Embassy’s political counsellor declined the US request to abort the UK’s campaign to seek military
    contributions for the post-conflict phase.
  content_domain: other:coalition-building-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to involve European partners at the formative stage or proceed without early consultation.
    The stated reasons were to secure Security Council support and help restore working relationships; exclude the later negotiations
    over the resolution’s substantive terms.
  span_range:
  - src:c63b98d349ef#p25.5
  - src:c63b98d349ef#p25.7
  decision: FCO officials agreed to engage European countries early in shaping the post-conflict resolution.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: The decision point is whether to raise the resolution’s form at the meeting or park the issue for later. The stated
    rationale was to debate it after victory, when the UK and US would be in a position of strength; exclude the later details
    of the resolution negotiations.
  span_range:
  - src:c63b98d349ef#p36.8
  - src:c63b98d349ef#p37.3
  decision: The Prime Minister chose to defer the debate with the US President about the form of a post-conflict UN resolution
    until after military victory.
  content_domain: other:diplomatic-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to undertake broader reconstruction without a resolution or adhere to the stated legal
    limits. The paper recommends the narrower course on the basis of the Attorney General’s advice; exclude the separate question
    of how to deliver particular relief or administrative activities.
  span_range:
  - src:c63b98d349ef#p27.10
  - src:c63b98d349ef#p27.11
  decision: DFID officials recommended that, without a Security Council resolution, the UK limit its support to humanitarian
    relief and basic civil-administration reform needed for public security.
  content_domain: other:international-law-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The decision point is how to coordinate Whitehall’s reconstruction work, including which department should lead and
    what ministerial structure to use. The record describes competing views about departmental leadership and the proposed
    flexible ad hoc group; exclude the group’s later substantive policy workstreams.
  span_range:
  - src:c63b98d349ef#p30.3
  - src:c63b98d349ef#p32.8
  decision: The Prime Minister agreed to establish an ad hoc ministerial group, chaired by the Foreign Secretary, to formulate
    policy for Iraq’s rehabilitation, reform and development.
  content_domain: other:government-coordination
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The decision was whether to accept regional responsibility or defer/refuse, weighing the chance to influence ORHA
    and align civilian and military areas against legal responsibility for forces the UK could not control, limited resources
    and reputational risk. Ministers agreed to offer a leading role if the office matched the UK security sector and the UK
    did not have to pay programme costs; exclude the separate decision about the size of the military sector.
  span_range:
  - src:c63b98d349ef#p51.4
  - src:c63b98d349ef#p57.2
  decision: UK ministers decide whether to lead an ORHA regional office in south-eastern Iraq, and on what conditions.
  content_domain: other:post-conflict reconstruction policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: DFID considered no engagement, full engagement, or limited engagement. The Secretary of State chose a task-led approach
    with one or two people acting as DFID’s ‘eyes and ears’, rather than committing staff for its own sake, amid concerns
    about ORHA’s effectiveness and the proper roles of other organisations; exclude the wider UK decision on ORHA staffing
    levels.
  span_range:
  - src:c63b98d349ef#p55.6
  - src:c63b98d349ef#p56.6
  decision: The Secretary of State for International Development decides how far DFID should engage with ORHA and second staff
    to it.
  content_domain: other:post-conflict reconstruction policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: 'The UK considered a phased approach: support continued UN arrangements in the short term, transfer control to a
    credible interim administration with safeguards, and leave full control to a democratically elected Iraqi government.
    The group agreed to encourage exports only after an appropriate Security Council resolution, while reserving strategic
    decisions for Iraqis and offering expertise; the passage weighs humanitarian and reconstruction needs, legal authority,
    transparency and Iraqi control. Exclude technical oil-sector implementation.'
  span_range:
  - src:c63b98d349ef#p58.8
  - src:c63b98d349ef#p60.2
  decision: The Ad Hoc Group on Iraq Rehabilitation decides the UK’s approach to restarting Iraqi oil exports and transferring
    control of oil and revenues.
  content_domain: other:post-conflict reconstruction policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The decision point is whether to maintain the existing pace and arrangements or expand UK support in the South. The
    stated reasons include the UK’s responsibility in the region, the gap left by ORHA’s slow mobilisation, and the risk that
    slow, invisible rehabilitation would erode consent for Coalition forces. Exclude the later costed plan, which is only
    noted as submitted.
  span_range:
  - src:c63b98d349ef#p72.9
  - src:c63b98d349ef#p74.3
  decision: The UK Ad Hoc Ministerial Group on Iraq Rehabilitation agreed to step up reconstruction in the southern sector
    through quick-impact projects, added ORHA(South) capacity and related funding and coordination measures.
  content_domain: other:reconstruction policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: 'The decision resolves competing organizational options: a DFID-led group with a direct remit, or one integrated
    into the existing policy structure. The stated reason for the reporting arrangement was to ensure a coherent UK interface
    with the CPA and avoid fragmenting UK policy-making. Exclude the group’s subsequent operational work.'
  span_range:
  - src:c63b98d349ef#p86.10
  - src:c63b98d349ef#p87.7
  decision: The UK Foreign Secretary agreed that DFID should establish the Iraq Rehabilitation Operations Group, with the
    group reporting to the AHMGIR through the Iraq Policy Unit.
  content_domain: other:government coordination
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The decision point is whether to remain in Government or resign in response to the Security Council resolution and
    the Government’s approach to Iraqi transitional authority. The stated reason was that the resolution contradicted assurances
    the Secretary had given Parliament and others about the legal authority of the occupying powers and the need for a UN-led
    process. Exclude the wider negotiations and legal questions addressed elsewhere in the report.
  span_range:
  - src:c63b98d349ef#p70.2
  - src:c63b98d349ef#p70.3
  decision: The International Development Secretary resigned from the Government rather than remain in office after concluding
    that the Government had breached assurances about UN authority and a UN-led process for establishing a legitimate Iraqi
    government.
  content_domain: other:government ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The decision was whether to accept the CPA’s arrangements or press for changes and UK participation. The source links
    the choice to the UK’s joint legal responsibility for DFI disbursements, the risk of being accountable without influence,
    and concerns that the regulation could marginalise UK views; exclude later scrutiny of individual disbursements.
  span_range:
  - src:c63b98d349ef#p88.2
  - src:c63b98d349ef#p89.7
  decision: The UK Government decided to lobby the US and CPA to amend the DFI regulation and secure fuller UK involvement
    in decisions on disbursements.
  content_domain: other:public-finance governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: 'The choice was between a British successor and an international appointee. The source gives the case for an international
    figure as demonstrating reconstruction’s international dimension, but records the UK decision and its rationale: a leader
    with political and managerial strength, able to gain the CPA head’s trust and lead operations in the British area. Exclude
    the later appointment’s operational performance.'
  span_range:
  - src:c63b98d349ef#p104.2
  - src:c63b98d349ef#p104.9
  decision: The UK Government decided to seek a suitably strong UK official to replace the head of CPA(South).
  content_domain: other:reconstruction governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The choice was how to distribute the UK’s leadership contribution among Governorate Teams. The source records the
    decision to offer four teams across the South East, Kurdish area, and a Sunni area outside the unstable central region;
    reasons for dispersal included better access to Baghdad funding and visibility of developments across Iraq. Exclude the
    teams’ operational activities.
  span_range:
  - src:c63b98d349ef#p105.2
  - src:c63b98d349ef#p105.6
  decision: The UK Government decided to offer to lead four Governorate Teams across different regions rather than concentrate
    its contribution in the southern governorates.
  content_domain: other:reconstruction governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: 'The decision followed severe service failures, unrest and declining consent, with three courses available: accelerate
    CPA work, have the UK lead reconstruction, or intervene temporarily before handing over. Focus on the policy choice and
    its balance of urgency against taking on a larger UK role; exclude operational details of security tasks.'
  span_range:
  - src:c63b98d349ef#p113.7
  - src:c63b98d349ef#p114.13
  decision: The Chiefs of Staff chose to press the CPA to accelerate reconstruction, while planning contingencies for temporary
    UK-led intervention if that failed.
  content_domain: other:reconstruction-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The decision was to provide an initial UK contribution while pressing the CPA to fund the balance, rather than either
    waiting for CPA resources or assuming full UK responsibility. The reasons included the need for rapid, visible service
    improvements and the financial and logistical limits of taking responsibility for infrastructure across the South; exclude
    project implementation details.
  span_range:
  - src:c63b98d349ef#p123.4
  - src:c63b98d349ef#p123.10
