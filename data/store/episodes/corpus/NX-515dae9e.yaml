    cost.
  content_domain: other:reconstruction-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 19
  focus: The passage describes a choice between rapid emergency work and large projects expected to take longer, in the context
    of urgent service needs and an insecure environment. Focus on the rationale and the decision to develop a joint plan;
    exclude technical project design and implementation.
  span_range:
  - src:c63b98d349ef#p124.4
  - src:c63b98d349ef#p124.8
  decision: The head of CPA(South) chose an emergency, quick-impact approach to essential-services reconstruction rather than
