- n: 1
  focus: The team agreed to clear responses with the G2 or a watch officer and not pass details about ongoing or future operations,
    while continuing to answer national requests. The decision balanced national agencies’ demand for on-scene information
    against operational security and the supported command’s trust; exclude technical communication methods.
  span_range:
  - src:b36bd48d678f#p3.3
  - src:b36bd48d678f#p3.4
  decision: The NIST-Tuzla team, with the Task Force Eagle G2’s agreement, decided how to respond to recurring information
    requests from Washington-based national intelligence agencies.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision responded to national intelligence production that appeared focused on Washington briefings rather than
    the tactical commander’s needs. Include the choice to share the task force’s requirements and the stated purpose of directing
    national attention toward them; exclude subsequent communication methods and technical details.
  span_range:
  - src:b36bd48d678f#p3.5
  - src:b36bd48d678f#p4.1
  decision: NIST-Tuzla, with the Task Force Eagle G2’s approval, decided to send the task force’s essential elements of information
    to intelligence task forces across the national intelligence community.
  content_domain: intel-analysis
