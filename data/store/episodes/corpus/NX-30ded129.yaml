  focus: The president had to assess competing causal explanations and whether the evidence supported a finding; the report
    identifies failure of the left tail clamp and/or bolts as the cause under a preponderance-of-the-evidence standard. The
    stated reasons include the loss of the tail, the resulting loss of control, and the assessment that maintenance personnel
    complied with required actions and were not a factor. Treat this as an investigative finding, not a determination of civil
    or criminal liability.
