episodes:
- n: 1
  focus: The decision point is the choice of an IGADF scoping inquiry as the initial way to gather and assess information,
    rather than following the ordinary process of suspending an inquiry to refer evidence for criminal or disciplinary investigation.
    The stated reason was to address a culture of silence and assess serious, persistent allegations; do not treat the allegations
    themselves as established findings.
  span_range:
  - src:f2d8c89ae30a#p26.7
  - src:f2d8c89ae30a#p27.1
  decision: The Chief of Army chose to ask the IGADF to conduct a scoping inquiry into allegations concerning SOTG deployments
    before determining further action.
  content_domain: other:military inquiry governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The decision is whether to impose a statutory non-disclosure restriction to protect defence interests and fairness
    to affected persons. Keep the focus on the scope and justification of the restriction; exclude the identities it protects.
  span_range:
  - src:f2d8c89ae30a#p12.9
  - src:f2d8c89ae30a#p13.5
  decision: The Assistant IGADF, acting as a judicial officer, directed that identifying information about specified inquiry
    witnesses and persons named in findings or recommendations not be publicly disclosed.
  content_domain: other:military inquiry governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The decision point is whether to use the Assistant IGADF’s independent statutory powers or leave notification and
    transmission to the Chief of the Defence Force for the time being. The stated reasons were the Chief’s intention to notify
    affected persons and transmit the report, while the Assistant IGADF reserved the ability to act independently later; exclude
    operational details and protected identities.
  span_range:
  - src:f2d8c89ae30a#p11.4
  - src:f2d8c89ae30a#p11.5
  decision: The Assistant IGADF chose not to exercise, at that stage, powers to separately notify persons of findings or publicly
    release all or part of the report.
  content_domain: other:military inquiry governance
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: The decision point is whether to investigate the widely circulating but unsubstantiated rumours through a scoping
    inquiry and assess what further action may be warranted. The stated reasons are that there was insufficient information
    to commence criminal or disciplinary investigations, but the rumours were widely known and required assessment. Exclude
    operational details of the deployments.
  span_range:
  - src:f2d8c89ae30a#p45.6
  - src:f2d8c89ae30a#p45.12
  decision: The Acting Inspector-General directs the IGADF to conduct a scoping inquiry into persistent rumours about Special
    Operations Task Group deployments, rather than treating the rumours as grounds for immediate criminal or disciplinary
    investigations or taking no further action.
  content_domain: other:inquiry oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 5
  focus: 'The decision point is the Inquiry’s recommendation threshold and prioritization: whether an investigation has a
    realistic prospect of obtaining sufficient evidence to charge an identifiable person, with priority for those who incited,
    directed, or procured crimes and consideration of gravity, premeditation, and repeated incidents. The Inquiry also excludes
    referrals where immunities would remove critical admissible evidence; the ultimate prosecution decisions remain with prosecuting
    authorities.'
  span_range:
  - src:f2d8c89ae30a#p40.4
  - src:f2d8c89ae30a#p40.8
  decision: The Inquiry decides which matters to recommend for referral to the Australian Federal Police for criminal investigation,
    including how to prioritize potential suspects and exclude matters where immunities would deprive a prosecution of critical
    admissible evidence.
  content_domain: other:criminal justice policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 6
  focus: The decision point is whether to provide compensation before criminal responsibility is determined or defer it until
    liability is established. The Inquiry gives reputational and ethical reasons for acting without delay. Exclude any inference
    that compensation itself establishes an individual’s guilt.
  span_range:
  - src:f2d8c89ae30a#p41.2
  - src:f2d8c89ae30a#p41.2
  decision: The Inquiry recommends that Australia compensate the family of an Afghan national where there is credible information
    of unlawful killing, without waiting for criminal liability to be established.
  content_domain: other:reparations policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 7
  focus: The amendment expanded the earlier inquiry scope after information obtained indicated possible matters of interest
    in earlier Afghanistan deployments. Treat the decision as a choice between retaining the prior scope and broadening it;
    exclude the underlying operational incidents.
  span_range:
  - src:f2d8c89ae30a#p56.6
  - src:f2d8c89ae30a#p56.8
  decision: The IGADF decided to expand the inquiry to cover SFTG and SOTG deployments from September 2005 through 2016.
  content_domain: other:military-inquiry-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 8
  focus: The Inspector-General granted authority to restrict disclosure of oral evidence, documents, and inquiry reports,
    citing the Commonwealth’s defence interests and fairness to affected persons. Focus on the oversight decision to grant
    that authority, not on any investigative or operational techniques.
  span_range:
  - src:f2d8c89ae30a#p56.9
  - src:f2d8c89ae30a#p56.10
  decision: The IGADF Inspector-General authorized the inquiry head to restrict disclosure of inquiry material.
  content_domain: other:military-inquiry-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 9
  focus: The inquiry assessed whether the evidence and prospects justified referral rather than no further action, and recommended
    referral because it found a realistic prospect of obtaining sufficient evidence to charge for war-crime murder and related
    liability. Keep the focus on the referral standard and accountability decision, not details of the alleged acts.
  span_range:
  - src:f2d8c89ae30a#p71.3
  - src:f2d8c89ae30a#p71.11
  decision: The inquiry recommended that the CDF refer the 2009 killing allegations to the AFP for criminal investigation.
  content_domain: other:military-justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 10
  focus: The inquiry weighed prosecution against granting immunity, noting that potentially incriminating evidence was derived
    from a protected disclosure and that the witness’s evidence was important to other prosecutions. Focus on the legal trade-off
    between individual prosecution and obtaining admissible evidence for broader accountability; exclude the underlying operational
    details.
  span_range:
  - src:f2d8c89ae30a#p71.12
  - src:f2d8c89ae30a#p71.12
  decision: The inquiry recommended granting immunity to a protected discloser if he agreed to give evidence in relevant prosecutions.
  content_domain: other:military-justice
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 11
  focus: The Inquiry weighs whether to recommend referral despite the current inability to identify the person or persons
    responsible. It says further investigation has a realistic prospect of obtaining evidence sufficient to charge an identified
    person; exclude operational details of the alleged killing and misreporting.
  span_range:
  - src:f2d8c89ae30a#p85.4
  - src:f2d8c89ae30a#p85.8
  decision: The Inquiry recommends that the Chief of the Defence Force refer the killing of an unidentified Afghan male to
    the Australian Federal Police for investigation and prosecution.
  content_domain: other:criminal-investigation referral
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 12
  focus: The decision point is whether to refer an alleged killing for investigation when the only probative incriminating
    evidence, and evidence derived from it, is protected by use and derivative-use immunity. The Inquiry recommends against
    referral because it sees no realistic prospect of obtaining sufficient evidence to charge; exclude the alleged operational
    circumstances of the killing.
  span_range:
  - src:f2d8c89ae30a#p98.6
  - src:f2d8c89ae30a#p98.10
  decision: The Inquiry recommends that the Chief of the Defence Force not refer the alleged murder in Chapter 2.43 for criminal
    investigation.
  content_domain: other:criminal-investigation referral
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 13
  focus: The Inquiry weighs prosecution against preserving an important witness whose disclosures are protected by use and
    derivative-use immunity and whose evidence may support other prosecutions. The recommended course is no action against
    him and conditional immunity for Crown testimony; exclude the alleged killing’s operational details.
  span_range:
  - src:f2d8c89ae30a#p92.9
  - src:f2d8c89ae30a#p92.10
  decision: The Inquiry recommends taking no action against an immunized witness and granting him immunity from prosecution
    if he agrees to testify for the Crown.
  content_domain: other:criminal-investigation referral
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 14
  focus: The decision was whether to inquire into serious but unsubstantiated rumours or avoid an inquiry that critics said
    could burden veterans and their families. The source gives legal authority and explains the legal, moral, disciplinary,
    and fairness reasons for proceeding; exclude the inquiry’s investigative methods.
  span_range:
  - src:f2d8c89ae30a#p122.7
  - src:f2d8c89ae30a#p125.11
  decision: The Chief of Army, later joined by the Chief of the Defence Force, decided to establish an IGADF inquiry into
    unsubstantiated allegations of serious misconduct by Special Operations Task Group personnel.
  content_domain: other:military inquiry oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 15
  focus: The decision point is whether to refer incidents to the AFP as they arise or generally complete the inquiry first.
    The Chief of Army suggested that departing from the normal referral course might help break the culture of silence; exclude
    investigative or evidence-gathering methods.
  span_range:
  - src:f2d8c89ae30a#p122.8
  - src:f2d8c89ae30a#p129.8
  decision: The Inquiry and the Australian Federal Police agreed, as a general rule, that the Inquiry would finish before
    referring incidents to the AFP, leaving referral decisions to the Chief of the Defence Force under applicable legislation.
  content_domain: other:military inquiry oversight
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 16
  focus: The decision was to solicit direct disclosures and offer confidentiality where no criminal activity came to light,
    rather than rely only on ordinary reporting channels. The stated context was the commander’s concern about serious endemic
    problems; exclude the operational pause and any investigative techniques.
  span_range:
  - src:f2d8c89ae30a#p122.4
  - src:f2d8c89ae30a#p122.5
  decision: The Special Operations Commander decided to invite SOCOMD members to report unacceptable behaviour directly to
    him under a conditional assurance of confidentiality.
  content_domain: other:military reporting policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 17
  focus: 'The decision point is the Inquiry’s choice of a private process and its reasons: operational matters, protected
    identities, reputational fairness, witness protection, and preserving the confidentiality and integrity of inquiry lines.
    Exclude the mechanics of conducting individual interviews.'
  span_range:
  - src:f2d8c89ae30a#p134.6
  - src:f2d8c89ae30a#p134.6
  decision: The Inquiry decided to conduct its evidence hearings in private rather than in public.
  content_domain: other:inquiry procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 18
  focus: The decision point is the judge’s balancing of fair access to material relevant to serious defamation proceedings
    against confidentiality, self-incrimination, and risks to the Inquiry and future cooperation. The proposed conditions
    include redactions and restrictions on disclosure; exclude the separate question of how those protections would ultimately
    be implemented.
  span_range:
  - src:f2d8c89ae30a#p139.11
  - src:f2d8c89ae30a#p142.3
  decision: The Federal Court judge decided to require production of the contentious Inquiry documents, subject to protections,
    rather than uphold the IGADF’s public interest immunity claim.
  content_domain: other:public-interest-immunity adjudication
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 19
  focus: The decision point is the court’s category-by-category choice to approve, refuse, or limit redactions, balancing
    national and international security and the proper administration of justice against disclosure and the interests of the
    proceedings. Exclude the underlying allegations and any operational details contained in the material.
  span_range:
  - src:f2d8c89ae30a#p138.6
  - src:f2d8c89ae30a#p139.6
  decision: The Federal Court judge decided which categories of Inquiry-related material should be redacted in the defamation
    proceedings, and how long some redactions should last.
  content_domain: other:judicial redaction decision
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 20
  focus: The decision point is whether to suspend the Inquiry and refer potentially criminal evidence as it arose, or continue
    the Inquiry before recommending referral. The stated reasons include the risk that silence would reassert itself and obscure
    the problem, the lack of sufficient information to start investigations, and the agreed later referral process; exclude
    the merits of any particular alleged incident.
  span_range:
  - src:f2d8c89ae30a#p149.6
  - src:f2d8c89ae30a#p150.2
  decision: The Inquiry and the AFP agreed, as a general rule, that the Inquiry would finish before referring incidents under
    inquiry to the AFP.
  content_domain: other:public inquiry procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 21
  focus: The decision point is how to describe information that may warrant further investigation without implying admissible
    court evidence or a finding of guilt. Focus on the Inquiry’s choice of formulation and its legal and reputational reasons;
    exclude assessments of whether any particular person committed an offence.
  span_range:
  - src:f2d8c89ae30a#p152.6
  - src:f2d8c89ae30a#p153.3
  decision: The Inquiry chose to express its findings as whether there was “credible information,” rather than “credible evidence,”
    of possible offending.
  content_domain: other:public inquiry procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 22
  focus: 'The decision point is how much material to disclose to a person facing a potential adverse finding: full transcripts
    and additional particulars, or notice of the critical issues and the substance of adverse material. Focus on the balance
    between procedural fairness and the Inquiry’s disclosure limits; exclude any attempt to reconstruct investigative methods
    or the underlying allegations.'
  span_range:
  - src:f2d8c89ae30a#p159.5
  - src:f2d8c89ae30a#p161.7
  decision: The Inquiry generally rejected requests for full transcripts and further particulars, providing the substance
    of adverse material rather than broader disclosure.
  content_domain: other:public inquiry procedure
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 23
  focus: The Inquiry adopted a realistic-prospect-of-obtaining-sufficient-evidence-to-charge test, while also considering
    the ultimate prospects of conviction. Treat this as a policy decision about screening referrals, not as a decision about
    whether to refer a particular person or incident.
  span_range:
  - src:f2d8c89ae30a#p169.2
  - src:f2d8c89ae30a#p169.7
  decision: The Inquiry decides what threshold to use when recommending referral of a matter for criminal investigation.
  content_domain: other:criminal accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 24
  focus: The Inquiry recommends immunity where the subordinate’s evidence is likely to be crucial, prosecution of the subordinate
    is already impeded by use and derivative use immunities, and accountability of the superior is prioritized. Focus on the
    justice and public-interest tradeoff between granting a concession to a participant and securing evidence to prosecute
    a more culpable superior; exclude any investigative techniques.
  span_range:
  - src:f2d8c89ae30a#p171.5
  - src:f2d8c89ae30a#p172.2
  decision: The Commonwealth Director of Public Prosecutions decides whether to grant a subordinate immunity from prosecution
    in return for testimony against a superior.
  content_domain: other:criminal accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 25
  focus: The Inquiry recommends compensation now rather than making it contingent on a completed criminal process. The decision
    weighs the risk of compensating in a case where criminal liability is not ultimately established against delay, restoration
    of standing and goodwill, and the moral case for compensation; exclude the underlying operational incidents.
  span_range:
  - src:f2d8c89ae30a#p173.4
  - src:f2d8c89ae30a#p173.8
  decision: Australia decides whether to compensate the family of an identified or identifiable Afghan national on credible
    information of unlawful killing, without waiting for criminal liability to be established.
  content_domain: other:compensation policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 26
  focus: The decision point is whether to proactively remind witnesses of available support despite anticipating that some
    might object. The Inquiry chose to ensure everyone had ready access to the information, weighing that benefit against
    the risk of unwanted reminders; exclude the separate question of how the witness-support program was organized generally.
  span_range:
  - src:f2d8c89ae30a#p181.5
  - src:f2d8c89ae30a#p181.5
  decision: The IGADF decided to resend welfare-support information to all Inquiry witnesses in January 2020 and follow up
    with contact except for witnesses who had asked not to be contacted.
  content_domain: other:inquiry witness welfare
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 27
  focus: The decision point concerns how to deliver notices setting out potential adverse findings and relevant evidence,
    given that the process could be stressful. The stated arrangement and its exception are supported by the need to manage
    that stress; exclude the separate welfare-support reminders and the merits of any findings.
  span_range:
  - src:f2d8c89ae30a#p181.7
  - src:f2d8c89ae30a#p182.1
  decision: The Inquiry arranged for Defence Counsel Services to facilitate delivery of adverse-affect notices through a Reserve
    Legal Officer, unless the member requested otherwise.
  content_domain: other:inquiry procedural fairness
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 28
  focus: 'The decision point is the 1903 Defence Bill compromise: apply the UK Army Act in both war and peace, or limit it
    to active service and reject compulsory service beyond Australia or its territories. The passage identifies opposition
    to using Australian troops for imperial rather than national defence as the reason; exclude the later description of how
    the resulting codes operated.'
  span_range:
  - src:f2d8c89ae30a#p199.8
  - src:f2d8c89ae30a#p200.2
  decision: The Commonwealth Parliament chose to make the UK Army Act apply to Australian military forces only while on active
    service, rather than at all times.
  content_domain: other:military-discipline-law
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 29
  focus: The decision point is whether to leave unresolved doubts about the Army Act’s reach or amend the law before trials
    arising from alleged looting in German New Guinea. The passage says the existing provision did not cover an expedition
    not serving with Imperial forces and that the amendment expressly resolved the territorial question; exclude the underlying
    allegations as operational conduct.
  span_range:
  - src:f2d8c89ae30a#p200.7
  - src:f2d8c89ae30a#p201.2
  decision: The Commonwealth amended the Defence Act in 1915 to give the Army Act express extra-territorial effect, backdated
    to 1 August 1914.
  content_domain: other:military-discipline-law
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 30
  focus: The decision point is whether to retain the broader active-service trigger, with its more rigorous penalties, or
    adopt war service to apply the Army Act more uniformly while reserving those penalties for the narrower active-service
    category. The passage gives the concern that severe punishment could otherwise extend to personnel in noncombatant roles
    at home; exclude detailed descriptions of the disciplinary code beyond this policy choice.
  span_range:
  - src:f2d8c89ae30a#p201.3
  - src:f2d8c89ae30a#p201.4
  decision: The Commonwealth Parliament replaced active service with war service as the criterion for applying the Army Act,
    while narrowing the definition of active service.
  content_domain: other:military-discipline-law
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 31
  focus: The decision was whether to prevent survivors from reaching shore by attacking them, or protect shipwrecked people
    who were no longer fighting. The stated rationale was that survivors reaching land could fight Allied troops; distinguish
    those who were still firing from survivors in the water who were not resisting.
  span_range:
  - src:f2d8c89ae30a#p214.8
  - src:f2d8c89ae30a#p215.6
  decision: Allied command ordered aircrews to attack survivors from the Bismarck Sea convoy.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 32
  focus: The decision point is whether to testify about reported killings or withhold evidence. The commander said he believed
    the report but felt it concerned his battalion and soldiers, and later felt guilty; exclude any broader claim about the
    trial’s outcome.
  span_range:
  - src:f2d8c89ae30a#p216.4
  - src:f2d8c89ae30a#p216.5
  decision: The Australian battalion commander refused to give evidence at a war-crimes trial concerning killings of Japanese
    prisoners.
  content_domain: other:military-justice-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 33
  focus: The decision point is whether to continue war-crimes prosecutions or end them, in the context of a Soviet request
    to extradite a suspected war criminal. The stated rationale was that public sentiment, despite outrage at the crimes,
    favored moving on; do not infer additional motives not given in the passage.
  span_range:
  - src:f2d8c89ae30a#p216.10
  - src:f2d8c89ae30a#p216.10
  decision: The acting External Affairs Minister rejected an extradition request and adopted a policy of closing the chapter
    on war-crimes prosecutions.
  content_domain: other:war-crimes-prosecution-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 34
  focus: The decision point is whether to report civilian deaths truthfully or encourage their false attribution to enemy
    combatants. The stated reason was to improve the company’s statistics; exclude the described means of falsification and
    focus on the reporting and accountability choice.
  span_range:
  - src:f2d8c89ae30a#p229.3
  - src:f2d8c89ae30a#p229.5
  decision: The company commander suggested falsifying the attribution of civilian deaths to enhance the unit’s enemy body-count
    statistics.
  content_domain: other:military-reporting-ethics
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 35
  focus: The decision point is whether to keep the task force deployed as the mission shifted toward reconstruction or bring
    it home. The stated reason was that special forces were less needed for the new focus; exclude operational details of
    the task force’s activities.
  span_range:
  - src:f2d8c89ae30a#p244.8
  - src:f2d8c89ae30a#p244.8
  decision: The Australian Government decided to withdraw the Special Forces Task Force from Afghanistan at the end of November
    2002 rather than continue its deployment.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 36
  focus: The decision point is whether to send the task group in response to pressure on the Afghan Government and requests
    for support, or not to deploy it. The passage also states the intended command arrangement; exclude tactical details of
    the group’s operations.
  span_range:
  - src:f2d8c89ae30a#p245.5
  - src:f2d8c89ae30a#p245.6
  decision: The Prime Minister and Government decided in July 2005 to deploy a Special Forces Task Group to Afghanistan for
    a planned twelve months.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 37
  focus: The decision point is which force element to use in circumstances described as increasingly involving conventional
    warfare operations. The stated reasons concern suitability, equipment, experience and skills; exclude any tactical methods
    or details of particular operations.
  span_range:
  - src:f2d8c89ae30a#p247.11
  - src:f2d8c89ae30a#p248.2
  decision: The Chief of the Defence Force chose special forces, particularly commandos, rather than infantry for the described
    Afghanistan disruption operations.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 38
  focus: The decision point is whether to retain the larger mentoring presence and its forward basing or reduce and reposition
    the force as Afghan units assumed the security lead. The stated reason was that four mentored Afghan infantry Kandaks
    were conducting independent operations and had taken the lead in their areas; exclude the separate unresolved decision
    about a Special Forces mission beyond 2013.
  span_range:
  - src:f2d8c89ae30a#p249.7
  - src:f2d8c89ae30a#p249.8
  decision: Australian defence leadership shifted the Afghanistan force posture from a 680-person mentoring task force to
    a 330-person advisory task force and redeployed the last force elements from Uruzgan patrol and forward bases.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 39
  focus: The decision is whether to use civilian criminal processes or prosecute through Defence Force disciplinary offences
    or service tribunals. The Inquiry favors a single civilian pathway because some suspected perpetrators are no longer subject
    to military jurisdiction, the conduct and individuals overlap, and this route avoids potential complementarity and constitutional
    difficulties; exclude operational details of the alleged incidents.
  span_range:
  - src:f2d8c89ae30a#p284.9
  - src:f2d8c89ae30a#p285.2
  decision: The Inquiry recommends that the Australian Federal Police and Commonwealth Director of Public Prosecutions, rather
    than military authorities, handle war-crime investigations and prosecutions in civilian criminal courts.
  content_domain: other:criminal-justice-policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 40
  focus: The decision followed concerns that operational reports used vague descriptions and did not make clear what facts
    and perceptions supported an engagement. The alternative was to leave the existing ROE without this clarification; exclude
    the underlying operational decisions to engage individuals.
  span_range:
  - src:f2d8c89ae30a#p298.5
  - src:f2d8c89ae30a#p299.1
  decision: The Chief of the Defence Force decides to issue an ROE amplification order clarifying how to determine direct
    participation in hostilities.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 41
  focus: The directive followed concerns about ambiguous reporting and a need to guide field decision-making and command oversight.
    The alternative was to rely on the existing ROE without this additional guidance; exclude any specific engagement decision
    or tactical method.
