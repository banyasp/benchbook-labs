  focus: The decision point is the command-level choice among continued troubleshooting, ditching, and attempting a landing
    after the crew and maintenance concluded the nosewheel failure could not be fixed airborne. The report says the commander
    used a risk matrix and judged landing at the deployed location the safest option, with higher-authority support; exclude
    the pilot’s landing technique and control inputs.
