episodes:
- n: 1
  focus: The decision contrasted the existing dispersed reporting structure with a senior, centralized office, in response
    to the scale and complexity of DoD intelligence and the need to manage congressional funds appropriately. Treat this as
    an organizational-authority decision; exclude later operational intelligence reforms.
  span_range:
  - src:d8b9a67a626c#p1.7
  - src:d8b9a67a626c#p3.3
  decision: The Secretary of Defense chose to establish an Under Secretary of Defense for Intelligence to lead and oversee
    DoD intelligence.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The stated alternative was to approach the Senate and House intelligence committees. The Secretary’s rationale was
    that the proposal reorganized DoD rather than the broader Intelligence Community, and that the armed-services route was
    less likely to face a competing committee challenge; exclude speculation beyond the source’s stated political reasoning.
  span_range:
  - src:d8b9a67a626c#p3.5
  - src:d8b9a67a626c#p3.8
  decision: The Secretary of Defense chose the Senate Armed Services Committee as the initial congressional route for authorizing
    the proposed DoD intelligence reorganization.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision was between maintaining separate funding processes and combining them in a single program. The source
    gives resource-management and accounting rationales, including making exchanges among budget areas more effective; exclude
    details of the programs’ operational missions.
  span_range:
  - src:d8b9a67a626c#p5.6
  - src:d8b9a67a626c#p5.8
  decision: DoD officials chose to consolidate the JMIP and TIARA funding processes into the Military Intelligence Program.
  content_domain: other:defense-intelligence budgeting
  refusal_sensitivity: medium
