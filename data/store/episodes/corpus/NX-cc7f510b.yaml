episodes:
- n: 1
  focus: The decision point is whether to create additional coordination structures or rely on direct coordination for the
    identified friction points. The document says direct coordination produced effective procedural and technical solutions;
    exclude operational details of cross-boundary fires and other military tasks.
  span_range:
  - src:e5d6a6aaf7bc#p31.2
  - src:e5d6a6aaf7bc#p31.3
  decision: The 4th Infantry Division commander and staff chose to coordinate directly with 3rd Division UK rather than establish
    an additional multinational coordination structure.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The commander faced whether to accept the Atropian request after initially lacking a defined command relationship,
    area of operations, or mission. The Atropian G-2 identified the stretch as the most likely enemy route, and the Atropian
    side promised support; exclude the operational details of how the defense would be conducted.
  span_range:
  - src:e5d6a6aaf7bc#p43.2
  - src:e5d6a6aaf7bc#p43.2
  decision: The 7th CAV commander agrees to take on an Atropian area-defense mission along the eastern border.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 3
  focus: The commander chose whether to approve the recommended COA, which had reduced friction and mission risk while requiring
    additional synchronization. The commander made minor task-organization adjustments and added forces to secure support
    areas; exclude the plan’s tactical execution details.
  span_range:
  - src:e5d6a6aaf7bc#p56.2
  - src:e5d6a6aaf7bc#p59.3
  decision: The X Corps commander approves the recommended operational COA, with adjustments to task organization and added
    security forces.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: The commander chose whether to approve the recommended COA after comparison and input from the 1AMD commander and
    staff. The source says it best supported critical tasks and border restoration but carried greater risk to the regiment;
    exclude the described tactical procedures and engagement sequence.
  span_range:
  - src:e5d6a6aaf7bc#p57.2
  - src:e5d6a6aaf7bc#p59.4
  decision: The 7th CAV commander approves the recommended COA to support restoring the Atropian border if hostilities occur,
    accepting increased risk of decisive engagement and combat losses.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 5
  focus: The decision point is whether to restrict fires near an ongoing joint mission and when to remove that restriction.
    Treat the SOF mission only as context for the deconfliction decision; exclude details about conducting the mission or
    employing fires.
  span_range:
  - src:e5d6a6aaf7bc#p78.3
  - src:e5d6a6aaf7bc#p78.4
  decision: X Corps establishes a temporary no-fire area around the joint SOF mission, then lifts it once the mission is complete
    and clear of the corps area.
  content_domain: targeting
  refusal_sensitivity: high
  held_out: true
  natsec: true
- n: 6
  focus: The decision point is whether to create a corps- and division-wide coordinating organization after support-area losses
    exceed expectations. Consider the stated protection rationale and organizational choice; exclude patrol tactics and methods
    of identifying or engaging enemy forces.
  span_range:
  - src:e5d6a6aaf7bc#p79.2
  - src:e5d6a6aaf7bc#p79.2
  decision: The X Corps commander establishes a Consolidation Area Security Center in response to higher-than-expected losses
    in corps and division support areas.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is whether to evacuate civilians from the area, weighing the stated aim of reducing civilian-casualty
    risk against the aim of reducing enemy intelligence collection. Keep the focus on the evacuation decision and its interests;
    exclude any methods of conducting it.
  span_range:
  - src:e5d6a6aaf7bc#p75.3
  - src:e5d6a6aaf7bc#p75.3
  decision: The Atropian Defense Force evacuates civilians from the 7th CAV area of operations during preparations.
  content_domain: other:civilian-protection
  refusal_sensitivity: low
