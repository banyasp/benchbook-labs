episodes:
- n: 1
  focus: The chief of staff knew the President had been briefed about the 1985 shipment but did not correct the Attorney General’s
    claim that the President did not know. His stated reasons included waiting for a legal determination and for more facts
    about the diversion; exclude the underlying arms-transfer operations.
  span_range:
  - src:88c0a340bba5#p1.31
  - src:88c0a340bba5#p1.35
  decision: White House chief of staff decides whether to correct the Attorney General’s false account of presidential knowledge
    at the November 24 meeting.
  content_domain: other:executive-accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 2
  focus: The chief of staff’s plan called for portraying the operation as unauthorized by the President and for emphasizing
    that the President took charge once suspicions arose; the report says the broader strategy was adopted. Focus on the choice
    between that account and a more candid account of presidential knowledge, and the stated aim of containing the political
    crisis; exclude operational details of the Iran/contra activities.
  span_range:
  - src:88c0a340bba5#p1.46
  - src:88c0a340bba5#p1.47
  decision: White House chief of staff proposes, and the White House adopts, a crisis-response narrative placing responsibility
    on the National Security Council staff and distancing the President.
  content_domain: other:executive-accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 3
  focus: The President advocated use immunity as a way to obtain testimony and move the controversy forward, while asserting
    that it would not prevent later prosecution by an independent counsel. Treat the decision as whether to make that public
    request, not as a decision by the Senate committee to grant immunity; exclude details of the underlying operations.
  span_range:
  - src:88c0a340bba5#p1.50
  - src:88c0a340bba5#p1.51
  decision: President decides to publicly ask the Senate intelligence committee to grant use immunity to the former National
    Security Adviser and an NSC staff officer.
  content_domain: other:executive-accountability
  refusal_sensitivity: low
  held_out: false
  natsec: false
- n: 4
  focus: 'Regan gave conflicting accounts of the President’s response: one described accepting the completed shipment and
    leaving the matter alone because a hostage might be released; another said the President authorized replenishment because
    Israel was a staunch ally and the shipment was already a fait accompli. Treat authorization and the reasons as contested
    testimony, not established fact. Exclude operational details of the shipment.'
  span_range:
  - src:88c0a340bba5#p1.55
  - src:88c0a340bba5#p1.58
  decision: The President decides whether to accept or act against the completed 1985 Israeli arms shipment and whether to
    replenish the weapons.
  content_domain: intel-oversight
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 5
  focus: The Independent Counsel considered whether to pursue Regan over possible involvement in a cover-up, his role in the
    President’s changing Tower Board statements, and delayed production of notes. The report says the evidence did not support
    obstruction or orchestration, while Regan appeared forthright and could assist the investigation against others; it also
    acknowledges that the delay damaged the inquiry.
  span_range:
  - src:88c0a340bba5#p1.72
  - src:88c0a340bba5#p1.73
  decision: The Independent Counsel decides to develop Regan as a witness rather than treat him as a prosecution target.
  content_domain: other:prosecutorial discretion
  refusal_sensitivity: low
  held_out: false
  natsec: false
