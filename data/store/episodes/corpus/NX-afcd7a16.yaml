episodes:
- n: 1
  focus: The MP recalled most aircraft but allowed four, including this aircraft, to continue because their scheduled landing
    times were expected to be after the winds subsided. Focus on the command choice to recall or keep aircraft airborne and
    the weather/timing rationale; exclude flight-control procedures.
  span_range:
  - src:457047d1c8aa#p1.123
  - src:457047d1c8aa#p1.123
  decision: The MP, acting as Operations Supervisor, decided which aircraft would return to base after a forecast update indicated
    gusty winds.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 2
  focus: The waiver raised the launch limit from 2,250 to 2,550 pounds, allowing more fuel and increased flight time; the
    report also connects the higher weight to reduced climb capability in this mishap. Focus on the authority and policy tradeoff
    in granting the waiver; exclude aircraft-performance calculations and technical details.
  span_range:
  - src:457047d1c8aa#p1.169
  - src:457047d1c8aa#p1.172
  decision: USAFCENT decided to authorize a deployed-aircraft operational weight waiver allowing MQ-1Bs to launch above the
    ordinary weight limit.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
- n: 3
  focus: 'The report presents the choice as continuing the landing or attempting a go-around: the gust made a successful landing
    questionable, while the MP lacked information that the engine’s reduced thrust could make a go-around unsuccessful. Focus
    on the judgment under uncertainty and the safety tradeoff; exclude the mechanics of executing the maneuver.'
  span_range:
  - src:457047d1c8aa#p1.255
  - src:457047d1c8aa#p1.270
  decision: The MP decided to abort the landing and attempt a go-around after a gust made the landing appear unsafe.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
