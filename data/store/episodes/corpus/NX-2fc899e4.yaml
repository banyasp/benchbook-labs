- n: 4
  focus: 'The decision point is the DOJ’s proposed visa policy: eligibility based on material information rather than the
    S visa’s critical-information standard, along with an annual cap, work authorization, and a path to permanent status in
    humanitarian cases. The stated reasons include the S visa’s limited availability and criminal-case restriction, victims’
    legal and economic limbo, and the value of supporting victims who may serve as witnesses. Exclude operational law-enforcement
    methods and treat this as a proposal, not an enacted policy.'
  span_range:
  - src:499cc44ffd9d#p51.6
  - src:499cc44ffd9d#p52.4
  decision: The Department of Justice proposes creating a T visa in the upcoming crime bill, rather than relying on the limited
    S visa and temporary immigration measures, to give qualifying trafficking victims temporary status and work authorization.
