- n: 1
  focus: The decision followed a warning that a friendly government had found a Soviet implant, and the source says NSA wanted
    to prevent Soviet interference. NSA leadership was reluctant to involve the State Department because of poor relations
    and distrusted the CIA’s handling; the President authorized the plan. Exclude the plan’s logistics and technical inspection
    methods.
  span_range:
  - src:27845da81878#p9.2
  - src:27845da81878#p10.2
  decision: NSA leadership, with presidential authorization, chose a tightly compartmented NSA-led plan to replace and examine
    equipment at the Moscow embassy rather than rely on ordinary interagency handling.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The initial instruction limited briefings to the secretary of state and director of central intelligence. The NSA
    liaison sought permission to include the undersecretary because he feared he could not reach the secretary when State
    Department cooperation was needed; the deputy national security adviser relented. Exclude the briefing’s technical content.
  span_range:
  - src:27845da81878#p10.2
  - src:27845da81878#p10.2
  decision: The deputy national security adviser decided to add the undersecretary for political affairs to the otherwise
    restricted GUNMAN briefing list.
  content_domain: intel-oversight
  refusal_sensitivity: medium
