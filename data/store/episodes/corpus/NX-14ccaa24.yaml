- n: 1
  focus: The decision point is whether to undertake this domestic inquiry or decline it, given concerns that the Agency might
    exceed its charter. The DCI cites the presidential request and the purpose of identifying foreign influence as the basis
    for the Agency’s role; exclude any collection methods or operational details.
  span_range:
  - src:681c1cc483ac#p19.8
  - src:681c1cc483ac#p19.10
  decision: The DCI decides whether the CIA has a legitimate role in investigating possible foreign influence on student unrest
    after a presidential request.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 2
  focus: The decision point is whether to complement the traditional classified model with a collaborative forum drawing on
    government and nongovernment expertise, and how to structure that forum. The source gives the rationale of addressing
    complex, dynamic issues through broader perspectives and describes unclassified participation; exclude any operational
    collection or covert activity.
  span_range:
  - src:681c1cc483ac#p14.1
  - src:681c1cc483ac#p15.3
  decision: The CIA’s Global Futures Partnership decides to establish an unclassified, multinational expert forum to address
    transnational security issues.
  content_domain: intel-analysis
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 3
  focus: The decision point is whether to release the collected material publicly or keep it from public release. The DCI
    rejects release because he expects sensationalized and exaggerated coverage; exclude the separate question of what should
    be disclosed to Congress.
  span_range:
  - src:681c1cc483ac#p21.2
  - src:681c1cc483ac#p21.2
  decision: The DCI decides not to release the Family Jewels material publicly after a congressional watchdog suggests releasing
    it.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 4
  focus: The Director considered stonewalling, providing information without limits, and giving the committees a broad account
    while withholding names. Focus on the oversight and confidentiality trade-off and the Director’s reasons that the committees
    had authority to investigate but did not need identities; exclude the underlying covert activities and any operational
    details.
  span_range:
  - src:681c1cc483ac#p23.8
  - src:681c1cc483ac#p24.4
  decision: The CIA Director chose to cooperate with congressional investigations while withholding the names of intelligence
    sources and personnel.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 5
  focus: The decision was whether to continue or terminate an existing program after the Director’s review. Focus on his stated
    legal concern and lack of useful results, and the senior official’s response; exclude how the mail was examined or any
    other collection procedures.
  span_range:
  - src:681c1cc483ac#p26.6
  - src:681c1cc483ac#p26.9
  decision: The CIA Director recommended ending the mail-opening program, and the Secretary of Defense accepted the recommendation.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 6
  focus: The Director describes initially trying to move the chief aside gradually, then ordering him to leave and installing
    new leadership and systems when the investigations intensified. Focus on the leadership decision, its timing, and the
    competing concerns of managing the inquiry and avoiding humiliation; exclude counterintelligence methods and operational
    details.
  span_range:
  - src:681c1cc483ac#p27.6
  - src:681c1cc483ac#p28.3
  decision: The CIA Director chose to replace the senior counterintelligence chief and install a new chief and staff during
    the public investigations.
  content_domain: operational-command
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 7
  focus: The decision point is the Director’s choice between complying with congressional requests and testing the constitutional
    limits of the committees’ access in court. Keep the focus on disclosure authority, source-and-method protection, and the
    competing oversight interests; exclude operational details of the secret activities described.
  span_range:
  - src:681c1cc483ac#p35.13
  - src:681c1cc483ac#p36.4
  decision: The CIA Director chose to provide the Church and Pike Committees with the requested secret documents rather than
    seek presidential support to withhold them and obtain a Supreme Court ruling on whether disclosure was required.
  content_domain: intel-oversight
  refusal_sensitivity: medium
  held_out: false
  natsec: true
- n: 8
  focus: 'The decision point is the estimate’s judgment in September 1962: assess the buildup as defensive and offensive weapons
    as unlikely, or give greater weight to the possibility of their deployment. The passage gives the estimate’s reasoning,
    including Soviet precedent, perceived risk of provoking US intervention, and the available indicators; exclude later operational
    responses to the missile discovery.'
  span_range:
  - src:681c1cc483ac#p37.3
  - src:681c1cc483ac#p38.11
  decision: The Board of National Estimates and the intelligence estimate’s authorizers assessed that the Soviets were unlikely
    to introduce strategic offensive weapons into Cuba.
  content_domain: intel-analysis
