- n: 3
  focus: The decision point is whether to authorize regime change, in contrast with the earlier rapprochement policy. The
    memorandum cites concerns about Communist influence and the view that Castro’s removal could hasten the government’s fall;
    exclude the listed operational measures and do not treat the ambiguous wording about Castro’s “removal” as an authorization
    to assassinate him.
  span_range:
  - src:42dd0e26903a#p37.6
  - src:42dd0e26903a#p39.12
  decision: The Director of Central Intelligence approved a program whose stated objective was to overthrow Castro and replace
    his government with a U.S.-friendly junta.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
- n: 4
  focus: This is a command-structure decision made as the project grew in scale and complexity. Focus on the bypassed reporting
    channel and the stated concern that the division chief was not effective enough for a fast-moving operation; exclude the
