- n: 23
  focus: The memorandum weighs collective action through the Organization of American States against unilateral military action
    and recommends building support and pursuing a combination of measures before unilateral action. It cites treaty commitments
    and legitimacy concerns, while warning that delay could allow a communist-controlled government to become a fait accompli.
    Treat this as a proposed policy choice, not evidence that intervention was authorized or carried out; exclude operational
    plans or methods.
