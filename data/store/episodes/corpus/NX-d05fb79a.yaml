- n: 5
  focus: The decision point is the President’s choice about the scope and authorization of the proposed anti-Castro program.
    Consider his doubts about the effect of lost sugar revenue and his objection to focusing on economic sabotage; exclude
    any operational details of sabotage or paramilitary activity.
  span_range:
  - src:42dd0e26903a#p58.7
  - src:42dd0e26903a#p59.18
