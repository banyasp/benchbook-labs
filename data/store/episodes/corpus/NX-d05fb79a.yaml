- n: 2
  focus: 'The decision point is the CIA’s interim policy standard: treat the revolutionary government as basically non-Communist,
    support efforts toward rapprochement, and reconsider direct attacks only if the stated conditions arose. Exclude the mechanics
    of any covert activity and the later overthrow proposal, which is a separate decision point.'
  span_range:
  - src:42dd0e26903a#p36.17
  - src:42dd0e26903a#p37.5
