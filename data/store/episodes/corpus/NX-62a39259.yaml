- n: 2
  focus: 'The decision point is the Council’s response to the deteriorating humanitarian emergency, deliberate attacks, displacement,
    and obstruction of aid: designate a safe area and reinforce UNPROFOR’s presence, or take a different response. Include
    the resolution’s stated legal authority and humanitarian context; exclude later debates about tactical defense or how
    to use force.'
  span_range:
