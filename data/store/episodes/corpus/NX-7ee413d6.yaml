  focus: The members could accept the staff recommendation for an estimate that recognized the new difficulties, or resist
    commissioning it and soften the draft judgments; the account says they did the latter. It attributes the doubters’ position
    to a perceived interest in maintaining the view of a unified Communist threat and to their belief that the discord was
    a fraud; exclude operational intelligence collection and treat this explanation as the author’s attributed account.
