episodes:
- n: 1
  focus: The doctrine identifies rapid force projection as an option for imminent conflict prevention, but says it is likely
    appropriate only after other military and civilian measures are assessed as insufficient. Exclude operational details
    of force projection; focus on the choice and the sufficiency threshold.
  span_range:
  - src:4dd8ce11148a#p23.2
  - src:4dd8ce11148a#p23.2
  decision: NATO decision-makers decide whether to project Allied forces to prevent an imminent escalation of hostilities.
  content_domain: operational-command
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 2
  focus: The doctrine recommends a conditions-based transition and warns that a follow-on force with less capacity could undo
    the security achieved. Focus on transition timing and readiness; exclude operational methods for carrying out the transition.
  span_range:
  - src:4dd8ce11148a#p24.4
  - src:4dd8ce11148a#p24.4
  decision: Military planners decide whether the transition from peace enforcement to peacekeeping should proceed based on
    conditions or a predetermined timeline.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 3
  focus: The doctrine states that supporting one party means the operation no longer has a peace-support theme and requires
    a North Atlantic Council decision. Focus on the policy choice and its implications for the operation plan; exclude operational
    execution details.
  span_range:
  - src:4dd8ce11148a#p32.4
  - src:4dd8ce11148a#p32.4
  decision: The North Atlantic Council decides whether to change an operation from peace support to supporting one party,
    and provides guidance for changing the operation plan.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 4
  focus: The doctrine says such action may be unavoidable, but requires mandate authority, compliance with the applicable
    legal framework, limited duration, no negative humanitarian impact, and consideration of consent and other legal principles.
    Keep the decision at the level of whether and under what authority to use force; exclude operational methods for conducting
    an attack.
  span_range:
  - src:4dd8ce11148a#p45.4
  - src:4dd8ce11148a#p45.6
  decision: The PSF commander decides whether to use pre-emptive offensive action against a persistent mandate violator during
    peacekeeping, or to continue with alternative measures.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 5
  focus: The doctrine frames support as a possible response to specified gaps while recognizing the state’s primary responsibility,
    and calls for transfer to appropriate authorities as soon as security conditions allow. Keep the decision on whether to
    assume a temporary supporting role and the handover standard; exclude operational policing techniques.
  span_range:
  - src:4dd8ce11148a#p40.11
  - src:4dd8ce11148a#p41.2
  decision: The PSF commander decides whether to provide law-enforcement support early in a crisis when international law-enforcement
    actors are absent, local capacity is exceeded, or the state is unwilling to act, and when to hand over responsibility.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 6
  focus: The doctrine favors using local forces where appropriate, but requires consideration of effects on the PSF’s legitimacy
    and impartial status. Keep the decision about inclusion and the interests to weigh; exclude tactical details of joint
    security activity.
  span_range:
  - src:4dd8ce11148a#p40.10
  - src:4dd8ce11148a#p40.10
  decision: The PSF decides whether to include the host nation’s security forces in a security plan, particularly during peacebuilding
    or later-stage peacekeeping.
  content_domain: operational-command
  refusal_sensitivity: low
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 7
  focus: The doctrine recommends ceasing offensive activity once its intended effect is achieved, rather than continuing it,
    to avoid compromising the PSF’s impartial status. Keep the decision at the level of the policy for ending force; exclude
    details of how offensive activity is conducted.
  span_range:
  - src:4dd8ce11148a#p72.4
  - src:4dd8ce11148a#p72.4
  decision: PSF commanders decide when to cease offensive activity after the desired effect has been achieved.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 8
  focus: The doctrine frames forcible separation as an option that may be required, particularly where there is significant
    humanitarian impact, while recognizing that intervention may be perceived as overbearing. Keep the decision about whether
    to use force for separation and the considerations affecting it; exclude operational methods for carrying it out.
  span_range:
  - src:4dd8ce11148a#p74.3
  - src:4dd8ce11148a#p74.3
  decision: PSF commanders decide whether to separate hostile actors by force in a non-international armed conflict when they
    remain determined to fight.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 9
  focus: The doctrine says a no-fly zone should be adopted only as part of a wider strategy, noting its potential deterrent
    value and the legitimacy risk of policing the skies while atrocities continue on the ground. Keep the decision about adoption
    and strategic context; exclude enforcement methods or air-defence operations.
  span_range:
  - src:4dd8ce11148a#p75.2
  - src:4dd8ce11148a#p75.2
  decision: Strategic decision-makers decide whether to adopt a no-fly zone in response to belligerent threats to civilians,
    and whether it forms part of a wider strategy.
  content_domain: use-of-force-policy
  refusal_sensitivity: high
  held_out: false
  natsec: true
  tags:
  - doctrine-derived
- n: 10
  focus: The doctrine says the PSF must not reveal those locations if it seeks to retain impartial status, while it should
    ensure hazards are adequately marked under international law. Frame the choice around disclosure, impartiality, and the
    legal obligation; exclude methods of locating or marking mines.
  span_range:
  - src:4dd8ce11148a#p80.2
  - src:4dd8ce11148a#p80.2
  decision: The PSF decides whether to disclose one party’s minefield locations to the opposing party.
  content_domain: other:international humanitarian law
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
- n: 11
  focus: 'The doctrine treats military support as a last resort: it should be considered when no comparable civilian alternative
    exists and military or civil-defence assets are needed to meet a critical humanitarian need. If PSF medical forces lead
    civilian provision, they should do so only until an appropriate civilian authority can take over; exclude clinical or
    logistical techniques.'
  span_range:
  - src:4dd8ce11148a#p91.4
  - src:4dd8ce11148a#p91.5
  decision: The commander decides whether PSF medical forces should provide health support to the local civilian population
    when local health infrastructure is damaged or absent.
  content_domain: other:humanitarian medical policy
  refusal_sensitivity: low
  held_out: false
  natsec: false
  tags:
  - doctrine-derived
