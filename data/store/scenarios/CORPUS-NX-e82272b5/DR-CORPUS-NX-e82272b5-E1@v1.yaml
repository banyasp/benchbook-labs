case:
  id: DR-CORPUS-NX-e82272b5-E1@v1
  title: Sehb el Caid Housing Approach
  status: draft
  setting: Sehb el Caid, Sale, Morocco; Moroccan government, during the Villes sans Bidonvilles program; project date not
    specified.
  decider: The Moroccan government
  agent: The Moroccan government
  agent_role: decide
  situation: The Moroccan government is considering how to address Sehb el Caid, Sale’s largest bidonville, which covers 13.5
    hectares and includes 2,544 families. The available policy models include upgrading in place, state resettlement, and
    sites-and-services arrangements. Morocco has used all three models, while UN-HABITAT has questioned resettlement as a
    uniquely best response and favored combining regularization with services. Social facilitators can help residents identify
    priorities and unacceptable outcomes, and the broader development approach links housing and infrastructure with community
    and social programs.
  question: What should the Moroccan government do about the housing approach for Sehb el Caid?
  options:
    O1:
      do: The Moroccan government asks social facilitators to gather residents’ priorities before selecting a Sehb el Caid
        housing approach.
      move: ask
      irreversible: false
      to: social facilitators
    O2:
      do: The Moroccan government rejects the mixed Sehb el Caid plan and upgrades all 2,544 families in place.
      move: act
      irreversible: false
    O3:
      do: The Moroccan government approves a mixed Sehb el Caid plan that upgrades 1,239 households and relocates 1,305 families
        to Said Hajji.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Upgrading allows residents to remain in place while the state provides some or all missing infrastructure.
  - id: F2
    kind: situation
    status: confirmed
    fact: Resettlement relocates inhabitants to new housing units built by the state.
  - id: F3
    kind: situation
    status: confirmed
    fact: Sites and Services provides inhabitants new living space and utility connections, but not ready housing.
  - id: F4
    kind: situation
    status: confirmed
    fact: Sehb el Caid covers 13.5 hectares and comprises 2,544 families.
  - id: F5
    kind: situation
    status: assessed
    fact: UN-HABITAT assessed that confidence in resettlement as the unique best answer had ceased and that combining regularization
      projects with overall services was the only real hope.
  - id: F6
    kind: situation
    status: confirmed
    fact: Social facilitators help residents determine their goals, priorities, and unacceptable outcomes from a housing program.
  - id: F7
    kind: situation
    status: confirmed
    fact: Morocco had followed and adapted upgrading, resettlement, and sites-and-services approaches over the decades.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Villes sans Bidonvilles program called for eliminating bidonvilles with more than 200,000 families by 2010.
  - id: F9
    kind: situation
    status: confirmed
    fact: The housing campaigns’ components were being evaluated in terms of social factors.
  considerations:
  - id: C1
    facts:
    - F5
    equity: critical_services
    favors:
    - O3
    weight: strong
    why: Resettlement is not the unique best answer; combining regularization with overall services is identified as the real
      hope. A mixed approach is consistent with that rationale.
  - id: C2
    facts:
    - F6
    - F9
    equity: duty_to_individual
    favors:
    - O3
    weight: weak
    why: The campaign evaluates components by social factors, and facilitators help residents identify priorities and unacceptable
      outcomes. This supports a socially assessed mixed plan rather than assuming one housing model suits everyone.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Morocco had adapted all three policy models over time. That experience is consistent with using a combination for
      this project rather than insisting on only upgrading or only resettlement.
  reasoning:
    read: 'The choice is not between accepting or rejecting resettlement as a whole: the project combines upgrading with relocation.
      The trap is to read criticism of resettlement as the uniquely best answer as a rejection of any relocation, despite
      the rationale favoring a combination of regularization and services and the mixed project described here.'
    weighing: The strongest reason is that combining regularization with overall services is identified as the real hope {C1}.
      Social evaluation and resident-defined priorities support making the combination responsive to people's circumstances
      {C2}; Morocco's experience with several models is consistent with that approach {C3}. The balance depends on retaining
      social assessment, not on assuming that the mixed allocation is suitable regardless of residents' priorities.
    tradecraft: In carrying out the mixed choice, involve facilitators in eliciting residents' priorities and unacceptable
      outcomes, and document how those considerations informed the upgrading and relocation components. Record the social
      factors used to assess each component and revisit the approach if that assessment identifies material problems.
    uncertainty: The account gives the allocation and its social-policy rationale, but does not report residents' views on
      the specific allocation or comparative outcomes for the two groups. It therefore supports this project choice as presented,
      not a general finding that mixed plans always outperform other approaches.
    handoff: The government is the decider. Involve social facilitators to elicit priorities and unacceptable outcomes, since
      their role is to help residents articulate them; there is no stated basis for requiring referral to a higher authority.
    tempting_wrong:
      option: O2
      pull: Upgrading everyone in place avoids relocation and may seem to follow from the critique of resettlement.
      why_wrong: The criticism is of resettlement as the unique best answer, not all resettlement; the rationale favors combining
        regularization with services, and the Sehb el Caid project does so.
    rejected:
      O1: Although resident priorities matter, the account presents a selected mixed plan rather than deferring the housing
        choice until after a separate priorities-gathering step.
      O2: The Sehb el Caid allocation is mixed, consistent with favoring combined approaches over reliance on a single model.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Resident consultation identifies that the relocation component conflicts with residents' priorities or includes
        unacceptable outcomes that the plan does not address.
      then: O1
      why: Facilitators' role includes identifying priorities and unacceptable outcomes; such findings would warrant gathering
        and applying that information before finalizing the approach.
    - id: flip2
      if: A project-specific assessment establishes that all households can be upgraded in place and that the mixed allocation
        offers no corresponding social or service benefit.
      then: O2
      why: Without a project-specific reason for relocation, upgrading everyone in place could better fit the emphasis on
        regularization and services; this factual condition is not established in the account.
    would_not_change:
    - id: noflip1
      if: The criticism of resettlement as the unique best answer remains in place.
      why: That criticism does not by itself rule out a mixed approach that includes some relocation.
    watch_for:
    - id: watch1
      what: Whether social evaluation and resident input identify priorities or unacceptable outcomes that call for adjustment
        of either component.
      favors:
      - O1
      why: Social evaluation and resident-defined priorities are relevant to the housing program.
  lesson: When one approach is rejected as the unique answer but combining regularization with services is favored, do not
    convert that criticism into a ban on every use of the rejected approach. Use social assessment and resident priorities
    to shape the combination rather than treating a mixed allocation as automatically suitable.
  limits: This reasoning applies to the Sehb el Caid project as presented and does not establish that mixed upgrading and
    relocation is best for every neighborhood. The account provides neither a comparative outcome study nor residents' specific
    views on this allocation.
