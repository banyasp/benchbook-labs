case:
  id: DR-CORPUS-NX-43d97d6b-E4@v1
  title: Whether to Continue After Operation Freshman
  status: draft
  setting: Vidda and the Norsk Hydro plant, Norway, after Operation Freshman failed; British SOE, 1942–1943
  decider: The British SOE
  agent: The British SOE
  agent_role: decide
  situation: Operation Freshman, a British effort to disrupt heavy-water production at Norsk Hydro, had failed in Nazi-occupied
    Norway. Several participants had died, and injured survivors had been captured, interrogated, and executed. Nazi forces
    had found a map marked with the Grouse Group around the plant, and a four-person Norwegian team remained in the area under
    the name Swallow. The local British-supported resistance faced a threat, and Norwegian intelligence networks were under
    pressure. The urgency of disrupting production and the possibility that Nazi defenses would harden were part of the situation
    facing the SOE.
  question: What should the British SOE do about continuing the effort to disrupt heavy-water production after Operation Freshman
    failed?
  options:
    O1:
      do: The British SOE should discontinue the effort to disrupt heavy-water production at Norsk Hydro.
      move: act
      irreversible: false
    O2:
      do: The British SOE should continue the effort to disrupt heavy-water production at Norsk Hydro.
      move: act
      irreversible: false
    O3:
      do: The British SOE should defer the effort and reassess whether to continue it.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Operation Freshman failed in Nazi-occupied Norway, with several dead and injured survivors captured, interrogated,
      and eventually executed.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: Nazi forces found a map marked with the Grouse Group around the plant.
  - id: F3
    kind: capability
    status: confirmed
    fact: A four-person Norwegian team remained on the ground in the area and was renamed Swallow after Grouse was compromised.
  - id: F4
    kind: situation
    status: assessed
    fact: The local British-supported resistance faced a threat, and Norwegian intelligence networks were under pressure.
  - id: F5
    kind: situation
    status: assessed
    fact: Disrupting Nazi heavy-water production was considered urgent.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The SOE assessed that Nazi forces would likely harden their defenses after the failed operation.
  - id: F7
    kind: intelligence
    status: assessed
    fact: British plans for a raid in June 1942 were based on intelligence that the Nazi regime wanted to increase heavy-water
      production.
  considerations:
  - id: C1
    facts:
    - F5
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Disrupting heavy-water production was considered urgent, against the intelligence that the Nazi regime wanted to
      increase production; the SOE treated that urgency as a reason to continue.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: source_protection
    favors:
    - O2
    weight: strong
    why: The map's discovery threatened the local British-supported resistance and put Norwegian intelligence networks under
      pressure. The source gives that danger as creating immediacy for another effort, rather than as a reason to abandon
      it.
  - id: C3
    facts:
    - F6
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The SOE assessed that Nazi defenses would likely harden after the failed operation, adding a reason not to delay
      the effort.
  reasoning:
    read: 'This was a compromised and costly failed effort, not a clean opportunity to proceed: participants had been killed
      or captured, the map exposed the operation, and a Norwegian team remained in the area. The trap is to treat stopping
      as automatically safer; the SOE instead treated the threat to the resistance and intelligence networks, and the urgency
      of disrupting production, as reasons for immediacy.'
    weighing: 'The source''s stated reasons favor {O2}: disruption was urgent, the local resistance and intelligence networks
      were under pressure, and the SOE expected defenses might harden. The source does not set out a separate balancing test
      or quantify the danger of continuing; the judgment depends on the assessed urgency and network threat remaining substantial.'
    tradecraft: At the decision level, record the mission purpose, the exposure and personnel losses, the assessed threat
      to the local network, and why urgency justifies continuing despite those risks. Reassess if those underlying assessments
      change; do not treat the failed attempt alone as proof that either continuation or abandonment is required.
    uncertainty: The expectation that defenses would likely harden was prospective, not an established fact. The available
      account does not establish how much further risk the remaining team faced or whether a renewed effort would succeed.
    handoff: The SOE was the deciding office in the account. No higher approval or referral is identified; coordination with
      the relevant Norwegian resistance counterpart is a prudent decision practice given the continuing local-network risk,
      not a stated source requirement.
    tempting_wrong:
      option: O1
      pull: The failed raid had caused deaths and exposed the local network, making discontinuation appear to avoid further
        danger.
      why_wrong: 'That response gives insufficient weight to the source''s stated reasons for immediacy: pressure on the network
        and the urgent need to disrupt production.'
    rejected:
      O1: The SOE did not discontinue the effort, treating the network threat and urgency of disrupting production as reasons
        to continue.
      O3: The SOE sought to continue rather than defer, with urgency and the expectation that defenses might harden weighing
        against delay.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable reassessment showed that disrupting production was no longer urgent and that delay would not materially
        worsen the opportunity.
      then: O3
      why: Without the stated urgency or a time-sensitive reason to act, deferring to reassess could be preferable.
    - id: flip2
      if: The danger to the remaining local network became so severe that continuing offered no reasonable prospect of mission
        effect.
      then: O1
      why: That would reverse the balance by making further exposure disproportionate to the prospect of achieving the mission.
    would_not_change:
    - id: noflip1
      if: The failed raid and discovery of the map remained the only new information, without a changed assessment of urgency
        or network danger.
      why: Those circumstances were already present when the SOE chose to continue; they do not alone overturn the source's
        stated reasons for that choice.
    watch_for:
    - id: watch1
      what: Whether the assessment that Nazi defenses would likely harden after the failed operation remains credible.
      favors:
      - O2
      why: A credible expectation of hardening makes delay more costly and supports the source's reason for continuing.
  lesson: A failed operation and exposure of a local network are serious reasons to reassess, but they do not automatically
    require abandonment. When the source identifies continuing network pressure and a time-sensitive mission need as reasons
    for immediacy, continuation may be justified if those assessments still hold.
  limits: This reasoning applies to the SOE's stated decision in this historical situation, not to every operation involving
    an exposed network or a failed attempt. The source gives no general legal rule, quantified risk threshold, or account
    of the subsequent operation's outcome here.
  library:
    domain: military-operational
    family: CORPUS-NX-43d97d6b
    source: https://jsouapplicationstorage.blob.core.windows.net/press/424/Perilous%20Future_web.pdf
    episode_focus: The decision point is whether to abandon the effort or pursue another operation after the failed raid exposed
      and threatened the local resistance network. The source cites that threat, pressure on the intelligence networks, and
      the urgency of disrupting production as reasons to continue; exclude the insertion method and sabotage mechanics.
    cues:
      option_words:
        O1: 14
        O2: 14
        O3: 13
      real_option: O2
      real_to_mean_other_length: 1.04
      real_is_longest: true
      moves:
        O1: act
        O2: act
        O3: hold
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
        O3: false
    equities: pilot2
