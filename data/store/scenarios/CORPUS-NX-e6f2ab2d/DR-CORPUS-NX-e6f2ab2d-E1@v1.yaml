case:
  id: DR-CORPUS-NX-e6f2ab2d-E1@v1
  title: Public or Closed Commission Sessions
  status: draft
  setting: During the Commission's investigation of CIA activities; the Commission
  decider: The Commission
  agent: The Commission
  agent_role: decide
  situation: The Commission is investigating CIA intelligence and counterintelligence activities. Those activities are sensitive
    and have a critical relationship to national security. The Commission is responsible for examining serious questions of
    legality and propriety within its assigned area. It recognizes an obligation to assure the American people that those
    questions receive careful investigation and analysis. It also recognizes that closed sessions would heighten its obligation
    to conduct a diligent investigation. The format of the sessions remains to be chosen.
  question: What should the Commission do about public access to its sessions while investigating the CIA activities?
  options:
    O1:
      do: The Commission holds its investigative sessions in public.
      move: act
      irreversible: false
    O2:
      do: The Commission holds its investigative sessions in closed session.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The CIA's intelligence and counterintelligence activities are sensitive.
  - id: F2
    kind: situation
    status: confirmed
    fact: The CIA's intelligence and counterintelligence activities have a critical relationship to national security.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Commission has an assigned area of responsibility concerning serious questions of legality and propriety.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Commission recognizes an obligation to assure the American people that serious questions of legality and propriety
      within its assigned area are carefully investigated and analyzed.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Commission recognizes that closed sessions heighten its obligation to conduct a diligent investigation.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Commission's sessions are under consideration for closure to the public.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The sensitivity of the CIA's intelligence and counterintelligence activities, and their critical relationship to
      national security, support holding sessions closed.
  - id: C2
    facts:
    - F3
    - F4
    equity: public_transparency
    favors:
    - O1
    weight: weak
    why: The Commission recognized a responsibility to assure the American people that serious legality and propriety questions
      receive careful investigation and analysis. That supports public accountability, but the stated responsibility concerns
      the diligence of the inquiry, not public access to sessions.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Closure heightens the Commission's obligation to investigate diligently; it does not remove its assigned responsibility
      or its duty to provide assurance that the questions are carefully investigated and analyzed.
  reasoning:
    read: The Commission must choose a session format for an inquiry into sensitive activities tied critically to national
      security. The trap is to treat public access as the only way to meet the public-assurance obligation, or to treat closure
      as relieving the Commission of that obligation.
    weighing: The sensitivity and national-security relationship favor closed sessions {C1}. The Commission's responsibility
      to assure the American people of careful investigation is an important counterweight {C2}, but the stated responsibility
      does not require public sessions. Instead, closure heightens the obligation to investigate diligently {C3}; the Commission
      chose closure while retaining that obligation. The balance rests on the stated sensitivity and national-security relationship,
      together with the Commission's continued commitment to careful investigation.
    tradecraft: Record the choice and its stated national-security rationale, together with the heightened obligation to investigate
      diligently and provide the assurance identified in {F4}. Do not treat closure itself as a substitute for that obligation.
    uncertainty: The stated reasons establish the Commission's choice in these circumstances, but do not specify a general
      threshold for when sensitivity or national-security concerns would no longer justify closure.
    handoff: The Commission makes this choice as the body conducting the investigation; the stated reasons do not identify
      a separate authority whose approval is required.
    tempting_wrong:
      option: O1
      pull: Public sessions may seem the clearest way to demonstrate accountability to the American people.
      why_wrong: The Commission's stated assurance concerns careful investigation and analysis, not a requirement that sessions
        be public; it chose to protect the sensitive, national-security-related activities from public session access while
        retaining a heightened duty of diligence.
    rejected:
      O1: The Commission did not choose public sessions because it considered the activities' sensitivity and national-security
        relationship sufficient reason to close its sessions, while retaining its duty of diligent investigation.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The activities were no longer sensitive and no longer had a critical relationship to national security.
      then: O1
      why: The stated grounds for closing the sessions would be absent, making public access the stronger choice in light
        of the Commission's public-assurance responsibility.
    would_not_change:
    - id: noflip1
      if: The Commission continued to recognize its obligation to assure the public that serious legality and propriety questions
        were carefully investigated and analyzed.
      why: That obligation can be met alongside closed sessions; closure heightens the duty of diligence rather than eliminating
        it.
    watch_for:
    - id: watch1
      what: Whether the activities under investigation remain sensitive and critically related to national security.
      favors:
      - O2
      why: Those are the Commission's stated grounds for closing its sessions.
  lesson: When sensitive national-security matters justify closed sessions, public assurance may rest on diligent investigation
    rather than public access to the sessions. Closure heightens the duty to investigate carefully; it does not discharge
    that duty.
  limits: This reasoning applies to the stated circumstances of sensitive CIA intelligence and counterintelligence activities
    with a critical relationship to national security. It does not establish that every national-security inquiry should be
    closed or define a general legal test for closure.
  library:
    domain: intel-oversight
    family: CORPUS-NX-e6f2ab2d
    source: https://www.aarclibrary.org/publib/church/rockcomm/pdf/RockComm_Preface.pdf
