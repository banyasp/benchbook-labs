case:
  id: DR-CORPUS-INC-URUZGAN-CONVOY-STRIKE-21-FEBRUARY-2010-NX-55e3aba8-E1@v1
  title: Imminent-Threat Engagement Decision
  status: draft
  setting: Shaheed Hassas, Uruzgan; 210848LFEB10; TFU/KAF
  decider: The unidentified human decision-maker responsible for the engagement
  agent: The human decision-maker responsible for the engagement
  agent_role: decide
  situation: At 210848LFEB10, three vehicles were located northwest of FOB Cobra in Shaheed Hassas, Uruzgan. Each vehicle
    was assessed to contain seven insurgents. UAV and ICOM information indicated an imminent attack on the ground force commander
    by a Taliban commander and insurgents. The individual decision-maker, approval chain, and governing authority are not
    identified.
  question: What should the human decision-maker responsible for the engagement do about the three vehicles?
  options:
    O1:
      do: The decision-maker requests clarification from the reporting personnel.
      move: ask
      irreversible: false
      to: the reporting personnel
    O2:
      do: The decision-maker authorizes engagement against the vehicles.
      move: act
      irreversible: true
    O3:
      do: The decision-maker declines engagement against the vehicles.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Three vehicles were present.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Each vehicle was assessed to contain seven insurgents.
  - id: F3
    kind: intelligence
    status: assessed
    fact: UAV and ICOM information indicated an imminent attack on the ground force commander.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The indicated attack was attributed to a Taliban commander and insurgents.
  - id: F5
    kind: situation
    status: confirmed
    fact: The location was northwest of FOB Cobra in Shaheed Hassas, Uruzgan.
  - id: F6
    kind: situation
    status: confirmed
    fact: The recorded time was 210848LFEB10.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The indicated imminent attack on the ground force commander by a Taliban commander and insurgents was the recorded
      reason for engaging, directly implicating the safety of the force.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The assessment that the vehicles held insurgents, together with the reported imminent attack, supports acting to
      prevent the attack; the record does not separately state a mission-effect analysis.
  - id: C3
    facts:
    - F3
    equity: tempo
    favors:
    - O2
    weight: weak
    why: Because the reported threat was imminent, delay for clarification could matter; this is an implication of the threat
      assessment, not a separately stated rationale.
  reasoning:
    read: The decision rests on an assessed imminent threat, not on a recorded finding that an attack had already occurred.
      The trap is treating the assessment as certainty, or treating the absence of identified approval and legal standards
      as proof that either was or was not satisfied.
    weighing: The recorded reason for engagement is the UAV and ICOM indication of an imminent attack on the ground force
      commander by a Taliban commander and insurgents {C1}. The assessed presence of insurgents in the vehicles and the time-sensitive
      threat support acting rather than delaying, but the record offers no separate analysis of mission effect, tempo, civilian
      risk, or the reliability of the assessment {C2} {C3}. The balance depends on whether the imminent-threat assessment
      was sufficiently reliable and whether the decision-maker had authority to act.
    tradecraft: At decision time, distinguish reported indications from confirmed facts, verify the applicable authority and
      any required approval, and record the threat assessment and the basis for the choice. Do not infer a legal standard
      or approval chain from this record.
    uncertainty: The record does not identify the decision-maker, approval chain, governing authority, applicable rules, civilian
      presence, or any further assessment of the intelligence. It records the imminent-threat assessment as the reason for
      engagement, but not how that assessment was evaluated.
    handoff: The record does not say whom the decision-maker consulted. In practice, involve the required approval authority
      or chain of command if the decision-maker's authority or the applicable threshold is uncertain; the source does not
      establish what that authority was.
    tempting_wrong:
      option: O1
      pull: Requesting clarification could reduce uncertainty before an irreversible choice.
      why_wrong: On the source's stated rationale, delay was less suitable because the reported attack was imminent; the record
        does not establish that clarification was unavailable or that it would have been too slow.
    rejected:
      O1: Clarification was not chosen because the recorded basis for acting was an indicated imminent attack on the ground
        force commander.
      O3: Declining engagement was not chosen because the recorded assessment indicated an imminent attack by the reported
        adversaries.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The imminent-threat assessment were materially undermined before the decision.
      then: O1
      why: Without the recorded basis for urgency, seeking clarification would be a reasonable alternative before an irreversible
        engagement.
    - id: flip2
      if: The decision-maker learned that required approval had not been obtained or that the decision-maker lacked authority
        to authorize engagement.
      then: O1
      why: The record does not identify the authority; a known approval or authority gap would require pausing or referring
        the decision rather than proceeding.
    would_not_change:
    - id: noflip1
      if: The assessment that each vehicle contained seven insurgents remained unchanged, but the imminent-attack assessment
        was absent.
      why: The recorded reason for engagement was the indicated imminent attack, so the assessed number of insurgents alone
        would not supply that stated rationale.
    watch_for:
    - id: watch1
      what: Any updated information that changes whether an attack on the ground force commander is imminent.
      favors:
      - O1
      - O3
      why: The source's stated basis for acting is the assessment of an imminent attack; a change to that assessment could
        alter the balance.
  lesson: An assessed imminent threat can support timely action to protect one's force, but an assessment is not certainty.
    Verify the applicable authority and threshold, and make clear what information supports the urgency of the decision.
  limits: This reasoning applies only to the recorded decision and its stated imminent-threat rationale. The source gives
    no governing legal standard, approval chain, civilian-risk assessment, or review finding, so it does not establish whether
    the engagement complied with any particular rule.
