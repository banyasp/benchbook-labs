case:
  id: DR-CORPUS-INC-URUZGAN-CONVOY-STRIKE-21-FEBRUARY-2010-NX-ceb711f3-E1@v1
  title: Decision on Engagement of Armed Personnel
  status: draft
  setting: Shahid Hassas District, Oruzgan Province, 21 February 2010; Operation Noble Justice; Ground Force Commander
  decider: The Ground Force Commander
  agent: The Ground Force Commander
  agent_role: decide
  situation: In Shahid Hassas District, Oruzgan Province, the Ground Force Commander faced a decision about reported armed
    personnel moving toward the objective. The available information included communications reporting, human intelligence,
    and video imagery. The personnel were assessed to number about 30 and to be armed. They were assessed to be 12 kilometers
    west of the objective and moving to reinforce it.
  question: What should the Ground Force Commander do about authorizing engagement of the armed personnel reported to be moving
    toward the objective?
  options:
    O1:
      do: The Ground Force Commander declines to authorize engagement of the armed personnel moving toward the objective.
      move: act
      irreversible: false
    O2:
      do: The Ground Force Commander authorizes engagement of the armed personnel moving toward the objective.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The reported location was Shahid Hassas District, Oruzgan Province, 12 kilometers west of Khod Village.
  - id: F2
    kind: intelligence
    status: assessed
    fact: About 30 armed men were identified in the available intelligence.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Communications reporting was received concerning the operation.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Human intelligence from the objective was available.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: Video imagery was available concerning the armed men.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The men were assessed to be moving from the west to reinforce the target.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The men were assessed to be 12 kilometers west of the objective and working toward it.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Communications reporting, human intelligence from the objective, and video imagery together supported positive identification
      of the personnel.
  - id: C2
    facts:
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The assessed group was about 30 armed men, which the Ground Force Commander treated as an enemy force rather than
      an unarmed gathering.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The men were assessed to be moving toward the objective to reinforce it, giving the proposed engagement a direct
      operational purpose.
  reasoning:
    read: This was a decision about reported armed personnel assessed to be moving from 12 kilometers west to reinforce the
      objective, not simply about the presence of armed men. The trap is to treat that assessment as proof of an imminent
      attack or, in the other direction, to treat the distance from the objective as proof that the group posed no operational
      threat.
    weighing: The Ground Force Commander’s stated basis for O2 was the combination of communications reporting, human intelligence,
      and video imagery positively identifying about 30 armed men moving to reinforce the target. Those reported facts support
      O2 in the Commander’s judgment. The balance depends on the reliability of that identification and the assessment that
      the group was actually moving to reinforce the target; no applicable rules-of-engagement threshold or separate legal
      analysis is specified here.
    tradecraft: Before acting, confirm the decision-maker’s authority and the applicable rules of engagement, test that the
      information supports the stated assessment, and record the decision-time basis and material uncertainties. Do not treat
      a later outcome as a substitute for the ex ante assessment.
    uncertainty: The available account does not specify the governing use-of-force standard, an imminence finding, a proportionality
      assessment, or a decision-time assessment of civilian risk. It also does not describe the confidence limits or potential
      contradictions in the intelligence.
    handoff: The decision is attributed to the Ground Force Commander, and no separate approval is identified. Any unresolved
      question about delegated authority or the applicable use-of-force standard should be referred to the responsible command
      or legal authority rather than inferred from the order alone.
    tempting_wrong:
      option: O1
      pull: The group was assessed to be 12 kilometers west of the objective, and the account does not articulate an imminent
        attack.
      why_wrong: That concern does not displace the stated assessment that multiple information sources identified a large
        armed group moving to reinforce the target; the Commander treated that operational movement as sufficient reason to
        order engagement.
    rejected:
      O1: The Ground Force Commander did not choose to decline engagement because the reported information identified about
        30 armed men moving to reinforce the target.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The information no longer reliably supported the identification of the group as armed personnel.
      then: O1
      why: The principal factual basis for treating the group as an engagement target would be materially weakened.
    - id: flip2
      if: The assessment that the group was moving to reinforce the target were disproved.
      then: O1
      why: The stated operational reason for engaging the group would no longer hold.
    - id: flip3
      if: The applicable rules of engagement or other governing legal standard did not permit engagement on these facts.
      then: O1
      why: Operational relevance would not override a binding limit on the use of force.
    would_not_change:
    - id: noflip1
      if: The group remained 12 kilometers west while the identification and assessment that it was moving to reinforce the
        target remained reliable.
      why: Distance alone would not negate the stated operational significance of the group’s assessed movement.
    watch_for:
    - id: watch1
      what: Whether the assessment that the group was moving to reinforce the target is reliable, rather than merely an untested
        interpretation of its movement.
      favors:
      - O1
      why: If that assessment is weak, the operational justification for O2 is correspondingly weaker.
  lesson: A commander may weigh convergent information identifying an armed group and its assessed movement to reinforce an
    objective as a reason to authorize engagement. That operational assessment does not replace the need to satisfy the applicable
    legal and rules-of-engagement standard.
  limits: This reasoning reflects the recorded decision basis, not an independent finding that the engagement was lawful or
    that the intelligence was accurate. The account does not provide the governing use-of-force standard or a decision-time
    civilian-risk assessment.
