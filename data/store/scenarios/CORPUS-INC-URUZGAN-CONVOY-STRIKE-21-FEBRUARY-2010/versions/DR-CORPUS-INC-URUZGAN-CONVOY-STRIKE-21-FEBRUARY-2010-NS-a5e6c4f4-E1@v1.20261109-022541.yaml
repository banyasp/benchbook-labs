case:
  id: DR-CORPUS-INC-URUZGAN-CONVOY-STRIKE-21-FEBRUARY-2010-NS-a5e6c4f4-E1@v1
  title: Whether to Use Force Against a Convoy
  status: draft
  setting: Near Khod, Uruzgan province, Afghanistan, February 21, 2010; U.S. special forces.
  decider: The U.S. special forces decision-maker
  agent: The U.S. special forces decision-maker
  agent_role: decide
  situation: Near Khod in Uruzgan province, U.S. special forces faced a convoy of vehicles. They believed it was a Taliban
    force attempting to flank their position. The decision was whether to use force against the convoy or withhold the strike.
    Two children were seen among the vehicles before the strike, though what information reached the force decision-maker
    is not specified.
  question: What should the U.S. special forces decision-maker do about using force against the convoy believed to be a Taliban
    force attempting to flank the U.S. position?
  options:
    O1:
      do: The U.S. special forces decision-maker declines the strike against the convoy.
      move: act
      irreversible: false
    O2:
      do: The U.S. special forces decision-maker authorizes the strike against the convoy.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The contemplated use of force occurred on February 21, 2010.
  - id: F2
    kind: situation
    status: confirmed
    fact: The incident was near Khod in Uruzgan province, Afghanistan.
  - id: F3
    kind: situation
    status: confirmed
    fact: The convoy consisted of civilian vehicles.
  - id: F4
    kind: intelligence
    status: assessed
    fact: U.S. special forces mistook the convoy for a Taliban force.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The force was believed to be attempting to flank the U.S. position.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Two children were seen among the vehicles before the strike.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The convoy consisted of civilian vehicles, yet the force mistook it for a Taliban force. The investigation treated
      that misidentification as part of the failure leading to the strike.
  - id: C2
    facts:
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Two children were seen among the vehicles before the strike. This is a significant civilian-risk indicator, although
      the source does not establish whether it reached the special forces decision-maker.
  - id: C3
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: The force believed the convoy was a Taliban force attempting to flank its position, creating a perceived force-protection
      concern; the finding that the convoy was misidentified limits the weight of that belief.
  reasoning:
    read: The convoy was made up of civilian vehicles, but the force assessed it as a Taliban force trying to flank its position.
      The trap is to treat that assessed threat as established fact; the source identifies a misidentification, and two children
      were seen before the strike, though what the decision-maker knew about them is unspecified.
    weighing: The military investigation's account makes the misidentification and civilian risk central to the failure that
      led to the strike. The perceived flanking threat weighs in favor of force, but the source does not establish that the
      convoy was hostile or that the children’s presence was conveyed to the decision-maker. On the stated record, the civilian-risk
      reasons support withholding force over acting on the mistaken assessment.
    tradecraft: Before deciding, separate what is confirmed from what is assessed, record the basis for the hostile-force
      belief and any known civilian indicators, and preserve the uncertainty in the decision record. Do not treat unverified
      threat identification as confirmation.
    uncertainty: The source does not specify what information about the children reached the decision-maker, what other information
      was available, or what rules of engagement or approval requirements applied.
    handoff: The source does not identify a required approval authority. If the decision-maker cannot resolve the uncertainty
      within their authority, refer it through the responsible command chain rather than assume that the perceived threat
      settles the decision.
    tempting_wrong:
      option: O2
      pull: The belief that a Taliban force was attempting to flank the position creates pressure to act to protect U.S. forces.
      why_wrong: The investigation identifies the convoy as civilian vehicles that were mistaken for a Taliban force, so the
        perceived threat alone does not overcome the stated civilian-risk evidence.
    rejected:
      O2: The investigation's account of the civilian convoy being misidentified and the resulting civilian deaths supports
        declining the strike rather than acting on the mistaken assessment.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable additional information established that the convoy was hostile and posed an immediate threat to the U.S.
        position.
      then: O2
      why: That would materially strengthen the force-protection reason for acting and reduce the central uncertainty about
        the mistaken identification, though civilian risk would still require consideration.
    would_not_change:
    - id: noflip1
      if: The decision-maker had only the same uncorroborated belief that the convoy was Taliban attempting to flank the position.
      why: The source identifies that belief as a mistaken assessment of a civilian convoy; repeating the assessment without
        stronger support does not resolve the central concern.
    watch_for:
    - id: watch1
      what: Whether the observation that two children were among the vehicles was conveyed to the decision-maker.
      favors:
      - O1
      why: The children’s presence heightens the civilian-risk concern if it was known at the decision point; the source does
        not say whether it was.
  lesson: Do not equate a perceived hostile intent with a confirmed hostile identity, especially when the available account
    includes civilian indicators. Where the assessment may be mistaken and the consequences of force are irreversible, unresolved
    uncertainty weighs toward withholding force.
  limits: The source does not provide the applicable rules of engagement, the full information available to the decision-maker,
    or the decision-maker’s account. This reasoning should not be treated as a finding about what legal standard applied or
    as a general rule that force must always be withheld when uncertainty exists.
