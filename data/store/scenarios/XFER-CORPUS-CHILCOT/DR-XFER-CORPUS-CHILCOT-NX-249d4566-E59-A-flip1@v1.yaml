case:
  id: DR-XFER-CORPUS-CHILCOT-NX-249d4566-E59-A-flip1@v1
  title: Fitness Assessment for the Civilian Expeditionary Workforce
  status: draft
  setting: Department of Defense Civilian Expeditionary Office, March 2012, concerning civilian personnel deploying to or
    visiting forward operating locations.
  decider: Civilian Expeditionary Office officials
  agent: Civilian Expeditionary Office officials
  agent_role: decide
  situation: The Civilian Expeditionary Office is reviewing its medical-clearance and combat-skills-training procedures for
    civilians who deploy to or visit forward operating locations. There are concerns that some personnel may not be capable
    of meeting the physical demands of those locations. The department's medical authority has advised that pre-assignment
    confirmation could not be carried out reliably or safely under the available procedure. The review concerns both the timing
    of medical fitness confirmation and the role of training instructors in commenting on fitness to deploy. The office must
    determine how those inputs relate to the assignment process.
  question: What should Civilian Expeditionary Office officials do about when and how to assess fitness for an assignment
    to a forward operating location?
  options:
    O1:
      do: The Civilian Expeditionary Office requires the department's medical authority to confirm fitness before assignment
        and training instructors to comment on fitness to deploy.
      move: act
      irreversible: false
    O2:
      do: The Civilian Expeditionary Office asks the department's medical authority for advice on clearance timing before
        setting the assignment procedure.
      move: ask
      irreversible: false
      to: the department's medical authority
    O3:
      do: The Civilian Expeditionary Office waives pre-assignment medical confirmation, leaves fitness confirmation until
        after assignment, and has training instructors comment on fitness to deploy.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Civilian Expeditionary Office is reviewing its clearance and training procedures in March 2012.
  - id: F2
    kind: situation
    status: confirmed
    fact: The review covers combat-skills-training procedures for civilian expeditionary personnel.
  - id: F3
    kind: situation
    status: confirmed
    fact: The review covers medical-clearance procedures for civilian expeditionary personnel.
  - id: F4
    kind: capability
    status: assessed
    fact: There are concerns that some civilians assigned to deploy to forward operating locations may not meet the locations'
      physical demands.
  - id: F5
    kind: capability
    status: assessed
    fact: There are concerns that some civilians visiting forward operating locations may not meet the locations' physical
      demands.
  - id: F6
    kind: situation
    status: confirmed
    fact: The procedures under review concern civilians deploying to or visiting forward operating locations.
  - id: F7
    kind: situation
    status: confirmed
    fact: The department's medical authority advised that pre-assignment confirmation could not be carried out reliably or
      safely under the available procedure.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The capability concerns make physical fitness relevant to whether civilians can safely meet the demands of deployment;
      the reported risk is to personnel themselves and others. This supports fitness assessment, though it does not resolve
      the authority's concern about the available pre-assignment procedure.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    - F5
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The sequence of medical clearance and assignment determines when fitness information is available, but the medical
      authority has advised that pre-assignment confirmation cannot be carried out reliably or safely under the available
      procedure. Seeking its advice before setting the procedure addresses that timing problem without adopting an unreliable
      or unsafe requirement.
  - id: C3
    facts:
    - F2
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Training instructors' comments provide a training-related input to the fitness procedure alongside medical clearance,
      but they do not resolve the timing problem identified by the medical authority.
  reasoning:
    read: This is a procedural decision about when fitness should be assessed and what input should inform that assessment—not
      a finding that any particular civilian is unfit. The concern is that some personnel may not meet the physical demands
      of forward operating locations; the reported risk is to themselves and others. The department's medical authority has
      advised that pre-assignment confirmation cannot be carried out reliably or safely under the available procedure, so
      the office should resolve the timing issue before setting the assignment procedure.
    weighing: The reported capability concerns support addressing medical fitness in the assignment process. However, the
      authority's advice means that requiring pre-assignment confirmation under the available procedure would be unreliable
      or unsafe. Asking the authority for advice before setting the procedure is the appropriate way to resolve that problem.
      Training instructors can still provide a training-related input, but their comments do not settle the medical-clearance
      timing issue.
    tradecraft: Ask the department's medical authority for advice on clearance timing before setting the assignment procedure.
      Keep any training instructors' comments distinct from medical confirmation; their input does not replace the authority's
      advice about a reliable and safe procedure.
    uncertainty: The material gives no individual medical findings, fitness criteria, or account of how instructors should
      form their comments. The capability concerns are not individual medical assessments, and the authority's advice is limited
      to the available procedure.
    handoff: The Civilian Expeditionary Office officials decide the procedure; the department's medical authority provides
      advice on clearance timing, and training instructors may comment on fitness to deploy. The record assigns those inputs
      but does not describe a further approval or referral.
    tempting_wrong:
      option: O1
      pull: It addresses the physical-fitness concerns by requiring confirmation before assignment and retaining instructor
        comments.
      why_wrong: The medical authority has advised that pre-assignment confirmation cannot be carried out reliably or safely
        under the available procedure. The office should seek its advice before setting the procedure rather than impose that
        requirement.
    rejected:
      O1: Although the physical-fitness concerns support addressing fitness before assignment, the authority has advised that
        pre-assignment confirmation is not reliable or safe under the available procedure. Seek advice before setting the
        procedure.
      O3: Waiving pre-assignment confirmation and leaving fitness confirmation until after assignment does not resolve the
        timing problem. The office should seek the medical authority's advice before setting the procedure.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The department's medical authority did not advise that pre-assignment confirmation could not be carried out reliably
        or safely under the available procedure.
      then: O1
      why: Without that procedural obstacle, the reported safety concerns would support requiring pre-assignment confirmation
        and instructor comments.
    would_not_change:
    - id: noflip1
      if: The concern about personnel's fitness is based on assessed judgment rather than an individual medical finding.
      why: That qualification alone would not remove the need to address fitness concerns or alter the authority's advice
        about the available pre-assignment procedure.
    watch_for:
    - id: watch1
      what: Whether the department's medical authority identifies a reliable and safe timing for an individual's fitness confirmation.
      favors:
      - O2
      why: Advice on a workable timing is needed before the assignment procedure is set.
  lesson: When assignment demands raise credible safety concerns but the medical authority advises that pre-assignment confirmation
    cannot be carried out reliably or safely under the available procedure, seek its advice on timing before setting the procedure.
    Keep training input distinct from medical confirmation.
  limits: The scenario addresses the timing and inputs for fitness assessment for civilian personnel deploying to or visiting
    forward operating locations. It does not specify fitness standards, individual outcomes, or separate health-surveillance
    and post-assignment arrangements.
