    fact: The department civilian serves in direct support of the military.
  - id: F4
    kind: situation
    status: confirmed
    fact: The proposal gives the department civilian's family the same liaison officer as the service member's family and
      provides for a military reception on return, including a ceremony if the family wishes.
  - id: F5
    kind: situation
    status: assessed
    fact: Staff warned that offering the department civilian's family less treatment could cause offense.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposal gives the accredited journalist's family standard consular liaison and provides for no military reception
