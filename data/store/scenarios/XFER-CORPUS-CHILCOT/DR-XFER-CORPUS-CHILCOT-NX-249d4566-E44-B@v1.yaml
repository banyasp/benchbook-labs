case:
  id: DR-XFER-CORPUS-CHILCOT-NX-249d4566-E44-B@v1
  title: Families of Hostages
  status: draft
  setting: A fictional national-security jurisdiction, during a public hostage crisis, recovery cell
  decider: The director of the recovery cell
  agent: The director of the recovery cell
  agent_role: decide
  situation: An attack has left a service member, a department civilian who directly supports the military, and an accredited
    journalist held by a hostage group. A single hostage policy covers all three. The proposal gives the civilian's family
    the same liaison officer as the service member's family, and provides for a military reception on return, including a
    ceremony if the family wishes. The journalist's family would receive standard consular liaison, with no military reception.
    Staff warn that offering the civilian's family less treatment could cause offense, and assess that the visible difference
    in a public case could invite press and congressional criticism. The recovery cell director must decide whether to approve
    the proposed arrangements, seek further advice, or adopt common arrangements for both civilian families.
  question: What should the director of the recovery cell do about the proposed liaison and return arrangements for the department
    civilian's and accredited journalist's families?
  options:
    O1:
      do: The director of the recovery cell asks the Hostage Policy Director for further advice on arrangements for the department
        civilian's family before making a policy decision.
      move: ask
      irreversible: false
      to: The Hostage Policy Director
    O2:
      do: The director of the recovery cell rejects the proposed arrangements and adopts common liaison and return treatment,
        including a military reception and ceremony if the family wishes, for both families.
      move: act
      irreversible: false
    O3:
      do: The director of the recovery cell approves the proposed arrangements, providing the department civilian's family
        the same liaison officer as the service member's family and a military reception on return, with a ceremony if the
        family wishes, while the journalist's family receives standard consular liaison without a military reception.
      move: act
      irreversible: false
  facts:
