case:
  id: DR-XFER-CORPUS-CHILCOT-NX-249d4566-E59-A@v1
  title: Fitness Assessment for the Civilian Expeditionary Workforce
  status: draft
  setting: Department of Defense Civilian Expeditionary Office, March 2012, concerning civilian personnel deploying to or
    visiting forward operating locations.
  decider: Civilian Expeditionary Office officials
  agent: Civilian Expeditionary Office officials
  agent_role: decide
  situation: The Civilian Expeditionary Office is reviewing its medical-clearance and combat-skills-training procedures for
    civilians who deploy to or visit forward operating locations. There are concerns that some personnel may not be capable
    of meeting the physical demands of those locations. The review concerns both the timing of medical fitness confirmation
    and the role of training instructors in commenting on fitness to deploy. The office must determine how those inputs relate
    to the assignment process.
  question: What should Civilian Expeditionary Office officials do about when and how to assess fitness for an assignment
    to a forward operating location?
  options:
    O1:
      do: The Civilian Expeditionary Office requires the department's medical authority to confirm fitness before assignment
        and training instructors to comment on fitness to deploy.
      move: act
      irreversible: false
    O2:
      do: The Civilian Expeditionary Office asks the department's medical authority for advice on clearance timing before
        setting the assignment procedure.
      move: ask
      irreversible: false
      to: the department's medical authority
    O3:
      do: The Civilian Expeditionary Office waives pre-assignment medical confirmation, leaves fitness confirmation until
        after assignment, and has training instructors comment on fitness to deploy.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Civilian Expeditionary Office is reviewing its clearance and training procedures in March 2012.
  - id: F2
    kind: situation
    status: confirmed
