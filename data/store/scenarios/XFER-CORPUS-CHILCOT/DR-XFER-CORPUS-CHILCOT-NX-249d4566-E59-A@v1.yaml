  - id: F5
    kind: capability
    status: assessed
    fact: There are concerns that some civilians visiting forward operating locations may not meet the locations' physical
      demands.
  - id: F6
    kind: situation
    status: confirmed
    fact: The procedures under review concern civilians deploying to or visiting forward operating locations.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The capability concerns make physical fitness relevant to whether civilians can safely meet the demands of deployment;
      the reported risk is to personnel themselves and others.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The sequence of medical clearance and assignment determines whether fitness information is available when the assignment
      decision is made or only after that commitment.
  - id: C3
    facts:
    - F2
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Training instructors' comments provide a training-related input to the fitness procedure alongside medical clearance.
  reasoning:
    read: This is a procedural decision about when fitness should be assessed and what input should inform that assessment—not
      a finding that any particular civilian is unfit. The concern is that some personnel may not meet the physical demands
      of forward operating locations; the reported risk is to themselves and others. The trap is to treat assignment as something
      that can safely precede fitness confirmation despite that concern.
    weighing: The reported capability concerns support resolving medical fitness before assignment, and the procedure should
      use that timing. Training instructors can also be assigned a role in commenting on fitness to deploy. The balance depends
      on the concern being relevant to safe deployment; the record states it as an assessed concern, not as a documented assessment
      of each individual.
    tradecraft: Apply the department medical authority's confirmation before the assignment decision and obtain the training
      instructors' comments on fitness to deploy. Keep those roles distinct, and record the fitness information and how it
      informed the decision without treating a training comment as medical confirmation.
    uncertainty: The material gives no individual medical findings, fitness criteria, or account of how instructors should
      form their comments. The capability concerns are not individual medical assessments.
    handoff: The Civilian Expeditionary Office officials decide the procedure; the department's medical authority supplies
      the pre-assignment fitness confirmation and training instructors comment on fitness to deploy. The record assigns those
      inputs but does not describe a further approval or referral.
    tempting_wrong:
      option: O3
      pull: It retains instructor comments while avoiding a pre-assignment medical confirmation.
      why_wrong: It leaves fitness confirmation until after assignment, contrary to the timing warranted by concerns about
        meeting the physical demands.
    rejected:
      O2: The procedure requires pre-assignment confirmation rather than deferring the procedure to seek advice about timing.
      O3: The procedure does not waive pre-assignment medical confirmation; the department's medical authority should confirm
        fitness before, not after, assignment.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The department's medical authority advised that pre-assignment confirmation could not be carried out reliably or
        safely under the available procedure.
      then: O2
      why: Seeking the authority's advice before setting the procedure would then be a reasonable way to resolve the timing
        problem rather than adopting an unworkable requirement.
    would_not_change:
    - id: noflip1
      if: The concern about personnel's fitness is based on assessed judgment rather than an individual medical finding.
      why: That qualification alone would not undo the case for pre-assignment confirmation and instructor comments in response
        to the reported safety concern.
    watch_for:
    - id: watch1
      what: Whether the department's medical authority confirms an individual's fitness before the assignment.
      favors:
      - O3
      why: That is the pre-assignment input called for by the capability concerns.
  lesson: When an assignment's physical demands raise credible safety concerns, assess fitness before assignment rather than
    postponing confirmation until afterward. Use relevant training input as an additional comment, while keeping its role
    distinct from medical confirmation.
  limits: The scenario addresses the timing and inputs for fitness assessment for civilian personnel deploying to or visiting
    forward operating locations. It does not specify fitness standards, individual outcomes, or separate health-surveillance
    and post-assignment arrangements.
