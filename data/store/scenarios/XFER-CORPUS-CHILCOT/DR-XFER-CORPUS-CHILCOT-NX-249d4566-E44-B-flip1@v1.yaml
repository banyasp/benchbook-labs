    weight: strong
    why: Providing the same liaison and return treatment, including a ceremony when the family wishes, avoids offering the
      department civilian's family less treatment that might cause offense.
  - id: C3
    facts:
    - F2
    - F6
    equity: duty_to_individual
    favors:
