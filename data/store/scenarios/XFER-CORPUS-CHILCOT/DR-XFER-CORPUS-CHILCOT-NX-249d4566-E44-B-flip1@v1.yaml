      why: The stated basis for treating the department civilian's family alongside the service member's family would be established,
        supporting the original choice to approve the proposed arrangements.
    would_not_change:
    - id: noflip1
      if: The department civilian's family did not wish to have a ceremony on return.
      why: The proposed arrangement already makes a ceremony conditional on the family's wish, so this would not require rejecting
        the arrangements.
    watch_for:
    - id: watch1
      what: Whether the department civilian's family wishes to have a ceremony on return.
      favors:
      - O3
      why: The family's wishes determine whether the conditional ceremony in the proposed arrangement is provided.
  lesson: When deciding how to support families during a hostage crisis, distinguish the groups' roles and apply the stated
    policy consistently where the record gives a basis for doing so. When that basis is absent, seek policy advice before
    deciding, while attending to foreseeable effects on families and public confidence and not inventing a justification for
    distinctions the decision record leaves unexplained.
  limits: This reasoning concerns the stated family liaison and return arrangements in this particular recovery-cell decision.
    It does not establish a general rule that accredited journalists' families should never receive a military reception or
    that every civilian hostage's family must be treated like a service member's family.
