case:
  id: DR-CORPUS-NX-d0a34067-E1@v1
  title: Delegating Strike-Clearance Authority in Laos
  status: draft
  setting: Laos, April 1971, CIA program decision.
  decider: The CIA
  agent: The CIA
  agent_role: decide
  situation: By late 1970, allied and enemy forces were numerous on the ground, the battle tempo had risen, and the battlefield
    had become increasingly dangerous. In April 1971, a mistaken US airstrike killed 16 Thai troops, including two commanders.
    Airborne forward air controllers included Thai, Royal Lao, and US Air Force personnel, and additional controllers were
    considered necessary to coordinate airstrikes. US adherence to the 1962 Geneva Accords ruled out Department of Defense
    personnel on the ground in Laos. The choice was whether locally recruited Thai civilians would serve on the ground with
    validation authority to clear US aircraft to strike.
  question: What should the CIA do about authorizing locally recruited Thai civilians to hold validation authority to clear
    US aircraft to strike?
  options:
    O1:
      do: The CIA declines to authorize locally recruited Thai civilians to hold validation authority to clear US aircraft
        to strike.
      move: act
      irreversible: false
    O2:
      do: The CIA authorizes locally recruited Thai civilians to hold validation authority to clear US aircraft to strike.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: By late 1970, numerous allied and enemy troops were on the ground, the battle tempo had increased, and the battlefield
      had become increasingly dangerous.
  - id: F2
    kind: situation
    status: confirmed
    fact: In April 1971, a mistaken US airstrike on Thai troops killed 16, including two Thai commanders.
  - id: F3
    kind: capability
    status: assessed
    fact: Additional forward air controllers were considered necessary to coordinate airstrikes.
  - id: F4
    kind: capability
    status: confirmed
    fact: Allied aerial forward air controllers included Thai, Royal Lao, and US Air Force personnel.
  - id: F5
    kind: authority
    status: confirmed
    fact: US adherence to the 1962 Geneva Accords ruled out the presence of Department of Defense personnel on the ground
      in Laos.
  - id: F6
    kind: capability
    status: confirmed
    fact: Forward air guides were conceived as ground-based controllers, distinct from airborne forward air controllers.
  - id: F7
    kind: authority
    status: confirmed
    fact: Forward air guides were non-US civilians granted validation authority to clear US aircraft to strike.
  considerations:
  - id: C1
    facts:
    - F1
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The battlefield had become increasingly dangerous as the number of forces and the battle tempo rose, making additional
      control capacity more important.
  - id: C2
    facts:
    - F2
    - F3
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The mistaken strike killed 16 Thai troops, including two commanders; more forward air controllers were needed to
      coordinate airstrikes.
  - id: C3
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The proposed guides supplied a ground-based controller role, distinct from airborne controllers, in response to the
      stated need for more controllers.
  - id: C4
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The Geneva Accords constraint ruled out DoD personnel on the ground, narrowing the available ways to add ground-based
      control; it does not, by itself, establish the legality of delegating strike validation to civilians.
  - id: C5
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Giving non-US civilians authority to clear US aircraft to strike was described as an anomalous and perhaps unprecedented
      delegation, a reason for caution even though the source does not say it was unlawful.
  reasoning:
    read: This was a response to an increasingly dangerous battlefield and a fatal mistaken strike, not simply a choice between
      airborne controllers and civilians. The trap is to treat the Geneva constraint as either proving that civilian validation
      was lawful or making the added ground-based role unnecessary; the source establishes neither.
    weighing: 'The source''s stated reason for the response is direct: after the mistaken strike, more controllers were needed
      to coordinate airstrikes. The rising battle tempo and danger strengthen that case, while the Geneva constraint helps
      explain why DoD personnel could not fill a ground role. The unusual delegation to non-US civilians weighs for caution,
      but the source''s balance favors authorizing the guides. That balance depends on the assessed need for additional control
      and does not settle the legal basis or safeguards for their validation authority.'
    tradecraft: Record the decision's authority and rationale, distinguish the civilian validation role from airborne control,
      and specify accountability and review arrangements without expanding the delegation beyond what is authorized.
    uncertainty: The available text gives the need for additional controllers and the unusual nature of the authority, but
      not a legal analysis of civilian validation, comparative effectiveness, or the safeguards and accountability arrangements
      considered.
    handoff: The source presents this as a CIA program decision. As a decision-practice measure, involve legal and policy
      authorities before implementation because the delegation was unusual and the Geneva constraint does not itself resolve
      its legality.
    tempting_wrong:
      option: O1
      pull: Declining avoids giving extraordinary strike-validation authority to non-US civilians.
      why_wrong: On the source's stated balance, declining leaves unanswered the expressly identified need for more controllers
        after a mistaken strike killed Thai troops.
    rejected:
      O1: The CIA did not decline because the stated assessment was that more controllers were needed to coordinate airstrikes.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A controlling legal determination established that civilians could not lawfully be given validation authority to
        clear US aircraft to strike.
      then: O1
      why: The need for added control would not justify exercising authority that the applicable law prohibited.
    - id: flip2
      if: Reliable assessment showed that authorizing civilian ground guides would not add useful control or reduce the identified
        risk, while a lawful alternative could meet the need.
      then: O1
      why: The principal stated reason for the guides is the need for more controllers; removing that need would weaken the
        case for this unusual delegation.
    would_not_change:
    - id: noflip1
      if: Airborne forward air controllers remained part of the available force.
      why: Airborne controllers were already present, yet additional controllers were still considered necessary after the
        battlefield became more dangerous and the mistaken strike occurred.
    watch_for:
    - id: watch1
      what: A clear legal basis and accountable limits for non-US civilians' validation authority.
      favors:
      - O1
      why: The authority was characterized as highly unusual, but the legal analysis and accountability details needed to
        assess that concern are not provided.
  lesson: When a dangerous operating environment and a serious error expose a stated need for additional control, assess whether
    a proposed delegation addresses that need and whether it is authorized. A legal constraint on one category of personnel
    does not, by itself, establish the legality of delegating authority to another category.
  limits: This reasoning supports only the decision to add ground-based civilian controllers in response to the stated need;
    it does not establish that such delegations are generally lawful or effective. The available text provides no detailed
    legal analysis or safeguards, so those questions require independent review.
