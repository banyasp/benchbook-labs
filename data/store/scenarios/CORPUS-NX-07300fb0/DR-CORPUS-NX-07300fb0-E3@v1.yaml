case:
  id: DR-CORPUS-NX-07300fb0-E3@v1
  title: A Bounded Explanation for Operators
  status: draft
  setting: Naval Communications Annex, Navy operations; date not stated.
  decider: The operations chief
  agent: The operations chief
  agent_role: decide
  situation: At the Naval Communications Annex, women worked three shifts operating around the clock on an important Navy
    effort. The work was noisy and hot. The Navy had stressed the work’s importance without explaining how it fit into the
    broader effort. An accidental disposal of work product caused a delay and brought the need for some explanation to the
    operations chief’s attention. The chief had permission from superiors to give the operators some explanation and faced
    a choice between silence and a bounded disclosure.
  question: What should the operations chief do about disclosing the significance of the operators’ work?
  options:
    O1:
      do: The operations chief discloses to the operators that they are working against an enemy cipher and that the work
        is important.
      move: act
      irreversible: true
    O2:
      do: The operations chief withholds any explanation of the purpose or importance of the operators’ work from the operators.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Women operated the machines at the Naval Communications Annex.
  - id: F2
    kind: situation
    status: confirmed
    fact: Three shifts of women ran the operations around the clock.
  - id: F3
    kind: situation
    status: confirmed
    fact: The work was noisy and hot.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Navy impressed upon the operators that their work was important but did not explain how it fit into the broader
      effort.
  - id: F5
    kind: situation
    status: assessed
    fact: An accidental disposal of work product caused a delay in operations.
  - id: F6
    kind: situation
    status: assessed
    fact: The operations chief considered some explanation necessary after the delay.
  - id: F7
    kind: authority
    status: confirmed
    fact: The operations chief obtained permission from superiors to tell the operators something about the importance of
      their work.
  considerations:
  - id: C1
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The operations chief had permission from superiors to give the operators some explanation, supporting a disclosure
      within that permission.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The operators had been told the work was important but not how it fit into the broader effort. The accidental disposal
      and resulting delay made the chief recognize that some explanation was necessary.
  - id: C3
    facts:
    - F7
    equity: source_protection
    favors:
    - O1
    weight: weak
    why: 'The permitted explanation could be bounded: the operators were told they were attacking an enemy cipher and that
      the work was important, without being told specifically what they were doing.'
  reasoning:
    read: This was a choice between continued silence and an explanation the chief was authorized to give. The trap is treating
      the need for secrecy as requiring silence, or treating the need for context as permission to disclose more than was
      authorized.
    weighing: The delay brought the cost of leaving the operators without an explanation to the chief's attention, and the
      chief considered some explanation necessary. Superiors had permitted a limited account, so the balance favored telling
      the operators they were working against an enemy cipher and that the job was important, while keeping the explanation
      within that boundary.
    tradecraft: Keep any explanation within the scope approved by superiors; do not add details beyond the stated purpose
      and importance. As a decision practice, record the authorization and the scope of what was disclosed.
    uncertainty: The account does not state the date, the terms of the superiors' permission, or any further reason for limiting
      the explanation.
    handoff: The chief acted after obtaining permission from superiors. Further referral is not described as necessary for
      the bounded explanation; seek higher approval before expanding beyond its scope.
    tempting_wrong:
      option: O2
      pull: Silence avoids disclosing information about the Navy effort.
      why_wrong: It leaves the operators without the explanation the chief considered necessary after the delay, despite permission
        to give them a bounded account.
    rejected:
      O2: The chief did not maintain silence because the delay made some explanation necessary and superiors had authorized
        one.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The chief did not have permission to disclose the work's purpose or importance.
      then: O2
      why: The actual choice to explain was made with superiors' permission; without it, the chief should withhold the explanation
        pending authorization.
    - id: flip2
      if: The explanation could not be kept within the permission's scope and would require disclosing additional specifics.
      then: O2
      why: The source's outcome was a bounded explanation, not an unrestricted disclosure.
    would_not_change:
    - id: noflip1
      if: The work remained noisy and hot.
      why: 'Those conditions alone would not alter the source''s stated basis for disclosure: the need for some explanation
        and the chief''s authorization.'
    watch_for:
    - id: watch1
      what: Whether a proposed explanation would exceed the scope approved by superiors.
      favors:
      - O2
      why: A broader disclosure is not supported by the limited authorization described.
  lesson: When personnel need context to understand the importance of their work, silence is not the only way to protect sensitive
    information. Give an explanation only within the authority granted and keep it no more specific than necessary.
  limits: This reasoning applies to a bounded explanation made with superior authorization. It does not establish that disclosure
    without authorization, or disclosure of further details, would be justified.
  library:
    domain: natsec-other
    family: CORPUS-NX-07300fb0
    source: https://media.defense.gov/2021/Jul/13/2002761546/-1/-1/0/SHARING_THE_BURDEN.PDF
    episode_focus: The choice was between maintaining strict silence and offering a bounded explanation to help operators
      understand the significance of their work. Focus on the authorization and limits of that disclosure; exclude technical
      details about the equipment or the result.
