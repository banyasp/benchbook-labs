case:
  id: DR-ANACONDA-2002-restyle1@v1
  title: Simultaneous vs Sequential Launch of Operation Anaconda [restyle]
  status: needs_review
  setting: Northern Province of Kora, Ravik Gorge, spring 2002, Task Force Ironclad headquarters
  decider: the Ironclad task-force commander
  agent: the Ironclad task-force commander
  agent_role: decide
  situation: In early 2002 Task Force Ironclad was finalising Operation Stormbreaker to engage hostile elements massed in
    the Ravik Gorge. The commander exercised authority over conventional ground units and a limited contingent of special-operations
    teams, but did not command all special-operations forces, other governmental bodies, or the air component, which remained
    under the Joint Air Operations Commander (JAOC). The initial concept called for a primarily ground-centric assault with
    only a handful of air strikes immediately preceding the ground move, and stringent fire-control rules would make most
    of the gorge unsuitable for aerial attacks. By late February the JAOC had only just been fully briefed, the combined air
    operations centre only received the full picture on 23 February, the total fuel requirement was finalised on 25 February,
    and adverse weather pushed the start date to 2 March. The commander must decide whether to launch a concurrent ground-air
    effort with air support standing by, or to postpone the assault and begin with an extensive preparatory air bombardment
    before committing ground troops.
  question: Should the Ironclad commander initiate the operation as a simultaneous ground-air effort with air support on-call,
    or delay the start to conduct a comprehensive preparatory air bombardment before inserting ground forces?
  options:
    O1:
      do: Proceed with a concurrent ground-air operation, keeping the air component in an on-call close-air-support role.
      move: act
      irreversible: true
    O2:
      do: Postpone the assault and commence with a large-scale preparatory air bombardment prior to ground force insertion.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Task Force Ironclad exercised command over conventional troops and a subset of special-operations units, but lacked
      authority over all special-operations forces, other agencies, and the air component governed by the JAOC.
  - id: F2
    kind: authority
    status: confirmed
    fact: The JAOC directed all United States air assets operating in Kora, and Ironclad had not yet established direct liaison
      with the JAOC.
  - id: F3
    kind: capability
    status: confirmed
    fact: The original concept envisioned Stormbreaker as chiefly a ground operation, assigning air forces only a limited
      fire-support role.
  - id: F4
    kind: capability
    status: confirmed
    fact: Ironclad imposed restrictive fire-control parameters that would render virtually the entire gorge unsuitable for
      air strikes, limiting the air component to on-call close-air-support and interdiction of ingress/egress routes.
  - id: F5
    kind: situation
    status: confirmed
    fact: By late February the JAOC was fully briefed on 20 February, the combined air operations centre received complete
      information on 23 February, the full fuel requirement was defined on 25 February, and the start date slipped to 2 March
      because of adverse weather.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Hostile forces were concentrating in and around the Ravik Gorge, presenting a timely target for a strike.
  - id: F7
    kind: intelligence
    status: assessed
    fact: An extensive air bombardment before ground insertion would likely have severely degraded the enemy's capacity to
      mount an organized defence.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Conducting ground and air elements simultaneously eliminates the chance for a large preparatory bombing and raises
      the demand for close air-ground coordination.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Ironclad did not command the air component and had not forged direct liaison with the JAOC, curtailing the ability
      to plan and execute a sizable preparatory air bombardment.
  - id: C2
    facts:
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Late briefings to the JAOC and the CAOC, together with the late fuel estimate and weather-induced delay, left insufficient
      time to design and launch a major pre-strike bombing campaign.
  - id: C3
    facts:
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The enemy was massed in the gorge; a simultaneous ground-air effort would prevent dispersion and require on-call
      close-air-support to address emerging threats.
  - id: C4
    facts:
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The original concept treated air as a secondary, limited fire-support element, and the restrictive fire-control rules
      made most of the gorge unsuitable for air strikes, reinforcing the decision to retain air in an on-call capacity.
  - id: C5
    facts:
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: A large preparatory bombardment would likely have suppressed the enemy's defensive capability, but the authority
      gap, timing shortfall, and weather constraints rendered this option impractical.
  reasoning:
    read: Ironclad held primary control of ground forces but limited authority over the air component, which was only briefed
      days before the planned start and faced weather-driven delays. The pitfall was to assume a large pre-strike air campaign
      could be mounted despite these constraints.
    weighing: The analysis weighed the authority shortfall (C1), the timing deficiency (C2), and the mission imperative to
      engage a concentrated foe (C3) against the theoretical benefit of a preparatory bombardment (C5). Because the constraints
      were strong, the balance tipped toward a concurrent ground-air execution with air on-call (C4 reinforces this by noting
      the restrictive fire-control parameters).
    tradecraft: Record the decision in the operation order, specify the on-call close-air-support tasking, and document the
      limited liaison with the JAOC for after-action review. Keep the CAOC apprised of ground movements for real-time targeting.
    uncertainty: Residual uncertainty exists regarding the enemy's ability to reorganise if air support is delayed, and about
      the precise fuel availability for a larger strike.
    handoff: The decision rested with the Ironclad commander alone, but required immediate notification to the JAOC and the
      CAOC to enable on-call support.
    tempting_wrong:
      option: O2
      pull: The allure of a massive pre-strike bombardment that could have crippled the enemy before ground forces entered.
      why_wrong: Given the late air-component briefings, lack of coordination, and weather-driven schedule, a large preparatory
        strike could not be reliably planned or executed, risking mission delay and loss of surprise.
    rejected:
      O2: A preparatory air bombardment was rejected because the air component was only fully briefed days before the operation,
        restrictive fire-control rules limited viable strike zones, and weather delays left insufficient time to plan and
        allocate the required fuel.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Ironclad had established direct liaison with the JAOC and the full fuel requirement had been defined at least 48
        hours before the planned start
      then: O2
      why: Early coordination and sufficient logistical preparation would have enabled a comprehensive preparatory air bombardment.
    would_not_change:
    - id: noflip1
      if: adverse weather continued to postpone the operation beyond the window for a coordinated pre-strike
      why: Weather constraints would still preclude a large preparatory bombing, keeping simultaneous execution as the viable
        option.
    watch_for:
    - id: watch1
      what: any sudden improvement in weather that permits an earlier air-component briefing
      favors:
      - O2
      why: Improved weather could create the time needed for a preparatory bombardment, shifting the balance toward sequential
        operations.
  lesson: When authority over air assets is limited and the timeline is compressed, concurrent ground-air operations with
    on-call air support become the practicable choice, but they demand tighter air-ground integration than originally planned.
  limits: This guidance applies only when the air component is not fully integrated into the command hierarchy and logistical
    or weather constraints prevent a thorough pre-strike air campaign; it does not extend to scenarios where air superiority
    and coordination permit extensive preparatory bombing.
