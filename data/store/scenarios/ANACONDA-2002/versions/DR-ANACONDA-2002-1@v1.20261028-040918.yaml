case:
  id: DR-ANACONDA-2002-1@v1
  title: Simultaneous vs Sequential Air‑Ground Execution for Operation Anaconda
  status: draft
  setting: Shahikot Valley, Afghanistan, February‑March 2002, Task‑Force Mountain operation
  decider: Task‑Force Mountain commander
  agent: Task‑Force Mountain commander
  agent_role: decide
  situation: At the time of the decision, the Task‑Force Mountain commander was preparing to begin Operation Anaconda in the
    Shahikot Valley. The commander exercised authority over Army units and some special‑operations forces, but the air component
    remained under the Combined Force Air Component Commander. A small USAF liaison team had been placed on the staff, yet
    direct coordination with the air component had not been established. The original plan called for limited air strikes
    just before the ground assault and on‑call close‑air support, with most of the valley restricted from air bombardment.
    Bad weather had delayed the start of the battle from the intended 28 February to 2 March, and the air operations center
    was only fully briefed days later. The commander faced a choice between launching a simultaneous ground‑air operation
    as planned or delaying to conduct a major preparatory air bombardment.
  question: What should the Task‑Force Mountain commander do regarding the timing and sequencing of air and ground actions
    for the operation?
  options:
    O1:
      do: The commander requests additional air‑ground integration planning from the Combined Force Air Component Commander.
      move: ask
      irreversible: false
      to: Combined Force Air Component Commander
    O2:
      do: The commander launches the operation as a simultaneous ground and air action with on‑call air support.
      move: act
      irreversible: true
    O3:
      do: The commander postpones the operation to conduct a major preparatory air bombardment before the ground assault.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Task‑Force Mountain commander exercised control over Army forces and some special‑operations forces but not
      over all special‑operations forces, other agencies, or the air component.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Combined Force Air Component Commander retained authority over U.S. air forces operating in Afghanistan.
  - id: F3
    kind: capability
    status: confirmed
    fact: The air component was originally tasked to provide on‑call close‑air support and limited strikes against enemy positions
      minutes before the ground assault.
  - id: F4
    kind: situation
    status: confirmed
    fact: The battle plan established graphical and restrictive fire control measures that would make most of the valley unsuitable
      for airstrikes.
  - id: F5
    kind: situation
    status: confirmed
    fact: A major preparatory air bombardment campaign was not included in the original plan and would require a sequential
      operation.
  - id: F6
    kind: situation
    status: confirmed
    fact: Bad weather delayed the start of the battle from 28 February to 2 March 2002.
  - id: F7
    kind: situation
    status: confirmed
    fact: The combined air operations center was not fully apprised of the plan until 23 February and the full fuel requirement
      was defined on 25 February.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: Al Qaeda forces were congregating in and around the Shahikot Valley, creating a target for the operation.
  - id: F9
    kind: capability
    status: assessed
    fact: Simultaneous ground‑air operations increase the need for close air‑ground integration because a large preparatory
      bombing campaign is not possible.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The commander controls Army and some SOF forces but not the air component, which remains under CFACC authority; therefore
      the commander cannot unilaterally reorder the air effort into a preparatory bombardment.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The original battle plan explicitly called for limited pre‑strike fires and on‑call close‑air support, casting air
      assets in a secondary role compatible with a simultaneous ground‑air operation.
  - id: C3
    facts:
    - F9
    equity: resource_stewardship
    favors:
    - O2
    - O1
    weight: weak
    why: Simultaneous operations increase the need for close air‑ground integration; the existing liaison team can provide
      that integration without delaying the launch.
  - id: C4
    facts:
    - F6
    - F7
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Bad weather already compressed the timeline; further postponement for a major bombardment would sacrifice the time‑critical
      opportunity to engage al‑Qaeda forces.
  - id: C5
    facts:
    - F9
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: A preparatory air campaign could have suppressed enemy defenses, but when simultaneous ops are required, such a campaign
      is not feasible.
  reasoning:
    read: The commander must decide whether to keep the originally‑designed simultaneous ground‑air assault or to delay for
      a large preparatory air bombardment. The trap is to assume that a bigger air strike is always better, ignoring authority
      limits, the original doctrinal design, and the time pressure created by weather and intelligence.
    weighing: The plan was conceived as a simultaneous operation with limited air support (C2) and simultaneous ops demand
      close integration rather than a separate bombing phase (C3). Authority constraints (C1) and the compressed timeline
      (C4) outweigh the modest benefit of a preparatory strike (C5). Consequently, the balance points to launching as planned.
    tradecraft: Issue the operational order for simultaneous ground assault, activate the USAF liaison cell, and transmit
      on‑call CAS instructions to the CFACC. Document the decision in the operation’s after‑action report and note the integration
      measures taken.
    uncertainty: Exact enemy strength, weather windows, and the speed of CFACC’s response remain uncertain, but the decision
      proceeds on the best available intelligence.
    handoff: The TF Mountain commander decides, but must coordinate with the Combined Force Air Component Commander for on‑call
      CAS and to ensure the liaison team is fully briefed.
    tempting_wrong:
      option: O3
      pull: A major preparatory bombardment appears attractive for suppressing enemy forces.
      why_wrong: Delaying would breach the commander’s limited authority, lose tempo, and conflict with the doctrinally‑designed
        simultaneous‑operation concept.
    rejected:
      O1: Requesting more integration planning does not address the immediate need to launch; the operation can proceed with
        existing liaison support.
      O3: Postponing for a preparatory air campaign would exceed the commander’s authority, waste critical time, and contradict
        the original simultaneous‑ground‑air concept.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Combined Force Air Component Commander had full authority to conduct a preparatory bombardment and the weather
        cleared early enough to allow a separate air campaign.
      then: O3
      why: With authority and time, a major air bombardment could be executed without violating command relationships or tempo.
    would_not_change:
    - id: noflip1
      if: The air component remains under CFACC authority and the timeline stays compressed.
      why: Authority and tempo constraints continue to favor the simultaneous launch.
    watch_for:
    - id: watch1
      what: Any change in CFACC’s willingness to provide additional on‑call CAS integration resources.
      favors:
      - O1
      why: Enhanced integration could mitigate risks without altering the overall timing.
  lesson: When a joint operation is deliberately designed as a simultaneous ground‑air assault with limited air support, the
    ground commander should proceed with the planned timing, emphasizing close integration rather than delaying for a separate
    preparatory air campaign.
  limits: This rule applies only when air‑component authority remains separate from the ground commander and when the operation’s
    urgency precludes a lengthy preparatory air phase. It does not extend to purely air‑centric missions or situations where
    the commander has full control over air assets.
