case:
  id: DR-ANACONDA-2002-1@v1
  title: Simultaneous vs Sequential Air-Ground Operation Decision
  status: draft
  setting: Shahikot Valley, Afghanistan, early 2002, Task Force Mountain operation planning
  decider: Task Force Mountain commander
  agent: Task Force Mountain commander
  agent_role: decide
  situation: In early 2002, Task Force Mountain was planning an operation in the Shahikot Valley against al Qaeda forces.
    The commander controlled Army units and some special‑operations forces but did not control all SOF, other agencies, or
    the air component, which remained under the Combined Force Air Component Commander (CFACC). The original plan envisioned
    limited air strikes just before the ground air assault and an on‑call close‑air support role for the air component. Graphical
    control measures were established that would make most of the valley unsuitable for air strikes, and the air task was
    limited to supporting ground forces and targeting enemy ingress routes. By late February, the CFACC and the combined air
    operations center were only recently fully briefed on the plan, and bad weather delayed the start of the battle to early
    March. The battle plan ultimately called for a simultaneous ground and air operation rather than a sequential one with
    a preparatory bombing campaign.
  question: What should the Task Force Mountain commander do regarding the timing and sequencing of air and ground actions
    for the operation?
  options:
    O1:
      do: The Task Force Mountain commander proceeds with a simultaneous ground and air operation, keeping the air component
        in an on‑call support role.
      move: act
      irreversible: true
    O2:
      do: The Task Force Mountain commander halts the simultaneous plan and conducts a major preparatory air bombardment before
        committing ground forces.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Task Force Mountain had control over Army forces and some SOF units but not over all SOF, other governmental agencies,
      or the air component.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Combined Force Air Component Commander directed U.S. air forces operating in Afghanistan and had no forward
      headquarters there.
  - id: F3
    kind: capability
    status: confirmed
    fact: Air forces were initially viewed as providing fires in support of the ground maneuver plan with limited strikes
      before the ground air assault.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The original battle plan called for limited air strikes a few minutes before U.S. ground forces air‑assaulted into
      the valley.
  - id: F5
    kind: capability
    status: confirmed
    fact: Task Force Mountain established graphical and restrictive fire control measures that would render virtually the
      entire valley inappropriate for airstrikes.
  - id: F6
    kind: capability
    status: confirmed
    fact: The air component task was to provide on‑call close‑air support and strike enemy ingress and egress routes into
      the valley.
  - id: F7
    kind: situation
    status: confirmed
    fact: The battle plan employed at Anaconda was a simultaneous operation, not a sequential operation.
  - id: F8
    kind: capability
    status: assessed
    fact: Simultaneous operations reduce the time available for a preparatory air bombardment and increase the need for close
      air‑ground integration.
  - id: F9
    kind: situation
    status: confirmed
    fact: CFACC was fully informed of the plan on 20 Feb, the combined air operations center was fully apprised on 23 Feb,
      and the full fuel requirement was defined on 25 Feb.
  - id: F10
    kind: situation
    status: confirmed
    fact: Bad weather delayed the start of the battle from 28 Feb to 2 Mar.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: TF MOUNTAIN did not control the air component and the CFACC was only fully briefed days before the operation, limiting
      the commander’s authority to order a large preparatory bombardment.
  - id: C2
    facts:
    - F10
    - F8
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Bad weather delayed the start, creating a time‑critical window that favored a simultaneous launch rather than waiting
      for a lengthy pre‑strike air campaign.
  - id: C3
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Simultaneous operations increase the need for close air‑ground integration, so proceeding with on‑call CAS meets
      that integration requirement.
  - id: C4
    facts:
    - F5
    - F6
    equity: hors_de_combat
    favors:
    - O1
    weight: strong
    why: Graphical and restrictive fire control measures made most of the valley unsuitable for airstrikes, so a preparatory
      bombardment would have violated those restrictions and exposed friendly forces to unnecessary danger.
  reasoning:
    read: The situation was that TF MOUNTAIN controlled ground forces but not the air component, which was only briefed shortly
      before the planned start. The original plan called for limited pre‑strike air fires, yet the battle was executed as
      a simultaneous ground‑air operation, creating a trap of assuming a sequential bombardment would be feasible despite
      authority and timing constraints.
    weighing: The considerations above show that authority limits, the urgent tempo after weather delays, the need for close
      air‑ground integration, and fire‑control restrictions all point to a simultaneous launch with the air component in an
      on‑call role. Simultaneous operations demand tighter integration, not a large preparatory strike.
    tradecraft: The commander should issue the operational order confirming simultaneous ground insertion while establishing
      a dedicated joint air‑ground liaison cell, maintain the on‑call CAS tasking through the BCD, and document the coordination
      in the CAOC’s battle log.
    uncertainty: Remaining uncertainties include the exact enemy strength in the valley and the possibility of further weather
      degradation that could affect air‑support availability.
    handoff: The decision remains with the TF MOUNTAIN commander, but he must involve the CFACC and the combined air operations
      center for real‑time CAS coordination and to ensure fire‑control compliance.
    tempting_wrong:
      option: O2
      pull: A major preparatory bombardment appears attractive for suppressing enemy defenses before ground troops move in.
      why_wrong: The late brief to the CFACC, restrictive fire measures, and limited fuel planning make a large pre‑strike
        impractical and risk violating fire‑control constraints while wasting scarce resources.
    rejected:
      O2: A preparatory air bombardment was rejected because authority, timing, and fire‑control restrictions made it infeasible
        and potentially dangerous.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Weather cleared early enough to allow a full fuel allocation and a longer preparation window before the start date
      then: O2
      why: With sufficient time and resources a preparatory bombardment could be planned and executed safely.
    would_not_change:
    - id: noflip1
      if: The CFACC had been fully briefed earlier but the restrictive fire control measures remained in place
      why: Even with earlier briefing, the valley’s fire‑control restrictions still preclude a large pre‑strike.
    watch_for:
    - id: watch1
      what: Future simultaneous operations that lack adequate air‑ground liaison structures
      favors:
      - O1
      why: Close integration is critical whenever simultaneous ground‑air actions are required.
  lesson: When a simultaneous ground‑air operation is required, the air component should be employed in an on‑call close‑air‑support
    role with enhanced integration rather than a large preparatory bombardment, especially when authority, timing, or fire‑control
    constraints limit extensive air strikes.
  limits: This guidance applies only when the commander lacks direct authority over the air component, restrictive fire‑control
    measures limit air strikes, and time constraints prevent a sequential bombing campaign. It does not apply where full air‑component
    control or ample preparation time exists.
