case:
  id: DR-ANACONDA-2002-revise1@v1
  title: Simultaneous vs Sequential Launch of Operation Anaconda [revise]
  status: needs_review
  setting: Afghanistan, Shahikot Valley, early 2002, Task Force Mountain command
  decider: the task-force commander
  agent: the task-force commander
  agent_role: decide
  situation: In early 2002 TF MOUNTAIN was preparing Operation Anaconda to strike al Qaeda forces gathered in the Shahikot
    Valley. The commander controlled Army and some special‑operations units but did not control all SOF, other agencies, or
    the air component, which remained under the Combined Force Air Component Commander (CFACC). The original plan emphasized
    a primarily ground operation with limited air strikes just before the ground assault, and restrictive fire‑control measures
    would make most of the valley unsuitable for air strikes. By late February the CFACC had only recently been fully briefed,
    the combined air operations center was not fully apprised until February 23, the full fuel requirement was defined on
    February 25, and bad weather delayed the start to March 2. The decision point was whether to launch the operation as a
    simultaneous ground‑air action with air support on‑call, or to begin with a major preparatory air bombardment before inserting
    ground forces.
  question: 'What should the task-force commander do regarding the launch of the operation: conduct a simultaneous ground
    and air action with air support on‑call, or begin with a major preparatory air bombardment before ground forces move in?'
  options:
    O1:
      do: The task-force commander executes the operation as a simultaneous ground and air action with the air component in
        an on‑call support role.
      move: act
      irreversible: true
    O2:
      do: The task-force commander delays the operation and begins with a major preparatory air bombardment before ground
        forces move in.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: TF MOUNTAIN had control over Army forces and some SOF units, but not over all SOF, other governmental agencies,
      or the air component that remained under the Combined Force Air Component Commander (CFACC).
  - id: F2
    kind: authority
    status: confirmed
    fact: The CFACC directed U.S. air forces operating in Afghanistan, and TF MOUNTAIN had not yet established direct coordination
      with the CFACC.
  - id: F3
    kind: capability
    status: confirmed
    fact: The original battle plan conceived Anaconda as primarily a ground operation, viewing air forces as providing limited
      fires in support of the ground maneuver.
  - id: F4
    kind: capability
    status: confirmed
    fact: TF MOUNTAIN established restrictive fire‑control measures that would render virtually the entire valley inappropriate
      for airstrikes, assigning the air component only an on‑call close‑air‑support role and strikes against ingress/egress
      routes.
  - id: F5
    kind: situation
    status: confirmed
    fact: By late February the CFACC was only fully informed of the plan on February 20, the combined air operations center
      was fully apprised on February 23, the full fuel requirement was defined on February 25, and the battle start was delayed
      to March 2 because of bad weather.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Al Qaeda forces were congregating in and around the Shahikot Valley, creating an opportunity for a strike operation.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A major air bombardment prior to ground insertion would likely have greatly suppressed al Qaeda's ability to mount
      a serious defense.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Simultaneous ground‑air operations remove the possibility of a large preparatory bombing campaign and increase the
      need for close air‑ground integration.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Because TF MOUNTAIN lacked direct authority over the air component and had not coordinated with the CFACC, the commander
      must delay and allow a coordinated preparatory bombardment rather than attempt an on-call simultaneous strike.
  - id: C2
    facts:
    - F5
    equity: tempo
    favors:
    - O1
    weight: weak
    why: Late briefings and weather-induced delay leave insufficient time for a coordinated pre-strike, reducing the advantage
      of a simultaneous launch.
  - id: C3
    facts:
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The enemy was massed in the valley; a simultaneous ground‑air operation prevented them from dispersing and required
      on‑call close‑air‑support to react to emerging threats.
  - id: C4
    facts:
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The original plan treated air as a secondary, limited fire support element, and restrictive fire‑control measures
      made most of the valley unsuitable for airstrikes, reinforcing the decision to keep air in an on‑call role.
  - id: C5
    facts:
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: A major preparatory bombardment would substantially degrade Al Qaeda defenses, and with a delay the commander can
      secure the necessary fuel and targeting data, making this the preferred option.
  reasoning:
    read: TF MOUNTAIN controls ground forces but not the air component, which was only briefed days before the planned start
      and faces weather-driven delays. The enemy is massed in the valley, offering a chance for a decisive strike.
    weighing: The revised weighting gives the authority gap (C1) and the life-saving effect of a preparatory bombardment (C5)
      strong weight in favor of delaying and bombing first. The tempo shortfall (C2) is now weak, and the earlier strong arguments
      for simultaneous action are outweighed.
    tradecraft: Issue a revised operation order that postpones the ground insertion, schedule a multi-day preparatory air
      campaign, and coordinate air-ground targeting through the CFACC once fuel and weather permit.
    uncertainty: Some uncertainty remains about how quickly the CFACC can allocate additional assets and whether weather will
      improve sufficiently for a sustained bombing window.
    handoff: The TF MOUNTAIN commander retains overall authority, but execution of the air campaign will be delegated to the
      CFACC after the delay, with regular status updates to the ground commander.
    tempting_wrong:
      option: O1
      pull: The appeal of a rapid simultaneous ground-air assault that preserves momentum and reduces exposure time.
      why_wrong: Without established air-component authority and with limited coordination time, a simultaneous launch risks
        inadequate air support, loss of surprise, and higher ground-force casualties.
    rejected:
      O1: Because the needed air assets are not allocated, the commander must revert to a simultaneous ground-air operation,
        even though it is less optimal.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The CFACC refuses to allocate additional air assets for a preparatory bombardment despite the delay
      then: O1
      why: Because the needed air assets are not allocated, the commander must revert to a simultaneous ground‑air operation,
        even though it is less optimal.
    would_not_change:
    - id: noflip1
      if: bad weather continued to delay the start of the operation beyond the window for a coordinated pre‑strike
      why: Weather constraints would still preclude a large preparatory bombing, keeping simultaneous execution as the viable
        option.
    watch_for:
    - id: watch1
      what: any sudden improvement in weather that allows earlier air‑component briefing
      favors:
      - O2
      why: Improved weather could create the time needed for a preparatory bombardment, shifting the balance toward sequential
        operations.
  lesson: When authority over air assets is limited and timing is constrained, delaying the operation to conduct a thorough
    preparatory air bombardment can better protect ground forces and achieve mission effect.
  limits: This guidance applies only when the air component remains outside the ground commander's direct control and logistical
    or weather constraints prevent rapid coordination for a simultaneous launch; it does not apply when air superiority and
    integrated command structures allow extensive pre-strike bombing.
