case:
  id: DR-ANACONDA-2002-flip1@v1
  title: Simultaneous vs Sequential Launch of Operation Anaconda [flip]
  status: needs_review
  setting: Afghan highlands, Shahikot basin, spring 2002, Task Force Mountain headquarters
  decider: the commander of Task Force Mountain
  agent: the commander of Task Force Mountain
  agent_role: decide
  situation: In early 2002 Task Force Mountain was finalizing plans for Operation Anaconda to engage al-Qaeda forces gathered
    in the Shahikot basin. The commander exercised authority over Army units and a portion of special-operations forces, but
    the air component remained under the Combined Force Air Component Commander (CFACC). A joint planning liaison between
    TF Mountain and the CFACC had been instituted on 22 February, enabling regular coordination of air-operation requirements.
    Restrictive fire-control rules limited most of the valley to on-call close-air-support only. By late February the CFACC
    was fully briefed on 20 February, the combined air operations center was apprised on 23 February, the total fuel requirement
    was defined on 25 February, and bad weather pushed the start date to 2 March. The commander must decide whether to postpone
    the launch and first conduct a heavy air bombardment before inserting ground forces, or to proceed with a synchronized
    ground-air assault with air support on-call.
  question: Should the commander delay the operation to begin with a major preparatory air bombardment before ground forces
    move in, or launch a simultaneous ground-air assault with air support on-call?
  options:
    O1:
      do: Proceed with a synchronized ground-air assault, keeping the air component on-call for close-air-support as the operation
        commences.
      move: act
      irreversible: true
    O2:
      do: Postpone the launch and first execute a heavy air bombardment of the valley before inserting ground forces.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Task Force Mountain exercised command over Army units and a subset of special-operations forces, but it did not
      command the remaining SOF elements, other governmental agencies, or the air component, which remained under the authority
      of the Combined Force Air Component Commander (CFACC).
  - id: F2
    kind: authority
    status: confirmed
    fact: TF MOUNTAIN and the Combined Force Air Component Commander had instituted a joint planning liaison on February 22,
      enabling regular coordination of air‑operation requirements.
  - id: F3
    kind: capability
    status: confirmed
    fact: The initial concept of Operation Anaconda treated it as a ground-centric assault, with airpower limited to supporting
      fires for the maneuver.
  - id: F4
    kind: capability
    status: confirmed
    fact: Restrictive fire-control rules were imposed that rendered almost the entire valley unsuitable for air strikes, confining
      the air component to an on-call close-air-support role and targeting only ingress and egress routes.
  - id: F5
    kind: situation
    status: confirmed
    fact: By late February the CFACC received a full briefing on February 20, the combined air operations center was fully
      apprised on February 23, the total fuel requirement was finalized on February 25, and adverse weather pushed the start
      date to March 2.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Al-Qaeda fighters had massed throughout the Shahikot basin, presenting a concentrated target for a strike.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A substantial air bombardment conducted before the ground insertion would likely cripple the enemy's ability to
      organize a robust defense.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Conducting ground and air elements simultaneously eliminates the chance for an extensive preparatory bombing and
      raises the demand for close air-ground coordination.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The joint liaison gives TF Mountain effective coordination with the CFACC, removing the authority gap that previously
      barred a large preparatory air campaign.
  - id: C2
    facts:
    - F5
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Although briefings were late, the liaison accelerated planning enough to fit a comprehensive pre-strike bombardment
      within the limited window before the weather-driven start date.
  - id: C3
    facts:
    - F6
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: A heavy bombardment will significantly degrade the concentrated enemy, making the subsequent ground insertion far
      more decisive and survivable.
  - id: C5
    facts:
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Suppressing enemy defenses before ground troops move in maximizes force protection and reduces likely casualties.
  reasoning:
    read: Task Force Mountain now enjoys a functional joint liaison with the air component, allowing rapid planning and allocation
      of fuel for a substantial pre-strike air campaign despite the compressed timeline.
    weighing: The authority gap (C1) has been closed, the accelerated planning window (C2) makes a preparatory bombardment
      feasible, and the enemy's concentration (C3) means that heavy air strikes will greatly enhance mission success. The
      life-preserving benefit (C5) further tips the balance toward delaying the launch for a major air bombardment.
    tradecraft: Record the revised timeline in the operation order, task the air component with a sequenced strike package,
      and ensure the CAOC receives updated targeting data for the post-bombardment ground insertion.
    uncertainty: Remaining uncertainties involve the exact weather window for the air strikes and the precise fuel consumption
      of the expanded bomb run.
    handoff: The TF Mountain commander makes the final call, but must immediately brief the CFACC and the CAOC to synchronize
      the bombardment and subsequent ground movement.
    tempting_wrong:
      option: O1
      pull: The appeal of preserving momentum with a simultaneous assault and avoiding further delays.
      why_wrong: Even with the liaison, a preparatory bombardment offers far greater enemy suppression and force protection;
        forgoing it sacrifices a decisive advantage.
    rejected:
      O1: A simultaneous ground-air assault was rejected because the newly established liaison now enables a comprehensive
        pre-strike air campaign that would dramatically reduce enemy resistance and protect friendly forces.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If TF Mountain had failed to secure early joint coordination with the CFACC and the fuel requirement had been finalized
        less than 24 hours before the intended start, then the simultaneous ground-air assault (O1) would be the appropriate
        choice.
      then: O1
      why: Without timely coordination and logistics, a large preparatory bombardment could not be reliably planned or executed.
    would_not_change:
    - id: noflip1
      if: If deteriorating weather continued to push the start beyond the window needed for a coordinated pre-strike, then
        the simultaneous ground-air assault remains the viable option.
      why: Severe weather would preclude the time-intensive bombardment, forcing reliance on on-call air support.
    watch_for:
    - id: watch1
      what: any sudden improvement in weather that allows an earlier air-component briefing
      favors:
      - O2
      why: Improved weather could create the time needed for a preparatory bombardment, shifting the balance toward a sequential
        operation.
  lesson: When a functional joint liaison eliminates the authority gap and the timeline allows, a substantial preparatory
    air bombardment can outweigh the benefits of a simultaneous ground-air assault, delivering greater enemy suppression and
    force protection.
  limits: This conclusion applies only when the air component is effectively coordinated through a joint liaison and logistical
    or weather constraints do not preclude a sizable pre-strike air campaign; it does not extend to scenarios lacking such
    coordination or where air superiority permits unrestricted preparatory bombing.
