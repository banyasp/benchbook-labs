case:
  id: DR-ANACONDA-2002-1@v1
  title: Simultaneous vs Sequential Launch of Operation Anaconda
  status: draft
  setting: Afghanistan, Shahikot Valley, early 2002, Task Force Mountain command
  decider: the task-force commander
  agent: the task-force commander
  agent_role: decide
  situation: In early 2002 TF MOUNTAIN was preparing Operation Anaconda to strike al Qaeda forces gathered in the Shahikot
    Valley. The commander controlled Army and some special‑operations units but did not control all SOF, other agencies, or
    the air component, which remained under the Combined Force Air Component Commander (CFACC). The original plan emphasized
    a primarily ground operation with limited air strikes just before the ground assault, and restrictive fire‑control measures
    would make most of the valley unsuitable for air strikes. By late February the CFACC had only recently been fully briefed,
    the combined air operations center was not fully apprised until February 23, the full fuel requirement was defined on
    February 25, and bad weather delayed the start to March 2. The decision point was whether to launch the operation as a
    simultaneous ground‑air action with air support on‑call, or to begin with a major preparatory air bombardment before inserting
    ground forces.
  question: 'What should the task-force commander do regarding the launch of the operation: conduct a simultaneous ground
    and air action with air support on‑call, or begin with a major preparatory air bombardment before ground forces move in?'
  options:
    O1:
      do: The task-force commander executes the operation as a simultaneous ground and air action with the air component in
        an on‑call support role.
      move: act
      irreversible: true
    O2:
      do: The task-force commander delays the operation and begins with a major preparatory air bombardment before ground
        forces move in.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: TF MOUNTAIN had control over Army forces and some SOF units, but not over all SOF, other governmental agencies,
      or the air component that remained under the Combined Force Air Component Commander (CFACC).
  - id: F2
    kind: authority
    status: confirmed
    fact: The CFACC directed U.S. air forces operating in Afghanistan, and TF MOUNTAIN had not yet established direct coordination
      with the CFACC.
  - id: F3
    kind: capability
    status: confirmed
    fact: The original battle plan conceived Anaconda as primarily a ground operation, viewing air forces as providing limited
      fires in support of the ground maneuver.
  - id: F4
    kind: capability
    status: confirmed
    fact: TF MOUNTAIN established restrictive fire‑control measures that would render virtually the entire valley inappropriate
      for airstrikes, assigning the air component only an on‑call close‑air‑support role and strikes against ingress/egress
      routes.
  - id: F5
    kind: situation
    status: confirmed
    fact: By late February the CFACC was only fully informed of the plan on February 20, the combined air operations center
      was fully apprised on February 23, the full fuel requirement was defined on February 25, and the battle start was delayed
      to March 2 because of bad weather.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Al Qaeda forces were congregating in and around the Shahikot Valley, creating an opportunity for a strike operation.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A major air bombardment prior to ground insertion would likely have greatly suppressed al Qaeda's ability to mount
      a serious defense.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Simultaneous ground‑air operations remove the possibility of a large preparatory bombing campaign and increase the
      need for close air‑ground integration.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: TF MOUNTAIN did not control the air component and had not established direct coordination with the CFACC, limiting
      the ability to plan and execute a large preparatory air bombardment.
  - id: C2
    facts:
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Late briefings to the CFACC, the CAOC, and the definition of fuel requirements, combined with weather‑induced delay,
      left insufficient time to develop and launch a major pre‑strike bombing campaign.
  - id: C3
    facts:
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The enemy was massed in the valley; a simultaneous ground‑air operation prevented them from dispersing and required
      on‑call close‑air‑support to react to emerging threats.
  - id: C4
    facts:
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The original plan treated air as a secondary, limited fire support element, and restrictive fire‑control measures
      made most of the valley unsuitable for airstrikes, reinforcing the decision to keep air in an on‑call role.
  - id: C5
    facts:
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: A major preparatory bombardment would likely have suppressed al Qaeda’s defensive capability, but the operational
      constraints (authority, timing, weather) made this option impractical.
  reasoning:
    read: The situation was that TF MOUNTAIN had primary control of ground forces but limited authority over the air component,
      which was only briefed days before the planned start and faced weather delays. The trap was to assume a large pre‑strike
      air campaign could be executed despite these constraints.
    weighing: The source weighed the authority gap (C1), the timing shortfall (C2), and the mission imperative to engage a
      concentrated enemy (C3) against the theoretical benefit of a preparatory bombardment (C5). Because the constraints were
      strong, the balance tipped toward a simultaneous ground‑air execution with air on‑call (C4 reinforces this by noting
      the restrictive fire‑control measures).
    tradecraft: Record the decision in the operation order, note the on‑call CAS tasking, and document the limited coordination
      with CFACC for after‑action review. Ensure the CAOC is kept informed of ground movements for real‑time targeting.
    uncertainty: Uncertainty remained about the enemy’s ability to reorganize if air support was delayed, and about the exact
      fuel availability for a larger strike.
    handoff: The decision was made by the TF MOUNTAIN commander alone, but required immediate notification to the CFACC and
      the CAOC to enable on‑call support.
    tempting_wrong:
      option: O2
      pull: The appeal of a massive pre‑strike bombardment that could have degraded the enemy before ground insertion.
      why_wrong: Given the late air‑component briefings, lack of coordination, and weather‑driven schedule, a large preparatory
        strike could not be reliably planned or executed, risking mission delay and loss of surprise.
    rejected:
      O2: A preparatory air bombardment was rejected because the air component was only fully briefed days before the operation,
        restrictive fire‑control measures limited viable strike zones, and weather delays left insufficient time to plan and
        allocate the required fuel.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: TF MOUNTAIN had established direct coordination with the CFACC and the full fuel requirement had been defined at
        least 48 hours before the planned start
      then: O2
      why: Early coordination and sufficient logistical preparation would have enabled a comprehensive preparatory air bombardment.
    would_not_change:
    - id: noflip1
      if: bad weather continued to delay the start of the operation beyond the window for a coordinated pre‑strike
      why: Weather constraints would still preclude a large preparatory bombing, keeping simultaneous execution as the viable
        option.
    watch_for:
    - id: watch1
      what: any sudden improvement in weather that allows earlier air‑component briefing
      favors:
      - O2
      why: Improved weather could create the time needed for a preparatory bombardment, shifting the balance toward sequential
        operations.
  lesson: When authority over air assets is limited and time is short, simultaneous ground‑air operations with on‑call air
    support become the practicable choice, but they demand tighter air‑ground integration than originally planned.
  limits: This reasoning applies only when the air component is not fully integrated into the command structure and logistical
    or weather constraints prevent a thorough pre‑strike air campaign; it does not extend to situations where air superiority
    and coordination allow extensive preparatory bombing.
  library:
    domain: military-operational
    family: ANACONDA-2002
    source: https://www.govinfo.gov/content/pkg/GOVPUB-D5_400-PURL-gpo135804/pdf/GOVPUB-D5_400-PURL-gpo135804.pdf
    episode_focus: Whether the task-force commander should launch the operation as a simultaneous ground and air action, with
      the air component in a supporting on-call role, rather than as a sequence beginning with a major preparatory air bombardment.
    cues:
      option_words:
        O1: 22
        O2: 19
      real_option: O1
      real_to_mean_other_length: 1.16
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
verdict_tier: source-endorsed
basis: The lessons‑learned analysis concluded that simultaneous ground‑air execution with on‑call close‑air‑support was required,
  emphasizing that when simultaneous operations are necessary the need for close air‑ground integration rises in importance.
