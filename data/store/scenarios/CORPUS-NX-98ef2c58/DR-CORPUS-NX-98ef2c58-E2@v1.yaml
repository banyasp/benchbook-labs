case:
  id: DR-CORPUS-NX-98ef2c58-E2@v1
  title: Assessing Soviet Intervention Readiness
  status: draft
  setting: Czechoslovakia, early August 1968, CIA Office of Strategic Research.
  decider: The Office of Strategic Research
  agent: The Office of Strategic Research
  agent_role: advise
  situation: The Office of Strategic Research is weighing whether to communicate an assessment of Soviet military readiness
    to intervene in Czechoslovakia if Soviet political leaders chose to do so. Pact-wide military exercises had taken place
    during the preceding weeks. CIA had warned that the exercises could signal military intervention, while most US intelligence
    analysts continued to expect Soviet restraint. Other reporting indicated pressure on the Polish Government to prepare
    for an invasion, contingency preparations by Soviet air forces, and an indefinite alert status among senior military officials
    in Moscow. The Office must decide whether to issue a warning, withhold one, or seek additional analytic review.
  question: What should the Office of Strategic Research do about communicating its assessment of Soviet readiness to intervene
    if Soviet political leaders choose to do so?
  options:
    O1:
      do: The Office of Strategic Research requests the CIA analytic community to review intervention readiness and deliver
        an assessment to the Office.
      move: ask
      irreversible: false
      to: the CIA analytic community
    O2:
      do: The Office of Strategic Research withholds a warning that preparations are sufficient for intervention if Soviet
        political leaders choose it.
      move: act
      irreversible: true
    O3:
      do: The Office of Strategic Research issues a warning that preparations are sufficient for intervention if Soviet political
        leaders choose it.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Soviet Union conducted a series of Pact-wide military exercises during the summer of 1968.
  - id: F2
    kind: intelligence
    status: assessed
    fact: CIA warned that the exercises could be signs of military intervention.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Most analysts in the US intelligence community continued to believe that the Soviet Union would exercise restraint.
  - id: F4
    kind: intelligence
    status: assessed
    fact: CIA reported that the Polish Government was under great pressure to prepare for an invasion.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Soviet air forces were reported to be making contingency preparations for operations in Czechoslovakia.
  - id: F6
    kind: intelligence
    status: assessed
    fact: High-level military officials in Moscow were reported to be operating on an indefinite alert status.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O3
    - O1
    weight: weak
    why: CIA judged that the exercises could signal intervention, supporting a warning about readiness, while the qualified
      wording leaves room for further assessment.
  - id: C2
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O1
    - O2
    weight: weak
    why: Most analysts continued to expect Soviet restraint, a real countervailing assessment, though it addressed likely
      restraint rather than whether forces were ready if leaders chose intervention.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Reporting about pressure to prepare for invasion, contingency preparations, and senior military officials on indefinite
      alert supported OSR's judgment that preparations were sufficient to intervene if political leaders chose to do so.
  reasoning:
    read: The question is whether Soviet forces were prepared to intervene, not whether political leaders had decided to order
      an intervention. The trap is treating the prevailing expectation of restraint as if it disproved military readiness.
    weighing: The exercises alone were not conclusive, and most analysts expected restraint {C1} {C2}. But the additional
      reporting about invasion preparations, contingency planning, and alert status supported OSR's conditional readiness
      assessment {C3}. The assessment should communicate preparedness without converting it into a prediction that intervention
      had been politically decided.
    tradecraft: 'State the conclusion conditionally: preparations appeared sufficient for intervention if political leaders
      chose it. Preserve the distinction between readiness and intent, and record the contrary expectation of restraint so
      the assessment does not imply unanimity.'
    uncertainty: There was disagreement about whether Soviet leaders would exercise restraint, and the evidence supports a
      judgment about readiness rather than certainty about what leaders would decide.
    handoff: The OSR should communicate its own assessment in its advisory role. No separate approval requirement is identified;
      retaining the differing analyst view makes the disagreement visible.
    tempting_wrong:
      option: O2
      pull: Most analysts continued to believe the Soviet Union would exercise restraint.
      why_wrong: That expectation concerns what Soviet leaders might choose; it does not answer OSR's narrower assessment
        of whether preparations were sufficient if they chose intervention.
    rejected:
      O1: OSR issued its readiness judgment on the reported evidence rather than making further review a prerequisite.
      O2: Withholding the warning would disregard OSR's assessment that preparations were sufficient for intervention if political
        leaders chose it.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible further assessment substantially undermined the reporting that supported OSR's readiness judgment.
      then: O1
      why: With the basis for the warning materially weakened, further analytic review would be preferable to issuing the
        same conclusion or withholding it without reassessment.
    would_not_change:
    - id: noflip1
      if: Most analysts continued to expect restraint, without new evidence undermining the reported preparations.
      why: That expectation does not resolve the separate question of readiness if political leaders chose intervention.
    watch_for: []
  lesson: Keep estimates of capability or readiness distinct from estimates of intent. When evidence supports readiness but
    analysts disagree about what leaders will choose, communicate the conditional assessment and preserve the disagreement
    rather than treating one judgment as a substitute for the other.
  limits: This reasoning supports a conditional estimate of readiness on the evidence described; it does not establish that
    Soviet leaders had decided to intervene or that intervention would occur. It does not determine how an intelligence office
    should handle other kinds of uncertainty or evidence.
  library:
    domain: intel-analysis
    family: CORPUS-NX-98ef2c58
    source: https://www.cia.gov/static/12ab7acafeb7b982f33bb06193403fc0/Strategic-Warning-and-The-Role-of-Intelligence.pdf
    episode_focus: 'The passage presents competing interpretations: most analysts continued to expect restraint, while the
      Office of Strategic Research judged that preparations were sufficient to intervene if Soviet political leaders chose
      to do so. Focus on the estimative judgment and the evidence weighed; exclude the technical details of intelligence collection
      and military movements.'
    cues:
