        O3: 13
      real_option: O1
      real_to_mean_other_length: 1.0
      real_is_longest: false
      moves:
        O1: act
        O2: ask
        O3: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
        O3: false
    equities: pilot2
