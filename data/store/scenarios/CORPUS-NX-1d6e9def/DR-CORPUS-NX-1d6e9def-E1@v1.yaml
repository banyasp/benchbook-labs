case:
  id: DR-CORPUS-NX-1d6e9def-E1@v1
  title: Disposition of Munitions During an Aircraft Emergency
  status: draft
  setting: In flight at a distance from Kandahar, around 0932Z; Combined Air Operations Center and Combined Forces Air Component
    Commander.
  decider: The Combined Forces Air Component Commander (CFACC)
  agent: The Combined Forces Air Component Commander (CFACC)
  agent_role: decide
  situation: An aircraft was experiencing engine failure, could not maintain altitude, and was distant from Kandahar. Munitions
    remained aboard. The crew asked the CAOC for disposition instructions covering the aircraft and the munitions. It had
    paused further attention to the engine problem while the munitions-disposition issue was addressed. The crew's immediate
    constraint was a safe and appropriate disposition that avoided harm to people and property.
  question: What should the CFACC do about the munitions aboard the aircraft?
  options:
    O1:
      do: The CFACC should authorize disposal of the munitions in an unpopulated area.
      move: act
      irreversible: true
    O2:
      do: The CFACC should request an aircraft-status update before issuing disposition instructions.
      move: ask
      irreversible: false
      to: the crew
    O3:
      do: The CFACC should decline authorization and direct the crew to retain the munitions.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The aircraft was experiencing an engine failure.
  - id: F2
    kind: capability
    status: confirmed
    fact: The aircraft was unable to maintain altitude.
  - id: F3
    kind: situation
    status: confirmed
    fact: The aircraft was distant from Kandahar.
  - id: F4
    kind: situation
    status: confirmed
    fact: Munitions were aboard the aircraft.
  - id: F5
    kind: situation
    status: confirmed
    fact: The crew queried the CAOC for disposition instructions concerning the aircraft and the munitions.
  - id: F6
    kind: situation
    status: confirmed
    fact: The crew suspended troubleshooting the engine failure while addressing the munitions-disposition issue.
  - id: F7
    kind: situation
    status: confirmed
    fact: A safe and appropriate disposition that avoided harm to people and property was the stated constraint.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Engine failure, inability to maintain altitude, distance from Kandahar, and munitions still aboard made a safe disposition
      an urgent problem.
  - id: C2
    facts:
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The stated constraint was to avoid harm to people and property; the CFACC's instruction directed disposition in an
      unpopulated area.
  - id: C3
    facts:
    - F1
    - F6
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The crew had suspended troubleshooting while addressing the munitions issue. Ensuring a safe impact required the
      crew's full attention, precluding further engine troubleshooting during that period.
  - id: C4
    facts:
    - F5
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The crew sought disposition instructions through the CAOC, and the CFACC supplied them, placing the decision with
      the designated commander rather than leaving the crew without guidance.
  reasoning:
    read: 'This was an emergency disposition decision, not a routine choice about whether to use force. The trap is treating
      a request for more aircraft information as cost-free: the crew had paused troubleshooting while the munitions issue
      was addressed, and the aircraft could not maintain altitude.'
    weighing: The aircraft's condition and distance made prompt direction important, while avoiding injury and property damage
      constrained the choice. The CFACC directed disposal in an unpopulated area; the crew monitored the result and no injuries
      or property damage occurred. The balance depends on the emergency and the availability of a disposition that protects
      people and property, not on a general preference for expending munitions.
    tradecraft: Give the disposition instruction through the CAOC channel, make the civilian- and property-harm constraint
      explicit, and record the instruction and its basis. Once the immediate disposition issue is resolved, return attention
      to the aircraft emergency.
    uncertainty: The source gives no detailed comparison of alternative disposition options, no separate legal analysis, and
      no account of what other locations or information were available. It supports the decision made in the stated emergency,
      not a broader rule for aircraft emergencies.
    handoff: The CFACC should decide after the crew seeks guidance through the CAOC; the crew has the relevant immediate aircraft
      condition and carries out the direction. The account does not establish that additional approval was required.
    tempting_wrong:
      option: O2
      pull: Requesting an aircraft-status update before an irreversible instruction may seem prudent.
      why_wrong: The emergency was time-sensitive, and the crew was already diverting attention from engine troubleshooting
        to the munitions issue. No further update is identified as necessary to make the safe-disposition decision.
    rejected:
      O2: It was not chosen because the emergency called for a prompt disposition instruction, and no further status update
        was identified as needed before giving one.
      O3: It was not chosen because retaining the munitions did not resolve the stated safety problem of an aircraft with
        engine failure that could not maintain altitude.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The aircraft could maintain altitude and safely return to Kandahar with the munitions aboard.
      then: O2
      why: The urgency supporting immediate disposal would be reduced, making it more reasonable to obtain an aircraft-status
        update before deciding.
    - id: flip2
      if: No unpopulated area or other disposition could reasonably avoid harm to people and property.
      then: O2
      why: The stated safety constraint would not be met by authorizing disposal on the known information; further information
        or direction would be needed.
    would_not_change:
    - id: noflip1
      if: The eventual impact caused no injuries or property damage.
      why: That outcome is reassuring, but it would not by itself change the ex ante need to assess the aircraft emergency
        and protect people and property.
    watch_for:
    - id: watch1
      what: A material change in the aircraft's ability to maintain altitude or in the crew's assessment of immediate risk.
      favors:
      - O2
      why: A changed aircraft condition could alter the urgency or the safe available choices and may warrant an updated assessment.
  lesson: In an aircraft emergency, the commander should give timely disposition direction when the crew seeks it, while making
    avoidance of harm to people and property the controlling constraint. Do not treat a successful outcome as proof that the
    same choice is appropriate when the aircraft condition or safe options differ.
  limits: This reasoning is limited to the stated emergency, in which the aircraft could not maintain altitude and the crew
    had paused engine troubleshooting to address the munitions disposition. The source does not supply a general legal standard,
    a full comparison of alternatives, or guidance for situations where a safe disposition is unavailable.
