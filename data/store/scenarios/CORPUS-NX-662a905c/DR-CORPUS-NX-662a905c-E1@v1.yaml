case:
  id: DR-CORPUS-NX-662a905c-E1@v1
  title: A Private-Sector Link to New Technology
  status: draft
  setting: CIA, 1999, Internet era
  decider: The CIA
  agent: The CIA
  agent_role: decide
  situation: The CIA was positioning itself for the Internet era and had moved beyond innovative use of the web and its engines.
    Commercial information technology was advancing rapidly, making it difficult for government agencies to access and incorporate
    the latest technologies. One available course was to establish a separate private-sector company to connect the agency
    with technology firms, solutions, and approaches for priority problems. Another was to rely on ordinary government access
    and procurement.
  question: What should the CIA do about using a separate private-sector company to connect the agency with new technology
    firms and solutions?
  options:
    O1:
      do: The CIA rejects establishing a separate private, not-for-profit company and relies on ordinary government access
        and procurement.
      move: act
      irreversible: false
    O2:
      do: The CIA approves establishing a separate private, not-for-profit company to connect the agency with technology firms
        and solutions.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Intelligence Community was positioning itself for the Internet era and had gone beyond innovative use of the
      web and its engines.
  - id: F2
    kind: situation
    status: assessed
    fact: The information technology economy was advancing at a rapid pace.
  - id: F3
    kind: situation
    status: assessed
    fact: The pace of technology development made it difficult for government agencies to access the latest information technology.
  - id: F4
    kind: situation
    status: assessed
    fact: The pace of technology development made it difficult for government agencies to incorporate the latest information
      technology.
  - id: F5
    kind: capability
    status: confirmed
    fact: The separate private, not-for-profit company was dedicated to spurring development of information technologies for
      national-security safeguarding.
  - id: F6
    kind: capability
    status: confirmed
    fact: The company's stated aim was to extend the agency's access to new technology companies, solutions, and approaches.
  - id: F7
    kind: capability
    status: confirmed
    fact: The approaches sought through the company were intended to address the agency's priority problems.
  - id: F8
    kind: capability
    status: assessed
    fact: Investing in technologies as they became commercially available could benefit the CIA and the rest of the Intelligence
      Community.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The rapid pace of commercial IT made it difficult for government agencies to access and incorporate the latest technology;
      the separate company was a response to that access gap.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The company was dedicated to advancing technology for national-security safeguarding and was intended to connect
      the agency with firms, solutions, and approaches for its priority problems.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Investing as technologies became commercially available was assessed as potentially benefiting both the CIA and the
      wider Intelligence Community.
  reasoning:
    read: This is a choice about how the CIA can reach rapidly developing commercial technology, not a decision about any
      particular technology or its operational use. The trap is treating ordinary government access and procurement as an
      adequate alternative without addressing the stated difficulty of keeping pace.
    weighing: 'The central reason favors O2: commercial IT was advancing so quickly that government agencies had difficulty
      accessing and incorporating the latest developments {C1}. A separate company was designed to extend access to firms
      and approaches for priority problems, with potential benefits for the CIA and the wider Intelligence Community {C2}
      {C3}. The balance depends on whether that access gap exists and whether the company can help address it.'
    tradecraft: If approving O2, document the access problem and the intended connection to priority needs, then periodically
      assess whether the separate company is extending access in practice.
    uncertainty: The source provides the access rationale but does not compare costs, governance risks, or the performance
      of the company against ordinary procurement.
    handoff: The CIA should make the decision, with relevant technology and procurement officials informing whether the access
      gap persists and whether the company addresses it; this consultation is an implementation suggestion, not a source-stated
      requirement.
    tempting_wrong:
      option: O1
      pull: Relying on ordinary government access and procurement avoids creating a separate company.
      why_wrong: On the stated facts, that choice does not address the difficulty government agencies faced accessing and
        incorporating the latest commercial technology.
    rejected:
      O1: The CIA did not choose reliance on ordinary government access and procurement because the stated rationale for In-Q-Tel
        was that the pace of commercial IT made that access difficult.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Ordinary government access and procurement could reliably provide the latest commercial technology at the pace needed.
      then: O1
      why: The access gap that supplies the principal reason for a separate company would no longer be present.
    - id: flip2
      if: The separate company could not extend the CIA's access to technology firms, solutions, or approaches.
      then: O1
      why: The proposed company's stated purpose would not be served.
    would_not_change:
    - id: noflip1
      if: The company's potential benefits extended to the CIA but not the rest of the Intelligence Community.
      why: That would narrow the potential benefit, but the stated access problem and the CIA's priority needs would still
        support O2.
    watch_for:
    - id: watch1
      what: Whether the commercial IT access and incorporation gap persists.
      favors:
      - O2
      why: The rationale for a separate company rests on that difficulty.
  lesson: When commercial technology advances faster than government agencies can access and incorporate it, a dedicated intermediary
    may be justified if it expands access to solutions for priority needs. The case for that structure should be reassessed
    if ordinary channels close the gap or the intermediary does not deliver its stated purpose.
  limits: This reasoning addresses only the choice to establish a separate company as a means of connecting the CIA with technology
    firms and solutions. It does not establish that any particular investment is lawful, effective, cost-effective, or appropriate
    for operational use.
  library:
    domain: cyber-policy
    family: CORPUS-NX-662a905c
    source: https://www.cia.gov/resources/csi/static/1190ab756375b48f13412b414b879067/Intel-in-Internet-Era.pdf
    episode_focus: The decision point is the CIA’s choice to use a separate private-sector company to connect the agency with
      new technology firms and solutions, rather than relying solely on ordinary government access and procurement. The source
      gives the reason that the pace of commercial IT development made it difficult for government agencies to access and
      incorporate the latest technologies. Exclude the listed technical capabilities and any operational use of them.
