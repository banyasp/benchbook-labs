case:
  id: DR-OGE-2635-502-revise1@v1
  title: IRS Audit Participation Authorization [revise]
  status: needs_review
  setting: Internal Revenue Service, tax audit, present day
  decider: Agency designee (ethics official)
  agent: Ethics Assistant AI
  agent_role: decide
  situation: An Internal Revenue Service employee is conducting a long and complex tax audit that is essentially complete.
    The employee’s child has recently accepted an entry‑level management position with the corporation whose taxes are being
    audited. The employee is the only individual with intimate knowledge of the audit’s details. The agency designee has the
    authority to determine whether the employee may continue participation, considering appearance concerns and the government’s
    interest. The audit will undergo additional levels of review before finalization. The agency designee must decide whether
    to authorize the employee to finish the audit or require recusal.
  question: What should the agency designee do regarding the employee’s participation in the audit?
  options:
    O1:
      do: The agency designee requests additional information before deciding on the employee’s participation.
      move: ask
      irreversible: false
    O2:
      do: The agency designee denies the employee’s participation in the audit.
      move: act
      irreversible: true
    O3:
      do: The agency designee authorizes the employee to complete the audit.
      move: act
      irreversible: true
    O4:
      do: The agency designee defers the decision on the employee’s participation pending further review.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is involved in a long and complex tax audit.
  - id: F2
    kind: situation
    status: confirmed
    fact: The audit is essentially complete.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee’s child has accepted an entry‑level management position with the corporation whose taxes are subject
      of the audit.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee is the only person with intimate knowledge of the case.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency designee may authorize the employee to participate if the government’s interest outweighs the appearance
      concern, per §2635.502(d).
  - id: F6
    kind: situation
    status: confirmed
    fact: The audit is subject to additional levels of review.
  considerations:
  - id: C1
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The employee's child holds an entry-level management position with the audited corporation, creating a covered relationship
      that a reasonable person could view as an appearance problem; the designee should first gather more detail before deciding.
  - id: C2
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The audit is essentially complete and the employee is the only person with intimate knowledge of the case; completing
      it serves the Government’s interest in an efficient and accurate resolution.
  - id: C3
    facts:
    - F2
    - F5
    equity: resource_stewardship
    favors:
    - O3
    weight: weak
    why: Reassigning the audit at this stage would consume additional resources and could delay finalization, which the regulation
      permits the designee to weigh against appearance concerns.
  - id: C4
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The child’s role is entry‑level and unrelated to the audit’s substantive decisions, lessening the likelihood that
      a reasonable person would view the employee’s participation as biased.
  - id: C5
    facts:
    - F3
    - F5
    equity: procedural_fairness
    favors:
    - O1
    weight: strong
    why: Because the relationship raises an appearance issue, the designee should obtain detailed information about the child's
      role and any potential influence before making a final participation decision.
  reasoning:
    read: The employee's child has taken an entry-level management job at the corporation under audit ({F3}); the audit is
      essentially complete ({F2}) and the employee is the sole holder of intimate case knowledge ({F4}).
    weighing: The strong appearance concern identified in {C1} outweighs the modest government interest in finishing the audit
      without delay. Before weighing the mission benefit, the designee should collect additional facts about the child's duties
      and any possible influence, as highlighted by the new procedural-fairness consideration {C5}. This makes a request for
      more information the rational choice.
    tradecraft: Document the request for specific details about the child's position, reporting lines, and any communications
      with the corporation; set a deadline for the employee to provide this information before any final decision is made.
    uncertainty: Uncertainty remains about the extent of the child's influence; obtaining the additional information reduces
      this uncertainty and protects the agency's credibility.
    handoff: After receiving the requested information, the designee may consult senior ethics counsel to confirm whether
      the appearance concern can be mitigated or if recusal is required.
    tempting_wrong:
      option: O2
      pull: A strict avoidance of any appearance problem could lead to an immediate denial of participation.
      why_wrong: Denial ignores that the appearance issue can be clarified with further facts and that reassignment at this
        stage is feasible, contrary to the balanced approach required by §2635.502(d).
    rejected:
      O2: Denial would pre-emptively eliminate a reasonable path to resolve the appearance concern through additional information.
      O3: Authorizing participation without first clarifying the child's role risks a later perception of bias and undermines
        institutional credibility.
      O4: Deferring the decision without a concrete request for information adds no procedural value and delays resolution.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the employee's child held a senior decision-making role that directly affected the audit outcome
      then: O3
      why: The appearance concern would become substantial enough to outweigh the government interest.
    - id: flip2
      if: the audit were not near completion and could be reassigned without significant delay
      then: O2
      why: The difficulty of reassignment factor would be removed, reducing the government interest in retaining the employee.
    would_not_change:
    - id: noflip1
      if: the child's position remains entry-level and unrelated to the audit's substantive decisions
      why: The appearance concern stays minimal and does not alter the balance.
    watch_for:
    - id: watch1
      what: public or media scrutiny that later characterizes the child's role as influential
      favors:
      - O2
      why: Increased perception of bias could pressure a reversal of the authorization.
  lesson: When a covered relationship exists, the agency designee should first seek detailed information about the relative's
    role before deciding on participation, ensuring both appearance concerns and mission needs are properly balanced.
  limits: Applies where the employee's knowledge is unique, the audit is near completion, and the relative's position is low-level;
    it does not extend to senior family involvement or early-stage matters.
