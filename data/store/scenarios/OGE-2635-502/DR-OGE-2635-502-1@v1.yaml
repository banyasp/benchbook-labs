case:
  id: DR-OGE-2635-502-1@v1
  title: DoD Avionics Testing Employee Child's HR Job – Recusal Decision
  status: draft
  setting: Department of Defense avionics testing office, present
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An employee of the Department of Defense is assigned to test avionics produced by a large Air Force contractor.
    The employee learns that their adult child has accepted a staff position in the contractor's human resources division.
    Because the child's employment creates a covered relationship with the contractor, the employee must assess whether a
    reasonable person would question their impartiality. The testing matter involves the contractor as a specific party and
    the employee's role includes exercising discretion over testing outcomes. The employee may either recuse from the matter
    or continue participation based on appearance considerations.
  question: What should the employee do regarding participation in the avionics testing matter?
  options:
    O1:
      do: The employee is prohibited from participating in the avionics testing matter.
      move: act
      irreversible: true
    O2:
      do: The employee is permitted to participate in the avionics testing matter.
      move: act
      irreversible: false
    O3:
      do: The employee is requesting a determination from the agency designee.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is assigned to test avionics produced by a large Air Force contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee's adult child accepted a staff position in the contractor's human resources division.
  - id: F3
    kind: authority
    status: confirmed
    fact: A child employed by a contractor creates a covered relationship under the definition of a covered relationship.
  - id: F4
    kind: situation
    status: confirmed
    fact: The testing matter involves a specific party and is a particular matter involving specific parties.
  - id: F5
    kind: capability
    status: assessed
    fact: The employee's role includes exercising discretion in the avionics testing matter.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The employee must consider whether a reasonable person would question their impartiality under paragraph (a)(2).
  - id: F7
    kind: authority
    status: confirmed
    fact: The employee may seek assistance from a supervisor, agency ethics official, or agency designee regarding appearance
      concerns.
  - id: F8
    kind: authority
    status: confirmed
    fact: If an appearance problem exists and is not authorized, the employee must recuse from the matter.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The child’s employment creates a covered relationship, which ordinarily raises an appearance concern under paragraph
      (a)(2).
  - id: C2
    facts:
    - F2
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The child works in human resources, a function unrelated to the avionics testing contract; therefore a reasonable
      person would not question the employee’s impartiality.
  - id: C3
    facts:
    - F5
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The employee’s role involves discretion over testing outcomes, but because the relative’s duties are unrelated, the
      appearance risk is mitigated.
  reasoning:
    read: The employee discovers a covered family relationship (child employed by the contractor) that could, on its face,
      raise an appearance question under §2635.502(a)(2). The regulation, however, allows the employee to conclude that no
      appearance problem exists if a reasonable person would not doubt impartiality.
    weighing: Applying the source’s own example (Example 6), the covered relationship (C1) is noted but outweighed by the
      fact that the child’s HR position bears no connection to the avionics contract (C2). The employee’s discretionary role
      (C3) does not change the analysis because the unrelated nature of the child’s job eliminates the perception of bias.
      Hence the balance tips toward permitting participation.
    tradecraft: The employee should document the analysis, noting the child’s HR role and the lack of relevance to the contract,
      and retain the record in the agency’s ethics file. No formal designee determination is required because the employee
      can justifiably conclude no appearance problem.
    uncertainty: Minimal; the regulation and the cited example give clear guidance that unrelated duties of a covered relative
      do not create an appearance issue.
    handoff: The employee may decide alone, but should inform a supervisor or ethics official as a best practice (per §2635.502(a)).
    tempting_wrong:
      option: O1
      pull: A conservative impulse to recuse because any family tie to a contractor looks suspicious.
      why_wrong: The source’s example expressly states that when the relative’s work is unrelated, recusal is not required.
    rejected:
      O1: Recusal is unnecessary because the child’s HR position does not affect the avionics testing contract.
      O3: A designee determination is optional; the employee can rely on the self‑assessment permitted by the regulation.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the child were employed in a position directly involved with the avionics contract (e.g., engineering or procurement
        for that product)
      then: O1
      why: The relative’s duties would then be directly connected to the matter, creating a reasonable‑person appearance problem.
    would_not_change:
    - id: noflip1
      if: the child remains in the human‑resources division with no influence over the avionics contract
      why: The source’s example confirms that the employee may continue participation.
    watch_for:
    - id: watch1
      what: any future reassignment of the child to a role that influences the contract
      favors:
      - O1
      why: A change in the child’s duties could create an appearance problem requiring recusal.
  lesson: A covered family relationship does not automatically require recusal; if the relative’s duties are unrelated to
    the specific matter, the employee may reasonably conclude that impartiality will not be questioned.
  limits: This rule applies only when the relative’s role is demonstrably unrelated to the contract and no statutory prohibition
    (e.g., 18 U.S.C. 208) applies. It does not cover situations where the relative has decision‑making authority or a financial
    stake in the outcome.
