case:
  id: DR-OGE-2635-502-flip1@v1
  title: DoD Avionics Testing Employee Child's HR Job – Recusal Decision [flip]
  status: needs_review
  setting: DoD avionics evaluation office, present day
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An employee of the Department of Defense has been tasked with testing avionics supplied by a major Air Force
    contractor. The employee discovers that their adult child has taken a staff position in the contractor's avionics systems
    development and sourcing division. Because the child's job directly supports the product under test, the employee must
    determine whether a reasonable observer would question their impartiality. The testing assignment involves the contractor
    as a specific party, and the employee's duties include discretionary judgment over test outcomes. The employee may either
    withdraw from the assignment or continue, based on appearance considerations.
  question: What should the employee do regarding participation in the avionics testing assignment?
  options:
    O1:
      do: The employee is prohibited from participating in the avionics testing matter.
      move: act
      irreversible: true
    O2:
      do: The employee is permitted to participate in the avionics testing matter.
      move: act
      irreversible: false
    O3:
      do: The employee is requesting a determination from the agency designee.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee has been tasked with evaluating avionics supplied by a major Air Force contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee's adult child accepted a staff position in the contractor’s avionics systems development and sourcing
      division.
  - id: F3
    kind: authority
    status: confirmed
    fact: Employment of a child by a contractor constitutes a covered relationship as defined by the regulations.
  - id: F4
    kind: situation
    status: confirmed
    fact: The matter under review concerns a specific contractor and is a distinct, party-specific issue.
  - id: F5
    kind: capability
    status: assessed
    fact: The employee's responsibilities include discretionary authority over the testing outcomes.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Under paragraph (a)(2), the employee must assess whether a reasonable observer would question their impartiality.
  - id: F7
    kind: authority
    status: confirmed
    fact: The employee may consult a supervisor, the agency's ethics official, or an authorized designee for guidance on appearance
      concerns.
  - id: F8
    kind: authority
    status: confirmed
    fact: If an appearance problem is identified and not waived, the employee is required to withdraw from the assignment.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The child's employment creates a covered relationship, which ordinarily raises an appearance concern under paragraph
      (a)(2).
  - id: C2
    facts:
    - F2
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The child works in avionics systems development and sourcing, a function directly tied to the contract under review;
      a reasonable person would likely question the employee's impartiality.
  - id: C3
    facts:
    - F5
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Because the employee's discretionary role could influence outcomes, and the relative's duties are directly related
      to the same product, the appearance risk is heightened.
  reasoning:
    read: The employee discovers a covered family relationship (child employed in the contractor's avionics development division)
      that directly intersects with the testing assignment, creating a clear appearance problem under §2635.502(a)(2). The
      regulation requires recusal unless a reasonable person would not question impartiality, which is not the case here.
    weighing: The source's own guidance (Example 6) indicates that when a relative's duties are directly connected to the
      matter, the appearance concern outweighs any operational need. Both C1 and C2 identify a covered relationship and a
      direct functional link, and C3 adds that the employee's discretionary authority compounds the risk. Consequently, the
      balance tips toward prohibiting participation.
    tradecraft: The employee should document the analysis, noting the child's role in avionics development and the resulting
      appearance issue, and forward the record to the agency ethics official. A formal designee determination is unnecessary
      because the regulation mandates recusal.
    uncertainty: Minimal; the regulation and the cited example provide clear direction that a direct family link to the contract
      creates an appearance problem.
    handoff: The employee must recuse, but should still inform a supervisor or ethics official as a matter of best practice.
    tempting_wrong:
      option: O2
      pull: A desire to stay on the project because of expertise and workload pressures.
      why_wrong: The child's role directly supports the contract, so the appearance concern cannot be dismissed.
    rejected:
      O2: Participation is impermissible because the child's duties are directly related to the avionics contract, creating
        an appearance problem.
      O3: A designee determination is unnecessary; the regulation already requires recusal when an appearance issue exists.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the child were employed in a role unrelated to the avionics contract, such as a human-resources position with no
        influence over the product
      then: O2
      why: The relative's duties would then be disconnected from the matter, removing the appearance problem and allowing
        participation.
    would_not_change:
    - id: noflip1
      if: the child remains in the avionics systems development and sourcing division with direct influence over the contract
      why: The direct link sustains the appearance concern, confirming the need for recusal.
    watch_for:
    - id: watch1
      what: any future reassignment of the child to a role that influences the contract
      favors:
      - O1
      why: A change in the child's duties could create an appearance problem requiring recusal.
  lesson: When a covered family relationship involves a relative whose duties are directly tied to the contract under review,
    the appearance concern is sufficient to require recusal; the employee must not participate.
  limits: This guidance applies only when the relative's role is demonstrably connected to the specific contract and no statutory
    exemption (e.g., 18 U.S.C. 208) applies. It does not cover situations where the relative's position is unrelated or merely
    peripheral to the matter.
