case:
  id: DR-OGE-2635-502-revise2@v1
  title: DoD Avionics Testing Employee Child's HR Job – Recusal Decision [revise]
  status: needs_review
  setting: Department of Defense avionics testing office, present
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An employee of the Department of Defense is assigned to test avionics produced by a large Air Force contractor.
    The employee learns that their adult child has accepted a staff position in the contractor's human resources division.
    Because the child's employment creates a covered relationship with the contractor, the employee must assess whether a
    reasonable person would question their impartiality. The testing matter involves the contractor as a specific party and
    the employee's role includes exercising discretion over testing outcomes. The employee may either recuse from the matter
    or continue participation based on appearance considerations.
  question: What should the employee do regarding participation in the avionics testing matter?
  options:
    O1:
      do: The employee is prohibited from participating in the avionics testing matter.
      move: act
      irreversible: true
    O2:
      do: The employee is permitted to participate in the avionics testing matter.
      move: act
      irreversible: false
    O3:
      do: The employee is requesting a determination from the agency designee.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is assigned to test avionics produced by a large Air Force contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee's adult child accepted a staff position in the contractor's human resources division.
  - id: F3
    kind: authority
    status: confirmed
    fact: A child employed by a contractor creates a covered relationship under the definition of a covered relationship.
  - id: F4
    kind: situation
    status: confirmed
    fact: The testing matter involves a specific party and is a particular matter involving specific parties.
  - id: F5
    kind: capability
    status: assessed
    fact: The employee's role includes exercising discretion in the avionics testing matter.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The employee must consider whether a reasonable person would question their impartiality under paragraph (a)(2).
  - id: F7
    kind: authority
    status: confirmed
    fact: The employee may seek assistance from a supervisor, agency ethics official, or agency designee regarding appearance
      concerns.
  - id: F8
    kind: authority
    status: confirmed
    fact: If an appearance problem exists and is not authorized, the employee must recuse from the matter.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The existence of a covered family relationship obligates the employee to obtain a formal appearance determination
      from the agency designee, even when the relative's job appears unrelated, to preserve institutional credibility.
  - id: C2
    facts:
    - F2
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The child works in human resources, a function unrelated to the avionics testing contract; therefore a reasonable
      person would not question the employee’s impartiality.
  - id: C3
    facts:
    - F5
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The employee’s role involves discretion over testing outcomes, but because the relative’s duties are unrelated, the
      appearance risk is mitigated.
  reasoning:
    read: The employee's child works for the contractor, creating a covered relationship that triggers appearance-concern
      rules under §2635.502(a)(2). The regulation requires the employee to seek guidance when any covered relationship exists,
      regardless of the relative's specific duties.
    weighing: Although the child's HR role is unrelated to avionics testing (C2, C3), the mere presence of a covered relationship
      (C1) imposes a procedural duty to obtain a designee determination. This procedural safeguard outweighs the argument
      for self-assessment, making O3 the appropriate course.
    tradecraft: The employee should submit a written request to the agency designee outlining the facts (F2-F5) and await
      the determination before proceeding. Documentation of the request and the designee's response must be retained in the
      ethics file.
    uncertainty: Low; the regulation is clear that a covered relationship creates an appearance issue that must be addressed
      through a formal determination, even if the relative's duties seem unrelated.
    handoff: The employee must involve the agency designee; the decision cannot be made unilaterally.
    tempting_wrong:
      option: O2
      pull: A belief that the unrelated HR position eliminates any appearance problem, allowing the employee to continue participation.
      why_wrong: Regulation §2635.502(a)(2) does not permit self-determination when a covered relationship exists; a formal
        designee determination is required.
    rejected:
      O1: Prohibiting participation outright is unnecessary because the regulation provides a less restrictive remedy—seeking
        a designee determination.
      O2: Continuing without a formal determination ignores the procedural requirement triggered by the covered relationship.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: the child were employed in a position directly involved with the avionics contract (e.g., engineering or procurement
        for that product)
      then: O2
      why: A direct involvement creates a heightened appearance concern, so the employee should seek a designee determination
        rather than recuse immediately.
    would_not_change:
    - id: noflip1
      if: the child remains in the human-resources division with no influence over the avionics contract
      why: The covered relationship still requires a formal determination, even though the duties are unrelated.
    watch_for:
    - id: watch1
      what: any future reassignment of the child to a role that influences the contract
      favors:
      - O1
      why: A change in the child's duties could create an appearance problem requiring recusal.
  lesson: A covered family relationship obligates the employee to obtain a formal appearance determination from the agency
    designee, regardless of the relative's job function.
  limits: This rule applies only when the relative's role is demonstrably unrelated to the contract and no statutory prohibition
    (e.g., 18 U.S.C. 208) applies. It does not cover situations where the relative has decision-making authority or a financial
    stake in the outcome.
