case:
  id: DR-OGE-2635-502-restyle1@v1
  title: DoD Avionics Testing Employee Child's HR Job – Recusal Decision [restyle]
  status: needs_review
  setting: Office of Naval Systems Evaluation, present day
  decider: the analyst
  agent: the analyst
  agent_role: decide
  situation: An analyst in the Office of Naval Systems Evaluation is assigned to evaluate software supplied by a major Navy
    contractor. The analyst learns that their adult child has taken a staff position in the contractor's human-resources division.
    Because that employment creates a covered relationship under the ethics rules, the analyst must judge whether a reasonable
    observer would question their impartiality. The evaluation concerns a specific contract and the analyst's duties include
    exercising judgment over the assessment outcomes. The analyst may either withdraw from the evaluation or continue participation
    based on appearance considerations.
  question: What should the analyst do regarding participation in the software evaluation?
  options:
    O1:
      do: The analyst is barred from taking part in the software evaluation.
      move: act
      irreversible: true
    O2:
      do: The analyst may continue to take part in the software evaluation.
      move: act
      irreversible: false
    O3:
      do: The analyst will request a formal determination from the agency's designated ethics official.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analyst is tasked with evaluating software supplied by a major Navy contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The analyst's adult child has taken a staff role in the contractor's human-resources department.
  - id: F3
    kind: authority
    status: confirmed
    fact: A child employed by a contractor constitutes a covered relationship as defined in the ethics regulations.
  - id: F4
    kind: situation
    status: confirmed
    fact: The evaluation concerns a specific contract and involves a particular contractor.
  - id: F5
    kind: capability
    status: assessed
    fact: The analyst's responsibilities include exercising judgment over the software assessment outcomes.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The analyst must determine whether a reasonable observer would question the analyst's impartiality under paragraph
      (a)(2).
  - id: F7
    kind: authority
    status: confirmed
    fact: The analyst may seek guidance from a supervisor, agency ethics official, or designated ethics officer regarding
      appearance concerns.
  - id: F8
    kind: authority
    status: confirmed
    fact: If an appearance issue exists and is not authorized, the analyst must withdraw from the evaluation.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Because the child's employment creates a covered relationship, it normally raises an appearance concern under paragraph
      (a)(2).
  - id: C2
    facts:
    - F2
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The child works in human resources, a function that does not intersect with the software contract; thus a reasonable
      observer would not doubt the analyst's impartiality.
  - id: C3
    facts:
    - F5
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Although the analyst's role involves judgment over assessment outcomes, the unrelated nature of the child's duties
      diminishes any appearance risk.
  reasoning:
    read: The analyst discovers a covered family relationship (child employed by the contractor) that could, on its face,
      raise an appearance question under §2635.502(a)(2). The regulation, however, permits the analyst to conclude that no
      appearance problem exists if a reasonable person would not doubt impartiality.
    weighing: Applying the source's own example (Example 6), the covered relationship (C1) is noted but outweighed by the
      fact that the child's HR position bears no connection to the software contract (C2). The analyst's discretionary role
      (C3) does not change the analysis because the unrelated nature of the child's job eliminates the perception of bias.
      Hence the balance tips toward permitting participation.
    tradecraft: The analyst should record the analysis, highlighting the child's HR role and its lack of relevance to the
      contract, and file the memorandum in the agency's ethics records. No formal designee determination is required because
      the analyst can justifiably conclude that no appearance problem exists.
    uncertainty: Minimal; the regulation and the cited example give clear guidance that unrelated duties of a covered relative
      do not create an appearance issue.
    handoff: The analyst may decide independently, but should inform a supervisor or ethics official as a best practice under
      §2635.502(a).
    tempting_wrong:
      option: O1
      pull: A cautious impulse to withdraw because any family tie to a contractor appears suspect.
      why_wrong: The source's example explicitly states that when the relative's work is unrelated, recusal is not required.
    rejected:
      O1: Withdrawal is unnecessary because the child's HR position does not affect the software contract.
      O3: A designee determination is optional; the analyst can rely on the self-assessment permitted by the regulation.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the child were employed in a position directly involved with the software contract (e.g., engineering or procurement
        for that product)
      then: O1
      why: The relative's duties would then be directly connected to the matter, creating a reasonable-person appearance problem.
    would_not_change:
    - id: noflip1
      if: the child remains in the human-resources division with no influence over the software contract
      why: The source's example confirms that the analyst may continue participation.
    watch_for:
    - id: watch1
      what: any future reassignment of the child to a role that influences the contract
      favors:
      - O1
      why: A change in the child's duties could create an appearance problem requiring withdrawal.
  lesson: A covered family relationship does not automatically mandate withdrawal; if the relative's duties are unrelated
    to the specific matter, the analyst may reasonably conclude that impartiality will not be questioned.
  limits: This guidance applies only when the relative's role is demonstrably unrelated to the contract and no statutory prohibition
    (e.g., 18 U.S.C. 208) applies. It does not cover situations where the relative has decision-making authority or a financial
    stake in the outcome.
