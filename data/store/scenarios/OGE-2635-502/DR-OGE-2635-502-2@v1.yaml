case:
  id: DR-OGE-2635-502-2@v1
  title: IRS Audit Participation Authorization
  status: draft
  setting: Internal Revenue Service, tax audit, present day
  decider: Agency designee (ethics official)
  agent: Ethics Assistant AI
  agent_role: decide
  situation: An Internal Revenue Service employee is conducting a long and complex tax audit that is essentially complete.
    The employee’s child has recently accepted an entry‑level management position with the corporation whose taxes are being
    audited. The employee is the only individual with intimate knowledge of the audit’s details. The agency designee has the
    authority to determine whether the employee may continue participation, considering appearance concerns and the government’s
    interest. The audit will undergo additional levels of review before finalization. The agency designee must decide whether
    to authorize the employee to finish the audit or require recusal.
  question: What should the agency designee do regarding the employee’s participation in the audit?
  options:
    O1:
      do: The agency designee requests additional information before deciding on the employee’s participation.
      move: ask
      irreversible: false
    O2:
      do: The agency designee denies the employee’s participation in the audit.
      move: act
      irreversible: true
    O3:
      do: The agency designee authorizes the employee to complete the audit.
      move: act
      irreversible: true
    O4:
      do: The agency designee defers the decision on the employee’s participation pending further review.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is involved in a long and complex tax audit.
  - id: F2
    kind: situation
    status: confirmed
    fact: The audit is essentially complete.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee’s child has accepted an entry‑level management position with the corporation whose taxes are subject
      of the audit.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee is the only person with intimate knowledge of the case.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency designee may authorize the employee to participate if the government’s interest outweighs the appearance
      concern, per §2635.502(d).
  - id: F6
    kind: situation
    status: confirmed
    fact: The audit is subject to additional levels of review.
  considerations:
  - id: C1
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The employee’s child holds an entry‑level management position with the audited corporation, creating a covered relationship
      under §2635.502(b)(iii) that could lead a reasonable person to question the employee’s impartiality.
  - id: C2
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The audit is essentially complete and the employee is the only person with intimate knowledge of the case; completing
      it serves the Government’s interest in an efficient and accurate resolution.
  - id: C3
    facts:
    - F2
    - F5
    equity: resource_stewardship
    favors:
    - O3
    weight: weak
    why: Reassigning the audit at this stage would consume additional resources and could delay finalization, which the regulation
      permits the designee to weigh against appearance concerns.
  - id: C4
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The child’s role is entry‑level and unrelated to the audit’s substantive decisions, lessening the likelihood that
      a reasonable person would view the employee’s participation as biased.
  reasoning:
    read: The employee’s child now works for the corporation under audit, creating a covered relationship that raises an appearance
      question, but the audit is nearly finished and the employee’s unique knowledge makes reassignment costly and unnecessary.
    weighing: Applying §2635.502(d), the designee balances the appearance concern (C1) against the strong government interest
      in completing the audit efficiently (C2) and the difficulty of reassigning (C3). The child’s low‑level position (C4)
      further reduces the appearance risk. The regulation’s factors (nature of relationship, effect on financial interests,
      employee’s role, sensitivity, reassignment difficulty, possible adjustments) lead to a conclusion that the government
      interest outweighs the appearance concern.
    tradecraft: The designee should document the authorization in writing, citing the factors considered, and note that the
      employee may not later recuse on the same appearance basis. The decision should be recorded in the agency’s ethics case
      management system.
    uncertainty: Minimal; the primary uncertainty is whether external observers might later view the relationship as more
      significant, but the regulation permits the balancing judgment.
    handoff: The designee may decide alone, as the authority to balance the factors rests with the agency ethics official;
      no higher approval is required.
    tempting_wrong:
      option: O2
      pull: A strict avoidance of any appearance problem could lead to unnecessary recusal and delay the audit.
      why_wrong: Denial would ignore the strong government interest and the practical difficulty of reassigning the case,
        contrary to the balancing approach required by §2635.502(d).
    rejected:
      O1: Requesting more information is unnecessary because the relevant facts are already on record.
      O2: Denial would over‑prioritize appearance concerns despite the audit’s near‑completion and the employee’s unique expertise.
      O4: Deferring adds no value; the designee has sufficient information to make a balancing decision now.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the employee’s child held a senior decision‑making role that directly affected the audit outcome
      then: O2
      why: The appearance concern would become substantial enough to outweigh the government interest.
    - id: flip2
      if: the audit were not near completion and could be reassigned without significant delay
      then: O2
      why: The difficulty of reassignment factor would be removed, reducing the government interest in retaining the employee.
    would_not_change:
    - id: noflip1
      if: the child’s position remains entry‑level and unrelated to the audit’s substantive decisions
      why: The appearance concern stays minimal and does not alter the balance.
    watch_for:
    - id: watch1
      what: public or media scrutiny that later characterizes the child’s role as influential
      favors:
      - O2
      why: Increased perception of bias could pressure a reversal of the authorization.
  lesson: When a covered relationship exists but the employee’s unique expertise and the near‑completion of a matter make
    reassignment impractical, the agency designee may authorize participation if the government interest outweighs the appearance
    concern.
  limits: This reasoning applies only where the employee’s knowledge is essential, the audit is essentially finished, and
    the relative’s role is low‑level; it does not extend to situations with senior family involvement or where the matter
    is still early in its lifecycle.
