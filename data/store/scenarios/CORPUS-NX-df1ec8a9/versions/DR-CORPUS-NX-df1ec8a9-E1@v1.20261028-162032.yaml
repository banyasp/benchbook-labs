case:
  id: DR-CORPUS-NX-df1ec8a9-E1@v1
  title: Village Destruction and Displacement in Angola
  status: draft
  setting: Angola, during the long final assault against UNITA; Angolan armed forces.
  decider: The Angolan armed forces
  agent: The Angolan armed forces
  agent_role: decide
  situation: The Angolan armed forces were conducting a campaign against UNITA. The campaign’s military objective was to cut
    UNITA’s supply lines and prevent it from recruiting men or exploiting the population. Villages in the area were inhabited
    by peasant farmers, whose presence was central to the choice between leaving them in place and removing them. WFP estimated
    that three million Angolans needed aid, and MSF estimated that 600,000 faced an immediate risk of falling short.
  question: 'What should the Angolan armed forces do during the campaign against UNITA: destroy villages and displace their
    inhabitants, or preserve villages and leave their inhabitants in place?'
  options:
    O1:
      do: The Angolan armed forces destroy villages and displace their inhabitants.
      move: act
      irreversible: true
    O2:
      do: The Angolan armed forces preserve villages and leave their inhabitants in place.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Angolan armed forces were conducting a campaign against UNITA.
  - id: F2
    kind: situation
    status: confirmed
    fact: The campaign was described as the Angolan government’s long final assault against UNITA.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The stated military objective was to cut UNITA’s supply lines.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Preventing UNITA from recruiting men was a stated aim of the policy.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Preventing UNITA from exploiting the population was also a stated aim of the policy.
  - id: F6
    kind: situation
    status: confirmed
    fact: The villages at issue were inhabited by peasant farmers.
  - id: F7
    kind: intelligence
    status: assessed
    fact: WFP estimated that three million Angolans needed aid.
  - id: F8
    kind: intelligence
    status: assessed
    fact: MSF estimated that 600,000 Angolans faced an immediate risk of falling short of aid.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The stated military rationale for destroying villages and displacing inhabitants was to cut UNITA’s supply lines
      and prevent it from recruiting or exploiting the population.
  - id: C2
    facts:
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The affected villages were inhabited by peasant farmers, and razing villages and displacing residents exposed civilians
      to severe suffering and death.
  - id: C3
    facts:
    - F7
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The large number of people needing aid, including those at immediate risk of falling short, heightens the civilian
      cost of a policy that uprooted residents and left them without assistance.
  reasoning:
    read: This is a military campaign decision about whether to remove a civilian population to deny UNITA access to it. The
      trap is to treat the population only as a potential military resource and overlook that forced displacement itself exposed
      peasant farmers to grave harm.
    weighing: 'The stated rationale favors {O1}: cutting UNITA’s supply lines and preventing recruitment or exploitation.
      Against that rationale, village destruction and displacement exposed civilians to severe humanitarian harm amid acute
      need. The Angolan armed forces chose {O1} for its stated military purpose, but the available facts do not establish
      how effective the policy was or provide a legal analysis balancing that purpose against civilian harm.'
    tradecraft: At the decision point, record the military objective and the expected effect of each option, along with the
      civilian consequences and the basis for accepting them. Keep the decision confined to the village-destruction and displacement
      choice; do not treat the separate question of humanitarian access as its rationale.
    uncertainty: The stated objectives and grave humanitarian consequences are clear, but it is not established whether destroying
      villages was necessary or effective in achieving those objectives, or whether less harmful alternatives were available.
    handoff: The Angolan armed forces were the decision-maker, and no separate approval authority is identified. In practice,
      legal and civilian-protection review would be important before deciding whether the military rationale could justify
      the foreseeable harm; no such review is described.
    tempting_wrong:
      option: O2
      pull: Preserving villages avoids forcibly uprooting their inhabitants and responds to the stark account of civilian
        suffering.
      why_wrong: It does not, on the information given, answer the stated military concern that UNITA could use the population
        or its location to sustain its campaign.
    rejected:
      O2: The Angolan armed forces chose {O1} to cut UNITA’s supply lines and prevent recruitment or exploitation, despite
        the grave civilian costs.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that preserving villages would still cut UNITA’s supply lines and prevent recruitment or
        exploitation.
      then: O2
      why: If preserving villages achieved the stated military objective, the stated rationale for the severe civilian costs
        of destruction and displacement would fall away.
    - id: flip2
      if: The armed forces could not show that destroying villages and displacing residents materially advanced the stated
        military objectives.
      then: O2
      why: Without a demonstrated contribution to the mission, the military rationale would not support accepting the civilian
        harm described.
    would_not_change:
    - id: noflip1
      if: The estimates of widespread aid need remained unchanged while the military objectives and the options’ effects were
        still unknown.
      why: Those estimates intensify the humanitarian concern but, by themselves, do not establish which option would achieve
        the stated military objective.
    watch_for:
    - id: watch1
      what: Evidence about whether residents’ continued presence would actually enable UNITA to obtain supplies, recruit,
        or exploit the population.
      favors:
      - O1
      - O2
      why: That evidence bears directly on whether the stated military rationale supports displacement rather than preservation.
  lesson: A military objective can explain why a force chooses a course without establishing that the course is necessary
    or justified. When a decision directly exposes civilians to grave harm, assess the connection between the chosen action
    and the objective, and weigh that connection against the human consequences.
  limits: The available facts do not provide a legal standard, an assessment of the policy’s military effectiveness, or evidence
    about less harmful alternatives. This reasoning does not determine the separate question of humanitarian access.
