case:
  id: DR-CORPUS-NX-e4c7a7c8-E1@v1
  title: Assessing the Primary Supply Route
  status: draft
  setting: November–December 1968, CIA and MACV intelligence discussions concerning Laos, Cambodia, and South Vietnam
  decider: CIA analysts
  agent: CIA analysts
  agent_role: decide
  situation: CIA and MACV were evaluating which of two routes Hanoi was using to supply communist forces in South Vietnam.
    Each route was assessed as having enough capacity to support those forces on its own. The overland route was described
    as established, while the Sihanoukville connection depended on a Cambodian government that could deny or obstruct it.
    Available indicators included road and trail improvements, shipments toward the tri-border area, reports of logistics
    activity and personnel movement, and estimates of traffic in Laos. Some of the evidence was indirect, and the competing
    assessments did not resolve the route’s relative importance.
  question: What should the CIA analysts do in deciding which route Hanoi was actually using as its basic supply channel?
  options:
    O1:
      do: The CIA analysts should favor the overland trail as Hanoi’s basic channel for arms and ammunition to communist forces.
      move: act
      irreversible: false
    O2:
      do: The CIA analysts should disfavor the overland trail as the basic channel and favor the Sihanoukville connection.
      move: act
      irreversible: false
    O3:
      do: The CIA analysts should defer the route judgment and request further analytic review of the competing assessments.
      move: ask
      irreversible: false
      to: CIA analysts
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: Either the overland trail system or the Sihanoukville connection was assessed as having enough capacity on its own
      to support Hanoi’s forces in southern South Vietnam.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The overland trail was regarded as established, while the Sihanoukville connection was outside Hanoi’s control and
      could be denied or obstructed by the Cambodian government.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Indicators considered in the route analysis included efforts to improve roads and trails and shipments south to
      the tri-border area.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The route analysis also considered reports of logistics activity along the trails and personnel movements on them.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Some of the CIA’s supporting evidence was indirect, and some relied on an unproven assumption.
  - id: F6
    kind: intelligence
    status: assessed
    fact: MACV reported an average of 8 tons per day moving south from BA 610 toward the Cambodian border and judged the shipments
      primarily destined for enemy forces in southern I CTZ and local support forces.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Traffic below BA 610 in Laos was described as meager and unchanged from the flow recorded since December 1967.
  - id: F8
    kind: intelligence
    status: assessed
    fact: CIA leadership considered the available tonnage estimate the best that could be established from the available materials,
      which were characterized as inferior.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: CIA analysts regarded the overland trail as established, whereas Hanoi did not control the Sihanoukville connection
      and Cambodia could deny or obstruct it. They reasoned that Hanoi would not depend heavily on that less reliable route
      instead of the proven trail.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: CIA analysts treated the combined indicators—trail improvements, shipments toward the tri-border area, logistics
      activity, and personnel movements—as sufficient to support their judgment that the overland route was the basic channel.
  - id: C3
    facts:
    - F1
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: Because either route could independently support the forces, capacity alone did not establish which route Hanoi actually
      used; the analysts needed to judge relative use from other evidence.
  - id: C4
    facts:
    - F5
    - F8
    equity: analytic_integrity
    favors:
    - O3
    - O1
    weight: weak
    why: Some support was indirect and relied on an unproven assumption, and the available materials were considered inferior.
      At the same time, CIA leadership regarded the tonnage estimate as the best that could be established from those materials,
      supporting a qualified judgment rather than treating better evidence as available.
  reasoning:
    read: 'This was a judgment about actual use, not a comparison of each route’s capacity: either route could support the
      forces. The trap was treating capacity as proof of use, or treating the uncertain indicators as conclusive. CIA analysts
      instead favored the established route over a connection Hanoi did not control and Cambodia could obstruct.'
    weighing: The reliability difference and the combined indicators favored {O1}; the indirect evidence and the competing
      MACV assessment limited confidence. CIA leadership considered the available estimate the best that could be established,
      but the discussions ended in a stalemate with little movement on fundamental analytic issues. The balance therefore
      supports {O1} as CIA’s judgment, not as a settled or uncontested finding.
    tradecraft: Separate the observed indicators from the inference about which route was basic, record the limits of indirect
      evidence and any unproven assumptions, and preserve the competing assessment rather than presenting the judgment as
      certainty.
    uncertainty: Some evidence was indirect, some relied on an unproven assumption, and the available materials were considered
      inferior. The route discussions did not resolve the fundamental disagreement, so the relative importance of the routes
      remained uncertain.
    handoff: CIA analysts should make and document their own assessment while retaining MACV’s contrary view in the analytic
      record, since the route discussions did not resolve the fundamental disagreement.
    tempting_wrong:
      option: O3
      pull: Deferring may seem prudent because some evidence was indirect and CIA and MACV did not reach agreement.
      why_wrong: CIA’s stated judgment was that the combined indicators supported the overland route as the basic channel,
        and leadership considered the available estimate the best that could be established from the materials at hand.
    rejected:
      O2: CIA analysts did not favor the Sihanoukville connection because they judged that Hanoi would not depend heavily
        on a route it did not control and Cambodia could deny or obstruct.
      O3: CIA leadership accepted the best estimate that could be established from the available materials, despite their
        limitations, rather than deferring the route judgment.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the Sihanoukville connection was under Hanoi’s control and not vulnerable to
        Cambodian denial or obstruction.
      then: O2
      why: That would remove the main reliability distinction CIA analysts used to favor the established overland route.
    - id: flip2
      if: More reliable evidence established that Sihanoukville, rather than the overland trail, was Hanoi’s basic channel.
      then: O2
      why: The decision concerns actual relative use, so reliable evidence directly resolving that question would outweigh
        the route-reliability inference.
    would_not_change:
    - id: noflip1
      if: Both routes continued to be assessed as having enough capacity to support the forces.
      why: Capacity on its own does not establish which route Hanoi actually used as its basic channel.
    watch_for:
    - id: watch1
      what: Whether the relative reliability of the routes or the evidence indicating actual route use materially changes.
      favors:
      - O2
      - O1
      why: A change in route vulnerability or stronger evidence about actual use could alter the balance between the competing
        assessments.
  lesson: When competing channels each have sufficient capacity, capacity is not a substitute for evidence about actual use.
    A decision-maker may favor the more established and less vulnerable channel on the available indicators, but should preserve
    material uncertainty and contrary assessments.
  limits: This reasoning applies to the route judgment described here, not to later collection or transport developments.
    It does not establish that the overland route was conclusively dominant; the discussions ended in continuing disagreement
    amid imperfect evidence.
