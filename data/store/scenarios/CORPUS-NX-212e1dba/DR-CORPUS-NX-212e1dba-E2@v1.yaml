case:
  id: DR-CORPUS-NX-212e1dba-E2@v1
  title: Choosing a Warning Channel
  status: draft
  setting: In the division's zone during an upcoming operation; aboard an attack helicopter, time unspecified.
  decider: The pilot
  agent: The pilot
  agent_role: decide
  situation: The aircrew has identified an enemy mechanized column in the division's zone. The pilot assesses that the column
    poses a serious threat to the upcoming operation. The standard reporting route is through the direct air support center
    (DASC), but weather has disrupted communications with it. The pilot expects that report may take nearly half an hour to
    reach the field and could take longer to reach frontline units; he also considers that recipients might doubt the unusual
    report. The pilot has no call signs or frequencies for local ground units, but a nearby friendly ground unit has been
    identified. He is deciding how to get the warning to ground forces.
  question: What should the pilot do about warning the ground force of the enemy column?
  options:
    O1:
      do: The pilot reports the sighting to ground forces.
      move: act
      irreversible: false
    O2:
      do: The pilot reports the sighting to the DASC.
      move: act
      irreversible: false
    O3:
      do: The pilot reports the sighting to both channels.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The aircrew identified an enemy mechanized column in the division's zone.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The pilot assessed that the unexpected enemy force posed a serious threat to the upcoming operation.
  - id: F3
    kind: situation
    status: confirmed
    fact: The standard reporting route for the sighting was through the DASC.
  - id: F4
    kind: capability
    status: confirmed
    fact: Weather had disrupted communications with the DASC throughout the day, and the aircrew had been unable to establish
      a clear connection.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The pilot estimated that reaching the field could take nearly half an hour and that relaying the information onward
      could add delay.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The pilot considered that frontline units might not believe an unlikely report passed through the DASC.
  - id: F7
    kind: capability
    status: confirmed
    fact: The pilot had no call signs or frequencies for local ground units.
  - id: F8
    kind: situation
    status: confirmed
    fact: A nearby friendly ground unit had been identified.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    - O2
    - O3
    weight: strong
    why: The unexpected enemy force poses a serious threat to the upcoming operation, so the ground force needs the warning.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Although DASC is the standard route, weather has disrupted communications; the pilot expects reaching the field to
      take nearly half an hour, with additional delay before frontline units are warned.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The pilot also worries that frontline units may doubt an unusual report relayed through DASC, which could reduce
      the warning's effectiveness.
  - id: C4
    facts:
    - F7
    - F8
    equity: tempo
    favors:
    - O1
    weight: weak
    why: The pilot lacks local unit call signs or frequencies, but a nearby friendly ground unit has been identified as a
      possible direct recipient.
  reasoning:
    read: The pilot sees an urgent threat to the upcoming operation and judges that the usual DASC route may not deliver a
      useful warning in time. The trap is treating the standard route as adequate despite disrupted communications and the
      risk of delay or disbelief.
    weighing: The serious threat makes timely warning important {C1}. DASC is the normal route, but weather, expected relay
      delays, and concern that the report might be doubted weigh in favor of warning ground forces directly {C2} {C3}. The
      lack of local contact information is an obstacle, while the identified nearby friendly unit offers a possible recipient
      {C4}. The balance depends on the urgency of the threat and the pilot's assessment that the standard route is too slow
      or uncertain.
    tradecraft: Give the identified friendly ground unit a prompt, clear warning, distinguishing what the aircrew observed
      from the pilot's assessment. Record what was communicated and, when practicable, ensure the appropriate standard reporting
      channel is also informed.
    uncertainty: The pilot's estimates of the delay and the likelihood that the report would be doubted are assessments, not
      certainties. The source does not establish whether direct communication with the nearby unit was ultimately completed.
    handoff: The pilot makes the immediate channel decision; the source gives no indication that consultation with a higher
      authority is needed before warning the ground force. Follow-up through the established reporting structure can support
      accountability without making that route a prerequisite for the urgent warning.
    tempting_wrong:
      option: O2
      pull: DASC is the standard reporting route.
      why_wrong: The pilot judges that weather-disrupted communications and onward relay could make the warning too late,
        and that frontline units might doubt it.
    rejected:
      O2: The pilot rejects relying on DASC because the disrupted connection and expected onward delay could prevent a timely,
        effective warning.
      O3: The pilot's stated judgment is to bypass normal channels and warn the ground directly, rather than make a DASC report
        part of the chosen course.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: DASC communications were reliable and the warning could reach frontline units without the delay or credibility concern
        the pilot anticipates
      then: O2
      why: The source's reasons for bypassing the standard route would be substantially reduced.
    - id: flip2
      if: The nearby friendly ground unit could not be reached, while DASC remained the available reporting route
      then: O2
      why: The direct-warning option would no longer provide a feasible recipient, leaving the standard channel as the available
        route.
    would_not_change:
    - id: noflip1
      if: The report remained unusual, but DASC communications were still disrupted and the anticipated relay delay remained
      why: The concern about possible disbelief is only one part of the pilot's reasoning; the urgency and expected delay
        would still support direct warning.
    watch_for:
    - id: watch1
      what: Whether the identified friendly ground unit can receive the warning promptly
      favors:
      - O1
      - O2
      why: Successful direct receipt supports O1; inability to reach that unit makes the standard reporting route more important.
  lesson: When a serious operational threat requires prompt warning, a standard reporting route should not be treated as sufficient
    if disrupted communications and onward relay are likely to cause consequential delay. Use a viable direct recipient when
    the source's assessment supports it, while preserving accurate reporting through established channels when practicable.
  limits: This reasoning concerns the choice and urgency of a reporting channel, not aircraft movement or tactical engagement.
    It depends on the pilot's stated assessment of urgency, communications disruption, and the possibility of reaching a friendly
    ground unit.
