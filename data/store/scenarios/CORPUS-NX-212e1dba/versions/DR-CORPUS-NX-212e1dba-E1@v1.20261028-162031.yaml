case:
  id: DR-CORPUS-NX-212e1dba-E1@v1
  title: Control and Flexibility in Execution
  status: draft
  setting: A division command post in a tent during Operation VERBAL IMAGE; the time is unspecified.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: The division had revised an existing branch plan after an unexpected change. Earlier planning had built shared
    situational awareness among the Commander, staff, and subordinate commanders. The Commander's intent and end state remained
    applicable, while many independent elements still had to pursue the same aim. Subordinate formations were already beginning
    to act, and the Commander expected a period of considerable disorder. Coordination needs extended across higher, subordinate,
    and lateral relationships. The Commander must decide how much control to retain over execution.
  question: What should the Commander do about the level of central control over subordinate execution while keeping the force
    oriented toward a common aim?
  options:
    O1:
      do: The Commander centralizes execution, maintains the common direction, and coordinates subordinate actions.
      move: act
      irreversible: false
    O2:
      do: The Commander decentralizes execution, maintains the common direction, and coordinates essential matters.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The division revised an existing branch plan to address an unexpected situation.
  - id: F2
    kind: situation
    status: confirmed
    fact: The planning process had produced improved situational awareness shared by the Commander, staff, and subordinate
      commanders.
  - id: F3
    kind: situation
    status: assessed
    fact: The Commander's intent and end state did not need to change.
  - id: F4
    kind: situation
    status: assessed
    fact: The division contained many independent parts that needed to work toward the same goal.
  - id: F5
    kind: situation
    status: confirmed
    fact: Battalions and regiments were already beginning to act toward the needed tasks.
  - id: F6
    kind: situation
    status: assessed
    fact: The Commander expected considerable disorder for at least the next few days, and possibly longer.
  - id: F7
    kind: situation
    status: assessed
    fact: Coordination was needed across higher, subordinate, and lateral relationships.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Commander solicited staff estimates, opinions, questions, and recommendations before announcing a position.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: tempo
    favors:
    - O2
    weight: strong
    why: With subordinate formations already acting and considerable disorder expected, trying to control every moving part
      would risk slowing execution. The Commander instead favored keeping the effort moving in a common direction.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The intent and end state remained applicable, providing a stable common aim for the division's many independent elements.
      That supported giving subordinates room to act while maintaining overall direction.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Coordination was needed across command relationships, but the Commander distinguished essential coordination from
      attempts to coordinate everything. The chosen balance was to coordinate what was necessary and leave the rest flexible.
  - id: C4
    facts:
    - F2
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Staff participation had helped build shared situational awareness. That common understanding supported flexible execution
      without requiring the Commander to direct every subordinate action.
  reasoning:
    read: The division had adapted its plan while retaining an applicable intent and end state. The trap is to treat expected
      disorder as a reason to control every action; the Commander judged that such control was neither feasible nor needed
      if the force remained oriented toward the same aim.
    weighing: 'The Commander valued tempo and recognized that battalions and regiments were already acting. Shared awareness
      and a stable end state made subordinate flexibility workable, while coordination across command relationships still
      mattered. The balance therefore favored {O2}: preserve central direction, coordinate what absolutely needs coordination,
      and allow execution to remain flexible.'
    tradecraft: State the common aim and the boundary between essential coordination and matters left to subordinate judgment.
      Monitor whether the force remains oriented toward that aim, and record the decision and its rationale so the intended
      balance is clear.
    uncertainty: The Commander expected disorder for days or longer, and the source gives no precise threshold for when that
      disorder would require tighter control. The balance depends on whether subordinate action continues to serve the common
      aim.
    handoff: The Commander should use staff estimates and recommendations, as in the planning discussion, and involve subordinate
      and other relevant command relationships in essential coordination. The Commander retains the decision while relying
      on shared understanding to support execution.
    tempting_wrong:
      option: O1
      pull: Central control can appear to be the safest response when many independent elements and coordination relationships
        are involved.
      why_wrong: The Commander expected chaos and concluded that controlling every moving part was not feasible; excessive
        control risked constraining the flexibility needed to keep the effort moving.
    rejected:
      O1: The Commander did not choose centralized execution because the force needed direction and essential coordination,
        not control of every subordinate action.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Subordinate actions cease to serve the common aim, or essential coordination can no longer be achieved while leaving
        execution flexible.
      then: O1
      why: A loss of coherence would undermine the basis for decentralized execution and could make tighter central control
        necessary to restore common direction.
    would_not_change:
    - id: noflip1
      if: The Commander expects considerable disorder to continue for days or longer while the formations remain oriented
        toward the common aim.
      why: Disorder alone did not persuade the Commander to control every moving part; the stated approach was to keep the
        effort pointed in the same general direction and let it proceed.
    watch_for:
    - id: watch1
      what: Whether subordinate action continues to flow in the same general direction and essential coordination remains
        effective.
      favors:
      - O1
      why: Evidence that the common direction or necessary coordination is breaking down would support reconsidering the level
        of central control.
  lesson: A stable intent and shared understanding can allow a commander to decentralize execution without surrendering common
    direction. Coordinate what is essential, but do not mistake disorder for a need to control every action.
  limits: This reasoning depends on an applicable common aim, sufficient shared understanding, and subordinate actions that
    remain aligned with that aim. It does not establish that decentralized execution is appropriate when those conditions
    fail or when a binding authority requires tighter control.
