case:
  id: DR-CORPUS-NX-0e1f37f7-E1@v1
  title: Navy Hebern Procurement Decision
  status: draft
  setting: Washington, early October, Navy OP-20-G
  decider: The acting chief of OP-20-G
  agent: The acting chief of OP-20-G
  agent_role: decide
  situation: The Navy’s OP-20-G was considering cipher machines for its communication security needs. Navy cryptographers
    had relied on Hebern machines for several years but had doubts about their integrity. They had balked at a contract to
    procure more machines. The machine then being offered by Hebern was regarded as unsatisfactory, while OP-20-G had development
    money but no identified investment direction. The acting chief faced the choice of proceeding with the Hebern procurement
    or pursuing alternatives.
  question: What should the acting chief of OP-20-G do about the proposed procurement of Hebern machines?
  options:
    O1:
      do: The acting chief of OP-20-G continues procurement of Hebern machines for Navy communications.
      move: act
      irreversible: true
    O2:
      do: The acting chief of OP-20-G discontinues procurement of Hebern machines and pursues alternatives.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Navy cryptographers had relied on Hebern machines for several years to meet communication security needs.
  - id: F2
    kind: situation
    status: assessed
    fact: By the mid-1930s, Navy cryptographers had begun to doubt the integrity of the Hebern machines.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Navy was considering a contract to procure more Hebern machines.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Navy had balked at the contract to procure more Hebern machines.
  - id: F5
    kind: authority
    status: confirmed
    fact: A Navy lieutenant was acting chief of OP-20-G.
  - id: F6
    kind: situation
    status: confirmed
    fact: The acting chief and his colleagues had begun looking for a more secure alternative.
  - id: F7
    kind: capability
    status: assessed
    fact: The Hebern machine being offered to the Navy had been unsatisfactory.
  - id: F8
    kind: capability
    status: assessed
    fact: The Navy had development money but no identified ideas in which to invest it.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: Doubts about the integrity of the machines undermine the basis for trusting them with Navy communications, and the
      Navy had already balked at buying more.
  - id: C2
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The machine then being offered was regarded as unsatisfactory, giving the Navy a reason not to proceed with that
      proposed procurement.
  - id: C3
    facts:
    - F6
    - F8
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: The Navy had begun seeking a more secure alternative and had development funds without an identified investment direction,
      making further inquiry a plausible use of those resources.
  - id: C4
    facts:
    - F1
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Navy had relied on Hebern machines for several years, but that history does not resolve the later doubts about
      their integrity.
  reasoning:
    read: 'The issue is not simply whether the Navy should preserve a familiar procurement: its cryptographers had doubts
      about the machines'' integrity, had balked at buying more, and regarded the current Hebern offering as unsatisfactory.
      The trap in continuing is treating past reliance as assurance of present trustworthiness.'
    weighing: The stated doubts, the Navy's reluctance to contract, and the assessment that the offered machine was unsatisfactory
      favor looking elsewhere. The availability of development money and the search for something more secure made that course
      practicable, though no specific alternatives were compared. The balance would depend on whether the concerns about Hebern
      were credibly resolved and whether a more secure alternative could be pursued.
    tradecraft: Keep the procurement decision tied to the security concern and the assessment of the offered machine; do not
      treat prior use alone as evidence that the machines are trustworthy. Before sharing a possible Army alternative, obtain
      the senior-leadership permission that is required.
    uncertainty: The Navy's doubts and its assessment of the offered machine are recorded, but the evidence underlying those
      assessments is not specified, and no tested alternative is identified.
    handoff: The acting chief should involve senior leadership before sharing a possible Army alternative, since permission
      to share it had not yet been obtained. The procurement decision remains with the acting chief of OP-20-G.
    tempting_wrong:
      option: O1
      pull: The Navy had relied on Hebern machines for several years.
      why_wrong: Past reliance does not answer the Navy's later doubts about integrity or the assessment that the machine
        being offered was unsatisfactory.
    rejected:
      O1: The Navy did not continue the proposed procurement because its cryptographers doubted the machines' integrity and
        regarded the offered machine as unsatisfactory.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible assessment established that the integrity concerns had been resolved and that the offered Hebern machine
        was satisfactory.
      then: O1
      why: That would remove the central stated reasons for rejecting the proposed procurement and could make continuation
        reasonable.
    would_not_change:
    - id: noflip1
      if: The Navy's history of relying on Hebern machines remained the only argument for continuing, without new evidence
        addressing the integrity concerns.
      why: Past use alone would not answer the doubts that led the Navy to balk at the contract.
    watch_for:
    - id: watch1
      what: Whether senior leadership permits discussion of the Army's possible alternative and whether that alternative is
        considered more secure.
      favors:
      - O2
      why: Permission was needed before sharing a possible alternative, and the Navy was looking for something more secure.
  lesson: When an organization doubts the integrity of a system used for essential communications, prior reliance is not a
    sufficient reason to buy more. Assess the current offering against the stated trust concern and pursue alternatives when
    the offering is regarded as unsatisfactory.
  limits: This reasoning concerns a procurement decision where doubts about integrity and an unsatisfactory offer were recorded.
    It does not establish that every concern was technically verified, that a particular alternative was superior, or what
    decision would be appropriate if those assessments changed.
