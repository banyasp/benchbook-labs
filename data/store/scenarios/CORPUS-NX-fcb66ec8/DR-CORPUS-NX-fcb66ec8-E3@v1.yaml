        O1: 14
        O3: 16
      real_option: O2
      real_to_mean_other_length: 1.2
      real_is_longest: true
      moves:
        O2: act
        O1: ask
        O3: act
      real_move: act
      irreversible_flags:
        O2: true
        O1: false
        O3: true
    equities: pilot2
