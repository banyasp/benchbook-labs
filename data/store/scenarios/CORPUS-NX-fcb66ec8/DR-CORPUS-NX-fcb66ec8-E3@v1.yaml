case:
  id: DR-CORPUS-NX-fcb66ec8-E3@v1
  title: Restricting Publication While Preserving Need-to-Know Reporting
  status: draft
  setting: Cuba and Washington, October 9; the federal executive branch
  decider: The President
  agent: The President
  agent_role: decide
  situation: Sensitive intelligence concerned weapons that might be offensive in Cuba. Further information about a suspected
    missile installation was pending. The President faced a decision about restricting publication to designated recipients
    while preserving reporting to officials with a genuine need to know. The intelligence community had no plan ready to meet
    reporting requirements under such restrictions.
  question: What should the President do about publication and reporting of sensitive intelligence concerning offensive weapons?
  options:
    O1:
      do: The President should ask intelligence officials for additional information before setting limits on publication.
      move: ask
      irreversible: false
      to: intelligence officials
    O2:
      do: The President should limit publication of offensive-weapons reports and report them to officials with a need to
        know.
      move: act
      irreversible: true
    O3:
      do: The President should publish all offensive-weapons reports broadly to officials across government without limiting
        recipient categories.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Reports concerned weapons that might be offensive.
  - id: F2
    kind: situation
    status: confirmed
    fact: Further information concerning a suspected missile installation in Cuba was pending.
  - id: F3
    kind: authority
    status: confirmed
    fact: On October 9, the President reiterated instructions restricting publication of information on offensive weapons.
  - id: F4
    kind: authority
    status: confirmed
    fact: The President directed the tightest possible control over information relating to offensive weapons.
  - id: F5
    kind: authority
    status: confirmed
    fact: The President wanted relevant information properly reported to officials with a real need to know.
  - id: F6
    kind: capability
    status: confirmed
    fact: The intelligence community had no plan ready to meet reporting requirements under restricted publication.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The President instructed that publication of information on offensive weapons be tightly controlled; the assessment
      endorses that restriction as wise, necessary, and essential to the national interest.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The restriction was not meant to prevent relevant information from reaching officials with a genuine need to know.
      Limiting publication while preserving that reporting serves the directive's purpose.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The intelligence community lacked a ready plan for reporting under restricted publication, and important information
      consequently failed to reach some government elements and senior officials. This makes implementation planning essential,
      but does not establish that broad publication is preferable.
  reasoning:
    read: This is a decision about controlling publication while still getting vital information to authorized officials—not
      a choice between control and informing the government. The trap is to treat a restriction on publication as a reason
      to suppress or lose need-to-know reporting.
    weighing: The assessment treats tight publication controls as necessary to the national interest, while also warning that
      misinterpreting the directive endangered the flow of needed information. The reporting failure arose in a context with
      no plan ready for restricted reporting; it supports advance planning and faithful need-to-know reporting, not broad
      circulation. The balance depends on maintaining the restriction without allowing it to obstruct reporting to officials
      who need the information.
    tradecraft: Limit publication to designated recipients, preserve reporting to officials with a genuine need to know, and
      establish the reporting arrangements in advance. Check that vital information reaches the relevant officials rather
      than assuming that a publication restriction handles that responsibility.
    uncertainty: 'Further information about the suspected installation was pending, and the passage does not specify the designated
      recipient categories. It does establish the governing distinction: publication was restricted, but relevant information
      was still to be reported to officials with a real need to know.'
    handoff: The President should make the publication decision and ensure the intelligence community is prepared to meet
      reporting requirements under the restriction. That is necessary because the community had no ready plan and information
      failed to reach some government elements and senior officials.
    tempting_wrong:
      option: O3
      pull: Broad circulation might seem like the safest way to prevent important information from being missed by government
        officials.
      why_wrong: The assessment endorses tight control over publication; it identifies the failure as misinterpretation and
        lack of reporting readiness, not as a need to circulate sensitive reports broadly.
    rejected:
      O1: 'Seeking more information before setting limits was not the endorsed course: the assessment judged the restriction
        necessary while further information was pending, and identified the need for a reporting plan rather than a reason
        to defer the limits.'
      O3: Broad publication conflicts with the endorsed tight control; the need to inform officials was to be met through
        reporting to those with a genuine need to know.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The President could not ensure that vital information would reach officials with a genuine need to know under the
        proposed restriction.
      then: O1
      why: The assessment warns that restrictions without adequate reporting arrangements can keep significant information
        from government officials; obtaining more information before setting limits could be warranted until that problem
        is addressed.
    would_not_change:
    - id: noflip1
      if: Further information about the suspected missile installation remained pending.
      why: That was the context in which the President imposed publication limits; pending information alone does not displace
        the endorsed need for control.
    - id: noflip2
      if: The intelligence community still had no reporting plan ready.
      why: The identified remedy is advance planning for reporting under restrictions, not abandoning the publication controls
        the assessment judged necessary.
    watch_for:
    - id: watch1
      what: Signs that vital information is failing to reach government elements or senior officials who need it.
      favors:
      - O1
      why: Such failures indicate that restricted-publication reporting arrangements need attention before the decision can
        be carried out reliably.
  lesson: Restrict publication of sensitive information when the national interest requires it, but do not let publication
    controls become a barrier to reporting to officials with a genuine need to know. Plan for that reporting before an emergency
    makes the gap consequential.
  limits: This reasoning addresses sensitive intelligence publication and internal need-to-know reporting in the described
    national-security setting. It does not establish that every sensitive report should be restricted, or specify recipient
    categories beyond the genuine-need-to-know principle.
  library:
    domain: intel-oversight
    family: CORPUS-NX-fcb66ec8
    source: https://www.cia.gov/resources/csi/static/6c12256edc44dcbf7d3f019ce08cdbf6/Part-III-The-Aftermath-Documents-108-112.pdf
    episode_focus: The decision point is whether to circulate sensitive reports broadly or restrict publication to designated
      recipients while preserving reporting to officials with a need to know. The passage identifies the pending-information
      context and the President’s instruction to maintain tight control; exclude collection activity and technical handling
      of intelligence.
    cues:
