    episode_focus: The report assesses that Soviet conciliation is temporary and expedient, not abandonment of long-range
      objectives, and supports that judgment with international and domestic considerations. Keep the scenario focused on
      the analytic choice between interpretations; exclude descriptions of the methods the report attributes to Soviet actors.
    cues:
      option_words:
        O2: 20
        O1: 20
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
