case:
  id: DR-CORPUS-NX-1b96d465-E1@v1
  title: Coverage Decision at Metropolia
  status: draft
  setting: Metropolia, about a week before an international conference; CIA Headquarters.
  decider: CIA Headquarters
  agent: CIA Headquarters
  agent_role: decide
  situation: The leaders of the Movement are due to attend an international conference in Metropolia, the capital of Lowland.
    The source has been selected to attend with the Movement's leader and then accompany that leader on a European tour lasting
    about two weeks. The source will not be able to report again until after the tour. CIA Headquarters had previously declined
    immediate coverage in Metropolia, citing the availability of other assets in Lowland. Headquarters must now decide whether
    to approve immediate coverage through this source.
  question: What should CIA Headquarters do about immediate coverage in Metropolia during the conference?
  options:
    O1:
      do: CIA Headquarters rejects immediate coverage in Metropolia through the source during the conference.
      move: act
      irreversible: false
    O2:
      do: CIA Headquarters approves immediate coverage in Metropolia through the source during the conference.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The leaders of the Movement were summoned to an international conference in Metropolia, the capital of Lowland.
  - id: F2
    kind: situation
    status: confirmed
    fact: The source informed the case officer that the source had been chosen to attend the conference with the Movement's
      leader.
  - id: F3
    kind: situation
    status: confirmed
    fact: After the conference, the source was to accompany the leader on a European tour lasting about two weeks before being
      able to report again.
  - id: F4
    kind: situation
    status: confirmed
    fact: The case officer asked CIA Headquarters whether it wanted immediate coverage in Metropolia while the source was
      there.
  - id: F5
    kind: situation
    status: confirmed
    fact: CIA Headquarters initially declined, citing the availability of plenty of assets in Lowland.
  - id: F6
    kind: capability
    status: assessed
    fact: CIA Headquarters regarded the source as one of its best penetrations of the Movement.
  - id: F7
    kind: intelligence
    status: assessed
    fact: CIA Headquarters regarded the source as one of the few, if not the only, source likely to be thoroughly objective
      about the views of the Movement's international leader.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Headquarters initially judged that the other assets available in Lowland made immediate coverage through this source
      unnecessary.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Headquarters regarded the source as one of its best penetrations of the Movement, making this source's coverage especially
      valuable.
  - id: C3
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The source was one of the few, possibly the only one, Headquarters considered likely to be thoroughly objective about
      the international leader's views.
  reasoning:
    read: The decision is whether to use an unusually valuable and potentially objective source for conference coverage, not
      simply whether Lowland has other assets. The trap is treating the general availability of assets as proof that they
      can provide the same value.
    weighing: The availability of other assets initially supported declining the request {C1}. Headquarters reversed that
      view because this source was among its best penetrations and unusually likely to be objective about the international
      leader's views {C2} {C3}. Those source-specific advantages outweighed the general availability of other assets, supporting
      approval.
    tradecraft: 'Record the approval and its rationale at the decision level: the source''s exceptional penetration and the
      value of an objective account. Do not infer or add collection methods not present in the decision record.'
    uncertainty: The stated reasons do not describe the capabilities of the other assets or establish how much additional
      information this source would provide. The basis for the reversal is limited to Headquarters' assessment of the source's
      value and objectivity.
    handoff: Headquarters is the decision-maker in this scenario. No additional approval authority or referral is identified.
    tempting_wrong:
      option: O1
      pull: Headquarters had already declined, reasoning that Lowland had plenty of assets.
      why_wrong: That general consideration did not account for Headquarters' later assessment that this source was an exceptional
        penetration and might be uniquely objective.
    rejected:
      O1: Headquarters did not retain its initial rejection after recognizing this source's exceptional penetration and potential
        objectivity.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Headquarters no longer assessed this source as an unusually valuable penetration or as especially likely to provide
        an objective account.
      then: O1
      why: Without the source-specific advantages that prompted the reversal, the stated reason that other assets were available
        could again support declining coverage.
    would_not_change:
    - id: noflip1
      if: Other assets remained available, while Headquarters continued to regard this source as one of its best penetrations
        and unusually likely to be objective.
      why: The mere availability of other assets did not prevent Headquarters from reversing its initial decision once it
        considered this source's distinctive value.
    watch_for:
    - id: watch1
      what: Whether the other assets could provide coverage with comparable access and objectivity.
      favors:
      - O1
      why: Evidence that other assets could provide the same distinctive value would weaken the stated reason for preferring
        this source.
  lesson: Do not equate the availability of other assets with their ability to provide equivalent value. When a decision turns
    on a source's exceptional access and expected objectivity, weigh those specific qualities against the general alternatives.
  limits: This reasoning applies to the stated choice about immediate conference coverage and Headquarters' assessment of
    this source. It does not establish the comparative capabilities of other assets or supply authority, safeguards, or collection
    procedures not stated here.
  library:
    domain: natsec-other
    family: CORPUS-NX-1b96d465
    source: https://www.cia.gov/resources/csi/static/b586cbe3c1c5861243c14a20975ff75e/Catch-As-Catch-Can.pdf
    episode_focus: The decision point is Headquarters’ reversal from declining the request to seeking coverage through a particularly
      valuable and potentially objective source. Include the yes-or-no tasking decision and its stated reasons; exclude the
      case officer’s subsequent methods of contact and reporting.
    cues:
      option_words:
        O1: 13
        O2: 13
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: CIA Headquarters changed its mind because the source was one of its best penetrations of the Movement and one of the
  few, if not the only, likely to be thoroughly objective about the international leader's views.
