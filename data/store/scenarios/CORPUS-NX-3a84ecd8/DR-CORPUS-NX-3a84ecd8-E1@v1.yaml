case:
  id: DR-CORPUS-NX-3a84ecd8-E1@v1
  title: PIR Responsibility and Prioritization
  status: draft
  setting: Desert, during an operation planning cycle, Third Infantry Division.
  decider: The G-2 of the Third Infantry Division
  agent: The G-2 of the Third Infantry Division
  agent_role: decide
  situation: The G-2 is reviewing intelligence requirements after an opposing force bypassed the unit’s defensive position.
    Of 13 priority intelligence requirements, only two had been refined during the prior four days. Priority intelligence
    requirements are part of the commander’s critical information requirements and are intended to inform operational decisions.
    The collection manager has been the only person charged with updating the requirements. The G-2 must decide how responsibility
    for review and the number of requirements should be handled.
  question: What should the G-2 do about responsibility for PIR review and the number of requirements?
  options:
    O1:
      do: The G-2 assigns PIR review to the collection manager and retains all 13 requirements.
      move: act
      irreversible: false
    O2:
      do: The G-2 shares PIR review across staff and narrows the list to decision-linked requirements.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The opposing force bypassed the unit’s defensive position.
  - id: F2
    kind: situation
    status: confirmed
    fact: The unit had 13 priority intelligence requirements, and the collection manager had refined only two during the preceding
      four days.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Priority intelligence requirements are a key element of the commander’s critical information requirements and inform
      decisions for an operation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: When priority intelligence requirements fail to inform planning and execution, the timeliness and quality of decision
      making suffer.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Priority intelligence requirements should be linked to the commander’s decision points.
  - id: F6
    kind: situation
    status: assessed
    fact: All staff sections should contribute to and understand the significance of priority intelligence requirements.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Priority intelligence requirements should be updated as the operational environment changes.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Priority intelligence requirements should be limited to those that affect the commander’s decision points.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: tempo
    favors:
    - O2
    weight: strong
    why: PIRs are meant to inform operational decisions; when they do not answer the commander’s decision needs, decision-making
      timeliness and quality suffer. Linking them to decision points helps make the information useful when needed.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: 'PIRs are a whole-of-staff requirement: staff sections should contribute to them and understand their significance,
      rather than leaving responsibility solely with the collection manager.'
  - id: C3
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The operational environment changes, so PIRs need continuing review and refinement. The limited refinement of the
      13 requirements illustrates the risk of treating them as static.
  - id: C4
    facts:
    - F3
    - F5
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The source recommends keeping only PIRs that affect commander decision points. A shorter, decision-linked list is
      more likely to provide decision-quality information than retaining requirements without that connection.
  reasoning:
    read: The issue is not simply that only two of 13 PIRs were refined; it is that review was left to one person and the
      list may not be focused on decisions the commander must make. The trap is treating a large inventory of requirements,
      or refinement by the collection manager alone, as a substitute for staff-wide, decision-linked review.
    weighing: 'The source’s reasons point to {O2}: PIRs should support commander decision points, be updated as the operational
      environment changes, and receive contributions from the whole staff. Those considerations outweigh retaining all 13
      under a single reviewer because unfocused or stale PIRs can undermine timely, quality decisions. The balance depends
      on keeping the requirements tied to actual commander decisions, not merely reducing the count for its own sake.'
    tradecraft: Use staff working groups to review and refine the PIRs, involve the commander in discussions about key decisions,
      and narrow the list to requirements that affect those decision points. Keep the review ongoing as the situation changes.
      Recording the decision linkage and the rationale for retaining or removing requirements would make that review easier
      to follow.
    uncertainty: The source gives general lessons rather than identifying the commander’s specific decision points or determining
      which of the 13 PIRs should remain. The G-2 should therefore not infer that a particular number is correct without reviewing
      their decision relevance.
    handoff: 'The G-2 should involve the commander and the entire staff: the source calls for alignment with commander guidance
      and staff-wide contribution, rather than assigning review solely to the collection manager.'
    tempting_wrong:
      option: O1
      pull: Keeping all 13 requirements and leaving review with the collection manager may seem to preserve information and
        a clear owner.
      why_wrong: The source warns against PIRs that do not inform decisions, says the whole staff should contribute, and recommends
        limiting PIRs to those affecting commander decision points.
    rejected:
      O1: It was not chosen because retaining all 13 under the collection manager alone conflicts with the source’s recommendations
        for staff-wide contribution and decision-linked prioritization.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C4
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A binding command directive reserved PIR review to the collection manager and the commander confirmed that all 13
        requirements affected decision points.
      then: O1
      why: That materially different authority and decision context could justify centralized review and retaining the full
        list, although neither condition appears in this scenario.
    would_not_change:
    - id: noflip1
      if: The collection manager could refine all 13 requirements more frequently, but the requirements remained unlinked
        to commander decision points and staff sections did not contribute.
      why: Faster review alone would not address the source’s stated need for staff-wide contribution and decision-focused
        prioritization.
    watch_for:
    - id: watch1
      what: Changes in the operational environment that require PIRs to be updated or adjusted.
      favors:
      - O2
      why: PIRs should change as the environment changes, supporting continuing staff review rather than leaving the list
        static.
    - id: watch2
      what: Whether each proposed PIR affects a commander decision point.
      favors:
      - O2
      why: PIRs should be limited to those affecting commander decision points and nested with those decisions.
  lesson: Treat PIRs as a staff-wide, continuously reviewed responsibility, not a static list owned only by the collection
    manager. Keep the requirements focused on the commander’s decision points so they provide timely, decision-quality information.
  limits: The source does not identify which specific PIRs should be retained or how many are appropriate; that depends on
    the commander’s decision points. Its recommendation concerns responsibility and prioritization, not collection methods
    or assets.
