case:
  id: DR-CORPUS-NX-19c5b601-E3@v1
  title: Authorizing a Rapid Intelligence Warning System
  status: draft
  setting: White House, after Sputnik's 1957 launch, President and NSA
  decider: The President
  agent: The President
  agent_role: decide
  situation: A nuclear attack was assessed as potentially occurring within minutes. Concern about the speed of warning intensified
    after Sputnik's 1957 launch. The President had directed the Intelligence Community to create a system capable of delivering
    critical information within minutes. NSA was under pressure to provide a responsive system. At a White House briefing,
    NSA officials presented a proposal to deliver critical intelligence to the President within 10 minutes and explained the
    required funding level.
  question: What should the President do about authorizing the proposed rapid intelligence warning system and its funding?
  options:
    O1:
      do: The President authorizes the proposed system and its proposed funding.
      move: act
      irreversible: false
    O2:
      do: The President declines to authorize the proposed system or its proposed funding.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A nuclear attack could come within minutes.
  - id: F2
    kind: situation
    status: confirmed
    fact: Concern about the warning timeline was exacerbated following Sputnik's 1957 launch.
  - id: F3
    kind: authority
    status: confirmed
    fact: The President directed the Intelligence Community to create a system capable of delivering critical information
      within minutes.
  - id: F4
    kind: situation
    status: confirmed
    fact: NSA faced pressure to tailor a responsive system.
  - id: F5
    kind: capability
    status: assessed
    fact: The proposed system was described as capable of delivering critical information to the President within 10 minutes.
  - id: F6
    kind: intelligence
    status: assessed
    fact: War warnings were presumed to come from signals intelligence.
  - id: F7
    kind: situation
    status: confirmed
    fact: The NSA Director and Deputy Director were called to the White House to brief the President.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Deputy Director described the funding level the proposed system would require.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The assessed possibility of a nuclear attack within minutes made rapid warning time-critical, and Sputnik intensified
      concern about the warning timeline.
  - id: C2
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The proposal was presented as capable of delivering critical information within 10 minutes, directly addressing the
      President's direction to provide information within minutes.
  - id: C3
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Authorization followed the President's own direction to create a rapid warning capability; no separate legal dispute
      about the President's authority is identified.
  reasoning:
    read: This was a decision about whether to act on an urgent warning requirement, not merely whether to fund a proposal.
      The central judgment was whether the offered 10-minute capability answered the need for information within minutes {F1}
      {F3} {F5}.
    weighing: A nuclear attack could arrive within minutes, and Sputnik heightened the concern about warning time {C1}. NSA
      presented a system described as capable of delivering critical information within 10 minutes, matching the President's
      direction {C2}. The President approved after officials explained the required funding; no countervailing reason to decline
      is given. The balance therefore supports authorization, provided the proposal's stated ability to meet the time requirement
      is credible.
    tradecraft: Confirm that the capability being authorized corresponds to the stated warning requirement, identify the funding
      being approved, and record the decision and its urgency-based rationale.
    uncertainty: The proposed 10-minute capability was described at the briefing; the account provides no independent verification
      of that estimate or evaluation of alternatives.
    handoff: The President made the decision after the NSA Director and Deputy Director briefed him and the funding level
      was presented. No additional approval or referral is identified.
    tempting_wrong:
      option: O2
      pull: Declining could seem prudent because the proposal required funding and its capability was presented rather than
        independently verified in the account.
      why_wrong: The stated reasons prioritize the short warning window and the proposal's fit with the President's direction;
        no concern about the funding or capability is given that would outweigh those reasons.
    rejected:
      O2: The President did not decline because the proposed capability addressed the urgent warning requirement and he approved
        it after the funding level was explained.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed capability were no longer credibly expected to deliver critical information within the required warning
        window.
      then: O2
      why: The proposal's stated ability to meet the time requirement is central to the case for authorizing it.
    would_not_change:
    - id: noflip1
      if: Officials provided further explanation of the funding level, but the urgent warning need and the stated 10-minute
        capability remained unchanged.
      why: Additional explanation of the cost alone would not alter the central reasons for approval.
    watch_for:
    - id: watch1
      what: Whether the proposed system can in practice meet the stated 10-minute delivery capability.
      favors:
      - O2
      why: If that capability is not credible, the proposal would no longer clearly answer the time-critical warning need.
  lesson: When a decision addresses a time-critical warning requirement, compare the proposal's stated capability with the
    urgency and the decision-maker's direction. Authorize on that basis only while the capability remains credible and the
    funding being approved is clear.
  limits: 'This reasoning concerns the specific historical approval described: a proposal presented as meeting an urgent warning
    requirement. It does not establish that any rapid-warning proposal should be approved, or resolve questions about its
    legality, effectiveness, or costs beyond what is stated here.'
  library:
    domain: intel-analysis
    family: CORPUS-NX-19c5b601
    source: https://media.defense.gov/2021/Jul/13/2002761959/-1/-1/0/TORDELLA.PDF
