case:
  id: DR-CORPUS-NX-508b5218-E4@v1
  title: Formation Flight Authorization
  status: draft
  setting: At the 459 FTS, before a scheduled T-6A formation flight; the date and location are not stated.
  decider: The 459 FTS Operations Supervisor
  agent: The 459 FTS Operations Supervisor
  agent_role: decide
  situation: The 89 FTS had scheduled the formation flight under the T-6A syllabus. The 459 FTS Operations Supervisor was
    considering whether to authorize the flight. The formation members provided information about their planned profile and
    risk management, and the Operations Supervisor checked that the risk-management points were entered in the applicable
    system. The four pilots were confirmed green for ground and flying currency, and the completed step form was checked.
  question: What should the 459 FTS Operations Supervisor do about authorizing the scheduled formation flight?
  options:
    O1:
      do: The 459 FTS Operations Supervisor authorizes the scheduled formation flight under the T-6A syllabus.
      move: act
      irreversible: false
    O2:
      do: The 459 FTS Operations Supervisor declines authorization for the scheduled formation flight under the T-6A syllabus.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The 89 FTS scheduled the formation flight in accordance with the T-6A syllabus.
  - id: F2
    kind: situation
    status: assessed
    fact: The Operations Supervisor asked the formation members about their profile, block altitude, risk management, and
      callsign.
  - id: F3
    kind: situation
    status: assessed
    fact: The formation members provided the requested information.
  - id: F4
    kind: situation
    status: assessed
    fact: The Operations Supervisor confirmed with the deputy that the risk-management points total was in the applicable
      computer system.
  - id: F5
    kind: capability
    status: assessed
    fact: The Squadron Aviation Resource Management member confirmed that all four pilots were green for ground and flying
      currency.
  - id: F6
    kind: situation
    status: assessed
    fact: The formation members filled out and signed the step form.
  - id: F7
    kind: situation
    status: assessed
    fact: The Operations Supervisor checked the completed step form.
  considerations:
  - id: C1
    facts:
    - F1
    equity: policy_compliance
    favors:
    - O1
    weight: weak
    why: The flight had been scheduled in accordance with the T-6A syllabus, which was part of the context for the supervisor's
      authorization.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The supervisor asked about the formation's plan and risk management, received the requested information, and confirmed
      that the risk-management points were entered in the applicable system.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: All four pilots were confirmed current for ground and flying, and the supervisor checked the completed step form
      before authorizing the flight.
  - id: C4
    facts:
    - F2
    - F4
    - F5
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The finding that there was no evidence supervision was a factor in the mishap supports not treating the authorization,
      on this record, as a supervisory failure.
  reasoning:
    read: 'The decision was whether to authorize a scheduled flight after the supervisor made the stated checks. The trap
      is to treat the later mishap as proof that the authorization or supervision was deficient: the finding was that there
      was no evidence supervision was a factor.'
    weighing: The source's stated basis for proceeding is the syllabus-based scheduling and the supervisor's checks of the
      plan, risk-management entry, pilot currency, and completed form. Those checks support O1 on this record, while the finding
      about supervision provides no basis to reverse that outcome; the balance would depend on whether the stated checks were
      actually completed and confirmed.
    tradecraft: Record the authorization and the checks supporting it, including the confirmations received and the form review.
      Do not infer from the later mishap alone that the authorization was improper.
    uncertainty: The source records the checks and the no-evidence finding, but does not state a separate legal rule, detailed
      risk threshold, or counterfactual explaining when authorization must be withheld.
    handoff: The supervisor made the authorization decision after receiving confirmation from the deputy and the Squadron
      Aviation Resource Management member; the source gives no reason to require an additional decision-maker.
    tempting_wrong:
      option: O2
      pull: Declining authorization may seem safer when viewed in light of a later mishap.
      why_wrong: 'That hindsight does not replace the source''s stated basis: the supervisor completed the described checks,
        and there was no evidence supervision was a factor.'
    rejected:
      O2: The supervisor authorized the flight after the stated checks, and the source found no evidence that supervision
        was a factor in the mishap.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The risk-management entry, pilot currency, or completed step form could not be confirmed before authorization.
      then: O2
      why: The stated checks would no longer provide the basis on which the supervisor proceeded; withholding authorization
        pending resolution would be prudent.
    would_not_change:
    - id: noflip1
      if: A mishap occurred after authorization, without additional evidence about the supervisor's decision or checks.
      why: The occurrence of a mishap alone would not displace the source's finding that there was no evidence supervision
        was a factor.
    watch_for:
    - id: watch1
      what: Any discrepancy between the risk-management points presented and the entry confirmed in the applicable system.
      favors:
      - O2
      why: Such a discrepancy would undermine the stated confirmation supporting authorization.
  lesson: Authorize on the basis of the stated checks and confirmations, not merely because a flight is scheduled. Assess
    the decision on the information available at authorization time; a later mishap alone does not establish supervisory fault.
  limits: This reasoning applies to the authorization decision and checks described here. It does not establish that the flight
    was risk-free, supply a general authorization standard, or address the mishap's technical causes.
