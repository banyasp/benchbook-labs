case:
  id: DR-CORPUS-NX-676daf09-E1@v1
  title: Choosing a Cross-Country Violence Measure
  status: draft
  setting: West Africa, January 1 to October 15, 2023, regional analysis using ACLED data.
  decider: The author
  agent: The author
  agent_role: decide
  situation: The author is comparing violence across West African countries during 2023. The available measures include incident
    counts and violent fatality totals. Country size and population differ, and the nature of incidents also varies. The data
    include population, fatalities, and crude rates for the countries covered. The author must choose how to present the comparison.
  question: What should the author do when choosing a method to compare violence across West African countries?
  options:
    O1:
      do: The author standardizes fatality figures by population and compares the resulting crude rates across countries.
      move: act
      irreversible: false
    O2:
      do: The author leaves fatality figures unstandardized and compares the reported totals across countries.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Incident counts can be deceptive because they do not account for factors including country size and population.
  - id: F2
    kind: situation
    status: assessed
    fact: The nature of incidents is also identified as a factor relevant to assessing violence.
  - id: F3
    kind: situation
    status: assessed
    fact: Standardizing violent death rates based on population size is described as a more precise approach.
  - id: F4
    kind: situation
    status: confirmed
    fact: From January to mid-October 2023, Burkina Faso had the highest number of violent deaths among the countries compared.
  - id: F5
    kind: situation
    status: confirmed
    fact: Mali and Niger followed Burkina Faso in violent deaths, respectively.
  - id: F6
    kind: situation
    status: confirmed
    fact: Nigeria had the most incidents but ranked third in violent deaths.
  - id: F7
    kind: situation
    status: confirmed
    fact: The table presents population, fatalities, and crude rates for Burkina Faso, Mali, Nigeria, Niger, and Benin.
  - id: F8
    kind: situation
    status: confirmed
    fact: The table data were exported from ACLED and cover January 1 through October 15, 2023.
  considerations:
  - id: C1
    facts:
    - F1
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Incident counts can mislead because they omit country size and population, so raw comparisons may not provide a fair
      basis for comparing violence across countries.
  - id: C2
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The nature of incidents also matters; incident totals alone do not capture all the elements needed to assess violence.
      Population-standardized fatality rates improve the comparison, though they do not by themselves describe incident nature.
  - id: C3
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The author identifies standardizing violent death rates by population size as the more precise approach.
  - id: C4
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The difference between Nigeria's incident ranking and its fatality ranking illustrates why incident frequency alone
      can give a deceptive comparison.
  reasoning:
    read: The decision is about how to compare violence across countries with different populations, not simply which country
      has the largest raw count. The trap is treating incident frequency or unstandardized totals as directly comparable despite
      differences in country size and the nature of incidents.
    weighing: The author favors population-standardized violent death rates because incident counts omit relevant factors
      and standardizing rates is described as more precise {C1} {C3}. The difference between Nigeria's incident and fatality
      rankings illustrates the problem with relying on incident counts {C4}. Incident nature remains relevant, so rates should
      not be mistaken for a complete account of violence {C2}.
    tradecraft: Compare the population-standardized fatality rates and identify the ACLED period and coverage used. Retain
      the underlying fatality totals and incident context as context, and avoid presenting the rates as a complete characterization
      of incident nature.
    uncertainty: The source gives a comparative-method judgment, not a claim that population-standardized rates capture every
      relevant aspect of violence. It specifically notes that incident nature matters, and the figures cover January 1 through
      October 15, 2023.
    handoff: The author can make this methodological choice without a separate authority; the source provides no requirement
      for external approval. This is an analytic comparison, not an operational decision.
    tempting_wrong:
      option: O2
      pull: Raw totals and incident counts are readily compared, and the total number of deaths may seem like a direct measure
        of violence.
      why_wrong: That comparison does not account for country size and population, and incident counts can produce a different
        ranking from fatalities.
    rejected:
      O2: The author does not leave fatality figures unstandardized because country size and population make raw comparisons
        potentially deceptive.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The comparison were instead expressly limited to absolute fatality totals, rather than comparative violence across
        countries of different populations.
      then: O2
      why: For that narrower question, unstandardized totals would answer the question being asked; this changes the analytic
        objective rather than the source's stated comparison.
    would_not_change:
    - id: noflip1
      if: Nigeria continued to have the most incidents while ranking third in violent deaths.
      why: That divergence reinforces the concern about relying on incident counts and does not weaken the case for the population-standardized
        comparison.
    watch_for:
    - id: watch1
      what: Changes to the population or fatality data used to calculate the crude rates.
      favors:
      - O1
      why: The rates depend on the population and fatality figures; updated inputs could change the comparison and should
        be reflected in the analysis.
  lesson: When comparing violence across populations of different sizes, do not treat raw incident counts or fatality totals
    as directly comparable measures. Use population-standardized fatality rates for a more precise comparison, while retaining
    incident context because the nature of incidents also matters.
  limits: This reasoning concerns the author's cross-country comparison of violence using the specified 2023 ACLED data. It
    does not establish that rates alone capture the nature or severity of every incident, or that standardized rates are the
    appropriate measure for a question specifically about absolute totals.
