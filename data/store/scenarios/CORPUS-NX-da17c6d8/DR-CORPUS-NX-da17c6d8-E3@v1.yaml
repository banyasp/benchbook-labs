case:
  id: DR-CORPUS-NX-da17c6d8-E3@v1
  title: Hezbollah’s Strategic Choice in Southern Lebanon
  status: draft
  setting: Southern Lebanon during Israeli occupation; Hezbollah leadership.
  decider: Hezbollah leadership
  agent: Hezbollah leadership
  agent_role: decide
  situation: Hezbollah sought the eventual creation of an Iranian-style Islamic republic in Lebanon and regarded the departure
    of Israeli forces and their South Lebanese Army proxy from southern Lebanon as a necessary step. Non-military means were
    considered important to the group’s broader strategy but insufficient to achieve that departure. The leadership assessed
    that a sustained military campaign could undermine Israeli public support for the war effort by exploiting public aversion
    to casualties. It anticipated that such a campaign could be long and bloody. The leadership also assessed that the conflict
    could strengthen Hezbollah’s position as a protector of southern Lebanon’s population.
  question: What should Hezbollah leadership do about whether to adopt a sustained military strategy in southern Lebanon?
  options:
    O1:
      do: The Hezbollah leadership adopts a military strategy in southern Lebanon.
      move: act
      irreversible: false
    O2:
      do: The Hezbollah leadership rejects a military strategy in southern Lebanon.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Hezbollah’s ultimate goal was described as eventually creating an Iranian-style Islamic republic for Lebanon.
  - id: F2
    kind: situation
    status: assessed
    fact: Hezbollah regarded forcing the IDF and its SLA proxy out of southern Lebanon as a prerequisite to that goal.
  - id: F3
    kind: situation
    status: assessed
    fact: Non-military means were an important part of Hezbollah’s overall strategy, but were considered insufficient to force
      the IDF and SLA out of southern Lebanon.
  - id: F4
    kind: situation
    status: assessed
    fact: The leadership assessed that achieving its desired end state required a holistic military campaign based on a pragmatic
      strategy.
  - id: F5
    kind: situation
    status: assessed
    fact: The leadership believed that appealing to Israeli public aversion to casualties could undermine support for the
      war effort.
  - id: F6
    kind: situation
    status: assessed
    fact: The leadership believed that the conflict would likely be a long and bloody process.
  - id: F7
    kind: situation
    status: assessed
    fact: The leadership believed that, regardless of the conflict’s outcome, it could position Hezbollah as the leading force
      in southern Lebanon.
  - id: F8
    kind: situation
    status: assessed
    fact: Hezbollah’s stated aim included being seen as protecting the Lebanese population of southern Lebanon from Israeli
      occupation.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The leadership regarded the departure of Israeli forces and their proxy as necessary to its desired end state, and
      judged non-military means insufficient; it concluded a holistic military campaign was needed.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The leadership believed a sustained campaign could exploit Israeli public aversion to casualties and thereby undermine
      support for the war effort.
  - id: C3
    facts:
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The leadership believed the conflict could strengthen Hezbollah's position in southern Lebanon and present it as
      protecting the population from occupation.
  - id: C4
    facts:
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: The leadership anticipated a long and bloody process, a substantial human-cost concern even though the account does
      not specify who would bear that cost.
  reasoning:
    read: This was a strategic choice about how to pursue the departure of Israeli forces and their proxy, which the leadership
      treated as a prerequisite to its longer-term goal. The trap is to mistake the importance of non-military means for a
      belief that they could achieve that departure on their own; the leadership judged them insufficient.
    weighing: The leadership endorsed O1 because it assessed that the desired end state required a holistic military campaign,
      that the campaign could weaken Israeli public support, and that it could establish Hezbollah as a leading force and
      protector in southern Lebanon. It recognized that the process would likely be long and bloody, but the stated rationale
      still favored adopting the strategy. That balance depends on the leadership's assessments of necessity, likely effects,
      and costs; the account provides no legal or humanitarian analysis.
    tradecraft: As a decision practice, record the strategic objective, the assessment that non-military means are insufficient,
      the anticipated benefits and human costs, and the assumptions on which the choice depends. Do not treat the stated strategic
      rationale as a finding that every later action is lawful or justified.
    uncertainty: The leadership's expectations are not proof that the campaign would achieve its effects. The account does
      not specify who would bear the anticipated casualties, the campaign's legal basis, or whether other feasible courses
      were assessed.
    handoff: The decision is attributed to Hezbollah leadership, and no separate approving authority or required referral
      is identified. The leadership should remain accountable for the strategic choice; any legal review or additional approval
      requirement cannot be established from the available information.
    tempting_wrong:
      option: O2
      pull: Rejecting a military strategy avoids committing to a course the leadership expected to be long and bloody.
      why_wrong: On the leadership's own assessment, non-military means were insufficient to secure the departure it regarded
        as necessary, while a sustained campaign offered a way to pursue that objective and strengthen its local position.
    rejected:
      O2: The leadership did not choose rejection because it judged non-military means insufficient for its desired end state
        and believed a sustained campaign could undermine Israeli support and strengthen Hezbollah's position.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership no longer assessed that a military campaign was necessary or that it could meaningfully advance the
        departure of Israeli forces and their proxy.
      then: O2
      why: The central rationale for adopting the strategy was that non-military means were insufficient and a military campaign
        was needed for the desired end state.
    - id: flip2
      if: The anticipated human costs were judged to outweigh the expected strategic and political gains.
      then: O2
      why: A long and bloody process was an acknowledged cost; if that cost outweighed the expected benefits, rejection would
        become the preferable course.
    would_not_change:
    - id: noflip1
      if: Non-military means remained important to Hezbollah's broader strategy but were still assessed as insufficient to
        force the departure of Israeli forces and their proxy.
      why: That combination is consistent with the leadership's stated rationale for adopting a military campaign rather than
        relying on non-military means alone.
    watch_for:
    - id: watch1
      what: Whether the expected effect on Israeli public support and Hezbollah's standing as a protector remains credible.
      favors:
      - O1
      why: Those expected effects formed part of the leadership's stated justification; loss of confidence in them would weaken
        that justification.
  lesson: When a decision-maker judges non-military means insufficient for a central objective, assess the proposed alternative
    against both its expected strategic value and its foreseeable human cost. A stated expectation of political or strategic
    gain is a reason for the decision, not proof that the means are lawful or that the expected result will occur.
  limits: This reasoning reconstructs Hezbollah leadership's stated strategic rationale; it does not endorse the objective
    or establish the legality of the campaign or any particular action. It does not assess operational methods, actual outcomes,
    or harms beyond the anticipated long and bloody process.
