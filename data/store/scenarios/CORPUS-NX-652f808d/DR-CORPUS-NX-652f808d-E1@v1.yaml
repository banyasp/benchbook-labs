case:
  id: DR-CORPUS-NX-652f808d-E1@v1
  title: Use of the Red Cross Emblem on an Aid Lorry
  status: draft
  setting: Shropshire, United Kingdom, February 1996; British Red Cross
  decider: The trucker
  agent: The trucker
  agent_role: decide
  situation: The trucker delivers food and emergency supplies to Bosnia using a lorry bearing the red cross emblem. He says
    he has made repeated aid deliveries to the former Yugoslavia over the past three years. He says the ICRC authorized his
    use of the emblem and that he relies on it for protection when crossing the front line. The British Red Cross has demanded
    that he arrange for the emblem to be removed by February 13 and has threatened further action. A British Red Cross spokesperson
    says the use violates UK law and should be limited to people working for the Red Cross. The trucker must decide how to
    respond to the demand.
  question: What should the trucker do about displaying the red cross emblem on his lorry after the British Red Cross demand?
  options:
    O1:
      do: The trucker keeps the emblem displayed on his lorry.
      move: act
      irreversible: false
    O2:
      do: The trucker asks the ICRC to confirm its authorization.
      move: ask
      irreversible: false
      to: the ICRC
    O3:
      do: The trucker removes the emblem from his lorry.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The reported dispute concerns a trucker in Shropshire, United Kingdom, in February 1996.
  - id: F2
    kind: situation
    status: confirmed
    fact: The trucker delivers food and emergency supplies to Bosnia.
  - id: F3
    kind: situation
    status: assessed
    fact: The trucker says he has taken 24 loads to the former Yugoslavia in the past three years.
  - id: F4
    kind: authority
    status: assessed
    fact: The trucker says the ICRC gave him permission to use the emblem.
  - id: F5
    kind: situation
    status: assessed
    fact: The trucker says he uses the emblem for protection when crossing the front line.
  - id: F6
    kind: authority
    status: confirmed
    fact: The head of international law at the British Red Cross demanded that the trucker arrange removal of the emblem by
      February 13 and threatened further action.
  - id: F7
    kind: authority
    status: assessed
    fact: A British Red Cross spokesperson said the trucker was breaking UK law and that only people working for the Red Cross
      could use the symbol.
  - id: F8
    kind: situation
    status: assessed
    fact: The trucker says he is unwilling to remove the emblem.
  considerations:
  - id: C1
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The trucker said he relied on the emblem for protection when crossing the front line.
  - id: C2
    facts:
    - F2
    - F3
    equity: humanitarian_access
    favors:
    - O1
    weight: strong
    why: He was delivering food and emergency supplies and said he had made 24 deliveries over three years.
  - id: C3
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: He said the ICRC had authorized his use of the emblem, though the account does not independently establish that authorization.
  - id: C4
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The British Red Cross demanded removal and threatened further action; its spokesperson said the use violated UK law
      and that use should be limited to people working for the Red Cross.
  reasoning:
    read: This is a dispute over the trucker's continued display of the emblem, not a dispute over whether his deliveries
      are humanitarian. The central tension is between his stated reliance on the emblem and claimed ICRC permission, and
      the British Red Cross's assertion that the use is unauthorized and unlawful.
    weighing: The trucker's stated reasons for keeping the emblem are its protective value during front-line crossings, his
      aid work, and his understanding that the ICRC authorized it. The British Red Cross's legal warning and demand point
      the other way. The source records that the trucker chose to keep it, but does not resolve the conflicting claims about
      authorization or UK law.
    tradecraft: If carrying out this choice, keep the basis for relying on the claimed ICRC permission and the British Red
      Cross's demand clear in the decision record; do not present either party's position as independently verified.
    uncertainty: The account does not establish the terms or scope of the claimed ICRC permission, or independently determine
      whether the use violated UK law.
    handoff: The source records the trucker's choice and the British Red Cross's position, but no legal resolution. As a decision
      practice, seek clarification from the ICRC about the claimed permission and from the British Red Cross about its legal
      objection.
    tempting_wrong:
      option: O3
      pull: The British Red Cross demanded removal and said the use broke UK law.
      why_wrong: 'That position is not presented as a resolution of the dispute: the trucker said the ICRC had authorized
        use and that he relied on the emblem for protection, and he chose to keep it.'
    rejected:
      O2: The account records no request for confirmation; the trucker instead said he would keep the emblem, citing claimed
        ICRC permission and its protective value.
      O3: The trucker rejected removal, calling the dispute petty and citing the claimed authorization, his aid work, and
        the emblem's protective value.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The claimed ICRC permission remains unverified and there is time to obtain clarification before the next use.
      then: O2
      why: Seeking confirmation would address the unresolved authorization issue before continuing to display the emblem.
    - id: flip2
      if: The ICRC confirms there was no authorization and the applicable UK restriction is established.
      then: O3
      why: The trucker's stated basis of permission would no longer support continued display, while the legal objection would
        be substantiated.
    would_not_change:
    - id: noflip1
      if: The deliveries remain humanitarian but the authorization and legal dispute is otherwise unchanged.
      why: The aid purpose supports humanitarian access but does not, by itself, resolve whether the emblem may lawfully be
        displayed.
    watch_for:
    - id: watch1
      what: Confirmation from the ICRC about the permission the trucker says it gave.
      favors:
      - O2
      - O1
      - O3
      why: Clarification could support continued display or alter the trucker's stated basis for keeping the emblem.
  lesson: A humanitarian purpose and a claimed protective benefit do not, by themselves, settle whether an emblem is authorized
    for use. When authorization is disputed, distinguish the agent's stated understanding from an established legal determination.
  limits: The source is a brief news account and records competing assertions, not a legal finding about the scope of ICRC
    permission or the application of UK law. This reasoning does not establish who may use the emblem in other circumstances.
