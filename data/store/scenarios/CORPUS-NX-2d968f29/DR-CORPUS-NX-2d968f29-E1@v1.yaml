case:
  id: DR-CORPUS-NX-2d968f29-E1@v1
  title: Possible MiG Delivery to Nicaragua
  status: draft
  setting: Nicaragua and the Central American region; later in the year; United States administration.
  decider: The President and the national-security team
  agent: The President and the national-security team
  agent_role: decide
  situation: The United States was assessing Nicaragua's military buildup and its implications for the region. NSDD 17 had
    tasked senior officials with developing contingency plans concerning Cuba and Nicaragua and a public-affairs strategy
    for informing the public and Congress about the region. NSDD 21 declared that the United States would not tolerate fighter
    aircraft being introduced into Nicaragua. U.S. intelligence assessed that Nicaragua already had the region's strongest
    ground force, with Soviet and Cuban assistance. It assessed that acquiring MiG fighters would give Nicaragua the region's
    best air force.
  question: What should the President and the national-security team do if Nicaragua acquires MiG fighter aircraft?
  options:
    O1:
      do: The administration prohibits military force against MiGs if Nicaragua acquires them.
      move: act
      irreversible: false
    O2:
      do: The administration permits military force against MiGs if Nicaragua acquires them.
      move: act
      irreversible: true
    O3:
      do: The administration holds the force decision pending a further policy review.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: NSDD 17 tasked senior government officials with developing military contingency plans concerning Cuba and Nicaragua.
  - id: F2
    kind: situation
    status: confirmed
    fact: NSDD 17 tasked officials with developing a public-affairs strategy to inform the public and Congress about the situation
      in the region.
  - id: F3
    kind: authority
    status: confirmed
    fact: NSDD 21 stated that the United States would not tolerate the introduction of fighter aircraft into Nicaragua.
  - id: F4
    kind: intelligence
    status: assessed
    fact: U.S. intelligence assessed that Nicaragua had already built the strongest ground force in the region.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The assessment attributed Nicaragua's military strength in part to Soviet and Cuban assistance.
  - id: F6
    kind: intelligence
    status: assessed
    fact: U.S. intelligence assessed that Nicaragua would have the region's best air force if it received MiG fighter aircraft.
  considerations:
  - id: C1
    facts:
    - F3
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: NSDD 21 declared that the United States would not tolerate fighter aircraft being introduced into Nicaragua. Permitting
      force in the stated MiG scenario aligned with that declared policy, although the declaration itself did not expressly
      require an attack.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The administration's assessment was that Nicaragua already had the region's strongest ground force, with Soviet and
      Cuban assistance, and that MiGs would give it the region's best air force. That assessed regional arms imbalance supported
      the administration's decision to permit force if the aircraft arrived.
  - id: C3
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: NSDD 17 called for military contingency planning concerning Nicaragua and Cuba, showing that the administration was
      preparing for possible developments. That planning supports readiness to act but does not, on its own, establish that
      force was authorized or necessary.
  reasoning:
    read: 'The decision was conditional: the administration was assessing the consequences of a possible MiG acquisition,
      not responding to a stated completed delivery. The trap is to treat NSDD 21''s opposition to introducing fighters as
      if it were itself legal authorization for an attack; the record establishes a policy declaration and a later agreement
      to use force, but not the legal basis or limits for doing so.'
    weighing: 'The administration''s stated balance favored O2: it opposed fighter aircraft being introduced into Nicaragua
      and assessed that MiGs would give Nicaragua the region''s best air force on top of an already powerful ground force.
      The contingency-planning task was consistent with preparing a response, but does not make an independent justification
      for force. The balance depends on the stated condition—Nicaragua acquiring MiGs—and on the assessment of the resulting
      regional threat.'
    tradecraft: 'Keep the decision at the policy level: record the conditional trigger, the assessments relied upon, and the
      distinction between a declared policy and authority to use force. Before any action, confirm the applicable legal authority
      and decision limits; do not treat contingency plans as operational authorization. Carry forward the public-affairs task
      separately from the force decision.'
    uncertainty: The administration was considering a possible future acquisition; no completed MiG delivery is established.
      The legal review and other conditions that would govern an attack are not detailed.
    handoff: The President and national-security team are the identified decision-makers. No other office is identified as
      holding the decision; legal and policy review before implementation would be prudent, but that additional handoff is
      not specified.
    tempting_wrong:
      option: O1
      pull: Prohibiting force can appear to be the cautious response to the risks of military escalation.
      why_wrong: 'The administration''s stated policy choice went the other way: it had declared opposition to the introduction
        of fighters and agreed to attack and destroy them if Nicaragua acquired MiGs.'
    rejected:
      O1: The administration did not prohibit force; it agreed to use force if Nicaragua acquired MiG fighters.
      O3: The administration agreed on the conditional response rather than deferring that policy choice for further review.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A reassessment no longer supported the judgment that MiGs would give Nicaragua the region's best air force or pose
        the assessed regional threat.
      then: O3
      why: The principal stated security rationale would be materially weakened, supporting a further policy review rather
        than carrying forward the force decision.
    would_not_change:
    - id: noflip1
      if: Nicaragua had not acquired MiGs.
      why: That would not meet the stated condition for the agreed response; it would not establish that force should be used
        in the absence of the acquisition.
    watch_for:
    - id: watch1
      what: Whether Nicaragua acquires MiG fighters and whether the assessment of their effect on the regional air balance
        remains current.
      favors:
      - O2
      - O3
      why: Acquisition is the stated trigger, while the assessed regional balance supplies the principal stated security rationale.
  lesson: A declared policy and a contingency plan can explain a force decision, but neither should be mistaken for the legal
    authority to carry it out. Keep the decision conditional on the stated trigger and the assessments that supplied its rationale.
  limits: This reasoning addresses only the administration's policy choice about a possible MiG acquisition. It does not establish
    that an acquisition occurred, specify legal authorization for an attack, or provide operational rules for using force.
