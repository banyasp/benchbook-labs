case:
  id: DR-CORPUS-NX-6e10dacd-E6@v1
  title: Framing a Divided Soviet Assessment
  status: draft
  setting: United States intelligence-estimate process, November 1987
  decider: The estimative body preparing the National Intelligence Estimate
  agent: The estimative body preparing the National Intelligence Estimate
  agent_role: decide
  situation: An estimate near the end of 1987 reviewed Gorbachev’s first two and a half years in power and projected possible
    directions for Soviet policy. Its main assessment treated him as a bold reformer seeking significant changes to the Soviet
    system. The NSA Director offered a different interpretation, viewing reform as a means of revitalizing party power and
    anticipating either backlash or a retreat toward immobility. The estimate discussed several possible Soviet political
    futures, while the alternative view anticipated a greater global challenge to the United States. The alternative interpretation
    appeared in the estimate’s key judgments.
  question: 'What should the estimative body do when finalizing the estimate’s key judgments: include or exclude the alternative
    interpretation?'
  options:
    O1:
      do: The estimative body includes the NSA Director’s alternative interpretation in the estimate’s key judgments.
      move: act
      irreversible: false
    O2:
      do: The estimative body excludes the NSA Director’s alternative interpretation from the estimate’s key judgments.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The estimate reviewed Gorbachev’s first two and a half years in power and projected possible future directions.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The estimate’s main view assessed Gorbachev’s intentions as bold and visionary, aimed at significant changes to
      the Soviet system.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The main view anticipated replacing officials who resisted change and revamping institutions within a Leninist framework.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The main view anticipated profound foreign-policy changes, less reliance on military intimidation, and reduced tension
      with the West to constrain defense-spending growth.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The estimate considered four possible scenarios ranging from democratic socialism to neo-Stalinism.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The main view assessed that Soviet change would arise largely from internal forces, with only indirect effects from
      outside influences.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The NSA Director’s alternative view assessed that Gorbachev sought to revitalize the party, and that the purge was
      the object of reform rather than a means to broader system change.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The alternative view interpreted Gorbachev’s actions in power-politics terms and assessed that he would either trigger
      a party and security-service backlash or, more likely, retreat toward Brezhnevite immobility.
  - id: F9
    kind: situation
    status: confirmed
    fact: The NSA Director’s alternative interpretation was presented in the estimate’s key judgments.
  - id: F10
    kind: intelligence
    status: assessed
    fact: The alternative view assessed that Soviet foreign policy would pose a greater global challenge to the United States.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The main assessment presents a substantive account of Gorbachev’s aims and expected domestic and foreign-policy changes;
      including the alternative makes clear that this was the estimate’s main view, not an uncontested conclusion.
  - id: C2
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: 'The NSA Director’s account differs on the central question of Gorbachev’s purpose: it treats party revitalization
      as the aim and the purge as the object of reform, rather than as a tool of broader change.'
  - id: C3
    facts:
    - F5
    - F8
    - F10
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The alternative offers consequentially different expectations—backlash or retrenchment and a greater global challenge
      to the United States—alongside an estimate that already considered several possible Soviet futures.
  - id: C4
    facts:
    - F1
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The estimate was projecting an uncertain future and treated change as arising largely from internal forces; retaining
      a materially different interpretation helps policymakers see the range of possibilities rather than mistake one projection
      for certainty.
  reasoning:
    read: The decision is how to represent a genuine disagreement about Gorbachev’s motives and the direction of Soviet policy
      in the key judgments. The trap is to treat the main assessment’s prominence and detail as proof that the alternative
      is immaterial, or to present the alternative as though it were the estimate’s consensus.
    weighing: The main view has a clear rationale for anticipating significant system changes, including changes in personnel
      and institutions and a less confrontational foreign policy {C1}. The NSA Director’s alternative disputes the purpose
      of reform and forecasts different political and strategic consequences {C2} {C3}. Because the estimate itself considers
      several possible futures and emphasizes internal forces, the competing interpretation is material to communicating uncertainty
      {C4}. The balance supports including it as an attributed alternative, without collapsing the disagreement or implying
      that the estimate resolved it.
    tradecraft: Keep the main assessment distinct from the NSA Director’s alternative, attribute each view to its office,
      and state their different rationales and forecasts without implying consensus. Record the alternative in the key judgments
      as a competing assessment, not as a finding that either projection was certain.
    uncertainty: Unpredictable events could shape which of the four possible futures emerged, and the estimate held that Soviet
      change would arise largely from internal forces. Neither view established which scenario would occur or settled the
      disagreement about Gorbachev’s aims.
    handoff: The estimative body should finalize the key judgments and preserve the distinction between its main assessment
      and the NSA Director’s alternative. The passage identifies no separate authority to resolve the analytic disagreement.
    tempting_wrong:
      option: O2
      pull: The estimate’s main view is developed in detail and already discusses four possible futures.
      why_wrong: Excluding the alternative would omit a fundamentally different interpretation of Gorbachev’s aims and a materially
        different forecast—the very kind of disagreement the estimate’s key judgments recorded.
    rejected:
      O2: The source’s outcome was to include the NSA Director’s fundamentally different alternative view in the key judgments,
        rather than suppress the recorded disagreement.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A review of the available assessment found that the party-revitalization interpretation had no adequate analytic
        support and no longer merited presentation as a considered alternative.
      then: O2
      why: An unsupported interpretation would no longer serve the purpose of representing a genuine analytic disagreement.
    would_not_change:
    - id: noflip1
      if: The main assessment remains the estimative body’s principal view.
      why: That alone would not negate the significance of a materially different interpretation and forecast.
    watch_for:
    - id: watch1
      what: As events unfold, monitor which of the estimate’s four possible political futures appears to be emerging.
      favors:
      - O1
      why: The scenarios were laid out to help policymakers watch how unpredictable events developed, making it useful to
        retain the alternative against which those developments could be assessed.
  lesson: When key judgments concern an uncertain trajectory, a materially different and reasoned interpretation should be
    preserved as an attributed alternative rather than erased or presented as consensus. Distinguish the main assessment from
    dissent, and make clear what each view predicts.
  limits: This conclusion concerns whether to include a documented alternative in this estimate’s key judgments; it does not
    determine which interpretation was correct. It does not rely on later developments beyond the passage.
