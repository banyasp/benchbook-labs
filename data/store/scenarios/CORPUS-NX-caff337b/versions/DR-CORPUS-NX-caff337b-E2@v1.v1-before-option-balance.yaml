case:
  id: DR-CORPUS-NX-caff337b-E2@v1
  title: Finding the Cause of an Aircraft Mishap
  status: draft
  setting: Wittman Regional Airport (KOSH), 28 July 2011; Air Force mishap investigation.
  decider: The investigating officer
  agent: The investigating officer
  agent_role: decide
  situation: An F-16C assigned to the 100th Fighter Squadron departed the prepared runway during a continuation training mission
    at KOSH. During the landing roll, cockpit fogging completely obscured the pilot’s visual cues. The available record included
    historical records, engineering analysis, witness testimony, photographs, flight data, simulations, and technical expert
    input. The investigating officer had to assess the cause separately from whether other conditions substantially contributed,
    using different evidentiary standards for those determinations.
  question: What should the investigating officer determine about the cause of the mishap and any contributing factors?
  options:
    O1:
      do: The investigating officer excludes ECS-related cockpit fogging as the cause and identifies no additional contributing
        factors.
      move: act
      irreversible: false
    O2:
      do: The investigating officer requests further technical review from experts before issuing findings on cause and contributing
        factors.
      move: ask
      irreversible: false
      to: technical experts
    O3:
      do: The investigating officer includes ECS-related cockpit fogging as the cause and identifies three additional contributing
        factors.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 28 July 2011, an F-16C assigned to the 100th Fighter Squadron departed the prepared runway at Wittman Regional
      Airport during a continuation training mission.
  - id: F2
    kind: situation
    status: confirmed
    fact: During the landing roll, extreme cockpit fogging completely obscured the pilot’s visual cues.
  - id: F3
    kind: situation
    status: assessed
    fact: The loss of visual cues prevented the pilot from stopping the aircraft within the available runway distance.
  - id: F4
    kind: situation
    status: confirmed
    fact: The aircraft sustained $5.4 million in damage, the pilot was unharmed, and airport damage was minor.
  - id: F5
    kind: situation
    status: confirmed
    fact: The evidence reviewed included historical records, guidance and directives, engineering analysis, witness testimony,
      photographs, flight data, simulations, and technical expert information.
  - id: F6
    kind: authority
    status: confirmed
    fact: The cause determination used a clear-and-convincing-evidence standard, while substantial contributing factors were
      assessed under a preponderance-of-the-evidence standard.
  - id: F7
    kind: situation
    status: assessed
    fact: The assessment addressed three additional conditions as potential substantial contributing factors.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The investigating officer found by clear and convincing evidence that ECS-related extreme fogging obscured the pilot’s
      visual cues and prevented stopping within the available runway distance. The finding rested on a broad evidentiary record,
      and the cause determination was assessed under the higher stated standard.
  - id: C2
    facts:
    - F2
    - F3
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: 'The officer found the less-than-13-degree aerobrake condition substantially contributed: the loss of visual and
      instrument references impeded a normal aerobrake and assessment of the remaining distance. The officer assessed this
      contributing factor under the preponderance standard.'
  - id: C3
    facts:
    - F2
    - F3
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The fast approach and touchdown speeds increased the landing distance and were identified as a contributing factor.
      The officer nevertheless reasoned that without ECS fogging the aircraft could have stopped even with the increased distance
      associated with the average touchdown speed.
  - id: C4
    facts:
    - F2
    - F3
    - F5
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Photographic evidence showed the speedbrakes were closed during the landing roll, and simulation indicated that this
      increased landing distance. The officer identified that condition as the third substantial contributor.
  reasoning:
    read: This is a fact-finding judgment about the cause of a runway departure, not a judgment about whether the pilot’s
      landing actions were proper. The key distinction is between the fogging found to be the cause under the clear-and-convincing
      standard and three conditions found to have substantially contributed under the preponderance standard.
    weighing: ECS-related fogging is the primary causal finding because it completely obscured visual cues and prevented the
      pilot from stopping within the available runway distance. The less-than-13-degree aerobrake condition, fast touchdown
      speed, and closed speedbrakes are additional contributors, each supported by the evidence and assessed under the lower
      stated standard. The balance depends on preserving the distinction between the primary cause and contributing conditions;
      the officer’s reasoning also notes that the aircraft could have stopped without the fogging even with the increased
      distance associated with the average touchdown speed.
    tradecraft: Record the causal finding and each contributing-factor finding separately, state the applicable evidentiary
      standard for each, and connect each finding to its supporting record without turning the findings into an assessment
      of pilot technique.
    uncertainty: The decision is an evidentiary assessment rather than a claim that every causal detail is certain. The source
      gives different standards for cause and contributing factors and identifies the kinds of evidence considered, but the
      supplied excerpt does not include the remainder of the speedbrake discussion.
    handoff: The investigating officer can issue the findings on the reviewed record. Technical experts’ input was among the
      evidence considered; the stated reasons do not call for another referral before deciding.
    tempting_wrong:
      option: O1
      pull: It may seem attractive to avoid attributing the mishap to the ECS or to identify no additional factors when the
        landing involved multiple conditions.
      why_wrong: That would disregard the officer’s clear-and-convincing finding that ECS fogging was the cause and the preponderance
        findings that three conditions substantially contributed.
    rejected:
      O1: The officer’s findings support ECS-related fogging as the cause and identify three substantial contributing factors,
        rather than excluding them.
      O2: The officer had a broad evidentiary record, including technical and simulation evidence, and reached findings on
        both cause and contributing factors.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The record were materially incomplete or no longer sufficient to assess the ECS causal link or the proposed contributing
        factors.
      then: O2
      why: Further technical review would be appropriate before issuing findings that depend on those evidentiary assessments.
    would_not_change:
    - id: noflip1
      if: The increased landing distance associated with the average touchdown speed were established without evidence of
        ECS fogging.
      why: The officer’s stated reasoning was that the aircraft could still have stopped without the fogging, even with that
        increased distance; the speed condition therefore did not displace fogging as the cause.
    watch_for: []
  lesson: Separate the primary cause from conditions that substantially contributed, and apply the stated evidentiary standard
    to each finding. Multiple contributing conditions do not, by themselves, displace a cause supported by the record.
  limits: This reasoning applies to the fact-finding judgment and evidentiary standards in this mishap investigation. It does
    not determine whether the pilot’s actions were operationally correct or establish findings in a different record.
