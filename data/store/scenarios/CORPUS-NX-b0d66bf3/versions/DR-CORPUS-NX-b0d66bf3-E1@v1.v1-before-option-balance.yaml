case:
  id: DR-CORPUS-NX-b0d66bf3-E1@v1
  title: HEXAGON Reentry Vehicle Recovery Decision
  status: draft
  setting: Near Hawaii, 1971, National Reconnaissance Office, Navy, and Scripps Institution of Oceanography.
  decider: The Director of the National Reconnaissance Office
  agent: The Director of the National Reconnaissance Office
  agent_role: decide
  situation: On July 10, 1971, the third reentry vehicle from the first HEXAGON photo-satellite mission was lost near Hawaii
    after a parachute failure. The vehicle carried film imagery from a particularly productive part of the mission, and much
    of the imagery might survive saltwater immersion if the vehicle had not broken up on impact. Recovery might also yield
    information about the parachute failure. Navy support and Scripps expertise could be made available for a recovery effort,
    with approximately $100,000 in NRO funding contemplated for Scripps services. The success of recovery remained uncertain,
    while the Navy considered the proposed funding probably adequate.
  question: What should the Director of the National Reconnaissance Office do about pursuing recovery with Navy and Scripps
    support or leaving the vehicle unrecovered?
  options:
    O1:
      do: The NRO Director authorizes Navy and Scripps support to pursue recovery of the vehicle.
      move: act
      irreversible: false
    O2:
      do: The NRO Director asks Navy and Scripps for detailed planning before deciding on support.
      move: ask
      irreversible: false
      to: Navy and Scripps
    O3:
      do: The NRO Director declines Navy and Scripps support and leaves the vehicle unrecovered.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The third reentry vehicle from the first HEXAGON photo-satellite mission was lost near Hawaii on July 10, 1971,
      after a parachute failure.
  - id: F2
    kind: intelligence
    status: assessed
    fact: If the vehicle did not break up on impact, much of the film imagery might survive saltwater immersion.
  - id: F3
    kind: situation
    status: confirmed
    fact: The imagery recorded on the film came from a particularly productive portion of the mission.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Recovering the vehicle might provide additional information about the parachute failure.
  - id: F5
    kind: capability
    status: assessed
    fact: Navy and Scripps support could be made available, with approximately $100,000 in NRO funding contemplated for Scripps
      services.
  - id: F6
    kind: capability
    status: confirmed
    fact: The Navy was willing to assist with the recovery effort.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Recovery success depended on locating the vehicle and was not certain; recovery could be effected if the vehicle
      was located.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The proposed funding was probably adequate and presented no problem at that time.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The film might have survived immersion, and it depicted a particularly productive part of the mission, making recovery
      potentially valuable.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Recovery could also provide additional information about the parachute failure.
  - id: C3
    facts:
    - F5
    - F6
    - F8
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Navy assistance and Scripps expertise were available, and the contemplated funding was considered adequate and not
      a problem at that time.
  - id: C4
    facts:
    - F7
    equity: resource_stewardship
    favors:
    - O2
    - O3
    weight: weak
    why: Finding the vehicle was uncertain, so the effort could not be treated as a guaranteed recovery; however, recovery
      was possible if the vehicle was located.
  reasoning:
    read: This is a decision to pursue a potentially valuable salvage effort, not a finding that recovery will succeed. The
      trap is to treat either the possible intelligence value as certain or the uncertainty of locating the vehicle as a reason
      that recovery has no value.
    weighing: The NRO cited the chance that useful imagery survived and the possibility of learning more about the parachute
      failure {C1} {C2}. Navy support was offered, Scripps expertise was available, and the contemplated funding was probably
      adequate {C3}. The chance of success remained uncertain and depended on locating the vehicle {C4}; the balance nevertheless
      favored pursuing recovery rather than leaving it unrecovered.
    tradecraft: Authorize the recovery effort and continue coordination with the Navy and Scripps on the proposed support.
      Record that the expected benefits were conditional and that success was not assured.
    uncertainty: The vehicle's location was not certain, and the imagery's survival depended on whether the vehicle had broken
      up on impact. The source gives no assurance that either recovery or usable film would result.
    handoff: The NRO Director should decide whether to pursue the effort and involve the Navy and Scripps for the support
      and expertise the NRO sought.
    tempting_wrong:
      option: O3
      pull: Avoid spending resources on an uncertain recovery.
      why_wrong: The uncertainty was real, but the NRO identified potentially valuable imagery and diagnostic information,
        while the Navy considered the funding probably adequate.
    rejected:
      O2: Deferring before authorizing support was not chosen because the NRO sought to proceed with Navy and Scripps assistance
        and the Navy was willing to help.
      O3: Declining support was not chosen because potentially valuable imagery and information about the failure justified
        pursuing recovery despite uncertain success.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The contemplated support could no longer be funded adequately without displacing a more important requirement.
      then: O2
      why: The resource case for proceeding would weaken, making further planning or reconsideration preferable.
    - id: flip2
      if: There were reliable grounds to conclude that the vehicle could not be located and neither imagery nor useful failure
        information could be recovered.
      then: O3
      why: The expected benefits that supported pursuing recovery would no longer be available.
    would_not_change:
    - id: noflip1
      if: Recovery remained uncertain because locating the vehicle was difficult.
      why: Uncertainty was part of the stated assessment, but did not by itself prevent the NRO from pursuing recovery.
    watch_for:
    - id: watch1
      what: Whether the vehicle can be located.
      favors:
      - O2
      why: The effort's success depended on locating the vehicle; lack of progress on that condition would support reassessing
        continued commitment.
  lesson: When a recovery effort offers potentially substantial mission value and the support is available at a funding level
    considered adequate, uncertainty alone need not justify abandoning it. Make clear that the expected benefits are conditional,
    and revisit the decision if the conditions on which success depends prove unattainable.
  limits: This reasoning applies to the stated salvage decision and its uncertain but potentially valuable returns. It does
    not establish that recovery would succeed, that the film survived, or that the same balance applies where costs, risks,
    or available benefits differ.
  library:
    domain: operational-command
    family: CORPUS-NX-b0d66bf3
    source: https://www.cia.gov/static/ebe9fc2c883aa1e90651116bc996b52c/An-Underwater-Ice-Station-Zebra.pdf
    episode_focus: The decision was whether to pursue recovery with Navy and Scripps support or leave the vehicle unrecovered.
      The NRO cited the chance that valuable imagery survived and the possibility of learning more about the parachute failure;
      exclude the technical search and recovery methods, which the passage does not make part of this policy choice.
    cues:
