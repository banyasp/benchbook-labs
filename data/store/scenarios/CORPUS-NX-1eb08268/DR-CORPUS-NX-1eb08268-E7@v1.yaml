case:
  id: DR-CORPUS-NX-1eb08268-E7@v1
  title: Urgency in the Cao-Bac-Lang Campaign
  status: draft
  setting: Cao-Bac-Lang campaign, 5 October 1950, Campaign CP
  decider: The Campaign CP
  agent: The Campaign CP
  agent_role: decide
  situation: The campaign had been underway since fighting began at Dong Khe on 16 September. Command guidance characterized
    the campaign as very important and called for victory. One enemy force was assessed as seeking to join another, while
    the other was assessed as potentially moving to make that connection. A directive was issued at 2330 on 5 October with
    the highest stated precedence and was signed by the campaign commander and concurrent political commissar. The Campaign
    CP faced a time-sensitive command choice while the possible linkup remained an assessed concern.
  question: What should the Campaign CP do about the time-sensitive campaign decision while two enemy forces may join?
  options:
    O1:
      do: The Campaign CP declines immediate campaign action under the directive.
      move: act
      irreversible: false
    O2:
      do: The Campaign CP authorizes immediate campaign action under the directive.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Command guidance characterized the Cao-Bac-Lang campaign as very important.
  - id: F2
    kind: situation
    status: confirmed
    fact: The guidance called for the battle to be won.
  - id: F3
    kind: situation
    status: confirmed
    fact: The battle at Dong Khe began on 16 September.
  - id: F4
    kind: intelligence
    status: assessed
    fact: One enemy group was assessed to be in the campaign area.
  - id: F5
    kind: intelligence
    status: assessed
    fact: That group was assessed as seeking to connect with the other group.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The other group was assessed as potentially moving to connect with the first and fight alongside it.
  - id: F7
    kind: authority
    status: confirmed
    fact: A campaign directive was issued at 2330 on 5 October 1950.
  - id: F8
    kind: authority
    status: confirmed
    fact: The directive carried the highest stated precedence.
  - id: F9
    kind: authority
    status: confirmed
    fact: The directive was signed by the campaign commander and concurrent political commissar.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The campaign was characterized as very important, and the guidance called for victory; the Campaign CP treated achieving
      that purpose as requiring action on the time-sensitive decision.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The assessed possibility that the two enemy forces would connect made timing material. The Campaign CP's stated reason
      was to act before that connection.
  - id: C3
    facts:
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The directive came from the campaign commander and concurrent political commissar, carried the highest stated precedence,
      and expressed the Campaign CP's decision.
  reasoning:
    read: The Campaign CP faced an assessed, time-sensitive risk that the two enemy forces could join, not a certainty that
      they would. The trap in declining action is to let that uncertainty obscure the shrinking opportunity to act before
      a linkup.
    weighing: The source gives weight to the campaign's importance and the guidance to win, but its stated urgency turns on
      the assessed possibility of a linkup. The Campaign CP chose to act before that could occur; the balance depends on the
      connection remaining a live concern. The highest-precedence directive, signed by the campaign commander and concurrent
      political commissar, supports that choice.
    tradecraft: Carry out the authorized decision promptly, keep the decision record focused on the assessed timing concern
      and the directive's authority, and update the decision if the underlying assessment changes.
    uncertainty: Whether the forces would connect was an assessment, not a confirmed event. The source nevertheless treats
      the possibility and timing as sufficient to warrant immediate action.
    handoff: The Campaign CP made the decision under a directive signed by the campaign commander and concurrent political
      commissar; the source does not indicate that the choice was referred elsewhere.
    tempting_wrong:
      option: O1
      pull: Declining immediate action could seem prudent because a linkup was only assessed as possible.
      why_wrong: The Campaign CP's stated judgment was that delay could forfeit the opportunity to act before the forces connected.
    rejected:
      O1: The Campaign CP did not decline immediate action because it judged that the assessed linkup risk made timing important.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable reassessment removed the possibility that the two forces could connect in the relevant period.
      then: O1
      why: The stated urgency for immediate action depended on acting before the assessed connection; without that timing
        concern, the source's decisive reason would no longer apply.
    would_not_change:
    - id: noflip1
      if: The possibility of a linkup remains assessed rather than confirmed.
      why: 'That uncertainty alone would not reverse the choice: the Campaign CP acted on an assessed possibility because
        the timing mattered.'
    watch_for:
    - id: watch1
      what: Whether the assessed possibility and timing of the forces connecting remain current.
      favors:
      - O2
      why: The source's urgency rests on acting before a possible connection.
  lesson: When a command decision turns on a time-sensitive assessed risk, uncertainty does not by itself require delay. Weigh
    the importance of the mission and the opportunity to act against whether the risk and its timing remain credible.
  limits: This reasoning applies to the source's assessed linkup concern and its stated directive, not to other missions or
    legal standards. It does not establish that urgency alone warrants action when authority or the underlying assessment
    is absent.
