case:
  id: DR-CORPUS-NX-1eb08268-E3@v1
  title: Nam Bo Resistance Decision
  status: draft
  setting: Nam Bo, 25 September 1945, Nam Bo Sector Committee
  decider: The Nam Bo Sector Committee
  agent: The Nam Bo Sector Committee
  agent_role: decide
  situation: On 23 September 1945, French colonialists, aided by the British, opened fire in Nam Bo. French colonialists occupied
    Nam Bo. On 25 September 1945, the Nam Bo Sector Committee faced essential matters concerning the sector. The immediate
    policy question was whether the sector would resist the French colonialists.
  question: What should the Nam Bo Sector Committee do about whether to resist the French colonialists in Nam Bo?
  options:
    O1:
      do: The Nam Bo Sector Committee would resist the French colonialists in Nam Bo.
      move: act
      irreversible: false
    O2:
      do: The Nam Bo Sector Committee would acquiesce to the French colonialists in Nam Bo.
      move: act
      irreversible: false
    O3:
      do: The Nam Bo Sector Committee would ask the Central Party for direction before choosing a course.
      move: ask
      irreversible: false
      to: the Central Party
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: French colonialists opened fire in Nam Bo on 23 September 1945.
  - id: F2
    kind: situation
    status: confirmed
    fact: The British aided the French colonialists.
  - id: F3
    kind: situation
    status: confirmed
    fact: French colonialists occupied Nam Bo.
  - id: F4
    kind: situation
    status: confirmed
    fact: The opening fire occurred in Nam Bo.
  - id: F5
    kind: situation
    status: confirmed
    fact: The occupation occurred on 23 September 1945.
  - id: F6
    kind: situation
    status: confirmed
    fact: On 25 September 1945, the Nam Bo Sector Committee addressed essential matters concerning the sector.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: French colonialists had opened fire in Nam Bo when the Sector Committee determined to resist. The excerpt records
      this context but does not spell out the Committee’s reasoning connecting it to the decision.
  - id: C2
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: French colonialists had occupied Nam Bo. The Committee’s decision to resist is recorded in that setting, although
      the excerpt gives no fuller account of the rationale.
  reasoning:
    read: The recorded decision is resistance following French opening fire and occupation of Nam Bo. The trap is to supply
      a legal test or detailed policy argument that the excerpt does not provide; it records the decision and its context,
      not a developed justification.
    weighing: The opening fire and occupation are the only stated circumstances accompanying the Committee’s decision, and
      both favor O1 as the outcome the Committee selected. The Committee determined to resist before Central Party agreed
      with its resolution. The balance depends on that limited record; it does not establish a broader rule that resistance
      is always warranted in response to occupation.
    tradecraft: Keep the decision record to the Committee’s choice, the stated circumstances, and the fact and sequence of
      Central Party’s agreement. Do not imply that the excerpt supplies an unstated legal rationale or implementation details.
    uncertainty: The excerpt does not explain the Committee’s full reasoning, identify a legal standard, or compare resistance
      with acquiescence or deferral. Central Party’s agreement is recorded, but the excerpt does not describe it as a prerequisite
      to the Committee’s decision.
    handoff: The Sector Committee made the decision; Central Party subsequently agreed with its resolution. The excerpt does
      not establish that the Committee needed to refer the choice for prior direction.
    tempting_wrong:
      option: O3
      pull: Seeking Central Party direction could appear prudent in a consequential policy decision.
      why_wrong: The recorded sequence is that the Committee determined to resist and Central Party later agreed; the excerpt
        does not say the Committee deferred its choice.
    rejected:
      O2: The Committee’s recorded determination was to resist in the setting of French opening fire and occupation, not to
        acquiesce.
      O3: The Committee determined to resist before Central Party’s subsequent agreement, rather than asking for direction
        before choosing.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Committee faced neither the opening fire nor the occupation, with no other reason for resistance established.
      then: O3
      why: The excerpt’s stated context for the resistance decision would be absent; seeking direction would be a cautious
        alternative, though the source does not state this counterfactual.
    would_not_change:
    - id: noflip1
      if: Central Party’s subsequent agreement were absent, but no other facts or reasons changed.
      why: The excerpt records the Sector Committee’s own determination before Central Party’s agreement, so the missing later
        agreement alone would not alter the recorded choice.
    watch_for:
    - id: watch1
      what: Whether additional decision-level evidence gives a fuller account of the Committee’s reasons for resistance.
      favors:
      - O1
      why: The excerpt records the outcome and surrounding events but not the Committee’s full rationale.
  lesson: 'State only the rationale the record supports: here, resistance was chosen in the context of opening fire and occupation.
    Do not turn a reported outcome into a detailed legal or strategic rule when the source gives no such analysis.'
  limits: This reasoning is limited to the Committee’s recorded decision and the sparse context in the excerpt. It does not
    establish a legal standard for resistance, address other available evidence, or assess how resistance was to be carried
    out.
