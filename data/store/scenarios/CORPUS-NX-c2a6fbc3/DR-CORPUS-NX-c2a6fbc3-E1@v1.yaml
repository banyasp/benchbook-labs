case:
  id: DR-CORPUS-NX-c2a6fbc3-E1@v1
  title: Remain or Move the Defense
  status: draft
  setting: At the C Company defense after the position was compromised; 112 IN.
  decider: 112 IN
  agent: 112 IN
  agent_role: decide
  situation: The OPFOR had compromised the position. The position overlooked a key avenue of approach east of the battalion's
    combat service and support. Moving the defense north would expose a valuable seam to the OPFOR, and moving it south would
    expose a valuable seam to the OPFOR. C Company had re-established local security.
  question: What should 112 IN do with the defense after the position was compromised?
  options:
    O1:
      do: 112 IN keeps the defense in place.
      move: act
      irreversible: false
    O2:
      do: 112 IN moves the defense from its position.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The OPFOR had compromised the position.
  - id: F2
    kind: situation
    status: confirmed
    fact: The position overwatched a key avenue of approach.
  - id: F3
    kind: situation
    status: confirmed
    fact: The key avenue of approach was east of the battalion's combat service and support.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Moving the defense north would expose a valuable seam to the OPFOR.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Moving the defense south would expose a valuable seam to the OPFOR.
  - id: F6
    kind: situation
    status: confirmed
    fact: C Company re-established local security.
  considerations:
  - id: C1
    facts:
    - F1
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: The position had been compromised, which weighs against simply remaining there, although 112 IN chose to stay despite
      that condition.
  - id: C2
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The position overwatched a key avenue of approach east of the battalion's combat service and support, a stated reason
      for retaining it.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Moving either north or south was assessed to expose a valuable seam to the OPFOR, making relocation costly to the
      position's defensive purpose.
  reasoning:
    read: 'The position was compromised, but C Company had re-established local security. The decision was not simply whether
      to leave a compromised position: remaining preserved overwatch of a key avenue, while moving north or south was assessed
      to expose a valuable seam.'
    weighing: The compromise weighs toward moving, but 112 IN judged that the position's value over the key avenue and the
      seam exposure expected from either direction outweighed that concern. The balance depends on those operational assessments
      remaining valid.
    tradecraft: Record the reasons for retaining the position and the assessments about the avenue and the seams; revisit
      the decision if those conditions materially change.
    uncertainty: The source gives no further detail about the likelihood or duration of the compromise, or the basis and confidence
      of the seam assessments. It does establish that local security had been re-established.
    handoff: 112 IN is identified as the deciding authority. The source gives no indication that another authority was involved
      or that referral was required; recording the basis would support later review.
    tempting_wrong:
      option: O2
      pull: The position was compromised, so moving may seem to be the immediate response.
      why_wrong: That response would discount the stated value of the avenue overwatch and the assessed seam exposure from
        moving.
    rejected:
      O2: 112 IN did not move the defense because the position overwatched a key avenue and moving north or south was assessed
        to expose a valuable seam.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The position no longer provided meaningful overwatch of the key avenue and a move no longer exposed a valuable seam.
      then: O2
      why: The stated reasons for retaining the defense would no longer support staying, leaving the compromise as a reason
        to move.
    would_not_change:
    - id: noflip1
      if: The position remained compromised while it continued to overwatch the key avenue and either direction of movement
        still exposed a valuable seam.
      why: Those are the conditions underlying 112 IN's stated choice to remain despite the compromise.
    watch_for:
    - id: watch1
      what: Whether the assessment that moving north or south would expose a valuable seam remains current.
      favors:
      - O1
      - O2
      why: A changed assessment could alter the stated cost of moving and therefore the balance between staying and leaving.
  lesson: A compromised position need not automatically be abandoned when it retains important mission value and available
    moves carry significant costs. Reassess the decision if the position's value or the risks of moving change.
  limits: This reasoning applies to the stated choice between remaining and moving north or south under these assessed conditions.
    It does not establish a general rule for compromised positions or address other available courses of action.
