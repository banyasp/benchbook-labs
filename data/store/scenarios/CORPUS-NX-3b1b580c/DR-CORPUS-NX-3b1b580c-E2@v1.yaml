        O1: 10
        O3: 12
      real_option: O1
      real_to_mean_other_length: 0.83
      real_is_longest: false
      moves:
        O2: ask
        O1: act
        O3: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
        O3: false
    equities: pilot2
