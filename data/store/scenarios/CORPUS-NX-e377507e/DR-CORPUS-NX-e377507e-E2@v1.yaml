case:
  id: DR-CORPUS-NX-e377507e-E2@v1
  title: The Mexico Inquiry and CIA-FBI Boundary
  status: draft
  setting: The White House, June 23, during an executive-branch discussion involving the CIA and FBI.
  decider: The Deputy Director of Central Intelligence
  agent: The Deputy Director of Central Intelligence
  agent_role: decide
  situation: At a White House meeting on June 23, the Deputy Director was asked by the President's chief of staff to contact
    the Acting FBI Director. The chief of staff conveyed the President's wish that the five arrested suspects be treated as
    sufficient and that the inquiry, particularly in Mexico, not be pushed. The discussion included concern that continued
    inquiry in Mexico could intersect with CIA operations and bring up the Bay of Pigs. The CIA Director had said there was
    no CIA connection to Watergate, while the Mexico leads and any possible CIA interests there remained unclear to him. An
    existing FBI-CIA delimitation agreement governed potential overlap between the agencies.
  question: What should the Deputy Director do in responding to the White House request and communicating with the Acting
    FBI Director about the Mexico inquiry?
  options:
    O1:
      do: The Deputy Director asks the Acting FBI Director to limit the Mexico inquiry and explains the CIA-FBI boundary.
      move: act
      irreversible: false
    O2:
      do: The Deputy Director explains the CIA-FBI boundary to the Acting FBI Director without asking for any limit on the
        inquiry.
      move: partial
      irreversible: false
      to: The Acting FBI Director
    O3:
      do: The Deputy Director asks the Acting FBI Director to permit the Mexico inquiry to continue and explains the CIA-FBI
        boundary.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The chief of staff said the Watergate affair was causing trouble and that the FBI investigation could make matters
      worse.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The CIA Director said there was no CIA connection to the affair and that he had relayed the same message to the
      Acting FBI Director the previous day.
  - id: F3
    kind: authority
    status: confirmed
    fact: The chief of staff conveyed the President's wish that the Deputy Director tell the Acting FBI Director the five
      arrested suspects should be sufficient and that the inquiry should not be pushed, especially in Mexico.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The chief of staff said that if the Mexico investigation were not stopped, it could bring up the Bay of Pigs matter.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Deputy Director had been in the position for six weeks, and the CIA Director acknowledged that the President
      had been instrumental in his appointment.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The CIA Director said he did not understand what was involved in the Mexico inquiry or how it related to the Watergate
      burglary.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The CIA Director considered it possible that an FBI investigation in Mexico could encounter CIA interests there,
      although he lacked information about any such matter.
  - id: F8
    kind: situation
    status: confirmed
    fact: An FBI-CIA delimitation agreement governed potential overlap between the agencies' activities.
  considerations:
  - id: C1
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: strong
    why: The CIA Director considered it possible that an FBI inquiry in Mexico could encounter CIA interests, even though
      he had no information establishing that risk. The existing delimitation agreement supplied a legitimate basis to explain
      the agencies' boundary and seek a limited accommodation.
  - id: C2
    facts:
    - F2
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    - O3
    weight: strong
    why: The CIA Director had said there was no CIA connection to Watergate and did not understand the Mexico leads. A possible
      CIA interest was not evidence that the investigation actually threatened an operation, so uncertainty counseled against
      treating a broad restriction as established necessity.
  - id: C3
    facts:
    - F1
    - F3
    - F4
    equity: complicity_risk
    favors:
    - O2
    - O3
    weight: strong
    why: The request was linked to embarrassment and concern that the inquiry could worsen the Watergate problem, with the
      Bay of Pigs raised as leverage. Those grounds risked turning a legitimate agency-boundary warning into assistance in
      limiting an investigation for political reasons.
  - id: C4
    facts:
    - F5
    equity: impartiality
    favors:
    - O2
    - O3
    weight: weak
    why: The Deputy Director was newly appointed, and the CIA Director recognized the President's role in his appointment.
      That context could make compliance feel expected, but it is not a sound independent reason to restrict an investigation.
  reasoning:
    read: The request combined a potentially legitimate concern about CIA-FBI overlap with a request to reduce scrutiny because
      the Watergate inquiry was embarrassing and might revive the Bay of Pigs. The trap was to treat uncertainty about possible
      CIA interests as proof that the Mexico inquiry should be stopped, or to let the White House's political concern determine
      the investigative scope.
    weighing: The Deputy Director's stated rationale for O1 was that an investigation in Mexico might encounter CIA operations
      and that the FBI-CIA boundary should be respected. That supports a limited request to taper the inquiry, not a claim
      that a CIA connection to Watergate had been established; the CIA Director had said there was none and did not understand
      the Mexico leads. The political rationale and the lack of specific information weigh against a broader halt. The account
      also records that the intervention delayed the Mexico inquiry by almost two weeks, underscoring the cost of limiting
      it.
    tradecraft: Keep any request narrowly tied to the existing agency boundary and possible CIA interests, and distinguish
      that rationale explicitly from the White House's desire to reduce embarrassment. Record what was requested, what information
      supports the boundary concern, and that no CIA connection to Watergate was established.
    uncertainty: The CIA Director lacked information about the Mexico leads and any CIA interests they might touch. The possibility
      of overlap justified caution, but did not establish that the FBI inquiry was endangering an operation or that its political
      implications were a proper reason to restrict it.
    handoff: The Deputy Director should coordinate the boundary issue with the CIA Director and communicate it to the Acting
      FBI Director, who retains responsibility for the FBI inquiry. The White House request should not substitute for an agency-based
      explanation of any limit.
    tempting_wrong:
      option: O3
      pull: Allowing the inquiry to proceed without asking for a limit avoids participating in a politically motivated effort
        to contain Watergate.
      why_wrong: The Deputy Director's stated concern was that an FBI inquiry in Mexico could encounter CIA interests, and
        an existing delimitation agreement governed overlap; O3 would not seek the limited accommodation the source records
        him asking for.
    rejected:
      O2: It would communicate the CIA-FBI boundary but omit the limited request to taper the inquiry that the Deputy Director
        made because he considered possible CIA overlap prudent to address.
      O3: It would permit the Mexico inquiry without the limited request that the Deputy Director made in light of possible
        CIA interests and the existing agency boundary.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable assessment established that no CIA interests were at risk and that the request to taper the inquiry rested
        only on political embarrassment.
      then: O3
      why: Without a concrete agency-boundary concern, the justification for asking the FBI to limit its inquiry would fall
        away.
    would_not_change:
    - id: noflip1
      if: The CIA Director's statement that there was no CIA connection to Watergate remained the only information about the
        affair.
      why: That statement would not resolve the separate uncertainty about possible CIA interests that an FBI inquiry in Mexico
        might encounter.
    watch_for:
    - id: watch1
      what: Whether the FBI inquiry actually appeared likely to encounter CIA operations, rather than merely having that possibility
        raised.
      favors:
      - O1
      - O2
      why: A specific overlap concern would strengthen the case for a boundary warning or limited accommodation; absent such
        a concern, restricting the inquiry would be harder to justify.
  lesson: A possible national-security or agency-boundary concern can justify a narrowly tailored warning, but uncertainty
    is not proof that an investigation should be curtailed. Keep political embarrassment separate from the operational rationale,
    and make any limit proportionate to the actual boundary risk.
  limits: This reasoning addresses a request to limit an FBI inquiry amid uncertain CIA overlap and an existing interagency
    agreement. It does not establish a general rule for resolving competing investigative authorities or for cases where a
    specific, substantiated security risk requires a different response.
