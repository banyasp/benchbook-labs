case:
  id: DR-CORPUS-NX-0dbf517b-E1@v1
  title: Planning Scalable Evacuation Options During COVID-19
  status: draft
  setting: African countries during the COVID-19 crisis; USARAF.
  decider: USARAF planners
  agent: USARAF planners
  agent_role: decide
  situation: During COVID-19, USARAF was planning for possible deterioration at U.S. embassies and consulates in African countries.
    In East Africa, food shortages associated with locust damage and COVID-19 restrictions contributed to instability and
    civil disturbance. Evacuations of American citizens from some installations were a possibility, while a large evacuation
    in one West African country could involve more than 125,000 people and significant time-and-distance complications. The
    potential size, geography, and complexity of evacuations varied across countries. USARAF had to determine what NEO planning
    framework to prepare before any deterioration required a response.
  question: What should USARAF planners do about the NEO planning framework for possible deterioration of local conditions
    during the COVID-19 crisis?
  options:
    O1:
      do: USARAF planners reject a scalable NEO framework and adopt one standard-size NEO plan.
      move: act
      irreversible: false
    O2:
      do: USARAF planners adopt a scalable NEO framework with small, medium, large, and large-complex plans.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: USARAF developed differently sized NEO options to scale a response to the size and complexity of an evacuation if
      conditions at U.S. embassies or consulates deteriorated during COVID-19.
  - id: F2
    kind: situation
    status: confirmed
    fact: The planned NEO size categories were small for fewer than 10,000 evacuees, medium for more than 10,000 and fewer
      than 100,000, and large for more than 100,000.
  - id: F3
    kind: situation
    status: confirmed
    fact: A large-complex NEO option was available for countries with great distances between several cities.
  - id: F4
    kind: capability
    status: confirmed
    fact: USARAF examined embassy and consulate Emergency Action Plans in some remote countries during the COVID-19 crisis.
  - id: F5
    kind: situation
    status: assessed
    fact: In East Africa, locust damage caused food shortages, and COVID-19 restrictions contributed to instability and civil
      disturbance.
  - id: F6
    kind: situation
    status: assessed
    fact: Evacuation of American citizens from some U.S. installations was a possible response to the instability.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A large NEO in one West African country could involve more than 125,000 evacuees, with time-and-distance complications.
  - id: F8
    kind: capability
    status: confirmed
    fact: A large NEO would require USARAF to request additional forces, support, and funding.
  - id: F9
    kind: intelligence
    status: confirmed
    fact: Planners examined all 53 countries and studied instability factors, including increasing COVID-19 spread.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Different evacuation sizes call for options that can scale with the operation; the small, medium, and large categories
      let the response match the anticipated number of evacuees.
  - id: C2
    facts:
    - F3
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: A possible evacuation exceeding 125,000 people, combined with significant time-and-distance complications, supports
      having a large-complex option rather than assuming one standard plan will fit.
  - id: C3
    facts:
    - F5
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Food shortages and COVID-19 restrictions contributed to instability, and evacuation was a possible response. Preparing
      scalable options in advance addresses the possibility that conditions may deteriorate.
  - id: C4
    facts:
    - F4
    - F8
    - F9
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Reviewing emergency plans and instability across countries supports planning for varied circumstances; identifying
      that a large evacuation would require additional forces, support, and funding also makes its resource implications visible
      in advance.
  reasoning:
    read: This is a contingency-planning choice before any deterioration requires a response, not a choice to execute an evacuation
      now. The trap is treating a single standard-size plan as adequate despite differences in potential evacuee numbers,
      geography, and complexity.
    weighing: 'The reasons favor a scalable framework: it can match the size and complexity of a possible evacuation {C1}
      and account for the unusually large, geographically complicated case {C2}. Instability made evacuation a real planning
      possibility {C3}, while country reviews and recognition of additional resource needs support preparing options rather
      than assuming uniform conditions {C4}. The balance depends on continued variation in the plausible scale and geography
      of evacuations; the source gives no reason to prefer one standard-size plan.'
    tradecraft: Keep the planning basis and assumptions for each scale clear, review them as country conditions change, and
      identify resource dependencies for senior decision-makers. Keep this at the framework level; the choice does not require
      deciding how an evacuation would be executed.
    uncertainty: The timing and scale of any deterioration or evacuation were uncertain. The possibility of more than 125,000
      evacuees and the differing conditions across countries make a single forecast unreliable as the sole planning basis.
    handoff: USARAF planners make the planning choice and provide mission analysis to AFRICOM. AFRICOM should be involved
      where the analysis or a large-scale option raises force, support, or funding requirements.
    tempting_wrong:
      option: O1
      pull: One standard-size plan may appear simpler to prepare and maintain before an evacuation is certain.
      why_wrong: It would not address the documented variation in evacuee numbers and geography, or the need to scale a response
        to the size and complexity of the situation.
    rejected:
      O1: A single standard-size plan was not chosen because the possible evacuations varied substantially in size, geography,
        and complexity.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Planning assessments instead showed that likely evacuations would be sufficiently uniform in size and geography
        for one standard plan to meet the need.
      then: O1
      why: The main reason for multiple options is to match differing evacuation sizes and complexities; if that variation
        were absent, the case for a scalable framework would be reduced.
    would_not_change:
    - id: noflip1
      if: No evacuation had yet been ordered or local conditions had not yet deteriorated.
      why: The decision concerns preparation for possible deterioration, so the absence of an immediate trigger would not
        by itself remove the reason to plan in advance.
    watch_for:
    - id: watch1
      what: Changes in instability, COVID-19 spread, or country-specific evacuation assessments that alter the plausible scale
        or geographic complexity of a response.
      favors:
      - O2
      why: Those changes could affect which scalable option is needed and whether existing assumptions remain suitable.
  lesson: When plausible contingencies differ materially in scale and complexity, prepare options that can be matched to those
    differences rather than relying on one standard plan. Reassess the planning basis as conditions change, while distinguishing
    preparation from a decision to execute.
  limits: This reasoning concerns advance NEO planning during the COVID-19 crisis and does not decide whether or when any
    evacuation should occur. It does not address the operational execution of an evacuation.
