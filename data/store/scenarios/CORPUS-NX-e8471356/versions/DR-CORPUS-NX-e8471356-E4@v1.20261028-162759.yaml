case:
  id: DR-CORPUS-NX-e8471356-E4@v1
  title: Presidential Choice on German Reunification
  status: draft
  setting: The White House, 31 May 1990, during the second Soviet-American summit
  decider: The President
  agent: The President
  agent_role: decide
  situation: At the White House on 31 May 1990, during the second Soviet-American summit, the President faced a diplomatic
    choice about U.S. policy toward German reunification. Over the preceding months, the President had pressed the Soviet
    leader on the Germans' right to decide their future. At the summit, the President asked whether the Germans had the right
    to choose their own alliance, and the Soviet leader agreed in principle that they had the right to decide their future.
    Perestroika and the collapse of the East German economy were factors in the broader setting. The President was determined
    to make German unity one of the crowning achievements of the presidency.
  question: What should the President do about U.S. support for German reunification and the Germans' choice of alliance?
  options:
    O1:
      do: The President should approve U.S. support for German reunification and the Germans' choice of alliance.
      move: act
      irreversible: false
    O2:
      do: The President should condition U.S. support for German reunification on further agreement about the Germans' choice
        of alliance.
      move: partial
      irreversible: false
    O3:
      do: The President should reject U.S. support for German reunification and the Germans' choice of alliance.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision point occurred at the White House on 31 May 1990 during the second Soviet-American summit.
  - id: F2
    kind: situation
    status: assessed
    fact: The President had prodded the Soviet leader over the preceding months on the Germans' right to decide their future.
  - id: F3
    kind: situation
    status: confirmed
    fact: The President asked whether the Germans had the right to choose their own alliance.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Soviet leader unexpectedly agreed in principle that the Germans had the right to decide their own future.
  - id: F5
    kind: situation
    status: assessed
    fact: Perestroika and the collapse of the East German economy were identified as factors in German unification.
  - id: F6
    kind: situation
    status: assessed
    fact: The President was determined to make German unity one of the crowning achievements of the presidency.
  considerations:
  - id: C1
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The President was determined to make German unity a crowning achievement of his presidency; unequivocal U.S. support
      directly advanced that stated policy objective.
  - id: C2
    facts:
    - F2
    - F3
    equity: norm_reciprocity
    favors:
    - O1
    weight: strong
    why: The President had pressed for the Germans' right to decide their future and directly asked whether they could choose
      their alliance. Supporting reunification without conditioning that choice was consistent with this demonstrated policy
      commitment.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Soviet leader's agreement in principle, alongside perestroika and the collapse of the East German economy, formed
      a setting in which unification could proceed. These factors support the feasibility of the choice, but are not presented
      as the President's central reason.
  reasoning:
    read: 'This was a diplomatic choice about U.S. policy, not a decision by the President to wait for the Soviet leader to
      settle every aspect of unification. The trap is to treat the unexpected agreement in principle as the origin of U.S.
      support: the President had already been pressing the Germans'' right to decide, and his stated aim was to make unity
      a major achievement.'
    weighing: The strongest reasons favoring {O1} are the President's determination to achieve German unity and his sustained
      commitment to the Germans' choice of alliance {C1} {C2}. The Soviet agreement and broader political-economic setting
      made the moment more practicable, but are contextual rather than the principal justification {C3}. The balance depends
      on taking the President's expressed policy objective and support for German choice as the governing considerations,
      without mistaking agreement in principle for a completed settlement.
    tradecraft: State the policy decision clearly and record that support for reunification includes the Germans' choice of
      alliance. Keep that endorsement distinct from any later diplomatic arrangements needed to implement it.
    uncertainty: The account establishes the President's policy commitment and an agreement in principle, but does not set
      out the legal terms, implementation arrangements, or all relevant diplomatic risks. The recommendation is limited to
      the stated choice about U.S. support.
    handoff: The President makes the policy choice. Consulting the relevant diplomatic advisers on implementation would be
      prudent, but the account does not make that consultation a condition of the decision.
    tempting_wrong:
      option: O2
      pull: The Soviet leader agreed only in principle, which may make conditional support seem safer than an unequivocal
        commitment.
      why_wrong: That caution gives the incomplete form of the Soviet agreement more weight than the President's already-established
        policy commitment and stated determination to achieve unity.
    rejected:
      O2: The President did not hold back or condition support, because his sustained commitment was to German unity and the
        Germans' right to choose their alliance.
      O3: Rejecting support would have contradicted the President's stated determination to make German unity a major achievement.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible information showed that the Germans could not in fact decide their own future or choose their alliance.
      then: O2
      why: The stated rationale for supporting the choice would no longer match the circumstances; the President could condition
        support while seeking clarity about whether that choice was genuinely available.
    would_not_change:
    - id: noflip1
      if: The Soviet leader's delegation reacted negatively to his agreement in principle.
      why: Delegation reaction alone would not displace the President's stated commitment to German unity and the Germans'
        choice; the account describes internal opposition after the concession without presenting it as changing U.S. policy.
    watch_for:
    - id: watch1
      what: Whether the Soviet agreement in principle develops into agreement on the terms of reunification and NATO membership.
      favors:
      - O1
      why: The account describes a later removal of conditions on reunification and NATO membership, which would make the
        diplomatic path for the President's chosen policy clearer.
  lesson: When a leader has stated a clear policy objective and has consistently pressed for the affected people's choice,
    do not let an unexpected diplomatic opening become the only explanation for support. Distinguish a decision to endorse
    the policy from the later work of negotiating its terms.
  limits: This reasoning concerns the President's diplomatic choice to support German reunification and alliance choice. It
    does not establish legal rules for self-determination or resolve the terms of unification, and it does not assess the
    Soviet leader's separate reasons for agreeing.
