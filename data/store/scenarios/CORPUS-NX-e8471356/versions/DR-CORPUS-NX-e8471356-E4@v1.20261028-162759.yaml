    domain: natsec-other
    family: CORPUS-NX-e8471356
    source: https://www.cia.gov/resources/csi/static/76b72f52edd14dd860149ece9e921f46/At-Cold-Wars-End1-Front-Matter-Foreword-Preface-Chronology-Appendix.pdf
    episode_focus: The decision point is the U.S. president’s choice to support reunification, including the alliance question,
      rather than hold back or condition support. Keep the focus on the diplomatic choice and its stated importance to U.S.
      policy; exclude the Soviet leader’s separate decision to accept it, whose reasons are not sufficiently established here.
    cues:
