case:
  id: DR-CORPUS-NX-12664fae-E19@v1
  title: Conscripts in the Special Military Operation
  status: draft
  setting: Russia, early Special Military Operation, Russian national leadership
  decider: The Russian President
  agent: The Russian President
  agent_role: decide
  situation: During the early Special Military Operation, Russian leadership faced a choice about whether conscripts would
    serve in combat or whether combat service would be limited to volunteers who signed contracts. Conscription was mandatory
    for male Russian citizens ages 18 to 30, while contract service was voluntary. Russian law restricted conscripts from
    serving abroad absent a declaration of war, subject to a training condition. Some units had already used conscripts in
    combat despite that restriction, and their participation had generated public-relations costs. The Ministry of Defense
    claimed conscripts sent on short notice were not ready, while the episode was also assessed as having some operational
    and tactical value.
  question: What should the Russian President do about conscripts' combat service in the SMO?
  options:
    O1:
      do: The Russian President should prohibit conscripts and authorize contract volunteers for combat service in the SMO.
      move: act
      irreversible: false
    O2:
      do: The Russian President should authorize conscripts alongside contract volunteers for combat service in the SMO.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A conscript is an 18- to 30-year-old male Russian citizen required to complete mandatory military service.
  - id: F2
    kind: authority
    status: confirmed
    fact: Russian law prohibited conscripts from serving outside Russia absent a declaration of war unless they had at least
      four months of training.
  - id: F3
    kind: situation
    status: confirmed
    fact: Russian culture draws a major distinction between foreign wars and wars to defend the homeland.
  - id: F4
    kind: situation
    status: confirmed
    fact: Some Russian Ground Forces units took conscripts into combat in the early days of the SMO in violation of Russian
      law.
  - id: F5
    kind: situation
    status: assessed
    fact: The participation of conscripts early in the SMO was a major Russian public-relations failure.
  - id: F6
    kind: capability
    status: assessed
    fact: The Russian Ministry of Defense claimed that conscripts sent on short notice were not ready.
  - id: F7
    kind: situation
    status: assessed
    fact: The passage assesses that sending thousands of conscripts might be strategically unsound while still being at least
      a partial operational and tactical success.
  - id: F8
    kind: situation
    status: confirmed
    fact: Contract soldiers voluntarily sign service contracts, and contract service is open to citizens and non-citizens.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Russian law restricted conscripts from serving abroad without a declaration of war unless they had at least four
      months of training, and some units nevertheless took conscripts into combat in violation of that restriction. A blanket
      prohibition avoids repeating that breach.
  - id: C2
    facts:
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The early participation of conscripts was a major public-relations failure. That cost was especially significant
      in a culture that sharply distinguishes foreign wars from wars to defend the homeland.
  - id: C3
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The Ministry of Defense said conscripts sent on short notice were not ready, supporting restraint from exposing them
      to combat before they were prepared.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Sending thousands of conscripts might have been strategically unsound, while their early use was still at least a
      partial operational and tactical success.
  - id: C5
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Contract service provided a volunteer alternative for combat service, and it was open to citizens as well as non-citizens.
  reasoning:
    read: This was a choice between combat service by conscripts and service limited to contract volunteers, not a choice
      between having combat personnel and having none. The trap is to treat some operational and tactical benefit as settling
      the question while overlooking the legal restriction, the readiness concern, and the political cost of sending conscripts
      to a foreign war.
    weighing: The legal restriction and the major public-relations failure weigh strongly against deploying conscripts {C1}
      {C2}; the Ministry of Defense's readiness concern reinforces that course {C3}. The partial operational and tactical
      success counts in favor of deployment, but sending thousands was also potentially strategically unsound {C4}. The balance
      therefore supports limiting combat service to contract volunteers, with the availability of that alternative providing
      some support for O1 {C5}.
    tradecraft: State the prohibition clearly, distinguish conscripts from contract volunteers in implementation, and document
      the legal basis and readiness assessment supporting the decision. Reassess if the governing legal conditions or the
      readiness facts materially change.
    uncertainty: There is no quantified comparison of operational benefit against legal, readiness, and public-relations costs.
      The operational and tactical result was a partial success, while the strategic wisdom of sending thousands remained
      in question.
    handoff: The President should make the policy decision as the national leader, with legal and defense advisers consulted
      on the legal restriction and the Ministry of Defense's readiness assessment.
    tempting_wrong:
      option: O2
      pull: Early conscript participation had some operational and tactical value.
      why_wrong: That partial success does not resolve the legal restriction or the major public-relations failure; the Ministry
        of Defense also said the conscripts sent on short notice were not ready.
    rejected:
      O2: The partial operational and tactical benefit did not outweigh the legal, readiness, strategic, and public-relations
        concerns associated with conscript combat service.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The legal basis for conscript service abroad changed and conscripts were shown to be adequately trained and ready
        for the mission.
      then: O2
      why: Those changes could reduce the legal and readiness concerns central to the choice, making the operational and tactical
        benefit carry more weight.
    would_not_change:
    - id: noflip1
      if: Early conscript participation produced some operational and tactical success.
      why: That success alone would not remove the legal restriction, the readiness concern, or the major public-relations
        cost.
    watch_for:
    - id: watch1
      what: Whether conscripts have completed at least four months of training or a declaration of war changes the applicable
        legal restriction.
      favors:
      - O2
      why: Those are conditions relevant to whether conscripts may serve outside Russia; satisfying the training condition
        would remove that particular legal obstacle, though it would not by itself resolve readiness or policy concerns.
  lesson: Do not let limited operational success alone decide whether to expose conscripts to combat. Apply the legal limits,
    assess readiness, and weigh the public and strategic costs against the availability of a lawful volunteer alternative.
  limits: This reasoning addresses Russian national conscripts in the early SMO and the choice to restrict their combat service.
    It does not address conscripts from occupied Ukrainian territories, whose circumstances are treated differently, or establish
    what policy should apply if the governing law or circumstances change.
