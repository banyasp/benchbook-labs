case:
  id: DR-CORPUS-NX-f955ae67-E5@v1
  title: Opening Near-Complete Health Clinics
  status: draft
  setting: During reconstruction in Iraq; MND-B sector; Corps of Engineers.
  decider: The Corps commander overseeing reconstruction in Iraq
  agent: The Corps commander overseeing reconstruction in Iraq
  agent_role: decide
  situation: The Corps of Engineers was managing a reconstruction contract for 142 primary health centers in Iraq. After two
    years and roughly $200 million, no more than 20 clinics were expected to be completed, and Parsons was expected to leave
    more than 120 clinics averaging two-thirds complete. Auditors regarded the project as a warning for other reconstruction
    efforts due to be completed that year, while the World Health Organization's representative for Iraq said the shortfall
    was damaging expectations and trust. In the MND-B sector, six of 49 clinics were 90–99 percent complete. The Corps commander
    oversaw reconstruction, and whether the Ministry of Health could open, staff, and sustain the clinics was a central concern.
  question: What should the Corps commander do about coalition assistance to open the six near-complete clinics?
  options:
    O1:
      do: The Corps commander asks the Ministry of Health for a readiness commitment before deciding on coalition assistance
        for the six clinics.
      move: ask
      irreversible: false
      to: The Ministry of Health
    O2:
      do: The Corps commander prohibits monitoring and coalition assistance with security and, if needed, construction and
        sustainment for opening the six clinics.
      move: act
      irreversible: false
    O3:
      do: The Corps commander authorizes monitoring and coalition assistance with security and, if needed, construction and
        sustainment for opening the six clinics.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The reconstruction contract covered 142 primary health centers; after two years and roughly $200 million, no more
      than 20 clinics were expected to be completed.
  - id: F2
    kind: situation
    status: confirmed
    fact: Parsons was expected to leave more than 120 clinics that were, on average, two-thirds complete.
  - id: F3
    kind: situation
    status: assessed
    fact: Auditors considered the project a warning for other reconstruction efforts due to be completed that year.
  - id: F4
    kind: situation
    status: assessed
    fact: The World Health Organization's representative for Iraq said the shortfall was shocking and was affecting people's
      expectations and trust.
  - id: F5
    kind: situation
    status: confirmed
    fact: Six of the 49 clinics in the MND-B sector were between 90 and 99 percent complete.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Corps commander was overseeing reconstruction in Iraq.
  - id: F7
    kind: capability
    status: assessed
    fact: The Ministry of Health's ability to open, staff, and sustain the facilities was a concern in the effort to open
      the clinics.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The broad reconstruction failure was already damaging public expectations and trust. Supporting the six near-complete
      clinics offered a concrete way to demonstrate progress rather than leave this failure unaddressed.
  - id: C2
    facts:
    - F5
    equity: critical_services
    favors:
    - O3
    weight: strong
    why: The six clinics were close to completion, and opening them could bring local medical care to areas that lacked it.
      Assistance focused on these facilities could produce a practical benefit despite the much wider contract shortfall.
  - id: C3
    facts:
    - F5
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The Ministry's ability to open, staff, and sustain the clinics was a concern. The commander treated coalition support
      as a way to help get the facilities open while ensuring the Ministry could take on their operation.
  reasoning:
    read: The decision concerned whether to help open six clinics that were nearly complete, not whether to repeat or rescue
      the entire failed 142-clinic contract. The trap is to let that broader failure, or uncertainty about the Ministry's
      capacity, become a reason to leave usable health facilities unopened.
    weighing: The contract's poor results and their effect on public trust made visible progress important {C1}. The six clinics
      were sufficiently near completion to offer a route to local medical care {C2}. The Ministry's capacity remained a real
      concern, but the commander used assistance as a forcing function to help ensure the Ministry could open, staff, and
      sustain the facilities rather than making its readiness a precondition for any assistance {C3}. That balance depends
      on support being directed toward opening these clinics and the Ministry assuming responsibility for their operation.
    tradecraft: Coordinate the assistance needed to open the clinics with the Army Corps and the Ministry, and make the transition
      to Ministry operation part of the effort. Reassess coalition presence once the clinics are operating, especially if
      it creates a security or retribution risk.
    uncertainty: The Ministry's ability to staff and sustain the facilities was not assured at the decision point. The clinics
      later opened, and the Ministry committed to provide staff, security, and essential services, but that later development
      does not remove the uncertainty present when the assistance decision was made.
    handoff: The Corps commander should direct the assistance and coordinate with the Army Corps and the Ministry, whose construction
      and operational responsibilities were central to getting the clinics open and sustaining them.
    tempting_wrong:
      option: O1
      pull: It seems prudent to require a Ministry readiness commitment before providing assistance, given doubts about its
        ability to operate the clinics.
      why_wrong: The commander's stated approach was to use the effort to open the clinics as a forcing function for government
        responsibility, not to make demonstrated readiness a prerequisite for helping.
    rejected:
      O1: A readiness request before deciding was not the chosen approach because the commander used assistance to help ensure
        the Ministry could open, staff, and sustain the clinics.
      O2: Prohibiting assistance would forgo the opportunity to open six nearly complete facilities and address the loss of
        public trust.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Ministry could not credibly commit to operating the clinics even with coalition support.
      then: O1
      why: In that circumstance, obtaining a readiness commitment before deciding would better address the risk of opening
        facilities that could not be operated or sustained.
    - id: flip2
      if: Coalition assistance itself created an unacceptable security or retribution risk at the clinics.
      then: O2
      why: The benefit of opening the clinics would have to be weighed against the risk that coalition assistance would expose
        clinic staff or patients to harm.
    would_not_change:
    - id: noflip1
      if: The wider reconstruction contract remained a severe failure.
      why: That failure alone would not eliminate the distinct opportunity to open six clinics that were already near completion.
    watch_for:
    - id: watch1
      what: Clinic directors and the Ministry ask coalition forces not to visit the facilities because visits could create
        a security or retribution risk.
      favors:
      - O1
      why: That development calls for renewed coordination with the Ministry about how to sustain the clinics while limiting
        risky coalition presence; it does not by itself establish that all opening assistance should be prohibited.
  lesson: When a broad program has failed, assess whether a smaller, near-complete part can still deliver an essential service
    and help restore trust. If partner capacity is uncertain, assistance can be structured to enable and establish partner
    responsibility rather than simply waiting for capacity to be proven.
  limits: This reasoning applies to the six near-complete clinics and does not establish that coalition assistance should
    continue where it creates unacceptable security risks. It also does not resolve how to manage the wider reconstruction
    contract.
