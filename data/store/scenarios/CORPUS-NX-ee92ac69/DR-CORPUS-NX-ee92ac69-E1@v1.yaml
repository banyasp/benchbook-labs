    episode_focus: The decision point is whether to keep the effort limited to Southeast Asia or create a broader historical
      program; the passage says the initial work impressed senior leaders and that the broader program was established. Focus
      on the policy choice to document the service’s history, not on the operations the histories describe.
    cues:
