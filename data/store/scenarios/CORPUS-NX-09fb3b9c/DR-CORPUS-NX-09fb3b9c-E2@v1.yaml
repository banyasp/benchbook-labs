case:
  id: DR-CORPUS-NX-09fb3b9c-E2@v1
  title: Supermicro Supplier Relationship
  status: draft
  setting: Apple Inc., 2015.
  decider: Apple Inc.
  agent: Apple Inc.
  agent_role: decide
  situation: Apple Inc. had purchased motherboards from Supermicro. Bloomberg reported allegations that hardware implants
    were present on Supermicro motherboards, and reported that Apple’s further research confirmed implants on the motherboards
    Apple had purchased. An investigation identified 30 companies, including Apple, as purchasers of motherboards described
    as contaminated. Supermicro denied all allegations. Some security researchers doubted the allegations about the implant’s
    functionality, and the NSA expressed skepticism about the Bloomberg report.
  question: What should Apple Inc. do about sourcing from Supermicro?
  options:
    O1:
      do: Apple should discontinue sourcing from Supermicro.
      move: act
      irreversible: true
    O2:
      do: Apple should continue sourcing from Supermicro.
      move: act
      irreversible: false
    O3:
      do: Apple should ask security researchers for assessment.
      move: ask
      irreversible: false
      to: security researchers
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Bloomberg reported allegations that hardware implants were present on Supermicro motherboards.
  - id: F2
    kind: situation
    status: confirmed
    fact: Apple had purchased motherboards from Supermicro.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Bloomberg reported that Apple’s further research confirmed hardware implants on the motherboards Apple had purchased.
  - id: F4
    kind: intelligence
    status: assessed
    fact: An investigation identified 30 companies, including Apple, as purchasers of motherboards described as contaminated.
  - id: F5
    kind: situation
    status: confirmed
    fact: Supermicro denied all allegations.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Some security researchers expressed doubts about the allegations concerning the implant’s functionality.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The NSA expressed skepticism about the Bloomberg report.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Apple's further research was reported to have confirmed implants on motherboards it had purchased. If that finding
      is accurate, continuing the supplier relationship would leave the reported concern unresolved.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Supermicro denied the allegations, and researchers and the NSA expressed skepticism. Those disagreements counsel
      against treating the allegations as uncontested, but do not themselves disprove Apple's reported research finding.
  - id: C3
    facts:
    - F3
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: The gap between Apple's reported confirmation and the recorded skepticism gives a reason to seek an additional assessment
      before deciding whether to continue sourcing.
  reasoning:
    read: This is a sourcing decision made amid a reported hardware-implant finding, not an uncontested finding of wrongdoing.
      The key tension is Apple's reported confirmation from its own research versus Supermicro's denial and the skepticism
      expressed by researchers and the NSA.
    weighing: The reported confirmation concerning boards Apple purchased supports ending the relationship {C1}. The denials
      and skepticism are relevant counterevidence, and could support continuing or seeking another assessment {C2} {C3}; they
      do not, on the facts given, negate the reported confirmation. Apple severed ties, which is the outcome recorded here.
      The balance depends on whether the reported confirmation is reliable.
    tradecraft: 'Keep the decision and its record at the sourcing level: distinguish Apple''s reported research from Bloomberg''s
      allegations and record the denials and skeptical views rather than presenting the allegation as settled fact. Revisit
      the sourcing decision if credible new evidence materially changes the assessment.'
    uncertainty: The passage does not resolve the disagreement or explain the implants' actual functionality. It reports Apple's
      confirmation while also recording denial and skepticism; the finding should therefore not be characterized as uncontested.
    handoff: Apple is the sourcing decision-maker. Involving security researchers for an assessment would be a reasonable
      way to address the recorded uncertainty, but the passage does not say Apple sought that advice as part of its decision.
    tempting_wrong:
      option: O2
      pull: Continue sourcing because Supermicro denied the allegations and researchers and the NSA expressed skepticism.
      why_wrong: That response would give the disagreement more weight than the reported finding from Apple's own further
        research, without evidence here that the finding was disproved.
    rejected:
      O2: Apple did not continue sourcing; the reported confirmation provided a reason to end the relationship despite the
        recorded disagreement.
      O3: Seeking another assessment could address uncertainty, but it was not the outcome Apple took in the passage.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable subsequent assessment established that Apple's reported confirmation was mistaken.
      then: O2
      why: If the reported confirmation were disproved, the central stated reason supporting discontinuing the relationship
        would be materially weakened.
    would_not_change:
    - id: noflip1
      if: Supermicro continued to deny the allegations and the same skeptical views remained on record, without new evidence
        resolving the reported confirmation.
      why: Those positions are already part of the contested record and do not, by themselves, disprove Apple's reported research
        finding.
    watch_for:
    - id: watch1
      what: A credible new assessment that materially resolves whether implants were present on the motherboards Apple purchased.
      favors:
      - O1
      - O2
      - O3
      why: The balance turns on the reliability of the reported confirmation, while the passage records contrary views without
        resolving them.
  lesson: When a supplier is linked to a serious reported security concern, weigh the decision-maker's own reported confirmation
    against denials and skeptical assessments without treating either side as settled merely by assertion. If the central
    finding is reliable, ending the relationship can be justified despite disagreement; new evidence that resolves the finding
    may change the decision.
  limits: The passage gives no detailed explanation of the implants' effects, the evidence underlying Apple's confirmation,
    or the reasons Apple chose to sever ties. This reasoning should not be extended to a case where the finding is disproved
    or where the sourcing decision is governed by additional constraints not stated here.
  library:
    domain: cyber-policy
    family: CORPUS-NX-09fb3b9c
    source: https://jsouapplicationstorage.blob.core.windows.net/press/13/21-3.pdf
    episode_focus: The decision point is whether to continue sourcing from Supermicro or sever the relationship in response
      to the reported implant finding. The passage reports Apple’s confirmation and its action, but also notes that Supermicro
      denied the allegations and that researchers and the NSA expressed skepticism; do not treat the underlying allegation
      as uncontested fact.
