case:
  id: DR-CORPUS-NX-09fb3b9c-E4@v1
  title: Aegis Server Supply-Chain Risk Review
  status: draft
  setting: Navy Aegis program, after Lenovo's 2014 acquisition of IBM's low-end server business; PEO for Integrated Warfare
    Systems.
  decider: The Aegis program office and Lockheed Martin
  agent: The Aegis program office and Lockheed Martin
  agent_role: decide
  situation: Servers acquired from IBM were installed in and formed an integral part of the Navy's Aegis Combat System. Lenovo
    acquired IBM's low-end server business in 2014. The Navy was concerned that Lenovo-provided routine maintenance could
    compromise the servers. There was also concern that Chinese government agents could remotely access information on the
    system. The Aegis program office and Lockheed Martin faced the question of how to address the identified supply-chain
    risk.
  question: What should the Aegis program office and Lockheed Martin do about evaluating alternatives to mitigate the identified
    server supply-chain risk?
  options:
    O1:
      do: The Aegis program office and Lockheed Martin request DOD guidance on alternative hardware before proceeding with
        the review.
      move: ask
      irreversible: false
      to: DOD
    O2:
      do: The Aegis program office and Lockheed Martin proceed with evaluating alternative hardware solutions for the installed
        servers.
      move: act
      irreversible: false
    O3:
      do: The Aegis program office and Lockheed Martin decline to evaluate alternative hardware solutions for the installed
        servers.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Servers associated with IBM's low-end server business were installed in and integral to the Navy's Aegis Combat
      System.
  - id: F2
    kind: situation
    status: confirmed
    fact: Lenovo acquired IBM's low-end server business in 2014 for $2.3 billion.
  - id: F3
    kind: situation
    status: assessed
    fact: The acquisition of a selected COTS supplier by a non-U.S. competitor or potential adversary was identified as a
      possible source of mission disruption.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Navy was concerned that Lenovo-provided routine maintenance, including hardware or software upgrades, could
      compromise the servers.
  - id: F5
    kind: intelligence
    status: assessed
    fact: There was concern that Chinese government agents could remotely access information on the Aegis system.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Aegis program office and Lockheed Martin were required to evaluate alternative hardware solutions.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: A selected COTS supplier's acquisition by a non-U.S. competitor or potential adversary was identified as a possible
      source of mission disruption; this supports evaluating alternatives, but the risk is described as possible.
  - id: C2
    facts:
    - F4
    - F5
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The Navy was concerned that Lenovo-provided maintenance could compromise the servers and that Chinese government
      agents could remotely access system information, giving a security basis to evaluate alternate hardware.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: The Aegis program office and Lockheed Martin were required to evaluate alternative hardware solutions, which rules
      out declining that evaluation.
    rules_out:
    - O3
  reasoning:
    read: These servers were already installed and integral to Aegis when their supplier's business was acquired by Lenovo.
      The issue is an assessed supply-chain risk involving possible compromise through maintenance or remote access, not a
      finding that compromise occurred; the required decision is to evaluate alternatives, not to replace the servers.
    weighing: The possible mission disruption and the Navy's concerns about compromise and remote access support evaluating
      alternate hardware {C1} {C2}. Most decisively, the program office and Lockheed Martin were required to conduct that
      evaluation {C3}. The source does not establish that alternatives were selected or that replacement was ultimately warranted.
    tradecraft: Conduct the required alternatives evaluation, keeping the identified maintenance and remote-access concerns
      distinct from confirmed compromise. Record the alternatives considered and the risk basis for the evaluation; do not
      treat this evaluation itself as a final procurement or replacement decision.
    uncertainty: The stated risks are concerns and possibilities, not confirmed compromise. The passage gives no evaluation
      results, comparison of alternatives, or final hardware decision.
    handoff: The Aegis program office and Lockheed Martin are the identified parties required to evaluate alternatives. The
      passage does not identify a further approval or referral requirement.
    tempting_wrong:
      option: O3
      pull: The servers were already installed and integral to the combat system, which could make declining a review seem
        like a way to avoid unnecessary change.
      why_wrong: That consideration does not answer the identified supply-chain concerns, and declining the evaluation conflicts
        with the stated requirement.
    rejected:
      O1: The passage identifies no need to obtain DOD guidance before beginning the evaluation and states that the program
        office and Lockheed Martin were required to evaluate alternatives.
      O3: Declining the evaluation would fail to address the stated risks and would contradict the requirement to evaluate
        alternative hardware solutions.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C3
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The responsible authority rescinded the requirement to evaluate alternatives and determined that no evaluation remained
        necessary.
      then: O3
      why: Without the stated requirement or an outstanding risk-based reason to evaluate, declining the review could become
        an available course.
    would_not_change:
    - id: noflip1
      if: No compromise had been confirmed.
      why: The stated basis is a potential supply-chain risk and concerns about possible access, together with a requirement
        to evaluate alternatives; confirmation of an incident is not stated as a prerequisite.
    watch_for:
    - id: watch1
      what: Whether the identified maintenance and remote-access concerns remain relevant to the installed servers as the
        alternatives are evaluated.
      favors:
      - O2
      why: Those are the specific risks that prompted evaluation of alternate hardware.
  lesson: When a supplier change creates a credible supply-chain concern for systems integral to a mission, assess alternatives
    rather than treating the existing installation as proof that no further review is needed. Keep the risk assessment distinct
    from a final decision to replace equipment.
  limits: The passage supports evaluating alternatives, but does not establish that compromise occurred, identify the results
    of the evaluation, or endorse a final replacement or procurement decision. It does not specify how alternatives should
    be compared.
