case:
  id: DR-CORPUS-NX-09fb3b9c-E3@v1
  title: Cybersecurity Certification for Defense Contracts
  status: draft
  setting: Department of Defense, 2020, defense industrial base acquisition policy
  decider: The Department of Defense
  agent: The Department of Defense
  agent_role: decide
  situation: At the Department of Defense, officials faced a policy choice about cybersecurity compliance for defense industrial
    base contracts. The existing DFARS approach did not provide uniform security, and cybersecurity practices across the defense
    industrial base were inconsistent. Contractors could demonstrate compliance through self-certification. These concerns
    prompted recommendations to use third-party assessors instead. A proposed CMMC framework combined existing requirements
    into one standard and subjected companies' cybersecurity posture to third-party assessment. The policy objective was to
    protect controlled unclassified information and federal contract information throughout the supply chain. The contemplated
    requirements could cover prime contractors and relevant subcontractors seeking Department of Defense contract awards.
  question: What should the Department of Defense do about cybersecurity compliance requirements for defense industrial base
    contract awards?
  options:
    O1:
      do: The DOD permits contractor self-certification and retains self-reported cybersecurity compliance for prime contractors
        and relevant subcontractors seeking contract awards.
      move: act
      irreversible: false
    O2:
      do: The DOD prohibits contractor self-certification and requires measurable third-party cybersecurity certification
        for prime contractors and relevant subcontractors seeking contract awards.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: DFARS 252.204-7012 lacked uniform security.
  - id: F2
    kind: situation
    status: confirmed
    fact: Cybersecurity practices implemented across the defense industrial base were inconsistent.
  - id: F3
    kind: situation
    status: confirmed
    fact: Contractors could demonstrate compliance through self-certifications.
  - id: F4
    kind: situation
    status: confirmed
    fact: Recommendations emerged for the Department of Defense to use third-party assessors rather than self-certifications.
  - id: F5
    kind: capability
    status: confirmed
    fact: The CMMC combined disparate cybersecurity requirements into a unified standard assessable through third-party assessors.
  - id: F6
    kind: situation
    status: confirmed
    fact: The CMMC was designed to strengthen protection of controlled unclassified information and federal contract information
      within the defense industrial base supply chain.
  - id: F7
    kind: situation
    status: confirmed
    fact: The CMMC was intended to apply to prime contractors and subcontractors, with prime contractors flowing relevant
      requirements down to subcontractors.
  - id: F8
    kind: situation
    status: confirmed
    fact: A subcontractor might not need a higher-level certification if it was not working with controlled unclassified information.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The existing approach did not produce uniform security, and cybersecurity practices across the defense industrial
      base were inconsistent. A measurable common standard addresses those protection gaps.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: Because contractors could self-certify, compliance was not independently verified. The proposed unified standard
      and third-party assessment respond to that concern by making compliance measurable rather than self-reported.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The policy objective is to protect CUI and FCI throughout the supply chain, including relevant subcontractors. Requirements
      can be tailored so a subcontractor not working with CUI need not obtain a higher-level certification.
  reasoning:
    read: The issue is not simply whether contractors say they comply; it is whether cybersecurity protections are consistent
      and verifiable across the defense industrial base. The trap in retaining self-certification is treating a contractor's
      assertion as adequate assurance despite the identified gaps and inconsistent practices.
    weighing: The stated concerns about nonuniform security, inconsistent practices, and self-certification favor replacing
      self-reporting with measurable third-party certification {C1} {C2}. Applying relevant requirements through the supply
      chain advances the stated objective of protecting CUI and FCI, while the possibility of not requiring a higher certification
      from subcontractors without CUI limits unnecessary scope {C3}. The balance depends on certification being meaningfully
      assessed and requirements being matched to the subcontractor's role and information exposure.
    tradecraft: Set the certification requirement as a clear contract-award condition, flow down only relevant requirements,
      and record why the required assurance level fits the work and information involved. Preserve a reviewable record of
      the assessment and of any scope determination.
    uncertainty: The passage gives the reasons for adopting third-party certification but does not quantify how much risk
      it reduces or describe implementation costs. Those questions may inform execution and review, but they do not erase
      the stated weaknesses of self-certification.
    handoff: The Department of Defense should retain the policy decision and use the independent assessment and accreditation
      structure to support consistent verification; contract officials should apply the relevant requirements to prime contractors
      and subcontractors.
    tempting_wrong:
      option: O1
      pull: Self-certification may seem simpler because contractors can report their own compliance.
      why_wrong: 'That approach preserves the very assurance problem identified: compliance could be self-certified despite
        nonuniform security and inconsistent cybersecurity practices.'
    rejected:
      O1: The Department of Defense did not retain self-certification because the identified security inconsistencies and
        assurance concerns prompted a shift to measurable third-party certification.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Department of Defense had reliable evidence that self-certification produced uniform, independently verifiable
        protection across the defense industrial base.
      then: O1
      why: That would remove the central assurance and consistency concerns supporting third-party certification.
    would_not_change:
    - id: noflip1
      if: A subcontractor is not working with CUI.
      why: That may mean the subcontractor need not meet a higher certification level, but it does not reverse the general
        choice to require measurable third-party certification where relevant.
    watch_for:
    - id: watch1
      what: Whether third-party assessments consistently establish compliance with the unified cybersecurity requirements.
      favors:
      - O2
      - O1
      why: Evidence that assessments provide reliable assurance supports the adopted approach; evidence that they do not may
        warrant reconsidering how compliance is verified.
  lesson: When self-reporting coexists with inconsistent security practices, a common measurable standard and independent
    assessment can provide stronger assurance. Apply requirements through the supply chain in proportion to the information
    and work involved.
  limits: This reasoning addresses cybersecurity compliance in the defense industrial base and the stated protection of CUI
    and FCI. It does not establish that third-party certification is appropriate for every procurement or that every subcontractor
    requires the same certification level.
