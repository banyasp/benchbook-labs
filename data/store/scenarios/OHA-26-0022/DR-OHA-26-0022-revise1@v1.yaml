case:
  id: DR-OHA-26-0022-revise1@v1
  title: DOE Personnel Security Clearance Eligibility Determination [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee requiring a security clearance, was arrested in June 2025 on two felony
    charges of Indecency with a Child, Sexual Contact. He was acquitted at a jury trial in February 2026 and the prosecution
    records were subsequently expunged. The Local Security Office raised security concerns under Guideline D (sexual behavior)
    and Guideline J (criminal conduct) based on the arrest and also cited prior DWI and public intoxication offenses. The
    Individual presented testimony, counseling records, and character statements but offered no corroborating evidence beyond
    his acquittal. The Administrative Judge must decide whether the security concerns are resolved and whether to restore
    the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks the Individual to submit further evidence of rehabilitation.
      move: ask
      irreversible: false
      to: Individual
    O3:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge holds the decision pending additional mitigating evidence.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In June 2025 the Individual was arrested and charged with two counts of Indecency with a Child, Sexual Contact,
      both second-degree felonies.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual was acquitted of all charges at a jury trial in February 2026 and the prosecution records were expunged.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline D (sexual behavior) and Guideline J (criminal conduct) as security concerns
      based on the arrest and prior offenses.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual also has prior convictions for Driving While Intoxicated in 2018 and Public Intoxication in 2005.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual attended counseling with a specialist in treating sex offenders and victims, acknowledging a need
      for better boundaries.
  - id: F7
    kind: situation
    status: confirmed
    fact: During the criminal proceedings the Individual’s employer placed him on administrative leave and reassigned him,
      granting extended leave beyond the usual thirty days.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual’s girlfriend and a coworker testified that he is protective of his children and makes effort to spend
      time with them.
  - id: F9
    kind: situation
    status: assessed
    fact: The Individual presented no corroborating evidence beyond his own testimony and the acquittal to rebut the reliable
      evidence of criminal conduct.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F9
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The acquittal and expungement diminish the probative value of the indictment, so the reliable-evidence standard under
      Guideline J is less compelling.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Counseling and character testimony indicate some mitigation, reducing the severity of the Guideline D concern and
      weakening the argument for outright denial.
  - id: C3
    facts:
    - F5
    equity: due_process
    favors:
    - O1
    weight: weak
    why: Prior alcohol‑related offenses are mitigated under ¶ 32(a) because of the passage of time, but they do not offset
      the unresolved recent sexual‑behavior and criminal‑conduct concerns.
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Because the Individual has not met the burden of proof, the most appropriate response under the guidelines is to
      request additional rehabilitative evidence rather than to deny restoration immediately.
  - id: C5
    facts:
    - F6
    - F8
    equity: record_integrity
    favors:
    - O1
    weight: weak
    why: While character statements and counseling show positive personal attributes, they do not constitute evidence of successful
      rehabilitation directly addressing the alleged sexual conduct.
  reasoning:
    read: The judge must determine whether the security concerns raised under Guideline D (sexual behavior) and Guideline
      J (criminal conduct) are resolved, and whether additional evidence of rehabilitation is needed before a decision on
      restoration.
    weighing: C4 now strongly favors O2, while C1 and C2 are downgraded to weak objections. The strong analytic consideration
      that the burden remains unmet outweighs the weakened objections, leading to a request for further evidence of rehabilitation.
    tradecraft: The ruling is entered in the OHA case file and the Individual is notified of the request for additional evidence
      and of the right to appeal under 10 C.F.R. § 710.28.
    uncertainty: Uncertainty remains about the quality of any future rehabilitation documentation, but the current record
      is insufficient to resolve the concerns without further evidence.
    handoff: The Administrative Judge retains sole authority to resolve the eligibility issue after the hearing, with no further
      agency referral required.
    tempting_wrong:
      option: O3
      pull: The acquittal and expungement might suggest the Individual poses no risk, tempting a grant of clearance.
      why_wrong: Without corroborating rehabilitation evidence, the guidelines' mitigation criteria are not satisfied, so
        granting would violate the presumption against clearance.
    rejected:
      O1: Denial is premature because the Individual has not been given a chance to provide additional rehabilitative documentation
        that could satisfy mitigation factors.
      O3: Granting clearance would ignore the unresolved Guideline D and J concerns absent concrete evidence of successful
        rehabilitation.
      O4: Holding the decision pending without a clear request for evidence provides no actionable path; a specific request
        for further rehabilitation evidence is more appropriate.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C4
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to submit credible, corroborated evidence that he did not commit the alleged sexual conduct,
        satisfying mitigation factor ¶ 32(c) for Guideline J (or ¶ 14(e) for Guideline D).
      then: O1
      why: Even if such evidence were presented, the judge would interpret it as confirming the security concerns and therefore
        would deny restoration rather than grant it.
    would_not_change:
    - id: noflip1
      if: Only the prior DWI and public intoxication offenses are considered.
      why: Those offenses are already mitigated under ¶ 32(a) and do not affect the unresolved recent sexual-behavior concerns.
    watch_for:
    - id: watch1
      what: Future evidence of a completed, court-approved treatment program directly addressing sexual-boundary issues.
      favors:
      - O3
      why: Such evidence would satisfy mitigation factor ¶ 14(e) and could resolve Guideline D concerns.
  lesson: Under DOE Part 710, an acquittal does not automatically resolve security concerns; the individual must still provide
    concrete rehabilitation evidence to meet mitigation criteria before clearance can be restored.
  limits: Applies when reliable evidence of alleged conduct exists and the individual has not yet supplied the required mitigating
    documentation; does not address cases where the underlying conduct is unsubstantiated from the outset.
