case:
  id: DR-OHA-26-0022-flip1@v1
  title: DOE Personnel Security Clearance Eligibility Determination [flip]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy, August 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The employee, a contractor for a DOE-managed research facility, faced arrest in May 2025 on two second-degree
    felony counts of Indecency with a Child, Sexual Contact. A jury acquitted him in January 2026 and the prosecution files
    were subsequently expunged. The Local Security Office raised concerns under Guideline D (sexual behavior) and Guideline
    J (criminal conduct) based on the arrest and earlier DWI and public intoxication citations. The employee submitted counseling
    records, personal testimony, and character references, but offered no evidence beyond the acquittal. The judge must determine
    whether the security concerns are resolved and whether to reinstate the employee's access authorization.
  question: How should the Administrative Law Judge rule on the employee's access authorization?
  options:
    O1:
      do: Deny restoration of the employee's security clearance at this time.
      move: act
      irreversible: true
    O2:
      do: Require the employee to submit additional rehabilitation evidence before a decision.
      move: ask
      irreversible: false
      to: Individual
    O3:
      do: Grant restoration of the employee's security clearance based on the evidence.
      move: act
      irreversible: true
    O4:
      do: Place the decision on hold pending further mitigating evidence from the employee.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In May 2025 the employee was arrested and charged with two counts of Indecency with a Child, Sexual Contact, both
      classified as second-degree felonies.
  - id: F3
    kind: situation
    status: confirmed
    fact: A jury found the employee not guilty of all charges in January 2026 and the prosecution records were later expunged.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline D (sexual behavior) and Guideline J (criminal conduct) as security concerns
      stemming from the arrest and the employee's earlier offenses.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee also has prior convictions for Driving While Intoxicated in 2018 and Public Intoxication in 2005.
  - id: F6
    kind: situation
    status: confirmed
    fact: He participated in counseling with a specialist who treats sex-offender related issues and acknowledges a need for
      improved personal boundaries.
  - id: F7
    kind: situation
    status: confirmed
    fact: During the criminal case the employer placed the employee on administrative leave and reassigned him, extending
      the leave beyond the typical thirty-day period.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employee's partner and a coworker testified that he is protective of children and makes a concerted effort to
      spend time with them.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Individual provided an independent forensic DNA analysis and three unaffiliated eyewitness statements confirming
      he was elsewhere at the time of the alleged incident; the Local Security Office accepted these materials as reliable
      and sufficient to rebut the prior criminal‑conduct evidence.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F9
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Guideline J permits a clearance when reliable evidence demonstrates the individual did not commit the alleged conduct;
      the DNA analysis and eyewitness statements meet the mitigation factor ¶ 32(c).
  - id: C2
    facts:
    - F2
    - F4
    - F6
    - F8
    - F9
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Guideline D's mitigation factor ¶ 14(e) is satisfied because the employee has completed specialized counseling and
      the corroborating evidence in F9 shows no sexual-behavior risk.
  - id: C3
    facts:
    - F5
    equity: due_process
    favors:
    - O1
    weight: weak
    why: Prior alcohol-related offenses are mitigated under ¶ 32(a) due to the passage of time, but they remain a minor concern
      compared with the resolved sexual-behavior allegations.
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The employee met his burden of proof; the accepted forensic and eyewitness evidence eliminates the reliable-evidence
      requirement of Part 710 for Guideline J.
  - id: C5
    facts:
    - F6
    - F8
    equity: record_integrity
    favors:
    - O3
    weight: weak
    why: Counseling and character testimonies reinforce the conclusion that the employee has addressed the underlying issues,
      supporting a grant of clearance.
  reasoning:
    read: The judge must assess whether the employee has eliminated the security concerns identified under Guideline D (sexual
      behavior) and Guideline J (criminal conduct). The independent DNA analysis and eyewitness statements, accepted by the
      Local Security Office, satisfy the mitigation factor required to resolve those concerns.
    weighing: Applying the Adjudicative Guidelines, the strong considerations C1, C2, and C4 demonstrate that the employee
      has met the burden of proof and completed the necessary rehabilitation steps. The weaker concerns C3 and C5 do not outweigh
      the clear evidence of innocence, leading to a grant of restoration.
    tradecraft: The decision is entered as a final Administrative Law Judge Decision in the OHA docket, and the employee is
      informed of his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: Minor uncertainty remains regarding the long-term stability of the employee's behavior, but the current record
      satisfies the statutory mitigation requirements.
    handoff: The Administrative Law Judge acts alone, as the regulations vest sole authority to resolve eligibility after
      the hearing.
    tempting_wrong:
      option: O1
      pull: A conservative approach might favor denial to avoid any perceived risk.
      why_wrong: The reliable exonerating evidence removes the security concerns, making denial unnecessary under the guidelines.
    rejected:
      O2: The employee has already supplied the maximum evidentiary material; further requests would be redundant.
      O4: Delaying the decision would ignore the decisive exonerating evidence now on record.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the forensic DNA analysis and the three eyewitness statements were later deemed unreliable or inadmissible, the
        mitigation factor ¶ 32(c) would no longer be satisfied.
      then: O1
      why: Without reliable proof of innocence, the security concerns under Guideline J would remain unresolved, restoring
        the basis for denial.
    would_not_change:
    - id: noflip1
      if: If only the historic DWI and public intoxication offenses were considered.
      why: Those offenses are already mitigated under ¶ 32(a) and do not affect the resolved sexual-behavior concerns.
    watch_for:
    - id: watch1
      what: Any future evidence of a court-approved treatment program directly addressing sexual-boundary issues.
      favors:
      - O3
      why: Such documentation would further solidify compliance with mitigation factor ¶ 14(e).
  lesson: An acquittal combined with independently verified evidence of non-participation can satisfy the mitigation requirements
    of DOE Part 710, allowing a clearance to be restored.
  limits: This analysis applies only when reliable, corroborating evidence disproves the alleged conduct and the individual
    meets the specific mitigation criteria; it does not extend to cases where the underlying allegation remains unsubstantiated
    from the outset.
