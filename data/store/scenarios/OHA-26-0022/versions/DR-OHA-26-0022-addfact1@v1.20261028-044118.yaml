case:
  id: DR-OHA-26-0022-addfact1@v1
  title: DOE Personnel Security Clearance Eligibility Determination [addfact]
  status: needs_review
  setting: DOE Office of Hearings & Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The employee, who works for a DOE-contracted firm in a role requiring a security clearance, was arrested in June
    2025 on two second-degree felony counts of Indecency with a Child, Sexual Contact. A jury acquitted him of all charges
    in February 2026 and the prosecution files were expunged. The Local Security Office has raised concerns under Guideline
    D (sexual behavior) and Guideline J (criminal conduct), citing both the arrest and his earlier convictions for a 2018
    DWI and a 2005 public intoxication. He attended counseling with a specialist in treating sex offenders and victims, acknowledging
    a need for better boundaries. While the criminal case proceeded, his employer placed him on administrative leave, reassigned
    his duties, and extended the leave beyond the normal thirty-day limit. His girlfriend and a coworker testified that he
    is protective of children and makes an effort to spend time with them. He offered no corroborating evidence beyond his
    own testimony and the acquittal to counter the reliable record of criminal conduct. He resides in a suburban community
    within commuting distance of the contractor's headquarters.
  question: How should the Administrative Judge rule on the employee's security clearance?
  options:
    O1:
      do: The judge denies any restoration of the employee's security clearance.
      move: act
      irreversible: true
    O2:
      do: The judge requires the employee to submit additional evidence of rehabilitation.
      move: ask
      irreversible: false
      to: Individual
    O3:
      do: The judge grants restoration of the employee's security clearance after review.
      move: act
      irreversible: true
    O4:
      do: The judge defers the decision until further mitigating evidence is provided.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE-contracted firm in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In June 2025 he was taken into custody and indicted on two second-degree felony counts of Indecency with a Child,
      Sexual Contact.
  - id: F3
    kind: situation
    status: confirmed
    fact: A jury found him not guilty on all counts in February 2026, and the prosecution files were subsequently expunged.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline D (sexual behavior) and Guideline J (criminal
      conduct), citing the arrest and earlier infractions.
  - id: F5
    kind: situation
    status: confirmed
    fact: He also carries prior convictions for a 2018 DWI and a 2005 public intoxication.
  - id: F6
    kind: situation
    status: confirmed
    fact: He participated in counseling with a therapist who works with sex offenders and victims, acknowledging a need to
      improve personal boundaries.
  - id: F7
    kind: situation
    status: confirmed
    fact: While the criminal case proceeded, his employer placed him on administrative leave, reassigned his duties, and extended
      the leave beyond the standard thirty-day period.
  - id: F8
    kind: situation
    status: confirmed
    fact: Both his girlfriend and a colleague testified that he is protective of children and makes an effort to spend time
      with them.
  - id: F9
    kind: situation
    status: assessed
    fact: He offered no corroborating evidence beyond his own testimony and the acquittal to counter the reliable record of
      criminal conduct.
  - id: F10
    kind: situation
    status: confirmed
    fact: He lives in a suburban area that is within commuting range of the contractor's headquarters.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F9
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline J obliges the individual to provide reliable proof of conduct; although the indictment was dismissed, the
      file still contains the arrest record and no corroborating documentation, so the judge should request further rehabilitation
      evidence before restoring the clearance.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Guideline D focuses on sexual-behavior risks; the counseling attended is a positive step but does not demonstrate
      completed rehabilitation, and the character statements do not replace objective proof, thus additional evidence is required.
  - id: C3
    facts:
    - F5
    equity: due_process
    favors:
    - O2
    weight: weak
    why: The earlier alcohol-related offenses are aged and partially mitigated, yet they still reflect a pattern of poor judgment
      that supports a request for more proof of rehabilitation.
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The employee failed to meet his burden of proof; the record lacks any independent verification of reform, making
      a supplemental evidence request necessary.
  - id: C5
    facts:
    - F6
    - F8
    equity: record_integrity
    favors:
    - O2
    weight: weak
    why: While the therapist's report and supportive testimony suggest good intent, they fall short of the evidentiary threshold
      needed to resolve Guideline D concerns, so the judge should require further documentation.
  - id: C6
    facts:
    - F10
    equity: operational_practicality
    favors:
    - O2
    weight: weak
    why: The employee’s residence within commuting distance does not raise additional security concerns, but it confirms his
      continued access to the workplace, underscoring the need for a clear determination before reinstatement.
  reasoning:
    read: The judge must decide whether the employee's security concerns under Guidelines D and J have been adequately mitigated.
      The record shows an acquitted charge, counseling, and supportive statements, but no independent proof of rehabilitation,
      so the appropriate response is to request additional evidence.
    weighing: Applying the Adjudicative Guidelines, the strong considerations C1, C2, and C4 indicate that the burden of proof
      has not been met, while the weaker points C3 and C5 do not offset this deficit. Consequently, the judge should condition
      clearance restoration on the submission of further rehabilitation documentation (O2).
    tradecraft: The decision is entered as a final Administrative Judge Order in the OHA docket, and the employee is advised
      of his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The primary unknown is whether the employee can produce credible, third-party evidence of rehabilitation;
      the current file lacks such material.
    handoff: The Administrative Judge acts alone, as the statutes vest sole adjudicative authority in the judge.
    tempting_wrong:
      option: O3
      pull: The expunged acquittal might appear to clear the risk, tempting a full restoration.
      why_wrong: Without corroborated rehabilitation evidence, granting a clearance would conflict with the presumption against
        eligibility.
    rejected:
      O1: Denial ignores the possibility that the employee could demonstrate rehabilitation if given a chance.
      O3: Full restoration exceeds what the record supports absent additional proof.
      O4: Deferring indefinitely provides no clear path forward; a specific request for evidence is more appropriate.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee submits credible, corroborated evidence that he has completed a court-approved treatment program addressing
        sexual-boundary issues.
      then: O3
      why: Such documentation would satisfy mitigation factor ¶ 14(e) for Guideline D and ¶ 32(c) for Guideline J, allowing
        clearance restoration.
    - id: flip2
      if: No supplemental rehabilitation documentation is submitted and the administrative leave period expires without further
        review.
      then: O1
      why: The lack of any additional evidence confirms that the employee has not met the mitigation criteria, restoring the
        parent’s position of denial.
    would_not_change:
    - id: noflip1
      if: Only the prior DWI and public intoxication offenses are considered.
      why: These offenses are already mitigated and do not change the unresolved recent sexual-behavior concerns.
    watch_for:
    - id: watch1
      what: Any future independent psychological assessment confirming sustained rehabilitation.
      favors:
      - O3
      why: It would meet the mitigation requirement for Guideline D, opening the door to clearance restoration.
  lesson: Under DOE Part 710, an acquittal alone does not eliminate security concerns; the employee must still furnish the
    specific mitigation evidence required by the Guidelines before a clearance can be reinstated.
  limits: This analysis applies when reliable evidence of alleged misconduct exists and the individual has not yet presented
    the mandated rehabilitation documentation; it does not cover cases where the alleged conduct is unsubstantiated from the
    outset.
