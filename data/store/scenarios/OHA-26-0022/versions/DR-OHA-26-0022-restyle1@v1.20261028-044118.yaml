case:
  id: DR-OHA-26-0022-restyle1@v1
  title: DOE Personnel Security Clearance Eligibility Determination [restyle]
  status: needs_review
  setting: U.S. Department of Energy, Office of Hearings and Appeals – June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The employee of a DOE contractor, whose duties require a security clearance, was taken into custody in June 2025
    on two second-degree felony counts of indecency with a child involving sexual contact. A jury trial in February 2026 resulted
    in acquittal, and the prosecution files were thereafter expunged. The Local Security Office identified potential security
    issues under Guideline D (sexual behavior) and Guideline J (criminal conduct), also noting earlier convictions for driving
    while intoxicated and public intoxication. The employee submitted personal testimony, counseling documentation, and character
    references, yet provided no evidence corroborating the acquittal. The Administrative Judge must determine whether the
    identified security concerns have been mitigated and whether to reinstate the employee's access authorization.
  question: What action should the Administrative Judge take concerning the employee's access authorization?
  options:
    O1:
      do: The Administrative Judge denies any restoration of the employee's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge directs the employee to furnish additional evidence of rehabilitation.
      move: ask
      irreversible: false
      to: Individual
    O3:
      do: The Administrative Judge grants restoration of the employee's access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge defers a final decision pending receipt of further mitigating evidence.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In June 2025 the employee was arrested and charged with two counts of indecency with a child involving sexual contact,
      each a second-degree felony.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee was acquitted of all charges at a jury trial in February 2026, and the prosecution records were subsequently
      expunged.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline D (sexual behavior) and Guideline J (criminal
      conduct) predicated on the arrest and earlier offenses.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee also possesses prior convictions for driving while intoxicated (2018) and public intoxication (2005).
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee participated in counseling with a specialist in treating sex-offender related issues, acknowledging
      a need to improve personal boundaries.
  - id: F7
    kind: situation
    status: confirmed
    fact: During the criminal proceedings, the employee's employer placed him on administrative leave, reassigned his duties,
      and extended his leave beyond the standard thirty-day period.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employee's partner and a coworker testified that he is protective of children and makes concerted efforts to
      spend time with them.
  - id: F9
    kind: situation
    status: assessed
    fact: The employee offered no corroborating evidence beyond his own testimony and the acquittal to counter the reliable
      evidence of criminal conduct.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F9
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline J mandates reliable evidence of criminal conduct; the record includes the indictment, a grand-jury finding,
      and investigative testimony, and the employee supplied no corroborating evidence beyond the acquittal, therefore mitigation
      factor ¶ 32(c) remains unmet.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Guideline D addresses sexual behavior that may indicate poor judgment; the alleged conduct is recent, not demonstrated
      to be isolated or occurring under exceptional circumstances, and the counseling provided fails to satisfy mitigation
      factor ¶ 14(e).
  - id: C3
    facts:
    - F5
    equity: due_process
    favors:
    - O1
    weight: weak
    why: Prior alcohol-related offenses are mitigated under ¶ 32(a) due to the elapsed time, yet they do not counterbalance
      the unresolved recent sexual-behavior and criminal-conduct concerns.
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The employee failed to meet his burden of proof; the record lacks any corroborating evidence, and the acquittal alone
      does not dispel the reliable-evidence standard of Part 710.
  - id: C5
    facts:
    - F6
    - F8
    equity: record_integrity
    favors:
    - O1
    weight: weak
    why: Although character statements and counseling reflect positive personal attributes, they do not constitute evidence
      of successful rehabilitation directly addressing the alleged sexual conduct.
  reasoning:
    read: The judge must ascertain whether the employee has resolved the security concerns identified under Guideline D (sexual
      behavior) and Guideline J (criminal conduct). The record contains reliable evidence of indictment and investigation,
      and the employee offered only uncorroborated testimony and an acquittal, which fails to satisfy the mitigation criteria.
    weighing: 'The Administrative Judge applied the Adjudicative Guidelines verbatim: because the employee could not satisfy
      any mitigating factors for Guideline J (¶ 32) or Guideline D (¶ 14), the concerns remain unresolved. The strong considerations
      C1, C2, and C4 outweigh the weaker mitigating points C3 and C5, resulting in denial of restoration.'
    tradecraft: The decision is entered as a final Administrative Judge Decision, recorded in the OHA case file, and the employee
      is notified of his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty concerns the unavailable trial transcript and the unsubmitted corroborating evidence;
      however, the burden rested on the employee, and the absence of such evidence constitutes a factual finding.
    handoff: The Administrative Judge decides alone, as the regulations confer sole authority to resolve eligibility after
      the hearing.
    tempting_wrong:
      option: O3
      pull: The acquittal and expungement could be interpreted as indicating the employee no longer poses a risk, tempting
        a clearance grant.
      why_wrong: An acquittal does not eliminate the reliable-evidence standard; absent corroborating proof, the security
        concerns persist under the guidelines.
    rejected:
      O2: The record shows the employee had the opportunity to submit mitigating evidence and did not; a request for additional
        evidence would be futile.
      O3: The guidelines require mitigation factors that are not satisfied; granting would contravene the presumption against
        clearance.
      O4: Holding the decision pending would ignore the clear finding that the employee failed to meet his burden.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee were to submit credible, corroborated evidence that he did not commit the alleged sexual conduct, satisfying
        mitigation factor ¶ 32(c) for Guideline J (or ¶ 14(e) for Guideline D).
      then: O3
      why: The guidelines state that reliable evidence of innocence or successful rehabilitation can resolve the security
        concerns.
    would_not_change:
    - id: noflip1
      if: Only the prior DWI and public intoxication offenses are considered.
      why: Those offenses are already mitigated under ¶ 32(a) and do not affect the unresolved recent sexual-behavior concerns.
    watch_for:
    - id: watch1
      what: Future evidence of a completed, court-approved treatment program directly addressing sexual-boundary issues.
      favors:
      - O3
      why: Such evidence would satisfy mitigation factor ¶ 14(e) and could resolve Guideline D concerns.
  lesson: Under DOE Part 710, an acquittal does not automatically resolve security concerns; the employee must still satisfy
    the specific mitigation criteria of the Adjudicative Guidelines to have a clearance restored.
  limits: This reasoning applies only to cases where reliable evidence of alleged conduct exists and the employee fails to
    provide the required mitigating documentation; it does not address situations where the underlying conduct is unsubstantiated
    from the outset.
