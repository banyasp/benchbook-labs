case:
  id: DR-OHA-26-0022@v1
  title: DOE Personnel Security Clearance Eligibility Determination
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee requiring a security clearance, was arrested in June 2025 on two felony
    charges of Indecency with a Child, Sexual Contact. He was acquitted at a jury trial in February 2026 and the prosecution
    records were subsequently expunged. The Local Security Office raised security concerns under Guideline D (sexual behavior)
    and Guideline J (criminal conduct) based on the arrest and also cited prior DWI and public intoxication offenses. The
    Individual presented testimony, counseling records, and character statements but offered no corroborating evidence beyond
    his acquittal. The Administrative Judge must decide whether the security concerns are resolved and whether to restore
    the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks the Individual to submit further evidence of rehabilitation.
      move: ask
      irreversible: false
      to: Individual
    O3:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge holds the decision pending additional mitigating evidence.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In June 2025 the Individual was arrested and charged with two counts of Indecency with a Child, Sexual Contact,
      both second-degree felonies.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual was acquitted of all charges at a jury trial in February 2026 and the prosecution records were expunged.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline D (sexual behavior) and Guideline J (criminal conduct) as security concerns
      based on the arrest and prior offenses.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual also has prior convictions for Driving While Intoxicated in 2018 and Public Intoxication in 2005.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual attended counseling with a specialist in treating sex offenders and victims, acknowledging a need
      for better boundaries.
  - id: F7
    kind: situation
    status: confirmed
    fact: During the criminal proceedings the Individual’s employer placed him on administrative leave and reassigned him,
      granting extended leave beyond the usual thirty days.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual’s girlfriend and a coworker testified that he is protective of his children and makes effort to spend
      time with them.
  - id: F9
    kind: situation
    status: assessed
    fact: The Individual presented no corroborating evidence beyond his own testimony and the acquittal to rebut the reliable
      evidence of criminal conduct.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F9
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline J requires reliable evidence of criminal conduct; the record shows indictment, grand‑jury finding, and
      investigative testimony, and the Individual offered no corroborating evidence beyond the acquittal, so the mitigation
      factor ¶ 32(c) is not met.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Guideline D concerns arise from sexual behavior that may reflect poor judgment; the alleged conduct is recent, not
      shown to be isolated or under unusual circumstances, and the counseling presented does not satisfy mitigation factor
      ¶ 14(e).
  - id: C3
    facts:
    - F5
    equity: due_process
    favors:
    - O1
    weight: weak
    why: Prior alcohol‑related offenses are mitigated under ¶ 32(a) because of the passage of time, but they do not offset
      the unresolved recent sexual‑behavior and criminal‑conduct concerns.
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Individual failed to meet his burden of proof; the record lacks any corroborating evidence, and the acquittal
      alone does not eliminate the reliable‑evidence standard of Part 710.
  - id: C5
    facts:
    - F6
    - F8
    equity: record_integrity
    favors:
    - O1
    weight: weak
    why: While character statements and counseling show positive personal attributes, they do not constitute evidence of successful
      rehabilitation directly addressing the alleged sexual conduct.
  reasoning:
    read: The judge must determine whether the Individual has resolved the security concerns raised under Guideline D (sexual
      behavior) and Guideline J (criminal conduct). The record contains reliable evidence of indictment and investigation,
      and the Individual offered only uncorroborated testimony and an acquittal, which does not satisfy the mitigation criteria.
    weighing: 'The Administrative Judge applied the Adjudicative Guidelines verbatim: because the Individual could not satisfy
      any of the mitigating factors for Guideline J (¶ 32) or Guideline D (¶ 14), the concerns remain unresolved. The strong
      considerations C1, C2, and C4 outweigh the weak mitigating points C3 and C5, leading to denial of restoration.'
    tradecraft: The decision is entered as a final Administrative Judge Decision, recorded in the OHA case file, and the Individual
      is notified of his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty lies in the unavailable trial transcript and the unsubmitted corroborating evidence;
      however, the burden rested on the Individual, and the lack of such evidence is a factual finding.
    handoff: The Administrative Judge decides alone, as the regulations grant the judge sole authority to resolve eligibility
      after the hearing.
    tempting_wrong:
      option: O3
      pull: The acquittal and expungement might suggest the Individual is no longer a risk, tempting a grant of clearance.
      why_wrong: An acquittal does not erase the reliable‑evidence standard; without corroborating proof, the security concerns
        remain under the guidelines.
    rejected:
      O2: The record shows the Individual had the opportunity to submit mitigating evidence and did not; a request for more
        evidence would be futile.
      O3: The guidelines require mitigation factors that are not satisfied; granting would contravene the presumption against
        clearance.
      O4: Holding the decision pending would ignore the clear finding that the Individual failed to meet his burden.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to submit credible, corroborated evidence that he did not commit the alleged sexual conduct,
        satisfying mitigation factor ¶ 32(c) for Guideline J (or ¶ 14(e) for Guideline D).
      then: O3
      why: The guidelines state that reliable evidence of innocence or successful rehabilitation can resolve the security
        concerns.
    would_not_change:
    - id: noflip1
      if: Only the prior DWI and public intoxication offenses are considered.
      why: Those offenses are already mitigated under ¶ 32(a) and do not affect the unresolved recent sexual‑behavior concerns.
    watch_for:
    - id: watch1
      what: Future evidence of a completed, court‑approved treatment program directly addressing sexual‑boundary issues.
      favors:
      - O3
      why: Such evidence would satisfy mitigation factor ¶ 14(e) and could resolve Guideline D concerns.
  lesson: Under DOE Part 710, an acquittal does not automatically resolve security concerns; the individual must still meet
    the specific mitigation criteria of the Adjudicative Guidelines to have a clearance restored.
  limits: This reasoning applies only to cases where reliable evidence of alleged conduct exists and the individual fails
    to provide the required mitigating documentation; it does not address situations where the underlying conduct is unsubstantiated
    from the outset.
