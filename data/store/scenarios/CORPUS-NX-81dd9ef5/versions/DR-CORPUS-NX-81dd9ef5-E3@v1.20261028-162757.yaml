case:
  id: DR-CORPUS-NX-81dd9ef5-E3@v1
  title: Disseminating a Special Estimate
  status: draft
  setting: During preparation of a Special NIE at the CIA; the date and drafting location are unspecified.
  decider: The Special NIE drafters and chief coordinators
  agent: The Special NIE drafters and chief coordinators
  agent_role: decide
  situation: A Special NIE was being prepared using extensive documentary material concerning Soviet military thought. The
    drafters and chief coordinators held the clearance required for that material. National intelligence estimates did not
    ordinarily identify their information sources. The estimate could refer directly to the underlying documents and carry
    a restrictive codeword, or omit them; omitting the codeword would allow wider dissemination of its conclusions. Its judgments
    addressed Soviet leaders’ views of limited conflict and the risk of escalation.
  question: What should the Special NIE drafters and chief coordinators do about distributing the estimate’s conclusions?
  options:
    O1:
      do: The Special NIE drafters and chief coordinators withhold the conclusions from wider circulation, applying the restrictive
        codeword and omitting direct references to the documents.
      move: act
      irreversible: false
    O2:
      do: The Special NIE drafters and chief coordinators disclose the conclusions more widely, omitting direct references
        to the documents and the restrictive codeword.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Extensive documentary material formed the basis for statements in the Special NIE.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The documentary material principally consisted of Secret and newly initiated Top Secret editions of the Soviet General
      Staff’s theoretical organ, Military Thought.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Special NIE drafters and chief coordinators had the clearance required for the documentary material.
  - id: F4
    kind: situation
    status: confirmed
    fact: National intelligence estimates did not as a rule indicate the sources of their information.
  - id: F5
    kind: capability
    status: confirmed
    fact: The estimate could omit direct references to the documentary material and the restrictive codeword, permitting wider
      dissemination of its conclusions.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Many of the estimate’s judgments were similar to earlier judgments.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The estimate assessed that Soviet public statements about limited wars inevitably escalating to general war were
      not necessarily expressions of Soviet military policy.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The estimate assessed that Soviet leaders would avoid limited engagements with the West and, if involved, would
      avoid escalation and seek to minimize the chance of general nuclear war.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The estimate judged that Soviet leaders did not regard war as desirable or a Western attack as probable; that judgment
      did not provoke dissent.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: National intelligence estimates did not ordinarily identify their information sources, and omitting direct references
      and the restrictive codeword allowed the conclusions to circulate more widely.
  - id: C2
    facts:
    - F2
    - F3
    - F5
    equity: classification_integrity
    favors:
    - O2
    weight: weak
    why: The documentary material was highly classified, but the drafters and coordinators had the required clearance, and
      the estimate could be circulated without directly referring to that material or carrying its restrictive codeword.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Many judgments resembled earlier ones, and the judgment that Soviet leaders did not see war as desirable or a Western
      attack as probable prompted no dissent. These facts offered no stated analytic reason to withhold the conclusions.
  reasoning:
    read: The choice was about distributing the estimate's conclusions, not distributing the underlying documentary material.
      The trap is to treat the sensitivity of the material supporting the estimate as requiring the conclusions themselves
      to remain restricted, even though the estimate could omit direct references and the restrictive codeword.
    weighing: The practice that estimates ordinarily did not identify their sources, together with the possibility of wider
      circulation by omitting references and the codeword, supports {O2}. The drafters' required clearance and the absence
      of dissent on a central judgment are supporting context, not proof that every possible recipient was eligible to receive
      the estimate. The balance therefore depends on keeping the underlying material distinct from the conclusions being circulated.
    tradecraft: Carry out the selected course by circulating the conclusions without direct references to the underlying documents
      or the restrictive codeword. Keep the decision record focused on the distinction between the documentary basis and the
      estimate's conclusions, and do not imply that clearance held by the drafters establishes recipient eligibility.
    uncertainty: The recipients, their access eligibility, and any separate dissemination rules are unspecified. Omission
      permitted wider circulation, but that does not establish that circulation to every audience was authorized.
    handoff: The drafters and chief coordinators held the decision in this account. No required referral or higher approval
      is identified; checking any applicable distribution authority would be prudent but is not part of the stated rationale.
    tempting_wrong:
      option: O1
      pull: The underlying documents were Secret and newly initiated Top Secret material, which can make withholding the conclusions
        appear safer.
      why_wrong: That treats the classification of the supporting material as dispositive even though the estimate could omit
        direct references and the restrictive codeword, and the selected course was wider circulation of the conclusions.
    rejected:
      O1: The estimate's conclusions were circulated more widely by omitting direct references to the documents and the restrictive
        codeword, rather than being withheld from wider circulation.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The conclusions could not be separated from restricted documentary content without exposing that content, or applicable
        distribution authority did not permit wider circulation.
      then: O1
      why: The reason for broader circulation depends on distributing conclusions without directly exposing the underlying
        material and doing so within the applicable distribution authority.
    would_not_change:
    - id: noflip1
      if: The supporting documents were classified at the levels described, while the conclusions remained separable and wider
        circulation was otherwise authorized.
      why: The decision distinguishes the sensitive documentary basis from the conclusions and omits direct references and
        the restrictive codeword.
    watch_for:
    - id: watch1
      what: Whether the intended recipients were eligible to receive the estimate under applicable distribution rules.
      favors:
      - O1
      why: The drafters' clearance does not by itself establish that every recipient of wider circulation was eligible.
  lesson: Do not assume that sensitive source material requires every conclusion based on it to remain equally restricted.
    Where the conclusions can be circulated without identifying or reproducing that material, distinguish their dissemination
    from access to the underlying documents, while still checking recipient eligibility and applicable authority.
  limits: This reasoning applies when conclusions can be separated from sensitive supporting material and wider circulation
    is permitted. It does not resolve cases where the conclusions themselves disclose restricted material or a binding rule
    requires restricted circulation.
  library:
    domain: intel-oversight
    family: CORPUS-NX-81dd9ef5
    source: https://www.cia.gov/resources/csi/static/ee4ed44fd4e0d03e42e31d39c3b01621/Watching-the-Bear-5-Chap5-Mil-Intentions-Capabilities.pdf
    episode_focus: The decision point is whether to restrict dissemination of the estimate or circulate its conclusions more
      widely while omitting direct references to the underlying documents and the restrictive codeword. The passage says the
      omissions permitted wider dissemination and notes that the relevant officials had the required clearance. Exclude the
      source’s identity and any details of intelligence operations.
    cues:
      option_words:
        O1: 24
        O2: 22
      real_option: O2
      real_to_mean_other_length: 0.92
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
    equities: pilot2
