case:
  id: DR-CORPUS-NX-5b7aabac-E9@v1
  title: Authorizing a Reward-Linked Police Operation
  status: draft
  setting: Chiang Mai Province, Northern Thailand, late October 1953; a police operation involving a newly assembled unit.
  decider: The operation leaders
  agent: The operation leaders
  agent_role: decide
  situation: In late October 1953, the operation leaders were considering a coercive law-enforcement operation in Chiang Mai
    Province. Fifty new personnel from the provinces needed refresher training, and the proposed operation was expected to
    test the unit and demonstrate its utility to Thai and American superiors. Illegal opium trafficking supported bribery
    of local officials, although opium consumption itself remained legal within a government monopoly. Police regulations
    provided rewards for confiscations, and the proposing police officer acknowledged that a share of a reward could help
    pay for his wedding. There were also recurring rumors that senior officials had interests in the illicit trade.
  question: What should the operation leaders do about authorizing the coercive law-enforcement operation?
  options:
    O1:
      do: The operation leaders decline the coercive law-enforcement operation.
      move: act
      irreversible: false
    O2:
      do: The operation leaders defer authorization pending review of the conflict.
      move: hold
      irreversible: false
    O3:
      do: The operation leaders authorize the coercive law-enforcement operation.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: Fifty new personnel from the provinces needed refresher training.
  - id: F2
    kind: situation
    status: confirmed
    fact: The operation leaders wanted an operation that would test the unit's skills and courage and demonstrate its utility
      to Thai and American superiors.
  - id: F3
    kind: situation
    status: confirmed
    fact: Illegal opium trafficking through Thailand generated revenue that enabled smugglers to bribe local officials to
      tolerate or protect the trade.
  - id: F4
    kind: authority
    status: confirmed
    fact: Opium consumption was legal in Thailand, but only the government could buy opium and opium parlors were government-owned.
  - id: F5
    kind: situation
    status: confirmed
    fact: Illegal opium remaining in Thailand interfered with the government's efforts to reduce local consumption.
  - id: F6
    kind: authority
    status: confirmed
    fact: Police regulations provided a reward for confiscating illegal opium, with a portion distributed according to the
      rank of the officers involved.
  - id: F7
    kind: situation
    status: assessed
    fact: The proposing police officer said his police salary had not allowed him to save enough for wedding expenses and
      that a share of a substantial reward would allow him and his fiancée to set a wedding date.
  - id: F8
    kind: intelligence
    status: assessed
    fact: There were recurring rumors that powerful officials had interests in the illicit trade.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The new personnel needed refresher training, and the leaders regarded an operation as a way to test the unit and
      demonstrate its utility.
  - id: C2
    facts:
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The proposed law-enforcement purpose concerned illegal trafficking that enabled bribery and interfered with the government's
      effort to reduce local consumption.
  - id: C3
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The source distinguishes legal consumption under the government monopoly from illegal opium trafficking; the operation
      was directed at the latter, not at lawful consumption.
  - id: C4
    facts:
    - F6
    - F7
    equity: impartiality
    favors:
    - O2
    weight: weak
    why: A reward share was permitted by police regulations, but the proposing officer's personal financial benefit created
      a reason to examine whether the decision was being influenced by private interest.
  - id: C5
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Rumors of senior officials' interests raised a legitimacy concern; the operation leaders nevertheless took the senior
      police authority's assent as confirming confidence in its integrity.
  reasoning:
    read: This was a decision to authorize coercive enforcement against illegal trafficking, not to prohibit opium consumption,
      which remained legal within a government monopoly. The trap is to treat the operation's training and career benefits
      as sufficient justification, or to let the personal reward and rumors of official involvement eclipse the stated trafficking
      and bribery problem.
    weighing: 'The operation leaders treated a successful operation as an imperative for training and demonstrating the unit''s
      utility, and they had a substantive enforcement purpose: illegal trafficking supported bribery and undermined the government''s
      effort to reduce local consumption. The personal reward motive and rumors warranted caution, but the source records
      the reward as provided for by regulation and the senior police authority''s agreement as confirming confidence in its
      integrity. On that balance, the leaders proceeded; the balance would be different if the operation were aimed at lawful
      consumption or the personal incentive compromised impartial enforcement.'
    tradecraft: As a decision practice, record the distinction between lawful consumption and illegal trafficking, the stated
      public purpose, the reward incentive, and the approvals relied on. Keep the authorization limited to the stated law-enforcement
      purpose and document how any personal-interest concern was addressed.
    uncertainty: The source gives no independent verification of the rumors or detail establishing whether the reward motive
      affected the decision. It presents the officer's financial interest as acknowledged and the senior authority's assent
      as reassuring, not as proof that every conflict concern was resolved.
    handoff: 'The operation leaders should involve the relevant police command and the appropriate Thai and American supervisory
      authorities: the source records senior police and CIA assent, and consultation is especially important given the personal
      incentive and rumors.'
    tempting_wrong:
      option: O2
      pull: Deferring authorization may seem prudent because the proposing officer expected a personal financial benefit and
        rumors implicated powerful officials.
      why_wrong: The source's leaders proceeded despite those concerns, treating the stated enforcement and unit purposes
        as sufficient and senior police assent as reassurance; the source does not describe the concerns as grounds to suspend
        the decision.
    rejected:
      O1: The leaders did not decline because they saw the operation as serving both unit readiness and a response to illegal
        trafficking that enabled bribery.
      O2: The leaders did not defer because the source records that they proceeded after senior police assent, despite the
        acknowledged incentive and rumors.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that senior officials were directing or protecting the illicit trade, rather than the concern
        remaining rumor.
      then: O2
      why: That would make the integrity concern concrete and warrant deferring authorization for independent review.
    - id: flip2
      if: The proposed coercive operation were aimed at legal consumption rather than illegal trafficking.
      then: O1
      why: The source's rationale depends on the distinction between lawful consumption under the government monopoly and
        illegal trafficking.
    would_not_change:
    - id: noflip1
      if: Opium consumption remained legal under the government monopoly.
      why: That fact alone does not defeat authorization directed at illegal trafficking; the source expressly distinguishes
        the two.
    watch_for:
    - id: watch1
      what: Whether the reward arrangement or the officer's expected personal benefit compromised impartial enforcement.
      favors:
      - O2
      why: A personal incentive could turn a permitted reward into a conflict affecting the decision's integrity.
  lesson: A coercive operation should be justified by its lawful public purpose, not merely by training value or institutional
    display. Distinguish conduct that remains legal from the illegal activity being addressed, and examine personal incentives
    and integrity concerns before authorizing action.
  limits: This reasoning applies to authorization of the stated operation against illegal trafficking, not to its targets,
    tactics, or execution. It does not establish that a reward arrangement is always compatible with impartial enforcement
    or resolve the truth of the rumors.
