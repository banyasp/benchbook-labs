case:
  id: DR-OGE-2635-206a1-2@v1
  title: Disposition of $200 Barometer Gift to NPS Employee
  status: draft
  setting: National Park Service office, present day, United States
  decider: National Park Service employee
  agent: National Park Service employee
  agent_role: decide
  situation: A National Park Service employee delivered a speech on Federal lands policy and, at the conclusion, was presented
    with a barometer valued at $200 by a prohibited source. The employee chose not to decline the gift in order to avoid public
    embarrassment for the sponsor. Under 5 CFR §2635.206(a)(1), gifts that cannot be accepted must be disposed of by either
    returning the item or reimbursing its market value, and destruction is prohibited for items over $100. The employee must
    act promptly to comply with the regulation. The agency may, however, retain the gift if a specific statutory gift‑acceptance
    authority applies. The employee is now faced with deciding how to dispose of the barometer in accordance with the ethics
    rules.
  question: What should the National Park Service employee do with the $200 barometer received from a prohibited source?
  options:
    O1:
      do: Pay the donor the $200 market value promptly.
      move: act
      irreversible: true
    O2:
      do: Return the barometer to the donor without delay.
      move: act
      irreversible: true
    O3:
      do: Seek agency approval to retain the barometer under statutory authority.
      move: ask
      irreversible: false
      to: agency ethics official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the National Park Service.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee received a barometer valued at $200 from a prohibited source at the end of a speech.
  - id: F3
    kind: authority
    status: confirmed
    fact: The barometer is not permissible under an exception to the gift‑acceptance subpart and therefore cannot be accepted.
  - id: F4
    kind: authority
    status: confirmed
    fact: Under §2635.206(a)(1), the employee must promptly return a tangible item or reimburse its market value; destruction
      is prohibited for items with market value over $100.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency may accept the gift if a specific statutory gift‑acceptance authority permits it.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee did not decline the gift to avoid public embarrassment for the sponsor.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: §2635.206(a)(1) expressly requires that a tangible gift that cannot be accepted be promptly returned to the donor
      or reimbursed; destruction is prohibited for items valued over $100.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Returning the barometer preserves the agency’s compliance record and demonstrates adherence to the ethics regulation.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The regulation allows retention only if a specific statutory gift‑acceptance authority applies, which is not shown
      in the facts.
  - id: C4
    facts:
    - F6
    equity: due_process
    favors:
    - O2
    weight: weak
    why: The employee’s motive to avoid embarrassment does not alter the statutory requirement to dispose of the prohibited
      gift.
  - id: C5
    facts:
    - F4
    equity: record_integrity
    favors:
    - O2
    weight: strong
    why: Section (c) encourages employees to document the disposition; returning the barometer creates a clear record of compliance.
  reasoning:
    read: The employee accepted a $200 barometer from a prohibited source. Under 5 CFR §2635.206(a)(1) the only permissible
      dispositions are prompt return or reimbursement; destruction is barred because the value exceeds $100. The regulation
      also notes that the agency may keep the gift only if a specific statutory authority exists, which is absent here.
    weighing: Considerations C1, C2, and C5, grounded in the explicit regulatory language, outweigh the weak possibility noted
      in C3 that a statutory exception might exist. The employee’s desire to avoid embarrassment (C4) is irrelevant under
      the rule. Thus the balance points to returning the barometer.
    tradecraft: The employee should contact the donor immediately, arrange for the barometer’s safe return (e.g., via penalty
      mail), and send an email to the agency ethics official documenting the action per §2635.206(c).
    uncertainty: Minimal; the regulation is clear. The only uncertainty is whether a hidden statutory authority applies, which
      can be resolved by consulting the agency ethics official.
    handoff: The employee should act alone to return the item but must inform the agency ethics official to record the disposition
      and verify that no statutory authority applies.
    tempting_wrong:
      option: O1
      pull: Reimbursing the donor $200 might seem simpler than arranging a return.
      why_wrong: Reimbursement is allowed but returning the gift is the preferred and equally permissible action; the regulation
        does not require reimbursement when return is feasible.
    rejected:
      O1: Reimbursement is permissible but unnecessary because a prompt return is feasible and aligns with the regulation’s
        primary directive.
      O3: No statutory gift‑acceptance authority has been identified; therefore the agency cannot retain the barometer.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: A specific statutory gift‑acceptance authority authorizes the agency to retain the barometer
      then: O3
      why: The regulation permits agency retention when such authority exists, making a request for approval the appropriate
        step.
    would_not_change:
    - id: noflip1
      if: The employee’s motive is to avoid public embarrassment for the sponsor
      why: Motivation does not affect the statutory disposal requirement.
    watch_for:
    - id: watch1
      what: Confusion between reimbursement and return as equally acceptable options
      favors:
      - O2
      why: The regulation lists both, but returning the item is the preferred action when practicable.
  lesson: When a tangible gift from a prohibited source exceeds $100 in value and cannot be accepted, the employee must promptly
    return the item (or reimburse its market value). Destruction is not allowed, and agency retention requires a specific
    statutory authority.
  limits: This guidance applies only to tangible gifts from prohibited sources where no statutory gift‑acceptance authority
    exists. It does not cover intangible gifts, perishable items, or situations where the agency has explicit statutory permission
    to retain the gift.
