case:
  id: DR-OGE-2635-206a1-2-restyle1@v1
  title: Disposition of $200 Barometer Gift [restyle]
  status: needs_review
  setting: U.S. Department of the Interior, briefing on public land stewardship, present day
  decider: Senior ranger at the Department of the Interior
  agent: Senior ranger at the Department of the Interior
  agent_role: decide
  situation: During a briefing on public land stewardship, a senior ranger was handed a brass barometer valued at $200 by
    a prohibited vendor after the session. To avoid drawing attention to the awkward moment, the ranger did not refuse the
    item. Under 5 CFR §2635.206(a)(1), any gift whose market value exceeds $100 must be either returned to the donor or the
    donor reimbursed; destruction is prohibited. The ranger may (1) return the barometer, (2) reimburse the donor for its
    market price, or (3) request guidance from the agency ethics officer to determine if statutory authority permits retention.
  question: How should the senior ranger handle the $200 barometer received from the prohibited vendor?
  options:
    O1:
      do: Pay the donor $200 to fully reimburse the barometer's market value.
      move: act
      irreversible: true
    O2:
      do: Return the barometer promptly to the donor using certified direct mail.
      move: act
      irreversible: true
    O3:
      do: Seek guidance from the agency ethics officer about retaining the gift.
      move: ask
      irreversible: false
      to: agency ethics official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The senior ranger is employed by the Department of the Interior.
  - id: F2
    kind: situation
    status: confirmed
    fact: A prohibited vendor gave the ranger a barometer worth $200 after the briefing.
  - id: F3
    kind: capability
    status: confirmed
    fact: The barometer's fair-market price exceeds $100.
  - id: F4
    kind: authority
    status: confirmed
    fact: Section 2635.206(a)(1) mandates that a tangible gift over $100 be promptly returned or the donor reimbursed; the
      item may not be destroyed.
  - id: F5
    kind: authority
    status: confirmed
    fact: Retention is permissible only when a specific statutory gift-acceptance provision applies to the agency.
  - id: F6
    kind: situation
    status: confirmed
    fact: The ranger refrained from declining the gift to sidestep public awkwardness.
  - id: F7
    kind: authority
    status: confirmed
    fact: Employees must dispose of unacceptable gifts following the procedures outlined in §2635.206.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: strong
    why: Section 2635.206(a)(1) explicitly requires that any tangible gift whose market value exceeds $100 be either returned
      to the donor or the donor reimbursed; destruction is barred.
  - id: C2
    facts:
    - F5
    - F4
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: strong
    why: The agency may keep the gift only if a distinct statutory authority exists, which is absent here, so the default
      disposal routes—return or reimbursement—remain.
  - id: C3
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Returning the barometer swiftly satisfies the regulation's prompt-disposal requirement and avoids the extra paperwork
      involved in reimbursing the donor.
  reasoning:
    read: The ranger accepted a $200 barometer from a prohibited vendor to sidestep an uncomfortable moment. The pitfall is
      that personal discomfort does not outweigh the clear statutory directive for gifts over $100.
    weighing: Considerations C1 and C2 invoke the mandatory language of §2635.206(a)(1), limiting lawful actions to return
      or reimbursement. C3 notes that returning is the less burdensome option, tipping the balance toward {O2}. The agency's
      own Example 2 to paragraph (a)(1) aligns with this outcome.
    tradecraft: Securely package the barometer, dispatch it to the vendor via certified mail, and copy the agency ethics officer
      on a brief email that records the return date, shipping method, and tracking number.
    uncertainty: Minimal; the regulation plainly defines the disposal method for gifts exceeding $100.
    handoff: The ranger can execute the return independently but should inform the ethics officer to ensure the action is
      logged per §§2635.206(c) and (d).
    tempting_wrong:
      option: O1
      pull: Reimbursing the donor sidesteps the awkwardness of physically returning the item.
      why_wrong: While permissible, reimbursement adds unnecessary administrative steps and does not fulfill the donor's expectation
        of receiving the barometer back.
    rejected:
      O1: Reimbursement is allowed but is less efficient than a direct return and does not align with the regulation's preference
        for prompt return.
      O3: Seeking ethics-office guidance is sensible, yet the regulation already dictates the proper course; the ranger can
        return the barometer immediately without awaiting further approval.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the agency possessed a specific statutory provision authorizing acceptance of the barometer
      then: O3
      why: With such authority, the ranger could request confirmation to retain the gift rather than return it.
    would_not_change:
    - id: noflip1
      if: the ranger felt embarrassed about returning the item
      why: Personal embarrassment does not modify the statutory disposal requirement.
    watch_for:
    - id: watch1
      what: any effort to destroy a tangible gift valued above $100
      favors:
      - O1
      why: Destruction is expressly forbidden for items exceeding $100 under §2635.206(a)(1).
  lesson: When a federal employee receives a prohibited tangible gift worth more than $100, the only permissible dispositions
    are a prompt return to the donor or reimbursement of its market value; destruction is prohibited. The default, simplest
    compliant action is to return the item.
  limits: This guidance applies solely to tangible gifts from prohibited sources lacking a specific statutory acceptance authority.
    It does not cover perishable goods, intangible benefits, or gifts that fall under an explicit statutory exception.
