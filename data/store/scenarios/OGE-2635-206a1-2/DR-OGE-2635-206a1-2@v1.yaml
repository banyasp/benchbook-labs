case:
  id: DR-OGE-2635-206a1-2@v1
  title: Disposition of $200 Barometer Gift
  status: draft
  setting: National Park Service, speech on Federal lands policy, present time
  decider: National Park Service employee
  agent: National Park Service employee
  agent_role: decide
  situation: A National Park Service employee delivered a speech on Federal lands policy. At the conclusion of the speech,
    a prohibited source presented the employee with a barometer valued at $200. The employee chose not to decline the gift
    in order to avoid public embarrassment. Under 5 CFR §2635.206(a)(1), the employee must dispose of gifts that cannot be
    accepted. The barometer’s market value exceeds $100, so destruction is not permitted. The employee may either return the
    barometer, reimburse the donor the market value, or seek agency approval to retain the gift if statutory authority allows
    acceptance.
  question: What should the employee do with the $200 barometer gift?
  options:
    O1:
      do: Reimburse the donor $200 for the barometer’s value.
      move: act
      irreversible: true
    O2:
      do: Return the barometer to the donor promptly immediately.
      move: act
      irreversible: true
    O3:
      do: Ask the agency ethics official about the gift.
      move: ask
      irreversible: false
      to: agency ethics official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the National Park Service.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee received a barometer worth $200 from a prohibited source after a speech.
  - id: F3
    kind: capability
    status: confirmed
    fact: The barometer’s market value exceeds $100.
  - id: F4
    kind: authority
    status: confirmed
    fact: Under §2635.206(a)(1), the employee must promptly return the tangible item or pay the donor its market value; destruction
      is prohibited when the market value exceeds $100.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency may accept the gift if permitted under specific statutory gift‑acceptance authority.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee did not decline the gift to avoid public embarrassment.
  - id: F7
    kind: authority
    status: confirmed
    fact: Employees must dispose of gifts that cannot be accepted in accordance with the procedures set forth in §2635.206.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: strong
    why: §2635.206(a)(1) requires that a tangible gift whose market value exceeds $100 be promptly returned to the donor or
      the donor be reimbursed; destruction is prohibited.
  - id: C2
    facts:
    - F5
    - F4
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: strong
    why: The agency may retain the gift only if a specific statutory gift‑acceptance authority exists, which is not present
      here, so the default disposal options apply.
  - id: C3
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Returning the barometer promptly satisfies the regulation’s emphasis on prompt disposal and avoids the administrative
      burden of reimbursing the donor.
  reasoning:
    read: The employee accepted a $200 barometer from a prohibited source to avoid public embarrassment. The trap is that
      personal discomfort does not override the clear statutory disposal requirement for gifts over $100.
    weighing: Considerations C1 and C2 invoke the binding language of §2635.206(a)(1), which leaves only return or reimbursement
      as lawful options. C3 notes that returning is the simpler, less burdensome path, so the balance tips to {O2}. The source’s
      own Example 2 to paragraph (a)(1) mirrors this conclusion.
    tradecraft: The employee should package the barometer securely, send it back to the donor via penalty mail, and copy the
      agency ethics official on an email documenting the return date, method, and any tracking number.
    uncertainty: Minimal; the regulation is explicit about the disposal method for gifts over $100.
    handoff: The employee may act alone to return the item but should notify the agency ethics official to ensure the action
      is recorded per §2635.206(c) and §2635.206(d).
    tempting_wrong:
      option: O1
      pull: Reimbursing the donor avoids the awkwardness of returning the gift.
      why_wrong: Reimbursement is permitted but adds unnecessary administrative steps and does not address the donor’s expectation
        of receiving the item back.
    rejected:
      O1: Reimbursement is allowed but is less efficient than a direct return and does not satisfy the prompt‑return preference
        expressed in the regulation.
      O3: Consulting the ethics official is prudent, but the regulation already dictates the correct action; the employee
        can return the barometer immediately without awaiting further guidance.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the agency possessed specific statutory gift‑acceptance authority that permitted acceptance of the barometer
      then: O3
      why: With statutory authority, the employee could seek confirmation to retain the gift rather than return it.
    would_not_change:
    - id: noflip1
      if: the employee felt embarrassed by returning the gift
      why: Personal embarrassment does not alter the statutory disposal requirement.
    watch_for:
    - id: watch1
      what: any attempt to destroy a tangible gift valued over $100
      favors:
      - O1
      why: Destruction is expressly prohibited for items exceeding $100 under §2635.206(a)(1).
  lesson: When a federal employee receives a prohibited tangible gift valued over $100, the only permissible disposals are
    prompt return to the donor or reimbursement of its market value; destruction is not allowed. The default action should
    be the simplest compliant method—returning the item.
  limits: This rule applies only to tangible gifts from prohibited sources where no statutory acceptance authority exists.
    It does not govern perishable items, intangible benefits, or gifts that fall under a specific statutory exception.
