case:
  id: DR-OGE-2635-206a1-2-addfact1@v1
  title: Disposition of $200 Barometer Gift [addfact]
  status: needs_review
  setting: U.S. National Park Service, briefing on federal land stewardship, present day
  decider: Park Service staff member
  agent: Park Service staff member
  agent_role: decide
  situation: A staff member of the National Park Service delivered a briefing on federal land stewardship. After the talk,
    a prohibited source handed the employee a barometer worth $200. The employee did not refuse the gift to avoid a public
    scene. The employee's direct supervisor informally suggested the barometer might aid upcoming field measurements and hinted
    that retaining it would be permissible. Because the barometer's market price exceeds $100, §2635.206(a)(1) requires the
    employee either to return the item promptly or to reimburse the donor for its market value; destruction is not allowed
    when the value is over $100. Agency policy allows acceptance if specific statutory gift-acceptance authority applies,
    and employees must dispose of gifts that cannot be accepted according to the procedures in §2635.206.
  question: How should the staff member handle the $200 barometer?
  options:
    O1:
      do: Pay the donor the barometer's full market value of $200.
      move: act
      irreversible: true
    O2:
      do: Return the barometer to the donor promptly and without delay.
      move: act
      irreversible: true
    O3:
      do: Consult the agency ethics official to determine the proper course.
      move: ask
      irreversible: false
      to: agency ethics official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee's direct supervisor informally suggested that the barometer could be useful for upcoming field measurements
      and hinted it would be acceptable to retain it.
  - id: F2
    kind: situation
    status: confirmed
    fact: The individual is employed by the National Park Service.
  - id: F3
    kind: situation
    status: confirmed
    fact: After concluding a presentation, the employee accepted a barometer valued at $200 from a prohibited source.
  - id: F4
    kind: capability
    status: confirmed
    fact: The barometer's market price exceeds $100.
  - id: F5
    kind: authority
    status: confirmed
    fact: According to §2635.206(a)(1), the employee must either promptly return the item or compensate the donor for its
      market value; destruction is barred when the value is over $100.
  - id: F6
    kind: authority
    status: confirmed
    fact: Agency policy permits acceptance of a gift if specific statutory gift-acceptance authority applies.
  - id: F7
    kind: situation
    status: confirmed
    fact: The employee refrained from refusing the gift to avoid causing a scene.
  - id: F8
    kind: authority
    status: confirmed
    fact: Employees are required to dispose of gifts that cannot be accepted following the procedures outlined in §2635.206.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: strong
    why: Section 2635.206(a)(1) obliges the employee to either return the barometer or reimburse its $200 market value; because
      the item exceeds $100, destruction is prohibited.
  - id: C2
    facts:
    - F6
    - F5
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: strong
    why: Agency policy permits retention only when a specific statutory gift-acceptance authority exists, which is absent,
      so the disposal options in §2635.206 apply.
  - id: C3
    facts:
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Prompt return fulfills the regulation's emphasis on swift disposal and avoids the administrative effort of reimbursing
      the donor.
  - id: C4
    facts:
    - F1
    equity: statutory_authority
    favors:
    - O2
    weight: weak
    why: The supervisor’s informal suggestion cannot override the statutory requirement that gifts over $100 be returned or
      reimbursed.
  reasoning:
    read: The employee accepted a $200 barometer from a prohibited source after a briefing, declining to refuse it to avoid
      a scene. Although the supervisor hinted the instrument might be useful, the statutory disposal rule dominates.
    weighing: Considerations C1 and C2 invoke the mandatory language of §2635.206(a)(1), limiting lawful actions to return
      or reimbursement; C3 notes that returning is the less burdensome path, and NC1 confirms that the supervisor's informal
      suggestion does not change the legal requirement. Consequently the balance favors {O2}.
    tradecraft: Package the barometer securely, ship it back to the donor via traceable mail, and copy the agency ethics official
      on a brief email documenting the return date, carrier, and tracking number.
    uncertainty: Low; the regulation explicitly prescribes the disposal options for gifts over $100.
    handoff: The staff member may execute the return independently but should inform the ethics official to create an official
      record per §2635.206(c)-(d).
    tempting_wrong:
      option: O1
      pull: Reimbursing the donor avoids the awkwardness of returning the gift.
      why_wrong: Reimbursement is permitted but adds unnecessary administrative steps and does not satisfy the donor's expectation
        of receiving the item back.
    rejected:
      O1: Reimbursement is allowed but is less efficient than a direct return and does not satisfy the prompt-return preference
        expressed in the regulation.
      O3: Consulting the ethics official is prudent, but the regulation already dictates the correct action; the employee
        can return the barometer immediately without awaiting further guidance.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the agency possessed specific statutory gift-acceptance authority that permitted acceptance of the barometer
      then: O3
      why: With such authority the employee could seek confirmation to retain the item rather than return it.
    would_not_change:
    - id: noflip1
      if: the employee felt embarrassed by returning the gift
      why: Personal embarrassment does not modify the statutory disposal mandate.
    watch_for:
    - id: watch1
      what: any attempt to destroy a tangible gift valued over $100
      favors:
      - O1
      why: Destruction is expressly forbidden for items above $100 under §2635.206(a)(1).
  lesson: When a federal employee receives a prohibited tangible gift valued over $100, the only permissible disposals are
    prompt return to the donor or reimbursement of its market value; destruction is not allowed. The default action should
    be the simplest compliant method—returning the item.
  limits: This rule applies only to tangible gifts from prohibited sources where no specific statutory acceptance authority
    exists. It does not govern perishable items, intangible benefits, or gifts that fall under a distinct statutory exception.
