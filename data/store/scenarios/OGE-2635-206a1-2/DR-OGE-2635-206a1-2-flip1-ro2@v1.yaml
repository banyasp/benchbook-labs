case:
  id: DR-OGE-2635-206a1-2-flip1-ro2@v1
  title: Disposition of $200 Barometer Gift [flip]
  status: needs_review
  setting: U.S. Department of the Interior, National Park Service public briefing on land stewardship, present day
  decider: Park Service staff member
  agent: Park Service staff member
  agent_role: decide
  situation: During a briefing on federal land stewardship, a staff member was presented with a brass barometer valued at
    $200 by a prohibited source. The employee did not refuse the item to avoid causing a scene. Under 5 CFR §2635.206(a)(1),
    a tangible gift over $100 must be either returned to the donor or the donor reimbursed; destruction is prohibited. However,
    16 U.S.C. §460c authorizes the Service to retain scientific instruments worth $500 or less for official use, potentially
    allowing the barometer to be kept if proper approval is obtained.
  question: How should the employee handle the $200 barometer gift?
  options:
    O1:
      do: Pay the donor $200 to reimburse the barometer's market value.
      move: act
      irreversible: true
    O2:
      do: Consult the agency ethics official before taking any further action.
      move: ask
      irreversible: false
      to: agency ethics official
    O3:
      do: Send the barometer back to the donor without delay.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is a member of the National Park Service.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee received a $200 brass barometer from a prohibited source after the briefing.
  - id: F3
    kind: capability
    status: confirmed
    fact: The barometer's market value exceeds $100.
  - id: F4
    kind: authority
    status: confirmed
    fact: 5 CFR §2635.206(a)(1) requires a prompt return or reimbursement for tangible gifts over $100; destruction is not
      allowed.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency may retain a gift only when a specific statutory gift-acceptance authority applies.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee declined to refuse the gift in order to avoid public embarrassment.
  - id: F7
    kind: authority
    status: confirmed
    fact: 'F8 [authority, confirmed]: Under 16 U.S.C. § 460c, the National Park Service is authorized to retain donated scientific
      instruments valued at $500 or less for operational use.'
  - id: F8
    kind: authority
    status: confirmed
    fact: Employees must dispose of gifts that cannot be accepted in accordance with the procedures set forth in §2635.206.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    - O3
    weight: strong
    why: §2635.206(a)(1) mandates that a tangible gift exceeding $100 be either returned to the donor or reimbursed; destroying
      the item is prohibited.
  - id: C2
    facts:
    - F5
    - F7
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 16 U.S.C. §460c provides a specific statutory basis for retaining scientific instruments up to $500, so the employee
      must seek ethics-office clarification before deciding whether to keep or dispose of the barometer.
  - id: C3
    facts:
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: Returning the barometer promptly would satisfy the regulation's emphasis on swift disposal and avoid the administrative
      effort of reimbursement.
  reasoning:
    read: The employee accepted a $200 barometer from a prohibited source to sidestep an awkward moment. The key issue is
      that a statutory exception now exists that could permit retention, but the employee lacks confirmation that the exception
      applies to this specific item.
    weighing: C1 still limits the employee to return or reimburse unless an exception applies. C2 introduces a statutory authority
      (16 U.S.C. §460c) that could allow retention, making the correct next step to obtain guidance from the ethics official.
      C3 notes that returning is easy, but without confirmation of the exception the employee risks a violation. Consequently,
      the balance points to {O2}.
    tradecraft: The employee should draft a concise request to the agency ethics official, outlining the gift's details, the
      statutory authority, and asking whether retention is permissible. The request should be documented and kept on file.
    uncertainty: Moderate; while the statutory authority exists, its applicability to this particular barometer is unclear
      without ethics-office interpretation.
    handoff: The employee should forward the request to the ethics official and await a written determination before taking
      any disposal action.
    tempting_wrong:
      option: O3
      pull: Returning the barometer immediately avoids any potential controversy.
      why_wrong: Returning the item precludes the possibility of a lawful retention under the statutory exception, and proceeds
        without confirming the agency's authority.
    rejected:
      O1: Reimbursement fulfills the regulation but adds unnecessary paperwork when the agency may be able to keep the instrument.
      O3: Returning the barometer complies with the rule but ignores the statutory authority that could allow retention; without
        ethics guidance the employee cannot be sure the return is required.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the agency lacked any statutory gift-acceptance authority that would permit retention of the barometer
      then: O3
      why: Without a statutory exception, the employee must follow §2635.206(a)(1) and return the gift promptly.
    would_not_change:
    - id: noflip1
      if: the employee felt embarrassed by returning the gift
      why: Personal discomfort does not modify the statutory disposal requirement.
    watch_for:
    - id: watch1
      what: any attempt to destroy a tangible gift valued over $100
      favors:
      - O1
      why: Destruction is expressly prohibited for items exceeding $100 under §2635.206(a)(1).
  lesson: When a federal employee receives a prohibited tangible gift that exceeds $100, the default options are return or
    reimbursement. However, if a specific statutory gift-acceptance authority exists, the employee must first obtain ethics-office
    guidance to determine whether retention is permissible before acting.
  limits: This guidance applies only to tangible gifts from prohibited sources where a statutory exception may exist. It does
    not cover perishable items, intangible benefits, or gifts that fall under other statutory exemptions.
