case:
  id: DR-CORPUS-INC-2016-PRESIDENTIAL-CANDIDATE-INTELLIGENCE-NX-879619ff-E1@v1
  title: Briefing Presidential Candidates
  status: draft
  setting: 2016 campaign, Office of the Director of National Intelligence.
  decider: The Director of National Intelligence
  agent: The Director of National Intelligence
  agent_role: decide
  situation: During the 2016 campaign, calls arose to suspend intelligence briefings for both candidates. One candidate faced
    a classified-email controversy, and opponents asserted that the other could not be trusted to protect classified information.
    Both candidates had been formally nominated. Denying a candidate briefing would have been unprecedented. The Office of
    the Director of National Intelligence managed the decision whether to brief candidates.
  question: What should the Director of National Intelligence do about whether to provide both candidates the opportunity
    to receive intelligence briefings after formal nominations?
  options:
    O1:
      do: The Director of National Intelligence withholds from both candidates the opportunity to receive intelligence briefings
        after formal nominations.
      move: act
      irreversible: false
    O2:
      do: The Director of National Intelligence provides both candidates the opportunity to receive intelligence briefings
        after formal nominations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision arose during the 2016 campaign.
  - id: F2
    kind: situation
    status: confirmed
    fact: Some quarters called for intelligence briefings to be suspended for both candidates.
  - id: F3
    kind: situation
    status: confirmed
    fact: One candidate faced a classified-email controversy.
  - id: F4
    kind: situation
    status: assessed
    fact: Opponents asserted that the other candidate could not be trusted to protect classified information.
  - id: F5
    kind: situation
    status: confirmed
    fact: Denying a candidate an intelligence briefing would have been unprecedented.
  - id: F6
    kind: authority
    status: confirmed
    fact: Since 2008, management of the briefings and the decision whether to brief candidates had rested with the Office
      of the Director of National Intelligence.
  - id: F7
    kind: situation
    status: confirmed
    fact: Both candidates had been formally nominated.
  considerations:
  - id: C1
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Denying a candidate a briefing would have been unprecedented, weighing against withholding the opportunity.
  - id: C2
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: With both candidates formally nominated, the DNI considered it the appropriate time to extend the opportunity.
  - id: C3
    facts:
    - F3
    - F4
    - F6
    equity: impartiality
    favors:
    - O2
    weight: strong
    why: The email controversy and the opponents’ assertion raised suitability concerns, but the DNI said deciding candidates’
      suitability was not for the administration or the DNI; the electorate would decide.
  reasoning:
    read: The decision was whether to extend the established briefing opportunity despite concerns raised about both candidates.
      The trap was to treat those concerns as a basis for the DNI to decide which candidates were suitable, rather than leave
      that judgment to the electorate.
    weighing: The unprecedented nature of denying a briefing, the fact that both candidates had been formally nominated, and
      the DNI’s stated view that suitability belonged to the electorate together favor providing both candidates the opportunity.
      The choice rests on the distinction between the DNI managing the briefing decision and the electorate deciding candidate
      suitability.
    tradecraft: Provide both candidates the opportunity on the same basis and record the nomination status and the rationale
      that suitability was left to the electorate. The source does not specify further implementation steps.
    uncertainty: The stated concerns include a classified-email controversy and opponents’ assertions about protecting classified
      information; the passage gives no further assessment of those concerns.
    handoff: The DNI makes the briefing decision within the ODNI’s assigned role; the electorate, not the DNI, decides candidate
      suitability.
    tempting_wrong:
      option: O1
      pull: Withholding briefings may appear responsive to the controversies and concerns raised about the candidates.
      why_wrong: The DNI rejected making briefing access a judgment on candidate suitability, and denying a briefing would
        have been unprecedented.
    rejected:
      O1: The DNI did not withhold the opportunity, concluding that it was appropriate to offer briefings after formal nominations
        and that candidate suitability was for the electorate to decide.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A binding legal or security restriction made providing either candidate the opportunity impermissible.
      then: O1
      why: The recommendation to provide the opportunity would not override a binding restriction.
    would_not_change:
    - id: noflip1
      if: The concerns remain the controversies and assertions described, without a binding restriction.
      why: Those concerns do not change the DNI’s stated view that candidate suitability is for the electorate, nor the fact
        that both candidates had been formally nominated.
    watch_for:
    - id: watch1
      what: Whether a binding legal or security restriction applies to providing the opportunity.
      favors:
      - O1
      why: Such a restriction could displace the recommendation to provide both candidates the opportunity.
  lesson: When the decision-maker’s role is to administer access rather than determine a candidate’s political suitability,
    do not convert controversy or opponents’ assertions into a unilateral suitability judgment. Apply the established timing
    and leave the ultimate suitability decision to the electorate.
  limits: This reasoning addresses the opportunity for intelligence briefings after formal nominations and the DNI’s stated
    allocation of suitability judgments to the electorate. It does not decide what to do if a binding legal or security restriction
    applies.
