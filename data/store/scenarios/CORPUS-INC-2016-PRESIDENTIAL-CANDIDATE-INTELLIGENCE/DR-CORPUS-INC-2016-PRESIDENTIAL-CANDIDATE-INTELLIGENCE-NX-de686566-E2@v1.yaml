case:
  id: DR-CORPUS-INC-2016-PRESIDENTIAL-CANDIDATE-INTELLIGENCE-NX-de686566-E2@v1
  title: Candidate Intelligence Briefing Access
  status: draft
  setting: Office of the Director of National Intelligence, July 2016, candidate intelligence briefings
  decider: The DNI
  agent: The DNI
  agent_role: decide
  situation: Lawmakers asked the DNI to withhold classified intelligence briefings from a presidential candidate. They relied
    on public claims by the FBI Director about the candidate’s handling of classified information, and a committee member
    characterized the matter as a national security issue. The committee member also claimed that American lives were at risk.
    The briefing practice for presidential and vice-presidential candidates was to provide classified briefings based on their
    status as candidates, without requiring separate security clearances beforehand. Candidate briefings were to be even-handed
    and nonpartisan; candidates were advised that the material was classified, and operational policy matters were not addressed.
  question: What should the DNI do about the lawmakers’ request to withhold classified briefings from the candidate?
  options:
    O1:
      do: The DNI withholds classified briefings from the candidate named in the lawmakers’ request.
      move: act
      irreversible: false
    O2:
      do: The DNI provides the candidate with classified briefings on an even-handed, nonpartisan basis.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The House Speaker asked the DNI to withhold classified intelligence information from the candidate.
  - id: F2
    kind: situation
    status: confirmed
    fact: The HPSCI chair and a committee member sent similar requests to the DNI.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The lawmakers cited the FBI Director’s public characterization of the candidate’s and staff’s handling of classified
      information as extremely careless.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A committee member characterized the alleged mishandling as a national security issue and claimed American lives
      were at risk.
  - id: F5
    kind: authority
    status: confirmed
    fact: Presidential and vice-presidential nominees received classified briefings by virtue of their status as candidates
      and did not need separate security clearances beforehand.
  - id: F6
    kind: authority
    status: confirmed
    fact: Candidate briefings were to be provided on an even-handed, nonpartisan basis.
  - id: F7
    kind: authority
    status: confirmed
    fact: Candidates were advised that briefing material was classified, and operational policy matters were not addressed
      in the briefings.
  considerations:
  - id: C1
    facts:
    - F5
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: The established practice provided classified briefings to presidential and vice-presidential nominees by virtue of
      their candidate status, without requiring separate security clearances beforehand.
  - id: C2
    facts:
    - F6
    equity: impartiality
    favors:
    - O2
    weight: strong
    why: The DNI said candidate briefings would be even-handed and nonpartisan, supporting consistent treatment rather than
      withholding a briefing based on lawmakers’ request.
  - id: C3
    facts:
    - F7
    equity: classification_integrity
    favors:
    - O2
    weight: weak
    why: The briefing practice included advising candidates that the material was classified and excluding operational policy
      matters.
  - id: C4
    facts:
    - F3
    - F4
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: The lawmakers’ cited concerns about classified-information handling and risk to American lives create a security-based
      reason to withhold, but the DNI did not treat those claims as overriding the candidate-briefing standard.
  reasoning:
    read: This is a decision about applying the candidate-briefing practice, not deciding the underlying dispute about email
      handling. The trap is allowing politically charged claims to turn a status-based, nonpartisan briefing decision into
      a discretionary judgment about which candidate the DNI thinks should receive briefings.
    weighing: The security concerns cited by lawmakers pull toward withholding {O1}, but the DNI’s stated standard was that
      officially nominated, eligible candidates receive briefings by virtue of candidate status, on an even-handed and nonpartisan
      basis. The classification warning and exclusion of operational policy matters were part of that practice. The DNI also
      said it was not his call who gets briefed; the electorate decides. On these facts, the standard and the commitment to
      impartiality outweigh the lawmakers’ claims.
    tradecraft: Apply the candidate-status standard consistently. Provide the briefing on an even-handed, nonpartisan basis,
      advise that the material is classified, exclude operational policy matters, and record the basis for treating the candidate
      consistently with the stated practice.
    uncertainty: The concerns in the lawmakers’ letters are presented as claims grounded in a public FBI Director statement;
      this account does not resolve the underlying email dispute or provide a separate assessment of the claimed risk.
    handoff: The DNI should apply the stated briefing practice rather than decide the candidate’s fitness for office; the
      DNI placed the choice of who becomes president with the electorate.
    tempting_wrong:
      option: O1
      pull: The lawmakers characterized the alleged handling as a national security issue and claimed American lives were
        at risk.
      why_wrong: The DNI’s stated basis for briefing was candidate status and even-handed, nonpartisan treatment, not a discretionary
        assessment of the candidate based on the lawmakers’ claims.
    rejected:
      O1: The DNI declined to withhold the briefing because eligible nominees received it by virtue of candidate status under
        an even-handed, nonpartisan practice.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The candidate were not an officially nominated, eligible candidate.
      then: O1
      why: The DNI’s stated briefing practice applied to officially nominated, eligible candidates; without that status, its
        stated basis for providing the briefing would not apply.
    would_not_change:
    - id: noflip1
      if: Lawmakers repeated the same claims about careless handling and risk to American lives without changing the candidate’s
        eligibility or the governing briefing practice.
      why: Those claims were the stated basis for the request, but the DNI applied the candidate-status and even-handed briefing
        standard rather than treating the claims as a reason to withhold.
    watch_for: []
  lesson: When a briefing practice grants access by candidate status and requires even-handed, nonpartisan treatment, apply
    that standard consistently rather than making access turn on politically charged allegations. Preserve the stated safeguards
    for classified material and keep the decision within the DNI’s role.
  limits: This reasoning concerns the candidate-briefing practice described here and does not resolve the underlying allegations
    or establish what rules govern other forms of access. It does not determine what should happen if a candidate is not officially
    nominated or eligible, or if a different controlling authority applies.
