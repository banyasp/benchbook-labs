case:
  id: DR-CORPUS-INC-2016-PRESIDENTIAL-CANDIDATE-INTELLIGENCE-NX-de686566-E5@v1
  title: Interrogation Policy After the Inauguration
  status: draft
  setting: The United States presidency and senior national-security leadership, the week after the inauguration.
  decider: The President
  agent: The President
  agent_role: decide
  situation: The President was considering whether to permit a return to enhanced interrogation techniques such as waterboarding
    or leave the decision to senior officials. In 2015, Army Field Manual interrogation guidelines excluding harsh techniques
    were written into law. The CIA director had publicly opposed a return to waterboarding and said it had harmed the Agency,
    while the Agency followed White House guidance to adhere to the Army Field Manual. Senior national-security nominees expressed
    opposition to torture or harsh interrogation and assurances against unlawful activity. The President believed waterboarding
    worked, while the officials' views raised questions about effectiveness, legality, and who should decide.
  question: What should the President do about possible resumption of enhanced interrogation techniques, including whether
    to authorize their use or defer to senior officials' judgments?
  options:
    O1:
      do: The President prohibits senior national-security officials from resuming enhanced interrogation techniques.
      move: act
      irreversible: false
    O2:
      do: The President authorizes senior national-security officials to resume enhanced interrogation techniques.
      move: act
      irreversible: false
    O3:
      do: The President defers the resumption decision to senior national-security officials and accepts their judgment.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: In 2015, Army Field Manual interrogation guidelines that excluded harsh techniques were written into law.
  - id: F2
    kind: situation
    status: confirmed
    fact: The CIA's enhanced interrogation techniques, primarily waterboarding, had been developed and used during the early
      Bush administration.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The President publicly asserted that torture works and supported resuming waterboarding.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The CIA director opposed waterboarding and said its use had undermined the Agency.
  - id: F5
    kind: authority
    status: confirmed
    fact: The CIA director had not changed the Agency's internal regulations to flatly forbid enhanced interrogation techniques,
      but ensured the Agency followed White House guidance to adhere to the Army Field Manual.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The nominee to lead the CIA promised that the Agency would not engage in unlawful activity and said he would not
      restart enhanced interrogation techniques.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The nominee to lead the Department of Homeland Security disavowed torture and said interrogation should not cross
      a line beyond what the country would accept.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The nominee to lead the Department of Defense opposed harsh interrogation techniques and argued they were less effective
      than other means of questioning.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The President said he believed waterboarding worked.
  - id: F10
    kind: authority
    status: confirmed
    fact: The President said he would rely on senior officials' judgment about whether to use techniques such as waterboarding
      and would accept their opposition to using them.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    - O3
    weight: strong
    why: The Army Field Manual guidelines excluding harsh techniques had been written into law, the CIA was following White
      House guidance to adhere to them, and the incoming CIA director assured the Senate that the Agency would not engage
      in unlawful activity. These constraints weigh against authorizing a resumption without a lawful basis.
  - id: C2
    facts:
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    - O3
    weight: strong
    why: The CIA director opposed waterboarding and said the Agency had been undermined by its experience with it. The Agency's
      adherence to White House guidance reflected a course intended to avoid repeating that institutional damage.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    - O3
    weight: strong
    why: The senior national-security nominees opposed restarting harsh techniques or torture, and the CIA nominee promised
      the Agency would not engage in unlawful activity. Their views gave the President a basis to defer rather than direct
      a resumption.
  - id: C4
    facts:
    - F8
    - F9
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The President believed waterboarding worked, but the defense nominee argued harsh interrogation was less effective
      than other means. The competing assessments made the officials' judgment relevant to the decision.
  - id: C5
    facts:
    - F3
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The President publicly supported resuming waterboarding and believed it worked. That belief favored authorization,
      but did not resolve the legal and institutional concerns or the officials' contrary judgments.
  reasoning:
    read: This was not only a question of whether the President personally believed waterboarding worked. The governing legal
      constraint, the CIA's experience, and senior officials' judgments all mattered; the trap was allowing a belief about
      effectiveness to settle questions of legality and institutional responsibility.
    weighing: The legal framework and officials' opposition weigh against authorizing resumption {C1} {C3}, while the CIA
      director's warning about harm to the Agency adds an institutional reason for restraint {C2}. The President's belief
      that waterboarding worked is a consideration, but the defense nominee offered a contrary view of effectiveness {C4}
      {C5}. On this record, the President's stated course—relying on senior officials' judgment and accepting their opposition—best
      fits the competing considerations {F10}. The balance depends in particular on the applicable legal limits and the officials'
      judgments about legality and effectiveness.
    tradecraft: Keep the decision within the legal limits, make clear that deference does not authorize unlawful conduct,
      and record the officials' judgments and the basis for relying on them.
    uncertainty: The record presents the President's and officials' views about effectiveness but does not establish a settled
      empirical answer. It also does not spell out every legal boundary for every technique.
    handoff: The President chose to rely on senior national-security officials rather than decide the question solely on his
      own view; their judgments mattered because they held responsibility for the relevant agencies and departments.
    tempting_wrong:
      option: O2
      pull: The President believed waterboarding worked and supported resuming it.
      why_wrong: That belief alone did not answer whether resumption would comply with the legal limits or overcome the CIA
        director's and nominees' objections.
    rejected:
      O1: The President did not impose a blanket prohibition himself; he said he would leave the decision to senior officials
        and accept their judgment.
      O2: The President did not authorize resumption, choosing instead to defer to senior officials despite his belief that
        waterboarding worked.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The applicable law were changed or authoritatively clarified to permit the techniques at issue, and senior officials
        judged their use lawful and effective.
      then: O2
      why: That would materially reduce the legal and professional grounds for deferring against resumption.
    - id: flip2
      if: Senior officials concluded that the techniques at issue were unlawful.
      then: O1
      why: An unlawful course should not be left available for resumption.
    would_not_change:
    - id: noflip1
      if: The President continued to believe waterboarding worked, without new information resolving the legal concerns or
        changing the officials' judgments.
      why: The President held that belief and nevertheless said he would defer to the officials and accept their opposition.
    watch_for:
    - id: watch1
      what: Any change in the applicable legal limits or in senior officials' judgments about whether the techniques are lawful
        and effective.
      favors:
      - O1
      - O2
      - O3
      why: The legal framework and officials' judgments are central to the stated basis for deferring.
  lesson: A leader's belief that a measure works does not settle whether it is lawful or institutionally sound. When law constrains
    the choice and responsible senior officials oppose resumption, their judgment can be a reason to defer rather than authorize.
  limits: This conclusion addresses whether the President should defer on resumption under the stated legal framework and
    officials' views. It does not establish the legality or effectiveness of every interrogation technique, or resolve how
    later changes in law, policy, or circumstances would affect the decision.
