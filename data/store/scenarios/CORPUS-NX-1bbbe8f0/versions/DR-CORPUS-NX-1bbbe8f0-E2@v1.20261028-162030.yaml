case:
  id: DR-CORPUS-NX-1bbbe8f0-E2@v1
  title: Sharing Intercept-Derived Information
  status: draft
  setting: United States Coast Guard, during Prohibition enforcement after the 18 August 1930 interagency meeting.
  decider: The Coast Guard
  agent: The Coast Guard
  agent_role: decide
  situation: During Prohibition enforcement, an interagency cooperative system established at an 18 August 1930 meeting had
    contributed to enforcement. Experience with collaboration also raised concern about protecting sources and methods. Rumrunners
    knew the Coast Guard was intercepting and trying to read their traffic, but generally trusted their communications systems
    unless an informant told them those systems had been compromised. Information about analytic success shared among government
    agencies invariably became known to rumrunners. The Coast Guard must choose how much intercept-derived information to
    distribute among partner agencies.
  question: What should the Coast Guard do about distributing intercept-derived information among cooperating government agencies?
  options:
    O1:
      do: The Coast Guard withholds paraphrased intercept-derived information and cryptanalytic details from cooperating agencies.
      move: act
      irreversible: true
    O2:
      do: The Coast Guard shares paraphrased intercept-derived information with cooperating agencies and withholds cryptanalytic
        details.
      move: partial
      irreversible: true
    O3:
      do: The Coast Guard discloses paraphrased intercept-derived information and cryptanalytic details to cooperating agencies.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An interagency cooperative system was established at the 18 August 1930 meeting.
  - id: F2
    kind: situation
    status: confirmed
    fact: The cooperative system contributed greatly to agencies' success in enforcing Prohibition laws.
  - id: F3
    kind: situation
    status: confirmed
    fact: Collaboration with other agencies raised the problem of protecting sources and methods from compromise.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Rumrunners knew the Coast Guard was intercepting and trying to read their traffic.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Rumrunners usually trusted their communications systems until an informant told them a system had been compromised.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Information about analytic success distributed among government agencies invariably became known to rumrunners.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: strong
    why: The cooperative system contributed greatly to successful Prohibition enforcement, supporting continued sharing with
      partner agencies.
  - id: C2
    facts:
    - F3
    - F6
    equity: source_protection
    favors:
    - O1
    - O2
    weight: strong
    why: Collaboration created a source-and-methods protection problem, and information about analytic success shared among
      agencies invariably reached rumrunners.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: source_protection
    favors:
    - O1
    - O2
    weight: strong
    why: Rumrunners knew they were being intercepted but generally continued to trust their systems unless informed of a compromise;
      disclosing analytic success could give them that warning.
  reasoning:
    read: 'The Coast Guard faced a real tension: cooperation aided enforcement, but sharing sensitive information could tell
      smugglers that their communications protections had failed. The trap is treating the fact that rumrunners knew about
      interception as if they also knew the Coast Guard''s analytic success; the source distinguishes those things.'
    weighing: '{C1} supports continued interagency sharing, while {C2} and {C3} weigh against revealing details that expose
      analytic success. The balance favors sharing paraphrased information while withholding technical details: it preserves
      the cooperation that aided enforcement without disclosing the information that was reaching rumrunners.'
    tradecraft: Distribute paraphrased intercept-derived information for enforcement use, but exclude details about communications
      systems and the degree of analytic success, including from other Coast Guard units. Keep the restriction clear in dissemination
      policy and review proposed products against it before release.
    uncertainty: The reasons establish that analytic-success information shared among agencies reached rumrunners, but do
      not establish controls that would reliably prevent such disclosure or quantify the value of any particular technical
      detail.
    handoff: The Coast Guard is the identified decision-maker for its dissemination policy; no separate approving authority
      or required handoff is identified.
    tempting_wrong:
      option: O3
      pull: Full disclosure might appear to maximize the benefits of interagency cooperation.
      why_wrong: The source's experience was that information about analytic success distributed among agencies invariably
        reached rumrunners, risking the very source-and-methods protection the Coast Guard needed.
    rejected:
      O1: Withholding paraphrased information as well as sensitive details would give up a form of sharing that supported
        the cooperative enforcement effort.
      O3: Disclosing cryptanalytic details would risk informing rumrunners that their systems had been compromised.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable safeguards made it possible to share technical details with partner agencies without those details reaching
        rumrunners.
      then: O3
      why: That would reduce the source-and-methods risk that made full disclosure unacceptable while retaining the benefits
        of cooperation.
    - id: flip2
      if: Even paraphrased information could not be shared without exposing sources or methods.
      then: O1
      why: The protection concern would then extend to the information O2 proposes to share.
    would_not_change:
    - id: noflip1
      if: Rumrunners already knew the Coast Guard was intercepting their traffic.
      why: That fact alone would not establish that they knew their systems had been compromised; the source distinguishes
        awareness of interception from knowledge of analytic success.
    watch_for:
    - id: watch1
      what: Evidence that paraphrased disclosures themselves are revealing source or method information to rumrunners.
      favors:
      - O1
      why: It would weaken the case for continuing even the limited sharing allowed by O2.
  lesson: When collaboration advances a mission but disclosure can expose sources or methods, separate useful operational
    information from details that reveal analytic success. Share the former when it supports the mission, and restrict the
    latter when experience shows it reaches the adversary.
  limits: This reasoning addresses the Coast Guard's dissemination choice in the stated Prohibition-era circumstances. It
    does not establish a general legal rule for information sharing or resolve cases where law, binding orders, or reliable
    safeguards require or permit different disclosure.
  library:
    domain: intel-oversight
    family: CORPUS-NX-1bbbe8f0
    source: https://media.defense.gov/2021/Jul/13/2002761513/-1/-1/0/RUMRUNNERS.PDF
    episode_focus: The policy choice was whether to distribute intercept-derived information more fully or limit dissemination
      to protect the source and methods. The Coast Guard chose to share paraphrases but restrict cryptanalytic details after
      information about a solved system reached smugglers; exclude the technical details of the system and how it was solved.
    cues:
      option_words:
        O1: 13
        O2: 14
        O3: 13
      real_option: O2
      real_to_mean_other_length: 1.08
      real_is_longest: true
      moves:
        O1: act
        O2: partial
        O3: act
      real_move: partial
      irreversible_flags:
        O1: true
        O2: true
        O3: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The Coast Guard's stated policy was to freely forward paraphrased intercept-derived information while prohibiting disclosure
  of information about rumrunner communications systems or the degree of analytic success.
