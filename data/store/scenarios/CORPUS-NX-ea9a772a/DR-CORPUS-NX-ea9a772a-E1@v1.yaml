case:
  id: DR-CORPUS-NX-ea9a772a-E1@v1
  title: Control in Czechoslovakia
  status: draft
  setting: Czechoslovakia during the liberalization crisis; a Soviet and Warsaw Pact policy decision
  decider: The USSR and its Warsaw Pact allies
  agent: The USSR and its Warsaw Pact allies
  agent_role: decide
  situation: The USSR sought to reverse liberalization in Czechoslovakia and restore orthodox Communist Party control. Its
    preferred route, insofar as possible, was to work through the Czechoslovak Communist apparatus rather than intervene overtly.
    The decision arose after lesser political and military steps had failed, while overt military intervention was regarded
    as a final means rather than the objective itself. Soviet political pressure was meant to convey serious intent, and Soviet
    leaders considered it desirable that Czechoslovakia recognize military action as a possibility.
  question: 'What should the USSR and its Warsaw Pact allies do at this decision point: authorize overt military intervention
    in Czechoslovakia or decline it?'
  options:
    O1:
      do: The USSR and its Warsaw Pact allies authorize overt military intervention in Czechoslovakia.
      move: act
      irreversible: true
    O2:
      do: The USSR and its Warsaw Pact allies decline overt military intervention in Czechoslovakia.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The USSR's objective in Czechoslovakia was to reverse the course toward liberalization.
  - id: F2
    kind: situation
    status: assessed
    fact: The USSR sought to restore orthodox Communist Party control in Czechoslovakia.
  - id: F3
    kind: situation
    status: assessed
    fact: Insofar as possible, the USSR wished to achieve its aims through the Czechoslovak Communist apparatus rather than
      overt military intervention.
  - id: F4
    kind: situation
    status: assessed
    fact: Overt military intervention was regarded as a final means to the USSR's objective, not the objective itself.
  - id: F5
    kind: situation
    status: confirmed
    fact: A series of lesser political and military steps had not been successful.
  - id: F6
    kind: situation
    status: assessed
    fact: The amount of deception the USSR could usefully employ against Czechoslovakia was limited.
  - id: F7
    kind: situation
    status: assessed
    fact: Soviet political pressures needed to convey the seriousness of Soviet intent.
  - id: F8
    kind: situation
    status: assessed
    fact: It was considered desirable that Czechoslovakia recognize the possibility of Soviet military action.
  - id: F9
    kind: situation
    status: confirmed
    fact: The USSR had requested that Soviet units be stationed in Czechoslovakia as an initial attempt to put troops there.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The stated policy objective was to reverse liberalization and restore orthodox Communist Party control; achieving
      that objective was the purpose of the decision.
  - id: C2
    facts:
    - F3
    - F4
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The preferred route, insofar as it remained possible, was to work through the Czechoslovak Communist apparatus. Overt
      intervention was a final means, not the objective.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The USSR and its allies chose massive intervention only after lesser political and military steps had failed.
  - id: C4
    facts:
    - F7
    - F8
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The political pressure was meant to convey serious intent, and Soviet leaders considered it desirable that Czechoslovakia
      recognize military action as a possibility; requesting that Soviet units be stationed there was an initial attempt to
      put troops in the country.
  reasoning:
    read: The decision was about how to pursue reversal of liberalization and restoration of orthodox Party control, not about
      making military intervention an end in itself. The trap is to treat the USSR's preference for using the Czechoslovak
      Communist apparatus as an unconditional bar on intervention, even though that preference was expressly limited to what
      was possible and lesser steps had failed.
    weighing: The stated policy objective favors {O1} {C1}; the preference for the apparatus and the treatment of intervention
      as a final means favor {O2} {C2}. The balance turns on the failure of lesser political and military steps {C3}, with
      the need to communicate serious intent and the desirability of making military action a recognized possibility providing
      additional, weaker support for {O1} {C4}. This is the strategic rationale, not a finding about the legality or legitimacy
      of intervention.
    tradecraft: At the decision level, record the objective, the preference for the political route, which lesser steps had
      failed, and why the decision-maker regarded that route as no longer sufficient. Keep the policy justification distinct
      from any legal assessment; no legal standard or operational instructions are provided.
    uncertainty: The strategic account does not assess civilian consequences, Czechoslovak views, or legal authority. It also
      does not describe how the decision was reviewed or whether alternatives beyond the stated political and military steps
      were considered.
    handoff: The decision is attributed to the USSR and its Warsaw Pact allies. No separate reviewing authority or required
      external consultation is identified, so no further approval or consultation process can be specified.
    tempting_wrong:
      option: O2
      pull: The preference was to work through the Czechoslovak Communist apparatus, and intervention was regarded as a final
        means.
      why_wrong: That preference was conditional, and the lesser political and military steps had failed before intervention
        was chosen.
    rejected:
      O2: The preference for the political route did not prevail after the lesser steps had failed and intervention remained
        the final means to pursue the stated objective.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Czechoslovak Communist apparatus could achieve the USSR's aims without overt intervention.
      then: O2
      why: Use of that apparatus was the preferred route insofar as it was possible.
    - id: flip2
      if: Lesser political and military steps had not failed.
      then: O2
      why: Without the failure of those steps, the stated reason for moving to the final means would no longer apply.
    would_not_change:
    - id: noflip1
      if: The USSR still preferred the Czechoslovak Communist apparatus, while lesser steps had failed and its stated objective
        remained unchanged.
      why: The preference was conditional, and intervention was chosen as the final means after the lesser steps failed.
    watch_for:
    - id: watch1
      what: Whether the political and military steps short of overt intervention have actually failed.
      favors:
      - O1
      - O2
      why: Failure supports moving to the final means; success would leave the preferred apparatus-based route available.
  lesson: A preferred, less escalatory route should remain the choice while it can achieve the stated policy objective. If
    lesser steps have failed, the rationale may shift toward a final means, but that strategic conclusion does not itself
    establish legality or legitimacy.
  limits: This reasoning is limited to the strategic rationale for this policy choice. The account does not address legal
    authority, civilian harm, or the perspectives of those affected, so it cannot resolve those questions.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-ea9a772a
    source: https://www.cia.gov/resources/csi/static/636b5a00faa12f723f086d6c1dcfba5f/Soviet-Deception-Czechoslovak-Crisis.pdf
    episode_focus: The decision point is whether to continue seeking control through the Czechoslovak Communist apparatus
      or use overt military intervention; the text says invasion followed the failure of lesser steps. Keep the focus on the
      policy choice and stated objective, not on operational planning or the mechanics of the invasion.
    cues:
      option_words:
        O1: 13
        O2: 13
      real_option: O1
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
    equities: pilot2
