case:
  id: DR-CORPUS-NX-b5544ae6-E1@v1
  title: Automatic Attack Policy for Eastern Europe
  status: draft
  setting: Eastern Europe, 1959, National Security Council discussions on nuclear policy.
  decider: The National Security Council
  agent: The National Security Council
  agent_role: decide
  situation: The National Security Council is discussing nuclear policy for Eastern Europe. The question is whether to authorize
    automatic attack on bloc countries at the advent of war or decide country by country based on their conduct. The State
    Department argues that an automatic decision would bind the United States in advance to war with countries that might
    not engage in hostilities against it on the Soviet side. Some bloc countries might instead use a general war to rebel
    against Soviet control if the United States did not attack them.
  question: What should the National Security Council do about automatic attack on bloc countries at the advent of war?
  options:
    O1:
      do: The National Security Council prohibits automatic attack on bloc countries and decides based on each country's conduct.
      move: act
      irreversible: false
    O2:
      do: The National Security Council authorizes automatic attack on bloc countries at the advent of war.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: National Security Council discussions on nuclear policy for Eastern Europe took place in 1959.
  - id: F2
    kind: situation
    status: confirmed
    fact: NSWP reliability was factored into the discussions.
  - id: F3
    kind: situation
    status: confirmed
    fact: The policy under discussion included an automatic decision to attack bloc countries at the advent of war.
  - id: F4
    kind: situation
    status: confirmed
    fact: The State Department argued that automatic attack would tie the United States' hands in advance.
  - id: F5
    kind: situation
    status: confirmed
    fact: Automatic attack could result in war with bloc countries whether or not they actually engaged in hostilities against
      the United States on the Soviet side.
  - id: F6
    kind: situation
    status: assessed
    fact: Some bloc countries might use a general war to rebel against Soviet domination if the United States did not attack
      them.
  considerations:
  - id: C1
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The State Department's concern was that an automatic decision would commit the United States in advance, before each
      country's conduct was known.
  - id: C2
    facts:
    - F5
    equity: third_party_harm
    favors:
    - O1
    weight: strong
    why: Automatic attack could bring the United States into war with bloc countries that had not actually engaged in hostilities
      against it.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Some bloc countries might instead use a general war to rebel against Soviet control if the United States did not
      attack them; automatic attack could foreclose that possibility.
  reasoning:
    read: The issue is whether bloc membership should trigger a precommitted attack or whether each country's conduct should
      matter. The trap is treating alignment with the Soviet bloc as proof that every country will fight the United States.
    weighing: 'The State Department''s stated reasons favor preserving a country-by-country decision: automatic attack would
      bind the United States in advance and could create war with countries that did not fight it {C1} {C2}. The possibility
      that some countries might rebel if not attacked further weighs against an automatic commitment, though it is presented
      as a possibility rather than a certainty {C3}. The balance depends on what each country actually does when war begins.'
    tradecraft: Preserve the option to decide based on each country's conduct, and record the conduct and rationale for each
      country-specific decision. This is decision practice synthesized from the stated concern about precommitment.
    uncertainty: Some countries might rebel against Soviet control if the United States did not attack them; it is not established
      which countries would participate in hostilities or what policy the NSC ultimately adopted.
    handoff: The NSC is the decision-maker; it should consider the State Department's stated concern when deciding the policy.
      The passage identifies no further required referral.
    tempting_wrong:
      option: O2
      pull: A uniform automatic policy may appear to simplify the decision at the advent of war.
      why_wrong: It would commit the United States to attack without regard to whether each country actually engaged in hostilities,
        the very consequence the State Department warned against.
    rejected:
      O2: The State Department argued against automatic attack because it would bind the United States in advance and could
        create war with countries that did not engage in hostilities against it.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that an automatic commitment was necessary to prevent a greater, imminent harm and
        that country-by-country decisions could not be made in time.
      then: O2
      why: That would supply a compelling reason for precommitment not present in the stated argument, though it would not
        erase the risk of attacking countries that did not participate.
    would_not_change:
    - id: noflip1
      if: A country is part of the Soviet bloc, but there is no evidence that it has engaged in hostilities against the United
        States.
      why: Bloc status alone would not answer the State Department's concern that automatic attack could produce war with
        a country that did not fight the United States.
    watch_for:
    - id: watch1
      what: Evidence about whether each bloc country actually engages in hostilities or instead seeks to rebel against Soviet
        control.
      favors:
      - O1
      why: The State Department's argument turns on country-specific conduct and notes that some countries might rebel if
        not attacked.
  lesson: Do not treat membership in a bloc as proof that every member will act as a combatant. When the source identifies
    materially different possible conduct, preserve the ability to decide on the conduct actually shown rather than precommitting
    to a uniform response.
  limits: This reasoning addresses the choice between automatic attack and a decision based on each country's conduct in the
    stated 1959 discussions. It does not establish the NSC's final policy, determine what any country would do, or resolve
    other legal or strategic considerations not described here.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-b5544ae6
    source: https://www.cia.gov/resources/csi/static/3d77e269796872cfbf8bfcc2c81d9c8e/US-Intel-Assessments-Reliability.pdf
    episode_focus: The policy choice was whether to precommit to attacking bloc countries or preserve the option to decide
      based on each country’s conduct. The Department argued that automatic attack would bind the United States to war with
      countries that might not participate against it and could instead rebel against Soviet control; the passage does not
      say what policy the NSC ultimately adopted.
