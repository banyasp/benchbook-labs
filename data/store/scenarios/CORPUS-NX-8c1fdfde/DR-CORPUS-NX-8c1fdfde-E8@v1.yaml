case:
  id: DR-CORPUS-NX-8c1fdfde-E8@v1
  title: Retention Period for CSP Examination Charts
  status: draft
  setting: Department of Defense, during revision of DoD Regulation 5210.48-R; place and date unstated.
  decider: FOBO, the responding office
  agent: FOBO
  agent_role: advise
  situation: The Under Secretary of Defense for Intelligence is the recipient of a recommendation concerning CSP examination
    charts. The recommendation calls for DoD entities with polygraph programs to digitize the charts and retain them in perpetuity.
    DoD Regulation 5210.48-R is being revised. Perpetuity is assessed as probably too long, while 35 years is assessed as
    a reasonable estimate of the length of a government service career.
  question: What should FOBO recommend to the Under Secretary of Defense for Intelligence about the retention period for CSP
    examination charts?
  options:
    O1:
      do: FOBO recommends perpetual retention of all CSP examination charts.
      move: act
      irreversible: false
    O2:
      do: FOBO recommends retention of all CSP examination charts for 35 years.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The recommendation is directed to the Under Secretary of Defense for Intelligence.
  - id: F2
    kind: situation
    status: confirmed
    fact: The recommendation covers all DoD entities with polygraph programs.
  - id: F3
    kind: situation
    status: confirmed
    fact: The records at issue are CSP examination charts.
  - id: F4
    kind: situation
    status: confirmed
    fact: The recommendation calls for digitizing the CSP examination charts.
  - id: F5
    kind: situation
    status: confirmed
    fact: The recommendation calls for retaining the charts in perpetuity.
  - id: F6
    kind: situation
    status: confirmed
    fact: DoD Regulation 5210.48-R is under revision.
  - id: F7
    kind: situation
    status: assessed
    fact: Perpetuity is assessed as probably too long.
  - id: F8
    kind: situation
    status: assessed
    fact: A 35-year retention period is assessed as a reasonable estimate of the length of a government service career.
  considerations:
  - id: C1
    facts:
    - F5
    - F7
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: FOBO assesses perpetual retention as probably too long, which weighs against O1.
  - id: C2
    facts:
    - F8
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: FOBO considers 35 years a reasonable estimate of the length of a government service career, providing a stated basis
      for a finite retention period.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    - F6
    equity: policy_compliance
    favors:
    - O2
    weight: weak
    why: FOBO says a requirement to digitize and retain the charts will be incorporated in the regulation revision, with the
      comment specifying 35 years rather than perpetuity.
  reasoning:
    read: 'The decision is how long to retain CSP examination charts, not whether to digitize them: the recommendation calls
      for digitization and perpetual retention, while FOBO concurs with a comment that perpetuity is probably too long. The
      relevant distinction is between perpetual retention and a finite period tied to an estimated government service career.'
    weighing: 'FOBO''s stated balance favors 35 years: perpetuity is assessed as probably too long, whereas 35 years is assessed
      as a reasonable estimate of a government service career. FOBO also says the digitization and retention requirement will
      be incorporated in the regulation revision. The stated basis depends on the career-length estimate; no other rationale
      for the period is provided.'
    tradecraft: Recommend that the regulation revision require digitization and retention of the charts for 35 years, rather
      than perpetually.
    uncertainty: The stated rationale gives no further explanation for why perpetuity is too long or how the 35-year career
      estimate was derived.
    handoff: FOBO advises the Under Secretary of Defense for Intelligence, who is the recommendation's recipient; the excerpt
      identifies no additional consultation or approval step.
    tempting_wrong:
      option: O1
      pull: The underlying recommendation expressly proposes perpetual retention.
      why_wrong: FOBO concurs only with comment and assesses perpetuity as probably too long, while identifying 35 years as
        a reasonable career-length estimate.
    rejected:
      O1: FOBO did not endorse perpetual retention because it assessed perpetuity as probably too long and recommended 35
        years instead.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: FOBO reassessed perpetuity as not too long and no longer considered 35 years a reasonable estimate of a government
        service career.
      then: O1
      why: Those changed assessments would remove the two stated reasons for choosing a finite 35-year period.
    would_not_change:
    - id: noflip1
      if: The charts are digitized as proposed.
      why: Digitization is part of the proposed requirement, but by itself it does not alter FOBO's stated reason for preferring
        35 years over perpetuity.
    watch_for:
    - id: watch1
      what: Whether the estimate of the length of a government service career remains approximately 35 years.
      favors:
      - O2
      why: FOBO's stated rationale for the finite period rests on that estimate.
  lesson: When a source rejects perpetual retention as too long and identifies a finite period as a reasonable proxy for the
    relevant service career, preserve that distinction in the recommendation. Do not treat digitization as a reason to extend
    the retention period beyond the period the decision-maker endorses.
  limits: This reasoning supports the stated 35-year recommendation in this record-retention decision only. The excerpt supplies
    no broader retention standard, legal analysis, or basis for applying the same period to other records.
  library:
    domain: intel-oversight
    family: CORPUS-NX-8c1fdfde
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-37.pdf
    episode_focus: 'The decision point is the retention period for sensitive examination records: perpetual retention or a
      finite period tied to an estimated government service career. Keep the focus on records-retention policy, not examination
      methods.'
    cues:
      option_words:
        O1: 9
        O2: 11
      real_option: O2
      real_to_mean_other_length: 1.22
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: FOBO concurred with comment, saying it would recommend 35 years because that is a reasonable estimate of the length
  of a government service career and perpetuity is probably too long.
