case:
  id: DR-CORPUS-NX-8c1fdfde-E6@v1
  title: Formal Referral and Oversight
  status: draft
  setting: DIA and FBI Headquarters, September 2000
  decider: DIA Special Agents
  agent: DIA Special Agents
  agent_role: decide
  situation: Evidence was accumulating that pointed toward a person under consideration for a counterespionage concern. In
    September 2000, the DIA Special Agents were seriously focusing on that person and needed to coordinate the concern with
    the FBI and the Department of Defense. DIA's approach to problem solving had been informal and ad hoc. A formal written
    Section 811 referral to FBI Headquarters was the prescribed process for presenting such concerns, and significant referrals
    also required prompt notice to the Under Secretary of Defense for Intelligence. The agents had to choose whether to use
    that formal referral and oversight process or continue with informal coordination.
  question: What should the DIA Special Agents do to coordinate the counterespionage concern with the FBI and the Department
    of Defense?
  options:
    O1:
      do: The DIA Special Agents withhold a written Section 811 referral from FBI Headquarters and continue informal coordination
        with the FBI.
      move: act
      irreversible: false
    O2:
      do: The DIA Special Agents submit a written Section 811 referral to FBI Headquarters and promptly notify the Under Secretary
        of Defense for Intelligence.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Evidence was accumulating that pointed toward a person under consideration.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Special Agents began to seriously focus on that person in September 2000.
  - id: F3
    kind: situation
    status: assessed
    fact: The Special Agents used an informal, ad hoc approach and did not appreciate the procedures for liaison and coordination
      with the FBI and the Office of the Secretary of Defense.
  - id: F4
    kind: authority
    status: confirmed
    fact: The June 1996 supplement to the 1979 FBI/DoD Memorandum of Understanding and Section 811(c) of the Intelligence
      Authorization Act of 1995 called for counterespionage concerns to be presented in writing to FBI Headquarters using
      an 811 referral.
  - id: F5
    kind: authority
    status: confirmed
    fact: Section 811 governs coordination of counterespionage investigations between Executive Branch agencies, the Military
      Departments, and the FBI.
  - id: F6
    kind: authority
    status: confirmed
    fact: Section 811 referrals advise the FBI of information that may indicate classified information is being or may have
      been disclosed without authorization to a foreign power or its agent.
  - id: F7
    kind: authority
    status: confirmed
    fact: DoD Instruction 5240.6 required the Under Secretary of Defense for Intelligence to be promptly advised of significant
      counterintelligence referrals to the FBI.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A formal 811 referral might have alerted the FBI to the critical nature of the undertaking and led it to identify
      the person as a suspect more swiftly.
  - id: F9
    kind: situation
    status: assessed
    fact: Prompt notice to the Under Secretary of Defense for Intelligence might have raised the issue within the Department
      of Defense sooner.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: The prescribed process required counterespionage concerns within Section 811's scope to be presented in writing to
      FBI Headquarters. Continuing without a written referral would bypass that required coordination process.
    rules_out:
    - O1
  - id: C2
    facts:
    - F7
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: Significant counterintelligence referrals to the FBI required prompt notice to the Under Secretary of Defense for
      Intelligence, providing DoD oversight and accountability.
  - id: C3
    facts:
    - F8
    equity: tempo
    favors:
    - O2
    weight: weak
    why: A formal referral might have alerted the FBI to the undertaking's critical nature and led it to identify the person
      as a suspect more swiftly; this was a possible benefit, not a guaranteed result.
  - id: C4
    facts:
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Prompt notice might also have sensitized the issue within DoD sooner.
  reasoning:
    read: This was a significant counterespionage concern for which a formal referral and oversight process applied. The trap
      was treating informal, ad hoc coordination as an adequate substitute for the prescribed written referral and prompt
      DoD notice.
    weighing: The written referral is decisive because the applicable process called for concerns of this kind to be formally
      presented to FBI Headquarters {C1}. Significant referrals also required prompt notice to the Under Secretary {C2}. The
      possible gains in FBI response speed and earlier DoD awareness support the same choice, but are uncertain and are not
      the basis for the requirement {C3} {C4}.
    tradecraft: Submit the written Section 811 referral through the prescribed process, promptly notify the Under Secretary
      of Defense for Intelligence, and record the referral, notice, and applicable authority so the coordination and oversight
      are accountable.
    uncertainty: A formal referral might have prompted faster FBI action, and notice might have raised the issue within DoD
      sooner; neither result was certain. That uncertainty does not remove the stated referral and notice requirements.
    handoff: 'The Special Agents should not handle this concern solely through their own informal coordination: the referral
      goes to FBI Headquarters, and significant-referral notice goes promptly to the Under Secretary of Defense for Intelligence.'
    tempting_wrong:
      option: O1
      pull: Informal coordination may seem sufficient when agents are already trying to raise a concern with the FBI.
      why_wrong: It substitutes an ad hoc approach for the required written Section 811 referral and fails to use the prescribed
        accountability process.
    rejected:
      O1: The agents should not withhold the written Section 811 referral because the prescribed process required formal presentation
        of this counterespionage concern to FBI Headquarters.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The information no longer indicated or potentially indicated unauthorized disclosure of classified information to
        a foreign power or its agent.
      then: O1
      why: Without the stated Section 811 subject-matter trigger, the basis for requiring this referral would no longer apply.
    would_not_change:
    - id: noflip1
      if: A formal referral did not in fact cause the FBI to identify the person as a suspect more swiftly.
      why: The potential for faster FBI action is uncertain, but the referral process is prescribed independently of that
        possible result.
    watch_for:
    - id: watch1
      what: Whether the counterintelligence referral is significant, because that determines the stated prompt-notice requirement
        to the Under Secretary.
      favors:
      - O2
      why: Significant referrals to the FBI require prompt notice to the Under Secretary of Defense for Intelligence.
  lesson: When a counterespionage concern falls within a formal interagency referral process, use that process rather than
    relying on informal coordination. Make required oversight notice promptly and preserve a clear record of the referral
    and accountability.
  limits: This reasoning applies to concerns within the stated Section 811 referral scope and to significant referrals subject
    to the stated DoD notice requirement. It does not establish that every informal coordination effort is improper or address
    concerns outside those thresholds.
  library:
    domain: intel-oversight
    family: CORPUS-NX-8c1fdfde
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-37.pdf
    episode_focus: The decision point is whether to use the formal referral and oversight process required for significant
      counterespionage concerns or rely on informal coordination. Keep the focus on referral authority and interagency accountability;
      exclude investigative or communications techniques.
