case:
  id: DR-CORPUS-NS-a12004f4-E2@v1
  title: Whether to Delay the Iran Estimate
  status: draft
  setting: The Intelligence Community, during preparation of a National Intelligence Estimate on Iran in 2007.
  decider: The NIE team
  agent: The NIE team
  agent_role: decide
  situation: In the first half of 2007, new information had emerged during a long-running effort concerning Iran's nuclear
    capabilities. The new information had not yet been evaluated and cross-checked sufficiently to establish its reliability.
    The team was reconsidering prior assessments against the new information and the new information against prior assessments,
    while facing concern that the new information might be Iranian disinformation. Some stakeholders were expecting a new
    estimate. The estimate was intended for senior policymakers and was not a public document.
  question: What should the NIE team do about completing the estimate while the new information remains under evaluation?
  options:
    O1:
      do: The NIE team delays completion while evaluating and cross-checking the new information.
      move: hold
      irreversible: false
    O2:
      do: The NIE team completes the estimate on schedule using the assessments already available.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Significant new streams of information concerning Iran's nuclear capabilities began to emerge in the first half
      of 2007.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The new information had not yet been evaluated and cross-checked to determine whether it was reliable.
  - id: F3
    kind: situation
    status: confirmed
    fact: The analytic work involved reviewing prior assessments against new information and reviewing the new information
      against prior assessments.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Analysts were concerned that the new information might be Iranian disinformation.
  - id: F5
    kind: situation
    status: confirmed
    fact: Some stakeholders had demanded and expected a new estimate on Iran's nuclear capabilities.
  - id: F6
    kind: authority
    status: confirmed
    fact: Intelligence Community Directive 203, effective June 21, 2007, set analytic standards; calling attention to a changed
      assessment was consistent with those standards.
  - id: F7
    kind: situation
    status: confirmed
    fact: The estimate was intended for senior policymakers and was not a public document.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The new information had not been evaluated and cross-checked for reliability, while the team was comparing it against
      prior assessments and revisiting those assessments in light of it. Completing before that work was done risked producing
      an estimate that did not faithfully reflect the information.
  - id: C2
    facts:
    - F2
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The possibility that the new information was disinformation made checking its reliability important before incorporating
      it into the estimate.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Calling attention to a changed assessment was consistent with Intelligence Community Directive 203's analytic standards.
      That supports careful treatment of the changed judgment, though the directive is not stated to require a delay.
  - id: C4
    facts:
    - F5
    equity: tempo
    favors:
    - O2
    weight: weak
    why: Some stakeholders expected a new estimate and were unhappy about the delay, creating pressure to complete on schedule.
      The team gave that pressure less weight than evaluating the new information.
  reasoning:
    read: 'The team faced an unresolved reliability question, not merely a choice between old and new assessments: it needed
      to test each against the other. The trap was allowing stakeholder expectations or the apparent significance of new information
      to substitute for evaluating whether that information was reliable.'
    weighing: The team delayed because it did not yet know exactly what the new information meant and needed to evaluate and
      cross-check it before deciding whether to incorporate it. The concern that it might be disinformation reinforced that
      judgment. Although some stakeholders expected a new estimate, and the delay disappointed them, analytic care outweighed
      schedule pressure. Directive 203 supported calling attention to a changed assessment, but it did not require delay.
      The balance depends on whether the new information has been evaluated sufficiently to assess its reliability.
    tradecraft: Keep completion on hold while the team evaluates the new information against prior assessments and revisits
      prior assessments in light of the new information. Record the basis for the reliability judgment and any resulting change
      in assessment, so the estimate reflects what the team has actually established.
    uncertainty: At the decision point, the information's reliability and significance were not yet established; the possibility
      of disinformation remained a concern. The team had not yet completed its evaluation and cross-checking, and no threshold
      for when that work would be sufficient to complete the estimate is specified.
    handoff: The NIE team made the analytic decision. No higher authority is identified as having to decide whether to delay;
      involving the relevant analytic leads to assess the new information is consistent with the work described.
    tempting_wrong:
      option: O2
      pull: Completing on schedule would answer the expectations of stakeholders who had demanded a new estimate.
      why_wrong: It would turn schedule pressure into a substitute for determining whether the newly emerged information was
        reliable and how it affected prior assessments.
    rejected:
      O2: The team did not complete on schedule because the new information had not yet been evaluated and cross-checked sufficiently
        to assess its reliability.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The new information has been evaluated and cross-checked sufficiently to establish its reliability and its relevance
        to the prior assessment.
      then: O2
      why: Once the unresolved reliability concern is addressed, the reason for delaying no longer applies, and completing
        the estimate becomes appropriate.
    would_not_change:
    - id: noflip1
      if: Stakeholders continue to expect a new estimate on the original schedule, while reliability remains unresolved.
      why: Stakeholder expectations create pressure to proceed, but do not resolve the concern that the new information has
        not been evaluated and cross-checked.
    watch_for:
    - id: watch1
      what: Whether evaluation and cross-checking establish the reliability and significance of the new information.
      favors:
      - O1
      why: The team did not yet know exactly what it had and needed to evaluate the new information before deciding whether
        to incorporate it.
  lesson: When new information could materially change an analytic judgment but its reliability has not been established,
    delay completion long enough to assess it against prior assessments. Stakeholder demand for timely delivery matters, but
    should not displace that reliability assessment.
  limits: This reasoning supports a delay while material information remains unevaluated; it does not establish that estimates
    should be postponed indefinitely or that any new information automatically warrants delay. No deadline or threshold for
    completing the evaluation is specified.
