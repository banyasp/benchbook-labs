case:
  id: DR-CORPUS-INC-2003-A-10-FRATRICIDE-INVOLVING-THE-BRITI-NS-f8a09055-E1@v1
  title: Unresolved Identification Before Engagement
  status: draft
  setting: North of Basra, Iraq, 28 March 2003, during coalition air-ground operations.
  decider: The flight commander, a major, who reportedly authorized the other pilot to attack.
  agent: The flight commander
  agent_role: decide
  situation: A British patrol was operating in an area declared a no-engagement zone for allied forces and carried agreed
    coalition identification markings. The aircrew were supporting operations against Iraqi forces and were guided by a forward
    air controller embedded with British ground units. The aircrew had observed both the British patrol and Iraqi vehicles
    in the area. In reported dialogue, the pilots asked whether friendly forces were near the Iraqi vehicles but did not ask
    about the British patrol; the identification markings were reportedly mistaken for Iraqi equipment. No ground controller
    had authorized an attack.
  question: What should the flight commander do about authorizing an attack while the aircrew's identification concerns remain
    unresolved?
  options:
    O1:
      do: The flight commander should permit the attack on the suspected Iraqi vehicles.
      move: act
      irreversible: true
    O2:
      do: The flight commander should prohibit the attack on the suspected Iraqi vehicles.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The area of the British patrol had been declared a no-engagement zone for allied forces.
  - id: F2
    kind: situation
    status: confirmed
    fact: The British vehicles carried agreed coalition combat-identification markings.
  - id: F3
    kind: situation
    status: confirmed
    fact: The two aircraft were completing a mission supporting operations against Iraqi forces.
  - id: F4
    kind: authority
    status: confirmed
    fact: The aircraft were guided by a forward air controller embedded with British ground units.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The aircrew observed the British patrol and Iraqi vehicles in the area.
  - id: F6
    kind: intelligence
    status: assessed
    fact: In reported dialogue, the pilots asked whether friendly forces were near the Iraqi vehicles but did not ask about
      the British patrol.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The pilots reportedly mistook the orange identification panels for Iraqi equipment.
  - id: F8
    kind: authority
    status: confirmed
    fact: The major authorized the other pilot to attack, but controllers on the ground gave no authorization.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The patrol was in an area declared off-limits for allied engagement and carried agreed coalition markings. Those
      facts weigh against treating it as an attackable target while its identity remains uncertain.
  - id: C2
    facts:
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The aircraft were guided by a forward air controller, but the major authorized an attack without authorization from
      controllers on the ground. That absence weighs against proceeding under unresolved circumstances.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The aircrew had observed the British patrol, but reportedly asked about friendly forces near the Iraqi vehicles rather
      than about the patrol, and mistook the patrol's markings for Iraqi equipment. The identification concern therefore remained
      unresolved.
  - id: C4
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The aircraft were supporting operations against Iraqi forces, giving a mission-related reason to engage suspected
      Iraqi targets. That purpose does not resolve the conflicting identification evidence or the lack of ground authorization.
  reasoning:
    read: This was not simply a choice between acting quickly against Iraqi forces and delaying a mission. The patrol was
      in a no-engagement zone, bore coalition markings, and had been observed; the trap was treating a mistaken interpretation
      of those markings as settled identification while the aircrew's concerns remained unresolved.
    weighing: The mission objective supports {O1}, but only weakly against the stronger concerns raised by the no-engagement
      zone, coalition markings, unresolved identification, and absent ground authorization. The US Air Force investigation
      found fault with both pilots' actions and recommended administrative or disciplinary action, while the British Army
      Board found that the major authorized the attack without ground-controller authorization. Those findings support {O2};
      the balance would depend on whether the target's identity and the authority to attack were actually resolved.
    tradecraft: Do not authorize the attack while identification concerns remain unresolved. Seek clarification from the ground
      controller, verify the applicable authority, and record the unresolved concerns and the decision. This is decision-level
      practice, not a method for conducting an attack.
    uncertainty: The accounts of the pilots' dialogue and their interpretation of the markings are reported assessments, not
      presented as independently established facts. The source also records that higher US Department of Defense officials
      cleared both pilots, despite the US Air Force investigation's fault findings and recommended action.
    handoff: The flight commander should involve the forward air controller, who was guiding the aircraft and was embedded
      with British ground units; the source records that no controller on the ground authorized the attack.
    tempting_wrong:
      option: O1
      pull: The aircraft were on a mission against Iraqi forces, and the markings were reportedly mistaken for Iraqi equipment.
      why_wrong: 'That interpretation did not settle the identification concern: the patrol had agreed coalition markings,
        was in a no-engagement zone, and had been observed, while no ground controller authorized the attack.'
    rejected:
      O1: The suspected targets' apparent connection to the Iraqi mission did not outweigh the unresolved identification concerns
        and absence of ground authorization.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The suspected target were reliably established to be an Iraqi target, and the competent ground authority authorized
        the attack.
      then: O1
      why: That would resolve the identification and authorization concerns that drive the recommendation to prohibit the
        attack.
    would_not_change:
    - id: noflip1
      if: The mission against Iraqi forces remained active but the patrol's identity and ground authorization were still unresolved.
      why: The mission objective alone would not remove the specific concerns raised by the no-engagement zone, coalition
        markings, and lack of controller authorization.
    watch_for: []
  lesson: Do not convert uncertain identification into authorization to engage, especially when known coalition markings or
    a no-engagement restriction point the other way. Resolve both the identification and the authority question before permitting
    an attack.
  limits: This recommendation addresses the decision to authorize an attack on the facts provided; it does not establish a
    general rule of engagement or determine the precise legal standard applicable to the operation. It does not address how
    an attack would be carried out.
