case:
  id: DR-CORPUS-INC-2003-A-10-FRATRICIDE-INVOLVING-THE-BRITI-NS-89977472-E1@v1
  title: Ground-Control Authority for a Patrol Engagement
  status: draft
  setting: Coalition Type 3 CAS operations involving 16 Air Assault Brigade, during the UK recce patrol incident.
  decider: The aircrew section leader
  agent: The aircrew section leader
  agent_role: decide
  situation: The aircrew was conducting a Type 3 CAS mission under Coalition procedures. The ground controller had said friendly
    forces were well clear, while the ground situation information and friendly positional information available to the aircrew
    were limited. The aircrew interpreted markings on newly observed vehicles as hostile indicators and sought confirmation
    for several minutes. The controller had given general Type 3 CAS authority with the condition that the aircrew advise
    him and receive clearance as appropriate. The newly observed patrol had not been described or located to the controller
    before the decision point.
  question: What should the aircrew section leader do about authorizing engagement of the newly observed patrol?
  options:
    O1:
      do: The aircrew section leader authorizes engagement of the patrol.
      move: act
      irreversible: true
    O2:
      do: The aircrew section leader declines to authorize engagement of the patrol.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Coalition CAS procedures, including Type 3 CAS, were in force and had been briefed to the aircrew and air support
      officer.
  - id: F2
    kind: authority
    status: confirmed
    fact: There was no clear UK direction or policy identifying which UK commanders could authorize Type 3 CAS.
  - id: F3
    kind: authority
    status: assessed
    fact: In the absence of clear direction, the ground controller was treated as authorized to conduct Type 3 CAS engagements,
      with no additional restrictions placed on him.
  - id: F4
    kind: authority
    status: confirmed
    fact: The ground controller's general direction was to advise him and receive clearance as appropriate.
  - id: F5
    kind: situation
    status: assessed
    fact: The ground situation information and friendly positional information and control measures passed or requested were
      insufficient for Type 3 CAS.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The aircrew asked whether friendly vehicles were in the area and was told twice that friendly forces were well clear.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The aircrew misidentified the vehicles' markings as hostile indicators.
  - id: F8
    kind: situation
    status: confirmed
    fact: The patrol's target description and location were not passed to the ground controller before the engagement decision.
  considerations:
  - id: C1
    facts:
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: The aircrew was to advise the ground controller and receive clearance as appropriate. It did not pass the newly observed
      patrol's description or location to the controller, so the Board found the section was not clear to engage.
    rules_out:
    - O1
  - id: C2
    facts:
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The available ground situation and friendly-position information was insufficient for Type 3 CAS and increased the
      possibility of fratricide. The Board noted that this shortcoming did not itself break the Coalition procedures then
      in force.
  - id: C3
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The assurances that friendly forces were well clear formed part of the aircrew's picture, but the Board found the
      markings were misidentified as hostile indicators. That mistaken reading could not establish that this patrol was hostile
      or supply the missing clearance.
  reasoning:
    read: 'This was not simply a choice between trusting the aircrew''s apparent hostile identification and abandoning the
      mission. General Type 3 CAS authority was conditional: the ground controller was to be advised and clear engagements
      as appropriate. The trap was to treat the assurances that friendly forces were well clear, together with the misread
      markings, as a substitute for identifying this newly observed patrol to the controller and obtaining clearance.'
    weighing: The decisive point is that the specific patrol was not described or located to the ground controller before
      the decision, and the Board found the aircrew was not clear to engage {C1}. The inadequate friendly-position information
      heightened the risk of fratricide, although the Board did not find that shortcoming alone breached the procedures {C2}.
      The assurances and apparent hostile indicators help explain the aircrew's error, but the Board found the markings were
      misidentified; they do not outweigh the missing authority {C3}.
    tradecraft: Withhold authorization. Communicate the patrol's description and location to the ground controller, clarify
      relevant friendly-force information, and seek the required clearance before reconsidering engagement. Record the information
      available, the authority condition, and the clearance decision.
    uncertainty: There was no clear UK direction or policy identifying which UK commanders could authorize Type 3 CAS. In
      the absence of that direction, the Board treated the ground controller as authorized, with no additional restrictions;
      it nevertheless found that this particular engagement had not been cleared.
    handoff: 'Involve the ground controller rather than decide alone: the standing direction required the aircrew to advise
      the controller and receive clearance as appropriate, and the controller had not been given the patrol''s description
      or location.'
    tempting_wrong:
      option: O1
      pull: The aircrew had twice been told friendly forces were well clear and believed the markings indicated hostile vehicles.
      why_wrong: The Board found the markings were misidentified and, more decisively, the controller had not been told about
        this patrol or cleared its engagement.
    rejected:
      O1: The Board found the aircrew was not clear to engage this patrol because the required controller clearance had not
        been obtained.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The patrol's description and location had been passed to the ground controller, relevant friendly-force information
        was sufficient, and the controller had then given the required clearance.
      then: O1
      why: Those changes would address the missing target information and specific ground-control authority that made this
        engagement unauthorized.
    would_not_change:
    - id: noflip1
      if: The general Type 3 CAS authority and the assurances that friendly forces were well clear remained the only basis
        for engagement, without clearance for this patrol.
      why: General authority and those assurances do not replace the required clearance for the newly observed target.
    watch_for:
    - id: watch1
      what: Whether friendly positions and control measures remain insufficient for Type 3 CAS.
      favors:
      - O2
      why: The Board found that insufficient friendly positional information and control measures increased the possibility
        of fratricide.
  lesson: General authority to conduct a mission is not necessarily clearance for a newly observed target. When the process
    requires ground-controller clearance, uncertainty about friendly positions and a mistaken hostile identification are reasons
    to withhold engagement until the target is communicated and the required authority is obtained.
  limits: This conclusion concerns the specific Type 3 CAS direction and findings in this incident; it does not establish
    which UK commanders may authorize Type 3 CAS in other circumstances. The Board found that the information shortcoming
    increased fratricide risk but did not itself breach the Coalition procedures then in force.
