case:
  id: DR-CORPUS-INC-2003-A-10-FRATRICIDE-INVOLVING-THE-BRITI-NS-89977472-E2@v1
  title: Responding to a Friendly-Forces Warning
  status: draft
  setting: At the engagement scene during Coalition operations; specific place and time are not stated.
  decider: The lead aircraft's pilot
  agent: The lead aircraft's pilot
  agent_role: decide
  situation: The lead aircraft's pilot has seen red smoke, a signal that Coalition forces believed they were under attack
    by their own forces. At almost the same time, the pilot receives a warning that friendly forces are in the area. Very
    shortly afterward, the pilot receives an instruction to abort. Both aircraft are low on fuel, and the immediate choice
    is whether to proceed with a third attack or cease the engagement.
  question: What should the lead aircraft's pilot do after seeing red smoke and receiving a warning about friendly forces
    and an abort instruction?
  options:
    O1:
      do: The lead aircraft's pilot continues the engagement and directs the other aircraft to proceed with a third attack.
      move: act
      irreversible: true
    O2:
      do: The lead aircraft's pilot ceases the engagement and directs the other aircraft to stop before a third attack.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The lead aircraft's pilot saw red smoke.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Red smoke signaled that Coalition forces thought they were under attack by their own forces.
  - id: F3
    kind: situation
    status: confirmed
    fact: At almost exactly the same time, the lead aircraft's pilot heard a warning that friendly forces were in the area.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The warning conveyed that friendly forces were in the area.
  - id: F5
    kind: authority
    status: confirmed
    fact: Very shortly after the warning, the lead aircraft's pilot was told to abort the mission.
  - id: F6
    kind: capability
    status: confirmed
    fact: Both aircraft were low on fuel.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Red smoke signaled that Coalition forces believed they were under attack by their own forces, making continuation
      in the circumstances a serious risk to friendly personnel.
  - id: C2
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The pilot was warned that friendly forces were in the area, reinforcing the risk indicated by the red smoke.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The pilot received an instruction to abort shortly after the warning; the source records that the pilot stopped the
      next attack.
  - id: C4
    facts:
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Both aircraft were low on fuel and left the scene. This supports ending the engagement, although the source does
      not expressly identify fuel as the reason for stopping the third attack.
  reasoning:
    read: The pilot had both a signal that Coalition forces believed they were under attack by their own forces and a warning
      that friendly forces were in the area, followed shortly by an abort instruction. The trap is to treat the possibility
      of continuing as unaffected by these converging warnings.
    weighing: 'The stated circumstances favored stopping: the red smoke and warning indicated a risk to friendly forces, and
      the abort instruction reinforced that course. The pilot stopped the other aircraft before a third attack; both aircraft
      then left because they were low on fuel. The source does not specify the instruction''s authority or describe a separate
      legal analysis.'
    tradecraft: Stop the contemplated further engagement, acknowledge the abort instruction through the appropriate channel,
      and preserve a concise account of the warning, instruction, decision, and fuel constraint. Do not infer additional engagement
      authority from the limited facts here.
    uncertainty: The source does not establish whether friendly forces were actually within the area of risk, who issued the
      abort instruction in an authority capacity, or whether any clarification was sought.
    handoff: The pilot acted on the abort instruction. If its authority or meaning were unclear, clarification from the responsible
      command authority would be appropriate, but the source does not describe such a referral.
    tempting_wrong:
      option: O1
      pull: Continuing could seem to preserve the mission's momentum.
      why_wrong: That pull does not account for the signal and warning concerning friendly forces or the subsequent instruction
        to abort.
    rejected:
      O1: The pilot did not continue with a third attack after receiving the friendly-force warning and abort instruction.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The abort instruction were authoritatively rescinded and reliable updated information established that friendly
        forces were not at risk.
      then: O1
      why: Removing the instruction and the friendly-force risk would materially change the reasons that supported ceasing
        the engagement, though the source does not state what action would then be appropriate.
    would_not_change:
    - id: noflip1
      if: The aircraft were not low on fuel, while the red smoke, friendly-force warning, and abort instruction remained.
      why: Fuel was not the decisive reason to stop; the red smoke, friendly-force warning, and abort instruction would still
        favor O2.
    watch_for:
    - id: watch1
      what: Whether the abort instruction is clarified or rescinded by the responsible authority.
      favors:
      - O2
      why: The instruction is a stated reason to stop, but the source does not identify its authority or describe any later
        clarification.
  lesson: When a signal and warning indicate that friendly forces may be at risk, and an abort instruction follows, stop the
    contemplated further engagement rather than treating continuation as the default. Do not assume facts about the instruction's
    authority or the actual location of friendly forces beyond what is established.
  limits: This reasoning addresses only the decision to stop or continue after the stated warning and instruction. The source
    does not provide the applicable rules of engagement, identify the instruction's issuer or authority, or establish what
    would be appropriate after the warning was resolved.
