case:
  id: DR-CORPUS-NX-9e5d979e-E7@v1
  title: Review of the Proposed SOCE
  status: draft
  setting: During senior-leader review of a DCR at USSOCOM.
  decider: USSOCOM senior leaders reviewing the DCR
  agent: USSOCOM senior leaders reviewing the DCR
  agent_role: decide
  situation: USSOCOM has identified a need to support the geographic combatant commander’s most challenging SOF-cyber mission
    requirements. USSOCOM submitted a DCR proposing a tailored Special Operations Cyber Element, and the DCR remains under
    senior-leader review before final approval. The proposed element would be under USSOCOM operational control while coordinating
    with USCYBERCOM on cyber command matters. Until the organizational process is complete, USSOCOM remains constrained in
    integrating the SOF-cyber capabilities it needs. Cyber-force command arrangements are under debate amid expanding mission
    demands and limited available cyber-force capabilities.
  question: What should USSOCOM senior leaders do about the proposed SOCE organizational change?
  options:
    O1:
      do: USSOCOM senior leaders reject the proposed SOCE organizational change and retain the existing arrangement.
      move: act
      irreversible: false
    O2:
      do: USSOCOM senior leaders approve the proposed SOCE organizational change for USSOCOM.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Under Title 10, Chapter 19, USSOCOM can request establishment of a tailored cyber operations organization for SOF
      mission requirements.
  - id: F2
    kind: situation
    status: confirmed
    fact: USSOCOM formally submitted a DOTmLPF change recommendation through the Special Operations Command Requirements Evaluation
      Board to advocate for the proposed operational requirement.
  - id: F3
    kind: situation
    status: confirmed
    fact: The DCR remains under senior-leader review before final approval, pending identification of administrative and operational
      requirements.
  - id: F4
    kind: capability
    status: confirmed
    fact: Until the process is complete, USSOCOM is constrained in effectively integrating the SOF-cyber capabilities it needs.
  - id: F5
    kind: situation
    status: assessed
    fact: USSOCOM identifies an urgent need for an organization to support the geographic combatant commander’s most challenging
      SOF-cyber mission requirements.
  - id: F6
    kind: capability
    status: assessed
    fact: The proposed SOCE would have operational control under USSOCOM and maintain tactical coordination with USCYBERCOM
      for cyber mission deconfliction.
  - id: F7
    kind: situation
    status: assessed
    fact: Debate over cyber-force command structure is driven by expanding cyber-mission requirements and increasing demands
      on combatant commands.
  - id: F8
    kind: capability
    status: assessed
    fact: Cyber-force capabilities are limited, and the proposed SOCE would give USSOCOM a dedicated cyberspace operations
      force.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Title 10, Chapter 19 allows USSOCOM to request a tailored cyber organization, and USSOCOM used the designated requirements
      process to submit the DCR. This supports considering the change, although authority to request it does not itself require
      approval.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: USSOCOM identifies an urgent need to support the geographic combatant commander’s most challenging SOF-cyber requirements,
      while the unfinished organizational process leaves USSOCOM constrained in integrating needed capabilities.
  - id: C3
    facts:
    - F7
    - F8
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Expanding mission demands and limited cyber-force capabilities make a dedicated force valuable. The proposed structure
      is intended to provide faster cyber effects and control over timing and tempo suited to SOF requirements.
  - id: C4
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The proposed arrangement places the element under USSOCOM operational control while retaining coordination with USCYBERCOM
      for deconfliction. This division combines SOF responsiveness with coordination across cyber operations.
  - id: C5
    facts:
    - F3
    equity: policy_compliance
    favors:
    - O1
    weight: weak
    why: The DCR remains under review so administrative and operational requirements can be fully identified before final
      approval. Completing the review is an important procedural condition, but it does not by itself justify abandoning the
      proposed change.
  reasoning:
    read: This is a senior-leader decision about whether to establish an organizational capability, not a decision about how
      cyber operations are conducted. The key trap is to treat the statutory ability to request the organization as an automatic
      requirement to approve it, or to treat the pending review as proof that the need is unsound.
    weighing: Approval is favored by the urgent mission need, the constraints imposed by the current arrangement, and the
      prospect that a dedicated SOF-cyber force can provide faster, mission-tailored options while coordinating with USCYBERCOM.
      Statutory authority enables the request but does not settle the decision. The pending review weighs in favor of completing
      administrative and operational requirements before final approval; it does not outweigh the stated need absent a finding
      that those requirements cannot be met.
    tradecraft: Record the mission need, the authority relied on, and the reasons the proposed command arrangement serves
      that need. Complete and document the administrative and operational requirements before final approval, clarify USSOCOM
      operational control and USCYBERCOM coordination, and account for the need to build a comprehensive training pipeline.
    uncertainty: The review’s final findings, whether all administrative and operational requirements have been identified,
      and how quickly the proposed organization could become effective are not specified. There is also no quantified comparison
      of the proposed structure with alternatives.
    handoff: USSOCOM senior leaders are the decision-makers for the DCR. They should involve USCYBERCOM on coordination and
      deconfliction arrangements and use regional coordination through TSOCs to align cyber-enabled SOF missions with geographic
      combatant commander objectives.
    tempting_wrong:
      option: O1
      pull: The DCR is unfinished, and cyber-force command arrangements are under debate amid limited capabilities.
      why_wrong: Those points warrant careful review, not rejection by default. The urgent SOF mission need and the proposed
        balance of USSOCOM control with USCYBERCOM coordination support organizational change.
    rejected:
      O1: Rejecting the change would leave USSOCOM constrained despite the urgent mission need and the expected benefits of
        a dedicated, responsive SOF-cyber capability.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The senior-leader review establishes that the proposed organization lacks the required statutory authority.
      then: O1
      why: Without a lawful basis to establish the organization, the mission need would not justify approving this organizational
        change.
    - id: flip2
      if: The review finds that essential administrative or operational requirements cannot be identified or met.
      then: O1
      why: Identification of those requirements is part of the process before final approval; an inability to satisfy them
        would undermine the proposed change.
    would_not_change:
    - id: noflip1
      if: Debate over cyber-force command arrangements continues without a finding that this proposed arrangement cannot meet
        the requirement.
      why: Cyber-force command arrangements remain subject to debate, but SOF’s mission demands and the proposed coordination
        structure still support reassessing the arrangement and establishing a dedicated capability.
    watch_for:
    - id: watch1
      what: Whether the senior-leader review fully identifies the administrative and operational requirements before final
        approval.
      favors:
      - O2
      why: Completion of that review would address the stated procedural caveat to the recommendation.
  lesson: When an organizational change is proposed, distinguish authority to pursue it from a mandate to approve it. Weigh
    the documented mission need and expected command benefits against unresolved review requirements, and make approval contingent
    on those requirements being addressed.
  limits: This recommendation applies to the described SOF-cyber organizational need and proposed command arrangement. It
    does not decide how any cyber mission should be conducted, and it may not apply if the proposal lacks authority or cannot
    satisfy required administrative or operational conditions.
