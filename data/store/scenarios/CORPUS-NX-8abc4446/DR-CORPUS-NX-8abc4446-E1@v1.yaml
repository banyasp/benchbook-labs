case:
  id: DR-CORPUS-NX-8abc4446-E1@v1
  title: Medium-Risk Flight-Test Waiver
  status: draft
  setting: Air Force flight-test program, February 2014; medium-risk waiver review by the approving authority.
  decider: The AFMC/A3
  agent: The AFMC/A3
  agent_role: decide
  situation: The test effort sought to assess whether modifications to the AC-130J had affected its flying qualities across
    the designed envelope. The planned envelope included a sideslip condition that would trigger the RUDDER Special Alert.
    That alert was designed to warn aircrews of an unsafe condition and prompt immediate corrective action. The preliminary
    technical order prohibited intentionally maneuvering into a sideslip that triggered a rudder alert, and AFMC/A3 approval
    was required to waive the prohibition for a medium-risk or higher test. The waiver could include restrictions for aircrews
    to review recovery procedures before flying the intentional alert test points.
  question: What should the AFMC/A3 do about the request to permit the prohibited maneuver for the test?
  options:
    O1:
      do: The AFMC/A3 defers the waiver request for a revised safety assessment.
      move: hold
      irreversible: false
    O2:
      do: The AFMC/A3 permits the maneuver with preflight recovery-procedure reviews.
      move: act
      irreversible: true
    O3:
      do: The AFMC/A3 prohibits the maneuver in the requested test program.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The test aimed to determine whether modifications required to produce the AC-130J had adversely affected its flying
      qualities, and the designed envelope included the RUDDER Special Alert.
  - id: F2
    kind: situation
    status: confirmed
    fact: The RUDDER Special Alert was designed to advise aircrews of an unsafe condition and prompt immediate corrective
      action.
  - id: F3
    kind: authority
    status: confirmed
    fact: The preliminary technical order listed intentionally maneuvering into a sideslip resulting in a LEFT/RIGHT RUDDER
      alert as a prohibited maneuver.
  - id: F4
    kind: authority
    status: confirmed
    fact: AFMC/A3 approval was required for a waiver for a medium-risk or higher test.
  - id: F5
    kind: situation
    status: confirmed
    fact: The fin-stall warning described a risk at sideslip angles of 15–20 degrees and at speeds from stall to 170 knots.
  - id: F6
    kind: situation
    status: confirmed
    fact: The waiver restriction directed aircrews to review the high-sideslip recovery procedures and fin-stall recovery
      before flights with intentional rudder-alert test points.
  - id: F7
    kind: authority
    status: confirmed
    fact: The 96th Operations Group Commander held authority to execute the mission.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The test was intended to assess whether the aircraft modifications affected flying qualities across the designed
      envelope, which included the rudder-alert condition.
  - id: C2
    facts:
    - F2
    - F5
    equity: own_force_life
    favors:
    - O1
    - O3
    weight: strong
    why: The alert warns of an unsafe condition requiring immediate corrective action, and the stated fin-stall risk makes
      deliberate exposure to the alert a significant aircrew-safety concern.
  - id: C3
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The technical order prohibited the maneuver, but the prohibition could be waived for this risk category with AFMC/A3
      approval; that authority made permission through the waiver process available, not mandatory.
  - id: C4
    facts:
    - F2
    - F6
    equity: mitigation
    favors:
    - O2
    weight: weak
    why: The waiver required review of high-sideslip and fin-stall recovery procedures before intentional alert test points,
      a precaution that reduced but did not eliminate the hazard.
  reasoning:
    read: 'This was not an ordinary choice between obeying the technical order and disregarding it: the order prohibited the
      maneuver, while the designated authority could waive that prohibition. The test objective included the alert condition,
      but the alert itself signified an unsafe condition, so waiver authority did not make the risk disappear.'
    weighing: The recorded outcome was to permit the maneuver under the waiver, with preflight recovery-procedure reviews.
      That outcome accommodates the flying-qualities test objective while retaining a stated safety precaution. The serious
      alert and fin-stall concerns weigh against permission and would support deferral or prohibition if the required safeguards
      could not be relied on. The source records the approval and restriction, but does not set out a detailed AFMC/A3 explanation
      balancing those factors.
    tradecraft: Record the decision as a waiver of the identified prohibition, not as ordinary compliance with the technical
      order. Make the recovery-review restriction explicit in the approval record and ensure the mission-execution authority
      remains distinct from the waiver authority.
    uncertainty: The record establishes the waiver restriction and the hazard it addressed, but does not establish how the
      AFMC/A3 weighed residual risk or how compliance with the review restriction was verified.
    handoff: The AFMC/A3 decides the waiver. The 96th Operations Group Commander holds authority to execute the mission, so
      the waiver should not be treated as a substitute for that separate execution decision.
    tempting_wrong:
      option: O3
      pull: The technical order expressly prohibited the maneuver, and the alert was designed to warn of an unsafe condition.
      why_wrong: The prohibition was subject to a waiver requiring AFMC/A3 approval; treating it as an absolute bar would
        ignore the available authority and the recorded decision to permit the test with a recovery-review restriction.
    rejected:
      O1: Deferral would have allowed another safety assessment, but the recorded outcome was to grant the waiver with recovery-procedure
        reviews rather than postpone the request.
      O3: Prohibition would avoid intentional exposure to the alert, but the recorded outcome used the available waiver authority
        to permit the test subject to the stated restriction.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The required recovery-procedure reviews could not be ensured before the intentional alert test points.
      then: O1
      why: Without the stated precaution, the basis for permitting the maneuver with that restriction would be weakened; deferral
        would allow the safety assessment and safeguards to be addressed.
    would_not_change:
    - id: noflip1
      if: The organizations involved continued to disagree about whether the 23 JON test effort was necessary.
      why: The source records that disagreement but also says the test team proceeded with the effort despite it; disagreement
        about the test requirement alone does not establish a different waiver outcome.
    watch_for:
    - id: watch1
      what: Whether the safety materials and briefings actually incorporated the waiver-directed review of fin-stall recovery
        procedures.
      favors:
      - O1
      why: The THAW did not mention reviewing the fin-stall warning as the waiver directed, making implementation of the restriction
        important to the safety case.
  lesson: A waiver authority may permit a maneuver otherwise prohibited by a technical order when the applicable approval
    is granted and stated restrictions are observed. Permission is not itself mission-execution authority, and a mitigation
    should not be mistaken for elimination of the underlying hazard.
  limits: This reasoning concerns a specific flight-test waiver and its stated recovery-review restriction. It does not establish
    that a waiver is appropriate where the designated authority lacks approval power, the required safeguards are unavailable,
    or the separate mission-execution authority has not approved the mission.
