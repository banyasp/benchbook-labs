case:
  id: DR-CORPUS-NX-ea9fded9-E1@v1
  title: DIA GRILL FLAME Approval
  status: draft
  setting: Department of Defense, 14 December 1981, Deputy Secretary of Defense.
  decider: The Deputy Secretary of Defense
  agent: The Deputy Secretary of Defense
  agent_role: decide
  situation: DIA and USAINSCOM were conducting a joint Service psychoenergetic evaluation effort known as GRILL FLAME during
    1981–1983. DIA and USAINSCOM sponsored a contractual effort as part of that program. The Army General Counsel had determined
    that Army psychoenergetics activity constituted experimentation on human subjects subject to Procedure 18 requirements.
    DIA General Counsel concurred with that position, and the Department of Defense General Counsel reached the same conclusion.
    The Department of Defense General Counsel directed submission of documentation to the Deputy Secretary of Defense for
    approval of DIA participation.
  question: What should the Deputy Secretary of Defense do about DIA involvement in GRILL FLAME?
  options:
    O1:
      do: The Deputy Secretary of Defense denies DIA involvement in GRILL FLAME and declines to assign Procedure 18 responsibilities
        to the contractor.
      move: act
      irreversible: false
    O2:
      do: The Deputy Secretary of Defense approves DIA involvement in GRILL FLAME subject to the contractor executing Procedure
        18 responsibilities.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In February 1979, the Army General Counsel determined that the Army psychoenergetics activity could be classified
      as a program involving testing on human subjects.
  - id: F2
    kind: situation
    status: confirmed
    fact: In December 1980, the Army General Counsel determined that the USAINSCOM program constituted experimentation on
      human subjects.
  - id: F3
    kind: authority
    status: confirmed
    fact: Procedure 18, now Procedure 13, required approval by the Secretary or Under Secretary of the Army for such activity.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Army obtained approval for its involvement in psychoenergetics in January 1981, February 1982, and September
      1983.
  - id: F5
    kind: situation
    status: confirmed
    fact: DIA established a joint Service psychoenergetic evaluation effort for 1981–1983 known as GRILL FLAME, with USAINSCOM
      as a participant.
  - id: F6
    kind: situation
    status: confirmed
    fact: DIA and USAINSCOM sponsored a contractual effort with SRI-International as part of GRILL FLAME.
  - id: F7
    kind: situation
    status: confirmed
    fact: DIA General Counsel concurred with the position of the Army General Counsel that involvement in psychoenergetics
      should be construed as experimentation on human subjects.
  - id: F8
    kind: authority
    status: confirmed
    fact: In November 1981, the Department of Defense General Counsel reached the same conclusion and directed submission
      of documentation to the Deputy Secretary of Defense for approval for DIA to proceed with GRILL FLAME.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Army, DIA, and DoD counsel treated the psychoenergetics activity as experimentation on human subjects. That classification
      placed the activity within a formal approval process rather than supporting DIA participation without such approval.
  - id: C2
    facts:
    - F3
    - F8
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The DoD General Counsel directed that the documentation be submitted to the Deputy Secretary for approval. Granting
      DIA approval followed that referred decision process.
  - id: C3
    facts:
    - F3
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Approval was conditioned on the contractor executing Procedure 18 responsibilities, preserving a procedural safeguard
      while permitting DIA involvement.
  reasoning:
    read: 'The decision concerns whether DIA may participate in an activity counsel classified as human-subject experimentation,
      not whether the Deputy Secretary should assess the technical conduct of remote viewing. The trap is treating the classification
      as requiring outright denial: the source instead describes an approval process and a condition on participation.'
    weighing: The three counsel determinations support treating human-subject requirements as applicable {C1}; the DoD General
      Counsel's referral puts the DIA approval question before the Deputy Secretary {C2}. The source's stated balance is approval
      with the contractor required to execute Procedure 18 responsibilities {C3}, rather than approval without that condition.
      The balance depends on maintaining that condition.
    tradecraft: Record the approval and its Procedure 18 condition, and ensure the contractor's assigned responsibilities
      are clear before participation proceeds.
    uncertainty: The source gives the legal classification, approval route, and condition, but does not describe the underlying
      human-subject risks or the details of Procedure 18 responsibilities.
    handoff: The Deputy Secretary decides after the DoD General Counsel's referral; the contractor must execute the Procedure
      18 responsibilities attached to the approval.
    tempting_wrong:
      option: O1
      pull: Denying participation may seem like the safest response once the activity is classified as human-subject experimentation.
      why_wrong: The source records a route for approval and an approval conditioned on Procedure 18 responsibilities, not
        a conclusion that DIA participation must be denied.
    rejected:
      O1: The Deputy Secretary did not deny DIA involvement; the source records approval subject to the contractor executing
        Procedure 18 responsibilities.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The contractor could not or would not execute Procedure 18 responsibilities.
      then: O1
      why: The source makes execution of those responsibilities a condition of approval; without that condition being met,
        the basis for conditional approval would fail.
    would_not_change:
    - id: noflip1
      if: The Army had obtained its own approvals for its psychoenergetics involvement.
      why: Those approvals would not by themselves replace the separate approval process for DIA involvement in GRILL FLAME.
    watch_for:
    - id: watch1
      what: Whether the contractor executes Procedure 18 responsibilities.
      favors:
      - O2
      why: Execution of those responsibilities is the stated condition attached to DIA's approval.
  lesson: When counsel classifies an activity as human-subject experimentation, treat the applicable approval process as controlling
    rather than bypassing it. Where approval is granted subject to procedural responsibilities, preserve that condition as
    part of the decision.
  limits: This reasoning addresses only the Deputy Secretary's 14 December 1981 DIA approval and its Procedure 18 condition.
    It does not determine the merits or technical conduct of remote viewing, or the outcome of the separate 1985 request.
