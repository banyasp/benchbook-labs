case:
  id: DR-CORPUS-URUZGAN-NX-48f6d77c-E2@v1
  title: Whether to Retain the Term MAM
  status: draft
  setting: Military counterinsurgency context; time and place are not stated; the deputy commander and Special Operations
    Command.
  decider: The deputy commander
  agent: The deputy commander
  agent_role: decide
  situation: The deputy commander was considering whether to retain the term MAM with explanatory training or eliminate it.
    Special Operations Command recommended retaining the term and training service-members that MAMs were not inherently hostile.
    The deputy commander assessed that the term had come to presume hostility. The counterinsurgency strategy was the policy
    objective at issue.
  question: What should the deputy commander do about the term MAM and the proposed explanatory training for service-members?
  options:
    O1:
      do: The deputy commander retains the term MAM and provides training to service-members.
      move: act
      irreversible: false
    O2:
      do: The deputy commander eliminates the term MAM from service-member terminology.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Special Operations Command made recommendations to the deputy commander.
  - id: F2
    kind: situation
    status: confirmed
    fact: The team recommended maintaining the term MAM.
  - id: F3
    kind: situation
    status: confirmed
    fact: The team recommended providing training to service-members.
  - id: F4
    kind: situation
    status: confirmed
    fact: The recommended training would explain that MAMs were not inherently hostile.
  - id: F5
    kind: situation
    status: assessed
    fact: The deputy commander assessed that the term MAM had come to presume hostility.
  - id: F6
    kind: situation
    status: assessed
    fact: The deputy commander assessed that eliminating the term would better serve the counterinsurgency strategy.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Special Operations Command recommended retaining the term and training service-members that MAMs were not inherently
      hostile, making retention with explanatory training the proposed alternative.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The deputy commander assessed that the term had come to presume hostility.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The deputy commander judged that eliminating a term assessed to presume hostility would better serve the counterinsurgency
      strategy.
  reasoning:
    read: The choice is between retaining MAM with explanatory training and eliminating it. The central concern is that the
      deputy commander assessed the term itself had come to presume hostility; the trap is assuming that adding training necessarily
      answers that concern.
    weighing: The team’s recommendation supplies a reason to consider {O1} {C1}, but the deputy commander’s assessment of
      the term and judgment about the counterinsurgency strategy favor {O2} {C2} {C3}. The stated balance therefore supports
      elimination. It depends on the assessment that the term had come to presume hostility and that removing it would better
      serve the strategy.
    tradecraft: Record the decision, the assessment about the term’s presumed meaning, and the stated connection to the counterinsurgency
      strategy. Do not present the recommendation for training as an adopted measure when the chosen course is elimination.
    uncertainty: The available reasons do not explain how the term came to presume hostility or assess whether training could
      change that presumption.
    handoff: The deputy commander made the judgment. The stated rationale does not identify a need for referral to another
      authority; documenting the basis preserves the reasoning for review.
    tempting_wrong:
      option: O1
      pull: It follows the team’s recommendation and pairs retention with training that MAMs were not inherently hostile.
      why_wrong: The deputy commander assessed that the term had come to presume hostility and judged that eliminating it
        better served the counterinsurgency strategy.
    rejected:
      O1: The deputy commander did not retain the term with training because eliminating the term was judged to better serve
        the counterinsurgency strategy.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The deputy commander assessed that the term no longer presumed hostility and that retaining it with explanatory
        training better served the counterinsurgency strategy.
      then: O1
      why: That would remove the stated concern supporting elimination and favor the team’s proposed alternative.
    would_not_change:
    - id: noflip1
      if: The team continued to recommend retention and explanatory training, without any change to the deputy commander’s
        assessment of the term or the strategy.
      why: The recommendation was already considered; the deputy commander’s stated assessment and strategic judgment supported
        elimination.
    watch_for:
    - id: watch1
      what: Whether the term continues to be assessed as presuming hostility.
      favors:
      - O2
      why: That assessment is the stated reason for favoring elimination.
  lesson: When a term is assessed to have acquired a meaning that conflicts with a policy objective, evaluate whether explanatory
    training addresses the concern or whether the term itself should be removed. State the assessment and policy rationale
    that drive the choice.
  limits: This reasoning applies to the terminology choice described here, not to operational targeting or engagement decisions.
    The available reasons do not establish that eliminating a term is generally preferable to explanatory training.
