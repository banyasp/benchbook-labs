case:
  id: DR-CORPUS-NX-ab1a1662-E4@v1
  title: Brazilian Domestic Security Deployment Decision
  status: draft
  setting: Rio de Janeiro, May 2007; the President of Brazil considering a governor's request for domestic security support.
  decider: The President of the Republic
  agent: The President of the Republic
  agent_role: decide
  situation: In May 2007, the governor of Rio de Janeiro requested 4,000 Army troops to cooperate with public security forces
    through the end of the year. The governor did not acknowledge that state law-enforcement agencies were unable to maintain
    public order. Brazil's framework assigns preservation of public order to federal and state law-enforcement agencies, with
    the Armed Forces providing support when needed. Domestic Armed Forces intervention is a presidential last resort when
    the governor acknowledges that law-enforcement resources are exhausted and unable to maintain order, and chaos is an imminent
    threat. The President has exclusive authority to employ the Armed Forces for law-and-order duties. The Public Security
    National Force is a separate public security body, and polling showed that more than 75 percent of people in Brazil's
    largest cities favored Armed Forces deployments to address public security problems.
  question: What should the President do about the governor's request for domestic law-and-order support?
  options:
    O1:
      do: The President authorizes 4,000 Armed Forces troops for domestic law-and-order duties.
      move: act
      irreversible: false
    O2:
      do: The President declines Armed Forces deployment and deploys 4,000 Public Security National Force personnel.
      move: act
      irreversible: false
    O3:
      do: The President asks the governor to confirm whether state law-enforcement resources are exhausted.
      move: ask
      irreversible: false
      to: the governor
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Armed Forces' constitutional mission includes defending the homeland, guaranteeing the constitutional powers,
      and guaranteeing law and order when requested by a constitutional power.
  - id: F2
    kind: authority
    status: confirmed
    fact: Employment of the Armed Forces to guarantee law and order is an exclusive power of the President of the Republic.
  - id: F3
    kind: authority
    status: confirmed
    fact: Preservation of public order is assigned to the Federal Police Department, National Public Security Forces, and
      state law-enforcement agencies; public security is not an Armed Forces mission.
  - id: F4
    kind: authority
    status: confirmed
    fact: Armed Forces intervention is a last resort when the President determines that state law-enforcement resources are
      exhausted and incapable of maintaining order, the governor acknowledges this, and chaos is an imminent threat.
  - id: F5
    kind: situation
    status: confirmed
    fact: In May 2007, the governor of Rio de Janeiro requested 4,000 Army troops to cooperate with public security forces
      through the end of the year.
  - id: F6
    kind: situation
    status: confirmed
    fact: The governor did not acknowledge that state law-enforcement agencies were having problems maintaining public order.
  - id: F7
    kind: capability
    status: confirmed
    fact: The Public Security National Force was created in 2004 with 7,000 policemen selected from the military police of
      the states.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Public Security National Force is subordinate to the Minister of Justice.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Public poll results indicated that more than 75 percent of people in Brazil's largest cities wanted Armed Forces
      deployment to address public security problems.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: The Armed Forces may be used for law and order under presidential authority, but intervention is described as a last
      resort when state resources are exhausted, the governor acknowledges their inability to maintain order, and chaos is
      imminent. The governor did not make that acknowledgment, so the stated threshold for authorizing Army deployment was
      not met.
    rules_out:
    - O1
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Preservation of public order belongs to law-enforcement bodies; public security is not an Armed Forces mission. The
      Armed Forces' ordinary role is to support those bodies, not replace them.
  - id: C3
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: A separate Public Security National Force existed, with 7,000 personnel, and was subordinate to the Minister of Justice.
      It offered a public-security alternative consistent with the allocation of responsibilities.
  - id: C4
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Strong public support for Armed Forces deployments was an argument for putting soldiers on the streets, but popularity
      did not satisfy the stated last-resort conditions or change which institutions were assigned public security.
  reasoning:
    read: This was a request for domestic public-security assistance, not a situation in which the source's stated conditions
      for Armed Forces intervention had been established. The trap is to treat the governor's request and strong public support
      as enough to make Army deployment the ordinary response, despite the Armed Forces' last-resort role and the governor's
      failure to acknowledge that state law-enforcement resources could no longer maintain order.
    weighing: 'The legal and institutional allocation favors using the Public Security National Force rather than the Army:
      public order is assigned to law-enforcement bodies, and the Armed Forces are a last resort. The governor''s lack of
      acknowledgment weighs against authorizing troops; the available National Public Security Force supplies a fitting alternative.
      Public opinion favors deployment of the Armed Forces, but the source presents that as an argument for advocates, not
      as a substitute for the intervention conditions. The balance could change if the last-resort conditions were established.'
    tradecraft: Keep the decision within the President's exclusive authority over Armed Forces employment, record the unmet
      last-resort condition, and distinguish public preference from the legal basis for intervention. Coordinate the alternative
      deployment with the Minister of Justice, to whom the Public Security National Force is subordinate.
    uncertainty: The source does not establish whether state law-enforcement resources were objectively exhausted or whether
      chaos was imminent; it specifically notes the governor did not acknowledge problems maintaining order. The decision
      should therefore be understood as applying the stated framework to the facts given, not as a finding about every aspect
      of the security situation.
    handoff: The President decides whether to employ the Armed Forces because that authority is exclusive to the office. The
      President should involve the Minister of Justice in arranging the National Public Security Force alternative because
      that force is subordinate to the Minister.
    tempting_wrong:
      option: O1
      pull: The governor requested Army troops, the Armed Forces had a constitutional law-and-order role, and more than 75
        percent of people in the largest cities favored such deployments.
      why_wrong: Those considerations do not overcome the stated last-resort conditions, particularly the missing gubernatorial
        acknowledgment, or the assignment of ordinary public security to law-enforcement bodies.
    rejected:
      O1: The President did not authorize Army troops because the stated last-resort conditions had not been acknowledged
        as met and public security was not an Armed Forces mission.
      O3: The President did not seek further confirmation from the governor; instead, he used the available National Public
        Security Force while the governor had not acknowledged that state forces could no longer maintain order.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The governor acknowledged that state law-enforcement resources were exhausted and unable to maintain order, and
        the President determined that chaos was an imminent threat.
      then: O1
      why: Those are the stated conditions for treating Armed Forces intervention as a last resort, making Army deployment
        a legally available response to reconsider.
    would_not_change:
    - id: noflip1
      if: Public support for Armed Forces deployments remained above 75 percent, but the last-resort conditions remained unmet.
      why: Public preference is an argument for deployment, not a substitute for the conditions governing Armed Forces intervention.
    watch_for:
    - id: watch1
      what: Whether public opinion is being treated as pressure to put soldiers on the streets rather than as evidence that
        the legal threshold for intervention is met.
      favors:
      - O1
      why: The source identifies the poll results as an argument used by those who wanted Armed Forces deployments.
  lesson: Keep domestic public security with the law-enforcement bodies to which it is assigned, and use military intervention
    only as the defined last resort. Public demand or a request for support does not replace the required conditions; use
    an available public-security alternative when those conditions are not established.
  limits: This reasoning concerns the Brazilian framework described for the May 2007 request. It does not resolve what the
    President should do if state law-enforcement resources are acknowledged to be exhausted and chaos is imminent, or under
    a different legal framework.
