case:
  id: DR-CORPUS-NX-5c08c2b2-E2@v1
  title: Support Without Direct Intervention
  status: draft
  setting: Vientiane and MACV in Saigon, late 1964; U.S. military and diplomatic policy.
  decider: The U.S. representative in Vientiane
  agent: The U.S. representative in Vientiane
  agent_role: decide
  situation: In Vientiane in late 1964, the U.S. representative faced a program that had been underway for nearly four years.
    MACV in Saigon was a potential source of substantial U.S. military support for the effort. There was pressure for direct
    U.S. military intervention in Laos. Such intervention threatened the Laotian prime minister’s neutralist posture, which
    was regarded as transparent but indispensable. The U.S. troop commitment in Vietnam was generating pressure from successive
    administrations to expand Laotian operations in support of the main effort. The representative had not been the architect
    of the existing program.
  question: What should the U.S. representative in Vientiane do about pressure for direct U.S. military intervention in Laos
    and the effort to obtain U.S. military support?
  options:
    O1:
      do: The U.S. representative in Vientiane should oppose direct U.S. military intervention in Laos and seek military backing
        through MACV.
      move: act
      irreversible: false
    O2:
      do: The U.S. representative in Vientiane should refer the intervention question to Washington and maintain the military-support
        channel through MACV.
      move: ask
      irreversible: false
      to: Washington
    O3:
      do: The U.S. representative in Vientiane should support direct U.S. military intervention in Laos and seek military
        backing through MACV.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The U.S. representative arrived in Vientiane in late 1964.
  - id: F2
    kind: situation
    status: confirmed
    fact: The program was almost four years old when the U.S. representative arrived.
  - id: F3
    kind: capability
    status: assessed
    fact: MACV in Saigon was a potential source of substantial U.S. military support for the effort.
  - id: F4
    kind: situation
    status: confirmed
    fact: There was pressure for American military intervention in Laos.
  - id: F5
    kind: situation
    status: assessed
    fact: American military intervention in Laos threatened the Laotian prime minister’s neutralist posture.
  - id: F6
    kind: situation
    status: assessed
    fact: The Laotian prime minister’s neutralist posture was transparent but indispensable.
  - id: F7
    kind: situation
    status: assessed
    fact: The commitment of U.S. troops to Vietnam generated pressure from successive administrations to expand Laotian operations
      in support of the main effort.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: Direct intervention threatened the Laotian prime minister’s neutralist posture. Though transparent, that posture
      was indispensable, so the representative had reason to resist intervention while preserving support for the effort.
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The representative obtained substantial support through MACV and exercised his authority to good effect. Seeking
      that support while opposing direct intervention joins both parts of the effective course.
  - id: C3
    facts:
    - F1
    - F2
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The representative arrived after the program had been underway for nearly four years, and pressure to expand operations
      followed the U.S. troop commitment in Vietnam and successive administrations’ policy decisions. The expansion pressure
      reflected broader events and policy choices, not a bureaucratic power play by the representative.
  reasoning:
    read: 'This was an established program, not one the representative had created. The choice was not simply whether to support
      the effort: he could obtain military backing while resisting direct intervention that threatened a neutralist posture
      regarded as transparent but indispensable. The trap is to treat that posture’s transparency as making it expendable,
      or to mistake broader policy pressure for a personal bureaucratic project.'
    weighing: The endorsed course combines opposing direct intervention with obtaining substantial support from MACV. The
      support served the effort, while intervention threatened the indispensable neutralist posture. Pressure to expand operations
      arose from events in South Vietnam and policy decisions in Washington, not from the representative’s authorship of the
      program. The balance depends chiefly on the neutralist posture remaining indispensable and on support being obtainable
      without direct intervention.
    tradecraft: Keep the question of support distinct from the question of direct intervention. State the policy reason for
      resisting intervention and the purpose of maintaining the MACV support channel; document the decision and any relevant
      Washington policy direction without treating pressure to expand as authorization to intervene.
    uncertainty: No legal standard, formal delegation, or exact decision process is specified. The account does not establish
      that every form of support would preserve the neutralist posture.
    handoff: The representative should make the immediate choice to resist direct intervention while pursuing support, and
      coordinate with Washington on broader expansion policy because successive administrations’ policy decisions contributed
      to that pressure. Coordination does not replace the representative’s stated exercise of authority.
    tempting_wrong:
      option: O3
      pull: Direct intervention could appear to be the most forceful way to support the effort amid pressure to expand operations.
      why_wrong: It would accept the very course the representative fended off because it threatened the prime minister’s
        indispensable neutralist posture.
    rejected:
      O2: 'A referral alone was not the endorsed course: the representative exercised his authority to resist intervention
        while obtaining support through MACV.'
      O3: Supporting direct intervention was rejected because it threatened the indispensable neutralist posture.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible reassessment established that direct intervention would no longer threaten a neutralist posture that
        remained indispensable, and intervention were judged necessary to support the effort.
      then: O3
      why: That would remove the central reason for resisting direct intervention, though this counterfactual is not established
        here.
    - id: flip2
      if: The representative lacked authority to resolve the intervention question or Washington issued a policy direction
        requiring a decision at that level.
      then: O2
      why: Referral would then place the question with the authority responsible for the relevant policy decision.
    would_not_change:
    - id: noflip1
      if: Critics continued to fault the representative for taking pleasure in his command role.
      why: Even with that criticism, he exercised his authority to good effect.
    watch_for:
    - id: watch1
      what: New or changed Washington policy decisions about expanding Laotian operations.
      favors:
      - O2
      why: Expansion pressure was connected to successive administrations’ policy decisions, so a changed policy direction
        could warrant referral or renewed coordination rather than treating prior pressure as settled.
  lesson: Separate the objective of supporting an effort from the more escalatory means of direct intervention. When intervention
    threatens a partner’s posture that is regarded as indispensable, preserve that posture while pursuing support through
    a distinct channel, and assess broader pressure in light of who made the relevant policy decisions.
  limits: This reasoning applies to the late-1964 situation, where the neutralist posture was assessed as indispensable and
    support through MACV was available. It does not determine what to do if those conditions change or establish a legal authorization
    standard for intervention.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-5c08c2b2
    source: https://www.cia.gov/resources/csi/static/726079f1a9f586daaf510dcf31ef8e2d/Great-Place-Have-War.pdf
    episode_focus: The decision point is the choice to avoid direct US military intervention while obtaining support that
      would not undermine the stated neutralist posture. Assess the competing interests of supporting the effort and preserving
      that posture; exclude any operational details of air support.
