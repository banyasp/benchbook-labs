case:
  id: DR-CORPUS-NS-45139c22-E2@v1
  title: The Decision to Bomb Rotterdam
  status: draft
  setting: Rotterdam, 14 May 1940, German military command and the Luftwaffe
  decider: The German command that ordered the Luftwaffe
  agent: The German command that ordered the Luftwaffe
  agent_role: decide
  situation: On 14 May 1940, German ground forces were striving to break through Dutch defense lines shielding Western Holland.
    The Dutch strategy was to withdraw behind those lines and hold out for Allied aid. The German objective was to break through
    the Fortress Holland line quickly and force Dutch surrender. Rotterdam was on the front line of the German advance and
    a hinge of the Dutch defensive line. German troops were attacking the city, and the command faced a decision about whether
    to authorize aerial bombing against the defenders.
  question: What should the German command do about authorizing the Luftwaffe to bomb Rotterdam?
  options:
    O1:
      do: The German command permits the Luftwaffe to bomb Rotterdam.
      move: act
      irreversible: true
    O2:
      do: The German command delays its decision on bombing Rotterdam.
      move: hold
      irreversible: false
    O3:
      do: The German command prohibits the Luftwaffe from bombing Rotterdam.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 14 May 1940, German ground forces were striving to break through Dutch defense lines.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Dutch defense lines shielded Western Holland, known as Fortress Holland.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Dutch strategy was to withdraw behind the line and hold out for Allied aid.
  - id: F4
    kind: situation
    status: confirmed
    fact: The German objective was to break through the Fortress Holland line quickly and force the Dutch to surrender.
  - id: F5
    kind: situation
    status: confirmed
    fact: Rotterdam was on the front line of the German advance and was a hinge of the Dutch defensive line.
  - id: F6
    kind: situation
    status: confirmed
    fact: German troops were attacking Rotterdam.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Rotterdam was both on the front line and a hinge of the Dutch defensive line, while German troops were attacking
      it; taking action there served the stated effort to break through the defenses.
  - id: C2
    facts:
    - F1
    - F4
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The stated objective was to break through the Fortress Holland line quickly. Delay would work against that time-sensitive
      objective.
  - id: C3
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Dutch intended to hold out for Allied aid, while the German objective was to force surrender; breaking the defense
      was directed at that stated objective.
  reasoning:
    read: This was a military decision about using force against defenders in a city that was a hinge of the defensive line,
      as German troops attacked. The trap is to treat the city's military significance and the urgency of the objective as
      a complete answer to whether bombing should be authorized; the stated rationale establishes purpose, not a full legal
      assessment.
    weighing: 'The stated reasons favor O1: Rotterdam''s position made it important to the breakthrough, and the German objective
      was to achieve that breakthrough quickly and force surrender. Those reasons support acting rather than delaying or prohibiting
      the bombing. The balance depends on the military purpose and urgency described here; the account gives no fuller assessment
      of civilian risk or legal limits.'
    tradecraft: Record the decision-maker, the military purpose, the information available at authorization, and the basis
      for concluding that force is needed. Identify what would require reassessment, including a change in the defenders'
      status or receipt of a surrender communication. This is decision-level documentation, not guidance on employing force.
    uncertainty: The account states the military purpose but does not provide a legal analysis, describe the command's assessment
      of civilian risk, or establish what alternatives were considered. It also notes that a surrender agreement was not communicated
      to part of the attacking force, but does not establish what information the authorizing command had at each point.
    handoff: The German command that ordered the Luftwaffe is the decision-maker identified here. No separate approval authority
      or required referral is specified; a decision-maker should verify any applicable authority and escalation requirements
      before acting.
    tempting_wrong:
      option: O2
      pull: Delay avoids an irreversible decision while preserving the possibility of acting later.
      why_wrong: The stated objective was a rapid breakthrough, and Rotterdam was a hinge of the defensive line; delay would
        frustrate the urgency that the command's stated rationale relied on.
    rejected:
      O2: Delay was not chosen because the stated objective was to break through the defensive line quickly.
      O3: Prohibition was not chosen because the stated military rationale treated Rotterdam as a key point in the effort
        to break the Dutch defense and force surrender.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The command had reliable confirmation of surrender before authorizing the bombing.
      then: O3
      why: The stated purpose was to break the defenders' resistance and force surrender; confirmed surrender would remove
        that stated purpose for bombing.
    - id: flip2
      if: Rotterdam was no longer a hinge of the defense and German troops were no longer facing defenders there.
      then: O3
      why: The source's stated case for bombing depends on Rotterdam's defensive significance and the ongoing attack; without
        those conditions, that rationale would no longer support authorization.
    would_not_change:
    - id: noflip1
      if: The breakthrough remained urgent, but no further information about civilian risk or legal limits was available.
      why: Urgency would preserve the stated military rationale, but would not by itself establish that the decision satisfied
        applicable legal requirements.
    watch_for:
    - id: watch1
      what: Whether a surrender communication has been received before the decision to authorize or continue the attack.
      favors:
      - O2
      - O3
      why: The Dutch commander agreed to surrender under threat of bombardment, but communications problems meant part of
        the attacking force did not receive the word; confirmed receipt could change whether the stated military purpose still
        applies.
  lesson: A stated military objective and a target's importance to that objective can support action when time matters. They
    do not, by themselves, establish that force is lawful or that civilian risks have been adequately considered; those questions
    must be assessed separately.
  limits: This reasoning is limited to the military purpose and urgency described in the account. It does not resolve the
    legality or proportionality of the bombing, and it should not be applied where surrender has been confirmed or the military
    circumstances have materially changed.
