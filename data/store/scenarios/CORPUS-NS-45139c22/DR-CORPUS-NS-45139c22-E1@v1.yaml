case:
  id: DR-CORPUS-NS-45139c22-E1@v1
  title: Guernica Target-Selection Decision
  status: draft
  setting: Guernica, April 1937; German Condor Legion, Spanish Civil War.
  decider: The German Condor Legion decision-makers
  agent: The German Condor Legion decision-makers
  agent_role: decide
  situation: Guernica was a town of 5,000–7,000 people near the front lines in April 1937. It had a bridge and an important
    road intersection. The intersection was considered vital to the withdrawal of Basque forces east of the town toward fortified
    lines around Bilbao. Two Basque battalions were stationed in the town, while 23 battalions east of it were retreating.
    Advancing Nationalist forces were concerned that the Basques might fortify the town.
  question: What should the German Condor Legion decision-makers do about selecting Guernica as a target for aerial attack?
  options:
    O1:
      do: The German Condor Legion decision-makers should approve Guernica's selection as an aerial-attack target.
      move: act
      irreversible: false
    O2:
      do: The German Condor Legion decision-makers should reject Guernica's selection as an aerial-attack target.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Guernica had a population of 5,000–7,000 people.
  - id: F2
    kind: situation
    status: confirmed
    fact: In April 1937, Guernica was close to the front lines.
  - id: F3
    kind: situation
    status: confirmed
    fact: Guernica had a bridge and an important road intersection.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The road intersection was considered vital to the withdrawal of Basque troops toward the fortified lines around
      Bilbao.
  - id: F5
    kind: situation
    status: confirmed
    fact: Two Basque battalions were stationed in Guernica.
  - id: F6
    kind: situation
    status: confirmed
    fact: Twenty-three Basque battalions east of Guernica were retreating toward the fortified lines around Bilbao.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Advancing Nationalist forces were concerned that the Basques might fortify Guernica.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The bridge and important road intersection served a military purpose: the intersection was considered vital to the
      withdrawal of Basque forces toward the fortified lines around Bilbao.'
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Two Basque battalions were stationed in Guernica, and 23 battalions east of it were retreating, supporting the assessment
      that the town and its route had tactical significance.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Nationalist forces were concerned the Basques might fortify the town, a further stated reason supporting its selection.
  reasoning:
    read: The decision is whether to select a town near the front that had a militarily important route, Basque troops in
      it, and a perceived risk of fortification. The town's civilian population is relevant context, but the account's stated
      target-selection rationale is its tactical military significance; that does not by itself establish the legality of
      an attack.
    weighing: The route's assessed importance to the retreat and the presence of Basque forces provide the principal reasons
      favoring selection {C1} {C2}. The concern about fortification adds support, though it is an assessment rather than a
      confirmed development {C3}. On the account's stated rationale, those considerations favor {O1}; the balance depends
      on the military assessments being accurate.
    tradecraft: At the decision level, record the military rationale, the intelligence assessments on which it depends, and
      the authority for the selection. Do not treat this rationale as a substitute for any separate legal review.
    uncertainty: The route's importance and the concern about fortification are assessments, not established certainties {F4}
      {F7}. The account gives no separate legal analysis or approval process, so neither can be inferred from its endorsement
      of the selection.
    handoff: The source identifies the Condor Legion decision-makers but does not identify a separate approval authority or
      review body. No particular handoff can therefore be grounded in this account.
    tempting_wrong:
      option: O2
      pull: Guernica was a populated town of 5,000–7,000 people.
      why_wrong: That fact alone does not answer the source's target-selection question, because the account also identifies
        a vital military route, troops in the town, and a concern it might be fortified; it does not, however, resolve the
        separate legal assessment.
    rejected:
      O2: The account's stated tactical reasons—the route's importance, Basque forces in and east of the town, and concern
        about fortification—support selecting Guernica rather than rejecting it.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable updated assessments showed that the intersection was not important to the retreat, no Basque forces were
        present in or withdrawing through the area, and there was no credible concern that Guernica might be fortified.
      then: O2
      why: The principal stated military grounds for selecting the town would no longer support that choice.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Whether the intersection remained important to the retreat and whether the concern about fortification was supported
        by current information.
      favors:
      - O1
      why: Those assessments are among the account's stated grounds for treating Guernica as a tactical target.
  lesson: Assess a target-selection decision by examining the military function and presence of forces that the decision-makers
    relied on, rather than assuming that a town has no military significance. A stated military rationale supports the selection
    in this account, but does not itself settle distinct questions of legality or the conduct of an attack.
  limits: This reasoning addresses only the stated grounds for selecting Guernica. It does not assess attack methods, casualty
    figures, proportionality, precautions, or whether the selection complied with applicable law.
