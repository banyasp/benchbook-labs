case:
  id: DR-CORPUS-NX-c5c8ecc9-E1@v1
  title: Interpreting an Aircraft Deployment
  status: draft
  setting: Okinawa, 30 March 1969, Joint processing center
  decider: The Joint processing center on Okinawa
  agent: The Joint processing center on Okinawa
  agent_role: decide
  situation: On 28 March, two aircraft were deployed to Hoemun, a training base. The Joint processing center on Okinawa faced
    an interpretation decision on 30 March 1969. A transition-training unit was located at Pukch’ang-ni, another east-coast
    base. The center had to assess whether the deployment fit the training explanation or warranted a more threatening interpretation.
  question: What should the Joint processing center on Okinawa do about the deployment’s training interpretation?
  options:
    O1:
      do: The center should reject the training interpretation of the aircraft deployment.
      move: act
      irreversible: false
    O2:
      do: The center should accept the training interpretation of the aircraft deployment.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The initial deployment took place on 28 March.
  - id: F2
    kind: situation
    status: confirmed
    fact: The deployment involved two aircraft.
  - id: F3
    kind: situation
    status: confirmed
    fact: The aircraft were deployed to Hoemun, a training base.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Joint processing center was on Okinawa.
  - id: F5
    kind: situation
    status: confirmed
    fact: The center's interpretation was made on 30 March 1969.
  - id: F6
    kind: situation
    status: confirmed
    fact: A transition-training unit was located at Pukch’ang-ni, another east-coast base.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The transition-training unit could have deployed the aircraft to Hoemun as part of its training syllabus.
  considerations:
  - id: C1
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The aircraft were sent to a training base, which is consistent with a training explanation.
  - id: C2
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: A transition-training unit at another east-coast base provided a specific basis for considering training as the explanation.
  - id: C3
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The center assessed that the unit at Pukch’ang-ni could have sent the aircraft to Hoemun as part of its training
      syllabus; this was the center's stated reason for its interpretation.
  reasoning:
    read: The center faced an interpretation decision about a deployment to a training base. The trap is to treat the deployment
      itself as enough to establish a more threatening explanation, despite a specific training-related explanation the center
      considered plausible.
    weighing: The training location and the transition-training unit at another east-coast base supported {O2}. Most importantly,
      the center assessed that the deployment could fit that unit's syllabus {C3}. The source gives this as the basis for
      the center's training interpretation, but does not describe other evidence weighing against it.
    tradecraft: Record the conclusion as an assessment, preserve the stated basis for it, and distinguish that basis from
      confirmed facts. Revisit the interpretation if material evidence changes.
    uncertainty: The source establishes that the training explanation was possible, not that it was proven or that all competing
      explanations were excluded.
    handoff: The Joint processing center made the interpretation. The source identifies no required referral or additional
      decision-maker; involving one is a prudent practice only if authority or material evidence is in question.
    tempting_wrong:
      option: O1
      pull: A deployment of capable aircraft may prompt a more threatening reading.
      why_wrong: 'The source''s stated basis for the center''s conclusion was a concrete training explanation: the transition-training
        unit could have deployed the aircraft under its syllabus.'
    rejected:
      O1: The center did not reject the training interpretation because it assessed that the deployment could fit the transition-training
        unit's syllabus.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The center had evidence that the transition-training unit could not have deployed the aircraft to Hoemun under its
        syllabus.
      then: O1
      why: That would remove the specific training explanation the center relied on and could warrant rejecting it.
    would_not_change:
    - id: noflip1
      if: The deployment still involved two aircraft and the training unit could still have sent them to Hoemun under its
        syllabus.
      why: Those circumstances preserve the source's stated basis for accepting the training interpretation.
    watch_for:
    - id: watch1
      what: Material information inconsistent with the possibility that the deployment fit the training syllabus.
      favors:
      - O1
      why: Such information could undermine the center's stated reason for its interpretation.
  lesson: When choosing among explanations, connect the assessment to specific contextual evidence rather than treating the
    event alone as decisive. State what the evidence supports and preserve the distinction between a plausible explanation
    and a proven one.
  limits: This reasoning applies only to the interpretation decision and the training explanation described here. The source
    excerpt does not establish what other evidence was available, whether the interpretation was ultimately correct, or what
    action should follow from it.
  library:
    domain: intel-analysis
    family: CORPUS-NX-c5c8ecc9
    source: https://www.cia.gov/resources/csi/static/77da17289753047baf2d908ec8f9f186/Lessons-from-Four-North.pdf
    episode_focus: 'The decision point is the center’s interpretation of the deployment: training rather than a more threatening
      explanation. The stated basis was that a MiG-21 transition-training unit was at another east-coast base and the deployment
      could fit the training syllabus. Exclude tactical interception details and later judgments about what the North Korean
      aircraft did.'
    cues:
      option_words:
        O1: 11
        O2: 11
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
