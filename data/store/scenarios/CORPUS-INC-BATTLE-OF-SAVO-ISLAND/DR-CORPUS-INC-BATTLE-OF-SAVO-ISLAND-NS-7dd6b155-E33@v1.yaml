case:
  id: DR-CORPUS-INC-BATTLE-OF-SAVO-ISLAND-NS-7dd6b155-E33@v1
  title: Changing an Assigned Patrol During an Emerging Battle
  status: draft
  setting: Surigao Strait, evening of 24 October 1944, U.S. naval command
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: On the evening of 24 October 1944, the Commander was responsible for an antisubmarine patrol in Surigao Strait.
    Dispatches indicated that an enemy force could reach Leyte Gulf that night and directed CTG 77.2 to defend the lower gulf
    and destroy enemy forces encountered. The Commander had no instructions on how his command should be employed in the impending
    battle and estimated that his role remained the patrol. He assessed that holding the present station could interfere with
    CTG 77.2’s battle operations, while leaving without contributing to the battle was also undesirable. His basic orders
    required defense of the transports, and he expected seeking instructions from CTF 79 could cause delay; CTG 77.2 was an
    area superior he could contact sooner.
  question: What should the Commander do about the assigned patrol and the need to seek authority for a changed task?
  options:
    O1:
      do: The Commander continues the assigned patrol without requesting a change.
      move: act
      irreversible: false
    O2:
      do: The Commander requests approval from CTG 77.2 for a changed task.
      move: ask
      irreversible: false
      to: CTG 77.2
    O3:
      do: The Commander adopts a changed task without first obtaining approval.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Commander had received a dispatch reporting that an enemy force could arrive in Leyte Gulf that night.
  - id: F2
    kind: authority
    status: confirmed
    fact: CTG 77.2 had been directed to defend lower Leyte Gulf and destroy enemy forces encountered.
  - id: F3
    kind: authority
    status: assessed
    fact: The Commander had received no instructions concerning his command’s employment in the impending battle and estimated
      he was expected to continue the antisubmarine screen.
  - id: F4
    kind: situation
    status: assessed
    fact: The Commander assessed that keeping his command in its present station could interfere with CTG 77.2’s battle operations
      if enemy forces moved through Surigao Strait.
  - id: F5
    kind: situation
    status: assessed
    fact: The Commander judged that leaving the area without making an effort to contribute to the battle would be undesirable.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Commander’s basic orders directed him to defend the transports from any type of enemy attack.
  - id: F7
    kind: situation
    status: assessed
    fact: The Commander expected contacting CTF 79 could involve delay, partly because receipt of CTF 77 dispatches about
      the prospective battle had averaged a delay of three and three-quarter hours.
  - id: F8
    kind: situation
    status: confirmed
    fact: CTG 77.2 was an area superior whom the Commander could contact once within communication range.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    - O2
    weight: strong
    why: 'The emerging battle changed the demands on the command: the commander assessed that the assigned patrol would not
      meet the new situation, so he needed to select a task that supported the broader defense.'
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O3
    - O2
    weight: strong
    why: Remaining in the present station could interfere with CTG 77.2’s battle operations, while leaving without trying
      to contribute was also undesirable; simply continuing the patrol did not address that conflict.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    - O2
    weight: weak
    why: The basic orders to defend the transports provided a mission basis for action. The assessment nevertheless treated
      the demands of the situation—not a need to establish a special justification—as the reason to consider a changed task.
  - id: C4
    facts:
    - F7
    - F8
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The commander expected that contacting CTF 79 could cause delay, while CTG 77.2 was an area superior he could reach
      sooner. The assessment expressly judged it correct to request approval from CTG 77.2.
  reasoning:
    read: This was not merely a choice between keeping the patrol station and departing it. The emerging battle could make
      the assigned patrol incompatible with the superior’s operations, requiring the commander to reassess the task; the trap
      was treating the absence of specific new orders as a reason either to continue unchanged or to act without seeking approval.
    weighing: The patrol no longer appeared to meet the demands of the situation, and holding station could interfere with
      CTG 77.2, while departing without contributing was undesirable. The assessment says the commander should analyze whether
      the assigned task still fits the new situation and choose a new task if it does not; it also says that, when time permits,
      he should communicate with his superior. Given the expected delay through CTF 79 and the ability to contact CTG 77.2
      sooner, seeking CTG 77.2’s approval was the sound balance. That balance depends on the new situation actually making
      the patrol inadequate and on communication being practicable.
    tradecraft: State the changed task being proposed and the operational reason for it, seek approval from the reachable
      area superior, and preserve a clear record of the request and response. Keep the explanation at the level of the decision
      and authority, not tactical execution.
    uncertainty: The enemy force was reported as a possibility, the commander had no command-specific instructions for the
      battle, and he anticipated communications delay based on prior dispatch delays. The choice was made under that uncertainty,
      not with certainty about the enemy’s arrival or the eventual response to the request.
    handoff: Involve CTG 77.2, the area superior whom the commander could contact sooner, rather than waiting for a potentially
      delayed exchange with CTF 79; the assessment calls that request for approval correct.
    tempting_wrong:
      option: O1
      pull: The commander had received no new instructions for his own command and estimated that he was expected to continue
        the assigned antisubmarine patrol.
      why_wrong: The assessment says he had to judge whether the assigned task met the demands of the new situation; he concluded
        it did not, and that remaining in position could interfere with CTG 77.2.
    rejected:
      O1: He did not continue the patrol unchanged because he assessed that it failed to meet the new situation and could
        interfere with the battle.
      O3: He did not adopt the changed task without approval; the assessment says communication should be made when time permits
        and endorses his request to CTG 77.2.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The assigned patrol still met the demands of the emerging situation and holding station did not risk interfering
        with CTG 77.2.
      then: O1
      why: If the task remained adequate and compatible with the battle, the stated reason to change it would fall away.
    - id: flip2
      if: The situation required action before any superior could be contacted, and CTG 77.2 was not reachable in time.
      then: O3
      why: The assessment’s decision rule calls for selecting a new task when the assigned one does not meet the new situation
        and action is necessary before instructions can be obtained.
    would_not_change:
    - id: noflip1
      if: The commander still felt that his basic orders required a separate justification for contributing to the battle.
      why: That concern would not displace the assessment’s reasoning that the situation itself created an incentive to act
        and that requesting approval from the reachable area superior was correct.
    watch_for:
    - id: watch1
      what: Whether communication with the appropriate superior is practicable in the time available, and whether CTG 77.2
        can be reached.
      favors:
      - O2
      why: The assessment distinguishes situations where communication is possible from those requiring action before instructions
        can be obtained, and identifies CTG 77.2 as reachable sooner in this case.
  lesson: When an emerging situation makes an assigned task inadequate, reassess the task against the superior’s broader plan
    rather than continuing by default. If time permits, seek approval through an appropriate, reachable authority; act without
    that handoff only when the circumstances require action before communication is possible.
  limits: This reasoning concerns a subordinate commander’s changed task, the need to reassess orders, and the choice of whom
    to contact. It does not establish a general rule that every changed task requires prior approval, or decide the tactics
    or execution of an operation.
