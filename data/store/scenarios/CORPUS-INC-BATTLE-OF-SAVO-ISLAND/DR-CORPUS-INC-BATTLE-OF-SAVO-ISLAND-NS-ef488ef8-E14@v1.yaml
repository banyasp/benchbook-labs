case:
  id: DR-CORPUS-INC-BATTLE-OF-SAVO-ISLAND-NS-ef488ef8-E14@v1
  title: The Night Attack Decision
  status: draft
  setting: Solomon Islands, August 8, 1942, Japanese Cruiser Force.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: On August 8, 1942, the Commander had to decide whether to proceed with a planned night attack against Allied
    forces in the Tulagi-Guadalcanal area. Allied ships and transports were reported at both Lunga Point and Tulagi, with
    forces underway near Tulagi and anchored at Lunga. The Commander assessed that the Allied surface force in Iron Bottom
    Sound was stronger than his own if concentrated, while its division between Tulagi and Guadalcanal favored his force.
    He believed his force had just been located and presumed its position had been reported to Allied command. He expected
    the Fifth Air Attack Force to strike Allied forces around noon and expected a summary of the air-attack results and reconnaissance
    at about 1530. If he had underestimated the strength or aggressiveness of the Allied carrier force, his force could be
    exposed to carrier-air attack before sunset.
  question: What should the Commander do about the planned night attack?
  options:
    O1:
      do: The Commander requests the expected summary from Fifth Air Attack Force.
      move: ask
      irreversible: false
      to: Fifth Air Attack Force
    O2:
      do: The Commander authorizes the planned night attack against Allied forces.
      move: act
      irreversible: true
    O3:
      do: The Commander declines the planned night attack against Allied forces.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Allied ships and transports were reported at both Lunga Point and Tulagi, with forces underway near Tulagi and anchored
      at Lunga.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Commander assessed that the Allied surface force in Iron Bottom Sound was stronger than his own if concentrated,
      while its division between Tulagi and Guadalcanal favored his force.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Commander believed his force had just been located and presumed its position had been reported to Allied command.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Commander expected the Fifth Air Attack Force to deliver a strong air attack against Allied forces around noon.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Commander expected a summary of the air-attack results and the day's land-based reconnaissance at about 1530.
  - id: F6
    kind: situation
    status: assessed
    fact: If the Allied carrier force was stronger or more aggressive than the Commander estimated, his force could be exposed
      to carrier-air attack before sunset.
  - id: F7
    kind: situation
    status: confirmed
    fact: Whether to conduct the planned night attack was the decision under consideration.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Allied surface force was stronger if concentrated, but its division between Tulagi and Guadalcanal favored the
      Commander and created an opportunity for the planned night attack.
  - id: C2
    facts:
    - F2
    - F3
    - F6
    equity: own_force_life
    favors:
    - O1
    - O3
    weight: strong
    why: The Commander believed his force had been located, and an underestimated or more aggressive Allied carrier force
      could expose it to attack before sunset.
  - id: C3
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The expected air-attack results and reconnaissance summary could provide additional information relevant to the decision,
      making a request or delay a plausible option.
  - id: C4
    facts:
    - F2
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Commander expected a strong air attack against the Allied forces and a later summary, but judged the night-attack
      opportunity worth pursuing before that summary arrived.
  reasoning:
    read: 'The decision involved a real advantage and a real hazard: the Allied surface force was stronger if concentrated,
      but was divided between Tulagi and Guadalcanal. Neither the reported strength nor the possibility of carrier-air attack
      was decisive by itself; the Commander also believed his position had been reported and had reason to expect further
      intelligence.'
    weighing: The division of the Allied force offered an opportunity for the night attack, and the Commander expected a strong
      air attack on the Allies. The risk of carrier-air attack and the prospect of a later intelligence summary weighed against
      proceeding, but did not outweigh that opportunity in the Commander's judgment. The balance depended on the assessment
      that the Allied forces remained divided and on the expected air attack; the Commander committed before receiving the
      anticipated summary.
    tradecraft: For a comparable decision, record which assessments are confirmed and which are assumptions, identify what
      incoming information could change the choice, and document why the mission opportunity outweighs the identified risk.
      Reassess if material new information arrives before the decision becomes irreversible.
    uncertainty: The carrier force's strength and aggressiveness were uncertain, and the expected summary of the air attack
      and reconnaissance had not arrived when the Commander committed.
    handoff: The Commander made the decision. No separate approval authority or required referral is identified in this scenario.
    tempting_wrong:
      option: O3
      pull: Declining would avoid exposing the force to the stated possibility of carrier-air attack before sunset.
      why_wrong: The assessed division of Allied forces and the opportunity for a successful night attack outweighed that
        risk in the Commander's judgment.
    rejected:
      O1: The Commander did not defer the decision to obtain the anticipated summary, judging the planned attack worth pursuing
        before it arrived.
      O3: The Commander accepted the carrier-air risk because the assessed division of Allied forces offered a significant
        opportunity for the night attack.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Commander had underestimated the strength or aggressiveness of the Allied carrier force.
      then: O3
      why: That possibility could expose the force to carrier-air attack before sunset; if the threat were established, it
        could remove the basis for accepting the risk.
    would_not_change:
    - id: noflip1
      if: The Commander believed his force had just been located and presumed its position had been reported.
      why: He proceeded with the planned attack despite that belief, so the belief alone did not displace the plan.
    watch_for:
    - id: watch1
      what: The expected summary of the air-attack results and reconnaissance, especially information that materially changes
        the assessment of Allied strength or carrier threat.
      favors:
      - O1
      - O3
      why: The Commander expected further information and wanted to know the extent of the air attack's results, although
        he committed before receiving the summary.
  lesson: Do not let a single adverse indicator decide a high-stakes choice when the opposing force's disposition creates
    a meaningful opportunity. Make the risk explicit, account for information expected but not yet received, and identify
    what new evidence would change the decision.
  limits: This captures the historical assessment of a military command decision, not a general legal rule or a judgment about
    the legality of the attack. It does not establish that the same balance would apply with different intelligence, authority,
    or operational circumstances.
