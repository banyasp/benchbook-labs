case:
  id: DR-CORPUS-INC-BATTLE-OF-SAVO-ISLAND-NS-1d4cbeb1-E29@v1
  title: Force Assignments for the Decisive Battle
  status: draft
  setting: Preparations for the SHO operation, Combined Fleet command, October 1944.
  decider: The Chief of Staff Combined Fleet
  agent: The Chief of Staff Combined Fleet
  agent_role: decide
  situation: The Combined Fleet was preparing for the decisive battle under the SHO plan. The original plan assigned the First
    Striking Force and Main Force distinct force groupings. Earlier recommendations had proposed changes to those assignments
    if the operation was activated. The mobile counterattack plan included transporting and protecting troop reinforcements
    to Leyte, and central policy called for a prompt, coordinated counterattack. The competing considerations included strengthening
    the First Striking Force and maintaining the Main Force's screening capacity.
  question: What should the Chief of Staff Combined Fleet do about the planned force assignments during preparations for the
    decisive battle?
  options:
    O1:
      do: The Chief of Staff Combined Fleet permits reallocation of forces from the planned assignments to support the mobile
        counterattack and Leyte reinforcements.
      move: act
      irreversible: true
    O2:
      do: The Chief of Staff Combined Fleet prohibits reallocation of forces from the planned assignments and retains them
        for the decisive battle.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The original Combined Fleet SHO plan assigned the Sixteenth Division to the First Striking Force and the Second
      Striking Force to the Main Force.
  - id: F2
    kind: situation
    status: confirmed
    fact: During September 10 chart maneuvers, the Mobile Force commander recommended changes to force organization if the
      SHO operation was activated.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Mobile Force plan included transporting and protecting an amphibious group, with troop reinforcements to Leyte
      identified as the purpose.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Army and Navy Sections had issued a policy calling for a prompt mobile counterattack through coordinated preparations
      among the relevant forces.
  - id: F5
    kind: capability
    status: assessed
    fact: The Mobile Force commander assessed that the First Striking Force needed as much additional combat strength as possible
      for its penetration.
  - id: F6
    kind: capability
    status: assessed
    fact: The Mobile Force commander appeared to assess that moving forces from the Main Force could leave its screening capacity
      inadequate.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The mobile counterattack plan required transporting and protecting troop reinforcements to Leyte, and central policy
      called for a prompt, coordinated counterattack. Permitting force reallocation supports that assigned purpose.
  - id: C2
    facts:
    - F2
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Mobile Force commander recommended changes if the operation was activated, including adding as much surface combat
      strength as possible to improve the First Striking Force's prospects of penetration.
  - id: C3
    facts:
    - F2
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Removing forces from the Main Force could leave its screening inadequate. Compensating with destroyers of limited
      mobility adversely affected the Main Force's mobility.
  - id: C4
    facts:
    - F1
    - F2
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: The changes reduced the Combined Fleet's strength available for battle, and the Chief of Staff's motivation for making
      them at that time is not entirely clear. Reallocation therefore should not be treated as cost-free or self-justifying.
  reasoning:
    read: This is a choice between preserving the original battle grouping and organizing forces to serve the mobile counterattack
      as well as the decisive battle. The trap is to treat the original assignments as the only mission, or to treat the counterattack-related
      transfers as having no cost to the Main Force.
    weighing: The balance favors permitting reallocation because the plan and central policy called for a prompt, coordinated
      counterattack to move reinforcements to Leyte, and the Mobile Force commander judged that the First Striking Force needed
      additional strength. That benefit must be weighed against the Main Force screening concern and the reduction in available
      battle strength and mobility. The justification depends on meeting the counterattack purpose without leaving the Main
      Force's screening role ineffective.
    tradecraft: State the counterattack and penetration purposes for the reallocation, assess the resulting screening capacity
      and mobility of the Main Force, and record the tradeoffs and any compensating measures. Keep the decision at the force-assignment
      level and verify that the allocation remains coordinated with the counterattack policy.
    uncertainty: The Chief of Staff's precise motivation for the changes is unclear. The source rejects a later explanation
      that the Second Striking Force could not join the surface force in time, reasoning that it could have joined after the
      planned sortie and before entering the Sulu Sea.
    handoff: The Chief of Staff Combined Fleet decides the force assignments, but should coordinate with the relevant force
      commanders and Army and Navy staff sections because the policy calls for close cooperation among attack, shipping, and
      escort forces.
    tempting_wrong:
      option: O2
      pull: Keeping the original assignments appears to preserve the planned battle grouping and avoid weakening the Main
        Force.
      why_wrong: It gives insufficient weight to the stated purpose of transporting and protecting reinforcements to Leyte
        and to the need, identified by the Mobile Force commander, to strengthen the First Striking Force.
    rejected:
      O2: The stated counterattack purpose and the Mobile Force commander's reasons for reorganization outweigh retaining
        the original assignments unchanged, provided the Main Force's screening risk is addressed.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The requirement to transport and protect reinforcements to Leyte were withdrawn and there were no remaining operational
        need for the proposed reallocation.
      then: O2
      why: Without the counterattack purpose that supports the reallocation, retaining the planned assignments would avoid
        an unsupported reduction in battle strength.
    would_not_change:
    - id: noflip1
      if: The original plan's assignments were cited without new evidence that they better served the counterattack or penetration
        requirements.
      why: The original assignments alone would not answer the reasons for reorganizing forces to support the counterattack
        and strengthen the First Striking Force.
    watch_for:
    - id: watch1
      what: Evidence that removing the relevant forces would leave the Main Force's screening inadequate or impair its mobility.
      favors:
      - O2
      why: Inadequate screening was a concern, and substitute destroyers adversely affected Main Force mobility.
  lesson: Force assignments should be judged against all assigned purposes, not only the decisive battle's original grouping.
    Reallocation is justified when it enables a stated mission and strengthens a necessary effort, but the decision must account
    for the screening and mobility it takes from other forces.
  limits: This reasoning addresses the force-assignment decision in the SHO preparations, not tactical employment. It does
    not establish that any particular reallocation is justified if the counterattack purpose, force capabilities, or Main
    Force screening risk materially differs.
