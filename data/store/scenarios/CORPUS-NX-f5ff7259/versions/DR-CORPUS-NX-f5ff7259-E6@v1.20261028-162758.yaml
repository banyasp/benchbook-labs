    episode_focus: The Director describes recent difficulties abroad as stemming largely from improperly trained or inferior
      personnel, with poor security practices also contributing, and says activities must be limited until a reserve of well-trained
      people is built. Focus on this organizational priority choice and its stated reasons; exclude operational details of
      any particular activity.
