case:
  id: DR-CORPUS-NX-f5ff7259-E6@v1
  title: Personnel Readiness and CIA Activity Scope
  status: draft
  setting: Various parts of the world; at a meeting; CIA
  decider: The Director
  agent: The Director
  agent_role: decide
  situation: At a meeting, the Director considered the scope of CIA activities abroad. The Agency had recently encountered
    difficulties in various parts of the world. The Director attributed these difficulties largely to personnel who were improperly
    trained or inferior, and partly to poor security practices. CIA had not yet built a reserve of well-trained people. Its
    primary mission was intelligence, and continuing attention to security was also at issue.
  question: What should the Director do about the scope of CIA activities while the Agency builds a reserve of well-trained
    personnel?
  options:
    O1:
      do: The Director will expand CIA activities across a broad field while the Agency builds a reserve of well-trained personnel.
      move: act
      irreversible: false
    O2:
      do: The Director will limit CIA activities to the operations the Agency can do well until it builds a reserve of well-trained
        personnel.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Agency had recently experienced difficulties in various parts of the world.
  - id: F2
    kind: situation
    status: assessed
    fact: The Director attributed the difficulties largely to improperly trained or inferior personnel.
  - id: F3
    kind: situation
    status: assessed
    fact: The Director attributed some of the difficulties to poor security practices.
  - id: F4
    kind: capability
    status: confirmed
    fact: CIA had not yet built a reserve of well-trained people.
  - id: F5
    kind: capability
    status: assessed
    fact: The Director considered that CIA could perform well in a limited number of operations rather than across a broad
      field.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Agency's primary mission was intelligence.
  - id: F7
    kind: situation
    status: assessed
    fact: The Director stated that he would do nothing that militated against accomplishing the Agency's primary mission.
  - id: F8
    kind: situation
    status: assessed
    fact: The Director identified a need for greater and continuing emphasis on security.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Director attributed recent difficulties largely to improperly trained or inferior personnel and said the Agency
      had not yet built the reserve of well-trained people needed to address that weakness.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Director judged that CIA could perform well in a limited number of operations, but should not attempt a broad
      field with poor performance while its trained personnel reserve remained inadequate.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Agency's primary mission was intelligence, and the Director said he would not take action that militated against
      accomplishing it.
  - id: C4
    facts:
    - F3
    - F8
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: Poor security practices also contributed to the difficulties, prompting the Director to call for greater and continuing
      attention to security; this supports caution about the scope of activity.
  reasoning:
    read: The choice is between maintaining a broad field of activity despite personnel shortcomings and concentrating on
      work CIA can do well while it builds a trained reserve. The trap is treating the Agency's desired breadth of activity
      as more important than its present capacity to perform effectively and securely.
    weighing: The Director's central reason was that recent difficulties stemmed largely from improperly trained or inferior
      personnel, while a reserve of well-trained people had not yet been built {C1}. He considered the Agency capable of doing
      a limited number of operations well, but not of covering a broad field without poor performance {C2}. Because intelligence
      was the primary mission, he rejected action that would impede its accomplishment {C3}. Security problems added a reason
      for continuing caution and attention to security {C4}. The balance favors limiting activity until trained capacity improves,
      while preserving the intelligence mission.
    tradecraft: Keep activity within the limited scope the Director judged the Agency could perform well, sustain attention
      to security, and revisit scope as trained capacity develops.
    uncertainty: The Director gave broad causal judgments, describing personnel problems as the main source of difficulty
      and poor security as a contributing source; the account does not quantify either contribution or specify how much capacity
      would justify a broader scope.
    handoff: The Director made this organizational scope judgment at the meeting. The account identifies no required referral
      or additional decision-maker.
    tempting_wrong:
      option: O1
      pull: A broad field of activity may seem preferable while the Agency pursues its intelligence mission.
      why_wrong: The Director judged that attempting broad coverage before building a trained reserve risked poor performance
        and could work against the primary mission.
    rejected:
      O1: The Director chose not to pursue a broad field of activity while CIA lacked the trained personnel reserve to perform
        it well.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Agency builds a reserve of well-trained people and the Director judges that it can perform across a broader
        field without poor performance.
      then: O1
      why: The personnel-capacity reason for limiting scope would be reduced, making broader activity a possible choice if
        it remains compatible with the intelligence mission.
    would_not_change:
    - id: noflip1
      if: A broader scope would militate against accomplishing the Agency's primary intelligence mission.
      why: The Director said he would do nothing that militated against that mission, so improved capacity alone would not
        justify such a course.
    watch_for:
    - id: watch1
      what: Whether poor security practices continue to contribute to difficulties.
      favors:
      - O2
      why: The Director identified those practices as a contributing problem and called for greater and continuing emphasis
        on security.
  lesson: Match the scope of organizational activity to demonstrated personnel capacity rather than pursuing breadth at the
    cost of poor performance. Reassess as capacity changes, while keeping the primary mission and security requirements in
    view.
  limits: This reasoning concerns an organizational choice about the scope of CIA activities, not the merits or methods of
    any particular operation. It does not establish a numerical threshold for trained capacity or prescribe how security practices
    should be improved.
