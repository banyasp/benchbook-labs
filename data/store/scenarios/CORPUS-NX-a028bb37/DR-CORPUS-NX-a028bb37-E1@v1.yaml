case:
  id: DR-CORPUS-NX-a028bb37-E1@v1
  title: Immediate Needs and Long-Term Intelligence
  status: draft
  setting: The United States Intelligence Community during a sustained competition, with the Cold War as historical context
  decider: The Intelligence Community
  agent: The Intelligence Community
  agent_role: decide
  situation: The Intelligence Community faces day-to-day intelligence needs alongside a need for pre-emptive analysis of threats
    and responses. The competition is understood as long-term. Immediate actionable intelligence may compete for resources
    with analysis of future capabilities and indications of intentions. Continued access to information needed to understand
    enemy intentions and capabilities may be affected by meeting immediate needs. Decisionmakers have more sources of information
    than their predecessors.
  question: What should the Intelligence Community do about allocating intelligence resources between immediate actionable
    needs and long-term analysis in a sustained competition?
  options:
    O1:
      do: The Intelligence Community should balance resources between long-term analysis and immediate intelligence needs.
      move: partial
      irreversible: false
    O2:
      do: The Intelligence Community should prioritize long-term analysis while maintaining resources for immediate intelligence
        needs.
      move: act
      irreversible: false
    O3:
      do: The Intelligence Community should deprioritize long-term analysis while directing resources to immediate intelligence
        needs.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: Effective intelligence requires pre-emptive analysis of threats and responses.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Cold War was understood as a long-term competition.
  - id: F3
    kind: situation
    status: confirmed
    fact: Day-to-day threats were described as grave.
  - id: F4
    kind: capability
    status: confirmed
    fact: Intelligence priorities were adjusted to support analysts' assessments of future capabilities and indications of
      intentions.
  - id: F5
    kind: situation
    status: assessed
    fact: There may be tension between serving SMO and SPO and assuring adequate resources for WEI.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Meeting needs for immediately actionable intelligence could sacrifice continued access to information needed to
      understand enemy intentions and capabilities.
  - id: F7
    kind: situation
    status: confirmed
    fact: Decisionmakers have more sources of information than their predecessors.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Because the competition is long-term and effective intelligence requires pre-emptive analysis, intelligence priorities
      should preserve the ability to assess future threats and responses.
  - id: C2
    facts:
    - F3
    equity: tempo
    favors:
    - O1
    - O2
    weight: strong
    why: Grave day-to-day threats require retaining resources for immediate actionable needs; prioritizing long-term analysis
      does not mean abandoning those needs.
  - id: C3
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The historical posture adjusted priorities so analysts could assess future capabilities and indications of intentions,
      supporting continued investment in long-term analysis.
  - id: C4
    facts:
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: Meeting immediate intelligence demands may sacrifice continued access to information needed to understand enemy intentions
      and capabilities, so adequate resources for long-term understanding should be protected.
  reasoning:
    read: This is a sustained competition in which immediate threats are grave but do not displace the need to understand
      future capabilities and intentions. The trap is treating urgent, actionable demand as the whole intelligence mission,
      even where meeting it could impair continued access to information needed for longer-term understanding.
    weighing: Adjusting priorities to support future-oriented analysis is warranted despite grave day-to-day threats. Because
      meeting immediate needs may sacrifice access needed to understand intentions and capabilities, the balance favors prioritizing
      long-term analysis while maintaining immediate capacity {C1} {C2} {C3} {C4}. No fixed allocation is given; the balance
      depends on preserving adequate resources for both demands.
    tradecraft: As a decision practice, set and record the long-term analytic capacity to be protected, the immediate needs
      still being served, and the reasons for any change in their relative allocation. Reassess those allocations as the competition
      and intelligence demands change.
    uncertainty: The historical account offers a general posture, not a specific allocation rule or threshold. The excerpt
      does not define SMO, SPO, or WEI, and the greater number of information sources available to decisionmakers does not
      establish that long-term analysis is unnecessary.
    handoff: The Intelligence Community should make the allocation decision, with relevant analytic and resource authorities
      involved so that both immediate demands and the continuing need for future-oriented analysis are represented.
    tempting_wrong:
      option: O3
      pull: Grave day-to-day threats create pressure to direct resources to immediate actionable intelligence.
      why_wrong: Deprioritizing long-term analysis risks sacrificing access to information needed to understand enemy intentions
        and capabilities, contrary to the emphasis on pre-emptive analysis in a sustained competition.
    rejected:
      O1: A general balance does not give sufficient priority to the long-term analysis needed in a sustained competition.
      O3: Directing resources to immediate needs at the expense of long-term analysis risks losing information needed to understand
        future capabilities and intentions.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Immediate demands become so acute that maintaining the protected long-term allocation prevents responding to them,
        while adequate access for long-term analysis remains assured.
      then: O1
      why: A more immediate allocation could then be warranted without sacrificing the long-term understanding that should
        be preserved.
    - id: flip2
      if: The competition is no longer sustained and the need for future-oriented analysis has materially receded.
      then: O1
      why: The rationale for prioritizing long-term analysis rests on the enduring need to understand future capabilities
        and intentions.
    would_not_change:
    - id: noflip1
      if: Decisionmakers have more sources of information than their predecessors.
      why: That fact alone does not remove the need for pre-emptive analysis or the risk that immediate demands could sacrifice
        continued access to information.
    watch_for:
    - id: watch1
      what: Whether future capabilities and intentions remain important to understanding the sustained competition.
      favors:
      - O2
      why: The continuing importance of those assessments is central to the rationale for adjusting priorities toward long-term
        analysis.
  lesson: In a sustained competition, do not let urgent actionable demands consume the capacity needed to understand future
    threats and intentions. Prioritize that long-term analysis while retaining resources to address grave day-to-day needs.
  limits: This reasoning addresses a general intelligence-resource tradeoff, not a particular episode, collection method,
    or numerical allocation. It may not apply where the sustained-competition premise or the risk to continued access for
    long-term understanding has materially changed.
