    episode_focus: The decision point is whether to investigate possible advancement barriers; the Director approved a recommendation
      from Senior Intelligence Service women, and the study examined agency data and employee experiences. The stated aim
      was to identify barriers, so do not treat the study’s findings or later reforms as part of this decision.
