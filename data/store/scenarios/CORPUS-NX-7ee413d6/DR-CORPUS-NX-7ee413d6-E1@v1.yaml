case:
  id: DR-CORPUS-NX-7ee413d6-E1@v1
  title: Reassessing Sino-Soviet Discord
  status: draft
  setting: United States, 1960, the Intelligence Community's coordinated National Intelligence Estimates.
  decider: The Intelligence Community
  agent: The Intelligence Community
  agent_role: decide
  situation: The coordinated estimates addressed the relationship between Moscow and Beijing. Earlier assessments recognized
    difficulties and significant differences but judged that the two sides would maintain their alliance and that conflicts
    were unlikely to impair its solidarity. Differences had become apparent over China's domestic programs, the Quemoy-Matsu
    crisis, and the implications of Soviet nuclear capabilities. In 1960, Moscow ordered its experts to leave China, and Chinese
    and Soviet spokesmen angrily confronted one another at international Communist gatherings. Copies of angry letters distributed
    by the two sides were also available to the United States and several friendly countries.
  question: What should the Intelligence Community do about its estimate of the seriousness of Sino-Soviet discord as evidence
    accumulates?
  options:
    O1:
      do: The Intelligence Community should raise its estimate of the seriousness of Sino-Soviet discord.
      move: act
      irreversible: false
    O2:
      do: The Intelligence Community should lower its estimate of the seriousness of Sino-Soviet discord.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A 1956 assessment acknowledged difficulties between Moscow and Beijing but judged fundamental conflicts unlikely.
  - id: F2
    kind: intelligence
    status: assessed
    fact: A 1959 assessment judged reconciliation of Sino-Soviet interests increasingly difficult, particularly on nuclear
      weapons, attitudes and tactics toward the West, and economic and social development, while judging that no feasible
      alternative to maintaining the alliance existed.
  - id: F3
    kind: intelligence
    status: assessed
    fact: An estimate judged it highly unlikely that either side would permit conflicts to impair Sino-Soviet solidarity.
  - id: F4
    kind: situation
    status: confirmed
    fact: By 1959, differences had arisen over China's commune and Great Leap Forward programs, China's instigation of the
      Quemoy-Matsu crisis, and whether Soviet nuclear weapons meant greater or more cautious risks should be taken against
      the West.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Intelligence Community judged that Beijing was not directly and completely controlled by the Kremlin and retained
      some capacity for independent action and influence over Communist policy in the Far East.
  - id: F6
    kind: situation
    status: confirmed
    fact: In July 1960, Moscow ordered its experts in China to leave within the month.
  - id: F7
    kind: situation
    status: confirmed
    fact: Chinese and Soviet spokesmen angrily confronted one another at a series of international Communist gatherings during
      1960, culminating at the CPSU's 22nd Congress in November.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: Copies of many angry letters distributed by the Soviets and Chinese were obtained by the United States and several
      friendly countries.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Earlier estimates acknowledged significant differences but judged fundamental conflict unlikely and the alliance
      necessary to maintain. That history cautions against treating discord as proof the alliance would end, but does not
      settle how serious the discord had become.
  - id: C2
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Moscow's order that its experts leave China and the angry confrontations at international Communist gatherings were
      concrete developments supporting a more serious estimate than the earlier assessments.
  - id: C3
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The letters provided new documentation of Sino-Soviet bitterness. The source identifies this unprecedented evidentiary
      breakthrough as the most important reason for the changed, more confident judgment.
  - id: C4
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Differences involved important policy questions, and Beijing was assessed to retain some capacity for independent
      action. These points made the discord more consequential than a disagreement within a relationship wholly controlled
      by Moscow.
  reasoning:
    read: The question is whether the estimate should reflect increasingly serious discord, not whether the alliance had already
      ended. The trap is allowing the expectation that Moscow and Beijing would preserve their alliance to obscure evidence
      that their differences were growing more consequential.
    weighing: Earlier judgments provide some reason for restraint {C1}, but the expert withdrawal and angry confrontations
      supplied new evidence {C2}. Most important, the letters documented the bitterness directly {C3}; alongside the substantive
      disputes and Beijing's capacity for independent action {C4}, that evidence supports raising the estimate. The balance
      supports greater confidence about serious discord, not a conclusion that the alliance had dissolved.
    tradecraft: Update the coordinated estimate to reflect the new evidence, distinguish the seriousness of discord from the
      separate question of alliance survival, and record which evidence supports each judgment and its weight.
    uncertainty: The evidence supports a more serious assessment of discord, but the facts here do not establish that either
      side would abandon the alliance or permit it to break apart.
    handoff: This is a coordinated-estimate judgment for the Intelligence Community; coordinate the revision across the estimating
      process so the updated assessment and its confidence are shared and consistent.
    tempting_wrong:
      option: O2
      pull: Earlier estimates judged that the alliance would be maintained and that conflicts were unlikely to impair its
        solidarity.
      why_wrong: That view does not account for the new 1960 developments or the especially important documentary evidence
        of bitterness.
    rejected:
      O2: The Intelligence Community did not retain or lower the seriousness estimate because the accumulated evidence, especially
        the letters, supported a more confident judgment of discord.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The evidence of the expert withdrawal, confrontations, and letters were materially undermined or shown not to indicate
        genuine discord.
      then: O2
      why: Without the developments that drove the changed judgment, the earlier assessments favoring restraint would carry
        more weight.
    - id: flip2
      if: New, reliable evidence showed that the disagreements had substantially receded and the relationship had become more
        cohesive.
      then: O2
      why: A meaningful reduction in discord would support lowering its assessed seriousness.
    would_not_change:
    - id: noflip1
      if: The two sides continued to maintain a formal alliance despite the documented disputes.
      why: Alliance continuity alone would not erase the evidence of serious discord; the earlier assessment already contemplated
        alliance maintenance alongside difficult differences.
    watch_for:
    - id: watch1
      what: Further reliable evidence clarifying whether the disagreements persist, intensify, or recede.
      favors:
      - O1
      - O2
      why: The estimate should track the direction and seriousness of the relationship's development rather than treat the
        current judgment as fixed.
  lesson: Do not let an enduring alliance or an established analytic judgment substitute for weighing new evidence about the
    relationship's actual condition. Update the assessment in proportion to the evidence, while keeping the seriousness of
    discord distinct from the question of whether the alliance will survive.
  limits: This reasoning addresses the seriousness of Sino-Soviet discord in the evidence described here. It does not determine
    whether the alliance would ultimately dissolve or prescribe an operational or policy response to the assessment.
