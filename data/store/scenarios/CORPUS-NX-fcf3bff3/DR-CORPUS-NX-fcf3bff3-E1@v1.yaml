case:
  id: DR-CORPUS-NX-fcf3bff3-E1@v1
  title: Funding a Confederate Sabotage Program
  status: draft
  setting: Richmond, Virginia, late February 1864, Confederate government
  decider: The Confederate President
  agent: The Confederate President
  agent_role: decide
  situation: By late February 1864, the Confederate President faced a choice about funding and authorizing a sabotage program
    against Union military targets. A wartime bounty offered an inventor half the value of any enemy vessel destroyed, and
    the Union ironclad was valued at $250,000. The proposal had reached Confederate officials, and the President viewed it
    favorably while the Secretary of War remained skeptical. The Secretary had approved development and testing in December,
    and formal legal approval followed on February 17. Courtenay had reported that the Secretary would take no action without
    congressional action. By February 9, Union forces had acquired intelligence of the program’s existence.
  question: What should the Confederate President do about funding and authorizing the sabotage program against Union military
    targets?
  options:
    O1:
      do: The Confederate President approves and funds the sabotage program against Union military targets.
      move: act
      irreversible: true
    O2:
      do: The Confederate President rejects and withholds funding for the sabotage program against Union military targets.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A wartime bounty offered the inventor half the value of any enemy vessel destroyed.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Union ironclad USS Monitor was valued at $250,000.
  - id: F3
    kind: situation
    status: confirmed
    fact: Courtenay arrived in Richmond in early November 1863 to pitch the proposal to Confederate officials.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Confederate President viewed the proposal favorably.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Secretary of War was skeptical of the proposal.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Secretary of War approved development and testing on December 4, 1863.
  - id: F7
    kind: authority
    status: assessed
    fact: Courtenay reported that the Secretary of War would take no action without congressional action.
  - id: F8
    kind: authority
    status: confirmed
    fact: Formal legal approval came on February 17.
  - id: F9
    kind: intelligence
    status: confirmed
    fact: By February 9, Union forces had acquired intelligence of the program’s existence.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The bounty offered a substantial personal reward for destroying an enemy vessel, and the Monitor's stated value made
      the incentive especially large. The source presents this as a wartime inducement, not as proof that the program would
      achieve a particular military result.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Confederate President viewed the proposal favorably, while the Secretary of War remained skeptical. The President's
      favorable assessment supports proceeding, but the source gives no further explanation of either official's assessment.
  - id: C3
    facts:
    - F6
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Development and testing had received the Secretary's approval, and formal legal approval followed on February 17.
      This supports the authority for proceeding beyond development and testing.
  - id: C4
    facts:
    - F9
    equity: source_protection
    favors:
    - O2
    weight: weak
    why: Union forces already knew the program existed before formal legal approval. That is a caution about the prospects
      for keeping the activity secret, although the source does not say that this intelligence caused the program to fail
      or changed the President's decision.
  reasoning:
    read: This was a wartime choice about whether to fund and authorize a proposed program against Union military targets,
      not simply whether to continue development and testing. The bounty created a strong personal incentive, but the source
      does not establish that the incentive itself demonstrated military value. The central tension is the President's favorable
      view and subsequent authorization against the Secretary's skepticism and the Union's prior awareness of the program.
    weighing: The source records the bounty as an inducement and the President as favorably impressed, but does not set out
      a detailed strategic justification. The strongest support for proceeding is that development and testing had been approved
      and formal legal approval followed before the President appropriated funds for secret-service activity and authorized
      the program. The Secretary's skepticism and the Union's awareness are cautions; the source records no finding that either
      outweighed the decision to proceed. The balance depends on having legal authority to act and accepting the risks associated
      with an already-known program.
    tradecraft: Record the decision as a separate funding and authorization decision, distinguish it from the earlier development
      approval, and document the legal basis and the unresolved skepticism and exposure concern. Keep the record at the level
      of authority, purpose, and risk; do not include operational methods.
    uncertainty: The source does not explain the Secretary's reasons for skepticism, assess the likely military effectiveness
      of the program, or describe the consequences of the Union's intelligence. It establishes the authorization and funding
      decision, not the results of later operations.
    handoff: The President should involve the Secretary of War and the officials responsible for establishing formal legal
      authority, because the source records both the Secretary's reservations and that congressional action was considered
      necessary before further action.
    tempting_wrong:
      option: O2
      pull: The Secretary was skeptical, and Union forces had already learned of the program.
      why_wrong: Those are genuine cautions, but they did not displace the President's favorable view, the subsequent formal
        legal approval, or the President's recorded decision to appropriate funds and authorize the program.
    rejected:
      O2: The President did not reject the program; the source records a favorable view followed by an appropriation and authorization.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Formal legal approval had not been obtained for the proposed authorization.
      then: O2
      why: Without an established legal basis to proceed, the President should withhold authorization and funding rather than
        treat prior development approval as sufficient.
    - id: flip2
      if: The President had reliable evidence that the program's prior exposure made it unable to serve its stated military
        purpose.
      then: O2
      why: That would turn the recorded intelligence concern into evidence that proceeding would not achieve the program's
        purpose.
    would_not_change:
    - id: noflip1
      if: The Secretary remained skeptical without new evidence or a different legal-authority status.
      why: The source records the Secretary's skepticism alongside the President's favorable view and the eventual authorization;
        skepticism alone did not determine the outcome.
    watch_for:
    - id: watch1
      what: Whether the program has formal legal approval and the required congressional action.
      favors:
      - O1
      - O2
      why: The source links the Secretary's reluctance to the absence of congressional action and records formal legal approval
        before the later funding and authorization.
    - id: watch2
      what: Whether Union awareness of the program materially undermines its ability to serve its stated purpose.
      favors:
      - O2
      why: Union forces had acquired intelligence of the program before formal approval, but the source does not report the
        operational consequence.
  lesson: A compelling wartime incentive is not by itself a sufficient reason to authorize a program. Separate the question
    of military purpose from the incentive, confirm the legal authority for proceeding, and weigh known reservations and exposure
    without treating them as decisive unless their consequences are established.
  limits: This reasoning is limited to the source's account of a Confederate decision to fund and authorize a program against
    Union military targets. It does not establish the legality of particular attacks, their effects, or any general rule permitting
    covert action.
