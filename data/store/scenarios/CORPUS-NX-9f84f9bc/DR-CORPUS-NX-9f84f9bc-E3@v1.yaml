case:
  id: DR-CORPUS-NX-9f84f9bc-E3@v1
  title: Selecting Cold War DI Documents for Release
  status: draft
  setting: CIA Directorate of Intelligence document review for a conference collection on the Soviet Union during the Cold
    War years.
  decider: The Agency
  agent: The Agency
  agent_role: decide
  situation: The Agency is assembling a collection of Directorate of Intelligence documents on the Soviet Union published
    during the Cold War years but not yet declassified. The body of available documents is too large to review in full for
    declassification and release. The collection is intended to represent major developments and analytic issues and to capture
    the tenor and substance of the Agency's analysis. The choice is whether to prioritize subject coverage and historical
    representation or the perceived quality of the analysis. Reviewers also face limits on release where disclosure could
    compromise still-sensitive sources and methods or harm current government-to-government relations.
  question: What should the Agency do in choosing documents for review and release?
  options:
    O1:
      do: The Agency withholds documents chosen for subject coverage after screening their analytic quality.
      move: act
      irreversible: true
    O2:
      do: The Agency discloses documents chosen for subject coverage without screening their analytic quality.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The body of Directorate of Intelligence documents on the Soviet Union published during the Cold War years but not
      yet declassified was too large to review in full for declassification and release.
  - id: F2
    kind: situation
    status: confirmed
    fact: The intended collection was to represent most or all major developments and analytic issues of the period and adequately
      capture the tenor and substance of Directorate of Intelligence analysis.
  - id: F3
    kind: situation
    status: confirmed
    fact: Reports reflecting in-depth or long-term research and generally containing analytic judgments, estimates, and forecasts
      were selected for review; a few memoranda or other special products, but virtually no current intelligence, were included.
  - id: F4
    kind: situation
    status: confirmed
    fact: A listing of report subject titles was used to select documents for substantive content, without regard to the quality
      of their analysis.
  - id: F5
    kind: situation
    status: confirmed
    fact: No document was excluded from the collection, and no information was redacted to conceal analytic judgments later
      proven wrong.
  - id: F6
    kind: situation
    status: confirmed
    fact: Conference authors reviewed the documents selected by subject matter for substantive historical gaps, and National
      Intelligence Estimates were used in some instances to fill gaps.
  - id: F7
    kind: situation
    status: confirmed
    fact: Concerted efforts were made to release as many documents as possible and declassify as much information as possible
      in included documents.
  - id: F8
    kind: situation
    status: confirmed
    fact: Some records could not be released in full without compromising still-sensitive intelligence sources and methods
      or harming current government-to-government relations.
  - id: F9
    kind: situation
    status: confirmed
    fact: Where possible, summaries, conclusions, or key judgments were released while detailed supporting analysis was withheld;
      some documents could not be released because extensive redactions would make them meaningless or seriously distorted.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The collection was meant to represent the period’s major developments and analytic issues and capture the tenor and
      substance of DI analysis. Subject-based selection, supplemented by review for historical gaps, served that purpose despite
      the body of available documents being too large to review in full.
  - id: C2
    facts:
    - F4
    - F5
    equity: public_transparency
    favors:
    - O2
    weight: strong
    why: Selecting for substantive content without screening analytic quality, and not removing documents or redacting judgments
      because they proved wrong, supported a fuller and less curated public record.
  - id: C3
    facts:
    - F8
    - F9
    equity: source_protection
    favors:
    - O1
    weight: strong
    why: Disclosure could compromise still-sensitive sources and methods; the Agency also considered harm to current government-to-government
      relations. These concerns justify limits on release where they apply, though they do not justify screening documents
      for analytic quality.
  - id: C4
    facts:
    - F7
    - F9
    equity: public_transparency
    favors:
    - O2
    weight: strong
    why: The Agency sought to release as many documents and as much information as possible, using summaries, conclusions,
      or key judgments when full release was not possible. It withheld documents entirely when redaction would make them meaningless
      or seriously distort them.
  - id: C5
    facts:
    - F8
    - F9
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: The possibility of harming current government-to-government relations weighs against unrestricted release in particular
      cases. The stated response was to limit sensitive content where necessary, not to select documents according to the
      perceived quality of their analysis.
  reasoning:
    read: The Agency had to make a representative collection from a body too large to review in full, not create a selection
      of only assessments later judged sound. The trap is to treat analytic quality as a proxy for historical value, which
      would leave out part of the tenor and substance the collection was meant to capture. Choosing by subject coverage does
      not require releasing sensitive material without limits.
    weighing: 'Coverage and a fuller account of DI analysis favor {O2}: the Agency selected for substantive content without
      regard to analytic quality and did not conceal judgments later proven wrong. Sensitive sources, methods, and current
      government-to-government relations constrain what can be released, but the stated approach was to release summaries
      or key judgments where possible and withhold details—or whole documents where redaction would distort them. The balance
      depends on the release risk for particular records, not on whether their analysis is perceived as good.'
    tradecraft: 'Use subject matter to build the collection, then review it for historical gaps. Keep the selection decision
      distinct from the declassification decision: release as much as can be disclosed, use summaries, conclusions, or key
      judgments when appropriate, and withhold supporting detail or a document when disclosure creates the stated risks or
      redaction would distort it. Record the reason for each limitation so it is not confused with an effort to hide a mistaken
      judgment.'
    uncertainty: The collection could not include every document, and the source gives no document-by-document assessment
      of which records posed sensitivity risks. It also does not specify a formal threshold for when release would harm current
      relations or when redaction would seriously distort a document.
    handoff: The Agency holds the decision. Conference authors reviewed the subject-selected documents for historical gaps,
      while release decisions must account for sensitive sources and methods and current government-to-government relations;
      involve the relevant declassification reviewers in applying those limits.
    tempting_wrong:
      option: O1
      pull: Screening out analysis judged weak may seem to improve the collection’s reliability.
      why_wrong: The stated aim was to represent the tenor and substance of DI analysis, and the selection was expressly made
        without regard to analytic quality; excluding or concealing judgments later shown wrong would undermine that aim.
    rejected:
      O1: The Agency did not choose documents by perceived analytic quality; it selected for substantive coverage and handled
        sensitivity concerns through release limits instead.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The collection’s objective were instead to include only analysis meeting a specified quality standard.
      then: O1
      why: Under that different objective, quality screening would serve the collection’s purpose rather than exclude material
        needed for historical representation.
    would_not_change:
    - id: noflip1
      if: A selected assessment were later shown to be wrong.
      why: 'That alone would not change the subject-based selection approach: the collection did not exclude documents or
        redact information to conceal judgments later proven wrong.'
    watch_for:
    - id: watch1
      what: Whether disclosure of a particular record would compromise still-sensitive sources or methods, harm current government-to-government
        relations, or make the record meaningless or seriously distorted through redaction.
      favors:
      - O1
      why: These conditions can justify withholding details or, in some cases, an entire document, while leaving the quality-neutral
        selection principle intact.
  lesson: When the purpose is to represent a historical record, select for substantive coverage rather than filtering out
    material for perceived analytic weakness. Apply disclosure limits separately and narrowly where sensitivity or distortion
    makes release unsafe or misleading.
  limits: This reasoning concerns selection for a historical collection and does not establish that every selected document
    must be released in full. It does not supply a general release threshold beyond the stated concerns about sensitive sources
    and methods, current government-to-government relations, and seriously distorting redactions.
