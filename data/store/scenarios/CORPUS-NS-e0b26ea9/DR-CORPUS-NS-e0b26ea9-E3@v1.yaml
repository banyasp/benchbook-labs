case:
  id: DR-CORPUS-NS-e0b26ea9-E3@v1
  title: Afghan Insurgency Support Authorization
  status: draft
  setting: Afghanistan, 23 July discussion, U.S. presidential decision-making
  decider: The President
  agent: The President
  agent_role: decide
  situation: In Afghanistan, the President is considering whether to authorize limited covert support for insurgents amid
    increasing Soviet military involvement and widespread resistance to the Soviet-supported regime. Washington has warned
    Moscow that its actions could jeopardize U.S.-Soviet relations, but Moscow has rebuffed those warnings. The contemplated
    support is nonmilitary, including propaganda support, medical assistance, and other nonmilitary supplies. The National
    Security Advisor has raised the prospect that Moscow might try to unseat the current government and assessed that the
    government’s tactics were counterproductive to Moscow’s aims.
  question: What should the President do about authorizing limited covert support for the Afghan insurgency?
  options:
    O1:
      do: The President declines to authorize limited covert, nonmilitary support for the Afghan insurgency.
      move: act
      irreversible: false
    O2:
      do: The President authorizes limited covert, nonmilitary support for the Afghan insurgency.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Soviet military involvement in Afghanistan was increasing.
  - id: F2
    kind: situation
    status: confirmed
    fact: There was widespread resistance to the Soviet-supported regime.
  - id: F3
    kind: situation
    status: confirmed
    fact: Washington had warned Moscow that its actions could jeopardize U.S.-Soviet relations, and Moscow had rebuffed those
      warnings.
  - id: F4
    kind: situation
    status: confirmed
    fact: The contemplated support was limited and nonmilitary, including propaganda support, medical assistance, and other
      nonmilitary supplies.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The National Security Advisor raised the prospect that the Soviets might try to unseat the current government.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The current government’s tactics were considered counterproductive to Moscow’s aims.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Increasing Soviet military involvement and widespread resistance to the Soviet-supported regime were the stated context
      for authorizing support to the insurgency.
  - id: C2
    facts:
    - F3
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: Washington had warned Moscow that its actions could jeopardize U.S.-Soviet relations, but Moscow rebuffed the warnings;
      this formed part of the context for the authorization.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: humanitarian_access
    favors:
    - O2
    weight: weak
    why: The authorized support was limited and nonmilitary, including medical assistance and supplies. The President was
      also told of the assessed possibility that Moscow might try to unseat a government whose tactics were counterproductive
      to Moscow’s aims.
  reasoning:
    read: The decision was to authorize limited, nonmilitary support amid increasing Soviet involvement and widespread resistance,
      after Moscow rebuffed U.S. warnings {C1} {C2}. The prospect that Moscow might try to unseat the government was an assessment,
      not an established event {F5}. Do not conflate the separate direction to put a public spotlight on the issue with the
      covert-support authorization.
    weighing: The President’s stated rationale was the combination of growing Soviet military involvement, resistance to the
      Soviet-supported regime, and Moscow’s rebuffs of U.S. warnings {C1} {C2}. The contemplated support was nonmilitary and
      included propaganda support, medical assistance, and other supplies {C3}. The source records authorization, but does
      not set out a legal analysis, a detailed comparison of risks, or a threshold for when that balance would change.
    tradecraft: At the decision level, record the authorization, its limited nonmilitary scope, and the stated policy rationale.
      Keep the separate public-expression direction distinct, and do not infer legal findings or implementation details not
      given.
    uncertainty: The source does not specify how the President weighed the risk to U.S.-Soviet relations, how effective the
      support was expected to be, or whether the assessment about a possible attempt to unseat the government materially affected
      the authorization.
    handoff: The President made the decision; the National Security Advisor raised relevant proposals and assessments. The
      source does not identify another approval authority.
    tempting_wrong:
      option: O1
      pull: Declining could appear prudent because Washington had warned that Soviet actions could jeopardize U.S.-Soviet
        relations.
      why_wrong: The source’s stated rationale is that Moscow rebuffed those warnings while Soviet military involvement increased
        and resistance to the regime was widespread; the President authorized limited support in that context.
    rejected:
      O1: The President did not decline; the source records an initial authorization of covert support for the Afghan insurgency.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Moscow had not rebuffed Washington’s warnings and the other stated conditions were materially different.
      then: O1
      why: The rebuffs, together with increasing Soviet involvement and widespread resistance, form part of the context prompting
        authorization; removing that context could weaken the stated rationale.
    - id: flip2
      if: The contemplated support were no longer limited and nonmilitary.
      then: O1
      why: The stated rationale supports limited, nonmilitary assistance; a materially different form of support would require
        a separate basis.
    would_not_change:
    - id: noflip1
      if: The assessment that the government’s tactics were counterproductive to Moscow’s aims were withdrawn, while increasing
        Soviet involvement, widespread resistance, and Moscow’s rebuffs remained.
      why: Those other conditions are the stated combined context for the initial authorization; the counterproductive-tactics
        assessment is not presented as a necessary condition.
    watch_for:
    - id: watch1
      what: Whether the assessed prospect of Moscow trying to unseat the current government becomes more or less credible.
      favors:
      - O2
      why: The National Security Advisor raised this prospect, but it was not established as fact and its weight in the authorization
        is unspecified.
  lesson: When an authorization responds to a combination of worsening conditions and rebuffed warnings, preserve that combined
    rationale rather than treating one fact as the sole trigger. Keep the decision within the scope actually described, and
    distinguish assessed possibilities from established events.
  limits: This reasoning applies to the recorded decision to authorize limited, nonmilitary support in the stated Afghanistan
    context. It does not establish a general legal rule, assess the program’s later effects, or justify materially different
    forms of support.
