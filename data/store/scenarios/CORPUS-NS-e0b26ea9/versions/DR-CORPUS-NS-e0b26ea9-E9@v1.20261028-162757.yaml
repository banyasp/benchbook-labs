case:
  id: DR-CORPUS-NS-e0b26ea9-E9@v1
  title: Assessing the Prospect of Soviet Intervention
  status: draft
  setting: US intelligence community, Afghanistan, late 1979
  decider: US intelligence analysts
  agent: US intelligence analysts
  agent_role: decide
  situation: In late 1979, US intelligence analysts were assessing the likelihood and scale of Soviet military intervention
    in Afghanistan. Reports recorded elevated readiness among Soviet military units over preceding months, partial mobilization
    near the Afghan border in late November, and additional combat units entering Afghanistan in early December. The Kabul
    regime was increasingly precarious, and its survival without major Soviet military support was increasingly questionable.
    The prevailing estimate treated limited, incremental action as most likely and judged insertion of Soviet combat forces
    doubtful. The reported preparations and political developments were included in daily intelligence reporting.
  question: What should US intelligence analysts do when evaluating the reported preparations against their estimate of Soviet
    willingness to intervene?
  options:
    O1:
      do: The analysts credit the reported preparations as evidence of a real prospect of an intermediate-sized Soviet intervention.
      move: act
      irreversible: false
    O2:
      do: The analysts discredit the reported preparations as evidence of a real prospect of an intermediate-sized Soviet
        intervention.
      move: act
      irreversible: false
    O3:
      do: The analysts hold the estimate pending a fresh review of the force-preparation and political evidence.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: The principal Soviet military units increased readiness during the preceding months; the two ground-force divisions
      closest to the Afghan border showed increased readiness from March and again during the summer and fall.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The two divisions closest to the border showed unusual activity in October, partially mobilized in the last week
      of November, and the nearby airborne division had been kept at higher-than-normal readiness for most of this period.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Two additional combat battalions and special forces units entered Afghanistan in the first week of December, followed
      a few days later by another airborne battalion.
  - id: F4
    kind: situation
    status: assessed
    fact: The Soviet-sponsored Kabul regime was increasingly precarious, and its survival without major military support from
      the USSR was increasingly questionable.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A September 28 intelligence assessment judged insertion of Soviet combat forces doubtful and considered limited,
      incremental action the most likely form of intervention.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The assessment treated an operation involving two or three ground divisions and one or two airborne divisions as
      falling between the contemplated alternatives.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: Information on Soviet force preparations and Afghanistan's deteriorating internal situation was reported in daily
      intelligence publications.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Force readiness, partial mobilization, additional units entering Afghanistan, and the Kabul regime's worsening position
      together warranted serious concern that a larger intervention was a real prospect.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The estimate had effectively ruled out the intermediate-sized operation that the preparations could indicate. The
      preparations should have been assessed for what they might mean, rather than discounted because they did not fit the
      estimate.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: weak
    why: The evidence did not make intervention inevitable. But the relevant judgment was whether there was a real prospect,
      not whether intervention was certain.
  - id: C4
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Analysts' view that political and military costs argued against intervention was not necessarily mistaken; the error
      was allowing that judgment about Soviet willingness to override evidence of preparations. The Soviet decision remained
      a work in progress.
  reasoning:
    read: The situation called for an estimate of likelihood, not a finding that intervention was inevitable. The reported
      preparations and the Kabul regime's precarious position supported serious concern about intervention, while the prior
      model of Soviet willingness led analysts to explain away evidence that did not fit it.
    weighing: 'The convergence of readiness, mobilization, additional forces, and deteriorating conditions in Afghanistan
      supports {O1}. The prior estimate''s limited-action and large-force alternatives had effectively excluded the intermediate
      scale that the Soviets used; that mismatch should have prompted analysts to question the model. The limits of the conclusion
      matter: the evidence warranted judging intervention a real prospect, not certain. The balance depends on evaluating
      the preparations on their own merits rather than filtering them through assumptions about what Soviet leaders would
      be willing to do.'
    tradecraft: Compare the reported preparations and political conditions with the estimate, explicitly identify where the
      evidence does not fit its assumptions, and record both the real prospect of intervention and the uncertainty about whether
      it will occur. This is a decision-practice synthesis, not a claim that the source prescribed a particular review procedure.
    uncertainty: The preparations did not establish that intervention was inevitable. The Soviet leadership's decision was
      still developing, so the estimate should express a real prospect without presenting the outcome as settled.
    handoff: The source identifies the intelligence analysts and community as responsible for the estimate, but does not prescribe
      referral to another authority. No higher-level handoff is needed to make the analytic judgment; this is a synthesis
      of the decision frame.
    tempting_wrong:
      option: O2
      pull: The September estimate judged combat-force insertion doubtful and treated limited, incremental action as most
        likely.
      why_wrong: 'That prior view became a filter for the evidence: the preparations were judged against what analysts expected
        rather than used to test whether the expectation was wrong.'
    rejected:
      O2: The reported preparations and worsening political situation warranted serious concern about a real prospect of intermediate-sized
        intervention, so discrediting them on the basis of the prior model was not justified.
      O3: Although intervention was not inevitable, the evidence already warranted serious concern; holding the estimate pending
        review would fail to give that evidence its due weight.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the observed readiness and force movements were routine, unrelated to possible
        intervention, and not accompanied by a deteriorating situation in Kabul.
      then: O2
      why: Without preparations or political conditions supporting intervention, the evidence would no longer warrant crediting
        an intermediate-sized intervention as a real prospect.
    would_not_change:
    - id: noflip1
      if: The evidence still fell short of showing that intervention was inevitable.
      why: The source distinguishes inevitability from a real prospect and says the evidence warranted serious concern even
        without establishing certainty.
    - id: noflip2
      if: The political costs of intervention were genuinely seen by Soviet officials and military planners as reasons against
        it.
      why: Those deterrent arguments could be sound without establishing that Soviet leaders would refrain; the decision remained
        in progress.
    watch_for:
    - id: watch1
      what: Changes in force readiness, deployments, or the Kabul regime's condition, alongside signs that Soviet leaders'
        decision is developing.
      favors:
      - O1
      - O2
      why: Force readiness, deployments, the Kabul regime's condition, and the evolving Soviet decision can strengthen or
        weaken the assessed prospect over time.
  lesson: Do not let an estimate of what an actor is likely to choose become a filter that explains away evidence of what
    it is preparing to do. Separate a judgment that an outcome is not inevitable from the distinct judgment that it is a real
    prospect.
  limits: This reasoning concerns an intelligence estimate of likelihood and scale based on the reported preparations and
    political situation in late 1979. It does not establish that intervention was certain or prescribe any operational response.
  library:
    domain: intel-analysis
    family: CORPUS-NS-e0b26ea9
    source: https://www.cia.gov/resources/csi/static/e8fa84316547f220a8432d3e1d9830af/Predicting-the-Soviet-Invasion-of-Afghanistan.pdf
    episode_focus: 'This is an estimative judgment about the likelihood and scale of intervention: analysts favored limited,
      incremental action and effectively discounted an intermediate-sized force. Consider the mismatch between that model
      and the reported preparations, and exclude speculation about operational responses.'
