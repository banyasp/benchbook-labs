case:
  id: DR-CORPUS-NX-a9167dae-E5@v1
  title: Dak To Warning Assessment
  status: draft
  setting: The 330th Radio Research Battalion in the Dak To area of Vietnam’s western highlands, October 1967.
  decider: The 330th Radio Research Battalion analysts
  agent: The 330th Radio Research Battalion analysts
  agent_role: decide
  situation: In October 1967, Communist elements were moving and realigning across the area. An expected indication of precombat
    reconnaissance had been absent, although reconnaissance was normally a prerequisite to an attack. On 23 October, that
    reconnaissance began. During October, activity indicated that the North Vietnamese 1st Division was preparing for urgent
    operations and was concerned its activity would be detected. North Vietnamese regiments arrived in the Dak To area on
    25, 27, and 30 October. The analysts had to decide whether to issue a warning based on the accumulating indicators.
  question: What should the 330th Radio Research Battalion analysts do about issuing a warning of a major tactical thrust
    in the Dak To area between 30 October and 4 November?
  options:
    O1:
      do: The 330th analysts disclose a warning of a major thrust in the Dak To area between 30 October and 4 November.
      move: act
      irreversible: true
    O2:
      do: The 330th analysts request corroboration from other U.S. intelligence elements before deciding on the Dak To warning.
      move: ask
      irreversible: false
      to: other U.S. intelligence elements
    O3:
      do: The 330th analysts withhold a warning of a major thrust in the Dak To area between 30 October and 4 November.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The chief linguist reported that Communist elements were moving and realigning with other elements across the area.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Precombat reconnaissance, normally a prerequisite to an attack, had not been observed before 23 October.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: North Vietnamese precombat reconnaissance began on 23 October.
  - id: F4
    kind: intelligence
    status: assessed
    fact: During October, activity indicated that the North Vietnamese 1st Division was preparing for urgent operations and
      was concerned its activity would be detected by the United States.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The North Vietnamese 32nd Regiment was located in the Dak To area on 25 October.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The North Vietnamese 66th Regiment moved to the Dak To area on 27 October.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The North Vietnamese 174th Regiment arrived in the Dak To area on 30 October.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Movement and realignment, indications of urgent operations, and the arrival of three regiments in the Dak To area
      formed a converging basis for the warning rather than a conclusion resting on one indicator.
  - id: C2
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The absence of the normally expected precombat reconnaissance was a significant gap, but that gap closed when reconnaissance
      began on 23 October.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F6
    - F7
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The indicators accumulated over a short period, and the assessed window was near; issuing the warning in time mattered
      more than waiting for certainty about the precise day.
  - id: C4
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The warning was an assessment of a likely major thrust, not a claim that an attack was certain. The source supports
      acting on the combined indicators while retaining that uncertainty in the assessment.
  reasoning:
    read: 'The situation had moved beyond general concern: the expected reconnaissance indication had appeared, alongside
      activity assessed as preparation for urgent operations and the arrival of regiments in the area. The trap was treating
      the earlier absence of reconnaissance as a continuing reason to wait after that gap had closed.'
    weighing: The converging indicators supported warning of a major thrust in the Dak To area, with a probable time window
      of 30 October to 4 November. Although the exact timing was uncertain and the evidence did not establish certainty of
      attack, the analysts judged the indicators sufficient to issue the assessment. The balance depended on the new reconnaissance
      indication joining the other evidence; the narrow time window favored prompt reporting.
    tradecraft: State the assessed likelihood, area, and time window as an assessment rather than a certainty. Identify the
      basis accurately, distinguish assessed indications from confirmed movements, and update the warning if the evidence
      changes.
    uncertainty: The source gives a probable window, not an exact attack date or certainty that the attack would occur. The
      earlier absence of reconnaissance was a genuine evidentiary gap, but reconnaissance began on 23 October.
    handoff: The 330th analysts issued the unit's assessment. The account provides no basis for making corroboration by other
      intelligence elements a prerequisite to issuing this time-sensitive warning.
    tempting_wrong:
      option: O2
      pull: Seeking corroboration could appear prudent while the exact timing and occurrence of an attack remained uncertain.
      why_wrong: By the decision point, the key reconnaissance indication had appeared and other indicators had accumulated;
        waiting for additional corroboration risked delaying a warning within a near-term window.
    rejected:
      O2: The analysts did not defer the warning for further corroboration because the accumulated indicators, including the
        newly observed reconnaissance, supported timely assessment.
      O3: Withholding the warning would have disregarded the convergence of indicators supporting a major thrust in the Dak
        To area.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The reconnaissance indication had remained absent and the other reported indicators, including the regiment arrivals,
        had not accumulated.
      then: O2
      why: Without the key expected indication and the converging evidence, seeking corroboration would be more justified
        than issuing this specific warning.
    would_not_change:
    - id: noflip1
      if: The precise day of an attack remained uncertain within the assessed 30 October to 4 November window.
      why: The warning itself was framed as a probable window, and uncertainty about the exact day did not negate the accumulated
        basis for issuing it.
    watch_for: []
  lesson: A missing expected indicator can justify caution, but reassess when that indicator appears and other evidence converges.
    In a time-sensitive assessment, communicate the supported likelihood and window without presenting them as certainty.
  limits: This reasoning concerns an intelligence warning based on the indicators described in this account; it does not establish
    a general threshold for warnings in other circumstances. It does not determine what response should follow the warning.
  library:
    domain: intel-analysis
    family: CORPUS-NX-a9167dae
    source: https://media.defense.gov/2021/Jul/13/2002761879/-1/-1/0/TRAFFIC_ANALYSIS.PDF
