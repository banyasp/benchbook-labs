        O1: 21
        O2: 17
        O3: 21
      real_option: O1
      real_to_mean_other_length: 1.11
      real_is_longest: true
      moves:
        O1: act
        O2: ask
        O3: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
        O3: true
    equities: pilot2
