case:
  id: DR-CORPUS-NX-a9167dae-E3@v1
  title: Trusting Intelligence or Preserving the Fleet
  status: draft
  setting: North Sea, May 1916, British Fleet
  decider: The British fleet commander
  agent: The British fleet commander
  agent_role: decide
  situation: The German fleet was returning toward port. The British fleet commander held accurate intelligence about the
    direction of its return. An earlier misleading report had placed the German fleet flagship at its base and delayed the
    British fleet commander's movement. The commander had become jaded about intelligence quality and was concerned with preserving
    the British fleet. The decision was whether to act on the return-direction intelligence to seek a major engagement or
    to set it aside and prioritize fleet preservation.
  question: 'What should the British fleet commander do with the intelligence about the German fleet''s return direction:
    act on it to seek a major engagement or set it aside and prioritize preserving the British fleet?'
  options:
    O1:
      do: The British fleet commander acts on the return-direction intelligence and pursues a major engagement.
      move: act
      irreversible: true
    O2:
      do: The British fleet commander sets aside the return-direction intelligence and avoids a major engagement.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The German fleet was returning toward port.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The British fleet commander had information about the direction of the German fleet's return route to port.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The information about the German fleet's return direction was accurate.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: An earlier misleading report placed the German fleet flagship at its base.
  - id: F5
    kind: situation
    status: confirmed
    fact: The earlier misleading report delayed the British fleet commander's movement toward the German fleet.
  - id: F6
    kind: situation
    status: assessed
    fact: The British fleet commander had become jaded about the quality of the intelligence.
  - id: F7
    kind: situation
    status: assessed
    fact: The British fleet commander's desire to preserve the British fleet influenced the decision.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The return-direction information was accurate, but the commander had become jaded about intelligence quality and
      refused to rely on it. The account treats that distrust as a reason the intelligence was misused, not as a sound basis
      for setting aside this accurate information.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The account says relying on the accurate return-direction intelligence offered an opportunity to inflict serious
      damage and possibly achieve a naval victory. It judges that opportunity was missed.
  - id: C3
    facts:
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: Preserving the British fleet was a genuine concern, but the account characterizes the commander's resulting restraint
      as timidity and says it caused him to miss the opportunity presented by accurate intelligence.
  - id: C4
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The earlier misleading report had delayed the commander's movement and could reasonably damage confidence in intelligence.
      But the account distinguishes that error from the later accurate information about the German fleet's return direction.
  reasoning:
    read: 'The central issue is not whether intelligence can ever be wrong: an earlier misleading report had already delayed
      the commander. The trap is allowing that experience and a general desire to preserve the fleet to override accurate
      information about the German fleet''s return.'
    weighing: The account endorses acting on the accurate return-direction intelligence because refusing to rely on it forfeited
      an opportunity to inflict serious damage and perhaps achieve a naval victory {C1} {C2}. Fleet preservation weighs in
      the other direction, but the account judges that concern, in this instance, produced timidity rather than a sound reason
      to disregard the information {C3}. The balance depends on the return information being accurate, as the scenario establishes,
      rather than merely on confidence in intelligence generally.
    tradecraft: Assess the reliability of the current information on its own merits, distinguishing it from the earlier misleading
      report. Record the information's assessed reliability, the fleet-preservation concern, and the reason for the decision
      without treating either concern as a substitute for evaluating the current evidence.
    uncertainty: 'The account identifies a missed opportunity, not a guaranteed result: it says the intelligence might have
      enabled serious damage and perhaps altered the war''s outcome. It does not quantify the risk to the British fleet or
      establish that acting would certainly have produced a victory.'
    handoff: The fleet commander should own the judgment. The source supplies no approval chain; as a decision practice, the
      commander could seek an assessment of the current information's reliability and involve higher command if required by
      the applicable authority.
    tempting_wrong:
      option: O2
      pull: The earlier misleading report and the desire to preserve the fleet make setting the later intelligence aside feel
        prudent.
      why_wrong: The account's criticism is that the commander let jadedness and preservation concerns displace accurate information,
        thereby missing a significant opportunity.
    rejected:
      O2: The account rejects setting aside the accurate return-direction intelligence, judging that doing so through distrust
        and fleet-preservation concerns caused a major opportunity to be missed.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The return-direction information were shown to be inaccurate or unreliable.
      then: O2
      why: The recommendation to act depends on the intelligence being accurate; without that basis, pursuing a major engagement
        on this information would not follow from the account's reasoning.
    - id: flip2
      if: A concrete assessment established that acting on the information would expose the British fleet to unacceptable
        risk.
      then: O2
      why: A materially greater threat to the fleet could outweigh the opportunity to inflict damage; the source does not
        establish that such a risk existed.
    would_not_change:
    - id: noflip1
      if: The earlier misleading report remained the only reason for distrusting the current return-direction information,
        while that current information remained accurate.
      why: The account distinguishes the earlier error from the accurate return information and criticizes allowing generalized
        distrust to prevent its use.
    watch_for:
    - id: watch1
      what: Whether the current return-direction information remains reliable and whether there is concrete evidence of exceptional
        risk to the British fleet.
      favors:
      - O1
      - O2
      why: Reliability supports acting on the information; a substantial, evidenced fleet risk could support preservation
        instead.
  lesson: Do not let an earlier intelligence failure become a blanket reason to disregard later information whose accuracy
    is established. Weigh preservation concerns against the mission opportunity on the evidence at hand, and do not mistake
    caution for sound judgment when it causes accurate intelligence to go unused.
  limits: This reasoning applies to the stated decision, where the return-direction information was accurate and the account
    judged that a significant opportunity was missed. It does not establish that commanders should act on unverified intelligence,
    accept any level of fleet risk, or pursue an engagement regardless of circumstances.
