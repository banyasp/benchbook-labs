case:
  id: DR-CORPUS-NX-c2c1dd3e-E1@v1
  title: Brigade Data Literacy Training Decision
  status: draft
  setting: 513th Military Intelligence Brigade, during its brigade-wide INMODEX program; date not specified.
  decider: The 513th Military Intelligence Brigade leadership
  agent: The 513th Military Intelligence Brigade leadership
  agent_role: decide
  situation: Adversaries were assessed to be using data at unprecedented speeds on the battlefield. The 513th Military Intelligence
    Brigade was considering increasing data literacy across its formation. The initiative was part of the brigade-wide INMODEX
    program and was intended to improve members' ability to analyze and communicate data. Data Literacy 101 training with
    instructors from the United States Military Academy was a possible delivery approach.
  question: What should the 513th Military Intelligence Brigade leadership do regarding Data Literacy 101 training across
    the formation and the use of instructors from the United States Military Academy?
  options:
    O1:
      do: The brigade leadership approves and delivers a limited Data Literacy 101 course to selected members with USMA instructors.
      move: partial
      irreversible: false
    O2:
      do: The brigade leadership approves and delivers Data Literacy 101 to formation members with USMA instructors.
      move: act
      irreversible: false
    O3:
      do: The brigade leadership rejects Data Literacy 101 and withholds formation-wide training from the formation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Adversaries were increasingly using data.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Adversaries were using data to operate at unprecedented speeds on the battlefield.
  - id: F3
    kind: situation
    status: confirmed
    fact: The brigade initiative sought to increase data literacy across the formation.
  - id: F4
    kind: situation
    status: confirmed
    fact: The data literacy initiative was part of the brigade-wide INMODEX program.
  - id: F5
    kind: capability
    status: confirmed
    fact: The stated aim included improving the formation's ability to analyze data.
  - id: F6
    kind: capability
    status: confirmed
    fact: The stated aim included improving the formation's ability to communicate data.
  considerations:
  - id: C1
    facts:
    - F2
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The assessment that adversaries operated at unprecedented speed gives the brigade a reason to improve data literacy
      across the formation rather than leave the need unaddressed.
  - id: C2
    facts:
    - F3
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The initiative was intended to raise formation-wide literacy and improve members’ ability to analyze and communicate
      data, supporting the brigade’s stated aim of becoming more capable and competitive.
  - id: C3
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Delivering the training as part of INMODEX makes it a brigade initiative to promote innovation and modernization,
      rather than an isolated course.
  - id: C4
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: A proven curriculum and designated team members to lead the initiative are key to successful execution and to building
      a data-centric culture.
  reasoning:
    read: This is an organizational choice about building formation-wide data literacy in response to an assessed change in
      adversary tempo, not a decision about operational data use. The trap is to wait for top-down direction or treat the
      training as merely an isolated course when the objective is to change the formation’s culture.
    weighing: The assessed speed of adversary operations and the stated aims of improving analysis and communication support
      acting across the formation. A proven curriculum and designated team leads support successful execution, while proactive
      measures can foster a data-centric culture. Together, those reasons support {O2} over a limited effort or rejection;
      the balance depends on delivering the training with those implementation supports.
    tradecraft: Record the leadership rationale as a response to the assessed need and the intended formation-wide capability
      and culture change. Coordinate delivery with the USMA instructors, use the proven curriculum, and designate team members
      to lead the initiative.
    uncertainty: Cost, schedule, and assessment details are not specified, and training outcomes are not described as measured.
      More than 400 individuals were trained, but it is not established that every member completed the course.
    handoff: Brigade leadership owns the organizational decision and should coordinate with the USMA instructors, who partner
      in delivering the course.
    tempting_wrong:
      option: O1
      pull: A limited course for selected members may seem like a cautious way to begin.
      why_wrong: The objective is a formation-wide effort to change data literacy and culture, rather than limiting the initiative
        to a small group.
    rejected:
      O1: A selected-member course would fall short of the stated formation-wide objective and culture change.
      O3: Rejecting training would leave the stated need to improve formation data literacy unaddressed.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Delivery capacity or instructor availability made formation-wide training impracticable at the decision point.
      then: O1
      why: A limited course for selected members could preserve the initiative while accommodating a genuine delivery constraint;
        no such constraint is identified.
    would_not_change:
    - id: noflip1
      if: No top-down directive arrives to initiate the effort.
      why: Proactive action, rather than waiting for top-down direction, is the point of the example.
    watch_for:
    - id: watch1
      what: Whether the initiative uses a proven curriculum and designated team members to lead it.
      favors:
      - O2
      why: These are identified as key components of successful execution.
  lesson: When an assessed change in the operating environment creates a formation-wide skills need, a coordinated training
    effort can support both capability and culture. Use a proven curriculum and designate people to lead implementation; do
    not wait for top-down direction when the formation can take the initiative.
  limits: This reasoning addresses the organizational choice to provide data literacy training, not operational uses of data
    or methods of collection. It gives no cost, schedule, or outcome-measurement evidence from which to judge those factors.
