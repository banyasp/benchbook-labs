case:
  id: DR-CORPUS-NX-dce03f8d-E18@v1
  title: Reforming Oversight of the Special Service
  status: draft
  setting: Switzerland, after the 1979 parliamentary investigation, Swiss government
  decider: The Swiss government
  agent: The Swiss government
  agent_role: decide
  situation: Switzerland had established resistance organizations in anticipation of a possible full or partial Soviet occupation.
    The Military Intelligence Service created the Special Service as part of that effort. In 1979, a spy scandal led to a
    parliamentary commission investigation. The commission concluded that the Special Service had insufficient oversight and
    training. The government faced a choice between continuing the existing arrangement and reforming it.
  question: What should the Swiss government do about the Special Service after the parliamentary commission found insufficient
    oversight and training?
  options:
    O1:
      do: The Swiss government would make limited oversight and training changes while retaining the existing arrangement.
      move: partial
      irreversible: false
    O2:
      do: The Swiss government would reject reform and continue the existing arrangement without a new parliamentary oversight
        committee.
      move: act
      irreversible: false
    O3:
      do: The Swiss government would adopt reform, redesignate the effort as Project 26, and establish a five-member parliamentary
        oversight committee.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Switzerland had established resistance organizations in anticipation of a full or partial Soviet occupation.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Military Intelligence Service created the Special Service.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Special Service was assigned a role in organizing resistance in the event of occupation.
  - id: F4
    kind: situation
    status: confirmed
    fact: A 1979 spy scandal led to a parliamentary commission investigation.
  - id: F5
    kind: situation
    status: assessed
    fact: The parliamentary commission concluded that the Special Service had insufficient oversight.
  - id: F6
    kind: situation
    status: assessed
    fact: The parliamentary commission concluded that the Special Service had insufficient training.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The investigation followed a spy scandal and found oversight insufficient; the government’s reform established a
      five-member parliamentary oversight committee.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The commission found training insufficient, and the reformed effort was tasked with recruiting and training core
      personnel for the resistance mission.
  - id: C3
    facts:
    - F1
    - F3
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: weak
    why: The anticipated occupation gave the resistance effort an ongoing mission, supporting continued preparation rather
      than simply rejecting the effort; it does not by itself decide between limited changes and reform.
  reasoning:
    read: The decision was how to address identified oversight and training deficiencies in an organization maintained for
      a possible occupation, not whether the resistance mission existed. The trap is treating preservation of the mission
      as a reason to leave the deficiencies unaddressed.
    weighing: The commission’s findings point toward corrective action on both oversight and training {C1} {C2}. The continuing
      mission supports retaining a resistance effort, but does not require retaining the existing arrangement {C3}. The government
      chose reform, redesignated the effort as Project 26, and established parliamentary oversight. The source does not give
      a more detailed balancing explanation.
    tradecraft: Record the commission’s findings and the government’s reasons for the chosen oversight and training changes.
      Assign responsibility for reviewing whether those changes address the identified deficiencies, and document the review
      and any further corrective action.
    uncertainty: The source does not describe the committee’s powers, explain why it had five members, or specify the training
      deficiencies or how the reforms were assessed. It therefore supports the choice of reform but not conclusions about
      the reforms’ effectiveness.
    handoff: The Swiss government made the reform decision and established a five-member parliamentary oversight committee;
      the source does not identify any further referral or approval process.
    tempting_wrong:
      option: O1
      pull: Limited changes could appear sufficient to preserve the existing arrangement while responding to the commission.
      why_wrong: The source records a redesignation and a new parliamentary oversight committee, rather than limited changes
        that retained the existing arrangement.
    rejected:
      O1: The government did not choose limited changes while retaining the existing arrangement; it redesignated the effort
        and established a parliamentary oversight committee.
      O2: Rejecting reform would leave the commission’s stated oversight and training deficiencies without the reform response
        the government adopted.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent assessment showed that the oversight and training deficiencies had been fully corrected through limited
        changes to the existing arrangement.
      then: O1
      why: If limited changes demonstrably resolved the identified problems, retaining the existing arrangement could be sufficient.
    - id: flip2
      if: The resistance-preparation mission were no longer required.
      then: O2
      why: Without the mission that supports maintaining the effort, continuing it would no longer be justified on the source’s
        stated grounds.
    would_not_change:
    - id: noflip1
      if: There were a preference for organizational continuity, but no evidence that the commission’s oversight and training
        concerns had been resolved.
      why: Continuity alone would not answer the identified deficiencies that drove the reform response.
    watch_for:
    - id: watch1
      what: Whether the parliamentary oversight and training arrangements actually address the commission’s findings.
      favors:
      - O3
      why: The source records the reform but does not establish whether it remedied the identified shortcomings.
  lesson: When an investigation identifies shortcomings in oversight and training, preserving the underlying mission does
    not require preserving the deficient arrangement. Choose reforms that address the identified problems, then assess whether
    they work.
  limits: The source gives only a brief account of the commission’s findings and the government’s response; it does not establish
    the adequacy or later effectiveness of the reforms. This reasoning does not determine what oversight model or training
    measures would be sufficient in another setting.
