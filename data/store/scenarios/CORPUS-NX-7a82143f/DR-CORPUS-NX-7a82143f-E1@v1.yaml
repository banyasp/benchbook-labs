case:
  id: DR-CORPUS-NX-7a82143f-E1@v1
  title: Civilian Diversion During Brigade Defense
  status: draft
  setting: Along PL IRONWOOD during a brigade defense within an overall division defense; time unspecified; the Brigade.
  decider: The Brigade S-3 and S-9
  agent: The Brigade S-3 and S-9
  agent_role: decide
  situation: A brigade is defending along PL IRONWOOD as part of an overall division defense. Fleeing civilians are moving
    while the unit develops EA DEV. The Brigade S-3 and S-9 can coordinate with local authorities, and available UAPs and
    adjacent units are also potential coordination partners. The decision concerns whether to divert civilian movement and
    what coordination and control measures to put in place.
  question: What should the Brigade S-3 and S-9 do about civilian movement while the unit develops EA DEV?
  options:
    O1:
      do: The Brigade S-3 and S-9 divert IDPs after coordinating with local authorities, available UAPs, and adjacent units,
        with controls established.
      move: act
      irreversible: false
    O2:
      do: The Brigade S-3 and S-9 request coordination input from available UAPs and adjacent units before deciding on diversion
        and control measures.
      move: ask
      irreversible: false
      to: available UAPs and adjacent units
    O3:
      do: The Brigade S-3 and S-9 maintain IDP movement without diversion, coordinating with local authorities and establishing
        civilian-movement controls.
      move: act
      irreversible: false
    O4:
      do: The Brigade S-3 and S-9 divert IDPs after local coordination, without coordinating with available UAPs or adjacent
        units or establishing controls.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The brigade was defending along PL IRONWOOD.
  - id: F2
    kind: situation
    status: confirmed
    fact: The brigade defense was part of an overall division defense.
  - id: F3
    kind: situation
    status: confirmed
    fact: Fleeing civilians were present.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Brigade S-3 and S-9 sought to prevent civilians from disrupting development of unit EA DEV.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Brigade S-3 and S-9 coordinated with local authorities about diverting civilians.
  - id: F6
    kind: capability
    status: confirmed
    fact: UAPs and adjacent units were available for coordination.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Brigade S-3 and S-9 did not coordinate with available UAPs or adjacent units.
  - id: F8
    kind: situation
    status: confirmed
    fact: No mitigation or control measures were in place.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    - O4
    weight: strong
    why: The stated reason for diversion was to prevent fleeing civilians from disrupting development of EA DEV.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: third_party_harm
    favors:
    - O1
    - O2
    weight: strong
    why: The Brigade coordinated with local authorities, but did not include available UAPs or adjacent units; the diversion
      consequently concentrated civilians against friendly brigades.
  - id: C3
    facts:
    - F8
    equity: civilian_life
    favors:
    - O1
    - O3
    weight: strong
    why: No mitigation or control measures were in place, leaving civilian movement without safeguards against the harmful
      consequence described.
  reasoning:
    read: 'The Brigade faced a mission concern while civilians were moving: the S-3 and S-9 sought to protect EA DEV from
      disruption. The trap is treating that purpose and local-authority coordination as sufficient without accounting for
      effects on civilians and friendly brigades.'
    weighing: The stated mission rationale supports diversion, and local authorities were consulted. But the available coordination
      with UAPs and adjacent units was not used, and no controls were put in place; the resulting concentration of civilians
      against friendly brigades weighs against the unmitigated course. The recorded outcome is O4, although the account does
      not explain why the broader coordination and controls were omitted.
    tradecraft: For a comparable decision, make the civilian-movement decision together with coordination and control measures,
      and record the mission rationale, anticipated effects on civilians and adjacent units, and the basis for the chosen
      safeguards.
    uncertainty: The account gives no specific legal standard, assessment of the anticipated civilian effects, or reason for
      omitting available coordination and controls. It supports identifying the consequence, but not a conclusion that a particular
      law or order was violated.
    handoff: Involve the available UAPs and adjacent units, as well as local authorities, because the decision affected civilian
      movement in relation to friendly brigades beyond the local coordination described.
    tempting_wrong:
      option: O4
      pull: It directly serves the stated aim of preventing civilian disruption to EA DEV and includes local-authority coordination.
      why_wrong: Those considerations do not address the omitted coordination with available UAPs and adjacent units or the
        absence of controls, alongside the resulting concentration of civilians against friendly brigades.
    rejected:
      O1: It was not the recorded course; unlike O4, it includes coordination with available UAPs and adjacent units and established
        controls.
      O2: It was not the recorded course because the S-3 and S-9 proceeded with diversion rather than first requesting input
        from available UAPs and adjacent units.
      O3: It was not the recorded course because the S-3 and S-9 diverted civilians rather than maintaining movement without
        diversion.
  verdict:
    choice: O4
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The S-3 and S-9 coordinated with available UAPs and adjacent units and established controls as part of the diversion.
      then: O1
      why: That would retain the stated purpose of diversion while addressing the coordination and control omissions associated
        with the harmful consequence.
    would_not_change:
    - id: noflip1
      if: The objective of preventing civilian disruption to EA DEV remained the only additional information, with no change
        to coordination or controls.
      why: That objective is already the stated rationale for the recorded diversion and, by itself, does not address its
        consequences.
    watch_for:
    - id: watch1
      what: Whether the diversion could concentrate civilians against friendly brigades.
      favors:
      - O1
      - O2
      - O3
      why: That consequence is a reason to seek coordination and controls or consider maintaining movement rather than proceeding
        with unmitigated diversion.
  lesson: A mission-protection rationale does not by itself account for the effects of civilian movement on civilians or adjacent
    friendly units. Coordinate with available partners and establish appropriate controls before carrying out a diversion.
  limits: The account does not provide a legal rule, the detailed circumstances of the decision, or a finding that the choice
    violated law or policy. The reasoning is limited to the stated mission rationale, coordination choices, and reported consequence.
