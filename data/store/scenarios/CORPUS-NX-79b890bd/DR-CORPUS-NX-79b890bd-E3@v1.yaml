verdict_tier: source-endorsed
basis: The estimating body's majority said it was highly likely that further decisions to reduce planned defense spending
  and shift investment from defense to the civil sector would become apparent during the 13th Five-Year Plan, and reaffirmed
  its assessment that Gorbachev would divert additional resources from defense to the civil sector.
