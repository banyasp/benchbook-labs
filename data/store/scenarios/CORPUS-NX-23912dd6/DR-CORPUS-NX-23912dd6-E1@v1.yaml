case:
  id: DR-CORPUS-NX-23912dd6-E1@v1
  title: On-Scene Support and Safe Return
  status: draft
  setting: Accident site near Fresno Yosemite IAP, 27 December 2012, Fresno ANGB.
  decider: The wingman
  agent: The wingman
  agent_role: decide
  situation: After the mishap, the wingman immediately assumed the role of On-Scene Commander. The mishap aircraft was down,
    and the mishap pilot was reported okay. Fuel limitations were affecting the wingman’s ability to remain on scene, and
    return to Fresno Yosemite IAP was being coordinated. Another aircraft began assisting at 1537L and proceeded to the accident
    site to relieve the wingman as On-Scene Commander. The mishap pilot later reported being okay and proceeding on foot.
  question: What should the wingman do about on-scene command and returning to Fresno Yosemite IAP?
  options:
    O1:
      do: The wingman retains on-scene command and remains at the accident site supporting the mishap pilot.
      move: act
      irreversible: false
    O2:
      do: The wingman transfers on-scene command to the assisting aircraft and returns to Fresno Yosemite IAP.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: After the mishap, the wingman immediately assumed the role of On-Scene Commander.
  - id: F2
    kind: situation
    status: assessed
    fact: The mishap aircraft was down, and the mishap pilot was reported okay.
  - id: F3
    kind: capability
    status: confirmed
    fact: Fuel limitations affected the wingman’s ability to remain on scene.
  - id: F4
    kind: situation
    status: confirmed
    fact: The wingman began coordinating a return to Fresno Yosemite IAP.
  - id: F5
    kind: capability
    status: confirmed
    fact: Another aircraft began assisting the wingman at 1537L.
  - id: F6
    kind: capability
    status: confirmed
    fact: The assisting aircraft proceeded to the accident site to relieve the wingman as On-Scene Commander.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The mishap pilot reported being okay and proceeding on foot.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: Taking on-scene command created a reason to maintain support for the mishap pilot, although the pilot was reported
      okay.
  - id: C2
    facts:
    - F3
    - F4
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: Fuel limitations affected the wingman’s ability to remain on scene, and the wingman began arranging a return to the
      airfield.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Another aircraft was assisting and proceeding to take over on-scene command, allowing the wingman to leave without
      ending on-scene command.
  - id: C4
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The pilot’s report that he was okay and proceeding on foot reduced the apparent need for the wingman to remain personally
      on scene, but did not by itself establish that support was unnecessary.
  reasoning:
    read: 'The wingman had assumed responsibility for on-scene command, but fuel limitations constrained how long the wingman
      could remain. The central trap is treating personal presence as the only way to continue support: another aircraft was
      proceeding to relieve the wingman, while the pilot had reported being okay.'
    weighing: The responsibility to support the pilot favors remaining, but that reason is weakened by the pilot’s report
      and the arriving aircraft’s relief role. Fuel limitations and the need to return weigh strongly toward transferring
      command and returning. The balance depends on the relief actually taking over; the recorded action was to arrange that
      relief and return on a minimum-fuel profile.
    tradecraft: Confirm that the assisting aircraft has assumed on-scene command before departing, and keep a clear record
      of the transfer, fuel constraint, pilot status, and return decision.
    uncertainty: The available facts give no further assessment of the fuel margin, the pilot’s precise needs, or an explicit
      evaluation of the decision. The pilot’s reported status is relevant but does not establish that no further assistance
      was needed.
    handoff: The wingman should coordinate the transfer with the assisting aircraft, which is proceeding to relieve the wingman
      as on-scene commander. The wingman should return after the transfer so on-scene command continues without exceeding
      the fuel constraint.
    tempting_wrong:
      option: O1
      pull: Remaining may seem the most direct way to honor the responsibility the wingman assumed for the pilot.
      why_wrong: It discounts the stated fuel limitation and the available relief aircraft, which could maintain on-scene
        command while the wingman returned.
    rejected:
      O1: The wingman did not retain on-scene command because fuel limitations constrained remaining and another aircraft
        was proceeding to relieve the wingman.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The fuel constraint no longer limited remaining, and the mishap pilot needed continued direct support.
      then: O1
      why: Without the stated constraint and with a continuing need for direct support, the case for the wingman remaining
        would be stronger.
    would_not_change:
    - id: noflip1
      if: The mishap pilot reports being okay, but the assisting aircraft has not yet taken over on-scene command.
      why: The pilot’s report alone would not remove the need to ensure continuity of on-scene command before departure.
    watch_for:
    - id: watch1
      what: Whether the assisting aircraft is actually ready to assume on-scene command before the wingman leaves.
      favors:
      - O2
      why: A completed relief supports returning while maintaining on-scene command; an incomplete relief would weaken the
        case for departure.
  lesson: When fuel limits continued presence, transfer on-scene responsibility to available support before returning. A person’s
    reported safety can inform the balance, but should not substitute for continuity of command.
  limits: This reasoning applies to the described choice where fuel limitations constrained the wingman and another aircraft
    was available to relieve the wingman. It does not establish what to do if relief is unavailable, the pilot’s condition
    is materially worse, or the return cannot be made safely.
