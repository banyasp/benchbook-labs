case:
  id: DR-CORPUS-NX-a53c99c3-E28@v1
  title: Coordinate Before Moving Resources
  status: draft
  setting: New York during the Republican National Convention; the Department of Homeland Security and the FBI.
  decider: The Department of Homeland Security
  agent: The Department of Homeland Security
  agent_role: decide
  situation: During the Republican National Convention, the Department of Homeland Security was responding to a possible threat.
    It had taken the initiative to start moving radiation-detection resources to New York. The FBI had not coordinated with
    the Department of Homeland Security about the move. Domestic agencies responsible for responding to potential WMD terrorist
    threats faced coordination problems, and counterterrorism resources were limited.
  question: 'What should the Department of Homeland Security do about moving radiation-detection resources to New York during
    the Republican National Convention: deploy them before contacting the FBI or withhold deployment while contacting the
    FBI?'
  options:
    O1:
      do: The Department of Homeland Security withholds deployment to New York during the convention while contacting the
        FBI.
      move: act
      irreversible: false
    O2:
      do: The Department of Homeland Security deploys radiation-detection resources to New York during the convention before
        contacting the FBI.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Coordination among domestic agencies responsible for responding to potential WMD terrorist threats suffered from
      confusion and a lack of coordination.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Department of Homeland Security took the initiative to start moving radiation-detection resources to New York.
  - id: F3
    kind: situation
    status: confirmed
    fact: The resource movement was during the Republican National Convention.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The movement was initiated in response to a possible threat.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Department of Homeland Security did not coordinate the move with the FBI.
  - id: F6
    kind: capability
    status: confirmed
    fact: Counterterrorism resources were limited.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The agencies' coordination problems made a basic communication with the FBI important before acting; a phone call
      might have brought relevant information to light earlier.
  - id: C2
    facts:
    - F2
    - F6
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Counterterrorism resources were limited, and avoiding their squandering was a reason to coordinate before moving
      them.
  - id: C3
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Because the response was prompted by a possible threat and the FBI had not been consulted, checking with the Bureau
      could help establish whether the threat assessment warranted the move.
  reasoning:
    read: This was a response to a possible threat, but the move proceeded without coordination between the domestic agencies.
      The trap is treating the possibility of a threat as enough to move limited resources before making a basic check that
      might reveal what the reported activity actually was.
    weighing: The movement was later found to be a legitimate medical-isotope movement, and a phone call might have surfaced
      this earlier, avoiding wasted counterterrorism resources. That makes coordination and stewardship more persuasive here
      than immediate movement on an unverified possible threat. The balance could differ if delay itself posed an urgent danger,
      though the urgency is unspecified.
    tradecraft: Before moving the resources, make direct contact with the FBI, share the decision-level concern, and record
      what was checked, what was learned, and why the move was or was not made. Do not treat the contact as a substitute for
      responding if new information establishes an urgent need.
    uncertainty: The urgency of the possible threat, the information the FBI held at the time, and whether a call would certainly
      have resolved the concern are unspecified; the relevant fact might have surfaced earlier.
    handoff: Contact the FBI before proceeding, because the lack of communication with the Bureau was a missed opportunity
      to clarify the situation and avoid wasting resources.
    tempting_wrong:
      option: O2
      pull: A possible threat can make immediate movement seem like the safest response.
      why_wrong: Acting without even a basic call could waste limited resources when coordination might reveal that the apparent
        threat was legitimate activity.
    rejected:
      O2: The endorsed judgment is to communicate with the FBI first, since that might have clarified the reported activity
        earlier and avoided squandering limited resources.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: There is a credible, time-critical threat for which waiting to contact the FBI would materially increase danger.
      then: O2
      why: An urgent need to act could outweigh the resource-saving benefit of checking first; no such urgency is described.
    would_not_change:
    - id: noflip1
      if: The concern remains only a possible threat and the FBI has not yet been contacted.
      why: That uncertainty makes a basic call useful for surfacing relevant information and avoiding wasted resources.
    watch_for:
    - id: watch1
      what: Whether communication with the FBI brings to light information showing that the reported movement is legitimate
        activity rather than a threat.
      favors:
      - O1
      why: A call might have surfaced the legitimate medical-isotope movement earlier.
  lesson: When agencies face a possible threat and their actions may consume limited resources, basic coordination can be
    part of a sound response, not a reason to ignore the threat. Check with the relevant agency before moving resources when
    that communication may clarify the facts without creating a time-critical danger.
  limits: This reasoning does not establish that deployment should always wait for interagency contact, especially where delay
    would create an urgent danger. The urgency of the threat is unspecified, and no binding rule is identified.
