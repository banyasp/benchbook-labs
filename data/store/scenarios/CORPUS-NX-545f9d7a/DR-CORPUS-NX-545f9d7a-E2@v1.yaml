case:
  id: DR-CORPUS-NX-545f9d7a-E2@v1
  title: CIA–DIA Clandestine Training Arrangement
  status: draft
  setting: Place unspecified; a CIA–DIA discussion roughly a year after a joint DOD and Office of Training study, concerning
    institutional training policy.
  decider: The CIA and DIA officials responsible for the training arrangement
  agent: The CIA and DIA officials responsible for the training arrangement
  agent_role: decide
  situation: A joint study by DOD and the Office of Training had concluded that joint training by CIA and DIA for clandestine
    operations was impractical. The study team assessed that CIA security requirements would necessitate compartmentation
    of DIA trainees, which CIA considered undesirable. DIA personnel assigned to the agency might be temporary or move to
    other assignments, and a career-based personnel system had not yet been established. DIA's proposal for career management
    of assigned service personnel had gone through the Joint Chiefs of Staff and was before the Secretary of Defense for a
    decision. As an interim possibility, DIA could assign a few qualified senior personnel to CIA training. DIA's responsibility
    for all intelligence training had also been associated with service attachés attending the same school and arriving with
    a better understanding of each other's responsibilities.
  question: What should the CIA and DIA officials responsible for the training arrangement do about joint versus separate
    training for clandestine operations?
  options:
    O1:
      do: The CIA and DIA training officials combine their clandestine training in a joint program.
      move: act
      irreversible: false
    O2:
      do: The CIA and DIA training officials separate their clandestine training into distinct programs.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: A joint DOD and Office of Training study concluded that joint CIA–DIA training for clandestine operations was impractical.
  - id: F2
    kind: situation
    status: assessed
    fact: The study team concluded that CIA security requirements would necessitate compartmentation of DIA trainees.
  - id: F3
    kind: situation
    status: assessed
    fact: CIA considered compartmenting DIA trainees undesirable.
  - id: F4
    kind: situation
    status: assessed
    fact: DIA personnel assigned to the agency might be temporary or move to other assignments.
  - id: F5
    kind: situation
    status: confirmed
    fact: A career-based personnel system for DIA personnel had not yet been established.
  - id: F6
    kind: authority
    status: confirmed
    fact: DIA's proposal for career management of service personnel assigned to it had gone through the Joint Chiefs of Staff
      and was before the Secretary of Defense for a decision.
  - id: F7
    kind: capability
    status: confirmed
    fact: DIA could assign a few qualified senior personnel to CIA training as an interim measure.
  - id: F8
    kind: situation
    status: assessed
    fact: DIA's responsibility for all intelligence training was associated with service attachés attending the same school
      and arriving with a better understanding of each other's responsibilities.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The study assessed that CIA security requirements would require compartmenting DIA trainees, and CIA considered that
      arrangement undesirable; the officials therefore favored separate clandestine training.
  - id: C2
    facts:
    - F4
    - F5
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: DIA personnel might be temporary or reassigned, and a career-based personnel system was not yet in place. General
      Carroll recognized that this made CIA's concern about compartmenting clandestine personnel understandable.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The proposal to give DIA career management of assigned service personnel was still awaiting a Secretary of Defense
      decision, so the personnel condition that might address the concern had not yet been established.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: DIA could send a few qualified senior personnel to CIA training as an interim measure, but that limited possibility
      did not establish that a joint clandestine-training program was practicable.
  reasoning:
    read: This is a choice about whether to combine clandestine training despite the security-driven need for compartmentation,
      not a general choice about whether shared intelligence training can be useful. The trap is treating benefits from a
      shared school for service attachés as proof that joint clandestine training is appropriate.
    weighing: The study's assessment that joint clandestine training was impractical, the undesirability of the required compartmentation,
      and the possibility that DIA trainees would be temporary all support {O2} {C1} {C2}. The balance could be reconsidered
      if DIA established career management for assigned personnel and that change addressed the security concern; the pending
      proposal was not yet such a change {C3}. The possibility of sending a few senior personnel was an interim measure, not
      a reason to adopt a joint program {C4}.
    tradecraft: Keep the general policy separate while the identified personnel and security concerns remain. Record the reasons
      for that decision and revisit it if the personnel arrangement changes; distinguish any limited interim assignments from
      a decision to combine the programs.
    uncertainty: The study was about a year old, and General Carroll recalled its conclusion. The DIA career-management proposal
      was still awaiting a decision, so the record does not establish whether that proposed change would resolve the CIA security
      concern.
    handoff: The CIA and DIA officials responsible for the training arrangement should decide the training policy. The Secretary
      of Defense's pending personnel decision is relevant to a later reassessment, but the source does not make that decision
      a prerequisite for the officials' present training choice.
    tempting_wrong:
      option: O1
      pull: A shared school for service attachés had reportedly improved their understanding of each other's responsibilities.
      why_wrong: That benefit concerned intelligence training generally; it did not answer the specific concern that joint
        clandestine training would require undesirable compartmentation of DIA trainees.
    rejected:
      O1: Joint clandestine training was not chosen because the security requirements would require compartmentation, which
        CIA considered undesirable, while DIA personnel might be temporary or reassigned.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: DIA establishes career management for assigned personnel and CIA determines that this also removes the need for
        undesirable compartmentation of DIA trainees.
      then: O1
      why: The stated concerns depend on the prospect of temporary or reassigned trainees and the security-driven need for
        compartmentation; resolving both could support reconsidering joint training.
    would_not_change:
    - id: noflip1
      if: Shared schooling continues to improve service attachés' understanding of one another's responsibilities.
      why: That general training benefit alone does not resolve the distinct security and personnel concerns about clandestine
        training.
    - id: noflip2
      if: DIA assigns a few qualified senior personnel to CIA training as an interim measure.
      why: A limited interim assignment does not by itself change the reasons for keeping the overall clandestine-training
        programs separate.
    watch_for:
    - id: watch1
      what: Whether the Secretary of Defense approves DIA's proposal for career management of assigned service personnel.
      favors:
      - O1
      why: Approval could address the concern that DIA trainees might be temporary or move to other assignments, though it
        would not by itself establish that CIA's compartmentation concern is resolved.
  lesson: When a training arrangement requires security compartmentation that the institution considers undesirable, do not
    treat general benefits of joint training as dispositive. Reconsider separation when the personnel conditions underlying
    the security concern have materially changed, and verify that the change also addresses the security issue.
  limits: This reasoning concerns the specific CIA–DIA clandestine-training decision and the stated personnel and compartmentation
    concerns. It does not establish a general rule against joint intelligence training or decide how other forms of training
    should be organized.
