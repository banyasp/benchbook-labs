case:
  id: DR-OHA-26-0035-restyle1@v1
  title: Access Authorization Decision for Individual with Alcohol and PTSD Concerns [restyle]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy, July 2026
  decider: Administrative Law Judge
  agent: Adjudicative Support System
  agent_role: decide
  situation: The Respondent was taken into custody in November 2024 for aggravated driving while intoxicated, a charge later
    reduced to a DWI. The court imposed a one-year probation that required monthly compliance fees, community service, enrollment
    in a treatment program, installation of an ignition interlock, participation in a victim-impact panel, and completion
    of a DWI education course. The Local Security Office subsequently cited Guideline G (alcohol consumption) and Guideline
    I (psychological conditions) because of the arrest and a psychiatric diagnosis. In August 2025 a DOE-contracted psychiatrist
    evaluated the Respondent, diagnosing a mild Alcohol Use Disorder without evidence of sustained rehabilitation and Post-Traumatic
    Stress Disorder. The Respondent finished an intensive outpatient program for alcohol use, completed the DWI education
    course, and submitted six consecutive negative PEth test results beginning in October 2025. Nevertheless, the Respondent
    has not entered any PTSD treatment and has ignored the psychiatrist's recommendation for medication management. DOE security
    regulations create a presumption against granting or restoring a clearance unless the individual can demonstrate that
    no danger to the common defense exists.
  question: How should the Administrative Law Judge rule on the Respondent's request to have the security clearance reinstated?
  options:
    O1:
      do: Deny the request to reinstate the security clearance.
      move: act
      irreversible: true
    O2:
      do: Approve the reinstatement of the security clearance today.
      move: act
      irreversible: true
    O3:
      do: Stay the decision until the Respondent engages in PTSD treatment.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In November 2024 the Respondent was charged with aggravated driving while intoxicated; the charge was later downgraded
      to a DWI. As part of a one-year probation, the court imposed monthly compliance payments, a requirement to perform community
      service, enrollment in a treatment program, installation of an ignition interlock device, attendance at a victim-impact
      hearing, and completion of a DWI education curriculum.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Local Security Office cited concerns under Guideline G (alcohol use) and Guideline I (psychological health)
      based on the arrest record and the psychiatric evaluation.
  - id: F3
    kind: capability
    status: confirmed
    fact: A psychiatrist contracted by DOE examined the Respondent in August 2025, diagnosing a mild Alcohol Use Disorder
      without clear evidence of sustained rehabilitation, and also diagnosing Post-Traumatic Stress Disorder.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Respondent successfully finished an intensive outpatient alcohol-use program that included sixteen individual
      and forty-eight group therapy sessions, completed the DWI education course, and fulfilled the mandated community-service
      hours.
  - id: F5
    kind: capability
    status: confirmed
    fact: From October 2025 onward the Respondent submitted six consecutive PEth laboratory results that were all negative,
      indicating no moderate or heavy alcohol intake during that timeframe.
  - id: F6
    kind: capability
    status: assessed
    fact: The Respondent has not initiated any PTSD treatment and has not adhered to the psychiatrist's recommendation for
      medication or ongoing psychotherapy.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE security regulations (10 C.F.R. § 710.7(a)) create a presumption against granting or restoring a clearance unless
      the individual can demonstrate that the clearance will not jeopardize the common defense and aligns with the national
      interest.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The psychiatrist's assessment, together with the Respondent's completion of treatment and the series of negative
      PEth results, satisfies mitigating factors (b) and (d) of Guideline G, indicating sufficient rehabilitation for the
      alcohol-related concern.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Guideline I remains unaddressed because the Respondent has not entered PTSD treatment and the psychiatrist did not
      find the condition under control, leaving a residual risk to judgment, reliability, and trustworthiness.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: 10 C.F.R. § 710.7(a) imposes a presumption against granting or restoring a clearance unless the individual can demonstrate
      no endangerment to the common defense.
  - id: C4
    facts:
    - F3
    - F6
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The adjudicative guidelines require mitigation of both alcohol-related and psychological conditions; the absence
      of mitigation for PTSD means the burden of proof has not been satisfied.
  reasoning:
    read: The core issue is whether the Respondent has eliminated the security concerns identified under Guideline G (alcohol
      consumption) and Guideline I (psychological condition). While the alcohol issue appears mitigated, the untreated PTSD
      continues to present a potential reliability hazard.
    weighing: 'The Judge applied the Adjudicative Guidelines directly: Guideline G is satisfied by the Respondent''s documented
      rehabilitation and negative PEth tests (C1). Guideline I, however, is not satisfied because the Respondent lacks ongoing
      PTSD treatment and the psychiatrist did not deem the condition under control (C2). Together with the statutory presumption
      against restoration (C3) and the procedural burden of proof (C4), the balance favors denial.'
    tradecraft: Record the denial in the official OHA decision, cite the applicable regulatory provisions and guideline paragraphs,
      and note the mitigating factors found for G but not for I. Enter the decision into the personnel security database and
      provide the Respondent with notice of appeal rights per 10 C.F.R. § 710.28.
    uncertainty: The principal uncertainty is whether future PTSD treatment could change the risk assessment; the current
      record offers no evidence of control or remission.
    handoff: The Administrative Law Judge decides unilaterally, as the regulations vest sole authority to resolve eligibility
      determinations after the hearing.
    tempting_wrong:
      option: O2
      pull: The Respondent's successful alcohol-use treatment and clean PEth record might suggest overall rehabilitation.
      why_wrong: Restoring the clearance without addressing the untreated PTSD would conflict with Guideline I and the presumption
        against granting, creating a potential security vulnerability.
    rejected:
      O2: Restoration is rejected because PTSD remains untreated and unmitigated under Guideline I.
      O3: A stay is rejected because the record already shows a clear lack of PTSD treatment; postponing would not resolve
        the outstanding security concern.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Respondent engages in ongoing PTSD treatment and a qualified mental-health professional concludes the condition
        is under control or in remission.
      then: O2
      why: Mitigating factor (c) for Guideline I would become applicable, satisfying the psychological-condition requirement.
    would_not_change:
    - id: noflip1
      if: The Respondent obtains additional negative PEth tests but does not treat PTSD.
      why: Guideline I remains unmitigated; alcohol mitigation alone does not suffice for clearance restoration.
    watch_for:
    - id: watch1
      what: Any relapse in alcohol consumption evidenced by a positive PEth test or a new DUI arrest.
      favors:
      - O1
      why: A relapse would reactivate Guideline G concerns, reinforcing the basis for denial.
  lesson: When a security clearance is denied, every relevant adjudicative guideline must be satisfied; remediation of one
    condition (e.g., alcohol use) does not cure an independent, untreated psychological condition that still poses a reliability
    risk.
  limits: This analysis is limited to DOE personnel-security determinations under 10 C.F.R. Part 710 and the 2017 Adjudicative
    Guidelines; it does not apply to criminal sentencing or civilian licensing contexts.
