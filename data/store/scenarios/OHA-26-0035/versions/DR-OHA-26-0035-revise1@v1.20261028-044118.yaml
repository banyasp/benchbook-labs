case:
  id: DR-OHA-26-0035-revise1@v1
  title: Access Authorization Decision for Individual with Alcohol and PTSD Concerns [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Adjudication Support Agent
  agent_role: decide
  situation: The Individual was arrested in November 2024 for aggravated driving while under the influence, later reduced
    to a DWI, and placed on a one‑year probation with monthly compliance fees, community service, treatment enrollment, an
    ignition interlock, a victim impact panel, and DWI school requirements. The Local Security Office raised security concerns
    under Guideline G (alcohol consumption) and Guideline I (psychological conditions) based on the arrest and psychiatric
    diagnosis. A DOE‑consultant psychiatrist evaluated the Individual in August 2025, diagnosing mild Alcohol Use Disorder
    without evidence of rehabilitation and PTSD. The Individual completed an intensive outpatient treatment program for AUD,
    finished DWI school, and provided six negative PEth test results after October 2025. However, the Individual has not engaged
    in any current PTSD treatment and has not complied with the psychiatrist’s recommendation for medication management. DOE
    regulations impose a presumption against granting or restoring a clearance unless the individual can show it will not
    endanger the common defense.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s access authorization restoration.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge restores the Individual’s access authorization today.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending PTSD treatment.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested in November 2024 for aggravated driving while under the influence, later reduced to
      a DWI, and placed on a one‑year probation with monthly compliance fees, community service, treatment enrollment, an
      ignition interlock, a victim impact panel, and DWI school requirements.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline G (alcohol consumption) and Guideline I (psychological
      conditions) based on the arrest and psychiatric diagnosis.
  - id: F3
    kind: capability
    status: confirmed
    fact: A DOE‑consultant psychiatrist evaluated the Individual in August 2025 and diagnosed Alcohol Use Disorder, mild,
      without evidence of rehabilitation, and Post‑Traumatic Stress Disorder.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual completed an intensive outpatient treatment program for AUD, including 16 individual and 48 group
      therapy sessions, finished DWI school, and completed required community service.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual provided six negative PEth test results from October 2025 onward, indicating no moderate to heavy
      alcohol consumption during that period.
  - id: F6
    kind: capability
    status: assessed
    fact: The Individual has not engaged in any current treatment for PTSD and has not complied with the psychiatrist’s recommendation
      for medication management or ongoing therapy.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE regulations (10 C.F.R. § 710.7(a)) establish a presumption against granting or restoring a security clearance
      unless the individual can demonstrate it will not endanger the common defense and is clearly consistent with the national
      interest.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The psychiatrist concluded the Individual showed adequate evidence of rehabilitation for AUD, and the record contains
      multiple negative PEth tests and completed treatment, satisfying mitigating factors (b) and (d) under Guideline G.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Untreated PTSD continues to raise reliability concerns, but a hold pending treatment provides a proportionate mitigation
      while the individual seeks care.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The statutory presumption against restoration remains, yet its influence is reduced because a temporary hold is a
      permissible interim step under the regulations.
  - id: C4
    facts:
    - F3
    - F6
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Due-process requires the individual to have an opportunity to mitigate the psychological condition; holding the decision
      respects that right while awaiting evidence of treatment.
  reasoning:
    read: The record shows full remediation of the alcohol-related concerns but an unresolved PTSD diagnosis; the appropriate
      response is to pause the clearance decision until the psychological condition is addressed.
    weighing: Guideline G is satisfied by the Individual's successful AUD treatment (C1). Guideline I remains unmitigated;
      rather than an outright denial, a hold (O3) aligns with the mission's need for security and the individual's right to
      treatment, especially given the weakened statutory pressure (C3). Consequently, the balance now favors a temporary hold.
    tradecraft: Enter a hold order in the OHA decision, cite Guideline I, note the pending PTSD treatment as the condition
      for future reconsideration, and update the personnel security database to reflect the pending status.
    uncertainty: The timeline for effective PTSD treatment and its impact on reliability is uncertain, making a hold preferable
      to a final denial.
    handoff: The Administrative Judge retains sole authority to lift the hold once satisfactory treatment documentation is
      provided.
    tempting_wrong:
      option: O1
      pull: An immediate denial appears decisive given the untreated PTSD.
      why_wrong: Denial disregards the Individual's progress on alcohol issues and eliminates the opportunity for remediation
        of the psychological condition, which a hold preserves.
    rejected:
      O1: Denial is rejected because it precludes a reasonable, less-restrictive interim measure that allows treatment.
      O2: Restoration is rejected because the PTSD condition remains unmitigated, violating Guideline I.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual engages in ongoing PTSD treatment and a qualified mental-health professional concludes the condition
        is under control or in remission.
      then: O1
      why: If PTSD were mitigated, the original denial would be reaffirmed; the hold is only appropriate while treatment is
        pending.
    would_not_change:
    - id: noflip1
      if: The Individual obtains additional negative PEth tests but does not treat PTSD.
      why: Guideline I remains unmitigated; alcohol mitigation alone does not suffice for clearance restoration.
    watch_for:
    - id: watch1
      what: Any relapse in alcohol consumption evidenced by a positive PEth test or new DUI arrest.
      favors:
      - O1
      why: A relapse would re-activate Guideline G concerns, reinforcing denial.
  lesson: When a security-clearance issue involves multiple, independent adjudicative concerns, a temporary hold can serve
    as a proportionate interim measure that respects due process while protecting the mission.
  limits: Analysis applies solely to DOE personnel-security determinations under 10 C.F.R. Part 710 and the 2017 Adjudicative
    Guidelines; it does not extend to criminal sentencing or civilian licensing contexts.
