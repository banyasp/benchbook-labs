case:
  id: DR-OHA-26-0035-flip1@v1
  title: Access Authorization Decision for Individual with Alcohol and PTSD Concerns [flip]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, July 2026
  decider: Administrative Law Judge
  agent: Adjudicative Support Analyst
  agent_role: decide
  situation: The Individual was charged in November 2024 with aggravated impaired driving, later reduced to a DWI, and sentenced
    to a one-year probation that included monthly compliance fees, community service, enrollment in a treatment program, an
    ignition interlock, a victim-impact panel, and mandatory DWI education. The Local Security Office flagged the case under
    Guideline G (alcohol use) and Guideline I (psychological conditions) because of the arrest and a psychiatric diagnosis.
    A DOE-contracted psychiatrist examined the Individual in August 2025, diagnosing a mild Alcohol Use Disorder and Post-Traumatic
    Stress Disorder. The Individual completed an intensive outpatient AUD program, finished DWI education, and submitted six
    consecutive negative PEth tests after October 2025. Under DOE regulations, a clearance may not be granted or restored
    unless the individual can demonstrate no risk to the common defense.
  question: What action should the Administrative Law Judge take concerning the Individual's access authorization?
  options:
    O1:
      do: Deny the request to restore the Individual's access authorization.
      move: act
      irreversible: true
    O2:
      do: Restore the Individual's access authorization effective immediately.
      move: act
      irreversible: true
    O3:
      do: Place the decision on hold pending further PTSD treatment.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged in November 2024 with aggravated impaired driving, later reduced to a DWI, and sentenced
      to a one-year probation that included monthly compliance fees, community service, enrollment in a treatment program,
      an ignition interlock, a victim-impact panel, and mandatory DWI education.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Local Security Office flagged the case under Guideline G (alcohol use) and Guideline I (psychological conditions)
      because of the arrest and a psychiatric diagnosis.
  - id: F3
    kind: capability
    status: confirmed
    fact: A DOE-contracted psychiatrist examined the Individual in August 2025 and diagnosed a mild Alcohol Use Disorder and
      Post-Traumatic Stress Disorder.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual completed an intensive outpatient AUD program, finished DWI education, and satisfied the required
      community service.
  - id: F5
    kind: capability
    status: confirmed
    fact: Six consecutive PEth tests submitted from October 2025 onward were negative, indicating no moderate or heavy alcohol
      consumption during that period.
  - id: F6
    kind: capability
    status: assessed
    fact: Since March 2025 the Individual has been participating in weekly cognitive‑behavioral therapy for PTSD, and the
      consulting psychiatrist has noted that the individual's symptoms have markedly lessened and are presently stable.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE regulations (10 C.F.R. § 710.7(a)) create a presumption against granting or restoring a security clearance unless
      the individual can show that the clearance will not endanger the common defense and aligns with the national interest.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The psychiatrist's assessment, together with the completed AUD treatment and a series of negative PEth results, satisfies
      mitigating factors (b) and (d) of Guideline G.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Guideline I is now mitigated because the Individual's PTSD symptoms have substantially lessened and are stable per
      weekly CBT, removing the reliability risk.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: 10 C.F.R. § 710.7(a) still imposes a presumption against restoration unless the individual demonstrates no threat
      to the common defense.
  - id: C4
    facts:
    - F3
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Both alcohol-related and psychological conditions are now mitigated, satisfying the burden of proof required by the
      adjudicative guidelines.
  reasoning:
    read: The core issue is whether the Individual has remedied the security concerns identified under Guideline G (alcohol)
      and Guideline I (psychological condition). Alcohol mitigation is complete, and recent CBT has stabilized the PTSD, satisfying
      the psychological requirement.
    weighing: Applying the 2017 Adjudicative Guidelines, the alcohol factor is resolved (C1). The PTSD factor is now mitigated
      through documented symptom reduction and stable therapy progress (C2, C4). Although the statutory presumption (C3) remains,
      the combined mitigations outweigh the presumption, supporting restoration.
    tradecraft: Record the restoration in the official OHA decision, cite 10 C.F.R. § 710.7(a) and the relevant Guideline
      paragraphs, and update the personnel security system. Notify the Individual of the decision and any continuing obligations.
    uncertainty: Future relapse of PTSD symptoms or any new alcohol misuse could reopen the security assessment, but the current
      record shows no such risk.
    handoff: The Administrative Law Judge acts alone, as authorized by the regulations to render the final eligibility determination.
    tempting_wrong:
      option: O1
      pull: The presumption against restoration in the regulations might suggest a cautious denial.
      why_wrong: Denial would ignore the clear evidence of PTSD stabilization and the fulfilled alcohol mitigation, contrary
        to the guidelines.
    rejected:
      O1: Denial is rejected because both Guideline G and Guideline I mitigation requirements have been satisfied.
      O3: A hold is rejected because the record already demonstrates adequate PTSD treatment and stability; postponement would
        add no value.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual discontinues PTSD therapy and a qualified mental-health professional determines the condition is
        no longer under control.
      then: O1
      why: Without ongoing treatment, mitigating factor (c) for Guideline I would be lost, reviving the psychological-condition
        concern.
    would_not_change:
    - id: noflip1
      if: The Individual obtains additional negative PEth tests but does not maintain PTSD therapy.
      why: Alcohol mitigation alone does not satisfy the combined requirements for clearance restoration.
    watch_for:
    - id: watch1
      what: Any positive PEth result or a new DUI arrest.
      favors:
      - O1
      why: A relapse would reactivate Guideline G concerns, reinforcing a denial stance.
  lesson: A clearance can be restored when all relevant adjudicative guidelines are satisfied; remediation of alcohol misuse
    must be accompanied by documented mitigation of any co-occurring psychological condition.
  limits: This analysis is limited to DOE personnel-security determinations under 10 C.F.R. Part 710 and the 2017 Adjudicative
    Guidelines and does not apply to criminal sentencing, civil licensing, or other agency security programs.
