case:
  id: DR-CORPUS-NX-7b45b55b-E3@v1
  title: Federal SBU Computer-Security Responsibility
  status: draft
  setting: United States, 1987, Congress considering federal computer-security policy.
  decider: Congress
  agent: Congress
  agent_role: decide
  situation: NSDD-145 assigned NSA broad responsibility for security of government computer systems. It also directed NSA
    to review other departments’ telecommunications-security programs and budgets. A House representative was suspicious of
    NSA’s role in computer security and raised concern about military influence in civilian computer security. Congress faced
    a choice between maintaining NSA’s broad responsibility and placing protection of federal SBU information technology under
    NBS leadership. The Computer Security Act framework required NBS to work with NSA.
  question: What should Congress do about whether NSA should retain broad responsibility or NBS should lead protection of
    federal SBU information technology?
  options:
    O1:
      do: Congress retains federal SBU IT protection responsibility in NSA under NSDD-145.
      move: act
      irreversible: false
    O2:
      do: Congress transfers federal SBU IT protection responsibility to NBS, with NBS working with NSA.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: NSDD-145 placed NSA in control of security for government computer systems.
  - id: F2
    kind: authority
    status: confirmed
    fact: NSDD-145 directed NSA to review and assess other government departments’ and agencies’ telecommunications-security
      programs and budgets.
  - id: F3
    kind: situation
    status: assessed
    fact: A House representative was suspicious of NSA and its role in computer security.
  - id: F4
    kind: situation
    status: assessed
    fact: The sponsoring representative characterized the military’s influence on society through NSDD-145 as politically
      unhealthy and potentially dangerous.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Computer Security Act assigned responsibility for protecting federal SBU information technology to NBS.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Computer Security Act required NBS to work with NSA as part of its federal computer-security responsibilities.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: NSA's control over government computer security extended to reviewing other departments' telecommunications-security
      programs and budgets; the sponsoring representative was suspicious of NSA's role.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The sponsoring representative judged the military influence represented by NSDD-145 politically unhealthy and potentially
      dangerous, supporting civilian-agency leadership.
  - id: C3
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Computer Security Act assigned federal SBU information technology protection to NBS while requiring NBS to work
      with NSA, providing a lead agency without excluding NSA from collaboration.
  reasoning:
    read: 'This is a choice about who leads federal SBU information technology protection, not whether NSA has any role: O2
      places leadership with NBS while requiring it to work with NSA. The trap is treating the choice as either retaining
      NSA''s broad responsibility or excluding NSA altogether.'
    weighing: The stated concern was that NSDD-145 gave NSA broad control, including review of other departments' programs
      and budgets, and that this represented politically unhealthy and potentially dangerous military influence. The Act's
      allocation to NBS addresses that concern while preserving NSA collaboration. The source supplies no comparison of the
      agencies' security performance; the balance rests on the stated concern about military influence and the Act's chosen
      division of responsibility.
    tradecraft: 'Keep the decision at the level of institutional responsibility: record NBS as lead and NSA as a required
      collaborator. Do not turn this allocation decision into a judgment about technical standards or security procedures.'
    uncertainty: The source gives the political concern and the statutory allocation, but does not assess comparative agency
      capability or the security effects of either arrangement.
    handoff: Congress makes the allocation decision; NBS and NSA have roles in carrying out the Act's required collaboration.
    tempting_wrong:
      option: O1
      pull: NSDD-145 already placed broad computer-security responsibility with NSA.
      why_wrong: Retaining that arrangement leaves in place the broad military role that the sponsoring representative criticized,
        whereas the Act assigns leadership to NBS and still requires work with NSA.
    rejected:
      O1: Congress did not retain NSA's broad responsibility; the Computer Security Act transferred protection of federal
        SBU information technology to NBS while requiring NBS to work with NSA.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C3
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Congress had evidence that NBS could not responsibly lead protection of federal SBU information technology and that
        NSA was the only workable lead.
      then: O1
      why: That evidence could outweigh the concern about broad military responsibility by making NSA leadership necessary
        to the protection mission.
    would_not_change:
    - id: noflip1
      if: NSA remains involved through NBS's required collaboration with it.
      why: NSA participation in collaboration is compatible with NBS leading; it does not by itself justify retaining NSA's
        broad responsibility.
    watch_for:
    - id: watch1
      what: Whether NBS works with NSA as the Act requires.
      favors:
      - O2
      why: The Act combines NBS leadership with continued NSA collaboration.
  lesson: When a policy concern is about an agency's breadth of authority, distinguish transferring leadership from excluding
    that agency entirely. An allocation that addresses the concern while preserving required collaboration can be preferable
    to simply retaining the existing broad mandate.
  limits: This reasoning applies to the choice over federal SBU information-technology responsibility, not to comparative
    technical capabilities or the merits of particular standards or security procedures. It does not establish that NBS leadership
    is preferable where the governing legal framework or decision facts differ.
  library:
    domain: cyber-policy
    family: CORPUS-NX-7b45b55b
    source: https://media.defense.gov/2024/Oct/07/2003560210/-1/-1/0/MDR%20116849.PDF
    episode_focus: The decision point is whether NSA should retain the broad responsibility established by NSDD-145 or whether
      the NBS should lead protection of federal SBU information technology under the Computer Security Act. Include the stated
      concerns about military influence in civilian computer security and the requirement for NSA to work with NBS; exclude
      technical standards or security procedures.
    cues:
      option_words:
        O2: 14
        O1: 11
      real_option: O2
      real_to_mean_other_length: 1.27
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
