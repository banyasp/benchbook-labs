      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The ASD(C) office's draft memorandum recommended against the Navy, NSA, and DIA as the central capability, citing insufficient
  authority and influence and Privacy Act concerns regarding the secretive missions of the NSA and DIA; the Pentagon told
  the NSA that its leadership was not required.
