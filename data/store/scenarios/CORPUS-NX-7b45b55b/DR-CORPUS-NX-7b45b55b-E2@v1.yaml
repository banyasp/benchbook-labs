case:
  id: DR-CORPUS-NX-7b45b55b-E2@v1
  title: Where to Place the Computer Security Evaluation Center
  status: draft
  setting: January 1981, Department of Defense, amid proposals for an NSA-based center or a federal center with NBS.
  decider: The Deputy Secretary of Defense
  agent: The Deputy Secretary of Defense
  agent_role: decide
  situation: In January 1981, the Deputy Secretary of Defense faced a proposal for a DoD computer security evaluation center
    organized as a project management office at NSA. An alternative proposal would place a federal center with NBS, reflecting
    the view that computer security was a government-wide concern. DoD components regarded a center as necessary but objected
    to locating it at NSA, citing concerns about interference and limited immediate help. NSA leadership favored an NSA location
    but wanted the center outside NSA’s hierarchy, with its own budget. NSA leadership also warned that standards suited to
    DoD could make systems too complex and costly for other departments and limit commercial use. DoD leaders had raised concerns
    about working relationships within the proposed center, while expressing no disagreement about the need for one.
  question: What should the Deputy Secretary of Defense do about the proposed center’s location and organization and the assignment
    of DoD computer security evaluation responsibility?
  options:
    O1:
      do: The Deputy Secretary of Defense should approve the NSA-based DoD evaluation-center PMO and assign DoD computer security
        evaluation responsibility to NSA.
      move: act
      irreversible: false
    O2:
      do: The Deputy Secretary of Defense should reject the NSA-based DoD evaluation-center PMO and pursue a federal evaluation
        center with NBS.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The initial proposal was for a computer security evaluation center organized as a PMO at NSA and reporting to OASD
      C3I.
  - id: F2
    kind: situation
    status: assessed
    fact: Other DoD components considered a center necessary but believed placing it at NSA would be a hindrance, with potential
      interference and little immediate help.
  - id: F3
    kind: situation
    status: assessed
    fact: An alternate proposal placed a Federal Computer Security Center with NBS because computer security was viewed as
      a government-wide problem.
  - id: F4
    kind: capability
    status: assessed
    fact: The proposal’s sponsor preferred co-locating the center with NSA because of the Agency’s technical expertise.
  - id: F5
    kind: situation
    status: assessed
    fact: NSA leadership believed standards appropriate for DoD could make systems too complex and expensive for other departments
      and limit commercial use.
  - id: F6
    kind: situation
    status: assessed
    fact: NSA leadership wanted the center located at NSA but outside NSA’s hierarchy, with its own budget, to reduce perceived
      NSA influence over its standards.
  - id: F7
    kind: situation
    status: assessed
    fact: NSA leadership did not regard the COINS PMO as a suitable model, citing its lack of strong Intelligence Community
      support and the need for full commitment from participants.
  - id: F8
    kind: situation
    status: confirmed
    fact: DoD leaders had expressed concern about working relationships within the proposed center while agreeing on the need
      for a center.
  considerations:
  - id: C1
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: DoD leaders raised concerns about working relationships but did not dispute the need for an evaluation center; the
      Deputy Secretary approved the proposal despite those concerns.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The sponsor preferred locating the center with NSA because of the Agency’s technical expertise.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: NSA leadership wanted the center at NSA but outside its hierarchy and with its own budget, to limit perceived NSA
      influence over standards.
  - id: C4
    facts:
    - F3
    - F5
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Computer security was viewed as a government-wide problem, and standards suited to DoD could impose unnecessary complexity
      and expense on other departments and limit commercial use.
  - id: C5
    facts:
    - F2
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Other DoD components feared interference and little immediate help from an NSA location, while NSA leadership cautioned
      that the proposed center needed full participant commitment rather than simply copying the COINS model.
  reasoning:
    read: 'The decision was not whether computer security evaluation was needed: DoD leaders agreed that it was. The difficult
      issue was whether NSA could host and receive responsibility for the center without undermining interagency confidence
      or producing standards too demanding for government-wide and commercial use.'
    weighing: The government-wide concern and objections to NSA’s involvement supported the NBS alternative {C4} {C5}. Against
      that, the sponsor favored NSA for its expertise, NSA leadership proposed a center outside its hierarchy with its own
      budget, and the Deputy Secretary noted that concerns about working relationships did not amount to disagreement about
      the need {C1} {C2} {C3}. The balance favored approving the NSA-based PMO and assigning NSA the DoD responsibility, while
      the standards and relationship concerns remained important to the center’s organization.
    tradecraft: Record the assignment and the reasons for accepting the NSA location, and make the governance safeguards and
      standards concerns explicit in the center’s charter. Involve representatives of the addressees in developing that charter
      and seek the full participant commitment the proposal required.
    uncertainty: The approval and assignment are clear, but the stated concerns about working relationships, NSA influence,
      and standards are not shown as resolved by the decision itself.
    handoff: The Deputy Secretary made the assignment, while representatives from the organizations addressed by the memorandum
      should participate in developing the charter because the stated concerns involve their working relationships and commitment.
    tempting_wrong:
      option: O2
      pull: A federal center with NBS appears to fit the government-wide scope of computer security and avoids the DoD components’
        objection to NSA hosting.
      why_wrong: The Deputy Secretary approved the NSA Director’s PMO proposal despite the working-relationship concerns,
        and the sponsor’s stated reason for preferring NSA was its technical expertise; the source does not treat the NBS
        alternative as resolving the need for an effective DoD center.
    rejected:
      O2: The Deputy Secretary did not pursue the NBS alternative, instead approving an NSA-based PMO and assigning NSA responsibility
        for DoD computer security evaluation.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The NSA location could not be kept outside NSA’s hierarchy with its own budget, leaving the perceived influence
        over standards unaddressed.
      then: O2
      why: The stated rationale for the NSA arrangement included separating the center from NSA’s hierarchy and reducing perceived
        influence over standards; without that safeguard, the government-wide alternative would be more compelling.
    - id: flip2
      if: The center could not obtain the full commitment of its participants.
      then: O2
      why: The proposal required full participant commitment, and NSA leadership considered the COINS PMO a poor model because
        it lacked strong Intelligence Community support.
    would_not_change:
    - id: noflip1
      if: DoD leaders continued to have concerns about working relationships while agreeing that an evaluation center was
        needed.
      why: Those concerns were present when the Deputy Secretary approved the PMO proposal and assigned the responsibility.
    watch_for:
    - id: watch1
      what: Whether the organizations involved commit fully to the center and its charter.
      favors:
      - O2
      why: NSA leadership said the proposed center needed full commitment from its participants.
    - id: watch2
      what: Whether the center’s standards impose unnecessary complexity or expense on departments beyond DoD or limit commercial
        use.
      favors:
      - O2
      why: NSA leadership identified those risks as reasons standards should account for needs beyond DoD.
  lesson: When participants agree that a capability is necessary but dispute its institutional home, weigh the host’s relevant
    expertise against the risks to interagency confidence and broader applicability. If the decision selects a contested host,
    make the safeguards and participant commitments that answer those concerns part of the governance design.
  limits: This reasoning concerns the organizational location and assignment of a computer security evaluation center, not
    its technical evaluation methods. It does not establish that an NSA-based arrangement is preferable where the expertise,
    independence safeguards, or participant commitment differ.
