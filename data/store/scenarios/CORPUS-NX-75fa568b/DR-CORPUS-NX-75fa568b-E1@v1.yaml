case:
  id: DR-CORPUS-NX-75fa568b-E1@v1
  title: Approval Authority for the Rear-Detachment Roster
  status: draft
  setting: A battalion preparing to deploy, as leaders determine which Soldiers are non-deployable.
  decider: The BN CDR
  agent: The BN CDR
  agent_role: decide
  situation: Battalion leaders must determine which Soldiers are non-deployable and should remain on the rear-detachment roster.
    The roster should reflect the Soldiers who are actually non-deployable. Commanders want to deploy with a full team. The
    battalion must decide who will have approval authority for adding Soldiers to the roster. The BN CSM's role would operate
    under the BN CDR's guidance.
  question: What should the BN CDR do about assigning approval authority for adding Soldiers to the rear-detachment roster?
  options:
    O1:
      do: The BN CDR approves the BN CSM as approval authority for adding Soldiers to the rear-detachment roster under the
        BN CDR's guidance.
      move: act
      irreversible: false
    O2:
      do: The BN CDR rejects the BN CSM as approval authority for adding Soldiers to the rear-detachment roster and retains
        that authority.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Battalion leaders determine which Soldiers are non-deployable.
  - id: F2
    kind: situation
    status: confirmed
    fact: Soldiers determined to be non-deployable are candidates to remain on the rear-detachment roster.
  - id: F3
    kind: situation
    status: confirmed
    fact: The roster is intended to capture the actual non-deployable Soldiers.
  - id: F4
    kind: situation
    status: confirmed
    fact: Commanders want to deploy with a full team.
  - id: F5
    kind: authority
    status: confirmed
    fact: The BN CSM can be the approval authority for adding Soldiers to the rear-detachment roster.
  - id: F6
    kind: authority
    status: confirmed
    fact: The BN CSM's approval authority would follow the BN CDR's guidance.
  - id: F7
    kind: situation
    status: assessed
    fact: The BN CSM acting as approval authority is described as eliminating unnecessary involvement from other battalion
      leaders.
  considerations:
  - id: C1
    facts:
    - F3
    equity: record_integrity
    favors:
    - O1
    weight: strong
    why: The approval arrangement should help ensure that the rear-detachment roster captures the Soldiers who are actually
      non-deployable.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The roster should reflect actual non-deployability while supporting commanders' stated aim of deploying with a full
      team.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The BN CSM can approve additions under the BN CDR's guidance, and assigning that role avoids unnecessary involvement
      from other battalion leaders.
  reasoning:
    read: This is a decision about who approves additions to a roster that should identify actual non-deployable Soldiers,
      not a choice between accurate accounting and deploying a full team. The trap is to treat the full-team goal as a reason
      to bypass accurate roster decisions.
    weighing: 'O1 best fits the stated aims: the roster should capture actual non-deployables, commanders want a full team,
      and BN CSM approval under BN CDR guidance eliminates unnecessary involvement from other battalion leaders. The balance
      depends on the roster continuing to reflect who is actually non-deployable.'
    tradecraft: State the BN CSM's approval role and the BN CDR's guidance clearly, and keep the decision's rationale tied
      to accurate identification and avoiding unnecessary leadership involvement.
    uncertainty: The stated reasons do not specify how the BN CDR's guidance defines the approval role or how disagreements
      about a Soldier's status are resolved.
    handoff: The BN CDR should make the authority assignment; the BN CSM then acts under the BN CDR's guidance. The stated
      rationale is to avoid unnecessary involvement from additional battalion leaders.
    tempting_wrong:
      option: O2
      pull: Retaining approval authority may seem to offer the BN CDR more direct control over roster additions.
      why_wrong: The stated recommendation is to place approval authority with the BN CSM under the BN CDR's guidance, avoiding
        unnecessary involvement by other battalion leaders.
    rejected:
      O2: The BN CDR should not retain approval authority because the stated recommendation favors BN CSM approval under the
        BN CDR's guidance to avoid unnecessary involvement from other battalion leaders.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The BN CSM could not exercise the approval role under the BN CDR's guidance.
      then: O2
      why: The recommendation relies on the CSM's authority operating under the BN CDR's guidance; without that condition,
        retaining approval authority would better preserve the stated chain of command.
    - id: flip2
      if: Using the BN CSM as approval authority no longer helped keep the roster limited to Soldiers who are actually non-deployable.
      then: O2
      why: The roster's accuracy is a stated aim, so a delegation that undermined it would weaken a central reason for O1.
    would_not_change:
    - id: noflip1
      if: Commanders continue to want to deploy with a full team, without any new information about who is actually non-deployable.
      why: That aim is already part of the decision; by itself it does not displace the recommendation to use BN CSM approval
        under BN CDR guidance.
    watch_for: []
  lesson: Delegate approval authority when the source favors a streamlined role under the commander's guidance and the delegation
    supports an accurate decision. A desired operational outcome, such as deploying with a full team, does not justify losing
    sight of who is actually non-deployable.
  limits: This reasoning concerns approval authority for additions to a rear-detachment roster. It does not establish a general
    rule for other personnel decisions or specify how to resolve disputed non-deployability determinations.
  library:
    domain: operational-command
    family: CORPUS-NX-75fa568b
    source: https://api.army.mil/e2/c/downloads/2023/01/31/fb7c97db/bn-s1s-guide-for-success-at-the-ntc-nov-19-public.pdf
    episode_focus: The decision point is who has approval authority when leaders determine which Soldiers are non-deployable
      and should remain on the rear-detachment roster. The passage favors delegating that authority to the command sergeant
      major rather than involving additional battalion leaders, citing streamlined decisions while still identifying the actual
      non-deployable personnel; exclude the roster-scrub procedure itself.
