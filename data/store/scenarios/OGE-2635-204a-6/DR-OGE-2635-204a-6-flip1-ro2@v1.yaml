case:
  id: DR-OGE-2635-204a-6-flip1-ro2@v1
  title: Acceptance of a pooled contractor gift [flip]
  status: needs_review
  setting: Acquisition office, Department of Defense, present day
  decider: Acquisition officer
  agent: Compliance Guidance Bot
  agent_role: advise
  situation: An officer who is about to be promoted receives a desk clock valued at $120. Six contractors each supplied a
    component of the clock, each component worth $20 or less, and handed their piece to the officer separately. The clock
    is presented as a single assembled item. The officer must decide how to proceed under the federal employee gift regulations
    that cap gifts at $20 per source per occasion and forbid acceptance of a single gift whose total value exceeds $20, even
    when funded by several donors.
  question: How should the officer handle the desk-clock gift?
  options:
    O1:
      do: Decline the clock entirely and document the refusal in the gift log.
      move: refuse
      irreversible: true
    O2:
      do: Retain the clock and return each $20 contribution to its donor.
      move: partial
      irreversible: true
    O3:
      do: Accept the assembled clock as presented without returning any monetary contributions.
      move: act
      irreversible: true
    O4:
      do: Request a formal written ethics determination before deciding on the clock.
      move: ask
      irreversible: false
      to: Agency Ethics Official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Six defense‑contractor employees each supplied a component of a desk clock, each component having a market price
      that does not exceed $20, and each employee delivered his or her component separately to the employee.
  - id: F2
    kind: situation
    status: confirmed
    fact: The assembled clock's market price is $120.
  - id: F3
    kind: situation
    status: confirmed
    fact: The six components were handed to the employee as distinct pieces, one from each contractor employee, rather than
      as a single assembled clock.
  - id: F4
    kind: authority
    status: confirmed
    fact: Regulation permits unsolicited gifts up to $20 per source per occasion, and bars acceptance of any single gift whose
      total value exceeds $20, even if the cost is split among several donors.
  - id: F5
    kind: authority
    status: confirmed
    fact: The $50 yearly cap on gifts applies to each individual donor, not to a group of donors.
  - id: F6
    kind: authority
    status: confirmed
    fact: The employee is a Department of Defense staff member slated for promotion.
  - id: F7
    kind: authority
    status: assessed
    fact: The employee has assigned the AI ethics assistant to handle ethics questions.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Each component originates from a different source, so the assembled clock is not a single gift from one source; returning
      the cash contributions removes the prohibited monetary element, allowing the physical item to be retained.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    equity: norm_reciprocity
    favors:
    - O2
    weight: strong
    why: The rule's source definition focuses on who provides the tangible item; with six distinct pieces, the clock represents
      six separate gifts, each within the $20 limit, so keeping the clock after refunding the money complies with the regulation.
  reasoning:
    read: The officer receives a $120 clock built from six $20 components supplied individually by contractors. The key issue
      is whether the assembled clock counts as a single prohibited gift or as a set of permissible separate gifts once the
      cash contributions are returned.
    weighing: Because each component comes from a different source, the gift is interpreted as six distinct items. Returning
      the monetary contributions eliminates the $20-per-source cash limit problem, leaving only the physical clock, which
      is permissible under the regulations. Considerations C1 and C2 both support this interpretation, making O1 the favored
      course.
    tradecraft: The officer should retain the clock, promptly return the $20 each contractor contributed, document the transaction
      in the official gift-log, and note the compliance rationale.
    uncertainty: Low – the regulation's source definition and the separate-component fact pattern provide a clear path.
    handoff: The decision can be executed by the officer without further ethics review, as the rule is unambiguous.
    tempting_wrong:
      option: O3
      pull: The desire to keep the clock without the administrative step of returning money.
      why_wrong: Accepting without returning the contributions would treat the cash as part of the gift, violating the $20-per-source
        prohibition.
    rejected:
      O1: Refusing the clock discards a permissible item and ignores the possibility of compliance through returning the contributions.
      O3: Keeping the clock without returning the money breaches the regulation's cash-gift limit.
      O4: A formal ethics opinion is unnecessary because the regulation already clarifies the correct handling.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: If the clock remained a single assembled item valued at $120 and was presented as one gift, then O2 would be the
        proper choice.
      then: O1
      why: The single-gift rule would apply, prohibiting acceptance.
    would_not_change:
    - id: noflip1
      if: If the contributions stayed pooled into a single clock worth $120.
      why: The prohibition on a single gift over $20 still applies.
    watch_for:
    - id: watch1
      what: Any attempt to recharacterize the assembled clock as a single gift after the contributions have been returned.
      favors:
      - O1
      why: The regulation focuses on the form of the gift presented to the employee, not on post-hoc re-labeling.
  lesson: When multiple donors each provide a separate component that together form a single item, the employee may retain
    the assembled item if the monetary contributions are returned, because the gift is treated as several distinct gifts rather
    than one prohibited gift.
  limits: This approach does not apply when the donors give one undivided item or when the gift is a discount or benefit covered
    by another exception in §2635.204.
