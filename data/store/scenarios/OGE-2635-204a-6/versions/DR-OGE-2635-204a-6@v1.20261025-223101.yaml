case:
  id: DR-OGE-2635-204a-6@v1
  title: Acceptance of pooled contractor gift (desk clock)
  status: draft
  setting: Department of Defense office, present time, employee being promoted
  decider: DoD employee
  agent: DoD employee
  agent_role: decide
  situation: A DoD employee who is about to be promoted is offered a desk clock valued at $120. Six individuals, each employed
    by a different defense contractor that has worked with the employee, each contribute $20 to purchase the clock. The contributions
    are made jointly, so the clock is presented as a single gift. The employee knows that the ethics regulation permits acceptance
    of unsolicited gifts whose aggregate market value does not exceed $20 per source per occasion, and that a single gift
    valued over $20 may not be accepted. The employee must decide whether to keep the clock or refuse it.
  question: What should the DoD employee do regarding the desk clock gift?
  options:
    O1:
      do: Accept but return contributions.
      move: partial
      irreversible: false
    O2:
      do: Accept the desk clock.
      move: act
      irreversible: true
    O3:
      do: Decline the desk clock.
      move: refuse
      irreversible: true
    O4:
      do: Seek ethics office guidance.
      move: ask
      irreversible: false
      to: agency ethics official
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Paragraph (a) permits acceptance of unsolicited gifts with an aggregate market value of $20 or less per source per
      occasion, and $50 per year per source.
  - id: F2
    kind: authority
    status: confirmed
    fact: The exception does not apply to cash or investment interests.
  - id: F3
    kind: authority
    status: confirmed
    fact: When the market value of a gift exceeds $20, the employee may not accept that portion of the gift.
  - id: F4
    kind: situation
    status: confirmed
    fact: Six individuals, each employed by a different defense contractor, each contribute $20 to purchase a desk clock with
      a market value of $120.
  - id: F5
    kind: situation
    status: confirmed
    fact: The desk clock is presented as a single gift with a market value of $120.
  - id: F6
    kind: authority
    status: confirmed
    fact: The employee may not accept the $120 gift because it is a single gift that exceeds the $20 limit.
  - id: F7
    kind: authority
    status: confirmed
    fact: A "person" includes the officers and employees of a corporation, so each contractor employee is considered a separate
      source.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Paragraph (a) sets a hard limit of $20 per source per occasion; a single gift whose market value exceeds $20 is prohibited,
      regardless of how the contributions were made.
  - id: C2
    facts:
    - F7
    - F4
    - F5
    equity: norm_reciprocity
    favors:
    - O3
    weight: strong
    why: A "person" includes officers and employees of a corporation, so each contractor employee is a separate source, but
      the clock is presented as one combined gift, not as six distinct gifts.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The regulation explicitly states that the employee may not accept a $120 desk clock because it is a single gift that
      exceeds the $20 limit.
  reasoning:
    read: The DoD employee is offered a desk clock worth $120 that was purchased with $20 contributions from six different
      contractors. Although each contribution is within the $20 per‑source limit, the clock is presented as a single item.
    weighing: Applying C1‑C3, the regulation’s clear prohibition on accepting any single gift over $20 outweighs any perceived
      goodwill. The source’s own example (Example 6 to §2635.204) reaches the same conclusion, leaving no room for a partial
      acceptance.
    tradecraft: The employee should document the offer, note the source of each contribution, and formally decline the clock
      in writing, citing §2635.204(a). The record should be kept in the employee’s ethics file.
    uncertainty: None; the rule is explicit and binding.
    handoff: No further consultation is required because the regulation provides a settled answer; however, the employee may
      inform the agency ethics official of the refusal for transparency.
    tempting_wrong:
      option: O2
      pull: The desire to accept a valuable token of appreciation from many colleagues.
      why_wrong: Even though each contributor stays within the $20 limit, the combined gift is a single item exceeding $20,
        which the regulation forbids.
    rejected:
      O1: Accepting but returning contributions would still involve receiving a $120 single gift, which is prohibited.
      O2: The clock is a single gift valued over $20, violating §2635.204(a).
      O4: Guidance is unnecessary because the regulation already settles the issue.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change: []
    would_not_change:
    - id: noflip1
      if: The gift were presented as separate items each valued at $20 or less.
      why: Even then, the combined value would still exceed the $20 per‑occasion limit for a single source, so the prohibition
        remains.
    watch_for: []
  lesson: When multiple parties pool resources to give a single item, the $20 per‑source limit applies to the combined gift,
    not to each individual contribution. A single gift over $20 is automatically prohibited.
  limits: This rule applies only to gifts presented as a single item. It does not govern separate, low‑value items given individually,
    nor does it affect gifts from prohibited sources that are covered by other sections.
  library:
    domain: federal employee gifts and ethics
    family: OGE-2635-204a-6
    source: https://www.ecfr.gov/api/versioner/v1/full/2026-10-01/title-5.xml?part=2635&subpart=B
