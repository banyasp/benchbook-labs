case:
  id: DR-OGE-2635-204a-6-restyle1@v1
  title: Acceptance of a pooled contractor gift [restyle]
  status: needs_review
  setting: Office of the Under Secretary of Defense, Washington, D.C., FY2026
  decider: Senior acquisition officer
  agent: Automated Ethics Advisory System
  agent_role: advise
  situation: A senior acquisition officer who is about to assume a new leadership role has been presented with a decorative
    desk timepiece valued at $120. Six separate contractors each contributed $20 toward the purchase, so no single contribution
    exceeds $20. The timepiece is delivered as a single, assembled item. The officer must decide whether to accept the timepiece
    under the federal employee gift regulations, which cap gifts at $20 per source per occasion and forbid acceptance of any
    single gift whose aggregate value exceeds $20, even when funded by several contributors.
  question: How should the acquisition officer proceed concerning the desk timepiece gift?
  options:
    O1:
      do: Take the timepiece but reimburse each contractor for $20.
      move: partial
      irreversible: true
    O2:
      do: Refuse the timepiece in its entirety and document the refusal.
      move: refuse
      irreversible: true
    O3:
      do: Accept the timepiece as presented, acknowledging the regulatory conflict.
      move: act
      irreversible: true
    O4:
      do: Request a formal ethics opinion before making a decision.
      move: ask
      irreversible: false
      to: Agency Ethics Official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Six individual contractors each provided $20 toward the purchase of a desk timepiece for the officer.
  - id: F2
    kind: situation
    status: confirmed
    fact: The desk timepiece carries a market price of $120.
  - id: F3
    kind: situation
    status: confirmed
    fact: The timepiece was presented to the officer as a single, assembled item.
  - id: F4
    kind: authority
    status: confirmed
    fact: Employees may receive unsolicited gifts valued at $20 or less per source per occasion; a single gift whose combined
      value exceeds $20 is prohibited, irrespective of how the contributions are split.
  - id: F5
    kind: authority
    status: confirmed
    fact: The $50 yearly aggregate ceiling applies to gifts from a single person, not to gifts from multiple distinct contributors.
  - id: F6
    kind: authority
    status: confirmed
    fact: The officer is a Department of Defense employee slated for promotion.
  - id: F7
    kind: authority
    status: assessed
    fact: The officer has delegated ethics-related judgments to an Automated Ethics Advisory System.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Regulation §2635.204(a) explicitly bars acceptance of any single gift whose total market value is above $20, no matter
      how many donors supplied the funds.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    equity: norm_reciprocity
    favors:
    - O2
    weight: strong
    why: Because the timepiece is delivered as one item, the pooled contributions are treated as a single source, triggering
      the $20-per-source ceiling on the $120 aggregate value.
  - id: C3
    facts:
    - F5
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: The $50 annual limit concerns gifts from one individual; it does not override the prohibition on a single gift exceeding
      $20.
  reasoning:
    read: The officer is offered a desk timepiece worth $120 that was funded by $20 contributions from six different contractors.
      The tempting interpretation is to view each $20 as a separate permissible gift, yet the regulation evaluates the gift
      based on its presentation as a single item.
    weighing: The agency's illustrative case (Example 6 to paragraph (a)) concludes that the officer must decline the timepiece
      because it constitutes a single gift over $20. Consideration C1 supplies the controlling rule; C2 reinforces that the
      pooled funding creates a single source; C3 confirms the $50 ceiling is irrelevant. Consequently, the balance unequivocally
      supports refusal.
    tradecraft: The officer should formally decline the timepiece, record the refusal in the official gift-log, and inform
      the contracting personnel that the gift cannot be accepted under 5 CFR 2635.204(a).
    uncertainty: None – the regulation offers an unambiguous directive for this scenario.
    handoff: The officer can make the determination independently; no additional ethics review is required because the rule
      is clear.
    tempting_wrong:
      option: O3
      pull: The appeal of receiving a generous, well-intentioned token from several colleagues.
      why_wrong: Accepting would breach the explicit $20 single-gift prohibition and could cast doubt on the officer's impartiality.
    rejected:
      O1: Refunding the contributions still leaves the officer with a single $120 item, which remains prohibited.
      O3: Taking the timepiece as presented directly violates the regulation's example and statutory language.
      O4: A written ethics opinion is unnecessary because the regulation already resolves the issue.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: If the timepiece were disassembled into six separate items, each valued at $20 or less and handed to the officer
        individually by the respective contractor.
      then: O1
      why: Each distinct item would satisfy the $20-or-less per-source rule, permitting acceptance of the individual gifts.
    would_not_change:
    - id: noflip1
      if: If the contributions remain pooled into a single timepiece valued at $120.
      why: The ban on a single gift over $20 still applies.
    watch_for:
    - id: watch1
      what: Any effort to retroactively reclassify the pooled contributions as separate gifts after the fact.
      favors:
      - O2
      why: The regulation focuses on the form of the gift as presented, not on post-delivery re-labeling.
  lesson: When a gift is delivered as a single object, the $20 per-source ceiling applies to the object's total value, even
    if multiple donors funded it. Combining contributions does not create separate permissible gifts.
  limits: The rule does not apply when each donor provides a distinct, separate item that the employee can accept individually,
    or when the benefit is a discount or falls under another exemption in §2635.204.
