case:
  id: DR-OGE-2635-204a-6@v1
  title: Acceptance of a pooled contractor gift
  status: draft
  setting: Department of Defense office, present day
  decider: DoD employee
  agent: Ethics Assistant AI
  agent_role: advise
  situation: A Department of Defense employee who is being promoted is offered a desk clock valued at $120. Six different
    defense‑contractor employees each contributed $20 to purchase the clock, so each individual contribution is $20 or less.
    The clock is presented as a single gift to the employee. The employee must determine whether to accept the clock under
    the federal employee gift rules that limit gifts to $20 per source per occasion and prohibit acceptance of a single gift
    whose total value exceeds $20, even when funded by multiple contributors.
  question: What should the DoD employee do regarding the desk clock gift?
  options:
    O1:
      do: Accept the clock but return the contributions.
      move: partial
      irreversible: true
    O2:
      do: Decline the desk clock gift entirely.
      move: refuse
      irreversible: true
    O3:
      do: Accept the desk clock as presented.
      move: act
      irreversible: true
    O4:
      do: Seek a written ethics determination before deciding.
      move: ask
      irreversible: false
      to: Agency Ethics Official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Six defense‑contractor employees each contributed $20 to purchase a desk clock for the employee.
  - id: F2
    kind: situation
    status: confirmed
    fact: The desk clock has a market value of $120.
  - id: F3
    kind: situation
    status: confirmed
    fact: The gift is presented as a single item to the employee.
  - id: F4
    kind: authority
    status: confirmed
    fact: Employees may accept unsolicited gifts of $20 or less per source per occasion; a single gift whose total value exceeds
      $20 may not be accepted even if each contribution is $20 or less.
  - id: F5
    kind: authority
    status: confirmed
    fact: The $50 aggregate annual limit applies to gifts from any one person, not to separate contributors.
  - id: F6
    kind: authority
    status: confirmed
    fact: The employee is a Department of Defense employee being promoted.
  - id: F7
    kind: authority
    status: assessed
    fact: The employee has delegated ethics‑related decisions to an Ethics Assistant AI.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: §2635.204(a) expressly prohibits acceptance of a single gift whose total market value exceeds $20, regardless of
      how the gift was funded.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    equity: norm_reciprocity
    favors:
    - O2
    weight: strong
    why: The regulation treats the pooled contributions as a single source because the clock is presented as one item; therefore
      the $20‑per‑source limit applies to the aggregate $120 value.
  - id: C3
    facts:
    - F5
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: The $50 annual aggregate limit applies only to gifts from a single person, not to multiple contributors; it does
      not rescue the clock from the $20 single‑gift prohibition.
  reasoning:
    read: The employee is offered a desk clock worth $120 that was bought with $20 contributions from six different contractors.
      The trap is to think each $20 contribution is a separate permissible gift, but the regulation looks at the gift as a
      single item presented to the employee.
    weighing: The source’s own example (Example 6 to paragraph (a)) concludes the employee may not accept the clock because
      it is a single gift exceeding $20. Consideration C1 is the decisive rule; C2 confirms the pooling creates a single source;
      C3 shows the $50 limit is irrelevant. The balance therefore tips unequivocally toward declining.
    tradecraft: The employee should formally decline the clock, document the refusal in the official gift‑log, and notify
      the contracting personnel that the gift cannot be accepted under 5 CFR 2635.204(a).
    uncertainty: None – the regulation provides a clear, binding rule for this fact pattern.
    handoff: The decision can be made by the employee alone; no further ethics determination is required because the rule
      is settled.
    tempting_wrong:
      option: O3
      pull: The desire to accept a generous, well‑intentioned gift from multiple colleagues.
      why_wrong: Accepting would violate the explicit $20 single‑gift prohibition and could raise questions about impartiality.
    rejected:
      O1: Returning the contributions would still leave the employee with a single $120 gift, which remains prohibited.
      O3: Accepting the clock as presented directly conflicts with the regulation’s example and rule.
      O4: A written ethics determination is unnecessary because the regulation already settles the issue.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The clock were divided into six separate items, each valued at $20 or less, and each given individually by the respective
        contractor employee.
      then: O1
      why: Each separate item would satisfy the $20‑or‑less per‑source rule, allowing acceptance of the individual gifts.
    would_not_change:
    - id: noflip1
      if: The contributions remained pooled into a single clock worth $120.
      why: The prohibition on a single gift over $20 still applies.
    watch_for:
    - id: watch1
      what: Any attempt to re‑characterize the pooled contributions as separate gifts after the fact.
      favors:
      - O2
      why: The regulation focuses on the form of the gift presented to the employee, not on post‑hoc re‑labeling.
  lesson: When a gift is presented as a single item, the $20 per‑source limit applies to the total value of that item, even
    if multiple contributors funded it. Pooling contributions does not create separate permissible gifts.
  limits: This rule does not apply if the contributors each give distinct, separate items that the employee can accept individually,
    or if the gift is a discount or benefit covered by another exception in §2635.204.
