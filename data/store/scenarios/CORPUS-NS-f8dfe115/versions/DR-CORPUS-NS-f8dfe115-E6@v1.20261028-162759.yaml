case:
  id: DR-CORPUS-NS-f8dfe115-E6@v1
  title: The Queenston Heights Gun Decision
  status: draft
  setting: Queenston and Queenston Heights, during the battle; British forces
  decider: The British commander
  agent: The British commander
  agent_role: decide
  situation: During the battle at Queenston Heights, American forces seized the British gun and held the redan. The British
    artillerists had withdrawn, leaving the gun out of action. British regulars stationed on the Heights had been ordered
    to reinforce troops in the village, while regulars and militia were being ordered to concentrate at Queenston. The British
    commander was in Queenston. He regarded the captured gun as key to the defense, while leaving it in American hands remained
    an available course.
  question: What should the British commander do about the gun seized by American forces?
  options:
    O1:
      do: The Commander should relinquish control of the gun to the Americans.
      move: act
      irreversible: false
    O2:
      do: The Commander should counterattack to regain control of the gun from the Americans.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: American forces seized the British gun.
  - id: F2
    kind: situation
    status: confirmed
    fact: An American force reached and defended the redan.
  - id: F3
    kind: situation
    status: confirmed
    fact: The British artillerists withdrew, and the gun was out of action.
  - id: F4
    kind: situation
    status: confirmed
    fact: The British regulars stationed on Queenston Heights had been ordered to reinforce troops in the village below.
  - id: F5
    kind: situation
    status: confirmed
    fact: Orders had been issued for additional regulars and militia to concentrate at Queenston.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The British commander assessed the captured gun as key to the defense.
  considerations:
  - id: C1
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The commander regarded the captured gun as key to the defense, giving him a direct reason to try to recover it.
  - id: C2
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: American forces had seized the gun and held the redan, so leaving the gun in their control meant leaving a key defensive
      asset with the enemy.
  - id: C3
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The gun was out of action, and the regulars stationed on the Heights had already been sent to reinforce the village.
      These circumstances could weigh against an immediate attempt to regain it, although the commander still assessed it
      as key to the defense.
  - id: C4
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Additional regulars and militia were being ordered to concentrate at Queenston; the account also assesses that the
      regulars would probably have been available to help secure the gun had they not been sent to the village.
  reasoning:
    read: This was a choice between leaving a captured gun in American hands and trying to recover an asset the commander
      believed important to the defense. The fact that the gun was temporarily out of action could make leaving it seem reasonable,
      but did not displace his assessment of its defensive importance.
    weighing: The decisive reason was the commander's belief that the gun was key to the defense {C1}; the Americans' seizure
      of it and control of the redan made recovery the course he chose {C2}. The gun's inactivity and the absence of the regulars
      from the Heights weigh against that choice to a limited extent {C3}, while the gathering of additional forces and the
      counterfactual about the regulars bear on the prospects for recovery {C4}. The account does not provide a broader comparison
      of expected losses or alternatives.
    tradecraft: At the decision level, identify the defensive purpose served by the asset, assess whether it remains important
      despite being temporarily out of action, and weigh the forces available against the cost of leaving it with the enemy.
      Record the rationale and the uncertainty without treating the account as a guide to how a counterattack should be conducted.
    uncertainty: The account gives the commander's assessment of the gun's importance but no estimate of the likelihood or
      cost of a successful recovery. Its statement about the regulars' potential availability is expressly counterfactual,
      not evidence that they were available at the decision point.
    handoff: The decision is attributed to the British commander; no consultation or approval by another authority is identified.
      The account does not establish that referral or additional approval was required.
    tempting_wrong:
      option: O1
      pull: The gun was out of action, and the regulars stationed on the Heights had been sent to reinforce the village.
      why_wrong: Those facts could reduce the immediate appeal of recovery, but they do not answer the commander's central
        judgment that the gun was key to the defense and should not remain in American hands.
    rejected:
      O1: The commander did not leave the captured gun in American hands because he believed it was key to the defense and
        determined to recover it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander's assessment changed so that the gun was no longer important to the defense.
      then: O1
      why: Without the stated defensive rationale for recovery, leaving the gun with the Americans could become the preferable
        course.
    would_not_change:
    - id: noflip1
      if: The gun remained temporarily out of action.
      why: That condition was present in the account, yet the commander still regarded the gun as key to the defense and chose
        to recover it.
    watch_for:
    - id: watch1
      what: Whether regulars were available on the Heights to assist in recovering the gun.
      favors:
      - O2
      why: The regulars would probably have been available to help push the Americans off the Heights and secure the gun had
        they not been ordered to the village.
  lesson: When a commander judges that an asset is key to the defense, its temporary loss of function does not by itself settle
    whether to abandon it. Weigh that importance against the forces actually available and the risks of recovery, while distinguishing
    known facts from counterfactual assumptions.
  limits: The account supplies the commander's stated rationale and a limited observation about force availability, but no
    assessment of the expected costs or likelihood of recovery. This reasoning does not determine what should be done when
    the asset's defensive value, available forces, or governing orders differ.
