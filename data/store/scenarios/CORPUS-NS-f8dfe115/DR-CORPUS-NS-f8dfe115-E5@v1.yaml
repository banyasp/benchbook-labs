case:
  id: DR-CORPUS-NS-f8dfe115-E5@v1
  title: Whether to Engage the Fleet at Aboukir Bay
  status: draft
  setting: Aboukir Bay, late on 1 August, Royal Navy
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: Late on 1 August, the Commander found the French fleet anchored close to shore in Aboukir Bay. The fleet included
    13 battleships and many smaller warships, and the nearby waters were shallow and hazardous. Half of the French fleet’s
    gun crews were ashore assisting the land campaign. It was late in the day and dark conditions were approaching. The French
    commander considered the position secure close to shore and expected that the Commander would not attack in the dark.
    The Commander had the confidence of his 14 battleship captains and had prepared for decisions through reflection during
    periods of downtime at sea.
  question: What should the Commander do about engaging the French fleet?
  options:
    O1:
      do: The Commander should engage the French fleet.
      move: act
      irreversible: true
    O2:
      do: The Commander should disengage from the French fleet.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The French fleet was anchored close to shore in Aboukir Bay and included 13 battleships and many smaller warships.
  - id: F2
    kind: situation
    status: confirmed
    fact: The fleet was anchored in shallow, hazardous shoal water.
  - id: F3
    kind: situation
    status: confirmed
    fact: Half of the French fleet’s gun crews were ashore assisting the land campaign.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Commander arrived late on 1 August, and the hour was late in the day.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The French commander considered the fleet secure close to shore and expected that the Commander would not attack
      in the dark.
  - id: F6
    kind: capability
    status: assessed
    fact: The Commander had the confidence of his 14 battleship captains and had confidence in them.
  - id: F7
    kind: capability
    status: assessed
    fact: The Commander had prepared for decision-making through reflection during periods of downtime at sea.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The French fleet was exposed in hazardous waters, with half its gun crews ashore, and its commander expected no attack
      in the approaching darkness. The Commander judged that vulnerability sufficient reason to engage despite the apparent
      protection of the position.
  - id: C2
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Commander’s rapid choice was grounded in prior reflection during downtime at sea, not merely a spontaneous reaction;
      he had prepared intellectually for decision-making.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Commander trusted his captains and had their confidence. Their prior exchange of ideas meant they understood
      his intentions, supporting a prompt decision to engage.
  reasoning:
    read: 'The situation was not simply that a large French fleet occupied dangerous waters at a late hour: the fleet’s partial
      loss of gun crews and its commander’s confidence that darkness would deter an attack made the position vulnerable. The
      trap was to treat the apparent security and risk of the anchorage as reasons the French could not be engaged, rather
      than recognize the opening the Commander saw.'
    weighing: 'The Commander’s stated balance favored engagement: the French fleet was vulnerable, and his decision was supported
      by preparation through reflection and confidence shared with his captains. The late hour and hazardous waters formed
      part of the French commander’s mistaken expectation, not a reason that outweighed the opportunity. The balance depends
      on the assessed vulnerability and the Commander’s readiness and trusted command relationship.'
    tradecraft: Base the decision on the current assessment of vulnerability and on preparation already developed before the
      moment of decision. Communicate the engagement decision and its rationale to the captains, and record the conditions
      and judgments supporting it; this does not require specifying how the battle is to be fought.
    uncertainty: No legal authority or rules-of-engagement analysis, civilian-impact assessment, or quantified comparison
      of risks is provided. The conclusion therefore reflects the Commander’s operational judgment, not a finding that any
      particular legal threshold was met.
    handoff: The Commander makes the engagement decision. The captains are trusted and already familiar with his intentions,
      but no additional approval authority or required referral is identified.
    tempting_wrong:
      option: O2
      pull: Disengaging may seem prudent because the waters were hazardous and darkness was approaching.
      why_wrong: The Commander treated the French expectation that he would not attack under those conditions as part of their
        vulnerability, and chose to engage rather than let the apparent security of their position dictate his decision.
    rejected:
      O2: The Commander did not disengage because he judged the French fleet vulnerable and was prepared, with the confidence
        of his captains, to act on that opportunity.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable information showed that the French fleet was no longer vulnerable—for example, its gun crews were present
        and the assessed opening had closed.
      then: O2
      why: The central reason for engagement was the fleet’s vulnerability; if that basis disappeared, disengagement could
        be preferable.
    - id: flip2
      if: Applicable law, orders, or rules of engagement did not authorize engagement.
      then: O2
      why: An operational opportunity cannot justify acting outside lawful authority.
    would_not_change:
    - id: noflip1
      if: The hour were late and darkness were approaching, without other changes to the assessment.
      why: 'Those conditions alone would not reverse the judgment: the French expectation that no attack would come in darkness
        was treated as an exploitable vulnerability.'
    watch_for:
    - id: watch1
      what: Whether the assessed vulnerability and the Commander’s confidence in the captains’ shared understanding remain
        current.
      favors:
      - O1
      why: The case for acting rests on both the French fleet’s vulnerability and the Commander’s prepared, trusted command
        relationship.
  lesson: A hazardous or late-hour situation is not automatically a reason to disengage; assess whether the opponent’s confidence
    in those conditions creates an actionable vulnerability. Prior reflection and a trusted command relationship can support
    a rapid decision, but they do not replace lawful authority or a current assessment.
  limits: This reasoning applies to the Commander’s assessment of the French fleet’s vulnerability and to the preparation
    and trust present in this situation. It does not establish legal authority, rules of engagement, or civilian-harm considerations,
    and therefore does not resolve those questions in another situation.
