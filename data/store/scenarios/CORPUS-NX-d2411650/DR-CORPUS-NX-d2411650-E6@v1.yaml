case:
  id: DR-CORPUS-NX-d2411650-E6@v1
  title: Assessing Boko Haram’s External Relationships
  status: draft
  setting: Nigeria and West Africa; as of 2012; an analyst assessing evidence of links between Boko Haram and al-Qaeda affiliates.
  decider: The analyst assessing the relationship
  agent: The analyst assessing the relationship
  agent_role: decide
  situation: Boko Haram and al-Qaeda share broad ideological positions concerning Sharia governance and Western influence.
    Over several years, statements and reports described contacts, offers of support, and alleged training involving Boko
    Haram and al-Qaeda affiliates. Boko Haram attacked the United Nations building in Abuja, an international target. At the
    same time, assessments differed about the depth of the relationship, and much of Boko Haram’s violence continued to target
    Nigerians. The analyst must assess whether the available evidence supports a finding of operational collaboration rather
    than ideological alignment or limited contact.
  question: What should the analyst assessing the relationship do with the available evidence when determining whether Boko
    Haram’s relationship with al-Qaeda affiliates amounts to operational collaboration?
  options:
    O1:
      do: The analyst rejects a finding of established operational collaboration and records ideological alignment with possible
        limited contact.
      move: act
      irreversible: false
    O2:
      do: The analyst accepts a finding of established operational collaboration and records ideological alignment with possible
        limited contact.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Boko Haram and al-Qaeda share broad ideological positions, including support for Sharia governance and opposition
      to Western influence.
  - id: F2
    kind: intelligence
    status: assessed
    fact: AQIM publicly offered to train and arm Nigerian Muslims.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Reports and official statements described contacts between Boko Haram and AQIM or al-Shabaab, including alleged
      training and an intent to coordinate.
  - id: F4
    kind: situation
    status: confirmed
    fact: Boko Haram attacked the United Nations building in Abuja, an international target.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The European Union Counterterrorism Coordinator described efforts at contact and small transfers of money, while
      stating that there was no structural relationship.
  - id: F6
    kind: situation
    status: confirmed
    fact: The attacks attributed to Boko Haram after August 2011, including those in the first two months of 2012, targeted
      local Nigerians.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Boko Haram’s public media activity did not show use of al-Qaeda-affiliated forums or public praise of al-Qaeda leaders.
  - id: F8
    kind: intelligence
    status: assessed
    fact: There was no clear evidence that Nigerians had gone to Somalia to fight or receive training, or that Somali militants
      had been captured or killed in confrontations in Nigeria.
  considerations:
  - id: C1
    facts:
    - F1
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The shared ideological positions are clear, but ideological agreement does not by itself establish strategic or operational
      collaboration.
  - id: C2
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Offers of support, reported contacts, and allegations of training or intent to coordinate make some cooperation plausible,
      but the evidence describes claims and contacts rather than establishing a structural operational relationship.
  - id: C3
    facts:
    - F4
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: The attack on an international target could indicate a shift toward the global jihadist movement, but it does not
      conclusively establish that shift or operational collaboration.
  - id: C4
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The assessment of contacts and small transfers alongside an express absence of a structural relationship, together
      with the continued targeting of local Nigerians, weighs against finding established operational collaboration.
  - id: C5
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The absence of public integration with al-Qaeda’s media network and the lack of clear evidence of travel for training
      or Somali militants operating in Nigeria leave important parts of the alleged relationship unsubstantiated.
  reasoning:
    read: The situation is one of clear ideological alignment and reported contacts, with some evidence that could suggest
      assistance, but not a demonstrated structural or operational partnership. The trap is treating shared ideology, an international-target
      attack, and assertions of contact as if together they prove operational collaboration.
    weighing: The shared views and reports of offers, contacts, and alleged training warrant recognizing possible limited
      cooperation {C1} {C2}. The Abuja attack adds concern but remains ambiguous; the predominance of attacks on local Nigerians,
      the assessment that there was no structural relationship, and the lack of corroborating indicators weigh more strongly
      against an established operational finding {C3} {C4} {C5}. The balance could change with reliable evidence of sustained
      coordination or a campaign against Western targets, but the evidence discussed does not establish that.
    tradecraft: Record ideological alignment separately from operational collaboration. Distinguish reported claims from corroborated
      evidence, state the uncertainty and contrary indicators, and avoid presenting possible ad-hoc contact as an established
      relationship.
    uncertainty: Some AQIM members may have engaged in ad-hoc coordination or knowledge sharing, and transactions may have
      occurred. The extent of strategic or operational collaboration is unclear, and evidence of training links to Somalia
      is not clear.
    handoff: The analyst should make the evidentiary judgment, consulting relevant intelligence assessments for corroboration
      before upgrading the finding.
    tempting_wrong:
      option: O2
      pull: The ideological affinity, public offers and reports of contact, and the attack on an international target can
        make a finding of operational collaboration seem compelling.
      why_wrong: Those indicators do not resolve whether the relationship was structural or operational, and continuing local
        targeting and the absence of important corroborating evidence weigh against that finding.
    rejected:
      O2: The available evidence is insufficient to move from clear ideological alignment and possible limited contact to
        established operational collaboration.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable, corroborated evidence established sustained operational coordination or material assistance between Boko
        Haram and an al-Qaeda affiliate, rather than merely reported contacts or offers.
      then: O2
      why: That would address the central evidentiary gap between possible ad-hoc contact and established operational collaboration.
    would_not_change:
    - id: noflip1
      if: The record showed ideological agreement and further uncorroborated statements or reports of contact, but no stronger
        evidence of operational ties.
      why: Those indicators are compatible with ideological alignment and possible limited contact, without establishing operational
        collaboration.
    watch_for:
    - id: watch1
      what: Whether Boko Haram launches a campaign against U.S. or other Western targets.
      favors:
      - O2
      why: A campaign against Western targets could help determine whether the international-target attack signaled adoption
        of global-jihadist objectives, though targeting alone would not establish collaboration.
  lesson: Do not infer operational collaboration from ideological affinity or a single suggestive event. Weigh reported contacts
    against corroboration, the character of the relationship, and evidence that cuts against a structural link; state what
    remains uncertain.
  limits: This conclusion is limited to the evidence and assessments discussed as of 2012. Evidence of later coordination,
    or a different evidentiary record, could support a different finding.
  library:
    domain: intel-analysis
    family: CORPUS-NX-d2411650
    source: https://jsouapplicationstorage.blob.core.windows.net/press/254/12-5.pdf
    episode_focus: The decision point is whether the available evidence supports judging the relationship as operational collaboration,
      rather than ideological alignment or limited ad-hoc contact. The authors conclude that ideological alignment is clear,
      but structural or operational collaboration remains uncertain and is not established by the evidence discussed; exclude
      descriptions of attack methods and other operational details.
    cues:
      option_words:
        O1: 17
        O2: 17
      real_option: O1
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
