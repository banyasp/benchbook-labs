case:
  id: DR-CORPUS-NX-2f40ddf1-E3@v1
  title: Delegating Wing Authority Under Broad Objectives
  status: draft
  setting: Northern Iraq during the 1990–1991 Gulf War, CENTAF and Joint Task Force Proven Force.
  decider: The CENTAF commander
  agent: The CENTAF commander
  agent_role: decide
  situation: During the Gulf War, USAFE forces were deployed to Incirlik Air Base contingent on Turkish approval, which was
    uncertain and secured only after Operation DESERT STORM began. While that approval remained uncertain, the wing did not
    figure heavily in coalition air planning. CENTAF assigned the wing a mission-type order to open a second Iraqi front whenever
    possible. The order set broad objectives, and the wing had staff and organic capabilities to operate without CENTAF assistance.
    CENTAF retained authority over the wing’s operational plans and could task it by exception. The decision is how much planning
    and execution authority to place with the wing commander.
  question: What should the CENTAF commander do about the wing’s planning and execution authority?
  options:
    O1:
      do: CENTAF centralizes operational planning and execution under the mission objectives, retaining authority over plans
        and exception tasking.
      move: act
      irreversible: false
    O2:
      do: CENTAF delegates operational planning and execution to the wing commander under broad objectives, retaining authority
        over plans and exception tasking.
      move: act
      irreversible: false
    O3:
      do: CENTAF limits the wing commander’s delegated planning and execution authority, retaining central review of plans
        and exception tasking.
      move: partial
      irreversible: false
      to: the wing commander
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Operations from Incirlik depended on Turkish government approval, which was not assured and arrived only after Operation
      DESERT STORM had begun.
  - id: F2
    kind: situation
    status: confirmed
    fact: The wing did not factor heavily into coalition air planning while Turkish approval was uncertain.
  - id: F3
    kind: situation
    status: confirmed
    fact: CENTAF assigned the wing a mission-type order to open a second Iraqi front whenever possible.
  - id: F4
    kind: situation
    status: confirmed
    fact: 'The order set three broad objectives: deny sanctuary to the Iraqi Air Force in the north, tie down Iraqi ground
      forces near the Turkish border, and attack nuclear, biological, and chemical facilities in northern Iraq.'
  - id: F5
    kind: capability
    status: confirmed
    fact: The wing was staffed to support its own combat plans and combat operations divisions.
  - id: F6
    kind: capability
    status: confirmed
    fact: The wing had organic capabilities to carry out its missions without assistance from CENTAF.
  - id: F7
    kind: authority
    status: confirmed
    fact: CENTAF retained authority over the wing’s operational plans and authority to task the wing by exception.
  - id: F8
    kind: authority
    status: confirmed
    fact: Under the mission-type order, the wing commander was to act in accordance with commander’s intent, while the method
      of accomplishing the objectives was left to that commander.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Turkish approval was uncertain and the wing was not heavily integrated into coalition planning. The mission-type
      order gave it a broad task to open a second front whenever possible, a context in which delegated authority could let
      the wing act within its assigned purpose.
  - id: C2
    facts:
    - F4
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The order specified three broad objectives but left the method of accomplishing them to the wing commander acting
      in accordance with commander’s intent. That allocation supports delegation rather than central direction of execution.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The wing had staff for its own planning and operations and organic capabilities to carry out its missions without
      CENTAF assistance, supporting its ability to exercise delegated responsibility.
  - id: C4
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Delegation did not remove CENTAF’s authority over operational plans or its ability to task the wing by exception.
      The wing commander’s discretion remained bounded by commander’s intent and CENTAF’s retained authority.
  reasoning:
    read: 'The wing’s role was initially uncertain because Turkish approval for operations from Incirlik was not assured,
      and it consequently figured little in coalition air planning. The trap is to treat limited prior integration as a reason
      to centralize everything: CENTAF instead assigned broad objectives while retaining authority over plans and exception
      tasking.'
    weighing: The balance favors {O2}. The broad objectives and the wing’s own staff and capabilities made delegated planning
      and execution workable, while retained CENTAF authority preserved oversight and the ability to intervene. The balance
      depends on the wing being able to perform independently and on CENTAF retaining its stated authority; the CENTAF commander
      empowered the wing commander to effectively fight with the wing.
    tradecraft: State the delegated scope in terms of the assigned objectives and commander’s intent, and make clear that
      CENTAF retains plan authority and exception tasking. Record the delegation and any later exercise of retained authority
      so that accountability for direction remains clear.
    uncertainty: The stated circumstances establish the command arrangement and relevant considerations but do not explicitly
      compare centralization, limited delegation, and delegation as competing choices. The reasons for O2 therefore rest on
      the mission order, the wing’s capabilities, retained authority, and the commander’s empowerment, rather than an express
      evaluation of every alternative.
    handoff: The CENTAF commander decides the allocation of authority. The wing commander carries out the delegated mission
      within commander’s intent and CENTAF’s retained authority.
    tempting_wrong:
      option: O1
      pull: Central planning may seem preferable because the wing had not been heavily integrated into coalition air planning.
      why_wrong: That limited integration arose while Turkish approval was uncertain, whereas the assigned order provided
        broad objectives and the wing had its own planning staff and capabilities; CENTAF also retained authority over plans
        and exception tasking.
    rejected:
      O1: Centralizing planning and execution was not chosen because the mission-type order left the method of accomplishing
        broad objectives to the capable wing commander while CENTAF retained authority.
      O3: Limiting the wing commander’s authority was not chosen because the arrangement left the method of achieving the
        objectives to the wing commander and enabled the wing to act with its own capabilities.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The wing lacked the staff or organic capabilities to carry out its assigned missions without CENTAF assistance.
      then: O3
      why: The basis for workable delegation includes the wing’s own planning staff and ability to operate without CENTAF
        assistance; without those capabilities, more central review or limits would be warranted.
    - id: flip2
      if: CENTAF could not retain authority over the wing’s operational plans or task it by exception.
      then: O1
      why: Without those retained controls, delegation would lack an important boundary and safeguard in this arrangement.
    would_not_change:
    - id: noflip1
      if: Turkish approval remained uncertain while the wing still had its own staff and capabilities and CENTAF retained
        its authority.
      why: Approval uncertainty and limited coalition-planning integration were part of the circumstances in which CENTAF
        assigned the mission-type order and empowered the wing commander.
    watch_for:
    - id: watch1
      what: Whether Turkish government approval for operations from Incirlik is secured and remains in place.
      favors:
      - O3
      why: Operations from Incirlik depended on that approval; if it is not secured, the scope for delegated operations should
        be limited pending authorization.
  lesson: Delegate execution of broad objectives when the subordinate command has the staff and capabilities to act, and the
    superior command can preserve meaningful authority and exception control. Uncertainty about a mission’s availability may
    explain limited prior integration, but it does not by itself require centralizing the method of execution.
  limits: This reasoning applies to the stated arrangement of broad objectives, an independently capable wing, and retained
    CENTAF authority. It does not establish that delegation is appropriate when those capabilities or authority boundaries
    are absent, or when required partner approval is unavailable.
  library:
    domain: operational-command
    family: CORPUS-NX-2f40ddf1
    source: https://www.doctrine.af.mil/Portals/61/documents/AFDP_1-1/AFDP%201-1%20Mission%20Command.pdf
