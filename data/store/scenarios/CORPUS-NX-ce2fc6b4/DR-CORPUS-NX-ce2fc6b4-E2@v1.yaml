case:
  id: DR-CORPUS-NX-ce2fc6b4-E2@v1
  title: The Arms Buildup Decision
  status: draft
  setting: United States; date unspecified; presidential national-security policy
  decider: The President
  agent: The President
  agent_role: decide
  situation: The President faced fierce domestic pressure to engage in a massive arms buildup. Soviet claims asserted military
    superiority. Intelligence available to the President was corroborated by other means. That intelligence indicated there
    was no bomber gap and no missile gap with the Soviet Union.
  question: What should the President do about domestic pressure to undertake a massive arms buildup amid Soviet claims of
    military superiority?
  options:
    O1:
      do: The President should reject a massive arms buildup.
      move: act
      irreversible: false
    O2:
      do: The President should approve a massive arms buildup.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Domestic pressure on the President was fierce.
  - id: F2
    kind: situation
    status: confirmed
    fact: The domestic pressure was to engage in a massive arms buildup.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Soviet Union made claims of military superiority.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The intelligence available to the President was corroborated by other means.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The intelligence indicated there was no bomber gap with the Soviet Union.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The intelligence indicated there was no missile gap with the Soviet Union.
  considerations:
  - id: C1
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The intelligence was corroborated by other means, giving the President a sound basis to resist pressure rather than
      follow unsupported claims.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The intelligence indicated there was no bomber gap, contradicting a premise that could support a massive buildup.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The intelligence indicated there was no missile gap, likewise undermining the case for a massive buildup.
  reasoning:
    read: The President faced fierce pressure and Soviet claims of superiority, but the corroborated intelligence indicated
      there was neither a bomber gap nor a missile gap. The trap was allowing pressure and claims to substitute for the intelligence
      available.
    weighing: The corroboration and the two findings of no gap gave the President a strong basis to resist the proposed buildup.
      Those findings outweighed domestic pressure and Soviet boasting; the balance depends on the intelligence remaining corroborated
      and indicating no gap.
    tradecraft: Keep the decision grounded in the corroborated assessment, and record the no-gap findings and their relevance
      to the buildup decision. Do not let the collection means substitute for the decision-level rationale.
    uncertainty: The assessment was treated as certain, but its scope, timing, and the process for reassessing it if circumstances
      changed are unspecified.
    handoff: The President is the identified decision-maker; no reason is given to transfer the decision or require another
      authority's approval.
    tempting_wrong:
      option: O2
      pull: Fierce domestic pressure and Soviet claims of superiority could make a massive buildup seem prudent.
      why_wrong: The corroborated intelligence indicated there was no bomber or missile gap, so those pressures did not establish
        the need for the buildup.
    rejected:
      O2: The President did not approve a massive buildup because corroborated intelligence indicated there was no bomber
        or missile gap.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Corroborated intelligence instead established a serious bomber and missile disadvantage.
      then: O2
      why: The evidentiary basis for resisting the buildup would be reversed, making approval a plausible response to the
        changed assessment.
    would_not_change:
    - id: noflip1
      if: Domestic pressure remained fierce and Soviet claims continued, while corroborated intelligence still indicated no
        bomber or missile gap.
      why: Pressure and claims alone would not displace the corroborated intelligence that supported resisting the buildup.
    watch_for: []
  lesson: Do not let political pressure or an adversary's claims stand in for the best corroborated assessment available.
    When that assessment indicates the asserted capability gap does not exist, it can support resisting a major response.
  limits: This reasoning applies to the decision as framed, where corroborated intelligence indicated no bomber or missile
    gap. It does not determine what response would be appropriate if the assessment changed or identified a genuine gap.
  library:
    domain: natsec-other
    family: CORPUS-NX-ce2fc6b4
    source: https://www.cia.gov/resources/csi/static/71908e19972eff17b2a59fc860f45cd9/U2-Program-DCI-Perspective-2.pdf
    episode_focus: The decision point is whether to undertake a major arms buildup amid domestic pressure and Soviet claims
      of military superiority. The stated reason for resisting was intelligence from the U-2, corroborated by other means,
      indicating there was no bomber or missile gap; exclude the operational means by which that intelligence was collected.
    cues:
