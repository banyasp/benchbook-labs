case:
  id: DR-CORPUS-NX-6923ef73-E1@v1
  title: Lethal Force Against an Individual Abroad
  status: draft
  setting: Outside the United States, during the continuing conflict with al-Qa'ida; U.S. government decision.
  decider: An informed, high-level U.S. government official
  agent: The informed, high-level U.S. government official
  agent_role: decide
  situation: The Individual is a U.S. citizen located outside the United States and an operational leader continually planning
    attacks against U.S. persons and interests. The official must assess whether this activity presents an imminent threat
    under a standard that does not require clear evidence of a specific attack in the immediate future. The assessment accounts
    for the continuing campaign, the possibility that plots are not all known, and a limited opportunity to prevent attacks
    while reducing civilian casualties. A capture operation is assessed infeasible during the relevant window, while those
    conducting the operation continue to monitor whether capture becomes feasible. Any proposed operation is conditioned on
    compliance with necessity, distinction, proportionality, and humanity, including the bar on excessive civilian casualties.
    The government’s interest in protecting Americans from attack is weighed against the Individual’s interest in life and
    the constitutional question of further process.
  question: What should the informed, high-level U.S. government official do about authorizing lethal force against the Individual?
  options:
    O1:
      do: The informed, high-level U.S. government official declines authorization for lethal force against the Individual.
      move: act
      irreversible: false
    O2:
      do: The informed, high-level U.S. government official authorizes lethal force against the Individual.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is a U.S. citizen located outside the United States.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Individual is an operational leader continually planning attacks against U.S. persons and interests.
  - id: F3
    kind: authority
    status: confirmed
    fact: The imminence standard does not require clear evidence that a specific attack will occur in the immediate future.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The threat assessment accounts for continual plotting, the possibility that the government is unaware of developing
      plots, and a limited window to prevent attacks while reducing the probability of civilian casualties.
  - id: F5
    kind: capability
    status: assessed
    fact: Capture is assessed as infeasible during the relevant window; feasibility depends on the circumstances and may change
      over time.
  - id: F6
    kind: situation
    status: confirmed
    fact: Those conducting the operation continue to monitor whether capture becomes feasible.
  - id: F7
    kind: authority
    status: confirmed
    fact: Any lethal operation must comply with necessity, distinction, proportionality, and humanity.
  - id: F8
    kind: authority
    status: confirmed
    fact: An operation would not comply with the law of war if anticipated civilian casualties were excessive in relation
      to the anticipated military advantage.
  - id: F9
    kind: authority
    status: confirmed
    fact: Under the stated circumstances, the government’s interest in protecting citizens from an imminent attack means the
      Constitution would not require further process before lethal force is used.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The paper treats imminence in light of the continuing campaign, not as requiring clear evidence of a specific attack
      in the immediate future. Because plots may be unknown and the opportunity to act may be limited, waiting for a plot’s
      final stage could make defense fail and increase the risk of American casualties.
  - id: C2
    facts:
    - F5
    - F6
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Lethal force is available under the paper’s framework when capture cannot be effected during the relevant window.
      Capture feasibility is fact-specific and time-sensitive, so continued monitoring is part of the condition for relying
      on its infeasibility.
  - id: C3
    facts:
    - F7
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Authorization is supported only for an operation consistent with necessity, distinction, proportionality, and humanity.
      In particular, anticipated civilian casualties cannot be excessive in relation to the anticipated military advantage.
  - id: C4
    facts:
    - F1
    - F9
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual’s citizenship and interest in life make the process question consequential. The paper nevertheless
      concludes that, under these circumstances, the government’s interest in protecting citizens from an imminent attack
      means the Constitution does not require further process before lethal force.
  reasoning:
    read: 'This is a decision about a U.S. citizen outside the United States whom the official assesses to be an operational
      leader continually planning attacks, not about a person linked only to a past plot. The trap is to equate imminence
      with proof of a specific attack about to occur: the paper rejects that standard for a continuing, sporadic campaign
      in which plots may be unknown and the opportunity to prevent attacks may be limited.'
    weighing: The paper’s judgment supports {O2} because the threat assessment meets its broader imminence standard, capture
      is assessed infeasible during the relevant window and remains under review, and the proposed operation is conditioned
      on law-of-war compliance. The balance gives substantial weight both to protecting Americans and to the Individual’s
      interest in life; it does not permit proceeding if the required legal constraints, including the bar on excessive civilian
      casualties, are not met. On the stated circumstances, the paper concludes that further constitutional process is not
      required. The balance depends on the continuing threat assessment, capture feasibility, and compliance with the law
      of war.
    tradecraft: Keep the authorization tied to the official’s stated threat and capture-feasibility assessments and to the
      law-of-war conditions. Record the basis for the imminence determination and reassess capture feasibility and the civilian-harm
      constraint as circumstances change; this is decision practice, not a method for carrying out an operation.
    uncertainty: The paper does not require certainty that a particular attack is imminent; it expressly accounts for the
      possibility that the government is unaware of developing plots. Capture feasibility is fact-specific and may change,
      and the assessment must still support the stated conditions for lethal force.
    handoff: The source assigns the determination to an informed, high-level government official and identifies no separate
      approval requirement. Relevant assessments may inform that official’s judgment, but the decision should not be represented
      as an automatic consequence of the facts.
    tempting_wrong:
      option: O1
      pull: Declining authorization may seem required because the Individual is a citizen and the record does not establish
        a specific attack in the immediate future.
      why_wrong: The paper says that this kind of specific, immediate evidence is not required for imminence when an operational
        leader is continually planning attacks and the opportunity to defend may be limited.
    rejected:
      O1: The paper’s stated conditions are met, so it concludes that lethal force may be used without further constitutional
        process, subject to continuing capture monitoring and law-of-war compliance.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Capture becomes feasible during the relevant window.
      then: O1
      why: Infeasible capture is a condition of the paper’s authorization framework; if capture becomes feasible, the stated
        basis for lethal force no longer holds.
    - id: flip2
      if: Anticipated civilian casualties would be excessive in relation to the anticipated military advantage.
      then: O1
      why: The paper says continuing an operation in those circumstances would not comply with the law-of-war principles required
        for authorization.
    - id: flip3
      if: There is evidence that the Individual has renounced or abandoned the relevant activities.
      then: O1
      why: The paper relies on the absence of such evidence when explaining why recent involvement and the continuing campaign
        support an imminent-threat conclusion.
    would_not_change:
    - id: noflip1
      if: There is no clear evidence that a specific attack will take place in the immediate future.
      why: That absence alone does not defeat imminence under the paper’s standard for operational leaders continually planning
        attacks.
    watch_for:
    - id: watch1
      what: Whether capture becomes feasible as circumstances change.
      favors:
      - O1
      why: The paper makes capture infeasibility time-sensitive and requires continued monitoring of whether capture becomes
        feasible.
  lesson: For a leader continually planning attacks, imminence need not mean proof of a specific attack in the immediate future
    when plots may be unknown and the defensive opportunity limited. Lethal force is supported only when capture is infeasible
    and the operation complies with the law of war, including proportionality and the prohibition on excessive civilian casualties.
  limits: 'This reasoning applies only to the stated circumstances: an operational leader continually planning attacks, outside
    the United States, with capture infeasible during the relevant window and a proposed operation compliant with the law
    of war. It does not establish that lethal force is justified when those conditions are absent or that the same constitutional
    conclusion applies in other circumstances.'
