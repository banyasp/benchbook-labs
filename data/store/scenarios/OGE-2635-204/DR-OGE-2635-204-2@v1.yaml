case:
  id: DR-OGE-2635-204-2@v1
  title: FDIC Employee Invitation to Basketball Game
  status: draft
  setting: Federal Deposit Insurance Corporation, present, workplace context
  decider: FDIC employee
  agent: FDIC employee
  agent_role: decide
  situation: The employee of the FDIC is in a romantic relationship with an accountant who works for a member bank. The member
    bank’s work‑life balance program distributed two tickets to a professional basketball game to each employee in the accountant’s
    division. The tickets were given to the accountant without reservation, and the accountant invited the FDIC employee to
    use one of the tickets. The invitation was extended because of the personal friendship between the employee and the accountant,
    not because of the employee’s official position. The employee must decide whether to accept the invitation under the ethics
    rule on gifts based on personal relationships.
  question: What should the FDIC employee do regarding the invitation to the basketball game?
  options:
    O1:
      do: The employee requests a written determination from the agency ethics official before deciding.
      move: ask
      irreversible: false
    O2:
      do: The employee accepts the invitation to attend the basketball game.
      move: act
      irreversible: false
    O3:
      do: The employee declines the invitation to attend the basketball game.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the Federal Deposit Insurance Corporation.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee is dating an accountant employed by a member bank.
  - id: F3
    kind: situation
    status: confirmed
    fact: The member bank’s work‑life balance program gave each employee in the accountant’s division two tickets to a professional
      basketball game.
  - id: F4
    kind: situation
    status: confirmed
    fact: The tickets were given to the accountant without reservation to use as desired.
  - id: F5
    kind: situation
    status: confirmed
    fact: The invitation to the FDIC employee was motivated by personal friendship rather than the employee’s official position.
  - id: F6
    kind: authority
    status: confirmed
    fact: Gifts based on a personal relationship may be accepted if it is clear the gift is motivated by a family relationship
      or personal friendship rather than the employee’s position.
  - id: F7
    kind: authority
    status: confirmed
    fact: Relevant factors include the history and nature of the relationship and whether the friend personally pays for the
      gift.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F6
    - F7
    equity: norm_reciprocity
    favors:
    - O2
    weight: strong
    why: §2635.204(b) permits acceptance of a gift when it is clearly motivated by a personal friendship rather than the employee’s
      official position, and the facts show the invitation stems from the romantic relationship.
  - id: C2
    facts:
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: The tickets were distributed by the bank’s work‑life balance program to all division employees without reservation,
      so the FDIC employee’s receipt is not a targeted benefit tied to the employee’s official duties.
  - id: C3
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The regulation itself (the source) provides an explicit example that the same factual scenario is permissible, making
      the outcome binding.
  reasoning:
    read: The FDIC employee is invited by a romantic partner who works for a member bank to use a basketball‑game ticket that
      the bank gave to its staff. The trap is to assume the bank’s status as a regulated entity automatically makes the gift
      prohibited, but the rule carves out a personal‑relationship exception.
    weighing: Applying C1, the personal‑relationship exception is satisfied because the invitation is motivated by friendship,
      not official position. C2 confirms the gift is not a targeted benefit. C3 notes the regulation’s own example endorses
      acceptance, so the balance tips decisively toward acceptance.
    tradecraft: The employee should document the invitation, note the personal‑relationship basis, and retain the ticket as
      evidence of compliance with §2635.204(b). No further agency clearance is required.
    uncertainty: Minimal; the regulation directly addresses the scenario.
    handoff: The decision can be made by the employee alone because the rule is self‑executing; no ethics‑official determination
      is required.
    tempting_wrong:
      option: O3
      pull: A cautious employee might decline to avoid any appearance of impropriety because the donor is a regulated bank.
      why_wrong: The regulation expressly states the invitation is permissible, so declining would be unnecessary and could
        be seen as over‑cautious.
    rejected:
      O1: A written determination is unnecessary because the rule already provides a clear exception.
      O3: The personal‑relationship exception applies; declining would contradict the source’s own example.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the invitation were motivated by the employee’s official position or by the bank’s interest in pending FDIC matters
      then: O3
      why: The personal‑relationship exception would not apply, and the gift would be prohibited under §2635.202(a).
    would_not_change:
    - id: noflip1
      if: the employee seeks a written ethics determination before accepting
      why: The regulation already authorizes acceptance; a determination would not alter the outcome.
    watch_for:
    - id: watch1
      what: any indication that the bank is seeking favorable treatment from the FDIC employee
      favors:
      - O3
      why: A business motive would defeat the personal‑relationship exception.
  lesson: When a gift originates from a personal relationship and is not tied to the employee’s official duties, the personal‑relationship
    exception in §2635.204(b) permits acceptance, even if the donor is a regulated entity.
  limits: This reasoning does not apply if the gift is cash, exceeds $20 in value, or is offered because the donor expects
    official action; in those cases other prohibitions apply.
