case:
  id: DR-OGE-2635-204-1@v1
  title: Acceptance of a pooled contractor gift
  status: draft
  setting: Department of Defense, promotion ceremony, present day
  decider: the employee
  agent: Ethics Assistant
  agent_role: decide
  situation: A Department of Defense employee is being promoted to a higher‑level position in another DoD office. Six individuals,
    each employed by a different defense contractor, each contribute $20 to purchase a desk clock for the employee. The desk
    clock has a market value of $120. The employee must determine whether to accept the clock under the agency’s gift‑acceptance
    rules. The relevant regulation permits acceptance of unsolicited gifts of $20 or less per source per occasion and prohibits
    acceptance of a single gift whose value exceeds $20, even when contributions come from multiple sources. The employee
    has delegated the decision to an ethics‑assistant agent.
  question: What should the ethics assistant do regarding the desk clock gift?
  options:
    O1:
      do: The employee declines the desk clock.
      move: act
      irreversible: true
    O2:
      do: The employee asks the ethics official.
      move: ask
      irreversible: false
      to: agency ethics official
    O3:
      do: The employee accepts the desk clock.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the Department of Defense and is being promoted to a higher‑level position in another DoD
      office.
  - id: F2
    kind: situation
    status: confirmed
    fact: Six individuals, each employed by a different defense contractor, each contributed $20 to purchase a desk clock
      for the employee.
  - id: F3
    kind: situation
    status: confirmed
    fact: The desk clock has a market value of $120.
  - id: F4
    kind: authority
    status: confirmed
    fact: An employee may accept unsolicited gifts having an aggregate market value of $20 or less per source per occasion;
      gifts exceeding $20 may not be accepted even if contributions are from multiple sources.
  - id: F5
    kind: authority
    status: confirmed
    fact: When the market value of a gift exceeds $20, the employee may not pay the excess value to accept that portion of
      the gift.
  - id: F6
    kind: authority
    status: confirmed
    fact: The aggregate market value of individual gifts received from any one person may not exceed $50 in a calendar year.
  - id: F7
    kind: authority
    status: confirmed
    fact: The employee is authorized to accept or reject gifts in accordance with 5 C.F.R. §2635.204(a).
  - id: F8
    kind: authority
    status: assessed
    fact: The employee has delegated the decision to an ethics‑assistant agent under the employee’s authority to apply the
      gift‑acceptance regulations.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: §2635.204(a) expressly prohibits acceptance of a single gift whose market value exceeds $20, and the employee may
      not pay the excess to accept the gift.
  - id: C2
    facts:
    - F2
    - F6
    equity: norm_reciprocity
    favors:
    - O1
    weight: weak
    why: Although each contributor stays within the $50‑per‑year limit, the aggregate gift is still a single item valued at
      $120, which the rule treats as a single gift.
  - id: C3
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The regulation clarifies that when the market value of a gift exceeds $20, the employee may not pay the excess value
      to accept that portion; the gift must be rejected in whole.
  reasoning:
    read: The employee has been offered a desk clock worth $120 that was purchased with $20 contributions from six different
      contractors. The trap is to think the multiple contributors make the gift permissible, but the regulation treats the
      clock as a single gift.
    weighing: The source’s own example (Example 6 to §2635.204(a)) states that even though each contribution is $20, the employee
      may not accept the $120 clock because it is a single gift exceeding $20. {C1} and {C3} are decisive; {C2} reinforces
      the conclusion but carries less weight.
    tradecraft: The employee should formally decline the clock in writing, cite the specific regulation, and document the
      decision in the agency’s gift‑acceptance log.
    uncertainty: None; the regulation is clear and unambiguous for this factual scenario.
    handoff: The employee may act alone under the delegated authority of the ethics‑assistant; no further consultation is
      required because the rule is settled.
    tempting_wrong:
      option: O3
      pull: The goodwill of six contractors and the desire to keep a positive relationship may tempt acceptance.
      why_wrong: Accepting would violate the explicit $20‑per‑gift limit and could appear as preferential treatment, undermining
        agency integrity.
    rejected:
      O2: The regulation already provides a clear answer; consulting the ethics official is unnecessary.
      O3: The gift exceeds the $20 limit for a single item, which the regulation forbids regardless of how it was funded.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the clock were divided into separate items each valued at $20 or less per source
      then: O3
      why: Each separate item would meet the $20 per‑gift limit and could be accepted.
    would_not_change:
    - id: noflip1
      if: the employee attempted to pay the $100 excess to keep the clock
      why: §2635.204(a) expressly forbids paying the excess value to accept a gift over $20.
    watch_for:
    - id: watch1
      what: any gift that is cash or a cash equivalent (e.g., gift cards)
      favors:
      - O1
      why: Such gifts are categorically prohibited regardless of amount.
  lesson: A single tangible gift whose market value exceeds $20 must be rejected, even if the cost is pooled from multiple
    sources. The $20‑per‑gift limit applies to the aggregate value of the item, not to each contributor’s share.
  limits: This rule does not apply to discounts, travel, or services that fall under other exceptions (e.g., §2635.204(c)
    or (g)). It also does not cover gifts that are expressly authorized by a supplemental agency regulation or statute.
