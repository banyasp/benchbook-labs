case:
  id: DR-CORPUS-NX-2c6f7bc9-E1@v1
  title: Responding to a Special Rapporteur's Inquiry
  status: draft
  setting: Yemen, November 2002 incident; United States Government response to the Special Rapporteur's inquiry.
  decider: The Government of the United States
  agent: The Government of the United States
  agent_role: decide
  situation: The Government of the United States is considering how to respond to the Special Rapporteur's inquiry concerning
    a November 2002 incident in Yemen. A letter alleges that a US-controlled Predator drone killed six men traveling in a
    car, including at least one suspected senior al-Qaida figure. The letter invokes protections of the right to life and
    security of the person under the Universal Declaration of Human Rights and the International Covenant on Civil and Political
    Rights. The Special Rapporteur considers the attack an extrajudicial killing and says government action must comply with
    international human rights and humanitarian law. The United States Government maintains that inquiries about military
    operations during armed conflict with al-Qaida fall outside the Special Rapporteur's mandate and that such operations
    are governed by the law of armed conflict.
  question: What should the Government of the United States do in response to the Special Rapporteur's inquiry?
  options:
    O1:
      do: The Government of the United States withholds comment on the allegations and asserts that the inquiry falls outside
        the Special Rapporteur's mandate.
      move: act
      irreversible: false
    O2:
      do: The Government of the United States discloses its merits response on the allegations and their accuracy to the Special
        Rapporteur.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: A letter alleges that a US-controlled Predator drone killed six men traveling in a car during an incident in Yemen.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The letter alleges that at least one of the six men was a suspected senior figure of al-Qaida.
  - id: F3
    kind: authority
    status: confirmed
    fact: The letter invokes protections of the right to life and security of the person under the Universal Declaration of
      Human Rights and the International Covenant on Civil and Political Rights.
  - id: F4
    kind: situation
    status: assessed
    fact: The Special Rapporteur says governments must protect people against non-state actors and other authorities in accordance
      with international human rights and humanitarian law.
  - id: F5
    kind: situation
    status: assessed
    fact: The Special Rapporteur characterizes the attack in Yemen as a clear case of extrajudicial killing.
  - id: F6
    kind: authority
    status: confirmed
    fact: The United States Government maintains that inquiries concerning military operations during armed conflict with
      al-Qaida fall outside the Special Rapporteur's mandate.
  - id: F7
    kind: authority
    status: confirmed
    fact: The United States Government maintains that legitimate military operations against enemy combatants are governed
      by the international law of armed conflict.
  - id: F8
    kind: situation
    status: confirmed
    fact: The United States Government disagrees with treating military operations against enemy combatants as extrajudicial
      executions by consent of governments.
  considerations:
  - id: C1
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Government's stated position is that inquiries about military operations during armed conflict with al-Qaida
      fall outside the Special Rapporteur's mandate, supporting withholding comment rather than providing a merits response.
  - id: C2
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Government maintains that the alleged operation occurred during armed conflict and that legitimate military operations
      against enemy combatants are governed by the international law of armed conflict.
  - id: C3
    facts:
    - F5
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The Government rejects treating military operations against enemy combatants as extrajudicial executions by consent
      of governments, placing its response in disagreement with the Special Rapporteur's characterization.
  reasoning:
    read: The decision is how the Government responds to an inquiry about an alleged killing, not whether to conduct the attack.
      The trap is to treat the grave allegation and the Government's jurisdictional response as if they settled the attack's
      merits; the Government gives no comment on the specific allegations or their accuracy.
    weighing: 'The Government''s stated reasons favor {O1}: it maintains that the inquiry falls outside the Special Rapporteur''s
      mandate and that military operations during armed conflict are governed by the law of armed conflict. It also rejects
      the premise that such operations are extrajudicial executions by consent of governments. The balance depends on the
      Government''s stated characterization of the operation as occurring during armed conflict and its position on the Rapporteur''s
      mandate; the source does not resolve the underlying allegations.'
    tradecraft: Record the response as a jurisdictional and legal-framework position, and keep it distinct from any finding
      about the allegations' accuracy or the operational decision. Do not imply that withholding comment establishes the facts
      or resolves the merits.
    uncertainty: The Government expressly gives no comment on the specific allegations or their accuracy. The source provides
      its position on mandate and applicable law, but does not establish the alleged events or resolve the disagreement over
      the attack's characterization.
    handoff: The Government is the identified decision-maker for this response. The source identifies no other office or authority
      to involve, so this answer does not assign one.
    tempting_wrong:
      option: O2
      pull: A merits response could appear to answer directly the serious allegations and the Special Rapporteur's conclusion.
      why_wrong: 'That is not the Government''s chosen basis: it withholds comment on the specific allegations and maintains
        that the inquiry falls outside the Rapporteur''s mandate.'
    rejected:
      O2: The Government did not disclose a merits response because it maintained that the inquiry fell outside the Special
        Rapporteur's mandate and that the operations were governed by the law of armed conflict.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Government determined that the inquiry did fall within the Special Rapporteur's mandate.
      then: O2
      why: That would remove the Government's stated mandate-based reason for withholding a merits response, though it would
        not itself resolve the allegations or the applicable legal framework.
    would_not_change:
    - id: noflip1
      if: The Special Rapporteur continued to characterize the attack as an extrajudicial killing.
      why: That characterization is already part of the disagreement; the Government's stated response rests on its mandate
        position and its view that the law of armed conflict governs the operation.
    watch_for:
    - id: watch1
      what: A determination about whether inquiries concerning these military operations fall within the Special Rapporteur's
        mandate.
      favors:
      - O2
      why: The Government's asserted mandate boundary is its direct reason for declining comment.
  lesson: When a government declines a merits response on jurisdictional grounds, distinguish that stated position from a
    resolution of the underlying allegations. State the legal framework the government invokes without presenting its position
    as an independent finding that the allegations are accurate or inaccurate.
  limits: This reasoning concerns the Government's response to this inquiry and its stated position about mandate and armed-conflict
    law. It does not decide whether the attack was lawful, whether the factual allegations are accurate, or whether the Special
    Rapporteur had jurisdiction.
