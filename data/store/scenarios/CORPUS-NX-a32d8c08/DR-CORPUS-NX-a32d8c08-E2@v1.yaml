case:
  id: DR-CORPUS-NX-a32d8c08-E2@v1
  title: Assessing Competing Explosion-Damage Accounts
  status: draft
  setting: Japan, after imagery began transmitting in late May, national policymakers
  decider: Japanese policymakers, including the prime minister
  agent: Japanese policymakers, including the prime minister
  agent_role: decide
  situation: North Korea’s state-run broadcaster reported damage from an explosion. It reported buildings damaged as far as
    2 km from the epicenter and extensive damage, especially within a 1.5-km radius. Japanese officials’ imagery-based assessment
    placed the damaged area’s maximum radius at 1 km. Policymakers, including the prime minister, viewed the photos and independent
    damage assessments. The imagery began transmitting in late May.
  question: What should Japanese policymakers do when assessing the competing accounts of the explosion’s damage?
  options:
    O1:
      do: Japanese policymakers reject North Korea’s public damage account and adopt the independent assessment.
      move: act
      irreversible: false
    O2:
      do: Japanese policymakers accept North Korea’s public damage account as the operative assessment.
      move: act
      irreversible: false
    O3:
      do: Japanese policymakers request independent reviewers to reconcile the competing damage assessments.
      move: ask
      irreversible: false
      to: independent reviewers
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: North Korea’s state-run broadcaster reported that buildings were damaged as far as 2 km from the explosion’s epicenter.
  - id: F2
    kind: intelligence
    status: assessed
    fact: North Korea’s state-run broadcaster reported extensive damage, especially within a 1.5-km radius of the blast.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Japanese officials assessed the damaged area’s maximum radius as 1 km.
  - id: F4
    kind: situation
    status: confirmed
    fact: Policymakers, including the prime minister, viewed the photos.
  - id: F5
    kind: situation
    status: confirmed
    fact: Policymakers viewed independent damage assessments.
  - id: F6
    kind: situation
    status: confirmed
    fact: The satellites began transmitting imagery in late May.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: North Korea’s public account described damage extending farther than the Japanese assessment, so it was a competing
      claim that needed to be weighed.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: After reviewing the photos and independent damage assessments, Japanese officials placed the maximum radius at 1
      km, supporting the less extensive assessment over the public account.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Policymakers concluded that North Korea had exaggerated the damage to gain international aid, which supported rejecting
      its account as the operative assessment.
  reasoning:
    read: The decision was how to assess conflicting claims about the explosion’s damage. North Korea reported a wider area
      of damage, while the Japanese assessment, informed by photos and independent assessments, placed the maximum radius
      at 1 km; the trap was to treat the public account as established despite that contrary assessment.
    weighing: The North Korean account gives a reason to consider a more extensive damage estimate {C1}, but the officials’
      assessment after reviewing photos and independent assessments weighs strongly toward {O1} {C2}. Tokyo also concluded
      that North Korea exaggerated the damage to seek international aid {C3}. The balance depends on the independent assessment
      supporting the smaller damage area; no contrary independent finding is identified.
    tradecraft: Record the competing reported claims, the 1-km assessment, and the basis for preferring it. Keep the assessed
      extent of damage distinct from the conclusion about North Korea’s motive.
    uncertainty: The account gives the reported claims and the Japanese assessment, but no confidence levels or further detail
      about the independent assessments. The conclusion about seeking aid is the policymakers’ judgment, not a separately
      described finding.
    handoff: Japanese policymakers, including the prime minister, should make the assessment after reviewing the photos and
      independent damage assessments. No further referral is warranted on the stated record.
    tempting_wrong:
      option: O2
      pull: Accepting North Korea’s public account would credit its stated description of extensive damage.
      why_wrong: Policymakers reviewed photos and independent damage assessments and judged the damaged area to be smaller,
        then concluded North Korea had exaggerated the damage.
    rejected:
      O2: It was not chosen because policymakers judged the damage less extensive than North Korea’s public account described
        and concluded that the account was exaggerated.
      O3: It was not chosen because policymakers had already viewed the photos and independent damage assessments and reached
        an assessment.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Independent reviewers instead substantiated North Korea’s account of the wider damage area.
      then: O2
      why: That would remove the stated evidentiary basis for preferring the smaller Japanese assessment.
    - id: flip2
      if: Independent assessments remained materially inconsistent and policymakers could not resolve the discrepancy.
      then: O3
      why: Deferring for reconciliation would then be preferable to adopting either account without a resolved basis.
    would_not_change:
    - id: noflip1
      if: North Korea repeated its public damage claims without new independent corroboration.
      why: Repetition alone would not displace the independent assessment on which policymakers based their conclusion.
    watch_for: []
  lesson: When accounts conflict, assess them against the available independent evidence rather than treating a public claim
    as established. Distinguish the assessment of what happened from any judgment about why an account was presented.
  limits: This reasoning concerns the described damage assessment and the evidence policymakers reviewed. It does not establish
    that every disputed public account is exaggerated or that the same conclusion applies where independent assessments are
    absent or unresolved.
  library:
    domain: intel-analysis
    family: CORPUS-NX-a32d8c08
    source: https://www.cia.gov/resources/csi/static/aca9997a3231f8682380c970a5ab831a/Origins-and-Current-State.pdf
    episode_focus: 'The decision point is how to assess competing accounts of the explosion’s damage: North Korea’s public
      account versus the assessment based on imagery and independent review. Policymakers, including the prime minister, judged
      the damage less extensive and concluded that North Korea exaggerated it to seek international aid; exclude any discussion
      of imagery collection methods.'
    cues:
      option_words:
        O2: 12
        O1: 13
        O3: 11
      real_option: O1
      real_to_mean_other_length: 1.13
      real_is_longest: true
      moves:
        O2: act
        O1: act
        O3: ask
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
        O3: false
    equities: pilot2
verdict_tier: source-endorsed
basis: Tokyo concluded that North Korea exaggerated the damage in a bid to gain more international aid.
