    episode_focus: The decision point is the watch community’s prewar estimate of the likelihood and scale of hostilities,
      including its choice not to assess a major outbreak as likely. Include the stated indicators and uncertainty; exclude
      operational military decisions and later judgments about whether the estimate was correct.
