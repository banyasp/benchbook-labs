basis: The Combined Watch Report of the United States Intelligence Board continued to assess a major Arab-Israeli outbreak
  as unlikely in the immediate future; the Central Intelligence Bulletin's stated judgments about initiation and the incentives
  facing Egypt and Syria supported that assessment.
