case:
  id: DR-CORPUS-NS-15465f76-E1@v1
  title: Choosing NLLP Visibility
  status: draft
  setting: Within the NATO LL Process, when an observation is entered in the NLLP.
  decider: The originator
  agent: The originator
  agent_role: decide
  situation: The originator is assigning visibility metadata to an observation in the NLLP. The visibility choice determines
    who can see the observation. Internal visibility limits access to personnel within the originating headquarters, while
    external visibility makes it available to other NLLP users. Wider sharing can allow headquarters to learn from one another.
    The choice turns on whether the issue is specific to the originating headquarters or too sensitive for broader sharing.
  question: What should the originator do when assigning visibility to the observation in the NLLP?
  options:
    O1:
      do: The originator assigns internal visibility to the observation, limiting it to personnel within the originating headquarters.
      move: act
      irreversible: false
    O2:
      do: The originator assigns external visibility to the observation, making it available to other NLLP users.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Originators should attach metadata to observations in the NLLP as soon as possible.
  - id: F2
    kind: situation
    status: confirmed
    fact: Visibility is a required metadata element for observations and lessons in the NLLP.
  - id: F3
    kind: situation
    status: confirmed
    fact: 'Visibility has two options: internal and external.'
  - id: F4
    kind: situation
    status: confirmed
    fact: Internal visibility limits access to personnel within the originating headquarters.
  - id: F5
    kind: situation
    status: confirmed
    fact: External visibility allows other NLLP users to see the lesson.
  - id: F6
    kind: authority
    status: confirmed
    fact: The guidance recommends sharing lessons externally as much as possible to allow headquarters to learn from each
      other.
  - id: F7
    kind: authority
    status: confirmed
    fact: Internal visibility is recommended only when the issue is specific to the originating headquarters or is deemed
      too sensitive to share more broadly.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: External visibility lets other NLLP users see the lesson, and the guidance recommends sharing externally as much
      as possible so headquarters can learn from one another.
  - id: C2
    facts:
    - F7
    equity: policy_compliance
    favors:
    - O1
    weight: weak
    why: The guidance recommends internal visibility when the issue is specific to the originating headquarters; this is an
      exception to the general preference for external sharing.
  - id: C3
    facts:
    - F7
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: The guidance also recommends internal visibility if the issue is too sensitive to share broadly; whether that condition
      applies affects the choice.
  reasoning:
    read: This is a choice about who can see the observation, not an automatic choice to restrict access. The guidance favors
      external visibility for wider learning, while reserving internal visibility for an issue specific to the originating
      headquarters or too sensitive to share broadly.
    weighing: The stated benefit of external visibility is that headquarters can learn from one another, and the guidance
      recommends external sharing as much as possible {C1}. Internal visibility is the stated exception if either limiting
      condition applies {C2} {C3}. On the facts provided, no such condition is identified, so the recommendation favors {O2};
      the balance depends on whether the issue is headquarters-specific or too sensitive for broader sharing.
    tradecraft: Assess whether the issue is specific to the originating headquarters and whether it is too sensitive for broader
      sharing. Choose external visibility unless one of those conditions applies; record the reason for an internal choice.
      The recommendation to record a reason is decision practice, not an express requirement in the excerpt.
    uncertainty: The excerpt does not define how to judge whether an issue is too sensitive, and the facts do not resolve
      that assessment. If either exception applies, the guidance points to internal visibility instead.
    handoff: The originator is the decider in this scenario. The excerpt does not require referral to another authority; seeking
      appropriate advice if sensitivity is uncertain is a prudent practice, not a stated rule.
    tempting_wrong:
      option: O1
      pull: Restricting access can seem like the safer default when an observation might be sensitive.
      why_wrong: 'The guidance does not recommend internal visibility as the default: it recommends external sharing as much
        as possible and identifies specific conditions for limiting access.'
    rejected:
      O1: Internal visibility was not chosen because the stated facts do not identify either condition for the guidance's
        internal-only exception.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The issue is specific to the originating headquarters.
      then: O1
      why: The guidance recommends limiting visibility to internal users in that circumstance.
    - id: flip2
      if: The issue is deemed too sensitive to share more broadly.
      then: O1
      why: The guidance recommends internal visibility for an issue judged too sensitive for broader sharing.
    would_not_change:
    - id: noflip1
      if: Other NLLP users could learn from the observation and neither internal-only condition applies.
      why: That learning benefit supports the guidance's general recommendation for external visibility rather than changing
        it.
    watch_for: []
  lesson: For NLLP visibility, favor external sharing so other headquarters can learn from observations. Limit access to the
    originating headquarters when the issue is specific to it or too sensitive for broader sharing.
  limits: This reasoning concerns the NLLP visibility choice only. It does not determine classification or releasability,
    or resolve how sensitivity should be assessed in a particular case.
  library:
    domain: natsec-other
    family: CORPUS-NS-15465f76
    source: https://www.jallc.nato.int/application/files/4416/5781/2017/JALLC_LL_Handbook_Update_-_4th_Edition_FINAL_14072022.pdf
    episode_focus: The handbook recommends external visibility to enable other headquarters to learn, limiting access to internal
      users when the issue is specific to the originating HQ or too sensitive to share broadly. Focus on that sharing decision
      and its balance between wider learning and sensitivity; exclude the separate assignment of classification and releasability.
    cues:
      option_words:
        O1: 16
        O2: 15
      real_option: O2
      real_to_mean_other_length: 0.94
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The handbook recommends that lessons be shared externally as much as possible to allow headquarters to learn from each
  other, limiting visibility to internal users when the issue is specific to that headquarters or too sensitive to share more
  broadly.
