case:
  id: DR-CORPUS-NS-15465f76-E3@v1
  title: Choosing a Remedial Action Under Time Pressure
  status: draft
  setting: A fast-evolving military operation or exercise during an abbreviated NATO Lessons Learned Process.
  decider: The Tasking Authority
  agent: The Tasking Authority
  agent_role: decide
  situation: An unexpected issue in a fast-evolving environment needs attention within a short time. Delaying action may allow
    a significant undesirable outcome that could jeopardize priority objectives or hinder an adversary’s progress. Rapid analysis
    has identified potential Remedial Actions, and the Tasking Authority must choose how to proceed. The standard process
    may not allow the issue’s root cause and a Remedial Action to be identified or acted on in time. Full validation may not
    be possible within the available timescale.
  question: What should the Tasking Authority do about selecting a potential Remedial Action under the required timescale?
  options:
    O1:
      do: The Tasking Authority rejects the potential Remedial Action for implementation.
      move: act
      irreversible: false
    O2:
      do: The Tasking Authority approves the potential Remedial Action for implementation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An unexpected issue may need to be addressed in the shortest time possible to avoid a significant undesirable outcome
      that could jeopardize priority objectives or hinder an adversary’s progress.
  - id: F2
    kind: situation
    status: confirmed
    fact: In a fast-evolving environment, the standard NATO Lessons Learned Process may not allow the issue’s root cause and
      Remedial Action to be identified or acted on in a timely manner.
  - id: F3
    kind: situation
    status: confirmed
    fact: An abbreviated process may be tailored to the scenario when quick wins or avoiding or mitigating significant losses
      are of utmost importance.
  - id: F4
    kind: situation
    status: confirmed
    fact: An effective abbreviated process requires a clear understanding and description of the observed issue.
  - id: F5
    kind: situation
    status: confirmed
    fact: Rapid analysis is used to identify the most likely root cause and potential Remedial Actions.
  - id: F6
    kind: situation
    status: assessed
    fact: When several Remedial Actions are identified, the action likely to produce the best outcome within the required
      timescale may not be the optimal solution.
  - id: F7
    kind: situation
    status: confirmed
    fact: A trial-and-error approach may be used, including tasking more than one Action Body to implement potential Remedial
      Actions simultaneously; appropriate criteria should be applied to assess which is best.
  - id: F8
    kind: situation
    status: confirmed
    fact: The abbreviated process requires streamlined decision-making and communication among the Originating Authority,
      Tasking Authority, and Action Body.
  - id: F9
    kind: situation
    status: confirmed
    fact: The process calls for confirmation that the Remedial Action rectified the issue, although full validation may not
      be possible within the timescales.
  - id: F10
    kind: authority
    status: confirmed
    fact: The Tasking Authority is responsible for decisions regarding recommendations and Remedial Actions, committing resources,
      and appointing or tasking one or more Action Bodies.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The abbreviated process is intended for urgent issues where delay risks a significant undesirable outcome and the
      standard process may be too slow; timely action therefore weighs in favor of selecting a potential remedial action.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: When several actions are identified, the stated decision standard is to select the one likely to produce the best
      outcome within the required timescale, even if it is not the optimal solution overall.
  - id: C3
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Selection should rest on a clear description of the issue and rapid analysis of its most likely root cause and potential
      remedies, rather than on urgency alone.
  - id: C4
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Where several potential actions remain, trial and error may be used, but appropriate criteria should guide the assessment
      of which action is best.
  - id: C5
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The abbreviated process calls for confirmation that the action rectified the issue; inability to complete full validation
      within the timescale does not itself prevent timely selection.
  reasoning:
    read: This is a time-sensitive choice under an abbreviated process, not a demand to identify the optimal remedy before
      acting. The trap is either waiting for the standard process when it may be too slow, or treating urgency as a substitute
      for understanding the issue and assessing likely outcomes.
    weighing: The risk of delay supports acting promptly {C1}. The governing selection standard is the action likely to produce
      the best outcome within the required timescale, even if it is not optimal {C2}. That judgment should be grounded in
      a clear issue description and rapid analysis {C3}; where alternatives remain, appropriate criteria can inform comparison
      or trial and error {C4}. Full validation may be unavailable, but confirmation that the issue was rectified is still
      called for {C5}.
    tradecraft: Document the issue, the rapid analysis, the alternatives considered, and why the selected action is expected
      to produce the best outcome within the time available. Use appropriate criteria to assess alternatives, communicate
      the decision and status promptly, and seek confirmation of the result; when the time-sensitive period ends, resume the
      standard process.
    uncertainty: The selection is based on the most likely root cause and expected outcome, not certainty that the action
      is optimal. The result still needs confirmation, and full validation may not be possible within the available timescale.
    handoff: The Tasking Authority holds responsibility for the decision. It should use streamlined communication with the
      Originating Authority and Action Body so the decision can be made and acted on quickly; that communication does not
      displace the Tasking Authority's responsibility.
    tempting_wrong:
      option: O1
      pull: Rejecting the action may seem safer because the analysis is rapid and the remedy may not be optimal or fully validated.
      why_wrong: The abbreviated-process standard accepts that the timely choice may not be optimal and requires confirmation
        rather than full validation within the short timescale; rejecting a plausible timely remedy solely for those reasons
        defeats the process's purpose.
    rejected:
      O1: The Tasking Authority should not reject a potential action merely because the standard process or full validation
        cannot be completed in time, where rapid analysis identifies an action likely to produce the best outcome within the
        required timescale.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Rapid analysis does not support a plausible expectation that the proposed action will address the issue or produce
        a better outcome within the required timescale.
      then: O1
      why: Without a defensible basis for expecting the action to address the issue in time, the abbreviated process's selection
        standard is not met.
    would_not_change:
    - id: noflip1
      if: The action likely to produce the best outcome within the required timescale is not the optimal solution overall.
      why: The abbreviated-process guidance expressly allows selection of the timely best-outcome action even when it may
        not be optimal.
    - id: noflip2
      if: Full validation cannot be completed within the available timescale.
      why: The process still calls for confirmation that the issue was rectified, while recognizing that full validation may
        not be possible within the timescale.
    watch_for:
    - id: watch1
      what: Several potential remedial actions are available for comparison or trial and error.
      favors:
      - O2
      why: The guidance permits trial and error, including simultaneous action by more than one Action Body, provided appropriate
        criteria are used to assess which action is best.
  lesson: In an abbreviated lessons-learned process, choose the action most likely to produce the best outcome within the
    required timescale, even if it is not the optimal solution. Ground the choice in a clear understanding and rapid analysis,
    then confirm the result and return to the standard process when the time-sensitive period ends.
  limits: This reasoning applies to the abbreviated process for urgent issues where the standard process may be too slow.
    It does not remove the need for an adequate issue description, analysis, confirmation, or subsequent full exploration
    and validation through the standard process.
