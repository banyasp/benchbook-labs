case:
  id: DR-OGE-2635-204b-1-flip1@v1
  title: FDIC employee invitation to basketball game [flip]
  status: needs_review
  setting: Federal Deposit Insurance Corporation, contemporary office environment
  decider: FDIC staff member
  agent: FDIC staff member
  agent_role: decide
  situation: A staff member at the FDIC is romantically involved with an accountant employed by a bank that is a member of
    the FDIC system. The bank's Work-Life Balance program distributed two tickets to a professional basketball game to every
    employee in the accountant's division and encouraged them to share the tickets with a family member or friend. The tickets
    were bought by the bank and handed to the accountant without any usage restrictions. The accountant invited the FDIC staff
    member to attend the game, and the invitation appears to be based on personal friendship rather than any official capacity.
  question: How should the FDIC staff member respond to the invitation to the basketball game?
  options:
    O1:
      do: Accept the invitation and attend the basketball game together with the accountant.
      move: act
      irreversible: false
    O2:
      do: Seek a formal ethics advisory opinion before deciding whether to accept the invitation.
      move: ask
      irreversible: false
      to: agency ethics official
    O3:
      do: Politely decline the invitation and not go to the basketball game.
      move: refuse
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The member bank is classified under the ethics rules as a source from which employees may not accept gifts.
  - id: F2
    kind: situation
    status: confirmed
    fact: The FDIC staff member is in a romantic partnership with an accountant employed by the same member bank.
  - id: F3
    kind: situation
    status: confirmed
    fact: Through its Work-Life Balance initiative, the bank gave each employee in the accountant's department two tickets
      to a professional basketball game and suggested they share them with a family member or friend.
  - id: F4
    kind: situation
    status: confirmed
    fact: The bank purchased the tickets and handed them to the accountant without any restrictions on how they might be used.
  - id: F5
    kind: situation
    status: confirmed
    fact: The accountant's invitation to the FDIC staff member appears to stem from personal friendship rather than any official
      capacity.
  - id: F6
    kind: authority
    status: confirmed
    fact: Paragraph (b) of 2635.204 allows an employee to accept a gift when the motivation is a personal relationship instead
      of the employee's official role.
  - id: F7
    kind: authority
    status: confirmed
    fact: Section 2635.201(b) requires evaluating whether a reasonable observer would question the employee's integrity or
      impartiality.
  - id: F8
    kind: capability
    status: confirmed
    fact: The basketball tickets are a non‑cash tangible gift that originated from a party the ethics regulations identify
      as a disallowed provider of gifts.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: partner_relationship
    favors:
    - O3
    weight: weak
    why: Although the invitation is personal, the tickets come from a prohibited source, which outweighs the personal-relationship
      exception.
  - id: C2
    facts:
    - F8
    equity: norm_reciprocity
    favors:
    - O3
    weight: strong
    why: The tickets are a tangible non-cash gift supplied by a disallowed provider, triggering the blanket ban on accepting
      such gifts.
  - id: C3
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Given the prohibited source, a reasonable person would likely question the employee's impartiality, so the gift must
      be refused.
  reasoning:
    read: The FDIC staff member has been invited by a romantic partner, who works for a member bank, to attend a basketball
      game using tickets that the bank distributed as a work-life benefit. The central issue is whether the source prohibition
      overrides the personal-relationship exception.
    weighing: Paragraph (b) of 2635.204 (C1) would normally permit a personal-relationship gift, but the tickets originate
      from a disallowed provider (C2), which creates a direct conflict with the source-prohibition rule. Section 2635.201(b)
      (C3) further indicates that a reasonable observer would doubt the staff member's impartiality because the donor is prohibited.
      Consequently, the prohibitions dominate and the invitation must be declined.
    tradecraft: Document the decline in the staff member's calendar, note the source of the tickets, and retain a brief memo
      citing the source-prohibition rule as the authority for the decision.
    uncertainty: Low; the source prohibition is clear and unambiguous, leaving little room for alternative interpretation.
    handoff: No further agency review is required; the prohibition is self-executing under the ethics regulations.
    tempting_wrong:
      option: O1
      pull: The personal nature of the invitation makes it tempting to accept, especially because the relationship is genuine.
      why_wrong: Accepting would violate the explicit ban on gifts from prohibited sources, creating a perception problem.
    rejected:
      O1: Accepting would breach the source-prohibition rule, regardless of personal motives.
      O2: A written ethics determination is unnecessary because the prohibition is clear; seeking one would only delay the
        required refusal.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip2
      if: If the tickets had been supplied by an approved, non-prohibited source and were not cash equivalents exceeding the
        $20 limit
      then: O1
      why: The gift would fall outside the source prohibition, allowing the personal-relationship exception to apply.
    would_not_change:
    - id: noflip1
      if: If the employee's spouse also worked for the same bank
      why: Paragraph (e)(1) would still permit acceptance because the benefit is not offered because of the employee's official
        position.
    watch_for:
    - id: watch1
      what: any pending regulatory action involving the member bank
      favors:
      - O3
      why: Even a personal-relationship gift could appear improper if the bank has matters before the FDIC, raising a perception
        issue under §2635.201(b).
  lesson: When a gift comes from a source that ethics rules label as prohibited, the employee must decline it, even if the
    gift is motivated by a personal relationship, to avoid any appearance of compromised impartiality.
  limits: This guidance does not apply when the donor is an approved source, the gift is non-tangible, or the value is below
    the cash-gift threshold, and it assumes no pending supervisory actions that could heighten perception concerns.
