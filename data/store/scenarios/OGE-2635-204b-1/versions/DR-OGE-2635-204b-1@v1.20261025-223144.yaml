case:
  id: DR-OGE-2635-204b-1@v1
  title: FDIC Employee Basketball Game Invitation
  status: draft
  setting: Federal Deposit Insurance Corporation office, present day
  decider: FDIC employee
  agent: Ethics‑assistant AI
  agent_role: advise
  situation: An FDIC employee is in a romantic relationship with an accountant who works for a member bank. The bank's work‑life
    balance program distributes two tickets to a professional basketball game to each employee and encourages them to invite
    a family member or friend. The accountant offers the FDIC employee the tickets, and the invitation is motivated by the
    personal friendship rather than the employee's official position. The employee must determine whether accepting the tickets
    would be permissible under the personal‑relationship exception to the gift rules. The relevant regulations allow acceptance
    of gifts given because of a personal relationship, provided certain factors are met. The employee also must consider whether
    a reasonable person would question their integrity or impartiality if they accepted the tickets.
  question: What should the FDIC employee do regarding the basketball game invitation?
  options:
    O1:
      do: Request a written ethics determination before deciding.
      move: ask
      irreversible: false
      to: agency ethics official
    O2:
      do: Accept the invitation to the basketball game.
      move: act
      irreversible: false
    O3:
      do: Decline the invitation to avoid appearance of impropriety.
      move: refuse
      irreversible: false
    O4:
      do: Accept only if the employee purchases the tickets.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The FDIC employee is dating an accountant employed by a member bank.
  - id: F2
    kind: situation
    status: confirmed
    fact: The bank's work‑life balance program gave each employee two basketball game tickets and urged them to invite a family
      member or friend.
  - id: F3
    kind: situation
    status: confirmed
    fact: The invitation to the FDIC employee was motivated by personal friendship, not the employee's official position.
  - id: F4
    kind: authority
    status: confirmed
    fact: Gifts based on a personal relationship may be accepted if the relationship is personal and the giver personally
      pays for the gift.
  - id: F5
    kind: authority
    status: confirmed
    fact: Under the personal‑relationship exception, the FDIC employee may accept the invitation.
  - id: F6
    kind: capability
    status: confirmed
    fact: An employee should decline a permissible gift if acceptance would cause a reasonable person to question the employee's
      integrity or impartiality.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    - F5
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The regulation’s personal‑relationship exception (2635.204(b)) permits acceptance when the gift is motivated by a
      personal friendship and the giver pays for it; the facts match this exception.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Even when a gift is permissible, employees should decline only if a reasonable person would question integrity; here
      the personal nature of the invitation means no reasonable appearance of impropriety.
  - id: C3
    facts:
    - F2
    - F4
    equity: norm_reciprocity
    favors:
    - O2
    weight: weak
    why: The bank’s work‑life program distributes tickets to all staff for personal use, indicating the gift is a routine,
      non‑targeted benefit rather than a special favor.
  reasoning:
    read: The FDIC employee is invited by a romantic partner who works for a member bank to use two basketball tickets that
      the bank’s work‑life program gave to its staff for personal friends. The invitation stems from personal friendship,
      not the employee’s official role.
    weighing: The source’s own example (2635.204(b) Example 1) states that such an invitation is permissible because the personal‑relationship
      exception applies. The regulation also reminds employees to decline only when a reasonable person would doubt integrity;
      here the personal motive and the bank’s blanket distribution of tickets defeat that concern. Thus the balance tips toward
      acceptance.
    tradecraft: The employee should accept the tickets, document the acceptance in the agency’s gift‑log, and note the personal‑relationship
      justification per §2635.201(b). No further agency approval is required.
    uncertainty: Minimal; the regulation directly addresses the scenario.
    handoff: The decision can be made by the employee alone because the rule is clear; no ethics‑official determination is
      needed.
    tempting_wrong:
      option: O3
      pull: Avoiding any appearance of favoritism is a common caution.
      why_wrong: The rule expressly allows acceptance when the gift is personal; declining would be unnecessary and could
        be seen as over‑cautious.
    rejected:
      O1: A written ethics determination is unnecessary because the regulation already authorizes acceptance.
      O3: The appearance‑of‑impropriety test is satisfied; the gift is personal, not official.
      O4: Purchasing the tickets would defeat the purpose of the bank’s program and is not required by the exception.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The invitation were motivated by the employee’s official position rather than personal friendship
      then: O3
      why: The personal‑relationship exception would not apply, and the gift would be from a prohibited source, requiring
        decline.
    - id: flip2
      if: The bank’s interest were directly affected by the employee’s official duties (e.g., pending supervisory action)
      then: O3
      why: A reasonable person could question impartiality, triggering the appearance‑of‑impropriety test.
    would_not_change:
    - id: noflip1
      if: The ticket’s market value exceeds $20
      why: The personal‑relationship exception overrides the $20 limit.
    watch_for:
    - id: watch1
      what: If the bank were identified as a prohibited source under §2635.202(a) and the gift were not clearly personal
      favors:
      - O3
      why: Even a personal‑relationship gift from a prohibited source may be disallowed if the motive is not personal.
  lesson: When a gift is given because of a genuine personal relationship and the giver pays for it, the personal‑relationship
    exception permits acceptance, provided no reasonable person would doubt the employee’s impartiality.
  limits: This reasoning applies only when the personal motive is clear and the gift is not tied to the employee’s official
    duties or to a pending agency matter; it does not extend to gifts of cash or investment interests.
