case:
  id: DR-OGE-2635-204b-1-ro2@v1
  title: FDIC employee invitation to basketball game
  status: draft
  setting: Federal Deposit Insurance Corporation, present day
  decider: FDIC employee
  agent: FDIC employee
  agent_role: decide
  situation: An FDIC employee is in a romantic relationship with an accountant who works for a member bank. The bank's Work‑Life
    Balance program gave each employee in the accountant's division two tickets to a professional basketball game and encouraged
    them to invite a family member or friend. The tickets were purchased by the bank and handed to the accountant without
    any reservation, allowing the accountant to decide how to use them. The accountant invited the FDIC employee to attend
    the game, and the invitation appears to be motivated by personal friendship rather than the employee's official position.
  question: What should the FDIC employee do regarding the invitation to the basketball game?
  options:
    O1:
      do: Request a written ethics determination before accepting the invitation.
      move: ask
      irreversible: false
      to: agency ethics official
    O2:
      do: Accept the invitation and attend the basketball game with the accountant.
      move: act
      irreversible: false
    O3:
      do: Decline the invitation and not attend the basketball game.
      move: refuse
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The FDIC employee is dating an accountant employed by a member bank.
  - id: F2
    kind: situation
    status: confirmed
    fact: The bank's Work‑Life Balance program gave each employee in the accountant's division two basketball game tickets
      and urged them to invite a family member or friend.
  - id: F3
    kind: situation
    status: confirmed
    fact: The tickets were purchased by the member bank and given without reservation to the accountant to use as desired.
  - id: F4
    kind: situation
    status: confirmed
    fact: The invitation to the FDIC employee was motivated by personal friendship rather than the employee's official position.
  - id: F5
    kind: authority
    status: confirmed
    fact: Paragraph (b) of 2635.204 permits an employee to accept a gift when it is motivated by a personal relationship rather
      than the employee's position.
  - id: F6
    kind: authority
    status: confirmed
    fact: Section 2635.201(b) requires consideration of whether acceptance would cause a reasonable person to question the
      employee's integrity or impartiality.
  - id: F7
    kind: capability
    status: confirmed
    fact: The basketball tickets are a non‑cash tangible gift and not from a prohibited source.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Paragraph (b) of 2635.204 expressly permits acceptance of a gift when it is motivated by a personal relationship
      rather than the employee's official position, and the facts show the invitation stems from personal friendship.
  - id: C2
    facts:
    - F7
    equity: norm_reciprocity
    favors:
    - O2
    weight: weak
    why: The tickets are a non‑cash tangible gift and the bank is not a prohibited source, so the basic definition of a gift
      does not bar acceptance.
  - id: C3
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Section 2635.201(b) requires that a reasonable person would not question the employee’s integrity or impartiality;
      the personal‑relationship context satisfies that standard.
  - id: C4
    facts:
    - F1
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The employee’s personal relationship with the accountant gives a legitimate basis for accepting a social invitation
      without implying official influence.
  reasoning:
    read: The FDIC employee is asked by a romantic partner, who works for a member bank, to attend a basketball game using
      tickets the bank distributed as a work‑life benefit. The key issue is whether the invitation is a personal‑relationship
      gift or a business‑related inducement.
    weighing: Applying paragraph (b) of 2635.204 (C1) shows the gift is permissible because it is motivated by personal friendship.
      Section 2635.201(b) (C3) confirms that a reasonable observer would not doubt the employee’s impartiality. The gift’s
      form (non‑cash, non‑prohibited source) (C2) further removes any barrier. While the employee’s relationship with the
      accountant (C4) is noted, it does not create a conflict because the invitation is not tied to the employee’s official
      duties.
    tradecraft: Record the acceptance in the employee’s personal calendar, note the source of the tickets, and retain a brief
      memo citing paragraph (b) of 2635.204 as the authority for future reference.
    uncertainty: Minimal; the regulation’s example directly mirrors the facts, leaving little ambiguity.
    handoff: No further agency review is required; the employee may decide alone because the exception is self‑executing under
      the regulation.
    tempting_wrong:
      option: O1
      pull: Seeking a written ethics determination could be seen as over‑cautious and unnecessary, given the clear exception.
      why_wrong: The regulation provides a definitive exception; requesting a determination would delay a permissible action
        without adding protective value.
    rejected:
      O1: A written ethics determination is not required because paragraph (b) already authorizes acceptance.
      O3: Declining would ignore the explicit exception that allows personal‑relationship gifts.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the invitation were motivated by the employee’s official position or by the bank’s desire to influence FDIC actions
      then: O3
      why: Paragraph (b) would no longer apply; the gift would be a business‑related inducement and must be declined.
    - id: flip2
      if: the tickets were provided by a prohibited source or were cash equivalents exceeding $20
      then: O3
      why: The gift would fall under the general prohibitions of §2635.202 and could not be accepted.
    would_not_change:
    - id: noflip1
      if: the employee’s spouse also works for the same bank
      why: Paragraph (e)(1) still permits acceptance because the benefit is not offered because of the employee’s official
        position.
    watch_for:
    - id: watch1
      what: any pending regulatory action involving the member bank
      favors:
      - O3
      why: Even a personal‑relationship gift could appear improper if the bank has matters before the FDIC, raising a perception
        issue under §2635.201(b).
  lesson: When a gift is clearly motivated by a personal relationship and not by the employee’s official duties, paragraph
    (b) of 2635.204 allows acceptance, provided the gift is non‑cash, not from a prohibited source, and would not cause a
    reasonable person to question impartiality.
  limits: This reasoning does not apply if the gift is tied to pending agency actions, if the source is a prohibited entity,
    or if the gift is cash or exceeds the $20 cash‑gift limit.
