case:
  id: DR-OGE-2635-204b-1-restyle1@v1
  title: FDIC employee invitation to basketball game [restyle]
  status: needs_review
  setting: Office of the Comptroller of the Currency, present day
  decider: Regional compliance officer
  agent: Regional compliance officer
  agent_role: decide
  situation: A compliance officer at the OCC is in a romantic relationship with a financial analyst employed by a chartered
    bank. The bank's employee wellness program gave each staff member in the analyst's division two tickets to a major-league
    baseball game and encouraged them to invite a family member or friend. The tickets were purchased by the bank and handed
    to the analyst without reservation, allowing the analyst to decide how to use them. The analyst invited the OCC officer
    to attend the game, and the invitation appears to be motivated by personal friendship rather than the officer's official
    capacity.
  question: How should the OCC officer respond to the invitation to the baseball game?
  options:
    O1:
      do: Accept the invitation and attend the baseball game with the analyst.
      move: act
      irreversible: false
    O2:
      do: Request a written ethics determination before accepting the invitation.
      move: ask
      irreversible: false
      to: agency ethics official
    O3:
      do: Decline the invitation and not attend the baseball game.
      move: refuse
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The OCC officer is dating a financial analyst employed by a chartered bank.
  - id: F2
    kind: situation
    status: confirmed
    fact: The chartered bank's employee wellness program allocated two baseball game tickets to each employee in the analyst's
      division and suggested they invite a relative or acquaintance.
  - id: F3
    kind: situation
    status: confirmed
    fact: The tickets were purchased by the chartered bank and delivered to the analyst without any reservation, permitting
      the analyst to use them as desired.
  - id: F4
    kind: situation
    status: confirmed
    fact: The analyst's invitation to the OCC officer was driven by personal friendship rather than the officer's official
      role.
  - id: F5
    kind: authority
    status: confirmed
    fact: Paragraph (b) of 2635.204 authorizes an employee to accept a gift when the motivation is a personal relationship
      rather than the employee's official position.
  - id: F6
    kind: authority
    status: confirmed
    fact: Section 2635.201(b) mandates evaluating whether a reasonable observer would question the employee's integrity or
      impartiality upon acceptance.
  - id: F7
    kind: capability
    status: confirmed
    fact: The baseball tickets constitute a non-cash tangible gift and do not originate from a prohibited source.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: Because paragraph (b) of 2635.204 specifically allows an employee to receive a gift that originates from a personal
      relationship instead of official duties, and the invitation clearly reflects a personal friendship, the acceptance is
      permissible.
  - id: C2
    facts:
    - F7
    equity: norm_reciprocity
    favors:
    - O1
    weight: weak
    why: Since the tickets are a tangible, non-cash item and the chartered bank is not listed as a prohibited source, the
      statutory definition of a prohibited gift does not apply.
  - id: C3
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Section 2635.201(b) calls for an assessment of whether a reasonable person would doubt the officer's impartiality;
      given the personal-relationship context, such doubt is unlikely.
  - id: C4
    facts:
    - F1
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The officer's romantic connection to the analyst provides a valid personal basis for attending a social event, without
      suggesting any official influence.
  reasoning:
    read: The OCC compliance officer receives an invitation from a romantic partner employed by a chartered bank to attend
      a baseball game using tickets that the bank issued as part of its wellness program. The central question is whether
      the invitation constitutes a personal-relationship gift or a business-related inducement.
    weighing: Applying paragraph (b) of 2635.204 (C1) indicates the gift is allowable since it stems from personal friendship.
      Section 2635.201(b) (C3) reinforces that a reasonable observer would not question the officer's impartiality. The nature
      of the gift—non-cash and from a non-prohibited source (C2)—eliminates additional concerns. Although the officer's relationship
      with the analyst (C4) is acknowledged, it does not generate a conflict because the invitation is unrelated to official
      responsibilities.
    tradecraft: Log the acceptance in the officer's personal schedule, document the ticket source, and keep a short memorandum
      referencing paragraph (b) of 2635.204 as the governing authority.
    uncertainty: Very low; the regulatory example aligns closely with the facts, providing little uncertainty.
    handoff: No additional OCC review is necessary; the officer can make the decision independently because the exception
      operates automatically under the regulation.
    tempting_wrong:
      option: O2
      pull: Seeking a formal ethics opinion might be viewed as excessive and unnecessary given the clear statutory exception.
      why_wrong: The regulation already supplies a definitive exemption; requesting an opinion would only postpone a permissible
        action without enhancing protection.
    rejected:
      O2: A formal ethics opinion is not required because paragraph (b) already authorizes acceptance.
      O3: Declining would disregard the explicit statutory exception that permits personal-relationship gifts.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: if the invitation were driven by the officer's official capacity or by the bank's intent to sway OCC decisions
      then: O3
      why: Paragraph (b) would cease to apply; the gift would then be a business-related inducement and therefore must be
        refused.
    - id: flip2
      if: if the tickets originated from a prohibited source or represented cash equivalents above $20
      then: O3
      why: The gift would fall under the general prohibitions of §2635.202 and thus could not be accepted.
    would_not_change:
    - id: noflip1
      if: if the officer's spouse were also employed by the same chartered bank
      why: Paragraph (e)(1) still allows acceptance because the benefit is not provided due to the officer's official position.
    watch_for:
    - id: watch1
      what: any pending OCC regulatory matter concerning the chartered bank
      favors:
      - O3
      why: Even a personal-relationship gift could seem improper if the bank has pending matters before the OCC, creating
        a perception problem under §2635.201(b).
  lesson: If a gift is unmistakably motivated by a personal relationship rather than official duties, paragraph (b) of 2635.204
    permits acceptance, provided the gift is non-cash, originates from a permissible source, and would not lead a reasonable
    observer to question the employee's impartiality.
  limits: The analysis does not apply when the gift is linked to pending agency actions, when the source is prohibited, or
    when the gift is cash or exceeds the $20 cash-gift threshold.
