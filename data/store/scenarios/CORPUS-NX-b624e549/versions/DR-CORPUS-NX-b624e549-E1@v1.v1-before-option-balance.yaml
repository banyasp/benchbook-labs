case:
  id: DR-CORPUS-NX-b624e549-E1@v1
  title: Defining Timely Congressional Notice
  status: draft
  setting: United States, during post-Iran-Contra congressional oversight negotiations between the administration and Congress.
  decider: The administration
  agent: The administration
  agent_role: decide
  situation: Congress has intelligence oversight committees, and the intelligence community is required by law to keep them
    fully and currently informed of intelligence activities. The law also provides for limited notification to designated
    congressional leaders in extraordinary circumstances and requires timely notice for certain foreign-country activities
    when prior notice was not given. Congress learned of the Iran-Contra covert action finding more than a year after it existed.
    The administration and Congress are negotiating specific commitments defining timely notice, and the negotiations are
    substantially completed. The President has committed to developing internal rules, while the administration is also reviewing
    its management of covert activity.
  question: What should the administration do about formalizing specific commitments under existing law that define timely
    congressional notice?
  options:
    O1:
      do: The administration adopts internal commitments defining timely congressional notice without formalizing them in
        law.
      move: partial
      irreversible: false
    O2:
      do: The administration rejects commitments under existing law and leaves timely congressional notice undefined.
      move: act
      irreversible: false
    O3:
      do: The administration adopts commitments under existing law defining timely congressional notice for covered activities.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Both houses of Congress established intelligence oversight committees in 1976 and 1977 to monitor significant intelligence
      activities and expenditures.
  - id: F2
    kind: authority
    status: confirmed
    fact: The intelligence community is required by law to keep the intelligence committees fully and currently informed of
      intelligence activities.
  - id: F3
    kind: authority
    status: confirmed
    fact: Under the Hughes-Ryan Amendment, the President must find that each covert action is important to national security
      before it can be initiated.
  - id: F4
    kind: authority
    status: confirmed
    fact: In extraordinary circumstances affecting vital United States interests, the President may limit notification to
      designated congressional leaders.
  - id: F5
    kind: authority
    status: confirmed
    fact: The intelligence committees must be fully informed in a timely fashion of covered foreign-country activities for
      which prior notice was not given, and the President must state the reasons for not giving prior notice.
  - id: F6
    kind: situation
    status: confirmed
    fact: Congress was not notified for well over a year that the Iran-Contra covert action finding existed.
  - id: F7
    kind: situation
    status: assessed
    fact: Negotiations were substantially completed to develop specific commitments defining timely notice, amid efforts to
      rebuild trust and confidence between the committees and the administration.
  - id: F8
    kind: situation
    status: confirmed
    fact: The President had issued a letter to Congress committing to develop rules within the administration.
  - id: F9
    kind: capability
    status: confirmed
    fact: The administration was improving internal management and stated that it needed to determine whether proposed covert
      activity was doable and lawful before the President made a finding.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The law requires full and current reporting and timely notice for covered activities when prior notice was not given.
      The administration and Congress were negotiating specific commitments to define timely notice within the law, supporting
      a defined commitment rather than leaving the timing unresolved.
  - id: C2
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Congress learned of the Iran-Contra finding more than a year after it existed. Specific commitments were part of
      an effort to rebuild trust and confidence between the committees and the administration.
  - id: C3
    facts:
    - F8
    - F9
    equity: oversight_candor
    favors:
    - O3
    weight: weak
    why: The President had committed to developing internal rules, and the administration was improving its management of
      covert activity. The administration also said it needed to know that proposed activity was doable and lawful before
      a finding was made. These internal controls complement, but do not replace, defined notice commitments.
  - id: C4
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The law already provides for limited notification in extraordinary circumstances and requires reasons when prior
      notice is not given for covered activities. Specific commitments can define timely notice while operating within those
      statutory provisions.
  reasoning:
    read: 'This is not a choice between oversight and conducting covert activity: the law already requires reporting, allows
      limited notification in extraordinary circumstances, and requires timely notice in specified cases. The central risk
      is treating the undefined timing of notice as adequate after Congress learned of a finding more than a year late, even
      as the administration seeks to restore trust.'
    weighing: The legal reporting duties and the prior delay favor specific commitments defining timely notice {C1}. The stated
      effort to rebuild trust after the delay reinforces that course {C2}. Internal management improvements and the President's
      commitment to develop rules support the same direction, but do not substitute for notice commitments {C3}. The commitments
      should remain within the statutory framework, including its extraordinary-circumstances provision {C4}.
    tradecraft: Adopt and communicate specific commitments defining timely notice for covered activities under existing law.
      Keep the commitments consistent with the statutory notification limits and requirements to state reasons when prior
      notice is not given; coordinate the commitments with the administration's internal management review. This does not
      require including operational details of covert activity.
    uncertainty: The source does not supply the specific timing rule or the final terms of the negotiations. It says the negotiations
      were substantially completed and that internal rules were being developed, so the precise content and implementation
      remain unspecified.
    handoff: Continue the administration's work with Congress and its intelligence oversight committees, since the commitments
      concern timely notice to those committees and the stated purpose includes rebuilding trust. The administration should
      also align the commitments with its internal management improvements.
    tempting_wrong:
      option: O1
      pull: The President had committed to developing internal rules, which could make internal commitments without formalizing
        them under existing law seem sufficient.
      why_wrong: The source links the trust-rebuilding effort to specific commitments defining timely notice within the law.
        Internal management rules alone do not resolve the stated need to define that notice.
    rejected:
      O1: Internal rules were part of the administration's response, but the stated negotiations were for specific commitments
        defining timely notice within the law, so internal commitments alone are not the endorsed course.
      O2: Leaving timely notice undefined would not address the statutory reporting requirements, the delay of more than a
        year, or the stated effort to rebuild trust.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed commitments could not be made consistent with the statutory notification provisions, including the
        extraordinary-circumstances limitation.
      then: O1
      why: The commitments would need revision before they could be adopted under existing law; as a temporary fallback, internal
        rules could be used while preserving the statutory limits.
    would_not_change:
    - id: noflip1
      if: The President's letter committing to develop internal rules is treated as an adequate response by itself.
      why: The letter does not remove the stated need for specific commitments defining timely notice or the effort to rebuild
        trust after the delay.
    watch_for:
    - id: watch1
      what: Whether the specific commitments define timely notice while preserving the statutory notification exceptions and
        the requirement to state reasons when prior notice was not given.
      favors:
      - O3
      why: That would implement the stated objective within the existing legal framework.
  lesson: When law requires timely reporting but leaves its timing undefined, specific commitments can make the duty more
    workable and help restore oversight trust after a serious delay. Internal controls matter, but they should complement—not
    replace—clear notice commitments within the law.
  limits: This reasoning concerns defining timely congressional notice under the existing intelligence oversight framework.
    It does not resolve what precise timetable the commitments should set or address the operational merits of any covert
    activity.
