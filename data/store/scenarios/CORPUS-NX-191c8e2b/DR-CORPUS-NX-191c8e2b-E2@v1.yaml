case:
  id: DR-CORPUS-NX-191c8e2b-E2@v1
  title: Leave Before the War Ends or Wait
  status: draft
  setting: Carnia, Italy, before the armistice during the war; no institution identified.
  decider: The Individual
  agent: The Individual
  agent_role: decide
  situation: The Individual does not know how she will get out. Snow came a month early, and crossing the Swiss frontier is
    no longer considered an option. Carnia is under Nazi control, while a journey to Yugoslavia is described as a poor prospect.
    Leaving north and leaving south are both possibilities. Staying until the war ends before the Nazis return in force is
    also under consideration.
  question: 'What should the Individual do: depart north, depart south, or stay until the war ends?'
  options:
    O1:
      do: The Individual departs south toward the advancing Allied forces.
      move: act
      irreversible: false
    O2:
      do: The Individual stays in Carnia until the war ends.
      move: act
      irreversible: false
    O3:
      do: The Individual departs north alongside the retreating Nazi forces.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The Individual does not know how she will get out.
  - id: F2
    kind: situation
    status: assessed
    fact: Snow came a month early that year.
  - id: F3
    kind: situation
    status: assessed
    fact: Crossing the Swiss frontier was considered out of the picture because of the snow.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Carnia was described as solidly under Nazi control.
  - id: F5
    kind: situation
    status: assessed
    fact: Yugoslavia was 150 miles away, and a journey there was considered a poor prospect.
  - id: F6
    kind: situation
    status: assessed
    fact: One possibility was to go north with the Nazis when they retreated from Italy.
  - id: F7
    kind: situation
    status: assessed
    fact: Another possibility was to go south and meet the Allies as they advanced.
  - id: F8
    kind: situation
    status: assessed
    fact: The Individual regarded the end of the war before the Nazis returned in force as the best possibility.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The early snow rules out the Swiss crossing, and Carnia is under Nazi control while a journey to Yugoslavia is a
      poor prospect. These constraints make the available choices narrower, though they do not establish that either north
      or south is impossible.
  - id: C2
    facts:
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O1
    - O3
    weight: weak
    why: Going north with the retreating Nazis and going south to meet the advancing Allies are both acknowledged as possibilities,
      and neither is described as bad. The account does not give a reason to prefer one departure direction over the other.
  - id: C3
    facts:
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The Individual explicitly identifies the war ending before the Nazis return in force as the best possibility, which
      supports staying rather than departing now.
  reasoning:
    read: 'The Individual faces constrained and uncertain choices: the snow removes the Swiss crossing, and the direct prospect
      of reaching Yugoslavia is poor. The trap is to treat the two remaining departure possibilities as requiring an immediate
      choice; the Individual also considers waiting and judges it best.'
    weighing: The north and south departures remain possible, but the Individual calls neither bad and gives no comparative
      reason to choose between them {C2}. The stated preference is instead to have the war end before the Nazis return in
      force {C3}; the unavailable Swiss crossing and poor Yugoslavia prospect add context but do not prove that either listed
      departure is impossible {C1}. The balance depends on whether the war ends before that return.
    tradecraft: As a decision practice, record the preference for waiting, the uncertainty behind it, and the condition on
      which it depends; revisit the choice if that condition materially changes. This does not determine or prescribe any
      route.
    uncertainty: The Individual says she does not know how she will get out and cannot give assurance. The account does not
      establish how the timing will unfold or compare the risks of the north and south departures.
    handoff: The Individual makes this judgment herself; no institution or other decision authority is identified.
    tempting_wrong:
      option: O1
      pull: Going south offers the prospect of meeting the advancing Allies.
      why_wrong: That prospect makes departure a plausible option, but the Individual does not rank it above waiting, which
        she calls the best possibility.
    rejected:
      O1: The Individual considers going south possible, but chooses the prospect of the war ending before the Nazis return
        in force as best.
      O3: The Individual considers going north possible, but chooses the prospect of the war ending before the Nazis return
        in force as best.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible reassessment made departure south materially safer and more feasible than waiting.
      then: O1
      why: Going south is a possible course, but its safety is not compared with waiting; a substantial change in that comparison
        could alter the choice.
    would_not_change:
    - id: noflip1
      if: Going north and going south remain possible, without a new reason to prefer either over waiting.
      why: The Individual acknowledges both departures as possibilities and still identifies the end of the war before the
        Nazis return in force as best.
    watch_for:
    - id: watch1
      what: Whether the war ends before the Nazis return in force.
      favors:
      - O2
      why: This is the condition the Individual identifies as making waiting the best possibility.
  lesson: When immediate alternatives are possible but uncertain, do not mistake availability for a reason to act. Compare
    them with waiting, and make explicit which change in circumstances would alter the preferred course.
  limits: This reasoning reflects the Individual's stated judgment in a specific wartime situation, not a general rule that
    waiting is safer than departure. The account supplies no detailed comparison of route risks or assurance that waiting
    will succeed.
