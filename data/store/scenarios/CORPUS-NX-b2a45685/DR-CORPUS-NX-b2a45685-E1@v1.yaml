case:
  id: DR-CORPUS-NX-b2a45685-E1@v1
  title: Shaping PRC Cyber-Espionage Policy
  status: draft
  setting: United States–China relations, after Operation Aurora; U.S. administration.
  decider: The U.S. administration
  agent: The U.S. administration
  agent_role: decide
  situation: After Operation Aurora, the U.S. administration faced a policy choice concerning PRC cyber-espionage. Ongoing
    cyber-espionage against the United States was characterized as unpleasant but tolerable. Cyber-espionage units stealing
    intellectual property for Chinese commercial benefit were characterized as intolerable, with potential to damage bilateral
    relations. The administration could seek to shape activity through engagement and a commercial-gain boundary, or pursue
    deterrence of cyber-espionage generally.
  question: 'What should the U.S. administration do about PRC cyber-espionage after Operation Aurora: seek to shape it through
    engagement and a commercial-gain boundary, or pursue general deterrence?'
  options:
    O1:
      do: The U.S. administration engages Beijing publicly and privately to deter PRC cyber-espionage generally, without a
        commercial-gain distinction.
      move: act
      irreversible: false
    O2:
      do: The U.S. administration engages Beijing publicly and privately to shape PRC cyber-espionage and set a boundary against
        commercial gain.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The policy issue arose after Operation Aurora.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Ongoing cyber-espionage activities against the United States were assessed as unpleasant.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Ongoing cyber-espionage activities against the United States were assessed as tolerable.
  - id: F4
    kind: situation
    status: assessed
    fact: PRC cyber-espionage units were stealing intellectual property.
  - id: F5
    kind: situation
    status: assessed
    fact: The intellectual property theft was for the benefit of Chinese commerce.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Cyber-espionage for the benefit of Chinese commerce was assessed as intolerable.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Commercial cyber-espionage could damage bilateral relations.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The administration treated ongoing cyber-espionage against the United States as unpleasant but tolerable, supporting
      a calibrated effort to shape activity rather than general deterrence.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Commercially beneficial intellectual-property theft was assessed as intolerable and capable of damaging bilateral
      relations, supporting a specific boundary against that activity.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: A commercial-gain boundary matched the activity the administration sought to make intolerable, while engagement was
      intended to shape rather than simply deter PRC cyber-espionage.
  reasoning:
    read: The choice is not between opposing all PRC cyber-espionage and accepting all of it. The administration distinguished
      activity it regarded as unpleasant but tolerable from commercial intellectual-property theft it regarded as intolerable;
      the trap is treating those different assessments as if they called for the same response.
    weighing: 'The stated balance favors {O2}: the administration sought to shape activity through engagement because general
      cyber-espionage was tolerable, while commercial theft could damage bilateral relations and warranted a defined boundary.
      The balance depends on preserving that distinction between the two categories.'
    tradecraft: State the distinction clearly in policy communications and records, and document the assessments supporting
      the boundary and the decision to use engagement. Reassess those judgments if the relevant activity or its consequences
      change.
    uncertainty: The source gives the administration's purpose and the agreement's commercial-gain pledge, but does not establish
      how effective engagement would be or specify how the pledge would be monitored or enforced.
    handoff: The U.S. administration is the decision-maker in this scenario. The source does not identify a separate approval
      authority or specify additional participants.
    tempting_wrong:
      option: O1
      pull: General deterrence may seem like the clearest response to cyber-espionage that is unpleasant.
      why_wrong: 'It fails to follow the stated distinction: the administration regarded ongoing espionage as tolerable and
        identified commercial theft, with its risk to bilateral relations, as the intolerable category.'
    rejected:
      O1: The administration chose shaping through engagement and a commercial-gain boundary rather than general deterrence,
        because it treated ongoing espionage as tolerable but commercial theft as intolerable.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The administration assessed that ongoing PRC cyber-espionage generally was intolerable, rather than unpleasant but
        tolerable.
      then: O1
      why: That changed assessment would remove the source's stated basis for limiting the response to shaping activity and
        a commercial-gain boundary.
    would_not_change:
    - id: noflip1
      if: Ongoing cyber-espionage remains unpleasant but tolerable, while commercial-gain theft remains the activity assessed
        as intolerable.
      why: That preserves the distinction on which the administration's choice of engagement and a commercial-gain boundary
        rests.
    watch_for:
    - id: watch1
      what: Whether cyber-espionage is for the benefit of Chinese commerce.
      favors:
      - O2
      why: Commercial benefit is the stated criterion distinguishing the intolerable activity from espionage the administration
        regarded as tolerable.
  lesson: When a source distinguishes tolerable conduct from a narrower category it regards as intolerable, a proportionate
    policy can focus engagement and a clear boundary on that category rather than treating all conduct alike. The distinction
    should guide both the decision and later reassessment.
  limits: This reasoning applies to the policy distinction described after Operation Aurora; it does not establish that engagement
    will succeed or determine how any cyber activity should be conducted. It also does not resolve cases where the activity's
    purpose or its effects on bilateral relations are assessed differently.
  library:
    domain: cyber-policy
    family: CORPUS-NX-b2a45685
    source: https://www.cia.gov/resources/csi/static/1ffdaa0a565a04f3ef14461ef6a192f3/Article_Shape_or_Deter_Cyber-Espionage.pdf
    episode_focus: The decision point is whether to seek to shape Chinese activity through engagement and a defined commercial-espionage
      boundary, rather than try to deter cyber espionage generally. The article presents intelligence collection as unpleasant
      but tolerable and commercial IP theft as intolerable because it could damage bilateral relations; exclude operational
      methods of espionage or cyber disruption.
