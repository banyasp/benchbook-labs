case:
  id: DR-CORPUS-NX-b2a45685-NX-0bc9fb24-E1@v1
  title: Drawing Limits on Cyber-Espionage
  status: draft
  setting: U.S.-China policy engagement after Operation Aurora; the U.S. administration and Beijing.
  decider: The U.S. administration
  agent: The U.S. administration
  agent_role: decide
  situation: After Operation Aurora, the U.S. administration faced a policy choice about PRC cyber-espionage. It was engaging
    Beijing through public and private channels, with an approach aimed at shaping conduct rather than deterring it. State
    intelligence collection was viewed as unpleasant but tolerable, while theft of intellectual property for Chinese commercial
    benefit was treated as intolerable. The administration also had to account for the possibility that commercial IP theft
    would damage bilateral relations.
  question: What should the U.S. administration do in its engagement with Beijing to distinguish state intelligence collection
    from commercial-gain IP theft and communicate those limits?
  options:
    O1:
      do: The U.S. administration should use public and private engagement with Beijing, permitting both state intelligence
        collection and commercial-gain IP theft.
      move: act
      irreversible: false
    O2:
      do: The U.S. administration should use public and private engagement with Beijing, prohibiting both state intelligence
        collection and commercial-gain IP theft.
      move: act
      irreversible: false
    O3:
      do: The U.S. administration should use public and private engagement with Beijing, tolerating state intelligence collection
        and prohibiting commercial-gain IP theft.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: After Operation Aurora, the U.S. administration began public engagement with Beijing.
  - id: F2
    kind: situation
    status: confirmed
    fact: After Operation Aurora, the U.S. administration began private engagement with Beijing.
  - id: F3
    kind: situation
    status: confirmed
    fact: The engagement was intended to shape PRC cyber-espionage activities rather than deter them.
  - id: F4
    kind: situation
    status: assessed
    fact: Ongoing cyber-espionage against the United States was regarded as unpleasant but tolerable.
  - id: F5
    kind: situation
    status: assessed
    fact: Cyber-espionage units stealing intellectual property for the benefit of Chinese commerce were regarded as intolerable.
  - id: F6
    kind: situation
    status: assessed
    fact: Commercially oriented cyber-espionage was assessed as capable of damaging bilateral relations.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: escalation_control
    favors:
    - O3
    weight: strong
    why: The engagement was meant to shape PRC cyber-espionage conduct rather than deter it, supporting a calibrated distinction
      rather than a blanket prohibition.
  - id: C2
    facts:
    - F4
    equity: security_risk
    favors:
    - O1
    - O3
    weight: strong
    why: Ongoing cyber-espionage against the United States was regarded as unpleasant but tolerable, so the source did not
      endorse prohibiting state intelligence collection as such.
  - id: C3
    facts:
    - F5
    equity: complicity_risk
    favors:
    - O2
    - O3
    weight: strong
    why: The source drew a firm boundary around cyber-espionage that stole intellectual property for Chinese commercial benefit,
      treating that conduct as intolerable.
  - id: C4
    facts:
    - F6
    equity: partner_relationship
    favors:
    - O2
    - O3
    weight: weak
    why: Commercially oriented cyber-espionage was assessed as capable of damaging bilateral relations, reinforcing the case
      for communicating a limit on that conduct.
  reasoning:
    read: 'This is a choice about distinguishing conduct, not prohibiting cyber-espionage across the board: the administration
      sought to shape behavior through public and private engagement, viewing state intelligence collection as tolerable but
      commercial-gain IP theft as intolerable. The trap is to collapse those different assessments into either permission
      for both or prohibition of both.'
    weighing: The shaping objective and the stated tolerance for ongoing intelligence collection support {O3} over a blanket
      ban {O2} ({C1}, {C2}). The express intolerance of commercial IP theft, together with the risk it could damage bilateral
      relations, rules against permitting both forms of conduct ({C3}, {C4}). The balance depends on preserving the source's
      distinction between intelligence collection and theft for commercial benefit. The 2015 pledge against cyber espionage
      for commercial gain is consistent with communicating that boundary.
    tradecraft: Use both public and private engagement to communicate the distinction consistently, and express the commercial-gain
      limit in a commitment of the kind described in the 2015 agreement. The source does not specify additional implementation
      or recordkeeping procedures.
    uncertainty: The source characterizes the evidence as public evidence and describes the policy's purpose and culmination;
      it does not establish that the approach prevented espionage or show how Beijing responded.
    handoff: The administration is the identified decision-maker, and Beijing is the engagement counterpart. No separate approval
      authority or required handoff is identified; involving another office is not a source-stated condition.
    tempting_wrong:
      option: O2
      pull: A blanket prohibition may seem like the clearest response to cyber-espionage.
      why_wrong: 'It erases the source''s stated distinction: ongoing state intelligence collection was unpleasant but tolerable,
        while commercial-gain IP theft was intolerable.'
    rejected:
      O1: It would permit commercial-gain IP theft, which the administration treated as intolerable and potentially damaging
        to bilateral relations.
      O2: It would prohibit state intelligence collection as well, contrary to the source's assessment that ongoing cyber-espionage
        was unpleasant but tolerable.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The administration assessed state intelligence collection itself as intolerable, rather than unpleasant but tolerable.
      then: O2
      why: Without the stated tolerance for intelligence collection, the basis for distinguishing it from commercial-gain
        theft would be removed, making a prohibition of both more consistent with the changed assessment.
    would_not_change:
    - id: noflip1
      if: Ongoing state intelligence collection remains unpleasant but tolerable while commercial-gain IP theft remains intolerable.
      why: Those assessments preserve the distinction that supports tolerating the former and prohibiting the latter.
    watch_for: []
  lesson: When a policy distinguishes tolerated intelligence collection from commercial-gain theft, communicate the boundary
    rather than treating all collection alike. A conduct-specific limit can preserve the intended scope of engagement while
    addressing conduct assessed as intolerable and harmful to the relationship.
  limits: This reasoning applies to the policy distinction described here; it does not establish that all state intelligence
    collection is permissible or that engagement prevents espionage. The source provides no broader legal rule or assessment
    of other forms of cyber activity.
  library:
    domain: cyber-policy
    family: CORPUS-NX-b2a45685
    source: https://www.cia.gov/resources/csi/static/58097b25db4cfed1c5b116688fbc000d/StudiesExtracts-March2022-Vol66No1-4.pdf
    episode_focus: The decision point is how to distinguish tolerated state intelligence collection from commercial IP theft
      treated as intolerable, and how to signal those limits through engagement. Exclude the technical details of the cyber
      campaigns and any claim that the approach successfully prevented espionage.
