case:
  id: DR-CORPUS-NX-7d2e46c7-E7@v1
  title: Assessing Soviet Strategic Objectives
  status: draft
  setting: United States, during an interagency assessment of the USSR’s intercontinental forces.
  decider: The interagency estimative body
  agent: The interagency estimative body
  agent_role: decide
  situation: The body is assessing Soviet leaders’ objectives for intercontinental forces, while recognizing that its understanding
    is incomplete. The assessment draws on Soviet statements and writings, observed force development and deployment, and
    judgments about the leadership’s constraints and opportunities. The persistence of Soviet strategic programs raises questions
    about whether strategic superiority is a practical objective within the next decade. Assessments differ over whether Soviet
    programs are primarily hedging and seeking incremental advantages or pursue a practical war-survival and postwar-dominance
    objective. The body must frame its judgment while accounting for uncertainty and the differing agency views.
  question: What should the interagency estimative body assess about whether Soviet leaders treat a war-survival and postwar-dominance
    posture as a practical objective for force development?
  options:
    O1:
      do: The interagency estimative body should defer a unified judgment and continue evaluating the central assessment alongside
        the recorded agency dissents.
      move: hold
      irreversible: false
    O2:
      do: The interagency estimative body should affirm that Soviet leaders seek improved warfighting and political leverage
        without a fixed near-term war-winning objective, while retaining the agency dissents.
      move: act
      irreversible: false
    O3:
      do: The interagency estimative body should reject that central judgment and affirm that postwar dominance is a practical
        guideline for Soviet force development.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The body’s understanding of Soviet objectives is incomplete, and its judgments draw on Soviet statements and writings,
      observed force development and deployment, and assessments of Soviet leaders’ circumstances.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The central assessment identifies Soviet leaders’ ultimate goal as attaining a dominant position over the West,
      particularly the United States.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The central assessment judges that Soviet programs are framed and adjusted to hedge against future developments
      rather than to achieve a specific, immutable force posture by a predetermined date.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The central assessment does not believe Soviet leaders expect to attain, within the next ten years, capabilities
      to devastate the United States while preventing the United States from devastating the USSR.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The central assessment judges that the Soviets seek a warfighting and war-survival posture that would leave them
      better positioned if war occurred, along with politically useful advantages and greater latitude in foreign policy.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Director of the Bureau of Intelligence and Research considers Soviet programs pragmatic and directed toward
      incremental advantages, avoiding strategic disadvantage, and preserving rough equivalence; he does not consider war-winning
      or war-survival a practical objective in the foreseeable future.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Defense Intelligence Agency and other listed agencies consider the capability to wage intercontinental nuclear
      war and survive with resources to dominate the postwar period an attainable practical guideline for Soviet force development.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Those agencies view Soviet force improvements, advanced-technology research, and resource priorities as advancing
      that objective and expect Soviet capabilities to move closer to it over the next ten years.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: analytic_integrity
    favors:
    - O1
    - O2
    weight: weak
    why: The body acknowledges that its understanding is incomplete and that Soviet objectives require interpretation. The
      distinction between ultimate goals and practical objectives argues against treating uncertainty about long-term aims
      as proof of a fixed near-term force-development objective.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The main assessment accepts the Soviet leaders’ ultimate aim of dominance but judges that uncertainty about future
      U.S. behavior and capabilities leads them to frame and adjust programs as hedges, not around a specific posture due
      by a fixed date. It also does not judge that they expect, within ten years, to gain the capability to devastate the
      United States while preventing devastation of the USSR.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The main assessment nevertheless sees Soviet leaders as seeking a warfighting and war-survival posture that would
      leave them better positioned if war occurred, visible advantages with political value, and greater latitude in foreign
      policy. This supports affirming practical aims for improved capabilities without equating them with a fixed near-term
      war-winning objective.
  - id: C4
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: 'The State Department intelligence director’s view supports the more limited practical-objective judgment: Soviet
      programs are pragmatic, seek incremental advantages and avoidance of falling behind, and aim to preserve rough equivalence
      rather than attain a war-winning or war-survival posture in the foreseeable future.'
  - id: C5
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O3
    - O1
    weight: strong
    why: The other listed agencies dispute the main assessment, judging that postwar dominance is an attainable practical
      guideline even without a fixed completion date. They interpret force improvements, advanced-technology research, and
      resource priorities as advancing it, and expect movement toward it over the next decade.
  reasoning:
    read: 'The question is not whether Soviet leaders have an ultimate ambition for dominance or whether they seek more than
      bare deterrence: the main assessment accepts both. The trap is collapsing that ultimate aim and their warfighting improvements
      into a conclusion that postwar dominance is already a practical force-development guideline, despite the main assessment’s
      uncertainty and the recorded agency disagreement.'
    weighing: 'The main assessment favors {O2}: Soviet leaders hedge against future developments and seek a better warfighting
      and political position, but are not judged to expect a fixed near-term posture capable of preventing the United States
      from devastating the USSR. The State Department intelligence director’s account reinforces that conclusion through the
      emphasis on incremental advantage and rough equivalence. The opposing agencies offer a substantial counter-reading of
      the programs and resource priorities, so the judgment must retain their dissent; the balance depends on whether those
      activities are better explained as hedging and pragmatic competition or as a practical program for postwar dominance.'
    tradecraft: State the distinction between ultimate ambition, practical force-development objectives, and the ten-year
      capability judgment explicitly. Record the central assessment and the agency dissent separately, including their different
      interpretations of the same program evidence, rather than presenting the contested estimate as unanimous.
    uncertainty: The estimate expressly recognizes that understanding of Soviet objectives is far from complete and that interpreting
      whether ultimate and practical goals are converging is uncertain. The disagreement over the meaning of Soviet programs
      remains material.
    handoff: The interagency estimative body should make the central assessment while preserving the dissenting agencies’
      judgments in the estimate, so readers can see both the endorsed judgment and the competing interpretation.
    tempting_wrong:
      option: O3
      pull: The sustained force programs and the agencies’ interpretation of hardening, civil defense, advanced research,
        and resource priorities can make postwar dominance appear to be an operative objective.
      why_wrong: That interpretation is a recorded dissent, not the main assessment’s conclusion; the main assessment distinguishes
        the ultimate goal from practical policy, emphasizes hedging under uncertainty, and does not judge that the USSR expects
        the specified devastating advantage within ten years.
    rejected:
      O1: Deferring a unified judgment would understate that the main assessment does reach a conclusion, even though the
        disagreement and uncertainty must be recorded.
      O3: The body should not replace the main assessment with the dissenting agencies’ practical postwar-dominance judgment.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Further reliable evidence established that Soviet leaders treat the capability to wage intercontinental nuclear
        war and survive with resources to dominate the postwar period as a practical guideline for force development, rather
        than as a distant ultimate aim.
      then: O3
      why: That would resolve the central distinction in favor of the dissenting agencies’ interpretation of Soviet objectives.
    - id: flip2
      if: Further evidence materially weakened the basis for distinguishing practical objectives from ultimate goals and left
        the body unable to make a defensible central assessment.
      then: O1
      why: Without a sufficient basis to select between the competing interpretations, deferral while evaluating them would
        be preferable to overstating confidence.
    would_not_change:
    - id: noflip1
      if: The evidence continued to show a Soviet ultimate goal of dominance over the West.
      why: The main assessment already accepts that ultimate goal and distinguishes it from whether postwar dominance is a
        practical force-development objective.
    watch_for:
    - id: watch1
      what: Whether force improvements, advanced-technology research, and resource-allocation priorities continue to indicate
        a practical program for attaining postwar dominance, as the dissenting agencies interpret them.
      favors:
      - O3
      why: Those agencies cite these developments as evidence that the objective guides force development and that Soviet
        capabilities are moving closer to it.
    - id: watch2
      what: How Soviet programs are adjusted in response to future U.S. capabilities and behavior.
      favors:
      - O2
      why: The main assessment treats Soviet programs as hedges against possible future developments, including concerns about
        U.S. modernization.
  lesson: Separate ultimate aims from practical objectives and from predictions about what capabilities a state expects to
    achieve within a defined period. When agencies interpret the same programs differently, state the central judgment and
    preserve the substantive dissent rather than turning uncertainty into apparent unanimity.
  limits: This conclusion concerns an intelligence estimate of Soviet objectives and does not resolve downstream U.S. choices
    about negotiations or defense policy. It is not a finding that the Soviet Union had no interest in warfighting, survival,
    or political leverage.
