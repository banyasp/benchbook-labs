case:
  id: DR-CORPUS-NX-7d2e46c7-E20@v1
  title: Strategic Force Amid Escalation
  status: draft
  setting: Soviet leadership, amid the prospect of large-scale theater nuclear conflict against the western USSR.
  decider: The Soviet leaders
  agent: The Soviet leaders
  agent_role: decide
  situation: Soviet leaders faced a decision about strategic force amid the prospect of large-scale theater nuclear conflict
    against the western USSR. Their general military doctrine favored seizing the initiative with massive preemptive nuclear
    attacks as the likelihood of large-scale conflict increased. They also had reason to consider whether caution might avert
    massive nuclear strikes on the Soviet homeland and avoid further escalation. Their calculations could include the risk
    of damage to the USSR and whether Soviet objectives could still be achieved. The Soviet response to the prospect of global
    nuclear war could not be predicted with confidence.
  question: What should the Soviet leaders do about authorizing strategic nuclear force amid large-scale theater nuclear conflict
    against the western USSR?
  options:
    O1:
      do: The Soviet leaders authorize a coordinated theater and intercontinental nuclear strike.
      move: act
      irreversible: true
    O2:
      do: The Soviet leaders decline a coordinated theater and intercontinental nuclear strike.
      move: act
      irreversible: false
    O3:
      do: The Soviet leaders authorize a theater nuclear strike and defer an intercontinental nuclear strike.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The assessment considered the contingency of a large-scale theater nuclear strike against the western USSR.
  - id: F2
    kind: intelligence
    status: assessed
    fact: In that contingency, the assessment judged that Soviet leaders would launch a coordinated theater and intercontinental
      strike.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Soviet leaders might delay the intercontinental strike in the hope that the United States would not retaliate against
      the Soviet homeland.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The available evidence was judged to make delay of the intercontinental strike highly unlikely.
  - id: F5
    kind: situation
    status: assessed
    fact: A possible motivation for restraint was avoiding unnecessary escalation to theaterwide or global nuclear war.
  - id: F6
    kind: situation
    status: assessed
    fact: Relevant considerations included avoiding damage to the USSR and judging whether Soviet objectives could still be
      achieved.
  - id: F7
    kind: authority
    status: assessed
    fact: Soviet military doctrine was described as favoring massive preemptive nuclear attacks, while the leaders could also
      choose caution in hopes of averting massive strikes on the Soviet homeland.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Soviet response when faced with the prospect of global nuclear war could not be predicted with confidence.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The assessment describes Soviet doctrine as favoring massive preemptive nuclear attacks and says that, in the stated
      contingency, leaders would launch a coordinated theater and intercontinental strike. It also identifies combat success,
      rather than control of escalation, as their overriding goal.
  - id: C2
    facts:
    - F5
    - F6
    - F8
    equity: escalation_control
    favors:
    - O2
    - O3
    weight: weak
    why: Avoiding unnecessary escalation to theaterwide or global nuclear war, limiting damage to the USSR, and preserving
      a chance to achieve objectives through a more cautious course could favor restraint. But the assessment presents these
      as possible motivations, not as a reliable basis for predicting the leaders' response to a prospect of global nuclear
      war.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: For a large-scale theater nuclear strike against the western USSR, the assessment expects a coordinated theater and
      intercontinental strike. It acknowledges possible delay in the hope that the United States would not retaliate against
      the Soviet homeland, but judges delay highly unlikely.
  reasoning:
    read: The question is whether Soviet leaders would authorize strategic force amid a large-scale theater nuclear conflict
      against the western USSR. The trap is treating doctrine as a guarantee of what they would do—or treating a possible
      motive for restraint as a dependable prediction—when the assessment says their response to the prospect of global nuclear
      war cannot be predicted with confidence.
    weighing: 'The assessment''s expected outcome is O1: doctrine and the priority placed on combat success align with its
      judgment that leaders would launch a coordinated theater and intercontinental strike in this contingency. Restraint
      could serve escalation control and reduce danger to the USSR, but the assessment treats those as possible motives and
      judges delay of the intercontinental strike highly unlikely. The balance depends on the leaders'' assessment of damage
      to the USSR, whether their objectives remain achievable, and the circumstances confronting them; the source does not
      claim certainty about their choice.'
    tradecraft: At the decision level, record the strategic-force choice, the objectives and risks weighed, the authority
      for the decision, and the assessment's uncertainty. Keep any rationale distinct from an intelligence prediction; do
      not turn this account into operational strike planning.
    uncertainty: The source gives a strong prediction for the stated contingency, not certainty about Soviet behavior or a
      general rule for every level of conflict. It expressly notes that leaders' choices could depend on circumstances and
      that their response to the prospect of global nuclear war was unpredictable.
    handoff: The source places the decision with Soviet leaders and does not identify a separate approving office or consultation
      requirement. The decision should remain at that leadership level; this scenario cannot supply an authority or delegation
      the source does not name.
    tempting_wrong:
      option: O3
      pull: Deferring the intercontinental strike might appear to preserve a chance that the United States would not retaliate
        against the Soviet homeland and to limit escalation.
      why_wrong: That possibility is acknowledged, but the assessment judges delay highly unlikely and expects a coordinated
        theater and intercontinental strike in the stated contingency. This is a forecast, not proof that restraint is impossible
        or ethically wrong.
    rejected:
      O2: The assessment does not predict declining a coordinated strike in this contingency; it expects leaders to launch
        one, notwithstanding possible motives for restraint.
      O3: The assessment recognizes possible delay in the hope of avoiding U.S. retaliation, but judges delay of the intercontinental
        strike highly unlikely.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Leaders chose to delay the intercontinental strike in the hope that the United States would not retaliate against
        the Soviet homeland.
      then: O3
      why: The assessment identifies this as a possible alternative to a coordinated theater and intercontinental strike.
    - id: flip2
      if: Leaders assessed that a theater response could achieve their objectives without an intercontinental strike, and
        that deferral materially reduced the risk of damage to the USSR or further escalation.
      then: O3
      why: This would give greater weight to the stated concerns about achieving objectives, avoiding damage to the USSR,
        and avoiding unnecessary escalation; the source does not itself say these conditions would change the choice.
    would_not_change:
    - id: noflip1
      if: The doctrinal preference for massive preemptive attacks is considered without additional information about the circumstances
        or the leaders' calculations.
      why: 'Doctrine alone does not resolve the choice: the assessment says there are no easy prescriptions for what leaders
        would do and their response to the prospect of global nuclear war is uncertain.'
    watch_for:
    - id: watch1
      what: Changes in the leaders' assessment of likely damage to the USSR and whether Soviet objectives could still be achieved.
      favors:
      - O2
      - O3
      why: The source identifies these as factors in the decision and as possible grounds for restraint.
  lesson: A doctrinal preference and an intelligence prediction can explain an expected choice without making that choice
    inevitable or ethically justified. Weigh the mission objective against escalation and harm, and keep uncertainty explicit
    rather than treating a forecast as a binding rule.
  limits: This reasoning is limited to the assessment's contingency of a large-scale theater nuclear strike against the western
    USSR and its prediction of Soviet leaders' likely response. It does not establish a legal rule, a general recommendation
    to use strategic force, or a prediction for other circumstances.
