case:
  id: DR-CORPUS-NX-c1662f18-E1@v1
  title: Risk Control Before a Gap Crossing
  status: draft
  setting: Before a planned gap crossing; division planning staff and Corps; location unspecified.
  decider: The division staff
  agent: The division staff
  agent_role: advise
  situation: A division is planning for a gap crossing. Its risk assessment is qualitative and relies on staff expert judgment
    to refine the product. A hazard is identified as attrition of 1/1 CD before the gap crossing. The division cannot directly
    influence this hazard. Corps is positioned to control it, and Corps support is critical to the operation. The staff must
    determine its recommended risk-control approach.
  question: What should the division staff recommend for controlling the risk before the gap crossing?
  options:
    O1:
      do: The division staff recommends retaining the risk at division and mitigating it through planning.
      move: act
      irreversible: false
    O2:
      do: The division staff recommends transferring the risk to Corps through coordination.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The risk assessment is qualitative.
  - id: F2
    kind: situation
    status: confirmed
    fact: The staff uses expert judgment to refine the risk product.
  - id: F3
    kind: authority
    status: confirmed
    fact: Risk-control recommendations may use avoidance, elimination, or mitigation.
  - id: F4
    kind: authority
    status: confirmed
    fact: When the division cannot directly influence a hazard, transfer denotes coordination with a higher echelon.
  - id: F5
    kind: situation
    status: assessed
    fact: The hazard is attrition of 1/1 CD before the gap crossing.
  - id: F6
    kind: capability
    status: assessed
    fact: The division cannot directly influence this hazard.
  - id: F7
    kind: capability
    status: assessed
    fact: Corps is positioned to control the hazard.
  - id: F8
    kind: situation
    status: assessed
    fact: Corps support is critical to the operation.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The stated control rule is to use transfer—coordination with a higher echelon—when the division cannot directly influence
      the hazard.
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The division cannot directly control the hazard, while Corps is positioned to do so; coordination places the risk
      with the echelon able to control it.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Corps support is critical to the operation, reinforcing the need to coordinate with Corps rather than treat the risk
      as a division-level control problem.
  - id: C4
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The assessment is qualitative and relies on staff expert judgment, so the staff should refine the risk product and
      state the control approach rather than imply a quantified basis for retaining the risk.
  reasoning:
    read: 'This is a planning judgment about a hazard assessed qualitatively, not a report of an actual operation. The key
      distinction is who can influence the hazard: the division cannot, while Corps can. The trap is treating the division''s
      planning responsibility as a reason to retain a risk it cannot directly control.'
    weighing: 'The controlling consideration is the stated rule that a hazard beyond the division''s direct influence calls
      for transfer through higher-echelon coordination {C1}. That rule fits the assessed capabilities: Corps is positioned
      to control the hazard {C2}, and its support is critical to the operation {C3}. The qualitative assessment and use of
      expert judgment shape how the staff refines and expresses its recommendation, but do not displace the transfer rationale
      {C4}.'
    tradecraft: Refine the qualitative risk product using staff expert judgment, identify the recommended disposition as transfer,
      and make clear that it requires coordination with Corps. Do not present the assessment as more precise than its qualitative
      basis allows.
    uncertainty: The assessment is qualitative, and the stated facts provide no numerical likelihood or severity. The recommendation
      rests on the division's assessed inability to influence the hazard and Corps' assessed ability to control it.
    handoff: The division staff should involve Corps because the division cannot directly influence the hazard and Corps is
      positioned to control it; Corps support is also critical to the operation.
    tempting_wrong:
      option: O1
      pull: Retaining the risk at division and mitigating through planning may seem consistent with the division's responsibility
        to refine its risk product.
      why_wrong: The source's stated approach is transfer when the division cannot directly influence the hazard, and Corps
        is positioned to control this one.
    rejected:
      O1: The staff should not recommend retaining the risk at division because it cannot directly influence the hazard and
        Corps is positioned to control it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The division could directly influence and control the hazard, removing the stated reason for transfer.
      then: O1
      why: The source specifies transfer for cases where the division cannot directly influence the hazard; with that condition
        changed, retaining and mitigating at division could be considered.
    would_not_change:
    - id: noflip1
      if: The qualitative assessment remained qualitative and continued to rely on staff expert judgment.
      why: Those features describe how the risk product is refined; by themselves they do not alter the stated transfer rule
        or who can control the hazard.
    watch_for:
    - id: watch1
      what: Whether the division's ability to directly influence the hazard changes during planning.
      favors:
      - O1
      why: The transfer recommendation is tied to the division's inability to influence the hazard; a change in that condition
        could support considering division-level control.
  lesson: When the division cannot directly influence a hazard, recommend transfer through coordination with the higher echelon
    positioned to control it. Use expert judgment to refine a qualitative risk product, while being clear about the limits
    of that assessment.
  limits: This reasoning applies to the stated planning situation and depends on the division's inability to influence the
    hazard and Corps' position to control it. It does not establish a general rule for hazards the division can control or
    for situations in which no capable higher echelon is identified.
