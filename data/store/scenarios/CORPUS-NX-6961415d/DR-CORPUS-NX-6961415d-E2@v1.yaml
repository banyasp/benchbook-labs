case:
  id: DR-CORPUS-NX-6961415d-E2@v1
  title: Dispersing a Crowd During Search and Rescue
  status: draft
  setting: At the crash site, during a military SAR effort after 1325L.
  decider: The SAR decision-maker (not identified)
  agent: The unidentified SAR decision-maker
  agent_role: decide
  situation: The ground unit being supported received reports of a downed aircraft. A nearby aircraft from another unit was
    tasked at 1325L to support the SAR effort, and a ground party from a nearby FOB departed for the crash site within three
    minutes. The supporting aircraft reported on station within 10 minutes, followed by a two-aircraft formation supporting
    SAR. The supporting aircraft observed 20 to 30 non-hostile people gathering around the debris. The decision is whether
    to use a show of force or another response to disperse the crowd. The authorizing decision-maker and applicable authority
    are not identified, and no alternatives are discussed.
  question: What should the unidentified SAR decision-maker do about using a show of force or another response to disperse
    the reported non-hostile crowd during the SAR effort?
  options:
    O1:
      do: The SAR decision-maker authorizes a show of force as the crowd-dispersal response.
      move: act
      irreversible: false
    O2:
      do: The SAR decision-maker declines a show of force and selects another crowd-dispersal response.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The ground unit being supported received reports of a downed aircraft.
  - id: F2
    kind: situation
    status: confirmed
    fact: A nearby aircraft from another unit was tasked at 1325L to support the SAR effort.
  - id: F3
    kind: situation
    status: confirmed
    fact: A ground party from a nearby FOB departed for the crash site within three minutes of the SAR tasking.
  - id: F4
    kind: situation
    status: confirmed
    fact: The supporting aircraft reported on station within 10 minutes.
  - id: F5
    kind: situation
    status: confirmed
    fact: A two-aircraft fighter formation followed to support SAR.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The supporting aircraft observed 20 to 30 persons described as non-hostile gathering around the debris.
  - id: F7
    kind: authority
    status: confirmed
    fact: The authorizing decision-maker, applicable authority, and other responses are not identified in the available account.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The decision arose during an active SAR effort with aircraft and a ground party responding. That is the mission context
      for the recorded crowd-dispersal response, although the account does not explain how the crowd affected SAR.
  - id: C2
    facts:
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: The people gathering around the debris were described as non-hostile. The account does not say this made them a threat
      or explain how their status was weighed, so it supplies no stated justification for force on that basis.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The recorded purpose of the show of force was to disperse the gathering, and the account records that the crowd departed.
      It gives no further explanation for why this response was chosen over another.
  reasoning:
    read: 'This is a crowd-management choice during SAR, not a source-described hostile engagement: the gathering was characterized
      as non-hostile. The account records a show of force to disperse it, but the authorizing decision-maker, applicable authority,
      and alternatives are not identified. Do not mistake the recorded action and result for a stated legal or comparative
      assessment.'
    weighing: The source's stated reason is dispersal of the crowd during the SAR effort, and it records that the crowd departed.
      The non-hostile characterization is relevant context, but the source does not explain its significance or identify any
      threat, obstruction, harm assessment, or advantage over alternatives. The recorded outcome is O1; the account does not
      establish that O1 was legally required or superior on a fuller record.
    tradecraft: As decision practice, identify the decision-maker's delegation and applicable authority before authorizing
      a response. Record the purpose, the assessment of the gathering, material risks to non-hostile people, and any feasible
      alternatives and why they were rejected. Do not infer authorization from participation in the SAR effort.
    uncertainty: The source does not identify who authorized the show of force, what authority applied, what alternatives
      were considered, or whether the crowd impeded SAR. It also does not give a separate rationale beyond dispersal or assess
      risks to the crowd.
    handoff: The decision-maker should confirm authority with the responsible command or legal adviser if that authority is
      unclear; the account does not establish who held approval authority. This is a decision-level safeguard, not a source-reported
      consultation.
    tempting_wrong:
      option: O2
      pull: The gathering was described as non-hostile, which may make declining a show of force seem the only defensible
        course.
      why_wrong: That description alone does not establish that another response would have been preferable or effective;
        the source records O1 as the response used to disperse the crowd, without discussing alternatives.
    rejected:
      O2: The recorded response was a show of force to disperse the gathering, while the source identifies no alternative
        response or reason for choosing one.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The applicable authority did not permit the decision-maker to authorize a show of force.
      then: O2
      why: A response outside the decision-maker's authority should not be authorized; the source does not establish the authority
        in this case.
    - id: flip2
      if: A feasible alternative would disperse the crowd while presenting materially less risk to the non-hostile people
        and allowing SAR to proceed.
      then: O2
      why: That additional comparative information could favor the alternative over the recorded response.
    would_not_change:
    - id: noflip1
      if: The only additional information is confirmation that the crowd departed after the show of force.
      why: That confirms the recorded result but does not resolve whether the response was authorized or preferable to alternatives.
    watch_for:
    - id: watch1
      what: Clarification of the decision-maker's delegation and the applicable authority.
      favors:
      - O2
      why: If authority for O1 is absent or uncertain, the decision-maker should not assume it exists; the source leaves this
        unresolved.
  lesson: A recorded operational outcome does not by itself establish that the response was authorized or preferable to alternatives.
    When a crowd is described as non-hostile, the decision should account for that fact while verifying authority and comparing
    feasible responses against the mission need.
  limits: The source provides only a brief account of the crowd-dispersal response during SAR; it does not establish the legal
    framework, the crowd's effect on the mission, or the options available. This scenario cannot determine whether a show
    of force would be lawful or appropriate in circumstances with different authority, risks, or alternatives.
