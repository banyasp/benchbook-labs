    source: https://www.cia.gov/resources/csi/static/242fbcb4c50958e6d49fa7a3c2718a05/Getting-to-Know-the-President-Fourth-Edition-2021-web.pdf
    episode_focus: The administration considered delaying the briefing, as had occurred in a prior transition, but arranged
      briefings before inauguration, including on a politically charged program. The stated reason was the need to clear the
      air about ongoing activities and ensure the incoming administration was informed. Keep the focus on disclosure timing
      and oversight; exclude descriptions or demonstrations of techniques.
