case:
  id: DR-CORPUS-NX-c9ca34bd-E28@v1
  title: Timing the Covert-Action Transition Briefing
  status: draft
  setting: Chicago and the Federal Building, during the presidential transition; the outgoing administration and intelligence
    community.
  decider: The outgoing president, with the National Security Advisor, Director of National Intelligence, and CIA Director
  agent: The outgoing president, with the National Security Advisor, Director of National Intelligence, and CIA Director
  agent_role: decide
  situation: The outgoing administration was preparing briefings for the incoming administration. Guidance barred information
    about covert actions or sensitive operations from being included, even incidentally, in the substantive transition briefings.
    A program involving rendition, detention, and interrogation of suspected terrorists was part of the covert-action portfolio
    and remained politically charged after being publicly acknowledged in 2006. The officials were considering whether to
    brief the incoming administration before inauguration or defer until afterward, as had occurred in a prior transition.
    A personal briefing by the outgoing president on the most sensitive programs had been considered, and a larger secure
    session was feasible.
  question: What should the outgoing president and senior national-security and intelligence officials do about the timing
    and format of the incoming administration's covert-action briefing?
  options:
    O1:
      do: The administration discloses the covert-action programs to the incoming administration in a secure briefing before
        inauguration.
      move: act
      irreversible: true
    O2:
      do: The administration arranges a personal pre-inauguration briefing on the most sensitive programs for the president-elect.
      move: act
      irreversible: true
    O3:
      do: The administration withholds the covert-action briefing from the incoming administration until after inauguration.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Guidance to the intelligence community barred information about covert actions or sensitive operations from the
      substantive briefings to the incoming administration, even incidentally.
  - id: F2
    kind: situation
    status: confirmed
    fact: The transition briefing covered the full range of CIA covert-action programs.
  - id: F3
    kind: situation
    status: confirmed
    fact: The covert-action portfolio included a program for the rendition, detention, and interrogation of suspected terrorists.
  - id: F4
    kind: situation
    status: confirmed
    fact: The program had been publicly acknowledged in 2006 and remained politically charged and an issue in the recently
      concluded campaign.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Those involved believed the incoming president needed to be briefed on covert action before inauguration rather
      than afterward, chiefly because the program was part of the portfolio.
  - id: F6
    kind: situation
    status: confirmed
    fact: A prior transition had deferred the covert-action briefing until after inauguration.
  - id: F7
    kind: situation
    status: confirmed
    fact: A personal meeting between the outgoing president and president-elect to cover the most sensitive programs was considered.
  - id: F8
    kind: capability
    status: confirmed
    fact: A larger secure session for the briefing was feasible.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The politically charged program was part of the covert-action portfolio, and the officials involved believed the
      incoming president needed to know about it before inauguration. They said the briefing was needed to clear the air about
      ongoing activities.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Although a prior transition deferred the briefing, the officials involved judged that deferral was not appropriate
      here because the incoming president needed to be informed before taking office.
  - id: C3
    facts:
    - F1
    - F2
    - F8
    equity: classification_integrity
    favors:
    - O1
    weight: weak
    why: The guidance barred covert-action information from general substantive briefings, while a larger secure session was
      feasible. A dedicated secure briefing allowed disclosure of the portfolio without including that information incidentally
      in the other transition briefings.
  reasoning:
    read: The choice was not simply between unrestricted disclosure in ordinary transition briefings and withholding everything.
      The guidance excluded covert-action information from those substantive briefings, while the officials arranged a separate
      secure session. The trap is allowing the sensitivity and political charge of the program to become a reason to leave
      the incoming administration uninformed until after inauguration.
    weighing: The decisive consideration was the officials' judgment that the incoming president needed pre-inauguration knowledge
      of ongoing covert activities, chiefly because the politically charged program was part of the portfolio. The prior transition's
      delay did not control this decision. The balance depends on the need to inform the incoming administration and the availability
      of a secure format that keeps the information out of general briefings.
    tradecraft: Keep the covert-action briefing separate from substantive transition briefings, use a secure setting, and
      limit attendance to the relevant outgoing and incoming officials. Record the decision to brief and any unresolved questions
      without treating silence or attendance as approval of the programs.
    uncertainty: The source records the officials' reason for briefing before inauguration, but does not establish a legal
      requirement to do so or specify the legal status of the programs. The president-elect expressed no opinion at the first
      session and requested further discussion, so the initial briefing should not be treated as resolving the incoming administration's
      position.
    handoff: The outgoing president and senior national-security and intelligence officials should coordinate the disclosure;
      the source records the National Security Advisor, DNI, and CIA Director's involvement. The incoming president-elect
      and relevant incoming national-security and legal advisers should receive the information and pursue follow-up questions.
    tempting_wrong:
      option: O3
      pull: Deferring would follow the precedent of a prior transition and avoid an immediate briefing on a politically charged
        portfolio.
      why_wrong: The officials involved specifically judged that the incoming president needed to be briefed before inauguration
        to clear the air about ongoing activities.
    rejected:
      O2: A personal briefing on the most sensitive programs was considered, but the course taken was a secure session covering
        the full covert-action portfolio, with further briefings for additional detail.
      O3: Deferral was rejected because the officials involved believed the incoming president needed to know about the ongoing
        programs before inauguration.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A larger secure session could not be arranged, but a secure personal briefing for the president-elect remained feasible.
      then: O2
      why: The source records that a personal briefing on the most sensitive programs was considered. If the broader secure
        format were unavailable, that alternative could preserve pre-inauguration disclosure.
    - id: flip2
      if: The portfolio did not include a politically charged program that officials believed required pre-inauguration disclosure.
      then: O3
      why: The source identifies that program as the chief reason the officials believed briefing should occur before, rather
        than after, inauguration.
    would_not_change:
    - id: noflip1
      if: The incoming president-elect made no negative comments during the initial briefing.
      why: The president-elect expressed no opinion and requested further discussion; lack of objection did not establish
        agreement or make follow-up unnecessary.
    watch_for:
    - id: watch1
      what: Whether the incoming administration receives follow-up on unresolved questions about the program's future and
        the applicable limits.
      favors:
      - O1
      why: The program's future remained unclear until the Department of Justice informed CIA that only techniques approved
        by the Army Field Manual could be used, underscoring that the initial disclosure did not settle subsequent policy
        questions.
  lesson: When a sensitive portfolio is ongoing and the incoming administration needs it to assume responsibility, do not
    let political sensitivity or a prior transition's practice substitute for a reasoned timing decision. Use a dedicated
    secure briefing rather than allowing sensitive material into general transition briefings, and do not mistake silence
    for approval.
  limits: This reasoning concerns the timing and format of transition disclosure, not the legality or merits of the underlying
    programs. It does not establish a general legal duty to brief before inauguration or that every sensitive matter warrants
    the same timing.
