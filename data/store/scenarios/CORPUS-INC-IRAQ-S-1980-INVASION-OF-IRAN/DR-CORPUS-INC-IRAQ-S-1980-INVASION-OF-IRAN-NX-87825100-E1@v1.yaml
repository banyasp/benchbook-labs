case:
  id: DR-CORPUS-INC-IRAQ-S-1980-INVASION-OF-IRAN-NX-87825100-E1@v1
  title: Whether to Initiate War with Iran
  status: draft
  setting: Iraq, before the war with Iran, Iraqi leadership
  decider: The Iraqi leader
  agent: The Iraqi leader
  agent_role: decide
  situation: Before the war with Iran, the Iraqi leader sought to establish Iraq as the Arab world's leader. He viewed Egypt
    as having relinquished its traditional regional role by making peace with Israel and Saudi Arabia as lacking the character
    to lead. Ties with Syria had frayed. He believed war would unite the Arab world behind Iraq and that Iran would quickly
    crumble. The military professionals who remained after political purges struggled to translate the leadership aim into
    military plans. The Iraqi leader did not understand Iraq's military capabilities.
  question: What should the Iraqi leader do about whether to initiate war against Iran?
  options:
    O1:
      do: The Iraqi leader declines to authorize Iraq to initiate war against Iran.
      move: act
      irreversible: false
    O2:
      do: The Iraqi leader authorizes Iraq to initiate war against Iran.
      move: act
      irreversible: true
    O3:
      do: The Iraqi leader postpones a decision on initiating war against Iran.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The Iraqi leader's strategic objective was to become the Arab world's leader.
  - id: F2
    kind: situation
    status: assessed
    fact: The Iraqi leader judged that Egypt had relinquished its traditional regional role by making peace with Israel.
  - id: F3
    kind: situation
    status: assessed
    fact: The Iraqi leader judged that Saudi Arabia lacked the character needed to lead the Arab world.
  - id: F4
    kind: situation
    status: confirmed
    fact: Ties between Iraq and Syria had frayed.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Iraqi leader believed war would unite the Arab world behind Iraq.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Iraqi leader believed Iran would quickly crumble.
  - id: F7
    kind: capability
    status: assessed
    fact: Military professionals who survived the Iraqi leader's political purges struggled to translate his strategic aim
      into military plans.
  - id: F8
    kind: capability
    status: assessed
    fact: The Iraqi leader did not understand his own military's capabilities.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The Iraqi leader saw Iraq as the remaining plausible Arab leader and viewed the regional circumstances as an opening
      for that strategic objective.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The leader's stated case for war depended on his belief that it would unify the Arab world behind Iraq and that Iran
      would quickly crumble.
  - id: C3
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: strong
    why: The surviving military professionals struggled to translate the strategic aim into plans, while the leader did not
      understand the military's capabilities; these facts undermine confidence in the assumptions supporting war.
  reasoning:
    read: The Iraqi leader faced a strategic choice shaped by his ambition for regional leadership and his belief that war
      offered a short path to it. The trap was treating hoped-for political unity and a quick Iranian collapse as dependable
      outcomes despite the stated gap between the leader's aims, the military professionals' ability to translate them, and
      his understanding of military capability.
    weighing: The leader's stated rationale for authorizing war was the prospect of Arab unity and Iran's rapid collapse,
      against the background of his assessment that other Arab states could not lead {C1} {C2}. The source also identifies
      capability and understanding problems that weaken the basis for those expectations {C3}. The required outcome is {O2},
      but the source's account does not establish that its expectations were well-founded or that war was a sound decision;
      the balance depends on the leader's beliefs being treated as his rationale, not as verified facts.
    tradecraft: At decision time, separate strategic aims from forecasts about what war will achieve. Record the assumptions
      about regional support and Iran's likely response, identify the military professionals' capability concerns, and make
      clear which assumptions remain unverified before authorizing an irreversible decision.
    uncertainty: The source records the leader's beliefs and capability limitations, but does not assess the likelihood of
      Arab unity, the accuracy of the forecast about Iran, or the legal basis for initiating war.
    handoff: The leader held the decision role in this scenario. As a decision practice, he should obtain candid capability
      assessments from the surviving military professionals before committing; this consultation is a safeguard inferred from
      the stated planning gap, not a process specified by the source.
    tempting_wrong:
      option: O1
      pull: The military professionals' difficulty translating the strategic aim and the leader's lack of understanding of
        military capabilities make declining appear prudent.
      why_wrong: It does not reflect the Iraqi leader's stated strategic rationale for initiating war. That explains the source's
        recorded choice, but does not establish that declining would have been substantively wrong.
    rejected:
      O1: The Iraqi leader did not choose to decline, because he acted on his stated belief that war could advance Iraq's
        regional leadership and quickly overcome Iran.
      O3: The Iraqi leader did not postpone; the source presents him as initiating war on the expectations of Arab unity and
        Iran's rapid collapse, without describing postponement as his course.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible assessments available to the leader substantially undermined the expectation that Iran would quickly crumble
        or that Arab states would unite behind Iraq.
      then: O3
      why: The anticipated benefits were central to the stated rationale; serious contrary evidence would make postponing
        for reassessment more appropriate.
    - id: flip2
      if: The leader had reliable evidence that the military could not support the strategic objective and that this limitation
        made the expected gains unattainable.
      then: O1
      why: The source identifies a gap between the strategic aim and military professionals' ability to translate it, as well
        as the leader's lack of understanding of military capability.
    would_not_change:
    - id: noflip1
      if: The leader continued to regard Egypt and Saudi Arabia as unsuitable regional leaders.
      why: Those assessments explain the ambition for Iraqi leadership but do not by themselves validate the forecasts of
        Arab unity, Iran's collapse, or Iraq's military capacity.
    watch_for:
    - id: watch1
      what: Candid assessments from the surviving military professionals of whether Iraq's capabilities could support the
        leader's strategic aim.
      favors:
      - O1
      - O3
      why: The source identifies difficulty translating the aim into military plans and the leader's poor understanding of
        his own capabilities.
  lesson: A leader's strategic objective and optimistic forecasts can explain a decision without validating it. Before an
    irreversible choice, distinguish desired political effects from evidence about likely outcomes and the capabilities available
    to achieve them.
  limits: This reconstruction concerns the decision to initiate war and the reasons stated for it; it does not evaluate the
    later planning or conduct of the opening offensive. The source does not supply a legal analysis or enough evidence to
    establish whether the leader's expectations were reasonable.
