case:
  id: DR-CORPUS-NX-76f6b85d-E1@v1
  title: 'Coolant Warning: Continue or Return'
  status: draft
  setting: MQ-1B Predator flight, 27 May 2015; location and institution not specified.
  decider: The Mission Pilot
  agent: The Mission Pilot
  agent_role: decide
  situation: During an MQ-1B Predator flight, the aircraft displayed high CHT and low ECT warnings. A sharp divergence between
    those readings indicates coolant loss. The Mission Crew member assessed an engine coolant leak. Coolant loss causes the
    engine to overheat. The engine cooling fan was in automatic mode, and automatic cooling control was determined by coolant
    temperature. The Mission Pilot had to choose whether to continue the mission or return to base.
  question: 'What should the Mission Pilot do: continue the mission or return to base?'
  options:
    O1:
      do: The Mission Pilot returns the aircraft to base.
      move: act
      irreversible: false
    O2:
      do: The Mission Pilot continues the assigned mission.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The aircraft displayed a high CHT warning.
  - id: F2
    kind: situation
    status: confirmed
    fact: The aircraft displayed a low ECT warning.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: A sharp divergence between CHT and ECT indicates coolant loss.
  - id: F4
    kind: situation
    status: assessed
    fact: The Mission Crew member assessed that the engine had a coolant leak.
  - id: F5
    kind: situation
    status: confirmed
    fact: With coolant loss, the engine overheats.
  - id: F6
    kind: capability
    status: confirmed
    fact: The engine cooling fan was set to automatic mode for the entire flight.
  - id: F7
    kind: capability
    status: confirmed
    fact: Automatic control of the engine cooling fan and cowl flap is determined by coolant temperature.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The high CHT and low ECT warnings diverged in a way that indicates coolant loss, and the Mission Crew member assessed
      an engine coolant leak.
  - id: C2
    facts:
    - F4
    - F5
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The assessed coolant loss meant the engine overheated, supporting the decision to return rather than continue the
      mission.
  - id: C3
    facts: []
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Returning meant the crew would not be available for its mission. That operational cost was communicated to the mission
      command center, though no further balancing rationale is stated.
  reasoning:
    read: 'This was not simply a cooling-system warning: the high CHT and low ECT readings had a sharp divergence associated
      with coolant loss, and the crew assessed an engine coolant leak. Coolant loss causes the engine to overheat. The fan
      being in automatic mode, with control determined by coolant temperature, describes the cooling system; it is not evidence
      that the coolant loss was resolved. The assessment was made from the warnings, not described as an independently confirmed
      leak. {F1} {F2} {F3} {F4} {F5} {F6} {F7}'
    weighing: The decisive considerations were the coolant-loss assessment and the resulting engine overheating, which favored
      {O1}. The cost was loss of mission availability, but the stated decision was to return after the coolant-loss assessment;
      the source gives no additional weighing of that cost or claim that the automatic cooling system made continued flight
      acceptable. {C1} {C2} {C3}
    tradecraft: Once choosing to return, coordinate the return and notify mission leadership of the loss of mission availability.
      Preserve a clear record of the warnings, the coolant-loss assessment, the timing of the decision, and its operational
      rationale.
    uncertainty: The decision account does not specify the leak's severity, how quickly the engine might deteriorate, or the
      remaining flight margin. It does identify the leak as an assessment based on warning indications, and states that coolant
      loss causes overheating.
    handoff: The Mission Pilot made the return decision. The Mission Crew coordinated with air traffic control and notified
      the mission command center; the Mission Pilot also asked the Mission Observer, an instructor pilot, to provide additional
      crew support.
    tempting_wrong:
      option: O2
      pull: Continuing would preserve mission availability, and the engine cooling fan was in automatic mode.
      why_wrong: The automatic setting does not show that coolant loss had been corrected. The crew assessed a coolant leak,
        and coolant loss causes engine overheating; the source gives no basis for treating automatic cooling as a reason to
        continue.
    rejected:
      O2: The Mission Pilot did not continue because the crew had assessed coolant loss, which causes the engine to overheat.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A sound reassessment established that coolant loss was not occurring and that the engine was not overheating.
      then: O2
      why: That would remove the stated condition driving the return decision and could make continued mission availability
        reasonable.
    would_not_change:
    - id: noflip1
      if: The cooling fan remained in automatic mode, with control based on coolant temperature, while the coolant-loss assessment
        persisted.
      why: The automatic setting alone does not resolve the assessed coolant loss or the resulting overheating.
    watch_for: []
  lesson: When warnings indicate coolant loss and the crew assesses a leak that causes engine overheating, prioritize the
    return decision over mission continuation. An automatic cooling mode is not, by itself, evidence that the underlying problem
    has been resolved.
  limits: This reasoning applies to the stated coolant-loss assessment and overheating consequence. It does not establish
    a general flight rule or address a case where a reliable reassessment shows the diagnosis was wrong or the condition resolved.
  library:
    domain: operational-command
    family: CORPUS-NX-76f6b85d
    source: https://www.airandspaceforces.com/PDF/AircraftAccidentReports/Documents/2016/052715_MQ1B_CENTCOM.pdf
    episode_focus: The crew could continue the mission or return to base; the report states that the pilot initiated a return
      about five minutes after the first warning, following the coolant-loss assessment. Focus on the operational decision
      and its stated reason, not on checklist steps or aircraft-control technique.
    cues:
      option_words:
        O1: 8
        O2: 7
      real_option: O1
      real_to_mean_other_length: 1.14
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The Mission Pilot initiated a return to base about five minutes after the first warning, following the crew's assessment
  of an engine coolant leak.
