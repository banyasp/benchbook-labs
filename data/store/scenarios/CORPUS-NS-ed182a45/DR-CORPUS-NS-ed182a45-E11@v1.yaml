case:
  id: DR-CORPUS-NS-ed182a45-E11@v1
  title: Force Decision During Departure
  status: draft
  setting: Building on Balboa Avenue, Panama; evening before 1930 hours; American personnel.
  decider: The American personnel member who decided whether to use force (identity unspecified)
  agent: The American personnel member who decided whether to use force (identity unspecified)
  agent_role: decide
  situation: American personnel were preparing to leave the building on Balboa Avenue. An armed civilian security guard tried
    to stop them. The guard was fearful of losing his job. He drew his pistol. Repeated efforts to dissuade him in Spanish
    had been unsuccessful. The immediate choice was whether to use force or continue without using force.
  question: What should the American personnel member who decided whether to use force do when an armed civilian security
    guard blocks the departure?
  options:
    O1:
      do: The American personnel member should withhold force, continue verbal efforts, and remain with the guard at the building.
      move: act
      irreversible: false
    O2:
      do: The American personnel member should use force, arrange treatment for the guard, and transfer him to firefighters.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: American personnel were preparing to leave the building.
  - id: F2
    kind: situation
    status: confirmed
    fact: The person trying to stop them was a civilian security guard.
  - id: F3
    kind: situation
    status: assessed
    fact: The guard was fearful of losing his job.
  - id: F4
    kind: situation
    status: confirmed
    fact: The guard drew his pistol.
  - id: F5
    kind: situation
    status: confirmed
    fact: Repeated efforts to dissuade the guard in Spanish had been unsuccessful.
  - id: F6
    kind: situation
    status: confirmed
    fact: The guard attempted to stop the departing personnel.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The guard drew a pistol while trying to stop the departing personnel, creating an armed threat in the immediate situation.
  - id: C2
    facts:
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: Repeated efforts to dissuade the guard in Spanish had failed, so continued verbal efforts had not resolved the obstruction.
  - id: C3
    facts:
    - F2
    - F3
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The person blocking departure was a civilian, and his assessed fear of losing his job counsels against treating him
      as merely an obstacle; the account nevertheless describes force followed by treatment and transfer to firefighters.
  reasoning:
    read: 'This was not only a civilian trying to delay departure: he drew a pistol while attempting to stop the personnel.
      The trap is to let his fear of losing his job erase the armed threat, or to let the threat erase his status as a civilian
      deserving care.'
    weighing: The armed obstruction and unsuccessful efforts to dissuade the guard weigh toward {O2} ({C1}, {C2}); his civilian
      status and assessed motive weigh toward restraint ({C3}). The source's recorded course was force, followed by treatment
      and transfer to firefighters. The balance depends on the pistol being drawn and the repeated verbal efforts having failed;
      no legal rule or ROE standard is provided.
    tradecraft: At the decision level, distinguish the observed armed obstruction from assumptions about the guard's intent,
      and record the failed efforts to dissuade him and the reason force was chosen. The source's account also emphasizes
      care for the guard afterward and transfer to firefighters; it provides no engagement techniques.
    uncertainty: The account does not identify the person who fired, describe the precise threat posed by the pistol, or specify
      applicable rules of engagement or delegated authority. The guard's fear of losing his job is presented as an assessment,
      not as a confirmed statement from him.
    handoff: The account places the choice with the American personnel at the scene and does not identify a higher authority
      involved. It records that the guard was treated and turned over to firefighters.
    tempting_wrong:
      option: O1
      pull: The guard was a civilian and was fearful of losing his job, which makes continued restraint appealing.
      why_wrong: That concern does not resolve the immediate armed obstruction after repeated efforts to dissuade him had
        failed.
    rejected:
      O1: It was not chosen because the guard had drawn his pistol and repeated verbal efforts to dissuade him had failed.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The guard had not drawn his pistol and verbal efforts could still address the obstruction.
      then: O1
      why: Without the armed threat and with a viable non-force effort, the stated circumstances supporting force would be
        materially different.
    would_not_change:
    - id: noflip1
      if: The guard's fear of losing his job remained, while he still drew his pistol and repeated efforts to dissuade him
        had failed.
      why: That motive would remain relevant to humane treatment but would not remove the armed obstruction that supports
        the recorded choice.
    watch_for: []
  lesson: A civilian's motive matters, but it does not by itself neutralize an armed obstruction after efforts to dissuade
    the person have failed. When force is chosen, preserve the person's welfare through treatment and an appropriate handoff.
  limits: This reasoning applies to the stated combination of an armed guard trying to stop departure and unsuccessful efforts
    to dissuade him. The account does not supply the legal authority, rules of engagement, or details needed to generalize
    to other force decisions.
