case:
  id: DR-CORPUS-NS-ed182a45-E10@v1
  title: Response to Radio Nacional Broadcasts
  status: draft
  setting: Albrook Air Station, Panama, 20 December 1989; SOCSOUTH and TF BLACK command.
  decider: The SOCSOUTH and TF BLACK commander
  agent: The SOCSOUTH and TF BLACK commander
  agent_role: decide
  situation: The decision arose during Operation JUST CAUSE on 20 December 1989. A government spokesman's broadcast urged
    residents to resist U.S. forces. Intelligence about the downtown office building associated with Radio Nacional was very
    limited. The station's offices were identified as being on the seventh floor. There was an assessment that six or seven
    armed pro-regime personnel might be present, and the regime's leader was still at large, leaving open the possibility
    he was in the building.
  question: What should the SOCSOUTH and TF BLACK commander do about the Radio Nacional broadcasts?
  options:
    O1:
      do: The SOCSOUTH and TF BLACK commander declines the operation to stop Radio Nacional's broadcasts.
      move: act
      irreversible: false
    O2:
      do: The SOCSOUTH and TF BLACK commander authorizes the operation to stop Radio Nacional's broadcasts.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A Panamanian government broadcast urged residents to resist U.S. forces.
  - id: F2
    kind: authority
    status: confirmed
    fact: The SOCSOUTH and TF BLACK commander held command responsibility for the operation.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Intelligence about the downtown office building associated with Radio Nacional was very limited.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Radio Nacional's offices were identified as being on the seventh floor of the Contraloria General building.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Six or seven armed Dignity Battalion personnel might be at the building.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The regime's leader was still at large, raising the possibility that he was in the building.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The broadcast urged residents to resist U.S. forces, and the stated purpose of the command decision was to stop it.
  - id: C2
    facts:
    - F3
    - F5
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Very limited intelligence left uncertainty about armed pro-regime personnel and the possibility that the regime's
      leader was in the building, creating risks the commander had to weigh.
  - id: C3
    facts:
    - F2
    - F4
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The commander held responsibility for the operation, and the station offices had been identified in the building;
      the commander directed the takedown to stop the broadcasts.
  reasoning:
    read: The decision was whether to stop a government broadcast urging resistance, not whether uncertainty about the building
      had disappeared. The trap is treating the broadcast's urgency as proof that everyone in the building was hostile, or
      treating incomplete intelligence as an automatic reason not to act.
    weighing: The commander gave substantial weight to stopping the broadcasts {C1}. The limited intelligence and assessed
      possibility of armed personnel or the regime's leader being present were risks, but did not prevent authorization {C2}.
      The balance therefore favored {O2}; it depended on the broadcast's continuing purpose and on accepting the remaining
      uncertainty rather than assuming it had been resolved.
    tradecraft: At the decision level, make the authority and purpose explicit, record the intelligence limits and assessed
      risks alongside the reason for acting, and reconsider if material information changes. Do not infer that the decision
      establishes a general rule about what may be done to broadcasters or occupants.
    uncertainty: The intelligence about the building was very limited. The presence of armed personnel and the possibility
      that the regime's leader was there were assessments, not confirmed facts.
    handoff: The SOCSOUTH and TF BLACK commander held command responsibility, with command staff and operational commanders
      contributing to development of the concept. No separate approval authority or legal reviewer is specified.
    tempting_wrong:
      option: O1
      pull: Declining avoids committing personnel when intelligence is limited and armed personnel or the regime's leader
        might be present.
      why_wrong: That caution does not address the commander's stated objective of stopping broadcasts urging resistance;
        in the source's judgment, the uncertainty was a risk to weigh, not a reason that settled the choice.
    rejected:
      O1: The commander did not decline because the stated objective was to stop the broadcasts urging residents to resist
        U.S. forces.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable information established that the broadcasts had stopped or no longer urged resistance before the decision.
      then: O1
      why: The stated reason for the takedown would no longer apply, weakening the mission-based case for authorizing it.
    would_not_change:
    - id: noflip1
      if: Intelligence remained limited, with the assessed possibility of armed pro-regime personnel or the regime's leader
        still present.
      why: Those uncertainties were part of the situation in which the commander directed the takedown; by themselves they
        did not prevent authorization.
    watch_for:
    - id: watch1
      what: Whether the broadcasts continued to urge resistance at the time of the decision.
      favors:
      - O2
      why: That was the stated reason for stopping them; a material change in the broadcasts could alter the mission-based
        balance.
  lesson: A commander may weigh an urgent operational purpose against serious uncertainty without pretending the uncertainty
    is resolved. Keep the stated purpose and assessed risks visible in the decision, and reassess if the purpose or material
    facts change.
  limits: This reasoning applies to the commander's decision in the described setting, not as a general legal rule authorizing
    interference with broadcasts or action against people in a building. The source does not state a specific legal standard
    or establish that the assessed risks were confirmed.
