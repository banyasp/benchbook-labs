    domain: military-operational
    family: CORPUS-NS-ed182a45
    source: https://arsof-history.org/pdf/v15n1.pdf
    episode_focus: The command directed a takedown after broadcasts urged residents to resist U.S. forces, despite limited
      intelligence about the site and uncertainty about whether Noriega or armed pro-regime personnel were present. Treat
      the alternative to authorizing the assault—such as allowing the broadcasts to continue or choosing another response—as
      implied, not expressly enumerated; exclude the assault plan and its execution details.
