case:
  id: DR-CORPUS-NX-788f56ef-E1@v1
  title: Defense Intelligence Authority and Board Representation
  status: draft
  setting: National Security Council, January 1961, during the administration’s final two weeks.
  decider: The National Security Council
  agent: The National Security Council
  agent_role: decide
  situation: The Joint Study Group on Foreign Intelligence Activities has submitted recommendations, some agreed and others
    unresolved. The recommendations include changing the military intelligence organization within the Department of Defense
    and changing representation on the intelligence board. The National Security Council Intelligence Directives refer to
    the Military Services rather than the Secretary of Defense, and their provisions cover the board’s organization. The President
    favors greater integration, while the Military Services have personnel and experience in intelligence, and the Director
    of Central Intelligence has raised concern about changing representation before Defense has adequate intelligence support.
    The administration has two weeks remaining, and the question is how far to reorganize intelligence during that period.
  question: What should the National Security Council do about revising the National Security Council Intelligence Directives
    and changing intelligence board membership during the administration’s final weeks?
  options:
    O1:
      do: The National Security Council should ask the Secretary of Defense to submit recommendations on the directives and
        intelligence board membership for consideration at the next Council meeting.
      move: ask
      irreversible: false
      to: The Secretary of Defense
    O2:
      do: The National Security Council should authorize immediate revisions to the directives and intelligence board membership,
        changing Defense authority and representation during its final weeks.
      move: act
      irreversible: true
    O3:
      do: The National Security Council should decline immediate revisions to the directives and intelligence board membership,
        retaining current Defense authority and representation during its final weeks.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The National Security Council Intelligence Directives refer to the Military Services rather than the Secretary of
      Defense, and amendments were proposed to give the Secretary authority to reorganize military intelligence within the
      Department of Defense.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Joint Study Group recommended that the Secretary of Defense and the Joint Chiefs of Staff, rather than the Military
      Services, be represented on the intelligence board.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Military Services opposed the proposed change in board membership, and the Director of Central Intelligence
      also opposed it.
  - id: F4
    kind: capability
    status: assessed
    fact: The President believed that about $1.1 billion was being spent on the Department of Defense intelligence function
      and that the function should be performed at less expense.
  - id: F5
    kind: capability
    status: assessed
    fact: The President believed that separate intelligence organizations for each Military Service impeded integration and
      strategic planning.
  - id: F6
    kind: capability
    status: assessed
    fact: The Military Services had personnel, competence, and intelligence background, while the Director of Central Intelligence
      believed a Secretary of Defense representative would lack adequate experience and support until Defense intelligence
      organization changed.
  - id: F7
    kind: capability
    status: assessed
    fact: The Secretary of Defense supported the proposed board-membership change and believed a Defense representative could
      prepare the Department’s position for board meetings.
  - id: F8
    kind: situation
    status: confirmed
    fact: The administration had two weeks remaining, and the policy question was how far to reorganize intelligence during
      that period.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    - O2
    weight: strong
    why: The President saw substantial Defense intelligence spending and separate Service organizations as reasons to improve
      economy, integration, and strategic planning. That supports pursuing reorganization, but does not by itself establish
      that all changes should be made immediately.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: strong
    why: The Services had intelligence personnel and experience, and the Director of Central Intelligence opposed changing
      representation before Defense had competent intelligence support. This weighs against an immediate board-membership
      change while that organizational capacity remains unsettled.
  - id: C3
    facts:
    - F1
    - F2
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The directives addressed the Services rather than the Secretary of Defense, and the proposed changes affected both
      Defense authority and board organization. The Secretary supported the membership change and believed a Defense representative
      could present the Department's position, but those views were not shared by all Principals; asking for recommendations
      allows the authority and representation questions to be addressed together.
  - id: C4
    facts:
    - F8
    equity: tempo
    favors:
    - O1
    weight: strong
    why: With only two weeks remaining, the President distinguished agreed matters that could be directed from other questions
      whose views could be passed to the successor. Seeking recommendations for the next Council meeting fit that limited
      time and avoided treating unresolved reorganization choices as settled.
  reasoning:
    read: The choice was not simply integration or no integration. The President favored a more integrated intelligence organization,
      but changing board membership before Defense had adequate intelligence support risked separating representation from
      the reorganization it was meant to reflect. The trap is to treat the case for long-term integration as a reason to make
      every related change immediately.
    weighing: The President's concerns about expense, separate Service organizations, and strategic planning supported pursuing
      change {C1}. But the Services' existing expertise and the Director of Central Intelligence's concern about inadequate
      Defense support weighed against immediate board changes {C2}. Because the directives governed both Defense authority
      and board organization, and the Principals disagreed about representation, the Council's chosen course was to obtain
      the Secretary of Defense's recommendations and consider them alongside the Principals' views {C3}. The short remaining
      period favored acting on agreed matters while leaving unresolved questions for further consideration {C4}. The balance
      could change if Defense developed the intelligence capability needed to support a knowledgeable representative.
    tradecraft: Separate agreed recommendations from unresolved ones, request the Secretary of Defense's proposed directive
      revisions, and place those proposals together with the Principals' views before the next Council meeting. Record the
      reasons for deferring disputed membership changes and the conditions relevant to reconsidering them.
    uncertainty: The record does not establish that the proposed Defense reorganization had supplied a representative with
      adequate intelligence support, nor does it resolve the Principals' disagreement over board membership. It also does
      not settle which specific directive revisions should ultimately be adopted.
    handoff: Involve the Secretary of Defense to prepare the proposed revisions and the Director of Central Intelligence to
      consolidate the Principals' views, then return the matter to the National Security Council for consideration.
    tempting_wrong:
      option: O2
      pull: Immediate changes appear to advance the President's stated goals of economy, integration, and stronger strategic
        planning.
      why_wrong: Those goals did not resolve the concern that a Defense representative would lack adequate intelligence support
        before Defense's organization changed, and the board-membership proposal remained disputed.
    rejected:
      O2: The Council did not authorize immediate directive and board changes because the membership question was disputed
        and the adequacy of Defense intelligence support remained unresolved.
      O3: The Council did not reject revisions altogether because it still saw reasons to improve integration and agreed that
        the Secretary of Defense should develop recommendations for further consideration.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Defense reorganized its intelligence organization so that a knowledgeable Secretary of Defense representative had
        competent collectors and analysts supporting him.
      then: O2
      why: The Director of Central Intelligence said he would not disagree with changing board membership once those organizational
        changes provided adequate intelligence support.
    would_not_change:
    - id: noflip1
      if: A Defense representative could prepare and present the Department's position for board meetings but still lacked
        adequate intelligence support.
      why: The ability to present a departmental position alone would not answer the concern about the representative's intelligence
        experience and support, so it would not justify immediate changes.
    watch_for:
    - id: watch1
      what: The Secretary of Defense's recommendations and the consolidated views of the Joint Study Group Principals at the
        next Council meeting.
      favors:
      - O1
      why: Those recommendations and views were designated for consideration before the Council resolved the directive and
        board-membership questions.
  lesson: A long-term case for integration does not alone justify immediate changes to authority and representation when the
    organization that must support those changes is not yet ready. When time is short and the Principals disagree, advance
    agreed work and obtain recommendations on unresolved matters before committing to a broader reorganization.
  limits: This reasoning concerns the Council's 1961 choice about Defense intelligence authority and board membership during
    the administration's final weeks. It does not determine the merits or timing of later organizational changes once Defense
    intelligence capability and the Principals' views are clearer.
