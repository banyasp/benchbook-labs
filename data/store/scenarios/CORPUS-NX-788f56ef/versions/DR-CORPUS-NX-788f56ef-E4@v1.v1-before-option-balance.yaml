case:
  id: DR-CORPUS-NX-788f56ef-E4@v1
  title: Balancing Limited-War Capability and General-War Readiness
  status: draft
  setting: United States, National Security Council discussion of the limited-war study and FY 1962 budget, after July 1960.
  decider: The National Security Council, with its actions subject to the President's approval.
  agent: The National Security Council
  agent_role: decide
  situation: The council is considering whether to make a major resource shift toward limited-war capability or retain a balanced
    military program. The Joint Chiefs cautioned that limited-war studies were not a valid basis for programming or decision-making,
    and assessed that any one limited-war situation could require prompt mobilization and other measures. They estimated that
    airlift would be short during the first twenty days of a Korea-scale resumption of hostilities, while sealift was generally
    adequate with a possible shortage during the first sixty days. Military logistics guidance had been issued but was not
    fully implemented, and the services had differing readiness and equipment concerns. Southeast Asia operations faced logistical
    limitations, with some countermeasures already in place or under consideration. Additional funding could alleviate many
    deficiencies, but not all could be remedied at once; the planning constraint was to avoid an unacceptable degradation
    of general-war capability for contingencies within the general magnitude of the Korean contingency plan.
  question: What should the National Security Council do about making a major resource shift toward limited-war capability
    or retaining a balanced military program with planned improvements?
  options:
    O1:
      do: The National Security Council would decline a major resource shift, retain the balanced program, and continue planned
        improvements.
      move: act
      irreversible: false
    O2:
      do: The National Security Council would authorize a major resource shift toward limited-war capabilities and add planned
        improvements.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The Joint Chiefs assessed that limited-war studies are not a valid basis for programming or decision-making.
  - id: F2
    kind: capability
    status: assessed
    fact: The Joint Chiefs assessed that meeting any one limited-war situation could require prompt partial mobilization and
      other measures, without unacceptably degrading overall general-war capability.
  - id: F3
    kind: capability
    status: assessed
    fact: For a resumption of hostilities on the scale of Korea, airlift was expected to be short during the first twenty
      days and adequate thereafter.
  - id: F4
    kind: capability
    status: assessed
    fact: The Joint Chiefs assessed that sealift capabilities were generally adequate, although there might be a shortage
      during the first sixty days of hostilities.
  - id: F5
    kind: situation
    status: confirmed
    fact: Military logistics guidance had been issued the previous March but had not yet been fully implemented.
  - id: F6
    kind: capability
    status: assessed
    fact: 'The services had differing capability concerns: the Army faced unit availability, equipment modernization, and
      general-war readiness issues; the Navy could not meet some mobilization objectives; and the Marines faced reserve and
      stock-reconstitution problems, while the Air Force was generally ready for limited-war operations.'
  - id: F7
    kind: capability
    status: assessed
    fact: Limited operations in Southeast Asia were constrained by inadequate and vulnerable communications, transportation,
      port, and terminal facilities; some countermeasures had been taken or were possible.
  - id: F8
    kind: situation
    status: assessed
    fact: Additional funding could alleviate many identified deficiencies, but total requirements meant that not all deficiencies
      could be remedied at once.
  - id: F9
    kind: situation
    status: assessed
    fact: The logistics-support planning constraint was to address contingencies no greater in general magnitude than the
      Korean contingency plan without unacceptably degrading overall general-war capability.
  considerations:
  - id: C1
    facts:
    - F1
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Joint Chiefs cautioned that limited-war studies are not a valid basis for programming or decision-making; the
      study's identified deficiencies therefore did not, by themselves, justify a major resource shift.
  - id: C2
    facts:
    - F2
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The assessment was that planned logistics support could address contingencies within the general magnitude of the
      Korean plan without unacceptably degrading general-war capability, provided the required mobilization and other measures
      were taken.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F6
    - F7
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The first-period airlift and possible sealift shortages, incomplete guidance, service-specific readiness problems,
      and vulnerable Southeast Asia facilities were genuine weaknesses. Some countermeasures were already in place or possible,
      and these deficiencies did not establish that a major shift was required.
  - id: C4
    facts:
    - F8
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Additional funding could alleviate many deficiencies, but total requirements meant that not all could be remedied
      at once; the Joint Chiefs concluded that a balanced program did not require a radical allocation to limited-war capability.
  reasoning:
    read: 'The situation was not one of having no limited-war capability: the council judged current capabilities substantial
      and expected further improvement. The trap is to treat real deficiencies as proof that a major resource shift is necessary,
      even though the Joint Chiefs cautioned against using limited-war studies as a programming basis and assessed capability
      against bounded contingencies.'
    weighing: The early lift shortages and service and regional constraints count in favor of further improvement {C3}. But
      the council accepted the assessment that planned support could meet contingencies within the Korean-plan scale without
      an unacceptable loss of general-war capability {C2}, and that the submitted budget and other actions would improve substantial
      existing capabilities without a radical reallocation {C1} {C4}. The balance depends on those assessments and on the
      stated contingency scale; it does not imply that every deficiency is already fixed.
    tradecraft: Record the decision as retaining a balanced program with planned improvements, and state the contingency scale
      and the general-war constraint that bound the assessment. Preserve the identified deficiencies and the limits of the
      study in the record rather than presenting the capability judgment as unconditional.
    uncertainty: The capability judgment is bounded by the stated contingency assumptions, and the source identifies shortages
      and incomplete implementation. It does not provide a basis for treating the assessment as a guarantee across contingencies
      beyond the stated general magnitude.
    handoff: The National Security Council made the policy judgment subject to the President's approval. As a decision practice,
      keep military capability assessments with the defense and military advisers while the council and President weigh the
      resource and policy tradeoff.
    tempting_wrong:
      option: O2
      pull: A major shift may seem warranted because the report identifies early lift shortages and unresolved service and
        Southeast Asia limitations.
      why_wrong: Those shortcomings were acknowledged, but the council accepted that capabilities were substantial and improving,
        that planned support was adequate within the stated contingency scale subject to the general-war constraint, and that
        the study itself was not a valid programming basis.
    rejected:
      O2: The council did not make a radical additional allocation to limited-war capability because it judged a balanced
        program and the submitted budget and other improvements sufficient for the stated planning scope.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A revised assessment established that planned improvements would not provide adequate support for contingencies
        within the stated Korean-plan magnitude without unacceptable degradation of general-war capability.
      then: O2
      why: That would undermine the capability and planning assumptions on which the council based its decision to retain
        the balanced program.
    would_not_change:
    - id: noflip1
      if: The initial airlift shortage for a Korea-scale resumption of hostilities remained, while airlift was assessed as
        adequate thereafter and the planned improvements remained in place.
      why: The council acknowledged an early shortfall while still endorsing substantial, improving capabilities and no radical
        resource shift.
    watch_for:
    - id: watch1
      what: Whether the issued logistics guidance is fully implemented and whether planned airlift and other improvements
        reduce the identified limitations.
      favors:
      - O1
      why: The council's judgment depended in part on improvement through the submitted budget and actions already underway.
  lesson: Do not convert every identified capability deficiency into a case for a major resource shift. Weigh deficiencies
    against the reliability and scope of the assessment, planned improvements, competing requirements, and the constraint
    against unacceptably degrading general-war capability.
  limits: This reasoning applies to the assessment and contingency scale described here, not to contingencies materially beyond
    the Korean-plan magnitude or to later evidence that planned improvements have failed. It does not decide operational plans
    or logistics techniques.
