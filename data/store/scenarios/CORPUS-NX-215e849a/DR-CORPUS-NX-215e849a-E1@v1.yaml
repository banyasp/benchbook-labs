case:
  id: DR-CORPUS-NX-215e849a-E1@v1
  title: Israeli Action After Palestinian Authority Inaction
  status: draft
  setting: Israel and the Palestinian Authority during the second intifada, in the Israeli government’s policy process.
  decider: The Israeli government
  agent: The Israeli government
  agent_role: decide
  situation: During the second intifada, Palestinian militants intensified suicide attacks against Israeli civilians after
    the Camp David negotiations collapsed. The Israeli government notified the Palestinian Authority about organizers it considered
    involved in terrorist activities, and the Palestinian Authority often alerted those organizers. Public places were assessed
    as extremely difficult to defend. The available policy choice was whether to rely on the Palestinian Authority to arrest
    named organizers or permit Israeli action if it failed to do so.
  question: What should the Israeli government do about named organizers when the Palestinian Authority fails to arrest them?
  options:
    O1:
      do: The Israeli government permits the IDF to act against named organizers after the Palestinian Authority fails to
        arrest them.
      move: act
      irreversible: true
    O2:
      do: The Israeli government prohibits the IDF from acting against named organizers after the Palestinian Authority fails
        to arrest them.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: After the Camp David negotiations collapsed in summer 2000, Palestinian militants intensified suicide attacks against
      Israeli civilians.
  - id: F2
    kind: situation
    status: confirmed
    fact: Israeli authorities increased the incidence of targeted killings in response to attacks on the country’s civilian
      population during the second intifada.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Israeli government frequently notified the Palestinian Authority about people on its list for terrorist activities.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Palestinian Authority often alerted organizers whose activities the Israeli government had reported.
  - id: F5
    kind: situation
    status: confirmed
    fact: When the Palestinian Authority failed to arrest organizers, the IDF acted against them.
  - id: F6
    kind: situation
    status: assessed
    fact: Defending the many public sites vulnerable to attacks was assessed as nearly impossible.
  - id: F7
    kind: situation
    status: assessed
    fact: Pinpoint attacks were assessed as producing far less collateral damage than artillery-type bombardments.
  - id: F8
    kind: situation
    status: assessed
    fact: The counteroffensive was assessed as reducing the organization and execution of terrorist bombings against Israeli
      civilians.
  - id: F9
    kind: situation
    status: confirmed
    fact: In an earlier campaign against the Black September movement, one of 13 killings resulted in the wrongful death of
      a Moroccan waiter in Lillehammer, Norway.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The government notified the Palestinian Authority, but it often alerted the organizers and failed to arrest them;
      relying on it alone therefore did not address the organizers when arrest failed.
  - id: C2
    facts:
    - F1
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Suicide attacks against civilians intensified, while defending the many public places vulnerable to attack was assessed
      as nearly impossible. In those circumstances, preemption was the only reasonable deterrent.
  - id: C3
    facts:
    - F7
    equity: third_party_harm
    favors:
    - O1
    weight: strong
    why: Pinpoint action was assessed as causing far less collateral damage than artillery-type bombardments, favoring it
      over a broader response.
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The counteroffensive was assessed as reducing the organization and execution of bombings against Israeli civilians.
  reasoning:
    read: This is a choice between relying on the Palestinian Authority after it fails to arrest named organizers and permitting
      Israeli action in response. The trap is treating notification as effective coordination when the Authority often alerted
      the organizers instead.
    weighing: The source favors O1 because suicide attacks against civilians intensified, public places were nearly impossible
      to defend, and it judged preemption the only reasonable deterrent. It also assessed that the counteroffensive reduced
      bombings and that pinpoint action caused less collateral damage than broad bombardment. The balance depends on the stated
      failure of arrest and the continuing threat to civilians.
    tradecraft: 'Keep the decision at the policy level: record whether the stated condition for action has occurred, the civilian-protection
      rationale, the expected distinction between the available responses, and the basis for the decision. Reassess if the
      threat or the Authority''s response changes; do not infer operational methods from this policy judgment.'
    uncertainty: The source offers assessments of deterrence and relative collateral harm, but does not quantify them or establish
      how they would apply in every case. It does not set out a legal standard or resolve the facts of any individual case.
    handoff: The Israeli government is the decider in this frame. The source identifies no separate approval authority; involving
      relevant legal and policy advisers to review authority and the stated grounds is a decision-process safeguard, not a
      reason the source gives for O1.
    tempting_wrong:
      option: O2
      pull: Prohibiting action may seem to avoid the risks of acting after the Palestinian Authority has been notified.
      why_wrong: The stated reasons for O1 are that the Authority often alerted organizers, failed arrests left the threat
        unaddressed, and public places were nearly impossible to defend.
    rejected:
      O2: The Israeli government did not favor relying on the Palestinian Authority alone after failed arrests, given its
        frequent alerts to organizers, the difficulty of defending public places, and the assessed reduction in bombings from
        the counteroffensive.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Palestinian Authority reliably arrested the named organizers after notification, rather than alerting them or
        failing to arrest them.
      then: O2
      why: That would remove the stated basis for action after failed arrests and make reliance on the Authority more effective.
    - id: flip2
      if: The assessed suicide-bombing threat materially subsided and public places could be defended effectively.
      then: O2
      why: The main justification for preemption depends on the severe threat and the near impossibility of defending public
        sites.
    would_not_change:
    - id: noflip1
      if: The Palestinian Authority continues to fail to arrest organizers and often alerts them.
      why: That condition reinforces rather than reverses the reason not to rely on the Authority alone.
    watch_for:
    - id: watch1
      what: Whether the threat to civilians and the Authority's response change after notification.
      favors:
      - O1
      - O2
      why: The policy rationale depends on both the continuing bombing threat and the failure of arrests; a change in either
        could alter the balance.
  lesson: When a notified partner fails to arrest organizers and instead alerts them, reliance on that partner alone may leave
    civilians exposed. Preemption is favored where public sites are nearly impossible to defend, while the decision also weighs
    the assessed reduction in attacks against the lower collateral harm of pinpoint action compared with broad bombardment.
  limits: This reasoning concerns the policy choice described and does not establish legal authority, a legal standard, or
    the permissibility of action in any particular case. It also does not determine how an individual target should be assessed.
