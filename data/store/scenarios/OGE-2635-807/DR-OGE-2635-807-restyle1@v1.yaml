case:
  id: DR-OGE-2635-807-restyle1@v1
  title: SEC Employee Compensation for Securities Regulation Book [restyle]
  status: needs_review
  setting: Financial Markets Oversight Authority, United States, present
  decider: the analyst
  agent: the analyst
  agent_role: decide
  situation: An analyst employed by the Financial Markets Oversight Authority is drafting a manuscript that concentrates exclusively
    on the oversight of the securities market in the United States. The manuscript directly addresses the Authority's regulatory
    frameworks and operational practices. Under the agency's ethics regulations, any remuneration for authoring material that
    pertains to an employee's official responsibilities is prohibited unless a designated exemption applies. The analyst does
    not qualify as a special Government employee, and the work does not satisfy the teaching-course exemption. The analyst
    is weighing whether to accept royalty payments for the manuscript.
  question: How should the analyst proceed regarding receipt of royalties for the manuscript on market oversight?
  options:
    O1:
      do: The analyst may accept royalty payments for the manuscript.
      move: act
      irreversible: true
    O2:
      do: The analyst may decline royalty payments for the manuscript.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analyst is a civil servant of the Financial Markets Oversight Authority.
  - id: F2
    kind: situation
    status: confirmed
    fact: The manuscript concentrates exclusively on the oversight of the securities market in the United States.
  - id: F3
    kind: situation
    status: confirmed
    fact: The content of the manuscript concerns the Authority's regulatory frameworks or operational practices.
  - id: F4
    kind: authority
    status: confirmed
    fact: Remuneration for teaching, speaking, or authoring material that relates to an employee's official responsibilities
      is prohibited unless an exemption applies.
  - id: F5
    kind: authority
    status: confirmed
    fact: An activity is deemed related to official responsibilities when it substantially addresses an ongoing or announced
      policy, program, or operation of the agency.
  - id: F6
    kind: authority
    status: confirmed
    fact: Remuneration includes any form of payment, such as royalties, provided for or in connection with the employee's
      authorship.
  - id: F7
    kind: authority
    status: confirmed
    fact: No teaching-course exemption applies because the work is a manuscript, not a regularly scheduled course offered
      by an accredited institution or a government-sponsored program.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Because the manuscript's subject matter substantially addresses the Authority's regulatory frameworks and operational
      practices, the regulation classifies it as relating to the analyst's official responsibilities.
  - id: C2
    facts:
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Remuneration for authorship that relates to official responsibilities is expressly barred by §2635.807(a); royalties
      count as remuneration.
  - id: C3
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: No statutory exemption is available—the work is not a teaching-course exemption and the analyst does not meet the
      special Government employee criteria.
  - id: C4
    facts:
    - F1
    equity: public_transparency
    favors:
    - O2
    weight: weak
    why: Accepting royalties would create the appearance of exploiting official position for personal gain, thereby eroding
      public confidence in the Authority.
  reasoning:
    read: 'The analyst intends to author a manuscript that directly examines the Authority''s oversight programs. The ethics
      regulations forbid any compensation for writing that relates to an employee''s official responsibilities unless a specific
      exemption is triggered. The scenario presents a classic dilemma: the analyst''s expertise makes the manuscript marketable,
      yet the subject ties it to official duties.'
    weighing: The agency's own illustrative case (Example 4 to paragraph (a)(2)(i)) plainly states that an Authority analyst
      may not be compensated for such a manuscript. {C1} demonstrates that the activity satisfies the definition of "relates
      to official responsibilities." {C2} applies the categorical prohibition on remuneration. {C3} confirms the absence of
      an applicable exemption. Even the less weighty {C4} underscores the reputational risk. All considerations converge on
      declining remuneration.
    tradecraft: The analyst should refuse any royalty contract, record the decision in the Authority's conflict-of-interest
      system, and, if a publisher requests payment, advise that the work must be unpaid or that the analyst must withdraw
      from the project.
    uncertainty: Minimal – the regulation and the cited illustrative case directly address this factual pattern.
    handoff: The analyst can reach the decision independently but should inform the Authority's ethics office for documentation
      and to obtain formal confirmation that no exemption applies.
    tempting_wrong:
      option: O1
      pull: Royalties would generate personal income and enhance professional stature.
      why_wrong: The regulation expressly forbids remuneration because the manuscript's focus is the Authority's oversight
        programs, making the activity relate to official responsibilities.
    rejected:
      O1: The manuscript's focus is a direct exposition of the Authority's regulatory framework, which the ethics rule bars
        from being compensated.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the manuscript were confined to general investment guidance and contained only incidental references to Authority
        regulations, without concentrating on the agency's programs
      then: O1
      why: the activity would no longer satisfy the definition of relating to official responsibilities under §2635.807(a)(2)(i)(E).
    would_not_change:
    - id: noflip1
      if: the analyst were a special Government employee, even with service under 60 days
      why: the prohibition on remuneration for matters concerning the agency's programs also extends to special Government
        employees.
    watch_for:
    - id: watch1
      what: any segment of the manuscript that explores Authority policy specifics or ongoing enforcement initiatives
      favors:
      - O2
      why: such content would re-establish the link to official responsibilities, triggering the prohibition.
  lesson: Remuneration for authoring material that concentrates on an agency's own regulatory programs is prohibited unless
    the work is unrelated to official responsibilities; the decisive test is whether the subject matter deals substantially
    with the agency's policies, programs, or operations.
  limits: The rule does not apply to works that merely touch on the industry in a broad, non-agency-specific manner, or to
    teaching activities that fall within the curriculum exemption. It also does not cover special Government employees whose
    brief service does not involve a particular matter concerning specific parties.
