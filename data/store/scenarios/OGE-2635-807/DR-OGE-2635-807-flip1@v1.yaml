case:
  id: DR-OGE-2635-807-flip1@v1
  title: SEC Employee Compensation for Securities Regulation Book [flip]
  status: needs_review
  setting: Securities and Exchange Commission, United States, present day
  decider: the staff member
  agent: the staff member
  agent_role: decide
  situation: A staff member of the SEC is drafting a manuscript that offers broad personal-finance advice and investment strategies.
    The SEC is mentioned only in passing as part of a general market overview. Under the agency's ethics rules, any compensation
    for writing that is tied to an employee's official duties is barred unless a specific exemption applies. The employee
    is not a special-government employee and the work does not qualify for the teaching-course exception. The staff member
    is weighing whether to accept royalty payments for the book.
  question: Should the staff member accept royalty compensation for the investment-advice book?
  options:
    O1:
      do: The staff member may accept royalty compensation for the book.
      move: act
      irreversible: true
    O2:
      do: The staff member should decline any royalty compensation for the book.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The individual works as a civil servant within the U.S. Securities and Exchange Commission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The book offers broad personal‑finance guidance and investment tips, mentioning the SEC only in passing as a regulatory
      background.
  - id: F3
    kind: situation
    status: confirmed
    fact: The content primarily addresses general market investing strategies, with only occasional references to SEC rules
      that are not central to the discussion.
  - id: F4
    kind: authority
    status: confirmed
    fact: Payment for any instructional, speaking, or authorial activity that is connected to an employee's official responsibilities
      is forbidden unless a statutory exemption is present.
  - id: F5
    kind: authority
    status: confirmed
    fact: An undertaking is deemed to relate to official duties if a substantial portion addresses a current or announced
      agency policy, program, or operation.
  - id: F6
    kind: authority
    status: confirmed
    fact: Remuneration encompasses any type of payment—royalties, fees, or other financial benefit—provided for or linked
      to the employee's written work.
  - id: F7
    kind: authority
    status: confirmed
    fact: The teaching-course exemption does not apply, as the output is a book rather than a recurring course delivered by
      an accredited school or a government-backed program.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The manuscript deals only incidentally with SEC rules and does not focus on the agency's policies or operations;
      therefore it does not relate to official duties under the definition in §2635.807(a)(2)(i)(E).
  - id: C4
    facts:
    - F1
    equity: public_transparency
    favors:
    - O2
    weight: weak
    why: Accepting royalties could be perceived as using the employee's official position for private gain, which may erode
      public confidence in the SEC.
  reasoning:
    read: The staff member intends to publish a book that largely provides generic investment guidance. Because the content
      does not focus on SEC regulatory programs, it falls outside the scope of activities that relate to official duties.
      Consequently, the prohibition on compensated writing does not apply, and the employee may accept royalties.
    weighing: Consideration {C1} establishes that the work is not substantially about SEC programs, so the compensation ban
      does not trigger. {C4} raises a modest appearance concern, but its weak weight does not outweigh the clear allowance
      identified in {C1}. Thus the balance favors accepting compensation.
    tradecraft: The staff member should sign a royalty agreement, disclose the income in the agency's financial-interest system,
      and retain a copy of the manuscript for agency records. No further ethics clearance is required.
    uncertainty: Low – the facts and the regulatory definition clearly separate the manuscript from official-duty writing.
    handoff: The decision can be made by the staff member alone, though a brief notification to the agency's ethics office
      is advisable for transparency.
    tempting_wrong:
      option: O2
      pull: Avoiding any appearance of conflict and preserving the agency's reputation.
      why_wrong: The appearance concern is outweighed by the fact that the book does not relate to official duties, so the
        compensation prohibition does not apply.
    rejected:
      O2: Because the manuscript is general investment advice and only marginally references the SEC, the ethics rule does
        not bar royalty payments.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: the manuscript were rewritten to focus primarily on SEC regulatory frameworks and ongoing enforcement actions, making
        the content central to the agency's programs
      then: O2
      why: The activity would then relate to official duties, re-activating the compensation prohibition and rendering O2
        the correct choice.
    would_not_change:
    - id: noflip1
      if: the staff member were classified as a special-government employee, even for a brief assignment
      why: The compensation restriction applies equally to special-government employees when the work concerns agency programs.
    watch_for:
    - id: watch1
      what: any chapter that expands into detailed analysis of SEC policy or current enforcement initiatives
      favors:
      - O2
      why: Such material would shift the work back into the realm of official-duty writing, triggering the ban on compensation.
  lesson: Compensation for a written work is permissible when the content is general and does not deal in significant part
    with the agency's own policies, programs, or operations. The key test is whether the material relates to official duties
    under §2635.807(a)(2)(i)(E).
  limits: The rule does not extend to works that merely mention the agency in passing or that provide broad industry commentary.
    It also does not cover teaching activities that satisfy the curriculum exception, nor does it apply to special-government
    employees whose brief service does not involve agency-specific matters.
