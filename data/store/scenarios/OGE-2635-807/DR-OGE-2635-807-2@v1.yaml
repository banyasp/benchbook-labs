case:
  id: DR-OGE-2635-807-2@v1
  title: EEOC Employee Teaching Compensation Decision
  status: draft
  setting: State college and bar association continuing‑education program, present
  decider: EEOC attorney
  agent: ethics‑assistant AI
  agent_role: advise
  situation: An attorney employed by the Equal Employment Opportunity Commission is offered payment to teach a course on EEOC
    enforcement of federal employment discrimination law at a state college. The same attorney is also offered payment to
    teach the identical seminar as part of a continuing‑education program sponsored by a bar association. The course content
    focuses on EEOC enforcement, which ordinarily relates to the attorney’s official duties. The state college qualifies as
    an institution of higher education, while the bar‑association program does not fall within the categories listed for permissible
    compensation. The applicable regulation permits compensation only when the teaching activity is part of the regularly
    established curriculum of an accredited higher‑education institution, an elementary or secondary school, or a government‑sponsored
    program. The attorney must decide whether to accept compensation for each teaching opportunity.
  question: What should the ethics‑assistant advise the EEOC attorney to do regarding compensation for each teaching opportunity?
  options:
    O1:
      do: The attorney may accept state‑college payment and decline bar‑association payment.
      move: act
      irreversible: false
    O2:
      do: The attorney may decline state‑college payment and accept bar‑association payment.
      move: act
      irreversible: false
    O3:
      do: The attorney may defer the decision pending further guidance.
      move: hold
      irreversible: false
    O4:
      do: The attorney may request an ethics advisory opinion before deciding.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The attorney is employed by the Equal Employment Opportunity Commission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The attorney is offered compensation to teach a course on EEOC enforcement of employment discrimination law at a
      state college.
  - id: F3
    kind: authority
    status: confirmed
    fact: A state college is an institution of higher education as defined in 20 U.S.C. 1001.
  - id: F4
    kind: situation
    status: confirmed
    fact: The attorney is offered compensation to teach the same seminar as part of a continuing‑education program sponsored
      by a bar association.
  - id: F5
    kind: authority
    status: confirmed
    fact: The bar‑association continuing‑education program is not an institution of higher education, elementary school, secondary
      school, nor a government‑sponsored program.
  - id: F6
    kind: authority
    status: confirmed
    fact: Under §2635.807(a)(3), compensation is permissible for teaching courses that are part of the regularly established
      curriculum of an institution of higher education, an elementary school, a secondary school, or a program sponsored and
      funded by the Federal, State, or local government.
  - id: F7
    kind: situation
    status: assessed
    fact: The state‑college course relates to EEOC enforcement, which would otherwise relate to the attorney’s official duties,
      but the exception in §2635.807(a)(3) applies because the course is part of the regular curriculum of an accredited higher‑education
      institution.
  - id: F8
    kind: situation
    status: assessed
    fact: The bar‑association seminar does not meet the exception, so compensation would be prohibited under the same regulation.
  - id: F9
    kind: authority
    status: confirmed
    fact: The EEOC attorney has authority to accept or decline compensation in accordance with 5 C.F.R. §2635.807.
  considerations:
  - id: C1
    facts:
    - F3
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: §2635.807(a)(3) expressly permits compensation when the teaching activity is part of the regularly established curriculum
      of an institution of higher education; a state college meets that definition.
  - id: C2
    facts:
    - F5
    - F6
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The bar‑association continuing‑education program is not an accredited higher‑education institution, nor a government‑sponsored
      program, so compensation is prohibited under the same provision.
  - id: C3
    facts:
    - F2
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Although the course content relates to the attorney’s official EEOC duties, the exception in §2635.807(a)(3) shields
      the state‑college teaching from the general prohibition.
  reasoning:
    read: 'The attorney is asked to be paid for teaching identical EEOC‑enforcement material in two venues: a state college
      (an accredited higher‑education institution) and a bar‑association continuing‑education program (not listed among permissible
      venues). The trap is that the content itself ties to official duties, which normally bars compensation, but the regulation
      carves out an exception for regular curricula at accredited schools.'
    weighing: Applying C1 and C3, the state‑college opportunity falls within the statutory exception, so compensation is allowed.
      Applying C2, the bar‑association program lacks the statutory exception, making compensation prohibited. The balance
      therefore favors accepting payment only for the state‑college class.
    tradecraft: The attorney should formally accept the state‑college fee, retain documentation of the contract, and ensure
      the course is listed in the college’s regular curriculum. No additional agency approval is required by the regulation,
      but agency conflict‑of‑interest policies should be checked. The bar‑association offer must be declined in writing, citing
      §2635.807(a)(3).
    uncertainty: Minimal; the regulation’s language and the examples are clear.
    handoff: The attorney can act independently but should inform the EEOC’s ethics office of the accepted state‑college payment
      for record‑keeping.
    tempting_wrong:
      option: O2
      pull: The same subject matter and identical compensation terms make the bar‑association offer appear equally attractive.
      why_wrong: The venue does not satisfy the statutory exception, so accepting would violate §2635.807(a)(3).
    rejected:
      O2: The bar‑association program is not an accredited institution or government‑sponsored program, so compensation is
        prohibited.
      O3: Deferring the decision provides no benefit; the regulation already gives a clear answer.
      O4: An advisory opinion is unnecessary because the rule is explicit and binding.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the bar‑association continuing‑education program were a government‑sponsored or accredited higher‑education program
      then: O1
      why: The venue would then fall within the statutory exception of §2635.807(a)(3).
    would_not_change:
    - id: noflip1
      if: the course content were unrelated to EEOC enforcement
      why: Both venues would then be permissible, but the decision to accept only the state‑college payment would still satisfy
        the regulation.
    watch_for:
    - id: watch1
      what: any reclassification of the bar‑association program as a government‑funded training initiative
      favors:
      - O1
      why: Such a reclassification would bring the program within the permissible categories of §2635.807(a)(3).
  lesson: Federal employees may receive compensation for teaching only when the activity is part of the regularly established
    curriculum of an accredited higher‑education institution or a government‑sponsored program; otherwise compensation is
    prohibited.
  limits: This rule applies solely to compensation for teaching activities. It does not govern speaking, writing, travel reimbursements,
    or other forms of outside earned income, which are addressed in separate subsections of the ethics regulations.
