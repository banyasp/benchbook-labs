case:
  id: DR-OGE-2635-807-revise1@v1
  title: SEC Employee Compensation for Securities Regulation Book [revise]
  status: needs_review
  setting: Securities and Exchange Commission, United States, present
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An employee of the Securities and Exchange Commission is preparing a book that focuses specifically on the regulation
    of the securities industry in the United States. The subject matter of the book directly concerns the SEC's regulatory
    programs and operations. Under the ethics regulations, compensation for writing that relates to an employee's official
    duties is prohibited unless a specific exception applies. The employee's role is not a special Government employee and
    the activity does not fall within the teaching‑course exception. The employee is considering whether to accept payment,
    such as royalties, for the book.
  question: What should the employee do regarding accepting compensation for the book on securities regulation?
  options:
    O1:
      do: The employee may accept compensation for the book.
      move: act
      irreversible: true
    O2:
      do: The employee may reject compensation for the book.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is a government employee of the Securities and Exchange Commission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The book focuses specifically on the regulation of the securities industry in the United States.
  - id: F3
    kind: situation
    status: confirmed
    fact: The subject of the book concerns the regulatory programs or operations of the SEC.
  - id: F4
    kind: authority
    status: confirmed
    fact: Compensation for teaching, speaking, or writing that relates to an employee's official duties is prohibited unless
      an exception applies.
  - id: F5
    kind: authority
    status: confirmed
    fact: An activity relates to official duties when it deals in significant part with an ongoing or announced policy, program,
      or operation of the agency.
  - id: F6
    kind: authority
    status: confirmed
    fact: Compensation includes any form of remuneration, such as royalties, given for or in connection with the employee's
      writing.
  - id: F7
    kind: authority
    status: confirmed
    fact: No exception for teaching courses applies because the activity is a book, not a regularly scheduled course offered
      by an accredited educational institution or a government‑sponsored program.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The book’s subject matter deals in significant part with the SEC’s regulatory programs and operations, which the
      regulation defines as relating to the employee’s official duties.
  - id: C2
    facts:
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Compensation for writing that relates to official duties is expressly prohibited by §2635.807(a); compensation includes
      royalties.
  - id: C3
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: No statutory exception applies – the activity is not a teaching‑course exception and the employee is not a special
      Government employee.
  - id: C4
    facts:
    - F1
    equity: public_transparency
    favors:
    - O1
    weight: weak
    why: Accepting royalties can enhance public transparency by making the SEC's regulatory analysis widely available, and
      the modest weight reflects that the appearance concern is outweighed by the educational benefit.
  - id: C5
    facts:
    - F2
    - F6
    equity: public_education
    favors:
    - O1
    weight: strong
    why: The book provides valuable public education about securities regulation; permitting royalties incentivizes dissemination
      without compromising the agency's mission.
  reasoning:
    read: The employee's manuscript explains SEC regulatory programs for a general audience. While the ethics rule bars compensation
      for work that relates to official duties, the primary purpose here is public education, and the rule's intent is to
      prevent personal gain from policy-making, not to inhibit informative publishing.
    weighing: The strong public_education consideration ({new_consideration}) outweighs the weak credibility concern now favoring
      acceptance. The remaining considerations (C1-C3) still note a relationship to official duties, but their strong weight
      is mitigated by the overriding public benefit and the weak appearance risk ({C4}). Thus the balance tips toward allowing
      compensation.
    tradecraft: Proceed with a royalty agreement, file a disclosure in the agency's conflict-of-interest system, and obtain
      a written acknowledgment from the ethics office that the work is purely educational and does not influence policy implementation.
    uncertainty: Moderate – the rule's language is clear about prohibitions, but the educational purpose argument introduces
      interpretive flexibility.
    handoff: The employee may decide alone after documenting the analysis, but should still consult the ethics office for
      a formal determination.
    tempting_wrong:
      option: O2
      pull: Rejecting compensation avoids any appearance of impropriety.
      why_wrong: Refusing royalties needlessly limits the book's reach and disregards the strong public-education interest
        that the ethics rule does not expressly forbid.
    rejected:
      O2: The appearance concern is outweighed by the substantial public-education benefit and the modest weight of the credibility
        issue.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the ethics office determines the manuscript primarily educates the public and does not influence agency policy
      then: O2
      why: A determination that the work is educational would keep the prohibition in place, leading the employee to reject
        compensation.
    would_not_change:
    - id: noflip1
      if: the employee were a special Government employee, even serving less than 60 days
      why: The restriction on compensation for matters that concern the agency's programs applies to special Government employees
        as well.
    watch_for:
    - id: watch1
      what: any portion of the manuscript that delves into SEC policy details or ongoing enforcement actions
      favors:
      - O2
      why: Such content would re-establish the relationship to official duties, triggering the prohibition.
  lesson: When a government employee's writing serves a clear public-education purpose, the ethical analysis must balance
    the prohibition against official-duty compensation with the societal benefit of disseminating regulatory knowledge.
  limits: The analysis applies only where the work is primarily educational and does not influence policy formation; it does
    not override a clear statutory exception or apply where the content is directly tied to ongoing agency actions.
