case:
  id: DR-OGE-2635-807-1@v1
  title: SEC Employee Compensation for Securities Regulation Book
  status: draft
  setting: Securities and Exchange Commission, United States, present
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An employee of the Securities and Exchange Commission is preparing a book that focuses specifically on the regulation
    of the securities industry in the United States. The subject matter of the book directly concerns the SEC's regulatory
    programs and operations. Under the ethics regulations, compensation for writing that relates to an employee's official
    duties is prohibited unless a specific exception applies. The employee's role is not a special Government employee and
    the activity does not fall within the teaching‑course exception. The employee is considering whether to accept payment,
    such as royalties, for the book.
  question: What should the employee do regarding accepting compensation for the book on securities regulation?
  options:
    O1:
      do: The employee may accept compensation for the book.
      move: act
      irreversible: true
    O2:
      do: The employee may reject compensation for the book.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is a government employee of the Securities and Exchange Commission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The book focuses specifically on the regulation of the securities industry in the United States.
  - id: F3
    kind: situation
    status: confirmed
    fact: The subject of the book concerns the regulatory programs or operations of the SEC.
  - id: F4
    kind: authority
    status: confirmed
    fact: Compensation for teaching, speaking, or writing that relates to an employee's official duties is prohibited unless
      an exception applies.
  - id: F5
    kind: authority
    status: confirmed
    fact: An activity relates to official duties when it deals in significant part with an ongoing or announced policy, program,
      or operation of the agency.
  - id: F6
    kind: authority
    status: confirmed
    fact: Compensation includes any form of remuneration, such as royalties, given for or in connection with the employee's
      writing.
  - id: F7
    kind: authority
    status: confirmed
    fact: No exception for teaching courses applies because the activity is a book, not a regularly scheduled course offered
      by an accredited educational institution or a government‑sponsored program.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The book’s subject matter deals in significant part with the SEC’s regulatory programs and operations, which the
      regulation defines as relating to the employee’s official duties.
  - id: C2
    facts:
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Compensation for writing that relates to official duties is expressly prohibited by §2635.807(a); compensation includes
      royalties.
  - id: C3
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: No statutory exception applies – the activity is not a teaching‑course exception and the employee is not a special
      Government employee.
  - id: C4
    facts:
    - F1
    equity: public_transparency
    favors:
    - O2
    weight: weak
    why: Accepting payment would create the appearance of using official position for private gain, undermining public trust
      in the SEC.
  reasoning:
    read: 'The employee plans to write a book that directly addresses SEC regulatory programs. Under the ethics rules, any
      writing that relates to an employee’s official duties may not be compensated unless a specific exemption applies. The
      situation is a classic trap: the employee’s expertise makes the book attractive, but the subject matter ties it to official
      duties.'
    weighing: The source’s own example (Example 4 to paragraph (a)(2)(i)) states unequivocally that an SEC employee may not
      be paid for such a book. {C1} shows the activity meets the definition of “relates to official duties.” {C2} applies
      the blanket prohibition on compensation. {C3} confirms no exception is present. Even the weaker {C4} reinforces the
      institutional risk. All considerations point to rejecting compensation.
    tradecraft: The employee should decline any royalty agreement, document the decision in the agency’s conflict‑of‑interest
      system, and, if a publisher requests payment, inform them that the work must be unpaid or that the employee must withdraw
      from the project.
    uncertainty: Minimal – the regulation and the cited example directly address this fact pattern.
    handoff: The employee may make the decision alone but should notify the agency’s ethics office for record‑keeping and
      to obtain formal confirmation that no exception applies.
    tempting_wrong:
      option: O1
      pull: Royalties could provide personal income and professional recognition.
      why_wrong: The regulation expressly bars compensation because the book’s focus is the SEC’s regulatory programs, making
        the activity relate to official duties.
    rejected:
      O1: The book’s subject matter is a direct discussion of SEC regulation, which the ethics rule prohibits from being compensated.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the book were limited to general investment advice and contained only incidental references to SEC regulations,
        not focusing on the agency’s programs
      then: O1
      why: The activity would no longer relate to the employee’s official duties under the definition in §2635.807(a)(2)(i)(E).
    would_not_change:
    - id: noflip1
      if: the employee were a special Government employee, even serving less than 60 days
      why: The restriction on compensation for matters that concern the agency’s programs applies to special Government employees
        as well.
    watch_for:
    - id: watch1
      what: any portion of the manuscript that delves into SEC policy details or ongoing enforcement actions
      favors:
      - O2
      why: Such content would re‑establish the relationship to official duties, triggering the prohibition.
  lesson: Compensation for writing that focuses on an agency’s own regulatory programs is prohibited unless the work is unrelated
    to official duties; the key test is whether the subject deals in significant part with the agency’s policies, programs,
    or operations.
  limits: This rule does not apply to works that merely touch on the industry in a general, non‑agency‑specific way, or to
    teaching activities that fall within the curriculum exception. It also does not cover special Government employees whose
    service is brief and whose work does not involve a particular matter involving specific parties.
