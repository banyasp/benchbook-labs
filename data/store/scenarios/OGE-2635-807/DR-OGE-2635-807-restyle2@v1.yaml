case:
  id: DR-OGE-2635-807-restyle2@v1
  title: EEOC Employee Teaching Compensation Decision [restyle]
  status: needs_review
  setting: Federal agency training and professional development forum, current
  decider: Office of Federal Employment Rights counsel
  agent: compliance-review AI
  agent_role: advise
  situation: An attorney employed by the Equal Employment Opportunity Commission has been offered remuneration to teach a
    class on EEOC enforcement of workplace discrimination law at a regional university. The same attorney has also been offered
    remuneration to teach the identical class as part of a continuing-education series sponsored by the Legal Practitioners
    Society. The university qualifies as an institution of higher education, whereas the society's program does not fall within
    the categories enumerated for permissible compensation. The governing regulation allows remuneration only when the teaching
    activity is part of the regularly established curriculum of an accredited higher-education institution, an elementary
    or secondary school, or a government-sponsored program. The attorney must decide whether to accept remuneration for each
    teaching opportunity.
  question: What should the compliance-review AI advise the EEOC attorney to do regarding remuneration for each teaching opportunity?
  options:
    O1:
      do: Accept the university payment offer and decline the society's continuing-education remuneration.
      move: act
      irreversible: false
    O2:
      do: Decline the university payment offer and accept the society's continuing-education remuneration.
      move: act
      irreversible: false
    O3:
      do: Defer the decision until official further guidance is adequately provided by the agency.
      move: hold
      irreversible: false
    O4:
      do: Request a formal ethics advisory opinion before making a final determination.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The lawyer works for the Equal Employment Opportunity Commission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The lawyer receives an offer of remuneration to deliver a lecture on EEOC enforcement of workplace discrimination
      law at a regional university.
  - id: F3
    kind: authority
    status: confirmed
    fact: A regional university qualifies as a higher-education institution under 20 U.S.C. § 1001.
  - id: F4
    kind: situation
    status: confirmed
    fact: The lawyer also receives an offer of remuneration to present the identical lecture as part of a continuing-education
      series sponsored by the Legal Practitioners Society.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Legal Practitioners Society's continuing-education series is not a higher-education institution, nor an elementary
      or secondary school, nor a program funded by any level of government.
  - id: F6
    kind: authority
    status: confirmed
    fact: Under §2635.807(a)(3), compensation is allowed for teaching that occurs within the regularly established curriculum
      of a higher-education institution, an elementary school, a secondary school, or a program that is sponsored and financed
      by Federal, State, or local government.
  - id: F7
    kind: situation
    status: assessed
    fact: Although the university lecture concerns EEOC enforcement, which ordinarily falls within the lawyer's official responsibilities,
      the exemption in §2635.807(a)(3) applies because the lecture is part of the university's regular curriculum.
  - id: F8
    kind: situation
    status: assessed
    fact: The Legal Practitioners Society series does not satisfy the exemption, so remuneration would be prohibited by the
      same rule.
  - id: F9
    kind: authority
    status: confirmed
    fact: The EEOC lawyer has the authority to accept or reject remuneration in line with 5 C.F.R. § 2635.807.
  considerations:
  - id: C1
    facts:
    - F3
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Section 2635.807(a)(3) explicitly authorizes payment when the instructional activity is included in the regular curriculum
      of an accredited higher-education institution; the regional university meets that criterion.
  - id: C2
    facts:
    - F5
    - F6
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Because the Legal Practitioners Society's series is neither an accredited higher-education institution nor a government-sponsored
      program, the statute bars any payment for that venue.
  - id: C3
    facts:
    - F2
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Even though the subject matter overlaps with the lawyer's official EEOC duties, the statutory carve-out in §2635.807(a)(3)
      shields the university teaching from the general prohibition on compensation.
  reasoning:
    read: 'The attorney is asked to be paid for delivering identical EEOC-enforcement material in two settings: a regional
      university (an accredited higher-education institution) and a Legal Practitioners Society continuing-education series
      (not listed among permissible venues). The difficulty lies in the fact that the content aligns with official duties,
      which normally precludes payment, but the regulation contains an exception for regular curricula at accredited schools.'
    weighing: Applying C1 and C3, the university engagement falls within the statutory exemption, so remuneration is permissible.
      Applying C2, the society's series lacks the exemption, making remuneration prohibited. Consequently, the balance supports
      accepting payment only for the university lecture.
    tradecraft: The attorney should formally accept the university fee, retain a copy of the contract, and verify that the
      lecture is listed in the university's regular curriculum. No further agency approval is required by the regulation,
      though internal conflict-of-interest policies should be reviewed. The society's offer must be declined in writing, citing
      §2635.807(a)(3).
    uncertainty: Minimal; the statutory language and the identified examples are clear.
    handoff: The attorney may act on his own authority but should notify the EEOC ethics office of the accepted university
      remuneration for the record.
    tempting_wrong:
      option: O2
      pull: The identical subject matter and comparable compensation terms make the society's offer seem equally appealing.
      why_wrong: The venue does not satisfy the statutory exemption, so accepting would breach §2635.807(a)(3).
    rejected:
      O2: The Legal Practitioners Society's program is not an accredited institution or government-sponsored program, so remuneration
        is prohibited.
      O3: Deferring the decision yields no advantage; the regulation already provides a clear answer.
      O4: An advisory opinion is unnecessary because the rule is explicit and binding.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: if the Legal Practitioners Society's continuing-education series were a government-sponsored or accredited higher-education
        program
      then: O1
      why: the venue would then satisfy the statutory exemption of §2635.807(a)(3).
    would_not_change:
    - id: noflip1
      if: if the lecture material were unrelated to EEOC enforcement
      why: both venues would then be permissible, yet selecting only the university remuneration would still comply with the
        regulation.
    watch_for:
    - id: watch1
      what: any reclassification of the Legal Practitioners Society series as a government-funded training program
      favors:
      - O1
      why: such a reclassification would bring the series within the permissible categories of §2635.807(a)(3).
  lesson: Federal employees may receive remuneration for teaching only when the activity is part of the regularly established
    curriculum of an accredited higher-education institution or a government-sponsored program; otherwise, remuneration is
    prohibited.
  limits: This rule governs only compensation for teaching activities. It does not cover speaking engagements, authored publications,
    travel reimbursements, or other forms of outside earned income, which are addressed in separate sections of the ethics
    regulations.
