case:
  id: DR-OGE-2635-807-addfact1@v1
  title: SEC Employee Compensation for Securities Regulation Book [addfact]
  status: needs_review
  setting: U.S. Securities and Exchange Commission, current timeframe
  decider: the staff member
  agent: the staff member
  agent_role: decide
  situation: A staff member of the SEC is authoring a monograph that concentrates on U.S. securities regulation and directly
    addresses the Commission's regulatory programs and operations. Agency ethics rules forbid any remuneration for teaching,
    speaking, or writing that is linked to an employee's official duties unless a specific exemption applies. The activity
    does not qualify for the teaching-course exemption because it is a book, not a regularly scheduled course offered by an
    accredited institution or a government-sponsored program. Moreover, the staff member's employment contract requires that
    any outside compensation exceeding $5,000 annually receive prior approval from the SEC ethics office. The staff member
    must decide whether to accept royalties for the book.
  question: Should the staff member accept or decline compensation for the securities-regulation monograph?
  options:
    O1:
      do: Approve receipt of royalties for the monograph.
      move: act
      irreversible: true
    O2:
      do: Refuse any royalties for the monograph.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The staff member is a federal employee of the Securities and Exchange Commission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The monograph concentrates specifically on the regulation of the U.S. securities market.
  - id: F3
    kind: situation
    status: confirmed
    fact: The work's subject matter pertains to the SEC's regulatory programs or operational activities.
  - id: F4
    kind: authority
    status: confirmed
    fact: Compensation for teaching, speaking, or writing that is connected to an employee's official duties is prohibited
      unless an applicable exemption exists.
  - id: F5
    kind: authority
    status: confirmed
    fact: An activity is deemed related to official duties when it substantially involves an ongoing or announced agency policy,
      program, or operation.
  - id: F6
    kind: authority
    status: confirmed
    fact: Compensation includes any form of payment, such as royalties, provided for or in connection with the staff member's
      writing.
  - id: F7
    kind: situation
    status: assessed
    fact: The staff member's employment agreement mandates pre-approval from the SEC ethics office for any outside compensation
      that exceeds $5,000 per year.
  - id: F8
    kind: authority
    status: confirmed
    fact: The teaching-course exemption does not apply because the activity is a book rather than a regularly scheduled course
      offered by an accredited educational institution or a government-sponsored program.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Because the monograph's content substantially addresses the SEC's regulatory programs and operations, it falls within
      the definition of activity that relates to official duties.
  - id: C2
    facts:
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The ethics regulation bars any compensation, including royalties, for writing that relates to official duties, and
      the staff member's compensation would be a royalty.
  - id: C3
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The teaching-course exemption does not apply since the work is a book, not a scheduled course, and no other statutory
      exemption is available.
  - id: C4
    facts:
    - F1
    equity: public_transparency
    favors:
    - O2
    weight: weak
    why: Accepting royalties would appear to exploit the employee's official position for private gain, eroding public confidence
      in the Commission.
  - id: C5
    facts:
    - F7
    equity: contractual_obligation
    favors:
    - O2
    weight: weak
    why: The employment contract requires prior ethics‑office approval for any outside compensation over $5,000, which is
      unlikely to be granted given the prohibition on related‑duty compensation.
  reasoning:
    read: The staff member intends to publish a monograph that directly discusses SEC regulatory programs. Agency ethics rules
      forbid compensation for writing that relates to official duties unless a specific exemption applies, and the teaching-course
      exemption is inapplicable to a book.
    weighing: C1 establishes that the subject matter ties the work to official duties. C2 applies the blanket prohibition
      on compensation for such work. C3 confirms that no statutory exemption exists. The additional contractual concern (new
      consideration) reinforces the impracticality of obtaining approval. Even the weaker C4 about public perception supports
      refusal. All considerations converge on rejecting royalties.
    tradecraft: The staff member should decline any royalty agreement, record the decision in the agency's conflict-of-interest
      system, and notify any prospective publisher that the manuscript must be unpaid or that the employee will withdraw.
    uncertainty: Low – the regulation and the cited example directly address this scenario.
    handoff: The staff member can decide unilaterally but should inform the SEC ethics office to document the refusal and
      confirm that no exemption applies.
    tempting_wrong:
      option: O1
      pull: Royalties would provide personal income and enhance the staff member's scholarly reputation.
      why_wrong: The rule expressly forbids compensation for work that pertains to the employee's official duties, and the
        monograph's focus on SEC regulation triggers that prohibition.
    rejected:
      O1: The monograph's focus on SEC regulatory matters makes it subject to the prohibition on compensated writing.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: If the manuscript were confined to generic investment guidance and omitted any substantive discussion of SEC policies
        or programs
      then: O1
      why: The work would no longer be considered related to the employee's official duties, removing the statutory bar.
    would_not_change:
    - id: noflip1
      if: If the employee were classified as a special Government employee, even for a brief assignment
      why: The compensation restriction also applies to special Government employees when the work concerns agency matters.
    watch_for:
    - id: watch1
      what: any chapter that details current SEC policy initiatives or enforcement actions
      favors:
      - O2
      why: Such sections would re-establish a link to official duties, invoking the prohibition on royalties.
  lesson: When a federal employee writes about their agency's own regulatory framework, the ethics rules prohibit receiving
    royalties unless a specific exemption applies; the key test is whether the work substantially deals with agency policies,
    programs, or operations.
  limits: The prohibition does not extend to publications that only touch on the broader industry without focusing on agency-specific
    matters, nor to teaching activities that qualify for the curriculum exemption. It also does not bind special Government
    employees whose duties are unrelated to agency programs.
