case:
  id: DR-CORPUS-NX-4ca0d9de-E1@v1
  title: Revising Belgium’s 1993 Universal Jurisdiction Framework
  status: draft
  setting: Belgium, late June 2003, the federal government and legislature.
  decider: The Belgian legislature
  agent: The Belgian legislature
  agent_role: decide
  situation: Belgium’s 1993 law had been reconsidered after the International Court of Justice ruled that an arrest warrant
    had failed to account for the immunity of an incumbent foreign minister. A subsequent bill sought to align the law with
    the International Criminal Court Statute and existing international law, and the legislation was amended to provide procedural
    filters. Charges against US political and military leaders prompted increasingly harsh reactions, including warnings tied
    to NATO’s headquarters in Brussels. A US defense secretary also linked the US contribution to a new NATO headquarters
    to Belgium again being a hospitable place for NATO business, while acknowledging Belgium’s sovereignty. At the end of
    June 2003, Belgium’s foreign minister announced an intention to amend the law again after a new government had formed.
  question: What should the Belgian legislature do with the 1993 framework in response to the ICJ immunity ruling and diplomatic
    pressure tied to NATO’s presence in Belgium?
  options:
    O1:
      do: The Belgian legislature retains the 1993 framework without further statutory amendment.
      move: act
      irreversible: false
    O2:
      do: The Belgian legislature repeals the 1993 framework and adopts replacement rules with filters.
      move: act
      irreversible: true
    O3:
      do: The Belgian legislature amends the 1993 framework and keeps it in force with filters.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: On 14 February 2002, the International Court of Justice ordered Belgium to annul an arrest warrant that had not
      accounted for the immunity of heads of state and incumbent foreign ministers.
  - id: F2
    kind: situation
    status: confirmed
    fact: A bill addressing the International Criminal Court Statute and existing international law was presented to the Senate
      on 18 July 2002, approved on 30 January 2003, and forwarded to the Chamber on 5 February 2003.
  - id: F3
    kind: authority
    status: confirmed
    fact: The amended bill allowed the public prosecutor to refuse to instruct an examining magistrate in certain cases unconnected
      to Belgium and allowed the Justice Minister to issue a negative injunction, including referral to a state linked to
      the territory of the breach or the perpetrator’s nationality.
  - id: F4
    kind: situation
    status: confirmed
    fact: The amended law was passed on 23 April 2003.
  - id: F5
    kind: situation
    status: confirmed
    fact: Charges against US political and military leaders prompted increasingly harsh reactions, including threats to move
      NATO headquarters.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A US official targeted by a charge considered the Belgian Act a serious problem and warned Belgium, noting that
      NATO headquarters was in Brussels.
  - id: F7
    kind: situation
    status: confirmed
    fact: At a NATO defence ministers’ meeting, the US defense secretary called a lawsuit absurd, rejected Belgium’s authority
      to try American leaders, and made the US contribution to a new headquarters subject to assurances about Belgium’s hospitality
      for NATO business, while acknowledging Belgian sovereignty.
  - id: F8
    kind: situation
    status: confirmed
    fact: At the end of June 2003, Belgium’s foreign minister announced an intention to amend the law again after the new
      government had formed.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O3
    - O2
    weight: strong
    why: The ICJ ruling required Belgium to account for the immunity of incumbent foreign ministers, and the subsequent bill
      was intended to bring the law into line with the ICC Statute and existing international law. Retaining the framework
      without further change would not respond to that legal concern.
  - id: C2
    facts:
    - F3
    - F4
    equity: escalation_control
    favors:
    - O3
    weight: weak
    why: The April amendment introduced filters, including a route for referral to a state connected to the alleged breach
      or accused person. Those measures offered a way to retain the framework while limiting proceedings in some cases.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    - F8
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Charges against US leaders prompted increasingly harsh reactions, including threats concerning NATO’s presence in
      Belgium. The US defense secretary linked the US contribution to a new headquarters to assurances about Belgium’s hospitality
      for NATO business; the foreign minister then announced a further amendment. This escalating pressure culminated in repeal.
  reasoning:
    read: 'The choice was not just whether to preserve a broad framework or make a technical adjustment: Belgium had to respond
      to an ICJ ruling on incumbent officials’ immunity while facing mounting diplomatic pressure connected to NATO’s headquarters.
      The trap is to assume either that the April filters settled the matter or that the US acknowledgment of Belgian sovereignty
      meant the pressure had ended.'
    weighing: The ICJ ruling and the stated aim of aligning the law with international law weighed against retaining the framework
      unchanged {C1}. The April filters supplied a less drastic course {C2}, but US reactions continued to escalate despite
      the procedural changes {C3}. That combination led the legislature to repeal the 1993 framework and replace it with more
      restricted rules. The balance would have been different if the diplomatic pressure had not escalated or if the filters
      had been regarded as sufficient.
    tradecraft: Record separately the legal constraint created by the ICJ ruling, the limits of the existing filters, and
      the diplomatic considerations. State which considerations support the chosen statutory course, and avoid presenting
      external pressure as a substitute for legal analysis.
    uncertainty: The sequence connects escalating reactions to repeal, but does not establish that the ICJ ruling itself required
      repeal of the whole framework or that diplomatic pressure was the legislature’s sole reason.
    handoff: 'The legislature should involve the relevant legal authorities and the foreign ministry: the decision concerns
      compliance with international law as well as the diplomatic consequences tied to NATO’s presence. This coordination
      is a decision-practice recommendation, not a stated source rationale.'
    tempting_wrong:
      option: O3
      pull: The April amendment had already added filters and offered a way to keep the 1993 framework in force.
      why_wrong: Diplomatic reactions continued to escalate and ultimately led to repeal; the existence of filters did not
        settle the wider dispute.
    rejected:
      O1: It was not chosen because retaining the framework unchanged would not answer the ICJ ruling on incumbent officials’
        immunity or the stated effort to align the law with international law.
      O3: It was not chosen because, although filters had been added, diplomatic pressure continued to escalate and culminated
        in repeal.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The NATO-related diplomatic pressure had not escalated and the April filters had been regarded as an adequate response
        to the legal and diplomatic concerns.
      then: O3
      why: Without the escalation linked to repeal, retaining the amended framework would have remained a plausible course.
    would_not_change:
    - id: noflip1
      if: The lawsuit against the US general was referred back to the United States under the new procedure.
      why: The referral occurred, yet the US defense secretary still confronted Belgium over NATO’s headquarters and the US
        contribution.
    watch_for:
    - id: watch1
      what: Further threats to move NATO headquarters or further conditions on US support for the new headquarters.
      favors:
      - O2
      why: Such pressure would add to the escalation that culminated in repeal.
  lesson: When a legal ruling exposes a conflict between a national framework and international obligations, unchanged retention
    is not a sufficient response. Procedural filters may support continued operation, but their adequacy should be reassessed
    when diplomatic consequences continue to escalate.
  limits: This historical legislative choice does not establish that diplomatic pressure alone justifies repeal or that the
    ICJ ruling required repeal of the entire framework. The reasoning does not determine what course would be appropriate
    under different legal obligations or diplomatic circumstances.
