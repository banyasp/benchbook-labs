case:
  id: DR-CORPUS-INC-ROBINSON-AND-THE-BLETCHLEY-PARK-VALVE-CO-NX-7de53e9d-E1@v1
  title: A Parallel Valve-Based Effort
  status: draft
  setting: Bletchley Park and the Post Office Research Laboratories, March 1943
  decider: The overall managers
  agent: The overall managers
  agent_role: decide
  situation: At Bletchley Park, analysts needed a substantial improvement in their tools to make the available process practical.
    By 1942, that process remained too slow. The managers regarded falling behind as almost worthless. They were skeptical
    that valves could be reliable. The engineering lead had prior experience with valves in telephone equipment and considered
    them reliable. The existing effort was set to proceed, while whether to permit a parallel valve-based effort remained
    undecided.
  question: What should the overall managers do about permitting a parallel valve-based effort alongside the existing effort?
  options:
    O1:
      do: The overall managers permit a parallel valve-based effort.
      move: act
      irreversible: false
    O2:
      do: The overall managers request a reliability assessment before deciding.
      move: ask
      irreversible: false
      to: the engineering lead
    O3:
      do: The overall managers prohibit a parallel valve-based effort.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: The available process required a substantial improvement in analytic tools to become practical.
  - id: F2
    kind: capability
    status: confirmed
    fact: By 1942, the available process remained far too slow.
  - id: F3
    kind: situation
    status: assessed
    fact: Those involved regarded being in second place as almost worthless.
  - id: F4
    kind: situation
    status: assessed
    fact: The overall managers believed valves were unreliable.
  - id: F5
    kind: situation
    status: confirmed
    fact: The engineering lead had introduced valves into telephone equipment in large numbers before the war.
  - id: F6
    kind: situation
    status: assessed
    fact: The engineering lead considered valves reliable based on prior experience.
  - id: F7
    kind: situation
    status: confirmed
    fact: The managers planned to proceed with the existing effort, while whether to construct a valve-based system remained
      unresolved.
  - id: F8
    kind: situation
    status: confirmed
    fact: The engineering lead worked at the Post Office Research Laboratories.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The process was still far too slow, and those involved regarded second place as almost worthless. The need to improve
      the available tools made permitting a parallel effort preferable to foreclosing it.
  - id: C2
    facts:
    - F5
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The engineering lead had substantial prior experience with valves in telephone equipment and considered them reliable.
      The managers let him proceed on that basis.
  - id: C3
    facts:
    - F4
    - F7
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: The managers' concern that valves were unreliable gave some reason to seek further assurance, while the existing
      effort was already proceeding. The source records the concern but does not say it outweighed the case for allowing the
      lead to proceed.
  reasoning:
    read: 'The managers faced urgency and uncertainty at once: the existing process remained too slow, but they doubted valve
      reliability while the engineering lead''s experience led him to the opposite view. The trap is to treat skepticism as
      sufficient reason to prohibit a parallel effort, despite the lead''s relevant experience and the perceived cost of falling
      behind.'
    weighing: The source presents the slow process and the importance of not falling behind as the pressure for action, and
      the engineering lead's prior experience as the basis for confidence in proceeding. Managers were skeptical, but the
      source endorses their decision to let the lead pursue his own effort while the existing effort continued. The balance
      depends on the urgency of improvement and the lead's relevant experience.
    tradecraft: Record the urgency, the managers' reliability concern, and the engineering lead's relevant experience as the
      basis for permitting the effort. Keep the existing effort's status clear and document who is responsible for the permitted
      work and for reporting its progress.
    uncertainty: The source gives opposing views about reliability but no formal assessment or quantified likelihood. It supports
      relying on the engineering lead's stated experience, not treating reliability as conclusively established.
    handoff: The overall managers retain the decision, but should involve the engineering lead because his prior experience
      informed the reliability judgment. The source's endorsed approach was to leave the question of proceeding with the valve-based
      effort to him.
    tempting_wrong:
      option: O3
      pull: The managers were convinced that valves were unreliable.
      why_wrong: 'That concern was not treated as decisive: the engineering lead had relevant prior experience, and the managers
        permitted him to proceed despite their skepticism.'
    rejected:
      O2: The source's endorsed choice was to let the engineering lead proceed on his experience, rather than defer the decision
        for a separate assessment.
      O3: Prohibiting the effort would disregard both the lead's relevant experience and the stated urgency of improving a
        process that remained too slow.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The engineering lead lacked relevant prior experience to support his reliability judgment.
      then: O2
      why: Without the experience that supported his confidence, requesting a reliability assessment would be a more prudent
        basis for deciding whether to permit the effort.
    would_not_change:
    - id: noflip1
      if: The managers remained skeptical, but the engineering lead retained relevant prior experience and the need for improvement
        remained urgent.
      why: The source's endorsed decision permitted the effort despite managerial skepticism, given the lead's experience
        and the pressure not to fall behind.
    watch_for:
    - id: watch1
      what: Whether new evidence materially changes the basis for the managers' or engineering lead's reliability judgment.
      favors:
      - O2
      - O3
      why: The source identifies reliability as the point of disagreement, so materially different evidence could affect whether
        to proceed or seek further assessment.
  lesson: When an existing approach is too slow for the mission, do not let skepticism alone foreclose a parallel effort if
    the responsible lead has relevant experience supporting it. Make the decision on the urgency, the evidence behind the
    competing judgments, and who is accountable for proceeding.
  limits: This reasoning concerns a decision to permit an effort under uncertainty, not a general finding that valves are
    reliable or that parallel efforts are always justified. It may not apply where the lead lacks relevant experience, the
    urgency is absent, or other constraints make the effort inappropriate.
