case:
  id: DR-OGE-2635-704-revise1@v1
  title: CFTC Employee Use of Commercial Investor Service [revise]
  status: needs_review
  setting: Commodity Futures Trading Commission office, present, United States
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: The employee works for the Commodity Futures Trading Commission. The employee’s office computer, which is government
    property, provides access to a commercial service that supplies information for investors. The employee is considering
    using that service to conduct personal investment research. Under 5 U.S.C. 2635.704(a) employees must protect government
    property and may not use it for purposes other than those authorized. Government property includes computers and electronic
    devices, and authorized purposes are limited to those permitted by law or agency policy. The regulation’s example states
    that an employee may not use such a service for personal investment research.
  question: What should the employee do regarding using the commercial service for personal investment research?
  options:
    O1:
      do: The employee does not use the commercial investor‑information service for personal investment research.
      move: act
      irreversible: false
    O2:
      do: The employee uses the commercial investor‑information service for personal investment research.
      move: act
      irreversible: false
    O3:
      do: The employee uses the commercial investor‑information service only for official agency work.
      move: partial
      irreversible: false
    O4:
      do: The employee asks the agency ethics office for guidance before using the service.
      move: ask
      irreversible: false
      to: the agency ethics office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the Commodity Futures Trading Commission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee’s office computer provides access to a commercial service that supplies information for investors.
  - id: F3
    kind: situation
    status: confirmed
    fact: The office computer is government property.
  - id: F4
    kind: authority
    status: confirmed
    fact: Employees have a duty to protect and conserve government property and may not use it for other than authorized purposes.
  - id: F5
    kind: authority
    status: confirmed
    fact: Authorized purposes are those authorized by law or regulation, including limited personal use policies.
  - id: F6
    kind: authority
    status: confirmed
    fact: The regulation example states that the employee may not use the service for personal investment research.
  considerations:
  - id: C1
    facts:
    - F4
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Employees have a statutory duty to protect and conserve government property and may not use it for non‑authorized
      purposes.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Authorized purposes are defined by law or regulation; personal investment research is not an authorized purpose.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: bar
    why: The regulation’s own Example 2 expressly states the employee may not use the service for personal investment research.
    rules_out:
    - O2
  - id: C4
    facts:
    - F2
    - F3
    equity: resource_stewardship
    favors:
    - O3
    weight: strong
    why: Using the government-owned computer for official agency work aligns with proper stewardship of taxpayer-funded resources,
      whereas personal use would constitute waste.
  - id: C5
    facts:
    - F1
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Limiting the service to official work preserves institutional credibility and avoids any appearance of conflict of
      interest.
  reasoning:
    read: The employee must decide whether to restrict use of the commercial investor-information service to agency business
      or to engage in personal investment research on agency equipment.
    weighing: Strong considerations C4 and C5 now favor using the service solely for official work; they outweigh the earlier
      statutory prohibitions that only barred personal use. Because the law does not forbid official use, the balance tips
      toward permitting O3.
    tradecraft: Access the service only when performing agency-mandated analyses, log each session as official activity, and
      refrain from any personal inquiries on the same system.
    uncertainty: Low; the regulatory text is clear that personal use is prohibited, while official use remains permissible.
    handoff: The employee can make the decision unilaterally, documenting compliance with the agency's resource-use policy.
    tempting_wrong:
      option: O2
      pull: Convenient access to premium market data for personal profit.
      why_wrong: Personal research violates the duty to protect government property and exceeds authorized purposes.
    rejected:
      O1: A blanket prohibition would unnecessarily discard a valuable agency resource that can be used for official work.
      O2: Personal investment research is expressly prohibited by the regulation's example.
      O4: The rule is already clear; seeking additional guidance would be redundant.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The agency adopts a de minimis personal-use policy that expressly authorizes use of the commercial investor-information
        service for personal research.
      then: O1
      why: Even with a de minimis policy, the employee would still be barred from personal use under the statutory duty to
        protect government property; the only permissible outcome is to refrain entirely.
    would_not_change:
    - id: noflip1
      if: The employee uses the service solely for official agency work.
      why: Official use is already permitted; the question concerns personal research, which remains prohibited.
    watch_for:
    - id: watch1
      what: Any amendment to 5 U.S.C. 2635.704 or agency policy that redefines authorized personal use of government computers.
      favors:
      - O2
      why: A policy change could legitimize personal research on agency equipment.
  lesson: Government-owned computers may be used for official tasks that further agency missions; personal financial activities
    remain prohibited unless a specific policy amendment authorizes them.
  limits: Applies only to the use of agency-owned computers to access subscription-based investor services; does not cover
    personal devices or freely available public resources.
