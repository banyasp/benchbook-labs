case:
  id: DR-OGE-2635-704-flip1@v1
  title: CFTC Employee Use of Commercial Investor Service [flip]
  status: needs_review
  setting: Office of the Financial Markets Oversight Agency, present day, United States
  decider: the staff analyst
  agent: the staff analyst
  agent_role: decide
  situation: The analyst is employed by the Financial Markets Oversight Agency. The workstation assigned to the analyst, which
    is agency property, includes a subscription to a commercial platform that provides detailed market data for investors.
    The analyst is weighing whether to employ that platform for personal portfolio analysis. Under 5 U.S.C. 2635.704(a) employees
    must safeguard government assets and may only use them for purposes that are expressly authorized. Agency property encompasses
    computers and related devices, and authorized purposes are those delineated by law or agency directives. The regulation's
    illustrative example indicates that personal investment research is prohibited, but a new agency policy (see {F3}) expressly
    permits limited personal use of the platform.
  question: Should the analyst use the commercial market-data platform for personal investment research?
  options:
    O1:
      do: Do not use the commercial market-data platform for personal investment research.
      move: act
      irreversible: false
    O2:
      do: Use the commercial market-data platform for personal investment research as permitted.
      move: act
      irreversible: false
    O3:
      do: Use the commercial market-data platform only for official agency analyses and reports.
      move: partial
      irreversible: false
    O4:
      do: Consult the agency ethics office before deciding to use the platform personally.
      move: ask
      irreversible: false
      to: the agency ethics office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analyst works for the Financial Markets Oversight Agency.
  - id: F2
    kind: situation
    status: confirmed
    fact: The analyst's workstation provides access to a commercial platform that supplies investor-focused market data.
  - id: F3
    kind: authority
    status: confirmed
    fact: The agency has adopted a de minimis personal‑use policy that expressly authorizes employees to use the commercial
      investor‑information service for personal investment research.
  - id: F4
    kind: situation
    status: confirmed
    fact: The workstation is agency-owned equipment.
  - id: F5
    kind: authority
    status: confirmed
    fact: Employees are required to protect and conserve agency property and may not employ it for purposes beyond those authorized.
  - id: F6
    kind: authority
    status: confirmed
    fact: Authorized purposes include those sanctioned by law or regulation, and the agency's limited personal-use policy
      expands this category.
  - id: F7
    kind: authority
    status: confirmed
    fact: The regulatory example states that the employee may not use the service for personal investment research.
  considerations:
  - id: C1
    facts:
    - F5
    - F4
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The duty to protect agency property is satisfied when the property is used for a purpose the agency explicitly authorizes,
      and {F3} extends that authorization to personal investment research.
  - id: C2
    facts:
    - F6
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Authorized purposes now encompass limited personal-use activities under the agency's policy, making personal research
      on the platform a permissible use.
  - id: C4
    facts:
    - F2
    - F4
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Although the workstation is funded by taxpayers, the policy permits its use for modest personal research, mitigating
      concerns about resource waste.
  - id: C5
    facts:
    - F1
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The agency's explicit policy reduces the appearance of a conflict of interest, allowing personal research without
      harming public trust.
  reasoning:
    read: The analyst notes that the agency's new de minimis policy ({F3}) expressly permits modest personal use of the subscribed
      market-data platform, turning a previously prohibited activity into an authorized one.
    weighing: Strong considerations C1 and C2, grounded in the statutory duty to protect property and the updated definition
      of authorized purposes, outweigh the weaker stewardship and perception concerns in C4 and C5. Because the agency's policy
      directly authorizes the conduct, the balance clearly supports using the platform for personal research.
    tradecraft: The analyst should log the decision in the agency's compliance system, citing 5 U.S.C. 2635.704 and the de
      minimis policy as the basis for the authorized use.
    uncertainty: Minimal; the agency's policy provides a clear exception to the earlier regulatory example.
    handoff: The analyst can decide independently, as the policy removes any need for further consultation.
    tempting_wrong:
      option: O1
      pull: A cautious instinct to avoid any personal use of government equipment.
      why_wrong: The caution is unnecessary because the agency's policy explicitly permits the activity.
    rejected:
      O1: The policy ({F3}) overrides the earlier regulatory example, making personal use permissible.
      O3: Limiting use to official work defeats the purpose of the authorized personal-use allowance and needlessly restricts
        the analyst's lawful option.
      O4: Consultation with the ethics office is redundant; the policy already provides a definitive answer.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: If the agency rescinds the de minimis personal-use policy that currently authorizes personal investment research
        on the platform.
      then: O1
      why: Without that policy, personal use would again fall outside authorized purposes, reinstating the prohibition.
    would_not_change:
    - id: noflip1
      if: If the analyst employs the platform solely for official agency analyses.
      why: Official use has always been permissible; the question concerns personal research, which remains authorized under
        the current policy.
    watch_for:
    - id: watch1
      what: Any amendment to 5 U.S.C. 2635.704 or a reversal of the agency's de minimis policy that would redefine authorized
        personal use of agency computers.
      favors:
      - O2
      why: A policy change could either reinforce or eliminate the current permission for personal research.
  lesson: Agency-owned equipment may be used for activities that the agency explicitly authorizes, even if those activities
    involve personal financial matters. A de minimis personal-use policy can expand the scope of permissible uses beyond the
    baseline regulatory prohibition.
  limits: This analysis applies only to the use of agency-provided computers to access subscription-based commercial market-data
    services. It does not address personal use of non-government devices or freely available public resources.
