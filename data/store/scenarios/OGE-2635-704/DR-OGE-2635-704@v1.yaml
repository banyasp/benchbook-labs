case:
  id: DR-OGE-2635-704@v1
  title: CFTC Employee Use of Commercial Investor Service
  status: draft
  setting: Commodity Futures Trading Commission office, present, United States
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: The employee works for the Commodity Futures Trading Commission. The employee’s office computer, which is government
    property, provides access to a commercial service that supplies information for investors. The employee is considering
    using that service to conduct personal investment research. Under 5 U.S.C. 2635.704(a) employees must protect government
    property and may not use it for purposes other than those authorized. Government property includes computers and electronic
    devices, and authorized purposes are limited to those permitted by law or agency policy. The regulation’s example states
    that an employee may not use such a service for personal investment research.
  question: What should the employee do regarding using the commercial service for personal investment research?
  options:
    O1:
      do: The employee does not use the commercial investor‑information service for personal investment research.
      move: act
      irreversible: false
    O2:
      do: The employee uses the commercial investor‑information service for personal investment research.
      move: act
      irreversible: false
    O3:
      do: The employee uses the commercial investor‑information service only for official agency work.
      move: partial
      irreversible: false
    O4:
      do: The employee asks the agency ethics office for guidance before using the service.
      move: ask
      irreversible: false
      to: the agency ethics office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the Commodity Futures Trading Commission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee’s office computer provides access to a commercial service that supplies information for investors.
  - id: F3
    kind: situation
    status: confirmed
    fact: The office computer is government property.
  - id: F4
    kind: authority
    status: confirmed
    fact: Employees have a duty to protect and conserve government property and may not use it for other than authorized purposes.
  - id: F5
    kind: authority
    status: confirmed
    fact: Authorized purposes are those authorized by law or regulation, including limited personal use policies.
  - id: F6
    kind: authority
    status: confirmed
    fact: The regulation example states that the employee may not use the service for personal investment research.
  considerations:
  - id: C1
    facts:
    - F4
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Employees have a statutory duty to protect and conserve government property and may not use it for non‑authorized
      purposes.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Authorized purposes are defined by law or regulation; personal investment research is not an authorized purpose.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: bar
    why: The regulation’s own Example 2 expressly states the employee may not use the service for personal investment research.
    rules_out:
    - O2
  - id: C4
    facts:
    - F2
    - F3
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: Using a government‑funded computer to access a commercial service for personal gain wastes taxpayer‑funded resources.
  - id: C5
    facts:
    - F1
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Personal investment research on agency equipment creates an appearance of conflict of interest and could erode public
      trust.
  reasoning:
    read: The employee is tempted to treat the agency computer like a personal device and use the subscribed commercial investor‑information
      service for private portfolio work. The regulatory trap is assuming that a small personal use is harmless, but the regulation’s
      own example declares such use prohibited.
    weighing: Strong considerations C1, C2, and C3—derived directly from statutory duty, the definition of authorized purposes,
      and the explicit regulatory example—overwhelm the weaker stewardship and perception concerns in C4 and C5. Because the
      rule is clear and unambiguous, the balance tips decisively toward prohibiting personal research.
    tradecraft: The employee should refrain from accessing the service for personal purposes, log the decision in the agency’s
      compliance system, and, if needed, document the reference to 5 U.S.C. 2635.704 and Example 2 as the basis for the action.
    uncertainty: Minimal; the regulation provides a binding example that directly addresses the exact circumstance.
    handoff: The decision can be made unilaterally by the employee because the authority is explicit; no further consultation
      is required.
    tempting_wrong:
      option: O2
      pull: Convenient access to high‑quality market data for personal gain.
      why_wrong: It violates the duty to protect government property and exceeds the scope of authorized use.
    rejected:
      O2: Personal investment research is expressly prohibited by the regulation’s example.
      O3: Limiting use to official work does not address the employee’s desire for personal research; the prohibition still
        applies to any personal use.
      O4: Asking the ethics office is unnecessary because the rule is already settled; the example leaves no room for discretionary
        interpretation.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The agency adopts a de minimis personal‑use policy that expressly authorizes use of the commercial investor‑information
        service for personal research.
      then: O2
      why: The authorized‑purpose definition would expand to include this specific personal use, removing the prohibition.
    would_not_change:
    - id: noflip1
      if: The employee uses the service solely for official agency work.
      why: Official use is already permitted; the question concerns personal research, which remains prohibited.
    watch_for:
    - id: watch1
      what: Any amendment to 5 U.S.C. 2635.704 or agency policy that redefines authorized personal use of government computers.
      favors:
      - O2
      why: A policy change could legitimize personal research on agency equipment.
  lesson: Government property may only be used for purposes expressly authorized by law or agency policy; personal financial
    activities are not covered by de minimis personal‑use allowances unless specifically permitted.
  limits: This reasoning applies only to the use of government‑owned computers to access commercial subscription services.
    It does not address personal use of non‑government devices or services that are freely available to the public.
