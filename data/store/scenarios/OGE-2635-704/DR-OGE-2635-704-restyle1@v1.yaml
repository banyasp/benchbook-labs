case:
  id: DR-OGE-2635-704-restyle1@v1
  title: CFTC Employee Use of Commercial Investor Service [restyle]
  status: needs_review
  setting: Securities Oversight Board headquarters, Washington, D.C., present
  decider: the staff analyst
  agent: the staff analyst
  agent_role: decide
  situation: The analyst is employed by the Securities Oversight Board. The workstation assigned to the analyst, which is
    owned by the government, includes a subscription to a commercial market-data platform used by investors. The analyst is
    weighing whether to exploit that platform for personal portfolio analysis. Under 5 U.S.C. 2635.704(a) federal employees
    must safeguard government property and may not employ it for purposes beyond those expressly authorized. Government property
    encompasses computers and related electronic equipment, and authorized purposes are limited to those permitted by statute
    or agency policy. The regulation's illustrative example specifically forbids using such a service for personal investment
    research.
  question: How should the analyst proceed regarding personal use of the market-data platform on the agency workstation?
  options:
    O1:
      do: Refrain from employing the market-data platform on the agency workstation for any personal investment analysis.
      move: act
      irreversible: false
    O2:
      do: Utilize the market-data platform on the agency workstation to conduct personal investment analysis during off-hours.
      move: act
      irreversible: false
    O3:
      do: Access the market-data platform on the agency workstation solely for official Board duties and reporting.
      move: partial
      irreversible: false
    O4:
      do: Seek guidance from the Board's ethics office before deciding to use the platform for personal purposes.
      move: ask
      irreversible: false
      to: the agency ethics office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analyst is employed by the Securities Oversight Board.
  - id: F2
    kind: situation
    status: confirmed
    fact: The analyst's workstation provides access to a commercial market-data platform used by investors.
  - id: F3
    kind: situation
    status: confirmed
    fact: The workstation is government-owned equipment.
  - id: F4
    kind: authority
    status: confirmed
    fact: Federal employees are required to protect and conserve government property and may not use it for unauthorized purposes.
  - id: F5
    kind: authority
    status: confirmed
    fact: Authorized purposes are those defined by law or regulation, including any limited personal-use allowances that may
      be codified.
  - id: F6
    kind: authority
    status: confirmed
    fact: The regulatory example expressly states that an employee may not use the service for personal investment research.
  considerations:
  - id: C1
    facts:
    - F4
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Statutory obligations compel employees to safeguard government assets and bar any utilization that falls outside
      authorized functions.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The definition of authorized purposes is confined to what statutes or regulations permit; personal investment analysis
      is not among those permitted activities.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: bar
    why: Example 2 within the regulation directly declares that using the service for personal investment research is prohibited.
    rules_out:
    - O2
  - id: C4
    facts:
    - F2
    - F3
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: Employing a taxpayer-funded computer to retrieve a commercial subscription for private gain constitutes an inefficient
      use of public resources.
  - id: C5
    facts:
    - F1
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Conducting personal investment work on agency hardware creates a perceived conflict of interest that could diminish
      public confidence in the Board.
  reasoning:
    read: The analyst feels tempted to treat the Board's computer as a personal tool and to draw on the subscribed market-data
      platform for private portfolio work. The pitfall lies in assuming that occasional personal use is harmless, yet the
      regulation's own example categorically bars such activity.
    weighing: Considerations C1, C2, and C3—each grounded in the statutory duty, the narrow scope of authorized purposes,
      and the explicit regulatory illustration—carry strong weight that outweighs the more modest stewardship and perception
      arguments in C4 and C5. Because the rule is explicit and unambiguous, the balance clearly favors prohibiting personal
      research.
    tradecraft: The analyst should abstain from accessing the platform for personal reasons, record the decision in the Board's
      compliance log, and, if documentation is required, cite 5 U.S.C. 2635.704 and Example 2 as the governing authority.
    uncertainty: Very low; the regulation supplies a binding illustration that directly addresses the exact scenario.
    handoff: The analyst can decide independently, as the authority is clear; no additional consultation is necessary.
    tempting_wrong:
      option: O2
      pull: Ready access to premium market data that could boost personal investment returns.
      why_wrong: Such use breaches the duty to protect government property and exceeds the scope of authorized employment.
    rejected:
      O2: Personal investment analysis is expressly barred by the regulation's illustrative example.
      O3: Limiting the platform to official duties does not resolve the employee's desire for personal analysis; the prohibition
        still applies to any private use.
      O4: Consulting the ethics office is superfluous because the rule is already definitive; the example leaves no room for
        discretionary interpretation.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Board adopts a de minimis personal-use policy that explicitly permits the use of the market-data platform for
        personal investment analysis.
      then: O2
      why: The definition of authorized purposes would be broadened to include this particular personal activity, eliminating
        the current prohibition.
    would_not_change:
    - id: noflip1
      if: The analyst employs the platform exclusively for official Board work.
      why: Official use is already allowed; the issue concerns personal research, which remains prohibited.
    watch_for:
    - id: watch1
      what: Any amendment to 5 U.S.C. 2635.704 or to Board policy that redefines authorized personal use of government-owned
        computers.
      favors:
      - O2
      why: A policy shift could legitimize personal investment analysis on agency equipment.
  lesson: Government-owned computers may be used only for purposes that statutes or agency policies expressly authorize; personal
    financial activities are not covered by generic de minimis personal-use rules unless a specific exemption is granted.
  limits: This analysis is limited to the use of government-owned workstations to access commercial subscription services.
    It does not extend to personal devices or to freely available public resources.
