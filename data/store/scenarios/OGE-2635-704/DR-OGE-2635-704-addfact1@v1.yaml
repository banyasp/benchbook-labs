case:
  id: DR-OGE-2635-704-addfact1@v1
  title: CFTC Employee Use of Commercial Investor Service [addfact]
  status: needs_review
  setting: Office of the Commodity Futures Trading Commission, Washington, D.C., present day
  decider: the staff analyst
  agent: the staff analyst
  agent_role: decide
  situation: The analyst is employed by the Commodity Futures Trading Commission. The analyst's workstation, which is government-owned,
    provides access to a commercial service that delivers investor-focused information. Employees are obligated to protect
    and conserve government property and may not employ it for purposes beyond those authorized. Authorized purposes are those
    sanctioned by law or regulation, including any limited personal-use allowances. The agency's cafeteria on the twelfth
    floor offers complimentary meals to staff during the workday. The regulatory example specifies that the employee may not
    use the service for personal investment research.
  question: How should the analyst proceed regarding the use of the commercial investor-information platform for personal
    investment research?
  options:
    O1:
      do: Do not use the commercial platform for any personal investment research.
      move: act
      irreversible: false
    O2:
      do: Use the commercial platform on the workstation to conduct personal investment research.
      move: act
      irreversible: false
    O3:
      do: Employ the commercial platform solely for official CFTC duties and tasks.
      move: partial
      irreversible: false
    O4:
      do: Consult the agency's ethics office before deciding to use the platform.
      move: ask
      irreversible: false
      to: the agency ethics office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analyst is employed by the Commodity Futures Trading Commission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The analyst's workstation provides access to a commercial service that delivers investor-focused information.
  - id: F3
    kind: situation
    status: confirmed
    fact: The workstation is owned by the government.
  - id: F4
    kind: authority
    status: confirmed
    fact: Employees are obligated to protect and conserve government property and may not employ it for purposes beyond those
      authorized.
  - id: F5
    kind: situation
    status: confirmed
    fact: The agency's cafeteria on the twelfth floor offers complimentary meals to staff during the workday.
  - id: F6
    kind: authority
    status: confirmed
    fact: Authorized purposes are those sanctioned by law or regulation, including any limited personal-use allowances.
  - id: F7
    kind: authority
    status: confirmed
    fact: The regulatory example specifies that the employee may not use the service for personal investment research.
  considerations:
  - id: C1
    facts:
    - F4
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Employees are statutorily required to protect government-owned equipment and may not employ it for activities that
      lack explicit authorization.
  - id: C2
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Authorized purposes are limited to those defined by law or regulation; personal investment research is not listed
      among them.
  - id: C3
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: bar
    why: The regulation's own Example 2 expressly states that the employee may not use the service for personal investment
      research.
    rules_out:
    - O2
  - id: C4
    facts:
    - F2
    - F3
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: Accessing a commercial subscription on a taxpayer-funded workstation for private gain wastes government resources.
  - id: C5
    facts:
    - F1
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Personal investment activity on agency equipment can be perceived as a conflict of interest and may erode public
      confidence.
  reasoning:
    read: The analyst might view the agency workstation as a convenient portal for personal market data, assuming that a modest
      personal use would be harmless. However, the regulatory example directly bars such use, making the prohibition unmistakable.
    weighing: Strong considerations C1, C2, and C3—derived from the statutory duty to protect government property, the narrow
      definition of authorized purposes, and the explicit regulatory example—overwhelm the weaker stewardship (C4) and perception
      (C5) concerns. The rule is clear and unambiguous, so the balance decisively favors prohibiting personal research.
    tradecraft: Refrain from accessing the commercial platform for any personal investment work, record the decision in the
      agency's compliance log, and cite 5 U.S.C. 2635.704 together with Example 2 as the authority supporting the action.
    uncertainty: Minimal; the regulation supplies a binding example that directly addresses the situation.
    handoff: The analyst can make the determination unilaterally because the governing authority leaves no room for discretionary
      interpretation.
    tempting_wrong:
      option: O2
      pull: Easy access to premium market data for personal profit.
      why_wrong: It breaches the duty to protect government property and exceeds the scope of authorized use.
    rejected:
      O2: The regulation's example expressly forbids personal investment research on agency equipment.
      O3: Limiting use to official duties does not resolve the prohibition on personal research; the rule applies to any personal
        use.
      O4: Consulting the ethics office is unnecessary because the regulation already provides a definitive answer.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The agency adopts a de minimis personal-use policy that expressly authorizes the commercial investor-information
        service for personal research.
      then: O2
      why: The definition of authorized purposes would expand to cover this specific personal use, removing the prohibition.
    would_not_change:
    - id: noflip1
      if: The employee restricts use of the service to official agency work.
      why: Official use is already permissible; the question concerns personal research, which remains prohibited.
    watch_for:
    - id: watch1
      what: Any amendment to 5 U.S.C. 2635.704 or agency policy that redefines authorized personal use of government computers.
      favors:
      - O2
      why: A policy change could legitimize personal research on agency equipment, shifting the balance toward O2.
  lesson: Government-owned equipment may be used only for purposes expressly authorized by law or agency policy; personal
    financial activities are not covered by routine de minimis personal-use allowances unless a specific exemption is granted.
  limits: The analysis applies solely to the use of government-owned workstations to access commercial subscription services.
    It does not address personal use of privately owned devices or freely available public resources.
