case:
  id: DR-ALJINAH-2017-revise1@v1
  title: Approval of Dynamic Strike Without Religious Site Knowledge [revise]
  status: needs_review
  setting: Aleppo province, Syria, March 2017, U.S. joint strike cell
  decider: target engagement authority
  agent: target engagement authority
  agent_role: decide
  situation: Intelligence indicated that Al Qaida and Syrian militants were planning a meeting in a specific building near
    al‑Jinah village. Surveillance confirmed the meeting was imminent and that the building was being used for the gathering.
    The strike cell assessed the target as a valid military objective and deemed the planned strike proportionate. The building
    was part of a religious complex, but this information was not conveyed to the target engagement authority before the decision.
    The small mosque and adjacent structures were not listed on the category‑one no‑strike register. A possible civilian individual
    was identified among those present, but the authority believed the proportionality assessment remained lawful.
  question: What should the target engagement authority do regarding approval of the dynamic strike?
  options:
    O1:
      do: The target engagement authority approves the strike.
      move: act
      irreversible: true
    O2:
      do: The target engagement authority requests more intelligence on site.
      move: ask
      irreversible: false
    O3:
      do: The target engagement authority denies the strike.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Al Qaida and Syrian militants were planning a meeting in a specific building near al‑Jinah village.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: Surveillance assets confirmed the meeting was forming in the identified building.
  - id: F3
    kind: situation
    status: confirmed
    fact: The area is ungoverned and a known Al Qaida operational zone.
  - id: F4
    kind: authority
    status: confirmed
    fact: The target engagement authority holds the authority to approve kinetic strikes.
  - id: F5
    kind: capability
    status: assessed
    fact: The strike cell assessed the target as a valid military objective and proportionate.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The small mosque and adjacent buildings were not on the category‑one no‑strike list.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The target engagement authority was not informed that the complex had a religious purpose.
  - id: F8
    kind: capability
    status: assessed
    fact: One individual present may have been a civilian, possibly injured.
  - id: F9
    kind: capability
    status: assessed
    fact: The failure to identify the religious nature of the buildings was deemed a preventable error.
  considerations:
  - id: C1
    facts:
    - F7
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The authority was not told the complex was a religious facility, a preventable error that undermines accurate analysis.
  - id: C2
    facts:
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: A possible civilian was present; without full intel the proportionality assessment is uncertain.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The strike cell's assessment that the target is a valid military objective and proportionate, together with the authority's
      legal mandate, justifies immediate approval.
  - id: C4
    facts:
    - F6
    equity: protected_activity
    favors:
    - O1
    weight: strong
    why: Although the mosque was not on the category-one list, the building's use for combatant activity removes protected-activity
      concerns, supporting approval.
  - id: C5
    facts:
    - F9
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: The investigation flags the failure as a preventable error, indicating a need for more thorough pre‑strike intelligence.
  - id: C6
    facts:
    - F5
    - F4
    equity: mission_success
    favors:
    - O1
    weight: strong
    why: The strike cell's determination of a valid, proportionate target combined with the authority's explicit kinetic-strike
      mandate makes approval the most effective course.
  reasoning:
    read: Intelligence confirms an imminent Al Qaida-Syrian militant meeting in a building that, despite being part of a religious
      complex, is being used for combatant purposes; the strike cell has judged the target valid and proportionate, and the
      authority possesses the legal power to approve kinetic action.
    weighing: C3 and C4 now carry strong weight in favor of O1, outweighing the weaker concerns about civilian presence (C2)
      and analytic gaps (C1, C5). The decisive considerations demonstrate that the lawful authority and validated target assessment
      dominate the decision.
    tradecraft: Record the approval in the targeting system, cite the valid-objective and authority-mandate equities, and
      note the residual civilian risk with a mitigation plan (e.g., precision munitions, post-strike assessment).
    uncertainty: Some uncertainty remains regarding the exact civilian count, but the proportionality judgment is supported
      by the strike cell's analysis and the absence of a protected-activity exemption.
    handoff: Proceed with the strike while informing the intelligence cell to continue monitoring civilian presence for after-action
      review; legal review is noted but not required to delay execution.
    tempting_wrong:
      option: O2
      pull: Requesting further intelligence could allow the militants to disperse and lose the time-critical advantage.
      why_wrong: Delaying the strike would forfeit a high-value target while the existing intelligence already satisfies proportionality
        and legality.
    rejected:
      O2: A request for more intel would miss the narrow decision window and undermine mission success despite the identified
        intelligence gap.
      O3: Denial would waste a legitimate opportunity to strike a verified combatant gathering, contrary to the authority's
        mandate.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The target engagement authority had been informed that the building was a protected religious facility and that
        it was on the category-one no-strike list.
      then: O2
      why: With the protected-activity status known, the authority could reassess and might still require additional validation
        before approval.
    - id: flip2
      if: Intelligence cannot be obtained within the required decision window
      then: O2
      why: Without timely additional data, the authority must request more intelligence before any approval.
    would_not_change:
    - id: noflip1
      if: The building was not on the no-strike list but still served a religious purpose.
      why: Even without formal listing, the religious nature should have been conveyed, so the request for more intel remains
        appropriate.
    watch_for:
    - id: watch1
      what: Any future intelligence that clarifies the civilian status of individuals present.
      favors:
      - O1
      why: If civilians are definitively ruled out, the urgency of the target may justify immediate approval.
  lesson: When a target is confirmed as a valid combatant gathering and the authority holds a clear legal mandate, approval
    can be justified even if some contextual details (e.g., protected-activity status) are incomplete, provided the proportionality
    assessment remains solid.
  limits: Applies to dynamic, time-critical strikes against verified enemy gatherings where the strike cell's proportionality
    judgment is strong and the authority's kinetic-strike mandate is explicit; not intended for deliberative strikes requiring
    full situational certainty.
