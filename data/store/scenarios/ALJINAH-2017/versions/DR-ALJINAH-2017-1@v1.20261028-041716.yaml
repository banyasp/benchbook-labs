case:
  id: DR-ALJINAH-2017-1@v1
  title: Approval of Dynamic Strike Without Religious Site Knowledge
  status: draft
  setting: Aleppo province, Syria, March 2017, U.S. joint strike cell
  decider: target engagement authority
  agent: target engagement authority
  agent_role: decide
  situation: Intelligence indicated that Al Qaida and Syrian militants were planning a meeting in a specific building near
    al‑Jinah village. Surveillance confirmed the meeting was imminent and that the building was being used for the gathering.
    The strike cell assessed the target as a valid military objective and deemed the planned strike proportionate. The building
    was part of a religious complex, but this information was not conveyed to the target engagement authority before the decision.
    The small mosque and adjacent structures were not listed on the category‑one no‑strike register. A possible civilian individual
    was identified among those present, but the authority believed the proportionality assessment remained lawful.
  question: What should the target engagement authority do regarding approval of the dynamic strike?
  options:
    O1:
      do: The target engagement authority approves the strike.
      move: act
      irreversible: true
    O2:
      do: The target engagement authority requests more intelligence on site.
      move: ask
      irreversible: false
    O3:
      do: The target engagement authority denies the strike.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Al Qaida and Syrian militants were planning a meeting in a specific building near al‑Jinah village.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: Surveillance assets confirmed the meeting was forming in the identified building.
  - id: F3
    kind: situation
    status: confirmed
    fact: The area is ungoverned and a known Al Qaida operational zone.
  - id: F4
    kind: authority
    status: confirmed
    fact: The target engagement authority holds the authority to approve kinetic strikes.
  - id: F5
    kind: capability
    status: assessed
    fact: The strike cell assessed the target as a valid military objective and proportionate.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The small mosque and adjacent buildings were not on the category‑one no‑strike list.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The target engagement authority was not informed that the complex had a religious purpose.
  - id: F8
    kind: capability
    status: assessed
    fact: One individual present may have been a civilian, possibly injured.
  - id: F9
    kind: capability
    status: assessed
    fact: The failure to identify the religious nature of the buildings was deemed a preventable error.
  considerations:
  - id: C1
    facts:
    - F7
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The authority was not told the complex was a religious facility, a preventable error that undermines accurate analysis.
  - id: C2
    facts:
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: A possible civilian was present; without full intel the proportionality assessment is uncertain.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The strike cell judged the target proportionate, but that judgment relied on incomplete situational data.
  - id: C4
    facts:
    - F6
    equity: protected_activity
    favors:
    - O2
    weight: weak
    why: The mosque and adjoining structures were not on the category‑one no‑strike list, a lapse that should have triggered
      additional review.
  - id: C5
    facts:
    - F9
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: The investigation flags the failure as a preventable error, indicating a need for more thorough pre‑strike intelligence.
  reasoning:
    read: 'The situation is a time‑critical (dynamic) strike on a building used for an Al Qaida meeting, but the target engagement
      authority lacked key intelligence that the site was part of a religious complex and that a possible civilian was present.
      This information gap creates a trap: proceeding on an incomplete picture may breach proportionality and precaution obligations.'
    weighing: The preventable error of not conveying the religious nature (C1) and the existence of a possible civilian (C2)
      outweigh the strike cell’s provisional proportionality finding (C3). Because the law requires all relevant facts before
      a proportionality judgment, the balance tips toward requesting additional intelligence (O2).
    tradecraft: Document the request, note the missing intelligence, and pause the kinetic authorization until the religious‑facility
      status and civilian presence are clarified. Record the decision in the targeting system with a clear justification referencing
      the analytic‑integrity and civilian‑life equities.
    uncertainty: Uncertainty remains about the exact number of combatants versus civilians and whether the building’s religious
      status would have invoked a no‑strike protection if known.
    handoff: The target engagement authority should forward the request to the intelligence analysis cell and the legal review
      team, ensuring they provide the missing data before any further action.
    tempting_wrong:
      option: O1
      pull: The urgency of eliminating a high‑value Al Qaida gathering and the strike cell’s confidence in proportionality.
      why_wrong: Approving now would ignore the known intelligence gap, risking unlawful civilian harm and violating precautionary
        obligations.
    rejected:
      O1: Approved strike would proceed without the religious‑facility information, contravening the finding that the omission
        was a preventable error.
      O3: Denial would forfeit a legitimate military opportunity despite the target being a valid combatant gathering; the
        source does not call for outright denial, only for more information.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The target engagement authority had been informed that the building was a protected religious facility and that
        it was on the category‑one no‑strike list.
      then: O1
      why: With the protected‑activity status known, the authority could apply the exemption for real‑time use and lawfully
        approve the strike.
    - id: flip2
      if: Intelligence confirmed that no civilians were present at the meeting.
      then: O1
      why: Absent civilian risk, the proportionality assessment would be unambiguous, allowing approval.
    would_not_change:
    - id: noflip1
      if: The building was not on the no‑strike list but still served a religious purpose.
      why: Even without formal listing, the religious nature should have been conveyed, so the request for more intel remains
        appropriate.
    watch_for:
    - id: watch1
      what: Any future intelligence that clarifies the civilian status of individuals present.
      favors:
      - O1
      why: If civilians are definitively ruled out, the urgency of the target may justify immediate approval.
  lesson: Dynamic strike decisions must be based on complete, accurate intelligence, especially regarding protected status
    and civilian presence. Any gap should trigger a pause and request for additional information before approval.
  limits: This rule applies to time‑critical strikes where the target is a known combatant gathering but key contextual data
    (e.g., protected‑activity status) is missing. It does not govern deliberate, fully‑vetted strikes where all relevant intel
    is already available.
