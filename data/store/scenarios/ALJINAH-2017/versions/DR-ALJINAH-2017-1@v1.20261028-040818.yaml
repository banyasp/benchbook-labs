case:
  id: DR-ALJINAH-2017-1@v1
  title: Approval of Dynamic Strike Without Knowledge of Religious Complex
  status: draft
  setting: Aleppo province, Syria, March 16, 2017, U.S. military targeting process
  decider: target engagement authority
  agent: target engagement authority
  agent_role: decide
  situation: Intelligence indicated that Al Qaida and Syrian militants would hold a meeting near al-Jinah village. Surveillance
    later confirmed that the meeting was forming inside a specific building in an ungoverned area known as an Al Qaida operational
    zone. The strike cell assessed the meeting as a valid military target and believed a proportional strike could be carried
    out. The target engagement authority believed he had complete information and was prepared to approve a kinetic strike.
    The building was later identified as part of a religious complex, including a small mosque, which was not listed on the
    category‑one no‑strike register. Some intelligence personnel were aware of the religious nature but this information did
    not reach the target engagement authority before the decision.
  question: What should the target engagement authority do regarding approving a dynamic strike on the building without being
    informed of its religious character?
  options:
    O1:
      do: The target engagement authority holds the strike pending verification of no‑strike list status.
      move: hold
      irreversible: false
    O2:
      do: The target engagement authority approves the dynamic strike on the target building.
      move: act
      irreversible: true
    O3:
      do: The target engagement authority rejects the dynamic strike on the target building.
      move: act
      irreversible: true
    O4:
      do: The target engagement authority asks for more intelligence on the building’s religious status.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Intelligence indicated that Al Qaida and Syrian militants would attend a meeting near al‑Jinah village, Aleppo province
      on March 14‑15, 2017.
  - id: F2
    kind: situation
    status: confirmed
    fact: Surveillance and reconnaissance assets confirmed a meeting was forming in a specific building on March 16, 2017.
  - id: F3
    kind: situation
    status: confirmed
    fact: The building was located in an ungoverned area of Syria that is a known Al Qaida operational zone and not under
      control of the Assad regime or allied militias.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The strike cell determined the meeting was a valid military target and could be struck proportionally to avoid unnecessary
      collateral damage.
  - id: F5
    kind: authority
    status: assessed
    fact: The target engagement authority believed he had complete information and approved a kinetic strike.
  - id: F6
    kind: situation
    status: assessed
    fact: The strike killed approximately two dozen militants and likely caused one civilian casualty who was injured.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The small building on the left of the target was a mosque and the larger adjacent building was under construction
      for religious use; neither was on the category‑one no‑strike list.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Some members of the intelligence team knew the complex was religious, but that analysis did not reach the target
      engagement authority.
  - id: F9
    kind: authority
    status: assessed
    fact: Category‑one no‑strike entities require additional approvals; the mosque should have been on that list but was not.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: hors_de_combat
    favors:
    - O2
    weight: strong
    why: Surveillance confirmed a meeting of Al Qaida militants in the building, and the strike cell judged the gathering
      a valid military target.
  - id: C2
    facts:
    - F4
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The proportionality assessment concluded that collateral damage would be limited; only one possible civilian was
      injured and no large civilian casualty reports existed.
  - id: C3
    facts:
    - F5
    - F4
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The target was classified as a dynamic (fleeting) target, requiring immediate action to prevent the militants from
      dispersing.
  - id: C4
    facts:
    - F5
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The investigation found the strike complied with operational and legal requirements and that the building was being
      used for a militant meeting.
  - id: C5
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Although the religious nature of the complex was not communicated to the authority, the target remained a legitimate
      military objective because it was being used for an Al Qaida meeting.
  reasoning:
    read: A confirmed Al Qaida meeting was taking place in a building within an ungoverned area. The strike cell deemed the
      gathering a lawful target, and the target engagement authority believed he possessed all necessary information, despite
      missing the building's religious status.
    weighing: The validity of the target (C1), the proportionality judgment (C2), the urgency of a dynamic target (C3), and
      the legal compliance finding (C4) together outweigh the incomplete intelligence about the religious complex (C5). The
      missed religious designation does not negate the legitimacy of striking a building actively used for a militant meeting.
    tradecraft: The authority recorded the decision in the targeting system, cited the proportionality assessment, and logged
      the strike as a compliant kinetic engagement.
    uncertainty: Limited uncertainty remained regarding the exact number of civilian casualties, but the investigation concluded
      the risk was minimal.
    handoff: The target engagement authority acted alone, as delegated by the chain of command for dynamic targets, though
      the report recommends future briefings to include no‑strike list status.
    tempting_wrong:
      option: O1
      pull: Holding the strike pending verification could have prevented the possible civilian injury.
      why_wrong: Delaying would have allowed the militants to disperse, undermining the mission and forfeiting a legitimate
        target.
    rejected:
      O1: Holding the strike would have sacrificed the opportunity to neutralize a confirmed Al Qaida meeting.
      O3: Rejecting the strike would have left a valid military target unengaged despite proportionality and legal compliance.
      O4: Requesting more intelligence would have caused an unacceptable delay for a dynamic target.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable intelligence confirmed the building was a protected religious site on the category‑one no‑strike list and
        was not being used for militant purposes.
      then: O3
      why: Category‑one entities require additional approvals; striking would violate the no‑strike protection.
    would_not_change:
    - id: noflip1
      if: Only a single civilian was injured and no large civilian casualty reports emerged.
      why: The proportionality assessment already deemed the strike lawful.
    watch_for:
    - id: watch1
      what: Future intelligence failures to flag religious or other protected status of structures before dynamic strike decisions.
      favors:
      - O1
      why: Ensuring complete information could prevent procedural errors and improve compliance with no‑strike protections.
  lesson: Dynamic strike decisions must be based on complete, verified intelligence, especially regarding protected status,
    but when a target is being used for a confirmed militant meeting, a timely strike is legally permissible.
  limits: This reasoning applies only when the structure is actively being used for hostile purposes and proportionality is
    satisfied; it does not extend to attacks on protected religious sites that are not being exploited for combat.
