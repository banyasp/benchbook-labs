case:
  id: DR-ALJINAH-2017-1@v1
  title: Approval of Dynamic Strike Without Religious-Complex Information
  status: draft
  setting: Aleppo province, Syria, March 2017, U.S. joint strike authority
  decider: target engagement authority
  agent: target engagement authority
  agent_role: decide
  situation: Intelligence indicated that Al Qaida and Syrian militants would hold a meeting near al-Jinah village. Surveillance
    confirmed the meeting was forming in a specific building in an ungoverned area known as an Al Qaida operational zone.
    The strike cell judged the meeting to be a valid military target and recommended a kinetic strike. The target engagement
    authority was asked to approve the strike but was not told that the building was part of a religious complex and that
    the complex was not on the category‑one no‑strike list. One individual present may have been a civilian, and the authority
    was aware of this person before the strike. The strike would be conducted while the meeting was in session.
  question: What should the target engagement authority do regarding the dynamic strike on the building when the religious
    nature of the complex has not been disclosed and the building is not on the category‑one no‑strike list?
  options:
    O1:
      do: The target engagement authority asks for more intelligence.
      move: ask
      irreversible: false
    O2:
      do: The target engagement authority approves the strike.
      move: act
      irreversible: true
    O3:
      do: The target engagement authority rejects the strike.
      move: act
      irreversible: true
    O4:
      do: The target engagement authority holds the decision pending verification.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Intelligence indicated that Al Qaida and Syrian militants would attend a meeting near al-Jinah village, Aleppo province
      on March 14‑15, 2017.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: Surveillance on March 16 confirmed a meeting was forming in a specific building in an ungoverned area known as an
      Al Qaida operational area.
  - id: F3
    kind: situation
    status: assessed
    fact: The strike cell assessed the meeting as a valid military target that could be struck proportionally.
  - id: F4
    kind: authority
    status: assessed
    fact: The target engagement authority approved a kinetic strike based on the information available at the time.
  - id: F5
    kind: situation
    status: assessed
    fact: The building struck was part of a religious complex—a small mosque and a larger structure under construction for
      religious use—not listed as a category‑one no‑strike entity.
  - id: F6
    kind: situation
    status: assessed
    fact: The target engagement authority was not informed that the small building was a mosque or that the complex had a
      religious purpose at the time of the decision.
  - id: F7
    kind: situation
    status: assessed
    fact: One individual present may have been a civilian; the target engagement authority was aware of this person before
      the strike and deemed the proportionality assessment acceptable.
  - id: F8
    kind: situation
    status: confirmed
    fact: The strike caused superficial damage to adjacent structures and no large number of civilian casualties were reported.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: hors_de_combat
    favors:
    - O2
    weight: strong
    why: Surveillance confirmed an Al Qaida and Syrian militant meeting in the building, making it a legitimate military target.
  - id: C2
    facts:
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The strike caused only superficial damage to adjacent structures and no large‑scale civilian casualties were reported,
      satisfying proportionality.
  - id: C3
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The building was not on the category‑one no‑strike list; the lack of disclosure about its religious use did not,
      by itself, make the strike unlawful.
  - id: C4
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: A possible civilian was identified, but the proportionality assessment deemed the expected civilian harm acceptable.
  - id: C5
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Eliminating an Al Qaida leadership meeting advances the overall counter‑terrorism mission.
  reasoning:
    read: A dynamic, time‑critical target—a confirmed Al Qaida meeting—was identified in an ungoverned area. The target engagement
      authority lacked information that the structure was part of a religious complex, but the building was not on the protected
      no‑strike list. The trap is a rush to strike without full situational awareness of protected status.
    weighing: The legitimacy of the combatant target (C1) and the mission benefit (C5) are decisive, while acceptable proportionality
      (C2) supports the strike. Missing religious‑status data (C3) and the possible civilian (C4) are acknowledged but judged
      insufficient to outweigh the combatant imperative. Consequently, the balance favors approval of the strike.
    tradecraft: The decision is recorded in the strike cell’s after‑action report, noting the intelligence gap about the religious
      complex for future procedural improvement.
    uncertainty: Limited post‑strike intelligence leaves some uncertainty about the exact number of civilian casualties.
    handoff: The target engagement authority acted alone under delegated kinetic‑strike authority, but the source recommends
      improved intel flow to higher‑echelon reviewers for future dynamic targets.
    tempting_wrong:
      option: O3
      pull: Reject the strike because the religious nature was undisclosed and the site might merit protection.
      why_wrong: The target was a confirmed combatant gathering; proportionality was satisfied and the building was not on
        the category‑one list, so rejection would forfeit a legitimate mission opportunity.
    rejected:
      O1: Requesting additional intelligence would have delayed action on a fleeting, high‑value target.
      O3: Rejecting the strike would ignore the confirmed combatant nature of the meeting and the acceptable collateral damage
        assessment.
      O4: Holding the decision pending verification would have missed the narrow window to engage the dynamic target.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The building had been listed as a category‑one no‑strike entity because of its religious function.
      then: O3
      why: Protected religious facilities require additional approvals; striking without that clearance would violate the
        no‑strike policy.
    - id: flip2
      if: Credible evidence emerged of a large number of civilian casualties.
      then: O3
      why: Excessive civilian harm would breach proportionality and the law of armed conflict.
    would_not_change:
    - id: noflip1
      if: The target remained a confirmed Al Qaida meeting despite the religious context.
      why: The combatant nature of the gathering sustains the legality of the strike.
    watch_for:
    - id: watch1
      what: Future dynamic targets where the religious or protected status of a structure is uncertain.
      favors:
      - O4
      why: Better pre‑strike analysis is needed to avoid similar information gaps.
  lesson: Dynamic strike decisions must be supported by complete intelligence on protected status, especially religious facilities,
    to ensure lawful targeting and minimize collateral harm.
  limits: This rule applies when the target is a verified combatant gathering; it does not extend to situations where civilian
    presence is high or the structure is a confirmed protected site.
