case:
  id: DR-ALJINAH-2017-restyle1@v1
  title: Approval of Dynamic Strike Without Religious Site Knowledge [restyle]
  status: needs_review
  setting: Northern district, Republic Y, March 2017, Joint Targeting Cell
  decider: the approving commander
  agent: the approving commander
  agent_role: decide
  situation: Intelligence reports indicated that an Al-Qaida faction together with local insurgents were arranging a meeting
    inside a particular structure close to al-Jinah village. Real-time surveillance verified that the assembly was about to
    commence within that building. The targeting cell judged the site to be a legitimate military objective and concluded
    that a kinetic strike would be proportionate. Unbeknownst to the approving commander, the structure formed part of a small
    mosque complex, a fact that had not been passed on before the decision point. The mosque and its adjoining facilities
    were absent from the category-one no-strike register. One person present might have been a civilian, possibly wounded,
    yet the commander believed the proportionality analysis remained lawful.
  question: What action should the approving commander take regarding authorization of the time-critical strike?
  options:
    O1:
      do: Authorize the kinetic strike now.
      move: act
      irreversible: true
    O2:
      do: Request additional on-site intelligence promptly.
      move: ask
      irreversible: false
    O3:
      do: Reject the strike outright today.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Al-Qaida operatives and Syrian insurgents were coordinating a meeting in a designated building near al-Jinah village.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: Surveillance platforms confirmed that the gathering was being set up inside the identified structure.
  - id: F3
    kind: situation
    status: confirmed
    fact: The locale is ungoverned and recognized as an Al-Qaida operational area.
  - id: F4
    kind: authority
    status: confirmed
    fact: The approving commander possesses the authority to sanction kinetic attacks.
  - id: F5
    kind: capability
    status: assessed
    fact: The targeting cell evaluated the site as a lawful military target and deemed a strike proportionate.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The modest mosque and neighboring edifices were not listed on the category-one no-strike register.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The approving commander was not briefed that the complex served a religious function.
  - id: F8
    kind: capability
    status: assessed
    fact: One individual observed on site may have been a civilian, potentially injured.
  - id: F9
    kind: capability
    status: assessed
    fact: The omission of the religious character of the buildings was judged a preventable oversight.
  considerations:
  - id: C1
    facts:
    - F7
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The commander was not apprised that the site was a place of worship, a preventable lapse that compromises analytical
      integrity.
  - id: C2
    facts:
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The possible presence of a civilian creates uncertainty in the proportionality calculation without full intelligence.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Although the targeting cell deemed the strike proportionate, that judgment rested on incomplete situational data.
  - id: C4
    facts:
    - F6
    equity: protected_activity
    favors:
    - O2
    weight: weak
    why: The mosque and its adjoining structures were omitted from the category-one no-strike list, a shortfall that should
      have prompted further review.
  - id: C5
    facts:
    - F9
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: The after-action review flags the omission as a preventable error, underscoring the need for more thorough pre-strike
      intelligence.
  reasoning:
    read: The case involves a dynamic, time-sensitive strike against a building slated for an Al-Qaida meeting, yet the approving
      commander lacks critical intelligence that the venue is part of a religious complex and that a potential civilian may
      be present. This information gap creates a risk of breaching proportionality and precaution obligations.
    weighing: The preventable omission of the religious status (C1) and the possible civilian presence (C2) outweigh the targeting
      cell's provisional proportionality finding (C3). Because law requires all relevant facts before a proportionality judgment,
      the balance favors requesting additional intelligence (O2).
    tradecraft: File a formal request, note the missing intelligence, and suspend the kinetic authorization until clarification
      on the religious-facility designation and civilian presence is obtained. Log the decision in the targeting system with
      justification referencing the analytic-integrity and civilian-life equities.
    uncertainty: Residual uncertainty remains regarding the exact combatant-to-civilian ratio and whether the building's religious
      status would have invoked a protected-activity exemption if known.
    handoff: The approving commander should forward the request to the intelligence analysis cell and the legal review team,
      ensuring they supply the missing data before any further action.
    tempting_wrong:
      option: O1
      pull: The pressure to neutralize a high-value Al-Qaida assembly quickly and the targeting cell's confidence in proportionality.
      why_wrong: Sanctioning the strike now would disregard the known intelligence gap, risking unlawful civilian harm and
        breaching precautionary duties.
    rejected:
      O1: An approved strike would proceed without the religious-facility information, contravening the finding that the omission
        was a preventable error.
      O3: A blanket denial would forfeit a legitimate military opportunity despite the target being a valid combatant gathering;
        the source calls for additional information rather than outright rejection.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: If the approving commander had been told that the building was a protected place of worship and appeared on the
        category-one no-strike register.
      then: O1
      why: Knowing the protected-activity status would permit a real-time exemption and allow lawful approval of the strike.
    - id: flip2
      if: If intelligence had verified that no civilians were present at the gathering.
      then: O1
      why: With civilian risk eliminated, the proportionality assessment becomes clear, supporting approval.
    would_not_change:
    - id: noflip1
      if: If the building were not on the no-strike list yet still functioned as a religious site.
      why: Even without formal listing, the religious nature should have been communicated, so the request for further intel
        remains warranted.
    watch_for:
    - id: watch1
      what: Any subsequent intelligence that definitively determines the civilian status of individuals on site.
      favors:
      - O1
      why: If civilians are conclusively ruled out, the urgency of the target may justify immediate approval.
  lesson: Dynamic strike decisions must rest on complete, accurate intelligence, especially concerning protected status and
    civilian presence. Any identified gap should trigger a pause and a request for additional information before granting
    approval.
  limits: This guidance applies to time-critical strikes against known combatant gatherings where essential contextual data—such
    as protected-activity status—is missing. It does not govern deliberate, fully vetted operations where all relevant intelligence
    has already been obtained.
