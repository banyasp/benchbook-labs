case:
  id: DR-CORPUS-NX-522b81d4-E1@v1
  title: Expanding the MDRS Program
  status: draft
  setting: HQDA; four months after the mid-2020 proof-of-purpose effort; active component units across the continental U.S.,
    Alaska, and Hawaii.
  decider: HQDA
  agent: HQDA
  agent_role: decide
  situation: The Army had used a proof-of-purpose MDRS effort modeled on 1st Cavalry Division’s Operation Pegasus Harvest.
    That operation began in mid-2020 to relieve a unit of excess equipment and prepare it for forthcoming modernized equipment.
    The proof-of-purpose effort had been assessed as a resounding success. MDRSs help units prepare for modernization by unburdening
    them of excess materiel and expediting its redistribution. They also provide property-accountability relief, maintenance
    support, and transportation coordination. Support for units other than active-duty units is possible case by case with
    AMC approval, while Army Reserve and National Guard units cannot use MDRSs for unneeded equipment under current funding
    constraints and facility backlogs. HQDA must decide whether to expand the capability beyond proof-of-purpose scale.
  question: What should HQDA do about expanding the MDRS program beyond its proof-of-purpose scale?
  options:
    O1:
      do: HQDA authorizes AMC to establish 13 additional MDRSs for active component units across the continental U.S., Alaska,
        and Hawaii.
      move: act
      irreversible: false
    O2:
      do: HQDA declines to authorize AMC to establish 13 additional MDRSs for active component units across the continental
        U.S., Alaska, and Hawaii.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: 1st Cavalry Division implemented Operation Pegasus Harvest in mid-2020.
  - id: F2
    kind: situation
    status: confirmed
    fact: Operation Pegasus Harvest aimed to relieve the unit of excess equipment and prepare it for forthcoming modernized
      equipment.
  - id: F3
    kind: situation
    status: assessed
    fact: The MDRS proof of purpose was assessed as a resounding success.
  - id: F4
    kind: capability
    status: confirmed
    fact: MDRSs help units prepare for ReARMM modernization by unburdening them of excess materiel and expediting its redistribution.
  - id: F5
    kind: capability
    status: confirmed
    fact: MDRSs provide immediate property-accountability relief.
  - id: F6
    kind: capability
    status: confirmed
    fact: MDRSs provide supported-unit-funded maintenance and transportation coordination.
  - id: F7
    kind: authority
    status: confirmed
    fact: AMC may approve MDRS support for units other than active-duty units on a case-by-case basis, depending on proximity,
      mission set, and other factors.
  - id: F8
    kind: situation
    status: confirmed
    fact: Army Reserve and Army National Guard units cannot use MDRSs for unneeded equipment because of funding constraints
      and current facility backlogs.
  - id: F9
    kind: situation
    status: confirmed
    fact: AMC maintains an open dialogue with Army Reserve and Army National Guard units about opportunities and similar capabilities
      within their formations.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The proof-of-purpose effort was assessed as a resounding success, supporting expansion beyond the initial site.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: MDRSs help units prepare for modernization by unburdening them of excess materiel and expediting redistribution,
      while also providing property-accountability relief, maintenance support, and transportation coordination.
  - id: C3
    facts:
    - F7
    - F8
    - F9
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: The stated expansion is for active component units. Support outside that group is case by case, and Reserve and National
      Guard use is constrained by funding and facility backlogs; those limits counsel for a scoped expansion rather than an
      assumption of universal access.
  reasoning:
    read: This is a decision about extending a capability that succeeded at proof-of-purpose scale, not a decision to make
      MDRSs available without distinction to every component. The trap is treating the Reserve and National Guard limitations
      as a reason to reject expansion for the active component, even though the stated expansion is specifically scoped to
      active component units.
    weighing: The resounding success of the proof of purpose is the central reason to expand {C1}. The program's stated benefits
      for modernization preparation, accountability, maintenance, and transportation reinforce that judgment {C2}. The component-specific
      funding and facility constraints limit the reach of the capability, but do not negate the case for the stated active-component
      expansion {C3}.
    tradecraft: Record the decision as an expansion for the stated active-component scope and preserve the distinction between
      that scope and case-by-case support for other units. Keep the rationale tied to the assessed proof-of-purpose success
      and the stated modernization benefits.
    uncertainty: The source gives no measures beyond its assessment that the proof of purpose was a resounding success, and
      it does not specify how the stated benefits vary across locations or units.
    handoff: HQDA decides whether to expand; AMC is the office directed to establish the additional sites and handles case-by-case
      consideration of support for other units.
    tempting_wrong:
      option: O2
      pull: Reserve and National Guard units cannot use MDRSs for unneeded equipment under current funding constraints and
        facility backlogs.
      why_wrong: That limitation concerns those components; it does not rebut the assessed success of the proof of purpose
        or the case for expanding the stated active-component capability.
    rejected:
      O2: HQDA did not leave the program at proof-of-purpose scale because the effort was assessed as a resounding success
        and the capability supports units preparing for modernization.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The proof-of-purpose effort had not been assessed as a success.
      then: O2
      why: Without the source's central evidence for expansion, the case for moving beyond proof-of-purpose scale would be
        materially weaker.
    would_not_change:
    - id: noflip1
      if: Reserve and National Guard units remain unable to use MDRSs because of funding constraints and facility backlogs.
      why: That limitation does not by itself change the decision about the stated expansion for active component units.
    watch_for:
    - id: watch1
      what: Whether proposed support for units other than active-duty units meets the stated case-by-case considerations,
        including proximity and mission set, and receives AMC approval.
      favors:
      - O1
      why: The source allows such support conditionally without treating it as unrestricted access.
  lesson: A successful proof of purpose can justify scaling a capability when its demonstrated benefits align with the mission
    need. Keep the expansion within its stated scope, and treat barriers affecting other groups as limits on access rather
    than automatic reasons to reject the supported expansion.
  limits: This reasoning supports the stated expansion for active component units, not unrestricted access across all Army
    components. It does not establish that expansion would be justified if the proof-of-purpose assessment or the program's
    benefits were different.
