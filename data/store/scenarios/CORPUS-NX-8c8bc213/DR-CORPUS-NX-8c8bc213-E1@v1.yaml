case:
  id: DR-CORPUS-NX-8c8bc213-E1@v1
  title: Coordinating an International Response
  status: draft
  setting: U.S., NATO, and EU campaign planning during a proposed response to Russian behavior.
  decider: The governments and institutions considering the campaign
  agent: The participating governments and institutions
  agent_role: decide
  situation: The planning problem concerns an international response campaign involving the United States, NATO, and the EU.
    NATO and the EU differ institutionally, and their consensus processes have complicated collaboration. Russia is assessed
    to understand those processes and to exploit institutional weaknesses. The campaign is framed as requiring a whole-of-government
    effort drawing on both institutions. The United States has a leading role at NATO but is not an EU member, and its mission
    there serves largely as an observer. Broad consensus might support multilateral action over time, while the campaign is
    also expected to begin soon and show results quickly; coordinating coherent policies across governments is difficult.
  question: What should the participating governments and institutions do about coordinating an international policy response
    to Russian behavior while multilateral institutions face consensus constraints?
  options:
    O1:
      do: The participating governments and institutions should decline coalition-based policy coordination and rely on multilateral
        agreement.
      move: act
      irreversible: false
    O2:
      do: The participating governments and institutions should authorize coalition-based policy coordination while continuing
        to pursue multilateral agreement.
      move: act
      irreversible: false
    O3:
      do: The participating governments and institutions should defer coalition-based policy coordination while seeking broader
        multilateral consensus.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: NATO-EU asymmetry and consensus decision-making create challenges for collaboration.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Russia is assessed to understand NATO and EU processes and to exploit their institutional weaknesses.
  - id: F3
    kind: situation
    status: assessed
    fact: The proposed campaign requires a whole-of-government response involving international actors and expertise from
      both NATO and the EU.
  - id: F4
    kind: situation
    status: confirmed
    fact: The United States is described as a lead nation at NATO, is not an EU member, and has a mission at the EU that largely
      observes EU activities and events.
  - id: F5
    kind: situation
    status: assessed
    fact: A single member state can block action in some multilateral institutions, including over an issue not germane to
      the subject at hand.
  - id: F6
    kind: situation
    status: assessed
    fact: A broad consensus could allow actions to be taken at the multilateral organizational level over time.
  - id: F7
    kind: situation
    status: assessed
    fact: The campaign is expected to start soon and show results quickly.
  - id: F8
    kind: situation
    status: assessed
    fact: Producing coherent policy across one nation's departments and agencies is difficult, and doing so internationally
      is more difficult but considered essential.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    - F7
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Russia can exploit NATO-EU asymmetries and consensus constraints, including single-state blockage, while the campaign
      must start soon and show results quickly. Waiting for multilateral consensus risks getting bogged down in inertia.
  - id: C2
    facts:
    - F3
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The campaign requires expertise from both institutions and a coherent international whole-of-government approach.
      International coordination is more difficult than coordinating one government, but is essential to accomplishing the
      task.
  - id: C3
    facts:
    - F1
    - F6
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: 'Coalition coordination need not displace multilateral institutions: broad consensus could support action through
      them over time. The recommended approach is to begin promptly through a coalition while continuing to pursue multilateral
      agreement.'
  - id: C4
    facts:
    - F1
    - F3
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Coordination will be less efficient than Russia's, but can make up for that shortfall in legitimacy. This supports
      coordinated action through a coalition rather than letting efficiency alone dictate the response.
  - id: C5
    facts:
    - F1
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The United States has a leading role at NATO but is not an EU member and is largely an observer at the EU. This institutional
      division complicates collaboration and supports a means of coordinating across both institutions without waiting for
      either to resolve its constraints.
  reasoning:
    read: This is a coordination decision under time pressure, not a choice between working with multilateral institutions
      and rejecting them. The trap is to let consensus procedures that Russia is assessed to understand and exploit delay
      the campaign, or to treat bypassing those procedures as a reason to abandon multilateral agreement altogether.
    weighing: Coalition-based coordination is recommended because the campaign needs to begin soon, consensus rules can block
      action, and coherent international coordination across NATO, the EU, and governments is essential {C1} {C2}. The coalition
      should continue to pursue multilateral agreement, since broad consensus may enable action at the institutional level
      over time {C3}. Coordination may be less efficient than Russia's, but legitimacy can compensate for that shortfall {C4}.
      The balance depends on the urgency of producing results and the continuing difficulty of coordination through the institutions,
      not on a claim that coalition action will be more efficient.
    tradecraft: Keep the decision focused on authorizing coalition-based policy coordination while preserving the multilateral
      track. Record the reasons for proceeding, the continuing effort to develop broader agreement, and any later change in
      whether multilateral processes can deliver action in time. These recording steps are decision-practice synthesis, not
      procedures specified in the text.
    uncertainty: The best way to organize a coalition is uncertain, and producing coherent policy internationally is difficult.
      The recommendation assumes that a core group can establish and run the coordination effort; it does not establish that
      coordination will be easy or efficient.
    handoff: The participating governments and institutions should decide together, drawing on expertise from both NATO and
      the EU. A single national or institutional perspective is insufficient for the international whole-of-government response
      required.
    tempting_wrong:
      option: O3
      pull: Waiting for broader multilateral consensus may appear to preserve unity and avoid acting around institutional
        procedures.
      why_wrong: The campaign needs to start soon and show results quickly, and multilateral inertia can prevent it from getting
        off the ground. Coalition coordination can begin promptly while broader agreement remains a goal.
    rejected:
      O1: Relying only on multilateral agreement risks delay from consensus constraints and does not meet the need to get
        the campaign started promptly.
      O3: Deferring coalition coordination gives institutional stalemate more time to impede action despite the campaign's
        need for timely results.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Broad multilateral consensus were already available and could produce the needed action promptly, without the delay
        or blockage that motivates coalition coordination.
      then: O1
      why: In that circumstance, the reason for authorizing coalition coordination to get action started around consensus
        constraints would no longer apply.
    would_not_change:
    - id: noflip1
      if: The United States remained a NATO leader but a nonmember of the EU with an observer role there.
      why: That institutional asymmetry is already part of the coordination problem and does not, by itself, defeat the case
        for coalition coordination while pursuing multilateral agreement.
    watch_for:
    - id: watch1
      what: Whether a broad consensus develops that permits action at the multilateral organizational level.
      favors:
      - O1
      why: Broad consensus can allow action at the multilateral organizational level over time, which could reduce the need
        to route policy coordination around institutional constraints.
  lesson: When consensus constraints threaten a time-sensitive policy response, consider authorizing coalition coordination
    rather than allowing institutional inertia to prevent action. Preserve the multilateral track where broader agreement
    could later support or extend the response, and weigh any efficiency gains against legitimacy.
  limits: This reasoning addresses alliance and policy coordination in the campaign as framed; it does not establish what
    particular substantive measures are lawful or appropriate. It also assumes that a coalition can coordinate coherently
    and does not resolve how to proceed if that assumption fails.
