case:
  id: DR-CORPUS-NX-d3c1a3f2-E7@v1
  title: Response Decision in Korea
  status: draft
  setting: Washington, during the Korean War, within the Truman Administration.
  decider: The Truman Administration
  agent: The Truman Administration
  agent_role: decide
  situation: After intervention in Korea, the United States faced a decision about its response. A senior U.S. commander recommended
    extreme measures against China. The Joint Chiefs of Staff urged a more measured response and feared global war. The Administration
    had to determine the scope of the U.S. response in Korea.
  question: What should the Truman Administration do in response to the intervention in Korea?
  options:
    O1:
      do: The Truman Administration expands the U.S. response to extreme measures against China and directs CIA to aid the
        effort.
      move: act
      irreversible: false
    O2:
      do: The Truman Administration limits the U.S. response to a limited war in Korea and directs CIA to aid the effort.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The United States faced a decision about how to respond in Korea.
  - id: F2
    kind: situation
    status: confirmed
    fact: The conflict at issue was in Korea.
  - id: F3
    kind: situation
    status: confirmed
    fact: China was involved in the war in Korea.
  - id: F4
    kind: situation
    status: confirmed
    fact: A senior U.S. commander recommended extreme measures against China.
  - id: F5
    kind: situation
    status: assessed
    fact: The Joint Chiefs of Staff feared that a broader response could lead to global war.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Joint Chiefs of Staff urged more measured responses.
  considerations:
  - id: C1
    facts:
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The Joint Chiefs feared that a broader response could lead to global war, favoring restraint in the scope of the
      U.S. response.
  - id: C2
    facts:
    - F4
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: A senior commander recommended extreme measures against China, but the passage gives no supporting reason for that
      recommendation.
  - id: C3
    facts:
    - F6
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The Joint Chiefs urged a more measured response, and that approach prevailed over the recommendation for extreme
      measures.
  - id: C4
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The Administration chose to continue fighting in Korea while supporting that effort, rather than abandoning the effort
      or expanding it to extreme measures against China.
  reasoning:
    read: The Administration faced a choice about the scope of its response in Korea, not simply whether to respond. The trap
      is to treat a senior commander's recommendation for extreme measures as a sufficient reason to expand the conflict,
      despite the Joint Chiefs' concern about global war.
    weighing: The Joint Chiefs' fear that a broader response could lead to global war and their recommendation for a measured
      approach outweighed the senior commander's recommendation for extreme measures. The Administration could still pursue
      the Korean effort through a limited war and support for that effort. The balance depends chiefly on the risk of expanding
      the conflict; the passage does not give a detailed assessment of that risk or the commander's reasons for favoring extreme
      measures.
    tradecraft: 'Keep the decision at the level of the response''s scope: record the competing recommendations, the global-war
      concern, and why the chosen limits address that concern while sustaining the Korean effort. Do not treat the direction
      to aid the effort as a reason to add operational details.'
    uncertainty: The passage identifies fear of global war but does not quantify the risk or specify what extreme measures
      were proposed. It also does not explain the senior commander's rationale beyond the recommendation itself.
    handoff: The Truman Administration made the decision after receiving the Joint Chiefs' recommendation; the passage does
      not identify a further required referral or approval.
    tempting_wrong:
      option: O1
      pull: A senior U.S. commander recommended extreme measures against China.
      why_wrong: The passage records that recommendation but gives the Joint Chiefs' global-war concern as the reason the
        more measured approach prevailed.
    rejected:
      O1: The Administration did not adopt extreme measures against China because the Joint Chiefs' more measured approach,
        driven by concern about global war, prevailed.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible assessment instead showed that extreme measures would not risk broadening the conflict into a global
        war.
      then: O1
      why: That would remove the stated concern that drove the preference for a measured response and could make the extreme
        course more persuasive.
    would_not_change:
    - id: noflip1
      if: The senior commander's recommendation for extreme measures remained the same, without additional reasons or evidence.
      why: The recommendation alone did not prevail over the Joint Chiefs' concern about global war.
    watch_for:
    - id: watch1
      what: Whether a broader response is assessed to risk global war.
      favors:
      - O2
      why: That was the stated concern behind the Joint Chiefs' preference for a measured response.
  lesson: When a response could broaden a conflict, weigh the risk of global escalation against the value of pursuing the
    mission. A measured course can preserve the effort while limiting the scope of the conflict.
  limits: This reasoning is specific to the passage's stated concern about global war and its choice between extreme measures
    and a limited war in Korea. It does not establish what response would be appropriate under different assessments of escalation
    risk or different circumstances.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-d3c1a3f2
    source: https://www.cia.gov/resources/csi/static/155eb005533535fac8508dbdca397f7f/CIA-in-the-Truman-Administration-A-1994-Conference.pdf
    episode_focus: The decision arose after North Korean and Chinese intervention in Korea. The passage contrasts the recommendation
      for extreme measures with the Joint Chiefs’ more measured approach, which prevailed because of concern about global
      war; exclude details of covert operations and their execution.
