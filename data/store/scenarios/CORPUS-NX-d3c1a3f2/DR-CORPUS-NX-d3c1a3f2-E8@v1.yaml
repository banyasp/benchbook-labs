case:
  id: DR-CORPUS-NX-d3c1a3f2-E8@v1
  title: Defining the Asian Defense Perimeter
  status: draft
  setting: National Press Club, January 12, 1950; Truman Administration policy on Asian defense commitments.
  decider: The Secretary of State
  agent: The Secretary of State
  agent_role: decide
  situation: The Secretary of State must decide whether Taiwan and Korea fall within the US defensive perimeter. US policymakers
    were focused on Europe, and the administration faced limits on available resources and pressure to concentrate commitments
    on defensible points of clear value. Military views supported a limited perimeter, while the prospect of Soviet involvement
    on Taiwan raised concern about sea lanes. The administration had disengaged from the Chinese civil war, and US forces
    had withdrawn from Korea. The decision concerns the scope of a US defense commitment amid competing assessments of strategic
    value and risk.
  question: What should the Secretary of State do about whether Taiwan and Korea fall within the US defensive perimeter?
  options:
    O1:
      do: The Secretary of State should include Taiwan and Korea within the US defensive perimeter.
      move: act
      irreversible: false
    O2:
      do: The Secretary of State should exclude Taiwan and Korea from the US defensive perimeter.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: US policymakers were deeply focused on European affairs, with Asia ranking low among their priorities.
  - id: F2
    kind: situation
    status: assessed
    fact: The administration faced limits on US resources and sought to focus on defensible points of clear value to the United
      States.
  - id: F3
    kind: situation
    status: assessed
    fact: The administration was reluctant to risk relations with US allies or dissipate resources pursuing anticolonialism
      and democracy goals in Asia.
  - id: F4
    kind: situation
    status: confirmed
    fact: A perimeter strategy had been articulated by the military the previous year, and the Joint Chiefs held that Taiwan
      was not important enough to warrant US troops to prevent a Chinese Communist takeover.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The CIA assessed a Chinese Communist takeover of Taiwan as probable during the summer of 1950.
  - id: F6
    kind: situation
    status: confirmed
    fact: The United States had announced its disengagement from the Chinese civil war after years of aid to the Nationalist
      government and unsuccessful mediation efforts.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Soviet involvement on Taiwan was viewed as a concern for sea lanes, but the rivalry was not considered sufficient
      to draw the United States into full-scale war with Communist China.
  - id: F8
    kind: situation
    status: assessed
    fact: Korea was perceived as peripheral and politically complicated and dubious.
  - id: F9
    kind: situation
    status: confirmed
    fact: The United States welcomed the Soviet troop withdrawal from Korea in late 1948 and withdrew its own forces in June
      1949.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: With Europe first among policymakers’ priorities and US resources limited, the administration sought to avoid commitments
      beyond defensible points of clear value.
  - id: C2
    facts:
    - F3
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: The administration was reluctant to risk relations with allies or spend resources pursuing goals in Asia that it
      regarded as quixotic.
  - id: C3
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Excluding Taiwan and Korea followed a perimeter strategy already articulated by the military; the Joint Chiefs judged
      Taiwan insufficiently important to warrant US troops to prevent a takeover.
  - id: C4
    facts:
    - F5
    - F6
    - F7
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: A Chinese Communist takeover of Taiwan was assessed as probable and Soviet involvement raised concern about sea lanes,
      but the administration had disengaged from the Chinese civil war and the rivalry was not considered sufficient to draw
      the United States into full-scale war with Communist China.
  - id: C5
    facts:
    - F8
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Korea was viewed as peripheral and politically complicated, and the United States had welcomed Soviet withdrawal
      before withdrawing its own forces.
  reasoning:
    read: The choice is whether to extend a US defense commitment to Taiwan and Korea despite a policy focused on Europe,
      limited resources, and a military-supported perimeter strategy. The trap is treating the risks surrounding Taiwan—especially
      the assessed likelihood of takeover and concern about sea lanes—as automatically requiring a commitment, when those
      concerns were distinguished from a reason to enter full-scale war.
    weighing: 'The balance favors exclusion: European priorities and resource limits support restraint {C1}, the established
      military perimeter supports it {C3}, and the rivalry was not considered sufficient to draw the United States into full-scale
      war {C4}. Korea’s perceived peripheral status and the prior troop withdrawal reinforce that judgment {C5}. The counterweight
      is concern about Soviet involvement and sea lanes {C4}; the balance could change if Taiwan or Korea were assessed to
      be a defensible point of clear US value or if the sea-lane risk became more consequential.'
    tradecraft: State the perimeter decision and its strategic rationale clearly, including the resource and military judgments
      relied on. Keep the assessment revisitable if the underlying strategic value or risks materially change.
    uncertainty: The CIA assessment made a takeover of Taiwan probable, and Soviet involvement was a concern for sea lanes.
      These were risks, though they were not then judged sufficient to justify a full-scale commitment.
    handoff: The Secretary of State makes the policy decision, informed by the military views already supporting a limited
      perimeter. No separate approval authority or binding rule dictating the outcome is identified.
    tempting_wrong:
      option: O1
      pull: Including Taiwan and Korea may seem necessary to protect an ally, deter Soviet involvement, and respond to the
        assessed likelihood of a takeover of Taiwan.
      why_wrong: The military did not consider Taiwan important enough to warrant troops, the administration had disengaged
        from the Chinese civil war, and the rivalry was not then enough to justify full-scale war; Korea was likewise regarded
        as peripheral.
    rejected:
      O1: The balance favors keeping Taiwan and Korea outside the perimeter because the commitments were not judged to warrant
        the resource and escalation risks.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The strategic assessment changed so that Taiwan and Korea were regarded as defensible points of clear value to the
        United States that required a defense commitment.
      then: O1
      why: The rationale for focusing commitments on defensible points of clear US value could support inclusion if the assessment
        changed to place Taiwan and Korea in that category.
    - id: flip2
      if: The assessed risk to sea lanes from Soviet involvement became sufficiently serious to warrant a US defense commitment.
      then: O1
      why: Concern about Soviet involvement and sea lanes could support a commitment if the risk became serious enough to
        warrant one.
    would_not_change:
    - id: noflip1
      if: Partisan criticism claimed that the decision abandoned an ally or invited an invasion, without a change in the strategic
        or military assessment.
      why: Criticism alone would not change the strategic and military judgments underlying the perimeter decision.
    watch_for:
    - id: watch1
      what: Whether concern about Soviet involvement on Taiwan and the security of sea lanes becomes more consequential.
      favors:
      - O1
      why: Soviet involvement raised sea-lane concerns, while the rivalry was not then considered sufficient to justify full-scale
        war.
  lesson: A defense commitment should reflect strategic value, available resources, and the risk of escalation, rather than
    treating every assessed threat as requiring intervention. Reassess the perimeter if the underlying judgment about a location’s
    value or the consequences of leaving it outside changes.
  limits: This reasoning applies to the 1950 policy choice as framed, including its assessments of Taiwan, Korea, and US resources.
    It does not determine what the United States should do under materially changed threats, commitments, or strategic conditions.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-d3c1a3f2
    source: https://www.cia.gov/resources/csi/static/155eb005533535fac8508dbdca397f7f/CIA-in-the-Truman-Administration-A-1994-Conference.pdf
    episode_focus: The account describes the Secretary of State’s speech as articulating a perimeter strategy, consistent
      with military views, while the administration prioritized Europe and sought to limit commitments and conserve resources.
      Treat the issue as the choice of where to make a defense commitment; exclude later partisan criticism except as context
      for the decision’s reception.
