case:
  id: DR-CORPUS-NX-2864f024-E2@v1
  title: The SSU’s Future in China
  status: draft
  setting: China, 1946, U.S. military and diplomatic leadership
  decider: The senior U.S. representative in China
  agent: The senior U.S. representative in China
  agent_role: decide
  situation: In 1946, the SSU operated in China and provided substantial intelligence coverage. Chinese Communist representatives
    had objected to its activities, and the senior U.S. representative had encouraged stopping its activity in northern and
    eastern China. The Nationalist government was concerned that a continuing U.S. intelligence service violated Chinese sovereignty,
    while Soviet hostility to U.S. intelligence activity in northern China was reported. U.S. officials differed about the
    service’s value, and the War Department favored continuation under limited control with Navy logistical support. Separating
    the SSU from military advisory and executive groups through a Navy arrangement was under consideration.
  question: What should the senior U.S. representative in China do about the SSU’s continued intelligence role and organizational
    control?
  options:
    O1:
      do: The U.S. military leadership discontinues the SSU’s intelligence role and deactivates the organization.
      move: act
      irreversible: false
    O2:
      do: The U.S. military leadership continues the SSU’s intelligence role under Navy control and support.
      move: act
      irreversible: false
    O3:
      do: The U.S. military leadership holds the SSU’s existing organizational arrangement pending further consultation.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The SSU was described as providing practically all intelligence emanating from the China Theater.
  - id: F2
    kind: situation
    status: confirmed
    fact: Chinese Communist representatives had protested SSU activities in northern China and Manchuria.
  - id: F3
    kind: situation
    status: confirmed
    fact: The senior U.S. representative had encouraged stopping SSU activities in northern and eastern China.
  - id: F4
    kind: situation
    status: assessed
    fact: The Nationalist government was concerned that the continued operation of a U.S. intelligence service violated Chinese
      sovereignty.
  - id: F5
    kind: intelligence
    status: assessed
    fact: U.S. intelligence reporting described Soviet hostility to U.S. intelligence operations in northern China since the
      end of the war.
  - id: F6
    kind: situation
    status: assessed
    fact: 'U.S. officials differed over continuation: a former U.S. information official criticized the SSU, while the head
      of an Army observer group supported continued operations.'
  - id: F7
    kind: situation
    status: assessed
    fact: The War Department recommended continuation under limited control with full logistical support from the Navy’s Seventh
      Fleet.
  - id: F8
    kind: situation
    status: confirmed
    fact: The senior U.S. representative did not want a direct tie to the SSU, seeking to avoid displeasing the Nationalist
      government, the Chinese Communists, or the Soviets.
  - id: F9
    kind: situation
    status: confirmed
    fact: The senior U.S. representative favored having the Navy assume control and support of the SSU, separating it from
      military advisory and executive groups.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The SSU was assessed to provide practically all intelligence emanating from the China Theater, making preservation
      of its intelligence coverage a substantial reason to retain its role.
  - id: C2
    facts:
    - F2
    - F4
    - F5
    - F8
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: Communist protests, Nationalist sovereignty concerns, and reported Soviet hostility made continued U.S. intelligence
      activity diplomatically costly. Marshall also wanted to avoid displeasing the parties involved.
  - id: C3
    facts:
    - F7
    - F8
    - F9
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The resolution was to retain the intelligence role while having the Navy assume control and support, separating the
      SSU from military advisory and executive groups and reducing the direct association Marshall wished to avoid.
  - id: C4
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: U.S. officials disagreed about the SSU's value, so consultation was warranted before deciding. The War Department
      favored continuation under limited control with Navy support, but the disagreement did not itself settle the choice.
  reasoning:
    read: This was a choice between losing a major source of China Theater intelligence and accepting diplomatic objections
      to its continued presence. The trap was treating those objections as requiring deactivation, or treating intelligence
      value as a reason to preserve the existing direct organizational tie; the outcome separates the intelligence role from
      that tie.
    weighing: The assessed intelligence contribution weighs strongly for {O2} {C1}. Protests, sovereignty concerns, and Soviet
      hostility weigh against continuation {C2}, but Marshall's concern about direct association could be addressed by Navy
      control and support {C3}. Conflicting official views called for consultation {C4}; after considering advice, Marshall
      favored continuation under the Navy arrangement rather than deactivation.
    tradecraft: Record the intelligence need, the diplomatic objections, and why the selected organizational arrangement addresses
      the concern about direct association. Reassess whether the intelligence contribution and the separation remain material;
      do not treat the organizational change as resolving every diplomatic objection.
    uncertainty: The record presents intelligence value and diplomatic concerns as assessments, not as a definitive resolution
      of their consequences. It also notes that the record does not make apparent how or whether reported Soviet espionage
      complicated Marshall's mission.
    handoff: Marshall sought advice from principal U.S. officials involved with intelligence in China and initially left the
      continuation decision to the theater commander. The eventual arrangement involved Navy control and support, with the
      War Department favoring continuation under limited control.
    tempting_wrong:
      option: O1
      pull: Deactivation would directly answer the objections to U.S. intelligence activity and avoid the appearance of a
        direct tie.
      why_wrong: It would discard a service assessed to provide practically all intelligence from the China Theater, despite
        the chosen alternative of preserving the role while changing organizational control.
    rejected:
      O1: Marshall did not choose deactivation because he ultimately judged the intelligence role valuable and favored separating
        it organizationally instead.
      O3: Holding the existing arrangement would leave the decision unresolved despite advice favoring continuation under
        Navy control and Marshall's stated preference for that arrangement.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The SSU no longer provided substantial intelligence coverage for the China Theater.
      then: O1
      why: The principal reason for preserving the role was its assessed contribution to China Theater intelligence; without
        that contribution, the diplomatic costs would weigh more heavily.
    - id: flip2
      if: Navy control could not separate the intelligence role from the direct association that concerned Marshall, and the
        diplomatic objections remained.
      then: O1
      why: The chosen arrangement depended on retaining intelligence value while reducing the direct organizational tie that
        Marshall wished to avoid.
    would_not_change:
    - id: noflip1
      if: Reporting continued to describe a Soviet-CCP relationship and Soviet hostility to U.S. intelligence activity.
      why: Those concerns were already part of the balance; Marshall remained aware of the expanding relationship while continuing
        to avoid alienating Mao and his associates.
    watch_for:
    - id: watch1
      what: Whether the SSU continues to provide the assessed essential intelligence coverage.
      favors:
      - O2
      why: The intelligence coverage was the central reason for retaining the role.
    - id: watch2
      what: Whether the Navy arrangement continues to separate the SSU from military advisory and executive groups.
      favors:
      - O2
      why: Marshall favored Navy control and support in order to disassociate those groups from the intelligence agency.
  lesson: When an intelligence role is assessed as essential but its organizational association creates diplomatic costs,
    consider whether a different control arrangement can preserve the role while reducing that association. The arrangement
    should be judged against both the continuing intelligence need and the concerns it was meant to address.
  limits: This reasoning concerns the 1946 China decision as described, including the specific assessment of the SSU's intelligence
    value and the available Navy arrangement. It does not establish that continuation is appropriate where the intelligence
    need, diplomatic context, or lawful authority differs.
