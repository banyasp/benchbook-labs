case:
  id: DR-CORPUS-NX-e602ecee-E4@v1
  title: Competing Order-of-Battle Estimates
  status: draft
  setting: South Vietnam and Washington, 1967; the CIA and the intelligence and defense communities.
  decider: The CIA director
  agent: The CIA director
  agent_role: decide
  situation: In 1967, amid growing controversy over the war at home, the administration pressed military leaders to show progress.
    The military assessment put communist forces in South Vietnam at about 270,000 fighters, largely North Vietnamese Army
    regulars. CIA analysts assessed that about 600,000 enemy fighters were actively engaged, including Viet Cong militias,
    Main Force units, and North Vietnamese regulars. A senior military commander publicly told Congress in late November that
    the war would soon wind down and predicted a successful conclusion, perhaps within a year. CIA analysts argued that the
    military assessment overlooked or discounted large numbers of Viet Cong militia and Main Force fighters. The competing
    estimates raised concern about a schism within the intelligence and defense communities.
  question: What should the CIA director do about the competing force estimates in the order-of-battle assessment and their
    presentation to the President?
  options:
    O1:
      do: The CIA director should ask both communities to reconcile estimates before presenting an order-of-battle count to
        the President for the current assessment.
      move: ask
      irreversible: false
      to: the intelligence and defense communities
    O2:
      do: The CIA director should include the CIA estimate in key judgments, retain the military estimate as competing, and
        present both to the President.
      move: act
      irreversible: false
    O3:
      do: The CIA director should exclude the CIA estimate from key judgments, relegate it to supporting pages, accept the
        military figures, and send the President a compromise count.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In 1967, amid growing controversy over the war at home, the administration increased pressure on military leaders
      to show progress.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The military estimate put communist forces in South Vietnam at about 270,000 fighters, largely North Vietnamese
      Army regulars, after a significant decrease over two years of intensive combat.
  - id: F3
    kind: intelligence
    status: assessed
    fact: CIA analysts estimated that about 600,000 enemy fighters were actively engaged in South Vietnam, including Viet
      Cong militias, Viet Cong Main Force units, and North Vietnamese regulars.
  - id: F4
    kind: intelligence
    status: assessed
    fact: In late November 1967, a senior military commander carried the military estimate to the United States, told Congress
      publicly that the war would soon wind down, and predicted a successful conclusion perhaps within a year based on losses
      in large-unit actions.
  - id: F5
    kind: intelligence
    status: assessed
    fact: CIA analysts judged that the military focus on North Vietnamese units ignored or dismissed large numbers of Viet
      Cong militia and Main Force fighters.
  - id: F6
    kind: situation
    status: assessed
    fact: Avoiding a schism within the intelligence and defense communities was a concern for the CIA director.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: CIA analysts assessed a much larger force and said the military's focus on North Vietnamese units overlooked or discounted
      Viet Cong militia and Main Force fighters. That supports preserving the CIA assessment in the key judgments rather than
      presenting the military figure alone.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Avoiding a schism within the intelligence and defense communities was the director's stated concern, and he acted
      on that concern by overruling his analysts and accepting the military figures.
  - id: C3
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The military estimate reflected its assessment of a significant decrease after intensive combat, and its senior commander
      publicly predicted the war would soon wind down based on losses in large-unit actions. These facts explain the military
      position the director accepted, but do not resolve the disagreement about which force categories were counted.
  reasoning:
    read: 'The dispute was not simply between two counts of an identically defined force: the CIA assessment included Viet
      Cong militia and Main Force fighters that analysts said the military focus overlooked or discounted. The trap is to
      treat the military''s smaller figure and public forecast as though they settled that difference, especially amid pressure
      to show progress.'
    weighing: The CIA analysts' account favored retaining their estimate in the key judgments, but the director gave priority
      to avoiding a schism in the intelligence and defense communities. He overruled the analysts, accepted the military figures,
      and the President received a compromise count. The source gives no independent resolution of which estimate was more
      accurate; the balance therefore turns on the director's stated priority of avoiding a schism, not on proof that the
      estimates were reconciled.
    tradecraft: Relegate the larger CIA figures to supporting pages and give the President the compromise count. Keep the
      compromise count distinct from the competing assessments in the decision record; it should not imply that the underlying
      disagreement was resolved.
    uncertainty: The source records competing assessments and the CIA analysts' explanation of the difference, but does not
      establish which total was correct or provide a reconciliation of the estimates.
    handoff: The CIA director made the decision. Involving both intelligence and defense communities in clarifying the estimates
      would be a reasonable process option, but the source does not say that such a reconciliation occurred before the director
      chose O3.
    tempting_wrong:
      option: O2
      pull: It preserves the CIA analysts' larger estimate in the key judgments and makes the disagreement visible to the
        President.
      why_wrong: 'It does not match the director''s stated priority in this episode: avoiding a schism. He overruled the analysts
        and allowed the larger CIA figures to be removed from the key judgments.'
    rejected:
      O1: The director did not defer presentation for reconciliation; he instead overruled his analysts and accepted the military
        figures to avoid a schism.
      O2: The director chose not to retain the CIA estimate in the key judgments, instead relegating it to supporting pages
        and sending the President a compromise count.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C2
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The concern about a schism were absent or could be addressed without excluding the CIA assessment from the key judgments.
      then: O2
      why: The CIA analysts' stated concern was that the military estimate overlooked or discounted large numbers of Viet
        Cong fighters; if cohesion no longer required suppressing that assessment, preserving both estimates for the President
        would better reflect the recorded disagreement.
    - id: flip2
      if: Both communities could reconcile the estimates before the President needed an order-of-battle count.
      then: O1
      why: A workable reconciliation would address the stated concern about a schism while clarifying the competing force
        estimates before presentation.
    would_not_change:
    - id: noflip1
      if: The CIA assessment remains larger than the military assessment while the concern about a schism remains.
      why: That is the central conflict the director faced, and the source records that he chose to avoid a schism despite
        the larger CIA assessment.
    watch_for:
    - id: watch1
      what: Whether the estimates use different force categories, particularly whether Viet Cong militia and Main Force fighters
        are included.
      favors:
      - O2
      - O1
      why: Clarifying the scope of each estimate could show whether the disagreement can be reconciled or whether both assessments
        need to remain visible.
  lesson: When competing assessments count different categories, do not mistake a compromise figure for a reconciliation of
    the underlying analysis. If cohesion is the deciding priority, make that tradeoff explicit and preserve enough of the
    competing assessment to keep the disagreement intelligible.
  limits: This reasoning describes the director's choice in this specific dispute and does not establish that avoiding internal
    disagreement should generally outweigh analytic integrity. The source does not determine which force estimate was accurate
    or state a legal rule governing how the estimates had to be presented.
