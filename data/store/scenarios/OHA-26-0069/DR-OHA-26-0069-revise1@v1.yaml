case:
  id: DR-OHA-26-0069-revise1@v1
  title: Guideline J Criminal Conduct Security Concern Decision [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, September 1 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires a security clearance. He reported
    a long history of arrests, charges, and convictions dating from 1998 through 2022 in his security questionnaire. The Local
    Security Office issued a Notification Letter citing the Bond Amendment and Guideline J as reasons to doubt his eligibility,
    and later added new 2026 firearm and evidence‑tampering charges to the Summary of Security Concerns. The Administrative
    Judge must determine whether the Guideline J concerns have been resolved sufficiently to grant an access authorization.
    The record includes the Individual’s testimony about reduced substance use, community service, and participation in a
    moral‑recognition program after 2011.
  question: What should the Administrative Judge do regarding the Individual’s Guideline J security concern?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge grants the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge asks the LSO for additional evidence.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual reported numerous arrests, charges, and convictions from 1998 to 2022 in his security questionnaire.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office sent a Notification Letter that cited the Bond Amendment and Guideline J as security concerns.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Bond Amendment bars a clearance for anyone sentenced to imprisonment exceeding one year and incarcerated for
      at least one year.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual was incarcerated for more than one year after a 1998 armed‑robbery conviction.
  - id: F6
    kind: situation
    status: confirmed
    fact: In March 2026 the LSO updated the Summary of Security Concerns to add firearm‑possession‑by‑felon and tampering‑with‑evidence
      charges.
  - id: F7
    kind: authority
    status: confirmed
    fact: Regulations require the adjudicator to decide whether granting or restoring a clearance will not endanger the common
      defense and is consistent with the national interest.
  - id: F8
    kind: situation
    status: assessed
    fact: The Individual testified that he has reduced alcohol use, stopped marijuana, performs annual Forest Service volunteer
      work, and credits a moral‑recognition therapy program after 2011.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The record does not demonstrate any mitigating conditions under Guideline J such as elapsed time, coercion, lack
      of reliable evidence, or successful rehabilitation.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The statutory bar still applies, but without additional evidence its impact is reduced, making it only a weak reason
      to deny.
  - id: C2
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Absence of Guideline J mitigating conditions remains a concern, yet the incomplete record lessens its persuasive
      power.
  - id: C3
    facts:
    - F6
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The LSO added 2026 firearm and evidence-tampering charges without proper notice, creating a procedural deficiency
      that obligates the Judge to seek further evidence before deciding.
  - id: C4
    facts:
    - F2
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The Individual's testimony is inconsistent, but without corroborating evidence its effect is limited, so it only
      weakly supports denial.
  reasoning:
    read: The record shows a long criminal history, a statutory Bond-Amendment bar, recent 2026 charges added without notice,
      and post-2011 claims of reduced substance use and community service.
    weighing: Because {C3} now carries strong weight in favor of O4 and the other considerations have been downgraded to weak,
      the procedural need for additional evidence outweighs the weakened arguments for denial. The balance therefore points
      to asking the LSO for more evidence.
    tradecraft: The Administrative Judge issues an order requesting the Local Security Office to provide supplemental documentation
      and clarification on the 2026 charges before any final clearance decision is made.
    uncertainty: Moderate; the procedural flaw is clear, but the ultimate security risk cannot be fully assessed until the
      requested evidence is received.
    handoff: The Judge retains adjudicative authority but must coordinate with the LSO to obtain the additional evidence,
      preserving the due-process role of both entities.
    tempting_wrong:
      option: O2
      pull: The Bond Amendment and the absence of Guideline J mitigating factors make denial appear straightforward.
      why_wrong: Denial would be premature because the record is incomplete; the procedural defect requires further evidence
        before a definitive determination.
    rejected:
      O1: Holding the decision pending evidence is redundant; a formal request for evidence is the appropriate procedural
        step.
      O2: Denial would ignore the need to address the LSO's procedural lapse and could be reversed if later evidence shows
        rehabilitation.
      O3: Granting would violate the Bond Amendment and Guideline J without first resolving the evidentiary gaps.
  verdict:
    choice: O4
    basis: recommended
    decisive:
    - C3
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A mitigating condition under Guideline J such as a long period of no criminal conduct (≥10 years) were established.
      then: O2
      why: ¶32(a) would resolve the concern if sufficient time had elapsed without recurrence, leading the Judge to deny the
        clearance.
    - id: flip2
      if: The Individual could demonstrate successful rehabilitation, e.g., sustained employment, education, and community
        service with no further incidents.
      then: O3
      why: ¶32(d) would apply if rehabilitation were proven, removing the Guideline J barrier.
    would_not_change:
    - id: noflip1
      if: The Individual remains incarcerated for more than one year for a felony.
      why: The Bond Amendment is a statutory bar that cannot be waived absent extraordinary circumstances.
    watch_for:
    - id: watch1
      what: Future credible evidence of sustained rehabilitation and absence of new criminal conduct.
      favors:
      - O3
      why: New mitigating evidence could satisfy ¶32(d) and shift the balance toward granting.
  lesson: When procedural deficiencies arise in the security-concern record, the adjudicator must seek additional evidence
    before rendering a final clearance decision, even if statutory bars exist.
  limits: This analysis applies solely to DOE security-clearance adjudications under 10 C.F.R. Part 710 and does not extend
    to other employment or licensing contexts.
