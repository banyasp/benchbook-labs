case:
  id: DR-OHA-26-0069-addfact1@v1
  title: Guideline J Criminal Conduct Security Concern Decision [addfact]
  status: needs_review
  setting: U.S. Department of Energy, Office of Hearings and Appeals, 1 September 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The individual is a DOE contractor employee whose position requires a security clearance. He disclosed on his
    security questionnaire a lengthy record of arrests, charges, and convictions from 1998 through 2022. The Local Security
    Office responded with a Notification Letter that raised concerns under the Bond Amendment and Guideline J, noting that
    the Bond Amendment bars clearance for anyone sentenced to more than one year of imprisonment and who has served at least
    one year—a condition the individual meets due to a post-1998 armed-robbery incarceration exceeding one year. In March
    2026 the LSO updated the Summary of Security Concerns to add allegations of felon-in-possession of a firearm and evidence
    tampering. Regulations require the adjudicator to decide whether granting or restoring a clearance would endanger the
    common defense or conflict with the national interest. The individual testified that, after 2011, he reduced his alcohol
    use, stopped using marijuana, volunteers annually with the Forest Service, and completed a moral-recognition therapy program.
    However, the record does not contain any mitigating circumstances under Guideline J, such as sufficient elapsed time,
    coercion, unreliable evidence, or proven rehabilitation. The individual's employer submitted a favorable security suitability
    assessment, asserting that since 2015 he has consistently demonstrated trustworthiness and reliability in handling classified
    information.
  question: How should the Administrative Law Judge resolve the Guideline J security concern for this individual?
  options:
    O1:
      do: Place the decision on hold pending further evidence.
      move: hold
      irreversible: false
    O2:
      do: Reject the individual's request for an access authorization.
      move: act
      irreversible: true
    O3:
      do: Approve the individual's request for an access authorization.
      move: act
      irreversible: true
    O4:
      do: Direct the Local Security Office to obtain evidence.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The subject works for a Department of Energy contractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In his security questionnaire, the subject disclosed a series of arrests, charges, and convictions spanning from
      1998 through 2022.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter identifying concerns under the Bond Amendment and Guideline
      J.
  - id: F4
    kind: authority
    status: confirmed
    fact: Under the Bond Amendment, any individual sentenced to more than one year of imprisonment and who has served at least
      one year is ineligible for a clearance.
  - id: F5
    kind: situation
    status: confirmed
    fact: The subject served a prison term exceeding one year following a 1998 armed-robbery conviction.
  - id: F6
    kind: situation
    status: confirmed
    fact: In March 2026 the LSO amended the Summary of Security Concerns to include charges for unlawful firearm possession
      by a felon and for evidence tampering.
  - id: F7
    kind: authority
    status: confirmed
    fact: Regulatory guidance obliges the adjudicator to determine that granting or reinstating a clearance will not jeopardize
      the common defense and aligns with the national interest.
  - id: F8
    kind: situation
    status: assessed
    fact: The subject testified that, after 2011, he curtailed alcohol consumption, ceased marijuana use, performs yearly
      volunteer work with the Forest Service, and participated in a moral-recognition therapy program.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The file lacks any mitigating factors under Guideline J, such as sufficient elapsed time, evidence of coercion,
      unreliable evidence, or documented successful rehabilitation.
  - id: F10
    kind: situation
    status: confirmed
    fact: The subject's employer provided a positive security suitability assessment, stating that since 2015 he has consistently
      shown trustworthiness and reliability in handling classified material.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment (50 U.S.C. § 3343(c)(1)(A)) prohibits clearance for anyone who received a sentence longer than
      one year and has actually served at least one year; the subject satisfies both elements because of the post-1998 armed-robbery
      incarceration.
  - id: C2
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: No Guideline J mitigating factor—elapsed time, coercion, unreliable evidence, or documented rehabilitation—is present;
      the criminal record remains recent and extensive.
  - id: C3
    facts:
    - F6
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Although the LSO added 2026 firearm-possession and evidence-tampering allegations without prior notice, the judge
      evaluated them and found they do not overcome the statutory bar.
  - id: C4
    facts:
    - F2
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The subject's own testimony contains contradictions and lacks independent corroboration, further eroding credibility
      and reinforcing Guideline J concerns.
  reasoning:
    read: The record presents a long series of arrests, convictions, and recent felony allegations. The Bond Amendment imposes
      a categorical bar, and Guideline J offers no mitigating circumstance. Post-2011 lifestyle changes and the employer's
      favorable assessment ({F10}) are noted but insufficient to offset the statutory and adjudicative barriers.
    weighing: Applying {C1} and {C2} establishes an absolute statutory exclusion and a lack of Guideline J mitigation. {C4}
      further weakens the subject's credibility, while {C3} is acknowledged but does not shift the balance. The cumulative
      analysis leads to a denial.
    tradecraft: The Administrative Law Judge issues a final decision, documents the findings, and informs the individual of
      the denial and appeal rights per 10 C.F.R. § 710.28.
    uncertainty: Low; the statutory language of the Bond Amendment and the absence of any Guideline J mitigating factor leave
      little room for discretion.
    handoff: The adjudicator retains sole authority to resolve the security-clearance concern under the regulations.
    tempting_wrong:
      option: O3
      pull: The employer's positive assessment and the subject's community service after 2011 might appear to warrant a grant.
      why_wrong: Without a qualifying Guideline J mitigating condition or a sentence below the Bond Amendment threshold, granting
        would violate statutory and adjudicative requirements.
    rejected:
      O1: Holding the decision pending further evidence contradicts the presumption against granting when a clear statutory
        bar exists.
      O3: Approval would ignore the Bond Amendment and the unresolved Guideline J concerns despite the employer's endorsement.
      O4: The LSO's additional evidence has already been considered; no new mitigating facts have emerged.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A Guideline J mitigating condition such as at least ten years of uninterrupted good conduct were documented.
      then: O3
      why: Paragraph 32(a) would be satisfied, removing the Guideline J barrier and permitting a clearance.
    - id: flip2
      if: The individual could demonstrate proven rehabilitation—sustained employment, education, and community service with
        no further incidents.
      then: O3
      why: Paragraph 32(d) would apply, allowing the clearance despite the prior record.
    would_not_change:
    - id: noflip1
      if: The individual remains incarcerated for more than one year for a felony.
      why: The Bond Amendment is an immutable statutory bar that cannot be waived absent extraordinary circumstances.
    watch_for:
    - id: watch1
      what: Credible, documented evidence of long-term rehabilitation and the absence of new criminal conduct.
      favors:
      - O3
      why: Such evidence could satisfy Guideline J paragraph 32(d) and shift the balance toward granting.
  lesson: Under DOE Part 710 and the Adjudicative Guidelines, a conviction that triggers the Bond Amendment and a criminal
    history lacking any Guideline J mitigating factor—elapsed time, coercion, unreliable evidence, or proven rehabilitation—justifies
    denying a security clearance.
  limits: This analysis is confined to security-clearance determinations governed by 10 C.F.R. Part 710 and the DOE Adjudicative
    Guidelines; it does not extend to unrelated employment, licensing, or non-DOE security contexts.
