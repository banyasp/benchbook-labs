case:
  id: DR-OHA-26-0069-restyle1@v1
  title: Guideline J Criminal Conduct Security Concern Decision [restyle]
  status: needs_review
  setting: Office of Security Clearance Review, October 12 2026
  decider: Senior Adjudicator
  agent: Senior Adjudicator
  agent_role: decide
  situation: The employee works for a Department of Energy subcontractor in a role that requires a personnel clearance. In
    his clearance questionnaire he disclosed a lengthy series of arrests, indictments, and convictions spanning 1998 through
    2022. The Local Security Office issued a Notice Letter invoking the Bond Amendment and Guideline J as grounds for concern,
    and later appended fresh 2026 firearm-possession and evidence-tampering allegations to the Summary of Security Issues.
    The Senior Adjudicator must decide whether the Guideline J issues have been sufficiently mitigated to permit a clearance
    grant. The record contains the employee's statements that he has curtailed alcohol consumption, ceased marijuana use,
    performs yearly volunteer work with the Forest Service, and attributes his change to a moral-recognition counseling program
    after 2011.
  question: How should the Senior Adjudicator resolve the employee's Guideline J security issue?
  options:
    O1:
      do: The Senior Adjudicator delays the ruling pending further evidence.
      move: hold
      irreversible: false
    O2:
      do: The Senior Adjudicator denies the employee's clearance request today.
      move: act
      irreversible: true
    O3:
      do: The Senior Adjudicator grants the employee's clearance request now.
      move: act
      irreversible: true
    O4:
      do: The Senior Adjudicator orders the LSO to provide evidence.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is employed by a DOE subcontractor in a position that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee disclosed multiple arrests, indictments, and convictions from 1998 to 2022 on his questionnaire.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office dispatched a Notice Letter that cited the Bond Amendment and Guideline J as security concerns.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Bond Amendment prohibits clearance for any individual sentenced to more than one year of imprisonment and who
      has served at least one year of that sentence.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee served a prison term exceeding one year following a 1998 armed-robbery conviction.
  - id: F6
    kind: situation
    status: confirmed
    fact: In March 2026 the LSO revised the Summary of Security Issues to incorporate charges for unlawful firearm possession
      and evidence-tampering.
  - id: F7
    kind: authority
    status: confirmed
    fact: Regulations require the adjudicator to determine whether granting or restoring a clearance would jeopardize the
      common defense and align with the national interest.
  - id: F8
    kind: situation
    status: assessed
    fact: The employee testified that he has reduced his alcohol intake, stopped using marijuana, volunteers annually with
      the Forest Service, and credits a moral-recognition therapy program for his improvement after 2011.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The file contains no evidence of any Guideline J mitigating factor such as elapsed time, coercion, unreliable evidence,
      or verified rehabilitation.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment (50 U.S.C. § 3343(c)(1)(A)) bars any person who received a sentence longer than one year and actually
      served at least one year, which applies to the employee's 1998 armed-robbery incarceration.
  - id: C2
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: No qualifying mitigating circumstance under Guideline J exists because the criminal record is recent, extensive,
      and lacks any extraordinary context.
  - id: C3
    facts:
    - F6
    equity: due_process
    favors:
    - O2
    weight: weak
    why: The LSO introduced the 2026 charges to the SSI without formal notice, yet the adjudicator still evaluated them and
      found they did not outweigh the pre-existing concerns.
  - id: C4
    facts:
    - F2
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The employee's statements contain numerous inconsistencies and lack independent corroboration, weakening credibility
      and reinforcing the Guideline J issues.
  reasoning:
    read: The dossier reveals a multi-decade pattern of arrests, convictions, and fresh felony allegations. The LSO invoked
      both the Bond Amendment and Guideline J. Although the employee points to post-2011 reform, the adjudicator finds no
      adequate mitigating evidence.
    weighing: Applying {C1} and {C2}, the statutory bar and the absence of any Guideline J mitigating factor outweigh the
      employee's post-2011 assertions. {C4} further erodes trust, while {C3} is noted but does not shift the balance. The
      aggregate analysis supports denial.
    tradecraft: The Senior Adjudicator issues a final Decision, records the findings, and informs the employee of the denial
      and his appeal rights pursuant to 10 C.F.R. § 710.28.
    uncertainty: Minimal; the clear statutory language and the lack of mitigating conditions leave little ambiguity.
    handoff: The Senior Adjudicator acts independently, as the regulations vest sole authority in the adjudicator to resolve
      the security issue.
    tempting_wrong:
      option: O3
      pull: The employee's community service and therapy after 2011 could tempt a grant.
      why_wrong: Absent a qualifying mitigating condition—elapsed time, coercion, unreliable evidence, or proven rehabilitation—the
        grant would conflict with Guideline J and the Bond Amendment.
    rejected:
      O1: Deferring the ruling would run counter to the presumption against granting a clearance when substantial doubts remain.
      O3: Approving would disregard the statutory Bond Amendment and the unresolved Guideline J concerns.
      O4: The record already reflects all available evidence; no further material exists to alter the assessment.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A Guideline J mitigating circumstance such as a ten-year period without any criminal conduct were documented.
      then: O3
      why: Paragraph 32(a) would satisfy the concern if sufficient time had elapsed without recurrence.
    - id: flip2
      if: The employee could prove successful rehabilitation, for example through sustained employment, education, and ongoing
        community service with no new incidents.
      then: O3
      why: Paragraph 32(d) would apply if rehabilitation were convincingly demonstrated, removing the Guideline J barrier.
    would_not_change:
    - id: noflip1
      if: The employee remains incarcerated for more than one year for a felony.
      why: The Bond Amendment is a mandatory statutory bar that cannot be waived except under extraordinary circumstances.
    watch_for:
    - id: watch1
      what: Future credible documentation of lasting rehabilitation and an absence of new criminal activity.
      favors:
      - O3
      why: New mitigating evidence could meet Paragraph 32(d) and tip the balance toward granting.
  lesson: Under DOE Part 710 and the Adjudicative Guidelines, a sustained pattern of serious criminal conduct that lacks any
    of the four mitigating factors—elapsed time, coercion, unreliable evidence, or verified rehabilitation—justifies denial
    of a security clearance.
  limits: This analysis is confined to security-clearance determinations governed by 10 C.F.R. Part 710 and the DOE Adjudicative
    Guidelines; it does not extend to unrelated employment or civilian licensing contexts.
