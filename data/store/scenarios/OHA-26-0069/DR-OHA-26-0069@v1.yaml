case:
  id: DR-OHA-26-0069@v1
  title: Guideline J Criminal Conduct Security Concern Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, September 1 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires a security clearance. He reported
    a long history of arrests, charges, and convictions dating from 1998 through 2022 in his security questionnaire. The Local
    Security Office issued a Notification Letter citing the Bond Amendment and Guideline J as reasons to doubt his eligibility,
    and later added new 2026 firearm and evidence‑tampering charges to the Summary of Security Concerns. The Administrative
    Judge must determine whether the Guideline J concerns have been resolved sufficiently to grant an access authorization.
    The record includes the Individual’s testimony about reduced substance use, community service, and participation in a
    moral‑recognition program after 2011.
  question: What should the Administrative Judge do regarding the Individual’s Guideline J security concern?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge grants the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge asks the LSO for additional evidence.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual reported numerous arrests, charges, and convictions from 1998 to 2022 in his security questionnaire.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office sent a Notification Letter that cited the Bond Amendment and Guideline J as security concerns.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Bond Amendment bars a clearance for anyone sentenced to imprisonment exceeding one year and incarcerated for
      at least one year.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual was incarcerated for more than one year after a 1998 armed‑robbery conviction.
  - id: F6
    kind: situation
    status: confirmed
    fact: In March 2026 the LSO updated the Summary of Security Concerns to add firearm‑possession‑by‑felon and tampering‑with‑evidence
      charges.
  - id: F7
    kind: authority
    status: confirmed
    fact: Regulations require the adjudicator to decide whether granting or restoring a clearance will not endanger the common
      defense and is consistent with the national interest.
  - id: F8
    kind: situation
    status: assessed
    fact: The Individual testified that he has reduced alcohol use, stopped marijuana, performs annual Forest Service volunteer
      work, and credits a moral‑recognition therapy program after 2011.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The record does not demonstrate any mitigating conditions under Guideline J such as elapsed time, coercion, lack
      of reliable evidence, or successful rehabilitation.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment (50 U.S.C. § 3343(c)(1)(A)) bars any person who was sentenced to imprisonment exceeding one year
      and incarcerated for at least one year, which the Individual experienced after the 1998 armed‑robbery conviction.
  - id: C2
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: None of the mitigating conditions under Guideline J apply because the criminal history is recent, extensive, and
      shows no unusual circumstances.
  - id: C3
    facts:
    - F6
    equity: due_process
    favors:
    - O2
    weight: weak
    why: The LSO added 2026 charges to the SSC without proper notice, but the Judge still considered them and concluded they
      did not overcome the existing security concerns.
  - id: C4
    facts:
    - F2
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Individual’s testimony is riddled with contradictions and lacks corroboration, undermining credibility and reinforcing
      the Guideline J concerns.
  reasoning:
    read: The record shows a decades‑long pattern of arrests, convictions, and recent felony charges. The LSO invoked both
      the Bond Amendment and Guideline J. The Individual argues rehabilitation after 2011, but the Judge finds no sufficient
      mitigating evidence.
    weighing: Considering {C1} and {C2} the statutory bar and the absence of any mitigating factor under Guideline J outweigh
      the Individual’s post‑2011 claims. {C4} further erodes credibility, while {C3} is noted but does not alter the balance.
      The cumulative effect leads to a denial.
    tradecraft: The Judge issues a final Decision, records the findings, and notifies the Individual of the denial and appeal
      rights per 10 C.F.R. § 710.28.
    uncertainty: Minimal; the statutory language and the clear lack of mitigating conditions leave little room for doubt.
    handoff: The Administrative Judge decides alone, as the regulations grant the adjudicator sole authority to resolve the
      security concern.
    tempting_wrong:
      option: O3
      pull: The Individual’s post‑2011 community service and therapy might tempt a grant.
      why_wrong: Without the required mitigating conditions—elapsed time, coercion, reliable evidence, or proven rehabilitation—the
        grant would conflict with Guideline J and the Bond Amendment.
    rejected:
      O1: Holding the decision pending additional evidence would contravene the presumption against granting a clearance when
        substantial doubts exist.
      O3: Granting would ignore the statutory Bond Amendment and the unresolved Guideline J concerns.
      O4: Additional evidence was already considered; the record still shows no mitigating factors.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A mitigating condition under Guideline J such as a long period of no criminal conduct (≥10 years) were established.
      then: O3
      why: ¶32(a) would resolve the concern if sufficient time had elapsed without recurrence.
    - id: flip2
      if: The Individual could demonstrate successful rehabilitation, e.g., sustained employment, education, and community
        service with no further incidents.
      then: O3
      why: ¶32(d) would apply if rehabilitation were proven, removing the Guideline J barrier.
    would_not_change:
    - id: noflip1
      if: The Individual remains incarcerated for more than one year for a felony.
      why: The Bond Amendment is a statutory bar that cannot be waived absent extraordinary circumstances.
    watch_for:
    - id: watch1
      what: Future credible evidence of sustained rehabilitation and absence of new criminal conduct.
      favors:
      - O3
      why: New mitigating evidence could satisfy ¶32(d) and shift the balance toward granting.
  lesson: Under DOE Part 710 and the Adjudicative Guidelines, a pattern of serious criminal conduct that lacks any of the
    four mitigating conditions—elapsed time, coercion, lack of reliable evidence, or proven rehabilitation—justifies denial
    of a security clearance.
  limits: This analysis applies only to security‑clearance determinations governed by 10 C.F.R. Part 710 and the DOE Adjudicative
    Guidelines; it does not extend to unrelated employment or civilian licensing decisions.
