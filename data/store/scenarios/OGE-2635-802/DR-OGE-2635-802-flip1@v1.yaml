case:
  id: DR-OGE-2635-802-flip1@v1
  title: IRS Employee Participation in Tax-Exempt Status Determination [flip]
  status: needs_review
  setting: Internal Revenue Service, current era, United States
  decider: the civil service employee
  agent: the civil service employee
  agent_role: decide
  situation: A civil service employee in the IRS's Exempt Organizations Unit reviews applications for charitable status. The
    employee helped establish a local animal-rescue nonprofit, which has now filed a request for tax-exempt recognition. The
    employee's connection to the nonprofit could, in theory, raise a conflict, but the regulation at 5 C.F.R. §2635.802(b)
    calls for recusal only when a personal interest exists. The employee must decide whether to join the team evaluating the
    nonprofit's application.
  question: Should the employee participate in the IRS's determination of the nonprofit's tax-exempt status?
  options:
    O1:
      do: The employee may take part in the IRS determination of the nonprofit's tax-exempt status.
      move: act
      irreversible: true
    O2:
      do: The employee must be excluded from the IRS determination of the nonprofit's tax-exempt status.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the Internal Revenue Service reviewing applications for tax-exempt status.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee has never been involved with the neighborhood animal‑rescue group, neither as a founder nor as a participant.
  - id: F3
    kind: situation
    status: confirmed
    fact: The animal-rescue group has applied to the IRS for tax-exempt status.
  - id: F4
    kind: capability
    status: assessed
    fact: Because the employee has no involvement with the group, there is no effect on official duties.
  - id: F5
    kind: capability
    status: assessed
    fact: With no personal connection, the employee's ability to perform the position is not materially impaired.
  - id: F6
    kind: authority
    status: confirmed
    fact: Under 5 C.F.R. §2635.802(b), an employee should be recused from any IRS determination concerning the tax-exempt
      status of an organization when the employee has a personal interest in that organization.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The recusal rule applies only when the employee possesses a personal interest; since the employee has no involvement,
      the regulation does not compel exclusion.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Without any personal connection, participation does not threaten the agency's credibility or create an appearance
      of bias.
  - id: C3
    facts:
    - F2
    - F3
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The lack of any personal stake ensures that the application can be processed fairly, preserving due-process protections
      for all applicants.
  - id: C4
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The rule is categorical, but it is triggered only by a personal interest; absent that, the categorical language does
      not bar participation.
  reasoning:
    read: The employee, despite having helped launch the animal-rescue nonprofit, has no current personal involvement, so
      the conflict-of-interest rule does not activate. The key error would be to assume that any past affiliation automatically
      mandates recusal.
    weighing: C1 and C3 together show that the regulatory trigger is absent, outweighing any residual concerns. Consequently,
      participation is permissible ({O1}).
    tradecraft: The employee may proceed with the case, documenting the lack of personal interest in the official file and
      informing the supervising officer of the assessment.
    uncertainty: Low – the regulation's language is clear about when recusal is required.
    handoff: The employee makes the participation decision but continues to coordinate with the supervisor for routine case
      management.
    tempting_wrong:
      option: O2
      pull: A cautious mindset might suggest that any prior connection, however distant, warrants stepping aside.
      why_wrong: That view over-extends the recusal rule, which is limited to actual personal interests.
    rejected:
      O2: Not selected because the employee lacks a personal interest, so the recusal requirement does not apply.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: If the employee had previously founded or actively participated in the animal-rescue nonprofit, creating a personal
        interest.
      then: O2
      why: A genuine personal interest would reactivate the recusal mandate, making exclusion (O2) appropriate.
    would_not_change:
    - id: noflip1
      if: If the employee were to develop any personal involvement with the organization, even a limited one.
      why: The regulation would then require recusal regardless of the limited scope.
    watch_for:
    - id: watch1
      what: Arguments that any prior affiliation, however remote, automatically triggers recusal.
      favors:
      - O1
      why: Such arguments misinterpret the statutory condition that recusal is tied to an existing personal interest.
  lesson: When an employee has no current personal interest in an organization, the categorical recusal rule does not bar
    participation; the employee may engage in the determination without compromising agency integrity.
  limits: This guidance applies solely to conflicts governed by 5 C.F.R. §2635.802(b). It does not address other statutory
    conflict-of-interest provisions or situations where the employee holds a financial interest.
