case:
  id: DR-OGE-2635-802@v1
  title: IRS Employee Participation in Tax-Exempt Status Determination
  status: draft
  setting: Internal Revenue Service, present, United States
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An employee of the Internal Revenue Service reviews applications for recognition of tax-exempt status. The employee
    helped found a neighborhood animal-rescue group that later organized formally. That group has now submitted an application
    to the IRS for tax-exempt status. The employee’s involvement with the group could affect the employee’s official duties,
    but the effect is described as limited. The regulation at 5 C.F.R. §2635.802(b) states that the employee should be recused
    from any IRS determination concerning the organization’s tax-exempt status. The employee must decide whether to take part
    in the determination.
  question: What should the employee do about participating in the IRS determination of the organization’s tax-exempt status?
  options:
    O1:
      do: The employee is allowed to take part in the IRS determination of the organization’s tax-exempt status.
      move: act
      irreversible: true
    O2:
      do: The employee is denied participation in the IRS determination of the organization’s tax-exempt status.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the Internal Revenue Service reviewing applications for tax-exempt status.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee helped found a neighborhood animal-rescue group.
  - id: F3
    kind: situation
    status: confirmed
    fact: The animal-rescue group has applied to the IRS for tax-exempt status.
  - id: F4
    kind: capability
    status: assessed
    fact: The employee’s involvement with the group would have a limited effect on official duties.
  - id: F5
    kind: capability
    status: assessed
    fact: The involvement would not require recusal from matters central or critical to the employee’s official duties such
      that ability to perform the position would be materially impaired.
  - id: F6
    kind: authority
    status: confirmed
    fact: Under 5 C.F.R. §2635.802(b), the employee should be recused from participating in any IRS determination regarding
      the tax-exempt status of this organization.
  considerations:
  - id: C1
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 5 C.F.R. §2635.802(b) explicitly requires the employee to be recused from any IRS determination concerning the tax‑exempt
      status of the organization.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Even though the employee’s involvement has only a limited effect and does not materially impair duties, the regulation
      still mandates recusal to preserve the agency’s credibility and avoid any appearance of bias.
  - id: C3
    facts:
    - F2
    - F3
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Allowing participation could compromise fair and impartial processing of the tax‑exempt application, undermining
      due‑process protections for other applicants.
  - id: C4
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The conflict does not rise to the level of material impairment, but the rule in §2635.802(b) is categorical and does
      not hinge on the degree of impairment.
  reasoning:
    read: The employee, who helped found the animal‑rescue group, faces a conflict of interest when the group applies for
      tax‑exempt status. The trap is assuming that a limited effect on official duties permits participation, whereas the
      regulation expressly requires recusal regardless of the conflict’s magnitude.
    weighing: The source’s own reasoning (C1, C2) treats the regulatory command as decisive; even though the conflict is limited
      (C3, C4), the rule overrides any balancing. Consequently the balance tips unequivocally toward recusal ({O2}).
    tradecraft: The employee should file a written recusal notice, notify the supervising officer and the Office of Professional
      Responsibility, and ensure the case is reassigned. All actions must be logged in the official case file.
    uncertainty: Minimal – the regulation provides a clear, binding directive.
    handoff: The employee makes the initial recusal decision but must involve the supervisor and compliance office to document
      the action and reassign the case.
    tempting_wrong:
      option: O1
      pull: The employee may feel a personal loyalty to the organization and believe the limited impact justifies participation.
      why_wrong: That reasoning conflicts with the explicit requirement in §2635.802(b) and would breach the agency’s ethical
        standards.
    rejected:
      O1: Not chosen because the regulation mandates recusal even when the conflict’s effect is limited.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had no prior involvement with the animal‑rescue organization (no founding role, no ongoing participation).
      then: O1
      why: Without any personal connection, the conflict of interest disappears, and the recusal requirement no longer applies.
    would_not_change:
    - id: noflip1
      if: The employee’s involvement remains limited as described (F4, F5).
      why: The regulation expressly requires recusal even when the effect is limited.
    watch_for:
    - id: watch1
      what: Arguments that a limited effect on duties permits participation.
      favors:
      - O1
      why: Such arguments conflict with the categorical recusal rule in §2635.802(b).
  lesson: When a regulation expressly requires recusal, the employee must step aside regardless of how limited the conflict
    appears, to preserve agency integrity and compliance with law.
  limits: This guidance applies only to conflicts covered by 5 C.F.R. §2635.802(b); it does not address other statutory conflicts
    or situations where the employee has no connection to the organization.
