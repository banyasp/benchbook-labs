case:
  id: DR-OGE-2635-802-restyle1@v1
  title: IRS Employee Participation in Tax-Exempt Status Determination [restyle]
  status: needs_review
  setting: Internal Revenue Service, United States, current fiscal period
  decider: the staff member
  agent: the staff member
  agent_role: decide
  situation: A staff member of the Internal Revenue Service is assigned to evaluate applications for nonprofit tax-exempt
    status. The staff member previously helped establish a local animal-rescue nonprofit, which has now formally filed for
    tax-exempt recognition. Although the staff member's past involvement is described as having only a modest influence on
    official responsibilities, 5 C.F.R. §2635.802(b) mandates recusal from any IRS determination concerning the organization's
    tax-exempt status. The staff member must decide whether to remain involved in the review.
  question: Should the staff member participate in the IRS determination of the nonprofit's tax-exempt status?
  options:
    O1:
      do: The staff member may participate in the IRS determination of the nonprofit's tax-exempt status.
      move: act
      irreversible: true
    O2:
      do: The staff member must be excluded from the IRS determination of the nonprofit's tax-exempt status.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The staff member is employed by the Internal Revenue Service and reviews applications for nonprofit tax-exempt status.
  - id: F2
    kind: situation
    status: confirmed
    fact: The staff member helped found a neighborhood animal-rescue nonprofit.
  - id: F3
    kind: situation
    status: confirmed
    fact: The animal-rescue nonprofit has submitted an application to the IRS for tax-exempt status.
  - id: F4
    kind: capability
    status: assessed
    fact: The staff member's involvement with the nonprofit would have only a limited effect on official duties.
  - id: F5
    kind: capability
    status: assessed
    fact: The involvement would not create a material impairment of the staff member's ability to perform core responsibilities.
  - id: F6
    kind: authority
    status: confirmed
    fact: Under 5 C.F.R. §2635.802(b), the staff member must be recused from any IRS determination regarding the tax-exempt
      status of this organization.
  considerations:
  - id: C1
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 5 C.F.R. §2635.802(b) expressly obligates the staff member to recuse from any IRS determination concerning the tax-exempt
      status of the organization.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Even though the staff member's involvement is limited and does not materially impair duties, the regulation still
      requires recusal to safeguard the agency's credibility and avoid any appearance of bias.
  - id: C3
    facts:
    - F2
    - F3
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Permitting participation could jeopardize the impartial processing of the tax-exempt application, thereby eroding
      due-process protections for other filers.
  - id: C4
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The conflict does not rise to material impairment, yet §2635.802(b) is categorical and does not depend on the severity
      of the impairment.
  reasoning:
    read: The staff member, who helped found the animal-rescue nonprofit, confronts a conflict of interest when that nonprofit
      seeks tax-exempt status. The error would be to assume that a limited impact on duties permits involvement, whereas the
      regulation unambiguously demands recusal irrespective of the conflict's magnitude.
    weighing: The agency's own analysis (C1, C2) treats the statutory command as decisive; although the conflict is modest
      (C3, C4), the rule supersedes any balancing. Accordingly, the balance unequivocally favors recusal ({O2}).
    tradecraft: The staff member should submit a written recusal notice, inform the supervising officer and the Office of
      Professional Responsibility, and ensure the case is reassigned. All steps must be recorded in the official case file.
    uncertainty: Minimal – the regulation provides a clear, binding directive.
    handoff: The staff member initiates the recusal decision but must involve the supervisor and compliance office to document
      the action and reallocate the case.
    tempting_wrong:
      option: O1
      pull: A sense of personal loyalty to the nonprofit and the belief that the limited impact justifies participation may
        be compelling.
      why_wrong: That reasoning conflicts with the explicit requirement in §2635.802(b) and would breach the agency's ethical
        standards.
    rejected:
      O1: Not selected because the regulation mandates recusal even when the conflict's effect is limited.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The staff member had no prior involvement with the animal-rescue nonprofit (no founding role, no ongoing participation).
      then: O1
      why: Absent any personal connection, the conflict of interest disappears, and the recusal requirement no longer applies.
    would_not_change:
    - id: noflip1
      if: The staff member's involvement remains limited as described (F4, F5).
      why: The regulation expressly requires recusal even when the effect is limited.
    watch_for:
    - id: watch1
      what: Arguments that a limited effect on duties permits participation.
      favors:
      - O1
      why: Such arguments run counter to the categorical recusal rule in §2635.802(b).
  lesson: When a regulation explicitly commands recusal, the staff member must step aside regardless of how limited the conflict
    appears, to preserve agency integrity and comply with the law.
  limits: This guidance applies solely to conflicts covered by 5 C.F.R. §2635.802(b); it does not address other statutory
    conflicts or situations where the staff member has no connection to the organization.
