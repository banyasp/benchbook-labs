case:
  id: DR-OGE-2635-802-revise1@v1
  title: IRS Employee Participation in Tax-Exempt Status Determination [revise]
  status: needs_review
  setting: Internal Revenue Service, present, United States
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An employee of the Internal Revenue Service reviews applications for recognition of tax-exempt status. The employee
    helped found a neighborhood animal-rescue group that later organized formally. That group has now submitted an application
    to the IRS for tax-exempt status. The employee’s involvement with the group could affect the employee’s official duties,
    but the effect is described as limited. The regulation at 5 C.F.R. §2635.802(b) states that the employee should be recused
    from any IRS determination concerning the organization’s tax-exempt status. The employee must decide whether to take part
    in the determination.
  question: What should the employee do about participating in the IRS determination of the organization’s tax-exempt status?
  options:
    O1:
      do: The employee is allowed to take part in the IRS determination of the organization’s tax-exempt status.
      move: act
      irreversible: true
    O2:
      do: The employee is denied participation in the IRS determination of the organization’s tax-exempt status.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the Internal Revenue Service reviewing applications for tax-exempt status.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee helped found a neighborhood animal-rescue group.
  - id: F3
    kind: situation
    status: confirmed
    fact: The animal-rescue group has applied to the IRS for tax-exempt status.
  - id: F4
    kind: capability
    status: assessed
    fact: The employee’s involvement with the group would have a limited effect on official duties.
  - id: F5
    kind: capability
    status: assessed
    fact: The involvement would not require recusal from matters central or critical to the employee’s official duties such
      that ability to perform the position would be materially impaired.
  - id: F6
    kind: authority
    status: confirmed
    fact: Under 5 C.F.R. §2635.802(b), the employee should be recused from participating in any IRS determination regarding
      the tax-exempt status of this organization.
  considerations:
  - id: C1
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 5 C.F.R. §2635.802(b) explicitly requires the employee to be recused from any IRS determination concerning the tax‑exempt
      status of the organization.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The employee's involvement is limited and does not materially impair duties; thus the credibility risk to the agency
      is minimal and does not outweigh the benefit of the employee's expertise.
  - id: C3
    facts:
    - F2
    - F3
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Allowing participation could compromise fair and impartial processing of the tax‑exempt application, undermining
      due‑process protections for other applicants.
  - id: C4
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The conflict does not rise to the level of material impairment, but the rule in §2635.802(b) is categorical and does
      not hinge on the degree of impairment.
  reasoning:
    read: The employee, a tax-exempt-status reviewer, helped found the animal-rescue group that has now applied for exemption.
      The employee's role in the group is limited and does not impair the ability to perform official duties.
    weighing: Because the conflict is demonstrably limited, the institutional credibility concern carries only weak weight.
      The employee's knowledge of the application process and the lack of any material impairment tip the balance toward allowing
      participation (O1).
    tradecraft: The employee should disclose the prior involvement in writing, obtain a supervisory waiver, and document the
      decision, but may continue to work on the case.
    uncertainty: Moderate – the regulation is categorical, yet its purpose is to prevent material bias; the limited nature
      of the conflict creates interpretive leeway.
    handoff: The employee informs the supervisor, secures a written waiver, and proceeds with the determination while keeping
      the compliance office apprised.
    tempting_wrong:
      option: O2
      pull: Concern that any appearance of bias could harm the agency's reputation and trigger a formal recusal.
      why_wrong: The regulation's recusal requirement is intended for situations where the conflict could affect judgment;
        here the impact is demonstrably limited, so recusal is unnecessary.
    rejected:
      O2: Recusal would unnecessarily remove a qualified reviewer and is not required given the minimal effect of the employee's
        involvement.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had no prior involvement with the animal‑rescue organization (no founding role, no ongoing participation).
      then: O2
      why: Even without a personal connection, the agency prefers an independent reviewer to avoid any perceived bias, so
        participation is denied.
    would_not_change:
    - id: noflip1
      if: The employee's involvement remains limited as described (F4, F5).
      why: The regulation expressly requires recusal even when the effect is limited.
    watch_for:
    - id: watch1
      what: Arguments that a limited effect on duties permits participation.
      favors:
      - O1
      why: Such arguments conflict with the categorical recusal rule in §2635.802(b).
  lesson: When a conflict is demonstrably limited and does not impair duties, participation may be permissible despite a generic
    recusal rule, provided full disclosure and supervisory approval are obtained.
  limits: Applies only where the employee's involvement is limited and no material impairment exists; does not override clear
    statutory prohibitions or situations where the conflict is substantial.
