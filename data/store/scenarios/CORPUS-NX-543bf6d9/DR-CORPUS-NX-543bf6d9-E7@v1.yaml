case:
  id: DR-CORPUS-NX-543bf6d9-E7@v1
  title: Troop Deployment for Population Protection
  status: draft
  setting: Southern Afghanistan, early 2009, U.S. presidency and U.S.-led ISAF
  decider: The President
  agent: The President
  agent_role: decide
  situation: In early 2009, violent subversion was spreading across the southern landscape as the insurgency worsened. The
    President had entered office only months earlier. The southern population faced increased exposure to insurgent persuasion,
    indoctrination, and fear. Without additional troops, ISAF lacked what was described as the minimal force needed to protect
    that population.
  question: What should the President do about deploying additional troops for the southern response?
  options:
    O1:
      do: The President deploys additional troops for the southern response.
      move: act
      irreversible: false
    O2:
      do: The President withholds additional troops from the southern response.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Violent subversion was spreading across the southern landscape in early 2009.
  - id: F2
    kind: situation
    status: assessed
    fact: The insurgency was worsening.
  - id: F3
    kind: situation
    status: confirmed
    fact: The President had entered office only months earlier.
  - id: F4
    kind: situation
    status: assessed
    fact: The southern population was increasingly exposed to insurgent persuasion, indoctrination, and fear.
  - id: F5
    kind: capability
    status: assessed
    fact: Without additional troops, ISAF lacked the minimal forces needed to protect the southern population.
  - id: F6
    kind: situation
    status: assessed
    fact: If the host citizenry fell completely under Taliban influence, weaning them away from the insurgents would become
      nearly impossible.
  - id: F7
    kind: situation
    status: confirmed
    fact: Protection of the local population was the stated top priority in the U.S. counter-response to the insurgency.
  considerations:
  - id: C1
    facts:
    - F4
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Protecting the local population was the stated top priority as people faced increasing exposure to insurgent persuasion,
      indoctrination, and fear.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Without additional troops, ISAF lacked the minimal force described as necessary to protect the population.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: If the citizenry fell completely under Taliban influence, weaning them away from the insurgents would become nearly
      impossible, making timely protection important.
  reasoning:
    read: The decision concerned whether ISAF would have the minimum capacity the source considered necessary to protect a
      population increasingly exposed to insurgent influence and fear. The trap is treating the population's complete fall
      under Taliban influence as the point at which action becomes necessary, when that point would make recovery nearly impossible.
    weighing: 'The reasons favor deploying: population protection was the top priority {C1}, ISAF lacked the stated minimum
      force without additional troops {C2}, and delay risked a condition from which reversing insurgent influence would be
      nearly impossible {C3}. The balance depends on the assessed exposure of the population and the stated shortfall in ISAF''s
      protective capacity.'
    tradecraft: Record the decision, its population-protection rationale, and the assumptions that ISAF lacked minimum protective
      capacity and that delay could make recovery nearly impossible. No operational-method guidance is provided.
    uncertainty: The source gives no quantified assessment of the risks or costs of adding troops, no comparison of alternative
      protective measures, and no legal-authority analysis; this reasoning is limited to its stated population-protection
      rationale.
    handoff: The President is the identified decider. No required referral or consultation is specified, so naming another
      decision-maker is unsupported.
    tempting_wrong:
      option: O2
      pull: Withholding troops could seem preferable if the decision is framed as avoiding an additional deployment.
      why_wrong: That framing leaves ISAF without the minimal force identified as needed to protect a population facing increased
        insurgent persuasion, indoctrination, and fear.
    rejected:
      O2: The President did not withhold troops because additional capacity was identified as necessary to protect the southern
        population.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: ISAF already had the minimum forces needed to protect the population without an additional deployment.
      then: O2
      why: The stated capacity-based reason for deploying would no longer apply.
    would_not_change:
    - id: noflip1
      if: The citizenry had not yet completely fallen under Taliban influence.
      why: The population was already increasingly exposed to insurgent persuasion, indoctrination, and fear; complete loss
        of influence would make recovery nearly impossible, but was not a prerequisite for protective action.
    watch_for:
    - id: watch1
      what: Whether the population's exposure to insurgent persuasion, indoctrination, and fear is increasing.
      favors:
      - O1
      why: Increasing vulnerability and the need for population protection are the stated basis for deployment.
  lesson: When a population is increasingly exposed to coercive influence and protective capacity is assessed as insufficient,
    weigh timely protection against the risk that delay will make recovery nearly impossible. Do not wait for the feared condition
    to become complete before acting on the stated protective rationale.
  limits: This reasoning addresses only the deployment decision and its population-protection rationale. It does not establish
    legal authority, quantify deployment risks or costs, or determine whether other protective measures could meet the need.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-543bf6d9
    source: https://jsouapplicationstorage.blob.core.windows.net/press/262/12-1.pdf
    episode_focus: The decision was whether to add troops or leave ISAF without the additional capacity; the stated reason
      was the need to protect a population increasingly exposed to insurgent persuasion, intimidation, and fear. Keep the
      scenario to the deployment policy and its population-protection rationale, not operational methods.
    cues:
      option_words:
        O2: 9
        O1: 9
      real_option: O1
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The President deployed additional troops because, without them, ISAF lacked the minimal forces to protect the southern
  population increasingly at risk from insurgent persuasion, indoctrination, and fear.
