case:
  id: DR-CORPUS-NX-3dacb166-E3@v1
  title: Force Authorization for an Embassy Removal
  status: draft
  setting: Athens, before the EYP security team's arrival at the Greek embassy in Nairobi; Greek government and EYP.
  decider: The government in Athens
  agent: The government in Athens
  agent_role: decide
  situation: A field officer at the Greek embassy has repeatedly received orders to remove an individual from the embassy.
    The officer has refused, citing practical reasons and saying that he cannot use force. Senior officials demand immediate
    removal by force and say that the careers of three ministers are at stake. A senior official also pleads for compliance
    and warns that the officer may be discharged. The government in Athens must decide what authority to give an EYP team
    and whether to dispatch it.
  question: What should the government in Athens do about dispatching an EYP team to remove the individual, including whether
    to authorize force if necessary?
  options:
    O1:
      do: The government in Athens holds dispatch of the EYP team pending a review of force authorization.
      move: hold
      irreversible: false
    O2:
      do: The government in Athens prohibits removal by force and dispatches the EYP team to carry out the removal.
      move: act
      irreversible: false
    O3:
      do: The government in Athens authorizes removal by force if necessary and dispatches the EYP team to carry it out.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: A senior official ordered the field officer to remove the individual from the embassy by force if necessary.
  - id: F2
    kind: situation
    status: confirmed
    fact: The field officer refused the removal order.
  - id: F3
    kind: situation
    status: assessed
    fact: The field officer said he could not comply for practical reasons.
  - id: F4
    kind: authority
    status: confirmed
    fact: A further call came from EYP headquarters.
  - id: F5
    kind: situation
    status: assessed
    fact: Senior officials said that three ministers' careers were at stake and demanded immediate removal by force.
  - id: F6
    kind: situation
    status: confirmed
    fact: The field officer refused again and said he was unable to use force.
  - id: F7
    kind: situation
    status: confirmed
    fact: A senior official pleaded with the field officer to comply and warned that he would be discharged if he did not.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    - F6
    equity: chain_of_command
    favors:
    - O3
    weight: strong
    why: The field officer repeatedly refused the removal order, including the instruction to use force if necessary. Athens
      responded by sending a team to enforce the orders.
  - id: C2
    facts:
    - F2
    - F3
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The officer said practical reasons prevented compliance and that he could not use force. Dispatching a team was the
      government's chosen way to carry out the removal order despite that refusal.
  - id: C3
    facts:
    - F5
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: Senior officials invoked the ministers' exposure and warned the officer he might be discharged, pressing for compliance.
      Those statements formed part of the pressure surrounding the decision, but do not by themselves establish a basis for
      force.
  - id: C4
    facts:
    - F1
    - F5
    equity: tempo
    favors:
    - O3
    weight: weak
    why: Officials demanded immediate removal, and the government chose to dispatch a team rather than continue relying on
      the refusing field officer.
  reasoning:
    read: Athens faced repeated refusal by its field officer and chose to send an EYP team to enforce the removal order, with
      force authorized if necessary. The trap is treating the ministers' political exposure and the threat of discharge as
      if they independently establish the authority or justification for force.
    weighing: The stated rationale is the officer's repeated refusal, his stated practical inability to comply, the demand
      for immediate action, and the government's decision to enforce its orders through a team. Those considerations point
      to {O3} as the government's chosen outcome. The account does not give a separate legal analysis of force authorization,
      so its rationale should not be enlarged beyond the command decision and pressures it describes.
    tradecraft: Record who issued the order, the scope of force authorization, the officer's stated reasons for refusing,
      and the basis for the government's decision. Keep the decision record separate from any later account of physical execution.
    uncertainty: The account does not state the legal standard, the limits placed on force, or an assessment of the individual's
      safety. It establishes the command decision, not a full legal justification.
    handoff: The government in Athens made the dispatch decision and conveyed enforcement authority through senior officials.
      As a decision practice, a consequential force authorization should also receive legal and operational review; that review
      is not described here.
    tempting_wrong:
      option: O2
      pull: It would answer the field officer's statement that he could not use force while still dispatching a team.
      why_wrong: It does not match the government's recorded choice to send a team to enforce the orders after repeated refusals,
        with force available if necessary.
    rejected:
      O1: Athens did not hold dispatch for review; after repeated refusals, it decided to send a team to enforce the orders.
      O2: Athens did not prohibit force; it dispatched the team to enforce the orders after senior officials had demanded
        removal by force if necessary.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A review established that force was not legally authorized, while removal without force remained authorized.
      then: O2
      why: The force authorization would have to be withdrawn even if the government could still dispatch a team to carry
        out a non-force removal.
    - id: flip2
      if: The practical obstacle cited by the field officer were shown to make the assigned removal impossible for the team
        as well.
      then: O1
      why: Dispatch would no longer be an evident means of enforcing the order, so holding for reassessment would be preferable
        to issuing an unworkable authorization.
    would_not_change:
    - id: noflip1
      if: The ministers' careers remained politically exposed.
      why: Political exposure alone would not establish that force was legally authorized or change the need to assess the
        scope of that authority.
    watch_for:
    - id: watch1
      what: Whether the practical reasons for the officer's refusal also prevent the dispatched team from carrying out the
        order.
      favors:
      - O1
      why: A continuing practical impediment could make dispatch ineffective and warrant a hold for reassessment.
  lesson: Repeated refusal can prompt a superior authority to dispatch a team to enforce an order, and that is the outcome
    recorded here. Political pressure and urgency explain the decision's context but should not be treated as substitutes
    for establishing the authority and limits for force.
  limits: This reasoning describes the command decision and stated pressures in this account; it does not establish that the
    force authorization was lawful or assess how any removal should be carried out. It should not be generalized to situations
    with different authority, legal constraints, or operational facts.
