case:
  id: DR-CORPUS-NX-d9c57ebc-E1@v1
  title: Commission on the Recent Disorders
  status: draft
  setting: United States, July 27, President's decision on a Special Advisory Commission
  decider: The President
  agent: The President
  agent_role: decide
  situation: Severe racial rioting had occurred in United States cities during recent summers, and the recent disorders were
    described as especially widespread and intense. Newark and Detroit were the cities hardest hit, with 26 and 43 deaths
    respectively. Conditions of near-insurrection developed in ghetto areas, and police and National Guardsmen exchanged weapons
    fire. Rioting also broke out in several other cities, and Detroit's disturbances brought the first use of Federal troops
    to quell civil strife in 24 years. The President described the recent week as a time of violence and tragedy. The decision
    is whether to appoint a commission to investigate the origins of the disorders or not to appoint one.
  question: What should the President do about appointing a Special Advisory Commission to investigate the origins of the
    recent disorders?
  options:
    O1:
      do: The President rejects the appointment of a Special Advisory Commission to investigate the origins of the recent
        disorders.
      move: act
      irreversible: false
    O2:
      do: The President approves the appointment of a Special Advisory Commission to investigate the origins of the recent
        disorders.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Severe racial rioting had occurred in United States cities during recent summers, and the recent disorders were
      described as especially widespread and intense.
  - id: F2
    kind: situation
    status: confirmed
    fact: Newark was one of the two cities hardest hit, with 26 deaths.
  - id: F3
    kind: situation
    status: confirmed
    fact: Detroit was one of the two cities hardest hit, with 43 deaths.
  - id: F4
    kind: situation
    status: confirmed
    fact: Conditions of near-insurrection developed in ghetto areas, and police and National Guardsmen exchanged weapons fire.
  - id: F5
    kind: situation
    status: confirmed
    fact: Rioting broke out in Tampa, Dayton, Boston, Cincinnati, and Buffalo.
  - id: F6
    kind: situation
    status: confirmed
    fact: Detroit's disturbances brought the first use of Federal troops to quell civil strife in 24 years.
  - id: F7
    kind: situation
    status: confirmed
    fact: The President characterized the recent week as a time of violence and tragedy.
  - id: F8
    kind: situation
    status: confirmed
    fact: The contemplated Special Advisory Commission's stated task was to investigate the origins of the recent disorders
      in United States cities.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The recent disorders were described as unusually widespread and intense, with deaths and near-insurrection conditions;
      the President characterized the week as one of violence and tragedy. This is the serious situation to which the commission
      appointment responded.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Rioting in additional cities and the unprecedented use of Federal troops in Detroit underscore the breadth and gravity
      of the disorders that prompted the decision.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The commission's stated task was to investigate the origins of the disorders, directly addressing the question the
      President chose to pursue.
  reasoning:
    read: This was a decision to appoint a commission to investigate the origins of unusually widespread and intense disorders,
      not a choice among immediate responses to the rioting. The trap is to treat the appointment as if it were itself an
      immediate remedy for the violence; the stated task was investigation.
    weighing: The President's description of the week as one of violence and tragedy, alongside the deaths, near-insurrection
      conditions, and spread of rioting, supplies the context for creating an inquiry. The stated investigative task supports
      {O2}; the source gives no detailed comparison of the commission with other approaches or explanation of how its findings
      would affect future events.
    tradecraft: Keep the commission's mandate focused on investigating the origins of the disorders, and record the decision
      and its stated purpose separately from any other response to civil unrest.
    uncertainty: The source records the appointment and the commission's task, but does not provide a fuller explanation of
      the President's deliberation, anticipated effects, or alternatives considered.
    handoff: The President made the appointment decision. The source identifies no required referral to another office or
      authority.
    tempting_wrong:
      option: O1
      pull: The commission was an inquiry rather than an immediate intervention in the unrest.
      why_wrong: The decision presented was whether to investigate the origins of disorders described as exceptionally widespread
        and intense; the source records the President choosing that inquiry, not rejecting it as a response.
    rejected:
      O1: The President did not reject the inquiry; he appointed the commission to investigate the origins of the disorders.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The decision were no longer to investigate the origins of the recent disorders, and no comparable inquiry were at
        issue.
      then: O1
      why: The source's stated basis for the commission is its task of investigating those disorders; without that task, the
        recorded reason for appointment would not apply.
    would_not_change:
    - id: noflip1
      if: The only additional fact were that severe racial rioting had occurred in earlier summers.
      why: Earlier rioting alone would not displace the source's distinction that the recent disorders were especially widespread
        and intense, or the stated task of investigating their origins.
    watch_for: []
  lesson: When severe and widespread disorders prompt a decision about an origins inquiry, keep the investigative choice distinct
    from immediate responses to the unrest. Ground the decision in the inquiry's stated task and do not assume effects or
    rationales the source does not provide.
  limits: This reasoning concerns only the President's choice to appoint a commission to investigate the origins of these
    disorders. The source does not establish the commission's findings, effectiveness, or the merits of other responses to
    civil unrest.
