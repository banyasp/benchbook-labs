case:
  id: DR-CORPUS-NS-6c50672a-E3@v1
  title: Expanding NRO Support and Defense Funding
  status: draft
  setting: NRO, 1979-era, during the DNRO’s tenure
  decider: The DNRO
  agent: The DNRO
  agent_role: decide
  situation: The DNRO faced a mismatch between the NRO’s strategic mission and the needs of general-purpose forces and lower
    military echelons. The NRO had relatively little institutional capability to support those forces. The DNRO reported directly
    to the Secretary of Defense while being charged with satisfying the DCI’s requirements. The NRO also lacked responsibility
    for deciding which programs to implement and had little capability to analyze collected data or produce and distribute
    processed information. Mechanisms for applying NRO capabilities to ongoing military operations had not existed.
  question: What should the DNRO do about expanding NRO support for ongoing military operations and creating a Secretary of
    Defense funding channel for DoD interests beyond the DCI’s?
  options:
    O1:
      do: The DNRO approves expanding NRO support for ongoing military operations and creating a Defense funding channel for
        DoD interests beyond the DCI’s.
      move: act
      irreversible: false
    O2:
      do: The DNRO rejects expanding NRO support for ongoing military operations and creating a Defense funding channel for
        DoD interests beyond the DCI’s.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The NRO was created to address the country’s strategic interests and serve senior Executive Branch leaders.
  - id: F2
    kind: capability
    status: assessed
    fact: The NRO had relatively little institutional capability to support general-purpose forces and lower military echelons.
  - id: F3
    kind: authority
    status: confirmed
    fact: The DNRO reported directly to the Secretary of Defense and was charged with satisfying the DCI’s requirements.
  - id: F4
    kind: authority
    status: confirmed
    fact: The NRO did not have responsibility for deciding which programs to implement.
  - id: F5
    kind: capability
    status: assessed
    fact: The NRO had little capability to analyze collected data or produce and distribute processed information.
  - id: F6
    kind: capability
    status: confirmed
    fact: Before the support mechanisms were established, the NRO lacked mechanisms to apply its charter, skills, and capabilities
      to ongoing military operations.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Defense Reconnaissance Support Program allowed the Secretary of Defense to budget defense resources to expand
      or modify NRO programs for DoD interests beyond those of the DCI.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The NRO’s strategic mission and limited ability to serve general-purpose forces left a real support gap; expanding
      its support role addressed that mismatch.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Mechanisms for applying NRO capabilities to ongoing military operations had not existed, and establishing them gave
      the organization a way to serve those operations.
  - id: C3
    facts:
    - F3
    - F7
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The DNRO reported to the Secretary of Defense while meeting the DCI’s requirements; the Defense Reconnaissance Support
      Program let the Secretary fund program changes for DoD interests beyond the DCI’s.
  - id: C4
    facts:
    - F4
    - F5
    equity: mission_effect
    favors: []
    weight: weak
    why: The NRO lacked program-selection responsibility and had little analytic and information-distribution capability.
      Expanding operational support and creating a funding channel addressed part of the institutional problem, but did not
      resolve these broader limitations.
  reasoning:
    read: The decision concerns closing a gap between the NRO’s strategic purpose and the needs of general-purpose forces,
      not whether to use reconnaissance capabilities operationally. The trap is to treat an expanded support role and a Defense
      funding channel as if they also fixed the NRO’s limited program authority and analytic capabilities.
    weighing: The DNRO judged that the NRO’s limited support for general-purpose forces warranted new mechanisms. The support
      mechanisms were established, and the DNRO judged that they paid off in subsequent military conflicts; the Defense funding
      channel also allowed the Secretary to address DoD interests beyond the DCI’s. Those benefits favor O1, while the NRO’s
      unresolved institutional limitations counsel against treating the changes as a complete solution.
    tradecraft: Keep the decision bounded to support mechanisms and the funding channel. Record the distinct DCI and DoD requirements,
      the authority and purpose of any proposed funding, and whether the change addresses the identified support gap; do not
      represent these measures as resolving the NRO’s wider program or analytic limitations.
    uncertainty: The account gives a retrospective judgment that the changes paid off, but does not specify their effects
      or provide a comparative assessment of alternatives. The judgment therefore supports O1 without establishing that the
      changes solved the broader institutional problem.
    handoff: The DNRO should involve the Secretary of Defense and the DCI in clarifying the distinct requirements and funding
      interests, because the DNRO reported to the Secretary while being charged with satisfying the DCI’s requirements. This
      coordination is a decision-practice recommendation, not a procedure stated in the account.
    tempting_wrong:
      option: O2
      pull: The NRO was created for strategic interests and senior leaders, and had little capacity to serve general-purpose
        forces.
      why_wrong: That mismatch is the reason the DNRO identified for expanding support; retaining the existing arrangement
        would leave the stated gap unaddressed.
    rejected:
      O2: The DNRO’s retrospective judgment was that the new support mechanisms addressed a previously unmet need and that
        the changes paid off in subsequent military conflicts.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed support expansion or Defense funding channel cannot address the identified support gap or cannot be
        reconciled with the DCI requirements the DNRO is charged to satisfy.
      then: O2
      why: Without a credible way to serve the unmet need while respecting the dual requirements, the stated grounds for O1
        would be substantially weakened.
    would_not_change:
    - id: noflip1
      if: The NRO still lacks responsibility for selecting programs and has little capability to analyze or distribute processed
        information.
      why: Those limitations remain important, but the DNRO’s stated rationale for the support mechanisms was to address the
        separate gap in support for ongoing military operations, not to solve every institutional deficiency.
    watch_for:
    - id: watch1
      what: Evidence about whether the support mechanisms continue to help ongoing military operations.
      favors:
      - O1
      why: The DNRO cited the mechanisms’ payoff in subsequent military conflicts as a reason for satisfaction with the changes.
  lesson: When an institution’s strategic mission leaves a distinct operational-support need unmet, a bounded support role
    and an appropriate funding channel can address that gap. Do not mistake those measures for a cure to broader deficiencies
    in authority or analytic capacity.
  limits: This reasoning applies to the stated mismatch and the DNRO’s dual DCI and DoD responsibilities. It does not establish
    that every expansion of intelligence support or funding beyond another stakeholder’s requirements is appropriate, or address
    the operational use of reconnaissance capabilities.
