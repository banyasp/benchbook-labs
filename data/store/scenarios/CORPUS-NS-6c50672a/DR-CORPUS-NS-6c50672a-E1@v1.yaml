case:
  id: DR-CORPUS-NS-6c50672a-E1@v1
  title: Choosing the NRO’s Institutional Structure
  status: draft
  setting: United States government, summer 1961, CIA and the emerging NRO
  decider: The CIA official and the government counterpart
  agent: The CIA official and the government counterpart
  agent_role: decide
  situation: In the summer of 1961, a CIA official and a government counterpart were working to establish the NRO. The institutional
    choice concerned whether overhead reconnaissance would remain an exclusive CIA responsibility or be organized through
    government partnership. The CIA official valued streamlined management and minimal red tape. He also valued partnership
    with the private sector, taking chances, and sharing authority with others when needed. He understood that his CIA career
    was essentially over, and the President had made clear his time was limited.
  question: What should the CIA official and the government counterpart do about the NRO’s institutional structure?
  options:
    O1:
      do: The officials reject the NRO and retain exclusive CIA authority.
      move: act
      irreversible: true
    O2:
      do: The officials limit the NRO to shared authority with CIA leadership.
      move: partial
      irreversible: true
    O3:
      do: The officials approve an NRO structure sharing authority across government.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: By summer 1961, the CIA official was working with a government counterpart to set up the NRO.
  - id: F2
    kind: situation
    status: confirmed
    fact: The institutional approaches at issue included CIA-exclusive responsibility and government partnership through the
      NRO.
  - id: F3
    kind: capability
    status: confirmed
    fact: The CIA official valued streamlined management and minimal red tape.
  - id: F4
    kind: capability
    status: confirmed
    fact: The CIA official valued effective partnership with the private sector.
  - id: F5
    kind: capability
    status: confirmed
    fact: The CIA official valued willingness to take chances.
  - id: F6
    kind: authority
    status: confirmed
    fact: The CIA official valued working with others and sharing authority when needed.
  - id: F7
    kind: situation
    status: assessed
    fact: By summer 1961, the CIA official understood that his CIA career was essentially over.
  - id: F8
    kind: situation
    status: confirmed
    fact: The CIA official was responsible for the Bay of Pigs invasion, and the President had made clear that his time was
      limited.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The chosen structure reflected the stated preference for streamlined management and minimal red tape while moving
      responsibility beyond an exclusive CIA arrangement.
  - id: C2
    facts:
    - F2
    - F6
    equity: partner_relationship
    favors:
    - O3
    weight: strong
    why: Sharing authority with others when needed supported institutionalizing government partnership rather than preserving
      overhead reconnaissance as the CIA's exclusive responsibility.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The official's stated values included effective private-sector partnership and willingness to take chances, which
      fit an innovative partnership structure.
  reasoning:
    read: The choice was between retaining CIA exclusivity and establishing government partnership through the NRO. The trap
      is treating agency exclusivity as the default simply because the CIA official was responsible for the effort; the stated
      values instead included sharing authority when needed.
    weighing: Streamlined management and minimal red tape, combined with cooperation across government and effective private-sector
      partnership, favor O3 {C1} {C2} {C3}. The legacy assessment says the partnership worked and the NRO was born. The balance
      depends on whether shared authority can serve the work without sacrificing effective management.
    tradecraft: Make the institutional decision jointly with the government counterpart, state the management and cooperation
      aims behind it, and record how authority is shared so the arrangement can be assessed against those aims.
    uncertainty: The assessment endorses the result but gives little comparative detail about the alternatives or how the
      partnership's effectiveness was measured.
    handoff: Involve the government counterpart because the choice concerns sharing authority across government, not a CIA-only
      decision.
    tempting_wrong:
      option: O1
      pull: Keeping responsibility exclusively within the CIA could seem to preserve a familiar and direct management structure.
      why_wrong: It conflicts with the endorsed move away from exclusive CIA responsibility and with the stated willingness
        to share authority.
    rejected:
      O1: Exclusive CIA authority was not chosen because the endorsed structure institutionalized government partnership rather
        than keeping the responsibility within the CIA.
      O2: Limiting shared authority to CIA leadership was not chosen because the endorsed arrangement was government partnership
        through the NRO.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that government-wide sharing would prevent streamlined management or create unmanageable
        red tape, while limiting shared authority to CIA leadership would preserve effective operation.
      then: O2
      why: That would undermine the management case for the broader partnership while leaving a limited shared structure as
        a plausible alternative.
    - id: flip2
      if: Evidence showed that partnership across government could not function and that exclusive CIA responsibility was
        necessary to achieve the institutional purpose.
      then: O1
      why: The stated case for partnership depends on it being an effective way to organize the work.
    would_not_change:
    - id: noflip1
      if: The CIA official's career were still effectively ending, without any change in the institutional merits of partnership.
      why: The source presents his limited career prospects as context for his persistence, not as the reason the partnership
        structure was preferable.
    watch_for:
    - id: watch1
      what: Whether the partnership continues to deliver streamlined management and effective cooperation across government.
      favors:
      - O3
      why: The source's positive assessment rests on the partnership having worked and the NRO having been established.
  lesson: Do not equate institutional effectiveness with exclusive control by one agency. Where the stated values favor streamlined
    management, cooperation, and sharing authority, a cross-government structure can be preferable if it works in practice.
  limits: This reasoning supports the institutional choice described here; it does not establish that shared authority is
    always preferable or specify legal delegations, oversight safeguards, or operational arrangements. It also does not supply
    a detailed comparison of the available structures.
  library:
    domain: intel-oversight
    family: CORPUS-NS-6c50672a
    source: https://www.nro.gov/Portals/65/documents/history/csnr/leaders/DNRO_monograph_Sep2012.pdf
    episode_focus: Assess the choice of institutional structure and the stated reasons for sharing authority, including streamlined
      management and cooperation across government. Exclude technical details of reconnaissance programs.
    cues:
      option_words:
        O1: 10
        O2: 11
        O3: 10
      real_option: O3
      real_to_mean_other_length: 0.95
      real_is_longest: false
      moves:
        O1: act
        O2: partial
        O3: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
        O3: true
    equities: pilot2
