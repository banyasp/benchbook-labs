case:
  id: DR-CORPUS-NX-0bd11643-E1@v1
  title: Finding the Cause of an Aircraft Mishap
  status: draft
  setting: Pacific Ocean, 22 July 2012; military mishap investigation concerning an F-16C assigned to Misawa Air Base, Japan.
  decider: The Board president
  agent: The Board president
  agent_role: decide
  situation: At the end of the investigation into an F-16C loss of thrust over the Pacific, the Board president must make
    the causal finding. The recovered main fuel shutoff valve was fully closed, and the considered explanations included pilot
    command and an uncommanded electrical input. The engine ran at 70% RPM for about three minutes before the valve fully
    closed, then remained at about 20% RPM until impact. Technical guidance and simulator testing compared that sequence with
    the expected effects of pilot-commanded closure. Corrosion was observed on a valve connector, but its cause and connection
    to an electrical short were not established. Important fuel-system wreckage was unrecovered, and the crash-survivable
    data unit was crushed. The causal finding is subject to a clear-and-convincing-evidence standard.
  question: What should the Board president find as the mishap's cause under the applicable evidentiary standard?
  options:
    O1:
      do: The Board president accepts uncommanded closure as the established cause of the mishap.
      move: act
      irreversible: true
    O2:
      do: The Board president rejects an uncommanded-closure finding and records the mishap cause as undetermined.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 22 July 2012, an F-16C experienced a loss of thrust, the pilot ejected without injury, and the aircraft crashed
      into the Pacific Ocean.
  - id: F2
    kind: capability
    status: confirmed
    fact: The recovered main fuel shutoff valve was fully closed, and an electrical signal is required to close it in flight.
  - id: F3
    kind: situation
    status: assessed
    fact: The engine operated at 70% RPM for over three minutes before the valve fully closed, then remained at jet-fuel-starter-assisted
      20% RPM until impact.
  - id: F4
    kind: capability
    status: assessed
    fact: Technical guidance and simulator testing indicated that pilot-commanded closure would fully close the valve within
      2–4 seconds and produce a different engine rundown sequence.
  - id: F5
    kind: situation
    status: assessed
    fact: The F-16 had a history of partial or full uncommanded main fuel shutoff valve closures, with corrosion identified
      as the cause in most such cases.
  - id: F6
    kind: situation
    status: assessed
    fact: Corrosion was observed on the recovered valve connector, and corrosion there could cause an electrical short capable
      of closing the valve.
  - id: F7
    kind: situation
    status: assessed
    fact: Technical analysis could not determine whether the connector corrosion was associated with pre-crash conditions
      or the aircraft's two months of ocean-floor submersion.
  - id: F8
    kind: situation
    status: confirmed
    fact: The cockpit fuel control panel, fuel control wiring harness, and other fuel-system components were not recovered,
      and the crash-survivable data unit was crushed.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Board president applied clear and convincing evidence to the mishap-cause finding and a preponderance of evidence
      to the engine's partial-closure sequence.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The valve was found fully closed, and the engine’s prolonged operation at 70% RPM before full closure supported a
      partial-then-full closure sequence rather than a single pilot-commanded closure.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Technical guidance and simulator testing indicated pilot activation would fully close the valve within 2–4 seconds
      and cause a different engine rundown; the observed sequence instead took over three minutes and included partial closure,
      which the pilot could not command.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The aircraft had a history of uncommanded valve closures, often associated with corrosion, and corrosion on this
      connector could cause a short; however, the analysis could not establish whether the corrosion predated the crash or
      caused this closure.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Unrecovered fuel-system components and the crushed data unit prevented the Board from determining the precise reason
      for the uncommanded closure, limiting how specifically the cause could be identified.
  - id: C5
    facts:
    - F9
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Board president applied clear and convincing evidence to the causal finding while treating the detailed partial-closure
      sequence under the lower preponderance standard; the observed sequence and its mismatch with the expected pilot-commanded
      effects supported the causal finding.
  reasoning:
    read: The question is whether the evidence establishes an uncommanded closure, not whether the investigation can identify
      the precise electrical fault. The trap is treating the unknown exact mechanism—or the valve’s eventual fully closed
      position by itself—as resolving whether the pilot commanded it.
    weighing: The engine’s partial-then-full closure sequence differed materially from the rapid full closure and rundown
      expected after pilot activation, supporting an uncommanded electrical input. The history of uncommanded closures and
      connector corrosion made a short plausible, but did not prove corrosion caused this event. The missing components and
      data prevented identifying the precise reason; they did not outweigh the evidence distinguishing the observed sequence
      from pilot-commanded closure. The finding depends principally on that sequence and the technical comparison, not on
      treating corrosion as established cause.
    tradecraft: Record the causal finding separately from the unresolved precise mechanism, identify which evidence supports
      each, and state the different evidentiary standards applied to the cause and the engine sequence.
    uncertainty: The Board president could not determine the exact reason for the uncommanded closure with reasonable certainty
      because important evidence was lost. Corrosion was observed and could cause a short, but its timing and causal role
      were not established.
    handoff: The Board president made the causal finding. No additional referral or approval authority is identified here;
      the decision should remain bounded to the president’s evidentiary determination and its stated limitations.
    tempting_wrong:
      option: O2
      pull: Important wreckage and data were unavailable, and the connector corrosion could have resulted from ocean-floor
        submersion.
      why_wrong: Those limitations prevented identifying the exact reason for the closure, but the engine sequence and technical
        comparison still supported an uncommanded rather than pilot-commanded closure.
    rejected:
      O2: The Board president did not leave the cause undetermined because the observed closure sequence and its mismatch
        with the expected pilot-commanded effects supported an uncommanded closure by clear and convincing evidence.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the pilot activated the fuel master switch and that the observed sequence resulted
        from that command.
      then: O2
      why: That would undermine the finding that the closure was uncommanded and require reassessing the cause against the
        pilot-commanded explanation.
    - id: flip2
      if: Reliable technical evidence showed that pilot-commanded closure could produce the observed partial closure lasting
        over three minutes before full closure.
      then: O2
      why: The timing-based distinction on which the Board president relied would no longer distinguish pilot command from
        uncommanded closure.
    would_not_change:
    - id: noflip1
      if: The connector corrosion were determined to have arisen during ocean-floor submersion, without other evidence changing
        the observed engine sequence or its comparison with pilot-commanded closure.
      why: That would weaken corrosion as an explanation for the electrical input, but the finding did not depend on establishing
        corrosion as the precise cause.
    watch_for:
    - id: watch1
      what: Reliable evidence from recovered or otherwise available fuel-system components establishing an electrical short
        during flight.
      favors:
      - O1
      why: It would strengthen the uncommanded-electrical-input explanation, while still requiring care not to overstate the
        precise cause unless the evidence establishes it.
  lesson: Distinguish the cause supported by the evidence from a more specific mechanism the investigation cannot establish.
    Missing evidence and unresolved details matter, but they do not automatically defeat a causal finding when the observed
    sequence strongly discriminates between the competing explanations.
  limits: This reasoning applies to the stated evidentiary record and the Board president’s causal finding; it does not establish
    that corrosion caused the electrical input or identify the exact fault. A materially different engine sequence or reliable
    evidence of pilot activation could require a different finding.
