case:
  id: DR-CORPUS-NX-250da626-E1@v1
  title: Acting on National Security Warnings
  status: draft
  setting: United States, in the months before 11 September, among the national security components of the Government.
  decider: The national security components of the Government
  agent: The national security components of the Government
  agent_role: decide
  situation: In the months before 11 September, national-security policy officials faced warnings that a major al-Qa’ida attack
    within the United States was likely and becoming more likely. Many officials were convinced that the country’s vulnerability
    to such an attack had increased markedly. Governmental and nongovernmental studies recommended protective measures including
    tougher passenger scrutiny, greater intelligence–law-enforcement cooperation, and stricter immigration enforcement. The
    components could adopt a package of such measures or retain the existing level of preparedness. The measures involved
    political and economic costs, inconvenience, opposition from special interests, and disruption to bureaucratic interests.
  question: What should the national security components of the Government do about the recommended protective measures?
  options:
    O1:
      do: The national security components of the Government approve a package of stronger passenger scrutiny, intelligence–law-enforcement
        cooperation, and stricter immigration enforcement.
      move: act
      irreversible: false
    O2:
      do: The national security components of the Government reject a package of stronger passenger scrutiny, intelligence–law-enforcement
        cooperation, and stricter immigration enforcement.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: In the months before 11 September, intelligence communicated the judgment that the likelihood of a major al-Qa’ida
      attack within the United States was high and rising.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Many responsible policy officials were convinced that U.S. vulnerability to such an attack had grown markedly.
  - id: F3
    kind: situation
    status: confirmed
    fact: Governmental and nongovernmental studies recommended tougher air passenger scrutiny, greater cooperation between
      intelligence and law-enforcement agencies, and stricter immigration enforcement.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Strategic warning was given.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The warning was received by responsible officials.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The warning was believed.
  - id: F7
    kind: situation
    status: confirmed
    fact: Commensurate protective measures had not been taken.
  - id: F8
    kind: situation
    status: assessed
    fact: Top policy officials were reluctant to bear political and economic costs, inconvenience, special-interest disapproval,
      and disruption to bureaucratic interests.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The assessed likelihood of a major attack was high and rising, and many responsible officials believed U.S. vulnerability
      had grown markedly; that threat supports stronger protection.
  - id: C2
    facts:
    - F3
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Governmental and nongovernmental studies had identified concrete protective measures, including stronger passenger
      scrutiny, better intelligence–law-enforcement cooperation, and stricter immigration enforcement.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Warning was given, received, and believed, yet commensurate measures were not taken. The assessment treats this as
      a failure to produce appropriate and affordable preparedness, regardless of whether intelligence warning is labeled
      a success or failure.
  - id: C4
    facts:
    - F8
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Political and economic costs, inconvenience, special-interest opposition, and disruption to bureaucratic interests
      were genuine burdens. The assessment describes reluctance to bear them, but does not treat them as sufficient to justify
      leaving the threat inadequately addressed.
  reasoning:
    read: 'This was not a case in which warning was absent or unreceived: officials had been warned, many believed the threat
      and increased vulnerability were real, and protective options had been recommended. The trap is treating the surprise
      of the attack, or the costs of acting, as evidence that the warning did not warrant preparedness.'
    weighing: 'The assessment’s bottom line favors {O1}: the threat was high and rising, warnings were received and believed,
      and commensurate preparedness measures were not taken. Political and economic costs and institutional resistance help
      explain the reluctance, but the assessment says the Government failed to generate appropriate and affordable measures.
      The balance depends on taking the warning and the increased vulnerability seriously while selecting measures that are
      appropriate and affordable.'
    tradecraft: Approve an appropriate, affordable package of protective measures; identify accountable components for implementation
      and coordination; record the threat assessment, the expected protection, the costs and tradeoffs, and the reasons for
      selecting or deferring individual measures. Reassess the package as the threat and implementation constraints change.
    uncertainty: Retrospective accounts of who foresaw dramatic events may be affected by hindsight bias. Even allowing for
      that bias, the public record indicates that warning was given, received, and believed; it does not establish that every
      official held the same view or specify which official rejected which measure.
    handoff: The decision belongs to the national-security components collectively. Involving the relevant policy, intelligence,
      and law-enforcement components is appropriate to assess and coordinate the recommended measures; the record does not
      assign rejection of any particular measure to an individual official.
    tempting_wrong:
      option: O2
      pull: Rejecting the package avoids political and economic costs, inconvenience, special-interest disapproval, and disruption
        to bureaucratic interests.
      why_wrong: Those costs explain reluctance, but the assessment concludes that warning was believed and that the Government
        failed to take appropriate and affordable preparedness measures.
    rejected:
      O2: Rejecting the package would preserve the inadequate level of preparedness despite warnings that were received and
        believed.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible information instead showed that the attack likelihood was not high or rising and that vulnerability had
        not markedly increased.
      then: O2
      why: Without the threat and vulnerability assessment that grounds the recommendation, the case for approving this protective
        package would be substantially weaker.
    - id: flip2
      if: The proposed package could not be made appropriate and affordable, and no feasible protective alternative was available.
      then: O2
      why: The assessment’s criticism concerns the failure to generate appropriate and affordable measures; it does not endorse
        measures regardless of feasibility.
    would_not_change:
    - id: noflip1
      if: The political and economic costs, inconvenience, special-interest opposition, and bureaucratic disruption remained.
      why: Those burdens are acknowledged as reasons for reluctance, but they do not outweigh the assessment’s conclusion
        that believed warnings called for appropriate and affordable preparedness.
    watch_for:
    - id: watch1
      what: Whether warnings continue to be received and believed and whether officials’ assessment of vulnerability changes.
      favors:
      - O1
      why: Warning given, received, and believed is the key context for judging the failure to take commensurate protective
        measures.
  lesson: When serious warnings are received and believed, decision-makers should translate them into appropriate and affordable
    protective measures rather than let political or institutional costs prevent preparedness. Retrospective uncertainty about
    who foresaw an event does not erase a warning that the public record indicates was communicated and credited.
  limits: This reasoning concerns the pre-11 September decision to address a high and rising terrorist threat through the
    recommended protective measures. It does not establish which individual official was responsible for any particular measure,
    nor does it decide what measures would be appropriate under materially different threat or feasibility conditions.
