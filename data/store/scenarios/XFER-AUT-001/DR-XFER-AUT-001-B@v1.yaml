case:
  id: DR-XFER-AUT-001-B@v1
  title: Withdrawal of a Partner-Force Advisory Team
  status: draft
  setting: 2029 · vehicle withdrawal from a partner-force base in a contested inland district; coalition special-operations
    advisory team
  decider: the team leader
  agent: team vehicle-control agent; carries out the team leader's orders
  agent_role: execute
  situation: A coalition special-operations advisory team is withdrawing by vehicle from a partner-force base as hostile forces
    close in. Everyone is accounted for except one adviser who has not returned from a liaison meeting. The team's last contact
    with the adviser was before the meeting ended, and the team leader judges that he is unlikely to return or be reached
    before the vehicle must leave. The team sergeant assesses that the vehicle will likely be caught if it waits more than
    a few minutes. The vehicle carries the team's mission-planning terminal, which cannot be destroyed in the time available.
    The terminal contains access to a coalition partner-force network used by about 1,900 personnel across 23 units, including
    two units moving a supply column tonight.
  question: 'What should the team leader do: leave now, reporting the adviser''s last known position, or hold until he is
    recovered or confirmed lost?'
  options:
    O1:
      do: leave now and report the adviser's last known position
      move: act
      irreversible: true
    O2:
      do: hold until the adviser is recovered or confirmed lost
      move: act
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The advisory team is accounted for except for one adviser who has not returned from a liaison meeting.
  - id: F2
    kind: situation
    status: confirmed
    fact: The adviser's last contact with the team was before the liaison meeting ended.
  - id: F3
    kind: situation
    status: confirmed
    fact: The adviser has not checked in or returned to the vehicle.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The team leader judges that the adviser is unlikely to return to the vehicle or be reached before it must leave.
  - id: F5
    kind: situation
    status: confirmed
    fact: Hostile forces are closing on the team's position.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The team sergeant assesses that the vehicle will likely be caught if it waits more than a few minutes.
  - id: F7
    kind: capability
    status: confirmed
    fact: The vehicle carries the team's mission-planning terminal, which has access to the coalition partner-force network.
  - id: F8
    kind: capability
    status: assessed
    fact: If captured intact, the terminal would expose the network and permit its use for several days until it can be re-secured.
  - id: F9
    kind: situation
    status: confirmed
    fact: About 1,900 personnel across 23 partner-force units use the network; two units are moving a supply column tonight.
  - id: F10
    kind: capability
    status: confirmed
    fact: The terminal cannot be destroyed in the time available.
  considerations:
  - id: C1
    facts:
    - F7
    - F8
    - F9
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: 'The stake is the lives of personnel across the partner-force network, not the terminal as equipment: exposure could
      reveal information or enable false instructions that put them at risk.'
  - id: C2
    facts:
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Waiting makes capture likely rather than remote.
  - id: C3
    facts:
    - F10
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Leaving is the only protection left for the personnel who depend on the network.
  - id: C4
    facts:
    - F1
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The team owes the adviser recovery.
  reasoning:
    read: It can look like one adviser's life against a piece of equipment. It is one life, with uncertain and limited prospects
      of recovery, against the lives of about 1,900 people whose network could be exposed for days. The cue a novice misses
      is that nothing else now protects them from the terminal's capture.
    weighing: 'The duty to an adviser gives way only because three things hold together: {C1} the harm reaches the lives of
      personnel beyond this team, {C2} waiting makes capture likely, and {C3} leaving is the only way to prevent it. Remove
      any one and the duty to the adviser ({C4}) governs. The terminal weighs nothing in itself; it counts only through the
      people its capture would expose. His uncertain and limited prospects of recovery lessen the cost of leaving but are
      not the reason; if he could likely be recovered, this case would not settle it.'
    tradecraft: Use the team sergeant's capture estimate to set a firm departure point and do not let it drift. Until then,
      continue reasonable efforts to contact the adviser and re-check whether the terminal can be made harmless in time. Preserve
      and report the adviser's last known position for follow-up, and report the decision and its reasons promptly.
    uncertainty: The adviser's condition ({F4}), the capture estimate ({F6}), and the duration of network exposure ({F8})
      are judgments under pressure. The choice survives if he might be alive but cannot be reached in time; it fails if capture
      is unlikely or the network could be re-secured before anyone is exposed.
    handoff: The team leader owns this call, with no time to take it higher. It would go up only if the adviser were likely
      to be recovered. The agent carries out the order and reports it; it does not re-weigh the decision.
    tempting_wrong:
      option: O2
      pull: '''Never leave anyone behind'' feels like the loyal answer.'
      why_wrong: It stakes the safety of personnel across the partner-force network on a slim chance of recovering one person.
    rejected: {}
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the terminal can be made harmless before capture
      then: O2
      why: Leaving is no longer the only protection.
    - id: flip2
      if: no partner-force-wide network is accessible from the terminal and only the team and vehicle are at risk
      then: O2
      why: A local loss does not outweigh the duty to the adviser.
    - id: flip3
      if: the adviser is likely alive and can be reached
      then: O2
      why: A savable life against network-wide exposure is a trade this case does not settle.
    - id: flip4
      if: the network can be re-secured before hostile forces could exploit the captured terminal
      then: O2
      why: Capture would then expose no one beyond the team; the terminal was only ever a danger to the people its access
        could expose.
    would_not_change:
    - id: noflip1
      if: the closing hostile forces belong to a militia rather than a state military
      why: Capture by anyone still exposes the partner-force network's personnel.
    - id: noflip2
      if: the person missing is a contracted civilian adviser, not a uniformed service member
      why: The duty runs to everyone in the team's charge.
    watch_for:
    - id: watch1
      what: holding would also put the rest of the team at risk
      favors:
      - O1
      why: A second reason to leave.
    - id: watch2
      what: a captured adviser could be exploited for what he knows
      favors:
      - O2
      why: A reason to recover him; its weight depends on what he knows.
  lesson: An adviser may be left behind only when waiting would likely put other people's lives beyond the team at risk and
    leaving is the only way to prevent it. Short of that, the duty to the individual governs.
  limits: 'It does not reach local stakes (the team or its vehicle alone), a threat that is possible rather than likely, equipment
    whose loss endangers no one or can be made harmless in time (destroyed, moved, or the network re-secured before anyone
    is exposed), or a person who can probably be recovered. Nor does it transfer authority: a team leader made this call,
    and an agent does not inherit it by analogy.'
