case:
  id: DR-CORPUS-NX-38c2cfb7-E1@v1
  title: Machine-Learning Support for Battlefield Analysis
  status: draft
  setting: Battlefield; time unspecified; Department of Defense.
  decider: The Department of Defense
  agent: The Department of Defense
  agent_role: decide
  situation: At a battlefield intelligence-analysis decision point, the Department of Defense faced a large volume of video
    data. Analysts could not skillfully and efficiently review that volume while the intelligence remained relevant. Machine-learning
    support was available as an alternative to manual analyst review. The support was capable of drastically reducing false
    positives. The decision was whether to rely on that support or leave review to analysts manually.
  question: What should the Department of Defense do about relying on machine-learning support rather than assigning analysts
    to review the battlefield video manually?
  options:
    O1:
      do: The Department of Defense adopts machine-learning support for analysts reviewing battlefield video.
      move: act
      irreversible: false
    O2:
      do: The Department of Defense rejects machine-learning support and assigns analysts to review battlefield video manually.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analysis concerned battlefield intelligence.
  - id: F2
    kind: situation
    status: confirmed
    fact: A large volume of video data was available for analysis.
  - id: F3
    kind: capability
    status: confirmed
    fact: Analysts could not skillfully and efficiently review the video data.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The intelligence remained relevant while timely review was needed.
  - id: F5
    kind: capability
    status: confirmed
    fact: Machine-learning support was available for intelligence analysis.
  - id: F6
    kind: capability
    status: assessed
    fact: Machine-learning support was capable of drastically reducing false positives.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The volume of video exceeded analysts’ ability to review it efficiently while the intelligence was still relevant,
      favoring support that could help address the time constraint.
  - id: C2
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Analysts could not skillfully and efficiently comb through the large volume, so relying on manual review alone risked
      leaving the analysis incomplete or untimely.
  - id: C3
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The available machine-learning support could drastically reduce false positives, a stated benefit for the analysis
      process.
  reasoning:
    read: The choice is whether to use machine-learning support to help analysts handle a volume of battlefield video they
      could not review skillfully and efficiently while its intelligence remained relevant. The trap is treating manual review
      as sufficient simply because analysts are available, despite the stated mismatch between the volume and their capacity.
    weighing: 'The stated reasons favor O1: analysts could not efficiently review the volume within the relevant period, and
      the support could drastically reduce false positives. Together, timeliness and that stated analytical benefit outweigh
      leaving the review to analysts manually. The balance depends on the stated workload problem and the support’s ability
      to reduce false positives.'
    tradecraft: Keep the decision focused on supporting intelligence analysis, not on any targeting or engagement decision.
      As an authored implementation safeguard, preserve analysts’ role in assessing the information flagged for their attention
      and record the reasons for relying on the support.
    uncertainty: The source gives no further detail about the support’s limitations, performance beyond its reduction of false
      positives, or any legal or policy rule governing its use.
    handoff: The Department of Defense is the decider. As an authored process suggestion, analysts should inform how the support
      addresses the review burden because their capacity problem is central to the stated reason for using it.
    tempting_wrong:
      option: O2
      pull: Manual review leaves the analysis directly with analysts.
      why_wrong: That preference does not address the stated fact that analysts could not skillfully and efficiently review
        the large volume while the intelligence remained relevant.
    rejected:
      O2: The Department of Defense did not leave the video to manual review because analysts could not efficiently review
        the volume while the intelligence remained relevant, and the support could drastically reduce false positives.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The video volume became manageable for analysts to review skillfully and efficiently while the intelligence remained
        relevant.
      then: O2
      why: That would remove the stated capacity and timeliness reasons for relying on machine-learning support.
    - id: flip2
      if: The support were no longer capable of drastically reducing false positives.
      then: O2
      why: That would remove one of the source’s stated benefits of relying on the support, though the workload and timeliness
        reasons would still need consideration.
    would_not_change:
    - id: noflip1
      if: Analysts remained unable to review the volume efficiently while the intelligence remained relevant, but the workload
        was described as difficult rather than impossible.
      why: The stated reason is their inability to review skillfully and efficiently in the relevant period, not that manual
        review was literally impossible.
    watch_for:
    - id: watch1
      what: Whether the support continues to drastically reduce false positives.
      favors:
      - O1
      why: That capability is an express reason for the Department of Defense’s choice.
  lesson: When the volume of intelligence exceeds analysts’ ability to review it while it remains relevant, support that improves
    timely analysis can be preferable to manual review alone. Give weight to demonstrated benefits such as a drastic reduction
    in false positives, while keeping the decision confined to the analysis problem presented.
  limits: This reasoning concerns support for reviewing a large volume of battlefield video under time pressure. It does not
    establish a general rule for other uses of machine learning or resolve any targeting, engagement, or legal-authority question.
