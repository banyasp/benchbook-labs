case:
  id: DR-CORPUS-NX-88ff1b4b-E3@v1
  title: Organizing Collection and Analysis
  status: draft
  setting: The ODNI, during the organization of the new office; date not specified.
  decider: The ODNI leaders
  agent: The ODNI leaders
  agent_role: decide
  situation: The new office needed to implement mandated changes and improve its collection and analysis functions. The functions
    were treated as critical arenas of intelligence activity. Some argued that placing both in one organizational unit was
    necessary to connect collection activities to analytical requirements. The ODNI leaders faced a choice between a combined
    unit and separate directorates.
  question: What should the ODNI leaders do to organize the collection and analysis functions in the new office?
  options:
    O1:
      do: The ODNI leaders organize collection and analysis in one combined directorate.
      move: act
      irreversible: false
    O2:
      do: The ODNI leaders organize collection and analysis in separate directorates.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Collection and analysis were identified as critical arenas of intelligence activity.
  - id: F2
    kind: situation
    status: confirmed
    fact: The organizational change was intended to implement mandated changes and improve performance in both functions.
  - id: F3
    kind: situation
    status: assessed
    fact: Some argued that collection and analysis needed to be located in one organizational unit to connect collection activities
      to analytical requirements.
  - id: F4
    kind: situation
    status: assessed
    fact: The ODNI leaders judged that the connection between collection and analytical requirements could be achieved by
      other means.
  - id: F5
    kind: situation
    status: assessed
    fact: The ODNI leaders judged that separate units and deputies would better achieve mandated and other improvements in
      both functions.
  - id: F6
    kind: situation
    status: confirmed
    fact: The ODNI structure was intended to include representation from multiple producer and consumer components.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The leaders judged that separate units and deputies would better implement mandated changes and achieve improvements
      in both critical functions.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The case for a combined unit was that it would connect collection activities to analytical requirements; the leaders
      judged that connection could instead be achieved by other means.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Representation from multiple producer and consumer components was an intended feature of the ODNI structure, supporting
      an inclusive organizational design, though it does not by itself establish that separate directorates are superior.
  reasoning:
    read: The choice is how to organize two critical functions to implement mandated reforms and improve performance. The
      trap is treating a combined unit as the only way to connect collection to analytical requirements, when the leaders
      judged that connection could be achieved by other means {C2}.
    weighing: The leaders gave greater weight to their judgment that separate units and deputies would better achieve mandated
      and other improvements in both functions {C1}. The argument for combining the functions remained relevant, but was outweighed
      by that assessment because the leaders believed the collection-analysis connection could be maintained through other
      means {C2}. The intended representation of producer and consumer components also supported the broader organizational
      design {C3}. The balance depends on the leaders' assessments of improvement and whether the connection can be achieved
      outside a combined unit.
    tradecraft: As a decision practice, record the reasons for choosing separate directorates, how the collection-analysis
      connection is expected to be maintained, and how performance in both functions will be assessed. Revisit the structure
      if experience undermines those premises.
    uncertainty: The passage does not specify the other means for connecting collection to analytical requirements or report
      how the separate directorates performed.
    handoff: The ODNI leaders held the decision. As a practical implementation matter, they could draw on the collection and
      analysis leadership and the represented producer and consumer components, while retaining the organizational choice
      themselves.
    tempting_wrong:
      option: O1
      pull: A combined unit appears to ensure collection activities respond to analytical requirements.
      why_wrong: The leaders judged that this connection could be achieved by other means and that separate units and deputies
        would better deliver improvements in both functions.
    rejected:
      O1: The leaders did not choose a combined directorate because they judged the collection-analysis connection could be
        achieved by other means and separate units would better achieve improvements.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The leaders no longer judged that collection activities could be connected to analytical requirements by means other
        than a combined unit.
      then: O1
      why: The stated reason for rejecting the combined structure would no longer hold, making the integration concern more
        decisive.
    - id: flip2
      if: Evidence showed that separate units and deputies would not better achieve mandated or other improvements in both
        functions.
      then: O1
      why: The leaders' stated comparative reason for choosing separate directorates would be undermined.
    would_not_change:
    - id: noflip1
      if: The argument for a combined unit were repeated without changing the leaders' assessment that the connection could
        be achieved by other means.
      why: That argument was already considered; on the stated assessment, it did not outweigh the expected advantages of
        separate units.
    watch_for:
    - id: watch1
      what: Whether collection activities remain connected to analytical requirements under separate directorates.
      favors:
      - O1
      why: A failure of that connection would weaken the premise for keeping the functions separate.
  lesson: Do not assume that placing related functions in one unit is the only way to coordinate them. Compare the coordination
    concern with the expected performance of each structure, and make the choice turn on whether the alternative means can
    preserve the needed connection.
  limits: This reasoning supports separate directorates on the leaders' stated assessments; it does not establish that separation
    is generally preferable. The passage does not identify the alternative coordination mechanisms or provide evidence about
    later performance.
