case:
  id: DR-CORPUS-NS-a6c015ef-E10@v1
  title: Creating a House Intelligence Oversight Committee
  status: draft
  setting: House of Representatives, 17 July 1977, consideration of House Resolution 658.
  decider: The House of Representatives
  agent: The House of Representatives
  agent_role: decide
  situation: The House is considering a proposed permanent select committee to receive intelligence and handle related legislation.
    The Speaker regards weekly intelligence briefings as inadequate, and the House has no corresponding process for an intelligence
    authorization bill developed by the Senate. Some members are concerned about repeating the experience of the Pike Committee,
    while others question the proposed committee’s partisan balance or worry that a small group would conduct oversight in
    secret. The proposal sets a 13-member committee with membership reflecting the House’s overall party proportions, a design
    that has drawn competing claims about the parties’ seat allocations. The Speaker has assured members that the committee
    would deliberate and act in a nonpartisan manner.
  question: What should the House of Representatives do about House Resolution 658?
  options:
    O1:
      do: The House postpones its vote on House Resolution 658 and leaves the proposal pending.
      move: hold
      irreversible: false
    O2:
      do: The House approves House Resolution 658 and establishes a permanent intelligence oversight committee.
      move: act
      irreversible: false
    O3:
      do: The House rejects House Resolution 658 and declines to establish a permanent intelligence oversight committee.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The House did not yet have a counterpart to the Senate intelligence committee, and the Speaker considered his weekly
      intelligence briefings unsatisfactory.
  - id: F2
    kind: situation
    status: confirmed
    fact: The House needed a place to receive intelligence and refer legislation; the Senate had developed an intelligence
      authorization bill in spring 1977 without a corresponding House process.
  - id: F3
    kind: situation
    status: assessed
    fact: There was reluctance on both sides of the aisle to repeat the experience of the Pike Committee.
  - id: F4
    kind: situation
    status: confirmed
    fact: House Resolution 658 proposed a 13-member select committee chosen by the House Speaker and minority leader.
  - id: F5
    kind: situation
    status: assessed
    fact: The proposed membership would reflect the House’s party proportions; Democrats asserted entitlement to nine seats
      and Republicans to four, and Republicans challenged those assertions.
  - id: F6
    kind: situation
    status: assessed
    fact: Some opponents characterized the proposal as blatantly political, while some liberal Democrats feared a return to
      secret oversight by an elite few.
  - id: F7
    kind: situation
    status: assessed
    fact: The Speaker assured House members that the proposed committee would deliberate and act in a nonpartisan manner.
  - id: F8
    kind: situation
    status: confirmed
    fact: The proposed committee rules did not provide equal access to committee information and provided for separate majority
      and minority staffs.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The House needed a place to receive intelligence and handle related legislation; the Speaker considered weekly briefings
      inadequate, and the Senate's authorization bill had no corresponding House process.
  - id: C2
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O1
    - O3
    weight: weak
    why: Reluctance to repeat the Pike Committee experience counted against proceeding, though it did not prevent the House
      from establishing a counterpart.
  - id: C3
    facts:
    - F5
    - F6
    - F8
    equity: impartiality
    favors:
    - O1
    - O3
    weight: weak
    why: Disputes over party-seat allocations and concerns about elite, secret oversight raised questions about partisan balance;
      the rules also provided unequal information access and separate party staffs.
  - id: C4
    facts:
    - F7
    equity: impartiality
    favors:
    - O2
    weight: strong
    why: The Speaker assured members that the committee would deliberate and act nonpartisanly; the resolution passed on the
      basis of those assurances.
  reasoning:
    read: 'This was a choice between creating a House channel for intelligence and related legislation, despite concerns about
      how a small committee would operate, and leaving the House without that counterpart. The trap is treating the Pike experience
      and partisan objections as either irrelevant or automatically decisive: they were real concerns, but the House also
      had a concrete oversight and legislative gap.'
    weighing: The need for a place to receive intelligence and consider related legislation favored approval, while reluctance
      to repeat the Pike experience and concerns about partisan balance weighed against it. The Speaker's assurance of nonpartisan
      deliberation was the stated basis for approval, and the House passed the resolution by 227 to 171. The balance depended
      on accepting that assurance despite the disputed seat allocation and the committee's unequal information access and
      separate staffs.
    tradecraft: Carry out the decision through the committee structure the House adopted, with the Speaker and minority leader
      selecting members as provided. The Speaker's nonpartisan assurance should guide deliberation; do not treat that assurance
      as proof that concerns about balance have disappeared.
    uncertainty: The account records the assurance and the vote, but does not establish whether the committee's arrangements
      resolved members' concerns about partisan balance or secret oversight.
    handoff: The House made the decision. The adopted resolution assigns member selection to the Speaker and minority leader;
      no further approval authority is identified.
    tempting_wrong:
      option: O3
      pull: Rejecting the proposal could seem prudent given the Pike Committee experience, disputes over party representation,
        and fears of secret oversight by a small group.
      why_wrong: That would leave the House without the counterpart the Speaker considered necessary to receive intelligence
        and handle related legislation, while weekly briefings were considered inadequate.
    rejected:
      O1: Postponement would leave the House's intelligence and legislative-process gap unresolved rather than establish the
        counterpart the Speaker considered necessary.
      O3: Rejection would preserve the concerns about committee structure but leave the House without a place to receive intelligence
        and consider related legislation.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The House already had an adequate means to receive intelligence and a corresponding process for considering intelligence
        authorization legislation.
      then: O3
      why: The principal stated need for creating a House counterpart would be absent.
    - id: flip2
      if: The House had no credible basis to rely on the assurance of nonpartisan deliberation and the committee's arrangements
        left the concerns about partisan control and secret oversight unaddressed.
      then: O1
      why: The stated basis for overcoming objections would be weakened, making postponement to reconsider the proposal more
        appropriate.
    would_not_change:
    - id: noflip1
      if: Members remained reluctant to repeat the Pike Committee experience, without new information changing the House's
        need for intelligence access and a legislative process.
      why: That reluctance was present, but the House still approved the resolution in view of the need for a counterpart
        and the Speaker's assurance.
    watch_for:
    - id: watch1
      what: Whether the disputed party-seat allocation and unequal access to committee information undermine confidence in
        nonpartisan oversight.
      favors:
      - O1
      - O3
      why: These features bear on the concerns that led some members to oppose the proposal.
  lesson: When a chamber lacks an adequate route to receive intelligence and handle related legislation, that institutional
    need can justify creating an oversight body despite concerns about its design. Assurances of nonpartisan conduct may help
    answer those concerns, but they do not erase structural questions about balance and access.
  limits: This reasoning applies to the House's 1977 decision about creating a counterpart committee, not to whether a particular
    committee design is fair or effective in practice. It does not establish that an assurance of nonpartisanship is sufficient
    in other circumstances.
