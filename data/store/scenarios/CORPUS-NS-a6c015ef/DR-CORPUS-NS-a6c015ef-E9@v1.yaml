case:
  id: DR-CORPUS-NS-a6c015ef-E9@v1
  title: Creating a Dedicated Senate Intelligence Oversight Committee
  status: draft
  setting: United States Senate, May 1976
  decider: The United States Senate
  agent: The United States Senate
  agent_role: decide
  situation: The Senate is considering Senate Resolution 400 after a committee investigation found congressional awareness
    of the Agency had been extremely limited and that this allowed abuses to occur. The investigating committee recommended
    a permanent Senate select committee to oversee the CIA and the rest of the Intelligence Community. The proposed resolution
    would give the new committee exclusive oversight of the CIA and concurrent jurisdiction over other intelligence activities.
    It would also establish annual authorization responsibilities, while excluding certain tactical foreign military intelligence
    activities from that authority. The proposal includes rules for membership, tenure, minority access, and a unified professional
    staff.
  question: What should the United States Senate do about Senate Resolution 400?
  options:
    O1:
      do: The Senate should approve Senate Resolution 400 and establish the select committee under its proposed terms.
      move: act
      irreversible: false
    O2:
      do: The Senate should reject Senate Resolution 400 and leave intelligence oversight with the existing committees.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The investigating committee found that congressional overseers had extremely limited awareness of the Agency, allowing
      many identified abuses to occur.
  - id: F2
    kind: situation
    status: confirmed
    fact: The investigating committee called for a permanent Senate select committee to oversee the CIA and the rest of the
      Intelligence Community.
  - id: F3
    kind: authority
    status: confirmed
    fact: Senate Resolution 400 proposed exclusive oversight of the CIA and concurrent jurisdiction over intelligence activities
      of other Intelligence Community elements.
  - id: F4
    kind: authority
    status: confirmed
    fact: The resolution proposed that Intelligence Community agencies be expected to keep the new committee fully and currently
      informed, including about significant anticipated activities.
  - id: F5
    kind: authority
    status: confirmed
    fact: The resolution proposed annual authorization of government intelligence activities, excluding tactical foreign military
      intelligence activities serving no national policymaking function.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposed committee's members would be selected by Senate majority and minority leaders, and its chair and vice
      chair could not simultaneously lead a major standing committee.
  - id: F7
    kind: situation
    status: confirmed
    fact: The proposed committee would have 15 members, no more than eight from the majority party, and members would serve
      eight-year terms intended to limit co-option and broaden exposure to intelligence work.
  - id: F8
    kind: authority
    status: confirmed
    fact: The proposed rules would give minority members the same access to committee information as majority members and
      allow the committee to hire its own staff subject to security-clearance standards.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: oversight_candor
    favors:
    - O1
    weight: strong
    why: Congressional overseers had extremely limited awareness, and the investigating committee found that this allowed
      many abuses to occur. The committee therefore called for a permanent Senate select committee; dedicated oversight directly
      addresses the identified deficiency.
  - id: C2
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The proposed leadership limits were intended to prevent other committee duties from distracting the overseers. Eight-year
      terms were intended to limit co-option and broaden senators’ exposure to intelligence work, supporting sustained and
      informed oversight.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The proposed jurisdiction, information expectations, annual authorization role, and committee staff provide an institutional
      structure for review rather than relying on cursory oversight by committees with competing responsibilities. The tactical-intelligence
      exclusion preserves a defined boundary on that authorization role.
  reasoning:
    read: 'The central problem is not simply which committee should receive jurisdiction: the existing overseers lacked the
      awareness needed to detect abuses, and their competing duties contributed to cursory review. The trap is treating continuity
      with the old arrangements as adequate, or assuming that a committee can oversee effectively without dedicated attention
      and support.'
    weighing: The case for {O1} is strongest because the investigated deficiency was limited congressional awareness that
      had allowed abuses, and the committee’s central recommendation was a dedicated Senate select committee {C1}. The proposed
      limits on competing duties, tenure, jurisdiction, information, and staff support the prospect of more sustained review
      {C2} {C3}. The balance depends on the new body actually having the time, information, and capacity to oversee; the source
      does not establish that the structure guarantees abuse prevention.
    tradecraft: Approve the resolution as proposed and preserve a clear record of the committee’s jurisdiction, information
      expectations, authorization responsibilities, membership rules, and staff-clearance requirements. Treat those provisions
      as the framework for oversight, not as proof that oversight has occurred.
    uncertainty: The historical account gives the investigation’s finding and the Senate’s action, but does not establish
      how effective the new arrangements would prove to be or resolve the security and disclosure risks associated with intelligence
      oversight.
    handoff: The Senate must decide the resolution through its legislative process; no separate operational decision-maker
      is identified. Implementation should remain with the committee and Senate under the terms the Senate adopts.
    tempting_wrong:
      option: O2
      pull: Keeping oversight with the existing committees preserves established jurisdiction and avoids creating another
        body.
      why_wrong: The identified failure was that the existing overseers knew too little and gave the Agency cursory attention;
        retaining that arrangement would leave the diagnosed weakness unaddressed.
    rejected:
      O2: The Senate did not retain the existing arrangements because the investigation found that their limited awareness
        had allowed abuses and recommended dedicated oversight.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that the proposed select committee could not obtain the information or capacity needed
        for meaningful oversight.
      then: O2
      why: The principal justification for the new arrangement is to remedy limited awareness; if the proposal could not do
        that, its central reason would fail.
    would_not_change:
    - id: noflip1
      if: The existing committees had established jurisdiction and had previously helped the Agency obtain resources.
      why: Those features do not overcome the finding that the existing oversight was cursory and that overseers lacked sufficient
        awareness.
    watch_for:
    - id: watch1
      what: Whether the committee receives the information and dedicated staff support needed to carry out its oversight responsibilities.
      favors:
      - O1
      why: Those capacities are necessary for the new structure to address the limited awareness identified by the investigation.
  lesson: When inadequate oversight has allowed abuses, preserving the existing arrangement is not a sufficient response merely
    because it is established. A dedicated body needs time, access to information, and professional support if it is to provide
    meaningful review.
  limits: This reasoning addresses the Senate’s decision to create a dedicated intelligence oversight committee in response
    to the stated findings. It does not determine the committee’s later effectiveness or settle how any particular classified
    information should be disclosed.
