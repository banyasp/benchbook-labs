case:
  id: DR-CORPUS-NS-8bdc7318-E1@v1
  title: Appellate Review of the Four Towns Attacks
  status: draft
  setting: Appeals Chamber review of attacks against the Four Towns during Operation Storm
  decider: The Appeals Chamber
  agent: The Appeals Chamber
  agent_role: decide
  situation: The Appeals Chamber is reviewing the Trial Chamber’s finding that artillery attacks against the Four Towns were
    unlawful. The finding relied substantially on an impact analysis applying an artillery accuracy margin. Evidence about
    artillery accuracy included estimates based on limited circumstances and differing assessments. The record contained indications
    that mobile military or police targets might have been present, alongside uncertainty about whether potential targets
    could be observed. Other material included ambiguous artillery reports, an assessment concerning an attack on a lawful
    military target, and a transcript of the Brioni Meeting.
  question: What should the Appeals Chamber do in reviewing the finding that artillery attacks against the Four Towns were
    unlawful?
  options:
    O1:
      do: The Appeals Chamber should reverse the finding that artillery attacks against the Four Towns were unlawful and set
        that finding aside.
      move: act
      irreversible: true
    O2:
      do: The Appeals Chamber should affirm the finding that artillery attacks against the Four Towns were unlawful and leave
        that finding in place.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Trial Chamber found that artillery attacks against the Four Towns were unlawful and relied substantially on
      its impact analysis.
  - id: F2
    kind: situation
    status: confirmed
    fact: The impact analysis applied a fixed artillery-error margin, but the Trial Judgement identified no evidentiary basis
      for deriving that margin.
  - id: F3
    kind: capability
    status: assessed
    fact: Testimony on artillery accuracy was based on limited circumstances, indicated reduced accuracy at greater distances,
      and included estimates that differed from one another.
  - id: F4
    kind: situation
    status: assessed
    fact: The record included indications that police or military vehicles might have moved through Knin during the shelling,
      but the Trial Chamber found limited evidence of lawful mobile targets.
  - id: F5
    kind: capability
    status: assessed
    fact: The evidence was inconclusive about whether forces could observe potential targets in Knin at relevant times.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Some artillery reports suggested firing toward predominantly civilian areas without specific targets, while the
      reports were incomplete and ambiguous.
  - id: F7
    kind: situation
    status: assessed
    fact: The Trial Chamber found an attack on a lawful military target disproportionate, but did not make a concrete comparative
      assessment of military advantage or findings on resulting damage or casualties.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Brioni Transcript was in the record, but the Trial Chamber did not explicitly refer to it when explaining its
      conclusions about the nature of the artillery attacks.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Trial Chamber did not explain the evidentiary basis for its fixed 200-metre margin. The accuracy testimony was
      limited in applicability, varied, and did not adequately support applying that margin to the attacks; the Appeals Chamber
      therefore found the impact analysis unreliable as a basis for upholding the finding.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Possible mobile military or police targets, coupled with uncertainty about observation and the absence of a dependable
      artillery-error estimate, left reasonable doubt about whether impacts far from fixed targets established unlawful shelling.
  - id: C3
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Reports suggesting fire toward civilian areas without specific targets and the Trial Chamber's proportionality finding
      concerning an attack on a lawful military target could support an inference of unlawful attacks. But the reports were
      incomplete or ambiguous, and the proportionality analysis lacked a concrete assessment of comparative military advantage
      and findings on resulting harm.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The Brioni Transcript offered only limited support for unlawful attacks, particularly because the Trial Chamber did
      not explicitly rely on it when reaching its conclusions about the attacks.
  reasoning:
    read: The review concerned whether the record adequately established unlawful attacks, not whether the attacks were necessarily
      lawful. The central trap was treating the impact analysis as conclusive when its fixed error margin lacked an identified
      evidentiary basis and other evidence remained uncertain.
    weighing: The Appeals Chamber majority gave decisive weight to the unsupported 200-metre standard and to the reasonable
      doubt created by possible mobile targets and uncertain artillery accuracy {C1} {C2}. Reports and the Martic finding
      supplied some support for the Trial Chamber's conclusion, but their limitations reduced their value {C3}; the Brioni
      Transcript added only limited support {C4}. On that balance, the evidence did not establish unlawful artillery attacks,
      so the finding could not be upheld. Judges Agius and Pocar dissented on the majority's conclusion concerning the impact
      analysis and distant impacts.
    tradecraft: State the evidentiary deficiency precisely, separate evidence that suggests unlawfulness from evidence sufficient
      to establish it, and record how uncertainty affects the conclusion. Keep the disposition confined to the finding under
      review.
    uncertainty: The record included indications of possible observers and mobile targets, but did not resolve whether targets
      could be observed or provide a dependable range-of-error estimate. The majority treated those uncertainties as creating
      reasonable doubt; two judges disagreed with the majority's conclusion on the impact analysis.
    handoff: The Appeals Chamber was the reviewing decision-maker. The recorded judicial disagreement should remain visible
      in explaining the result rather than being presented as unanimous.
    tempting_wrong:
      option: O2
      pull: The reports suggesting fire toward civilian areas and the Trial Chamber's finding concerning the attack on a lawful
        military target may appear to corroborate unlawful attacks.
      why_wrong: The majority found those matters insufficient to uphold the broader finding when the reports were ambiguous,
        the proportionality analysis was limited, and the impact analysis rested on an unsupported margin.
    rejected:
      O2: The Appeals Chamber did not affirm because the impact analysis was inadequately supported and the remaining evidence
        did not eliminate reasonable doubt about unlawful attacks.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The record instead contained a dependable, evidentially supported artillery-accuracy assessment applicable to the
        attacks, and the evidence excluded lawful mobile targets as a reasonable possibility.
      then: O2
      why: Those changes could remove the principal uncertainties the majority said prevented distant impact sites from demonstrating
        unlawful shelling.
    would_not_change:
    - id: noflip1
      if: The Brioni Transcript remained the only additional material offered to support the finding, without explicit reliance
        on it in the Trial Chamber's conclusions.
      why: The majority considered the transcript to provide only limited support, so that circumstance alone would not resolve
        the deficiencies in the impact analysis.
    watch_for:
    - id: watch1
      what: Whether further evidence reliably establishes artillery accuracy in the circumstances of the attacks and whether
        lawful mobile targets could have been present.
      favors:
      - O2
      why: Those matters bear directly on the majority's stated reasons for finding reasonable doubt about the impact analysis.
  lesson: A finding based substantially on an impact analysis cannot be upheld when its decisive accuracy margin lacks an
    identified evidentiary basis. Ambiguous supporting material and possible lawful targets must be assessed alongside that
    deficiency; where the combined record leaves reasonable doubt, the finding is not established.
  limits: This reasoning addresses appellate review of this finding on this record, not whether any particular attack was
    lawful or unlawful. It does not resolve the lawfulness of other conduct or substitute for a supported, case-specific assessment
    of the evidence.
