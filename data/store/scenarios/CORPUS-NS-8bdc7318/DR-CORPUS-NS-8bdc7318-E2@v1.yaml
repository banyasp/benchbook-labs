case:
  id: DR-CORPUS-NS-8bdc7318-E2@v1
  title: Characterizing Civilian Departures as Deportation
  status: draft
  setting: The Four Towns, during the events at issue; the Trial Chamber.
  decider: The Trial Chamber
  agent: The adjudication-support agent acting under the Trial Chamber’s delegated authority
  agent_role: decide
  situation: Civilians departed settlements, and those departures coincided with artillery attacks on settlements. The attacks
    had not been characterized as unlawful. Unlawful attacks were not a legal prerequisite to proving deportation. The Trial
    Chamber was considering whether to characterize the departures as deportation in the factual context of the case. The
    record did not conclusively establish whether the civilians were forcibly displaced or whether the artillery operators
    intended to forcibly displace them.
  question: What should the adjudication-support agent do about whether to characterize the civilian departures as deportation?
  options:
    O1:
      do: The adjudication-support agent should exclude the civilian departures from a finding of deportation.
      move: act
      irreversible: true
    O2:
      do: The adjudication-support agent should include the civilian departures in a finding of deportation.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Civilians departed from settlements.
  - id: F2
    kind: situation
    status: confirmed
    fact: The civilian departures coincided with artillery attacks on settlements.
  - id: F3
    kind: situation
    status: assessed
    fact: The artillery attacks associated with the departures had not been characterized as unlawful.
  - id: F4
    kind: authority
    status: confirmed
    fact: Unlawful attacks were not required as a matter of law to prove deportation.
  - id: F5
    kind: situation
    status: confirmed
    fact: The factual context of the case was part of the assessment of the civilian departures.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The available record did not conclusively establish that the civilians were forcibly displaced.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The available record did not conclusively establish that the artillery operators intended to forcibly displace the
      civilians.
  - id: F8
    kind: authority
    status: confirmed
    fact: The adjudication-support agent is delegated authority by the Trial Chamber to make this finding.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Because unlawful attacks were not a legal prerequisite to proving deportation, the attacks’ not having been characterized
      as unlawful cannot by itself bar a deportation finding.
  - id: C2
    facts:
    - F2
    - F3
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: In the factual context, the departures coincided with attacks that had not been characterized as unlawful; the Chamber
      declined to treat those departures as deportation on that basis alone.
  - id: C3
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The record did not conclusively establish either that the civilians were forcibly displaced or that the artillery
      operators intended to forcibly displace them, so the Chamber declined to characterize the departures as deportation.
  reasoning:
    read: The question is whether to characterize civilian departures that coincided with artillery attacks as deportation
      in this case’s factual context. The trap is to treat the attacks’ not having been characterized as unlawful as a legal
      bar, or, in the opposite direction, to treat the coincidence of departures and attacks as conclusive proof of forced
      displacement and intent.
    weighing: The absence of a legal requirement that attacks be unlawful means {F3} does not itself foreclose deportation
      {C1}. But the Chamber assessed the departures in context, and the record did not conclusively establish either forced
      displacement or the artillery operators’ intent to cause it {C2} {C3}. That evidentiary uncertainty supports excluding
      the departures from a deportation finding, without turning unlawfulness into a prerequisite. The balance could change
      if the evidence conclusively established forced displacement and intent.
    tradecraft: Record the exclusion as a case-specific assessment of the evidence. State separately that unlawful attacks
      are not a legal prerequisite and that the record did not conclusively establish forced displacement or intent; do not
      present the former as the reason the claim fails.
    uncertainty: The record’s uncertainty concerns whether the civilians were forcibly displaced and whether the artillery
      operators intended to displace them. The source does not resolve those matters affirmatively or find that the departures
      were voluntary.
    handoff: The agent may make this finding under the Trial Chamber’s delegated authority {F8}; the fixed record supplies
      no reason to refer the decision elsewhere.
    tempting_wrong:
      option: O2
      pull: The departures coincided with artillery attacks, and unlawfulness was not legally required to prove deportation.
      why_wrong: Those points do not establish that the civilians were forcibly displaced or that the operators intended to
        displace them; the Chamber treated the lack of conclusive proof on those matters as decisive in context.
    rejected:
      O2: The Chamber did not include the departures as deportation because the record did not conclusively establish forced
        displacement or the artillery operators’ intent to cause it.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Further reliable evidence conclusively established that the civilians were forcibly displaced and that the artillery
        operators intended to forcibly displace them.
      then: O2
      why: That evidence would address the two uncertainties the Chamber identified as preventing a conclusive finding.
    would_not_change:
    - id: noflip1
      if: The attacks were characterized as unlawful, but there were no additional facts establishing forced displacement
        or the operators’ intent.
      why: Unlawfulness was not a legal prerequisite to proving deportation and, by itself, would not resolve the evidentiary
        uncertainties the Chamber identified.
    watch_for:
    - id: watch1
      what: Additional evidence bearing on whether the departures were forced and whether the operators intended to cause
        displacement.
      favors:
      - O2
      why: Those are the unresolved matters that drove the Chamber’s decision not to characterize the departures as deportation.
  lesson: Do not turn a fact that is not a legal prerequisite into a categorical bar. Assess the relevant conduct in context,
    and distinguish evidence of coincidence from conclusive proof of the elements the decision-maker considers material.
  limits: This reasoning is specific to the record’s failure to conclusively establish forced displacement and intent in this
    factual context. It does not establish that unlawfulness is necessary for deportation, or decide how a different evidentiary
    record should be assessed.
  library:
    domain: natsec-other
    family: CORPUS-NS-8bdc7318
    source: https://casebook.icrc.org/case-study/icty-prosecutor-v-gotovina-and-markac
