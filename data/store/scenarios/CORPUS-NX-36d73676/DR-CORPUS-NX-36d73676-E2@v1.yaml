case:
  id: DR-CORPUS-NX-36d73676-E2@v1
  title: Revising the Cambodia Supply Estimates
  status: draft
  setting: CIA headquarters, December 1970, national-level intelligence assessment concerning Communist deliveries to Cambodia
    for forces in South Vietnam.
  decider: CIA headquarters
  agent: CIA headquarters
  agent_role: decide
  situation: CIA had earlier estimates published in 1970. A substantial documentary record concerning supplies and materials
    furnished to the Communists with the cooperation of the Cambodian government was available for reassessment. The record
    comprised 12,000 pages and was assessed as virtually complete and authentic. It was regarded as the most conclusive available
    evidence of the critical importance of the Sihanoukville supply route. A December 1970 memorandum estimated that military
    deliveries from December 1966 through April 1969 totaled 21,600 tons, with figures believed accurate within 10 percent.
    CIA headquarters faced whether to retain its earlier estimates or revise the baseline for dissemination to national-level
    decisionmakers and theater commanders.
  question: What should CIA headquarters do with its earlier estimates when setting and disseminating its current baseline
    to national-level decisionmakers?
  options:
    O1:
      do: CIA headquarters retains the earlier estimates as its current baseline and forwards that baseline to national-level
        decisionmakers and theater commanders.
      move: act
      irreversible: false
    O2:
      do: CIA headquarters revises the earlier estimates into its current baseline and forwards that baseline to national-level
        decisionmakers and theater commanders.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: CIA had earlier estimates published in 1970.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The documentary record concerning supplies and materials furnished to the Communists with Cambodian government cooperation
      comprised 12,000 pages.
  - id: F3
    kind: intelligence
    status: assessed
    fact: CIA assessed the record as a virtually complete set of Cambodia's records on those supplies and materials.
  - id: F4
    kind: intelligence
    status: assessed
    fact: CIA assessed the circumstances surrounding the record as establishing its authenticity.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The record was regarded as the most conclusive available evidence of the critical importance of the Sihanoukville
      supply route.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A December 1970 intelligence memorandum estimated military deliveries at 21,600 tons from December 1966 through
      April 1969, and stated that the figures were approximate but believed accurate within 10 percent.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The 12,000-page record was assessed as virtually complete and authentic, giving CIA a substantially stronger evidentiary
      basis for reassessing its earlier estimates.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The record was regarded as the most conclusive available evidence of the Sihanoukville route's critical importance,
      supporting a revised baseline grounded in that evidence.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The memorandum supplied a quantified estimate and stated its accuracy was believed to be within 10 percent; the estimate
      supports using the new baseline, while its approximate nature calls for preserving that qualification.
  reasoning:
    read: 'This is an analytic reassessment, not a choice between two equally supported estimates: CIA had a large record
      it assessed as authentic and virtually complete, and regarded it as the most conclusive available evidence. The trap
      is treating earlier estimates as the default despite that stronger basis, or presenting the new quantitative estimate
      as more precise than CIA assessed it to be.'
    weighing: The assessed completeness and authenticity of the record, and its status as the most conclusive available evidence,
      support revising the baseline {C1} {C2}. The 21,600-ton estimate further supports using the revised assessment, but
      its stated approximate nature and accuracy within 10 percent should remain clear {C3}. The balance depends on the record
      retaining the stated reliability assessments.
    tradecraft: Use the documentary record as the basis for the revised baseline, preserve the stated confidence and approximation
      qualifications for the quantitative estimate, and distinguish the revised assessment from the earlier estimates in the
      dissemination.
    uncertainty: The figures are approximate, though believed accurate within 10 percent {F6}. The record is assessed as virtually
      complete and authentic; these are CIA assessments rather than a claim of absolute certainty {F3} {F4}.
    handoff: CIA headquarters should make the analytic reassessment and forward the resulting baseline to national-level decisionmakers
      and theater commanders, as the December 1970 memorandum did. The source identifies those recipients but no further approval
      or consultation requirement.
    tempting_wrong:
      option: O1
      pull: Retaining earlier estimates can seem cautious when a new estimate is approximate.
      why_wrong: That caution does not outweigh the assessed authenticity and near-completeness of the documentary record
        or its standing as the most conclusive available evidence; the appropriate caution is to disclose the estimate's limits,
        not to disregard the stronger basis.
    rejected:
      O1: CIA did not retain the earlier estimates as the current baseline because the documentary record provided the foundation
        for reevaluating them.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Further assessment materially undermined the record's authenticity or its near-completeness.
      then: O1
      why: The principal reason to replace the earlier baseline would be weakened if the documentary record no longer merited
        the reliability assessments on which the reassessment depended.
    would_not_change:
    - id: noflip1
      if: The revised delivery figures remain approximate but are still believed accurate within 10 percent.
      why: That stated limitation calls for communicating the qualification; by itself, it does not undo the stronger evidentiary
        basis for revising the baseline.
    watch_for:
    - id: watch1
      what: Whether subsequent assessment continues to support the record's authenticity and near-completeness.
      favors:
      - O2
      why: Those assessments underpin using the documentary record to revise the baseline.
  lesson: When a materially stronger record is assessed as authentic and nearly complete, update the analytic baseline rather
    than preserve earlier estimates by default. Communicate the reliability limits of the new estimate alongside the revision.
  limits: This reasoning applies to the stated analytic reassessment and dissemination decision. It does not establish how
    to resolve a case in which the new record is materially unreliable, nor does it supply legal or policy requirements beyond
    the source's account.
