case:
  id: DR-XFER-CORPUS-NX-2f40ddf1-E3-A@v1
  title: A Field Station's Covert-Action Role
  status: draft
  setting: Asteria, 2024, National Intelligence Service (a fictional agency), Operations Directorate.
  decider: The operations director
  agent: The operations director
  agent_role: decide
  situation: The Operations Directorate is deciding how much authority to give a field station over one part of an approved
    covert-action program. Host-government consent for the relevant program activities has remained uncertain for months,
    and the station was left out of program planning during that period. Program guidance sets three broad objectives and
    leaves the method to the station chief within headquarters' intent. The station has its own planning staff and resources.
    Headquarters would retain authority to approve plans and direct the station by exception. Applicable oversight rules include
    notification duties, and oversight bodies expect close headquarters control.
  question: What should the operations director do about the field station's planning and execution authority?
  options:
    O1:
      do: The Operations Directorate centralizes planning and execution for the station's part of the program under the program
        objectives, retaining authority over plans and direction by exception.
      move: act
      irreversible: false
    O2:
      do: The Operations Directorate limits the station chief's delegated planning and execution authority, retaining central
        review of plans and direction by exception.
      move: partial
      irreversible: false
      to: the station chief
    O3:
      do: The Operations Directorate delegates planning and execution for the station's part of the program to the station
        chief under broad objectives, retaining authority over plans and direction by exception.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Host-government consent for the relevant program activities has remained uncertain for several months.
  - id: F2
    kind: situation
    status: confirmed
    fact: The field station was left out of program planning while host-government consent was uncertain.
  - id: F3
    kind: situation
    status: confirmed
    fact: The approved program guidance assigns the station's part of the program three broad objectives.
  - id: F4
    kind: authority
    status: confirmed
    fact: The guidance leaves the method for pursuing those objectives to the station chief, within headquarters' stated intent.
  - id: F5
    kind: capability
    status: confirmed
    fact: The field station has staff assigned to planning its part of the program.
  - id: F6
    kind: capability
    status: confirmed
    fact: The field station has resources to carry out its assigned part of the program without routine operational assistance
      from headquarters.
  - id: F7
    kind: authority
    status: confirmed
    fact: Headquarters retains authority to approve the station's plans and to direct the station by exception.
  - id: F8
    kind: authority
    status: confirmed
    fact: Applicable covert-action oversight rules require notification to designated legislative overseers.
  - id: F9
    kind: situation
    status: confirmed
    fact: The designated oversight bodies expect close headquarters control of the program.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Host-government consent was uncertain and the station had not been integrated into program planning. The program
      nevertheless assigns it a broad task, a context in which delegated authority could let the station act within its assigned
      purpose.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The guidance specifies broad objectives but leaves the method to the station chief acting within headquarters' intent.
      That allocation supports delegation rather than central direction of execution.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The station has planning staff and resources to carry out its assigned work without routine headquarters assistance,
      supporting its ability to exercise delegated responsibility.
  - id: C4
    facts:
    - F4
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Delegation would not remove headquarters' authority to approve plans or direct the station by exception, and the
      station's discretion remains bounded by headquarters' intent. Notification duties and expectations of close headquarters
      control make it important that these retained controls remain meaningful.
  reasoning:
    read: 'The station''s role was initially uncertain because host-government consent was not assured, and it was consequently
      left out of program planning. The trap is to treat limited prior integration as a reason to centralize everything: the
      guidance instead assigns broad objectives while leaving the method to the station chief and preserving headquarters''
      plan approval and exception direction.'
    weighing: The balance favors O2. The broad objectives and the station's own staff and resources make delegated planning
      and execution workable, while headquarters' retained plan approval and exception direction preserve oversight and the
      ability to intervene. Notification duties and oversight expectations require close attention to the retained controls,
      but the stated arrangement preserves headquarters' authority. The balance depends on the station being able to perform
      independently and headquarters retaining its stated authority.
    tradecraft: State the delegated scope in terms of the assigned objectives and headquarters' intent, and make clear that
      headquarters retains plan approval and direction by exception. Record the delegation and any later exercise of retained
      authority, and ensure applicable notification and oversight obligations are addressed so accountability for direction
      remains clear.
    uncertainty: The stated circumstances establish the program arrangement and relevant considerations but do not explicitly
      compare centralization, limited delegation, and delegation as competing choices. The reasons for O2 therefore rest on
      the guidance, the station's capabilities, retained headquarters authority, and the bounded scope of delegation, rather
      than an express evaluation of every alternative.
    handoff: The operations director decides the allocation of authority. The station chief carries out the delegated work
      within headquarters' intent and its retained authority, with applicable oversight obligations remaining in force.
    tempting_wrong:
      option: O1
      pull: Central planning may seem preferable because the station had not been integrated into program planning and oversight
        bodies expect close headquarters control.
      why_wrong: The station's limited integration arose while host-government consent was uncertain, whereas the guidance
        provides broad objectives and the station has its own planning staff and resources. Headquarters also retains plan
        approval and exception direction, which preserve a meaningful control boundary.
    rejected:
      O1: Centralizing planning and execution was not chosen because the guidance leaves the method for achieving broad objectives
        to a capable station chief while headquarters retains authority over plans and direction by exception.
      O2: Limiting the station chief's authority was not chosen because the arrangement leaves the method of pursuing the
        objectives to the station chief and enables the station to act with its own staff and resources, subject to headquarters'
        retained authority.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The station lacked the planning staff or resources to carry out its assigned work without headquarters assistance.
      then: O2
      why: The basis for workable delegation includes the station's own planning staff and ability to perform without routine
        headquarters assistance; without those capabilities, more central review or limits would be warranted.
    - id: flip2
      if: Headquarters could not retain authority to approve the station's plans or direct it by exception.
      then: O1
      why: Without those retained controls, delegation would lack an important boundary and safeguard in this arrangement.
    would_not_change:
    - id: noflip1
      if: Host-government consent remained uncertain while the station still had its own staff and resources and headquarters
        retained its authority.
      why: Consent uncertainty and limited program-planning integration were part of the circumstances in which broad objectives
        were assigned and the station chief's discretion was specified.
    watch_for:
    - id: watch1
      what: Whether host-government consent for the relevant program activities is secured and remains in place.
      favors:
      - O3
      why: The relevant activities depend on that consent; if it is not secured, the scope for delegated activity should be
        limited pending authorization.
  lesson: Delegate execution of broad objectives when the subordinate station has the staff and resources to act, and headquarters
    can preserve meaningful approval authority and exception control. Uncertainty about a program's availability may explain
    limited prior integration, but it does not by itself require centralizing the method of execution. Delegation must remain
    consistent with applicable notification duties and oversight expectations.
  limits: This reasoning applies to the stated arrangement of broad objectives, an independently capable station, retained
    headquarters authority, and applicable oversight duties. It does not establish that delegation is appropriate when those
    capabilities or authority boundaries are absent, when required host-government consent is unavailable, or when oversight
    obligations cannot be met.
