case:
  id: DR-XFER-CORPUS-NX-2f40ddf1-E3-B@v1
  title: Delegating Authority for a Rapid Prototype
  status: draft
  setting: A U.S. defense acquisition program office during development of a counter-drone sensor prototype, with a partner
    nation considering co-development.
  decider: The program executive officer
  agent: The program executive officer
  agent_role: decide
  situation: A field office is responsible for a counter-drone sensor prototype, but a partner nation's co-development approval
    was uncertain during initial planning and the office was left out of the master plan. The office's charter sets three
    broad capability goals and leaves the method for pursuing them to the office director. The field office has its own engineering,
    test, and contracting staff. Its approved resources and delegated contracting authority support work within established
    limits. The program executive officer retains milestone approval and can direct changes by exception, while acquisition
    rules reserve certain decisions to the executive's level. The decision is how much planning and execution authority to
    place with the field office director.
  question: What should the program executive officer do about the field office director’s planning and execution authority?
  options:
    O1:
      do: The program executive officer limits the field office director’s delegated planning and execution authority, retaining
        central review of plans and authority to direct changes by exception.
      move: partial
      irreversible: false
      to: the field office director
    O2:
      do: The program executive officer delegates prototype planning and execution to the field office director under the
        capability goals, retaining milestone approval and authority to direct changes by exception.
      move: act
      irreversible: false
    O3:
      do: The program executive officer centralizes prototype planning and execution under the capability goals, retaining
        milestone approval and authority to direct changes by exception.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The partner nation's co-development approval was uncertain during the initial master-plan period, and final written
      concurrence is not yet recorded in the program file.
  - id: F2
    kind: situation
    status: confirmed
    fact: The field office was not substantially included in the master plan while the partner nation's approval status was
      uncertain.
  - id: F3
    kind: situation
    status: confirmed
    fact: The prototype charter assigns the field office a mission to advance a counter-drone sensor prototype.
  - id: F4
    kind: situation
    status: confirmed
    fact: 'The charter sets three broad capability goals: meet agreed performance thresholds, support interoperability with
      partner systems, and satisfy maintainability requirements.'
  - id: F5
    kind: capability
    status: confirmed
    fact: The field office has its own engineering, test, and contracting staff assigned to the prototype.
  - id: F6
    kind: capability
    status: confirmed
    fact: The office's approved resources and delegated contracting warrants support prototype planning and routine execution
      within their stated limits.
  - id: F7
    kind: authority
    status: confirmed
    fact: The program executive officer retains milestone approval and authority to direct changes by exception; acquisition
      rules reserve certain approvals to the executive's level.
  - id: F8
    kind: authority
    status: confirmed
    fact: The prototype charter states the capability goals, while leaving the method for pursuing them to the field office
      director within the program's approval and contracting boundaries.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Partner co-development approval was uncertain and the field office was not substantially integrated into the master
      plan. The charter nevertheless assigned it a broad prototype task, a context in which delegated authority could let
      the office act within its assigned purpose.
  - id: C2
    facts:
    - F4
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The charter specified three broad capability goals but left the method for pursuing them to the field office director,
      within the program's boundaries. That allocation supports delegation rather than central direction of execution.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The field office had its own engineering, test, and contracting staff, and its approved resources and warrants supported
      routine work within their limits, supporting its ability to exercise delegated responsibility.
  - id: C4
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Delegation did not remove the program executive officer's milestone approval or authority to direct changes by exception,
      and acquisition rules kept certain approvals at the executive level. The director's discretion remained bounded by the
      charter and those retained authorities.
  reasoning:
    read: 'The field office''s role in the master plan was initially uncertain because partner co-development approval was
      not settled, and it consequently had limited integration into planning. The trap is to treat limited prior integration
      as a reason to centralize everything: the charter instead set broad capability goals while the program executive officer
      retained milestone approval and exception authority.'
    weighing: The balance favors {O2}. The broad goals and the field office's own staff and approved resources made delegated
      planning and execution workable, while retained executive authority preserved oversight and the ability to intervene.
      The balance depends on the office being able to perform independently within its approved limits and on the executive
      retaining the stated authorities; the program executive officer empowered the field office director to effectively run
      the prototype.
    tradecraft: State the delegated scope in terms of the charter's capability goals and make clear that the program executive
      officer retains milestone approval, exception authority, and decisions reserved by acquisition rules. Record the delegation
      and any later exercise of retained authority so that accountability for direction remains clear.
    uncertainty: The stated circumstances establish the acquisition arrangement and relevant considerations but do not explicitly
      compare centralization, limited delegation, and delegation as competing choices. The reasons for O2 therefore rest on
      the charter, the field office's capabilities, retained authority, and the director's empowerment, rather than an express
      evaluation of every alternative.
    handoff: The program executive officer decides the allocation of authority. The field office director carries out the
      delegated work within the charter and the executive's retained authority.
    tempting_wrong:
      option: O3
      pull: Central planning may seem preferable because the field office had not been substantially integrated into the master
        plan.
      why_wrong: That limited integration arose while partner approval was uncertain, whereas the charter provided broad capability
        goals and the field office had its own staff and approved resources; the program executive officer also retained milestone
        approval and authority to direct changes by exception.
    rejected:
      O3: Centralizing planning and execution was not chosen because the charter left the method of pursuing broad capability
        goals to the capable field office director while the program executive officer retained authority.
      O1: Limiting the field office director’s authority was not chosen because the charter left the method of pursuing the
        goals to the director and the office had its own staff and approved resources.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The field office lacked the staff or approved resources and contracting authority to carry out its assigned prototype
        work without program-executive-office assistance.
      then: O1
      why: The basis for workable delegation includes the field office's own staff and ability to perform routine work within
        its approved limits; without those capabilities, more central review or limits would be warranted.
    - id: flip2
      if: The program executive officer could not retain milestone approval or authority to direct changes by exception.
      then: O3
      why: Without those retained controls, delegation would lack an important boundary and safeguard in this arrangement.
    would_not_change:
    - id: noflip1
      if: Partner co-development approval remained uncertain while the field office still had its own staff and approved resources
        and the program executive officer retained the stated authority.
      why: Approval uncertainty and limited integration into the master plan were part of the circumstances in which the charter
        assigned broad goals and empowered the field office director.
    watch_for:
    - id: watch1
      what: Whether the partner nation's written co-development approval is secured and remains in place.
      favors:
      - O3
      why: The planned work involving the partner depends on that approval; if it is not secured, the scope of delegated work
        should be limited pending authorization.
  lesson: Delegate execution of broad objectives when the subordinate office has the staff and resources to act within its
    approved limits, and the superior executive can preserve meaningful authority and exception control. Uncertainty about
    partner approval may explain limited prior integration, but it does not by itself require centralizing the method of execution.
  limits: This reasoning applies to the stated arrangement of broad capability goals, a field office with its own staff and
    approved resources, and retained executive authority. It does not establish that delegation is appropriate when those
    capabilities or authority boundaries are absent, or when required partner approval is unavailable.
