case:
  id: DR-XFER-CORPUS-NX-2f40ddf1-E3-B-flip1@v1
  title: Delegating Authority for a Rapid Prototype
  status: draft
  setting: A U.S. defense acquisition program office during development of a counter-drone sensor prototype, with a partner
    nation considering co-development.
  decider: The program executive officer
  agent: The program executive officer
  agent_role: decide
  situation: A field office is responsible for a counter-drone sensor prototype, but a partner nation's co-development approval
    was uncertain during initial planning and the office was left out of the master plan. The office's charter sets three
    broad capability goals and leaves the method for pursuing them to the office director. The field office lacks sufficient
    engineering, test, and contracting staff to carry out the prototype work independently. Its approved resources and delegated
    contracting authority are insufficient for that work without program-executive-office assistance. The program executive
    officer retains milestone approval and can direct changes by exception, while acquisition rules reserve certain decisions
    to the executive's level. The decision is how much planning and execution authority to place with the field office director.
  question: What should the program executive officer do about the field office director’s planning and execution authority?
  options:
    O1:
      do: The program executive officer limits the field office director’s delegated planning and execution authority, retaining
        central review of plans and authority to direct changes by exception.
      move: partial
      irreversible: false
      to: the field office director
    O2:
      do: The program executive officer delegates prototype planning and execution to the field office director under the
        capability goals, retaining milestone approval and authority to direct changes by exception.
      move: act
      irreversible: false
    O3:
      do: The program executive officer centralizes prototype planning and execution under the capability goals, retaining
        milestone approval and authority to direct changes by exception.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The partner nation's co-development approval was uncertain during the initial master-plan period, and final written
      concurrence is not yet recorded in the program file.
  - id: F2
    kind: situation
    status: confirmed
    fact: The field office was not substantially included in the master plan while the partner nation's approval status was
      uncertain.
  - id: F3
    kind: situation
    status: confirmed
    fact: The prototype charter assigns the field office a mission to advance a counter-drone sensor prototype.
  - id: F4
    kind: situation
    status: confirmed
    fact: 'The charter sets three broad capability goals: meet agreed performance thresholds, support interoperability with
      partner systems, and satisfy maintainability requirements.'
  - id: F5
    kind: capability
    status: confirmed
    fact: The field office does not have sufficient engineering, test, and contracting staff assigned to carry out the prototype
      work independently.
  - id: F6
    kind: capability
    status: confirmed
    fact: The office's approved resources and delegated contracting warrants are insufficient to support prototype planning
      and routine execution without program-executive-office assistance.
  - id: F7
    kind: authority
    status: confirmed
    fact: The program executive officer retains milestone approval and authority to direct changes by exception; acquisition
      rules reserve certain approvals to the executive's level.
  - id: F8
    kind: authority
    status: confirmed
    fact: The prototype charter states the capability goals, while leaving the method for pursuing them to the field office
      director within the program's approval and contracting boundaries.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Partner co-development approval was uncertain and the field office was not substantially integrated into the master
      plan. The charter nevertheless assigned it a broad prototype task, a context in which delegated authority could let
      the office act within its assigned purpose.
  - id: C2
    facts:
    - F4
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The charter specified three broad capability goals but left the method for pursuing them to the field office director,
      within the program's boundaries. That allocation supports delegation rather than central direction of execution.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The field office lacks sufficient staff, approved resources, and contracting authority to carry out the work independently.
      Limiting its delegated authority and retaining central review addresses that capacity gap while allowing the office
      to contribute within its capabilities.
  - id: C4
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Delegation did not remove the program executive officer's milestone approval or authority to direct changes by exception,
      and acquisition rules kept certain approvals at the executive level. The director's discretion remained bounded by the
      charter and those retained authorities.
  reasoning:
    read: The field office's role in the master plan was initially uncertain because partner co-development approval was not
      settled, and it consequently had limited integration into planning. The charter sets broad capability goals and leaves
      the method for pursuing them to the director, but the office lacks the staff and approved resources to carry out the
      work independently. The key distinction is between granting discretion over methods and delegating execution that the
      office cannot perform without assistance.
    weighing: The balance favors O1. The broad goals and the charter's allocation of discretion support some delegation, and
      the program executive officer retains milestone approval and exception authority. However, the field office lacks the
      staffing, resources, and contracting authority to execute the assigned work independently. Limiting its delegated planning
      and execution authority, with central review, addresses that gap without requiring full centralization. The balance
      would differ if the office could perform independently within its approved limits.
    tradecraft: Set the field office director's delegated scope in light of the office's actual capacity, and specify what
      planning or execution requires central review or assistance. Make clear that the program executive officer retains milestone
      approval, exception authority, and decisions reserved by acquisition rules. Record the delegation and any later exercise
      of retained authority so that accountability for direction remains clear.
    uncertainty: The stated circumstances establish the acquisition arrangement and relevant considerations but do not explicitly
      compare centralization, limited delegation, and delegation as competing choices. The reasons for O1 rest on the field
      office's capacity gap, the charter's allocation of discretion, and the executive's retained authorities, rather than
      an express evaluation of every alternative.
    handoff: The program executive officer sets limits on the field office director's planning and execution authority and
      retains central review where needed. The field office director carries out the work within the charter, available capacity,
      and the executive's retained authority.
    tempting_wrong:
      option: O2
      pull: The charter leaves the method for pursuing broad capability goals to the field office director, and the program
        executive officer retains oversight.
      why_wrong: Those provisions support some discretion, but the field office lacks sufficient staff, approved resources,
        and contracting authority to carry out the assigned work independently. Delegating full planning and execution would
        exceed its current capacity.
    rejected:
      O2: Delegating prototype planning and execution was not chosen because the field office lacks the staff and approved
        resources to perform the work independently; central review and limits are warranted.
      O3: Full centralization was not chosen because the charter leaves the method of pursuing broad capability goals to the
        field office director, and the capacity gap calls for limited authority and assistance rather than eliminating the
        director's role.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The field office had sufficient staff, approved resources, and contracting authority to carry out its assigned prototype
        work without program-executive-office assistance.
      then: O2
      why: With adequate capacity for independent work, the main reason for limiting the director's delegated planning and
        execution authority would no longer apply; the charter's broad goals and allocation of discretion would support delegation.
    would_not_change:
    - id: noflip1
      if: Partner co-development approval remained uncertain while the field office still had its own staff and approved resources
        and the program executive officer retained the stated authority.
      why: Approval uncertainty and limited integration into the master plan were part of the circumstances in which the charter
        assigned broad goals and empowered the field office director.
    watch_for:
    - id: watch1
      what: Whether the partner nation's written co-development approval is secured and remains in place.
      favors:
      - O3
      why: The planned work involving the partner depends on that approval; if it is not secured, the scope of delegated work
        should be limited pending authorization.
  lesson: Limit delegated execution when the subordinate office lacks the staff, resources, or contracting authority to carry
    out its assigned work independently. Preserve appropriate central review and assistance while respecting the charter's
    allocation of discretion and retaining the executive's approval and exception authorities. Uncertainty about partner approval
    may explain limited prior integration, but it does not by itself determine the appropriate level of delegation.
  limits: This reasoning applies to the stated arrangement of broad capability goals, a field office with insufficient capacity
    to perform independently, and retained executive authority. It does not establish that limited delegation is appropriate
    when the office has adequate capacity, or determine the appropriate scope when required partner approval is unavailable.
