case:
  id: DR-CORPUS-INC-U-S-RESPONSE-TO-THE-SEPTEMBER-11-ATTACKS-NS-e5e4b57e-E18@v1
  title: Response to the Embassy Bombings
  status: draft
  setting: White House, early hours of August 20, 1998; national-security decision
  decider: The President and principal advisers
  agent: The President and principal advisers
  agent_role: decide
  situation: After the embassy bombings, the President and principal advisers faced a decision about using force against terrorist
    targets. Intelligence assessed that terrorist leaders and several hundred others were expected to gather at a camp near
    Khowst to plan future attacks; the area was described as away from civilian population centers and overwhelmingly populated
    by jihadists. Intelligence also linked al Shifa, a pharmaceutical plant in Sudan, to production of a nerve-gas precursor,
    but the link between the plant and a terrorist leader was described as uncertain. A soil sample from near the plant had
    tested positive for a precursor chemical, while an NSC intelligence official said substantially better intelligence was
    needed before seriously considering action against the facility. A tannery in Sudan was believed to belong to a terrorist
    leader, but officials questioned whether striking it would significantly harm him and raised concern about harming uninvolved
    people.
  question: What should the President and principal advisers do about using force in response to the embassy bombings, including
    whether to strike al Shifa and exclude the tannery?
  options:
    O1:
      do: The President authorizes strikes against the Afghanistan camps, excluding al Shifa and the tannery.
      move: act
      irreversible: true
    O2:
      do: The President declines strikes against the Afghanistan camps and both Sudan facilities.
      move: act
      irreversible: false
    O3:
      do: The President authorizes strikes against the Afghanistan camps and al Shifa, excluding the tannery.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The embassy bombings prompted consideration of a forceful response.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Terrorist leaders were expected to gather at a camp near Khowst to plan future attacks, with several hundred people
      expected to attend.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The camp area was described as away from civilian population centers and overwhelmingly populated by jihadists.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Intelligence reports described al Shifa as manufacturing a nerve-gas precursor with financial support from a terrorist
      leader.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A soil sample from the vicinity of al Shifa tested positive for EMPTA, a precursor chemical for VX.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The link between al Shifa and the terrorist leader was described as uncertain, and substantially better intelligence
      was said to be needed before seriously considering action against the facility.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Sudanese tannery was believed to belong to a terrorist leader, and striking it was argued to have potential
      financial impact.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A terrorist leader had reportedly spoken of wanting an attack with at least 10,000 casualties, and senior officials
      were concerned about chemical and biological terrorism.
  - id: F9
    kind: situation
    status: assessed
    fact: The Attorney General expressed concern about attacking two Muslim countries at the same time and later described
      the premise as shifting.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    - O1
    weight: strong
    why: The expected gathering of terrorist leaders to plan future attacks gave the Afghanistan action a direct preventive
      and leadership-focused purpose; the area was described as away from civilian population centers and overwhelmingly populated
      by jihadists.
  - id: C2
    facts:
    - F4
    - F5
    - F8
    equity: civilian_life
    favors:
    - O3
    weight: strong
    why: Officials feared that a nerve-gas capability could enable mass casualties, and the intelligence linking al Shifa
      to a precursor chemical and a terrorist leader supplied a reason to act to reduce that risk.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O1
    - O2
    weight: strong
    why: The link between al Shifa and the terrorist leader was uncertain, and an NSC intelligence official said substantially
      better intelligence was needed before seriously considering action against the facility.
  - id: C4
    facts:
    - F7
    equity: third_party_harm
    favors:
    - O3
    - O1
    weight: strong
    why: The tannery might have imposed a financial cost, but officials questioned whether striking it would significantly
      harm the terrorist leader and saw no point in killing uninvolved people without such a benefit.
  - id: C5
    facts:
    - F9
    equity: escalation_control
    favors:
    - O1
    - O2
    weight: weak
    why: The Attorney General was concerned about using force against two Muslim countries at once and felt the premise for
      action was shifting.
  reasoning:
    read: This was a choice between acting on a specific expected gathering to prevent future attacks and adding a preventive
      action against a facility where the chemical-weapons concern was serious but the intelligence link was uncertain. The
      trap was treating the positive soil sample as proof of the plant's role or of the terrorist leader's connection; the
      sample was from the vicinity, and the link was expressly uncertain.
    weighing: The expected gathering and its described location supported action against the Afghanistan camps {C1}. The principal
      case for adding al Shifa was the feared consequence of a future nerve-gas attack, alongside the intelligence reporting
      and soil-sample result {C2}. Against that stood the uncertainty about the facility's connection and the call for substantially
      better intelligence {C3}, as well as the Attorney General's concern about acting against two Muslim countries {C5}.
      The advisers nevertheless accepted the risk of acting on the al Shifa assessment, while excluding the tannery because
      its expected benefit was too slight to justify harm to uninvolved people {C4}.
    tradecraft: Keep the distinction between the assessed mass-casualty threat, the soil result, and the uncertain facility-to-leader
      link explicit in the decision record. Record the reasons for including al Shifa, the intelligence caution, the Attorney
      General's concern, and the separate reason for excluding the tannery. This is decision-level documentation, not a direction
      about how to conduct an action.
    uncertainty: 'The al Shifa case remained uncertain: the soil result concerned the vicinity of the plant, the reported
      link to the terrorist leader was described as uncertain, and senior officials may have relied on the same underlying
      report. The gathering near Khowst was also an intelligence assessment, not a certainty that every named leader would
      be present.'
    handoff: The President decided with the principal advisers rather than alone. The intelligence caution and the Attorney
      General's concerns belonged in that deliberation; the source records that the principals ultimately agreed on the Afghanistan
      camps and al Shifa.
    tempting_wrong:
      option: O1
      pull: Exclude al Shifa because the facility-to-leader link was uncertain and an intelligence official said better intelligence
        was needed.
      why_wrong: That caution was substantial, but the advisers weighed it against the feared prospect of a mass-casualty
        nerve-gas attack and chose to include al Shifa despite the uncertainty.
    rejected:
      O1: It would have omitted al Shifa despite the reported precursor concern and the advisers' fear of a future mass-casualty
        chemical attack.
      O2: It would have declined action despite the assessed gathering of terrorist leaders planning future attacks and the
        additional chemical-terrorism concern.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The available assessment no longer supported a meaningful connection between al Shifa, nerve-gas production, and
        the terrorist leader.
      then: O1
      why: Without that connection, the uncertain intelligence would not support adding al Shifa to the response, while the
        Afghanistan case would remain.
    would_not_change:
    - id: noflip1
      if: The tannery were more firmly attributed to the terrorist leader, but the expected strike still would not significantly
        harm him.
      why: Attribution alone would not answer the stated objection that the benefit was too slight to justify harming uninvolved
        people.
    watch_for:
    - id: watch1
      what: Substantially better intelligence about al Shifa's activity and its connection to the terrorist leader.
      favors:
      - O3
      why: The NSC intelligence official identified better intelligence as necessary before seriously considering action;
        confirmation would strengthen the case for including the facility.
  lesson: When a severe prospective harm is plausible but the intelligence connecting a facility to that harm is uncertain,
    distinguish evidence of the threat from evidence of attribution and weigh both explicitly. Do not extend force to an additional
    target whose expected benefit is too small to justify harm to uninvolved people.
  limits: This reasoning applies to the stated 1998 assessment and does not establish a general legal rule for using force
    or a standard for intelligence sufficiency. A materially different threat, evidentiary record, or legal authority could
    change the balance.
