case:
  id: DR-CORPUS-NX-de44acb4-E2@v1
  title: Military Assistance Under Mexico’s National Strategy
  status: draft
  setting: Mexico; Federal Government and national institutions under the President’s direction
  decider: The Federal Government, acting through the Attorney General’s office
  agent: The Federal Government, acting through the Attorney General’s office
  agent_role: decide
  situation: The Federal Government is addressing a narco-trafficking threat and related violence directed at Mexico. Law
    enforcement and other civil authorities are normally responsible for addressing these problems. A national strategy sets
    rules and responsibilities for the national institutions involved, including the armed forces. The reported assessment
    is that the threat and violence exceed the capacity of law enforcement and other civil authorities. Civil agencies can
    develop their capacity through training and other activities, with the aim of eventually resuming their traditional roles.
  question: What should the Federal Government, acting through the Attorney General’s office, do about using military assistance
    under the national strategy?
  options:
    O1:
      do: The Federal Government authorizes military assistance under the national strategy.
      move: act
      irreversible: false
    O2:
      do: The Federal Government declines military assistance under the national strategy.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Federal Government acted under the direction of the President of the Mexican United States.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Federal Government, acting through the Attorney General’s office, established Mexico’s Integral Strategy for
      the Fight against Drug-Trafficking.
  - id: F3
    kind: authority
    status: confirmed
    fact: The national strategy specifies rules and responsibilities for the national institutions involved in combating drug
      trafficking, including the armed forces.
  - id: F4
    kind: situation
    status: confirmed
    fact: Law enforcement and other civil authorities are normally responsible for addressing the narco-trafficking threat
      and related violence.
  - id: F5
    kind: situation
    status: confirmed
    fact: The narco-trafficking threat and related violence are directed at Mexico.
  - id: F6
    kind: capability
    status: assessed
    fact: The military assessment was that the narco-trafficking threat and related violence had exceeded the capacity of
      law enforcement and other civil authorities.
  - id: F7
    kind: capability
    status: assessed
    fact: Civil agencies can develop their capacity through training and other activities and eventually resume their traditional
      roles.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The Federal Government established the national strategy under the President’s direction, and the strategy assigns
      rules and responsibilities to the institutions involved, including the armed forces. That provides a framework for military
      assistance rather than leaving the response outside the national strategy.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The assessment is that the threat and related violence directed at Mexico exceed the capacity of the civil authorities
      normally responsible. Military involvement addresses that capacity shortfall.
  - id: C3
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Civil authorities retain their traditional responsibility, while military assistance allows civil agencies to build
      capacity through training and other activities so they can eventually resume those roles. Assistance is thus a bridge,
      not a permanent replacement for civil authority.
  reasoning:
    read: 'This is a capacity-threshold decision within a national strategy: civil authorities normally address the threat,
      but the assessment is that the threat and violence have exceeded their capacity. The trap is treating the civil authorities’
      normal responsibility as a reason to leave them solely responsible even when they are assessed as unable to meet the
      challenge.'
    weighing: The national strategy provides the institutional framework {C1}, and the assessed capacity shortfall is the
      central reason for military assistance {C2}. The prospect that civil agencies can build capacity and eventually resume
      their roles makes assistance a bridge rather than a permanent transfer of responsibility {C3}. The balance depends on
      the stated assessment that civil capacity is exceeded and on the strategy’s allocation of responsibilities.
    tradecraft: Authorize assistance under the strategy’s assigned rules and responsibilities, and record the capacity assessment
      supporting the decision. Reassess as civil agencies develop capacity, with the aim of returning traditional roles to
      them when they can resume them.
    uncertainty: The source gives the military’s capacity assessment but no independent validation, measure of the shortfall,
      or timetable for civil agencies to regain capacity.
    handoff: The Federal Government, acting through the Attorney General’s office, should decide within the national strategy.
      Coordination with the civil authorities and armed forces is a practical way to keep the strategy’s assigned roles and
      the capacity-building objective aligned.
    tempting_wrong:
      option: O2
      pull: Civil authorities are normally responsible for addressing the threat and related violence.
      why_wrong: 'That normal allocation does not answer the reported capacity shortfall: the reason for military involvement
        is that the threat and violence exceed civil capacity.'
    rejected:
      O2: Declining assistance was not chosen because the assessed threat exceeded the capacity of the civil authorities normally
        responsible for addressing it.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Law enforcement and other civil authorities had sufficient capacity to address the threat and related violence.
      then: O2
      why: The justification for military assistance is that the threat and violence exceed civil capacity; without that shortfall,
        the rationale for assistance would no longer apply.
    would_not_change:
    - id: noflip1
      if: Civil authorities remain the institutions normally responsible for addressing the threat.
      why: That fact already coexists with the assessed capacity shortfall and does not, by itself, displace the reason for
        military assistance.
    watch_for:
    - id: watch1
      what: Whether civil agencies’ capacity develops enough for them to resume their traditional roles.
      favors:
      - O2
      why: Capacity-building and eventual resumption of civil roles are the intended trajectory, so progress may remove the
        stated basis for military assistance.
  lesson: When civil authorities are normally responsible but are assessed as unable to address a threat, military assistance
    may serve as a bridge under an established national strategy. Keep the decision tied to that capacity shortfall and the
    aim of restoring civil agencies to their traditional roles.
  limits: This reasoning concerns the stated capacity assessment and national strategy; it does not establish that military
    assistance is legally required or appropriate in every circumstance. It does not address operational methods or the details
    of other drug-trafficking activities.
