case:
  id: DR-CORPUS-NX-637b8179-E2@v1
  title: Forecasting the Government’s Response at Tiananmen
  status: draft
  setting: Tiananmen Square, Beijing, during the protests between April and June 1989; an individual observer interpreting
    the protests and government response.
  decider: The individual observer
  agent: The individual observer
  agent_role: decide
  situation: During the student protests at Tiananmen Square between April and June 1989, demonstrations and public displays
    called for democracy and freedom. Labor groups joined the demonstrations, and citizens donated blankets and food. Student
    leaders began a hunger strike to force dialogue, while the government seemed hesitant or unsure. The PLA surrounded the
    square, and citizens blocked its advance and urged troops to remain neutral; a curfew was disobeyed, martial law was ignored,
    and an earlier PLA move was repelled. The observer believed that Beijing’s population would intervene for the students
    and that soldiers would be reluctant to use force against them. The observer had no formal grounding in Chinese studies
    and had not been to China.
  question: What should the individual observer forecast about the government’s likely response to the Tiananmen Square protests,
    and should the observer issue that forecast, qualify it, or seek contextual advice first?
  options:
    O1:
      do: The observer asks China specialists for contextual advice on the situation before issuing a forecast.
      move: ask
      irreversible: false
      to: China specialists
    O2:
      do: The observer excludes a violent government response from the forecast and assesses dialogue and concessions as likely.
      move: act
      irreversible: false
    O3:
      do: The observer includes a violent government response in the forecast and assesses dialogue and concessions as uncertain.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Students rallied and camped around the statue of the People’s Heroes, with university banners and posters supporting
      democracy and freedom.
  - id: F2
    kind: situation
    status: confirmed
    fact: Labor groups joined the students, and citizens donated blankets and food.
  - id: F3
    kind: situation
    status: confirmed
    fact: Student leaders began a hunger strike to force dialogue between the students and the government.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The government seemed hesitant or unsure to the observer.
  - id: F5
    kind: situation
    status: confirmed
    fact: The PLA surrounded the square, and citizens blocked its advance and tried to persuade troops to remain neutral.
  - id: F6
    kind: situation
    status: confirmed
    fact: A curfew order was not obeyed, martial law was ignored, and an earlier PLA move on the square was repelled.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The observer assumed Beijing’s population of 10–12 million would intervene for the students and could overwhelm
      the PLA.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The observer assumed soldiers would be reluctant to fire on their own people, partly because soldiers and students
      were predominantly Han and the soldiers occupied a lower social rung.
  - id: F9
    kind: capability
    status: confirmed
    fact: At the time, the observer had no formal grounding in Chinese studies and had not been to China.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The demonstrations, donations, and hunger strike appeared to indicate broad public support and pressure for dialogue.
      The observer later recognized that this appearance exaggerated support and misunderstood the labor groups’ aims.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The government’s apparent hesitation, the ignored orders, and the repelled PLA move led the observer to infer a stalemate
      and expect dialogue and concessions. The observer later judged this interpretation mistaken.
  - id: C3
    facts:
    - F7
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: The observer expected citizens to intervene and soldiers to hesitate to fire on students, supporting a forecast that
      violence would not occur. In retrospect, these expectations rested on assumptions about social roles and shared identity
      that proved wrong.
  - id: C4
    facts:
    - F9
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: strong
    why: The observer lacked formal grounding in Chinese studies and had not been to China, and later said that missing cultural
      context led to discounting evidence against compromise and to imagining violence away. That limitation weighs against
      excluding violence from a forecast and supports seeking contextual advice or expressing uncertainty.
  - id: C5
    facts:
    - F2
    - F5
    - F6
    - F9
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: strong
    why: The observer later concluded that apparent popular support had been exaggerated, that the protests represented a
      direct challenge to political authority in China, and that the cultural context made violent resolution possible. Those
      retrospective findings undermine the original confident forecast.
  reasoning:
    read: At the time, the observer read apparent demonstrations of support, government hesitation, and resistance to the
      PLA as evidence of a stalemate likely to produce dialogue. The trap was treating Chinese students’ social role, public
      reaction, and soldiers’ likely behavior as if they could be inferred from the observer’s expectations and experience
      in the United States.
    weighing: 'The contemporaneous reasons for {O2} were the apparent groundswell, the government’s seeming hesitation, and
      the belief that citizens and soldiers would prevent force. In retrospect, the observer judged those beliefs wishful
      and ethnocentric: support was relatively slight, labor groups had different aims, and the observer lacked cultural context
      and discounted contrary data. The observer nevertheless made {O2} as the forecast at the time; the later assessment
      weighs against treating that forecast as sound.'
    tradecraft: A careful forecast should distinguish observed events from assumptions about public support and soldiers’
      intentions, make uncertainty explicit, and record the basis and limits of each inference. Seeking contextual advice
      before issuing a confident forecast is a reasonable safeguard given the observer’s admitted lack of relevant background.
    uncertainty: The visible events appeared to support a stalemate, while the observer lacked cultural context needed to
      assess the possibility of a violent resolution. The observer later judged the forecast mistaken, but did not establish
      what precise forecast a better-informed observer would have made at that moment.
    handoff: The observer could seek advice from China specialists because the observer identified missing contextual knowledge
      as a cause of the analytic failure; no specific adviser or formal referral was named.
    tempting_wrong:
      option: O2
      pull: The visible demonstrations, apparent government hesitation, and citizens’ obstruction of the PLA seemed to make
        dialogue and concessions likely.
      why_wrong: The observer later judged that apparent popular support was exaggerated, the protest was a culturally specific
        challenge to political authority, and the assumption that violence would not occur led to discounting contrary evidence.
    rejected:
      O1: The observer did not seek contextual advice before making the forecast, although the observer later identified the
        absence of Chinese-studies grounding and contextual knowledge as a cause of error.
      O3: The observer did not include a violent response as a live possibility, despite later concluding that the observer
        had wrongly discounted that possibility.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The observer had acquired contextual information sufficient to understand the protest as a direct challenge to political
        authority and to assess the possibility of a violent resolution.
      then: O3
      why: The observer later said missing contextual information led to discounting evidence that contradicted compromise
        and to treating violence as inconceivable.
    - id: flip2
      if: Reliable contextual advice showed that the apparent public groundswell or the assumptions about citizens and soldiers
        were not well supported.
      then: O1
      why: The observer later concluded that support had been exaggerated and that assumptions about the likely response were
        ethnocentric; consulting specialists before forecasting could address that gap.
    would_not_change:
    - id: noflip1
      if: The visible demonstrations, donations, hunger strike, and apparent government hesitation remained the only basis
        for the forecast.
      why: Those observations explain the original forecast, but the observer later judged that they did not establish broad
        support or make violence unlikely.
    watch_for:
    - id: watch1
      what: Whether apparent support came from groups backing the students’ demands or from groups with different grievances.
      favors:
      - O1
      - O3
      why: The observer later found that labor groups had joined to protest corruption and job instability, not to support
        the students’ demands.
    - id: watch2
      what: Whether the protest was understood locally as a challenge to political authority and social order rather than
        as a familiar call for reform.
      favors:
      - O1
      - O3
      why: The observer missed this cultural context and therefore failed to treat violence as a real possibility.
  lesson: Do not infer broad support, likely compromise, or restraint from visible participation alone; test what different
    groups are supporting and how the protest is understood in its own context. When unfamiliar cultural assumptions shape
    a forecast, seek contextual knowledge and preserve uncertainty rather than excluding an adverse outcome.
  limits: This scenario concerns an individual observer’s analytic forecast, not an official intelligence estimate or a decision
    by Chinese authorities. The observer’s retrospective account diagnoses the error but does not specify a single alternative
    forecast that would have been correct in real time.
