case:
  id: DR-XFER-CORPUS-INC-CUBAN-MISSILE-CRISIS-NX-3779bf8d-E8-B-flip1@v1
  title: Counterspace Shipments to a Client Spaceport
  status: draft
  setting: United States, Western Hemisphere client-state crisis, presidential national-security meeting
  decider: The President
  agent: The President
  agent_role: decide
  situation: The President faced a choice among restricting shipments of counterspace-system components to a client state's
    spaceport, striking the staffed ground station, and undertaking a broader military campaign. Advisers assessed that the
    rival's harder-line approach was gaining influence and that there was no prospect of conditions improving. Credible new
    information established that the immediate threat could not be contained by the components quarantine and that delay would
    make military action materially more dangerous to American lives. Any military action risked prompting the rival to use
    the system against U.S. satellites, retaliation elsewhere, and allied blame; doing nothing was also viewed as a serious
    risk. The proposed components restriction would initially apply to counterspace-system components rather than ordinary
    commercial space goods, but its legality without allied backing was questioned. Participants differed over whether delay
    or a components restriction was preferable to direct military action, and the President considered an attack on a station
    staffed by the rival's technicians more provocative than a confrontation with a rival vessel.
  question: What should the President do about choosing among a components quarantine, a strike on the ground station, and
    a broad military campaign?
  options:
    O1:
      do: The President prohibits a components quarantine, orders a strike on the ground station, and declines a broad military
        campaign.
      move: act
      irreversible: true
    O2:
      do: The President imposes a quarantine on counterspace-system component shipments to the client state's spaceport and
        declines a strike on the ground station and a broad military campaign.
      move: act
      irreversible: false
    O3:
      do: The President prohibits a components quarantine, orders a broad military campaign against the client state, and
        declines a strike on the ground station.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Secretary assessed that a harder-line approach was gaining influence in the rival state and that there was no
      prospect for improvement.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The President assessed that military action might lead the rival to use the counterspace system against U.S. satellites
      and could prompt retaliation elsewhere, with allied blame falling on the United States.
  - id: F3
    kind: situation
    status: assessed
    fact: The President considered doing nothing a serious mistake and believed that every available course involved risk.
  - id: F4
    kind: situation
    status: confirmed
    fact: The proposed components quarantine would restrict shipments of counterspace-system components to the spaceport and
      initially would not extend to ordinary commercial space goods.
  - id: F5
    kind: situation
    status: assessed
    fact: The President judged that resorting to active military action would involve a broad campaign against the client
      state.
  - id: F6
    kind: situation
    status: assessed
    fact: A senator pressed for stronger action without warning, arguing that delay would make military action more difficult
      and cost more American lives.
  - id: F7
    kind: situation
    status: assessed
    fact: Another senator considered the components quarantine the worst alternative and favored a strike or broad campaign
      instead.
  - id: F8
    kind: authority
    status: assessed
    fact: The President said the components quarantine probably would breach trade commitments without allied support.
  - id: F9
    kind: situation
    status: assessed
    fact: The President considered an attack on a ground station known to be staffed by rival-state technicians more provocative
      than a confrontation with a rival vessel.
  - id: F10
    kind: intelligence
    status: assessed
    fact: Credible new information established that the immediate threat could not be contained by the components quarantine
      and that delay would make military action materially more dangerous to American lives.
  considerations:
  - id: C1
    facts:
    - F2
    - F9
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The President assessed that military action could lead the rival to use the system against U.S. satellites and to
      retaliate elsewhere, with allied blame falling on the United States. An attack on a station staffed by rival-state technicians
      was considered more provocative than a confrontation with a rival vessel, supporting the components quarantine over
      a strike or broad campaign.
  - id: C2
    facts:
    - F1
    - F3
    - F10
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Secretary saw no prospect for conditions to improve, and the President considered doing nothing a serious mistake.
      Credible information now established that the components quarantine could not contain the immediate threat and that
      delay would materially increase danger to American lives, making the quarantine inadequate and favoring prompt action.
  - id: C3
    facts:
    - F4
    - F8
    equity: lawful_authority
    favors: []
    weight: weak
    why: The proposed quarantine was initially limited to counterspace-system components, but the President acknowledged it
      probably would breach trade commitments without allied support and said the United States would proceed anyway. This
      weighs against treating the quarantine as legally settled, though the record does not establish that either military
      alternative was legally preferable.
  - id: C4
    facts:
    - F6
    - F10
    equity: tempo
    favors:
    - O1
    weight: strong
    why: A senator argued that delay would make military action harder and cost more American lives. Credible new information
      corroborated that delay would materially increase danger to American lives, strengthening the case for prompt military
      action. This supports a strike rather than a broad campaign, while the escalation risks remain relevant.
  reasoning:
    read: 'The choice was not between a risk-free components quarantine and risky force: the President saw risk in every course,
      including doing nothing. The components quarantine carried a serious trade-commitment concern, and military action risked
      escalation. But credible new information established that the quarantine could not contain the immediate threat and
      that delay would make military action materially more dangerous to American lives.'
    weighing: The balance now favors O1. The new information undermines the quarantine's ability to address the immediate
      threat, while confirming that delay would materially increase danger to American lives. That gives decisive weight to
      prompt action and the senator's argument for avoiding delay. The President's concerns about use of the system against
      U.S. satellites, retaliation elsewhere, allied blame, and the provocative nature of attacking a station staffed by rival-state
      technicians remain substantial counterweights. They favor restraint, but do not outweigh the established inadequacy
      of the quarantine and the increased danger of delay. O1 is favored over O3 because the record does not establish a need
      for a broad campaign.
    tradecraft: State the choice, the acknowledged trade-commitment uncertainty, and the comparative risks of retaliation
      and allied consequences clearly. Keep the decision under presidential authority, seek the relevant legal and allied
      views, and revisit the balance if the assessed threat or escalation risks materially change; do not treat the decision
      as a finding that the quarantine complies with trade commitments without allied support.
    uncertainty: The President said the United States did not know how the rival would react, and the assessment of the rival's
      intentions included uncertainty. The likelihood of use against U.S. satellites, retaliation elsewhere, and allied responses
      were risks, not certainties; the legality of proceeding without allied support was also expressly questioned. The new
      information established that the quarantine could not contain the immediate threat and that delay would materially increase
      danger to American lives.
    handoff: The President makes the choice, informed by administration advisers and relevant legal advice; the source also
      records that major allies were to be informed and that allied support bore on the trade-commitment concern.
    tempting_wrong:
      option: O3
      pull: The senator's argument for stronger action without warning, reinforced by the new information about delay, could
        make a broad campaign seem necessary to avoid additional American casualties.
      why_wrong: The new information supports prompt action, but does not establish that a broad campaign is necessary. O1
        addresses the case for prompt military action without choosing the broader campaign, while the escalation risks of
        military action remain substantial.
    rejected:
      O2: The President should not rely on the components quarantine because credible information established that it could
        not contain the immediate threat and that delay would materially increase danger to American lives.
      O3: The President should not choose a broad campaign because the new information establishes the need for prompt action,
        not the need for a broad campaign; the risks of escalation and retaliation remain.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible new information did not establish both that the immediate threat could not be contained by the components
        quarantine and that delay would make military action materially more dangerous to American lives.
      then: O2
      why: Without the condition's findings, the original balance favoring the components quarantine over prompt military
        action would apply, given the risks of escalation and the concern about striking a station staffed by rival-state
        technicians.
    would_not_change:
    - id: noflip1
      if: Allies did not support the components quarantine.
      why: The President said the quarantine probably would breach trade commitments without allied support but indicated
        the United States would proceed anyway.
    - id: noflip2
      if: The choice continued to involve substantial risks in every available course.
      why: The President expressly recognized that every course involved risk; that recognition does not overcome the established
        inadequacy of the quarantine and the increased danger of delay.
    watch_for:
    - id: watch1
      what: Evidence that the rival is intensifying the situation, that use of the system against U.S. satellites is becoming
        more likely, or that retaliation elsewhere is becoming more likely.
      favors:
      - O1
      - O3
      why: Such developments could change the comparative risks and require the President to reassess whether prompt military
        action remains warranted; they do not by themselves establish that a broad campaign is preferable.
  lesson: When every available course carries risk, compare the likely escalation and allied consequences of each option rather
    than treating urgency as sufficient reason for immediate force. If credible information establishes that a less escalatory
    option cannot contain the threat and that delay materially increases danger to American lives, that may shift the balance
    toward prompt, limited action without establishing a case for a broader campaign. Any serious trade-commitment objection
    must still be stated and weighed rather than assumed away.
  limits: This reasoning reflects the President's assessments in this meeting, including uncertainty about the rival's intentions
    and the questioned legality of the components quarantine without allied support. It does not establish a general legal
    rule for components quarantines or determine what later developments would warrant military action.
