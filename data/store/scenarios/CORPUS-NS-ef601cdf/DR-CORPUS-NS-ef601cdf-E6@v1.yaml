      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The U.S. Court of Appeals for the Armed Forces concluded that, given some evidence supporting the servicemember’s account,
  a self-defense instruction was necessary so the court-martial members could decide what actually transpired in the culvert.
