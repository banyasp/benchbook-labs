case:
  id: DR-CORPUS-NS-ef601cdf-E2@v1
  title: A Contested Use-of-Force Decision
  status: draft
  setting: At a culvert during military questioning; the exact time and place are unspecified.
  decider: The platoon leader
  agent: The platoon leader
  agent_role: decide
  situation: The platoon leader was questioning a person for information. The person was told that this was his last chance
    to provide information or he would die. The person gave an Arabic response that the platoon leader said differed from
    earlier responses, and the platoon leader looked to an interpreter for its meaning. The platoon leader testified that
    he perceived an immediate threat and feared for his safety. The interpreter testified that events happened quickly and
    that he could not see exactly what happened immediately before the shots or know what caused them. A second witness testified
    that he initially could not see inside the culvert.
  question: What should the platoon leader do when he perceives an immediate threat during questioning and the available accounts
    of what happened immediately beforehand are incomplete?
  options:
    O1:
      do: The platoon leader withholds lethal force from the person being questioned.
      move: act
      irreversible: false
    O2:
      do: The platoon leader uses lethal force against the person being questioned.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The person was being questioned for information.
  - id: F2
    kind: situation
    status: assessed
    fact: The platoon leader testified that he told the person this was his last chance to provide information or die.
  - id: F3
    kind: situation
    status: assessed
    fact: The person gave an Arabic response that the platoon leader said differed from earlier responses.
  - id: F4
    kind: situation
    status: assessed
    fact: The platoon leader looked to the interpreter for the meaning of the response.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The platoon leader testified that he perceived an immediate threat and feared for his safety.
  - id: F6
    kind: situation
    status: assessed
    fact: The interpreter testified that events happened quickly and that he could not see exactly what happened immediately
      before the shots or know what caused them.
  - id: F7
    kind: situation
    status: assessed
    fact: A second witness testified that he initially could not see inside the culvert.
  considerations:
  - id: C1
    facts:
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The platoon leader testified that he perceived an immediate threat and feared for his safety. That is his stated
      justification for using lethal force.
  - id: C2
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The interpreter could not see exactly what happened before the shots or identify their cause, and the second witness
      initially could not see inside the culvert. These limits leave the immediate trigger unresolved; they do not establish
      that the claimed threat did not occur.
  - id: C3
    facts:
    - F1
    - F2
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The person was being questioned and had been told he would die if he did not provide information. That coercive context
      weighs toward restraint, but the platoon leader's account presents a separate, later fear for his safety.
  - id: C4
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The different Arabic response led the platoon leader to look to the interpreter for its meaning. The response and
      need for interpretation do not, by themselves, establish an immediate threat.
  reasoning:
    read: This was questioning under a death ultimatum, followed by an Arabic response the platoon leader said differed from
      earlier answers. He testified that he perceived an immediate threat and feared for his safety. The trap is treating
      that claimed perception as independently established—or treating witnesses' inability to see the crucial moments as
      proof that no threat occurred.
    weighing: The platoon leader's stated fear supports {O2}; the interpreter's and second witness's limited views leave the
      immediate events unresolved, while the coercive questioning context weighs toward restraint. The balance follows the
      platoon leader's stated account of an immediate threat, but remains contested because the other testimony does not establish
      what happened immediately beforehand.
    tradecraft: As a decision practice, distinguish observed conduct from interpretation, state the immediate safety basis
      for a use-of-force decision, and preserve the limits of what witnesses could observe in the record. Do not treat a response
      that needs interpretation, by itself, as proof of a threat.
    uncertainty: The interpreter testified that events happened quickly and that he could not see exactly what happened before
      the shots or know what caused them. The second witness initially could not see inside the culvert. The available accounts
      therefore do not independently resolve the immediate trigger.
    handoff: The platoon leader is the identified decision-maker; the source does not identify a consulted authority. As a
      decision practice, an immediate threat assessment should not be represented as a reviewed or corroborated finding when
      it was not, and the basis should be reported through the appropriate chain afterward.
    tempting_wrong:
      option: O1
      pull: The accounts leave the moments before the shots uncertain, and lethal force is irreversible.
      why_wrong: On the platoon leader's stated account, he perceived an immediate threat and feared for his safety; the witnesses'
        limited views do not disprove that account.
    rejected:
      O1: It was not chosen because the platoon leader testified that he perceived an immediate threat and feared for his
        safety.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that there was no immediate threat to the platoon leader.
      then: O1
      why: That would remove the stated safety basis for the lethal-force decision.
    would_not_change:
    - id: noflip1
      if: The Arabic response was shown only to differ from earlier responses, without further evidence of an immediate threat.
      why: A different response prompted interpretation but does not, by itself, establish a threat.
    watch_for:
    - id: watch1
      what: Reliable evidence clarifying what happened immediately before the shots.
      favors:
      - O1
      - O2
      why: The accounts leave the immediate trigger unresolved; evidence confirming or refuting the claimed threat could change
        the assessment.
  lesson: A claimed immediate threat can support a use-of-force decision, but it should not be mistaken for an independently
    established fact when the available accounts leave the crucial moments unresolved. A response that differs from earlier
    answers is not, on its own, proof of danger.
  limits: This reasoning addresses only the disputed account and stated rationale in this questioning episode. It does not
    establish a general legal standard for using lethal force or resolve what happened immediately before the shots.
