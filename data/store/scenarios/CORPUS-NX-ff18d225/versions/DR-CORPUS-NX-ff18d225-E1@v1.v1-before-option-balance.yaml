case:
  id: DR-CORPUS-NX-ff18d225-E1@v1
  title: Attributing Responsibility Amid Incomplete Reporting
  status: draft
  setting: Zanzibar during the revolution; early analyses by the American intelligence communities
  decider: American intelligence analysts
  agent: American intelligence analysts
  agent_role: decide
  situation: During the crisis, the analysts had little time to research the situation or check the assumptions behind the
    reporting. Information available to them included accounts grouping political figures and a revolutionary organizer as
    collaborators regardless of nominal party affiliation. Other accounts connected the Umma Party to revolt planning and
    placed its leader among the central political figures. The party leader was known for criticism of the West, had Chinese
    Communist contacts, and had recently returned from China amid suspicions of revolutionary training. Police had seized
    many documents from the party headquarters, and there were reports of an arms supply entering Zanzibar over a period of
    months. The available accounts also linked the organizer's role to the party leader's plan and apparent approval.
  question: What should the American intelligence analysts do in attributing responsibility for the revolution on the information
    then available?
  options:
    O1:
      do: The analysts include the Umma Party and its leader in their attribution of primary responsibility.
      move: act
      irreversible: false
    O2:
      do: The analysts request corroboration from other intelligence offices before making an attribution of responsibility.
      move: ask
      irreversible: false
      to: other intelligence offices
    O3:
      do: The analysts exclude the Umma Party and its leader from their attribution of primary responsibility.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analysts had little time during the crisis to research the situation or check reporting assumptions.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Reports described political figures and a revolutionary organizer as having worked together in planning the revolt
      without regard to nominal party affiliation.
  - id: F3
    kind: intelligence
    status: assessed
    fact: An intelligence conclusion attributed the revolution to the Umma Party, led by a political figure and aided by a
      revolutionary organizer.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A government memo described the party leader's followers as the prime movers but said they did not represent most
      Africans.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A CIA memo assessed that the Umma Party had plotted a revolt and that its leader was most responsible.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The party leader was known to have Chinese Communist contacts and had recently returned from China, where he was
      suspected of receiving revolutionary training.
  - id: F7
    kind: situation
    status: confirmed
    fact: Police seized a large quantity of documents from the Umma Party headquarters.
  - id: F8
    kind: intelligence
    status: assessed
    fact: There were reports that the Umma Party had brought arms and ammunition into Zanzibar over a three-month period at
      the end of the previous year.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The available assessment linked the revolutionary organizer to the party leader's plan and apparent approval.
  considerations:
  - id: C1
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: 'The account grouping figures across nominal party lines was a misleading premise: later analysis found little basis
      for a close working relationship between important figures it had lumped together. That cautions against treating the
      reported collaboration as established.'
  - id: C2
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The leader's known criticism of the West, Chinese Communist contacts, and recent return from China amid suspicions
      of revolutionary training made the attribution consistent with what analysts knew, though these facts alone did not
      establish responsibility.
  - id: C3
    facts:
    - F3
    - F5
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Contemporaneous assessments attributed revolt planning to the Umma Party and placed its leader at the center; reports
      of arms brought into Zanzibar added support for that assessment.
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The available assessment connected the organizer's role to the party leader's plan and apparent approval, supporting
      attribution to the leader as well as to the party.
  reasoning:
    read: 'The analysts faced time pressure and reporting that had blurred political divisions. That cross-party grouping
      was not a reliable premise: later analysis found little basis for close cooperation between some of the figures it joined
      together. But the attribution of responsibility to the Umma Party and its leader was considered reasonable on the other
      information then available.'
    weighing: The unreliable grouping counsels caution {C1}, while the party-planning assessments and arms reports support
      including the Umma Party and its leader {C3}. The leader's known profile and the assessed link between his plan and
      the organizer's role add support, but are not conclusive on their own {C2} {C4}. The balance therefore favors {O1},
      while depending on the party-planning and arms-related reporting rather than the assumption that all named figures acted
      together.
    tradecraft: State the attribution at the level supported by the evidence, distinguish assessments from established facts,
      and record that the cross-party collaboration premise was uncertain. Revisit the judgment if later reporting independently
      corroborates or undermines the party-planning attribution.
    uncertainty: The analysts had little time to test reporting assumptions, and the initial grouping of political figures
      proved misleading. The conclusion was reasonable on information then available, not certainty that every reported relationship
      or role was accurate.
    handoff: The analysts make the contemporaneous attribution on the information available; no basis is given for making
      corroboration from another office a prerequisite. Further review is appropriate if new reporting can test the party-planning
      account.
    tempting_wrong:
      option: O2
      pull: The time pressure and the later-recognized error in grouping political figures make waiting for corroboration
        seem prudent.
      why_wrong: Those concerns warrant recording uncertainty, but the available party-planning, arms, and leadership evidence
        was considered sufficient for the contemporaneous attribution.
    rejected:
      O2: The available evidence was treated as sufficient for an attribution at the time, rather than requiring corroboration
        before naming the Umma Party and its leader.
      O3: Excluding the party and its leader would disregard the contemporaneous assessments and supporting indicators considered
        reasonable grounds for attribution.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Further reporting showed that the party-planning and arms accounts did not connect the Umma Party or its leader
        to the revolt, leaving the attribution unsupported.
      then: O2
      why: Without the principal supporting indicators, the analysts should seek corroboration rather than retain the primary-responsibility
        attribution.
    would_not_change:
    - id: noflip1
      if: The analysts had more time but the same party-planning assessments and arms reports remained available.
      why: More time would permit better checking, but would not by itself erase the supporting evidence on which the attribution
        was considered reasonable.
    watch_for:
    - id: watch1
      what: Whether later reporting independently supports the claimed cooperation across party lines, rather than repeating
        the initial grouping of figures.
      favors:
      - O2
      why: The initial grouping was misleading, and there was little basis for a close working relationship between some of
        the figures it grouped together.
  lesson: Under crisis conditions, distinguish an unreliable assumption in reporting from the other evidence bearing on responsibility.
    Attribute responsibility when the available evidence supports it, while making uncertainty and the basis for the judgment
    clear.
  limits: This judgment concerns a contemporaneous intelligence attribution, not an operational account of the revolution
    or a legal finding of individual culpability. It does not establish that every reported relationship or allegation was
    accurate.
