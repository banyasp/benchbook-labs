case:
  id: DR-CORPUS-NX-89822c41-E4@v1
  title: Confidentiality and Budget Scrutiny
  status: draft
  setting: Secure basement room of the Capitol; annual budget review; House Appropriations subcommittee.
  decider: The Agency
  agent: The Agency
  agent_role: decide
  situation: At the annual budget review, the Agency faced a choice about how much budget detail to provide to the House Appropriations
    subcommittee. The subcommittee met privately in a secure basement room of the Capitol. It usually had five members, including
    the senior Democrat and senior Republican on Appropriations. Its chair was interested in keeping the Agency's affairs
    private. Money bills originated in the House under the Constitution, making the House an important place for the Agency
    to make its case. The choice was whether to disclose detailed budget information, withhold it, or provide a more limited
    account.
  question: What should the Agency do about the level and manner of budget disclosure to the House Appropriations subcommittee?
  options:
    O1:
      do: The Agency should withhold each budget dollar from the small bipartisan House Appropriations subcommittee in private.
      move: act
      irreversible: false
    O2:
      do: The Agency should disclose each budget dollar to the small bipartisan House Appropriations subcommittee in private.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: By the time the Agency's affairs were thoroughly understood, a new chair had taken over House Appropriations.
  - id: F2
    kind: situation
    status: assessed
    fact: The chair was interested in keeping the Agency's affairs private.
  - id: F3
    kind: situation
    status: assessed
    fact: The subcommittee met secretly in a secure basement room of the Capitol.
  - id: F4
    kind: situation
    status: assessed
    fact: The subcommittee usually had five members, three Democrats and two Republicans, including the senior Democrat and
      senior Republican on Appropriations.
  - id: F5
    kind: situation
    status: assessed
    fact: The Agency presented its budget to the subcommittee in detail, dollar for dollar, every year.
  - id: F6
    kind: situation
    status: assessed
    fact: Nothing was held back from the subcommittee.
  - id: F7
    kind: situation
    status: assessed
    fact: The subcommittee received information about the purpose and destination of expenditures and their general categories,
      including covert action, secret intelligence, counter-intelligence, airplanes, and satellites.
  - id: F8
    kind: authority
    status: assessed
    fact: Money bills originated in the House under the Constitution, making the House the place for the Agency to make its
      case.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: classification_integrity
    favors:
    - O2
    weight: strong
    why: The chair's preference for privacy, the secret secure meeting, and the small bipartisan membership allowed detailed
      review in a controlled setting rather than public disclosure.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: oversight_candor
    favors:
    - O2
    weight: strong
    why: The Agency presented the budget dollar for dollar and held nothing back, including the purposes, destinations, and
      general categories of expenditures; this is the account the Agency described as an unexceptionable record.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Because money bills originated in the House, the Agency regarded the House as the place to make its case; this supports
      full engagement with the House Appropriations subcommittee, without itself establishing a legal disclosure requirement.
  reasoning:
    read: 'The choice is not simply secrecy versus disclosure: the Agency could preserve privacy through a small, private
      bipartisan review while still giving the House a full account. The trap is to treat confidentiality as a reason to withhold
      information even though the review setting was designed to keep the Agency''s affairs private.'
    weighing: The controlled setting supports disclosure in private {C1}, while the dollar-for-dollar account supports candid
      legislative scrutiny {C2}. The House's role in originating money bills supplied the practical reason to make the case
      there {C3}. Together these considerations favor {O2}; the balance depends on the review remaining private and the Agency
      providing the complete account described, not on a broader claim about what the law requires.
    tradecraft: Present the complete budget accounting to the subcommittee in its private review, including each dollar and
      its purpose and destination, and preserve an accurate record of what was provided.
    uncertainty: The account endorses the Agency's practice but does not set out a legal test for disclosure or address what
      to do if the private review setting cannot be maintained.
    handoff: Make the case to the House Appropriations subcommittee, including its senior members from both parties; the House's
      appropriations role is the stated reason to bring the detailed account there.
    tempting_wrong:
      option: O1
      pull: Withholding may seem the safest way to honor the chair's interest in keeping Agency affairs private.
      why_wrong: 'It would discard the source''s central balance: privacy was maintained through a secret, small bipartisan
        review, while the Agency still supplied every budget dollar.'
    rejected:
      O1: Withholding the budget would forgo the full House review that the Agency said was needed to make its case and would
        depart from its dollar-for-dollar practice.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The private setting could no longer reliably keep the Agency's affairs private.
      then: O1
      why: The source's balance rests on being able to provide full scrutiny in a private setting; if that condition failed,
        withholding would better preserve confidentiality among the available options.
    would_not_change:
    - id: noflip1
      if: Public criticism or allegations continued while the private bipartisan subcommittee still received the complete
        budget.
      why: The Agency's endorsement of full disclosure was not displaced by contrary public allegations; the relevant practice
        was detailed private review.
    watch_for:
    - id: watch1
      what: Whether the House remains the place where money bills originate and the Agency must make its budget case.
      favors:
      - O2
      why: That constitutional role is the stated practical reason for presenting the budget to the House.
  lesson: When oversight is conducted in a genuinely private, limited setting, confidentiality need not require withholding
    information from the relevant legislative body. Provide a complete account when that body is where the institution must
    make its case, while keeping the review within the confidential channel.
  limits: This reasoning addresses the described private House Appropriations review and does not establish that the arrangement
    was legally sufficient or that the same level of disclosure is appropriate in a public or insecure setting.
  library:
    domain: intel-oversight
    family: CORPUS-NX-89822c41
    source: https://www.cia.gov/static/1ceeab44c128de37ea9369f255f9e12b/A-Life-in-Intelligence-The-Richard-Helms-Collection.pdf
