case:
  id: DR-OHA-26-0110-flip1@v1
  title: Guideline G Alcohol Consumption Security Concern [flip]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, October 2026, administrative clearance review
  decider: Administrative Judge
  agent: Adjudication Support Officer
  agent_role: decide
  situation: The Individual, a DOE contractor, was arrested in October 2025 for DUI and related traffic offenses. The LSO
    invoked Guideline G, citing the arrests and a severe Alcohol Use Disorder diagnosis by a DOE-appointed psychologist. The
    Individual completed a six-week alcohol-education course, a twelve-week intensive outpatient program, and continued counseling.
    Monthly PEth screens from December 2025 through June 2026 (except May) were negative, and the partner testified to continued
    abstinence. The DOE psychologist later opined that the Individual had rehabilitated and offered a favorable prognosis.
    However, a follow-up PEth test in August 2026 showed a measurable concentration, confirming recent alcohol consumption
    after the adjudicative hearing. The LSO maintains the Guideline G security concern.
  question: How should the Adjudication Support Officer advise the Administrative Judge regarding the Individual's access
    authorization?
  options:
    O1:
      do: Judge keeps the Individual's access authorization on hold pending further monitoring.
      move: hold
      irreversible: false
    O2:
      do: Judge restores the Individual's access authorization after reviewing the mitigation evidence.
      move: act
      irreversible: true
    O3:
      do: Judge requests additional PEth testing before reaching a final decision.
      move: ask
      irreversible: false
    O4:
      do: Judge denies restoration of the Individual's access authorization at this stage.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In October 2025 the Individual was charged with driving while intoxicated, reckless driving, possession of an open
      container, and related traffic violations.
  - id: F2
    kind: situation
    status: confirmed
    fact: A DOE-appointed psychologist evaluated the Individual and diagnosed Severe Alcohol Use Disorder, Early Remission,
      noting insufficient evidence of sustained rehabilitation.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual successfully completed a six-week alcohol education and awareness program and attended periodic sessions
      with a health-risk-prevention psychologist.
  - id: F4
    kind: situation
    status: confirmed
    fact: From December 2025 through March 2026 the Individual participated in, and finished, a twelve-week intensive outpatient
      treatment program, and has continued counseling thereafter.
  - id: F5
    kind: situation
    status: confirmed
    fact: Monthly phosphatidylethanol (PEth) screenings from December 2025 to June 2026 (excluding May) returned negative
      results, indicating no alcohol consumption.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual's partner provided sworn testimony that the Individual had not consumed alcohol since the October
      2025 arrest.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The DOE psychologist issued an opinion that the Individual had achieved rehabilitation and offered a favorable prognosis
      for continued abstinence.
  - id: F8
    kind: situation
    status: confirmed
    fact: The LSO invoked Guideline G (Alcohol Consumption) as a security concern, based on the Individual's prior arrests
      and the psychologist's diagnosis.
  - id: F9
    kind: situation
    status: confirmed
    fact: 'F10 [situation, confirmed]: A follow‑up phosphatidylethanol (PEth) screening performed in August 2026 detected
      a measurable concentration, confirming recent alcohol intake after the adjudicative hearing.'
  - id: F10
    kind: authority
    status: confirmed
    fact: The Administrative Judge has delegated the authority to draft the final decision to an adjudication support officer.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    - F9
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The August 2026 positive PEth test demonstrates recent alcohol use, breaking the previously documented abstinence
      period and nullifying mitigation factor (b) under Guideline G.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: Although the Individual completed the required education and treatment, the documented relapse reduces the persuasive
      value of those mitigation factors.
  - id: C3
    facts:
    - F7
    - F9
    equity: institutional_credibility
    favors:
    - O4
    weight: weak
    why: The psychologist's earlier favorable opinion is contradicted by the August 2026 positive PEth result, diminishing
      its controlling weight in the analysis.
  - id: C4
    facts:
    - F2
    - F8
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The severe AUD diagnosis combined with recent alcohol consumption re-establishes a security concern under Guideline
      G, outweighing any prior mitigation.
  reasoning:
    read: The LSO raised Guideline G concerns based on the Individual's 2025 DUI arrest and a diagnosis of severe Alcohol
      Use Disorder. A post-hearing PEth test in August 2026 revealed recent alcohol consumption, indicating a relapse.
    weighing: Applying the adjudicative guidelines, the judge must consider mitigation factor (b) which requires sustained
      abstinence. The positive August 2026 PEth result defeats this factor (C1) and, together with the original diagnosis,
      re-creates a security concern (C4). Although the Individual completed treatment (C2) and previously received a favorable
      professional opinion (C3), those factors are outweighed by the demonstrated relapse. Consequently, the clearance cannot
      be restored.
    tradecraft: The Administrative Judge will issue a written denial, citing the August 2026 PEth result, the original diagnosis,
      and the LSO's Guideline G assessment, and will record the decision in the DOE personnel security system per 10 C.F.R.
      § 710.27(d).
    uncertainty: There is minimal uncertainty; the objective PEth evidence confirms recent alcohol use, leaving no credible
      basis for mitigation under Guideline G.
    handoff: The Administrative Judge makes the final determination; the adjudication support officer drafts the decision
      pursuant to the delegated authority (F10).
    tempting_wrong:
      option: O2
      pull: The Individual's completed treatment program and prior professional opinion might suggest restoration.
      why_wrong: Restoring the clearance would ignore the concrete evidence of relapse, violating the mitigation requirements
        of Guideline G.
    rejected:
      O1: Holding the clearance pending further monitoring is unnecessary because the positive PEth already demonstrates a
        breach of abstinence.
      O3: Additional testing would not change the outcome; the existing positive result already establishes a security concern.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: All recorded PEth results between December 2025 and June 2026 were negative and the partner affirmed that no alcohol
        has been consumed since the October 2025 arrest.
      then: O2
      why: Continued abstinence would satisfy mitigation factor (b) and could support restoration of the clearance.
    would_not_change:
    - id: noflip1
      if: the Individual had not completed the twelve-week intensive outpatient program but had otherwise shown ten months
        of abstinence
      why: The judge previously found that program completion is not strictly required when other mitigation factors are satisfied.
    watch_for:
    - id: watch1
      what: any future positive PEth test or repeat DUI arrest
      favors:
      - O4
      why: Such evidence would indicate a return to excessive alcohol consumption, reviving the Guideline G security concern.
  lesson: When Guideline G concerns are present, a documented relapse—even after prior treatment and favorable professional
    opinions—nullifies mitigation factors based on abstinence and can justify denying clearance restoration. The adjudicative
    process must give weight to objective evidence of recent alcohol use.
  limits: This analysis applies solely to DOE security-clearance determinations under Guideline G for alcohol-related issues.
    It does not extend to other adjudicative guidelines (e.g., financial irresponsibility) or to cases lacking comparable
    PEth evidence.
