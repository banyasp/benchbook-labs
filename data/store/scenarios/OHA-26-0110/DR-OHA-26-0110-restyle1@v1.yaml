case:
  id: DR-OHA-26-0110-restyle1@v1
  title: Guideline G Alcohol Consumption Security Concern [restyle]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals – September 2026 – Administrative Review
  decider: Presiding Administrative Judge
  agent: Designated Adjudication Support Officer
  agent_role: decide
  situation: The contractor employee was arrested in October 2025 for driving while impaired and associated traffic violations.
    The LSO raised a Guideline G issue, citing the employee's alcohol-related arrests and a severe Alcohol Use Disorder diagnosis
    issued by a DOE-appointed psychologist. The employee completed a six-week alcohol-education class, attended a twelve-week
    intensive outpatient treatment program, and remained in counseling through the employee assistance program. Monthly PEth
    assays from December 2025 through June 2026 (excluding May) were negative, confirming abstinence, and the employee's spouse
    testified that no alcohol has been consumed since the October 2025 incident. The DOE psychologist concluded the employee
    had rehabilitated and offered a favorable prognosis, while the LSO continued to assert a security concern under Guideline
    G.
  question: How should the Designated Adjudication Support Officer advise the Presiding Administrative Judge regarding the
    employee's security clearance?
  options:
    O1:
      do: Advise the Judge to keep the employee's clearance suspended pending further monitoring.
      move: hold
      irreversible: false
    O2:
      do: Advise the Judge to fully reinstate the employee's clearance without delay immediately.
      move: act
      irreversible: true
    O3:
      do: Advise the Judge to request additional PEth testing before reaching a determination.
      move: ask
      irreversible: false
    O4:
      do: Advise the Judge to deny any reinstatement of the employee's clearance outright.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In October 2025 the employee was taken into custody for operating a vehicle while intoxicated, reckless driving,
      possessing an open container, and other traffic violations.
  - id: F2
    kind: situation
    status: confirmed
    fact: A DOE-appointed psychologist evaluated the employee and concluded he suffers from Severe Alcohol Use Disorder, Early
      Remission, stating that the evidence of rehabilitation remains insufficient.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee fulfilled a six-week alcohol-awareness and education curriculum and attended periodic sessions with
      an HRP-designated psychologist.
  - id: F4
    kind: situation
    status: confirmed
    fact: From December 2025 through March 2026 the employee participated in a twelve-week intensive outpatient rehabilitation
      program, which he completed, and he has kept up with counseling thereafter.
  - id: F5
    kind: situation
    status: confirmed
    fact: PEth screenings performed each month from December 2025 to June 2026 (with the exception of May) returned negative,
      confirming no alcohol intake.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee's spouse testified that the employee has abstained from alcohol since the October 2025 incident.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The DOE psychologist provided an opinion that the employee has achieved rehabilitation and offered an optimistic
      outlook.
  - id: F8
    kind: situation
    status: confirmed
    fact: The LSO invoked Guideline G concerning alcohol consumption, citing the employee's arrests and the psychologist's
      diagnosis as a security issue.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Presiding Administrative Judge has delegated decision-drafting authority to a designated adjudication support
      officer.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Negative PEth results from Dec 2025-Jun 2026 and the spouse's testimony together establish a ten-month stretch of
      abstinence, satisfying mitigation factor (b) of Guideline G that the individual exhibits a clear pattern of modified
      consumption.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The employee completed the DOE-mandated six-week education, the twelve-week intensive outpatient program, and continues
      monthly counseling, thereby meeting mitigation factors (c) and (d) of Guideline G.
  - id: C3
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The DOE-appointed psychologist's opinion that the employee has rehabilitated carries controlling weight in the adjudicative
      analysis.
  - id: C4
    facts:
    - F2
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Although the original severe AUD diagnosis created a security concern, the guidelines permit mitigation when sustained
      abstinence and treatment are demonstrated, which the record now shows.
  reasoning:
    read: The LSO identified a security concern under Guideline G based on the employee's 2025 impaired-driving incident and
      a diagnosis of severe Alcohol Use Disorder. The Judge must assess whether the employee has sufficiently mitigated those
      concerns to warrant clearance restoration.
    weighing: Applying the Adjudicative Guidelines, the Judge found that mitigation factors (b) and (c) are satisfied. The
      record demonstrates a ten-month abstinence period corroborated by PEth testing and spouse testimony (C1), completion
      of the required treatment regimen and ongoing counseling (C2), and a professional opinion of rehabilitation (C3). These
      considerations outweigh the prior arrests (C4). Accordingly, the Judge concluded that the security concern is resolved
      and restored the clearance.
    tradecraft: The decision will be entered in the Judge's written Decision, citing the relevant exhibits and testimony,
      and the restoration will be recorded in the DOE personnel security system pursuant to 10 C.F.R. § 710.27(d).
    uncertainty: The only lingering uncertainty is the absence of a full twelve-month documented abstinence period, but the
      Judge deemed the favorable professional prognosis sufficient to bridge that gap.
    handoff: The Presiding Administrative Judge issues the final determination; the Designated Adjudication Support Officer
      drafts the decision under the delegated authority (F9).
    tempting_wrong:
      option: O4
      pull: The LSO's initial alarm and the severe AUD diagnosis could make denial appear attractive.
      why_wrong: Rejecting restoration would overlook the considerable mitigating evidence of prolonged abstinence, completed
        treatment, and professional rehabilitation opinions, contrary to the Guidelines.
    rejected:
      O1: Keeping the clearance suspended is unnecessary because the record already satisfies the mitigation criteria.
      O3: Requiring further PEth testing is unwarranted; the Judge has accepted the existing negative results and professional
        opinions as sufficient.
      O4: Denial would conflict with the adjudicative guidelines that allow clearance restoration when mitigation factors
        are met.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the employee were to relapse and produce a positive PEth result after the hearing
      then: O4
      why: A positive PEth test or relapse would defeat mitigation factor (b) and re-establish a security concern under Guideline
        G.
    would_not_change:
    - id: noflip1
      if: the employee had not completed the twelve-week intensive outpatient program but had otherwise shown ten months of
        abstinence
      why: The Judge found that completion of the program is not strictly required if other mitigation factors are satisfied.
    watch_for:
    - id: watch1
      what: any future positive PEth test or DUI arrest
      favors:
      - O4
      why: Such evidence would indicate a return to excessive alcohol consumption, reviving the Guideline G concern.
  lesson: When Guideline G concerns arise, documented sustained abstinence, completion of an approved treatment program, and
    a professional rehabilitation opinion can satisfy mitigation factors and justify clearance restoration. The adjudicative
    process balances prior misconduct against current demonstrated reliability.
  limits: This analysis applies solely to security-clearance determinations under Guideline G for alcohol consumption. It
    does not extend to other adjudicative guidelines (e.g., financial irresponsibility) or to cases lacking comparable treatment
    documentation.
