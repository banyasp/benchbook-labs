case:
  id: DR-CORPUS-NS-2ab6438c-E2@v1
  title: Halting Remaining Strikes Near Personnel
  status: draft
  setting: Afghanistan, 2 March, CENTCOM-approved interdiction operation
  decider: The SOF teams
  agent: The SOF teams
  agent_role: decide
  situation: On 2 March, CENTCOM-approved interdiction airstrikes were underway. The SOF teams did not know the strikes' timing
    or location. The teams were uncomfortable with the proximity of the impacts. Additional planned strikes remained. The
    lack of preparatory bombardment was assessed to have severe implications for upcoming Afghan ground movement and an American
    air assault.
  question: What should the SOF teams do about the remaining planned strikes?
  options:
    O1:
      do: The SOF teams allow the remaining planned strikes to continue.
      move: act
      irreversible: false
    O2:
      do: The SOF teams halt the remaining planned strikes.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: CENTCOM had approved the initial interdiction airstrikes, which were underway on 2 March.
  - id: F2
    kind: situation
    status: confirmed
    fact: Additional interdiction strikes remained planned.
  - id: F3
    kind: situation
    status: confirmed
    fact: The SOF teams were unaware of the interdiction strikes' time and location.
  - id: F4
    kind: situation
    status: assessed
    fact: The SOF teams were uncomfortable with the proximity of the impacts.
  - id: F5
    kind: situation
    status: assessed
    fact: The lack of preparatory bombardment was assessed to have severe implications for upcoming Afghan ground movement.
  - id: F6
    kind: situation
    status: assessed
    fact: The lack of preparatory bombardment was assessed to have severe implications for an upcoming American air assault.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The teams did not know the strikes' timing or location and were uncomfortable with how close the impacts were; they
      called off the remaining strikes.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The lack of preparatory bombardment was assessed to have severe implications for upcoming Afghan ground movement,
      a substantial cost of halting the strikes.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The lack of preparatory bombardment was also assessed to have severe implications for an upcoming American air assault.
  reasoning:
    read: The teams faced a choice about remaining planned strikes while impacts were close enough to make them uncomfortable,
      and they lacked advance knowledge of the strikes' timing and location. The trap is that halting carried serious assessed
      consequences for upcoming movement and an air assault, but those mission costs do not erase the concern about nearby
      personnel.
    weighing: The proximity concern supports halting {C1}; the assessed consequences for Afghan ground movement and the American
      air assault weigh toward continuing {C2} {C3}. The teams chose to stop the remaining strikes because of the proximity
      of the impacts. The source records the mission consequences but does not say how, or whether, the teams weighed them
      against their safety concern.
    tradecraft: At the decision level, communicate the halt and its safety rationale to the responsible command authority,
      document the concern and the assessed mission consequences, and preserve a clear record of who made the decision.
    uncertainty: The source does not specify the degree of danger to personnel, whether the proximity concern could be resolved,
      or the teams' precise assessment of the mission consequences. It records their discomfort and the assessed severe implications
      of lacking preparatory bombardment.
    handoff: Because the operation had CENTCOM approval and halting had significant assessed mission consequences, involve
      the appropriate command authority in communicating and reviewing the decision; the source does not identify a separate
      approval process for the halt.
    tempting_wrong:
      option: O1
      pull: Continuing would avoid the severe assessed consequences of lacking preparatory bombardment for upcoming movement
        and the air assault.
      why_wrong: That mission pressure does not resolve the teams' concern about impacts close to their positions when they
        lacked advance knowledge of the strikes' timing and location.
    rejected:
      O1: The teams did not allow the remaining planned strikes to continue because they were uncomfortable with the proximity
        of the impacts.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The proximity concern were reliably resolved and the teams could proceed without the same concern about nearby personnel.
      then: O1
      why: With the stated safety concern resolved, the severe assessed consequences of lacking preparatory bombardment would
        weigh toward continuing.
    would_not_change:
    - id: noflip1
      if: The consequences for the upcoming ground movement and air assault were emphasized without resolving the concern
        about impacts close to the teams.
      why: Those consequences remain important, but by themselves they do not remove the proximity concern that led the teams
        to halt the remaining strikes.
    watch_for:
    - id: watch1
      what: Whether the concern about the proximity of impacts remains unresolved.
      favors:
      - O2
      why: The teams' stated reason for halting the remaining strikes was their discomfort with that proximity.
  lesson: When nearby personnel are concerned about the proximity of ongoing impacts, that safety concern must be considered
    even when stopping carries serious mission costs. Make the decision with those competing consequences visible, rather
    than allowing mission pressure alone to settle it.
  limits: The source does not establish a legal rule governing the halt or provide enough detail to assess the level of danger
    or whether it could have been mitigated. This reasoning is limited to the teams' stated concern and the mission consequences
    assessed in this episode.
