case:
  id: DR-CORPUS-NS-2ab6438c-E4@v1
  title: Rules of Engagement During the Fallujah Shaping Phase
  status: draft
  setting: Fallujah, shaping phase; joint-force planning under senior American leaders.
  decider: The senior American leaders
  agent: The senior American leaders
  agent_role: decide
  situation: During the shaping phase of operations around Fallujah, senior American leaders were deciding how the joint force's
    rules of engagement should govern responses and preemptive action. They faced concern about negative press coverage during
    earlier operations in Fallujah. The stated policy aim was to minimize harm to civilian lives and infrastructure. The planning
    context included constraints that affected what planners could do during the shaping phase, while a more permissive posture
    was available as an alternative.
  question: What should the senior American leaders do about the joint force's rules of engagement during the shaping phase?
  options:
    O1:
      do: The senior American leaders require an observed hostile act or demonstrated hostile intent and restrict preemptive
        strikes outside the normal targeting cycle.
      move: act
      irreversible: false
    O2:
      do: The senior American leaders relax the rules of engagement and permit preemptive strikes outside the normal targeting
        cycle during the shaping phase.
      move: act
      irreversible: false
    O3:
      do: The senior American leaders ask the joint force planners to assess the effects of a more permissive rules-of-engagement
        posture before deciding.
      move: ask
      irreversible: false
      to: the joint force planners
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The joint force had to address rules of engagement as part of its planning.
  - id: F2
    kind: situation
    status: confirmed
    fact: Negative press coverage during previous operations in Fallujah was a consideration for senior American leaders.
  - id: F3
    kind: situation
    status: confirmed
    fact: The stated intent of the rules of engagement was to minimize damage to civilian infrastructure and lives.
  - id: F4
    kind: authority
    status: confirmed
    fact: The rules of engagement allowed US forces to respond to an observed hostile act or demonstrated hostile intent.
  - id: F5
    kind: authority
    status: confirmed
    fact: The rules of engagement limited preemptive strikes outside the normal targeting cycle during the shaping phase.
  - id: F6
    kind: situation
    status: confirmed
    fact: Senior American leaders significantly restricted the rules of engagement.
  - id: F7
    kind: situation
    status: confirmed
    fact: A more relaxed rules-of-engagement posture typically allowed strikes during the shaping phase that the restrictions
      precluded.
  - id: F8
    kind: situation
    status: confirmed
    fact: The rules of engagement limited air planners during the shaping phase.
  considerations:
  - id: C1
    facts:
    - F3
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The stated aim of the restrictions was to minimize harm to civilian lives and infrastructure.
  - id: C2
    facts:
    - F2
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Senior leaders significantly restricted the rules of engagement in response to negative press coverage during earlier
      Fallujah operations.
  - id: C3
    facts:
    - F4
    - F5
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The selected posture allowed response to an observed hostile act or demonstrated hostile intent while limiting preemptive
      action outside the ordinary cycle.
  - id: C4
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The restrictions limited planners during the shaping phase, whereas a more permissive posture typically allowed strikes
      the restrictions precluded.
  reasoning:
    read: 'This was a policy choice about when force could be used during the shaping phase, not a choice between responding
      and never responding: the stated rules permitted response to an observed hostile act or demonstrated hostile intent.
      The trap is to treat the operational limits of O1 as proof that O1 was contrary to the leaders’ stated priorities.'
    weighing: 'The leaders’ stated reasons favored restricting the rules: minimizing harm to civilian lives and infrastructure
      and responding to negative press coverage from earlier operations. The more permissive alternative offered greater latitude
      during shaping, but the source presents that as a cost of the chosen restrictions, not as outweighing the stated reasons
      for them. The balance would depend on whether leaders continued to give priority to those civilian-harm and public-confidence
      concerns.'
    tradecraft: Record the purpose of the restrictions, the response threshold, and the anticipated policy-level costs of
      a more permissive posture. Keep the rationale tied to civilian protection and the leaders’ stated concern; do not treat
      operational effects as a substitute for that rationale.
    uncertainty: The excerpt gives no comparative estimate of civilian harm, urgency, or mission effects under the two postures,
      and does not elaborate on the leaders’ weighing beyond the stated concerns.
    handoff: The senior American leaders make the policy decision. Joint-force planners can inform them of the broad effects
      of the available postures, while the leaders retain responsibility for deciding how the stated civilian-protection and
      press concerns bear on the rules.
    tempting_wrong:
      option: O2
      pull: A more relaxed posture typically permitted strikes during shaping that the restrictions precluded.
      why_wrong: 'That operational advantage does not displace the source’s stated reasons for the leaders’ restrictions:
        minimizing harm to civilians and responding to negative press coverage.'
    rejected:
      O2: It was not chosen because the leaders significantly restricted the rules of engagement to minimize civilian harm
        and address negative press coverage.
      O3: It was not chosen because the account presents the leaders as imposing the restrictive posture, rather than deferring
        the decision for a further assessment.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Leaders no longer give priority to minimizing civilian harm and addressing the prior press concerns, and instead
        accept the additional risks of a more permissive posture to gain greater latitude during shaping.
      then: O2
      why: The source identifies a more permissive posture as an available alternative that allowed actions precluded by the
        restrictions; a changed balance of priorities could favor it.
    would_not_change:
    - id: noflip1
      if: The restrictions continue to limit planners during the shaping phase.
      why: That limitation is part of the recorded cost of O1 and, by itself, does not negate the stated reasons for the leaders’
        choice.
    watch_for:
    - id: watch1
      what: Whether civilian-harm concerns and the leaders’ concern about prior negative press remain central to the policy
        decision.
      favors:
      - O1
      why: Those are the source’s stated reasons for significantly restricting the rules of engagement.
  lesson: When choosing a response threshold, give explicit weight to the stated aim of minimizing civilian harm and to the
    risks leaders are addressing. A more permissive alternative’s operational advantages matter, but do not by themselves
    settle the balance.
  limits: This reasoning addresses the shaping-phase rules of engagement described here; it does not establish a general legal
    requirement to adopt this posture. It does not resolve how leaders should decide under materially different threat, civilian-risk,
    or policy circumstances.
