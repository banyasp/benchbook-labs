case:
  id: DR-CORPUS-NX-11988e5a-E1@v1
  title: Adapting Plans to Uncertain Conditions
  status: draft
  setting: The campaign through the disintegrating Turkish armies, after the breakthrough; the commander's forces.
  decider: The commander of the forces
  agent: The commander of the forces
  agent_role: decide
  situation: The initial operation had been deliberately planned and executed, and it required little modification. After
    the breakthrough, conditions were uncertain and disorderly. The forces needed close coordination with other units. The
    commander faced a planning decision about the pursuit under those conditions.
  question: What should the commander do about the planning approach for operations after the breakthrough?
  options:
    O1:
      do: The commander changes the pursuit plan to a flexible, rapidly developed approach.
      move: act
      irreversible: false
    O2:
      do: The commander maintains the deliberate planning approach for the pursuit.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The initial operation was deliberately planned and executed.
  - id: F2
    kind: situation
    status: confirmed
    fact: The initial operation required little modification.
  - id: F3
    kind: situation
    status: confirmed
    fact: Conditions after the breakthrough were uncertain and disorderly.
  - id: F4
    kind: situation
    status: confirmed
    fact: Close coordination with other units was necessary.
  - id: F5
    kind: situation
    status: confirmed
    fact: The pursuit plan required greater flexibility.
  - id: F6
    kind: situation
    status: confirmed
    fact: The pursuit plan had to be developed more rapidly.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Uncertain and disorderly conditions made greater flexibility necessary for planning after the breakthrough.
  - id: C2
    facts:
    - F3
    - F6
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The pursuit plan had to be developed more rapidly because conditions were uncertain and disorderly.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Close coordination with other units was necessary, and the pursuit plan's flexibility and rapid development addressed
      the changed conditions.
  - id: C4
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The initial operation required little modification, but the conditions after the breakthrough were materially different;
      the initial approach's success did not establish that it suited the pursuit.
  reasoning:
    read: 'The planning decision concerns a changed situation: the initial operation was deliberately planned and needed little
      modification, but conditions after the breakthrough were uncertain and disorderly. The trap is carrying forward an approach
      that worked under the initial conditions despite the different demands of the pursuit.'
    weighing: Uncertainty and disorder made flexibility and faster development necessary, while close coordination with other
      units was also required. These reasons favor changing the planning approach {C1} {C2} {C3}; the initial operation's
      limited need for modification is not a reason to keep its approach when conditions have changed {C4}.
    tradecraft: Use a planning approach that can adapt as conditions change, and keep the reasons for the change and the coordination
      needs clear in the decision record.
    uncertainty: The source identifies uncertainty and disorder but does not specify how they would develop or describe alternative
      planning arrangements.
    handoff: The commander decides the planning approach; involve the other units whose coordination is necessary so the approach
      accounts for that requirement.
    tempting_wrong:
      option: O2
      pull: The initial operation was deliberately planned and required little modification.
      why_wrong: That experience arose under different conditions; the post-breakthrough situation was uncertain and disorderly
        and required a more flexible, rapidly developed plan.
    rejected:
      O2: The commander did not maintain the deliberate planning approach because the changed, uncertain conditions required
        greater flexibility and faster development.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: After the breakthrough, conditions were stable and predictable and the pursuit did not require rapid adjustment.
      then: O2
      why: Without the changed conditions that made flexibility and rapid development necessary, maintaining the deliberate
        approach could be appropriate.
    would_not_change:
    - id: noflip1
      if: The initial operation had required little modification, as it did here.
      why: That fact alone would not change the recommendation because the post-breakthrough conditions were different and
        drove the need to adapt.
    watch_for:
    - id: watch1
      what: Whether conditions remain uncertain and disorderly and whether close coordination with other units remains necessary.
      favors:
      - O1
      why: Those are the stated conditions supporting a flexible, rapidly developed planning approach.
  lesson: A planning approach suited to one phase should not be carried into a materially different phase merely because it
    worked before. Adapt the approach when changing conditions require greater flexibility, faster development, or close coordination.
  limits: This reasoning applies to the planning decision under the uncertain, disorderly post-breakthrough conditions described
    here. It does not establish that flexible planning is always preferable or address specific operational methods.
  library:
    domain: operational-command
    family: CORPUS-NX-11988e5a
    source: https://www.usmcu.edu/Portals/218/CEME/courses/MCDP%205%20Planning.pdf
    episode_focus: This decision point concerns adapting the plan’s coordination and planning approach as conditions became
      uncertain and disorderly. The source says the pursuit plan had to be more flexible and rapidly developed; exclude the
      specific attack and pursuit methods as operational technique.
