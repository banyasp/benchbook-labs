case:
  id: DR-CORPUS-NX-fcd48023-E1@v1
  title: Public-Authority Review of a Contemplated Operation
  status: draft
  setting: Yemen; a contemplated Department of Defense operation under legal review by the Office of Legal Counsel.
  decider: The Office of Legal Counsel
  agent: The Office of Legal Counsel
  agent_role: decide
  situation: The Department of Defense was considering an operation in Yemen against a U.S. citizen described as a leader
    of AQAP. Senior government officials assessed that the citizen's activities posed a continued and imminent threat to U.S.
    persons and interests, and that he had roles in an abortive attack in the United States and ongoing plots against Americans.
    Congress had authorized necessary and appropriate force against organizations connected to the September 11 attacks, while
    whether the citizen and AQAP forces fell within that authorization depended on assessments of their relationship to al-Qaida.
    The United States and al-Qaida were engaged in a non-international armed conflict, but the conflict's geographic reach
    and the treatment of members of non-state armed groups remained legally disputed. The legal review had to address federal
    homicide law's public-authority justification, the laws of war, and possible constitutional protections associated with
    citizenship.
  question: What should the Office of Legal Counsel do in determining whether federal homicide law bars or the AUMF and lawful
    conduct of war permit the contemplated DoD operation against the U.S. citizen?
  options:
    O1:
      do: The Office of Legal Counsel should conclude that the public-authority justification prohibits the contemplated DoD
        operation under federal homicide law.
      move: act
      irreversible: false
    O2:
      do: The Office of Legal Counsel should conclude that the public-authority justification permits the contemplated DoD
        operation under federal homicide law.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Section 1119 incorporates the public-authority justification.
  - id: F2
    kind: authority
    status: confirmed
    fact: Congress authorized the President to use necessary and appropriate force against those responsible for the September
      11 attacks and organizations within the authorization's scope.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Senior government officials assessed that the U.S. citizen was an AQAP leader whose activities in Yemen posed a
      continued and imminent threat to U.S. persons and interests.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The represented information attributed to the citizen operational and leadership roles in AQAP, involvement in an
      abortive attack in the United States, and continued plotting of attacks intended to kill Americans.
  - id: F5
    kind: situation
    status: confirmed
    fact: The contemplated operation's target was a United States citizen.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Supreme Court had held that the AUMF authorized detention of a Taliban member captured abroad even though he
      was a U.S. citizen; the cited precedent concerned detention rather than the contemplated use of force.
  - id: F7
    kind: authority
    status: confirmed
    fact: Legal arguments differed over whether members of a non-state armed group in a non-international armed conflict must
      be treated as civilians subject to attack only during direct participation in hostilities, or may be treated according
      to their continuing combat function.
  - id: F8
    kind: situation
    status: confirmed
    fact: The contemplated operation was in Yemen, far from the most active theater of combat, and there was little authoritative
      precedent directly addressing the geographic scope of this kind of non-international armed conflict.
  - id: F9
    kind: authority
    status: confirmed
    fact: The legal standard under consideration required the contemplated operation to comply with the applicable laws of
      war governing the conflict.
  - id: F10
    kind: authority
    status: confirmed
    fact: Possible constitutional protections associated with the citizen's status were identified as relevant to the public-authority
      analysis.
  considerations:
  - id: C1
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Section 1119 incorporates the public-authority justification, so federal homicide law does not itself bar conduct
      that qualifies under that justification.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Congress authorized necessary and appropriate force against organizations within the AUMF's scope. OLC considered
      it reasonable to conclude that the target's leadership and operational roles placed him, and the AQAP forces he led,
      within that scope; the represented threat and attack-related activities reinforced that conclusion.
  - id: C3
    facts:
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Citizenship did not, in OLC's view, make the target immune from otherwise authorized force abroad. OLC relied by
      analogy on precedent allowing detention under the AUMF of a citizen captured abroad, while recognizing that detention
      precedent was not itself a ruling on lethal force.
  - id: C4
    facts:
    - F7
    - F8
    - F9
    equity: hors_de_combat
    favors:
    - O2
    weight: strong
    why: OLC concluded that, on the combination of facts presented, the Yemen operation would be part of the non-international
      armed conflict with al-Qaida and could comply with international law if conducted under the applicable laws of war.
      OLC rejected the view that members of non-state armed groups must invariably be treated as civilians targetable only
      during direct participation, while acknowledging limited authority on the conflict's geographic reach.
  - id: C5
    facts:
    - F5
    - F10
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The conclusion also depended in part on OLC's determination that the contemplated operation would accord with any
      constitutional protections applicable to the citizen in these circumstances.
  reasoning:
    read: This is a legal-authority decision about a contemplated operation against a citizen assessed to be an AQAP leader,
      not a general ruling that citizenship or the AUMF settles every such case. The trap is to treat either citizenship as
      an automatic bar or the AUMF as a complete answer without examining the target's relationship to covered forces, the
      conflict context, the laws of war, and constitutional protections.
    weighing: OLC gave substantial weight to section 1119's incorporation of public authority, the AUMF, and the represented
      facts supporting a reasonable conclusion that the target was within the authorized enemy forces. It reasoned that citizenship
      did not foreclose force that the AUMF otherwise authorized, and that the Yemen operation could fall within the ongoing
      non-international armed conflict if conducted in accordance with the applicable laws of war. The conclusion depends
      on the represented facts, the legal assessment of the target's relationship to al-Qaida, compliance with the laws of
      war, and the determination that applicable constitutional protections would be respected.
    tradecraft: Keep the legal conclusion tied to the represented record and make clear which factual and legal predicates
      support it. Distinguish statutory authority, the public-authority justification, laws-of-war compliance, and constitutional
      analysis; do not turn this case-specific conclusion into a general rule.
    uncertainty: OLC acknowledged there was no precedent directly resolving these circumstances, little authoritative precedent
      on the geographic scope of this kind of conflict, and disagreement over the status and targeting of non-state armed-group
      members. Its conclusion rested on the combination of facts presented rather than a categorical rule for Yemen or other
      locations.
    handoff: The legal determination belongs to OLC. The analysis relies on assessments by senior government officials and
      facts represented to OLC, but these reasons do not prescribe a separate approval process or handoff.
    tempting_wrong:
      option: O1
      pull: The target was a U.S. citizen, the operation was far from the most active theater, and the legal treatment of
        non-state armed-group members was disputed.
      why_wrong: OLC did not treat citizenship or Yemen's distance from the main theater as dispositive; on the represented
        facts it found a reasonable AUMF connection and concluded the operation could be part of the armed conflict, subject
        to the applicable laws of war and constitutional protections.
    rejected:
      O1: OLC rejected a categorical homicide-law bar because it concluded that the incorporated public-authority justification
        covered the operation on the represented facts.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The contemplated operation would not comply with the applicable laws of war governing the conflict.
      then: O1
      why: OLC treated lawful conduct of war as the basis for the public-authority justification and contrasted lawful combat
        with unlawful killing in violation of the laws of war.
    - id: flip2
      if: The represented facts no longer supported a reasonable conclusion that the target or the forces he led fell within
        the AUMF's scope.
      then: O1
      why: OLC relied on the target's relationship to al-Qaida or associated forces and his represented activities to find
        statutory authorization for the contemplated operation.
    - id: flip3
      if: The operation would fail to accord with constitutional protections applicable to the citizen in these circumstances.
      then: O1
      why: OLC expressly said its conclusion depended in part on its determination that the operation would accord with any
        potential constitutional protections.
    would_not_change:
    - id: noflip1
      if: The target's U.S. citizenship is considered by itself, without changing the other represented circumstances.
      why: OLC concluded that citizenship did not itself make the target immune from force abroad that the AUMF otherwise
        authorized.
    - id: noflip2
      if: The operation's location in Yemen, far from the most active theater, is considered by itself, without changing the
        other represented circumstances.
      why: OLC expressly concluded that this geographic distance did not affect its conclusion on the combination of facts
        presented.
    watch_for:
    - id: watch1
      what: Whether the target's role amounted to membership or a continuing combat function in an armed group within the
        conflict, rather than a status that would leave him protected from attack except during direct participation in hostilities.
      favors:
      - O1
      - O2
      why: OLC recorded competing legal views on the status of members of non-state armed groups and relied on its conclusion
        about the target's role in resolving that dispute.
  lesson: Where homicide law incorporates a public-authority justification, assess whether the proposed conduct is authorized
    and constitutes lawful conduct of war rather than treating the homicide statute as an automatic bar. Apply that analysis
    to the specific represented facts, including the target's connection to authorized forces, the laws of war, and any applicable
    constitutional protections.
  limits: This conclusion is limited to the circumstances represented to OLC and the contemplated operation in Yemen. It does
    not resolve other factual settings, locations, or operations, or establish that any operation against a citizen or member
    of a non-state armed group is lawful.
