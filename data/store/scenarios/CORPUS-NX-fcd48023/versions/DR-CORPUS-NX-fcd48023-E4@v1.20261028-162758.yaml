case:
  id: DR-CORPUS-NX-fcd48023-E4@v1
  title: Public Authority and the CIA Operation
  status: draft
  setting: Yemen, during the United States’ ongoing non-international armed conflict with al-Qaida; a contemplated CIA operation
    under legal review.
  decider: The Office of Legal Counsel
  agent: The Office of Legal Counsel
  agent_role: advise
  situation: The CIA was considering an operation against an operational leader of an enemy force in Yemen during the United
    States’ ongoing non-international armed conflict with al-Qaida. The operation was represented as being conducted in accordance
    with the international humanitarian law governing the conflict. CIA personnel would participate, but they would not be
    members of the armed forces and would lack the domestic-law immunity from prosecution associated with combatant status.
    The legal question included whether 18 U.S.C. § 1119, which incorporates a public authority justification, applied to
    the contemplated operation. The proposed CIA operation was described as virtually identical to a contemplated DoD operation
    against the same target in the same conflict. The operation was also represented as satisfying constitutional due-process
    requirements and the Fourth Amendment’s reasonableness standard for deadly force.
  question: What should the Office of Legal Counsel conclude about section 1119’s application to the contemplated CIA operation?
  options:
    O1:
      do: The Office of Legal Counsel concludes that section 1119 permits the contemplated CIA operation under the represented
        circumstances.
      move: act
      irreversible: false
    O2:
      do: The Office of Legal Counsel requests further factual assurances from the CIA and defers its section 1119 conclusion.
      move: ask
      irreversible: false
      to: the CIA
    O3:
      do: The Office of Legal Counsel concludes that section 1119 prohibits the contemplated CIA operation under the represented
        circumstances.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The CIA was contemplating an operation against an individual in Yemen.
  - id: F2
    kind: situation
    status: assessed
    fact: The contemplated operation concerned an operational leader of an enemy force during the United States’ ongoing non-international
      armed conflict with al-Qaida.
  - id: F3
    kind: situation
    status: assessed
    fact: The CIA operation was represented as being conducted in accordance with the international humanitarian law governing
      the conflict.
  - id: F4
    kind: situation
    status: assessed
    fact: CIA personnel would participate in the operation and would not have the domestic-law immunity from prosecution associated
      with armed-forces combatant status.
  - id: F5
    kind: authority
    status: assessed
    fact: The legal analysis distinguished lack of combatant privilege from whether conduct undertaken in authorized hostilities
      and in accordance with the laws of war violates those laws.
  - id: F6
    kind: authority
    status: assessed
    fact: Section 1119 incorporates the traditional public authority justification and contains no special limitation on that
      justification.
  - id: F7
    kind: authority
    status: assessed
    fact: The legislative history was understood to address a jurisdictional gap concerning murders by private persons abroad,
      without indicating an intent to prohibit authorized government-agency targeting of an enemy leader during armed conflict.
  - id: F8
    kind: situation
    status: assessed
    fact: The contemplated CIA operation was described as virtually identical to a contemplated DoD operation against the
      same target in the same authorized conflict and in similar compliance with the laws of war.
  - id: F9
    kind: authority
    status: assessed
    fact: The operation was represented as complying with constitutional due process and the Fourth Amendment’s reasonableness
      test for the use of deadly force.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The operation was represented as targeting an operational leader of an enemy force in an ongoing armed conflict and
      as complying with the laws of war. The public authority justification incorporated by section 1119 could therefore cover
      the operation.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: CIA personnel would lack the combatant privilege and its domestic-law immunity, but that status alone does not make
      otherwise law-of-war-compliant activity in lawfully authorized hostilities a violation of the laws of war.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Section 1119 incorporates the traditional public authority justification without a special limitation on its scope.
      Its legislative history addressed a jurisdictional gap involving private persons abroad and did not indicate an intent
      to bar authorized government targeting in armed conflict or to treat the CIA differently from DoD in a virtually identical
      operation.
  - id: C4
    facts:
    - F9
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The represented compliance with constitutional due process and the Fourth Amendment's reasonableness standard supports
      the conclusion that the operation is lawful under the circumstances considered.
  reasoning:
    read: This is a statutory public-authority question about a represented law-of-war-compliant operation in an authorized
      armed conflict. The trap is to treat CIA personnel's lack of combatant privilege as itself making the operation unlawful,
      or to infer that section 1119 singles out the CIA.
    weighing: The represented conflict context and compliance with the laws of war support applying the public authority justification
      {C1}. Lack of combatant immunity does not itself establish a laws-of-war violation {C2}; section 1119's text and history
      provide no special CIA limitation, and the proposed operation is virtually identical to the contemplated DoD operation
      {C3}. The constitutional compliance represented for the operation is further support {C4}. The conclusion rests on the
      combination of circumstances presented, without determining that every specific circumstance is necessary.
    tradecraft: Record the factual representations on which the legal conclusion depends, distinguish combatant privilege
      from whether conduct violates the laws of war, and avoid treating this conclusion as a blanket authorization for materially
      different circumstances.
    uncertainty: The conclusion is limited to the circumstances represented to the Office of Legal Counsel. The analysis does
      not determine that each specific circumstance described is necessary to the result.
    handoff: The Office of Legal Counsel can resolve the section 1119 question on the represented record. If material premises
      are uncertain or change, seek clarification from the CIA and reassess rather than extend this conclusion automatically.
    tempting_wrong:
      option: O3
      pull: CIA personnel lack the combatant privilege and its associated domestic-law immunity.
      why_wrong: The analysis distinguishes that lack of immunity from whether the operation violates the laws of war; personnel
        status alone does not make law-of-war-compliant activity in authorized hostilities unlawful.
    rejected:
      O2: The Office of Legal Counsel had sufficient represented facts to reach its conclusion, while reserving the analysis
        to those circumstances.
      O3: The public authority justification applies on the represented facts, and neither section 1119's text nor its legislative
        history indicates an intent to prohibit this authorized, law-of-war-compliant operation.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The factual basis for representing the operation as occurring in authorized hostilities and complying with the laws
        of war were materially uncertain.
      then: O2
      why: The stated conclusion depends on the represented circumstances; material uncertainty would warrant obtaining clarification
        before applying it.
    - id: flip2
      if: The proposed CIA operation were materially different from the virtually identical DoD operation considered, or were
        no longer represented as satisfying the same relevant legal conditions.
      then: O2
      why: The conclusion relies on the particular combination of circumstances presented and does not establish the result
        for a materially different operation.
    would_not_change:
    - id: noflip1
      if: CIA personnel still lacked the combatant privilege and its associated domestic-law immunity, but the operation remained
        in authorized hostilities and complied with the laws of war.
      why: Lack of combatant privilege alone does not make such conduct a violation of the laws of war.
    watch_for:
    - id: watch1
      what: Whether the factual representations concerning armed-conflict context, laws-of-war compliance, and constitutional
        standards remain accurate.
      favors:
      - O2
      why: A material departure from the premises of the conclusion calls for clarification and renewed legal review.
  lesson: A government actor's lack of combatant privilege does not, by itself, make conduct in authorized hostilities unlawful
    under the laws of war. Apply a public-authority justification according to its statutory scope and purpose, and confine
    the conclusion to the circumstances actually assessed.
  limits: This conclusion addresses section 1119 and the particular CIA operation as represented, including its armed-conflict
    context and compliance with the laws of war. It does not decide the legality of materially different operations or the
    application of other statutory restrictions.
