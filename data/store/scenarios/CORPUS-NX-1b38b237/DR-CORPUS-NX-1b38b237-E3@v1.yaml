case:
  id: DR-CORPUS-NX-1b38b237-E3@v1
  title: Kyushu Preparations and the Honshu Decision
  status: draft
  setting: Washington, 18 June 1945, meeting of the President and senior advisers.
  decider: The President
  agent: The President
  agent_role: decide
  situation: The President was considering whether to continue preparations for a Kyushu operation, with the decision on a
    later Honshu invasion still open. Advisers had presented differing casualty figures, and estimates for an invasion carried
    substantial uncertainty. Prior operations offered comparisons, but advisers disagreed about whether Kyushu losses would
    resemble the experience on Luzon or Okinawa. Military planners expected substantial Japanese forces on Kyushu and assessed
    that reinforcement from the mainland would become increasingly difficult. The President remained concerned about American
    casualties and the possibility that an invasion of Japan could intensify Japanese resistance. A staged approach that allowed
    reconsideration after the Kyushu campaign and anticipated Soviet entry was also under consideration.
  question: What should the President do about continued preparations for the Kyushu operation and the timing of the Honshu
    decision?
  options:
    O1:
      do: The President defers the Kyushu decision and requests revised casualty estimates from military advisers.
      move: ask
      irreversible: false
      to: military advisers
    O2:
      do: The President authorizes continued preparations for Kyushu and defers the Honshu decision.
      move: act
      irreversible: false
    O3:
      do: The President declines continued preparations for Kyushu and defers the Honshu decision.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The President sought estimates of the time and American losses associated with invasion and with an approach based
      on isolation, blockade, and bombardment, intending to make the campaign decision with the greatest possible economy
      of American lives.
  - id: F2
    kind: situation
    status: assessed
    fact: The Joint War Plans Committee estimated total American casualties of 132,500 to 220,000 across three invasion scenarios.
  - id: F3
    kind: situation
    status: assessed
    fact: The casualty estimates were described as uncertain, with major possible variation based on the level of opposition
      and the time required for the operation.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Joint Planning Staff removed the casualty table and the figure of 766,700 American personnel from the draft
      sent to the Joint Chiefs, without substituting other figures or descriptive language.
  - id: F5
    kind: situation
    status: confirmed
    fact: Background figures included 34,000 ground and 7,700 Navy American casualties on Okinawa, compared with 81,000 Japanese
      casualties; the Okinawa figures were not final.
  - id: F6
    kind: situation
    status: assessed
    fact: The theater commander's staff projected 50,800 battle casualties in the first 30 days and 105,050 in the first 90
      days of the Kyushu operation, plus 12,600 nonbattle casualties; the commander later characterized the figures as cautious
      logistical planning estimates and gave no explicit estimate of actual losses.
  - id: F7
    kind: situation
    status: assessed
    fact: A senior naval adviser argued that Kyushu casualties were more likely to resemble Okinawa's experience and suggested
      applying Okinawa's 35-percent casualty rate to the 766,700 personnel planned for the operation; the senior Army adviser
      did not calculate that figure.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Military planners expected eight Japanese divisions and 350,000 military personnel on Kyushu by November.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Military advisers assessed that air and naval action would reduce Japanese reinforcement from the mainland to negligible
      levels by 1 November, while the President asked about possible reinforcement from other Japanese islands.
  - id: F10
    kind: situation
    status: confirmed
    fact: The President expressed concern that an invasion of Japan could unite the Japanese for a fight to the finish; the
      plan presented for consideration left the Honshu decision until later, allowing consideration of the Kyushu campaign
      and anticipated Soviet entry.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F5
    - F6
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Economizing American lives was the President’s stated priority. The estimates varied, were expressly uncertain, and
      the advisers disagreed about whether Okinawa or Luzon was the better comparison; the theater commander supplied no explicit
      estimate of actual losses.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The casualty table and personnel figure were removed from the draft without replacement, leaving the President without
      those figures in the version sent to the Joint Chiefs. This supports caution about treating the available numbers as
      a settled basis for decision.
  - id: C3
    facts:
    - F8
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The military assessment was that Kyushu would have substantial Japanese forces, but mainland reinforcement would
      become negligible by November. The President asked about reinforcement from other islands, and the advisers assured
      him that those routes were also being constrained.
  - id: C4
    facts:
    - F10
    equity: escalation_control
    favors:
    - O1
    - O3
    weight: weak
    why: The President worried that an invasion of Japan could unite the Japanese for a fight to the finish, a risk that weighed
      against proceeding without reservation.
  - id: C5
    facts:
    - F10
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The staged approach left the Honshu decision open so the President and advisers could consider the Kyushu campaign’s
      impact and anticipated Soviet entry before deciding whether to proceed further.
  reasoning:
    read: This was a decision to continue preparations for Kyushu, not a final order to invade or a decision to invade Honshu.
      The trap was treating disputed, uncertain casualty estimates as if they supplied a precise answer, or treating the go-ahead
      for preparations as if it settled the later campaign.
    weighing: The casualty concern was central, and the differing estimates and comparison with Okinawa did not resolve it
      {C1}; the missing figures in the revised draft added reason for caution {C2}. But the military judgment was that Japanese
      forces would be substantial while reinforcement would be sharply constrained {C3}. The President also feared that an
      invasion could intensify Japanese resistance {C4}. He nevertheless agreed the Chiefs’ plan was the best choice under
      the circumstances, while keeping Honshu open for reassessment after Kyushu and anticipated Soviet entry {C5}. The balance
      depended on those military assessments and on preserving that later decision point.
    tradecraft: Record that the authorization covers continued Kyushu preparations only, not a final invasion order or approval
      of Honshu. Preserve the uncertainty and disagreement in the casualty estimates rather than presenting one comparison
      as definitive, and make the later reassessment explicit. This is decision practice, not a substitute for the President’s
      recorded judgment.
    uncertainty: The estimates carried major uncertainty, and the advisers disagreed about the relevant prior-operation comparison.
      The theater commander characterized his staff’s numbers as cautious logistical planning estimates but gave no explicit
      estimate of actual losses; the President’s concerns therefore remained unresolved rather than disproved.
    handoff: The President made the decision with senior military and civilian advisers because the choice depended on their
      casualty, force, and reinforcement assessments. The later Honshu decision was left for the President and advisers to
      revisit in light of the Kyushu campaign and anticipated Soviet entry.
    tempting_wrong:
      option: O1
      pull: Deferring for revised casualty estimates would appear to honor the President’s priority of minimizing American
        losses amid uncertainty.
      why_wrong: The President heard the competing estimates and concerns but judged the Chiefs’ plan the best choice under
        the circumstances; he authorized preparations while retaining the later Honshu decision rather than postponing Kyushu
        preparations.
    rejected:
      O1: The President proceeded with Kyushu preparations after considering the available estimates and military assessments,
        while preserving a later decision point for Honshu.
      O3: The President judged the Chiefs’ plan the best choice under the circumstances and did not decline continued Kyushu
        preparations.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Revised, decision-useful estimates materially worsened the expected American losses or showed that the existing
        estimates were not reliable enough to support proceeding.
      then: O1
      why: The President’s stated priority was to economize American lives, and materially worse or unusable estimates would
        strengthen the case for deferring and seeking further advice.
    - id: flip2
      if: The assessment that Japanese reinforcement would be constrained no longer held, materially worsening the prospects
        for the Kyushu operation.
      then: O1
      why: The expected reduction in reinforcement was part of the military case supporting the plan; losing that basis would
        justify reconsidering before continuing preparations.
    would_not_change:
    - id: noflip1
      if: The estimates remained uncertain and advisers continued to disagree about whether Okinawa or Luzon was the closer
        comparison.
      why: That uncertainty and disagreement were already present when the President authorized continued preparations, so
        they alone would not reverse the recorded choice.
    watch_for:
    - id: watch1
      what: The impact of the Kyushu campaign and anticipated Soviet entry before any Honshu decision.
      favors:
      - O1
      - O3
      why: The staged approach expressly left the later decision open so those developments could be considered; materially
        adverse findings could support further deferral or declining to proceed.
  lesson: When the decision-maker’s stated priority is minimizing own-force losses, uncertain estimates should remain visibly
    uncertain rather than be converted into false precision. A staged authorization can preserve action on the decision actually
    made while keeping a later, consequential decision open for reassessment.
  limits: This reasoning concerns continued preparations for Kyushu and the decision to defer Honshu; it does not establish
    that an invasion was ultimately ordered or that the later invasion decision was justified. It also does not resolve the
    underlying casualty estimates or the risks to Japanese people.
