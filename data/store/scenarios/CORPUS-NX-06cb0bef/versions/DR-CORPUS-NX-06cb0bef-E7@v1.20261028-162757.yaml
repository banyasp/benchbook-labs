case:
  id: DR-CORPUS-NX-06cb0bef-E7@v1
  title: Choosing a Baseline Military Projection
  status: draft
  setting: Soviet military-power forecasting, outlook for the 1980s, national-security analysis
  decider: The analysts preparing the projections
  agent: The analysts preparing the projections
  agent_role: decide
  situation: The analysts are selecting a forecast of Soviet military power for the 1980s amid political and economic uncertainty.
    The projections include a continuity path and alternatives involving faster military-spending growth or an absolute reduction.
    External challenges, military doctrine, and defense institutions are assessed as pressures favoring continued policies.
    The leaders' growing economic concerns could favor change, while adjustments to defense spending are contemplated only
    if they do not significantly affect military capabilities. The continuity projection estimates balanced force development,
    with manpower constraints limiting force-size increases and improvements continuing as new weapons become available.
  question: What should the analysts designate as the baseline projection for Soviet military power in the 1980s?
  options:
    O1:
      do: The analysts approve the continuity projection as the 1980s baseline forecast.
      move: act
      irreversible: false
    O2:
      do: The analysts defer choosing any projection as the 1980s baseline forecast.
      move: hold
      irreversible: false
    O3:
      do: The analysts approve the absolute-reduction projection as the 1980s baseline forecast.
      move: act
      irreversible: false
    O4:
      do: The analysts reject the continuity projection and approve an accelerated-spending projection.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analysts are projecting the prospects for Soviet military power in the 1980s.
  - id: F2
    kind: intelligence
    status: assessed
    fact: External challenges are assessed as a pressure favoring continuation of current policies.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Soviets' ambitious military doctrine is assessed as a pressure favoring continuation of current policies.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Powerful institutions supporting defense programs are assessed as a pressure favoring continuation of current policies.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Leaders' growing economic concerns could incline them toward policy change.
  - id: F6
    kind: situation
    status: confirmed
    fact: The continuity projection permits adjustments to defense expenditures only if they do not significantly affect military
      capabilities.
  - id: F7
    kind: situation
    status: confirmed
    fact: The alternatives include two projections requiring accelerated growth in military spending and one requiring an
      absolute reduction.
  - id: F8
    kind: capability
    status: assessed
    fact: The continuity projection estimates that the Soviets will maintain balanced force development.
  - id: F9
    kind: capability
    status: assessed
    fact: Manpower constraints are expected to limit increases in force size, while improvements are expected to continue
      as new weapons become available.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The analysts expected external challenges, ambitious military doctrine, and defense institutions to outweigh the
      leaders' growing economic concerns to a large extent.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The continuity forecast was identified as the projection most consistent with currently available evidence.
  - id: C3
    facts:
    - F5
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Although political and economic changes could produce a discontinuity, the analysts considered the alternative projections
      less likely than the baseline.
  - id: C4
    facts:
    - F6
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The continuity forecast allows expenditure adjustments only when they do not significantly affect military capabilities,
      and projects balanced development with force-size growth constrained by manpower.
  reasoning:
    read: The decision is which forecast best fits the available evidence, not which policy Soviet leaders ought to choose.
      The trap is treating the possibility of economic-driven change as outweighing the report's assessment that pressures
      for continuity would offset it to a large extent.
    weighing: 'The analysts'' stated balance favors continuity: external challenges, doctrine, and defense institutions were
      expected to counterbalance economic concerns, and the baseline was the projection most consistent with available evidence
      {C1} {C2}. The alternatives acknowledge possible discontinuities but were judged less likely {C3}. The continuity forecast
      also accommodates only expenditure adjustments that do not significantly affect capabilities, alongside balanced development
      and manpower limits {C4}.'
    tradecraft: Record the baseline as an evidence-based forecast rather than a certainty, and distinguish its assumptions
      from the less-likely alternatives. Revisit the choice if the assessed balance of pressures or the evidence for a discontinuity
      changes.
    uncertainty: 'The projection is broad and conditional: political and economic changes could produce discontinuities, and
      the analysts present alternatives to mark reasonable limits to policymakers'' options.'
    handoff: The analysts make the forecast choice; the stated basis does not identify a separate approving authority or require
      referral.
    tempting_wrong:
      option: O3
      pull: Growing economic concerns could incline leaders toward policy change, making an absolute reduction appear prudent
        to use as the baseline.
      why_wrong: The analysts regarded the continuity projection as most consistent with available evidence and the alternatives,
        including an absolute reduction, as less likely.
    rejected:
      O2: Deferring would not reflect the analysts' stated judgment that the continuity projection best fit the available
        evidence.
      O3: The absolute-reduction projection was among the alternatives the analysts considered less likely than the baseline.
      O4: An accelerated-spending projection was also an alternative considered less likely than the continuity baseline.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The analysts assess that a policy discontinuity resulting in an absolute reduction is more likely than continuity.
      then: O3
      why: An absolute-reduction forecast would then better represent the assessed outlook than the continuity baseline.
    - id: flip2
      if: The analysts assess that accelerated military-spending growth is more likely than continuity.
      then: O4
      why: The accelerated-spending alternative would then be the better-supported baseline.
    would_not_change:
    - id: noflip1
      if: Defense expenditures are adjusted but those adjustments do not significantly affect military capabilities.
      why: The baseline expressly allows for such adjustments.
    watch_for:
    - id: watch1
      what: Changes in political and economic conditions that could lead to discontinuities in policy.
      favors:
      - O3
      - O4
      why: The analysts identify such changes as a reason to consider alternatives to the continuity projection.
  lesson: Choose the baseline that best fits the available evidence, while accounting for pressures that may favor continuity
    and for conditions that could produce a discontinuity. Treat less-likely alternatives as contingencies, not as equally
    supported forecasts.
  limits: This reasoning applies to selecting a forecast under the assumptions and evidence described for the 1980s. It does
    not establish what Soviet policy ultimately became or provide a rule for other forecasting decisions with a different
    evidentiary balance.
