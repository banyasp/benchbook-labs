    domain: intel-analysis
    family: CORPUS-NX-06cb0bef
    source: https://www.cia.gov/resources/csi/static/f56d68539464299cfbb71d0f43076ae0/5-EstimatingSovietMilitaryIntentionsandCapabilities-document42-49.pdf
    episode_focus: 'The decision point is which projection to treat as the baseline amid economic and political uncertainty:
      continuity under current pressures, or a more substantial policy discontinuity. The report identifies the baseline as
      most consistent with available evidence and explains that external challenges, doctrine, and defense institutions were
      expected to outweigh economic concerns to a large extent. Exclude the Soviet leaders’ hypothetical policy choices; the
      decision here is the analysts’ choice of forecast.'
