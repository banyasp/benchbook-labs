case:
  id: DR-CORPUS-NX-06cb0bef-E2@v1
  title: Strategic Force Priorities After the Cuban Missile Crisis
  status: draft
  setting: Soviet Union, in the aftermath of the Cuban missile crisis, around the end of 1962; Soviet leadership
  decider: The Soviet leaders
  agent: The Soviet leaders
  agent_role: decide
  situation: In the aftermath of the Cuban missile crisis, Soviet leaders faced a strategic force imbalance with the United
    States. They assessed their attack forces as substantially outnumbered and their strategic defenses as becoming outdated.
    At the end of 1962, the Soviet intercontinental attack force was limited in comparison with the US force. Some new Soviet
    systems were already in research and development, while US strategic force programs continued. The leaders had to choose
    how to allocate effort across strategic attack forces and defenses, including what place bombers should have in the force
    mix.
  question: What should the Soviet leaders do about committing resources to strategic attack forces and defenses and setting
    the bomber force's place in the force mix?
  options:
    O1:
      do: The Soviet leaders rejected a sustained, high-priority effort to strengthen strategic attack forces and defenses,
        while retaining bombers without seeking numerical parity with the US bomber fleet.
      move: act
      irreversible: false
    O2:
      do: The Soviet leaders approved a sustained, high-priority effort to strengthen strategic attack forces and defenses,
        while retaining bombers without seeking numerical parity with the US bomber fleet.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision point followed the Cuban missile crisis and the failure of Khrushchev's effort to improve the Soviet
      strategic position at one stroke.
  - id: F2
    kind: situation
    status: assessed
    fact: Soviet leaders regarded building a significant deterrent force as their most pressing military requirement.
  - id: F3
    kind: capability
    status: assessed
    fact: Soviet leaders assessed that their strategic attack forces were substantially outnumbered by US missile and bomber
      programs.
  - id: F4
    kind: capability
    status: assessed
    fact: Soviet leaders assessed that their strategic defenses were becoming outdated.
  - id: F5
    kind: capability
    status: assessed
    fact: At the end of 1962, the Soviet intercontinental attack force was smaller than the US force.
  - id: F6
    kind: capability
    status: confirmed
    fact: Several new Soviet strategic systems were already in research and development.
  - id: F7
    kind: situation
    status: confirmed
    fact: US strategic force programs were continuing, and large-scale deployment of a new US force component was imminent.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Leaders regarded a significant deterrent force as their most pressing military requirement and assessed that Soviet
      attack forces were substantially outnumbered while US programs continued. They chose a sustained effort to redress that
      imbalance.
  - id: C2
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The assessment that strategic defenses were becoming outdated reinforced the stated need to strengthen the Soviet
      strategic posture, including by improving defenses.
  - id: C3
    facts:
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Several new Soviet systems were already in research and development, and the chosen effort centered on selected systems
      rather than an undifferentiated expansion.
  - id: C4
    facts:
    - F3
    - F7
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: The chosen force policy retained bombers but did not seek numerical parity with the US bomber fleet; this was a stated
      limit on the response, not a reason to reject strengthening strategic forces altogether.
  reasoning:
    read: The leaders saw a strategic imbalance after the Cuban missile crisis, with Soviet attack forces outnumbered and
      defenses becoming outdated. The trap is to treat redressing the imbalance as requiring numerical matching in every force
      component; the chosen policy was a sustained strengthening effort without matching the US bomber fleet numerically.
    weighing: 'The stated reasons favor O2: a significant deterrent force was the most pressing military requirement, the
      attack-force disparity was growing as US programs continued, and Soviet defenses were becoming outdated. The response
      was a sustained, high-priority effort to strengthen attack forces and defenses, while retaining bombers without seeking
      numerical parity. The balance depends on the leaders'' assessments of the imbalance and the urgency of the deterrent
      requirement.'
    tradecraft: At the decision level, record the assessments driving the commitment, the intended force-policy scope, and
      the explicit choice not to pursue bomber numerical parity. Do not present that limit as a rejection of the broader strengthening
      effort.
    uncertainty: The source gives the leaders' assessments and chosen policy but does not quantify resource tradeoffs or describe
      how uncertainty in those assessments was handled.
    handoff: The decision is attributed to Soviet leaders; the source identifies no separate approval authority or required
      consultation.
    tempting_wrong:
      option: O1
      pull: Avoiding an effort to match the US bomber fleet numerically could make rejecting the broader commitment seem like
        the consistent choice.
      why_wrong: 'The source distinguishes those choices: bombers were retained without numerical matching, while leaders
        approved a sustained, high-priority effort to strengthen strategic attack forces and defenses.'
    rejected:
      O1: The leaders did not reject the broader strengthening effort; they chose it to redress the assessed imbalance and
        improve defenses, while declining only to match the US bomber fleet numerically.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The leaders assessed that Soviet attack forces were not substantially outnumbered and that strategic defenses were
        not becoming outdated.
      then: O1
      why: The source's stated grounds for a high-priority effort to redress the imbalance and improve defenses would be substantially
        weakened.
    would_not_change:
    - id: noflip1
      if: The Soviet bomber fleet remained numerically below the US fleet.
      why: 'That condition alone would not change the broader choice: the selected policy retained bombers without seeking
        numerical parity while still strengthening strategic forces and defenses.'
    watch_for:
    - id: watch1
      what: Whether US strategic force programs continue to widen the disparity assessed by Soviet leaders.
      favors:
      - O2
      why: Continuing US programs were part of the context for the chosen effort to redress the imbalance.
  lesson: A perceived strategic imbalance and outdated defenses can support a sustained strengthening effort when leaders
    regard deterrence as an urgent requirement. That effort need not entail numerical parity in every component of the force
    mix.
  limits: This reasoning reflects the Soviet leaders' assessments and the force-policy choice described for the aftermath
    of the Cuban missile crisis. It does not establish the legality, effectiveness, or desirability of comparable commitments
    in other circumstances.
