case:
  id: DR-CORPUS-NX-60baaa82-E1@v1
  title: Determining the Cause of an Aircraft Mishap
  status: draft
  setting: AAIB investigation of an MQ-1B mishap, 18 September 2012; cause determination.
  decider: The investigating official
  agent: The investigating official
  agent_role: decide
  situation: The MRPA lost satellite data link at 0921:53Z, and civilian ATC stopped receiving its transponder location data
    at approximately the same time. The aircraft crashed at approximately 0926Z, and only a few items of wreckage were recovered;
    parts needed to determine the cause were missing. Before the link loss, records and reported observations showed no anomalies
    with the GCS, crew, maintenance, or operations. Recorded data showed drift in a navigational unit, while expert evidence
    and a simulator reconstruction informed consideration of a possible catastrophic power loss. The cause determination involved
    evidentiary standards of preponderance for a contributing cause and clear and convincing evidence for the actual cause.
  question: What should the investigating official do about attributing the crash to a specific cause, including catastrophic
    power loss, or leaving the cause undetermined?
  options:
    O1:
      do: The investigating official leaves the crash cause unresolved.
      move: act
      irreversible: true
    O2:
      do: The investigating official rejects power loss as cause.
      move: act
      irreversible: true
    O3:
      do: The investigating official accepts power loss as cause.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: At 0921:53Z, the GCS stopped receiving satellite data transmissions from the MRPA, and at approximately the same
      time civilian ATC stopped receiving its transponder location data.
  - id: F2
    kind: situation
    status: confirmed
    fact: The MRPA crashed at approximately 0926Z, about four minutes after losing data link.
  - id: F3
    kind: situation
    status: confirmed
    fact: Only a few items of wreckage were recovered, and parts vital to determining the mishap's cause were not recovered.
  - id: F4
    kind: situation
    status: confirmed
    fact: Before the lost link, the investigation found no anomalies with the GCS, crew, maintenance, or operations; maintenance
      records showed no relevant discrepancies.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The LN-100G navigational unit drifted approximately 0.1 NM from the reported position of the secondary unit, with
      a maximum possible drift of 0.25 NM; the anomaly was unexplained.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Expert witnesses described lost link as rare but not uncommon and said that, even without link recovery, the MRPA
      should have been able to fly its emergency mission profile and return to base.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A catastrophic power loss at 0921:53Z was considered a possible explanation, and a simulator recreation found the
      elapsed time and impact location plausible under that hypothesis.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A catastrophic PCM failure could cause immediate loss of satellite data link and aircraft control, but the transponder
      would have continued operating until the aircraft crashed.
  - id: F9
    kind: authority
    status: confirmed
    fact: The stated evidentiary standards were preponderance of the evidence for identifying a contributing cause and clear
      and convincing evidence for determining the actual cause.
  considerations:
  - id: C1
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Parts vital to determining the cause were not recovered, limiting the investigation’s ability to identify the actual
      cause.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The investigation found no pre-link anomalies in the GCS, crew, maintenance, or operations. The navigational-unit
      drift was unexplained, but was not significant enough to trigger a fault or unit switch, and even a complete failure
      of that unit should still have allowed the emergency mission profile. These findings weaken possible explanations without
      establishing another cause.
  - id: C3
    facts:
    - F1
    - F2
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: 'Catastrophic power loss was plausible: the timing and impact location fit the simulator recreation. But the evidence
      did not establish that it caused the crash; moreover, the described PCM failure would leave the transponder operating,
      unlike the near-simultaneous loss of transponder data.'
  - id: C4
    facts:
    - F7
    - F9
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The investigating official could not find power loss to be a contributing cause by a preponderance of the evidence,
      and could not determine the actual cause by clear and convincing evidence.
  reasoning:
    read: The simultaneous loss of satellite link and transponder data, followed by a crash minutes later, makes a catastrophic
      failure a plausible hypothesis, not an established cause. The trap is treating a plausible reconstruction or the unexplained
      navigational drift as proof when critical wreckage is missing.
    weighing: 'The evidence ruled out or weakened several explanations: there were no reported pre-link anomalies with the
      GCS, crew, maintenance, or operations, and the navigational-unit drift was not considered causal. Power loss remained
      possible and the simulator supported the plausibility of its timing and impact location, but that did not meet the stated
      threshold for finding it a contributing cause. Missing physical evidence also prevented determining the actual cause
      by clear and convincing evidence. The balance therefore favors leaving the cause undetermined.'
    tradecraft: Record the plausible hypothesis and the supporting and limiting evidence separately; state which evidentiary
      threshold was not met rather than converting uncertainty into a definitive causal finding.
    uncertainty: The actual cause of the power loss, and thus the mishap, could not be determined from the evidence available.
    handoff: The investigating official made the cause determination. No further decision-maker or referral is identified
      as necessary to resolve the evidentiary question.
    tempting_wrong:
      option: O3
      pull: The power-loss hypothesis fits the reconstructed timing and impact location, and the link loss coincided with
        the loss of transponder data.
      why_wrong: Plausibility did not establish causation at the required evidentiary standards, and the described PCM-failure
        scenario did not explain why transponder data also stopped.
    rejected:
      O2: Power loss could not be affirmatively ruled out because it remained a plausible explanation.
      O3: Power loss was not established as a contributing cause by a preponderance of the evidence, and the actual cause
        could not be determined by clear and convincing evidence.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Recovered or otherwise reliable evidence established catastrophic power loss as the actual cause by clear and convincing
        evidence.
      then: O3
      why: That evidence would address the identified evidentiary gap and support attributing the crash to power loss.
    - id: flip2
      if: Reliable evidence affirmatively established that catastrophic power loss did not cause the crash.
      then: O2
      why: An affirmative basis ruling out the power-loss hypothesis would support rejecting it rather than leaving that hypothesis
        unresolved.
    would_not_change:
    - id: noflip1
      if: The simulator reconstruction continues to show that the timing and impact location are plausible under a power-loss
        hypothesis, without additional causal evidence.
      why: The investigating official found that this plausibility did not establish power loss as a contributing cause by
        a preponderance of the evidence.
    - id: noflip2
      if: The navigational unit is found to have failed completely, but no evidence connects that failure to the crash.
      why: The investigating official reasoned that even complete failure of that unit should still have allowed the MRPA
        to fly its emergency mission profile.
    watch_for:
    - id: watch1
      what: Additional reliable physical or technical evidence that identifies the cause of the power loss.
      favors:
      - O3
      - O2
      why: Such evidence could either substantiate power loss as the cause or affirmatively rule it out.
  lesson: A plausible causal theory is not a finding of cause when the applicable evidentiary threshold is unmet. State what
    the evidence excludes or weakens, preserve unresolved hypotheses as unresolved, and do not treat missing evidence as proof
    for either side.
  limits: This reasoning addresses a cause determination on a record constrained by missing wreckage and the stated evidentiary
    standards. It does not decide operational responsibility for the lost link or establish what caused the power loss.
  library:
    domain: natsec-other
    family: CORPUS-NX-60baaa82
    source: https://www.airandspaceforces.com/PDF/AircraftAccidentReports/Documents/2013/091812_MQ-1B_CENTCOM_AOR_full.pdf
