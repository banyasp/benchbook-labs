case:
  id: DR-CORPUS-NX-6cedb165-E1@v1
  title: MEC Mishap Cause and Contributing Factor
  status: draft
  setting: Clinton, Maryland, 5 April 2017, United States Air Force accident investigation.
  decider: The Accident Investigation Board
  agent: The Accident Investigation Board
  agent_role: decide
  situation: An F-16C mishap occurred in Clinton, Maryland, on 5 April 2017. The engine experienced overspeed, overtemperature,
    fire, and catastrophic failure. The MEC regulates fuel flow and variable stator vane position, and omission or improper
    installation of its small components can cause malfunction and possible aircraft loss. The differential-pressure pilot
    valve was found without a required retaining ring and anti-rotation pin. MEC work-control documents did not require parts
    inventory after disassembly or before assembly, and some kits and retained parts included excess components. Other considerations
    included the technician’s decision about reusing serviceable parts, the small size of the missing pin, task complexity,
    and human error; misassembly could still have occurred with an adequate accountability program.
  question: What should the Accident Investigation Board find about the cause and contributing factor in the mishap?
  options:
    O1:
      do: The Accident Investigation Board rejects the finding that incorrect assembly caused the mishap and inadequate MEC
        parts-accountability procedures substantially contributed.
      move: act
      irreversible: true
    O2:
      do: The Accident Investigation Board adopts the finding that incorrect assembly caused the mishap and inadequate MEC
        parts-accountability procedures substantially contributed.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The mishap involved an F-16C, tail number 87-0306, on 5 April 2017 in Clinton, Maryland.
  - id: F2
    kind: situation
    status: confirmed
    fact: The differential-pressure pilot valve was missing a required retaining ring and the anti-rotation pin.
  - id: F3
    kind: situation
    status: confirmed
    fact: The engine experienced severe overspeed, severe overtemperature, fire, and catastrophic failure.
  - id: F4
    kind: capability
    status: confirmed
    fact: The MEC regulates fuel flow and variable stator vane position; omission or improper installation of its small components
      can cause malfunction and possible aircraft loss.
  - id: F5
    kind: situation
    status: confirmed
    fact: MEC work-control documents did not require inventory of parts after disassembly or before assembly.
  - id: F6
    kind: situation
    status: confirmed
    fact: Some MEC part kits contained excess parts, mechanics retained excess parts from previous overhauls, and there was
      no definitive method to determine that all parts were used during assembly.
  - id: F7
    kind: authority
    status: confirmed
    fact: The applicable Technical Order emphasized the critical role of parts accountability but did not detail a methodology
      for implementing an accountability protocol.
  - id: F8
    kind: situation
    status: confirmed
    fact: MEC teardown and post-mishap technical analysis identified an unidentified backing ring or foreign object debris
      and an incorrect Vitron seal within the MEC.
  - id: F9
    kind: situation
    status: assessed
    fact: The technician’s decision about reuse of serviceable parts, the small size of the missing pin, task complexity,
      and human error were relevant considerations; misassembly could still have occurred with an adequate parts-accountability
      program.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Board found that the missing components caused the MEC malfunction and uncontrolled engine operation that led
      to catastrophic failure, supporting incorrect assembly as the cause.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: The shop lacked adequate procedural requirements for parts accountability; excess parts and the absence of a definitive
      way to confirm parts use supported the Board's finding that this deficiency substantially contributed.
  - id: C3
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The Board considered reuse decisions, the small size of the missing pin, task complexity, and human error, and acknowledged
      that misassembly could still have occurred with adequate accountability procedures. It nevertheless treated those points
      as limits on the contributor's role, not reasons to reject the finding.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The additional irregularities identified in the MEC were consistent with the Board's concern about parts accountability,
      though the Board identified the missing components—not these other findings—as the cause.
  reasoning:
    read: 'This is a two-part finding under a preponderance-of-evidence standard: identify the cause of the failure and separately
      assess a substantial contributing factor. The trap is treating inadequate accountability as either the sole cause or
      as irrelevant because it could not guarantee prevention.'
    weighing: The Board found the missing components caused the MEC malfunction and catastrophic engine failure {C1}. It also
      found inadequate parts-accountability procedures substantially contributed because they could have reduced the likelihood
      of omission, despite not being independently responsible for the mishap {C2}. The technician and task-related considerations
      weigh against treating the procedural deficiency as determinative, but do not outweigh the Board's finding that it contributed
      {C3}.
    tradecraft: Record the causal finding separately from the contributing-factor finding, and preserve the distinction between
      a factor that increases risk and one that guarantees prevention. Keep the stated evidentiary standard and the limitations
      of the Board's attribution clear.
    uncertainty: The Board applied a preponderance standard and acknowledged that misassembly could have occurred even with
      an adequate accountability program. Its conclusion was that the procedural deficiency substantially contributed, not
      that it was the only cause or that adequate procedures would certainly have prevented the mishap.
    handoff: The Accident Investigation Board made the finding after consulting technical experts and interviewing maintenance
      and operations personnel. The record supports the Board's judgment; no further decision-maker is identified as necessary
      for this finding.
    tempting_wrong:
      option: O1
      pull: The Board acknowledged that adequate parts accountability would not necessarily have prevented misassembly.
      why_wrong: That point limits the strength of the procedural factor but does not negate the Board's finding that accountability
        controls could have reduced the likelihood of omission and that their absence substantially contributed.
    rejected:
      O1: The Board rejected this outcome because it found, by a preponderance of the evidence, that incorrect assembly caused
        the mishap and inadequate parts-accountability procedures substantially contributed.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The evidence did not support a causal connection between the missing components, the MEC malfunction, and the engine
        failure.
      then: O1
      why: The Board's causal finding depends on that connection; without it, the stated basis for adopting the cause finding
        would be absent.
    - id: flip2
      if: The evidence instead established adequate parts-accountability procedures and no relevant accountability deficiency
        in the overhaul process.
      then: O1
      why: That would remove the factual basis for finding inadequate accountability procedures a substantial contributing
        factor.
    would_not_change:
    - id: noflip1
      if: An adequate parts-accountability program could not guarantee that misassembly would be prevented.
      why: The Board expressly reasoned that misassembly could still have occurred with an adequate program, yet found the
        actual lack of accountability substantially contributed; lack of guaranteed prevention alone does not reverse the
        finding.
    watch_for:
    - id: watch1
      what: Evidence about parts reuse decisions, the small size of the missing pin, task complexity, and human error.
      favors:
      - O1
      why: The Board treated these as relevant alternative considerations when assessing how much weight to give the accountability
        deficiency.
  lesson: A contributing factor need not be the sole cause or guarantee that the mishap would have been prevented. Assess
    whether the evidence shows it materially increased the likelihood of the causal failure, while giving due weight to alternative
    explanations and limits on the inference.
  limits: This reasoning concerns the Board's findings about this mishap under a preponderance-of-evidence standard. It does
    not determine individual responsibility, establish legal liability, or prescribe maintenance procedures.
