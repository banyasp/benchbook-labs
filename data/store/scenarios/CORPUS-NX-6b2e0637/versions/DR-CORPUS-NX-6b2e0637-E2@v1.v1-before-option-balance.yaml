case:
  id: DR-CORPUS-NX-6b2e0637-E2@v1
  title: The Defense of Ortona
  status: draft
  setting: Ortona, December 1943, German command during the Battle of Ortona.
  decider: The German leader
  agent: The German leader
  agent_role: decide
  situation: Ortona was the eastern anchor of the Gustav Line. An Allied advance north from the town could reach Pescara,
    where roads and mountain passes provided access toward Rome from the northeast. The German operational aim was to stop
    the Canadian advance north, while Canadian forces had reached Ortona's main defensive area and German forces had been
    reinforced. The choice is whether the German leader continues defending Ortona or withdraws German forces from it.
  question: What should the German leader do about the defense of Ortona as the Allies advance north?
  options:
    O1:
      do: The German leader holds Ortona and keeps German forces there.
      move: act
      irreversible: false
    O2:
      do: The German leader abandons Ortona and withdraws German forces.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Ortona was the eastern anchor of the Gustav Line.
  - id: F2
    kind: intelligence
    status: assessed
    fact: An Allied advance north from Ortona could reach Pescara, where roads and mountain passes provided access to Rome
      from the northeast.
  - id: F3
    kind: situation
    status: confirmed
    fact: The German strategic and operational intent was to stop the Canadian advance from Ortona north to Pescara.
  - id: F4
    kind: situation
    status: confirmed
    fact: By December 24, Canadian forces had reached several squares that formed Ortona's main defensive area.
  - id: F5
    kind: capability
    status: confirmed
    fact: The German defenders reinforced the 2nd Battalion, 3rd Parachute Regiment with the 2nd Battalion, 4th Parachute
      Regiment.
  - id: F6
    kind: authority
    status: confirmed
    fact: The German leader declared that Ortona was to be held at all costs.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Ortona anchored the Gustav Line, and an Allied advance north could open access through Pescara toward Rome. Holding
      the town served the stated German operational aim of stopping that advance.
  - id: C2
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: bar
    why: The German leader expressly directed that Ortona be held at all costs, settling the stated choice in favor of remaining
      rather than withdrawing.
    rules_out:
    - O2
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Canadian forces had reached the town's main defensive area, but German forces were reinforced. The source presents
      this as a determined stand the Germans continued to prepare for, not as a reason to abandon the position.
  reasoning:
    read: 'Ortona was not just a town under pressure: its position as the Gustav Line''s eastern anchor connected the defense
      to the route north toward Pescara and Rome. The trap is to treat the Allies'' arrival at the main defensive area as,
      by itself, a reason to withdraw, overlooking the strategic purpose of holding Ortona and the explicit order.'
    weighing: The strategic aim and the town's importance favor holding {C1}. The reinforcement despite Allied progress is
      consistent with continuing the defense {C3}. Most decisively, the German leader ordered that Ortona be held at all costs
      {C2}; under that stated direction, withdrawal was not the selected course.
    tradecraft: Record the hold decision, its strategic rationale, and the authority directing it. Keep any reassessment at
      the command level and document a changed order or a material change in the town's strategic role before treating withdrawal
      as an available course.
    uncertainty: The stated rationale identifies the strategic purpose and the hold order, but does not assess the likely
      costs of continued defense, civilian effects, or the feasibility of withdrawal. The account here also ends on December
      24, so it does not establish later developments.
    handoff: The German leader who issued the hold direction owns the decision. Any departure from it should be referred through
      the command authority that can change that direction.
    tempting_wrong:
      option: O2
      pull: With Allied forces at Ortona's main defensive area, withdrawal may seem to avoid continuing a difficult defense.
      why_wrong: That pressure does not displace the stated strategic purpose of holding the eastern anchor or the express
        direction to hold it at all costs {C1} {C2}.
    rejected:
      O2: Withdrawal was not chosen because it would abandon the Gustav Line's eastern anchor and conflict with the explicit
        direction to hold Ortona.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The German command rescinded the hold direction and ordered a withdrawal.
      then: O2
      why: That would replace the stated command decision that settles the present choice.
    - id: flip2
      if: Ortona ceased to serve as the eastern anchor and no longer protected the northward route through Pescara toward
        Rome.
      then: O2
      why: The principal strategic rationale given for holding the town would no longer apply.
    would_not_change:
    - id: noflip1
      if: Allied forces reached the main defensive area while Ortona retained its strategic role and the hold direction remained
        in force.
      why: The account describes that pressure alongside German reinforcement and the continuing direction to hold, rather
        than as grounds for withdrawal.
    watch_for:
    - id: watch1
      what: Whether Ortona remains strategically necessary to stop the northward advance and whether the hold direction remains
        in force.
      favors:
      - O1
      - O2
      why: The stated case for holding depends on the town's role in the German operational aim; a changed role or command
        direction could support reassessment.
  lesson: A position's strategic function and the authority's express direction can outweigh immediate pressure at that position.
    Reconsider the decision if the strategic rationale or the governing command direction materially changes.
  limits: This reasoning applies to the stated December 1943 decision and does not establish the legal or ethical merits of
    the defense in other circumstances. The account supplies no assessment of civilian effects, the costs of continued defense,
    or the feasibility of withdrawal.
