case:
  id: DR-CORPUS-NX-1678bd86-E4@v1
  title: Intelligence Support at the Pierre
  status: draft
  setting: The Pierre, during the President-elect's transition; the Agency.
  decider: The adviser
  agent: The adviser
  agent_role: decide
  situation: The President-elect was preparing to assume office, and the adviser was considering recommendations to the Agency
    about intelligence support at the Pierre. The adviser wanted time to become familiar with the President-elect's reading
    habits and daily routine. The adviser understood that the President-elect would not read material unless senior staff
    had first reviewed and perhaps summarized it. The adviser regarded the PDB's prose and topic selection as difficult for
    an uninitiated reader. Campaign staff could potentially access classified publications after reaching Washington, and
    the adviser considered them to have no need for those materials before then.
  question: What should the adviser do about intelligence support for campaign staff at the Pierre and their access to classified
    publications?
  options:
    O1:
      do: The adviser should permit campaign staff to consult classified publications at the Pierre and limit other intelligence
        support for them until they arrive in Washington.
      move: partial
      irreversible: false
    O2:
      do: The adviser should prohibit intelligence support for campaign staff at the Pierre and permit their access to classified
        publications after they arrive in Washington.
      move: act
      irreversible: false
    O3:
      do: The adviser should permit intelligence support for campaign staff at the Pierre and permit their access to classified
        publications before they arrive in Washington.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The adviser sought time to learn the President-elect's reading habits and daily routine before advising the Agency
      about possible changes.
  - id: F2
    kind: situation
    status: assessed
    fact: The adviser understood that the President-elect would not read material unless senior staff had first reviewed and
      perhaps summarized it.
  - id: F3
    kind: situation
    status: assessed
    fact: The adviser considered the PDB prose too elliptical for an uninitiated reader.
  - id: F4
    kind: situation
    status: assessed
    fact: The adviser considered the PDB's topic selection too random and lacking the continuity an uninitiated reader needed.
  - id: F5
    kind: situation
    status: confirmed
    fact: Campaign staff might have access to classified publications after they arrived in Washington.
  - id: F6
    kind: situation
    status: assessed
    fact: The adviser considered campaign staff to have no need for the classified publications before they arrived in Washington.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The adviser wanted time to understand the President-elect's habits before recommending changes, supporting a limited
      approach to staff access while that assessment was made.
  - id: C2
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Because the President-elect depended on senior staff to review and summarize material, staff involvement could help
      intelligence reach him in a usable form.
  - id: C3
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The adviser regarded the PDB as difficult for an uninitiated reader to use, which supports keeping intelligence support
      at the Pierre to the President-elect and the adviser rather than extending it to campaign staff.
  - id: C4
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Campaign staff could access classified publications after reaching Washington, and the adviser assessed that they
      had no need for them before then; the later access therefore did not require access at the Pierre.
  reasoning:
    read: The adviser was deciding who should receive intelligence support at the Pierre and when campaign staff should have
      access to classified publications. The trap is to treat the President-elect's reliance on senior staff to review material
      as establishing that those staff needed access at the Pierre; the adviser distinguished their later access from their
      lack of need before reaching Washington.
    weighing: The President-elect's reliance on staff review gave some reason to favor staff involvement {C2}, but the adviser
      wanted time to understand the President-elect's reading habits {C1} and considered the PDB difficult for an uninitiated
      reader {C3}. Most importantly, campaign staff could access the publications after arriving in Washington and were considered
      to have no need for them earlier {C4}. That timing judgment supports {O2}; the balance depends on the assessed absence
      of a pre-arrival need, not on a stated security threat or legal rule.
    tradecraft: Record the Pierre restriction, the permitted access after arrival in Washington, and the adviser's stated
      reason for that timing. Ask the Agency to implement the boundary and avoid adding access rules or grounds the adviser
      did not state.
    uncertainty: The account does not identify specific campaign staff, define the full set of classified publications, or
      state a formal legal or security standard. It also does not establish what access arrangements would be appropriate
      if staff had a need before reaching Washington.
    handoff: The adviser should communicate the decision to the Agency because it is the body whose intelligence support is
      being limited. The account gives no basis for requiring referral to a higher authority.
    tempting_wrong:
      option: O1
      pull: Allowing staff to consult publications at the Pierre could support the President-elect's reliance on senior staff
        to review and summarize material.
      why_wrong: That role did not establish a need for campaign staff to access classified publications before reaching Washington,
        and the adviser expressly limited intelligence support at the Pierre to the President-elect and the adviser.
    rejected:
      O1: It would allow campaign staff to consult classified publications at the Pierre despite the adviser's stated restriction
        and assessment that they had no need for them before Washington.
      O3: It would provide campaign staff both intelligence support and early access to publications, contrary to the adviser's
        stated boundary and timing judgment.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C4
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Campaign staff had a demonstrated need for classified publications before reaching Washington.
      then: O1
      why: The adviser's stated reason for delaying staff access was that they had no need for the material before then; a
        demonstrated need would weaken that reason and could support limited access.
    would_not_change:
    - id: noflip1
      if: The PDB's prose and topic selection were improved, but campaign staff still had no need for the publications before
        arriving in Washington.
      why: Improved readability would not by itself alter the adviser's separate timing judgment that staff did not need the
        material before arrival.
    watch_for:
    - id: watch1
      what: Whether campaign staff have a concrete need for classified publications at the Pierre.
      favors:
      - O1
      why: A pre-arrival need would directly test the adviser's stated basis for postponing their access.
  lesson: Distinguish a person's role in helping a principal understand information from a need to receive that information
    at a particular place and time. Where the stated reason for restricting access is temporary lack of need, preserve the
    limit while allowing access when the specified timing condition is met.
  limits: This reasoning applies to the adviser's stated transition-period judgment about staff access at the Pierre. It does
    not establish a general rule about campaign staff, classified information, or situations where a concrete earlier need
    or different authority is present.
