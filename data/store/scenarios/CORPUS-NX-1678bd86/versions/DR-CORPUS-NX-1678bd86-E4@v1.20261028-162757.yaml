    domain: intel-oversight
    family: CORPUS-NX-1678bd86
    source: https://www.cia.gov/static/d85ee3e334bc8ee23ff08ead7d5bf08f/Presidents-Daily-Brief-Delivering-Intelligence-to-Nixon-and-Ford.pdf
    episode_focus: The adviser chose to restrict who could receive intelligence support at the facility, while allowing campaign
      staff access to classified publications after they arrived in Washington. The stated reason was that those staff did
      not need the material before then; exclude the separate question of how the publications were produced or delivered.
    cues:
