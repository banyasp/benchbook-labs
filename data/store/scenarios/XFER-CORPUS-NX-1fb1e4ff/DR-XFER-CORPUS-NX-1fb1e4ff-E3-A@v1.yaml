case:
  id: DR-XFER-CORPUS-NX-1fb1e4ff-E3-A@v1
  title: Two Partner Assessments of an Enrichment Program
  status: draft
  setting: Vienna, autumn 2025; a national-laboratory assessment office supporting an arms-control delegation reviewing a
    third state's uranium-enrichment program.
  decider: the assessment office
  agent: the assessment office
  agent_role: decide
  situation: The assessment office is preparing a briefing for an arms-control delegation on a third state's uranium-enrichment
    program. Partner B's assessment places installed capacity and output substantially above the office's evidence and describes
    the program as continuing to grow. Partner A expects the program to replace losses from an industrial accident by summer,
    add a new hall by a stated date, and identifies a weapon-scale stockpile as the state's goal for this year. The office's
    own assessment describes substantial present capacity but also significant supply constraints on expansion beyond a year.
    The office must decide what estimate to give the delegation amid these differing assessments.
  question: What should the assessment office conclude and give the delegation about the third state's enrichment program?
  options:
    O1:
      do: The assessment office rejects Partner B's assessment and gives the delegation its own conclusions.
      move: act
      irreversible: false
    O2:
      do: The assessment office endorses Partner B's assessment and gives it to the delegation as its own.
      move: act
      irreversible: false
    O3:
      do: The assessment office endorses Partner A's assessment and gives it to the delegation as its own.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The office is preparing a briefing that compares two partner governments' assessments of a third state's uranium-enrichment
      program.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Partner B's assessment places installed enrichment capacity and output substantially above the levels in the office's
      evidence base.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Partner B's assessment describes the enrichment program as continuing to grow.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The office's assessment describes the state's present enrichment capacity as substantial.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The office's assessment identifies supply constraints that limit expansion beyond a year.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Partner A expects the program to replace losses from an industrial accident by summer.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Partner A expects a new enrichment hall to be added by a stated date.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Partner A describes a weapon-scale stockpile as the state's goal for this year.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The office judged that Partner B's assessment substantially overstated installed capacity and output and overread
      the program's growth, so it did not treat Partner B's account as a sound estimate to adopt.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The office judged that Partner A's assessment tilted in the opposite direction, making specific claims about recovery,
      expansion timelines, and intent that the office's own evidence did not establish.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: 'The office''s estimate was qualified rather than a simple endorsement of Partner B: it assessed substantial present
      capacity while also judging that supply constraints limited expansion beyond a year.'
  reasoning:
    read: 'The decision is how to brief the delegation amid opposing partner assessments, not which partner to repeat. The
      trap is treating Partner A and Partner B as exhaustive alternatives: the office judged that they erred in opposite directions
      and had its own qualified view of present capacity and future expansion.'
    weighing: 'The office''s stated reason for rejecting Partner B''s estimate was its overstatement of installed capacity
      and output and its account of continuing growth {C1}. It also judged that Partner A''s assessment leaned the other way,
      with forecasts about recovery and a new hall and a claim about the state''s goal that were not established by the office''s
      evidence {C2}. Its estimate retained important qualifications: present capacity was substantial, but supply constraints
      limited expansion beyond a year. Taken together, these judgments support giving the office''s own conclusions rather
      than adopting either partner''s assessment wholesale {C3}.'
    tradecraft: Give the office's estimate as its own, separating its judgments about present capacity, output, and the constraints
      on future expansion. Keep timelines and claims about the state's goal distinct from assessed capability, and do not
      turn a stated goal into a claim that the program can achieve it.
    uncertainty: These are assessments, and the partner records differ sharply. The office's own conclusions distinguish present
      capacity from future expansion under supply constraints; the conditions required for the partners' projected timelines
      are not stated as having been met.
    handoff: The assessment office is the decision-maker in this scenario. The excerpt supplies no reason to refer the estimate
      to another authority; the appropriate handoff is to give the delegation the office's conclusions without presenting
      either partner's view as the office's own.
    tempting_wrong:
      option: O3
      pull: Partner A gives concrete expectations about replacing accident-related losses and adding a new hall, and identifies
        the state's goal for this year.
      why_wrong: The office judged that Partner A's assessment tilted in the opposite direction from Partner B's and did not
        regard its timelines or claim about intent as established by the office's evidence; a stated goal does not by itself
        establish capacity.
    rejected:
      O3: The office did not adopt Partner A's assessment because it judged that assessment to tilt in the opposite direction
        from Partner B's and to assert timelines and intent not established by its own evidence.
      O2: The office rejected Partner B's assessment because it judged that Partner B substantially overstated installed capacity
        and output and overread the program's growth.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that Partner B's account, rather than the office's contrary assessment, accurately
        represented installed capacity, output, and the program's growth.
      then: O2
      why: The office's stated reason for rejecting Partner B's account was its judgment that it overstated capacity and output
        and mischaracterized growth.
    - id: flip2
      if: Reliable evidence established that Partner A's assessment was better calibrated across both the program's timelines
        and the state's intent, rather than merely confirming one of its predictions.
      then: O3
      why: That would remove the office's stated basis for treating Partner A's assessment as the opposite, erroneous estimate.
    would_not_change:
    - id: noflip1
      if: The state's goal remained to obtain a weapon-scale stockpile this year.
      why: The office distinguished the state's stated goal from its capacity to achieve it; the goal alone would not displace
        its assessment of capacity and supply constraints.
    watch_for:
    - id: watch1
      what: Whether the program could replace its accident-related losses by summer and add a new hall by the stated date
        without supply constraints limiting sustained expansion.
      favors:
      - O1
      why: The office's assessment of the timelines and expansion capacity would need reconsideration if those conditions
        were established.
  lesson: When competing assessments conflict, do not adopt either wholesale if the decision-maker's own analysis identifies
    opposing biases. Separate present capacity, expansion constraints, timelines, and stated intent, and distinguish a state's
    goal from its ability to achieve it.
  limits: This reasoning applies to the assessment office's briefing on the enrichment program and the conclusions available
    at the decision point. It does not establish what later evidence showed, whether either partner's predictions proved accurate,
    or what nonproliferation action should follow.
