case:
  id: DR-XFER-CORPUS-NX-1fb1e4ff-E3-A-flip1@v1
  title: Two Partner Assessments of an Enrichment Program
  status: draft
  setting: Vienna, autumn 2025; a national-laboratory assessment office supporting an arms-control delegation reviewing a
    third state's uranium-enrichment program.
  decider: the assessment office
  agent: the assessment office
  agent_role: decide
  situation: The assessment office is preparing a briefing for an arms-control delegation on a third state's uranium-enrichment
    program. Partner B's assessment places installed capacity and output substantially above the office's evidence and describes
    the program as continuing to grow. Reliable evidence establishes that Partner B's account accurately represents installed
    capacity, output, and the program's growth. Partner A expects the program to replace losses from an industrial accident
    by summer, add a new hall by a stated date, and identifies a weapon-scale stockpile as the state's goal for this year.
    The office's own assessment describes substantial present capacity but also significant supply constraints on expansion
    beyond a year. The office must decide what estimate to give the delegation amid these differing assessments.
  question: What should the assessment office conclude and give the delegation about the third state's enrichment program?
  options:
    O1:
      do: The assessment office rejects Partner B's assessment and gives the delegation its own conclusions.
      move: act
      irreversible: false
    O2:
      do: The assessment office endorses Partner B's assessment and gives it to the delegation as its own.
      move: act
      irreversible: false
    O3:
      do: The assessment office endorses Partner A's assessment and gives it to the delegation as its own.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The office is preparing a briefing that compares two partner governments' assessments of a third state's uranium-enrichment
      program.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Partner B's assessment places installed enrichment capacity and output substantially above the levels in the office's
      evidence base.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Partner B's assessment describes the enrichment program as continuing to grow.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The office's assessment describes the state's present enrichment capacity as substantial.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The office's assessment identifies supply constraints that limit expansion beyond a year.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Partner A expects the program to replace losses from an industrial accident by summer.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Partner A expects a new enrichment hall to be added by a stated date.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Partner A describes a weapon-scale stockpile as the state's goal for this year.
  - id: F9
    kind: intelligence
    status: confirmed
    fact: Reliable evidence establishes that Partner B's account accurately represents installed capacity, output, and the
      program's growth.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Reliable evidence confirms that Partner B's account accurately represents installed capacity, output, and growth,
      removing the office's stated basis for rejecting it and supporting its use as the briefing estimate.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Partner A's specific claims about recovery, expansion timelines, and intent remain unestablished by the office's
      evidence. This weighs against adopting Partner A's assessment, while not undermining the reliable evidence supporting
      Partner B.
  - id: C3
    facts:
    - F4
    - F5
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The office's assessment still identifies supply constraints on expansion beyond a year, but reliable evidence establishes
      that Partner B accurately represents capacity, output, and growth. The constraints remain a qualification, not a reason
      to reject Partner B's account on those measures.
  reasoning:
    read: The decision is how to brief the delegation amid differing partner assessments, not which partner to repeat automatically.
      Reliable evidence now establishes that Partner B accurately represents installed capacity, output, and program growth.
      Partner A's more specific timelines and claim about intent remain unestablished, while the office's supply-constraint
      assessment remains a qualification about expansion beyond a year.
    weighing: The office's stated reason for rejecting Partner B's estimate was its judgment that it overstated installed
      capacity and output and its account of continuing growth was inaccurate. Reliable evidence now establishes that Partner
      B accurately represents those measures, removing that reason for rejection and supporting endorsement of Partner B's
      assessment {C1}. Partner A's assessment still includes forecasts about recovery and a new hall and a claim about the
      state's goal that the office's evidence does not establish, so it is not the better assessment to adopt {C2}. The office's
      supply-constraint judgment remains relevant to expansion beyond a year, but does not displace the reliable evidence
      for Partner B's account of capacity, output, and growth {C3}.
    tradecraft: Give Partner B's assessment as the office's estimate because reliable evidence establishes its accuracy on
      installed capacity, output, and growth. Retain the office's qualification about supply constraints beyond a year, and
      keep Partner A's timelines and claim about the state's goal distinct from established capability.
    uncertainty: The assessments concern different measures and time horizons. Reliable evidence establishes the accuracy
      of Partner B's account of capacity, output, and growth; the office's assessment still identifies supply constraints
      beyond a year, and Partner A's projected timelines and claim about intent are not established.
    handoff: The assessment office is the decision-maker in this scenario. The excerpt supplies no reason to refer the estimate
      to another authority; the appropriate handoff is to give the delegation Partner B's evidence-supported conclusions as
      the office's own, with the office's longer-term supply-constraint qualification.
    tempting_wrong:
      option: O1
      pull: The office has its own qualified assessment, including a judgment about supply constraints beyond a year.
      why_wrong: Reliable evidence establishes that Partner B accurately represents installed capacity, output, and growth,
        directly undercutting the office's stated basis for rejecting Partner B. The remaining qualification about longer-term
        supply constraints does not justify substituting the office's contrary estimate on those measures.
    rejected:
      O1: 'The office''s stated reasons for rejecting Partner B no longer hold: reliable evidence establishes that Partner
        B accurately represents installed capacity, output, and growth.'
      O3: Partner A's forecasts about recovery and a new hall and its claim about the state's goal remain unestablished by
        the office's evidence; Partner B's account is the assessment supported by reliable evidence.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence did not establish that Partner B's account, rather than the office's contrary assessment, accurately
        represented installed capacity, output, and the program's growth.
      then: O1
      why: Without that evidence, the office's stated basis for rejecting Partner B would remain, supporting its original
        choice to give the delegation its own conclusions.
    would_not_change:
    - id: noflip1
      if: The state's goal remained to obtain a weapon-scale stockpile this year.
      why: The office distinguished the state's stated goal from its capacity to achieve it; the goal alone would not displace
        an evidence-supported assessment of capacity and growth.
    watch_for:
    - id: watch1
      what: Whether the program could replace its accident-related losses by summer and add a new hall by the stated date
        without supply constraints limiting sustained expansion.
      favors:
      - O1
      why: The office's assessment of the timelines and expansion capacity would need reconsideration if those conditions
        were established.
  lesson: When competing assessments conflict, check whether reliable evidence resolves the disagreement rather than automatically
    adopting the decision-maker's own estimate or either partner's account. Separate present capacity, output, expansion constraints,
    timelines, and stated intent, and distinguish a state's goal from its ability to achieve it.
  limits: This reasoning applies to the assessment office's briefing on the enrichment program and the evidence available
    at the decision point. It does not establish what later evidence showed, whether Partner A's predictions proved accurate,
    or what nonproliferation action should follow.
