case:
  id: DR-XFER-CORPUS-NX-1fb1e4ff-E3-B@v1
  title: Two Partner Attributions of a Cyber Campaign
  status: draft
  setting: National cyber center assessment cell, 2026; briefing preparation for national security council staff.
  decider: the assessment cell
  agent: the assessment cell
  agent_role: decide
  situation: The national cyber center assessment cell is preparing a briefing on a disruptive campaign affecting regional
    infrastructure. Partner A expects the actor to rebuild lost infrastructure within weeks and describes a nationwide outage
    as its aim. Partner B assesses the actor's reach and resources as substantially greater than the evidence in the cell's
    record indicates. The cell's own assessment describes current capability alongside stretched resources and distinguishes
    the actor's stated aim from the scale of action it can sustain. The campaign is moving quickly, and the national security
    council staff wants a single headline estimate for its next briefing.
  question: What should the assessment cell conclude and transmit about the actor's reach, resources, and capacity for a nationwide
    outage?
  options:
    O1:
      do: The cell endorses Partner A's assessment and transmits it as its own.
      move: act
      irreversible: false
    O2:
      do: The cell rejects Partner B's assessment and transmits its own conclusions.
      move: act
      irreversible: false
    O3:
      do: The cell endorses Partner B's assessment and transmits it as its own.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The cell's briefing record covers a disruptive campaign affecting infrastructure services in several regions.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Partner B's assessment estimates that the actor can sustain disruptive activity across ten jurisdictions.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Partner B's assessment describes the actor's available resources as several times greater than the levels corroborated
      in the cell's record.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Partner A expects the actor to restore lost infrastructure capability within three weeks.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Partner A identifies a nationwide infrastructure outage as the actor's aim for the current campaign.
  - id: F6
    kind: capability
    status: assessed
    fact: The cell assesses that the actor can currently disrupt services across several regions, while its available resources
      are stretched.
  - id: F7
    kind: situation
    status: assessed
    fact: The cell's record indicates that the actor's personnel and service-restoration resources are committed to sustaining
      ongoing activity in multiple regions.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The largest campaign in the cell's prior record affected several regions but did not produce a nationwide infrastructure
      outage.
  - id: F9
    kind: capability
    status: assessed
    fact: The cell assesses that, if the actor restores its losses and can do so without risking its other regional commitments,
      it could mount a campaign approaching the scale of its previous peak.
  - id: F10
    kind: capability
    status: assessed
    fact: The cell's prior reporting records instances in which the actor redirected limited organizational support among
      regional efforts.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The cell judged that Partner B's assessment grossly exaggerated the actor's reach and resources, so it did not treat
      that account as a sound estimate to adopt.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    - F7
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The cell judged that Partner A's assessment tilted in the opposite direction. It considered a nationwide outage beyond
      the actor's capabilities, while allowing that the actor might mount a campaign approaching its prior peak if it restored
      its losses and could sustain the effort without risking its other regional commitments.
  - id: C3
    facts:
    - F6
    - F7
    - F9
    - F10
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: 'The cell''s estimate was qualified rather than a simple endorsement of Partner B''s account: it assessed current
      capacity to disrupt services across several regions, but also judged the actor''s resources strained and its ability
      to sustain operations at that level limited.'
  reasoning:
    read: 'The decision is how to brief an estimate amid opposing partner assessments, not which partner to repeat. The trap
      is treating Partner A and Partner B as exhaustive alternatives: the cell judged that they erred in opposite directions
      and supplied its own qualified view of the actor''s reach, resources, and capacity for a nationwide outage.'
    weighing: 'The cell''s stated reason for rejecting Partner B''s estimate was its exaggeration of the actor''s reach and
      resources {C1}. It also judged that Partner A''s assessment leaned the other way, while concluding that a nationwide
      outage was beyond the actor''s capabilities {C2}. Its estimate retained important qualifications: the actor can currently
      disrupt services across several regions, but its resources are stretched, and its ability to redirect limited support
      may aid regrouping. The actor might nevertheless mount a campaign approaching its prior peak if it restored its losses
      and could do so without risk to its other regional commitments. Taken together, these judgments support transmitting
      the cell''s own conclusions rather than adopting either partner''s assessment wholesale {C3}.'
    tradecraft: Transmit the cell's estimate as its own, separating its judgments about current reach, resource constraints,
      and conditional capacity. Keep the stated conditions on the actor's capacity explicit, and do not turn an estimate of
      its aim into a claim that it has the capacity to achieve it. The council staff's request for a single headline estimate
      does not require presenting a partner's assessment as the cell's own.
    uncertainty: These are estimates, and the record contains sharply conflicting partner assessments. The cell's own conclusions
      distinguish present constraints from conditional capacity; the conditions for a campaign approaching the actor's prior
      peak are not stated as having been met.
    handoff: The assessment cell is the decision-maker in this scenario. The excerpt supplies no reason to refer the estimate
      to another authority; the appropriate handoff is to brief the cell's conclusions to the national security council staff
      without presenting either partner's view as the cell's own.
    tempting_wrong:
      option: O1
      pull: Partner A gives a concrete expectation about restoring lost infrastructure and identifies the actor's aim. The
        fast-moving campaign and request for a single headline estimate also create pressure to use a partner product.
      why_wrong: The cell judged that Partner A's assessment tilted in the opposite direction from Partner B's and concluded
        that a nationwide outage was beyond the actor's capabilities; the stated aim does not by itself establish capacity.
    rejected:
      O1: The cell did not adopt Partner A's assessment because it judged that assessment to err in the opposite direction
        from Partner B's account and assessed nationwide outage capacity as beyond the actor's limits.
      O3: The cell rejected Partner B's assessment because it judged that Partner B grossly exaggerated the actor's reach
        and resources.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that Partner B's account, rather than the cell's contrary assessment, accurately represented
        the actor's reach and resources.
      then: O3
      why: The cell's stated reason for rejecting Partner B's account was its judgment that it exaggerated the actor's reach
        and resources.
    - id: flip2
      if: Reliable evidence established that Partner A's assessment was better calibrated across both the actor's reach and
        its capacity for a nationwide outage, rather than merely confirming one of its predictions.
      then: O1
      why: That would remove the cell's stated basis for treating Partner A's assessment as the opposite, erroneous estimate.
    would_not_change:
    - id: noflip1
      if: The actor's aim remained a nationwide infrastructure outage.
      why: The cell distinguished the actor's aim from its capacity to conduct a nationwide outage; the aim alone would not
        displace its capacity assessment.
    watch_for:
    - id: watch1
      what: Whether the actor could restore its losses and sustain the effort without risk from diverting resources from its
        other regional commitments.
      favors:
      - O1
      why: The cell stated that if those conditions held, the actor could mount a campaign approaching the scale of its previous
        peak.
  lesson: When competing assessments conflict, do not adopt either wholesale if the decision-maker's own analysis identifies
    opposing biases. Separate current reach, resource constraints, and conditional capacity, and distinguish an adversary's
    stated aim from its ability to carry it out.
  limits: This reasoning applies to the assessment cell's estimate at the time of this briefing and the conclusions recorded
    in this scenario. It does not establish what later evidence showed, whether the partner assessments proved accurate, or
    what operational action should follow.
