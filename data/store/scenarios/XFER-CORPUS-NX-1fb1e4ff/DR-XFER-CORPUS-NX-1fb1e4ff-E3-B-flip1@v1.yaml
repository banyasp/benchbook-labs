    episode_focus: 'Treat the station’s stated conclusions as an estimative judgment: the message contrasts the two services’
      assessments and gives the station’s own conclusions about relative forces, economic strain, and offensive capacity.
      Do not add details missing from the excerpt or turn the assessment into an operational recommendation.'
