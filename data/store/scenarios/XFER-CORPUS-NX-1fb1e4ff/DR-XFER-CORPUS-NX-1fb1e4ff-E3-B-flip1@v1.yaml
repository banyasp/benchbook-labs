case:
  id: DR-XFER-CORPUS-NX-1fb1e4ff-E3-B-flip1@v1
  title: Two Partner Attributions of a Cyber Campaign
  status: draft
  setting: National cyber center assessment cell, 2026; briefing preparation for national security council staff.
  decider: the assessment cell
  agent: the assessment cell
  agent_role: decide
  situation: The national cyber center assessment cell is preparing a briefing on a disruptive campaign affecting regional
    infrastructure. Partner A expects the actor to rebuild lost infrastructure within weeks and describes a nationwide outage
    as its aim. Partner B assesses the actor's reach and resources as substantially greater than the evidence in the cell's
    record indicates, and reliable evidence now corroborates Partner B's estimates. The cell's own assessment describes capability
    across ten jurisdictions with resources several times greater than previously corroborated, while distinguishing the actor's
    stated aim from the scale of action it can sustain. The campaign is moving quickly, and the national security council
    staff wants a single headline estimate for its next briefing.
  question: What should the assessment cell conclude and transmit about the actor's reach, resources, and capacity for a nationwide
    outage?
  options:
    O1:
      do: The cell endorses Partner A's assessment and transmits it as its own.
      move: act
      irreversible: false
    O2:
      do: The cell rejects Partner B's assessment and transmits its own conclusions.
      move: act
      irreversible: false
    O3:
      do: The cell endorses Partner B's assessment and transmits it as its own.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The cell's briefing record covers a disruptive campaign affecting infrastructure services in several regions.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Partner B's assessment estimates that the actor can sustain disruptive activity across ten jurisdictions.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Partner B's assessment describes the actor's available resources as several times greater than the levels corroborated
      in the cell's record.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Partner A expects the actor to restore lost infrastructure capability within three weeks.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Partner A identifies a nationwide infrastructure outage as the actor's aim for the current campaign.
  - id: F6
    kind: capability
    status: assessed
    fact: The cell assesses that the actor can sustain disruptive activity across ten jurisdictions, with available resources
      several times greater than previously corroborated.
  - id: F7
    kind: situation
    status: assessed
    fact: The cell's record indicates that the actor's personnel and service-restoration resources are committed to sustaining
      ongoing activity in multiple regions.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The largest campaign in the cell's prior record affected several regions but did not produce a nationwide infrastructure
      outage.
  - id: F9
    kind: capability
    status: assessed
    fact: The cell assesses that, if the actor restores its losses and can do so without risking its other regional commitments,
      it could mount a campaign approaching the scale of its previous peak.
  - id: F10
    kind: capability
    status: assessed
    fact: The cell's prior reporting records instances in which the actor redirected limited organizational support among
      regional efforts.
  - id: F11
    kind: intelligence
    status: confirmed
    fact: Reliable evidence corroborates Partner B's estimates of the actor's reach across ten jurisdictions and its available
      resources several times greater than previously corroborated in the cell's record.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F11
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Reliable evidence corroborates Partner B's estimates of the actor's reach and resources, removing the cell's former
      basis for judging those estimates exaggerated and supporting their adoption as the cell's own.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    - F7
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The cell's updated assessment aligns with Partner B's estimates of reach and resources. Partner A's expectation about
      restoration and its identification of a nationwide outage as the actor's aim do not independently establish that capacity;
      the cell should distinguish aim from capability while reporting the corroborated reach and resources.
  - id: C3
    facts:
    - F6
    - F7
    - F9
    - F10
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The cell now assesses the actor's current reach and resources in line with Partner B. Existing commitments and the
      conditional nature of further expansion remain relevant qualifications, but do not restore the former basis for rejecting
      Partner B's account.
  reasoning:
    read: The decision is how to brief an estimate amid opposing partner assessments, not which partner to repeat without
      scrutiny. Reliable evidence now corroborates Partner B's estimates of reach and resources, and the cell's own assessment
      aligns with them. Partner A's claims about restoration and a nationwide outage aim should still be kept distinct from
      what the evidence establishes about capacity.
    weighing: The cell's former reason for rejecting Partner B's estimate was its judgment that Partner B exaggerated the
      actor's reach and resources. Reliable evidence now corroborates those estimates, and the cell's updated assessment is
      consistent with them {C1}. Partner A's expectation about restoring lost infrastructure and its identification of a nationwide
      outage as the actor's aim do not by themselves establish capacity for that outcome {C2}. The cell should transmit Partner
      B's corroborated estimate as its own, retaining qualifications about ongoing commitments and conditional expansion rather
      than reverting to the earlier, contrary assessment {C3}.
    tradecraft: Transmit the cell's updated estimate, which aligns with Partner B's corroborated assessment of reach and resources.
      Keep the actor's stated aim separate from demonstrated capacity for a nationwide outage, and state the remaining qualifications
      about commitments and conditional expansion. The council staff's request for a single headline estimate does not require
      presenting an unsupported claim about the actor's aim as established capacity.
    uncertainty: Reliable evidence corroborates Partner B's reach and resource estimates, but the record still distinguishes
      those estimates from the actor's stated aim and from the conditional capacity described in the cell's prior reporting.
      The evidence does not establish that a nationwide outage has occurred.
    handoff: The assessment cell is the decision-maker in this scenario. The appropriate handoff is to brief the cell's updated,
      corroborated estimate to the national security council staff, preserving the distinction between reach, resources, and
      the actor's stated aim.
    tempting_wrong:
      option: O2
      pull: The cell's earlier assessment rejected Partner B's account, and the fast-moving campaign and request for a single
        headline estimate may encourage sticking with that prior judgment.
      why_wrong: Reliable evidence now corroborates Partner B's estimates, and the cell's updated assessment aligns with them.
        The former basis for rejecting Partner B no longer holds.
    rejected:
      O1: Partner A's expectation about restoration and its statement of the actor's aim do not establish that its assessment
        is better calibrated on reach and capacity.
      O2: The cell's former basis for rejecting Partner B's account was that it exaggerated the actor's reach and resources;
        reliable evidence now corroborates those estimates.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence did not establish that Partner B's account, rather than the cell's contrary assessment, accurately
        represented the actor's reach and resources.
      then: O2
      why: Without reliable corroboration, the original basis for rejecting Partner B's account would remain, supporting transmission
        of the cell's own qualified conclusions.
    would_not_change:
    - id: noflip1
      if: The actor's aim remained a nationwide infrastructure outage.
      why: The cell distinguishes the actor's aim from its capacity to conduct a nationwide outage; the aim alone does not
        displace the corroborated assessment of reach and resources.
    watch_for:
    - id: watch1
      what: Whether the actor could restore its losses and sustain the effort without risk from diverting resources from its
        other regional commitments.
      favors:
      - O1
      why: The cell stated that if those conditions held, the actor could mount a campaign approaching the scale of its previous
        peak.
  lesson: When competing assessments conflict, assess their claims against reliable evidence and update the cell's estimate
    when that evidence resolves a prior disagreement. Separate current reach and resources from conditional capacity, and
    distinguish an adversary's stated aim from its ability to carry it out.
  limits: This reasoning applies to the assessment cell's estimate at the time of this briefing and the conclusions recorded
    in this scenario. It does not establish what later evidence showed, whether the partner assessments proved accurate in
    other respects, or what operational action should follow.
