case:
  id: DR-CORPUS-NX-6b17eafe-E2@v1
  title: Hiring a Private Military Company in Angola
  status: draft
  setting: Soyo oilfields, Angola, March 1993; Angolan government, specifically Sonangol.
  decider: The Angolan government, specifically Sonangol
  agent: The Angolan government, specifically Sonangol
  agent_role: decide
  situation: In March 1993, UNITA rebels captured the Soyo oilfields. The Angolan Army was unable to remove them. The Angolan
    government, specifically Sonangol, faced a choice about hiring EO, a private military company. EO had professional military
    training packages available to armed forces covering sea, air, and land warfare. EO also described its service base as
    apolitical and grounded in confidentiality, professionalism, and dedication.
  question: What should the Angolan government, acting through Sonangol, do about hiring EO after the Angolan Army was unable
    to remove the rebels from the Soyo oilfields?
  options:
    O1:
      do: The Angolan government declines to hire EO as a private military contractor for the effort concerning the Soyo oilfields.
      move: act
      irreversible: false
    O2:
      do: The Angolan government hires EO as a private military contractor for the effort concerning the Soyo oilfields.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: UNITA rebels captured the Soyo oilfields in March 1993.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Angolan Army was unable to remove the rebels from the oilfields.
  - id: F3
    kind: capability
    status: confirmed
    fact: EO had professional military training packages available to armed forces.
  - id: F4
    kind: capability
    status: confirmed
    fact: EO's training packages covered aspects of sea warfare.
  - id: F5
    kind: capability
    status: confirmed
    fact: EO's training packages covered aspects of air warfare.
  - id: F6
    kind: capability
    status: confirmed
    fact: EO's training packages covered aspects of land warfare.
  - id: F7
    kind: capability
    status: confirmed
    fact: EO described its service base as apolitical and based on confidentiality.
  - id: F8
    kind: capability
    status: confirmed
    fact: EO described its service base as grounded in professionalism and dedication.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The rebels held the oilfields and the Angolan Army had been unable to remove them, supporting the choice to hire
      an outside contractor to pursue the stated objective.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: EO offered professional military training covering sea, air, and land warfare, a capability relevant to armed forces.
      The passage does not establish that these training packages themselves were the reason for the hiring decision.
  - id: C3
    facts:
    - F7
    - F8
    equity: impartiality
    favors:
    - O2
    weight: weak
    why: EO described its service as apolitical, confidential, professional, and dedicated. This is a claimed assurance, not
      independent evidence that the service was impartial or that the claim drove Sonangol's choice.
  reasoning:
    read: This was a choice to hire a private military company after the national army could not remove rebels from the oilfields,
      not a choice about how to conduct an operation. The passage gives a practical context for hiring and reports that the
      oilfields were recaptured, but does not specify legal authority or a fuller range of alternatives.
    weighing: The Army's inability to retake the oilfields is the clearest reason supporting {O2}. EO's described professional
      capabilities and service commitments add limited support, while the passage does not show that they were independently
      assessed or the stated basis for hiring. The reported recapture supports the effectiveness of the choice in this instance,
      but does not establish that hiring was legally authorized or generally preferable.
    tradecraft: Before committing, identify and record the approving authority, the purpose and limits of the contractor's
      role, and the basis for selecting it; the passage supplies no legal-authority details. Keep the decision record focused
      on the need, the contractor's relevant qualifications, and the rationale for the choice.
    uncertainty: The passage does not set out Sonangol's full deliberation, the legal authority for hiring, or alternatives
      considered. EO's stated service attributes are presented as descriptions, not verified findings.
    handoff: The passage identifies Sonangol as the hiring entity but does not identify who reviewed or approved the decision.
      As a decision practice, confirm the competent government approval and legal review rather than infer authority from
      the reported hiring.
    tempting_wrong:
      option: O1
      pull: Declining to hire a private military company avoids relying on a contractor and on its own description of its
        service.
      why_wrong: In the circumstances stated, the Angolan Army had been unable to remove the rebels, and the passage's reported
        outcome was recapture of the oilfields after EO was hired. The passage does not provide enough information to conclude
        that declining was the better course.
    rejected:
      O1: Sonangol did not decline the contractor; it hired EO after the Angolan Army was unable to remove the rebels.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The Angolan Army were able to remove the rebels without hiring EO.
      then: O1
      why: The stated practical reason for turning to a contractor would be substantially reduced.
    - id: flip2
      if: EO could not demonstrate capabilities relevant to the government's need.
      then: O1
      why: The described capability rationale for choosing EO would no longer support the hire.
    would_not_change:
    - id: noflip1
      if: EO's apolitical and professional service description remained only a claim, without further verification.
      why: That would weaken a supporting assurance but would not, by itself, change the central fact that the Army had been
        unable to remove the rebels.
    watch_for:
    - id: watch1
      what: Evidence bearing on whether EO's stated service attributes and capabilities were verified and relevant to the
        need.
      favors:
      - O1
      why: If those claims proved unreliable or irrelevant, the limited supporting weight they provide for hiring would diminish.
  lesson: When the state's own force cannot achieve a stated objective, a contractor's relevant capabilities may support hiring,
    but claims about professionalism or apolitical service should not be treated as verified facts. Record the legal authority,
    the need, and the basis for selection rather than treating a successful outcome as proof that every aspect of the decision
    was justified.
  limits: This conclusion reflects the passage's account of the Soyo decision and reported outcome, not a general endorsement
    of private military companies. It does not resolve legal authority, contractor oversight, or alternatives because the
    passage does not provide those details.
