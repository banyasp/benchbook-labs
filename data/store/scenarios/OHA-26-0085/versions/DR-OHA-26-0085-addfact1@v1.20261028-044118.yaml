case:
  id: DR-OHA-26-0085-addfact1@v1
  title: DOE Personnel Security Clearance Restoration Decision [addfact]
  status: needs_review
  setting: Department of Energy, Office of Hearings and Appeals, 30 September 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The respondent works for a DOE contractor in a role that requires a security clearance. The Local Security Office
    has expressed substantial doubt about his eligibility under Guidelines E (personal conduct), G (alcohol consumption),
    and H (drug involvement). He signed a questionnaire on 27 July 2022 affirming no illegal drug use, yet from 2020 through
    11 August 2024 he used cocaine three times per week. He entered inpatient alcohol rehabilitation on 14 August 2024 but
    failed to disclose that cocaine use, contrary to DOE Order 472.2A. In 2024 he received a DOE performance award for contributions
    to a critical energy-efficiency project. On 10 September 2025 he was arrested for aggravated driving while under the influence
    after consuming three to five mixed drinks. A DOE psychologist evaluated him on 14 January 2026, diagnosing moderate alcohol-use
    disorder in early remission and concluding there is insufficient evidence of rehabilitation. PEth testing was positive
    on 29 September 2025 (152 ng/mL) and negative on 30 October, 25 November, 18 December 2025, and 14 January 2026. At the
    hearing he denied any cocaine use, but the psychologist noted a pattern of under-reporting and overly positive self-presentation.
    He has participated in multiple alcohol-treatment programs, AA meetings, and counseling, yet has not demonstrated the
    sustained abstinence required by the guidelines.
  question: How should the Administrative Law Judge rule on the respondent's security clearance?
  options:
    O1:
      do: Restore the respondent's security clearance in full, removing the current restriction.
      move: act
      irreversible: true
    O2:
      do: Maintain the existing restriction and deny restoration of the security clearance.
      move: act
      irreversible: true
    O3:
      do: Restore the clearance conditionally, requiring successful completion of an intensive outpatient treatment program.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The respondent works for a DOE contractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office expressed significant uncertainty regarding the respondent's eligibility under Guidelines
      E (personal conduct), G (alcohol consumption), and H (drug involvement).
  - id: F3
    kind: intelligence
    status: confirmed
    fact: On 27 July 2022 the respondent signed a QNSP affirming no illegal drug use, yet he used cocaine three times weekly
      from 2020 through 11 August 2024.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: He entered inpatient alcohol rehabilitation on 14 August 2024 but failed to disclose his cocaine consumption, contrary
      to DOE Order 472.2A.
  - id: F5
    kind: situation
    status: confirmed
    fact: During 2024 the respondent was honored with a DOE performance award for his work on a vital energy-efficiency initiative.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: On 10 September 2025 he was taken into custody for aggravated DUI after ingesting three to five mixed alcoholic
      beverages.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A DOE psychologist assessed the respondent on 14 January 2026, diagnosing moderate alcohol-use disorder in early
      remission and determining that evidence of rehabilitation was insufficient.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: PEth analysis returned a positive result of 152 ng/mL on 29 September 2025, but subsequent tests on 30 October,
      25 November, 18 December 2025, and 14 January 2026 were negative.
  - id: F9
    kind: intelligence
    status: assessed
    fact: At the hearing the respondent denied any cocaine use, yet the psychologist observed a tendency toward underreporting
      and overly favorable self-presentation.
  - id: F10
    kind: intelligence
    status: assessed
    fact: He has taken part in several alcohol-treatment programs, AA meetings, and counseling, but has not shown the clear,
      sustained abstinence mandated by the guidelines.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F9
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The respondent deliberately misrepresented his drug use on the QNSP, violating the candor requirement of Guideline
      E; no mitigating circumstance was presented, rendering his conduct untrustworthy.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    - F10
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The DUI incident, the psychologist's diagnosis of an ongoing alcohol-use disorder, and the limited span of negative
      PEth results demonstrate a relapse and an absence of the sustained abstinence required by Guideline G.
  - id: C3
    facts:
    - F3
    - F4
    - F9
    - F10
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Denial of cocaine use despite documented consumption and the lack of any treatment plan fail to satisfy the mitigating
      criteria for Guideline H.
  - id: C4
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Regulatory guidance imposes a presumption against restoration when substantial doubt exists; the LSO's expressed
      uncertainty triggers that presumption.
  - id: C5
    facts:
    - F5
    equity: fairness_to_respondent
    favors:
    - O3
    weight: weak
    why: The 2024 DOE performance award reflects valuable contributions, yet it does not address the unresolved security deficiencies
      outlined in Guidelines E‑H.
  reasoning:
    read: The judge evaluated the respondent's pattern of illicit substance use, false disclosures, and the absence of a verifiable,
      continuous abstinence record, concluding that the security concerns under Guidelines E, G, and H remain unmitigated.
    weighing: Each consideration (C1-C4) carries strong weight favoring denial; the additional fairness argument (new consideration)
      is weak and insufficient to overcome the dominant security factors.
    tradecraft: The decision is entered in the official OHA docket, the clearance restriction stays in force, and the matter
      is closed pending any appeal under 10 C.F.R. § 710.28.
    uncertainty: The evidence is clear; no substantive doubt remains regarding the respondent's failure to meet mitigating
      conditions.
    handoff: The Administrative Law Judge acted independently, as authorized by 10 C.F.R. § 710.25(d)-(g); no further agency
      review is required beyond the statutory appeal process.
    tempting_wrong:
      option: O1
      pull: The series of negative PEth tests and participation in treatment programs could be read as signs of improvement.
      why_wrong: Restoring the clearance would overlook the falsifications, the recent DUI, and the lack of a sustained abstinence
        trajectory required by the regulations.
    rejected:
      O1: Absent credible evidence of continuous abstinence and full candor, full restoration cannot be justified.
      O3: The fairness consideration is weak; the respondent has not satisfied the mitigating conditions that would permit
        a conditional restoration.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The respondent supplies twelve successive months of negative PEth results that include all high-risk holiday periods
        and presents documented continuous abstinence per treatment guidelines.
      then: O3
      why: Such evidence would satisfy mitigating condition (b) for Guideline G, establishing a clear abstinence pattern.
    - id: flip2
      if: The respondent fully acknowledges his cocaine use, completes a DOE-approved drug-rehabilitation program with after-care,
        and obtains a favorable prognosis from a qualified professional.
      then: O3
      why: Meeting mitigating condition (b) for Guideline H and condition (d) for Guideline E would eliminate the primary
        security concerns.
    would_not_change:
    - id: noflip1
      if: The respondent continues to provide inconsistent statements or under-reports substance use.
      why: Ongoing under-reporting erodes credibility, a core factor across Guidelines E, G, and H.
    watch_for:
    - id: watch1
      what: Any future arrest, positive drug test, or alcohol-related incident.
      favors:
      - O2
      why: A new adverse event would reaffirm the unresolved security concerns and support continued denial.
  lesson: Under DOE Part 710, when substantial doubt exists and the individual fails to meet the mitigating criteria for Guidelines
    E, G, and H—especially after false statements and ongoing substance misuse—the presumption against restoring a clearance
    prevails.
  limits: This analysis is limited to DOE personnel-security adjudications governed by 10 C.F.R. Part 710; other agencies
    may apply different standards or weighting of mitigating evidence.
