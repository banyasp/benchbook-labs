case:
  id: DR-OHA-26-0085-restyle1@v1
  title: DOE Personnel Security Clearance Restoration Decision [restyle]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy, 30 September 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The employee works for a DOE contractor in a role that requires a security clearance. The Local Security Office
    has expressed substantial doubt about the employee's eligibility under Guidelines E, G, and H after uncovering cocaine
    use, false statements on a security questionnaire, and alcohol-related incidents. The employee entered inpatient alcohol
    treatment in 2024 but failed to disclose his cocaine use, was arrested in 2025 for driving while intoxicated, and has
    supplied mixed evidence of sobriety through PEth testing and participation in treatment programs. A DOE psychologist evaluated
    the employee in early 2026, diagnosing moderate alcohol use disorder in early remission and noting concerns about under-reporting.
    The Administrative Law Judge must decide whether the employee's security clearance should be restored.
  question: What action should the Administrative Law Judge take regarding the employee's access authorization?
  options:
    O1:
      do: Grant restoration of the employee's security clearance, removing the existing restriction.
      move: act
      irreversible: true
    O2:
      do: Deny restoration of the employee's security clearance, leaving the current restriction in place.
      move: act
      irreversible: true
    O3:
      do: Restore the employee's security clearance conditionally, contingent upon completion of an intensive outpatient program.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office expressed substantial doubt concerning the employee's eligibility under Guidelines E,
      G, and H.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The employee signed a QNSP on 27 July 2022 affirming no illegal drug use, yet from 2020 through 11 August 2024 he
      used cocaine approximately three times weekly.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: On 14 August 2024 the employee entered an inpatient alcohol-rehabilitation program and failed to disclose his cocaine
      use as required by DOE Order 472.2A.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: On 10 September 2025 the employee was arrested for aggravated driving while intoxicated after ingesting three to
      five mixed drinks.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A DOE-appointed psychologist evaluated the employee on 14 January 2026, diagnosing Alcohol Use Disorder, Moderate,
      Early Remission, and concluded that evidence of rehabilitation was insufficient.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: PEth testing returned a positive result of 152 ng/mL on 29 September 2025 and negative results on 30 October, 25
      November, 18 December 2025, and 14 January 2026.
  - id: F8
    kind: intelligence
    status: assessed
    fact: At the hearing the employee denied any cocaine use; the psychologist observed a pattern of under-reporting and overly
      favorable self-presentation.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The employee has attended several alcohol-treatment programs, Alcoholics Anonymous meetings, and counseling, yet
      has not produced a clear, sustained abstinence record as required by the guidelines.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The employee's false statement on the QNSP and his failure to report cocaine use breach Guideline E's candor requirement;
      the Judge found no mitigating factor and concluded the conduct renders him untrustworthy.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Guideline G remains unmitigated because the employee relapsed after treatment, his nine-month series of negative
      PEth tests omitted high-risk holiday periods, and he has not demonstrated a continuous abstinence pattern.
  - id: C3
    facts:
    - F3
    - F4
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline H is not satisfied; despite medical documentation, the employee denied cocaine use, offered no proof of
      abstinence or a treatment plan, and thus fails the mitigating conditions for drug misuse.
  - id: C4
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: DOE regulations establish a presumption against granting or restoring a clearance when substantial doubt exists;
      the Judge applied the presumption in accordance with 10 C.F.R. § 710.7(a).
  reasoning:
    read: The Administrative Law Judge reviewed the employee's history of alcohol and cocaine consumption, the false statements,
      and the absence of a verifiable, sustained abstinence record, determining that the security concerns under Guidelines
      E, G, and H remain unresolved.
    weighing: Each consideration (C1-C4) was assigned strong weight in favor of denial because the record evidences repeated
      misconduct, under-reporting, and inadequate mitigation. The Judge referenced the regulatory provision that any failure
      to mitigate any of the three guidelines precludes clearance restoration.
    tradecraft: The decision was entered into the official OHA docket; the restriction on the employee's clearance remains
      operative, and the matter is closed unless the employee appeals under 10 C.F.R. § 710.28.
    uncertainty: The Judge identified no substantive ambiguity; the evidence clearly shows that mitigating conditions have
      not been met.
    handoff: The Administrative Law Judge acted independently, as authorized by 10 C.F.R. § 710.25(d)-(g). No further agency
      review is required beyond the statutory appeal process.
    tempting_wrong:
      option: O1
      pull: The employee's participation in several treatment programs and recent negative PEth results could be interpreted
        as signs of improvement.
      why_wrong: Restoring the clearance would disregard the unresolved false statements, the lack of a continuous abstinence
        record, and the statutory presumption against restoration.
    rejected:
      O1: The record fails to demonstrate credible, sustained abstinence or full candor; therefore restoration is not justified.
      O3: A conditional restoration would still demand fulfillment of mitigating conditions that the employee has not satisfied;
        the Judge found none applicable.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee supplied twelve consecutive months of negative PEth results that include all high-risk holiday periods
        and documented uninterrupted abstinence according to treatment recommendations.
      then: O3
      why: Such evidence would satisfy mitigating condition (b) for Guideline G, establishing a clear pattern of abstinence.
    - id: flip2
      if: The employee fully acknowledged his cocaine use, completed a DOE-approved drug-treatment program with after-care,
        and obtained a favorable prognosis from a qualified professional.
      then: O3
      why: Meeting mitigating condition (b) for Guideline H and condition (d) for Guideline E would eliminate the principal
        security concerns.
    would_not_change:
    - id: noflip1
      if: The employee continues to under-report his substance use or provides inconsistent statements.
      why: Under-reporting directly erodes credibility, a core factor across all three guidelines.
    watch_for:
    - id: watch1
      what: Any subsequent arrest or a positive drug/alcohol test.
      favors:
      - O2
      why: A new incident would reaffirm the unresolved security concerns.
  lesson: Under DOE Part 710, failure to satisfy the mitigating conditions for Guidelines E, G, and H—especially when false
    statements and ongoing substance misuse are documented—means the presumption against granting a clearance prevails.
  limits: This analysis applies solely to DOE personnel-security adjudications under 10 C.F.R. Part 710; other agencies may
    weigh mitigating evidence differently or employ distinct statutory thresholds.
