case:
  id: DR-OHA-26-0085@v1
  title: DOE Personnel Security Clearance Restoration Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, September 30 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires a security clearance. The Local Security
    Office raised substantial doubt about the Individual’s eligibility under Guidelines E (personal conduct), G (alcohol consumption),
    and H (drug involvement) after discovering cocaine use, false statements on a security questionnaire, and alcohol‑related
    incidents. The Individual entered inpatient alcohol treatment in 2024 but failed to report his cocaine use, was arrested
    in 2025 for driving while under the influence, and has provided mixed evidence of sobriety through PEth testing and participation
    in treatment programs. A DOE psychologist evaluated the Individual in early 2026, diagnosing moderate alcohol use disorder
    in early remission and noting concerns about underreporting. The Administrative Judge must determine whether the Individual’s
    security clearance should be restored.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge grants restoration of the Individual’s security clearance, removing the current restriction.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge denies restoration of the Individual’s security clearance, maintaining the current restriction.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s security clearance conditionally, requiring completion of an
        intensive outpatient program.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office raised substantial doubt about the Individual’s eligibility under Guidelines E, G, and
      H.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The Individual signed a QNSP on July 27 2022 stating no illegal drug use, but used cocaine three times a week from
      2020 until August 11 2024.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The Individual entered inpatient alcohol treatment on August 14 2024 and did not report his cocaine use as required
      by DOE Order 472.2A.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: On September 10 2025 the Individual was arrested for aggravated driving while under the influence after consuming
      three to five mixed drinks.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A DOE psychologist evaluated the Individual on January 14 2026, diagnosing Alcohol Use Disorder, Moderate, Early
      Remission, and concluded there was insufficient evidence of rehabilitation.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: PEth testing was positive on September 29 2025 (152 ng/mL) and negative on October 30, November 25, December 18
      2025, and January 14 2026.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Individual denied cocaine use at the hearing, but the psychologist noted a pattern of underreporting and over‑positive
      self‑presentation.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The Individual has participated in multiple alcohol‑treatment programs, AA, and counseling but has not demonstrated
      a clear, sustained pattern of abstinence required by the guidelines.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual falsified the QNSP and failed to report cocaine use, violating Guideline E's requirement for candor;
      the Judge found no mitigating circumstance and deemed the conduct untrustworthy.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Guideline G concerns were not mitigated because the Individual relapsed after treatment, provided only nine months
      of negative PEth tests that omitted high‑risk holidays, and did not demonstrate a clear, sustained abstinence pattern.
  - id: C3
    facts:
    - F3
    - F4
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline H concerns were unmet; the Individual denied cocaine use despite medical records, offered no evidence of
      abstinence or a treatment plan, and therefore failed the mitigating conditions for drug misuse.
  - id: C4
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: DOE regulations impose a presumption against granting or restoring a clearance when substantial doubt exists; the
      Judge applied this presumption per 10 C.F.R. § 710.7(a).
  reasoning:
    read: The Administrative Judge examined the Individual’s alcohol and cocaine use, false statements, and the lack of a
      sustained, verifiable abstinence record, concluding that the security concerns under Guidelines E, G, and H remain unresolved.
    weighing: Each consideration (C1‑C4) was weighted strongly in favor of denial because the record showed repeated misconduct,
      under‑reporting, and insufficient mitigation. The Judge cited the specific regulatory language that a failure to mitigate
      any of the three guidelines precludes restoration of access.
    tradecraft: The decision was recorded in the official OHA decision, the restriction on the Individual’s clearance remains
      in effect, and the case is closed unless appealed under 10 C.F.R. § 710.28.
    uncertainty: The Judge noted no substantive uncertainty; the evidence was clear that mitigating conditions were not satisfied.
    handoff: The Administrative Judge acted alone, as authorized by 10 C.F.R. § 710.25(d)‑(g). No additional agency review
      was required beyond the appeal process.
    tempting_wrong:
      option: O1
      pull: The Individual’s participation in multiple treatment programs and recent negative PEth tests might suggest improvement.
      why_wrong: Granting a clearance would ignore the unresolved false statements, the lack of a continuous abstinence record,
        and the statutory presumption against restoration.
    rejected:
      O1: The record shows no credible, sustained abstinence or full candor, so restoration cannot be justified.
      O3: Conditional restoration would still require meeting mitigating conditions that the Individual has not satisfied;
        the Judge found none applicable.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provided twelve consecutive months of negative PEth tests covering all high‑risk holidays and documented
        continuous abstinence per treatment recommendations.
      then: O3
      why: This would satisfy mitigating condition (b) for Guideline G, establishing a clear pattern of abstinence.
    - id: flip2
      if: The Individual fully acknowledged his cocaine use, completed a DOE‑approved drug treatment program with after‑care,
        and obtained a favorable prognosis from a qualified professional.
      then: O3
      why: Meeting mitigating condition (b) for Guideline H and (d) for Guideline E would remove the primary security concerns.
    would_not_change:
    - id: noflip1
      if: The Individual continues to under‑report his substance use or provides inconsistent statements.
      why: Under‑reporting directly undermines credibility, a core factor in all three guidelines.
    watch_for:
    - id: watch1
      what: Any future arrest or positive drug/alcohol test.
      favors:
      - O2
      why: A new incident would reaffirm the unresolved security concerns.
  lesson: Under DOE Part 710, failure to satisfy the mitigating conditions for Guidelines E, G, and H—especially when false
    statements and ongoing substance misuse are documented—means the presumption against granting a clearance prevails.
  limits: This analysis applies only to DOE personnel security adjudications under 10 C.F.R. Part 710; other agencies may
    weigh mitigating evidence differently or have distinct statutory thresholds.
  library:
    domain: personnel security adjudication
    family: OHA-26-0085
    source: https://www.energy.gov/sites/default/files/2026-10/PSH-26-0085.pdf
