case:
  id: DR-OHA-26-0145-restyle1@v1
  title: Restoration of DOE Security Clearance [restyle]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy – September 2026
  decider: Presiding Administrative Law Judge
  agent: Case Management Support System
  agent_role: decide
  situation: A service member assigned to a U.S. armed-service component requires a DOE security clearance. He completed a
    2025 questionnaire asserting no illegal drug use, but later disclosed marijuana, hallucinogenic mushroom, and cocaine
    use on a 2026 questionnaire. The Local Security Office raised concerns under Guideline E (personal conduct) and Guideline
    H (drug involvement) because of the inconsistency. The service member explained the omission as advice from a recruiter
    and a lack of intent to pursue a military career at the time, and subsequently provided testimony, exhibits, and a signed
    July 2026 statement pledging abstinence. He has not used illegal drugs since August 2022, with corroborating evidence
    of abstinence. The Judge must decide whether to restore his access authorization under DOE security regulations that presume
    against granting.
  question: What action should the Judge take regarding the service member's access authorization?
  options:
    O1:
      do: The Judge reinstates the individual's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Judge requests further evidence of drug use.
      move: ask
      irreversible: false
    O3:
      do: The Judge postpones the decision pending further review.
      move: hold
      irreversible: false
    O4:
      do: The Judge revokes the individual's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The service member holds a billet in a U.S. armed-service component that mandates a Department of Energy clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In the 2025 QNSP form, he asserted that he had not consumed any prohibited substances during the preceding seven-year
      period.
  - id: F3
    kind: situation
    status: confirmed
    fact: He reported marijuana consumption from May 2019 through October 2021, ingestion of hallucinogenic mushrooms on four
      occasions between July and August 2020, and a single cocaine episode in August 2022.
  - id: F4
    kind: situation
    status: confirmed
    fact: On the 2026 questionnaire he disclosed the drug history described above.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline E (personal conduct) and Guideline H (drug involvement)
      due to the discrepancy between the two questionnaires.
  - id: F6
    kind: intelligence
    status: assessed
    fact: He explained that a recruiter had advised him to answer "no" to past drug use if it occurred long ago, and that
      at the time he had no intention of entering a military career, leading to the omission.
  - id: F7
    kind: situation
    status: confirmed
    fact: He submitted sworn testimony, supporting documents, and a July 2026 signed declaration committing to refrain from
      any future drug activity.
  - id: F8
    kind: situation
    status: confirmed
    fact: Investigators and an independent source confirm that he has refrained from illegal drug use since August 2022, establishing
      a consistent abstinence pattern.
  - id: F9
    kind: authority
    status: confirmed
    fact: The OHA Director assigned the presiding Administrative Judge to resolve the matter.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Judge must determine whether to reinstate the service member's access authorization pursuant to DOE security
      regulations that ordinarily presume against granting clearance.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F7
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Mitigation under Guideline E paragraph 17(c) is appropriate; the lone omission represents an isolated incident, the
      individual has demonstrated personal growth, and there is no evidence of future recurrence.
  - id: C2
    facts:
    - F3
    - F4
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Mitigation under Guideline H paragraphs 26(a) and (b) applies because the drug involvement took place several years
      prior, was sporadic, and the individual has shown enduring abstinence, provided a signed pledge, and severed ties with
      drug-using associates.
  - id: C3
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Corroborating investigative reports, a source interview, and consistent documentary exhibits substantiate his testimony,
      bolstering credibility and the mitigating assessment.
  - id: C4
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: While Part 710 imposes a presumption against granting, it expressly permits the adjudicator to consider mitigating
      evidence; the compelling mitigating factors outweigh that presumption.
  reasoning:
    read: The central issue is whether the service member's historic illicit drug use and the prior false declaration pose
      a continuing security risk. The LSO cited Guideline E (personal conduct) and Guideline H (drug involvement) due to the
      inconsistency between the 2025 and 2026 questionnaires.
    weighing: The Judge applied the Adjudicative Guidelines. Under Guideline E, paragraph 17(c) was met – the omission was
      an isolated, youthful error, the individual has matured, and no recurrence is evident. Under Guideline H, paragraphs
      26(a) and (b) were satisfied – the drug use transpired years earlier, was occasional, and the individual has shown sustained
      abstinence, severed ties with drug-using peers, and provided a signed pledge. The credibility of his narrative, bolstered
      by corroborating investigative findings, further underpins mitigation. Consequently, the statutory presumption against
      granting (C4) is outweighed by these strong mitigating factors.
    tradecraft: The Judge issues a formal written decision reinstating the access authorization, references the pertinent
      guideline paragraphs that address the concerns, and files the decision in the DOE OHA docket in accordance with 10 C.F.R.
      § 710.7(a).
    uncertainty: Minimal; the record offers abundant corroboration of abstinence and of the individual's remorse, leaving
      little doubt regarding future reliability.
    handoff: The decision is final within the OHA proceeding; no additional agency review is required unless an appeal is
      lodged under 10 C.F.R. § 710.28.
    tempting_wrong:
      option: O4
      pull: The statutory presumption against granting may tempt a denial, particularly in light of the earlier false declaration.
      why_wrong: Discounting the mitigation would overlook the specific mitigating conditions enumerated in the Guidelines
        and would conflict with the source's own analysis.
    rejected:
      O2: Further evidence is unnecessary because the existing record already satisfies the mitigating criteria set forth
        in the Guidelines.
      O3: Keeping the decision pending provides no added value; the adjudicative standards have already been satisfied.
      O4: Revocation would contradict the Judge's finding that the concerns have been resolved under Guideline E ¶17(c) and
        Guideline H ¶26(a)(b).
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the individual had persisted in illegal drug use after August 2022
      then: O4
      why: Mitigation under Guideline H paragraph 26(a) would cease to apply, leaving an unresolved drug-involvement issue.
    - id: flip2
      if: the individual had not rectified the false entry on the 2025 questionnaire before being confronted
      then: O4
      why: Mitigation under Guideline E paragraph 17(c) would be unavailable, as the omission would not constitute a discrete,
        corrected episode.
    would_not_change:
    - id: noflip1
      if: the individual's historic drug use remains confined to the documented interval and he continues abstinent
      why: The mitigating conditions under Guideline H stay satisfied, thus the restoration remains appropriate.
    watch_for:
    - id: watch1
      what: any subsequent illegal drug consumption or falsification of security questionnaires
      favors:
      - O4
      why: Such behavior would revive the security concerns outlined in Guidelines E and H.
  lesson: A solitary, youthful omission that is promptly corrected, coupled with demonstrable sustained abstinence and credibility,
    enables the Adjudicative Guidelines to mitigate security concerns and permit clearance restoration. The presumption against
    granting can be surmounted by clear, documented mitigating evidence.
  limits: This analysis applies only when the individual's misconduct is isolated, fully disclosed, and corroborated by evidence.
    It does not extend to repeated or ongoing illegal conduct, nor to omissions that remain undisclosed.
