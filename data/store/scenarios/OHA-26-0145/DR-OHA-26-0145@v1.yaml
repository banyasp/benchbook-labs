case:
  id: DR-OHA-26-0145@v1
  title: Restoration of DOE Security Clearance
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, September 2026
  decider: Administrative Judge
  agent: Adjudication Support Agent
  agent_role: decide
  situation: An Individual employed by a branch of the U.S. military requires a DOE security clearance. He submitted a 2025
    questionnaire stating no illegal drug use, but later disclosed marijuana, hallucinogenic mushroom, and cocaine use on
    a 2026 questionnaire. The Local Security Office raised concerns under Guideline E (personal conduct) and Guideline H (drug
    involvement) because of the discrepancy. The Individual explained the omission as advice from a recruiter and lack of
    intent to pursue a military career at the time, and later provided testimony, exhibits, and a signed statement pledging
    abstinence. He has not used illegal drugs since August 2022, with corroborating evidence of abstinence. The Administrative
    Judge must decide whether to restore his access authorization under the applicable DOE security regulations, which presume
    against granting.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks for additional drug use evidence.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge holds the decision pending review.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge revokes the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a branch of the U.S. military in a position requiring a DOE security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual submitted a 2025 Questionnaire for National Security Positions stating he had not used illegal drugs
      in the past seven years.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual used marijuana from May 2019 through October 2021, hallucinogenic mushrooms four times between July
      and August 2020, and cocaine once in August 2022.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual submitted a 2026 questionnaire disclosing the above drug use.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline E (personal conduct) and Guideline H (drug involvement)
      due to the discrepancy between the two questionnaires.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual explained that he omitted the drug use on the 2025 questionnaire because a recruiter suggested he
      could answer 'no' if the use was in the distant past and he did not intend to pursue a military career at that time.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual provided testimony, exhibits, and a signed July 2026 statement pledging to abstain from all drug
      involvement.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual has not used illegal drugs since August 2022 and has a pattern of abstinence, corroborated by investigators
      and a source.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Director of the Office of Hearings and Appeals appointed the Administrative Judge to adjudicate the case.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Administrative Judge must decide whether to restore the Individual’s access authorization under the applicable
      DOE security regulations, which presume against granting.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F7
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Guideline E mitigation under ¶17(c) applies because the Individual’s single omission was a discrete episode, he has
      matured, and there is no indication the conduct will recur.
  - id: C2
    facts:
    - F3
    - F4
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: 'Guideline H mitigation under ¶26(a) and (b) applies: the illegal drug use occurred years ago, was infrequent, and
      the Individual has demonstrated a sustained pattern of abstinence, a signed pledge, and disassociation from drug‑using
      contacts.'
  - id: C3
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Individual’s testimony is corroborated by investigative reports, a source interview, and consistent documentary
      exhibits, establishing credibility and supporting the mitigating findings.
  - id: C4
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although Part 710 presumes against granting a clearance, the regulation expressly allows the adjudicator to weigh
      mitigating evidence; the strong mitigating factors outweigh the presumption.
  reasoning:
    read: The case hinges on whether the Individual’s past illegal drug use and the earlier false statement constitute a lasting
      security risk. The LSO raised concerns under Guideline E (personal conduct) and Guideline H (drug involvement) because
      of the discrepancy between the 2025 and 2026 questionnaires.
    weighing: The Administrative Judge applied the Adjudicative Guidelines. For Guideline E, ¶17(c) was found satisfied –
      the omission was a single, youthful mistake, the Individual has matured, and there is no indication of recurrence. For
      Guideline H, ¶26(a) and (b) were satisfied – the drug use occurred years ago, was infrequent, and the Individual has
      demonstrated abstinence, disassociation from drug‑using peers, and a signed pledge. The credibility of the Individual’s
      account, reinforced by corroborating investigative reports, further supports mitigation. The presumption against granting
      (C4) is outweighed by these strong mitigating conditions.
    tradecraft: The Judge issues a written Decision restoring the access authorization, cites the specific guideline paragraphs
      that resolve the concerns, and records the decision in the DOE OHA case file per 10 C.F.R. § 710.7(a).
    uncertainty: Minimal; the record provides ample corroboration of abstinence and of the Individual’s remorse, leaving little
      doubt about future reliability.
    handoff: The decision is final for the OHA proceeding; no further agency review is required unless an appeal is filed
      under 10 C.F.R. § 710.28.
    tempting_wrong:
      option: O4
      pull: The presumption against granting could tempt a denial, especially given the initial false statement.
      why_wrong: Rejecting the mitigation ignores the specific mitigating conditions the Guidelines enumerate and would conflict
        with the source’s own analysis.
    rejected:
      O2: Additional evidence is unnecessary because the record already satisfies the mitigating criteria under the Guidelines.
      O3: Holding the decision pending adds no value; the adjudicative standards have been met.
      O4: Revocation would contradict the Judge’s finding that the concerns have been resolved under Guideline E ¶17(c) and
        Guideline H ¶26(a)(b).
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual had continued illegal drug use after August 2022
      then: O4
      why: Guideline H mitigation under ¶26(a) would no longer apply, leaving an unresolved drug‑involvement concern.
    - id: flip2
      if: the Individual had failed to correct the false statement on the 2025 questionnaire before being confronted
      then: O4
      why: Guideline E mitigation under ¶17(c) would be unavailable because the omission would not be a discrete, corrected
        episode.
    would_not_change:
    - id: noflip1
      if: the Individual’s past drug use remained limited to the documented period and he maintains abstinence
      why: The mitigating conditions under Guideline H remain satisfied, so the restoration stands.
    watch_for:
    - id: watch1
      what: any future illegal drug use or falsification of security questionnaires
      favors:
      - O4
      why: Such conduct would reactivate the security concerns under Guidelines E and H.
  lesson: When a single, youthful omission is promptly corrected and the individual demonstrates sustained abstinence and
    credibility, the Adjudicative Guidelines allow the security concerns to be mitigated and the clearance restored. The presumption
    against granting can be overcome by clear, documented mitigating factors.
  limits: This reasoning applies only where the individual’s misconduct is isolated, has been fully disclosed, and is supported
    by corroborating evidence. It does not extend to repeated or ongoing illegal behavior, nor to omissions that remain undisclosed.
