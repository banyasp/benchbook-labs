case:
  id: DR-OHA-26-0145-flip1@v1
  title: Restoration of DOE Security Clearance [flip]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy, October 2026
  decider: Administrative Law Judge
  agent: Adjudicative Support System
  agent_role: decide
  situation: A service member of a U.S. armed service seeks a DOE security clearance. In a 2025 security questionnaire he
    asserted no illegal drug use in the prior seven years. After the Local Security Office identified a discrepancy, he completed
    a 2026 questionnaire that disclosed marijuana, hallucinogenic mushroom, and cocaine use. The LSO cited Guideline E (personal
    conduct) and Guideline H (drug involvement). The individual claims the omission resulted from recruiter advice and a lack
    of intent to pursue a military career at the time, and he now offers sworn testimony, supporting exhibits, and a July
    2026 statement promising lifelong abstinence. Investigators have found no illegal drug use after August 2022. The Judge
    must determine whether the individual's access authorization should be retained, restored, or withdrawn under DOE security
    regulations that presume against granting.
  question: How should the Administrative Law Judge rule on the individual's access authorization?
  options:
    O1:
      do: Restore the individual's DOE access authorization now.
      move: act
      irreversible: true
    O2:
      do: Require further documented evidence of past drug use.
      move: ask
      irreversible: false
    O3:
      do: Place the decision on hold pending additional review.
      move: hold
      irreversible: false
    O4:
      do: Revoke the individual's DOE access authorization immediately.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The individual is a member of a U.S. military branch and holds a position that requires a DOE security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In the 2025 Questionnaire for National Security Positions the individual declared that he had not used illegal drugs
      in the preceding seven years.
  - id: F3
    kind: situation
    status: confirmed
    fact: He actually used marijuana from May 2019 through October 2021, consumed hallucinogenic mushrooms on four occasions
      between July and August 2020, and used cocaine once in August 2022.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual submitted a 2026 questionnaire disclosing the above drug use only after being confronted about the
      false statement on the 2025 questionnaire.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Local Security Office raised concerns under Guideline E (personal conduct) and Guideline H (drug involvement)
      because the two questionnaires conflict.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The individual explained that he omitted the drug use on the 2025 questionnaire after a recruiter suggested he could
      answer "no" for conduct that occurred in the distant past and because he did not intend to pursue a military career
      at that time.
  - id: F7
    kind: situation
    status: confirmed
    fact: He submitted sworn testimony, documentary exhibits, and a signed statement in July 2026 pledging to abstain from
      any future drug involvement.
  - id: F8
    kind: situation
    status: confirmed
    fact: Investigators and a corroborating source confirm that he has not used any illegal drugs since August 2022 and that
      he maintains a pattern of abstinence.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Director of the Office of Hearings and Appeals appointed the Administrative Law Judge to adjudicate this case.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Judge must apply the DOE security regulations, which contain a presumption against granting a clearance.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F7
    - F8
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Guideline E mitigation under ¶17(c) is unavailable because the false statement was not a single, corrected lapse;
      it was concealed until confronted, indicating a pattern of deception that raises ongoing reliability concerns.
  - id: C2
    facts:
    - F3
    - F4
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: Guideline H mitigation under ¶26(a) and (b) collapses in light of the fact that the individual disclosed the drug
      use only after being confronted, suggesting a lack of candor that outweighs the elapsed time and the abstinence record.
  - id: C3
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: Although the supporting testimony is corroborated, the credibility gain is negated by the prior false statement;
      the record now reflects a serious breach of truthfulness that cannot be offset by later pledges.
  - id: C4
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: The statutory presumption against granting a clearance remains operative, and the mitigating factors identified in
      C1-C3 are insufficient to overcome that presumption.
  reasoning:
    read: The central issue is whether the individual's prior illegal drug use and the later correction of a false questionnaire
      response constitute an enduring security risk. The LSO's concerns under Guidelines E and H stem from the discrepancy
      between the 2025 and 2026 questionnaires.
    weighing: Applying the Adjudicative Guidelines, the Judge finds that mitigation under Guideline E ¶17(c) does not apply
      because the omission was not a discrete, voluntarily corrected incident; it was concealed until discovery, indicating
      a breach of honesty. Likewise, mitigation under Guideline H ¶26(a) and (b) fails because the late disclosure undermines
      the credibility required for a favorable assessment, despite the individual's abstinence since 2022. The presumption
      against granting a clearance (C4) therefore prevails.
    tradecraft: The Judge issues a written decision revoking the access authorization, cites the specific guideline paragraphs
      that preclude mitigation, and files the decision in the DOE OHA docket pursuant to 10 C.F.R. § 710.7(a).
    uncertainty: High; the record contains a serious truthfulness violation that creates reasonable doubt about future reliability.
    handoff: The revocation is final for the OHA proceeding; further agency review is possible only through an appeal under
      10 C.F.R. § 710.28.
    tempting_wrong:
      option: O1
      pull: The presumption against granting can feel overly harsh, especially when the individual has shown long-term abstinence.
      why_wrong: Overlooking the undisclosed false statement would ignore a core integrity requirement of the security clearance
        process.
    rejected:
      O2: Additional drug-use evidence is unnecessary because the existing record already demonstrates a credibility breach
        that cannot be mitigated.
      O3: Holding the decision pending adds no value; the adjudicative standards have been met and the risk assessment is
        complete.
      O1: Restoration would conflict with the finding that the false statement and delayed disclosure constitute a lasting
        reliability concern.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the individual completes a federally recognized drug‑rehabilitation program and provides a certificate of successful
        completion
      then: O1
      why: Demonstrated remediation could satisfy Guideline H mitigation and offset the prior deception.
    - id: flip2
      if: the Individual had corrected the false statement on the 2025 questionnaire before any confrontation
      then: O1
      why: Guideline E mitigation under ¶17(c) would become available, supporting a restoration of access.
    would_not_change:
    - id: noflip1
      if: the Individual's past drug use remained limited to the documented period and he maintains abstinence
      why: The mitigating conditions under Guideline H stay satisfied, so the revocation would not be required.
    watch_for:
    - id: watch1
      what: any future illegal drug use or further falsification of security questionnaires
      favors:
      - O4
      why: Such conduct would reactivate the security concerns under Guidelines E and H.
  lesson: When a false security questionnaire is concealed until discovery, the lack of candor outweighs later abstinence
    and pledges. Under DOE adjudicative policy, such a breach of truthfulness justifies revocation despite the presumption
    against granting.
  limits: This analysis applies only where the individual's deception is proven and undisclosed until confronted. It does
    not extend to cases where the false statement is promptly corrected or where mitigating rehabilitation evidence is presented.
