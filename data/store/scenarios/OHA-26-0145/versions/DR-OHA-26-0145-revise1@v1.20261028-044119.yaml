case:
  id: DR-OHA-26-0145-revise1@v1
  title: Restoration of DOE Security Clearance [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, September 2026
  decider: Administrative Judge
  agent: Adjudication Support Agent
  agent_role: decide
  situation: An Individual employed by a branch of the U.S. military requires a DOE security clearance. He submitted a 2025
    questionnaire stating no illegal drug use, but later disclosed marijuana, hallucinogenic mushroom, and cocaine use on
    a 2026 questionnaire. The Local Security Office raised concerns under Guideline E (personal conduct) and Guideline H (drug
    involvement) because of the discrepancy. The Individual explained the omission as advice from a recruiter and lack of
    intent to pursue a military career at the time, and later provided testimony, exhibits, and a signed statement pledging
    abstinence. He has not used illegal drugs since August 2022, with corroborating evidence of abstinence. The Administrative
    Judge must decide whether to restore his access authorization under the applicable DOE security regulations, which presume
    against granting.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks for additional drug use evidence.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge holds the decision pending review.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge revokes the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a branch of the U.S. military in a position requiring a DOE security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual submitted a 2025 Questionnaire for National Security Positions stating he had not used illegal drugs
      in the past seven years.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual used marijuana from May 2019 through October 2021, hallucinogenic mushrooms four times between July
      and August 2020, and cocaine once in August 2022.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual submitted a 2026 questionnaire disclosing the above drug use.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline E (personal conduct) and Guideline H (drug involvement)
      due to the discrepancy between the two questionnaires.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual explained that he omitted the drug use on the 2025 questionnaire because a recruiter suggested he
      could answer 'no' if the use was in the distant past and he did not intend to pursue a military career at that time.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual provided testimony, exhibits, and a signed July 2026 statement pledging to abstain from all drug
      involvement.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual has not used illegal drugs since August 2022 and has a pattern of abstinence, corroborated by investigators
      and a source.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Director of the Office of Hearings and Appeals appointed the Administrative Judge to adjudicate the case.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Administrative Judge must decide whether to restore the Individual’s access authorization under the applicable
      DOE security regulations, which presume against granting.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F7
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Guideline E mitigation under ¶17(c) applies because the Individual’s single omission was a discrete episode, he has
      matured, and there is no indication the conduct will recur.
  - id: C2
    facts:
    - F3
    - F4
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: 'Guideline H mitigation under ¶26(a) and (b) applies: the illegal drug use occurred years ago, was infrequent, and
      the Individual has demonstrated a sustained pattern of abstinence, a signed pledge, and disassociation from drug‑using
      contacts.'
  - id: C3
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Individual’s testimony is corroborated by investigative reports, a source interview, and consistent documentary
      exhibits, establishing credibility and supporting the mitigating findings.
  - id: C4
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The presumption against granting a clearance under Part 710 is decisive; without additional, verifiable evidence
      of the Individual's drug-use history the judge must request further documentation before any restoration.
  reasoning:
    read: The case centers on whether the Individual's past illegal drug use and earlier false statement constitute an unresolved
      security risk, given the LSO's concerns under Guidelines E and H.
    weighing: Because the presumption against granting (C4) now carries strong weight and explicitly favors seeking more evidence,
      the Administrative Judge should request additional drug-use documentation (O2) before deciding on restoration. The other
      considerations remain supportive of mitigation but are outweighed by the regulatory presumption.
    tradecraft: The Judge issues an order requesting the Individual to submit any further records, test results, or affidavits
      that clarify the extent and timing of drug involvement, and notes the request in the OHA docket per 10 C.F.R. § 710.7(a).
    uncertainty: Moderate; while the record shows abstinence since 2022, the lack of comprehensive drug-use documentation
      creates uncertainty about the full scope of past involvement.
    handoff: The case will proceed to a follow-up hearing once the requested evidence is provided; the decision to restore
      or revoke will be made thereafter.
    tempting_wrong:
      option: O1
      pull: Restoring the clearance now would quickly resolve the matter and avoid further administrative burden.
      why_wrong: Restoration ignores the outstanding evidentiary gap on drug involvement, violating the presumption against
        granting and risking future security concerns.
    rejected:
      O1: Insufficient drug-use documentation means the mitigation criteria are not fully satisfied.
      O3: Holding the decision pending adds no substantive analysis; the proper step is to request the missing evidence.
      O4: Revocation is premature because the Individual has demonstrated abstinence; the appropriate response is to seek
        clarification before a final adverse action.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual had failed to correct the false statement on the 2025 questionnaire before being confronted
      then: O4
      why: Guideline E mitigation under ¶17(c) would be unavailable because the omission would not be a discrete, corrected
        episode.
    - id: flip2
      if: the Individual had voluntarily provided a complete, contemporaneous drug-use record covering the entire period in
        question
      then: O1
      why: With full documentation the judge would have sufficient evidence to restore the clearance without further inquiry.
    would_not_change:
    - id: noflip1
      if: the Individual’s past drug use remained limited to the documented period and he maintains abstinence
      why: The mitigating conditions under Guideline H remain satisfied, so the restoration stands.
    watch_for:
    - id: watch1
      what: any future illegal drug use or falsification of security questionnaires
      favors:
      - O4
      why: Such conduct would reactivate the security concerns under Guidelines E and H.
  lesson: When the regulatory presumption against granting a clearance is strong, the adjudicator must obtain complete evidence
    of past drug involvement before any mitigation can be applied.
  limits: This approach applies only where the record lacks full documentation of drug use; it does not excuse omissions that
    are already fully disclosed or where corroborating evidence already satisfies the mitigation standards.
