case:
  id: DR-CORPUS-NX-866b1de0-E3@v1
  title: Platoon Training Focus Before JRTC
  status: draft
  setting: Company training cycle, a couple of months before JRTC; Army platoon and company training context.
  decider: The Company Commander
  agent: The Company Commander
  agent_role: decide
  situation: The Company Commander is managing platoon training within the company training calendar. The platoons have been
    training on activities from their prior deployment to Afghanistan. JRTC is a couple of months away. The Company Commander
    has reviewed Army Training Network and taught platoon leaders to use a METL crosswalk to identify training tasks. Taskings,
    mandatory training, maintenance, and other requirements can limit the time available for training. Platoon leadership
    can develop training plans and present them for approval at the weekly company training meeting.
  question: What should the Company Commander do about the platoons’ training focus ahead of JRTC?
  options:
    O1:
      do: The Company Commander deprioritizes JRTC preparation and prioritizes training based on the platoons’ prior Afghanistan
        deployment.
      move: act
      irreversible: false
    O2:
      do: The Company Commander prioritizes JRTC preparation and deprioritizes training based on the platoons’ prior Afghanistan
        deployment.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Platoon leadership identifies open time on the company calendar and develops training plans for higher-level training.
  - id: F2
    kind: authority
    status: confirmed
    fact: Platoons present training plans to the Company Commander for approval at the weekly company training meeting.
  - id: F3
    kind: situation
    status: assessed
    fact: The platoons were training on activities from their prior deployment to Afghanistan.
  - id: F4
    kind: situation
    status: assessed
    fact: JRTC was a couple of months away.
  - id: F5
    kind: capability
    status: assessed
    fact: The Company Commander had reviewed Army Training Network and taught platoon leaders to use a METL crosswalk to identify
      training tasks.
  - id: F6
    kind: situation
    status: confirmed
    fact: Taskings, mandatory training, maintenance, and other requirements can limit the time available for training.
  - id: F7
    kind: capability
    status: confirmed
    fact: Platoons can research the company METL, identify individual and collective tasks that contribute to it, select training
      tasks, and prepare plans for mission-essential tasks.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The commander described the prior-deployment training as useful, but reoriented the platoons because JRTC was only
      a couple of months away. The near-term training requirement made preparation for JRTC the relevant focus.
  - id: C2
    facts:
    - F5
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The stated training approach is to use the company METL to identify platoon tasks that contribute to mission-essential
      tasks, then select and plan training for those needs. The commander had prepared platoon leaders to use a METL crosswalk
      for that purpose.
  - id: C3
    facts:
    - F6
    equity: tempo
    favors:
    - O2
    weight: weak
    why: Taskings, mandatory training, maintenance, and other requirements can reduce available training time, making it important
      to use the time that remains for the relevant training needs.
  - id: C4
    facts:
    - F1
    - F2
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: Platoon leadership can develop plans in open calendar time and present them to the commander for approval, providing
      a route to put the updated training focus into the company cycle.
  reasoning:
    read: The choice is between continuing training shaped by the prior Afghanistan deployment and preparing for the imminent
      JRTC event. The trap is treating useful prior experience as the right priority even when a different higher-level training
      requirement is approaching.
    weighing: The commander chose to reorient the platoons because JRTC was only a couple of months away {C1}. The source's
      training guidance supports identifying platoon tasks that contribute to the company METL and selecting training to meet
      mission-essential needs {C2}; limited available time reinforces the need to focus training efficiently {C3}. The balance
      depends on the upcoming training requirement and the METL tasks that support it, not simply on what the platoons trained
      during their prior deployment.
    tradecraft: Use the company METL to identify relevant individual and collective tasks, develop plans in available company-calendar
      time, and bring those plans to the weekly training meeting for approval. Coordinate through dialogue between platoon
      and company leadership, while accounting for competing requirements that limit training time.
    uncertainty: The specific company METL tasks and the amount of calendar time available are not provided, so the record
      supports the change in focus but not a detailed training schedule.
    handoff: Platoon leaders should develop and present their plans to the Company Commander at the weekly company training
      meeting; that approval route preserves the commander's role while using platoon input.
    tempting_wrong:
      option: O1
      pull: The prior Afghanistan training may feel valuable because it reflects the platoons' recent operational experience.
      why_wrong: The commander regarded that training as useful but still reoriented the platoons because JRTC was approaching
        and required a different preparation focus.
    rejected:
      O1: The commander did not keep the prior Afghanistan deployment as the priority because JRTC was only a couple of months
        away.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: JRTC were postponed beyond the relevant training cycle and the company METL instead made the prior-deployment training
        the pressing need.
      then: O1
      why: Without the near-term JRTC requirement, the training priority would depend on which mission-essential needs the
        company METL identifies.
    would_not_change:
    - id: noflip1
      if: Taskings, mandatory training, maintenance, or other requirements further reduced available training time.
      why: Those constraints make efficient selection more important; by themselves they do not make prior-deployment training
        the appropriate priority over preparation for the approaching JRTC.
    watch_for:
    - id: watch1
      what: Available company-calendar time and competing taskings or mandatory requirements.
      favors:
      - O2
      why: These determine how much training time remains and make it important to use that time for tasks supporting the
        upcoming higher-level training.
  lesson: Training should follow the relevant upcoming mission-essential needs, not simply repeat tasks from a prior deployment.
    Use the METL to select and plan training, and account for the limited time available.
  limits: This reasoning addresses the training-focus choice in a company cycle a couple of months before JRTC. It does not
    establish which specific tasks belong in the plan or resolve a different priority if the upcoming requirement or METL
    needs change.
