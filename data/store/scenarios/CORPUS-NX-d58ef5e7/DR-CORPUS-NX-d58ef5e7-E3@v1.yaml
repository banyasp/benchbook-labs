case:
  id: DR-CORPUS-NX-d58ef5e7-E3@v1
  title: Conflicting Multinational and UK Criteria
  status: draft
  setting: A multinational operation involving UK personnel; time unspecified; UK and multinational command structures.
  decider: UK personnel responsible for applying the relevant directions
  agent: UK personnel responsible for applying the relevant directions
  agent_role: decide
  situation: UK personnel are serving in a multinational operation where coalition partners may have different legal obligations
    and interpretations of the legal basis for the use of force. Multinational rules of engagement, targeting directives,
    and tactical directions apply alongside their UK equivalents. Terminology in multinational publications can make translation
    into the UK regulatory framework difficult. UK documentation may provide caveats, clarifications, and amplifications,
    and effective liaison is established at all levels of command. UK targeting staffs remain responsible for ensuring that
    targets assigned to UK assets accord with UK political, legal, and military requirements.
  question: What should UK personnel do when multinational and UK directions are contradictory or confusing?
  options:
    O1:
      do: UK personnel request clarification from UK targeting staffs on the governing criteria for the conflicting directions.
      move: ask
      irreversible: false
      to: UK targeting staffs
    O2:
      do: UK personnel apply the more restrictive criteria to the conflicting multinational and UK directions.
      move: act
      irreversible: false
    O3:
      do: UK personnel apply the less restrictive criteria to the conflicting multinational and UK directions.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Multinational operations create additional complexity for UK personnel.
  - id: F2
    kind: situation
    status: confirmed
    fact: Coalition partners may have differing legal obligations and interpretations of the legal basis for the use of force.
  - id: F3
    kind: authority
    status: confirmed
    fact: Multinational rules of engagement, targeting directives, and tactical directions apply in addition to their UK equivalents.
  - id: F4
    kind: situation
    status: confirmed
    fact: Terminology in multinational publications may make translation to the UK regulatory framework difficult.
  - id: F5
    kind: authority
    status: confirmed
    fact: Where possible, UK documentation provides additional caveats, clarifications, and amplifications.
  - id: F6
    kind: authority
    status: confirmed
    fact: Where there is contradiction or confusion, the most restrictive criteria are to be applied.
  - id: F7
    kind: authority
    status: confirmed
    fact: Effective liaison at all levels of command is essential to UK involvement in multinational targeting decisions and
      a cohesive, coordinated policy.
  - id: F8
    kind: authority
    status: confirmed
    fact: UK targeting staffs remain responsible for ensuring targets assigned to UK assets accord with UK political, legal,
      and military requirements.
  considerations:
  - id: C1
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 'The stated rule resolves the decision directly: when the directions contradict or cause confusion, apply the most
      restrictive criteria.'
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Different legal obligations, overlapping directions, and difficulty translating terminology create the circumstances
      in which the restrictive-criteria rule matters; UK caveats and clarifications may help interpret the directions but
      do not displace that rule when conflict or confusion remains.
  - id: C3
    facts:
    - F7
    - F8
    equity: chain_of_command
    favors:
    - O1
    - O2
    weight: weak
    why: Liaison and UK targeting staffs' responsibility support involving the appropriate UK staff in coordinated decisions,
      while preserving the requirement that targets assigned to UK assets meet UK requirements.
  reasoning:
    read: UK and multinational directions operate alongside one another, rather than the multinational directions replacing
      UK requirements. The trap is to treat a difficult translation or a partner's different legal position as a reason to
      adopt a more permissive interpretation when the directions are contradictory or confusing.
    weighing: The decisive consideration is the doctrine's express rule {C1}. The differing obligations, overlapping directions,
      and translation difficulties explain why the rule is needed {C2}; UK clarifications and liaison can assist, but if contradiction
      or confusion remains, the most restrictive criteria govern. The rule's application depends on whether such contradiction
      or confusion exists, not on which partner's approach is more convenient.
    tradecraft: Apply the most restrictive criteria to the conflicting or confusing directions. Use applicable UK caveats,
      clarifications, and amplifications to interpret them, and keep the decision and its basis clear in the relevant decision
      record.
    uncertainty: The passage does not specify a method for resolving every translation problem or identify a hierarchy among
      particular directions. It does state the controlling approach where contradiction or confusion exists.
    handoff: Use effective liaison at the relevant command levels and involve UK targeting staffs where targeting decisions
      or UK requirements are implicated. Liaison supports coordinated decisions; it does not replace the restrictive-criteria
      rule.
    tempting_wrong:
      option: O1
      pull: Requesting clarification from UK targeting staffs is attractive because the doctrine emphasizes liaison and UK
        staffs' responsibility for UK requirements.
      why_wrong: Clarification may assist, but it is not a substitute for the stated direction to apply the most restrictive
        criteria where contradiction or confusion exists.
    rejected:
      O1: Clarification and liaison may support the decision, but the stated rule requires applying the most restrictive criteria
        when the directions are contradictory or confusing.
      O3: Applying the less restrictive criteria conflicts with the doctrine's express rule for contradiction or confusion.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: An authoritative UK clarification establishes that the apparent contradiction or confusion is resolved and identifies
        the governing criteria.
      then: O1
      why: The express trigger for applying the most restrictive criteria would no longer be present; among the listed choices,
        seeking or confirming the governing criteria would then fit better than treating an unresolved conflict as established.
    would_not_change:
    - id: noflip1
      if: A coalition partner's criteria are less restrictive than the UK criteria while contradiction or confusion remains.
      why: The doctrine's rule still directs use of the most restrictive criteria, regardless of which partner's approach
        is less restrictive.
    watch_for:
    - id: watch1
      what: Whether UK documentation provides caveats, clarifications, or amplifications, and whether liaison or UK targeting
        staffs can clarify the UK requirements.
      favors:
      - O1
      why: These may help identify and interpret the relevant criteria; if contradiction or confusion remains, the restrictive-criteria
        rule still controls.
  lesson: When multinational and UK directions apply together, do not assume that one displaces the other. If they are contradictory
    or confusing, apply the most restrictive criteria, using UK clarification and command liaison to support coordinated,
    UK-compliant decisions.
  limits: This conclusion applies when multinational and UK directions are contradictory or confusing. The passage does not
    specify how to resolve every interpretive issue once that trigger is absent, or establish detailed procedures for requesting
    clarification.
