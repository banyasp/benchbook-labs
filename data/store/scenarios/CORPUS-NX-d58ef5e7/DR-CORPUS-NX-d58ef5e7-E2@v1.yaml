case:
  id: DR-CORPUS-NX-d58ef5e7-E2@v1
  title: Disposition of Refugee and Asylum Claimants
  status: draft
  setting: At sea or on land, under the control of UK Armed Forces.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: A Commander encounters locals at sea or on land who claim refugee status or ask for asylum. The claimants come
    under the control of UK Armed Forces and identify a place they say they are fleeing from. The Commander must decide how
    to deal with them, and the situation may present an operational challenge. A legal adviser plays a central role in advising
    the Commander about applicable legal obligations and lawful practical solutions.
  question: What should the Commander do with the claimants under UK Armed Forces control?
  options:
    O1:
      do: The Commander protects claimants by taking them to a safe place.
      move: act
      irreversible: false
    O2:
      do: The Commander endangers claimants by returning them to the place they say they fled.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: UK Armed Forces may encounter locals who claim refugee status or ask for asylum.
  - id: F2
    kind: situation
    status: confirmed
    fact: Such encounters may occur at sea or on land.
  - id: F3
    kind: authority
    status: confirmed
    fact: Military headquarters and warships at sea are not legally empowered to grant asylum.
  - id: F4
    kind: authority
    status: confirmed
    fact: Only the Home Office can grant asylum.
  - id: F5
    kind: authority
    status: confirmed
    fact: Coming under UK Armed Forces control does not give claimants a right to be taken to the UK to have their claim heard.
  - id: F6
    kind: authority
    status: confirmed
    fact: UK Armed Forces are obliged to take claimants to a safe place.
  - id: F7
    kind: authority
    status: confirmed
    fact: UK Armed Forces are obliged not to return claimants to the place they say they are fleeing from.
  - id: F8
    kind: authority
    status: confirmed
    fact: The obligation not to return claimants to the place they say they are fleeing from arises under the doctrine of
      non-refoulement.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Commander faces an operational challenge, and a legal adviser plays a central role in advising on legal obligations
      and lawful practical solutions.
  considerations:
  - id: C1
    facts:
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: bar
    why: The non-refoulement obligation is not to return claimants to the place they say they are fleeing from, so it rules
      out O2.
    rules_out:
    - O2
  - id: C2
    facts:
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: UK Armed Forces are obliged to take claimants to a safe place; O1 directly carries out that obligation.
  - id: C3
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The operational challenge calls for the legal adviser’s central role in identifying applicable obligations and lawful
      practical solutions.
  reasoning:
    read: The decision is how to protect people who claim refugee status or ask for asylum while they are under UK Armed Forces
      control. The trap is to confuse the limits on military authority to grant asylum, and the absence of a right to be taken
      to the UK, with permission to return claimants to the place they say they fled. Granting asylum belongs to the Home
      Office, but that does not displace the Armed Forces’ stated obligations.
    weighing: The safe-place obligation supports {O1} {C2}, while non-refoulement bars {O2} {C1}. The lack of a right to be
      taken to the UK does not cancel either obligation. The Commander should apply those rules to the circumstances with
      the legal adviser’s help in finding a lawful practical solution {C3}.
    tradecraft: Identify the place claimants say they are fleeing and assess whether the proposed destination is a safe place;
      do not treat the absence of a right to UK transfer as a reason to return them there. Record the legal advice, the destination
      considered, and the basis for the decision.
    uncertainty: The doctrine states the obligations but does not define what makes a place safe or prescribe how to resolve
      every operational difficulty; those matters require case-specific legal advice.
    handoff: The Commander decides how to deal with the claimants, with the legal adviser playing a central role in advising
      on applicable obligations and lawful practical solutions. Any decision to grant asylum is for the Home Office, not the
      Commander.
    tempting_wrong:
      option: O2
      pull: The Commander may mistake the absence of a right to be taken to the UK, or the operational challenge, for a basis
        to return the claimants.
      why_wrong: Neither point overrides the stated obligation not to return claimants to the place they say they are fleeing
        from under non-refoulement.
    rejected:
      O2: Returning claimants to the place they say they fled is barred by the stated non-refoulement obligation.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A later binding legal rule expressly removed the applicable safe-place and non-refoulement obligations and established
        that returning these claimants to the identified place was lawful.
      then: O2
      why: That changed legal premise could remove the grounds for choosing O1 and barring O2; it is not the rule described
        here.
    would_not_change:
    - id: noflip1
      if: The claimants have no right to be taken to the UK to have their claim heard.
      why: The absence of a right to be taken to the UK does not remove the separate obligation to take claimants to a safe
        place or not return them to the place they say they fled.
    - id: noflip2
      if: The Commander or military headquarters lacks authority to grant asylum.
      why: That limit reserves asylum decisions to the Home Office; it does not cancel the Armed Forces’ stated protective
        obligations.
    watch_for:
    - id: watch1
      what: Operational difficulties in identifying a safe place or carrying out the protective obligations lawfully.
      favors:
      - O1
      why: The source identifies this as an operational challenge and assigns the legal adviser a central role in advising
        on obligations and lawful practical solutions.
  lesson: Limits on an official’s authority to grant status do not erase separate duties owed to people under that official’s
    control. Do not infer permission to return claimants to a place they say they fled merely because they have no right to
    be taken to the decision-maker’s home country.
  limits: This reasoning applies to people claiming refugee status or asking for asylum while under UK Armed Forces control.
    It does not determine whether asylum should be granted, identify a particular safe place, or resolve operational questions
    beyond those addressed here.
  library:
    domain: operational-command
    family: CORPUS-NX-d58ef5e7
    source: https://assets.publishing.service.gov.uk/media/5b23ab59e5274a18fc321cad/20180614-doctrine_uk_legal_spt_jdp_3_46.pdf
    episode_focus: The doctrine says military headquarters and warships cannot grant asylum, and that claimants do not thereby
      acquire a right to be taken to the UK. It requires taking them to a safe place or not returning them to the place they
      say they fled, because of non-refoulement; exclude decisions about granting asylum, which belong to the Home Office.
    cues:
      option_words:
        O1: 11
        O2: 14
      real_option: O1
      real_to_mean_other_length: 0.79
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
    equities: pilot2
