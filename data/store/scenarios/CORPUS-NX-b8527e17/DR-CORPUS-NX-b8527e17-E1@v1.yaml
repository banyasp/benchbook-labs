case:
  id: DR-CORPUS-NX-b8527e17-E1@v1
  title: Who Should Manage DoD ELINT?
  status: draft
  setting: United States, early 1958, National Security Council and Department of Defense.
  decider: The National Security Council
  agent: The National Security Council
  agent_role: decide
  situation: By early 1958, the military departments maintained their own interests in DoD ELINT, while management by NSA
    was under consideration. ANEEG and its successor, NTPC, provided a centralized point for ELINT analysis, but ANEEG's coordinating
    powers were informal. DoD ELINT was assessed as needing more coordination and cohesive signal analysis and processing.
    Presidential-level committees had recommended bringing ELINT under NSA, and the President supported that direction. The
    National Security Council faced a choice about whether to centralize management under NSA, retain management among the
    military departments, or assign NSA a narrower coordinating role.
  question: What should the National Security Council do about the management of DoD ELINT?
  options:
    O1:
      do: The National Security Council would centralize DoD ELINT management under NSA.
      move: act
      irreversible: false
    O2:
      do: The National Security Council would decentralize DoD ELINT management among departments.
      move: act
      irreversible: false
    O3:
      do: The National Security Council would give NSA a coordinating role for DoD ELINT.
      move: partial
      irreversible: false
      to: NSA
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: When NSA was formed in 1952, including ELINT in its charter was considered alongside COMINT.
  - id: F2
    kind: situation
    status: confirmed
    fact: The military departments wanted to manage their own ELINT interests and did not want NSA to manage ELINT.
  - id: F3
    kind: capability
    status: assessed
    fact: DoD ELINT needed coordination and management, particularly a cohesive signal analysis and processing effort.
  - id: F4
    kind: situation
    status: confirmed
    fact: In 1952, ANEEG was established as a centralized ELINT analysis point and a focal point for difficult analytic problems,
      with informal coordinating powers.
  - id: F5
    kind: situation
    status: confirmed
    fact: In 1955, ANEEG was redesignated as NTPC under the USAF Air Staff as ELINT processing problems grew.
  - id: F6
    kind: authority
    status: confirmed
    fact: Presidential-level committees in 1954 and 1957 recommended bringing ELINT under NSA's purview.
  - id: F7
    kind: authority
    status: confirmed
    fact: The President strongly backed efforts to have NSA manage U.S. ELINT.
  considerations:
  - id: C1
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: DoD ELINT was assessed to need coordination and management, particularly a cohesive signal analysis and processing
      effort; centralized management directly addresses that stated need.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: ANEEG provided a centralized analysis point but had only informal coordinating powers, and processing problems grew
      as it became NTPC; analysis and coordination needed stronger management.
  - id: C3
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Presidential-level committees recommended bringing ELINT under NSA, and the President strongly backed that direction,
      which culminated in NSCID No. 6.
  - id: C4
    facts:
    - F2
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The military departments wanted to retain management of their own ELINT interests, a real institutional preference
      that was not treated as controlling.
  reasoning:
    read: The central issue is not whether the departments preferred their own management, but whether that arrangement could
      provide the coordination and cohesive analysis DoD ELINT needed. The existence of a centralized analysis point can make
      a limited coordinating role seem sufficient, but ANEEG's coordinating powers were informal and processing problems continued
      to grow.
    weighing: The stated need for cohesive analysis and management, together with the limits of informal coordination, favors
      centralizing management under NSA {C1} {C2}. The military departments' preference for managing their own interests weighs
      against that choice, but the presidential-level recommendations and strong presidential backing support it {C3} {C4}.
      The balance depends on the assessment that stronger coordination and management were needed; NSCID No. 6 then gave NSA
      operational and technical control, subject to certain exceptions.
    tradecraft: Make the management allocation explicit in the governing directive, record the rationale as the need for cohesive
      analysis and coordination, and specify applicable exceptions and accountability so the departments and NSA have a clear
      authority structure.
    uncertainty: The passage identifies the need for coordination and the limits of ANEEG's informal powers, but it does not
      compare the expected costs or performance of alternative management arrangements or detail the exceptions to NSA's control.
    handoff: The National Security Council should set the management direction through its directive and ensure DoD leadership
      has a clear implementation and review role, consistent with the described DoD implementation and top-management review.
    tempting_wrong:
      option: O3
      pull: ANEEG already offered a centralized analysis point, so a coordinating role for NSA may appear to preserve departmental
        management while improving collaboration.
      why_wrong: 'Centralized analysis is distinct from effective management: ANEEG''s coordinating powers were informal,
        while DoD ELINT was assessed to need coordination and management and processing problems were growing.'
    rejected:
      O2: It preserves the departments' preferred arrangement but does not answer the stated need for cohesive analysis and
        stronger coordination.
      O3: It offers coordination without the management authority that the stated need and NSCID No. 6 addressed.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The need for cohesive analysis and management were no longer present and the military departments could coordinate
        their ELINT efforts effectively under their own management.
      then: O2
      why: Without the coordination and management deficiency that drives the rationale, the case for displacing departmental
        management would be substantially reduced.
    - id: flip2
      if: A continuing need for cohesive analysis remained, but NSA could not exercise management authority and a formal coordinating
        role could reliably meet that need.
      then: O3
      why: A narrower role would then address the coordination problem without relying on centralized NSA management.
    would_not_change:
    - id: noflip1
      if: The military departments continued to prefer managing their own ELINT interests while the assessed need for cohesive
        analysis and presidential backing remained.
      why: The departments' preference does not outweigh the assessed coordination need and presidential-level support for
        NSA management.
    watch_for:
    - id: watch1
      what: Whether the scope of NSA's authority and its exceptions are made clear in the governing directive.
      favors:
      - O1
      why: NSCID No. 6 assigned NSA operational and technical control, subject to certain exceptions; the directive should
        make the authority allocation and its limits clear.
  lesson: When separate departments retain their own interests but a shared mission requires cohesive analysis, an informal
    coordinating body may not provide enough authority to resolve the management problem. If stronger coordination is the
    stated need and senior authority supports a unified arrangement, make the management responsibility explicit rather than
    relying on informal coordination.
  limits: This reasoning addresses the historical allocation of DoD ELINT management, not the merits or legal limits of any
    particular collection activity. It does not establish that centralization is preferable where cohesive analysis is not
    needed or where a coordinating arrangement is shown to be sufficient.
