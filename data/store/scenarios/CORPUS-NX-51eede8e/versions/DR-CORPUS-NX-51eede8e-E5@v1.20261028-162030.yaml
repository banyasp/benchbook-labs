case:
  id: DR-CORPUS-NX-51eede8e-E5@v1
  title: Assigning Cryptanalytic Responsibility
  status: draft
  setting: 1942, Interdepartmental Intelligence Conference and Joint Intelligence Committee/JCS process
  decider: The President
  agent: The President
  agent_role: decide
  situation: Officials identified duplication of effort and incomplete coverage among cryptographic bureaus. Cryptanalytic
    units, existing or planned, were present in the Army, Navy, FBI, FCC, Office of Censorship, Weather Bureau, and COI. Responsibility
    was divided among the Army, Navy, and FBI, with some overlapping assignments. A subcommittee was convened to address coordination
    and cooperation in cryptanalytic work among the three services. A conference subcommittee proposed an allocation among
    the Army, Navy, and FBI, and the JIC chairman recommended seeking presidential approval to end cryptanalytic efforts outside
    those agencies.
  question: What should the President do about assigning cryptanalytic responsibility among the Army, Navy, FBI, and other
    agencies?
  options:
    O1:
      do: The President decentralizes cryptanalytic responsibility among the Army, Navy, FBI, and other agencies and permits
        their units to continue.
      move: act
      irreversible: false
    O2:
      do: The President centralizes cryptanalytic responsibility in the Army, Navy, and FBI and directs other agencies to
        discontinue their units.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The FCC chairman identified duplication of effort and incomplete coverage resulting from improper coordination among
      cryptographic bureaus.
  - id: F2
    kind: situation
    status: confirmed
    fact: Cryptanalytic units, existing or planned, were present in the Army, Navy, FBI, FCC, Office of Censorship, Weather
      Bureau, and COI.
  - id: F3
    kind: situation
    status: confirmed
    fact: Responsibility was divided among the Navy, Army, and FBI, and all three had responsibility for enemy diplomatic
      work.
  - id: F4
    kind: situation
    status: confirmed
    fact: An interdepartmental subcommittee took up coordination and cooperation in the cryptanalytic work of the three services.
  - id: F5
    kind: situation
    status: confirmed
    fact: A conference subcommittee proposed an allocation of work among the Army, Navy, and FBI, with some matters assigned
      by committee.
  - id: F6
    kind: authority
    status: assessed
    fact: The JIC chairman recommended that presidential approval be sought to eliminate cryptanalytic efforts outside the
      Army, Navy, and FBI.
  - id: F7
    kind: authority
    status: confirmed
    fact: The JCS forwarded the allocation recommendation to the President on 8 July 1942.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The identified problem was that improper coordination among numerous existing or planned bureaus produced both duplicated
      effort and incomplete coverage. Ending work outside the three designated agencies responds to that coordination failure.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Army, Navy, and FBI already shared responsibility, including overlapping diplomatic work. A conference subcommittee
      addressed coordination and proposed an allocation among those agencies, with some matters assigned by committee, providing
      a coordinated alternative to continuing units across additional agencies.
  - id: C3
    facts:
    - F6
    - F7
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The JIC chairman recommended seeking presidential approval to end cryptanalytic efforts outside the Army, Navy, and
      FBI, and the JCS forwarded the allocation recommendation to the President. This supports handling the change through
      the established decision chain.
  reasoning:
    read: 'The choice is whether to retain dispersed cryptanalytic units or assign responsibility to the Army, Navy, and FBI
      under a proposed allocation. The central problem is not simply that several agencies had units: improper coordination
      was assessed to cause both duplication and gaps. The trap is assuming that more separate units necessarily mean more
      complete coverage.'
    weighing: The reported coordination failure and the proposed allocation among the three agencies favor ending work elsewhere
      {C1} {C2}. The JIC chairman's recommendation and the JCS referral support presidential action through the established
      process {C3}. The record does not give comparative performance evidence for each unit, but the stated rationale and
      endorsed outcome favor O2.
    tradecraft: Implement the assigned division of responsibility and discontinue cryptanalytic units outside the three designated
      agencies. Where staff are transferred to continue their work, record the transfer and the agency responsible; keep a
      clear record of any committee-assigned matters.
    uncertainty: The record identifies duplication and incomplete coverage but does not quantify their extent or compare the
      performance of individual agencies. It also does not describe how the proposed allocations would be reviewed after implementation.
    handoff: The President should decide through the JCS/JIC process and involve the Budget Director in implementation, as
      the recommendation was forwarded through the JCS and the President directed the Budget Director to implement it.
    tempting_wrong:
      option: O1
      pull: Keeping every agency's unit could appear to preserve more capacity and broaden coverage.
      why_wrong: The stated problem was that improper coordination among bureaus was already producing duplication and incomplete
        coverage; the proposed allocation offered a way to assign responsibility within the Army, Navy, and FBI.
    rejected:
      O1: It was not chosen because continuing units across additional agencies would retain the dispersed arrangement associated
        with duplication and incomplete coverage.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Evidence showed that agencies outside the Army, Navy, and FBI had distinct, necessary responsibilities that could
        not be covered under the proposed allocation without recreating gaps.
      then: O1
      why: That would weaken the case for ending outside efforts by showing that decentralization could address a coverage
        need the allocation did not meet.
    would_not_change:
    - id: noflip1
      if: Additional agencies had existing or planned units, but there was no evidence that their continued independent work
        would resolve the coordination problem.
      why: The existence of more units alone does not answer the stated concern that improper coordination produced duplication
        and incomplete coverage.
    watch_for:
    - id: watch1
      what: Whether the smaller units outside the Army, Navy, and FBI are actually discontinued, and whether staff are transferred
        where work is to continue.
      favors:
      - O2
      why: Implementation of the decision depended on ending outside units and, in at least one case, transferring personnel
        to the Navy.
  lesson: When dispersed responsibility is assessed to cause both duplicated effort and incomplete coverage, adding more independent
    units is not automatically a remedy. Assign clear responsibility through an authorized process and implement that allocation
    consistently.
  limits: This reasoning concerns the 1942 decision to allocate cryptanalytic responsibility among agencies, not the merits
    of any cryptanalytic method or operation. It does not establish that centralization is preferable where distinct responsibilities,
    legal constraints, or evidence of improved coordination point the other way.
  library:
    domain: intel-oversight
    family: CORPUS-NX-51eede8e
    source: https://media.defense.gov/2021/Jul/13/2002761537/-1/-1/0/CRYPTOLOGIC_ASPECTS_OF_GI.PDF
