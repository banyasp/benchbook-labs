  lesson: Do not infer duplicate funding merely from separate budget entries; distinguish the evidence from the comptroller's
    concern. If a funding restriction rests on that concern, verify what the entries represent while accurately recording
    the decision and its basis.
  limits: This was a brief budget decision, not a general legal rule governing departmental funding restrictions. The facts
