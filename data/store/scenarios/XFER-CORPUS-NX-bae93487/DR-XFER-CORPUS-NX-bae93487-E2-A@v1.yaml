case:
  id: DR-XFER-CORPUS-NX-bae93487-E2-A@v1
  title: A Ground-Station Upgrade in Two Budgets
  status: draft
  setting: Department headquarters, Washington, D.C., during review of the FY 2027 budget; Office of the Comptroller.
  decider: The Department Comptroller
  agent: The Department Comptroller
  agent_role: decide
  situation: During the department's budget review, the comptroller's staff examined funding for a satellite ground-station
    upgrade. The Space Command operations budget contained an entry for the upgrade. The Space Acquisition Office procurement
    budget also contained an entry for it. The comptroller believed the project had been funded twice. The comptroller must
    decide what to do about the acquisition office's funding.
  question: What should the comptroller do about the Space Acquisition Office's procurement funding for the upgrade?
  options:
    O1:
      do: The comptroller should curtail the Space Acquisition Office's procurement funding for the upgrade.
      move: act
      irreversible: false
    O2:
      do: The comptroller should continue the Space Acquisition Office's procurement funding for the upgrade.
      move: act
      irreversible: false
    O3:
      do: The comptroller should ask Space Command and the Space Acquisition Office to clarify the upgrade's budget entries.
      move: ask
      irreversible: false
      to: Space Command and the Space Acquisition Office
  facts:
