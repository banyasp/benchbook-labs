case:
  id: DR-CORPUS-NX-d3c57573-E1@v1
  title: Urgency and Intelligence Reliability
  status: draft
  setting: Place and date not specified; when time is at a premium; intelligence function
  decider: The responsible intelligence official (not specified)
  agent: The responsible intelligence official
  agent_role: decide
  situation: Information has been obtained to meet an intelligence requirement. The usual consideration is whether it can
    be converted into intelligence before dissemination. Time may be at a premium, and full processing and analysis may not
    be possible. Prompt dissemination may involve communicating that the information is unprocessed and may not be reliable.
    Data-centric approaches allow assessment of a wider range of information and data without relying on a judgment about
    the value of a single piece of information.
  question: 'What should the responsible intelligence official do when time is at a premium and full processing and analysis
    may not be possible: wait for processing or disseminate promptly with a caveat?'
  options:
    O1:
      do: The responsible intelligence official disseminates the information with an unprocessed, potentially unreliable caveat.
      move: act
      irreversible: true
    O2:
      do: The responsible intelligence official withholds the information pending full processing and analysis.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Information may be obtained to meet an intelligence requirement.
  - id: F2
    kind: situation
    status: confirmed
    fact: Whenever possible, information obtained for an intelligence requirement should be converted into intelligence before
      dissemination.
  - id: F3
    kind: situation
    status: confirmed
    fact: Time may be at a premium.
  - id: F4
    kind: situation
    status: confirmed
    fact: When time is at a premium, full processing and analysis may not be possible.
  - id: F5
    kind: situation
    status: confirmed
    fact: When full processing and analysis may not be possible, dissemination should occur as quickly as possible.
  - id: F6
    kind: situation
    status: confirmed
    fact: Promptly disseminated information may be caveated as unprocessed and potentially unreliable.
  - id: F7
    kind: capability
    status: confirmed
    fact: Data-centric approaches allow assessment of a wider range of information and data.
  - id: F8
    kind: capability
    status: confirmed
    fact: Data-centric approaches allow assessment without relying on the judgment of the value of a single piece of information.
  considerations:
  - id: C1
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The guidance prefers converting information into intelligence before dissemination whenever possible, supporting
      delay when processing is feasible.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: When time is at a premium and full processing and analysis may not be possible, the guidance says to disseminate
      as quickly as possible.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The guidance accommodates prompt dissemination by caveating that the information is unprocessed and may not be reliable.
  - id: C4
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Data-centric approaches permit assessment across a wider range of information without depending on a judgment about
      the value of one item; this is supporting context, not a replacement for the urgency condition.
  reasoning:
    read: This is a conditional urgency decision, not a general choice between speed and analysis. The trap is treating the
      preference to process information first as an absolute rule even when time is at a premium and full processing may not
      be possible.
    weighing: The ordinary preference for prior conversion into intelligence supports {O2} when that is possible {C1}. But
      when time is at a premium and full processing and analysis may not be possible, the stated direction is prompt dissemination
      {C2}, with an explicit reliability caveat {C3}. Data-centric assessment offers broader context without assigning decisive
      value to one item {C4}. The balance depends on the actual time pressure and whether full processing is feasible.
    tradecraft: Make the urgency and processing limitation explicit in the decision record, and ensure the information is
      identified as unprocessed and potentially unreliable when disseminated. Do not present it as fully processed intelligence.
      These recording steps are decision-practice synthesis, not additional source requirements.
    uncertainty: The guidance acknowledges that promptly disseminated information may not be reliable. It does not specify
      a threshold for when time is at a premium or how reliability should be assessed in an individual case.
    handoff: The guidance does not specify a required referral or approval chain. The responsible intelligence official should
      decide within their authority; any separate approval requirement would need to be checked under applicable policy.
    tempting_wrong:
      option: O2
      pull: Waiting for full processing appears to protect analytic reliability and follows the normal preference to convert
        information into intelligence before dissemination.
      why_wrong: That preference applies whenever possible; it does not displace the stated direction to disseminate quickly
        when time is at a premium and full processing may not be possible.
    rejected:
      O2: It was not chosen because the stated urgency condition calls for dissemination as quickly as possible when full
        processing and analysis may not be possible.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Full processing and analysis are possible before dissemination without the stated time pressure.
      then: O2
      why: The guidance says information should be converted into intelligence before dissemination whenever possible.
    would_not_change:
    - id: noflip1
      if: The information remains unprocessed and may not be reliable.
      why: That is the caveat the guidance specifies for prompt dissemination under time pressure, not by itself a reason
        to wait.
    watch_for:
    - id: watch1
      what: Whether time is genuinely at a premium and full processing and analysis may not be possible.
      favors:
      - O1
      why: Those are the conditions that trigger the direction to disseminate as quickly as possible.
  lesson: Prefer converting information into intelligence before dissemination when that is possible. When time is at a premium
    and full processing and analysis may not be possible, disseminate promptly while clearly caveating that the information
    is unprocessed and may not be reliable.
  limits: This reasoning applies to the stated intelligence urgency decision; it does not establish that prompt dissemination
    is appropriate when time is not at a premium or when full processing is feasible. It also does not supply a general reliability
    threshold or replace other applicable authority and policy.
