    domain: intel-analysis
    family: CORPUS-NX-d3c57573
    source: https://assets.publishing.service.gov.uk/media/653a4b0780884d0013f71bb0/JDP_2_00_Ed_4_web.pdf
    episode_focus: The decision point is whether to wait for full processing or disseminate promptly with a caveat that the
      information is unprocessed and may be unreliable. Focus on the urgency-versus-reliability trade-off; exclude operational
      collection or dissemination techniques.
