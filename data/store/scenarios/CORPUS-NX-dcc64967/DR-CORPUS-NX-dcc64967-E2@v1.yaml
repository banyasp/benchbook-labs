case:
  id: DR-CORPUS-NX-dcc64967-E2@v1
  title: Air America’s Helicopter Commitment
  status: draft
  setting: Saigon, March 28, Air America
  decider: Air America leadership
  agent: Air America leadership
  agent_role: decide
  situation: On March 28, detailed planning for a helicopter evacuation option was to proceed. Rooftops in downtown Saigon
    could not support heavy Marine Corps aircraft, and Air America was considered the only organization able to provide the
    needed helicopter capability. Air America was asked to contribute helicopters for the evacuation. A shortage of pilots
    meant that many aircraft would have to be flown by single-pilot crews. That staffing arrangement was assessed as risky,
    although Air America expressed no reservations about that aspect of the evacuation.
  question: What should Air America leadership do about committing additional aircraft and accepting single-pilot crews for
    the Saigon evacuation?
  options:
    O1:
      do: Air America leadership authorizes 13 additional helicopters for the evacuation and accepts single-pilot crewing.
      move: act
      irreversible: true
    O2:
      do: Air America leadership declines 13 additional helicopters for the evacuation and limits its helicopter commitment.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Detailed planning for the helicopter evacuation option was to proceed by March 28.
  - id: F2
    kind: situation
    status: assessed
    fact: Rooftops that might be used for evacuation could not support heavy Marine Corps aircraft.
  - id: F3
    kind: capability
    status: assessed
    fact: Air America was considered the only organization able to provide the helicopter capability needed for the evacuation.
  - id: F4
    kind: situation
    status: confirmed
    fact: Air America’s contribution involved taking 13 helicopters out of flyable storage.
  - id: F5
    kind: capability
    status: confirmed
    fact: With the additional helicopters, Air America had a total of 28 helicopters and pledged to have 24 available at any
      given time.
  - id: F6
    kind: situation
    status: confirmed
    fact: A shortage of pilots meant that many of the helicopters would have to be flown by single-pilot crews.
  - id: F7
    kind: situation
    status: assessed
    fact: The single-pilot staffing arrangement was assessed as risky.
  - id: F8
    kind: situation
    status: assessed
    fact: Air America was described as accustomed to such risks and expressed no reservations about that aspect of the evacuation.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: humanitarian_access
    favors:
    - O1
    weight: strong
    why: The rooftops could not support heavy Marine Corps aircraft, and Air America was considered the only organization
      able to provide the needed helicopter capability. Declining the additional aircraft would therefore limit the identified
      means of reaching people through the evacuation.
  - id: C2
    facts:
    - F6
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: The pilot shortage meant many helicopters would have single-pilot crews, an arrangement assessed as risky. That risk
      weighs against expanding the commitment, but the source does not treat it as a reason that rules out the evacuation.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Air America was accustomed to such risks and expressed no reservations about that aspect of the evacuation. This
      supports proceeding despite the acknowledged risk, without establishing that the risk was absent.
  reasoning:
    read: 'This was a capability gap in an evacuation: the contemplated rooftops could not accommodate heavy Marine Corps
      aircraft, and Air America was considered the only provider of the needed helicopter capability. The trap is to treat
      the risky single-pilot arrangement either as an automatic veto or as harmless merely because Air America accepted it.'
    weighing: The need for Air America's unique helicopter capability weighs strongly toward committing the additional aircraft
      {C1}. The shortage of pilots and the assessed risk weigh against that choice {C2}; Air America's stated familiarity
      with and lack of reservations about the risk support proceeding, but do not erase it {C3}. On the stated balance, the
      capability need and Air America's acceptance outweighed the identified staffing risk. The balance depends on Air America
      remaining uniquely able to provide the needed capability and the risk remaining one it was prepared to accept.
    tradecraft: Record the capability need, the additional aircraft commitment, the pilot shortage, and the acknowledged staffing
      risk as part of the decision rationale. Keep the commitment and the risk assessment visible to the responsible leadership
      as circumstances change.
    uncertainty: The stated reasons identify the staffing arrangement as risky but do not quantify the risk or describe further
      measures to reduce it. The decision rests on the assessed capability gap and Air America's expressed willingness to
      accept that risk.
    handoff: Air America leadership should decide the commitment, with evacuation planners confirming the continuing need
      for its unique capability and aviation leadership informing the decision about the staffing risk.
    tempting_wrong:
      option: O2
      pull: Declining the additional aircraft avoids accepting an arrangement assessed as risky for Air America personnel.
      why_wrong: It gives that risk decisive weight despite the stated need for Air America's unique helicopter capability
        and its expressed lack of reservations about this aspect of the evacuation.
    rejected:
      O2: Air America did not limit its contribution because the evacuation required helicopter capability it alone was considered
        able to provide, and it accepted the identified single-pilot risk.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Another organization could provide the needed helicopter capability for the evacuation.
      then: O2
      why: Air America's unique capability is a central reason to commit; a viable alternative would reduce the cost of limiting
        its contribution.
    - id: flip2
      if: The contemplated rooftops could support heavy Marine Corps aircraft.
      then: O2
      why: The stated need for Air America's helicopter capability would be reduced.
    would_not_change:
    - id: noflip1
      if: The single-pilot arrangement remains assessed as risky.
      why: That risk was already part of the decision and, by itself, did not outweigh the stated capability need and Air
        America's expressed acceptance.
    watch_for:
    - id: watch1
      what: A change in the availability of pilots that alters the extent or character of the single-pilot staffing risk.
      favors:
      - O2
      why: A materially greater staffing risk could change the balance against expanding the commitment.
  lesson: When an organization is assessed as the only provider of a capability needed for an evacuation, declining to contribute
    can leave a serious capability gap. A known and accepted operational risk still deserves weight; acceptance is not proof
    that the risk is absent.
  limits: This reasoning applies to the stated evacuation decision and its assessed capability gap. It does not establish
    that single-pilot staffing is generally acceptable or that the same balance would hold if the risk, available alternatives,
    or evacuation need changed.
