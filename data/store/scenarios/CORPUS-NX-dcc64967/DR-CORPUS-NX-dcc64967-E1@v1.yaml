case:
  id: DR-CORPUS-NX-dcc64967-E1@v1
  title: Whether to Authorize the Saigon Evacuation
  status: draft
  setting: Saigon, late morning on April 29, the Ambassador's office
  decider: The Ambassador
  agent: The Ambassador
  agent_role: decide
  situation: By this point, South Vietnam appeared doomed, and the remaining Americans and foreign nationals were considered
    in need of evacuation. South Vietnamese people judged particularly at risk were also among those to be evacuated. The
    South Vietnamese Army had fought and lost its final battle at Xuan Loc on April 20, but the Ambassador continued to equivocate
    about proceeding. He had delayed evacuation measures while hoping for a negotiated settlement and seeking to avoid causing
    panic. The previous day, a South Vietnamese air strike had hit Tan Son Nhut, and communist rockets struck it shortly after
    midnight. By late morning on April 29, the Ambassador faced the choice of authorizing evacuation or continuing to withhold
    authorization.
  question: 'What should the Ambassador do: authorize or decline evacuation of the remaining Americans, foreign nationals,
    and South Vietnamese judged particularly at risk?'
  options:
    O1:
      do: The Ambassador declines evacuation of the remaining Americans, foreign nationals, and South Vietnamese judged particularly
        at risk.
      move: act
      irreversible: false
    O2:
      do: The Ambassador authorizes evacuation of the remaining Americans, foreign nationals, and South Vietnamese judged
        particularly at risk.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: South Vietnam was assessed as doomed.
  - id: F2
    kind: situation
    status: assessed
    fact: The remaining Americans and friendly foreign nationals were considered in need of evacuation.
  - id: F3
    kind: situation
    status: assessed
    fact: South Vietnamese people deemed particularly at risk in the event of a communist victory were included among those
      to be evacuated.
  - id: F4
    kind: situation
    status: confirmed
    fact: The South Vietnamese Army fought and lost its final battle at Xuan Loc on April 20.
  - id: F5
    kind: situation
    status: assessed
    fact: After the battle at Xuan Loc, the Ambassador continued to equivocate about evacuation.
  - id: F6
    kind: situation
    status: assessed
    fact: The Ambassador had resisted overt evacuation steps while hoping for a negotiated settlement and seeking to avoid
      causing panic.
  - id: F7
    kind: situation
    status: confirmed
    fact: A South Vietnamese air strike hit Tan Son Nhut the day before the decision point.
  - id: F8
    kind: situation
    status: confirmed
    fact: Communist rockets struck Tan Son Nhut shortly after midnight.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: South Vietnam was assessed as doomed, and the remaining Americans, friendly foreign nationals, and South Vietnamese
      judged particularly at risk were considered in need of evacuation.
  - id: C2
    facts:
    - F4
    - F5
    equity: tempo
    favors:
    - O2
    weight: strong
    why: After the South Vietnamese Army lost its final battle at Xuan Loc, the Ambassador continued to equivocate despite
      the deteriorating situation; the need to act should have been clear.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Waiting offered a chance to pursue a negotiated settlement and avoid causing panic, but those aims were reasons for
      delay rather than evidence that evacuation was no longer needed.
  - id: C4
    facts:
    - F7
    - F8
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The air strike on Tan Son Nhut and the communist rocket barrage preceded the Ambassador's order and reinforced the
      urgency of acting.
  reasoning:
    read: The situation was assessed as terminal for South Vietnam, while people judged at particular risk still needed evacuation.
      The trap was allowing hope for a negotiated settlement and fear of causing panic to sustain delay after the military
      situation had sharply deteriorated.
    weighing: The stated reasons for waiting—pursuing a settlement and avoiding panic—carried some weight, but they were outweighed
      by the assessment that South Vietnam was doomed, the loss at Xuan Loc, and the attack on Tan Son Nhut. The balance depends
      on the assessment that evacuation was needed and that the situation was deteriorating, not on a general rule that evacuation
      must always be immediate.
    tradecraft: Authorize the decision clearly, identify its scope as the groups specified in the decision, and record the
      known facts and reasons for acting rather than continuing to defer. This is decision documentation, not a description
      of evacuation operations.
    uncertainty: The account does not detail the practical feasibility of evacuation, the precise basis for judging particular
      South Vietnamese people at risk, or the expected effects of overt action on panic. Those limits do not displace the
      assessment that evacuation was needed.
    handoff: The Ambassador was the decider in this scenario. No separate approval or handoff is identified.
    tempting_wrong:
      option: O1
      pull: Continuing to wait could preserve hope for a negotiated settlement and avoid causing panic.
      why_wrong: That rationale did not answer the central assessment that South Vietnam was doomed and the remaining people
        identified for evacuation needed to leave; the subsequent strike and rocket barrage added urgency.
    rejected:
      O1: The Ambassador did not continue withholding authorization because the assessed need to evacuate and the deteriorating
        situation outweighed the reasons for delay.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible negotiated settlement had emerged that materially reduced the danger to the people identified for evacuation.
      then: O1
      why: That would remove or reduce the central assessment that evacuation was needed, making further delay potentially
        defensible.
    - id: flip2
      if: The assessment that South Vietnam was doomed and that the listed groups needed evacuation were materially reversed
        by reliable new information.
      then: O1
      why: The case for authorization rests on those assessments and the deteriorating situation.
    would_not_change:
    - id: noflip1
      if: Concern about causing panic remained, but the assessment of impending defeat and the need to evacuate did not change.
      why: That concern was already a reason for delay and, on the facts given, did not outweigh the need to act.
    watch_for:
    - id: watch1
      what: Reliable indications that the military situation or immediate danger to the people at risk had materially changed.
      favors:
      - O2
      why: Further deterioration would reinforce the urgency of authorization; a material reduction in danger would warrant
        reassessing the balance.
  lesson: When people are assessed to need evacuation and the broader situation is judged to be collapsing, hopes of a negotiated
    outcome and concern about panic should not become indefinite grounds for delay. Reassess those concerns against current
    conditions and act when the evidence shows the need has become urgent.
  limits: This reasoning addresses only the choice to authorize or withhold evacuation in the circumstances described. It
    does not establish a general evacuation rule or resolve operational feasibility, legal authority, or the criteria for
    selecting individuals in other situations.
