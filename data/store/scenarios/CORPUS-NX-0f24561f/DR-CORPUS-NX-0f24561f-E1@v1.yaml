case:
  id: DR-CORPUS-NX-0f24561f-E1@v1
  title: Pleiku and the Retaliation Decision
  status: draft
  setting: Washington and South Vietnam, February 1965, U.S. presidential administration.
  decider: The President of the United States
  agent: The President of the United States
  agent_role: decide
  situation: On 7 February 1965, a Viet Cong raid on U.S. installations at Pleiku killed eight Americans, wounded 109, and
    damaged numerous aircraft. Earlier, on Christmas Eve 1964, the administration had refrained from strong retaliation after
    an attack on American barracks, despite civilian and military recommendations. Four days before the Pleiku raid, the intelligence
    chief warned that the Soviet premier’s visit to Hanoi could signal more active Soviet policy, increased aid to North Vietnam,
    and greater support for subversion in the South. The national security adviser judged the military situation grim, had
    prepared a recommendation for sustained reprisal the day before the raid, and urged immediate retaliation afterward. He
    characterized the raid as coordinated with the Soviet visit, while a senior intelligence analyst questioned that interpretation.
  question: What should the President do about retaliation against North Vietnam after the Pleiku attack?
  options:
    O1:
      do: The President authorizes sustained reprisal against North Vietnam.
      move: act
      irreversible: true
    O2:
      do: The President declines sustained reprisal against North Vietnam.
      move: act
      irreversible: false
    O3:
      do: The President requests an assessment before deciding.
      move: ask
      irreversible: false
      to: intelligence officials
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On Christmas Eve 1964, the Viet Cong bombed American barracks.
  - id: F2
    kind: situation
    status: confirmed
    fact: After the attack on the barracks, the President refrained from strong retaliation despite recommendations from civilian
      and military advisers.
  - id: F3
    kind: situation
    status: confirmed
    fact: On 7 February 1965, a Viet Cong raid on U.S. installations at Pleiku killed eight Americans, wounded 109, and damaged
      numerous aircraft.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Four days before the Pleiku raid, the intelligence chief assessed that the Soviet premier’s visit to Hanoi signaled
      a more active Soviet policy and would probably lead to increased Soviet aid to North Vietnam and greater encouragement
      of subversion in the South.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The national security adviser judged the situation in South Vietnam grim, with the enemy holding the military initiative
      through much of the countryside.
  - id: F6
    kind: situation
    status: confirmed
    fact: On the day before the Pleiku raid, the national security adviser prepared a draft recommendation for a policy of
      sustained reprisal.
  - id: F7
    kind: situation
    status: confirmed
    fact: After learning of the damage at Pleiku, the national security adviser recommended immediate retaliation against
      North Vietnam.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The national security adviser characterized the Pleiku raid as a challenge coordinated with the Soviet premier’s
      visit to Hanoi.
  - id: F9
    kind: intelligence
    status: assessed
    fact: A senior intelligence analyst questioned the view that the Pleiku raid was a coordinated communist action.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The Pleiku raid caused substantial U.S. casualties after an earlier attack had drawn no strong retaliation. Pleiku
      was the event that moved the President toward major escalation.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The national security adviser judged the situation in the South grim, while the intelligence chief assessed that
      the Soviet visit could bring greater support for North Vietnam and subversion in the South. Together, these assessments
      supplied a strategic rationale for a forceful response.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The national security adviser had already prepared a recommendation for sustained reprisal and urged immediate retaliation
      after the raid. Pleiku provided a basis for activating a policy that had been under consideration for over a year.
  - id: C4
    facts:
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O3
    - O2
    weight: strong
    why: The national security adviser's claim that the raid was coordinated with the Soviet visit was disputed by a senior
      intelligence analyst. The coordination claim should therefore not be treated as established support for retaliation.
  reasoning:
    read: 'This was a deadly attack on U.S. personnel amid a worsening assessment of the position in South Vietnam, and the
      national security adviser was already advocating sustained reprisal. The trap is to treat the coincidence with the Soviet
      visit as proof that the raid was coordinated: an intelligence analyst questioned that interpretation.'
    weighing: The case for O1 rests on the casualties at Pleiku, the grim military assessment, concern about increased Soviet
      support, and the adviser's recommendation for sustained reprisal. Those considerations explain why the attack helped
      activate a policy already under consideration. But the coordination claim was disputed, and the decision locked the
      United States onto a path of massive intervention without adequate public disclosure or debate. The balance supports
      the stated outcome, but its strategic rationale depends in part on assessments that were not all accepted.
    tradecraft: Separate confirmed events from assessments and disputed interpretations. Record the President's authority,
      the advice received, the disagreement over coordination, and the reasons for choosing retaliation; do not present the
      disputed interpretation as fact.
    uncertainty: The raid and its casualties are established in the scenario, but whether it was coordinated with the Soviet
      visit is disputed. It is not established that retaliation would reduce North Vietnam's ability to support the Viet Cong.
    handoff: The President decides, while seeking and recording views from intelligence and national-security advisers because
      the decision depends on disputed strategic assessments as well as the attack itself.
    tempting_wrong:
      option: O1
      pull: The scale of the casualties, the grim assessment, and the adviser's urgent recommendation make immediate sustained
        reprisal compelling.
      why_wrong: The choice itself is the stated outcome; the tempting mistake is to justify it by treating the claimed coordination
        with the Soviet visit as proven, despite the analyst's contrary view.
    rejected:
      O2: The stated outcome was to move to sustained reprisal in response to Pleiku and the broader strategic assessments,
        rather than continue the earlier restraint.
      O3: The decision moved to retaliation after the adviser's recommendation; a further intelligence assessment was not
        the chosen course.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A timely, credible assessment established that the raid was not coordinated with the Soviet visit and that the visit
        did not signal the increased support assessed by the intelligence chief.
      then: O3
      why: That would weaken a central strategic premise for immediate reprisal while leaving the grave attack itself undisputed;
        further assessment would then be preferable to treating coordination as established.
    - id: flip2
      if: Further assessment showed that sustained reprisal was unlikely to reduce North Vietnam's ability to support the
        Viet Cong and would instead risk prolonging the conflict.
      then: O2
      why: The claimed strategic benefit would be weaker, while the risks of escalation would weigh against retaliation.
    would_not_change:
    - id: noflip1
      if: The earlier barracks attack had also gone without strong retaliation.
      why: That precedent alone would not determine the response to the more consequential Pleiku attack or resolve the strategic
        assessments at this decision point.
    watch_for:
    - id: watch1
      what: Whether intelligence review supports or undermines the claimed link between the Pleiku raid, the Soviet visit,
        and increased support for North Vietnam.
      favors:
      - O3
      - O2
      why: The coordination claim is disputed, and the strategic case for reprisal depends partly on the interpretation of
        those events.
  lesson: A grave attack can support a forceful response, but a disputed account of who coordinated it should not be converted
    into a fact. Distinguish the confirmed harm from the strategic interpretation, and make clear how much the decision depends
    on each.
  limits: This reasoning addresses a presidential decision about retaliation and escalation. It does not establish a legal
    rule for the use of force or determine what response would be lawful in other circumstances.
