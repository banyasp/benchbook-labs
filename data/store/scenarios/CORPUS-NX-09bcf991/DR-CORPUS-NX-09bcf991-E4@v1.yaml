case:
  id: DR-CORPUS-NX-09bcf991-E4@v1
  title: 'Buraimi: Force or Negotiation'
  status: draft
  setting: Buraimi Oasis, October 1955, British government
  decider: The British government
  agent: The British government
  agent_role: decide
  situation: In October 1955, the British government faced an unresolved Saudi claim to Buraimi after an arbitration commission
    had dissolved. The Saudi representative had lobbied commission members and offered monetary inducements, and the British
    delegate had resigned. British officials had considered a deal with Riyadh, while the Foreign Office raised concerns about
    relations with Abu Dhabi, Muscat, American oil companies, and the United States. The British government regarded the Imam’s
    bid for international recognition as a possible challenge to its position in the Gulf. Potential compromises remained,
    and the British government asserted a duty to protect the legitimate interests of the rulers of Abu Dhabi and Muscat.
  question: 'What should the British government do after the arbitration commission dissolves: use force to restore the rulers’
    prior control of Buraimi or continue seeking a negotiated settlement?'
  options:
    O1:
      do: The British government abandons restoration of prior control and continues seeking a negotiated settlement.
      move: act
      irreversible: false
    O2:
      do: The British government requests renewed arbitration and leaves the control dispute unresolved pending that process.
      move: ask
      irreversible: false
      to: Saudi Arabia
    O3:
      do: The British government uses force to restore the rulers' prior control of Buraimi.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A commission convened in Geneva in September 1955 to evaluate Saudi Arabia’s claim to Buraimi.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Saudi representative lobbied other commission members and offered monetary inducements for support.
  - id: F3
    kind: situation
    status: confirmed
    fact: The British delegate resigned, and the arbitration commission dissolved.
  - id: F4
    kind: situation
    status: confirmed
    fact: British officials considered a deal with Riyadh, but the Foreign Office warned that it could harm relations with
      Abu Dhabi and Muscat and with American oil companies and the United States.
  - id: F5
    kind: situation
    status: assessed
    fact: British officials assessed that the Imam’s efforts with the Arab League might gain international recognition for
      the Imamate and unravel the British position in the Gulf.
  - id: F6
    kind: authority
    status: confirmed
    fact: The British government stated that its duty was to protect the legitimate interests of the ruler of Abu Dhabi and
      the Sultan of Muscat.
  - id: F7
    kind: situation
    status: confirmed
    fact: Potential compromises remained in the Buraimi dispute.
  - id: F8
    kind: situation
    status: confirmed
    fact: British oil companies pressed the British government to act amid the wider regional dispute.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: impartiality
    favors:
    - O3
    weight: strong
    why: The Saudi representative offered monetary inducements to commission members, and the commission dissolved after the
      British delegate resigned. The British government treated the arbitration route as compromised rather than as a reliable
      way to settle the claim.
  - id: C2
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The British government justified restoring prior control as an exercise of its stated duty to protect the legitimate
      interests of the rulers of Abu Dhabi and Muscat.
  - id: C3
    facts:
    - F5
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: British officials feared that the Imam's international efforts could unravel the British position in the Gulf, while
      British oil companies pressed for action. These were part of the policy context favoring decisive restoration, though
      they also reveal strategic and commercial interests.
  - id: C4
    facts:
    - F4
    - F7
    equity: partner_relationship
    favors:
    - O1
    - O2
    weight: weak
    why: Potential compromises remained, and the Foreign Office warned that a deal with Riyadh could harm relations with Abu
      Dhabi, Muscat, American oil companies, and the United States. These concerns weighed against a forceful course, but
      did not lead the government to continue negotiation after the commission dissolved.
  reasoning:
    read: This was both an unresolved territorial claim and a contest over British influence in the Gulf. The trap is to treat
      the commission's collapse as either automatic proof that force was justified or as a reason to disregard the British
      government's stated duty and strategic concerns. The decision was made amid compromised arbitration, remaining possible
      compromises, and British interests.
    weighing: The British government chose restoration after the commission dissolved in the wake of reported inducements
      and intimidation. It publicly grounded its action in protecting the rulers' legitimate interests, while officials also
      feared that the Imamate might gain international recognition and weaken Britain's Gulf position. Remaining compromises
      and the Foreign Office's concerns about relations with regional rulers and American interests counted in favor of continued
      negotiation, but the government gave greater weight to the failed arbitration and its stated protective duty. The balance
      depends on accepting the government's assessment that the arbitration process had become unreliable and that delay threatened
      its policy position.
    tradecraft: At the decision level, distinguish the stated protective rationale from the strategic and commercial interests
      also present; record the basis for choosing restoration over renewed negotiation and identify the unresolved Saudi border
      claim. Do not present the government's asserted duty as an independent legal ruling.
    uncertainty: The arbitration's fairness was not independently determined, and the border dispute remained unresolved.
      Saudi Arabia rejected the British position on the borders, while the British government attributed the commission's
      failure to bribery and intimidation.
    handoff: The British government made the decision. Because the choice implicated relations with Abu Dhabi, Muscat, Riyadh,
      and the United States, consultation across the relevant diplomatic and policy responsibilities would be prudent; no
      required referral is specified.
    tempting_wrong:
      option: O2
      pull: Renewed arbitration could appear to preserve a negotiated path and address the unresolved claim.
      why_wrong: The British government judged that hopes for an arbitrated settlement had been disappointed by bribery and
        intimidation, and proceeded to restore the rulers' prior control rather than leave the issue unresolved for another
        arbitration.
    rejected:
      O1: The government did not abandon restoration to continue seeking a negotiated settlement, despite remaining possible
        compromises and concerns about relations with the United States and regional rulers.
      O2: The government did not request renewed arbitration; after the commission dissolved, it treated the failed process
        and its stated duty to protect the rulers' interests as grounds to restore prior control.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible, impartial arbitration process acceptable to the parties were available after the commission's dissolution.
      then: O2
      why: A reliable process could address the unresolved claim without treating the compromised commission as the only route
        to settlement.
    - id: flip2
      if: A negotiated arrangement could protect the rulers' stated interests while addressing the Saudi claim and the Foreign
        Office's relationship concerns.
      then: O1
      why: That would make continued negotiation a more viable way to meet the stated protective aim while avoiding force.
    would_not_change:
    - id: noflip1
      if: Saudi Arabia continued to reject the British position on the borders without any other material change in the situation.
      why: Rejection alone would not resolve whether arbitration was compromised or whether the government's stated protective
        duty could be met through negotiation.
    watch_for:
    - id: watch1
      what: Whether the Imamate's efforts with the Arab League appeared likely to gain international recognition.
      favors:
      - O3
      why: British officials assessed that such recognition might unravel Britain's position in the Gulf.
  lesson: When a negotiated process fails amid credible indications that it has been compromised, a government may favor restoring
    the status it regards as necessary to protect its responsibilities. The decision should still distinguish that protective
    rationale from strategic and commercial interests, and should reconsider negotiation if a credible process becomes available.
  limits: This reasoning reflects the British government's stated judgment in this particular dispute; it does not establish
    that the border claim was legally resolved or that force was independently determined to be lawful. It should not be generalized
    to cases where a fair process remains available or the asserted protective duty is not supported.
