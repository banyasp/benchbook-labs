case:
  id: DR-CORPUS-NX-722864d6-E4@v1
  title: Assigning LOGCOP Ownership
  status: draft
  setting: BCT logistics planning and unit preparation; time and place unspecified; Army brigade combat team.
  decider: The BSB commander, in coordination with the BCT executive officer/S-4
  agent: The BSB commander, in coordination with the BCT executive officer/S-4
  agent_role: decide
  situation: The BCT S-4 is responsible for monitoring logistics status across the BCT. Combat training center observations
    indicate that the SPO builds and manages the LOGCOP. Units arrive without clarity about who creates and maintains it.
    That uncertainty can result in separate LOGCOPs or no LOGCOP. The decision concerns ownership and process for the BCT
    LOGCOP.
  question: What should the BSB commander, coordinating with the BCT executive officer/S-4, do about ownership and maintenance
    of the BCT LOGCOP?
  options:
    O1:
      do: The BSB commander, coordinating with the BCT executive officer/S-4, assigns separate owners and maintains separate
        LOGCOPs for the BCT.
      move: act
      irreversible: false
    O2:
      do: The BSB commander, coordinating with the BCT executive officer/S-4, requests unit recommendations on LOGCOP ownership
        and process before deciding.
      move: ask
      irreversible: false
      to: BCT units
    O3:
      do: The BSB commander, coordinating with the BCT executive officer/S-4, assigns one owner and maintains one LOGCOP for
        the BCT.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The BCT S-4 is responsible for monitoring logistics status across the BCT.
  - id: F2
    kind: situation
    status: assessed
    fact: Combat training center observations indicate that the SPO builds and manages the LOGCOP.
  - id: F3
    kind: situation
    status: confirmed
    fact: Units arrive without knowing who is responsible for creating and maintaining the LOGCOP.
  - id: F4
    kind: situation
    status: assessed
    fact: Unclear ownership can result in the SPO and BCT S-4 creating separate LOGCOPs or neither creating one.
  - id: F5
    kind: situation
    status: confirmed
    fact: The unit needs to determine who owns the LOGCOP and train accordingly.
  - id: F6
    kind: situation
    status: confirmed
    fact: The recommended LOGCOP allows maneuver and logistics commanders to view the same data in near real time.
  - id: F7
    kind: authority
    status: confirmed
    fact: The BSB commander, in coordination with the BCT executive officer/S-4, needs to determine LOGCOP ownership and the
      process for developing and maintaining it.
  - id: F8
    kind: situation
    status: confirmed
    fact: The recommendation calls for one LOGCOP for the BCT, posted for all units' situational understanding.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: chain_of_command
    favors:
    - O3
    weight: strong
    why: Unclear responsibility risks either competing LOGCOPs or none; the unit needs to settle who owns it and train accordingly.
  - id: C2
    facts:
    - F6
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: One LOGCOP lets maneuver and logistics commanders use the same near-real-time picture and supports unity of command
      and effort.
  - id: C3
    facts:
    - F1
    - F7
    equity: chain_of_command
    favors:
    - O3
    weight: strong
    why: The BSB commander, coordinating with the BCT executive officer/S-4, is to determine ownership and the process for
      developing and maintaining the BCT LOGCOP.
  reasoning:
    read: The problem is not whether the BCT needs a LOGCOP, but who is accountable for making and maintaining the shared
      one. The trap is allowing the S-4's responsibility for monitoring logistics status and the SPO's observed role in building
      and managing the LOGCOP to remain unresolved, which can produce either duplication or absence.
    weighing: 'The balance favors {O3}: resolving ownership addresses the risk of separate or nonexistent pictures, while
      one BCT LOGCOP supports shared understanding and unity of command and effort. The recommendation assigns the ownership
      and process decision to the BSB commander in coordination with the BCT executive officer/S-4; its balance depends on
      keeping the product common across the BCT rather than dividing it.'
    tradecraft: The BSB commander and BCT executive officer/S-4 should make the ownership and maintenance process explicit,
      communicate it to the units, and train to that arrangement. The process should preserve one LOGCOP for BCT-wide situational
      understanding.
    uncertainty: The source identifies the competing roles and recommends deciding ownership, but does not prescribe which
      office must perform the day-to-day work or give a detailed maintenance process.
    handoff: The BSB commander should decide in coordination with the BCT executive officer/S-4, as the recommendation assigns
      them responsibility for determining ownership and process; the decision should then be communicated to the units that
      will use the common picture.
    tempting_wrong:
      option: O2
      pull: Requesting unit recommendations may seem inclusive and may surface practical concerns about ownership and process.
      why_wrong: A request alone does not resolve who owns the LOGCOP; the recommendation places that determination with the
        BSB commander coordinating with the BCT executive officer/S-4.
    rejected:
      O1: Separate owners and LOGCOPs would remove the common picture the recommendation calls for.
      O2: Requesting unit recommendations without deciding ownership leaves the identified ambiguity unresolved.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A controlling command policy required separate LOGCOPs for distinct BCT functions rather than one BCT-wide picture.
      then: O1
      why: A binding requirement for separate products could displace the recommendation to maintain one common LOGCOP.
    would_not_change:
    - id: noflip1
      if: The SPO continues to build and manage the LOGCOP in practice.
      why: That observed practice does not by itself resolve the ownership question; the recommendation still calls for explicit
        ownership and one BCT LOGCOP.
    watch_for:
    - id: watch1
      what: Whether units continue to arrive unclear about who creates and maintains the LOGCOP.
      favors:
      - O3
      why: Continuing uncertainty reinforces the need to settle ownership and train units accordingly.
  lesson: When uncertainty about responsibility could produce competing products or no product, assign ownership and establish
    the maintenance process. Where the purpose is a common operational picture, preserve one shared picture and train units
    to the assigned arrangement.
  limits: This reasoning addresses ownership and maintenance of the BCT LOGCOP, not the specific data it should contain or
    its technical implementation. It does not establish which office must perform every day-to-day task.
