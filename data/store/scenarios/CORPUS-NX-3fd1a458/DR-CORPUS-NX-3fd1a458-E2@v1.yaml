case:
  id: DR-CORPUS-NX-3fd1a458-E2@v1
  title: Emergency Assistance in Deteriorating Weather
  status: draft
  setting: Long Tieng area, as daylight was running out; Air America aviation operations.
  decider: The Air America helicopter pilots
  agent: The Air America helicopter pilots
  agent_role: decide
  situation: A pilot flying for the Ravens could not return to Long Tieng after the weather closed in. Cloud banks covered
    the ridges, fog was filling the valley, and daylight was running out. The pilot had 45 minutes of fuel remaining, while
    a flight to Vientiane was estimated to take one hour. Ravens at the hootch reported heavy rain and very dark conditions.
    One Raven volunteered to contact Air America helicopter pilots for help.
  question: What should the Air America helicopter pilots do about providing assistance to the Raven pilot?
  options:
    O1:
      do: The Air America helicopter pilots launch assistance to the Raven pilot.
      move: act
      irreversible: true
    O2:
      do: The Air America helicopter pilots keep their helicopters grounded and decline assistance.
      move: act
      irreversible: false
    O3:
      do: The Air America helicopter pilots defer assistance and wait for weather conditions to improve.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The Raven pilot could not return to Long Tieng after the weather closed in.
  - id: F2
    kind: situation
    status: assessed
    fact: Cloud banks were resting on ridge lines, and fog was filling the valley.
  - id: F3
    kind: situation
    status: assessed
    fact: The pilot had 45 minutes of fuel, while a flight to Vientiane was estimated to take one hour.
  - id: F4
    kind: situation
    status: assessed
    fact: Daylight was running out rapidly.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Ravens at the hootch reported that rain was coming down mercilessly and it was getting very dark.
  - id: F6
    kind: situation
    status: assessed
    fact: A Raven volunteered to contact Air America helicopter pilots to seek their advice.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The Raven pilot could not get back to Long Tieng and had less fuel remaining than the estimated flight time to Vientiane,
      making assistance time-critical for the person in distress.
  - id: C2
    facts:
    - F2
    - F5
    equity: own_force_life
    favors:
    - O2
    - O3
    weight: strong
    why: Cloud on the ridges, valley fog, heavy rain, and very dark conditions made launching hazardous for the helicopter
      pilots as well as for the Raven pilot.
  - id: C3
    facts:
    - F3
    - F4
    equity: tempo
    favors:
    - O1
    weight: strong
    why: With only 45 minutes of fuel and daylight running out, waiting for conditions to improve could leave too little time
      to help.
  - id: C4
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: A Raven sought the helicopter pilots' advice, prompting them to respond to the request for assistance; the account
      does not describe a separate assessment or stated rationale from the pilots.
  reasoning:
    read: 'This was an urgent assistance decision: the Raven pilot could not return, had limited fuel, and faced worsening
      weather and fading daylight. The trap is to treat launching as plainly safe because help was needed, or to treat staying
      grounded or waiting as consequence-free; the account records the launch but does not explain the pilots'' risk assessment.'
    weighing: The account's context favors acting because the Raven pilot's fuel and time were running out {C1} {C3}. The
      severe weather and darkness weigh against exposing the helicopter pilots to danger {C2}. The pilots launched after a
      Raven contacted them {C4}, but the source does not say how they evaluated that hazard or what alternatives they considered.
    tradecraft: At the decision level, make the urgency, weather hazard, and available alternatives explicit, communicate
      the decision to those involved, and record the basis and material uncertainties. These are decision-practice suggestions,
      not procedures stated in the account.
    uncertainty: The account gives the emergency conditions and the pilots' launch, but not their deliberation, their assessment
      of risk to themselves, or whether they considered other options.
    handoff: The Raven sought the Air America pilots' advice, and they appear to have made the launch decision. The account
      does not indicate that they referred it to a higher authority; do not infer that one was involved.
    tempting_wrong:
      option: O3
      pull: Waiting for the weather to improve avoids an immediate launch into dangerous conditions.
      why_wrong: The pilot had only 45 minutes of fuel, the flight to Vientiane was estimated at an hour, and daylight was
        running out; the account's outcome was to launch assistance rather than wait.
    rejected:
      O2: Keeping the helicopters grounded would avoid exposing their pilots to the severe conditions, but would leave the
        Raven pilot without the assistance the Air America pilots launched to provide.
      O3: Deferring until the weather improved was not chosen in the time-critical circumstances of limited fuel and rapidly
        fading daylight.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The pilots had reliable information that launching could not provide meaningful assistance and would expose their
        crews to grave danger.
      then: O2
      why: The balance would shift against a launch that offered no realistic help while creating grave danger for the assisting
        crews.
    - id: flip2
      if: The Raven pilot had reached a safe alternative and no longer needed immediate assistance.
      then: O3
      why: With the immediate need removed, deferring assistance would avoid unnecessary exposure in the severe weather.
    would_not_change:
    - id: noflip1
      if: The severe rain and darkness remained, while the Raven pilot was still unable to return and had the same limited
        fuel and time.
      why: Those adverse conditions were present in the account when the pilots launched; on the available facts, they do
        not alone reverse the urgent need for assistance.
    watch_for:
    - id: watch1
      what: Whether the Raven pilot's immediate need or the danger to the assisting pilots materially changes.
      favors:
      - O2
      - O3
      why: Either a reduced need for help or substantially increased danger to the assisting crews could alter the balance.
  lesson: When a person faces an urgent, worsening emergency, delay can itself carry serious consequences. Assistance may
    still expose rescuers to substantial danger, so the decision should balance the urgency against that risk rather than
    treating either action or inaction as automatically safe.
  limits: The account records the emergency and the launch, but gives no explicit risk assessment or decision standard. This
    reasoning should not be treated as a general rule to launch in severe weather or as a substitute for applicable aviation
    safety requirements.
