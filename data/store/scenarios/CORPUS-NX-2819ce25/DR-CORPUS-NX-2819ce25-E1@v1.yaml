case:
  id: DR-CORPUS-NX-2819ce25-E1@v1
  title: 'Truk: Assault or Supply Constraint'
  status: draft
  setting: Truk Island; time not stated; American military
  decider: The American military command
  agent: The American military command
  agent_role: decide
  situation: The American military had attacked many Japanese bases. A large Japanese base at Truk Island presented a separate
    command-level choice. The base was strongly defended, and an assault was assessed as likely to cost too many lives. The
    command faced a choice between assaulting the base and limiting supplies from Truk.
  question: What should the American military command do regarding the Japanese base at Truk Island and supplies from Truk?
  options:
    O1:
      do: The American military command authorizes an assault on the strongly defended Japanese base at Truk and attacks it.
      move: act
      irreversible: true
    O2:
      do: The American military command declines an assault on the strongly defended Japanese base at Truk and limits supplies
        from Truk.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The American military had attacked many Japanese bases.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Japanese base at Truk Island was distinguished from the bases the American military attacked.
  - id: F3
    kind: situation
    status: confirmed
    fact: Truk Island had a large Japanese base.
  - id: F4
    kind: situation
    status: assessed
    fact: The Japanese base at Truk Island was strongly defended.
  - id: F5
    kind: situation
    status: assessed
    fact: An assault on the base at Truk Island was assessed as likely to cost too many lives.
  - id: F6
    kind: capability
    status: confirmed
    fact: Limiting supplies from Truk was a course available to the American military.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Truk's large base was strongly defended, distinguishing it from the bases already attacked and weighing against an
      assault.
  - id: C2
    facts:
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: An assault was assessed as likely to cost too many lives, a direct reason to avoid attacking the base.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Limiting supplies from Truk was an available alternative to assault; the source gives no further account of its expected
      effect.
  reasoning:
    read: The command had attacked many Japanese bases, but Truk presented a distinct choice because its large base was strongly
      defended and an assault was assessed as likely to cost too many lives. The trap is to treat the prior attacks as a reason
      to assault Truk despite those specific concerns.
    weighing: 'The source''s stated reasons favor declining the assault: the base was too strong, attacking it would cost
      too many lives, and the command had to limit supplies from Truk. The balance depends chiefly on the assessment of the
      base''s defenses and the expected loss of life; the source does not explain the anticipated effectiveness of supply
      limits.'
    tradecraft: At the command level, record the choice, the defense and loss-of-life assessments, and why the available supply-limiting
      course was selected. Do not treat the prior attacks on other bases as a substitute for assessing Truk on its own facts.
    uncertainty: The source does not quantify the expected loss of life, explain the basis of the defense assessment, or describe
      how limiting supplies would work or what effect it would have.
    handoff: The American military command is the decision-maker in this account. The source does not identify a separate
      authority or consultation required for this choice.
    tempting_wrong:
      option: O1
      pull: The American military had attacked many other Japanese bases, which could make another assault seem like a natural
        continuation.
      why_wrong: 'That general pattern does not answer the Truk-specific reasons given: its defenses were too strong and an
        assault would cost too many lives.'
    rejected:
      O1: The command did not choose an assault because Truk was too strongly defended and attacking it was assessed as likely
        to cost too many lives.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The command assessed that the base was not strongly defended and that assault would not cost too many lives.
      then: O1
      why: Removing both stated reasons against assault could change the balance toward attacking, though the source does
        not say that it would.
    would_not_change:
    - id: noflip1
      if: The American military had attacked many other Japanese bases, but the Truk-specific defense and loss-of-life assessments
        remained unchanged.
      why: Attacks on other bases alone would not override the specific reasons to avoid assault at Truk.
    watch_for:
    - id: watch1
      what: Whether limiting supplies from Truk remains an available course.
      favors:
      - O2
      why: Its availability is part of the alternative the source identifies; the source does not address what to do if it
        ceases to be available.
  lesson: Do not assume that a course used against other targets should be repeated when a particular target presents materially
    different risks. When an assault is assessed as likely to cost too many lives and another course is available, those considerations
    can support avoiding the assault.
  limits: This reasoning addresses only the command-level choice described and does not establish a general rule for attacks
    or supply restrictions. The source gives no legal standard, casualty estimate, or assessment of the alternative's effectiveness.
