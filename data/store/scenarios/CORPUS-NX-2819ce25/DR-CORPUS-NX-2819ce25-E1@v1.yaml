    episode_focus: The decision point is whether to attack a strongly defended base or avoid the assault and constrain its
      supply, with the stated concern that an attack would cost too many lives. Keep the focus on that command-level choice;
      exclude the submarine’s operational methods and daily target selection described elsewhere.
