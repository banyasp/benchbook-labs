case:
  id: DR-CORPUS-NX-ba3fb8cd-E1@v1
  title: Protocol I and the Preliminary Objection
  status: draft
  setting: South Africa; a preliminary hearing before evidence in a criminal trial; the Court.
  decider: The trial judge
  agent: The trial judge
  agent_role: decide
  situation: The accused challenges the Court’s jurisdiction and seeks protection under Protocol I. The accused’s counsel
    argues that prisoner-of-war status requires notice of an impending prosecution to a protecting power and that the trial
    cannot proceed without it. The judge has heard argument on whether Protocol I applies as customary international law incorporated
    into South African law. South Africa has not acceded to Protocol I, and the parties dispute whether State practice and
    legal acceptance support applying it to the situation asserted by the defence. The judge must also address whether the
    claimed protections raise a jurisdictional bar or a matter to be determined in the proceedings.
  question: What should the trial judge do with the preliminary objection and the request to prevent the trial from proceeding?
  options:
    O1:
      do: The trial judge grants the preliminary objection and bars the trial from proceeding.
      move: act
      irreversible: false
    O2:
      do: The trial judge denies the preliminary objection and allows the trial to proceed.
      move: act
      irreversible: false
    O3:
      do: The trial judge holds the trial and determines Protocol I's applicability before proceeding.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The accused’s position is that the Court has no jurisdiction to try him.
  - id: F2
    kind: situation
    status: assessed
    fact: The accused’s counsel argues that Protocol I entitles the accused to prisoner-of-war treatment, including notice
      of an impending prosecution to a protecting power, and that the trial cannot proceed without the notice.
  - id: F3
    kind: authority
    status: confirmed
    fact: Protocol I provides for continued prisoner-of-war protection while status is in doubt and for a judicial tribunal
      to adjudicate status before trial whenever possible under the applicable procedure.
  - id: F4
    kind: authority
    status: confirmed
    fact: The domestic-law framework presented at the hearing treats customary international law as directly operative in
      South Africa unless it conflicts with statutory or common municipal law, and requires universal recognition or South
      African assent for domestic recognition.
  - id: F5
    kind: authority
    status: assessed
    fact: The customary-law framework discussed at the hearing considers State practice and opinio juris, and the judge states
      that a custom would at least need to be widely accepted before municipal incorporation.
  - id: F6
    kind: situation
    status: assessed
    fact: The accused’s counsel relies on frequent United Nations condemnation of South Africa as State practice; the judge
      questions whether United Nations resolutions constitute State practice and distinguishes abstract declarations from
      concrete State conduct.
  - id: F7
    kind: authority
    status: assessed
    fact: The legal analysis recognizes that treaty provisions may generate customary rules, while treating non-party conduct
      and unambiguous opinio juris as relevant and non-ratification as evidence of non-acceptance.
  - id: F8
    kind: situation
    status: confirmed
    fact: South Africa has not acceded to Protocol I.
  - id: F9
    kind: situation
    status: assessed
    fact: The ANC declaration states an intention to respect humanitarian-law principles and to endeavour to respect the Geneva
      Conventions and Protocol I wherever practically possible; the declaration’s form and conditional wording are cited as
      reasons to question whether it constituted an Article 96(3) accession.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Customary international law may operate in South African law, but the judge required a rule to be widely accepted
      before municipal incorporation. The judge treated custom as ordinarily requiring State practice and opinio juris, while
      allowing that a rule might develop quickly where States share an understanding.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Frequent United Nations condemnation was not enough to establish the required practice. The judge distinguished abstract
      resolutions and declarations from concrete State conduct, reasoning that condemnations of South Africa did not show
      acceptance of Protocol I as customary law.
  - id: C3
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The judge accepted that treaty rules can generate customary law, but considered that non-parties must distinctly
      and unambiguously show acceptance. South Africa's non-ratification was strong evidence of non-acceptance, and the judge
      found too few States faced the situations Protocol I sought to regulate for general practice to develop.
  - id: C4
    facts:
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The ANC declaration expressed only an intention to respect humanitarian-law principles and an endeavour to observe
      the Conventions and Protocol I wherever practically possible. Its form and conditional terms cast serious doubt on whether
      it was an Article 96(3) accession. The judge also considered it significant that neither asserted party had accepted
      the Protocol.
  - id: C5
    facts:
    - F2
    - F3
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The judge treated the claimed prisoner-of-war protection as a question of entitlement and possible procedural irregularity,
      not as a jurisdictional bar. Article 45 envisages status determination by a competent tribunal; it does not establish
      that the municipal court lacks jurisdiction to try the accused.
  reasoning:
    read: 'The issue is not whether the accused''s asserted status or the notice requirement has already been established;
      it is whether Protocol I is part of South African law as customary international law and thereby prevents this trial
      from proceeding. The trap is treating the asserted protection as automatically jurisdictional: the judge viewed it instead
      as a status or merits defence, and concluded that Protocol I had not been incorporated through custom.'
    weighing: The decisive balance is that treaty rules can contribute to custom, but the judge required sufficiently concrete
      State practice and legal acceptance, widely accepted for municipal incorporation. United Nations condemnations and abstract
      declarations did not establish the necessary practice or opinio juris; non-ratification weighed against acceptance,
      and the ANC's conditional declaration did not establish accession. The judge therefore concluded that Protocol I was
      not customary international law forming part of South African law. The asserted prisoner-of-war protections consequently
      did not bar the trial on this preliminary objection, which was dismissed.
    tradecraft: Record the ruling as a denial of the preliminary objection and proceed with the trial. Keep the ruling confined
      to customary incorporation and jurisdiction; do not treat it as a finding on the accused's eventual status or other
      issues the judge left for determination in the proceedings.
    uncertainty: The judge said it was unnecessary to decide whether Protocol I's field-of-application provisions could ever
      become customary law. The judge also did not decide the factual questions that would arise if the Protocol applied or
      whether the accused met its requirements.
    handoff: The trial judge decides this preliminary legal objection. The ruling does not require a separate referral; subsequent
      factual and status questions, if reached in the proceedings, remain for the competent tribunal.
    tempting_wrong:
      option: O1
      pull: The asserted notice requirement, together with Protocol I's provision for status adjudication before trial whenever
        possible, can make stopping the prosecution appear necessary.
      why_wrong: The judge concluded that the Protocol was not incorporated as customary law and that the claimed protection
        did not deprive the municipal tribunal of jurisdiction; at most, failure to comply could be an irregularity if the
        Protocol applied.
    rejected:
      O1: The objection did not establish either domestic incorporation of Protocol I or a jurisdictional bar to trial.
      O3: The judge rejected the preliminary objection after concluding Protocol I was not customary law incorporated into
        South African law, rather than holding the trial to determine its applicability first.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If Protocol I were established to apply, and the accused's status remained in doubt such that Article 45 required
        status adjudication before trial where possible,
      then: O3
      why: The judge said the court would be bound by Article 45 if the Protocol's terms applied; on those conditions, holding
        the trial for status adjudication would give effect to the stated before-trial procedure.
    would_not_change:
    - id: noflip1
      if: If United Nations condemnations remained abstract statements rather than evidence of concrete State conduct and
        acceptance of Protocol I,
      why: The judge considered condemnation evidence of general opposition to South Africa's policies, not proof that Protocol
        I had become customary law.
    - id: noflip2
      if: If the ANC declaration remained conditional and had not been shown to constitute an Article 96(3) accession,
      why: The judge regarded the declaration's form and wording as insufficient to establish the ANC's unconditional acceptance
        of Protocol I.
    watch_for:
    - id: watch1
      what: Whether later proceedings establish that Protocol I applies and whether status adjudication is required before
        trial under the applicable procedure.
      favors:
      - O3
      why: The judge recognized that if the Protocol's terms applied, Article 45 would bind the court and provide for adjudication
        of status before trial whenever possible.
  lesson: A treaty provision does not bind non-parties as customary international law merely because it is widely endorsed
    in statements or resolutions. Assess concrete State practice and evidence of legal acceptance, and distinguish a claimed
    procedural protection from a jurisdictional bar.
  limits: This reasoning concerns whether Protocol I had become customary international law incorporated into South African
    law on the arguments before this judge. It does not decide whether the accused was entitled to prisoner-of-war status
    or whether Article 45 would apply if the Protocol were otherwise shown to govern.
