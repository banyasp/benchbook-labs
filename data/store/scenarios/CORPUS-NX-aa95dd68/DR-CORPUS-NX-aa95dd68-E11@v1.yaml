case:
  id: DR-CORPUS-NX-aa95dd68-E11@v1
  title: Baltic Independence and Soviet Policy
  status: draft
  setting: The Baltic republics, Soviet Union, during Gorbachev-era reforms
  decider: The Soviet leadership
  agent: The Soviet leadership
  agent_role: decide
  situation: Baltic nationalists are pressing for political independence from Moscow, while some are seeking compromise and
    avoiding confrontation. The leadership faces a choice about how to respond to these demands. Political and economic leverage
    is available before any decision about military intervention. The leadership assesses that pressure could provoke demonstrations
    and escalate toward troop deployment. A general crackdown could damage reforms and international goodwill, while allowing
    the Baltic republics to leave is viewed as a risk to regime survival.
  question: What should the Soviet leadership do about Baltic demands for political independence?
  options:
    O1:
      do: The Soviet leadership would deny Baltic independence while exhausting political and economic leverage before considering
        military intervention.
      move: act
      irreversible: false
    O2:
      do: The Soviet leadership would grant Baltic independence and allow the Baltic republics to leave the Union.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Baltic nationalists are seeking virtual economic and political independence from Moscow.
  - id: F2
    kind: situation
    status: assessed
    fact: The political challenge to Soviet rule is greatest in the Baltic republics.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Some Baltic nationalists are seeking compromise and appear inclined to avoid confrontation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A degree of autonomy combined with warnings about limits may blunt immediate demands for secession.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The leadership is expected to exhaust political and economic leverage before turning to military intervention.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The leadership recognizes that political and economic pressure could provoke demonstrations and escalate toward
      a situation in which troops are sent in.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A general crackdown in the Baltic republics is expected to be used only as a last resort and could constrain reforms
      and cost international goodwill.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Allowing the Baltic republics to leave could encourage larger nationalities, including Ukrainians, to seek similar
      goals and make regime survival problematic.
  considerations:
  - id: C1
    facts:
    - F2
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The leadership treats allowing the Baltic republics to leave as a threat to regime survival because it could encourage
      larger nationalities, including Ukrainians, to seek the same outcome.
  - id: C2
    facts:
    - F3
    - F4
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Some nationalists appear open to compromise, and a degree of autonomy paired with clear limits may blunt immediate
      secession demands without allowing the republics to leave.
  - id: C3
    facts:
    - F5
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The leadership is expected to exhaust political and economic leverage before considering military intervention, while
      recognizing that pressure itself could provoke demonstrations and escalate toward troop deployment.
  - id: C4
    facts:
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: A general crackdown could constrain reforms and cost international goodwill, so it is a last resort; nevertheless,
      the assessment considers it less risky to the regime than allowing the republics to leave.
  reasoning:
    read: The leadership faces a real challenge to Soviet rule in the Baltics, but the choice is not simply immediate force
      or unconditional independence. Some nationalists are seeking compromise, and limited autonomy may defer or blunt demands.
      The trap is to treat the risk of escalation from pressure as outweighing the assessed danger that departure could encourage
      wider secession and threaten regime survival.
    weighing: The decisive concern is the risk to regime survival if the Baltic republics leave {C1}. The prospect of compromise
      and limited autonomy supports trying to contain the immediate challenge without granting independence {C2}. Political
      and economic leverage should be exhausted first, despite its potential to provoke escalation {C3}. A general crackdown
      risks reform and international goodwill and should remain a last resort, but the assessment judges that risk less serious
      than allowing the republics to leave {C4}. The balance depends chiefly on whether autonomy and limits can blunt the
      demands and whether departure would encourage comparable claims elsewhere.
    tradecraft: Keep the distinction clear between denying independence and authorizing an immediate crackdown. Set out the
      intended limits and any autonomy offered, assess whether the response is reducing or escalating the challenge, and record
      the reasons for any move to a more coercive course for leadership review.
    uncertainty: 'The assessment is predictive: it does not establish that autonomy will blunt demands, that leverage will
      succeed, or that departure would necessarily trigger wider secession. It also recognizes that pressure may escalate
      into troop deployment.'
    handoff: The Soviet leadership is the decision-maker. It should draw on political and economic officials to assess the
      proposed response and its effects on reform and international standing, while retaining leadership-level review because
      the choice is framed as a regime-survival question.
    tempting_wrong:
      option: O2
      pull: Granting independence could avoid the escalation and reform costs associated with pressure or a crackdown.
      why_wrong: The source's assessment gives greater weight to the risk that Baltic departure would encourage larger nationalities
        to seek the same outcome and make regime survival problematic.
    rejected:
      O2: The assessment rejects allowing the Baltic republics to leave because of the anticipated risk of wider secession
        and regime instability.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that allowing the Baltic republics to leave would not encourage similar claims by other
        nationalities or make regime survival problematic.
      then: O2
      why: That would remove the assessment's central reason for denying independence, while the costs to reform and international
        goodwill would weigh more heavily.
    would_not_change:
    - id: noflip1
      if: The initial effort to blunt immediate demands with autonomy and warnings about limits fails.
      why: The assessment still calls for exhausting political and economic leverage before considering military intervention;
        failure of that effort alone does not imply allowing the republics to leave.
    - id: noflip2
      if: Political and economic pressure carries a risk of demonstrations and escalation.
      why: The assessment recognizes that risk but judges it less serious than the risk of allowing the Baltic republics to
        leave, while treating a general crackdown as a last resort.
    watch_for:
    - id: watch1
      what: Whether nationalists continue to seek compromise and whether limited autonomy can blunt immediate secession demands.
      favors:
      - O1
      why: Those conditions support a response that denies independence while seeking to defer a direct confrontation.
  lesson: When a leadership views secession as a threat to regime survival, it may favor denying independence while first
    testing political alternatives, even when those alternatives carry escalation risks. Keep that choice distinct from an
    immediate crackdown, which may impose substantial costs and remain a last resort.
  limits: This reasoning depends on the source's assessment that Baltic departure could encourage other nationalities to seek
    similar goals and endanger regime survival. It does not establish that coercive pressure is lawful, effective, or justified
    in other circumstances.
