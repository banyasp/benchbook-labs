    episode_focus: The assessment says the leadership would first exhaust political and economic leverage and treat a general
      crackdown as a last resort. The decision weighs the risk of escalation and damage to reform and international standing
      against the perceived threat that allowing Baltic republics to leave could encourage other republics and endanger regime
      survival. Exclude operational details of coercive measures.
