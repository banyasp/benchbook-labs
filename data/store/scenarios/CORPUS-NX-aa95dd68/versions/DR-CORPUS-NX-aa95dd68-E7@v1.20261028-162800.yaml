case:
  id: DR-CORPUS-NX-aa95dd68-E7@v1
  title: Responding to Political Instability
  status: draft
  setting: Soviet Union, during political instability; Soviet leadership.
  decider: The Soviet leadership
  agent: The Soviet leadership
  agent_role: decide
  situation: Political instability in the Soviet Union is creating pressure on the leadership to choose a response. Anarchy
    is considered unlikely, though a transition between political arrangements remains possible. Available responses range
    from compromise and limited restrictions to increasingly coercive measures, including emergency rule or martial law. The
    choice turns on the perceived threat to regime survival, the expected effectiveness of measures to suppress disorder,
    and possible damage to other objectives. Bloodshed, doubts about the effectiveness of force, and consequences for reform
    and foreign policy are among the stakes.
  question: What should the Soviet leadership do in responding to instability, balancing compromise against possible restrictions
    and coercive measures?
  options:
    O1:
      do: The Soviet leadership should coerce instability through a broad crackdown using escalating restrictions and emergency
        measures.
      move: act
      irreversible: false
    O2:
      do: The Soviet leadership should accommodate instability through compromise and, if needed, lower-end restrictions.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Instability may require the Soviet leadership to choose among responses that include a crackdown.
  - id: F2
    kind: situation
    status: assessed
    fact: Possible responses range from stronger restrictions to emergency measures and martial law.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The leadership's choices depend partly on how threatening instability is judged to be to regime survival.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The leadership's choices depend partly on expected effectiveness in suppressing disorder and the costs to other
      objectives.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Soviet leader is assessed to have a high tolerance for disorder and to seek compromise for as long as possible.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Bloodshed caused by a crackdown is feared to worsen conflict situations.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The effectiveness of force used in Central Asia and the Caucasus is viewed with doubt.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Broad and extended use of armed force is feared to harm reform and foreign policy.
  considerations:
  - id: C1
    facts:
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The assessment describes Gorbachev as highly tolerant of disorder and inclined to seek compromise as long as possible,
      supporting accommodation before escalation.
  - id: C2
    facts:
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: A crackdown risks bloodshed that could worsen conflict rather than contain it.
  - id: C3
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Doubts about the effectiveness of force in Central Asia and the Caucasus weaken the case for relying on coercion
      to suppress disorder.
  - id: C4
    facts:
    - F4
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Broad and extended use of armed force is feared to frustrate other important objectives, including reform and foreign
      policy.
  reasoning:
    read: 'Instability does not make anarchy or a broad crackdown inevitable: anarchy is assessed as highly unlikely, and
      if it occurs it would mark a transition in political arrangements. The trap is treating disorder alone as proof that
      extensive coercion is necessary, when the choice depends on the perceived threat to regime survival, the likely effectiveness
      of a response, and its costs to other objectives.'
    weighing: The assessment favors compromise and, if action becomes necessary, measures at the lower end of the crackdown
      range. Bloodshed could intensify conflict, doubts about force reduce its expected value, and broad coercion could damage
      reform and foreign policy. The balance depends on how threatening instability is judged to be, how effective a given
      response is expected to be, and how counterproductive it would be for other objectives.
    tradecraft: 'Keep the decision tied to those three stated judgments: record the perceived threat to regime survival, the
      expected effectiveness of the contemplated response, and its anticipated costs to other objectives. Reassess if those
      judgments materially change, without treating escalation as automatic.'
    uncertainty: 'The assessment is predictive rather than certain: it describes what Gorbachev seems likely to do and what
      he probably fears. The balance therefore depends on judgments about the severity and likely course of instability and
      the effects of coercion.'
    handoff: The Soviet leadership is the decision-maker in this frame; no separate referral or approval authority is identified.
      The leadership should base its choice on the threat, effectiveness, and counterproductiveness judgments that the assessment
      identifies.
    tempting_wrong:
      option: O1
      pull: A broad crackdown may appear to offer the strongest response to disorder and perceived threats to regime survival.
      why_wrong: The assessment doubts that force would effectively suppress disorder and warns that bloodshed could worsen
        conflict while broad coercion could undermine reform and foreign policy.
    rejected:
      O1: A broad crackdown was not favored because of the risks of worsening conflict, doubts about force's effectiveness,
        and costs to reform and foreign policy.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Instability were judged to pose a serious threat to regime survival, a coercive response were expected to suppress
        disorder effectively, and its costs to other objectives were judged limited.
      then: O1
      why: Those changed assessments could shift the balance toward stronger coercion under the criteria identified for the
        leadership's choice.
    would_not_change:
    - id: noflip1
      if: Instability exists but the assessments of regime-survival threat, likely effectiveness, and costs to other objectives
        have not materially changed.
      why: Instability by itself does not displace the stated reasons for preferring compromise and lower-end measures.
    watch_for:
    - id: watch1
      what: Changes in the perceived threat to regime survival, expected effectiveness of responses, or anticipated costs
        to reform and foreign policy.
      favors:
      - O1
      - O2
      why: These are the assessment factors on which the choice is said to hinge.
  lesson: Do not equate instability with a need for maximum coercion. Compare the threat being addressed with the expected
    effectiveness of the response and its likely costs to other objectives; prefer compromise or lower-end measures when coercion
    may intensify conflict or undermine those objectives.
  limits: This reasoning concerns the Estimate's assessment of Soviet leadership choices during political instability. It
    does not establish a legal rule or determine what response would be appropriate if the threat, expected effectiveness
    of force, or costs to other objectives were materially different.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-aa95dd68
    source: https://www.cia.gov/resources/csi/static/0d8cd4da5b88a520930989601d3455b5/At-Cold-Wars-End2-The-Soviet-Crisis-Gorbachev-and-Perestroika.pdf
    episode_focus: The Estimate describes a choice between compromise and measures ranging from lesser restrictions to a major
      crackdown, and assesses that Gorbachev would favor compromise and measures at the lower end of that range. The stated
      reasons include concern that bloodshed would worsen conflicts, doubts about the effectiveness of force, and the costs
      of broad coercion to reform and foreign policy; exclude operational details of any enforcement action.
    cues:
      option_words:
        O1: 16
        O2: 13
      real_option: O2
      real_to_mean_other_length: 0.81
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
