case:
  id: DR-CORPUS-NX-109cdd76-E8@v1
  title: Cross-Border Response and Mission Limits
  status: draft
  setting: United States and Mexico, March 1916, the presidency and War Department.
  decider: The President
  agent: The President
  agent_role: decide
  situation: After the attack on Columbus, New Mexico, pressure across the United States called for prompt punishment. The
    attack left 17 Americans and nearly 100 raiders dead. The Secretary of War had ordered a military pursuit across the border.
    The Army chief questioned whether pursuit should continue if the raider leader fled beyond Mexico, and the Secretary accepted
    that concern. The field commander argued that failure to pursue and disperse the raiding force would invite further raids,
    while guarding border locations would not prevent the raiders from finding refuge across the line. The President faced
    a choice about whether to authorize cross-border force and whether to limit its mission to pursuit and dispersal or permit
    a broader punitive action.
  question: What should the President do about authorizing cross-border force and defining the mission in response to the
    Columbus attack?
  options:
    O1:
      do: The President declines a cross-border expedition and directs the Army to defend the frontier against further raids.
      move: act
      irreversible: false
    O2:
      do: The President authorizes an open-ended punitive cross-border expedition to capture the raider leader and pursue
        the raiding force.
      move: act
      irreversible: true
    O3:
      do: The President authorizes a limited cross-border expedition to pursue and disperse the band responsible for the Columbus
        attack.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A Mexican band attacked Columbus, New Mexico, and the troops there on the morning of March 9.
  - id: F2
    kind: situation
    status: confirmed
    fact: The attack left 17 Americans and nearly 100 raiders dead.
  - id: F3
    kind: situation
    status: assessed
    fact: There was an immediate demand across the United States for prompt punishment of the raiders.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Secretary of War ordered an Army force to cross the border in pursuit of the band that attacked Columbus.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Army chief questioned whether the United States would pursue the raider leader if he fled to another country,
      and the Secretary of War agreed with the concern.
  - id: F6
    kind: situation
    status: assessed
    fact: The field commander assessed that raids would continue unless the raider leader was relentlessly pursued and his
      forces scattered.
  - id: F7
    kind: situation
    status: assessed
    fact: The field commander assessed that guarding towns, ranches, and railroads would accomplish little if the raider leader
      could take refuge across the border after each raid.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: escalation_control
    favors:
    - O3
    weight: weak
    why: The deaths and immediate public demand created pressure for a response, but the endorsed course was to answer the
      attack without making punishment the mission.
  - id: C2
    facts:
    - F1
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The field commander assessed that raids would continue unless the responsible force was pursued and dispersed; that
      assessment supports action directed at preventing further attacks.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The commander considered frontier defense alone inadequate if the raiders could take refuge across the border, supporting
      a limited pursuit rather than declining cross-border action.
  - id: C4
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The President expressly limited the expedition to pursuing and dispersing the band responsible for Columbus. The
      Secretary of War later characterized the purpose as defensive, not punitive, with capture as an objective only if achievable.
  reasoning:
    read: The choice was not simply whether to satisfy public calls for punishment. It was whether cross-border force could
      prevent further raids, and how to keep that force tied to that purpose. The trap was treating a demand for prompt punishment
      as authority for an open-ended punitive mission, or assuming frontier guarding alone would address a force able to take
      refuge across the border.
    weighing: The field commander's assessment that raids would continue without pursuit and dispersal, and that guarding
      border locations would accomplish little while refuge remained available, weighs against {O1} and for {O3}. The public
      demand supplied pressure for a response, but the President's stated limit and the Secretary of War's defensive characterization
      weigh against {O2}. The balance depends on the assessed continuing threat from the raiding band and on keeping the mission
      confined to pursuit and dispersal.
    tradecraft: 'State the mission limit clearly: pursue and disperse the band responsible for the attack, with capture an
      objective only if achievable; do not describe punishment as the purpose. Communicate that limit through the War Department
      and keep the decision record focused on the defensive purpose and the assessed need to prevent further raids.'
    uncertainty: The case for action rests in part on the field commander's assessment that raids would continue unless the
      band was pursued and dispersed. The source does not establish that capture was assured or provide a general legal rule
      for cross-border force.
    handoff: The President should set the mission's scope, with the War Department conveying that limit to the field command;
      the source records the President's direction being issued through the War Department.
    tempting_wrong:
      option: O2
      pull: The attack's deaths and the immediate demand for punishment could make an open-ended punitive response seem necessary
        to show resolve.
      why_wrong: 'The endorsed decision distinguished public pressure from the mission''s purpose: the President limited the
        expedition to pursuit and dispersal, and the Secretary of War characterized it as defensive rather than punitive.'
    rejected:
      O1: The field commander's assessment was that frontier guarding alone would not prevent further raids while the raiders
        could take refuge across the border.
      O2: The President limited the expedition to pursuit and dispersal, rather than authorizing an open-ended punitive mission.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The raiding band no longer posed a credible prospect of further attacks, so pursuit and dispersal were not needed
        for prevention.
      then: O1
      why: Without the preventive need that supports pursuit, declining cross-border force and defending the frontier would
        become the closer fit.
    would_not_change:
    - id: noflip1
      if: Public pressure for prompt punishment remained intense but there was no additional basis for broadening the mission.
      why: Public demand did not displace the President's stated limit or the defensive purpose of the expedition.
    watch_for:
    - id: watch1
      what: Whether the responsible band continues to pose a risk of further raids.
      favors:
      - O3
      why: The field commander tied the need for pursuit and dispersal to preventing continued raids.
  lesson: A forceful response to an attack need not become a punitive or open-ended mission. Tie cross-border action to the
    stated defensive objective, and limit its scope to what the assessed threat requires.
  limits: This reasoning addresses the source's stated March 1916 decision and does not establish a general legal standard
    for cross-border force. It depends on the commander's assessment that further raids were likely without pursuit and dispersal.
