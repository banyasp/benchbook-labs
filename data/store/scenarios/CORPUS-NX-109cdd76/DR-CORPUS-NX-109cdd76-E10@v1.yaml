case:
  id: DR-CORPUS-NX-109cdd76-E10@v1
  title: Cross-Border Response at El Paso
  status: draft
  setting: El Paso–Juarez border, June 1919; Southern Department.
  decider: The commander of the troops at El Paso
  agent: The commander of the troops at El Paso
  agent_role: decide
  situation: Shots fired into El Paso had wounded civilians and U.S. soldiers. Villistas were in and around Juarez, across
    the international border. The commander had authority from Southern Department headquarters to order troops across the
    border. The decision was whether to send troops into Mexico to disperse the Villistas or keep them on the U.S. side. The
    commander framed the contemplated action as protecting American citizens and stated that it was not to become an invasion
    of Mexico.
  question: What should the commander of the troops at El Paso do in response to the shots fired into El Paso?
  options:
    O1:
      do: The commander authorizes troops to cross the border into Mexico and disperse the Villistas.
      move: act
      irreversible: true
    O2:
      do: The commander prohibits troops from crossing into Mexico and keeps them on the U.S. side.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Shots fired into El Paso wounded civilians residing there.
  - id: F2
    kind: situation
    status: confirmed
    fact: Shots fired into El Paso wounded two U.S. soldiers.
  - id: F3
    kind: situation
    status: confirmed
    fact: Villistas were in and around Juarez, Mexico.
  - id: F4
    kind: authority
    status: confirmed
    fact: The commander cited authority given by Southern Department headquarters on June 12, 1919, to order troops across
      the border.
  - id: F5
    kind: situation
    status: confirmed
    fact: The commander identified dispersing the Villistas as the purpose of the contemplated cross-border action.
  - id: F6
    kind: situation
    status: confirmed
    fact: The commander described the action as intended to protect American citizens.
  - id: F7
    kind: authority
    status: confirmed
    fact: The commander stated that the troops were not to undertake an invasion of Mexico.
  considerations:
  - id: C1
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The commander cited authority from Southern Department headquarters to order troops across the border.
  - id: C2
    facts:
    - F1
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Civilians in El Paso had been wounded, and the commander described the contemplated action as intended to protect
      American citizens.
  - id: C3
    facts:
    - F2
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Two U.S. soldiers had also been wounded, a harm the commander included among the reasons for ordering the crossing.
  - id: C4
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Villistas were in and around Juarez, and the stated purpose of crossing was to disperse them.
  - id: C5
    facts:
    - F7
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: 'The commander expressly limited the authorized action: troops were not to undertake an invasion of Mexico.'
  reasoning:
    read: This was a response to shots that had wounded civilians and U.S. soldiers, with Villistas across the border and
      authority to cross cited by the commander. The trap is treating the choice as either accepting the injuries without
      action or authorizing an open-ended invasion; the stated decision was a bounded crossing to disperse the Villistas.
    weighing: The commander relied on headquarters authority and the protective purpose created by the wounds to civilians
      and U.S. soldiers. The stated aim was to disperse the Villistas, with an express limit against invasion; on those reasons,
      the balance supports {O1}.
    tradecraft: Keep the authorization tied to its stated protective purpose and non-invasion limit. Record the authority
      cited, the injuries prompting the decision, the dispersal purpose, and the limit; obtain further authorization before
      expanding beyond that scope.
    uncertainty: The excerpt gives the commander's stated authority and reasons but does not specify the governing legal standard,
      the precise scope of the headquarters authorization, or an assessment of alternatives.
    handoff: The commander acted under authority attributed to Southern Department headquarters. The excerpt does not state
      that another official had to make the decision; if the contemplated action exceeded the stated authority or non-invasion
      limit, the commander should seek higher direction.
    tempting_wrong:
      option: O2
      pull: Keeping troops on the U.S. side avoids a cross-border action.
      why_wrong: It does not reflect the commander's stated response to the injuries, the authority cited, or the limited
        purpose of dispersing the Villistas.
    rejected:
      O2: The commander chose the authorized, protective crossing to disperse the Villistas rather than keeping troops on
        the U.S. side.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander lacked authority from Southern Department headquarters to order a cross-border action.
      then: O2
      why: The source's justification expressly rests in part on that authority; without it, the stated basis for authorizing
        the crossing would be absent.
    - id: flip2
      if: The proposed crossing could not be kept within the stated protective purpose and non-invasion limit.
      then: O2
      why: The commander's stated authorization was bounded and did not extend to undertaking an invasion.
    would_not_change:
    - id: noflip1
      if: Mexican officials denounced the cross-border action.
      why: 'Mexican officials'' denunciations alone would not alter the stated basis: the commander relied on authority and
        a protective purpose, and the action was described as having the desired effect.'
    watch_for:
    - id: watch1
      what: Whether the contemplated action remains limited to protecting American citizens and dispersing the Villistas rather
        than becoming an invasion.
      favors:
      - O2
      why: A departure from the commander's stated limit would undermine the basis for the bounded crossing.
  lesson: When responding to cross-border harm, ground action in the authority actually granted and the protective purpose
    that justifies it. State and preserve limits on the action; authority for a bounded response is not authority for an invasion.
  limits: This reasoning is specific to the commander's stated authority, the reported wounds, and the stated dispersal purpose.
    The excerpt does not establish a general legal rule for cross-border force or address situations with different authority,
    threats, or limits.
