case:
  id: DR-CORPUS-NX-b4c2554a-E2@v1
  title: Continuation or Legality Review
  status: draft
  setting: The Director's consultations with the Attorney General and Postmaster General, June 1–3, 1971.
  decider: The Director
  agent: The Director
  agent_role: decide
  situation: 'The Director had met with the Attorney General and the Postmaster General about the mail project. The Attorney
    General was reported to have concurred in the project''s value and expressed no concerns, while the Postmaster General
    was briefed with selected project-derived items and an explanation of a subject''s situation. The Postmaster General was
    reported to view the project and its continuation positively. A legality review was considered, with concern that it would
    widen the circle of people informed. What the officials were told is uncertain: the Postmaster General later could not
    recall the discussion''s specifics, and the Attorney General believed the discussion had concerned only mail covers.'
  question: What should the Director do about continuing the mail project, including whether to seek a legality review?
  options:
    O1:
      do: The Director discontinues the project and requests a legality review.
      move: act
      irreversible: false
    O2:
      do: The Director continues the project without requesting a legality review.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Director met with the Attorney General on June 1, 1971, and with the Postmaster General on June 2, 1971, to
      discuss the mail project.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Director reported that the Attorney General concurred in the operation's value and had no concerns about it.
  - id: F3
    kind: situation
    status: assessed
    fact: The Director reported showing the Postmaster General selected items derived from the project and explaining a subject's
      situation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Director reported that the Postmaster General viewed the operation and its continuation positively.
  - id: F5
    kind: situation
    status: assessed
    fact: The Postmaster General reportedly considered a legality review but rejected it out of concern that it would widen
      the circle of informed people.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Postmaster General later could not recall the specifics of the discussion, while the Attorney General recalled
      a conversation but believed it concerned only mail covers.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The Director reported that the Attorney General agreed the operation had value and raised no concerns, supporting
      continuation in the Director's account, though this was not a legality determination.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The Director reported briefing the Postmaster General, who viewed the operation and its continuation positively.
  - id: C3
    facts:
    - F5
    equity: source_protection
    favors:
    - O2
    weight: strong
    why: The Postmaster General reportedly rejected a legality review because it would widen the circle of informed people;
      this was the stated reason not to seek review.
  - id: C4
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The officials' later recollections leave uncertainty about what was discussed, limiting how confidently their reported
      views can support continuation.
  reasoning:
    read: The Director proceeded on reported favorable views from the Attorney General and Postmaster General, while a legality
      review was set aside to avoid widening the informed circle. The trap is treating reported support for the operation's
      value or continuation as confirmation that its legality was reviewed, especially when the officials' later recollections
      differ from the Director's account.
    weighing: The reported endorsements and the concern about widening the circle favored continuing without a review in the
      Director's account. The later uncertainty about what was communicated qualifies the strength of those endorsements but
      does not record an opposing legal conclusion. The balance therefore supports {O2} as the reported choice, without establishing
      that the project had received a legal determination.
    tradecraft: Keep the decision record clear about which views were reported and what remains uncertain; do not characterize
      favorable views as a legality review. The Director's stated instruction was to stop the project if there were even a
      suspicion of a leak and investigate afterward.
    uncertainty: The Postmaster General could not recall the discussion's specifics, and the Attorney General recalled a discussion
      but believed it concerned only mail covers. The Director's account of what each official was told is therefore not independently
      confirmed.
    handoff: The Director made the continuation decision after consulting the Attorney General and Postmaster General. The
      reported choice was not to widen the circle by seeking a legality review.
    tempting_wrong:
      option: O1
      pull: Seeking a legality review could appear to resolve uncertainty about whether continuation was legally supported.
      why_wrong: The reported reason for rejecting review was that it would widen the circle of informed people, and the Director
        continued the project rather than discontinuing it; the record does not state that a review found the project unlawful.
    rejected:
      O1: The Director did not discontinue the project or request a legality review, with the reported concern that review
        would widen the circle of informed people.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A legality review or other reliable determination established that the project lacked legal authority.
      then: O1
      why: A confirmed lack of legal authority would outweigh the reported favorable views and support discontinuing the project
        while seeking review.
    would_not_change:
    - id: noflip1
      if: The officials' limited or differing recollections remained the only new information.
      why: That would preserve the uncertainty already noted, but would not itself establish that the project was unlawful
        or that the reported views were adverse.
    watch_for:
    - id: watch1
      what: Any suspicion of a leak.
      favors:
      - O1
      why: The Director's stated instruction was to stop the project if there were even a suspicion of a leak and investigate
        afterward; O1 is the available option that discontinues it.
  lesson: Reported support for an operation's value is not the same as a legal determination. When a decision rests on second-hand
    accounts of what officials were told, preserve that qualification and treat any stated stop condition as operative.
  limits: This reasoning reflects the Director's reported choice and the stated concern about widening the informed circle;
    it is not a legal finding that the operation was lawful. It does not resolve what the officials actually discussed or
    supply an independent standard for evaluating the project's legality.
