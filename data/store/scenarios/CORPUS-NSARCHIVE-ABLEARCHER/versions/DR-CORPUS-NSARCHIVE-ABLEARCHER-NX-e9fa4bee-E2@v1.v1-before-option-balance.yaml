case:
  id: DR-CORPUS-NSARCHIVE-ABLEARCHER-NX-e9fa4bee-E2@v1
  title: Seeking Political Authorization for Nuclear Use
  status: draft
  setting: ACE, morning of 8 November 1983, during a NATO exercise.
  decider: SACEUR
  agent: SACEUR
  agent_role: decide
  situation: Orange opened hostilities across ACE before the exercise began, and Blue declared a general alert. Orange began
    using chemical weapons on 6 November and had used them throughout ACE by the end of that day. Three days of fighting had
    occurred before the exercise, with the situation deteriorating. SACEUR had sought political guidance on nuclear use early
    on 7 November. By that evening, Blue forces were in a worse position, especially in the northern region, and increased
    Orange use of chemical weapons had been reported. On the morning of 8 November, SACEUR faced the question of whether to
    seek political authorization for initial nuclear use.
  question: What should SACEUR do about seeking political authorization for initial nuclear use?
  options:
    O1:
      do: SACEUR withholds a request for initial nuclear-use authorization.
      move: act
      irreversible: false
    O2:
      do: SACEUR requests political consultation before seeking nuclear-use authorization.
      move: ask
      irreversible: false
      to: political leadership
    O3:
      do: SACEUR seeks political authorization for initial nuclear use.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Orange opened hostilities in all regions of ACE on 4 November, and Blue declared a general alert.
  - id: F2
    kind: situation
    status: confirmed
    fact: Orange initiated chemical-weapons use on 6 November and had used such weapons throughout ACE by the end of that
      day.
  - id: F3
    kind: situation
    status: confirmed
    fact: Three days of fighting and a deteriorating situation preceded the start of the exercise.
  - id: F4
    kind: situation
    status: confirmed
    fact: The exercise was intended to test procedures for transitioning from conventional to nuclear operations.
  - id: F5
    kind: situation
    status: confirmed
    fact: SACEUR requested political guidance on nuclear use early on 7 November.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Orange advances, persistent chemical-weapons use, and apparent intentions to commit second-echelon forces rapidly
      contributed to SACEUR's earlier request for political guidance.
  - id: F7
    kind: situation
    status: confirmed
    fact: By the evening of 7 November, Blue forces were in a worse position, particularly in the northern region.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: Increased Orange use of chemical weapons had been reported by the evening of 7 November.
  considerations:
  - id: C1
    facts:
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Blue's position had deteriorated further, particularly in the northern region; this worsening situation was part
      of the immediate context for seeking authorization.
  - id: C2
    facts:
    - F2
    - F8
    equity: escalation_control
    favors:
    - O3
    weight: strong
    why: Orange had used chemical weapons throughout ACE, and increased use was reported by the evening of 7 November, adding
      to the deteriorating situation.
  - id: C3
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: SACEUR had already sought political guidance based on Orange's advances, persistent chemical-weapons use, and assessed
      intention to commit second-echelon forces rapidly; the 8 November request continued that path toward political authorization.
  reasoning:
    read: This is a worsening conflict in which Blue's position, especially in the north, had declined and increased Orange
      chemical-weapons use had been reported. The exercise was designed to test transition procedures, but that purpose is
      not itself a reason to seek nuclear authorization; the decision-relevant circumstances are the developments in the scenario.
    weighing: The reported deterioration and increased chemical-weapons use favor seeking authorization now rather than withholding
      the request. SACEUR's earlier request, prompted by Orange's advances, persistent chemical-weapons use, and assessed
      intentions, provides context for the renewed request. The balance depends on the continued deterioration and increased
      use reported by 7 November; the source gives no separate legal test or assessment of civilian consequences.
    tradecraft: 'Keep the decision at the authorization level: distinguish seeking political authorization from deciding to
      employ nuclear weapons. Record the circumstances supporting the request and the political response, without treating
      authorization as an operational decision.'
    uncertainty: The source does not give a detailed comparison of alternatives, an applicable legal standard, or an assessment
      of likely harms. It identifies the deteriorating military situation and increased chemical-weapons use, but does not
      specify how much each factor independently affected the decision.
    handoff: SACEUR should seek political authorization from political leadership rather than treat this as a decision to
      act unilaterally; the source records that the request was later agreed.
    tempting_wrong:
      option: O1
      pull: Withholding the request avoids moving toward nuclear use.
      why_wrong: 'It does not respond to the source''s stated immediate circumstances: Blue''s worsening position and the
        reported increase in Orange''s chemical-weapons use.'
    rejected:
      O1: Withholding the request was not the course taken amid the further deterioration and increased chemical-weapons use.
      O2: A separate consultation-before-request step was not the recorded course; SACEUR sought political authorization.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The situation had not further deteriorated and there had been no report of increased Orange chemical-weapons use.
      then: O2
      why: Without the stated developments supporting the renewed request, pausing for political consultation before seeking
        authorization would be a plausible alternative.
    would_not_change:
    - id: noflip1
      if: The exercise still had the stated purpose of testing transition procedures, but the operational situation did not
        itself worsen.
      why: The exercise purpose explains the scenario design; it does not alone establish a reason to seek nuclear authorization.
    watch_for:
    - id: watch1
      what: Further changes in Blue's position and reports about Orange's chemical-weapons use.
      favors:
      - O3
      - O2
      why: Blue's worsening position and increased Orange chemical-weapons use are relevant developments; changes in their
        direction could affect whether to proceed with a request or pause for consultation.
  lesson: When circumstances worsen and reports indicate increased hostile use of chemical weapons, weigh those developments
    against the consequences of seeking political authorization. Keep the request for authorization distinct from a decision
    to employ the capability.
  limits: This reasoning is limited to the circumstances stated here and does not establish a general rule for nuclear authorization.
    The source does not supply a legal standard, an assessment of civilian effects, or a detailed rationale beyond the worsening
    situation and increased chemical-weapons use.
