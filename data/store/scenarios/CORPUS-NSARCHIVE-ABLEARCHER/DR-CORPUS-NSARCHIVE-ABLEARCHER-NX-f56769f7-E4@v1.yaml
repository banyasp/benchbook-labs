case:
  id: DR-CORPUS-NSARCHIVE-ABLEARCHER-NX-f56769f7-E4@v1
  title: Choosing the Computer-Security Organization
  status: draft
  setting: Late 1970s, National Security Agency, federal computer-security policy
  decider: The senior NSA official
  agent: The senior NSA official
  agent_role: decide
  situation: The National Security Agency had a developing role in computer security, but the effort had made little progress
    through the end of the decade. An earlier request for additional billets was denied, with the controversy over NSA’s role
    cited as one reason. An OSD staffer brought the federal computer-security issue to a senior NSA official. OSD favored
    expanding NSA’s effort and making it the federal government’s lead office for computer security. The staffer opposed locating
    that function within COMSEC.
  question: What should the senior NSA official do about the organizational home for NSA’s proposed federal computer-security
    role?
  options:
    O1:
      do: The senior NSA official establishes a federal computer-security center as a separate organization.
      move: act
      irreversible: false
    O2:
      do: The senior NSA official places the federal computer-security function within COMSEC.
      move: act
      irreversible: false
    O3:
      do: The senior NSA official asks OSD to clarify the federal lead role.
      move: ask
      irreversible: false
      to: OSD
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: NSA’s role in computer security expanded in 1973.
  - id: F2
    kind: authority
    status: confirmed
    fact: The assistant director for COMSEC was named responsible official for computer-security research and established
      a small technical-information center to support federal agencies.
  - id: F3
    kind: situation
    status: confirmed
    fact: Little happened on NSA’s computer-security effort through the end of the decade.
  - id: F4
    kind: situation
    status: confirmed
    fact: A request for 67 billets for fiscal year 1975 was denied, in part because NSA’s role in computer security remained
      controversial.
  - id: F5
    kind: situation
    status: confirmed
    fact: An OSD staffer and former NSA employee approached a senior NSA official about the federal computer-security issue.
  - id: F6
    kind: situation
    status: assessed
    fact: There was a strong view in OSD that NSA should expand its effort and become the federal government’s office of primary
      responsibility for computer security.
  - id: F7
    kind: situation
    status: assessed
    fact: The OSD staffer personally opposed placing the computer-security organization within COMSEC.
  considerations:
  - id: C1
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: OSD strongly favored expanding NSA's effort and making it the federal government's lead office for computer security;
      a separate center was the organizational course the senior official pursued.
  - id: C2
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The OSD staffer opposed placing the function within COMSEC, and the senior official agreed. The stated account gives
      no more specific rationale for that organizational concern.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The existing effort had made little progress, and a request for more staff was denied partly because NSA's role remained
      controversial. This context is consistent with establishing a separate center, though it is not expressly identified
      as the senior official's reason.
  reasoning:
    read: 'The decision is not simply whether NSA should take on a federal computer-security role: OSD favored that role,
      while the organizational question was whether to house it in COMSEC. The trap is to treat COMSEC''s prior responsibility
      for the work as settling where the proposed broader function belonged.'
    weighing: The stated impetus was OSD's strong view that NSA should expand its effort and become the federal lead office
      {C1}. The staffer opposed locating the organization in COMSEC, and the senior official agreed {C2}; the history of limited
      progress and controversy supplies context, but is not expressly given as his rationale {C3}. The balance therefore favors
      creating a separate center, while depending on the continued objective of expanding NSA's federal role and the judgment
      that COMSEC was not the right home.
    tradecraft: 'Make the organizational decision explicit: establish the separate center, identify its federal computer-security
      remit and reporting line, and record the rationale for not placing it in COMSEC.'
    uncertainty: The account identifies the OSD staffer's position and the senior official's agreement, but does not explain
      in detail why either considered COMSEC an inappropriate home or specify how the center's responsibilities would be bounded.
    handoff: The senior official made the organizational choice, agreed with the OSD staffer, and asked the assistant director
      for telecommunications to take on the task. The center was then established separately.
    tempting_wrong:
      option: O2
      pull: COMSEC already had responsibility for computer-security research and had established a small technical-information
        center.
      why_wrong: That earlier arrangement did not resolve the concern about making COMSEC the home for the proposed expanded
        federal function; the senior official agreed with the staffer's opposition and proceeded separately.
    rejected:
      O2: The senior official agreed with the objection to locating the proposed organization within COMSEC and instead assigned
        the task of setting up a separate center.
      O3: The senior official proceeded with the organizational task rather than referring the federal lead-role question
        back to OSD for clarification.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: OSD no longer favored NSA taking on the federal lead role and the organizational objective were consequently unsettled.
      then: O3
      why: Without the stated impetus for expansion, clarifying the federal role before choosing an organizational home could
        become preferable.
    - id: flip2
      if: The senior official concluded that COMSEC was an appropriate home and the staffer's objection no longer carried
        weight.
      then: O2
      why: That would remove the stated reason for choosing a separate organization and make integration a plausible course.
    would_not_change:
    - id: noflip1
      if: The earlier staffing request remained denied.
      why: That fact alone would not negate OSD's stated preference for expanding NSA's role or the senior official's agreement
        that COMSEC was not the right home.
    watch_for:
    - id: watch1
      what: A later leadership judgment that computer security should be part of the COMSEC organization.
      favors:
      - O2
      why: A later organizational decision placed the center within the organization responsible for both COMSEC and COMPUSEC,
        illustrating that the organizational choice could shift.
  lesson: 'A federal lead role and its organizational home are distinct decisions: support for expanding the mission does
    not itself require placing it in an existing office. When the proposed home is specifically opposed and the senior official
    agrees, make the organizational choice explicit rather than assuming prior responsibility settles it.'
  limits: The account gives only a brief explanation of the senior official's reasoning and does not establish a general rule
    that computer security should be separate from COMSEC. This conclusion applies to the stated late-1970s choice and should
    not be treated as a judgment on the later organizational arrangements.
