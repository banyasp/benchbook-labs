case:
  id: DR-CORPUS-NSARCHIVE-ABLEARCHER-NX-f56769f7-E9@v1
  title: A Policy for Relocatable Soviet Missiles
  status: draft
  setting: United States, July 1985, the intelligence community and Department of Defense.
  decider: The issuing authority for NSDD-178
  agent: The NSDD-178 issuing authority
  agent_role: decide
  situation: By July 1985, Soviet mobile missiles had made relocatable targets a significant strategic concern. The SS-20
    was the first relocatable strategic missile and was considered a threat to NATO forces. The SS-25 had become a high-priority
    intelligence concern, with its first units operational in 1985. Garrisoned units were not fully operational and had to
    go to the field to achieve that status. The intelligence community's effort on the relocatable-target problem had remained
    a research effort. The policy choice was whether to direct the Department of Defense to develop a capability against these
    targets, with an “at risk” threshold defined as the ability to destroy at least 50–75 percent of the force.
  question: What should the NSDD-178 issuing authority do in July 1985 about directing the Department of Defense to develop
    a strategic-force capability against Soviet relocatable targets?
  options:
    O1:
      do: The NSDD-178 issuing authority authorizes the Department of Defense to develop a strategic-force capability against
        Soviet relocatable targets.
      move: act
      irreversible: false
    O2:
      do: The NSDD-178 issuing authority prohibits the Department of Defense from developing a strategic-force capability
        against Soviet relocatable targets.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Soviets introduced the SS-20 in 1977.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The SS-20's mobility made it the first relocatable strategic missile, and it was a threat to NATO forces.
  - id: F3
    kind: situation
    status: confirmed
    fact: By the mid-1980s, the Soviet Strategic Rocket Forces had ten SS-20 divisions composed of 48 regiments.
  - id: F4
    kind: capability
    status: confirmed
    fact: SS-20 units in garrison were not fully operational; a unit had to go to the field to achieve full operational status.
  - id: F5
    kind: situation
    status: confirmed
    fact: The SS-25 followed the SS-20, had a range of 10,500 kilometers, and had a similar deployment mode.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The SS-25's first units became operational in 1985, and it became the intelligence community's highest priority.
  - id: F7
    kind: situation
    status: confirmed
    fact: The relocatable-target problem remained a research effort until 1985.
  - id: F8
    kind: authority
    status: confirmed
    fact: The policy directive defined “at risk” as having the ability to destroy at least 50–75 percent of the force.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The SS-20's mobility made it a new kind of relocatable strategic missile, assessed as a threat to NATO forces, and
      the Soviet force had grown to ten divisions and 48 regiments.
  - id: C2
    facts:
    - F5
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The SS-25 brought another mobile missile with a 10,500-kilometer range; its first units became operational in 1985
      and it became the intelligence community's highest priority.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The relocatable-target problem had remained a research effort until 1985, while NSDD-178 directed DoD to develop
      a capability against it.
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The directive supplied a defined policy objective for placing the force at risk: the ability to destroy at least
      50–75 percent of it.'
  reasoning:
    read: 'The decision concerned a growing strategic problem: mobile Soviet missiles were a threat, and the SS-25 had become
      a high-priority concern. Garrisoned units were not fully operational until they went to the field, but that qualification
      does not erase the significance of the relocatable-target problem. The trap is treating a problem that had remained
      research as a reason not to establish a directed capability.'
    weighing: 'The source''s stated reasons favor O1: the SS-20 was a threat to NATO forces, the SS-25 was a new high-priority
      concern, and the problem had remained a research effort until 1985. NSDD-178 converted that concern into a DoD development
      directive and defined what ''at risk'' meant. The balance depends on those threat and priority assessments and on the
      directive''s stated threshold; the source records no competing case for prohibiting development.'
    tradecraft: Keep the decision record tied to the issuing authority, the strategic purpose, and the directive's 50–75 percent
      threshold. Assess progress against that policy objective without expanding this decision into operational methods.
    uncertainty: The passage gives the threat assessments and policy objective, but does not describe disagreement, the feasibility
      or cost of achieving the threshold, or the consequences of the alternatives.
    handoff: The issuing authority makes the policy decision and directs DoD. The source assigns direction of the effort to
      a multi-agency committee within DoD, which is the appropriate organizational handoff for carrying out that direction.
    tempting_wrong:
      option: O2
      pull: The relocatable-target problem had remained a research effort, and the passage does not establish that a capability
        was already available.
      why_wrong: The issuing authority did not treat the research status as a reason to prohibit development; it directed
        DoD to develop a program in response to the assessed threat and intelligence priority.
    rejected:
      O2: The issuing authority chose to direct DoD to develop the capability, rather than prohibit development, in response
        to the stated threat and priority.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence established that Soviet relocatable missiles no longer posed a strategic concern and no longer
        merited high intelligence priority.
      then: O2
      why: The source's case for development rests on the assessed threat and the SS-25's high priority; removing those grounds
        could reverse the policy balance.
    would_not_change:
    - id: noflip1
      if: The SS-25 were absent from the situation, but the SS-20 remained a threat to NATO forces at the scale described.
      why: The SS-20's assessed threat and substantial force structure independently support addressing the relocatable-target
        problem.
    watch_for:
    - id: watch1
      what: Whether the capability-development effort can meet the directive's defined at-risk threshold and sustain that
        condition beyond the year 2000.
      favors:
      - O1
      why: The policy directive defined the threshold as the ability to destroy at least 50–75 percent of the force and set
        the objective of keeping Soviet relocatable targets at risk beyond 2000.
  lesson: When a new strategic capability makes a target class materially more significant, a decision-maker can move from
    research to directed development while stating the policy objective clearly. Keep the decision anchored to the assessed
    threat and the threshold the authority has set.
  limits: This scenario supports the policy decision to direct development; it does not establish whether the capability was
    feasible, how it should be developed or employed, or whether later evidence would justify continuing it. It does not assess
    the legality or consequences of any particular operation.
