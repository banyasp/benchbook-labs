case:
  id: DR-CORPUS-NX-aa07121f-E2@v1
  title: The Sharpsburg Battle Decision
  status: draft
  setting: Sharpsburg, during the Confederate invasion of the North, Union Army
  decider: The Union commander
  agent: The Union commander
  agent_role: decide
  situation: At Sharpsburg, the Union commander faced the Confederate army during its invasion of the North. Intelligence
    available to the Union commander indicated that the Confederate force was divided. The intelligence picture was incomplete
    and included some information that was no longer current, while additional information improved the commander's understanding
    of the situation. The Confederate army was substantially smaller than the Union force. In the absence of this intelligence,
    the Union commander probably would have focused on protecting Washington and Baltimore or otherwise avoiding battle. The
    question at hand was whether to engage the Confederate army.
  question: What should the Union commander do about whether to fight the Confederate army at Sharpsburg?
  options:
    O1:
      do: The Union commander accepts battle at Sharpsburg.
      move: act
      irreversible: true
    O2:
      do: The Union commander declines battle at Sharpsburg.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Intelligence available to the Union commander indicated that the Confederate army was divided.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The intelligence picture was incomplete and included information that was no longer current.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Additional information improved the Union commander's understanding of the Confederate situation.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Confederate army was substantially smaller than the Union force.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Without the intelligence, the Union commander probably would have protected Washington and Baltimore or otherwise
      sought to avoid battle.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The intelligence was a cause of the Union commander's decision to fight.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: An indication that the Confederate force was divided gave the Union commander a reason to believe that engaging it
      could achieve a significant military result.
  - id: C2
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The picture was incomplete and partly out of date, but additional information improved the commander's understanding;
      its limitations did not erase the value of the combined intelligence.
  - id: C3
    facts:
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Confederate force was substantially smaller than the Union force, supporting the prospect that battle could produce
      a consequential result.
  - id: C4
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The intelligence was a cause of the decision to fight; without it, the commander probably would have protected key
      cities or otherwise avoided battle.
  - id: C5
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Because part of the intelligence was no longer current and the picture was incomplete, the commander had reason to
      be cautious about treating it as a fully reliable account of the situation.
  reasoning:
    read: The decision was whether to engage an army whose position appeared divided, on the basis of intelligence that was
      valuable but imperfect. The trap is treating either imperfection as a reason to disregard the intelligence altogether,
      or its usefulness as certainty that battle would destroy the opposing army.
    weighing: The divided-force assessment and the improved understanding favored accepting battle, while stale and incomplete
      information counseled caution. The account calls the intelligence exceptionally valuable and says it was enough to make
      a near-destruction of Lee's army possible, while also noting that the battle yielded only a technical victory. On balance,
      the intelligence supported fighting; that judgment depends on giving weight to the improved picture without mistaking
      it for certainty.
    tradecraft: Separate what the intelligence indicates from what remains uncertain, record why the information is sufficient
      to decide, and revisit the decision if its reliability or relevance changes.
    uncertainty: The account makes clear that some information was no longer current and that the picture was incomplete.
      Intelligence made the battle possible but did not guarantee a decisive result.
    handoff: The decision rests with the Union commander. No separate approval authority or required consultation is identified,
      so this analysis does not assign one.
    tempting_wrong:
      option: O2
      pull: Declining battle could seem prudent because the intelligence was incomplete and included information that was
        no longer current.
      why_wrong: 'That response gives the limitations too much weight: additional information improved the picture, and the
        account presents the intelligence as a substantial basis for engaging rather than avoiding battle.'
    rejected:
      O2: The commander did not decline battle because the improved intelligence about the divided force made engagement a
        consequential opportunity.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The intelligence were absent.
      then: O2
      why: Without the intelligence, the commander probably would have protected Washington and Baltimore or otherwise avoided
        battle.
    would_not_change:
    - id: noflip1
      if: The intelligence remained incomplete but additional information still improved the commander's understanding.
      why: Imperfection alone would not reverse the balance, because the account treats the improved intelligence as valuable
        enough to support fighting despite its limits.
    watch_for:
    - id: watch1
      what: Whether key intelligence remains current and reliable.
      favors:
      - O2
      why: If the information on which the divided-force assessment rests is no longer current, the basis for accepting battle
        weakens.
  lesson: Imperfect intelligence can still support a consequential decision when additional information improves the overall
    picture. Weigh its limits against what it reveals, and do not confuse a sound basis for acting with certainty about the
    outcome.
  limits: This reasoning concerns a historical decision to engage an opposing army, not a legal rule requiring battle or a
    general claim that intelligence alone justifies force. The account does not assess civilian harm, the costs to Union personnel,
    or the legal authority governing the decision.
