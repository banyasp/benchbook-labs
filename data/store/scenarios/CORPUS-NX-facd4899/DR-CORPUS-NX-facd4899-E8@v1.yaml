case:
  id: DR-CORPUS-NX-facd4899-E8@v1
  title: Summary Justice Policy Decision
  status: draft
  setting: Indonesia, early 1947, Dutch Army Headquarters
  decider: The Dutch Army Headquarters
  agent: The Dutch Army Headquarters
  agent_role: decide
  situation: Conventional force commanders could no longer control their areas, while the deputy JTF commander directed Special
    Forces and gave their commanders almost carte blanche, especially early in the conflict. Special Forces missions were
    intended to restore stability and security as soon as possible. Civilians had been killed in operations, and distinguishing
    civilians from combatants was difficult because guerrilla fighters were often not uniformed. The killing of inhabitants
    suspected of extremism had become known as summary justice. A surge of negative publicity had followed in early 1947,
    and the policy issue was whether to permit or formally forbid summary justice.
  question: What should the Dutch Army Headquarters do about summary justice amid civilian killings and negative publicity?
  options:
    O1:
      do: The Dutch Army Headquarters formally prohibits summary justice.
      move: act
      irreversible: false
    O2:
      do: The Dutch Army Headquarters formally permits summary justice.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Conventional force commanders were no longer able to control their areas of responsibility.
  - id: F2
    kind: authority
    status: confirmed
    fact: The deputy JTF commander was the tasking authority for Special Forces and gave Special Forces commanders almost
      carte blanche, especially early in the conflict.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Special Forces' mission was to restore stability and security in the area as soon as possible.
  - id: F4
    kind: situation
    status: confirmed
    fact: Operations resulted in the deaths of TNI troops and civilians.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Distinguishing civilians from combatants was difficult because guerrilla fighters were often not uniformed.
  - id: F6
    kind: situation
    status: confirmed
    fact: Anyone with a weapon was considered an enemy and killed or captured.
  - id: F7
    kind: situation
    status: confirmed
    fact: The killing of inhabitants suspected of extremism became known as summary justice.
  - id: F8
    kind: situation
    status: confirmed
    fact: A surge of negative publicity occurred in early 1947.
  considerations:
  - id: C1
    facts:
    - F4
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Civilians had been killed, and summary justice involved killing inhabitants suspected of extremism; prohibiting that
      practice addresses a direct risk to civilian life.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The difficulty of distinguishing combatants from civilians, alongside treating anyone with a weapon as an enemy,
      made suspicion an especially unreliable basis for killing an individual.
  - id: C3
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: A surge of negative publicity preceded Headquarters' formal prohibition, making the public response part of the context
      for the decision.
  reasoning:
    read: The decision arose amid weakened conventional control and broad discretion for Special Forces, but the issue was
      whether to permit killings of inhabitants suspected of extremism. The trap is to treat urgency or difficulty distinguishing
      combatants as sufficient grounds for summary killing; civilian deaths and uncertainty about who was a combatant were
      present when Headquarters formally prohibited the practice.
    weighing: Civilian deaths and the risk of mistaking civilians for combatants weigh strongly against permitting summary
      justice {C1} {C2}. The surge of negative publicity preceded the prohibition and supplies an additional, though weaker,
      institutional consideration {C3}. The mission was to restore stability and security as soon as possible, but that pressure
      does not outweigh the stated concerns about civilian deaths and uncertainty over combatant status.
    tradecraft: Issue the prohibition formally and preserve a clear record of the decision and its stated context. Any implementation
      details beyond the formal prohibition are unspecified.
    uncertainty: The prohibition's text, legal analysis, and detailed Headquarters deliberations are unspecified. Civilian
      deaths, difficulty distinguishing civilians from combatants, and the sequence of negative publicity followed by the
      prohibition are established, but the weight Headquarters assigned to each consideration is not.
    handoff: The Dutch Army Headquarters was the decision-maker. Communicating the formal decision through the command authority
      responsible for tasking Special Forces would be a practical handoff, given the deputy JTF commander's role and the broad
      discretion described.
    tempting_wrong:
      option: O2
      pull: The mission sought to restore stability and security as soon as possible, while conventional commanders could
        no longer control their areas.
      why_wrong: Those pressures do not resolve the risk that inhabitants could be killed on suspicion when distinguishing
        civilians from combatants was difficult.
    rejected:
      O2: Headquarters did not permit summary justice; it formally prohibited the practice after the surge of negative publicity.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The decision concerned a practice shown to involve reliable individual determinations and lawful procedures rather
        than killings based on suspicion.
      then: O2
      why: That would remove the central concern that inhabitants were being killed despite uncertainty about whether they
        were combatants; it would describe a materially different practice.
    would_not_change:
    - id: noflip1
      if: The mission remained urgent and conventional commanders still lacked control of their areas.
      why: Those circumstances do not remove the civilian-harm and identification concerns that weigh against summary justice.
    watch_for:
    - id: watch1
      what: Further evidence of inhabitants being killed on suspicion, especially where civilian and combatant status is uncertain.
      favors:
      - O1
      why: It would reinforce the concerns about civilian deaths and the difficulty of distinguishing combatants.
  lesson: Urgency and uncertainty about combatant status do not, by themselves, justify summary killing. When suspicion-based
    decisions risk civilian lives, a formal prohibition is preferable to leaving the practice permitted.
  limits: The prohibition's text and the applicable legal standard are unspecified, so this scenario does not establish a
    complete rule for other uses of force. Its reasoning applies to the described practice of killing inhabitants suspected
    of extremism amid uncertainty about who was a combatant.
