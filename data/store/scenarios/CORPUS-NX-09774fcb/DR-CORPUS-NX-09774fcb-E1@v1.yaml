case:
  id: DR-CORPUS-NX-09774fcb-E1@v1
  title: Priorities in the Hotel Response
  status: draft
  setting: The hotel, early morning of November 27; police, Marine Commandos, and Army response.
  decider: The Marine Commandos
  agent: The Marine Commandos
  agent_role: decide
  situation: During the early-morning response at the hotel, the Deputy Commissioner of Police requested reinforcements and
    updated headquarters on the attackers’ movements. He reported that lives were being lost and hostages were being tied
    and moved between rooms. Eighteen Marine Commandos arrived around 2:30 a.m. and linked up with police, and an Army contingent
    arrived about thirty minutes later. Around 3:30 a.m., Marine Commandos engaged the attackers and two Commandos were wounded.
    Trapped guests remained in the hotel, and fires broke out on the upper levels between 3:00 and 3:45 a.m.
  question: What should the Marine Commandos do about the competing priorities of reducing further casualties and eliminating
    the attackers during the early-morning response at the hotel?
  options:
    O1:
      do: The Marine Commandos balance efforts to reduce further casualties among responders and civilians with efforts to
        eliminate the attackers.
      move: partial
      irreversible: false
    O2:
      do: The Marine Commandos prioritize eliminating the attackers and deprioritize reducing further casualties among responders
        and civilians.
      move: act
      irreversible: false
    O3:
      do: The Marine Commandos prioritize reducing further casualties among responders and civilians and deprioritize eliminating
        the attackers.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The response was underway at the hotel during the early morning of November 27.
  - id: F2
    kind: situation
    status: confirmed
    fact: At 12:46 a.m., the Deputy Commissioner of Police made repeated radio calls requesting reinforcements and updating
      headquarters on the attackers’ movements.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Deputy Commissioner of Police reported that lives were being lost and hostages were being tied and moved between
      rooms.
  - id: F4
    kind: situation
    status: confirmed
    fact: Around 2:30 a.m., eighteen Marine Commandos arrived at the hotel and linked up with police.
  - id: F5
    kind: situation
    status: confirmed
    fact: About thirty minutes after the Marine Commandos arrived, an Army contingent reached the area and reinforced the
      cordon around the hotel.
  - id: F6
    kind: situation
    status: confirmed
    fact: At approximately 3:30 a.m., Marine Commandos engaged the attackers and two Commandos were wounded.
  - id: F7
    kind: situation
    status: confirmed
    fact: Guests were trapped in the hotel.
  - id: F8
    kind: situation
    status: confirmed
    fact: Multiple fires broke out between 3:00 and 3:45 a.m., engulfing the upper levels and the dome of the Heritage Wing.
  considerations:
  - id: C1
    facts:
    - F6
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: Two Commandos were wounded during the engagement; the stated reason for prioritizing civilian separation and escort
      was to avoid sustaining additional casualties.
  - id: C2
    facts:
    - F3
    - F7
    equity: civilian_life
    favors:
    - O3
    weight: strong
    why: Guests remained trapped, and the Deputy Commissioner reported lives being lost and hostages being tied and moved;
      the Commandos prioritized getting trapped guests away from hostile areas over eliminating the attackers.
  - id: C3
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The reported loss of life and movement of hostages underscored the continuing danger from the attackers and the importance
      of ending that threat, although the Commandos chose to give immediate priority to reducing casualties.
  reasoning:
    read: 'This was an active hostage and civilian-protection emergency, not simply a choice between engagement and inaction:
      the attackers remained dangerous, while trapped guests and wounded responders faced immediate risks. The trap is to
      treat eliminating the attackers as the only way to protect people, despite the stated judgment that continued efforts
      to eliminate them could cause additional casualties.'
    weighing: The Commandos' stated reason was to avoid further casualties, and they therefore prioritized separating trapped
      guests from hostile areas and escorting civilians out over eliminating the threat {C1} {C2}. The reported killings and
      movement of hostages made the attackers' threat urgent {C3}, but the source's stated balance favors casualty reduction.
      That balance depends on the immediate risks to trapped civilians and responders, not on treating elimination of the
      attackers as the overriding priority.
    tradecraft: Make the priority explicit to the coordinating command, keep the civilian and responder risks under review,
      and record the reasons for any change in priority. These are decision-practice recommendations, not additional actions
      attributed to the Commandos.
    uncertainty: The account gives the Commandos' stated casualty-avoidance rationale but does not specify the full information
      available to them, the expected risks of each course, or a legal or operational rule governing the choice.
    handoff: Coordinate the priority decision with the police command already linked to the Commandos, so civilian-protection
      priorities and the ongoing response are not managed in isolation.
    tempting_wrong:
      option: O2
      pull: The attackers were reported to be causing deaths and moving hostages, creating pressure to make eliminating them
        the overriding priority.
      why_wrong: 'That urgency does not displace the Commandos'' stated reason for choosing immediate casualty reduction:
        they had already suffered wounded personnel and trapped guests remained at risk.'
    rejected:
      O1: The Commandos did not describe a balance between the two priorities; they expressly placed separating and escorting
        civilians ahead of eliminating the threat.
      O2: They did not make eliminating the attackers the priority, because they chose to avoid additional casualties by prioritizing
        trapped guests' safety.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: There were no trapped civilians at risk and the remaining evidence showed an immediate threat that could not be
        addressed without prioritizing the attackers.
      then: O2
      why: With the stated civilian-protection reason absent, the continuing threat to life could carry greater weight in
        setting the priority.
    would_not_change:
    - id: noflip1
      if: The Army contingent's arrival were considered on its own, without a material change in risks to civilians or responders.
      why: The Army had already arrived before the Commandos' engagement, yet the stated priority remained reducing casualties
        and protecting trapped guests.
    watch_for:
    - id: watch1
      what: Updated information about lives being lost or hostages being moved between rooms.
      favors:
      - O2
      why: Such information signals an acute continuing threat and may change how the competing priorities should be weighed.
  lesson: When an active threat and civilian danger coincide, do not assume that eliminating the threat must always take priority.
    Give weight to the immediate risks to trapped civilians and responders, and make the basis for the chosen priority clear.
  limits: This reasoning applies to the stated early-morning circumstances and the Commandos' reported casualty-avoidance
    rationale. It does not establish a general legal rule or determine what priority would be justified under materially different
    risks or information.
