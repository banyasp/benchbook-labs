case:
  id: DR-CORPUS-INC-U-2-OVERFLIGHT-SUSPENSION-AND-THE-1960-S-NX-efe6c0dd-E1@v1
  title: Presidential Authorization Amid Competing Pressures
  status: draft
  setting: United States, during the missile gap controversy, the presidency
  decider: The President
  agent: The President
  agent_role: decide
  situation: At the height of the missile gap controversy, the President had halted the overflights for sixteen months. U.S.
    and Soviet foreign-policy initiatives created disincentives to risky intelligence efforts, while administration officials
    urged using the opportunity to pursue negotiated arms control. The Soviet Union was vigorously complaining about violations
    of its territory. At the same time, internal political pressure was growing to establish the actual state of the Soviet
    ICBM program. Earlier photography from the overflights had not answered the crucial question of how extensively the Soviets
    had deployed ICBMs.
  question: What should the President do about authorizing or declining to resume the overflights amid the competing diplomatic
    and intelligence-policy pressures?
  options:
    O1:
      do: The President defers authorization and maintains the suspension.
      move: hold
      irreversible: false
    O2:
      do: The President authorizes resumption of the overflights.
      move: act
      irreversible: false
    O3:
      do: The President declines to authorize resumption of the overflights.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: U.S. and Soviet foreign-policy initiatives created disincentives to undertake risky intelligence collection efforts.
  - id: F2
    kind: situation
    status: confirmed
    fact: Administration officials urged using the opportunity to pursue negotiated arms control.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Soviet Union was making vigorous complaints about violations of its territory.
  - id: F4
    kind: situation
    status: confirmed
    fact: The President had stopped the overflights for sixteen months during the missile gap controversy.
  - id: F5
    kind: situation
    status: confirmed
    fact: Internal political pressure was growing to establish the true state of the Soviet ICBM program.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Photography from the overflights had not answered the crucial question about the extent of Soviet ICBM deployment.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: escalation_control
    favors:
    - O1
    - O3
    weight: strong
    why: Foreign-policy initiatives, the arms-control opportunity, and vigorous Soviet complaints created real diplomatic
      disincentives to risky collection.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Growing internal political pressure to establish the actual Soviet ICBM program was the stated reason the President
      relented and reauthorized the overflights.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The crucial deployment question remained unanswered. That left an important intelligence-policy uncertainty, though
      the prior photography's failure did not establish that resuming overflights would resolve it.
  - id: C4
    facts:
    - F4
    equity: escalation_control
    favors:
    - O1
    - O3
    weight: weak
    why: The President had already maintained the suspension for sixteen months under the diplomatic pressures, showing that
      continued restraint was a genuine alternative.
  reasoning:
    read: 'The decision is a presidential balance between diplomatic costs and pressure to establish the Soviet ICBM situation.
      The trap is treating either the arms-control opportunity and Soviet complaints or the intelligence demand as automatically
      decisive: both influenced policy, and the earlier photography had not answered the key question.'
    weighing: C1 and C4 support continued restraint, but the President ultimately relented as internal pressure to establish
      the true state of the program grew (C2). The unresolved deployment question reinforces the significance of that pressure
      (C3), without proving that further overflights would answer it. On this account, that balance led to O2 despite the
      continuing diplomatic disincentives.
    tradecraft: At the authorization level, make the competing diplomatic and intelligence-policy considerations explicit,
      record the reason for the decision, and revisit the balance if those considerations materially change. This is decision
      practice, not a direction about how to conduct collection.
    uncertainty: The earlier photography had not answered the deployment question, and there is no assurance that resuming
      overflights would do so. The relative weight the President assigned to intelligence needs and diplomatic risks is not
      specified.
    handoff: The President is the decider. Seeking views from the officials pressing for arms control and those assessing
      the intelligence gap is a prudent synthesis, but no required referral or approval process is specified.
    tempting_wrong:
      option: O1
      pull: It preserves the suspension and avoids worsening diplomatic pressures while an arms-control opportunity is being
        pursued.
      why_wrong: It would leave the growing demand to establish the actual Soviet ICBM program unanswered; the President ultimately
        relented in response to that pressure.
    rejected:
      O1: The President did not maintain the suspension; as internal pressure grew, he relented and reauthorized the overflights.
      O3: The President did not definitively decline resumption; he reauthorized the overflights despite the diplomatic disincentives.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Diplomatic and arms-control pressures again outweighed the internal pressure to establish the Soviet ICBM program.
      then: O1
      why: External political pressures had previously influenced the President to halt the overflights, while growing internal
        pressure later led him to reauthorize them.
    would_not_change:
    - id: noflip1
      if: The fact that the President had already suspended the overflights for sixteen months were offered as the only reason
        to keep them suspended.
      why: The President later relented when internal pressure grew; the prior suspension alone did not settle the decision.
    watch_for:
    - id: watch1
      what: Whether diplomatic initiatives and complaints continue to weigh against risky collection, and whether pressure
        to establish the ICBM program grows.
      favors:
      - O1
      - O2
      why: These competing pressures shaped the President's halt and later reauthorization.
  lesson: When diplomatic opportunities and complaints weigh against intelligence collection, do not treat restraint as automatically
    controlling if a crucial national-security question remains unresolved. Make the competing interests explicit and base
    authorization on their balance, while recognizing that a particular collection effort is not guaranteed to resolve the
    uncertainty.
  limits: This reasoning applies to the presidential policy choice over the overflights during the missile gap controversy.
    It does not establish their legality, whether resuming them would answer the deployment question, or a general rule for
    intelligence collection in other circumstances.
