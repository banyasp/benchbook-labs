case:
  id: DR-OGE-2635-705-addfact1@v1
  title: HUD Supervisory Employee Requesting Subordinate's Personal Services [addfact]
  status: needs_review
  setting: U.S. Department of Housing and Urban Development, present
  decider: HUD supervisory staff member
  agent: HUD supervisory staff member
  agent_role: decide
  situation: A HUD supervisor is weighing whether to ask an assistant to perform personal errands during the assistant's official
    duty time and to provide additional personal services after hours. Agency regulations bar the use of official time for
    non-official tasks, and directing a subordinate to work off-duty for personal gain is prohibited unless the arrangement
    is truly voluntary and includes proper compensation. The supervisor knows that the assistant is currently on a performance-improvement
    plan, and any refusal could be recorded in the employee's file.
  question: What course of action should the HUD supervisory staff member take regarding requests for personal errands during
    duty hours and personal services outside duty hours?
  options:
    O1:
      do: The supervisor must not request the subordinate to handle personal errands during official work hours.
      move: act
      irreversible: true
    O2:
      do: The supervisor may request the subordinate to handle personal errands during official work hours.
      move: act
      irreversible: false
    O3:
      do: The supervisor may request the subordinate to provide voluntary personal services after hours, provided appropriate
        compensation is given.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: HUD employs staff members who hold supervisory positions.
  - id: F2
    kind: authority
    status: confirmed
    fact: Supervisors at HUD are prohibited from directing subordinates to perform personal errands during official work hours.
  - id: F3
    kind: authority
    status: confirmed
    fact: Compelling a subordinate to undertake personal tasks outside of duty time constitutes misuse of public office for
      private benefit, violating § 2635.702(a).
  - id: F4
    kind: authority
    status: confirmed
    fact: If the subordinate voluntarily agrees and receives appropriate compensation, providing personal services to a superior
      outside duty hours is permissible.
  - id: F5
    kind: situation
    status: assessed
    fact: The subordinate is currently subject to a performance-improvement plan, and a refusal to comply could be noted in
      their personnel file.
  - id: F6
    kind: authority
    status: confirmed
    fact: Providing insufficient compensation for such services would be deemed an improper gift to the supervisor under subpart
      C.
  - id: F7
    kind: situation
    status: assessed
    fact: The supervisor is contemplating asking the subordinate to run personal errands during work hours and to render additional
      personal services after hours.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: §2635.705(b) bars a supervisor from using official time for personal errands, and {F5} shows the assistant's performance-improvement
      status makes any such request coercive.
    rules_out:
    - O2
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: A subordinate may provide services after duty hours only when the arrangement is fully voluntary and compensated
      at fair market value.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Inadequate compensation would turn the service into an improper gift to the supervisor under subpart C.
  - id: C4
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Coercing a subordinate to perform personal activities outside duty hours without a voluntary, compensated arrangement
      violates §2635.702(a).
  - id: C5
    facts:
    - F2
    - F5
    equity: employee_protection
    favors:
    - O1
    weight: strong
    why: The regulation forbids directing subordinates to personal errands during official hours, and the assistant’s vulnerable
      status under a performance‑improvement plan heightens the risk of retaliation.
  reasoning:
    read: The HUD supervisor is considering asking an assistant to run personal errands during the assistant's scheduled work
      hours and to perform additional personal services after hours. The analyst notes that the assistant is on a performance-improvement
      plan, which makes any request appear coercive.
    weighing: C1, C4, and the analyst's new consideration each carry strong, binding authority that outright bars any request
      that consumes official time for personal errands. C2 acknowledges a narrow carve-out for voluntary, compensated work
      after hours, but the supervisor's proposal lacks clear voluntariness or compensation. The balance therefore rests on
      the prohibitions, leading to O1 as the only defensible action.
    tradecraft: Record the decision in the supervisor's official file, citing §2635.705(b). Inform the assistant that personal
      errands cannot be performed during duty hours. Should the assistant later volunteer for after-hours services, obtain
      a written agreement specifying fair-market compensation before any work begins.
    uncertainty: Minimal; the statutes provide clear, settled rules on misuse of official time and coercive requests.
    handoff: The supervising staff member may decide alone, but should notify the agency's ethics office or HR to ensure the
      decision is logged and consistent with HUD policy.
    tempting_wrong:
      option: O2
      pull: Conveniently offloading personal tasks to a subordinate during work hours.
      why_wrong: Such a request directly violates §2635.705(b) and, given {F5}, would be perceived as coercive.
    rejected:
      O2: Prohibited because it directs a subordinate to use official time for personal errands, breaching the regulation
        and exploiting the assistant's vulnerable status.
      O3: Voluntary, compensated services after duty hours are permissible, but the supervisor's request lacks demonstrated
        voluntariness and appropriate pay, and the primary violation concerns official-time misuse.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the assistant volunteers for after-hours services and receives fair-market compensation
      then: O3
      why: The regulation expressly permits voluntary, compensated nonduty-hour services.
    would_not_change:
    - id: noflip1
      if: compensation is offered for personal errands performed during official duty time
      why: Even with pay, using official time for personal errands is barred by §2635.705(b).
    watch_for:
    - id: watch1
      what: any sign that the assistant feels pressured or that compensation is inadequate
      favors:
      - O3
      why: Pressure or insufficient pay would convert a voluntary arrangement into an improper gift or misuse of office.
  lesson: HUD supervisors must not require subordinates to perform personal errands during official duty time; any personal
    services outside duty hours must be truly voluntary and fairly compensated.
  limits: This analysis applies only to HUD supervisory relationships governed by 5 C.F.R. 2635. It does not cover independent
    contractors, volunteers outside the federal workforce, or situations where the subordinate is not subject to the same
    official-time rules.
