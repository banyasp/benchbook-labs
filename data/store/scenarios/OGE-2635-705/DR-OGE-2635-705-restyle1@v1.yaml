case:
  id: DR-OGE-2635-705-restyle1@v1
  title: HUD Supervisory Employee Requesting Subordinate's Personal Services [restyle]
  status: needs_review
  setting: Office of the Secretary, Department of Housing and Urban Development, Washington, D.C., current fiscal year
  decider: HUD division manager
  agent: HUD division manager
  agent_role: decide
  situation: A division manager within HUD is weighing whether to request an administrative aide to handle personal tasks.
    The manager would be using the aide's scheduled work hours and also seeking personal assistance after hours. Agency policy
    prohibits employing official time for private matters, and coercing a staff member to perform personal work outside of
    work hours is barred unless the aide volunteers and receives proper compensation. The manager must determine which, if
    any, personal requests are permissible.
  question: What course of action should the HUD division manager take concerning requests for personal errands during work
    hours and personal services outside of work hours?
  options:
    O1:
      do: Refrain from asking the aide to perform personal errands during scheduled work hours.
      move: act
      irreversible: true
    O2:
      do: Proceed to ask the aide to handle personal errands during scheduled work hours.
      move: act
      irreversible: false
    O3:
      do: Invite the aide to provide voluntary personal services after work hours in exchange for appropriate compensation.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: HUD employs staff members who serve in supervisory capacities.
  - id: F2
    kind: authority
    status: confirmed
    fact: Supervisors at HUD are prohibited from directing subordinates to conduct personal errands during official work hours.
  - id: F3
    kind: authority
    status: confirmed
    fact: Directing or coercing a subordinate to perform personal activities during nonduty hours is an improper use of public
      office for private gain, violating § 2635.702(a).
  - id: F4
    kind: authority
    status: confirmed
    fact: A wholly voluntary arrangement that includes suitable compensation permits a subordinate to render services to a
      superior during non-working hours.
  - id: F5
    kind: authority
    status: confirmed
    fact: If the compensation is insufficient, the service is treated as an unlawful gift to the superior under subpart C.
  - id: F6
    kind: situation
    status: assessed
    fact: The manager is contemplating requesting the aide to run personal errands during work hours and to perform additional
      personal services after hours.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: Section 2635.705(b) explicitly bars a supervisor from ordering a subordinate to use official time for personal errands,
      rendering any such request impermissible.
    rules_out:
    - O2
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The regulation permits a subordinate to assist a superior after hours only when the arrangement is entirely voluntary
      and the subordinate receives fair market compensation.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: When the remuneration falls short of market rates, the assistance becomes a prohibited gift to the supervisor under
      subpart C.
  - id: C4
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Requiring a subordinate to perform personal tasks outside of duty hours without a voluntary, compensated agreement
      breaches § 2635.702(a).
  reasoning:
    read: The manager is inclined to enlist the aide for personal errands both during official hours and after hours, mistakenly
      assuming supervisory authority extends to private matters and overlooking the explicit statutory ban on using government
      time for personal gain.
    weighing: Considerations C1 and C4 carry decisive regulatory weight, categorically forbidding any request that consumes
      official time for personal errands. Although C2 recognizes a limited exception for voluntary, compensated work after
      hours, the manager's proposal lacks evidence of voluntariness or adequate pay. Accordingly, the balance favors rejecting
      the duty-hour request (O1).
    tradecraft: Record the determination in the manager's official file, citing § 2635.705(b). Notify the aide that personal
      errands cannot be performed during work hours. Should the aide later volunteer for after-hours assistance, secure a
      written agreement that specifies fair-market compensation before any work commences.
    uncertainty: Low; the governing regulation provides a clear, settled prohibition on misuse of official time.
    handoff: The manager may act independently, but should copy the agency ethics office or human-resources division to ensure
      the decision is documented and aligns with HUD policy.
    tempting_wrong:
      option: O2
      pull: Convenience and perceived efficiency of having the aide handle personal matters.
      why_wrong: Such a request directly contravenes § 2635.705(b), constituting an improper use of public office for private
        benefit.
    rejected:
      O2: Disallowed because it directs a subordinate to expend official time on personal errands, violating the regulation.
      O3: Although voluntary, compensated services after hours are permissible, the manager's request is not demonstrably
        voluntary nor properly compensated, and the primary concern remains the misuse of official time.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the aide's after-hours service is wholly voluntary and the manager provides appropriate compensation
      then: O3
      why: The regulation expressly allows voluntary, compensated non-duty-hour services.
    would_not_change:
    - id: noflip1
      if: the manager offers pay for personal errands performed during scheduled work hours
      why: Even with remuneration, employing official time for personal errands is prohibited by § 2635.705(b).
    watch_for:
    - id: watch1
      what: any sign that the aide feels pressured or that the compensation offered is insufficient
      favors:
      - O3
      why: Pressure or inadequate pay would transform a voluntary arrangement into an improper gift or misuse of office.
  lesson: Supervisors must not require subordinates to perform personal tasks during official work time; any personal assistance
    after hours must be truly voluntary and fairly compensated.
  limits: This guidance is limited to HUD supervisory relationships governed by 5 C.F.R. § 2635. It does not apply to independent
    contractors, volunteers outside the federal workforce, or situations where the subordinate is not subject to official-time
    regulations.
