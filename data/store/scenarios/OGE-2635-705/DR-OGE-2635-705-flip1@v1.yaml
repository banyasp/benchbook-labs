case:
  id: DR-OGE-2635-705-flip1@v1
  title: HUD Supervisory Employee Requesting Subordinate's Personal Services [flip]
  status: needs_review
  setting: U.S. Department of Housing and Urban Development, current operations
  decider: HUD supervisory staff member
  agent: HUD supervisory staff member
  agent_role: decide
  situation: A HUD supervisor is weighing whether to request an assistant to handle personal errands. The request would involve
    using the assistant's official work time for errands and also asking for personal services after hours. Agency policy
    bars the use of official time for private tasks, and coercing a subordinate for off-duty work is prohibited unless the
    arrangement is truly voluntary and fairly compensated. The supervisor must decide which, if any, of these personal requests
    may be made.
  question: How should the HUD supervisor proceed regarding personal errands during duty hours and personal services outside
    duty hours?
  options:
    O1:
      do: The supervisor may not ask the subordinate to run personal errands during duty hours.
      move: act
      irreversible: true
    O2:
      do: The supervisor may ask the subordinate to run personal errands during duty hours.
      move: act
      irreversible: false
    O3:
      do: The supervisor may ask the subordinate to provide voluntary services outside duty hours for appropriate compensation.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Department of Housing and Urban Development has a cadre of supervisory staff.
  - id: F2
    kind: situation
    status: confirmed
    fact: The subordinate freely consented to perform the personal errands after regular work hours and will be paid at the
      agency’s overtime wage rate.
  - id: F3
    kind: authority
    status: confirmed
    fact: Supervisors within HUD are prohibited from directing subordinates to perform personal errands while on the clock.
  - id: F4
    kind: authority
    status: confirmed
    fact: Ordering or pressuring a subordinate to carry out private tasks outside of official work time constitutes misuse
      of public office for personal benefit, contrary to § 2635.702(a).
  - id: F5
    kind: authority
    status: confirmed
    fact: When a subordinate voluntarily agrees and receives suitable pay, they may render services to a superior during off-duty
      periods.
  - id: F6
    kind: authority
    status: confirmed
    fact: If the remuneration is insufficient, the service becomes an impermissible gift to the supervisor under subpart C.
  - id: F7
    kind: situation
    status: assessed
    fact: The HUD supervisor is contemplating asking the assistant to handle personal errands during work hours and to undertake
      extra private tasks after hours.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: §2635.705(b) expressly forbids a supervisor from directing a subordinate to use official time for personal errands,
      making any such request impermissible.
    rules_out:
    - O2
  - id: C2
    facts:
    - F5
    - F2
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: Regulation allows a subordinate to render services to a superior outside duty hours when the work is fully voluntary
      and compensated at the appropriate rate, as demonstrated by {F2}.
  reasoning:
    read: The supervisor is tempted to enlist the assistant for personal errands during official hours and for extra services
      after hours. The lure is the convenience of using a trusted staff member, but statutes prohibit consuming official time
      for private gain and require any off-duty assistance to be wholly voluntary and fairly paid.
    weighing: C1 blocks any request that consumes duty time, eliminating O2. C2, reinforced by the confirmed voluntary and
      overtime-compensated arrangement in {F2}, validates O3. With the duty-hour request barred and the off-duty request meeting
      the statutory carve-out, the balanced outcome is to permit only the compensated, voluntary services outside duty hours
      (O3).
    tradecraft: Record the decision in the supervisor's official log, citing §2635.705(b). Inform the assistant that personal
      errands cannot be performed during duty hours. For any off-duty assistance, obtain a written acknowledgment of voluntary
      participation and confirm overtime pay before work begins.
    uncertainty: Low; the regulations provide clear guidance on official-time misuse and voluntary, compensated off-duty work.
    handoff: The supervisor may decide independently but should notify the agency ethics office to ensure the arrangement
      is documented and compliant.
    tempting_wrong:
      option: O2
      pull: Perceived efficiency and convenience of having the assistant handle personal errands during work hours.
      why_wrong: Such a request directly contravenes §2635.705(b), constituting an improper use of public office for private
        gain.
    rejected:
      O2: Prohibited because it directs a subordinate to use official time for personal errands, violating the regulation.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the subordinate's off-duty service is not fully voluntary or appropriate compensation is not provided
      then: O1
      why: Without a completely voluntary and fairly compensated arrangement, the request would breach §2635.702(a).
    would_not_change:
    - id: noflip1
      if: compensation is offered for personal errands performed during official duty time
      why: Even with pay, using official time for personal errands is barred by §2635.705(b).
    watch_for:
    - id: watch1
      what: any indication that the subordinate feels pressured or that compensation is inadequate
      favors:
      - O3
      why: Coercion or insufficient pay would convert a voluntary arrangement into an improper gift or misuse of office.
  lesson: Supervisors must not ask subordinates to perform personal tasks during official duty time; however, voluntary, fairly
    compensated services outside duty hours are permissible.
  limits: This guidance applies solely to HUD supervisory relationships governed by 5 C.F.R. 2635. It does not cover independent
    contractors, volunteers outside the federal workforce, or scenarios where the subordinate is not subject to the same official-time
    regulations.
