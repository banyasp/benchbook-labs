case:
  id: DR-OGE-2635-705@v1
  title: HUD Supervisory Employee Requesting Subordinate's Personal Services
  status: draft
  setting: Department of Housing and Urban Development, United States, present
  decider: HUD supervisory employee
  agent: HUD supervisory employee
  agent_role: decide
  situation: A supervisory employee at the Department of Housing and Urban Development is contemplating asking an assistant
    to perform personal errands. The request would involve using the assistant's official duty time and also asking for additional
    personal services outside of duty hours. The supervisor knows that agency regulations restrict the use of official time
    for non‑official activities. The supervisor also understands that coercing a subordinate for personal work outside duty
    hours may be prohibited unless the arrangement is voluntary and properly compensated. The supervisor must decide what,
    if any, personal requests can be made to the subordinate.
  question: What should the HUD supervisory employee do regarding asking the subordinate to perform personal errands during
    duty hours and personal services outside duty hours?
  options:
    O1:
      do: The supervisor may not ask the subordinate to run personal errands during duty hours.
      move: act
      irreversible: true
    O2:
      do: The supervisor may ask the subordinate to run personal errands during duty hours.
      move: act
      irreversible: false
    O3:
      do: The supervisor may ask the subordinate to provide voluntary services outside duty hours for appropriate compensation.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Department of Housing and Urban Development employs supervisory employees.
  - id: F2
    kind: authority
    status: confirmed
    fact: HUD supervisory employees may not ask a subordinate to run personal errands during duty hours.
  - id: F3
    kind: authority
    status: confirmed
    fact: Directing or coercing a subordinate to perform personal activities during nonduty hours is an improper use of public
      office for private gain, violating § 2635.702(a).
  - id: F4
    kind: authority
    status: confirmed
    fact: A voluntary arrangement with appropriate compensation permits a subordinate to provide services to the superior
      during nonduty hours.
  - id: F5
    kind: authority
    status: confirmed
    fact: Inadequate compensation for such services would constitute a prohibited gift to the superior under subpart C.
  - id: F6
    kind: situation
    status: assessed
    fact: The supervisor is considering requesting the subordinate to run personal errands during duty hours and to perform
      additional personal services outside duty hours.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: §2635.705(b) expressly forbids a supervisor from directing a subordinate to use official time for personal errands,
      making any such request impermissible.
    rules_out:
    - O2
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The regulation allows a subordinate to provide services to a superior during nonduty hours only when the arrangement
      is entirely voluntary and compensated appropriately.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: If compensation is inadequate, the service becomes a prohibited gift to the superior under subpart C.
  - id: C4
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Coercing a subordinate to perform personal activities outside duty hours without a voluntary, compensated arrangement
      violates §2635.702(a).
  reasoning:
    read: The supervisor is tempted to ask an assistant to run personal errands during official duty hours and to perform
      additional personal services after hours. The trap is assuming supervisory authority extends to private matters, ignoring
      the clear statutory prohibition on using official time for personal gain.
    weighing: C1 and C4 carry strong, binding authority that outright bars any request that consumes official time for personal
      errands. C2 acknowledges a narrow carve‑out for voluntary, compensated work outside duty hours, but the supervisor’s
      proposed request is not demonstrably voluntary nor compensated, so the balance rests on the prohibitions. Consequently,
      the only defensible action is to refuse the duty‑hour request (O1).
    tradecraft: Document the decision in the supervisor’s official record, citing §2635.705(b). Communicate to the assistant
      that personal errands cannot be performed during duty hours. If the assistant later volunteers for nonduty‑hour services,
      obtain a written agreement specifying fair market compensation before any work begins.
    uncertainty: Minimal; the regulation provides a clear, settled rule on official‑time misuse.
    handoff: The supervisor can decide alone, but should inform the agency’s ethics office or HR to ensure the decision is
      logged and consistent with agency policy.
    tempting_wrong:
      option: O2
      pull: Convenience and perceived efficiency of having the assistant handle personal tasks.
      why_wrong: Such a request directly violates §2635.705(b), constituting an improper use of public office for private
        gain.
    rejected:
      O2: Prohibited because it directs a subordinate to use official time for personal errands, violating the regulation.
      O3: While voluntary, compensated services outside duty hours are permissible, the supervisor’s request is not clearly
        voluntary nor compensated, and the primary issue concerns misuse of official time.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the subordinate’s service outside duty hours is entirely voluntary and appropriate compensation is provided
      then: O3
      why: The regulation expressly permits voluntary, compensated nonduty‑hour services.
    would_not_change:
    - id: noflip1
      if: compensation is offered for personal errands performed during official duty time
      why: Even with pay, using official time for personal errands is barred by §2635.705(b).
    watch_for:
    - id: watch1
      what: any indication that the subordinate feels pressured or that compensation is inadequate
      favors:
      - O3
      why: Coercion or inadequate pay would convert a voluntary arrangement into an improper gift or misuse of office.
  lesson: Supervisors must not require subordinates to perform personal tasks during official duty time; any personal services
    outside duty hours must be truly voluntary and fairly compensated.
  limits: This analysis applies only to HUD supervisory relationships governed by 5 C.F.R. 2635. It does not extend to independent
    contractors, volunteers outside the federal workforce, or situations where the subordinate is not subject to the same
    official‑time rules.
