case:
  id: DR-XFER-CORPUS-NX-3380c2d2-E1-B-flip1@v1
  title: Financial Analysts in a Neutral Central Bank
  status: draft
  setting: A neutral state bordering a U.S. theater of operations; the central bank’s supervision unit, during consideration
    of a response to exchange-house transfers; the Treasury Department and the host central bank
  decider: The Treasury Assistant Secretary
  agent: The Treasury Assistant Secretary
  agent_role: decide
  situation: Exchange houses in the neutral state are an increasingly important channel for funds reaching insurgents fighting
    U.S. forces across the border. The Treasury Department is considering a response, while the host state’s concern for preserving
    its neutrality rules out placing a U.S. Treasury team in the country. The alternative under consideration is a small team
    of local analysts in the central bank’s supervision unit, paid by the United States and directed by the Treasury attaché;
    the central bank has quietly accepted the proposed placement. The team is intended mainly to provide information, with
    some slowing of the flows hoped for but not assured. Host banking-secrecy rules apply. The Treasury Assistant Secretary
    and the host central bank have concluded that permitting the proposed team would undermine the appearance of neutrality
    and conflict with applicable banking-secrecy requirements. The Treasury Assistant Secretary must decide whether to permit
    the team’s placement.
  question: What should the Treasury Assistant Secretary do about whether to permit the local analysts to operate in the central
    bank’s supervision unit?
  options:
    O1:
      do: The Treasury Assistant Secretary permits the U.S.-paid, Treasury-directed local analysts to operate in the central
        bank’s supervision unit.
      move: act
      irreversible: false
    O2:
      do: The Treasury Assistant Secretary prohibits the U.S.-paid, Treasury-directed local analysts from operating in the
        central bank’s supervision unit.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Exchange houses in the neutral state transmit funds to recipients that include insurgents fighting U.S. forces across
      the border.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Transfers through the exchange houses are an increasingly important channel for funds reaching those insurgents.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Treasury Department is considering policy responses to the exchange-house transfers.
  - id: F4
    kind: authority
    status: confirmed
    fact: The host state’s concern for preserving its neutrality rules out placing a U.S. Treasury team in the country.
  - id: F5
    kind: capability
    status: confirmed
    fact: A small team of local analysts, paid by the United States and directed by the Treasury attaché, has been proposed
      for the central bank’s supervision unit, and the central bank has quietly accepted the proposed placement.
  - id: F6
    kind: capability
    status: assessed
    fact: The proposed team is intended mainly to provide information, and it is hoped that its work may slow some transfers.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Treasury Assistant Secretary and the host central bank have concluded that permitting the proposed team would
      undermine the appearance of neutrality and conflict with applicable banking-secrecy requirements.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Public exposure of the U.S. role could raise questions about the host state’s neutrality and the handling of protected
      banking information.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The exchange houses are assessed to be an increasingly important channel for funds reaching insurgents fighting U.S.
      forces, giving Treasury a reason to consider a posture aimed at informing or affecting those transfers.
  - id: C2
    facts:
    - F4
    - F5
    - F7
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Although the local analysts were the alternative to a U.S. team and the central bank had quietly accepted their placement,
      the Treasury Assistant Secretary and the bank have concluded that permitting them would undermine the appearance of
      neutrality and conflict with applicable banking-secrecy requirements.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The proposed analysts are intended mainly to provide information, and slowing transfers is only a hoped-for effect
      rather than an assured result.
  reasoning:
    read: Treasury faces a growing concern about transfers reaching insurgents while the host state’s neutrality concern excludes
      a U.S. Treasury team. The local analysts were the alternative posture under consideration, but the Treasury Assistant
      Secretary and the host central bank have concluded that permitting them would undermine the appearance of neutrality
      and conflict with applicable banking-secrecy requirements.
    weighing: The concern about funds reaching insurgents favors a response {C1}, and the local analysts’ intended information
      role offers a possible, though uncertain, contribution {C3}. But the host state’s neutrality concern and the joint conclusion
      that this specific arrangement would undermine neutrality and conflict with applicable secrecy requirements weigh strongly
      against permitting it {C2}. The alternative posture therefore does not remain compatible with the constraints that shaped
      the choice. The balance favors O2.
    tradecraft: Keep the decision at the level of staffing posture, host-state neutrality, and legal authority. Record that
      slowing transfers is hoped for rather than assured. The joint conclusion about neutrality and banking secrecy is directly
      relevant to the posture decision; do not treat the central bank’s quiet acceptance as overriding that conclusion.
    uncertainty: The extent to which the analysts would slow transfers is uncertain. Public exposure could also raise questions
      about neutrality and protected banking information.
    handoff: The Treasury Assistant Secretary holds the decision. The host central bank’s conclusion about neutrality and
      banking-secrecy requirements is directly relevant to whether the proposed placement should be permitted.
    tempting_wrong:
      option: O1
      pull: Permitting the local analysts could seem like the practical alternative because the host state rules out a U.S.
        Treasury team and the central bank quietly accepted the placement.
      why_wrong: The Treasury Assistant Secretary and the host central bank have concluded that permitting this arrangement
        would undermine the appearance of neutrality and conflict with applicable banking-secrecy requirements. The alternative
        posture therefore does not satisfy the constraints that made it appear suitable.
    rejected:
      O1: 'The Assistant Secretary does not permit the proposed posture: the joint conclusion that it would undermine the
        appearance of neutrality and conflict with applicable banking-secrecy requirements outweighs its possible informational
        contribution.'
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Treasury Assistant Secretary and the host central bank did not conclude that permitting the analysts would undermine
        the appearance of neutrality or conflict with applicable banking-secrecy requirements.
      then: O1
      why: Without that disqualifying conclusion, the original reason for rejecting the local-analyst alternative would no
        longer hold; the transfer concern, the host’s constraint on a U.S. team, and the analysts’ intended informational
        role would again support permitting the placement.
    would_not_change:
    - id: noflip1
      if: Concern about the transfers reaching insurgents increased, while the neutrality constraint and the contemplated
        purposes of the local-analyst posture remained the same.
      why: That would strengthen the stated reason for a response without, by itself, changing the host-state constraint or
        the conclusion that the local-analyst arrangement is incompatible with it.
    watch_for:
    - id: watch1
      what: Whether the joint conclusion about the local-analyst arrangement’s compatibility with the host state’s neutrality
        concern and applicable banking-secrecy requirements changes, and whether the U.S. role remains undisclosed.
      favors:
      - O2
      - O1
      why: The stated incompatibility supports prohibiting the placement; a changed assessment that the arrangement is compatible
        could weaken that reason, while exposure that undermines neutrality would reinforce it.
  lesson: 'A policy constraint that rules out one form of presence does not automatically require inaction when an alternative
    posture is available. But the alternative must itself be assessed against the host’s constraints: when the relevant authorities
    conclude that it undermines neutrality or conflicts with applicable secrecy requirements, its possible mission contribution
    does not settle the decision in its favor. Distinguish hoped-for effects from established ones.'
  limits: This reasoning addresses only the stated choice about a local-analyst posture and the host-state neutrality and
    banking-secrecy concerns. It does not establish the arrangement’s effectiveness, the full scope of applicable law beyond
    the stated joint conclusion, or the conditions under which analysts could work.
  library:
    domain: counter-threat finance
    family: XFER-CORPUS-NX-3380c2d2
    source: transfer of DR-CORPUS-NX-3380c2d2-E1@v1
    episode_focus: The stated constraint was preserving the appearance of Laotian neutrality, which ruled out U.S. or South
      Vietnamese forces; irregulars were selected to contest Pathet Lao presence and seek information about North Vietnamese
      activity. Keep the decision at the force-posture and neutrality-policy level, not the operational details of intelligence
      collection or deployment.
    equities: pilot2
