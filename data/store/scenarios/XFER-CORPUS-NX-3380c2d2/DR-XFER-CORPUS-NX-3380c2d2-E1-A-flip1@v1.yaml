case:
  id: DR-XFER-CORPUS-NX-3380c2d2-E1-A-flip1@v1
  title: Partner-Crewed Patrols in a Strait
  status: draft
  setting: A strait in a partner state's waters; during a security-cooperation review; the partner's coast guard and the U.S.
    combatant command
  decider: The combatant command's security-cooperation director
  agent: The combatant command's security-cooperation director
  agent_role: decide
  situation: A strait in a partner state's waters is becoming a growing route for arms bound for a militia fighting U.S.-backed
    forces in a neighboring country. The partner and Washington are concerned about preserving the appearance of the partner's
    non-alignment, ruling out U.S. Navy or third-country patrols. The combatant command and partner have also concluded that
    a U.S.-funded squadron crewed by the partner's coast guard, with U.S. officers directing its tasking, would undermine
    that appearance. The proposed patrols are intended mainly to report on traffic, and some deterrence is hoped for. The
    scope of existing arrangements for U.S. officers to direct tasking in the partner's waters is not settled in the current
    record.
  question: What should the combatant command's security-cooperation director do about whether to permit the partner-crewed
    patrols in the strait?
  options:
    O1:
      do: The combatant command's security-cooperation director permits the partner-crewed patrols in the strait.
      move: act
      irreversible: false
    O2:
      do: The combatant command's security-cooperation director prohibits the partner-crewed patrols in the strait.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The strait lies in the partner state's waters and is a route for maritime traffic.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Arms traffic through the strait is growing, with arms assessed as bound for a militia fighting U.S.-backed forces
      in a neighboring country.
  - id: F3
    kind: situation
    status: confirmed
    fact: The combatant command is considering policy responses to the arms traffic through the strait.
  - id: F4
    kind: authority
    status: confirmed
    fact: The partner and Washington have stated concerns about preserving the appearance of the partner's non-alignment,
      ruling out U.S. Navy or third-country patrols. The combatant command and partner have also concluded that permitting
      the partner-crewed patrols with U.S. officers directing tasking would undermine that appearance.
  - id: F5
    kind: capability
    status: confirmed
    fact: A U.S.-funded squadron crewed by the partner's coast guard, with U.S. officers directing its tasking, is under consideration
      as an alternative patrol posture.
  - id: F6
    kind: capability
    status: assessed
    fact: The contemplated patrols are intended mainly to report on traffic, and some deterrence of the arms traffic is hoped
      for.
  - id: F7
    kind: authority
    status: confirmed
    fact: The bilateral security-cooperation arrangement in force addresses funding and partner participation, but the current
      record contains no approved implementing directive settling whether U.S. officers may direct operational tasking in
      the partner's waters.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The growing arms route supplies a militia fighting U.S.-backed forces, giving the combatant command a reason to consider
      a posture aimed at affecting that traffic.
  - id: C2
    facts:
    - F4
    - F5
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The partner and the combatant command have concluded that this partner-crewed posture, with U.S. officers directing
      tasking, would undermine the appearance of non-alignment. That shared concern weighs against permitting it, even though
      it is crewed by the partner's coast guard.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The contemplated patrols are intended mainly to report traffic and are hoped to deter some of it, but the anticipated
      deterrent effect is uncertain.
  reasoning:
    read: 'The combatant command faces growing concern about arms traffic through the strait while the partner''s and Washington''s
      non-alignment concerns exclude U.S. Navy and third-country patrols. The partner-crewed posture is not a compatible alternative
      on the current facts: the command and partner have concluded that it too would undermine the appearance of non-alignment.'
    weighing: The growing arms route favors a response {C1}, and the reporting purpose and hoped-for deterrence provide some
      support for permitting the partner-crewed patrols {C3}. But the partner and the command have concluded that this posture
      would undermine the appearance of non-alignment, the concern that already rules out other patrol options {C2}. That
      strong partner-relationship constraint outweighs the mission benefits, including the uncertain deterrent effect. The
      balance therefore favors O2. The unresolved scope of U.S. officers' tasking authority should not be presumed settled
      by the funding arrangement.
    tradecraft: Keep the decision at the level of patrol posture and non-alignment policy. Record the constraint, the intended
      purposes, and that deterrence was hoped for rather than assured. Distinguish permission for the policy posture from
      whether the existing authorities cover U.S. officers directing tasking; do not treat the patrol aims as operational
      instructions or infer authority from funding alone.
    uncertainty: The extent to which the patrols would deter arms traffic is uncertain. The command and partner have concluded
      that the posture would undermine the appearance of non-alignment. The scope of authority for U.S. officers to direct
      tasking in the partner's waters is also unresolved in the current record.
    handoff: The combatant command's security-cooperation director holds the decision. The partner's shared assessment of
      the non-alignment concern is relevant to the posture choice. The scope of the relevant authorities should be clarified
      before implementation.
    tempting_wrong:
      option: O1
      pull: The growing arms route and the patrols' reporting purpose could make permitting the partner-crewed squadron seem
        like the most useful response.
      why_wrong: The partner and the command have concluded that this posture would undermine the appearance of non-alignment.
        That directly conflicts with the stated constraint shaping the patrol choice; the hoped-for deterrence is also uncertain.
    rejected:
      O1: The security-cooperation director did not permit the posture because the partner and the command concluded it would
        undermine the appearance of non-alignment, despite its potential reporting and deterrent benefits.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The combatant command and partner did not conclude that permitting the partner-crewed patrols with U.S. officers
        directing tasking would undermine the appearance of the partner's non-alignment, with the other stated facts unchanged.
      then: O1
      why: Without that conclusion disqualifying the partner-crewed posture on non-alignment grounds, the original reasons
        for preferring it as an alternative to U.S. Navy or third-country patrols would again support permitting it.
    would_not_change:
    - id: noflip1
      if: Concern about arms traffic through the strait increased, while the non-alignment constraint and the contemplated
        purposes of the partner-crewed patrols remained the same.
      why: That would strengthen the stated reason for a response without changing the shared conclusion that this patrol
        posture would undermine the appearance of non-alignment.
    watch_for:
    - id: watch1
      what: Whether the partner and the command continue to assess that the partner-crewed patrol posture would undermine
        the appearance of non-alignment.
      favors:
      - O2
      - O1
      why: The current shared conclusion supports prohibiting the posture; if that assessment changes, the non-alignment basis
        for rejecting this alternative would weaken.
  lesson: A policy constraint that rules out one form of patrol does not automatically make another posture acceptable. Assess
    each alternative against the stated constraint as well as the mission concern, distinguish hoped-for effects from established
    ones, and do not presume that funding settles the authority for directing a partner's crews.
  limits: This reasoning addresses only the stated patrol-posture choice and non-alignment concern. It does not establish
    the legality, effectiveness, or operational conditions of the partner-crewed patrols, or resolve the scope of authority
    for U.S. officers to direct their tasking.
  library:
    domain: maritime security cooperation
    family: XFER-CORPUS-NX-3380c2d2
    source: transfer of DR-CORPUS-NX-3380c2d2-E1@v1
    episode_focus: The stated constraint was preserving the appearance of Laotian neutrality, which ruled out U.S. or South
      Vietnamese forces; irregulars were selected to contest Pathet Lao presence and seek information about North Vietnamese
      activity. Keep the decision at the force-posture and neutrality-policy level, not the operational details of intelligence
      collection or deployment.
    equities: pilot2
