    domain: use-of-force-policy
    family: CORPUS-INC-SOVIET-NONINTERVENTION-DURING-EASTERN-EU
    source: https://www.cia.gov/resources/csi/static/aff04a6c37c302ad350865cd91119754/At-Cold-Wars-End3-End-of-Empire-I-and-2.pdf
    episode_focus: 'Treat this as a conditional policy choice: preserve party rule and Soviet authority through whatever action
      is required, including possible intervention, or accept the risk of events escaping local control. The passage cites
      the costs to the leader’s standing and foreign policy, and says those costs make intervention a last resort; it predicts
      a response rather than documenting an intervention that occurred.'
    cues:
