case:
  id: DR-CORPUS-INC-SOVIET-NONINTERVENTION-DURING-EASTERN-EU-NX-62bccee7-E4@v1
  title: Intervention as a Last Resort in East Europe
  status: draft
  setting: East Europe, during the Soviet leader’s reform period; Soviet leadership and allied East European governments.
  decider: The Soviet leader
  agent: The Soviet leader
  agent_role: decide
  situation: In East Europe, allied party leaderships are responsible for containing political violence and major unrest.
    Their large security forces have so far been effective in containing disturbances, while the Soviet leader has shown greater
    tolerance for experimentation. If events exceed local leaders’ capacity, the Soviet leader faces a choice about preserving
    party rule and Soviet authority, including the possibility of intervention. Intervention could damage his standing in
    the West and undermine his foreign policy. Upheaval, particularly if attributed to reform pressures, could also threaten
    his domestic standing and reform program.
  question: What should the Soviet leader do if political violence or major unrest overwhelms local leaders’ capacity in East
    Europe?
  options:
    O1:
      do: The Soviet leader declines intervention in East Europe and accepts the risk that local leaders lose control.
      move: act
      irreversible: false
    O2:
      do: The Soviet leader authorizes intervention in East Europe as a last resort after exhausting other options.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: East European leaderships are expected to take swift, decisive action to end political violence or major unrest.
  - id: F2
    kind: capability
    status: assessed
    fact: East European leaderships have large security forces that have so far been effective in containing disturbances.
  - id: F3
    kind: situation
    status: assessed
    fact: The Soviet leader has shown greater tolerance for experimentation.
  - id: F4
    kind: authority
    status: assessed
    fact: If events overwhelm local leaders’ capacity, the Soviet leader is expected to take whatever action is required,
      including possible military intervention, to preserve party rule and Soviet authority in the region.
  - id: F5
    kind: situation
    status: assessed
    fact: The Soviet leader is expected to exhaust all other options before undertaking military intervention.
  - id: F6
    kind: situation
    status: assessed
    fact: An invasion of an allied country would irreparably damage the Soviet leader’s image in the West and undermine his
      foreign policy.
  - id: F7
    kind: situation
    status: assessed
    fact: Upheaval in East Europe, particularly if attributed to the Soviet leader’s reform pressures, could threaten his
      domestic standing, increase pressure for his removal, and lead to curtailment of his reform program.
  considerations:
  - id: C1
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: If local leaders are overwhelmed, the stated objective is to preserve party rule and Soviet authority, and the expected
      response includes whatever action is required.
  - id: C2
    facts:
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: 'Intervention is not presented as an immediate first response: the leader is expected to exhaust other options before
      undertaking it.'
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: An invasion would irreparably damage the leader’s image in the West and undermine his foreign policy, making intervention
      costly.
  - id: C4
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Uncontrolled upheaval, especially if linked to reform pressures, could threaten the leader’s domestic standing and
      reform program; this adds reason not to accept events escaping control, though the passage does not say intervention
      would prevent that risk.
  reasoning:
    read: 'This is a conditional choice, not a prediction that intervention has already occurred: local governments are expected
      to act first, and the Soviet leader’s intervention is contemplated only if events exceed their capacity. The trap is
      treating the costs of intervention as an absolute bar, or treating the choice as immediate intervention versus indifference;
      the stated course is to exhaust other options and intervene as a last resort to preserve party rule and Soviet authority.'
    weighing: The preservation objective and the expected response if local capacity is overwhelmed support {O2} {C1}. Exhausting
      other options before intervention is a significant constraint on how that choice is reached, not a rejection of intervention
      {C2}. The damage to Western standing and foreign policy weighs against intervention {C3}; the domestic consequences
      of upheaval add pressure not to let events escape control, although the passage leaves that relationship less explicit
      {C4}. The balance depends on local capacity being overwhelmed and other options being exhausted.
    tradecraft: Establish whether local leaders’ capacity has actually been exceeded, identify whether other options remain,
      and record why the preservation objective warrants last-resort authorization despite the stated foreign-policy and standing
      costs. Keep the decision at the policy level and do not infer operational details or a legal authorization standard
      not supplied here.
    uncertainty: The passage predicts the leader’s response; it does not document an intervention. It gives no specific threshold
      for when local capacity is overwhelmed, what other options are available, or what legal framework governs intervention.
    handoff: The Soviet leader is the decision-maker if local capacity is exceeded. The allied leaderships’ containment role
      and existing security capacity matter to the trigger, but the passage does not identify a further approval body or handoff
      process.
    tempting_wrong:
      option: O1
      pull: Avoiding intervention would protect the leader’s image in the West and prevent damage to his foreign policy.
      why_wrong: Those costs explain why intervention is a last resort, but the stated assessment still expects action, including
        possible intervention, if local leaders are overwhelmed and party rule or Soviet authority is at stake.
    rejected:
      O1: The leader is not expected simply to decline intervention if events overwhelm local capacity; he is expected to
        take whatever action is required after exhausting other options.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Local leaders still had capacity to contain the unrest and events had not overwhelmed them.
      then: O1
      why: The stated trigger for the leader to take whatever action was required, including intervention, would not have
        been met.
    would_not_change:
    - id: noflip1
      if: The leader continued to show greater tolerance for experimentation.
      why: That tolerance is expressly described alongside the expectation of decisive action against major unrest and possible
        intervention if local capacity is overwhelmed.
    watch_for:
    - id: watch1
      what: Whether disturbances exceed the capacity of the allied local leaderships and their security forces.
      favors:
      - O2
      why: That is the stated condition for the Soviet leader to take whatever action is required.
    - id: watch2
      what: The foreign-policy and reputational costs associated with intervention.
      favors:
      - O1
      why: An invasion is assessed to damage the leader’s Western image irreparably and undermine his foreign policy, helping
        explain the last-resort constraint.
  lesson: 'A stated willingness to use force as a last resort is not an instruction to use it immediately: first establish
    that the triggering condition has occurred and that other options are exhausted. Serious reputational and policy costs
    may constrain the choice without, by themselves, reversing the stated preservation objective.'
  limits: This reasoning describes an assessment of a Soviet leader’s expected response in service of party rule and Soviet
    authority. It does not establish that intervention would be lawful, legitimate, effective, or consistent with any particular
    rules of engagement.
