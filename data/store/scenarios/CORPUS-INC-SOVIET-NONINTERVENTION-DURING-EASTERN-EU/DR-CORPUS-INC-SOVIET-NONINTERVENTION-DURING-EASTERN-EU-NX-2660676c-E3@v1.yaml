case:
  id: DR-CORPUS-INC-SOVIET-NONINTERVENTION-DURING-EASTERN-EU-NX-2660676c-E3@v1
  title: Force and Soviet Influence in Eastern Europe
  status: draft
  setting: Soviet foreign policy, Eastern Europe, late 1980s
  decider: The Soviet leadership
  agent: The Soviet leadership
  agent_role: decide
  situation: The Soviet leadership faces a policy choice about whether to use force in Eastern Europe as communist rule and
    Soviet influence there come under pressure. An intelligence assessment describes constraints on intervention, while allowing
    that intervention might be considered in an extreme situation. Renunciation of force has been advanced as a central policy,
    but some officials regard it as limiting Soviet options. There is concern that using force could precipitate violent collapse
    rather than preserve the Soviet position. The leadership appears to expect that East European governments will embrace
    perestroika, while the withdrawal from Afghanistan has been intended to reassure them that Soviet troops will not be sent
    into another country.
  question: What should the Soviet leadership do about the use of force in Eastern Europe?
  options:
    O1:
      do: The Soviet leadership would prohibit the use of force in Eastern Europe.
      move: act
      irreversible: false
    O2:
      do: The Soviet leadership would permit the use of force in Eastern Europe.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A 1988 intelligence assessment judged that the Soviet leader faced greater constraints than predecessors against
      intervening militarily in Eastern Europe.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The assessment allowed that, in an extreme situation, the Soviet leadership might intervene to preserve party rule
      and decisive Soviet influence in the region.
  - id: F3
    kind: situation
    status: assessed
    fact: A former foreign-policy adviser described renunciation of force, beginning with Afghanistan, as the centerpiece
      of Soviet foreign policy from the foreign minister's first day in office.
  - id: F4
    kind: situation
    status: assessed
    fact: Some officials opposed renunciation of force on the grounds that it tied Soviet hands.
  - id: F5
    kind: intelligence
    status: assessed
    fact: There was a concern that using force might precipitate violent collapse rather than maintain the Soviet position
      in the region.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Soviet leader appeared to believe that the question of using force to hold the outer empire together would not
      arise because East Europeans would embrace perestroika.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A former Soviet ambassador to the United States believed the Soviet leader had not foreseen that Eastern Europe
      would leave the Soviet orbit within months or that the Warsaw Pact would crumble so soon.
  - id: F8
    kind: situation
    status: confirmed
    fact: The withdrawal of Soviet troops from Afghanistan was intended to reassure Western countries and East Europeans that
      Soviet troops would not be sent into another country.
  - id: F9
    kind: situation
    status: assessed
    fact: For East Europeans, the withdrawal meant that the Brezhnev doctrine of permanent communist rule was a dead letter.
  considerations:
  - id: C1
    facts:
    - F5
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The stated concern is that using force could precipitate violent collapse and end in blood rather than preserve the
      Soviet position; that risk weighs against force.
  - id: C2
    facts:
    - F3
    - F8
    - F9
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Renunciation of force was advanced as a centerpiece of policy, and the Afghanistan withdrawal was meant to reassure
      East Europeans that Soviet troops would not be sent into another country. To them, it made the Brezhnev doctrine a dead
      letter.
  - id: C3
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The counterargument is that renunciation tied Soviet hands; the intelligence assessment also allowed that force might
      be considered in extremis to preserve party rule and decisive Soviet influence.
  - id: C4
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: 'The expectation that East Europeans would embrace perestroika proved unreliable: the Soviet leader had not foreseen
      how quickly the region would leave the Soviet orbit or the Warsaw Pact would crumble. That makes it unsafe to treat
      force as a dependable way to preserve the Soviet position.'
  reasoning:
    read: 'This is a policy choice about whether force can preserve Soviet rule and influence, not simply whether the leadership
      should retain every option. The trap is to treat force as a reliable safeguard: the stated concern is that it could
      instead trigger violent collapse, while renunciation had also become a signal to East Europeans that troops would not
      be sent into another country.'
    weighing: The risk of violent collapse and the reassurance conveyed by renunciation weigh strongly toward prohibiting
      force {C1} {C2}. The argument that renunciation ties Soviet hands, and the stated extreme-case rationale for intervention,
      count against an absolute prohibition {C3}; however, the expectation that East Europeans would embrace perestroika was
      not borne out as anticipated {C4}. The balance depends on whether the situation is genuinely extreme, not merely whether
      Soviet influence is under pressure.
    tradecraft: Record the policy choice, the reasons for it, and the distinction between ordinary pressure and the stated
      extreme-case contingency. Reassess the underlying political assumptions as circumstances change, rather than treating
      an expectation about perestroika as established fact.
    uncertainty: The passage does not define what qualifies as in extremis or establish that force would preserve party rule
      or influence in such a case. It also records that the speed of Eastern Europe's departure from the Soviet orbit and
      the Warsaw Pact's collapse were not foreseen.
    handoff: The Soviet leadership should make and record this as a leadership-level foreign-policy decision, involving the
      foreign-policy officials responsible for the renunciation policy because the choice affects both the stated reassurance
      and the claimed need to preserve Soviet influence.
    tempting_wrong:
      option: O2
      pull: Permitting force preserves an apparent option to defend party rule and decisive Soviet influence, and answers
        the objection that renunciation ties Soviet hands.
      why_wrong: 'The passage gives reason to doubt that force would preserve the Soviet position: it might precipitate violent
        collapse, while the policy of renunciation was also intended to reassure East Europeans.'
    rejected:
      O2: Force was not chosen as the general policy because the stated risk was that it could end in violent collapse rather
        than maintain the Soviet position, and renunciation had become a central policy and reassurance.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The situation were genuinely in extremis, such that intervention was considered necessary to preserve party rule
        and decisive Soviet influence.
      then: O2
      why: The intelligence assessment expressly allowed intervention in that extreme circumstance.
    would_not_change:
    - id: noflip1
      if: Officials continued to argue that renunciation of force tied Soviet hands.
      why: That objection is recorded, but by itself it does not answer the stated concern that force might precipitate violent
        collapse or undo the reassurance policy.
    watch_for:
    - id: watch1
      what: Whether the expectation that East Europeans would embrace perestroika remains credible, given that the speed of
        their departure from the Soviet orbit was not foreseen.
      favors:
      - O1
      why: The failed expectation cautions against assuming that force would reliably preserve Soviet influence.
  lesson: Do not assume that force will preserve political influence when the source warns it may instead precipitate collapse.
    A stated emergency exception does not erase the reasons for a general policy of renunciation, and expectations about others'
    political choices should be treated as uncertain.
  limits: This reasoning addresses the general policy choice in late-1980s Eastern Europe. The passage neither defines the
    threshold for an extreme situation nor resolves what action would be justified if that threshold were reached.
  library:
    domain: use-of-force-policy
    family: CORPUS-INC-SOVIET-NONINTERVENTION-DURING-EASTERN-EU
    source: https://www.cia.gov/resources/csi/static/760c725274a7f336963aec05af514ae4/At-Cold-Wars-End-US-Intelligence-on-the-Soviet-Union-and-Eastern-Europe-1989-1991.pdf
    episode_focus: The passage describes renunciation of force as a central policy and explains the risk that intervention
      could trigger violent collapse; withdrawal from Afghanistan also served to reassure East Europeans that troops would
      not be sent into another country. Keep the focus on the policy choice about force, not military methods or any specific
      engagement.
