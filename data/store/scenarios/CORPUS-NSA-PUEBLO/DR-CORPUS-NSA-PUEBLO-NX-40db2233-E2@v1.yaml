case:
  id: DR-CORPUS-NSA-PUEBLO-NX-40db2233-E2@v1
  title: Managing Use While Replacement Is Delayed
  status: draft
  setting: National-security communications; place, time, and institution are not specified.
  decider: The responsible authority issuing the warning and usage order; the office is not identified.
  agent: The responsible authority issuing the warning and usage order; the office is not identified.
  agent_role: decide
  situation: The operational codes and authenticator system were in widespread use. Immediate supersession was not possible.
    Holders had these materials in use, and replacement materials could become available later. Compromise was considered
    possible. The responsible authority had to decide how holders could use the materials while immediate replacement was
    unavailable.
  question: What should the responsible authority do about holders’ use of the operational codes and authenticator system
    while immediate replacement is unavailable?
  options:
    O1:
      do: The responsible authority permits holders to continue ordinary use of the materials while replacement materials
        are unavailable.
      move: act
      irreversible: false
    O2:
      do: The responsible authority warns holders of possible compromise and limits their use until replacement materials
        are available.
      move: partial
      irreversible: false
    O3:
      do: The responsible authority prohibits ordinary use of the materials while replacement materials are unavailable.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Operational codes were in widespread use.
  - id: F2
    kind: situation
    status: confirmed
    fact: The authenticator system was in widespread use.
  - id: F3
    kind: situation
    status: confirmed
    fact: The materials could not be superseded immediately.
  - id: F4
    kind: capability
    status: confirmed
    fact: The materials could be replaced later.
  - id: F5
    kind: situation
    status: confirmed
    fact: There were holders of the materials.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The materials were considered possibly compromised.
  considerations:
  - id: C1
    facts:
    - F6
    equity: security_risk
    favors:
    - O2
    - O3
    weight: strong
    why: Because compromise was considered possible, leaving holders to use the materials without restriction would leave
      that concern unaddressed.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The materials were widely used and could not be superseded immediately, supporting a constrained interim course rather
      than assuming immediate replacement or a complete stop was practicable.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: Replacement was possible later, so warning holders and limiting use could serve as a temporary risk measure pending
      replacement.
  reasoning:
    read: 'This was an interim risk-management decision: widespread use made immediate supersession impossible, while possible
      compromise made ordinary unrestricted use a concern. The trap is treating the choice as either ordinary use or an immediate
      replacement that was not available.'
    weighing: The responsible authority responded to possible compromise by warning holders and limiting use, while the widespread
      use of the materials and inability to replace them immediately weighed against treating immediate supersession as available.
      The balance therefore supports {O2}, a restriction pending replacement, rather than ordinary use or a prohibition. The
      likelihood and consequences of compromise are unspecified.
    tradecraft: Issue the warning and usage limit clearly to holders, maintain the limit while replacement is unavailable,
      and document the decision and when replacement permits it to be revisited.
    uncertainty: The likelihood of compromise, its anticipated consequences, and the operational effect of the usage limit
      are unspecified.
    handoff: The responsible authority issued the warning and order. No other participants or required referral are identified;
      involving the relevant communications and security officials to manage the restriction and replacement is an implementation
      suggestion.
    tempting_wrong:
      option: O1
      pull: Widespread use and the inability to replace the materials immediately could make ordinary use seem like the only
        practicable course.
      why_wrong: That overlooks the assessed possibility of compromise; the responsible authority chose to warn holders and
        limit use rather than permit ordinary use.
    rejected:
      O1: It was not chosen because holders were warned of possible compromise and ordered to limit use.
      O3: It was not chosen; the order limited use pending replacement rather than prohibiting ordinary use altogether.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible new evidence established that the materials were actively compromised.
      then: O3
      why: A confirmed compromise could warrant prohibiting ordinary use rather than merely limiting it.
    - id: flip2
      if: The possible-compromise concern were credibly resolved while replacement remained unavailable.
      then: O1
      why: Without the risk concern, the reason for restricting use would be materially weakened.
    would_not_change:
    - id: noflip1
      if: Immediate replacement remained unavailable.
      why: That constraint alone would not answer the separate concern that the materials might be compromised; limiting use
        pending replacement addresses both conditions.
    watch_for:
    - id: watch1
      what: Whether replacement materials become available.
      favors:
      - O1
      why: Replacement availability is the stated endpoint for the usage limit, although the subsequent course for the old
        materials is unspecified.
  lesson: When immediate replacement is not possible but compromise is considered possible, do not mistake operational dependence
    for a reason to permit unrestricted use. A warning and an interim usage limit can address the risk while replacement remains
    unavailable.
  limits: This reasoning applies to the stated interim decision, not to a case where compromise is confirmed, replacement
    is immediately available, or a binding rule specifies a different response. The likelihood assessment and operational
    impact needed to derive a more specific threshold are absent.
  library:
    domain: natsec-other
    family: CORPUS-NSA-PUEBLO
    source: https://media.defense.gov/2021/Jul/21/2002807762/-1/-1/0/ASSESSMENT_OF_THE_LOSS_OF_THE_USS_PUEBLO.PDF
    episode_focus: 'The decision was how to manage the risk while immediate replacement was not possible: permit ordinary
      use or warn holders and restrict use pending replacement. Exclude cryptographic implementation details.'
