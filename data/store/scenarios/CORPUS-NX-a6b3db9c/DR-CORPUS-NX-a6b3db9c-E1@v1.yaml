        O3: 17
      real_option: O2
      real_to_mean_other_length: 1.12
      real_is_longest: true
      moves:
        O1: act
        O2: act
        O3: partial
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
        O3: false
    equities: pilot2
