case:
  id: DR-CORPUS-NX-71bada4c-E3@v1
  title: Post-Kyushu Operations Decision
  status: draft
  setting: Japan and the Pacific, 1945–1946, U.S. military campaign planning.
  decider: The U.S. military leadership directing the campaign.
  agent: The U.S. military leadership directing the campaign
  agent_role: decide
  situation: An operation against southern Kyushu has been directed for about 1 November 1945, but no operation after it has
    been directed. Plans and preparations cover an invasion of the Tokyo Plain around 1 March 1946, while preparations also
    contemplate extending blockading positions to northwestern Kyushu. In the intervening period, blockade and air bombardment
    are to be intensified, but whether they can compel surrender is uncertain. Estimated casualties vary across the projected
    campaign sequences, and the time and losses of relying on isolation, blockade, and bombardment without invasion cannot
    be estimated. The available courses include a Tokyo-area invasion and a northwestern Kyushu alternative.
  question: What should the U.S. military leadership do about the operation following southern Kyushu while the results of
    blockade and bombardment remain uncertain?
  options:
    O1:
      do: The U.S. military leadership authorizes the Tokyo-area invasion for about 1 March 1946.
      move: act
      irreversible: true
    O2:
      do: The U.S. military leadership defers the choice and prepares Tokyo and northwestern Kyushu plans.
      move: hold
      irreversible: false
    O3:
      do: The U.S. military leadership declines the Tokyo-area invasion for about 1 March 1946.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: An operation against southern Kyushu was directed for about 1 November 1945, and no operation after it had yet been
      directed.
  - id: F2
    kind: situation
    status: confirmed
    fact: Plans and preparations covered an invasion of the Tokyo Plain about 1 March 1946.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The planned blockade and bombardment might achieve decisive results before the projected Tokyo-area invasion, but
      whether they could do so was uncertain.
  - id: F4
    kind: capability
    status: assessed
    fact: Extending blockading positions to northwestern Kyushu was identified as a possible course alongside preparing for
      the Tokyo-area invasion.
  - id: F5
    kind: capability
    status: assessed
    fact: After southern Kyushu, a northwestern Kyushu operation was estimated to require 12 divisions, or 510,000 men.
  - id: F6
    kind: situation
    status: assessed
    fact: Estimated U.S. casualties were 193,500 for southern Kyushu followed by the Tokyo Plain, 132,500 for southern Kyushu
      followed by northwestern Kyushu, and 220,000 for southern Kyushu, northwestern Kyushu, and then the Tokyo Plain.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The time and losses required to defeat Japan through isolation, blockade, and bombardment without invasion could
      not be estimated, and that course was assessed as likely to produce a long war.
  - id: F8
    kind: authority
    status: confirmed
    fact: The planned course made operations following southern Kyushu dependent on developments.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Blockade and bombardment might achieve decisive results before the planned Tokyo-area invasion, but that outcome
      is uncertain. The leadership therefore leaves the post-Kyushu decision open while exploiting those measures.
  - id: C2
    facts:
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Estimated casualties differ across the possible campaign sequences, and those estimates are uncertain. The stated
      principle is to limit casualties by ending the war early, using the fewest assault operations, and conducting land campaigns
      only in decisive areas; that uncertainty counsels against committing now to a fixed sequence.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Northwestern Kyushu remained a possible alternative, estimated to require 12 divisions. Its prospect of lower casualties
      depended on the gamble that the operation would bring about capitulation, supporting preservation of the alternative
      rather than choosing it in advance.
  - id: C4
    facts:
    - F2
    - F7
    equity: tempo
    favors:
    - O1
    - O2
    weight: strong
    why: The time and losses of defeating Japan through isolation, blockade, and bombardment without invasion could not be
      estimated, and that course was assessed as likely to prolong the war. This weighs against abandoning Tokyo preparations,
      while remaining consistent with deferring the final choice.
  reasoning:
    read: 'The decision is whether to preserve the ability to act after southern Kyushu, not whether to authorize the Tokyo
      invasion now. The trap is treating preparations for Tokyo as a final decision: the leadership had directed southern
      Kyushu but expressly left later operations to developments.'
    weighing: The leadership's balance favors {O2}. The possible decisive effect of blockade and bombardment remains uncertain
      {C1}; casualty estimates differ across sequences {C2}; and northwestern Kyushu is an alternative, but its lower-casualty
      prospect depends on the gamble that it will bring capitulation {C3}. Because relying on blockade and bombardment alone
      could mean a long war, Tokyo preparations should continue rather than be rejected {C4}. The choice depends on developments
      after southern Kyushu and on whether blockade and bombardment can achieve decisive results.
    tradecraft: Keep the Tokyo and northwestern Kyushu preparations distinct from an authorization to execute either operation.
      At the later decision point, record the developments assessed, the remaining uncertainty about blockade and bombardment,
      and how those assessments bear on the available campaign sequences.
    uncertainty: Blockade and bombardment may bring decisive results, but whether or when Japan will concede defeat cannot
      be predicted. Casualty estimates are not accurate predictions, and the time and losses of a blockade-and-bombardment
      strategy without invasion cannot be estimated.
    handoff: The decision remains with the U.S. military leadership directing the campaign. Operational developments after
      southern Kyushu and assessments bearing on the alternative plans should inform that decision. No separate approving
      authority is specified in the available decision frame.
    tempting_wrong:
      option: O1
      pull: Tokyo is described as a potentially decisive operation, and an extended blockade-only strategy could produce a
        long war.
      why_wrong: Those reasons support preparing for Tokyo, not authorizing it before the leadership has assessed developments
        after southern Kyushu and the effects of blockade and bombardment.
    rejected:
      O1: The leadership plans and prepares for Tokyo but does not authorize it as the post-Kyushu operation before developments
        can be assessed.
      O3: Declining Tokyo in advance would discard a prepared option despite uncertainty about whether blockade and bombardment
        will achieve decisive results and the risk of a prolonged war without invasion.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Tokyo-area invasion is not considered feasible and acceptable on the planned date.
      then: O3
      why: If the Tokyo invasion is not considered feasible and acceptable on the planned date, continued bombardment and
        blockade remain an open course.
    - id: flip2
      if: A northwestern Kyushu operation following southern Kyushu brings about Japanese capitulation.
      then: O3
      why: Capitulation following the northwestern Kyushu operation could avoid the Tokyo invasion; the estimated casualties
        for southern Kyushu followed by northwestern Kyushu are lower than for southern Kyushu followed by Tokyo.
    would_not_change:
    - id: noflip1
      if: The northwestern Kyushu alternative is available or has a lower casualty estimate when considered by itself.
      why: 'That alone does not resolve the gamble: if the operation does not bring capitulation, the Tokyo invasion might
        still be required.'
    watch_for:
    - id: watch1
      what: Whether Japanese resistance continues after the southern Kyushu operation.
      favors:
      - O1
      why: Continued resistance means plans must provide for further operations in the main islands and possibly on the mainland
        of Asia, weighing against declining the prepared Tokyo option outright.
  lesson: When a later operation has not been directed and the effectiveness of interim measures remains uncertain, preserve
    viable options and make the commitment contingent on developments. Preparation for a consequential course is not itself
    authorization to carry it out.
  limits: This reasoning addresses campaign planning under the specific uncertainties and casualty estimates described here;
    it does not establish that any particular operation would be lawful, feasible, or preferable under different facts. It
    does not decide how an operation should be conducted.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-71bada4c
    source: https://www.cia.gov/resources/csi/static/79ecaa39baaf7848137420add4281e4d/Documents-FinalMonths-of-WWII.pdf
    episode_focus: The memorandum says no post-Kyushu operation has yet been directed because the choice should await further
      developments, while planning proceeds for a Tokyo-area invasion and preparations also cover a northwestern Kyushu alternative.
      The stated uncertainty about whether blockade and bombardment could compel surrender, along with the differing possible
      casualty and timing consequences, provides the decision context; distinguish this deferral and contingency planning
      from a final decision to invade Tokyo.
