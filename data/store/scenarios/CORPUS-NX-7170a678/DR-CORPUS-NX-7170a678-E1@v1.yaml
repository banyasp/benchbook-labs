case:
  id: DR-CORPUS-NX-7170a678-E1@v1
  title: 'Flight 93: Responding to a Changed Danger Assessment'
  status: draft
  setting: Flight 93 during the 9/11 attacks; onboard the aircraft; passengers
  decider: The passengers on Flight 93
  agent: The passengers on Flight 93
  agent_role: decide
  situation: Passengers on Flight 93 had accounts of earlier hijackings in which hijackers were motivated to survive. The
    hijackings on the first three planes had succeeded at the World Trade Center and the Pentagon. Passengers on Flight 93
    quickly learned what had happened on those other flights. That knowledge changed their assessment of the danger posed
    by the hijackers. At the decision point, they faced a choice between using force against the hijackers and yielding to
    them.
  question: What should the passengers on Flight 93 do after learning what happened on the other three flights?
  options:
    O1:
      do: The passengers on Flight 93 yield to the hijackers without resistance.
      move: act
      irreversible: true
    O2:
      do: The passengers on Flight 93 resist the hijackers with force.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Accounts of earlier hijackings involved hijackers who were motivated to survive.
  - id: F2
    kind: situation
    status: confirmed
    fact: Passengers on the first three planes could be expected to remain seated based on those earlier accounts.
  - id: F3
    kind: situation
    status: confirmed
    fact: The hijackings on the first three planes succeeded at the World Trade Center and the Pentagon.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Passengers on Flight 93 quickly learned what had happened on the other three flights.
  - id: F5
    kind: situation
    status: assessed
    fact: Knowledge of the other flights changed the passengers' assessment of the danger posed by the hijackers.
  - id: F6
    kind: capability
    status: assessed
    fact: The passengers were able to use deliberate reasoning to overcome the availability bias associated with earlier hijacking
      accounts.
  - id: F7
    kind: situation
    status: confirmed
    fact: The decision concerned whether to use force to physically overpower the terrorists.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Earlier hijackings involving hijackers motivated to survive could make yielding seem safer; the source identifies
      reliance on those accounts as an availability-bias pull.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The successful attacks on the World Trade Center and the Pentagon changed what the hijacking meant for the passengers
      on Flight 93. They quickly learned what had happened and reassessed the danger, making the earlier expectation of a
      survivable hijacking less reliable.
  - id: C3
    facts:
    - F4
    - F6
    - F7
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The passengers could use deliberate reasoning to overcome the availability bias from earlier hijacking accounts and
      choose to resist with force.
  reasoning:
    read: The passengers had learned that the other hijackings had succeeded, changing their assessment of the danger. The
      trap was to let earlier accounts of hijackers motivated to survive dominate their judgment, as passengers on the first
      three planes could be expected to do.
    weighing: The earlier accounts provide a reason yielding could initially seem safer {C1}, but the successful attacks and
      the passengers’ new information changed the danger assessment {C2}. The source endorses deliberate reasoning that overcomes
      the availability bias and supports using force {C3}. The balance depends on taking the new information into account
      rather than treating earlier hijackings as a reliable guide to what would happen.
    tradecraft: At the decision level, distinguish the familiar precedent from the newly available facts, make the choice
      on the reassessed danger, and record the material information and rationale without adding unsupported claims.
    uncertainty: The passage gives no further detail about the passengers’ information or assessment beyond their quick knowledge
      of the other flights and their use of deliberate reasoning.
    handoff: The source identifies the passengers as the decision-makers and gives no higher authority or outside adviser
      to hand the choice to. This immediate decision should not be assigned to an authority the source does not identify.
    tempting_wrong:
      option: O1
      pull: Earlier accounts suggested hijackers were motivated to survive, making yielding seem like the familiar, safer
        response.
      why_wrong: That response relies on the availability bias the passengers overcame; it does not account for what they
        learned about the other three flights.
    rejected:
      O1: They did not yield because the successful attacks on the other flights changed their assessment of the danger and
        led them to use deliberate reasoning to resist.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The passengers had only the earlier accounts of survivable hijackings and had not learned what happened on the other
        flights.
      then: O1
      why: Without the new information that changed their danger assessment, the source’s stated basis for resisting would
        be absent and the earlier expectation could favor yielding. This is an authored counterfactual, not an outcome the
        source expressly endorses.
    would_not_change:
    - id: noflip1
      if: Earlier accounts of hijackers motivated to survive remained salient to the passengers.
      why: 'That familiar information alone would not displace the source’s rationale: deliberate reasoning can overcome the
        availability bias it creates.'
    watch_for:
    - id: watch1
      what: Whether new information about the outcome of the other flights changes the assessment formed from earlier hijacking
        accounts.
      favors:
      - O2
      why: The source identifies that new knowledge as the basis for the changed danger assessment and the deliberate decision
        to resist.
  lesson: Do not let a familiar precedent substitute for assessing materially changed circumstances. When new information
    changes the danger assessment, use deliberate reasoning to reassess the available choices rather than defaulting to the
    response that earlier examples made salient.
  limits: This reasoning addresses the passengers’ choice after learning what happened on the other flights; it does not establish
    a general rule to use force in other hijackings. The passage does not set out a legal standard, operational details, or
    a general assessment procedure.
