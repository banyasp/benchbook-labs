    source: https://www.cia.gov/resources/csi/static/d2f5d493048f8eb578bc2bc14520f06a/Thinking-Fast-and-Slow.pdf
    episode_focus: The decision point is the passengers’ choice to use force after learning what had happened on the other
      three flights; the source says that this knowledge changed their assessment of the danger. Include the choice and its
      stated rationale, but exclude any tactics or details about how they overpowered the hijackers.
