case:
  id: DR-CORPUS-NX-f9f82998-E1@v1
  title: Deterrence Policy in Western Europe
  status: draft
  setting: Early Cold War; Western Europe; U.S. and NATO policymakers.
  decider: U.S. policymakers
  agent: U.S. policymakers
  agent_role: decide
  situation: During the early Cold War, Soviet conventional forces were arrayed against Western Europe. The United States
    and its NATO allies were unwilling to match those forces. Policymakers generally preferred deterrence by denial, but matching
    the Soviet conventional forces was considered prohibitively expensive. Nuclear deterrence by punishment was available
    as an alternative to that conventional approach.
  question: What should U.S. policymakers do about deterring aggression against Western Europe during the early Cold War?
  options:
    O1:
      do: The U.S. policymakers adopt conventional deterrence by denial by matching Soviet conventional forces in Western
        Europe.
      move: act
      irreversible: false
    O2:
      do: The U.S. policymakers reject conventional deterrence by denial and rely on nuclear deterrence by punishment in Western
        Europe.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The period was the early stages of the Cold War.
  - id: F2
    kind: situation
    status: confirmed
    fact: Soviet conventional military forces were arrayed against Western Europe.
  - id: F3
    kind: capability
    status: assessed
    fact: The United States and its NATO allies were unwilling to match the Soviet conventional forces.
  - id: F4
    kind: situation
    status: assessed
    fact: Policymakers considered matching the Soviet forces through conventional means prohibitively expensive.
  - id: F5
    kind: situation
    status: assessed
    fact: Policymakers had an understandable preference for deterrence by denial.
  - id: F6
    kind: situation
    status: assessed
    fact: Deterrence by punishment using nuclear weapons was an alternative to matching Soviet conventional forces.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Policymakers had an understandable preference for deterrence by denial, but that preference was insufficient when
      circumstances made denial unrealistic.
  - id: C2
    facts:
    - F3
    - F4
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: The United States and its allies were unwilling to match Soviet conventional forces, and policymakers considered
      doing so prohibitively expensive; those constraints made denial unrealistic.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Nuclear deterrence by punishment was available as an alternative to the prohibitively expensive conventional approach,
      and the New Look policy is a classic example of that choice.
  reasoning:
    read: 'The issue is not whether denial was generally preferable: policymakers had an understandable preference for it.
      The trap is treating that preference as making denial realistic despite their unwillingness to match Soviet conventional
      forces and the prohibitive cost they assigned to doing so.'
    weighing: The preference for denial supports {O1} in principle {C1}, but circumstances can make denial unrealistic. Here,
      unwillingness to match Soviet forces and the prohibitive cost of doing so weigh strongly for {O2} {C2}; punishment was
      the available alternative, and the New Look is a classic example of that choice {C3}. The balance depends on whether
      conventional matching is a realistic, affordable option.
    tradecraft: 'Keep the choice at the policy level: record the preference for denial, the assessment that matching Soviet
      forces is prohibitively expensive, and why punishment is selected as the alternative. No implementation details are
      provided.'
    uncertainty: There are no cost figures, comparative assessment of deterrent effectiveness, or further account of the policymakers’
      deliberations. The stated reasons support punishment as an alternative under these constraints, not a detailed comparison
      of all consequences.
    handoff: The judgment is assigned to U.S. policymakers, with no additional approving office or required consultation identified;
      no further handoff can be attributed.
    tempting_wrong:
      option: O1
      pull: Deterrence by denial is identified as policymakers’ understandable preference.
      why_wrong: Circumstances can prevent denial from being realistic, and matching Soviet conventional forces was considered
        prohibitively expensive.
    rejected:
      O1: Conventional denial was not chosen because policymakers were unwilling to match Soviet forces and considered doing
        so prohibitively expensive.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Matching Soviet conventional forces became affordable and policymakers were willing to do so.
      then: O1
      why: The central constraint making denial unrealistic would no longer apply, allowing the stated preference for denial
        to govern the choice.
    would_not_change:
    - id: noflip1
      if: Policymakers continued to prefer deterrence by denial, but matching the Soviet forces remained prohibitively expensive
        and they remained unwilling to do it.
      why: Preference alone does not make denial realistic under these constraints.
    watch_for:
    - id: watch1
      what: A reassessment of whether matching Soviet conventional forces remains prohibitively expensive or whether policymakers
        remain unwilling to match them.
      favors:
      - O1
      why: A change in those constraints could make deterrence by denial a realistic option.
  lesson: A preferred strategy should not be treated as a practical option when the conditions needed to pursue it are absent
    or judged prohibitively costly. When denial is not realistic, punishment is an alternative; the choice should be revisited
    if those constraints change.
  limits: This reasoning addresses the early Cold War choice described here, not the legal or strategic merits of nuclear
    deterrence generally. It provides no detailed assessment of implementation, consequences, or other alternatives.
