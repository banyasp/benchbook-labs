case:
  id: DR-OHA-26-0163-revise1@v1
  title: DOE Access Authorization Restoration Decision [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, October 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual holds a DOE access authorization granted in September 2025 and had a CIA security clearance revoked
    in January 2026, which was reported to DOE through the Continuous Evaluation Program. The Local Security Office issued
    a Notification Letter citing substantial doubt under Guidelines E (personal conduct), D (sexual behavior), J (criminal
    conduct), and B (foreign influence) because the Individual disclosed paid sexual encounters in Panama, Costa Rica, and
    U.S. massage parlors. The Individual did not report the CIA clearance revocation to his employer and provided mitigation
    evidence including marriage counseling, individual therapy, and community service. The LSO concluded that concerns under
    Guidelines E, D, and J remain unresolved, while the concern under Guideline B is mitigated. The regulatory framework presumes
    against granting or restoring a clearance absent clear evidence of eligibility.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further investigation.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge partially restores the Individual’s access authorization.
      move: partial
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was granted a DOE access authorization in September 2025.
  - id: F2
    kind: situation
    status: confirmed
    fact: The CIA revoked the Individual’s security clearance in January 2026 and notified DOE via the Continuous Evaluation
      Program.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter raising substantial doubt under Guidelines E, D, J, and B
      because of the Individual’s sexual conduct.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual disclosed paying for sexual intercourse in Panama (2021, 2022) and Costa Rica (2025) and engaging
      in sexual acts with massage‑parlor employees in the United States (2023, 2024).
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual did not inform his DOE contractor employer of the CIA clearance revocation.
  - id: F6
    kind: situation
    status: assessed
    fact: The Individual sought marriage counseling, individual therapy for sexual‑addiction issues, and provided documentation
      of community service.
  - id: F7
    kind: situation
    status: assessed
    fact: The LSO concluded that security concerns under Guidelines E, D, and J remain unresolved, while the concern under
      Guideline B is resolved.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations presume against granting or restoring a security clearance unless the individual demonstrates eligibility
      consistent with the national interest.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The guideline-E concern remains, but the reduced weight reflects that mitigation evidence now partially offsets the
      seriousness of the conduct.
  - id: C2
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The potential criminal aspect of the conduct is still unresolved, yet the lower weight acknowledges the Individual's
      ongoing therapy and lack of a conviction.
  - id: C3
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: Guideline-D concerns are not fully cleared, but the recent counseling lessens the perceived coercion risk, so the
      consideration is downgraded.
  - id: C4
    facts:
    - F1
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The presumption against restoration still applies, but it is not decisive when a strong mitigation factor is present.
  - id: C5
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Individual's documented counseling, therapy for sexual-addiction, and community service satisfy partial-mitigation
      criteria, justifying limited access while unresolved concerns persist.
  - id: C6
    facts:
    - F6
    - F7
    equity: partial_restoration
    favors:
    - O4
    weight: strong
    why: Mitigation under Guideline D is partially satisfied, allowing a limited restoration that balances national-security
      risk with the Individual's demonstrated rehabilitation.
  reasoning:
    read: The LSO left Guidelines E, D, and J unresolved, but resolved Guideline B. The Individual has pursued extensive therapy
      and community service, and the resolved foreign-influence concern removes the most serious national-security risk.
    weighing: Because C5 now carries strong weight in favor of partial restoration and the new consideration C6 also strongly
      supports O4, the balance shifts away from a total denial. The weakened weights of C1-C4 no longer outweigh the combined
      mitigation factors.
    tradecraft: The Administrative Judge issues a decision that partially restores the access authorization, specifying the
      classes of information the Individual may access and the conditions for continued monitoring.
    uncertainty: Future compliance with counseling and the possibility of re-offense remain uncertain, but the partial restoration
      includes periodic re-evaluation to manage that risk.
    handoff: The Judge's decision is final within OHA, subject only to appeal under 10 C.F.R. § 710.28; no further agency
      review is required unless the Individual appeals.
    tempting_wrong:
      option: O1
      pull: The Individual's professional record and ongoing therapy suggest a low likelihood of future misconduct.
      why_wrong: Full restoration would ignore the still-unresolved Guideline E and J concerns, which the regulations require
        to be cleared before a complete clearance can be granted.
    rejected:
      O1: Unresolved Guideline E and J concerns preclude a full restoration despite mitigation.
      O2: The record already contains sufficient evidence for a decision; further investigation would be unnecessary.
      O3: Partial restoration is permissible because mitigation satisfies enough criteria to offset the remaining concerns.
  verdict:
    choice: O4
    basis: recommended
    decisive:
    - C5
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had provided prompt, good-faith efforts to correct the omission before being confronted, satisfying
        Guideline E mitigating condition (a).
      then: O1
      why: Guideline E would be mitigated, removing one of the three unresolved concerns and supporting full restoration.
    - id: flip2
      if: Reliable evidence showed the Individual did not commit any criminal act, satisfying Guideline J mitigating condition
        (c).
      then: O3
      why: Removing the criminal-conduct concern still leaves E and D unresolved, so the Judge would deny full restoration
        but could consider partial restoration.
    would_not_change:
    - id: noflip1
      if: Guideline B remains mitigated but the other three guidelines stay unresolved.
      why: The denial stands because all unresolved concerns must be cleared before a clearance can be restored.
    watch_for:
    - id: watch1
      what: Additional documented rehabilitation (e.g., extended therapy, proven behavioral change) that satisfies Guideline
        D mitigating condition (e).
      favors:
      - O4
      why: If the Individual can demonstrate that the behavior is unlikely to recur, a limited restoration might become permissible.
  lesson: When mitigation evidence satisfies partial-mitigation criteria, DOE adjudicators may grant a limited restoration
    even if some guideline concerns remain unresolved, provided the presumption against restoration is outweighed by strong
    rehabilitative factors.
  limits: This analysis applies only to personnel-security eligibility determinations under DOE Part 710 and does not extend
    to criminal prosecution or to agencies with different adjudicative frameworks.
