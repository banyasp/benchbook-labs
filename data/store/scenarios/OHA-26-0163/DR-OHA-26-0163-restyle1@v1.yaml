case:
  id: DR-OHA-26-0163-restyle1@v1
  title: DOE Access Authorization Restoration Decision [restyle]
  status: needs_review
  setting: Office of the Energy Security Review Board, November 2026
  decider: Senior Review Officer
  agent: Senior Review Officer
  agent_role: decide
  situation: The employee holds a DOE access authorization issued in September 2025 and had a CIA security clearance rescinded
    in January 2026, which was reported to DOE through the Continuous Evaluation System. The Security Review Office sent a
    Notice Letter citing substantial doubt under Criteria E (personal conduct), D (sexual behavior), J (criminal conduct),
    and B (foreign influence) because the employee disclosed compensated sexual encounters in Panama, Costa Rica, and U.S.
    massage establishments. The employee failed to disclose the CIA clearance rescission to his contractor and submitted mitigation
    evidence including marital counseling, individual therapy, and community service. The Review Office concluded that concerns
    under Criteria E, D, and J remain unresolved, while the concern under Criterion B is mitigated. The regulatory framework
    presumes against granting or reinstating a clearance absent clear evidence of eligibility.
  question: What action should the Senior Review Officer take regarding the employee's DOE access authorization?
  options:
    O1:
      do: The Senior Review Officer reinstates the employee's DOE access authorization.
      move: act
      irreversible: true
    O2:
      do: The Senior Review Officer suspends the decision pending additional investigation.
      move: hold
      irreversible: false
    O3:
      do: The Senior Review Officer denies reinstatement of the employee's DOE access authorization.
      move: act
      irreversible: true
    O4:
      do: The Senior Review Officer partially reinstates the employee's DOE access authorization.
      move: partial
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee received a DOE access authorization in September 2025.
  - id: F2
    kind: situation
    status: confirmed
    fact: The CIA rescinded the employee's security clearance in January 2026 and communicated the action to DOE through the
      Continuous Evaluation System.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Security Review Office issued a Notice Letter raising substantial doubt under Criteria E, D, J, and B due to
      the employee's sexual conduct.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee reported paying for sexual intercourse in Panama (2021, 2022) and Costa Rica (2025) and engaging in
      sexual activity with staff at U.S. massage establishments (2023, 2024).
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee did not inform his DOE contractor of the CIA clearance rescission.
  - id: F6
    kind: situation
    status: assessed
    fact: The employee pursued marital counseling, individual therapy for sexual-addiction issues, and supplied records of
      community service.
  - id: F7
    kind: situation
    status: assessed
    fact: The Review Office determined that security concerns under Criteria E, D, and J remain unresolved, whereas the concern
      under Criterion B is resolved.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations presume against granting or reinstating a security clearance unless the individual demonstrates
      eligibility consistent with the national interest.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Officer determined that none of the mitigating conditions for Criterion E (personal conduct) were satisfied,
      leaving substantial doubt about the employee's reliability and trustworthiness.
  - id: C2
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Officer found that no mitigating condition for Criterion J (criminal conduct) applied; the behavior could be
      criminal and was repeated, so the security concern persists.
  - id: C3
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Criterion D (sexual behavior) was not mitigated because the conduct was recent, not discreet, and still poses a risk
      of coercion or exploitation.
  - id: C4
    facts:
    - F1
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: DOE regulations impose a presumption against granting or reinstating a clearance absent clear evidence of eligibility
      consistent with the national interest.
  - id: C5
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O3
    weight: weak
    why: Although the employee provided counseling and community service, the Officer judged these measures insufficient to
      overcome the unresolved concerns under Criteria E, J, and D.
  reasoning:
    read: The employee's sexual conduct—both overseas and in U.S. massage establishments—generated substantial-doubt findings
      under Criteria E, D, J, and B. The Review Office resolved the foreign-influence issue (Criterion B) but left the other
      three outstanding. The Officer applied the Adjudicative Guidelines and the presumption against reinstatement to assess
      eligibility.
    weighing: The Officer weighed each criterion separately. For Criterion E, no mitigating condition (prompt good-faith correction,
      minor conduct, etc.) applied (p7.5-p7.12). For Criterion J, the conduct was recent, repeated, and potentially criminal,
      so none of its mitigating factors (time elapsed, coercion, lack of evidence, rehabilitation) applied (p9.5-p10.4). For
      Criterion D, the conduct was not adolescent, not infrequent, and still vulnerable to exploitation, so none of its mitigating
      factors applied (p10.6-p11.8). Because the regulations require that all substantial-doubt concerns be resolved before
      a clearance can be reinstated, the unresolved E, J, and D concerns outweigh the resolved B concern, leading to denial.
    tradecraft: The determination is documented in the Senior Review Officer's formal Decision, signed and dated, and the
      employee is notified of the denial and his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty lies in the future effectiveness of the employee's counseling and any additional
      evidence of rehabilitation, which the Officer found insufficient at this time.
    handoff: The Senior Review Officer decides unilaterally, as the OHA proceeding is a single-office adjudicative process;
      no further agency review is required unless the employee appeals.
    tempting_wrong:
      option: O1
      pull: The employee's extensive professional record and recent counseling might suggest a low likelihood of future misconduct.
      why_wrong: Even with a strong career history, the unresolved Criterion E, J, and D concerns constitute a statutory barrier
        to reinstatement; granting would violate the presumption against clearance.
    rejected:
      O1: The unresolved security concerns under Criteria E, J, and D preclude reinstatement despite the employee's professional
        experience.
      O2: The record is complete; further investigation is unnecessary because the Officer has already applied the relevant
        guidelines.
      O4: Partial reinstatement would still provide the employee with access despite unresolved concerns; the regulations
        require all concerns be resolved.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had offered prompt, good-faith disclosure to correct the omission before being confronted, satisfying
        Criterion E mitigating condition (a).
      then: O1
      why: Criterion E would be mitigated, removing one of the three unresolved concerns.
    - id: flip2
      if: Credible evidence demonstrated that the employee did not engage in any criminal conduct, satisfying Criterion J
        mitigating condition (c).
      then: O1
      why: Criterion J would be mitigated, leaving only Criterion E and D concerns.
    would_not_change:
    - id: noflip1
      if: Criterion B remains mitigated but the other three criteria stay unresolved.
      why: The denial stands because all unresolved concerns must be cleared before reinstatement.
    watch_for:
    - id: watch1
      what: Additional documented rehabilitation (e.g., extended therapy, verified behavioral change) that satisfies Criterion
        D mitigating condition (e).
      favors:
      - O4
      why: If the employee can demonstrate that the behavior is unlikely to recur, a limited reinstatement might become permissible.
  lesson: Under DOE Part 710, any unresolved security concern under the Adjudicative Guidelines blocks clearance reinstatement;
    mitigation must meet the specific conditions enumerated in the guidelines. A strong professional record does not outweigh
    the statutory presumption against granting a clearance when substantive doubts remain.
  limits: This analysis is limited to personnel-security eligibility determinations under DOE Part 710 and does not extend
    to criminal prosecution or to agencies employing different adjudicative frameworks.
