case:
  id: DR-OHA-26-0163@v1
  title: DOE Access Authorization Restoration Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, October 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual holds a DOE access authorization granted in September 2025 and had a CIA security clearance revoked
    in January 2026, which was reported to DOE through the Continuous Evaluation Program. The Local Security Office issued
    a Notification Letter citing substantial doubt under Guidelines E (personal conduct), D (sexual behavior), J (criminal
    conduct), and B (foreign influence) because the Individual disclosed paid sexual encounters in Panama, Costa Rica, and
    U.S. massage parlors. The Individual did not report the CIA clearance revocation to his employer and provided mitigation
    evidence including marriage counseling, individual therapy, and community service. The LSO concluded that concerns under
    Guidelines E, D, and J remain unresolved, while the concern under Guideline B is mitigated. The regulatory framework presumes
    against granting or restoring a clearance absent clear evidence of eligibility.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further investigation.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge partially restores the Individual’s access authorization.
      move: partial
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was granted a DOE access authorization in September 2025.
  - id: F2
    kind: situation
    status: confirmed
    fact: The CIA revoked the Individual’s security clearance in January 2026 and notified DOE via the Continuous Evaluation
      Program.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter raising substantial doubt under Guidelines E, D, J, and B
      because of the Individual’s sexual conduct.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual disclosed paying for sexual intercourse in Panama (2021, 2022) and Costa Rica (2025) and engaging
      in sexual acts with massage‑parlor employees in the United States (2023, 2024).
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual did not inform his DOE contractor employer of the CIA clearance revocation.
  - id: F6
    kind: situation
    status: assessed
    fact: The Individual sought marriage counseling, individual therapy for sexual‑addiction issues, and provided documentation
      of community service.
  - id: F7
    kind: situation
    status: assessed
    fact: The LSO concluded that security concerns under Guidelines E, D, and J remain unresolved, while the concern under
      Guideline B is resolved.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations presume against granting or restoring a security clearance unless the individual demonstrates eligibility
      consistent with the national interest.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Judge found that none of the mitigating conditions for Guideline E (personal conduct) applied, leaving substantial
      doubt about the Individual’s reliability and trustworthiness.
  - id: C2
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Judge concluded that no mitigating condition for Guideline J (criminal conduct) was satisfied; the conduct could
      be criminal and recurred, so the security concern remains.
  - id: C3
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Guideline D (sexual behavior) was not mitigated because the conduct was recent, not discreet, and still creates a
      potential for coercion or exploitation.
  - id: C4
    facts:
    - F1
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: DOE regulations impose a presumption against granting or restoring a clearance absent clear evidence of eligibility
      consistent with the national interest.
  - id: C5
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O3
    weight: weak
    why: Although the Individual provided counseling and community service, the Judge found these efforts insufficient to
      overcome the unresolved concerns under Guidelines E, J, and D.
  reasoning:
    read: The Individual’s sexual conduct—both abroad and in U.S. massage parlors—triggered substantial‑doubt findings under
      Guidelines E, D, J, and B. The LSO resolved the foreign‑influence concern (Guideline B) but left the other three unresolved.
      The Judge applied the Adjudicative Guidelines and the presumption against restoration to determine eligibility.
    weighing: The Judge weighed each guideline separately. For Guideline E, no mitigating condition (prompt good‑faith correction,
      minor conduct, etc.) applied (p7.5‑p7.12). For Guideline J, the conduct was recent, repeated, and potentially criminal,
      so none of its mitigating factors (time elapsed, coercion, lack of evidence, rehabilitation) applied (p9.5‑p10.4). For
      Guideline D, the conduct was not adolescent, not infrequent, and still vulnerable to exploitation, so none of its mitigating
      factors applied (p10.6‑p11.8). Because the regulations require that all substantial‑doubt concerns be resolved before
      a clearance can be restored, the unresolved E, J, and D concerns outweigh the resolved B concern, leading to denial.
    tradecraft: The decision is recorded in the Administrative Judge’s formal Decision, signed and dated, and the Individual
      is notified of the denial and his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty lies in the future effectiveness of the Individual’s counseling and any additional
      evidence of rehabilitation, which the Judge found insufficient at this time.
    handoff: The Administrative Judge decides alone, as the OHA proceeding is a single‑office adjudicative process; no further
      agency review is required unless the Individual appeals.
    tempting_wrong:
      option: O1
      pull: The Individual’s extensive professional background and recent counseling might suggest a low risk of future misconduct.
      why_wrong: Even with a strong career record, the unresolved Guideline E, J, and D concerns constitute a statutory barrier
        to restoration; granting would contravene the presumption against clearance.
    rejected:
      O1: The unresolved security concerns under Guidelines E, J, and D preclude restoration despite the Individual’s professional
        experience.
      O2: The record is complete; further investigation is unnecessary because the Judge has already applied the relevant
        guidelines.
      O4: Partial restoration would still leave the individual with access despite unresolved concerns; the regulations require
        all concerns be resolved.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had provided prompt, good‑faith efforts to correct the omission before being confronted, satisfying
        Guideline E mitigating condition (a).
      then: O1
      why: Guideline E would be mitigated, removing one of the three unresolved concerns.
    - id: flip2
      if: Reliable evidence showed the Individual did not commit any criminal act, satisfying Guideline J mitigating condition
        (c).
      then: O1
      why: Guideline J would be mitigated, leaving only Guideline E and D concerns.
    would_not_change:
    - id: noflip1
      if: Guideline B remains mitigated but the other three guidelines stay unresolved.
      why: The denial stands because all unresolved concerns must be cleared before restoration.
    watch_for:
    - id: watch1
      what: Additional documented rehabilitation (e.g., extended therapy, proven behavioral change) that satisfies Guideline D
        mitigating condition (e).
      favors:
      - O4
      why: If the Individual can demonstrate that the behavior is unlikely to recur, a limited restoration might become permissible.
  lesson: Under DOE Part 710, any unresolved security concern under the Adjudicative Guidelines blocks clearance restoration;
    mitigation must meet the specific conditions enumerated in the guidelines. A strong professional record does not outweigh
    statutory presumption against granting a clearance when substantive doubts remain.
  limits: This analysis applies only to personnel‑security eligibility determinations under DOE Part 710 and does not extend
    to criminal prosecution or to agencies with different adjudicative frameworks.
