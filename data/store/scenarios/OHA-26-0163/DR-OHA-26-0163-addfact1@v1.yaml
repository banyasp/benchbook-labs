case:
  id: DR-OHA-26-0163-addfact1@v1
  title: DOE Access Authorization Restoration Decision [addfact]
  status: needs_review
  setting: DOE Office of Hearings & Appeals, October 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Individual's spouse works as a civilian analyst with the National Oceanic and Atmospheric Administration.
    In September 2025, the Individual received a DOE access authorization. The CIA terminated the Individual's security clearance
    in January 2026 and reported the action to DOE through the Continuous Evaluation Program. Following that, the Local Security
    Office sent a Notification Letter that raised substantial doubt under Guidelines E (personal conduct), D (sexual behavior),
    J (criminal conduct), and B (foreign influence) because the Individual admitted to purchasing sexual services in Panama
    during 2021-2022, in Costa Rica in 2025, and to having sexual encounters with U.S. massage-parlor workers in 2023-2024.
    The Individual failed to disclose the CIA clearance revocation to his DOE contractor employer. He pursued marriage counseling,
    individual therapy for sexual-addiction concerns, and submitted records of community-service participation. The LSO determined
    that issues under Guidelines E, D, and J remain unaddressed, whereas the matter under Guideline B is considered mitigated.
    DOE policy presumes against granting or reinstating a clearance unless the individual can show eligibility aligned with
    the national interest.
  question: What ruling should the Administrative Law Judge issue regarding the Individual's access authorization?
  options:
    O1:
      do: Restore the Individual's access authorization in full.
      move: act
      irreversible: true
    O2:
      do: Place the decision on hold pending additional investigation.
      move: hold
      irreversible: false
    O3:
      do: Denial of any restoration of the Individual's access authorization.
      move: act
      irreversible: true
    O4:
      do: Grant a partial restoration of the Individual's access authorization.
      move: partial
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual's spouse works as a civilian analyst with the National Oceanic and Atmospheric Administration.
  - id: F2
    kind: situation
    status: confirmed
    fact: In September 2025, the Individual received a DOE access authorization.
  - id: F3
    kind: situation
    status: confirmed
    fact: The CIA terminated the Individual's security clearance in January 2026 and reported the action to DOE through the
      Continuous Evaluation Program.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office sent a Notification Letter that raised substantial doubt under Guidelines E, D, J, and
      B due to the Individual's sexual behavior.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual admitted to purchasing sexual services in Panama during 2021-2022, in Costa Rica in 2025, and to
      having sexual encounters with U.S. massage-parlor workers in 2023-2024.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual failed to disclose the CIA clearance revocation to his DOE contractor employer.
  - id: F7
    kind: situation
    status: assessed
    fact: He pursued marriage counseling, individual therapy for sexual-addiction concerns, and submitted records of community-service
      participation.
  - id: F8
    kind: situation
    status: assessed
    fact: The LSO determined that issues under Guidelines E, D, and J remain unaddressed, whereas the matter under Guideline
      B is considered mitigated.
  - id: F9
    kind: authority
    status: confirmed
    fact: DOE policy presumes against granting or reinstating a clearance unless the individual can show eligibility aligned
      with the national interest.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Judge determined that no mitigating circumstance for Guideline E (personal conduct) exists, so the Individual's
      reliability remains in serious doubt.
  - id: C2
    facts:
    - F4
    - F5
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: No mitigating factor for Guideline J (criminal conduct) applies; the conduct could be illegal and was repeated, sustaining
      the security concern.
  - id: C3
    facts:
    - F4
    - F5
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Guideline D (sexual behavior) remains unmitigated because the conduct was recent, public, and still creates a coercion
      risk.
  - id: C4
    facts:
    - F2
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: DOE policy imposes a presumption against restoration absent clear evidence of eligibility aligned with the national
      interest.
  - id: C5
    facts:
    - F7
    - F8
    equity: due_process
    favors:
    - O3
    weight: weak
    why: Although the Individual has engaged in counseling and community service, those steps are insufficient to overcome
      the unresolved concerns under Guidelines E, J, and D.
  reasoning:
    read: The Individual's pattern of purchasing sexual services abroad and in U.S. massage parlors generated substantial-doubt
      findings under Guidelines E, D, J, and B. The LSO resolved the foreign-influence issue (Guideline B) but left the other
      three unresolved. The Judge applied the Adjudicative Guidelines and the statutory presumption against restoration, concluding
      that eligibility is not demonstrated.
    weighing: Each guideline was evaluated independently. For Guideline E, no mitigating condition—such as prompt, good-faith
      correction—was satisfied. For Guideline J, the conduct was recent, repeated, and potentially criminal, so no mitigating
      factor applied. For Guideline D, the behavior was neither adolescent nor infrequent, leaving a coercion risk. Because
      DOE regulations require all substantial-doubt concerns to be cleared before a clearance can be restored, the unresolved
      E, J, and D concerns outweigh the mitigated B concern, resulting in denial.
    tradecraft: The Administrative Law Judge issues a formal Decision, signs and dates it, and notifies the Individual of
      the denial and his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The principal uncertainty concerns whether future therapeutic progress could satisfy Guideline D mitigating
      criteria; the record presently does not demonstrate that.
    handoff: The Administrative Law Judge acts as the sole decision-maker in this OHA proceeding; no additional agency review
      is required unless the Individual files an appeal.
    tempting_wrong:
      option: O1
      pull: The Individual's professional background and recent counseling might suggest a low risk of future misconduct.
      why_wrong: Even with a solid career record, the unresolved concerns under Guidelines E, J, and D constitute a statutory
        barrier; granting restoration would violate the presumption against clearance.
    rejected:
      O1: Unresolved security concerns under Guidelines E, J, and D preclude any full restoration despite the Individual's
        career merits.
      O2: The record already contains all required evidence; further investigation would not change the substantive findings.
      O4: Partial restoration would still permit access while the three unresolved concerns remain, which the regulations
        forbid.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had promptly disclosed the CIA revocation and taken corrective action before the LSO's inquiry, satisfying
        Guideline E's good-faith mitigation condition.
      then: O1
      why: Mitigating Guideline E would remove one of the three outstanding concerns, opening the path to restoration.
    - id: flip2
      if: Reliable evidence demonstrated that the Individual never engaged in criminal conduct, satisfying Guideline J's mitigation
        requirement.
      then: O1
      why: Eliminating the criminal-conduct concern would leave only Guideline E and D unresolved.
    would_not_change:
    - id: noflip1
      if: Guideline B stays mitigated while Guidelines E, D, and J remain unresolved.
      why: Denial persists because all unresolved concerns must be cleared before any restoration.
    watch_for:
    - id: watch1
      what: Documented, sustained rehabilitation—such as extended therapy and verified behavioral change—that satisfies Guideline
        D's mitigation condition.
      favors:
      - O4
      why: If the Individual can prove that the risky sexual behavior is unlikely to recur, a limited restoration could become
        permissible.
  lesson: Under DOE Part 710, any unresolved security concern identified by the Adjudicative Guidelines blocks clearance restoration;
    mitigation must meet the specific conditions enumerated in each guideline. A strong professional record or personal rehabilitation
    does not outweigh the statutory presumption against granting a clearance when substantive doubts remain.
  limits: This analysis is confined to personnel-security eligibility determinations under DOE Part 710 and does not address
    criminal prosecution, civil liability, or adjudicative frameworks used by other agencies.
