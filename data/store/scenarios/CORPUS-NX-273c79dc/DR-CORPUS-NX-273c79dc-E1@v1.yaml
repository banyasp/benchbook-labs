case:
  id: DR-CORPUS-NX-273c79dc-E1@v1
  title: Setting the Air Campaign’s Target Priorities
  status: draft
  setting: London, 1943, the loose-knit target team of the air forces, the British Air and Economic Warfare ministries, and
    EOU.
  decider: The London target team
  agent: The London target team
  agent_role: decide
  situation: The London target team was considering how to align the air campaign’s target-system priorities with its aims
    and operational capabilities. The submarine problem was being dealt with effectively at sea, while attacks on submarine
    production and bases were assessed as making no significant contribution to antisubmarine warfare. Single-engine fighters
    were assessed as central to German daylight air supremacy and as a principal opponent of the daylight bomber force. The
    team considered ball bearings as a possible way to affect German war production more broadly, although planners expected
    Germany could protect fighter production from a bearing shortage. Serious attacks on transport and oil were assessed to
    exceed the air forces’ 1943 capabilities, while compact synthetic rubber, tire, and motor transport systems were identified
    as possible secondary targets.
  question: What should the London target team do about the air campaign’s target-system priorities?
  options:
    O1:
      do: The London target team limits the revision, lowering submarine-yard priority, focusing aircraft production on single-engine
        fighters, adding ball bearings, and retaining transport and oil in current priorities.
      move: partial
      irreversible: false
    O2:
      do: The London target team rejects the proposed priority revision, retaining submarine yards and the broader aircraft
        industry, excluding ball bearings, and keeping transport and oil in current priorities.
      move: act
      irreversible: false
    O3:
      do: The London target team approves the proposed priority revision, lowering submarine-yard priority, focusing aircraft
        production on single-engine fighters, adding ball bearings, and dropping transport and oil.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The target team in London included representatives of the air forces and the British Air and Economic Warfare ministries,
      as well as EOU.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The submarine problem had been dealt with effectively at sea from the spring of 1943.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Attacks on submarine production and bases were making no significant contribution to antisubmarine warfare.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The single-engine fighter was assessed as Germany’s principal hope for maintaining daylight air supremacy and effective
      close support, as a principal opponent of the daylight bomber force, and as a sector with steadily rising production.
  - id: F5
    kind: situation
    status: assessed
    fact: The contemplated attack on aircraft production was conceived as defensive, intended to create conditions favorable
      to later offensive actions.
  - id: F6
    kind: capability
    status: assessed
    fact: Among the industries examined, the ball-bearing industry appeared to offer an economical and operationally feasible
      way for air attack to affect German war production broadly.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Planners expected Germany could protect fighter production from a ball-bearing shortage, particularly because a
      direct attack on fighter production would reduce demand for aircraft bearings.
  - id: F8
    kind: capability
    status: assessed
    fact: Serious attacks on the German transport system or oil production involved hundreds of targets and were assessed
      as beyond the air forces’ capabilities in 1943.
  - id: F9
    kind: capability
    status: assessed
    fact: The compact synthetic rubber system and major tire and motor transport plants were suggested as possible secondary
      targets, with relatively few attacks potentially proving militarily significant.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: strong
    why: The submarine problem was being handled effectively at sea, and attacks on submarine production and bases were making
      no significant contribution to antisubmarine warfare; keeping them at top priority would not serve the campaign's assessed
      purpose.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: strong
    why: Single-engine fighters were a principal threat to the daylight bomber force, central to German daylight air supremacy
      and close support, and in rising production. Narrowing aircraft production attacks to this sector was viewed as a defensive
      step to enable later offensive action.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: weak
    why: 'Ball bearings appeared to offer an economical, operationally feasible way to affect German war production broadly.
      Their value was not that they were expected to cripple fighter production: planners expected Germany could protect that
      production, especially as direct fighter-production attacks reduced aircraft-bearing demand.'
  - id: C4
    facts:
    - F8
    equity: resource_stewardship
    favors:
    - O3
    weight: strong
    why: Serious attacks on transport or oil would involve hundreds of targets and were assessed as beyond the air forces'
      1943 capabilities, supporting their removal from current priorities.
  - id: C5
    facts:
    - F9
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: If secondary targets were needed for operational reasons, compact synthetic rubber, tire, and motor transport systems
      offered alternatives where relatively few attacks might prove militarily significant.
  reasoning:
    read: 'The choice is about matching target-system priorities to the campaign''s aims and 1943 capabilities. The trap is
      to treat ball bearings merely as an adjunct to fighter production: planners expected Germany could shield fighter production
      from a bearing shortage, while valuing bearings as a separate means of affecting war production broadly {C3}.'
    weighing: The team favored removing submarine yards from top priority because sea operations were addressing the submarine
      problem and the bombing was not contributing significantly {C1}. It focused aircraft production on single-engine fighters
      because they threatened the bomber force and German daylight air supremacy, while treating that focus as preparation
      for later offensive action {C2}. It added ball bearings for their broader, feasible industrial effect, not because planners
      expected them to stop fighter production {C3}. Finally, it dropped transport and oil from current priorities because
      serious attacks exceeded available 1943 capabilities {C4}. The balance depends on the assessed strategic importance
      of these systems and the force's ability to affect them; secondary targets could still be considered where a compact
      system offered a plausible military effect {C5}.
    tradecraft: Record the priority decision by target system, the assessed purpose and capability basis for each change,
      and the distinction between the fighter-production rationale and the broader ball-bearing rationale. Keep current priorities
      distinct from any secondary-target list.
    uncertainty: The planning account notes that many in the air forces may not have understood the ball-bearing rationale
      and that the link between ball bearings and single-engine fighters could reflect effective salesmanship rather than
      clear thinking. It also records an expectation, not a demonstrated outcome, that Germany could protect fighter production
      from bearing shortages.
    handoff: The London target team should make and explain the priority choice with the air-force representatives, the British
      Air and Economic Warfare ministries, and EOU involved, since the decision joins operational capability and economic-warfare
      judgments.
    tempting_wrong:
      option: O1
      pull: It makes the submarine, aircraft, and ball-bearing adjustments while appearing to preserve flexibility by retaining
        transport and oil.
      why_wrong: Retaining transport and oil in current priorities conflicts with the assessment that serious attacks on those
        systems were beyond 1943 capabilities {C4}.
    rejected:
      O1: It makes most of the supported revisions but retains transport and oil in current priorities despite the assessment
        that serious attacks on them exceeded 1943 capabilities {C4}.
      O2: It preserves priorities that were assessed as ineffective against the submarine problem, too broad for the aircraft
        rationale, and beyond the force's capability for transport and oil, while foregoing the feasible broad-production
        option of ball bearings {C1} {C2} {C3} {C4}.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The serious transport and oil target systems became within the air forces' capabilities for the relevant campaign
        period.
      then: O1
      why: The principal stated reason for dropping those systems was that serious attacks on them exceeded 1943 capabilities;
        if that constraint changed, retaining them in current priorities would be more defensible.
    would_not_change:
    - id: noflip1
      if: The ball-bearing program were not expected to impair fighter production because Germany could protect that sector.
      why: That expectation did not defeat the case for adding ball bearings, whose stated value was the potential to affect
        German war production broadly.
    watch_for:
    - id: watch1
      what: Whether secondary targeting is needed for operational reasons and whether the compact synthetic rubber system
        or major tire and motor transport plants could yield military significance from relatively few attacks.
      favors:
      - O3
      why: These were suggested as possible secondary targets without restoring transport or oil as broad current priorities.
  lesson: 'Set priorities where the campaign''s purpose and actual capabilities intersect, rather than preserving target systems
    because they appear strategically important in the abstract. Keep distinct rationales distinct: a target system may matter
    for broad production effects even when it is not expected to disrupt a particular sector.'
  limits: This reasoning concerns the London team's 1943 target-system priorities and the capabilities and assessments described
    for that decision. It does not establish the later effectiveness of the chosen priorities or address operational methods
    for attacking targets.
