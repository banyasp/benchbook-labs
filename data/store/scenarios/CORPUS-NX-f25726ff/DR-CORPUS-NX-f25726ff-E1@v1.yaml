case:
  id: DR-CORPUS-NX-f25726ff-E1@v1
  title: Support for China and Service Restrictions
  status: draft
  setting: Washington, April 1941, U.S. administration
  decider: The President
  agent: The President
  agent_role: decide
  situation: China sought U.S. support while the United States was not yet at war with Japan. The proposed AVG was organized
    as a unit of the Chinese Air Force, and the plan had shifted to protecting the Burma Road with American pilots and fighters.
    U.S. law barred American citizens from serving in the armed services of a belligerent foreign power. The proposed personnel
    arrangement relied on a civilian entity hiring the personnel rather than the Chinese government. The arrangement was not
    considered something that could be done openly.
  question: What should the President do about permitting U.S. military reserve officers and active-duty enlisted personnel
    to resign and join the AVG?
  options:
    O1:
      do: The President permits reserve officers and active-duty enlisted personnel to resign from U.S. service and join the
        AVG through CAMCO.
      move: act
      irreversible: false
    O2:
      do: The President prohibits reserve officers and active-duty enlisted personnel from resigning from U.S. service and
        joining the AVG through CAMCO.
      move: act
      irreversible: false
    O3:
      do: The President asks the War and Navy Departments to review reserve officers' and active-duty enlisted personnel's
        proposed resignations and AVG service.
      move: ask
      irreversible: false
      to: the War and Navy Departments
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: American citizens could not serve in the armed services of a belligerent foreign power.
  - id: F2
    kind: situation
    status: confirmed
    fact: The United States was still not at war with Japan.
  - id: F3
    kind: situation
    status: confirmed
    fact: The plan had evolved into protecting the Burma Road with American pilots and 100 fighters.
  - id: F4
    kind: situation
    status: confirmed
    fact: The AVG was being organized as a unit of the Chinese Air Force.
  - id: F5
    kind: situation
    status: confirmed
    fact: The personnel arrangement contemplated hiring the men through a civilian entity rather than the Chinese government.
  - id: F6
    kind: situation
    status: confirmed
    fact: CAMCO was a private concern that assembled, operated, and repaired aircraft for China; the Chinese government owned
      the majority of its shares, and a New York company owned the rest.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Lend-Lease Act made it possible for the U.S. government to help China.
  - id: F8
    kind: situation
    status: confirmed
    fact: The personnel proposal concerned U.S. military reserve officers and active-duty enlisted personnel resigning from
      service and joining the AVG.
  - id: F9
    kind: situation
    status: assessed
    fact: The arrangement was regarded as something that could not be done openly.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    - O3
    weight: strong
    why: The legal bar applied to American citizens serving in a belligerent foreign power's armed services, while the AVG
      was a unit of the Chinese Air Force. Hiring through a civilian entity was the proposed solution, but this arrangement
      was not established as definitively resolving the legal constraint.
  - id: C2
    facts:
    - F3
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The plan had shifted to protecting the Burma Road, and Lend-Lease made government help to China possible. The President
      judged that the AVG would serve the country's best interests.
  - id: C3
    facts:
    - F2
    - F9
    equity: public_transparency
    favors:
    - O2
    - O3
    weight: strong
    why: The United States was not yet at war with Japan, and the arrangement was regarded as something that could not be
      done openly. Those circumstances weighed against permitting the arrangement without reservation.
  - id: C4
    facts:
    - F5
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: A civilian company already engaged in aircraft work for China offered a practical hiring channel for the personnel
      proposal. The President agreed to let the specified service members resign and join the AVG through that arrangement.
  reasoning:
    read: The decision was whether to permit a personnel arrangement supporting China while the United States was not at war
      with Japan, despite a legal prohibition on Americans serving in a belligerent foreign power's armed services. The central
      trap is treating civilian hiring as proof that the legal constraint no longer applies; the arrangement was chosen, but
      it was not established as a definitive legal exemption.
    weighing: The President favored helping China and judged the AVG to serve the country's best interests, with the mission
      focused on protecting the Burma Road {C2}. Against that stood the statutory constraint and the fact that the arrangement
      could not be done openly {C1} {C3}. The outcome was to permit the resignations through the civilian hiring arrangement,
      rather than reject assistance or wait for review {C4}. The balance depends on the distinction between the legal constraint
      and the proposed personnel structure; it does not establish that the structure cured every legal concern.
    tradecraft: As a decision practice, record the legal basis and limits of the authorization, distinguish permission to
      resign and join from any broader authorization, and preserve an accurate account of the President's oral decision. Do
      not describe the civilian hiring route as a settled legal exemption.
    uncertainty: The agreement was oral, and the cited unpublished executive order appears never to have existed. No legal
      opinion is provided confirming that civilian hiring placed the arrangement outside the statutory prohibition.
    handoff: The President made the decision; War and Navy Department officials were involved in arranging recruitment. A
      careful implementation would involve the relevant departments and legal advisers to clarify the legal basis and boundaries
      of the permission, without treating that review as a substitute for the President's decision.
    tempting_wrong:
      option: O2
      pull: A categorical prohibition appears to avoid the legal and transparency risks of a personnel arrangement that could
        not be done openly.
      why_wrong: It would disregard the President's judgment that the AVG served the country's best interests and the decision
        to permit the specified personnel to resign and join.
    rejected:
      O2: The President did not prohibit the resignations, choosing instead to permit the personnel arrangement in support
        of China.
      O3: The President did not defer the decision to a departmental review; he agreed orally to permit the resignations and
        joinings.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A legal determination established that hiring through the civilian entity did not avoid the prohibition on American
        citizens serving in a belligerent foreign power's armed services.
      then: O2
      why: The stated legal constraint would then apply directly to the proposed arrangement, weighing against permission.
    - id: flip2
      if: The President lacked authority to permit the resignations or the relevant law expressly barred this arrangement
        notwithstanding the civilian hiring route.
      then: O2
      why: A binding legal limit would outweigh the policy judgment to assist China.
    would_not_change:
    - id: noflip1
      if: Lend-Lease remained available as a means for the United States to help China.
      why: That assistance made support possible but, by itself, did not remove the separate legal constraint on Americans
        serving a belligerent foreign power.
    watch_for:
    - id: watch1
      what: Whether the civilian hiring arrangement is genuinely distinct from service in the Chinese Air Force, particularly
        given CAMCO's ownership structure.
      favors:
      - O3
      - O2
      why: If the intermediary does not meaningfully address the legal concern, further review or prohibition becomes more
        compelling.
  lesson: When a policy goal is important but a legal constraint applies, do not assume that changing the form of an arrangement
    resolves the constraint. State the policy judgment, identify what the proposed structure does and does not establish,
    and keep the authorization within clearly defined limits.
  limits: This reasoning concerns the President's decision to permit this personnel arrangement in the circumstances described,
    not a general conclusion that civilian hiring makes service in a foreign armed force lawful. It does not resolve the legality
    of other forms of support or situations in which the United States is at war.
