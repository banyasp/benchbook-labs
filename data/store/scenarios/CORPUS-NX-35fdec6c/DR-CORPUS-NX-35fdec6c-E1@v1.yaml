case:
  id: DR-CORPUS-NX-35fdec6c-E1@v1
  title: Advocating for Cambodia Aid
  status: draft
  setting: United States, 1974, Ford administration and Senate consideration of Cambodia assistance.
  decider: The Ford administration
  agent: The Ford administration
  agent_role: decide
  situation: In 1974, a Senate vote was scheduled on the next year's economic-assistance package for Cambodia. An intelligence
    estimate assessed that the Lon Nol government was unlikely to survive long enough to benefit from the aid if Congress
    approved it. The situation in Cambodia was regarded within the administration as hopeless. The Secretary of State believed
    that openly abandoning an ally under these circumstances would damage U.S. credibility in the region. The decision was
    whether to support or oppose the package in its advocacy before the Senate.
  question: What should the Ford administration do about its advocacy for the next year's Cambodia economic-assistance package
    before the Senate?
  options:
    O1:
      do: The Ford administration should oppose the Cambodia economic-assistance package in its advocacy before the Senate.
      move: act
      irreversible: false
    O2:
      do: The Ford administration should support the Cambodia economic-assistance package in its advocacy before the Senate.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A Senate vote was scheduled on the next year's economic-assistance package for Cambodia.
  - id: F2
    kind: situation
    status: confirmed
    fact: The estimate was produced at the time the Senate vote was scheduled.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Lon Nol government was assessed as unlikely to survive long enough to benefit from the aid if Congress approved
      it.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The situation in Cambodia was regarded within the administration as hopeless.
  - id: F5
    kind: situation
    status: assessed
    fact: The Secretary of State regarded openly abandoning an ally under these circumstances as a damaging spectacle.
  - id: F6
    kind: situation
    status: assessed
    fact: The Secretary of State believed that openly abandoning an ally under these circumstances would damage U.S. credibility
      in the region.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Secretary of State considered openly abandoning an ally in these circumstances a damaging spectacle that would
      harm U.S. credibility in the region.
  - id: C2
    facts:
    - F5
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: Continuing to support the package avoided the appearance of openly abandoning an ally, a concern the Secretary of
      State expressly raised.
  - id: C3
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The assessment that Lon Nol was unlikely to survive long enough to benefit from the aid weighed against supporting
      a package unlikely to achieve that immediate purpose.
  - id: C4
    facts:
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The administration regarded the situation as hopeless, reinforcing the concern that assistance would not change the
      outcome.
  reasoning:
    read: 'The choice was not simply whether aid was likely to preserve the Lon Nol government: the assessment suggested it
      would not survive to benefit. The competing concern was that openly abandoning an ally could damage U.S. credibility
      in the region.'
    weighing: The assessment of likely futility weighed against advocacy, but the Secretary of State's stated concern about
      the regional cost of openly abandoning an ally carried the administration's decision toward supporting the package.
      The balance depends on the credibility cost being substantial despite the poor prospects for aid to help Lon Nol.
    tradecraft: 'Make the policy rationale explicit and keep it distinct from the intelligence assessment: record both the
      forecast that the government was unlikely to benefit and the credibility concern that drove the choice.'
    uncertainty: The source gives no confidence level for the survival assessment and does not quantify how much regional
      credibility would be affected. It therefore does not establish how the balance would change if either judgment were
      different.
    handoff: This was a Ford administration policy decision. The Secretary of State's stated credibility concern and the intelligence
      assessment were both relevant inputs; the source identifies no separate approval authority.
    tempting_wrong:
      option: O1
      pull: The government was unlikely to survive long enough to benefit, and the situation was regarded as hopeless.
      why_wrong: That reasoning gives decisive weight to the likely lack of immediate aid effect while overlooking the Secretary
        of State's stated concern that openly abandoning an ally would harm U.S. credibility in the region.
    rejected:
      O1: The administration did not let the assessment of likely futility outweigh the Secretary of State's concern about
        the regional credibility cost of openly abandoning an ally.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The administration had a sound basis to conclude that withholding support would not damage U.S. credibility in the
        region, while the assessment that the aid would arrive too late remained.
      then: O1
      why: Without the stated credibility cost, the assessment that Lon Nol was unlikely to survive long enough to benefit
        would weigh more heavily against supporting the package.
    would_not_change:
    - id: noflip1
      if: The assessment that Lon Nol was unlikely to survive long enough to benefit were reinforced, but the concern about
        the credibility cost of openly abandoning an ally remained.
      why: The source's stated reason for continued advocacy was regional credibility, not a belief that the aid was likely
        to save Lon Nol.
    watch_for:
    - id: watch1
      what: Whether openly withholding support would in fact be understood by regional partners as abandoning an ally.
      favors:
      - O2
      why: That consequence bears directly on the Secretary of State's stated credibility concern.
  lesson: A poor prospect of immediate success does not settle a policy choice when the decision-maker identifies a broader
    credibility cost to withdrawal. Weigh that cost explicitly against the likelihood that the proposed assistance can achieve
    its practical purpose.
  limits: This reasoning applies where the decision-maker regards regional credibility and the treatment of an ally as material
    policy interests. It does not establish that aid should be supported whenever an ally is at risk, or resolve cases where
    the credibility concern is absent or the aid's consequences differ.
  library:
    domain: natsec-other
