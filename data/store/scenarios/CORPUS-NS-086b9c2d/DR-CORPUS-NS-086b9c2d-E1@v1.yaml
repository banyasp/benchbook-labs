case:
  id: DR-CORPUS-NS-086b9c2d-E1@v1
  title: Entry of Taigastani Rescue Ships
  status: draft
  setting: Glacia, October 28, the ad hoc crisis decision-making group
  decider: The Glacian ad hoc crisis decision-making group
  agent: The Glacian ad hoc crisis decision-making group
  agent_role: decide
  situation: The Glacian ad hoc crisis decision-making group is considering a request concerning Taigastani rescue ships.
    The submarine is stranded in a restricted military zone. The request concerns entry by those ships into Glacia. The group
    must decide how to respond to the request.
  question: What should the Glacian ad hoc crisis decision-making group do about the request for the Taigastani rescue ships
    to enter Glacia?
  options:
    O1:
      do: The group should permit the Taigastani rescue ships to enter Glacia.
      move: act
      irreversible: false
    O2:
      do: The group should prohibit the Taigastani rescue ships from entering Glacia.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision-maker is an ad hoc crisis decision-making group in Glacia.
  - id: F2
    kind: situation
    status: confirmed
    fact: The prime minister is a member of the group.
  - id: F3
    kind: situation
    status: confirmed
    fact: The foreign minister is a member of the group.
  - id: F4
    kind: situation
    status: confirmed
    fact: The supreme commander of the armed forces is a member of the group.
  - id: F5
    kind: situation
    status: confirmed
    fact: The permanent under-secretary of foreign affairs is a member of the group.
  - id: F6
    kind: situation
    status: confirmed
    fact: The group includes other participants.
  - id: F7
    kind: situation
    status: confirmed
    fact: The request concerns entry by Taigastani rescue ships.
  - id: F8
    kind: situation
    status: confirmed
    fact: The submarine is stranded in a restricted military zone.
  considerations:
  - id: C1
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The foreign minister subsequently asserted Glacia's right to investigate the incident and conduct rescue operations.
      That supports retaining Glacian control over access to the restricted zone, although the source does not expressly identify
      this as the group's October 28 reason for refusing entry.
  - id: C2
    facts:
    - F7
    equity: humanitarian_access
    favors:
    - O1
    weight: weak
    why: The request was by rescue ships, so allowing entry could facilitate rescue. The source does not state the urgency
      of the rescue or what assistance was needed.
  - id: C3
    facts:
    - F7
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: Turning down the entry request was part of a cluster of decisions that triggered a crisis for Taigastan. That consequence
      weighs against refusal, though the source does not say the group treated it as a reason in its deliberation.
  reasoning:
    read: This is a decision about foreign access to a submarine stranded in a restricted military zone, not simply whether
      to assist a rescue. The trap is to treat the rescue request as automatically authorizing entry, or to use the separate
      decision to inspect the submarine as a reason for this access decision.
    weighing: The foreign minister's later assertion of Glacia's right to investigate and conduct rescue operations supports
      refusing outside entry and retaining Glacian control. The rescue purpose and the crisis caused by refusal pull toward
      permitting entry. The source records the refusal but does not give the group's explicit October 28 balancing rationale
      or the urgency of the rescue; the stated authority claim is therefore the clearest support for {O2}, not a complete
      account of the group's reasoning.
    tradecraft: Record the access decision separately from the submarine-inspection decision, identify the authority relied
      on, and document what is known about rescue urgency and the consequences of either response. These are decision-recording
      safeguards, not steps stated by the source.
    uncertainty: The source does not specify the rescue need, whether entry could have been limited or controlled, or the
      group's express reasons for refusing. The foreign minister's stated claim of Glacia's rights came afterward.
    handoff: The ad hoc group made the decision. The source identifies the prime minister, foreign minister, supreme commander,
      permanent under-secretary of foreign affairs, and others as group members; it does not specify a separate approval or
      referral.
    tempting_wrong:
      option: O1
      pull: The ships were presented as rescue ships, making permission appear to be the straightforward humanitarian response.
      why_wrong: The source records Glacia's assertion of its right to investigate and conduct rescue operations, and the
        submarine was in a restricted military zone. The rescue label alone does not establish an entitlement to enter.
    rejected:
      O1: The group turned down the entry request, with the foreign minister subsequently asserting Glacia's right to investigate
        the incident and conduct rescue operations.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable information established that prompt entry was necessary to rescue people in danger, and entry could be
        authorized without surrendering Glacia's control over the investigation.
      then: O1
      why: That would give the humanitarian-access consideration greater weight while preserving the authority interest supporting
        Glacia's control.
    would_not_change:
    - id: noflip1
      if: Taigastan's concerns about its image or relations with Glacia were reduced.
      why: Those concerns are described as Taigastan's perceived interests, not as the group's stated basis for deciding whether
        to allow entry.
    watch_for:
    - id: watch1
      what: Whether the rescue request involved an urgent threat to life and whether Glacia could maintain control while permitting
        access.
      favors:
      - O1
      why: The source does not describe the rescue urgency or whether controlled entry was feasible; either fact could materially
        strengthen the case for permission.
  lesson: A rescue purpose weighs in favor of access, but does not by itself settle who may enter a restricted area or who
    controls an investigation. State the authority basis, assess the urgency and feasible limits on access, and weigh the
    diplomatic and humanitarian costs of refusal.
  limits: The source gives little detail about the rescue need or the group's October 28 rationale, so this scenario does
    not establish a general rule that rescue ships may or may not be refused entry. It also does not decide the separate question
    of inspecting the submarine.
