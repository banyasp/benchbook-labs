case:
  id: DR-OHA-26-0017@v1
  title: Guideline I Psychological Condition Security Clearance Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, employed by a DOE contractor in a position requiring a security clearance, received a Notification
    Letter from the Local Security Office indicating substantial doubt about his eligibility under Guideline I due to a psychological
    condition. A DOE‑consultant psychologist evaluated him in August 2025 and diagnosed Schizoaffective Disorder, Bipolar
    type, noting poor judgment, medication non‑compliance, and a poor prognosis. The Individual’s psychiatrist later submitted
    a summary stating he was fully compliant with treatment, his symptoms were stable as of March 2026, and there was no evidence
    of impairment. The record also shows multiple hospitalizations in July 2023, July 2024, and July 2025, and repeated self‑weaning
    from prescribed medications. The Individual testified that he has been stable for ten months, attends therapy, and believes
    his condition no longer impairs judgment. The Administrative Judge must apply Guideline I, which addresses mental conditions
    that may affect judgment, reliability, or trustworthiness, and consider whether mitigating factors such as consistent
    treatment compliance are present.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline I?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional medical evaluation.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge grants the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      for a security clearance under Guideline I.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: A DOE‑consultant psychologist evaluated the Individual in August 2025 and opined that he meets DSM‑5‑TR criteria
      for Schizoaffective Disorder, Bipolar type.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The Individual has poor judgment, repeatedly weaned off medication, and has a poor prognosis, indicating the condition
      remains uncontrolled.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The Individual’s psychiatrist submitted a clinical summary asserting the Individual was 100% compliant with appointments,
      his symptoms were stable as of March 20, 2026, and there was no evidence of impairment.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual experienced involuntary hospitalization in July 2023, voluntary hospitalization in July 2024 after
      suicidal ideation, and an inpatient stay in July 2025 following a medication overdose, and has repeatedly self‑weaned
      from prescribed psychiatric drugs.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Individual testified that he has been stable for ten months, attends therapy regularly, follows medication as
      prescribed, and believes his condition no longer impairs judgment.
  - id: F8
    kind: authority
    status: confirmed
    fact: Guideline I of the Adjudicative Guidelines addresses emotional, mental, or personality conditions that may impair
      judgment, reliability, or trustworthiness, and lists mitigating factors such as consistent treatment compliance.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Guideline I concerns are substantiated by the DOE‑consultant psychologist’s diagnosis of Schizoaffective Disorder,
      Bipolar type, and the record of repeated non‑compliance and hospitalizations, indicating a condition that may impair
      judgment, reliability, or trustworthiness.
  - id: C2
    facts:
    - F5
    - F7
    equity: due_process
    favors:
    - O3
    weight: weak
    why: Although the psychiatrist reports recent stability and compliance, the report is undermined by the Individual’s own
      admission of withholding medication information, casting doubt on the completeness of the psychiatrist’s assessment.
  - id: C3
    facts:
    - F2
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulatory standards impose a presumption against granting a clearance when substantial doubt exists; the Judge must
      resolve any doubt in favor of national security.
  - id: C4
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The record shows a pattern of episodic crises (July 2023, 2024, 2025) and self‑weaning from medication, indicating
      a realistic risk of future relapse that cannot be discounted.
  - id: C5
    facts:
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: None of the mitigating conditions listed in Guideline I (consistent treatment compliance, favorable prognosis, remission,
      etc.) are satisfied according to the evidence and the psychologist’s testimony.
  reasoning:
    read: The Judge must decide whether the Individual’s mental‑health condition, identified under Guideline I, has been sufficiently
      mitigated to permit a security clearance. The core tension is between the psychologist’s adverse diagnosis and prognosis
      versus the psychiatrist’s more favorable, but incomplete, assessment.
    weighing: The source’s analysis gives decisive weight to the psychologist’s opinion (C1, C5) and to the statutory presumption
      against clearance (C3). While the psychiatrist’s report (C2) is noted, it is discounted because of undisclosed non‑compliance.
      The pattern of repeated crises (C4) reinforces the risk assessment. Consequently, the balance tilts toward denial.
    tradecraft: The Judge records the decision in the official OHA decision, cites the relevant CFR provisions, and notes
      the appeal rights per 10 C.F.R. § 710.28. The record of the hearing, exhibits, and transcripts are appended for completeness.
    uncertainty: Some uncertainty remains regarding the Individual’s true level of compliance, but the weight of the psychologist’s
      testimony and the regulatory presumption outweigh that uncertainty.
    handoff: The decision is made solely by the Administrative Judge; no further inter‑agency consultation is required because
      the statutory framework provides the necessary authority.
    tempting_wrong:
      option: O2
      pull: The psychiatrist’s favorable summary and the Individual’s self‑reported stability could tempt a grant.
      why_wrong: Granting would ignore the psychologist’s explicit finding that the condition remains uncontrolled and the
        lack of any documented two‑year compliance period, violating Guideline I and the presumption against clearance.
    rejected:
      O1: A hold is unnecessary because the record already contains sufficient evidence to make a final determination.
      O2: The mitigating factors required by Guideline I are not met; the psychologist’s prognosis remains poor.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual demonstrates two consecutive years of documented treatment compliance, symptom remission, and no
        recurrence of psychotic episodes.
      then: O2
      why: The psychologist testified that only after two years of consistent compliance and lack of symptomology could a
        favorable prognosis be expressed.
    would_not_change:
    - id: noflip1
      if: The psychiatrist’s favorable assessment alone is presented without corroborating evidence of sustained compliance.
      why: The psychologist’s opinion carries more weight than the psychiatrist’s because he had a more complete view of the
        Individual’s history.
    watch_for:
    - id: watch1
      what: New, verifiable medical documentation showing continuous medication adherence and no psychotic symptoms for at
        least 24 months.
      favors:
      - O2
      why: Such evidence would satisfy the mitigating condition of long‑term compliance identified by the psychologist.
  lesson: Under Guideline I, a security clearance can be denied when a mental‑health condition is diagnosed as impairing judgment
    and the required mitigating factors—especially sustained, documented treatment compliance—are not met. The presumption
    against granting clearance prevails unless clear, long‑term evidence of remission is presented.
  limits: This reasoning applies only to cases where the adjudicative guidelines identify a mental‑health condition that may
    affect reliability. It does not extend to purely administrative or non‑security‑related medical evaluations, nor does
    it override a separate statutory exemption that might apply in a different agency context.
