case:
  id: DR-OHA-26-0017-flip1@v1
  title: Guideline I Psychological Condition Security Clearance Decision [flip]
  status: needs_review
  setting: U.S. Department of Energy Office of Hearings and Appeals, August 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: An employee of a DOE subcontractor, whose position requires a security clearance, received a Notification Letter
    from the Local Security Office indicating substantial doubt about his eligibility under Guideline I because of a diagnosed
    mental-health condition. A DOE-contracted psychologist evaluated him in August 2025 and diagnosed Schizoaffective Disorder,
    Bipolar type. Subsequent medical records now show that the employee has maintained sound judgment, adhered consistently
    to his medication regimen, and has had no psychotic episodes for more than two years. The employee's psychiatrist has
    submitted a clinical summary confirming two consecutive years of documented treatment compliance, complete symptom remission,
    and no recurrence of psychotic episodes. The employee testified that he has been stable for ten months, attends therapy
    regularly, and believes his condition no longer impairs his judgment. The Judge must apply Guideline I, which addresses
    mental conditions that may affect judgment, reliability, or trustworthiness, and determine whether the mitigating factors
    required by the guideline are satisfied.
  question: How should the Administrative Law Judge rule on the employee's access authorization under Guideline I?
  options:
    O1:
      do: Hold the decision pending further evaluation.
      move: hold
      irreversible: false
    O2:
      do: Grant the employee's full access authorization.
      move: act
      irreversible: true
    O3:
      do: Deny the employee's full access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The worker is employed by a DOE subcontracting firm in a position that mandates a personnel security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: A Notification Letter from the Local Security Office expressed significant uncertainty regarding the worker's qualification
      for a clearance under Guideline I.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: In August 2025, a psychologist contracted by DOE assessed the worker and determined that he satisfies DSM-5-TR criteria
      for Bipolar-type Schizoaffective Disorder.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The Individual's judgment is currently sound, and he has consistently adhered to his medication regimen, indicating
      his condition is under control.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The Individual's psychiatrist submitted a clinical summary confirming documented treatment compliance for the past
      two consecutive years (March 2024 through March 2026), complete symptom remission, and no recurrence of psychotic episodes.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual experienced involuntary hospitalization in July 2023 and voluntary hospitalization in July 2024 after
      suicidal ideation; there have been no psychotic episodes since March 2024.
  - id: F7
    kind: intelligence
    status: assessed
    fact: During testimony, the worker reported ten months of stability, regular therapy attendance, strict adherence to his
      medication schedule, and asserted that his condition no longer compromises his judgment.
  - id: F8
    kind: authority
    status: confirmed
    fact: Guideline I of the Adjudicative Guidelines concerns emotional, mental, or personality disorders that could affect
      judgment, reliability, or trustworthiness, and enumerates mitigating factors like sustained treatment compliance.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Although the psychologist's diagnosis indicates a serious condition, the employee's current sound judgment and documented
      adherence to medication demonstrate that the risk to mission reliability has been effectively mitigated.
  - id: C2
    facts:
    - F5
    - F7
    equity: due_process
    favors:
    - O2
    weight: weak
    why: The psychiatrist's two-year compliance record is now corroborated by the employee's own testimony, strengthening
      the case for granting access.
  - id: C3
    facts:
    - F2
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Regulatory presumption against clearance applies only when substantial doubt persists; the new evidence of sustained
      compliance removes that doubt, allowing a grant.
  - id: C4
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Past hospitalizations are historical and, given the absence of any psychotic episode since March 2024, do not pose
      a present risk to reliability.
  - id: C5
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Guideline I's mitigating conditions—consistent treatment compliance for two years, full remission, and no recent
      psychotic episodes—are satisfied, so the mental-health condition no longer impairs judgment, reliability, or trustworthiness.
  reasoning:
    read: The Judge must decide whether the employee's mental-health condition, identified under Guideline I, has been sufficiently
      mitigated to permit a security clearance. The central issue is whether the documented two-year compliance and remission
      outweigh the original diagnosis.
    weighing: The psychologist's diagnosis (C1) is balanced by strong evidence of sustained compliance and remission (C5).
      The statutory presumption against clearance (C3) is neutralized because substantial doubt no longer exists. The psychiatrist's
      report (C2) reinforces the mitigating factors, while the historical hospitalizations (C4) are deemed irrelevant given
      the long symptom-free period. The aggregate analysis therefore supports granting the clearance.
    tradecraft: The Judge records the decision in the official OHA opinion, cites the relevant sections of 10 C.F.R. § 710.28,
      and outlines the employee's appeal rights. All exhibits and transcripts are appended for the record.
    uncertainty: Minor uncertainty remains regarding any future relapse, but the weight of the two-year compliance record
      and current clinical stability outweighs that concern.
    handoff: The decision rests solely with the Administrative Law Judge; no inter-agency consultation is required under the
      governing statutes.
    tempting_wrong:
      option: O3
      pull: The prior hospitalizations and the psychologist's diagnosis could tempt a denial.
      why_wrong: Denial would ignore the clear, documented evidence of two years of uninterrupted compliance and full remission,
        contrary to Guideline I's mitigating criteria.
    rejected:
      O1: A hold is unnecessary because the record already contains sufficient, verifiable evidence to make a final determination.
      O3: The mitigating factors required by Guideline I are satisfied; the employee's condition no longer poses a risk to
        judgment or reliability.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If the employee fails to demonstrate two consecutive years of documented treatment compliance, symptom remission,
        and no recurrence of psychotic episodes,
      then: O3
      why: The psychologist testified that only after such sustained evidence could a favorable prognosis be expressed.
    would_not_change:
    - id: noflip1
      if: If the psychiatrist's favorable assessment is presented without corroborating evidence of sustained compliance,
      why: The psychologist's opinion remains controlling because it reflects a more comprehensive view of the employee's
        history.
    watch_for:
    - id: watch1
      what: New, verifiable medical documentation showing continuous medication adherence and no psychotic symptoms for at
        least 24 months.
      favors:
      - O2
      why: Such evidence would satisfy the mitigating condition of long-term compliance identified by the psychologist.
  lesson: Guideline I permits granting a security clearance when a diagnosed mental-health condition is present but the required
    mitigating factors—documented, continuous treatment compliance for at least two years, full symptom remission, and no
    recent psychotic episodes—are satisfied. In such cases, the presumption against clearance is overcome by clear, long-term
    evidence of stability.
  limits: This analysis applies only to adjudications involving mental-health conditions that may affect reliability under
    the Adjudicative Guidelines. It does not extend to purely administrative medical reviews, non-security-related health
    matters, or situations where a separate statutory exemption governs the clearance decision.
