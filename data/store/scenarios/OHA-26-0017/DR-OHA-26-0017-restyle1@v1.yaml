case:
  id: DR-OHA-26-0017-restyle1@v1
  title: Guideline I Psychological Condition Security Clearance Decision [restyle]
  status: needs_review
  setting: Office of Personnel Security, Department of Energy, September 2026
  decider: Senior Adjudication Officer
  agent: Senior Adjudication Officer
  agent_role: decide
  situation: The employee, working for a DOE contractor in a role that requires a security clearance, received a notice from
    the local security office expressing substantial uncertainty about his eligibility under Guideline I because of a psychiatric
    condition. A DOE-contracted psychologist evaluated him in August 2025 and diagnosed Schizoaffective Disorder, Bipolar
    type, noting impaired judgment, repeated medication discontinuation, and a poor prognosis. The employee's personal psychiatrist
    later submitted a clinical summary stating the employee was fully compliant with treatment, his symptoms were stable as
    of March 20, 2026, and there was no evidence of functional impairment. The record also documents involuntary hospitalization
    in July 2023, voluntary admission in July 2024 after suicidal ideation, and an inpatient stay in July 2025 following a
    medication overdose, together with repeated self-discontinuation of prescribed drugs. The employee testified that he has
    been stable for ten months, attends therapy regularly, follows medication as prescribed, and believes his condition no
    longer compromises judgment. The Senior Adjudication Officer must apply Guideline I, which addresses mental conditions
    that may affect judgment, reliability, or trustworthiness, and determine whether mitigating factors such as consistent
    treatment compliance are present.
  question: What action should the Senior Adjudication Officer take concerning the employee's access authorization under Guideline
    I?
  options:
    O1:
      do: Hold the case pending additional medical evaluation.
      move: hold
      irreversible: false
    O2:
      do: Grant the employee's access authorization now.
      move: act
      irreversible: true
    O3:
      do: Deny the employee's access authorization now.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE-contracted firm in a role that requires a personnel security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The local security office dispatched a notice indicating substantial uncertainty regarding the employee's eligibility
      for a clearance under Guideline I.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: A DOE-contracted psychologist examined the employee in August 2025 and concluded that he satisfies DSM-5-TR criteria
      for Schizoaffective Disorder, Bipolar type.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The psychologist reported that the employee exhibits impaired judgment, repeatedly discontinues medication, and
      has a poor prognosis, suggesting the condition remains uncontrolled.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The employee's personal psychiatrist submitted a clinical summary stating the employee was fully compliant with
      appointments, his symptoms were stable as of March 20, 2026, and no evidence of functional impairment was found.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee experienced an involuntary admission in July 2023, a voluntary admission in July 2024 after suicidal
      thoughts, and an inpatient stay in July 2025 following a medication overdose, and has repeatedly self-discontinued prescribed
      psychiatric drugs.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The employee testified that he has been stable for ten months, attends therapy on a regular schedule, adheres to
      medication as prescribed, and believes his condition no longer compromises judgment.
  - id: F8
    kind: authority
    status: confirmed
    fact: Guideline I of the adjudicative guidelines addresses emotional, mental, or personality conditions that could affect
      judgment, reliability, or trustworthiness, and enumerates mitigating factors such as consistent treatment compliance.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Guideline I concerns are substantiated by the consultant psychologist's diagnosis of Schizoaffective Disorder, Bipolar
      type, together with the documented pattern of medication non-adherence and multiple hospitalizations, indicating a condition
      that may impair judgment, reliability, or trustworthiness.
  - id: C2
    facts:
    - F5
    - F7
    equity: due_process
    favors:
    - O3
    weight: weak
    why: Although the psychiatrist's report notes recent stability and full compliance, its credibility is weakened by the
      employee's own admission of withholding medication information, raising questions about the completeness of the assessment.
  - id: C3
    facts:
    - F2
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulatory policy creates a presumption against granting a clearance when substantial doubt exists; the adjudicator
      must resolve any lingering uncertainty in favor of protecting national security.
  - id: C4
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The history of episodic crises in July 2023, July 2024, and July 2025, coupled with self-discontinuation of medication,
      demonstrates a tangible risk of future relapse that cannot be dismissed.
  - id: C5
    facts:
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The evidence and the psychologist's testimony show that none of the mitigating conditions identified in Guideline
      I—such as sustained treatment compliance, favorable prognosis, or remission—are satisfied.
  reasoning:
    read: The adjudicator must determine whether the employee's mental-health condition, as captured by Guideline I, has been
      sufficiently mitigated to allow a security clearance. The principal conflict lies between the psychologist's adverse
      diagnosis and prognosis and the psychiatrist's more optimistic, yet potentially incomplete, assessment.
    weighing: The analysis accords decisive weight to the psychologist's opinion (C1, C5) and to the statutory presumption
      against clearance (C3). The psychiatrist's input (C2) is considered but discounted because of undisclosed non-compliance.
      The pattern of repeated crises (C4) further supports the risk conclusion. Accordingly, the balance favors denial.
    tradecraft: The adjudicator records the determination in the official OHA decision memorandum, cites the applicable Code
      of Federal Regulations provisions, and outlines the appeal rights pursuant to 10 C.F.R. § 710.28. The hearing transcript,
      exhibits, and supporting documents are attached.
    uncertainty: Residual uncertainty remains regarding the employee's actual compliance level, yet the psychologist's testimony
      and the regulatory presumption outweigh this ambiguity.
    handoff: The decision rests solely with the Senior Adjudication Officer; no additional inter-agency consultation is required
      because the governing statutes provide sufficient authority.
    tempting_wrong:
      option: O2
      pull: The psychiatrist's favorable summary and the employee's self-reported stability could tempt a clearance grant.
      why_wrong: Granting would disregard the psychologist's explicit finding that the condition remains uncontrolled and
        the absence of documented two-year compliance, contravening Guideline I and the presumption against clearance.
    rejected:
      O1: A hold is unnecessary because the record already contains enough evidence for a final ruling.
      O2: The required mitigating factors under Guideline I are not met; the psychologist's prognosis remains poor.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee demonstrates two consecutive years of documented treatment compliance, symptom remission, and no recurrence
        of psychotic episodes.
      then: O2
      why: The psychologist testified that only after two years of consistent compliance and lack of symptomology could a
        favorable prognosis be expressed.
    would_not_change:
    - id: noflip1
      if: The psychiatrist's favorable assessment alone is presented without corroborating evidence of sustained compliance.
      why: The psychologist's opinion carries more weight than the psychiatrist's because he had a more complete view of the
        employee's history.
    watch_for:
    - id: watch1
      what: New, verifiable medical documentation showing continuous medication adherence and no psychotic symptoms for at
        least 24 months.
      favors:
      - O2
      why: Such evidence would satisfy the mitigating condition of long-term compliance identified by the psychologist.
  lesson: Under Guideline I, a security clearance may be denied when a mental-health condition is diagnosed as impairing judgment
    and the requisite mitigating factors—especially sustained, documented treatment compliance—are absent. The presumption
    against granting a clearance prevails unless clear, long-term evidence of remission is presented.
  limits: This analysis is limited to situations where the adjudicative guidelines identify a mental-health condition that
    could affect reliability. It does not apply to purely administrative medical reviews or to cases where a separate statutory
    exemption might govern in another agency context.
