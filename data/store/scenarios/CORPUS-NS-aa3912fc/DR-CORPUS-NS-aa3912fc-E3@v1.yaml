case:
  id: DR-CORPUS-NS-aa3912fc-E3@v1
  title: When the Give-Way Vessel Does Not Respond
  status: draft
  setting: At sea, about 0127, on the ACX Crystal bridge during a crossing with the USS Fitzgerald.
  decider: The second officer on the ACX Crystal
  agent: The second officer on the ACX Crystal
  agent_role: decide
  situation: The second officer saw the Fitzgerald's green light when the ships were about three miles apart. He understood
    the ACX Crystal to be the stand-on vessel and the Fitzgerald, on its port side, to be the give-way vessel. He signaled
    toward the destroyer and received no reply; shortly afterward, he signaled twice more. He expected the Fitzgerald to alter
    course under his understanding of the crossing. The vessels were closing at about 50 feet per second, with relative motion
    exceeding 30 knots.
  question: What should the second officer do as the Fitzgerald's intentions remain unclear?
  options:
    O1:
      do: The second officer continues reliance on the Fitzgerald to alter course and takes no independent avoiding action.
      move: act
      irreversible: false
    O2:
      do: The second officer discontinues reliance on the Fitzgerald to alter course and takes independent avoiding action.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The second officer observed the Fitzgerald's green light when it was about three miles away.
  - id: F2
    kind: authority
    status: assessed
    fact: The second officer understood the ACX Crystal to be the stand-on vessel in the crossing, with the Fitzgerald to
      port.
  - id: F3
    kind: situation
    status: assessed
    fact: The second officer signaled toward the Fitzgerald and said there was no reply.
  - id: F4
    kind: situation
    status: assessed
    fact: Shortly afterward, the second officer returned to the port side and flashed the signal light twice at the destroyer.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The second officer expected the Fitzgerald to alter course because he believed it was the give-way vessel.
  - id: F6
    kind: situation
    status: confirmed
    fact: The vessels were closing at about 50 feet per second, with relative motion exceeding 30 knots.
  - id: F7
    kind: situation
    status: confirmed
    fact: The first signal occurred at 0127:35, about 2.5 minutes after the green light was first observed.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The officer understood that the ACX Crystal was stand-on and expected the Fitzgerald, as give-way vessel, to alter
      course. That role gives some initial reason to expect the other vessel to act, but it does not justify continued reliance
      once its intentions are doubtful.
  - id: C2
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The officer received no reply to his signal and then signaled again. Those attempts did not establish that the Fitzgerald
      understood or would act on the expected course; the report's judgment is that he did not take sufficient action when
      the destroyer's intentions became doubtful.
  - id: C3
    facts:
    - F6
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The vessels were closing rapidly, leaving little time for uncertainty to resolve safely. The circumstances called
      for timely independent action rather than waiting on an assumption about the other vessel.
  - id: C4
    facts:
    - F1
    - F7
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The first signal came about 2.5 minutes after the green light was first observed. With the vessels closing, the elapsed
      time reinforces the need to reassess promptly rather than let reliance continue.
  reasoning:
    read: 'The officer understood the crossing roles and initially expected the Fitzgerald to give way. The trap is treating
      that expectation as assurance: the Fitzgerald gave no reply to his signal, and the rapidly closing vessels left little
      time to wait for its intentions to become clear.'
    weighing: The stand-on role supplies a limited initial pull toward O1 {C1}. But unanswered signals did not resolve the
      Fitzgerald's intentions {C2}, and the closing speed made continued waiting increasingly unsafe {C3}. The NTSB's stated
      judgment that the officer did not take sufficient action once those intentions were doubtful supports O2; the balance
      depends on recognizing that stand-on status does not warrant passive reliance after doubt arises.
    tradecraft: Treat an unanswered signal as unresolved intent, not confirmation that the other vessel will comply. Reassess
      promptly and take independent avoiding action under the applicable collision rules; communicate the concern and decision
      to the bridge team without delaying time-critical action.
    uncertainty: The excerpt establishes that the officer received no reply and expected the Fitzgerald to alter course, but
      does not establish what the Fitzgerald's bridge team understood or intended. That uncertainty supports acting on the
      unresolved risk rather than assuming compliance.
    handoff: The second officer should make the immediate navigation decision within his authority and alert the master or
      bridge team promptly if available. Consultation should not delay action where the vessels are closing rapidly.
    tempting_wrong:
      option: O1
      pull: The officer understood that his vessel was stand-on and the Fitzgerald was give-way.
      why_wrong: That role does not make the Fitzgerald's action certain; after receiving no reply, the officer could not
        safely keep relying on an unconfirmed expectation.
    rejected:
      O1: Continued reliance was not chosen because unanswered signals and the rapid closing rate left the Fitzgerald's intentions
        unresolved.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Fitzgerald's intended and effective course change were clearly established while there was still time to assess
        the crossing safely.
      then: O1
      why: Clear evidence that the give-way vessel was acting would remove the uncertainty that makes continued reliance unsafe
        in this scenario.
    would_not_change:
    - id: noflip1
      if: The officer's understanding that the ACX Crystal was stand-on and the Fitzgerald was give-way remained correct,
        but the Fitzgerald still gave no reply.
      why: The stand-on role alone would not resolve the Fitzgerald's intentions or justify continued reliance after they
        became doubtful.
    watch_for:
    - id: watch1
      what: Whether the other vessel's intentions become clear while sufficient time remains to avoid collision.
      favors:
      - O2
      why: If intentions remain unclear as the vessels close, independent action becomes increasingly urgent.
  lesson: A vessel's stand-on status is not a guarantee that the give-way vessel will act. When its intentions remain doubtful
    and time is short, do not let the expectation of compliance replace independent action under the collision rules.
  limits: This reasoning addresses the decision to rely on the other vessel, not the later maneuvering technique or the precise
    action required by the collision rules. A clear, timely indication that the other vessel is taking effective action could
    alter the assessment.
