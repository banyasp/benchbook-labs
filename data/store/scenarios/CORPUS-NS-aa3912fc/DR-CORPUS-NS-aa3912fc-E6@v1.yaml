case:
  id: DR-CORPUS-NS-aa3912fc-E6@v1
  title: Support or Rest During the Overnight Watch
  status: draft
  setting: Aboard the ship, during an overnight bridge watch before 0600 engineering drills.
  decider: The XO
  agent: The XO
  agent_role: decide
  situation: The XO must decide whether to remain awake and provide additional support to the bridge team. He does not trust
    the OOD and considers her performance below average. The surface warfare coordinator is experienced, but is not physically
    on the bridge; the XO believes the coordinator could back up the bridge team. The coordinator describes his involvement
    with the bridge as limited. The XO trusts the captain’s judgment of the OOD more than his own. The XO is tired and is
    thinking about the 0600 engineering drills and the hours before they begin.
  question: What should the XO do about whether to stay up and provide additional support to the bridge team, consult the
    captain, or rest before the morning drills?
  options:
    O1:
      do: The XO declines to stay up and provide additional support to the bridge team.
      move: act
      irreversible: false
    O2:
      do: The XO asks the captain whether to stay up and provide additional bridge-team support.
      move: ask
      irreversible: false
      to: the captain
    O3:
      do: The XO stays up and provides additional support to the bridge team.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The XO said he did not trust the OOD.
  - id: F2
    kind: capability
    status: assessed
    fact: The XO described the OOD as below average.
  - id: F3
    kind: capability
    status: assessed
    fact: The XO said the OOD had been reprimanded for CIC conduct that he viewed as overconfident.
  - id: F4
    kind: capability
    status: assessed
    fact: The XO considered the surface warfare coordinator experienced and believed the coordinator could back up the bridge
      team despite not being physically on the bridge.
  - id: F5
    kind: capability
    status: assessed
    fact: The surface warfare coordinator described his involvement with the bridge as limited.
  - id: F6
    kind: situation
    status: assessed
    fact: The XO said he trusted the captain’s judgment of the OOD’s performance more than his own.
  - id: F7
    kind: situation
    status: assessed
    fact: The XO said he was tired and focused on the 0600 engineering drills rather than the hours from around midnight until
      then.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: own_force_life
    favors:
    - O2
    - O3
    weight: strong
    why: The XO distrusted the OOD, assessed her as below average, and viewed her prior CIC conduct as overconfident. Those
      concerns weighed against withholding his support without seeking further direction.
  - id: C2
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The XO trusted the captain’s judgment of the OOD more than his own, which was part of his reason for not staying
      up; that reliance was not the same as asking the captain for direction.
  - id: C3
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The XO believed the experienced coordinator could back up the bridge team, supporting his confidence in not staying.
      The coordinator’s description of his bridge involvement as limited qualifies that basis.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The XO was tired and focused on the 0600 engineering drills and the hours before them; he cited this as context for
      not staying up.
  reasoning:
    read: The XO faced a tension between his stated distrust of the OOD and his fatigue before the morning drills. The trap
      in his reasoning is treating confidence in the captain’s judgment and in a coordinator who was not on the bridge as
      equivalent to personally resolving his concern about the watch team.
    weighing: The XO did not stay up. His stated reasons were that he trusted the captain’s judgment more than his own, believed
      the experienced coordinator could back up the bridge team, and was tired and focused on the 0600 drills. His distrust
      and below-average assessment of the OOD weigh the other way, while the coordinator’s limited bridge involvement qualifies
      the reassurance he drew from that coordinator. The balance he described depended on his trust in the captain’s assessment,
      his belief about the coordinator’s support, and his fatigue and focus on the morning.
    tradecraft: As a decision practice, distinguish relying on another leader’s judgment from asking that leader to resolve
      a concern. Record the concern, the basis for the chosen course, and any direction received so the decision and its assumptions
      are clear.
    uncertainty: The source gives the XO’s account of his thinking, but does not establish the captain’s assessment or how
      much practical support the coordinator could provide. It also does not resolve how fatigue affected the XO’s ability
      to support the bridge team.
    handoff: The XO did not raise his concern with the captain; he said he trusted the captain’s judgment more than his own.
      Consulting the captain was an available alternative, but the account does not say that the XO sought direction.
    tempting_wrong:
      option: O3
      pull: The XO’s distrust of the OOD and below-average assessment make staying to support the bridge team seem like the
        direct response.
      why_wrong: It ignores the XO’s stated fatigue and focus on the morning drills, as well as his reliance on the captain’s
        judgment and his belief that the experienced coordinator could back up the team.
    rejected:
      O2: The XO did not ask the captain whether to stay; he said he trusted the captain’s judgment but did not express his
        concern.
      O3: The XO did not stay up, citing fatigue, his focus on the morning drills, and his reliance on the captain’s judgment
        and the coordinator’s experience.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The captain’s assessment did not address the XO’s concern about the OOD, or the XO no longer trusted that assessment.
      then: O2
      why: The stated reliance on the captain’s judgment would no longer support withholding further action, making consultation
        the relevant alternative.
    - id: flip2
      if: The XO learned that the coordinator could not provide meaningful backup and his concern about the OOD remained.
      then: O3
      why: The XO’s stated confidence in the coordinator as backup would no longer support declining to stay.
    would_not_change:
    - id: noflip1
      if: The XO remained tired and focused on the morning drills, while his trust in the captain’s judgment and confidence
        in the coordinator remained unchanged.
      why: Those are the reasons he gave for not staying up; absent a material change to them, his stated basis for O1 remains.
    watch_for:
    - id: watch1
      what: Whether the coordinator’s actual involvement with the bridge is as limited as he described.
      favors:
      - O2
      - O3
      why: That information bears on whether the XO’s belief that the coordinator could back up the bridge team was well founded.
  lesson: When a leader distrusts a subordinate but relies on another leader’s judgment, distinguish that reliance from actually
    raising the concern and obtaining direction. Weigh that concern against fatigue and other duties, and do not treat presumed
    backup as equivalent to confirmed support.
  limits: This reasoning reflects the XO’s reported reasons for this overnight decision; it does not establish that declining
    support was objectively safer or that the captain or coordinator had assessed the situation. It does not resolve what
    the XO should do if the concern, available support, or fatigue conditions materially differ.
