case:
  id: DR-OGE-2635-703@v1
  title: Navy Employee Stock Purchase and Advice Prohibition
  status: draft
  setting: Navy, present, during contract award process
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: The employee works for the Navy and, in the course of official duties, learned that a small corporation will
    be awarded a Navy contract for electrical test equipment. The contract award has not yet been publicly announced, so the
    information is nonpublic. The employee knows that the regulation prohibits using such nonpublic information for personal
    financial gain or advising others to do so. The employee is capable of purchasing the corporation’s stock and of communicating
    with friends or relatives about the opportunity. The employee must decide whether to act on the information before the
    public announcement.
  question: What should the employee do with the nonpublic information about the upcoming contract award?
  options:
    O1:
      do: The employee refrains from buying the corporation's stock and does not advise anyone to do so
      move: act
      irreversible: false
    O2:
      do: The employee buys the corporation's stock and advises friends and relatives to buy it
      move: act
      irreversible: false
    O3:
      do: The employee seeks guidance from the agency ethics official before taking any action
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is a Navy employee
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee learned in official duties that a small corporation will be awarded a Navy contract for electrical
      test equipment
  - id: F3
    kind: situation
    status: confirmed
    fact: The contract award has not yet been publicly announced
  - id: F4
    kind: authority
    status: confirmed
    fact: Nonpublic information is information obtained by reason of Federal employment that has not been made available to
      the general public
  - id: F5
    kind: authority
    status: confirmed
    fact: Employees may not engage in financial transactions using nonpublic information or advise others to do so
  - id: F6
    kind: situation
    status: confirmed
    fact: Violating the prohibition could also breach Federal securities statutes
  - id: F7
    kind: capability
    status: assessed
    fact: The employee has the ability to purchase stock in the corporation and to communicate with friends or relatives
  - id: F8
    kind: authority
    status: confirmed
    fact: The prohibition applies to actions taken before the public announcement of the contract award
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: 2635.703(a) expressly prohibits employees from engaging in financial transactions or advising others using nonpublic
      information, and the prohibition applies before the contract award is publicly announced.
  - id: C2
    facts:
    - F4
    - F2
    - F3
    equity: protected_activity
    favors:
    - O1
    weight: strong
    why: The information about the pending contract meets the definition of nonpublic information because it is obtained by
      reason of Federal employment and has not been made available to the public.
  - id: C3
    facts:
    - F6
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: Using the information for personal gain could also breach Federal securities statutes, adding a legal risk beyond
      the ethics rule.
  - id: C4
    facts:
    - F1
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Maintaining the credibility of the Navy and the civil service requires employees to avoid even the appearance of
      impropriety.
  reasoning:
    read: The employee has learned, in the course of official duties, that a small corporation will be awarded a Navy contract
      before that fact is public. The trap is the temptation to profit personally or help friends profit from that insider
      knowledge.
    weighing: The regulation’s explicit prohibition (C1) and the clear definition of nonpublic information (C2) dominate the
      analysis. The added risk of violating securities law (C3) reinforces the need to refrain. While personal capability
      (F7) makes the wrongdoing easy, the modest weight of institutional credibility (C4) does not outweigh the binding rule.
    tradecraft: The employee should document the receipt of the information, log the decision not to trade, and, if required,
      report the knowledge to the agency ethics official as a matter of record.
    uncertainty: There is minimal factual uncertainty; the only variable is the timing of the public announcement.
    handoff: The decision can be made by the employee alone, but best practice is to inform the agency ethics official to
      create an audit trail.
    tempting_wrong:
      option: O2
      pull: The employee can easily purchase stock and advise friends, gaining immediate financial benefit.
      why_wrong: Such action directly violates the regulation and could constitute insider trading under federal securities
        law.
    rejected:
      O2: Prohibited by 2635.703(a) and would constitute a breach of both ethics rules and securities statutes.
      O3: While seeking guidance is prudent, it does not change the underlying prohibition; the employee must still refrain
        from any transaction.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The contract award has been publicly announced
      then: O2
      why: The prohibition applies only before the public announcement; once the information is public, the employee may trade.
    would_not_change:
    - id: noflip1
      if: The employee merely seeks guidance from the ethics official without trading
      why: Seeking advice does not itself violate the rule, but the employee must still refrain from any transaction.
    watch_for:
    - id: watch1
      what: Any inadvertent disclosure of the nonpublic contract information to a third party
      favors:
      - O1
      why: Even unintentional disclosure could be a knowing unauthorized disclosure if done to further private interest.
  lesson: Federal employees must not use or share nonpublic information obtained through official duties for personal financial
    gain; the prohibition lasts until the information is publicly released.
  limits: This rule applies only to information that is truly nonpublic and obtained by reason of federal employment; it does
    not govern publicly available market data or legitimate investment decisions unrelated to insider knowledge.
