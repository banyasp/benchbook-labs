case:
  id: DR-CORPUS-NX-41a13120-E2@v1
  title: Coalition Compromise or Complete Control
  status: draft
  setting: Czechoslovakia, the coalition government in power since 1945, at the dispute over police control.
  decider: The Communist leadership
  agent: The Communist leadership
  agent_role: decide
  situation: In Czechoslovakia, Communist and non-Communist parties shared a coalition government that had been in power since
    1945. They held nearly equal power, and many people approved of several Communist economic policies. The coalition parties
    were willing to follow the Soviet Union's lead in foreign policy. The non-Communist parties would not accept continued
    Communist control of the police. The Communist leadership assessed that it could not win an election without that control
    and believed complete dominance was unattainable under a freely operating parliamentary system. The leadership faced a
    choice between continuing the coalition without police control and seeking complete government control while retaining
    police control.
  question: What should the Communist leadership do about police control and the coalition government?
  options:
    O1:
      do: The Communist leadership would retain police control and seek complete control of government.
      move: act
      irreversible: true
    O2:
      do: The Communist leadership would relinquish police control and continue the coalition government.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A coalition government of Communist and non-Communist parties had been in power since 1945.
  - id: F2
    kind: situation
    status: assessed
    fact: Communists and non-Communists held nearly equal power in the coalition government.
  - id: F3
    kind: situation
    status: assessed
    fact: A majority of the people approved of many Communist economic policies.
  - id: F4
    kind: situation
    status: assessed
    fact: All coalition parties were willing to follow the Soviet Union's lead in foreign policy.
  - id: F5
    kind: situation
    status: confirmed
    fact: The non-Communist parties refused to permit continued Communist control of the police.
  - id: F6
    kind: situation
    status: assessed
    fact: The Communist leadership considered electoral victory impossible without control of the police.
  - id: F7
    kind: situation
    status: assessed
    fact: The Communist leadership believed complete dominance could not be achieved under a freely operating parliamentary
      government.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: 'The coalition appeared to offer a workable compromise: the parties shared power, many people approved of Communist
      economic policies, and the parties aligned on foreign policy. Those conditions supported continuing the coalition, but
      the compromise was shattered over police control.'
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The non-Communists' refusal to permit continued Communist police control made continuation of the existing arrangement
      incompatible with the Communist leadership's demand to retain that control.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The leadership assessed that it could not win an election without police control, making relinquishment of that control
      inconsistent with its perceived route to electoral victory.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The leadership believed complete dominance could not be achieved under a freely operating parliamentary system and
      refused to settle for less than complete control.
  reasoning:
    read: 'The apparent coalition compromise rested on shared power, some public support for Communist policies, and foreign-policy
      alignment, but police control was the decisive point of conflict. The trap is treating those areas of agreement as proof
      that the leadership could preserve its aims through the coalition: it viewed electoral victory without police control
      and complete dominance through free parliamentary government as unattainable.'
    weighing: 'The coalition''s favorable conditions lend some support to O2, but the decisive stated reasons point to O1:
      the leadership considered electoral victory impossible without police control and believed complete dominance impossible
      under free parliamentary government. This balance depends on those political assessments; no independent legal or ethical
      justification for them is given.'
    tradecraft: Separate the leadership's strategic assumptions from any legal or ethical authorization for its course, test
      whether the asserted lack of alternatives is supported, and record the consequences of each option. These safeguards
      are decision-practice synthesis, not reasons attributed to the leadership.
    uncertainty: The accuracy of the leadership's beliefs about electoral victory and parliamentary government is not established,
      and the legality or legitimacy of either option is not assessed.
    handoff: No review or referral authority is identified. As a synthesis, a decision with consequences for parliamentary
      government should receive review by the competent constitutional and legal authorities rather than rely solely on the
      leadership's political assessment.
    tempting_wrong:
      option: O2
      pull: The coalition had existed since 1945, the parties held nearly equal power, many people approved of Communist economic
        policies, and the parties agreed on foreign policy.
      why_wrong: 'These points do not answer the decisive conflict: the non-Communists rejected continued police control,
        while the leadership believed it could neither win without that control nor achieve complete dominance through free
        parliamentary government.'
    rejected:
      O2: The leadership did not relinquish police control and continue the coalition because it assessed that electoral victory
        required police control and that complete dominance was unattainable under a freely operating parliamentary system.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership could win an election without retaining police control.
      then: O2
      why: That would remove the stated electoral reason for retaining police control and could make continuing the coalition
        viable.
    - id: flip2
      if: The leadership could achieve its desired degree of political power through a freely operating parliamentary system.
      then: O2
      why: That would remove the stated reason that complete dominance required abandoning the coalition's parliamentary arrangement.
    would_not_change:
    - id: noflip1
      if: The coalition parties continued to agree on foreign policy and many people continued to approve of Communist economic
        policies, while the dispute over police control remained.
      why: Those favorable conditions were already present, yet police control and the leadership's aims remained decisive.
    watch_for:
    - id: watch1
      what: Evidence bearing on whether electoral victory without police control was genuinely impossible.
      favors:
      - O2
      why: That assessment is a central premise for rejecting relinquishment of police control.
  lesson: When a decision rests on claims that a political objective cannot be achieved through ordinary institutional processes,
    distinguish the decision-maker's belief from verified necessity and from lawful authority. Apparent areas of agreement
    do not resolve a dispute over control of a decisive institution.
  limits: This is an account of the Communist leadership's stated political reasoning, not a legal ruling or a normative endorsement
    of its conduct. The accuracy of its assessments and the applicable constitutional rules are not established.
  library:
    domain: intel-analysis
    family: CORPUS-NX-41a13120
    source: https://www.cia.gov/resources/csi/static/f6fcd8cc4a527b11144937e6bb7f7497/5563bod2-EarlyColdWarDocuments.pdf
    episode_focus: The decision point is the choice between compromise within the coalition and seeking complete control,
      including retaining police control. The passage gives reasons tied to the prospect of electoral victory and the limits
      of power under parliamentary government; exclude the described mechanics of carrying out the coup.
    cues:
      option_words:
        O1: 13
        O2: 12
      real_option: O1
      real_to_mean_other_length: 1.08
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The assessment attributes the choice to the Communist leadership's refusal to settle for less than complete control
  and its conviction that such dominance could not be achieved under a freely operating parliamentary government.
