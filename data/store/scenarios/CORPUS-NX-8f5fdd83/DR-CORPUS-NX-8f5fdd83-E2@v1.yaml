case:
  id: DR-CORPUS-NX-8f5fdd83-E2@v1
  title: Arms Request for a Chilean Uprising
  status: draft
  setting: Santiago, Chile; October 6; CIA in Santiago.
  decider: The CIA in Santiago.
  agent: The CIA in Santiago
  agent_role: decide
  situation: On October 6, a Chilean interlocutor approached the CIA in Santiago seeking arms to start an uprising. The United
    States would not provide arms if action depended on a favorable U.S. response, and maintained that the decision to act
    had to be Chilean. The CIA wanted Chileans to act on their own. There were routine exhortations about the seriousness
    of U.S. intent to prevent the candidate from taking office. The CIA assessed the interlocutor's plans as inadequate.
  question: What should the CIA in Santiago do about the request for arms?
  options:
    O1:
      do: The CIA in Santiago should authorize provision of the requested arms to the Chilean interlocutor.
      move: act
      irreversible: true
    O2:
      do: The CIA in Santiago should decline provision of the requested arms to the Chilean interlocutor.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On October 6, a Chilean interlocutor approached the CIA in Santiago.
  - id: F2
    kind: situation
    status: confirmed
    fact: The interlocutor requested arms to start an uprising.
  - id: F3
    kind: authority
    status: confirmed
    fact: The United States would not provide arms if the coup were contingent on a favorable U.S. reaction.
  - id: F4
    kind: authority
    status: confirmed
    fact: The U.S. position was that the decision to move had to be a Chilean decision.
  - id: F5
    kind: situation
    status: confirmed
    fact: The CIA wanted Chileans to act on their own.
  - id: F6
    kind: situation
    status: confirmed
    fact: There were routine exhortations about the seriousness of U.S. intent to prevent the candidate from taking office.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The CIA assessed the interlocutor's plans as inadequate.
  considerations:
  - id: C1
    facts:
    - F3
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: The U.S. position was not to furnish arms if the coup depended on a favorable U.S. reaction, supporting refusal of
      the request.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The CIA wanted Chileans to act on their own, and the decision to move had to be Chilean rather than dependent on
      U.S. direction.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The CIA assessed the interlocutor's plans as inadequate, a reason against furnishing arms for those plans.
  - id: C4
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Routine exhortations showed serious U.S. intent to prevent the candidate from taking office, but the source distinguishes
      that intent from providing arms for a Chilean action.
  reasoning:
    read: The decision is whether to furnish arms, not whether the United States had a political preference about who took
      office. The trap is treating routine U.S. exhortations as authorization to supply arms, despite the stated limit that
      the Chileans had to decide to act on their own.
    weighing: The stated refusal rests on the U.S. position against furnishing arms if action depended on a favorable U.S.
      reaction and on the insistence that the decision to move be Chilean {C1} {C2}. The CIA's assessment that the plans were
      inadequate reinforces refusal {C3}. Routine exhortations provide some contrary context, but do not displace those stated
      reasons {C4}. The balance could be reconsidered if the action were independent of a favorable U.S. response and the
      plans were assessed differently; this source does not say that such circumstances would require authorization.
    tradecraft: 'Record the refusal and its stated grounds separately: the U.S. position on dependence upon a favorable U.S.
      reaction, the requirement for a Chilean decision, and the assessment of the plans. Do not treat political exhortations
      as an authorization to provide arms.'
    uncertainty: The available facts do not establish whether the proposed action was in fact contingent on a favorable U.S.
      reaction, nor do they describe what made the plans inadequate. The source also does not set out a general policy for
      requests made under different circumstances.
    handoff: The decision is attributed to the CIA in Santiago. The source does not identify another office as an approver
      or reviewer; any required consultation would depend on applicable authority not described here.
    tempting_wrong:
      option: O1
      pull: Routine U.S. exhortations to prevent the candidate from taking office could make supplying arms seem consistent
        with U.S. intent.
      why_wrong: The source separates those exhortations from the decision to furnish arms, which it says had to remain a
        Chilean decision and not depend on a favorable U.S. reaction.
    rejected:
      O1: The CIA did not authorize the requested arms, citing the U.S. position on dependence on a favorable U.S. reaction,
        the need for a Chilean decision, and its assessment that the plans were inadequate.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed action were clearly an independent Chilean decision, not dependent on a favorable U.S. reaction, and
        the plans were assessed as adequate.
      then: O1
      why: Those changed circumstances would remove two stated grounds for refusal and could support reconsidering authorization;
        the source does not state that authorization would then be required.
    would_not_change:
    - id: noflip1
      if: Routine exhortations about the seriousness of U.S. intent to prevent the candidate from taking office remained present.
      why: Those exhortations coexisted with the categorical refusal and did not, on their own, change the stated decision
        about providing arms.
    watch_for:
    - id: watch1
      what: Whether the proposed action depended on a favorable U.S. reaction.
      favors:
      - O2
      why: That condition is expressly identified as a reason the United States would not provide arms.
  lesson: Distinguish political intent from authorization to provide support. Where the stated policy makes assistance conditional
    on independent partner action, do not let exhortations about the desired outcome erase that limit; also take the assessed
    adequacy of the proposed plan into account.
  limits: This reasoning concerns the specific request and the stated U.S. position in this episode. It does not establish
    a general rule about all assistance to Chilean actors, or determine what should happen if the action is independent and
    the plans are assessed as adequate.
