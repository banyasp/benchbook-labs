case:
  id: DR-CORPUS-NX-76a2a1e8-E1@v1
  title: Characterizing an Uncertain Estimate
  status: draft
  setting: Upper Volta; date unspecified; U.S. intelligence-estimation context for policymakers.
  decider: The estimators
  agent: The estimators
  agent_role: decide
  situation: The estimators are preparing an intelligence estimate concerning Upper Volta for U.S. policymakers. Their knowledge
    of Upper Volta's experiments and resources is limited, and their view of its national objectives rests partly on belief.
    They assess a three-year outcome as possible, while judging the worst-case estimate highly unlikely. The estimate is meant
    to guard against complacency, although the judgment cannot be fully documented. The estimators must decide whether to
    present the possibility as stated, qualify it with the possibility of later timing, or characterize the timing as undetermined.
  question: What should the estimators do in presenting the three-year possibility and its uncertainty to U.S. policymakers?
  options:
    O1:
      do: The estimators include the three-year possibility in the estimate as a possible outcome for U.S. policymakers.
      move: act
      irreversible: false
    O2:
      do: The estimators include the three-year possibility and note that a later outcome is also possible for U.S. policymakers.
      move: partial
      irreversible: false
    O3:
      do: The estimators exclude the three-year possibility and present the timing as undetermined to U.S. policymakers.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: U.S. security planning is a contemplated use of the estimate.
  - id: F2
    kind: situation
    status: assessed
    fact: The estimators regard the worst reasonably possible outcome as a safer planning basis than hopes that may prove
      false.
  - id: F3
    kind: situation
    status: assessed
    fact: When the hypotheses are uncertain, the estimators believe readers should be prepared for the worst.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The estimators have limited knowledge of Upper Volta's experiments and resources, and their understanding of its
      national objectives is partly belief-based.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The estimate assesses a three-year outcome as possible.
  - id: F6
    kind: situation
    status: assessed
    fact: The estimators favor warning U.S. policymakers over risking complacency through a judgment they cannot document.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The estimators judge the worst-case outcome highly unlikely.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The estimators recognize that the outcome could occur three or four years later, or even later still.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Because the estimate may inform U.S. security planning, the estimators prefer preparation for the worst reasonably
      possible outcome over reliance on hopes that may prove false; uncertainty is a reason to prepare readers for the worst.
  - id: C2
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Limited knowledge makes the judgment difficult to document, but the source still frames the three-year outcome as
      possible. Presenting it as a possibility preserves that assessment without asserting that it is likely.
  - id: C3
    facts:
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The estimators prefer to warn policymakers rather than risk complacency through a judgment they cannot fully document.
  - id: C4
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The estimators recognize that the worst case is highly unlikely and that the outcome may occur later. Those uncertainties
      could support an added timing qualification, but the source questions whether adding that caveat serves the estimate
      and warns against assuming foreign development will take longer merely because U.S. development did.
  reasoning:
    read: 'The estimators face a judgment under substantial uncertainty: they regard the three-year outcome as possible but
      highly unlikely, and the estimate may shape security planning. The trap is either allowing uncertainty to produce complacency
      or letting a worst-case estimate sound more certain than the estimators believe it is.'
    weighing: The source favors warning policymakers with the worst reasonably possible outcome rather than relying on hopes
      that may be false or on a judgment that cannot be documented. It acknowledges both the low likelihood and the possibility
      of later timing, but rejects adding that qualification as unhelpful and cautions against assuming foreign development
      will be slower based on the U.S. experience. The balance depends on retaining the claim as a possibility, not presenting
      it as a likely outcome.
    tradecraft: State the three-year outcome as possible, not as a prediction or a certainty. Keep the estimate's limited
      evidentiary basis and uncertainty clear in the accompanying assessment, without converting the conclusion into an unsupported
      claim that later timing is just as likely.
    uncertainty: The evidence is limited and the hypotheses are shaky; the estimators regard the worst case as highly unlikely.
      They nevertheless consider the outcome possible and its presentation relevant to warning policymakers.
    handoff: The estimators make the estimate for U.S. policymakers. The source gives no basis for assigning the judgment
      to another authority; the estimators should convey their assessment and its uncertainty to its policy audience.
    tempting_wrong:
      option: O2
      pull: It acknowledges that the worst case is highly unlikely and that the outcome may occur later.
      why_wrong: The source questions whether adding later timing is useful and warns against bias from assuming that other
        nations will take longer than the United States did. The warning against complacency and preparation for the reasonably
        possible worst case carry greater weight.
    rejected:
      O2: The source recognizes later timing as possible but does not endorse adding that caveat, which it considers unhelpful
        and potentially shaped by an unwarranted U.S.-experience comparison.
      O3: Excluding the three-year possibility would abandon the source's preference to warn policymakers and prepare them
        for the worst reasonably possible outcome.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable new evidence showed that the three-year outcome was not reasonably possible.
      then: O3
      why: The case for warning depends on presenting a reasonably possible outcome; without that basis, retaining the possibility
        would misstate the assessment.
    - id: flip2
      if: Reliable new evidence supported the three-year possibility but made later timing substantially better supported.
      then: O2
      why: An evidence-based later-timing qualification would address uncertainty without relying on an assumption drawn merely
        from U.S. development experience.
    would_not_change:
    - id: noflip1
      if: The estimators continue to regard the worst case as highly unlikely.
      why: The worst case is highly unlikely, yet the preferred course remains stating the possibility rather than adding
        a later-timing caveat.
    - id: noflip2
      if: The judgment remains difficult to document because the evidence is limited.
      why: The estimators expressly favor warning policymakers over risking complacency through a judgment that cannot be
        documented.
    watch_for:
    - id: watch1
      what: Whether the worst-case estimate is being chosen defensively because the estimator expects to avoid blame if a
        dire prediction does not occur.
      favors:
      - O2
      why: The distinction between preparation for a reasonably possible worst case and defensive overstatement matters; evidence
        of defensive overstatement would weaken the basis for presenting the estimate without qualification.
  lesson: When an uncertain estimate will inform security planning, a reasonably possible severe outcome may warrant presentation
    to guard against complacency. State it as a possibility, and do not replace evidence-based uncertainty with either false
    reassurance or unsupported certainty.
  limits: This reasoning applies to the source's hypothetical estimate and its stated warning purpose; it does not establish
    a general rule to present every worst case. It depends on the outcome remaining reasonably possible and on the estimate
    being framed as possibility rather than likelihood.
