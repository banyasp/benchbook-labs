        O3: 15
      real_option: O1
      real_to_mean_other_length: 0.97
      real_is_longest: false
      moves:
        O1: act
        O2: partial
        O3: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
        O3: false
    equities: pilot2
