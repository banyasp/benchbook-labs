    domain: intel-analysis
    family: CORPUS-NX-76a2a1e8
    source: https://www.cia.gov/resources/csi/static/db9dec63b4f06a0d6d947038c87bd0fc/Scientific-Estimating.pdf
    episode_focus: In the hypothetical Upper Volta estimate, the estimators present the three-year outcome as possible, favoring
      warning U.S. policymakers against complacency despite recognizing that the outcome is highly unlikely. The decision
      point is how to characterize the estimate and its uncertainty; exclude technical details about missile or warhead capabilities.
    cues:
      option_words:
