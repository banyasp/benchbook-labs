  - id: F5
    kind: situation
    status: confirmed
    fact: The candidate was the most senior Army general.
  - id: F6
    kind: situation
    status: confirmed
    fact: Seniority was the stated reason for choosing the candidate.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The Acting President's stated reason for choosing the candidate was that he was the most senior Army general.
  reasoning:
    read: This is a choice about who to appoint to the Chief of Army Staff post. The source gives seniority as the reason
      for choosing the candidate; it supplies no further selection criteria to apply.
    weighing: The candidate's status as the most senior Army general is the stated basis for O2 {C1}. The balance therefore
      turns on that seniority-based reason; the source gives no competing reason for selecting someone else.
    tradecraft: Record the appointment decision and its stated seniority basis clearly, without attributing additional criteria
      or deliberations to the Acting President.
    uncertainty: The excerpt gives no competing candidate, alternative selection criteria, or legal standard. None can be
      inferred from the stated reason.
    handoff: The source identifies the Acting President as the decider and gives no reason to infer that another decision-maker
      was involved.
    tempting_wrong:
      option: O1
      pull: Selecting another candidate remains an available option in the question.
      why_wrong: The source's stated reason favors the senior-most general, and it gives no countervailing reason to select
        someone else.
    rejected:
      O1: The source did not choose another candidate; its stated basis was the candidate's seniority.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Another candidate were established to be the most senior Army general.
      then: O1
      why: If seniority remains the stated basis, the appointment would favor the other, more senior candidate.
    would_not_change:
    - id: noflip1
      if: The circumstances surrounding the general's death were different, while the candidate remained the most senior Army
        general.
      why: The source gives seniority, not the circumstances of the death, as the stated reason for the appointment.
    watch_for: []
  lesson: When the stated basis for a personnel choice is seniority, keep the decision tied to that criterion. Do not supply
    unstated qualifications or deliberations to justify the choice or a departure from it.
  limits: This reasoning applies only to the stated appointment and seniority rationale. The excerpt does not establish a
    general legal rule requiring seniority-based appointments or address other possible criteria.
