  id: DR-CORPUS-NX-83d09a25-E1@v1
  title: Choosing the Army Chief
  status: draft
  setting: Place not specified; following the unexpected death of a general; Army, Chief of Army Staff post.
  decider: The Acting President
  agent: The Acting President
  agent_role: decide
  situation: An official had been named Acting President following the unexpected death of a general. The decision concerned
    who to appoint to the Army's Chief of Army Staff post. The candidate at issue was an Army general. He was the most senior
    Army general, and seniority was the stated reason for choosing him.
  question: What should the Acting President do about appointing the senior-most Army general or selecting another candidate
    for the Chief of Army Staff post?
  options:
    O1:
      do: The Acting President declines that appointment and selects another Army general for the Chief of Army Staff post.
      move: act
      irreversible: true
    O2:
      do: The Acting President appoints the senior-most Army general to the Chief of Army Staff post.
      move: act
      irreversible: true
  facts:
