case:
  id: DR-CORPUS-NX-b6a7d193-E2@v1
  title: Selecting a Network for PANAMAX 18
  status: draft
  setting: Global planning among participating countries in the months leading up to PANAMAX 18.
  decider: The PANAMAX 18 planners
  agent: The PANAMAX 18 planners
  agent_role: decide
  situation: In the months leading up to PANAMAX 18, participating countries used APAN for planning and collaboration. APAN
    was available to participating countries and accessible from global locations, and it worked well for those purposes.
    The exercise, as designed, was to operate on a coalition network. U.S. military networks were restricted to all but a
    few closely vetted personnel. CENTRIXS-IANTN was available for theater support and interoperability, but most regional
    partners typically did not maintain an active kiosk for it. Accounts for regional partners depended on information-sharing
    agreements and the ability to validate user security credentials.
  question: What should the PANAMAX 18 planners do about selecting a network for the exercise?
  options:
    O1:
      do: The planners ask regional partners to confirm eligibility before network selection.
      move: ask
      irreversible: false
      to: regional partners
    O2:
      do: The planners approve CENTRIXS-IANTN as the network for PANAMAX 18.
      move: act
      irreversible: false
    O3:
      do: The planners reject CENTRIXS-IANTN and approve APAN for PANAMAX 18.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In the months leading up to PANAMAX 18, planning and collaboration took place on APAN.
  - id: F2
    kind: capability
    status: confirmed
    fact: APAN was available to participating countries and accessible from global locations capable of providing .com or
      Gmail accounts.
  - id: F3
    kind: capability
    status: confirmed
    fact: APAN worked well for planning and collaboration.
  - id: F4
    kind: situation
    status: confirmed
    fact: The exercise as designed was to operate on a coalition network.
  - id: F5
    kind: authority
    status: confirmed
    fact: DOD regulations restricted U.S. military networks to all but a few closely vetted personnel.
  - id: F6
    kind: capability
    status: confirmed
    fact: CENTRIXS-IANTN was a network managed by USSOUTHCOM for theater support and interoperability.
  - id: F7
    kind: situation
    status: confirmed
    fact: Regional partner accounts on CENTRIXS-IANTN could be established where information-sharing agreements existed and
      user security credentials could be validated.
  - id: F8
    kind: capability
    status: confirmed
    fact: Most regional partners typically did not maintain an active CENTRIXS-IANTN kiosk.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The exercise was designed to operate on a coalition network, and CENTRIXS-IANTN was managed for theater support and
      interoperability.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: DOD regulations restricted U.S. military networks to a few closely vetted personnel, making that network environment
      unsuitable for broad partner participation; CENTRIXS-IANTN was the identified coalition-network alternative.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: APAN was accessible and worked well for planning and collaboration, but those strengths did not make it the network
      intended for the exercise itself.
  - id: C4
    facts:
    - F7
    - F8
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: Partner accounts depended on information-sharing agreements and credential validation, while most regional partners
      did not typically maintain an active kiosk; these conditions create an access concern but do not negate CENTRIXS-IANTN's
      role as the coalition network.
  reasoning:
    read: 'This is a choice of network for the exercise, not a judgment that APAN failed: APAN served planning and collaboration
      well, while the exercise was designed to run on a coalition network. The trap is to treat APAN''s planning success as
      sufficient reason to use it for the exercise, or to overlook that U.S. military networks were restricted.'
    weighing: The coalition-network design and the restrictions on U.S. military networks support selecting CENTRIXS-IANTN
      {C1} {C2}. APAN's effectiveness is relevant to planning, but not decisive for the exercise network {C3}. The balance
      depends on whether partner accounts can be established under the stated agreement and credential-validation conditions;
      limited kiosk availability is an access concern, not a reason the source gives for abandoning CENTRIXS-IANTN {C4}.
    tradecraft: Record why the exercise requires a coalition network and why CENTRIXS-IANTN was selected. Before relying on
      partner accounts, confirm that the applicable information-sharing agreements exist and that user credentials can be
      validated; do not treat planning access on APAN as proof of exercise-network eligibility.
    uncertainty: The stated facts do not identify which partners meet the account conditions or how many can participate through
      CENTRIXS-IANTN. They also do not specify whether partners without an active kiosk can obtain access by other means.
    handoff: The planners can select the network, but should coordinate with the relevant partner representatives and authorities
      responsible for information-sharing agreements and credential validation, because those conditions determine which partner
      accounts can be established.
    tempting_wrong:
      option: O3
      pull: APAN was globally accessible to participating countries and worked well for planning and collaboration.
      why_wrong: Those advantages address planning and collaboration, whereas the exercise itself was designed to operate
        on a coalition network.
    rejected:
      O1: The source chose CENTRIXS-IANTN rather than deferring network selection, while treating agreements and credential
        validation as conditions for establishing partner accounts.
      O3: APAN's success for planning did not make it the coalition network intended for the exercise.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Information-sharing agreements or credential validation are unavailable for enough regional partners to make the
        selected network unworkable for the exercise.
      then: O1
      why: The source makes those conditions prerequisites for establishing partner accounts; if they cannot be met at sufficient
        scale, the planners should defer selection to resolve partner eligibility.
    - id: flip2
      if: The exercise design no longer requires operation on a coalition network.
      then: O3
      why: Without that design requirement, APAN's stated accessibility and effectiveness for planning could support reconsidering
        it for the exercise.
    would_not_change:
    - id: noflip1
      if: APAN remains accessible and works well for planning and collaboration.
      why: Those facts alone do not change the separate requirement that the exercise, as designed, operate on a coalition
        network.
    watch_for:
    - id: watch1
      what: Whether regional partners have an active CENTRIXS-IANTN kiosk and can meet the stated account conditions.
      favors:
      - O1
      why: Limited partner readiness could make it prudent to confirm eligibility before relying on the selected network.
  lesson: Choose the network that fits the exercise's operational design and access restrictions, rather than assuming a successful
    planning platform is suitable for the exercise itself. Treat partner agreements and credential validation as conditions
    to verify, and account for partner access limitations without confusing them with the network's purpose.
  limits: This reasoning applies to the stated PANAMAX 18 network choice and its coalition-network design. It does not establish
    that CENTRIXS-IANTN is suitable for other exercises, that every partner qualifies for an account, or that APAN is inappropriate
    for planning.
