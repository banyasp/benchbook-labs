case:
  id: DR-CORPUS-NX-b6a7d193-E4@v1
  title: Setting the MNFS Targeting Priority
  status: draft
  setting: PANAMAX 18, during its final week, at the MNFS headquarters.
  decider: The small group convened during the final week of PANAMAX 18.
  agent: The small group convened during the final week of PANAMAX 18
  agent_role: decide
  situation: The MNFS was planning for a low-intensity counterinsurgency operation. After two repetitions, the lethal-led
    approach with nonlethal support was not producing the commander’s desired effects. Compartmentalized J-3 subdirectorates
    made course corrections difficult, and the JMD did not adequately provide for targeting expertise or integration of lethal
    and nonlethal fires. Staff representatives were not adequately prepared to contribute, and key inputs did not address
    information-environment requirements relevant to nonlethal effects. During the final week, a small group convened to develop
    contingency planning aligned with the operational approach and communications strategy.
  question: What should the small group convened during the final week of PANAMAX 18 do about the MNFS targeting priority?
  options:
    O1:
      do: The small group should prioritize nonlethal effects and use limited lethal effects in support.
      move: act
      irreversible: false
    O2:
      do: The small group should deprioritize nonlethal effects and retain a lethal-led approach.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: After two full repetitions, leading with lethal fires and using nonlethal enablers in support was not producing
      the MNFS commander’s desired effects.
  - id: F2
    kind: situation
    status: confirmed
    fact: Compartmentalized J-3 subdirectorates created stovepipes that made course corrections more difficult.
  - id: F3
    kind: capability
    status: confirmed
    fact: The PANAMAX 18 JMD did not require specific targeting expertise and did not adequately address integrating lethal
      and nonlethal fires.
  - id: F4
    kind: capability
    status: assessed
    fact: During Operation FUTURO NOBLE, staff representatives were not adequately prepared to contribute, and the J-35 and
      J-2 did not provide adequate forward-looking operational and enemy-situation inputs.
  - id: F5
    kind: situation
    status: assessed
    fact: The J-35 and J-2 did not address threats and requirements in the information environment relevant to nonlethal fires.
  - id: F6
    kind: situation
    status: confirmed
    fact: During the final week of PANAMAX 18, a small group convened to develop contingency operations nested in the operational
      approach and communications strategy.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The existing lethal-led priority had not produced the commander’s desired effects after two repetitions, giving a
      mission-based reason to change the approach.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The small group developed contingency operations nested in the operational approach and communications strategy;
      those plans drove the revised priority.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The staff’s inputs did not adequately address the operational and enemy situation over the relevant horizon or information-environment
      requirements. Those gaps obstructed the application of nonlethal effects.
  - id: C4
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Stovepipes and gaps in targeting expertise and integration made course correction difficult, supporting a revised,
      better-integrated approach rather than simply retaining the existing priority.
  reasoning:
    read: The decision is whether to change the targeting priority after the lethal-led approach failed to produce the desired
      effects, not whether to select targets or determine how effects are employed. The trap is to treat the prior priority
      as fixed despite the assessed lack of results and the planning gaps that hindered correction.
    weighing: The lethal-led approach failed to produce the desired effects, and the small group’s contingency planning aligned
      with the operational approach and communications strategy. That planning drove a revised approach placing nonlethal
      effects first with limited lethal effects in support, judged more appropriate for a low-intensity counterinsurgency
      operation. The staff and integration deficiencies reinforce the need to improve how the approach is informed and coordinated,
      but the decisive reasons for changing priority are the poor results of the lethal-led approach and the revised approach’s
      fit with the operation.
    tradecraft: Record the changed priority and its rationale, including the prior approach’s assessed results and the connection
      between the contingency planning and the operational approach and communications strategy. Follow through by codifying
      staff inputs and outputs and improving integration of lethal, nonlethal, intelligence, and assessment expertise.
    uncertainty: The revised approach was judged more appropriate, but its subsequent effectiveness is not established, and
      the record does not specify how the commander’s desired effects should be assessed. Review the decision against the
      operation’s purpose and update it as assessments change.
    handoff: The small group made the planning change; follow-through should involve the staff and component representatives
      whose inputs support targeting, with integrated lethal, nonlethal, intelligence, and assessment expertise. Improving
      those roles and capabilities is recommended, but no separate approval authority for this priority decision is identified.
    tempting_wrong:
      option: O2
      pull: The existing approach and staff battle rhythm may appear easier to preserve despite organizational shortcomings.
      why_wrong: Retaining the lethal-led priority would disregard the assessed failure to produce desired effects and the
        small group’s conclusion that a nonlethal-led approach better fit the low-intensity counterinsurgency operation.
    rejected:
      O2: The small group did not retain a lethal-led priority because the approach had not produced the commander’s desired
        effects and the revised contingency planning supported a better-fitting nonlethal-led approach.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent assessment established that the lethal-led approach was producing the commander’s desired effects and
        that the nonlethal-led approach was not advancing the mission.
      then: O2
      why: The stated basis for changing priority is that the prior approach was ineffective and the revised approach better
        fit the operation; reversing those assessments would remove that basis.
    would_not_change:
    - id: noflip1
      if: The headquarters corrected staffing or integration deficiencies but had no new evidence that the lethal-led approach
        was producing the desired effects.
      why: Those corrections would address barriers to course correction, but would not undo the assessed failure that motivated
        the change in priority.
    watch_for:
    - id: watch1
      what: Whether staff inputs address threats and requirements in the information environment relevant to nonlethal effects.
      favors:
      - O1
      why: The absence of these inputs was identified as a gap relevant to applying nonlethal effects.
  lesson: When an established priority repeatedly fails to produce the commander’s desired effects, reassess it against the
    operation’s purpose rather than preserving it by default. Align the revised priority with the operational approach and
    ensure staff expertise and inputs can support it.
  limits: This reasoning concerns the priority decision in the described low-intensity counterinsurgency planning context.
    It does not decide target selection, weapon employment, or what priority would be appropriate under different operational
    guidance or assessments.
