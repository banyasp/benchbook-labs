case:
  id: DR-CORPUS-NX-b14eb1ee-E1@v1
  title: Choosing a Communications-Security Research Path
  status: draft
  setting: At NSA, after its creation in 1952, during research into communications security for record traffic.
  decider: The chief of the Record and Data group
  agent: The chief of the Record and Data group
  agent_role: decide
  situation: One-time-tape systems were in use for communications security, but the scale and expense of managing their tapes
    limited their use to the most sensitive traffic. Those systems also offered traffic-flow security and worked directly
    with commercial circuits. NSA had jurisdiction over U.S. cryptography, and communication security for record traffic was
    a primary objective. The chief of the Record and Data group faced a choice about continued reliance on one-time-tape systems
    and research into electronic encryption for teletypewriter traffic. The requirements under consideration included affordability,
    unobtrusive integration, avoiding operational bottlenecks, and security commensurate with the protection period.
  question: What should the chief of the Record and Data group do about continued reliance on one-time-tape systems and research
    into an electronic alternative?
  options:
    O1:
      do: The chief of the Record and Data group rejects high-priority research and continues reliance on one-time-tape systems.
      move: act
      irreversible: false
    O2:
      do: The chief of the Record and Data group approves high-priority research into electronic encryption for teletypewriter
        traffic.
      move: act
      irreversible: false
    O3:
      do: The chief of the Record and Data group authorizes a limited feasibility study of electronic encryption for teletypewriter
        traffic.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Generating, certifying, and destroying one-time key tape, along with its distribution and accountability costs,
      limited one-time-tape systems to the most sensitive traffic.
  - id: F2
    kind: capability
    status: confirmed
    fact: The existing off-line tape system provided traffic-flow security and operated directly with commercial circuits.
  - id: F3
    kind: authority
    status: confirmed
    fact: Jurisdiction over U.S. cryptography was vested in NSA and extended to major players outside the Department of Defense.
  - id: F4
    kind: situation
    status: confirmed
    fact: Communication security for record traffic was a primary objective.
  - id: F5
    kind: situation
    status: confirmed
    fact: The chief of the Record and Data group initiated high-priority research into the viability of electronic encryption
      for teletypewriter traffic.
  - id: F6
    kind: situation
    status: confirmed
    fact: The contemplated system was to be affordable and inconspicuous, fit as an adjunct to the user's communications system,
      avoid time or operational bottlenecks, and provide a level of security commensurate with the protection period.
  - id: F7
    kind: situation
    status: confirmed
    fact: The replacement requirements included traffic-flow security and message security for all classifications of record
      traffic.
  considerations:
  - id: C1
    facts:
    - F1
    equity: resource_stewardship
    favors:
    - O2
    - O3
    weight: strong
    why: The scale and expense of managing one-time tape restricted its use to the most sensitive traffic, supporting research
      into an alternative for broader record-traffic protection.
  - id: C2
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: strong
    why: The existing system's traffic-flow security was valuable, and the replacement requirements expressly retained that
      capability while seeking message security for all classifications of record traffic.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: strong
    why: The proposed alternative was to be affordable and unobtrusive, avoid time or operational bottlenecks, and provide
      security commensurate with the protection period; assessing its viability directly addressed those requirements.
  - id: C4
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Because communications security for record traffic was a primary objective, the chief initiated high-priority research
      into whether electronic encryption could meet the stated need.
  reasoning:
    read: The choice is whether to investigate an electronic alternative, not whether to replace the tape systems immediately.
      The trap is to treat the tape systems' useful traffic-flow security as a reason to stop exploring alternatives, or to
      treat their management burden as proof that an untested alternative will meet the protection requirement.
    weighing: The tape burden limited the existing systems' reach, while traffic-flow security was a capability the replacement
      was meant to retain. The proposed affordability, integration, bottleneck, and protection-period requirements made viability
      research responsive to the record-traffic mission. The chief's high-priority research choice fits that balance; its
      force depends on whether an electronic alternative can meet the stated security and service requirements.
    tradecraft: Treat approval as authorization to assess viability, not as a finding that replacement is already warranted.
      Record the requirements being evaluated and the evidence supporting whether the alternative can satisfy them, including
      the stated security, usability, and traffic-flow objectives.
    uncertainty: The stated requirements identify what an electronic alternative would need to achieve, but do not establish
      that it ultimately met them or that it was less costly in practice.
    handoff: The chief of the Record and Data group held the research decision within NSA's cryptographic jurisdiction. No
      required referral is identified; involving appropriate technical and acquisition reviewers to assess the stated requirements
      is a prudent implementation step, not a stated part of the decision.
    tempting_wrong:
      option: O1
      pull: The existing tape systems already supplied traffic-flow security and worked directly with commercial circuits.
      why_wrong: Those advantages did not resolve the scale and expense that confined their use, and traffic-flow security
        was itself a requirement for the contemplated replacement.
    rejected:
      O1: The chief chose high-priority viability research rather than relying only on systems whose tape burden limited their
        use to the most sensitive traffic.
      O3: A limited feasibility study would address viability, but the stated response was to make that research high priority
        in light of the primary record-traffic security objective and the full set of requirements.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that no electronic alternative could meet security commensurate with the protection period
        while avoiding operational bottlenecks.
      then: O1
      why: If the stated viability requirements could not be met, high-priority research into that alternative would have
        less rationale and continued reliance on existing systems would be more defensible.
    - id: flip2
      if: The burden of generating, certifying, destroying, distributing, and accounting for tape were no longer materially
        limiting its use.
      then: O1
      why: A material reduction in the stated constraint would weaken the source's principal reason for pursuing an alternative.
    would_not_change:
    - id: noflip1
      if: The existing system's traffic-flow security remained valuable.
      why: That capability alone would not reverse the decision because traffic-flow security was included among the replacement
        requirements.
    watch_for:
    - id: watch1
      what: Evidence about whether the proposed alternative can satisfy affordability, unobtrusive integration, bottleneck
        avoidance, and protection-period security requirements.
      favors:
      - O2
      why: Those requirements define the viability question that the high-priority research was meant to address.
  lesson: When an existing system's management burden limits its reach, research into an alternative can be justified without
    presuming that replacement will succeed. Preserve valuable existing capabilities as requirements, and make the research
    answer whether the alternative can meet the mission's stated security and service needs.
  limits: This reasoning supports research into viability; it does not establish that an electronic system was technically
    successful, suitable for deployment, or preferable after evaluation. It also does not decide how the systems should be
    designed or operated.
