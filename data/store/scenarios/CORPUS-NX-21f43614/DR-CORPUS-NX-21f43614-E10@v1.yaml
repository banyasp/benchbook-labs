case:
  id: DR-CORPUS-NX-21f43614-E10@v1
  title: Uncertain Identity Under Fire
  status: draft
  setting: Skegg’s Branch near Wilson’s Creek, during the battle; Union field command
  decider: The Union field commander
  agent: The Union field commander
  agent_role: decide
  situation: At Skegg’s Branch, the Union field commander faced an approaching force whose identity was uncertain. The gray-clad
    troops had initially been mistaken for friendly troops, and smoke made distant objects difficult to distinguish. The circumstances
    had also led the commander to believe the opposing force might be retreating. A corporal was sent to challenge the approaching
    troops and was immediately shot and killed. Fire from the approaching force began, leaving the commander to decide whether
    to engage, disengage, or pause for further assessment.
  question: What should the Union field commander do after the challenger is shot and fire from the approaching force begins?
  options:
    O1:
      do: The Union Commander pauses engagement and reassesses the identity of the approaching troops.
      move: hold
      irreversible: false
    O2:
      do: The Union Commander orders the force to engage the approaching troops.
      move: act
      irreversible: true
    O3:
      do: The Union Commander orders the force to disengage from the approaching troops.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: The approaching troops were gray-clad and were initially mistaken for friendly troops.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The commander believed the opposing force might be retreating, based on the cessation of firing in another sector
      and other indications.
  - id: F3
    kind: situation
    status: assessed
    fact: Smoke made distant objects difficult to distinguish.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A body of troops moved down the valley from the direction where Union troops had last heard gunfire.
  - id: F5
    kind: situation
    status: confirmed
    fact: The commander was uncertain about the approaching troops’ identity and sent a corporal to challenge them.
  - id: F6
    kind: situation
    status: confirmed
    fact: The corporal was immediately shot and killed.
  - id: F7
    kind: situation
    status: confirmed
    fact: The approaching force opened fire on the Union position.
  - id: F8
    kind: capability
    status: confirmed
    fact: The commander had infantry and artillery under his command.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: 'The identity of the troops remained uncertain: gray clothing, smoke, and indications of retreat had encouraged a
      mistaken interpretation. Those circumstances favor reassessment, but they describe the situation before the challenge
      was answered.'
  - id: C2
    facts:
    - F5
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The commander had sent a challenger because identity was uncertain; the challenger was immediately shot. That lethal
      response sharply changed the assessment of the approaching force.
  - id: C3
    facts:
    - F7
    - F8
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The approaching force opened fire on the Union position, and the commander had infantry and artillery under command.
      The commander's recorded response was to order the force to engage.
  reasoning:
    read: This was a rapidly changing encounter in which earlier indications had suggested retreat, while smoke and gray clothing
      made identification difficult. The trap was allowing those earlier impressions to control the decision after the challenger
      was shot and the approaching force began firing.
    weighing: The initial uncertainty supports pausing to reassess {C1}. But the challenger's death and the force's fire supplied
      immediate evidence of danger that outweighed the earlier, uncertain belief that the opposing force might be retreating
      {C2} {C3}. The balance depends on those new hostile acts; the commander's recorded decision was to engage.
    tradecraft: Base the decision on the most current evidence, communicate the chosen course clearly, and preserve the reason
      for acting despite unresolved uncertainty. Do not treat an earlier assessment as settled when events materially change.
    uncertainty: The troops' identity was not clearly established before the encounter, and smoke impaired observation. The
      shot that killed the challenger and the force's opening fire reduced the practical uncertainty about whether the Union
      position faced an immediate threat, without proving the troops' identity.
    handoff: The field commander made the decision. No referral to a higher authority is identified; involving one would be
      an authored alternative, not part of the recorded decision.
    tempting_wrong:
      option: O1
      pull: The troops' identity was uncertain, visibility was poor, and the commander had reason to think the opposing force
        might be retreating.
      why_wrong: 'That interpretation did not account for the decisive change in the situation: the challenger was shot and
        the approaching force opened fire.'
    rejected:
      O1: A pause would preserve the earlier uncertainty but would not respond to the challenger's death and the force's opening
        fire.
      O3: Disengaging would leave the force's immediate attack unanswered, contrary to the commander's recorded choice to
        engage.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The challenger had not been shot and the approaching force had not opened fire, leaving only ambiguous indications
        of identity.
      then: O1
      why: Without the immediate hostile acts that changed the assessment, the unresolved identity and poor visibility would
        support pausing to reassess.
    would_not_change:
    - id: noflip1
      if: Smoke and uncertainty about identity continued after the challenger was shot and the force opened fire.
      why: Those conditions matter, but by themselves they would not erase the new evidence of an immediate attack.
    watch_for:
    - id: watch1
      what: Whether the approaching force continues to fire or the immediate hostile action ceases.
      favors:
      - O2
      - O1
      why: Continuing hostile action supports engagement; a material change in that action could support reassessment.
  lesson: When identity is uncertain, initial impressions should remain provisional. A lethal response to a challenge and
    fire on the position can materially change the decision and outweigh an earlier belief that the opposing force is retreating.
  limits: This reasoning concerns the commander's decision in this particular encounter, not a general legal rule for using
    force. It does not establish that every uncertain approach or every isolated shot warrants engagement.
