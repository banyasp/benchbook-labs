    episode_focus: The decision was whether to leave the staff in its existing organizational home or move it to a more central
      position. The stated reason was the staff’s contribution to establishing evidence of the Sino-Soviet dispute despite
      opposition within the agency and skepticism among policymakers; exclude operational work by the staff.
    cues:
      option_words:
        O1: 19
        O2: 19
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
