case:
  id: DR-CORPUS-NS-c0effa50-E15@v1
  title: Engaging During an Ambush
  status: draft
  setting: During an ambush involving a Ranger element; the location and time are not specified.
  decider: The corporal
  agent: The corporal
  agent_role: decide
  situation: A Ranger element is attempting to pass through an ambush. Some fellow Rangers are trapped, and enemy fire is
    directed into the area. The enemy is described as well-armed, and the corporal faces mortal danger. The corporal must
    choose whether to engage while the safety of fellow Rangers is at stake.
  question: What should the corporal do about engaging the enemy during the ambush?
  options:
    O1:
      do: The corporal disengages from the enemy during the ambush.
      move: act
      irreversible: true
    O2:
      do: The corporal engages the enemy during the ambush.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The trail element was attempting to push through the ambush.
  - id: F2
    kind: situation
    status: confirmed
    fact: Some fellow Rangers were trapped in the ambush.
  - id: F3
    kind: situation
    status: confirmed
    fact: Enemy fire was directed into the area.
  - id: F4
    kind: capability
    status: assessed
    fact: The enemy was described as well-armed.
  - id: F5
    kind: situation
    status: assessed
    fact: The corporal faced mortal danger.
  - id: F6
    kind: situation
    status: confirmed
    fact: The corporal's efforts were focused on keeping the team members safe.
  - id: F7
    kind: situation
    status: assessed
    fact: The corporal's concern was for fellow Rangers trapped in the ambush.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The corporal’s stated concern was for fellow Rangers trapped under enemy fire, and engaging served their safety.
  - id: C2
    facts:
    - F1
    - F2
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The stated purpose of the corporal’s actions was to protect his team and enable the trail element to pass through
      the ambush.
  - id: C3
    facts:
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The corporal faced mortal danger, a serious cost of engaging; nevertheless, he accepted that danger to protect his
      fellow Rangers.
  reasoning:
    read: The decision is whether to engage while fellow Rangers are trapped and enemy fire is directed into the area. The
      trap is allowing the corporal’s mortal danger to eclipse the immediate risk to his team, even though that personal danger
      is real.
    weighing: 'The account strongly favors {O2}: the corporal focused on keeping his team safe and acted out of concern for
      Rangers trapped in the ambush {C1}. His actions also enabled the trail element to continue through the ambush {C2}.
      His mortal danger weighs against engaging {C3}, but he accepted it for his comrades. The balance depends on the stated
      threat to the team and the need for the trail element to pass.'
    tradecraft: Keep the decision record focused on the choice to engage, the threat to fellow Rangers, the corporal’s personal
      risk, and the protective purpose. Do not infer rules of engagement, approval requirements, or operational details absent
      from the account.
    uncertainty: The passage gives no rules of engagement, authority framework, or alternatives beyond the choice framed here.
      It supports the corporal’s engagement in these circumstances, not a general rule to engage whenever personnel face danger.
    handoff: The account presents the corporal as making the decision; it identifies no required referral or separate approval
      authority. Any applicable command or legal authority would need to be established from information outside this account.
    tempting_wrong:
      option: O1
      pull: Disengaging avoids exposing the corporal to mortal danger.
      why_wrong: It would leave the stated danger to trapped fellow Rangers unanswered, contrary to the protective reason
        given for engaging.
    rejected:
      O1: The corporal did not disengage because engaging to protect trapped fellow Rangers and enable the trail element to
        pass was the reason for his action.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: There were no trapped fellow Rangers at risk and no enemy fire threatening the element.
      then: O1
      why: The reason for accepting the corporal’s personal danger—protecting trapped comrades—would no longer be present.
    would_not_change:
    - id: noflip1
      if: The corporal still faced mortal danger while fellow Rangers remained trapped and under enemy fire.
      why: That combination of danger and concern for fellow Rangers supports engagement; personal danger alone does not reverse
        the balance.
    watch_for:
    - id: watch1
      what: Whether fellow Rangers remain trapped and exposed to enemy fire.
      favors:
      - O2
      why: That is the central protective reason for the corporal’s decision.
  lesson: When choosing whether to engage, weigh the decision-maker’s personal danger against the immediate danger to fellow
    personnel and the stated purpose of protecting them. Personal risk matters, but here it does not outweigh the need to
    protect trapped comrades and help the element pass through the ambush.
  limits: This conclusion applies only to circumstances where fellow personnel are trapped under enemy fire and engagement
    is undertaken to protect them and help the element pass through the ambush. It does not establish rules of engagement,
    authority to use force, or a general requirement to engage in other circumstances.
