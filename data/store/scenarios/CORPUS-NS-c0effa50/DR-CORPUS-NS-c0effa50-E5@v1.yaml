case:
  id: DR-CORPUS-NS-c0effa50-E5@v1
  title: Reviewing an Investigation Draft
  status: draft
  setting: At a forward operating base, during an Army AR 15-6 investigation of a corporal’s death involving the 2nd Battalion
    and 75th Ranger Regiment.
  decider: The regimental commander
  agent: The regimental commander
  agent_role: decide
  situation: The Commander had directed an AR 15-6 investigation into a corporal’s death and received a battalion investigating
    officer’s draft. The draft included findings and diagrams and identified friendly fire, while the battalion commander
    considered it in need of editing. A major who reviewed the draft identified gaps concerning interviews and responsibility
    for splitting the platoon. The Commander’s review raised questions about whether the draft explained its conclusions and
    whether the incident involved friendly fire alone or also enemy fire. The scope of the inquiry was understood to include
    another soldier’s death and the wounding of two service members.
  question: What should the Commander do with the battalion investigator’s draft and the pending AR 15-6 inquiry?
  options:
    O1:
      do: The Commander returns the draft to the battalion investigator for revision and completion of the inquiry.
      move: act
      irreversible: false
    O2:
      do: The Commander rejects the battalion investigator’s draft and appoints a senior regimental investigator for the inquiry.
      move: act
      irreversible: false
    O3:
      do: The Commander approves the battalion investigator’s draft as the completed AR 15-6 inquiry.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The battalion investigator’s draft concluded that the incident resulted from friendly fire, but a major assessed
      that it did not fully address responsibility for splitting the platoon or that action’s role in the incident.
  - id: F2
    kind: capability
    status: assessed
    fact: The major assessed that the draft did not sufficiently address interviews about splitting the platoon and attributed
      the gaps to the investigating officer’s lack of experience.
  - id: F3
    kind: situation
    status: assessed
    fact: The battalion commander considered the draft in need of editing and finalization, while also believing its contents
      showed that the corporal died by friendly fire.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Commander considered the draft incomplete and insufficiently supported, with conclusions not clearly explained
      or supported by witness statements; he remained uncertain what happened and considered that friendly fire might have
      been mixed with enemy fire.
  - id: F5
    kind: situation
    status: assessed
    fact: The Commander understood that the inquiry should encompass not only the corporal’s death but also the death of an
      AMF soldier and the wounding of two service members.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Commander had wanted the battalion to begin the inquiry locally; the incident site was difficult to reach from
      regimental headquarters, a regimental investigator would take three to four days to reach it, and the battalion was
      already there.
  - id: F7
    kind: authority
    status: assessed
    fact: The Commander testified that he did not know Army regulations required a GCMCA to appoint the investigator or that
      the Army Safety Center had to be notified, and believed he was acting within his authority based on guidance from attorneys
      and a lieutenant colonel.
  - id: F8
    kind: capability
    status: assessed
    fact: The battalion commander selected the most senior battalion member available at the forward operating base as investigating
      officer and believed that officer was qualified.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The major agreed with the friendly-fire conclusion but found that the draft did not sufficiently address interviews
      about splitting the platoon, responsibility for that decision, or its role in the incident; he attributed the gaps to
      the investigator’s lack of experience.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: 'The regimental commander found the draft incomplete: it did not explain how its conclusions were reached, some assertions
      were unsupported by witness statements, and it still did not make clear what happened.'
  - id: C3
    facts:
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The commander considered that friendly fire might have been mixed with enemy fire and understood that the inquiry
      should cover the other soldier’s death and the wounding of two service members, not only the corporal’s death.
  reasoning:
    read: The issue at this decision point was whether the battalion draft was an adequate basis to complete the inquiry,
      not whether starting the inquiry locally had been expedient. The draft’s friendly-fire conclusion and the battalion
      commander’s view that it needed editing could make the remaining problem look merely editorial; the regimental commander
      instead saw unresolved substantive questions, unsupported conclusions, and a broader scope.
    weighing: The major’s identified gaps reinforced the regimental commander’s own assessment that the draft was not thorough
      or complete {C1} {C2}. The possibility of mixed enemy and friendly fire, together with the inquiry’s understood broader
      scope, made a more senior regimental investigation preferable to relying on the draft {C3}. The balance depended on
      the draft’s substantive support and coverage, not simply on its readability.
    tradecraft: 'Treat substantive gaps differently from editorial cleanup: record why the draft is insufficient, what scope
      the inquiry must address, and why the inquiry is being assigned for further investigation. Keep that review decision
      distinct from the earlier decision to begin locally.'
    uncertainty: The commander remained uncertain what had happened on the ground and whether friendly fire was mixed with
      enemy fire {C2} {C3}; the draft did not resolve that uncertainty to his satisfaction.
    handoff: The regimental commander should assign the further inquiry to a more senior regimental investigator, as he did,
      because he judged that a broader examination by someone more senior was needed.
    tempting_wrong:
      option: O1
      pull: The battalion commander considered the draft in need of editing and believed its contents showed that the corporal
        died by friendly fire {F3}.
      why_wrong: That view did not answer the regimental commander’s substantive concerns about unsupported conclusions, unclear
        events, and the scope of the inquiry {C2} {C3}.
    rejected:
      O1: Returning the draft for completion was not chosen because the commander judged that the deficiencies required further
        investigation by someone more senior, not merely editing.
      O3: Approval was not chosen because the commander did not consider the draft complete and found its conclusions insufficiently
        explained and supported.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The draft’s remaining shortcoming were only readability or final editing, while its conclusions were clearly explained,
        supported by the evidence, and adequate to the inquiry’s scope.
      then: O1
      why: With substantive concerns resolved, returning the draft for completion would address the remaining editorial work
        without the stated need for a broader, more senior investigation.
    would_not_change:
    - id: noflip1
      if: The incident site remained difficult to reach from regimental headquarters and the battalion was already there.
      why: Those circumstances explained the earlier decision to start the inquiry locally; they would not resolve the commander’s
        later concerns about the draft’s completeness and support.
    watch_for:
    - id: watch1
      what: Whether the inquiry clearly explains its conclusions, supports them with witness evidence, and addresses the full
        scope of deaths and injuries.
      favors:
      - O1
      - O3
      why: If those deficiencies are resolved, the principal reasons the commander gave for pulling the inquiry to the regimental
        level would be reduced.
  lesson: A draft that reaches a plausible conclusion is not necessarily a completed inquiry. When material responsibility,
    evidentiary support, or the scope of the matter remains unresolved, assess whether the work needs substantive further
    investigation rather than treating the problem as editorial.
  limits: This reasoning addresses the regimental commander’s review of a particular draft and his stated concerns about its
    completeness and support. It does not determine the underlying cause of the incident or decide what authority Army regulations
    required for the initial appointment.
