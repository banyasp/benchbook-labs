    domain: intel-analysis
    family: CORPUS-NX-012df560
    source: https://www.cia.gov/resources/csi/static/958abf8da8725522c18bc288f3bbf42d/Policymakers-Perspective-on-Intel.pdf
    episode_focus: He chose not to read National Intelligence Estimates or general-audience papers, while giving limited attention
      to the NID and relying on the President’s Daily Brief and customized analysis for relevant needs. The passage gives
      his reasons—time constraints, lack of policy cost for skipping the general products, and concern about press leaks—so
      exclude broader claims about what policymakers generally should read.
    cues:
      option_words:
