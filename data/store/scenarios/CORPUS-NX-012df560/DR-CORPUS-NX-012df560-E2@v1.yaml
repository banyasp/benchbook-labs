case:
  id: DR-CORPUS-NX-012df560-E2@v1
  title: Allocating Attention to Intelligence Products
  status: draft
  setting: National Security Council, 1989–90 tour
  decider: The NSC staff member
  agent: The NSC staff member
  agent_role: decide
  situation: During the 1989–90 NSC tour, an NSC staff member had a substantive policy schedule and limited time to stay informed.
    Intelligence agencies supplied National Intelligence Estimates and general-audience papers, as well as products tailored
    to particular policy needs. Some NSC staff members praised the NID, and the President read the President’s Daily Brief.
    The staff member also had concern that congressional readers could leak material to the press.
  question: What should the NSC staff member do about allocating limited attention to intelligence products?
  options:
    O1:
      do: The NSC staff member reads National Intelligence Estimates and general-audience papers alongside tailored analysis,
        the President’s Daily Brief, and the NID.
      move: act
      irreversible: false
    O2:
      do: The NSC staff member skips National Intelligence Estimates and general-audience papers, relying on tailored analysis,
        the President’s Daily Brief, and brief NID review.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The NSC staff member had limited time and needed help staying informed while carrying out a substantive schedule.
  - id: F2
    kind: situation
    status: assessed
    fact: The staff member considered intelligence products useful when tailored to the staff member’s substantive schedule.
  - id: F3
    kind: situation
    status: assessed
    fact: During the two-year NSC tour in 1989–90, the staff member read no National Intelligence Estimates.
  - id: F4
    kind: situation
    status: assessed
    fact: The staff member perceived no policy cost or penalty for not reading a National Intelligence Estimate.
  - id: F5
    kind: situation
    status: assessed
    fact: The staff member received general-audience papers but did not read them.
  - id: F6
    kind: situation
    status: assessed
    fact: The staff member believed some general-audience papers served desk specialists or policy officials without direct
      say on an issue.
  - id: F7
    kind: situation
    status: assessed
    fact: The staff member was interested in the President’s Daily Brief because the President read it.
  - id: F8
    kind: situation
    status: assessed
    fact: The staff member spent about 60 seconds a day on the NID and wanted advance awareness of material likely to be leaked
      to the press by congressional readers.
  - id: F9
    kind: situation
    status: assessed
    fact: Some NSC staff members praised the utility of the NID.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: With limited time and a substantive schedule, the staff member judged tailored analysis the useful way to stay informed
      and said there was no rational alternative to focusing on products suited to that schedule.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The staff member read no National Intelligence Estimates during the tour because, in that experience, not reading
      them carried no policy penalty and did not impede the most important work.
  - id: C3
    facts:
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: The staff member received but did not read general-audience papers, reasoning that some served desk specialists or
      officials without direct say on an issue and that production should be considered against its audience and cost.
  - id: C4
    facts:
    - F7
    - F8
    - F9
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: The staff member gave attention to the President’s Daily Brief because the President read it and spent about a minute
      daily on the NID to anticipate material congressional readers might leak, while not treating others’ praise of the NID
      as a reason for extensive reading.
  reasoning:
    read: This is an individual allocation of scarce attention in the face of a substantive policy schedule, not a judgment
      that the products lacked value for everyone. The trap is treating an agency’s effort, a paper’s polish, or other readers’
      praise as proof that every product deserves this staff member’s time; the staff member instead focused on usefulness
      to the work at hand {C1} {C3}.
    weighing: 'The decisive balance favors {O2}: tailored analysis supported the staff member’s schedule, and the staff member
      perceived no policy cost from skipping NIEs {C1} {C2}. General-audience papers could still serve other readers, but
      the staff member questioned their value against the time available {C3}. The PDB mattered because the President read
      it, while brief NID attention served advance awareness of possible press leaks {C4}. This balance depends on the staff
      member’s reported lack of policy penalty for skipping the broader products; it is not a general rule that such products
      are dispensable.'
    tradecraft: Allocate attention first to products tailored to the substantive schedule, retain the PDB and brief NID review
      for the stated reasons, and revisit the allocation if a broader product becomes directly relevant to an issue the staff
      member must handle. Recording the rationale and any changed policy costs would make the judgment reviewable.
    uncertainty: The account describes one staff member’s experience, not the value of these products to all NSC staff. It
      does not establish whether skipping a particular NIE or general paper could create a policy cost in a different issue
      or schedule {F6} {F9}.
    handoff: The account presents this as the staff member’s own allocation of reading time, so the decision can be made by
      that staff member; involving others would be useful if they identify a concrete policy need or cost not apparent from
      the staff member’s schedule.
    tempting_wrong:
      option: O1
      pull: Reading every product may seem safer because the agencies invested effort in them and some NSC staff praised the
        NID.
      why_wrong: The staff member expressly prioritized relevance to the substantive schedule and reported no policy penalty
        for skipping NIEs; broader effort or praise alone did not answer the time-allocation question.
    rejected:
      O1: The staff member did not choose to read the NIEs and general-audience papers because they did not appear necessary
        to the most important policy work and time was limited.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Skipping an NIE or general-audience paper would impose a concrete cost on the staff member’s substantive policy
        work.
      then: O1
      why: The reported absence of policy cost is central to the choice to skip these products; a concrete cost would weaken
        that reason and support reading them.
    - id: flip2
      if: A general-audience paper were directly relevant to an issue on which the staff member had a direct say.
      then: O1
      why: The staff member’s stated concern was the limited relevance of some papers to officials without direct say, so
        direct relevance would change the time-allocation balance.
    would_not_change:
    - id: noflip1
      if: The agency had invested more work in a product, made it more polished, or its author were a personal friend or colleague.
      why: The staff member said those considerations did not determine what was worth reading; relevance to the substantive
        schedule did.
    watch_for:
    - id: watch1
      what: Whether congressional readers are likely to leak material to the press.
      favors:
      - O2
      why: The staff member identified advance awareness of likely leaks as the reason for brief daily attention to the NID.
  lesson: When attention is scarce, prioritize information the decision-maker says is tailored to the substantive work, and
    weigh broader products against their actual policy cost rather than their prestige or production effort. Keep the decision
    tied to the individual’s responsibilities and revisit it when relevance or consequences change.
  limits: This reasoning reflects one staff member’s account of a particular NSC tour and does not establish that other officials,
    schedules, or issues can safely forgo the same products. It also does not assess the products’ general analytic value
    or the utility of the NID to other readers.
