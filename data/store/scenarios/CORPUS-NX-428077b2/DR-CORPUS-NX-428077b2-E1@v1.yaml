case:
  id: DR-CORPUS-NX-428077b2-E1@v1
  title: ARVN Force Posture After the SMM
  status: draft
  setting: South Vietnam, after November 1956, U.S. military assistance policy.
  decider: The military assistance advisory group.
  agent: The military assistance advisory group.
  agent_role: decide
  situation: The SMM closed in November 1956 after completing its mission. U.S. efforts in South Vietnam were expanding, and
    a CIA station was part of a growing State Department Country Team. The military assistance advisory group faced a choice
    about whether the ARVN should retain its village presence or be reorganized for conventional defense. An expected North
    Vietnamese invasion and the cooperative connection with South Vietnamese government and peasant communities were relevant
    stakes.
  question: What should the military assistance advisory group do about the ARVN's force posture after the SMM closed?
  options:
    O1:
      do: The military assistance advisory group removes the ARVN from villages and reconstructs it as a conventional force.
      move: act
      irreversible: false
    O2:
      do: The military assistance advisory group retains the ARVN's village presence as its force posture.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The SMM closed in November 1956 after accomplishing its mission.
  - id: F2
    kind: situation
    status: assessed
    fact: U.S. efforts in South Vietnam expanded substantially after the SMM closed.
  - id: F3
    kind: situation
    status: assessed
    fact: Bureaucratic involvement was increasing as U.S. efforts expanded.
  - id: F4
    kind: situation
    status: confirmed
    fact: The CIA established a station as part of a larger, growing State Department Country Team.
  - id: F5
    kind: situation
    status: confirmed
    fact: The ARVN had a presence in villages before the force was restructured.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A North Vietnamese invasion was expected.
  - id: F7
    kind: situation
    status: assessed
    fact: A cooperative connection with South Vietnamese government and peasant communities was a relevant political stake.
  considerations:
  - id: C1
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The stated rationale for restructuring was to prepare the ARVN for an expected North Vietnamese invasion. That concern
      supports conventional defense, but the political consequences weigh against it.
  - id: C2
    facts:
    - F5
    - F7
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Removing the ARVN from the villages severed the cooperative connection with South Vietnamese government and peasant
      communities. Preserving the village presence better protects that connection.
  - id: C3
    facts:
    - F1
    - F5
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Phillips judged that the ultimate U.S.–South Vietnamese defeat had effectively occurred with this change in posture;
      the loss of cooperation was central to that assessment.
  reasoning:
    read: 'After the SMM completed its mission, the MAAG shifted the ARVN from village presence to conventional defense against
      an expected invasion. The trap is treating that external threat as the only measure of success: the shift also lost
      cooperation with the government and peasantry.'
    weighing: The expected invasion provides a real, but weak, reason for {O1} {C1}. Greater weight goes to the lost cooperative
      connection and the judgment that defeat had effectively occurred at this point {C2} {C3}. On that assessment, retaining
      the village presence {O2} is the endorsed choice; the balance turns on the political connection being essential to success,
      not merely on conventional readiness.
    tradecraft: At decision level, state the invasion rationale and the political consequences side by side, record why one
      is given greater weight, and identify what evidence would prompt reconsideration. Do not treat bureaucratic expansion
      as a substitute for testing whether the chosen posture serves the broader policy purpose.
    uncertainty: The account gives a retrospective assessment, not a detailed comparison of the two postures or a quantified
      account of the invasion threat. It does not establish how much village presence alone could have preserved cooperation
      or changed the eventual outcome.
    handoff: The MAAG held the force-posture decision. Relevant Country Team and South Vietnamese perspectives should inform
      it because the policy's stated stakes included cooperation with South Vietnamese government and peasant communities.
    tempting_wrong:
      option: O1
      pull: Reconstructing the ARVN for conventional defense directly addressed the expected North Vietnamese invasion.
      why_wrong: The judgment is that this posture displaced the village connection and that the resulting loss of cooperation
        accompanied the strategic failure.
    rejected:
      O1: The conventional-defense rationale was outweighed by the loss of cooperation and the judgment that defeat had effectively
        occurred with the shift.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible assessment showed that conventional defense was indispensable to meeting the invasion threat and that
        retaining village presence could not adequately address it.
      then: O1
      why: The invasion rationale could then outweigh the political advantage attributed to retaining the village presence.
    would_not_change:
    - id: noflip1
      if: U.S. efforts continued to expand without evidence that the expansion preserved the cooperative connection.
      why: Expansion alone would not answer the central concern that the village connection was lost.
    watch_for:
    - id: watch1
      what: Whether the ARVN's posture sustains cooperation with South Vietnamese government and peasant communities.
      favors:
      - O2
      why: That cooperative connection is the central political stake in the assessment.
  lesson: Do not let preparation for a conventional threat become the sole test of a force posture when success also depends
    on political cooperation. Weigh the security rationale against the relationships the policy may preserve or destroy, and
    reconsider if the underlying threat or those relationships materially change.
  limits: This judgment rests on a retrospective account and the stated loss of cooperation; it does not establish that village
    presence would by itself have prevented defeat. It does not decide the proper posture under a different threat assessment
    or different evidence about the value of the village connection.
  library:
    domain: operational-command
    family: CORPUS-NX-428077b2
    source: https://www.cia.gov/resources/csi/static/24e660d94086d9484b7bc6c7164af648/Takes-on-Intel-Vietnam.pdf
