case:
  id: DR-CORPUS-NX-9e044791-E1@v1
  title: The Order to Use Force
  status: draft
  setting: Philippines, 1986, military
  decider: The fighter pilots
  agent: The fighter pilots
  agent_role: decide
  situation: In 1986, the president had stolen an election from his challenger. Two senior army officers shifted their allegiance,
    and two battalions followed them to military bases near Manila. Large crowds of unarmed civilians were present around
    the camps, and military forces sent against the soldiers had backed down in the face of the crowds. The fighter pilots
    received an order to use force against the camps. They faced the decision with civilian casualties as a stated concern.
  question: What should the fighter pilots do about the order to use force against the military camps?
  options:
    O1:
      do: The fighter pilots carry out the order to use force against the military camps.
      move: act
      irreversible: true
    O2:
      do: The fighter pilots refuse the order to use force against the military camps.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In 1986, the president stole an election from his challenger.
  - id: F2
    kind: situation
    status: confirmed
    fact: Two senior army officers shifted their allegiance, and two battalions of soldiers followed them as they barricaded
      themselves at military bases near Manila.
  - id: F3
    kind: situation
    status: confirmed
    fact: Large crowds of unarmed civilians were present around the military camps.
  - id: F4
    kind: situation
    status: confirmed
    fact: The president sent armored forces and other troops to attack the soldiers at the camps.
  - id: F5
    kind: situation
    status: confirmed
    fact: The military forces sent against the soldiers backed down in the face of the large crowds.
  - id: F6
    kind: authority
    status: confirmed
    fact: The fighter pilots received an order to use force against the military camps.
  - id: F7
    kind: situation
    status: assessed
    fact: The fighter pilots' stated concern was causing civilian casualties.
  considerations:
  - id: C1
    facts:
    - F3
    - F7
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The pilots' stated concern was causing casualties among the large crowds of unarmed civilians around the camps.
  - id: C2
    facts:
    - F1
    - F2
    equity: complicity_risk
    favors:
    - O2
    weight: weak
    why: The allegiance shift is framed as disaffiliation from a corrupt or illegitimate regime, not as joining an enemy;
      the president had stolen the election.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The order to use force came after ground forces sent against the soldiers had backed down in the face of the unarmed
      crowds, making the civilian danger central to the force decision.
  reasoning:
    read: 'This was an order to use force against soldiers who had shifted allegiance after a stolen election, with large
      crowds of unarmed civilians around the camps. The trap is to treat disobedience as simply siding with an enemy: disaffiliation
      from a corrupt or illegitimate regime is not going over to the enemy, and the people are not the enemy.'
    weighing: The strongest stated reason is the pilots' fear of causing civilian casualties {C1}. The stolen election and
      the framing of disaffiliation from an illegitimate regime also support refusal {C2}; the earlier backing down of ground
      forces amid the crowds reinforces the danger of using force {C3}. No legal test or finding that the order was unlawful
      is given, so the balance rests on the stated civilian concern and the political context, not a claimed legal ruling.
    tradecraft: Refuse the order and clearly record the stated concern about civilian casualties.
    uncertainty: The pilots' concern is stated, but the likelihood of casualties, any legal review, and any alternative authorization
      are not specified.
    handoff: The pilots made the refusal; no required referral or consultation is identified.
    tempting_wrong:
      option: O1
      pull: The pilots had received an order from the president to use force against the camps.
      why_wrong: The stated civilian-casualty concern weighs against carrying out the order, and disaffiliation from an illegitimate
        regime is not treated as joining an enemy.
    rejected:
      O1: The pilots did not carry out the order because they feared inflicting casualties on civilians.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The unarmed civilians were no longer around the camps and the pilots had no credible concern about civilian casualties.
      then: O1
      why: That would remove the pilots' stated reason for refusal; the account does not determine what they should do in
        that altered situation.
    would_not_change:
    - id: noflip1
      if: The order's political sponsor continued to claim that the soldiers were enemies.
      why: That label alone would not displace the distinction between disaffiliation from an illegitimate regime and going
        over to an enemy, or the stated concern for civilians.
    watch_for:
    - id: watch1
      what: Whether unarmed civilians are present around the camps and whether using force risks casualties among them.
      favors:
      - O2
      why: Civilian presence and fear of civilian casualties are the pilots' stated basis for refusing.
  lesson: A force order should not be treated as ethically decisive when carrying it out creates a serious concern about harm
    to unarmed civilians. In assessing refusal, distinguish disaffiliation from an illegitimate regime from allegiance to
    an enemy, and keep the stated civilian risk at the center of the decision.
  limits: The account does not establish a general legal rule for refusing military orders or determine whether this particular
    order was unlawful. Its reasoning is tied to the pilots' stated concern about civilian casualties and the described political
    and civilian context.
