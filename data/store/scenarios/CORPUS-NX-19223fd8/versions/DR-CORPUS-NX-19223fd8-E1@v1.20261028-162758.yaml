case:
  id: DR-CORPUS-NX-19223fd8-E1@v1
  title: Pre-Invasion Force Allocation
  status: draft
  setting: Ukraine, before the February 24 invasion, Ukrainian military leadership.
  decider: Ukrainian military leadership responsible for force allocation; no specific authorizing official is identified.
  agent: Ukrainian military leadership responsible for force allocation
  agent_role: decide
  situation: Before the invasion, Ukraine's strategic objective was to preserve its sovereign government, defeat the invasion,
    or at least minimize territorial loss. Ukraine shared a 3,058-kilometer land border with Russia and Belarus and had a
    much smaller military. Ukrainian leaders expected Russia's main attack to come from the east. They anticipated that a
    possible attack on Kyiv would come from Russia rather than Belarus, east of the Dnipro River. The 72nd Mechanized Brigade
    was severely understrength; one company had as few as 22 soldiers, and the brigade could not conduct a defense in depth
    along its extensive frontage.
  question: 'What should Ukrainian military leadership responsible for force allocation do with limited forces before the
    invasion: concentrate them in the east or commit more to border defense and Kyiv?'
  options:
    O1:
      do: Ukrainian military leadership should concentrate available forces in the east and commit fewer forces to border
        defense and Kyiv.
      move: act
      irreversible: false
    O2:
      do: Ukrainian military leadership should disperse available forces toward border defense and Kyiv and commit fewer forces
        to the east.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Ukraine's strategic goal was to maintain its sovereign government, defeat the invasion, or at least lose as little
      land as possible.
  - id: F2
    kind: situation
    status: confirmed
    fact: Ukraine shared a 3,058-kilometer land border with Russia and Belarus.
  - id: F3
    kind: capability
    status: assessed
    fact: Ukraine's military was much smaller than Russia's, and defending along the border was judged imprudent.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Ukrainian leaders expected Russia's main attack to come in the east.
  - id: F5
    kind: intelligence
    status: assessed
    fact: If Russian forces attacked Kyiv, Ukraine anticipated they would come from Russia rather than Belarus, east of the
      Dnipro River.
  - id: F6
    kind: capability
    status: confirmed
    fact: The 72nd Mechanized Brigade was severely understrength.
  - id: F7
    kind: capability
    status: confirmed
    fact: One company had as few as 22 soldiers.
  - id: F8
    kind: capability
    status: assessed
    fact: The brigade could not conduct a defense in depth along the extensive frontage.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: With a 3,058-kilometer border and a much smaller military, defending along the border was judged imprudent; concentrating
      scarce forces avoided attempting a defense the military could not prudently sustain.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Ukraine expected Russia's main attack in the east, supporting the plan to concentrate forces there rather than reduce
      the strength of the anticipated main effort.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The anticipated approach to Kyiv was from Russia, east of the Dnipro, not from Belarus; this expectation informed
      the decision to treat Kyiv's defense as an economy-of-force mission rather than distribute forces to cover every possible
      approach.
  - id: C4
    facts:
    - F6
    - F7
    - F8
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: The 72nd Mechanized Brigade was severely understrength and could not defend in depth across its extensive frontage,
      underscoring the limits on what additional force commitment to Kyiv could achieve.
  reasoning:
    read: Ukraine sought to preserve its sovereign government and minimize territorial loss, but its much smaller military
      could not prudently defend the long border everywhere. The trap is treating broader geographic coverage as stronger
      defense despite scarce forces and an assessed main attack from the east.
    weighing: 'The stated rationale favors concentrating forces in the east: defending along the full border was not prudent
      for the smaller military, and leaders expected Russia''s main attack there. The expectation that a Kyiv attack would
      come from Russia, east of the Dnipro, also supported an economy-of-force approach to the capital. The balance depends
      on those threat assessments and on the force shortfalls described; no legal rule or detailed allocation comparison is
      provided.'
    tradecraft: Record the allocation decision, its assumptions about the main attack and Kyiv's likely approach, and the
      force limitations that constrain the choice. Assign responsible staff to revisit those assumptions if the threat assessment
      or available force changes.
    uncertainty: The expected attack directions are assessments, not certainties. There are no probabilities, detailed comparisons
      of alternative allocations, or specific approval-process details, and the brigade could not conduct a defense in depth
      along its frontage.
    handoff: Ukrainian military leadership is responsible for force allocation, but no authorizing official is identified.
      As a decision practice, involve the relevant intelligence and force-planning staff to test the threat assumptions and
      feasibility; do not infer a specific approval chain from the available information.
    tempting_wrong:
      option: O2
      pull: Dispersing more forces toward border defense and Kyiv can appear to address the vulnerability of the capital and
        the extensive border.
      why_wrong: That approach conflicts with the assessment that border defense was imprudent for Ukraine's much smaller
        military and would pull forces away from the expected main attack in the east.
    rejected:
      O2: It was not chosen because the force-size and threat-direction assessments supported concentrating forces in the
        east rather than spreading them more widely.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable reassessment showed that the principal threat was instead a major attack on Kyiv from Belarus, rather than
        an eastern main attack.
      then: O2
      why: The allocation rationale depends substantially on the expected direction of the main attack and the anticipated
        approach to Kyiv.
    - id: flip2
      if: Ukraine had enough additional forces to reinforce border defense and Kyiv without making the eastern defense materially
        inadequate.
      then: O2
      why: The case for concentration rests partly on the military's limited size and the imprudence of trying to defend the
        long border; materially greater capacity could change that balance.
    would_not_change:
    - id: noflip1
      if: Leaders merely wished to cover more of the border, without changed threat assessments or materially greater force
        capacity.
      why: That preference alone would not resolve the concern that defending along the long border was imprudent for the
        much smaller military.
    watch_for:
    - id: watch1
      what: Changes in the assessed direction of Russia's main attack or in the anticipated approach to Kyiv.
      favors:
      - O2
      why: The allocation rationale relies on the expectation of an eastern main attack and a possible Kyiv attack from Russia
        rather than Belarus.
  lesson: When forces are too limited to defend every approach, allocate them against the assessed main threat rather than
    equating wider coverage with effective defense. Revisit that allocation when the threat assessment or the force available
    changes.
  limits: This reasoning applies to the pre-invasion allocation choice and the stated assessments of force size and attack
    direction. It does not establish that concentrating in the east is generally preferable, nor does it resolve other legal
    or operational questions.
