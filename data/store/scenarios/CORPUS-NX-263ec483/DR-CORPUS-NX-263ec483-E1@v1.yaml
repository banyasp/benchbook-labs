      with a national-level organization, after the Armed Forces Security Agency proved inadequate for central control of
      military cryptology and the needs of civilian agencies. Keep the focus on organizational policy and coordination; exclude
      operational collection or cryptanalytic methods, which this passage does not describe.
    cues:
      option_words:
