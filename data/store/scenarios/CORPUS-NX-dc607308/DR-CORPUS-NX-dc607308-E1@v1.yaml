case:
  id: DR-CORPUS-NX-dc607308-E1@v1
  title: Preemptive Defense of Fort Monroe
  status: draft
  setting: Yorktown, Fort Monroe, and Newport News; during Union–Confederate hostilities; Union command.
  decider: The Union commander
  agent: The Union commander
  agent_role: decide
  situation: Union command had information that Confederate forces had established two fortifications between Yorktown and
    Fort Monroe. The officers who received the information were impressed by it but wanted confirmation. The Union commander
    assessed that Confederate forces were planning an attack on Newport News. The commander also faced the prospect that the
    capture of Newport News would isolate Fort Monroe from Union resupply. The intelligence was considered solid.
  question: What should the Union commander do about the assessed Confederate plan to attack Newport News?
  options:
    O1:
      do: The Union commander declines a preemptive attack on the Confederate position.
      move: act
      irreversible: false
    O2:
      do: The Union commander authorizes a preemptive attack on the Confederate position.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Information available to Union command indicated that Confederate forces had established fortifications.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The fortifications were reported to be two in number and located between Yorktown and Fort Monroe.
  - id: F3
    kind: situation
    status: confirmed
    fact: The officers who received the information were impressed but wanted confirmation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Union commander assessed that Confederate forces were planning an attack on Newport News.
  - id: F5
    kind: situation
    status: assessed
    fact: The capture of Newport News would isolate Fort Monroe from Union resupply.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The intelligence available to the Union commander was considered solid.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The assessed consequence of losing Newport News was that Fort Monroe would be isolated from Union resupply, putting
      the Union position and its ability to sustain the mission at risk.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The commander assessed that Confederate forces were planning the attack that could produce that serious consequence,
      providing the stated threat-based reason for acting preemptively.
  - id: C3
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The officers' desire for confirmation reflects a reason for caution before acting on the reported fortifications
      and threat.
  - id: C4
    facts:
    - F1
    - F2
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The information included reports of two fortifications, and the intelligence supporting the commander's assessment
      was considered solid; this weighs against treating the threat as too uncertain to act on.
  reasoning:
    read: 'This is a decision about whether to act against an assessed plan before Newport News could be captured and Fort
      Monroe cut off from resupply. The trap is to treat the later defeat as proof that the preemptive decision itself was
      unsound: the source distinguishes solid intelligence from poor tactical execution.'
    weighing: The assessed plan and the prospect of isolation from resupply favor acting preemptively {C1} {C2}. The officers'
      wish for confirmation counsels caution {C3}, but the intelligence was considered solid {C4}. On the source's stated
      rationale, that balance supports O2; it depends on the assessment of the attack and its resupply consequence being credible.
    tradecraft: As decision practice, record the assessed threat, the consequence of inaction, the reliability judgment, and
      why the chosen course is preferred to declining it. Keep the decision rationale distinct from operational execution
      and reassess if the threat or its consequences change.
    uncertainty: The source characterizes the intelligence as solid but does not provide a probability, a deadline, or a legal
      standard for preemption. The reasoning therefore rests on the commander's stated assessment and the consequence of losing
      Newport News, not on a conclusion that the attack was legally required.
    handoff: The source places the assessment and order with the Union commander and identifies no required additional approval.
      As a general decision practice, the commander should draw on relevant intelligence and operational advice while retaining
      clear accountability for the choice.
    tempting_wrong:
      option: O1
      pull: Declining the preemptive attack could seem prudent because officers wanted confirmation and an attack carries
        risk.
      why_wrong: On the source's account, the commander had solid intelligence of a planned attack whose success would isolate
        Fort Monroe from resupply, so caution alone did not outweigh the stated threat.
    rejected:
      O1: The commander did not decline the preemptive attack because the assessed Confederate plan threatened to isolate
        Fort Monroe from Union resupply and the intelligence was considered solid.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The intelligence no longer supported a credible assessment that Confederate forces planned to attack Newport News.
      then: O1
      why: Without a credible assessed plan, the source's principal threat-based reason for preemption would be substantially
        weakened.
    - id: flip2
      if: Capturing Newport News would no longer threaten Fort Monroe's access to Union resupply.
      then: O1
      why: Removing the stated consequence that made the assessed attack consequential would weaken the source's rationale
        for acting preemptively.
    would_not_change:
    - id: noflip1
      if: The operation later ended in defeat while the intelligence remained solid.
      why: Defeat alone would not undo the source's distinction between solid intelligence and poor tactical execution, or
        by itself disprove the threat-based rationale at the decision point.
    watch_for:
    - id: watch1
      what: Whether the assessed Confederate plan and the risk to Fort Monroe's resupply remain credible.
      favors:
      - O2
      why: Those are the core threat and consequence supporting the source's choice; if either changes materially, the balance
        should be revisited.
  lesson: When reliable intelligence indicates an attack whose success could isolate a force from resupply, weigh the cost
    of waiting against the consequence of inaction. Judge the decision on the information and stakes at the time, and do not
    conflate its rationale with later execution.
  limits: The source gives no detailed legal rule, authority framework, civilian-impact assessment, or comparison of alternative
    courses beyond the choice to attack or decline. This reasoning does not establish that preemption is generally justified,
    or that the same choice would be warranted with less reliable intelligence or different consequences.
