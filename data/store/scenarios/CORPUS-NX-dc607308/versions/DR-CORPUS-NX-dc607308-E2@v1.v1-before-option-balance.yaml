case:
  id: DR-CORPUS-NX-dc607308-E2@v1
  title: Responding to Confederate Movement Toward Maryland
  status: draft
  setting: Union lines and the Maryland theater, June 1863, Union Army.
  decider: The Union Army commander
  agent: The Union Army commander
  agent_role: decide
  situation: In June 1863, the Union Army had intelligence that Confederate forces had passed through Culpeper bound for Maryland.
    The informant had lived at Culpeper and was familiar with the two Confederate corps described. The information identified
    more than a dozen regiments from those corps. A Union intelligence officer considered the information reliable, and Bureau
    records together with other available information corroborated the unit descriptions. Washington's security was a strategic
    stake in responding to the Confederate movement. The commander must decide whether to move the Union Army to shadow the
    Confederate forces, remain in place, or seek further corroboration.
  question: What should the Union Army commander do about the reported Confederate movement toward Maryland?
  options:
    O1:
      do: The Commander should request further corroboration from Union intelligence staff before moving the Union Army.
      move: ask
      irreversible: false
      to: Union intelligence staff
    O2:
      do: The Commander should move the Union Army to shadow the Confederate forces.
      move: act
      irreversible: false
    O3:
      do: The Commander should keep the Union Army in place rather than shadow the Confederate forces.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The informant had lived at Culpeper and was familiar with the two Confederate corps.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The intelligence placed the two Confederate corps passing through Culpeper bound for Maryland.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The informant identified more than a dozen separate regiments from the two Confederate corps.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A Union intelligence officer considered the informant's information reliable.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: Bureau records and all-source information corroborated the descriptions of the Confederate units.
  - id: F6
    kind: situation
    status: confirmed
    fact: Washington's security was a strategic stake in the response to the Confederate forces.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The report placed Confederate forces on a Maryland-bound movement, identified numerous units, was assessed as reliable,
      and its unit descriptions were corroborated. That evidence convinced the commander to act rather than treat the report
      as unverified.
  - id: C2
    facts:
    - F2
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Union movement shielded Washington from the Confederate forces, making the response directly relevant to Washington's
      security.
  - id: C3
    facts:
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The movement enabled Union forces to reach Gettysburg first and seize the ground that contributed significantly to
      victory.
  reasoning:
    read: 'This was a reported movement toward Maryland that the commander regarded as corroborated, not merely an untested
      account. The decision had strategic consequences: the movement protected Washington and helped Union forces secure advantageous
      ground at Gettysburg. The trap is treating delay for more confirmation as consequence-free after the information had
      already been corroborated.'
    weighing: The reliable, corroborated account supported action {C1}; the need to shield Washington and the value of reaching
      and holding the ground at Gettysburg strengthened the case for moving {C2} {C3}. The stated strategic benefits were
      the reasons the commander moved, and further corroboration was not described as necessary. The balance depends on the
      reported movement being credible and on the strategic value of responding in time.
    tradecraft: 'State the decision and its strategic basis in the record: the corroborated assessment of movement toward
      Maryland, Washington''s security, and the value of reaching Gettysburg first. Revisit the decision if material new information
      changes that assessment. This is decision-recording guidance, not a procedure stated by the source.'
    uncertainty: The source gives no quantified residual uncertainty. It says the unit descriptions were corroborated and
      that this convinced the commander, but does not address what further evidence might have changed the assessment.
    handoff: The Union Army commander made the decision. The source does not identify a required referral or additional approval
      authority; involving intelligence staff to reassess materially changed information is a prudent synthesis, not a stated
      requirement.
    tempting_wrong:
      option: O1
      pull: Seeking further corroboration can seem prudent when a major force movement is reported.
      why_wrong: The stated basis was that the information had already been corroborated and had convinced the commander;
        the resulting movement shielded Washington and helped secure the ground first.
    rejected:
      O1: Further corroboration was not chosen because the information had already been assessed as reliable and corroborated,
        and the commander acted on it.
      O3: Remaining in place was not chosen because the movement enabled the Union Army to shield Washington and reach Gettysburg
        first.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The unit descriptions were not corroborated and the report's reliability remained unresolved.
      then: O1
      why: Without corroboration to convince the commander, seeking further confirmation could become the preferable course.
    - id: flip2
      if: Reliable information instead showed that Confederate forces were not moving toward Maryland.
      then: O3
      why: The reported movement that gave the decision its strategic purpose would no longer support shadowing those forces.
    would_not_change:
    - id: noflip1
      if: Additional details emerged but did not weaken the corroborated assessment that Confederate forces were moving toward
        Maryland.
      why: 'The core basis for moving would remain: credible evidence of the movement and the strategic benefits of shielding
        Washington and reaching Gettysburg first.'
    watch_for:
    - id: watch1
      what: New information that materially undermines the reported route or the reliability of the assessment.
      favors:
      - O1
      why: It could remove the corroborated basis on which the commander acted and justify obtaining further confirmation.
  lesson: When credible, corroborated intelligence indicates a strategically significant movement, weigh the costs of delay
    against the concrete consequences of acting in time. Record the evidence and strategic purposes that support the decision,
    and reconsider if material information changes them.
  limits: This reasoning applies to the account of a corroborated Confederate movement and the stated strategic value of protecting
    Washington and reaching Gettysburg first. It does not establish a general rule to move on every report or resolve situations
    with different reliability, authority, or strategic stakes.
  library:
    domain: operational-command
    family: CORPUS-NX-dc607308
    source: https://www.cia.gov/resources/csi/static/6f73b7277dc7315abd223891b8fa585d/Black-Dispatches.pdf
    episode_focus: The commander acted after intelligence about the Confederate movement was corroborated, choosing to move
      in parallel while remaining out of view. Focus on the command decision and its stated strategic context, including shielding
      Washington; exclude the intelligence collection methods and movement mechanics.
