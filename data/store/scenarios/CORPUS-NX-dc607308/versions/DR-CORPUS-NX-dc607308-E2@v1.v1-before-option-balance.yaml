      option_words:
        O1: 15
        O2: 12
        O3: 15
      real_option: O2
      real_to_mean_other_length: 0.8
      real_is_longest: false
      moves:
        O1: ask
        O2: act
        O3: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
        O3: false
    equities: pilot2
