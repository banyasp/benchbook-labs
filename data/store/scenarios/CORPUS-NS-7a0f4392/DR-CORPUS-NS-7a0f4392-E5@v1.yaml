case:
  id: DR-CORPUS-NS-7a0f4392-E5@v1
  title: Testimony on Command Climate
  status: draft
  setting: A Navy ship, in the evening in the lieutenant's quarters, before an Article 38 grievance hearing.
  decider: The junior lieutenant asked by the executive officer
  agent: The junior lieutenant
  agent_role: decide
  situation: The executive officer has asked the lieutenant to testify about the command climate and the commanding officer's
    attitude in a grievance concerning the commanding officer's treatment of an enlisted person. The commanding officer has
    demanded loyalty and implied that he would learn who testified against him. The lieutenant regards the commanding officer's
    manner toward unit members as negative and condescending, and believes it has harmed morale, while also recognizing that
    the commanding officer accomplishes missions. The executive officer has said she is free to decline and has given her
    the night to consider. The lieutenant feels anxious about her career and guilty about putting her own interests first,
    and is weighing whether to provide testimony.
  question: What should the lieutenant do about providing testimony on the command climate and the commanding officer's attitude?
  options:
    O1:
      do: The lieutenant discloses testimony about the command climate and the commanding officer's attitude at the Article
        38 grievance hearing.
      move: act
      irreversible: true
    O2:
      do: The lieutenant withholds testimony about the command climate and the commanding officer's attitude at the Article
        38 grievance hearing.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The executive officer asked the lieutenant to testify about the general command climate and the commanding officer's
      attitude in a grievance concerning the commanding officer's treatment of an enlisted person.
  - id: F2
    kind: authority
    status: confirmed
    fact: The commanding officer announced the Article 38 grievance hearing, demanded loyalty, and said he would eventually
      find out who testified against him.
  - id: F3
    kind: situation
    status: assessed
    fact: The lieutenant believed the commanding officer treated unit members negatively and condescendingly, contributing
      to low morale.
  - id: F4
    kind: capability
    status: assessed
    fact: The lieutenant acknowledged that the commanding officer accomplished missions and saw no issue with his competence.
  - id: F5
    kind: situation
    status: confirmed
    fact: The executive officer said he did not want to pressure the lieutenant, told her she need not testify, and said he
      would treat no contact as a decision not to testify.
  - id: F6
    kind: situation
    status: confirmed
    fact: The lieutenant was a junior officer who had been at the unit for six months.
  - id: F7
    kind: situation
    status: assessed
    fact: The lieutenant felt career anxiety and guilt about thinking of herself first.
  - id: F8
    kind: situation
    status: assessed
    fact: The lieutenant viewed supporting the executive officer as the honorable course and believed that failing to support
      his efforts would amount to endorsing the commanding officer's behavior.
  considerations:
  - id: C1
    facts:
    - F3
    - F8
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: The lieutenant assessed the command climate as harmful to morale; given that assessment, withholding support would
      amount to endorsing the commanding officer's behavior.
  - id: C2
    facts:
    - F1
    - F3
    - F8
    equity: oversight_candor
    favors:
    - O1
    weight: strong
    why: After an honest appraisal, the lieutenant chose to support the executive officer's morally correct effort on the
      unit's behalf by testifying.
  - id: C3
    facts:
    - F2
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The commanding officer's demand for loyalty and implied threat, combined with the lieutenant's junior status and
      career anxiety, make withholding testimony personally safer. Those pressures create a real dilemma, but are not sufficient
      reason to remain silent.
  - id: C4
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Silence would set a bad precedent for the lieutenant's future choices and a bad example for peers; testifying was
      the honorable course she wanted to take.
  - id: C5
    facts:
    - F7
    equity: due_process
    favors:
    - O1
    weight: weak
    why: If the lieutenant received an unjust fitness report, she could petition the Board of Correction of Naval Records
      to have it removed, although success would be difficult.
  reasoning:
    read: This is a choice between supporting a grievance inquiry with an honest assessment of command climate and avoiding
      personal career risk under a demand for loyalty. The trap is treating loyalty to the commanding officer, or fear of
      consequences, as a reason to disregard the lieutenant's own assessment of his conduct.
    weighing: The decisive reasons are the lieutenant's honest appraisal, her belief that the executive officer was pursuing
      the morally correct course on the unit's behalf, and her judgment that silence would endorse the commanding officer's
      behavior {C1} {C2}. Career pressure remains real, but she regarded testimony as honorable, wanted to avoid an irresponsible
      precedent, and knew there was a route to challenge an unjust fitness report {C3} {C4} {C5}. The balance depends on her
      good-faith assessment of the command climate, not on whether the commanding officer was competent at accomplishing missions.
    tradecraft: Give testimony limited to what the lieutenant can honestly support about the command climate and the commanding
      officer's attitude. Keep a contemporaneous record of the basis for her account and distinguish firsthand observations
      from conclusions. This is practical guidance, not a procedure specified in the case.
    uncertainty: The lieutenant could not know how testimony would affect her career, and challenging an unjust fitness report
      would be an uphill battle. She nevertheless chose to testify after her honest appraisal.
    handoff: The lieutenant should make the choice herself rather than treating either the commanding officer's demand or
      the executive officer's request as deciding it for her. The executive officer gave her time and said she need not answer
      if she chose not to testify.
    tempting_wrong:
      option: O2
      pull: Withholding testimony may seem to protect a junior officer's career and comply with the commanding officer's demand
        for loyalty.
      why_wrong: Given her honest assessment, silence would amount to endorsing the commanding officer's behavior and would
        be an easy, irresponsible course.
    rejected:
      O2: She did not withhold testimony because she judged that silence would endorse the commanding officer's behavior and
        fail to support the executive officer's morally correct effort on the unit's behalf.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: An honest appraisal instead gave the lieutenant no basis to support the allegations about the command climate or
        the commanding officer's attitude.
      then: O2
      why: The endorsement of testimony rests on her honest appraisal supporting the executive officer; without that basis,
        the reason for testifying would not apply.
    would_not_change:
    - id: noflip1
      if: The commanding officer continues to accomplish missions and is regarded as competent.
      why: The lieutenant recognized his competence and still concluded that supporting the executive officer was the honorable
        course.
    watch_for:
    - id: watch1
      what: Career anxiety and the commanding officer's implied threat are weighing on the lieutenant's judgment.
      favors:
      - O2
      why: These pressures make withholding seem safer, but the endorsed choice rests on her appraisal of the conduct and
        the consequences of silence, not on avoiding personal risk.
  lesson: When asked to support a grievance, assess the conduct honestly rather than treating a superior's demand for loyalty
    as decisive. If silence would endorse behavior judged wrong and undermine a morally correct effort, the case's lesson
    is to take the honorable course despite personal career anxiety.
  limits: This conclusion depends on the lieutenant's honest appraisal supporting the allegations and on the specific choice
    described in the case. It does not establish a general legal duty to testify or resolve how to respond when testimony
    would be inaccurate or unsupported.
