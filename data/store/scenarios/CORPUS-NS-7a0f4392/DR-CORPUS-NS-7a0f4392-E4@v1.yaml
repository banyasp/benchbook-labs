case:
  id: DR-CORPUS-NS-7a0f4392-E4@v1
  title: The Classified Package Recommendation
  status: draft
  setting: United States, during the 1980–1988 Iran-Iraq war; U.S. government policy process.
  decider: The major responsible for the recommendation
  agent: The major responsible for the recommendation
  agent_role: decide
  situation: During the Iran-Iraq war, U.S. policymakers sought to pressure Iran and decided to assist Iraq. The government
    was considering delivery of a classified military package to Iraq. The major had recommended against delivery, assessing
    that it could create a risk to U.S. forces and strengthen a potential future adversary. The CIA and the major’s superior
    favored assistance, and the superior ordered the major to revise the recommendation. The major considered that senior
    officials might have information he lacked and worried about disloyalty and career consequences.
  question: What should the major do when ordered by his superior to revise his recommendation on delivery of the classified
    package?
  options:
    O1:
      do: The major asks the superior to clarify the order before revising the recommendation.
      move: ask
      irreversible: false
      to: the superior
    O2:
      do: The major revises the recommendation to approve delivery of the classified package.
      move: act
      irreversible: false
    O3:
      do: The major maintains the recommendation to reject delivery of the classified package.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: During the 1980–1988 Iran-Iraq war, the United States sought to pressure Iran and decided to assist Iraq.
  - id: F2
    kind: situation
    status: confirmed
    fact: The United States was considering delivery of a classified military package to Iraq.
  - id: F3
    kind: situation
    status: confirmed
    fact: The major had recommended against delivery of the package.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The major assessed that delivery could create a risk to U.S. and allied forces and bring a potential future adversary's
      capabilities closer to those of the United States.
  - id: F5
    kind: situation
    status: confirmed
    fact: The CIA pressured the major to change his recommendation, and the major's superior appeared to share the agency's
      position.
  - id: F6
    kind: authority
    status: confirmed
    fact: The major's superior ordered him to modify the recommendation.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The major considered that his superior and the agency might have more information about the situation than he did.
  - id: F8
    kind: situation
    status: assessed
    fact: The major worried that standing by his recommendation could appear disloyal and put his career at risk.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: The major assessed that delivery could put U.S. and allied forces at risk and strengthen a potential future adversary.
      He stood by that assessment rather than change the recommendation against delivery.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: Officers are ordinarily expected to carry out directions even when they lack the full picture, and senior officials
      might have information the major did not. When unsure, an officer should seek clarification and the truth of the matter,
      rather than assume either that the superior is right or that the order is improper.
  - id: C3
    facts:
    - F3
    - F4
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Trained officers are expected to recognize potentially improper directions and act when necessary. If conscientious
      truth-seeking establishes that the superior is wrong, the officer should discuss the matter with the superior and seek
      resolution, not alter an assessment he still believes is sound.
  - id: C4
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The pressure, concern about appearing disloyal, and career risk are real, but they do not establish that the major's
      assessment is mistaken or justify changing it for personal protection.
  reasoning:
    read: This is a policy recommendation under a superior's direction, with genuine uncertainty about whether senior officials
      know more and a serious assessed risk to U.S. forces. The trap is treating hierarchy and possible career consequences
      as proof that the major should abandon his professional judgment, or treating his own incomplete information as proof
      that the superior is wrong.
    weighing: Ordinary deference to orders and the possibility of superior knowledge support clarification and truth-seeking
      {C2}. But the major had a concrete assessment of risk and continued to believe the recommendation should oppose delivery
      {C1}. The applicable rule is to make a conscientious effort to establish whether the superior is acting appropriately,
      then discuss the matter and seek resolution if the major establishes that the superior is wrong {C3}. On the stated
      facts, the balance supports standing by the recommendation, not revising it merely under pressure or from fear for his
      career {C4}. The Office of the Secretary of Defense later disapproved the superior's recommendation on essentially the
      same grounds as the major's.
    tradecraft: State the basis for the assessment clearly and distinguish what is known from what remains uncertain. Seek
      clarification and examine all relevant facts before treating a disagreement as settled; do not change the recommendation
      solely to satisfy pressure. Preserve an accurate account of the recommendation and the basis for it.
    uncertainty: The major recognized that senior officials might have more information, and officers may face decisions requiring
      more knowledge and experience than they have. The available facts do not establish that this information gap was resolved
      before the major refused, so the decision should not be read as a general license to disregard a superior's direction.
    handoff: Do not decide in isolation when the matter exceeds the major's knowledge or experience. Discuss it with the senior
      and, as appropriate, the base judge advocate, chaplain, and trusted peers to broaden perspective.
    tempting_wrong:
      option: O2
      pull: The superior and agency favored assistance, might have had more information, and the major feared disloyalty and
        career consequences.
      why_wrong: Those considerations warrant clarification and careful truth-seeking, not an unsupported reversal of the
        major's risk assessment. The endorsed outcome was that he stood by his recommendation; the senior later sent a recommendation
        under the senior's own name.
    rejected:
      O1: Clarification and consultation are important when in doubt, but the endorsed outcome at the decision point was that
        the major continued to stand by his refusal rather than make clarification the final course.
      O2: He did not revise to approve delivery because he continued to judge the risk to U.S. forces unacceptable, and the
        reviewing office later reached essentially the same conclusion.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: After truth-seeking, the major still lacks material information needed to assess whether the superior is acting
        appropriately.
      then: O1
      why: An officer who is in doubt should seek clarification immediately and consider all facts before deciding the superior
        is wrong.
    - id: flip2
      if: Reliable additional information establishes that the superior is acting appropriately and removes the major's basis
        for opposing delivery.
      then: O2
      why: The officer's response depends on seeking the truth and determining whether the superior is acting appropriately;
        the particular changed facts here are hypothetical.
    would_not_change:
    - id: noflip1
      if: The major remains worried about appearing disloyal or about personal career consequences, without new facts that
        alter the merits.
      why: Those pressures do not resolve whether the recommendation is sound, and the endorsed outcome was that he stood
        by it.
    watch_for:
    - id: watch1
      what: Whether a conscientious review of all facts supports the superior's position or instead confirms the major's concern.
      favors:
      - O1
      - O3
      - O2
      why: Truth-seeking and testing whether the superior is acting appropriately are central to the officer's response.
  lesson: When an officer is unsure whether a superior's direction is proper, the officer should seek clarification, test
    the matter against all available facts, and consult others when needed. If that conscientious effort shows the superior
    is wrong, the officer should raise the concern and seek resolution rather than change a sound recommendation out of pressure
    or fear.
  limits: This conclusion concerns a recommendation the major believed posed a serious risk and a superior's direction to
    alter it; it does not establish that every disagreement with a superior justifies refusal. Officers are normally expected
    to carry out orders, and the line between ordinary uncertainty and an improper order may not be clear.
