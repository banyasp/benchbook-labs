case:
  id: DR-VINCENNES-1988-restyle1@v1
  title: Decision to Engage Unidentified Aircraft [restyle]
  status: needs_review
  setting: USS Horizon, Strait of Hormuz, 3 July 1988
  decider: the Commanding Officer of USS Horizon
  agent: the Commanding Officer of USS Horizon
  agent_role: decide
  situation: While the vessel was exchanging fire with hostile small boats, the ship's radar picked up an aircraft climbing
    at low altitude toward the hull on a trajectory that deviated from the normal commercial corridor. The aircraft ignored
    spoken challenges and transmitted an IFF Mode II-1100 signal, historically linked to Iranian fighter jets. No electronic
    signatures were detected from the contact. From the moment of detection to the decision point the CO had roughly three
    minutes and forty seconds, with under a minute left when the plane entered a ten-mile radius.
  question: How should the Commanding Officer respond to the aircraft he assesses as hostile?
  options:
    O1:
      do: Authorize the ship's weapons to fire on the approaching aircraft.
      move: act
      irreversible: true
    O2:
      do: Hold fire and do not engage the approaching aircraft.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The CO concluded the inbound plane posed a hostile threat to both his own vessel and the adjacent USS Montgomery.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The contact was flying beneath the typical cruise altitude for civilian traffic and deviated from the established
      airway corridor.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Spoken challenges directed at the aircraft went unanswered.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The plane transmitted a Mode II-1100 IFF reply, a signal historically linked to Iranian F-14 fighters.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Electronic support measures detected no emissions emanating from the contact.
  - id: F6
    kind: situation
    status: confirmed
    fact: From the instant the radar pick-up occurred to the moment a decision was required, roughly three minutes and forty
      seconds passed, leaving under a minute as the aircraft closed to a ten-mile radius.
  - id: F7
    kind: situation
    status: confirmed
    fact: While the CO was simultaneously directing fire against IRGC small craft, his attention to the aerial picture was
      constrained.
  - id: F8
    kind: authority
    status: confirmed
    fact: The applicable ROE authorized engagement of any aircraft deemed hostile that presented an immediate danger.
  - id: F9
    kind: situation
    status: assessed
    fact: Data from the command-and-decision system contradicted CIC briefings about whether the aircraft was climbing or
      descending.
  - id: F10
    kind: capability
    status: assessed
    fact: The CO relied on the Anti-Air Warfare coordinator's judgment that the contact was hostile.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: tempo
    favors:
    - O1
    weight: strong
    why: With only about three minutes and forty seconds from detection to decision, and under a minute left as the contact
      entered ten miles, the CO faced extreme time pressure that demanded an immediate action.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The low-altitude, off-airway flight path, failure to answer verbal challenges, emission of a hostile IFF code, and
      lack of electronic signatures together signaled an intent to attack the ship.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The applicable Rules of Engagement explicitly authorized engagement of a hostile aircraft presenting an imminent
      threat, which the CO judged to be the case.
  - id: C4
    facts:
    - F10
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The CO relied on the Anti-Air Warfare coordinator's five-year track record and training, using that judgment as the
      basis for action.
  - id: C5
    facts:
    - F9
    equity: record_integrity
    favors:
    - O1
    weight: weak
    why: Although the command-and-decision system indicated a different altitude trend than CIC reports, the CO deemed the
      CIC's verbal account more credible given the combat stress and limited time.
  reasoning:
    read: The CO confronted a contact that matched the profile of an Iranian F-14—low-level, off-airway, silent on emissions,
      and transmitting a hostile IFF code—while his ship was under surface attack. The principal danger lay in possibly misidentifying
      a civilian aircraft under severe time constraints.
    weighing: The compressed timeline, multiple hostile cues, and clear ROE permission outweighed any data inconsistencies;
      confidence in the AAW coordinator's assessment further reinforced the threat picture, leading to the decision to fire.
    tradecraft: The action was documented in the vessel's after-action report, citing reliance on the AAW coordinator, the
      limited decision window, and the applicable ROE, with all communications logged per standard naval protocol.
    uncertainty: A conflict existed between the command-and-decision system showing an ascent and CIC reports describing a
      descent, and only a brief Mode II IFF signal was received, but these uncertainties were judged secondary to the overall
      threat assessment.
    handoff: The CO exercised delegated authority and did not seek higher-level approval, as the ROE allowed immediate self-defense.
    tempting_wrong:
      option: O2
      pull: Refraining from fire could prevent the accidental loss of civilian lives.
      why_wrong: Given the imminent danger to the ship and the absence of positive identification, withholding fire would
        have left the vessel and USS Montgomery vulnerable to a likely hostile strike.
    rejected:
      O2: The CO concluded the aircraft was hostile based on altitude, IFF, lack of response, and ROE, and the brief decision
        interval offered no viable alternative to safeguard his force.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The command-and-decision system had reliably shown the aircraft ascending and no descending reports were received.
      then: O2
      why: Relying on the C&D system as intended could have led the CO to refrain from engaging the contact.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Future scenarios where extreme time pressure prevents thorough verification of a target's identity.
      favors:
      - O1
      why: Rapid decision-making under combat stress justifies dependence on the strongest threat indicators and the authorized
        ROE.
  lesson: When a credible hostile threat appears under severe time compression, commanders must act on the most compelling
    indicators and the authorized ROE to protect their force, even if some data remain ambiguous.
  limits: This reasoning applies only when the threat is judged imminent and the ROE explicitly permits self-defense; it does
    not extend to situations where positive civilian identification is achievable or where sufficient time exists for further
    verification.
