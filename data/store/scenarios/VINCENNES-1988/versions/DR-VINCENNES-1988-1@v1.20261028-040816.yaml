case:
  id: DR-VINCENNES-1988-1@v1
  title: Decision to Engage Unidentified Aircraft
  status: draft
  setting: USS Vincennes, Persian Gulf, July 1988
  decider: the commanding officer of USS Vincennes
  agent: the commanding officer
  agent_role: decide
  situation: 'At the decision point, the commanding officer of USS Vincennes had identified an approaching aircraft (track
    TN 4131) that appeared to be heading toward his ship and the nearby USS Montgomery. The aircraft was observed at a low
    altitude, off the normal airway centerline, and did not answer verbal warnings. It was squawking a Mode II-1100 IFF code
    historically linked to Iranian fighter aircraft, while no electronic emissions were detected. The officer''s attention
    was focused on an ongoing surface engagement with Iranian boats, leaving limited time—about three minutes and forty seconds—from
    first detection to the need to act. Conflicting data existed: the ship''s command and decision system showed the aircraft
    ascending and lacking Mode II IFF, whereas CIC reports indicated a descending, hostile aircraft. The Rules of Engagement
    permitted engagement of an aircraft assessed as hostile and unresponsive within the ship’s defensive perimeter.'
  question: What should the commanding officer do regarding the approaching aircraft?
  options:
    O1:
      do: The commanding officer fires on the aircraft.
      move: act
      irreversible: true
    O2:
      do: The commanding officer withholds fire on the aircraft.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The commanding officer believed the aircraft was hostile and a threat to USS Vincennes and USS Montgomery.
  - id: F2
    kind: situation
    status: confirmed
    fact: Approximately three minutes and forty seconds elapsed from first awareness of the aircraft to the decision point.
  - id: F3
    kind: situation
    status: assessed
    fact: The commanding officer's attention was occupied with an ongoing surface engagement against IRGC boats, limiting
      personal verification of the aircraft.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The aircraft was observed at a low altitude, lower than typical commercial flights, and was not on the airway centerline.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The aircraft did not respond to verbal warnings and was squawking Mode II-1100, historically associated with Iranian
      F‑14s.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: No electronic emissions were detected from the aircraft.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Rules of Engagement authorized engagement of an aircraft assessed as hostile and not responding to warnings
      within the ship’s defensive perimeter.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The ship’s command and decision system showed the aircraft ascending and lacking Mode II IFF, while CIC reports
      indicated descending altitude and Mode II IFF.
  considerations:
  - id: C1
    facts:
    - F7
    - F1
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Rules of Engagement explicitly authorized engagement of an aircraft assessed as hostile and unresponsive within
      the ship’s defensive perimeter, and the CO believed the aircraft was hostile.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Only about three minutes and forty seconds elapsed from detection to decision, and the CO’s attention was occupied
      with a surface battle, leaving insufficient time for further verification.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The aircraft was flying at low altitude, off the airway centreline, not responding to warnings, and squawking a Mode II‑1100
      code historically linked to Iranian fighters, all indicating hostile intent.
  - id: C4
    facts:
    - F1
    - F3
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The CO felt a responsibility to protect USS Vincennes and the nearby USS Montgomery from a perceived imminent attack.
  - id: C5
    facts:
    - F7
    equity: oversight_candor
    favors:
    - O1
    weight: weak
    why: The investigation determined the incident was not the result of negligent or culpable conduct, indicating the decision
      complied with standards.
  reasoning:
    read: The CO faced an aircraft (TN 4131) that appeared to be hostile—low altitude, off‑airway, non‑responsive, and emitting
      a military IFF code—while simultaneously fighting Iranian small‑craft. Conflicting sensor data (ascending vs. descending)
      and limited time created a classic fog‑of‑war dilemma.
    weighing: The source weighed the ROE compliance (C1), the extreme time compression (C2), the hostile indicators (C3),
      and the duty to protect the task group (C4). These considerations collectively outweighed the uncertainty from conflicting
      data (C5). The balance, as the investigation stated, favored immediate engagement.
    tradecraft: The CO recorded the engagement in the ship’s action report, logged the missile launch in the combat system,
      and filed the incident for later review per standard naval procedure.
    uncertainty: There was a discrepancy between the command‑and‑decision system (showing ascent and no Mode II IFF) and CIC
      reports (showing descent and Mode II‑1100). The CO relied on the latter, judged more credible under the circumstances.
    handoff: The decision was made by the CO alone, but he depended on the Anti‑Air Warfare Coordinator and Tactical Information
      Coordinator for threat assessment, as permitted by the ROE.
    tempting_wrong:
      option: O2
      pull: The desire to obtain additional verification and avoid harming civilians.
      why_wrong: Delaying would have left the ship exposed to a potential missile or suicide attack, violating the ROE’s imminent‑threat
        requirement.
    rejected:
      O2: Withholding fire would have ignored the immediate hostile indicators and the CO’s duty to protect his ship and the
        task group.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the decision window had been longer than one minute, allowing additional verification of the aircraft’s identity
      then: O2
      why: More time would have reduced the urgency and allowed the CO to seek clearer identification, potentially avoiding
        civilian loss.
    would_not_change:
    - id: noflip1
      if: the command‑and‑decision system continued to show conflicting altitude data while CIC reports indicated hostile
        behavior
      why: The source held that the CO’s reliance on CIC assessments was appropriate given the combat context.
    watch_for:
    - id: watch1
      what: future incidents where reliable IFF or radar data conclusively identify a civilian aircraft
      favors:
      - O2
      why: Clear, corroborated civilian identification would negate the hostile‑intent assessment and require restraint.
  lesson: When an imminent aerial threat is identified under severe time compression, commanders must act on the most credible
    hostile indicators and the authorized Rules of Engagement, even if some sensor data conflict.
  limits: This rule applies only when the threat is assessed as hostile, the ROE permits engagement, and the decision window
    is extremely short; it does not extend to situations with ample time for identification or unambiguous civilian IFF signals.
