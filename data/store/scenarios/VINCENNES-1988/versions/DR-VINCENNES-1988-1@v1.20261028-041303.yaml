case:
  id: DR-VINCENNES-1988-1@v1
  title: Decision to Engage Unidentified Aircraft Near USS Vincennes
  status: draft
  setting: USS Vincennes, Persian Gulf, 3 July 1988, US Navy
  decider: the commanding officer of USS Vincennes
  agent: the commanding officer
  agent_role: decide
  situation: The ship's combat information center detected an aircraft (track 4131) approaching at low altitude and off the
    normal airway. The aircraft did not answer verbal warnings and was squawking a Mode II code historically linked to Iranian
    fighter jets. No electronic emissions were detected, and the crew received reports that the aircraft was descending and
    accelerating toward the vessel. The commanding officer was simultaneously managing a surface engagement with hostile small
    craft and had only about three minutes and forty seconds from initial detection to decide. The Rules of Engagement allowed
    engagement of a hostile aircraft under these conditions, though the ship's command and decision system showed conflicting
    altitude data. Iranian fighter activity and heightened threat warnings had been issued for the period.
  question: What should the commanding officer do regarding the approaching aircraft?
  options:
    O1:
      do: The commanding officer fires on the aircraft.
      move: act
      irreversible: true
    O2:
      do: The commanding officer refrains from firing on the aircraft.
      move: act
      irreversible: false
    O3:
      do: The commanding officer requests further identification before acting.
      move: ask
      irreversible: false
      to: the anti‑air warfare coordinator
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The commanding officer believed the aircraft was hostile and a threat to his ship and USS Montgomery.
  - id: F2
    kind: situation
    status: confirmed
    fact: The aircraft was detected at low altitude, heading directly toward the ship and not on the airway centerline.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The aircraft did not respond to verbal warnings.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The aircraft squawked Mode II-1100, historically associated with Iranian F‑14s.
  - id: F5
    kind: capability
    status: confirmed
    fact: No electronic emissions were detected from the aircraft.
  - id: F6
    kind: situation
    status: confirmed
    fact: Approximately three minutes and forty seconds elapsed from first detection to decision while the ship was engaged
      with surface threats.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Rules of Engagement permitted engagement of a hostile aircraft under the circumstances.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The ship's command and decision system showed the aircraft ascending, while crew reports indicated descending altitude.
  - id: F9
    kind: situation
    status: confirmed
    fact: Iranian fighter activity and warnings of increased hostile activity had been issued for the period.
  - id: F10
    kind: authority
    status: confirmed
    fact: The investigation later concluded the commanding officer acted prudently with no negligent conduct.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F9
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The aircraft was low‑altitude, off the airway, not responding to warnings, squawking a code linked to Iranian fighters,
      and no emissions were detected, indicating a hostile intent toward the ship.
  - id: C2
    facts:
    - F7
    - F10
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Rules of Engagement expressly authorized engagement of a hostile aircraft under these conditions, and the investigation
      concluded the CO acted within lawful authority.
  - id: C3
    facts:
    - F6
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Only about three minutes and forty seconds elapsed from detection to decision while the ship was also fighting surface
      threats, creating a severe time‑compression that required an immediate response.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Although the command‑and‑decision system showed the track ascending, crew reports of descending altitude were deemed
      more reliable under the circumstances.
  - id: C5
    facts:
    - F1
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The CO believed the aircraft threatened both USS Vincennes and the accompanying USS Montgomery, making protection
      of the task‑group a paramount mission objective.
  reasoning:
    read: The situation presented a rapidly approaching aircraft that exhibited multiple indicators of hostile intent, yet
      the data were partially contradictory and the decision window was under a minute.
    weighing: The source weighted the threat indicators (C1), the explicit ROE permission (C2), and the urgent time pressure
      (C3) heavily in favor of fire. The minor uncertainty about altitude (C4) was considered insufficient to override the
      dominant factors. Protecting the task‑group (C5) further tipped the balance toward engagement.
    tradecraft: The CO documented the verbal warnings, IFF reports, and crew observations in the ship’s action report, then
      authorized missile launch per the ROE and recorded the decision in the command log.
    uncertainty: The primary uncertainty lay in the conflicting altitude data, but the source judged the crew’s real‑time
      assessment more credible than the system display.
    handoff: The decision was made by the commanding officer alone, relying on the anti‑air warfare coordinator’s briefings;
      no higher authority was consulted because the ROE delegated authority to the CO in this time‑critical context.
    tempting_wrong:
      option: O3
      pull: A desire to obtain further identification before firing, given the data conflict.
      why_wrong: The source deemed that waiting would have exceeded the narrow decision window and exposed the ships to imminent
        attack.
    rejected:
      O2: Withholding fire would have ignored the clear hostile indicators and violated the ROE.
      O3: Further identification was impracticable within the sub‑minute window and would have jeopardized the safety of the
        vessels.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: reliable positive identification confirmed the aircraft was a civilian airliner
      then: O2
      why: A confirmed civilian status would remove the hostile intent assessment, making engagement unlawful.
    would_not_change:
    - id: noflip1
      if: the aircraft continued to descend and close within ten miles without responding
      why: The threat would remain imminent, preserving the justification for fire.
    watch_for:
    - id: watch1
      what: future intelligence that the Mode II‑1100 signal was a false emission or that the aircraft was a non‑hostile training
        flight
      favors:
      - O2
      why: Such information would undermine the hostile intent assessment.
  lesson: In high‑tempo naval engagements, commanders must rely on the best available threat indicators and authorized ROE
    to make rapid lethal decisions, even when sensor data are partially contradictory.
  limits: This reasoning applies only when the decision window is extremely short, the threat is assessed as hostile, and
    the ROE explicitly permit engagement; it does not extend to situations where clear civilian identification is available
    or where ample time permits additional verification.
