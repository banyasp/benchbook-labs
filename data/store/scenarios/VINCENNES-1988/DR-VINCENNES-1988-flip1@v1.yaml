case:
  id: DR-VINCENNES-1988-flip1@v1
  title: Decision to Engage Unidentified Aircraft [flip]
  status: needs_review
  setting: USS Valor, Strait of Hormuz, 12 June 1988
  decider: the Commanding Officer of USS Valor
  agent: the Commanding Officer of USS Valor
  agent_role: decide
  situation: While engaged in a surface skirmish with hostile craft, the ship's radar picked up an aircraft climbing away
    at low altitude, off the normal commercial airway. The pilot ignored verbal challenges, and the transponder emitted a
    Mode II-1100 code historically linked to Iranian military jets. No electronic emissions were detected. The CO had roughly
    three minutes and forty seconds from first contact to the decision point, with less than a minute remaining when the aircraft
    entered a ten-mile radius. The Rules of Engagement allowed engagement of a hostile aircraft that presented an imminent
    threat, and the CO consulted the anti-air warfare (AAW) coordinator's assessment.
  question: What should the Commanding Officer do with the approaching aircraft he believes may be hostile?
  options:
    O1:
      do: The Commanding Officer fires on the aircraft.
      move: act
      irreversible: true
    O2:
      do: The Commanding Officer withholds fire on the aircraft.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The CO was convinced that the inbound plane posed a hostile danger to both his vessel and the adjacent USS Independence.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The plane maintained an altitude beneath that of normal commercial traffic and deviated from the established airway
      corridor.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Verbal challenge attempts received no reply from the aircraft.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Its transponder emitted a Mode II-1100 code, a signal historically linked to Iranian F-14 fighters.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Electronic support measures recorded no emissions emanating from the aircraft.
  - id: F6
    kind: situation
    status: confirmed
    fact: From the moment the contact was first spotted until the decision moment about three minutes and forty seconds passed,
      leaving under a minute before the aircraft closed to a ten-mile radius.
  - id: F7
    kind: situation
    status: confirmed
    fact: While the CO was occupied with a surface clash against IRGC craft, his capacity to monitor the aerial picture was
      constrained.
  - id: F8
    kind: authority
    status: confirmed
    fact: The applicable ROE permitted firing on any hostile aircraft that presented an immediate danger.
  - id: F9
    kind: situation
    status: assessed
    fact: The C&D system displayed a continuous increase in altitude, and its logs contain no record of a decrease.
  - id: F10
    kind: capability
    status: assessed
    fact: He placed confidence in the AAW coordinator's judgment that the aircraft was hostile.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The short window left the CO with little time to verify the target, increasing the risk of a mistaken engagement.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Although the aircraft's altitude, airway deviation, lack of response, and IFF code suggest hostility, the continuous
      climb shown by the C&D system undermines the inference of an imminent attack.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The ROE permits engagement only when a hostile aircraft presents an imminent threat; the climb indicates the aircraft
      is not on an attack trajectory.
  - id: C4
    facts:
    - F10
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The CO values the AAW coordinator's judgment but gives greater weight to the objective altitude trend that contradicts
      a hostile intent.
  - id: C5
    facts:
    - F9
    equity: record_integrity
    favors:
    - O2
    weight: weak
    why: The command-and-decision system consistently recorded a climb, and with no contradictory descent reports, the data
      integrity supports treating the track as non-threatening.
  reasoning:
    read: The CO confronted an aircraft that, while exhibiting some hostile signatures, was climbing away from the ship, offering
      no clear indication of an imminent attack. The rapid decision window limited verification, but the reliable altitude
      trend from the C&D system reduced the probability of a hostile strike.
    weighing: Time pressure (C1) and the AAW coordinator's input (C4) are outweighed by the aircraft's climb (C2, C3, C5),
      which together suggest the threat is not imminent. Consequently, withholding fire best preserves force safety and compliance
      with ROE.
    tradecraft: The decision was logged in the ship's action report, citing the C&D altitude trend, ROE analysis, and the
      CO's judgment to refrain from engagement.
    uncertainty: Although the IFF code and lack of response remain concerning, the unambiguous climb data provides a stronger
      indicator that the aircraft is not preparing an attack.
    handoff: The CO acted under delegated authority; no higher-level clearance was required because the ROE did not compel
      engagement without an imminent threat.
    tempting_wrong:
      option: O1
      pull: Engaging could eliminate a possible hostile aircraft before it could strike.
      why_wrong: The climb data shows the aircraft is moving away, making an attack unlikely; firing risks harming a non-threatening
        aircraft and violating proportionality.
    rejected:
      O1: Given the clear altitude increase and lack of an imminent threat, the CO concluded that restraint best protects
        both the ship and potential civilian lives.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The command-and-decision system had reliably shown the aircraft descending and no climbing reports were received.
      then: O1
      why: Had the CO observed a descent trend, the track would have matched the classic attack profile, justifying engagement.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Future encounters where extreme time compression limits verification of target identity.
      favors:
      - O1
      why: Rapid decision-making under combat stress can pressure commanders to rely on the strongest threat cues and authorized
        ROE.
  lesson: When a contact exhibits mixed indicators, commanders should give decisive weight to reliable sensor data that clarifies
    intent; a clear climb away from the vessel can outweigh other hostile cues, prompting restraint under ROE.
  limits: This guidance applies only when sensor data demonstrates a non-threatening trajectory and the ROE does not demand
    engagement; it does not cover situations where a confirmed hostile IFF or other definitive evidence of an imminent attack
    is present.
