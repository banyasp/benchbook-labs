case:
  id: DR-VINCENNES-1988-1@v1
  title: Decision to Engage Unidentified Aircraft
  status: draft
  setting: USS Vincennes, Persian Gulf, 3 July 1988
  decider: the Commanding Officer of USS Vincennes
  agent: the Commanding Officer of USS Vincennes
  agent_role: decide
  situation: The ship's Commanding Officer detected an approaching aircraft that was climbing toward the vessel at low altitude
    and not on the expected airway. The aircraft did not respond to verbal warnings and emitted an IFF Mode II-1100 code associated
    with Iranian military aircraft. No electronic emissions were detected from the track. The CO had about three minutes and
    forty seconds from detection to decision, with less than one minute remaining when the aircraft entered ten miles. Simultaneously,
    the ship was engaged in surface combat with hostile small craft, drawing the CO's attention. The Rules of Engagement permitted
    engagement of a hostile aircraft presenting an imminent threat, and the CO relied on AAW coordinator reports and his own
    assessment of the threat.
  question: What should the Commanding Officer do with the approaching aircraft he believes hostile?
  options:
    O1:
      do: The Commanding Officer fires on the aircraft.
      move: act
      irreversible: true
    O2:
      do: The Commanding Officer withholds fire on the aircraft.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Commanding Officer believed the aircraft was hostile and a threat to his ship and USS Montgomery.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The aircraft was flying at a lower altitude than typical commercial flights and was off the airway centerline.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The aircraft did not respond to verbal warnings.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The aircraft was reported to be squawking Mode II-1100, historically correlated to Iranian F‑14s.
  - id: F5
    kind: intelligence
    status: assessed
    fact: No electronic emissions (ESM) were detected from the aircraft.
  - id: F6
    kind: situation
    status: confirmed
    fact: Approximately three minutes and forty seconds elapsed from detection to the decision point, with less than one minute
      remaining when the aircraft was within ten miles.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Commanding Officer was simultaneously engaged in a surface combat against IRGC boats, limiting his attention
      to the air picture.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Rules of Engagement authorized engagement of a hostile aircraft presenting an imminent threat.
  - id: F9
    kind: situation
    status: assessed
    fact: The command and decision system data conflicted with CIC reports regarding the aircraft's altitude trend.
  - id: F10
    kind: capability
    status: assessed
    fact: The Commanding Officer trusted the Anti‑Air Warfare coordinator's assessment of the aircraft as hostile.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The CO had only about three minutes and forty seconds from detection to decision, with less than one minute remaining
      when the aircraft entered ten miles, creating extreme time compression that required an immediate response.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The aircraft was flying low, off the commercial airway, did not answer verbal warnings, emitted an IFF Mode II‑1100
      code associated with Iranian military aircraft, and gave no electronic emissions, all indicating a hostile intent toward
      the ship.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Rules of Engagement expressly authorized engagement of a hostile aircraft presenting an imminent threat, which
      the CO judged the track to be.
  - id: C4
    facts:
    - F10
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The CO placed confidence in the Anti‑Air Warfare coordinator’s assessment, which was based on five years of experience
      and training, and relied on that judgment to act.
  - id: C5
    facts:
    - F9
    equity: record_integrity
    favors:
    - O1
    weight: weak
    why: Although the command‑and‑decision system data conflicted with CIC reports on altitude trend, the CO judged the CIC’s
      verbal reports more credible given the combat stress and time pressure.
  reasoning:
    read: The CO faced an aircraft that appeared to be an Iranian F‑14 on a low‑altitude, off‑airway trajectory, not responding
      to warnings, and emitting a hostile IFF code, all while his ship was under surface attack. The trap was the possibility
      of misidentifying a civilian airliner under extreme time pressure.
    weighing: Severe time compression, multiple hostile indicators, and explicit ROE permission were decisive; confidence
      in the AAW coordinator reinforced the threat picture; data conflict was deemed insufficient to override the imminent‑threat
      assessment. Together these considerations led to the endorsement of fire.
    tradecraft: The decision was recorded in the ship’s action report, noting the reliance on AAW coordinator input, the time
      window, and the ROE citation. All communications were logged per standard naval procedure.
    uncertainty: There was a discrepancy between the command‑and‑decision system showing ascent and CIC reports describing
      descent, and only a single brief Mode II IFF signal, but these were considered secondary to the overall threat perception.
    handoff: The CO acted alone under delegated authority; no higher‑level approval was required because the ROE allowed immediate
      self‑defense.
    tempting_wrong:
      option: O2
      pull: Withholding fire might avoid the tragic loss of civilian lives.
      why_wrong: Given the imminent threat to the ship and the lack of positive identification, not firing would have exposed
        the vessel and the accompanying USS Montgomery to a likely hostile attack.
    rejected:
      O2: The CO judged the aircraft hostile based on altitude, IFF, lack of response, and ROE, and the short decision window
        left no viable alternative to protect his force.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The command‑and‑decision system had reliably shown the aircraft ascending and no descending reports were received.
      then: O2
      why: Had the CO relied on the C&D system as designed, he might not have engaged the track.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Future engagements where extreme time compression limits verification of target identity.
      favors:
      - O1
      why: Rapid decision‑making under combat stress justifies reliance on the strongest threat indicators and authorized
        ROE.
  lesson: When a credible hostile threat emerges under severe time compression, commanders must act on the strongest available
    indicators and authorized ROE to protect their force, even if some data are ambiguous.
  limits: This reasoning applies only when the threat is assessed as imminent and the ROE explicitly permits self‑defense;
    it does not extend to situations where positive civilian identification is achievable or where sufficient time exists
    for additional verification.
