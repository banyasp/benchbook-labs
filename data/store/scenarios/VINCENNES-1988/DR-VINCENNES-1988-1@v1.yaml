    domain: military-operational
    family: VINCENNES-1988
    source: https://archive.org/download/DTIC_ADA203577/DTIC_ADA203577.pdf
    episode_focus: Whether the commanding officer should fire on the approaching unidentified track he believed hostile, within
      minutes and amid a surface engagement, or hold fire and try to identify it further.
    cues:
      option_words:
        O1: 7
        O2: 8
      real_option: O1
      real_to_mean_other_length: 0.88
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
