case:
  id: DR-VINCENNES-1988-revise1@v1
  title: Decision to Engage Unidentified Aircraft [revise]
  status: needs_review
  setting: USS Vincennes, Persian Gulf, 3 July 1988
  decider: the Commanding Officer of USS Vincennes
  agent: the Commanding Officer of USS Vincennes
  agent_role: decide
  situation: The ship's Commanding Officer detected an approaching aircraft that was climbing toward the vessel at low altitude
    and not on the expected airway. The aircraft did not respond to verbal warnings and emitted an IFF Mode II-1100 code associated
    with Iranian military aircraft. No electronic emissions were detected from the track. The CO had about three minutes and
    forty seconds from detection to decision, with less than one minute remaining when the aircraft entered ten miles. Simultaneously,
    the ship was engaged in surface combat with hostile small craft, drawing the CO's attention. The Rules of Engagement permitted
    engagement of a hostile aircraft presenting an imminent threat, and the CO relied on AAW coordinator reports and his own
    assessment of the threat.
  question: What should the Commanding Officer do with the approaching aircraft he believes hostile?
  options:
    O1:
      do: The Commanding Officer fires on the aircraft.
      move: act
      irreversible: true
    O2:
      do: The Commanding Officer withholds fire on the aircraft.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Commanding Officer believed the aircraft was hostile and a threat to his ship and USS Montgomery.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The aircraft was flying at a lower altitude than typical commercial flights and was off the airway centerline.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The aircraft did not respond to verbal warnings.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The aircraft was reported to be squawking Mode II-1100, historically correlated to Iranian F‑14s.
  - id: F5
    kind: intelligence
    status: assessed
    fact: No electronic emissions (ESM) were detected from the aircraft.
  - id: F6
    kind: situation
    status: confirmed
    fact: Approximately three minutes and forty seconds elapsed from detection to the decision point, with less than one minute
      remaining when the aircraft was within ten miles.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Commanding Officer was simultaneously engaged in a surface combat against IRGC boats, limiting his attention
      to the air picture.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Rules of Engagement authorized engagement of a hostile aircraft presenting an imminent threat.
  - id: F9
    kind: situation
    status: assessed
    fact: The command and decision system data conflicted with CIC reports regarding the aircraft's altitude trend.
  - id: F10
    kind: capability
    status: assessed
    fact: The Commanding Officer trusted the Anti‑Air Warfare coordinator's assessment of the aircraft as hostile.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The CO had only about three minutes and forty seconds from detection to decision, with less than one minute remaining
      when the aircraft entered ten miles, creating extreme time compression that required an immediate response.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The aircraft was flying low, off the commercial airway, did not answer verbal warnings, emitted an IFF Mode II‑1100
      code associated with Iranian military aircraft, and gave no electronic emissions, all indicating a hostile intent toward
      the ship.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Rules of Engagement expressly authorized engagement of a hostile aircraft presenting an imminent threat, which
      the CO judged the track to be.
  - id: C4
    facts:
    - F10
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The CO placed confidence in the Anti‑Air Warfare coordinator’s assessment, which was based on five years of experience
      and training, and relied on that judgment to act.
  - id: C5
    facts:
    - F9
    equity: record_integrity
    favors:
    - O2
    weight: weak
    why: The conflict between the command-and-decision system and CIC reports creates significant uncertainty about the aircraft's
      trajectory; under such ambiguity the prudent course is to withhold fire to avoid potential civilian casualties.
  - id: C6
    facts:
    - F4
    - F5
    - F3
    equity: civilian_protection
    favors:
    - O2
    weight: strong
    why: The IFF Mode II-1100 signal is not definitive proof of hostility and the lack of electronic emissions leaves open
      the possibility that the track is a civilian aircraft; the precautionary principle therefore requires withholding fire.
  reasoning:
    read: The CO observed a low-altitude aircraft off the airway that failed to respond to warnings, emitted a non-conclusive
      IFF code, and produced conflicting altitude data, all while engaged with surface threats.
    weighing: Uncertainty about the aircraft's identity and the risk to civilians outweigh the tempo pressure; the strong
      civilian-protection consideration (C6) and the weak uncertainty consideration (C5) together tip the balance toward restraint.
    tradecraft: The decision is documented with reference to the conflicting sensor data, the IFF ambiguity, and the applicable
      ROE, noting the CO's choice to withhold fire pending clearer identification.
    uncertainty: Disparate altitude trends from the C&D system versus CIC reports, combined with a single brief IFF pulse,
      generate a high level of doubt about hostile intent.
    handoff: The CO retains sole authority under ROE but explicitly records the decision to defer engagement pending further
      verification.
    tempting_wrong:
      option: O1
      pull: Firing might eliminate a genuine threat and protect the ship instantly.
      why_wrong: Given the ambiguous identification, firing could result in unlawful civilian deaths, violating the principle
        of distinction.
    rejected:
      O1: The CO should withhold fire because the available indicators do not conclusively establish hostility and the risk
        to civilian lives outweighs the compressed decision window.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C5
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: If the aircraft descended below 5,000 ft and transmitted a civilian transponder code.
      then: O1
      why: Clear evidence of civilian status would shift the assessment to a hostile intent, prompting engagement.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Future engagements where extreme time compression limits verification of target identity.
      favors:
      - O1
      why: Rapid decision-making under combat stress justifies reliance on the strongest threat indicators and authorized
        ROE.
  lesson: When identification is ambiguous, commanders must prioritize the precautionary principle and civilian protection
    over rapid engagement, even under severe time pressure.
  limits: This guidance applies only in situations where sensor data are conflicting or inconclusive; it does not preclude
    immediate fire when positive hostile identification is established.
