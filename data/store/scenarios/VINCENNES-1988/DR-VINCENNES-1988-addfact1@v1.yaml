case:
  id: DR-VINCENNES-1988-addfact1@v1
  title: Decision to Engage Unidentified Aircraft [addfact]
  status: needs_review
  setting: USS Vincennes, operating in the Persian Gulf on 3 July 1988
  decider: USS Vincennes' Commanding Officer
  agent: USS Vincennes' Commanding Officer
  agent_role: decide
  situation: The ship's radar detected an aircraft climbing toward Vincennes at low altitude, off the centreline of the expected
    airway. The transponder was squawking Mode II-1100, a code historically linked to Iranian F-14s, while electronic support
    measures recorded no emissions. Verbal challenges received no reply. The contact lasted roughly three minutes and forty
    seconds, and when the aircraft entered a ten-nautical-mile radius the commander had less than a minute to decide. Concurrently,
    Vincennes was engaged in a surface fight with IRGC boats, dividing the CO's attention. The crew was on a standard twelve-hour
    watch. The Rules of Engagement permit use of force against a hostile aircraft that presents an imminent threat, but the
    ship's command-decision system reported an altitude trend that conflicted with the CIC's assessment. The CO trusted the
    Anti-Air Warfare coordinator's judgment that the aircraft was hostile.
  question: What course of action should the Commanding Officer take regarding the aircraft he assesses as hostile?
  options:
    O1:
      do: Order the ship's weapons to open fire on the aircraft.
      move: act
      irreversible: true
    O2:
      do: Hold fire and continue tracking the aircraft without engaging.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Commanding Officer judged the aircraft to be hostile and a danger to both his vessel and the nearby USS Montgomery.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The aircraft was observed at an altitude lower than that typical of civilian traffic and was off the centreline
      of the designated airway.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Verbal warnings issued to the aircraft received no response.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The aircraft's transponder was set to Mode II code 1100, a pattern historically linked to Iranian F-14 fighters.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Electronic Support Measures detected no emissions from the aircraft.
  - id: F6
    kind: situation
    status: confirmed
    fact: From the moment the contact was made until the decision point roughly three minutes and forty seconds elapsed, with
      less than a minute remaining when the target entered a ten-nautical-mile radius.
  - id: F7
    kind: situation
    status: confirmed
    fact: The ship's crew was working under the standard twelve-hour watch schedule at the time of the encounter.
  - id: F8
    kind: situation
    status: confirmed
    fact: Simultaneously, the Commanding Officer was directing a surface engagement against IRGC boats, which divided his
      attention from the aerial picture.
  - id: F9
    kind: authority
    status: confirmed
    fact: The applicable Rules of Engagement permit the use of force against a hostile aircraft that presents an imminent
      threat.
  - id: F10
    kind: situation
    status: assessed
    fact: The ship's integrated command and decision system reported a different altitude trend for the aircraft than the
      Combat Information Center's visual assessment.
  - id: F11
    kind: capability
    status: assessed
    fact: The Commanding Officer placed confidence in the Anti-Air Warfare coordinator's classification of the aircraft as
      hostile.
  considerations:
  - id: C1
    facts:
    - F6
    - F8
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The CO had roughly three minutes and forty seconds from first radar contact to the decision point, and when the aircraft
      entered a ten-nautical-mile radius less than one minute remained, creating severe time compression that required an
      immediate response.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The aircraft was flying low, off the commercial airway, ignored verbal challenges, transmitted an IFF Mode II-1100
      code historically linked to Iranian F-14s, and emitted no electronic signatures, all pointing to hostile intent toward
      the ship and nearby vessels.
  - id: C3
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Rules of Engagement expressly authorize the use of force against a hostile aircraft that presents an imminent
      threat, which the CO judged the track to be.
  - id: C4
    facts:
    - F11
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The CO trusted the Anti-Air Warfare coordinator's assessment, based on extensive experience and training, and relied
      on that judgment to act.
  - id: C5
    facts:
    - F10
    equity: record_integrity
    favors:
    - O1
    weight: weak
    why: Although the integrated command-and-decision system reported an altitude trend opposite to the CIC's visual assessment,
      the CO gave greater weight to the human observation under combat stress.
  - id: C6
    facts:
    - F7
    equity: crew_readiness
    favors:
    - O1
    weight: weak
    why: The crew was operating under a standard twelve‑hour watch, indicating they were alert and capable of executing a
      rapid weapons engagement.
  reasoning:
    read: The CO faced an aircraft that matched the profile of an Iranian F-14—low altitude, off-airway trajectory, non-responsive
      to challenges, and broadcasting a hostile IFF code—while his ship was simultaneously engaged with IRGC boats.
    weighing: Severe time compression (C1), multiple hostile indicators (C2), explicit ROE permission (C3), trusted expert
      judgment (C4), and confirmed crew alertness (C6) together outweighed the weak data conflict (C5). This constellation
      of considerations compelled the CO to order fire.
    tradecraft: The engagement decision was entered into the ship's action report, citing the AAW coordinator's input, the
      ten-nautical-mile proximity, and the applicable ROE. All communications were logged per standard naval procedure.
    uncertainty: The only lingering ambiguity was the altitude-trend discrepancy reported by the command-and-decision system,
      but this was judged insufficient to override the imminent-threat assessment.
    handoff: The CO acted under delegated authority; no higher-level clearance was required because the ROE allowed immediate
      self-defense.
    tempting_wrong:
      option: O2
      pull: Holding fire could avoid the tragic loss of civilian lives if the contact were misidentified.
      why_wrong: Given the imminent threat to the ship and the nearby USS Montgomery, and the absence of positive identification,
        refraining from fire would have exposed both vessels to a likely hostile attack.
    rejected:
      O2: The CO judged the aircraft hostile based on altitude, IFF, lack of response, and ROE, and the compressed decision
        window left no viable alternative to protect his force.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: The command-and-decision system had reliably shown the aircraft climbing away and no descending reports were received.
      then: O2
      why: Reliance on the system's ascent data would have removed the imminent-threat perception, making a hold-fire decision
        plausible.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Future incidents where extreme time compression limits verification of target identity.
      favors:
      - O1
      why: Rapid decision-making under combat stress justifies reliance on the strongest threat indicators and authorized
        ROE.
  lesson: When a credible hostile threat emerges under severe time compression, commanders must act on the strongest available
    indicators and authorized ROE to protect their force, even if some sensor data are ambiguous.
  limits: This reasoning applies only when the threat is assessed as imminent and the ROE explicitly permits self-defense;
    it does not extend to situations where positive civilian identification is achievable or where sufficient time exists
    for additional verification.
