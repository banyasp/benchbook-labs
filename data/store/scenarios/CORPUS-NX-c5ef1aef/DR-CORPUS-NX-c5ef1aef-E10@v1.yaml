      real_option: O2
      real_to_mean_other_length: 1.15
      real_is_longest: true
      moves:
        O1: act
        O2: act
        O3: ask
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
        O3: false
    equities: pilot2
