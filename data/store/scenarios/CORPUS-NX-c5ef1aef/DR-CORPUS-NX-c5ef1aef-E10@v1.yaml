case:
  id: DR-CORPUS-NX-c5ef1aef-E10@v1
  title: Ethics Enforcement for Technical Errors and Innocent Contacts
  status: draft
  setting: United States federal conflict-of-interest and ethics framework, during the Commission's review around the January
    20, 2001 transition.
  decider: The Commission
  agent: The Commission
  agent_role: decide
  situation: The Commission is framing an enforcement policy for federal conflict-of-interest rules. Existing laws and regulations
    address bribery and corrupt practices. Disclosure forms are complex, and technical or inadvertent misstatements can occur.
    Contacts between officials and the private sector may be innocent. The contemplated enforcement approach includes timely
    decisions and an aim of clearing innocent officials as well as pursuing wrongdoers.
  question: What should the Commission recommend for the Office of Government Ethics' treatment of technical or inadvertent
    disclosure errors and innocent private-sector contacts?
  options:
    O1:
      do: The Commission should recommend that the Office of Government Ethics criminalize technical or inadvertent disclosure
        errors and innocent private-sector contacts, treating them as presumptively criminal matters.
      move: act
      irreversible: false
    O2:
      do: The Commission should recommend that the Office of Government Ethics decriminalize technical or inadvertent disclosure
        errors and innocent private-sector contacts, treating them as civil or administrative matters.
      move: act
      irreversible: false
    O3:
      do: The Commission should ask the Office of Government Ethics to draft an enforcement standard for technical errors
        and innocent private-sector contacts.
      move: ask
      irreversible: false
      to: The Office of Government Ethics
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Commission endorses retaining basic laws and regulations that prevent bribery and corrupt practices.
  - id: F2
    kind: situation
    status: confirmed
    fact: Disclosure forms can be complex.
  - id: F3
    kind: situation
    status: confirmed
    fact: Technical or inadvertent misstatements on complex disclosure forms should not be presumptively criminal.
  - id: F4
    kind: situation
    status: confirmed
    fact: Innocent contacts with the private sector should not be presumptively criminal.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Office of Government Ethics should enforce disclosure statutes as civil or administrative matters.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Office of Government Ethics should decide questions expeditiously.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Office of Government Ethics should aim to clear innocent officials as well as pursue wrongdoers.
  considerations:
  - id: C1
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Commission supports retaining the basic rules against bribery and corrupt practices; decriminalizing technical
      errors and innocent contacts does not require abandoning those rules.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Because disclosure forms are complex, technical or inadvertent misstatements and innocent private-sector contacts
      should not be presumed criminal.
  - id: C3
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The recommended enforcement route is civil or administrative, with questions resolved expeditiously.
  - id: C4
    facts:
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Office of Government Ethics should clear innocent officials as well as pursue wrongdoers, rather than treat innocent
      conduct as presumptively criminal.
  reasoning:
    read: The issue is how to enforce conflict-of-interest rules without treating mistakes on complex forms or innocent private-sector
      contacts as presumptive crimes. The trap is to mistake decriminalizing those cases for weakening the retained rules
      against bribery and corruption.
    weighing: 'The Commission favors {O2}: preserve the basic anti-bribery and anti-corruption framework {C1}, but handle
      technical or inadvertent errors and innocent contacts as civil or administrative matters {C2} {C3}. Timely decisions
      should clear innocent officials while pursuing wrongdoers {C4}. The balance depends on distinguishing innocent or inadvertent
      conduct from wrongdoing, not on treating every disclosure error or private-sector contact as criminal.'
    tradecraft: Recommend civil or administrative enforcement for the specified conduct, timely decisions, and an approach
      that clears the innocent as well as pursues wrongdoers. Keep the retained anti-bribery and anti-corruption rules intact.
    uncertainty: The source does not specify detailed criteria for distinguishing inadvertent errors from wrongdoing or prescribe
      particular civil or administrative measures.
    handoff: The Commission should make the recommendation and enable the Office of Government Ethics to enforce the disclosure
      rules and decide questions expeditiously.
    tempting_wrong:
      option: O1
      pull: Presumptive criminal treatment may seem to signal strong enforcement of ethics rules.
      why_wrong: It sweeps in the technical or inadvertent errors and innocent contacts the Commission says should not be
        presumptively criminal, and conflicts with its recommendation for civil or administrative enforcement.
    rejected:
      O1: It would presumptively criminalize conduct the Commission says should not receive that treatment.
      O3: The Commission's stated position is to recommend decriminalization and civil or administrative enforcement, not
        merely ask the Office of Government Ethics to draft a standard.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Commission's immediate task were only to obtain an enforcement standard from the Office of Government Ethics
        before selecting a treatment for these cases.
      then: O3
      why: A request for a standard could then be the appropriate next step rather than a direct recommendation about treatment.
    would_not_change:
    - id: noflip1
      if: Disclosure forms remain complex and technical or inadvertent misstatements remain possible.
      why: Those circumstances support, rather than reverse, the Commission's position that such errors should not be presumptively
        criminal.
    watch_for: []
  lesson: Preserve rules against bribery and corrupt practices while distinguishing them from technical mistakes and innocent
    contacts. Use civil or administrative enforcement for the latter, decide promptly, and make clearing innocent officials
    part of the enforcement mission.
  limits: This recommendation concerns technical or inadvertent disclosure errors and innocent private-sector contacts; it
    does not remove the basic rules against bribery and corrupt practices. The source does not provide detailed enforcement
    criteria or sanctions.
  library:
    domain: gov-ethics
    family: CORPUS-NX-c5ef1aef
    source: https://govinfo.library.unt.edu/nssg/PhaseIIIFR.pdf
    episode_focus: The report supports retaining laws against bribery and corrupt practices while shifting technical or inadvertent
      disclosure errors and innocent private-sector contacts away from presumptive criminal treatment. Focus on the enforcement
      standard and the stated aim of clearing innocent officials while pursuing wrongdoers; exclude the separate choices about
      divestiture and post-employment restrictions.
