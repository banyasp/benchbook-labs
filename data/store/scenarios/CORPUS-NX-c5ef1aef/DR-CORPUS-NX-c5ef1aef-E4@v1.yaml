      option_words:
        O1: 9
        O2: 9
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The policy conclusion is that the United States needs to be prepared for conditional preemptive action overseas and
  should keep the capability available even if it is never used.
