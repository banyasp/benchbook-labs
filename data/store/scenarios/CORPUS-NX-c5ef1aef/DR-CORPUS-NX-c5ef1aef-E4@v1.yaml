case:
  id: DR-CORPUS-NX-c5ef1aef-E4@v1
  title: Readiness for Conditional Preemptive Action
  status: draft
  setting: United States, overseas cases of clear and imminent danger, civilian national-security decision-making.
  decider: Civilian decision-makers
  agent: Civilian decision-makers
  agent_role: decide
  situation: The policy concerns possible preemptive action overseas in cases of clear and imminent danger. It applies where
    local authorities are unable or unwilling to act. Deterrence remains a military goal, though it may have limited effect
    on some non-state groups and individuals. The United States faces a policy choice about maintaining readiness for such
    conditional action. Any decision to act rests with civilian decision-makers and depends on intelligence information and
    assessments of diplomatic consequences.
  question: What should civilian decision-makers do about maintaining readiness for conditional preemptive action overseas?
  options:
    O1:
      do: Civilian decision-makers relinquish readiness for conditional preemptive action overseas.
      move: act
      irreversible: false
    O2:
      do: Civilian decision-makers retain readiness for conditional preemptive action overseas.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Shaping a peaceful international environment and deterring hostile military actors are considered sound military
      goals.
  - id: F2
    kind: situation
    status: assessed
    fact: Deterrent forces may have little effect on non-state groups secretly supported by states or on individuals with
      real or imagined grievances.
  - id: F3
    kind: situation
    status: confirmed
    fact: The contemplated cases involve clear and imminent danger overseas.
  - id: F4
    kind: situation
    status: confirmed
    fact: The contemplated cases involve local authorities that are unable or unwilling to act.
  - id: F5
    kind: capability
    status: confirmed
    fact: The United States is expected to be prepared for conditional preemptive action overseas.
  - id: F6
    kind: authority
    status: confirmed
    fact: The decision to take preemptive action rests with civilian decision-makers.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: A decision to act depends on intelligence information and assessments of diplomatic consequences.
  - id: F8
    kind: capability
    status: assessed
    fact: The availability of the capability may contribute to deterrence even if preemptive action is never taken or needed.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Shaping a peaceful environment and deterring hostile military actors remain sound goals, but deterrence may have
      little effect on some non-state groups and individuals; retaining readiness preserves a conditional response when deterrence
      is insufficient.
  - id: C2
    facts:
    - F3
    - F4
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The stated need for readiness is limited to overseas cases of clear and imminent danger where local authorities are
      unable or unwilling to act, rather than an unrestricted policy of preemptive action.
  - id: C3
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: 'Readiness does not itself authorize action: the decision remains with civilian decision-makers and depends on intelligence
      information and assessments of diplomatic consequences.'
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The availability of the capability may contribute to deterrence even if preemptive action is never taken or needed.
  reasoning:
    read: This is a choice about preserving readiness for a conditional policy option, not a decision to take preemptive action
      in any particular case. The trap is to treat retaining readiness as automatic authorization to act, or to assume deterrence
      alone is sufficient despite its stated limits.
    weighing: 'The limited effectiveness of deterrence against some actors and the possibility of clear and imminent danger
      when local authorities cannot or will not act support retaining readiness. The possibility that readiness itself contributes
      to deterrence also supports O2, even if no action is taken. These reasons do not remove the civilian decision point:
      any action depends on intelligence information and assessments of diplomatic consequences.'
    tradecraft: Keep readiness distinct from authorization for a particular action. For any decision to act, document the
      intelligence basis, the diplomatic-consequences assessment, and the civilian decision authority.
    uncertainty: Deterrence may have little effect on some actors, and readiness may contribute to deterrence; neither effect
      is certain. Whether to act depends on intelligence information and assessments of diplomatic consequences.
    handoff: The decision to act remains with civilian decision-makers. They should consider the intelligence information
      and diplomatic consequences identified as relevant.
    tempting_wrong:
      option: O1
      pull: Relinquishing readiness may seem to avoid the risks associated with preemptive action.
      why_wrong: That would discard a capability the policy calls for keeping available because deterrence may be limited
        and readiness may itself contribute to deterrence, even if action is never needed.
    rejected:
      O1: Relinquishing readiness was not chosen because the policy calls for preparedness in the stated conditional cases
        and sees possible deterrent value in keeping the capability available.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Decision-makers conclude that readiness no longer serves the stated need in clear and imminent danger cases where
        local authorities are unable or unwilling to act, and offers no deterrent contribution.
      then: O1
      why: If both the conditional-response rationale and the stated deterrent benefit no longer apply, the reasons for retaining
        readiness would be absent.
    would_not_change:
    - id: noflip1
      if: Preemptive action is never taken or needed.
      why: The capability should remain available even in that circumstance because its availability can contribute to deterrence.
    watch_for: []
  lesson: 'Retain readiness when deterrence may be inadequate and the policy identifies a narrowly conditional need for action.
    Readiness is not authorization: any decision to act remains with civilian decision-makers and depends on intelligence
    and diplomatic assessments.'
  limits: This reasoning addresses readiness for the conditional policy described, not whether to act in a specific case or
    how an action would be executed. It does not establish that any particular intelligence assessment or diplomatic consequence
    warrants action.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-c5ef1aef
    source: https://govinfo.library.unt.edu/nssg/PhaseIIIFR.pdf
    episode_focus: The passage identifies a conditional use-of-force policy choice, reserves the decision to civilian hands,
      and names intelligence assessments and diplomatic consequences as considerations. Treat this as a policy-level decision;
      exclude operational details about strike capabilities or execution.
