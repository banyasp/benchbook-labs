case:
  id: DR-CORPUS-NX-c5ef1aef-E3@v1
  title: Unifying National-Incident Response
  status: draft
  setting: United States; upon Congress's creation of NHSA; proposed NHSA incident-response system.
  decider: The Commission
  agent: The Commission
  agent_role: advise
  situation: The proposed NHSA would have a third directorate responsible for the nation's incident-response system. The existing
    system distinguishes crisis management from consequence management. That division has fostered duplicative command arrangements.
    Current policy specifies initial DoJ control in terrorist incidents on U.S. territory. The Commission is considering how
    command arrangements and authority should be structured if Congress creates NHSA, while the FBI retains its traditional
    law-enforcement role.
  question: What should the Commission recommend for national-incident command arrangements and authority if Congress creates
    NHSA?
  options:
    O1:
      do: The Commission recommends that NHSA manage a unified national-incident response system in coordination with DoJ
        and the FBI, while retaining the FBI's traditional law-enforcement role.
      move: act
      irreversible: false
    O2:
      do: The Commission recommends that crisis and consequence management remain divided, with initial DoJ control in terrorist
        incidents on U.S. territory and the FBI's traditional law-enforcement role.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: NHSA's proposed third directorate would be responsible for rationalizing and refining the nation's incident-response
      system.
  - id: F2
    kind: situation
    status: confirmed
    fact: The current system distinguishes crisis management from consequence management.
  - id: F3
    kind: situation
    status: assessed
    fact: The division has fostered duplicative command arrangements that are prone to confusion and delay.
  - id: F4
    kind: authority
    status: confirmed
    fact: Current policy specifies initial DoJ control in terrorist incidents on U.S. territory.
  - id: F5
    kind: authority
    status: confirmed
    fact: The current policy would need to be amended once Congress creates NHSA.
  - id: F6
    kind: situation
    status: confirmed
    fact: The FBI has a traditional role with respect to law enforcement.
  - id: F7
    kind: situation
    status: assessed
    fact: The Commission's contemplated arrangement involves close coordination with DoJ and the FBI.
  considerations:
  - id: C1
    facts:
    - F3
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The divided arrangement has produced duplicative commands prone to confusion and delay; a unified system addresses
      that time-costly problem.
  - id: C2
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The proposed directorate is charged with refining the national response system, and the Commission judges the existing
      crisis/consequence distinction unsustainable and unwise.
  - id: C3
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The unified NHSA arrangement requires amending the existing policy that gives DoJ initial control in terrorist incidents
      on U.S. territory.
  - id: C4
    facts:
    - F6
    - F7
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The Commission pairs close DoJ and FBI coordination with preservation of the FBI's traditional law-enforcement role.
  reasoning:
    read: The choice concerns national-incident command arrangements, not whether the FBI retains its law-enforcement function.
      The trap is treating the existing division of crisis and consequence management, or the current initial-DoJ-control
      policy, as a reason to preserve duplicative command arrangements despite the proposed NHSA system.
    weighing: The Commission's stated concern is that the division fosters command duplication, confusion, and delay, while
      the division itself is neither sustainable nor wise {C1} {C2}. It therefore favors one NHSA-managed response system,
      with close DoJ and FBI coordination and the FBI's traditional law-enforcement role preserved {C4}. That recommendation
      depends on amending the current initial-DoJ-control policy once Congress creates NHSA {C3}.
    tradecraft: State the recommendation as a unified incident-response system, identify the policy amendment it requires,
      and record the coordination and role-preservation conditions as part of the rationale.
    uncertainty: The recommendation does not specify the detailed allocation of responsibilities within the unified system
      or how coordination would operate in particular incidents.
    handoff: The Commission advises on the arrangement; implementation calls for Congress to create NHSA and for close coordination
      with DoJ and the FBI. The proposed directorate would also work with state officials and the emergency-management and
      law-enforcement communities.
    tempting_wrong:
      option: O2
      pull: It preserves the current policy of initial DoJ control in terrorist incidents and the existing division of responsibilities.
      why_wrong: The Commission considers the divided system unsustainable and unwise because it has fostered duplicative
        command arrangements prone to confusion and delay, and says the policy should be amended once NHSA is created.
    rejected:
      O2: The Commission rejects retaining divided crisis and consequence management because it perpetuates duplicative commands
        prone to confusion and delay.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that a unified system would not address the confusion and delay attributed to duplicative
        commands, while retaining the division would avoid those problems.
      then: O2
      why: The Commission's stated case for unification rests on correcting the duplication, confusion, and delay produced
        by the existing division.
    would_not_change:
    - id: noflip1
      if: The objection is only that current policy assigns initial DoJ control in terrorist incidents on U.S. territory.
      why: That existing policy is a reason the Commission says an amendment is needed once Congress creates NHSA, not a reason
        to retain the divided system.
    watch_for:
    - id: watch1
      what: Whether the current initial-DoJ-control policy is amended once Congress creates NHSA.
      favors:
      - O1
      why: The Commission identifies that amendment as necessary for the proposed arrangement.
  lesson: When divided command arrangements create duplication, confusion, and delay, consider whether a unified system can
    address those problems without displacing established law-enforcement responsibilities. Identify and address any policy
    amendment needed to make the recommended authority structure workable.
  limits: This reasoning addresses the Commission's proposed national-incident command arrangement upon creation of NHSA.
    It does not settle operational responsibilities in particular incidents or apply where the governing authority or evidence
    about the effects of unification differs.
