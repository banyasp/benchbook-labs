case:
  id: DR-CORPUS-NX-dc56becd-E1@v1
  title: Historical Record Assessment
  status: draft
  setting: Paris Okhrana files preserved at the Hoover Institution; 1904–1911; historical assessment of the revolutionary
    period.
  decider: The letter writer assessing the allegation
  agent: The letter writer assessing the allegation
  agent_role: decide
  situation: A historical allegation holds that a revolutionary served as an Okhrana agent over an extended period, including
    in the early years. Soviet-era accounts portrayed the revolutionary as prominent in revolutionary activity, while other
    biographers described the revolutionary as unimportant and unnoticed by police and early revolutionaries. The Paris Okhrana
    files contain four headquarters notices between 1904 and 1911 identifying the revolutionary as subversive or suspect,
    and those are the only references to the revolutionary in the files. The files contain no circulated list deleting the
    revolutionary from the roster of subversives and no circular identifying the revolutionary as a former or unreliable agent.
    The letter writer must assess whether the allegation is supported by the historical record.
  question: What should the historical reviewer do about the allegation that the revolutionary served as an Okhrana agent?
  options:
    O1:
      do: The letter writer should reject the allegation that the revolutionary served as an Okhrana agent.
      move: act
      irreversible: false
    O2:
      do: The letter writer should accept the allegation that the revolutionary served as an Okhrana agent.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The allegation is that the revolutionary was an Okhrana agent over many years, including the early period.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Soviet-era accounts portrayed the revolutionary as prominent in organizing strikes, writing proclamations, setting
      up underground printshops, and inciting rebellion.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Biographers outside the revolutionary’s official glorification described the revolutionary as unimportant and unnoticed
      by police and early revolutionaries.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Between 1904 and 1911, Okhrana headquarters sent the Paris office four notices identifying the revolutionary as
      subversive or suspect; these were the only references to the revolutionary in the files.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The files contain no circular deleting the revolutionary’s name from the roster of subversives.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The files contain no circular identifying the revolutionary as a former or unreliable agent.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The prominent-hero portrayal came from Soviet writers who had to glorify the revolutionary, while biographers outside
      that context described him as unimportant and unnoticed. The heroic portrayal is therefore weak support for inferring
      agent status.
  - id: C2
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The files repeatedly identified the revolutionary as subversive or suspect, but contain no notice deleting him from
      that roster. Under the described practice, this is contrary to the expected record for a recruited agent.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Headquarters circulated notices about people who had served as agents but were dropped or left the service. The absence
      of such a circular on the revolutionary weighs against the allegation, including the claim of service over an extended
      period.
  reasoning:
    read: The question is whether the historical record supports the agent allegation, not whether revolutionary activity
      or apparent freedom of movement proves covert cooperation. The heroic account that might make such cooperation seem
      necessary is compromised by its propagandistic context, and the archival record instead repeatedly classifies the revolutionary
      as suspect.
    weighing: The biographical contrast weakens the inference drawn from the heroic portrayal {C1}. More importantly, the
      notices naming the revolutionary as subversive, without the expected deletion or former-agent circulars, point against
      the allegation {C2} {C3}. The evidence does not support accepting the thesis, even for the early period; the balance
      depends especially on the significance of the missing records under the described practices.
    tradecraft: State the conclusion as a judgment about what this record supports. Record the notices and the absence of
      the expected circulars separately, and do not present absence of those records as proof that service was impossible.
    uncertainty: The evidence is unpersuasive, including for the early period, but the files do not conclusively establish
      that the revolutionary never served as an agent.
    handoff: The letter writer makes the historical assessment. Nothing in the decision as framed requires referral to another
      authority.
    tempting_wrong:
      option: O2
      pull: The revolutionary was portrayed as undertaking prominent, risky revolutionary work while moving about with apparent
        impunity.
      why_wrong: That portrayal is unreliable because it came from Soviet writers obliged to glorify him, and the archival
        notices and missing circulars point the other way.
    rejected:
      O2: Accepting the allegation is not supported because the expected archival indicators of recruited or former-agent
        status are absent, while the files identify the revolutionary as subversive or suspect.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The files contained a headquarters circular identifying the revolutionary as a former or unreliable agent after
        service ended.
      then: O2
      why: Such a circular would supply the kind of archival trace regularly circulated for agents who were dropped or left
        the service, substantially strengthening the allegation.
    would_not_change:
    - id: noflip1
      if: The heroic portrayal in Soviet-era accounts remained the only evidence of prominence and apparent impunity.
      why: That portrayal would remain weak evidence because it came from accounts shaped by the need to glorify the revolutionary.
    watch_for: []
  lesson: Assess an intelligence allegation against the records one would expect the institution to create, not merely against
    a dramatic account that makes the allegation seem plausible. Missing expected records can weigh against a claim, but the
    conclusion should remain proportionate to what the surviving record establishes.
  limits: This reasoning applies to the historical allegation and the archival practices described in the letter. It does
    not establish that every agent would necessarily appear in the same records or resolve the allegation using evidence outside
    this record.
