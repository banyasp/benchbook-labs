case:
  id: DR-CORPUS-INC-MAYAGUEZ-INCIDENT-NX-d7e4592b-E7@v1
  title: Authorizing Force to Recover the Mayaguez
  status: draft
  setting: Cambodia, May 1975, U.S. executive branch
  decider: The President
  agent: The President
  agent_role: decide
  situation: The Khmer Rouge had refused to release the Mayaguez and its crew. U.S. indications placed the crew on Koh Tang,
    where U.S. officials believed it was being held. The President was weighing whether to use force to recover the ship and
    crew. He wanted to avoid an incident comparable to the 1968 capture of the USS Pueblo.
  question: What should the President do about authorizing force to return the Mayaguez and its crew?
  options:
    O1:
      do: The President holds force authorization pending further assessment of the crew's location.
      move: hold
      irreversible: false
    O2:
      do: The President declines force authorization for return of the Mayaguez and its crew.
      move: act
      irreversible: false
    O3:
      do: The President authorizes force to return the Mayaguez and its crew.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Khmer Rouge refused to release the Mayaguez.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Khmer Rouge refused to release the Mayaguez's crew.
  - id: F3
    kind: intelligence
    status: assessed
    fact: U.S. indications placed the crew on Koh Tang.
  - id: F4
    kind: situation
    status: confirmed
    fact: The President wanted to avoid an incident similar to the capture of the USS Pueblo.
  - id: F5
    kind: situation
    status: confirmed
    fact: The comparison was to the capture of the USS Pueblo in 1968.
  - id: F6
    kind: situation
    status: confirmed
    fact: The contemplated objective was to return the Mayaguez and its crew.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The Khmer Rouge's refusal to release both the ship and its crew left the President seeking a way to return them;
      that refusal was the stated reason for authorizing force.
  - id: C2
    facts:
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The President was eager to avoid an incident comparable to the 1968 capture of the USS Pueblo, a stated reason for
      choosing force.
  - id: C3
    facts:
    - F3
    - F6
    equity: duty_to_individual
    favors:
    - O3
    weight: weak
    why: U.S. indications placed the crew on Koh Tang, giving the contemplated recovery action a location-based premise, though
      the location remained an assessment rather than a confirmed fact.
  reasoning:
    read: The decision concerned a refused release of the ship and crew, with U.S. indications placing the crew on Koh Tang.
      The trap is treating that assessed location as certainty; it was an indication, not a confirmed fact.
    weighing: The stated reasons for authorizing force were the Khmer Rouge's refusal to release the ship and crew and the
      President's desire to avoid a repeat of the USS Pueblo capture. The assessed location supported the contemplated recovery
      objective, but no separate legal test or detailed balancing of risks is set out. The outcome rests on the President's
      judgment that authorization served the return objective and avoided the feared precedent.
    tradecraft: At the decision level, record the authority for the decision, the refusal that prompted it, the return objective,
      the assessed nature of the crew's location, and the President's stated Pueblo-related concern. Reassess the decision
      if a material premise changes; no further implementation safeguards are identified.
    uncertainty: No legal standard is identified, the alternatives considered are not explained, and the certainty of the
      location assessment is not established. The stated rationale supports the authorization, but does not establish that
      force was legally required or that all relevant risks were resolved.
    handoff: The President is the identified decision-maker. No required referral or concurrence by another office is described.
    tempting_wrong:
      option: O1
      pull: The crew's location was assessed rather than confirmed, which can make holding authorization for more assessment
        seem prudent.
      why_wrong: The stated rationale was to return the ship and crew and avoid a Pueblo-like incident; the President did
        not choose to wait for confirmation.
    rejected:
      O1: The President did not hold authorization pending further assessment; he authorized force on the stated return and
        Pueblo-avoidance rationale.
      O2: The President did not decline force authorization, despite the Khmer Rouge's refusal to release the ship and crew.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible information established before authorization that the crew was not at the assessed location and required
        a materially different recovery decision.
      then: O1
      why: If the location assessment no longer supported the contemplated course, holding authorization for reassessment
        would be a reasonable alternative.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Whether the assessed location of the crew remains reliable as the decision is made.
      favors:
      - O1
      why: A change in that premise could affect whether the contemplated authorization serves the stated recovery objective.
  lesson: When a refused release threatens a concrete recovery objective, a decision-maker may give substantial weight to
    that objective and to avoiding a damaging precedent. Keep assessed facts distinct from confirmed facts, and reconsider
    the choice if a central premise changes.
  limits: The account records the President's action and stated rationale, but provides no legal analysis, full account of
    alternatives, or general rule that force is justified whenever a government refuses release. This reasoning should not
    be extended to situations with materially different facts or governing authority.
