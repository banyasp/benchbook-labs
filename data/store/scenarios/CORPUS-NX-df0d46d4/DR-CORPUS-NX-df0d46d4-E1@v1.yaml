case:
  id: DR-CORPUS-NX-df0d46d4-E1@v1
  title: Capture or Lethal Action
  status: draft
  setting: U.S. direct action; before action; the department or agency conducting direct action
  decider: The department or agency conducting direct action
  agent: The department or agency conducting direct action
  agent_role: decide
  situation: A department or agency conducting U.S. direct action is considering a course against a terrorist target. The
    available courses include capture and lethal action. Capture offers a more effective opportunity for meaningful intelligence
    collection. The agency must determine through risk analysis whether capture is practical. Lethal action is limited to
    circumstances in which no other reasonable alternative effectively addresses the threat. The target must be lawfully targetable,
    and its removal must be assessed as reasonably necessary to U.S. efforts to address the threat posed by the terrorist
    group.
  question: What should the department or agency conducting direct action do when deciding whether to capture the terrorist
    target or use lethal action?
  options:
    O1:
      do: The department or agency conducting direct action chooses lethal action against the terrorist target.
      move: act
      irreversible: true
    O2:
      do: The department or agency conducting direct action chooses capture of the terrorist target.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Capture of terrorist targets is generally preferred over lethal action.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: Capture provides a more effective opportunity for meaningful intelligence collection.
  - id: F3
    kind: authority
    status: confirmed
    fact: The department or agency conducting direct action determines whether capture is practical.
  - id: F4
    kind: authority
    status: confirmed
    fact: The practicality of capture is determined based on a risk analysis.
  - id: F5
    kind: authority
    status: confirmed
    fact: Lethal action may be employed only where there are no other reasonable alternatives to effectively address the threat.
  - id: F6
    kind: authority
    status: confirmed
    fact: U.S. direct action may be taken only against terrorist targets that may be lawfully targeted.
  - id: F7
    kind: authority
    status: confirmed
    fact: The target's removal must be assessed as reasonably necessary to U.S. efforts to address the threat posed by the
      terrorist group.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Capture is generally preferred because it provides a more effective opportunity for meaningful intelligence collection.
  - id: C2
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The agency must determine through risk analysis whether capture is practical; the general preference for capture
      does not replace that assessment.
  - id: C3
    facts:
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: Lethal action is reserved for circumstances in which no other reasonable alternative effectively addresses the threat.
  - id: C4
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: strong
    why: Either course of direct action is subject to the requirements that the target be lawfully targetable and its removal
      reasonably necessary to U.S. efforts against the terrorist-group threat.
  reasoning:
    read: 'This is a pre-action choice between capture and lethal action, not a choice about later custody or disposition.
      The trap is treating capture''s general preference as an absolute rule, or treating the availability of lethal action
      as enough to justify it: capture practicality requires risk analysis, and lethal action has a separate no-reasonable-alternative
      threshold.'
    weighing: 'On the stated facts, choose capture: it is generally preferred and offers a more effective opportunity for
      meaningful intelligence collection {C1}. The agency must still assess practicality through risk analysis {C2}; lethal
      action is not an equal default and is available only if no other reasonable alternative effectively addresses the threat
      {C3}. Either course also depends on lawful targetability and reasonable necessity {C4}.'
    tradecraft: 'Keep the decision at the policy level: make and record the risk-based practicality assessment, the alternatives
      relevant to the lethal-action threshold, and the lawfulness and reasonable-necessity determinations. Do not treat the
      intelligence advantage as a substitute for those assessments.'
    uncertainty: The stated facts do not give the result of the risk analysis. The recommendation is therefore to prefer capture
      on this record, subject to reassessment if the analysis establishes that capture is impractical and no other reasonable
      alternative effectively addresses the threat.
    handoff: The department or agency conducting direct action makes the practicality determination. The stated guidance does
      not specify another approval or consultation role.
    tempting_wrong:
      option: O1
      pull: Lethal action may seem like a direct way to address the threat.
      why_wrong: The guidance permits it only where no other reasonable alternative effectively addresses the threat; its
        availability alone does not satisfy that condition.
    rejected:
      O1: Lethal action is not chosen because the stated record does not establish that no other reasonable alternative effectively
        addresses the threat.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The risk analysis determines that capture is not practical, and no other reasonable alternative effectively addresses
        the threat.
      then: O1
      why: The guidance reserves lethal action for cases in which there are no other reasonable alternatives; any direct action
        must still meet the lawfulness and reasonable-necessity requirements.
    would_not_change:
    - id: noflip1
      if: The target is lawfully targetable and its removal is reasonably necessary, but capture remains practical and another
        reasonable alternative effectively addresses the threat.
      why: Those target and necessity conditions do not remove the separate limitation on using lethal action when a reasonable
        alternative exists.
    watch_for:
    - id: watch1
      what: The result of the agency's risk analysis on whether capture is practical.
      favors:
      - O1
      why: A finding that capture is impractical may affect the choice, but lethal action still requires that no other reasonable
        alternative effectively address the threat.
  lesson: Prefer capture where practical, including for its greater opportunity for meaningful intelligence collection. Use
    lethal action only when no other reasonable alternative effectively addresses the threat, and only within the stated lawfulness
    and reasonable-necessity limits.
  limits: This reasoning concerns the pre-action choice between capture and lethal action under the stated guidance. It does
    not resolve later custody or disposition, and it does not determine the outcome of the agency's risk analysis.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-df0d46d4
    source: https://assets.aclu.org/live/uploads/document/foia/2021-4-30_PSP_FOIA_Final.pdf
    episode_focus: The guidance generally prefers capture, directing the agency to assess whether capture is practical through
      risk analysis; lethal action is reserved for cases with no other reasonable alternatives to address the threat. Its
      stated reason for preferring capture is the opportunity for more effective intelligence collection. Exclude operational
      methods for carrying out either option and any later custody or disposition decision.
    cues:
      option_words:
        O1: 14
        O2: 13
      real_option: O2
      real_to_mean_other_length: 0.93
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The guidance generally prefers capture over lethal action, citing its more effective opportunity for meaningful intelligence
  collection, while reserving lethal action for cases with no other reasonable alternatives.
