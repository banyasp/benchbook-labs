case:
  id: DR-CORPUS-NX-f554bf4a-E2@v1
  title: Enlisting the Bani Hilal
  status: draft
  setting: Mid-11th-century Maghreb and Fatimid Egypt; the Fatimid caliphate.
  decider: The Fatimid caliph
  agent: The Fatimid caliph
  agent_role: decide
  situation: In the mid-11th century, the Maghreb was divided among the Zirid state, the Hammadid dynasty, and Berber tribal
    areas. The Hammadids were a rival of the Zirids and sought support to maintain their independence. The Zirids had declared
    fealty to the Abbasids, angering the caliph in Cairo. The Fatimid caliph was considering an ally to punish the Hammadids.
    The Bani Hilal were a large Bedouin tribe on the borders of upper Fatimid Egypt, and the proposed arrangement involved
    their leaving Egypt and receiving the caliph's blessing to raid the Maghreb.
  question: What should the Fatimid caliph do about authorizing the Bani Hilal to raid the Maghreb on condition that they
    leave Egypt?
  options:
    O1:
      do: The Fatimid caliph authorizes the Bani Hilal to raid the Maghreb on condition they leave Egypt.
      move: act
      irreversible: true
    O2:
      do: The Fatimid caliph defers the enlistment decision while considering another course against the Hammadids.
      move: hold
      irreversible: false
    O3:
      do: The Fatimid caliph declines to authorize the Bani Hilal to raid the Maghreb on condition they leave Egypt.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: By the mid-11th century, the Maghreb comprised the Zirid state in Ifriqiya, the Hammadid dynasty in the center,
      and Berber tribal areas to the west.
  - id: F2
    kind: situation
    status: assessed
    fact: The Hammadid dynasty was described as weak.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Hammadids were rivals of the Zirids and aligned themselves with parties that could help them maintain their
      independence.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Zirids declared fealty to the Abbasids in Baghdad, angering the caliph in Cairo.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Fatimid caliph sought an ally to punish the Hammadids.
  - id: F6
    kind: capability
    status: confirmed
    fact: The Bani Hilal were a large Bedouin tribe located on the borders of upper Fatimid Egypt.
  - id: F7
    kind: authority
    status: confirmed
    fact: The proposed arrangement was for the tribe to leave Egypt and receive the caliph's blessing to raid the Maghreb.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The caliph's stated purpose was to punish the Hammadids, who were rivals of the Zirids and sought support to preserve
      their independence; enlisting an ally directly served that political aim.
  - id: C2
    facts:
    - F6
    - F7
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: The proposed arrangement paired the departure of a large tribe from the borders of upper Fatimid Egypt with the caliph's
      authorization for action in the Maghreb. The condition is given, but its rationale is not explained.
  - id: C3
    facts:
    - F1
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The region was divided among competing political entities, and the Zirids' declaration of fealty to the Abbasids
      had angered the caliph. This is the political context for seeking an ally, not a separate legal basis for authorizing
      the arrangement.
  reasoning:
    read: This was a political choice to enlist an ally against the Hammadids amid contested authority and competing allegiances
      in the Maghreb. The trap is to treat the condition that the Bani Hilal leave Egypt as proof of a legal rule or a fully
      explained safeguard; that condition is given, but its rationale is not.
    weighing: The caliph's stated purpose was to punish the Hammadids, and the proposed ally was a large tribe available for
      that political purpose {C1}. The departure condition was part of the arrangement, while the fragmented political setting
      and Zirid allegiance to the Abbasids supplied context {C2} {C3}. Authorization is the recorded outcome, but no comparison
      of alternatives or broader ethical or legal test is given; the balance therefore rests on the caliph's stated political
      objective and the terms of the offer.
    tradecraft: At the decision level, record the authorizing office, the stated purpose of punishing the Hammadids, and the
      condition that the tribe leave Egypt. Do not treat the condition as satisfied unless it is verified.
    uncertainty: The rationale for making departure from Egypt a condition is not stated; neither is the legality of the authorization
      or why deferral or refusal was rejected.
    handoff: The Fatimid caliph is the identified decision-maker. No basis for referral to another authority is given.
    tempting_wrong:
      option: O2
      pull: Deferring could seem prudent because the region had divided political allegiances and the arrangement's condition
        is unexplained.
      why_wrong: The caliph proceeded with an ally to serve the stated purpose of punishing the Hammadids, rather than postponing
        that political choice.
    rejected:
      O2: The caliph authorized the arrangement to pursue the stated punitive purpose rather than deferring to consider another
        course.
      O3: Declining would have abandoned the caliph's stated plan to enlist an ally to punish the Hammadids.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The condition that the Bani Hilal leave Egypt could not be met.
      then: O3
      why: The stated arrangement was expressly conditional on their departure, so an arrangement that could not meet that
        condition would no longer be the proposed course.
    - id: flip2
      if: A more suitable course against the Hammadids became available and the caliph needed time to consider it.
      then: O2
      why: Deferral would then preserve the stated objective while allowing consideration of another course.
    would_not_change:
    - id: noflip1
      if: The region remained divided among competing political entities while the caliph's stated purpose of punishing the
        Hammadids persisted.
      why: That division is part of the context for the recorded choice and, by itself, does not negate the stated purpose
        or the proposed arrangement.
    watch_for:
    - id: watch1
      what: Whether the stated condition that the Bani Hilal leave Egypt is met.
      favors:
      - O1
      - O3
      why: The condition is part of the proposed authorization; whether it is fulfilled affects whether that arrangement proceeds
        as specified.
  lesson: When a political authorization is recorded, distinguish its stated objective from contextual factors and from safeguards
    whose rationale is not explained. Preserve any express condition, but do not infer a legal standard or an unstated justification
    from it.
  limits: This reasoning addresses only the authorization and its political rationale. It does not assess the conduct or consequences
    of any raids, and no legal analysis or comparative evaluation of the alternatives is provided.
