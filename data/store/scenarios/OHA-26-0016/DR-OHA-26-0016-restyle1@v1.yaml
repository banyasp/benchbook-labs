case:
  id: DR-OHA-26-0016-restyle1@v1
  title: Decision on Restoring Access Authorization under Guideline J [restyle]
  status: needs_review
  setting: DOE Office of Hearings and Appeals – July 2026
  decider: Presiding Administrative Law Judge
  agent: Presiding Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office learned that the employee had been arrested on multiple serious offenses and issued
    a notification letter stating that this credible information created substantial doubt about her eligibility under Guideline
    J. The employee exercised her right to request an administrative review hearing under the applicable DOE regulations.
    An arrest warrant was issued and a grand jury later indicted the employee on several counts, but the indictment was dismissed
    without prejudice. The employee contested the charges, arguing that the evidence was unreliable and that she lacked knowledge
    of any abuse. The Adjudicative Guidelines define Guideline J as criminal activity that raises doubts about judgment, reliability,
    and trustworthiness, and the regulations presume against granting a clearance. The judge found that none of the mitigating
    conditions under Guideline J applied to the employee.
  question: What action should the Presiding Administrative Law Judge take regarding the employee's security clearance?
  options:
    O1:
      do: The presiding judge delays the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The presiding judge partially reinstates the clearance, imposing specific conditions.
      move: partial
      irreversible: false
    O3:
      do: The presiding judge denies any restoration of the clearance.
      move: act
      irreversible: true
    O4:
      do: The presiding judge fully restores the clearance without conditions.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee maintains a security clearance through employment with a DOE contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office discovered that the employee had been taken into custody on three separate charges of
      Criminal Sexual Penetration, Child Abuse, Failure to Report Child Abuse, and Obstruction.
  - id: F3
    kind: situation
    status: confirmed
    fact: The LSO dispatched a notification letter asserting that credible information generated significant doubt regarding
      the employee's eligibility under Guideline J.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee invoked the statutory right to a DOE-governed administrative review hearing.
  - id: F5
    kind: situation
    status: confirmed
    fact: An arrest warrant was issued alleging Child Abuse, Failure to Report Child Abuse, and Obstruction; a grand jury
      subsequently returned an indictment on further counts, which was later dismissed without prejudice.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The employee challenged the accusations, contending the evidence lacked reliability and that she possessed no awareness
      of the alleged abuse.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: Guideline J characterizes criminal conduct as behavior that casts doubt on an individual's judgment, reliability,
      and trustworthiness.
  - id: F8
    kind: authority
    status: confirmed
    fact: Regulatory provisions impose a presumption against issuing or reinstating a clearance whenever doubt is present.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The judge concluded that none of the mitigating criteria—elapsed time, coercion, insufficient reliable evidence,
      or rehabilitation—applied to the employee.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Guideline J covers the employee's arrests and indictment, engendering considerable doubt about her reliability and
      trustworthiness, and the regulations invoke a presumption against clearance under such doubt.
  - id: C2
    facts:
    - F9
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Because the judge determined that no mitigating condition—whether elapsed time, coercion, lack of reliable evidence,
      or rehabilitation—was met, the security concern persists without mitigation.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulatory standards (10 C.F.R. § 710.7(a)) establish a presumption against issuing or reinstating a clearance whenever
      any doubt is present.
  - id: C4
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The indictment—despite its dismissal—and the arrest warrant reflect conduct that indicates non-compliance with law,
      thereby eroding the employee's judgment and reliability.
  reasoning:
    read: The presiding judge reviewed the arrest record, the charges, and the indictment, applied Guideline J, and assessed
      the presence of any mitigating factors. The judge determined that the adverse information sufficiently sustained a security
      concern and that the employee had failed to mitigate that concern.
    weighing: Taken together, the considerations satisfy the Adjudicative Guidelines' rule that criminal conduct lacking mitigating
      circumstances bars restoration. The pronounced weight of C1-C4, each anchored in regulatory text and the judge's analysis,
      outweighs any evidentiary reliability arguments advanced by the employee.
    tradecraft: The ruling is entered into the official OHA decision, citing the pertinent CFR provisions and Guideline sections,
      and the result is transmitted to the LSO for execution.
    uncertainty: The sole uncertainty concerns the potential emergence of future mitigating evidence—such as rehabilitation—but
      none was offered during the hearing.
    handoff: The presiding judge decides unilaterally, per 10 C.F.R. § 710.27(d); additional agency review is unnecessary
      unless an appeal is lodged.
    tempting_wrong:
      option: O2
      pull: The employee's assertion that the evidence lacks reliability could tempt a partial reinstatement.
      why_wrong: The judge found the evidence adequate to sustain the charges and noted that mitigating condition (c)—absence
        of reliable evidence—does not apply.
    rejected:
      O1: Deferring the ruling pending further evidence would disregard the clear regulatory presumption against a clearance
        when doubt exists.
      O2: A partial reinstatement is unjustified because no mitigating condition is satisfied.
      O4: Complete reinstatement conflicts with Guideline J and the judge's finding that the employee has not shown reliability,
        trustworthiness, or sound judgment.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If a considerable interval had passed since the alleged conduct, rendering recurrence unlikely (Guideline J mitigating
        condition (a)).
      then: O2
      why: The elapsed time could satisfy mitigating condition (a), permitting a partial reinstatement.
    would_not_change:
    - id: noflip1
      if: If the employee persisted in refusing to cooperate with law-enforcement directives.
      why: Continued non-cooperation maintains the security concern irrespective of other considerations.
    watch_for:
    - id: watch1
      what: Emergence of credible rehabilitation evidence (e.g., successful completion of a treatment program, sustained good
        conduct).
      favors:
      - O2
      why: Such rehabilitation evidence could satisfy mitigating condition (d).
  lesson: DOE Guideline J dictates that criminal conduct casting doubt on a person's judgment, reliability, or trustworthiness,
    absent any mitigating factors, requires denial of clearance restoration. The presumption against granting a clearance
    when doubt exists is decisive.
  limits: This analysis is limited to DOE personnel-security clearance determinations under 10 C.F.R. Part 710. It does not
    adjudicate criminal guilt or innocence, nor does it apply to other agencies with distinct adjudicative frameworks.
