case:
  id: DR-OHA-26-0016-flip1@v1
  title: Decision on Restoring Access Authorization under Guideline J [flip]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, August 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office received a report that the Individual had been arrested on several serious charges
    and issued a Notification Letter asserting that this reliable information created substantial doubt about her eligibility
    under Guideline J. The Individual invoked her statutory right to an administrative review hearing under DOE regulations.
    An arrest warrant was later issued and a grand jury indicted the Individual on additional counts; the indictment was subsequently
    dismissed without prejudice. The Individual contested the allegations, claiming the evidence was unreliable and that she
    was unaware of any wrongdoing. Guideline J characterizes criminal conduct that raises doubts about judgment, reliability,
    and trustworthiness, and the regulations presume against granting a clearance when such doubt exists. The judge determined
    that the mitigating condition concerning the passage of time was satisfied, while the conditions of coercion, lack of
    reliable evidence, and rehabilitation were not.
  question: What action should the Administrative Judge take regarding the Individual's access authorization?
  options:
    O1:
      do: Hold the decision until additional evidence is submitted.
      move: hold
      irreversible: false
    O2:
      do: Partially restore the Individual's access authorization with conditions.
      move: partial
      irreversible: false
    O3:
      do: Deny any restoration of the Individual's access authorization.
      move: act
      irreversible: true
    O4:
      do: Fully restore the Individual's access authorization without restriction.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The subject currently possesses a security clearance in her capacity as a staff member of a DOE-contracted firm.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office was informed that the subject had been taken into custody on three separate charges of
      Criminal Sexual Penetration, Child Abuse, Failure to Report Child Abuse, and Obstruction.
  - id: F3
    kind: situation
    status: confirmed
    fact: The LSO dispatched a Notification Letter asserting that credible information generated significant uncertainty regarding
      the subject's suitability under Guideline J.
  - id: F4
    kind: situation
    status: confirmed
    fact: The subject invoked her statutory entitlement to petition for an administrative review hearing pursuant to DOE regulations.
  - id: F5
    kind: situation
    status: confirmed
    fact: An arrest warrant was subsequently issued alleging Child Abuse, Failure to Report Child Abuse, and Obstruction;
      a grand jury later returned an indictment on further charges, which was then dismissed without prejudice.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The subject challenged the accusations, contending that the evidentiary basis was unreliable and that she lacked
      awareness of the purported abuse.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: Guideline J characterizes criminal conduct as behavior that engenders doubt concerning an individual's judgment,
      reliability, and trustworthiness.
  - id: F8
    kind: authority
    status: confirmed
    fact: Regulatory policy presumes against the issuance or reinstatement of a security clearance whenever doubt is present.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The judge found that the mitigating condition concerning the passage of time was satisfied, while the conditions
      of coercion, lack of reliable evidence, and rehabilitation were not.
  - id: F10
    kind: situation
    status: confirmed
    fact: The alleged conduct took place more than five years prior to the present review, and no related incidents or investigations
      have been reported since that time.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Guideline J applies to the Individual's arrests and indictment, creating substantial doubt, but the passage-of-time
      mitigation acknowledged in {F9} lessens the impact on institutional credibility, supporting a partial restoration.
  - id: C2
    facts:
    - F9
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The judge determined that the time-elapsed mitigating condition was satisfied, which under due-process considerations
      warrants a partial restoration despite the remaining unmet conditions.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulatory standards (10 C.F.R. § 710.7(a)) still impose a presumption against clearance when any doubt exists, but
      this presumption can be overcome by a qualifying mitigating factor.
  - id: C4
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The arrest warrant and indictment, even though dismissed, reflect conduct that questions the Individual's judgment
      and reliability.
  reasoning:
    read: The Administrative Judge reviewed the arrest record, the indictment, the dismissal, and the mitigating-condition
      analysis, applying Guideline J and the relevant regulations. Recognizing that the passage-of-time condition was met,
      the judge concluded that a partial restoration with conditions is appropriate.
    weighing: While C1, C3, and C4 highlight concerns, C2 provides a strong, legally grounded justification for partial restoration.
      The due-process equity in C2 outweighs the presumption against clearance, leading to O2 as the balanced outcome.
    tradecraft: The decision is entered into the official OHA record, citing the applicable CFR sections and Guideline paragraphs,
      and the partial-restoration directive is transmitted to the LSO for implementation.
    uncertainty: Future evidence of rehabilitation could shift the balance toward full restoration, but no such evidence was
      presented at this hearing.
    handoff: The Administrative Judge decides alone under 10 C.F.R. § 710.27(d); further agency review is available only through
      appeal.
    tempting_wrong:
      option: O3
      pull: The lingering seriousness of the charges might tempt a complete denial.
      why_wrong: The satisfied time-elapsed mitigating condition under {F9} reduces the security concern enough to allow a
        conditional restoration.
    rejected:
      O1: Holding the decision pending additional evidence ignores the clear regulatory guidance that the time-elapsed mitigation
        already satisfies the requirement for a decision.
      O3: A total denial disregards the mitigating condition that the alleged conduct occurred more than five years ago and
        that no further incidents have arisen.
      O4: Full restoration would exceed what the mitigating condition supports and would conflict with the presumption against
        clearance.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: If the alleged conduct had occurred within the recent two-year window, making recurrence likely and the time-elapsed
        mitigation unavailable.
      then: O3
      why: The absence of the time-elapsed mitigating condition would reinstate the presumption against clearance, favoring
        O3.
    would_not_change:
    - id: noflip1
      if: If the Individual continued to refuse cooperation with law-enforcement directives.
      why: Ongoing non-cooperation sustains the security concern regardless of other factors.
    watch_for:
    - id: watch1
      what: New credible evidence of rehabilitation (e.g., successful completion of a treatment program, sustained good conduct).
      favors:
      - O2
      why: Evidence of rehabilitation could satisfy mitigating condition (d).
  lesson: When a mitigating condition—such as the passage of time—satisfies Guideline J's requirements, a partial restoration
    of access authorization may be warranted despite serious past conduct. The presumption against clearance can be overcome
    by a qualifying mitigation, balancing security concerns with due-process fairness.
  limits: This analysis applies solely to DOE personnel security clearance determinations under 10 C.F.R. Part 710. It does
    not adjudicate criminal guilt, nor does it extend to agencies with different adjudicative frameworks.
