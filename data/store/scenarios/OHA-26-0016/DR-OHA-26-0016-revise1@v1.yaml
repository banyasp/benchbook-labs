case:
  id: DR-OHA-26-0016-revise1@v1
  title: Decision on Restoring Access Authorization under Guideline J [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, July 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office learned that the Individual had been arrested for multiple serious crimes and issued
    a Notification Letter stating that this reliable information created substantial doubt about her eligibility under Guideline
    J. The Individual exercised her right to request an administrative review hearing under the applicable DOE regulations.
    An arrest warrant was issued and a grand jury later indicted the Individual on several counts, but the indictment was
    dismissed without prejudice. The Individual contested the charges, arguing that the evidence was unreliable and that she
    lacked knowledge of any abuse. The Adjudicative Guidelines define Guideline J as criminal activity that raises doubts
    about judgment, reliability, and trustworthiness, and the regulations presume against granting a clearance. The judge
    found that none of the mitigating conditions under Guideline J applied to the Individual.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge partially restores the Individual’s access authorization with conditions.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual holds an access authorization as an employee of a DOE contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office learned that the Individual was arrested for three counts each of Criminal Sexual Penetration,
      Child Abuse, Failure to Report Child Abuse, and Obstruction.
  - id: F3
    kind: situation
    status: confirmed
    fact: The LSO issued a Notification Letter stating that reliable information raised substantial doubt about the Individual’s
      eligibility under Guideline J.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual exercised her right to request an administrative review hearing under the applicable DOE regulations.
  - id: F5
    kind: situation
    status: confirmed
    fact: An arrest warrant was issued charging the Individual with Child Abuse, Failure to Report Child Abuse, and Obstruction;
      a grand jury later indicted her on additional counts, but the indictment was dismissed without prejudice.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual contested the charges, arguing that the evidence was unreliable and that she had no knowledge of
      the alleged abuse.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: Guideline J defines criminal activity as conduct that creates doubt about a person’s judgment, reliability, and
      trustworthiness.
  - id: F8
    kind: authority
    status: confirmed
    fact: Regulatory standards presume against granting or restoring a security clearance when doubt exists.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The judge found that none of the mitigating conditions (time elapsed, coercion, lack of reliable evidence, rehabilitation)
      applied to the Individual.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: Guideline J still applies to the arrests, but the weight is reduced to weak to reflect uncertainty about the reliability
      of the underlying allegations.
  - id: C2
    facts:
    - F9
    equity: due_process
    favors:
    - O3
    - O2
    weight: weak
    why: No mitigating conditions are satisfied, and the dismissal of the indictment without prejudice creates doubt about
      the strength of the security concern, allowing a weaker weight and opening the possibility of a conditional partial
      restoration.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The regulatory presumption remains, but it is given weak weight given the competing consideration that the evidence
      may be unreliable.
  - id: C4
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O3
    weight: weak
    why: The arrest warrant and indictment suggest non-compliance, but the weak weight reflects the lack of a final conviction
      and the possibility of rehabilitation.
  - id: C5
    facts:
    - F6
    - F9
    equity: evidence_reliability
    favors:
    - O2
    weight: strong
    why: The dismissal of the indictment and the Individual's contestation of the charges raise serious doubts about the reliability
      of the derogatory information, justifying a conditional partial restoration pending further verification.
  reasoning:
    read: The record of arrests, the indictment dismissal, and the Individual's challenge to the evidence were reviewed, then
      Guideline J and the regulatory presumption were applied while weighing the new reliability consideration.
    weighing: With C1-C4 reduced to weak, the strong evidence-reliability consideration now dominates, supporting a partial
      restoration with conditions rather than outright denial.
    tradecraft: The decision will be documented in the OHA record, citing the relevant CFR sections, Guideline J language,
      and the new reliability analysis, and the partial restoration will be communicated to the LSO with specific conditions.
    uncertainty: Uncertainty remains regarding future evidence of rehabilitation or new credible information that could either
      strengthen or weaken the partial restoration.
    handoff: The Administrative Judge retains sole authority for the final determination, with the possibility of appeal under
      DOE regulations.
    tempting_wrong:
      option: O3
      pull: Denial aligns with the longstanding presumption against clearance when any doubt exists.
      why_wrong: The strong reliability consideration (new C5) shows that the doubt is not conclusive; a conditional partial
        restoration better balances security with due-process interests.
    rejected:
      O1: Holding the decision pending would unnecessarily delay resolution despite the available reliability analysis.
      O3: Full denial ignores the significant doubt about the reliability of the indictment and the possibility of conditional
        restoration.
      O4: Unconditional restoration contradicts the remaining security concerns reflected in the weak but present considerations.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: If the Individual does not submit credible rehabilitation documentation within 90 days.
      then: O3
      why: Absent evidence of rehabilitation, the security concern remains unresolved, warranting denial of restoration.
    would_not_change:
    - id: noflip1
      if: If the Individual continued to refuse cooperation with law-enforcement directives.
      why: Ongoing non-cooperation sustains the security concern regardless of other factors.
    watch_for:
    - id: watch1
      what: New credible evidence of rehabilitation (e.g., successful completion of a treatment program, sustained good conduct).
      favors:
      - O2
      why: Evidence of rehabilitation could satisfy mitigating condition (d).
  lesson: Under DOE Guideline J, criminal conduct that raises doubts about judgment, reliability, or trustworthiness can be
    mitigated when the reliability of the derogatory information is itself in question, allowing a conditional partial restoration.
  limits: This analysis applies only to DOE personnel security clearance determinations under 10 C.F.R. Part 710. It does
    not determine criminal guilt or innocence, nor does it extend to other agencies with different adjudicative frameworks.
