case:
  id: DR-OHA-26-0016-addfact1@v1
  title: Decision on Restoring Access Authorization under Guideline J [addfact]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, July 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office reported that the employee, who has been with the contractor for six years and currently
    holds a secret-level clearance, was arrested on multiple serious offenses, including three counts each of Criminal Sexual
    Penetration, Child Abuse, Failure to Report Child Abuse, and Obstruction. The LSO issued a Notification Letter indicating
    that reliable information created substantial doubt about the employee's eligibility under Guideline J. Exercising her
    statutory right, the employee requested an administrative review hearing. An arrest warrant was subsequently issued for
    Child Abuse, Failure to Report Child Abuse, and Obstruction; a grand jury later indicted her on additional charges, but
    the indictment was dismissed without prejudice. The employee contested the allegations, claiming the evidence was unreliable
    and that she had no knowledge of any abuse. Guideline J characterizes criminal conduct as behavior that raises questions
    about judgment, reliability, and trustworthiness, and DOE regulations presume against granting or restoring a clearance
    when such doubt exists. After review, the judge found that none of the mitigating conditions—time elapsed, coercion, lack
    of reliable evidence, or rehabilitation—applied.
  question: Considering the facts and applicable guidelines, how should the Administrative Law Judge rule on the employee's
    request for restoration of access authorization?
  options:
    O1:
      do: Maintain the decision as pending until additional evidence is provided.
      move: hold
      irreversible: false
    O2:
      do: Partially restore the employee's access authorization with specific conditions.
      move: partial
      irreversible: false
    O3:
      do: Deny any restoration of the employee's access authorization.
      move: act
      irreversible: true
    O4:
      do: Grant full restoration of the employee's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee has worked for the contractor for six years and presently possesses a secret-level security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee holds an access authorization as a DOE contractor staff member.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office discovered that the employee had been arrested on three counts each of Criminal Sexual
      Penetration, Child Abuse, Failure to Report Child Abuse, and Obstruction.
  - id: F4
    kind: situation
    status: confirmed
    fact: The LSO sent a Notification Letter stating that reliable information raised substantial doubt about the employee's
      eligibility under Guideline J.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee invoked the right to request an administrative review hearing under the applicable DOE regulations.
  - id: F6
    kind: situation
    status: confirmed
    fact: An arrest warrant was issued charging the employee with Child Abuse, Failure to Report Child Abuse, and Obstruction;
      a grand jury later returned an indictment on additional counts, which was subsequently dismissed without prejudice.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The employee disputed the charges, asserting that the evidence was unreliable and that she lacked knowledge of any
      abuse.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: Guideline J defines criminal activity as conduct that creates doubt regarding an individual's judgment, reliability,
      and trustworthiness.
  - id: F9
    kind: authority
    status: confirmed
    fact: Regulatory policy presumes against granting or restoring a clearance when such doubt exists.
  - id: F10
    kind: intelligence
    status: assessed
    fact: The judge concluded that none of the mitigating factors—time elapsed, coercion, lack of reliable evidence, or rehabilitation—applied
      to the employee.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F8
    - F9
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Guideline J covers the employee's arrests and indictment, generating substantial doubt about judgment, reliability,
      and trustworthiness, and the regulations impose a presumption against clearance when such doubt exists.
  - id: C2
    facts:
    - F10
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The adjudicator determined that none of the mitigating conditions—elapsed time, coercion, lack of reliable evidence,
      or rehabilitation—were satisfied, leaving the security concern unmitigated.
  - id: C3
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulatory policy (10 C.F.R. § 710.7(a)) creates a presumption against granting or restoring a clearance whenever
      any doubt about eligibility is present.
  - id: C4
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The arrest warrant and the dismissed indictment reflect conduct that violates law and undermines the employee's judgment
      and reliability.
  - id: C5
    facts:
    - F3
    - F4
    - F8
    - F9
    - F10
    equity: national_security
    favors:
    - O3
    weight: strong
    why: Serious criminal allegations combined with the absence of any mitigating factors generate substantial doubt under
      Guideline J, and policy presumes against restoring a clearance in such circumstances.
  reasoning:
    read: The Administrative Law Judge reviewed the arrest record, the LSO's Notification Letter, Guideline J, and the regulator's
      presumption against clearance when doubt exists, then applied the finding that no mitigating conditions were met.
    weighing: Considerations C1-C5 collectively satisfy the adjudicative requirement that criminal conduct without mitigating
      circumstances precludes any restoration. Their strong weight, grounded in the regulations and the judge's analysis,
      outweighs the employee's arguments about evidentiary reliability.
    tradecraft: The decision is entered in the official OHA docket, citing the relevant CFR sections and Guideline paragraphs,
      and the outcome is transmitted to the Local Security Office for implementation.
    uncertainty: Future credible evidence of rehabilitation could alter the analysis, but none was presented at the hearing.
    handoff: The Administrative Law Judge acts alone under 10 C.F.R. § 710.27(d); further agency review is only possible on
      appeal.
    tempting_wrong:
      option: O2
      pull: The employee's claim that the evidence is unreliable might tempt a partial restoration.
      why_wrong: The judge found the evidence sufficient to support the charges, and the mitigating condition concerning lack
        of reliable evidence does not apply.
    rejected:
      O1: Keeping the decision pending would ignore the clear regulatory presumption against clearance when doubt exists.
      O2: Partial restoration is unwarranted because none of the mitigating conditions are satisfied, and the employee's service
        length ({F1}) does not offset the serious allegations.
      O4: Full restoration conflicts with Guideline J and the judge's finding that the employee has not demonstrated the required
        judgment, reliability, or trustworthiness.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If a significant period of time had passed since the alleged conduct such that recurrence is unlikely (Guideline
        J mitigating condition a).
      then: O2
      why: The passage of time could satisfy the mitigating condition, permitting a partial restoration.
    would_not_change:
    - id: noflip1
      if: If the employee continued to refuse cooperation with law-enforcement directives.
      why: Ongoing non-cooperation sustains the security concern regardless of other factors.
    watch_for:
    - id: watch1
      what: New credible evidence of rehabilitation (e.g., successful completion of a treatment program, sustained good conduct).
      favors:
      - O2
      why: Evidence of rehabilitation could satisfy mitigating condition (d) and support a partial restoration.
  lesson: Under DOE Guideline J, criminal conduct that raises doubts about an individual's judgment, reliability, or trustworthiness—absent
    any mitigating factors—mandates denial of clearance restoration. The regulatory presumption against granting a clearance
    when doubt exists is decisive.
  limits: This analysis applies solely to DOE personnel-security clearance determinations under 10 C.F.R. Part 710. It does
    not adjudicate criminal guilt or innocence, nor does it extend to agencies that use different adjudicative frameworks.
