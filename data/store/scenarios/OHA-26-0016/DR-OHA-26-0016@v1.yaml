case:
  id: DR-OHA-26-0016@v1
  title: Decision on Restoring Access Authorization under Guideline J
  status: draft
  setting: DOE Office of Hearings and Appeals, July 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office learned that the Individual had been arrested for multiple serious crimes and issued
    a Notification Letter stating that this reliable information created substantial doubt about her eligibility under Guideline
    J. The Individual exercised her right to request an administrative review hearing under the applicable DOE regulations.
    An arrest warrant was issued and a grand jury later indicted the Individual on several counts, but the indictment was
    dismissed without prejudice. The Individual contested the charges, arguing that the evidence was unreliable and that she
    lacked knowledge of any abuse. The Adjudicative Guidelines define Guideline J as criminal activity that raises doubts
    about judgment, reliability, and trustworthiness, and the regulations presume against granting a clearance. The judge
    found that none of the mitigating conditions under Guideline J applied to the Individual.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge partially restores the Individual’s access authorization with conditions.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual holds an access authorization as an employee of a DOE contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office learned that the Individual was arrested for three counts each of Criminal Sexual Penetration,
      Child Abuse, Failure to Report Child Abuse, and Obstruction.
  - id: F3
    kind: situation
    status: confirmed
    fact: The LSO issued a Notification Letter stating that reliable information raised substantial doubt about the Individual’s
      eligibility under Guideline J.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual exercised her right to request an administrative review hearing under the applicable DOE regulations.
  - id: F5
    kind: situation
    status: confirmed
    fact: An arrest warrant was issued charging the Individual with Child Abuse, Failure to Report Child Abuse, and Obstruction;
      a grand jury later indicted her on additional counts, but the indictment was dismissed without prejudice.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual contested the charges, arguing that the evidence was unreliable and that she had no knowledge of
      the alleged abuse.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: Guideline J defines criminal activity as conduct that creates doubt about a person’s judgment, reliability, and
      trustworthiness.
  - id: F8
    kind: authority
    status: confirmed
    fact: Regulatory standards presume against granting or restoring a security clearance when doubt exists.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The judge found that none of the mitigating conditions (time elapsed, coercion, lack of reliable evidence, rehabilitation)
      applied to the Individual.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Guideline J applies to the Individual’s arrests and indictment, creating substantial doubt about reliability and
      trustworthiness, and the regulations presume against clearance when such doubt exists.
  - id: C2
    facts:
    - F9
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The judge found that none of the mitigating conditions (time elapsed, coercion, lack of reliable evidence, rehabilitation)
      were satisfied, so the security concern remains unmitigated.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulatory standards (10 C.F.R. § 710.7(a)) impose a presumption against granting or restoring a clearance when any
      doubt exists.
  - id: C4
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The indictment (even though dismissed) and the arrest warrant demonstrate conduct that reflects a failure to comply
      with laws and regulations, undermining the Individual’s judgment and reliability.
  reasoning:
    read: The Administrative Judge examined the record of arrests, charges, and indictment, applied Guideline J, and evaluated
      whether any mitigating factors existed. The judge concluded that the derogatory information was sufficient to sustain
      a security concern and that the Individual had not alleviated that concern.
    weighing: The considerations above collectively satisfy the Adjudicative Guidelines’ requirement that criminal conduct
      without mitigating circumstances precludes restoration. The strong weight of C1‑C4, each grounded in the regulations
      and the judge’s own analysis, outweighs any arguments about evidentiary reliability raised by the Individual.
    tradecraft: The decision is recorded in the official OHA decision, cited to the relevant CFR sections and Guideline paragraphs,
      and the outcome is communicated to the LSO for implementation.
    uncertainty: The only uncertainty lies in the possibility of future mitigating evidence (e.g., rehabilitation), but none
      was presented at the hearing.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.27(d); no further agency review is required
      unless an appeal is filed.
    tempting_wrong:
      option: O2
      pull: The Individual’s claim that the evidence is unreliable might tempt a partial restoration.
      why_wrong: The judge found the evidence sufficient to support the charges and noted that mitigating condition (c) –
        lack of reliable evidence – does not apply.
    rejected:
      O1: Holding the decision pending additional evidence would ignore the clear regulatory presumption against clearance
        when doubt exists.
      O2: Partial restoration is unwarranted because none of the mitigating conditions are met.
      O4: Full restoration contradicts Guideline J and the judge’s finding that the Individual has not demonstrated reliability,
        trustworthiness, or good judgment.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If a significant period of time had elapsed since the alleged conduct such that it was unlikely to recur (Guideline
        J mitigating condition (a)).
      then: O2
      why: The passage of time could satisfy mitigating condition (a), allowing a partial restoration.
    would_not_change:
    - id: noflip1
      if: If the Individual continued to refuse cooperation with law‑enforcement directives.
      why: Ongoing non‑cooperation sustains the security concern regardless of other factors.
    watch_for:
    - id: watch1
      what: New credible evidence of rehabilitation (e.g., successful completion of a treatment program, sustained good conduct).
      favors:
      - O2
      why: Evidence of rehabilitation could satisfy mitigating condition (d).
  lesson: Under DOE Guideline J, criminal conduct that raises doubts about an individual's judgment, reliability, or trustworthiness,
    without any mitigating factors, mandates denial of clearance restoration. The presumption against granting a clearance
    when doubt exists is decisive.
  limits: This analysis applies only to DOE personnel security clearance determinations under 10 C.F.R. Part 710. It does
    not determine criminal guilt or innocence, nor does it extend to other agencies with different adjudicative frameworks.
