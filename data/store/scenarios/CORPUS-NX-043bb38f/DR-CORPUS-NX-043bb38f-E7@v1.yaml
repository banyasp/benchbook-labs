case:
  id: DR-CORPUS-NX-043bb38f-E7@v1
  title: C-130J Mishap Causation Findings
  status: draft
  setting: Ramstein Air Base, Germany; 23 April 2020; United States Air Force Accident Investigation Board.
  decider: The Board president
  agent: The Board president
  agent_role: decide
  situation: At Ramstein Air Base, the Board president is preparing formal findings about the cause of a C-130J mishap under
    a preponderance-of-evidence standard. During the final approach, the first pilot reduced engine power early, and the aircraft’s
    descent rate increased substantially before touchdown. The second pilot recognized the excessive descent late, and the
    first pilot’s subsequent power increase was insufficient to prevent a hard landing. Evidence included visual, sensory,
    and instrument cues available to the pilots, while the details of their visual scans were not fully established. The aircraft
    landed short of the painted landing-zone markings, and the available weather evidence did not establish a significant
    adverse wind shift.
  question: What should the Board president find about the cause of the mishap and the factors that substantially contributed
    to it?
  options:
    O1:
      do: The Board president attributes the mishap to the early power reduction and the pilots’ recognition and response
        failures as substantial contributors.
      move: act
      irreversible: false
    O2:
      do: The Board president excludes the early power reduction and the pilots’ recognition and response failures from the
        causal findings.
      move: act
      irreversible: false
    O3:
      do: The Board president attributes the mishap to the early power reduction but excludes the pilots’ recognition and
        response failures as substantial contributors.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Board president applied a preponderance-of-evidence standard to the mishap findings.
  - id: F2
    kind: situation
    status: confirmed
    fact: The first pilot began reducing engine power early in the final approach, and the engines reached flight idle before
      touchdown.
  - id: F3
    kind: situation
    status: confirmed
    fact: The first pilot was concerned about floating beyond the landing zone when beginning the early power reduction.
  - id: F4
    kind: situation
    status: confirmed
    fact: The aircraft’s sink rate increased substantially before touchdown and exceeded the landing limits.
  - id: F5
    kind: capability
    status: assessed
    fact: Visual, sensory, and altitude cues were available to the pilots to identify the rapid descent before impact.
  - id: F6
    kind: situation
    status: confirmed
    fact: The second pilot identified the high sink rate late and directed the first pilot to add power; the added power remained
      insufficient before touchdown.
  - id: F7
    kind: situation
    status: assessed
    fact: The first pilot testified to concern about adding too much power, floating beyond the landing zone, or having to
      go around; that concern likely contributed to the delayed and insufficient power increase.
  - id: F8
    kind: situation
    status: assessed
    fact: The recorded weather did not show a significant adverse wind shift, and the weather did not significantly affect
      the approach and landing.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: own_force_life
    favors:
    - O1
    - O3
    weight: strong
    why: The president found by a preponderance of the evidence that the early power reduction caused the mishap. The first
      pilot was concerned about floating beyond the landing zone, but the descent rate increased and the aircraft exceeded
      its landing limits.
  - id: C2
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The president found that both pilots failed to identify the excessive descent in time. Visual, sensory, and altitude
      cues were available, and the account concludes there was sufficient time and information to identify and arrest the
      descent earlier or go around.
  - id: C3
    facts:
    - F4
    - F6
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: 'After the high descent was recognized, the pilots delayed the necessary response: the second pilot directed added
      power late, the first pilot''s increase was insufficient, and the go-around call came at impact. The first pilot''s
      concern about floating beyond the landing zone or having to go around likely contributed to the delayed and insufficient
      increase.'
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: weak
    why: The weather evidence did not establish a significant adverse wind shift or a substantial weather contribution, so
      it does not displace the identified cause or contributors.
  reasoning:
    read: This is a causal finding under a preponderance-of-the-evidence standard, not a choice between attributing the mishap
      to crew conduct and attributing it to weather. The early power reduction was identified as the cause; the pilots' failures
      to identify and timely arrest the excessive descent, or go around, were separately identified as substantial contributors.
    weighing: The president's conclusion rests on the early power reduction preceding the increased descent and the hard landing,
      together with evidence that cues were available to identify the descent and that the response came too late and was
      inadequate. The concern about floating beyond the landing zone helps explain the delay but does not outweigh those findings.
      The evidence on weather did not establish a substantial alternative contribution. The balance depends on the president's
      assessment that the evidence of the early power reduction and the pilots' missed opportunity to respond was more persuasive
      than contrary explanations.
    tradecraft: Record the cause and substantial contributing factors as distinct findings, and state the evidentiary basis
      for each under the applied standard. Keep explanatory concerns and noncontributing possibilities separate from the formal
      causal findings.
    uncertainty: The precise visual-scan breakdown was not fully established. The president nevertheless found the overall
      evidence sufficient to conclude that the pilots had cues and an opportunity to act earlier.
    handoff: The Board president should make the finding on the investigation record; the source identifies no need for referral
      to another decision-maker.
    tempting_wrong:
      option: O3
      pull: It recognizes the early power reduction as the cause while avoiding attribution of substantial responsibility
        to the pilots' recognition and response.
      why_wrong: 'It omits two failures that the president expressly found substantially contributed to the mishap: failing
        to identify the excessive descent and failing to arrest it or go around in time.'
    rejected:
      O2: It was not chosen because the president found the early power reduction caused the mishap and the pilots' failures
        substantially contributed to it.
      O3: It was not chosen because it leaves out the pilots' failures, which the president expressly classified as substantial
        contributing factors.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The evidence still established the early power reduction as the cause but no longer supported finding that the pilots'
        recognition and response failures substantially contributed.
      then: O3
      why: That would preserve the causal finding while removing the basis for including the crew failures as substantial
        contributors.
    would_not_change:
    - id: noflip1
      if: The record included the operational-tempo and local-training limitations discussed by witnesses.
      why: Those limitations were discussed as other items, not classified as substantially contributing factors; they do
        not displace the president's stated causal findings.
    - id: noflip2
      if: A possible wind shift remained part of the account, without evidence of a significant adverse shift or substantial
        weather effect.
      why: The president concluded that the weather did not substantially contribute, so that possibility alone would not
        alter the causal findings.
    watch_for:
    - id: watch1
      what: Evidence that materially undermines whether the pilots had usable cues and sufficient opportunity to identify
        and respond to the excessive descent.
      favors:
      - O3
      why: The finding that the recognition and response failures substantially contributed depends on the availability of
        cues and an earlier opportunity to act.
  lesson: Separate the primary cause from substantial contributing factors, and assess each against the evidentiary standard.
    An explanation for delayed action may inform the analysis without negating a finding that the delay and response failure
    contributed to the outcome.
  limits: This conclusion is specific to the evidence and findings in this mishap investigation. It does not establish that
    similar conduct or circumstances would have the same causal significance in another case.
