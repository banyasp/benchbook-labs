case:
  id: DR-CORPUS-NX-c7a4d358-E1@v1
  title: Sky Sentinel Procurement Decision
  status: draft
  setting: Army, during proposed implementation planning after successful Sky Sentinel testing.
  decider: Army procurement decision-makers
  agent: Army procurement decision-makers
  agent_role: decide
  situation: After successful testing, Sky Sentinel was being considered amid Ukraine’s shift toward scalable, domestically
    developed defense solutions. Its estimated unit cost is roughly $150,000, and it is presented as a lower-cost option for
    drone threats rather than a substitute for missile-based systems. Its effectiveness can be reduced by adverse weather,
    electronic warfare, complex urban environments, and very small or fast drones. Production uses a hybrid model involving
    private firms, volunteer tech teams, and crowdfunding, while foreign sensors and specialized chips remain supply risks.
    Proposed Army implementation steps include a pilot of three to five prototypes at a test brigade and a review of doctrine
    and rules-of-engagement oversight.
  question: What should Army procurement decision-makers do about a Sky Sentinel pilot and broader procurement?
  options:
    O1:
      do: Army decision-makers authorize a limited pilot of three to five Sky Sentinel prototypes at a test brigade.
      move: partial
      irreversible: false
    O2:
      do: Army decision-makers reject expanded procurement of Sky Sentinel systems beyond a limited pilot program.
      move: act
      irreversible: false
    O3:
      do: Army decision-makers approve expanded procurement of Sky Sentinel systems beyond a limited pilot program.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Successful testing was followed by a push to mass-produce Sky Sentinel.
  - id: F2
    kind: situation
    status: confirmed
    fact: Ukraine shifted toward scalable, domestically developed defense solutions rather than relying solely on expensive
      foreign systems.
  - id: F3
    kind: situation
    status: assessed
    fact: Sky Sentinel’s estimated unit cost is roughly $150,000 per turret.
  - id: F4
    kind: capability
    status: confirmed
    fact: Sky Sentinel is a short-range system optimized for drones and low-altitude threats, and it cannot replace missile-based
      systems.
  - id: F5
    kind: capability
    status: confirmed
    fact: Adverse weather, electronic warfare, complex urban environments, and very small or fast drones can diminish Sky
      Sentinel’s effectiveness.
  - id: F6
    kind: situation
    status: confirmed
    fact: Sky Sentinel production and fielding use a hybrid model involving private firms, volunteer tech teams, and crowdfunding.
  - id: F7
    kind: situation
    status: assessed
    fact: Foreign sensors and specialized chips remain supply risks for production.
  - id: F8
    kind: situation
    status: confirmed
    fact: Proposed Army implementation steps include piloting three to five prototypes at a test brigade and reviewing doctrine
      and rules-of-engagement oversight.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: resource_stewardship
    favors:
    - O3
    - O1
    weight: strong
    why: The shift toward scalable domestic solutions and the roughly $150,000 estimated unit cost support considering Sky
      Sentinel as a way to stretch limited defense budgets.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    - O1
    weight: strong
    why: Sky Sentinel is a short-range system for drones and low-altitude threats, not a replacement for missile-based systems.
      It is therefore best considered as a complement, not a basis for broader substitution.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    - O1
    weight: strong
    why: The listed conditions can diminish effectiveness, which counsels against expanded procurement before the Army has
      assessed the system's limits in its own evaluation.
  - id: C4
    facts:
    - F6
    - F7
    equity: vendor_constraint
    favors:
    - O2
    - O1
    weight: weak
    why: The hybrid production model supports rapid procurement, but reliance on foreign sensors and specialized chips leaves
      supply risks that argue for caution before scaling.
  - id: C5
    facts:
    - F8
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The proposed implementation path is a three-to-five-prototype pilot accompanied by doctrine and rules-of-engagement
      review, rather than immediate broader procurement.
  reasoning:
    read: The appeal is a comparatively inexpensive, domestically developed system after successful testing and amid pressure
      to address drone threats. The trap is treating its cost and successful testing as proof that it can replace missile
      systems or that broader procurement is already justified. Sky Sentinel has a narrower capability and material limitations.
    weighing: Cost and the move toward scalable domestic solutions support pursuing the system {C1}. Its short-range role
      and the conditions that can reduce its effectiveness weigh against expansion without further evaluation {C2} {C3}. The
      hybrid production model offers speed, but foreign-component risks remain {C4}. The balance favors the proposed limited
      pilot and doctrine/ROE review, not expanded procurement now {C5}. Broader procurement would depend on evidence about
      performance within the stated limits and confidence in sustainable supply.
    tradecraft: Authorize only the proposed three-to-five-prototype pilot and the associated doctrine/ROE review. Record the
      decision as a limited evaluation, including the cost estimate, the system's non-substitutive role, its stated effectiveness
      limitations, and foreign-component supply risks; do not treat pilot authorization as approval for expanded procurement.
    uncertainty: The unit cost is an estimate, and supply risks and conditions that may diminish effectiveness remain. The
      available information does not establish how well the system would perform across those conditions or whether production
      inputs can be sustained at greater scale.
    handoff: Involve procurement and industrial-base reviewers to assess cost and supply assumptions, alongside doctrine and
      rules-of-engagement reviewers for the proposed review. This is a procurement judgment, but it also requires attention
      to production risks and doctrine/ROE review.
    tempting_wrong:
      option: O3
      pull: The low estimated unit cost, successful testing, and shift toward domestic scalable solutions make immediate expansion
        seem attractive.
      why_wrong: Sky Sentinel is a short-range complement rather than a missile-system replacement; conditions can reduce
        its effectiveness, and the proposed path is a pilot and review rather than immediate broader procurement.
    rejected:
      O2: O2 was not chosen as the complete course because a pilot can evaluate the system before deciding whether broader
        procurement is warranted.
      O3: O3 was not chosen because the proposed implementation path is a limited pilot and review, while capability limitations
        and foreign-component risks remain.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Further evaluation showed that the system reliably addressed the relevant drone threats despite the stated effectiveness
        limitations, and procurement review found a sustainable supply for expanded production.
      then: O3
      why: That evidence would reduce the principal reasons for limiting procurement to a pilot and could support broader
        acquisition of a cost-effective complement.
    - id: flip2
      if: The foreign-component supply risks proved unmanageable or evaluation showed that the system could not perform its
        limited drone-defense role adequately.
      then: O2
      why: The case for procurement beyond a limited pilot would weaken if the system's stated role or production sustainability
        could not be established.
    would_not_change:
    - id: noflip1
      if: The estimated unit cost remained roughly $150,000 per turret.
      why: Low cost alone would not resolve the limits on effectiveness, the system's inability to replace missile-based systems,
        or the need to assess supply risks before expansion.
    watch_for:
    - id: watch1
      what: Whether foreign sensors and specialized chips constrain production as procurement scales.
      favors:
      - O2
      why: A worsening supply constraint would weigh against procurement beyond a limited pilot.
  lesson: A low-cost system that addresses a real capability need can merit a pilot without warranting immediate expansion.
    Keep procurement scope proportionate to the system's stated role, effectiveness limits, and production risks, and use
    evaluation before committing to scale.
  limits: This reasoning concerns procurement planning for Sky Sentinel on the facts provided; it does not establish a general
    rule for other systems or conditions. It does not determine how the system should be deployed or used.
