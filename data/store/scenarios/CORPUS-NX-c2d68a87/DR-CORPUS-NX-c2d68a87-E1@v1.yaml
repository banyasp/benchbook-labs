case:
  id: DR-CORPUS-NX-c2d68a87-E1@v1
  title: Causal Finding After a Touch-and-Go Mishap
  status: draft
  setting: Military aviation mishap investigation; time and place unspecified; Accident Investigation Board.
  decider: The AIB President
  agent: The adjudication-support agent
  agent_role: advise
  situation: During a touch-and-go landing maneuver, the MP raised the landing gear lever before the aircraft was definitely
    airborne and before a positive rate of climb was established. The procedures for the maneuver specified both conditions
    for raising the lever. The aircraft impacted the runway with its landing gear not fully extended. The MIP had no opportunity
    to intervene before the mishap. The MP's perception of an established positive rate of climb after the attempt was also
    at issue.
  question: What should the adjudication-support agent recommend to the AIB President regarding causal attribution and contribution
    under the preponderance-of-evidence standard?
  options:
    O1:
      do: The adjudication-support agent recommends rejecting findings that premature lever raising was causal and the climb-rate
        misperception substantially contributory.
      move: act
      irreversible: false
    O2:
      do: The adjudication-support agent recommends finding premature lever raising causal and the climb-rate misperception
        substantially contributory.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The MP raised the landing gear lever prematurely during the touch-and-go landing maneuver.
  - id: F2
    kind: authority
    status: confirmed
    fact: Touch-and-go landing procedures specify that the landing gear lever should be raised when the aircraft is definitely
      airborne.
  - id: F3
    kind: authority
    status: confirmed
    fact: Touch-and-go landing procedures specify that a positive rate of climb must be established before the landing gear
      lever is raised.
  - id: F4
    kind: situation
    status: assessed
    fact: The aircraft impacted the runway without its landing gear fully extended.
  - id: F5
    kind: situation
    status: assessed
    fact: The MIP had no opportunity to intervene to prevent the mishap.
  - id: F6
    kind: situation
    status: assessed
    fact: Following the touch-and-go landing attempt, the MP misperceived an established positive rate of climb.
  - id: F7
    kind: authority
    status: confirmed
    fact: The AIB President used a preponderance-of-evidence standard for the causal finding.
  - id: F8
    kind: authority
    status: confirmed
    fact: The AIB President delegates preparation of a proposed causal finding to the adjudication-support agent and retains
      the final decision.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: The required procedure was to raise the landing gear lever only when the aircraft was definitely airborne and a positive
      rate of climb was established; the MP raised it prematurely.
  - id: C2
    facts:
    - F1
    - F4
    - F5
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The premature retraction resulted in the aircraft impacting the runway with its landing gear not fully extended,
      and the MIP had no opportunity to intervene to prevent the mishap.
  - id: C3
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The MP's misperception of an established positive climb rate was found to have substantially contributed to the mishap.
  reasoning:
    read: The issue is whether the premature lever movement caused the mishap and whether the climb-rate misperception substantially
      contributed, assessed under the preponderance standard. The trap is to treat the misperception as replacing or negating
      the separately identified causal role of the premature retraction.
    weighing: The procedure required both conditions before raising the lever {C1}; the premature retraction then led to the
      runway impact with the landing gear not fully extended, without an opportunity for the MIP to prevent the mishap {C2}.
      The misperception is an additional substantial contributing factor, not a reason to reject the causal finding {C3}.
      On the stated findings under the preponderance standard, recommend {O2}.
    tradecraft: Prepare the proposed finding by separating the primary cause from the substantial contributing factor, and
      state the preponderance standard and the causal sequence supporting each. Leave the final finding to the AIB President.
    uncertainty: The stated findings identify the standard and the causal reasons, but do not provide a fuller account of
      the underlying evidence; do not imply a higher degree of certainty than the preponderance finding.
    handoff: Advise the AIB President rather than make the final finding, because the agent's role is advisory and the President
      retains the decision.
    tempting_wrong:
      option: O1
      pull: The climb-rate misperception might be treated as uncertainty that weakens the causal attribution.
      why_wrong: The misperception was found to substantially contribute, while the premature lever raising was separately
        found to cause the mishap; the stated findings support both parts of {O2}.
    rejected:
      O1: It was not chosen because the findings under the preponderance standard identify premature lever raising as the
        cause and the climb-rate misperception as a substantial contributing factor.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The evidence instead failed to establish, by a preponderance, both that premature lever raising caused the mishap
        and that the climb-rate misperception substantially contributed.
      then: O1
      why: Without support for either part of the proposed causal finding, the stated basis for recommending O2 would no longer
        hold.
    would_not_change:
    - id: noflip1
      if: The MIP's lack of opportunity to intervene is emphasized, while the stated findings about the premature retraction,
        impact, and misperception remain supported.
      why: That circumstance does not displace the identified cause or substantial contributing factor.
    watch_for: []
  lesson: When making a causal finding, distinguish the primary cause from a separate contributing factor and connect each
    to the applicable evidence and standard. A contributing factor does not, by itself, negate an independently supported
    causal finding.
  limits: This is an investigative causal attribution under a preponderance-of-evidence standard, not a civil or criminal
    liability determination. The reasoning applies to the stated mishap findings and should not be extended to conclusions
    about fault or liability beyond them.
