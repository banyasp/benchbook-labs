case:
  id: DR-CORPUS-NX-afcd7a16-E3@v1
  title: Landing Decision Under Uncertain Engine Power
  status: draft
  setting: 27 June 2013, MRPA landing operation, military aviation; location not specified
  decider: The MP
  agent: The MP
  agent_role: decide
  situation: A remotely piloted aircraft was approaching for a landing on 27 June 2013. A strong gust occurred at a critical
    point, and the MP considered a successful landing questionable, although reported winds remained within operational limits.
    The engine had suffered a turbocharger failure that reduced its power, but no empirical indication available to the MP
    disclosed the resulting thrust deficiency. Existing technical guidance indicated that engine power should improve during
    descent and did not warn that a go-around could exceed the aircraft’s capability under reduced thrust. An operational
    weight waiver permitted the aircraft to operate at an elevated weight that constrained its ability to climb. The MP faced
    a choice between continuing the landing attempt in gusty conditions and aborting it for a go-around while engine performance
    was uncertain.
  question: 'What should the MP do at the landing decision point: continue the landing attempt or abort it for a go-around?'
  options:
    O1:
      do: The MP aborts the landing attempt and chooses a go-around.
      move: act
      irreversible: true
    O2:
      do: The MP continues the landing attempt instead of choosing a go-around.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: A strong gust occurred during a critical part of the landing, and the MP considered a successful landing questionable.
  - id: F2
    kind: situation
    status: confirmed
    fact: Tower wind reports varied in direction and strength during the ten minutes before the incident, but the reported
      conditions, including gusts, were within operational limits.
  - id: F3
    kind: capability
    status: confirmed
    fact: A turbocharger failure reduced engine output and created a thrust-deficient condition, but no empirical data available
      to the MP would have revealed that condition.
  - id: F4
    kind: situation
    status: confirmed
    fact: The technical guidance indicated that engine power should improve as the aircraft descended and contained no warning
      that sustained flight or a go-around might be outside the aircraft’s capability in a reduced-thrust situation.
  - id: F5
    kind: authority
    status: confirmed
    fact: An operational weight waiver applied to the aircraft’s takeoff weight.
  - id: F6
    kind: capability
    status: assessed
    fact: The aircraft’s operating weight materially reduced its ability to sustain a climb; testing assessed that a lower
      pre-waiver takeoff weight would likely have supported a successful go-around.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The gust occurred at a critical point and made a successful landing questionable. Although reported winds were within
      operational limits, the gust the MP experienced made continuing the landing a significant risk to the aircraft.
  - id: C2
    facts:
    - F3
    - F4
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The turbocharger failure had in fact left the aircraft thrust-deficient, but no empirical information available to
      the MP disclosed that condition. The guidance instead indicated that engine power should improve during descent and
      did not warn that a go-around might exceed the aircraft’s capability; the MP’s choice was therefore made under consequential
      uncertainty.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The operational weight waiver contributed to the aircraft’s limited ability to climb, and testing assessed that a
      lower weight would likely have supported a successful go-around. This weighs against the go-around in hindsight, but
      does not establish that the MP knew its practical effect on the aircraft’s capability.
  - id: C4
    facts:
    - F1
    - F3
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: The decision to go around substantially contributed to the mishap because the reduced engine output made a successful
      go-around impossible. The fact-finder nevertheless judged the decision prudent on the information available, and recognized
      that continuing the landing could also have ended in a crash.
  reasoning:
    read: 'This was a choice between a landing the MP considered questionable because of a strong gust and a go-around whose
      capability was uncertain to the MP. The trap is judging the choice solely from the later-known turbocharger failure:
      the MP had no empirical indication of the resulting thrust deficiency, and the guidance did not warn that a go-around
      might be beyond the aircraft’s capability.'
    weighing: The gust made a successful landing questionable, while the engine’s actual reduced thrust made a successful
      go-around impossible. But that engine limitation was not apparent to the MP, and the available guidance supported the
      belief that power should improve during descent. The elevated operating weight further constrained climb capability,
      and the go-around substantially contributed to the mishap; these are important hindsight factors, not evidence that
      the MP knew the go-around would fail. On the information available at the decision point, the fact-finder considered
      the go-around prudent despite its contribution to the outcome.
    tradecraft: At the decision point, distinguish known landing risk from uncertain aircraft capability and make the choice
      using the information and guidance actually available, rather than hindsight. Record the rationale and material uncertainty
      so later review can distinguish the quality of the decision from the outcome.
    uncertainty: 'The MP could not empirically identify the thrust-deficient condition, and the gust made continued landing
      uncertain as well. The fact-finder also could not determine that continuing would have avoided the mishap: the aircraft
      might have landed successfully, or it might have crashed.'
    handoff: The MP is the identified decision-maker for this immediate choice. The source gives no indication that another
      authority or consultation option was available, so no handoff can be inferred.
    tempting_wrong:
      option: O2
      pull: In hindsight, the turbocharger failure and operating weight made the go-around unsuccessful, and the go-around
        substantially contributed to the mishap.
      why_wrong: That reasoning treats the later-known thrust deficiency as if the MP could have identified it at the time,
        despite the absence of empirical indication and the guidance that power should improve during descent.
    rejected:
      O2: The MP did not continue the landing because the experienced gust made a successful landing questionable, and the
        fact-finder judged the go-around prudent on the information available.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable information available at the decision point showed that the gust had eased enough for a safe landing, while
        the reduced-thrust condition made a go-around unachievable.
      then: O2
      why: That would reverse the balance between the known landing risk and the go-around risk that was uncertain to the
        MP in this case.
    would_not_change:
    - id: noflip1
      if: The Tower’s reported winds remained within operational limits.
      why: That fact alone would not remove the strong gust’s actual effect at the critical landing moment or the MP’s assessment
        that a successful landing was questionable.
    - id: noflip2
      if: The mishap later established that the go-around could not succeed because of reduced engine output.
      why: That hindsight finding alone would not change the decision assessment unless the MP had information at the time
        that disclosed the aircraft’s reduced capability.
    watch_for:
    - id: watch1
      what: Technical guidance that clearly warns that sustained flight or a go-around may be outside the aircraft’s capability
        in a reduced-thrust situation.
      favors:
      - O2
      why: Such guidance could change what the MP understands about go-around capability and address the information gap that
        contributed to the decision.
  lesson: Assess a decision using the information, capability indications, and guidance available to the decision-maker at
    the time, not solely the outcome later revealed. When both available courses carry risk, identify which risk is known
    and which remains uncertain, and preserve that distinction in the decision rationale.
  limits: This judgment concerns the MP’s choice under the particular gust conditions, hidden turbocharger failure, available
    technical guidance, and operating weight described here. It does not establish a general rule that a go-around is preferable
    to continuing a landing, or that the decision would be prudent when reduced-thrust capability is known.
