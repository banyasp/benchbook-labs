case:
  id: DR-OHA-26-0144-restyle1@v1
  title: DOE Access Authorization Eligibility Determination [restyle]
  status: needs_review
  setting: Energy Security Review Board, September 2026
  decider: Senior Adjudicator
  agent: Senior Adjudicator
  agent_role: decide
  situation: The Security Review Office was notified that the Subject's digital wallet account had been terminated due to
    suspicions it facilitated acquisition of child sexual exploitation content. In response, the Office dispatched four interrogatory
    letters dated March 19, March 23, March 27, and April 8 2026, probing the Subject's consumption and procurement of explicit
    material. The Subject's replies were contradictory; he acknowledged employing the digital wallet and a separate online
    payment service for such material and claimed the wallet was opened as a safeguard against potential extortion. Citing
    Adjudicative Guideline D (sexual behavior) and Guideline E (personal conduct), the Office expressed substantial doubt
    regarding the Subject's suitability for continued access authorization. The Senior Adjudicator must determine whether
    the Subject has satisfactorily addressed these concerns and whether his access authorization should be reinstated.
  question: What action should the Senior Adjudicator take regarding the reinstatement of the Subject's access authorization?
  options:
    O1:
      do: Retain the pending status and order additional investigation.
      move: hold
      irreversible: false
    O2:
      do: Approve the reinstatement of the Subject's access authorization.
      move: act
      irreversible: true
    O3:
      do: Reject the request to reinstate the Subject's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Subject had been granted an access authorization before early 2026.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Security Review Office received notice that the Subject's digital wallet account had been terminated due to
      concerns it was used to acquire child sexual exploitation material.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Office sent four interrogatory letters dated March 19, March 23, March 27, and April 8 2026 concerning the Subject's
      viewing and purchase of explicit content.
  - id: F4
    kind: situation
    status: assessed
    fact: The Subject's answers to the letters were inconsistent; he admitted using the digital wallet and an online payment
      platform for explicit material and asserted the wallet was opened to guard against possible blackmail.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Office relied on Guideline D (sexual behavior) and Guideline E (personal conduct) as the foundation for substantial
      doubt about the Subject's eligibility for access authorization.
  - id: F6
    kind: authority
    status: confirmed
    fact: Section 710 establishes a presumption against granting or restoring a security clearance and places the burden on
      the individual to demonstrate eligibility.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: complicity_risk
    favors:
    - O3
    weight: strong
    why: Guideline D (sexual behavior) is triggered because the Subject's acquisition of material that may constitute child
      sexual exploitation creates a risk of coercion and exploitation, and none of the mitigating conditions for Guideline
      D are satisfied.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Although the Subject's deceptive conduct appears relatively isolated, this fact alone does not suffice to eliminate
      the security concerns.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Section 710 imposes a presumption against granting or restoring a clearance; the onus is on the Subject to prove
      eligibility, which he has not met.
  - id: C4
    facts:
    - F4
    equity: due_process
    favors:
    - O3
    weight: weak
    why: The Subject has not pursued treatment, counseling, or any remedial measures that could mitigate the security concerns
      under either Guideline D or E.
  reasoning:
    read: The Office uncovered possible acquisition of child sexual exploitation material and a pattern of covert explicit-content
      transactions, and the Subject's contradictory statements generated substantial doubt under Guidelines D and E.
    weighing: Considering all pertinent information, both favorable and adverse, in a thorough and pragmatic manner, I conclude
      that the Subject has not presented adequate evidence to resolve the security concerns identified by the Office. Accordingly,
      I determine that the Subject's access authorization should not be reinstated.
    tradecraft: The determination is entered into the official OHA docket, referencing the applicable exhibits and regulatory
      citations, and the denial is transmitted to the Subject's sponsoring DOE contractor pursuant to 10 C.F.R. § 710.28.
    uncertainty: The chief uncertainty concerns whether any of the acquired material was indeed child sexual exploitation
      content; the record does not definitively establish this, yet the mere risk satisfies the guidelines.
    handoff: The Senior Adjudicator acts independently, as the OHA's authority resides with the adjudicator to render the
      final decision following the hearing.
    tempting_wrong:
      option: O2
      pull: The Subject's assertion that he has ceased acquiring explicit material and his limited financial documentation
        might tempt a favorable ruling.
      why_wrong: Approving would disregard the unresolved Guideline D and E issues and the statutory presumption against restoration.
    rejected:
      O1: Maintaining a pending status is unnecessary because the existing record already contains sufficient derogatory information
        to support a denial.
      O2: Approving restoration conflicts with the explicit finding that no mitigating conditions are satisfied and with the
        statutory presumption against clearance.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Subject's conduct occurred during adolescence and there is no evidence of comparable conduct as an adult.
      then: O2
      why: Mitigation under Guideline D (condition a) would apply, lessening the security concern.
    - id: flip2
      if: The Subject had completed an accredited treatment program addressing sexual behavior and demonstrated ongoing compliance.
      then: O2
      why: Mitigation under Guideline D (condition e) would be satisfied, reducing the risk.
    - id: flip3
      if: The Subject promptly provided a good-faith correction of all false statements before being confronted.
      then: O2
      why: Mitigation under Guideline E (condition a) would be met, indicating candor.
    would_not_change:
    - id: noflip1
      if: The Subject produced additional financial records showing he ceased all purchases after March 2026.
      why: Even if purchases stopped, the seriousness, recency, and potential CSAM involvement keep the security concerns
        unresolved.
    watch_for:
    - id: watch1
      what: New, credible evidence that the material purchased was not child sexual exploitation content and that the minor
        account was fraudulent.
      favors:
      - O2
      why: If the central allegation of CSAM is disproven, the primary basis for Guideline D would vanish.
  lesson: In adjudicating access authorizations, unresolved security concerns under the Adjudicative Guidelines—particularly
    those involving sexual behavior and lack of candor—override any limited remedial evidence, and the presumption against
    restoration remains controlling.
  limits: This analysis is limited to cases where the record contains credible indications of illicit sexual conduct or deception;
    it does not extend to consensual adult behavior absent any security-relevant risk.
