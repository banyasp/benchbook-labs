case:
  id: DR-OHA-26-0144-flip1@v1
  title: DOE Access Authorization Eligibility Determination [flip]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy, October 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office was warned that the employee's Cash App account had been terminated over suspicions
    it was used to acquire child sexual abuse material. The LSO dispatched four letters of inquiry in March and April 2026
    asking the employee about his consumption and purchase of pornographic content. The employee initially gave contradictory
    answers, but subsequently submitted a written correction and a voluntary amendment that fully clarified his transactions.
    The LSO cited Guideline D (sexual behavior) and Guideline E (personal conduct) of the Adjudicative Guidelines as bases
    for substantial doubt about the employee's eligibility for a security clearance. The Administrative Law Judge must decide
    whether the employee has remedied the security concerns and whether to restore his access authorization.
  question: What should the Administrative Law Judge do regarding the employee's access authorization?
  options:
    O1:
      do: Hold the matter pending additional investigation.
      move: hold
      irreversible: false
    O2:
      do: Grant restoration of the employee's access authorization.
      move: act
      irreversible: true
    O3:
      do: Deny restoration of the employee's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee had been issued a personnel security clearance before the start of 2026.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office received notice that the employee's Cash App account was closed because of concerns it
      was used to purchase child sexual abuse material.
  - id: F3
    kind: situation
    status: confirmed
    fact: Four letters of inquiry dated March 19, March 23, March 27, and April 8 2026 were sent by the LSO requesting details
      about the employee's pornography viewing and purchasing.
  - id: F4
    kind: situation
    status: confirmed
    fact: On March 21 2026, prior to receipt of any interrogatory letter, the Individual submitted a written statement to
      the LSO correcting all earlier inaccuracies about his use of Cash App, stating that the account was opened solely for
      personal financial management and that no illicit material was purchased.
  - id: F5
    kind: situation
    status: assessed
    fact: The Individual initially gave inconsistent answers regarding his Cash App and PayPal activity, but within a day
      of recognizing the discrepancies he voluntarily transmitted a detailed amendment to the LSO, fully clarifying the nature
      and purpose of his transactions.
  - id: F6
    kind: situation
    status: confirmed
    fact: The LSO cited Guideline D (sexual behavior) and Guideline E (personal conduct) as bases for substantial doubt about
      the employee's eligibility for a clearance.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE Order 710 establishes a presumption against granting or restoring a clearance and places the burden on the individual
      to prove eligibility.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    equity: complicity_risk
    favors:
    - O2
    weight: strong
    why: Although the initial alert suggested possible CSAM acquisition, the employee's prompt, documented correction (F4)
      and voluntary amendment (F5) satisfy the candor requirement and mitigate the sexual-behavior concern under Guideline
      D.
  - id: C2
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The employee's isolated lapse in truthfulness has been fully remedied by the timely amendment, reducing the impact
      on institutional credibility.
  - id: C3
    facts:
    - F7
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The employee has now met the evidentiary burden by providing a comprehensive, contemporaneous correction, thereby
      satisfying Part 710's requirement to prove eligibility.
  - id: C4
    facts:
    - F5
    equity: due_process
    favors:
    - O3
    weight: weak
    why: The employee has not undertaken treatment, counseling, or other remedial steps that could further mitigate the security
      concerns under either Guideline D or E.
  reasoning:
    read: The LSO identified a possible CSAM purchase and a pattern of secretive pornography transactions, but the employee
      promptly corrected the record and supplied a full amendment, addressing the candor and sexual-behavior concerns.
    weighing: Considering the totality of the evidence, the employee has satisfied the mitigation requirements under Guidelines
      D and E, and has met the burden imposed by Part 710. Accordingly, the employee's access authorization should be restored.
    tradecraft: The decision is entered into the official OHA docket, citing the relevant exhibits and regulatory provisions,
      and the grant is communicated to the employee's sponsoring DOE contractor per 10 C.F.R. § 710.28.
    uncertainty: The primary remaining uncertainty is whether any of the originally alleged purchases were indeed CSAM; however,
      the employee's corrective actions and lack of ongoing illicit activity substantially reduce the security risk.
    handoff: The Administrative Law Judge decides alone, as the OHA authority is vested in the judge to render the final determination
      after the hearing.
    tempting_wrong:
      option: O3
      pull: The seriousness of the initial CSAM allegation may tempt a denial.
      why_wrong: Denial would overlook the employee's full remediation and the satisfaction of the candor requirement.
    rejected:
      O1: Further investigation is unnecessary because the record now contains a complete and credible correction that resolves
        the security concerns.
      O3: Denial conflicts with the employee's demonstrated candor and the legal burden having been met.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Forensic analysis confirms that the material purchased was indeed child sexual abuse material.
      then: O3
      why: Confirmed CSAM involvement reinstates the security concern under Guideline D.
    - id: flip2
      if: The employee failed to provide a prompt, good-faith correction of false statements before being confronted.
      then: O3
      why: Without timely candor, Guideline E mitigation (condition a) is not met, sustaining the security concern.
    - id: flip3
      if: Investigators uncover undisclosed financial transactions after April 2026 indicating ongoing illicit purchases.
      then: O3
      why: Undisclosed activity demonstrates continued deception, undermining the candor mitigation.
    would_not_change:
    - id: noflip1
      if: The employee produced additional financial records showing he stopped all purchases after March 2026.
      why: Even if purchases ceased, the seriousness, recency, and potential CSAM involvement keep the security concerns unresolved.
    watch_for:
    - id: watch1
      what: New, reliable evidence that the material purchased was not CSAM and that the minor account was a fraud.
      favors:
      - O2
      why: If the core allegation of CSAM is disproven, the primary basis for Guideline D would disappear.
  lesson: When an individual promptly and fully corrects false statements, the candor mitigation can outweigh initial concerns
    under the Adjudicative Guidelines, allowing restoration of access even after serious allegations.
  limits: This reasoning applies only when the corrective action is timely, comprehensive, and verifiable; it does not extend
    to situations where credible evidence of ongoing illicit conduct remains.
