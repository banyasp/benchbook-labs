case:
  id: DR-OHA-26-0144@v1
  title: DOE Access Authorization Eligibility Determination
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, September 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office received an alert that the Individual’s Cash App account was closed because of concerns
    it was used to purchase child sexual abuse material. The LSO issued four letters of interrogatory in March and April 2026
    asking the Individual about his viewing and purchasing of pornography. The Individual responded inconsistently, admitting
    use of Cash App and PayPal for pornography and stating he opened the Cash App to protect against possible blackmail. The
    LSO cited Guideline D (sexual behavior) and Guideline E (personal conduct) of the Adjudicative Guidelines as bases for
    substantial doubt about the Individual’s eligibility for access authorization. The Administrative Judge must decide whether
    the Individual has resolved those security concerns and whether to restore his access authorization.
  question: What should the Administrative Judge do about restoring the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge holds the decision pending further investigation.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was granted an access authorization prior to early 2026.
  - id: F2
    kind: situation
    status: confirmed
    fact: The LSO received an alert that the Individual’s Cash App account was closed due to concerns about the purchase of
      child sexual abuse material.
  - id: F3
    kind: situation
    status: confirmed
    fact: The LSO issued four letters of interrogatory dated March 19, March 23, March 27, and April 8 2026 concerning the
      Individual’s pornography viewing and purchasing.
  - id: F4
    kind: situation
    status: assessed
    fact: The Individual gave inconsistent responses to the LOIs, admitting use of Cash App and PayPal for pornography and
      that he opened the Cash App to protect against possible blackmail.
  - id: F5
    kind: situation
    status: confirmed
    fact: The LSO cited Guideline D (sexual behavior) and Guideline E (personal conduct) as bases for substantial doubt about
      the Individual’s eligibility for access authorization.
  - id: F6
    kind: authority
    status: confirmed
    fact: Part 710 imposes a presumption against granting or restoring a security clearance and requires the individual to
      prove eligibility.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: complicity_risk
    favors:
    - O3
    weight: strong
    why: Guideline D (sexual behavior) applies because the Individual purchased material that may have been child sexual abuse
      material, creating risk of blackmail and exploitation, and none of the mitigating conditions for Guideline D are met.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: I find that the Individual’s untruthful behavior was relatively isolated, but this fact alone is not sufficient to
      resolve the security concerns.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Part 710 imposes a presumption against granting or restoring a clearance; the burden is on the Individual to prove
      eligibility, which he has not satisfied.
  - id: C4
    facts:
    - F4
    equity: due_process
    favors:
    - O3
    weight: weak
    why: The Individual has not undertaken treatment, counseling, or other remedial steps that could mitigate the security
      concerns under either Guideline D or E.
  reasoning:
    read: The LSO uncovered possible CSAM purchases and a pattern of secretive pornography transactions, and the Individual
      gave contradictory statements, raising substantial doubt under Guidelines D and E.
    weighing: After considering all relevant information, favorable and unfavorable, in a comprehensive, common‑sense manner,
      I find that the Individual has not brought forth sufficient evidence to resolve the security concerns asserted by the
      LSO. Accordingly, I have determined that the Individual’s access authorization should not be restored.
    tradecraft: The decision is recorded in the official OHA decision docket, citing the relevant exhibits and regulatory
      provisions, and the denial is communicated to the Individual’s sponsoring DOE contractor per 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty lies in whether any of the purchased material was actually CSAM; the record does
      not conclusively prove it, but the risk alone suffices under the guidelines.
    handoff: The Administrative Judge decides alone, as the OHA authority is vested in the judge to make the final determination
      after the hearing.
    tempting_wrong:
      option: O2
      pull: The Individual’s claim that he stopped purchasing pornography and his limited financial evidence might tempt a
        grant.
      why_wrong: Granting would ignore the unresolved Guideline D and E concerns and the presumption against restoration.
    rejected:
      O1: Holding pending further investigation would be unnecessary because the record already contains sufficient derogatory
        information to support a denial.
      O2: Granting restoration conflicts with the explicit finding that no mitigating conditions are met and with the statutory
        presumption against clearance.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual’s conduct occurred during adolescence and there is no evidence of similar conduct as an adult.
      then: O2
      why: Guideline D mitigation (condition a) would apply, reducing the security concern.
    - id: flip2
      if: The Individual had completed a recognized treatment program for sexual behavior and demonstrated compliance.
      then: O2
      why: Guideline D mitigation (condition e) would be satisfied, mitigating the risk.
    - id: flip3
      if: The Individual provided prompt, good‑faith correction of all false statements before being confronted.
      then: O2
      why: Guideline E mitigation (condition a) would be met, showing candor.
    would_not_change:
    - id: noflip1
      if: The Individual produced additional financial records showing he stopped all purchases after March 2026.
      why: Even if purchases ceased, the seriousness, recency, and potential CSAM involvement keep the security concerns unresolved.
    watch_for:
    - id: watch1
      what: New, reliable evidence that the material purchased was not CSAM and that the minor account was a fraud.
      favors:
      - O2
      why: If the core allegation of CSAM is disproven, the primary basis for Guideline D would disappear.
  lesson: When adjudicating access authorizations, the presence of unresolved security concerns under the Adjudicative Guidelines—especially
    those involving sexual behavior and lack of candor—overrides any limited remedial evidence, and the presumption against
    restoration remains controlling.
  limits: This reasoning applies only where the record contains credible indications of illegal sexual conduct or deception;
    it does not extend to purely consensual adult behavior absent any security‑relevant risk.
