case:
  id: DR-OHA-26-0144-addfact1@v1
  title: DOE Access Authorization Eligibility Determination [addfact]
  status: needs_review
  setting: U.S. Department of Energy, Office of Hearings and Appeals – September 2026
  decider: Presiding Administrative Law Judge
  agent: Presiding Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office learned that the Individual's Cash App account had been terminated because of concerns
    it was used to purchase child sexual abuse material. In response, the office issued four letters of inquiry dated March
    19, March 23, March 27, and April 8, 2026, seeking details about the Individual's viewing and acquisition of pornographic
    material. The Individual's answers were contradictory; he acknowledged using Cash App and PayPal for pornography and claimed
    the Cash App account was opened to protect against possible blackmail. Citing Guideline D (sexual behavior) and Guideline
    E (personal conduct), the LSO asserted that substantial doubt exists regarding his eligibility for a clearance. The Individual
    had been granted a clearance before early 2026, and under Part 710 a presumption against granting or restoring a clearance
    places the burden on the individual to demonstrate eligibility. Additionally, his position is the only one in his unit
    that holds the technical clearance required to operate a critical classified communications system, with no other qualified
    personnel presently available.
  question: What determination should the Administrative Law Judge make concerning the Individual's request for restoration
    of his access authorization?
  options:
    O1:
      do: Hold the case pending further investigation before any restoration decision.
      move: hold
      irreversible: false
    O2:
      do: Grant restoration of the Individual's access authorization at this time.
      move: act
      irreversible: true
    O3:
      do: Deny restoration of the Individual's access authorization at this time.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual received a security clearance before the beginning of 2026.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office was alerted that the Individual's Cash App account had been terminated because of suspicions
      it was used to acquire child sexual abuse material.
  - id: F3
    kind: situation
    status: confirmed
    fact: In March and April 2026, the LSO dispatched four letters of inquiry—dated March 19, March 23, March 27, and April
      8—requesting information about the Individual's consumption and purchase of pornographic material.
  - id: F4
    kind: situation
    status: assessed
    fact: The Individual's replies were contradictory; he acknowledged using Cash App and PayPal for pornographic content
      and claimed he opened the Cash App account to guard against potential blackmail.
  - id: F5
    kind: situation
    status: confirmed
    fact: Citing Adjudicative Guideline D (sexual behavior) and Guideline E (personal conduct), the LSO asserted that substantial
      doubt exists regarding the Individual's eligibility for a clearance.
  - id: F6
    kind: authority
    status: confirmed
    fact: Under 10 CFR 710, a presumption against granting or reinstating a clearance applies, placing the burden on the individual
      to demonstrate eligibility.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual's role is the only position in his unit that possesses the required technical clearance to operate
      a critical classified communications system, and no other qualified staff are presently available.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: complicity_risk
    favors:
    - O3
    weight: strong
    why: Guideline D applies because the Individual's Cash App activity is suspected of involving child sexual-abuse material,
      creating a heightened risk of blackmail and exploitation, and none of the mitigating conditions for Guideline D are
      present.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Although the Individual's false statements appear to be isolated, the mere presence of deception alone does not eliminate
      the security concerns raised by the LSO.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: 10 C.F.R. § 710 imposes a presumption against granting or reinstating a clearance; the Individual has not met the
      burden of proving eligibility.
  - id: C4
    facts:
    - F4
    equity: due_process
    favors:
    - O3
    weight: weak
    why: The Individual has not undertaken any treatment, counseling, or remedial action that could mitigate the concerns
      under Guidelines D or E.
  reasoning:
    read: The LSO uncovered credible indications that the Individual may have purchased child sexual-abuse material and that
      his statements about the transactions were contradictory, raising substantial doubt under Guidelines D and E.
    weighing: Balancing the strong security concerns against the weak operational interest introduced by {F7}, I find that
      the Individual has not provided sufficient evidence to overcome the presumption against restoration and the unresolved
      Guideline D/E issues. Accordingly, the access authorization must be denied at this time.
    tradecraft: The denial is entered into the official OHA docket, citing the relevant exhibits, 10 C.F.R. § 710 provisions,
      and the applicable adjudicative guidelines, and the decision is transmitted to the Individual's sponsoring DOE contractor.
    uncertainty: The record does not definitively establish that the material purchased was CSAM; however, the mere possibility
      sustains the security concern under Guideline D.
    handoff: The Presiding Administrative Law Judge alone makes the final determination pursuant to OHA authority after the
      hearing.
    tempting_wrong:
      option: O2
      pull: The Individual's claim that he ceased purchasing pornography and his limited financial evidence might appear to
        merit a grant.
      why_wrong: Granting would disregard the unresolved Guideline D/E concerns and the statutory presumption against restoration.
    rejected:
      O1: Holding the case pending further investigation is unnecessary because the existing record already contains sufficient
        derogatory information to support a denial.
      O2: Restoring the clearance conflicts with the explicit finding that no mitigating conditions are satisfied and with
        the legal presumption against reinstatement.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual's alleged conduct occurred only during his teenage years and there is no evidence of similar behavior
        as an adult.
      then: O2
      why: Guideline D mitigation (condition a) would apply, reducing the security concern.
    - id: flip2
      if: The Individual had successfully completed a recognized treatment program addressing sexual-behavior issues and demonstrated
        ongoing compliance.
      then: O2
      why: Guideline D mitigation (condition e) would be satisfied, mitigating the risk.
    - id: flip3
      if: The Individual provided an immediate, good-faith correction of all false statements before they were challenged.
      then: O2
      why: Guideline E mitigation (condition a) would be met, showing candor.
    would_not_change:
    - id: noflip1
      if: The Individual produced additional financial records indicating he stopped all purchases after March 2026.
      why: Even if purchases ceased, the seriousness, recency, and potential CSAM involvement keep the security concerns unresolved.
    watch_for:
    - id: watch1
      what: New, reliable evidence that the material purchased was not CSAM and that the alleged minor account was fraudulent.
      favors:
      - O2
      why: If the core allegation of CSAM is disproven, the primary basis for Guideline D would disappear.
  lesson: When adjudicating access-authorization requests, unresolved security concerns under the Adjudicative Guidelines—particularly
    those involving sexual behavior and lack of candor—override even a modest operational need, and the presumption against
    restoration remains controlling.
  limits: This analysis applies only where the record contains credible indications of illegal sexual conduct or deception;
    it does not extend to purely consensual adult behavior absent any security-relevant risk.
