case:
  id: DR-OHA-26-0144-revise1@v1
  title: DOE Access Authorization Eligibility Determination [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, September 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office received an alert that the Individual’s Cash App account was closed because of concerns
    it was used to purchase child sexual abuse material. The LSO issued four letters of interrogatory in March and April 2026
    asking the Individual about his viewing and purchasing of pornography. The Individual responded inconsistently, admitting
    use of Cash App and PayPal for pornography and stating he opened the Cash App to protect against possible blackmail. The
    LSO cited Guideline D (sexual behavior) and Guideline E (personal conduct) of the Adjudicative Guidelines as bases for
    substantial doubt about the Individual’s eligibility for access authorization. The Administrative Judge must decide whether
    the Individual has resolved those security concerns and whether to restore his access authorization.
  question: What should the Administrative Judge do about restoring the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge holds the decision pending further investigation.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was granted an access authorization prior to early 2026.
  - id: F2
    kind: situation
    status: confirmed
    fact: The LSO received an alert that the Individual’s Cash App account was closed due to concerns about the purchase of
      child sexual abuse material.
  - id: F3
    kind: situation
    status: confirmed
    fact: The LSO issued four letters of interrogatory dated March 19, March 23, March 27, and April 8 2026 concerning the
      Individual’s pornography viewing and purchasing.
  - id: F4
    kind: situation
    status: assessed
    fact: The Individual gave inconsistent responses to the LOIs, admitting use of Cash App and PayPal for pornography and
      that he opened the Cash App to protect against possible blackmail.
  - id: F5
    kind: situation
    status: confirmed
    fact: The LSO cited Guideline D (sexual behavior) and Guideline E (personal conduct) as bases for substantial doubt about
      the Individual’s eligibility for access authorization.
  - id: F6
    kind: authority
    status: confirmed
    fact: Part 710 imposes a presumption against granting or restoring a security clearance and requires the individual to
      prove eligibility.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: complicity_risk
    favors:
    - O3
    weight: strong
    why: Guideline D (sexual behavior) applies because the Individual purchased material that may have been child sexual abuse
      material, creating risk of blackmail and exploitation, and none of the mitigating conditions for Guideline D are met.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: I find that the Individual’s untruthful behavior was relatively isolated, but this fact alone is not sufficient to
      resolve the security concerns.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: Part 710 still presumes against restoration, but the burden is less compelling when the alleged CSAM purchase is
      not definitively proven.
  - id: C4
    facts:
    - F4
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual has taken steps—admitting use of Cash App, claiming it was to prevent blackmail, and showing willingness
      to cooperate—that mitigate the concerns under Guideline E.
  - id: C5
    facts:
    - F4
    equity: mitigation_candor
    favors:
    - O2
    weight: weak
    why: Partial candor and the expressed intent to protect against blackmail demonstrate mitigating personal conduct that
      lessens security risk.
  reasoning:
    read: The LSO flagged possible CSAM purchases and inconsistent statements, yet the Individual admitted the behavior, explained
      a protective motive, and has not been shown to continue the conduct.
    weighing: Balancing the unresolved allegation against the mitigating factors of admission, lack of proven ongoing misconduct,
      and the Individual's expressed intent to prevent blackmail leads to a conclusion that the security concerns are sufficiently
      mitigated to restore access.
    tradecraft: The decision is entered into the OHA docket, citing the relevant adjudicative guidelines, Part 710, and the
      mitigating consideration, and the restoration order is communicated to the sponsoring DOE contractor.
    uncertainty: Uncertainty remains about whether any purchased material was CSAM, but the absence of definitive proof and
      the Individual's mitigating conduct tip the balance toward restoration.
    handoff: The Administrative Judge retains sole authority to issue the final determination after weighing the evidentiary
      record.
    tempting_wrong:
      option: O3
      pull: The seriousness of the alleged CSAM purchase and the presumption against restoration may tempt a denial.
      why_wrong: Denial would ignore the Individual's partial candor, lack of proof of ongoing misconduct, and demonstrated
        mitigating conduct.
    rejected:
      O1: A pending investigation is unnecessary because the record already shows sufficient mitigating evidence to support
        a grant.
      O3: Denial overstates the security risk given the Individual's admission, lack of conclusive CSAM evidence, and demonstrated
        mitigating conduct.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C4
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: New evidence shows the Individual continued purchasing pornographic material after March 2026.
      then: O3
      why: Ongoing behavior indicates lack of rehabilitation and sustains the security risk.
    - id: flip2
      if: The Individual fails to provide verifiable evidence that the alleged CSAM purchases were not made by him.
      then: O3
      why: Without proof, the security concerns remain unresolved, justifying denial.
    - id: flip3
      if: The Individual's employer requests a temporary hold pending a full background reinvestigation.
      then: O1
      why: Administrative prudence warrants postponement until the investigation concludes.
    would_not_change:
    - id: noflip1
      if: The Individual produced additional financial records showing he stopped all purchases after March 2026.
      why: Even if purchases ceased, the seriousness, recency, and potential CSAM involvement keep the security concerns unresolved.
    watch_for:
    - id: watch1
      what: New, reliable evidence that the material purchased was not CSAM and that the minor account was a fraud.
      favors:
      - O2
      why: If the core allegation of CSAM is disproven, the primary basis for Guideline D would disappear.
  lesson: When the evidentiary record contains unproven but serious allegations, the adjudicator must weigh mitigating conduct,
    partial candor, and lack of ongoing misconduct, allowing restoration if the balance of risk is sufficiently reduced.
  limits: This analysis applies only where allegations of illegal sexual conduct remain unconfirmed and the individual demonstrates
    mitigating factors; it does not extend to cases with proven CSAM involvement or continued deceptive behavior.
