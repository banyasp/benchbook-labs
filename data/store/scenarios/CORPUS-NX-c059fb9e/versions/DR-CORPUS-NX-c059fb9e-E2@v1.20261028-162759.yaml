case:
  id: DR-CORPUS-NX-c059fb9e-E2@v1
  title: Necessity and Compelled Labor
  status: draft
  setting: Nuremberg Trials of industrialists; time not specified; Tribunal proceedings.
  decider: The Tribunal
  agent: The Tribunal
  agent_role: decide
  situation: Production quotas were fixed by the Ministry and were described as obligatory. The defendants maintained that
    there was not enough other labor available to meet them, and that government agencies made prisoners of war, forced laborers,
    and concentration-camp inmates available. They asserted that refusing to use this labor could bring serious consequences
    from government authorities who supervised their activities. The Tribunal must assess whether the asserted pressure and
    labor shortage made the defendants' conduct necessary or compelled. The applicable question includes whether their will
    was overpowered by the threat or instead coincided with the will of those issuing the orders.
  question: What should the Tribunal do with the defendants' necessity defense?
  options:
    O1:
      do: The Tribunal requests further evidence from both parties on compulsion.
      move: ask
      irreversible: false
      to: the parties
    O2:
      do: The Tribunal grants the necessity defense against the defendants.
      move: act
      irreversible: true
    O3:
      do: The Tribunal denies the necessity defense against the defendants.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The defense maintained that the Ministry fixed production quotas and that meeting them was obligatory.
  - id: F2
    kind: situation
    status: assessed
    fact: The defense maintained that other labor was not available in sufficient quantities to meet the quotas.
  - id: F3
    kind: situation
    status: assessed
    fact: The defense maintained that government agencies made prisoners of war, forced laborers, and concentration-camp inmates
      available for the work.
  - id: F4
    kind: authority
    status: assessed
    fact: The defendants asserted that government authorities exercised rigid supervision over their activities.
  - id: F5
    kind: situation
    status: assessed
    fact: The defendants asserted that refusing to use the labor would expose them to dire consequences at the hands of government
      authorities.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Tribunal assessed that the likely worst consequences of disobedience were loss of a plant for one accused and
      loss of posts for the other accused.
  - id: F7
    kind: authority
    status: confirmed
    fact: For necessity to justify the conduct, the accused's will had to be overpowered by the pressure rather than coincide
      with the will of those issuing the orders.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The quotas, claimed labor shortage, government provision of the labor, and asserted threat of consequences explain
      the defendants' claim of compulsion, but do not by themselves establish that their will was overpowered.
  - id: C2
    facts:
    - F4
    - F5
    - F7
    equity: complicity_risk
    favors:
    - O3
    weight: strong
    why: 'The Tribunal distinguished pressure from compulsion: if the defendants'' will was not overpowered and instead coincided
      with the will of those issuing the orders, the conduct was not justified as necessary. The Tribunal found that to be
      this case.'
  - id: C3
    facts:
    - F6
    equity: complicity_risk
    favors:
    - O3
    weight: strong
    why: The Tribunal assessed that the likely worst consequences of disobedience were loss of the plant or the defendants'
      posts. It considered those consequences against the conduct adopted to avoid them and rejected the defense.
  reasoning:
    read: The trap is treating fixed quotas, inadequate labor supply, government supervision, and threatened consequences
      as proof that the defendants had no choice. The Tribunal's decisive distinction was whether the pressure overpowered
      their will or whether their will coincided with that of the officials issuing the orders.
    weighing: The quotas, labor shortage, and asserted government consequences supported the defendants' account of pressure
      {C1}. But the Tribunal found that their will was not overpowered and that it coincided with the will of those issuing
      the orders {C2}. It also assessed the likely worst consequences of disobedience as loss of a plant or posts, and rejected
      the defense in light of those consequences and the remedy adopted {C3}.
    tradecraft: Record the distinction between the defendants' asserted circumstances and the Tribunal's findings, and state
      separately why those circumstances did not establish an overborne will. Do not treat the existence of government orders
      or supervision as dispositive.
    uncertainty: The decision turns on the Tribunal's assessment of the defendants' will and the likely consequences of disobedience.
      The stated facts do not support adding a different threat or consequence to that assessment.
    handoff: The Tribunal is the decision-maker on this defense; the stated reasons provide a basis to resolve it without
      requesting further evidence.
    tempting_wrong:
      option: O2
      pull: The quotas were described as obligatory, other labor was said to be insufficient, and the defendants asserted
        that disobedience would bring dire consequences.
      why_wrong: Those circumstances did not persuade the Tribunal that the defendants' will was overpowered; it found instead
        that their will coincided with that of the order-givers, and assessed the likely consequences as loss of a plant or
        posts.
    rejected:
      O1: The Tribunal resolved the defense on the evidence and made findings on both the defendants' will and the likely
        consequences of disobedience, so it did not request further evidence.
      O2: The Tribunal found that the defendants' will was not overpowered and rejected the necessity defense.
      O3: Chosen because the Tribunal rejected the necessity defense.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Tribunal found that the defendants' will was actually overpowered by the pressure, rather than coinciding with
        the will of those issuing the orders, and that the conduct avoided a serious and irreparable evil without a disproportionate
        remedy.
      then: O2
      why: Those findings would remove the Tribunal's stated reason for rejecting necessity and satisfy the conditions it
        applied to the defense.
    would_not_change:
    - id: noflip1
      if: The quotas were obligatory and other labor remained insufficient, without a finding that the defendants' will was
        overpowered.
      why: Those circumstances alone do not displace the Tribunal's decisive finding that the defendants' will coincided with
        the will of the order-givers.
    watch_for:
    - id: watch1
      what: Evidence bearing on whether the defendants' will was overpowered or instead coincided with the will of those issuing
        the orders.
      favors:
      - O2
      - O3
      why: That distinction is central to the Tribunal's application of necessity.
  lesson: Orders, labor shortages, and threatened professional or property consequences do not by themselves establish necessity.
    The decision turns on whether the pressure overpowered the defendants' will and whether the conduct used to avoid the
    threatened evil was proportionate.
  limits: This reasoning addresses the industrialists' necessity defense on the stated facts, particularly the Tribunal's
    findings about their will and the likely consequences of disobedience. It does not determine how necessity would apply
    to a different threat or a different record.
