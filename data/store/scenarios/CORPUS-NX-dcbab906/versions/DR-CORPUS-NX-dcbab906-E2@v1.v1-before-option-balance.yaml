case:
  id: DR-CORPUS-NX-dcbab906-E2@v1
  title: Extraordinary Authority Amid Urban Crisis
  status: draft
  setting: Algiers, later in the Algerian War, French civil and military authorities
  decider: French authorities
  agent: French authorities
  agent_role: decide
  situation: Later in the war, the conflict had shifted to urban terrorism in Algiers. The civil police were overwhelmed while
    attempting a counterterrorism campaign in an urban environment. Earlier, French authorities had treated the emergency
    as a tribal uprising and a law-enforcement problem. The Gendarmerie had also been overwhelmed during the initial policing
    response. French authorities must decide whether to grant paratroopers extraordinary legal powers in the Casbah sector
    of Algiers.
  question: What should French authorities do about granting paratroopers extraordinary legal powers in the Casbah sector
    of Algiers?
  options:
    O1:
      do: French authorities decline extraordinary legal powers for paratroopers in the Casbah sector of Algiers.
      move: act
      irreversible: false
    O2:
      do: French authorities authorize extraordinary legal powers for paratroopers in the Casbah sector of Algiers.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: French authorities initially treated the emergency as a tribal uprising.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: There was no precise intelligence indicating a growing insurgency at the outset.
  - id: F3
    kind: situation
    status: assessed
    fact: The initial situation appeared to French authorities to be a law-enforcement problem.
  - id: F4
    kind: capability
    status: confirmed
    fact: The initial response was a policing action by the constabulary rather than an organized counterinsurgency effort,
      and it drew on colonial experience.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Gendarmerie was soon overwhelmed during the initial policing response.
  - id: F6
    kind: situation
    status: confirmed
    fact: Later in the war, the conflict shifted to urban terrorism in Algiers.
  - id: F7
    kind: capability
    status: confirmed
    fact: The civil police were overwhelmed while attempting a counterterrorism campaign in an urban environment.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The initial policing response reflected the authorities’ limited understanding of the threat, but the Gendarmerie
      was soon overwhelmed and the army had to intervene. That experience weighs against relying on policing alone once it
      again proved inadequate.
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The later problem was urban terrorism, and the civil police were overwhelmed while conducting a counterterrorism
      campaign in that environment. The stated circumstances support granting the military extraordinary authority as a response
      to the police’s inability to manage the threat.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: After the paratroopers received extraordinary legal powers, the 10th Parachute Division destroyed the FLN and ALN
      organizations in Algiers by fall 1957. The account presents this as the operational result of the response.
  reasoning:
    read: The situation had shifted from an initially misunderstood emergency to urban terrorism that overwhelmed civil police.
      The trap is to treat the initial law-enforcement framing as a reason to keep relying on police, despite the later failure
      of that approach in Algiers.
    weighing: The prior collapse of the Gendarmerie and the civil police’s inability to manage the urban counterterrorism
      campaign weigh in favor of {O2}; the account also associates the military response with dismantling the FLN and ALN
      organizations in Algiers. The balance turns on the documented inability of civil police to manage the threat. The account
      does not assess the legal limits of the extraordinary powers or their effects on individuals.
    tradecraft: As an authored decision practice, record the police-capacity failure and the purpose and legal scope of the
      authority granted; reassess whether the circumstances still justify that delegation.
    uncertainty: The account gives no detailed legal standard for the extraordinary powers and does not evaluate their effects
      on civilians or individual rights. Its stated basis is the police’s inability to manage the urban threat and the reported
      operational outcome.
    handoff: As an authored practice, French authorities should make the decision with the officials responsible for the legal
      delegation and the civil-police response, so the authority and its limits are clear.
    tempting_wrong:
      option: O1
      pull: Declining extraordinary powers may seem preferable because the initial response was framed as a law-enforcement
        problem.
      why_wrong: That framing did not match the later urban threat or the civil police’s demonstrated capacity; the account
        describes the police as overwhelmed.
    rejected:
      O1: French authorities did not continue to rely on civil policing alone after it was overwhelmed in the urban counterterrorism
        campaign.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Civil police were able to manage the urban counterterrorism threat rather than being overwhelmed.
      then: O1
      why: The stated reason for transferring extraordinary authority was the civil police’s inability to manage the urban
        threat.
    - id: flip2
      if: The conflict had not shifted to urban terrorism in Algiers.
      then: O1
      why: The decision’s stated circumstances concern an urban threat and the civil police’s failure in that environment;
        absent that situation, the account supplies no basis for this exceptional response.
    would_not_change:
    - id: noflip1
      if: There remained no precise intelligence indicating a growing insurgency at the outset.
      why: That initial intelligence gap explains the early policing response, but does not negate the later evidence that
        civil police were overwhelmed in Algiers.
    watch_for:
    - id: watch1
      what: Whether civil police remain overwhelmed and whether the extraordinary delegation has a clear legal scope.
      favors:
      - O2
      - O1
      why: Continuing police incapacity supports extraordinary authority; a change in capacity or unresolved limits on the
        delegation may weigh against it.
  lesson: When civil authorities are overwhelmed by a changed threat, the decision-maker may need to reconsider who has authority
    to respond rather than persist with an ineffective initial approach. Any extraordinary delegation should remain tied to
    the circumstances that justify it and its legal scope should be clear.
  limits: This reasoning addresses the decision to grant extraordinary legal powers in response to overwhelmed civil police;
    it does not evaluate the specific measures taken under those powers. The account supplies no legal standard or assessment
    of their effects on civilians or individual rights.
