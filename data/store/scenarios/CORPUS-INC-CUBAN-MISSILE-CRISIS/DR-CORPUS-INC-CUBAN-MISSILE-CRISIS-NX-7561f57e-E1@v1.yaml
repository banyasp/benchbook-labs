case:
  id: DR-CORPUS-INC-CUBAN-MISSILE-CRISIS-NX-7561f57e-E1@v1
  title: Estimating the Soviet Military Build-up in Cuba
  status: draft
  setting: U.S. intelligence community, 14 September 1962, estimate on the military build-up in Cuba.
  decider: The U.S. intelligence estimative body
  agent: The U.S. intelligence estimative body
  agent_role: decide
  situation: The intelligence community is preparing an estimate of the Soviet military build-up in Cuba. The available assessment
    is that the Soviets are developing a defensive capability, and there is no evidence of actual or prospective offensive
    weapon deployment. The judgment that offensive weapons probably would not be deployed relies on secondary evidence and
    prior Soviet policy. A senior intelligence official holds a contrary intuition that the Soviets will deploy offensive
    weapons, but that intuition is unsupported by evidence.
  question: What should the U.S. intelligence estimative body do in the 14 September 1962 estimate on the military build-up
    in Cuba?
  options:
    O1:
      do: The estimative body should assess the build-up as defensive and exclude likely offensive deployment.
      move: act
      irreversible: false
    O2:
      do: The estimative body should assess possible offensive deployment and include that possibility in its estimate.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The estimate concerns the Soviet military build-up in Cuba.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Soviets were assessed to be developing a defensive military capability.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: There was no evidence of actual or prospective offensive weapon deployment.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The judgment that the Soviets probably would not deploy offensive weapons in Cuba was based on secondary evidence.
  - id: F5
    kind: intelligence
    status: assessed
    fact: One strand of the secondary evidence was the previous Soviet policy of not stationing offensive strategic weapons
      outside Soviet borders.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Another strand of the secondary evidence was the previous Soviet policy of avoiding direct confrontations where
      the United States held a decisive military advantage.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A senior intelligence official believed the Soviets would deploy offensive weapons in Cuba, based on intuition that
      was otherwise unsupported.
  - id: F8
    kind: situation
    status: confirmed
    fact: The senior intelligence official was away when the estimate was produced.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: 'The estimate had a reasoned, though secondary, basis: prior Soviet policy suggested the Soviets would avoid stationing
      offensive strategic weapons abroad and avoid a direct confrontation where the United States had decisive military advantage.'
  - id: C2
    facts:
    - F3
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: There was no evidence of offensive deployment, and the contrary intuition was otherwise unsupported; intuition alone
      does not make converts.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: 'The estimate became less flexible than Soviet policy: a policy change, or indicators that a change might be coming,
      was not read. The estimate should preserve the possibility of offensive deployment rather than treat the prior policy-based
      judgment as fixed.'
  - id: C4
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: When estimative judgments harden, they become increasingly difficult to modify without incontrovertible evidence,
      which is rare; that rigidity contributed to the U.S. government's slow reaction.
  reasoning:
    read: 'The estimate had a persuasive policy-based case for a defensive buildup, but its conclusion depended on secondary
      evidence about prior Soviet behavior. The trap is turning that reasoned judgment into a fixed expectation: an unsupported
      intuition alone is not enough to overturn an estimate, but neither should a prior policy judgment prevent recognition
      of a possible change.'
    weighing: 'The evidence and rationale support {O1} as the best-supported account of what was then known. The retrospective
      lesson nevertheless favors {O2}: include the possibility of offensive deployment without presenting it as established
      or likely, and avoid letting a judgment based on prior policy become inflexible. The balance depends on distinguishing
      the absence of evidence from evidence that policy cannot change, and on remaining responsive to indications of change.'
    tradecraft: State the basis and limits of the policy-based assessment, distinguish what is assessed from what remains
      possible, and keep the judgment open to revision as indicators or evidence change. This is a decision-practice synthesis,
      not a claim that a particular recording procedure was prescribed.
    uncertainty: The judgment that offensive weapons probably would not be deployed rested on secondary evidence, and incontrovertible
      evidence is rare. The contrary intuition was unsupported, so it should not be treated as evidence; uncertainty should
      instead be made visible rather than concealed by a categorical exclusion.
    handoff: The estimative body makes the estimate. The intelligence community and senior advisers shared the original judgment,
      but agreement alone should not substitute for continued reconsideration of whether Soviet policy may be changing.
    tempting_wrong:
      option: O1
      pull: It follows the estimate's persuasive secondary evidence and prior Soviet policy, alongside the absence of evidence
        for offensive deployment.
      why_wrong: 'It becomes wrong if that rationale is used to exclude the possibility categorically: the retrospective lesson
        is that judgments hardened and changes in Soviet policy or indicators of change were not read.'
    rejected:
      O1: The prior-policy rationale was substantial, but excluding the possibility of offensive deployment risks repeating
        the inflexibility identified in the retrospective lesson.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The case for including offensive deployment rested only on an unsupported intuition, with no evidence or indication
        of a policy change.
      then: O1
      why: An otherwise unsupported intuition does not make converts; in that circumstance, it would not justify displacing
        the reasoned estimate.
    would_not_change:
    - id: noflip1
      if: The estimate remained persuasive to the intelligence community and senior advisers because it rested on the prior-policy
        rationale.
      why: Shared belief in the estimate does not answer the concern that judgments can harden and become difficult to revise.
    watch_for:
    - id: watch1
      what: Indications that Soviet policy is changing, or that a change may be in the making.
      favors:
      - O2
      why: Failure to read such changes or indicators contributed to hardened judgments and slow reaction.
  lesson: A persuasive estimate based on past policy is still a judgment, not a guarantee that policy will remain unchanged.
    Do not substitute unsupported intuition for evidence, but do not let consensus or a compelling prior rationale make an
    estimate impervious to indicators of change.
  limits: This reasoning supports including a possibility in an estimate, not asserting that offensive deployment was established
    or probable. It does not resolve what evidence would be sufficient in a different case; the relevant principle is to remain
    flexible and responsive to change.
  library:
    domain: intel-analysis
    family: CORPUS-INC-CUBAN-MISSILE-CRISIS
    source: https://www.cia.gov/resources/csi/static/546aa8efaed23d899380eb65ee478ab6/Kent-Final-Thoughts-Analyst-Policymaker-Relations.pdf
    episode_focus: 'The decision point is the 14 September 1962 estimate: whether to judge that the Soviet military buildup
      was defensive or that offensive weapons might be deployed. The estimate favored the former based on secondary evidence
      and prior Soviet policy; exclude the hypothetical question of whether the Director of Central Intelligence would have
      persuaded the President to accept a contrary intuitive judgment.'
    cues:
      option_words:
        O2: 15
        O1: 14
      real_option: O2
      real_to_mean_other_length: 1.07
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
