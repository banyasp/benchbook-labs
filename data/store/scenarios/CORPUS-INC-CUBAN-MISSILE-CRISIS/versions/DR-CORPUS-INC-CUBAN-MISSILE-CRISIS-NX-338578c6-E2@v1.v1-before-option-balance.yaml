case:
  id: DR-CORPUS-INC-CUBAN-MISSILE-CRISIS-NX-338578c6-E2@v1
  title: Assessing Possible Warhead Presence
  status: draft
  setting: Cuba, 29 September, Intelligence Summary
  decider: The analysts who authored the Intelligence Summary
  agent: The analysts who authored the Intelligence Summary
  agent_role: decide
  situation: Analysts preparing an Intelligence Summary were assessing whether nuclear warheads might be in Cuba. They had
    noted construction of nuclear storage facilities, but none of the facilities was complete. They could not prove definitively
    that warheads were present. The question was whether to assume warheads might be present to support the operational missile
    capability as it became available, or withhold that assessment.
  question: What should the analysts do about whether to assume that nuclear warheads may now be in Cuba to support the operational
    missile capability as it becomes available?
  options:
    O1:
      do: The analysts assume that nuclear warheads may now be in Cuba to support the operational missile capability as it
        becomes available.
      move: act
      irreversible: false
    O2:
      do: The analysts decline to assume that nuclear warheads may now be in Cuba to support the operational missile capability
        as it becomes available.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Intelligence Summary was authored by analysts.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The analysts could not prove definitively that nuclear warheads were in Cuba.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The analysts had noted construction of nuclear storage facilities.
  - id: F4
    kind: situation
    status: confirmed
    fact: None of the nuclear storage facilities was complete.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The possibility under consideration was that nuclear weapons might be in Cuba to support the operational missile
      capability.
  - id: F6
    kind: capability
    status: assessed
    fact: The operational missile capability was described as becoming available.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The analysts lacked definitive proof, and none of the storage facilities was complete; those limits counsel against
      presenting warhead presence as established.
  - id: C2
    facts:
    - F3
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The observed construction and the missile capability becoming available supported assessing that warheads might be
      present for that capability, even though presence was unproven.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The analysts judged the qualified assumption that warheads might be present logical and accurate, despite the lack
      of definitive proof and the unfinished facilities.
  reasoning:
    read: The analysts faced a judgment about possibility, not a finding that warheads were definitively present. The trap
      is treating incomplete facilities and lack of proof as requiring silence about a possibility relevant to the emerging
      missile capability.
    weighing: The evidentiary limits {C1} mattered, but they did not outweigh the observed facility construction and the approaching
      availability of the operational missile capability {C2}. The authors endorsed the assumption as logical and accurate
      {C3}. The balance depends on keeping the judgment qualified as a possibility rather than stating presence as proven.
    tradecraft: State the assessment as a possibility, preserve the lack of definitive proof and incomplete-facility caveats,
      and distinguish those caveats from the conclusion.
    uncertainty: Presence was not proven, and the facilities were unfinished. The analysts nevertheless assessed that warheads
      might be present; subsequent movement of warheads into Cuba supports the accuracy of that judgment.
    handoff: The analysts authored the Intelligence Summary and made this assessment. No required referral or additional decision-maker
      is identified, so this scenario treats the judgment as theirs.
    tempting_wrong:
      option: O2
      pull: Withhold the assessment because there was no definitive proof and no storage facility was complete.
      why_wrong: That would treat uncertainty as a reason to omit a relevant possibility, despite the construction underway
        and the missile capability becoming available; the authors judged the qualified assumption logical and accurate.
    rejected:
      O2: The analysts did not withhold the assessment because they judged that warheads might be present to support the emerging
        missile capability, notwithstanding the lack of definitive proof.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The missile capability were not becoming available and there were no observed construction of nuclear storage facilities.
      then: O2
      why: Without the contextual indicators that supported the assessment here, assuming warheads might be present would
        have a weaker evidentiary basis.
    would_not_change:
    - id: noflip1
      if: The analysts still lacked definitive proof and the storage facilities remained incomplete.
      why: Even with no definitive proof and unfinished facilities, the analysts judged the qualified assumption logical and
        accurate.
    watch_for:
    - id: watch1
      what: Further evidence bearing on whether warheads might be present to support the emerging missile capability.
      favors:
      - O1
      why: Such evidence could strengthen the basis for the possibility assessment, while the assessment should remain distinct
        from proof of presence.
  lesson: When a consequential estimate concerns a possibility rather than a proven fact, do not confuse lack of certainty
    with lack of grounds to assess it. State the uncertainty plainly and weigh the available indicators in context.
  limits: This reasoning supports a qualified possibility assessment in the circumstances described; it does not establish
    that warheads were present on 29 September or supply a general evidentiary threshold for other intelligence judgments.
    The later movement of warheads supports this particular estimate but does not remove the original uncertainty.
  library:
    domain: intel-analysis
    family: CORPUS-INC-CUBAN-MISSILE-CRISIS
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-45.pdf
    episode_focus: 'The decision point is the analysts’ judgment under uncertainty: whether to assume warheads were present
      or withhold that assessment because storage facilities were incomplete and proof was lacking. Keep the focus on the
      evidentiary basis and consequences of the estimate, not reconnaissance or collection methods.'
