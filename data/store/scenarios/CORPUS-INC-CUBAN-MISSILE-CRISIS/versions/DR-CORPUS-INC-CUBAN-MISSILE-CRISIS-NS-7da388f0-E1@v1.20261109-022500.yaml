case:
  id: DR-CORPUS-INC-CUBAN-MISSILE-CRISIS-NS-7da388f0-E1@v1
  title: Interpreting Cuba’s New Air-Defense Installations
  status: draft
  setting: Cuba, August–September 1962; U.S. intelligence community
  decider: The Director of Central Intelligence
  agent: The Director of Central Intelligence
  agent_role: decide
  situation: By early summer, U.S. analysts assessed that Cuba was assembling an air-defense system modeled on the Soviet
    system. Soviet officials had assured the U.S. government that military equipment sent to Cuba was for defense and that
    offensive weapons would not be introduced. In August and September 1962, Soviet deliveries to Cuba reached their highest
    levels ever seen. In August, analysts had indications that new air-defense installations were under construction, and
    those assets were described as very expensive. The Director of Central Intelligence must assess whether the installations
    belonged to Cuba’s air-defense system or were intended to conceal construction of offensive missile installations; officials
    in the defense and intelligence communities disagreed.
  question: What should the Director of Central Intelligence assess about the purpose of the new air-defense installations
    in Cuba?
  options:
    O1:
      do: The Director of Central Intelligence accepts the concealment interpretation and assesses the installations as intended
        to conceal construction of offensive missile sites.
      move: act
      irreversible: false
    O2:
      do: The Director of Central Intelligence rejects the concealment interpretation and assesses the installations as part
        of Cuba’s air-defense system.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: By early summer, NSA analysts assessed that Cuba was assembling an air-defense system modeled on the Soviet system.
  - id: F2
    kind: situation
    status: confirmed
    fact: Soviet officials assured the U.S. government that the military equipment sent to Cuba was for defense and that offensive
      weapons would not be introduced.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Soviet deliveries to Cuba surged in August and September 1962 to the highest levels ever seen.
  - id: F4
    kind: intelligence
    status: assessed
    fact: In August, CIA analysts saw the first indications of construction of new air-defense installations in Cuba.
  - id: F5
    kind: situation
    status: confirmed
    fact: The new air-defense assets were very expensive.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Officials in the defense and intelligence communities disagreed with the Director of Central Intelligence’s interpretation
      of the purpose of the installations.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Director inferred that the new, very expensive installations amid the surge in deliveries were intended to prevent
      the United States from seeing construction of offensive missile installations.
  - id: C2
    facts:
    - F1
    - F2
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The existing assessment of a Soviet-modeled Cuban air-defense system and Soviet assurances of defensive intent provide
      a defensive explanation, but the Director did not accept that explanation as resolving the purpose of the new installations.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    - O1
    weight: weak
    why: Officials in the defense and intelligence communities disagreed with the Director; the record establishes a real
      dispute but does not state their reasons, so their disagreement limits certainty without resolving the choice.
  reasoning:
    read: The question is not whether Cuba was assembling an air-defense system; that was already assessed. The disputed issue
      is whether the new installations also served to conceal offensive missile-site construction. The trap is treating a
      defensive system context or official assurances as conclusive proof that these particular installations had only a defensive
      purpose.
    weighing: The Director's stated inference was that the new installations were intended to deny the United States the ability
      to see construction of offensive missile installations. Their expense and the surge in Soviet deliveries formed the
      surrounding context for that judgment. The defensive-system assessment and Soviet assurances support O2, while the recorded
      disagreement counsels against presenting O1 as certain; nevertheless, the Director endorsed O1.
    tradecraft: Record the concealment assessment as an inference, distinguish it from the established air-defense assessment,
      and preserve the competing interpretation and the fact of disagreement. Do not present the inferred purpose as confirmed.
    uncertainty: The excerpt gives the Director's conclusion but not the dissenters' reasoning or a definitive confirmation
      of the installations' purpose. The assessment is therefore contested.
    handoff: The Director made the assessment, but the recorded disagreement makes it important to retain the defense and
      intelligence communities' competing views rather than imply unanimity.
    tempting_wrong:
      option: O2
      pull: The installations fit the broader assessment that Cuba was assembling a Soviet-modeled air-defense system, and
        Soviet officials had described the equipment as defensive.
      why_wrong: Those facts support a defensive interpretation but do not answer the Director's distinct inference that the
        new installations were intended to conceal offensive missile-site construction.
    rejected:
      O2: The Director did not accept the defensive-system interpretation as the purpose of the new installations, instead
        concluding that they were intended to deny the United States visibility of offensive missile-site construction.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the new installations had a defensive purpose only and were not intended to conceal
        offensive missile-site construction.
      then: O2
      why: That would directly undermine the Director's stated inference about their purpose.
    would_not_change:
    - id: noflip1
      if: The only additional information were renewed Soviet assurances that the equipment was defensive.
      why: The source records such assurances alongside the buildup, yet the Director still reached the concealment interpretation;
        assurances alone would not resolve the disputed purpose.
    watch_for:
    - id: watch1
      what: Independent evidence bearing on whether the installations were intended to conceal construction of offensive missile
        sites.
      favors:
      - O1
      why: It would directly test the purpose the Director inferred.
  lesson: Do not assume that an asset's apparent defensive role establishes its only purpose. State the inference and its
    evidentiary basis separately from confirmed facts, and preserve material disagreement rather than overstating certainty.
  limits: This reasoning concerns an intelligence assessment of the purpose of installations in Cuba in August–September 1962.
    It does not establish that the Director's inference was confirmed or supply the dissenters' reasons.
