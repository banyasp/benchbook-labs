case:
  id: DR-CORPUS-INC-CUBAN-MISSILE-CRISIS-NX-a3a879f6-E23@v1
  title: Control of the Cuba Overflights
  status: draft
  setting: Washington, 11–12 October 1962; U.S. administration, CIA, and Department of Defense.
  decider: The President
  agent: The President
  agent_role: decide
  situation: The President had approved the mission and the use of Air Force pilots, while control of the overflights remained
    under discussion. Defense and Air Force representatives considered the Air Force cover story superior, and a CIA research
    official also considered it better in the long run. CIA officials raised concerns about Air Force readiness and the disruption
    of abruptly shifting an established operation. The Department of Defense favored immediate Air Force control and had obtained
    the CIA Director's consent, while the Acting CIA Director advocated a staged transition. The President faced a choice
    about command responsibility, pilot affiliation, and the associated cover story.
  question: What should the President do about command of the Cuba overflights, pilot affiliation, and the associated cover
    story?
  options:
    O1:
      do: The President retains CIA command of the overflights and uses CIA pilots under the CIA cover story.
      move: act
      irreversible: false
    O2:
      do: The President transfers command to the Department of Defense and uses Air Force pilots under the Air Force cover
        story.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The President had approved the San Cristobal mission and the use of Air Force pilots.
  - id: F2
    kind: situation
    status: assessed
    fact: Air Force and Department of Defense representatives considered the Air Force cover story better.
  - id: F3
    kind: situation
    status: assessed
    fact: A CIA research official considered the Air Force cover story better in the long run but raised a readiness concern
      about using an Air Force pilot before adequate preparation.
  - id: F4
    kind: situation
    status: confirmed
    fact: Department of Defense representatives favored Air Force control of the overflights and obtained the CIA Director's
      consent.
  - id: F5
    kind: capability
    status: assessed
    fact: The Acting CIA Director considered the CIA operation established and working well, and the Air Force inexperienced
      in controlling the overflights.
  - id: F6
    kind: capability
    status: assessed
    fact: The Acting CIA Director considered an abrupt change to command, control, and support arrangements unwise.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Acting CIA Director proposed a staged transition, while the Air Force insisted on immediate control.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Defense and Air Force representatives judged the Air Force cover story better, and the CIA research official agreed
      that it was better in the long run. That advantage supported pairing the Air Force pilots with Defense command.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Acting CIA Director argued that the CIA operation was established and working well, while the Air Force lacked
      experience controlling the overflights. This was a substantive reason to retain CIA command.
  - id: C3
    facts:
    - F6
    - F7
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The Acting CIA Director considered an abrupt change unwise and proposed a staged transition, whereas the Air Force
      insisted on immediate control. The concern was that an immediate transfer could disrupt an operation at a crucial time.
  - id: C4
    facts:
    - F1
    - F4
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The President had approved the use of Air Force pilots, and Defense representatives favored Air Force control and
      obtained the CIA Director's consent. These facts supported, but did not by themselves require, transferring command.
  reasoning:
    read: 'The decision involved two connected but distinct questions: whether the Air Force cover story was preferable, and
      whether command should move from an established CIA operation to the Department of Defense. The trap is to treat agreement
      on the cover story or pilot affiliation as proof that an immediate command transfer was operationally sound; the Acting
      CIA Director expressly challenged that inference.'
    weighing: The Air Force cover story was considered better, including by a CIA research official in the long run, and Defense
      favored control. Against that, the Acting CIA Director emphasized the CIA operation's readiness, Air Force inexperience,
      and the risk of abrupt disruption. The President transferred command despite those objections. The source records the
      outcome but does not give a specific presidential explanation for how these competing considerations were weighed.
    tradecraft: Keep the cover-story judgment, pilot affiliation, and command decision distinct in the decision record. Record
      the readiness and transition concerns alongside the rationale for the chosen command arrangement, and make clear which
      office holds responsibility.
    uncertainty: The source records real disagreement and does not establish that the President adopted any particular rationale
      for the transfer. It also does not resolve whether the Acting CIA Director's concerns would have proved consequential.
    handoff: The decision belonged to the President. The record shows Defense's preference and the CIA leadership's differing
      assessments; a sound decision process would put both before the presidential decision-maker rather than treating the
      issue as merely a jurisdictional dispute.
    tempting_wrong:
      option: O1
      pull: The CIA operation was already working, and the Acting CIA Director warned that the Air Force lacked experience
        and that abrupt change risked disruption.
      why_wrong: Those were substantial objections, but the recorded outcome was transfer to Defense, while the Air Force
        cover story was judged superior and Defense favored control.
    rejected:
      O1: The President did not retain CIA command, despite the Acting CIA Director's arguments for continuity and a staged
        transition.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Air Force cover story were not considered better, while the CIA cover story remained adequate.
      then: O1
      why: The stated advantage supporting the Air Force pairing would be absent, making retention of the established CIA
        arrangement more persuasive.
    - id: flip2
      if: The readiness and disruption concerns were judged to make an immediate transfer materially threaten the mission.
      then: O1
      why: The Acting CIA Director's stated concerns about Air Force inexperience and abrupt disruption would then outweigh
        the institutional preference for immediate Defense control.
    would_not_change:
    - id: noflip1
      if: The President's approval of Air Force pilots were treated as the only decision already made.
      why: 'Pilot affiliation did not itself decide command: command remained under discussion and was transferred separately.'
    watch_for:
    - id: watch1
      what: Evidence that an abrupt transfer would disrupt the established operation or expose the Air Force's lack of experience
        in controlling the overflights.
      favors:
      - O1
      why: These were the Acting CIA Director's stated grounds for opposing immediate transfer and seeking a staged transition.
  lesson: A preferred cover story or pilot affiliation does not automatically settle who should command an operation. Weigh
    that advantage against the readiness and continuity costs of changing command, and make the authority and competing reasons
    explicit.
  limits: This scenario concerns a historical decision about command responsibility and a cover story, not the conduct of
    reconnaissance or the implementation of an operation. The source records the President's outcome and a substantial internal
    dispute, but does not state the President's detailed rationale.
