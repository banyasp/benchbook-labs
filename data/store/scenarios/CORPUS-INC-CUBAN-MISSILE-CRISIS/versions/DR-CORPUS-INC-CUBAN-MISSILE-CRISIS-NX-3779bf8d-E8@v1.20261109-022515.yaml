case:
  id: DR-CORPUS-INC-CUBAN-MISSILE-CRISIS-NX-3779bf8d-E8@v1
  title: Choosing a Response to the Cuban Missile Crisis
  status: draft
  setting: United States, Cuban crisis, presidential meeting
  decider: The President
  agent: The President
  agent_role: decide
  situation: The President faced a choice among a quarantine of Cuba, an air strike, and an invasion. The administration assessed
    that the Soviet Union's harder-line approach was gaining influence and that there was no opportunity for conditions to
    improve. Any action carried risks of Soviet retaliation, including in Berlin, and of allied blame; doing nothing was also
    viewed as a serious risk. The proposed quarantine would bar imports of offensive weapons and initially exclude petroleum,
    but its legality without OAS support was questioned. Participants differed over whether delay or a quarantine was preferable
    to direct military action, and the President considered an attack on bases manned by Soviet personnel more provocative
    than a confrontation with a Soviet ship.
  question: What should the President do about choosing among a quarantine of Cuba, an air strike, and an invasion?
  options:
    O1:
      do: The President prohibits a quarantine, orders an invasion of Cuba, and declines an air strike.
      move: act
      irreversible: true
    O2:
      do: The President imposes a quarantine on Cuba and declines an air strike and invasion.
      move: act
      irreversible: false
    O3:
      do: The President prohibits a quarantine, orders an air strike against Cuban bases, and declines an invasion.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Secretary assessed that a harder-line approach was gaining influence in the Soviet Union and that there was
      no opportunity for improvement.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The President assessed that military action might cause the missiles to be fired and could prompt Soviet reactions
      in other areas, particularly Berlin, with allied blame falling on the United States.
  - id: F3
    kind: situation
    status: assessed
    fact: The President considered doing nothing a serious mistake and believed that every available course involved risk.
  - id: F4
    kind: situation
    status: confirmed
    fact: The proposed quarantine would bar imports of offensive weapons and would initially not extend to petroleum.
  - id: F5
    kind: situation
    status: assessed
    fact: The President judged that resorting to active military action would involve an invasion.
  - id: F6
    kind: situation
    status: assessed
    fact: A senator pressed for stronger action without warning, arguing that delay would make military action more difficult
      and cost more American lives.
  - id: F7
    kind: situation
    status: assessed
    fact: Another senator considered the quarantine the worst alternative and favored an attack or invasion instead.
  - id: F8
    kind: authority
    status: assessed
    fact: The President said the quarantine probably would not be legal without OAS support, but indicated that the United
      States would proceed anyway.
  - id: F9
    kind: situation
    status: assessed
    fact: The President considered an attack on bases known to be manned by Soviet personnel more provocative than a confrontation
      with a Soviet ship.
  considerations:
  - id: C1
    facts:
    - F2
    - F9
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The President assessed that military action could lead to the missiles being fired and to Soviet retaliation, especially
      in Berlin, with allied blame falling on the United States. An attack on bases manned by Soviet personnel was considered
      more provocative than a confrontation with a Soviet ship, supporting the quarantine over an air strike or invasion.
  - id: C2
    facts:
    - F1
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Secretary saw no opportunity for conditions to improve, and the President considered doing nothing a serious
      mistake. The quarantine was an affirmative response that, as the President's discussion framed it, left the other side
      a chance to pause rather than immediately choosing direct military action.
  - id: C3
    facts:
    - F4
    - F8
    equity: lawful_authority
    favors: []
    weight: weak
    why: The quarantine was limited initially to offensive weapons, but the President acknowledged it probably would not be
      legal without OAS support and said the United States would proceed anyway. This weighs against treating the quarantine
      as legally settled, though the source does not establish that either military alternative was legally preferable.
  - id: C4
    facts:
    - F6
    equity: tempo
    favors:
    - O1
    - O3
    weight: weak
    why: A senator argued that delay would make military action harder and cost more American lives, pressing for stronger
      action without warning. This was a genuine counterargument for an air strike or invasion, not the President's adopted
      judgment.
  reasoning:
    read: 'The choice was not between a risk-free quarantine and risky force: the President saw risk in every course, including
      doing nothing. The trap was to let urgency alone settle the choice; immediate military action could trigger missile
      launches, Soviet retaliation in Berlin, and allied blame, while the quarantine itself carried a serious legal concern.'
    weighing: The President's balance favored the quarantine because conditions were not expected to improve and inaction
      was judged a serious mistake, while direct attacks on bases manned by Soviet personnel could be more provocative than
      confronting a Soviet ship. The senator's case that delay could cost American lives remained a real competing view. The
      balance depended on the President's assessment of Soviet intentions and the relative escalation risk, and it did not
      resolve the quarantine's legality without OAS support.
    tradecraft: State the choice, the acknowledged legal uncertainty, and the comparative risks of retaliation and allied
      consequences clearly. Keep the decision under presidential authority, seek the relevant legal and allied views, and
      revisit the balance if the assessed threat or escalation risks materially change; do not treat the decision as a finding
      that the quarantine is lawful without OAS support.
    uncertainty: The President said the United States did not know how the Soviet bloc would react, and the assessment of
      Soviet intentions included uncertainty. The likely consequences in Berlin and the response of allies were risks, not
      certainties; the legality of proceeding without OAS support was also expressly questioned.
    handoff: The President makes the choice, informed by administration advisers and relevant legal advice; the source also
      records that major allies were to be informed and that OAS support bore on the legal concern.
    tempting_wrong:
      option: O1
      pull: The senator's argument for stronger action without warning made invasion seem like a way to avoid delay and additional
        American casualties.
      why_wrong: The President's assessment was that active military action would involve an invasion, and that attacking
        bases known to be manned by Soviet personnel would be more provocative than a confrontation with a Soviet ship, increasing
        the risk of escalation.
    rejected:
      O1: The President did not choose invasion because active military action was assessed to involve invasion and could
        bring a more provocative confrontation with Soviet personnel and wider Soviet retaliation.
      O3: The President did not choose an air strike because attacks on bases manned by Soviet personnel were judged more
        provocative than the quarantine's confrontation with a Soviet ship.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible new information established that the immediate threat could not be contained by the quarantine and that
        delay would make military action materially more dangerous to American lives.
      then: O3
      why: That would strengthen the senator's stated case for prompt military action, though the President's concerns about
        Soviet casualties and escalation would still need to be weighed.
    - id: flip2
      if: Reliable evidence established that the relevant Cuban bases were not manned by Soviet personnel and that an air
        strike would not carry the escalation risk the President identified.
      then: O3
      why: The President treated the presence of Soviet personnel as a reason an attack on the bases would be especially provocative;
        removing that concern could alter the comparison, without resolving other risks.
    would_not_change:
    - id: noflip1
      if: The OAS did not support the quarantine.
      why: The President said the quarantine probably would not be legal without OAS support but indicated the United States
        would proceed anyway.
    - id: noflip2
      if: The choice continued to involve substantial risks in every available course.
      why: The President expressly recognized that every course involved risk but still judged that doing nothing would be
        a serious mistake.
    watch_for:
    - id: watch1
      what: Evidence that the Soviet Union is intensifying the situation or that retaliation in Berlin is becoming more likely.
      favors:
      - O1
      - O3
      why: Such developments could change the comparative risks and require the President to reassess whether the quarantine
        remains adequate; they do not by themselves establish that direct military action is preferable.
  lesson: When every available course carries risk, compare the likely escalation and allied consequences of each option rather
    than treating urgency as sufficient reason for immediate force. A less escalatory course may still carry a serious legal
    objection, which must be stated and weighed rather than assumed away.
  limits: This reasoning reflects the President's assessments in this meeting, including uncertainty about Soviet intentions
    and the questioned legality of the quarantine without OAS support. It does not establish a general legal rule for quarantines
    or determine what later developments would warrant military action.
