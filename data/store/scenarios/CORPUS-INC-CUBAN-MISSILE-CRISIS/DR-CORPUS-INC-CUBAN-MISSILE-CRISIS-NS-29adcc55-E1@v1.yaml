case:
  id: DR-CORPUS-INC-CUBAN-MISSILE-CRISIS-NS-29adcc55-E1@v1
  title: Estimating the Soviet Build-Up in Cuba
  status: draft
  setting: Cuba, 14 September 1962, U.S. intelligence estimate
  decider: The estimators
  agent: The estimators
  agent_role: decide
  situation: The estimators were assessing the Soviet military build-up in Cuba. The available record contained no evidence
    of an actual or prospective offensive weapon deployment. Secondary evidence included prior Soviet policy and its avoidance
    of direct confrontations where the United States held decisive military advantage. The Director of Central Intelligence
    believed offensive weapons would be deployed, but that view rested on intuition without supporting rationale. The Director
    of Central Intelligence was away when the estimate was produced.
  question: What should the estimators do in the 14 September 1962 estimate regarding the likelihood of offensive weapons
    deployment in Cuba?
  options:
    O1:
      do: The estimators should accept the judgment that offensive weapons would probably not be deployed in Cuba.
      move: act
      irreversible: false
    O2:
      do: The estimators should reject that judgment and assess that offensive weapons would probably be deployed in Cuba.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The estimate addressed the Soviet military build-up in Cuba.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: There was no evidence of an actual or prospective offensive weapon deployment.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Secondary evidence included the prior Soviet policy of not stationing offensive strategic weapons outside its borders.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Secondary evidence included the Soviet policy of avoiding direct confrontations where the United States held decisive
      military advantage.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Director of Central Intelligence believed the Soviets would deploy offensive weapons in Cuba.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The contrary belief rested on intuition and lacked supporting rationale.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Director of Central Intelligence was away when the estimate was produced.
  considerations:
  - id: C1
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The record contained no evidence of an actual or prospective offensive deployment, which supported the estimate's
      judgment that the build-up was defensive rather than offensive.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: 'The estimate did not rely on absence of evidence alone: prior Soviet policy and avoidance of direct confrontations
      where the United States had decisive military advantage supplied secondary support for judging offensive deployment
      unlikely.'
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The contrary view belonged to the absent Director of Central Intelligence and rested on intuition without supporting
      rationale; unsupported judgment would not persuade the estimators or the other informed advisers.
  reasoning:
    read: This was an estimative judgment about what the available evidence supported, not a choice about a military response.
      The trap is to treat the Director of Central Intelligence's contrary intuition, especially in light of what was later
      discovered, as if it had been supported evidence at the time.
    weighing: The absence of evidence for an offensive deployment, together with the secondary evidence about prior Soviet
      policy and risk avoidance, supported accepting the estimate that offensive weapons probably would not be deployed. The
      estimate was very convincing because of that reasoning. The contrary intuition did not supply a comparable rationale,
      and the Intelligence Community and leading Soviet specialists would have opposed it. The balance therefore favors {O1},
      while depending on the evidence and rationale available when the estimate was made.
    tradecraft: State the conclusion as a probability judgment and make clear which parts rest on direct evidence and which
      on secondary evidence. Record the contrary view and its lack of supporting rationale without presenting it as equally
      evidenced. Reassess if material new evidence emerges.
    uncertainty: The judgment proved incorrect after the missiles were discovered. That hindsight establishes the estimate's
      error, but does not by itself establish that the unsupported contrary intuition was the better-supported judgment on
      14 September.
    handoff: The estimators should make the estimate on its evidentiary merits. The Intelligence Community and knowledgeable
      presidential advisers were relevant opposing voices in the hypothetical discussion, but their agreement would not substitute
      for the estimators' own assessment.
    tempting_wrong:
      option: O2
      pull: The Director of Central Intelligence believed offensive weapons would be deployed, and later events showed that
        this prediction was right.
      why_wrong: At the estimate date, that belief rested on intuition without a supporting rationale, whereas the estimate's
        contrary judgment had an evidentiary basis and was shared by informed experts.
    rejected:
      O2: The estimators should not reject the supported estimate in favor of a contrary prediction that rested on intuition
        without supporting rationale.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The estimators had credible, materially new evidence of an actual or prospective offensive deployment.
      then: O2
      why: Such evidence would remove the central evidentiary basis for accepting the judgment that offensive weapons probably
        would not be deployed.
    would_not_change:
    - id: noflip1
      if: The Director of Central Intelligence were present and pressed the same intuition without supporting rationale.
      why: Unsupported intuition would not make converts; the Intelligence Community and informed advisers would have opposed
        that view.
    watch_for:
    - id: watch1
      what: Whether new evidence changes the assessment of Soviet policy or provides support for the contrary deployment prediction.
      favors:
      - O2
      why: The estimate's rationale depends on the evidence and secondary policy judgments available to the estimators.
  lesson: An estimate should follow the best-supported judgment, not an unsupported intuition, even when that intuition later
    proves correct. Distinguish direct evidence from secondary inference, and remain willing to revise the estimate when the
    evidentiary record changes.
  limits: This reasoning concerns the quality of an intelligence estimate on the information available at the time. It does
    not establish that an estimate based on secondary evidence will be correct, or prescribe a military response to later
    discoveries.
  library:
    domain: intel-analysis
    family: CORPUS-INC-CUBAN-MISSILE-CRISIS
    source: https://www.cia.gov/resources/csi/static/Kent-Final-Thoughts-Analyst-Policymaker-Relations.pdf
    episode_focus: The estimators concluded that the Soviet military build-up was defensive and that offensive weapons would
      probably not be deployed, relying on the absence of evidence and prior Soviet policy; an alternative view was not supported
      by a convincing rationale. Frame this as an estimative judgment and its evidentiary basis, not as a decision about military
      response or operational activity.
