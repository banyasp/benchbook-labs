case:
  id: DR-OGE-2635-808-2@v1
  title: Use of Agency Photocopier for Personal Fundraising
  status: draft
  setting: Merit Systems Protection Board, present day, federal workplace
  decider: Administrative Judge
  agent: Adjudication Support AI
  agent_role: decide
  situation: An employee of the Merit Systems Protection Board wishes to reproduce fundraising literature for the employee's
    child's private school using the agency's photocopier. The literature is intended to solicit donations to support the
    private school, which is a nonprofit organization. The employee's request involves the use of government property for
    a personal fundraising activity. Under 5 C.F.R. §2635.808(c), personal fundraising may not involve the use of official
    title, position, or authority, and must not violate other agency standards. Section §2635.704 prohibits the use of government
    property for personal purposes. The question is whether the employee may be allowed to use the photocopier for this purpose.
  question: What should the Administrative Judge do regarding the employee's request to use the agency photocopier for fundraising
    literature?
  options:
    O1:
      do: The Administrative Judge asks the employee to provide justification for the use of the agency photocopier before
        deciding.
      move: ask
      irreversible: false
      to: employee
    O2:
      do: The Administrative Judge permits the employee to use the agency photocopier for fundraising literature.
      move: act
      irreversible: false
    O3:
      do: The Administrative Judge holds the decision pending review of agency policy on use of government property for fundraising.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge prohibits the employee from using the agency photocopier for fundraising literature.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the Merit Systems Protection Board.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee wants to use the agency photocopier to reproduce fundraising literature for the employee's child's
      private school.
  - id: F3
    kind: authority
    status: confirmed
    fact: Using the agency photocopier for personal fundraising would violate the standards at §2635.704 regarding use of
      Government property.
  - id: F4
    kind: authority
    status: confirmed
    fact: Fundraising means raising funds for a nonprofit organization, other than a political organization, through solicitation
      of funds or sale of items, or participation in an event where costs are tax deductible.
  - id: F5
    kind: authority
    status: confirmed
    fact: Employees may engage in fundraising in a personal capacity only if they do not personally solicit subordinates or
      prohibited sources and do not use official title, position, or authority.
  - id: F6
    kind: authority
    status: confirmed
    fact: The employee is subject to the standards of 5 C.F.R. §2635.808 governing federal employee conduct.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Administrative Judge has delegated authority to the Adjudication Support AI to draft the finding.
  considerations:
  - id: C1
    facts:
    - F3
    equity: resource_stewardship
    favors:
    - O4
    weight: strong
    why: §2635.704 expressly forbids using government property for personal purposes; using the agency photocopier for fundraising
      is a direct violation.
  - id: C2
    facts:
    - F5
    - F4
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Personal‑capacity fundraising may not involve the employee’s official title, position, or authority, and must not
      breach other agency standards; using official equipment breaches that standard.
  - id: C3
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The regulation defines fundraising as solicitation for a nonprofit; the employee’s activity meets that definition,
      so the prohibitions of §2635.808(c) apply.
  - id: C4
    facts:
    - F6
    equity: due_process
    favors:
    - O4
    weight: weak
    why: The employee is subject to the conduct standards of 5 C.F.R. §2635.808, which require compliance with both fundraising
      and property‑use rules.
  - id: C5
    facts: []
    equity: institutional_credibility
    favors:
    - O4
    weight: bar
    why: Example 2 to paragraph (c) of §2635.808 explicitly states that using an agency photocopier for fundraising literature
      violates the standards.
    rules_out:
    - O2
  reasoning:
    read: The employee wants to copy fundraising flyers for a private‑school nonprofit on the Merit Systems Protection Board’s
      photocopier. The request pits a personal charitable activity against the prohibition on using government property for
      personal fundraising.
    weighing: The source’s own analysis treats the property‑use rule (§2635.704) as a decisive bar. Because the activity is
      personal fundraising, §2635.808(c) also bars any use of official title or authority, and the regulation’s own Example 2
      to paragraph (c) calls out exactly this scenario as prohibited. Consequently, the balance tips unequivocally toward
      prohibition.
    tradecraft: Record the finding in the case file, cite the specific regulatory provisions and the illustrative example,
      and issue a formal order denying the request. No further fact‑finding is needed.
    uncertainty: None – the regulatory language is clear and directly addresses the conduct.
    handoff: The Administrative Judge decides alone, as the authority is a binding regulation and no additional agency policy
      review is required.
    tempting_wrong:
      option: O2
      pull: A desire to accommodate the employee’s charitable intent might suggest allowing the use of the copier.
      why_wrong: Allowing it would contravene the explicit prohibition in §2635.704 and the regulatory example, undermining
        the integrity of government property stewardship.
    rejected:
      O1: The request does not raise a factual dispute; the regulation already answers the question, so asking for justification
        is unnecessary.
      O2: Prohibited by the property‑use rule and the regulatory example; the source bars this option.
      O3: No pending policy review is needed because the rule is clear; holding the decision would create needless delay.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee used personal equipment rather than agency property to produce the literature.
      then: O2
      why: Without the government‑property violation, the only remaining issue is personal solicitation, which may be permissible
        if no subordinates or prohibited sources are targeted.
    would_not_change:
    - id: noflip1
      if: The employee claimed a personal friendship with a prohibited source as justification for targeting that source.
      why: Even with a friendship justification, the use of agency property remains prohibited.
    watch_for:
    - id: watch1
      what: A formal agency waiver that designates the copier for public‑use fundraising events.
      favors:
      - O1
      why: If such a waiver existed, the judge would first seek clarification before denying.
  lesson: Government property may not be used for personal fundraising activities; the prohibition is explicit in §2635.704
    and reinforced by the regulatory example. Personal charitable intent does not override property‑use rules.
  limits: This reasoning applies only when the employee seeks to use agency‑owned equipment for personal fundraising. It does
    not address official‑capacity fundraising, nor does it cover situations where the agency has expressly authorized the
    use of its resources for a charitable event.
