case:
  id: DR-OGE-2635-808-addfact1@v1
  title: Use of Agency Photocopier for Personal Fundraising [addfact]
  status: needs_review
  setting: Merit Systems Protection Board, contemporary federal workplace
  decider: Administrative Law Judge
  agent: Adjudicative Support System
  agent_role: decide
  situation: A staff member of the Merit Systems Protection Board has asked to employ the agency photocopier to produce fundraising
    brochures for the child's private school, a nonprofit institution. The brochures are intended to solicit donations. The
    request raises issues under the agency's internal guidance on personal charitable printing, the statutory prohibition
    on using government property for personal purposes, and the employee's conduct obligations under the federal standards
    governing personal fundraising.
  question: How should the Administrative Law Judge rule on the employee's request to use the agency copier for fundraising
    literature?
  options:
    O1:
      do: Request the employee to submit a justification for using the agency copier before making a determination.
      move: ask
      irreversible: false
      to: employee
    O2:
      do: Allow the employee to proceed with copying the fundraising brochures on the agency copier.
      move: act
      irreversible: false
    O3:
      do: Stay the decision pending a review of the Board's policy on the use of government property for fundraising activities.
      move: hold
      irreversible: false
    O4:
      do: Deny the request, prohibiting the employee from using the agency copier for the fundraising material.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The staff member is employed by the Merit Systems Protection Board.
  - id: F2
    kind: situation
    status: confirmed
    fact: The staff member requests permission to use the Board's photocopier to duplicate fundraising brochures for the child's
      private school.
  - id: F3
    kind: authority
    status: assessed
    fact: Board policy permits employees to employ agency equipment for personal charitable printing as long as the aggregate
      monthly expense does not exceed $20.
  - id: F4
    kind: authority
    status: confirmed
    fact: Utilizing the photocopier for personal fundraising would contravene the prohibition in 5 C.F.R. §2635.704 on the
      use of government property for personal purposes.
  - id: F5
    kind: authority
    status: confirmed
    fact: Fundraising is defined as the solicitation of contributions or the sale of items to generate money for a nonprofit
      organization, excluding political groups, where the donor may claim a tax-deductible expense.
  - id: F6
    kind: authority
    status: confirmed
    fact: Employees may conduct fundraising in a purely personal capacity provided they do not solicit subordinates or other
      prohibited sources and do not leverage their official title, position, or authority.
  - id: F7
    kind: authority
    status: confirmed
    fact: The employee is bound by the conduct standards set forth in 5 C.F.R. §2635.808.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Administrative Law Judge has authorized the Adjudicative Support System to prepare a draft of the decision.
  considerations:
  - id: C1
    facts:
    - F4
    equity: resource_stewardship
    favors:
    - O4
    weight: strong
    why: §2635.704 expressly forbids personal use of government property for fundraising; employing the copier would breach
      that rule.
  - id: C2
    facts:
    - F6
    - F5
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Personal-capacity fundraising must not involve the employee's official title or authority; using agency equipment
      violates that standard.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The regulation's definition of fundraising captures the employee's activity, triggering the prohibitions of §2635.808(c).
  - id: C4
    facts:
    - F7
    equity: due_process
    favors:
    - O4
    weight: weak
    why: The conduct standards in §2635.808 require compliance with both fundraising and property-use rules, reinforcing the
      bar.
  - id: C5
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O4
    weight: bar
    why: Example 2 to paragraph (c) of §2635.808 explicitly states that using an agency photocopier for fundraising literature
      is prohibited.
    rules_out:
    - O2
  reasoning:
    read: The employee seeks to duplicate fundraising brochures for a private-school nonprofit on the Board's copier. The
      request pits a charitable activity against the statutory ban on using government property for personal fundraising.
    weighing: Regulation §2635.704 (F4) and the illustrative example in §2635.808(c) (C5) together form a decisive bar. Even
      though Board policy (F3) allows modest charitable printing, the higher-authority prohibition overrides that allowance,
      and the personal-capacity rules (C2, C3) further support denial.
    tradecraft: Record the decision in the case file, cite §§2635.704, 2635.808(c) and Example 2, and issue a formal order
      denying the request. No additional fact-finding is required.
    uncertainty: None – the regulatory language directly addresses the conduct.
    handoff: The Administrative Law Judge decides alone, as the binding regulation settles the issue without need for further
      policy review.
    tempting_wrong:
      option: O2
      pull: The employee's charitable motive and the Board's permissive policy might make allowance appear reasonable.
      why_wrong: The statutory prohibition in F4 and the regulatory example in C5 unequivocally block any use of agency equipment
        for fundraising, regardless of the $20 limit.
    rejected:
      O1: The regulation already resolves the issue; requiring a justification would be redundant.
      O2: Prohibited by the property-use rule (F4) and reinforced by the regulatory example (C5).
      O3: No policy review is needed because the rule is clear; staying the decision would cause unnecessary delay.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee used personal equipment rather than agency property to produce the literature.
      then: O2
      why: Without the government-property violation, the remaining issue is personal solicitation, which may be permissible
        under F6 and the limited-printing allowance in F3.
    would_not_change:
    - id: noflip1
      if: The employee claimed a personal friendship with a prohibited source as justification for targeting that source.
      why: Even with a friendship justification, the use of agency property remains prohibited by F4.
    watch_for:
    - id: watch1
      what: A formal agency waiver that designates the copier for public-use fundraising events.
      favors:
      - O1
      why: If such a waiver existed, the judge would first seek clarification before denying, potentially favoring O1.
  lesson: Agency-owned equipment may not be employed for personal fundraising; the prohibition in §2635.704 and the illustrative
    example in §2635.808(c) are controlling, and internal policy caps do not override federal regulations.
  limits: Applies only when an employee seeks to use agency-owned copying devices for personal charitable fundraising. It
    does not cover official-capacity fundraising or situations where the agency has issued an explicit waiver for the equipment.
