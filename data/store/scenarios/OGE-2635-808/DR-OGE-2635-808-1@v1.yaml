case:
  id: DR-OGE-2635-808-1@v1
  title: Secretary of the Navy Participation in Charity Golf Tournament
  status: draft
  setting: Washington, D.C., present, Department of the Navy
  decider: Secretary of the Navy
  agent: Secretary of the Navy
  agent_role: decide
  situation: A charitable organization is planning a golf tournament to raise funds for underprivileged children. The tournament
    organizers propose to advertise a round in the Secretary of the Navy's foursome in exchange for participants' donations.
    The Secretary would be a participant in the tournament, and his presence would be used as a draw for donors. The event
    involves collecting entry‑fee donations that would be directed to the nonprofit. The Secretary must consider whether his
    participation would constitute personal fundraising that violates ethics regulations. The decision hinges on the applicability
    of the personal‑capacity fundraising restrictions in 5 C.F.R. §2635.808(c).
  question: What should the Secretary of the Navy do regarding entering the tournament under the understanding that his participation
    will be advertised to attract donations?
  options:
    O1:
      do: The Secretary of the Navy may enter the tournament but must prohibit any use of his official title or position in
        the tournament’s advertising.
      move: partial
      irreversible: false
    O2:
      do: The Secretary of the Navy may enter the tournament and allow his participation to be advertised to attract donations.
      move: act
      irreversible: false
    O3:
      do: The Secretary of the Navy may request guidance from the agency ethics office before deciding whether to enter the
        tournament.
      move: ask
      irreversible: false
      to: agency ethics office
    O4:
      do: The Secretary of the Navy may not enter the tournament under the understanding that his participation will be used
        to attract donations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Secretary of the Navy is a federal employee subject to 5 C.F.R. §2635.808.
  - id: F2
    kind: authority
    status: confirmed
    fact: Fundraising in a personal capacity prohibits personally soliciting funds from subordinates or prohibited sources
      and prohibits using the employee's official title, position, or authority to further the fundraising effort.
  - id: F3
    kind: authority
    status: confirmed
    fact: Fundraising means the raising of funds for a nonprofit organization through solicitation of funds or sale of items.
  - id: F4
    kind: situation
    status: confirmed
    fact: The tournament organizers intend to advertise a round in the Secretary of the Navy's foursome in exchange for donations.
  - id: F5
    kind: situation
    status: assessed
    fact: The Secretary's participation would allow his official position to be used as a draw for donors, potentially constituting
      use of official title in fundraising.
  - id: F6
    kind: authority
    status: confirmed
    fact: Entry‑fee donations for the tournament constitute solicitation of funds for a nonprofit organization, which is defined
      as fundraising.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: §2635.808(c)(2) bars the use of an employee's official title, position, or authority to further a fundraising effort;
      advertising the Secretary’s foursome uses his official position as a draw.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    equity: complicity_risk
    favors:
    - O4
    weight: strong
    why: The tournament’s advertising constitutes a personal solicitation of funds, which §2635.808(c)(1) prohibits when the
      solicitation is tied to the employee’s official role.
  - id: C3
    facts: []
    equity: lawful_authority
    favors:
    - O4
    weight: bar
    why: Example 1 to paragraph (c) of §2635.808 explicitly states that the Secretary of the Navy may not enter the tournament
      under the understanding that his participation will be used to attract donations.
    rules_out:
    - O1
    - O2
  reasoning:
    read: The Secretary is asked to join a charity golf tournament where the organizers will publicize a round in his foursome
      as a lure for donors. The trap is that the Secretary’s official title would be leveraged as a fundraising tool, which
      the ethics regulation treats as prohibited personal‑capacity fundraising.
    weighing: Considerations C1 and C2 each give strong weight to prohibiting the use of official status and to the prohibition
      on personal solicitation. C3 is a binding regulatory example that bars the very conduct contemplated, eliminating options
      that allow any advertised participation. The balance therefore unequivocally favors O4.
    tradecraft: Document the decision in the agency ethics office log, retain the tournament invitation, and formally decline
      participation. Notify the charitable organization in writing that the Secretary cannot be used as a promotional draw.
    uncertainty: Minimal; the regulation is clear and the example directly addresses the scenario.
    handoff: The Secretary may decide unilaterally, but best practice is to inform the agency ethics office to ensure a record
      of compliance.
    tempting_wrong:
      option: O2
      pull: Desire to support under‑privileged children and to lend the Secretary’s prestige to increase donations.
      why_wrong: Even with charitable intent, using the Secretary’s official position to attract donors violates §2635.808(c).
    rejected:
      O1: Even a limited participation without advertising still risks the perception of using the official title, which the
        regulation forbids.
      O2: Advertising the Secretary’s foursome directly contravenes the prohibition on personal solicitation and use of official
        position.
      O3: Requesting guidance does not resolve the underlying prohibition; the regulation already makes clear that the conduct
        is impermissible.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C3
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Secretary’s participation were not advertised or used as a draw, and no official title or position were referenced
        in any promotional material.
      then: O1
      why: Without the use of official status, the personal‑capacity prohibition on solicitation would not be triggered, allowing
        the Secretary to attend privately.
    would_not_change:
    - id: noflip1
      if: The tournament advertised the Secretary’s involvement regardless of whether donors are prohibited sources.
      why: The prohibition focuses on the use of official title, not on the identity of donors; the conduct remains barred.
    watch_for:
    - id: watch1
      what: Any attempt by the Secretary or staff to individually solicit subordinates or prohibited sources, even via private
        messages,
      favors:
      - O4
      why: Such targeted solicitation would violate §2635.808(c)(1) regardless of the broader advertising approach.
  lesson: Federal employees may not use their official title, position, or authority to solicit charitable donations. Personal‑capacity
    fundraising must avoid any use of official status and must not involve personal solicitation of subordinates or prohibited
    sources.
  limits: This rule applies only to charitable (non‑political) fundraising. It does not govern official‑capacity fundraising,
    nor does it affect political contributions that are subject to separate statutes.
