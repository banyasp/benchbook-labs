case:
  id: DR-OGE-2635-808-restyle2@v1
  title: Use of Agency Photocopier for Personal Fundraising [restyle]
  status: needs_review
  setting: Office of the Federal Employment Appeals, contemporary, civil service environment
  decider: Administrative Law Judge
  agent: Decision-Support Algorithm
  agent_role: decide
  situation: A staff member of the Office of the Federal Employment Appeals requests permission to duplicate promotional brochures
    for the child's independent academy using the agency's high-capacity copier. The brochures are meant to attract contributions
    for the academy, which operates as a nonprofit. The request would employ government-owned equipment for a private fundraising
    effort. Under 5 C.F.R. §2635.808(c) personal fundraising may not be conducted with official title, position, or authority,
    and must not breach other agency regulations. Section §2635.704 forbids the use of government property for personal purposes.
    The issue is whether the staffer may be authorized to employ the copier for this activity.
  question: How should the Administrative Law Judge rule on the staffer's petition to utilize the agency copier for producing
    fundraising brochures?
  options:
    O1:
      do: The Judge requires the staffer to submit a rationale for employing the agency copier before rendering a decision.
      move: ask
      irreversible: false
      to: employee
    O2:
      do: The Judge authorizes the staffer to use the agency copier to produce the fundraising brochures.
      move: act
      irreversible: false
    O3:
      do: The Judge defers the ruling pending an agency policy review concerning the use of government property for fundraising.
      move: hold
      irreversible: false
    O4:
      do: The Judge denies the staffer permission to employ the agency copier for the fundraising brochures.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The staff member is employed by the Office of the Federal Employment Appeals.
  - id: F2
    kind: situation
    status: confirmed
    fact: The staff member seeks to employ the agency's copier to duplicate fundraising brochures for the staffer's child's
      independent academy.
  - id: F3
    kind: authority
    status: confirmed
    fact: Utilizing the agency copier for personal fundraising contravenes the prohibition in §2635.704 on the use of Government
      property.
  - id: F4
    kind: authority
    status: confirmed
    fact: Fundraising is defined as obtaining contributions for a nonprofit entity, other than a political organization, through
      solicitation, sale of items, or participation in an event where expenses are tax-deductible.
  - id: F5
    kind: authority
    status: confirmed
    fact: Employees may conduct fundraising in a personal capacity only provided they do not solicit subordinates or prohibited
      sources and do not leverage official title, position, or authority.
  - id: F6
    kind: authority
    status: confirmed
    fact: The staff member is governed by the conduct standards set forth in 5 C.F.R. §2635.808.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Administrative Law Judge has delegated the drafting of the decision to the Decision-Support Algorithm.
  considerations:
  - id: C1
    facts:
    - F3
    equity: resource_stewardship
    favors:
    - O4
    weight: strong
    why: §2635.704 explicitly bans the use of government property for personal activities; employing the agency copier for
      fundraising directly violates that rule.
  - id: C2
    facts:
    - F5
    - F4
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Fundraising performed in a personal capacity must not involve the employee's official title, position, or authority,
      and must not breach other agency rules; using official equipment breaches that requirement.
  - id: C3
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The regulation's definition of fundraising as solicitation for a nonprofit matches the staffer's activity, thereby
      invoking the prohibitions of §2635.808(c).
  - id: C4
    facts:
    - F6
    equity: due_process
    favors:
    - O4
    weight: weak
    why: The staffer is subject to the conduct standards of 5 C.F.R. §2635.808, which obligate adherence to both fundraising
      and property-use provisions.
  - id: C5
    facts: []
    equity: institutional_credibility
    favors:
    - O4
    weight: bar
    why: Example 2 to paragraph (c) of §2635.808 expressly states that employing an agency copier for fundraising literature
      violates the standards.
    rules_out:
    - O2
  reasoning:
    read: The staffer wishes to copy fundraising flyers for a private-school nonprofit on the Office of the Federal Employment
      Appeals' copier. The request juxtaposes a personal charitable endeavor with the ban on using government property for
      personal fundraising.
    weighing: The analysis treats the property-use prohibition (§2635.704) as a decisive barrier. Because the conduct qualifies
      as personal fundraising, §2635.808(c) also bars any use of official title or authority, and the regulation's Example
      2 to paragraph (c) specifically identifies this scenario as prohibited. Accordingly, the balance unequivocally favors
      denial.
    tradecraft: Document the finding in the case docket, cite the pertinent regulatory citations and the illustrative example,
      and issue a formal order refusing the request. No additional fact-finding is required.
    uncertainty: None – the regulatory language is explicit and directly addresses the conduct.
    handoff: The Administrative Law Judge decides independently, as the authority rests on a binding regulation and no further
      agency policy review is necessary.
    tempting_wrong:
      option: O2
      pull: A wish to accommodate the staffer's charitable motive might tempt approval of the copier use.
      why_wrong: Approving would conflict with the explicit prohibition in §2635.704 and the regulatory example, compromising
        the stewardship of government assets.
    rejected:
      O1: The request does not raise a factual dispute; the regulation already resolves the issue, so requesting justification
        is unnecessary.
      O2: Barred by the property-use rule and the regulatory example; the source precludes this option.
      O3: No policy review is needed because the rule is clear; postponing the decision would cause unwarranted delay.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The staffer had employed personal copying equipment rather than agency property to produce the brochures.
      then: O2
      why: Absent the government-property violation, the remaining question is personal solicitation, which may be permissible
        if no subordinates or prohibited sources are targeted.
    would_not_change:
    - id: noflip1
      if: The staffer asserted a personal friendship with a prohibited source as justification for contacting that source.
      why: Even with a friendship claim, the use of agency property remains prohibited.
    watch_for:
    - id: watch1
      what: A formal agency waiver designating the copier for public-use fundraising activities.
      favors:
      - O1
      why: If such a waiver existed, the judge would first seek clarification before issuing a denial.
  lesson: Government-owned equipment may not be employed for personal fundraising; the ban is explicit in §2635.704 and reinforced
    by the regulatory example. Charitable intent does not supersede property-use restrictions.
  limits: This analysis applies only when the staffer seeks to use agency-owned copying equipment for personal fundraising.
    It does not address fundraising conducted in an official capacity, nor situations where the agency has expressly authorized
    the use of its resources for a charitable event.
