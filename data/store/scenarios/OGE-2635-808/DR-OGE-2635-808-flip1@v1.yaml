case:
  id: DR-OGE-2635-808-flip1@v1
  title: Secretary of the Navy Participation in Charity Golf Tournament [flip]
  status: needs_review
  setting: Arlington, Virginia, present, Office of the Secretary of the Navy
  decider: Secretary of the Navy
  agent: Secretary of the Navy
  agent_role: decide
  situation: A nonprofit group is organizing a charity golf outing to benefit children in need. The organizers have asked
    the Secretary to play a round and have suggested that his presence could be mentioned in the event's program to encourage
    donations. The Secretary would be a participant, but the tournament's promotional materials will not reference his rank
    or official capacity. He must decide whether joining the event, given the lack of any official-title advertising, complies
    with the personal-capacity fundraising restrictions in 5 C.F.R. §2635.808(c).
  question: Should the Secretary of the Navy accept the invitation to play in the tournament when his participation will not
    be used in any advertising?
  options:
    O1:
      do: Attend the tournament, provided that no reference to the Secretary's official title or position appears in any promotional
        material.
      move: partial
      irreversible: false
    O2:
      do: Attend the tournament and allow the organizers to publicize his involvement as a means of drawing donors.
      move: act
      irreversible: false
    O3:
      do: Seek a formal advisory opinion from the agency ethics office before deciding whether to attend.
      move: ask
      irreversible: false
      to: agency ethics office
    O4:
      do: Decline to attend the tournament because his participation would be used to solicit donations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: As a civilian employee of the Department of the Navy, the Secretary falls under the ethical standards set forth
      in 5 C.F.R. §2635.808.
  - id: F2
    kind: authority
    status: confirmed
    fact: When acting in a personal capacity, an employee may not request contributions from subordinates or other barred
      donors, nor may they employ their official title, rank, or authority to advance a fundraising campaign.
  - id: F3
    kind: authority
    status: confirmed
    fact: The term 'fundraising' refers to any activity that gathers monetary support for a nonprofit, whether by direct solicitation
      or by selling goods.
  - id: F4
    kind: situation
    status: confirmed
    fact: The tournament organizers will include the event in their program without mentioning the Secretary’s involvement
      or exploiting his rank as a selling point.
  - id: F5
    kind: situation
    status: assessed
    fact: Since the Secretary’s role will not be cited in the event’s marketing and his formal designation will be omitted,
      his participation will not function as a lure for donors.
  - id: F6
    kind: authority
    status: confirmed
    fact: Fees paid to enter the golf event represent a solicitation of contributions for the charitable group, thereby qualifying
      as fundraising.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Because the promotional material will not cite the Secretary's official title, the prohibition on using official
      status to further a fundraising effort does not apply, allowing private participation.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: The event's advertising omits any reference to the Secretary, so the activity does not constitute a personal solicitation
      tied to his official role, keeping the conduct within the regulation.
  reasoning:
    read: The Secretary has been invited to a charitable golf tournament. The organizers will not publicize his rank or official
      capacity, meaning the event's marketing does not leverage his position as a fundraising tool.
    weighing: Considerations C1 and C2 each assign strong weight to the fact that no official-title advertising will occur,
      removing the regulatory barrier to private participation. With the bar in C3 removed, the balance clearly supports O1.
    tradecraft: Record the decision in the agency ethics log, accept the invitation, and confirm with the organizers that
      no reference to the Secretary's title will appear in any materials.
    uncertainty: Low; the regulation is explicit about the prohibition only when official status is used in solicitation.
    handoff: The Secretary may decide directly, though a brief notification to the ethics office can provide an audit trail.
    tempting_wrong:
      option: O2
      pull: The appeal of boosting donations by highlighting the Secretary's presence.
      why_wrong: Advertising his involvement would invoke his official title, violating §2635.808(c).
    rejected:
      O3: Seeking guidance is unnecessary because the facts already demonstrate compliance without advertising.
      O4: Refusing to attend is overly restrictive given that the promotional material respects the prohibition.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: If the tournament were to advertise the Secretary's participation as a draw for donors, the conduct would again
        be prohibited.
      then: O4
      why: Use of official status in promotional material would trigger the personal-capacity fundraising ban.
    would_not_change:
    - id: noflip1
      if: If the event's advertising mentions the Secretary's involvement regardless of donor source restrictions.
      why: The rule focuses on the use of official title, not on the identity of donors.
    watch_for:
    - id: watch1
      what: Any direct solicitation by the Secretary or staff of subordinates or prohibited sources, even through private
        channels,
      favors:
      - O4
      why: Such targeted outreach would breach §2635.808(c)(1) irrespective of broader advertising.
  lesson: Federal employees may attend private charitable events as long as their official title or position is not used in
    any fundraising promotion. The personal-capacity fundraising ban is triggered only when official status is leveraged to
    solicit contributions.
  limits: The restriction applies solely to charitable (non-political) fundraising activities. It does not govern official-capacity
    fundraising or political contributions, which are subject to separate statutes.
