case:
  id: DR-OGE-2635-808-addfact2@v1
  title: Secretary of the Navy Participation in Charity Golf Tournament [addfact]
  status: needs_review
  setting: Arlington, Virginia, present, Office of the Secretary of the Navy
  decider: Secretary of the Navy, civilian head of the Navy Department
  agent: Secretary of the Navy
  agent_role: decide
  situation: A nonprofit that awards scholarships to children of Navy families is organizing a charity golf tournament. The
    organizers intend to publicize a round in which the Secretary of the Navy will play, linking that promotion to participant
    donations. The Secretary, a federal employee governed by 5 C.F.R. §2635.808, must determine whether his participation
    and the use of his official status as a draw for donors would violate personal-capacity fundraising restrictions that
    bar soliciting from subordinates or prohibited sources and forbid employing an official title, position, or authority
    to further a fundraising effort. The entry-fee contributions are considered a solicitation of money for the nonprofit,
    which meets the regulatory definition of fundraising.
  question: Should the Secretary of the Navy agree to play in the tournament if his involvement will be advertised to attract
    donor contributions?
  options:
    O1:
      do: Allow the Secretary to play, but require that no reference be made to his official title or position in any promotional
        material.
      move: partial
      irreversible: false
    O2:
      do: Permit the Secretary to play and let the tournament marketing highlight his involvement as a means of attracting
        donations.
      move: act
      irreversible: false
    O3:
      do: Seek a formal advisory opinion from the Navy ethics office before deciding whether to accept the invitation.
      move: ask
      irreversible: false
      to: agency ethics office
    O4:
      do: Decline to play in the tournament when his participation is to be used as a fundraising lure.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Secretary of the Navy is a federal employee governed by 5 C.F.R. §2635.808.
  - id: F2
    kind: authority
    status: confirmed
    fact: When acting in a personal capacity, a federal employee may not solicit contributions from subordinates or prohibited
      sources, nor may the employee use his official title, position, or authority to further the solicitation.
  - id: F3
    kind: situation
    status: assessed
    fact: The charity sponsoring the event provides scholarship assistance to children of Navy service members.
  - id: F4
    kind: authority
    status: confirmed
    fact: Fundraising is defined as the activity of obtaining money for a nonprofit through solicitation or the sale of goods.
  - id: F5
    kind: situation
    status: confirmed
    fact: The event planners plan to publicize a round in which the Secretary of the Navy will play, linking that promotion
      to donor contributions.
  - id: F6
    kind: situation
    status: assessed
    fact: If the Secretary participates, his official status could be leveraged as an attraction for donors, potentially violating
      the prohibition on using an official title in personal fundraising.
  - id: F7
    kind: authority
    status: confirmed
    fact: The entry fees collected for the tournament constitute a solicitation of money for the nonprofit, which falls under
      the definition of fundraising.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Section 2635.808(c)(2) forbids a federal employee from employing his official title, position, or authority to further
      a solicitation; publicizing the Secretary's round would directly leverage his official status as a donor draw.
  - id: C2
    facts:
    - F2
    - F5
    - F7
    equity: complicity_risk
    favors:
    - O4
    weight: strong
    why: The tournament's promotion ties the solicitation of entry fees to the Secretary's official role, which §2635.808(c)(1)
      expressly prohibits as a personal-capacity fundraising activity.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: bar
    why: Example 1 to paragraph (c) of §2635.808 states that the Secretary of the Navy may not enter a charity event when
      his participation is intended to attract donations.
    rules_out:
    - O1
    - O2
  - id: C4
    facts:
    - F3
    equity: family_support
    favors:
    - O4
    weight: weak
    why: While the scholarship program benefits children of Navy service members, the regulation’s bar on using official status
      for fundraising outweighs any charitable benefit, so the consideration still supports declining participation.
  reasoning:
    read: The Secretary is invited to a scholarship-funded golf tournament that intends to publicize his round as a lure for
      donor contributions. Because the event would market his official position to raise money, the conduct falls squarely
      within the personal-capacity fundraising prohibitions of §2635.808.
    weighing: Considerations C1 and C2 each assign strong weight to the statutory ban on leveraging official status for solicitation.
      C3 supplies a binding regulatory example that directly bars the contemplated conduct, eliminating any option that permits
      advertised participation. The added consideration C4 notes the charitable purpose but confirms that the regulatory bar
      remains controlling. The cumulative balance unequivocally favors O4.
    tradecraft: Record the decision in the Navy ethics office log, retain the invitation for documentation, and send a formal
      letter to the nonprofit declining participation and explaining the compliance basis.
    uncertainty: Low; the regulation and cited example provide clear guidance that the Secretary's advertised involvement
      would be prohibited.
    handoff: The Secretary may make the final call, but best practice is to notify the agency ethics office to create an official
      compliance record.
    tempting_wrong:
      option: O2
      pull: Desire to boost scholarship funding for Navy families and to showcase the Secretary's leadership.
      why_wrong: Even with charitable intent, using the Secretary's official title to attract donors breaches §2635.808(c).
    rejected:
      O1: A limited participation without title reference still relies on the Secretary's official identity as a draw, which
        the regulation forbids.
      O2: Advertising the Secretary's foursome directly violates the prohibition on personal solicitation and the use of official
        position.
      O3: Seeking an advisory opinion does not change the fact that the regulation already bars the conduct; the prohibition
        is clear and does not require further clarification.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C3
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Secretary's participation were kept private and no promotional material referenced his official title or position.
      then: O1
      why: Without leveraging official status, the personal-capacity solicitation prohibition would not be triggered, allowing
        private attendance.
    would_not_change:
    - id: noflip1
      if: The tournament publicizes the Secretary's involvement regardless of donor source restrictions.
      why: The rule focuses on the use of official title, not on who the donors are; the conduct remains prohibited.
    watch_for:
    - id: watch1
      what: Any direct solicitation by the Secretary or staff of subordinates or prohibited sources, even through private
        channels,
      favors:
      - O4
      why: Targeted solicitation would violate §2635.808(c)(1) independent of broader advertising.
  lesson: Federal employees may not use their official title, position, or authority to solicit charitable donations. Personal-capacity
    fundraising must avoid any reliance on official status and must not involve solicitation of subordinates or prohibited
    sources.
  limits: The rule applies only to non-political charitable fundraising. It does not govern official-capacity fundraising
    activities nor political contributions, which are subject to separate statutes.
