case:
  id: DR-OGE-2635-808-restyle1@v1
  title: Secretary of the Navy Participation in Charity Golf Tournament [restyle]
  status: needs_review
  setting: 'Current location: Washington, D.C.; Office: Department of the Navy'
  decider: Secretary of the Navy
  agent: Secretary of the Navy
  agent_role: decide
  situation: A nonprofit group plans a charity golf tournament to benefit children in need. The organizers propose to market
    a round from the Secretary of the Navy's foursome as a lure for donors. The Secretary would play in the event, and his
    presence would be highlighted to encourage contributions. The invitation raises the question of whether such participation
    would amount to personal-capacity fundraising that conflicts with ethics regulations, specifically the personal-capacity
    fundraising limits in 5 C.F.R. §2635.808(c).
  question: How should the Secretary of the Navy proceed regarding entering the tournament when his involvement is to be advertised
    to draw donations?
  options:
    O1:
      do: The Secretary of the Navy may attend the event provided that his official title or rank is not employed in any promotional
        material.
      move: partial
      irreversible: false
    O2:
      do: The Secretary of the Navy may take part in the tournament and permit the organizers to publicize his involvement
        as a means of drawing contributions.
      move: act
      irreversible: false
    O3:
      do: The Secretary of the Navy may seek an advisory opinion from the department's ethics office prior to making a final
        decision on participation.
      move: ask
      irreversible: false
      to: agency ethics office
    O4:
      do: The Secretary of the Navy must decline the invitation if his presence is to be leveraged to solicit donations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: As a federal employee, the Secretary of the Navy falls under the jurisdiction of 5 C.F.R. §2635.808.
  - id: F2
    kind: authority
    status: confirmed
    fact: When acting in a personal capacity, an employee may not directly solicit money from subordinates or barred contributors,
      nor may the employee employ his official title, rank, or authority to advance the fundraising activity.
  - id: F3
    kind: authority
    status: confirmed
    fact: Fundraising is defined as the collection of money for a nonprofit entity via solicitation or the sale of goods.
  - id: F4
    kind: situation
    status: confirmed
    fact: The event planners plan to promote a round of the Secretary of the Navy's foursome as an incentive for donor contributions.
  - id: F5
    kind: situation
    status: assessed
    fact: If the Secretary participates, his official status would serve as a lure for contributors, potentially amounting
      to the use of his title in a fundraising context.
  - id: F6
    kind: authority
    status: confirmed
    fact: Collecting entry-fee donations for the tournament represents a solicitation of money for a nonprofit, thereby fitting
      the definition of fundraising.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Section 2635.808(c)(2) prohibits employing an employee's official title, rank, or authority to advance a fundraising
      campaign; publicizing the Secretary's foursome would exploit his official position as an attraction.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    equity: complicity_risk
    favors:
    - O4
    weight: strong
    why: The promotional campaign amounts to a personal solicitation of contributions, which §2635.808(c)(1) forbids when
      the request is linked to the employee's official capacity.
  - id: C3
    facts: []
    equity: lawful_authority
    favors:
    - O4
    weight: bar
    why: Example 1 to paragraph (c) of §2635.808 expressly indicates that the Secretary of the Navy is prohibited from entering
      a tournament when his involvement is intended to be used as a fundraising draw.
    rules_out:
    - O1
    - O2
  reasoning:
    read: The Secretary has been invited to a charitable golf event where the organizers plan to feature a round from his
      foursome as a promotional hook for donors. The ethical issue is whether leveraging the Secretary's official title in
      this manner constitutes prohibited personal-capacity fundraising.
    weighing: Considerations C1 and C2 each assign strong weight to the prohibition on using official status and on personal
      solicitation. C3 provides a binding regulatory illustration that directly bars the contemplated conduct, thereby eliminating
      any option that permits advertised participation. Consequently, the analysis unequivocally supports option O4.
    tradecraft: Record the determination in the department ethics log, retain the invitation for documentation, and formally
      decline the request. Communicate to the charitable group in writing that the Secretary cannot be featured as a promotional
      element.
    uncertainty: The regulatory language is explicit and the cited example directly mirrors the facts, leaving little ambiguity.
    handoff: The Secretary may act on his own authority, yet best practice calls for notifying the ethics office to create
      an official compliance record.
    tempting_wrong:
      option: O2
      pull: Desire to aid disadvantaged youth and to use the Secretary's stature to boost charitable contributions.
      why_wrong: Even with noble intentions, employing the Secretary's official position as a lure for donors breaches §2635.808(c).
    rejected:
      O1: Even a participation that omits advertising still risks the perception that the official title is being leveraged,
        which the regulation forbids.
      O2: Publicizing the Secretary's foursome directly violates the ban on personal solicitation and the use of official
        position.
      O3: Seeking guidance does not overcome the clear statutory prohibition; the rule already makes the conduct impermissible.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C3
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Secretary's involvement were kept private, with no mention of his role in any promotional content and no use
        of his official title as a draw.
      then: O1
      why: Absent any use of official status, the personal-capacity solicitation restriction would not be engaged, permitting
        the Secretary to attend in a private capacity.
    would_not_change:
    - id: noflip1
      if: The tournament publicizes the Secretary's participation irrespective of donor eligibility.
      why: The ban targets the use of official title, not the identity of donors; thus the conduct remains prohibited.
    watch_for:
    - id: watch1
      what: Any effort by the Secretary or his staff to directly solicit subordinates or otherwise barred individuals, even
        through informal channels,
      favors:
      - O4
      why: Targeted solicitation of prohibited sources would breach §2635.808(c)(1) regardless of the broader advertising
        scheme.
  lesson: Federal employees must not exploit their official title, rank, or authority to solicit charitable contributions.
    Personal-capacity fundraising must avoid any appearance of official endorsement and must not involve direct solicitation
    of subordinates or prohibited donors.
  limits: The restriction applies solely to charitable (non-political) fundraising activities. It does not govern fundraising
    conducted in an official capacity, nor does it affect political contributions, which are regulated by separate statutes.
