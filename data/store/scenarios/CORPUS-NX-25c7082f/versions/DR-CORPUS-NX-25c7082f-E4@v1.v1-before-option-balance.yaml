case:
  id: DR-CORPUS-NX-25c7082f-E4@v1
  title: Pre-emptive Force in Peacekeeping
  status: draft
  setting: A peacekeeping operation during an armed conflict involving a non-state conflicting actor.
  decider: The PSF commander
  agent: The PSF commander
  agent_role: decide
  situation: The PSF commander is considering pre-emptive offensive action against a persistent violator of the mandate. The
    contemplated action is during an armed conflict against a non-state conflicting actor. Such action may be unavoidable,
    although force in peacekeeping operations is predominantly reactive. Any action must have mandate authority and comply
    with the applicable legal framework. It must also be limited in duration, avoid negative humanitarian impact, and follow
    the stated principles of military necessity, distinction, proportionality, humanity, and honour. State consent will most
    likely be required, and alternative measures are to be considered first.
  question: What should the PSF commander do about pre-emptive offensive action against the persistent mandate violator, and
    under what authority?
  options:
    O1:
      do: The PSF commander considers alternative measures before deciding on pre-emptive offensive action.
      move: hold
      irreversible: false
    O2:
      do: The PSF commander authorizes pre-emptive offensive action against the persistent mandate violator.
      move: act
      irreversible: true
    O3:
      do: The PSF commander declines pre-emptive offensive action against the persistent mandate violator.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The use of force in peacekeeping operations is predominantly reactive.
  - id: F2
    kind: situation
    status: confirmed
    fact: Protection of civilians under actual or imminent threat of violence is an example of reactive use of force.
  - id: F3
    kind: situation
    status: assessed
    fact: Pre-emptive offensive action against a persistent mandate violator may be unavoidable.
  - id: F4
    kind: situation
    status: confirmed
    fact: The contemplated pre-emptive attack is during an armed conflict against a non-state conflicting actor.
  - id: F5
    kind: authority
    status: confirmed
    fact: Pre-emptive action should be authorized by the mandate and comply with the applicable legal framework, either the
      law of armed conflict or international law.
  - id: F6
    kind: situation
    status: confirmed
    fact: Pre-emptive action should be limited in time to avoid a prolonged engagement and should not result in negative humanitarian
      impact.
  - id: F7
    kind: authority
    status: assessed
    fact: The action will most likely require the consent of the state.
  - id: F8
    kind: authority
    status: confirmed
    fact: The action should comply with military necessity, distinction, proportionality, humanity, the prohibition of superfluous
      injury or unnecessary suffering, and honour.
  - id: F9
    kind: situation
    status: confirmed
    fact: Alternative measures should be considered before pre-emptive force, which may damage the peace process; any action
      should be communicated clearly to all audiences in a timely manner.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F9
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Peacekeeping force is predominantly reactive, and pre-emptive action, though potentially unavoidable, may damage
      the peace process. Alternative measures should therefore be considered before resorting to it.
  - id: C2
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Any pre-emptive action must be authorized by the mandate and comply with the applicable legal framework. The commander
      should not authorize action without establishing that these conditions are met.
  - id: C3
    facts:
    - F6
    - F8
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Action must be limited in time, cause no negative humanitarian impact, and comply with military necessity, distinction,
      proportionality, humanity, and honour. These constraints must be assessed before authorization.
  - id: C4
    facts:
    - F7
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: State consent will most likely be required, so its status is a relevant authority condition to clarify before deciding
      whether to authorize action.
  reasoning:
    read: This is an exceptional consideration of pre-emptive offensive action during armed conflict against a non-state conflicting
      actor, not a general license to use force against a persistent mandate violator. The trap is treating the assessment
      that action may be unavoidable as sufficient to bypass alternative measures and the stated authority and legal constraints.
    weighing: The doctrine makes consideration of alternative measures the first step because pre-emptive force may damage
      the peace process {C1}. It also makes mandate authority and compliance with the applicable legal framework necessary
      conditions {C2}; limited duration, no negative humanitarian impact, and the stated principles constrain any action {C3}.
      State consent will most likely be required {C4}. On the stated information, these reasons support O1 rather than immediate
      authorization or a categorical refusal. Whether O2 could later be justified depends on the alternatives considered and
      whether the relevant authority, consent, and legal and humanitarian conditions are satisfied.
    tradecraft: Before any authorization, assess and document which alternative measures were considered and why they are
      or are not adequate. Confirm the mandate and applicable legal framework, clarify the status of state consent, and assess
      the stated limits and principles; communicate any eventual action clearly to all audiences in a timely manner.
    uncertainty: The doctrine says pre-emptive action may be unavoidable, but the facts do not establish whether alternatives
      have been considered or whether the required authority, consent, and other conditions are in place. The recommendation
      is therefore to defer authorization now, not to conclude that action can never be authorized.
    handoff: The commander should involve relevant state authorities because state consent will most likely be required, and
      obtain legal review of mandate authority and the applicable legal framework. This consultation supports the decision;
      it does not transfer the commander's decision to another office.
    tempting_wrong:
      option: O2
      pull: A persistent mandate violator and the possibility that pre-emptive action is unavoidable can make immediate authorization
        seem necessary.
      why_wrong: Those considerations do not remove the doctrine's instruction to consider alternatives first or its requirements
        for mandate authority, legal compliance, and the other stated limits.
    rejected:
      O2: Immediate authorization is not chosen because the doctrine requires alternative measures to be considered first
        and makes authorization subject to several conditions not established as satisfied here.
      O3: Categorically declining is not chosen because the doctrine says pre-emptive action against a persistent mandate
        violator may be unavoidable; it instead recommends considering alternatives before resorting to force.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Alternative measures have been considered, and the commander establishes mandate authority, compliance with the
        applicable legal framework and stated principles, the required state consent, limited duration, and no negative humanitarian
        impact.
      then: O2
      why: With the preliminary alternatives considered and the stated conditions satisfied, the doctrine allows that pre-emptive
        action may be unavoidable.
    - id: flip2
      if: Authoritative review establishes that the mandate does not authorize the action or that the action cannot comply
        with the applicable legal framework.
      then: O3
      why: Action that lacks mandate authority or cannot comply with the applicable legal framework should not be authorized.
    would_not_change:
    - id: noflip1
      if: The mandate violator is persistent and the commander assesses that pre-emptive action may be unavoidable.
      why: Those circumstances do not displace the instruction to consider alternative measures first or eliminate the conditions
        governing any pre-emptive action.
    watch_for:
    - id: watch1
      what: Whether alternatives can address the mandate violation, and whether state consent and the required authority and
        legal conditions are established.
      favors:
      - O1
      - O2
      - O3
      why: These matters determine whether the commander should continue deferring, may authorize action, or must decline
        it.
  lesson: 'Treat pre-emptive force in peacekeeping as exceptional: the possibility that it is unavoidable does not by itself
    justify immediate authorization. Consider alternatives first, and authorize action only within the mandate and applicable
    legal framework and subject to the stated humanitarian, temporal, consent, and conduct constraints.'
  limits: This reasoning concerns pre-emptive offensive action against a persistent mandate violator during armed conflict
    with a non-state conflicting actor. It does not establish whether a particular mandate authorizes action or determine
    any operational method for conducting it.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-25c7082f
    source: https://assets.publishing.service.gov.uk/media/65e8683f5b65240011f21a82/AJP-3_24_Peace_Support_EdA_V1-O.pdf
    episode_focus: The doctrine says such action may be unavoidable, but requires mandate authority, compliance with the applicable
      legal framework, limited duration, no negative humanitarian impact, and consideration of consent and other legal principles.
      Keep the decision at the level of whether and under what authority to use force; exclude operational methods for conducting
      an attack.
