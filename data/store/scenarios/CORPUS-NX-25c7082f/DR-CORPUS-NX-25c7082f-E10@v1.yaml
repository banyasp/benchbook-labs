case:
  id: DR-CORPUS-NX-25c7082f-E10@v1
  title: Minefield Disclosure and Impartiality
  status: draft
  setting: Peace support operation; time unspecified; PSF
  decider: The PSF
  agent: The PSF
  agent_role: decide
  situation: A peace support force (PSF) is operating in a setting involving conflicting parties and their minefields. The
    PSF faces a choice about disclosing one party's minefield locations to the other party. Retaining impartial status is
    relevant to that choice, alongside the PSF's responsibility concerning adequate marking under international law. Within
    the UN, mine-related tasks have a designated focal service, often assisted by OCHA.
  question: What should the PSF do about disclosing one party's minefield locations to the other party while addressing impartiality
    and its legal responsibilities?
  options:
    O1:
      do: The PSF asks its legal adviser for guidance before deciding on disclosure.
      move: ask
      irreversible: false
      to: the PSF's legal adviser
    O2:
      do: The PSF discloses one party's minefield locations to the other party.
      move: act
      irreversible: true
    O3:
      do: The PSF withholds one party's minefield locations from the other party.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The disclosure rule applies if the PSF wishes to retain its impartial status.
  - id: F2
    kind: authority
    status: confirmed
    fact: To retain impartial status, the PSF is obliged not to reveal one party's minefield locations to the other party.
  - id: F3
    kind: authority
    status: confirmed
    fact: The PSF should make every effort to ensure minefields are adequately marked.
  - id: F4
    kind: authority
    status: confirmed
    fact: Adequate marking is to be in accordance with international law.
  - id: F5
    kind: situation
    status: confirmed
    fact: Within the UN, the UN Mine Action Service is the focus for mine-related tasks.
  - id: F6
    kind: situation
    status: confirmed
    fact: OCHA often assists the UN Mine Action Service.
  considerations:
  - id: C1
    facts:
    - F1
    equity: impartiality
    favors:
    - O3
    weight: strong
    why: The nondisclosure rule is triggered if the PSF wishes to retain impartial status, which is a relevant concern in
      this decision.
  - id: C2
    facts:
    - F2
    equity: impartiality
    favors:
    - O3
    weight: bar
    why: If the PSF is to retain impartial status, it is obliged not to reveal one party's minefield locations to the other.
    rules_out:
    - O2
  - id: C3
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Withholding locations does not remove the separate duty to make every effort to ensure adequate marking in accordance
      with international law.
  reasoning:
    read: The decision concerns disclosure between conflicting parties, not whether the PSF should meet its separate responsibility
      for adequate marking. The trap is treating that marking responsibility as a reason to reveal one party's locations to
      the other, despite the nondisclosure rule for a PSF seeking to remain impartial.
    weighing: The doctrine makes nondisclosure obligatory if the PSF wishes to retain impartial status {C1} {C2}. At the same
      time, it should make every effort to ensure adequate marking in accordance with international law {C3}; that obligation
      accompanies, rather than cancels, the disclosure rule. The balance depends on the PSF seeking to retain impartial status.
    tradecraft: Keep the disclosure decision separate from the marking responsibility, and record the impartiality basis for
      withholding and the steps taken to address the marking obligation. Do not treat disclosure as a substitute for fulfilling
      that obligation.
    uncertainty: The doctrine states the nondisclosure rule conditionally on retaining impartial status. It does not establish
      a general permission to disclose when that condition does not apply.
    handoff: The PSF should apply the disclosure rule itself and involve the UN Mine Action Service on mine-related responsibilities;
      OCHA often assists that service. This coordination does not change the stated nondisclosure rule.
    tempting_wrong:
      option: O2
      pull: Disclosure might seem like a way to address the separate responsibility for adequate marking.
      why_wrong: The doctrine distinguishes the marking responsibility from disclosure and obliges the PSF not to reveal locations
        if it wishes to retain impartial status.
    rejected:
      O1: The doctrine supplies the applicable conditional rule, so seeking advice before deciding is not the endorsed course
        on the stated facts.
      O2: Disclosure conflicts with the doctrine's obligation to withhold locations when the PSF wishes to retain impartial
        status.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The PSF does not wish to retain impartial status.
      then: O1
      why: The stated condition for the nondisclosure obligation would no longer be established; because the doctrine does
        not thereby endorse disclosure, seek guidance before choosing whether to disclose.
    would_not_change:
    - id: noflip1
      if: The UN Mine Action Service, with or without OCHA assistance, is involved in mine-related tasks.
      why: That coordination does not alter the nondisclosure obligation when the PSF wishes to retain impartial status.
    watch_for: []
  lesson: When doctrine makes nondisclosure a condition of retaining impartial status, do not treat a separate legal responsibility
    as permission to disclose. Meet the separate responsibility without abandoning the applicable disclosure rule.
  limits: This conclusion applies where the PSF wishes to retain impartial status and the stated doctrine governs. The source
    does not establish what disclosure rule applies if that condition is absent.
  library:
    domain: natsec-other
    family: CORPUS-NX-25c7082f
    source: https://assets.publishing.service.gov.uk/media/65e8683f5b65240011f21a82/AJP-3_24_Peace_Support_EdA_V1-O.pdf
    episode_focus: The doctrine says the PSF must not reveal those locations if it seeks to retain impartial status, while
      it should ensure hazards are adequately marked under international law. Frame the choice around disclosure, impartiality,
      and the legal obligation; exclude methods of locating or marking mines.
