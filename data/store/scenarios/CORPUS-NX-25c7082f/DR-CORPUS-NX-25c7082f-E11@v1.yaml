case:
  id: DR-CORPUS-NX-25c7082f-E11@v1
  title: Emergency Civilian Medical Support
  status: draft
  setting: An area with damaged or non-existent health infrastructure, during planning for PSF civilian medical support.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: The Commander is considering civilian medical support in an area where health infrastructure has been damaged
    or is non-existent. The decision concerns whether military assets are needed to meet a critical humanitarian need when
    no comparable civilian alternative is available. Civilian health providers and local authorities are relevant coordination
    partners. If PSF medical forces lead civilian provision, an appropriate civilian authority may later take over. The standard
    of support and the receiving nation's ability to sustain it are also relevant.
  question: What should the Commander do about PSF medical support for civilians in an area with damaged or non-existent health
    infrastructure?
  options:
    O1:
      do: The Commander authorizes PSF medical forces to provide civilian health support temporarily, coordinating with local
        authorities until an appropriate civilian authority takes over.
      move: act
      irreversible: false
    O2:
      do: The Commander declines to authorize PSF medical forces to provide civilian health support and leaves coordination
        and continuing provision to civilian authorities.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The area under consideration has damaged or non-existent health infrastructure.
  - id: F2
    kind: authority
    status: confirmed
    fact: Military support should be requested only when no comparable civilian alternative exists and military or civil-defence
      assets can meet a critical humanitarian need.
  - id: F3
    kind: situation
    status: confirmed
    fact: Liaison with civilian health care providers is important for a coordinated and, where required, collaborative response.
  - id: F4
    kind: authority
    status: confirmed
    fact: Civilian medical support must be closely coordinated with local authorities or health care organizations and aligned
      with OCHA guidelines.
  - id: F5
    kind: authority
    status: confirmed
    fact: PSF medical forces should lead civilian health provision only when no civilian alternative is available and only
      until an appropriate civilian authority can take over.
  - id: F6
    kind: authority
    status: confirmed
    fact: Civilian medical support should be as close as possible to the receiving nation's peacetime standards and acceptable
      at least for the outcome to the providing nation.
  - id: F7
    kind: situation
    status: confirmed
    fact: The receiving nation must be able to sustain the provided standard over the long term.
  - id: F8
    kind: authority
    status: confirmed
    fact: Medical rules of eligibility define access to the military medical system by population category.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: humanitarian_access
    favors:
    - O1
    weight: strong
    why: Damaged or absent infrastructure can make military support necessary as a last resort, but it is justified only if
      no comparable civilian alternative exists and military or civil-defence assets can meet a critical humanitarian need.
  - id: C2
    facts:
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: Civilian health providers, local authorities, and health care organizations are important coordination partners;
      support should be closely coordinated with them and aligned with OCHA guidelines.
  - id: C3
    facts:
    - F5
    equity: critical_services
    favors:
    - O1
    weight: strong
    why: PSF medical forces may lead civilian health provision only when no civilian alternative is available, and only for
      as long as needed until an appropriate civilian authority can take over.
  - id: C4
    facts:
    - F6
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Any support should be as close as possible to the receiving nation's peacetime standards, acceptable at least for
      the outcome to the providing nation, and sustainable by the receiving nation over the long term.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Eligibility rules define access to the military medical system by population category, so civilian support must account
      for those rules.
  reasoning:
    read: The situation is a potential last-resort humanitarian response, not a general authorization to use military medical
      resources for civilian care. Damaged infrastructure makes support worth considering, but does not by itself establish
      that the required civilian-alternative and critical-need conditions are met.
    weighing: The doctrine supports temporary PSF provision when no comparable civilian alternative exists and military assets
      are needed to meet a critical humanitarian need {C1}. Coordination with civilian providers and local authorities, a
      timely handoff, and sustainable standards constrain how that support should be provided {C2} {C3} {C4}. The recommendation
      for {O1} therefore depends on confirming the threshold conditions and complying with applicable eligibility rules {C5}.
    tradecraft: Before authorizing support, record the basis for finding that no comparable civilian alternative is available
      and that military assets can meet a critical humanitarian need. Document coordination, applicable eligibility rules,
      the intended standard and its long-term sustainability, and the conditions for civilian-authority takeover.
    uncertainty: The stated facts establish damaged or non-existent infrastructure but do not independently establish that
      no comparable civilian alternative exists or that military assets are necessary to meet a critical humanitarian need.
      The recommendation is therefore conditional on confirming those requirements.
    handoff: The Commander should coordinate with civilian health care providers and local authorities or health care organizations,
      because the response should be coordinated and, where required, collaborative. An appropriate civilian authority should
      take over PSF-led provision as soon as it can do so.
    tempting_wrong:
      option: O2
      pull: Declining military support can seem preferable because civilian authorities and providers should have the leading
        role.
      why_wrong: A blanket refusal overlooks the doctrine's allowance for last-resort military support when no comparable
        civilian alternative exists and military assets are needed to meet a critical humanitarian need.
    rejected:
      O2: It was not chosen because the doctrine recommends considering temporary military support as a last resort where
        the required civilian-alternative and critical-need conditions are met.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A comparable civilian alternative is available.
      then: O2
      why: The doctrine limits PSF leadership of civilian health provision to circumstances where no civilian alternative
        is available.
    - id: flip2
      if: Military or civil-defence assets are not needed to meet a critical humanitarian need.
      then: O2
      why: The doctrine says military assets should be requested only where their use can meet a critical humanitarian need
        and no comparable civilian alternative exists.
    would_not_change:
    - id: noflip1
      if: The health infrastructure remains damaged or non-existent.
      why: That circumstance may make support worth considering, but does not remove the separate last-resort and critical-need
        conditions.
    watch_for:
    - id: watch1
      what: Whether the receiving nation can sustain the proposed standard of support over the long term.
      favors:
      - O2
      why: The doctrine says long-term sustainability is crucial; if it is lacking, the Commander should reconsider the proposed
        support or its standard before authorizing it.
  lesson: 'Treat military medical support to civilians as a last resort: establish that no comparable civilian alternative
    exists and that military assets can meet a critical humanitarian need. If PSF forces lead provision, coordinate closely
    with civilian partners, provide support to an appropriate and sustainable standard, and limit the lead role until a civilian
    authority can take over.'
  limits: This reasoning addresses the decision to provide civilian medical support and the conditions for doing so; it does
    not determine individual clinical or logistical methods. It does not establish that the last-resort and critical-need
    conditions are satisfied in any particular area without supporting facts.
  library:
    domain: natsec-other
    family: CORPUS-NX-25c7082f
    source: https://assets.publishing.service.gov.uk/media/65e8683f5b65240011f21a82/AJP-3_24_Peace_Support_EdA_V1-O.pdf
    episode_focus: 'The doctrine treats military support as a last resort: it should be considered when no comparable civilian
      alternative exists and military or civil-defence assets are needed to meet a critical humanitarian need. If PSF medical
      forces lead civilian provision, they should do so only until an appropriate civilian authority can take over; exclude
      clinical or logistical techniques.'
