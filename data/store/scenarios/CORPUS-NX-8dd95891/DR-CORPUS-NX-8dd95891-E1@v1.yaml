case:
  id: DR-CORPUS-NX-8dd95891-E1@v1
  title: Whether to Host a Proposed Language-System Test
  status: draft
  setting: Camp Elliott near San Diego, California; at the time of the proposed trial; Marine Corps.
  decider: The Marine Corps
  agent: The Marine Corps
  agent_role: decide
  situation: The Marine Corps is considering whether to host a test of a proposed system using Navajo. American Indian languages,
    particularly Choctaw, had been used as code talk in World War I with positive results. After 1918, German nationals visited
    the United States to learn American Indian languages, and many people assumed the Third Reich would share its knowledge
    of those languages with its Axis partners. Many therefore viewed using such languages to protect military communications
    as an outdated idea. The project’s proponent believed Navajo was unique, noting the tribe’s remote region and the small
    number of non-Navajos who knew the language. The Marine Corps has serious doubts about the proposal.
  question: What should the Marine Corps do about hosting a test of the proposed system at Camp Elliott?
  options:
    O1:
      do: The Marine Corps rejects hosting a test of the proposed system at Camp Elliott.
      move: act
      irreversible: false
    O2:
      do: The Marine Corps approves hosting a test of the proposed system at Camp Elliott.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: American Indian languages, particularly Choctaw, had been used as code talk in World War I with positive results.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: After 1918, German nationals visited the United States with the purpose of learning American Indian tribal languages.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Many assumed the Third Reich would share its knowledge of American Indian languages with its Axis partners.
  - id: F4
    kind: situation
    status: assessed
    fact: Many viewed the use of American Indian languages to protect military communications as an idea whose time had passed.
  - id: F5
    kind: capability
    status: assessed
    fact: The proposal’s proponent believed Navajo was unique.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Navajo tribe came from a remote region.
  - id: F7
    kind: capability
    status: confirmed
    fact: Only a handful of non-Navajos had knowledge of the Navajo language.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Marine Corps had serious doubts about the proposed system.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The concern was that adversaries had sought to learn Indigenous languages and might share what they learned, making
      language-based protection seem outdated.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The proponent's claim that Navajo was distinctive was supported by the tribe's remote region and the very small number
      of non-Navajos who knew the language, reducing the force of the general concern.
  - id: C3
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Prior positive use of American Indian languages as code talk showed that the general approach had potential value,
      though it did not resolve whether Navajo would avoid the identified exposure risk.
  - id: C4
    facts:
    - F8
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: The Corps had serious doubts, reflecting the uncertainty and concern surrounding the proposal, but those doubts did
      not prevent it from agreeing to a test.
  reasoning:
    read: The decision was whether to host a test, not whether to adopt or use a completed system. The trap is treating the
      broad history of outsiders learning Indigenous languages as proof that Navajo was equally exposed, or treating the proponent's
      belief in Navajo's distinctiveness as conclusive without testing it.
    weighing: The prospect that adversaries could learn and share Indigenous languages, and the view that this made the approach
      outdated, weighed against approval {C1}. But the asserted distinctiveness of Navajo, the tribe's remoteness, and the
      scarcity of non-Navajo speakers supplied a specific reason not to treat all Indigenous languages alike {C2}. Prior positive
      code-talk results lent some support to testing the approach {C3}; the Corps' doubts remained relevant but were not decisive
      {C4}. The balance favored hosting a test, with the judgment depending especially on whether Navajo's reported limited
      accessibility distinguished it from the broader concern.
    tradecraft: Keep the decision record focused on the limited choice to host a test and the competing evidence about language
      accessibility and adversary knowledge. Do not treat approval of a test as approval of later operational use. This is
      decision-practice guidance synthesized for this scenario.
    uncertainty: The record gives the proponent's belief that Navajo was unique and states that few non-Navajos knew it, but
      does not establish how much adversaries knew of Navajo specifically. The positive results of the trial became available
      only after the decision to host it.
    handoff: The Marine Corps is the identified decision-maker. The source does not identify another office or authority whose
      concurrence was required.
    tempting_wrong:
      option: O1
      pull: The history of outsiders seeking to learn Indigenous languages and the resulting view that language-based protection
        was outdated make rejection appear prudent.
      why_wrong: That general concern does not resolve the specific evidence about Navajo's remoteness and the scarcity of
        non-Navajo speakers, and the choice at hand is to test the proposal rather than commit to its later use.
    rejected:
      O1: The Marine Corps did not reject hosting the test because the specific evidence about Navajo's limited accessibility
        justified testing the proposal despite the broader concern.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that non-Navajos, including potential adversaries, had broad knowledge of Navajo.
      then: O1
      why: That would undermine the specific accessibility-based reason for distinguishing Navajo from other Indigenous languages.
    would_not_change:
    - id: noflip1
      if: The general concern about outsiders learning Indigenous languages remained, without evidence that Navajo itself
        was similarly accessible.
      why: That concern is already part of the balance and does not by itself displace the source's specific reasons for agreeing
        to test Navajo.
    watch_for: []
  lesson: A general security concern should be weighed against evidence specific to the proposed capability, rather than assumed
    to apply equally in every case. When the choice is to test a proposal, distinguish that limited decision from a commitment
    to later operational use.
  limits: This reasoning addresses only the decision to host the proposed test, not the design, security, or later operational
    use of any code. It would not apply unchanged if evidence showed that Navajo was widely accessible to adversaries or if
    a binding rule barred the test.
