case:
  id: DR-CORPUS-NX-7b83a89d-E2@v1
  title: Committing Support to the NSA Museum
  status: draft
  setting: National Security Agency museum, 1996
  decider: The Director of the National Security Agency
  agent: The Director of the National Security Agency
  agent_role: decide
  situation: In 1996, the NSA museum had no space for new exhibits and needed repairs and renovations. Its entrance road and
    parking lot were deteriorating, signs were needed, and the old restrooms required major work. The museum had no real budget,
    and earlier requests for improvements had not succeeded. The Director toured the museum and expressed a desire for a modernized
    institution and prompt repairs. Evening receptions and dinners were planned for the museum, with the first in six weeks.
  question: What should the Director of the National Security Agency do about committing organizational support, assigning
    the building to the museum, and planning for its expansion?
  options:
    O1:
      do: The Director authorizes organizational support for facility improvements, assigns the whole building to the museum,
        and requests a three-year expansion plan.
      move: act
      irreversible: false
    O2:
      do: The Director declines organizational support for facility improvements, declines to assign the whole building to
        the museum, and declines to request a three-year expansion plan.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: By 1996, the museum was out of space for new exhibits.
  - id: F2
    kind: situation
    status: confirmed
    fact: The museum needed repairs and further renovations.
  - id: F3
    kind: situation
    status: confirmed
    fact: The entrance road and parking lot were deteriorating, and signs were needed to direct visitors to the museum.
  - id: F4
    kind: situation
    status: confirmed
    fact: The restrooms were thirty-five years old, in poor condition, and in need of a major overhaul.
  - id: F5
    kind: situation
    status: confirmed
    fact: The museum had no real budget, and requests for improvements had not succeeded.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Director became the fourteenth Director of the National Security Agency in March 1996.
  - id: F7
    kind: situation
    status: assessed
    fact: After touring the museum, the Director said he wanted a 21st-century museum and prompt completion of needed repairs
      and renovations.
  - id: F8
    kind: situation
    status: assessed
    fact: The Director said evening receptions and dinners would begin at the museum, with the first in six weeks.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The museum lacked space and had substantial facility and visitor-access needs, while earlier requests had failed
      because it had no real budget. Those conditions supported committing organizational help rather than leaving the museum
      unable to address them.
  - id: C2
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: After touring the museum, the Director expressed a clear goal for a modernized institution and prompt improvements.
      Assigning the whole building and calling for an expansion plan turned that goal into organizational support.
  - id: C3
    facts:
    - F7
    - F8
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The planned receptions, with the first in six weeks, made prompt attention to the museum's condition especially important;
      the Director explicitly called for needed work to be completed quickly.
  - id: C4
    facts:
    - F1
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The museum was already out of exhibit space, so a three-year expansion plan addressed a continuing capacity problem
      rather than only the immediate condition of the building.
  reasoning:
    read: 'This was both an immediate facilities problem and a longer-term capacity problem: the museum had no space for new
      exhibits, needed repairs, and had not obtained improvements through its prior requests. The trap is treating the absence
      of a real budget and earlier lack of success as reasons to leave the situation unchanged, despite the Director''s stated
      goal and the upcoming museum events.'
    weighing: 'The reasons favor O1: the museum''s needs were extensive, its earlier requests had gone unanswered, the Director
      wanted prompt modernization, and receptions were planned within six weeks. Assigning the whole building and requesting
      a three-year plan paired immediate organizational backing with planning for the lack of exhibit space. The balance depends
      on the Director being able to commit that support consistently with other agency obligations; no competing demands or
      costs are given.'
    tradecraft: Make the commitment and assignment explicit, identify accountable museum and support-services leads, and require
      the expansion plan to set out priorities and resource needs. Keep a record of the decision, its authority, and any constraints
      on the commitment.
    uncertainty: No cost estimates, details about competing agency needs, or contents of the three-year plan are provided.
      The facts support organizational backing, but not a conclusion about the precise resources or expansion scope required.
    handoff: The Director should make the organizational decision and involve museum leadership and the support-services chain
      to develop and coordinate the plan and support. The Deputy Director for Support Services can communicate the Director's
      direction through the chain of command, while museum leadership can identify needs and prepare the expansion plan.
    tempting_wrong:
      option: O2
      pull: The museum had no real budget, and prior requests for improvements had not succeeded.
      why_wrong: Those circumstances explain why the deficiencies persisted; they do not address the Director's stated goal,
        the unmet facility and capacity needs, or the planned receptions that made prompt support salient.
    rejected:
      O2: The Director did not leave the museum without support; he ordered needed improvements, assigned the whole building
        to it, and requested a three-year expansion plan.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A review established that assigning the whole building or committing organizational support would materially compromise
        a higher-priority agency requirement.
      then: O2
      why: A material conflict with a higher-priority agency requirement could outweigh the museum's needs and the event deadline.
    would_not_change:
    - id: noflip1
      if: The planned receptions were postponed or canceled.
      why: That would reduce the immediate time pressure, but the lack of exhibit space, needed repairs, and previously unsuccessful
        requests would still support organizational backing and expansion planning.
    watch_for:
    - id: watch1
      what: Whether the three-year expansion plan identifies continuing capacity needs and the resources needed to address
        them.
      favors:
      - O1
      why: The museum was already out of space for new exhibits; a plan grounded in that need would help carry the Director's
        commitment forward.
  lesson: When an institution has persistent needs that earlier requests could not resolve, a leader can make organizational
    support effective by assigning responsibility and requiring a longer-range plan. An immediate deadline may strengthen
    the case for prompt action, but it does not replace planning for the underlying capacity problem.
  limits: This reasoning supports the leadership choice on the facts given; it does not establish what resources should be
    committed or whether a particular expansion plan is affordable. A material conflict with higher-priority agency needs
    or a binding constraint could change the balance.
