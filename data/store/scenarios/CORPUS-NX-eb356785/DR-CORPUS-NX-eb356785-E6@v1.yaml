case:
  id: DR-CORPUS-NX-eb356785-E6@v1
  title: Defining SOCNORTH’s Role
  status: draft
  setting: SOCNORTH, September 2016, design inquiry
  decider: The SOCNORTH Commander
  agent: The SOCNORTH Commander
  agent_role: decide
  situation: SOCNORTH is a TSOC in the NORTHCOM AOR, whose environment differs from the AORs of other TSOCs. Its role is being
    considered within constitutional constraints and alongside domestic and international partners with different responsibilities
    and rules. The available conceptions include a conventional military-command model and a framework for cooperative action
    with partners. Under the latter conception, SOCNORTH could complement partner efforts, support DOD efforts, and lead DOD
    efforts when appropriate. The Commander must define SOCNORTH’s role and approach.
  question: What should the SOCNORTH Commander do to define SOCNORTH’s role as a TSOC?
  options:
    O1:
      do: The SOCNORTH Commander should approve a partner-adaptive role framework for the NORTHCOM AOR.
      move: act
      irreversible: false
    O2:
      do: The SOCNORTH Commander should reject a conventional military-command role framework for the NORTHCOM AOR.
      move: act
      irreversible: false
    O3:
      do: The SOCNORTH Commander should approve a limited supporting-role framework for the NORTHCOM AOR.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In September 2016, the SOCNORTH Commander sponsored a design inquiry.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Commander had served as deputy commander at SOCCENT and recognized intrinsic differences between the SOCCENT
      and SOCNORTH AORs.
  - id: F3
    kind: authority
    status: confirmed
    fact: The inquiry examined SOCNORTH’s role as a TSOC in light of constitutional constraints.
  - id: F4
    kind: situation
    status: assessed
    fact: SOCNORTH operates in a multifaceted environment alongside partners, including FBI, DOE, and DHS, whose activities
      involve different rules.
  - id: F5
    kind: situation
    status: assessed
    fact: SOCNORTH is not always the lead organization and may have a significant supporting role.
  - id: F6
    kind: capability
    status: assessed
    fact: The envisioned future is for SOCNORTH to defend the Homeland in depth through a framework for cooperative action
      with DOD, interagency, and international partners.
  - id: F7
    kind: situation
    status: assessed
    fact: The envisioned role is to complement international and interagency partners, support DOD efforts, and lead DOD efforts
      when appropriate in the NORTHCOM AOR.
  - id: F8
    kind: capability
    status: assessed
    fact: The proposed approach calls for broadening SOCNORTH’s aperture, expanding and refining its capabilities, and building
      its network.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Commander recognized intrinsic differences between the SOCCENT and SOCNORTH areas of responsibility, so a conventional
      model carried over from another theater would not fit the environment the framework was meant to address.
  - id: C2
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The inquiry expressly considered SOCNORTH’s role within constitutional constraints; the role should therefore be
      defined with those constraints in view, rather than assumed to follow a conventional military-command model.
  - id: C3
    facts:
    - F4
    - F5
    equity: partner_relationship
    favors:
    - O1
    - O3
    weight: strong
    why: SOCNORTH operates alongside partners with different rules and is not always the lead. A framework must allow meaningful
      support to partners, but the fact that support is sometimes appropriate does not establish that support should be SOCNORTH’s
      only role.
  - id: C4
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The envisioned role is cooperative and differentiated: complement interagency and international partners, support
      DOD efforts, and lead DOD efforts when appropriate. That expressly supports an adaptive framework rather than a fixed
      command posture or an exclusively supporting role.'
  - id: C5
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Broadening SOCNORTH’s aperture, refining its capabilities, and building its network are consistent with adapting
      to a multifaceted partner environment.
  reasoning:
    read: This is a role-design decision in a distinct area of responsibility, not a choice to import a familiar command model
      unchanged. The trap is to treat military command as the default even though the inquiry recognized constitutional constraints,
      partners with different rules, and circumstances in which SOCNORTH supports rather than leads.
    weighing: 'The Commander’s framework favors cooperative action because the SOCNORTH environment differs from other TSOC
      areas and includes partners with distinct responsibilities and rules {C1} {C2} {C3}. The framework preserves role flexibility:
      SOCNORTH complements interagency and international partners, supports DOD, and leads DOD when appropriate {C4}. The
      proposed broadening of perspective, capability refinement, and network-building reinforce that approach {C5}. The balance
      depends on retaining the constitutional context and making leadership conditional rather than treating it as the default.'
    tradecraft: Record the adopted role in terms of its constitutional context, partner relationships, and the distinction
      between complementing partners, supporting DOD, and leading DOD when appropriate. Keep the framework at the level of
      roles and authorities, and revisit it if those constraints or relationships materially change.
    uncertainty: The framework states a desired future and approach, but the excerpt does not specify how to resolve particular
      legal or interagency disputes or how to determine, in a given case, when DOD leadership is appropriate.
    handoff: The Commander sponsored the design inquiry, which was facilitated by faculty from the Joint Special Operations
      University and the Rhode Island National Guard Special Operations Detachment-Global. For implementation, involve relevant
      legal and interagency authorities when applying the framework to particular roles, because constitutional constraints
      and partner rules are central to the decision. The latter implementation step is a practical recommendation, not specified
      in the framework.
    tempting_wrong:
      option: O2
      pull: A conventional military-command model may seem familiar for a TSOC, especially given the Commander’s prior experience
        in another theater.
      why_wrong: The Commander recognized that the SOCNORTH area is intrinsically different; the framework instead calls for
        cooperative action with partners who have different rules and responsibilities.
    rejected:
      O2: A conventional command framework was not chosen because the envisioned approach responds to SOCNORTH’s distinct,
        partner-rich and constitutionally constrained environment.
      O3: A limited supporting-role framework was not chosen because the envisioned role also allows SOCNORTH to support and,
        when appropriate, lead DOD efforts.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The constitutional and partner context made leading DOD efforts unavailable, while cooperative action remained possible
        through a supporting role.
      then: O3
      why: A support-only framework would then better reflect the available lawful and partner-compatible role.
    - id: flip2
      if: The area of responsibility no longer differed materially from the conventional environments the Commander had considered,
        and the partner-specific constraints no longer called for an adaptive approach.
      then: O2
      why: The source’s stated basis for departing from a conventional model would have materially weakened.
    would_not_change:
    - id: noflip1
      if: SOCNORTH sometimes has a significant supporting role rather than leading.
      why: That circumstance is already accommodated by the framework, which includes support while retaining leadership when
        appropriate.
    watch_for:
    - id: watch1
      what: Changes in partner responsibilities or rules, and whether a proposed SOCNORTH role would complement, support,
        or appropriately lead DOD efforts.
      favors:
      - O1
      why: The framework is built around a multifaceted environment and differentiated roles with partners.
  lesson: Define a role for its actual legal and institutional environment, rather than assuming that a model from another
    area will transfer. In a partner-rich setting, preserve the ability to complement, support, or lead as appropriate instead
    of making leadership or support an inflexible rule.
  limits: This reasoning concerns the Commander’s high-level role framework in the September 2016 inquiry. It does not decide
    the legality, authority, or appropriate leadership arrangement for any particular operation or interagency matter.
