case:
  id: DR-CORPUS-NX-9c1437e3-E1@v1
  title: Autonomous Weapon System Development Review
  status: draft
  setting: Department of Defense, before formal development, during senior review under DoDD 3000.09.
  decider: The USD(P), USD(R&E), and VCJCS
  agent: The USD(P), USD(R&E), and VCJCS
  agent_role: decide
  situation: A proposed autonomous weapon system intended for use outside the specified policy categories is before the senior
    reviewers for a decision about formal development. The reviewers must verify that the design enables appropriate human
    judgment over use of force and that the system can operate within the intended parameters or terminate an engagement or
    seek further operator input. They must assess whether the system’s design and concept of employment account for risks
    to non-targets. They must verify that plans address reliability and effectiveness under realistic conditions, including
    possible adversary actions, and that system safety and cybersecurity address and minimize failures. If the system incorporates
    AI, plans must address consistency with DoD AI ethical principles and strategy. A preliminary legal review must also be
    completed.
  question: What should the USD(P), USD(R&E), and VCJCS do about approving the proposed system for formal development?
  options:
    O1:
      do: The USD(P), USD(R&E), and VCJCS approve the system for formal development under applicable acquisition policies.
      move: act
      irreversible: false
    O2:
      do: The USD(P), USD(R&E), and VCJCS reject the system and do not permit formal development under applicable acquisition
        policies.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Systems intended for use outside the specified policy categories require senior approval before formal development.
  - id: F2
    kind: authority
    status: confirmed
    fact: Before a formal-development decision, the USD(P), USD(R&E), and VCJCS verify the required review criteria.
  - id: F3
    kind: capability
    status: confirmed
    fact: The system design must enable commanders and operators to exercise appropriate levels of human judgment over use
      of force.
  - id: F4
    kind: capability
    status: confirmed
    fact: The system must be designed to complete engagements within intended parameters or terminate engagements or obtain
      additional operator input.
  - id: F5
    kind: situation
    status: confirmed
    fact: The system’s design and concept of employment must account for risks to non-targets consistent with commander and
      operator intent.
  - id: F6
    kind: capability
    status: confirmed
    fact: The design must address and minimize the probability and consequences of failures, and plans must establish reliability,
      effectiveness, and suitability under realistic conditions.
  - id: F7
    kind: authority
    status: confirmed
    fact: For a system incorporating AI capabilities, plans must ensure consistency with the DoD AI Ethical Principles and
      the DoD Responsible AI Strategy and Implementation Pathway.
  - id: F8
    kind: authority
    status: confirmed
    fact: A preliminary legal review must be completed in coordination with the GC DoD and in accordance with the cited directives.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: This system falls outside the specified policy categories, so senior approval is required before formal development.
      The reviewers' authority is to decide after verifying the applicable criteria; approval permits proceeding under acquisition
      policies.
  - id: C2
    facts:
    - F3
    - F4
    equity: control_integrity
    favors:
    - O1
    weight: strong
    why: Before formal development, the reviewers verify that the design enables appropriate human judgment over use of force
      and keeps engagements within intended parameters, terminating them or seeking further operator input if it cannot.
  - id: C3
    facts:
    - F5
    equity: third_party_harm
    favors:
    - O1
    weight: strong
    why: The review must establish that the system's design and concept of employment account for risks to non-targets in
      a manner consistent with commander and operator intent.
  - id: C4
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The design must address and minimize the probability and consequences of failures, and plans must establish reliability,
      effectiveness, and suitability under realistic conditions, including possible adversary actions.
  - id: C5
    facts:
    - F7
    - F8
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: Where AI is incorporated, plans must address consistency with DoD AI principles and strategy. A preliminary legal
      review coordinated with the GC DoD must also be completed; these are review requirements, not grounds for automatic
      approval.
  reasoning:
    read: This is a required senior-review gate before formal development for a system outside the specified policy categories.
      The trap is treating either the existence of the review criteria as proof that they have been met, or the risks they
      address as a categorical ban. Approval is the endorsed outcome, but the directive makes it dependent on the reviewers
      verifying the required matters.
    weighing: The directive supports proceeding through acquisition only after the reviewers verify human judgment, engagement
      limits, non-target risk, safety and reliability planning, and the applicable AI and legal-review requirements. Those
      safeguards support {O1}; they do not make approval automatic. The fixed facts identify the criteria but do not provide
      test results or findings that each has been verified, so the approval rationale depends on completing that review rather
      than assuming compliance.
    tradecraft: Record the reviewers' decision and the basis for each required verification, including whether AI requirements
      apply and whether the preliminary legal review is complete. Keep the decision at the approval level and proceed under
      applicable acquisition policies; do not turn it into operational employment guidance.
    uncertainty: The source specifies what the reviewers must verify but supplies no case-specific verification results. The
      decision therefore cannot be read as a finding that particular tests passed or that a legal review has already been
      completed.
    handoff: The USD(P), USD(R&E), and VCJCS decide before formal development. The preliminary legal review is coordinated
      with the GC DoD, and the senior-review process may be supported by the Autonomous Weapon Systems Working Group.
    tempting_wrong:
      option: O2
      pull: The system presents risks involving human judgment, non-targets, failures, and legal compliance.
      why_wrong: Those concerns are matters the directive requires the reviewers to verify and address; the directive provides
        a path to approval rather than excluding these systems categorically. Rejection would be appropriate if the review
        did not result in approval.
    rejected:
      O2: The endorsed outcome is approval for formal development, subject to the required senior verification and applicable
        acquisition policies.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The senior review process did not result in approval to develop the system.
      then: O2
      why: The directive's flow chart says not to develop the system when the review does not result in approval.
    would_not_change:
    - id: noflip1
      if: The system did not incorporate AI capabilities.
      why: That would remove the AI-specific consistency check, but would not remove the other formal-development verification
        criteria or the preliminary legal-review requirement.
    watch_for:
    - id: watch1
      what: Whether the reviewers have verified each applicable formal-development criterion, including the preliminary legal
        review.
      favors:
      - O1
      why: Approval depends on the senior reviewers' verification; the fixed facts state the criteria but do not report the
        verification findings.
  lesson: Senior review is a decision gate, not a presumption of approval or a categorical prohibition. Approve for formal
    development only through the designated authority and on the required verification record, including legal review and
    any applicable AI requirements.
  limits: This reasoning concerns senior review before formal development for a system outside the specified policy categories.
    It does not decide fielding approval, operational use, or whether a particular system actually satisfies the review criteria.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-9c1437e3
    source: https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodd/300009p.PDF
