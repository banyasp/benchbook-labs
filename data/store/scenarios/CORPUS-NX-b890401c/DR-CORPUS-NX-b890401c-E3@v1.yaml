case:
  id: DR-CORPUS-NX-b890401c-E3@v1
  title: Settlement or Continued Litigation
  status: draft
  setting: Federal government patent litigation, 1958, government legal authorities.
  decider: The government
  agent: The government
  agent_role: decide
  situation: The government faced patent litigation involving the Navy. An attorney recommended that the government settle
    the case and assessed that the Navy had likely infringed some patents. The attorney also cited general doubts about the
    outcome of litigation. The government faced uncertainty about prevailing in court and the possibility that a trial could
    require disclosure of cryptographic secrets. The NSA would not recommend an exact settlement figure.
  question: What should the government do about whether to settle the patent case or continue the litigation?
  options:
    O1:
      do: The government settles the case for $30,000.
      move: act
      irreversible: true
    O2:
      do: The government continues the case through litigation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The government faced patent litigation involving the Navy.
  - id: F2
    kind: situation
    status: confirmed
    fact: An attorney recommended that the government settle the case.
  - id: F3
    kind: situation
    status: assessed
    fact: The attorney assessed that the Navy had likely infringed some patents.
  - id: F4
    kind: situation
    status: assessed
    fact: The attorney cited general doubts about the outcome of litigation.
  - id: F5
    kind: situation
    status: confirmed
    fact: The NSA would make no recommendation about an exact compromise figure.
  - id: F6
    kind: situation
    status: assessed
    fact: The government faced uncertainty about prevailing in court.
  - id: F7
    kind: situation
    status: assessed
    fact: A trial could require the government to reveal cryptographic secrets.
  considerations:
  - id: C1
    facts:
    - F3
    - F2
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Counsel assessed that the Navy had likely infringed some patents and recommended settlement, giving the government
      reason to take the plaintiffs’ claims seriously rather than rely on continued litigation.
  - id: C2
    facts:
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: General doubts about litigation outcomes and uncertainty about prevailing in court made continued litigation an uncertain
      way to resolve the claims.
  - id: C3
    facts:
    - F7
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: A trial could require disclosure of cryptographic secrets, creating a national-security risk that settlement could
      avoid.
  reasoning:
    read: 'The government faced both a patent claim counsel considered likely to have merit and uncertainty about what litigation
      would produce. The trap is to treat continuing to litigate as a risk-free way to avoid settlement: a trial could also
      expose cryptographic secrets.'
    weighing: Counsel’s assessment of likely infringement and the general uncertainty of litigation supported settlement {C1}
      {C2}; the possibility of disclosure at trial added a distinct security reason to settle {C3}. Those considerations outweighed
      continuing to seek a court outcome. The source does not identify a precise valuation or say that the NSA supplied one.
    tradecraft: Record the legal assessment, the uncertainty of trial, and the disclosure risk as separate grounds for the
      decision. Keep the settlement amount distinct from the reasons supporting settlement; the source does not provide a
      valuation method.
    uncertainty: The outcome of litigation was uncertain, and trial disclosure was described as a possibility rather than
      a certainty. The source gives no probability of prevailing or quantified assessment of the disclosure risk.
    handoff: The attorney’s recommendation was directed to the Army JAG, while the NSA declined to recommend an exact compromise
      figure. The government made the settlement choice; the source does not specify a further approval chain.
    tempting_wrong:
      option: O2
      pull: Continuing could preserve the chance to defeat the claim and avoid a compromise payment.
      why_wrong: That course would leave the government exposed to an uncertain court outcome despite counsel’s assessment
        of likely infringement, and could require disclosure of cryptographic secrets.
    rejected:
      O2: The government did not continue litigation because uncertainty about prevailing and the possibility of disclosing
        cryptographic secrets favored settlement.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The government had a materially stronger basis to expect to prevail and could proceed without a meaningful risk
        of revealing cryptographic secrets.
      then: O2
      why: Those changed conditions would weaken the source’s two central reasons for settling and could make continued litigation
        preferable.
    would_not_change:
    - id: noflip1
      if: The NSA still declined to recommend an exact compromise figure.
      why: That limitation did not prevent the government from choosing a settlement amount and settling; it does not by itself
        remove the reasons favoring settlement.
    watch_for:
    - id: watch1
      what: A materially changed assessment of whether the Navy likely infringed the patents.
      favors:
      - O2
      - O1
      why: A stronger or weaker merits assessment could alter the litigation risk that counsel identified.
  lesson: When counsel assesses likely infringement and the outcome of litigation is uncertain, settlement may be justified
    even without a recommended compromise figure. A separate risk that trial could disclose sensitive information can weigh
    strongly against litigating.
  limits: This reasoning applies to the described balance of patent-litigation uncertainty and possible disclosure of cryptographic
    secrets. It does not establish that settlement is always preferable, or determine the proper amount of a settlement.
  library:
    domain: intel-oversight
    family: CORPUS-NX-b890401c
    source: https://media.defense.gov/2023/Dec/14/2003358992/-1/-1/0/CQ2023-02.PDF
