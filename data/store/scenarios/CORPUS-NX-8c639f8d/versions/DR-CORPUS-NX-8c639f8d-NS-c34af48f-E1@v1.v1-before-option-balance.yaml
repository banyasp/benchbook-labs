case:
  id: DR-CORPUS-NX-8c639f8d-NS-c34af48f-E1@v1
  title: Coordinating National Estimates
  status: draft
  setting: U.S. intelligence organizations, after the absence of a pre-attack estimate on Korea came to attention
  decider: The Director of Central Intelligence
  agent: The Director of Central Intelligence
  agent_role: decide
  situation: The decision point arose after the absence of a pre-attack intelligence estimate on Korea came to attention.
    Despite the lessons of Pearl Harbor, no unit existed to produce an analytic effort reflecting the coordinated views of
    all U.S. intelligence organizations. The Director of Central Intelligence reacted first with amazement and then with anger.
    The institutional question was how to organize oversight and coordination of national estimates.
  question: What should the Director of Central Intelligence do about establishing an estimates board to oversee the national
    estimates process?
  options:
    O1:
      do: The Director of Central Intelligence rejects creation of a Board of National Estimates and leaves the estimates
        structure unchanged.
      move: act
      irreversible: false
    O2:
      do: The Director of Central Intelligence approves creation of a Board of National Estimates to oversee the estimates
        process.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: No pre-attack intelligence estimate on Korea existed.
  - id: F2
    kind: capability
    status: confirmed
    fact: No unit existed to produce a coordinated analytic effort.
  - id: F3
    kind: situation
    status: confirmed
    fact: The coordinated analytic effort was to reflect the views of all U.S. intelligence organizations.
  - id: F4
    kind: situation
    status: confirmed
    fact: The lessons of Pearl Harbor were part of the context for the absence of a coordinated pre-attack estimate.
  - id: F5
    kind: situation
    status: assessed
    fact: The Director of Central Intelligence expressed amazement at the absence of a pre-attack estimate on Korea.
  - id: F6
    kind: situation
    status: assessed
    fact: The Director of Central Intelligence expressed anger at the absence of a pre-attack estimate on Korea.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: No unit existed to produce an analytic effort reflecting the coordinated views of all U.S. intelligence organizations.
      Creating a board to oversee estimates directly addresses that institutional gap.
  - id: C2
    facts:
    - F1
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The absence of a pre-attack estimate on Korea persisted despite the lessons of Pearl Harbor. The source presents
      that failure as the context for establishing oversight of the estimates process.
  - id: C3
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The Director of Central Intelligence's amazement and anger underscore the seriousness attached to the missing estimate,
      though the source's structural reason for the board is the lack of coordinated analytic capacity.
  reasoning:
    read: 'This is a structural coordination gap, not merely a missing report: no unit existed to bring together the views
      of all U.S. intelligence organizations. The trap is to treat the failure as an isolated omission and leave the estimates
      structure unchanged.'
    weighing: The decisive consideration is that no unit could produce the coordinated analytic effort sought {C1}. The absence
      of an estimate despite the lessons of Pearl Harbor adds weight to establishing oversight {C2}; the Director's reaction
      reinforces the seriousness but is not itself the structural rationale {C3}. The balance depends on the continuing need
      to coordinate all organizations' views.
    tradecraft: Establish the Board of National Estimates to oversee the estimates process, and make the coordination of all
      U.S. intelligence organizations' views an explicit purpose. Record the institutional gap and that purpose as the rationale
      for the decision.
    uncertainty: The source gives the reason for creating the board but does not establish how effectively it would secure
      coordination or prevent future omissions.
    handoff: The source places the plan with the Director of Central Intelligence and identifies no need for referral to a
      higher authority. The decision is institutional; the board's oversight should address the stated need to coordinate
      organizational views.
    tempting_wrong:
      option: O1
      pull: Rejecting a new board would avoid changing the existing structure.
      why_wrong: Leaving the structure unchanged would leave unaddressed the stated absence of any unit capable of producing
        an effort that reflected all organizations' coordinated views.
    rejected:
      O1: The Director of Central Intelligence did not leave the estimates structure unchanged; the stated plan was to establish
        a Board of National Estimates to oversee the process.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A capable unit already existed to produce an analytic effort reflecting the coordinated views of all U.S. intelligence
        organizations.
      then: O1
      why: If the stated coordination gap were absent, the source's central reason for creating an oversight board would be
        substantially reduced.
    would_not_change:
    - id: noflip1
      if: The Director of Central Intelligence had not expressed amazement or anger, but no unit still existed to produce
        the coordinated analytic effort.
      why: The structural absence of coordination, rather than the Director's emotional reaction, is the principal reason
        supporting the board.
    watch_for:
    - id: watch1
      what: Whether the board's oversight actually encompasses the coordinated views of all U.S. intelligence organizations.
      favors:
      - O2
      why: That is the capability the source identifies as missing and the institutional purpose the proposed board is meant
        to serve.
  lesson: When a serious analytic omission reflects the absence of any unit responsible for coordination, address the structural
    gap rather than simply preserving the existing arrangement. Oversight should be organized around the specific coordination
    failure that came to light.
  limits: This reasoning supports creating oversight in response to the stated absence of coordinated estimates; it does not
    establish that a board will be effective in every setting. The source provides no assessment of the board's later performance.
  library:
    domain: intel-analysis
    family: CORPUS-NX-8c639f8d
