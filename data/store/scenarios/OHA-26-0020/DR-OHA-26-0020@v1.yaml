case:
  id: DR-OHA-26-0020@v1
  title: Guideline F Financial Considerations Clearance Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 24, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual sought an access authorization from the Department of Energy. The Local Security Office raised
    substantial doubt under Guideline F, citing failure to file federal and state tax returns for 2018‑2023 and delinquency
    on a $30,000 SBA loan. The Individual testified that personal and business hardships caused the tax filing failures and
    that he later filed the overdue returns and made limited payments on the loan. The Administrative Judge must determine
    whether the Individual has resolved the financial security concerns sufficiently to grant the access authorization.
  question: What should the Administrative Judge do regarding the Individual's access authorization?
  options:
    O1:
      do: The Administrative Judge asks the Individual for additional financial evidence.
      move: ask
      irreversible: false
    O2:
      do: The Administrative Judge holds the decision pending further financial documentation.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual's access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge grants the Individual's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual failed to file federal and state personal income tax returns for tax years 2018 through 2023.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was delinquent on a $30,000 Small Business Administration loan.
  - id: F3
    kind: authority
    status: confirmed
    fact: On October 18, 2025, the Local Security Office issued a Notification Letter stating substantial doubt about the
      Individual's eligibility under Guideline F.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Individual testified that the tax filing failures were caused by the unexpected departure of his business partner,
      lack of tax expertise, family responsibilities, and a friend's death.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual filed the delinquent federal and state tax returns between December 2025 and February 2026 with a
      tax professional.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual made two monthly SBA loan payments in November and December 2025 and a $200 payment in May 2026,
      but has no formal repayment agreement in place.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual attempted to dissolve his business to satisfy SBA collection requirements, but the dissolution was
      improper and remains pending.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The Individual failed to file federal and state tax returns for six consecutive years and only filed them shortly
      before the hearing, indicating a pattern of non‑compliance that the Judge found unlikely to be a one‑time lapse.
  - id: C2
    facts:
    - F2
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The SBA loan remains delinquent; the Individual has made only sporadic payments, lacks a formal repayment agreement,
      and his attempts to dissolve the business were improper, showing no good‑faith effort to resolve the debt.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The Judge applied Guideline F and found that none of the mitigating conditions (¶20(a)‑(g)) were satisfied, as expressly
      stated in the decision.
  - id: C4
    facts: []
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulatory precedent imposes a presumption against granting a clearance when substantial doubt exists, and the Judge
      followed that statutory standard.
  reasoning:
    read: The case centers on whether repeated financial irresponsibility—six years of unfiled tax returns and a delinquent
      SBA loan—has been sufficiently remedied to satisfy Guideline F. The trap is to let personal hardship excuse a pattern
      of non‑compliance that threatens reliability and trustworthiness.
    weighing: Considering {C1} and {C2}, the Judge concluded the behavior is not isolated and likely to recur. {C3} confirms
      that none of the statutory mitigating factors apply, and {C4} reinforces the legal presumption against clearance. The
      balance therefore tips decisively toward denial.
    tradecraft: The decision is recorded in a written Administrative Judge Decision, signed by James P. Thompson III, and
      filed with the Office of Hearings and Appeals as required by 10 C.F.R. § 710.28.
    uncertainty: The factual record is clear; uncertainty is minimal.
    handoff: The Administrative Judge acted alone, as authorized by the regulations.
    tempting_wrong:
      option: O4
      pull: The Individual recently filed overdue tax returns and made a few loan payments, which might suggest improvement.
      why_wrong: The Judge found the timing of those actions coincided with the Notification Letter and did not demonstrate
        a sustained, reliable change in behavior.
    rejected:
      O1: The Judge did not request additional evidence because the existing record already demonstrated unresolved security
        concerns.
      O2: Holding the decision pending was unnecessary; the evidence was sufficient to reach a final determination.
      O4: Granting the clearance would conflict with Guideline F, as none of the mitigating conditions were met.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had a documented good‑faith repayment arrangement with the SBA (mitigating condition ¶20(d) satisfied).
      then: O4
      why: A valid repayment plan would satisfy one of the key mitigating factors under Guideline F.
    would_not_change:
    - id: noflip1
      if: The Individual had filed his tax returns earlier but the SBA loan remained delinquent without a repayment plan.
      why: Even with timely tax filings, the unresolved loan issue still fails to meet mitigating condition ¶20(d) or ¶20(e).
    watch_for:
    - id: watch1
      what: Consistent future tax compliance and a formal, ongoing repayment schedule for the SBA loan.
      favors:
      - O4
      why: Demonstrated sustained financial responsibility would satisfy multiple mitigating conditions under Guideline F.
  lesson: Under DOE Guideline F, repeated financial delinquencies are not mitigated by personal hardship unless the individual
    can show a credible, ongoing good‑faith effort to resolve the debts and prevent recurrence. The presumption against clearance
    remains strong when mitigating conditions are absent.
  limits: This analysis applies only to DOE personnel‑security determinations under 10 C.F.R. Part 710 and the specific Adjudicative
    Guidelines cited; it does not extend to other agencies or to non‑security‑related financial assessments.
  library:
    domain: personnel security adjudication
    family: OHA-26-0020
    source: https://www.energy.gov/sites/default/files/2026-06/PSH-26-0020.pdf
