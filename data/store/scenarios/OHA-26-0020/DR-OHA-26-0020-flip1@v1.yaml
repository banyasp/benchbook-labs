case:
  id: DR-OHA-26-0020-flip1@v1
  title: Guideline F Financial Considerations Clearance Decision [flip]
  status: needs_review
  setting: Department of Energy Office of Personnel Security, July 2, 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: An individual applied for a DOE access authorization. The Local Security Office issued a Notification Letter
    invoking Guideline F because the applicant had not filed personal federal and state tax returns for the years 2018-2023
    and was behind on a $30,000 Small Business Administration loan. The applicant explained that loss of a business partner,
    limited tax knowledge, family duties, and a personal bereavement caused the filing lapses, and that he subsequently filed
    the overdue returns and honored a written repayment schedule with the SBA. The Judge must decide whether these remedial
    actions remove the security concerns enough to grant the authorization.
  question: What action should the Administrative Law Judge take regarding the applicant's access authorization?
  options:
    O1:
      do: Request supplemental financial documentation from the applicant promptly for review.
      move: ask
      irreversible: false
    O2:
      do: Hold the decision pending additional proof of financial responsibility.
      move: hold
      irreversible: false
    O3:
      do: Deny the applicant's access authorization because financial concerns remain unresolved.
      move: act
      irreversible: true
    O4:
      do: Grant the applicant's access authorization because mitigating conditions are met.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The applicant did not submit federal or state personal income tax returns for the six-year period from 2018 through
      2023.
  - id: F2
    kind: situation
    status: confirmed
    fact: The applicant was delinquent on a $30,000 Small Business Administration loan.
  - id: F3
    kind: authority
    status: confirmed
    fact: On 18 October 2025, the Local Security Office sent a Notification Letter expressing substantial doubt about the
      applicant's eligibility under Guideline F.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The applicant testified that the tax-filing failures resulted from the sudden loss of his business partner, a lack
      of tax expertise, extensive family obligations, and the death of a close friend.
  - id: F5
    kind: capability
    status: confirmed
    fact: Between December 2025 and February 2026, the applicant filed all overdue federal and state tax returns with the
      assistance of a tax professional.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual and the SBA executed a written repayment schedule, under which he made two monthly payments in November
      and December 2025 and a $200 payment in May 2026, following the agreed terms.
  - id: F7
    kind: situation
    status: confirmed
    fact: The applicant attempted to dissolve his business to satisfy SBA collection requirements, but the dissolution process
      was improper and remains unresolved.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The applicant has now filed all delinquent returns, demonstrating corrective action and mitigating the earlier pattern
      of non-compliance.
  - id: C2
    facts:
    - F2
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: A written repayment schedule was executed and payments were made in accordance with that schedule, showing good-faith
      effort despite the pending business-dissolution issue.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: Guideline F's mitigating condition ¶20(d) is satisfied by the formal SBA repayment arrangement, so the statutory
      basis for denial no longer applies.
  - id: C4
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: Regulatory precedent allows a clearance when a mitigating condition under Guideline F is met, overriding the default
      presumption against granting access.
  reasoning:
    read: The core issue is whether the applicant's recent compliance—filing all overdue tax returns and honoring a written
      SBA repayment plan—satisfies Guideline F's mitigating requirements and removes the security concerns raised by the Local
      Security Office.
    weighing: Because {C1} confirms that the tax-filing problem has been remedied, {C2} shows a bona-fide repayment arrangement,
      and {C3} identifies that mitigating condition ¶20(d) is now satisfied, the legal presumption against clearance is displaced,
      as explained in {C4}. The balance therefore supports granting the authorization.
    tradecraft: The decision is entered in a written Administrative Law Judge Decision, signed by Maria L. Ortiz, and filed
      with the Office of Personnel Security per 10 C.F.R. § 710.28.
    uncertainty: The factual record is well-documented; uncertainty is minimal.
    handoff: The Administrative Law Judge acted independently, as authorized by the applicable regulations.
    tempting_wrong:
      option: O3
      pull: The applicant's earlier six-year lapse in tax filing and loan delinquency suggest a pattern of financial irresponsibility.
      why_wrong: The recent corrective actions satisfy a statutory mitigating factor, making denial inconsistent with Guideline
        F.
    rejected:
      O1: Additional evidence is unnecessary because the existing record already demonstrates compliance with the mitigating
        condition.
      O2: A hold is unwarranted; the applicant has provided sufficient proof of remediation to reach a final determination.
      O3: Denial would conflict with the statutory requirement that a satisfied mitigating condition removes the presumption
        against clearance.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the applicant had failed to establish a written repayment schedule and had made only irregular, unscheduled payments
        to the SBA,
      then: O3
      why: Without a formal repayment arrangement, mitigating condition ¶20(d) would not be met, and the presumption against
        clearance would remain.
    would_not_change:
    - id: noflip1
      if: If the applicant had filed his tax returns promptly but the SBA loan remained delinquent without any repayment plan,
      why: Even with timely tax compliance, the unresolved loan issue would still prevent satisfaction of mitigating condition
        ¶20(d) or ¶20(e).
    watch_for:
    - id: watch1
      what: Sustained tax compliance in future years and continued adherence to the SBA repayment schedule.
      favors:
      - O4
      why: Ongoing financial responsibility would reinforce the mitigating factors under Guideline F.
  lesson: When an applicant demonstrates a documented, good-faith repayment arrangement and timely filing of overdue tax returns,
    Guideline F's mitigating conditions can be satisfied, allowing a clearance despite prior financial delinquencies. The
    presumption against granting access is overcome when statutory mitigation is proven.
  limits: This analysis is limited to DOE personnel-security adjudications governed by 10 C.F.R. Part 710 and the specific
    Adjudicative Guidelines referenced; it does not extend to other federal agencies or to non-security financial evaluations.
