case:
  id: DR-CORPUS-NX-d8dd3850-E3@v1
  title: Framing the Strain on SOF and Families
  status: draft
  setting: USSOCOM, after its 2011 recognition of pressure on the Force and family.
  decider: USSOCOM commanders
  agent: USSOCOM commanders
  agent_role: decide
  situation: USSOCOM is an enterprise that prides itself on its ability to kinetically degrade terrorist networks. Moral injury
    affects both SOF personnel and their families, and USSOCOM has known about the effects of its culture on both for close
    to a decade. In 2011, USSOCOM recognized pressure on the Force and family. Its commanders face a choice about whether
    to frame the institutional response around confronting that pressure or preserving SOF and their families so they can
    remain in the fight. The former framing was meant to break the cycle straining the Force, while the latter sought to keep
    SOF and their families in the fight with fewer negative side effects.
  question: 'What should USSOCOM commanders do about framing the response to strain on the Force and families: reject preservation
    and adopt a pressure-focused framing, or adopt preservation and reject the pressure-focused framing?'
  options:
    O1:
      do: USSOCOM commanders adopt the preservation framing and reject the pressure-on-the-Force-and-family framing, keeping
        SOF and their families in the fight.
      move: act
      irreversible: false
    O2:
      do: USSOCOM commanders reject the preservation framing and adopt a pressure-on-the-Force-and-family framing that confronts
        the cycle straining personnel and families.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The SOF enterprise prides itself on its ability to kinetically degrade terrorist networks.
  - id: F2
    kind: situation
    status: confirmed
    fact: Moral injury affects both SOF personnel and their families.
  - id: F3
    kind: situation
    status: confirmed
    fact: USSOCOM has known about the effects of its culture on personnel and families for close to a decade.
  - id: F4
    kind: situation
    status: confirmed
    fact: In 2011, USSOCOM recognized pressure on the Force and family.
  - id: F5
    kind: situation
    status: assessed
    fact: The pressure framing was intended to break the cycle straining the Force.
  - id: F6
    kind: situation
    status: assessed
    fact: The preservation framing sought to keep SOF and their families in the fight with fewer negative side effects.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The preservation framing was intended to keep SOF personnel and their families in the fight with fewer negative side
      effects, addressing the stated concern that moral injury affects both.
  - id: C2
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The earlier pressure-focused framing was meant to break the cycle straining the Force, rather than simply preserve
      the ability to continue the fight.
  - id: C3
    facts:
    - F2
    - F3
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The organizational contribution to moral injury and ethical drift must be considered; focusing only on individual
      unit leadership and ethics cannot fix an enterprise-wide problem.
  - id: C4
    facts:
    - F1
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The enterprise's counterterrorism approach and its way of employing SOF are connected to moral injury, and leaders
      are called on to reimagine that employment.
  reasoning:
    read: The choice is between confronting strain as an institutional problem and preserving SOF and their families so they
      can remain in the fight. The trap is treating an aim of fewer negative side effects as proof that the underlying cycle
      or organizational contribution to moral injury has been addressed.
    weighing: O1's stated rationale is to keep SOF and their families in the fight with fewer negative side effects {C1}.
      The pressure framing was meant to break the cycle straining the Force {C2}, and senior leaders have a moral obligation
      to examine the organization's role in moral injury and ethical drift {C3}. Subsequent commanders adopted preservation,
      while the broader analysis criticizes that framing and calls for reimagining how the Force is employed {C4}. The balance
      therefore depends on distinguishing the recorded outcome and its stated aim from the critical assessment of the institutional
      approach.
    tradecraft: Record the selected framing, its stated purpose, and the competing concern that preservation may leave the
      straining cycle intact. Assign senior-level review of the organization's contribution to moral injury rather than treating
      this as solely an individual or unit-level ethics issue.
    uncertainty: The passage identifies the intended purpose of the preservation framing but does not establish that it reduced
      negative side effects or broke the cycle. It also does not provide measures for judging whether either framing achieved
      its stated aim.
    handoff: Keep the decision with USSOCOM commanders, while involving senior three- and four-star leadership in examining
      the organizational contribution to moral injury and ethical drift; unit leadership and individual ethics alone cannot
      address the enterprise-wide problem.
    tempting_wrong:
      option: O2
      pull: The pressure framing was intended to break the cycle straining the Force, and the institutional analysis criticizes
        preservation as potentially part of the problem.
      why_wrong: The recorded outcome was the subsequent commanders' adoption of preservation to keep SOF and families in
        the fight with fewer negative side effects; the passage does not establish that adopting the pressure framing itself
        would resolve the organizational problem.
    rejected:
      O2: The pressure-focused framing aimed to break the cycle, but the specified outcome is the later commanders' adoption
        of preservation to keep SOF and their families in the fight with fewer negative side effects.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The decision's governing aim were instead to break the cycle straining the Force, rather than keep SOF and families
        in the fight with fewer negative side effects.
      then: O2
      why: That aim matches the stated purpose of the pressure-focused framing.
    would_not_change:
    - id: noflip1
      if: The enterprise continued to pride itself on kinetically degrading terrorist networks.
      why: That fact alone does not establish whether preservation reduces strain or whether a pressure-focused framing would
        break the cycle.
    watch_for:
    - id: watch1
      what: Evidence that the organization's approach contributes to enterprise-wide moral injury or ethical drift.
      favors:
      - O2
      why: Senior leaders must consider organizational contributions instead of focusing solely on individuals who cross the
        line.
  lesson: A preservation strategy's intended reduction of negative side effects is not the same as breaking the cycle that
    strains personnel and families. Leaders should assess the institution's contribution to moral injury, not place the entire
    burden on individuals or unit-level ethics.
  limits: The passage gives the stated aim of the preservation framing but does not show whether it achieved that aim or establish
    that the pressure framing would have done better. This scenario does not resolve broader questions about USSOCOM's force
    employment beyond the institutional framing choice.
