case:
  id: DR-CORPUS-NX-438a330c-E8@v1
  title: Reconsidering PRU Adviser Restrictions
  status: draft
  setting: Tay Ninh, 1969–1970, MACV and the PRU
  decider: The MACV authority handling the request
  agent: The MACV authority handling the request
  agent_role: decide
  situation: A formal request to reconsider MACV restrictions on U.S. personnel assigned to the PRUs is before the authority
    responsible for handling it. The restrictions changed the U.S. personnel’s status from commander to adviser and barred
    Americans from accompanying PRU teams in the field. The restrictions arose amid concerns about perceived abuses in the
    Phoenix program, allegations affecting U.S. support for the war, and the possibility of U.S. personnel becoming involved
    in conduct that could violate the UCMJ. The requesting adviser reports that the PRU relied on American personnel for support
    from U.S. units. The adviser also reports that the restrictions damaged morale and effectiveness and made PRU members
    reluctant to undertake assignments without confidence in emergency support.
  question: What should the MACV authority handling the request do about the request to reconsider the PRU restrictions?
  options:
    O1:
      do: The MACV authority handling the request grants the request and rescinds the adviser-only status and field-accompaniment
        restriction.
      move: act
      irreversible: false
    O2:
      do: The MACV authority handling the request denies the request and maintains the adviser-only status and field-accompaniment
        restriction.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Before November 1969, command of the PRUs rested with assigned U.S. military officers and senior noncommissioned
      officers.
  - id: F2
    kind: authority
    status: confirmed
    fact: After November 1969, an order changed the status of U.S. military personnel assigned to the PRUs from commander
      to adviser and barred Americans from accompanying PRU teams in the field.
  - id: F3
    kind: situation
    status: assessed
    fact: The restrictions addressed concerns about perceived abuses in the Phoenix program and the effect of abuse allegations
      on support for the war in the United States.
  - id: F4
    kind: authority
    status: assessed
    fact: The stated concern behind barring U.S. personnel from field operations was that they might become involved in actions
      that could be construed as UCMJ violations.
  - id: F5
    kind: situation
    status: confirmed
    fact: The adviser formally requested reconsideration of the restrictions.
  - id: F6
    kind: capability
    status: assessed
    fact: The adviser reported that the Tay Ninh PRU relied heavily on accompanying Americans for support from U.S. units.
  - id: F7
    kind: capability
    status: assessed
    fact: The adviser reported that the restrictions harmed morale and effectiveness and made PRU members reluctant to undertake
      assignments without confidence in emergency support.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: complicity_risk
    favors:
    - O2
    weight: strong
    why: The field ban was intended to reduce the risk that U.S. personnel would become involved in conduct that could be
      construed as violating the UCMJ.
  - id: C2
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The restrictions arose from concerns about perceived abuses and the effect of abuse allegations on U.S. support for
      the war.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The adviser reported that the PRU relied on American support and that the restrictions harmed morale and effectiveness,
      making members reluctant to undertake assignments without confidence in emergency support.
  - id: C4
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The reported lack of confidence in emergency support also raises a welfare concern for PRU members asked to undertake
      assignments.
  reasoning:
    read: This is a request to revisit restrictions adopted amid abuse concerns, domestic support concerns, and possible UCMJ
      exposure—not simply a choice between American accompaniment and PRU effectiveness. The source records that the request
      was denied, but does not give the authority's specific explanation for denying it or describe how it assessed the reported
      operational costs.
    weighing: 'The stated reasons for the restrictions favor maintaining them: reducing the risk of U.S. involvement in potentially
      unlawful conduct and addressing concerns about perceived abuses and support for the war. The adviser offered countervailing
      reports about morale, effectiveness, and confidence in emergency support. Those reports identify real costs, but the
      source records no finding that the abuse or UCMJ concerns had been resolved; it records denial of reconsideration.'
    tradecraft: State separately the grounds for the restrictions and the adviser's reported operational harms. Record what
      evidence supports each, the authority responsible for the decision, and why the request is granted or denied; do not
      present the source's unstated rationale for denial as fact.
    uncertainty: The source does not establish the extent of the reported operational harms beyond the adviser's account,
      nor does it explain the request-denial rationale. It also does not say whether alternative support arrangements were
      considered.
    handoff: The MACV authority handling the request makes the decision. As a decision-practice safeguard, that authority
      should obtain appropriate legal and policy input on the UCMJ concern and document how the reported operational effects
      were considered.
    tempting_wrong:
      option: O1
      pull: Granting the request would respond to the adviser's reports that the restrictions damaged morale and effectiveness
        and reduced confidence in emergency support.
      why_wrong: 'The source records those reports but also gives a stated reason for the field ban: avoiding possible UCMJ
        violations amid concerns about perceived abuses. It does not establish that those concerns had been resolved.'
    rejected:
      O1: The request was denied, and the source's stated concerns about possible UCMJ violations and perceived abuses were
        not reported as resolved.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence established that safeguards addressed the risk of U.S. personnel becoming involved in potentially
        unlawful conduct and that the abuse-related support concerns no longer applied, while the reported operational harms
        remained.
      then: O1
      why: With the stated grounds for the restrictions materially addressed, the reported effects on morale, effectiveness,
        and emergency support could justify reconsideration.
    would_not_change:
    - id: noflip1
      if: The request is supported only by the same reports of reduced morale and effectiveness, without evidence addressing
        the abuse and UCMJ concerns.
      why: Those reports identify costs but do not, by themselves, resolve the stated reasons for the restrictions.
    watch_for:
    - id: watch1
      what: Evidence bearing on whether U.S. involvement could create UCMJ exposure or whether abuse allegations continue
        to affect U.S. support for the war.
      favors:
      - O2
      why: These matters are among the stated grounds for the restrictions.
    - id: watch2
      what: Evidence substantiating the reported effects on PRU morale, effectiveness, and confidence in emergency support.
      favors:
      - O1
      why: Such evidence would clarify the costs the adviser cited in seeking reconsideration.
  lesson: When restrictions address possible unlawful involvement and serious institutional concerns, operational costs are
    relevant but do not by themselves show that the safeguards should be removed. Reconsideration should turn on whether the
    underlying concerns remain and how well-supported the reported costs are.
  limits: The source records the denial and the original reasons for the restrictions, but not the authority's specific reasoning
    in denying this request. This scenario does not establish the legal merits of any particular PRU operation or the extent
    of the adviser's reported operational effects.
