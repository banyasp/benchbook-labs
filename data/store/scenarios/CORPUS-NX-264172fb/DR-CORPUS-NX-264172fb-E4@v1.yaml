      status quo. The passage gives the blockade, intelligence about a planned attack, failed diplomacy, and anticipated U.S.
      reaction as relevant reasons. Exclude the operational targeting package and details of intelligence activity.
    cues:
      option_words:
        O1: 9
        O2: 8
        O3: 8
      real_option: O2
      real_to_mean_other_length: 0.94
      real_is_longest: false
      moves:
        O1: hold
        O2: act
        O3: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
        O3: true
    equities: pilot2
