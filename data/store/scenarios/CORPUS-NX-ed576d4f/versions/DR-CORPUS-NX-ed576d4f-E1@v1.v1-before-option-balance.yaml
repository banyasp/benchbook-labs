case:
  id: DR-CORPUS-NX-ed576d4f-E1@v1
  title: Policy Recommendation After the Pan Am 103 Investigation
  status: draft
  setting: At the end of the Gulf War, March 1991; Department of Justice briefing to the National Security Council.
  decider: The Attorney General
  agent: The Attorney General
  agent_role: advise
  situation: The Attorney General is briefing the National Security Council on the Department of Justice’s findings after
    an extensive investigation into the bombing of Pan Am 103. The bombing killed 259 crew members and passengers, including
    190 Americans, as well as 11 people on the ground. Libya is being pressed to surrender two intelligence-service officers
    for trial. Criminal proceedings and sanctions are among the possible responses under consideration. The Attorney General
    must make a policy recommendation about whether to advocate military action or rely on proceedings and sanctions.
  question: What should the Attorney General recommend to the National Security Council about pressuring Libya to surrender
    the two intelligence-service officers?
  options:
    O1:
      do: The Attorney General opposes military action and advocates criminal proceedings and sanctions to secure Libya's
        surrender of the two intelligence-service officers.
      move: act
      irreversible: false
    O2:
      do: The Attorney General advocates military action against Libya to pressure it to surrender the two intelligence-service
        officers.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The bombing of Pan Am 103 killed 259 crew members and passengers.
  - id: F2
    kind: situation
    status: confirmed
    fact: Among those killed were 190 Americans.
  - id: F3
    kind: situation
    status: confirmed
    fact: Eleven people on the ground were killed.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Department of Justice had conducted an extensive investigation.
  - id: F5
    kind: situation
    status: confirmed
    fact: In March 1991, at the end of the Gulf War, the Attorney General briefed the National Security Council on the Department
      of Justice's findings.
  - id: F6
    kind: situation
    status: confirmed
    fact: The policy issue concerned securing Libya's surrender of two intelligence-service officers for trial.
  - id: F7
    kind: situation
    status: assessed
    fact: Criminal proceedings and sanctions were under consideration as responses to the failure to surrender the officers.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Attorney General argued that a criminal proceeding should not be the endgame in pursuing Libya's surrender of
      the two officers.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: He judged sanctions not to be the way to force Libya to surrender the officers.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: His stated minimum recommendation was military action against the JSO headquarters, indicating that he favored pressure
      beyond proceedings and sanctions.
  reasoning:
    read: 'The policy objective was securing Libya''s surrender of two intelligence-service officers for trial. The distinction
      is between rejecting proceedings as the endgame and rejecting prosecution altogether: the Attorney General argued that
      proceedings should not be the endgame, and that sanctions would not compel surrender.'
    weighing: The Attorney General's stated assessment was that criminal proceedings alone were insufficient as an endgame
      and sanctions were not an effective means of pressure {C1} {C2}. He therefore advocated military action, naming it as
      the minimum response {C3}. The balance depends on accepting his assessment that proceedings and sanctions would not
      secure surrender; the passage gives no further rationale for that assessment.
    tradecraft: Present the recommendation as advice to the National Security Council, distinguish the Attorney General's
      advocacy from an adopted administration decision, and record the stated basis without supplying unreported legal or
      operational analysis.
    uncertainty: The passage does not explain why the Attorney General considered proceedings insufficient or sanctions ineffective,
      assess the legality or consequences of military action, or say whether the administration adopted his recommendation.
    handoff: The Attorney General was briefing the National Security Council and should present this as a policy recommendation
      for its consideration; the passage does not describe a further approval process.
    tempting_wrong:
      option: O1
      pull: Proceedings and sanctions are the nonmilitary responses identified in the decision frame.
      why_wrong: The Attorney General expressly argued that a criminal proceeding should not be the endgame and that sanctions
        were not the way to force surrender.
    rejected:
      O1: He rejected proceedings as the endgame and sanctions as the means to compel Libya's surrender, and instead advocated
        military action.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable assessment showed that proceedings and sanctions could secure surrender without military action.
      then: O1
      why: That would remove the stated grounds for treating those measures as inadequate pressure.
    - id: flip2
      if: A binding legal determination established that the recommended military action was not lawfully available.
      then: O1
      why: A recommendation to take unavailable action could not be maintained; nonmilitary measures would remain for consideration.
    would_not_change:
    - id: noflip1
      if: The investigation's findings continued to support seeking a criminal trial.
      why: The Attorney General's objection was to making criminal proceedings the endgame, not to trial as an objective.
    watch_for:
    - id: watch1
      what: Whether legal review establishes authority for military action and whether its foreseeable consequences are acceptable.
      favors:
      - O1
      why: The legal authority and foreseeable consequences remain unresolved, and either could affect whether military action
        is appropriate.
  lesson: When an official judges that proceedings and sanctions will not achieve the stated objective, the recommendation
    may favor a different form of pressure. State that judgment and its limits precisely; do not turn an advisor's recommendation
    into an adopted decision or infer a legal basis the source does not provide.
  limits: This reasoning captures only the Attorney General's reported recommendation after the Pan Am 103 investigation.
    It does not establish the legality, proportionality, or likely effects of military action, nor whether the National Security
    Council or administration accepted the advice.
