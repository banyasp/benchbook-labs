case:
  id: DR-CORPUS-INC-NATIONAL-SECURITY-SERVICE-PROPOSAL-WITHI-NS-b4eef3c7-E41@v1
  title: FBI National-Security Structure and Oversight
  status: draft
  setting: Within the FBI, at the point of considering the proposed National Security Service and oversight arrangements.
  decider: Policymakers
  agent: Policymakers
  agent_role: decide
  situation: The FBI performs national-security work alongside criminal investigations. The proposal under consideration would
    place its counterterrorism, counterintelligence, and intelligence directorate functions in a National Security Service
    within the FBI, led by one Executive Assistant Director. The proposed service would be subject to DNI coordination and
    budget authorities and the Attorney General authorities that apply to other FBI divisions. The FBI's law-enforcement powers
    and relationships with state and local officials are considered relevant to its national-security work. Coordination between
    the Bureau's national-security and criminal components is also tied to accountability and civil-liberties concerns, with
    activities subject to Attorney General guidelines and Department of Justice and congressional oversight. The proposal
    includes safeguards against diverting service resources and links between the service and certain field offices; a separate
    agency devoted to internal security without law-enforcement powers is also an alternative under consideration.
  question: What should policymakers do about the structure and oversight of the FBI’s national-security work?
  options:
    O1:
      do: Policymakers should approve an FBI National Security Service under one Executive Assistant Director with DNI coordination
        and budget authority.
      move: act
      irreversible: false
    O2:
      do: Policymakers should create a separate agency for intelligence collection in the United States without law-enforcement
        powers.
      move: act
      irreversible: true
    O3:
      do: Policymakers should reject an FBI National Security Service and retain the Bureau’s existing national-security arrangement.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The proposed National Security Service would include the FBI’s Counterterrorism Division, Counterintelligence Division,
      and Directorate of Intelligence.
  - id: F2
    kind: authority
    status: assessed
    fact: The proposed service would be led by one Executive Assistant Director and subject to DNI coordination and budget
      authorities as well as the Attorney General authorities that apply to other FBI divisions.
  - id: F3
    kind: capability
    status: assessed
    fact: The FBI’s law-enforcement powers and routine contact with state and local officials are considered useful to its
      national-security mission.
  - id: F4
    kind: situation
    status: assessed
    fact: The proposed service would remain within the FBI, with shared hiring, information-technology infrastructure, support
      functions, and opportunities for agents to transfer between service and other Bureau divisions.
  - id: F5
    kind: authority
    status: confirmed
    fact: National Security Service activities would be governed by Attorney General guidelines for national-security investigations
      and foreign-intelligence collection, as well as Department of Justice and congressional oversight.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Coordination between the FBI’s national-security and criminal components is considered necessary for performance
      and for continued attention to civil liberties and legal limits on government power.
  - id: F7
    kind: authority
    status: assessed
    fact: The proposed service could approve and evaluate Special Agents in Charge of 15 field offices with an official foreign
      diplomatic presence and inspect FBI field-office work.
  - id: F8
    kind: authority
    status: assessed
    fact: Under the proposed safeguards, service resources could be reallocated or detailed to other divisions only temporarily
      and with the service head’s permission under procedures agreed upon by the DNI.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The FBI had previously fallen short of effecting necessary institution-wide reforms, and policymakers were urged
      to reconsider a separate domestic intelligence agency if that failure continued.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Combining the FBI's national-security divisions and intelligence directorate under one leader, with DNI coordination
      and budget authority plus links to field offices, creates a focal point for meeting intelligence requirements and holding
      the Bureau accountable.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Keeping the service inside the FBI preserves access to law-enforcement tools and state and local relationships useful
      to national-security work, while shared functions and transfers allow the Bureau's components to continue working together.
  - id: C3
    facts:
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Coordination between national-security and criminal components is considered important to performance and to attention
      to civil liberties and legal limits; Attorney General guidelines and DOJ and congressional oversight remain applicable.
  - id: C4
    facts:
    - F7
    - F8
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: Field-office evaluation and appointment links, together with limits on reallocating service resources, give the DNI
      and service leadership means to protect national-intelligence capacity and enforce accountability.
  - id: C5
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: 'The FBI''s past failure to complete institution-wide reform warrants caution: if the necessary transformation continues
      to fail, policymakers should reconsider whether a separate domestic intelligence agency is wiser.'
  reasoning:
    read: This is a choice about how to organize and oversee national-security work, not whether that work should be isolated
      from criminal investigation. The trap is assuming a separate agency without law-enforcement powers would inherently
      protect civil liberties; the proposal instead relies on integration, legal limits, and oversight while creating a clearer
      national-security chain of accountability.
    weighing: 'The case for {O1} is strongest because a unified service gives the DNI a direct coordination and budget role
      and creates a focal point for national-intelligence accountability {C1}, while retaining law-enforcement capabilities
      and useful local relationships {C2}. Continued coordination, Attorney General guidelines, and DOJ and congressional
      oversight are essential to protecting civil liberties {C3}. Field-office oversight and resource controls reinforce the
      proposal {C4}. The main qualification is the FBI''s record of incomplete reform: that concern calls for sustained oversight
      and a future reassessment if reform continues to fail, but does not displace the present recommendation {C5}.'
    tradecraft: Set out the service's responsibilities, DNI coordination and budget authorities, and the Attorney General
      authorities that continue to apply. Put the proposed limits on resource reallocations and field-office accountability
      arrangements into effect, and track whether the FBI makes the institutional changes the recommendation depends on.
    uncertainty: The recommendation depends on the FBI actually making institution-wide cultural and organizational changes;
      past shortfalls make that outcome uncertain. Continued failure to reform is a reason to reassess the separate-agency
      alternative, not proof that the alternative should be adopted now.
    handoff: Policymakers should make the structural decision with the DNI and Attorney General or DOJ involved on their respective
      coordination, budget, and legal-oversight roles; congressional oversight remains relevant to the service's activities.
      Sustained outside coordination and oversight are also needed.
    tempting_wrong:
      option: O2
      pull: A separate agency may appear to insulate intelligence work from criminal-investigation priorities and avoid the
        difficulties of reforming the FBI.
      why_wrong: Separation would discard the useful combination of intelligence work, law-enforcement powers, and local relationships.
        If coordination and legal safeguards are maintained, separating personnel offers no civil-liberties benefit; a separate
        agency is an alternative to revisit if FBI reform continues to fail.
    rejected:
      O2: A separate agency would discard the useful combination of intelligence work, law-enforcement powers, and local relationships,
        and should be reconsidered if FBI reform continues to fail rather than adopted as the current course.
      O3: Retaining the existing arrangement would not establish the proposed single focal point, direct DNI links, and defined
        accountability for the FBI's national-security mission.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The FBI continues to fail to institute the reforms needed to become an effective intelligence organization.
      then: O2
      why: Continued failure to reform would make a separate domestic intelligence agency an alternative policymakers should
        seriously reconsider.
    would_not_change:
    - id: noflip1
      if: Service resources sometimes need to be reassigned temporarily to other divisions, but only with the service head's
        permission under procedures agreed upon by the DNI.
      why: That limited and controlled possibility is compatible with the recommended service structure and is not a reason
        by itself to reject it.
    watch_for:
    - id: watch1
      what: Whether the FBI effects the necessary institution-wide cultural and organizational reforms.
      favors:
      - O2
      why: Continued failure is the stated trigger for policymakers to re-evaluate a separate domestic intelligence agency.
    - id: watch2
      what: Whether field-office needs lead to excessive diversion of National Security Service resources.
      favors:
      - O3
      why: The proposal anticipates this risk and calls for limits on reallocation; persistent inability to protect service
        resources would undermine a stated benefit of the structure.
  lesson: Keep national-security and criminal capabilities integrated when their powers, relationships, and coordination improve
    the mission and support civil-liberties safeguards. Pair that integration with clear authority, oversight, and resource
    protections, and reassess the structure if the institution fails to deliver the reforms on which the recommendation depends.
  limits: This reasoning addresses the proposed FBI structure and its oversight, not operational collection methods or the
    merits of a separate agency in every context. The recommendation's balance depends on effective coordination, safeguards,
    and sustained FBI reform.
