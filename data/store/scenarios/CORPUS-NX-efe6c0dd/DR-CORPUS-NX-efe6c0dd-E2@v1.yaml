case:
  id: DR-CORPUS-NX-efe6c0dd-E2@v1
  title: Coordinating the ICBM Assessment
  status: draft
  setting: February 1960, USIB and GMAIC in the United States intelligence community
  decider: USIB
  agent: USIB
  agent_role: decide
  situation: USIB faced disagreement among intelligence agencies about the Soviet ICBM program and its goals. Available information
    about Soviet intentions and capabilities was limited. Analytical staffing devoted to the deployment question was small,
    and existing resource limits made comprehensive examination of all available material difficult. The Air Force held an
    extensive list of suspected launch sites, but the data supporting its briefing had not been made available to GMAIC. Doubling
    or tripling analytical resources was not expected to materially improve progress in the next year or two.
  question: What should USIB do about interagency evidence sharing and review of Soviet ICBM deployment assessments?
  options:
    O1:
      do: USIB directs the agencies to disclose their evidence through temporary working groups conducting a coordinated highest-priority
        review.
      move: act
      irreversible: false
    O2:
      do: USIB directs the agencies to withhold their evidence and continue separate assessments of the issue.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: USIB member agencies disagreed about whether the Soviet ICBM goal was military superiority, a high level of deterrence,
      or a modest capability focused principally on space.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Information about Soviet intentions and capabilities was sparse.
  - id: F3
    kind: capability
    status: assessed
    fact: Analytical manpower allocated directly or indirectly to ICBM deployment probably amounted to no more than 10 to
      12 full-time analysts.
  - id: F4
    kind: capability
    status: assessed
    fact: Only since mid-1959 had ORR had as many as five or six analysts working exclusively on deployment.
  - id: F5
    kind: capability
    status: assessed
    fact: Resource limits, competing intelligence demands, and the problem's complexity made systematic and comprehensive
      exploitation of all available material difficult.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Doubling or tripling analytical resources was not expected to materially improve progress over the next year or
      two.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The Air Force held an extensive list of suspected ICBM launch sites, and data supporting its briefing had not been
      made available to GMAIC.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Agencies disagreed about the Soviet program's goals while information about intentions and capabilities was sparse.
      A coordinated review could compare their assessments against the evidence rather than leave the differences unresolved.
  - id: C2
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Air Force's supporting data had not been made available to GMAIC. A review that requires agencies to share their
      evidence gives the committee a basis to examine the competing assessments.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: Staffing was limited, comprehensive exploitation of available material was difficult, and simply doubling or tripling
      analysts was not expected to materially improve progress. A temporary, high-priority review uses existing analytic capacity
      rather than relying on staffing increases.
  - id: C4
    facts:
    - F1
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: USIB needed to address agency differences about deployment assessments despite the problem's complexity. It made
      reexamining the evidence and resolving those differences a highest-priority task.
  reasoning:
    read: 'This was not just a staffing problem: agencies differed in their assessments, and evidence supporting the Air Force''s
      position was not available to GMAIC. The trap is to treat limited capacity as a reason to keep separate assessments
      or simply add analysts, even though additional staffing was not expected to materially improve near-term progress.'
    weighing: The sparse information and disagreement favor a common evidence review {C1}, and the gap in evidence sharing
      makes that review especially important {C2}. Resource limits make a focused, temporary effort more practical than relying
      on a major increase in staff {C3}. Together, these considerations support USIB's choice to direct cooperation and make
      the review a highest-priority task {C4}. The choice depends on agencies actually providing their evidence so GMAIC can
      examine the differences.
    tradecraft: Direct the agencies to disclose their evidence through the temporary working groups, give GMAIC a clear review
      mandate, and record the evidentiary basis and unresolved differences in the resulting assessment.
    uncertainty: Information about Soviet intentions and capabilities was sparse, and resource limits, competing intelligence
      demands, and the problem's complexity made it difficult to exploit all available material systematically and comprehensively.
      The review could address differences in assessment, but the available information did not guarantee a definitive conclusion.
    handoff: USIB should set the priority and require cooperation; GMAIC and its temporary working groups should conduct the
      review, with the relevant agencies providing their evidence.
    tempting_wrong:
      option: O2
      pull: Separate assessments avoid the demands of coordinating agencies and may seem more manageable given limited analytic
        staffing.
      why_wrong: Withholding evidence would leave GMAIC unable to examine the material behind a major agency's position and
        would not serve USIB's stated aim of reexamining the evidence and resolving differences.
    rejected:
      O2: USIB did not choose continued separate assessments because it directed cooperation and a highest-priority coordinated
        review of the evidence.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: An applicable authority prohibited sharing the evidence across agencies and no authorized means of review were available.
      then: O2
      why: A coordinated disclosure would not be an available lawful option; the closest stated alternative would be to continue
        separate assessments.
    would_not_change:
    - id: noflip1
      if: Analytic staffing remained limited and doubling or tripling it still was not expected to materially improve progress.
      why: Those constraints do not remove the value of coordinating the evidence review through temporary working groups.
    watch_for:
    - id: watch1
      what: Whether the working groups can examine the evidence together and resolve the differences among agency assessments.
      favors:
      - O1
      why: That is the purpose USIB assigned to the coordinated reexamination.
  lesson: When agencies disagree and important supporting evidence has not been shared, require a coordinated review before
    accepting separate assessments as the endpoint. Where added staffing is not expected to improve progress, prioritize cooperation
    and focused use of existing analytic capacity.
  limits: This reasoning concerns interagency analytic coordination under uncertainty; it does not determine the content of
    the Soviet ICBM assessment. A legal or security restriction on disclosure could change what evidence-sharing course is
    available.
  library:
    domain: intel-oversight
    family: CORPUS-NX-efe6c0dd
    source: https://www.cia.gov/static/9f19eaafd0a610481c2b4fd980b407fb/Penetrating-the-Iron-Curtain-Resolving-the-Missile-Gap-with-Technology.pdf
    episode_focus: The decision was whether to continue with divergent agency assessments or coordinate a rapid review of
      the evidence; USIB chose cooperation and temporary groups as a highest-priority task. Keep the focus on analytic coordination
      and sharing evidence, not on evaluating specific launch locations.
    cues:
      option_words:
        O1: 17
        O2: 15
      real_option: O1
      real_to_mean_other_length: 1.13
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: USIB directed its members to cooperate in reexamining deployment data and resolving agency differences, and approved
