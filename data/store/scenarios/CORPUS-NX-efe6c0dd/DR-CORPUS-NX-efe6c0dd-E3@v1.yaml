case:
  id: DR-CORPUS-NX-efe6c0dd-E3@v1
  title: Consolidating CIA Missile Analysis
  status: draft
  setting: CIA, February 1960.
  decider: The Director of Central Intelligence
  agent: The Director of Central Intelligence
  agent_role: decide
  situation: CIA intelligence efforts were missing critical evidence of a substantial Soviet ICBM program. Air Force leaders
    publicly asserted that the USSR could destroy U.S. retaliatory forces and challenged the administration’s defense policy.
    CIA had not previously consolidated its missile research at the DDI level. OSI and ORR held distinct responsibilities
    in missile analysis. The DDI proposed an ad hoc temporary task force, with the proposal submitted to the Director of Central
    Intelligence.
  question: What should the Director of Central Intelligence do about the proposed temporary consolidation of CIA missile-analysis
    expertise?
  options:
    O1:
      do: The Director of Central Intelligence rejects the temporary task force and retains the relevant CIA missile-analysis
        expertise in separate components.
      move: act
      irreversible: false
    O2:
      do: The Director of Central Intelligence defers the task-force decision and retains the relevant CIA missile-analysis
        expertise in separate components pending further review.
      move: hold
      irreversible: false
    O3:
      do: The Director of Central Intelligence approves the temporary task force and combines the relevant CIA missile-analysis
        expertise in one unit.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: CIA intelligence efforts were missing critical evidence of a substantial Soviet ICBM program.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Air Force leaders publicly asserted that the USSR could destroy U.S. retaliatory forces.
  - id: F3
    kind: situation
    status: confirmed
    fact: Air Force leaders challenged the administration’s defense policy.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Air Force received congressional support from influential senators.
  - id: F5
    kind: situation
    status: confirmed
    fact: The proposed consolidation would be the first DDI consolidation of missile research in CIA’s history.
  - id: F6
    kind: situation
    status: confirmed
    fact: OSI retained responsibility for research-and-development analysis, while ORR had primary responsibility for analysis
      of rocket building and fielding.
  - id: F7
    kind: authority
    status: confirmed
    fact: The DDI submitted a proposal to the Director of Central Intelligence to establish an ad hoc guided-missile task
      force.
  considerations:
  - id: C1
    facts:
    - F1
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: CIA was missing critical evidence of a substantial Soviet ICBM program. The DDI's proposed temporary consolidation
      offered an organizational response to that identified gap.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: 'Bringing OSI and ORR expertise into one task force could integrate missile analysis while retaining their distinct
      responsibilities: OSI for research and development, and ORR for rocket building and fielding.'
  - id: C3
    facts:
    - F1
    - F7
    equity: resource_stewardship
    favors:
    - O3
    weight: weak
    why: The task force's stated organizational objectives included allocating adequate personnel and integrating them into
      an effective team, a direct way to focus CIA's resources on the problem.
  - id: C4
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: Forceful public claims and congressional support heightened the stakes, but did not establish the scale of the Soviet
      program. CIA needed an organized analytic response to the evidence gap rather than conclusions driven by policy advocacy.
  reasoning:
    read: The central problem is an intelligence gap and how CIA organizes its expertise to address it, not whether Air Force
      claims or administration policy are correct. The trap is to let public assertions and political support stand in for
      evidence, or to treat existing component boundaries as a reason not to coordinate.
    weighing: The stated reason for the consolidation was to ensure CIA had not missed something; the task force was also
      intended to provide adequate personnel and an integrated team. Combining OSI and ORR expertise supports that aim, while
      preserving their distinct analytical responsibilities. Those considerations favor {O3}; the case depends on the identified
      evidence gap and the consolidation remaining an organizational integration, not an erasure of the component roles.
    tradecraft: Record that the approval is for an ad hoc temporary task force responding to the identified analytic gap.
      Specify the participating expertise and preserve the stated division of responsibility; review whether the arrangement
      remains useful to the task it was formed to address.
    uncertainty: The source gives no quantified assessment of how much the consolidation would improve analysis and records
      no extended comparison of alternatives. The endorsement is clear, but the rationale for approval is drawn from the stated
      evidence gap, the proposal, and the task force's organizational objectives.
    handoff: The DCI should decide on the DDI's proposal, drawing on the relevant OSI and ORR expertise because their responsibilities
      are distinct but both bear on the missile analysis.
    tempting_wrong:
      option: O1
      pull: Keeping OSI and ORR separate may appear to protect their distinct responsibilities.
      why_wrong: The source's organizational solution joined their expertise while retaining their different responsibilities;
        maintaining separate components would leave the proposed integration unrealized.
    rejected:
      O1: Rejecting the proposal would leave the relevant expertise distributed despite the identified gap and the DDI's proposed
        integrated, temporary arrangement.
      O2: Deferring would postpone the proposed organizational response even though the source records that the DCI promptly
        agreed to it.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed consolidation could not include both areas of expertise while preserving their distinct responsibilities.
      then: O1
      why: The case for integration depends on combining expertise without eliminating the division of analytical responsibility.
    - id: flip2
      if: Further review established that the critical evidence gap had been resolved and the existing component arrangement
        was adequate.
      then: O2
      why: The stated organizational case for immediate consolidation rests on the gap CIA was missing evidence of.
    would_not_change:
    - id: noflip1
      if: The fact that this would be the first DDI consolidation of missile research were the only objection.
      why: Novelty alone would not outweigh the identified intelligence gap and the proposed integration of relevant expertise.
    watch_for:
    - id: watch1
      what: Whether the temporary unit includes both OSI and ORR expertise while preserving their distinct analytical responsibilities.
      favors:
      - O3
      why: That combination is the organizational basis for integration without displacing the established areas of responsibility.
  lesson: When an intelligence gap is linked to expertise spread across components, consider a temporary integrated organization
    rather than assuming existing boundaries must prevent coordination. Integration should preserve clear responsibilities
    and respond to evidence needs, not to pressure to validate a policy position.
  limits: This reasoning concerns an internal organizational decision to consolidate CIA missile-analysis expertise in response
    to a stated intelligence gap. It does not establish that a task force will resolve the gap or determine the merits of
    any estimate about Soviet capabilities.
  library:
    domain: intel-analysis
    family: CORPUS-NX-efe6c0dd
    source: https://www.cia.gov/static/9f19eaafd0a610481c2b4fd980b407fb/Penetrating-the-Iron-Curtain-Resolving-the-Missile-Gap-with-Technology.pdf
    episode_focus: The choice was to keep the relevant CIA expertise distributed or integrate it in a temporary task force;
      the Director approved the proposed consolidation. Extract the organizational and analytic decision, excluding the task
      force’s later research or collection methods.
