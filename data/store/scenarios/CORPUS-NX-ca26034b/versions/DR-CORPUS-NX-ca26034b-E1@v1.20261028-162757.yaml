case:
  id: DR-CORPUS-NX-ca26034b-E1@v1
  title: Hedging Against Analytical Groupthink
  status: draft
  setting: United States government intelligence community, summer and fall of 2002.
  decider: The organizational leader
  agent: The organizational leader
  agent_role: decide
  situation: In summer and fall 2002, intelligence analysts across the United States government were assessing Iraq's WMD
    capability. Most inside the government believed Iraq maintained and continued a major capability, while a few analysts
    held a contrary view. An internal poll finds that 5 percent of respondents believe Iraq has no WMD capability. Almost
    all of the organization's analytical effort is directed to the majority hypothesis. The organizational leader must decide
    whether to shift analytical effort to an alternative team staffed with analysts who selected the no-capability hypothesis
    or leave effort aligned with the majority hypothesis.
  question: What should the organizational leader do about shifting analytical effort to an alternative team examining whether
    Iraq has no WMD capability?
  options:
    O1:
      do: The organizational leader declines shifting a higher percentage of analytical effort from the majority WMD hypothesis
        to an alternative team examining whether Iraq has no WMD capability.
      move: act
      irreversible: false
    O2:
      do: The organizational leader authorizes shifting a higher percentage of analytical effort from the majority WMD hypothesis
        to an alternative team examining whether Iraq has no WMD capability.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Intelligence analysts across the United States government were assessing Iraq's WMD capability in summer and fall
      2002.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Most people inside the government believed Iraq maintained and continued to develop a major WMD capability.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A few intelligence officers and analysts held opinions suggesting that Iraq might not have the WMD capability attributed
      to it.
  - id: F4
    kind: situation
    status: confirmed
    fact: The dissenting opinions were few and spread throughout the government.
  - id: F5
    kind: capability
    status: confirmed
    fact: An internal poll of relevant organizational members was proposed as a systematic way to identify outliers.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Almost 100 percent of the organization's analytical effort was pursuing the hypothesis that Iraq sustained a massive
      WMD program.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The internal poll found that 5 percent of respondents believed Iraq had no WMD capability.
  - id: F8
    kind: capability
    status: confirmed
    fact: The alternative analytical team could be staffed with the outliers who selected the possibility that Iraq had no
      WMD.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Almost all analytical effort is committed to the majority hypothesis, while the poll identifies a minority that rejects
      it. The imbalance supports shifting effort so the alternative is examined rather than left largely unexplored.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The contrary views are few and dispersed, making them vulnerable to being overwhelmed by the confident majority.
      This episode illustrates how an outlying view can prove important.
  - id: C3
    facts:
    - F5
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The internal poll is a systematic way to identify outliers and alternatives that might otherwise be overlooked; its
      result gives the leader a basis to investigate the no-capability hypothesis.
  - id: C4
    facts:
    - F8
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: Staffing the alternative team with analysts who selected that possibility helps ensure the inquiry is not led by
      members already primed to discount it. The team should have dedicated time and resources to examine its hypothesis.
  reasoning:
    read: 'The decision is not whether the majority hypothesis should be discarded: it is whether a heavily one-sided analytical
      portfolio should be hedged when the poll identifies a minority alternative. The trap is treating the majority''s confidence
      and near-total allocation of effort as independent confirmation, while allowing dispersed dissent to go unexamined.'
    weighing: The strong imbalance between analytical effort and the poll result supports {O2} {C1}, as does the risk that
      a few dissenters will be overwhelmed {C2}. The poll provides a systematic signal to investigate an alternative, not
      proof that the alternative is correct {C3}. Shifting effort to a team staffed with those who selected the alternative
      gives it a fair examination and helps counter the tendency of majority-minded analysts to discount it {C4}. The balance
      depends on taking the outlier result seriously enough to explore the alternative, without treating the poll itself as
      a conclusion.
    tradecraft: Compare the analytical portfolio with the poll result, identify the outlier hypothesis, and shift a higher
      percentage of effort to examine it. Staff the alternative team with analysts who selected that possibility and provide
      dedicated time and resources. Record the allocation decision and the reasons for it, and revisit the balance as the
      competing analyses develop.
    uncertainty: The poll identifies an alternative worth examining; it does not establish whether Iraq had WMD. The alternative's
      facts, assumptions, and dynamics need examination before an analytical conclusion is drawn.
    handoff: The organizational leader makes the allocation decision. An independent arbiter, such as an ombudsman, can identify
      and vet potential outliers before the leader evaluates the analytical portfolio.
    tempting_wrong:
      option: O1
      pull: Nearly all analytical effort already supports the majority hypothesis, and most people inside government share
        that view.
      why_wrong: Leaving the allocation unchanged would let the majority's dominance further suppress the alternative instead
        of hedging against groupthink.
    rejected:
      O1: The leader should not leave effort aligned with the majority when the poll identifies an outlier hypothesis and
        almost all analytical resources already pursue the majority view.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The poll and portfolio comparison no longer indicated an overlooked alternative or a substantial imbalance in analytical
        effort.
      then: O1
      why: The stated reason for hedging is the mismatch between the resources committed to the majority hypothesis and the
        presence of an outlier alternative; without that mismatch, the case for shifting effort would be weaker.
    would_not_change:
    - id: noflip1
      if: The majority view remained confident and widely held while almost all analytical effort continued to support it.
      why: That combination is the circumstance in which outlier perspectives can be overwhelmed and an analytical hedge is
        warranted.
    watch_for:
    - id: watch1
      what: Whether dedicated examination of the alternative exposes facts, assumptions, or dynamics that the majority analysis
        has not addressed.
      favors:
      - O2
      why: The alternative team should have time and resources to explore its hypothesis, including its underlying assumptions
        and dynamics.
  lesson: When nearly all analytical effort supports one hypothesis but a poll identifies a credible outlier alternative,
    do not treat the prevailing view as self-validating. Shift enough effort to examine the alternative, and staff that work
    so it is not predisposed to dismiss the outlier perspective.
  limits: This recommendation concerns the allocation and organization of analysis; it does not establish which WMD assessment
    was correct. It applies where a meaningful outlier hypothesis and a substantial imbalance in analytical effort are present.
