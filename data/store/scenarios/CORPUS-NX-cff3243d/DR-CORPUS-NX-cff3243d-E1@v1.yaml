case:
  id: DR-CORPUS-NX-cff3243d-E1@v1
  title: Requesting Arming Under Title 32
  status: draft
  setting: Michigan, during a military exercise; Army protection cell and TF Michigan; time not specified.
  decider: The protection cell
  agent: The protection cell
  agent_role: decide
  situation: During a military exercise in Michigan, the protection cell was responsible for risk management within the Army
    staff process. Criminal gang activity was a known potential hazard. The cell had not conducted a comprehensive risk assessment,
    and no decision point connected that hazard to a request for TF Michigan to arm National Guard Soldiers under Title 32
    authorities. The contemplated action was a request to TF Michigan. Risk reduction measures could be tested during course-of-action
    analysis, and anticipating known hazards could inform assessments and asset allocation before loss of combat power.
  question: What should the protection cell do about requesting that TF Michigan arm National Guard Soldiers under Title 32
    authorities?
  options:
    O1:
      do: The protection cell requests that TF Michigan arm National Guard Soldiers under Title 32 authority.
      move: act
      irreversible: false
    O2:
      do: The protection cell declines to request that TF Michigan arm National Guard Soldiers under Title 32 authority.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: The protection warfighting function is responsible for conducting risk management.
  - id: F2
    kind: capability
    status: confirmed
    fact: The staff generally conducts risk management during intelligence preparation of the battlefield by creating a risk
      management matrix, which is refined throughout the military decisionmaking process.
  - id: F3
    kind: capability
    status: confirmed
    fact: Risk can be avoided, eliminated, transferred, or mitigated before the commander prudently accepts it.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Criminal gang activity was a known potential hazard.
  - id: F5
    kind: situation
    status: confirmed
    fact: The protection cell had not conducted a comprehensive risk assessment during the exercise.
  - id: F6
    kind: situation
    status: confirmed
    fact: No decision point linked the known hazard to requesting that TF Michigan arm National Guard Soldiers under Title
      32 authorities.
  - id: F7
    kind: situation
    status: assessed
    fact: Anticipating known hazards would have allowed greater prediction, ongoing assessments, and allocation of assets
      before loss of combat power.
  - id: F8
    kind: capability
    status: confirmed
    fact: During course-of-action analysis, the integrated staff tests risk reduction measures.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The protection function is responsible for risk management, which the staff is to develop during intelligence preparation
      and refine throughout the decisionmaking process. The cell should incorporate the arming request into that process rather
      than leave the known hazard unaddressed.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Gang activity was known, but there was no comprehensive risk assessment or decision point linking the hazard to the
      request. Anticipating known hazards enables prediction, ongoing assessment, and allocation of assets before combat power
      is lost.
  - id: C3
    facts:
    - F3
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Risks should be considered for avoidance, elimination, transfer, or mitigation before the commander accepts them,
      and the integrated staff tests risk-reduction measures during course-of-action analysis. The request should therefore
      be considered as part of deliberate risk management, not omitted because the assessment was incomplete.
  - id: C4
    facts:
    - F6
    - F7
    equity: tempo
    favors:
    - O1
    weight: weak
    why: The eventual request was reactive. Linking the known hazard to a decision point would support earlier, ongoing decision-making
      rather than waiting until the response is reactive.
  reasoning:
    read: 'The protection cell faced a known hazard without a comprehensive assessment or a decision point connecting it to
      a request that TF Michigan arm National Guard Soldiers under Title 32 authorities. The trap is to treat the eventual
      request as sufficient: its reactive timing was a deficiency, and known hazards should be anticipated and linked to decisions.'
    weighing: 'The reasons favor O1: risk management belongs in the staff process, known hazards should be anticipated before
      combat power is lost, and risk-reduction measures should be tested during course-of-action analysis. This supports making
      the request within a deliberate assessment and decision process, rather than declining it. The source does not establish
      that Title 32 authority is legally available in every circumstance or that the request must be granted.'
    tradecraft: Record the known hazard and the request as a risk-reduction measure in the running risk estimate, assess it
      during course-of-action analysis, and link relevant effects to an FFIR and commander decision point. Use the unit SOP
      to convey key risks for the current-operations time horizon.
    uncertainty: The passage does not assess the legal sufficiency of Title 32 authority, the request's effectiveness, or
      whether the commander should ultimately accept the risk. It supports making and evaluating the request as part of risk
      management.
    handoff: The protection cell should develop the risk assessment with the integrated staff and connect the relevant FFIR
      to commander decision-making; the request itself is directed to TF Michigan. This preserves the distinction between
      the cell's risk-management role and the command decision.
    tempting_wrong:
      option: O2
      pull: Declining may seem prudent while the risk assessment and decision point are missing, particularly because the
        request invokes Title 32 authority.
      why_wrong: The absence of comprehensive assessment and hazard-linked decisions is a risk-management failure to correct,
        not a reason to leave the known hazard unaddressed; there is also no legal finding against requesting.
    rejected:
      O2: The criticism of the reactive response and the recommendation to link known risks to commander decisions support
        requesting the action through deliberate risk management rather than declining it.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A comprehensive assessment found that the proposed request would not reduce the identified risk or would introduce
        a greater risk.
      then: O2
      why: The recommendation to manage risk does not make every proposed measure appropriate; a measure that fails assessment
        should not be selected as risk reduction.
    would_not_change:
    - id: noflip1
      if: The cell still lacked a comprehensive assessment and a hazard-linked decision point.
      why: Those omissions call for deliberate risk management and correction; they do not support simply declining to consider
        the request.
    watch_for:
    - id: watch1
      what: Assessment of the known hazard, its projected effects on friendly forces, and whether the proposed request is
        an effective risk-reduction measure.
      favors:
      - O1
      why: Projected hazard effects should inform FFIRs, and risk-reduction measures should be tested during course-of-action
        analysis.
  lesson: Anticipate known hazards and incorporate them into a running risk estimate rather than waiting to respond reactively.
    Test proposed risk-reduction measures, connect relevant effects to commander decision-making, and do not treat a request
    as a determination that it is legally authorized or must be approved.
  limits: This reasoning supports requesting and evaluating the measure as part of risk management; it does not decide whether
    Title 32 authority is legally sufficient in a particular case or whether the request should be granted. It also does not
    establish that arming is effective or appropriate under facts not provided.
