case:
  id: DR-WCK-CONVOY-2024-1@v1
  title: Engagement of Aid Convoy Vehicles
  status: draft
  setting: Southern Command area, Gaza Strip, during an IDF humanitarian aid convoy operation
  decider: Brigade decision makers
  agent: Brigade decision makers
  agent_role: decide
  situation: A convoy of World Central Kitchen (WCK) aid trucks was escorted by locally‑contracted security personnel. One
    security person fired a weapon into the air, which UAV operators and the Brigade Fire Support Commander interpreted as
    consistent with Hamas hijacking. The Brigade Attack Cell raised concerns about armed individuals on the convoy and contacted
    the Civilian Liaison Authority, which received messages that the security personnel’s guns were fake. UAV operators later
    identified gunmen dismounting and classified them as Hamas, while a separate UAV misidentified a WCK driver handling a
    weapon. Identification stickers on WCK vehicles were not visible at night, and pre‑coordination details had not been passed
    down to the Brigade. Despite a denial of permission to engage the escort vehicles, the three WCK vehicles were later struck,
    killing seven workers.
  question: What should the Brigade decision makers do regarding striking the aid convoy vehicles after assessing the armed
    people around them as Hamas operatives from a single video feed?
  options:
    O1:
      do: The Brigade decision makers withhold engagement of the aid convoy vehicles
      move: act
      irreversible: false
    O2:
      do: The Brigade decision makers request additional intelligence before deciding
      move: ask
      irreversible: false
    O3:
      do: The Brigade decision makers engage the aid convoy vehicles
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A locally‑contracted security person fired a weapon into the air, which UAV operators assessed as consistent with
      Hamas hijacking the aid convoy
  - id: F2
    kind: situation
    status: confirmed
    fact: The Brigade Attack Cell contacted the Civilian Liaison Authority with concerns about armed individuals on the convoy
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Civilian Liaison Authority received a message that the locally‑contracted security personnel had "fake guns"
  - id: F4
    kind: situation
    status: confirmed
    fact: UAV operators identified gunmen dismounting from the convoy and classified them as Hamas, and permission to engage
      the escort vehicles was denied because they were too near the humanitarian convoy
  - id: F5
    kind: intelligence
    status: assessed
    fact: A UAV operator mistakenly identified a WCK driver placing a gun into a WCK vehicle
  - id: F6
    kind: situation
    status: confirmed
    fact: The identification of armed individuals on the convoy and near/in the WCK vehicles was not performed in a professional
      manner
  - id: F7
    kind: capability
    status: confirmed
    fact: WCK vehicles had identification stickers on the roof that were not visible to UAV operators at night
  - id: F8
    kind: authority
    status: confirmed
    fact: The IDF had not deliberately or knowingly targeted WCK personnel
  - id: F9
    kind: authority
    status: confirmed
    fact: Specific details about the pre‑coordinated WCK aid mission were not passed down from higher Southern Command to
      the Brigade and UAV operator
  - id: F10
    kind: situation
    status: confirmed
    fact: The three WCK vehicles were struck in quick succession, resulting in seven WCK workers killed
  considerations:
  - id: C1
    facts:
    - F6
    - F5
    - F4
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The identification of armed individuals on the convoy and near the WCK vehicles was not performed professionally,
      leading to a misidentification of a WCK driver as a gunman.
  - id: C2
    facts:
    - F1
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: 'Intelligence was contradictory: a security person fired a weapon (interpreted as hostile) while the Civilian Liaison
      Authority reported the guns were fake.'
  - id: C3
    facts:
    - F9
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: Pre‑coordinated details of the aid mission were not passed down, undermining trust with the humanitarian partner
      and increasing the risk of mistaken strike.
  - id: C4
    facts:
    - F7
    equity: humanitarian_access
    favors:
    - O1
    weight: weak
    why: Identification stickers on the WCK vehicles were not visible to UAV operators at night, reducing the ability to positively
      identify protected humanitarian assets.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The IDF had not deliberately or knowingly targeted WCK personnel, indicating that the legal threshold for engagement
      had not been met.
  reasoning:
    read: The brigade relied on a single UAV video feed that showed individuals firing or handling weapons and classified
      them as Hamas operatives. The trap was to treat that limited visual cue as sufficient positive identification for lethal
      engagement.
    weighing: Misidentification, lack of professional analysis, and failure to receive pre‑coordination information outweigh
      any perceived threat. Because the identification was faulty (C1, C2) and the legal standard of positive ID was not satisfied
      (C5), the balance tips toward withholding fire.
    tradecraft: The decision should be recorded as a non‑engagement, with a written justification citing the lack of reliable
      identification and the failure to receive coordination details. The brigade must log the request for additional intelligence
      and preserve all ISR footage for after‑action review.
    uncertainty: High – the UAV feed was the only real‑time source, and contradictory messages about the security personnel’s
      weapons created doubt about who was hostile.
    handoff: The brigade should defer to higher command and the Civilian Liaison Authority for clarification before any kinetic
      action, preserving the chain of command and partner relationship.
    tempting_wrong:
      option: O3
      pull: Perceived immediate Hamas threat from armed individuals near the convoy.
      why_wrong: Engaging based on a single, unverified video feed violated the requirement for positive identification and
        resulted in the wrongful death of protected humanitarian workers.
    rejected:
      O2: Requesting additional intelligence was not chosen because the brigade already believed the threat was imminent,
        but the source later judged that waiting for confirmation would have prevented the strike.
      O3: Engaging the convoy was rejected because the identification was mistaken, the legal threshold for targeting was
        not met, and the strike violated humanitarian protection norms.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Positive, verifiable identification of Hamas combatants on the convoy vehicles is obtained
      then: O3
      why: A confirmed combatant presence would satisfy the legal positive‑identification requirement, allowing lawful engagement.
    would_not_change:
    - id: noflip1
      if: The weapons are later confirmed to be fake and the individuals are non‑combatants
      why: Even with fake weapons, the lack of positive ID and the humanitarian status of the convoy still prohibit strike.
    watch_for:
    - id: watch1
      what: Reliance on a single night‑time UAV video feed for target classification
      favors:
      - O1
      why: Such reliance increases the risk of misidentification and unlawful harm to protected persons.
  lesson: Never rely on a single, low‑confidence visual cue to positively identify protected humanitarian assets; always obtain
    corroborating intelligence before lethal engagement. Proper coordination and visible identification markings are essential
    safeguards against unlawful strikes.
  limits: This reasoning applies only when the target is a protected humanitarian convoy and the available intelligence is
    limited and contradictory. It does not address scenarios where a clear, corroborated combatant presence is established.
