case:
  id: DR-WCK-CONVOY-2024-1@v1
  title: Decision to Engage Aid Convoy Vehicles
  status: draft
  setting: Southern Command brigade area, Gaza, during WCK aid convoy operation
  decider: the Brigade decision makers
  agent: the Brigade decision makers
  agent_role: decide
  situation: Locally‑contracted security personnel were riding on the aid convoy trucks, and one fired a weapon into the air
    as the convoy moved, an event captured by UAV video. The Brigade Fire Support Commander, using that video feed, classified
    the armed individuals around the convoy as Hamas operatives. Pre‑coordination details of the WCK aid mission had not been
    passed down to the Brigade or the UAV operator, and the identification stickers on the WCK vehicles were not visible at
    night. The Brigade requested higher‑command permission to engage the escort vehicles, but permission was denied because
    the vehicles were too near the humanitarian convoy. The UAV operator later mistakenly identified a WCK driver placing
    a weapon into a WCK vehicle. The Brigade decision makers must decide whether to strike the escort vehicles based on the
    current assessment.
  question: What should the Brigade decision makers do about striking the escort vehicles surrounding the aid convoy after
    assessing the armed individuals as Hamas operatives from a single video feed?
  options:
    O1:
      do: The Brigade decision makers refrain from striking the escort vehicles
      move: act
      irreversible: false
    O2:
      do: The Brigade decision makers strike the escort vehicles
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Locally‑contracted security personnel were present on the aid convoy trucks.
  - id: F2
    kind: situation
    status: confirmed
    fact: One security person fired a weapon into the air as the convoy moved, observed by UAV video and assessed as consistent
      with Hamas hijacking.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Brigade Fire Support Commander classified the armed individuals around the convoy as Hamas operatives based
      on the video feed.
  - id: F4
    kind: authority
    status: confirmed
    fact: Pre‑coordination details of the WCK aid mission were not communicated to the Brigade or UAV operator.
  - id: F5
    kind: capability
    status: confirmed
    fact: WCK vehicles had identification stickers on the roof, but they were not visible to UAV operators at night.
  - id: F6
    kind: authority
    status: confirmed
    fact: Higher command denied the Brigade's request to engage the escort vehicles because they were too near the humanitarian
      convoy.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The UAV operator mistakenly identified a WCK driver placing a weapon into a WCK vehicle.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Brigade decision makers determined that the armed operatives were Hamas based on known Hamas modus operandi
      of hijacking trucks.
  considerations:
  - id: C1
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Higher command explicitly denied permission to engage the escort vehicles because they were too near the humanitarian
      convoy, establishing a binding authority limitation.
  - id: C2
    facts:
    - F4
    - F5
    - F8
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Pre‑coordination details were not passed down and vehicle identification stickers were not visible at night, leading
      to unreliable identification of the armed individuals from a single video feed.
  - id: C3
    facts:
    - F3
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The classification of the armed individuals as Hamas relied on a single video observation and a mistaken identification
      of a WCK driver placing a weapon, indicating a flawed analytic process.
  - id: C4
    facts:
    - F2
    - F8
    equity: humanitarian_access
    favors:
    - O1
    weight: weak
    why: Although a security person fired a weapon into the air, the broader context of Hamas modus operandi does not constitute
      sufficient positive identification to justify striking humanitarian escort vehicles.
  - id: C5
    facts:
    - F6
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The denial by higher command reflects the need to respect the expectations and limits set by allied humanitarian
      partners.
  reasoning:
    read: The brigade faced a situation where armed individuals were observed around a humanitarian convoy, but identification
      was based on a single UAV video, with no visible markings and incomplete coordination. The higher command denied engagement,
      and the IDF did not deliberately target the aid workers.
    weighing: The lack of positive identification, the failure to pass down coordination details, and the explicit denial
      from higher command outweigh any suspicion of Hamas activity. Consequently, the balance tips toward refraining from
      strike ({O1}) despite the temptation to act on perceived threat.
    tradecraft: Document the decision, note the denial from higher command, and record the uncertainties. Maintain the UAV
      footage for later review and ensure future missions include visible markings and clear communication of coordination
      details.
    uncertainty: Uncertainty remains about the true identity of the armed individuals and whether any hostile intent existed,
      but the procedural safeguards (denial, lack of ID) dominate the assessment.
    handoff: The decision rests with the Brigade decision makers, but must be communicated upward to higher command for confirmation
      and logged with the brigade’s command staff to ensure accountability.
    tempting_wrong:
      option: O2
      pull: The visual of a gun being fired and the pattern of Hamas hijacking could pressure the brigade to strike quickly.
      why_wrong: Acting on a single video without reliable identification violates the principle of distinction and the explicit
        ROE denial, risking unlawful civilian casualties.
    rejected:
      O2: Striking the escort vehicles would have violated higher‑command ROE, lacked positive identification, and contradicted
        the source’s finding that the IDF had not knowingly targeted WCK personnel.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Positive identification of Hamas combatants on the escort vehicles is obtained with reliable, corroborated intelligence.
      then: O2
      why: Confirmed hostile presence would satisfy the ROE requirement for positive identification and allow engagement.
    - id: flip2
      if: Higher command reverses its denial and authorizes engagement based on updated threat assessment.
      then: O2
      why: A new lawful authority would remove the binding prohibition against striking.
    would_not_change:
    - id: noflip1
      if: The armed individuals are later determined to have been local security contractors with fake guns.
      why: The source already concluded the weapons were fake and the IDF did not deliberately target WCK personnel.
    watch_for:
    - id: watch1
      what: Implementation of visible identification markings on humanitarian vehicles that are discernible at night.
      favors:
      - O2
      why: Improved markings would reduce misidentification risk and could shift the balance toward permissible engagement
        if hostile actors are present.
  lesson: Never strike humanitarian escort vehicles without reliable positive identification and explicit ROE authorization;
    ensure coordination details and visible markings are communicated to all levels of command.
  limits: This reasoning applies only when identification is uncertain and higher command has denied engagement. It does not
    cover scenarios where clear, corroborated hostile intent is demonstrated and ROE approval is granted.
  library:
    domain: military-operational
    family: WCK-CONVOY-2024
    source: https://www.dfat.gov.au/sites/default/files/special-advisers-public-report-israels-response-wck-strikes-august-2024.pdf
    episode_focus: Whether the brigade decision makers should strike the aid convoy's vehicles, having assessed the armed
      people around them as Hamas operatives from a single video feed, or first confirm identity and the pre-coordinated aid
      movement.
