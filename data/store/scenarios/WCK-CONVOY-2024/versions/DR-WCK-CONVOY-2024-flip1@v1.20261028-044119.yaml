case:
  id: DR-WCK-CONVOY-2024-flip1@v1
  title: Engagement of Aid Convoy Vehicles [flip]
  status: needs_review
  setting: Southern Command sector, Gaza Strip, during a humanitarian aid convoy mission
  decider: Brigade senior staff
  agent: Brigade senior staff
  agent_role: decide
  situation: A World Central Kitchen (WCK) convoy of aid trucks was being escorted by locally-contracted security personnel.
    One of those guards discharged a weapon into the air, which UAV crews and the Brigade Fire Support Commander read as a
    possible Hamas hijack. The Brigade Attack Cell raised concerns about armed individuals on the convoy and alerted the Civilian
    Liaison Office, which later received a report that the security guards were carrying replica weapons. UAV operators subsequently
    captured high-resolution video showing individuals dismounting from the convoy wearing Hamas-specific armbands and handling
    rifles model-X that are catalogued in Hamas armament inventories, thereby providing verifiable confirmation of their combatant
    status; consequently, engagement permission was initially withheld due to proximity to the humanitarian convoy. A separate
    UAV misidentified a WCK driver handling a weapon, and the convoy's roof-mounted identification panels were not visible
    at night. Pre-coordination details had not been passed down to the Brigade. Despite a denial of permission to engage the
    escort vehicles, the three WCK trucks were later struck, killing seven workers.
  question: Given the verified video of Hamas combatants on the convoy, should the Brigade senior staff authorize striking
    the aid convoy vehicles?
  options:
    O1:
      do: Hold fire on the aid convoy vehicles
      move: act
      irreversible: false
    O2:
      do: Seek additional intelligence before taking any action
      move: ask
      irreversible: false
    O3:
      do: Authorize engagement of the aid convoy vehicles
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A locally-contracted security guard fired a weapon into the air, which UAV crews assessed as consistent with a Hamas
      hijack of the convoy
  - id: F2
    kind: situation
    status: confirmed
    fact: The Brigade Attack Cell notified the Civilian Liaison Office about armed individuals on the convoy
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Civilian Liaison Office received a message that the locally-contracted security personnel were carrying replica
      weapons
  - id: F4
    kind: situation
    status: confirmed
    fact: UAV operators captured high‑resolution video showing individuals dismounting from the convoy wearing Hamas‑specific
      armbands and handling rifles model‑X that are catalogued in Hamas armament inventories, thereby providing verifiable
      confirmation of their combatant status; consequently, engagement permission was initially withheld due to proximity
      to the humanitarian convoy.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A UAV analyst mistakenly identified a WCK driver placing a gun into a WCK vehicle
  - id: F6
    kind: situation
    status: confirmed
    fact: The assessment of armed individuals on and near the WCK trucks was not performed in a professional manner
  - id: F7
    kind: capability
    status: confirmed
    fact: WCK trucks bore roof-mounted identification panels that were not visible to UAV operators at night
  - id: F8
    kind: authority
    status: confirmed
    fact: The IDF had not intentionally targeted WCK personnel
  - id: F9
    kind: authority
    status: confirmed
    fact: Specific details of the pre-coordinated WCK aid mission were not transmitted from higher Southern Command to the
      Brigade and UAV crew
  - id: F10
    kind: situation
    status: confirmed
    fact: The three WCK trucks were struck in rapid succession, resulting in seven humanitarian workers killed
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    - F5
    equity: civilian_life
    favors:
    - O3
    weight: strong
    why: The high-resolution video provides unequivocal proof of Hamas combatants, outweighing earlier analytic shortcomings
      and misidentifications.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Although a guard fired a weapon and a report claimed the weapons were fake, the verified video of Hamas-marked fighters
      supersedes the ambiguity, justifying engagement.
  - id: C5
    facts:
    - F8
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Verified combatant presence satisfies the legal positive-identification requirement, removing the barrier to lawful
      strike.
  reasoning:
    read: The brigade examined a high-resolution UAV feed that clearly showed Hamas-identified fighters dismounting from the
      convoy and handling weapons listed in Hamas inventories, establishing positive identification of combatants on a protected
      humanitarian convoy.
    weighing: The verifiable combatant evidence (C1, C2) and the fulfillment of the legal positive-ID standard (C5) outweigh
      concerns about coordination lapses or misidentifications, leading to a justified decision to engage.
    tradecraft: The engagement should be logged as a lawful strike with a written justification citing the verified video
      evidence, and all ISR recordings must be archived for post-action review.
    uncertainty: Low – the video provides concrete, corroborated identification of hostile actors, minimizing doubt about
      the target's status.
    handoff: The brigade may proceed without awaiting higher-command confirmation, as the positive identification meets the
      threshold for independent engagement under the rules of engagement.
    tempting_wrong:
      option: O1
      pull: Desire to avoid harming humanitarian workers
      why_wrong: Withholding fire despite clear evidence of combatants would allow enemy forces to exploit the convoy for
        attacks, jeopardizing broader civilian safety.
    rejected:
      O2: Seeking additional intelligence would have delayed action and permitted hostile actors to continue using the convoy
        for attacks.
      O1: Non-engagement would ignore verified combatant presence, violating the duty to neutralize imminent threats.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If no verifiable evidence of Hamas combatants on the convoy can be obtained
      then: O1
      why: Without positive identification the legal threshold for strike is not met, making non-engagement the correct course.
    would_not_change:
    - id: noflip1
      if: If the weapons are later confirmed to be fake and the individuals are non-combatants
      why: Even with fake weapons, the lack of positive ID and the convoy's humanitarian status still prohibit a strike.
    watch_for:
    - id: watch1
      what: Reliance on a single night-time UAV video feed for target classification
      favors:
      - O1
      why: Such reliance raises the risk of misidentification and unlawful harm to protected persons.
  lesson: When reliable, verifiable evidence confirms combatants are present on a protected humanitarian convoy, lawful engagement
    is permissible, but decisions must still be based on corroborated intelligence and respect for humanitarian law.
  limits: This guidance applies only when positive identification of combatants is obtained on a humanitarian convoy; it does
    not apply in situations where identification is uncertain or the convoy is unarmed.
