case:
  id: DR-WCK-CONVOY-2024-1@v1
  title: Decision to Strike Aid Convoy Vehicles vs Verify Identity
  status: draft
  setting: Gaza, WCK aid convoy transit, IDF brigade operation
  decider: the Brigade decision makers
  agent: the Brigade decision makers
  agent_role: decide
  situation: A convoy of WCK aid trucks was escorted by locally‑contracted security personnel. One security person fired a
    weapon into the air, which the UAV operator and Brigade Fire Support Commander assessed as consistent with a Hamas hijacking.
    The CLA contacted WCK, which said the security personnel had "fake guns". UAV footage later showed gunmen dismounting
    and being classified as Hamas, while the aid vehicles' identification stickers were not visible at night. Higher command
    denied permission to engage the escort vehicles because they were too near the humanitarian convoy, yet the Brigade still
    had authority to approve strikes. The Brigade determined the armed individuals were Hamas, but the pre‑coordinated aid
    mission details had not been passed down to the Brigade.
  question: What should the Brigade decision makers do regarding striking the aid convoy vehicles after assessing the armed
    individuals as Hamas operatives from a single video feed?
  options:
    O1:
      do: The Brigade decision makers refrain from striking the aid convoy vehicles.
      move: act
      irreversible: false
    O2:
      do: The Brigade decision makers request verification of the vehicles’ identity.
      move: ask
      irreversible: false
      to: higher command
    O3:
      do: The Brigade decision makers strike the aid convoy vehicles.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Locally‑contracted security personnel fired a weapon into the air from the convoy, observed by UAV.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The UAV operator and Brigade Fire Support Commander assessed the gunfire as consistent with Hamas hijacking the
      aid convoy.
  - id: F3
    kind: situation
    status: confirmed
    fact: CLA contacted WCK about armed individuals; WCK replied that the security personnel had "fake guns".
  - id: F4
    kind: intelligence
    status: assessed
    fact: UAV operator later identified gunmen dismounting and classified them as Hamas.
  - id: F5
    kind: authority
    status: confirmed
    fact: Permission to engage the escort vehicles was requested from higher command and denied because the vehicles were
      too near the humanitarian aid convoy.
  - id: F6
    kind: situation
    status: confirmed
    fact: Identification stickers on WCK vehicles were not visible to UAV operators at night, contributing to misidentification.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Brigade decision makers determined the armed operatives were Hamas based on modus operandi.
  - id: F8
    kind: situation
    status: confirmed
    fact: Specific details of the pre‑coordinated WCK aid mission had not been passed down to the Brigade and UAV operator.
  - id: F9
    kind: authority
    status: confirmed
    fact: The brigade had delegated authority to approve strikes on hostile targets.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The UAV operator and Fire Support Commander assessed the gunfire as consistent with a Hamas hijacking, and the brigade
      determined the armed operatives were Hamas.
  - id: C2
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The brigade had delegated authority to approve strikes on hostile targets.
  - id: C3
    facts:
    - F2
    - F4
    equity: tempo
    favors:
    - O3
    weight: weak
    why: The perceived immediate threat of a Hamas hijacking created pressure to act quickly.
  - id: C4
    facts:
    - F5
    equity: chain_of_command
    favors:
    - O3
    weight: weak
    why: Although higher command denied permission, the brigade exercised its delegated strike authority.
  reasoning:
    read: The brigade observed a security guard firing a weapon from the convoy and, from a single UAV video feed, judged
      the individuals to be Hamas operatives hijacking humanitarian aid.
    weighing: Based on the assessment that the convoy was hostile (C1) and the brigade’s delegated strike authority (C2),
      the decision leaned toward immediate engagement despite limited verification and higher‑command denial (C4). The urgency
      of the perceived threat (C3) reinforced the choice to strike.
    tradecraft: The brigade recorded the UAV assessment, logged the strike authorization under its delegated authority, and
      filed an after‑action report documenting the decision process.
    uncertainty: Uncertainty existed due to night‑time visibility limits, the single video source, and incomplete pre‑mission
      coordination.
    handoff: The decision was made solely by the brigade decision makers using their delegated authority, without further
      escalation.
    tempting_wrong:
      option: O1
      pull: Refraining could avoid civilian casualties if the convoy were humanitarian.
      why_wrong: The brigade judged the threat to be imminent and hostile, and its authority permitted striking.
    rejected:
      O1: Refraining would leave a perceived Hamas hijacking unaddressed.
      O2: Requesting verification would delay action against an imminent hostile threat.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Positive, reliable verification that the convoy vehicles were purely humanitarian and unarmed.
      then: O1
      why: With confirmed humanitarian status, striking would be unlawful and unnecessary.
    would_not_change:
    - id: noflip1
      if: The brigade retains its delegated strike authority regardless of higher‑command denial.
      why: The authority to strike remains valid under the brigade’s ROE.
    watch_for:
    - id: watch1
      what: Future incidents where identification stickers are not visible at night.
      favors:
      - O2
      why: Repeated visibility issues increase the risk of misidentification and support the need for verification.
  lesson: When a single, ambiguous video feed suggests hostile activity, commanders may rely on delegated authority and perceived
    urgency to engage, but must be aware of the risk of misidentification.
  limits: This guidance applies only when the decision‑makers genuinely believe they have identified hostile actors; it does
    not excuse strikes when clear humanitarian identification is available.
