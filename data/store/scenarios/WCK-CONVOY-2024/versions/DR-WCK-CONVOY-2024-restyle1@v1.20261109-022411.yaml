case:
  id: DR-WCK-CONVOY-2024-restyle1@v1
  title: Engagement of Aid Convoy Vehicles [restyle]
  status: needs_review
  setting: Western Command sector, River Delta, during a joint humanitarian supply convoy operation
  decider: Division staff
  agent: Division staff
  agent_role: decide
  situation: A convoy of Mercy Aid (MA) supply trucks was escorted by locally hired security staff. One guard discharged a
    weapon overhead, which the aerial surveillance team and the Division Fire Support Officer interpreted as indicative of
    a hostile hijacking. The Division Targeting Cell raised concerns about armed persons on the convoy and contacted the Civilian
    Coordination Office, which received a report that the security staff's weapons were replicas. Later, the aerial team observed
    individuals dismounting and labeled them as hostile militants, while a separate sensor misidentified an MA driver handling
    a weapon. The MA vehicles bore roof-mounted identification panels that were not visible in darkness, and the pre-mission
    coordination details had not been relayed to the Division. Although permission to engage the escort units was denied,
    the three MA trucks were subsequently struck, killing seven aid workers.
  question: What action should the Division staff take regarding striking the aid-convoy vehicles after evaluating the armed
    individuals around them as hostile combatants based on a single aerial video feed?
  options:
    O1:
      do: The Division staff refrain from engaging the aid-convoy vehicles
      move: act
      irreversible: false
    O2:
      do: The Division staff request further intelligence before making a decision
      move: ask
      irreversible: false
    O3:
      do: The Division staff authorize engagement of the aid-convoy vehicles
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A locally hired security guard fired a weapon into the air, which aerial operators assessed as consistent with a
      hostile hijacking of the aid convoy
  - id: F2
    kind: situation
    status: confirmed
    fact: The Division Targeting Cell contacted the Civilian Coordination Office expressing concerns about armed individuals
      on the convoy
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Civilian Coordination Office received a message indicating that the locally hired security personnel possessed
      replica firearms
  - id: F4
    kind: situation
    status: confirmed
    fact: Aerial operators identified gun-bearing individuals dismounting from the convoy and classified them as hostile militants,
      and permission to engage the escort units was denied because they were too close to the humanitarian convoy
  - id: F5
    kind: intelligence
    status: assessed
    fact: An aerial operator mistakenly identified an MA driver placing a weapon into an MA vehicle
  - id: F6
    kind: situation
    status: confirmed
    fact: The identification of armed individuals on the convoy and near/in the MA vehicles was not performed in a professional
      manner
  - id: F7
    kind: capability
    status: confirmed
    fact: MA vehicles had roof-mounted identification panels that were not visible to aerial operators at night
  - id: F8
    kind: authority
    status: confirmed
    fact: The armed forces had not deliberately or knowingly targeted MA personnel
  - id: F9
    kind: authority
    status: confirmed
    fact: Specific details about the pre-coordinated MA aid mission were not passed down from higher command to the Division
      and aerial operators
  - id: F10
    kind: situation
    status: confirmed
    fact: The three MA vehicles were struck in rapid succession, resulting in seven MA workers killed
  considerations:
  - id: C1
    facts:
    - F6
    - F5
    - F4
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Because the assessment of armed persons on the convoy and adjacent to the MA trucks lacked professional analysis,
      a civilian driver was mistakenly classified as a combatant.
  - id: C2
    facts:
    - F1
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: 'Conflicting intelligence existed: a security guard discharged a weapon suggesting hostility, while the Coordination
      Office reported the weapons were replicas.'
  - id: C3
    facts:
    - F9
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: Failure to transmit pre-coordinated mission details eroded confidence with the humanitarian partner and heightened
      the chance of an erroneous strike.
  - id: C4
    facts:
    - F7
    equity: humanitarian_access
    favors:
    - O1
    weight: weak
    why: The roof-mounted identification panels on the MA trucks were obscured at night, limiting the ability to positively
      recognize protected humanitarian assets.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The armed forces had not intentionally or knowingly targeted MA personnel, meaning the legal criterion for lawful
      engagement had not been satisfied.
  reasoning:
    read: The division relied on a solitary UAV video stream that displayed individuals firing or handling weapons and labeled
      them as hostile militants. The error lay in treating that limited visual cue as sufficient positive identification for
      lethal action.
    weighing: The risk of misidentification, the unprofessional analysis, and the absence of pre-coordination data outweigh
      any inferred threat. Since the identification was flawed (C1, C2) and the legal standard of positive ID was unmet (C5),
      the balance favors refraining from fire.
    tradecraft: The decision should be documented as a non-engagement, with a written rationale citing the unreliable identification
      and missing coordination details. The division must log a request for additional ISR and retain all footage for after-action
      review.
    uncertainty: High – the UAV feed was the sole real-time source, and contradictory reports about the security guard's weapons
      created doubt about who was hostile.
    handoff: The division should defer to higher headquarters and the Civilian Coordination Office for clarification before
      any kinetic action, preserving the chain of command and partner relationship.
    tempting_wrong:
      option: O3
      pull: Perceived immediate hostile threat from armed individuals near the convoy.
      why_wrong: Engaging based on a single, unverified video feed breached the positive-identification requirement and caused
        the wrongful death of protected humanitarian workers.
    rejected:
      O2: Requesting further intelligence was not selected because the division believed the threat was imminent, yet later
        analysis showed that awaiting confirmation would have averted the strike.
      O3: Authorizing the strike was rejected because the identification was erroneous, the legal threshold for targeting
        was not met, and the attack violated humanitarian protection norms.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Positive, verifiable identification of hostile combatants on the convoy vehicles is obtained
      then: O3
      why: Confirmed combatant presence would satisfy the legal positive-identification requirement, permitting lawful engagement.
    would_not_change:
    - id: noflip1
      if: The weapons are later confirmed to be replicas and the individuals are non-combatants
      why: Even with replica weapons, the absence of positive ID and the convoy's humanitarian status still prohibit a strike.
    watch_for:
    - id: watch1
      what: Dependence on a single night-time UAV video feed for target classification
      favors:
      - O1
      why: Such dependence heightens the risk of misidentification and unlawful harm to protected persons.
  lesson: Do not depend on a solitary, low-confidence visual cue to positively identify protected humanitarian assets; always
    secure corroborating intelligence before lethal action. Effective coordination and visible identification markings are
    critical safeguards against unlawful strikes.
  limits: This analysis applies only when the target is a protected humanitarian convoy and the available intelligence is
    limited and contradictory. It does not cover situations where a clear, corroborated combatant presence is established.
