case:
  id: DR-WCK-CONVOY-2024-2@v1
  title: Continuation of Strikes on Humanitarian Convoy Vehicles
  status: draft
  setting: IDF operational area, night of the convoy strike, Brigade and Division command
  decider: the Brigade Fire Support Commander
  agent: the Brigade Fire Support Commander
  agent_role: decide
  situation: A humanitarian convoy of white vehicles arrived at a warehouse during the night. The Division Commander issued
    a direction that no more strikes around humanitarian convoys were to occur that night, and the Brigade Commander passed
    this order to his Chief of Staff. After the first escort vehicle was hit, the Brigade staff assessed that the remaining
    vehicles had left the warehouse and were now targetable. The Brigade Fire Support Commander was responsible for guiding
    any further strikes, which would occur within a designated humanitarian fire control zone that required Division Commander
    approval before engagement.
  question: What should the Brigade Fire Support Commander do regarding striking the second and third vehicles after the first
    was hit, given the Division Commander’s direction?
  options:
    O1:
      do: The Brigade Fire Support Commander orders to withhold fire on the second and third vehicles.
      move: act
      irreversible: false
    O2:
      do: The Brigade Fire Support Commander orders the strike on the second and third vehicles.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Continuing fire on the second and third vehicles after the first was hit violated IDF Standard Operating Procedures
      and Rules of Engagement.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Division Commander directed that no more strikes around humanitarian convoys were to occur that night.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Brigade Commander passed the Division Commander’s direction to his Chief of Staff.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Brigade staff assessed that after the white vehicles left the warehouse the situation had changed and the remaining
      vehicles became targetable.
  - id: F5
    kind: authority
    status: confirmed
    fact: The strike occurred in a humanitarian fire control zone and required Division Commander approval prior to engaging.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Brigade Fire Support Commander guided the strikes.
  considerations:
  - id: C1
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Continuing fire after the first hit was expressly prohibited by IDF SOP and ROE, making further strikes unlawful.
  - id: C2
    facts:
    - F2
    - F3
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The Division Commander issued a clear direction that no further strikes around humanitarian convoys were to occur
      that night, and that direction was passed down the chain.
  - id: C3
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Brigade staff assessed that once the white vehicles left the warehouse the tactical situation had changed and the
      remaining vehicles were now legitimate targets.
  - id: C4
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The strike zone required Division Commander approval; the commander recorded that such approval was obtained before
      the second and third vehicles were engaged.
  reasoning:
    read: The Brigade Fire Support Commander faced a conflict between an explicit higher‑level prohibition on further strikes
      and an on‑the‑ground assessment that the remaining vehicles had moved out of the protected convoy and become legitimate
      targets. The trap was to treat the Division Commander’s night‑long no‑strike direction as automatically null once the
      vehicles left the warehouse.
    weighing: The commander weighed the operational assessment (C3) and the presumed approval (C4) against the standing SOP/ROE
      prohibition (C1) and the chain‑of‑command direction (C2). Although C1 and C2 carried strong weight, the commander concluded
      that the changed situation overrode the earlier direction, leading to the strike.
    tradecraft: The decision was recorded as a fire‑control request, the Division Commander’s approval was logged, and the
      strike was executed with after‑action reporting that noted the deviation from SOP.
    uncertainty: It was unclear whether the Division Commander’s night‑long direction was a formal order or an informal guidance,
      creating ambiguity about its revocability.
    handoff: The Brigade Fire Support Commander acted alone after consulting the Brigade staff, and Division Commander approval
      was required, so the decision should have been confirmed with the Division Commander.
    tempting_wrong:
      option: O1
      pull: Adhering strictly to SOP and the Division Commander’s direction would have avoided the violation.
      why_wrong: The commander believed the tactical picture had changed sufficiently to justify striking, and therefore considered
        the prohibition no longer applicable.
    rejected:
      O1: Withholding fire would have respected the explicit no‑strike direction and SOP, but the commander judged the vehicles
        targetable after they left the warehouse.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Division Commander reaffirmed the no‑strike order after the vehicles left the warehouse.
      then: O1
      why: A clarified, formal reiteration of the prohibition would re‑establish the higher‑level authority over the tactical
        assessment.
    - id: flip2
      if: The vehicles had not left the humanitarian fire‑control zone when the first strike occurred.
      then: O1
      why: The condition that the situation changed would not be met, keeping the original prohibition in force.
    would_not_change:
    - id: noflip1
      if: The Brigade Fire Support Commander lacked any Division Commander approval for the second and third strikes.
      why: Without the required approval, the strike would remain unlawful regardless of the assessment.
    watch_for:
    - id: watch1
      what: Any subsequent clarification from the Division Commander about the scope of the no‑strike direction.
      favors:
      - O1
      why: A clarified directive would reinforce the higher‑level prohibition.
  lesson: Operational assessments do not automatically override explicit ROE or higher‑level command prohibitions; clear,
    formal approval must be obtained before deviating from a standing no‑strike direction.
  limits: This reasoning applies only when the higher‑level direction is ambiguous or potentially revocable; it does not apply
    when a formal, unequivocal prohibition is in place and no approval is granted.
