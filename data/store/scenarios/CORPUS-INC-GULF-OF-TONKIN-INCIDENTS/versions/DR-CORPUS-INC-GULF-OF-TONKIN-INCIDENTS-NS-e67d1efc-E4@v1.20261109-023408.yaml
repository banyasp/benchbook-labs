case:
  id: DR-CORPUS-INC-GULF-OF-TONKIN-INCIDENTS-NS-e67d1efc-E4@v1
  title: Self-Defense Decision at Sea
  status: draft
  setting: Pacific, about 1440G, destroyer command
  decider: The destroyer's commanding officer
  agent: The destroyer's commanding officer
  agent_role: decide
  situation: At about 1440G, a destroyer reported that high-speed boats were approaching with intent to attack. The commanding
    officer said force would be used if necessary in self-defense. The officer requested air cover from a carrier, and aircraft
    already aloft were directed toward the destroyer. A second destroyer was ordered to join it. Over the following twenty
    minutes, the boats continued closing on the destroyer.
  question: What should the destroyer's commanding officer do about defensive force against the approaching boats?
  options:
    O1:
      do: The commanding officer defers a decision on defensive force while support approaches.
      move: hold
      irreversible: false
    O2:
      do: The commanding officer denies authorization for defensive force against the approaching boats.
      move: act
      irreversible: false
    O3:
      do: The commanding officer authorizes defensive force against the approaching boats.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The destroyer assessed that high-speed boats were approaching with intent to attack.
  - id: F2
    kind: situation
    status: confirmed
    fact: The commanding officer announced that force would be used if necessary in self-defense.
  - id: F3
    kind: capability
    status: confirmed
    fact: The commanding officer requested air cover from a carrier that was 280 miles to the southeast.
  - id: F4
    kind: capability
    status: confirmed
    fact: Aircraft already aloft were directed toward the destroyer.
  - id: F5
    kind: capability
    status: confirmed
    fact: A second destroyer was ordered to join the first destroyer.
  - id: F6
    kind: situation
    status: confirmed
    fact: The approaching boats continued closing on the destroyer during the following twenty minutes.
  considerations:
  - id: C1
    facts:
    - F1
    - F6
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: The destroyer assessed that the approaching boats intended to attack, and they continued closing. Those facts support
      the commanding officer's stated self-defense rationale.
  - id: C2
    facts:
    - F2
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The commanding officer framed the use of force as conditional on necessity in self-defense, rather than as an unqualified
      decision to use force.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The commanding officer sought air cover and ordered another destroyer to join while maintaining a self-defense posture;
      these actions accompanied rather than replaced that posture.
  - id: C4
    facts:
    - F6
    equity: tempo
    favors:
    - O3
    weight: strong
    why: The boats continued closing during the ensuing period, making an indefinite deferral less consistent with the reported,
      developing threat.
  reasoning:
    read: The commanding officer faced a reported approach assessed as an intended attack, with the boats continuing to close.
      The trap is to treat support being requested and dispatched as if it removed the immediate self-defense decision.
    weighing: The assessed hostile intent and continued approach, together with the commander's expressly conditional self-defense
      rationale, support authorizing defensive force {C1} {C2}. Support was also being arranged, but those arrangements accompanied
      rather than replaced the defensive posture {C3}. The balance depends on the reported threat and its continued approach;
      no separate legal test or further assessment criteria are provided.
    tradecraft: Keep the decision tied to the reported self-defense need, distinguish authorization from an automatic direction
      to use force, and record the threat assessment and basis for the decision. These are decision-practice recommendations,
      not procedures stated in the account.
    uncertainty: The destroyer's assessment and the boats' continued approach are provided, but independent confirmation of
      intent or later reassessment is not described. The decision is therefore grounded in the information reported at the
      time.
    handoff: The decision rests with the destroyer's commanding officer. The officer coordinated for air cover and another
      destroyer, but neither support element is identified as holding or sharing the engagement decision.
    tempting_wrong:
      option: O1
      pull: Support had been requested and was on its way, which can make waiting seem prudent.
      why_wrong: The boats continued closing while the reported threat remained; the defensive posture continued alongside
        the support arrangements rather than being replaced by them.
    rejected:
      O1: Deferring while support approached was not chosen because the boats continued closing and the commanding officer
        maintained a self-defense posture.
      O2: Denying authorization would not match the commanding officer's stated intention to use force if necessary in self-defense
        against the reported approaching threat.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessed intent to attack were withdrawn or the boats ceased approaching before a decision on defensive force.
      then: O1
      why: Without the reported continuing threat, the stated self-defense rationale would provide less support for immediate
        authorization.
    - id: flip2
      if: Reliable information established that the approaching boats posed no threat.
      then: O2
      why: A finding that there was no threat would remove the factual basis for authorizing force in self-defense.
    would_not_change:
    - id: noflip1
      if: Air cover or the second destroyer remained in transit, without any change in the reported threat.
      why: Support was being arranged alongside the continuing self-defense posture, so its transit alone would not negate
        the reported threat.
    watch_for:
    - id: watch1
      what: Whether the boats continue closing or the assessment of their intent changes.
      favors:
      - O3
      - O1
      - O2
      why: Continued approach supports the self-defense rationale; changed threat information could alter the balance.
  lesson: When a commander assesses an approaching force as intending to attack and it continues to close, a conditional self-defense
    authorization can be consistent with the reported threat. Support arrangements do not by themselves resolve the immediate
    decision; the authorization should remain connected to the assessed necessity for self-defense.
  limits: This reasoning applies only to deciding whether to authorize defensive force in the described engagement, not to
    how force is employed. No broader rules of engagement, independent threat verification, or findings about the legality
    of any later action are provided.
