case:
  id: DR-CORPUS-INC-GULF-OF-TONKIN-INCIDENTS-NX-cd644e8b-E6@v1
  title: 'Closing Contacts: Hold Fire or Engage'
  status: draft
  setting: At sea, 182022H on the 18th, aboard two ships during a DESOTO situation report.
  decider: The ship's commanding officer
  agent: The ship's commanding officer
  agent_role: decide
  situation: Two ships were operating together, and both were at readiness condition one. Multiple contacts were present,
    and none showed lights. The contacts continued closing at reported speeds of 22–35 knots. Their identities had not been
    established in the information available at the decision point. The commanding officer had to decide whether to direct
    engagement or refrain from further engagement.
  question: 'What should the ship''s commanding officer do about the closing contacts: authorize engagement or prohibit it?'
  options:
    O1:
      do: The commanding officer authorizes the ships to engage the closing contacts.
      move: act
      irreversible: true
    O2:
      do: The commanding officer prohibits the ships from engaging the closing contacts.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two ships were operating together.
  - id: F2
    kind: situation
    status: confirmed
    fact: Both ships were at readiness condition one before the decision.
  - id: F3
    kind: situation
    status: confirmed
    fact: More than one contact was present.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: None of the contacts showed lights.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The contacts continued closing at reported speeds of 22–35 knots.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The contacts' identities had not been established in the information available at the decision point.
  considerations:
  - id: C1
    facts:
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The contacts continued closing at high speed; the commanding officer's stated basis for engaging was that they continued
      to close rapidly.
  - id: C2
    facts:
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The commanding officer treated the approach as a possible danger to the ships, including the possibility that the
      contacts might fire torpedoes.
  - id: C3
    facts:
    - F4
    - F6
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The contacts showed no lights and their identities were not established. The commanding officer considered that they
      might be friendly, which weighed against engagement, but did not ultimately control the decision.
  reasoning:
    read: The ships faced multiple dark contacts closing at reported high speeds, but their identities remained unresolved.
      The trap is to treat a rapidly approaching contact as confirmed hostile; the available facts do not establish that identification.
    weighing: The commanding officer's stated reasons favored protecting the ships from a possible attack and responding to
      contacts that continued closing rapidly. The possibility that the contacts were friendly was also considered, but the
      continued approach outweighed that uncertainty.
    tradecraft: 'Keep observed facts distinct from assessments: record the lack of lights, the reported approach, and the
      unresolved identities without turning uncertainty into certainty. Record who made the decision and the reasons for it,
      and reassess if material information changes.'
    uncertainty: The contacts' identities were not established at the decision point. The decision was made under that uncertainty,
      not on proof that the contacts were hostile.
    handoff: The commanding officer made the decision. No higher approval authority or consultation is identified as part
      of the decision.
    tempting_wrong:
      option: O2
      pull: Unresolved identity and the possibility that the contacts were friendly make restraint appealing.
      why_wrong: On the commanding officer's stated reasoning, restraint did not adequately address the continued rapid approach
        and the perceived danger to the ships.
    rejected:
      O2: The commanding officer did not prohibit engagement because the contacts continued closing rapidly despite the unresolved
        identification.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The contacts were affirmatively identified as friendly before the decision.
      then: O2
      why: A reliable friendly identification would resolve the identity concern and weigh against engagement.
    - id: flip2
      if: The contacts stopped closing and no longer presented a rapidly approaching situation.
      then: O2
      why: The continued rapid approach was the stated reason for directing engagement.
    would_not_change:
    - id: noflip1
      if: The contacts' identities remained unresolved and they showed no lights, with no other material change.
      why: Those uncertainties were present when the commanding officer chose engagement.
    watch_for:
    - id: watch1
      what: Whether the contacts continue closing rapidly.
      favors:
      - O1
      why: Continued rapid approach was the commanding officer's stated reason for directing engagement.
  lesson: Unresolved identity should remain unresolved in the decision record; it should not be converted into a claim of
    hostility. In this decision, continued rapid approach and perceived danger to the ships outweighed that uncertainty.
  limits: This conclusion reflects the commanding officer's recorded judgment in this situation, not a general rule that an
    unidentified or unlit contact may be engaged. A materially different identification or approach would change the balance.
