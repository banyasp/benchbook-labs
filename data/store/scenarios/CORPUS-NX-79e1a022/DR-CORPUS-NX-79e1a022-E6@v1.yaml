case:
  id: DR-CORPUS-NX-79e1a022-E6@v1
  title: The Duplicate Reports Reliability Decision
  status: draft
  setting: London, late 1924, SIS
  decider: SIS
  agent: SIS
  agent_role: decide
  situation: SIS is assessing a naval officer's organization alongside a Comintern source in Riga. The naval officer has supplied
    some information SIS already knew to be accurate, as well as two reports that closely duplicate reports from the Riga
    source. The Riga source previously supplied a disputed Comintern letter that was leaked to the press and affected the
    general election. Information from other British sources appears to support or complement the Riga reporting, but the
    support is generally indirect rather than confirmation of individual details. The authenticity of the letter remains a
    question for the reliability assessment.
  question: What should SIS do about the reliability of Riga's Comintern source and the naval officer's organization amid
    duplicated reports and unresolved questions about the disputed letter?
  options:
    O1:
      do: SIS should distrust Riga's source, treat it as distinct from the naval officer's organization, and decline to work
        with that organization.
      move: act
      irreversible: false
    O2:
      do: SIS should trust Riga's source, treat it as distinct from the naval officer's organization, and decline to work
        with that organization.
      move: act
      irreversible: false
    O3:
      do: SIS should suspend reliance on both sources and defer a reliability judgment while awaiting further independent
        corroboration.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: In late 1924, SIS was contacted in London through a War Office member by a man who appeared to represent the Trust.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The naval officer supplied some information SIS already knew to be accurate.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The naval officer provided two reports allegedly from the Comintern that were almost identical to reports previously
      provided by Riga's main source.
  - id: F4
    kind: situation
    status: confirmed
    fact: The duplication of secret material alarmed SIS.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: Riga's source had supplied a copy of a disputed Comintern letter, allegedly containing instructions about the British
      Communist Party; the letter was leaked to the press and affected the general election.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Riga's reports were not contradicted and appeared complementary to or supported by material from human sources and
      British security bodies that SIS regarded as proven.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Corroboration generally came from independent reporting on related issues rather than direct confirmation of individual
      details.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: GC&CS provided no information that illuminated the authenticity of the disputed letter.
  considerations:
  - id: C1
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: SIS trusted Riga because its reporting was not contradicted and was complementary to or supported by material from
      sources it regarded as proven.
  - id: C2
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Independent sources often addressed related parts of a broader issue rather than confirming individual details. SIS
      treated that parallel, complementary support as meaningful, while it did not establish every report's authenticity.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F8
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: strong
    why: 'The duplicated reports alarmed SIS, and the Riga source''s disputed letter had political consequences. The letter''s
      authenticity remained unresolved: GC&CS provided no information illuminating it, and SIS had an evident interest in
      defending it.'
  - id: C4
    facts:
    - F2
    - F3
    equity: security_risk
    favors:
    - O1
    - O2
    weight: weak
    why: The naval officer's accurate information did not resolve the duplication or establish the reliability of his organization.
      SIS chose not to work with that organization while treating it as distinct from the Riga source.
  reasoning:
    read: 'SIS faced two different questions: whether to trust Riga''s source and whether to work with the naval officer''s
      organization. The duplication made a connection or shared taint plausible, but SIS did not treat it as proof that Riga
      was unreliable. The disputed letter also created a risk that SIS''s interest in defending its authenticity could color
      the source assessment.'
    weighing: SIS's stated conclusion was to trust the Riga source, regard it as distinct from the naval officer's organization,
      and avoid working with that organization {O2}. The key support was that Riga's reports were not contradicted and were
      complementary to or supported by reporting from proven human sources, GC&CS, and British security services {C1}. That
      support was often indirect and concerned related issues rather than individual details {C2}. The duplication and the
      unresolved authenticity of the Zinoviev Letter remained serious cautions {C3}; they do not warrant claiming that the
      letter was definitively authenticated. The public record leaves SIS's precise rationale unclear and indicates that its
      efforts to defend the letter were not entirely rigorous.
    tradecraft: Keep the reliability assessment of Riga's source separate from the decision not to work with the naval officer's
      organization. Record which support is independent and which is only complementary, distinguish broad corroboration from
      confirmation of a particular document, and preserve the unresolved status of the letter.
    uncertainty: The public record is incomplete about SIS's relations with the naval officer and the Riga source, and it
      does not fully explain why SIS reached its judgment. The reported corroboration supports confidence in Riga's reporting
      but does not settle the authenticity of the disputed letter.
    handoff: SIS was the decision-maker in this episode. A careful assessment would keep the source-reliability judgment and
      its caveats available to the officials and consumers relying on it; the record does not establish a separate authority
      whose approval was required.
    tempting_wrong:
      option: O1
      pull: The duplicated reports, the unresolved disputed letter, and the political stakes make distrust of Riga seem like
        the safest response.
      why_wrong: That response gives the duplication and the letter's unresolved authenticity more weight than SIS gave the
        independent, complementary reporting. SIS chose to trust Riga while declining to work with the naval officer's organization,
        rather than treating the two sources as one.
    rejected:
      O1: 'SIS did not distrust Riga: it relied on the lack of contradiction and support from sources it regarded as proven,
        while treating Riga as distinct from the naval officer''s organization.'
      O3: SIS did not suspend judgment on both sources; it made a source-specific choice to trust Riga and avoid working with
        the naval officer's organization despite the remaining uncertainty.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence established that Riga's source was a conduit for false or deceptive reports, or was part of the
        naval officer's organization.
      then: O1
      why: That would directly undermine SIS's basis for trusting Riga or its conclusion that the sources were distinct.
    - id: flip2
      if: The duplicated reports were directly shown to derive from a shared deceptive source, leaving the independent support
        for Riga's reporting unreliable.
      then: O3
      why: The central support for trusting Riga would no longer be dependable, making suspension of reliance pending reassessment
        more appropriate.
    would_not_change:
    - id: noflip1
      if: The available corroboration remains indirect and concerns related issues rather than individual details.
      why: SIS's stated reasoning allowed complementary, independent reporting to support a source even without direct confirmation
        of specific points.
    - id: noflip2
      if: GC&CS provides no information illuminating the disputed letter's authenticity.
      why: That absence leaves the letter unresolved but does not, by itself, establish that Riga's source is unreliable.
    watch_for:
    - id: watch1
      what: Whether reporting from sources SIS regards as proven begins to contradict Riga on related issues.
      favors:
      - O1
      - O3
      why: The absence of contradiction was an important part of SIS's stated basis for trusting Riga.
  lesson: Assess each source separately when duplicated reporting raises the possibility of shared access or deception; duplication
    is a warning, not proof that every source is tainted. Independent, complementary reporting can support confidence without
    authenticating every document, so preserve the distinction between source reliability and the authenticity of a particular
    item.
  limits: This judgment depends on SIS's assessment that Riga's reporting was not contradicted and was supported by material
    from sources it regarded as proven. It does not establish that the disputed letter was authentic, or justify trusting
    a source when credible evidence shows deception or shared control.
