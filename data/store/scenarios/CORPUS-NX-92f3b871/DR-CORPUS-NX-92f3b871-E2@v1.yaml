case:
  id: DR-CORPUS-NX-92f3b871-E2@v1
  title: Allocating Liaison Personnel Across Echelons
  status: draft
  setting: Fort Cavazos, TX; during the final planning conference and separate wet gap crossing key leader engagement; 20th
    Engineer Battalion.
  decider: the 20th Engineer Battalion
  agent: the 20th Engineer Battalion
  agent_role: decide
  situation: During planning with foreign partners, the 20th Engineer Battalion faced a decision about liaison coverage across
    several echelons. Liaison officers had helped address coordination issues and supported shared understanding of unit capabilities,
    concepts of operations, and terminology. Personnel with broad awareness of the battalion’s operations and capabilities
    were mostly staff officers at captain rank and above. Those officers were also needed by their organic unit, limiting
    their availability for liaison assignments. British and Polish forces faced challenges in wet gap crossing operations.
    The battalion needed to determine how to distribute its limited qualified personnel, including whether to provide liaison
    coverage at division level.
  question: What should the 20th Engineer Battalion do about assigning its limited qualified personnel to liaison roles across
    company, battalion, brigade, and division levels?
  options:
    O1:
      do: The 20th Engineer Battalion concentrates liaison personnel by assigning a captain, the operations officer, and the
        battalion commander to separate liaison roles at division level.
      move: act
      irreversible: false
    O2:
      do: The 20th Engineer Battalion distributes liaison personnel by linking a captain to company and battalion levels,
        the operations officer to brigade, and the battalion commander to division.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: Liaison officers helped address previously stated issues.
  - id: F2
    kind: capability
    status: confirmed
    fact: Liaison officers supported shared reference to unit capabilities, concepts of operations, and terminology, helping
      avoid confusion and planning errors.
  - id: F3
    kind: situation
    status: confirmed
    fact: Available personnel limited the use of liaison officers.
  - id: F4
    kind: situation
    status: confirmed
    fact: Personnel with awareness of the concept of operations, battalion capabilities, and other relevant information were
      largely staff officers at captain rank and above.
  - id: F5
    kind: situation
    status: confirmed
    fact: Those staff officers were also needed by their organic unit and were therefore assigned as liaison officers sparingly.
  - id: F6
    kind: capability
    status: confirmed
    fact: Division-level expertise in wet gap crossing operations was needed, and British and Polish forces faced challenges
      in those operations.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Liaison officers had helped address coordination issues and supported a shared understanding of capabilities, concepts
      of operations, and terminology, making coverage across partner-facing echelons valuable.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: Qualified personnel were scarce, mostly captain-rank-and-above staff officers, and still needed by their organic
      units; assigning them sparingly across echelons responds to that staffing constraint.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Division-level wet-gap-crossing expertise was needed because British and Polish forces faced challenges; O2 assigns
      the battalion commander to division while retaining liaison coverage at other levels.
  reasoning:
    read: 'This is a staffing allocation problem: qualified officers are scarce and have organic-unit duties, but liaison
      coverage helps coordination with foreign partners. The trap is treating the need for division-level expertise as a reason
      to concentrate all qualified personnel there, even though the battalion''s stated allocation also serves company, battalion,
      and brigade levels.'
    weighing: The coordination benefits and limited availability of qualified staff favor distributing liaison coverage rather
      than concentrating it. The division-level need is significant, but the battalion's allocation addresses it by linking
      the battalion commander at division while placing other personnel at lower echelons. The balance depends on preserving
      that division-level expertise without abandoning coverage elsewhere.
    tradecraft: Assign the captain to company and battalion levels, the operations officer to brigade, and the battalion commander
      to division. Keep the assignment tied to the stated echelon responsibilities and record the staffing constraint and
      division-level expertise need as the allocation rationale.
    uncertainty: The source does not quantify how many qualified officers were available or compare the effectiveness of alternative
      staffing arrangements.
    handoff: The 20th Engineer Battalion made the allocation. No separate approval authority or required handoff is identified,
      so the decision remains with the battalion on the available facts.
    tempting_wrong:
      option: O1
      pull: British and Polish forces faced wet-gap-crossing challenges, and division-level expertise was necessary.
      why_wrong: That need supports placing the battalion commander at division, but does not establish that company, battalion,
        and brigade coverage should be given up; the chosen allocation addressed division while retaining coverage at those
        levels.
    rejected:
      O1: The battalion did not concentrate its qualified personnel at division; it assigned the battalion commander there
        while preserving liaison coverage at company, battalion, and brigade levels.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The operational need were limited to division-level liaison coverage, with no need for separate company, battalion,
        or brigade coverage.
      then: O1
      why: If lower-echelon liaison coverage were unnecessary, concentrating qualified personnel at division could better
        match the stated need.
    would_not_change:
    - id: noflip1
      if: Division-level wet-gap-crossing expertise remained necessary.
      why: That need alone would not require concentration at division, because O2 assigns the battalion commander there while
        retaining coverage at other levels.
    watch_for:
    - id: watch1
      what: Changes in the availability of qualified personnel or in partner needs for liaison coverage at particular echelons.
      favors:
      - O2
      - O1
      why: Either change could alter whether the layered allocation remains the best fit for the staffing constraint and operational
        need.
  lesson: When qualified personnel are scarce and needed by their organic units, allocate liaison coverage across the echelons
    that need it rather than treating one important requirement as automatically displacing all others. Preserve coverage
    at the level where specialized expertise is necessary while accounting for coordination needs elsewhere.
  limits: This reasoning applies to the stated liaison staffing tradeoff and the identified wet-gap-crossing expertise need.
    It does not establish a general staffing rule for situations with different echelon requirements, personnel availability,
    or operational priorities.
