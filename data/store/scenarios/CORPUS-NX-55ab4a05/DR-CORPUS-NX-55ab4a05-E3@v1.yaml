case:
  id: DR-CORPUS-NX-55ab4a05-E3@v1
  title: Updating Domestic Operations Guidance
  status: draft
  setting: District of Columbia; domestic civil disturbance operations; District of Columbia National Guard; time unspecified.
  decider: The District of Columbia National Guard
  agent: The District of Columbia National Guard
  agent_role: decide
  situation: The District of Columbia National Guard was preparing for domestic civil disturbance operations. It had standing
    rules-of-force and rules-of-conduct training and cards that were described as effective. Some personnel were armed. Junior
    personnel might not have prior experience on a domestic operation, and reinforcement training before domestic operations
    was considered effective.
  question: What should the District of Columbia National Guard do with its existing guidance and training materials for domestic
    operations?
  options:
    O1:
      do: The District of Columbia National Guard should retain its existing guidance and training materials, including its
        smartcards and training vignettes, unchanged.
      move: act
      irreversible: false
    O2:
      do: The District of Columbia National Guard should revise its existing guidance and training materials, including its
        smartcards and training vignettes.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The District of Columbia National Guard had effective standing rules-of-force and rules-of-conduct training.
  - id: F2
    kind: capability
    status: assessed
    fact: The District of Columbia National Guard had effective standing rules-of-force and rules-of-conduct cards.
  - id: F3
    kind: situation
    status: confirmed
    fact: Some personnel conducting domestic operations were armed.
  - id: F4
    kind: situation
    status: confirmed
    fact: The operations at issue were domestic civil disturbance operations.
  - id: F5
    kind: situation
    status: assessed
    fact: Junior personnel might not have prior experience on a domestic operation.
  - id: F6
    kind: capability
    status: assessed
    fact: Reinforcement training before domestic operations was considered effective for all personnel.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The existing training and cards were effective, but some personnel were armed, so the guidance and materials needed
      updating to address that circumstance.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The cards were updated and training vignettes adjusted to better prepare personnel for domestic civil disturbance
      operations; practicing similar situations helped them react reflexively.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Training is especially important for junior personnel who may lack domestic-operation experience, and reinforcement
      training before operations was considered effective for all personnel.
  reasoning:
    read: The Guard had effective materials, but effectiveness in the prior setting did not make them adequate unchanged once
      some personnel were armed. The decision is to adapt guidance and training for the operation, not to discard the existing
      foundation or prescribe how force is applied.
    weighing: The stated reason for updating the materials was that some personnel were armed. The adjusted cards and vignettes
      better prepared troops and leaders for civil disturbance operations, while practice supported reflexive responses. The
      case for revision is reinforced by the importance and effectiveness of pre-operation training, particularly for inexperienced
      junior personnel.
    tradecraft: Revise the materials, maintain separate smartcards for nonlethal armed and unarmed personnel, adjust training
      vignettes as needed, and reinforce training before domestic operations.
    uncertainty: The source does not specify the extent of the armed personnel or assess the revised materials with outcome
      data. It supports adapting the materials and reinforcing training, but does not provide details about rules or their
      application.
    handoff: The Guard is the identified decision-maker. The Deputy Staff Judge Advocate submitted the recommendation; the
      source identifies no separate approval authority.
    tempting_wrong:
      option: O1
      pull: The existing training and cards were described as effective, which can make retaining them unchanged seem sufficient.
      why_wrong: That overlooks the stated need to update the materials because some personnel were armed, as well as the
        benefit of adjusted vignettes and reinforcement training.
    rejected:
      O1: Retaining the materials unchanged was not chosen because the armed-personnel circumstance called for updates and
        adjusted training.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: No personnel were armed and the existing materials already matched the personnel and operation.
      then: O1
      why: The stated reason for updating the materials was that some personnel were armed; without that mismatch, retaining
        suitable effective materials would be more supportable.
    would_not_change:
    - id: noflip1
      if: The existing training and cards remain effective.
      why: Effectiveness alone would not remove the need to update materials to account for armed personnel.
    watch_for:
    - id: watch1
      what: Whether personnel are armed and whether the separate smartcards and training remain suited to the personnel conducting
        domestic operations.
      favors:
      - O2
      why: The recommendation links separate cards and adjusted training to preparing personnel for domestic operations.
  lesson: Effective existing guidance may still need revision when the personnel or circumstances of an operation change.
    Pair relevant updates with realistic practice and reinforcement, especially when personnel may lack prior experience.
  limits: This reasoning concerns adapting domestic-operation guidance and training because some personnel were armed. It
    does not resolve what the rules should contain or how force should be applied in particular situations.
