case:
  id: DR-CORPUS-NX-55ab4a05-E5@v1
  title: Kneeling for De-escalation
  status: draft
  setting: Washington, D.C., during civil disturbance operations, National Guard Bureau
  decider: National Guard Bureau
  agent: National Guard Bureau
  agent_role: advise
  situation: During civil disturbance operations in Washington, D.C., a question arose about whether a Soldier could take
    a knee. The gesture was under consideration as a way to de-escalate a situation. There was concern that taking a knee
    in uniform could be viewed as joining ongoing political protests. Participation in a political protest while in uniform
    would violate Department of Defense and Army regulations, and the National Guard Bureau reviewed whether the gesture fell
    within that prohibition.
  question: What should the National Guard Bureau advise about permitting or prohibiting Soldiers from taking a knee during
    civil disturbance operations in Washington, D.C.?
  options:
    O1:
      do: The National Guard Bureau prohibits Soldiers from taking a knee during civil disturbance operations.
      move: act
      irreversible: false
    O2:
      do: The National Guard Bureau permits Soldiers to take a knee during civil disturbance operations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Civil disturbance operations were being conducted in Washington, D.C.
  - id: F2
    kind: situation
    status: confirmed
    fact: A question arose about whether a Soldier could take a knee while conducting civil disturbance operations.
  - id: F3
    kind: situation
    status: confirmed
    fact: Taking a knee was considered as a way to de-escalate a situation.
  - id: F4
    kind: situation
    status: confirmed
    fact: There was concern that taking a knee could be considered participation in ongoing protests while in uniform.
  - id: F5
    kind: authority
    status: confirmed
    fact: Department of Defense and Army regulations prohibit participation in political protests while in uniform.
  - id: F6
    kind: authority
    status: confirmed
    fact: The National Guard Bureau reviewed whether taking a knee during civil disturbance operations constituted participation
      in ongoing protests.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: Participation in a political protest while in uniform is prohibited. The concern therefore matters if taking a knee
      in the circumstances amounts to such participation.
  - id: C2
    facts:
    - F2
    - F3
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The gesture was being considered as a means of de-escalation during civil disturbance operations, rather than as
      an end in itself.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: After review, the National Guard Bureau concluded that taking a knee to de-escalate during these operations would
      not constitute participation in ongoing protests, resolving the stated regulatory concern.
  reasoning:
    read: The issue is whether taking a knee in this operational context is de-escalation or participation in a political
      protest while in uniform. The trap is to treat the gesture itself as necessarily political, or to disregard the prohibition
      simply because de-escalation is intended.
    weighing: The prohibition on uniformed participation in political protests is an important boundary {C1}. But the gesture
      was considered for de-escalation {C2}, and the National Guard Bureau reviewed the concern and opined that this use would
      not be participation in ongoing protests {C3}. On that stated assessment, permitting the gesture is the supported outcome;
      the balance depends on the gesture being used to de-escalate during operations, not to join a protest.
    tradecraft: 'State the permission in the terms of the reviewed distinction: taking a knee to de-escalate during civil
      disturbance operations is not, on this assessment, participation in ongoing protests. Preserve the regulatory boundary
      and the basis for distinguishing the operational use from protest participation.'
    uncertainty: The source records a review and opinion, but does not provide a broader test for every circumstance in which
      a Soldier might take a knee. The conclusion should not be extended beyond the de-escalation context described.
    handoff: The National Guard Bureau conducted the review and issued the opinion. Further legal review would be appropriate
      if materially different circumstances raise a new question about whether conduct constitutes protest participation.
    tempting_wrong:
      option: O1
      pull: Prohibiting the gesture may seem the safest way to avoid any appearance of political participation in uniform.
      why_wrong: The Bureau reviewed that concern and concluded that taking a knee to de-escalate during civil disturbance
        operations would not be participation in ongoing protests.
    rejected:
      O1: The Bureau did not choose a categorical prohibition because it concluded that taking a knee for de-escalation in
        this context was not participation in ongoing protests.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The gesture in the circumstances were participation in a political protest while in uniform, rather than an operational
        act to de-escalate.
      then: O1
      why: The stated Department of Defense and Army prohibition would then apply.
    would_not_change:
    - id: noflip1
      if: There remained a general concern that taking a knee could be perceived as joining protests, but the circumstances
        and de-escalation purpose remained as reviewed.
      why: Concern alone would not displace the Bureau's conclusion that this operational use was not participation in ongoing
        protests.
    watch_for:
    - id: watch1
      what: Whether the gesture is being used to de-escalate during operations or instead to participate in a political protest
        while in uniform.
      favors:
      - O2
      - O1
      why: The distinction determines whether the gesture is a de-escalation measure or prohibited protest participation.
  lesson: Apply a uniformed-participation prohibition to the conduct as used in context, rather than assuming a gesture is
    either always political or always operational. Where the competent reviewing authority concludes that a de-escalatory
    use does not constitute protest participation, preserve that distinction while retaining the prohibition for conduct that
    does.
  limits: This conclusion concerns taking a knee as a de-escalation measure during civil disturbance operations in Washington,
    D.C. It does not establish that taking a knee in other contexts, or for a different purpose, is permissible.
