case:
  id: DR-OGE-2635-206-flip1@v1
  title: Disposition of $200 Barometer Gift [flip]
  status: needs_review
  setting: U.S. National Park Service, present day, federal land-management agency
  decider: Park Service staff member
  agent: Park Service staff member
  agent_role: decide
  situation: A staff member of the National Park Service was presented with a barometer valued at $200 by a prohibited source
    after concluding a briefing on federal land policy. The employee did not refuse the gift to avoid a public scene. Because
    the barometer's market price exceeds $100, it cannot be destroyed under the ethics rule. The regulation requires prompt
    return or reimbursement unless the agency possesses statutory authority to accept the item, and the agency does have such
    authority for equipment gifts.
  question: How should the employee dispose of the barometer?
  options:
    O1:
      do: Reimburse the donor $200 for the barometer.
      move: act
      irreversible: true
    O2:
      do: Return the barometer to the donor.
      move: act
      irreversible: true
    O3:
      do: Accept the barometer for agency use.
      move: act
      irreversible: true
    O4:
      do: Request guidance from the agency ethics official.
      move: ask
      irreversible: false
      to: agency ethics official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A staff member of the National Park Service was presented with a barometer valued at $200 by a prohibited source
      after concluding a briefing on federal land policy.
  - id: F2
    kind: capability
    status: confirmed
    fact: Because its market price exceeds $100, the barometer cannot be destroyed under the ethics rule §2635.206(a)(1).
  - id: F3
    kind: authority
    status: confirmed
    fact: Section §2635.206(a)(1) requires the employee to promptly return a tangible gift to the donor or to pay the donor
      its fair market value; destruction is allowed only for items worth $100 or less.
  - id: F4
    kind: authority
    status: confirmed
    fact: The National Park Service is granted statutory gift‑acceptance authority under 16 U.S.C. § 496b, which expressly
      permits the agency to accept equipment gifts such as a barometer for agency use.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee chose not to refuse the barometer in order to avoid creating a scene.
  - id: F6
    kind: authority
    status: confirmed
    fact: The employee must resolve the disposition of the gift irrespective of any later corrective or disciplinary measures.
  considerations:
  - id: C1
    facts:
    - F3
    - F2
    equity: lawful_authority
    favors:
    - O2
    - O3
    weight: strong
    why: §2635.206(a)(1) mandates return or reimbursement for tangible gifts over $100, but it also permits agency acceptance
      when a specific statutory authority exists, making both returning and accepting permissible routes.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Statute 16 U.S.C. § 496b explicitly authorizes the Park Service to accept equipment gifts such as a barometer for
      official use, satisfying the statutory-authority condition of the ethics rule.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The duty to dispose of the gift promptly can be satisfied by exercising the authorized acceptance, which avoids the
      additional step of returning or reimbursing and immediately puts the instrument to agency work.
  - id: C4
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Avoiding embarrassment is not a recognized exemption under the ethics regulation and therefore does not justify retaining
      the gift.
  reasoning:
    read: The employee received a $200 barometer from a prohibited source and chose not to decline it to avoid a scene. The
      ethics rule requires prompt disposition, but the agency holds explicit statutory authority to accept equipment gifts,
      which makes agency acceptance a lawful and efficient option.
    weighing: 'Strong considerations C1, C2, and C3 each support agency acceptance: the rule permits acceptance when statutory
      authority exists (C2), the rule''s default return/reimburse requirement does not preclude acceptance under that authority
      (C1), and the obligation to act swiftly is satisfied by immediate acceptance (C3). The weak social-pressure argument
      in C4 does not outweigh these legal and operational factors, leading to acceptance as the optimal course.'
    tradecraft: The employee should document the statutory authority, record the acceptance in the agency's asset register,
      and notify the ethics official of the action, thereby complying with both the rule and internal reporting requirements.
    uncertainty: Low; the statutory provision and the ethics rule together clearly allow acceptance.
    handoff: The employee may complete the acceptance independently but should copy the agency ethics official and supervisor
      on the acceptance record to ensure transparency.
    tempting_wrong:
      option: O2
      pull: Returning the barometer would avoid any appearance of impropriety and eliminates the need for asset tracking.
      why_wrong: Because the agency already has clear statutory authority to keep the instrument, returning it forfeits a
        useful resource without any regulatory benefit.
    rejected:
      O1: Reimbursement meets the rule's requirement but adds unnecessary administrative burden when the agency can lawfully
        retain the item.
      O4: Seeking additional guidance would delay a decision that the regulation already resolves in favor of acceptance.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: If the Park Service lacked any statutory gift-acceptance authority for equipment gifts, then returning the barometer
        would be the correct action.
      then: O2
      why: Without statutory authority the only permissible disposition under §2635.206(a)(1) is return or reimbursement.
    would_not_change:
    - id: noflip1
      if: If the donor refuses to take the barometer back.
      why: The employee may still satisfy the requirement by reimbursing the donor the market value.
    watch_for:
    - id: watch1
      what: Attempts to justify keeping the gift on the basis of avoiding embarrassment.
      favors:
      - O3
      why: Social pressure is not a recognized exception in the regulation.
  lesson: When a prohibited tangible gift exceeds $100, the employee must act promptly. If the agency holds explicit statutory
    authority to accept the item, acceptance for official use satisfies the rule; otherwise the gift must be returned or reimbursed.
  limits: This guidance applies only to tangible gifts from prohibited sources under 5 CFR 2635.206. It does not cover perishable
    items, intangible benefits, gifts from foreign governments, or situations where a different statutory authority overrides
    the provision.
