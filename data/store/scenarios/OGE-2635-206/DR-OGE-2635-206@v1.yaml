case:
  id: DR-OGE-2635-206@v1
  title: Disposition of $200 Barometer Gift
  status: draft
  setting: National Park Service, present, federal agency
  decider: National Park Service employee
  agent: National Park Service employee
  agent_role: decide
  situation: An employee of the National Park Service received a barometer valued at $200 from a prohibited source at the
    conclusion of a speech on Federal lands policy. The employee did not decline the gift in order to avoid public embarrassment.
    The barometer’s market value exceeds $100, so it cannot be destroyed under the applicable ethics regulation. The regulation
    requires the employee to promptly return the tangible item to the donor or reimburse the donor its market value, unless
    agency statutory authority permits acceptance. The agency may also choose to accept the gift if authorized by specific
    statutory gift‑acceptance authority.
  question: What should the employee do with the barometer?
  options:
    O1:
      do: The employee reimburses the donor $200 for the barometer.
      move: act
      irreversible: true
    O2:
      do: The employee returns the barometer to the donor.
      move: act
      irreversible: true
    O3:
      do: The employee accepts the barometer for agency use.
      move: act
      irreversible: true
    O4:
      do: The employee asks the agency ethics official for guidance.
      move: ask
      irreversible: false
      to: agency ethics official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A National Park Service employee received a barometer worth $200 from a prohibited source at the conclusion of a
      speech on Federal lands policy.
  - id: F2
    kind: capability
    status: confirmed
    fact: The barometer’s market value exceeds $100, so it cannot be destroyed under §2635.206(a)(1).
  - id: F3
    kind: authority
    status: confirmed
    fact: Under §2635.206(a)(1), the employee must promptly return any tangible item to the donor or pay the donor its market
      value; destruction is allowed only for items valued at $100 or less.
  - id: F4
    kind: authority
    status: confirmed
    fact: The agency may accept the gift if permitted under specific statutory gift‑acceptance authority.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee did not decline the barometer to avoid public embarrassment.
  - id: F6
    kind: authority
    status: confirmed
    fact: The employee is obligated to dispose of the gift independent of any corrective or disciplinary action.
  considerations:
  - id: C1
    facts:
    - F3
    - F2
    equity: lawful_authority
    favors:
    - O2
    - O1
    weight: strong
    why: §2635.206(a)(1) expressly requires the employee to promptly return a tangible gift or reimburse its market value;
      destruction is prohibited for items over $100.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The regulation allows agency acceptance only when a specific statutory gift‑acceptance authority exists; absent such
      authority, the default disposition is return or reimbursement.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The obligation to dispose of the gift is independent of any corrective or disciplinary action, so the employee must
      act immediately regardless of later consequences.
  - id: C4
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Avoiding public embarrassment does not constitute a permissible exception under the ethics regulation.
  - id: C5
    facts:
    - F1
    equity: due_process
    favors:
    - O2
    - O1
    weight: weak
    why: The donor’s identity and the tangible nature of the barometer trigger the specific procedural requirements of the
      subpart.
  reasoning:
    read: The employee accepted a $200 barometer from a prohibited source to avoid embarrassment. The trap is assuming the
      gift can be kept because refusing might look rude, but the regulation mandates disposition regardless of social pressure.
    weighing: The strong considerations C1, C2, and C3—derived directly from §2635.206(a)(1) and the independence clause—overwhelm
      the weak social‑pressure argument in C4. Because no statutory authority to accept the barometer is cited, the employee
      must return it (or reimburse), per the source’s example. The balance therefore points to returning the item.
    tradecraft: The employee should promptly contact the donor, arrange for the barometer’s return (using penalty mail if
      needed), and send an electronic record of the action to the agency ethics official and supervisor as required by §2635.206(d).
    uncertainty: Minimal; the regulation is clear on the required disposition for tangible gifts over $100.
    handoff: The employee may act alone to return the gift but should copy the agency ethics official and supervisor to document
      compliance, satisfying the encouragement to record actions.
    tempting_wrong:
      option: O3
      pull: Keeping the barometer for personal or agency use appears convenient and avoids embarrassment.
      why_wrong: Without a specific statutory gift‑acceptance authority, retaining the barometer violates §2635.206(a)(1).
    rejected:
      O1: Reimbursement is permissible but returning the gift directly fulfills the primary requirement and avoids the extra
        step of paying the donor.
      O3: Acceptance is only allowed if a statutory authority exists, which is not present here.
      O4: Guidance is helpful, but the regulation already provides a clear mandatory action; waiting for advice would delay
        the required prompt return.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The National Park Service possesses a specific statutory gift‑acceptance authority that permits acceptance of the
        barometer.
      then: O3
      why: The regulation expressly allows agency acceptance when authorized by statute.
    would_not_change:
    - id: noflip1
      if: The donor refuses a return of the barometer.
      why: The employee may still satisfy the requirement by reimbursing the donor the market value.
    watch_for:
    - id: watch1
      what: Attempts to justify keeping the gift on the basis of avoiding embarrassment.
      favors:
      - O3
      why: Social pressure is not a recognized exception in the regulation.
  lesson: When a prohibited tangible gift exceeds $100, the employee must promptly return it (or reimburse the donor); destruction
    is not allowed and acceptance requires explicit statutory authority.
  limits: This rule applies only to tangible gifts from prohibited sources under 5 CFR 2635.206. It does not govern perishable
    items, intangible benefits, or gifts from foreign governments, nor does it override a specific statutory gift‑acceptance
    authority that may exist.
