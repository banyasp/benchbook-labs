case:
  id: DR-OGE-2635-206-revise1@v1
  title: Disposition of $200 Barometer Gift [revise]
  status: needs_review
  setting: National Park Service, present, federal agency
  decider: National Park Service employee
  agent: National Park Service employee
  agent_role: decide
  situation: An employee of the National Park Service received a barometer valued at $200 from a prohibited source at the
    conclusion of a speech on Federal lands policy. The employee did not decline the gift in order to avoid public embarrassment.
    The barometer’s market value exceeds $100, so it cannot be destroyed under the applicable ethics regulation. The regulation
    requires the employee to promptly return the tangible item to the donor or reimburse the donor its market value, unless
    agency statutory authority permits acceptance. The agency may also choose to accept the gift if authorized by specific
    statutory gift‑acceptance authority.
  question: What should the employee do with the barometer?
  options:
    O1:
      do: The employee reimburses the donor $200 for the barometer.
      move: act
      irreversible: true
    O2:
      do: The employee returns the barometer to the donor.
      move: act
      irreversible: true
    O3:
      do: The employee accepts the barometer for agency use.
      move: act
      irreversible: true
    O4:
      do: The employee asks the agency ethics official for guidance.
      move: ask
      irreversible: false
      to: agency ethics official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A National Park Service employee received a barometer worth $200 from a prohibited source at the conclusion of a
      speech on Federal lands policy.
  - id: F2
    kind: capability
    status: confirmed
    fact: The barometer’s market value exceeds $100, so it cannot be destroyed under §2635.206(a)(1).
  - id: F3
    kind: authority
    status: confirmed
    fact: Under §2635.206(a)(1), the employee must promptly return any tangible item to the donor or pay the donor its market
      value; destruction is allowed only for items valued at $100 or less.
  - id: F4
    kind: authority
    status: confirmed
    fact: The agency may accept the gift if permitted under specific statutory gift‑acceptance authority.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee did not decline the barometer to avoid public embarrassment.
  - id: F6
    kind: authority
    status: confirmed
    fact: The employee is obligated to dispose of the gift independent of any corrective or disciplinary action.
  considerations:
  - id: C1
    facts:
    - F3
    - F2
    equity: lawful_authority
    favors:
    - O2
    - O1
    weight: strong
    why: §2635.206(a)(1) expressly requires the employee to promptly return a tangible gift or reimburse its market value;
      destruction is prohibited for items over $100.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: Statutory gift-acceptance authority permits the agency to keep the barometer for official use, making acceptance
      the appropriate disposition.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The obligation to dispose of the gift is independent of any corrective or disciplinary action, so the employee must
      act immediately regardless of later consequences.
  - id: C4
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Avoiding public embarrassment does not constitute a permissible exception under the ethics regulation.
  - id: C5
    facts:
    - F1
    equity: due_process
    favors:
    - O2
    - O1
    weight: weak
    why: The donor’s identity and the tangible nature of the barometer trigger the specific procedural requirements of the
      subpart.
  - id: C6
    facts:
    - F4
    - F1
    equity: mission_value
    favors:
    - O3
    weight: strong
    why: The barometer directly supports the Park Service's scientific monitoring mission and the agency's statutory authority
      allows acceptance of gifts that further its mission.
  reasoning:
    read: An employee received a $200 barometer from a prohibited source after a policy speech. The item exceeds $100, so
      destruction is barred. The regulation requires return or reimbursement unless a specific statutory authority allows
      agency acceptance.
    weighing: C6 is a strong consideration that the barometer furthers the agency's mission and is covered by the agency's
      statutory gift-acceptance authority. C2, now weak but favoring O3, reinforces that authority. These outweigh the earlier
      strong considerations that only required return when authority is absent. Because authority exists, acceptance for agency
      use is the correct outcome.
    tradecraft: The employee should log the receipt, notify the agency ethics official, and formally record the acceptance
      in the agency's gift-acceptance register. The barometer should be placed in the appropriate scientific inventory and
      used for park-service monitoring activities.
    uncertainty: Low; the statutory authority and mission relevance are clear, leaving little ambiguity about the proper disposition.
    handoff: The employee documents the acceptance and copies the ethics official and supervisor on the inventory entry, ensuring
      transparent oversight.
    tempting_wrong:
      option: O2
      pull: Returning the barometer seems to follow the default rule and avoids any perception of impropriety.
      why_wrong: When statutory authority exists, returning the gift unnecessarily discards valuable equipment that advances
        the agency's mission.
    rejected:
      O1: Reimbursement is unnecessary because the agency is authorized to keep the barometer, avoiding an extra payment to
        the donor.
      O4: Guidance is already embedded in the statutory authority; seeking additional advice would only delay the permitted
        acceptance.
      O2: Returning the barometer would forfeit a useful scientific tool despite the agency's authority to accept it.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: The agency’s statutory gift‑acceptance authority is later determined not to apply to scientific equipment.
      then: O2
      why: Without applicable authority, the employee must return the barometer to comply with §2635.206(a)(1).
    would_not_change:
    - id: noflip1
      if: The donor refuses a return of the barometer.
      why: The employee may still satisfy the requirement by reimbursing the donor the market value.
    watch_for:
    - id: watch1
      what: Attempts to justify keeping the gift on the basis of avoiding embarrassment.
      favors:
      - O3
      why: Social pressure is not a recognized exception in the regulation.
  lesson: When statutory gift-acceptance authority exists, an agency may accept a tangible gift over $100 for official use,
    even if the donor is a prohibited source.
  limits: Applies only to tangible gifts from prohibited sources under 5 CFR 2635.206 where the agency has explicit statutory
    authority to accept the item for mission-related purposes.
