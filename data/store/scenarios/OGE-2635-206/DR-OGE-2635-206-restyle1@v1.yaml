case:
  id: DR-OGE-2635-206-restyle1@v1
  title: Disposition of $200 Barometer Gift [restyle]
  status: needs_review
  setting: U.S. Department of the Interior, National Park Service, current fiscal year
  decider: Park Service staff member
  agent: Park Service staff member
  agent_role: decide
  situation: A staffer for the National Park Service was presented with a barometer valued at $200 by a prohibited source
    after concluding a briefing on federal land policy. The employee did not refuse the item to avoid causing a scene. Because
    the barometer's market price exceeds $100, the ethics rule bars its destruction. The rule obliges the employee to either
    return the tangible item promptly to the donor or reimburse the donor for its market value, unless a specific statutory
    gift-acceptance authority permits agency acceptance. The agency may also elect to keep the gift if such authority exists.
  question: How should the staff member handle the barometer?
  options:
    O1:
      do: Reimburse the donor the $200 market value of the barometer.
      move: act
      irreversible: true
    O2:
      do: Return the barometer to the donor without delay.
      move: act
      irreversible: true
    O3:
      do: Retain the barometer for use by the agency.
      move: act
      irreversible: true
    O4:
      do: Seek direction from the agency's ethics official before acting.
      move: ask
      irreversible: false
      to: agency ethics official
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A National Park Service staffer received a barometer worth $200 from a prohibited source after a briefing on federal
      lands policy.
  - id: F2
    kind: capability
    status: confirmed
    fact: The barometer's market price exceeds $100, so it cannot be destroyed under §2635.206(a)(1).
  - id: F3
    kind: authority
    status: confirmed
    fact: Section §2635.206(a)(1) requires the employee to promptly return any tangible gift to the donor or pay the donor
      its market value; destruction is allowed only for items valued at $100 or less.
  - id: F4
    kind: authority
    status: confirmed
    fact: The agency may accept the gift only when a specific statutory gift-acceptance authority is in place.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee did not decline the barometer in order to avoid public embarrassment.
  - id: F6
    kind: authority
    status: confirmed
    fact: The employee must dispose of the gift irrespective of any later corrective or disciplinary measures.
  considerations:
  - id: C1
    facts:
    - F3
    - F2
    equity: lawful_authority
    favors:
    - O2
    - O1
    weight: strong
    why: §2635.206(a)(1) explicitly mandates that a tangible gift exceeding $100 be either returned promptly or reimbursed;
      destruction is prohibited for such items.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Agency acceptance is permissible solely when a distinct statutory gift-acceptance authority exists; lacking that
      authority, the default course is return or reimbursement.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The duty to dispose of the gift is independent of any future corrective action, so the employee must act immediately.
  - id: C4
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Avoiding embarrassment does not constitute a recognized exception under the ethics regulation.
  - id: C5
    facts:
    - F1
    equity: due_process
    favors:
    - O2
    - O1
    weight: weak
    why: The donor's identity and the tangible nature of the barometer trigger the specific procedural requirements of the
      subpart.
  reasoning:
    read: The staffer accepted a $200 barometer from a prohibited source to sidestep an awkward refusal. The pitfall is assuming
      the gift can be kept because declining might seem rude, yet the regulation compels disposition regardless of social
      pressure.
    weighing: Strong considerations C1, C2, and C3—directly drawn from §2635.206(a)(1) and the independence clause—outweigh
      the weak social-pressure argument in C4. Because no statutory authority to accept the barometer is cited, the employee
      must return it (or reimburse), per the rule's example. Thus the balance points to returning the item.
    tradecraft: The employee should contact the donor promptly, arrange for the barometer's return (using registered mail
      if necessary), and forward an electronic record of the transaction to the agency's ethics official and the employee's
      supervisor as required by §2635.206(d).
    uncertainty: Minimal; the regulation clearly dictates the required disposition for tangible gifts over $100.
    handoff: The employee may execute the return independently but should copy the ethics official and supervisor to document
      compliance, satisfying the policy's documentation encouragement.
    tempting_wrong:
      option: O3
      pull: Keeping the barometer for personal or agency use seems convenient and avoids the awkwardness of a return.
      why_wrong: Without a specific statutory gift-acceptance authority, retaining the barometer violates §2635.206(a)(1).
    rejected:
      O1: Reimbursement is allowable, yet returning the gift directly fulfills the primary requirement and avoids the extra
        step of paying the donor.
      O3: Acceptance is permissible only if a statutory authority exists, which is not present in this case.
      O4: While guidance can be useful, the regulation already provides a clear mandatory action; waiting for advice would
        postpone the required prompt return.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The National Park Service possesses a specific statutory gift-acceptance authority that permits acceptance of the
        barometer.
      then: O3
      why: The regulation expressly allows agency acceptance when authorized by statute.
    would_not_change:
    - id: noflip1
      if: The donor refuses to take back the barometer.
      why: The employee may still satisfy the requirement by reimbursing the donor the market value.
    watch_for:
    - id: watch1
      what: Attempts to justify retaining the gift on the grounds of avoiding embarrassment.
      favors:
      - O3
      why: Social pressure is not recognized as an exception in the regulation.
  lesson: When a prohibited tangible gift exceeds $100, the employee must promptly return it (or reimburse the donor); destruction
    is prohibited and acceptance requires explicit statutory authority.
  limits: This principle applies solely to tangible gifts from prohibited sources under 5 CFR 2635.206. It does not cover
    perishable items, intangible benefits, or gifts from foreign governments, nor does it override a specific statutory gift-acceptance
    authority that may exist.
