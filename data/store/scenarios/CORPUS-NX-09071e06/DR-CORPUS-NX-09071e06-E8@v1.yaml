case:
  id: DR-CORPUS-NX-09071e06-E8@v1
  title: Timing the Philippine Campaign
  status: draft
  setting: Philippine campaign; military command
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: During the Philippine campaign, the Commander faced a decision about the timing of an operation. ULTRA information
    concerned Japanese strength in Manila. The information indicated that postponing the attack to await reinforcements was
    warranted. The operation was already scheduled, and preserving its timetable was a competing consideration.
  question: What should the Commander do about the operation’s timing?
  options:
    O1:
      do: The Commander delays the attack until reinforcements arrive.
      move: act
      irreversible: false
    O2:
      do: The Commander proceeds with the attack on the scheduled timetable.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The timing decision arose during the Philippine campaign.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: ULTRA information concerned Japanese strength in Manila.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The information indicated that Japanese strength warranted postponing an attack.
  - id: F4
    kind: situation
    status: confirmed
    fact: Postponement would allow time to wait for reinforcements.
  - id: F5
    kind: situation
    status: confirmed
    fact: The operation had a scheduled timetable.
  - id: F6
    kind: situation
    status: confirmed
    fact: Preserving the operation’s timetable was the stated reason for proceeding as scheduled.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Preserving the operation’s existing timetable was the stated reason for proceeding as scheduled.
  - id: C2
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The ULTRA information indicated Japanese strength that warranted postponement; that assessment weighed in favor of
      delaying rather than proceeding on schedule.
  - id: C3
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Waiting for reinforcements was the stated response to the assessed strength in Manila, though the Commander chose
      not to let that consideration hold up the timetable.
  reasoning:
    read: 'This is a command judgment about timing: assessed Japanese strength supported waiting for reinforcements, while
      the scheduled timetable pulled toward proceeding. The trap is treating the schedule as automatically decisive without
      weighing the intelligence assessment.'
    weighing: The information indicated that postponement was warranted, and waiting would allow reinforcements to arrive
      {C2} {C3}. The Commander nevertheless proceeded because preserving the timetable was the stated reason {C1}. The recorded
      balance therefore favors {O2}, but depends on the timetable being important enough to outweigh the assessed case for
      delay.
    tradecraft: 'Before acting, make the timing rationale explicit: record the strength assessment, the reason for any proposed
      delay, and why the timetable is being preserved or changed. Revisit the timing if the assessment or the operational
      schedule changes.'
    uncertainty: The account gives the stated rationale and the assessment that delay was warranted, but does not explain
      the timetable’s underlying importance or provide a fuller comparison of the risks of proceeding and waiting.
    handoff: The Commander holds the timing decision in this scenario. Consulting the relevant intelligence and operational
      advisers before finalizing the balance would help clarify the assessment and timetable consequences; this consultation
      is a decision practice, not a step stated in the account.
    tempting_wrong:
      option: O1
      pull: The intelligence indicated that Japanese strength warranted waiting for reinforcements.
      why_wrong: Relative to the recorded outcome, delay was not chosen because the Commander gave priority to preserving
        the operation’s timetable.
    rejected:
      O1: The Commander did not delay to await reinforcements because he insisted that the operation proceed on its scheduled
        timetable.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The timetable no longer required proceeding on schedule, while the assessed Japanese strength still warranted waiting
        for reinforcements.
      then: O1
      why: Without the stated timetable reason, the recorded case for postponement would carry greater weight.
    - id: flip2
      if: The assessment of Japanese strength changed so that postponement was no longer warranted.
      then: O2
      why: The principal stated reason for delay would no longer apply, leaving preservation of the timetable as the stated
        reason to proceed.
    would_not_change:
    - id: noflip1
      if: The information remained about Japanese strength in Manila and continued to indicate that delay was warranted.
      why: The fact that the information was ULTRA would not, by itself, resolve the timing choice; the recorded tension between
        the assessment and the timetable would remain.
    watch_for:
    - id: watch1
      what: Whether the assessment still warrants postponement and whether the scheduled timetable remains important.
      favors:
      - O1
      - O2
      why: Those are the competing considerations stated for the timing decision.
  lesson: 'A schedule is a reason to proceed, not an automatic answer to a decision informed by intelligence. Make the tradeoff
    explicit: preserve the timetable only after weighing the assessed need for delay and the opportunity to wait for reinforcements.'
  limits: This reasoning addresses only the timing choice described here. The account does not establish the timetable’s operational
    necessity, the consequences of delay, or a general rule for resolving conflicts between schedules and intelligence.
