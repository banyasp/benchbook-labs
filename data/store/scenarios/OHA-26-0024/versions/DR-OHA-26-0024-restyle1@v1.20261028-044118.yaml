case:
  id: DR-OHA-26-0024-restyle1@v1
  title: Restoration of Access Authorization under Guideline G [restyle]
  status: needs_review
  setting: Department of Energy, Office of Hearings and Appeals – June 2026
  decider: Presiding Administrative Law Judge
  agent: Presiding Administrative Law Judge
  agent_role: decide
  situation: On June 16, 2024, the employee recorded breath-alcohol concentrations of .043, .039, and .032 during a workplace
    test, exceeding the permissible threshold. An October 2024 evaluation by a DOE-contracted psychologist diagnosed the employee
    with moderate Alcohol Use Disorder. The employee subsequently finished an intensive outpatient treatment program between
    December 2024 and March 2025 and supplied a certificate of completion. From December 2024 through January 2026, the employee
    submitted thirteen consecutive monthly PEth laboratory results, each returning a negative finding. The psychologist's
    treatment plan called for continued abstinence, monthly PEth monitoring for twelve months, after-care services, and participation
    in Alcoholics Anonymous; the employee complied with every element except the AA meetings. The employee's spouse testified
    that the employee has refrained from alcohol for almost two years and that his conduct has markedly improved. The Local
    Security Office issued a Notification Letter expressing substantial doubt regarding the employee's eligibility under Guideline
    G.
  question: What action should the Presiding Administrative Law Judge take concerning the employee's security access authorization?
  options:
    O1:
      do: Hold the case pending until additional supporting evidence is received.
      move: hold
      irreversible: false
    O2:
      do: Restore the employee's security access authorization without conditions.
      move: act
      irreversible: true
    O3:
      do: Restore the employee's security access authorization with specified conditions.
      move: act
      irreversible: false
    O4:
      do: Reject the employee's request for security access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee recorded breath-alcohol levels of .043, .039, and .032 on June 16, 2024, during a workplace screening.
  - id: F2
    kind: situation
    status: confirmed
    fact: A psychologist issued an October 2024 report diagnosing the employee with moderate Alcohol Use Disorder.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee completed an intensive outpatient treatment program from December 2024 through March 2025 and provided
      a completion certificate.
  - id: F4
    kind: situation
    status: confirmed
    fact: Thirteen monthly PEth specimens submitted by the employee from December 2024 through January 2026 all yielded negative
      results.
  - id: F5
    kind: situation
    status: assessed
    fact: The psychologist's recommendation included continued abstinence, monthly PEth testing for one year, after-care,
      and AA attendance; the employee adhered to every recommendation except attending AA meetings.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee's spouse testified that the employee has not consumed alcohol for nearly two years and has demonstrated
      improved behavior.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the employee's eligibility
      under Guideline G.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations governing access authorization impose a presumption against granting or restoring clearance and
      require mitigation of Guideline G concerns.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The documented breath-alcohol violations and the psychologist's diagnosis of moderate Alcohol Use Disorder constitute
      a Guideline G security concern under conditions (b) and (d), which traditionally support a denial of access.
  - id: C2
    facts:
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Successful completion of the intensive outpatient program, corroborated by the therapist's testimony, and the psychologist's
      acknowledgment that the employee has taken initial steps toward rehabilitation satisfy mitigating condition (d).
  - id: C3
    facts:
    - F4
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Thirteen successive monthly PEth tests, each negative, provide objective proof of a full year of abstinence in line
      with the psychologist's prescribed treatment plan.
  - id: C4
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Both the psychologist and the employee's spouse attest to ongoing sobriety, sound judgment, and a robust support
      network, reinforcing the assessment of low risk.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: DOE regulations establish a presumption against clearance but expressly permit mitigation under Guideline G when
      conditions (b) and (d) are satisfied; the Judge finds those conditions met.
  reasoning:
    read: The employee's initial alcohol-related incident created a substantial doubt under Guideline G, yet the record now
      reflects continuous abstinence, successful treatment, and professional endorsements of rehabilitation.
    weighing: While C1 establishes the baseline security concern, C2 through C5 collectively demonstrate that the mitigating
      conditions identified in the Adjudicative Guidelines (b) and (d) are satisfied. Accordingly, the Judge balances the
      presumption against clearance against the concrete evidence of rehabilitation and determines that the balance favors
      restoration.
    tradecraft: The determination is entered in the Administrative Judge's formal Decision, citing the relevant exhibits and
      transcript pages that substantiate each finding, and is recorded in the DOE personnel security system as a restoration
      of access authorization.
    uncertainty: The sole remaining uncertainty concerns the potential for future relapse, which is mitigated by the ongoing
      after-care arrangement and the requirement for monthly PEth testing.
    handoff: The Judge decides unilaterally, as authorized by 10 C.F.R. § 710.25(d)-(g); no additional agency review is required
      unless an appeal is filed.
    tempting_wrong:
      option: O4
      pull: The initial positive breath-alcohol results and diagnosis could tempt a default denial under the presumption against
        clearance.
      why_wrong: That course would disregard the substantial mitigating evidence of sustained abstinence and successful treatment,
        which the Guidelines expressly allow to overcome the presumption.
    rejected:
      O1: Keeping the case pending would unnecessarily postpone a decision despite clear, documented mitigation.
      O3: A conditional restoration is superfluous because the employee has already satisfied all required mitigation conditions,
        including a full year of negative PEth results.
      O4: The security concerns have been fully mitigated; denying the request would conflict with adjudicative standards
        and the evidence of rehabilitation.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the employee had failed to provide a continuous series of negative PEth tests or had not completed the intensive
        outpatient program
      then: O4
      why: Absent objective proof of sustained abstinence and completed treatment, the mitigating conditions (b) and (d) would
        not be satisfied, and the presumption against clearance would prevail.
    would_not_change:
    - id: noflip1
      if: the employee did not attend Alcoholics Anonymous meetings
      why: The Judge expressly noted that AA attendance was not a required condition and could be disregarded.
    watch_for:
    - id: watch1
      what: any future positive alcohol test or relapse
      favors:
      - O4
      why: A new alcohol-related incident would re-establish a Guideline G concern and could trigger revocation of the restored
        clearance.
  lesson: When an individual demonstrates continuous abstinence, completes the prescribed treatment program, and supplies
    objective evidence such as negative PEth tests, Guideline G security concerns can be fully mitigated, permitting restoration
    of a security clearance under DOE regulations.
  limits: This analysis is limited to cases where the individual provides verifiable, uninterrupted abstinence testing and
    fulfills all treatment recommendations; it does not apply to situations involving ongoing alcohol misuse or where mitigating
    evidence is lacking.
