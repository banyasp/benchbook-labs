case:
  id: DR-OHA-26-0024-revise1@v1
  title: Restoration of Access Authorization under Guideline G [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual tested positive on a workplace breathalyzer on June 16, 2024, with results exceeding the allowable
    limit. A DOE‑consultant psychologist subsequently diagnosed the Individual with moderate Alcohol Use Disorder. The Individual
    completed an intensive outpatient program from December 2024 through March 2025 and submitted thirteen monthly PEth tests,
    all negative, through January 2026. The psychologist recommended continued abstinence, monthly PEth testing for a year,
    aftercare, and attendance at Alcoholics Anonymous, which the Individual followed except for AA attendance. The Individual’s
    spouse testified that he has not consumed alcohol in nearly two years and that his behavior has improved. The Local Security
    Office issued a Notification Letter asserting substantial doubt about the Individual’s eligibility under Guideline G.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization conditionally.
      move: act
      irreversible: false
    O4:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual had positive breathalyzer results of .043, .039, and .032 on June 16, 2024 at work.
  - id: F2
    kind: situation
    status: confirmed
    fact: A psychologist diagnosed the Individual with moderate Alcohol Use Disorder in an October 2024 report.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual completed an intensive outpatient program from December 2024 through March 2025 and provided a certificate
      of completion.
  - id: F4
    kind: situation
    status: confirmed
    fact: Thirteen monthly PEth tests submitted by the Individual from December 2024 through January 2026 were all negative.
  - id: F5
    kind: situation
    status: assessed
    fact: The psychologist recommended continued abstinence, monthly PEth testing for a year, aftercare, and AA attendance;
      the Individual complied with all except AA.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual’s spouse testified that he has not consumed alcohol in nearly two years and has shown improved behavior.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      under Guideline G.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations governing access authorization impose a presumption against granting or restoring clearance and
      require mitigation of Guideline G concerns.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The positive breathalyzer results and the psychologist's diagnosis indicate a Guideline G security concern that,
      without additional corroborating evidence, requires the case to be held pending further proof.
  - id: C2
    facts:
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Although the intensive outpatient program was completed, the reduced weight reflects lingering uncertainty about
      long-term sobriety.
  - id: C3
    facts:
    - F4
    equity: due_process
    favors:
    - O2
    weight: weak
    why: The consecutive negative PEth tests are persuasive but, given the overall security context, are given less weight.
  - id: C4
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Spouse testimony and partial compliance support rehabilitation but are not decisive.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The regulatory presumption against clearance is noted, yet its mitigating clause is treated as less compelling pending
      additional evidence.
  - id: C6
    facts:
    - F7
    - F8
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The Local Security Office's expressed substantial doubt and the statutory presumption against clearance create a
      compelling need for further verification before any restoration can be granted.
  reasoning:
    read: The record shows an initial alcohol-related incident, completion of a treatment program, a year of negative PEth
      tests, and supportive testimony, but the Local Security Office still voices substantial doubt.
    weighing: C1 and the newly added security-risk consideration carry strong weight in favor of holding the case, while the
      mitigation considerations (C2-C5) have been down-weighted to weak, leaving the balance in favor of requiring additional
      evidence before any restoration.
    tradecraft: The Administrative Judge issues a decision to hold the matter pending further documentation, directing the
      Individual to provide additional verification of compliance with the after-care plan and AA attendance.
    uncertainty: Unresolved issues include the Individual's incomplete AA participation and the need for longer-term verification
      of abstinence beyond the current testing record.
    handoff: The Judge retains jurisdiction to monitor the submission of the requested evidence and may refer the matter back
      to the Local Security Office for a follow-up review.
    tempting_wrong:
      option: O2
      pull: The strong mitigation evidence could suggest that the clearance should be restored immediately.
      why_wrong: The record still lacks full compliance with the recommended after-care plan and the LSO's expressed doubt,
        so granting restoration now would be premature.
    rejected:
      O2: Restoration is premature because the security office's doubts and incomplete after-care compliance remain unresolved.
      O3: A conditional restoration would still assume sufficient mitigation, which the current evidence does not yet support.
      O4: Denial ignores the documented rehabilitation progress and would be unnecessarily punitive.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual had failed to provide a continuous series of negative PEth tests or had not completed the intensive
        outpatient program
      then: O2
      why: Without objective proof of sustained abstinence and completed treatment, the mitigating conditions would not be
        met, and the presumption against clearance would prevail.
    would_not_change:
    - id: noflip1
      if: the Individual did not attend Alcoholics Anonymous meetings
      why: The Judge explicitly stated that AA attendance was not required and could be overlooked.
    watch_for:
    - id: watch1
      what: any future positive alcohol test or relapse
      favors:
      - O4
      why: A new alcohol‑related incident would re‑establish a Guideline G concern and could trigger revocation of the restored
        clearance.
  lesson: When substantial doubt remains from the security office and regulatory presumption against clearance persists, the
    appropriate response is to hold the case pending additional evidence, even if mitigation evidence is present.
  limits: This guidance applies only to cases where the security office has formally expressed doubt and where mitigation
    evidence, while present, does not fully satisfy the statutory presumption against clearance.
