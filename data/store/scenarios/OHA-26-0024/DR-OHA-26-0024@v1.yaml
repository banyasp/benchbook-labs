case:
  id: DR-OHA-26-0024@v1
  title: Restoration of Access Authorization under Guideline G
  status: draft
  setting: DOE Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual tested positive on a workplace breathalyzer on June 16, 2024, with results exceeding the allowable
    limit. A DOE‑consultant psychologist subsequently diagnosed the Individual with moderate Alcohol Use Disorder. The Individual
    completed an intensive outpatient program from December 2024 through March 2025 and submitted thirteen monthly PEth tests,
    all negative, through January 2026. The psychologist recommended continued abstinence, monthly PEth testing for a year,
    aftercare, and attendance at Alcoholics Anonymous, which the Individual followed except for AA attendance. The Individual’s
    spouse testified that he has not consumed alcohol in nearly two years and that his behavior has improved. The Local Security
    Office issued a Notification Letter asserting substantial doubt about the Individual’s eligibility under Guideline G.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization conditionally.
      move: act
      irreversible: false
    O4:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual had positive breathalyzer results of .043, .039, and .032 on June 16, 2024 at work.
  - id: F2
    kind: situation
    status: confirmed
    fact: A psychologist diagnosed the Individual with moderate Alcohol Use Disorder in an October 2024 report.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual completed an intensive outpatient program from December 2024 through March 2025 and provided a certificate
      of completion.
  - id: F4
    kind: situation
    status: confirmed
    fact: Thirteen monthly PEth tests submitted by the Individual from December 2024 through January 2026 were all negative.
  - id: F5
    kind: situation
    status: assessed
    fact: The psychologist recommended continued abstinence, monthly PEth testing for a year, aftercare, and AA attendance;
      the Individual complied with all except AA.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual’s spouse testified that he has not consumed alcohol in nearly two years and has shown improved behavior.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      under Guideline G.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations governing access authorization impose a presumption against granting or restoring clearance and
      require mitigation of Guideline G concerns.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The positive breathalyzer results at work and the psychologist's diagnosis of moderate Alcohol Use Disorder create
      a Guideline G security concern under conditions (b) and (d), which ordinarily support denial of access.
  - id: C2
    facts:
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Completion of the intensive outpatient program, the therapist’s testimony of active participation, and the psychologist’s
      acknowledgment that the Individual has taken the first step toward reformation satisfy mitigating condition (d).
  - id: C3
    facts:
    - F4
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Thirteen consecutive monthly PEth tests, all negative, objectively demonstrate a year of abstinence consistent with
      the psychologist’s recommendation.
  - id: C4
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Both the psychologist and the Individual’s spouse attest to sustained sobriety, improved judgment, and a strong support
      system, reinforcing the low‑risk assessment.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: DOE Part 710 prescribes a presumption against clearance but expressly allows mitigation under Guideline G when conditions
      (b) and (d) are met; the Judge finds those conditions satisfied.
  reasoning:
    read: The Individual’s initial alcohol‑related incident raised a substantial doubt under Guideline G, but the record now
      shows sustained abstinence, successful treatment, and professional endorsements of rehabilitation.
    weighing: While C1 establishes the baseline security concern, C2‑C5 collectively demonstrate that the mitigating conditions
      identified in the Adjudicative Guidelines (b) and (d) are satisfied. The Judge therefore balances the presumption against
      clearance against the concrete evidence of rehabilitation and concludes the balance tips in favor of restoration.
    tradecraft: The decision is recorded in the Administrative Judge’s formal Decision, citing the specific exhibits and transcript
      pages that support each finding, and is entered into the DOE personnel security database as a restoration of access
      authorization.
    uncertainty: The only residual uncertainty is the possibility of future relapse, which is mitigated by the ongoing after‑care
      plan and monthly PEth testing requirement.
    handoff: The Judge decides alone, as authorized by 10 C.F.R. § 710.25(d)‑(g); no further agency review is required unless
      an appeal is filed.
    tempting_wrong:
      option: O4
      pull: The initial positive breathalyzer and diagnosis could lead to a default denial under the presumption against clearance.
      why_wrong: That approach ignores the substantial mitigating evidence of sustained abstinence and successful treatment,
        which the Guidelines expressly allow to overcome the presumption.
    rejected:
      O1: Holding the case pending would unnecessarily delay a decision despite the clear, documented mitigation.
      O3: A conditional restoration is unnecessary because the Individual has already satisfied all required mitigation conditions,
        including the year of negative PEth tests.
      O4: The security concerns have been fully mitigated; denying would be inconsistent with the adjudicative standards and
        the evidence of rehabilitation.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual had failed to provide a continuous series of negative PEth tests or had not completed the intensive
        outpatient program
      then: O4
      why: Without objective proof of sustained abstinence and completed treatment, the mitigating conditions (b) and (d)
        would not be met, and the presumption against clearance would prevail.
    would_not_change:
    - id: noflip1
      if: the Individual did not attend Alcoholics Anonymous meetings
      why: The Judge explicitly stated that AA attendance was not required and could be overlooked.
    watch_for:
    - id: watch1
      what: any future positive alcohol test or relapse
      favors:
      - O4
      why: A new alcohol‑related incident would re‑establish a Guideline G concern and could trigger revocation of the restored
        clearance.
  lesson: When an individual demonstrates sustained abstinence, completes the prescribed treatment program, and provides objective
    evidence (e.g., negative PEth tests), Guideline G security concerns can be fully mitigated, allowing restoration of a
    security clearance under DOE Part 710.
  limits: This analysis applies only where the individual supplies verifiable, continuous abstinence testing and fulfills
    the treatment recommendations; it does not extend to cases of ongoing alcohol misuse or where mitigating evidence is absent.
