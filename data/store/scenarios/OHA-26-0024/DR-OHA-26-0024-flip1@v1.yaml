case:
  id: DR-OHA-26-0024-flip1@v1
  title: Restoration of Access Authorization under Guideline G [flip]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, October 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual tested positive on a workplace breathalyzer on 16 June 2024, exceeding the permissible limit.
    A DOE-contracted psychologist subsequently diagnosed moderate Alcohol Use Disorder. The Individual completed an intensive
    outpatient program from December 2024 through March 2025 and supplied a certificate of completion. Thirteen monthly PEth
    specimens were submitted, but the November 2025 sample was never provided, leaving a gap in the record. The psychologist's
    treatment plan called for continued abstinence, monthly PEth testing for a year, after-care, and AA participation; the
    Individual adhered to all elements except AA attendance and the missing November test. The Individual's spouse testified
    that no alcohol has been consumed for nearly two years and that behavior has markedly improved. The Local Security Office
    issued a Notification Letter expressing considerable uncertainty regarding eligibility under Guideline G.
  question: How should the Administrative Judge rule on the Individual's access authorization?
  options:
    O1:
      do: Keep the case pending while requesting further documentation from the Individual.
      move: hold
      irreversible: false
    O2:
      do: Fully restore the Individual's access authorization based on the submitted evidence.
      move: act
      irreversible: true
    O3:
      do: Restore the Individual's access authorization but impose specific monitoring conditions.
      move: act
      irreversible: false
    O4:
      do: Deny the Individual's access authorization due to the unresolved testing gap.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 16 June 2024, while performing duties, the Individual's breathalyzer test returned alcohol concentrations of
      0.043, 0.039 and 0.032.
  - id: F2
    kind: situation
    status: confirmed
    fact: A clinical assessment prepared in October 2024 concluded that the Individual meets criteria for a moderate Alcohol
      Use Disorder.
  - id: F3
    kind: situation
    status: confirmed
    fact: Between December 2024 and March 2025 the Individual participated in, and successfully completed, an intensive outpatient
      rehabilitation program, providing official certification of completion.
  - id: F4
    kind: situation
    status: confirmed
    fact: Eleven of the monthly PEth tests submitted by the Individual from December 2024 through October 2025 were negative;
      the test that was due in November 2025 was never provided, creating a gap in the testing record.
  - id: F5
    kind: situation
    status: assessed
    fact: The psychologist recommended continued abstinence, monthly PEth testing for a year, after‑care, and AA attendance;
      the Individual followed the plan except for AA and omitted the November 2025 PEth sample.
  - id: F6
    kind: situation
    status: confirmed
    fact: Spousal testimony indicated that the Individual has abstained from alcohol for approximately twenty-four months
      and that his conduct has become noticeably better.
  - id: F7
    kind: authority
    status: confirmed
    fact: A Notification Letter from the Local Security Office expressed considerable uncertainty regarding the Individual's
      eligibility pursuant to Guideline G.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE policy on access authorizations establishes a default presumption against granting or reinstating a clearance
      and mandates that any Guideline G issue be mitigated.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The positive breathalyzer results and the psychologist's diagnosis of moderate Alcohol Use Disorder trigger a Guideline
      G security concern under conditions (b) and (d), which ordinarily support denial of access.
  - id: C2
    facts:
    - F3
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Completion of the intensive outpatient program and the psychologist's endorsement of the Individual's effort satisfy
      part of the mitigating condition (d).
  - id: C3
    facts:
    - F4
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The missing November 2025 PEth specimen breaks the required uninterrupted series of negative tests, undermining the
      objective proof of a full year of abstinence.
  - id: C4
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Both the psychologist and the spouse attest to sustained sobriety and a supportive environment, suggesting a reduced
      risk.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: DOE Part 710's presumption against clearance remains unmitigated because the continuity of negative PEth testing—a
      required mitigation element—is absent.
  reasoning:
    read: Although the Individual completed treatment and received supportive testimony, the record contains a critical gap
      in the mandated monthly PEth monitoring, leaving a lingering Guideline G concern.
    weighing: C1 establishes a baseline security risk; C3 demonstrates that the objective mitigation condition (continuous
      negative PEth testing) has not been satisfied; C5 reinforces the statutory presumption against clearance when mitigation
      is incomplete. Consequently, the balance of security interests favors denial.
    tradecraft: The Administrative Judge issues a formal decision denying the access authorization, cites the relevant exhibits
      (breathalyzer results, psychologist report, PEth testing record), and records the outcome in the DOE personnel security
      system.
    uncertainty: Future compliance with the testing regimen could alter the risk assessment, but the present record does not
      meet the required standard.
    handoff: The Judge acts independently under 10 C.F.R. § 710.25(d)-(g); no further agency review is required unless an
      appeal is filed.
    tempting_wrong:
      option: O2
      pull: The successful completion of treatment and supportive spouse testimony might suggest a full restoration.
      why_wrong: Restoration would ignore the missing PEth sample, which is a statutory requirement for demonstrating a continuous
        year of abstinence and therefore cannot be overlooked.
    rejected:
      O1: Deferring the decision would postpone a necessary security determination despite the clear procedural deficiency.
      O3: Conditional restoration is inappropriate because the essential mitigation condition—uninterrupted negative testing—has
        not been met.
      O2: Denial of mitigation for the missing test would contravene DOE Part 710, which mandates that all required evidence
        be present before clearance can be restored.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual had supplied an uninterrupted series of negative PEth tests and completed the intensive outpatient
        program
      then: O2
      why: With continuous objective proof of abstinence and completed treatment, the mitigating conditions (b) and (d) would
        be satisfied, allowing restoration of clearance.
    would_not_change:
    - id: noflip1
      if: the Individual did not attend Alcoholics Anonymous meetings
      why: The Judge has already indicated that AA attendance is not a mandatory element of the mitigation plan.
    watch_for:
    - id: watch1
      what: any future positive alcohol test or relapse
      favors:
      - O4
      why: A new alcohol-related incident would re-establish a Guideline G concern and could trigger revocation of any restored
        clearance.
  lesson: When a required element of the mitigation plan—such as an uninterrupted series of negative PEth tests—is missing,
    the presumption against clearance remains unmitigated, and denial of access authorization is the appropriate outcome under
    DOE Part 710.
  limits: This conclusion applies only where the individual fails to provide the complete, continuous testing record mandated
    by the adjudicative guidelines; it does not extend to cases where all mitigation requirements are fully satisfied.
