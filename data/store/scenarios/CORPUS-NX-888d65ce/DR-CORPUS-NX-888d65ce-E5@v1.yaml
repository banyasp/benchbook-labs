case:
  id: DR-CORPUS-NX-888d65ce-E5@v1
  title: Beirut Withdrawal Decision
  status: draft
  setting: Beirut, late January and early February 1984, White House
  decider: The White House
  agent: The White House
  agent_role: decide
  situation: A terrorist attack on the Marine barracks at Beirut International Airport in October 1983 killed 241 Marines.
    The attackers were believed to be allied with Iran. The administration continued to support Lebanon's president while
    congressional pressure for withdrawal mounted. In late January and early February 1984, the Lebanese Armed Forces was
    torn apart by internal religious tensions. The situation on the ground in Lebanon was worsening, and senior administration
    officials were in dispute over whether to escalate or withdraw.
  question: What should the White House do about the Marine presence in Beirut in early 1984?
  options:
    O1:
      do: The White House withdraws the Marines from Beirut.
      move: act
      irreversible: false
    O2:
      do: The White House retains the Marines in Beirut.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A terrorist attack on the Marine barracks at Beirut International Airport on 23 October 1983 killed 241 Marines.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The attackers were believed to be allied with Iran.
  - id: F3
    kind: situation
    status: confirmed
    fact: The administration remained firm in its support for Lebanon's president.
  - id: F4
    kind: situation
    status: confirmed
    fact: Congressional pressure for withdrawal mounted.
  - id: F5
    kind: situation
    status: confirmed
    fact: In late January and early February 1984, the Lebanese Armed Forces was torn apart by internal religious tensions.
  - id: F6
    kind: situation
    status: confirmed
    fact: The situation on the ground in Lebanon was worsening.
  - id: F7
    kind: situation
    status: confirmed
    fact: Senior administration officials were in dispute over whether to escalate or withdraw.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The LAF was torn apart by internal religious tensions as conditions on the ground worsened. This was the immediate
      situation in which the White House determined that the Marines should leave.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Congressional pressure for withdrawal was mounting and formed part of the stated context for the decision.
  - id: C3
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The administration remained firm in supporting Lebanon's president, a commitment pulling against withdrawal.
  - id: C4
    facts:
    - F7
    equity: escalation_control
    favors:
    - O1
    - O2
    weight: weak
    why: Senior administration officials were in real dispute over escalation or withdrawal; the account records the disagreement
      but does not resolve it as a shared rationale.
  reasoning:
    read: 'The White House faced a deteriorating situation: a terrorist attack had killed 241 Marines, the LAF was breaking
      apart amid internal religious tensions, and congressional pressure to withdraw was mounting. The trap is to treat continued
      support for Lebanon''s president as sufficient reason to retain the Marines, or to present the outcome as an uncontested
      choice: senior officials were divided over whether to escalate or withdraw.'
    weighing: 'The account''s clearest decision context favors withdrawal: the LAF was torn apart and conditions on the ground
      were worsening, with congressional pressure also mounting. Continued support for Lebanon''s president pulled the other
      way, and senior officials disagreed. The White House nevertheless determined to leave; the account does not specify
      how much weight it assigned to each consideration.'
    tradecraft: For a decision record, identify the deciding office, the deteriorating conditions and congressional pressure,
      the continuing commitment to Lebanon's president, and the disagreement over escalation or withdrawal. Communicate the
      decision through authorized channels and preserve the competing view rather than presenting the choice as unanimous.
    uncertainty: The account gives the outcome and its surrounding conditions, but not a detailed explanation of the White
      House's own weighting. It is therefore uncertain which consideration was decisive beyond the reported determination
      to leave.
    handoff: The White House held the decision. The senior officials who disagreed and the congressional pressure for withdrawal
      were relevant inputs to its judgment, but the account does not assign them decision authority.
    tempting_wrong:
      option: O2
      pull: The administration remained firm in its support for Lebanon's president.
      why_wrong: That commitment pulled toward retaining the Marines, but the White House chose withdrawal amid the LAF's
        breakdown and worsening conditions; the source does not treat support for the president as overriding those circumstances.
    rejected:
      O2: 'The White House did not retain the Marines: it determined to leave despite its continuing support for Lebanon''s
        president.'
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The LAF remained cohesive, conditions on the ground were not worsening, and pressure for withdrawal was not mounting.
      then: O2
      why: Those changes would remove the conditions most closely associated with the reported decision to leave, allowing
        the administration's continued support for Lebanon's president to weigh more heavily.
    would_not_change:
    - id: noflip1
      if: The administration continued to support Lebanon's president but the LAF remained torn apart and conditions on the
        ground continued to worsen.
      why: Continued support for the president was present in the actual situation, yet the White House still determined to
        withdraw.
    watch_for:
    - id: watch1
      what: Whether the LAF's internal religious tensions further undermine it while conditions on the ground worsen and congressional
        pressure continues.
      favors:
      - O1
      why: These are the conditions surrounding the White House's determination to leave.
  lesson: When conditions on the ground are worsening and the local force is breaking apart, a prior policy commitment does
    not by itself settle whether to retain a military presence. Make the tradeoff explicit, account for genuine disagreement,
    and state what conditions support the chosen course.
  limits: The account does not provide a detailed White House rationale or establish that any single factor caused the withdrawal
    decision. This reasoning should not be treated as a general rule that congressional pressure or a local force's breakdown
    automatically requires withdrawal.
