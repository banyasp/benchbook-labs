case:
  id: DR-CORPUS-NX-c7c71104-E13@v1
  title: Blockades or Fleet Concentration
  status: draft
  setting: London, early morning July 9, Admiralty
  decider: The head of the Admiralty
  agent: The head of the Admiralty
  agent_role: decide
  situation: The head of the Admiralty has received intelligence that the French fleet left the West Indies, while its destination
    remains uncertain. The dispatch arrived in Plymouth on July 7, reached London late on July 8, and was presented early
    the next morning; the head of the Admiralty has expressed concern about the lost time. British forces are maintaining
    blockades at Rochefort and off Ferrol. The decision is whether to retain those positions or redirect ships from Rochefort
    to join the force watching off Ferrol. The proposed concentration is intended to intercept the French fleet and prevent
    it from joining the Ferrol squadron.
  question: What should the head of the Admiralty do about the Rochefort blockade and the proposed fleet concentration?
  options:
    O1:
      do: The head of the Admiralty maintains the Rochefort blockade and retains the Ferrol force in place.
      move: act
      irreversible: false
    O2:
      do: The head of the Admiralty lifts the Rochefort blockade and directs five ships to join the Ferrol force.
      move: act
      irreversible: false
    O3:
      do: The head of the Admiralty defers fleet orders and awaits further intelligence on the French fleet's destination.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The dispatch conveyed that the French fleet had left the West Indies, and its sender believed it had sailed for
      Europe.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The French fleet's destination could only be surmised.
  - id: F3
    kind: situation
    status: confirmed
    fact: The dispatch reached Plymouth on July 7, its bearer reached London at 11 p.m. on July 8, and the head of the Admiralty
      received it early the next morning.
  - id: F4
    kind: situation
    status: confirmed
    fact: On receiving the dispatch, the head of the Admiralty expressed anger about the loss of precious hours.
  - id: F5
    kind: situation
    status: confirmed
    fact: Cornwallis was maintaining the blockade at Rochefort, while Calder was watching off Ferrol with ten ships.
  - id: F6
    kind: capability
    status: confirmed
    fact: Five ships from the Rochefort force could join the ten ships off Ferrol, forming a force of fifteen.
  - id: F7
    kind: situation
    status: confirmed
    fact: The contemplated concentration was to intercept the French fleet and prevent its junction with the Ferrol squadron.
  - id: F8
    kind: situation
    status: assessed
    fact: The choice was framed as preserving the blockades or raising them and risking the French fleet proceeding unmolested
      to an unknown destination; the existing advantages were described as long and justly cherished.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The destination was uncertain, but leaving Villeneuve unopposed risked allowing the fleet to proceed to it; the proposed
      concentration aimed to prevent a junction with the Ferrol squadron.
  - id: C2
    facts:
    - F3
    - F4
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The dispatch had already lost precious hours in transit, and the head of the Admiralty treated that delay as urgent
      grounds for prompt orders rather than further delay.
  - id: C3
    facts:
    - F5
    - F6
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The choice required sacrificing long and valued blockade advantages, but sending five ships from Rochefort would
      reinforce the Ferrol force for the effort to intercept Villeneuve.
  reasoning:
    read: The French fleet's destination is uncertain, but the decision is not simply whether to preserve established positions
      until certainty arrives. The risk is that delay and retaining the Rochefort blockade could leave Villeneuve free to
      proceed while the British force remains too dispersed to prevent a junction.
    weighing: 'The balance favors prompt concentration: the author endorses sacrificing advantages long and justly cherished
      to strike at one of the enemy''s converging detachments. The balance depends on the perceived risk of Villeneuve proceeding
      unmolested and on the concentration''s purpose of preventing the Ferrol junction; certainty about the ultimate destination
      is not presented as a prerequisite.'
    tradecraft: Act promptly, communicate the decision through the appropriate command channels, and record the uncertain
      intelligence, the time already lost, the risk of an unopposed advance, and the blockade advantage being sacrificed.
    uncertainty: The destination could only be surmised. The decision addresses that uncertainty by concentrating against
      the possible junction rather than claiming to know where the fleet was headed.
    handoff: The head of the Admiralty makes the decision and directs the relevant commanders; the described decision does
      not call for referral to a higher authority.
    tempting_wrong:
      option: O1
      pull: Preserving the Rochefort blockade retains an established advantage.
      why_wrong: The source's endorsed judgment is that retaining that advantage risked allowing Villeneuve to proceed unmolested
        instead of concentrating against the threat of a junction.
    rejected:
      O1: It was not chosen because preserving the Rochefort blockade would forgo the proposed concentration against Villeneuve
        and the Ferrol junction risk.
      O3: It was not chosen because further delay would compound the already-lost hours while leaving the risk of an unopposed
        advance unresolved.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable intelligence established that Villeneuve could not join the Ferrol squadron and would not proceed unmolested
        toward a destination requiring interception.
      then: O1
      why: If the stated threat that justified sacrificing the Rochefort blockade disappeared, preserving the existing blockade
        advantage would no longer carry the same cost to the interception purpose.
    would_not_change:
    - id: noflip1
      if: The destination remained uncertain while the risk of Villeneuve proceeding unmolested and joining the Ferrol squadron
        remained.
      why: The endorsed decision was made despite the destination being uncertain and was justified by the need to act against
        the converging-detachment threat.
    watch_for:
    - id: watch1
      what: New intelligence that materially changes the assessed risk of Villeneuve proceeding unmolested or joining the
        Ferrol squadron.
      favors:
      - O2
      why: That risk is central to the reason for sacrificing the Rochefort blockade; information changing it could alter
        the balance.
  lesson: When an uncertain enemy destination creates a time-sensitive risk of an unopposed advance or junction, uncertainty
    alone need not justify waiting. A decision-maker may sacrifice established advantages to concentrate against the threat
    the available intelligence makes most urgent.
  limits: This reasoning applies where concentration is a plausible means of addressing the identified threat and delay risks
    allowing the enemy to proceed unopposed. It does not establish that blockades should generally be lifted or that concentration
    is warranted when the junction risk or interception purpose is absent.
