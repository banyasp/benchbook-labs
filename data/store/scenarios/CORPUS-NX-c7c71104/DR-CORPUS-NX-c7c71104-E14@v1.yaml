case:
  id: DR-CORPUS-NX-c7c71104-E14@v1
  title: Direction for the Fleet at Manila
  status: draft
  setting: White House, April 24, 1898; U.S. executive and Navy leadership.
  decider: The President
  agent: The President
  agent_role: decide
  situation: War with Spain had begun, and the fleet commander was required to leave Hong Kong within forty-eight hours. A
    February instruction had set out a conditional course for the fleet if war with Spain began. The notice about leaving
    Hong Kong reached the Navy Department when the department was practically deserted, and the Bureau chief brought it to
    the White House. The President convened senior officials, and they were discussing what reply to send to the fleet commander.
  question: What should the President do about directing the fleet's action against the Spanish naval force at Manila as war
    with Spain begins and the fleet must leave Hong Kong?
  options:
    O1:
      do: The President declines to authorize the fleet to proceed to Manila and attack the Spanish naval force assembled
        there.
      move: act
      irreversible: false
    O2:
      do: The President authorizes the fleet to proceed to Manila and attack the Spanish naval force assembled there.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: War with Spain began on April 21, 1898.
  - id: F2
    kind: authority
    status: confirmed
    fact: On February 25, the Assistant Secretary of the Navy instructed the fleet commander that, if war with Spain was declared,
      his duty would be to prevent the Spanish squadron from leaving the Asiatic coast and then begin offensive operations
      in the Philippine Islands.
  - id: F3
    kind: situation
    status: assessed
    fact: The fleet commander had been notified that he must leave Hong Kong with his force within forty-eight hours.
  - id: F4
    kind: situation
    status: confirmed
    fact: The notice reached the Navy Department on a Sunday morning when the department was practically deserted.
  - id: F5
    kind: situation
    status: assessed
    fact: The Bureau chief considered a prompt reply to the fleet commander of the greatest importance and took the dispatch
      to the White House.
  - id: F6
    kind: authority
    status: confirmed
    fact: The President directed the Bureau chief to bring the Secretary of the Navy and the Secretary of State to the White
      House, where senior officials discussed the dispatch and the reply to send.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The February instruction made offensive operations in the Philippine Islands the fleet commander's duty if war with
      Spain began; the stated condition had occurred.
  - id: C2
    facts:
    - F3
    - F5
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The fleet had to leave Hong Kong within forty-eight hours, and the Bureau chief considered a prompt reply of the
      greatest importance. The account criticizes the earlier loss of time and presents the immediate decision as urgent.
  - id: C3
    facts:
    - F4
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: Although the Department was practically deserted when the notice arrived, it was brought to the White House, where
      the President convened senior officials to discuss the reply and directed the action.
  - id: C4
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Proceeding to Manila and attacking the Spanish naval force gave effect to the prior instruction to begin offensive
      operations in the Philippines, despite the fleet's impending departure from Hong Kong.
  reasoning:
    read: 'This is not an open-ended choice about whether to begin a campaign: war has begun, a conditional instruction already
      directs offensive operations in the Philippines, and the fleet must leave Hong Kong within forty-eight hours. The trap
      is to treat the Department''s Sunday staffing problem or the gravity of an attack as a reason for further delay, despite
      the prior instruction and the immediate need to direct the fleet.'
    weighing: The activated February instruction and the mission it set out weigh strongly toward {O2} ({C1}, {C4}). The forty-eight-hour
      limit and the stated importance of a prompt reply reinforce that choice ({C2}); the President's consultation with senior
      officials supports that the decision was taken at the appropriate level ({C3}). The balance depends chiefly on the war
      trigger having occurred and the fleet's urgent need for direction.
    tradecraft: Make the decision and its authority clear, and preserve the rationale that the prior conditional instruction
      was activated by the outbreak of war and that the fleet faced an imminent departure deadline. The account does not describe
      a separate decision-recording practice; this is a recommended practice, not a reported one.
    uncertainty: The account of the drafting is uncertain whether the final wording added “capture” or “destroy.” It is clear
      in either case that the President directed the fleet to proceed to Manila and attack the Spanish naval force.
    handoff: The President involved senior officials, including the Secretaries of the Navy and State, in discussing the dispatch
      and reply. The President then directed the order; no disagreement over that decision is recorded.
    tempting_wrong:
      option: O1
      pull: Declining could seem prudent because authorizing an attack is consequential and the account does not specify the
        final wording about the force's fate.
      why_wrong: That hesitation would leave the fleet without the direction called for by the activated February instruction
        while it faced a forty-eight-hour departure deadline; uncertainty about that wording does not undo the stated direction
        to attack.
    rejected:
      O1: The President did not decline authorization because the war-triggered instruction called for offensive operations
        in the Philippines and the fleet urgently needed direction before leaving Hong Kong.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: War with Spain had not been declared, so the condition in the February instruction had not occurred.
      then: O1
      why: The stated basis for the fleet's duty to begin offensive operations was conditional on war being declared.
    would_not_change:
    - id: noflip1
      if: The Navy Department had been normally staffed when the notice arrived.
      why: That would remove the Sunday staffing difficulty, but the war-triggered instruction and the fleet's departure deadline
        would still favor directing the fleet to Manila.
    watch_for:
    - id: watch1
      what: Whether the fleet has an imminent deadline to leave its current port and needs prompt direction.
      favors:
      - O2
      why: The account treats the forty-eight-hour requirement and the importance of a prompt reply as reasons for immediate
        action.
  lesson: When an authorized conditional instruction is activated and the assigned force faces an urgent departure deadline,
    the decision-maker should give clear direction consistent with that instruction rather than let administrative delay defeat
    the mission. Consultation can support the decision, but urgency does not remove the need to act at the proper level of
    authority.
  limits: The decision concerns the authority, timing, and choice to direct an attack. It does not establish the attack's
    legality under other applicable rules or address civilian effects, proportionality, or how the operation was conducted.
