case:
  id: DR-CORPUS-NX-b09e24ee-E5@v1
  title: Late-1961 Ground-Force Commitment
  status: draft
  setting: Washington, late 1961, U.S. administration
  decider: The President
  agent: The President
  agent_role: decide
  situation: By October 1961, Vietcong capabilities were growing, and South Vietnamese leadership was seeking a larger U.S.
    commitment. U.S. officials were considering substantial ground-force proposals, while an intelligence estimate offered
    partly reassuring information about local recruitment and external supplies. The President sent a study mission to Saigon,
    where the South Vietnamese leader requested troops and a treaty. After meeting with South Vietnamese leadership, the mission
    proposed sending 6,000 to 8,000 U.S. troops, both logistical and combat. The President must decide whether to make the
    proposed troop commitment, decline it, or seek further assessment.
  question: What should the President do about the proposed commitment of 6,000 to 8,000 U.S. troops?
  options:
    O1:
      do: The President would reject the proposed commitment of 6,000 to 8,000 U.S. troops, including logistical and combat
        forces.
      move: act
      irreversible: false
    O2:
      do: The President would approve the proposed commitment of 6,000 to 8,000 U.S. troops, including logistical and combat
        forces.
      move: act
      irreversible: false
    O3:
      do: The President would request a further assessment from the mission before deciding on the proposed troop commitment.
      move: ask
      irreversible: false
      to: the mission
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: Vietcong forces were estimated at 17,000, could operate in units up to battalion size with heavy arms, and had nearly
      tripled the level of attacks in September.
  - id: F2
    kind: situation
    status: confirmed
    fact: By early October, proposals within the Washington administration called for major U.S. ground-force inputs.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A special intelligence estimate reported that 80 to 90 percent of the estimated 17,000 Vietcong had been locally
      recruited and that there was little evidence of reliance on external supplies.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The intelligence estimate warned of the enemy's shrewdness and tenacity.
  - id: F5
    kind: situation
    status: confirmed
    fact: On 11 October, the President sent a general to Saigon on a study mission.
  - id: F6
    kind: situation
    status: confirmed
    fact: Two days after the mission was dispatched, the South Vietnamese leader urgently requested troops and a treaty.
  - id: F7
    kind: situation
    status: confirmed
    fact: One strategy considered by the mission was a major U.S. intervention using up to three divisions.
  - id: F8
    kind: situation
    status: confirmed
    fact: After meeting with South Vietnamese leadership, the mission proposed sending 6,000 to 8,000 U.S. troops, both logistical
      and combat.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Vietcong forces had expanded their capabilities and sharply increased attacks, while major U.S. ground-force proposals
      were already under consideration; this supported a larger commitment.
  - id: C2
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: weak
    why: The estimate that most Vietcong were locally recruited and that external supply reliance was little in evidence offered
      some reason for caution about the scale or necessity of intervention.
  - id: C3
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The warning about the enemy's shrewdness and tenacity counseled against treating the partly reassuring intelligence
      as proof that the threat was manageable without added support.
  - id: C4
    facts:
    - F6
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The South Vietnamese leader made an urgent request for troops and a treaty, strengthening the case for responding
      with a larger commitment.
  - id: C5
    facts:
    - F5
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: After sending a study mission and receiving its proposal for 6,000 to 8,000 troops, the President accepted the mission's
      major recommendations.
  reasoning:
    read: The decision arose amid a rapidly strengthening Vietcong and a South Vietnamese request for a larger U.S. role.
      The trap is to read the estimate about local recruitment and limited evidence of external supplies as proof that the
      threat was slight; the estimate also warned of enemy shrewdness and tenacity.
    weighing: The rising capability and attack rate, the urgent request, and the study mission's specific recommendation point
      toward approving the proposed commitment. The intelligence estimate provides a caution against overreading the threat,
      but the record presents it alongside a warning about the enemy and the accelerating attacks. The narrative records the
      President's acceptance but does not set out a formal balancing rationale beyond this context.
    tradecraft: Keep the decision record focused on the policy choice, the intelligence considered, the South Vietnamese request,
      and the study mission's recommendation. Distinguish assessed intelligence from confirmed events and record that the
      President accepted the mission's major recommendations.
    uncertainty: The estimate was partly reassuring, but it did not remove the uncertainty created by the Vietcong's growing
      capabilities and the warning about their tenacity. The extract does not explain the President's detailed assessment
      of troop risks, civilian effects, or the commitment's likely duration.
    handoff: The President made the decision after sending a study mission to Saigon and receiving its proposal; the extract
      does not identify a further approval authority or additional consultation.
    tempting_wrong:
      option: O3
      pull: The intelligence estimate was partly reassuring, so further assessment might appear preferable to deciding.
      why_wrong: The President had already sent a study mission, which returned a specific troop recommendation after meeting
        South Vietnamese leadership, and accepted its major recommendations.
    rejected:
      O1: The President did not reject the proposal; he accepted the study mission's major recommendations despite the estimate's
        partly reassuring details.
      O3: The President did not seek another assessment after the mission returned with its recommendation.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The attacks and Vietcong capabilities had not been growing, reducing the urgency for a larger commitment.
      then: O3
      why: Without the worsening threat described here, the partly reassuring estimate could support further assessment before
        committing troops.
    - id: flip2
      if: The study mission had recommended against sending troops after its assessment in Saigon.
      then: O1
      why: The President's recorded choice followed acceptance of the mission's major recommendations; a contrary recommendation
        would remove that basis for approval.
    would_not_change:
    - id: noflip1
      if: The estimate still reported mostly local recruitment and little evidence of reliance on external supplies, without
        additional evidence that the threat had diminished.
      why: Those partly reassuring findings were already present alongside the growing attack rate and the warning about enemy
        shrewdness and tenacity.
    watch_for:
    - id: watch1
      what: Whether Vietcong capabilities and the rate of attacks continue to increase.
      favors:
      - O2
      why: Continued growth would reinforce the threat-based reason for accepting a larger commitment.
  lesson: Partly reassuring intelligence should be weighed against evidence of an adversary's growing capability and resilience,
    not treated as conclusive reassurance. When a leader has obtained a study mission's recommendation in response to an urgent
    request, the decision should address that recommendation in light of the full threat picture.
  limits: This reasoning is limited to the policy choice described in the extract; it does not establish the legality, effectiveness,
    or consequences of the troop commitment. The extract gives little detail about risks to U.S. personnel, civilians, or
    the longer-term costs of escalation.
