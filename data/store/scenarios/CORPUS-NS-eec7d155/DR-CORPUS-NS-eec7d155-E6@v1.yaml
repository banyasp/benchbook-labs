case:
  id: DR-CORPUS-NS-eec7d155-E6@v1
  title: Reconsidering the Linkup Point
  status: draft
  setting: VII Corps, near Paderborn, 31 March 1945
  decider: The VII Corps commander, in coordination with the Ninth Army commander
  agent: The VII Corps commander
  agent_role: decide
  situation: On 31 March 1945, VII Corps was operating as part of the effort to encircle the Ruhr. The planned linkup point
    was Paderborn, but the corps commander assessed that this original objective could no longer be accomplished. German attacks
    against 104th Infantry Division and increasing resistance around Paderborn were affecting the situation. 3d Armored Division
    was reorganizing after its commander’s death, while a coordinated attack against Paderborn was being prepared. The corps
    commander was adapting the corps plan within the higher-echelon commander’s intent, and coordination with the Ninth Army
    commander was required. The decision is whether to retain Paderborn as the linkup point or adopt an alternative in coordination
    with Ninth Army.
  question: What should the VII Corps commander do about the planned Paderborn linkup point?
  options:
    O1:
      do: The VII Corps commander approves Paderborn and retains it as linkup point with Ninth Army.
      move: act
      irreversible: false
    O2:
      do: The VII Corps commander rejects Paderborn and adopts another linkup point with Ninth Army.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The planned linkup point was Paderborn.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: German attacks were occurring against 104th Infantry Division.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: German resistance around Paderborn was increasing.
  - id: F4
    kind: situation
    status: confirmed
    fact: 3d Armored Division was reorganizing after its commander’s death.
  - id: F5
    kind: situation
    status: confirmed
    fact: A coordinated attack against Paderborn was being prepared.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The original objective of linking up at Paderborn could no longer be accomplished.
  - id: F7
    kind: authority
    status: confirmed
    fact: The corps commander adapted the corps plan within the framework of the higher-echelon commander’s intent.
  - id: F8
    kind: situation
    status: confirmed
    fact: The situation required the corps commander to contact the Ninth Army commander about a possible change in the linkup
      point.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The corps commander assessed that the Paderborn objective could no longer be accomplished amid German attacks and
      resistance, the 3d Armored Division’s reorganization, and preparation of a coordinated attack there; retaining that
      linkup point would not serve the encirclement objective.
  - id: C2
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Changing the corps plan was consistent with the higher-echelon commander’s intent, which supplied the framework within
      which the corps commander adapted to the situation.
  - id: C3
    facts:
    - F8
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The changed linkup point required coordination with Ninth Army, supporting a proposed alternative coordinated with
      that commander rather than a unilateral change.
  reasoning:
    read: The planned Paderborn linkup had become unattainable in the corps commander’s assessment. The trap is treating the
      original point as fixed when the operational conditions had changed; the adjustment still had to remain within the higher-echelon
      commander’s intent.
    weighing: The reported attacks, resistance, division reorganization, and need to prepare a coordinated attack made retaining
      Paderborn an ineffective way to pursue the encirclement. The balance depends on the assessment that Paderborn could
      no longer be achieved; adapting the point was appropriate because it remained within higher intent and was coordinated
      with Ninth Army.
    tradecraft: Explain the changed conditions to Ninth Army, propose an alternative point, and keep the adjustment aligned
      with the higher-echelon intent. Communicate the revised point and purpose to subordinate commands so they can coordinate
      their efforts.
    uncertainty: The commander assessed that Paderborn could no longer be achieved, but the available facts do not detail
      a comparison of alternatives or specify additional criteria for selecting a different point.
    handoff: 'Involve the Ninth Army commander: changing the linkup point affects coordination between the armies, and the
      corps commander needed to contact that commander about the change.'
    tempting_wrong:
      option: O1
      pull: Paderborn was the planned point, and the Ruhr encirclement was an established objective.
      why_wrong: The original Paderborn objective was assessed as no longer achievable, so preserving the original point would
        not advance the mission merely because it had been planned.
    rejected:
      O1: The corps commander did not retain Paderborn because the original linkup objective could no longer be accomplished
        under the conditions described.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Paderborn became achievable again without disrupting the coordinated operation.
      then: O1
      why: If the assessment that the original objective could not be accomplished no longer held, the principal reason for
        abandoning the planned point would be removed.
    would_not_change:
    - id: noflip1
      if: The Ruhr encirclement remained the higher-level objective selected before the linkup decision.
      why: That broader objective would not by itself require retaining Paderborn once the corps commander assessed that the
        original linkup point was unattainable.
    watch_for: []
  lesson: Treat a planned objective as a means to the higher commander’s intent, not as an end in itself. When changed conditions
    make that objective unattainable, adapt the plan within the intent and coordinate the change with affected commanders.
  limits: This reasoning applies to the decision about changing a linkup point when the original objective is assessed as
    unattainable and an adjustment remains within higher-echelon intent. It does not establish which alternative point should
    be chosen in a different operational situation.
