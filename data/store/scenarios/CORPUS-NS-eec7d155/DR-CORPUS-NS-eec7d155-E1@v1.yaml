case:
  id: DR-CORPUS-NS-eec7d155-E1@v1
  title: Choosing the Level of Command Control
  status: draft
  setting: Military command, in the doctrinal context of ADP 6-0 dated 31 July 2019.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: A Commander is determining the level of control over subordinate elements. The operation or phase may call for
    close synchronization, or may leave room for subordinate initiative. The Commander has to account for mission variables
    and other considerations, including risk, legal and ethical ambiguity, rules of engagement, training, trust, and shared
    understanding. Control can be reassessed as the situation evolves. Subordinates may need to address unexpected problems
    and act on the commander's intent.
  question: What should the Commander do about the level of control over subordinate elements?
  options:
    O1:
      do: The Commander adjusts control over subordinate elements.
      move: act
      irreversible: false
    O2:
      do: The Commander decentralizes control over subordinate elements.
      move: act
      irreversible: false
    O3:
      do: The Commander centralizes control over subordinate elements.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Determining the appropriate level of control includes decisions about delegation and decentralized execution.
  - id: F2
    kind: situation
    status: confirmed
    fact: The level and application of control evolve and should be continuously assessed and adjusted to the situation.
  - id: F3
    kind: situation
    status: confirmed
    fact: Subordinates should have the greatest freedom of action commensurate with acceptable risk.
  - id: F4
    kind: situation
    status: confirmed
    fact: Mission variables include mission, enemy, terrain and weather, available troops and support, available time, and
      civil considerations.
  - id: F5
    kind: situation
    status: confirmed
    fact: Other control considerations include enemy disposition and capabilities, required synchronization and integration,
      higher-echelon constraints, and risk.
  - id: F6
    kind: situation
    status: confirmed
    fact: Legal and ethical ambiguity, rules of engagement, unit cohesion, training, trust, and shared understanding are also
      control considerations.
  - id: F7
    kind: situation
    status: confirmed
    fact: Operations requiring close synchronization or integration of effects in limited time may require detailed coordination
      and more centralized control.
  - id: F8
    kind: situation
    status: confirmed
    fact: Operations not requiring close coordination can offer opportunities for initiative that may be lost through excessive
      detailed synchronization.
  - id: F9
    kind: situation
    status: confirmed
    fact: Even in highly controlled operations, subordinates must address unexpected problems and pursue the commander's intent
      when existing orders no longer fit the circumstances.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Control and its application evolve with the situation, so the Commander should continuously reassess and adjust rather
      than treat the initial level as fixed.
  - id: C2
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O2
    - O1
    weight: strong
    why: Subordinates should have the greatest freedom of action that is commensurate with acceptable risk; the risk assessment
      helps determine how much control to retain or delegate.
  - id: C3
    facts:
    - F7
    equity: tempo
    favors:
    - O3
    - O1
    weight: strong
    why: Close synchronization or integration of effects in limited time may require detailed coordination and more centralized
      control.
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    - O1
    weight: strong
    why: Where close coordination is unnecessary, subordinate initiative may be valuable and can be lost through excessive
      detailed synchronization.
  - id: C5
    facts:
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The appropriate level depends on the mission variables and other considerations, including legal and ethical ambiguity,
      rules of engagement, training, trust, and shared understanding; these factors call for calibration to the circumstances.
  reasoning:
    read: This is a command judgment about how much decision-making to delegate and how decentralized execution should be,
      not a choice between permanent centralization and permanent decentralization. The trap is to let one feature, such as
      synchronization, dictate control without considering risk and the other relevant circumstances.
    weighing: The doctrine supports closer, more centralized control when close synchronization or timely integration requires
      it, but also recognizes that excessive detailed synchronization can suppress initiative when close coordination is not
      needed. The balance therefore depends on the mission variables, acceptable risk, synchronization needs, legal and ethical
      ambiguity, rules of engagement, and the unit's cohesion, training, trust, and shared understanding. Because these conditions
      evolve, the endorsed course is to adjust control as the situation warrants while preserving subordinate freedom commensurate
      with acceptable risk.
    tradecraft: The Commander should assess the relevant factors, make clear the intended degree of delegation, and revisit
      that judgment as conditions change. A concise record of the factors considered and the reasons for changing or retaining
      the level of control can support consistent command accountability.
    uncertainty: The doctrine supplies considerations and examples, not a formula or a fixed control level for every operation.
      The facts do not specify the actual synchronization demands or risk level, so they do not support choosing one unchanging
      degree of centralization.
    handoff: The Commander makes the control judgment, taking applicable higher-echelon constraints and rules of engagement
      into account. The doctrine identifies those constraints as considerations but does not prescribe a mandatory referral
      to another office.
    tempting_wrong:
      option: O3
      pull: Close synchronization can make centralized control and detailed coordination appropriate.
      why_wrong: That consideration is conditional; applying centralization as a fixed answer would disregard circumstances
        where it is unnecessary and could cost subordinate initiative.
    rejected:
      O2: Decentralization can preserve initiative, but it is not the answer for every phase because close synchronization
        and acceptable risk may warrant tighter control.
      O3: Centralization may be warranted for close synchronization, but a fixed centralized posture fails to account for
        operations and phases where initiative is available and detailed synchronization is excessive.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The operation or phase requires close synchronization of multiple units or integration of effects in limited time.
      then: O3
      why: The doctrine says such circumstances may require detailed coordination and more centralized control.
    - id: flip2
      if: The operation does not require close coordination and offers meaningful opportunities for subordinate initiative.
      then: O2
      why: The doctrine says these opportunities may be lost if too much emphasis is placed on detailed synchronization.
    would_not_change:
    - id: noflip1
      if: The operation calls for highly controlled execution.
      why: That circumstance does not eliminate the need for subordinates to address unexpected problems and act on the commander's
        intent when existing orders no longer fit.
    watch_for:
    - id: watch1
      what: Changes in risk, legal and ethical ambiguity, rules of engagement, training, trust, shared understanding, or synchronization
        requirements.
      favors:
      - O1
      why: These are identified considerations for determining the appropriate level of control and may require reassessment
        as the situation evolves.
  lesson: 'Choose the degree of control that fits the situation: close synchronization may justify more centralized control,
    while room for initiative argues against needless detailed control. Reassess as conditions change, and preserve subordinate
    freedom to the extent acceptable risk allows.'
  limits: This is guidance for command-level control policy, not a procedure for carrying out any named operation. It does
    not determine a specific control level without facts about the operation, its risks, and the other relevant considerations.
