case:
  id: DR-CORPUS-NX-a17433ad-E3@v1
  title: Extending the DRS Service Life
  status: draft
  setting: Air Force Life Cycle Management Center, 27 May 2020; aircraft maintenance planning.
  decider: Air Force Life Cycle Management Center
  agent: Air Force Life Cycle Management Center
  agent_role: decide
  situation: The MA’s DRS 10-year shelf/service life had expired on 28 February 2019. AFLCMC had approved temporary extensions,
    with the most recent prior extension running through 30 June 2020. Parts later became available, and maintenance consolidation
    was the stated basis for considering a final extension. The MA was scheduled for cannibalization maintenance from 8 July
    through 21 August 2020. Replacement of the DRS with MASS was planned during that maintenance, and installation of MASS
    would negate required compliance with TCTO 11P2-3-502.
  question: What should AFLCMC do about extending the DRS shelf/service life beyond 30 June 2020?
  options:
    O1:
      do: AFLCMC denies an additional DRS shelf/service life extension beyond 30 June 2020.
      move: act
      irreversible: false
    O2:
      do: AFLCMC approves a final DRS shelf/service life extension through 31 July 2020.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The DRS 10-year shelf/service life expired on 28 February 2019.
  - id: F2
    kind: authority
    status: confirmed
    fact: AFLCMC approved the temporary DRS shelf/service life extensions.
  - id: F3
    kind: situation
    status: confirmed
    fact: The first extension was approved on 4 February 2019 through 30 September 2019 because parts were unavailable.
  - id: F4
    kind: situation
    status: confirmed
    fact: The second extension was approved on 26 September 2019 through 30 June 2020 because parts were unavailable.
  - id: F5
    kind: situation
    status: confirmed
    fact: Parts became available before the final extension decision, and maintenance consolidation efforts were the stated
      basis for that extension.
  - id: F6
    kind: situation
    status: confirmed
    fact: The MA was scheduled for cannibalization maintenance from 8 July 2020 to 21 August 2020.
  - id: F7
    kind: situation
    status: confirmed
    fact: The DRS was scheduled to be replaced with MASS during the MA’s cannibalization maintenance.
  - id: F8
    kind: situation
    status: confirmed
    fact: Installing MASS would negate required compliance with TCTO 11P2-3-502.
  considerations:
  - id: C1
    facts:
    - F1
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The DRS had passed its stated 10-year shelf/service life, which weighs against continued use. No specific safety-risk
      assessment for the additional month is provided.
  - id: C2
    facts:
    - F2
    - F5
    - F6
    - F7
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: AFLCMC approved the final extension for maintenance consolidation, with replacement planned during the MA’s scheduled
      cannibalization maintenance. This supports a limited extension tied to that maintenance plan.
  - id: C3
    facts:
    - F7
    - F8
    equity: policy_compliance
    favors:
    - O2
    weight: weak
    why: Installing MASS would negate the required compliance with TCTO 11P2-3-502, supporting the planned transition to the
      replacement. This does not itself remove the service-life issue before installation.
  - id: C4
    facts:
    - F3
    - F4
    - F5
    equity: policy_compliance
    favors:
    - O1
    - O2
    weight: weak
    why: The earlier extensions addressed unavailable parts, but parts were available by the final decision; maintenance consolidation,
      rather than continued parts unavailability, was the stated basis for the last extension.
  reasoning:
    read: This is a time-limited maintenance-planning decision about an item whose stated service life had expired, not a
      finding that the item was safe or unsafe for continued use. The trap is treating either the expired life as an automatic
      bar or the later MASS installation as if it erased the interim service-life concern.
    weighing: The expired service life weighs against further extension {C1}. AFLCMC nevertheless approved a final extension
      through 31 July for maintenance consolidation, aligned with planned replacement during the 8 July–21 August maintenance
      period {C2}. MASS installation would negate the TCTO compliance requirement, but only upon installation; it is not a
      general waiver for the period before then {C3}. The balance favors the narrowly dated extension for consolidation, while
      the basis depends on the stated maintenance and replacement schedule remaining credible.
    tradecraft: Record the extension’s final date, maintenance-consolidation rationale, and planned replacement schedule.
      Treat any change to that schedule as a reason to reassess rather than silently carrying the extension forward.
    uncertainty: The available facts do not state the technical safety assessment supporting continued service, the criteria
      used to approve the extension, or what would happen if the maintenance schedule changed.
    handoff: AFLCMC made the extension decision. Maintenance planners should coordinate the scheduled maintenance and replacement
      so the limited extension remains tied to its stated purpose.
    tempting_wrong:
      option: O1
      pull: The service life had expired, so denying any further extension may appear to be the safest or most policy-compliant
        course.
      why_wrong: That approach would disregard AFLCMC’s stated maintenance-consolidation rationale and the planned replacement
        during the upcoming maintenance period, which supported the final, limited extension.
    rejected:
      O1: AFLCMC did not deny the extension; it approved a final extension through 31 July for maintenance consolidation ahead
        of planned replacement.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The planned maintenance consolidation and MASS replacement were no longer expected to occur within the stated maintenance
        plan.
      then: O1
      why: The stated reason for the final extension was maintenance consolidation alongside planned replacement; without
        that basis, the expired service life would weigh more heavily against extending.
    would_not_change:
    - id: noflip1
      if: Parts are available while the maintenance-consolidation and replacement plan remains in place.
      why: Parts were already available before the final decision, yet AFLCMC stated maintenance consolidation as the basis
        for the final extension.
    watch_for:
    - id: watch1
      what: Whether the planned maintenance and MASS replacement remain on schedule before the final extension expires.
      favors:
      - O1
      why: A delay could undermine the time-limited maintenance-consolidation basis for allowing service beyond the expired
        life.
  lesson: An expired service life is a serious consideration, but a limited extension may be justified when it is tied to
    a near-term maintenance plan and replacement. Keep that approval bounded by its stated date and rationale; a later configuration
    change does not erase the interim service-life issue.
  limits: This reasoning supports only the final extension described, not an open-ended extension or a finding that continued
    service was technically safe. The available facts provide no detailed safety assessment or general rule for extensions
    in other circumstances.
