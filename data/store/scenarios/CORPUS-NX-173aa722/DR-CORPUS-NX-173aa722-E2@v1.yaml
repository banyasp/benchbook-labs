case:
  id: DR-CORPUS-NX-173aa722-E2@v1
  title: Whether to Approve a Controlled Operation
  status: draft
  setting: Okhrana headquarters during the First World War.
  decider: The Okhrana directorate.
  agent: The Okhrana directorate
  agent_role: decide
  situation: The Okhrana was supposed to confine its work to activity against revolutionaries, and headquarters approval was
    required for the proposed operation. A foreign service had offered to involve an Okhrana agent in a double-agent role
    connected to sabotage activity. The directorate assessed that the German service would pursue sabotage and propaganda
    activities with or without the agent. It also assessed that controlled participation could provide information about German
    intentions and help uncover other operations. The directorate had to decide whether the agent should proceed under Okhrana
    control or whether the proposal should be rejected.
  question: What should the Okhrana directorate do about the proposal to permit the agent to proceed in a controlled double-agent
    operation?
  options:
    O1:
      do: The Okhrana directorate approves the agent's participation in a controlled double-agent operation.
      move: act
      irreversible: false
    O2:
      do: The Okhrana directorate rejects the agent's participation in a controlled double-agent operation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Okhrana was supposed to confine its work to activity against revolutionaries.
  - id: F2
    kind: authority
    status: confirmed
    fact: Headquarters approval was required for the proposed operation.
  - id: F3
    kind: situation
    status: confirmed
    fact: A foreign service had offered to involve an Okhrana agent in a double-agent operation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The German service would pursue sabotage and propaganda activities with or without the agent.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The German service's confidence in the agent could reduce its effort on other such missions.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The operation could provide regular information about the German service's intentions, methods, and program.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The operation could help uncover other German operations.
  considerations:
  - id: C1
    facts:
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The German service was assessed as likely to pursue sabotage and propaganda whether or not this agent participated,
      so rejection would not by itself remove those activities.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The directorate assessed that German confidence in the agent could reduce German effort on other missions of the
      same kind.
  - id: C3
    facts:
    - F6
    - F7
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Controlled participation could give the Okhrana regular information about German intentions, methods, and plans,
      and help uncover other German operations.
  reasoning:
    read: 'The proposal was not a choice between German activity and no German activity: the directorate assessed that the
      German service would pursue sabotage and propaganda in either case. The decision was whether controlled participation
      could exploit that activity for intelligence and reduce German effort elsewhere. The Okhrana''s ordinary remit made
      headquarters approval necessary.'
    weighing: 'The directorate favored proceeding because the assessed benefits were twofold: German confidence might divert
      effort from other missions, and the operation could provide information and expose further German activity. The balance
      depended on those assessments being credible; the stated rationale was not that participation would end the German program.'
    tradecraft: Record the approval, its rationale, the authority under which it is granted, and the limits of the decision.
      Maintain senior oversight and reassess whether the intelligence and diversion assumptions continue to hold.
    uncertainty: The case rests on assessments about what the Germans would do without the agent, how confidence in him might
      affect their other efforts, and how much useful intelligence the operation could provide. The source gives the directorate's
      rationale but does not quantify these expected benefits.
    handoff: The Okhrana directorate must decide because headquarters approval is required. Keep accountability at that level
      rather than treating the agent's participation as authority to expand the operation independently.
    tempting_wrong:
      option: O2
      pull: Rejecting the proposal avoids involving an Okhrana agent in a foreign service's sabotage and propaganda activity.
      why_wrong: That choice would not, on the directorate's assessment, prevent the German service from pursuing those activities,
        and it would forgo the expected diversion and intelligence benefits.
    rejected:
      O2: The directorate did not choose rejection because it assessed that the German service would proceed anyway and that
        controlled participation could both divert effort and provide intelligence.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The directorate instead assessed that the German service would not pursue these activities without the agent.
      then: O2
      why: The rationale that controlled participation redirects an activity the Germans would undertake anyway would no longer
        hold.
    - id: flip2
      if: The directorate assessed that participation would provide neither meaningful information about German plans nor
        a chance to uncover other operations.
      then: O2
      why: The principal intelligence benefits stated for accepting the operation would be absent.
    would_not_change:
    - id: noflip1
      if: The Okhrana's ordinary remit remains limited to activity against revolutionaries, but headquarters approval is obtained
        and the stated intelligence and diversion assessments remain intact.
      why: The remit makes headquarters approval necessary; it does not, by itself, displace the directorate's stated reasons
        for favoring the controlled operation.
    watch_for:
    - id: watch1
      what: Whether the German service's confidence continues to reduce its effort on other missions and whether the operation
        continues to yield useful information about its plans.
      favors:
      - O2
      why: If the expected benefits do not materialize, the basis for continuing to favor participation weakens.
  lesson: When an adversary is assessed to be pursuing an activity regardless, controlled participation may be justified if
    it credibly diverts effort and yields useful intelligence. That judgment depends on headquarters authority and on the
    expected benefits remaining credible; it is not a general permission to participate in such activity.
  limits: This reasoning applies to the directorate's stated assessment of this proposal, not to every double-agent operation
    or to the legality of particular sabotage or propaganda acts. It does not establish that participation is justified when
    the adversary would not otherwise act or when the expected intelligence and diversion benefits are absent.
