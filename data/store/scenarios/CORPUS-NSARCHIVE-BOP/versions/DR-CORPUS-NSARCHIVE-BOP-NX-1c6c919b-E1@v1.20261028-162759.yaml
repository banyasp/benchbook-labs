case:
  id: DR-CORPUS-NSARCHIVE-BOP-NX-1c6c919b-E1@v1
  title: Whether to Preserve Air Operations
  status: draft
  setting: Bay of Pigs planning, U.S. administration, before the landing operation
  decider: The President
  agent: The President
  agent_role: decide
  situation: The President had rejected the Trinidad plan as too conspicuous and too much like an invasion. The replacement
    plan had to satisfy conditions imposed by the President and the State Department, including a first-day airfield requirement
    for supporting air operations. Planners identified only one location that met the requirement. Operational officials assessed
    that the selected area could be held only briefly and that the brigade had no chance of breaking out. One operational
    participant believed the President had not been informed of the asserted necessity of eliminating the opposing air force.
    The decision concerns continued air operations amid political constraints and the stated consequences for the Cuban troops.
  question: What should the President do about continuing the planned air operations under the political constraints?
  options:
    O1:
      do: The President should reject continued air operations for the Cuban operation.
      move: act
      irreversible: false
    O2:
      do: The President should request an operational assessment from the senior officials before deciding.
      move: ask
      irreversible: false
      to: the senior operational officials
    O3:
      do: The President should approve continued air operations for the Cuban operation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The President rejected the Trinidad plan because it was considered too conspicuous and too much like an invasion.
  - id: F2
    kind: situation
    status: assessed
    fact: The President and the State Department imposed a first-day airfield requirement for supporting air operations.
  - id: F3
    kind: capability
    status: assessed
    fact: Planners identified only the Bay of Pigs as a location meeting the stated requirement.
  - id: F4
    kind: situation
    status: assessed
    fact: The President gave the planners three days to develop a plan.
  - id: F5
    kind: capability
    status: assessed
    fact: Operational officials warned that the selected area could be held only briefly and that the brigade had no chance
      of breaking out.
  - id: F6
    kind: situation
    status: assessed
    fact: An operational participant believed the President had not been informed of the asserted necessity of eliminating
      the opposing air force.
  - id: F7
    kind: situation
    status: assessed
    fact: An operational participant considered preserving air capability important to the Cuban troops and objected to canceling
      the final air operation.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: The President rejected the more conspicuous Trinidad plan, and the political constraints shaped the replacement plan.
      Those constraints support restraint in continuing air operations, although the excerpt does not explicitly say they
      required rejecting them.
  - id: C2
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: An operational participant believed the President had not been told why eliminating the opposing air force was considered
      necessary. That information gap weighs in favor of obtaining the officials' assessment before deciding.
  - id: C3
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: An operational participant said preserving air capability mattered to the Cuban troops and objected to canceling
      the final air operation, describing it as a matter of honor toward those troops.
  - id: C4
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The replacement location was the only one identified as meeting the imposed requirement, yet operational officials
      warned that it could be held only briefly and that the brigade had no chance of breaking out. Those warnings weigh against
      treating the constrained plan as a sound basis for expanding or continuing the operation.
  reasoning:
    read: The decision sits between political limits on the operation and an operational participant's claim that air capability
      was necessary for the Cuban troops. The trap is to assume that selecting a location to meet an airfield requirement
      settled whether continued air operations were acceptable, or that the President had received the asserted operational
      rationale.
    weighing: The outcome is O1, but the source's reasons are in tension rather than forming a clear consensus. The President's
      rejection of Trinidad and the political constraints support restraint {C1}; the warnings about the selected area's limits
      add caution {C4}. Against that, an operational participant said the President had not been informed of the asserted
      necessity of eliminating the opposing air force {C2}, and objected that canceling the final air operation failed the
      Cuban troops {C3}. The balance depends on whether the political constraints are treated as controlling despite that
      claimed information gap; the excerpt does not resolve that conflict.
    tradecraft: Record the political constraints, the operational warning, and the participant's claimed briefing gap as distinct
      considerations. Do not describe the cancellation as an operational consensus, and keep the final decision and its rationale
      attributable to the President.
    uncertainty: The excerpt gives one operational participant's view that the President had not been informed of the asserted
      necessity of eliminating the opposing air force, but does not establish what the President was actually told or explain
      the full basis for rejecting continued air operations.
    handoff: The President retains the decision. The senior operational officials are the relevant source for clarifying the
      asserted necessity and consequences, because the account identifies a possible gap in the President's information; the
      source does not establish that such a briefing occurred.
    tempting_wrong:
      option: O3
      pull: An operational participant said preserving air capability was important to the Cuban troops and objected to canceling
        the final air operation.
      why_wrong: That participant's view does not erase the political constraints, the President's rejection of the earlier
        plan, or the warning that the replacement operation had severe limits; the excerpt records a dispute rather than an
        agreed operational judgment.
    rejected:
      O2: A request for an assessment would address the claimed information gap, but it is not the selected outcome; the source
        records the political decision and a participant's later criticism rather than a decision to defer.
      O3: The source records an operational participant's argument for preserving air capability, but the required outcome
        is rejection of continued air operations under the political constraints.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The President receives a clear operational assessment substantiating that continued air operations are necessary
        to protect the Cuban troops, and decides that this outweighs the political constraints.
      then: O3
      why: That would address the reported information gap and give greater weight to the participant's stated concern for
        the troops.
    would_not_change:
    - id: noflip1
      if: The Trinidad plan remains rejected as too conspicuous and too much like an invasion.
      why: That constraint alone does not resolve the separate question of whether continued air operations are acceptable.
    watch_for:
    - id: watch1
      what: Whether the President was informed of, and accepted, the asserted necessity of eliminating the opposing air force.
      favors:
      - O2
      - O3
      why: The participant's belief that the President had not been informed makes the completeness of the decision-maker's
        information material.
  lesson: Political constraints and operational necessity should be weighed separately rather than treating a constrained
    plan as proof that its operational assumptions are sound. When a decision-maker may not have been told why an action is
    considered necessary, that information gap should be made visible before the decision is treated as settled.
  limits: This reasoning is limited to the political and operational judgments recorded in this excerpt. It does not establish
    the governing legal rules, the full presidential briefing, or the actual consequences of continuing or canceling air operations.
