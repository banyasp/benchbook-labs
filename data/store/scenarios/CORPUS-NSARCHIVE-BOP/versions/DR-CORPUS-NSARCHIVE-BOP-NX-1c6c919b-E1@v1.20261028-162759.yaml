basis: The President rejected Trinidad as too conspicuous and too much like an invasion, and was described as opposed to the
  use of aircraft; an operational participant later criticized the failure to preserve air capability and the cancellation
  of the final air operation. The excerpt does not provide an express presidential rationale for canceling continued air operations.
