case:
  id: DR-CORPUS-NSARCHIVE-BOP-NX-3f42bccd-E2@v1
  title: Reimbursement Under an Oral Arrangement
  status: draft
  setting: Guatemala, 1960, Agency Headquarters
  decider: Agency Headquarters
  agent: Agency Headquarters
  agent_role: decide
  situation: Agency Headquarters faced expenses claimed in connection with work performed for the Agency under an open-ended
    oral arrangement. A roadway used to access a finca was reported considerably damaged, and its repair was estimated at
    $100,000; a further $50,000 was sought for rock taken from a property owner's land. An engineering assessment indicated
    that the roadway required paving at an estimated cost of $185,000, while the property owner had been unable to raise the
    difference between the earlier $100,000 approval and the contract price. Agency expenses also included $32,000 for aircraft
    use and airstrip work. No written contract had been executed, but the Agency had stated that it felt morally and legally
    obligated to reimburse expenses incurred for the project if a claim was submitted.
  question: What should Agency Headquarters do about the claimed expenses under the oral arrangement?
  options:
    O1:
      do: Agency Headquarters requests supporting expense records from the local office before reimbursement.
      move: ask
      irreversible: false
      to: the local office
    O2:
      do: Agency Headquarters declines reimbursement of submitted expenses under the oral arrangement.
      move: act
      irreversible: false
    O3:
      do: Agency Headquarters authorizes reimbursement of submitted expenses under the oral arrangement.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Seventeen kilometers of roadway used as an access road to a finca were reportedly damaged considerably.
  - id: F2
    kind: situation
    status: assessed
    fact: The requested compensation included $100,000 for roadway repairs and $50,000 for rock taken from five acres of a
      property owner's land.
  - id: F3
    kind: situation
    status: assessed
    fact: The proposed $50,000 payment was to be made upon preparation and delivery of local legal documents, with copies
      and a receipt to be sent to Headquarters.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The local office assessed that delay in payment would seriously affect Agency activities and liaison with senior
      Guatemalan government officials and materially jeopardize the project.
  - id: F5
    kind: situation
    status: assessed
    fact: An engineering assessment indicated that the road would need paving, estimated at $185,000, and that the property
      owner could not raise the difference between the earlier $100,000 approval and the contract price.
  - id: F6
    kind: authority
    status: confirmed
    fact: Agency Headquarters authorized negotiation up to a maximum of $130,000 if necessary.
  - id: F7
    kind: situation
    status: confirmed
    fact: Other Agency expenses included $32,000 for aircraft use and for repaving and maintaining an airstrip on the property.
  - id: F8
    kind: authority
    status: confirmed
    fact: The parties' arrangement was an open-ended oral contract, and no written contract had been executed.
  - id: F9
    kind: authority
    status: assessed
    fact: The Agency's stated position was that it felt morally and legally obligated to reimburse project expenses if a claim
      was submitted.
  considerations:
  - id: C1
    facts:
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The absence of a written contract did not displace the Agency's stated position that it was morally and legally obligated
      under the open-ended oral arrangement to reimburse expenses incurred for the project when a claim was submitted.
  - id: C2
    facts:
    - F1
    - F2
    - F7
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The claimed road damage, rock taken from a property owner's land, and additional aircraft and airstrip expenses were
      treated as project-related costs; the Agency assessed the owner's claims as legitimate expenses under the arrangement.
  - id: C3
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The local office warned that delaying payment would seriously affect Agency activities and liaison with senior government
      officials and materially jeopardize the project; prompt payment of the rock claim was tied to preparation and delivery
      of local legal documents.
  - id: C4
    facts:
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O3
    - O1
    weight: weak
    why: The paving estimate exceeded the earlier road-repair approval, but Headquarters authorized negotiation up to $130,000
      if necessary. This supports reimbursement of legitimate costs within the authorized arrangement, while making the negotiated
      amount and supporting claim important to accountability.
  reasoning:
    read: This is a reimbursement decision under an open-ended oral arrangement, not a salary decision and not a choice to
      make an unbounded payment. The trap is treating the lack of a signed contract as if it erased the Agency's stated moral
      and legal commitment, or treating that commitment as authorization to pay any amount without regard to the claim and
      the negotiated limits.
    weighing: The Agency's stated obligation to reimburse submitted project expenses, the assessment that the claims were
      legitimate, and the serious project and liaison consequences of delay favor {O3}. The higher paving estimate and the
      $130,000 negotiation authority make the amount and its support relevant, but do not overturn the stated reimbursement
      commitment; the balance depends on the expenses being claimed as project expenses and on negotiation remaining within
      Headquarters' authority.
    tradecraft: Authorize reimbursement of submitted project expenses, keeping the claims and negotiated amounts tied to the
      oral arrangement. For the rock payment, obtain the local legal documents and receipt and forward copies to Headquarters
      as specified; preserve supporting records so the authorization and amounts can be accounted for.
    uncertainty: The final negotiated road-repair amount and the item-by-item support for all claims are not specified here.
      The Agency's obligation was stated in relation to expenses incurred for the project and submitted as claims, rather
      than as a fixed total payment.
    handoff: Headquarters is the decision-maker and had already authorized the relevant payments and negotiation. The local
      office should provide the submitted claims and the required local documents and receipt so Headquarters can maintain
      an accountable record.
    tempting_wrong:
      option: O2
      pull: Declining may seem prudent because no written contract was executed and the road estimate exceeded the earlier
        approval.
      why_wrong: That would disregard the open-ended oral arrangement and the Agency's express position that it was morally
        and legally obligated to reimburse submitted project expenses; it would also discount the stated risk that delay would
        harm Agency activities and liaison.
    rejected:
      O1: Requesting records before acting would delay payment despite the stated urgency, although the required legal documents
        and receipt should still accompany the payment record.
      O2: Declining would conflict with the Agency's stated reimbursement obligation for submitted expenses under the oral
        arrangement.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A submitted claim could not be supported as an expense incurred for the project.
      then: O1
      why: The stated commitment covers project expenses submitted for reimbursement; a support gap would justify obtaining
        records before authorizing payment.
    would_not_change:
    - id: noflip1
      if: The parties still had no written contract.
      why: The Agency's stated moral and legal obligation arose under the open-ended oral arrangement despite the absence
        of a written contract.
    watch_for:
    - id: watch1
      what: Preparation and delivery of the local legal documents for the rock payment, followed by forwarding copies and
        a receipt to Headquarters.
      favors:
      - O3
      why: These were specified as the basis for immediate payment and for Headquarters' records.
  lesson: An unsigned agreement does not by itself defeat a reimbursement obligation when the responsible office has recognized
    an oral arrangement and committed to pay submitted project expenses. Honor that commitment while linking payment to the
    claimed project costs, the authority granted, and a record adequate to account for the decision.
  limits: This reasoning applies to expenses claimed under the described oral arrangement and the Agency's stated reimbursement
    commitment. It does not establish that every claimed amount is automatically payable, or that the same obligation exists
    where the expense is outside the arrangement or the decision-maker lacks authority.
