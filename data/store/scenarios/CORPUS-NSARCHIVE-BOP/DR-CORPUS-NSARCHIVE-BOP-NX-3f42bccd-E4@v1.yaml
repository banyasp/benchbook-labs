case:
  id: DR-CORPUS-NSARCHIVE-BOP-NX-3f42bccd-E4@v1
  title: Authority to Commit Volunteer Personnel
  status: draft
  setting: Agency Headquarters, Washington, early hours of 14 November 1960; request concerning Guatemala.
  decider: The Deputy Director of Plans
  agent: The Deputy Director of Plans
  agent_role: decide
  situation: An uprising was making the Guatemalan government's position increasingly difficult, while rebel forces were gaining
    ground. The government had declared a 30-day state of siege and called an emergency session of Congress. It sought Cuban
    volunteers and volunteer U.S. pilots to support its effort against the uprising. A request to commit 218 Cuban volunteers
    and use volunteer U.S. pilots reached Headquarters in the early hours of 14 November 1960. The Deputy Director of Plans
    sought a decision from the State Department, but no timely decision was available.
  question: What should the Deputy Director of Plans do about the request to commit volunteer personnel in support of the
    Guatemalan government's effort to suppress the uprising?
  options:
    O1:
      do: The Deputy Director of Plans authorizes the requested commitment of Cuban volunteers and volunteer U.S. pilots in
        support of the government.
      move: act
      irreversible: false
    O2:
      do: The Deputy Director of Plans declines the requested commitment of Cuban volunteers and volunteer U.S. pilots in
        support of the government.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Guatemalan government's position was becoming increasingly difficult, and rebel forces were gaining ground.
  - id: F2
    kind: situation
    status: confirmed
    fact: The government declared a 30-day state of siege and called an emergency session of Congress.
  - id: F3
    kind: situation
    status: confirmed
    fact: The government wanted Cuban volunteers to help put down the revolt, and the majority of those volunteers had volunteered
      to fight for Guatemala.
  - id: F4
    kind: situation
    status: assessed
    fact: Headquarters had apparently not yet answered an earlier request concerning U.S. pilots and Cuban troops.
  - id: F5
    kind: situation
    status: confirmed
    fact: A request reached Headquarters shortly before 0300 Washington time on 14 November 1960 for permission to commit
      218 Cuban volunteers.
  - id: F6
    kind: situation
    status: confirmed
    fact: The request also sought permission to use U.S. pilots who volunteered to fight for the Guatemalan government.
  - id: F7
    kind: situation
    status: assessed
    fact: The Deputy Director of Plans contacted the State Department but could not obtain a decision at that hour; the Department
      could not decide the matter within an hour.
  - id: F8
    kind: authority
    status: assessed
    fact: The Deputy Director of Plans regarded the decision as one that should not be left to the local representative.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The government's position was worsening and the rebels were gaining ground, making the request time-critical.
  - id: C2
    facts:
    - F5
    - F7
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The Deputy Director of Plans could not obtain a State Department decision in the available time; the Department was
      not equipped to decide within an hour.
  - id: C3
    facts:
    - F7
    - F8
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The Deputy Director of Plans concluded that the decision should not be left to the local representative and accepted
      responsibility for deciding it.
  reasoning:
    read: This was an urgent request for authority to commit volunteer personnel while the Guatemalan government's position
      deteriorated. The trap was allowing the decision to default to the local representative merely because the State Department
      could not respond on the compressed timetable.
    weighing: The worsening situation and lack of a timely State Department decision favored acting rather than letting the
      request go unanswered. The Deputy Director of Plans also believed the decision should not be left to the local representative,
      so he authorized the request on his own responsibility. This balance depends on the urgency and the absence of a timely
      decision from the State Department; it does not establish that such requests should always be approved.
    tradecraft: Record that the Deputy Director of Plans made the decision on his own responsibility after seeking State Department
      guidance and receiving no timely decision. Keep the authorization within the request's stated volunteer-only scope.
      This is decision documentation, not guidance on carrying out the operation.
    uncertainty: The urgency, the unsuccessful effort to obtain a timely State Department decision, and the judgment that
      the decision should not be left to the local representative are established. A legal standard, the limits of the Deputy
      Director's formal authority, and likely effects on civilians are not specified.
    handoff: The Deputy Director of Plans sought a decision from the State Department because the matter was significant,
      but decided rather than leave it to the local representative when the Department could not respond in time.
    tempting_wrong:
      option: O2
      pull: Declining avoids committing personnel while the State Department's position is unknown.
      why_wrong: The urgent circumstances did not permit waiting for a timely State Department decision, and the Deputy Director
        of Plans did not think the decision should be left to the local representative.
    rejected:
      O2: The Deputy Director of Plans chose authorization on his own responsibility because the request was urgent and a
        timely State Department decision was unavailable.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A timely, applicable decision from the State Department or another competent authority directed that the personnel
        not be committed.
      then: O2
      why: The stated reason for acting was that no timely decision was available; contrary authoritative guidance would change
        the decision basis.
    - id: flip2
      if: The personnel were not volunteers, contrary to the request as framed.
      then: O2
      why: The request and the authorization described in the scenario are limited to volunteer personnel; without that condition,
        this would be a materially different request.
    would_not_change:
    - id: noflip1
      if: The State Department remained unable to decide within the urgent timeframe and no contrary authoritative direction
        arrived.
      why: That is the circumstance in which the Deputy Director of Plans accepted responsibility and authorized the request.
    watch_for:
    - id: watch1
      what: Whether timely guidance from the State Department or another competent authority becomes available before a decision
        must be made.
      favors:
      - O2
      why: The lack of a timely State Department decision was central to the Deputy Director of Plans' stated reason for acting.
  lesson: When a serious, time-critical request cannot receive timely higher-level guidance, the responsible decision-maker
    should not let the decision default to a local representative if that is not where responsibility belongs. Any action
    should remain tied to the request and the conditions on which it was made, and the reason for deciding should be recorded.
  limits: This reasoning addresses the Deputy Director of Plans' choice in this urgent situation, not the legality or wisdom
    of supporting a government in every uprising. No legal standard or evaluation of civilian effects is established here,
    so the reasoning should not be extended beyond the authority and facts presented.
