case:
  id: DR-CORPUS-NX-24e63698-E1@v1
  title: Assessing Engine Failure and Guidance Findings
  status: draft
  setting: Osan Air Base, Republic of Korea; 2012 aircraft accident investigation concerning the 21 March 2012 F-16CM mishap.
  decider: The AIB president
  agent: The AIB president
  agent_role: decide
  situation: The AIB president must assess the evidence concerning an engine failure that destroyed an F-16CM and whether
    maintenance guidance substantially contributed to the mishap. Examination of the engine found two incorrectly installed
    stator vane sectors, one rotated 180 degrees from its designed position. Engineering analysis connected the vane configuration
    to pressure variations and vibration associated with compressor blade fatigue and failure. Maintenance records documented
    an inspection before installation of the upper forward stator case, while testimony described a stator sector falling
    out during installation; the records do not document that event or a subsequent inspection. Technical guidance warned
    that a vane sector could be installed incorrectly but did not detail how that could occur, and the warning appeared as
    a note. The applicable standards are clear and convincing evidence for determining the cause and a preponderance of evidence
    for determining contributing factors.
  question: What should the AIB president do in making the causal and contributing-factor findings under the applicable evidentiary
    standards?
  options:
    O1:
      do: The AIB president rejects the stator-vane causal finding and the procedural-guidance contribution finding.
      move: act
      irreversible: false
    O2:
      do: The AIB president finds the stator-vane installation causal and the procedural guidance substantially contributory.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Engine examination found two incorrectly installed stator vane sectors, including one installed 180 degrees out
      and in the wrong position.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Engineering analysis associated the incorrectly installed sector with uneven compressor pressure and increased vibration;
      metallurgical analysis found fatigue fractures among the liberated compressor blades.
  - id: F3
    kind: situation
    status: confirmed
    fact: Records document an In Process Inspection before installation of the upper forward stator case but do not document
      a second inspection during reinstallation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A maintainer recalled a stator vane sector falling out during case installation, but could not recall the details
      of its reinstallation; other interviewed personnel did not identify which stator had fallen out.
  - id: F5
    kind: situation
    status: confirmed
    fact: Technical Order guidance said vane assemblies must be installed correctly and that a sector could be installed 180
      degrees out, but did not specify how the error could occur or include detailed drawings or photographs; the warning
      was labeled a note.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The analysis identified three possible stages of maintenance at which the installation error could have occurred
      and found no evidence that it was intentional or noticed by anyone involved.
  - id: F7
    kind: authority
    status: confirmed
    fact: The stated evidentiary standards are clear and convincing evidence to determine the cause and a preponderance of
      evidence to determine contributing factors.
  - id: F8
    kind: authority
    status: confirmed
    fact: Under 10 U.S.C. 2254(d), investigator opinions about cause or contributing factors may not be evidence in civil
      or criminal proceedings arising from the accident and may not be treated as admissions of liability by the United States
      or a person referred to in those opinions.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The engine examination and engineering and metallurgical analyses support the causal chain from the incorrectly installed
      stator sector, through pressure variation and vibration, to blade fatigue and engine failure. The AIB president found
      this established by clear and convincing evidence.
  - id: C2
    facts:
    - F5
    - F7
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: The guidance warned that incorrect installation was possible but did not explain how it could happen or show it with
      detailed drawings or photographs; the warning was a note despite the catastrophic risk. The AIB president found by a
      preponderance of evidence that this inadequate guidance substantially contributed.
  - id: C3
    facts:
    - F3
    - F4
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The records and recollection leave uncertainty about the specific reinstallation event and inspection, and the analysis
      identified multiple possible points when the error could have occurred. That uncertainty limits attribution to a particular
      step or person, but the AIB president's causal finding rests on the established engine configuration and failure mechanism,
      not on resolving that detail.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors: []
    weight: weak
    why: The statutory rule bars using the investigator's causal and contributing-factor opinions as evidence in civil or
      criminal proceedings arising from the accident, or treating them as admissions of liability. It limits the legal effect
      of the findings, but does not displace the investigative judgment being made here.
  reasoning:
    read: The decision is whether the evidence supports an engine-failure cause and a contributing guidance deficiency under
      two different evidentiary thresholds. The trap is to treat uncertainty about exactly when the stator sector was misplaced,
      or the undocumented fall-and-reinstallation account, as defeating the engine-level causal analysis or as proof against
      a particular maintainer.
    weighing: The engine examination and technical analyses support the stator-vane failure chain at the clear-and-convincing
      level {C1}. Separately, the limited detail and low-level labeling of the guidance, considered against the catastrophic
      consequence, support a substantial contribution by a preponderance {C2}. The uncertain maintenance sequence limits individual
      attribution, not these findings {C3}. The statutory restriction governs later evidentiary use and liability implications,
      not whether the AIB president records the investigative findings {C4}.
    tradecraft: Record the causal and contributing findings separately, identify the standard applied to each, and distinguish
      the established failure mechanism from the unresolved details of the maintenance sequence. Preserve the statutory limitation
      in any account of the findings and avoid characterizing them as an admission of liability.
    uncertainty: The evidence does not identify which of the possible maintenance stages produced the error or establish the
      details of the sector's reinstallation after it fell out. The source nevertheless treated the engine examination and
      failure analyses as sufficient for causation, and the guidance deficiencies as sufficient for contribution.
    handoff: The AIB president should make the findings on the investigative record, using the technical and metallurgical
      analysis for the causal chain and legal advice to keep the evidentiary standards and statutory limitation distinct.
      The unresolved sequence does not require assigning an individual maintainer responsibility.
    tempting_wrong:
      option: O1
      pull: The records do not document a second inspection, and testimony about a sector falling out does not settle what
        happened next.
      why_wrong: That uncertainty concerns the precise maintenance sequence; it does not overcome the engine examination and
        technical analysis supporting causation, or the evidence that the guidance inadequately explained a catastrophic risk.
    rejected:
      O1: The AIB president did not reject the findings because the causal mechanism met the clear-and-convincing standard
        and the guidance contribution met the preponderance standard.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The causal analysis no longer established a link between the incorrectly installed sector and the engine failure,
        and the evidence also no longer supported that deficient guidance substantially contributed.
      then: O1
      why: Without adequate support for either finding under its applicable evidentiary standard, rejecting both findings
        would be warranted.
    would_not_change:
    - id: noflip1
      if: The evidence still could not establish which maintenance stage produced the installation error or exactly how the
        sector was reinstalled.
      why: The source identified multiple possible stages and still based causation on the engine configuration and technical
        failure analysis, rather than on resolving the exact sequence.
    watch_for: []
  lesson: Apply each evidentiary standard to the finding it governs, and keep an established technical causal chain distinct
    from uncertainty about the precise human or procedural sequence. A finding about investigative cause or contribution is
    not, by itself, an admission of liability or evidence in the proceedings covered by 10 U.S.C. 2254(d).
  limits: This reasoning addresses the AIB president's causal and contributing-factor findings in this investigation. It does
    not decide individual disciplinary or civil liability, and it does not determine how the statutory restriction applies
    beyond the proceedings specified in 10 U.S.C. 2254(d).
