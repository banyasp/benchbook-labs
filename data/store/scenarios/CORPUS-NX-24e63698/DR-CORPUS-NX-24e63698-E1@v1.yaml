basis: The AIB president found clear and convincing evidence that the engine failure followed liberation of two fifth-stage
  compressor blades, and found by a preponderance of evidence that procedural guidance substantially contributed by lacking
  sufficient detail about how the error could occur and the magnitude of its risk.
