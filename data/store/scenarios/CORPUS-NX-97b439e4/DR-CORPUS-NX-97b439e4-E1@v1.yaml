case:
  id: DR-CORPUS-NX-97b439e4-E1@v1
  title: US-French Countermaquis Participation Decision
  status: draft
  setting: Vietnam, 1950–1951; French high command and CIA.
  decider: The French military commander in Indochina
  agent: The French military commander in Indochina
  agent_role: decide
  situation: A bilateral US-French countermaquis effort is under consideration in Vietnam. The plan was developed jointly
    by a US representative and a French intelligence officer, and the parties reached agreement in principle after the French
    understood the proposal was being advanced on the CIA’s behalf. A French military commander took over in December 1950
    and faced a decision about US participation. He feared that the United States would interfere in French affairs and oppose
    the plan. He also believed the United States ultimately sought to control the project.
  question: What should the French military commander in Indochina do about US participation in the proposed bilateral countermaquis
    effort?
  options:
    O1:
      do: The French military commander rejects US participation and continues the effort independently.
      move: act
      irreversible: false
    O2:
      do: The French military commander negotiates a limited US-French arrangement for the effort.
      move: act
      irreversible: false
    O3:
      do: The French military commander approves US participation in the bilateral countermaquis effort.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A US-French effort to establish collaboration on counterguerrilla issues was proposed.
  - id: F2
    kind: situation
    status: confirmed
    fact: The CIA plan was developed jointly by a US representative and a pro-American French intelligence officer.
  - id: F3
    kind: situation
    status: confirmed
    fact: The parties reached agreement in principle after the French understood the proposal was advanced on the CIA’s behalf.
  - id: F4
    kind: authority
    status: confirmed
    fact: The French military commander took over in December 1950.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The French military commander feared that the Americans would interfere in French affairs and oppose the plan.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The French military commander believed the Americans’ secret goal was to control the project.
  considerations:
  - id: C1
    facts:
    - F5
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The commander feared US interference in French affairs and opposition to the plan, making rejection consistent with
      his stated concern about preserving French control of the decision.
  - id: C2
    facts:
    - F6
    equity: control_integrity
    favors:
    - O1
    weight: strong
    why: The commander believed the United States ultimately sought to control the project; rejecting participation avoids
      accepting a partnership he regarded as a threat to French direction.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    equity: partner_relationship
    favors:
    - O2
    - O3
    weight: weak
    why: The effort was jointly developed and reached agreement in principle after the CIA role was understood, which supports
      considering cooperation; it does not, by itself, answer the commander’s later concerns.
  - id: C4
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Because the commander feared the United States would oppose the plan, he had reason to doubt that US participation
      would help the effort proceed as intended.
  reasoning:
    read: This was a choice about who would have influence over a proposed bilateral effort, not simply whether to cooperate
      with an ally. The parties’ agreement in principle did not settle the question for the commander who took over later;
      he saw a risk that US participation would mean interference or control.
    weighing: The commander’s stated fears of interference and control carry the decisive weight and support rejecting US
      participation. The earlier agreement in principle is a reason to consider cooperation, but does not overcome those concerns.
      The balance depends on whether the commander’s assessment of US intent and likely interference is credible; the source
      records his opposition, not independent proof of the alleged secret goal.
    tradecraft: Record the distinction between established agreement in principle and the commander’s assessments of US intent.
      State why US participation is rejected and what evidence of changed conditions would warrant reconsideration; do not
      present the feared control as independently established fact.
    uncertainty: The source gives the commander’s concerns and belief about US intent, but does not establish that the United
      States actually intended to control the project. The outcome therefore rests on the commander’s assessment of the political
      risk.
    handoff: The commander who took over is presented as making the decision. The source does not describe a referral or a
      separate approval process; any broader consultation or review would be a prudent addition, not a stated part of the
      decision.
    tempting_wrong:
      option: O3
      pull: The parties had already reached agreement in principle, and the proposal was jointly developed.
      why_wrong: That earlier agreement does not resolve the commander’s subsequent concern that US participation would bring
        interference or control.
    rejected:
      O2: A limited arrangement was not chosen because the source records the commander’s opposition to the project and does
        not identify limits that would answer his concern about US interference or control.
      O3: Approval was rejected because the commander feared US interference in French affairs and believed the United States
        ultimately sought to control the project.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible, enforceable terms were available that protected French direction and prevented the interference the commander
        feared.
      then: O2
      why: A limited arrangement could preserve cooperation while addressing the commander’s central concern about control.
    would_not_change:
    - id: noflip1
      if: The parties’ agreement in principle remained the only evidence supporting US participation.
      why: Agreement in principle alone would not resolve the commander’s stated fears of interference and control.
    watch_for:
    - id: watch1
      what: Evidence that the United States would oppose the plan or seek control of it.
      favors:
      - O1
      why: Such evidence would reinforce the concerns the commander gave for rejecting participation.
  lesson: A prior agreement to cooperate does not settle who should direct a joint effort after circumstances or decision-makers
    change. When a commander believes a partner’s participation would compromise independent control, distinguish that assessment
    from established fact and test whether meaningful limits could address it before approving or rejecting cooperation.
  limits: This reasoning concerns the commander’s stated political and control concerns in this historical decision. It does
    not establish that the United States actually intended to control the project, nor does it assess the operational methods
    or merits of the countermaquis effort.
