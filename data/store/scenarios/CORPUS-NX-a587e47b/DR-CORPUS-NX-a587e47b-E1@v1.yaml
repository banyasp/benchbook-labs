case:
  id: DR-CORPUS-NX-a587e47b-E1@v1
  title: Diplomatic Officials in Paris
  status: draft
  setting: Paris during the German advance; the ambassador’s diplomatic mission.
  decider: The ambassador
  agent: The ambassador
  agent_role: decide
  situation: A new French government was being formed while the French government was in disarray. German officials had initially
    shown friendliness. The ambassador and other diplomatic officials were in Paris, and continued presence offered an opportunity
    to gather intelligence from high-ranking sources. The United States and Britain were also concerned about the powerful
    French fleet, most of whose ships were in the Mediterranean, and opposed its takeover by Germany.
  question: What should the ambassador do about withdrawing the officials from Paris or keeping them there?
  options:
    O1:
      do: The ambassador retains the officials in Paris.
      move: act
      irreversible: false
    O2:
      do: The ambassador removes the officials from Paris.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A new French government was being set up.
  - id: F2
    kind: situation
    status: assessed
    fact: The French government was in complete disarray.
  - id: F3
    kind: intelligence
    status: assessed
    fact: German officials had initially shown friendliness.
  - id: F4
    kind: situation
    status: confirmed
    fact: The ambassador and diplomatic attachés were in Paris.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Continued presence in Paris offered an opportunity to gather intelligence from high-ranking sources.
  - id: F6
    kind: situation
    status: confirmed
    fact: The French fleet was powerful, and most of its ships were in the Mediterranean.
  - id: F7
    kind: situation
    status: assessed
    fact: The United States and Britain were concerned about the fate of the French fleet and did not want the German navy
      to take it over.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The ambassador chose to take advantage of the initial German friendliness by leaving the officials in Paris.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Remaining in Paris offered the opportunity to obtain intelligence from high-ranking sources, which the source gives
      as a reason for keeping the officials there.
  - id: C3
    facts:
    - F1
    - F2
    equity: mission_effect
    favors: []
    weight: weak
    why: A new government was being formed amid French governmental disarray. This is part of the situation, but the source
      does not expressly say how it weighed on withdrawal versus retention.
  - id: C4
    facts:
    - F6
    - F7
    equity: mission_effect
    favors: []
    weight: weak
    why: The United States and Britain were concerned about the French fleet, but the source does not connect that concern
      to whether the officials should remain in Paris.
  reasoning:
    read: 'This was a decision about whether to withdraw diplomatic officials during a changing political situation, not a
      decision about the later details of intelligence collection. The key trap is treating the fleet concern as a reason
      for either option: it is stated as a major concern, but no link to the officials'' presence is given.'
    weighing: 'The ambassador''s stated reasons favor retaining the officials: initial German friendliness made continued
      presence practicable, and Paris offered an opportunity to gather intelligence from high-ranking sources {C1} {C2}. The
      governmental transition and fleet concern provide context but do not independently tip the choice on the reasons given
      {C3} {C4}. The balance depends on those stated benefits remaining real.'
    tradecraft: Record that retention was chosen for the stated opportunity and initial conditions, and reassess if those
      conditions materially change. Do not treat later collection or escape arrangements as part of the justification for
      this decision.
    uncertainty: The passage does not explain how the fleet concern affected this choice, or set out a specific threshold
      for when German friendliness or the intelligence opportunity would cease to support remaining.
    handoff: The choice is attributed to the ambassador. The passage identifies no required approval or consultation, so none
      should be inferred from it.
    tempting_wrong:
      option: O2
      pull: Withdrawing could seem prudent amid the German advance and French governmental disarray.
      why_wrong: 'That pull does not displace the ambassador''s stated reasons for retaining the officials: initial German
        friendliness and the opportunity to gather intelligence.'
    rejected:
      O2: The ambassador did not withdraw the officials because he chose to benefit from initial German friendliness and the
        intelligence opportunity in Paris.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Initial German friendliness no longer provided a basis for the officials to remain.
      then: O2
      why: One of the ambassador's stated reasons for retaining the officials would no longer apply.
    - id: flip2
      if: Continued presence in Paris no longer offered an opportunity to gather intelligence from high-ranking sources.
      then: O2
      why: The other stated reason for retention would be absent.
    would_not_change:
    - id: noflip1
      if: The concern about the French fleet remained, without evidence that retaining the officials in Paris would affect
        its fate.
      why: The source identifies the concern but does not connect it to this withdrawal decision.
    watch_for:
    - id: watch1
      what: Whether the initial German friendliness and the intelligence opportunity that supported remaining continue to
        hold.
      favors:
      - O2
      why: A material change would weaken the source's stated reasons for retaining the officials.
  lesson: When a decision to remain is justified by a favorable initial posture and a continuing mission opportunity, identify
    those conditions as the basis for the choice. Separate major strategic concerns from the decision unless the evidence
    connects them to the available options.
  limits: This reasoning applies to the stated choice to retain diplomatic officials in Paris under initial German friendliness
    and an intelligence opportunity. It does not establish that remaining was safe under later conditions, or that the fleet
    concern could not matter if a direct connection to the officials' presence were shown.
