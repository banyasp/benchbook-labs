case:
  id: DR-CORPUS-NX-6a3a6a7a-E8@v1
  title: Command Choice at White Bird Canyon
  status: draft
  setting: White Bird Canyon, during the fight; military company command.
  decider: The force commander
  agent: The force commander
  agent_role: decide
  situation: 'During the fight at White Bird Canyon, the force commander faced three options: charge the village, continue
    defending, or retreat. An officer proposed charging the village as a way to regain the initiative. H Company held the
    right of the line. An experienced and competent lieutenant considered H Company’s position good. The force commander had
    to choose among attacking, remaining in defense, and withdrawing.'
  question: What should the force commander do at White Bird Canyon when choosing among charging the village, continuing the
    defense, and retreating?
  options:
    O1:
      do: The force commander directs continued defense at the current position.
      move: act
      irreversible: false
    O2:
      do: The force commander directs withdrawal to a more defensible position.
      move: act
      irreversible: true
    O3:
      do: The force commander directs a charge toward the village.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The options under consideration were charging the village, continuing to defend, or retreating.
  - id: F2
    kind: situation
    status: confirmed
    fact: An officer proposed a charge toward the village.
  - id: F3
    kind: situation
    status: assessed
    fact: The proposed charge was intended to regain the initiative.
  - id: F4
    kind: situation
    status: confirmed
    fact: H Company held the right of the line.
  - id: F5
    kind: capability
    status: assessed
    fact: A lieutenant was described as experienced and competent.
  - id: F6
    kind: situation
    status: assessed
    fact: The lieutenant considered H Company’s position good.
  - id: F7
    kind: situation
    status: assessed
    fact: The force commander stated that retreat was the only way to avoid catastrophic defeat.
  considerations:
  - id: C1
    facts:
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The commander judged retreat the only way to avoid catastrophic defeat, making withdrawal the choice he believed
      best protected his force.
  - id: C2
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The proposed charge had the stated purpose of regaining the initiative, but the commander overruled it; the source
      gives no further support for its prospects.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: An experienced and competent lieutenant considered H Company's position good, which supports considering continued
      defense, but the source does not say that this assessment changed the commander's judgment about catastrophic defeat.
  reasoning:
    read: The commander faced a choice among charging to regain the initiative, continuing to defend, and retreating. The
      trap is treating the proposed charge's stated purpose, or the favorable assessment of H Company's position, as resolving
      the broader choice; the commander's stated assessment was that only retreat could avoid catastrophic defeat.
    weighing: The charge offered the prospect of regaining the initiative {C2}, and the lieutenant's view gave some support
      to the defensive position {C3}. The commander nevertheless judged that those alternatives risked catastrophic defeat
      and directed withdrawal {C1}. On the reasons recorded, that assessment controls the balance in favor of {O2}; the source
      does not provide a fuller comparison of the alternatives.
    tradecraft: State the chosen course and its decision-level rationale clearly, and revisit the choice if materially new
      information changes the assessment of catastrophic defeat or the viability of the alternatives.
    uncertainty: The source does not explain the basis for the commander's assessment in detail or resolve the lieutenant's
      favorable view of H Company's position against it.
    handoff: The force commander made the choice. The lieutenant's assessment is relevant information for the commander to
      consider, but the source identifies no required referral to another authority.
    tempting_wrong:
      option: O3
      pull: The proposed charge was presented as a way to regain the initiative.
      why_wrong: The commander overruled it because he judged retreat the only way to avoid catastrophic defeat; the source
        supplies no basis for concluding that the charge would remove that danger.
    rejected:
      O1: The commander did not continue defending because he judged retreat to be the only way to avoid catastrophic defeat,
        despite the lieutenant's favorable assessment of H Company's position.
      O3: The commander overruled the proposed charge because he judged retreat to be the only way to avoid catastrophic defeat.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A materially revised assessment established that continued defense could avoid catastrophic defeat.
      then: O1
      why: That would undercut the stated reason for treating retreat as the only viable choice and could make continued defense
        preferable.
    - id: flip2
      if: A materially revised assessment established that charging could regain the initiative without exposing the force
        to catastrophic defeat.
      then: O3
      why: That would change the risk assessment underlying the commander's rejection of the charge.
    would_not_change:
    - id: noflip1
      if: The charge is proposed only as a means to regain the initiative, without new evidence that it avoids catastrophic
        defeat.
      why: The initiative objective alone does not answer the commander's stated concern about catastrophic defeat.
    - id: noflip2
      if: The lieutenant's favorable view of H Company's position is repeated without new information that changes the assessment
        of the overall situation.
      why: That view supports considering continued defense but does not, by itself, displace the commander's stated judgment
        that retreat was the only way to avoid catastrophic defeat.
    watch_for:
    - id: watch1
      what: Whether updated assessments materially change the perceived viability of the current defensive position.
      favors:
      - O1
      why: A changed assessment could affect whether continued defense remains a viable alternative to withdrawal.
  lesson: When a commander judges that only one available course avoids catastrophic defeat, that assessment can outweigh
    an alternative's appeal or a favorable assessment of one position. Reconsider the choice if materially new information
    changes the assessment on which that judgment depends.
  limits: The source records the commander's conclusion and two relevant considerations, but not the detailed evidence behind
    the risk assessment or a full comparison of the options. This reasoning does not establish that retreat is generally preferable
    to attack or continued defense.
