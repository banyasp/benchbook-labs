case:
  id: DR-CORPUS-NX-6a3a6a7a-E7@v1
  title: Negotiation and Conditional Defense
  status: draft
  setting: A Nez Perce village, early morning on 17 June, as the Army approached.
  decider: The Nez Perce leadership
  agent: The Nez Perce leadership
  agent_role: decide
  situation: The Army was approaching the village, and some leaders wanted to avoid battle and negotiate. Other leaders believed
    that the recent killings and reported rapes meant war. A group of six warriors was designated to speak with the soldiers,
    and the warriors were instructed not to fire unless fired upon. Many warriors were drunk and unavailable for the initial
    defense, while an estimated 60 to 80 were roused to prepare to resist. The leaders recognized that delaying the Army would
    allow older people and boys to gather the horses and women to move the village to safety.
  question: What should the Nez Perce leadership do as the Army approaches, given the disagreement over negotiation and the
    need to protect the village?
  options:
    O1:
      do: The Nez Perce leadership should disengage from initiating battle, seek negotiation, and retain a conditional defense
        of the village.
      move: act
      irreversible: false
    O2:
      do: The Nez Perce leadership should engage the Army in battle and set negotiation aside as the immediate course.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Some leaders wanted to avoid battle and negotiate with the approaching soldiers.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The leaders' intended subjects for negotiation were unknown, and it was considered unlikely that they would surrender
      the warriors involved in the revenge raids.
  - id: F3
    kind: situation
    status: confirmed
    fact: A group of six warriors was designated to speak with the soldiers, and all warriors were instructed not to fire
      unless fired upon.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Other leaders believed the killings and reported rapes meant that war would follow.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The reported violence included the killing of 18 American citizens, including two children, and the reported rape
      of four women.
  - id: F6
    kind: capability
    status: assessed
    fact: Many warriors were drunk after whiskey had been captured during the revenge raids and were unavailable for the initial
      defense.
  - id: F7
    kind: capability
    status: assessed
    fact: An estimated 60 to 80 warriors were roused to prepare to resist the Army.
  - id: F8
    kind: situation
    status: confirmed
    fact: The leaders recognized that delaying the Army would allow older people and boys to gather the horses and women to
      move the village to safety.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: Some leaders sought to avoid battle through negotiation, but the intended subjects were unknown and it was considered
      unlikely that they would surrender the warriors involved in the revenge raids, so the prospects for agreement were uncertain.
  - id: C2
    facts:
    - F3
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Designating speakers while directing the warriors not to fire unless fired upon preserved an opportunity to negotiate
      without abandoning a conditional defense.
  - id: C3
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Other leaders believed war would follow the killings and reported rapes, including the deaths of 18 American citizens,
      two of them children. Their assessment was a serious reason to prepare to resist, though it did not establish that battle
      had to be initiated immediately.
  - id: C4
    facts:
    - F8
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Delaying the Army would give older people and boys time to gather the horses and women time to move the village to
      safety, supporting a course that avoided initiating battle while preserving protection for the village.
  reasoning:
    read: 'The leadership faced a real disagreement: some wanted to avoid battle and negotiate, while others believed war
      would follow the recent violence. The trap is treating that expectation as proof that battle had to be initiated at
      once; the contemplated negotiation remained uncertain, but the leadership also retained a conditional defense.'
    weighing: The prospect of negotiation was limited by the unknown subjects for discussion and the assessment that the warriors
      involved in the revenge raids were unlikely to be surrendered {C1}. The opposing leaders' expectation of war gave a
      substantial reason to prepare to resist {C3}. On balance, the recorded course favored restraint because it kept negotiation
      open, conditioned firing on being fired upon, and allowed time to move people and horses to safety {C2} {C4}. That balance
      depends on negotiation remaining possible and on delay continuing to serve the village's safety.
    tradecraft: Make the purpose of the negotiation and the condition for defensive action explicit to the leadership, and
      keep the immediate priority of moving people to safety clear. Record the unresolved disagreement and the uncertainty
      about what negotiation could achieve; do not represent preparation to resist as consensus that battle should begin.
    uncertainty: The intended subjects of negotiation were unknown, and the assessment that the involved warriors were unlikely
      to be surrendered was not certainty {F2}. The source also records differing leadership assessments of whether war could
      be avoided {F1} {F4}.
    handoff: The leadership should resolve the disagreement collectively because the source presents this as a divided leadership
      decision and gives no separate authority or outside decision-maker.
    tempting_wrong:
      option: O2
      pull: The recent killings and reported rapes led some leaders to believe war was inevitable.
      why_wrong: That assessment supported readiness to resist, but did not erase the alternative of attempting negotiation
        while withholding fire unless fired upon and allowing people time to move to safety.
    rejected:
      O2: Immediate engagement was not chosen because the leadership retained a negotiation effort and conditional restraint
        while seeking time to move the village to safety.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Army fired first.
      then: O2
      why: The stated restraint was conditional on not being fired upon; that condition would no longer support withholding
        a defensive response.
    - id: flip2
      if: Reliable new information established that an attack was imminent and delay would no longer allow people to move
        to safety.
      then: O2
      why: The balance favoring negotiation and delay would be weakened if there were no meaningful opportunity to protect
        the village through those measures.
    would_not_change:
    - id: noflip1
      if: The intended subjects of negotiation remained unknown.
      why: Uncertainty about the terms limits confidence in negotiation, but by itself does not establish that an attempt
        should be abandoned.
    watch_for:
    - id: watch1
      what: Whether a workable negotiation can be held without surrendering the warriors involved in the revenge raids.
      favors:
      - O1
      - O2
      why: The source identifies both the uncertainty about what would be discussed and the assessment that surrender of those
        warriors was unlikely, making the feasibility of negotiation material to the balance.
  lesson: When leaders disagree about whether conflict is inevitable, an expectation of war can justify preparation without
    necessarily justifying initiating battle. Preserve a genuine opportunity to negotiate when possible, while making the
    conditions for defensive action and the protection of people at risk clear.
  limits: This reasoning applies to the recorded situation in which leaders contemplated negotiation, instructed restraint
    unless fired upon, and believed delay could help people move to safety. It does not establish what to do after an attack
    begins or where negotiation is no longer possible.
