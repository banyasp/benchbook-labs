case:
  id: DR-CORPUS-NX-b8ee8581-E18@v1
  title: Prisoners of War Working for Private Employers
  status: draft
  setting: A prisoner-of-war camp and a private employer; the source gives no date; military authorities and the camp commander
    are responsible for the arrangement.
  decider: The military authorities, in agreement with the private employer
  agent: The military authorities
  agent_role: decide
  situation: Prisoners of war may be working for a private employer while remaining under the camp commander's direct authority.
    Their treatment must be no less favourable than the Convention specifies. The camp commander retains ultimate responsibility
    for their maintenance, care, treatment, and working pay. Military authorities and the private employer are to settle the
    division of responsibilities by agreement. The employer has no disciplinary powers over the prisoners and may not use
    arms against them if they try to escape, except in self-defence.
  question: What should the military authorities do about private-employer work by prisoners of war?
  options:
    O1:
      do: The military authorities permit private-employer work for prisoners of war.
      move: act
      irreversible: false
    O2:
      do: The military authorities prohibit private-employer work for prisoners of war.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Prisoners of war may work for private employers.
  - id: F2
    kind: authority
    status: confirmed
    fact: If prisoners of war work for private employers, their treatment must be no less favourable than that specified in
      the Convention.
  - id: F3
    kind: authority
    status: confirmed
    fact: Prisoners of war working for private employers remain under the camp commander's direct authority.
  - id: F4
    kind: authority
    status: confirmed
    fact: The camp commander retains ultimate responsibility for prisoners' maintenance, care, treatment, and payment of working
      pay.
  - id: F5
    kind: authority
    status: confirmed
    fact: Military authorities and the private employer settle the precise division of responsibilities by agreement.
  - id: F6
    kind: situation
    status: confirmed
    fact: Prisoners of war working for private employers have the right to communicate with the prisoners' camp representatives.
  - id: F7
    kind: authority
    status: confirmed
    fact: The private employer has no disciplinary powers over prisoners of war.
  - id: F8
    kind: authority
    status: confirmed
    fact: The private employer may not use arms against prisoners of war attempting escape, except in self-defence.
  - id: F9
    kind: authority
    status: confirmed
    fact: For prisoners working for a private employer, the alternatives stated are military guards or release on parole.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Private-employer work is compatible with the stated standard only if prisoners receive treatment no less favourable
      than the Convention requires; they remain under the camp commander's direct authority, who retains ultimate responsibility
      for their welfare and working pay.
  - id: C2
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: 'The source provides a way to allocate responsibilities for private-employer work: military authorities and the employer
      settle their precise division by agreement.'
  - id: C3
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    - O1
    weight: strong
    why: The employer has no disciplinary authority and may not use arms against prisoners attempting escape except in self-defence.
      This limits the employer's authority, but does not itself rule out private-employer work; it makes clear that responsibility
      and authority cannot simply be transferred to the employer.
  - id: C4
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The prisoners retain a right to communicate with their camp representatives, a safeguard that remains relevant while
      they work for a private employer.
  reasoning:
    read: 'The situation is not a transfer of prisoners into the private employer''s command: they remain under the camp commander''s
      authority, and the commander retains ultimate responsibility. The trap is treating the employer''s lack of disciplinary
      powers as making private-employer work impermissible, rather than as a limit that the arrangement must respect.'
    weighing: The source's framework supports permitting the work, provided Convention-standard treatment and the commander's
      continuing responsibility are preserved, and the military authorities and employer agree on their respective responsibilities.
      The employer's limited authority constrains the arrangement but does not, on its own, require prohibition. The balance
      depends on the authorities being able to maintain those protections and responsibilities.
    tradecraft: Record the decision to permit the work and the agreed division of responsibilities. Keep the commander's continuing
      accountability explicit and ensure the arrangement preserves the prisoners' stated protections and communication right.
    uncertainty: The passage gives the governing responsibilities and constraints but does not specify the content of an agreement
      or assess any particular employer or proposed arrangement.
    handoff: The military authorities decide in agreement with the private employer; the camp commander should be involved
      because the commander retains ultimate responsibility for the prisoners' maintenance, care, treatment, and working pay.
    tempting_wrong:
      option: O2
      pull: Prohibiting the work may seem necessary because the private employer cannot discipline prisoners and has only
        limited authority.
      why_wrong: The source treats those limits as constraints on private-employer work, not as a reason to prohibit it; it
        places continuing authority and responsibility with the camp commander and provides for an agreed allocation of responsibilities.
    rejected:
      O2: Prohibition was not chosen because the source sets conditions and limits for private-employer work rather than treating
        the employer's lack of disciplinary authority as disqualifying.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The military authorities could not ensure Convention-standard treatment or preserve the camp commander's ultimate
        responsibility under the proposed arrangement.
      then: O2
      why: Permission depends on maintaining the protections and accountability that the source requires; without them, the
        basis for permitting this arrangement would fail.
    would_not_change:
    - id: noflip1
      if: The private employer lacks disciplinary powers over the prisoners.
      why: That limitation is already part of the source's account of private-employer work and does not by itself displace
        the military authorities' and camp commander's responsibilities.
    watch_for:
    - id: watch1
      what: Whether the military authorities and employer have agreed on a clear division of responsibilities that preserves
        the camp commander's ultimate responsibility.
      favors:
      - O1
      why: The source makes agreement on the precise division of responsibilities part of the arrangement.
  lesson: Private-employer work for prisoners of war is not made impermissible merely because the employer lacks disciplinary
    authority. Permission must preserve Convention-standard treatment, the camp commander's ultimate responsibility, and a
    clear agreement on the division of responsibilities.
  limits: This reasoning addresses only the source's general framework for private-employer work. It does not establish that
    any particular employer or proposed arrangement satisfies the stated protections.
