case:
  id: DR-CORPUS-NX-b8ee8581-E22@v1
  title: Prisoner Repatriation in the Korean Armistice
  status: draft
  setting: Korea, 1953, Korean armistice negotiations.
  decider: The negotiators.
  agent: The negotiators
  agent_role: decide
  situation: The negotiators are addressing whether prisoners of war may be repatriated against their will. Recent state practice
    indicates that they should not be, and the United Kingdom policy is against forced repatriation. Historically, armistice
    agreements often addressed the question. An effort to add a provision on the issue to Geneva Convention III failed amid
    concern that it could enable undue influence by the detaining power. Disagreement over the issue has delayed the signing
    of the Korean armistice agreement.
  question: What should the negotiators do about whether prisoners of war may be repatriated against their will?
  options:
    O1:
      do: The negotiators prohibit forced return of unwilling prisoners of war.
      move: act
      irreversible: false
    O2:
      do: The negotiators permit forced return of unwilling prisoners of war.
      move: act
      irreversible: true
    O3:
      do: The negotiators arrange neutral interviews and permit homeland representatives to persuade unwilling prisoners.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Recent state practice indicates that prisoners of war should not be repatriated against their will.
  - id: F2
    kind: situation
    status: confirmed
    fact: United Kingdom policy is that prisoners of war should not be repatriated against their will.
  - id: F3
    kind: situation
    status: confirmed
    fact: Historically, prisoners of war were not usually repatriated against their will.
  - id: F4
    kind: situation
    status: confirmed
    fact: The question of repatriation was often specifically addressed in armistice agreements.
  - id: F5
    kind: situation
    status: confirmed
    fact: An attempt to insert a provision on the issue into Geneva Convention III failed.
  - id: F6
    kind: situation
    status: assessed
    fact: The proposed provision raised concern that it might enable undue influence by the detaining power.
  - id: F7
    kind: situation
    status: confirmed
    fact: Disagreement over the issue delayed the signing of the Korean armistice agreement in 1953.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: duty_to_individual
    favors:
    - O1
    - O3
    weight: strong
    why: Recent state practice, United Kingdom policy, and historical practice all weigh against repatriating prisoners against
      their will.
  - id: C2
    facts:
    - F5
    - F6
    equity: complicity_risk
    favors:
    - O1
    - O3
    weight: strong
    why: The concern that a provision could enable undue influence by the detaining power weighs against allowing forced return;
      an individualized process is more consistent with protecting prisoners' choices.
  - id: C3
    facts:
    - F4
    - F7
    equity: tempo
    favors:
    - O3
    weight: weak
    why: The issue was often addressed in armistice agreements, and disagreement over it delayed the Korean agreement; the
      compromise provided a way to address the disputed issue. Tempo is only a close fit here because the delay was not described
      as time-critical.
  reasoning:
    read: The negotiators faced a genuine disagreement about whether unwilling prisoners could be returned. The trap is treating
      a procedure that permits homeland representatives to try to change a prisoner's choice as equivalent to authorizing
      the detaining power to force that return.
    weighing: Recent practice, United Kingdom policy, and historical practice weigh against forced repatriation {C1}. The
      failed effort to add a provision to Geneva Convention III reflects the concern that such a rule could invite undue influence
      by the detaining power {C2}. The negotiators' compromise retained individual interviews by neutral representatives while
      allowing homeland representatives to attempt persuasion, addressing the disputed issue amid delay to the armistice negotiations
      {C3}. The balance depends on preserving the distinction between a prisoner's choice and pressure by the detaining power.
    tradecraft: Keep the neutral interviews and the opportunity for homeland representatives to persuade as distinct features
      of the compromise. Do not infer from permission to persuade that forced repatriation was authorized.
    uncertainty: The passage does not specify how interviews were conducted, what safeguards governed persuasion, or whether
      the compromise expressly established a general legal rule. It supports the compromise as the Korean negotiating outcome,
      not conclusions about later procedures or outcomes.
    handoff: The negotiators make the decision; the described compromise involves representatives of neutral states conducting
      individual interviews and representatives of the prisoner's homeland being permitted to attempt persuasion. The passage
      does not identify a separate approving authority.
    tempting_wrong:
      option: O2
      pull: Allowing forced return might appear to resolve the disagreement by choosing one side outright.
      why_wrong: It conflicts with the stated trend and policy against forced repatriation and aggravates the concern that
        the detaining power could exert undue influence.
    rejected:
      O1: An outright prohibition would align with practice and policy against forced return, but it was not the compromise
        the Korean negotiators adopted.
      O2: Permission to force unwilling prisoners to return conflicts with the practice and policy against it and with the
        concern about undue influence by the detaining power.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The neutral interview and persuasion arrangement could not preserve an individual choice, leaving no workable safeguard
        against undue influence by the detaining power.
      then: O1
      why: If the compromise could not protect the prisoner's choice, prohibiting forced return would better address the stated
        concern.
    would_not_change:
    - id: noflip1
      if: The United Kingdom policy were not considered in the balance.
      why: Recent state practice and historical practice would still weigh against forced repatriation, while the Korean compromise
        remains the described outcome.
    watch_for:
    - id: watch1
      what: Whether the detaining power could exert undue influence over prisoners' choices.
      favors:
      - O1
      why: The concern about undue influence was a stated reason the proposed provision for Geneva Convention III failed.
  lesson: Where repatriation against a prisoner's will is disputed, protect the individual choice and distinguish persuasion
    from forced return. A compromise can provide neutral interviews and an opportunity for homeland representatives to try
    to change a choice without treating that opportunity as consent.
  limits: This reasoning concerns the Korean armistice negotiations and the compromise described there. It does not establish
    the details of interview safeguards, later procedures, or a binding general rule.
