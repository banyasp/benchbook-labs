case:
  id: DR-CORPUS-NX-884b46f3-E23@v1
  title: Intelligence Net-Force Comparisons
  status: draft
  setting: CIA and the Intelligence Community, 1981
  decider: The Director of Central Intelligence
  agent: The Director of Central Intelligence
  agent_role: decide
  situation: The Director of Central Intelligence faced a choice about whether intelligence estimates would continue to include
    comparisons of US and Soviet strategic forces or leave those assessments to DoD. A prior strategic estimate had included
    separate key judgments from the Intelligence Community and the Director. The Director argued that residual-force analysis
    mattered to decision-makers who regarded mutual residual destruction as central to deterrence. The Pentagon and military
    services objected that net assessments could mislead about the strategic balance and were not a proper intelligence function.
    A 1981 intelligence estimate of potential US and Soviet strategic force developments included a Pentagon footnote objecting
    to net assessments.
  question: What should the Director of Central Intelligence do about including net-force comparisons in intelligence estimates?
  options:
    O1:
      do: The Director would include net-force comparisons in intelligence estimates.
      move: act
      irreversible: false
    O2:
      do: The Director would exclude net-force comparisons and assign them to DoD.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Pentagon viewed residual analysis as misleading about trends in the strategic balance and nuclear deterrence,
      and as outside the proper function of intelligence.
  - id: F2
    kind: situation
    status: confirmed
    fact: DIA and the military services called for removing residual analysis from the estimate and leaving net assessments
      to DoD.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Director argued that removing quasi-dynamic analysis would disserve national decision-makers because it mattered
      to those who viewed mutual residual destruction as a key ingredient of deterrence.
  - id: F4
    kind: situation
    status: confirmed
    fact: The 1980 Soviet strategic estimate contained one set of key judgments coordinated by the Intelligence Community
      and another written by the Director.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Director judged that rough parity existed between the two sides despite a growing Soviet advantage in some areas.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Director judged that residual strategic forces after a surprise attack would likely make nuclear conflict a
      very high risk for the Soviets, who would almost certainly prefer arms limitations to a strategic arms race.
  - id: F7
    kind: situation
    status: confirmed
    fact: An October 1981 estimate of potential US and Soviet strategic force developments was essentially a net assessment
      and included a Pentagon footnote objecting to net assessments.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Pentagon and military services argued that residual-force net assessments could mislead about strategic-balance
      and deterrence trends and were not a proper intelligence function; they sought to leave that work to DoD.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The DCI argued that removing residual-force analysis would disserve decision-makers who considered mutual residual
      destruction central to deterrence, and judged that surviving forces would make nuclear conflict a very high risk for
      the Soviets.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The DCI's net assessment produced a comparative judgment of rough parity despite Soviet advantages in some areas,
      illustrating the potential decision value of comparing the two sides.
  reasoning:
    read: This was a dispute about both the usefulness and the proper institutional role of net-force comparisons, not simply
      about whether the underlying force data mattered. The trap is treating the value of a deterrence judgment as proof that
      intelligence must produce the net assessment, or treating the Pentagon's objection as if it erased the DCI's stated
      decision-support concern.
    weighing: The DCI's stated case for inclusion was that residual-force analysis mattered to decision-makers assessing deterrence,
      and the earlier net assessment also yielded a judgment about rough parity. Against that, the Pentagon and military services
      repeatedly argued that net assessments could mislead about strategic trends and belonged to DoD. The DCI ultimately
      agreed to leave net-force assessments to DoD, so the institutional objection carried the outcome despite the recorded
      disagreement. The balance depends on whether intelligence's decision-support value is judged to outweigh the risks and
      role concerns raised by the Pentagon.
    tradecraft: Keep intelligence estimates within the chosen remit, assign net-force comparisons to DoD, and make the division
      of responsibility clear in the estimate. Where agencies disagree about the analysis or its proper role, preserve the
      disagreement accurately rather than implying a consensus.
    uncertainty: The text records the Pentagon's objections and the DCI's eventual agreement to leave the assessments to DoD,
      but does not give the DCI's specific explanation for that agreement. The underlying disagreement about the analytical
      value of residual-force analysis therefore remains visible.
    handoff: The DCI should make the remit decision and involve DoD, including the military intelligence organizations that
      objected, because DoD is the stated recipient of the net-assessment function.
    tempting_wrong:
      option: O1
      pull: Including the comparisons could give decision-makers the residual-force perspective the DCI considered important
        to deterrence.
      why_wrong: That concern was expressly raised, but the eventual DCI decision was to leave net-force assessments to DoD
        amid persistent objections that they could mislead and were not a proper intelligence function.
    rejected:
      O1: The DCI ultimately agreed to leave net-force comparisons to DoD despite the stated value of residual-force analysis
        to some decision-makers.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The DCI concluded that DoD would not provide the residual-force assessment needed by national decision-makers and
        that excluding it would materially impair intelligence support to deterrence decisions.
      then: O1
      why: That would strengthen the decision-support concern the DCI had given for retaining the analysis.
    would_not_change:
    - id: noflip1
      if: The comparative analysis continued to produce a judgment of rough parity despite growing Soviet advantages in some
        areas.
      why: That analytical result alone would not resolve the separate objection that net assessments could mislead and were
        not a proper intelligence function.
    watch_for:
    - id: watch1
      what: A continued Pentagon objection to net assessments, including a formal footnote in an intelligence estimate.
      favors:
      - O2
      why: The 1981 estimate's Pentagon footnote preceded the DCI's agreement to leave net-force assessments to DoD.
  lesson: A useful analytical product can still raise a legitimate question about which institution should produce it. Weigh
    decision-makers' stated needs against risks of misleading analysis and the institutional remit, and make the allocation
    of responsibility explicit when the final choice is contested.
  limits: This reasoning concerns the allocation of net-force comparisons between intelligence and DoD in the stated setting.
    It does not establish a general rule that intelligence should never compare forces or that DoD's objections always control.
