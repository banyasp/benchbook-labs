case:
  id: DR-CORPUS-NX-2344b7b6-E1@v1
  title: Fuel Emergency and Aircraft Recovery
  status: draft
  setting: In flight during return to base after 0723Z; CAOC and MMCC coordination.
  decider: The CAOC
  agent: The CAOC
  agent_role: decide
  situation: At 0723Z, the crew began returning to base. Soon afterward, the MGCS displayed a fuel leak warning, and the crew
    continued fuel calculations during the recovery. The leak's location was initially unknown. The MP assessed that safe
    recovery might theoretically be possible if the leak was not affecting all tanks. It then became clear that the leak was
    between the header tank and the engine. The MP and MMCC began planning for aircraft loss while coordinating with the CAOC
    RPA LNO.
  question: What should the CAOC direct the crew to do about the fuel emergency, the return-to-base effort, and the possibility
    of aircraft recovery?
  options:
    O1:
      do: The CAOC directs the crew to accept aircraft loss while permitting a later recovery effort.
      move: act
      irreversible: true
    O2:
      do: The CAOC directs the crew to continue the return-to-base attempt and permit aircraft recovery.
      move: act
      irreversible: false
    O3:
      do: The CAOC directs the crew to accept aircraft loss and prohibit aircraft recovery.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: At 0723Z, the crew began returning to base.
  - id: F2
    kind: situation
    status: confirmed
    fact: Soon after the return began, the MGCS displayed a detected fuel leak warning.
  - id: F3
    kind: situation
    status: confirmed
    fact: The crew continued fuel calculations during the recovery.
  - id: F4
    kind: situation
    status: confirmed
    fact: The crew initially did not know where in the fuel system the leak was occurring.
  - id: F5
    kind: capability
    status: assessed
    fact: The MP assessed that safe recovery might theoretically be possible if the leak was not affecting all tanks.
  - id: F6
    kind: situation
    status: confirmed
    fact: The leak was identified as being between the header tank and the engine.
  - id: F7
    kind: situation
    status: confirmed
    fact: The MP and MMCC began planning for aircraft loss while coordinating with the CAOC RPA LNO.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: While the leak location was unknown, the MP assessed that safe recovery might be theoretically possible if the leak
      was not affecting all tanks. That conditional possibility supported continued fuel assessment, but did not establish
      that recovery was safe.
  - id: C2
    facts:
    - F6
    - F7
    equity: resource_stewardship
    favors:
    - O3
    weight: strong
    why: Once the leak was identified between the header tank and the engine, the MP and MMCC began planning for aircraft
      loss. The decision shifted from a conditional possibility of recovery to accepting the loss.
  - id: C3
    facts:
    - F7
    equity: security_risk
    favors:
    - O3
    weight: strong
    why: The CAOC directed that the aircraft be lost in a way that minimized the chances of successful recovery. The record
      states this recovery-denial direction but does not explain the underlying threat.
  reasoning:
    read: 'This was a fuel emergency during return to base, not a confirmed safe-return opportunity: the initial recovery
      possibility depended on a condition that was not yet known to hold. Once the leak was located between the header tank
      and the engine, the crew shifted to planning for aircraft loss. The trap is treating the MP''s conditional, theoretical
      assessment as proof that return remained safe.'
    weighing: The conditional possibility of recovery initially supported continuing fuel calculations, but the later identification
      of the leak and the crew's planning for aircraft loss weighed against continuing the return attempt. The CAOC's stated
      direction was to accept loss and prevent successful recovery, making O3 the outcome. The source does not give a further
      reason for denying recovery, so no more specific security rationale can be attributed to the CAOC.
    tradecraft: 'Keep the decision record focused on the changing assessment: the warning, the initial uncertainty, the later
      leak location, the coordination, and the CAOC''s direction. Do not present the initial theoretical possibility as a
      confirmed recovery capability or add an unstated rationale for denying recovery.'
    uncertainty: The source does not identify why successful recovery had to be prevented, who might have recovered the aircraft,
      or what threat recovery posed. It also does not state a separate legal standard for the CAOC's direction.
    handoff: The CAOC made the direction while the MP and MMCC coordinated with the CAOC RPA LNO. The record supports describing
      that coordination, but not adding other authorities or consultation requirements.
    tempting_wrong:
      option: O2
      pull: The crew continued fuel calculations, and the MP initially saw a theoretical path to safe recovery.
      why_wrong: That possibility was conditional on the leak not affecting all tanks; it was not a finding that recovery
        was safe, and the later leak identification led the crew to plan for aircraft loss.
    rejected:
      O1: The CAOC directed that the aircraft not be left in a condition that enabled successful recovery, rather than accepting
        loss while permitting recovery.
      O2: The CAOC directed acceptance of aircraft loss and recovery denial, rather than continuation of the return-to-base
        effort and permission to recover the aircraft.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The leak were established not to be affecting all tanks, such that the MP's stated condition for a theoretically
        safe recovery actually held.
      then: O2
      why: That would remove the uncertainty that limited the initial recovery possibility and could support continuing the
        return-to-base effort.
    would_not_change: []
    watch_for: []
  lesson: A conditional possibility of safe recovery is not the same as an established safe recovery capability. Reassess
    when the emergency is better understood, and distinguish the decision to accept loss from any separate decision about
    whether recovery should be allowed.
  limits: This reasoning applies to the fuel emergency and recovery-denial direction described here. The source does not state
    the reason for denying recovery, the applicable legal standard, or whether other recovery options were available, so it
    does not support conclusions about those matters.
  library:
    domain: operational-command
    family: CORPUS-NX-2344b7b6
    source: https://www.airandspaceforces.com/app/uploads/2021/06/24-June-2020-ACC-AFRICOM-MQ9-A-AAIB-Report.pdf
    episode_focus: The decision point is the shift from attempting return to base to accepting loss of the aircraft after
      the crew determined the leak made recovery impossible; the command center further directed that the aircraft not be
      left in a condition that enabled successful recovery. Focus on the choice, the fuel emergency, and the recovery-denial
      rationale. Exclude the mechanics of controlling or crashing the aircraft.
