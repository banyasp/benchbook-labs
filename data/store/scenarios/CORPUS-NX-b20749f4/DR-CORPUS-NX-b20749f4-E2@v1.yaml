case:
  id: DR-CORPUS-NX-b20749f4-E2@v1
  title: Access to a Soviet Economics Book
  status: draft
  setting: After a special investigation, Institute for Scientific Information on Social Sciences, Soviet Union.
  decider: The censorship authorities
  agent: The censorship authorities
  agent_role: decide
  situation: A book by American economists had been placed in the restricted-access spetskhran at the Institute for Scientific
    Information on Social Sciences. GLAVLIT's stated concern was that the authors had used secret Soviet economic statistics.
    A special investigation involving several state agencies, including the KGB, found that the data underlying the book's
    estimates came from open Soviet statistical literature. Removing a book from the spetskhran was a tedious process. The
    book was considered a useful primer on Soviet national statistics, and copies had been sent to several Soviet economists.
    The censorship authorities must determine the book's access status.
  question: What should the censorship authorities do about the book's access status at the Institute for Scientific Information
    on Social Sciences?
  options:
    O1:
      do: The censorship authorities grant the book general-reference access at the Institute for Scientific Information on
        Social Sciences.
      move: act
      irreversible: false
    O2:
      do: The censorship authorities request that the state agencies conduct a further review of the book's access status.
      move: ask
      irreversible: false
      to: the state agencies
    O3:
      do: The censorship authorities deny the book general-reference access at the Institute for Scientific Information on
        Social Sciences.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The book was placed in the spetskhran at the Institute for Scientific Information on Social Sciences.
  - id: F2
    kind: intelligence
    status: assessed
    fact: GLAVLIT's stated reason for the restricted placement was that the American authors had used secret Soviet economic
      statistics.
  - id: F3
    kind: situation
    status: confirmed
    fact: A special investigation involved representatives of several state agencies, including the KGB.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The investigation determined that all data underlying the book's estimates came from open Soviet statistical literature.
  - id: F5
    kind: situation
    status: confirmed
    fact: Removing a book from a spetskhran had always been a tedious process.
  - id: F6
    kind: situation
    status: assessed
    fact: The book was regarded as a useful primer on Soviet national statistics, and copies were sent to several Soviet economists.
  considerations:
  - id: C1
    facts:
    - F2
    equity: security_risk
    favors:
    - O2
    - O3
    weight: strong
    why: The stated basis for restriction was a concern that the estimates relied on secret Soviet statistics, which warranted
      checking before broader access.
  - id: C2
    facts:
    - F3
    - F4
    equity: classification_integrity
    favors:
    - O1
    weight: strong
    why: The special investigation involving several state agencies determined that the underlying data came from open Soviet
      statistical literature, resolving the stated basis for restricting the book.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The book was a useful primer on Soviet national statistics and had been sent to Soviet economists, supporting its
      practical value as a reference.
  reasoning:
    read: The central question is whether the book actually relied on secret statistics, not whether its American authors
      had produced estimates of Soviet data. The initial concern supported restriction, but the investigation addressed that
      concern directly.
    weighing: The investigation's finding that the data came from open literature outweighs the initial suspicion {C1} and
      supports general-reference access {C2}. The book's usefulness provides additional, though weaker, support {C3}; the
      balance depends chiefly on whether the investigation's finding is accepted.
    tradecraft: Record the investigation's finding as the basis for changing the access status, then place the book in the
      general reference section. Do not treat the original suspicion as established after the investigation resolved it.
    uncertainty: The available account gives the investigation's conclusion but not its underlying analysis or any assessment
      of residual risk. The decision therefore rests on the stated finding, without assuming that it establishes facts beyond
      the data underlying the estimates.
    handoff: The matter was examined by representatives of several state agencies, including the KGB. No further review is
      indicated on these facts because that investigation resolved the stated concern.
    tempting_wrong:
      option: O3
      pull: Keeping the book restricted avoids access to material initially suspected of using secret statistics.
      why_wrong: That preserves the restriction after the investigation found that the underlying data came from open literature,
        leaving the stated basis for restriction unsupported.
    rejected:
      O2: Further review was not chosen because the special investigation had already determined that the estimates relied
        on open statistical literature.
      O3: Denying general-reference access was not chosen because the investigation resolved the stated concern that the book
        used secret statistics.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The investigation instead found that the estimates relied on secret Soviet economic statistics.
      then: O3
      why: That would substantiate the stated basis for restriction and could support denying general-reference access.
    - id: flip2
      if: The investigation left the source of the underlying data unresolved.
      then: O2
      why: Further review would then be appropriate before deciding whether to grant general access.
    would_not_change:
    - id: noflip1
      if: Removing the book from the spetskhran remains a tedious process.
      why: Administrative difficulty alone would not restore the disproved factual basis for restricting access.
    watch_for:
    - id: watch1
      what: Credible new evidence that the estimates relied on secret statistics.
      favors:
      - O2
      - O3
      why: Such evidence could undermine the investigation's finding and renew the original access concern.
  lesson: When a restriction rests on a factual concern, test that concern and reassess access in light of the findings. If
    an investigation resolves the stated concern, do not preserve the restriction merely because it was imposed initially
    or is administratively difficult to undo.
  limits: This reasoning applies to the stated concern about the sources underlying this book's estimates. It does not establish
    that all materials derived from open sources are suitable for general access, or resolve a case with evidence of other
    security risks.
  library:
    domain: natsec-other
    family: CORPUS-NX-b20749f4
    source: https://www.cia.gov/resources/csi/static/e11a111744be7dab33c371a48aeed6b4/Watching-the-Bear-6-Chap6-Sov-Policy-Process.pdf
    episode_focus: The authors’ estimates were suspected of relying on secret Soviet statistics, prompting restricted access;
      a later interagency investigation found the underlying data came from open sources and the book was released to a general
      reference section. Focus on the access decision and its stated basis, not on the book’s statistical methods.
    cues:
