case:
  id: DR-CORPUS-NX-f867df04-E8@v1
  title: Fleet Engagement or Beachhead Protection
  status: draft
  setting: Battle of the Philippine Sea, Pacific Theater, World War II; American naval forces
  decider: The fleet commander
  agent: The fleet commander
  agent_role: decide
  situation: In the Pacific during World War II, American naval forces had evolved into a major combined-arms force with their
    own land and air forces. Their fiercest battles from Guadalcanal to Okinawa were fought to support ground operations.
    At the Battle of the Philippine Sea, the fleet commander faced a choice between seeking a decisive fleet engagement and
    protecting the Marianas beachheads. The choice arose in the context of supporting ground operations.
  question: What should the fleet commander do at the Battle of the Philippine Sea when choosing between a decisive fleet
    engagement and protection of the Marianas beachheads?
  options:
    O1:
      do: The fleet commander prioritizes a decisive fleet engagement over protection of the Marianas beachheads.
      move: act
      irreversible: true
    O2:
      do: The fleet commander deprioritizes a decisive fleet engagement and prioritizes protection of the Marianas beachheads.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In the Pacific, American naval forces evolved into a major combined-arms force.
  - id: F2
    kind: capability
    status: confirmed
    fact: American naval forces controlled their own land and air forces in the Pacific.
  - id: F3
    kind: situation
    status: confirmed
    fact: From Guadalcanal to Okinawa, the fiercest battles of American naval forces were fought to support ground operations.
  - id: F4
    kind: situation
    status: confirmed
    fact: The decision point was the Battle of the Philippine Sea.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Marianas beachheads were a ground-operation interest in the decision.
  - id: F6
    kind: situation
    status: confirmed
    fact: Seeking a Mahanian victory at the Battle of the Philippine Sea was an available course under consideration.
  - id: F7
    kind: situation
    status: confirmed
    fact: Protecting the Marianas beachheads was the alternative course under consideration.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The American Navy’s fiercest Pacific battles supported ground operations, making protection of the beachheads consistent
      with the operational role described.
  - id: C2
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The Navy’s combined-arms character and control of its own land and air forces place the fleet’s decision in an integrated
      operational context, rather than making a decisive fleet engagement an end in itself.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: At the Philippine Sea, the fleet commander chose to forgo a Mahanian victory in favor of protecting the Marianas
      beachheads, applying the ground-support emphasis to the choice.
  reasoning:
    read: This is a choice about the fleet’s contribution to ground operations, not simply whether to pursue the most decisive-seeming
      fleet action. The trap is treating a Mahanian victory as the fleet’s overriding purpose despite the Navy’s Pacific role
      in supporting ground operations.
    weighing: The American Navy’s fiercest Pacific battles supported ground operations {C1}, and its combined-arms forces
      operated with their own land and air forces {C2}. At the Philippine Sea, the fleet commander resolved the balance in
      favor of protecting the Marianas beachheads rather than seeking a Mahanian victory {C3}. That balance depends on ground
      support being the relevant operational priority; the passage gives no broader rule that fleet engagements are never
      appropriate.
    tradecraft: State the choice in terms of the ground-operation purpose being served, record why beachhead protection takes
      priority over a decisive fleet engagement in this situation, and avoid adding tactical details absent from the account.
    uncertainty: The passage gives the commander’s choice and broad rationale, but not a detailed comparison of expected outcomes
      or other operational considerations. It does not establish a general rule for different circumstances.
    handoff: The fleet commander makes the choice; the passage identifies no separate approval authority or required referral.
    tempting_wrong:
      option: O1
      pull: A decisive fleet engagement can appear to be the clearest expression of naval power.
      why_wrong: That framing overlooks the emphasis on supporting ground operations and the commander’s choice to protect
        the Marianas beachheads.
    rejected:
      O1: The fleet commander did not prioritize a Mahanian victory because the choice was made in the context of supporting
        ground operations and protecting the Marianas beachheads.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The ground operation no longer depended on protection of the beachheads, and a decisive fleet engagement were necessary
        to achieve the remaining mission.
      then: O1
      why: Without the ground-support reason driving the choice, and with the engagement necessary to achieve the remaining
        mission, the balance could favor prioritizing the engagement.
    would_not_change:
    - id: noflip1
      if: A decisive fleet engagement were attractive as a naval objective, without a change to the ground-support purpose.
      why: The choice favors beachhead protection over a Mahanian victory in this ground-operation context.
    watch_for:
    - id: watch1
      what: A changed assessment of whether the Marianas beachheads require protection to support the ground operation.
      favors:
      - O2
      why: The reason given for rejecting the decisive fleet engagement is tied to protecting those beachheads.
  lesson: Choose the fleet action that serves the operational purpose, rather than treating decisive engagement as an end
    in itself. When naval forces are supporting ground operations, protection of the ground objective may take priority over
    a fleet victory.
  limits: This reasoning applies to the described choice at the Philippine Sea and its ground-support context. It does not
    establish that protecting beachheads should always take priority over fleet engagement.
