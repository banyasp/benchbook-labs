case:
  id: DR-CORPUS-NX-f867df04-E2@v1
  title: The Battle-Cruiser Design Tradeoff
  status: draft
  setting: Britain, during early twentieth-century naval competition, Royal Navy
  decider: The First Sea Lord
  agent: The First Sea Lord
  agent_role: decide
  situation: The First Sea Lord was weighing a capital-ship design that favored speed, firepower, and predictive fire control
    over armor. The existing advantage of naval firepower was eroding as opposing capabilities improved. Sophisticated fire
    control was viewed as potentially restoring that advantage, and pairing it with a fast ship was expected to permit control
    of engagement distance and effective hits beyond the reach of less sophisticated opponents. Foreign navies could eventually
    acquire fire control while using more balanced, heavily armored ships. An innovation might disrupt rival programs and
    preserve British operational and financial initiative, while rapid technological change made relative strength uncertain
    and Britain's former economic and industrial predominance was no longer assured.
  question: What should the First Sea Lord do about the Royal Navy's capital-ship design tradeoff between speed, firepower,
    and predictive fire control on one side and heavier armor on the other?
  options:
    O1:
      do: The First Sea Lord should adopt a fast, heavily armed design prioritizing speed, firepower, and predictive fire
        control over armor.
      move: act
      irreversible: true
    O2:
      do: The First Sea Lord should reject the speed-led design and select a balanced ship with heavier armor and predictive
        fire control.
      move: act
      irreversible: true
    O3:
      do: The First Sea Lord should hold the design choice pending assessment of fire-control performance and rival capabilities.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: The existing advantage of naval firepower was under serious pressure from improving opposing capabilities.
  - id: F2
    kind: capability
    status: assessed
    fact: Sophisticated fire control might recover the advantage that improving capabilities were eroding.
  - id: F3
    kind: capability
    status: assessed
    fact: The proposed combination of a fast ship and predictive fire control was expected to control engagement distance
      and hit less sophisticated opponents from a distance at which they could not effectively respond.
  - id: F4
    kind: situation
    status: assessed
    fact: The First Sea Lord regarded armor as potentially superfluous in the proposed design.
  - id: F5
    kind: capability
    status: assessed
    fact: Britain's rivals could eventually develop their own fire control and fit it into more heavily armored, balanced
      ships.
  - id: F6
    kind: situation
    status: assessed
    fact: The design was conceived as a temporary innovation that could disrupt foreign programs and preserve Britain's initiative
      in operational and financial affairs.
  - id: F7
    kind: situation
    status: assessed
    fact: A previous naval innovation had imposed an informal pause on overseas battleship construction estimated at eighteen
      months to four years.
  - id: F8
    kind: situation
    status: assessed
    fact: Rapid technological change increased uncertainty about relative naval strength, and Britain's former overwhelming
      economic and industrial advantage no longer applied.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The gun's former advantage was eroding as opposing capabilities improved, while sophisticated fire control might
      recover it. The speed-led design was a way to pursue that recovery.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The proposed pairing of speed and predictive fire control was expected to control the fighting range and hit less
      sophisticated opponents from a distance at which they could not effectively respond. In that conception, armor could
      seem superfluous.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The advantage was understood to be temporary, not a permanent answer to naval warfare. As with the earlier innovation
      that paused overseas battleship construction, the battle cruiser could disrupt rival programs and preserve British operational
      and financial initiative.
  - id: C4
    facts:
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Rapid technological change made relative strength uncertain, and Britain's former overwhelming economic and industrial
      advantage no longer applied. The rationale was to initiate innovation and retain the initiative rather than rely on
      the old policy of following others.
  - id: C5
    facts:
    - F5
    - F8
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: weak
    why: Rivals could eventually reproduce the fire-control capability and combine it with heavier armor, creating a real
      risk that the design would lose its advantage. This limits the design's duration but does not negate its temporary strategic
      purpose.
  reasoning:
    read: This is a time-sensitive force-design choice under technological competition, not a choice of a permanent ship type.
      The trap is to judge the design either as a panacea or only by the eventual possibility that rivals will copy it; it
      is instead a temporary innovation meant to gain initiative.
    weighing: The erosion of gun advantage and the assessed promise of predictive fire control support adopting the fast,
      heavily armed design {C1} {C2}. Its temporary nature and the prospect of rival imitation weigh against treating it as
      a lasting solution, but the expected disruption to foreign programs and Britain's operational and financial initiative
      make adoption preferable in the circumstances {C3} {C5}. The balance depends on the fire-control advantage being plausible
      and on the innovation buying useful time before rivals catch up. Rapid technological change and Britain's diminished
      industrial predominance make initiating innovation a strategic response to uncertainty about relative strength {C4}.
    tradecraft: 'Record the decision as a time-bounded force-design judgment: identify the expected capability advantage,
      the financial and strategic purpose of disrupting rival plans, and the risk that opponents will imitate the innovation.
      Reassess the design as capabilities and costs change rather than treating it as a final solution. This is decision-recording
      guidance, not a claim that a review process was prescribed.'
    uncertainty: The fire-control benefit was prospective, relative strength was increasingly difficult to judge without battle,
      and rivals could eventually duplicate the innovation. The judgment supports seeking initiative, not certainty that the
      design would retain an advantage.
    handoff: The First Sea Lord makes the force-design judgment. Consulting technical and financial advisers would help test
      the assumptions about capability and cost, but this consultation is a practical recommendation rather than a stated
      requirement.
    tempting_wrong:
      option: O2
      pull: A balanced, more heavily armored ship could appear safer against rivals that eventually acquire fire control.
      why_wrong: 'That response focuses on the eventual competitive position and misses the reason for accepting a temporary
        imbalance: to disrupt rival programs and preserve British initiative before the advantage is copied.'
    rejected:
      O2: A balanced, more heavily armored design gives too little weight to the temporary operational and financial initiative
        expected from the innovation.
      O3: Deferring the choice would forgo the initiative-seeking opportunity presented by adopting an innovation during a
        period of rapid change.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The fire-control advantage were shown not to be achievable or useful enough to offset the design's reliance on speed
        and firepower over armor.
      then: O2
      why: Without the capability advantage that underpins the design, its expected ability to control range and create a
        temporary strategic opening would be substantially weakened.
    - id: flip2
      if: Rivals had already achieved comparable fire control before Britain could disrupt their programs or gain useful initiative.
      then: O2
      why: The temporary advantage central to the rationale would have disappeared, making the more balanced, armored alternative
        more persuasive.
    would_not_change:
    - id: noflip1
      if: Rivals were expected eventually to copy fire control and fit it to more heavily armored ships.
      why: Eventual imitation is already part of the reasoning; it limits the duration of the advantage but does not negate
        the value of disrupting rival programs in the interim.
    watch_for:
    - id: watch1
      what: Evidence that rival navies are developing fire control and may pair it with balanced, more heavily armored ships.
      favors:
      - O2
      why: This would indicate that the innovation's temporary advantage is narrowing and that the design should not be treated
        as a lasting solution.
  lesson: When a capability advantage is eroding, an innovation may be worth adopting for the temporary initiative it creates,
    even if rivals can eventually imitate it. Treat that advantage as time-limited, and reassess it as technology, costs,
    and relative capabilities change.
  limits: This reasoning applies to a strategic force-design choice under rapid technological and financial change. It does
    not establish that speed and firepower should generally outweigh armor, or that this design would remain preferable once
    the expected capability advantage or opportunity for disruption had passed.
