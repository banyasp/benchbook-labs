case:
  id: DR-CORPUS-NX-3accea8b-E2@v1
  title: Civilian Protection During the Marawi Clearance
  status: draft
  setting: Marawi, October 14, AFP final clearance operation in the constriction area.
  decider: The AFP assault force
  agent: The AFP assault force
  agent_role: decide
  situation: The AFP was conducting a final clearance operation in the constriction area of Marawi. The leaders it sought
    had avoided capture, and their status was uncertain; the AFP feared they had escaped but hoped they remained in the area.
    By early afternoon, the assault force had cleared nine buildings when it encountered a group of civilians. The force faced
    a choice between continuing the assault and pausing it to protect the civilians and allow them to leave.
  question: What should the AFP assault force do when it encounters civilians during the final clearance operation in Marawi?
  options:
    O1:
      do: The AFP assault force continues the assault while civilians remain in the area.
      move: act
      irreversible: false
    O2:
      do: The AFP assault force discontinues the assault and pauses while civilians leave.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The leaders sought by the AFP had avoided capture, and the AFP did not know whether they had been killed, escaped,
      or remained in the constriction area.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The AFP feared the leaders had escaped from Marawi but hoped they were trapped in the constriction area.
  - id: F3
    kind: situation
    status: confirmed
    fact: Only two joint task groups participated in the final clearance operation; the area straddled their shared boundary
      and was too small for the entire force.
  - id: F4
    kind: situation
    status: confirmed
    fact: The AFP initiated the attack on October 14.
  - id: F5
    kind: situation
    status: confirmed
    fact: By early afternoon, the assault force had cleared nine buildings.
  - id: F6
    kind: situation
    status: confirmed
    fact: During the fighting, the force encountered a group of civilians.
  considerations:
  - id: C1
    facts:
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The force encountered civilians during the fighting and immediately stopped the assault, prioritizing their safety
      over continuing while they remained in the area.
  - id: C2
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The force's response treated the civilians' welfare as requiring a pause that allowed them to leave, rather than
      treating their presence as incidental to the operation.
  - id: C3
    facts:
    - F1
    - F2
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The leaders' status remained uncertain, the AFP hoped they were still in the area, and the clearance operation was
      underway. These circumstances created a mission-related pull toward continuing, but did not outweigh the encountered
      civilians' safety.
  reasoning:
    read: This was an active clearance operation with an unresolved mission objective, but the civilians' presence was concrete,
      not merely a possibility. The trap is allowing uncertainty about the leaders to make the civilians' immediate safety
      seem secondary.
    weighing: The uncertainty about whether the leaders remained in the area supports continuing the mission, but only weakly
      at this decision point. The force encountered civilians and stopped the assault to protect them and allow them to leave;
      that civilian-protection judgment controls the balance. The source gives no basis for treating the mission uncertainty
      as overriding the civilians' presence.
    tradecraft: At the decision point, pause the assault while civilians remain exposed and allow them to leave; do not include
      the methods used to facilitate their departure. As an authored practice, record the civilian-presence basis for the
      pause and the circumstances supporting any later decision to resume.
    uncertainty: The leaders' status was uncertain. The source does not state how long the pause lasted, whether the civilians
      faced a particular form of danger, or whether a higher authority was consulted.
    handoff: The source identifies the assault force's immediate decision but does not describe a referral or approval process.
      The immediate civilian-protection pause need not be delayed for an unmentioned handoff; any further authority requirements
      are outside the stated record.
    tempting_wrong:
      option: O1
      pull: Continuing could seem necessary because the leaders had avoided capture and the AFP hoped they remained in the
        constriction area.
      why_wrong: That unresolved mission concern does not remove the confirmed civilian-protection concern; the force's stated
        response was to stop the assault when it encountered civilians.
    rejected:
      O1: The assault was not continued while civilians remained in the area because the force stopped it to protect the civilians
        and allow them to leave.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable information established that civilians could remain in the area without being exposed to harm from continuing
        the assault.
      then: O1
      why: If continuing no longer put civilians at risk, the central reason for pausing would be materially reduced.
    would_not_change:
    - id: noflip1
      if: The leaders' status remained uncertain and the AFP continued to hope they were in the area.
      why: That uncertainty does not change the confirmed fact that civilians were encountered or the source's decision to
        stop the assault to protect them.
    watch_for:
    - id: watch1
      what: Whether civilians remain in the area during the assault.
      favors:
      - O2
      why: The source's stated response to encountering civilians was to stop the assault and facilitate their escape.
  lesson: When an assault encounters civilians, treat their presence as an immediate protection concern, not as a factor erased
    by uncertainty about the mission objective. Pause while they remain exposed and weigh resumption only against a concrete
    assessment of civilian safety.
  limits: This reasoning addresses only the choice to pause or continue upon encountering civilians. It does not establish
    a general legal rule, prescribe operational methods, or resolve what should happen after civilians have left.
  library:
    domain: military-operational
    family: CORPUS-NX-3accea8b
    source: https://mwi.westpoint.edu/urban-warfare-case-study-8-battle-of-marawi/
    episode_focus: The decision point is whether to continue the assault or pause it to protect civilians and enable their
      escape. Focus on the civilian-protection judgment; exclude the methods used to facilitate the escape or continue the
      operation afterward.
