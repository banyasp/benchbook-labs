case:
  id: DR-CORPUS-NX-3accea8b-E3@v1
  title: Temporary Suspension During the Assault
  status: draft
  setting: Padian Alpha block, morning of October 15, during the AFP's two-day assault.
  decider: The AFP
  agent: The AFP
  agent_role: decide
  situation: The AFP was fighting in the Padian Alpha block during a two-day assault. Three civilians, a man, a woman, and
    a girl, escaped to an AFP position. All three claimed to be hostages. The AFP determined that the man was an IS-P fighter.
    During questioning, he indicated that hostages remained and senior insurgent leaders were nearby.
  question: What should the AFP do after receiving information that hostages remain and senior insurgent leaders are nearby?
  options:
    O1:
      do: The AFP continues engagement and forgoes psychological operations.
      move: act
      irreversible: false
    O2:
      do: The AFP temporarily suspends engagement and conducts psychological operations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On October 15, the AFP was conducting a two-day assault.
  - id: F2
    kind: situation
    status: confirmed
    fact: Fighting was taking place in the Padian Alpha block.
  - id: F3
    kind: situation
    status: confirmed
    fact: Three civilians—a man, a woman, and a girl—escaped to an AFP position.
  - id: F4
    kind: intelligence
    status: assessed
    fact: All three civilians claimed to be hostages.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The AFP determined that the male civilian was an IS-P fighter.
  - id: F6
    kind: intelligence
    status: assessed
    fact: During questioning, the fighter indicated that hostages remained in the area.
  - id: F7
    kind: intelligence
    status: assessed
    fact: During questioning, the fighter indicated that senior insurgent leaders were nearby.
  considerations:
  - id: C1
    facts:
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The information that hostages remained made their safety a direct concern; the AFP paused engagement rather than
      continue fighting without first addressing their presence.
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The stated purpose of the temporary pause was to conduct psychological operations directed at insurgents and hostages,
      responding to the information about hostages and senior leaders in the area.
  - id: C3
    facts:
    - F3
    - F4
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: Civilians had reached an AFP position claiming to be hostages, and the fighter's information indicated that others
      remained; a temporary suspension gave the AFP an opportunity to address the specific people at risk.
  reasoning:
    read: 'This was an ongoing assault, but the information that hostages remained changed the immediate decision: continuing
      engagement could leave civilians caught in the fighting, while a temporary pause created an opportunity to address their
      presence. The nearby senior insurgent leaders could make continued engagement seem attractive, but the AFP did not treat
      that information as a reason to disregard the hostage risk.'
    weighing: The AFP's stated reason for suspending engagement was to conduct psychological operations after learning that
      hostages remained and senior leaders were nearby. The civilian-protection concern and the opportunity to act on that
      information support {O2}; the source does not identify a competing reason that outweighed those considerations. The
      balance depends on the continuing credibility of the information that hostages remain and on the pause remaining temporary.
    tradecraft: Keep the suspension limited to its stated purpose, reassess the hostage-related information as circumstances
      change, and record the basis and duration of the pause and the decision to resume or continue suspending engagement.
    uncertainty: The information about remaining hostages and the leaders' location came from a captured fighter. The source
      records that the AFP determined he was an IS-P fighter, but does not describe independent confirmation, a legal or rules-of-engagement
      standard, or the approval authority for the pause.
    handoff: The AFP is identified as the decision-maker. The source does not identify a separate approving authority or consultation;
      any required operational reporting or approval should follow the applicable chain of command.
    tempting_wrong:
      option: O1
      pull: Senior insurgent leaders were nearby during an ongoing assault, which could make continued engagement seem urgent.
      why_wrong: The AFP's stated response to the information was a temporary pause because hostages remained, rather than
        pressing the engagement without addressing their presence.
    rejected:
      O1: The AFP did not choose continued engagement because the information that hostages remained led it to suspend fighting
        temporarily to conduct psychological operations.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable updated information established that no hostages remained in the area.
      then: O1
      why: The principal stated reason for pausing—addressing the presence of hostages—would no longer apply, so the balance
        could favor continuing the assault.
    would_not_change:
    - id: noflip1
      if: The senior insurgent leaders were still nearby, but the information that hostages remained was also still credible.
      why: The presence of nearby senior leaders did not prevent a pause while hostages remained; the AFP suspended engagement
        under those circumstances.
    watch_for:
    - id: watch1
      what: Whether reliable updates continue to indicate that hostages remain in the area.
      favors:
      - O2
      why: The stated reason for the temporary pause depends on the continuing hostage concern.
  lesson: When credible information indicates that hostages remain during an assault, a temporary suspension can prioritize
    their safety while creating an opportunity to address the hostage situation. The pause should remain tied to that purpose
    and be reassessed as the relevant information changes.
  limits: This reasoning addresses the specific choice to pause after receiving information that hostages remained and senior
    leaders were nearby. It does not establish a general rule to suspend engagement whenever hostages are alleged to be present,
    or supply the applicable legal authority, rules of engagement, or approval requirements.
