case:
  id: DR-CORPUS-NX-a3600272-E1@v1
  title: Diplomatic Response to Reports of Systematic Rape
  status: draft
  setting: Bosnia and Belgrade; time unspecified; the Federal Government and the European Community.
  decider: The Federal Government
  agent: The Federal Government
  agent_role: decide
  situation: The Federal Government has concurrent first-hand accounts concerning mass rape, principally in Bosnia. The accounts
    concern predominantly Muslim girls and women. Precise figures for the extent of the reported violations are unavailable.
    There are growing indications of systematic rape aimed at destroying the identity of another ethnic group. The government
    must decide its diplomatic response toward the Yugoslav government.
  question: What should the Federal Government do about diplomatic representations to the Yugoslav government concerning the
    reported rapes?
  options:
    O1:
      do: The Federal Government engages diplomatically with the Yugoslav government through bilateral and European Community
        representations concerning the rapes and other grave human rights violations.
      move: act
      irreversible: false
    O2:
      do: The Federal Government disengages diplomatically from the Yugoslav government, making no bilateral or European Community
        representations concerning the rapes and other grave human rights violations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Federal Government's information is based on concurrent first-hand accounts.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The accounts concern mass rape, principally in Bosnia.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The reported victims are predominantly Muslim girls and women.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Federal Government considers mass rape to be occurring.
  - id: F5
    kind: situation
    status: confirmed
    fact: Precise figures for the actual extent of the violations are unavailable.
  - id: F6
    kind: intelligence
    status: assessed
    fact: There are growing indications that the rape is systematic.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The reported systematic rape is aimed at destroying another ethnic group's identity.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Concurrent first-hand accounts support the Federal Government's assessment that mass rape is occurring, providing
      a basis for representations.
  - id: C2
    facts:
    - F4
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The assessed mass rape concerns grave violations of the rights and welfare of the people affected; the government
      treats the reports as warranting a response.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The exact extent is unknown, which limits claims about scale, but does not displace the assessment that mass rape
      is occurring.
  - id: C4
    facts:
    - F6
    - F7
    equity: third_party_harm
    favors:
    - O1
    weight: strong
    why: Growing indications of systematic rape aimed at destroying another ethnic group's identity make the reported harm
      especially grave and support vigorous representations.
  reasoning:
    read: The decision concerns a diplomatic response to assessed mass rape, not a determination of its precise scale. The
      trap is to treat the absence of exact figures as if it erased the significance of concurrent first-hand accounts and
      growing indications of systematic, identity-destroying violence.
    weighing: The accounts support the assessment that mass rape is occurring, while the growing indications of systematic
      conduct aimed at destroying another ethnic group's identity add gravity. Although the actual extent is unknown, the
      balance favors vigorous representations through both bilateral and European Community channels. That balance depends
      on the assessed accounts and indications, not on a precise count.
    tradecraft: Make the representations through both stated channels and distinguish the assessment that mass rape is occurring
      from the acknowledged uncertainty about its extent.
    uncertainty: Precise figures for the actual extent are unavailable. The government nevertheless assesses mass rape to
      be occurring and identifies growing indications of a systematic purpose.
    handoff: The Federal Government is the decision-maker; the European Community is a channel for representations, not a
      separately identified decision-maker in this account.
    tempting_wrong:
      option: O2
      pull: The lack of precise figures may make disengagement seem like a cautious response to uncertain scale.
      why_wrong: That would give the uncertainty about extent more weight than the concurrent first-hand accounts and the
        growing indications of systematic, identity-destroying rape.
    rejected:
      O2: Disengagement was not chosen because the assessed reports and the grave indications supported vigorous representations
        despite the absence of precise figures.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The concurrent first-hand accounts no longer provided a credible basis for the assessment that mass rape was occurring,
        and there were no other grave human rights violations at issue.
      then: O2
      why: Without the assessed basis for the reported rapes or another stated subject for representations, the reason for
        this diplomatic response would fall away.
    would_not_change:
    - id: noflip1
      if: Precise figures for the actual extent remained unavailable.
      why: The actual extent may remain unknown while concurrent first-hand accounts support the assessment that mass rape
        is occurring and growing indications point to systematic conduct.
    watch_for:
    - id: watch1
      what: Whether the indications of systematic rape aimed at destroying another ethnic group's identity continue to grow
        or are materially undermined.
      favors:
      - O1
      why: The assessed systematic purpose is a significant reason for the gravity of the response; a material change in that
        assessment could alter the balance.
  lesson: When credible accounts support an assessment of grave human-rights violations, lack of exact figures about their
    extent need not prevent a diplomatic response. Growing indications that the violations are systematic and aimed at destroying
    a group's identity strengthen the case for vigorous representations.
  limits: This reasoning concerns diplomatic representations on the stated assessed information. It does not establish a precise
    scale, make a legal finding about individual responsibility, or determine what response would be appropriate if the evidentiary
    basis materially changed.
