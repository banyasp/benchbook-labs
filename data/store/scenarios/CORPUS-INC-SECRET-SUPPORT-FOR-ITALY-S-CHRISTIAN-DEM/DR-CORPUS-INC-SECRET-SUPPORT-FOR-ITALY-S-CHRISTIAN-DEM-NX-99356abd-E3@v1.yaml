    episode_focus: The passage links public questions about the CIA’s conduct to the Director’s policy of full disclosure
      to Congress, and notes that this was followed by new executive orders and congressional oversight. Focus on the disclosure
      and oversight choice; exclude details of the questioned activities themselves.
