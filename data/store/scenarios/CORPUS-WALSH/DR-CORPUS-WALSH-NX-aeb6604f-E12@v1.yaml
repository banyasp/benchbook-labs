case:
  id: DR-CORPUS-WALSH-NX-aeb6604f-E12@v1
  title: Production of Relevant Notebook Notes
  status: draft
  setting: Department of State, November–December 1986
  decider: The aide who maintained the Secretary’s notes
  agent: The aide who maintained the Secretary’s notes
  agent_role: decide
  situation: The Secretary was preparing to testify to the Senate in December 1986, and the aide reviewed his notebooks while
    assembling material for that preparation. A November 29 memorandum required production of all documents, including personal
    notes, relevant to the Iran arms sales. The aide recalled being told to retain the notebooks nearby and have them ready
    to produce on request; the legal adviser’s account was that the memorandum still required the aide to provide all responsive
    information. The aide used a narrower test for selecting material, focusing on information he considered direct, reliable,
    and tied to occasions when the Secretary could act. Some notebook entries recorded information about arms activity and
    hostage releases, while other entries reflected uncertainty or events that did not unfold as anticipated.
  question: What should the aide do with the relevant notebook notes when responding to the Department’s production memorandum?
  options:
    O1:
      do: The aide should withhold all relevant notebook notes from State legal counsel and investigators.
      move: act
      irreversible: false
    O2:
      do: The aide should request clarification from State legal counsel before submitting relevant notebook notes.
      move: ask
      irreversible: false
      to: State legal counsel
    O3:
      do: The aide should disclose all relevant notebook notes to State legal counsel and investigators.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Secretary was preparing for December 1986 Senate testimony, and the aide reviewed his notes beforehand.
  - id: F2
    kind: authority
    status: confirmed
    fact: A November 29, 1986 memorandum required production of all documents, including personal notes, relevant to the Iran
      arms sales.
  - id: F3
    kind: authority
    status: assessed
    fact: The aide said the legal adviser had instructed him to keep his notes secure and ready to produce when requested.
  - id: F4
    kind: authority
    status: assessed
    fact: The legal adviser said the aide remained obligated to review his notes and provide all information responsive to
      the memorandum.
  - id: F5
    kind: situation
    status: assessed
    fact: The aide described his review as limited to information he considered direct evidence of an operation and relevant
      to actions the Secretary could take.
  - id: F6
    kind: situation
    status: confirmed
    fact: A September 1985 notebook entry recorded press reports about arms being sent to Iran and a hostage being released,
      along with the Secretary’s reaction.
  - id: F7
    kind: situation
    status: confirmed
    fact: May 1986 notebook entries recorded reports of arms deliveries and anticipated hostage releases, including information
      attributed to senior officials.
  - id: F8
    kind: situation
    status: confirmed
    fact: The aide’s initial chronology included material that he did not include in later excerpts provided for testimony
      preparation and investigation.
  considerations:
  - id: C1
    facts:
    - F2
    equity: lawful_authority
    favors:
    - O3
    weight: bar
    why: The memorandum required production of all documents, including personal notes, relevant to the Iran arms sales; retaining
      relevant notes instead of producing them was inconsistent with that requirement.
    rules_out:
    - O1
  - id: C2
    facts:
    - F2
    - F5
    - F8
    equity: oversight_candor
    favors:
    - O3
    weight: strong
    why: The aide used a narrower test aimed at information supporting the Secretary’s account and tied to occasions for action,
      although the memorandum called for all relevant documents. The initial chronology included material later left out of
      the excerpts, underscoring the selective nature of the later production.
  - id: C3
    facts:
    - F6
    - F7
    equity: record_integrity
    favors:
    - O3
    weight: strong
    why: The notes recorded information relevant to the arms sales and the Secretary’s knowledge even where reports were uncertain
      or anticipated events did not unfold. A later failure or false alarm does not erase what the Secretary had been told.
  - id: C4
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The aide recalled being told to keep the notebooks nearby and ready, but the legal adviser said that did not excuse
      the duty to review them and provide all responsive information. The memorandum’s terms required production, and the
      legal adviser’s account directly rejected the aide’s claimed understanding.
  reasoning:
    read: This was not merely a choice about which notes would help prepare the Secretary’s testimony. The aide was also responding
      to a memorandum requiring all relevant documents, and the trap was treating his own judgments about directness, reliability,
      or the Secretary’s ability to act as a limit on that broader production duty.
    weighing: The memorandum’s broad requirement and the legal adviser’s account outweigh the aide’s narrower approach and
      his claim that keeping notes ready amounted to constructive compliance. Notes could remain relevant to what the Secretary
      knew even if events later proved false or did not occur as anticipated. The outcome depends on the notes being relevant
      to the Iran arms sales, not on whether they supported the Secretary’s recollection or met the aide’s preferred threshold.
    tradecraft: Provide all responsive notes to State legal counsel and investigators, preserving their context rather than
      selecting only passages that fit the testimony-preparation criteria. Distinguish uncertainty in a note from a decision
      to omit it, and record any scope question raised with counsel. This is implementation guidance, not a further finding.
    uncertainty: The aide and legal adviser gave conflicting accounts of whether the aide had been told that retaining the
      notes nearby would suffice. The memorandum’s terms required production, and relevant notes were omitted; some entries
      nevertheless reflected uncertain or inaccurate reports.
    handoff: Provide the notes to State legal counsel and investigators rather than resolving the memorandum’s scope by the
      aide’s own narrower test. Counsel can address any genuine scope or handling questions, while investigators need the
      complete responsive record.
    tempting_wrong:
      option: O1
      pull: The aide said he had been told to retain the notebooks securely and have them ready on request, and believed that
        keeping them nearby amounted to constructive compliance.
      why_wrong: That account was contradicted by the legal adviser, who said the memorandum required the aide to provide
        all responsive information; relevant notes were improperly withheld.
    rejected:
      O1: Withholding all relevant notes conflicts with the memorandum’s express production requirement and the legal adviser’s
        account of the aide’s duty.
      O2: Seeking clarification could address a genuine ambiguity, but it was not a substitute for producing notes responsive
        to a memorandum whose terms required all relevant documents.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Before submission, State legal counsel had expressly clarified in an authoritative instruction that the memorandum
        did not require these notes to be submitted and that they should instead be held pending a further request.
      then: O2
      why: An authoritative clarification would create a genuine question about the applicable production scope, making clarification
        the appropriate next step rather than assuming either nonproduction or immediate submission.
    would_not_change:
    - id: noflip1
      if: Some anticipated events later proved to be false alarms or did not happen as described.
      why: The later failure of an operation does not negate the Secretary’s knowledge of it; uncertainty or an inaccurate
        report does not by itself make a relevant note exempt from production.
    watch_for:
    - id: watch1
      what: Whether relevant notes are being excluded because the aide considers them unreliable, indirect, or inconsistent
        with the Secretary’s recollection.
      favors:
      - O3
      why: These judgments were offered as reasons for omissions, but the memorandum required production of all relevant notes.
  lesson: When a production instruction covers all relevant records, do not narrow the response to material that supports
    a witness’s recollection or meets a personal threshold for reliability or directness. Preserve and provide relevant material
    with its uncertainty and context so counsel and investigators can assess it.
  limits: This reasoning concerns compliance with the stated memorandum and production of notes relevant to the Iran arms
    sales. It does not decide whether to prosecute the aide or resolve other legal questions beyond the production duty addressed
    here.
  library:
    domain: gov-ethics
    family: CORPUS-WALSH
    source: https://irp.fas.org/offdocs/walsh/chap_24.htm
