case:
  id: DR-CORPUS-WALSH-NX-dfc29c9e-E1@v1
  title: Authorization of a Proposed Advisory Role
  status: draft
  setting: El Salvador, February 1985; the U.S. diplomatic mission and military advisory group.
  decider: The U.S. ambassador in El Salvador
  agent: The U.S. ambassador in El Salvador
  agent_role: decide
  situation: In February 1985, the U.S. ambassador in El Salvador was considering a proposed consulting role with the Salvadoran
    Air Force. The ambassador was concerned about the proposed mission and had asked the Southern Command commander to evaluate
    the individual and clarify the U.S. approach in El Salvador. The commander reported that the individual had been put forward
    without higher-level backing. A senior White House official indicated that the individual was intended to focus elsewhere
    and agreed that the Salvadoran Air Force already had sufficient advice. The individual also had a short-term contra-support
    priority, which the commander had directed him to make a priority. The individual briefed the ambassador and the military
    advisory group commander on the proposed role and that separate priority.
  question: What should the U.S. ambassador do about the proposed advisory role with the Salvadoran Air Force?
  options:
    O1:
      do: The U.S. ambassador rejects the proposed advisory role and declines authorization for the Salvadoran Air Force assignment.
      move: act
      irreversible: false
    O2:
      do: The U.S. ambassador asks the State Department to review the proposed advisory role before making an authorization
        decision.
      move: ask
      irreversible: false
      to: The State Department
    O3:
      do: The U.S. ambassador approves the proposed advisory role under close military supervision, with conditions against
        civilian casualties and combat flights.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The individual proposed serving as a consultant to the Salvadoran Air Force.
  - id: F2
    kind: situation
    status: confirmed
    fact: The ambassador was concerned about the proposed mission and recommended that the Southern Command commander evaluate
      the individual and clarify the U.S. approach in El Salvador.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Southern Command commander reported that the individual had been put forward by a senior White House official
      but lacked higher-level backing.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The senior White House official said the individual was intended to focus elsewhere in Central America and agreed
      that the Salvadoran Air Force already had enough advice.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Southern Command commander had instructed the individual to prioritize support for the contras.
  - id: F6
    kind: situation
    status: confirmed
    fact: The individual briefed the ambassador and the military advisory group commander in El Salvador on the proposed advisory
      role and his separate short-term contra-support priority.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: chain_of_command
    favors:
    - O1
    - O2
    weight: strong
    why: The ambassador had identified a need to evaluate the individual and clarify the U.S. approach; the commander reported
      no higher-level backing, and the senior White House official said the individual was intended to focus elsewhere and
      that the Salvadoran Air Force already had enough advice.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The separate contra-support priority created a coordination concern alongside the proposed advisory role. The individual
      disclosed that priority, but the source does not say it barred the advisory assignment.
  - id: C3
    facts:
    - F6
    equity: civilian_life
    favors:
    - O3
    weight: strong
    why: The approval was conditioned on avoiding civilian casualties and not flying combat missions, directly limiting the
      role to address the stated civilian-harm concern.
  - id: C4
    facts:
    - F6
    equity: control_integrity
    favors:
    - O3
    weight: strong
    why: The role was approved under close supervision by the U.S. military group commander, providing an identified oversight
      channel rather than an unrestricted assignment.
  reasoning:
    read: This was a decision about whether to accept a proposed advisory role despite unresolved concerns about backing,
      U.S. policy alignment, and a separate priority. The trap is to treat either the White House official's assurance or
      the separate contra-support priority as dispositive; the source records a conditional approval after evaluation and
      briefing, not an unconditional endorsement.
    weighing: The reported lack of higher-level backing, the stated intention that the individual focus elsewhere, and the
      assessment that the Salvadoran Air Force already had sufficient advice weighed against approval or for further review.
      The separate priority added a coordination concern. The ambassador nevertheless effectively approved the role, placing
      it under close military supervision and conditioning it on avoiding civilian casualties and combat flights. The balance
      therefore depended on maintaining those supervisory and operational limits.
    tradecraft: Record the approval as conditional, identify the responsible supervising office, and make the limits explicit
      in the authorization. Reassess or refer the matter if the role, supervision, or stated limits change.
    uncertainty: The source does not specify the legal authority for the assignment, the content of any written authorization,
      or what subsequent monitoring occurred. It also does not explain whether the requested briefing to the Vice President's
      office led to further direction.
    handoff: The ambassador's decision relied on close supervision by the U.S. military group commander. The ambassador also
      asked that the State Department brief the Vice President's office, providing a channel for higher-level awareness without
      displacing the recorded approval.
    tempting_wrong:
      option: O2
      pull: The concerns about absent higher-level backing and the official's stated intention that the individual focus elsewhere
        make further review appear prudent.
      why_wrong: The source records approval after the commander evaluated the individual and the individual briefed the ambassador
        and military group commander; the chosen course addressed the concerns through supervision and stated conditions rather
        than further deferral.
    rejected:
      O1: The source's outcome was not a rejection; it accepted the proposed role subject to close supervision and stated
        safeguards.
      O2: The source records an effective conditional approval after evaluation and briefing, rather than a further State
        Department review before deciding.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Close military supervision or the stated safeguards against civilian casualties and combat flights could not be
        assured.
      then: O2
      why: The approval was conditional on supervision and those safeguards; without them, the basis for the recorded conditional
        approval would be absent.
    - id: flip2
      if: The separate contra-support priority made the proposed advisory role incompatible with the direction to prioritize
        that support.
      then: O2
      why: An unresolved incompatibility would require coordination before authorizing the advisory role.
    would_not_change:
    - id: noflip1
      if: The senior White House official repeated that the individual was intended to focus elsewhere.
      why: That assurance was already part of the circumstances, and the ambassador's recorded approval addressed the assignment
        through close supervision and limits rather than treating the assurance alone as controlling.
    watch_for:
    - id: watch1
      what: Whether the role remains under close military supervision and within the stated conditions.
      favors:
      - O2
      - O1
      why: A change or failure in those safeguards would undermine the conditions attached to the approval.
  lesson: When a proposed role raises concerns about backing, policy alignment, or competing priorities, distinguish those
    concerns from an outright bar to approval. A conditional approval is defensible in this record because it placed the role
    under close supervision and specified safeguards; the decision depends on preserving them.
  limits: This reasoning concerns the ambassador's recorded decision in February 1985 and does not establish a general legal
    rule or resolve the authority for the assignment. It does not apply if the stated supervision or safeguards cannot be
    maintained.
