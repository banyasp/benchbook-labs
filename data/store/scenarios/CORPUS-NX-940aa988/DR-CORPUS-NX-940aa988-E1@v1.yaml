case:
  id: DR-CORPUS-NX-940aa988-E1@v1
  title: Temporary Police Assistance for the Inauguration
  status: draft
  setting: Washington, D.C., before the January 1969 Presidential Inauguration, CIA Office of Security and Washington Metropolitan
    Police Department.
  decider: The Office of Security
  agent: The Office of Security
  agent_role: decide
  situation: Before the January 1969 Presidential Inauguration, the Intelligence Division of the Washington Metropolitan Police
    Department asks the Office of Security for temporary radio-equipped automobiles. Large groups are expected to gather during
    the ceremonies. The department seeks an additional assigned radio frequency for planned activities while keeping its own
    frequency available for ordinary police communications. Other agencies that could normally assist are fully using their
    radio equipment. The assistance under consideration is subject to the vehicles remaining entirely under the control of
    Office of Security employees.
  question: What should the Office of Security do about the police department’s request for temporary assistance and its terms?
  options:
    O1:
      do: The Office of Security grants the request and provides temporary radio-equipped automobiles under its employees'
        control.
      move: act
      irreversible: false
    O2:
      do: The Office of Security denies the request and provides no temporary radio-equipped automobiles to the police department.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Before the January 1969 Presidential Inauguration, the Intelligence Division of the Washington Metropolitan Police
      Department asked the Office of Security for assistance.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Large groups were expected to gather during the inauguration ceremonies.
  - id: F3
    kind: situation
    status: confirmed
    fact: The department requested several radio-equipped automobiles for temporary assistance.
  - id: F4
    kind: situation
    status: confirmed
    fact: The department sought an additional assigned radio frequency for planned activities during the inauguration.
  - id: F5
    kind: situation
    status: confirmed
    fact: The department sought to keep its own radio frequency available for ordinary police communications.
  - id: F6
    kind: capability
    status: confirmed
    fact: Other agencies normally able to assist were fully utilizing their radio equipment during this period.
  - id: F7
    kind: authority
    status: confirmed
    fact: The assistance was conditioned on the vehicles remaining totally under the control of Office of Security employees.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The expected large crowds and the request for temporary radio-equipped automobiles support providing assistance for
      the planned inauguration activities.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The additional assigned frequency would serve the planned activities while leaving the department's own frequency
      available for ordinary police communications.
  - id: C3
    facts:
    - F6
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Other agencies that could normally help were fully using their radio equipment, making the Office of Security's assistance
      responsive to a stated gap in available support.
  - id: C4
    facts:
    - F7
    equity: control_integrity
    favors:
    - O1
    weight: strong
    why: Keeping the vehicles entirely under Office of Security employees' control placed a clear limit on the assistance;
      the police department accepted that condition.
  reasoning:
    read: This was a temporary interagency assistance request for an inauguration period when large groups were expected and
      other usual support was unavailable. The key term was that the vehicles remain entirely under Office of Security employees'
      control, not an unrestricted transfer of vehicles to the police department.
    weighing: The expected crowds, the department's need for an additional frequency while preserving its ordinary communications,
      and the lack of available support from other agencies favor granting the request {C1} {C2} {C3}. The control condition
      made that assistance acceptable on the terms described {C4}; the balance depends on preserving that condition.
    tradecraft: 'Provide the temporary assistance on the stated terms: keep the vehicles under Office of Security employees''
      control and confirm the police department''s agreement to that condition.'
    uncertainty: The account gives the operational reasons and the agreed control condition, but does not describe a separate
      legal analysis or further limits on the assistance.
    handoff: The Office of Security could decide the request while coordinating the terms with the police department, which
      requested the assistance and agreed to the control condition.
    tempting_wrong:
      option: O2
      pull: Declining avoids committing Office of Security vehicles and personnel to another department's activities.
      why_wrong: That would leave the stated need unmet despite the expected crowds, the frequency constraint, the lack of
        other available support, and the police department's acceptance of Office of Security control.
    rejected:
      O2: The request was granted because the stated operational need and lack of other available support justified temporary
        assistance subject to Office of Security control.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The police department would not accept the condition that the vehicles remain entirely under Office of Security
        employees' control.
      then: O2
      why: The assistance was provided on that condition, so without agreement to it the stated basis for granting the request
        would no longer hold.
    - id: flip2
      if: Other agencies had available radio equipment to provide the requested support.
      then: O2
      why: The lack of available support from other agencies was a stated reason for providing assistance; if that gap were
        absent, the case for committing Office of Security resources would be reduced.
    would_not_change:
    - id: noflip1
      if: The assistance were described as temporary rather than continuing.
      why: Its temporary nature is already part of the request and does not remove the need to retain Office of Security employees'
        control.
    watch_for:
    - id: watch1
      what: Whether other agencies' radio equipment becomes available before assistance is provided.
      favors:
      - O2
      why: The unavailability of those agencies was one of the stated reasons for Office of Security assistance.
  lesson: Temporary interagency assistance can be justified by a concrete operational need and the absence of usual support.
    Grant it on clear terms that preserve the assisting office's control when that control is a condition of the assistance.
  limits: This reasoning addresses only the described temporary radio-equipment assistance and its control condition. It does
    not establish a general rule for other forms of police support or resolve legal questions not addressed in the account.
  library:
    domain: natsec-other
    family: CORPUS-NX-940aa988
    source: https://www.aarclibrary.org/publib/church/rockcomm/pdf/RockComm_App7_Assistance.pdf
    episode_focus: The decision point is whether to provide temporary assistance on the police department’s request and under
      what conditions. The stated reasons were the expected large crowds, the department’s need for an additional radio frequency,
      and the lack of available support from other agencies. Keep the focus on interagency assistance and its terms, not on
      how monitoring or communications were conducted.
