case:
  id: DR-CORPUS-NS-b39d38e4-E51@v1
  title: Foreign-Government Gift and Diplomatic Relations
  status: draft
  setting: 'At receipt of a foreign-government gift by an employee; time: upon receipt; institution: a U.S. agency.'
  decider: The employee
  agent: The employee
  agent_role: decide
  situation: An employee is receiving a gift from a foreign government. At receipt, refusal appears likely to cause offense
    or embarrassment and could adversely affect foreign relations. The employee must choose whether to accept the gift or
    decline it. The applicable rule addresses acceptance on behalf of the United States when refusal risks diplomatic offense
    or harm. Any accepted gift is subject to reporting and deposit with the agency under applicable procedures.
  question: What should the employee do about the foreign-government gift at receipt?
  options:
    O1:
      do: The employee accepts the gift for the United States, reporting and depositing it with the agency.
      move: act
      irreversible: false
    O2:
      do: The employee asks an ethics official for guidance before responding to the foreign government.
      move: ask
      irreversible: false
      to: an ethics official
    O3:
      do: The employee refuses the gift instead of accepting it for the United States.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision concerns an employee receiving a gift from a foreign government.
  - id: F2
    kind: situation
    status: confirmed
    fact: The decision arises upon receipt of the gift.
  - id: F3
    kind: situation
    status: assessed
    fact: Refusal appears likely to cause offense or embarrassment.
  - id: F4
    kind: situation
    status: assessed
    fact: Refusal could adversely affect foreign relations.
  - id: F5
    kind: authority
    status: confirmed
    fact: A foreign-government gift may be accepted when refusal could embarrass the United States or adversely affect foreign
      relations.
  - id: F6
    kind: authority
    status: confirmed
    fact: A gift accepted under this rule must be accepted on behalf of the United States.
  - id: F7
    kind: authority
    status: confirmed
    fact: Accepted gifts must be reported to and deposited with the agency under applicable procedures.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The assessed risks of offense or embarrassment and harm to foreign relations support accepting rather than refusing
      the gift.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The rule permits acceptance when refusal risks embarrassment or harm to foreign relations, and requires acceptance
      on behalf of the United States.
  - id: C3
    facts:
    - F7
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: Acceptance under the rule carries a reporting and deposit obligation, which O1 expressly includes.
  reasoning:
    read: This is a diplomatic-risk decision at the point of receipt, not a choice to accept the gift as personal property.
      The trap is treating refusal as automatically safer or more proper even though it may cause offense or harm foreign
      relations.
    weighing: The assessed diplomatic risks {C1} activate the rule permitting acceptance, and the guidance recommends accepting
      in these circumstances. Acceptance must be for the United States, not personally {C2}, and must be followed by reporting
      and deposit with the agency {C3}. The balance depends on the stated risk that refusal could embarrass the United States
      or adversely affect foreign relations.
    tradecraft: If accepting, make clear that the gift is accepted on behalf of the United States, then report and deposit
      it with the agency under applicable procedures.
    uncertainty: The source's rule turns on whether refusal could cause embarrassment or adversely affect foreign relations.
      The facts assess both risks as present; the source gives no further test for resolving their likelihood.
    handoff: The stated rule does not make prior consultation a condition of acceptance. The employee should use the agency's
      applicable reporting and deposit process; seek ethics guidance if the diplomatic-risk assessment or applicable procedure
      is unclear.
    tempting_wrong:
      option: O3
      pull: Refusing may seem like the simplest way to avoid accepting a foreign-government gift personally.
      why_wrong: The source recommends accepting when refusal could embarrass the United States or harm foreign relations,
        while requiring that acceptance be on behalf of the United States.
    rejected:
      O2: The source provides a direct acceptance rule for the stated diplomatic risks and does not make prior ethics consultation
        a prerequisite.
      O3: Refusal is contrary to the source's recommendation when it could cause offense or embarrassment or adversely affect
        foreign relations.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The diplomatic-risk assessment changes so that refusal is not expected to cause offense or embarrassment and would
        not adversely affect foreign relations.
      then: O2
      why: The stated diplomatic basis for this recommendation would no longer apply; the employee should seek guidance on
        the applicable ordinary gift rules rather than assume this exception controls.
    would_not_change:
    - id: noflip1
      if: The agency's applicable reporting and deposit procedures specify a particular process for handling an accepted gift.
      why: That process governs how to carry out the acceptance; it does not displace the recommendation to accept when the
        stated diplomatic risks are present.
    watch_for: []
  lesson: 'When refusal of a foreign-government gift could cause diplomatic offense or harm foreign relations, the guidance
    recommends accepting it on behalf of the United States rather than refusing it. Acceptance is not personal retention:
    report and deposit the gift with the agency under applicable procedures.'
  limits: This reasoning applies to the stated foreign-government gift scenario where refusal risks embarrassment or harm
    to foreign relations. It does not resolve the rules for gifts where those diplomatic risks are absent or where another
    applicable requirement controls.
  library:
    domain: gov-ethics
    family: CORPUS-NS-b39d38e4
    source: https://tile.loc.gov/storage-services/service/ll/llmlp/2022_Operational_Law_Handbook/2022_Operational_Law_Handbook.pdf
    episode_focus: The doctrine recommends accepting the gift on behalf of the United States and then reporting and depositing
      it under the applicable procedures, rather than refusing it. Focus on the diplomatic interests and the rule for acceptance;
      exclude gift-valuation mechanics and subsequent disposition details.
    cues:
      option_words:
        O2: 14
        O3: 13
        O1: 16
      real_option: O1
      real_to_mean_other_length: 1.19
      real_is_longest: true
      moves:
        O2: ask
        O3: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O3: false
        O1: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The guidance says it is always appropriate to accept a foreign-government gift when refusal could embarrass the United
  States or adversely affect foreign relations, and to accept it on behalf of the United States.
