case:
  id: DR-CORPUS-NS-b39d38e4-E23@v1
  title: Group Detention and Individualized Evidence
  status: draft
  setting: Military detention operations; place and time unspecified; United States armed forces.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: The Commander is considering whether to continue holding a group of detainees. The group was detained without
    an investigation of each member's culpability. The evidentiary packets are insufficient, and the detention basis is not
    substantiated for each individual. A judge advocate may counsel the Commander when the evidence does not support continued
    detention.
  question: What should the Commander do about the group's continued detention?
  options:
    O1:
      do: The Commander releases the group from detention.
      move: act
      irreversible: false
    O2:
      do: The Commander continues the group's detention.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: People were detained as a group.
  - id: F2
    kind: situation
    status: confirmed
    fact: The culpability of each group member was not investigated.
  - id: F3
    kind: situation
    status: confirmed
    fact: Group detentions without individual culpability investigations result in insufficient evidentiary packets.
  - id: F4
    kind: situation
    status: confirmed
    fact: The evidentiary packets do not establish each detainee's individual culpability.
  - id: F5
    kind: authority
    status: confirmed
    fact: Detainees must be released when evidence does not substantiate the reason for detention.
  - id: F6
    kind: authority
    status: confirmed
    fact: The judge advocate may advise the Commander when evidence does not support continued detention.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Detaining the group without investigating each member's culpability leaves insufficient evidence to establish an
      individual basis for continued detention.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: The stated rule requires release when evidence does not substantiate the reason for detention.
    rules_out:
    - O2
  - id: C3
    facts:
    - F4
    - F6
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The judge advocate may advise the Commander when the evidence does not support continued detention, reinforcing that
      the evidentiary deficiency should be addressed rather than ignored.
  reasoning:
    read: 'This is not a substantiated case against each member of the group: individual culpability was not investigated,
      and the packets do not establish each detainee''s culpability. The trap is treating group detention as enough to justify
      continued detention of every person.'
    weighing: The lack of individual investigation produces insufficient evidentiary packets {C1}; the controlling rule says
      detainees must be released when the reason for detention is not substantiated {C2}. The judge advocate may counsel the
      Commander where evidence does not support continued detention {C3}. On these fixed facts, release is required, not merely
      a preference to be balanced against continued detention.
    tradecraft: Release the group and record that the stated basis for detention was not substantiated for each person. Do
      not treat the group-level detention decision as a substitute for an individual basis.
    uncertainty: The fixed facts establish that the packets do not substantiate detention for each person; they do not establish
      whether new, individualized evidence may later become available.
    handoff: The Commander decides, with judge-advocate advice because the source identifies counsel when evidence does not
      support continued detention.
    tempting_wrong:
      option: O2
      pull: Keeping the group together may seem administratively simpler or may seem justified by the group's collective circumstances.
      why_wrong: The stated reasons require individual culpability to be investigated and require release when evidence does
        not substantiate the detention basis; group status cannot fill that evidentiary gap.
    rejected:
      O2: Continued detention was not chosen because the evidence does not substantiate the detention basis for each individual.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence were to substantiate a lawful detention basis for each individual.
      then: O2
      why: Individualized substantiation would remove the evidentiary condition that requires release here; continued detention
        could then be considered under the applicable authority.
    would_not_change:
    - id: noflip1
      if: The only support for continued detention were guilt by association.
      why: The source identifies guilt by association as an insufficient basis; it would not substantiate an individual reason
        for detention.
    watch_for:
    - id: watch1
      what: Whether the evidence actually substantiates the reason for detention for each individual.
      favors:
      - O1
      why: The release rule turns on whether evidence substantiates the detention basis, and the judge advocate may advise
        when it does not.
  lesson: A group may not be held on an evidentiary basis that fails to establish why each individual is detained. When evidence
    does not substantiate the detention reason, release is required; group status alone does not cure the gap.
  limits: This conclusion concerns the stated facts of group detention without substantiation for each individual. It does
    not decide whether detention would be justified on a separately substantiated individual basis.
  library:
    domain: natsec-other
    family: CORPUS-NS-b39d38e4
    source: https://tile.loc.gov/storage-services/service/ll/llmlp/2022_Operational_Law_Handbook/2022_Operational_Law_Handbook.pdf
    episode_focus: The passage describes group detentions without evidence of each person’s culpability and states that detainees
      must be released when evidence does not substantiate the detention basis. Frame the choice as continued detention versus
      release; exclude evidence-gathering techniques and packet-preparation procedures.
