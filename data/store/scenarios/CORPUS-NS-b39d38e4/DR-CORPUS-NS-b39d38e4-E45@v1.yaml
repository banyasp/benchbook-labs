case:
  id: DR-CORPUS-NS-b39d38e4-E45@v1
  title: Urgency and Earlier Acquisition Planning
  status: draft
  setting: Government procurement supporting Multinational Forces-Iraq in Iraq, December 2004.
  decider: The contracting officer
  agent: The contracting officer
  agent_role: decide
  situation: Multinational Forces-Iraq required bilingual-bicultural advisors and subject matter experts in support of its
    mission. The government faced an immediate need for those services before Iraq's January 2005 elections. Government actions
    and acquisition planning had occurred two to three months earlier. The urgency exception permits limiting competition
    to firms reasonably believed capable of meeting the requirement in the available time, but it cannot be used when agency
    lack of advanced planning created the urgency.
  question: What should the contracting officer do about the required services for Multinational Forces-Iraq in December 2004?
  options:
    O1:
      do: The contracting officer authorizes a sole-source award for the required services under the urgency exception.
      move: act
      irreversible: true
    O2:
      do: The contracting officer declines a sole-source award and conducts full and open competition for the required services.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The required services were bilingual-bicultural advisors and subject matter experts.
  - id: F2
    kind: situation
    status: confirmed
    fact: The services were required in support of Multinational Forces-Iraq.
  - id: F3
    kind: situation
    status: confirmed
    fact: The immediate need for the services arose before the January 2005 elections in Iraq.
  - id: F4
    kind: situation
    status: confirmed
    fact: Government actions and acquisition planning had occurred two to three months before the immediate need.
  - id: F5
    kind: authority
    status: confirmed
    fact: The urgency exception permits the contracting officer to limit procurement to firms reasonably believed able to
      satisfy the requirement in the limited time available.
  - id: F6
    kind: authority
    status: confirmed
    fact: The urgency exception cannot be used when the urgency was created by the agency's lack of advanced planning.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    equity: tempo
    favors:
    - O1
    weight: weak
    why: The immediate pre-election need creates pressure to use the urgency exception, which can allow procurement to be
      limited to firms reasonably believed able to meet the requirement in the time available.
  - id: C2
    facts:
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: The urgency exception cannot be used when lack of advanced agency planning created the urgency. Here, earlier government
      planning and actions were the cause of the immediate need, so the exception cannot support a sole-source award.
    rules_out:
    - O1
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The services were needed to support the mission before the elections, which makes timely fulfillment important. That
      need does not override the restriction on using urgency when the agency created the urgency through inadequate planning.
  reasoning:
    read: 'The government faced an immediate need for mission-supporting services before the elections, but the urgency was
      not independent of the agency''s conduct: government actions and acquisition planning had occurred two to three months
      earlier. The trap is treating the short time remaining as enough, by itself, to justify limiting competition.'
    weighing: The deadline and limited time create a reason to consider the urgency exception, but the decisive condition
      is whether agency planning created the urgency. Because it did, the exception is unavailable; the protest was sustained
      on that basis. The balance would depend on whether the urgency resulted from lack of advanced planning, not merely on
      how soon the services were needed.
    tradecraft: Decline the urgency-based sole-source award and proceed with full and open competition. Record the planning
      chronology and the basis for concluding that the urgency exception is unavailable.
    uncertainty: The stated facts identify the earlier planning and the source's conclusion that government planning caused
      the urgency; no unresolved factual uncertainty is presented.
    handoff: The contracting officer should make the procurement decision on this record. No separate referral or additional
      decision-maker is identified for this choice.
    tempting_wrong:
      option: O1
      pull: The immediate need before the elections makes a sole-source award appear to be the fastest way to obtain the required
        services.
      why_wrong: Speed cannot validate use of the urgency exception when the agency's lack of advanced planning created the
        urgency.
    rejected:
      O1: The urgency exception cannot justify a sole-source award because the agency's earlier planning created the urgency.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The urgency arose from circumstances not created by agency planning, and the urgency exception's other requirements
        were met.
      then: O1
      why: Without agency-created urgency, the planning-based bar would not apply, and the exception could permit limiting
        procurement to firms reasonably believed able to meet the requirement in the available time.
    would_not_change:
    - id: noflip1
      if: The deadline remained immediate and fell before the January elections, while the agency's earlier planning still
        caused the urgency.
      why: The time pressure would remain, but it would not remove the stated bar on using the urgency exception for urgency
        created by lack of advanced planning.
    watch_for:
    - id: watch1
      what: Evidence about whether the agency's actions and planning two to three months earlier caused the immediate need.
      favors:
      - O2
      why: That causal link determines whether the urgency exception is barred.
  lesson: An immediate requirement does not, by itself, justify limiting competition under an urgency exception. When the
    agency's lack of advanced planning created the urgency, the exception cannot be used to support a sole-source award.
  limits: This conclusion concerns the urgency exception on the stated facts. It does not determine whether another statutory
    exception applies or resolve a case in which the urgency was not caused by agency planning.
  library:
    domain: natsec-other
    family: CORPUS-NS-b39d38e4
    source: https://tile.loc.gov/storage-services/service/ll/llmlp/2022_Operational_Law_Handbook/2022_Operational_Law_Handbook.pdf
    episode_focus: The decision point is whether to limit competition on an urgency rationale when the immediate need arose
      after the agency had opportunities to plan. The passage states that the sole-source award was challenged and the protest
      sustained because the agency’s earlier planning caused the urgency; exclude unrelated examples of urgency exceptions
      and the general J&A approval process.
    cues:
