      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The Government Accountability Office sustained the protest because the immediate need before the January 2005 elections
  resulted from unreasonable government actions and acquisition planning two to three months earlier.
