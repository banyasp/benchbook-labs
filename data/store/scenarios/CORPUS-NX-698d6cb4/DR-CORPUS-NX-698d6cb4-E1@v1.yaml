case:
  id: DR-CORPUS-NX-698d6cb4-E1@v1
  title: Framing the Russian Campaign in Crimea and Ukraine
  status: draft
  setting: Analytic assessment of the Russian campaign in Crimea and Ukraine.
  decider: The analyst
  agent: The analyst
  agent_role: decide
  situation: The analyst must choose how to describe Russian warfare in Crimea and Ukraine. Hybrid warfare is used for confrontations
    involving state and non-state actors and multiple modes of action, and the concept largely presupposes kinetic force.
    The campaign in Crimea is described as not involving kinetic action. The analyst also faces a question of whether a Western-derived
    framework adequately captures Russian military theory. The record includes Russian legal arguments and competing Russian
    and Western interpretations of the Crimea referendum.
  question: What should the analyst do in describing the Russian campaign in Crimea and Ukraine?
  options:
    O1:
      do: The analyst should accept the hybrid-warfare description and classify the campaign as hybrid warfare grounded in
        multimode confrontation.
      move: act
      irreversible: false
    O2:
      do: The analyst should reject the hybrid-warfare description and classify the campaign as a distinct model grounded
        in Russian doctrine and influence.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Hybrid warfare involves state and non-state actors using technologies and strategies in a multimode confrontation,
      and largely presupposes kinetic force.
  - id: F2
    kind: situation
    status: assessed
    fact: Russian actions in Crimea are characterized as not involving kinetic force.
  - id: F3
    kind: situation
    status: assessed
    fact: Russian military theory is described as having developed independently of the Western military paradigm, making
      a Western-derived framework potentially unsuitable.
  - id: F4
    kind: situation
    status: assessed
    fact: Russian military theory is described as incorporating doctrinal unilateralism, legalism, and ambiguous terms.
  - id: F5
    kind: situation
    status: assessed
    fact: Russian actions in Ukraine are described as backed by legal action, including a parliament referendum authorizing
      military use in Ukraine.
  - id: F6
    kind: situation
    status: assessed
    fact: Russia denies that the use of Crimea local self-defense forces constituted occupation and maintains that a troop
      increase remained within the bilateral agreement.
  - id: F7
    kind: situation
    status: assessed
    fact: Russia views the Crimea referendum as a Kosovo-like instance of self-determination, while the West views it as violating
      Ukraine’s constitution, including because the ballot offered no option for Crimea to remain part of Ukraine.
  - id: F8
    kind: situation
    status: assessed
    fact: The campaign in Crimea is characterized as using strategic communication and applied influence to shape the operational
      environment.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Hybrid warfare largely presupposes kinetic force, while the campaign in Crimea is characterized as involving no kinetic
      action; Bērziņš therefore finds the term insufficient to describe it.
  - id: C2
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The analysis should not mold independently formed Russian military theory to a Western framework derived from a U.S.
      military concept, because different strategic understandings can invalidate conclusions reached that way.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Doctrinal unilateralism, legalism, and ambiguous terms are presented as interrelated features of Russian theory.
      Russian legal arguments and the competing Russian and Western readings of the referendum help explain how Russia frames
      its actions, rather than resolving the dispute over the referendum's legality.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The campaign's strategic communication and applied influence to shape the operational environment support describing
      it through a distinct Russian model.
  reasoning:
    read: 'The choice is about which conceptual framework best describes the campaign, not whether Russia''s legal arguments
      are correct. The trap is treating the widely used term “hybrid warfare” as an adequate description merely because it
      suggests a mix of methods: Bērziņš says the concept presupposes kinetic force and comes from a Western military framework
      that may not fit Russian theory.'
    weighing: The kinetic-force mismatch and the risk of imposing a Western model are the central reasons for O2. The account
      of Russian doctrine, legal arguments, ambiguous terms, and influence gives a distinct explanatory frame. The referendum's
      legality is disputed between Russia and the West; that dispute informs the account of Russian reasoning but does not
      erase the two central objections to the hybrid-warfare label.
    tradecraft: State the classification as an analytic judgment, distinguish Russian legal claims from the competing Western
      interpretation, and record the kinetic-force and framework-fit grounds for rejecting the hybrid label. Do not present
      either side's referendum interpretation as settled by this classification.
    uncertainty: The excerpt records opposing Russian and Western interpretations of the referendum, but does not adjudicate
      that legal disagreement. The classification also depends on the assessment that the campaign in Crimea did not involve
      kinetic action and on the claim that a Western-derived framework is unsuitable.
    handoff: The analyst can make the descriptive choice; the excerpt identifies no separate approval authority. A subject-matter
      review could test the characterization of Russian doctrine and the campaign, but would not resolve the referendum dispute
      by itself.
    tempting_wrong:
      option: O1
      pull: Hybrid warfare is described as the most accepted term for new conflict methods and Russian warfare in Crimea and
        Ukraine, and it can refer broadly to multimode confrontation.
      why_wrong: Bērziņš argues that the term's kinetic-force presupposition and Western conceptual origins make it an inadequate
        fit for this campaign and Russian military theory.
    rejected:
      O1: The hybrid-warfare description is not chosen because the source says the campaign in Crimea did not involve kinetic
        force and warns against fitting independently formed Russian theory to a Western model.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Further evidence established that kinetic force was central to the campaign and that the hybrid framework accurately
        captured Russian theory without imposing a mismatched Western model.
      then: O1
      why: That would address both principal reasons given for rejecting the hybrid description.
    would_not_change:
    - id: noflip1
      if: The referendum continued to be viewed by Russia as a Kosovo-like instance of self-determination and by the West
        as unconstitutional.
      why: The recorded disagreement informs the competing legal accounts but does not, by itself, resolve the kinetic-force
        mismatch or the concern about applying a Western framework.
    watch_for:
    - id: watch1
      what: Reliable evidence that kinetic force was used in the Crimea campaign.
      favors:
      - O1
      why: It could weaken the source's stated objection that hybrid warfare presupposes kinetics absent from the campaign.
  lesson: Choose a descriptive framework for its fit with the campaign and the theory that produced it, not merely because
    the label is widely accepted. Keep an actor's legal rationale distinct from the analyst's judgment about the adequacy
    of the framework.
  limits: This reasoning addresses the choice between the two descriptions in this analytic assessment; it does not decide
    the legality of the referendum or establish a general rule for classifying other campaigns. The conclusion depends on
    the source's characterization of the Crimea campaign and its account of Russian and Western strategic frameworks.
