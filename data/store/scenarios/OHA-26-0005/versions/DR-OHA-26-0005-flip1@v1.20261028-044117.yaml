case:
  id: DR-OHA-26-0005-flip1@v1
  title: Restoration of Security Clearance under Guideline G [flip]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, October 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: An employee of a DOE contractor, whose role requires a security clearance, is before the hearing because the
    Local Security Office has raised serious doubts under Guideline G. The record shows three DUI arrests (1990, 2002, 2013),
    a 48-hour uncontrolled drinking episode that led to hospitalization in February 2025, and a diagnosis of moderate, recurrent
    Alcohol Use Disorder in June 2025. The employee completed an intensive outpatient program, has attended Alcoholics Anonymous
    regularly since 2014, relapsed in 2025, and then resumed treatment. The hearing record includes two psychologists who
    attest to sustained remission, but laboratory PEth tests from March 2025 through May 2026 were all positive for alcohol
    consumption. DOE Part 710 presumes against granting a clearance but allows mitigation when abstinence and treatment compliance
    are proven. The judge must decide whether the mitigation criteria are satisfied.
  question: What should the Administrative Law Judge decide regarding the employee's security clearance under Guideline G?
  options:
    O1:
      do: Issue a provisional clearance that remains subject to ongoing monitoring.
      move: partial
      irreversible: false
    O2:
      do: Deny the request to restore the employee's security clearance.
      move: act
      irreversible: true
    O3:
      do: Continue the proceeding until additional evidence of abstinence is presented.
      move: hold
      irreversible: false
    O4:
      do: Restore the employee's security clearance without restrictions or conditions.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office has expressed substantial doubt about the employee's eligibility for a clearance under
      Guideline G.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee was arrested for DUI in January 1990, September 2002, and July 2013.
  - id: F4
    kind: situation
    status: confirmed
    fact: In February 2025 the employee was hospitalized after a 48-hour episode of uncontrolled drinking.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A psychologist evaluated the employee in June 2025 and diagnosed moderate, recurrent Alcohol Use Disorder, early
      remission, and concluded rehabilitation was insufficient.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee completed an intensive outpatient program, attended AA regularly, remained abstinent from 2014 until
      a relapse in 2025, and then resumed AA and treatment.
  - id: F7
    kind: capability
    status: confirmed
    fact: The Individual’s PEth tests conducted from March 2025 through May 2026 all returned positive for alcohol consumption.
  - id: F8
    kind: capability
    status: confirmed
    fact: The employee provided records showing AA attendance every two to three days from June 2025 to April 2026.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Two psychologists testified that the employee's Alcohol Use Disorder is in sustained remission, that rehabilitation
      is adequate, and gave a favorable prognosis.
  - id: F10
    kind: authority
    status: confirmed
    fact: DOE Part 710 presumes against granting a clearance but permits mitigation under conditions (b) and (d) when an individual
      demonstrates abstinence and treatment compliance.
  considerations:
  - id: C1
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Part 710 allows mitigation only if the individual can prove continuous abstinence; the positive PEth results demonstrate
      that the abstinence condition has not been met, thereby precluding restoration.
  - id: C2
    facts:
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The PEth biomarker record shows ongoing alcohol consumption despite documented AA attendance, undermining the objective
      proof of abstinence required for mitigation.
  - id: C3
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: While the psychologists attest to remission, their testimony is outweighed by the objective biomarker evidence of
      recent drinking, making the remission claim unreliable for security purposes.
  - id: C4
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The employee's historical alcohol-related incidents, recent hospitalization, and a diagnosis indicating insufficient
      rehabilitation together demonstrate that the mitigating conditions have not been satisfied.
  reasoning:
    read: The core issue is whether the employee's current alcohol-related behavior still constitutes an unacceptable security
      risk under Guideline G.
    weighing: The judge applied Part 710, which requires proof of continuous abstinence for mitigation. The positive PEth
      tests ({F7}) provide objective evidence that the abstinence condition is not met, despite the employee's AA attendance
      ({F8}) and favorable expert testimony ({F9}). Consequently, the mitigating conditions (b) and (d) are not satisfied,
      and the presumption against granting a clearance remains unqualified.
    tradecraft: The decision is recorded in a formal Administrative Law Judge order, citing the relevant CFR provisions, the
      adjudicative guidelines, and the evidentiary record. The order is signed, dated, and the case is closed unless appealed
      under 10 C.F.R. § 710.28.
    uncertainty: Low; the biomarker evidence leaves little doubt that the employee has not maintained abstinence, which is
      the decisive factor for security eligibility.
    handoff: The Administrative Law Judge acted independently, as authorized by 10 C.F.R. § 710.25(d)-(g); no further agency
      review is required absent an appeal.
    tempting_wrong:
      option: O4
      pull: The psychologists' testimony and the employee's long-term AA participation could tempt the judge to restore the
        clearance.
      why_wrong: Restoration would ignore the clear, objective biomarker evidence that the employee has resumed drinking,
        violating the mitigation requirements.
    rejected:
      O1: A provisional clearance is inappropriate because the objective evidence fails to demonstrate the required abstinence.
      O3: Further evidence is unnecessary; the PEth results already establish a lack of compliance with mitigation conditions.
      O4: Full restoration contradicts Part 710's requirement for proven abstinence, which the record does not satisfy.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: All PEth tests conducted after February 2025 are negative for alcohol consumption.
      then: O4
      why: A continuous series of negative biomarker results would re-establish compliance with the abstinence condition,
        making restoration appropriate.
    would_not_change:
    - id: noflip1
      if: The interval of negative PEth tests is shorter than the recommended one-year period.
      why: The judge noted that a shorter testing window does not automatically preclude mitigation if other evidence of abstinence
        is strong.
    watch_for:
    - id: watch1
      what: Any future documented relapse or DUI arrest.
      favors:
      - O2
      why: A new incident would reactivate Guideline G concerns and could lead to denial or revocation of the clearance.
  lesson: When objective biomarker testing (e.g., PEth) indicates recent alcohol consumption, the mitigating conditions of
    Guideline G are not met, and the presumption against granting a clearance prevails, even if expert testimony and treatment
    history are favorable.
  limits: This conclusion applies only in cases where reliable biomarker results are available and show ongoing drinking.
    It does not extend to situations lacking such objective evidence or where the individual can demonstrate a verified period
    of abstinence.
