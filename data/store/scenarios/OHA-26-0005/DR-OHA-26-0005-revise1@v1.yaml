case:
  id: DR-OHA-26-0005-revise1@v1
  title: Restoration of Security Clearance under Guideline G [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, employed by a DOE contractor in a position that requires a security clearance, faced a security
    concern under Guideline G because of multiple DUI arrests, a recent hospitalization after a relapse, and a diagnosis of
    Alcohol Use Disorder. The Local Security Office raised substantial doubt about the Individual’s eligibility for a clearance.
    At the hearing, the Individual presented evidence of treatment, negative PEth tests, regular AA attendance, and testimony
    from two psychologists indicating sustained remission and rehabilitation. The regulations require a presumption against
    granting clearance but allow mitigating conditions when the individual demonstrates abstinence and treatment compliance.
    The Administrative Judge must decide whether the Individual’s alcohol‑related concerns have been sufficiently mitigated
    to restore the clearance.
  question: What should the Administrative Judge do regarding the Individual’s security clearance under Guideline G?
  options:
    O1:
      do: The Administrative Judge grants a provisional clearance pending monitoring.
      move: partial
      irreversible: false
    O2:
      do: The Administrative Judge denies the Individual’s security clearance restoration.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending further evidence.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge restores the Individual’s security clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office raised substantial doubt about the Individual’s eligibility for a security clearance based
      on Guideline G.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual was arrested for DUI in January 1990, September 2002, and July 2013.
  - id: F4
    kind: situation
    status: confirmed
    fact: In February 2025 the Individual was hospitalized after a 48‑hour uncontrolled drinking relapse.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: In June 2025 a psychologist diagnosed the Individual with moderate, recurrent Alcohol Use Disorder, early remission,
      and said rehabilitation was insufficient.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual completed an intensive outpatient program, attended AA regularly, became abstinent in 2014, relapsed
      in 2025, then resumed AA and treatment.
  - id: F7
    kind: capability
    status: confirmed
    fact: The Individual provided eleven negative PEth tests from August 2025 through May 2026, plus a June 2025 negative
      test.
  - id: F8
    kind: capability
    status: confirmed
    fact: The Individual submitted documentation showing AA attendance every two to three days from June 2025 to April 2026.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Two psychologists testified that the Individual’s Alcohol Use Disorder is in sustained remission, that she has demonstrated
      rehabilitation, and gave a good prognosis.
  - id: F10
    kind: authority
    status: confirmed
    fact: The DOE regulations at Part 710 presume against granting a clearance but allow mitigation under conditions (b) and
      (d) when the individual demonstrates abstinence and treatment compliance.
  considerations:
  - id: C1
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: Part 710 presumes against granting a clearance but expressly permits mitigation when the individual meets conditions
      (b) and (d) of Guideline G, which the Individual satisfies.
  - id: C2
    facts:
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: The record shows eleven consecutive negative PEth tests and documented AA attendance, providing objective proof of
      continuous abstinence.
  - id: C3
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Two qualified psychologists testified that the Individual’s Alcohol Use Disorder is in sustained remission, that
      rehabilitation is adequate, and gave a favorable prognosis.
  - id: C4
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: due_process
    favors:
    - O4
    weight: strong
    why: While the LSO’s concerns under Guideline G are valid, the Individual’s long‑term treatment history, the 2025 relapse
      being an isolated event, and subsequent compliance satisfy mitigating condition (b) and (d).
  - id: C5
    facts:
    - F7
    - F9
    equity: risk_mitigation
    favors:
    - O1
    weight: strong
    why: The record of eleven consecutive negative PEth tests and two psychologists' expert testimony demonstrate sustained
      remission, justifying a provisional clearance that allows continued monitoring while protecting national security.
  reasoning:
    read: The core issue is whether the Individual's demonstrated abstinence and professional assessments are sufficient for
      a full restoration or whether a limited, monitored clearance better balances security and rehabilitation interests.
    weighing: While the regulations (C1-C4) still recognize mitigation, the new strong consideration (C5) emphasizes that
      a provisional clearance provides a safe interim solution, allowing the agency to monitor the Individual's compliance
      and intervene promptly if relapse occurs. This shifts the balance toward O1 rather than full restoration.
    tradecraft: The decision will be documented in an administrative decision, citing Part 710, Guideline G, the new risk-mitigation
      consideration, and the procedural record. The ruling will be signed, dated, and communicated to the LSO for ongoing
      monitoring.
    uncertainty: There remains a modest risk of future relapse, but the combination of objective biomarker evidence and expert
      opinion reduces uncertainty enough to justify provisional, not full, clearance.
    handoff: The Administrative Judge acts alone under 10 C.F.R. § 710.25(d)-(g); the LSO will receive the provisional clearance
      order and will conduct periodic reviews as stipulated.
    tempting_wrong:
      option: O4
      pull: The complete mitigation record could tempt the judge to restore the clearance outright.
      why_wrong: Full restoration eliminates the ability to monitor the Individual, increasing risk if a future relapse occurs.
    rejected:
      O2: Denial ignores the clear, sustained evidence of abstinence and professional affirmation of low risk.
      O3: Holding the decision pending further evidence is unnecessary given the robust biomarker and expert record.
      O4: Restoring the clearance without monitoring fails to address the residual risk identified by the LSO.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Any PEth test after February 2025 returns positive for alcohol consumption.
      then: O4
      why: A positive biomarker would demonstrate a breach of the abstinence condition, negating mitigating condition (b)
        and (d).
    would_not_change:
    - id: noflip1
      if: The period of negative PEth tests is less than the recommended one-year duration.
      why: The Judge expressly stated that the slightly shorter testing window does not disturb the conclusion of sustained
        abstinence.
    watch_for:
    - id: watch1
      what: A future documented relapse or DUI arrest.
      favors:
      - O2
      why: A new incident would re-activate Guideline G concerns and could require denial or revocation of the clearance.
  lesson: When an individual with a history of alcohol-related security concerns provides strong, objective evidence of sustained
    abstinence and expert corroboration, a provisional clearance with monitoring can adequately protect national security
    while recognizing rehabilitation.
  limits: This approach applies only when reliable biomarker testing and credible professional assessments are available;
    it is not appropriate where such evidence is lacking or where new alcohol-related incidents arise after the decision.
