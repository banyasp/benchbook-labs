case:
  id: DR-OHA-26-0005-restyle1@v1
  title: Restoration of Security Clearance under Guideline G [restyle]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The employee, a DOE contractor staff member holding a security-required position, is subject to Guideline G due
    to multiple DUI convictions, a 2025 hospitalization after a 48-hour drinking relapse, and a diagnosis of Alcohol Use Disorder.
    The Local Security Office has expressed serious doubt about the employee's clearance eligibility. At the hearing, the
    employee presented treatment records, a series of negative PEth results, regular AA attendance logs, and testimony from
    two psychologists attesting to sustained remission and rehabilitation. Regulations impose a presumption against granting
    a clearance but allow mitigation when abstinence and treatment compliance are demonstrated. The Administrative Judge must
    determine whether the alcohol-related issues have been sufficiently mitigated to reinstate the clearance.
  question: How should the Administrative Judge rule on the employee's security clearance under Guideline G?
  options:
    O1:
      do: The Administrative Judge grants a provisional clearance with ongoing monitoring.
      move: partial
      irreversible: false
    O2:
      do: The Administrative Judge denies the employee's request for clearance restoration.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge defers the ruling pending additional supporting evidence.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge restores the employee's security clearance in full.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a Department of Energy subcontractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office expressed serious reservations concerning the employee's eligibility for a clearance pursuant
      to Guideline G.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee incurred DUI arrests in January 1990, September 2002, and July 2013.
  - id: F4
    kind: situation
    status: confirmed
    fact: In February 2025 the employee required hospitalization following a 48-hour uncontrolled drinking relapse.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A psychologist, in June 2025, diagnosed the employee with moderate, recurrent Alcohol Use Disorder, early remission,
      and concluded that rehabilitation remained insufficient.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee completed an intensive outpatient program, maintained regular AA attendance, achieved abstinence in
      2014, experienced a relapse in 2025, and subsequently returned to AA and treatment.
  - id: F7
    kind: capability
    status: confirmed
    fact: Eleven consecutive negative PEth results were submitted, covering August 2025 through May 2026, together with an
      additional negative test from June 2025.
  - id: F8
    kind: capability
    status: confirmed
    fact: Documentation confirms AA participation every two to three days spanning June 2025 to April 2026.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Two psychologists testified that the employee's Alcohol Use Disorder is in sustained remission, that rehabilitation
      has been demonstrated, and they offered a favorable prognosis.
  - id: F10
    kind: authority
    status: confirmed
    fact: DOE Part 710 regulations presuppose a denial of clearance yet permit mitigation under conditions (b) and (d) when
      the individual evidences abstinence and compliance with treatment.
  considerations:
  - id: C1
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: Although Part 710 assumes a denial, it expressly allows mitigation when the individual fulfills conditions (b) and
      (d) of Guideline G; the employee meets those criteria.
  - id: C2
    facts:
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: The record contains eleven consecutive negative PEth results and documented AA attendance, furnishing objective evidence
      of uninterrupted abstinence.
  - id: C3
    facts:
    - F9
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Two qualified psychologists attested that the employee's Alcohol Use Disorder remains in sustained remission, that
      rehabilitation is adequate, and they provided a favorable prognosis.
  - id: C4
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Although the LSO's concerns under Guideline G are legitimate, the employee's extensive treatment history, the isolated
      nature of the 2025 relapse, and subsequent compliance satisfy mitigating conditions (b) and (d).
  reasoning:
    read: The issue centers on whether the employee's historical alcohol-related incidents continue to present an unacceptable
      security risk under Guideline G, or whether demonstrated, sustained remission and compliance mitigate that risk.
    weighing: Applying the regulatory framework (C1), the Administrative Judge concluded that the employee fulfills both mitigating
      condition (b)—documented abstinence and treatment compliance—and condition (d)—successful completion of a treatment
      program with after-care. Objective abstinence evidence (C2) and expert corroboration (C3) bolstered the mitigation analysis.
      While the presumption against clearance is robust, the aggregate weight of the mitigating factors surpassed the LSO's
      concerns (C4), resulting in a finding that restoration does not jeopardize national security.
    tradecraft: The ruling is entered in a formal Administrative Judge Decision, referencing the pertinent CFR provisions,
      the Adjudicative Guidelines, and the evidentiary record. The decision bears the judge's signature and date, and the
      file is closed pending any appeal under 10 C.F.R. § 710.28.
    uncertainty: Minimal; the sole remaining uncertainty pertains to the potential for future relapse, yet the record demonstrates
      a strong support network and ongoing therapy that mitigate that risk.
    handoff: The Administrative Judge acted independently, pursuant to 10 C.F.R. § 710.25(d)-(g); no additional agency review
      is required unless an appeal is lodged.
    tempting_wrong:
      option: O2
      pull: The strong presumption against granting a clearance may tempt the judge to deny restoration despite the mitigating
        evidence.
      why_wrong: Denial would disregard the documented compliance with treatment recommendations and the expert opinions indicating
        the employee poses no security risk.
    rejected:
      O1: A provisional clearance is unnecessary because the evidence satisfies the full mitigation standards, not merely
        a temporary measure.
      O2: Denial conflicts with the finding that mitigating conditions (b) and (d) have been satisfied.
      O3: Holding the decision pending additional evidence is unwarranted; the record already furnishes sufficient proof of
        sustained remission.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Any PEth test after February 2025 returns positive for alcohol consumption.
      then: O2
      why: A positive biomarker would show a breach of the abstinence requirement, nullifying mitigating conditions (b) and
        (d).
    would_not_change:
    - id: noflip1
      if: The period of negative PEth tests is less than the recommended one-year duration.
      why: The Judge expressly noted that the slightly shorter testing window does not disturb the conclusion of sustained
        abstinence.
    watch_for:
    - id: watch1
      what: A future documented relapse or DUI arrest.
      favors:
      - O2
      why: A new incident would reactivate Guideline G concerns and could necessitate denial or revocation of the clearance.
  lesson: When an employee with prior alcohol-related security concerns demonstrates sustained, objectively verified abstinence,
    adheres to treatment recommendations, and obtains corroborating expert testimony, the mitigating conditions of Guideline
    G can outweigh the presumption against clearance. The decision rests on concrete evidence of remission rather than on
    past conduct alone.
  limits: This analysis applies only where reliable biomarker testing (e.g., PEth) and credible professional assessments are
    available. It does not extend to cases lacking objective proof of abstinence or where new alcohol-related incidents arise
    after the decision.
