case:
  id: DR-CORPUS-NX-6c120383-E1@v1
  title: Criminal Allegations Involving CIA Operations
  status: draft
  setting: 1954, Department of Justice and CIA, United States
  decider: The Department of Justice
  agent: The Department of Justice
  agent_role: decide
  situation: The Department of Justice is responsible by statute for investigating and prosecuting federal criminal cases.
    Criminal prosecution is a significant form of external control over misconduct in official positions. In the usual federal
    process, an agency conducts a preliminary inquiry into possible criminal conduct and refers allegations with substance
    to the Department of Justice. The CIA has raised concerns that investigation and prosecution of cases involving its operations
    could publicly disclose sensitive information. The Department of Justice must determine who investigates such allegations
    and whether potential cases are referred for prosecutorial consideration.
  question: What should the Department of Justice do about the investigation and referral of potential criminal cases involving
    CIA operations?
  options:
    O1:
      do: The Department of Justice directs the CIA to conduct a preliminary inquiry and refer substantiated cases to DOJ
        for investigation and prosecutorial consideration.
      move: act
      irreversible: false
    O2:
      do: The Department of Justice directs the CIA to investigate potential cases and withhold referral when sensitive disclosure
        precludes prosecution.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Department of Justice is charged by statute with investigating and prosecuting criminal cases on behalf of the
      United States.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Department of Justice exercises the President’s constitutional responsibility to take care that the laws are
      faithfully executed.
  - id: F3
    kind: situation
    status: confirmed
    fact: In most federal agencies, possible criminal conduct is investigated preliminarily, and allegations with substance
      are referred to the Department of Justice for investigation and a prosecution decision.
  - id: F4
    kind: situation
    status: confirmed
    fact: The CIA raised the concern that prosecution in many cases involving the Agency would require public disclosure of
      sensitive operations and procedures.
  - id: F5
    kind: situation
    status: assessed
    fact: The CIA considered investigation and prosecutorial consideration by outsiders likely to disseminate sensitive information
      more widely than it considered appropriate.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Department of Justice recognized the possibility that prosecution could be precluded if it required revealing
      sensitive information.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: DOJ held the statutory responsibility to investigate and prosecute federal crimes and exercised the President’s duty
      to ensure faithful execution of the laws. The usual federal process also sent substantiated allegations to DOJ for investigation
      and a prosecution decision.
  - id: C2
    facts:
    - F4
    - F6
    equity: classification_integrity
    favors:
    - O2
    weight: strong
    why: The CIA warned that prosecution in many cases could require public disclosure of sensitive operations and procedures,
      and DOJ recognized that this need could preclude prosecution. The DOJ response made avoiding such disclosure central
      to whether a case was referred.
  - id: C3
    facts:
    - F5
    equity: classification_integrity
    favors:
    - O2
    weight: weak
    why: The CIA considered even outside investigation and prosecutorial consideration likely to spread sensitive information
      more widely than it considered appropriate. This was the Agency’s assessment, not an independently established finding.
  - id: C4
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Assigning the investigation and referral judgment to the CIA transferred law-enforcement decisions away from the
      department charged with those duties. The arrangement was characterized as DOJ’s abdication of its statutory duties.
  reasoning:
    read: 'The issue was not simply how to protect sensitive information: DOJ had statutory responsibility for criminal investigation
      and prosecution, while the CIA warned that outside consideration could spread information and that prosecution could
      require public disclosure. The trap is treating secrecy concerns as automatically resolving who should investigate and
      decide referral, even though doing so placed law-enforcement judgments with the CIA.'
    weighing: DOJ’s stated reason for O2 was the risk that investigation or prosecution would expose sensitive Agency operations
      and procedures, including circumstances in which disclosure would preclude prosecution. That concern explains the choice,
      but the arrangement also abdicated DOJ’s statutory duties and placed prosecutorial decisions with the CIA. There was
      no evidence that the CIA abused those powers, but that does not erase the institutional transfer of responsibility.
      The balance therefore turns on the secrecy concern identified by DOJ, while the legal-authority objection to the arrangement
      remains substantial.
    tradecraft: Under the recorded approach, the CIA was to investigate the allegations and note in its files when prosecution
      appeared precluded by the need to reveal sensitive information; such a case was not to be referred to DOJ. Keep that
      condition and the basis for nonreferral documented, rather than treating sensitivity alone as an unstated blanket exemption.
    uncertainty: The passage does not describe any underlying allegation or establish how often prosecution would actually
      have required disclosure. The CIA assessed a risk of wider dissemination, and there was no evidence that it abused the
      powers assigned to it.
    handoff: The 1954 arrangement assigned the initial investigation and referral judgment to the CIA, despite DOJ’s statutory
      role. In January 1975, DOJ directed that cases with potential for criminal prosecution be referred to it for consideration.
    tempting_wrong:
      option: O1
      pull: The usual federal process and DOJ’s statutory responsibilities point toward DOJ investigation and prosecutorial
        consideration.
      why_wrong: 'That route does not address the specific secrecy concern DOJ accepted: outside investigation and consideration
        could disseminate sensitive information more widely, and required disclosure could preclude prosecution.'
    rejected:
      O1: DOJ did not choose ordinary referral for investigation and prosecutorial consideration because it accepted the CIA’s
        concern that outside handling could spread sensitive information and that disclosure could preclude prosecution.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The sensitive information could be protected while still allowing DOJ to investigate and consider prosecution.
      then: O1
      why: That would remove the stated secrecy-based reason for assigning the investigation and nonreferral judgment to the
        CIA, while leaving DOJ’s statutory responsibilities in place.
    would_not_change:
    - id: noflip1
      if: There remained no evidence that the CIA had abused the investigative and prosecutorial judgment assigned to it.
      why: The absence of evidence of abuse did not alter the conclusion that transferring these law-enforcement powers placed
        DOJ’s statutory duties with the CIA.
    watch_for:
    - id: watch1
      what: Whether DOJ directs that cases with potential for criminal prosecution be referred to it for consideration.
      favors:
      - O1
      why: In January 1975, DOJ directed that such cases be referred to it for consideration, marking a change from the 1954
        arrangement.
  lesson: A serious confidentiality concern may explain limits on prosecutorial action, but it does not by itself settle which
    institution should hold criminal investigative and referral authority. Any decision to withhold referral should be tied
    to the stated disclosure-based condition and weighed against the statutory responsibility assigned to DOJ.
  limits: This reasoning concerns the 1954 allocation of investigation and referral responsibility between DOJ and the CIA,
    not the merits of any underlying allegation. It does not establish that every CIA-related case would expose sensitive
    information or that prosecution was necessarily impossible.
