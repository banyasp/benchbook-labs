case:
  id: DR-STARK-1987-1@v1
  title: Response to Approaching Potentially Hostile Aircraft
  status: draft
  setting: USS STARK, Persian Gulf, 21 October 1987, US Navy
  decider: Commanding Officer of USS STARK
  agent: Commanding Officer
  agent_role: decide
  situation: The ship had received a rules‑of‑engagement briefing that required informing unknown aircraft of its identity
    and position and gave the commander authority to take protective measures. Radar and electronic surveillance detected
    an Iraqi aircraft that was known to have previously struck shipping. By 2102 the tactical action officer estimated the
    aircraft would pass within four nautical miles. The TAO directed a warning to be issued, but the commanding officer had
    left the bridge earlier and was not present when the warning was to be transmitted. The ship’s close‑in weapon system
    remained in standby mode throughout the encounter. The vessel was operating in international waters, outside declared
    war zones.
  question: What should the Commanding Officer do when an aircraft known to have previously attacked shipping approaches within
    close range?
  options:
    O1:
      do: Continue routine operations without issuing a warning or changing defensive posture
      move: act
      irreversible: false
    O2:
      do: Issue a warning to the aircraft and place the ship’s defensive systems on alert
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The ROE briefed that ships are obligated to inform unknown aircraft of their identity and position to limit indiscriminate
      attack.
  - id: F2
    kind: authority
    status: confirmed
    fact: The commander has the right and responsibility to take all possible measures to protect his unit.
  - id: F3
    kind: authority
    status: confirmed
    fact: The ROE permits the use of necessary and proportional force in self‑defense.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Radar video continuously tracked an unknown aircraft from 2101 until impact.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The TAO was told the air contact would have a 4 NM closest point of approach.
  - id: F6
    kind: situation
    status: confirmed
    fact: The TAO directed the detector‑tracker to issue warnings to the Iraqi aircraft.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Commanding Officer left the bridge at 2059 and was not present when the warning was to be transmitted.
  - id: F8
    kind: capability
    status: confirmed
    fact: The CIWS remained in standby mode throughout the entire attack.
  - id: F9
    kind: authority
    status: confirmed
    fact: The warning transmitted at 2108 did not follow the prescribed wording in the CMEF ROE message.
  - id: F10
    kind: situation
    status: confirmed
    fact: USS STARK was operating in international waters, well outside Iraqi and Iranian declared war zones.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The ROE brief explicitly obligates ships to inform unknown aircraft of identity and position and gives the commander
      the responsibility to protect his unit.
  - id: C2
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Intelligence showed the aircraft was an Iraqi fighter known to have struck shipping and was projected to pass within
      4 NM, creating an imminent threat.
  - id: C3
    facts:
    - F7
    - F9
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The CO had left the bridge and the warning transmitted did not follow the prescribed ROE wording, indicating a breakdown
      that must be corrected by issuing the proper warning.
  - id: C4
    facts:
    - F8
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The CIWS remained in standby, depriving the ship of its primary defensive capability; activating it is required under
      self‑defence.
  - id: C5
    facts:
    - F3
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The ROE permits the use of necessary and proportional force in self‑defence, which includes warning and raising defensive
      posture.
  reasoning:
    read: 'The situation was a classic trap: treating a known hostile aircraft as a routine transit because the CO was absent,
      despite ROE that demand a warning and defensive readiness.'
    weighing: The source’s reasoning balances the strong considerations C1‑C5, each citing ROE authority, intelligence of
      a hostile aircraft, and the failure to follow prescribed warning language. Because the ROE and the commander’s duty
      to protect his unit are binding, the balance unequivocally favors issuing a warning and placing defenses on alert.
    tradecraft: The CO should immediately order the TAO to transmit the exact CMEF‑prescribed warning, shift the CIWS from
      standby to active mode, and document the action in the ship’s log and after‑action report.
    uncertainty: Time was limited, but the ROE provided clear, non‑discretionary steps; uncertainty does not outweigh the
      legal requirement.
    handoff: While the CO retains ultimate authority, the TAO and XO should be tasked to execute the warning and defensive
      posture, with the CO confirming completion.
    tempting_wrong:
      option: O1
      pull: The CO’s absence and the desire to continue routine operations made ignoring the threat appear convenient.
      why_wrong: Ignoring the threat violated the ROE obligation to warn and to protect the ship, exposing the crew to unnecessary
        danger.
    rejected:
      O1: Not chosen because it contravenes the ROE’s explicit requirement to inform unknown aircraft and to take protective
        measures.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the aircraft had been positively identified as a friendly or neutral platform
      then: O1
      why: If identification removed the hostile intent, the ROE warning requirement would not apply.
    would_not_change:
    - id: noflip1
      if: the CO remains absent from the bridge
      why: The ROE places the duty on the commander regardless of his physical location; delegation does not remove the requirement.
    watch_for:
    - id: watch1
      what: any deviation from the CMEF‑prescribed warning wording
      favors:
      - O2
      why: Incorrect wording could reduce the warning’s effectiveness and increase risk of escalation.
  lesson: When ROE require a warning and defensive readiness against an unknown or hostile aircraft, the commander must issue
    the prescribed warning and ready defensive systems, even if he is not physically on the bridge.
  limits: This rule applies only when the aircraft is unidentified or hostile; if positive identification confirms a non‑threat,
    the warning requirement does not apply. It also does not extend to situations where higher‑level authority explicitly
    modifies the ROE.
  library:
    domain: military-operational
    family: STARK-1987
    source: https://documents2.theblackvault.com/documents/navy/USSSTARK-NAVYJAG.pdf
    episode_focus: Whether the tactical action officer and the commanding officer should treat an approaching aircraft of
      a belligerent known to have struck shipping as a potential threat, with warning and defensive readiness under the self-defence
      rules of engagement, or treat it as a routine transit and continue with other tasks.
    cues:
      option_words:
        O1: 11
        O2: 14
      real_option: O2
      real_to_mean_other_length: 1.27
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
verdict_tier: source-endorsed
basis: The commander has not only the right, but also the responsibility to take all possible measures and precautions to
  protect his unit, and may use necessary and proportional force in self‑defense (CMEF ROE).
