case:
  id: DR-STARK-1987-flip1@v1
  title: Response to Approaching Potentially Hostile Aircraft [flip]
  status: needs_review
  setting: USS VENTURE, Strait of Hormuz, 12 June 1992, US Navy
  decider: Commanding Officer of USS VENTURE
  agent: Commanding Officer
  agent_role: decide
  situation: During a routine patrol the ship received a rules-of-engagement briefing that required a warning only for unknown
    or hostile aircraft. Radar and electronic surveillance picked up an aircraft that had previously been involved in regional
    incidents. By 1430 the tactical action officer projected the aircraft would pass within three nautical miles. The TAO
    prepared a warning transmission, but the commanding officer had stepped away from the bridge at 1415 and was not present
    when the warning was to be sent. The close-in weapon system stayed in standby throughout the contact. The vessel was operating
    in international waters, well outside any declared combat zone.
  question: What should the Commanding Officer do when an aircraft that has been positively identified as a neutral platform
    approaches within close range?
  options:
    O1:
      do: Continue routine operations without issuing a warning or changing defensive posture
      move: act
      irreversible: false
    O2:
      do: Issue a warning to the aircraft and place the ship's defensive systems on alert
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The ROE state that ships must inform unknown or hostile aircraft of their identity and position to prevent indiscriminate
      attacks.
  - id: F2
    kind: authority
    status: confirmed
    fact: The commander is authorized and obligated to take all reasonable measures to protect his vessel.
  - id: F3
    kind: authority
    status: confirmed
    fact: The ROE allow the use of necessary and proportionate force in self-defence.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Radar video continuously tracked an aircraft that had been positively identified as a neutral platform.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The TAO estimated the aircraft's closest point of approach to be 3 NM.
  - id: F6
    kind: situation
    status: confirmed
    fact: The TAO directed the detector‑tracker to monitor the aircraft, which had been positively identified as a neutral
      platform.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Commanding Officer left the bridge at 1415 and was not present when the warning was to be transmitted.
  - id: F8
    kind: capability
    status: confirmed
    fact: The CIWS remained in standby mode throughout the entire encounter.
  - id: F9
    kind: authority
    status: confirmed
    fact: The warning transmitted at 1440 did not follow the prescribed wording in the CMEF ROE message.
  - id: F10
    kind: situation
    status: confirmed
    fact: USS VENTURE was operating in international waters, far from any declared war zones.
  considerations:
  - id: C4
    facts:
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: With the aircraft confirmed as a neutral platform, maintaining the CIWS in standby is appropriate and avoids unnecessary
      escalation.
  reasoning:
    read: The contact was a known neutral aircraft, and the ROE only mandates warnings for unknown or hostile platforms. The
      CO's absence does not create a duty to act when no threat exists.
    weighing: Strong considerations C4 and the new C6 both support maintaining the current posture. Because the aircraft is
      neutral, the legal and safety arguments for escalation disappear, making the balance decisively in favor of continuing
      routine operations.
    tradecraft: The CO should document the identification, retain the CIWS in standby, and file a routine after-action report
      noting the neutral contact.
    uncertainty: No significant uncertainty remains; the identification is confirmed and the ROE do not require a warning.
    handoff: The CO retains ultimate authority but can delegate monitoring to the TAO while remaining off-bridge.
    tempting_wrong:
      option: O2
      pull: A cautious instinct to issue a warning and raise defenses, even though the aircraft is neutral, may seem prudent.
      why_wrong: Issuing a warning and activating defenses against a neutral platform could be interpreted as hostile, risking
        unnecessary escalation.
    rejected:
      O2: Rejected because the aircraft is positively identified as neutral, and the ROE do not require a warning or defensive
        alert in this circumstance.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the aircraft had been positively identified as hostile or unknown with hostile intent
      then: O2
      why: If the contact were hostile, the ROE warning requirement and defensive posture would re-activate.
    would_not_change:
    - id: noflip1
      if: the CO remains absent from the bridge
      why: The ROE places the duty on the commander regardless of his physical location; delegation does not remove the requirement.
    watch_for:
    - id: watch1
      what: any deviation from the CMEF-prescribed warning wording
      favors:
      - O2
      why: Incorrect wording could reduce the warning's effectiveness and increase risk of escalation.
  lesson: When an aircraft is positively identified as neutral, the commander may maintain routine operations without issuing
    a warning or altering defensive posture, even if he is not on the bridge.
  limits: This guidance applies only when the aircraft's identity is confirmed as neutral or non-threatening. If the aircraft
    is unknown or hostile, the ROE's warning and defensive requirements remain in force.
