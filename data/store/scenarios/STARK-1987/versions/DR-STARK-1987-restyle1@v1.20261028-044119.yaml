case:
  id: DR-STARK-1987-restyle1@v1
  title: Response to Approaching Potentially Hostile Aircraft [restyle]
  status: needs_review
  setting: USS VANGUARD, Arabian Sea, 21 October 1987, United States Navy
  decider: Commanding Officer of USS VANGUARD
  agent: Commanding Officer
  agent_role: decide
  situation: The vessel had received a rules-of-engagement briefing that mandates informing unknown aircraft of its identity
    and position and grants the commander authority to take protective measures. Radar and electronic surveillance picked
    up an Iraqi aircraft known from prior incidents to have struck merchant ships. By 2102 the tactical action officer projected
    the aircraft would pass within four nautical miles. The TAO ordered a warning to be issued, but the commanding officer
    had left the bridge at 2059 and was not present when the warning was to be transmitted. The ship's close-in weapon system
    stayed in standby mode throughout the encounter. The vessel was operating in international waters, outside any declared
    war zones.
  question: How should the Commanding Officer respond when a hostile aircraft with a history of striking vessels approaches
    to within close proximity?
  options:
    O1:
      do: Maintain current course and posture, forgo any warning, and keep defensive systems in standby.
      move: act
      irreversible: false
    O2:
      do: Transmit the required identification warning and elevate the ship's defensive systems to an alert state.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The rules of engagement state that vessels must identify themselves and disclose their position to any unknown aircraft
      to deter indiscriminate attacks.
  - id: F2
    kind: authority
    status: confirmed
    fact: The commanding officer holds the authority and duty to employ all feasible measures to safeguard his ship.
  - id: F3
    kind: authority
    status: confirmed
    fact: The ROE authorizes the application of necessary and proportionate force for self-defense.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Continuous radar imagery tracked an unidentified aircraft from 2101 until the moment of contact.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The tactical action officer received an estimate that the aircraft's closest point of approach would be four nautical
      miles.
  - id: F6
    kind: situation
    status: confirmed
    fact: The TAO instructed the detection system to issue a warning to the Iraqi aircraft.
  - id: F7
    kind: situation
    status: confirmed
    fact: The commanding officer departed the bridge at 2059 and was absent when the warning transmission was scheduled.
  - id: F8
    kind: capability
    status: confirmed
    fact: The close-in weapon system stayed in standby throughout the entire encounter.
  - id: F9
    kind: authority
    status: confirmed
    fact: The warning sent at 2108 did not conform to the exact phrasing mandated by the CMEF ROE template.
  - id: F10
    kind: situation
    status: confirmed
    fact: USS VANGUARD was operating in international waters, well beyond the Iraqi and Iranian declared combat zones.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The ROE explicitly requires vessels to announce their identity and location to unknown aircraft, and it assigns the
      commander the responsibility to protect his unit.
  - id: C2
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Intelligence confirms the aircraft is an Iraqi fighter previously responsible for attacks on shipping and its projected
      4 NM pass presents an imminent danger.
  - id: C3
    facts:
    - F7
    - F9
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: Because the commander was not on the bridge and the warning failed to use the prescribed language, a procedural breach
      exists that must be rectified by issuing the correct warning.
  - id: C4
    facts:
    - F8
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: With the CIWS still in standby, the ship lacks its primary defensive capability; activating it is necessary under
      self-defense obligations.
  - id: C5
    facts:
    - F3
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The ROE permits the employment of necessary and proportional force in self-defense, which includes issuing a warning
      and raising the defensive posture.
  reasoning:
    read: 'The scenario represents a classic pitfall: treating a known hostile aircraft as a routine transit because the commander
      was absent, despite ROE that demand a warning and defensive readiness.'
    weighing: The analysis weighs the strong considerations C1-C5, each anchored in ROE authority, hostile-aircraft intelligence,
      and the failure to employ the correct warning language. Given the binding nature of the ROE and the commander's duty
      to protect his vessel, the balance clearly supports transmitting the warning and moving defenses to alert.
    tradecraft: The commander should promptly order the TAO to send the exact CMEF-prescribed warning, transition the CIWS
      from standby to active, and record the actions in the ship's log and post-action report.
    uncertainty: Although time was limited, the ROE offers clear, non-discretionary steps; uncertainty does not outweigh the
      legal mandate.
    handoff: While ultimate authority remains with the commander, the TAO and executive officer should be tasked to execute
      the warning and defensive posture, with the commander confirming completion.
    tempting_wrong:
      option: O1
      pull: The commander's absence and the temptation to continue normal operations made ignoring the threat seem expedient.
      why_wrong: Neglecting the threat breaches the ROE's warning requirement and endangers the crew.
    rejected:
      O1: Not selected because it violates the ROE's explicit mandate to warn unknown aircraft and to adopt protective measures.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the aircraft had been positively identified as a friendly or neutral platform
      then: O1
      why: If identification removed hostile intent, the ROE warning requirement would not be triggered.
    would_not_change:
    - id: noflip1
      if: the commander remains off the bridge
      why: The ROE places the duty on the commander regardless of his physical presence; delegating does not eliminate the
        obligation.
    watch_for:
    - id: watch1
      what: any deviation from the CMEF-prescribed warning wording
      favors:
      - O2
      why: Incorrect phrasing could diminish the warning's effectiveness and raise the risk of escalation.
  lesson: When ROE obligate a warning and defensive readiness against an unknown or hostile aircraft, the commander must issue
    the prescribed warning and ready defensive systems, even if he is not physically on the bridge.
  limits: This principle applies only when the aircraft is unidentified or hostile; a positive identification of a non-threat
    negates the warning requirement. It does not extend to situations where higher authority explicitly alters the ROE.
