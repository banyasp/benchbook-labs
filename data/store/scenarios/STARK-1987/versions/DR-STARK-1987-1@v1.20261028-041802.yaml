case:
  id: DR-STARK-1987-1@v1
  title: Treating an Approaching Aircraft as Threat or Routine Transit
  status: draft
  setting: USS STARK, Persian Gulf, 21 July 1987
  decider: Commanding Officer
  agent: Commanding Officer
  agent_role: decide
  situation: An Iraqi fighter aircraft was detected approaching USS STARK at close range. The Tactical Action Officer observed
    the aircraft’s course change and recognized a near collision course, directing that warnings be issued. The Commanding
    Officer was not on the bridge at that moment, having left earlier. A warning transmission was sent on the Military Air
    Distress frequency but did not follow the exact prescribed wording. The ship’s CIWS remained in standby mode, not in an
    active defensive mode. The ship was operating in international waters outside declared war zones, and the attack was later
    judged unprovoked and indiscriminate.
  question: What should the Commanding Officer do regarding the approaching aircraft?
  options:
    O1:
      do: The Commanding Officer treats the approaching aircraft as a routine transit and does not issue a warning or change
        the ship’s defensive posture.
      move: act
      irreversible: true
    O2:
      do: The Commanding Officer issues a warning to the approaching aircraft and orders the ship to a heightened defensive
        posture.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: ROE requires ships to inform unknown aircraft of their identity and position to limit the possibility of indiscriminate
      attack.
  - id: F2
    kind: authority
    status: confirmed
    fact: ROE gives the commander the right and responsibility to take all possible measures to protect his unit.
  - id: F3
    kind: authority
    status: confirmed
    fact: ROE permits the use of necessary and proportional force in self‑defense against attack or imminent threat.
  - id: F4
    kind: situation
    status: confirmed
    fact: At about 2107, the Tactical Action Officer observed the Iraqi aircraft changing course, realized a close point of
      approach, and directed that warnings be issued.
  - id: F5
    kind: situation
    status: confirmed
    fact: At about 2107, the Commanding Officer was not on the bridge, having left earlier.
  - id: F6
    kind: situation
    status: confirmed
    fact: A warning transmission was made on the Military Air Distress frequency but did not follow the exact wording prescribed
      by ROE.
  - id: F7
    kind: capability
    status: confirmed
    fact: The ship’s Close‑In Weapon System (CIWS) was in standby mode during the incident.
  - id: F8
    kind: situation
    status: confirmed
    fact: The attack was unprovoked and indiscriminate; the ship was in international waters, well outside Iraqi and Iranian
      declared war zones.
  - id: F9
    kind: capability
    status: confirmed
    fact: The combat information center maintained a continuous real‑time track of the aircraft.
  - id: F10
    kind: intelligence
    status: confirmed
    fact: ROE briefings highlighted that indiscriminate attack in the Persian Gulf was a significant danger.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: ROE explicitly obligates the commander to inform unknown aircraft of identity and position and grants the commander
      the right and responsibility to take all possible measures to protect the unit.
  - id: C2
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The ROE permits the use of necessary and proportional force in self‑defense against an imminent threat, and the Tactical
      Action Officer identified a close point of approach that constituted such a threat.
  - id: C3
    facts:
    - F6
    - F7
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: Although the warning transmission did not follow the exact prescribed wording, the intent to warn was present; failing
      to issue any warning would have increased the risk of uncontrolled escalation.
  - id: C4
    facts:
    - F8
    - F10
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Intelligence briefings warned that indiscriminate attacks were a significant danger in the Gulf; taking defensive
      action aligns with the mission to preserve the ship’s operational capability.
  reasoning:
    read: The ship was in international waters when an Iraqi fighter, known to have previously attacked shipping, altered
      course toward USS STARK, creating a near‑collision trajectory. The watch recognized the danger and attempted a warning,
      but the CO was absent from the bridge and the CIWS remained in standby.
    weighing: The source balances the commander’s legal duty to protect his unit (C1, C2) against the procedural defect in
      the warning transmission (C3). Because the ROE gives the commander both the authority and the responsibility to act
      against an imminent threat, the balance tips toward issuing a warning and raising defensive posture (O2). The unprovoked
      nature of the attack (F8) reinforces the need for proactive self‑defence.
    tradecraft: The CO should immediately issue the prescribed warning wording, place the CIWS in active defense mode, and
      document the action in the ship’s log as required by ROE compliance procedures.
    uncertainty: Limited time between detection and impact created uncertainty about the effectiveness of the warning, but
      the ROE does not require certainty of success before acting.
    handoff: The CO may delegate the actual transmission to the TAO but must retain final authority and ensure the defensive
      posture is ordered; the decision is not to be deferred to subordinate judgment.
    tempting_wrong:
      option: O1
      pull: Treating the aircraft as a routine transit avoids the immediate workload of issuing a warning and changing the
        ship’s posture.
      why_wrong: This ignores the explicit ROE duty to warn and to protect the ship, and it fails to address the imminent
        threat identified by the watch.
    rejected:
      O1: The watch had identified a clear, imminent threat and ROE required a warning and defensive readiness; ignoring it
        would violate the commander’s responsibility.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the aircraft had been positively identified as a non‑hostile, civilian aircraft before closing to 4 NM CPA
      then: O1
      why: ROE permits treating a known non‑hostile contact as routine transit.
    would_not_change:
    - id: noflip1
      if: the warning transmission is imperfect but still conveys identity and intent
      why: ROE requires a warning; the exact wording is not a condition that negates the duty to warn.
    watch_for:
    - id: watch1
      what: any future contact that fails to respond to the prescribed warning format
      favors:
      - O2
      why: Failure to respond escalates the threat and triggers the self‑defence clause of ROE.
  lesson: When ROE obligates a commander to warn unknown aircraft and to protect the unit, the commander must issue the prescribed
    warning and assume a defensive posture even if the warning is not perfectly worded.
  limits: This reasoning applies only when the contact is a potential hostile aircraft in a region where indiscriminate attacks
    have been warned against; it does not extend to contacts that have been positively identified as civilian or non‑threatening
    before closing.
  library:
    domain: military-operational
    family: STARK-1987
    source: https://documents2.theblackvault.com/documents/navy/USSSTARK-NAVYJAG.pdf
    episode_focus: Whether the tactical action officer and the commanding officer should treat an approaching aircraft of
      a belligerent known to have struck shipping as a potential threat, with warning and defensive readiness under the self-defence
      rules of engagement, or treat it as a routine transit and continue with other tasks.
    cues:
      option_words:
        O1: 23
        O2: 19
      real_option: O2
      real_to_mean_other_length: 0.83
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
verdict_tier: source-endorsed
basis: Chief of Naval Operations third endorsement concurring in findings and opinions as modified (p5.11) concluded that
  the ship should have issued a warning and assumed a heightened defensive posture.
