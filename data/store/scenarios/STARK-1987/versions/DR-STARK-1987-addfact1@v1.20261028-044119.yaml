case:
  id: DR-STARK-1987-addfact1@v1
  title: Response to Approaching Potentially Hostile Aircraft [addfact]
  status: needs_review
  setting: USS STARK, Persian Gulf, 21 Oct 1987, United States Navy
  decider: Commanding Officer of USS STARK
  agent: Commanding Officer
  agent_role: decide
  situation: The ship's rules-of-engagement briefing instructed that vessels must announce their identity and location to
    any unknown aircraft to limit indiscriminate attacks, and it granted the commanding officer authority to take any protective
    measures, including proportional force. Radar and electronic surveillance continuously tracked an unidentified aircraft—later
    identified as an Iraqi plane with a history of striking shipping—from 21:01 onward, and the tactical action officer estimated
    its closest point of approach would be four nautical miles. The TAO was directed to have the detector-tracker issue a
    warning to the aircraft. During the preceding hour the ship's VHF radio suffered intermittent interference, and the commanding
    officer left the bridge at 20:59, so he was not present when the warning was to be sent. The warning was finally transmitted
    at 21:08, but its phrasing did not follow the prescribed CMEF ROE message. Throughout the incident the close-in weapon
    system stayed in standby mode, and the vessel was operating in international waters, well beyond the Iraqi and Iranian
    declared war zones.
  question: When an aircraft known to have previously attacked merchant vessels approaches within close range, what course
    of action should the Commanding Officer take?
  options:
    O1:
      do: Maintain current operations, refraining from issuing a warning or altering the defensive posture.
      move: act
      irreversible: false
    O2:
      do: Transmit the required warning to the aircraft and place the ship's defensive systems on alert.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The rules-of-engagement briefing stipulated that ships must inform unknown aircraft of their identity and position
      to mitigate indiscriminate attacks.
  - id: F2
    kind: authority
    status: confirmed
    fact: The commanding officer is vested with the authority and duty to employ any feasible measures to safeguard his unit.
  - id: F3
    kind: authority
    status: confirmed
    fact: The ROE allow the employment of force that is necessary and proportionate for self-defense.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Radar video continuously monitored an unidentified aircraft from 21:01 until the point of impact.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The tactical action officer reported that the aircraft's closest point of approach would be four nautical miles.
  - id: F6
    kind: capability
    status: assessed
    fact: The ship's VHF radio system had experienced intermittent interference during the preceding hour.
  - id: F7
    kind: situation
    status: confirmed
    fact: The TAO instructed the detector-tracker to issue warnings to the Iraqi aircraft.
  - id: F8
    kind: situation
    status: confirmed
    fact: The commanding officer departed the bridge at 20:59 and was absent when the warning was to be transmitted.
  - id: F9
    kind: capability
    status: confirmed
    fact: The close-in weapon system remained in standby mode throughout the entire encounter.
  - id: F10
    kind: authority
    status: confirmed
    fact: The warning transmitted at 21:08 did not adhere to the prescribed wording of the CMEF ROE message.
  - id: F11
    kind: situation
    status: confirmed
    fact: USS STARK was operating in international waters, well outside the declared war zones of Iraq and Iran.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The ROE briefing mandates that any unknown aircraft be informed of the ship's identity and location, and the commander
      is expressly charged with protecting his unit.
  - id: C2
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Radar tracking identified the inbound aircraft as an Iraqi platform with a record of attacking merchant vessels and
      projected a closest approach of four nautical miles, creating an imminent danger.
  - id: C3
    facts:
    - F8
    - F10
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The commander was off-bridge when the warning was sent, and the message did not follow the prescribed CMEF wording,
      indicating a breakdown that must be rectified by issuing the proper warning.
  - id: C4
    facts:
    - F9
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The CIWS remained in standby, depriving the ship of its primary defensive capability; activating it is required under
      self-defence.
  - id: C5
    facts:
    - F3
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The ROE authorises the use of necessary and proportionate force in self-defence, which includes issuing a warning
      and placing defensive systems on alert.
  reasoning:
    read: 'The scenario presents a clear legal and safety imperative: a hostile aircraft is closing, ROE demand a warning,
      and the ship''s defensive posture must be heightened despite the commander''s brief absence.'
    weighing: Strong considerations C1-C5 each cite mandatory ROE language, the known hostile intent, and the need to correct
      the flawed warning. The additional weak consideration C6 highlights communication problems but reinforces the same course.
      The balance therefore unequivocally supports transmitting the correct warning and alerting the CIWS.
    tradecraft: The commanding officer should order the TAO to resend the exact CMEF-prescribed warning, instruct the CIWS
      to move from standby to active alert, and record the actions in the ship's log and after-action report.
    uncertainty: Time constraints are minimal; the ROE provide explicit, non-discretionary steps that outweigh any residual
      uncertainty.
    handoff: The XO and TAO are tasked to execute the warning and defensive posture, with the commander confirming completion
      via secure voice link.
    tempting_wrong:
      option: O1
      pull: The CO's physical absence and a desire to maintain routine operations make ignoring the threat appear convenient.
      why_wrong: Failing to warn violates the ROE and exposes the crew to unnecessary danger.
    rejected:
      O1: Not chosen because it contravenes the explicit ROE requirement to warn unknown aircraft and to take protective measures.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the aircraft had been positively identified as a friendly or neutral platform
      then: O1
      why: If identification removed hostile intent, the ROE warning requirement would not apply.
    would_not_change:
    - id: noflip1
      if: the CO remains absent from the bridge
      why: The ROE places the duty on the commander regardless of his physical location; delegation does not remove the requirement.
    watch_for:
    - id: watch1
      what: any deviation from the CMEF-prescribed warning wording
      favors:
      - O2
      why: Incorrect wording could reduce the warning's effectiveness and increase risk of escalation.
  lesson: When ROE require a warning and defensive readiness against an unknown or hostile aircraft, the commander must ensure
    the prescribed warning is transmitted and defensive systems are placed on alert, even if he is not physically on the bridge.
  limits: This rule applies only when the aircraft is unidentified or hostile; if positive identification confirms a non-threat,
    the warning requirement does not apply. It also does not extend to situations where higher-level authority explicitly
    modifies the ROE.
