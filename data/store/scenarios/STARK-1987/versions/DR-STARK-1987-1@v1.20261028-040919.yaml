case:
  id: DR-STARK-1987-1@v1
  title: Treating Approaching Aircraft as Threat or Routine Transit
  status: draft
  setting: USS STARK, Persian Gulf, 21 February 1987
  decider: the ship's commanding officer
  agent: the commanding officer
  agent_role: decide
  situation: The ship had received a briefing that the probability of a deliberate attack on U.S. warships was low but that
    indiscriminate attacks in the Persian Gulf were a significant danger, and that ships were required to inform unknown aircraft
    of their identity and position. The commander had been briefed earlier that an Iraqi aircraft was operating in the area
    and instructed the tactical action officer to monitor track 2202. Radar video of an unknown aircraft was obtained and
    continuously tracked as it closed on the ship. The tactical action officer requested permission to transmit a standard
    warning, but the lieutenant denied the request. The commander had left the bridge earlier and was not present when the
    aircraft turned toward the ship. A warning was eventually transmitted, but not in the wording prescribed by the rules
    of engagement.
  question: What should the commanding officer do regarding the approaching aircraft—treat it as a potential threat and initiate
    defensive measures, or treat it as a routine transit and continue current operations?
  options:
    O1:
      do: The commanding officer orders the ship to continue routine operations, treating the aircraft as a routine transit
        without issuing a warning or changing defensive posture
      move: act
      irreversible: true
    O2:
      do: The commanding officer orders the ship to treat the approaching aircraft as a potential threat, issues the required
        warning, and places the ship in defensive readiness
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The rules of engagement indicated that the probability of a deliberate attack on U.S. warships was low but that
      indiscriminate attack in the Persian Gulf was a significant danger
  - id: F2
    kind: authority
    status: confirmed
    fact: The rules of engagement required ships to inform unknown aircraft of their identity and position to limit the possibility
      of indiscriminate attack
  - id: F3
    kind: authority
    status: confirmed
    fact: The commander has the right and responsibility to take all possible measures and precautions to protect his unit
  - id: F4
    kind: authority
    status: confirmed
    fact: The commander has the right to use necessary and proportional force in self‑defense against attack or imminent threat
      of attack
  - id: F5
    kind: situation
    status: confirmed
    fact: The commanding officer was briefed about an Iraqi aircraft flying over water heading south and instructed the tactical
      action officer to monitor track 2202
  - id: F6
    kind: situation
    status: confirmed
    fact: At 2055 the commanding officer asked why the combat information center did not have radar video on the Iraqi aircraft,
      prompting a switch to 80 NM radar mode
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The combat information center detected and continuously tracked an unknown aircraft on radar from 2101 until impact
  - id: F8
    kind: authority
    status: confirmed
    fact: The tactical action officer requested permission to transmit a standard warning to the aircraft, but the lieutenant
      responded "No, wait"
  - id: F9
    kind: situation
    status: confirmed
    fact: The commanding officer left the bridge at about 2057 and was not present when the aircraft turned toward the ship
  - id: F10
    kind: situation
    status: confirmed
    fact: At about 2108 a warning was transmitted on the Military Air Distress frequency, but the wording did not conform
      to the prescribed rules of engagement
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The ROE briefed that the probability of a deliberate attack on U.S. warships was low, suggesting the situation did
      not merit an immediate shift to defensive posture.
  - id: C2
    facts:
    - F2
    - F10
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: A warning was transmitted on the Military Air Distress frequency, satisfying the ROE requirement to inform an unknown
      aircraft, even though the wording was not exact; the obligation to warn had therefore been met.
  - id: C3
    facts:
    - F5
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The commander had already been briefed about the Iraqi aircraft and had directed the TAO to monitor track 2202, indicating
      that the command structure was aware and had taken the appropriate monitoring steps.
  - id: C4
    facts:
    - F8
    equity: tempo
    favors:
    - O1
    weight: weak
    why: The lieutenant’s denial of the TAO’s request to issue a standard warning reflected the senior officer’s assessment
      that the contact was not yet an imminent threat.
  - id: C5
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: The ROE also grant the commander the right to use necessary and proportional force in self‑defense; however the source
      judged that the existing information did not rise to the level of an imminent threat.
  reasoning:
    read: The ship was operating in international waters after receiving a briefing that emphasized a low probability of deliberate
      attack but warned of indiscriminate danger. Radar continuously tracked an unknown aircraft that closed to within 4 NM,
      but the commander had left the bridge and the TAO’s request for a standard warning was denied. A warning was later sent,
      albeit with non‑prescribed wording.
    weighing: The source weighed the low‑probability assessment (C1) and the fact that a warning—though imperfect—had been
      transmitted (C2) against the commander’s discretionary authority (C5). Because the ROE did not require an immediate
      defensive posture absent an imminent threat, the balance tipped toward maintaining routine operations (C3, C4).
    tradecraft: The decision was recorded in the ship’s action report and the CO’s after‑action briefing, noting that the
      ROE had been satisfied and that no further defensive measures were ordered.
    uncertainty: Uncertainty remained about the aircraft’s intent until the missile launch, but at the decision point the
      information available did not meet the ROE’s imminent‑threat threshold.
    handoff: The commanding officer acted alone, relying on the TAO’s monitoring and the lieutenant’s judgment; no higher
      authority was consulted because the ROE delegated threat assessment to the ship’s command.
    tempting_wrong:
      option: O2
      pull: The presence of an aircraft known to have previously attacked shipping could have prompted a pre‑emptive defensive
        posture.
      why_wrong: The source concluded that the ROE’s low‑probability assessment and the issuance of a warning, even if imperfect,
        meant that escalating to full defensive readiness was not mandated.
    rejected:
      O2: The commander did not treat the aircraft as a hostile threat because the ROE indicated low likelihood of deliberate
        attack and a warning had already been transmitted.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the aircraft had launched a missile before any warning was transmitted
      then: O2
      why: An actual hostile act would satisfy the ROE’s imminent‑threat condition, obligating defensive measures.
    would_not_change:
    - id: noflip1
      if: the warning had been worded exactly as prescribed but the aircraft still did not respond
      why: The source held that the mere issuance of a proper warning, even without a response, was sufficient under the ROE.
    watch_for:
    - id: watch1
      what: future contacts that change course toward the ship after a warning has been issued
      favors:
      - O2
      why: A change in trajectory after warning indicates hostile intent, triggering the imminent‑threat clause.
  lesson: When the ROE characterizes the likelihood of a deliberate attack as low and a warning has been transmitted, commanders
    may maintain routine operations rather than immediately shift to defensive readiness.
  limits: This rule applies only while the threat assessment remains low and a warning—regardless of exact phrasing—has been
    issued; it does not apply once the aircraft demonstrates hostile intent, such as launching weapons or refusing to alter
    course after warning.
