case:
  id: DR-CORPUS-NX-921731e5-E1@v1
  title: Initial Mission Authorization and Follow-on Review
  status: draft
  setting: 9 October, Special Group (Augmented), Cuba-related decision
  decider: Higher authority
  agent: Higher authority
  agent_role: decide
  situation: On 9 October, the Special Group (Augmented) considered an initial mission. The Special Group agreed that one
    mission should proceed promptly. Further similar missions were contemplated only if the initial mission did not activate
    ground-to-air fire. Higher authority had to decide whether to authorize the initial mission and when to consider any further
    authorization. The results of the initial mission were not yet available.
  question: What should higher authority do about authorizing the initial mission and deciding when to consider further missions?
  options:
    O1:
      do: Higher authority authorizes one initial mission and defers further missions pending results.
      move: act
      irreversible: true
    O2:
      do: Higher authority authorizes the initial mission and further missions without any conditions.
      move: act
      irreversible: true
    O3:
      do: Higher authority declines authorization for both the initial mission and further missions.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Special Group (Augmented) met on 9 October.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Special Group agreed that one initial mission should proceed promptly.
  - id: F3
    kind: situation
    status: assessed
    fact: Further similar missions were contemplated if the initial mission did not activate ground-to-air fire.
  - id: F4
    kind: authority
    status: confirmed
    fact: Higher authority held approval authority over the initial mission.
  - id: F5
    kind: authority
    status: confirmed
    fact: Consideration of further missions was left until the initial mission's results were determined.
  - id: F6
    kind: situation
    status: confirmed
    fact: The initial mission's results were not yet determined at the decision point.
  considerations:
  - id: C1
    facts:
    - F2
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The Special Group agreed that one initial mission should proceed promptly, supporting authorization of that mission
      now.
  - id: C2
    facts:
    - F3
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Further similar missions were contemplated only if the initial mission did not activate ground-to-air fire, which
      weighs against authorizing follow-ons without that condition being assessed.
  - id: C3
    facts:
    - F5
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Higher authority left further consideration until the initial mission's results were determined; those results were
      not yet available.
  reasoning:
    read: 'This is a staged authorization decision, not an all-or-nothing choice: the initial mission could be approved promptly
      while further missions remained for later consideration. The trap is treating support for prompt initial action as support
      for authorizing follow-ons before the stated condition and results can be assessed.'
    weighing: The Special Group's agreement supports proceeding with one mission promptly {C1}. But further missions were
      contemplated only if the initial mission did not activate ground-to-air fire, and higher authority expressly left their
      consideration until the results were determined {C2} {C3}. With those results still unavailable, the balance supports
      O1 rather than blanket authorization or declining both.
    tradecraft: Keep the initial authorization distinct from any later decision on further missions. Record that follow-on
      consideration is deferred pending determination of the initial mission's results and assessment of the stated condition.
    uncertainty: The initial mission's results were not yet determined, so the condition relevant to possible further missions
      remained unresolved.
    handoff: Higher authority held approval authority and made the decision. The Special Group's agreement informed the decision;
      the stated record does not require a separate decision-maker.
    tempting_wrong:
      option: O2
      pull: Prompt action may make it seem efficient to authorize all contemplated missions at once.
      why_wrong: That would decide on further missions before the initial mission's results were determined and without applying
        the stated condition.
    rejected:
      O2: Higher authority did not authorize further missions without conditions; it deferred their consideration until the
        initial mission's results were determined.
      O3: Declining both missions would reject the Special Group's agreement that one initial mission should proceed promptly.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Before the decision, credible information indicated that the initial mission itself would activate ground-to-air
        fire.
      then: O3
      why: That would undermine the basis for proceeding with the initial mission and could warrant declining it.
    would_not_change:
    - id: noflip1
      if: The desire for prompt action remained, but the initial mission's results were still unavailable.
      why: Promptness supports authorizing the initial mission, but does not resolve the stated condition for considering
        further missions.
    watch_for:
    - id: watch1
      what: The initial mission's results, including whether it activated ground-to-air fire.
      favors:
      - O2
      why: Nonactivation was the condition under which further similar missions might be mounted; that evidence would inform
        a subsequent authorization decision, not make unconditional authorization necessary.
  lesson: Separate an urgent, supported initial action from follow-on actions whose justification depends on results not yet
    available. Authorize the first step when warranted, and preserve a genuine later decision point for the stated condition.
  limits: This reasoning applies to the staged decision, where the initial mission was supported but further missions were
    expressly left for later consideration. It does not establish that the same condition or outcome would govern a different
    mission or a different risk assessment.
