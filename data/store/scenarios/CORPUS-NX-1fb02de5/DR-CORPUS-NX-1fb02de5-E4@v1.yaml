case:
  id: DR-CORPUS-NX-1fb02de5-E4@v1
  title: The Oath and the Dossier
  status: draft
  setting: Britain and Australia, 1985; a former MI-5 officer considering publication through an Australian publisher.
  decider: The former MI-5 officer
  agent: The former MI-5 officer
  agent_role: decide
  situation: The former MI-5 officer was considering whether to publish a dossier about British intelligence and security
    services. He was frustrated by his inability to persuade the British Government to act on what he considered continued
    Soviet penetration. The Government and MI-5 had denied him what he regarded as a legitimate pension, and he had no recourse
    under the secrecy arrangements. He had solemnly sworn an oath of secrecy, and the competing view was that an officer must
    not break such an oath. He was also motivated by a desire for revenge and hoped publication would bring enough money to
    keep his stud farm afloat.
  question: What should the former MI-5 officer do about publishing his dossier?
  options:
    O1:
      do: The former MI-5 officer decides to disclose the dossier publicly.
      move: act
      irreversible: true
    O2:
      do: The former MI-5 officer asks independent counsel for advice on publication.
      move: ask
      irreversible: false
      to: independent legal counsel
    O3:
      do: The former MI-5 officer decides to withhold the dossier from publication.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: assessed
    fact: A rigid view held that an officer must not break a solemn oath, and characterized doing so as morally repugnant
      and criminal.
  - id: F2
    kind: situation
    status: confirmed
    fact: The British Government and MI-5 denied the officer what was described as his legitimate pension.
  - id: F3
    kind: situation
    status: confirmed
    fact: The officer had no recourse under the secrecy arrangements in Britain concerning the pension dispute.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The officer considered Soviet penetration of British intelligence and security services to be continuing.
  - id: F5
    kind: situation
    status: assessed
    fact: The officer was frustrated by his failure to persuade the British Government to act on his concerns about Soviet
      penetration.
  - id: F6
    kind: situation
    status: assessed
    fact: The officer was motivated in large part by a desire for vengeance against his former employers over the pension
      dispute.
  - id: F7
    kind: situation
    status: assessed
    fact: The officer hoped publication income would be enough to keep his stud farm afloat.
  - id: F8
    kind: situation
    status: assessed
    fact: The officer had previously received a share of proceeds from another book based on his information and found that
      money gratifying.
  considerations:
  - id: C1
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    - O3
    weight: strong
    why: The rigid view is that an officer must keep a solemn oath of secrecy; breaking it is described as morally repugnant
      and criminal. This weighs heavily against unilateral publication.
  - id: C2
    facts:
    - F2
    - F3
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The Government and MI-5 had denied what the account calls his legitimate pension, while secrecy arrangements left
      him no recourse in Britain. The account presents this as a serious wrong that helps explain his decision to publish.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    - O2
    weight: weak
    why: He believed Soviet penetration continued and had failed to persuade the Government to act. This gives a public-purpose
      rationale for disclosure, but the account does not establish that his assessment was correct or that publication was
      necessary to address it.
  - id: C4
    facts:
    - F6
    - F7
    - F8
    equity: impartiality
    favors:
    - O2
    - O3
    weight: strong
    why: The account says revenge was a large part of his motive and that he hoped book income would keep his stud farm afloat;
      prior proceeds had gratified him. Those personal interests weaken the claim that disclosure was driven only by security
      concerns.
  reasoning:
    read: This is not simply a choice between exposing suspected penetration and protecting secrets. A solemn oath and the
      stated legal and moral objection to breaking it remain in tension with the account's portrayal of a denied legitimate
      pension and no recourse. His security concerns matter, but revenge and financial benefit make it harder to treat publication
      as disinterested public service.
    weighing: The oath weighs strongly against publication {C1}. The pension wrong and lack of recourse, together with his
      frustration over the Government's inaction on suspected penetration, explain why he chose disclosure {C2} {C3}. But
      the account also identifies revenge and financial gain as substantial motives {C4}. The account presents publication
      as his actual course while recording the competing oath-based objection; it does not resolve the legal or ethical conflict
      into an uncontested rule that the grievance justified disclosure.
    tradecraft: Because publication is difficult to reverse, a careful decision process would separate the security concern
      from the pension grievance and personal financial interest, preserve the basis for each, and obtain independent legal
      advice before acting. These are decision safeguards, not steps attributed to the account.
    uncertainty: The excerpt reports Wright's belief about continuing penetration, not an independent finding that the belief
      was correct or that public disclosure was necessary. It describes the oath-based objection as a rigid view and the pension
      as legitimate, but does not supply a final legal ruling on publication.
    handoff: The account does not identify a consultation that resolved the choice. As a decision practice, involving independent
      legal counsel would help assess the oath and legal exposure without treating the pension grievance as authorization
      to disclose.
    tempting_wrong:
      option: O3
      pull: Withholding the dossier appears to honor the oath and avoid the stated legal and moral objection to breaking it.
      why_wrong: It would leave unaddressed the account's stated grievance that he had no recourse over the denied pension
        and his concern that the Government would not act on suspected penetration; the account records that he instead chose
        publication.
    rejected:
      O2: Independent legal advice would have been a prudent intermediate course, but the account recounts that he proceeded
        to publication rather than resolving the conflict through that option.
      O3: Withholding would have honored the oath-based objection, but it was not the course the account presents him as taking
        in response to the grievance and his frustration.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The pension dispute could be pursued through an effective, lawful channel without disclosing the dossier.
      then: O2
      why: A meaningful route to address the grievance would reduce the force of the no-recourse rationale and support obtaining
        advice before any irreversible disclosure.
    - id: flip2
      if: Independent counsel concluded that publication would violate the oath and applicable law, with no lawful basis for
        disclosure.
      then: O3
      why: That conclusion would strengthen the stated legal and moral objection and leave the grievance and financial motives
        insufficient to justify publication.
    would_not_change:
    - id: noflip1
      if: The hoped-for book income were removed from the officer's motives.
      why: That would lessen one personal-interest concern, but the revenge motive, the pension grievance, the unverified
        security concern, and the oath-based objection would remain.
    watch_for:
    - id: watch1
      what: Independent legal advice on the oath, the applicable law, and any lawful avenue to address the pension grievance.
      favors:
      - O2
      - O3
      why: It could clarify whether disclosure is legally permissible and whether a less irreversible route can address the
        wrong.
  lesson: A serious grievance and a sincere security concern can explain disclosure without automatically excusing breach
    of a solemn secrecy obligation. Assess the public-purpose claim separately from retaliation and personal gain, and do
    not confuse an institution's wrong with legal authorization to publish.
  limits: This reasoning is confined to the account's treatment of a former officer's publication decision, stated oath, pension
    grievance, and motives. It does not determine the truth of the alleged penetration, the lawfulness of any particular disclosure,
    or the merits of other whistleblowing or secrecy cases.
  library:
    domain: intel-oversight
    family: CORPUS-NX-1fb02de5
    source: https://www.cia.gov/resources/csi/static/b871c0f81cf1862b6386edc125c5dc93/Of-Moles-and-Molehunters-1.pdf
    episode_focus: The account presents publication as a choice between honoring the oath and disclosing the material, and
      weighs the officer’s grievance over a denied pension and lack of recourse against the legal and moral obligation of
      secrecy. Focus on the disclosure decision and its ethical and legal grounds, not on the book’s operational contents.
    cues:
      option_words:
        O2: 11
        O1: 10
        O3: 11
      real_option: O1
      real_to_mean_other_length: 0.91
      real_is_longest: false
      moves:
        O2: ask
        O1: act
        O3: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: true
        O3: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The account portrays Wright as choosing publication while setting the rigid oath-based condemnation against the wrong
  he suffered and his lack of recourse; it does not present that choice as ethically or legally uncontested.
