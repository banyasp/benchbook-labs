case:
  id: DR-CORPUS-NX-76e6efa4-E2@v1
  title: Authorization Before the Operation
  status: draft
  setting: JWA 18, on the island, before the planned operation; 173rd IBCT command.
  decider: The 173rd IBCT commander
  agent: The 173rd IBCT commander
  agent_role: decide
  situation: Before the planned operation, a SOF team had destroyed an enemy coastal-defense battery. Its destruction allowed
    support ships to approach the island and was the final condition needed for the commander's go decision. The operation
    required a large commitment of planning and sustainment resources, as well as joint coordination involving the 1 ID and
    the nonorganic 173rd IBCT. SOF and conventional Army coordination had been ongoing for days, with a SOF liaison working
    inside the 1 ID tactical command post to synchronize critical details. The commander must decide whether to authorize
    the operation, delay authorization, or decline to authorize it.
  question: What should the 173rd IBCT commander do about authorizing the operation?
  options:
    O1:
      do: The 173rd IBCT commander delays authorization for the operation.
      move: hold
      irreversible: false
    O2:
      do: The 173rd IBCT commander prohibits launch of the operation.
      move: act
      irreversible: true
    O3:
      do: The 173rd IBCT commander permits launch of the operation.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A SOF team had destroyed an enemy coastal-defense battery before the planned operation.
  - id: F2
    kind: capability
    status: confirmed
    fact: The battery's destruction allowed support ships to approach the island.
  - id: F3
    kind: authority
    status: confirmed
    fact: The battery's destruction was the final condition needed for the 173rd IBCT commander's go decision to launch the
      JFEO.
  - id: F4
    kind: situation
    status: confirmed
    fact: The operation required a large commitment of planning and sustainment resources.
  - id: F5
    kind: situation
    status: confirmed
    fact: The 1 ID operation required joint coordination across multiple domains and included the nonorganic 173rd IBCT.
  - id: F6
    kind: situation
    status: confirmed
    fact: SOF and conventional Army coordination had been ongoing for days, with a SOF liaison inside the 1 ID tactical command
      post to synchronize critical details.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Destroying the coastal-defense battery allowed support ships to approach the island, removing a stated operational
      obstacle to the planned operation.
  - id: C2
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The battery's destruction was identified as the final condition needed for the 173rd IBCT commander's go decision.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The operation involved joint coordination, and SOF and conventional Army coordination had been ongoing for days with
      a liaison synchronizing critical details.
  reasoning:
    read: This was the commander's authorization decision after the battery's destruction enabled support ships to approach
      and satisfied the stated final condition for a go decision. The operation was resource-intensive and required joint
      coordination, but those facts alone do not establish that launch was required; the stated rationale centers on the enabling
      effect of the battery's destruction and the commander's go condition.
    weighing: The strongest stated reasons favoring launch are that support ships could approach after the battery was destroyed
      {C1} and that this destruction completed the condition needed for the commander's go decision {C2}. The ongoing coordination
      supports readiness, though more weakly {C3}. The balance depends on the stated go condition having been satisfied; the
      source does not give a separate legal test or discuss other risks.
    tradecraft: As a decision-practice synthesis, record that the commander authorized launch, identify the stated condition
      that had been met, and distinguish that basis from the substantial planning and sustainment commitment. Do not treat
      expenditure or effort already committed as an independent reason to proceed.
    uncertainty: The available account does not describe the commander's deliberation, any competing assessment, or legal
      and civilian-harm analysis. It establishes the stated go condition and outcome, but not a broader risk assessment.
    handoff: The decision is attributed to the 173rd IBCT commander. The account describes coordination through the SOF liaison
      and the 1 ID tactical command post, but does not identify another approving authority.
    tempting_wrong:
      option: O1
      pull: The operation required substantial planning and sustainment resources and coordination across multiple domains,
        which could invite further delay.
      why_wrong: Those demands are part of the situation, but the stated final condition for the go decision had been met,
        and the account records no unresolved coordination issue requiring delay.
    rejected:
      O1: Delay was not chosen because the stated final condition for the commander's go decision had been satisfied.
      O2: Prohibition was not chosen because the battery's destruction enabled support ships to approach and completed the
        stated go condition.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The battery had not been destroyed, so support ships still could not approach and the stated final go condition
        remained unmet.
      then: O1
      why: The central stated basis for the go decision would be absent; delay would preserve the decision until that condition
        was met.
    - id: flip2
      if: Critical details had not been synchronized between SOF and conventional Army forces.
      then: O1
      why: The account identifies synchronization as a purpose of the ongoing coordination; an unresolved gap would weaken
        the readiness basis for immediate authorization.
    would_not_change:
    - id: noflip1
      if: The operation still required a large commitment of planning and sustainment resources.
      why: That commitment is part of the stated context, but by itself it does not undo the enabling effect of the battery's
        destruction or the stated go condition.
    watch_for:
    - id: watch1
      what: Whether critical details remained synchronized across the participating forces.
      favors:
      - O1
      why: An unresolved coordination gap would weaken the stated readiness rationale for immediate authorization.
  lesson: When a commander identifies a condition as necessary for authorization, verify whether that condition has been met
    and make the decision on that basis. Resource commitment and coordination support readiness, but should not substitute
    for the stated authorization rationale.
  limits: This reasoning applies only to the recorded decision and its stated go condition. The account does not establish
    that the operation satisfied any particular legal standard or address civilian risk, alternative intelligence, or other
    possible grounds to delay.
