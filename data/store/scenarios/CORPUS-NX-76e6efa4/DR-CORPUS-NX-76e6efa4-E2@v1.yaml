    episode_focus: The decision point is whether to launch the operation or delay/not launch, given that the battery’s destruction
      enabled support ships to approach and was described as the final condition for the commander’s go decision. Keep the
      focus on the commander’s authorization and stated rationale; exclude the operational details of the assault and follow-on
