case:
  id: DR-CORPUS-NX-b432acaf-E2@v1
  title: Fallujah Offensive Pause
  status: draft
  setting: Fallujah, Iraq, April 2004; Central Command and the Coalition Provisional Authority.
  decider: The commander of Central Command and the director of the Coalition Provisional Authority.
  agent: The commander of Central Command and the director of the Coalition Provisional Authority
  agent_role: decide
  situation: The commander of Central Command and the director of the Coalition Provisional Authority faced growing opposition
    to the operation and estimates that meeting its objectives would take time. They also faced concern about the stability
    of the Iraqi Governing Council and plans for transition to Iraqi sovereignty. Marines had taken about a quarter of the
    outer parts of Fallujah, and offensive operations had resumed on April 11 after an earlier temporary ceasefire. A senior
    Marine commander believed resistance could be broken, a view shared by many Marines. The decision was whether to suspend
    offensive operations, continue them, or maintain a temporary pause.
  question: What should the commander of Central Command and the director of the Coalition Provisional Authority do about
    offensive operations in Fallujah?
  options:
    O1:
      do: The commander and director discontinue all offensive operations in Fallujah for now.
      move: act
      irreversible: false
    O2:
      do: The commander and director pause offensive operations in Fallujah for twenty-four hours.
      move: hold
      irreversible: false
    O3:
      do: The commander and director continue all offensive operations in Fallujah for now.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The operation faced an overwhelming negative narrative and rising opposition.
  - id: F2
    kind: capability
    status: assessed
    fact: Military estimates addressed how much time American forces would need to accomplish the objectives.
  - id: F3
    kind: situation
    status: assessed
    fact: There was concern about the risk of the Iraqi Governing Council collapsing.
  - id: F4
    kind: situation
    status: confirmed
    fact: American plans provided for a transition to Iraqi sovereignty.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Marines had taken about a quarter of the outer parts of Fallujah.
  - id: F6
    kind: situation
    status: confirmed
    fact: On April 9, the Marines were ordered to cease offensive operations and remain in place; they were told the halt
      would be temporary and the ceasefire would last twenty-four hours.
  - id: F7
    kind: situation
    status: confirmed
    fact: On April 11, two Marine units resumed their attacks before a further halt order.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A senior Marine commander believed resistance could be broken and that insurgents were close to destruction because
      they could not receive supplies; many Marines shared the commander’s frustration with the halt decision.
  - id: F9
    kind: authority
    status: confirmed
    fact: The commander of Central Command and the director of the Coalition Provisional Authority held the decision over
      whether to suspend offensive operations.
  considerations:
  - id: C1
    facts:
    - F1
    equity: escalation_control
    favors:
    - O1
    - O2
    weight: strong
    why: The operation faced an overwhelming negative narrative and rising opposition, which the decision-makers treated as
      reasons to suspend offensive operations.
  - id: C2
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    - O2
    weight: weak
    why: Estimates of the time required to accomplish the objectives were among the considerations behind suspending the operation,
      though the source gives no specific estimate or threshold.
  - id: C3
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O1
    - O2
    weight: strong
    why: The risk to the Iraqi Governing Council and the planned transition to Iraqi sovereignty weighed against continuing
      offensive operations.
  - id: C4
    facts:
    - F5
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: A senior Marine commander believed resistance could be broken, and many Marines shared his frustration with the halt;
      the Marines had also made some progress. This was a countervailing view, not the rationale adopted by the decision-makers.
  reasoning:
    read: 'The decision was not simply whether the Marines could make further progress: it also involved growing opposition,
      the estimated time needed for the objectives, the stability of the Iraqi Governing Council, and the transition to Iraqi
      sovereignty. The trap is to let the Marine commander''s confidence that resistance could be broken displace the broader
      political and strategic considerations.'
    weighing: The decision-makers suspended offensive operations because opposition, time estimates, concern about the Governing
      Council, and transition plans together weighed against continuing. The belief that resistance could be broken pulled
      toward continuing, but did not prevail. The balance depended on those wider political and strategic risks, not only
      on the prospect of military progress.
    tradecraft: Make the decision at the level of the competing strategic interests, record which considerations drove the
      suspension, and distinguish those reasons from the contrary military assessment. Do not characterize a suspension as
      a fixed twenty-four-hour pause unless that is the decision actually made.
    uncertainty: The source does not quantify the time estimates, describe how likely Council collapse was, or specify how
      those risks were compared. It records a genuine disagreement about whether continued operations could break resistance.
    handoff: The commander of Central Command and the director of the Coalition Provisional Authority held and jointly made
      this decision; the source identifies no further approval or referral.
    tempting_wrong:
      option: O3
      pull: A senior Marine commander believed resistance could be broken, and many Marines shared his frustration with the
        halt.
      why_wrong: That view addresses the prospect of military success but does not answer the decision-makers' concerns about
        opposition, time, the Governing Council, and the transition to Iraqi sovereignty.
    rejected:
      O2: A defined twenty-four-hour pause would not address the full set of concerns that led the decision-makers to suspend
        offensive operations.
      O3: Continuing offensive operations would give priority to the Marine commander's assessment despite the political,
        timeline, and transition concerns behind the suspension.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Opposition to the operation and the risk to the Iraqi Governing Council were no longer significant, and the sovereignty-transition
        plans no longer weighed against continuing.
      then: O3
      why: Removing the stated political and transition concerns would weaken the principal reasons for suspension and give
        greater weight to the view that resistance could be broken.
    would_not_change:
    - id: noflip1
      if: The senior Marine commander and other Marines remained confident that resistance could be broken, while the stated
        political and transition concerns remained.
      why: That confidence was already present and did not alter the decision to suspend operations.
    watch_for:
    - id: watch1
      what: Whether updated estimates of the time needed to accomplish the objectives materially change the decision-makers'
        assessment.
      favors:
      - O1
      - O2
      - O3
      why: The time estimates were among the stated considerations, but the source does not say what estimate would change
        the balance.
  lesson: A decision about continuing an operation should weigh the prospect of mission success against political opposition,
    time, institutional stability, and transition commitments. A confident operational assessment matters, but it need not
    outweigh broader strategic concerns.
  limits: This reasoning applies to the decision to suspend or continue offensive operations in the stated political and strategic
    circumstances. The source provides no legal standard, detailed estimates, or general rule that suspension is preferable
    in other operations.
