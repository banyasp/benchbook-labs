case:
  id: DR-CORPUS-NX-b432acaf-E1@v1
  title: Authorizing an Offensive Operation on a Compressed Timeline
  status: draft
  setting: Fallujah, early April 2004, U.S. political and Marine command institutions
  decider: Senior political leaders in Washington
  agent: Senior political leaders in Washington
  agent_role: decide
  situation: Blackwater personnel had been killed, and senior political leaders in Washington and U.S. media organizations
    demanded an immediate, public, forceful response. Marine commanders assessed that the killings were intended to provoke
    an aggressive coalition response. They believed a large-scale operation could endanger civilians, send the wrong message,
    and fail to locate those responsible. The division commander wanted time for methodical preparation and a deliberate plan,
    while the Marines had little time for preparation or other military planning. Senior political leaders must decide whether
    to authorize the proposed offensive operation on the seventy-two-hour timeline.
  question: What should the senior political leaders in Washington do about approving the proposed offensive operation on
    the seventy-two-hour timeline?
  options:
    O1:
      do: Senior political leaders approve the proposed offensive operation on the seventy-two-hour timeline.
      move: act
      irreversible: false
    O2:
      do: Senior political leaders reject the proposed offensive operation on the seventy-two-hour timeline.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Blackwater personnel had been murdered.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Marine commanders assessed that insurgent forces intended the event to provoke an aggressive coalition retaliation.
  - id: F3
    kind: situation
    status: confirmed
    fact: Senior political leaders in Washington and U.S. media organizations demanded an immediate, public, and heavy response.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Marine commanders believed a large-scale operation would unnecessarily endanger civilians and send the wrong message.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Marine commanders believed an operation based on revenge would serve insurgent strategic goals and fail to locate
      those responsible for the killings.
  - id: F6
    kind: situation
    status: confirmed
    fact: The division commander wanted time for methodical preparation followed by a deliberate plan to take the city.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Marines had little time for methodical preparation of the city or other steps of the military planning process.
  - id: F8
    kind: situation
    status: confirmed
    fact: The proposed operation's objectives included arresting those responsible for the killings, removing foreign fighters,
      and reopening Highway 10 for military traffic.
  considerations:
  - id: C1
    facts:
    - F3
    equity: tempo
    favors:
    - O1
    weight: weak
    why: Senior political leaders and U.S. media organizations demanded an immediate, public, heavy response, creating pressure
      for action on the proposed timeline.
  - id: C2
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The proposed operation had stated objectives that included arresting those responsible for the killings and reopening
      a military route; those objectives supplied a mission-related purpose for action.
  - id: C3
    facts:
    - F2
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The Marine commanders assessed that an aggressive or revenge-based response would serve insurgent strategic goals
      and fail to locate those responsible.
  - id: C4
    facts:
    - F4
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The Marine commanders believed a large-scale operation would unnecessarily endanger civilians and send the wrong
      message.
  - id: C5
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The division commander wanted methodical preparation and a deliberate plan, but the Marines had little time for preparation
      or other steps of military planning.
  reasoning:
    read: This was a choice about authorizing an operation on a compressed timeline, not simply whether to respond to the
      killings. The trap identified by the Marine commanders was that a forceful response driven by revenge could play into
      the insurgents’ aims while putting civilians at risk and failing to find those responsible.
    weighing: The stated political pressure for an immediate public response and the operation’s mission objectives favored
      proceeding. The Marine commanders’ assessments of civilian danger, insurgent advantage, failure to locate the responsible
      individuals, and inadequate preparation weighed against proceeding on this timeline. Senior political leaders nevertheless
      overrode those objections and directed execution within seventy-two hours; the source records that disagreement rather
      than resolving the competing assessments.
    tradecraft: Before deciding, make the timeline, stated objectives, civilian-risk assessment, and commanders’ objections
      explicit. Record the reasons for overriding or accepting those objections, the uncertainties in the assessments, and
      who made the final authorization decision.
    uncertainty: The source presents insurgent intent and likely civilian harm as the Marine commanders’ assessments, not
      as established outcomes. It does not provide a detailed affirmative explanation from the senior political leaders for
      why the seventy-two-hour timeline outweighed the objections.
    handoff: The decision belongs to the senior political leaders in Washington in this scenario, but it should be informed
      by the Marine commanders responsible for assessing preparation, mission prospects, and civilian risk. Their disagreement
      is material to the decision and should remain visible to the decider.
    tempting_wrong:
      option: O2
      pull: Rejecting the proposed timeline follows the Marine commanders’ warning that haste could endanger civilians, serve
        insurgent aims, and undermine the mission.
      why_wrong: 'It was not the outcome chosen by the senior political leaders: they overrode the commanders’ objections
        and directed the mission within seventy-two hours.'
    rejected:
      O2: The senior political leaders did not reject the proposed operation on the seventy-two-hour timeline; they overrode
        the Marine commanders’ objections and directed execution.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The immediate public-response demand were absent and the decision rested on the concerns described by the Marine
        commanders.
      then: O2
      why: Without the stated pressure for an immediate response, the source-grounded concerns about civilian danger, insurgent
        advantage, mission failure, and inadequate preparation would weigh against approval on this timeline.
    - id: flip2
      if: The decision could wait until the Marines had time for methodical preparation and a deliberate plan.
      then: O2
      why: That would remove the proposed seventy-two-hour timeline as the decision at issue; rejecting approval on that timeline
        would no longer require rejecting a later operation.
    would_not_change:
    - id: noflip1
      if: The listed mission objectives remained the same.
      why: Those objectives provide a mission-related reason to act, but do not by themselves resolve the commanders’ stated
        concerns about timing, civilian risk, and whether the operation would locate those responsible.
    watch_for:
    - id: watch1
      what: Whether fighting spreading to other cities increases pressure for an immediate response.
      favors:
      - O1
      why: Fighting appeared to be spreading to nearby Ramadi, as well as Mosul, Baghdad, and Najaf, which could increase
        pressure to act, though it is not identified as a reason for the seventy-two-hour authorization.
  lesson: A demand for a visible response is not the same as evidence that a rushed operation will achieve its purpose. When
    commanders warn that haste could endanger civilians, serve an adversary’s aims, or undermine the mission, the decision-maker
    should confront and record those risks rather than allow public pressure to stand in for operational justification.
  limits: The source records the political leaders’ decision and the Marine commanders’ objections, but gives little affirmative
    explanation of the leaders’ reasoning beyond the demand for an immediate response. This scenario does not establish whether
    the operation ultimately achieved its objectives or what a later review would conclude.
