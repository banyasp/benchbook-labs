case:
  id: DR-CORPUS-NX-f04801c1-E1@v1
  title: Assessing a Soviet Escapee’s Status
  status: draft
  setting: Investigation of a Soviet escapee at the document-analysis stage; date and institution unspecified.
  decider: The document analysts
  agent: The document analysts
  agent_role: decide
  situation: The document analysts are assessing a Soviet escapee’s status in an investigation. His passport has an unusually
    small space between an abbreviation and its serial number, and the number was added after the document was printed and
    bound. Four signatures in the passport were found to be traced forgeries. A photograph in his military reserve document
    was copied from the passport photograph and cropped. Information in the documents differs from biographical data the escapee
    supplied. The document evidence undermines his account but does not conclusively establish that he is an agent.
  question: What should the document analysts do in assessing the escapee’s account and possible agent status?
  options:
    O1:
      do: The analysts accept the escapee’s account as reliable while treating his status as an agent as unsubstantiated.
      move: act
      irreversible: false
    O2:
      do: The analysts request further corroboration from the investigative team before resolving the account’s reliability
        or the escapee’s agent status.
      move: ask
      irreversible: false
      to: the investigative team
    O3:
      do: The analysts reject the escapee’s account as reliable while leaving his status as an agent unproven.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The passport had abnormally small spacing between the abbreviation “No.” and its serial number.
  - id: F2
    kind: situation
    status: confirmed
    fact: The passport’s serial number had been added after the document was printed and bound, contrary to normal manufacturing
      procedures.
  - id: F3
    kind: situation
    status: confirmed
    fact: Two signatures by each of two officials in the passport were determined by handwriting analysis to be traced forgeries.
  - id: F4
    kind: situation
    status: confirmed
    fact: The photograph in the military reserve document was copied from the passport photograph, enlarged, and cropped.
  - id: F5
    kind: situation
    status: confirmed
    fact: Information in the documents differed from biographical data supplied by the escapee.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The document-analysis results did not conclusively prove that the escapee was an agent.
  - id: F7
    kind: situation
    status: confirmed
    fact: The escapee’s documents and statement were subjected to analysis and evaluation.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The abnormal spacing, post-production addition of the serial number, traced official signatures, and copied-and-cropped
      photograph collectively showed that the documents had not been issued legitimately; the document evidence therefore
      undermined the escapee’s account.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The discrepancies between the documents and the escapee’s biographical account further disproved his general story,
      supporting rejection of the account as reliable.
  - id: C3
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The analysis did not conclusively establish that he was an agent, so the analysts should reject the account without
      treating agent status as proven.
  reasoning:
    read: The evidence establishes serious document irregularities and conflicts with the escapee’s biography, enough to discredit
      his general account but not enough to establish that he was an agent. The trap is to treat evidence undermining his
      story as conclusive proof of agent status—or, in the opposite direction, to treat the absence of such proof as making
      his account reliable.
    weighing: 'The post-production serial number, traced signatures, altered photograph, and biographical discrepancies together
      support rejecting the account as reliable {C1} {C2}. The stated limit is equally important: the document analysis did
      not conclusively prove agent status {C3}. The balance therefore supports {O3}: reject the account while leaving that
      status unproven.'
    tradecraft: 'Record the document findings and biographical discrepancies separately from the conclusion about agent status.
      State both what the evidence establishes—that the documents were not legitimately issued and the general account is
      disproved—and what it does not establish: that the escapee was an agent.'
    uncertainty: The documents and statement were analyzed and evaluated, but the document evidence alone left agent status
      unresolved. That uncertainty limits the status finding; it does not erase the evidence against the account.
    handoff: Make the reliability assessment on the available document evidence, then pass the findings to the investigative
      team for follow-up on agent status. The analysis opens specific lines of investigation but does not conclusively decide
      that status.
    tempting_wrong:
      option: O1
      pull: The analysis did not conclusively prove that the escapee was an agent.
      why_wrong: 'That limit on the agent-status finding does not make the account reliable: the analysis showed that the
        documents were not legitimately issued and disproved the general story.'
    rejected:
      O1: It was not chosen because the document evidence and biographical discrepancies disprove the general account rather
        than support accepting it as reliable.
      O2: It was not chosen because the analysis was sufficient to reject the account’s reliability even though agent status
        remained unproven.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Independent evidence established that the documents were legitimately issued and reconciled the biographical discrepancies
        with the escapee’s account.
      then: O1
      why: That would remove the stated grounds for rejecting the account and could support accepting it while leaving agent
        status unsubstantiated.
    would_not_change:
    - id: noflip1
      if: The document analysis still did not conclusively prove that the escapee was an agent.
      why: That limitation would still not make his account reliable; the analysis showed that the documents were illegitimate
        and the general story was disproved.
    watch_for:
    - id: watch1
      what: An explanation that the photograph was rephotographed because the document needed to show the subject at an earlier
        age or because the subject was unavailable to the forger.
      favors:
      - O2
      why: Rephotographing from another document may be necessary when a forged document must show the person at an earlier
        age or when time, distance, or security considerations make the subject unavailable to the forger. Such an explanation
        could affect the weight of the photograph irregularity, though it would not by itself resolve the other document evidence.
  lesson: Evidence that an account is false does not automatically prove the suspected alternative explanation. State the
    adverse finding the evidence supports, preserve the limits of that finding, and do not let uncertainty about one question
    erase evidence bearing on another.
  limits: This conclusion concerns the reliability of this escapee’s account at the document-analysis stage. It does not determine
    agent status or prescribe later investigative or interrogation measures.
