case:
  id: DR-CORPUS-INC-NICARAGUA-COVERT-ACTION-AND-CONTRA-STRAT-NX-5cbbcf57-E8@v1
  title: Nicaragua Intervention Decision
  status: draft
  setting: Nicaragua and Central America; 1980; U.S. presidential administration
  decider: The President of the United States
  agent: The President of the United States
  agent_role: decide
  situation: In 1980, Nicaragua was governed by a new Marxist government. The U.S. administration and the Joint Chiefs of
    Staff viewed Soviet encroachment in Central America, close to the U.S. homeland, with alarm. The administration was concerned
    about Soviet and Cuban influence in Latin America and Sandinista arms shipments to communist rebels in neighboring El
    Salvador. At the same time, there was strong post-Vietnam aversion to large-scale U.S. military involvement in third-world
    conflicts. The President faced a choice between intervention through covert action and training assistance to a Nicaraguan
    resistance force, and nonintervention.
  question: 'What should the President of the United States do in response to the Sandinista government: authorize covert
    action and resistance training, or decline intervention?'
  options:
    O1:
      do: The President authorizes covert action against the new Nicaraguan government and training assistance to the Nicaraguan
        resistance.
      move: act
      irreversible: false
    O2:
      do: The President declines covert action against the new Nicaraguan government and training assistance to the Nicaraguan
        resistance.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Nicaragua had a new Marxist government.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The U.S. administration and the Joint Chiefs of Staff viewed Soviet encroachment in Central America with alarm.
  - id: F3
    kind: situation
    status: confirmed
    fact: The perceived Soviet encroachment was in Central America close to the U.S. homeland.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The administration viewed Soviet and Cuban influence throughout Latin America as a concern.
  - id: F5
    kind: situation
    status: confirmed
    fact: Sandinista arms shipments were going to communist rebels in neighboring El Salvador.
  - id: F6
    kind: situation
    status: confirmed
    fact: There was strong post-Vietnam aversion to large-scale military involvement in third-world conflicts.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The administration and the Joint Chiefs of Staff viewed Soviet encroachment close to the U.S. homeland with alarm,
      supporting action to address the perceived strategic threat.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The stated aims were to stem Soviet and Cuban influence in Latin America and interdict Sandinista arms shipments
      to communist rebels in neighboring El Salvador.
  - id: C3
    facts:
    - F6
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: Post-Vietnam aversion to large-scale involvement weighed against intervention, although the President authorized
      covert action and resistance training despite that constraint.
  reasoning:
    read: The decision concerned responding to perceived Soviet and Cuban influence and arms shipments, not whether to begin
      large-scale military involvement. The trap is treating post-Vietnam aversion as requiring nonintervention, or treating
      the perceived threat as automatically requiring a broader military commitment; the source records authorization of covert
      action and resistance training.
    weighing: The administration's alarm about Soviet encroachment near the U.S. homeland, together with concern about regional
      influence and arms shipments to rebels in El Salvador, supplied the stated rationale for action. Post-Vietnam aversion
      weighed against large-scale involvement, but did not prevent the President from choosing O1. The balance depends on
      the administration's assessment that these regional concerns warranted action despite that aversion.
    tradecraft: As a decision-practice synthesis, keep the authorization tied to its stated aims and make the rationale and
      scope of the presidential decision clear in the record; do not let the decision silently become a broader commitment.
    uncertainty: The passage gives the administration's assessment and stated aims, but does not quantify the threat, assess
      the likely effectiveness or consequences of the action, or discuss legal authorities and limits.
    handoff: The President made the authorization decision. The Joint Chiefs of Staff shared alarm about Soviet encroachment,
      but the passage does not specify what consultation or additional approval process occurred.
    tempting_wrong:
      option: O2
      pull: Declining intervention avoids acting amid strong post-Vietnam aversion to large-scale involvement.
      why_wrong: The President's recorded choice gave greater weight to stemming Soviet and Cuban influence and interdicting
        arms shipments than to declining all intervention.
    rejected:
      O2: The President did not choose nonintervention, because the stated concerns about regional influence and arms shipments
        led to authorization of covert action and resistance training.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The administration no longer assessed Soviet and Cuban influence or arms shipments to the rebels as a material concern.
      then: O2
      why: The stated reasons for choosing intervention would be substantially weakened.
    would_not_change:
    - id: noflip1
      if: Strong post-Vietnam aversion to large-scale involvement remained present.
      why: That aversion already coexisted with the President's authorization; by itself, it did not determine nonintervention.
    watch_for: []
  lesson: Weigh the stated security and regional-policy concerns against the costs and constraints of intervention, rather
    than treating either as automatically decisive. A choice of intervention despite aversion to large-scale involvement does
    not, by itself, establish support for broader involvement.
  limits: This reasoning reflects the administration's stated assessment in 1980; it does not establish that the threat assessment
    was accurate, that the authorized action was effective, or that it satisfied any particular legal standard. It does not
    support conclusions about later developments or operational methods.
