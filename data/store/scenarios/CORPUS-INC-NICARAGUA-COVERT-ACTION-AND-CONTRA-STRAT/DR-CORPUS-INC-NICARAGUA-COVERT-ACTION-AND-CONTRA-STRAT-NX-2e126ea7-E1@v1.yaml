case:
  id: DR-CORPUS-INC-NICARAGUA-COVERT-ACTION-AND-CONTRA-STRAT-NX-2e126ea7-E1@v1
  title: Choosing a Southern-Front Structure
  status: draft
  setting: Costa Rica and Nicaragua’s southern border, by August 1985; the CIA and other federal agencies.
  decider: CIA officials responsible for the southern front, under CIA headquarters oversight
  agent: CIA officials responsible for the southern front, under CIA headquarters oversight
  agent_role: decide
  situation: By August 1985, U.S. government effort and resources had benefited contra elements on Nicaragua’s northern frontier.
    Federal officials assessed that a viable contra force on the southern border could increase pressure on the Sandinista
    regime. The southern forces were led by an incumbent commander who had significant political support among members of
    the U.S. legislature. The CIA had concerns about the commander’s effectiveness, relations with Costa Rica, security and
    public-relations risks, and alignment with U.S. objectives. The United Nicaraguan Opposition (UNO) was an existing organization
    established to unify elements of the resistance.
  question: 'What should the CIA officials responsible for the southern front do: retain the incumbent-led southern-front
    structure or replace it with an alternative organization aligned with UNO?'
  options:
    O1:
      do: The CIA officials should replace the incumbent-led southern-front structure with an alternative organization aligned
        with UNO.
      move: act
      irreversible: false
    O2:
      do: The CIA officials should retain the incumbent-led southern-front structure as the southern contra organization.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: U.S. government effort and resources had benefited contra elements on Nicaragua’s northern frontier.
  - id: F2
    kind: capability
    status: assessed
    fact: By August 1985, federal officials assessed that a politically and militarily viable contra force on Nicaragua’s
      southern border could increase pressure on the Sandinista regime.
  - id: F3
    kind: situation
    status: confirmed
    fact: Contra forces on Nicaragua’s southern border were commanded by an incumbent leader who enjoyed significant political
      support among members of the U.S. legislature.
  - id: F4
    kind: capability
    status: assessed
    fact: The CIA assessed the incumbent commander as militarily ineffective and unlikely to move his forces out of Costa
      Rica.
  - id: F5
    kind: situation
    status: confirmed
    fact: The incumbent commander’s forces remaining in Costa Rica had produced diplomatic friction between the U.S. and Costa
      Rican governments.
  - id: F6
    kind: intelligence
    status: assessed
    fact: As evidence mounted that Sandinista spies and drug smugglers had penetrated the incumbent commander’s inner circle,
      the CIA assessed him as a security and public-relations risk.
  - id: F7
    kind: situation
    status: assessed
    fact: The CIA viewed the incumbent commander as difficult and opportunistic and as not sharing U.S. objectives for the
      region.
  - id: F8
    kind: capability
    status: confirmed
    fact: UNO was created in 1985 under CIA and State Department auspices to unify elements of the resistance.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Officials sought a politically and militarily viable southern force to increase pressure on the Sandinista regime,
      while the CIA assessed that the incumbent was militarily ineffective and unlikely to move his forces out of Costa Rica.
  - id: C2
    facts:
    - F5
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The incumbent-led forces' continued presence in Costa Rica had caused diplomatic friction with the Costa Rican government.
  - id: C3
    facts:
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: As evidence of penetration by Sandinista spies and drug smugglers mounted, the CIA regarded the incumbent as a security
      and public-relations risk.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The CIA viewed the incumbent as difficult and opportunistic and as not sharing U.S. objectives for the region, weighing
      against relying on him to lead the southern effort.
  - id: C5
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: UNO already existed as an organization created to unify elements of the resistance, providing an available organizational
      basis for the alternative.
  reasoning:
    read: The choice was between preserving a southern-front structure led by a politically supported incumbent and pursuing
      the stronger, more reliable southern force officials believed the broader effort required. The trap is treating the
      incumbent's political support as enough to overcome the CIA's concerns about military effectiveness, relations with
      Costa Rica, security, and alignment with U.S. objectives.
    weighing: The CIA's assessments of ineffectiveness, diplomatic friction, security and public-relations risk, and lack
      of alignment all favored replacing the incumbent-led structure {C1} {C2} {C3} {C4}. The officials' goal of a viable
      southern front and the existence of UNO as a unifying organization supported that alternative {C5}. The balance depends
      on the CIA assessments being reliable and on an alternative organization being capable of advancing the stated objective;
      the passage records the assessments and the decision to pursue the alternative, not proof that every concern was established
      as fact.
    tradecraft: Record which points are assessments and which are established circumstances, including the basis and limits
      of the security concern. Keep the decision rationale focused on the southern-front objective and the stated concerns,
      rather than treating political support alone as dispositive.
    uncertainty: The CIA's judgments about effectiveness, security and public-relations risk, and alignment with U.S. objectives
      were assessments; the evidence of penetration was mounting rather than conclusive. The alternative's eventual effectiveness
      is also unresolved at this decision point.
    handoff: CIA headquarters should retain oversight. Given the diplomatic friction with Costa Rica, appropriate diplomatic
      officials should be involved in assessing that relationship.
    tempting_wrong:
      option: O2
      pull: The incumbent had significant political support among members of Congress.
      why_wrong: That support does not answer the CIA's separate concerns about military effectiveness, the effect on relations
        with Costa Rica, security and public-relations risk, or alignment with U.S. objectives.
    rejected:
      O2: The CIA did not retain the incumbent-led structure because it judged the incumbent ineffective, diplomatically problematic,
        risky, and misaligned with U.S. objectives.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that the incumbent was militarily effective, would move his forces out of Costa Rica, presented
        no material security or public-relations concern, and shared U.S. objectives.
      then: O2
      why: Those changes would substantially remove the stated grounds for replacing the incumbent-led structure.
    - id: flip2
      if: The proposed UNO-aligned alternative could not support a viable southern front, while the incumbent's stated shortcomings
        remained unresolved.
      then: O2
      why: The alternative would no longer advance the objective officials sought, weakening the mission-based case for replacing
        the existing structure.
    would_not_change:
    - id: noflip1
      if: The incumbent retained significant political support among members of Congress, but the CIA's concerns about effectiveness,
        Costa Rican relations, security, and alignment remained.
      why: Political support alone would not resolve the operational and policy concerns that drove the shift.
    watch_for:
    - id: watch1
      what: Whether evidence of hostile or criminal penetration of the incumbent's inner circle is substantiated, reduced,
        or otherwise changes the assessed security and public-relations risk.
      favors:
      - O1
      why: The CIA treated this concern as a reason the incumbent had become a security and public-relations risk.
  lesson: Choose a partner and structure that can plausibly achieve the mission while accounting for security risks, partner
    relationships, and alignment with the stated objectives. Political support is relevant, but it does not by itself resolve
    those concerns.
  limits: This reasoning applies to the choice of southern-front leadership and organization described here, not to the legality
    or merits of later support or operational measures. The source passage does not establish that the alternative ultimately
    achieved the desired military or political results.
