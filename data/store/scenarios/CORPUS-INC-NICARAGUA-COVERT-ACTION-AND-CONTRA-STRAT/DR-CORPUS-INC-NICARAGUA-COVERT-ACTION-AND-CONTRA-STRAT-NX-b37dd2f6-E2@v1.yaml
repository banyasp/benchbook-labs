case:
  id: DR-CORPUS-INC-NICARAGUA-COVERT-ACTION-AND-CONTRA-STRAT-NX-b37dd2f6-E2@v1
  title: Choosing a Southern Front
  status: draft
  setting: Central America, summer 1985, Restricted Interagency Group on Central America
  decider: The Restricted Interagency Group on Central America
  agent: The Restricted Interagency Group on Central America
  agent_role: decide
  situation: By mid-1985, the Restricted Interagency Group on Central America was considering campaign direction in Nicaragua.
    Most contra forces and the focus of American efforts were along Nicaragua’s northern border with Honduras. Their concentration
    made them vulnerable to the Sandinistas and tested the Honduran government’s tolerance. Opposition groups along Nicaragua’s
    southern border were fragmented, and a prior effort by a southern opposition leader to rally them had not established
    confidence that he would drive his forces into Nicaragua. The policy choice concerned whether to open a southern front,
    retain the northern focus, or defer a change in direction.
  question: What should the Restricted Interagency Group on Central America do about campaign direction in Nicaragua?
  options:
    O1:
      do: The RIG defers the southern-front decision and keeps campaign effort focused on northern forces.
      move: hold
      irreversible: false
    O2:
      do: The RIG closes the southern-front proposal and keeps campaign effort focused on northern forces.
      move: act
      irreversible: false
    O3:
      do: The RIG opens a southern front and encourages southern opposition forces to enter Nicaragua.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Most contra forces and the focus of American efforts were along Nicaragua’s northern border with Honduras.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The concentration of contra forces in the north made them an easy target for the Sandinistas.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The concentration of contra forces in the north tested the tolerance of the Honduran government.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The RIG had concluded that the contras needed to increase pressure on the Sandinista regime.
  - id: F5
    kind: intelligence
    status: assessed
    fact: RIG members considered a southern-front offensive a way to relieve pressure on northern forces and escalate the
      war.
  - id: F6
    kind: situation
    status: confirmed
    fact: Anti-Sandinista groups along Nicaragua’s southern border were fragmented.
  - id: F7
    kind: situation
    status: confirmed
    fact: A southern opposition leader had attempted to rally the groups in 1984.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The CIA had concluded that the southern opposition leader was not inclined to drive his forces into Nicaragua.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The northern concentration exposed the forces to Sandinista attack and tested Honduran tolerance; the RIG assessed
      that a southern front could relieve that pressure while escalating the campaign.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The RIG had concluded that the contras needed to increase pressure on the Sandinista regime, a strategic aim the
      southern-front proposal was intended to advance.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: mission_effect
    favors:
    - O1
    - O2
    weight: weak
    why: Fragmented southern groups and the CIA's assessment of the prior leader's reluctance to drive into Nicaragua raised
      doubts about the southern front's ability to deliver the intended campaign effect.
  reasoning:
    read: The RIG faced both a strategic need to increase pressure and a vulnerable northern concentration; the proposed southern
      front offered a way to address both. The trap is treating a fragmented southern opposition as a reason to preserve the
      existing northern focus without weighing the risks already associated with that concentration.
    weighing: The vulnerability of the northern forces and the need to increase pressure favored opening a southern front
      {C1} {C2}. Fragmentation and doubts about the southern leader's willingness to advance were real feasibility concerns
      {C3}, but the RIG's stated strategic judgment was that southern forces needed to enter Nicaragua. The balance therefore
      favored {O3}; it depended on the southern forces being able to contribute enough to relieve pressure and intensify the
      campaign.
    tradecraft: 'Keep the decision and its record at the campaign-direction level: state the strategic purpose, the northern
      risks, and the southern-front feasibility concern. Do not treat this decision as resolving separate operational arrangements.'
    uncertainty: The record establishes the RIG's assessment of the southern groups and leader, but does not establish how
      those groups would perform or how much pressure they could create.
    handoff: The RIG made this campaign-direction decision as a group. The available account does not identify a separate
      authority to whom the choice was referred.
    tempting_wrong:
      option: O1
      pull: Deferring would avoid committing to a southern front while its opposition groups remained fragmented and their
        leadership's willingness was in doubt.
      why_wrong: It would leave the vulnerable northern concentration in place and delay the RIG's stated aim of increasing
        pressure, despite its assessment that a southern front could help address both.
    rejected:
      O1: The RIG did not defer because it concluded that southern opposition forces needed to be moved into Nicaragua to
        relieve pressure in the north and advance the contra cause.
      O2: The RIG did not close the proposal because it viewed a southern front as a means to increase pressure on the Sandinista
        regime.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The RIG no longer assessed that increased pressure on the Sandinista regime was necessary.
      then: O1
      why: Without that stated strategic aim, the case for accepting the uncertainty of a southern front would be substantially
        weaker.
    - id: flip2
      if: The southern opposition forces were assessed as unable or unwilling to enter Nicaragua.
      then: O1
      why: The proposed front could not serve its stated purpose of relieving pressure in the north if forces could not enter
        Nicaragua.
    would_not_change:
    - id: noflip1
      if: The southern groups remained fragmented, without further evidence that they could not contribute to the campaign.
      why: Fragmentation was part of the situation the RIG faced, yet it still decided to pursue the southern front.
    watch_for:
    - id: watch1
      what: Whether southern opposition forces can organize and whether their leadership is willing to drive forces into Nicaragua.
      favors:
      - O1
      why: Those conditions bear directly on whether the proposed front can produce the relief and increased pressure the
        RIG sought.
  lesson: A campaign-direction choice should weigh the risks of the existing concentration against the strategic effects a
    new front is expected to achieve. Feasibility concerns matter, but they should be weighed against the mission need rather
    than treated as an automatic reason to defer or close an option.
  limits: This reasoning addresses only the RIG's campaign-direction choice in the summer of 1985. It does not establish the
    legality, feasibility, or consequences of any particular operational arrangement or later action.
  library:
    domain: operational-command
    family: CORPUS-INC-NICARAGUA-COVERT-ACTION-AND-CONTRA-STRAT
    source: https://irp.fas.org/offdocs/walsh/part_i.htm
