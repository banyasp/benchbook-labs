      option_words:
        O1: 14
        O3: 14
        O2: 14
      real_option: O3
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: hold
        O3: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O3: false
        O2: false
    equities: pilot2
