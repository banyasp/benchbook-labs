case:
  id: DR-CORPUS-NX-26f3cb96-E4@v1
  title: First-Responder Policy for Ongoing Active-Shooter Incidents
  status: draft
  setting: After the Columbine High School attack, U.S. law-enforcement policy on active-shooter response.
  decider: Police department policy leaders
  agent: Police department policy leaders
  agent_role: decide
  situation: Police department policy leaders are considering whether first responders should wait for specialized units during
    an ongoing active-shooter incident. Earlier training for hostage situations emphasized securing the area and attempting
    to negotiate. At Columbine, officers remained outside while awaiting specialized units, though they helped people fleeing
    the building. Emergency calls provided information that a critically wounded teacher was inside; the teacher was not evacuated
    until nearly three hours after being shot and died. At a university in 2007, an attack lasted about three hours, and police
    arrived at the main building after the shooting had ended. School shootings often end before police arrive, but some continue
    for a considerable time.
  question: What should police department policy leaders direct first responders to do during an ongoing active-shooter incident?
  options:
    O1:
      do: Police department policy leaders permit first responders to enter promptly during ongoing active-shooter incidents.
      move: act
      irreversible: false
    O2:
      do: Police department policy leaders prohibit first responders from entering until specialized units arrive.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: At Columbine, police were slow to engage after arriving, and victims were discovered over the next few hours.
  - id: F2
    kind: capability
    status: confirmed
    fact: Prior hostage-situation training called for securing the surrounding area, contacting the kidnappers, and negotiating.
  - id: F3
    kind: situation
    status: confirmed
    fact: The attackers at Columbine had come to kill indiscriminately, leaving no negotiating solution.
  - id: F4
    kind: situation
    status: confirmed
    fact: Police knew through cell phone calls that a teacher was critically wounded and confined in a classroom; the teacher
      was not evacuated until nearly three hours after being shot and had died by then.
  - id: F5
    kind: situation
    status: confirmed
    fact: Officers assisted many people who fled the Columbine building.
  - id: F6
    kind: situation
    status: confirmed
    fact: In 2007, an attack at a university lasted about three hours, killing 32 people and wounding 17.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Police may have been distracted from a later, more deadly confrontation by the earlier discovery of two victims
      in a dormitory.
  - id: F8
    kind: situation
    status: confirmed
    fact: Most school shootings have ended before police arrive, while some have continued for a considerable length of time.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Assailants who begin firing are assessed as unlikely to stop on their own.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The hostage-response approach of securing the area and negotiating did not fit an indiscriminate attack with no negotiating
      solution.
  - id: C2
    facts:
    - F9
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Assailants who begin firing are assessed as unlikely to stop on their own, making prompt action important.
  - id: C3
    facts:
    - F1
    - F4
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: At Columbine, officers waited for specialized units despite information about a critically wounded teacher; he was
      not evacuated for nearly three hours and died.
  - id: C4
    facts:
    - F6
    - F8
    equity: tempo
    favors:
    - O1
    weight: weak
    why: Although most school shootings end before police arrive, some last for a considerable time; the university attack
      is an example of a prolonged incident.
  reasoning:
    read: This is an ongoing active-shooter incident, not a hostage situation in which time can be used to negotiate. The
      trap is applying the familiar containment-and-wait approach when the attackers are killing indiscriminately and victims
      may remain in immediate danger. Officers also helped people fleeing, but that did not address the ongoing threat or
      the wounded teacher left inside.
    weighing: Prompt first-responder action is favored because there was nothing to negotiate, assailants were assessed as
      unlikely to stop once firing began, and delay at Columbine left a critically wounded teacher without timely evacuation
      {C1} {C2} {C3}. The recommended policy is to permit prompt entry during an ongoing attack rather than wait for specialized
      units. Most school shootings end before police arrive, but some continue for a considerable time; the case for prompt
      action applies when the threat is still ongoing {C4}.
    tradecraft: Policy leaders should state clearly that the prior hostage-situation waiting approach does not govern an ongoing
      active-shooter incident. They should ensure the policy and training communicate the decision standard and document its
      adoption and review, without prescribing entry or engagement tactics.
    uncertainty: The account offers case examples and a general assessment, not comparative outcome data or a detailed account
      of risks to responding officers. It supports a policy for ongoing attacks but does not establish that the same response
      applies after the threat has ended.
    handoff: Police department policy leaders should make the policy decision, with input from operational training and legal
      advisers so the policy is usable and consistent with applicable authority. No separate approval process is specified.
    tempting_wrong:
      option: O2
      pull: Waiting for specialized units resembles the earlier hostage-response training to secure the area and negotiate,
        and may appear more cautious.
      why_wrong: In the Columbine circumstances there was no negotiating solution, and delay left people exposed while the
        attack continued and a critically wounded teacher remained inside.
    rejected:
      O2: Waiting for specialized units is not the recommended response to an ongoing attack; first responders should enter
        promptly instead.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: There is a credible negotiating opportunity and no immediate ongoing attack threatening people inside.
      then: O2
      why: The reason for rejecting the earlier approach is that these attackers had come to kill indiscriminately and there
        was nothing to negotiate; removing those conditions would weaken the stated case for immediate entry.
    would_not_change:
    - id: noflip1
      if: Most school shootings end before police arrive.
      why: 'That fact alone would not reverse the recommendation: some attacks continue for a considerable time, and assailants
        who begin firing are assessed as unlikely to stop on their own.'
    watch_for:
    - id: watch1
      what: Whether the attacker has commenced firing and the threat is still ongoing.
      favors:
      - O1
      why: Once assailants commence firing, they are not likely to stop until they run out of ammunition; aggressive immediate
        action is required.
  lesson: Do not apply a negotiation-and-wait framework to an ongoing attack when there is no negotiating solution and people
    remain at risk. The policy judgment is to prioritize prompt first-responder action while the threat continues.
  limits: This reasoning concerns policy for an ongoing active-shooter incident; it does not determine what responders should
    do after the threat has ended. It also does not prescribe how an entry or engagement should be carried out.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-26f3cb96
    source: https://jsouapplicationstorage.blob.core.windows.net/press/302/10-6.pdf
    episode_focus: 'The decision point is the policy shift described after Columbine: whether first responders should wait
      for specialized units or enter promptly to stop an ongoing active shooter. Consider the stated risks to victims and
      the absence of a negotiating solution; exclude tactical instructions for carrying out an entry or engagement.'
    cues:
      option_words:
        O1: 14
        O2: 13
      real_option: O1
      real_to_mean_other_length: 1.08
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The report's account of post-Columbine policy presents the new concept as first responders entering as quickly as possible
  during an active-shooter incident, with speed and aggressive action becoming the new norm.
