case:
  id: DR-CORPUS-NX-9c56d598-E1@v1
  title: Kuwaiti Tanker Protection Request
  status: draft
  setting: The Gulf, spring 1987, U.S. government
  decider: The Reagan administration
  agent: The Reagan administration
  agent_role: decide
  situation: By spring 1987, Kuwait had asked Moscow to protect its tankers, and the U.S. government was seriously considering
    a similar request. Iran regarded Kuwait as nearly a co-belligerent with Iraq, citing Kuwait’s economic aid and its willingness
    to let its ports serve as primary points for arms transshipments to Iraq. Tehran viewed U.S. assistance to Kuwait as potentially
    widening the war, shifting the balance toward Iraq, and increasing U.S. naval presence in the Gulf. The Reagan administration
    weighed whether to provide protection amid its interests in freedom of navigation, keeping Soviet forces out of the region,
    supporting GCC allies, and its broader tilt toward Iraq.
  question: What should the Reagan administration do in response to Kuwait’s request for protection of its tankers?
  options:
    O1:
      do: The Reagan administration rejects Kuwait’s request and provides no protection for Kuwaiti tankers.
      move: act
      irreversible: false
    O2:
      do: The Reagan administration approves Kuwait’s request and provides protection for Kuwaiti tankers.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Kuwait asked Moscow to protect its tankers in December 1986.
  - id: F2
    kind: situation
    status: confirmed
    fact: The U.S. government seriously began considering a similar request by spring 1987.
  - id: F3
    kind: situation
    status: confirmed
    fact: Kuwait was providing economic aid to Iraq and was willing to let its ports serve as primary points for arms transshipments
      to Iraq.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Iran perceived Kuwait as nearly a co-belligerent with Iraq.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Tehran viewed U.S. assistance to Kuwait as widening the war, tilting the balance toward Iraq, and sharply increasing
      U.S. naval presence in the Gulf.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Reagan administration preferred to keep Soviet forces out of the region.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Reagan administration had a principled commitment to freedom of navigation.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Reagan administration sought to buttress its credentials with GCC allies after the Iran-Contra affair in 1986.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Reagan administration had a broader tilt in favor of Iraq in its war with Iran.
  considerations:
  - id: C1
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The administration had a principled commitment to freedom of navigation, which supported protecting the tankers.
  - id: C2
    facts:
    - F1
    - F6
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: Kuwait had asked Moscow for protection, and keeping Soviet forces out of the region was an administration priority;
      U.S. protection served that purpose.
  - id: C3
    facts:
    - F8
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: Protecting Kuwait would help the administration buttress its credentials with GCC allies after the Iran-Contra affair.
  - id: C4
    facts:
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The administration's broader tilt toward Iraq also favored protecting Kuwait, which it regarded as supporting Iraq.
  - id: C5
    facts:
    - F3
    - F4
    - F5
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Iran regarded Kuwait as nearly a co-belligerent and viewed U.S. protection as potentially widening the war, tilting
      the balance toward Iraq, and sharply increasing U.S. naval presence.
  reasoning:
    read: 'This was not simply a request to protect a neutral trading partner: Kuwait was aiding Iraq, and Iran viewed it
      as nearly a co-belligerent. The trap was that protection could appear to Tehran to widen the war and favor Iraq, while
      declining risked leaving Kuwait''s request to Moscow unanswered and conflicted with U.S. priorities.'
    weighing: The administration was willing to protect the tankers because freedom of navigation, keeping Soviet forces out
      of the region, supporting GCC allies, and its broader tilt toward Iraq all favored O2. Iran's anticipated view of the
      move weighed against protection, but did not displace those stated reasons. The balance depends on the administration's
      continuing commitment to navigation and its judgment that avoiding Soviet involvement and supporting GCC allies justify
      the risk of worsening tensions.
    tradecraft: State the choice and its policy rationale plainly, distinguish the administration's interests from Iran's
      assessment of the consequences, and record the escalation concern rather than presenting the decision as risk-free.
    uncertainty: The stated reasons establish the administration's willingness to protect the tankers but do not specify how
      it assessed or would manage the risk of escalation.
    handoff: The Reagan administration was the decision-maker in this frame. The available reasons do not identify another
      office whose approval or consultation was required.
    tempting_wrong:
      option: O1
      pull: Declining could avoid a move Iran viewed as widening the war and shifting the balance toward Iraq.
      why_wrong: That concern mattered, but declining would give insufficient weight to the administration's stated commitment
        to freedom of navigation, its wish to keep Soviet forces out of the region, and its support for GCC allies.
    rejected:
      O1: The administration did not decline because it was willing to protect Kuwaiti tankers for its navigation, regional,
        alliance, and Iraq-related policy reasons.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The prospect of Soviet forces entering the region ceased to be a concern, and the administration no longer saw navigation
        or GCC support as reasons to protect Kuwait.
      then: O1
      why: The principal stated reasons supporting protection would no longer apply, making the escalation concern more consequential.
    would_not_change:
    - id: noflip1
      if: Iran continued to regard Kuwait as nearly a co-belligerent with Iraq.
      why: That perception was already part of the situation the administration faced and did not erase its stated reasons
        for being willing to protect the tankers.
    watch_for:
    - id: watch1
      what: Whether protection is assessed as likely to widen the war, shift the balance toward Iraq, or sharply increase
        U.S. naval presence.
      favors:
      - O1
      why: Those were the consequences Tehran attributed to U.S. assistance, and they bear directly on the escalation concern.
  lesson: When a protection decision serves several stated policy interests but may be perceived as widening a conflict, weigh
    both the administration's reasons for acting and the foreseeable escalation concern. Do not mistake an adversary's perception
    for the administration's own rationale, but do not omit that perception from the balance.
  limits: This reasoning concerns the spring 1987 decision whether to answer Kuwait's request, not later tactical escort decisions.
    The available reasons do not establish a legal authorization, a detailed escalation assessment, or how protection would
    be carried out.
