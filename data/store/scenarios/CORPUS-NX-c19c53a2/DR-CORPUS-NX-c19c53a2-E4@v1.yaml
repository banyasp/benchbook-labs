case:
  id: DR-CORPUS-NX-c19c53a2-E4@v1
  title: Choosing a Limited Approach to the ISIS Campaign
  status: draft
  setting: Iraq and Syria, the ISIS campaign, U.S. administration during the Obama presidency
  decider: The U.S. administration
  agent: The U.S. administration
  agent_role: decide
  situation: The U.S. administration faced choices about the scale of its military involvement in Iraq and Syria. Airpower
    alone had proved too ineffective, while political risk and sensitivity weighed on decisions about renewed involvement.
    Ground forces were politically sensitive, and a by-with-through approach presented a tradeoff between reducing risk to
    friendly forces and risking mission failure. The campaign had a workable legal mandate, while its rules of engagement
    drew both criticism and praise. The administration anticipated a campaign lasting multiple years, and public outrage constrained
    the military assets initially committed.
  question: What should the U.S. administration do about its military approach to the ISIS campaign in Iraq and Syria?
  options:
    O1:
      do: The U.S. administration rejects a limited approach and commits U.S. ground forces alongside local forces.
      move: act
      irreversible: false
    O2:
      do: The U.S. administration retains airpower alone as its campaign approach against ISIS.
      move: act
      irreversible: false
    O3:
      do: The U.S. administration adopts a limited approach with local forces, coalition training, and air support.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: Exclusive reliance on airpower had proved too ineffective.
  - id: F2
    kind: situation
    status: assessed
    fact: Perceived political risk from renewed involvement in Iraq and Syria strongly influenced decision-making.
  - id: F3
    kind: situation
    status: assessed
    fact: Ground forces were politically deemed too sensitive.
  - id: F4
    kind: capability
    status: assessed
    fact: A by-with-through approach could reduce risk to friendly forces while increasing the risk of not accomplishing the
      mission.
  - id: F5
    kind: authority
    status: assessed
    fact: The combat operations had a solid and workable legal mandate that was not considered a limiting factor.
  - id: F6
    kind: authority
    status: confirmed
    fact: The rules of engagement exceeded the requirements of the Laws of Armed Conflict.
  - id: F7
    kind: situation
    status: assessed
    fact: The rules of engagement were criticized as too restrictive and praised for precision and restraint.
  - id: F8
    kind: situation
    status: assessed
    fact: The administration anticipated that military involvement would need to continue for multiple years.
  - id: F9
    kind: situation
    status: assessed
    fact: Public outrage appeared to permit only a minimum commitment of military assets.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O3
    - O1
    weight: strong
    why: Exclusive airpower had proved too ineffective, so retaining it alone would not address the campaign's demonstrated
      capability limitation. A limited approach using local forces with coalition training and air support was the next serious
      option.
  - id: C2
    facts:
    - F2
    - F3
    equity: escalation_control
    favors:
    - O3
    weight: strong
    why: Perceived political risk strongly influenced the decision, and ground forces were politically sensitive. Those constraints
      favored a limited approach over committing U.S. ground forces alongside local forces.
  - id: C3
    facts:
    - F4
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The by-with-through approach could reduce risk to friendly forces, but the stated tradeoff was increased risk of
      not accomplishing the mission. The source cautions that this approach is unsuitable when existential interests are at
      stake; the record does not identify such interests here.
  - id: C4
    facts:
    - F8
    - F9
    equity: resource_stewardship
    favors:
    - O3
    weight: strong
    why: The administration anticipated a multi-year campaign and committed the minimum military assets that public outrage
      seemed to permit. The source assesses that campaign duration, interests at stake, and perceived public support pushed
      toward a limited approach.
  reasoning:
    read: 'The choice was not between a decisive air campaign and doing nothing: airpower alone had proved too ineffective,
      while renewed U.S. involvement carried perceived political risk and ground forces were politically sensitive. The trap
      is treating the by-with-through approach as a way to reduce force risk without a mission cost; the source expressly
      identifies a greater risk of failing to accomplish the mission.'
    weighing: The demonstrated limits of airpower alone and the political constraints favor O3. The administration also expected
      a long campaign and faced public limits on the assets it could commit. The force-protection benefit of a by-with-through
      approach must be weighed against its mission risk; the source's caution against that approach when existential interests
      are at stake is a material qualification, not a reason it cannot be used in this case. The legal mandate was workable
      and not a limiting factor, while the ROEs' mix of criticism and praise does not itself resolve the strategic choice.
    tradecraft: Record why airpower alone was assessed as inadequate, how political exposure and mission risk were balanced,
      and what assumptions support the limited approach. Keep the legal mandate and ROE review distinct from the strategic
      choice, and revisit the balance if campaign needs, public support, or the assessment of interests changes.
    uncertainty: The levels of perceived political risk and public support, and the mission risk of the limited approach,
      are not quantified; no threshold is established for when mission risk outweighs force protection. The interests at stake
      are not identified as existential.
    handoff: The U.S. administration held the decision. Legal and military advisers could inform its assessment of authority,
      mission risk, and campaign duration, but the source does not identify a required referral or delegated decision-maker.
    tempting_wrong:
      option: O2
      pull: Airpower alone appears to limit political exposure and avoid committing ground forces.
      why_wrong: The source says exclusive reliance on airpower had proved too ineffective, so retaining it alone does not
        address the demonstrated shortcoming.
    rejected:
      O1: The source's account favors limiting involvement because political risk and sensitivity weighed heavily, the campaign
        was expected to last years, and public outrage appeared to permit only a minimum asset commitment.
      O2: Airpower alone was not chosen because it had proved too ineffective; the administration instead relied on local
        forces with coalition training and air support.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The interests at stake were existential.
      then: O1
      why: A by-with-through approach is unsuitable when existential interests are at stake; among the fixed options, committing
        U.S. ground forces is the alternative that increases direct U.S. involvement.
    - id: flip2
      if: Airpower alone were assessed as sufficiently effective to accomplish the mission.
      then: O2
      why: The source's reason for moving beyond airpower alone was its ineffectiveness; removing that assessment would weaken
        the central reason for adopting O3.
    would_not_change:
    - id: noflip1
      if: The ROEs continued to draw both criticism for restrictiveness and praise for precision and restraint, without a
        changed assessment of the campaign approach.
      why: That disagreement concerns the ROEs; the source presents the legal mandate as workable and not limiting, and does
        not make the ROE dispute the basis for abandoning the limited approach.
    watch_for:
    - id: watch1
      what: An absence of quick, tangible results alongside increasing public criticism.
      favors:
      - O1
      why: An absence of quick, tangible results and increasing public criticism contributed to a gradual increase in the
        U.S. military effort, so these conditions could place pressure on the limited commitment.
  lesson: When the least exposed military option has proved inadequate, political sensitivity can make a limited approach
    the viable choice, but reducing risk to friendly forces can increase the risk of mission failure. The balance depends
    on the interests at stake, campaign duration, and the level of public support for sustained commitment.
  limits: This reasoning applies to the stated ISIS campaign decision and its described political and capability constraints.
    It does not establish that a by-with-through approach is appropriate when existential interests are at stake, or when
    the effectiveness of airpower or the political constraints materially differ.
