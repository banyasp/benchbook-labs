case:
  id: DR-CORPUS-NX-4289b5bc-E1@v1
  title: Designing South Africa’s Transitional Amnesty
  status: draft
  setting: South Africa, 1995, Parliament.
  decider: Parliament
  agent: Parliament
  agent_role: decide
  situation: South Africa was emerging from decades of conflict between a minority that controlled state institutions and
    a majority that resisted that domination. The interim Constitution committed the country to transition toward a more just
    and democratic order based on fundamental human rights. Its epilogue connected national unity and reconciliation with
    addressing past violations and directed Parliament to establish an amnesty framework. The framework under consideration
    could make amnesty conditional on full disclosure and a connection to political objectives in the past conflicts. Victims
    and their dependents faced a choice between seeking prosecution and punishment and pursuing a process intended to uncover
    what happened to their loved ones.
  question: What should Parliament do in designing the 1995 amnesty law for qualifying acts associated with the past conflicts?
  options:
    O1:
      do: Parliament should enact a law granting qualifying applicants amnesty after full disclosure for politically associated
        acts in past conflicts.
      move: act
      irreversible: true
    O2:
      do: Parliament should enact a law denying amnesty for politically associated acts in past conflicts and leaving criminal
        and civil liability available.
      move: act
      irreversible: false
    O3:
      do: Parliament should differentiate amnesty eligibility between wrongful acts committed in defense of the old order
        and acts committed in resistance to it.
      move: partial
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: South African history had been dominated for decades by conflict between a minority controlling the political instruments
      of the state and a majority resisting that domination.
  - id: F2
    kind: authority
    status: confirmed
    fact: The interim Constitution committed South Africa to a transition toward a more just, defensible, and democratic political
      order based on fundamental human rights.
  - id: F3
    kind: authority
    status: confirmed
    fact: The constitutional epilogue directed Parliament to adopt a law providing amnesty for acts, omissions, and offenses
      associated with political objectives and committed during the past conflicts, and to set a firm cut-off date after 8
      October 1990 and before 6 December 1993.
  - id: F4
    kind: situation
    status: confirmed
    fact: The contemplated amnesty process required full disclosure of relevant facts and a connection between the act and
      a political objective in the course of the past conflicts.
  - id: F5
    kind: situation
    status: confirmed
    fact: Under the proposed legal framework, a person granted amnesty would not be criminally or civilly liable for the covered
      act, and the state and organizations would not be liable for it.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The applicants alleged that state agents had unlawfully murdered and maimed activists and argued that the wrongdoers
      should be prosecuted and punished.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Records and witnesses concerning past abuses were often inaccessible, unknown, dead, unavailable, or unwilling,
      and survivors' memories could be difficult to corroborate in court.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The amnesty incentive was considered more likely to elicit full disclosure and help victims and dependents learn
      what happened to their loved ones.
  considerations:
  - id: C1
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O3
    - O1
    weight: bar
    why: The constitutional epilogue directs Parliament to provide amnesty for qualifying acts. A law denying amnesty altogether
      would not carry out that direction.
    rules_out:
    - O2
  - id: C2
    facts:
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Because records and witnesses were often unavailable and memories difficult to corroborate, prosecutions might remain
      an abstract possibility without establishing what happened. The amnesty incentive was considered more likely to elicit
      full disclosure and help victims and dependents learn the truth.
  - id: C3
    facts:
    - F6
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The applicants sought prosecution and punishment for grave abuses, and the judgment acknowledged that perpetrators
      deserved punishment. That interest weighs against immunity, even though prosecution without evidence was considered
      an inadequate substitute for disclosure and truth.
  - id: C4
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The constitutional transition aimed at a more just and democratic order, while the epilogue contemplated amnesty
      and the framework conditioned it on full disclosure and a political-objective connection. The Court read the epilogue
      as authorizing comprehensive amnesty, including the associated bar on liability.
  - id: C5
    facts:
    - F1
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Amnesty was part of a constitutional compact intended to advance reconciliation and reconstruction after a conflict
      whose former adversaries would continue to share the same society. This transition was distinguished from a government
      simply granting itself immunity to cover up its own crimes.
  reasoning:
    read: The issue is not whether grave abuses deserved punishment; the judgment accepts that they did. The decision is whether
      Parliament should implement the constitutional transition through a conditional amnesty that could elicit truth, or
      preserve prosecution as the primary response despite the serious obstacles to proving past events. The trap is treating
      a theoretical right to prosecute as equivalent to a realistic prospect of accountability and truth.
    weighing: 'The constitutional epilogue directs an amnesty framework, ruling out denial of amnesty altogether {C1}. The
      judgment gives substantial weight to the victims'' interest in learning what happened: secrecy, missing records, and
      unavailable witnesses could make prosecution unprovable, while an incentive for full disclosure might reveal the truth
      and publicly recognize victims'' wrongs {C2}. The counterweight is real: perpetrators might avoid punishment they deserved
      {C3}. The Court nevertheless concluded that conditional amnesty could better serve reconciliation and reconstruction
      in the circumstances of the transition, and that the Constitution permitted Parliament to choose comprehensive amnesty
      rather than differentiate between sides {C4} {C5}. The balance depends on the constitutional setting, the disclosure
      incentive, and the political-objective qualification—not on a general rule that amnesty is always preferable to prosecution.'
    tradecraft: 'Keep the statutory decision at Parliament''s level: specify the constitutional scope, the political-objective
      connection, the full-disclosure condition, and the cut-off date. Make clear that the framework''s grant of amnesty carries
      the legal consequences Parliament intends, while leaving individual applications to the designated process. This is
      decision-recording guidance, not a further factual finding by the Court.'
    uncertainty: Much of the past was concealed, and survivors' memories could be difficult to corroborate. The truth-producing
      effect of an amnesty is therefore a considered prospect, not a guarantee; nor does the judgment claim that punishment
      lacks value.
    handoff: Parliament decides the framework because the Constitution assigns it that task. The Act's designated amnesty
      process applies the framework to individual applications; those case-specific decisions are outside this scenario.
    tempting_wrong:
      option: O2
      pull: Denying amnesty preserves the possibility of prosecuting and punishing people responsible for murder, torture,
        and other grave abuses.
      why_wrong: The judgment recognizes that punishment is deserved, but concludes that preserving a prosecution right without
        evidence could leave victims without either a successful prosecution or the truth about their loved ones. Denying
        amnesty altogether would also fail to implement the epilogue's direction.
    rejected:
      O2: The Court rejected the constitutional attack on the amnesty provision, and the judgment regarded denial of amnesty
        altogether as inconsistent with the epilogue's direction and less likely to uncover the truth where evidence was unavailable.
      O3: The Court said Parliament could distinguish between acts defending the old order and acts resisting it, but also
        held that Parliament was entitled to choose comprehensive amnesty without that distinction.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If reliable, corroborating evidence made prosecution a realistic means of establishing the truth, rather than an
        abstract possibility,
      then: O3
      why: The judgment's balance depends in part on the evidentiary obstacles and on the amnesty incentive's capacity to
        elicit truth. A stronger prospect of prosecution could support preserving liability or differentiating eligibility,
        although the epilogue would still require an amnesty framework.
    would_not_change:
    - id: noflip1
      if: If applicants relied on the Geneva Conventions' asserted duty to prosecute grave breaches,
      why: The Court said international law did not determine the issue if the Constitution authorized the Act, and found
        the cited conventions did not assist the applicants' case in the circumstances discussed.
    - id: noflip2
      if: If Parliament had the alternative of distinguishing between acts defending the old order and acts resisting it,
      why: The Court expressly said Parliament was entitled to make that distinction but was also entitled to choose comprehensive
        amnesty without it.
    watch_for:
    - id: watch1
      what: Whether the framework requires full disclosure of relevant facts and a connection between the act and a political
        objective in the past conflicts.
      favors:
      - O1
      why: Those conditions define the source's amnesty framework and are central to its justification as a means of eliciting
        truth rather than an unconditional grant of immunity.
  lesson: When a constitutional transition expressly contemplates amnesty, assess it against the practical prospects of obtaining
    truth and reconciliation, not only the abstract availability of prosecution. Conditional amnesty may be justified where
    disclosure is required and the evidence needed for prosecutions is unlikely to be available, but that reasoning is specific
    to the transition and framework at issue.
  limits: This reasoning does not establish a general license to immunize human-rights violations or to use amnesty to conceal
    a government's own crimes. It concerns Parliament's transitional framework, with full-disclosure and political-objective
    conditions, under the interim Constitution's epilogue.
