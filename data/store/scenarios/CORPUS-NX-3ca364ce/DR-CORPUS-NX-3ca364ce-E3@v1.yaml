case:
  id: DR-CORPUS-NX-3ca364ce-E3@v1
  title: Temporary Access Beyond an Operational Area
  status: draft
  setting: At the tactical level, during mission analysis, within a commander's assigned operational area.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: At the tactical level, the Commander has an assigned operational area for planning and conducting operations.
    During mission analysis, the Commander identifies an area of interest and an area of influence. The engagement space generally
    corresponds geographically to the operational area and may extend to the area of influence. A portion of the area of influence
    lies outside the operational area and is assigned to an adjacent command. The Commander is considering temporary access
    to that portion to exploit an opportunity. Coordination with the command assigned that area is part of the boundary decision.
  question: What should the Commander do about temporary access to the part of the area of influence outside the operational
    area, including coordination with the command to which that area is assigned?
  options:
    O1:
      do: The Commander prohibits temporary access beyond the operational area after coordinating with the command assigned
        that area.
      move: act
      irreversible: false
    O2:
      do: The Commander permits temporary access beyond the operational area after coordinating with the command assigned
        that area.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: An area of responsibility is assigned to a commander to plan and conduct operations.
  - id: F2
    kind: situation
    status: confirmed
    fact: An area of responsibility is typically assigned to a commander at the tactical level.
  - id: F3
    kind: situation
    status: confirmed
    fact: Based on mission analysis, the Commander identifies an area of interest and an area of influence.
  - id: F4
    kind: situation
    status: confirmed
    fact: In general, the engagement space geographically equals the operational area and, when larger, the area of influence.
  - id: F5
    kind: situation
    status: confirmed
    fact: The part of the area of influence outside the operational area is off-limits by default.
  - id: F6
    kind: authority
    status: confirmed
    fact: Temporary access to that part of the area of influence may be made available following coordination with the higher
      or adjacent command to which the area is assigned.
  - id: F7
    kind: situation
    status: confirmed
    fact: Reasons for temporary access may include exploiting an opportunity, countering a threat, or reinforcing an adjacent
      command.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The assigned operational area is the commander's area for planning and conducting operations. Even when the engagement
      space extends geographically into the area of influence, its portion outside the operational area remains off-limits
      by default.
  - id: C2
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The doctrine allows temporary access to the outside portion after coordination with the higher or adjacent command
      to which that area is assigned.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Exploiting an opportunity is an expressly identified reason for making temporary access available.
  - id: C4
    facts:
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Identifying an area of interest and area of influence during mission analysis does not itself remove the default
      boundary on access outside the operational area.
  reasoning:
    read: 'The Commander is considering access to an area assigned to another command, outside the Commander''s operational
      area. The trap is treating the area of influence or the broader engagement space as authority to act there: the doctrine
      keeps that portion off-limits by default, while allowing temporary access after coordination.'
    weighing: The default boundary favors prohibiting access {C1}, but it is not an absolute prohibition. The doctrine provides
      a route for temporary access through coordination with the command assigned the area {C2}, and exploiting an opportunity
      is one of its stated reasons for making access available {C3}. On these facts, temporary access after coordination is
      supported; access without that coordination is not.
    tradecraft: Before permitting access, coordinate with the higher or adjacent command to which the portion is assigned.
      Keep the decision temporary and record the coordination and the opportunity that supports the request; do not treat
      the area of influence alone as permission to cross the boundary.
    uncertainty: The doctrine permits access following coordination but does not specify the coordination's form, the terms
      of any arrangement, or criteria for deciding whether a particular opportunity warrants access.
    handoff: The Commander should involve the higher or adjacent command assigned the area because the doctrine makes coordination
      with that command the condition for temporary access.
    tempting_wrong:
      option: O1
      pull: The default is that the area outside the operational area is off-limits.
      why_wrong: 'That default does not foreclose temporary access: the doctrine expressly allows it following coordination,
        including to exploit an opportunity.'
    rejected:
      O1: Prohibiting access despite coordination would disregard the doctrine's allowance for temporary access to exploit
        an opportunity.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Commander has not coordinated with the higher or adjacent command to which the area is assigned.
      then: O1
      why: The doctrine makes coordination a condition of making temporary access available; without it, the default off-limits
        rule governs.
    - id: flip2
      if: There is no opportunity or other stated reason for temporary access.
      then: O1
      why: Absent a reason supporting an exception, the doctrine's default is to keep the area outside the operational area
        off-limits.
    would_not_change:
    - id: noflip1
      if: Mission analysis identifies the area as part of the Commander's area of influence or engagement space.
      why: That geographic relationship does not by itself change the stated default that the portion outside the operational
        area is off-limits.
    watch_for:
    - id: watch1
      what: Whether the higher or adjacent command assigned the area has coordinated temporary access.
      favors:
      - O2
      why: Coordination is the stated condition for making the area temporarily available.
    - id: watch2
      what: Whether the purpose for access is to exploit an opportunity, counter a threat, or reinforce an adjacent command.
      favors:
      - O2
      why: These are the doctrine's examples of reasons for temporary access.
  lesson: Treat an area assigned to another command as off-limits by default, even when it falls within a broader area of
    influence or engagement space. Temporary access may be permitted for a stated operational reason, but only after coordination
    with the command to which the area is assigned.
  limits: This reasoning addresses only the boundary and coordination decision for temporary access outside the operational
    area. It does not establish the terms of coordination or decide what operational activity may occur there.
  library:
    domain: operational-command
    family: CORPUS-NX-3ca364ce
    source: https://assets.publishing.service.gov.uk/media/6964e72799fbdc498faecce2/AJP_3_Ed_D_V1-O.pdf
    episode_focus: The doctrine sets a default of keeping that area off-limits, while allowing temporary access after coordination—for
      example, to exploit an opportunity, counter a threat, or reinforce an adjacent command. Focus on the boundary and coordination
      decision; exclude operational methods for carrying out activity in the area.
