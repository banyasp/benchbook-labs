case:
  id: DR-CORPUS-NX-3ca364ce-E1@v1
  title: Resolving Restrictions on Freedom of Movement
  status: draft
  setting: A NATO operation under its mandate, SOFA and ROE; time and place unspecified.
  decider: The NATO operational commander
  agent: The NATO operational commander
  agent_role: decide
  situation: During a NATO operation, local factions are imposing restrictions on freedom of movement. Freedom of movement
    is essential to the operation, and the mandate, SOFA and ROE should allow NATO forces to perform their duties without
    interference from local groups and organizations. The restrictions call for early detection and swift resolution. The
    policy framework identifies negotiation as the initial approach and allows more resolute action, potentially including
    force, if necessary under the applicable legal framework and ROE.
  question: What should the NATO operational commander do about local restrictions on freedom of movement?
  options:
    O1:
      do: The NATO commander permits force after negotiation if needed under the applicable legal framework and ROE.
      move: act
      irreversible: false
    O2:
      do: The NATO commander prohibits force and pursues negotiation to resolve local movement restrictions.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Freedom of movement is essential for any operation.
  - id: F2
    kind: authority
    status: confirmed
    fact: The mandate, SOFA and ROE should allow NATO forces to perform their duties without interference from local groups
      and organizations.
  - id: F3
    kind: situation
    status: assessed
    fact: Various factions often try to impose local restrictions on freedom of movement.
  - id: F4
    kind: situation
    status: confirmed
    fact: Restrictions on freedom of movement should be detected early.
  - id: F5
    kind: situation
    status: confirmed
    fact: Restrictions on freedom of movement should be resolved swiftly, initially through negotiation.
  - id: F6
    kind: authority
    status: confirmed
    fact: If necessary, resolution may involve more vigorous and resolute action up to and including the use of force.
  - id: F7
    kind: authority
    status: confirmed
    fact: Any use of force must be in accordance with the applicable legal framework and ROE.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Freedom of movement is essential, and the mandate, SOFA and ROE should enable forces to perform their duties without
      interference; the policy therefore supports resolving restrictions rather than accepting them as an enduring constraint.
  - id: C2
    facts:
    - F4
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Restrictions should be detected early and resolved swiftly. O1 preserves negotiation as the initial approach while
      allowing further action if that approach is insufficient.
  - id: C3
    facts:
    - F5
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The stated sequence is negotiation first, followed by more vigorous and resolute action only if necessary; O1 reflects
      that conditional escalation rather than making force the initial response.
  - id: C4
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The policy allows action up to and including force only in accordance with the applicable legal framework and ROE,
      so O1's permission is bounded by those authorities.
  reasoning:
    read: This is a policy choice about resolving restrictions that impede an essential freedom of movement. The trap is to
      read negotiation first as a categorical prohibition on force, or to read permission for force as unconditional.
    weighing: The guidance calls for early detection and swift resolution, beginning with negotiation. If more action is necessary,
      it permits a more vigorous response up to and including force, subject to the applicable legal framework and ROE. That
      staged, bounded approach favors {O1}; the decision to use force depends on whether it is necessary and legally authorized.
    tradecraft: 'Keep the decision at the policy and authority level: identify the restriction, determine whether negotiation
      has resolved it, and confirm that any contemplated escalation is permitted by the applicable legal framework and ROE.
      Record the basis for finding further action necessary and the authority relied on.'
    uncertainty: The guidance does not specify how necessity is assessed in a particular case or what the applicable legal
      framework and ROE authorize. Those matters must be determined from the authorities and circumstances in force at the
      time.
    handoff: The operational commander decides within the mandate, SOFA and ROE. If the applicable authority or legal limits
      are unclear, obtain appropriate legal advice before permitting force; this is a decision safeguard, not an additional
      rule stated in the guidance.
    tempting_wrong:
      option: O2
      pull: Negotiation first can seem to require a categorical prohibition on force.
      why_wrong: That reading omits the stated contingency allowing more resolute action, including force, if necessary and
        consistent with the applicable legal framework and ROE.
    rejected:
      O2: It was not chosen because a categorical prohibition on force omits the guidance's conditional allowance for more
        resolute action when necessary and legally authorized.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The applicable legal framework or ROE does not authorize force in the circumstances.
      then: O2
      why: O1's permission to use force is expressly bounded by legal authority; among the available options, O2 is the closest
        fit when force is not authorized.
    would_not_change:
    - id: noflip1
      if: Negotiation resolves the restrictions without further action.
      why: The staged policy still favors O1 as the governing choice because it permits force only if later necessary and
        authorized; successful negotiation means that contingency is not reached.
    watch_for:
    - id: watch1
      what: Whether negotiation has been insufficient and further action is necessary to resolve the restrictions.
      favors:
      - O1
      why: The guidance allows more resolute action, including force, if necessary, while retaining the legal-framework and
        ROE limits.
  lesson: Treat negotiation as the initial approach, not an absolute ceiling on action. Escalation, including force, is permissible
    only when necessary and within the applicable legal framework and ROE.
  limits: This conclusion concerns the general policy for restrictions on freedom of movement. It does not determine whether
    force is necessary or authorized in any particular circumstances, or prescribe operational methods.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-3ca364ce
    source: https://assets.publishing.service.gov.uk/media/6964e72799fbdc498faecce2/AJP_3_Ed_D_V1-O.pdf
    episode_focus: The doctrine recommends negotiation first and, if necessary, more resolute action up to the use of force,
      subject to the applicable legal framework and rules of engagement. Treat this as a general policy choice about escalation
      and authority; exclude operational methods for restoring movement.
    cues:
      option_words:
        O2: 13
        O1: 16
      real_option: O1
      real_to_mean_other_length: 1.23
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
verdict_tier: source-endorsed
