case:
  id: DR-CORPUS-NX-ca8035b8-E1@v1
  title: Disposition of the Polish Prisoners
  status: draft
  setting: Soviet leadership, 1940, NKVD-held Polish prisoners
  decider: The Soviet leader
  agent: The Soviet leader
  agent_role: decide
  situation: In 1940, Soviet authorities held Polish prisoners in internment camps. The NKVD had completed interrogations,
    and the prisoners had been encouraged to believe they would be released. Their disposition was before senior Soviet leadership,
    with a proposal concerning their fate. They were characterized as enemies of Soviet authority, and the broader political
    aim included preventing the resurgence of an independent Poland. The decision was whether to impose lethal punishment
    or choose another disposition.
  question: What should the Soviet leader do about the Polish prisoners, choosing whether to impose lethal punishment or pursue
    another disposition?
  options:
    O1:
      do: The Soviet leader orders the prisoners spared and released.
      move: act
      irreversible: false
    O2:
      do: The Soviet leader orders the prisoners executed.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Polish prisoners were held in Soviet internment camps.
  - id: F2
    kind: situation
    status: confirmed
    fact: NKVD interrogations were completed around the time the war with Finland ended.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The prisoners were encouraged to believe they would be released, while the interviews functioned as a selection
      process concerning their fate.
  - id: F4
    kind: situation
    status: confirmed
    fact: The prisoners were characterized as hardened and uncompromising enemies of Soviet authority.
  - id: F5
    kind: authority
    status: confirmed
    fact: A proposal concerning the prisoners was submitted to the Soviet leader and senior party officials for a decision.
  - id: F6
    kind: situation
    status: confirmed
    fact: The prisoners included Polish officers, reservists, and people from professions including medicine, law, engineering,
      education, and journalism.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The political aim included preventing the resurgence of an independent Poland by eliminating a substantial part
      of its officer corps.
  considerations:
  - id: C1
    facts:
    - F4
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The prisoners were characterized as hardened and uncompromising enemies of Soviet authority, the stated security
      rationale for treating them as a threat. This characterization does not independently establish that lethal punishment
      was necessary.
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The political aim was to prevent an independent Poland from re-emerging, and eliminating a substantial part of its
      officer corps was presented as serving that aim.
  - id: C3
    facts:
    - F3
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The prisoners had been encouraged to expect release, while the interviews were in fact a selection process concerning
      their fate. The victims included reservists and people from many professions; their social status helped put them before
      execution squads.
  - id: C4
    facts:
    - F5
    - F7
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: The massacre was a criminal act of historic proportions. That judgment weighs against treating the political objective
      or the enemy characterization as sufficient justification for the decision.
  reasoning:
    read: This was a decision about the fate of prisoners after interrogations, not a decision about an immediate battlefield
      threat. The trap is to treat the label enemies of Soviet authority as proof that killing them was necessary, while overlooking
      that the interviews had concealed a selection process and that the stated political aim was to prevent an independent
      Poland from returning.
    weighing: The Soviet leadership's stated rationale combined the characterization of the prisoners as enemies with the
      aim of preventing an independent Poland's resurgence {C1} {C2}. The prisoners' misleading expectation of release and
      the characterization of the massacre as criminal weigh against execution {C3} {C4}. The recorded historical decision
      was O2, but those political rationales explain the choice; they do not make it ethically or legally justified. The balance
      in this account turns on the leadership's political objective, not on a demonstrated need to impose lethal punishment.
    tradecraft: At the decision level, make the actual alternatives explicit, distinguish assessed threats from political
      objectives, and record the authority, reasons, and foreseeable effects of the choice. Do not represent an outcome as
      justified merely because the decision-maker ordered it.
    uncertainty: The available facts identify the political objective and the characterization of the prisoners, but do not
      establish an individualized assessment of danger, a legal analysis, or which alternatives the Soviet leadership considered.
      The prisoners were encouraged to expect release, but what each prisoner was told is not established.
    handoff: 'The Soviet leader and senior party leadership held the decision: the proposal was submitted to them and the
      leader signed the order. No independent reviewer or other office assessing the prisoners'' individual cases is identified.'
    tempting_wrong:
      option: O1
      pull: Sparing and releasing the prisoners would avoid the irreversible killing of people who had been led to expect
        release.
      why_wrong: 'It is ethically compelling, but it was not the course the Soviet leader chose: the signed order imposed
        lethal punishment, and the stated political aim was to prevent an independent Poland''s resurgence.'
    rejected:
      O1: The Soviet leader did not choose sparing and release, prioritizing the stated political aim of eliminating a substantial
        part of the Polish officer corps.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The prisoners were no longer assessed as enemies of Soviet authority and there was no substantiated security concern
        requiring their continued detention.
      then: O1
      why: Without the stated threat rationale, the political aim of preventing Poland's resurgence would not establish an
        individual basis for lethal punishment.
    - id: flip2
      if: The leadership's objective did not include preventing an independent Poland from re-emerging.
      then: O1
      why: That objective is the stated strategic reason for eliminating a substantial part of the officer corps; removing
        it would remove a central rationale for O2.
    would_not_change:
    - id: noflip1
      if: The war with Finland had ended and the Soviet leader wanted to turn attention to Poland and the Baltic countries.
      why: That context explains the timing and wider political setting, but does not itself establish a need to impose lethal
        punishment on the prisoners.
    watch_for:
    - id: watch1
      what: Whether assurances or expectations of release conceal that the decision process is actually determining who will
        live or die.
      favors:
      - O1
      why: The prisoners were encouraged to believe they would be released, while the interviews functioned as a selection
        process concerning who would live and who would die.
  lesson: A security label and a strategic political objective can explain why leaders chose lethal punishment, but explanation
    is not justification. When people are in custody and have been led to expect release, assess the individual basis for
    the decision and confront the irreversible human cost rather than allowing a political aim to substitute for that assessment.
  limits: This reconstruction describes the Soviet leadership's recorded decision and its political rationale; it does not
    establish an applicable legal standard or provide a full evidentiary record of individual cases. The massacre is characterized
    as criminal, so the account should not be read as endorsing O2 as a defensible decision.
