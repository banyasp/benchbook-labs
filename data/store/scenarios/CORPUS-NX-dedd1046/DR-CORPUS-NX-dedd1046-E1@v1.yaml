case:
  id: DR-CORPUS-NX-dedd1046-E1@v1
  title: Briefing a Manuscript Researcher
  status: draft
  setting: In 1951, during private study of the Voynich manuscript; no institution is identified.
  decider: The colleague who introduced the researcher to the manuscript
  agent: The colleague who introduced the researcher to the manuscript
  agent_role: decide
  situation: The colleague introduced the researcher to the Voynich manuscript in 1951. The researcher studied it in spare
    time. The only manuscript portion available to the researcher was its final twenty pages, which contained no illustrations.
    The researcher was given only information about the manuscript contained in a published book. The colleague deliberately
    used the researcher as a control.
  question: What should the colleague who introduced the researcher to the manuscript do about the information and manuscript
    access provided to the researcher?
  options:
    O1:
      do: The colleague discloses all manuscript pages and available information to the researcher, including the illustrated
        portions.
      move: act
      irreversible: false
    O2:
      do: The colleague withholds other manuscript pages and limits information to the published book, while granting access
        to final twenty pages.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The colleague introduced the researcher to the Voynich manuscript in 1951.
  - id: F2
    kind: situation
    status: confirmed
    fact: The researcher spent spare time studying the manuscript.
  - id: F3
    kind: situation
    status: confirmed
    fact: The only manuscript portion available to the researcher was the final twenty pages.
  - id: F4
    kind: situation
    status: confirmed
    fact: The final twenty pages contained no illustrations.
  - id: F5
    kind: situation
    status: confirmed
    fact: The researcher received only information about the manuscript contained in a published book.
  - id: F6
    kind: situation
    status: confirmed
    fact: The colleague deliberately used the researcher as a control.
  considerations:
  - id: C1
    facts:
    - F6
    equity: control_integrity
    favors:
    - O2
    weight: strong
    why: The stated reason for limiting the researcher’s information and access was to use him as a control.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Providing only the information in the published book is consistent with the stated control rationale, although the
      account does not separately explain this particular limit.
  - id: C3
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Limiting access to the final twenty pages, which had no illustrations, is also part of the constrained-access arrangement;
      the account does not give a separate reason for selecting that portion.
  reasoning:
    read: 'This is a choice about the conditions of a private study: the researcher had access only to the final twenty unillustrated
      pages and information in a published book. The stated rationale is that the colleague deliberately used him as a control,
      not that the other material was classified, dangerous, or legally restricted.'
    weighing: The control rationale supports retaining the limits on information and access {C1}. The book-only briefing and
      restricted pages fit that rationale, but the account does not explain their individual significance or establish that
      the control design required precisely those limits {C2} {C3}. On the reasons given, O2 is the supported outcome; the
      balance depends on the control purpose remaining operative.
    tradecraft: As a general decision practice, record the control purpose and the scope of information and access provided,
      without attributing additional reasons for the limits to the colleague. This is a procedural suggestion, not a practice
      stated in the account.
    uncertainty: The account identifies the control purpose but does not explain why the final twenty pages were chosen, why
      they lacked illustrations, or whether any rule governed the access decision.
    handoff: The account identifies the introducing colleague as the decision-maker and names no institution or separate approval
      authority. On these facts, no additional decision-maker is identified as necessary.
    tempting_wrong:
      option: O1
      pull: Full disclosure and access may seem more even-handed to a researcher.
      why_wrong: It would remove the constrained conditions that the colleague deliberately used for the stated control purpose.
    rejected:
      O1: The colleague did not provide full access because the stated decision was to use the researcher as a control under
        limited information and manuscript access.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The control purpose no longer applied to the study.
      then: O1
      why: Without the stated reason for limiting information and access, the account provides no other rationale for withholding
        the remaining material.
    would_not_change:
    - id: noflip1
      if: The researcher preferred broader access, while the control purpose and the decision conditions remained unchanged.
      why: That preference alone would not displace the colleague’s stated reason for maintaining the limited-access arrangement.
    watch_for:
    - id: watch1
      what: Whether the study still requires the researcher to serve as a control.
      favors:
      - O2
      why: The stated rationale for the limited information and access is the control purpose.
  lesson: When a researcher is deliberately used as a control, limits on prior information and access can serve that stated
    purpose. Do not invent additional reasons for those limits, and reconsider them if the control purpose no longer applies.
  limits: The account describes a historical private study and gives no applicable access policy, legal rule, or detailed
    research protocol. This reasoning does not establish that restricted access is appropriate in other settings or for other
    research purposes.
