case:
  id: DR-CORPUS-NX-9f9f32d9-E3@v1
  title: The Houlton Station Dispute
  status: draft
  setting: Houlton and Bar Harbor, Maine; fall 1918; Army and Navy
  decider: The Secretary of War
  agent: The Secretary of War
  agent_role: decide
  situation: In fall 1918, the Secretary of War faced the status of an Army radio station at Houlton, Maine, whose operation
    had been underway for about a week. Government radio operations were under de facto Navy control, while the Army had been
    permitted radio operations for Army purposes. The Navy also operated a radio station at Bar Harbor, and the Houlton site
    was viewed as competition and duplication. At a cabinet meeting, the Secretary of the Navy protested the Army station.
  question: What should the Secretary of War do about whether the Army station at Houlton may continue operating?
  options:
    O1:
      do: The Secretary of War prohibits the Army station at Houlton from continuing operations.
      move: act
      irreversible: false
    O2:
      do: The Secretary of War permits the Army station at Houlton to continue operations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Various government studies and decisions had resulted in the Navy having de facto control of government radio operations
      in the United States.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Army had been permitted to control radio needed for Army purposes.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Army's Houlton site was operating in fall 1918.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Navy operated a radio station at Bar Harbor, Maine.
  - id: F5
    kind: situation
    status: assessed
    fact: The Army's Houlton site was viewed as competing with and duplicating the Navy's Bar Harbor station.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Secretary of the Navy protested the Army station at a cabinet meeting.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Houlton operation had been underway for about a week by November 20, 1918.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Government radio operations were under the Navy’s de facto control, while the Army’s permitted role was radio needed
      for Army purposes. The Secretary of War treated that institutional arrangement as a substantial constraint on continuing
      this Army operation.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The Navy viewed Houlton as competing with and duplicating its Bar Harbor station and protested at a cabinet meeting.
      That interservice conflict was the immediate reason the Secretary of War ordered operations halted.
  - id: C3
    facts:
    - F2
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The Army had been allowed to operate radio for Army purposes, so a demonstrated Army operational need could support
      continuation. Houlton could not easily be said to support Army operations, weakening that basis here.
  reasoning:
    read: 'This was not simply a choice between an effective Army station and no station: the Army’s permission to operate
      radio was tied to Army purposes, while government radio operations were under de facto Navy control and the Navy regarded
      Houlton as duplicative. The trap is treating the Army’s limited permission as a general entitlement to continue any
      operation.'
    weighing: The Navy’s de facto control and its protest, combined with the perceived competition and duplication, favored
      stopping Houlton {C1} {C2}. The Army’s permission to operate for Army purposes could support continuation, but Houlton
      could not easily be said to serve that purpose {C3}. The balance therefore favored the Secretary of War’s order to halt
      operations.
    tradecraft: Carry out the cessation through the established Army chain, communicate the decision and its authority basis
      to the affected Army office, and record that the stated grounds were Navy control, the protest, and the perceived duplication.
      Any later request to resume should identify the Army purpose and address the Navy’s concern.
    uncertainty: The Navy’s control is described as de facto, and it is only presented as possible that the Navy considered
      long-distance transatlantic radio its responsibility; no formal rule resolving every boundary between the services is
      identified. The decision is best understood as a response to the institutional arrangement and protest described, not
      as a general legal prohibition on Army radio operations.
    handoff: The Secretary of War made the decision and directed the Army’s military intelligence office to stop. Given the
      Navy’s cabinet-level protest and the Army office’s operational role, communicating and documenting the decision with
      both services would help make the interservice basis clear.
    tempting_wrong:
      option: O2
      pull: The Army had been permitted to control radio needed for Army purposes, which might suggest that its station could
        continue.
      why_wrong: That permission was purpose-limited, and Houlton was viewed as duplicating the Navy station and could not
        easily be said to support Army operations.
    rejected:
      O2: The Secretary of War did not permit Houlton to continue because the Navy’s de facto control, protest, and concern
        about duplication outweighed the limited Army-purpose basis for the station.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Houlton were shown to be needed for a direct Army purpose, rather than merely operating alongside or duplicating
        the Navy station.
      then: O2
      why: The distinction between Army radio permitted for Army purposes and operations lacking a clear Army operational
        connection could change the balance.
    would_not_change:
    - id: noflip1
      if: The station were merely described as useful in general, without establishing an Army purpose or addressing the Navy’s
        objection.
      why: General usefulness would not resolve the central concerns about Navy control, duplication, and the limited basis
        for Army operations.
    watch_for: []
  lesson: A limited interservice permission should not be treated as authority to act beyond its stated purpose. When another
    service has de facto control and objects to perceived duplication, a decision-maker should resolve the authority and mission
    basis before allowing operations to continue.
  limits: This reasoning concerns the specific interservice arrangement and the Houlton station as described in fall 1918.
    It does not establish that the Navy always controls government radio operations or that Army radio operations are impermissible
    when they serve an Army purpose.
