case:
  id: DR-CORPUS-NX-28118495-E3@v1
  title: Another Operation with the Recovering PRC
  status: draft
  setting: Sherzad, Afghanistan, during the reconstitution of the Nangarhar police force; date unstated.
  decider: The detachment leader
  agent: The detachment leader
  agent_role: decide
  situation: The detachment was advising the Nangarhar police force as it was being reconstituted. The PRC's women police
    officers had demonstrated effective police work. Earlier confidence operations had restored morale, and combat had rebuilt
    trust. The PRC had lost comrades to insurgents in Sherzad. The detachment leader faced a choice about undertaking another
    operation with the recovering PRC, with the stated rationale of restoring confidence and avenging the fallen. Undertaking
    it would expose the detachment and recovering PRC to further risk.
  question: What should the detachment leader do about undertaking another operation with the recovering PRC in Sherzad?
  options:
    O1:
      do: The detachment leader declines a further operation with the recovering PRC.
      move: act
      irreversible: false
    O2:
      do: The detachment leader undertakes a further operation with the recovering PRC.
      move: act
      irreversible: true
    O3:
      do: The detachment leader pauses and requests a readiness assessment from PRC leadership.
      move: ask
      irreversible: false
      to: PRC leadership
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The detachment brought in two military policewomen to work with local women, including at female quarters.
  - id: F2
    kind: capability
    status: assessed
    fact: The PRC brought out women police officers whom the detachment regarded as highly effective and willing to enforce
      standards.
  - id: F3
    kind: situation
    status: assessed
    fact: The detachment's mentorship was assessed as having helped the PRC improve its performance.
  - id: F4
    kind: situation
    status: assessed
    fact: Confidence operations had restored morale, and combat had rebuilt trust.
  - id: F5
    kind: situation
    status: confirmed
    fact: The PRC had lost comrades to insurgents in Sherzad.
  - id: F6
    kind: situation
    status: assessed
    fact: The detachment leader viewed vengeance as a way to cement the PRC's confidence in itself and its advisors.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The detachment leader judged that confidence operations had restored morale and combat had rebuilt trust, but that
      vengeance was needed to cement the PRC's confidence in itself and its advisors.
  - id: C2
    facts:
    - F5
    - F6
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The PRC had lost comrades in Sherzad, and the leader treated confronting those responsible as a way to strengthen
      the PRC's confidence in its advisors as well as in itself.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The PRC's effective officers and improvement through mentorship made sustaining its confidence consequential; this
      supports, but does not independently establish, the case for another operation.
  reasoning:
    read: The detachment leader treated another operation as a means of consolidating the recovering PRC's confidence after
      it had lost comrades. The trap is to treat vengeance as permission for retaliation without limits; the stated rationale
      is confidence, not a license to punish.
    weighing: 'The source''s judgment favors O2: earlier confidence operations restored morale and combat rebuilt trust, but
      the leader believed only vengeance would cement confidence in the PRC and its advisors. The PRC''s losses and demonstrated
      effectiveness add weight to that purpose. The source does not describe a separate assessment of the added risk, so this
      is a recommended balance, not a binding legal conclusion; it depends on the operation remaining lawful and on the asserted
      confidence-building purpose being genuine.'
    tradecraft: Record the confidence-building rationale separately from any desire for retribution, communicate the purpose
      and limits to the PRC, and verify required authority, readiness, and risk controls before acting. Review afterward whether
      the operation strengthened confidence without exceeding its lawful purpose.
    uncertainty: The excerpt gives the leader's rationale and outcome but does not provide a legal-authority analysis, a readiness
      assessment, or a detailed comparison of expected benefits and risks. It therefore supports the endorsed choice but not
      a general rule that vengeance justifies exposing a recovering force to danger.
    handoff: The detachment leader makes the decision, consulting PRC leadership about its willingness and readiness and involving
      any required command or legal review. The excerpt does not establish that decision authority was delegated elsewhere.
    tempting_wrong:
      option: O1
      pull: Declining avoids exposing the recovering PRC and detachment to further risk.
      why_wrong: 'That concern is real, but it does not carry the source''s stated balance: the leader believed prior morale
        and trust gains were insufficient to cement confidence without the further operation.'
    rejected:
      O1: The leader did not decline because the source's stated judgment was that vengeance was needed to cement the PRC's
        confidence.
      O3: The source records the leader proceeding on the stated confidence rationale, not pausing for a readiness assessment.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: PRC leadership indicated that its force was unwilling or not ready to undertake another operation.
      then: O3
      why: The confidence-building rationale would not by itself justify proceeding without the partner force's readiness
        and willingness.
    - id: flip2
      if: A decision-level review found that the operation lacked required authority or would create unjustifiable risk.
      then: O1
      why: The source's confidence rationale would not override a legal bar or a risk that could not be justified.
    would_not_change:
    - id: noflip1
      if: Confidence operations had restored morale and combat had rebuilt trust.
      why: Those gains were already part of the leader's reasoning; the leader still judged vengeance necessary to cement
        confidence.
    watch_for:
    - id: watch1
      what: Whether the PRC's confidence is already secure or whether its leadership considers another operation necessary
        to strengthen it.
      favors:
      - O3
      - O1
      why: If the asserted confidence-building need has diminished, the justification for exposing the recovering force to
        further risk weakens.
  lesson: A source-endorsed morale or partnership objective can support accepting risk, but it does not turn vengeance into
    an independent license for retaliation. Keep the purpose bounded, and reassess if the partner's readiness, lawful authority,
    or risk picture undermines the stated rationale.
  limits: This conclusion reflects the detachment leader's stated judgment in this episode, not a general legal rule about
    revenge or combat operations. The excerpt does not supply enough information to assess the operation's legal authority,
    detailed risks, or alternatives beyond the fixed options.
