case:
  id: DR-XFER-CORPUS-NX-7b45b55b-E3-A@v1
  title: Protecting Infrastructure Against Drones
  status: draft
  setting: United States, present day, Congress considering responsibility for protecting civilian infrastructure against
    hostile drones.
  decider: Congress
  agent: Congress
  agent_role: decide
  situation: An executive directive assigned the military's northern command a lead role in protecting civilian infrastructure,
    including power plants and stadiums, against hostile drones. It also directed the command to review other departments'
    counter-drone programs and budgets. The sponsoring member of Congress distrusts the military's role in domestic security
    and describes its influence as politically unhealthy and potentially dangerous. The Department of Homeland Security and
    the command both already work on the problem. Congress is considering whether to retain the command's lead or place the
    Department of Homeland Security in the lead while it works with the command.
  question: What should Congress do about whether the northern command should retain the lead or the Department of Homeland
    Security should lead civilian infrastructure protection against hostile drones?
  options:
    O1:
      do: Congress retains the lead for civilian infrastructure protection against hostile drones in the military's northern
        command.
      move: act
      irreversible: false
    O2:
      do: Congress transfers the lead for civilian infrastructure protection against hostile drones to the Department of Homeland
        Security, working with the northern command.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The executive directive assigned the military's northern command the lead responsibility for protecting civilian
      infrastructure against hostile drones.
  - id: F2
    kind: authority
    status: confirmed
    fact: The directive tasked the northern command with reviewing other departments' counter-drone programs and budgets.
  - id: F3
    kind: situation
    status: assessed
    fact: The sponsoring member of Congress distrusts the command's role in domestic counter-drone policy.
  - id: F4
    kind: situation
    status: assessed
    fact: The sponsoring member characterizes military influence over domestic security as politically unhealthy and potentially
      dangerous.
  - id: F5
    kind: authority
    status: confirmed
    fact: Congress is considering which federal body should lead protection of civilian infrastructure against hostile drones.
  - id: F6
    kind: capability
    status: confirmed
    fact: The Department of Homeland Security and the northern command both already work on protecting civilian infrastructure
      against hostile drones.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The command's authority over infrastructure protection extends to reviewing other departments' counter-drone programs
      and budgets; the sponsoring member distrusts the command's role.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The sponsoring member judges military influence over domestic security politically unhealthy and potentially dangerous,
      supporting civilian-department leadership.
  - id: C3
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Both the Department of Homeland Security and the command already work on the problem, allowing a civilian lead to
      work with the command rather than excluding it from collaboration.
  reasoning:
    read: 'This is a choice about who leads protection of civilian infrastructure against hostile drones, not whether the
      northern command has any role: O2 places leadership with the Department of Homeland Security while it works with the
      command. The trap is treating the choice as either retaining the command''s broad responsibility or excluding the command
      altogether.'
    weighing: The stated concern is that the directive gives the command broad responsibility, including review of other departments'
      programs and budgets, and that this represents politically unhealthy and potentially dangerous military influence in
      domestic security. Department of Homeland Security leadership addresses that concern while preserving work with the
      command. The source supplies no comparison of the bodies' security performance; the balance rests on the stated concern
      about military influence and the available division of responsibility.
    tradecraft: 'Keep the decision at the level of institutional responsibility: record the Department of Homeland Security
      as lead and the command as a collaborator. Do not turn this allocation decision into a judgment about technical standards
      or security procedures.'
    uncertainty: The source gives the political concern and the existing involvement of both bodies, but does not assess their
      comparative capabilities or the security effects of either arrangement.
    handoff: Congress makes the allocation decision; the Department of Homeland Security and the command have roles in carrying
      out the chosen arrangement.
    tempting_wrong:
      option: O1
      pull: The executive directive already placed broad responsibility with the command.
      why_wrong: Retaining that arrangement leaves in place the broad military role that the sponsoring member criticized,
        whereas Department of Homeland Security leadership allows the command to remain involved in the work.
    rejected:
      O1: Congress does not retain the command's broad lead; transferring leadership to the Department of Homeland Security
        while it works with the command addresses the concern about military influence without excluding the command.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C3
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Congress had evidence that the Department of Homeland Security could not responsibly lead protection of civilian
        infrastructure against hostile drones and that the command was the only workable lead.
      then: O1
      why: That evidence could outweigh the concern about broad military responsibility by making command leadership necessary
        to the protection mission.
    would_not_change:
    - id: noflip1
      if: The command remains involved through the Department of Homeland Security's work with it.
      why: Command participation in collaboration is compatible with civilian-department leadership; it does not by itself
        justify retaining the command's broad lead.
    watch_for:
    - id: watch1
      what: Whether the Department of Homeland Security works with the command as the arrangement requires.
      favors:
      - O2
      why: The allocation combines civilian-department leadership with continued command collaboration.
  lesson: When a policy concern is about an agency's breadth of authority, distinguish transferring leadership from excluding
    that agency entirely. An allocation that addresses the concern while preserving collaboration can be preferable to simply
    retaining the existing broad mandate.
  limits: This reasoning applies to the choice over civilian infrastructure protection against hostile drones, not to comparative
    technical capabilities or the merits of particular standards or security procedures. It does not establish that Department
    of Homeland Security leadership is preferable where the governing framework or decision facts differ.
  library:
    domain: homeland security
    family: XFER-CORPUS-NX-7b45b55b
