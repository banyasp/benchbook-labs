case:
  id: DR-CORPUS-NX-eb2459d0-E1@v1
  title: 'Prisoners: Execute or Seek Information'
  status: draft
  setting: At an unspecified place and time, during Division operations.
  decider: The subordinate
  agent: The subordinate
  agent_role: decide
  situation: The subordinate held two prisoners who had been captured sniping in civilian clothes. A commander of the Division
    encountered them and directed the subordinate to shoot them. The subordinate believed that speaking with them might yield
    information about who organized the sniping. The decision was whether to execute the prisoners or seek information from
    them.
  question: What should the subordinate do with the two prisoners after the Division commander directs their execution?
  options:
    O1:
      do: The subordinate spares both captured prisoners, questioning them.
      move: act
      irreversible: false
    O2:
      do: The subordinate executes both captured prisoners without questioning them.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The subordinate held two men as prisoners.
  - id: F2
    kind: situation
    status: confirmed
    fact: The prisoners had been captured sniping.
  - id: F3
    kind: situation
    status: confirmed
    fact: The prisoners were captured in civilian clothes.
  - id: F4
    kind: authority
    status: confirmed
    fact: The commander commanded the Division.
  - id: F5
    kind: authority
    status: confirmed
    fact: The commander directed the subordinate to shoot the prisoners.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The subordinate believed that speaking with the prisoners might yield information.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The Division commander directed execution, creating a command-based pull toward O2. The order did not end the subordinate’s
      choice.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The subordinate’s stated reason for asking to speak with the prisoners was that they might identify who organized
      the sniping.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The subordinate told the prisoners that their conduct violated the Geneva Convention and that penalties were unknown;
      he did not identify execution as an established penalty. This is only a limited procedural signal, not a stated legal
      finding.
  reasoning:
    read: 'The subordinate faced a direct execution order while holding two prisoners captured sniping in civilian clothes.
      The trap is to treat the commander’s order as if it ended the decision: the subordinate proposed speaking with them,
      and the commander allowed it.'
    weighing: The order creates a pull toward O2 {C1}, but the subordinate’s stated reason for choosing O1 was the prospect
      of learning who organized the sniping {C2}. The applicable penalty remains unclear {C3}; no legal rule about the prisoners’
      status or penalty is established here. The choice therefore turns on the prospect of useful information, not on a developed
      legal analysis.
    tradecraft: At decision level, make the proposed alternative and the commander’s response explicit, and record the stated
      reason for choosing it. Do not infer a legal determination or a penalty from the subordinate’s statement to the prisoners.
    uncertainty: The account does not specify the legal status determination, what penalties applied, or whether any independent
      legal review occurred. It gives the subordinate’s belief that speaking with the prisoners might produce useful information,
      not an assessment of how likely or urgent that was.
    handoff: The subordinate raised his proposed course with the Division commander, who permitted him to proceed. No other
      consultation is described; the account does not establish whether further review was available or required.
    tempting_wrong:
      option: O2
      pull: The commander directly ordered the subordinate to shoot the prisoners.
      why_wrong: 'The subordinate did not treat the order as ending the choice: he proposed questioning them for information,
        and the commander allowed that alternative.'
    rejected:
      O2: The subordinate did not execute the prisoners because he chose to seek information he believed they might provide.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: There were no prospect of obtaining useful information and no other reason to spare the prisoners.
      then: O2
      why: The subordinate’s stated reason for choosing O1 would be absent; this would alter that rationale, not establish
        that execution was lawful.
    would_not_change:
    - id: noflip1
      if: The commander’s personal temperament were different, while the order and the prospect of information remained the
        same.
      why: The subordinate’s stated reason for his choice was the prospect of information, not the commander’s temperament.
    watch_for:
    - id: watch1
      what: Whether there is a credible prospect that speaking with the prisoners will yield useful information.
      favors:
      - O1
      why: That prospect is the subordinate’s stated reason for choosing to speak with them.
  lesson: A direct order does not, by itself, erase the subordinate’s role in choosing among available courses; here, the
    subordinate proposed an alternative and the commander permitted it. State the actual reason for the choice, and do not
    turn an uncertain legal reference into a legal conclusion.
  limits: This reasoning reflects the subordinate’s account of this decision and its stated intelligence rationale. It does
    not determine the prisoners’ legal status, the applicable penalties, or what law required in other circumstances.
  library:
    domain: military-operational
    family: CORPUS-NX-eb2459d0
    source: https://www.cia.gov/resources/csi/static/8a36e5a89da1163ca3d1a1de04bff0de/Thirtyfive-Years-in-Intelligence.pdf
    episode_focus: The decision point is the subordinate’s choice between executing the prisoners and seeking information
      from them; he gave the prospect of learning who organized the sniping as his reason. Exclude the subsequent capture
      operation and any tactical details.
