case:
  id: DR-CORPUS-NX-1772b42a-E2@v1
  title: Counterattack Near the Command Position
  status: draft
  setting: October 9, Hadrut, Nagorno-Karabakh; Azerbaijani joint task force.
  decider: The joint task force deputy commander
  agent: The joint task force deputy commander
  agent_role: decide
  situation: The deputy commander had established a command post in western Hadrut. Armenian reinforcements arrived from the
    north, and Armenian forces counterattacked toward the town. The counterattack reached close to the deputy commander's
    position, creating an immediate threat to it. Azerbaijani forces in Hadrut were heavily outnumbered and their forces were
    spread across separate positions. Losing Hadrut could open a route for Azerbaijani forces toward the center of Nagorno-Karabakh.
  question: What should the joint task force deputy commander do when a counterattacking force poses an immediate threat to
    the command position and Azerbaijani control of Hadrut?
  options:
    O1:
      do: The deputy commander authorizes engagement of the counterattacking force.
      move: act
      irreversible: true
    O2:
      do: The deputy commander prohibits engagement of the counterattacking force.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On October 9, the joint task force deputy commander established a command post in western Hadrut.
  - id: F2
    kind: situation
    status: confirmed
    fact: An Armenian motorized infantry battalion came over the mountain pass north of Hadrut and continued into the town.
  - id: F3
    kind: situation
    status: confirmed
    fact: Armenian forces counterattacked and reached close to the deputy commander's position.
  - id: F4
    kind: situation
    status: confirmed
    fact: The counterattack posed an immediate threat to the command position.
  - id: F5
    kind: intelligence
    status: assessed
    fact: At least one Armenian soldier described Azerbaijani forces within Hadrut as outnumbered ten to one.
  - id: F6
    kind: situation
    status: assessed
    fact: Azerbaijani forces were spread across separate positions in Hadrut and on Mount Ergunash.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The loss of Hadrut could open a route for Azerbaijani forces toward the center of Nagorno-Karabakh.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The counterattack reached close to the commander's position and posed an immediate threat; the attackers were held
      off.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Azerbaijani forces were assessed to be heavily outnumbered and spread across separate positions, leaving them vulnerable
      to a breakthrough.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Losing Hadrut could open a route toward the center of Nagorno-Karabakh, increasing the operational stakes of stopping
      the counterattack.
  reasoning:
    read: 'This was a defensive decision under immediate pressure on the command position, with Azerbaijani forces also vulnerable
      because they were outnumbered and separated. The trap is to treat the choice as only a question of preserving the command
      post: control of Hadrut was also connected to the wider route toward the center of Nagorno-Karabakh. The account provides
      no assessment of civilian presence or other potential harm from engagement.'
    weighing: The immediate threat, the precarious disposition of Azerbaijani forces, and the potential consequence of losing
      Hadrut all favor authorizing engagement. The account assesses that the response held the counterattack off and that
      the ability to deliver supporting action was decisive in preventing a breakthrough. This balance depends on the threat
      being immediate and on the assessed stakes of losing the town; no separate legal or civilian-harm analysis is provided.
    tradecraft: Confirm the threat and the decision-maker's authority as circumstances permit, make the decision promptly
      enough to address the immediate danger, and record the threat assessment, mission stakes, authority relied on, and any
      material uncertainty. Do not treat this outcome as a substitute for applying the rules and legal requirements governing
      the actual situation.
    uncertainty: The ten-to-one estimate is attributed to at least one Armenian soldier, and no fuller assessment is provided
      of force strength, civilian presence, engagement risks, or applicable rules of engagement. The account also does not
      describe whether another timely course was available.
    handoff: The deputy commander made the decision in the account. No separate approval or consultation is identified; if
      time permits, confirm authority through the command chain, but do not assume that a required handoff is established.
    tempting_wrong:
      option: O2
      pull: Prohibiting engagement may seem to avoid escalation and the risks inherent in using force.
      why_wrong: That would leave an immediate threat to the command position and a vulnerable force unaddressed, despite
        the broader consequence that losing Hadrut could open a route toward the center of Nagorno-Karabakh.
    rejected:
      O2: The immediate counterattack threatened the command position, Azerbaijani forces were vulnerable, and losing Hadrut
        carried wider operational consequences.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The counterattacking force no longer posed an immediate threat to the command position or control of Hadrut.
      then: O2
      why: Without the immediate threat that drove the decision, the central reason for authorizing engagement would be substantially
        weakened.
    - id: flip2
      if: Reliable information established that engagement would unlawfully endanger civilians or protected persons.
      then: O2
      why: That would introduce a serious legal and humanitarian constraint requiring the commander to reconsider engagement.
    would_not_change:
    - id: noflip1
      if: The assessed strategic importance of Hadrut were lower, but the immediate threat to the command position and force
        vulnerability remained.
      why: The strategic rationale would be reduced, but the immediate defensive rationale would still favor O1.
    watch_for:
    - id: watch1
      what: Whether the counterattack remains an immediate threat as circumstances develop.
      favors:
      - O2
      why: A material reduction in the immediate threat would weaken the principal reason for engagement.
    - id: watch2
      what: Credible information about civilians, protected persons, or other legal constraints on engagement.
      favors:
      - O2
      why: Such information could materially constrain the decision.
  lesson: When a force faces an immediate threat to its command position and mission, weigh that danger alongside the broader
    consequences of losing control of the objective. A favorable operational balance does not replace the need to verify authority
    and account for legal and humanitarian constraints.
  limits: This reasoning applies to the account of an immediate counterattack and a threatened command position. It does not
    establish that engagement is lawful in other circumstances or supply the missing facts about civilian risk, rules of engagement,
    or available alternatives.
