case:
  id: DR-CORPUS-NX-1772b42a-E1@v1
  title: Organizing the Hadrut Force
  status: draft
  setting: Hadrut operation; Azerbaijani Southern Group command.
  decider: The Azerbaijani Southern Group command
  agent: The Azerbaijani Southern Group command
  agent_role: decide
  situation: The Azerbaijani Southern Group command faced the task of organizing a force for the seizure of Hadrut. Special
    operations forces had relevant training for urban and mountainous operations, but lacked the firepower and mass for sustained
    offensive operations. Mechanized and motorized formations could provide firepower, while their largely conscript personnel
    had limited tactical initiative. Special operations forces had operated independently earlier in the campaign. Hadrut's
    location made it an important corridor, and there was no viable route for mechanized forces to bypass it.
  question: What should the Azerbaijani Southern Group command do to organize the force for the Hadrut operation?
  options:
    O1:
      do: The Azerbaijani Southern Group command should authorize integration of conventional brigades under special operations
        forces' operational control.
      move: act
      irreversible: false
    O2:
      do: The Azerbaijani Southern Group command should decline integration and keep special operations forces operating independently.
      move: act
      irreversible: false
    O3:
      do: The Azerbaijani Southern Group command should assign conventional brigades to support special operations forces
        under separate operational control.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Azerbaijani Southern Group command assigned the mission to seize Hadrut to its special operations forces.
  - id: F2
    kind: capability
    status: confirmed
    fact: Azerbaijani special operations forces were highly trained and prepared to operate in urban and mountainous environments.
  - id: F3
    kind: capability
    status: assessed
    fact: Special operations forces lacked the firepower and mass required for sustained offensive operations.
  - id: F4
    kind: capability
    status: confirmed
    fact: Mechanized and motorized brigades could bring firepower to the operation.
  - id: F5
    kind: capability
    status: assessed
    fact: The mechanized and motorized brigades were composed largely of conscripts with limited tactical initiative.
  - id: F6
    kind: situation
    status: confirmed
    fact: Special operations forces had operated independently during the early stages of the campaign.
  - id: F7
    kind: situation
    status: assessed
    fact: Hadrut's location anchored a narrow corridor between Jabrayil and central Nagorno-Karabakh, and there was no viable
      way for mechanized forces to bypass it.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: strong
    why: Special operations forces were assigned the mission and had the training for urban and mountainous operations, making
      them the appropriate core of the force.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: strong
    why: Special operations forces lacked the mass and firepower for sustained offensive operations, while conventional brigades
      could supply that shortfall.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The source's rationale was to combine special operations forces' precision and professionalism with conventional
      forces' mobility and firepower; the conventional formations' limited tactical initiative supported integrating them
      under special operations operational control rather than relying on them to act independently.
  - id: C4
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The earlier independent approach was not suited to this operation: Hadrut anchored a corridor that mechanized forces
      could not bypass, so the task required a force organization capable of combining specialized capability with sufficient
      mass.'
  reasoning:
    read: 'The problem was not choosing between specialized skill and conventional firepower: Hadrut''s importance required
      both. The trap was treating prior independent special-operations employment as a model for this operation, despite the
      forces'' different capabilities and the mission''s demands.'
    weighing: Special operations forces were trained for the environment and were assigned the mission, but lacked the mass
      and firepower for sustained offensive operations {C1} {C2}. Conventional brigades could add firepower, yet their limited
      tactical initiative made integration important {C3}. The source's judgment was that task-organizing the conventional
      formations under special operations operational control created the needed combination, and that level of integration
      proved decisive. The balance depends on the assessed capability gap and on whether the force can be effectively integrated
      {C4}.
    tradecraft: Record why the mission requires both specialized capability and additional mass, and clearly document the
      command relationship and responsibilities chosen. Reassess the arrangement if the underlying capability or integration
      assumptions change.
    uncertainty: The source presents the capability judgments as assessments and does not provide detailed measures of the
      shortfall or of the conventional formations' initiative. The recommendation therefore rests on those assessments and
      the source's evaluation of the integrated formation.
    handoff: The Southern Group command should make the force-organization decision and involve the relevant special operations
      and conventional formation commanders to establish a workable command relationship; this supports integration without
      treating the decision as an unsupported delegation.
    tempting_wrong:
      option: O2
      pull: Special operations forces had the relevant training and had operated independently earlier in the campaign.
      why_wrong: That approach would leave unaddressed the source's stated shortfall in mass and firepower for sustained offensive
        operations.
    rejected:
      O2: The command did not choose independent special-operations employment because those forces lacked the mass and firepower
        required for sustained offensive operations.
      O3: The command did not choose conventional support under separate operational control because the source identifies
        integration under special operations operational control—not merely added firepower—as the decisive force-organizing
        approach.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Special operations forces had sufficient mass and firepower for sustained offensive operations without conventional
        reinforcement.
      then: O2
      why: The principal capability gap supporting integration would no longer apply, making independent employment more plausible.
    - id: flip2
      if: Conventional brigades could provide support but could not be placed under special operations operational control.
      then: O3
      why: Separate-control support would then be the available way to add conventional firepower while retaining special
        operations forces as the mission's core.
    would_not_change:
    - id: noflip1
      if: Special operations forces had operated independently earlier in the campaign.
      why: That history alone would not resolve the different demands of Hadrut or the stated shortfall in mass and firepower.
    watch_for:
    - id: watch1
      what: Whether the conventional formations' limited tactical initiative prevents an effective command relationship under
        special operations operational control.
      favors:
      - O3
      why: If effective integration cannot be achieved, separate-control support may be more workable than an integration
        that exists only formally.
  lesson: When a mission requires specialized capability but that force lacks the mass or firepower to sustain the operation,
    organize complementary forces into an integrated formation rather than assuming either can do the task alone. Prior independent
    employment is not a reason to preserve that arrangement when the mission's demands differ.
  limits: This reasoning addresses force organization based on the capability assessments and mission demands in this scenario.
    It does not resolve separate questions about legal authority, rules of engagement, civilian protection, or how the operation
    should be conducted.
