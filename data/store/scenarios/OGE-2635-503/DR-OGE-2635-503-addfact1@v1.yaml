case:
  id: DR-OGE-2635-503-addfact1@v1
  title: Recusal period for architect after covered payment [addfact]
  status: needs_review
  setting: U.S. Army Corps of Engineers, civil-engineering branch, after a design professional joins and receives a post-employment
    payment
  decider: the design professional
  agent: the design professional
  agent_role: decide
  situation: The design professional accepted a position with the Army Corps of Engineers and left the private architecture
    partnership. One month into the new federal role, the partnership paid the professional a covered sum. Under agency ethics
    rules, a covered payment—defined as any item over $10,000 given because the recipient was known to be considered for or
    had accepted a government position and not part of a qualifying program—triggers a mandatory two-year recusal from any
    specific matter involving the paying party, which is a former employer. The recusal period begins on the date the payment
    is received, extending the prohibition for 25 months from the start of the federal job. Because the payment was received
    after the professional became an executive-branch employee, agency ethics officials must determine whether it constitutes
    a salary supplementation under 18 U.S.C. § 209. Additionally, a portion of the professional's annual performance bonus
    is linked to the successful completion of projects that serve former clients of the partnership.
  question: How should the design professional handle involvement in matters that involve the former partnership?
  options:
    O1:
      do: Refrain from participating in any matter that involves the former partnership for the full 25-month period.
      move: act
      irreversible: true
    O2:
      do: Wait for guidance from the agency's ethics office before deciding how to proceed.
      move: hold
      irreversible: false
    O3:
      do: Continue to take part in matters involving the former partnership without delay.
      move: act
      irreversible: false
    O4:
      do: Request a waiver from the agency ethics official to avoid the recusal requirement.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: A portion of the architect's yearly performance bonus is tied to the successful delivery of projects that serve
      former clients of the partnership.
  - id: F2
    kind: situation
    status: confirmed
    fact: The architect took a job with the U.S. Army Corps of Engineers.
  - id: F3
    kind: situation
    status: confirmed
    fact: The architect left the private architecture partnership.
  - id: F4
    kind: situation
    status: confirmed
    fact: One month after starting the federal role, the architect was paid a covered sum by the former partnership.
  - id: F5
    kind: authority
    status: confirmed
    fact: A covered payment is any item valued above $10,000 that is given because the recipient was known to be under consideration
      for, or had accepted, a government position and is not part of a qualifying program.
  - id: F6
    kind: authority
    status: confirmed
    fact: An employee who receives a covered payment must recuse himself for two years from any specific matter involving
      the party that made the payment, which is a former employer.
  - id: F7
    kind: authority
    status: confirmed
    fact: The two-year recusal clock starts on the date the covered payment is received.
  - id: F8
    kind: authority
    status: confirmed
    fact: Because the payment arrived after the architect became an executive-branch employee, agency ethics officials must
      determine whether it qualifies as a salary supplementation under 18 U.S.C. § 209.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: §2635.503(a) obligates a two-year recusal that begins on the date the covered payment is received.
  - id: C2
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The sum exceeds $10,000 and was given because the professional was known to be entering a Government position, so
      it meets the definition of a covered payment.
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The salary-supplementation review required by 18 U.S.C. §209 does not alter the statutory two-year recusal period.
  - id: C4
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: A waiver under §2635.503(c) is unavailable when the payment is substantial enough to raise a reasonable-person doubt,
      as illustrated by the regulation's example.
    rules_out:
    - O4
  - id: C5
    facts:
    - F1
    - F5
    equity: ethical_compliance
    favors:
    - O1
    weight: strong
    why: The performance bonus tied to projects for former partnership clients creates a direct financial incentive, reinforcing
      the need to avoid any participation.
  reasoning:
    read: The design professional received a covered payment one month after beginning work at the Corps. Under §2635.503(a)
      that triggers a mandatory two-year recusal from any matter where the former partnership is a party, and the clock starts
      at receipt. The professional's bonus tied to projects for the partnership's former clients adds a personal financial
      conflict, further supporting full recusal.
    weighing: C1 and C2 together provide the statutory mandate for a 25-month recusal. C5 adds a strong equity consideration
      based on the bonus incentive. C3 notes a procedural salary-supplementation review that does not affect the recusal window.
      C4 confirms that a waiver is unavailable. The combined weight unequivocally points to O1.
    tradecraft: Notify the agency ethics official and supervisory chain immediately, log the recusal in the conflict-of-interest
      system, and abstain from any involvement with matters involving the former partnership until the 25-month period ends.
    uncertainty: Minimal; the statutory language and the bonus conflict leave little room for alternative interpretation.
    handoff: The ethics official will conduct the salary-supplementation review, but the recusal decision is self-executed
      under the regulation.
    tempting_wrong:
      option: O3
      pull: Desire to continue work on projects that involve the former partnership.
      why_wrong: Participating would breach the mandatory two-year recusal provision of §2635.503(a).
    rejected:
      O2: Waiting for guidance does not satisfy the immediate statutory duty to recuse.
      O3: Participation violates the clear recusal rule.
      O4: A waiver cannot be granted because the payment is substantial and no waiver authority has been invoked.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the payment were below $10,000 or made under a qualifying program, so it would not be a covered payment
      then: O3
      why: Without a covered payment the statutory recusal does not apply.
    - id: flip2
      if: the agency head issued a written waiver under §2635.503(c) finding the payment not substantial
      then: O4
      why: A valid waiver removes the mandatory recusal.
    would_not_change:
    - id: noflip1
      if: the ethics official determines the payment is salary supplementation under 18 U.S.C. §209
      why: That determination triggers a separate reporting requirement but does not affect the two-year recusal period.
    watch_for:
    - id: watch1
      what: any request for a waiver from the agency head
      favors:
      - O4
      why: A granted waiver would allow participation before the two-year period ends.
  lesson: A covered payment—any item over $10,000 given because the recipient is known to be entering a Government role—automatically
    triggers a two-year recusal from any matter involving the paying party, starting on receipt, regardless of when federal
    service began. Waivers are only possible when the payment is not substantial enough to raise a reasonable-person doubt.
  limits: The recusal applies solely to matters where the former partnership is a party or represents a party; it does not
    preclude the professional from working on unrelated policy or legislative issues. The rule also does not address other
    conflicts unrelated to covered payments.
