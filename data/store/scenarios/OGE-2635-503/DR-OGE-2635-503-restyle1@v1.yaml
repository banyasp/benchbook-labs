case:
  id: DR-OGE-2635-503-restyle1@v1
  title: Recusal period for architect after covered payment [restyle]
  status: needs_review
  setting: U.S. Army Corps of Engineers, post-employment transition of a design professional
  decider: the design professional
  agent: the design professional
  agent_role: decide
  situation: A licensed architect has taken a senior role with the U.S. Army Corps of Engineers after withdrawing from a private
    design firm. Thirty days into the new federal appointment, the former firm sent the architect a payment that meets the
    definition of a "covered payment." Under the civil service ethics regulations, receipt of such a payment obligates the
    employee to recuse himself from any specific proceeding that involves the former firm for a period of two years measured
    from the date the payment is received. Consequently, the recusal window extends to 25 months after the architect's start
    date. Because the payment arrived after the architect entered executive-branch service, the agency's ethics office must
    also assess whether the payment qualifies as salary supplementation under 18 U.S.C. §209.
  question: How should the architect proceed with regard to any matters that involve the former design firm?
  options:
    O1:
      do: The architect refrains from taking part in any proceeding that includes the former firm for the full 25-month period.
      move: act
      irreversible: true
    O2:
      do: The architect postpones any decision until the agency ethics office issues a formal advisory.
      move: hold
      irreversible: false
    O3:
      do: The architect proceeds to engage in any proceeding involving the former firm without delay.
      move: act
      irreversible: false
    O4:
      do: The architect petitions the agency ethics office for a waiver of the recusal obligation.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The architect entered employment with the U.S. Army Corps of Engineers.
  - id: F2
    kind: situation
    status: confirmed
    fact: The architect terminated his partnership with a private design firm.
  - id: F3
    kind: situation
    status: confirmed
    fact: Thirty days after commencing the federal role, the architect received a covered payment from the former firm.
  - id: F4
    kind: authority
    status: confirmed
    fact: A covered payment is any transfer exceeding $10,000 that is made because the recipient was known to be under consideration
      for, or had accepted, a federal appointment and that is not part of an approved program.
  - id: F5
    kind: authority
    status: confirmed
    fact: An employee must recuse himself for two years from any specific matter that involves a former employer when he has
      received a covered payment from that employer.
  - id: F6
    kind: authority
    status: confirmed
    fact: The two-year recusal period commences on the date the covered payment is received.
  - id: F7
    kind: authority
    status: confirmed
    fact: Because the payment arrived after the architect became an executive-branch employee, agency ethics officials must
      determine whether it constitutes salary supplementation under 18 U.S.C. §209.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Section 2635.503(a) imposes a mandatory two-year recusal that starts on the date a covered payment is received.
  - id: C2
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The transfer exceeds $10,000 and was made because the architect was known to be entering a federal position, therefore
      it qualifies as a covered payment.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although the payment was received after the architect entered executive-branch service and must be reviewed for possible
      salary-supplementation, that review does not modify the statutory two-year recusal period.
  - id: C4
    facts: []
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: A waiver under §2635.503(c) is only permissible when the payment is not substantial enough to raise a reasonable-person
      doubt; the regulation's illustration treats the payment as substantial, so a waiver is unavailable.
    rules_out:
    - O4
  reasoning:
    read: The architect's receipt of a covered payment thirty days after joining the Corps triggers the two-year recusal provision
      of §2635.503(a). That provision sets the receipt date as the start of the recusal clock, so the delay does not alter
      the duration.
    weighing: Considerations C1 and C2 together create an unequivocal statutory command that the architect must recuse for
      the entire two-year span, i.e., 25 months from the start date. C3 adds a procedural requirement to evaluate salary-supplementation
      but does not affect the recusal window. C4 confirms that a waiver is not an option because the payment is deemed substantial.
      Accordingly, the balance points to O1.
    tradecraft: The architect should promptly inform the agency ethics office and his supervisory chain, log the recusal in
      the official conflict-of-interest system, and abstain from any participation in matters where the former firm is a party
      until the 25-month deadline elapses.
    uncertainty: The applicable statute is clear regarding both the timing and the scope of the recusal.
    handoff: The salary-supplementation determination must be coordinated with the agency ethics office, but the recusal itself
      is executed by the architect in accordance with the regulation.
    tempting_wrong:
      option: O3
      pull: Desire to remain involved in projects that happen to involve the former firm.
      why_wrong: Participating would breach the mandatory two-year recusal provision of §2635.503(a).
    rejected:
      O2: Deferring a decision does not fulfill the immediate statutory obligation to recuse.
      O3: Permitting participation contravenes the clear recusal requirement.
      O4: A waiver is unavailable because the payment is substantial and no waiver authority has been invoked.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the payment were under $10,000 or were made through an approved program, so it would not meet the definition of
        a covered payment
      then: O3
      why: Absent a covered payment, the statutory recusal provision does not apply.
    - id: flip2
      if: the head of the agency issued a written waiver under §2635.503(c) finding the payment not substantial
      then: O4
      why: A valid waiver eliminates the mandatory recusal.
    would_not_change:
    - id: noflip1
      if: the ethics office concludes the payment constitutes salary supplementation under 18 U.S.C. §209
      why: That conclusion triggers a separate reporting duty but leaves the two-year recusal period unchanged.
    watch_for:
    - id: watch1
      what: any request for a waiver submitted by the agency head
      favors:
      - O4
      why: A granted waiver would permit participation before the two-year period expires.
  lesson: Receipt of a covered payment automatically imposes a two-year recusal from any matter involving the former employer,
    beginning on the date the payment is received, irrespective of when the employee started federal service. Waivers are
    only permissible when the payment is not substantial enough to create a reasonable-person doubt.
  limits: The recusal applies solely to proceedings where the former design firm is a party or represents a party; it does
    not prevent the architect from working on broader policy or legislative work that does not involve the firm. The rule
    also does not address other conflicts that are unrelated to covered payments.
