case:
  id: DR-OGE-2635-503@v1
  title: Recusal period for architect after covered payment
  status: draft
  setting: Army Corps of Engineers, United States, after architect joins and receives payment
  decider: the architect
  agent: the architect
  agent_role: decide
  situation: An architect accepted a position with the Army Corps of Engineers and resigned from a private architecture partnership.
    One month after beginning the new federal position, the architect received a covered payment from the former partnership.
    Under the ethics rules, a covered payment triggers a mandatory recusal from any particular matter involving specific parties
    that are former employers for two years from the date of receipt. The two‑year period therefore begins one month after
    the architect started the federal job, extending to 25 months after the start date. Because the payment was received after
    the architect became an executive‑branch employee, agency ethics officials must also review whether the payment constitutes
    a salary supplementation under 18 U.S.C. 209.
  question: What should the architect do regarding participation in matters involving the former partnership?
  options:
    O1:
      do: The architect disallows participation in any matter involving the former partnership for 25 months.
      move: act
      irreversible: true
    O2:
      do: The architect holds off deciding until the agency ethics official issues guidance on the matter.
      move: hold
      irreversible: false
    O3:
      do: The architect allows participation in any matter involving the former partnership immediately.
      move: act
      irreversible: false
    O4:
      do: The architect asks the agency ethics official for a waiver of the recusal requirement.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The architect accepted a position with the Army Corps of Engineers.
  - id: F2
    kind: situation
    status: confirmed
    fact: The architect resigned from a private architecture partnership.
  - id: F3
    kind: situation
    status: confirmed
    fact: One month after beginning the new position, the architect received a covered payment from the partnership.
  - id: F4
    kind: authority
    status: confirmed
    fact: A covered payment is any item valued over $10,000 paid because the individual was known to be considered for or
      had accepted a Government position and not pursuant to a qualifying program.
  - id: F5
    kind: authority
    status: confirmed
    fact: An employee must recuse for two years from participating in any particular matter involving specific parties that
      are a former employer if the employee received a covered payment from that party.
  - id: F6
    kind: authority
    status: confirmed
    fact: The two‑year recusal period begins on the date the covered payment is received.
  - id: F7
    kind: authority
    status: confirmed
    fact: Because the payment was not received before the architect became an executive‑branch employee, agency ethics officials
      must review whether it constitutes a salary supplementation under 18 U.S.C. 209.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: §2635.503(a) mandates a two‑year recusal beginning on the date a covered payment is received.
  - id: C2
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The payment received exceeds $10,000 and was made because the architect was known to be entering a Government position,
      so it is a covered payment.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Because the payment was received after the architect became an executive‑branch employee, ethics officials must review
      it for salary‑supplementation, but this review does not alter the statutory two‑year recusal period.
  - id: C4
    facts: []
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: A waiver under §2635.503(c) is only permissible when the payment is not substantial enough to raise a reasonable‑person
      doubt; the regulation’s example treats the payment as substantial, so a waiver is not available.
    rules_out:
    - O4
  reasoning:
    read: The architect received a covered payment one month after starting at the Corps. The rule in §2635.503(a) treats
      that receipt as the trigger for a mandatory two‑year recusal from any matter where the former partnership is a party.
      The trap is to think the one‑month delay changes the period; it does not—the clock starts at receipt.
    weighing: C1 and C2 together provide a binding statutory mandate that the architect must recuse for the full two‑year
      period, i.e., 25 months from the start date. C3 adds a procedural step (salary‑supplementation review) but does not
      modify the recusal window. C4 confirms that a waiver is unavailable because the payment is substantial. The balance
      therefore points unequivocally to O1.
    tradecraft: The architect should immediately notify the agency ethics official and the appropriate supervisory chain,
      record the recusal in the official conflict‑of‑interest system, and refrain from any participation in matters involving
      the former partnership until the 25‑month date passes.
    uncertainty: Minimal; the statute is clear on the timing and scope of the recusal.
    handoff: The architect must involve the agency ethics official for the required salary‑supplementation review, but the
      recusal decision itself is self‑executed under the regulation.
    tempting_wrong:
      option: O3
      pull: Desire to continue work on projects that happen to involve the former partnership.
      why_wrong: Participating would violate the mandatory two‑year recusal provision of §2635.503(a).
    rejected:
      O2: Holding off does not satisfy the immediate statutory duty to recuse.
      O3: Allowing participation breaches the clear recusal rule.
      O4: A waiver cannot be granted because the payment is substantial and no waiver authority has been invoked.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the payment were below $10,000 or made under a qualifying program, so it would not be a covered payment
      then: O3
      why: Without a covered payment the statutory recusal does not apply.
    - id: flip2
      if: the head of the agency granted a written waiver under §2635.503(c) finding the payment not substantial
      then: O4
      why: A valid waiver removes the mandatory recusal.
    would_not_change:
    - id: noflip1
      if: the ethics official determines the payment is salary supplementation under 18 U.S.C. 209
      why: That determination triggers a separate reporting requirement but does not affect the two‑year recusal period.
    watch_for:
    - id: watch1
      what: any request for a waiver from the agency head
      favors:
      - O4
      why: A granted waiver would allow participation before the two‑year period ends.
  lesson: A covered payment triggers an automatic two‑year recusal from any matter involving the former employer, starting
    on the date the payment is received, regardless of when the employee began federal service. Waivers are only available
    when the payment is not substantial enough to raise a reasonable‑person doubt.
  limits: The recusal applies only to matters where the former partnership is a party or represents a party; it does not bar
    the architect from working on general policy or legislation that does not involve the partnership. The rule also does
    not address other potential conflicts unrelated to covered payments.
