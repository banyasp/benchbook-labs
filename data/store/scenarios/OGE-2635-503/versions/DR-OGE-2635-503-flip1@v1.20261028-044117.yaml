case:
  id: DR-OGE-2635-503-flip1@v1
  title: Recusal period for architect after covered payment [flip]
  status: needs_review
  setting: U.S. Army Corps of Engineers, after the architect assumed a federal role and received a post-employment payment
  decider: the architect
  agent: the architect
  agent_role: decide
  situation: An architect took a senior position with the Army Corps of Engineers and terminated his partnership in a private
    firm. One month into the federal job, the former partnership sent the architect a $9,500 payment under a transition-assistance
    program. Ethics regulations define a covered payment as any amount over $10,000 made because the employee was known to
    be entering a government position and not part of a qualifying program. A covered payment obligates a two-year recusal
    from any matter involving the paying party. Because the received amount is below the $10,000 threshold, the payment is
    not covered, but agency ethics officials must still determine whether it might be a salary-supplementation under 18 U.S.C.
    209.
  question: Should the architect participate in any Corps matters that involve the former partnership?
  options:
    O1:
      do: Refrain from any involvement in matters that include the former partnership for the next 25 months.
      move: act
      irreversible: true
    O2:
      do: Delay any decision until the agency ethics office issues formal guidance on the appropriate course of action.
      move: hold
      irreversible: false
    O3:
      do: Continue participation in any matter involving the former partnership immediately, without awaiting additional approvals
        or waivers.
      move: act
      irreversible: false
    O4:
      do: Seek a written waiver of the recusal requirement from the agency head, citing the payment's modest amount.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The designer commenced his federal appointment with the U.S. Army Corps of Engineers.
  - id: F2
    kind: situation
    status: confirmed
    fact: He severed his affiliation with the private architectural firm where he had been a partner.
  - id: F3
    kind: situation
    status: confirmed
    fact: One month after beginning the new position, the architect received a payment of $9,500 from the partnership as part
      of a government‑sponsored transition assistance program.
  - id: F4
    kind: authority
    status: confirmed
    fact: Any remuneration exceeding $10,000 that is given because the recipient was known to be under consideration for,
      or had already taken, a federal position—and that is not part of an authorized exception—constitutes a covered payment.
  - id: F5
    kind: authority
    status: confirmed
    fact: If a covered payment is received from a former employer, the employee is required to abstain for a two-year period
      from any case or issue where that former employer is a party.
  - id: F6
    kind: authority
    status: confirmed
    fact: The clock for the two-year abstention starts on the day the covered payment is actually received.
  - id: F7
    kind: authority
    status: confirmed
    fact: Since the remuneration arrived after the architect had entered the executive branch, ethics officials are obliged
      to assess whether it qualifies as salary supplementation under 18 U.S.C. 209.
  considerations:
  - id: C2
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The $9,500 payment falls below the $10,000 threshold defined in {F4}, so it is not a covered payment and therefore
      does not trigger the statutory two-year recusal.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: Even if the payment were deemed salary supplementation, the recusal mandate applies only to covered payments, which
      this payment is not.
  reasoning:
    read: The architect received a $9,500 transition payment one month after starting at the Corps. Under the definition in
      {F4}, a covered payment must exceed $10,000, so this amount is not covered. Consequently, the mandatory two-year recusal
      provision in {F5} does not apply.
    weighing: C2 provides the decisive factual determination that the payment is below the covered-payment threshold, eliminating
      any statutory recusal duty. C3 confirms that a salary-supplementation review, while required, does not create a separate
      participation ban. With no recusal trigger, the architect may lawfully engage in matters involving the former partnership.
    tradecraft: The architect should inform the agency ethics office of the payment, document that it is not a covered payment,
      and continue normal participation in all Corps matters, including those that involve the former partnership.
    uncertainty: Low; the payment amount and statutory definition are clear.
    handoff: Only the routine salary-supplementation review remains for the ethics office; no further action is needed to
      lift a recusal.
    tempting_wrong:
      option: O1
      pull: Desire to avoid any appearance of impropriety by self-imposing a longer recusal.
      why_wrong: Self-imposed recusal exceeds the statutory requirement because the payment is not a covered payment.
    rejected:
      O2: Waiting for guidance delays work unnecessarily; the regulations already clarify that no recusal is required.
      O4: A waiver is unnecessary because there is no statutory recusal to waive.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the agency ethics official concludes that the $9,500 payment constitutes prohibited salary supplementation under
        18 U.S.C. 209
      then: O1
      why: A determination of prohibited salary supplementation would create a conflict requiring the architect to recuse
        from matters involving the former partnership.
    - id: flip2
      if: the payment had been $12,000 or made outside a qualifying program, making it a covered payment
      then: O1
      why: A covered payment would activate the two-year recusal provision, rendering O1 the correct choice.
    would_not_change:
    - id: noflip1
      if: the ethics official determines the payment is salary supplementation under 18 U.S.C. 209
      why: That finding triggers a reporting requirement but does not affect participation because the payment is not covered.
    watch_for:
    - id: watch1
      what: any request for a waiver from the agency head
      favors:
      - O4
      why: A granted waiver would permit participation before any statutory recusal period could begin.
  lesson: A payment below the $10,000 threshold does not qualify as a covered payment, so the statutory two-year recusal does
    not apply. Recusal obligations arise only when the payment meets the covered-payment definition.
  limits: The lack of a covered payment permits the architect to work on any Corps matter that involves the former partnership,
    provided no other conflict exists. The rule does not address unrelated conflicts or separate reporting duties for salary-supplementation
    reviews.
