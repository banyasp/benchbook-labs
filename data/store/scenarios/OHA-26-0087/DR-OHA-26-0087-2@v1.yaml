case:
  id: DR-OHA-26-0087-2@v1
  title: Guideline J Criminal Conduct Concern Resolution
  status: draft
  setting: DOE Office of Hearings and Appeals, 2026, administrative security clearance hearing
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: During a 2026 security clearance hearing, the Individual presented testimony and evidence regarding his past
    criminal conduct. The Individual had been charged with multiple felony drug offenses between 2012 and 2016, was sentenced
    to four years in prison, and served roughly fifteen months from December 2012 to March 2014. He has not faced any criminal
    charges since November 2016 and has been employed by a DOE contractor since 2024, receiving spot awards for his performance.
    At the time of the 2012 offenses, he was unhoused and living on the streets, but he now asserts that he has reformed,
    no longer associates with former contacts, and expresses remorse. The LSO cited Guideline J concerns, and the Administrative
    Judge identified mitigating factors of elapsed time and evidence of rehabilitation as satisfied.
  question: What should the Administrative Judge decide about whether the Individual has resolved the Guideline J security
    concern?
  options:
    O1:
      do: The Administrative Judge finds that the Individual has not resolved the Guideline J concerns
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge finds that the Individual has resolved the Guideline J concerns
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged with felony drug offenses in January 2012, May 2012, July 2012, May 2015, and November
      2016.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was sentenced to four years in prison and incarcerated from December 2012 to March 2014, serving
      approximately fifteen months.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual has not been charged with any criminal offense since November 2016.
  - id: F4
    kind: situation
    status: confirmed
    fact: At the time of the 2012 offenses, the Individual was unhoused and living on the streets with unstable employment.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual has been employed by a DOE contractor since 2024 and has received spot awards for his performance.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual testified that he has reformed, no longer associates with former contacts, and expresses remorse
      for his past actions.
  - id: F7
    kind: authority
    status: confirmed
    fact: The LSO cited Guideline J concerns regarding the Individual’s criminal conduct.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Administrative Judge identified mitigating factors (a) time elapsed and (d) evidence of rehabilitation as satisfied
      for Guideline J.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The last criminal conduct occurred about ten years ago and no charges have been filed since 2016, satisfying mitigating
      factor (a) that the behavior is sufficiently remote.
  - id: C2
    facts:
    - F5
    - F6
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Employment stability, spot awards, and the Individual’s expressed remorse demonstrate rehabilitation, meeting mitigating
      factor (d).
  - id: C3
    facts:
    - F4
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The judge notes the Individual’s past homelessness contributed to poor judgment, but the change in circumstances
      lessens the security concern.
  - id: C4
    facts:
    - F2
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment does not bar a waiver for Guideline J; the judge can rely on the Adjudicative Guidelines to resolve
      the criminal‑conduct concern.
  reasoning:
    read: The record shows a series of felony drug offenses from 2012‑2016, but the Individual has had no further charges
      for a decade, has stable employment, and expresses remorse. The judge must decide whether these facts erase the security
      doubt raised under Guideline J.
    weighing: Applying the Adjudicative Guidelines, the judge finds that mitigating factor (a) – the passage of time – is
      satisfied (see {C1}) and that mitigating factor (d) – evidence of rehabilitation – is also satisfied (see {C2}). The
      judge therefore concludes that the criminal‑conduct concern no longer threatens reliability or trustworthiness, even
      though the Bond Amendment still applies to the clearance overall. This mirrors the source’s language that the Individual
      “has brought forth sufficient evidence to resolve the Guideline J concerns.”
    tradecraft: The decision is recorded in the Administrative Judge’s written decision, cited to the relevant CFR sections
      and Adjudicative Guidelines, and the waiver determination is entered into the DOE personnel security system.
    uncertainty: Minimal; the only uncertainty lies in the Individual’s future conduct, which the judge cannot predict but
      deems unlikely given the elapsed time and rehabilitation.
    handoff: The Administrative Judge decides alone, as the authority to resolve Guideline J rests with the adjudicator under
      10 C.F.R. § 710.7(c). No further agency review is required unless appealed.
    tempting_wrong:
      option: O1
      pull: A residual bias against granting clearances to anyone with a felony record might tempt the judge to deny despite
        mitigation.
      why_wrong: The source explicitly states that the elapsed time and rehabilitation satisfy the mitigating factors, so
        denying would contradict the adjudicative standard.
    rejected:
      O1: The judge found the mitigating factors satisfied and therefore concluded the Guideline J concern was resolved.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to be charged with a new felony after this decision.
      then: O1
      why: A new criminal charge would defeat the elapsed‑time mitigation and re‑introduce a security doubt under Guideline
        J.
    - id: flip2
      if: The Individual could not demonstrate any rehabilitation (no stable employment, no awards, no remorse).
      then: O1
      why: Without evidence of rehabilitation, mitigating factor (d) would not be satisfied, leaving the Guideline J concern
        unresolved.
    would_not_change:
    - id: noflip1
      if: The Individual’s tax filing failures (Guideline F) remain unresolved.
      why: I find that the Individual has brought forth sufficient evidence to resolve the Guideline J concerns set forth
        in the SSC. However, I also find that the Individual has not brought forth sufficient evidence to resolve the Guideline
        F concerns set forth in the SSC.
    watch_for:
    - id: watch1
      what: Any future criminal investigation or charge against the Individual.
      favors:
      - O1
      why: A new charge would revive the security concern under Guideline J.
  lesson: When evaluating Guideline J, the passage of time and demonstrable rehabilitation can outweigh a past felony record,
    provided the conduct is remote and the individual shows sustained good conduct. A waiver is appropriate when mitigating
    factors (a) and (d) are satisfied under the Adjudicative Guidelines.
  limits: This analysis applies only to criminal‑conduct concerns under Guideline J; it does not address financial concerns
    (Guideline F) or the Bond Amendment’s separate waiver requirements. New criminal activity would reset the analysis.
