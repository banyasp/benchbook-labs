case:
  id: DR-OHA-26-0087-flip1@v1
  title: Guideline J Criminal Conduct Waiver Decision [flip]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, April 2026, administrative security-clearance hearing
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The DOE Security Office (LSO) cited Guideline J because the Individual has been charged with multiple felony
    drug offenses spanning 2012-2022, including a recent conviction in November 2022 for sale and transportation of a controlled
    substance. The Individual testified that the offenses occurred while he was unhoused, that he has not engaged in any criminal
    activity for roughly three years, and that he now holds stable employment with a DOE contractor and is a parent of two
    children. The Judge noted the mitigating factors of time elapsed and evidence of rehabilitation but expressed concern
    that the 2022 conviction undermines those factors. The decision point is whether to grant a waiver for the Guideline J
    concern, permitting the Individual's access authorization to proceed.
  question: Should the Administrative Law Judge grant a waiver for the Guideline J security concern in the Individual's access-authorization
    case?
  options:
    O1:
      do: Approve a waiver for the Guideline J concern, concluding that the Individual's past criminal conduct no longer poses
        a security risk.
      move: act
      irreversible: true
    O2:
      do: Approve a conditional waiver, requiring the Individual to undergo a probationary monitoring period before full clearance
        is granted.
      move: partial
      irreversible: false
    O3:
      do: defer the decision on the Guideline J concern until additional proof of rehabilitation, such as verified participation
        in a counseling program, is provided.
      move: hold
      irreversible: false
    O4:
      do: Reject any waiver for the Guideline J concern, determining that the Individual's criminal conduct continues to present
        a security risk.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged with multiple felony drug offenses between 2012 and 2022, including Sale/Offer to Sell/Transportation
      of Controlled Substance in January 2012, May 2012, May 2015, July 2012, and November 2022.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual received a four-year prison sentence for the May 2012 offenses and served roughly fifteen months,
      from December 2012 through March 2014.
  - id: F3
    kind: situation
    status: confirmed
    fact: A bench warrant was issued in June 2015 after the Individual failed to appear for a scheduled court date.
  - id: F4
    kind: authority
    status: confirmed
    fact: The LSO invoked Guideline J, asserting that the pattern of felony drug conduct raises doubts about the Individual's
      reliability, judgment, and trustworthiness.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Individual testified that the offenses occurred while he was unhoused, that he has not engaged in criminal activity
      for roughly three years, and that he has changed his circumstances.
  - id: F6
    kind: situation
    status: assessed
    fact: The Individual presently works full-time for a DOE contractor, has earned several spot awards for his performance,
      and is the parent of two children.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Administrative Judge identified mitigating factors (a) the passage of time and changed circumstances, and (d)
      evidence of rehabilitation, but noted that the recent 2022 conviction may outweigh these.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The record includes a felony drug conviction as recent as November 2022, which erodes the credibility of the passage-of-time
      mitigation and suggests a continuing security risk.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Although the Individual now has stable employment and family responsibilities, the recent conviction undermines the
      inference that rehabilitation is durable.
  - id: C3
    facts:
    - F3
    - F1
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The bench warrant and a decade-long pattern of felony drug offenses indicate a history of non-compliance that weakens
      confidence in future reliability.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O4
    weight: weak
    why: The potential security risk posed by the recent conviction outweighs the operational benefit of retaining the individual
      in a sensitive position.
  reasoning:
    read: The Individual's felony drug offenses extend through November 2022, and the most recent conviction occurred only
      three years ago, limiting the mitigating impact of elapsed time.
    weighing: The Judge weighed Guideline J mitigating factor (a) – passage of time – and (d) – evidence of rehabilitation
      – against the seriousness and recency of the offenses. The recent 2022 conviction, coupled with a prior bench warrant,
      tipped the balance toward a continued security concern, leading to a denial of a waiver.
    tradecraft: Record the denial in the official OHA decision docket, cite the relevant sections of the adjudicative guidelines,
      and note that the decision is consistent with 10 C.F.R. § 710.25(e).
    uncertainty: Moderate; while the Individual shows signs of stability, the proximity of the latest felony conviction creates
      appreciable risk.
    handoff: The Administrative Law Judge issues the final determination alone under 10 C.F.R. § 710.25(d)-(g); further agency
      review is only possible on appeal.
    tempting_wrong:
      option: O1
      pull: The Individual's current employment and awards suggest he has reformed and could safely receive clearance.
      why_wrong: The recent felony conviction demonstrates that the risk has not been fully mitigated, making a waiver inappropriate.
    rejected:
      O2: A conditional waiver is unnecessary because the underlying security concern remains unresolved despite the Individual's
        employment record.
      O3: Additional evidence of rehabilitation would not offset the significance of the 2022 conviction.
      O1: Granting a full waiver ignores the recent felony, which directly contravenes Guideline J's risk-assessment criteria.
  verdict:
    choice: O4
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip2
      if: The elapsed time since the last offense were at least five years.
      then: O1
      why: A longer interval would satisfy the time-elapsed mitigation, potentially justifying a waiver.
    would_not_change:
    - id: noflip1
      if: The Individual resolves the Guideline F tax-filing issue.
      why: Resolution of a financial concern does not affect the already-resolved criminal-conduct concern.
    watch_for:
    - id: watch1
      what: Any new arrest, charge, or conviction for a controlled-substance offense.
      favors:
      - O4
      why: A new offense would revive the security concern under Guideline J.
  lesson: When a recent felony drug conviction exists, even in the context of stable employment and family responsibilities,
    the security risk under Guideline J remains significant and a waiver should be denied.
  limits: This guidance does not apply where the individual's last felony occurred more than five years ago, where the offenses
    are unrelated to controlled substances, or where credible, documented rehabilitation fully offsets the security risk.
