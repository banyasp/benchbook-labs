case:
  id: DR-OHA-26-0087-2@v1
  title: Guideline J Criminal Conduct Waiver Decision
  status: draft
  setting: DOE Office of Hearings and Appeals, March 2026, administrative security clearance hearing
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The DOE Security Office (LSO) raised a Guideline J security concern because the Individual had been charged with
    multiple felony drug offenses between 2012 and 2016, including sales and transportation of controlled substances. The
    Individual was sentenced to four years in prison for the May 2012 offenses and served roughly fifteen months from December
    2012 to March 2014. He later faced additional arrests, a bench warrant in June 2015, and an arrest in November 2016, but
    has not been charged since that time. At the hearing, the Individual testified that the criminal conduct occurred while
    he was unhoused, that he has not engaged in any similar activity for about ten years, and that he now has stable employment
    with a DOE contractor and receives performance awards. The Administrative Judge considered mitigating factors such as
    the passage of time, the change in the Individual’s circumstances, and evidence of rehabilitation. The decision point
    is whether to grant a waiver for the Guideline J concern, allowing the Individual’s access authorization to proceed on
    that basis.
  question: What should the Administrative Judge do regarding the Guideline J security concern for the Individual's access
    authorization?
  options:
    O1:
      do: Grant a waiver for the Guideline J security concern, finding that the Individual’s criminal conduct does not preclude
        access authorization.
      move: act
      irreversible: true
    O2:
      do: Grant a conditional waiver for the Guideline J concern, requiring the Individual to undergo a probationary monitoring
        period before full clearance is granted.
      move: partial
      irreversible: false
    O3:
      do: Hold the decision on the Guideline J concern pending additional evidence of rehabilitation, such as verification
        of participation in a counseling program.
      move: hold
      irreversible: false
    O4:
      do: Deny a waiver for the Guideline J security concern, concluding that the Individual’s criminal conduct remains a
        security risk.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was charged with multiple felony drug offenses between 2012 and 2016, including Sale/Offer to Sell/Transportation
      of Controlled Substance in January 2012, May 2012, May 2015, July 2012, and November 2016.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was sentenced to four years in prison for the May 2012 offenses and was incarcerated from approximately
      December 2012 to March 2014.
  - id: F3
    kind: situation
    status: confirmed
    fact: A bench warrant for the Individual’s arrest was issued in June 2015 after he failed to appear in court.
  - id: F4
    kind: authority
    status: confirmed
    fact: The LSO invoked Guideline J, stating that the Individual’s criminal conduct raises concerns about reliability, judgment,
      and trustworthiness.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Individual testified that the offenses occurred while he was unhoused, that he has not engaged in criminal activity
      for about ten years, and that he has changed his circumstances.
  - id: F6
    kind: situation
    status: assessed
    fact: The Individual currently holds stable employment with a DOE contractor, has received spot awards for performance,
      and is a parent of two children.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Administrative Judge identified mitigating factors (a) the passage of time and changed circumstances, and (d)
      evidence of rehabilitation, as sufficient to address Guideline J concerns.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The judge found that the last alleged criminal act occurred about ten years ago, and the passage of time and changed
      circumstances make recurrence unlikely (mitigating factor a).
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Evidence of rehabilitation – stable DOE‑contractor employment, performance awards, family responsibilities – satisfies
      mitigating factor d.
  - id: C3
    facts:
    - F3
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Although a bench warrant existed in 2015, the judge concluded the individual has not engaged in further criminal
      conduct since 2016, supporting a waiver.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Granting the waiver enables the DOE to retain a capable employee, furthering mission objectives.
  reasoning:
    read: The Individual’s felony drug offenses occurred during a period of homelessness and transient employment; he has
      since re‑established stable, award‑winning DOE‑contractor work and has not been charged for roughly a decade.
    weighing: The Administrative Judge applied Guideline J mitigating factors (a) and (d), concluding that the elapsed time
      and demonstrated rehabilitation outweigh the seriousness of the past conduct. The judge explicitly stated that the behavior
      is unlikely to recur and that the Individual has reformed, thus a waiver is appropriate.
    tradecraft: Record the waiver decision in the official OHA decision docket, cite the specific adjudicative guideline paragraphs,
      and note that the waiver is granted under 50 U.S.C. § 3343(c)(2)(B).
    uncertainty: Minimal; the record shows no recent criminal activity and the judge found the mitigating factors sufficient.
    handoff: The Administrative Judge decides alone, as permitted by 10 C.F.R. § 710.25(d)‑(g). No further agency review is
      required unless appealed.
    tempting_wrong:
      option: O4
      pull: The seriousness of multiple felony drug convictions could suggest a continued security risk.
      why_wrong: The source concluded that the passage of time, changed life circumstances, and evidence of rehabilitation
        sufficiently mitigate that risk.
    rejected:
      O2: A conditional waiver was unnecessary because the judge found the mitigating factors fully satisfied the concern.
      O3: Additional evidence was not required; the judge determined the existing record already demonstrated rehabilitation.
      O4: The judge expressly found the Guideline J concerns resolved and granted a waiver.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to be arrested or charged with a felony after this decision.
      then: O4
      why: New criminal conduct would negate the passage‑of‑time and rehabilitation mitigating factors.
    - id: flip2
      if: The elapsed time since the last offense were less than five years.
      then: O4
      why: The mitigating factor of time elapsed would no longer be satisfied.
    would_not_change:
    - id: noflip1
      if: The Individual resolves the Guideline F tax‑filing issue.
      why: Resolution of a financial concern does not affect the already‑resolved criminal‑conduct concern.
    watch_for:
    - id: watch1
      what: Any new arrest, charge, or conviction for a controlled‑substance offense.
      favors:
      - O4
      why: A new offense would revive the security concern under Guideline J.
  lesson: When a substantial period has passed, the individual’s circumstances have materially improved, and clear evidence
    of rehabilitation exists, a waiver for Guideline J criminal‑conduct concerns can be granted despite prior serious felonies.
  limits: This analysis does not apply where the individual has recent or ongoing criminal conduct, where the offenses involve
    espionage or national‑security‑related crimes, or where mitigating factors such as rehabilitation are absent.
