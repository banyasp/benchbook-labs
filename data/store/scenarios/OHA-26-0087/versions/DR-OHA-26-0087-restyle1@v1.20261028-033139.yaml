case:
  id: DR-OHA-26-0087-restyle1@v1
  title: Guideline F Mitigation Decision for Access Authorization [restyle]
  status: needs_review
  setting: National Energy Security Agency, Office of Personnel Review, July 2026, clearance eligibility assessment.
  decider: Senior Adjudicative Officer
  agent: Senior Adjudicative Officer
  agent_role: decide
  situation: The Local Security Office (LSO) submitted a Guideline F issue, alleging that the applicant neglected to file
    his federal and state income returns for the 2024 tax year. The applicant testified that he did file the 2024 return and
    received a refund, and that he filed the 2025 return after the hearing, but also admitted that several earlier years were
    omitted because he was compensated in cash and never received a W-2. The Officer noted that the 2025 transcript arrived
    after the hearing record was closed, rendering it inadmissible. Under the Adjudicative Guidelines, mitigating factor (a)
    demands that the conduct be sufficiently remote and unlikely to recur, while factor (g) requires a formal arrangement
    with the tax authority—both of which the Officer concluded were unmet. The Officer must determine whether the Guideline
    F issue is mitigated and whether to grant the applicant's clearance.
  question: How should the Senior Adjudicative Officer rule on the applicant's clearance in light of the Guideline F issue?
  options:
    O1:
      do: Refuse the clearance because the Guideline F concern remains unmitigated at this stage.
      move: act
      irreversible: true
    O2:
      do: Request additional tax-history records from the LSO before issuing a final decision.
      move: ask
      irreversible: false
    O3:
      do: Suspend the ruling until the applicant completes a financial-counseling program and submits a tax-compliance plan.
      move: hold
      irreversible: false
    O4:
      do: Issue a conditional waiver that permits clearance if the applicant promptly files all outstanding returns.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The LSO contended that the applicant failed to file his federal and state returns for the 2024 tax year on time.
  - id: F2
    kind: capability
    status: assessed
    fact: The applicant asserted that he filed the 2024 returns, obtained a refund, and also filed the 2025 returns, receiving
      a refund as well.
  - id: F3
    kind: situation
    status: assessed
    fact: He explained that he did not file returns for several earlier years because his wages were paid in cash and he never
      received a W-2, and he could not recall the most recent year he filed.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Officer determined that the 2025 tax transcript was submitted after the hearing record had been closed, so it
      could not be admitted into the file.
  - id: F5
    kind: authority
    status: confirmed
    fact: Guideline F designates failure to file federal or state income taxes as a security-related concern.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Mitigating factor (a) requires the conduct to have occurred long ago, be infrequent, and be unlikely to recur; the
      Officer found this unmet because the applicant's filing lapses spanned multiple years.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Mitigating factor (g) requires a documented arrangement with the tax authority to file or settle the debt; the Officer
      found no evidence of such an arrangement.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Senior Adjudicative Officer is empowered by 10 C.F.R. § 710.7(c) to assess whether granting a clearance would
      jeopardize the common defense and security.
  considerations:
  - id: C1
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The Officer concluded that mitigating factor (a) is unsatisfied because the applicant's tax-filing failures persisted
      over several years, making the conduct neither remote nor unlikely to recur.
  - id: C2
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Mitigating factor (g) calls for a formal arrangement with the tax agency; the record shows none, so the Guideline
      F issue stays unmitigated.
  - id: C3
    facts:
    - F4
    equity: record_integrity
    favors:
    - O1
    weight: strong
    why: Because the 2025 transcript was filed after the record was closed, it cannot be considered, leaving the Officer without
      proof of recent compliance.
  - id: C4
    facts:
    - F5
    - F3
    equity: due_process
    favors:
    - O1
    weight: weak
    why: Guideline F treats any failure to file federal or state returns as a security concern; the applicant's admission
      of multiple years of non-filing suggests a pattern that erodes reliability.
  reasoning:
    read: The LSO raised a Guideline F security issue based on the applicant's tax-filing lapses. The applicant points to
      recent filings, but the record is closed to later evidence and the history of non-filing extends across several years,
      so the conduct is not sufficiently remote nor mitigated by a tax-agency arrangement.
    weighing: 'The Officer applied the Adjudicative Guidelines directly: because mitigating factor (a) is not satisfied (see
      {C1}) and mitigating factor (g) is not satisfied (see {C2}), and because the record cannot be expanded (see {C3}), the
      Guideline F concern persists. These considerations outweigh the isolated evidence of a single year''s filing (see {C4}).'
    tradecraft: Document the denial in the formal decision, cite the governing regulation (10 C.F.R. § 710.7(c) and Guideline
      F), and note that the record was closed per the hearing transcript. No further administrative steps are required beyond
      the official denial.
    uncertainty: Minimal; the analysis provided by the source leaves little doubt about the absence of mitigating factors.
    handoff: The Senior Adjudicative Officer decides independently, as authority is vested in the Officer under 10 C.F.R.
      § 710.7(c). No referral to the LSO or additional fact-finding is mandated.
    tempting_wrong:
      option: O4
      pull: A conditional waiver may seem appealing as it offers the applicant a chance to remedy the tax issue.
      why_wrong: The source explicitly states that without satisfying mitigating factor (a) or (g), a waiver is prohibited;
        granting one would violate the Guideline F requirement.
    rejected:
      O2: Soliciting more tax records would reopen a closed record, which the Officer has already sealed.
      O3: Deferring the ruling for counseling would postpone a final outcome despite the clear lack of mitigation.
      O4: A conditional waiver lacks support because the required mitigating factors are not met.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The applicant furnishes a documented agreement with the tax authority to file and settle all outstanding returns.
      then: O4
      why: Mitigating factor (g) would be satisfied, permitting a conditional waiver.
    - id: flip2
      if: All delinquent filings are shown to have occurred more than ten years ago and the applicant demonstrates an uninterrupted
        period of compliance since then.
      then: O4
      why: Mitigating factor (a) would be satisfied, allowing a waiver.
    would_not_change:
    - id: noflip1
      if: The applicant continues to refuse any tax-history documentation.
      why: The Guideline F issue remains unmitigated, so denial persists.
    watch_for:
    - id: watch1
      what: Any future submission of an IRS-approved tax-compliance plan before the record is formally reopened.
      favors:
      - O4
      why: Such evidence would satisfy mitigating factor (g).
  lesson: In DOE personnel-security adjudications, a Guideline F financial-consideration issue stays unmitigated unless the
    individual can prove the conduct is remote and has a formal arrangement with the tax authority. Absent those mitigating
    factors, clearance must be denied.
  limits: This guidance applies solely to DOE clearance determinations governed by 10 C.F.R. Part 710 and the Adjudicative
    Guidelines; it does not extend to criminal sentencing or civil tax enforcement matters.
