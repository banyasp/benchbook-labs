case:
  id: DR-OHA-26-0087-1@v1
  title: Guideline F Mitigation Decision on Access Authorization
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised a security concern under Guideline F because the Individual failed to file federal
    and state tax returns for tax year 2024. The Individual admitted this failure in a Letter of Intent and testified that
    he later filed the 2024 return and received a refund, as well as filing the 2025 return with a refund shown on an IRS
    transcript. He also testified that he could not recall when he last filed taxes before 2024, suggesting a multi‑year gap,
    and explained that he was paid in cash by a traveling carnival and did not receive tax forms. Guideline F treats failure
    to file tax returns as a reliability and trustworthiness issue. The Administrative Judge noted that the Individual’s failure
    to file extended for years and that there was no evidence of compliance for prior years.
  question: What should the Administrative Judge do regarding the Individual's access authorization under Guideline F?
  options:
    O1:
      do: The Administrative Judge denies the Individual's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks Individual to provide a repayment plan.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge postpones the decision pending additional financial documentation.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge grants the Individual's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office alleged that the Individual failed to file federal and state tax returns for tax year
      2024.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Individual admitted in his Letter of Intent that he did not timely file the 2024 tax returns.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Individual testified that he filed the 2024 tax return and received a refund.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual filed the 2025 tax return, received a refund, and an IRS transcript shows no balance for the 2025
      tax period.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Individual could not recall the last year he filed taxes before 2024, indicating a possible gap back to around
      2020.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual explained that he was paid in cash by a traveling carnival and did not receive W‑2 or 1099 forms.
  - id: F7
    kind: authority
    status: confirmed
    fact: Guideline F defines failure to file tax returns as a security concern affecting reliability and trustworthiness.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Administrative Judge noted that the Individual’s failure to file extended for years and there is no evidence
      of compliance for prior years.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The Individual admitted failure to file the 2024 return and could not recall filing any return for several prior
      years, showing a pattern of non‑compliance that the Judge deemed unmitigated.
  - id: C2
    facts:
    - F6
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline F treats failure to file tax returns as a reliability issue; the Judge found the cash‑payment explanation
      insufficient to excuse the repeated non‑filings.
  - id: C3
    facts:
    - F3
    - F4
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Although the Individual later filed 2024 and 2025 returns, the Judge noted the lack of evidence of compliance for
      earlier years, preventing a finding that the concern was resolved.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Judge applied the Adjudicative Guidelines’ mitigating factor (a) and concluded it was not satisfied because the
      conduct was not sufficiently remote or infrequent.
  reasoning:
    read: Guideline F concerns arise when an individual fails to file required tax returns, raising doubts about reliability
      and trustworthiness. The Individual’s admissions and testimony reveal a multi‑year gap in filing, and the Judge found
      no credible mitigating evidence.
    weighing: The Judge weighed the admitted failures (C1, C2) against the limited remedial actions (C3). Because mitigating
      factor (a) – that the behavior was long ago, infrequent, and unlikely to recur – was not met (see p10.2‑p10.3), the
      balance tipped toward denial, consistent with the source’s conclusion that Guideline F remains unresolved.
    tradecraft: Record the denial in the official decision, cite the specific Guideline F paragraphs, and note that the waiver
      under the Bond Amendment does not override an unresolved Guideline F concern.
    uncertainty: The primary uncertainty is whether additional financial documentation could later demonstrate that the filing
      failures were isolated and remedied; the current record does not support that.
    handoff: The Administrative Judge decides alone, as the regulations grant the Judge sole authority to resolve the security‑clearance
      determination after the hearing.
    tempting_wrong:
      option: O4
      pull: The Individual’s recent tax filings and employment awards might suggest rehabilitation.
      why_wrong: Granting would ignore the unresolved multi‑year non‑filing pattern and the explicit finding that mitigating
        factor (a) was not satisfied.
    rejected:
      O2: A repayment plan would not address the core reliability issue of repeated non‑filing.
      O3: Postponing would delay a decision despite the record already showing that the Guideline F concern is unmitigated.
      O4: Granting would conflict with the Judge’s determination that the Individual has not resolved the Guideline F concern.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual could demonstrate that the failure to file tax returns occurred long ago, was infrequent, and is
        unlikely to recur, satisfying mitigating factor (a).
      then: O4
      why: Guideline F would then be considered mitigated, allowing a grant of the clearance.
    would_not_change:
    - id: noflip1
      if: A Bond‑Amendment waiver is granted.
      why: The denial rests on an unresolved Guideline F concern, which the waiver does not cure.
    watch_for:
    - id: watch1
      what: Submission of credible financial‑counseling documentation or a documented repayment plan that satisfies mitigating
        factor (c) or (d).
      favors:
      - O4
      why: Such evidence could establish that the financial problem is being responsibly addressed, potentially mitigating
        Guideline F.
  lesson: Under Guideline F, repeated or prolonged failure to file tax returns is a disqualifying reliability concern unless
    the individual can show the conduct was remote, infrequent, and unlikely to recur, or provide concrete remediation evidence.
  limits: This analysis applies only to security‑clearance determinations that rely on the DOE Adjudicative Guidelines; it
    does not address criminal sentencing or civil tax enforcement.
