case:
  id: DR-OHA-26-0087-1@v1
  title: Guideline F Mitigation Decision for Access Authorization
  status: draft
  setting: U.S. Department of Energy Office of Hearings and Appeals, March 2026, personnel security clearance review.
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The LSO has raised a security concern under Guideline F, citing the Individual’s failure to file federal and
    state income tax returns for tax year 2024. The Individual testified that he filed the 2024 return and received a refund,
    and that he filed the 2025 return after the hearing, but also admitted he had not filed returns for several prior years
    because he was paid in cash and did not receive tax forms. The Judge noted that the 2025 transcript was submitted after
    the record was closed and therefore cannot be considered. Under the Adjudicative Guidelines, mitigating factor (a) requires
    the conduct to be sufficiently remote and unlikely to recur, and factor (g) requires an arrangement with the tax authority,
    both of which the Judge found unsatisfied. The Judge must decide whether the Guideline F concern is mitigated and whether
    to grant the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline F?
  options:
    O1:
      do: Deny the Individual’s access authorization because Guideline F concerns remain unmitigated at this time.
      move: act
      irreversible: true
    O2:
      do: Ask the LSO for additional tax‑history documentation before making the final overall determination.
      move: ask
      irreversible: false
    O3:
      do: Hold the decision pending the Individual’s completion of financial counseling and a tax‑compliance plan.
      move: hold
      irreversible: false
    O4:
      do: Grant a conditional waiver, allowing access if the Individual files all overdue tax returns promptly.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The LSO alleged that the Individual failed to timely file his federal and state tax returns for tax year 2024.
  - id: F2
    kind: capability
    status: assessed
    fact: The Individual testified that he filed his 2024 tax returns, received a refund, and also filed his 2025 returns
      and received a refund.
  - id: F3
    kind: situation
    status: assessed
    fact: The Individual said he did not file tax returns for several prior years because he was paid in cash and did not
      receive a W‑2, and he could not recall the last year he filed.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Judge determined that the tax transcript for 2025 was submitted after the hearing transcript was received, so
      the record was closed and the information could not be admitted.
  - id: F5
    kind: authority
    status: confirmed
    fact: Guideline F treats failure to file federal or state income tax returns as a security concern.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Mitigating factor (a) requires the conduct to have occurred long ago, be infrequent, and be unlikely to recur; the
      Judge found this factor not satisfied because the Individual’s tax‑filing failures continued for years.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Mitigating factor (g) requires an arrangement with the tax authority to file or pay the owed amount; the Judge found
      no such arrangement.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Administrative Judge has authority under 10 C.F.R. § 710.7(c) to evaluate whether granting an access authorization
      would endanger the common defense and security.
  considerations:
  - id: C1
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The Judge found mitigating factor (a) unsatisfied because the Individual’s tax‑filing failures continued for years,
      so the conduct is not sufficiently remote or unlikely to recur.
  - id: C2
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Mitigating factor (g) requires an arrangement with the tax authority; the record shows no such arrangement, so the
      Guideline F concern remains unmitigated.
  - id: C3
    facts:
    - F4
    equity: record_integrity
    favors:
    - O1
    weight: strong
    why: The 2025 tax transcript was submitted after the record was closed and therefore cannot be admitted, leaving the Judge
      without evidence of recent compliance.
  - id: C4
    facts:
    - F5
    - F3
    equity: due_process
    favors:
    - O1
    weight: weak
    why: Guideline F treats any failure to file federal or state returns as a security concern; the Individual’s admission
      of multiple years of non‑filing demonstrates a pattern that undermines reliability.
  reasoning:
    read: The LSO raised a Guideline F security concern for the Individual’s failure to file tax returns. The Individual claims
      recent compliance, but the record is closed to later evidence and the pattern of non‑filing spans several years, so
      the conduct is not remote nor mitigated by an arrangement with the IRS.
    weighing: 'The Judge applied the Adjudicative Guidelines directly: because mitigating factor (a) is not met (see {C1})
      and mitigating factor (g) is not met (see {C2}), and because the record cannot be expanded (see {C3}), the Guideline F
      concern remains. The weight of these considerations outweighs any isolated evidence of a single year’s filing (see {C4}).'
    tradecraft: Record the denial in the official decision, cite the specific regulatory provisions (10 C.F.R. § 710.7(c)
      and Guideline F), and note that the record was closed per the hearing transcript. No further administrative action is
      required beyond the formal denial.
    uncertainty: Minimal; the source’s own analysis leaves no ambiguity about the lack of mitigation.
    handoff: The Administrative Judge decides alone, as authority is vested in the Judge under 10 C.F.R. § 710.7(c). No referral
      to the LSO or additional fact‑finding is needed.
    tempting_wrong:
      option: O4
      pull: A conditional waiver might appear attractive to give the Individual a chance to cure the tax issue.
      why_wrong: The source explicitly states that without satisfying mitigating factor (a) or (g), a waiver is not permissible;
        granting a conditional waiver would contravene the Guideline F requirement.
    rejected:
      O2: Requesting more tax documentation would reopen the record, which the Judge has already closed.
      O3: Holding the decision pending counseling would delay a final determination despite the clear lack of mitigation.
      O4: A conditional waiver is not supported because the required mitigating factors are not met.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provided a documented arrangement with the tax authority to file and pay all overdue returns.
      then: O4
      why: Mitigating factor (g) would be satisfied, allowing a conditional waiver.
    - id: flip2
      if: All delinquent tax filings were shown to have occurred more than ten years ago and the Individual demonstrated a
        long, uninterrupted period of compliance.
      then: O4
      why: Mitigating factor (a) would be satisfied, permitting a waiver.
    would_not_change:
    - id: noflip1
      if: The Individual continues to refuse to provide any tax‑history documentation.
      why: The Guideline F concern remains unmitigated, so denial stands.
    watch_for:
    - id: watch1
      what: Any future submission of a valid tax compliance plan accepted by the IRS before the record is formally reopened.
      favors:
      - O4
      why: Such evidence would satisfy mitigating factor (g).
  lesson: Under DOE personnel‑security adjudication, a Guideline F financial‑consideration concern remains unmitigated unless
    the individual can demonstrate that the conduct is remote and that an arrangement with the tax authority exists. Without
    those mitigating factors, a security clearance must be denied.
  limits: This analysis applies only to DOE access‑authorization determinations governed by 10 C.F.R. Part 710 and the Adjudicative
    Guidelines; it does not extend to criminal sentencing or civil tax enforcement contexts.
