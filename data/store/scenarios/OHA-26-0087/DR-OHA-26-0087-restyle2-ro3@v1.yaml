case:
  id: DR-OHA-26-0087-restyle2-ro3@v1
  title: Guideline J Criminal Conduct Waiver Decision [restyle]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy, March 2026, security clearance adjudication
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The DOE Security Office (LSO) cited a Guideline J concern because the applicant had been charged with several
    felony drug offenses from 2012 through 2016, encompassing sale, offer to sell, and transportation of controlled substances.
    The applicant received a four-year prison sentence for the May 2012 offenses and served roughly fifteen months from December
    2012 to March 2014. Subsequent legal events include a bench warrant issued in June 2015 after a failure to appear in court
    and an arrest in November 2016; no charges have been filed since. At the hearing, the applicant asserted that the conduct
    occurred while he was unhoused, that he has abstained from similar behavior for about a decade, and that he now holds
    steady employment with a DOE contractor and has earned performance recognitions. The Judge weighed mitigating considerations
    such as the elapsed time, the applicant's changed life circumstances, and documented rehabilitation. The decision hinges
    on whether to issue a waiver for the Guideline J issue, thereby permitting the applicant's access authorization to move
    forward.
  question: How should the Administrative Law Judge resolve the Guideline J security concern in relation to the applicant's
    access authorization?
  options:
    O1:
      do: Issue a waiver conditioned on a probationary monitoring period, requiring the applicant to satisfy additional oversight
        before a final clearance is awarded.
      move: partial
      irreversible: false
    O2:
      do: Postpone the waiver determination pending further proof of rehabilitation, such as verification of participation
        in a counseling or treatment program.
      move: hold
      irreversible: false
    O3:
      do: Issue a full waiver for the Guideline J concern, determining that the applicant's past criminal conduct does not
        bar the grant of an access authorization.
      move: act
      irreversible: true
    O4:
      do: Refuse to grant a waiver for the Guideline J concern, concluding that the applicant's criminal history continues
        to pose an unacceptable security risk.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The applicant faced multiple felony drug charges between 2012 and 2016, including sales or offers to sell and transportation
      of a controlled substance in January 2012, May 2012, May 2015, July 2012, and November 2016.
  - id: F2
    kind: situation
    status: confirmed
    fact: For the May 2012 offenses, the applicant was sentenced to four years' confinement and was incarcerated from approximately
      December 2012 through March 2014.
  - id: F3
    kind: situation
    status: confirmed
    fact: A bench warrant was issued in June 2015 after the applicant failed to appear for a scheduled court proceeding.
  - id: F4
    kind: authority
    status: confirmed
    fact: The LSO invoked Guideline J, asserting that the applicant's criminal conduct raises doubts about reliability, judgment,
      and trustworthiness.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The applicant testified that the offenses took place while he was experiencing homelessness, that he has abstained
      from criminal activity for roughly ten years, and that his personal circumstances have materially improved.
  - id: F6
    kind: situation
    status: assessed
    fact: The applicant presently maintains stable employment with a DOE contractor, has received spot awards for job performance,
      and is a parent of two children.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Judge identified mitigating factors (a) the passage of time and changed circumstances, and (d) evidence of rehabilitation,
      as sufficient to address the Guideline J concerns.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The Judge noted that the most recent alleged criminal act occurred about ten years ago; the considerable lapse of
      time and the applicant's altered life situation reduce the likelihood of recurrence (mitigating factor a).
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Documented rehabilitation—steady DOE-contractor employment, performance awards, and family responsibilities—fulfills
      mitigating factor d.
  - id: C3
    facts:
    - F3
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Although a bench warrant was issued in 2015, the Judge concluded that the applicant has not engaged in further criminal
      conduct since the 2016 arrest, supporting a waiver.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Granting the waiver preserves a capable employee for the DOE, thereby advancing mission objectives.
  reasoning:
    read: The applicant's felony drug offenses transpired during a period of homelessness and unstable employment; since then,
      he has secured consistent, award-winning work with a DOE contractor and has avoided any criminal charges for roughly
      a decade.
    weighing: The Judge applied Guideline J mitigating factors (a) and (d), determining that the elapsed time and demonstrated
      rehabilitation outweigh the seriousness of the historic conduct. The Judge expressly stated that recidivism is unlikely
      and that the applicant has reformed, justifying a waiver.
    tradecraft: Enter the waiver decision in the official OHA docket, cite the pertinent adjudicative guideline sections,
      and record that the waiver is issued pursuant to 50 U.S.C. § 3343(c)(2)(B).
    uncertainty: Low; the record shows no recent criminal activity and the Judge found the mitigating factors adequate.
    handoff: The Administrative Law Judge decides unilaterally, as authorized by 10 C.F.R. § 710.25(d)-(g). No further agency
      review is required unless an appeal is filed.
    tempting_wrong:
      option: O4
      pull: The gravity of multiple felony drug convictions might suggest an ongoing security threat.
      why_wrong: The source concluded that the passage of time, altered circumstances, and documented rehabilitation sufficiently
        mitigate that threat.
    rejected:
      O1: A conditional waiver was deemed unnecessary because the mitigating factors were judged to fully satisfy the Guideline
        J concern.
      O2: Additional evidence was not required; the Judge determined that the existing record already demonstrated rehabilitation.
      O4: The Judge expressly found the Guideline J concerns resolved and granted a waiver.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The applicant were to be arrested or charged with a felony after this decision.
      then: O4
      why: New criminal conduct would nullify the mitigating effect of elapsed time and rehabilitation.
    - id: flip2
      if: The interval since the last offense were less than five years.
      then: O4
      why: The time-elapsed mitigating factor would no longer be satisfied.
    would_not_change:
    - id: noflip1
      if: The applicant resolves the Guideline F tax-filing issue.
      why: Resolution of a financial matter does not alter the already-addressed criminal-conduct concern.
    watch_for:
    - id: watch1
      what: Any subsequent arrest, charge, or conviction involving a controlled-substance offense.
      favors:
      - O4
      why: A new offense would reactivate the security concern under Guideline J.
  lesson: When a considerable interval has elapsed, the individual's personal circumstances have markedly improved, and clear
    evidence of rehabilitation is present, a waiver for Guideline J criminal-conduct concerns may be granted despite prior
    serious felonies.
  limits: This guidance does not extend to cases where the individual has recent or ongoing criminal activity, where the offenses
    pertain to espionage or national-security-related crimes, or where mitigating factors such as rehabilitation are absent.
