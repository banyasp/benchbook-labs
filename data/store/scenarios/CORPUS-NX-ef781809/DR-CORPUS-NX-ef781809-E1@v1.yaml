case:
  id: DR-CORPUS-NX-ef781809-E1@v1
  title: Choosing a Staffing Approach
  status: draft
  setting: Washington, Navy OP-20-G, after the civilian expert's 1923 resignation
  decider: The deciding body in the Navy section
  agent: The deciding body in the Navy section
  agent_role: decide
  situation: After the civilian cryptanalyst's 1923 resignation, a vacancy remained in the Navy section. Another civilian
    expert had not yet joined the section. The body faced a choice between relying on civilian expertise and assigning a commissioned
    Navy officer to the work. Officer staffing was described as allowing the Navy to replace the officer and control whether
    he could leave.
  question: What should the deciding body do about staffing the cryptanalytic role after the civilian expert's departure?
  options:
    O1:
      do: The body replaces civilian expertise with commissioned Navy staffing for the cryptanalytic role.
      move: act
      irreversible: false
    O2:
      do: The body retains civilian expertise as its staffing choice for the cryptanalytic role.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The civilian expert's 1923 resignation left a vacancy in the section.
  - id: F2
    kind: situation
    status: assessed
    fact: Another civilian specialist had not yet joined the section.
  - id: F3
    kind: situation
    status: confirmed
    fact: The staffing choice was between relying on a civilian expert and assigning a commissioned Navy officer.
  - id: F4
    kind: capability
    status: assessed
    fact: The stated advantage of officer staffing was that the Navy could replace the officer.
  - id: F5
    kind: authority
    status: assessed
    fact: The officer could not leave unless the Navy Department allowed it.
  - id: F6
    kind: situation
    status: assessed
    fact: Several classmates recommended the officer who was selected for the role.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The resignation left a vacancy before another civilian specialist had joined, making the staffing choice immediate;
      the source does not say that civilian expertise was inferior.
  - id: C2
    facts:
    - F4
    - F5
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The stated reason for choosing a commissioned officer was that the Navy could replace him and he could not leave
      without Navy Department permission.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Several classmates recommended the officer who was selected, providing some support for that selection, though the
      source does not describe the recommendation criteria.
  reasoning:
    read: This was a staffing and personnel-control choice after a vacancy, not a choice about cryptanalytic methods. The
      trap is to treat the decision as a finding that civilian expertise was less capable; the stated rationale instead concerned
      the Navy's ability to replace and retain an officer.
    weighing: The vacancy and the officer's recommendations support filling the role with the selected officer, but only modestly.
      The decisive stated reason is the Navy's ability to replace him and control whether he could leave {C2}; the source
      gives no comparison of civilian and officer analytic ability. The balance therefore depends on the value the deciding
      body placed on personnel control and replaceability.
    tradecraft: Record the staffing rationale and the basis for selecting the officer, distinguishing the stated personnel-control
      rationale from any unsupported claim about comparative analytic skill. Reassess the choice if the replacement or retention
      assumptions change.
    uncertainty: The source gives the body's stated reason and notes the classmates' recommendations, but does not explain
      the recommendation criteria or compare the candidates' qualifications.
    handoff: The deciding body could choose the staffing arrangement, while the Navy Department's permission was relevant
      to whether the officer could leave; involve that department on retention authority as needed.
    tempting_wrong:
      option: O2
      pull: Retaining civilian expertise may seem preferable because the departing worker was a civilian cryptanalyst.
      why_wrong: The source does not say the body rejected civilian expertise as less capable; its stated reason for O1 was
        the Navy's ability to replace and retain an officer.
    rejected:
      O2: The body did not retain civilian expertise because it chose an officer whom the Navy could replace and whose departure
        it could control.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The officer could not in practice be replaced, and the Navy could not control whether he left.
      then: O2
      why: That would remove the stated personnel-control advantage that was decisive in choosing officer staffing.
    would_not_change:
    - id: noflip1
      if: Further evidence showed only that civilian expertise remained valuable, without changing the vacancy or the Navy's
        stated need for replaceability and control.
      why: The source does not reject civilian expertise; that evidence alone would not displace the stated reason for selecting
        an officer.
    watch_for:
    - id: watch1
      what: Whether the Navy retains the practical ability to replace the officer and control his departure.
      favors:
      - O1
      why: Those were the stated advantages of officer staffing.
  lesson: 'When choosing between civilian and commissioned staffing, distinguish capability from institutional control: do
    not infer that one group is less competent unless the evidence says so. Give weight to the source''s stated personnel-control
    rationale, while checking whether that rationale still holds.'
  limits: This reasoning applies to the staffing choice described, not to the merits of civilian or military cryptanalytic
    work generally. The source supplies no comparative qualifications or evidence that officer staffing improved analytic
    results.
