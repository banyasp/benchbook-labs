case:
  id: DR-CORPUS-NX-30b62a7f-E3@v1
  title: Identity in a Report
  status: draft
  setting: At NSA, before report dissemination, under Section 7.
  decider: The appropriate approval authority
  agent: The appropriate approval authority
  agent_role: decide
  situation: A report contains foreign intelligence concerning a U.S. person. The governing rule generally calls for omitting
    the person’s identity and substituting a generic term. The rule permits identifying the person under specified conditions,
    provided the appropriate approval authority determines that the recipient needs the identity for official duties. The
    record at the decision point establishes no finding that an exception applies or that the recipient needs the identity.
    The approval authority must decide whether the report will include the identity or use a generic term.
  question: What should the appropriate approval authority do with the U.S. person’s identity in the report?
  options:
    O1:
      do: The appropriate approval authority shall withhold the U.S. person’s identity from the report and use a generic term.
      move: act
      irreversible: false
    O2:
      do: The appropriate approval authority shall disclose the U.S. person’s identity in the report to the recipient.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Foreign intelligence concerning a U.S. person is generally disseminated without identifying the person, using a
      generic term in place of the identity.
  - id: F2
    kind: authority
    status: confirmed
    fact: An identity may be included only under a specified condition and after the appropriate approval authority determines
      that the recipient needs it for official duties.
  - id: F3
    kind: authority
    status: confirmed
    fact: One specified condition is the U.S. person’s consent to dissemination, documented by the prescribed consent form.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Another specified condition is that the identity information is publicly available and derived from unclassified
      information available to the general public.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: An identity may be included when it is necessary to understand the foreign intelligence information or assess its
      importance.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: A listed example permitting identification is information indicating that the identity is pertinent to a possible
      threat to any person’s or organization’s safety.
  - id: F7
    kind: authority
    status: confirmed
    fact: 'Approval authority depends on the circumstances: specified identities and purposes require senior approval, while
      other releases require prior approval from designated intelligence officials.'
  - id: F8
    kind: situation
    status: confirmed
    fact: For this scenario, the record before the approval authority establishes neither that an exception applies nor that
      the recipient needs the identity.
  considerations:
  - id: C1
    facts:
    - F1
    equity: usp_privacy
    favors:
    - O1
    weight: strong
    why: The directive sets omission and use of a generic term as the default for foreign intelligence concerning a U.S. person.
  - id: C2
    facts:
    - F2
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: Including the identity requires both a specified condition and an approval-authority determination that the recipient
      needs it for official duties; neither is established here.
    rules_out:
    - O2
  - id: C3
    facts:
    - F5
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The directive recognizes that identification can be allowed when necessary to understand or assess foreign intelligence,
      including when pertinent to a possible safety threat. The record does not establish that such an exception applies.
  reasoning:
    read: 'This is a dissemination decision governed by a privacy-protective default, not a general choice to reveal an identity
      whenever it might be useful. The trap is treating a listed exception as sufficient by itself: the recipient must also
      need the identity for official duties, as determined by the appropriate approval authority.'
    weighing: The generic-term default favors O1, and the required exception and official-duty finding are absent. The directive
      does recognize possible intelligence or safety reasons for identification, but those possibilities do not displace the
      default without the required findings. If a specified condition and recipient need were established, the balance could
      change, subject to the applicable approval authority.
    tradecraft: Use a generic term in the report and do not make an unsupported exception finding. Keep files containing identities
      deleted from reports for no more than one year; direct later requests for those identities to the designated information-sharing
      office.
    uncertainty: The record establishes no applicable exception and no recipient need. That supports withholding on this record;
      it does not establish that an exception could never apply in a different case.
    handoff: Apply the approval tier assigned to the circumstances under Section 7.3. If the proposed dissemination concerns
      privileged communications or U.S. criminal activity or proceedings, obtain the required Office of General Counsel review
      before dissemination.
    tempting_wrong:
      option: O2
      pull: The identity might help a recipient understand intelligence or assess a possible safety threat.
      why_wrong: Those are recognized grounds for considering identification, not a blanket authorization; the record establishes
        neither an applicable exception nor the required official-duty need.
    rejected:
      O2: The directive permits identification only when a specified condition applies and the appropriate approval authority
        determines that the recipient needs the identity for official duties, neither of which is established here.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The person has given consent documented by the prescribed form, or the identity information is publicly available
        from unclassified information available to the general public, and the appropriate authority determines the recipient
        needs the identity for official duties.
      then: O2
      why: Either condition is an express basis for including an identity, but the official-duty need determination is also
        required.
    - id: flip2
      if: The appropriate authority determines that identifying the person is necessary to understand the foreign intelligence
        or assess its importance, including because the identity is pertinent to a possible threat to safety, and also determines
        the recipient needs it for official duties.
      then: O2
      why: The directive identifies necessity for understanding or assessing the information as a basis for identification
        and gives safety relevance as an example; recipient need remains an additional requirement.
    would_not_change:
    - id: noflip1
      if: The recipient needs the identity for official duties, but no specified condition for identifying the person applies.
      why: Recipient need alone does not satisfy the directive's separate condition for including the identity.
    - id: noflip2
      if: A specified condition applies, but the appropriate approval authority does not determine that the recipient needs
        the identity for official duties.
      why: An exception condition alone is insufficient under the directive's combined test.
    watch_for:
    - id: watch1
      what: Evidence that the identity is pertinent to a possible threat to the safety of a person or organization.
      favors:
      - O2
      why: The directive lists this as a potential basis for identifying a U.S. person, while still requiring a finding that
        the recipient needs the identity for official duties.
  lesson: When a policy makes nondisclosure the default and permits disclosure only under specified conditions, apply each
    condition rather than treating possible usefulness as authorization. Use the identity only after the required need finding
    and approval are in place.
  limits: This reasoning applies to dissemination of foreign intelligence concerning a U.S. person under Section 7. It does
    not decide a case in which an exception and the recipient's official-duty need have been established.
  library:
    domain: intel-oversight
    family: CORPUS-NX-30b62a7f
    source: https://assets.aclu.org/live/uploads/document/foia/January_25,_2011_United_States_Signals_Intelligence_Directive_18.pdf
    episode_focus: The default is to omit the identity, but the directive allows identification under specified conditions
      and when the recipient needs it for official duties; it also assigns approval authority according to the circumstances.
      Frame the decision around that privacy-versus-intelligence or official-duty standard, and exclude any operational collection
      details.
    cues:
      option_words:
        O1: 18
        O2: 16
      real_option: O1
      real_to_mean_other_length: 1.12
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The USSID's Sections 7.1–7.2 set generic wording as the default and permit identification only under enumerated conditions
  when the recipient needs the identity for official duties.
