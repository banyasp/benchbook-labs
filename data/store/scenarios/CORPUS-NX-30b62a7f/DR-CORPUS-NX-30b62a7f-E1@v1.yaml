case:
  id: DR-CORPUS-NX-30b62a7f-E1@v1
  title: Emergency Authorization Decision
  status: draft
  setting: Emergency decision point, DIRNSA/CHCSS, involving a U.S. person outside the United States.
  decider: DIRNSA/CHCSS
  agent: DIRNSA/CHCSS
  agent_role: decide
  situation: The decision concerns proposed emergency collection of information to, from, or about a U.S. person outside the
    United States. The official must distinguish emergency authority from collection that separately requires FISA authorization.
    Prior Attorney General approval may be impractical when delay risks losing significant foreign intelligence and substantially
    harming national security, or when a person or government property is believed to face immediate danger. Most emergency
    authorizations require probable cause that the target meets a specified foreign-power-related criterion; the life-or-physical-safety
    emergency is excepted from that requirement. General Counsel must be notified immediately, and efforts to obtain Attorney
    General approval to continue must begin immediately. Without Attorney General approval within 72 hours, the collection
    must end; if approved, it may continue for the period specified in the approval.
  question: 'What should DIRNSA/CHCSS do: wait for prior Attorney General approval or authorize emergency collection under
    the stated authority?'
  options:
    O1:
      do: DIRNSA/CHCSS holds the request pending prior Attorney General approval.
      move: hold
      irreversible: false
    O2:
      do: DIRNSA/CHCSS authorizes emergency collection under the stated authority.
      move: act
      irreversible: true
    O3:
      do: DIRNSA/CHCSS declines emergency authorization and awaits prior Attorney General approval.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: DIRNSA/CHCSS may authorize emergency collection unless separate authorization under FISA is required by law.
  - id: F2
    kind: authority
    status: confirmed
    fact: Collection constituting electronic surveillance may be authorized only in accordance with FISA.
  - id: F3
    kind: situation
    status: confirmed
    fact: The emergency authority described applies to information to, from, or about a U.S. person outside the United States
      when prior Attorney General approval is not practical.
  - id: F4
    kind: authority
    status: confirmed
    fact: One qualifying urgency is that delay would cause the loss of significant foreign intelligence and substantial harm
      to national security.
  - id: F5
    kind: authority
    status: confirmed
    fact: Other qualifying urgencies are a reasonable belief that a person's life or physical safety, or the physical security
      of a defense installation or government property, is in immediate danger.
  - id: F6
    kind: authority
    status: confirmed
    fact: Except for the life-or-physical-safety emergency category, DIRNSA/CHCSS must find probable cause that the target
      meets one of the specified foreign-power-related criteria.
  - id: F7
    kind: authority
    status: confirmed
    fact: The specified target criteria include acting for or on behalf of a foreign power in listed activities, being its
      officer or employee, unlawfully acting at its direction, being an entity it owns or controls, or collaborating with
      its intelligence or security service to provide access to U.S.-classified information or material.
  - id: F8
    kind: authority
    status: confirmed
    fact: The General Counsel must be notified immediately when emergency collection starts, and must immediately begin efforts
      to obtain Attorney General approval to continue.
  - id: F9
    kind: authority
    status: confirmed
    fact: If Attorney General approval is not obtained within 72 hours, the collection must be terminated; if approval is
      obtained, it may continue for the period specified in the approval.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    - F5
    equity: tempo
    favors:
    - O2
    weight: strong
    why: When prior Attorney General approval is impractical and a stated emergency exists, the directive permits DIRNSA/CHCSS
      to act without waiting; waiting could lose significant foreign intelligence and substantially harm national security,
      or leave an immediate danger unaddressed.
  - id: C2
    facts:
    - F2
    equity: lawful_authority
    favors:
    - O1
    - O3
    weight: strong
    why: 'Emergency authority does not displace FISA: collection that constitutes electronic surveillance may be authorized
      only in accordance with FISA, and the emergency authority applies unless separate FISA authorization is required.'
  - id: C3
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: For emergency categories other than the life-or-physical-safety category, authorization depends on probable cause
      that the target meets a specified foreign-power-related criterion; the life-or-physical-safety category is expressly
      excepted.
  - id: C4
    facts:
    - F8
    - F9
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The directive pairs emergency action with immediate General Counsel notification and immediate efforts to obtain
      Attorney General approval to continue; collection must end if approval is not obtained within 72 hours.
  reasoning:
    read: 'This is a conditional emergency authority for information concerning a U.S. person outside the United States, not
      a general substitute for FISA. The central trap is treating urgency as sufficient by itself: the stated emergency must
      apply, and collection separately requiring FISA authorization remains subject to FISA.'
    weighing: On the stated premise that prior approval is impractical because a qualifying emergency exists, the directive's
      reason for allowing action now is that delay may forfeit significant foreign intelligence and substantially harm national
      security, or leave a person or government property in immediate danger {C1}. That supports {O2}, subject to the FISA
      limit {C2} and the applicable probable-cause requirement or express life-safety exception {C3}. The balance also depends
      on carrying out the required notification, approval efforts, and 72-hour termination rule {C4}.
    tradecraft: Before acting, determine and record which stated emergency condition makes prior approval impractical and
      whether separate FISA authorization is required. If emergency collection begins, notify General Counsel immediately
      and ensure immediate efforts to obtain Attorney General approval to continue; terminate by 72 hours if approval has
      not been obtained, or follow the approved period if it has.
    uncertainty: The directive supplies authorization criteria but does not establish which emergency condition or target
      criterion is present in a particular case. The choice of {O2} therefore rests on the scenario's qualifying-emergency
      premise and remains bounded by the separate-FISA rule.
    handoff: DIRNSA/CHCSS makes the emergency authorization decision, but General Counsel must be notified immediately and
      must immediately initiate efforts to obtain Attorney General approval to continue.
    tempting_wrong:
      option: O1
      pull: Waiting preserves prior review and avoids beginning collection before Attorney General approval.
      why_wrong: Where the stated emergency makes prior approval impractical, waiting may produce the very loss of significant
        foreign intelligence and substantial national-security harm, or leave the stated immediate danger unaddressed, that
        the emergency authority is designed to avoid.
    rejected:
      O1: It was not chosen because, on the qualifying-emergency premise, holding for prior approval risks the harms that
        make emergency authorization available.
      O3: It was not chosen because declining emergency authorization would forgo the directive's permitted response to a
        qualifying emergency, subject to its legal limits and safeguards.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed collection is electronic surveillance for which separate FISA authorization is required by law.
      then: O3
      why: The directive makes its emergency authority subject to separate FISA requirements, so emergency authorization alone
        would not provide the required authority.
    - id: flip2
      if: The emergency is not the life-or-physical-safety category and probable cause does not support any specified target
        criterion.
      then: O3
      why: Outside the stated life-or-physical-safety exception, the directive requires a probable-cause finding that the
        target meets a specified criterion.
    - id: flip3
      if: Prior approval is practical and none of the stated emergency conditions applies.
      then: O1
      why: The stated basis for bypassing prior approval is that it is impractical because of a qualifying emergency; without
        that basis, the emergency authorization rationale no longer supports proceeding under this authority.
    would_not_change:
    - id: noflip1
      if: Attorney General approval to continue is not obtained within 72 hours after emergency collection starts.
      why: 'That changes what must happen after the initial decision, not the initial choice on the qualifying-emergency premise:
        the directive requires termination.'
    watch_for: []
  lesson: Use emergency authority only when prior approval is impractical for a stated emergency reason, and first distinguish
    that authority from collection requiring separate FISA authorization. Emergency action remains bounded by the applicable
    target finding, immediate General Counsel notification, prompt efforts to obtain Attorney General approval, and the 72-hour
    termination rule.
  limits: This conclusion applies only to the directive's stated emergency authority for information to, from, or about a
    U.S. person outside the United States. It does not resolve whether a particular collection constitutes electronic surveillance,
    whether separate FISA authorization is required, or whether the facts establish an emergency or probable cause.
