case:
  id: DR-CORPUS-NX-7860a714-E14@v1
  title: Washington's Iran Policy Decision
  status: draft
  setting: Washington and Israel, during the administration's deliberations over Iran policy.
  decider: The administration in Washington
  agent: The administration in Washington
  agent_role: decide
  situation: Israeli leadership was weighing the pros and cons of using force against Iran. A senior Israeli defense official
    had called for an accelerated timetable for action. Washington faced requests for assurances and support related to the
    contemplated action. The administration in Washington viewed action as premature amid fatigue from two wars and dissatisfaction
    over the lack of progress on the Palestinian issue. Assessments included that force could delay Iran's nuclear program
    but could not conventionally destroy it, and might reinforce Iran's perceived interest in acquiring a nuclear weapons
    capability.
  question: What should the administration in Washington do about providing assurances and requested support for Israel's
    contemplated use of force against Iran?
  options:
    O1:
      do: The administration in Washington should reject assurances and requested support for Israel's contemplated use of
        force.
      move: act
      irreversible: false
    O2:
      do: The administration in Washington should approve assurances and requested support for Israel's contemplated use of
        force.
      move: act
      irreversible: false
    O3:
      do: The administration in Washington should consult Israeli leadership before deciding whether to provide assurances
        and requested support.
      move: ask
      irreversible: false
      to: Israeli leadership
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Israeli leadership was weighing the pros and cons of using force against Iran.
  - id: F2
    kind: situation
    status: confirmed
    fact: A senior Israeli defense official called for a speeded-up timetable for action against Iran.
  - id: F3
    kind: situation
    status: confirmed
    fact: Israel requested support from Washington related to a contemplated action against Iran.
  - id: F4
    kind: situation
    status: assessed
    fact: The administration in Washington considered action premature.
  - id: F5
    kind: situation
    status: assessed
    fact: Washington was weary of two wars and dissatisfied with the lack of progress on the Palestinian issue.
  - id: F6
    kind: capability
    status: assessed
    fact: A potential Israeli attack might delay Iran's nuclear program but could not conventionally destroy it.
  - id: F7
    kind: situation
    status: assessed
    fact: A potential attack could confirm Iran's strategic interest in procuring a nuclear weapons capability.
  - id: F8
    kind: authority
    status: confirmed
    fact: The administration in Washington maintained that Washington, rather than Israel, would decide U.S. policy on Iran.
  - id: F9
    kind: situation
    status: assessed
    fact: The policy contingencies included sanctions leading to Iranian agreement, extended diplomacy, containment of a nuclear
      Iran, or war initiated by Israel or the United States.
  considerations:
  - id: C1
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The assessment was that an Israeli attack might delay Iran's program but could not conventionally destroy it, limiting
      the prospect that supporting force would achieve the stated purpose.
  - id: C2
    facts:
    - F7
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: A potential attack could confirm Iran's strategic interest in procuring a nuclear weapons capability, so force might
      reinforce the very interest it was meant to address.
  - id: C3
    facts:
    - F4
    - F5
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Washington considered action premature and was weary of two wars; its dissatisfaction over the lack of progress on
      the Palestinian issue also formed part of the policy context in which it limited Israel's options.
  reasoning:
    read: Israel was weighing a consequential use of force, while Washington faced requests for assurances and support. The
      trap is to treat an accelerated timetable as a reason to back force without accounting for the assessment that it could
      delay, but not conventionally destroy, Iran's program and might strengthen Iran's perceived strategic interest in acquiring
      a nuclear capability.
    weighing: 'The balance favors rejecting assurances and requested support: the administration considered action premature,
      was weary of two wars, and assessed that an attack could have limited effect while reinforcing Iran''s motivation {C1}
      {C2} {C3}. The possibility of delay does not outweigh those stated concerns. This balance depends on the assessments
      of the attack''s limited effectiveness and potential effect on Iran''s strategic interests; it does not establish that
      sanctions or diplomacy would succeed.'
    tradecraft: State the decision as a policy choice by the administration, record the assessments supporting the refusal
      and the limits of what they establish, and communicate clearly that assurances and requested support are not being provided.
    uncertainty: Whether a potential attack would succeed is open to serious debate. The assessment is that it could delay
      Iran's program but could not conventionally destroy it, and might confirm Iran's strategic interest in acquiring a nuclear
      weapons capability. The listed policy contingencies include sanctions, extended diplomacy, containment, and war; which
      would follow remains unresolved.
    handoff: 'The administration in Washington should make the U.S. policy decision itself: the stated position was that Washington,
      not Israel, would decide U.S. policy on Iran. Consultation with Israeli leadership is not identified as a prerequisite
      to that decision.'
    tempting_wrong:
      option: O2
      pull: Backing Israel could appear to offer a way to act against Iran's nuclear program when the prospect of a diplomatic
        resolution was described as slim.
      why_wrong: That possibility does not answer the stated concerns that force could only delay the program conventionally
        and could confirm Iran's interest in acquiring a nuclear capability.
    rejected:
      O2: The administration did not approve assurances or support because it considered action premature and assessed that
        an attack could have limited effect while reinforcing Iran's strategic interest.
      O3: Consultation was not the recorded outcome; the administration asserted that Washington, rather than Israel, would
        decide U.S. policy and declined to provide assurances.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A materially changed assessment found that the contemplated action could destroy, rather than merely delay, Iran's
        program and would not reinforce Iran's perceived interest in acquiring a nuclear capability.
      then: O2
      why: That would alter the two central concerns about limited effectiveness and the potential strategic consequence of
        an attack.
    - id: flip2
      if: The administration needed additional information from Israeli leadership before it could assess the consequences
        of the contemplated action.
      then: O3
      why: Consultation could then be a prudent step before making the support decision, rather than a substitute for Washington's
        responsibility to decide U.S. policy.
    would_not_change:
    - id: noflip1
      if: An Israeli official continued to call for an accelerated timetable without a material change in the assessments
        of effectiveness and strategic consequences.
      why: Urgency alone would not address the concerns that force could not conventionally destroy the program and could
        reinforce Iran's strategic interest.
    watch_for:
    - id: watch1
      what: Whether the underlying assessments of the potential attack's effectiveness or its effect on Iran's strategic interests
        change.
      favors:
      - O1
      - O3
      why: A change could warrant reassessment or further consultation; absent such a change, the stated reasons for withholding
        support remain.
  lesson: 'Do not equate urgency with effectiveness: weigh whether the proposed action can achieve its purpose and whether
    it could strengthen the adversary''s motivation. When the decision concerns national policy, the responsible administration
    should own the choice and explain the limits of its assessments.'
  limits: This reasoning concerns whether Washington should provide assurances and requested support for the contemplated
    use of force, not how any action would be conducted. It does not establish that sanctions or diplomacy would succeed,
    or resolve which of the listed policy contingencies would occur.
