    domain: intel-analysis
    family: CORPUS-NX-4228d5a2
    source: https://www.airandspaceforces.com/PDF/AircraftAccidentReports/Documents/2011/071011_MQ-1B_Afghanistan.pdf
    episode_focus: The decision point is the Board President’s analytical judgment that the available evidence did not establish
      a cause, while ruling out several possible explanations. Consider the evidence limitations and the basis for the conclusion;
      exclude the crew’s lost-link response and other operational procedures.
