case:
  id: DR-CORPUS-NX-4228d5a2-E1@v1
  title: Assessing the Cause of the Mishap
  status: draft
  setting: AAIB mishap investigation, following the MA’s loss of RL at 1953Z.
  decider: the Board President
  agent: the Board President
  agent_role: decide
  situation: At 1953Z, the MA lost its RL and is presumed to have crashed; the wreckage has not been located. The absence
    of wreckage left investigators without post-mishap physical evidence and limited the evidence available to identify an
    exact cause. The investigation drew on witness statements, maintenance records, expert consultation, technical analysis,
    weather data, and other relevant documents. Computer data received from the MA before the loss of RL was also technically
    reviewed. Satellite signal strength was normal, and the MA was responsive at the time of the loss. Maintenance records
    showed no relevant discrepancies, while the LN100G had reported a failure and its navigation and autopilot data appeared
    normal through the remaining logs.
  question: What should the Board President conclude about the listed potential causes and whether the available evidence
    establishes an exact cause?
  options:
    O1:
      do: The Board President excludes weather, icing, GCS or MC performance, maintenance discrepancies, and LN100G failure
        from the possible causes, while leaving the exact cause undetermined.
      move: act
      irreversible: false
    O2:
      do: The Board President includes weather, icing, GCS or MC performance, maintenance discrepancies, and LN100G failure
        among the possible causes, while leaving the exact cause undetermined.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: At 1953Z, the MA lost its RL.
  - id: F2
    kind: situation
    status: assessed
    fact: The MA is presumed to have crashed.
  - id: F3
    kind: situation
    status: confirmed
    fact: The wreckage has not been located.
  - id: F4
    kind: situation
    status: confirmed
    fact: Without wreckage, investigators lacked post-mishap physical evidence, limiting their ability to determine the exact
      cause.
  - id: F5
    kind: situation
    status: confirmed
    fact: The investigation considered witness statements, maintenance records, expert consultation, technical analysis, weather
      data, and other relevant documents.
  - id: F6
    kind: situation
    status: confirmed
    fact: Technical analysis reviewed computer data received from the MA before the loss of RL.
  - id: F7
    kind: capability
    status: assessed
    fact: At the time of the loss, satellite signal strength was normal and the MA was responsive.
  - id: F8
    kind: situation
    status: confirmed
    fact: Maintenance records showed no relevant discrepancies, and there was no evidence of negative maintenance trends or
      issues.
  - id: F9
    kind: capability
    status: assessed
    fact: The LN100G reported a failure, while its navigation and autopilot data appeared normal through the remaining logs
      and the MA automatically switched to Novatel GPS navigation.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    - O1
    weight: strong
    why: The missing wreckage left investigators without post-mishap physical evidence and limited their ability to identify
      the exact cause. That warrants leaving the exact cause undetermined, but does not by itself prevent excluding explanations
      where other evidence is sufficient.
  - id: C2
    facts:
    - F5
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The investigation considered weather data and other evidence, and the MA had normal satellite signal strength and
      was responsive. The Board President found the evidence sufficient to rule out weather, icing, and GCS or MC performance
      as causes.
  - id: C3
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: There were no relevant maintenance discrepancies or negative maintenance trends, supporting the conclusion that maintenance
      discrepancies did not cause the mishap.
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Although the LN100G reported a failure, its navigation and autopilot data appeared normal through the remaining logs,
      and the MA automatically switched to Novatel GPS navigation. The Board President concluded that the LN100G failure was
      not responsible.
  reasoning:
    read: The exact cause remains undetermined because the wreckage was not recovered, but the evidentiary limit is not a
      reason to treat every proposed cause as equally possible. The key distinction is between what the record cannot establish
      and what it can rule out.
    weighing: The absence of post-mishap physical evidence limits any exact-cause finding {C1}. Nonetheless, the investigation
      used multiple forms of evidence, including weather data and technical analysis, and the available evidence supported
      excluding weather, icing, GCS or MC performance, maintenance discrepancies, and LN100G failure {C2} {C3} {C4}. The conclusion
      depends on those affirmative exclusions being supported even though the precise cause is unknown.
    tradecraft: Record separately that the exact cause is undetermined and that the listed explanations were ruled out; preserve
      the evidentiary basis for each exclusion without inferring an unestablished cause.
    uncertainty: The missing wreckage prevents a determination of the exact cause. The Board President nevertheless found
      sufficient evidence to exclude the listed potential causes.
    handoff: The judgment belongs to the Board President on the assembled investigation record. No additional decision-maker
      or referral is identified as necessary for this conclusion.
    tempting_wrong:
      option: O2
      pull: Because the wreckage is missing and the exact cause cannot be determined, it may seem safer to leave all listed
        causes open.
      why_wrong: That conflates uncertainty about the exact cause with uncertainty about every candidate explanation; the
        Board President found sufficient evidence to rule out the listed causes.
    rejected:
      O2: It was not chosen because the available evidence was sufficient to exclude the listed explanations even though it
        did not establish the exact cause.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable new evidence materially implicated one or more of the listed causes, undermining the stated basis for excluding
        them.
      then: O2
      why: The listed explanations could no longer be excluded on the available record, although the exact cause could still
        remain undetermined.
    would_not_change:
    - id: noflip1
      if: The exact cause remained unknown while the evidence supporting the stated exclusions remained intact.
      why: Uncertainty about the exact cause does not undo the separate conclusion that the listed potential causes were ruled
        out.
    watch_for: []
  lesson: Distinguish an inability to determine the exact cause from an inability to rule out specific explanations. State
    only exclusions supported by the evidence, and preserve uncertainty about what remains unresolved.
  limits: This reasoning applies to the evidence and listed potential causes in this mishap investigation. It does not establish
    another cause, or justify excluding other explanations not addressed by the Board President.
