case:
  id: DR-CORPUS-NX-ea1f91a5-E4@v1
  title: Intervention in Lebanon
  status: draft
  setting: Lebanon, June 1976, Syrian government
  decider: The Syrian president
  agent: The Syrian president
  agent_role: decide
  situation: In June 1976, political chaos in Lebanon was jeopardizing a rapidly growing Syrian-Soviet relationship, while
    Egypt was absent from the Soviet Middle East team. The conflict pitted the pro-Soviet PLO and the leftist LNM against
    the pro-Western Maronite political bloc, and it had drawn international attention. The PLO had Soviet support. The Syrian
    president had initially attempted to mediate among the groups. He faced a concern that Lebanon could become a base for
    Islamist militias opposed to him. The decision implicated both that perceived security risk and Syria's relations with
    Soviet-supported forces and Moscow.
  question: What should the Syrian president do about the conflict in Lebanon in June 1976?
  options:
    O1:
      do: The Syrian president should refrain from intervening in Lebanon.
      move: act
      irreversible: false
    O2:
      do: The Syrian president should intervene in Lebanon.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Russo-Syrian relationship was rapidly growing while Egypt was absent from the Soviet Middle East team.
  - id: F2
    kind: situation
    status: assessed
    fact: Political chaos in Lebanon jeopardized the Russo-Syrian relationship.
  - id: F3
    kind: situation
    status: confirmed
    fact: The conflict in Lebanon involved the PLO and the LNM opposing the Maronite political bloc.
  - id: F4
    kind: situation
    status: confirmed
    fact: The PLO had Soviet support.
  - id: F5
    kind: situation
    status: confirmed
    fact: The conflict in Lebanon drew international attention.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Syrian president initially attempted to mediate among the involved groups.
  - id: F7
    kind: intelligence
    status: assessed
    fact: There was concern that Lebanon could become a base for Islamist militias opposed to the Syrian president.
  considerations:
  - id: C1
    facts:
    - F7
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The assessed possibility that Lebanon could become a base for Islamist militias opposed to the Syrian president was
      the stated reason for intervening.
  - id: C2
    facts:
    - F1
    - F2
    - F4
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The relationship with Moscow was rapidly growing but already jeopardized by Lebanon's chaos; intervening in a conflict
      involving a Soviet-supported group risked further damage to that relationship.
  - id: C3
    facts:
    - F6
    - F7
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The president initially attempted mediation, but the stated security concern remained at the point he chose intervention;
      the available account does not establish that mediation had resolved it.
  reasoning:
    read: 'This was not only a choice between Lebanese factions: the president faced a perceived threat to his own security
      while intervention risked harming a rapidly growing relationship with Moscow. The trap is to treat either the Soviet
      relationship or the security concern as the only relevant interest.'
    weighing: The stated security concern led the president to intervene, despite the risk created by acting in a conflict
      involving Soviet-supported forces. On that reasoning, the perceived danger of Lebanon becoming a base for anti-government
      Islamist militias outweighed the relationship cost. The balance depends on the credibility and persistence of that security
      concern; the available account does not supply further evidence assessing it.
    tradecraft: At decision level, state the assessed threat, the expected effect on the Soviet relationship, and why one
      concern takes priority. Record what evidence supports the threat assessment and what changes would prompt reconsideration;
      do not treat the historical choice as a substitute for checking current authority and circumstances.
    uncertainty: The account identifies the fear that drove the decision but does not detail the evidence behind the assessment,
      its likelihood, or whether mediation could have reduced the risk. The balance therefore reflects the president's stated
      assessment, not an independently established threat.
    handoff: The Syrian president held the decision. He should obtain relevant security and foreign-relations assessments
      before deciding, because the choice implicated both personal security and relations with Moscow.
    tempting_wrong:
      option: O1
      pull: Refraining from intervention could avoid worsening relations with Moscow over a conflict involving Soviet-supported
        forces.
      why_wrong: The stated reasoning for intervention was that restraint would leave unanswered the perceived danger that
        Lebanon could become a base for Islamist militias opposed to the president.
    rejected:
      O1: The president did not choose restraint because the perceived risk of Lebanon becoming a base for Islamist militias
        opposed to him led him to intervene.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The security assessment were credibly withdrawn or substantially reduced, so Lebanon was no longer considered a
        likely base for militias opposed to the president.
      then: O1
      why: Without the threat that was given as the reason for intervention, the risk to the growing relationship with Moscow
        would weigh more heavily.
    - id: flip2
      if: A credible non-intervention measure, including successful mediation, were shown to remove the perceived security
        risk.
      then: O1
      why: If the security concern could be addressed without intervention, the stated reason for accepting the relationship
        cost would be substantially reduced.
    would_not_change:
    - id: noflip1
      if: The conflict continued to draw international attention, without a material change in the assessed security risk.
      why: Attention alone does not displace the stated security reason or establish that the intervention choice should change.
    watch_for:
    - id: watch1
      what: New evidence bearing on whether Lebanon could become a base for Islamist militias opposed to the president.
      favors:
      - O2
      why: That assessment was the stated reason for intervention and is central to the balance.
  lesson: When a perceived security threat conflicts with the interests of an important partner relationship, identify the
    threat assessment that actually drives the choice and weigh it against the relationship cost. Reconsider the decision
    if the threat is credibly reduced or a less escalatory course can address it.
  limits: This reasoning reflects the president's stated assessment in this particular historical account, not a finding that
    the threat was independently verified or that intervention was legally required. It does not establish what course would
    be appropriate under different evidence, authorities, or circumstances.
