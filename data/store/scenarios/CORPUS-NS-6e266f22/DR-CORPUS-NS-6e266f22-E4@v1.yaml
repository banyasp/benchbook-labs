case:
  id: DR-CORPUS-NS-6e266f22-E4@v1
  title: Priority for a Return Flight Seat
  status: draft
  setting: Corregidor and the field, during the evacuation to Australia, military personnel
  decider: The evacuation-seat allocator
  agent: The evacuation-seat allocator
  agent_role: decide
  situation: An aircraft was preparing to return to Australia, and a seat was at stake. Four seats on other returning aircraft
    had been allocated to enlisted personnel. The lieutenant was among eleven men under consideration and was regarded as
    the key person in specialized analysis work, with a stated claim to highest priority within the group. The lieutenant
    was outranked by the other passengers. A ranking enlisted person remained in charge, while the field commander repeatedly
    maintained that personnel at the field had top evacuation priority.
  question: What should the evacuation-seat allocator do with the available seat on the returning aircraft?
  options:
    O1:
      do: The allocator should ask the field commander to select a passenger for the available seat.
      move: ask
      irreversible: false
      to: the field commander
    O2:
      do: The allocator should approve the lieutenant for the seat and assign it to the lieutenant.
      move: act
      irreversible: true
    O3:
      do: The allocator should reject the lieutenant for the seat and assign it to a senior passenger.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The third aircraft was the first to begin returning to Australia and took off a few days after its arrival.
  - id: F2
    kind: situation
    status: confirmed
    fact: Four seats on other aircraft preparing to return to Australia were allocated to enlisted personnel.
  - id: F3
    kind: situation
    status: confirmed
    fact: The group under consideration consisted of eleven men.
  - id: F4
    kind: capability
    status: assessed
    fact: The lieutenant was regarded as the key person in specialized analysis work and as deserving the group's highest
      priority.
  - id: F5
    kind: situation
    status: confirmed
    fact: The lieutenant was outranked by the other passengers on the flight.
  - id: F6
    kind: authority
    status: confirmed
    fact: The ranking enlisted person was left in charge.
  - id: F7
    kind: authority
    status: assessed
    fact: The Air Corps colonel in command of the field repeatedly maintained that personnel at the field had top priority
      for evacuation.
  considerations:
  - id: C1
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The lieutenant was regarded as the key person in specialized analysis work, making him the group's highest priority
      for the seat.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Although the lieutenant was outranked by the other passengers, his operational role was the stated reason for prioritizing
      him.
  - id: C3
    facts:
    - F3
    - F4
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: A seat was being allocated among eleven men; the role-based priority assessment directed that limited evacuation
      capacity to the person considered key to the work.
  reasoning:
    read: This is a priority decision among members of a group, not simply a contest in rank. The lieutenant's lower rank
      is salient, but his role as the key person in specialized analysis work is the reason given for allotting him the seat.
    weighing: The lieutenant's role made him the group's highest priority, and his being outranked did not displace that reason
      {C1} {C2}. The balance depends on the assessment that he was key to the work; seniority is not given as the controlling
      criterion for this allocation {C3}.
    tradecraft: Record the role-based reason for the allocation and distinguish it from rank. If the allocator's authority
      or the application of the field-wide evacuation priority is unclear, clarify that before finalizing the assignment.
    uncertainty: The passage does not identify the official who allocated this seat or explain the other passengers' qualifications.
      It also does not establish that the field commander's general evacuation priority selected an individual within this
      group.
    handoff: The account does not indicate that the allocator referred this particular seat decision to another official.
      If authority to allocate the seat is uncertain, coordination with the field commander would be prudent, but the stated
      basis for the choice is the lieutenant's assessed role.
    tempting_wrong:
      option: O3
      pull: The other passengers outranked the lieutenant, which can make seniority seem like the straightforward allocation
        rule.
      why_wrong: The lieutenant was nevertheless identified as the key person in the work and given the group's highest priority.
    rejected:
      O1: The account does not indicate that the field commander was to select an individual for this seat; the stated basis
        for this allocation is the lieutenant's role-based priority.
      O3: The lieutenant's stated priority because he was key to the work outweighs the fact that he was outranked.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable reassessment showed that the lieutenant was not key to the specialized work and did not merit the group's
        highest priority.
      then: O1
      why: The decisive role-based reason for selecting him would no longer hold; asking the field commander to resolve the
        remaining allocation question would be prudent.
    would_not_change:
    - id: noflip1
      if: The lieutenant remained outranked by the other passengers, with no change to the assessment of his role.
      why: He was outranked, yet his assessed role still supported giving him the group's highest priority.
    watch_for: []
  lesson: When allocating a scarce evacuation place, a stated operational priority can outweigh rank if the person is assessed
    as key to the work. Make the basis for that priority explicit rather than assuming seniority alone controls.
  limits: This reasoning applies to the specific assessment that the lieutenant was key to the work. The passage does not
    establish a general rule that operational roles always override rank, nor does it specify the allocator's authority or
    the other passengers' qualifications.
  library:
    domain: operational-command
    family: CORPUS-NS-6e266f22
