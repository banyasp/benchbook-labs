case:
  id: DR-CORPUS-NS-6e266f22-E5@v1
  title: Surrender or Continue Avoiding Capture
  status: draft
  setting: Valencia, Mindanao; military personnel, on the eve of the announced formal surrender at Malaybalay.
  decider: The three enlisted men considering whether to surrender.
  agent: The three enlisted men considering whether to surrender
  agent_role: decide
  situation: The enlisted men remaining for possible evacuation learned that no plane would come. A formal surrender was scheduled
    for the following morning at Malaybalay, where Americans in the area were to give themselves up. A captain warned that
    those leaving for the hills faced malaria, possible starvation, or being turned in by natives, and that captured guerrillas
    would be shot. Their major gave them the same advice as the captain and said they could choose whether to stay or leave.
    The three enlisted men must decide whether to assemble for surrender or continue trying to avoid capture.
  question: What should the three enlisted men do about the announced surrender?
  options:
    O1:
      do: The three enlisted men accept surrender and assemble with the other Americans at Malaybalay.
      move: act
      irreversible: true
    O2:
      do: The three enlisted men reject surrender and continue trying to avoid capture.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The enlisted men were the only enlisted personnel remaining for evacuation, and they were told that no plane would
      come from Darwin.
  - id: F2
    kind: authority
    status: confirmed
    fact: Their major told them they were free to stay or leave.
  - id: F3
    kind: situation
    status: confirmed
    fact: A formal surrender was scheduled for the next morning at Malaybalay, where Americans in the area were to give themselves
      up.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A captain warned that those taking to the hills faced malaria, possible starvation, or being turned in to the Japanese
      by natives.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A captain warned that anyone captured as a guerrilla would be shot.
  - id: F6
    kind: authority
    status: confirmed
    fact: Their major repeated the captain's advice and told them to leave if they were sure that was what they wanted.
  - id: F7
    kind: capability
    status: confirmed
    fact: Their major gave them food supplies.
  considerations:
  - id: C1
    facts:
    - F1
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: With evacuation unavailable, leaving remained the only course they considered for avoiding surrender and capture.
  - id: C2
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Taking to the hills carried the assessed risks of malaria, starvation, and being turned in; capture as guerrillas
      was said to mean they would be shot.
  - id: C3
    facts:
    - F2
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The major left the choice to them and said they could leave if sure; the account presents their departure as a choice
      made with the major's permission, not defiance of an order from him.
  - id: C4
    facts:
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: The supplies the major provided supported their ability to leave, although they did not remove the serious risks
      of doing so.
  reasoning:
    read: This was a choice between surrender at an announced assembly and continuing to avoid capture after evacuation failed.
      The trap is to treat the captain's grave warnings as a binding order, or to treat the major's permission and supplies
      as making departure safe.
    weighing: The men chose to leave despite the risks of disease, hunger, betrayal, and execution if captured as guerrillas.
      Their stated desire to avoid capture, the absence of evacuation, and the major's permission favored leaving; the captain's
      warnings favored surrender. The balance depended on how they weighed the danger of surrender against the severe hazards
      of flight, not on any assurance that either course was safe.
    tradecraft: Before acting, make the choice and its material risks explicit, confirm what authority governs, and record
      the advice and the decision. Do not present permission to leave as a guarantee of safety.
    uncertainty: The warnings were assessments, not certainties. The source does not establish what treatment surrender would
      bring or whether the hazards of leaving would occur.
    handoff: 'The major was the relevant authority to consult: he repeated the warnings, left the choice to the men, and provided
      supplies. The final decision remained theirs.'
    tempting_wrong:
      option: O1
      pull: The scheduled assembly and the captain's warnings made surrender appear to be the safer and expected course.
      why_wrong: That pull does not account for the men's stated determination to avoid capture or the major's express permission
        to choose departure; the source records that they left despite the warnings.
    rejected:
      O1: They did not assemble for surrender, choosing instead to continue trying to avoid capture despite the stated risks.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A clear, binding order required the men to assemble for surrender and no authorized exception applied.
      then: O1
      why: The major's permission is central to the account's portrayal of departure as an available choice; a binding order
        would change the authority governing that choice.
    - id: flip2
      if: Credible information established that surrender would not expose them to the capture they feared, while the assessed
        hazards of leaving remained.
      then: O1
      why: That would reduce the stated reason for avoiding surrender while leaving the risks of taking to the hills in place.
    would_not_change:
    - id: noflip1
      if: The formal surrender remained scheduled for the following morning while evacuation remained unavailable.
      why: Those were the circumstances in which they chose to leave; the announcement alone did not settle their decision.
    watch_for:
    - id: watch1
      what: Updated, credible assessments of the dangers of leaving or of the consequences of surrender.
      favors:
      - O1
      - O2
      why: The choice turns on competing survival risks, so materially changed information could alter their balance.
  lesson: When choosing between surrender and continued evasion, weigh the risks of each course rather than treating either
    as safe. Clarify the authority governing the choice, and distinguish permission to act from assurance that the action
    will succeed.
  limits: This reasoning describes the men’s choice under the stated circumstances; it does not establish a general rule to
    evade surrender or determine the legal status of any order. Different authority, reliable information, or risks could
    change the balance.
