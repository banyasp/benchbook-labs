case:
  id: DR-CORPUS-NX-7ac246c5-E1@v1
  title: Retention Beyond the One-Year Default
  status: draft
  setting: At the retention decision; National Security Agency; time unspecified.
  decider: The Deputy Director for Operations, National Security Agency
  agent: The Deputy Director for Operations, National Security Agency
  agent_role: decide
  situation: The retention question concerns international commercial communications that are unenciphered and are not otherwise
    thought to contain secret meaning. They may contain the identity of United States persons. The period for this category
    is one year unless a longer period is determined to be required. Retention may last long enough to allow thorough exploitation
    and access to data relevant, or reasonably believed likely to become relevant, to a current or future intelligent requirement.
    Sufficient duration may vary with the nature of the exploitation. A longer period requires a written determination by
    the Deputy Director for Operations that it is required to respond to authorized foreign-intelligence or counterintelligence
    requirements.
  question: What should the Deputy Director for Operations, National Security Agency, do about the retention period for these
    communications?
  options:
    O1:
      do: The Deputy Director for Operations authorizes retention beyond one year in writing.
      move: act
      irreversible: false
    O2:
      do: The Deputy Director for Operations declines retention beyond one year.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The communications are international commercial communications.
  - id: F2
    kind: situation
    status: confirmed
    fact: The communications may contain the identity of United States persons.
  - id: F3
    kind: situation
    status: confirmed
    fact: The communications are not enciphered or otherwise thought to contain secret meaning.
  - id: F4
    kind: situation
    status: confirmed
    fact: The default retention period for this category is one year.
  - id: F5
    kind: situation
    status: confirmed
    fact: Retention may be for a period sufficient to allow thorough exploitation and access to data relevant, or reasonably
      believed likely to become relevant, to a current or future intelligent requirement.
  - id: F6
    kind: situation
    status: confirmed
    fact: Sufficient retention duration may vary with the nature of the exploitation.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Deputy Director for Operations, National Security Agency, may determine in writing that a period longer than
      one year is required.
  - id: F8
    kind: authority
    status: confirmed
    fact: A longer retention period must be required to respond to authorized foreign-intelligence or counterintelligence
      requirements.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: These communications fall within the category for which the policy sets one year as the retention period.
  - id: C2
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 'Retention beyond one year is an exception: the Deputy Director for Operations must determine in writing that the
      longer period is required to respond to authorized foreign-intelligence or counterintelligence requirements. The stated
      facts do not establish that condition.'
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The policy allows sufficient retention for thorough exploitation and access to data relevant, or reasonably believed
      likely to become relevant, to an intelligent requirement, and says sufficient duration may vary with the exploitation.
      This supports considering an extension when needed, but does not itself establish that a period beyond one year is required.
  reasoning:
    read: The communications are within the policy's one-year category because they are international commercial communications
      that may identify U.S. persons and are unenciphered or not otherwise thought to contain secret meaning. The trap is
      treating the general allowance for sufficient exploitation as an automatic reason to extend retention, rather than applying
      the category's one-year default and its stated exception.
    weighing: The policy's specific default favors {O2}. Thorough exploitation and access to data relevant to current or future
      intelligent requirements may call for a duration that varies with the exploitation, but an extension is permitted only
      when the Deputy Director for Operations determines in writing that it is required for authorized foreign-intelligence
      or counterintelligence requirements. On the stated facts, that condition is not established, so the default controls.
    tradecraft: Apply the one-year period. Retain beyond it only on the Deputy Director for Operations' written determination
      that the longer period is required to respond to authorized foreign-intelligence or counterintelligence requirements.
    uncertainty: The facts do not identify a particular authorized requirement or establish that responding to it requires
      retention beyond one year.
    handoff: The Deputy Director for Operations holds the stated authority to make the written determination; no other decision-maker
      or required consultation is identified.
    tempting_wrong:
      option: O1
      pull: The policy recognizes that data may become relevant to current or future intelligent requirements and that sufficient
        duration can vary with the exploitation.
      why_wrong: Those general retention considerations do not replace the specific requirement for a written determination
        that a period beyond one year is needed for authorized foreign-intelligence or counterintelligence requirements.
    rejected:
      O1: A longer period was not chosen because the stated facts do not establish the required written determination for
        an authorized foreign-intelligence or counterintelligence need.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Deputy Director for Operations determines in writing that a period longer than one year is required to respond
        to authorized foreign-intelligence or counterintelligence requirements.
      then: O1
      why: That is the policy's stated condition for retention beyond one year.
    would_not_change:
    - id: noflip1
      if: The data may be relevant to a current or future intelligent requirement, but no written determination establishes
        that retention beyond one year is required for an authorized foreign-intelligence or counterintelligence requirement.
      why: Potential relevance and the nature of exploitation inform sufficient duration but do not, by themselves, satisfy
        the stated exception to the one-year default.
    watch_for:
    - id: watch1
      what: Whether the nature of the exploitation means that a period longer than one year is required to respond to an authorized
        foreign-intelligence or counterintelligence requirement.
      favors:
      - O1
      why: The policy says sufficient duration may vary with the nature of the exploitation, while requiring a written determination
        for a longer period in this category.
  lesson: Apply a category's stated retention default unless the policy's specified exception is established. General relevance
    or exploitation needs may inform the decision, but they do not substitute for the required written determination.
  limits: This reasoning concerns only the stated category of unenciphered international commercial communications that may
    identify U.S. persons. It does not resolve retention periods for other data categories or the merits of any particular
    intelligence requirement.
