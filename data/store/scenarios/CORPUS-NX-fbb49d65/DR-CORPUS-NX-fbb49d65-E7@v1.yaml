case:
  id: DR-CORPUS-NX-fbb49d65-E7@v1
  title: A Standing Naval Force in the Mediterranean
  status: draft
  setting: Mediterranean, NATO Southern Region, during efforts to develop a Standing Naval Force Mediterranean.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: The Mediterranean has a Naval-on-Call Force, and the Commander is considering whether to pursue a standing allied
    force. Securing agreement on common fuel funding is a major practical obstacle. The degree of some nations’ participation
    may depend on common funding. Command and control arrangements are another critical issue. The Commander views a more
    visible allied naval presence as politically significant beyond NATO, including for North African nations. The Commander’s
    staff has assessed that increasing Soviet naval port visits bring political and psychological value, while NATO has made
    no similar effort.
  question: What should the Commander do about the standing-force proposal?
  options:
    O1:
      do: The Commander defers the proposal and asks NATO allies for funding and command views.
      move: ask
      irreversible: false
      to: NATO allies
    O2:
      do: The Commander advances the standing-force proposal through staff work and allied support requests.
      move: act
      irreversible: false
    O3:
      do: The Commander rejects the standing-force proposal and retains the Mediterranean on-call arrangement.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: A Naval-on-Call Force operates in the Mediterranean.
  - id: F2
    kind: capability
    status: confirmed
    fact: The Commander continues to receive reports from STANAVFORLANT.
  - id: F3
    kind: situation
    status: confirmed
    fact: Obtaining agreement for common funding of fuel for ships in a standing force is a major problem.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Some nations’ degree of participation may depend on common fuel funding.
  - id: F5
    kind: situation
    status: confirmed
    fact: Command and control arrangements are a critical milestone for establishing a standing force.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Commander views a more visible allied naval presence as politically significant beyond NATO, including for North
      African nations.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Commander’s intelligence staff assessed that Soviet naval port visits in the Mediterranean were increasing and
      carried political and psychological value.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Commander assessed that NATO had made no similar effort and risked allowing the Soviets a substantial advantage.
  considerations:
  - id: C1
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Commander assessed that increasing Soviet port visits carried political and psychological value while NATO made
      no similar effort, risking a substantial Soviet advantage through NATO inaction.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Commander saw a more visible allied presence as politically significant beyond NATO, including as a display of
      solidarity and an alternative to Soviet orientation for North African countries.
  - id: C3
    facts:
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O1
    - O2
    weight: weak
    why: Common fuel funding is difficult to secure, and some nations’ participation may depend on it. That makes allied support
      essential, but the Commander sought help to build that support rather than treating the obstacle as a reason to abandon
      the proposal.
  - id: C4
    facts:
    - F5
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: Command and control is another critical milestone, making delay to obtain allied views a plausible course; it is
      a problem to address in developing the proposal, not evidence that the Commander rejected it.
  reasoning:
    read: 'This is not only a choice about force structure: the Commander sees allied naval presence as part of a political
      contest in the Mediterranean and beyond NATO. The trap is to let practical obstacles or the existing on-call arrangement
      obscure the risk he identified: NATO default could leave the political value of visible presence to the Soviets.'
    weighing: The Commander’s stated concern about Soviet port visits and NATO’s lack of a similar effort weighs strongly
      toward pursuing the standing-force proposal. North African political effects add to that rationale. Common fuel funding
      and command and control are serious constraints, and the balance depends on allied support and workable arrangements;
      the Commander’s response was to direct staff work and seek support, not to treat those unresolved issues as grounds
      to reject the proposal.
    tradecraft: Direct staff work on the concept, drawing on the STANAVFORLANT reports, and seek allied support for common
      fuel funding and workable command arrangements. Record assumptions about participation and the status of these issues
      clearly.
    uncertainty: It remains uncertain whether allies would agree to common fuel funding or command arrangements, and how much
      participation a standing force would secure.
    handoff: The Commander should direct the multinational staff to develop the concept and seek support from relevant allied
      counterparts for common fuel funding and command arrangements.
    tempting_wrong:
      option: O1
      pull: Deferring while asking allies for funding and command views appears prudent because participation may depend on
        common fuel funding and command arrangements remain critical.
      why_wrong: 'The Commander did not stop at seeking views: he directed staff to develop the concept and sought allied
        support while pursuing it, because he saw NATO inaction as risking a political advantage for the Soviets.'
    rejected:
      O1: The Commander did seek allied help on funding, but did so while advancing staff work rather than deferring the standing-force
        proposal.
      O3: Rejecting the proposal would not address the Commander’s concern that NATO’s lack of a similar visible effort allowed
        the Soviets to gain political advantage.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Allied views establish that common fuel funding cannot be agreed and participation would consequently be too limited
        to make a standing force viable.
      then: O1
      why: That would turn the funding and participation concern into a concrete feasibility problem, supporting a pause to
        obtain or reconsider allied views rather than continuing to advance the proposal as framed.
    would_not_change:
    - id: noflip1
      if: Command and control arrangements remain unresolved but are still open for allied consideration.
      why: An unresolved command and control milestone can be addressed while staff work on the concept continues; it does
        not by itself justify abandoning the proposal.
    watch_for:
    - id: watch1
      what: Whether allied participation is in fact contingent on agreement to common fuel funding.
      favors:
      - O2
      - O1
      why: That information bears on how much allied support the proposal needs and whether a pause to obtain further views
        becomes necessary.
  lesson: When a proposed allied capability also serves a political purpose, assess the cost of inaction as well as the practical
    barriers to agreement. Serious funding and command questions can call for staff work and allied support without, by themselves,
    requiring rejection of the proposal.
  limits: This reasoning supports pursuing the proposal at the concept and support-building stage; it does not establish that
    a standing force was feasible, that allies would agree, or that it should be established regardless of those outcomes.
  library:
    domain: operational-command
    family: CORPUS-NX-fbb49d65
    source: https://digital-commons.usnwc.edu/cgi/viewcontent.cgi?article=1007&context=usnwc-historical-monographs
