case:
  id: DR-CORPUS-NX-fbb49d65-E5@v1
  title: A Standing Multinational Naval Squadron
  status: draft
  setting: December 1967, North Atlantic Council, NATO
  decider: The North Atlantic Council
  agent: The North Atlantic Council
  agent_role: decide
  situation: In 1967, the North Atlantic Council faced a choice about transforming the Matchmaker naval training squadron
    into a continuously operational multinational squadron or retaining the training arrangement. Naval forces assigned to
    NATO commands were not permanently under NATO command, and NATO needed to be able to act collectively at sea on short
    notice. The Matchmaker experience gave SACLANT’s staff a basis for assessing the feasibility of a standing squadron. The
    staff sought a standing force under SACLANT’s command as part of a broader effort to improve readiness. The staff also
    viewed a standing squadron and a separate contingency-force concept as potential contributions to the Northern Flank,
    where a growing Soviet presence might put NATO at a disadvantage early in a crisis. The proposed squadron was presented
    as a way to strengthen allied cooperation, demonstrate solidarity, and provide an available initial response.
  question: What should the North Atlantic Council do about transforming the Matchmaker naval training squadron into a continuously
    operational multinational squadron?
  options:
    O1:
      do: The North Atlantic Council rejects the proposal to transform Matchmaker into a continuously operational multinational
        squadron.
      move: act
      irreversible: false
    O2:
      do: The North Atlantic Council approves the proposal to transform Matchmaker into a continuously operational multinational
        squadron.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: SACLANT’s staff was pressing for a new maritime strategy intended to improve NATO’s ability to respond quickly and
      collectively at sea.
  - id: F2
    kind: situation
    status: confirmed
    fact: Forces assigned to naval commands were not permanently under NATO command.
  - id: F3
    kind: capability
    status: confirmed
    fact: National naval commanders had forces directly at their disposal, while NATO needed to be able to move collectively
      at sea on short notice.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Matchmaker exercise ran from 1965 to 1967 and gave SACLANT’s staff a basis for evaluating the feasibility of
      a permanent NATO squadron.
  - id: F5
    kind: authority
    status: confirmed
    fact: SACLANT sought North Atlantic Council approval to create a standing force under his command.
  - id: F6
    kind: capability
    status: confirmed
    fact: The SACLANT staff also developed a contingency-force concept using forces earmarked by national governments for
      short-notice support.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The staff viewed the standing squadron and contingency-force concept as potential contributions to the Northern
      Flank, where a growing Soviet presence might put NATO at a disadvantage early in a crisis.
  - id: F8
    kind: capability
    status: confirmed
    fact: Formal briefings described the proposed squadron as supporting allied naval training, demonstrating solidarity,
      and providing an immediately available combined force.
  - id: F9
    kind: situation
    status: confirmed
    fact: The proposed squadron was intended to enhance existing cooperation between member countries’ naval forces.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Because naval forces were not permanently under NATO command, the Council needed a way to move collectively at sea
      on short notice; a continuously operational squadron would address that readiness gap.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The Matchmaker experience gave SACLANT’s staff a practical basis for judging that a permanent squadron was feasible.
  - id: C3
    facts:
    - F8
    - F9
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The proposed force was intended to improve allied naval cooperation and training and to demonstrate Alliance solidarity.
  - id: C4
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The standing squadron was presented as an immediately available combined force and, with the separate contingency-force
      concept, as a potential contribution to the Northern Flank, where NATO might be disadvantaged early in a crisis.
  reasoning:
    read: 'This was a choice between retaining a useful training arrangement and turning it into a continuously operational
      multinational force that could improve NATO’s ability to act collectively at sea. The trap is to treat the proposal
      as merely another exercise: the underlying problem was that national naval forces were not permanently under NATO command,
      while NATO sought a short-notice collective capability.'
    weighing: The Council approved the transformation. The stated balance favored better allied cooperation and training,
      visible solidarity, and an immediately available combined force; the Matchmaker experience supported the feasibility
      of the change. The Northern Flank concern added strategic urgency, though the standing squadron was only one part of
      a broader response that also included a separate contingency-force concept.
    tradecraft: 'Record the Council’s approval and its stated purposes separately: readiness, allied cooperation and training,
      solidarity, and availability as an initial response. Keep the decision at the force-creation level and do not treat
      the separate contingency-force concept as part of this approval.'
    uncertainty: The account gives the Council’s outcome and the proposal’s stated purposes, but does not describe a recorded
      debate over costs, risks, or conditions for continuing the force. The Northern Flank disadvantage is presented as a
      possibility, not a certainty.
    handoff: The North Atlantic Council was the deciding body; SACLANT’s staff supplied the proposal and feasibility basis.
      The source does not identify a further approval authority for this decision.
    tempting_wrong:
      option: O1
      pull: Retaining Matchmaker as a training arrangement would avoid changing an established arrangement.
      why_wrong: That would leave the identified short-notice collective-readiness gap unaddressed and forgo the stated cooperation,
        solidarity, and initial-response benefits.
    rejected:
      O1: The Council did not retain Matchmaker solely as a training arrangement, because it approved transforming it into
        a continuously operational force to strengthen the Alliance and improve readiness.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: NATO no longer needed a short-notice collective naval capability.
      then: O1
      why: The principal readiness reason for creating a continuously operational squadron would no longer apply.
    - id: flip2
      if: The Matchmaker experience no longer provided a credible basis for judging a standing squadron feasible.
      then: O1
      why: A central practical basis for transforming the training arrangement would be absent.
    would_not_change:
    - id: noflip1
      if: The details of any later operational employment were unsettled.
      why: That alone would not displace the stated force-creation reasons of readiness, cooperation, solidarity, and availability
        as an initial response.
    watch_for:
    - id: watch1
      what: Whether the assessed Northern Flank disadvantage from growing Soviet presence becomes more or less pressing.
      favors:
      - O2
      why: The staff regarded the squadron, alongside the separate contingency-force concept, as a potential contribution
        to the Northern Flank problem.
  lesson: When national forces are not permanently under collective command, a standing multinational force can address a
    short-notice readiness gap while also strengthening cooperation and demonstrating solidarity. A demonstrated practical
    basis for feasibility and a relevant strategic need support changing a training arrangement into a continuously operational
    capability.
  limits: This reasoning concerns the Council’s 1967 decision to create a standing multinational squadron; it does not establish
    that such a force is always preferable to a training arrangement. It does not decide how the force should be employed
    in any later contingency.
