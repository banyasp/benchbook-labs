case:
  id: DR-CORPUS-NX-1278940f-E3@v1
  title: CIA Monitoring Program and Legal Advice
  status: draft
  setting: United States, during the fall, CIA narcotics-related monitoring program.
  decider: CIA officials responsible for the monitoring program
  agent: CIA officials responsible for the monitoring program
  agent_role: decide
  situation: During the fall, the CIA was conducting a monitoring program intended to identify foreign drug traffickers. The
    program was undertaken at the request of the National Security Agency and was not conducted by the CIA component responsible
    for narcotics intelligence collection. American citizens were among those affected by the program. The General Counsel
    was consulted about three months after the program began and has issued an opinion that CIA conduct of the program is
    illegal. The decision concerns whether CIA participation should continue, stop, or be paused for further legal review.
  question: What should CIA officials responsible for the monitoring program do about continued CIA participation after receiving
    the legality opinion from the General Counsel?
  options:
    O1:
      do: CIA officials permit continued participation in the monitoring program.
      move: act
      irreversible: false
    O2:
      do: CIA officials suspend participation and seek further legal review.
      move: ask
      irreversible: false
      to: the General Counsel
    O3:
      do: CIA officials prohibit continued participation and terminate the monitoring program.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The CIA conducted a monitoring program intended to identify foreign drug traffickers.
  - id: F2
    kind: authority
    status: confirmed
    fact: The National Security Agency requested the monitoring program.
  - id: F3
    kind: situation
    status: confirmed
    fact: The CIA component responsible for narcotics intelligence collection did not conduct the monitoring program.
  - id: F4
    kind: situation
    status: confirmed
    fact: American citizens were among those affected by the monitoring program.
  - id: F5
    kind: situation
    status: confirmed
    fact: The General Counsel was not consulted until approximately three months after the program began.
  - id: F6
    kind: authority
    status: assessed
    fact: The General Counsel opined that CIA conduct of the monitoring program was illegal.
  considerations:
  - id: C1
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: bar
    why: The General Counsel concluded that CIA conduct of the program was illegal. Continued participation is therefore not
      an available course.
    rules_out:
    - O1
  - id: C2
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The legal opinion had been issued, and the program was immediately terminated. The endorsed response is to stop participation,
      rather than continue while awaiting another review.
  - id: C3
    facts:
    - F5
    equity: policy_compliance
    favors:
    - O3
    weight: weak
    why: The General Counsel was not consulted until about three months after the program began. This delay demonstrates the
      need for improved internal consultation; it does not make continued participation permissible after counsel's opinion.
  reasoning:
    read: This is a decision about continued CIA participation after the General Counsel concluded that the program was illegal.
      The request for the program and its intended purpose do not overcome that legal conclusion; the trap is treating further
      review or the program's purpose as grounds to keep participating.
    weighing: The decisive consideration is the legal conclusion that CIA conduct violated U.S. law, which rules out continued
      participation {C1}. Counsel's opinion was followed by immediate termination, while the delayed consultation demonstrates
      the need to improve internal consultation rather than providing a reason to continue the program {C2} {C3}.
    tradecraft: End CIA participation and document the termination and its legal basis. For any future proposal raising comparable
      legal questions, obtain counsel's advice before participation begins.
    uncertainty: The source provides no competing legal assessment or basis for treating the General Counsel's opinion as
      provisional. The stated reasons support termination on the facts presented.
    handoff: The General Counsel has already provided the relevant legal opinion. CIA officials responsible for the program
      should implement the termination; improved consultation is a broader internal-process lesson.
    tempting_wrong:
      option: O2
      pull: Suspending participation while seeking more legal review may seem cautious given that counsel was consulted late.
      why_wrong: The General Counsel had already concluded that the conduct was illegal, and the program was immediately terminated;
        delaying that response for another review is not the endorsed course.
    rejected:
      O1: Continued participation was not chosen because the General Counsel concluded that CIA conduct of the program was
        illegal.
      O2: Further review was not chosen because counsel had already issued the legality opinion that prompted immediate termination.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The General Counsel withdrew the illegality opinion after further legal review.
      then: O2
      why: If the legal basis for stopping participation were withdrawn but the legality remained unresolved, suspension for
        review would be appropriate rather than immediate continuation.
    would_not_change:
    - id: noflip1
      if: The program continued to provide valuable information for enforcement officials.
      why: The information was valuable, but the conduct was still identified as a statutory violation; value alone would
        not justify continued participation.
    watch_for: []
  lesson: When counsel concludes that an agency's participation is illegal, stop that participation rather than treating the
    mission's purpose or a request from another agency as sufficient authority to continue. Consult counsel early, and improve
    internal consultation when it has been delayed.
  limits: This conclusion concerns the specific finding that CIA conduct of this program violated U.S. law. It does not resolve
    the legality of other intelligence or law-enforcement support activities.
  library:
    domain: intel-oversight
    family: CORPUS-NX-1278940f
    source: https://www.aarclibrary.org/publib/church/rockcomm/pdf/RockComm_Chap15_Domestic.pdf
