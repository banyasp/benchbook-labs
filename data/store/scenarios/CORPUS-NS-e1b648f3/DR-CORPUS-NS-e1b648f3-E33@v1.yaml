case:
  id: DR-CORPUS-NS-e1b648f3-E33@v1
  title: UN Approval of a Proposed Strike List
  status: draft
  setting: Zagreb, 29 August 1995; the UN-NATO command arrangement.
  decider: The UN commander
  agent: The UN commander
  agent_role: decide
  situation: On 29 August in Zagreb, the UN commander held the UN key and had a role in air-strike approval. He received a
    list of 13 proposed targets late in the afternoon, with the first attacks only a few hours away. He asked for more time
    to consider the list, while the AFSOUTH commander pressed him for an answer and invoked the risk to aircrew. The UN commander
    continued to discuss bombing decisions with a UN political official who opposed the campaign. He was also uncomfortable
    with the appearance of UN impartiality while the campaign was directed solely at the Bosnian Serbs, and three entries
    labeled as barracks raised concerns about whether the labels reflected the sites’ current use.
  question: What should the UN commander do about the proposed strike authorization?
  options:
    O1:
      do: The UN commander authorizes 10 of 13 proposed strikes and withholds three labeled as barracks.
      move: partial
      irreversible: true
    O2:
      do: The UN commander requests UN political direction before deciding on the submitted strike list.
      move: ask
      irreversible: false
      to: UN political leadership
    O3:
      do: The UN commander authorizes all 13 proposed strikes on the submitted list.
      move: act
      irreversible: true
    O4:
      do: The UN commander declines all 13 proposed strikes on the submitted list.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The UN commander announced that he once again held the UN key on 29 August.
  - id: F2
    kind: situation
    status: confirmed
    fact: The UN commander was shown a proposed list of 13 targets late in the afternoon.
  - id: F3
    kind: situation
    status: confirmed
    fact: The first wave of attacks was due to begin a few hours after the approval request.
  - id: F4
    kind: situation
    status: confirmed
    fact: The UN commander asked for more time to consider the proposed targets.
  - id: F5
    kind: situation
    status: assessed
    fact: The AFSOUTH commander pressed for an immediate decision and later said he invoked the risk to his pilots.
  - id: F6
    kind: authority
    status: confirmed
    fact: The AFSOUTH commander was responsible for mission accomplishment and had forces at risk.
  - id: F7
    kind: situation
    status: assessed
    fact: The UN commander continued to discuss bombing decisions with a UN political official who was philosophically opposed
      to the bombing campaign.
  - id: F8
    kind: situation
    status: assessed
    fact: The UN commander was uncomfortable with the appearance of UN impartiality during a campaign aimed solely at the
      Bosnian Serbs and needed political direction.
  - id: F9
    kind: situation
    status: assessed
    fact: Some target-site labels were legacy descriptions that no longer reflected the sites’ current functions; a site labeled
      as barracks might not primarily serve troop housing.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: own_force_life
    favors:
    - O3
    - O1
    weight: strong
    why: The AFSOUTH commander had forces at risk and responsibility for mission accomplishment, so the UN commander faced
      a substantial command reason to give a timely decision. That pressure supported proceeding, but did not by itself resolve
      the political and target-description concerns.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The list arrived only hours before the first attacks, and the UN commander asked for more time. The short review
      period helps explain his hesitation, though the account treats the need for political direction as the more important
      reason.
  - id: C3
    facts:
    - F7
    - F8
    equity: impartiality
    favors:
    - O2
    - O4
    weight: strong
    why: The UN commander continued consulting a political official opposed to the campaign and was uncomfortable with the
      appearance of UN impartiality when the campaign was directed solely at the Bosnian Serbs. The account identifies the
      need for political direction as central to his hesitation.
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O2
    - O1
    weight: strong
    why: A legacy label such as barracks might not describe a site's current function. The label alone therefore did not settle
      whether to authorize those entries; withholding the three in question while their descriptions were clarified was more
      cautious than approving the full list.
  reasoning:
    read: This was not simply a choice between meeting the air commander's deadline and refusing the campaign. The UN commander
      held the approval role, but the short review window, the UN political official's opposition, the impartiality concern,
      and potentially misleading legacy labels all affected his decision. The trap is to treat either command pressure or
      a target label as conclusive.
    weighing: The account identifies both force protection and mission accomplishment as the AFSOUTH commander's responsibilities,
      which weighed against indefinite delay. But it says the UN commander's hesitation stemmed partly from limited airpower
      expertise and, more importantly, from needing political direction. He consulted advisers, and direct pressure from higher
      UN political leadership was needed before he and the political official gave way. The eventual choice authorized ten
      entries while withholding the three labeled as barracks; the balance depended on political direction and a more accurate
      understanding of what those labels described.
    tradecraft: Make the approval decision within the authority actually held, but do not let urgency substitute for resolving
      material uncertainty. Record the political direction received, the basis for proceeding, and which entries remain withheld
      pending clarification of their descriptions.
    uncertainty: The account does not establish the legal status of every proposed entry or provide a complete assessment
      of civilian risk. It does establish that the labels could be outdated and that political direction, rather than technical
      expertise alone, was the principal source of hesitation.
    handoff: 'The UN commander should not treat this as a decision to make in isolation: the account says he continued to
      consult the UN political official and needed political direction. The AFSOUTH commander''s force-protection and mission
      responsibilities also warranted serious consideration, but did not replace the UN commander''s approval role.'
    tempting_wrong:
      option: O3
      pull: Immediate full approval would answer the AFSOUTH commander's urgent request and support mission accomplishment.
      why_wrong: Urgency and force-protection responsibility did not settle the UN commander's political concern or make legacy
        labels reliable descriptions of current site functions.
    rejected:
      O2: Deferring for political direction was a plausible course, but the account describes the commander consulting advisers
        and then proceeding after pressure from higher UN political leadership.
      O3: Approving all entries would not address the commander's specific concern about the three barracks labels or his
        need for political direction.
      O4: Declining the entire list would have gone further than the account's outcome, which proceeded with ten entries while
        withholding three.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Higher UN political leadership had not supplied direction and the impartiality concern remained unresolved at the
        decision point.
      then: O2
      why: The account identifies the need for political direction as the principal reason for hesitation, so absent that
        direction a request for it would be more consistent with the stated concern.
    - id: flip2
      if: The uncertainty about whether the three barracks labels reflected current site functions could not be clarified
        before authorization.
      then: O2
      why: Deferring would preserve the distinction between a legacy label and a sufficiently understood basis for approval.
    would_not_change:
    - id: noflip1
      if: The AFSOUTH commander repeated the deadline and the risk to aircrew, without any further political direction or
        clarification of the disputed descriptions.
      why: Those command responsibilities weigh toward a timely decision, but alone they do not resolve the political-direction
        and label concerns that shaped the UN commander's hesitation.
    watch_for:
    - id: watch1
      what: Whether a legacy description accurately reflects a site's current function.
      favors:
      - O2
      - O1
      why: Some labels no longer reflected the nature of the sites, and the three entries labeled as barracks were withheld
        before their descriptions were made more accurate.
    - id: watch2
      what: Whether the UN commander has received political direction sufficient to address the impartiality concern.
      favors:
      - O2
      why: The need for political direction was the most important source of the commander's hesitation.
  lesson: A commander with approval authority should weigh mission and force-protection responsibilities without treating
    urgency as a substitute for political direction. Where legacy descriptions create material uncertainty, distinguish the
    label from the current function and avoid treating the label alone as decisive.
  limits: This reasoning applies to an approval decision involving the described command arrangement, competing political
    concerns, and uncertainty in legacy descriptions; it does not establish whether any particular proposed strike was lawful
    or assess its civilian risks. It should not be applied where the governing authority, political direction, or relevant
    facts differ materially.
