case:
  id: DR-CORPUS-NS-e1b648f3-E28@v1
  title: Risk and Deny Flight Enforcement
  status: draft
  setting: Bosnia, during NATO's Deny Flight operations after an F-16 was shot down, under NATO-UN command arrangements.
  decider: The AFSOUTH commander
  agent: The AFSOUTH commander
  agent_role: decide
  situation: Deny Flight operations over Bosnia had been greatly curtailed while Serb military jets were flying from Banja
    Luka. The Serb SAM threat remained, and the regional air commander believed renewed patrols would expose NATO aircrews
    to danger. Senior NATO leadership was pressing for more intensive patrols to enforce the no-fly zone. NATO policy called
    for close coordination with UN counterparts, and the UN counterpart's permission was required before the SAM threat could
    be eliminated. The UN counterpart had refused a proposed air-strike request and was seeking to revive the peacekeeping
    mission and ties with the Bosnian Serbs. The mission's future enforcement remained unsettled amid pressure to enforce
    it, force-protection concerns, and limits on the commander's authority.
  question: What should the AFSOUTH commander do about resuming Deny Flight patrols over Bosnia under the NATO-UN command
    arrangements?
  options:
    O1:
      do: The AFSOUTH commander permits renewed patrols over Bosnia and resumes intensive Deny Flight enforcement.
      move: act
      irreversible: false
    O2:
      do: The AFSOUTH commander prohibits renewed patrols over Bosnia and maintains the curtailed Deny Flight posture.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Deny Flight operations over Bosnia had been greatly curtailed.
  - id: F2
    kind: situation
    status: confirmed
    fact: Serb military jets began flying from Banja Luka while the SAM threat remained.
  - id: F3
    kind: situation
    status: assessed
    fact: The AFSOUTH commander believed renewed patrols would put aircrews in danger.
  - id: F4
    kind: situation
    status: confirmed
    fact: Senior NATO leadership pressed for more intensive air patrols to enforce the no-fly zone.
  - id: F5
    kind: authority
    status: confirmed
    fact: NATO policy required its commanders to coordinate closely with their UN counterparts.
  - id: F6
    kind: authority
    status: assessed
    fact: The AFSOUTH commander recognized the UN counterpart as the supported commander and understood that he could not
      eliminate the SAM threat without that counterpart's permission.
  - id: F7
    kind: situation
    status: confirmed
    fact: The UN counterpart had refused a proposal for air strikes at Banja Luka and was seeking to revive the peacekeeping
      mission and ties with the Bosnian Serbs.
  - id: F8
    kind: capability
    status: confirmed
    fact: The AFSOUTH commander could order a resumption of air operations over Bosnia that entailed greater risks to NATO
      aircrews.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The commander judged that renewed patrols would expose aircrews to a serious SAM danger and refused to put them at
      risk merely to resume enforcement.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The commander recognized the UN counterpart as the supported commander and understood that he could not eliminate
      the SAM threat without permission; that counterpart had refused the proposed air-strike request.
  - id: C3
    facts:
    - F1
    - F2
    - F4
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Allowing patrols to remain curtailed impaired enforcement while Serb military jets were flying, and senior NATO leadership
      pressed for more intensive patrols. Those mission concerns did not, in the commander's judgment, make the aircrew risk
      acceptable.
  reasoning:
    read: 'This was not simply a choice between enforcing the no-fly zone and doing nothing: the commander faced pressure
      to resume patrols while believing the SAM threat made them dangerous, and he lacked authority to remove that threat
      without UN permission. The trap was treating enforcement pressure as sufficient reason to expose crews to danger when
      the command arrangement constrained the safer alternative.'
    weighing: The commander gave decisive weight to protecting aircrews and to the limits on his authority, despite the mission
      cost of curtailed enforcement. He believed his expertise and responsibility required him to stand firm, even against
      pressure from above. The unresolved risk and authority problem therefore had to be elevated rather than answered by
      resuming patrols at greater risk.
    tradecraft: Maintain the curtailed posture while the threat and authority constraints remain; document the assessed danger,
      the applicable command limits, and the mission consequences. Seek a political-level decision on whether and under what
      authority enforcement should resume, and reassess if the risk or authorization changes.
    uncertainty: The Serb flights may have been intended to bait NATO, but their motive was uncertain. NATO leaders pressed
      for more intensive patrols, yet apparently no one was willing to accept responsibility for overruling the commander's
      risk judgment.
    handoff: The commander should not resolve the policy conflict alone. He should coordinate with the UN counterpart under
      the required command arrangement and elevate the unresolved choice to NATO political authorities.
    tempting_wrong:
      option: O1
      pull: Resuming intensive patrols would visibly enforce the no-fly zone despite Serb flights and pressure from senior
        NATO leadership.
      why_wrong: On the commander's assessment, that would put aircrews in danger while the SAM threat remained, without authority
        to eliminate it.
    rejected:
      O1: The commander did not resume intensive patrols because he judged the SAM danger to aircrews unacceptable and could
        not eliminate that threat without UN permission.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The UN supported commander authorized action to address the SAM threat and the resulting risk assessment made renewed
        patrols acceptable.
      then: O1
      why: The central reason for refusing patrols was the danger to aircrews while the threat remained; reducing that danger
        with proper authorization could make enforcement acceptable.
    would_not_change:
    - id: noflip1
      if: Senior leadership continued to press for more intensive patrols without changing the assessed danger or the commander's
        authority.
      why: Pressure to do more was already present, but the commander judged that it did not justify putting aircrews at risk
        or acting beyond his authority.
    watch_for:
    - id: watch1
      what: A political-level change in the rules or authorization governing aircrew defense and no-fly-zone enforcement.
      favors:
      - O1
      why: Political authorities later accepted more liberal rules for defending air operations, showing that the policy framework
        could change.
  lesson: A commander should not treat pressure to achieve a mission as authority to impose a risk judged unacceptable on
    subordinates. When command arrangements withhold authority to address the danger, preserve the force-protection decision
    and elevate the unresolved policy choice to the responsible political level.
  limits: This reasoning applies where the commander assesses a serious operational danger and lacks authority to address
    it. It does not establish that force protection always overrides mission enforcement, or that patrols should remain curtailed
    after the threat, authority, or political direction changes.
  library:
    domain: operational-command
    family: CORPUS-NS-e1b648f3
    source: https://apps.dtic.mil/sti/pdfs/ADA415991.pdf
    episode_focus: After the F-16 was shot down, the commander restricted flights, citing the danger to aircrews and the need
      to change the approach; the passage also sets out broader choices, including allowing Serb flights or seeking to eliminate
      the air-defense threat. Keep the focus on the command judgment about risk and mission enforcement, not on escort or
      suppression tactics.
    cues:
      option_words:
        O1: 14
        O2: 15
      real_option: O2
      real_to_mean_other_length: 1.07
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
