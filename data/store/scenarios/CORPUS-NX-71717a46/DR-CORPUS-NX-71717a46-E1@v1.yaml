case:
  id: DR-CORPUS-NX-71717a46-E1@v1
  title: Military and Civilian Workforce Boundaries
  status: draft
  setting: Department of Defense policy development concerning DoDI 3020.41 and DoDI 1100.22.
  decider: DoD policy-drafters and manpower authorities
  agent: DoD policy-drafters and manpower authorities
  agent_role: decide
  situation: DoD policy-drafters and manpower authorities are setting boundaries for military, civilian, and private-sector
    work. The policy development addresses whether civilian employees or contractors may substitute for military personnel
    in traditional warfighting roles, as well as whether support work may be outsourced. Workforce criteria distinguish inherently
    governmental activities from commercial activities and guide which activities are performed by military or civilian personnel.
    Officials must weigh workforce costs and risks against readiness, workforce management, and mission requirements. The
    policy framework also distinguishes combat responsibilities that require military authorities and controls from work that
    may be performed by civilians or contractors.
  question: What should DoD policy-drafters and manpower authorities do when setting workforce boundaries for traditional
    warfighting and support roles?
  options:
    O1:
      do: DoD manpower authorities shall prohibit civilian substitution in traditional warfighting roles and assess support
        work under workforce-mix criteria.
      move: act
      irreversible: false
    O2:
      do: DoD manpower authorities shall permit civilian substitution in traditional warfighting roles and assess support
        work under workforce-mix criteria.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: DoD policy-drafters were not looking to substitute civilian employees or contractors for military personnel in traditional
      warfighting roles.
  - id: F2
    kind: situation
    status: confirmed
    fact: Outsourcing under consideration was for support roles, often distant from the battlefield.
  - id: F3
    kind: authority
    status: confirmed
    fact: Rear area security remains a military mission, including on a linear battlefield.
  - id: F4
    kind: authority
    status: confirmed
    fact: DoDI 1100.22 provides criteria for distinguishing inherently governmental activities from commercial activities
      and for designating activities for military or DoD civilian performance.
  - id: F5
    kind: capability
    status: confirmed
    fact: Defense officials can assess how manpower shortfalls affect inherently governmental responsibilities, readiness,
      workforce management, and mission accomplishment.
  - id: F6
    kind: authority
    status: confirmed
    fact: Workforce policy calls for using the least costly personnel form consistent with military requirements and other
      DoD needs, while identifying commercial activities exempt from private-sector performance based on readiness and management
      needs.
  - id: F7
    kind: capability
    status: confirmed
    fact: In combat, military forces provide the authorities and controls, discipline, equipment, training, and organization
      needed to execute combat missions for the government.
  - id: F8
    kind: authority
    status: confirmed
    fact: DoDI 3020.41 calls for cautious use of contractors where major combat operations are ongoing or imminent.
  - id: F9
    kind: authority
    status: confirmed
    fact: Many duties regarded as taking a direct part in hostilities are restricted because their performance requires uniformed
      military personnel.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Workforce-mix criteria call for using the least costly personnel form only when consistent with military requirements
      and DoD needs; readiness and management needs can exempt commercial activities from private-sector performance.
  - id: C2
    facts:
    - F7
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Combat missions require military authorities and controls, discipline, equipment, training, and organization; duties
      involving direct participation in hostilities are restricted when they require uniformed military performance.
  - id: C3
    facts:
    - F1
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The stated policy boundary leaves traditional warfighting roles with military personnel, and rear area security remains
      a military mission.
  - id: C4
    facts:
    - F2
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The outsourcing under consideration concerns support, often distant from the battlefield, while contractors are to
      be used cautiously where major combat operations are ongoing or imminent.
  reasoning:
    read: This is a workforce-boundary decision, not a choice between outsourcing everything and outsourcing nothing. The
      key distinction is between commercial support that may be assessed for outsourcing and combat responsibilities whose
      authorities, controls, and performance the policy assigns to military forces.
    weighing: The manpower criteria permit cost-conscious workforce choices, but only consistently with military requirements,
      readiness, workforce management, and mission needs {C1}. The military-only requirements of combat, the treatment of
      direct participation in hostilities, and the continuing military responsibility for rear area security weigh against
      civilian substitution in traditional warfighting roles {C2} {C3}. The conservative contractor policy reinforces a bounded
      approach while leaving support work for assessment under the workforce-mix criteria {C4}. The balance depends on the
      activity's actual function and its readiness and mission risks, not cost alone.
    tradecraft: Apply the workforce-mix criteria to each activity, distinguish inherently governmental from commercial work,
      and document the role classification, cost comparison, and assessed effects on readiness, workforce management, and
      mission accomplishment. Keep the boundary on traditional warfighting roles clear while assessing support work on its
      own facts.
    uncertainty: What constitutes direct participation in hostilities raises unresolved questions. DoD analysts and outside
      researchers have reached different conclusions, including whether nontraditional recruits who operate in military missions
      must become military personnel. That disagreement concerns definitions and details; it does not displace the stated
      DoD policy boundary in this scenario.
    handoff: DoD policy-drafters and manpower authorities should make and document the workforce determination using the DoD
      criteria, with relevant policy and readiness advice where needed; the source assigns risk assessment to Defense officials
      rather than identifying a separate decision-maker.
    tempting_wrong:
      option: O2
      pull: Permitting substitution may appear to maximize use of the least costly workforce and apply commercial workforce
        criteria broadly.
      why_wrong: Cost is expressly subordinate to military requirements and other DoD needs, and the source says combat missions
        require military authorities, controls, discipline, and organization.
    rejected:
      O2: It was not chosen because permitting civilian substitution in traditional warfighting roles conflicts with the stated
        military requirements for combat and the policy-drafters' stated boundary.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: DoD policy and applicable authority changed, and the responsible authorities determined that civilian substitution
        in the relevant traditional warfighting roles could meet the required combat authorities, controls, and mission needs.
      then: O2
      why: That would remove the stated authority and capability basis for reserving those roles to military personnel.
    would_not_change:
    - id: noflip1
      if: The proposed civilian workforce were less costly, but military requirements, readiness needs, and the role's combat
        functions remained unchanged.
      why: The workforce rule makes least cost conditional on consistency with military requirements and other DoD needs.
    watch_for:
    - id: watch1
      what: Manpower shortfalls that could affect inherently governmental responsibilities, readiness, workforce management,
        or mission accomplishment.
      favors:
      - O1
      why: Officials are to assess those risks when determining the appropriate workforce mix; the assessment informs boundaries
        but does not by itself establish that traditional warfighting roles may be substituted.
  lesson: Use the least costly workforce only when it remains consistent with military requirements, readiness, and mission
    needs. Keep combat responsibilities requiring military authority and organization distinct from support work that may
    be evaluated for outsourcing.
  limits: This reasoning addresses the DoD policy boundary described for traditional warfighting and support roles; it does
    not decide the classification of every particular activity. The source itself notes unresolved questions and disagreement
    about what constitutes direct participation in hostilities.
