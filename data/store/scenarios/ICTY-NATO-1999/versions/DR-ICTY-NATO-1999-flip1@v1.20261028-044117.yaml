case:
  id: DR-ICTY-NATO-1999-flip1@v1
  title: Decision on Investigating Bridge Attack Incident [flip]
  status: needs_review
  setting: Western Bosnia, 15 May 1999, NATO oversight panel
  decider: the panel
  agent: the panel
  agent_role: decide
  situation: The panel is assessing an incident in which a NATO aircraft struck the Mostar railway bridge in western Bosnia
    on 15 May 1999. The bridge was deemed a lawful military objective. At the time of the attack a civilian commuter train
    was on the bridge and was hit by both munitions, causing civilian casualties. After the first strike, the controller ordered
    a second strike from the opposite end while the train remained on the structure. The panel has reviewed NATO statements
    and an independent technical report that dispute the timing and intent of the attacks. It must decide whether the facts
    justify recommending a formal investigation.
  question: What should the panel do regarding recommending an investigation of the bridge attack incident?
  options:
    O1:
      do: The panel should recommend an investigation of the incident.
      move: act
      irreversible: true
    O2:
      do: The panel should decline to recommend an investigation of the incident.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 15 May 1999 a NATO aircraft released two munitions at the Mostar railway bridge in western Bosnia.
  - id: F2
    kind: situation
    status: confirmed
    fact: A civilian commuter train was traversing the bridge at that moment and was hit by both munitions, resulting in at
      least twelve fatalities and several injuries.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: A declassified NATO after‑action briefing released in 2000 recorded that the aircraft crew had identified the passenger
      train as the primary objective for the second weapon strike.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The bridge was identified as a supply corridor used by Bosnian Serb forces operating in the region.
  - id: F5
    kind: capability
    status: assessed
    fact: The pilot observed movement on the bridge just before the first munition impacted but was unable to abort the weapon.
  - id: F6
    kind: capability
    status: assessed
    fact: Following the initial impact, the controller ordered a second strike from the opposite side while the train remained
      on the structure.
  - id: F7
    kind: authority
    status: assessed
    fact: The panel examined NATO documentation and an independent forensic analysis and concluded the bridge qualified as
      a lawful target, asserting the train was not the intended target.
  - id: F8
    kind: authority
    status: assessed
    fact: The panel determined there was insufficient justification to launch an inquiry into the first strike and, despite
      internal disagreement about the second, opted against an investigation.
  - id: F9
    kind: authority
    status: assessed
    fact: The panel found no evidence to consider senior command liability.
  considerations:
  - id: C1
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The bridge was verified as a legitimate military objective, satisfying the legal authority to engage it.
  - id: C2
    facts:
    - F3
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The declassified briefing shows the crew identified the passenger train as the primary target for the second strike,
      indicating intentional targeting of civilians.
  reasoning:
    read: The incident involved a lawful bridge that was hit while a civilian train was present, but newly revealed evidence
      shows the train was deliberately targeted in the second strike.
    weighing: The bridge's legitimacy (C1) is outweighed by the clear intent to strike civilians (C2 and the new consideration),
      making an investigation warranted.
    tradecraft: Document the decision in the panel's report, cite the declassified briefing and supporting analysis, and forward
      the recommendation to the appropriate oversight authority.
    uncertainty: Minor uncertainty remains about the exact decision-making chain for the second strike, but the intent evidence
      meets the panel's threshold for investigation.
    handoff: The panel acts within its delegated authority and does not require higher-level approval to recommend an inquiry.
    tempting_wrong:
      option: O2
      pull: Desire to avoid diplomatic repercussions with NATO allies.
      why_wrong: Rejecting an investigation would ignore the explicit evidence of intentional civilian targeting, violating
        the panel's mandate.
    rejected:
      O2: The panel cannot disregard the briefing that identifies the train as the primary objective; doing so would conflict
        with its responsibility to examine intentional attacks on civilians.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: If subsequent analysis confirms that the passenger train was not deliberately selected as the target for the second
        strike
      then: O2
      why: Absence of intentional targeting would remove the trigger for a formal inquiry.
    would_not_change:
    - id: noflip1
      if: If technical review shows the weapons operator had ample time to abort the second strike
      why: The panel's original assessment would remain unchanged because the operator's reaction window would not be a mitigating
        factor.
    watch_for:
    - id: watch1
      what: Any independent forensic report that contradicts the declassified briefing's claim of intentional targeting
      favors:
      - O1
      why: Contradictory forensic findings could alter the determination of deliberate civilian targeting.
  lesson: When credible evidence demonstrates that civilians were intentionally targeted, an investigation is required regardless
    of the underlying target's legitimacy.
  limits: This guidance applies only when there is direct, verifiable evidence of intentional targeting of civilians; it does
    not extend to cases where civilian harm is incidental or where the legality of the primary target is disputed.
