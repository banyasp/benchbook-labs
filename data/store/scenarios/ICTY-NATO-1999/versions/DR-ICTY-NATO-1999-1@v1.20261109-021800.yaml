case:
  id: DR-ICTY-NATO-1999-1@v1
  title: Decision on Investigating Bridge Attack Incident
  status: draft
  setting: Eastern Serbia, 12 April 1999, NATO review committee
  decider: the committee
  agent: the committee
  agent_role: decide
  situation: The committee is reviewing an incident in which a NATO aircraft attacked a railway bridge in eastern Serbia on
    12 April 1999. The bridge was considered a legitimate military objective. During the attack a passenger train was on the
    bridge and was struck by two weapons, causing civilian casualties. The first weapon struck the train before the bridge
    was destroyed; the controller then ordered a second strike at the opposite end of the bridge while the train remained
    on the structure. The committee has examined NATO statements and an independent technical report that dispute the timing
    and intent of the attacks. It must decide whether the facts warrant recommending a formal investigation.
  question: What should the committee do regarding recommending an investigation of the bridge attack incident?
  options:
    O1:
      do: The committee should recommend an investigation of the incident.
      move: act
      irreversible: true
    O2:
      do: The committee should decline to recommend an investigation of the incident.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 12 April 1999 a NATO aircraft launched two weapons at the Leskovac railway bridge in eastern Serbia.
  - id: F2
    kind: situation
    status: confirmed
    fact: A passenger train was crossing the bridge at the time and was struck by both weapons, killing at least ten people
      and injuring at least fifteen.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The designated target was the bridge, claimed to be part of a re‑supply route used by Serb forces in Kosovo.
  - id: F4
    kind: capability
    status: assessed
    fact: The pilot or weapons systems officer saw movement on the bridge at the last instant before impact of the first weapon
      but could not abort the weapon.
  - id: F5
    kind: capability
    status: assessed
    fact: After the first strike the controller chose to attack the bridge again from the opposite end while the train remained
      on the bridge.
  - id: F6
    kind: authority
    status: assessed
    fact: The committee reviewed NATO material and an independent technical report and concluded the bridge was a legitimate
      military objective and the train was not deliberately targeted.
  - id: F7
    kind: authority
    status: assessed
    fact: The committee found insufficient basis to initiate an investigation of the first bomb attack and, despite divided
      views on the second bomb, decided the incident should not be investigated.
  - id: F8
    kind: authority
    status: assessed
    fact: The committee found no information warranting consideration of command responsibility.
  considerations:
  - id: C1
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The committee concluded the bridge was a legitimate military objective, satisfying the legal authority to attack.
  - id: C2
    facts:
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The committee found the passenger train was not deliberately targeted, indicating no intent to harm civilians.
  - id: C3
    facts:
    - F7
    equity: oversight_candor
    favors:
    - O2
    weight: strong
    why: The committee judged there was insufficient factual basis to open an investigation of the first bomb strike.
  - id: C4
    facts:
    - F7
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Although views differed on the second bomb, the committee applied its established criteria and still found no trigger
      for an investigation.
  reasoning:
    read: The incident involved a legitimate military target that was struck while a civilian train was present; the committee
      must decide whether the facts meet its threshold for launching a formal inquiry.
    weighing: The bridge’s legitimacy (C1) and the lack of deliberate intent to hit the train (C2), together with the finding
      of insufficient evidentiary basis (C3) and the application of the committee’s own investigative criteria (C4), lead
      the balance toward declining an investigation.
    tradecraft: Record the decision in the committee’s report, cite the relevant facts and considerations, and file the conclusion
      with the oversight body without initiating a formal investigative process.
    uncertainty: Minor uncertainty remains regarding the second bomb’s recklessness, but the committee’s own standard was
      applied and deemed not met.
    handoff: The committee decides alone; no higher authority or external body is required because the committee has the delegated
      authority to assess investigation triggers.
    tempting_wrong:
      option: O1
      pull: Pressure from civilian advocacy groups to hold an inquiry.
      why_wrong: The committee concluded the evidentiary threshold was not satisfied, and opening an investigation would contravene
        the committee’s established criteria.
    rejected:
      O1: The committee found the bridge a lawful target, no deliberate targeting of civilians, and insufficient grounds under
        its own rules to launch an inquiry.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: New credible evidence demonstrated intentional targeting of the passenger train
      then: O1
      why: Intentional attack on civilians would meet the committee’s threshold for a formal investigation.
    would_not_change:
    - id: noflip1
      if: Technical analysis showed a longer reaction time for the weapons operator
      why: The committee already assessed the reaction window as short enough that the operator could not have avoided the
        strike, so the conclusion remains unchanged.
    watch_for:
    - id: watch1
      what: Any independent forensic report that contradicts the committee’s assessment of intent
      favors:
      - O1
      why: A contradictory forensic finding could alter the determination of deliberate targeting.
  lesson: When a lawful military target is engaged and civilian harm occurs without deliberate intent, an investigation is
    only warranted if the evidentiary threshold for recklessness or unlawful conduct is met.
  limits: This reasoning applies only to incidents where the target is confirmed legitimate and there is no evidence of intentional
    targeting of civilians; it does not extend to cases involving prohibited weapons or clear violations of the law of armed
    conflict.
  library:
    domain: military-operational
    family: ICTY-NATO-1999
    source: https://www.icty.org/en/node/5389
    episode_focus: Whether the aircrew should continue the attack on a bridge by firing a second time once a passenger train
      had appeared on it, and whether the committee should recommend an investigation of the incident.
    cues:
      option_words:
        O1: 9
        O2: 11
      real_option: O2
      real_to_mean_other_length: 1.22
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
