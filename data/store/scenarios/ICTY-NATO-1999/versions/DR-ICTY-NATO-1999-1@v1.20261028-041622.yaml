case:
  id: DR-ICTY-NATO-1999-1@v1
  title: Investigation Recommendation for Bridge Bombing Incident
  status: draft
  setting: Eastern Serbia, 12 April 1999, NATO review committee
  decider: the review committee
  agent: the review committee
  agent_role: decide
  situation: On 12 April 1999 a NATO aircraft released two bombs against a railway bridge in eastern Serbia that was considered
    a military supply route. A civilian passenger train was crossing the bridge at the moment and was struck by both bombs,
    causing at least ten deaths and fifteen injuries. The bridge was the intended target and the train was not deliberately
    targeted, according to statements from senior officials. After the first bomb hit, the aircraft's weapon operator launched
    a second bomb aimed at another point on the bridge while the train was still on it. A technical analysis later suggested
    the operator may have had slightly more reaction time than initially claimed, but still only a few seconds. The review
    committee evaluated the incident and concluded the bridge was a legitimate target, the train was not intentionally attacked,
    and there was insufficient basis to open an investigation, though members were divided on the second bomb.
  question: What should the review committee do regarding recommending an investigation of the bridge bombing incident?
  options:
    O1:
      do: The committee recommends opening an investigation into the incident.
      move: act
      irreversible: true
    O2:
      do: The committee holds the decision pending further technical analysis.
      move: hold
      irreversible: false
    O3:
      do: The committee declines to open an investigation of the incident.
      move: act
      irreversible: true
    O4:
      do: The committee asks for additional evidence before deciding on an investigation.
      move: ask
      irreversible: false
      to: the investigative staff
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 12 April 1999 a NATO aircraft released two bombs against a railway bridge in eastern Serbia.
  - id: F2
    kind: situation
    status: confirmed
    fact: A civilian passenger train was crossing the bridge at the time and was struck by both bombs, resulting in at least
      ten deaths and at least fifteen injuries.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The designated target was the railway bridge, claimed to be part of a re‑supply route for Serb forces in Kosovo.
  - id: F4
    kind: authority
    status: confirmed
    fact: A US Deputy Defense Secretary stated that the bomb homed in on the bridge and the train was not deliberately targeted,
      and expressed regret for the accident.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The NATO Supreme Allied Commander testified that the weapon operator saw the train only at the last instant, could
      not abort the first bomb, and launched a second bomb aimed at another point on the bridge while the train remained on
      it.
  - id: F6
    kind: capability
    status: assessed
    fact: A technical report suggested the weapon operator may have had 7 to 8 seconds of reaction time, slightly longer than
      initially claimed.
  - id: F7
    kind: authority
    status: confirmed
    fact: The committee concluded the bridge was a legitimate military objective, the train was not deliberately targeted,
      and there was insufficient basis to initiate an investigation, ultimately deciding not to investigate.
  - id: F8
    kind: authority
    status: confirmed
    fact: The committee found no information warranting a command‑responsibility investigation.
  considerations:
  - id: C1
    facts:
    - F3
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The committee found the bridge to be a legitimate military objective, satisfying the lawful authority to strike.
  - id: C2
    facts:
    - F4
    - F5
    equity: civilian_life
    favors:
    - O3
    weight: strong
    why: Official statements assert the passenger train was not deliberately targeted; the civilian casualties were unintended.
  - id: C3
    facts:
    - F7
    - F8
    equity: oversight_candor
    favors:
    - O3
    weight: strong
    why: The committee concluded there was insufficient factual basis under its own criteria to open an investigation.
  - id: C4
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: Even accepting the longer reaction time, the committee judged the evidence still did not meet the threshold for recklessness.
  reasoning:
    read: The incident involved an accidental strike on a civilian train while the intended target, a bridge used for military
      logistics, was being attacked. The core issue is whether the accidental civilian harm triggers a formal investigation.
    weighing: The committee weighed the legitimacy of the bridge as a target (C1), the lack of intent to hit the train (C2),
      and its own investigative threshold (C3). Although there was some debate about the second bomb’s recklessness (C4),
      the balance remained in favor of declining an investigation, because the bridge was a lawful objective and the train
      was not deliberately targeted.
    tradecraft: Record the decision in the committee’s minutes, cite the relevant paragraphs (p1.200‑p1.202), and file the
      conclusion with the OTP without initiating a formal investigative docket.
    uncertainty: Limited by the technical report’s differing reaction‑time estimate, but the committee judged the uncertainty
      insufficient to alter the outcome.
    handoff: The review committee acted alone; no higher authority or external body was consulted because the committee’s
      own authority was deemed adequate.
    tempting_wrong:
      option: O1
      pull: A desire to demonstrate accountability for civilian casualties could push toward opening an investigation.
      why_wrong: The committee’s own assessment found no legal or factual basis to justify such an investigation, making it
        an overreach.
    rejected:
      O1: The committee found no evidence of intentional targeting or sufficient recklessness to meet its investigation criteria.
      O2: Holding the decision pending further analysis was unnecessary because the committee had already evaluated the available
        evidence.
      O4: Additional evidence was not required; the committee concluded the existing record did not support an inquiry.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: New credible evidence showed that the weapon operator intentionally targeted the train rather than the bridge.
      then: O1
      why: Intentional targeting of civilians would meet the committee’s threshold for opening an investigation.
    would_not_change:
    - id: noflip1
      if: The technical report confirms a slightly longer reaction time (7‑8 seconds) but still no intent to strike the train.
      why: The committee already considered this scenario and maintained that the evidence remained insufficient.
    watch_for:
    - id: watch1
      what: Any future findings of command‑level orders to prioritize bridge destruction over civilian safety.
      favors:
      - O1
      why: Evidence of higher‑level recklessness or unlawful orders would raise command‑responsibility concerns.
  lesson: An investigation is warranted only when there is sufficient evidence of intentional targeting or reckless disregard
    for civilian life; accidental collateral damage alone does not automatically trigger a probe.
  limits: This reasoning applies when the target is a lawful military objective and the civilian harm is unintended. It does
    not extend to cases where civilians are deliberately targeted or where the target itself is unlawful.
