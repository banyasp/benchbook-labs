case:
  id: DR-ICTY-NATO-1999-3@v1
  title: Bombing of Serbian State Broadcasting Station
  status: draft
  setting: Belgrade, Yugoslavia, April 1999, NATO Operation Allied Force
  decider: the NATO alliance leadership
  agent: the NATO alliance
  agent_role: decide
  situation: On 23 April 1999 NATO aircraft bombed the central studio of the state-owned RTS broadcasting corporation in Belgrade,
    killing between ten and seventeen civilians. NATO officials justified the strike as part of a coordinated campaign to
    disrupt the Federal Republic of Yugoslavia's command, control and communications network, emphasizing the dual military
    and civilian use of the facility. They also argued that the station was a key element of the regime's propaganda apparatus
    and therefore a legitimate target. NATO claimed the RTS housed a large satellite antenna and was integrated with radio
    relay stations that supported military and special police forces. The alliance said it had taken steps to avoid civilian
    casualties, but there is uncertainty about whether specific warnings were given to civilians before the attack. The ICTY
    review committee later concluded that, if the attack was aimed at disrupting communications, it was legally acceptable
    and the civilian casualties were not clearly disproportionate, and it recommended no investigation.
  question: What should the NATO alliance do regarding striking the state broadcasting station?
  options:
    O1:
      do: The NATO alliance attacks the broadcasting station.
      move: act
      irreversible: true
    O2:
      do: The NATO alliance holds the decision on the station.
      move: hold
      irreversible: false
    O3:
      do: The NATO alliance protects the broadcasting station.
      move: act
      irreversible: true
    O4:
      do: The NATO alliance postpones striking the broadcasting station.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 23 April 1999 at 0220 NATO bombed the RTS central studio in Belgrade, killing an estimated ten to seventeen civilians.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: NATO justified the bombing as part of an attack to disrupt the FRY command, control and communications network,
      emphasizing the dual-use nature of the facility.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: NATO also justified the strike on propaganda grounds, describing the station as the central nerve system of the
      president's regime.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: NATO claimed the RTS facilities were used as radio relay stations supporting FRY military and special police forces,
      making them legitimate military targets.
  - id: F5
    kind: intelligence
    status: assessed
    fact: NATO officials said they made every possible effort to avoid civilian casualties, but there is doubt about whether
      specific warnings were given to civilians.
  - id: F6
    kind: authority
    status: confirmed
    fact: The ICTY review committee concluded that if the attack was aimed at disrupting communications, it was legally acceptable
      and civilian casualties were not clearly disproportionate.
  - id: F7
    kind: authority
    status: confirmed
    fact: The ICTY review committee recommended that no investigation be opened into the bombing of the Serbian TV and radio
      station.
  - id: F8
    kind: capability
    status: confirmed
    fact: The RTS building housed a large satellite antenna dish and was integrated with military radio relay sites.
  - id: F9
    kind: authority
    status: confirmed
    fact: NATO policy stated that television and radio towers are only struck if integrated into military facilities; there
      is no policy to strike them as such.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F8
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: NATO demonstrated that the RTS facility housed a satellite antenna and was integrated with military radio relay stations,
      and NATO policy permits striking TV towers only when they are part of military installations.
  - id: C2
    facts:
    - F3
    equity: civilian_life
    favors:
    - O2
    - O3
    - O4
    weight: weak
    why: The propaganda rationale alone does not satisfy the "effective contribution to military action" test under Article
      52 of Protocol I.
  - id: C3
    facts:
    - F6
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The ICTY review committee found that, assuming the attack was aimed at communications, the civilian casualties were
      not clearly disproportionate to the anticipated military advantage.
  - id: C4
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O2
    - O4
    weight: weak
    why: Uncertainty remains whether NATO gave an effective specific warning to civilians, which could affect the proportionality
      assessment.
  - id: C5
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: NATO’s standing policy states that television and radio towers are struck only when they are integrated into military
      facilities, providing a legal basis for the attack.
  reasoning:
    read: The situation pits a dual‑use broadcasting centre—used for civilian media and for military command‑and‑control—against
      the civilian lives inside it. The trap is to treat any propaganda outlet as a lawful target without confirming a concrete
      military contribution.
    weighing: C1 and C5 establish that the RTS building met the dual‑use criterion and fell within NATO’s targeting policy,
      supporting {O1}. C3 adds that the ICTY committee judged the proportionality balance acceptable. C2 and C4 highlight
      concerns about the propaganda motive and warning adequacy, but they are weighed as weak because the primary justification
      rests on communications disruption, not propaganda. The overall balance therefore favours the attack.
    tradecraft: Record the decision in the NATO strike‑cell log, cite the ICTY review committee’s endorsement, and ensure
      that any future strikes on similar dual‑use sites include documented verification of the military function and the issuance
      of specific civilian warnings where feasible.
    uncertainty: The exact nature of the warning given to civilians remains unclear, and the extent to which the propaganda
      motive alone influenced the targeting decision is not fully resolved.
    handoff: The decision rests with the NATO alliance leadership; no further referral to a higher authority is required because
      the ICTY committee already provided the legal endorsement.
    tempting_wrong:
      option: O3
      pull: Avoid civilian casualties by protecting the station.
      why_wrong: Protecting the station would ignore the verified military function of the facility and conflict with NATO’s
        stated policy that such integrated sites are legitimate targets.
    rejected:
      O2: Holding the decision would forfeit the opportunity to degrade a verified component of the FRY command‑and‑control
        network.
      O3: Protecting the station would contravene NATO policy and the ICTY finding that the target was lawful when used for
        communications.
      O4: Postponing the strike would allow the FRY to continue using the dual‑use infrastructure, undermining the mission’s
        objective to disrupt enemy C2.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Evidence showed that the RTS building was targeted solely for its propaganda role, with no genuine military communications
        function.
      then: O3
      why: A purely propaganda motive fails the "effective contribution to military action" test, making the strike unlawful.
    would_not_change:
    - id: noflip1
      if: Civilian casualties were found to be proportionate to the concrete military advantage gained.
      why: Proportionality would remain satisfied, so the attack stays lawful.
    watch_for:
    - id: watch1
      what: Future intelligence indicating that civilian warning procedures were insufficient or that the dual‑use nature
        was overstated.
      favors:
      - O2
      - O4
      why: Such information could shift the proportionality or legitimacy assessment.
  lesson: When a facility serves both civilian and military functions, it can be a lawful target if the military contribution
    is concrete and the anticipated advantage is definite; however, the proportionality and precautionary warning requirements
    must still be satisfied.
  limits: This reasoning applies only where a clear, verifiable military use of the dual‑use site exists and where proportionality
    is not demonstrably exceeded. It does not justify attacks on purely civilian propaganda outlets.
