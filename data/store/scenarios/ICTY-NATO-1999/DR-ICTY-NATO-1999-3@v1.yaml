case:
  id: DR-ICTY-NATO-1999-3@v1
  title: Bombing of RTS Broadcasting Station
  status: draft
  setting: Belgrade, Yugoslavia, April 1999, NATO alliance command
  decider: the NATO command
  agent: the NATO command
  agent_role: decide
  situation: On 23 April 1999 NATO aircraft bombed the central studio of the state-owned RTS broadcasting corporation in Belgrade,
    killing an estimated ten to seventeen civilians. NATO officials justified the strike as part of a coordinated campaign
    to disrupt the Federal Republic of Yugoslavia's command, control and communications network, citing the dual‑use nature
    of the facility. They also claimed the station served as a propaganda tool for the Yugoslav president's regime and therefore
    a legitimate target. NATO asserted that it had taken precautions to limit civilian harm, though reports differ on whether
    a specific warning was issued to civilians. Broadcasting resumed within hours after the attack, and the overall campaign
    also targeted radio relay sites and power transformers essential to air‑defence coordination. International humanitarian
    law requires a target to make an effective contribution to military action and offer a definite military advantage to
    be considered a military objective.
  question: What should the NATO command do regarding striking the RTS broadcasting station as part of the command‑and‑control
    network attack?
  options:
    O1:
      do: NATO carries out strike on RTS station
      move: act
      irreversible: true
    O2:
      do: NATO decides not to strike RTS station
      move: act
      irreversible: true
    O3:
      do: NATO seeks further intelligence on RTS station
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 23 April 1999 at 0220 NATO bombed the central studio of RTS in Belgrade, killing an estimated ten to seventeen
      civilians.
  - id: F2
    kind: intelligence
    status: assessed
    fact: NATO justified the attack as part of a campaign to disrupt the FRY command, control and communications network,
      citing the dual‑use nature of the facility.
  - id: F3
    kind: intelligence
    status: assessed
    fact: NATO claimed the RTS facilities were used as radio relay stations and transmitters supporting FRY military and special
      police forces, making them legitimate military targets.
  - id: F4
    kind: intelligence
    status: assessed
    fact: NATO also justified the strike on propaganda grounds, describing the station as a central nerve system of the Yugoslav
      president's regime.
  - id: F5
    kind: capability
    status: assessed
    fact: NATO officials said they made every possible effort to avoid civilian casualties, but there is uncertainty whether
      a specific warning was given to civilians.
  - id: F6
    kind: situation
    status: confirmed
    fact: Broadcasting at the RTS station resumed within hours after the strike.
  - id: F7
    kind: authority
    status: confirmed
    fact: Article 52 of Protocol I defines a military objective as requiring effective contribution to military action and
      a definite military advantage.
  - id: F8
    kind: authority
    status: confirmed
    fact: The 1956 ICRC list of military objectives includes broadcasting stations of fundamental military importance if they
      meet the criteria.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F8
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The RTS facility was described as a radio relay and satellite antenna integrated into the FRY command, control and
      communications network, satisfying Article 52 of Protocol I and the 1956 ICRC list of military objectives.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Although propaganda was cited, NATO stated that the propaganda aim was incidental to the primary objective of degrading
      the military C3 network; therefore the attack retained a legitimate military purpose.
  - id: C3
    facts:
    - F1
    - F6
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Ten to seventeen civilian deaths occurred, but the committee judged the casualties were not clearly disproportionate
      to the anticipated advantage of interrupting the command‑and‑control system.
  - id: C4
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: NATO asserted it made every possible effort to avoid civilian casualties, and any lack of a specific warning was
      considered insufficient to outweigh the target’s military significance.
  reasoning:
    read: The RTS building was a dual‑use installation that housed both civilian broadcasting and military communications
      equipment. The dilemma was whether a strike justified by its role in the FRY C3 network, and partly by its propaganda
      function, complied with IHL’s definition of a military objective and proportionality requirements.
    weighing: C1 provides a strong legal basis, while C3 acknowledges civilian loss but finds it not clearly disproportionate.
      C2 and C4 are noted but deemed insufficient to overturn the conclusion. The overall balance therefore favours striking
      the target.
    tradecraft: Record the decision in the NATO strike cell log, cite Article 52 and the ICRC list, and file the justification
      with the chain of command for later oversight. Preserve all intelligence assessments used.
    uncertainty: The precise effect of the strike on the FRY communications network and the adequacy of any civilian warning
      are not fully known.
    handoff: The decision rests with the NATO command authority; no further approval is required beyond the standard ROE sign‑off,
      though the outcome is to be reported to higher strategic leadership.
    tempting_wrong:
      option: O2
      pull: Moral aversion to civilian deaths and the perception that a media outlet is a protected civilian object.
      why_wrong: Rejecting the strike would forfeit a legitimate means of degrading the enemy’s command network and would
        ignore the dual‑use nature that makes the target lawful under IHL.
    rejected:
      O2: The target meets the military‑objective criteria and the proportionality assessment does not show excessive civilian
        harm.
      O3: Intelligence on the dual‑use function was already sufficient; further collection would delay a time‑critical operation.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: the RTS facility had no military communications function and was targeted solely for propaganda purposes
      then: O2
      why: Without an effective contribution to military action, the target would fail the Article 52 test and the attack
        would be unlawful.
    would_not_change:
    - id: noflip1
      if: a specific civilian warning was not issued
      why: The lack of a precise warning does not negate the target’s legality or proportionality.
    watch_for:
    - id: watch1
      what: future evidence showing higher civilian casualties or a longer‑lasting broadcast interruption
      favors:
      - O2
      why: Such evidence could shift the proportionality assessment toward excessiveness.
  lesson: When a facility serves a genuine military communications function, it may be lawfully targeted even if civilians
    are present, provided the anticipated advantage is concrete and civilian harm is not clearly disproportionate.
  limits: This analysis applies only where credible intelligence confirms a dual‑use communications role; it does not justify
    attacks on purely civilian propaganda outlets.
