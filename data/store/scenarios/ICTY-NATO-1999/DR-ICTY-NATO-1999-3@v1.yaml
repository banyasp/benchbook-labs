    domain: military-operational
    family: ICTY-NATO-1999
    source: https://www.icty.org/en/node/5389
    episode_focus: Whether the alliance should strike the state broadcasting station as part of an attack on command-and-control
      networks, given the dual military and civilian use claimed and the expected civilian casualties.
