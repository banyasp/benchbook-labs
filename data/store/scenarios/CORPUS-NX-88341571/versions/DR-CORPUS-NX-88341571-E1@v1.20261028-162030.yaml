case:
  id: DR-CORPUS-NX-88341571-E1@v1
  title: Analytic Priorities After the Attacks
  status: draft
  setting: Directorate of Intelligence, following the terrorist attacks of 11 September 2001; place not specified.
  decider: The Directorate of Intelligence
  agent: The Directorate of Intelligence
  agent_role: decide
  situation: The terrorist attacks of 11 September 2001 brought counterterrorism to the forefront of policy priorities. The
    Directorate of Intelligence is committed to adjusting production priorities to policy priorities. The counterterrorism
    effort emphasizes analytic support for tactical warning. The Directorate also remains committed to expanding analytic
    skills and depth. Some measures related to that expansion are at issue alongside the demand for counterterrorism support.
  question: What should the Directorate of Intelligence do with its analytic-resource priorities following the 11 September
    2001 attacks?
  options:
    O1:
      do: The DI decreases analytic-resource support for counterterrorism and tactical warning while advancing some expertise-building
        measures.
      move: act
      irreversible: false
    O2:
      do: The DI increases analytic-resource support for counterterrorism and tactical warning while holding some expertise-building
        measures.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Directorate of Intelligence is committed to adjusting production priorities to policy priorities.
  - id: F2
    kind: situation
    status: confirmed
    fact: The terrorist attacks of 11 September 2001 precipitated a large-scale shift of Directorate resources into counterterrorism.
  - id: F3
    kind: situation
    status: confirmed
    fact: The counterterrorism effort emphasized analytic support for tactical warning.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Directorate's commitment to expanding analytic skills and depth remained intact.
  - id: F5
    kind: situation
    status: confirmed
    fact: Some Directorate actions related to expanding analytic skills and depth were placed on hold.
  - id: F6
    kind: capability
    status: confirmed
    fact: A planned expansion of hiring and training new analysts was intended to restore momentum over time.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Directorate's stated commitment was to align production priorities with policy priorities, and the attacks prompted
      a large-scale counterterrorism resource shift.
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The counterterrorism effort emphasized analytic support for tactical warning, supporting the increased allocation
      to that effort.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The Directorate kept its commitment to expanding analytic skills and depth, while placing some related measures on
      hold and intending to restore momentum over time through planned hiring and training.
  reasoning:
    read: 'This is a policy-level allocation choice following a major change in policy priorities: the Directorate shifted
      resources toward counterterrorism, including tactical-warning support, while some analytic-capacity measures were paused.
      The trap is to treat the pause as abandonment of the commitment to analytic depth, or to treat that commitment as requiring
      that the counterterrorism shift be reversed.'
    weighing: The Directorate's commitment to align production priorities with policy priorities and the counterterrorism
      effort's emphasis on tactical warning support the increased allocation {C1} {C2}. The continued commitment to analytic
      skills and depth, together with planned hiring and training to restore momentum, makes the hold on some measures a deferral
      rather than a stated abandonment {C3}. The balance depends on counterterrorism remaining a leading policy priority while
      the planned capacity-building effort remains a credible longer-term commitment.
    tradecraft: 'Keep the decision at the policy-allocation level: record the increased counterterrorism support and identify
      the expertise-building measures placed on hold, alongside the planned hiring and training intended to restore momentum.
      Do not infer operational details or a specific duration for the holds.'
    uncertainty: The source does not specify how resources were divided, which expertise-building actions were paused, how
      long they were expected to remain on hold, or what measures would show that momentum had been restored.
    handoff: The Directorate is identified as the decision-maker for this policy-level reprioritization. No separate approval
      authority or consultation requirement is specified.
    tempting_wrong:
      option: O1
      pull: The Directorate remained committed to expanding analytic skills and depth, and some related measures were at issue.
      why_wrong: That commitment did not displace the stated adjustment of production priorities to policy priorities; the
        Directorate instead increased counterterrorism support and planned to restore capacity-building momentum over time.
    rejected:
      O1: The Directorate did not reduce counterterrorism and tactical-warning support to advance expertise-building measures;
        it shifted resources toward counterterrorism while keeping the longer-term commitment to analytic depth.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Policy priorities shifted away from counterterrorism and tactical warning and instead made advancing analytic expertise
        the immediate priority.
      then: O1
      why: The stated reason for the large-scale shift was alignment with policy priorities; a different priority balance
        could support advancing expertise-building measures instead.
    would_not_change:
    - id: noflip1
      if: The Directorate's commitment to expanding analytic skills and depth remained intact.
      why: That commitment coexisted with the decision to increase counterterrorism support and hold some related measures
        temporarily.
    watch_for:
    - id: watch1
      what: Whether the planned hiring and training of new analysts proceeds and restores momentum in analytic skills and
        depth.
      favors:
      - O1
      why: Progress on the planned expansion would strengthen the case for directing more attention to expertise-building
        measures over time.
  lesson: When policy priorities change, analytic-resource allocation may shift to support the newly emphasized mission. A
    temporary pause in capacity-building need not mean abandoning it if the institution retains the commitment and plans a
    path to restore momentum.
  limits: This reasoning applies to the Directorate's stated post-attack policy reprioritization, not to operational decisions
    about collection or operations. The source gives no resource totals, detailed implementation plan, or independent assessment
    of the effects of either allocation.
  library:
    domain: intel-analysis
    family: CORPUS-NX-88341571
    source: https://www.cia.gov/resources/csi/static/565896f3a1bb0623fc073b4dea27f419/DI-Analytic-Performances.pdf
    episode_focus: 'The decision point is the Directorate’s post-attack reprioritization: counterterrorism and tactical warning
      received increased support, while some expertise-building measures were put on hold. Focus on the policy-level allocation
      of analytic resources; exclude operational details of collection or operations.'
