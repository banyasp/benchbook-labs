case:
  id: DR-CORPUS-NX-e5f41fd4-E1@v1
  title: Military Support to Civil Policing in Northern Ireland
  status: draft
  setting: Northern Ireland, from 1969 through the early 1980s; British military and police institutions.
  decider: The British military authorities; the specific decision-maker is not identified.
  agent: The British military authorities
  agent_role: decide
  situation: In 1969, British military forces did not fully understand the situation in Northern Ireland. Processes and tactics
    drawn from colonial campaigns did not work there. The forces needed to understand how local communities and individual
    and group actors would react to events. Police and military cooperation could contribute to that understanding. The command
    relationship between the military and police was a matter for decision under the legal arrangements for military assistance
    to the civil power.
  question: What should the British military authorities do about the command relationship between military forces and the
    police in Northern Ireland?
  options:
    O1:
      do: The British military authorities should refer the command relationship to the civil authorities before setting it.
      move: ask
      irreversible: false
      to: the civil authorities
    O2:
      do: The British military authorities should place military forces in the lead over the police under the military-assistance-to-the-civil-power
        arrangements.
      move: act
      irreversible: false
    O3:
      do: The British military authorities should place military forces in support of the police under the military-assistance-to-the-civil-power
        arrangements.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: In 1969, the British military did not fully understand the nature of the situation in Northern Ireland.
  - id: F2
    kind: situation
    status: assessed
    fact: Processes and tactics drawn from colonial campaigns did not work in Northern Ireland.
  - id: F3
    kind: capability
    status: assessed
    fact: By the early 1980s, learning and adaptation had improved the military forces' understanding of the Province's dynamics
      and its individual and group actors.
  - id: F4
    kind: capability
    status: confirmed
    fact: Police and military cooperation supported foresight about how particular communities and actors would react to events.
  - id: F5
    kind: capability
    status: confirmed
    fact: The police network, particularly Special Branch, underpinned continuity of understanding.
  - id: F6
    kind: authority
    status: confirmed
    fact: The British Army worked in support of the police under legal arrangements for military assistance to the civil power.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Colonial processes and tactics did not work; the later improvement came through learning and adaptation to the Province's
      dynamics. This weighs against putting the military in the lead on the basis of the earlier approach.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Police-military cooperation supported foresight about how communities and actors would react to events, a stated
      contribution to understanding local dynamics.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The police network, particularly Special Branch, underpinned continuity of understanding, reinforcing the value of
      a police-led relationship.
  - id: C4
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The described relationship places the Army in support of the police under the legal arrangements for military assistance
      to the civil power.
  reasoning:
    read: 'The problem was not simply a lack of military capability: the military initially misunderstood the situation, and
      imported colonial processes and tactics failed. The trap is to respond by placing the military in the lead, even though
      the later account links better understanding to adaptation and police-military cooperation.'
    weighing: 'The strongest stated reasons favor support of the police: cooperation improved foresight, the police network
      sustained continuity, and the Army''s role was described as support under the legal arrangements. The account also credits
      learning and adaptation, not a change to military command over police, with improved understanding. This recommendation
      depends on those arrangements remaining applicable and cooperation continuing to contribute to understanding.'
    tradecraft: State the command relationship and its legal basis explicitly, document the police-military responsibilities
      and any civil-authority direction, and review the arrangement if its authority or practical effectiveness changes. Do
      not infer from this account that it prescribes particular intelligence or deployment methods.
    uncertainty: The account describes the support relationship and its context but does not identify a particular decision-maker
      or date, set out a discrete decision process, or compare the three options. It therefore supports O3 as the presented
      outcome without establishing that a specific official formally considered and rejected the alternatives.
    handoff: Coordinate the relationship with the police and keep it within the applicable military-assistance legal arrangements.
      If the authority to set or change the relationship is unclear, seek direction from the competent civil authorities;
      the account does not specify who held that authority.
    tempting_wrong:
      option: O2
      pull: The military's initial lack of understanding may make military leadership seem like a direct way to impose unity
        of command.
      why_wrong: The account says the imported military approach did not work and attributes improved understanding to adaptation
        and police-military cooperation, while describing the Army as supporting the police.
    rejected:
      O1: The account presents an existing support relationship under legal arrangements and gives no reason to defer setting
        that relationship to civil authorities, though unclear authority would warrant referral.
      O2: Military lead is not the relationship the account presents; its stated explanation for improved understanding emphasizes
        adaptation, police cooperation, and police-network continuity.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The military authorities could not establish that the applicable legal arrangements authorized the proposed support
        relationship or identify the proper authority to set it.
      then: O1
      why: An unresolved question about authority would make referral to the civil authorities preferable to setting the command
        relationship without clarification.
    - id: flip2
      if: A competent authority established that the applicable legal framework required military forces to lead over the
        police in these circumstances.
      then: O2
      why: A controlling legal direction would alter the authority basis on which the account's support relationship rests.
    would_not_change:
    - id: noflip1
      if: The military's initial lack of understanding were offered, by itself, as a reason to put military forces in the
        lead.
      why: The account also says the colonial approach failed and credits later learning and police-military cooperation with
        improved understanding.
    watch_for:
    - id: watch1
      what: Whether police-military cooperation continues to support foresight and whether the police network continues to
        provide continuity of understanding.
      favors:
      - O1
      why: If these stated contributions weaken, the authorities should reassess the relationship and, if its proper form
        or authority is uncertain, refer the decision for direction rather than assume military lead.
  lesson: When an imported approach fails in a locally distinct situation, do not assume that military predominance is the
    remedy. Where the source credits improved understanding to adaptation, police cooperation, and continuity under a support
    relationship, preserve that relationship within its legal authority unless changed circumstances or a controlling direction
    justify reconsideration.
  limits: This reasoning concerns the command relationship described for Northern Ireland under military assistance to the
    civil power. It does not establish a general legal rule for other settings, identify the relevant decision-maker, or prescribe
    intelligence, deployment, or other operational techniques.
  library:
    domain: operational-command
    family: CORPUS-NX-e5f41fd4
    source: https://assets.publishing.service.gov.uk/media/5a80b2f340f0b62305b8ca55/doctrine_uk_understanding_jdp_04.pdf
    episode_focus: The passage contrasts an approach that did not work with later learning and police-military cooperation,
      which helped the forces better understand local dynamics and anticipate reactions. Treat this as a candidate about the
      command and legal relationship, not a decision about intelligence methods, deployments, or other operational techniques;
      the passage does not identify the particular decision-maker or date.
    cues:
