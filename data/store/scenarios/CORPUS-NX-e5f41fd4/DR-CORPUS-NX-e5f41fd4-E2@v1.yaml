case:
  id: DR-CORPUS-NX-e5f41fd4-E2@v1
  title: Polish Exiles and RAF Personnel Policy
  status: draft
  setting: Britain, during the Battle of Britain, the Royal Air Force (RAF)
  decider: The Royal Air Force (RAF)
  agent: The Royal Air Force (RAF)
  agent_role: decide
  situation: Polish airmen and airwomen arrived in Britain after fighting in Poland and France. They were determined to seek
    revenge. The RAF had initially kept the exiles from operational flying. Few spoke English, and the RAF had concerns about
    their morale. As the Battle of Britain wore on, the shortage of trained pilots became critical. Many of the exiles were
    excellent pilots and had more combat experience than most of their British comrades.
  question: What should the RAF do about permitting Polish exiles to fly operationally in RAF squadrons?
  options:
    O1:
      do: The RAF should permit Polish exiles to fly operationally in RAF squadrons.
      move: act
      irreversible: false
    O2:
      do: The RAF should prohibit Polish exiles from flying operationally in RAF squadrons.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Polish airmen and airwomen arrived in Britain after fighting in Poland and France.
  - id: F2
    kind: situation
    status: assessed
    fact: The Polish exiles arrived determined to seek revenge.
  - id: F3
    kind: situation
    status: confirmed
    fact: The RAF initially would not let the exiles fly operationally.
  - id: F4
    kind: situation
    status: confirmed
    fact: Few of the exiles spoke English.
  - id: F5
    kind: situation
    status: assessed
    fact: The RAF had concerns about the exiles' morale.
  - id: F6
    kind: situation
    status: assessed
    fact: As the Battle of Britain wore on, the shortage of trained pilots became critical.
  - id: F7
    kind: capability
    status: assessed
    fact: Many of the Polish exiles were excellent pilots.
  - id: F8
    kind: capability
    status: assessed
    fact: The exiles had more combat experience than most of their British comrades.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Few exiles spoke English, and the RAF initially kept them from operational flying; this was a stated reason for caution
      about permitting them to serve operationally.
  - id: C2
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The RAF also had concerns about the exiles' morale, a reason for its initial reluctance.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: As the shortage of trained pilots became critical, the exiles' assessed ability and greater combat experience supported
      accepting them into operational squadrons.
  reasoning:
    read: This is a personnel and command-policy decision under a worsening shortage of trained pilots. The initial language
      and morale concerns explain caution, but do not erase the exiles' assessed capability or the changing need for pilots.
    weighing: The language and morale concerns favor continued restriction, but the critical shortage, the exiles' excellent
      piloting, and their greater combat experience supported accepting them. The balance therefore favors {O1}; it depends
      especially on the worsening shortage and the assessments of their capability.
    tradecraft: Implement the permission as a command-level personnel decision, record the shortage and capability assessments
      supporting it, and keep any language or morale concerns visible for review. The account does not specify particular
      implementation controls.
    uncertainty: The account does not explain how the RAF addressed the language and morale concerns, or what individual selection
      or approval process it used.
    handoff: The RAF should decide through its command authority because the decision concerns access to operational service
      in its squadrons. The account identifies the RAF as decider but does not identify a more specific approving office.
    tempting_wrong:
      option: O2
      pull: The initial restriction may seem prudent because few exiles spoke English and the RAF had concerns about morale.
      why_wrong: That caution does not account for the critical shortage or the exiles' assessed piloting ability and greater
        combat experience, which supported the later acceptance.
    rejected:
      O2: The RAF did not maintain the prohibition as the shortage became critical and the exiles' capability and experience
        supported accepting them into squadrons.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The shortage of trained pilots were not critical.
      then: O2
      why: The urgent personnel need that supported accepting the exiles would be reduced.
    - id: flip2
      if: The exiles were not assessed as excellent pilots and more experienced than most of their British comrades.
      then: O2
      why: A key reason for accepting them would be absent.
    would_not_change:
    - id: noflip1
      if: Few exiles still spoke English, while the shortage remained critical and their capability assessments remained in
        place.
      why: The RAF accepted them despite the language concern, with the shortage and their capability supporting the decision.
    watch_for:
    - id: watch1
      what: Whether the shortage of trained pilots is worsening or remains critical.
      favors:
      - O1
      why: The critical shortage prompted acceptance.
  lesson: 'Reassess personnel restrictions when circumstances change: a concern that justified initial caution may be outweighed
    by urgent need and strong evidence of capability. Base the decision on the balance of current need and assessed ability,
    not on the initial restriction alone.'
  limits: This reasoning applies to the RAF's historical personnel decision during the Battle of Britain. It does not establish
    a general rule for language standards, morale assessments, or present-day military service decisions.
  library:
    domain: operational-command
    family: CORPUS-NX-e5f41fd4
    source: https://assets.publishing.service.gov.uk/media/5a80b2f340f0b62305b8ca55/doctrine_uk_understanding_jdp_04.pdf
    episode_focus: The vignette contrasts the earlier refusal, based on concerns about English-language ability and morale,
      with the later decision to accept the pilots as the shortage worsened. Keep the decision at the level of personnel and
      command policy; exclude operational flying tactics and combat results except as context.
