case:
  id: DR-CORPUS-NX-9c0c06be-E2@v1
  title: Decision Near a Hospital
  status: draft
  setting: Sadr City, May 6, Multi-National Division–Baghdad.
  decider: Multi-National Division–Baghdad
  agent: Multi-National Division–Baghdad
  agent_role: decide
  situation: Several JAM leaders were assessed to meet periodically in a trailer complex in Sadr City. The complex was next
    to a hospital. The leaders were assessed to have chosen the location expecting coalition forces to avoid an attack that
    could damage the hospital. The division faced a choice whether to proceed with a strike or refrain, and the anticipated
    collateral damage had been assessed as acceptable.
  question: What should Multi-National Division–Baghdad do about the planned strike against the leaders in Sadr City?
  options:
    O1:
      do: Multi-National Division–Baghdad declines the planned strike against the leaders.
      move: act
      irreversible: false
    O2:
      do: Multi-National Division–Baghdad authorizes the planned strike against the leaders.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Several JAM leaders periodically met in a trailer complex.
  - id: F2
    kind: situation
    status: confirmed
    fact: The trailer complex was next to a hospital inside Sadr City.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The leaders likely chose the location believing the coalition would not risk an attack that might damage the hospital.
  - id: F4
    kind: situation
    status: assessed
    fact: An attack at the location might damage the hospital.
  - id: F5
    kind: situation
    status: assessed
    fact: The division assessed that the attack could be executed with an acceptable level of collateral damage.
  - id: F6
    kind: situation
    status: confirmed
    fact: The division faced a choice about striking the leaders or refraining from an attack at the location.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The leaders were assessed to have chosen the location expecting concern about the hospital to deter an attack; allowing
      that concern alone to foreclose action could frustrate the decision to act against them.
  - id: C2
    facts:
    - F2
    - F4
    equity: protected_sites
    favors:
    - O1
    weight: strong
    why: The meeting place was next to a hospital, and an attack might damage it, creating a serious concern for a medical
      site and for people who depend on it.
  - id: C3
    facts:
    - F5
    equity: third_party_harm
    favors:
    - O2
    weight: strong
    why: The division assessed that the attack could be executed with an acceptable level of collateral damage, mitigating
      the harm concern enough for it to proceed.
  reasoning:
    read: This is a choice between acting against leaders who were assessed to be exploiting the hospital's proximity as a
      deterrent and avoiding the risk of damage to the hospital. The trap is treating proximity to a hospital as an automatic
      reason to refrain, even though the division assessed the anticipated collateral damage as acceptable.
    weighing: The hospital risk weighs against authorization {C2}, but the leaders' assessed expectation that the location
      would deter action and the division's acceptable-collateral-damage assessment weigh toward it {C1} {C3}. On those stated
      grounds, the balance favors authorizing the strike. That balance depends on the assessment that anticipated collateral
      damage is acceptable.
    tradecraft: Keep the decision tied to the stated assessment of anticipated harm and its acceptability; document the basis
      for that judgment and revisit it if relevant circumstances change. This is decision-level guidance, not a method for
      executing the strike.
    uncertainty: The available facts do not specify the expected extent of harm, the basis for the acceptability judgment,
      or a governing legal threshold. No further legal conclusion can be drawn from those facts.
    handoff: The division is identified as the decision-maker. The available facts do not identify a separate approval authority
      or require a referral, so no additional handoff can be grounded here.
    tempting_wrong:
      option: O1
      pull: Refraining avoids the risk of damage to a nearby hospital.
      why_wrong: 'Under the division''s stated reasoning, proximity alone should not decide the matter: the leaders were assessed
        to be relying on that concern to deter action, and anticipated collateral damage had been assessed as acceptable.'
    rejected:
      O1: The division did not refrain because it assessed the anticipated collateral damage as acceptable despite the hospital's
        proximity and the leaders' assessed expectation that the site would deter an attack.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reassessment found that the anticipated collateral damage was no longer acceptable.
      then: O1
      why: The division's stated basis for proceeding was that the attack could be executed with acceptable collateral damage;
        without that condition, the stated balance would no longer support authorization.
    would_not_change:
    - id: noflip1
      if: The leaders' assessed expectation that the hospital's proximity would deter an attack remained the only additional
        information.
      why: That expectation is already part of the stated situation and does not by itself displace the division's acceptable-collateral-damage
        assessment.
    watch_for:
    - id: watch1
      what: Updated information that changes the assessment of likely harm to the hospital or other civilians.
      favors:
      - O1
      why: A changed harm assessment could undermine the condition the division relied on in proceeding.
  lesson: Do not let an adversary's use of a sensitive location settle the decision by itself. Weigh the risk to civilians
    and protected sites against the mission reason to act, and make the decision turn on whether anticipated collateral damage
    remains acceptable.
  limits: The reasoning applies when leaders are assessed to be using a protected site's proximity to deter action and the
    anticipated collateral damage has been assessed as acceptable. It does not establish a general rule that proximity to
    a hospital permits an attack, or supply a legal threshold for acceptability.
