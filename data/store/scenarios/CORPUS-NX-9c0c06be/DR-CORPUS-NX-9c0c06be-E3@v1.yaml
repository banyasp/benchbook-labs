case:
  id: DR-CORPUS-NX-9c0c06be-E3@v1
  title: Authorizing Entry into Sadr City
  status: draft
  setting: Sadr City, May 19 or 20, 2008; the Iraqi prime ministerial authorization decision.
  decider: The Prime Minister
  agent: The Prime Minister
  agent_role: decide
  situation: The Gold Wall was complete, and Ishbiliyah and Habbibiyah were walled off as coalition forces had already built
    walls along the neighborhoods’ other sides. JAM had been severely degraded. Reestablishing security within Sadr City was
    the next phase. Iraqi security forces were considered ready to enter, but Iraqi military and coalition leaders were hesitant
    to send them in. The Iraqi forces had earlier been reluctant to advance and had not demonstrated an ability to fight without
    American support.
  question: What should the Prime Minister do about authorizing the Iraqi Army's entry operation into Sadr City?
  options:
    O1:
      do: The Prime Minister defers authorization of the Iraqi Army's entry operation.
      move: hold
      irreversible: false
    O2:
      do: The Prime Minister declines to authorize the Iraqi Army's entry operation.
      move: act
      irreversible: false
    O3:
      do: The Prime Minister authorizes the Iraqi Army's entry operation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Gold Wall was complete, and Ishbiliyah and Habbibiyah were walled off, with coalition-built walls along the
      neighborhoods’ other sides.
  - id: F2
    kind: intelligence
    status: assessed
    fact: JAM was severely degraded.
  - id: F3
    kind: situation
    status: confirmed
    fact: Reestablishing security within Sadr City was the next phase.
  - id: F4
    kind: capability
    status: assessed
    fact: Iraqi security forces were considered ready to enter Sadr City.
  - id: F5
    kind: situation
    status: confirmed
    fact: Iraqi military and coalition leaders were hesitant to send Iraqi security forces into the city.
  - id: F6
    kind: capability
    status: assessed
    fact: Iraqi forces had been reluctant to advance earlier in the battle.
  - id: F7
    kind: capability
    status: assessed
    fact: Iraqi forces had not demonstrated an ability to fight without American support.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The completed walls and severe degradation of JAM were favorable conditions for moving to the next security phase.
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Reestablishing security in Sadr City was the next phase, giving a mission-related reason to proceed rather than defer.
  - id: C3
    facts:
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Iraqi security forces were considered ready to enter, supporting authorization.
  - id: C4
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Leaders’ hesitation was supported by Iraqi forces’ earlier reluctance to advance and their lack of demonstrated ability
      to fight without American support.
  reasoning:
    read: The decision came after the walls were complete and JAM had been severely degraded, with reestablishing security
      next. The trap is to treat the forces’ assessed readiness as proof that earlier concerns about their performance and
      reliance on American support no longer mattered—or, conversely, to treat those concerns as conclusive despite the changed
      conditions.
    weighing: The favorable conditions and the assessment that Iraqi forces were ready supported proceeding; the leaders’
      hesitation and the forces’ earlier limitations weighed toward delay. The Prime Minister ordered the operation to proceed
      despite that caution, giving greater weight to proceeding with the next security phase. The record does not specify
      a detailed rationale beyond this decision and context.
    tradecraft: As a decision practice, record the readiness assessment, the earlier performance concerns, and why the changed
      circumstances do or do not answer them. Consult the hesitant Iraqi military and coalition leaders, document the Prime
      Minister’s authorization and its basis, and reassess if the readiness picture materially changes.
    uncertainty: The account does not explain the basis or detail of the readiness assessment, define the American support
      the Iraqi forces required, or give a fuller account of the Prime Minister’s reasoning. It also provides no legal authority
      analysis or assessment of effects on civilians.
    handoff: The Prime Minister held the decision. The Iraqi military and coalition leaders should be involved because they
      were hesitant to send the forces in and had relevant readiness concerns, but their caution did not displace the Prime
      Minister’s decision.
    tempting_wrong:
      option: O1
      pull: Deferring would respond to the leaders’ hesitation and the forces’ earlier reluctance and dependence on American
        support.
      why_wrong: On this record, deferral would give those concerns controlling weight despite the completed walls, JAM’s
        degraded condition, and the assessment that the forces were ready.
    rejected:
      O1: The Prime Minister proceeded despite the readiness concerns rather than deferring authorization.
      O2: The Prime Minister ordered the operation to proceed, rather than declining authorization.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Iraqi security forces were no longer considered ready to enter.
      then: O1
      why: A contrary readiness assessment would remove a key condition supporting proceeding and strengthen the case for
        deferral.
    - id: flip2
      if: The walls were incomplete or JAM was not severely degraded.
      then: O1
      why: The favorable conditions accompanying the decision would be absent, making delay more supportable while readiness
        and security conditions were reassessed.
    would_not_change:
    - id: noflip1
      if: Leaders remained hesitant for the same reasons on the same record.
      why: Their hesitation and the forces’ earlier limitations were already present when the Prime Minister ordered the operation
        to proceed.
    watch_for:
    - id: watch1
      what: A material change in the assessment of Iraqi forces’ readiness to enter.
      favors:
      - O1
      why: Readiness was a stated favorable condition; a significant deterioration would support reassessing or deferring
        authorization.
  lesson: When changed circumstances support a mission, earlier capability concerns should be weighed rather than automatically
    treated as decisive. Authorization should still rest on an honest readiness assessment, with a clear basis for proceeding
    despite informed caution.
  limits: This reasoning applies to the authorization decision on the facts given; it does not establish that entry was legally
    required or that the operation was risk-free. The account does not provide a detailed legal, civilian-impact, or operational
    assessment.
