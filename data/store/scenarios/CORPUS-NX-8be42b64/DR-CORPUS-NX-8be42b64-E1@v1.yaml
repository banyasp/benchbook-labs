case:
  id: DR-CORPUS-NX-8be42b64-E1@v1
  title: Authorizing the Redland Campaign
  status: draft
  setting: The United States, at the White House, considering a proposed campaign in Redland.
  decider: The President of the United States
  agent: The President of the United States
  agent_role: decide
  situation: The National Command Authority has directed USSOCOM and other government agencies to conduct a campaign in support
    of a resistance movement opposing Redland’s government. Congress has authorized and appropriated funding for the campaign,
    and a presidential covert-action finding relates to it. Redland faces growing instability, and the Orangeland government
    has reconsidered its longstanding policies of neutrality and noninterference. The proposed campaign carries risks of capture
    and exposure for U.S. personnel, while its support and sustainment would be highly challenging. U.S. officials see a prospect
    that a stronger insurgency could topple Redland’s government, and that a friendly successor government could advance U.S.
    interests.
  question: What should the President do about authorizing the proposed U.S. campaign in Redland?
  options:
    O1:
      do: The President declines to authorize the proposed U.S. campaign in Redland.
      move: act
      irreversible: false
    O2:
      do: The President authorizes the proposed U.S. campaign in Redland.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The National Command Authority directed USSOCOM and other government agencies to conduct a campaign supporting a
      resistance movement opposing Redland’s government.
  - id: F2
    kind: authority
    status: confirmed
    fact: A presidential covert-action finding related to the campaign, and Congress authorized and appropriated DOD and intelligence
      service funding for it.
  - id: F3
    kind: situation
    status: assessed
    fact: The President viewed the growing menace and instability inside Redland as prompting Orangeland to reconsider its
      policies of neutrality and noninterference.
  - id: F4
    kind: capability
    status: assessed
    fact: The USSOCOM commander assessed that the campaign risked capture and exposure of U.S. military and intelligence personnel
      and would be highly challenging to support and sustain.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Orangeland government agreed to provide covert and nonvisible support for the proposed campaign.
  - id: F6
    kind: intelligence
    status: assessed
    fact: U.S. officials assessed that a much larger and more effective insurgency could have a reasonably strong prospect
      of toppling Redland’s increasingly unpopular government.
  - id: F7
    kind: intelligence
    status: assessed
    fact: U.S. officials assessed that a friendly government in Redland would presumably curtail Blackland’s expanding influence
      in the country and nearby region.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Officials saw a reasonably strong prospect that a more effective insurgency could topple an increasingly unpopular
      government, and expected a friendly successor to curtail Blackland’s expanding influence.
  - id: C2
    facts:
    - F3
    - F5
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: Redland’s growing instability had prompted Orangeland to reconsider its noninterference policy, and Orangeland agreed
      to support the campaign; this created an important policy opening for the proposed effort.
  - id: C3
    facts:
    - F4
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The commander warned that U.S. military and intelligence personnel risked capture and exposure, and that support
      and sustainment would be highly challenging.
  - id: C4
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The National Command Authority directed the campaign, a presidential covert-action finding related to it, and Congress
      authorized and appropriated funding; these establish an authority basis considered in the decision, but do not by themselves
      settle every legal question.
  reasoning:
    read: The President faced a policy choice about whether to proceed despite acknowledged risks to U.S. personnel and serious
      sustainment challenges. The trap is to treat those risks as either automatically disqualifying or as overcome merely
      because authorities and funding existed; the President instead judged the proposed campaign against alternatives considered
      worse.
    weighing: The President reluctantly authorized the campaign after weighing the personnel and sustainment risks against
      the prospect of toppling an increasingly unpopular and malignant government, reducing support for international terrorism
      and proliferation, and curtailing Blackland’s influence. Orangeland’s willingness to support the effort reinforced the
      opportunity. The balance favored {O2}, while depending on the assessed prospects of a stronger insurgency and a friendly
      successor government; the risks remained real rather than resolved.
    tradecraft: Record the decision as a presidential policy judgment, including the identified benefits, personnel risks,
      sustainment challenge, and the conclusion that alternatives were worse. Keep the authority basis distinct from a conclusion
      that every legal issue has been resolved, and do not confuse approval of the campaign with approval of any particular
      operational method.
    uncertainty: The outcome depended on assessments about the insurgency’s potential, the chance of toppling the government,
      and the likely effect of a friendly successor. The record acknowledges substantial risks but does not quantify them
      or establish that the expected political outcomes were certain; it also does not provide a full legal analysis of the
      finding and congressional authorization.
    handoff: The President made the decision after receiving a briefing from the USSOCOM commander in the White House Situation
      Room with the national security team. That preserves presidential responsibility while bringing the stated operational
      risk and policy assessments into the decision.
    tempting_wrong:
      option: O1
      pull: Decline because U.S. personnel could be captured or exposed and support and sustainment would be highly challenging.
      why_wrong: Those were acknowledged costs, but the President concluded that the alternatives were worse in light of the
        expected strategic benefits and the opportunity presented by Orangeland’s support.
    rejected:
      O1: The President did not choose to decline because the assessed strategic benefits and the prospect of reducing Redland’s
        malign influence outweighed the acknowledged risks and difficulties.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessed prospect that a stronger insurgency could topple the government, or that a friendly successor would
        curtail Blackland’s influence, were no longer reasonably strong.
      then: O1
      why: The main strategic benefits that outweighed the acknowledged personnel and sustainment risks would be substantially
        diminished.
    - id: flip2
      if: The risk of capture or exposure to U.S. personnel, or the difficulty of support and sustainment, materially worsened
        beyond the risks the President considered.
      then: O1
      why: A material increase in the acknowledged costs could change the balance that led the President to conclude the alternatives
        were worse.
    would_not_change:
    - id: noflip1
      if: The campaign remained difficult to support and sustain, but no more difficult than the commander had assessed.
      why: That challenge was already acknowledged when the President chose to authorize the campaign.
    watch_for:
    - id: watch1
      what: Whether the assessed prospect of a stronger insurgency and a friendly successor government remains credible.
      favors:
      - O1
      why: If that expected strategic benefit weakens, the acknowledged personnel and sustainment risks weigh more heavily.
  lesson: A difficult and risky campaign can still be authorized when the decision-maker judges the alternatives worse and
    the expected strategic benefits substantial. A finding, directive, and funding provide an authority context, but should
    not be mistaken for proof that the policy judgment is sound or that every legal question is settled.
  limits: This reasoning applies to the President’s policy decision on this proposed campaign and the assessments described
    here. It does not establish that the campaign was lawful in every respect, that its expected outcomes would occur, or
    that any particular operational method should be used.
