case:
  id: DR-CORPUS-NX-d746f7ab-E1@v1
  title: Bounded R&D Reprogramming Authority
  status: draft
  setting: United States Congress, considering the Commission’s proposed IC R&D governance framework ahead of the FY16 budget
    build.
  decider: The United States Congress
  agent: The United States Congress
  agent_role: decide
  situation: The IC has spent a decade emphasizing near-term R&D for immediate military needs over strategic endeavors. Strategic
    R&D goals are not jointly established or adopted, and the IC has difficulty accounting for existing and planned R&D projects
    and budgets. Some R&D funding is incorporated into mission-related efforts, complicating expenditure tracking. The Commission
    proposes allowing the DNI to reprogram R&D project funds annually up to a level agreed to by Congress, without prior approval
    for individual changes. Congress must choose whether to grant that bounded authority or retain prior approval for individual
    changes; the authority is a recommendation, not an enacted policy.
  question: What should the United States Congress do about the proposed bounded authority for the DNI to reprogram IC R&D
    project funds?
  options:
    O1:
      do: Congress authorizes the DNI to reprogram annual R&D project funds up to a congressionally agreed limit without prior
        approval for individual changes.
      move: act
      irreversible: false
    O2:
      do: Congress declines the proposed authority and requires prior congressional approval for each annual R&D project fund
        reprogramming change.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: For a decade, the IC has supported near-term R&D for immediate military necessities and incremental improvements
      rather than strategic endeavors.
  - id: F2
    kind: situation
    status: confirmed
    fact: Strategic R&D goals for the IC enterprise are not jointly established or adopted.
  - id: F3
    kind: capability
    status: assessed
    fact: With few exceptions, IC R&D does not adapt rapidly to a changing technology environment.
  - id: F4
    kind: situation
    status: confirmed
    fact: IC agencies had difficulty providing a financial accounting of existing and planned R&D projects and budgets.
  - id: F5
    kind: situation
    status: confirmed
    fact: Some R&D funding is incorporated into mission-related efforts when the IC tracks expenditures.
  - id: F6
    kind: situation
    status: assessed
    fact: The roles and authorities of the NISTC and ODNI DS&T are not clearly defined in legislation, and coordination and
      priority-setting for IC R&D have developed slowly.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Commission recommends empowering the DNI to reprogram R&D project funds annually, up to a level agreed to by
      Congress, without prior notification to Congress for approval.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Commission lists congressional approval of below-threshold reprogramming authority as an expected first-year
      accomplishment.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F7
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The IC has favored near-term needs and, with few exceptions, does not adapt rapidly to changing technology. The Commission
      recommends annual reprogramming authority to enable more agile investment in emerging, disruptive, and joint technology
      projects.
  - id: C2
    facts:
    - F2
    - F4
    - F5
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: Strategic goals are not jointly established, and incomplete accounting—including R&D funding embedded in mission
      efforts—makes enterprise-wide allocation difficult. The Commission's proposed authority is part of a strategy to improve
      coordinated investment, though reprogramming authority alone would not correct tracking.
  - id: C3
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The proposed delegation is limited to a level agreed to by Congress, and congressional approval of below-threshold
      authority is an expected first-year accomplishment. The Commission endorses bounded flexibility, not unrestricted DNI
      control.
  reasoning:
    read: 'The choice is whether to let the DNI make annual R&D reallocations within a limit Congress agrees to, or require
      approval for each change. The trap is treating these as unlimited executive discretion versus complete congressional
      control: the proposal preserves a congressional-set boundary while removing prior approval for individual changes.'
    weighing: 'The Commission''s central reasons favor O1: years of near-term emphasis, limited adaptability, and fragmented
      strategic planning support more agile investment. Poor accounting is a real constraint, not a reason the proposed authority
      itself solves; the balance therefore depends on keeping the authority bounded and improving the IC-wide view of R&D,
      including tracking and performance measures.'
    tradecraft: Congress should specify the agreed limit and make the delegation legible in the budget process. In carrying
      it out, the DNI and DS&T should pair reprogramming with improved enterprise-wide project and budget tracking, a unified
      R&D plan, and performance metrics, then report results against those aims.
    uncertainty: The source identifies governance and accounting problems but does not quantify how much faster reprogramming
      would make investment or specify the appropriate congressional limit. The recommendation is therefore a judgment about
      the value of agility within a negotiated boundary, not a finding that delegation alone will resolve fragmentation.
    handoff: Congress should decide the authority and its limit. It should obtain the DNI and DS&T's proposed account of R&D
      commitments and strategic priorities so the boundary and subsequent review reflect the enterprise-wide picture the Commission
      says is needed.
    tempting_wrong:
      option: O2
      pull: Requiring prior approval for every change may seem the safest response to the IC's accounting difficulties.
      why_wrong: The Commission's stated response is to improve comprehensive R&D visibility while enabling more agile investment
        through authority bounded by a level Congress agrees to, rather than preserving prior approval for each change.
    rejected:
      O2: The Commission favors bounded reprogramming authority because prior approval for individual changes would not provide
        the agility it seeks for strategic and emerging R&D investment.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Congress cannot establish an agreed limit that makes the delegation bounded in practice.
      then: O2
      why: Without a congressional boundary, the proposal would no longer be the bounded authority the Commission recommends.
    - id: flip2
      if: The IC cannot produce a sufficiently comprehensive account of R&D projects and budgets to support responsible reallocation.
      then: O2
      why: Weak accounting already impedes enterprise-wide allocation; if it remains unusable for oversight and decision-making,
        the case for delegated reprogramming is weaker.
    would_not_change:
    - id: noflip1
      if: Some R&D funding continues to be incorporated into mission-related efforts during the transition.
      why: That is part of the identified tracking problem and, by itself, does not displace the Commission's recommendation
        for bounded agility; it does make improved accounting important.
    watch_for:
    - id: watch1
      what: Whether the IC develops improved R&D tracking, a unified plan aligned with national security objectives, performance
        metrics, and congressional approval of below-threshold authority in the first year.
      favors:
      - O1
      why: These are the Commission's stated first-year expectations and would provide evidence that the proposed framework
        is being put in place.
  lesson: When slow, fragmented investment impedes strategic goals, bounded reprogramming authority can be preferable to prior
    approval for every change. Preserve the legislature's agreed limit and pair flexibility with reliable accounting and measures
    of performance.
  limits: This reasoning concerns the Commission's proposed IC R&D budget authority ahead of the FY16 budget build. It does
    not establish that similar delegation is appropriate without a congressional-set limit, adequate visibility, or the specific
    need for more agile R&D investment.
