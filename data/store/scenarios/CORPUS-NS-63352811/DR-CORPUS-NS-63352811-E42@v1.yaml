case:
  id: DR-CORPUS-NS-63352811-E42@v1
  title: Response to an Attack on Coalition Partners
  status: draft
  setting: Syrian airspace, coalition air operations against ISIS.
  decider: The Navy pilot
  agent: The Navy pilot
  agent_role: decide
  situation: Coalition partners were operating on the ground. An approaching aircraft was identified as Syrian. Warnings to
    the aircraft were ignored. The aircraft then dove toward the coalition partners and released munitions. The release crossed
    the hostile-act threshold under the applicable rules of engagement, and prior command guidance empowered airmen to respond
    immediately.
  question: What should the Navy pilot do after the Syrian aircraft ignores warnings and attacks coalition partner forces?
  options:
    O1:
      do: The pilot engages the Syrian aircraft.
      move: act
      irreversible: true
    O2:
      do: The pilot disengages from the Syrian aircraft.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Coalition partner forces were on the ground below.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: An approaching aircraft was identified as Syrian.
  - id: F3
    kind: situation
    status: confirmed
    fact: Warnings were issued to the Syrian aircraft, which ignored them.
  - id: F4
    kind: situation
    status: confirmed
    fact: The aircraft dove toward coalition partners and released munitions.
  - id: F5
    kind: authority
    status: confirmed
    fact: The release crossed the hostile-act threshold under the rules of engagement.
  - id: F6
    kind: authority
    status: confirmed
    fact: Prior commander guidance, also captured in the special instructions accompanying the air tasking order, empowered
      airmen to respond immediately to a hostile act.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The aircraft released munitions toward coalition partners, and that release crossed the hostile-act threshold under
      the rules of engagement, satisfying the stated basis for an immediate response.
  - id: C2
    facts:
    - F6
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Prior commander guidance empowered airmen to respond immediately to a hostile act, supporting action without waiting
      for further approval.
  - id: C3
    facts:
    - F1
    - F4
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The attack was directed toward coalition partner forces on the ground, making their protection a central reason to
      respond.
  reasoning:
    read: 'This is no longer just an approaching aircraft that might be warned away: the warnings were ignored and the aircraft
      released munitions toward coalition partners. The trap is either to treat the earlier warnings as sufficient after the
      hostile act, or to treat Syrian identity alone as the basis for force; the stated basis is the hostile act and the authority
      to respond.'
    weighing: The hostile-act threshold was crossed {C1}, prior command guidance empowered an immediate response {C2}, and
      coalition partners were under attack {C3}. Together these reasons support engagement over disengagement. The balance
      depends on the stated finding that the release crossed the applicable threshold and that the prior guidance remained
      in force.
    tradecraft: At the decision point, verify that the conduct meets the hostile-act threshold and that the delegated authority
      applies; once those conditions are established, act under that authority and preserve a concise record of the basis
      for the decision.
    uncertainty: The account presents the aircraft's identity, ignored warnings, release of munitions, and hostile-act determination
      as established. It identifies no unresolved uncertainty bearing on the decision.
    handoff: The Navy pilot was empowered to respond immediately under the prior commander guidance, so the stated basis does
      not require waiting for additional approval. Coordination with the ground partner's representative had helped assess
      the threat, but the source does not make further consultation a condition of action.
    tempting_wrong:
      option: O2
      pull: Disengaging may seem preferable because the aircraft was Syrian and using force could carry escalation risks.
      why_wrong: 'The stated decision point was no longer a warning or uncertain approach: the aircraft had committed a hostile
        act against coalition partners, and prior guidance empowered an immediate response.'
    rejected:
      O2: Disengagement was not chosen because the aircraft's release crossed the hostile-act threshold and the pilot had
        authority to respond immediately.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The release were not found to cross the hostile-act threshold under the applicable rules of engagement.
      then: O2
      why: The stated basis for immediate engagement depends on the hostile-act threshold having been crossed.
    - id: flip2
      if: The prior guidance did not authorize an immediate response in these circumstances.
      then: O2
      why: The source relies on that guidance as authority for the pilot to respond immediately.
    would_not_change:
    - id: noflip1
      if: The aircraft were Syrian but had not committed a hostile act.
      why: Nationality alone is not the source's stated basis for engagement; its reasoning turns on the hostile act and the
        applicable authority.
    watch_for: []
  lesson: When an attack crosses the hostile-act threshold under the rules of engagement, apply the authority actually delegated
    for that situation. Where prior guidance empowers immediate action and partners are under attack, do not treat warnings
    or delay as a substitute for responding to the hostile act.
  limits: This reasoning applies to the stated finding that the aircraft released munitions toward coalition partners and
    that the release crossed the hostile-act threshold. It does not establish that engagement is authorized merely because
    an aircraft is Syrian or ignores warnings.
