case:
  id: DR-CORPUS-NS-63352811-E1@v1
  title: Al-Tanf Self-Defense Decision
  status: draft
  setting: Al-Tanf garrison, Syria, during Operation Inherent Resolve in June 2017; U.S. military and Combined Air Operations
    Center.
  decider: The pilot
  agent: The pilot
  agent_role: decide
  situation: At al-Tanf, a UAS was orbiting above Syrian forces and U.S. advisers, and was believed likely to be operated
    by pro-Syrian regime forces. U.S. special operations forces reported that a missile had been fired at them but failed
    to detonate. The pilot was operating under self-defense rules of engagement that permitted force to protect U.S. and partner
    ground forces in response to demonstrated hostile intent or a hostile act. The CAOC reported that nonkinetic measures
    were being used, and their initial effect was temporary. The UAS turned back toward the forces and made an aggressive
    turn toward the outpost; Russian aircraft nearby heightened the pilot’s concern about unintended escalation, while the
    CAOC had directed the pilot to use force if the UAS turned hostile.
  question: What should the pilot do when the UAS’s behavior is assessed as hostile intent?
  options:
    O1:
      do: The pilot engages the UAS under self-defense rules of engagement.
      move: act
      irreversible: true
    O2:
      do: The pilot avoids engaging the UAS under self-defense rules of engagement.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A UAS was orbiting above Syrian forces and their U.S. advisers and was believed likely to be operated by pro-Syrian
      regime forces.
  - id: F2
    kind: intelligence
    status: assessed
    fact: U.S. special operations forces reported that a missile had been fired at them but failed to detonate.
  - id: F3
    kind: authority
    status: confirmed
    fact: The pilot’s self-defense rules of engagement permitted force to defend the pilot and U.S. and partner ground forces
      upon demonstrated hostile intent or a hostile act.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The pilot assessed that the circumstances provided proof of hostile intent.
  - id: F5
    kind: situation
    status: confirmed
    fact: The CAOC told the pilot that nonkinetic effects were being employed against the UAS.
  - id: F6
    kind: situation
    status: confirmed
    fact: The nonkinetic effects initially worked, but the UAS later turned back toward U.S. and partner ground forces.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The pilot assessed the UAS’s return toward the forces as hostile intent.
  - id: F8
    kind: situation
    status: assessed
    fact: Russian aircraft were nearby, and the pilot was concerned that they might mistake an engagement for an attack on
      them, risking unintended escalation.
  - id: F9
    kind: authority
    status: confirmed
    fact: The CAOC directed the pilot to use force if the UAS turned hostile.
  - id: F10
    kind: situation
    status: confirmed
    fact: The UAS made an aggressive turn toward the al-Tanf outpost.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The self-defense ROE permitted force on demonstrated hostile intent, the pilot assessed that hostile intent was established,
      and the CAOC directed force if the UAS turned hostile.
  - id: C2
    facts:
    - F2
    - F6
    - F7
    - F10
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: A missile had been fired at U.S. forces; after nonkinetic effects initially worked, the UAS returned toward the forces
      and made an aggressive turn toward the outpost. The pilot assessed this behavior as hostile intent.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'Nonkinetic measures initially affected the UAS, but their effect did not hold: it turned back toward U.S. and partner
      forces. Temporary effectiveness did not resolve the threat.'
  - id: C4
    facts:
    - F8
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The pilot had reason to avoid an engagement that Russian aircraft might mistake as directed at them. This supported
      caution and delay, but did not remove the assessed threat to the outpost.
  reasoning:
    read: The decision was whether to rely on nonkinetic measures or act under self-defense ROE after the pilot assessed hostile
      intent. The trap is treating the initial effect of nonkinetic measures as proof that the threat was over, or treating
      the nearby Russian aircraft as a reason to disregard the renewed threat.
    weighing: The reported missile launch, the UAS's return toward the forces, and its aggressive turn supported the pilot's
      hostile-intent assessment {C2}. The ROE permitted force on that basis, and the CAOC had directed force if the UAS turned
      hostile {C1}. The initial nonkinetic effect did not last {C3}. Russian aircraft created a genuine escalation concern,
      so the pilot delayed engagement until the risk to them had passed; that concern warranted restraint, not indefinite
      deferral once the threat persisted {C4}.
    tradecraft: Reassess whether the threat remains hostile after nonkinetic measures, distinguish temporary disruption from
      resolution, and communicate with the CAOC about the threat assessment and escalation concern. State the applicable ROE
      basis and preserve the decision rationale in the operational record.
    uncertainty: The UAS's operator was assessed as likely to be pro-regime forces, and hostile intent was the pilot's assessment
      of its behavior. The account establishes a failed missile launch and a later return toward the forces, but does not
      establish the operator's intent independently.
    handoff: The pilot made the immediate self-defense decision while coordinating with the CAOC, which provided guidance
      and information about nonkinetic measures. The Russian-aircraft escalation concern also warranted coordination, but
      the account leaves the engagement decision with the pilot under the ROE.
    tempting_wrong:
      option: O2
      pull: Avoiding engagement could reduce the risk of an unintended confrontation with Russian aircraft and allow nonkinetic
        measures more time.
      why_wrong: The nonkinetic effect was temporary, the UAS returned toward the forces, and the pilot assessed its behavior
        as hostile; continued deferral would leave the ground forces exposed despite the ROE authority and CAOC guidance.
    rejected:
      O2: The pilot did not continue to avoid engagement because the UAS returned toward the forces and made an aggressive
        turn after nonkinetic measures had only worked temporarily.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Nonkinetic measures continued to contain the UAS and it did not return toward the forces or make an aggressive approach.
      then: O2
      why: Without a continuing hostile approach, the immediate self-defense basis for engagement would be weaker and continued
        deferral would avoid unnecessary escalation.
    would_not_change:
    - id: noflip1
      if: Russian aircraft were nearby but the pilot could delay engagement until they were no longer at risk from it.
      why: The pilot's concern led to delay until the risk to the Russian aircraft had passed, rather than abandonment of
        the self-defense response.
    watch_for:
    - id: watch1
      what: Whether the UAS returns toward U.S. and partner forces after nonkinetic measures initially affect it.
      favors:
      - O1
      why: A renewed approach indicates that the initial nonkinetic effect did not resolve the threat.
  lesson: When self-defense ROE permits force on assessed hostile intent, a temporary effect from nonkinetic measures should
    not be mistaken for resolution if the threat returns. Escalation risks warrant restraint and coordination, but should
    be weighed against the continuing danger to protected forces.
  limits: This reasoning concerns the stated self-defense ROE, the pilot's assessment of hostile intent, and the particular
    risk from nearby Russian aircraft. It does not establish a general rule that every approach by an unmanned aircraft warrants
    force or that force is required whenever ROE permits it.
