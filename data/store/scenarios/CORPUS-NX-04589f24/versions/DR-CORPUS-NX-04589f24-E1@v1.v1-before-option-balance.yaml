case:
  id: DR-CORPUS-NX-04589f24-E1@v1
  title: Authorizing a Strike on a Suspected Nuclear Program
  status: draft
  setting: United States national security team, presidential second term, deliberation on a proposed strike in Syria
  decider: The President
  agent: The President
  agent_role: decide
  situation: A proposed U.S. strike concerned a nuclear power reactor in Syria. The President was deciding whether to authorize
    it. Intelligence officers assessed with high confidence that the facility was a nuclear reactor, but with low confidence
    that it was part of a weapons program. The intelligence director said that, despite the lack of evidence, it was hard
    to imagine the plant serving another purpose.
  question: What should the President do about authorizing the proposed strike on the Syrian reactor facility?
  options:
    O1:
      do: The President denies authorization for the proposed strike on the Syrian reactor facility.
      move: act
      irreversible: false
    O2:
      do: The President authorizes the proposed strike on the Syrian reactor facility.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A U.S. strike on a nuclear power reactor in Syria was proposed.
  - id: F2
    kind: authority
    status: confirmed
    fact: The President was the official deciding whether to authorize the strike.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Intelligence officers assessed with high confidence that the facility was a nuclear reactor.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Intelligence officers assessed with low confidence that the facility was part of a weapons program.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: There was a lack of evidence that the facility was part of a weapons program.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The intelligence director said it was hard to imagine the plant was for anything other than a weapons program.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The assessment distinguished high confidence that the facility was a reactor from low confidence that it was part
      of a weapons program; the first judgment did not establish the second.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The President declined authorization because evidence that the facility was part of a weapons program was lacking.
  - id: C3
    facts:
    - F6
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: The intelligence director believed it was hard to imagine the plant serving another purpose, but that judgment was
      an inference despite the lack of evidence.
  reasoning:
    read: The facility was assessed with high confidence to be a reactor, but its connection to a weapons program remained
      uncertain. The trap is treating the director's difficulty imagining another purpose as if it resolved the low-confidence
      assessment or supplied the missing evidence.
    weighing: The reactor assessment and the director's intuition supported concern, but neither established a weapons program.
      The President gave greater weight to the low confidence and lack of evidence, and declined the strike {C1} {C2} despite
      the contrary intuition {C3}. The balance could change if the evidence about a weapons-program connection materially
      changed.
    tradecraft: Keep the assessment of what the facility is separate from the assessment of its purpose; record the confidence
      level and the evidentiary gap, as well as the contrary judgment, so the basis for the authorization decision is clear.
    uncertainty: The weapons-program assessment was low confidence, and the record described a lack of evidence; the intelligence
      director's belief did not remove that uncertainty.
    handoff: The President was the deciding official. The intelligence director's judgment was relevant input, but the President
      retained the decision rather than treating that judgment as a substitute for the assessed evidence.
    tempting_wrong:
      option: O2
      pull: The facility was confidently identified as a reactor, and the intelligence director found it hard to imagine another
        purpose.
      why_wrong: That inference did not overcome the low-confidence assessment and lack of evidence that the facility was
        part of a weapons program.
    rejected:
      O2: The President did not authorize the strike because the evidence that the reactor was part of a weapons program was
        insufficient.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: New evidence materially establishes that the facility is part of a weapons program.
      then: O2
      why: The stated reason for declining authorization was the insufficiency of evidence for that connection; materially
        stronger evidence could change the balance.
    would_not_change:
    - id: noflip1
      if: Confidence that the facility is a reactor remains high, but evidence of a weapons-program connection remains lacking.
      why: Identifying the facility as a reactor alone does not resolve the separate uncertainty about its purpose.
    watch_for:
    - id: watch1
      what: Whether updated intelligence changes the confidence assessment or supplies evidence about a weapons-program connection.
      favors:
      - O1
      why: If the low-confidence assessment and evidentiary gap remain, the stated basis for withholding authorization remains.
  lesson: Do not collapse confidence about what a facility is into confidence about its purpose. When the decision turns on
    the latter, an intuitive belief about likely purpose does not by itself fill an acknowledged evidentiary gap.
  limits: This reasoning addresses a decision made on the stated intelligence record; it does not determine what to do if
    materially different evidence emerges. It does not establish a general legal rule governing strikes.
  library:
    domain: military-operational
    family: CORPUS-NX-04589f24
    source: https://www.cia.gov/resources/csi/static/a4a94242fe5861d4aeeec438557e9ed8/Days-of-Fire.pdf
    episode_focus: The decision point is whether to authorize the proposed strike or refrain, given high confidence the facility
      was a reactor but low confidence it was part of a weapons program. The President chose not to authorize the strike because
      the evidence for a weapons program was insufficient, despite the intelligence director’s stated belief that the facility
      was unlikely to be for another purpose; exclude operational details of any raid.
    cues:
      option_words:
        O1: 13
        O2: 11
      real_option: O1
      real_to_mean_other_length: 1.18
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The President declined to authorize the strike because the assessment of a weapons-program connection was low confidence
  and the evidence was insufficient.
