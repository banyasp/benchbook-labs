case:
  id: DR-CORPUS-NX-026edc60-E6@v1
  title: Assessing al-Shabaab’s Strategic Focus
  status: draft
  setting: Somalia and the region, after the Westgate attack; JSOU Report 14-1 analysis.
  decider: The analysts
  agent: The analysts
  agent_role: decide
  situation: Al-Shabaab’s leader firmly controls the group and is described as interested in global jihad. The group has carried
    out attacks in Kenya and Uganda, and indirectly in Ethiopia, while those countries have forces in Somalia. Its outreach
    to Somali-Americans calls them to Somalia, and its rhetoric and recruitment propaganda have not noticeably changed. The
    group’s diaspora support is assessed to have declined as its brutality became widely known, while its capacity to adapt
    and possible interest in a broader focus remain concerns. A change in how AMISOM is perceived, or calls to diaspora Somalis
    and other Muslims to wage jihad in the West, could affect the assessment of the group’s focus.
  question: What should the analysts do in assessing whether al-Shabaab has shifted its primary focus toward attacks on Western
    countries?
  options:
    O1:
      do: The analysts affirm that al-Shabaab has shifted its primary focus toward attacks on Western countries.
      move: act
      irreversible: false
    O2:
      do: The analysts reject that al-Shabaab has shifted its primary focus toward attacks on Western countries.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The group’s leader firmly controls al-Shabaab and is interested in global jihad.
  - id: F2
    kind: situation
    status: confirmed
    fact: Al-Shabaab has attacked Kenya and Uganda, and indirectly Ethiopia; the three countries have forces inside Somalia.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Al-Shabaab’s outreach to Somali-Americans calls them to Somalia to wage jihad rather than to remain in place to
      attack the United States.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Al-Shabaab has not noticeably altered its rhetoric or recruitment propaganda.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Al-Shabaab is assessed to have lost much of the support it previously had among diaspora communities as its brutality
      became common knowledge.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The group’s potential to inspire unaffiliated individual attacks is considered its largest danger, but it has not
      put much effort into encouraging such attacks.
  - id: F7
    kind: capability
    status: assessed
    fact: Al-Shabaab is assessed as resilient and adaptable, with a potential interest in reorienting toward Western countries.
  - id: F8
    kind: intelligence
    status: assessed
    fact: If AMISOM comes to be seen as an occupying force, al-Shabaab’s foreign recruitment networks could partly revive
      and give the group more options regarding attacks in the West.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Calls by al-Shabaab leaders for diaspora Somalis and other Muslims to wage jihad in the West would be a cause for
      concern and could signal a shift in the group’s focus.
  considerations:
  - id: C1
    facts:
    - F2
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The attacks in Kenya and Uganda, and indirectly in Ethiopia, are understood in the context of those countries’ forces
      in Somalia; the regional pattern does not establish a primary shift toward attacks on Western countries.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The group’s rhetoric and recruitment propaganda have not noticeably changed, and its outreach to Somali-Americans
      calls them to fight in Somalia rather than to attack the United States from there.
  - id: C3
    facts:
    - F1
    - F7
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: The leader’s interest in global jihad and the group’s resilience, adaptability, and possible interest in reorienting
      toward Western countries make the possibility serious, but do not show that a shift has occurred.
  - id: C4
    facts:
    - F5
    - F6
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: The assessed decline in diaspora support and the lack of much effort to inspire unaffiliated individual attacks weigh
      against treating attacks in Western countries as the group’s current priority.
  - id: C5
    facts:
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: A changed perception of AMISOM or calls for jihad in the West could alter the assessment, but these are contingencies
      and indicators to watch, not evidence that the primary focus has already shifted.
  reasoning:
    read: The analysts distinguish a leader’s global-jihad ambitions and the group’s capacity to adapt from its present primary
      focus. The regional attacks fit the Somalia struggle, while current rhetoric and recruitment point toward fighting in
      Somalia; the trap is treating concern about what al-Shabaab might do as proof that its focus has changed.
    weighing: The regional context and unchanged recruitment messaging are the strongest reasons for {O2} ({C1}, {C2}). The
      leader’s ambitions and the group’s adaptability warrant continued concern, but are weaker evidence of a present shift
      ({C3}). Reduced diaspora support and the lack of substantial effort to encourage unaffiliated attacks also weigh against
      that conclusion ({C4}). The balance could change if the group’s external-facing recruitment or AMISOM’s perceived role
      changes ({C5}, {flip1}, {watch1}).
    tradecraft: State the present judgment separately from the warning about future risk. Record which indicators support
      each assessment and revisit the judgment if those indicators change.
    uncertainty: 'The analysts caution against dismissing a future reorientation: the group is resilient and adaptable, and
      its leader would welcome an opportunity to attack a Western country. The assessment is therefore about the group’s focus
      at this point, not a guarantee about its future.'
    handoff: Communicate the judgment and its indicators to policymakers responsible for protecting citizens. The source urges
      resolve against al-Shabaab but also says any broader action should be coordinated and strategic.
    tempting_wrong:
      option: O1
      pull: The leader’s global-jihad interest, the group’s adaptability, and the Westgate attack’s regional selection of
        Americans as well as Kenyans can make a Western-target shift seem already established.
      why_wrong: The analysts say that even given Westgate, al-Shabaab is still best understood as focused on the Somalia
        and regional struggle; concern about a possible future shift is not the same as evidence that it is the current primary
        focus.
    rejected:
      O1: The analysts do not affirm a primary shift because the current regional pattern and unchanged rhetoric and recruitment
        remain more consistent with the Somalia and regional struggle.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Al-Shabaab leaders begin issuing calls to diaspora Somalis and other Muslims to wage jihad in the West.
      then: O1
      why: The analysts identify such calls as a cause for concern that could signal a shift in the group’s focus.
    would_not_change:
    - id: noflip1
      if: The Westgate attack, including the attackers’ interest in Americans as well as Kenyans, is considered by itself.
      why: The analysts explicitly maintain that, even given Westgate, the group is best understood as focused on the Somalia
        and regional struggle.
    watch_for:
    - id: watch1
      what: AMISOM coming to be seen as an occupying force, with the resulting possibility that al-Shabaab’s foreign recruitment
        networks partly revive.
      favors:
      - O1
      why: The analysts warn this could give the group more options regarding attacks in the West, though it does not by itself
        establish that its primary focus has shifted.
  lesson: Assess a group’s current primary focus from its observed pattern of activity, rhetoric, and recruitment, rather
    than inferring a completed shift from leadership intent or capability alone. Keep contingent indicators explicit and revise
    the judgment if they emerge.
  limits: This judgment concerns al-Shabaab’s primary focus in the period following Westgate, as assessed in this report.
    It does not rule out attacks on Western targets in the region or a future change in focus.
