case:
  id: DR-CORPUS-NX-9a9bdb76-E9@v1
  title: Conditional Soviet Preemption Decision
  status: draft
  setting: USSR, the present assessment period and projected mid-1960s, Soviet leadership
  decider: The Soviet leadership
  agent: The Soviet leadership
  agent_role: decide
  situation: The Soviet leadership faces a conditional decision about responding to a perceived imminent Western nuclear attack
    on the USSR. The stated trigger is a conclusion that the West is irrevocably committed to such an attack. Soviet ready
    forces are available, and the contemplated response involves a mixed force. That force offers flexibility but presents
    serious coordination difficulties. The broader strategic estimate projects a substantial Soviet missile capability by
    the mid-1960s, while recognizing that Soviet forces could not expect to destroy all growing US nuclear delivery capabilities.
  question: What should the Soviet leadership do if it concludes that the West is irrevocably committed to an imminent nuclear
    attack on the USSR?
  options:
    O1:
      do: The Soviet leadership would authorize preemption against the expected Western nuclear attack on the USSR.
      move: act
      irreversible: true
    O2:
      do: The Soviet leadership would decline preemption and leave its ready forces uncommitted.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The trigger for the contemplated decision is a Soviet conclusion that the West is irrevocably committed to an imminent
      nuclear attack on the USSR.
  - id: F2
    kind: capability
    status: assessed
    fact: The Soviets have ready forces available for a preemptive response.
  - id: F3
    kind: capability
    status: assessed
    fact: The available force is mixed and would permit flexibility.
  - id: F4
    kind: capability
    status: assessed
    fact: The mixed force would pose severe coordination difficulties.
  - id: F5
    kind: capability
    status: assessed
    fact: By the mid-1960s, the USSR is expected to have substantial missile capability against the US in addition to formidable
      forces for strikes in Eurasia.
  - id: F6
    kind: capability
    status: assessed
    fact: By the mid-1960s, some Soviet force is assessed as having a prospect of surviving an initial US attack and retaliating
      with high-yield nuclear weapons.
  - id: F7
    kind: capability
    status: assessed
    fact: Even with its projected mid-1960s long-range forces, the USSR could not expect to destroy the growing numbers of
      US nuclear delivery vehicles that could remain available.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Once the leadership concludes that a Western attack is irrevocably committed and imminent, the assessed response
      is to use available ready forces preemptively to blunt that expected blow.
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The mixed force permits flexibility in responding to the expected attack.
  - id: C3
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Severe coordination difficulties are a material drawback of using the mixed force and temper the case for preemption.
  - id: C4
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The projected mid-1960s force could offer a prospect of retaliation, but could not be expected to destroy all growing
      US nuclear delivery capabilities; this limits what preemption could accomplish and does not establish that it would
      remove the capacity for a US response.
  reasoning:
    read: 'This is a conditional judgment tied to a specific perception: the leadership concludes that the West is irrevocably
      committed to an imminent attack. The trap is treating the force''s flexibility as if it eliminates its serious coordination
      difficulties, or treating the projected mid-1960s capabilities as proof that preemption could eliminate the US retaliatory
      capacity.'
    weighing: The stated reason for O1 is to blunt the expected Western blow once the trigger is met {C1}. Force flexibility
      supports that course {C2}, while coordination difficulties count against it {C3}. The later strategic estimate limits
      expectations about what preemption could achieve, because significant US delivery capabilities would remain {C4}; it
      does not displace the passage's conditional judgment. The balance depends on the leadership actually reaching the stated
      conclusion about an imminent attack.
    tradecraft: At the decision level, establish and record whether the stated trigger has been met, the basis for that assessment,
      and how the force's flexibility and coordination difficulties bear on the choice. Keep the decision record focused on
      the authorization and its rationale, not on methods of employing forces.
    uncertainty: The passage gives no probability, evidentiary threshold, or procedure for determining that the West is irrevocably
      committed. It also does not quantify how the coordination difficulties or the limits on Soviet capability affect the
      expected result.
    handoff: The Soviet leadership is the decider in this frame. A decision process may draw on the relevant intelligence
      and military assessments to evaluate the trigger and the stated force limitations; the passage does not identify particular
      offices or prescribe a referral.
    tempting_wrong:
      option: O2
      pull: Declining preemption avoids acting with a mixed force that has severe coordination difficulties and avoids assuming
        that a first strike could eliminate US nuclear capabilities.
      why_wrong: Those are real limitations, but the passage's stated conditional judgment is that, if the leadership concludes
        an attack is irrevocably imminent, it would launch available ready forces to blunt the expected blow.
    rejected:
      O2: O2 was not chosen because it does not follow the passage's stated response when the specified imminent-attack conclusion
        has been reached.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership does not reach the stated conclusion that the West is irrevocably committed to an imminent attack.
      then: O2
      why: The passage makes that conclusion the condition for the assessed preemptive response; without it, the stated basis
        for O1 is absent.
    - id: flip2
      if: The coordination difficulties are assessed to outweigh the force's flexibility and its capacity to blunt the expected
        blow.
      then: O2
      why: That would change the balance of the force-related considerations, though the passage itself does not specify such
        a threshold.
    would_not_change:
    - id: noflip1
      if: The projected mid-1960s Soviet force still cannot be expected to destroy all growing US nuclear delivery capabilities.
      why: That limitation constrains the expected effect of preemption but, by itself, does not negate the passage's stated
        conditional response to the imminent-attack conclusion.
    watch_for: []
  lesson: 'A conditional decision must remain tied to its stated trigger: do not treat a response assessed for an imminent,
    irrevocable attack as a general rule for other circumstances. Weigh the expected purpose of the response against the stated
    limitations, without assuming those limitations erase the conditional judgment.'
  limits: This reasoning addresses only the conditional assessment and force characteristics described here. It does not establish
    a legal authorization, a process for verifying imminence, or a general rule for nuclear decision-making.
  library:
    domain: military-operational
    family: CORPUS-NX-9a9bdb76
    source: https://www.cia.gov/resources/csi/static/0b67eaeee3824456b2f4d37d5fda7c15/Part-II-Soviet-Strategic-Force-Development-from-Intentions-and-Capabilities.pdf
    episode_focus: 'This is a conditional force-employment decision: the stated trigger is the Soviet leadership’s assessment
      of an imminent Western attack, and the stated course is preemption to blunt that expected blow. The passage also notes
      the flexibility and coordination difficulties of the mixed force. Exclude any operational details about carrying out
      an attack.'
