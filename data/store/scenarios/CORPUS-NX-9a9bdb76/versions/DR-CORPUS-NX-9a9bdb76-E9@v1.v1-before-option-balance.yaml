      option_words:
        O1: 15
        O2: 12
      real_option: O1
      real_to_mean_other_length: 1.25
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
    equities: pilot2
