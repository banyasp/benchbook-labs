case:
  id: DR-CORPUS-NX-70f2a214-E1@v1
  title: Prioritizing Rescue During an Ongoing Search
  status: draft
  setting: Mishap site, LZ Peacock, and hospital at Camp Foster; time not stated; Marine aviation.
  decider: The flight lead pilot
  agent: The flight lead pilot
  agent_role: decide
  situation: A mishap has occurred during flight operations, and the flight lead pilot did not see the aircraft descend or
    impact. Rescue personnel are available at the landing zone, and survivors have been located near the mishap site. One
    survivor has been assessed as critically injured, while two others have been assessed as stable enough to move. The aircraft
    can transport injured survivors to the hospital at Camp Foster. The search of the mishap area remains ongoing.
  question: What should the flight lead pilot do about transporting the located survivors while continuing the search?
  options:
    O1:
      do: The flight lead pilot deprioritizes transport of located survivors to medical care and resumes the search first.
      move: act
      irreversible: false
    O2:
      do: The flight lead pilot prioritizes transport of located survivors to medical care and then resumes the search.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An aircraft mishap occurred.
  - id: F2
    kind: situation
    status: confirmed
    fact: The flight lead pilot did not see the aircraft's descent or impact.
  - id: F3
    kind: capability
    status: confirmed
    fact: Rescue personnel were available at LZ Peacock.
  - id: F4
    kind: situation
    status: confirmed
    fact: A survivor was located outside the aircraft at the mishap site.
  - id: F5
    kind: situation
    status: assessed
    fact: Rescue personnel assessed that survivor's injuries as critical.
  - id: F6
    kind: situation
    status: assessed
    fact: Two other survivors were assessed as stable enough to move.
  - id: F7
    kind: capability
    status: confirmed
    fact: The aircraft could transport injured survivors to the emergency department helipad at the hospital in Camp Foster.
  - id: F8
    kind: situation
    status: confirmed
    fact: Search activity at the mishap site remained ongoing.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: A survivor was found critically injured, and the aircraft could take injured survivors to the hospital; the flight
      lead pilot transported that survivor for medical care.
  - id: C2
    facts:
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The other located survivors were assessed as stable enough to move, and the flight lead pilot transported them for
      medical care as well.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The search was still ongoing, so transporting survivors delayed the search; the flight lead pilot returned to it
      after the transport.
  - id: C4
    facts:
    - F2
    - F3
    - F4
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Although the flight lead pilot did not see the aircraft descend or impact, rescue personnel were available and survivors
      had been located; the flight lead pilot promptly acted to support rescue.
  reasoning:
    read: The flight lead pilot lacked a direct view of the mishap, but that did not remove the immediate rescue need once
      survivors were located and one was assessed as critically injured. The trap is treating the ongoing search as a reason
      to postpone medical transport, rather than balancing it against the known condition of the survivors.
    weighing: The critical injury and available hospital transport weigh strongly toward {O2} {C1}. The other survivors could
      also be moved for care {C2}. The ongoing search weighed in favor of continuing search activity {C3}, but the flight
      lead pilot transported the survivors and then resumed the search. The prompt response despite not seeing the impact
      supports prioritizing rescue {C4}.
    tradecraft: Prioritize the located survivors' medical needs, use rescue personnel's assessments to inform the decision,
      and return to the search when transport is complete. Record the assessments, the decision to transport before resuming
      the search, and any material change in survivor condition or search urgency.
    uncertainty: The source provides no explicit comparison of medical urgency against search urgency, nor a threshold for
      how long transport could be delayed. The stated assessments and the flight lead pilot's actions support the choice,
      but do not establish a broader rule for every rescue situation.
    handoff: The flight lead pilot made the operational choice, informed by rescue personnel who assessed the survivors; medical
      care then passed to the hospital. The source does not identify a need for referral to a higher authority.
    tempting_wrong:
      option: O1
      pull: The search remained unfinished, and the flight lead pilot had not witnessed the impact.
      why_wrong: Once a survivor was assessed as critically injured and transport was available, postponing medical care to
        search first would discount the immediate, known need; the flight lead pilot instead transported the survivors and
        then resumed the search.
    rejected:
      O1: The flight lead pilot did not resume the search before transporting the located survivors for medical care.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The located survivors did not require timely medical care and the search presented a time-critical need to act first.
      then: O1
      why: Without an urgent medical need, the balance could favor continuing the search before transport.
    would_not_change:
    - id: noflip1
      if: The flight lead pilot still had not seen the aircraft descend or impact, but survivors were located and one was
        assessed as critically injured.
      why: Lack of a direct view of the mishap would not by itself outweigh the known injury and available means to transport
        survivors for care.
    watch_for:
    - id: watch1
      what: A change in the rescue personnel's assessment of survivor condition or in the urgency of the ongoing search.
      favors:
      - O1
      - O2
      why: Those changes could alter the balance between prompt medical transport and continuing search activity.
  lesson: When survivors are located and one is assessed as critically injured, prioritize available transport to medical
    care, then resume an ongoing search when practicable. Reassess if medical urgency or the urgency of the search materially
    changes.
  limits: 'This reasoning addresses the stated situation: located survivors, an assessment of critical injury, available hospital
    transport, and an ongoing search. It does not establish a universal priority rule where transport is unavailable, survivor
    conditions differ, or the search presents a different level of urgency.'
