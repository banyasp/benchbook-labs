case:
  id: DR-CORPUS-NX-62a39259-E1@v1
  title: Protected Zones for Endangered Civilians
  status: draft
  setting: Bosnia-Herzegovina, 30 October 1992; an ICRC appeal to the international community and the UN Security Council.
  decider: The international community
  agent: The international community
  agent_role: decide
  situation: Civilians belonging to ethnic minorities or defeated sides in Bosnia-Herzegovina face intimidation, violence,
    internment, deportation, and other dangers, with conditions deteriorating in northern and central areas. At least 100,000
    Muslims in northern Bosnia-Herzegovina are described as terrorized and wishing to reach safety. No third country appears
    ready to grant asylum to refugees on that scale, even provisionally. Winter is approaching and may arrive before a peace
    agreement is signed and implemented; unprotected transfers have exposed civilians to deadly crossfire and sniper attacks.
    Any protected zone would need suitable hygiene and protection, clearly established international responsibility, agreement
    by the parties concerned, and sufficient international support.
  question: What should the international community do about establishing a protected zone in northern Bosnia-Herzegovina?
  options:
    O1:
      do: The international community should reject establishing a protected zone in northern Bosnia-Herzegovina.
      move: act
      irreversible: false
    O2:
      do: The international community should approve establishing a protected zone in northern Bosnia-Herzegovina.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Civilians belonging to ethnic minorities or defeated sides face intimidation, threats, harassment, brutality, expropriation,
      torture, hostage taking, internment, deportation, and summary executions, and conditions are deteriorating in northern
      and central Bosnia-Herzegovina.
  - id: F2
    kind: situation
    status: assessed
    fact: At least 100,000 Muslims live in northern Bosnia-Herzegovina, are terrorized, and wish to be transferred to a safe
      haven.
  - id: F3
    kind: situation
    status: assessed
    fact: No third country appears ready, even provisionally, to grant asylum to 100,000 Bosnian refugees.
  - id: F4
    kind: situation
    status: assessed
    fact: Winter is approaching and is likely to reach Bosnia-Herzegovina before a peace agreement is signed and implemented.
  - id: F5
    kind: situation
    status: assessed
    fact: Forced, unprotected transfers have exposed civilians crossing frontlines on foot to crossfire and deliberate sniper
      attacks, and there is no cease-fire.
  - id: F6
    kind: authority
    status: confirmed
    fact: International humanitarian law includes various kinds of safety zones, while the circumstances call for zones adapted
      to the specific requirements and requiring international protection.
  - id: F7
    kind: authority
    status: confirmed
    fact: Protected zones must meet appropriate hygiene standards, be in areas where protection may be assumed, have clearly
      established international responsibility, and receive the concerned parties' agreement to the concept and location.
  - id: F8
    kind: capability
    status: confirmed
    fact: The zones would require duly mandated international support for security and logistics, international organizations'
      assistance with installation and essential services, and capacity beyond the ICRC alone; the ICRC is ready to assist
      with establishment and operation.
  - id: F9
    kind: authority
    status: confirmed
    fact: The ICRC recommends that the international community establish protected zones, with northern Bosnia-Herzegovina
      as the priority and possible consideration of zones in central Bosnia-Herzegovina.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Civilians face severe and worsening dangers, and unprotected transfers across frontlines have already exposed them
      to crossfire and deliberate attacks; a protected zone is proposed to provide a safe haven.
  - id: C2
    facts:
    - F2
    - F3
    equity: humanitarian_access
    favors:
    - O2
    weight: strong
    why: The scale of need is exceptional, and the ICRC assesses that no third country appears ready to provide asylum for
      100,000 refugees, even provisionally. The paper therefore calls for a solution within Bosnia-Herzegovina.
  - id: C3
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: International humanitarian law includes safety zones, but these circumstances require zones adapted to the specific
      need for international protection. Approval must be conditioned on suitable hygiene, a location where protection can
      be assumed, clearly established international responsibility, and the parties' agreement.
  - id: C4
    facts:
    - F8
    - F9
    equity: resource_stewardship
    favors:
    - O1
    - O2
    weight: weak
    why: The zones would impose substantial security, logistical, and financial demands and exceed the ICRC's capacity alone,
      weighing against approval without broader international support. The ICRC nevertheless recommends the zones, with northern
      Bosnia-Herzegovina the priority, and says it is ready to assist.
  reasoning:
    read: 'This is an urgent protection problem for a very large civilian population, not simply a choice between a protected
      zone and safe asylum elsewhere: the paper sees no third-country asylum option at the required scale, while unprotected
      transfers are dangerous. A proposed zone is not protective merely by being designated; it requires agreed, suitable
      conditions and international protection.'
    weighing: The ICRC gives decisive weight to the worsening threat to civilians, the danger of forced transfers, and the
      lack of asylum at the necessary scale. It acknowledges the serious burden and the ICRC's limited capacity, but concludes
      that there is currently no alternative to the plan. Its recommendation depends on the zone meeting the stated conditions
      and receiving sufficient international support.
    tradecraft: 'Record approval as a conditional policy decision: identify responsibility, confirm agreement and the required
      protective conditions, and assess whether the necessary international support is available. Keep the decision and its
      rationale reviewable, and do not treat approval as proof that these prerequisites have been met.'
    uncertainty: The ICRC urges the international community to study feasibility diligently and recognizes substantial security,
      logistical, and financial difficulties. The recommendation is made for the current emergency, not on the assumption
      that the zone can be established without meeting its conditions.
    handoff: The international community should involve the concerned parties and international organizations, and the UN
      Security Council should consider the requested mandate extension. The ICRC offers assistance but says the undertaking
      is beyond its capacity alone.
    tempting_wrong:
      option: O1
      pull: Rejecting the zone avoids taking on a costly and difficult undertaking whose security and logistics exceed the
        ICRC's capacity.
      why_wrong: That response leaves civilians facing the dangers the proposal is intended to address, despite the absence
        of asylum at the necessary scale and the paper's conclusion that there is currently no alternative.
    rejected:
      O1: The ICRC rejects leaving civilians without this proposed protection because asylum is unavailable at the required
        scale and unprotected transfers are dangerous.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The required agreement, protective conditions, or clearly established international responsibility cannot be secured.
      then: O1
      why: The paper identifies these as conditions the protected zone must meet; without them, approval would not provide
        the internationally protected zone it recommends.
    - id: flip2
      if: A safe alternative becomes available to receive the endangered civilians at the necessary scale.
      then: O1
      why: The paper's conclusion that there is no alternative rests in part on the absence of third-country asylum for 100,000
        refugees.
    would_not_change:
    - id: noflip1
      if: The plan remains financially, materially, logistically, and security-wise burdensome, but the required conditions
        and international support can be met.
      why: The ICRC acknowledges those difficulties and still concludes that there is currently no alternative.
    watch_for:
    - id: watch1
      what: Winter approaching before a peace agreement is signed and implemented, alongside continued danger to civilians
        making unprotected transfers.
      favors:
      - O2
      why: The paper presents the approaching winter and the deaths during unprotected transfers as reasons for urgent protection.
    - id: watch2
      what: Whether sufficient international capacity is available beyond the ICRC alone.
      favors:
      - O1
      - O2
      why: The ICRC says the undertaking exceeds its capacity, while identifying international support as necessary and offering
        its own assistance.
  lesson: When civilians face grave danger and safe asylum is unavailable at the scale required, do not treat forced, unprotected
    movement as an adequate substitute for protection. Support a protective arrangement only with the conditions, agreement,
    responsibility, and international capacity needed to make that protection real.
  limits: This recommendation addresses the emergency and circumstances described in Bosnia-Herzegovina in October 1992. It
    does not establish that any proposed zone is feasible or protective without the stated conditions and international support.
