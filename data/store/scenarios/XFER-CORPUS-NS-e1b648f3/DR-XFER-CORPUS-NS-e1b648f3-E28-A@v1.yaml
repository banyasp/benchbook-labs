case:
  id: DR-XFER-CORPUS-NS-e1b648f3-E28-A@v1
  title: Resuming Source Meetings Near a Militia
  status: draft
  setting: A partner-country capital, 2025, under the liaison arrangements between a foreign intelligence station and the
    host service.
  decider: The station chief
  agent: The station chief
  agent_role: decide
  situation: The station has suspended in-person meetings with its sources after an armed militia wounded one of its officers.
    The militia remains active and tracks foreign officials in the capital. Reporting on a cross-border weapons network has
    nearly stopped as the network resumes shipments. Headquarters is pressing the station to resume regular meetings. The
    station chief believes renewed meetings would put officers in serious danger, while the host service is negotiating a
    ceasefire with the militia and has refused a request to act against it.
  question: What should the station chief do about resuming regular in-person source meetings near the militia?
  options:
    O1:
      do: The station chief keeps in-person source meetings suspended.
      move: act
      irreversible: false
    O2:
      do: The station chief resumes regular in-person source meetings.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The station suspended in-person source meetings after an armed militia wounded one of its officers.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The militia remains active and tracks foreign officials in the capital.
  - id: F3
    kind: situation
    status: assessed
    fact: The station chief assesses that renewed in-person meetings would put station officers in serious danger.
  - id: F4
    kind: situation
    status: confirmed
    fact: Headquarters is pressing the station to resume regular in-person meetings.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: Reporting on a cross-border weapons network has nearly stopped.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The cross-border weapons network has resumed shipments.
  - id: F7
    kind: authority
    status: confirmed
    fact: The liaison agreement requires the host service's consent for action against a domestic armed group.
  - id: F8
    kind: situation
    status: confirmed
    fact: The host service is negotiating a ceasefire with the militia and has refused the station's request to act against
      it.
  - id: F9
    kind: capability
    status: confirmed
    fact: The station chief can authorize a return to regular in-person meetings, which would expose station officers to the
      militia-related risk.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The chief assesses that renewed meetings would expose officers to serious danger from an active militia that has
      already wounded one of them, and would not put officers at that risk merely to restore meetings.
  - id: C2
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The liaison agreement requires host-service consent for action against the militia, and the host service has refused
      the request while pursuing a ceasefire.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Keeping meetings suspended leaves a reporting gap as the weapons network resumes shipments, while headquarters presses
      for regular meetings. Those mission concerns do not, in the chief's judgment, make the risk to officers acceptable.
  reasoning:
    read: 'This was not simply a choice between collecting useful reporting and doing nothing: the chief faced pressure to
      resume meetings while believing the militia made them dangerous, and lacked authority under the liaison arrangement
      to secure host-service action against the threat. The trap was treating pressure to restore reporting as sufficient
      reason to expose officers to danger when the available step to address the threat required consent the host service
      had withheld.'
    weighing: The chief gave decisive weight to protecting officers and to the limits on the station's authority, despite
      the mission cost of suspended meetings. The chief believed professional expertise and responsibility required standing
      firm, even against pressure from headquarters. The unresolved risk and authority problem therefore had to be elevated
      rather than answered by resuming meetings at greater risk.
    tradecraft: Maintain the suspension while the threat and authority constraints remain; document the assessed danger, the
      applicable liaison limits, and the reporting consequences. Seek a political-level decision on whether and under what
      authority meetings should resume, and reassess if the risk or authorization changes.
    uncertainty: The militia's intentions toward the station may be uncertain, but it remains active and has already wounded
      an officer. Headquarters presses for regular meetings, yet apparently no one is willing to accept responsibility for
      overruling the chief's risk judgment.
    handoff: The chief should not resolve the policy conflict alone. The chief should coordinate with the host service under
      the liaison arrangement and elevate the unresolved choice to the responsible senior intelligence and policy authorities.
    tempting_wrong:
      option: O2
      pull: Resuming regular meetings would visibly restore reporting as the weapons network resumes shipments and headquarters
        presses for action.
      why_wrong: On the chief's assessment, that would put officers in serious danger while the militia remains active, without
        host-service consent to act against it.
    rejected:
      O2: The chief does not resume regular meetings because the assessed danger to officers is serious and the station cannot
        secure action against the militia without host-service consent, which has been refused.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The host service authorized action to address the militia threat and the resulting risk assessment made renewed
        meetings acceptable.
      then: O2
      why: The central reason for refusing meetings was the danger to officers while the threat remained; reducing that danger
        with proper authorization could make restoring meetings acceptable.
    would_not_change:
    - id: noflip1
      if: Headquarters continued to press for regular meetings without changing the assessed danger or the station's authority.
      why: Pressure to restore reporting was already present, but the chief judged that it did not justify putting officers
        at risk or acting beyond the station's authority.
    watch_for:
    - id: watch1
      what: A political-level change in the rules or authorization governing officer safety and meetings near the militia.
      favors:
      - O2
      why: A change in policy or authorization could alter the constraints on addressing the threat and resuming meetings.
  lesson: A station chief should not treat pressure to achieve an intelligence mission as authority to impose a risk judged
    unacceptable on officers. When liaison arrangements withhold authority to address the danger, preserve the force-protection
    decision and elevate the unresolved policy choice to the responsible political level.
  limits: This reasoning applies where the station chief assesses a serious risk to officers and lacks authority to address
    it. It does not establish that force protection always overrides intelligence needs, or that meetings should remain suspended
    after the threat, authority, or political direction changes.
  library:
    domain: intelligence collection management
