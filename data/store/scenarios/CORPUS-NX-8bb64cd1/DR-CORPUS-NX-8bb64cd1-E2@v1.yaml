case:
  id: DR-CORPUS-NX-8bb64cd1-E2@v1
  title: Ejection During an Unrecoverable Landing Emergency
  status: draft
  setting: Aircraft landing, approximately five seconds after touchdown; institution and location not stated.
  decider: The MP, the pilot
  agent: The MP, the pilot
  agent_role: decide
  situation: The MP is in an aircraft landing emergency shortly after touchdown. The landing has lasted about five seconds,
    with multiple, progressively worsening bounces. The flight controls are unresponsive, and the MP has been unable to restore
    a landing attitude or execute a go-around. Three seconds of attempted recovery have not restored an effective response.
    The MP reports feeling confused, helpless, and ignored. The MP must choose between ejecting and remaining aboard while
    continuing the landing attempt.
  question: What should the MP do as worsening bounces and unresponsive flight controls make recovery or a go-around appear
    unattainable?
  options:
    O1:
      do: The MP stays in the aircraft and continues the landing attempt.
      move: act
      irreversible: false
    O2:
      do: The MP ejects from the aircraft and ends the landing attempt.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The landing had lasted approximately five seconds since touchdown by the decision point.
  - id: F2
    kind: situation
    status: confirmed
    fact: The aircraft had experienced multiple, progressively worsening bounces.
  - id: F3
    kind: capability
    status: confirmed
    fact: The flight-control system had become saturated and unresponsive.
  - id: F4
    kind: capability
    status: confirmed
    fact: The MP had been unable to reestablish a landing attitude or execute a go-around.
  - id: F5
    kind: situation
    status: confirmed
    fact: Three seconds of attempted recovery had not overcome the loss of effective flight-control response.
  - id: F6
    kind: situation
    status: assessed
    fact: The MP reported feeling confused, helpless, and ignored.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The bounces were progressively worsening while the flight controls were unresponsive and the MP could not restore
      a landing attitude or go around; continued flight therefore offered no effective recovery path.
  - id: C2
    facts:
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Three seconds of attempted recovery had not overcome the control-system saturation, so the MP had no effective response
      to rely on by the decision point.
  - id: C3
    facts:
    - F1
    - F2
    - F4
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The emergency was unfolding within a landing that had lasted only about five seconds, with worsening bounces and
      no available go-around; delay meant continuing an attempt that had not restored control.
  reasoning:
    read: This was an immediate survival decision, not a routine choice to persist with a landing. The trap in {O1} is treating
      continued effort as a viable recovery when worsening bounces and ineffective controls had left the MP unable to recover
      or go around.
    weighing: The progressively worsening bounces, unresponsive controls, and inability to regain a landing attitude or go
      around led to the MP's decision to eject. The attempted recovery had not restored effective response in the available
      time. Taken together, {C1}, {C2}, and {C3} favor {O2}; the balance depends on recovery or go-around no longer being
      attainable.
    tradecraft: At the decision point, prioritize the immediate survival choice and act without adding delay for documentation.
      Record the decision and circumstances once doing so is safe.
    uncertainty: The account gives no probability that staying would succeed and does not describe another available recovery
      option. It records the MP's reported confusion, helplessness, and feeling of being ignored, but does not establish those
      feelings as a separate basis for the choice.
    handoff: The MP had to make the emergency choice immediately; no other decision-maker or opportunity for consultation
      is identified.
    tempting_wrong:
      option: O1
      pull: Staying may feel like preserving the possibility of completing the landing or trying once more to recover.
      why_wrong: 'That possibility was not supported by the reported circumstances: the bounces were worsening, the controls
        were unresponsive, and recovery or a go-around had not become attainable.'
    rejected:
      O1: The MP did not remain aboard because the worsening bounces and ineffective controls had made recovery or a go-around
        appear unattainable.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Effective flight-control response returned in time to restore a landing attitude or make a go-around attainable.
      then: O1
      why: That would remove the stated basis that recovery and a go-around were unavailable, making continued flight a plausible
        course rather than persistence without effective control.
    would_not_change:
    - id: noflip1
      if: The MP felt less confused or helpless, but the worsening bounces and ineffective controls remained unchanged.
      why: A change in reported feelings alone would not restore the unavailable recovery or go-around capability that drove
        the choice.
    watch_for:
    - id: watch1
      what: Any timely, effective return of control that makes recovery or a go-around feasible.
      favors:
      - O1
      why: The choice turns on whether an effective recovery path is actually available, not merely hoped for.
  lesson: When an emergency is worsening and the available controls have not restored a viable recovery path, persistence
    is not itself a safety plan. The choice should turn on whether recovery or a go-around remains attainable in the time
    available.
  limits: This reasoning applies to the described immediate landing emergency and the reported loss of effective control.
    It does not establish a general rule to eject in other emergencies, especially where effective recovery remains available
    or the relevant conditions differ.
