case:
  id: DR-OHA-26-0038@v1
  title: Guideline G Alcohol-Related Security Concern – Access Authorization Restoration
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 2026
  decider: Administrative Judge
  agent: Adjudication Support Agent
  agent_role: decide
  situation: The Individual, employed by a DOE contractor in a position requiring an access authorization, has a history of
    alcohol-related incidents including four arrests in the 1990s and a DWI arrest in April 2025. The Local Security Office
    raised a security concern under Guideline G, citing the recent DWI and a diagnosis of Unspecified Alcohol-Related Disorder
    by a DOE psychologist. The Individual has provided evidence of abstinence, including multiple negative PEth tests and
    urine screens, and has been participating in AA meetings and an intensive outpatient program. The DOE psychologist testified
    that the Individual no longer meets criteria for an alcohol use disorder and has a good prognosis. The regulations require
    a determination that granting or restoring access will not endanger security, with a presumption against granting. The
    Administrative Judge must decide whether the security concerns are resolved and whether to restore the access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional treatment documentation.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge grants provisional authorization pending negative PEth tests.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: false
    O4:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual had four alcohol-related criminal incidents in the 1990s, including a 1995 DWI arrest and a felony
      involving a loaded gun.
  - id: F3
    kind: situation
    status: confirmed
    fact: On April 14, 2025, the Individual was arrested and charged with Driving While Under the Influence.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about eligibility under Guideline
      G, citing the April 2025 DWI and a diagnosis of Unspecified Alcohol-Related Disorder.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist evaluated the Individual on August 28, 2025 and diagnosed Unspecified Alcohol-Related Disorder.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The Individual provided negative PEth test results from January to June 2026 and negative urine screens from April
      to December 2025, indicating no alcohol consumption since April 2025.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual has been regularly attending AA meetings since January 2026 and is participating in an intensive
      outpatient program with documented progress.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist testified that the Individual does not meet criteria for alcohol use disorder, is rehabilitated,
      and has a good prognosis.
  - id: F9
    kind: authority
    status: confirmed
    fact: The DOE regulations at 10 CFR Part 710 impose a presumption against granting or restoring a security clearance and
      require evidence that granting will not endanger security.
  - id: F10
    kind: authority
    status: confirmed
    fact: The Administrative Judge has delegated authority to an Adjudication Support Agent to draft the finding.
  considerations:
  - id: C1
    facts:
    - F2
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Judge applied mitigating factor (a), noting the 1990s incidents occurred 28‑30 years ago, the individual was
      young then, and there is no pattern, so they do not cast doubt on current reliability.
  - id: C2
    facts:
    - F3
    - F6
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: 'The Judge found the Individual satisfied mitigating factor (b): he acknowledged his alcohol problem, provided six
      months of negative PEth tests, negative urine screens, and ongoing AA and IOP participation, demonstrating sustained
      abstinence.'
  - id: C3
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The DOE Psychologist testified that the Individual no longer meets criteria for an alcohol use disorder and has a
      good prognosis, supporting the conclusion that the security concern is resolved.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: Although 10 C.F.R. § 710.7 imposes a presumption against granting, the regulation also allows the presumption to
      be overcome with sufficient mitigating evidence, which the Individual supplied.
  - id: C5
    facts:
    - F7
    equity: mission_effect
    favors:
    - O4
    weight: weak
    why: Continued participation in treatment programs demonstrates the Individual’s ability to perform his security‑sensitive
      duties without endangering the common defense.
  reasoning:
    read: The security concern under Guideline G stems from the Individual’s recent DWI and a diagnosis of Unspecified Alcohol‑Related
      Disorder. The Judge must decide whether the conduct and current condition still pose a risk to reliability, trustworthiness,
      or judgment.
    weighing: The Judge balanced the mitigating factors. {C1} removed the weight of the 1990s incidents. {C2} showed the Individual’s
      sustained abstinence and compliance with treatment, satisfying factor (b). {C3} added professional confirmation that
      the disorder no longer exists. Although {C4} notes the statutory presumption against granting, the cumulative evidence
      meets the burden to overcome that presumption. Consequently, the balance tipped toward restoration.
    tradecraft: The decision is recorded in the Administrative Judge’s written Decision, citing the specific exhibits and
      testimony, and the restoration is entered into the Individual’s security file per 10 C.F.R. § 710.27(d).
    uncertainty: Minimal; the evidence of abstinence is objective (PEth, urine screens) and the psychologist’s opinion is
      clear. The only residual uncertainty would be future relapse.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.27(d) and the delegation noted in F10.
    tempting_wrong:
      option: O3
      pull: The recent DWI could be viewed as a serious lapse, tempting a denial.
      why_wrong: The Judge correctly recognized that the DWI is mitigated by the Individual’s subsequent abstinence, treatment,
        and professional assessment, which outweigh the isolated incident.
    rejected:
      O1: Holding the decision pending further documentation was unnecessary because the record already demonstrated sustained
        abstinence and treatment progress.
      O2: A provisional grant was not needed; the evidence satisfied the full restoration standard.
      O3: Denial would ignore the mitigating evidence and the psychologist’s finding that the Individual no longer meets disorder
        criteria.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A future PEth test or urine screen returns positive for alcohol consumption.
      then: O3
      why: A positive test would indicate a relapse, re‑activating the security concern under Guideline G.
    - id: flip2
      if: The Individual fails to complete the prescribed treatment program or stops attending AA/IOP without a valid reason.
      then: O1
      why: Non‑compliance would show a lack of sustained rehabilitation, justifying a hold pending further evidence.
    would_not_change:
    - id: noflip1
      if: The Individual continues to provide negative PEth tests and remains in treatment.
      why: The record already satisfies mitigating factor (b) and the psychologist’s good prognosis, so restoration remains
        appropriate.
    watch_for:
    - id: watch1
      what: Any new alcohol‑related arrest or incident.
      favors:
      - O3
      why: A new incident would re‑introduce a fresh security concern under Guideline G.
  lesson: Under Guideline G, long‑ago alcohol‑related conduct can be mitigated by the passage of time, and recent misconduct
    can be overcome by documented sustained abstinence, treatment compliance, and professional assessment that the individual
    no longer meets disorder criteria.
  limits: This analysis applies only when the individual provides objective, continuous evidence of abstinence (e.g., PEth,
    urine screens) and remains engaged in approved treatment. It does not extend to cases lacking such evidence or where relapse
    occurs.
