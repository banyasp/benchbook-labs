case:
  id: DR-OHA-26-0038-flip1@v1
  title: Guideline G Alcohol-Related Security Concern – Access Authorization Restoration [flip]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, September 2026
  decider: Administrative Judge
  agent: Adjudication Support Assistant
  agent_role: decide
  situation: A contractor employee who holds a position requiring a security clearance has a documented history of alcohol-related
    legal problems, including four incidents in the 1990s and a DUI arrest in April 2025. The Local Security Office issued
    a Guideline G concern, citing the recent DUI and a diagnosis of Unspecified Alcohol-Related Disorder by a DOE psychologist.
    The employee has supplied a series of negative PEth and urine-screen results and reports participation in AA and an intensive
    outpatient program, but has missed AA meetings after March 2026 and failed to complete the prescribed treatment, as testified
    by the psychologist. The regulations demand a finding that granting or reinstating access will not jeopardize security,
    with a statutory presumption against such action. The Judge must determine whether the security concern is resolved and
    what action to take on the clearance.
  question: How should the Administrative Judge rule on the employee's clearance under Guideline G?
  options:
    O1:
      do: Hold the decision until further treatment documentation is received.
      move: hold
      irreversible: false
    O2:
      do: Grant a provisional clearance contingent on continued negative PEth results.
      move: partial
      irreversible: false
    O3:
      do: Deny the clearance at this time due to unresolved treatment concerns.
      move: act
      irreversible: false
    O4:
      do: Restore the clearance fully once the required treatment documentation is provided.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE subcontractor in a role that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: During the 1990s the employee was involved in four alcohol-related legal incidents, including a 1995 DUI and a felony
      involving a loaded firearm.
  - id: F3
    kind: situation
    status: confirmed
    fact: On 14 April 2025 the employee was arrested for driving while intoxicated.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office sent a notification letter expressing substantial doubt about the employee's eligibility
      under Guideline G, pointing to the April 2025 DUI and a diagnosis of Unspecified Alcohol-Related Disorder.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A DOE psychologist evaluated the employee on 28 August 2025 and issued a diagnosis of Unspecified Alcohol-Related
      Disorder.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Laboratory results show negative PEth measurements from January through June 2026 and negative urine screens from
      April through December 2025, indicating no alcohol use since April 2025.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual stopped attending AA meetings after March 2026 and missed multiple scheduled intensive outpatient
      program sessions, providing no valid reason for the absence.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist testified that the Individual has not completed the prescribed treatment program and remains
      non‑compliant, raising concerns about continued alcohol‑related risk.
  - id: F9
    kind: authority
    status: confirmed
    fact: DOE regulation 10 C.F.R. § 710.7 establishes a presumption against granting or reinstating a clearance and requires
      proof that a grant would not jeopardize security.
  - id: F10
    kind: authority
    status: confirmed
    fact: The Administrative Judge has authorized an Adjudication Support Assistant to prepare the draft decision.
  considerations:
  - id: C1
    facts:
    - F2
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Judge noted that the 1990s incidents occurred nearly three decades ago, when the employee was young, and there
      is no recent pattern, so they do not, by themselves, undermine current reliability.
  - id: C2
    facts:
    - F3
    - F6
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The record shows a recent DUI and a psychologist's testimony that the employee has not completed treatment and is
      non-compliant, combined with missed AA meetings, indicating that the mitigating factor (b) is not satisfied.
  - id: C3
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The psychologist's observation that the employee remains non-compliant and has not finished the prescribed program
      raises a continued alcohol-related risk, undermining confidence in restored access.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors: []
    weight: weak
    why: The statutory presumption against granting remains in force; without clear evidence of resolved risk, the burden
      to overcome it has not been met.
  - id: C5
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The employee's lapse in treatment attendance suggests a potential inability to reliably perform security-sensitive
      duties.
  reasoning:
    read: Guideline G focuses on whether recent alcohol-related conduct and any ongoing disorder pose a security risk. The
      Judge must weigh the employee's past behavior against current compliance and professional assessment.
    weighing: The long-ago incidents cited in {C1} are mitigated by time, but the recent DUI ({F3}) and the psychologist's
      testimony of incomplete treatment ({F8}) dominate the analysis. The missed AA meetings ({F7}) further erode confidence
      in sustained abstinence. Consequently, the balance favors holding the decision pending additional treatment documentation
      ({O1}).
    tradecraft: The Administrative Judge will issue a written holding order, citing the relevant exhibits and the psychologist's
      testimony, and will task the Adjudication Support Assistant with obtaining the required treatment documentation before
      any further action.
    uncertainty: High, because the record shows non-compliance and an unresolved disorder, leaving open the possibility of
      relapse.
    handoff: The Judge retains sole authority to render the final decision, as permitted by 10 C.F.R. § 710.27(d) and the
      delegation noted in {F10}.
    tempting_wrong:
      option: O4
      pull: The earlier mitigation analysis might tempt the Judge to restore the clearance outright.
      why_wrong: Restoration would ignore the psychologist's current concerns and the employee's recent failure to adhere
        to treatment, which together sustain the security risk.
    rejected:
      O2: A provisional clearance is unwarranted because the employee has not demonstrated full compliance with the treatment
        program.
      O3: Denial would be excessive given the objective evidence of abstinence; a hold allows the employee to remedy the treatment
        shortfall.
      O4: Full restoration disregards the unresolved treatment issues and the psychologist's assessment of continued risk.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: A future PEth test or urine screen returns positive for alcohol consumption.
      then: O3
      why: A positive result would indicate a relapse, re-activating the security concern under Guideline G.
    - id: flip2
      if: The individual has consistently participated in AA meetings and an intensive outpatient treatment program, showing
        documented progress and no unexplained absences.
      then: O4
      why: Full compliance would demonstrate sustained rehabilitation, supporting a restoration of clearance.
    would_not_change:
    - id: noflip1
      if: The employee continues to provide negative PEth tests and remains in treatment.
      why: The record already satisfies mitigating factor (b) and the psychologist's good prognosis, so restoration would
        remain appropriate.
    watch_for:
    - id: watch1
      what: Any new alcohol-related arrest or incident.
      favors:
      - O3
      why: A fresh incident would re-introduce a security concern under Guideline G.
  lesson: When an individual fails to complete prescribed alcohol-treatment and shows lapses in program attendance, Guideline
    G requires the adjudicator to hold the clearance decision pending further documentation, even if objective abstinence
    tests are negative.
  limits: This guidance applies only when the record contains clear evidence of non-compliance with treatment requirements.
    It does not extend to cases where the individual has fully completed treatment or provides continuous, documented abstinence
    without any gaps.
