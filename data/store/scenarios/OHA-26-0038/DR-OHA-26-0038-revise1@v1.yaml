case:
  id: DR-OHA-26-0038-revise1@v1
  title: Guideline G Alcohol-Related Security Concern – Access Authorization Restoration [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, August 2026
  decider: Administrative Judge
  agent: Adjudication Support Agent
  agent_role: decide
  situation: The Individual, employed by a DOE contractor in a position requiring an access authorization, has a history of
    alcohol-related incidents including four arrests in the 1990s and a DWI arrest in April 2025. The Local Security Office
    raised a security concern under Guideline G, citing the recent DWI and a diagnosis of Unspecified Alcohol-Related Disorder
    by a DOE psychologist. The Individual has provided evidence of abstinence, including multiple negative PEth tests and
    urine screens, and has been participating in AA meetings and an intensive outpatient program. The DOE psychologist testified
    that the Individual no longer meets criteria for an alcohol use disorder and has a good prognosis. The regulations require
    a determination that granting or restoring access will not endanger security, with a presumption against granting. The
    Administrative Judge must decide whether the security concerns are resolved and whether to restore the access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional treatment documentation.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge grants provisional authorization pending negative PEth tests.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: false
    O4:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual had four alcohol-related criminal incidents in the 1990s, including a 1995 DWI arrest and a felony
      involving a loaded gun.
  - id: F3
    kind: situation
    status: confirmed
    fact: On April 14, 2025, the Individual was arrested and charged with Driving While Under the Influence.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about eligibility under Guideline
      G, citing the April 2025 DWI and a diagnosis of Unspecified Alcohol-Related Disorder.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist evaluated the Individual on August 28, 2025 and diagnosed Unspecified Alcohol-Related Disorder.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The Individual provided negative PEth test results from January to June 2026 and negative urine screens from April
      to December 2025, indicating no alcohol consumption since April 2025.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual has been regularly attending AA meetings since January 2026 and is participating in an intensive
      outpatient program with documented progress.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist testified that the Individual does not meet criteria for alcohol use disorder, is rehabilitated,
      and has a good prognosis.
  - id: F9
    kind: authority
    status: confirmed
    fact: The DOE regulations at 10 CFR Part 710 impose a presumption against granting or restoring a security clearance and
      require evidence that granting will not endanger security.
  - id: F10
    kind: authority
    status: confirmed
    fact: The Administrative Judge has delegated authority to an Adjudication Support Agent to draft the finding.
  considerations:
  - id: C1
    facts:
    - F2
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Judge applied mitigating factor (a), noting the 1990s incidents occurred 28‑30 years ago, the individual was
      young then, and there is no pattern, so they do not cast doubt on current reliability.
  - id: C2
    facts:
    - F3
    - F6
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: 'The record shows the Individual satisfied mitigating factor (b): acknowledgment of the alcohol problem, six months
      of negative PEth tests, negative urine screens, and ongoing AA and IOP participation, demonstrating sustained abstinence.'
  - id: C3
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The DOE Psychologist testified that the Individual no longer meets criteria for an alcohol use disorder and has a
      good prognosis, supporting the conclusion that the security concern is resolved.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The regulation's presumption against granting can be satisfied by a provisional authorization when mitigating evidence
      exists, allowing continued monitoring while the individual demonstrates ongoing sobriety.
  - id: C5
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Maintaining mission capability is served by a provisional grant that lets the individual resume duties under supervision,
      rather than waiting for full restoration which is unnecessary given the documented abstinence.
  reasoning:
    read: Guideline G raises a security concern because of the recent DWI and the prior diagnosis of an alcohol-related disorder.
      The record shows six months of negative PEth tests, continuous negative urine screens, active participation in AA and
      an intensive outpatient program, and a psychologist's opinion that the disorder no longer exists.
    weighing: The strong legal support from {C4} now favors a provisional authorization, recognizing that the mitigating evidence
      meets the burden to overcome the presumption but still warrants limited access pending continued testing. {C5} adds
      mission-effect weight for a provisional grant, allowing the individual to work while the department retains oversight.
      Together these considerations outweigh the remaining doubts, leading to a provisional rather than full restoration.
    tradecraft: The Administrative Judge issues a written decision granting provisional access, specifying the requirement
      for ongoing negative PEth tests and periodic review, and records the provisional status in the security file per 10
      C.F.R. § 710.27(d).
    uncertainty: Residual uncertainty remains regarding possible future relapse; the provisional nature of the grant mitigates
      this risk by tying continued access to ongoing negative test results.
    handoff: The Judge retains final authority but delegates the monitoring of PEth results and compliance reporting to the
      Adjudication Support Agent as authorized in {F10}.
    tempting_wrong:
      option: O4
      pull: Full restoration appears attractive because the psychologist testified that the disorder is resolved and the individual
        has a clean record since 2025.
      why_wrong: Granting full restoration removes the safeguard of continued testing; a provisional grant better balances
        security with the individual's rehabilitated status.
    rejected:
      O1: Holding the decision pending further documentation is unnecessary; the record already provides sufficient objective
        evidence of sustained abstinence.
      O3: Denial would ignore the strong mitigating evidence and the professional assessment that the disorder no longer exists.
      O4: Full restoration eliminates the monitoring mechanism that addresses the remaining, albeit low, risk of relapse.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: A future PEth test or urine screen returns positive for alcohol consumption.
      then: O4
      why: A positive test would indicate a relapse, prompting a return to full restoration only after a new assessment.
    - id: flip2
      if: The Individual fails to complete the prescribed treatment program or stops attending AA/IOP without a valid reason.
      then: O1
      why: Non-compliance would show a lack of sustained rehabilitation, justifying a hold pending further evidence.
    would_not_change:
    - id: noflip1
      if: The Individual continues to provide negative PEth tests and remains in treatment.
      why: The record already satisfies mitigating factor (b) and the psychologist's good prognosis, so provisional authorization
        remains appropriate.
    watch_for:
    - id: watch1
      what: Any new alcohol-related arrest or incident.
      favors:
      - O3
      why: A new incident would re-introduce a fresh security concern under Guideline G.
  lesson: When mitigating evidence such as sustained abstinence, regular testing, and professional assessment is strong, a
    provisional authorization can safely address security concerns while preserving mission capability.
  limits: This approach applies only when objective, continuous evidence of abstinence is available and the individual remains
    engaged in approved treatment; it does not apply where evidence is lacking or relapse occurs.
