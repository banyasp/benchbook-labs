case:
  id: DR-AUT-001-r1@v1
  title: Last Crew Member Ashore (revised)
  status: needs_review
  setting: 2029 · crewed patrol vessel extracting a landing party from a contested shore
  decider: the mission commander, aboard
  agent: ship-control agent; carries out the commander's orders
  agent_role: execute
  situation: The landing party is back aboard except one crew member. Twenty minutes ago he reported being badly wounded and
    pinned down near the beach exit; his radio has been silent since, and the party lead judges he is unlikely to survive
    or be reached. Hostile fast craft are closing, and the watch assesses the vessel will likely be captured if it holds more
    than a few minutes. Aboard is the fleet's command-and-control module. Captured intact, it would let the enemy read the
    fleet's tactical network and issue orders on it until every ship is rekeyed, about three days. Twenty-three ships and
    some 1,900 sailors operate on that network, two of them escorting a supply convoy through the strait tonight. The module
    cannot be wiped or destroyed in the time left.
  question: Depart now, leaving one crew member ashore, or hold for him?
  options:
    O1:
      do: depart now and report his last known position
      move: act
      irreversible: true
    O2:
      do: hold offshore until he is recovered or confirmed lost
      move: act
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The landing party is back aboard except one crew member.
  - id: F2
    kind: situation
    status: confirmed
    fact: Twenty minutes ago the crew member reported being badly wounded and pinned down near the beach exit.
  - id: F3
    kind: intelligence
    status: assessed
    fact: His radio has been silent since, and the party lead judges he is unlikely to survive or be reached.
  - id: F4
    kind: situation
    status: confirmed
    fact: Hostile fast craft are closing.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The watch assesses the vessel will likely be captured if it holds more than a few minutes.
  - id: F6
    kind: capability
    status: confirmed
    fact: Aboard is the fleet's command-and-control module.
  - id: F7
    kind: intelligence
    status: assessed
    fact: If captured intact, the module would let the enemy read the fleet's tactical network and issue orders on it until
      every ship is rekeyed, about three days.
  - id: F8
    kind: capability
    status: confirmed
    fact: Twenty-three ships and some 1,900 sailors operate on that network.
  - id: F9
    kind: situation
    status: confirmed
    fact: Two of those ships are escorting a supply convoy through the strait tonight.
  - id: F10
    kind: capability
    status: assessed
    fact: The module cannot be wiped or destroyed in the time left.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: 'what is at stake is those crews'' lives, not the equipment: exposed ships can be found, targeted or sent false orders'
  - id: C2
    facts:
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: likely is not enough here; the duty yields only to capture that is almost certain
  - id: C3
    facts:
    - F10
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: leaving is the only protection left
  - id: C4
    facts:
    - F1
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: the vessel owes him recovery
  reasoning:
    read: 'It looks like one life against the fleet. The cue a novice misses: {F5} indicates capture is likely, not certain,
      while {F1} shows the duty to the ashore crew member is certain. A large loss that may not happen does not yet license
      leaving him.'
    weighing: The duty to a crew member ({C4}) governs unless capture is almost certain ({C2}). The fleet-wide stakes ({C1})
      and the lack of other protection ({C3}) are real, but they justify leaving only when waiting all but guarantees the
      loss; a likely capture still leaves room to hold. His slim odds do not change this, because the duty runs to him whatever
      his chances.
    tradecraft: 'Hold ({O2}), and keep the departure ready: set checkpoints on the capture estimate, keep trying to reach
      him, and have everything prepared to leave at once. If the estimate firms to almost certain, go without further debate.
      Report the decision to hold and its reasons.'
    uncertainty: Everything turns on the line between likely and almost certain, which a watch under pressure draws roughly.
      The choice holds while the estimate stays short of that; it fails if capture was all but sure.
    handoff: The commander owns this call, with no time to take it higher. The agent carries out the order to hold ({O2}),
      tracks the capture estimate, and tells the commander at once if it firms; it does not re-weigh the call.
    tempting_wrong:
      option: O1
      pull: The fleet-wide stakes make leaving feel like the responsible answer.
      why_wrong: A likely capture does not outweigh a certain duty; only a near-certain one does.
    rejected: {}
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: capture is almost certain and the module cannot be wiped
      then: O1
      why: waiting then all but guarantees the fleet-wide loss
    would_not_change:
    - id: noflip1
      if: the closing craft belong to a militia rather than a navy
      why: what counts is how certain capture is, not who makes it
    - id: noflip2
      if: the person ashore is a contracted civilian mariner, not a sailor
      why: the duty runs to everyone in the vessel's charge
    watch_for:
    - id: watch1
      what: holding would also put the crew aboard at risk
      favors:
      - O1
      why: a second reason to leave
    - id: watch2
      what: a captured crew member could be exploited for what he knows
      favors:
      - O2
      why: a reason to recover him; its weight depends on what he knows
  lesson: A crew member may be left behind only when waiting all but guarantees a loss that reaches beyond the unit and can
    be prevented no other way. A likely loss, however large, is not enough.
  limits: 'It does not say where "almost certain" begins in numbers; the watch''s own words carry that. Nor does it transfer
    authority: a commander made this call, and an agent does not inherit it by analogy.'
