case:
  id: DR-CORPUS-NX-8ee2e64a-E1@v1
  title: Warnings and Force Alert
  status: draft
  setting: The Netherlands, early May 1940, Dutch military leadership
  decider: The Dutch military leadership
  agent: The Dutch military leadership
  agent_role: decide
  situation: Dutch authorities had received repeated warnings of German attack plans, including plans that were postponed.
    They had a warning one week before the attack date of 10 May 1940. Other evidence indicated that an attack was probably
    imminent. The warning source was assessed as exceptionally well placed. Belgian authorities had placed their forces on
    a general alert.
  question: What should the Dutch military leadership do about placing its forces on alert after repeated warnings of an imminent
    German attack?
  options:
    O1:
      do: The Dutch military leadership should heed the warnings and place its forces on a general alert.
      move: act
      irreversible: false
    O2:
      do: The Dutch military leadership should heed the warnings and place selected forces on a limited alert.
      move: partial
      irreversible: false
    O3:
      do: The Dutch military leadership should request an immediate threat assessment from its military staff before setting
        a general alert.
      move: ask
      irreversible: false
      to: its military staff
    O4:
      do: The Dutch military leadership should ignore the warnings and leave its forces off general alert.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: The Dutch had been correctly informed of nearly every German plan to attack them, from the initially selected date
      of 12 November 1939 through 10 May 1940.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The German attack plans were repeatedly postponed.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The warning source was characterized as one of the best-placed intelligence sources of modern times.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The Dutch received one week's warning of the attack date of 10 May 1940.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Other evidence indicated that the German attack was probably imminent.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Belgian authorities placed their forces on a general alert.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The Dutch had repeatedly been correctly informed, and received a week's warning of the attack date from a source
      assessed as exceptionally well placed. They nevertheless ignored the warnings.
  - id: C2
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O4
    weight: weak
    why: Repeated postponements help explain why earlier warnings could lose force and encourage reluctance to alert. But
      the passage's lesson is that prior warnings and postponements do not make a current warning safe to ignore.
  - id: C3
    facts:
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Other evidence indicated that an attack was probably imminent, making timely action important rather than treating
      the warning as another distant or speculative plan.
  - id: C4
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Belgian authorities heeded numerous warnings and placed their forces on general alert, showing that an alert
      was a live response to the warnings; the passage contrasts this with the Dutch failure to act.
  reasoning:
    read: The Dutch faced repeated warnings of plans that had been postponed, but this time they had a week's warning of the
      10 May date and other evidence that an attack was probably imminent. The trap is allowing previous postponements to
      turn even a well-placed source and current warning evidence into a reason for inaction.
    weighing: The history of postponements helps explain reluctance, but the current warning and evidence of likely imminence
      outweigh that pull. The passage's governing lesson is that more facts and even first-rate sources do not necessarily
      produce more warning, and warnings are useless unless action is taken; the Dutch should therefore have placed their
      forces on general alert. The balance depends on the warnings and evidence indicating an imminent attack, not on source
      quality alone.
    tradecraft: Make the alert decision promptly, identify the warning and imminence evidence supporting it, and record the
      decision and its rationale so the action taken can be assessed against the information available at the time.
    uncertainty: An attack was assessed as probably imminent, not certain, and the history of postponements created a genuine
      reason for caution. The passage nevertheless judges that the available warning and other evidence called for action.
    handoff: The Dutch military leadership should decide on the alert; the passage identifies no need to defer the decision
      to another authority.
    tempting_wrong:
      option: O4
      pull: Earlier attack plans had been postponed, making another warning seem like a false alarm.
      why_wrong: That history does not outweigh the one-week warning and other evidence of likely imminence; the passage specifically
        treats failure to act on warnings as the mistake.
    rejected:
      O2: 'A limited alert would not match the passage''s endorsed response: the Dutch should have placed their forces on
        general alert.'
      O3: Deferring for another assessment would delay action despite a week's warning and other evidence that an attack was
        probably imminent.
      O4: Ignoring the warnings and leaving forces off general alert repeats the failure the passage identifies.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible, current information established that the attack had been postponed beyond the period of concern and no
        other evidence indicated an imminent attack.
      then: O3
      why: Without evidence of current imminence, seeking an immediate assessment before setting a general alert could be
        the more proportionate response.
    would_not_change:
    - id: noflip1
      if: Earlier attack plans had been postponed or previous warnings had not led to an attack.
      why: That history alone would not change the decision where a current warning and other evidence indicate likely imminence;
        the passage's example shows the danger of allowing warnings to go unheeded.
    watch_for:
    - id: watch1
      what: Whether current evidence continues to support the assessment that an attack is probably imminent.
      favors:
      - O1
      - O3
      why: Evidence of continuing imminence supports acting on the warnings; evidence that materially weakens that assessment
        could support obtaining an immediate reassessment.
  lesson: Repeated postponements can make warnings easier to dismiss, but they do not erase the significance of a current
    warning supported by other evidence of likely imminence. Intelligence warnings matter only if decision-makers take timely
    action on them.
  limits: This conclusion concerns the described record, including a week's warning and other evidence of likely imminence.
    It does not establish that every warning warrants a general alert regardless of its credibility, timing, or contrary evidence.
  library:
    domain: intel-analysis
    family: CORPUS-NX-8ee2e64a
    source: https://www.cia.gov/resources/csi/static/f8fac805d906f98767118fa4cda4e33d/Strategic-Warning.pdf
    episode_focus: The decision point is whether to alert forces after receiving repeated warnings, including a warning a
      week before the attack and other evidence it was imminent. The passage attributes reluctance in large part to the accumulation
      of earlier warnings that had not materialized; exclude the intelligence source’s collection methods.
    cues:
      option_words:
        O2: 16
        O3: 19
        O1: 16
        O4: 15
      real_option: O1
      real_to_mean_other_length: 0.96
      real_is_longest: false
      moves:
        O2: partial
        O3: ask
        O1: act
        O4: act
      real_move: act
      irreversible_flags:
        O2: false
        O3: false
        O1: false
        O4: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The passage's assessment is that the Dutch ignored warnings and failed even to alert their forces despite a week's
  warning and other evidence that the attack was probably imminent; it concludes that intelligence warnings are useless unless
  action is taken.
