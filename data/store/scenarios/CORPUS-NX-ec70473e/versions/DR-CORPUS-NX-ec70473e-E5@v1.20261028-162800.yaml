case:
  id: DR-CORPUS-NX-ec70473e-E5@v1
  title: American Support for the Thai Resistance
  status: draft
  setting: Bangkok and Washington, 1945; the Department of State
  decider: The Department of State
  agent: The Department of State
  agent_role: decide
  situation: Thai opposition leaders had ousted the dictatorship that declared war on the Allies, and contact with the Thai
    underground had increased. The underground was led by the de facto head of state, provided information about Japanese
    forces, and offered to resist them. It sought outside assistance that OSS and SOE could provide. Thai underground leaders,
    Free Thai members, and OSS observers suspected that Britain had imperial designs on Thailand. OSS officers believed support
    for a Thai resistance force could oppose Japanese power and bolster Thailand’s postwar independence. The OSS officers
    had promised American help, a commitment that amounted to a change in U.S. policy.
  question: What should the Department of State do about the OSS officers’ commitment to American support for the Thai resistance
    movement?
  options:
    O1:
      do: The Department of State approve the OSS officers’ commitment to American support for the Thai resistance movement.
      move: act
      irreversible: false
    O2:
      do: The Department of State reject the OSS officers’ commitment to American support for the Thai resistance movement.
      move: act
      irreversible: false
    O3:
      do: The Department of State hold its position on the OSS officers’ commitment to American support for the Thai resistance
        movement.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In late 1944, moderate opposition leaders in Bangkok ousted the dictatorship that had declared war on the Allies.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: Thai students and British SOE personnel had contact with underground leaders, and reporting from the movement increased.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Thai underground was led by the de facto head of state.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The underground provided information about Japanese forces and offered to resist them.
  - id: F5
    kind: capability
    status: confirmed
    fact: The underground needed outside assistance that OSS and SOE could provide.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Thai underground leaders, Free Thai members, and OSS observers suspected that Britain had imperial designs on Thailand.
  - id: F7
    kind: intelligence
    status: assessed
    fact: OSS officers believed support for a Thai resistance force could oppose Japanese power and bolster Thailand’s postwar
      independence.
  - id: F8
    kind: situation
    status: confirmed
    fact: OSS officers had promised American help for the Thai resistance movement.
  - id: F9
    kind: authority
    status: confirmed
    fact: The promised American help amounted to a change in U.S. policy.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The underground supplied information about Japanese forces and offered to resist them, while needing outside assistance.
      Supporting the commitment could help oppose Japanese power.
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: OSS officers believed that support could bolster Thailand’s postwar independence amid suspicions of British imperial
      aims. The concern about Britain was an assessment, not a confirmed fact.
  - id: C3
    facts:
    - F8
    - F9
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The officers had already promised help, and that promise changed U.S. policy. The Department of State retroactively
      endorsed the commitment, making approval the recorded departmental outcome.
  reasoning:
    read: This was a policy decision about whether to stand behind a commitment to support a Thai resistance movement, not
      a decision about how to train or employ guerrillas. The central tension was between opposing Japanese power and supporting
      Thailand’s postwar independence, while the concern about British aims remained an assessment rather than an established
      fact.
    weighing: The offer to resist Japanese forces and the underground’s information supported approval {C1}. The prospect
      of bolstering Thai independence added a further, but less certain, reason {C2}. The commitment changed U.S. policy,
      and the Department of State endorsed it retroactively {C3}. On that balance, approval is the endorsed judgment; the
      independence rationale depends on the assessed concern about British aims, while the anti-Japanese rationale stands
      independently.
    tradecraft: Make the Department’s policy decision explicit and record the commitment, the policy change it entails, the
      anti-Japanese and independence rationales, and which concerns were assessments rather than confirmed facts. Keep the
      decision record at the policy level, separate from operational conduct.
    uncertainty: The concern that Britain had imperial designs was suspected, and the belief that support would bolster Thai
      independence was the OSS officers’ assessment. The source gives no further basis for assessing either claim.
    handoff: The Department of State should own the policy judgment because the promise amounted to a change in U.S. policy;
      no additional decision-maker is identified.
    tempting_wrong:
      option: O2
      pull: Rejecting the promise could avoid endorsing a policy change made by OSS officers.
      why_wrong: 'The Department of State did not leave the commitment unendorsed: it retroactively approved it, with the
        stated aims of opposing Japanese power and supporting Thailand’s independence.'
    rejected:
      O2: Rejection was not chosen because the Department of State retroactively endorsed the commitment and the source’s
        stated considerations supported assisting resistance to Japanese power and bolstering Thai independence.
      O3: Holding the position was not chosen because the Department of State ultimately endorsed the commitment rather than
        leaving the policy change unresolved.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Department of State had credible grounds to conclude that the underground could not provide useful resistance
        to Japanese power.
      then: O2
      why: That would remove the principal stated operational rationale for supporting the commitment, making rejection more
        supportable.
    would_not_change:
    - id: noflip1
      if: The concern about British imperial aims were absent, but the underground’s information and offer to resist Japanese
        forces remained.
      why: The anti-Japanese rationale would still support approval even without the additional independence rationale.
    watch_for: []
  lesson: When an operational commitment changes national policy, the responsible department should expressly decide whether
    to own that change. Weigh the direct mission purpose separately from broader political aims, and distinguish assessed
    concerns from confirmed facts.
  limits: This reasoning concerns the Department of State’s endorsement of a particular commitment in the wartime Thai context.
    It does not establish a general rule for supporting resistance movements or address the legality or conduct of guerrilla
    operations.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-ec70473e
    source: https://www.cia.gov/resources/csi/static/7851e16f9e100b6f9cc4ef002028ce2f/Office-of-Strategic-Services.pdf
    episode_focus: The decision was whether to support the Thai resistance movement or withhold a commitment; Washington later
      endorsed the officers’ promise retroactively. The stated considerations included resistance to Japanese power and the
      possibility that a Thai force could bolster the country’s postwar independence amid concern about British imperial aims;
      exclude the training and operational conduct of guerrillas.
