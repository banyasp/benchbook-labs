case:
  id: DR-CORPUS-NX-25c25695-E2@v1
  title: School Yard Strike Request
  status: draft
  setting: A school yard during a military operation under rules of engagement; the time is not specified.
  decider: The senior commander
  agent: The senior commander
  agent_role: decide
  situation: A subordinate wants to make one more attempt and requests an air strike on enemy forces in a school yard. The
    subordinate presents those forces as being in the school yard. The senior commander urges the subordinate to leave and
    return home, and says to set aside the school yard request. The subordinate says they will consult the Colonel. The rules
    of engagement bar an air strike anywhere near a structure.
  question: What should the senior commander do about the subordinate's request for an air strike in the school yard and the
    pending consultation with the Colonel?
  options:
    O1:
      do: The senior commander prohibits the requested strike and directs the subordinate to withdraw.
      move: act
      irreversible: false
    O2:
      do: The senior commander refers the request to the Colonel and directs the subordinate to wait.
      move: ask
      irreversible: false
      to: the Colonel
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The subordinate wanted to make one more attempt.
  - id: F2
    kind: situation
    status: confirmed
    fact: The subordinate requested an air strike on forces in the school yard.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The subordinate represented the forces in the school yard as enemy forces.
  - id: F4
    kind: situation
    status: confirmed
    fact: The senior commander urged the subordinate to leave and return home.
  - id: F5
    kind: situation
    status: confirmed
    fact: The senior commander told the subordinate to set aside the school yard request.
  - id: F6
    kind: situation
    status: confirmed
    fact: The subordinate said they would consult the Colonel.
  - id: F7
    kind: authority
    status: confirmed
    fact: The rules of engagement prohibited an air strike anywhere near a structure.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The rules of engagement prohibited an air strike anywhere near a structure, and the request was for a strike in a
      school yard. The senior commander could not approve the requested strike contrary to that constraint.
  - id: C2
    facts:
    - F4
    - F5
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The senior commander expressly told the subordinate to set aside the school-yard request and leave. Prohibiting the
      strike and directing withdrawal follows that stated decision.
  - id: C3
    facts:
    - F1
    - F4
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The subordinate wanted to make one more attempt, but the senior commander urged them to come out and return home
      rather than continue. The source does not give a specific safety assessment for that withdrawal direction; own-force
      safety is the closest available equity.
  reasoning:
    read: The request was for an air strike on forces the subordinate represented as enemy forces in a school yard. The trap
      is treating that representation, or the prospect of consulting the Colonel, as enough to overcome the stated rules-of-engagement
      prohibition; the senior commander said to set aside the request and return home.
    weighing: 'The governing constraint is decisive: the rules barred strikes anywhere near a structure, and the senior commander
      stated there would be no strike on the school yard. The senior commander''s separate direction to leave supports O1
      over keeping the request pending. The subordinate''s wish to make one more attempt and stated intention to consult the
      Colonel do not displace either reason.'
    tradecraft: State that the requested strike is prohibited under the applicable rules of engagement and direct the subordinate
      to withdraw. Do not leave the request pending for consultation as though it could authorize a strike barred by those
      rules; document the decision and its stated basis. This implementation advice is my synthesis.
    uncertainty: The source does not describe the Colonel's authority, the details of any consultation, or an independent
      verification of the subordinate's characterization of the forces. Those unknowns do not alter the stated prohibition
      or the senior commander's direction in this scenario.
    handoff: The senior commander should decide and direct withdrawal rather than refer the request for a decision before
      acting. The subordinate may consult the Colonel, but that pending consultation does not suspend the stated rules-of-engagement
      constraint or the senior commander's direction. This handoff framing is my synthesis.
    tempting_wrong:
      option: O2
      pull: The subordinate said they would consult the Colonel, which can make referral and waiting seem like a prudent way
        to resolve the request.
      why_wrong: The source's stated rule already barred the strike, and the senior commander expressly said to set aside
        the request and come home; waiting would not make the prohibited strike permissible.
    rejected:
      O2: The senior commander did not leave the request pending for the Colonel; the stated rules barred the strike and the
        senior commander directed the subordinate to withdraw.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The applicable rules of engagement were authoritatively changed or clarified so that this requested strike was not
        prohibited.
      then: O2
      why: The stated categorical constraint would no longer decide the request; referral to the Colonel while awaiting a
        decision could then be appropriate.
    would_not_change:
    - id: noflip1
      if: The subordinate consults the Colonel while the stated prohibition on strikes near structures remains in force.
      why: Consultation alone does not remove the rules-of-engagement bar or reverse the senior commander's direction to set
        aside the request.
    watch_for: []
  lesson: A claimed military objective does not displace an applicable rules-of-engagement prohibition. When the senior commander
    has also directed withdrawal, do not keep a prohibited request open merely because a subordinate plans to consult another
    officer.
  limits: This reasoning applies to the stated rules-of-engagement bar and the senior commander's withdrawal direction. It
    does not resolve a different situation in which the governing rule, facts, or authorized decision-maker's direction has
    changed.
