case:
  id: DR-CORPUS-NX-263d6b07-E1@v1
  title: Command Post in a Family Home
  status: draft
  setting: Marja, Afghanistan, 2010; military operation
  decider: The Marines determining the command-post location
  agent: The Marines determining the command-post location
  agent_role: decide
  situation: In 2010, Marines were conducting a large-scale heliborne assault on Marja, Afghanistan. A Marine lieutenant led
    a rifle platoon, and Marines from several platoons occupied homes on the city's western approach on the first night. One
    of the homes was predesignated as a command post for the coming sweep of the city. A family lived in that home. The decision
    is whether to use that home and move the family to another home farther from the coming fight, or establish the command
    post elsewhere and leave the family in place.
  question: What should the Marines determining the command-post location do about the predesignated home and the family living
    there?
  options:
    O1:
      do: The Marines move the family to another home farther from the coming fight and use the designated home as the command
        post.
      move: act
      irreversible: false
    O2:
      do: The Marines leave the family in the designated home and establish the command post in another home on the western
        approach.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Marines were conducting a large-scale heliborne assault on Marja, Afghanistan.
  - id: F2
    kind: situation
    status: confirmed
    fact: The assault took place in 2010.
  - id: F3
    kind: situation
    status: confirmed
    fact: A Marine lieutenant led a rifle platoon.
  - id: F4
    kind: situation
    status: confirmed
    fact: On the first night, Marines from the platoon and other platoons occupied several homes on the western approach to
      the city.
  - id: F5
    kind: situation
    status: confirmed
    fact: One of the homes was predesignated as a command post for the coming sweep of the city.
  - id: F6
    kind: situation
    status: confirmed
    fact: A family lived in the home predesignated as the command post.
  considerations:
  - id: C1
    facts:
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: The family lived in the home, and the recorded course moved them farther from the coming fight. The excerpt does
      not state this as the Marines’ rationale.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The home had already been designated as the command post for the coming sweep. The excerpt does not explain why that
      designation mattered to the decision or whether another location was considered.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The recorded course used the designated home while moving the family elsewhere. This describes the disposition of
      the family but does not establish what alternatives or protections were assessed.
  reasoning:
    read: The decision is whether to use a home already designated for the command post while relocating the family who lived
      there, or to leave the family in place and use another home. The excerpt records the first course but ends before providing
      the Marines’ rationale; the trap is treating the later artillery strike as evidence about the earlier location decision.
    weighing: The available facts show a predesignation and a move to a home farther from the coming fight, which weakly favors
      O1 on mission continuity and civilian safety. They do not establish the risks of either location, the feasibility of
      alternatives, or the decision-makers’ stated reasons, so the balance cannot be reconstructed confidently.
    tradecraft: Before acting, establish what alternatives are actually available and assess the risks to the family and the
      mission at each location. Record the information considered, the reasons for the chosen location, and any arrangements
      made for the family; these are prudent decision practices, not practices stated in the excerpt.
    uncertainty: The supplied passage is incomplete and stops before the account gives its reasoning. It does not identify
      the authority or process for selecting the command-post location, describe the alternative home, or provide a legal
      assessment.
    handoff: The excerpt does not say whether anyone else was consulted or who held approval authority. As a decision practice,
      involve the responsible operational and civilian-protection authorities if the location choice or relocation presents
      material unresolved risks.
    tempting_wrong:
      option: O2
      pull: Leaving the family in its home avoids moving them.
      why_wrong: The recorded course instead moved the family farther from the coming fight and used the predesignated home;
        however, the excerpt does not explain why O2 was rejected.
    rejected:
      O2: The Marines took O1, but the supplied excerpt does not give their reasons for not choosing O2.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A suitable alternative command-post location were available and using it would avoid relocating the family without
        creating greater risks to civilians or the mission.
      then: O2
      why: That would remove the apparent operational reason to use the designated home while avoiding the disruption of moving
        the family.
    would_not_change:
    - id: noflip1
      if: The home’s prior designation were the only information offered in support of using it.
      why: Designation alone would not establish that using the home and relocating the family was preferable to an available
        alternative.
    watch_for:
    - id: watch1
      what: Whether the family’s proposed relocation would actually place them farther from the coming fight and whether another
        workable command-post location existed.
      favors:
      - O1
      - O2
      why: Those facts could materially affect the civilian-safety and mission considerations, but the excerpt does not provide
        them.
  lesson: A predesignated location and a move away from anticipated danger are relevant, but they do not by themselves establish
    why a decision was made or that it was best. When the reasoning is unavailable, distinguish the recorded action from an
    endorsed rationale and identify what facts would change the balance.
  limits: This reconstruction is limited to the command-post location decision and the incomplete passage provided. It does
    not assess the later artillery strike or establish any legal standard, authority, or decision process.
