case:
  id: DR-CORPUS-NX-476e2d48-E2@v1
  title: Delegating Military Cyber Authorities
  status: draft
  setting: United States, 2018, the President and Department of Defense
  decider: The President
  agent: The President
  agent_role: decide
  situation: In 2018, U.S. policy was focused on enhancing military cyber operational capabilities, and Cyber Command had
    been elevated to a Unified Combatant Command in May. The President faced a policy choice about who should hold key authorities
    for time-sensitive military operations in cyberspace. The operating concept was persistent engagement, described as requiring
    day-to-day contact in cyberspace with competitors. Defending forward was a key pillar of that concept. The policy approach
    required substantial intelligence support from the U.S. intelligence community and foreign partners. The question was
    how to allocate decision authority while supporting this policy framework.
  question: What should the President do about delegating key authorities to the Secretary of Defense for time-sensitive military
    operations in cyberspace?
  options:
    O1:
      do: The President defers a decision on delegating key authorities to the Secretary of Defense for time-sensitive military
        operations in cyberspace.
      move: hold
      irreversible: false
    O2:
      do: The President declines delegation of key authorities to the Secretary of Defense for time-sensitive military operations
        in cyberspace.
      move: act
      irreversible: false
    O3:
      do: The President authorizes delegation of key authorities to the Secretary of Defense for time-sensitive military operations
        in cyberspace.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The President's cyber policy largely focused on enhancing military cyber operational capabilities.
  - id: F2
    kind: capability
    status: confirmed
    fact: In May 2018, the President ordered Cyber Command's elevation to a Unified Combatant Command.
  - id: F3
    kind: authority
    status: confirmed
    fact: The policy question concerned authority for time-sensitive military operations in cyberspace.
  - id: F4
    kind: situation
    status: confirmed
    fact: Persistent engagement recognized that cyber forces must maintain day-to-day contact in cyberspace with competitors.
  - id: F5
    kind: situation
    status: confirmed
    fact: Defending forward was a key pillar of persistent engagement.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The policy approach required more intelligence to inform operations.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The intelligence needed to inform operations included intelligence from the U.S. intelligence community and foreign
      partners.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: tempo
    favors:
    - O3
    weight: strong
    why: Persistent engagement requires day-to-day contact in cyberspace, while the authority at issue is for time-sensitive
      operations. Delegating key authorities to the Secretary of Defense supports that operational tempo.
  - id: C2
    facts:
    - F1
    - F2
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The policy focus was enhancing military cyber capabilities, and Cyber Command had been elevated to a Unified Combatant
      Command. Delegation enabled Cyber Command to carry out persistent engagement.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Defending forward was a pillar of the policy approach, which required substantial intelligence support from U.S.
      and foreign partners. This supports the operational framework in which the delegation was made, though intelligence
      needs are not stated as a separate test for granting authority.
  reasoning:
    read: The decision is about allocating authority for time-sensitive cyber operations, not deciding how any operation should
      be conducted. The policy framework called for persistent, day-to-day engagement; the trap is to treat the need for extensive
      intelligence support as, by itself, a reason to withhold or delay the delegation.
    weighing: Delegation supports persistent engagement and its day-to-day tempo {C1}, within a broader effort to enhance
      military cyber capabilities {C2}. Defending forward and the intelligence needed to inform operations form part of that
      framework {C3}, not a stated reason to reject delegation. The balance depends on the continuing need for time-sensitive
      authority and persistent engagement.
    tradecraft: State the authority being delegated and its intended policy purpose clearly, and preserve a record of the
      decision and its rationale. Keep the decision focused on authority and policy rather than operational methods.
    uncertainty: The rationale connects delegation with persistent engagement but does not compare delegation with alternatives
      or establish a formal test for when the Secretary of Defense should exercise the authority. It identifies intelligence
      needs without specifying how they affect particular decisions.
    handoff: The decision belongs to the President, who holds the authority to delegate; the Secretary of Defense is the recipient
      of key authorities, and Cyber Command is the command enabled by the policy. Intelligence partners are relevant to informing
      operations, but they are not assigned a role in deciding the delegation.
    tempting_wrong:
      option: O1
      pull: The extensive intelligence support, including support from foreign partners, may make deferral seem prudent.
      why_wrong: That support is necessary to inform operations, not a reason to postpone delegation; delay would not fit
        the stated need for time-sensitive authority and day-to-day engagement.
    rejected:
      O1: Deferral was not chosen because the policy framework emphasized time-sensitive operations and persistent day-to-day
        engagement.
      O2: Declining delegation was not chosen because delegation enables Cyber Command to carry out persistent engagement.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The policy no longer required persistent day-to-day engagement or time-sensitive cyber authority.
      then: O2
      why: Without the operational need connected to delegation, the stated rationale for shifting authority would be substantially
        weakened.
    - id: flip2
      if: The President lacked authority to delegate the relevant decision authority to the Secretary of Defense.
      then: O2
      why: Delegation should not be authorized without a lawful basis for the transfer of authority.
    would_not_change:
    - id: noflip1
      if: The policy continued to require more intelligence from U.S. agencies and foreign partners.
      why: Intelligence informs operations but does not independently reverse the delegation decision.
    watch_for:
    - id: watch1
      what: Whether the policy continues to depend on time-sensitive operations and day-to-day engagement.
      favors:
      - O1
      - O2
      why: If that operational premise weakens, the rationale for delegating key authorities correspondingly weakens.
  lesson: Allocate decision authority in a way that fits the operational tempo and policy purpose the authority is meant to
    support. Treat intelligence needs as part of the decision context, but do not convert them into a veto unless the governing
    policy or authority makes them one.
  limits: This reasoning addresses the authority shift for time-sensitive cyber operations, not the legality or merits of
    any particular operation. It does not establish a general rule that time-sensitive operations should always be delegated
    or specify conditions on the Secretary of Defense's use of delegated authority.
