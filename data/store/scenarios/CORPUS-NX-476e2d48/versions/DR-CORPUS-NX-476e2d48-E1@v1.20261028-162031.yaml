case:
  id: DR-CORPUS-NX-476e2d48-E1@v1
  title: Choosing a Comprehensive Federal Cybersecurity Approach
  status: draft
  setting: White House, September 20, 2007, presidential briefing
  decider: The President
  agent: The President
  agent_role: decide
  situation: At the White House on September 20, 2007, the President and Cabinet members received a briefing from the NCSG.
    The briefing described extensive cyber compromises affecting companies and suppliers in the defense industrial base, presidential
    campaign staff, sensitive government networks, and financial services. Federal agencies had identified shortfalls in cyber
    personnel, counterintelligence capabilities, and infrastructure modernization, while the CIA cyber program needed baseline
    funding. The NCSG presented options for integrating and coordinating federal cyber capabilities and using resources more
    effectively. The President faced a choice about whether to adopt a comprehensive approach to those policy and resource
    issues.
  question: What should the President do about the proposed comprehensive approach to coordinating and resourcing federal
    cyber capabilities?
  options:
    O1:
      do: The President approves the comprehensive approach to coordinating and resourcing federal cyber capabilities.
      move: act
      irreversible: false
    O2:
      do: The President rejects the comprehensive approach to coordinating and resourcing federal cyber capabilities.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Known cyber compromises affected more than 200 companies and suppliers in the defense industrial base, as well as
      presidential campaign staff, sensitive government networks, and financial services.
  - id: F2
    kind: situation
    status: confirmed
    fact: The NCSG recommended substantial new funding and sought to raise awareness among the intelligence community and
      key consumers.
  - id: F3
    kind: capability
    status: confirmed
    fact: The FBI had a significant shortfall in cyber agents, and counterintelligence personnel and capabilities were also
      short.
  - id: F4
    kind: capability
    status: confirmed
    fact: The broader signals intelligence enterprise had an infrastructure and modernization gap.
  - id: F5
    kind: capability
    status: confirmed
    fact: The CIA cyber program had been funded entirely through counterterrorism supplemental funding after 9/11 and needed
      to move into baseline funding.
  - id: F6
    kind: situation
    status: confirmed
    fact: The administration's budget request addressed the identified personnel, capability, and infrastructure shortfalls.
  - id: F7
    kind: authority
    status: confirmed
    fact: On September 20, 2007, the President received options at the White House concerning federal cyber capabilities,
      coordination, deconfliction, and resource use.
  - id: F8
    kind: situation
    status: confirmed
    fact: The NCSG presented options addressing how to integrate federal capabilities, optimize and coordinate activities,
      and use resources to maximize performance.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The scale and breadth of known compromises supported the NCSG’s call for a comprehensive response and greater awareness
      among key consumers.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Shortfalls in personnel, counterintelligence capabilities, and infrastructure, together with the need to move the
      CIA cyber program into baseline funding, gave the approach concrete capability and continuity problems to address.
  - id: C3
    facts:
    - F7
    - F8
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The options addressed integrating federal capabilities, coordinating and deconflicting activities, and using resources
      to maximize performance.
  - id: C4
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The administration’s budget request addressed the identified shortfalls, linking the comprehensive approach to a
      resource plan rather than coordination alone.
  reasoning:
    read: 'This was a broad national cybersecurity policy and resourcing decision: extensive compromises coincided with identified
      federal capability and funding gaps. The trap is to treat those as isolated agency problems rather than consider the
      proposed integrated approach to coordination and resources.'
    weighing: The breadth of the compromises and the specific shortfalls favored a comprehensive response. The NCSG’s options
      aimed to integrate capabilities, coordinate and deconflict activity, and maximize performance through resource use;
      the budget request addressed the identified gaps. On those stated reasons, the President concurred with the recommendations.
      The balance depends on the scale of the reported compromises, the identified capability needs, and whether the proposed
      resource approach addresses them.
    tradecraft: Record the decision, the options considered, and the connection between the identified gaps and the proposed
      coordination and budget approach. Keep the rationale at the policy and resource level, without including operational
      cyber details.
    uncertainty: The available account does not compare the options in detail or describe the costs, risks, or implementation
      conditions of each alternative.
    handoff: The President makes the decision, with Cabinet members informed and the NCSG presenting the cross-agency options;
      the issues span federal coordination and resourcing.
    tempting_wrong:
      option: O2
      pull: Rejecting the approach could avoid committing to a substantial new funding request.
      why_wrong: That would leave the described compromises and personnel, capability, infrastructure, and funding shortfalls
        without the comprehensive coordination and resourcing response the President was advised to pursue.
    rejected:
      O2: The President did not reject the comprehensive approach, because the stated compromise picture and capability shortfalls
        supported coordinated action and the budget request addressed those gaps.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that the reported compromises were no longer extensive and the identified capability and
        funding shortfalls had been resolved.
      then: O2
      why: The principal stated reasons for adopting a comprehensive approach would be substantially weakened.
    would_not_change:
    - id: noflip1
      if: The proposal required substantial new funding.
      why: The source records that substantial new funding was recommended and that the President nevertheless concurred;
        funding scale alone would not reverse the stated rationale.
    watch_for:
    - id: watch1
      what: Whether the budget request continues to address the identified personnel, capability, infrastructure, and baseline-funding
        needs.
      favors:
      - O1
      why: The identified shortfalls are reasons for the comprehensive approach, and the budget request addressed them.
  lesson: When a serious threat spans agencies and coincides with documented capability gaps, assess coordination and resourcing
    as connected policy problems. A comprehensive response is supported when it addresses those gaps and improves the use
    of resources.
  limits: This reasoning applies to the described 2007 policy choice, based on the compromises, shortfalls, and options presented
    then. It does not establish that every later cybersecurity proposal, funding level, or operational activity should be
    approved.
