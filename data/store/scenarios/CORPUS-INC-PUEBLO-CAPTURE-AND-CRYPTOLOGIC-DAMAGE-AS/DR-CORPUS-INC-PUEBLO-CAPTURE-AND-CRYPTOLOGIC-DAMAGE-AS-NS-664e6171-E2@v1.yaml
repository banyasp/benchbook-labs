case:
  id: DR-CORPUS-INC-PUEBLO-CAPTURE-AND-CRYPTOLOGIC-DAMAGE-AS-NS-664e6171-E2@v1
  title: Response to Compromised January Keying Material
  status: draft
  setting: Military communications among system holders, January 1968, including aboard USS PUEBLO.
  decider: The military authority directing the system holders
  agent: The military authority directing the system holders
  agent_role: decide
  situation: In January 1968, keying material for several major military communications systems was compromised. Five lesser-significance
    cryptographic items were also compromised. Traffic passed through the affected systems from 1 through 24 January was exposed
    to compromise. Operational Intelligence Broadcast traffic from 5 through 23 January was aboard USS PUEBLO and was presumed
    captured; the loss of its keying material was assessed as incidental. Replacement materials for holders of the lesser
    systems had yet to be provided.
  question: What should the military authority directing the system holders do about holders' use of compromised materials
    while replacement materials are pending?
  options:
    O1:
      do: The directing authority permits holders of major and lesser systems to continue normal use while replacement materials
        are pending.
      move: act
      irreversible: false
    O2:
      do: The directing authority prohibits holders of major systems from using them and limits holders of lesser systems
        to minimized use pending replacement.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: January 1968 keying material for several major military communications systems was compromised.
  - id: F2
    kind: situation
    status: confirmed
    fact: Five lesser-significance cryptographic items were also compromised.
  - id: F3
    kind: situation
    status: confirmed
    fact: Traffic passed through the affected systems from 1 through 24 January 1968 was exposed to compromise.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Operational Intelligence Broadcast traffic from 5 through 23 January 1968 was aboard USS PUEBLO and was presumed
      captured.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The loss of the keying material for the Operational Intelligence Broadcast was assessed as incidental because the
      traffic was presumed captured.
  - id: F6
    kind: situation
    status: confirmed
    fact: Replacement materials for holders of the lesser systems had yet to be provided.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The January material was compromised, and traffic passed through affected systems during the relevant period was
      exposed. Continuing normal use would leave holders using compromised material.
  - id: C2
    facts:
    - F4
    - F5
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: For the Operational Intelligence Broadcast, the keying-material loss was assessed as incidental because the relevant
      traffic was presumed captured. That limits the additional exposure attributable to the key loss, but does not negate
      the order to discontinue the system.
  - id: C3
    facts:
    - F2
    - F6
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The lesser items were identified as less significant, and their replacement materials were not yet available. The
      authority chose minimized use until replacement rather than either normal use or an immediate full stop.
  reasoning:
    read: 'The decision distinguishes the immediate response to major systems from the interim response to lesser systems.
      The central trap is treating exposure of past traffic as the only issue: the directives also addressed holders'' use
      of compromised material while replacements were pending.'
    weighing: The compromise and exposure of traffic support restricting use. The broadcast traffic already presumed captured
      makes that particular key loss incidental, but the authority still ordered major systems discontinued. For the lesser
      items, their lower significance supports minimizing rather than fully stopping use until replacement.
    tradecraft: Communicate the different directions clearly to holders, identify which direction applies to each system,
      and keep minimized use in place until replacement materials are provided.
    uncertainty: The source identifies the actions taken and the exposure assessment, but does not explain the criteria used
      to distinguish the systems or specify exceptions to the directions.
    handoff: The directing military authority issued the directions. The source identifies no separate approval or review
      role, so no additional handoff is supported.
    tempting_wrong:
      option: O1
      pull: Replacement materials were still pending, and the source assessed the broadcast keying-material loss as incidental.
      why_wrong: That assessment was limited to the broadcast traffic already presumed captured; it did not justify normal
        use of compromised materials, and the authority ordered major systems discontinued and lesser-system use minimized.
    rejected:
      O1: Normal use was not chosen because the authority restricted use of compromised materials while replacements were
        pending.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the January materials had not in fact been compromised.
      then: O1
      why: Without the compromise that underlies the restrictions, the stated reason to prohibit or minimize use would be
        absent.
    would_not_change:
    - id: noflip1
      if: The broadcast traffic remained presumed captured and its keying-material loss remained assessed as incidental.
      why: That circumstance concerns the incremental significance of that loss; the authority's direction still included
        discontinuing use of the major systems.
    watch_for:
    - id: watch1
      what: Whether replacement materials have been provided to holders of the lesser systems.
      favors:
      - O1
      why: The minimized-use direction was expressly pending replacement; receipt of replacement material changes the basis
        for that interim restriction.
  lesson: When keying material is compromised, address both the exposure of past traffic and the risk of continued use. A
    proportionate response can distinguish systems by significance, while restricting use until replacement material is available.
  limits: This reasoning concerns the specific compromise and directions recorded here. It does not establish a general rule
    for other systems, threat assessments, or authorities.
  library:
    domain: natsec-other
    family: CORPUS-INC-PUEBLO-CAPTURE-AND-CRYPTOLOGIC-DAMAGE-AS
    source: https://www.nsa.gov/portals/75/documents/news-features/declassified-documents/uss-pueblo/damage-assessments/Cryptologic-Cryptographic_Damage_Assessment.pdf
    episode_focus: 'The response followed compromise of January 1968 keying material: holders of specified major systems were
      told to stop using them, while holders of certain lesser systems were told to minimize use until replacement material
      arrived. The assessment identifies the risk that traffic using the compromised material was exposed; exclude the technical
      details of the cryptographic systems.'
