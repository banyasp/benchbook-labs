case:
  id: DR-CORPUS-INC-PUEBLO-CAPTURE-AND-CRYPTOLOGIC-DAMAGE-AS-NS-664e6171-E1@v1
  title: Pre-Departure Communications-Security Inventory
  status: draft
  setting: Japan, January 1968; COMNAVFORJAPAN and USS PUEBLO.
  decider: COMNAVFORJAPAN
  agent: COMNAVFORJAPAN
  agent_role: decide
  situation: The USS PUEBLO was preparing to depart Japan in January 1968. Its prescribed communications-security inventory
    included cryptographic systems, keying materials, and supporting publications. COMNAVFORJAPAN regarded the mission as
    sensitive. It considered some of the materials essential to maintaining secure communications. An emergency could expose
    cryptographic material to compromise. COMNAVFORJAPAN had to determine what inventory would remain aboard for departure.
  question: What should COMNAVFORJAPAN do with the prescribed communications-security inventory before the USS PUEBLO departs
    Japan?
  options:
    O1:
      do: COMNAVFORJAPAN directs offloading the full prescribed communications-security inventory before departure.
      move: act
      irreversible: false
    O2:
      do: COMNAVFORJAPAN directs offloading various cryptographic systems and retaining a limited communications-security
        inventory aboard.
      move: act
      irreversible: false
    O3:
      do: COMNAVFORJAPAN directs retaining the full prescribed communications-security inventory aboard for departure.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The USS PUEBLO was preparing to depart Japan in January 1968.
  - id: F2
    kind: situation
    status: confirmed
    fact: The prescribed inventory included multiple cryptographic systems.
  - id: F3
    kind: situation
    status: confirmed
    fact: The inventory also included keying materials and supporting maintenance and instructional publications.
  - id: F4
    kind: situation
    status: assessed
    fact: COMNAVFORJAPAN regarded the mission as sensitive.
  - id: F5
    kind: situation
    status: assessed
    fact: COMNAVFORJAPAN considered some of the materials essential to maintaining secure communications.
  - id: F6
    kind: situation
    status: assessed
    fact: COMNAVFORJAPAN sought to minimize the amount of cryptographic material exposed to compromise in an emergency.
  considerations:
  - id: C1
    facts:
    - F4
    equity: security_risk
    favors:
    - O2
    - O1
    weight: strong
    why: The mission's assessed sensitivity supported reducing the amount of cryptographic material carried.
  - id: C2
    facts:
    - F6
    equity: source_protection
    favors:
    - O2
    - O1
    weight: strong
    why: COMNAVFORJAPAN sought to minimize the cryptographic material exposed to compromise in an emergency.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: strong
    why: Some materials were considered essential to maintaining secure communications, supporting retention of a limited
      inventory rather than removing everything.
  reasoning:
    read: 'This was an inventory decision balancing secure communications against the sensitive mission''s exposure to compromise
      in an emergency. The trap is treating either concern as absolute: removing everything would disregard materials considered
      essential, while retaining everything would disregard the aim of minimizing exposure.'
    weighing: The mission's sensitivity and the desire to limit material exposed to compromise weigh against carrying the
      full inventory {C1} {C2}. The assessed need for secure communications weighs against removing it all {C3}. COMNAVFORJAPAN
      resolved that tension by offloading various systems and retaining a limited set; the balance depends on which materials
      are essential and how much material should be exposed.
    tradecraft: 'Record the disposition and its rationale: retain only material considered essential for secure communications,
      in light of mission sensitivity and the aim of minimizing emergency exposure to compromise.'
    uncertainty: The stated reasons establish the balancing considerations but do not explain how each individual item was
      assessed or specify a rule for resolving future changes in need or risk.
    handoff: COMNAVFORJAPAN made the decision. No further referral or consultation is identified as part of the stated rationale.
    tempting_wrong:
      option: O3
      pull: Retaining everything could appear to best preserve secure communications.
      why_wrong: It would set aside the stated aim of minimizing the amount of cryptographic material exposed to compromise.
    rejected:
      O1: Offloading the entire inventory was not chosen because some materials were considered essential to maintaining secure
        communications.
      O3: Retaining the entire inventory was not chosen because COMNAVFORJAPAN sought to minimize the amount exposed to compromise
        in an emergency.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: COMNAVFORJAPAN no longer considered any of the prescribed materials essential to maintaining secure communications.
      then: O1
      why: Without the stated reason for retaining any inventory, offloading all of it could better serve the aim of minimizing
        exposure.
    - id: flip2
      if: COMNAVFORJAPAN assessed that the full prescribed inventory was essential to maintaining secure communications.
      then: O3
      why: That assessment would strengthen the communications need that weighs against limiting the inventory.
    would_not_change:
    - id: noflip1
      if: The mission remained sensitive and some materials remained essential, but the inventory included additional supporting
        publications.
      why: The stated decision still turns on balancing essential communications needs against limiting material exposed to
        compromise, not on the mere presence of supporting publications.
    watch_for:
    - id: watch1
      what: A changed assessment of which materials are essential to maintaining secure communications.
      favors:
      - O2
      - O3
      why: A broader essential need could support retaining more, while a narrower need could support a more limited inventory.
  lesson: When sensitive material is both needed for secure communications and vulnerable to compromise, weigh operational
    necessity against the amount exposed. Retain what is considered essential while limiting unnecessary exposure.
  limits: This reasoning applies to the stated pre-departure inventory decision and its stated concerns. It does not establish
    a general inventory rule or resolve decisions involving different communications needs, risks, or authority.
  library:
    domain: natsec-other
    family: CORPUS-INC-PUEBLO-CAPTURE-AND-CRYPTOLOGIC-DAMAGE-AS
    source: https://www.nsa.gov/portals/75/documents/news-features/declassified-documents/uss-pueblo/damage-assessments/Cryptologic-Cryptographic_Damage_Assessment.pdf
    episode_focus: The decision was to remove various systems while retaining a limited set considered essential for secure
      communications. The stated considerations were the sensitivity of the mission and minimizing the amount of cryptographic
      material exposed to compromise; exclude technical details of the systems.
    cues:
      option_words:
        O1: 10
        O2: 13
        O3: 11
      real_option: O2
      real_to_mean_other_length: 1.24
      real_is_longest: true
      moves:
        O1: act
        O2: act
        O3: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
        O3: false
    equities: pilot2
verdict_tier: source-endorsed
basis: COMNAVFORJAPAN directed offloading various cryptographic systems because of the mission's sensitive nature, while retaining
  material it considered essential to secure communications and limiting material exposed to compromise.
