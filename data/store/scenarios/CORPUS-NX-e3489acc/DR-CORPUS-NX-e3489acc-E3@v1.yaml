case:
  id: DR-CORPUS-NX-e3489acc-E3@v1
  title: Balancing Classification and Source Discoverability
  status: draft
  setting: An endnote accompanying a main body; after downgrading or sanitization in an IC context.
  decider: The endnote preparer
  agent: The endnote preparer
  agent_role: decide
  situation: An endnote accompanies a main body with a classification level. The endnote's SRC data elements are subject to
    that classification limit. The directive requires enough information to search for and discover the source in an appropriately
    authorized system. It also identifies the IC-ID as an unclassified, releasable identifier that may serve as the sole SRC
    element after downgrading or sanitization.
  question: What should the endnote preparer include in the endnote when classification constraints apply?
  options:
    O1:
      do: The endnote preparer retains only the IC-ID as its SRC element after downgrading or sanitization.
      move: partial
      irreversible: false
    O2:
      do: The endnote preparer withholds some SRC elements and retains sufficient source-discovery information in the endnote.
      move: act
      irreversible: false
    O3:
      do: The endnote preparer includes all SRC elements and retains sufficient source-discovery information in the endnote.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The endnote must not exceed the classification of the main body.
  - id: F2
    kind: authority
    status: confirmed
    fact: One or more SRC data elements may be omitted from the endnote.
  - id: F3
    kind: authority
    status: confirmed
    fact: Omission is permitted when necessary to keep the endnote within the main body's classification.
  - id: F4
    kind: authority
    status: confirmed
    fact: The endnote must retain sufficient information to search for and discover the source in an appropriately authorized
      system.
  - id: F5
    kind: capability
    status: confirmed
    fact: An IC-ID may meet the requirement for an unambiguous source identifier.
  - id: F6
    kind: capability
    status: confirmed
    fact: After downgrading or sanitization, an IC-ID may remain as the only SRC element because IC-IDs are unclassified and
      releasable.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: classification_integrity
    favors:
    - O2
    - O1
    weight: strong
    why: The endnote must stay within the main body's classification, and the directive permits omitting SRC elements when
      necessary to meet that limit.
  - id: C2
    facts:
    - F4
    equity: classification_integrity
    favors:
    - O2
    - O1
    - O3
    weight: strong
    why: Omission cannot leave the endnote without enough information to search for and discover the source in an appropriately
      authorized system.
  - id: C3
    facts:
    - F5
    - F6
    equity: classification_integrity
    favors:
    - O1
    weight: weak
    why: An IC-ID may meet the unambiguous-identifier requirement and may remain as the sole SRC element after downgrading
      or sanitization because it is unclassified and releasable.
  reasoning:
    read: 'This is a balance between the endnote''s classification ceiling and the need to preserve enough information for
      authorized source discovery. The trap is treating either completeness or minimal disclosure as an absolute: the directive
      permits omission when necessary, but does not dispense with discoverability.'
    weighing: The classification ceiling supports withholding any SRC elements that would cause the endnote to exceed the
      main body's classification {C1}. That discretion is bounded by the requirement to retain sufficient source-discovery
      information {C2}. An IC-ID can be a sufficient unambiguous identifier and can remain alone after downgrading or sanitization,
      but the directive does not require reducing every endnote to that element {C3}. The balance depends on which elements
      are necessary to satisfy both limits.
    tradecraft: Review the SRC elements against the main body's classification, omit elements as needed to stay within that
      limit, and retain enough identifying information for discovery in an appropriately authorized system. Do not treat completeness
      as a reason to exceed the classification ceiling.
    uncertainty: The excerpt does not identify which particular SRC elements must be omitted in a given endnote or specify
      how much information will be sufficient in every case.
    handoff: The endnote preparer can apply the stated rule to the endnote; the excerpt does not require referral to another
      decision-maker.
    tempting_wrong:
      option: O3
      pull: Including all SRC elements may seem to maximize source discoverability.
      why_wrong: Completeness does not override the requirement that the endnote stay within the main body's classification;
        the directive allows omission when necessary.
    rejected:
      O1: An IC-ID may remain as the sole SRC element, but the directive does not make that the general requirement; retain
        whatever information is sufficient for source discovery while meeting the classification limit.
      O3: Including all SRC elements is not appropriate when doing so would cause the endnote to exceed the main body's classification.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: All SRC elements could be included without causing the endnote to exceed the main body's classification.
      then: O3
      why: The stated reason for omitting elements—keeping the endnote within the classification limit—would no longer require
        omission.
    - id: flip2
      if: After downgrading or sanitization, the IC-ID alone is sufficient to meet the source-discovery requirement.
      then: O1
      why: The directive allows an IC-ID to remain as the sole SRC element when it serves as the unambiguous source identifier.
    would_not_change:
    - id: noflip1
      if: The IC-ID is unclassified and releasable, but the endnote still needs other information to support source discovery.
      why: The classification status of the IC-ID does not remove the requirement to retain sufficient source-discovery information.
    watch_for:
    - id: watch1
      what: Whether the IC-ID is used as the unambiguous source identifier after downgrading or sanitization.
      favors:
      - O1
      why: The directive says an IC-ID may remain as the only SRC element in that circumstance.
  lesson: Keep an endnote within the main body's classification, omitting SRC elements when necessary. Preserve enough information
    for authorized source discovery; an IC-ID may serve as the sole element after downgrading or sanitization when it meets
    that need.
  limits: This reasoning addresses only the directive's classification and source-discovery balance for endnotes. It does
    not identify which particular SRC elements to omit or resolve cases where the retained information's sufficiency is uncertain.
  library:
    domain: intel-oversight
    family: CORPUS-NX-e3489acc
    source: https://archive.dni.gov/files/documents/ICD/ICD-206.pdf
    episode_focus: When necessary to keep an endnote within the main body’s classification, the directive permits omitting
      one or more source-reference elements while retaining enough information to find the source in an appropriately authorized
      system. Focus on the balance between classification limits and source discoverability; exclude technical procedures
      for locating sources.
    cues:
