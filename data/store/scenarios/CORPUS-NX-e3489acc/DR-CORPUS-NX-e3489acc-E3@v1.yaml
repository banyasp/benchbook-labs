        O1: 15
        O3: 15
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: partial
        O3: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
        O3: false
    equities: pilot2
