case:
  id: DR-CORPUS-NX-e3489acc-E2@v1
  title: Sourcing in Public-Release Products
  status: draft
  setting: Intelligence Community, before publication of a covered analytic product intended for public release.
  decider: The official responsible for public release
  agent: The official responsible for public release
  agent_role: decide
  situation: A covered analytic product is intended for public release. Sourcing information presented with covered analytic
    products is subject to IC policy on classification, control markings, foreign disclosure, and release. Its sensitivity
    is to be consistent with the classification and controls intended for the product. Downgraded or sanitized copies should
    contain sourcing information. The official responsible for public release is at the point of deciding whether sourcing
    information will appear in the publication.
  question: What should the official responsible for public release do with sourcing information before publication of the
    covered analytic product?
  options:
    O1:
      do: The official responsible for public release withholds sourcing information from the covered analytic product before
        publication.
      move: act
      irreversible: false
    O2:
      do: The official responsible for public release discloses sourcing information in the covered analytic product before
        publication.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Presentation of sourcing information is subject to IC policy on classification.
  - id: F2
    kind: authority
    status: confirmed
    fact: Presentation of sourcing information is subject to IC policy on control markings.
  - id: F3
    kind: authority
    status: confirmed
    fact: Presentation of sourcing information is subject to IC policy on foreign disclosure and release.
  - id: F4
    kind: authority
    status: confirmed
    fact: The sensitivity of sourcing information presented must be consistent with the classification intended for the covered
      analytic product.
  - id: F5
    kind: authority
    status: confirmed
    fact: The sensitivity of sourcing information presented must be consistent with the controls intended for the covered
      analytic product.
  - id: F6
    kind: authority
    status: confirmed
    fact: Downgraded or sanitized copies of covered analytic products should contain sourcing information.
  - id: F7
    kind: authority
    status: confirmed
    fact: Sourcing information will be removed before publication of covered analytic products intended for public release.
  considerations:
  - id: C1
    facts:
    - F7
    equity: policy_compliance
    favors:
    - O1
    weight: bar
    why: The public-release rule says sourcing information will be removed before publication, ruling out publication with
      sourcing information.
    rules_out:
    - O2
  - id: C2
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: classification_integrity
    favors:
    - O1
    weight: weak
    why: Sourcing information remains subject to classification, control-marking, and foreign-disclosure and release policies,
      and its sensitivity must match the product's intended classification and controls. These requirements govern its presentation
      but do not displace the specific public-release instruction.
  - id: C3
    facts:
    - F6
    - F7
    equity: classification_integrity
    favors:
    - O2
    weight: weak
    why: The direction that downgraded or sanitized copies should contain sourcing information may seem to support including
      it, but it concerns those copies and does not override the separate instruction to remove sourcing information before
      public release.
  reasoning:
    read: This is a decision about a covered analytic product intended for public release, not a general decision to exclude
      sourcing information from every copy. The trap is to let the instruction about downgraded or sanitized copies obscure
      the specific public-release rule.
    weighing: 'The public-release instruction is decisive: sourcing information will be removed before publication {C1}. Classification,
      control markings, and foreign disclosure and release policies still govern presentation {C2}, while the instruction
      about downgraded or sanitized copies does not change the public-release outcome {C3}. The balance depends on the product
      being intended for public release.'
    tradecraft: Apply the public-release rule and record that sourcing information was withheld on that basis. Do not treat
      this decision as a determination about what sourcing information belongs in a separate downgraded or sanitized copy.
    uncertainty: The stated outcome is clear for a product intended for public release. The excerpt does not specify who administers
      the related classification, control-marking, or foreign-disclosure policies.
    handoff: The official responsible for public release makes the decision under the stated rule. If applying the related
      classification, control-marking, or foreign-disclosure requirements is unclear, involve the appropriate policy authority;
      the excerpt does not identify a particular office.
    tempting_wrong:
      option: O2
      pull: The directive also says downgraded or sanitized copies should contain sourcing information.
      why_wrong: That instruction concerns those copies; for a product intended for public release, the specific instruction
        is to remove sourcing information before publication.
    rejected:
      O2: The official should not disclose sourcing information in the publication because the public-release rule requires
        its removal before publication.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A later applicable binding authority expressly replaced the public-release removal rule with a requirement to publish
        sourcing information.
      then: O2
      why: The outcome depends on the stated public-release rule; a superseding binding requirement would change the governing
        direction.
    would_not_change:
    - id: noflip1
      if: The sourcing information's sensitivity is consistent with the classification and controls intended for the product.
      why: That consistency is required, but the public-release instruction still says to remove sourcing information before
        publication.
    - id: noflip2
      if: A downgraded or sanitized copy should contain sourcing information.
      why: That direction for such copies does not change the separate public-release rule.
    watch_for:
    - id: watch1
      what: Whether the covered analytic product remains intended for public release.
      favors:
      - O1
      why: The stated removal rule is expressly tied to public-release intent.
  lesson: Apply the specific release rule to the product's intended audience rather than generalizing from requirements for
    other copies. Requirements to handle sourcing information consistently with classification and controls do not erase an
    express instruction to remove it before public release.
  limits: This reasoning addresses only sourcing information in covered analytic products intended for public release. It
    does not determine what sourcing information belongs in downgraded or sanitized copies or resolve the details of other
    applicable IC policies.
  library:
    domain: intel-oversight
    family: CORPUS-NX-e3489acc
    source: https://archive.dni.gov/files/documents/ICD/ICD-206.pdf
    episode_focus: For products intended for public release, the directive specifies that sourcing information will be removed
      before publication, within the wider requirements for classification, control markings, and foreign disclosure. Focus
      on the policy choice about public-release sourcing; exclude methods for sanitizing or preparing the released product.
    cues:
      option_words:
        O2: 16
        O1: 16
      real_option: O1
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: true
        O1: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The directive's paragraph 4(a) says sourcing information will be removed before publication when a covered analytic
  product is intended for public release.
