case:
  id: DR-CORPUS-NS-43e6e84e-NX-8c6fdef6-E2@v1
  title: The KAL 007 Engagement Decision
  status: draft
  setting: Soviet airspace near Sakhalin, 1 September 1983; Soviet air-defense command.
  decider: The local Soviet air-defense commander
  agent: The local Soviet air-defense commander
  agent_role: decide
  situation: At 3:26 a.m. Tokyo time on 1 September 1983, a Korean Boeing 747 airliner was near Soviet airspace. Soviet air-defense
    units had tracked it for more than an hour after it entered and left Soviet airspace over Kamchatka. The order to destroy
    it came as it approached departure from Soviet airspace for a second time after overflying Sakhalin, although its location
    was assessed as probably international airspace. The Soviet account initially identified the aircraft as a US intelligence
    platform, while US intelligence later assessed that Soviet forces probably did not know it was a civilian airliner. The
    air-defense system was on high alert, and commanders were under an order to shoot down aircraft discovered in Soviet airspace.
  question: What should the local Soviet air-defense commander do about the aircraft as it approaches departure from Soviet
    airspace?
  options:
    O1:
      do: The local Soviet air-defense commander engages the aircraft.
      move: act
      irreversible: true
    O2:
      do: The local Soviet air-defense commander refrains from engaging the aircraft.
      move: act
      irreversible: false
    O3:
      do: The local Soviet air-defense commander asks higher command to clarify.
      move: ask
      irreversible: false
      to: higher command
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The aircraft was a Korean Boeing 747 airliner.
  - id: F2
    kind: situation
    status: confirmed
    fact: Soviet air-defense units had tracked the aircraft for more than an hour after it entered and left Soviet airspace
      over Kamchatka.
  - id: F3
    kind: situation
    status: confirmed
    fact: The order to destroy the aircraft came as it was about to leave Soviet airspace for a second time after overflying
      Sakhalin.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The aircraft was probably downed in international airspace.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Soviet account initially identified the aircraft as a US intelligence platform of the RC-135 type.
  - id: F6
    kind: intelligence
    status: assessed
    fact: US intelligence eventually assessed that Soviet forces probably did not know they were destroying a civilian airliner.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Soviet air-defense commander was under an order that aircraft discovered in Soviet airspace be shot down, with
      commanders warned they would be dismissed if they refused to execute it.
  - id: F8
    kind: situation
    status: assessed
    fact: The air-defense system was on high alert and in a state of anxiety.
  considerations:
  - id: C1
    facts:
    - F1
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The aircraft was in fact a civilian airliner and all 269 people aboard were killed. The assessment that Soviet forces
      probably did not know it was a civilian aircraft bears on their knowledge, but does not lessen the consequence of an
      irreversible attack under uncertainty.
  - id: C2
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The aircraft was probably in international airspace when the order to destroy it was given. That makes the directive
      to shoot aircraft discovered in Soviet airspace an uncertain basis for engagement at that moment.
  - id: C3
    facts:
    - F2
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Soviet account identified the aircraft as an RC-135-type intelligence platform, while it was a Korean airliner
      and Soviet forces probably did not know its civilian identity. The claimed identification should not be treated as certainty
      sufficient to erase the risk of a catastrophic mistake.
  - id: C4
    facts:
    - F7
    - F8
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The commander faced a shoot-down order, threats of dismissal for refusing it, and an air-defense system on high alert.
      These conditions explain the pressure toward engagement, but do not resolve whether the order applied to an aircraft
      probably outside Soviet airspace.
  reasoning:
    read: This was an irreversible decision about an aircraft that was a Korean civilian airliner, although Soviet forces
      probably did not know that at the time. The trap is to treat the Soviet account's identification of an RC-135-type platform,
      or the general shoot-down directive, as proof that this aircraft was a lawful target within the directive's stated territorial
      condition. The order came as the aircraft approached departure from Soviet airspace, and it was probably already in
      international airspace.
    weighing: The civilian deaths and the probable international-airspace location weigh strongly against engagement {C1}
      {C2}. The claimed intelligence-platform identification does not overcome the uncertainty about what Soviet forces knew
      {C3}. The standing order and high-alert environment created powerful pressure to fire, but the order applied to aircraft
      discovered in Soviet airspace, a condition probably not met at the decision point {C4}. On this balance, refrain from
      engaging {O2}; the balance would be different if the aircraft's location and the directive's applicability were established
      differently.
    tradecraft: Do not engage on the uncertain identification and territorial basis described here. Record the grounds for
      restraint, including the uncertainty about location and identity, and communicate the decision through the established
      command channel. This is decision-level documentation, not guidance on weapon employment.
    uncertainty: The aircraft was probably downed in international airspace, and Soviet forces probably did not know it was
      civilian. The Soviet account identified it as an intelligence platform. What the local commander knew with certainty
      is not established, and the official US position continued to characterize the act as deliberate murder despite the
      later intelligence assessment.
    handoff: The local commander had to decide under a higher-level shoot-down order and threat of dismissal. The account
      does not identify a clarification request; asking higher command could help resolve the order's applicability if time
      permits, but uncertainty and command pressure do not themselves justify an irreversible engagement.
    tempting_wrong:
      option: O1
      pull: A direct shoot-down order, high alert, and the Soviet account identifying an intelligence platform all press toward
        engagement.
      why_wrong: Those considerations do not establish that the aircraft was inside Soviet airspace when the order was given
        or that the claimed identification was correct; it was probably in international airspace and was a civilian airliner.
    rejected:
      O1: Engagement was not chosen because the aircraft was probably in international airspace and the claimed military identification
        was uncertain, while engagement caused the deaths of all aboard.
      O3: A request for clarification might address uncertainty, but the endorsed outcome is restraint rather than referral,
        and the account does not identify clarification as the required course.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The aircraft were reliably established to remain in Soviet airspace and to fall within the shoot-down directive's
        stated category.
      then: O1
      why: The directive required shooting down aircraft discovered in Soviet airspace; establishing that its territorial
        condition was met would materially change the authority balance.
    would_not_change:
    - id: noflip1
      if: The air-defense system remained on high alert and commanders remained under pressure to execute the shoot-down order.
      why: Those conditions explain the pressure and the reported error, but alone do not resolve the aircraft's location
        or establish that the order applied at the moment of decision.
    watch_for:
    - id: watch1
      what: Whether higher command can promptly clarify whether the directive applies when the aircraft is probably in international
        airspace.
      favors:
      - O3
      why: The directive applied to aircraft discovered in Soviet airspace, while the aircraft was probably in international
        airspace.
  lesson: A command to act against intruders does not by itself establish that a particular aircraft is within the order's
    scope. When identity and location are uncertain and engagement is irreversible, do not convert an asserted hostile identification
    or a high-alert posture into certainty.
  limits: This judgment addresses the account of this aircraft, the reported order, and the probable location at the time
    of engagement. It does not resolve what a commander should do in a different case with reliable evidence of a hostile
    aircraft inside national airspace or a different governing order.
