    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB426/docs/3.The-1983-War-Scare-in-U.S.-Soviet-Relations-circa-1996.pdf
    episode_focus: The source describes the order to destroy the aircraft, the Soviet account that it was mistaken for a US
      intelligence platform, and the heightened alert and shoot-down directive in force. The scenario is the choice to engage
      or not engage an aircraft believed to be an intruder; distinguish the reported justification from what the article establishes
      about the aircraft’s identity and location.
    cues:
      option_words:
        O1: 8
        O2: 10
        O3: 10
      real_option: O2
      real_to_mean_other_length: 1.11
      real_is_longest: true
      moves:
        O1: act
        O2: act
        O3: ask
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
        O3: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The account characterizes the commander's error as serious and assesses that the aircraft was probably downed in international
  airspace; that judgment supports refraining from engagement rather than treating the Soviet account as sufficient justification
  to fire.
