case:
  id: DR-CORPUS-NS-43e6e84e-E2@v1
  title: Decision at the Edge of Soviet Airspace
  status: draft
  setting: Soviet air defense command, as an aircraft approached departure from Soviet airspace after Sakhalin Island, 1 September
    1983 at 3:26 a.m. Tokyo time.
  decider: The local Soviet air defense commander
  agent: The local Soviet air defense commander
  agent_role: decide
  situation: At 3:26 a.m. Tokyo time on 1 September 1983, the local Soviet air defense commander faced a decision as an aircraft
    approached departure from Soviet airspace after passing over Sakhalin Island. The aircraft had previously entered and
    left Soviet airspace over the Kamchatka Peninsula. It was a civilian Boeing 747 carrying 269 crewmembers and passengers.
    Soviet air defense forces were in a high-alert, anxious posture following reported US aircraft incursions during the spring
    and summer. Some senior officers had been transferred, reprimanded, or dismissed after those incursions.
  question: What should the local Soviet air defense commander do as the aircraft is about to leave Soviet airspace?
  options:
    O1:
      do: The local Soviet air defense commander withholds fire on the aircraft.
      move: act
      irreversible: false
    O2:
      do: The local Soviet air defense commander fires on the aircraft.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision point occurred at 3:26 a.m. Tokyo time on 1 September 1983.
  - id: F2
    kind: situation
    status: confirmed
    fact: The aircraft was a Korean Airlines Boeing 747 carrying 269 crewmembers and passengers.
  - id: F3
    kind: situation
    status: confirmed
    fact: The aircraft had entered and left Soviet airspace over the Kamchatka Peninsula and was about to leave Soviet airspace
      for a second time after flying over Sakhalin Island.
  - id: F4
    kind: situation
    status: assessed
    fact: The regional air defense situation was unusually tense, and the local command was on high alert and anxious.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A Soviet demarche contended that US aircraft had flown about 32 kilometers into Soviet airspace and remained there
      for up to 20 minutes during several overflights.
  - id: F6
    kind: situation
    status: confirmed
    fact: After the reported overflights, some senior officers were transferred, reprimanded, or dismissed.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Firing on a civilian airliner carrying 269 people risked catastrophic harm to people who were not combatants; withholding
      fire avoided that irreversible danger.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: Reported incursions, high alert, and consequences for senior officers created a tense context in which the commander
      could perceive a serious air-defense threat. That context explains the pressure to act, but does not establish that
      this aircraft was hostile.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The account says Soviet leaders asserted the aircraft was an intelligence platform, but describes the public defense
      as a coverup and assesses that the commander likely made an honest but serious mistake. A grave, irreversible decision
      should not rest on an unverified attribution.
  reasoning:
    read: The decision concerned whether to fire on an aircraft about to leave Soviet airspace, in a region made unusually
      tense by reported US incursions. The trap was allowing that heightened alert and fear of another incursion to turn uncertainty
      about the aircraft into confidence that it was a hostile intelligence platform, despite the catastrophic civilian stakes.
    weighing: The incursions and the command's anxious posture help explain why firing could seem necessary {C2}. But they
      do not establish this aircraft's hostile purpose, while the account identifies it as a civilian airliner and judges
      that the commander likely made a serious mistake {C1} {C3}. The required verdict is {O2}, reflecting the actual engagement
      and Ogarkov's public defense of it; the account's assessment makes that outcome contested rather than a clear ethical
      recommendation. The balance would depend on what the commander could reliably establish about the aircraft's identity
      and threat at the time.
    tradecraft: At decision level, distinguish confirmed facts from assumptions about hostile purpose, and do not treat prior
      incursions or disciplinary pressure as proof about the present aircraft. Record the information available, the uncertainty,
      the civilian-harm risk, and the authority for the decision; where time and authority permit, seek clarification before
      an irreversible action.
    uncertainty: The account says the commander probably did not know he was attacking a civilian airliner, but the excerpt
      does not establish exactly what information he had at the decision point. It also says the aircraft was probably downed
      in international airspace, not that this was certain.
    handoff: The account does not specify the commander's delegated authority or a required approval chain. If a superior
      or appropriate authority could be consulted in time, involving them would help test the hostile-aircraft assessment
      and clarify accountability; this is a decision-practice recommendation, not a procedure stated in the account.
    tempting_wrong:
      option: O2
      pull: The region was on high alert after reported US overflights, and senior officers had faced consequences afterward.
      why_wrong: Those conditions explain the commander's anxiety but do not prove this aircraft was hostile; allowing them
        to substitute for reliable identification exposes civilians to an irreversible risk.
    rejected:
      O1: Withholding fire was not the course taken; the required verdict records O2, while the account's assessment of a
        serious mistake leaves the choice ethically contested.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander had reliable confirmation before deciding that the aircraft was a civilian airliner and no immediate
        hostile threat was established.
      then: O1
      why: That would remove the principal security rationale for firing while making the foreseeable civilian harm unmistakable.
    - id: flip2
      if: The commander had reliable information that the aircraft posed no threat and that firing would occur outside Soviet
        airspace.
      then: O1
      why: Without a substantiated threat or an airspace-protection rationale, the high-alert context would not justify risking
        hundreds of civilian lives.
    would_not_change:
    - id: noflip1
      if: The reported earlier overflights and the resulting transfers, reprimands, or dismissals remained the only additional
        evidence.
      why: Those facts explain the command's anxiety but do not, by themselves, establish that this aircraft was hostile.
    watch_for:
    - id: watch1
      what: Whether the commander's assessment of hostile purpose was independently supported or mainly driven by the region's
        high-alert posture and prior incursions.
      favors:
      - O1
      why: The account's characterization of the decision as a serious mistake makes the reliability of that assessment central.
  lesson: A tense security environment can explain a decision without proving that its threat assessment was sound. When an
    irreversible action risks civilian lives, prior incidents and institutional pressure should not substitute for reliable
    evidence about the present case.
  limits: The account does not establish the commander's full information, the governing rules of engagement, or the authority
    available for consultation, so this analysis cannot determine a legal violation or reconstruct the precise decision standard.
    It addresses only the decision to fire or withhold fire, not the mechanics of engagement.
