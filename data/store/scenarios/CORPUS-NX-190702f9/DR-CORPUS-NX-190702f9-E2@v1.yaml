case:
  id: DR-CORPUS-NX-190702f9-E2@v1
  title: Estimating Sustainable New-Lands Production
  status: draft
  setting: USSR new lands program, 1955–56, agricultural production analysis.
  decider: The analysts
  agent: The analysts
  agent_role: decide
  situation: The new lands include poor soils and are exposed to climate risks, including variable rainfall and drought. Historical
    yield data suggest long-term wheat yields around 6 centners per hectare, while annual results have varied substantially.
    Soviet plans call for crop rotation, but the proposed share of land sown to grain is higher than in Canadian practice,
    where experience raises concerns about soil depletion. Soviet officials have expected annual production of at least 33
    million tons. More recent statements indicate an intention to reclaim about 40 million hectares; Canadian experience suggests
    13 million to 20 million hectares of that area could be sown to grain.
  question: What should the analysts do when choosing a sustainable annual production estimate for the new lands?
  options:
    O1:
      do: The analysts reject that expectation and use an annual sustainable-production estimate of 8 million to 12 million
        tons.
      move: act
      irreversible: false
    O2:
      do: The analysts accept the Soviet expectation of annual new-lands production of at least 33 million tons.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Much of the reclaimed land was poor, and the Southern Zone averages less than 12 inches of annual rainfall, with
      drought risk from drying winds.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The estimated long-term wheat yield under the 1955 acreage distribution is 6.2 centners per hectare, and 6 centners
      per hectare is assessed as a more reasonable long-term estimate than the 10 to 11 centners implied by official production
      expectations.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Estimated yields were 10.5 centners per hectare in the unusually favorable 1954 crop year and 4.3 centners per hectare
      during the 1955 drought.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The proposed Soviet rotation systems would devote three-fourths of the land to grain in a given year, compared with
      one-third to one-half in Canadian practice, and Canadian experience indicates that prolonged heavy grain cropping may
      deplete the soil.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The stated Soviet expectation is annual production of at least 33 million tons, calculated using a yield of 11 centners
      per hectare on 30 million hectares.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Recent Soviet statements indicate an intention to reclaim about 40 million hectares; Canadian experience suggests
      13 million to 20 million hectares could be sown to grain, yielding an estimated average production of 8 million to 12
      million tons at 6 centners per hectare.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Gross production of 8 million to 12 million tons is estimated to provide 6 million to 9 million tons for direct
      human consumption, enough to supply the grain requirements of 30 million to 40 million people.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Poor soils and climate hazards make yields vulnerable, and the historical estimate is about 6 centners per hectare
      under the 1955 acreage distribution. The 1954 high yield came in unusually favorable conditions, while the 1955 drought
      produced a much lower yield; neither year alone is a sound long-term basis.
  - id: C2
    facts:
    - F4
    - F6
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The proposed Soviet rotations devote a substantially larger share to grain than Canadian practice. Canadian experience
      raises concern that prolonged heavy grain cropping could deplete the soil, and it suggests only 13 million to 20 million
      hectares of the intended 40 million could be sown to grain.
  - id: C3
    facts:
    - F2
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Soviet expectation of at least 33 million tons rests on an 11-centner yield over 30 million hectares, whereas
      the analysts consider about 6 centners more reasonable. Applying that yield to the grain-sown acreage indicated by Canadian
      experience gives an estimated 8 million to 12 million tons, still enough after seed and waste for the grain requirements
      of 30 million to 40 million people.
  reasoning:
    read: The choice is between a production target built on high yield and extensive grain acreage, and an estimate grounded
      in historical yields and the acreage likely to be sown under rotation. The trap is treating a favorable year's yield
      or the official target as evidence of sustainable annual output, despite drought variability, soil risks, and limits
      on grain acreage.
    weighing: The analysts favor about 6 centners per hectare over the 10 to 11 centners implied by official expectations
      {C1}. Applying that yield to the 13 million to 20 million hectares Canadian experience suggests could be sown to grain
      supports 8 million to 12 million tons, not 33 million {C2} {C3}. That range is a substantial estimated supply, including
      6 million to 9 million tons for direct human consumption. The assessment depends on the likely grain-sown share of the
      reclaimed area and on historical yields being a reasonable guide; rotation systems had not been finally determined.
    tradecraft: Record the yield and acreage assumptions separately, distinguish gross production from availability for direct
      consumption, and present the estimate as a range rather than as a guaranteed annual result. Do not treat the official
      target as an independently supported forecast.
    uncertainty: Annual yields can vary widely with rainfall, and the proposed rotation systems were not final. The estimate
      also applies Canadian experience to Soviet acreage plans, so the grain-sown acreage remains an important uncertainty.
    handoff: The analysts can make the estimate on the evidence available, while identifying the unfinished rotation plans
      and actual grain-sown acreage as matters to revisit when better evidence emerges.
    tempting_wrong:
      option: O2
      pull: The Soviet expectation of at least 33 million tons offers a much larger production figure and is tied to an announced
        reclamation program.
      why_wrong: It assumes both an 11-centner yield, substantially above the analysts' historical estimate, and 30 million
        hectares sown to grain, which the Canadian rotation comparison does not support.
    rejected:
      O2: The analysts do not accept the 33-million-ton expectation because its implied yield and grain-sown acreage exceed
        what their historical-yield and crop-rotation assessment supports.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that at least 30 million hectares could be sown to grain sustainably under the actual
        rotation system and that long-term yields could reach about 11 centners per hectare.
      then: O2
      why: Those findings would remove the central acreage and yield objections to the 33-million-ton expectation.
    would_not_change:
    - id: noflip1
      if: A single crop year again produced a yield near the unusually favorable 1954 result.
      why: One favorable year would not displace the historical long-term yield assessment or resolve the uncertainty from
        annual rainfall variation.
    watch_for:
    - id: watch1
      what: Whether the final rotation systems continue to devote a high share of land to grain over many years, and whether
        that heavy cropping depletes soil.
      favors:
      - O1
      why: Prolonged heavy grain cropping could deplete the soil, and the rotation systems were not finally determined.
  lesson: A sustainable production estimate should be built from long-term yield evidence and a plausible estimate of land
    that can be cropped under the intended rotation, not from an official target or an exceptional year. State the uncertainties
    that could change those assumptions and update the estimate when evidence about actual acreage and rotations becomes available.
  limits: This reasoning addresses the analysts' estimate for the USSR new lands program in 1955–56, using the historical
    yields and Canadian rotation experience described here. It does not establish that the same yield or acreage assumptions
    apply to other regions, periods, or cropping systems.
