case:
  id: DR-CORPUS-NX-aa91446d-E1@v1
  title: Centralizing DIA Terrorism Coordination
  status: draft
  setting: DIA, at the time of the memorandum; the date and place are not stated.
  decider: The DIA Director
  agent: The DIA Director
  agent_role: decide
  situation: The DIA Director is considering how terrorism intelligence and security matters should be coordinated within
    DIA. The terrorist threat to U.S. personnel, facilities, and weapons worldwide is regarded as real and growing. The primary
    Executive Branch concern is the protection of U.S. interests from terrorist attacks. Several DIA elements are involved
    in terrorism and counterterrorism support, and their coordination is regarded as unsatisfactory. The Director sees a need
    for a single source for the status of DIA's related actions and for stronger management direction and control.
  question: What should the DIA Director do about coordinating terrorism intelligence and security matters across DIA?
  options:
    O1:
      do: The DIA Director will centralize terrorism intelligence and security coordination in one designated office.
      move: act
      irreversible: false
    O2:
      do: The DIA Director will decentralize terrorism intelligence and security coordination across the involved DIA elements.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The terrorist threat to U.S. personnel, facilities, and weapons worldwide is regarded as real and growing.
  - id: F2
    kind: situation
    status: assessed
    fact: The primary Executive Branch terrorism and counterterrorism concern is the protection of U.S. interests from terrorist
      attacks.
  - id: F3
    kind: situation
    status: assessed
    fact: Multiple DIA elements are legitimately involved in terrorism and counterterrorism support.
  - id: F4
    kind: situation
    status: assessed
    fact: Coordination on terrorism and counterterrorism matters is regarded as less than satisfactory.
  - id: F5
    kind: situation
    status: assessed
    fact: The DIA Director sees a need for one source to determine the status of any or all DIA terrorism and counterterrorism
      actions.
  - id: F6
    kind: situation
    status: assessed
    fact: The DIA Director expects a single office of primary interest to enhance management direction and control of DIA's
      terrorism and counterterrorism program.
  - id: F7
    kind: situation
    status: assessed
    fact: DIA is expected to expand intelligence production on terrorism and tailor its terrorism and counterterrorism program
      to the threat.
  considerations:
  - id: C1
    facts:
    - F1
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The threat is regarded as real and growing, and DIA is expected to expand terrorism intelligence production and tailor
      its program to that threat; the Director treats this as a reason to improve how the program is managed.
  - id: C2
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Because the primary Executive Branch concern is protecting U.S. interests from terrorist attacks, the Director frames
      the program around meeting that mission.
  - id: C3
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Multiple DIA elements are legitimately involved, but their coordination on terrorism and counterterrorism matters
      is less than satisfactory. The Director therefore favors a single coordination focal point rather than leaving coordination
      spread across the elements.
  - id: C4
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: A designated office would give the Director one source for the status of any or all DIA terrorism and counterterrorism
      actions.
  - id: C5
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The Director expects a single office of primary interest to strengthen management direction and control of the program.
  reasoning:
    read: The problem is not that several DIA elements are involved; their involvement is legitimate. The problem is that
      their coordination is unsatisfactory and the Director lacks a single source for program-wide status. The trap is treating
      legitimate participation by multiple elements as a reason to retain dispersed coordination.
    weighing: The threat and the Executive Branch focus on protecting U.S. interests establish the mission context. The decisive
      reasons for centralizing coordination are the unsatisfactory coordination process, the need for one source of status,
      and the expected improvement in management direction and control {C3} {C4} {C5}. The balance favors {O1}; it depends
      on the designated office actually serving as the coordination and status focal point.
    tradecraft: Designate one office as the OPI for terrorism intelligence and security matters, and direct all related actions
      to be coordinated with it. As an implementation check, assess whether the arrangement provides the intended program-wide
      status visibility and management control.
    uncertainty: The memorandum gives the Director's reasons for centralization but does not describe implementation results
      or establish whether the new arrangement ultimately improved coordination.
    handoff: The DIA Director makes the decision. The memorandum directs coordination through the designated OPI but specifies
      no additional approval or consultation requirement.
    tempting_wrong:
      option: O2
      pull: Several DIA elements are legitimately involved, which can make decentralized coordination appear to preserve their
        participation.
      why_wrong: 'Legitimate involvement does not address the stated problem: coordination is already unsatisfactory, and
        the Director wants one source for status and stronger management direction and control.'
    rejected:
      O2: The Director did not retain decentralized coordination because the existing coordination was unsatisfactory and
        a single status source and stronger management control were needed.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Coordination across the involved elements were demonstrably satisfactory and decentralized arrangements reliably
        gave the Director a complete view of program status and effective management control.
      then: O2
      why: Those conditions would remove the principal coordination, status-visibility, and management-control reasons the
        Director gave for centralizing.
    would_not_change:
    - id: noflip1
      if: Multiple DIA elements continued to have legitimate roles in terrorism and counterterrorism support.
      why: The Director acknowledged that multiple elements were legitimately involved and still chose a single coordination
        focal point; participation by multiple elements alone does not defeat centralization.
    watch_for:
    - id: watch1
      what: Whether coordination through the designated OPI provides a single, usable view of related actions and strengthens
        management direction and control.
      favors:
      - O1
      why: These are the stated benefits on which the Director's choice rests.
  lesson: When several elements have legitimate roles but coordination is unsatisfactory, preserve their roles while establishing
    a clear coordination focal point if that provides needed status visibility and management control. The choice should be
    judged by whether it addresses those identified coordination needs.
  limits: This reasoning supports a coordination designation; it does not establish that one office should absorb the other
    elements' functions. It also does not establish that centralization will work without implementation evidence.
  library:
    domain: intel-oversight
    family: CORPUS-NX-aa91446d
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-16.pdf
