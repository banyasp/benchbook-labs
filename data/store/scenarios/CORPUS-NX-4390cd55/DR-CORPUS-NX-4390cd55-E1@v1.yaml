case:
  id: DR-CORPUS-NX-4390cd55-E1@v1
  title: Protection of a Military Medical Establishment
  status: draft
  setting: A military medical establishment, at the point of a possible attack decision.
  decider: The military decision-maker applying the doctrine
  agent: The military decision-maker applying the doctrine
  agent_role: decide
  situation: A military medical establishment is under consideration for a possible attack. Different rules apply to military
    medical establishments. The legal framework protects them from attack, with an exception for use in acts of hostility
    outside their humanitarian function. The decision turns on that use and whether a warning has been given and ignored.
  question: What should the military decision-maker do about an attack on the military medical establishment under this legal
    framework?
  options:
    O1:
      do: The military decision-maker prohibits an attack on the establishment when it is used for acts of hostility outside
        its humanitarian function and a warning has been given and ignored.
      move: act
      irreversible: false
    O2:
      do: The military decision-maker holds the attack decision while determining whether the establishment is used for hostile
        acts outside its humanitarian function and whether a warning was ignored.
      move: hold
      irreversible: false
    O3:
      do: The military decision-maker permits an attack on the establishment when it is used for acts of hostility outside
        its humanitarian function and a warning has been given and ignored.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The establishment under consideration is a military medical establishment.
  - id: F2
    kind: authority
    status: confirmed
    fact: Different rules apply to military medical establishments.
  - id: F3
    kind: authority
    status: confirmed
    fact: Military medical establishments may not be attacked, subject to an exception.
  - id: F4
    kind: authority
    status: confirmed
    fact: The exception applies when an establishment is used to commit acts of hostility outside its humanitarian function.
  - id: F5
    kind: situation
    status: confirmed
    fact: A military hospital used as an operational headquarters is an example of use outside its humanitarian function.
  - id: F6
    kind: authority
    status: confirmed
    fact: An attack under the exception is lawful only after a warning has been given and ignored.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: protected_sites
    favors:
    - O1
    - O2
    weight: strong
    why: Military medical establishments receive distinct protection and may not be attacked as the default.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The doctrine provides an exception when the establishment is used for acts of hostility outside its humanitarian
      function; use as an operational headquarters is the stated example.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The exception permits a lawful attack only after a warning has been given and ignored, so the warning condition is
      an essential part of the authorization.
  reasoning:
    read: 'This is a decision about a specially protected military medical establishment, not an ordinary military target.
      The trap is treating hostile use alone as enough: the doctrine also requires that a warning be given and ignored.'
    weighing: The protection is the default, but the doctrine recognizes a narrow exception for use in acts of hostility outside
      the humanitarian function, subject to the ignored-warning condition. Those conditions support O3 as a conditional permission,
      not as a direction that an attack must occur. The balance depends on whether both conditions are established.
    tradecraft: Apply the two conditions separately and record the basis for concluding that each is met before permitting
      an attack. Keep the decision to permit distinct from any decision to conduct an attack.
    uncertainty: The fixed facts state the governing conditions but do not establish whether this establishment is being used
      for hostile acts or whether a warning was given and ignored. O3 therefore expresses the doctrine's conditional outcome,
      not a factual finding that the conditions are met here.
    handoff: The military decision-maker applies the stated legal threshold. The source identifies no required referral or
      other decision-maker.
    tempting_wrong:
      option: O1
      pull: The establishment's medical character makes categorical protection seem safest.
      why_wrong: A categorical prohibition would omit the doctrine's express exception when hostile use outside the humanitarian
        function is followed by a warning that is ignored.
    rejected:
      O1: It was not chosen because it would prohibit an attack even when both conditions for the doctrine's exception are
        met.
      O2: It was not chosen as the doctrine's outcome because the stated rule is conditional permission once hostile use and
        an ignored warning are established, rather than an open-ended deferral.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The establishment is not being used to commit acts of hostility outside its humanitarian function.
      then: O1
      why: Without the specified hostile use, the doctrine's exception does not apply and the default protection remains.
    - id: flip2
      if: A warning has not been given and ignored.
      then: O1
      why: The doctrine makes a warning given and ignored a condition of lawful attack under the exception.
    would_not_change:
    - id: noflip1
      if: The establishment is a military hospital used as an operational headquarters, but the warning condition is not met.
      why: The example illustrates hostile use outside the humanitarian function; it does not displace the separate warning
        requirement.
    watch_for:
    - id: watch1
      what: Whether the establishment is used for acts of hostility outside its humanitarian function and whether a warning
        has been given and ignored.
      favors:
      - O3
      why: Both conditions determine whether the doctrine's exception permits an attack.
  lesson: Military medical establishments are protected from attack by default. The doctrine's exception permits an attack
    only when the establishment is used for hostile acts outside its humanitarian function and a warning has been given and
    ignored.
  limits: This reasoning addresses only the stated rule for military medical establishments and its specified exception. It
    does not resolve whether the conditions are factually met in a particular case or address other legal requirements for
    an attack.
  library:
    domain: military-operational
    family: CORPUS-NX-4390cd55
    source: https://www.canada.ca/content/dam/dnd-mdn/documents/legal-juridique/manuals-manuels/loac-handbook-guide-dca/loac-handbook-2025-sept.pdf
    episode_focus: The doctrine permits attack only when the establishment is used for acts of hostility outside its humanitarian
      function and a warning has been given and ignored. Frame the decision around that legal threshold and the protection
      of medical facilities; exclude operational methods for conducting an attack.
    cues:
      option_words:
        O3: 29
        O1: 29
        O2: 27
      real_option: O3
      real_to_mean_other_length: 1.04
      real_is_longest: true
      moves:
        O3: act
        O1: act
        O2: hold
      real_move: act
      irreversible_flags:
        O3: true
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The doctrine permits a military medical establishment to be lawfully attacked when it is used for acts of hostility
  outside its humanitarian function, but only after a warning has been given and ignored.
