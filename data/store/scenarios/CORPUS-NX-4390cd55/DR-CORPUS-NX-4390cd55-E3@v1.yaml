case:
  id: DR-CORPUS-NX-4390cd55-E3@v1
  title: Wounded Combatant Status Determination
  status: draft
  setting: CAF operational setting during hostilities; place and time unspecified.
  decider: The CAF member
  agent: The CAF member
  agent_role: decide
  situation: During hostilities, a combatant is wounded or becomes sick in a firefight. The combatant continues to fight despite
    the injury. The injury alone does not establish that the combatant can no longer defend themself. The CAF member has information
    available at the time about the combatant's condition and conduct. Determining the precise point at which a combatant
    becomes hors de combat can be difficult.
  question: What should the CAF member do about whether the wounded combatant remains attackable?
  options:
    O1:
      do: The CAF member permits an attack on the wounded combatant.
      move: act
      irreversible: false
    O2:
      do: The CAF member prohibits an attack on the wounded combatant.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A combatant may become wounded or sick during hostilities, including during a firefight.
  - id: F2
    kind: authority
    status: confirmed
    fact: Being wounded or sick does not by itself necessarily mean that a combatant can no longer be attacked.
  - id: F3
    kind: capability
    status: confirmed
    fact: A combatant becomes protected from attack if their wound or sickness leaves them incapable of defending themself.
  - id: F4
    kind: authority
    status: confirmed
    fact: A combatant also becomes protected if otherwise hors de combat through surrender or detention.
  - id: F5
    kind: situation
    status: confirmed
    fact: The combatant continues to fight despite being wounded or sick.
  - id: F6
    kind: authority
    status: confirmed
    fact: A wounded or sick combatant who continues to fight remains liable to attack.
  - id: F7
    kind: capability
    status: confirmed
    fact: In practice, it may be difficult to determine the precise moment a combatant has been rendered hors de combat.
  - id: F8
    kind: authority
    status: confirmed
    fact: The CAF member must make the assessment honestly and reasonably based on the relevant information available at the
      time.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: hors_de_combat
    favors:
    - O1
    weight: weak
    why: Wounding or sickness during hostilities does not by itself establish that the combatant is protected from attack.
  - id: C2
    facts:
    - F3
    - F4
    equity: hors_de_combat
    favors:
    - O2
    weight: weak
    why: The combatant must not be attacked if the wound or sickness leaves them incapable of defending themself, or if they
      are otherwise hors de combat through surrender or detention; those conditions would change the status determination.
  - id: C3
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: A wounded or sick combatant who continues to fight remains liable to attack.
  - id: C4
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although the precise point of becoming hors de combat may be difficult to determine, the CAF member must assess the
      status honestly and reasonably using the relevant information available at the time.
  reasoning:
    read: The combatant is wounded or sick but continues to fight. The trap is treating the injury itself as proof that the
      combatant can no longer defend themself or is hors de combat {C1}.
    weighing: The protection against attack applies if the injury leaves the combatant incapable of defending themself or
      if they are otherwise hors de combat through surrender or detention {C2}. On these facts, the combatant continues to
      fight, which the rule treats as remaining liable to attack {C3}. The CAF member should permit an attack, with the status
      assessment made honestly and reasonably on the information available at the time despite possible difficulty identifying
      the precise point of becoming hors de combat {C4}.
    tradecraft: Assess the combatant's condition and conduct from the relevant information available at the time; do not treat
      the wound alone as decisive. Reconsider the status if relevant information changes. The source requires an honest and
      reasonable assessment but does not specify a recordkeeping procedure.
    uncertainty: The precise moment when a combatant becomes hors de combat may be difficult to determine. The assessment
      therefore depends on the relevant information available to the CAF member at the time.
    handoff: The source assigns the assessment to the CAF member and identifies no required handoff; the member should make
      the honest and reasonable assessment on the information available.
    tempting_wrong:
      option: O2
      pull: The combatant is wounded or sick, which may suggest they should be treated as protected.
      why_wrong: The source says injury alone does not necessarily make a combatant unattackable, and a wounded or sick combatant
        who continues to fight remains liable to attack.
    rejected:
      O2: A prohibition is not chosen because the combatant continues to fight, and the facts do not establish that the injury
        has left them incapable of defending themself or that they are otherwise hors de combat.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The wound or sickness leaves the combatant incapable of defending themself.
      then: O2
      why: That condition makes the combatant protected from attack.
    - id: flip2
      if: The combatant becomes hors de combat through surrender or detention.
      then: O2
      why: Surrender or detention otherwise renders the combatant hors de combat and protected from attack.
    would_not_change:
    - id: noflip1
      if: The combatant is wounded or sick during the firefight, but continues to fight and no incapacity or other hors de
        combat status is established.
      why: Wounding or sickness alone does not necessarily make the combatant unattackable, and continuing to fight leaves
        them liable to attack.
    watch_for:
    - id: watch1
      what: Relevant information about whether the combatant continues to fight or has become incapable of defending themself
        or otherwise hors de combat.
      favors:
      - O1
      - O2
      why: The assessment turns on the combatant's condition and conduct, and must be made honestly and reasonably using the
        information available at the time.
  lesson: A wound or sickness does not by itself make a combatant protected from attack. A combatant who continues to fight
    remains liable to attack; protection applies when the injury leaves them incapable of defending themself or they are otherwise
    hors de combat, and the status assessment must be honest and reasonable based on information available at the time.
  limits: This reasoning addresses a wounded or sick combatant during hostilities. It does not determine the status of a civilian
    directly participating in hostilities or address other legal rules governing an attack.
  library:
    domain: military-operational
    family: CORPUS-NX-4390cd55
    source: https://www.canada.ca/content/dam/dnd-mdn/documents/legal-juridique/manuals-manuels/loac-handbook-guide-dca/loac-handbook-2025-sept.pdf
    episode_focus: The handbook distinguishes a combatant who remains capable of defending themself or continues hostile acts
      from one rendered incapable of defending themself or otherwise hors de combat. Focus on the status determination and
      the legal basis for attacking or refraining; exclude tactical means of engagement.
