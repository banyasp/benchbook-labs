case:
  id: DR-CORPUS-NX-ef3cbeb8-E3@v1
  title: Independence Day Public-Safety Staffing
  status: draft
  setting: New York City, 4 July 2015, city public-safety staffing for Independence Day festivities.
  decider: New York City public-safety authorities
  agent: New York City public-safety authorities
  agent_role: decide
  situation: New York City was preparing for Independence Day festivities on 4 July 2015. DHS publicly warned of an increased
    threat of ISIL-inspired violence over the holiday weekend. There was no specific, credible intelligence about an attack.
    ISIL had called for attacks against military, law-enforcement, government, and public members during Ramadan, which ended
    in mid-July.
  question: What should New York City public-safety authorities do about additional officer staffing for Independence Day
    festivities?
  options:
    O1:
      do: New York City public-safety authorities limit the increase in officer staffing for the festivities.
      move: partial
      irreversible: false
    O2:
      do: New York City public-safety authorities decline additional officer staffing for the festivities.
      move: act
      irreversible: false
    O3:
      do: New York City public-safety authorities authorize additional officer staffing for the festivities.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: New York City Independence Day festivities were scheduled for 4 July 2015.
  - id: F2
    kind: intelligence
    status: assessed
    fact: DHS publicly warned of an increased threat of ISIL-inspired violence over the holiday weekend.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: There was no specific, credible intelligence about an attack.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: ISIL had called for attacks against members of the military during Ramadan.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: ISIL had called for attacks against law-enforcement members during Ramadan.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: ISIL had called for attacks against government personnel and the American public during Ramadan.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Ramadan referenced in the call ended in mid-July.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    - F6
    - F7
    equity: civilian_life
    favors:
    - O3
    weight: weak
    why: The elevated-threat warning and ISIL's calls to attack military, law-enforcement, government, and public members
      during a period that included the holiday support taking a precautionary step to protect people.
  - id: C2
    facts:
    - F3
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: The absence of specific, credible intelligence is a reason to be cautious about the scale of an added staffing response,
      though it does not negate the broader warning.
  - id: C3
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The elevated threat warning concerned the same holiday period as the scheduled festivities, supporting additional
      public-safety staffing for that event.
  reasoning:
    read: The choice was whether to add staffing for a defined public event amid a general elevated-threat warning, not a
      response to specific, credible intelligence of an attack. The trap is treating the lack of specific intelligence as
      proof there is no risk, or treating a general warning as proof an attack is imminent.
    weighing: The warning and the calls for attacks during a period that included the festivities support precautionary staffing
      {C1} {C3}; the lack of specific, credible intelligence counsels against treating a larger response as compelled {C2}.
      The source records that New York City deployed about 7,000 additional officers, but does not state a detailed rationale
      for that number or explain why a more limited increase was rejected. On the available reasons, additional staffing is
      the recorded choice, while its scale should not be represented as dictated by specific intelligence.
    tradecraft: Record the general warning separately from the absence of specific, credible intelligence, and document the
      basis for the staffing level selected. Keep the decision tied to the holiday period and review it if the threat assessment
      materially changes.
    uncertainty: The excerpt gives the threat context and the deployment outcome, but no detailed assessment of likelihood,
      staffing costs, or the authorities' deliberation over alternative staffing levels.
    handoff: New York City public-safety authorities make the staffing decision; use the DHS warning as relevant threat information,
      while the excerpt does not indicate that another authority had to approve the city deployment.
    tempting_wrong:
      option: O2
      pull: There was no specific, credible intelligence about an attack.
      why_wrong: That fact limits what can be claimed about imminence, but does not erase the elevated-threat warning or the
        calls for attacks relevant to the holiday period.
    rejected:
      O1: A limited increase gives too little weight to the elevated holiday-period warning and the calls for attacks, although
        the excerpt does not explain why the recorded deployment's particular scale was necessary.
      O2: Declining additional staffing would treat the absence of specific, credible intelligence as dispositive despite
        the broader warning and attack calls.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The elevated-threat warning were withdrawn or materially downgraded before the festivities, with no other relevant
        threat information.
      then: O1
      why: With the general threat basis substantially reduced and no specific, credible intelligence, a limited increase
        would better reflect the reduced precautionary case.
    would_not_change:
    - id: noflip1
      if: The only point offered against additional staffing remained the absence of specific, credible intelligence.
      why: That absence is already part of the stated situation and does not by itself remove the broader warning or the relevance
        of the attack calls.
    watch_for:
    - id: watch1
      what: Material changes to the public threat warning before the holiday festivities.
      favors:
      - O1
      - O3
      why: A stronger warning would reinforce precautionary staffing; a materially downgraded warning would weaken the basis
        for the added response.
  lesson: A general threat warning can justify precautionary public-safety staffing even when no specific, credible attack
    intelligence exists. Distinguish that precautionary basis from proof of an imminent attack, and do not claim the evidence
    establishes a particular staffing scale when it does not.
  limits: This reasoning applies to the holiday-period staffing choice described here, not to the separate investigations
    or arrests mentioned nearby. The excerpt does not provide a cost assessment, a detailed threat analysis, or the authorities'
    explanation for the precise number of added officers.
