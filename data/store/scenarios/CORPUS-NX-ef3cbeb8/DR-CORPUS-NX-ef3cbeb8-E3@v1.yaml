    family: CORPUS-NX-ef3cbeb8
    source: https://jsouapplicationstorage.blob.core.windows.net/press/166/JSOU16_MendelMcCabe_CTOC_final.pdf
    episode_focus: The decision point is the choice to increase public-safety staffing despite the absence of specific, credible
      intelligence about an attack. Focus on the balance between precautionary security and the scale of the response; exclude
      the FBI investigations and arrests described nearby.
