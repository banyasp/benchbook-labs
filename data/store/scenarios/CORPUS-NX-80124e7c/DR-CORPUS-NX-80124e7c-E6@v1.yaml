case:
  id: DR-CORPUS-NX-80124e7c-E6@v1
  title: Soviet Policy on Widening a Limited Conflict
  status: draft
  setting: Soviet leadership; a limited conflict on the bloc periphery; time unspecified
  decider: The Soviet leaders
  agent: The Soviet leaders
  agent_role: decide
  situation: Soviet leaders face a choice about the scope of a limited conflict on the bloc periphery. Their strategic assessment
    treats military power as potentially relevant to shielding Communist efforts that advance by safer means. They are assessed
    as wishing to avoid Soviet forces’ involvement in limited combat and to minimize escalation risk if conflict occurs. The
    assessment anticipates that expansion would generally not be initiated, while the degree of Soviet commitment and the
    circumstances of the conflict matter to the decision. It identifies grave repercussions within the bloc or a major setback
    to Soviet world position from prospective defeat as conditions that could support expansion, even with increased risk
    of general war.
  question: What should the Soviet leaders do about whether to authorize expansion of a limited conflict?
  options:
    O1:
      do: The Soviet leaders decline expansion of the limited conflict.
      move: act
      irreversible: false
    O2:
      do: The Soviet leaders defer the scope decision for further assessment.
      move: hold
      irreversible: false
    O3:
      do: The Soviet leaders authorize expansion of the limited conflict.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Soviet leaders are assessed as alert to opportunities to use military power to shield Communist efforts advancing
      by safer means.
  - id: F2
    kind: intelligence
    status: assessed
    fact: They are assessed as wishing to avoid involvement of Soviet forces in limited combat on the bloc periphery.
  - id: F3
    kind: intelligence
    status: assessed
    fact: If limited conflict occurs, they are assessed as seeking to minimize the chances of escalation to general war.
  - id: F4
    kind: intelligence
    status: assessed
    fact: In most circumstances, they are assessed as not initiating an expansion of such a conflict.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The degree of Soviet commitment and the actual circumstances of the conflict are assessed as determinants of the
      expansion decision.
  - id: F6
    kind: intelligence
    status: assessed
    fact: They are assessed as expanding the conflict, even at greater risk of general war, only if prospective defeat would
      have grave political repercussions within the bloc or constitute a major setback to the Soviet world position.
  considerations:
  - id: C1
    facts:
    - F3
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The assessment says the leaders seek to minimize the chance that limited conflict escalates to general war, weighing
      against expanding it.
  - id: C2
    facts:
    - F2
    - F4
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The leaders are assessed as wishing to avoid their forces’ involvement in limited combat and, in most circumstances,
      not initiating expansion.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Expansion is contingent on the degree of commitment and actual circumstances, and the stated exceptional basis is
      prospective defeat with grave consequences. The passage does not establish that this threshold is met, so it does not
      support authorizing expansion as the default.
  reasoning:
    read: This is a choice about the scope of an existing limited conflict, not a general authorization to use military power.
      The trap is treating the potential strategic usefulness of force as sufficient to justify widening the conflict, despite
      the assessed preference to avoid Soviet-force involvement and general-war escalation.
    weighing: 'The stated default favors declining expansion: the leaders wish to avoid involvement and minimize escalation
      risk, and would generally not initiate widening the conflict {C1} {C2}. The decision remains sensitive to commitment
      and actual circumstances {F5}. Expansion is reserved for the exceptional case in which prospective defeat would have
      grave repercussions within the bloc or seriously set back the Soviet world position {C3}. On the facts given, that exception
      is not established, so the balance favors {O1}.'
    tradecraft: Keep the scope decision distinct from operational planning. Record the assessed degree of commitment, the
      relevant circumstances, the escalation concern, and whether the stated exceptional political threshold is met; do not
      treat a general strategic opportunity as a finding that it is met.
    uncertainty: The assessment is conditional and gives no particular conflict circumstances or degree of Soviet commitment.
      It therefore supports the general default, but not a claim that the exceptional condition could never arise.
    handoff: The Soviet leaders are the identified decision-makers. No separate reviewing authority or required referral is
      identified; the decision turns on their assessment of commitment and the conflict’s actual circumstances.
    tempting_wrong:
      option: O3
      pull: Military power might shield Communist efforts advancing by safer means, and the assessment recognizes an exceptional
        case in which leaders might accept greater escalation risk.
      why_wrong: That strategic possibility is not itself the stated trigger for expansion. The assessment sets a narrower
        condition—prospective defeat with grave bloc repercussions or a major setback to Soviet world position—and otherwise
        favors avoiding expansion.
    rejected:
      O2: Deferral was not the assessed general course; the passage says the leaders would ordinarily avoid initiating expansion,
        while making the decision depend on commitment and circumstances.
      O3: Authorization is not supported unless the exceptional prospective-defeat condition is met, and the facts provided
        do not establish that it is.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Prospective defeat would, in the leaders’ view, cause grave political repercussions within the bloc or constitute
        a major setback to the Soviet world position.
      then: O3
      why: The assessment identifies this as the exceptional condition under which leaders would expand even at greater risk
        of general war.
    would_not_change:
    - id: noflip1
      if: Military power might help shield Communist efforts advancing by safer means, but the stated prospective-defeat threshold
        is not met.
      why: Strategic usefulness alone does not displace the assessed general preference to avoid initiating expansion and
        minimize escalation risk.
    watch_for:
    - id: watch1
      what: The degree of Soviet commitment and the actual circumstances of the conflict.
      favors:
      - O3
      - O1
      why: The assessment says these determine the decision and may bear on whether the exceptional condition for expansion
        applies.
  lesson: Treat widening a limited conflict as an exception, not the default, when the decision-maker seeks to avoid involvement
    and minimize the risk of general war. Strategic opportunity alone is not enough; assess whether the stated grave-consequence
    threshold is actually met.
  limits: This reasoning reflects an assessment of Soviet leaders’ likely policy, not a legal rule or a universal recommendation
    about conflict. It does not determine what to do when the exceptional political consequences are established or when materially
    different circumstances apply.
