case:
  id: DR-CORPUS-NX-80124e7c-E1@v1
  title: Estimating Soviet Responses to Chinese Actions
  status: draft
  setting: United States intelligence-estimating community, during the period covered by the estimate
  decider: The intelligence estimators, including the majority and the dissenting G-2 and Air Force intelligence officials
  agent: The intelligence estimators
  agent_role: decide
  situation: The estimators are assessing how Soviet leaders might respond to possible Chinese actions. One assessment expects
    the Kremlin generally to avoid courses carrying substantial risk of general war, while recognizing that Soviet leaders
    might counter an action they viewed as an imminent threat to Soviet security. The estimate also describes Soviet leaders
    as increasingly able to apply pressure when they see dissension or weakness among the United States and its allies, yet
    extremely reluctant to risk a contest expected to bring nuclear attack on the USSR. A dissenting assessment allows that
    Soviet leaders might support Chinese actions if they expected the conflict to remain localized and to damage U.S. interests
    more than Communist interests. That dissent also expects Soviet leaders to press the Chinese to avoid hostilities if they
    anticipate a severe Communist defeat or full-scale Soviet participation in general war.
  question: What should the intelligence estimators assess about Soviet leaders' likely response to Chinese actions that might
    risk general war or remain localized?
  options:
    O1:
      do: The intelligence estimators assess Soviet leaders as likely to support Chinese actions expected to remain localized
        and damage U.S. interests more.
      move: act
      irreversible: false
    O2:
      do: The intelligence estimators assess Soviet leaders as likely to oppose Chinese actions carrying substantial risk
        of general war.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The estimate assesses that the size of Soviet armed forces-in-being will remain approximately constant during the
      period covered, while their overall effectiveness will increase.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The majority assessment expects the Kremlin generally to avoid courses of action that entail substantial risk of
      general war.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The majority assessment expects the Kremlin to become more willing to apply heavy pressure when it sees major dissension
      or weakness among the United States and its allies.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The majority assessment describes the Kremlin as extremely reluctant to precipitate a contest in which the USSR
      would expect to be subjected to nuclear attack.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The majority assessment says Soviet leaders would not be deterred by general-war risk from counteracting a Western
      action they considered an imminent threat to Soviet security, and that an unintended general war could follow a series
      of actions and counteractions.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The dissenting assessment allows that Soviet leaders might support Chinese actions if they judged the conflict could
      remain localized in the Far East and cause greater relative damage to U.S. strengths than to Communist strengths.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The dissenting assessment expects Soviet leaders to pressure the Chinese to avoid courses of action if they believe
      the conflict would severely defeat Communism or lead to full-scale Soviet participation in general war.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: 'The majority expects the Kremlin generally to avoid courses carrying substantial risk of general war and to be extremely
      reluctant to risk a contest in which the USSR expects nuclear attack. This is not an absolute rule: it would not deter
      counteraction against a Western action viewed as an imminent Soviet security threat, and general war could emerge unintentionally
      from successive actions and counteractions.'
  - id: C2
    facts:
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The dissent allows Soviet support for Chinese actions if Soviet leaders judge the conflict likely to remain localized
      and to cause greater relative damage to U.S. than Communist strengths.
  - id: C3
    facts:
    - F7
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: Even under the dissent, Soviet leaders would likely press the Chinese to avoid hostilities if they expect a severe
      Communist defeat or full-scale Soviet participation in general war.
  - id: C4
    facts:
    - F3
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: The majority expects the Kremlin to apply heavier pressure when it sees major dissension or weakness among the United
      States and its allies. That expectation qualifies a simple picture of restraint, but does not by itself establish that
      Soviet leaders would support Chinese actions.
  reasoning:
    read: This is a divided estimate of Soviet choices, not a single unconditional prediction. The central distinction is
      between Chinese actions expected to risk general war and a conflict Soviet leaders judge can remain localized; the trap
      is treating increased Soviet willingness to apply pressure as equivalent to willingness to risk nuclear war.
    weighing: 'The majority''s general expectation is restraint where substantial general-war risk is involved, grounded in
      the Kremlin''s reluctance to face expected nuclear attack {C1}. The dissent identifies a narrower route to support:
      Soviet leaders may back Chinese actions if they expect a localized conflict that damages U.S. interests more, but expect
      pressure on the Chinese to avoid hostilities if the likely result is severe Communist defeat or full Soviet entry into
      general war {C2} {C3}. The expectation of heavier pressure amid allied weakness qualifies, but does not displace, the
      majority judgment {C4}. The balance depends on Soviet leaders'' estimates of escalation, likely outcome, and relative
      damage.'
    tradecraft: Record the majority estimate and the G-2 and Air Force intelligence dissent as distinct judgments, preserving
      the conditions attached to each. Do not present the dissent's conditional possibility as the community's unqualified
      assessment.
    uncertainty: These are estimates of Soviet leaders' future judgments, and the dissent makes its prediction depend on whether
      they expect a localized conflict and how they assess its likely consequences. General war could arise through actions
      and counteractions neither side initially intended to lead there.
    handoff: The estimators should make and document the collective assessment while identifying the dissenting offices and
      its conditions; the source gives no basis for assigning the judgment to a separate operational decision-maker.
    tempting_wrong:
      option: O1
      pull: The dissent describes circumstances in which Soviet leaders might support Chinese actions.
      why_wrong: That support is conditional on a forecast of localized conflict and greater relative damage to U.S. strengths,
        while the majority's endorsed general assessment is restraint where substantial general-war risk is involved.
    rejected:
      O1: The majority does not endorse likely Soviet support for Chinese actions as a general assessment; it expects restraint
        when substantial general-war risk is involved, while the support case is conditional and dissenting.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessment were that Soviet leaders expected a conflict to remain localized and to cause greater relative damage
        to U.S. strengths than to Communist strengths.
      then: O1
      why: That is the dissent's stated condition for expecting Soviet support for more adventurous Chinese courses of action.
    would_not_change:
    - id: noflip1
      if: Soviet leaders expected a severe defeat for Communism or full-scale Soviet participation in general war.
      why: The dissent itself expects Soviet leaders to press the Chinese to avoid courses of action under those conditions,
        reinforcing O2 rather than reversing it.
    - id: noflip2
      if: The United States and its allies showed dissension or weakness, without a changed assessment that a Chinese-related
        conflict would remain localized.
      why: The majority expects heavier Soviet pressure in response to such weakness, but that expectation alone does not
        establish support for Chinese actions or remove the concern about general-war risk.
    watch_for:
    - id: watch1
      what: Signs of major dissension or weakness among the United States and its allies.
      favors:
      - O1
      why: The majority expects heavier Soviet pressure in those circumstances; this bears on the estimate of Soviet freedom
        of action, but is not by itself evidence that the localized-conflict condition for Chinese support is met.
  lesson: Separate willingness to apply pressure from willingness to accept substantial general-war risk. Preserve conditional
    and dissenting judgments, and make explicit which forecast about escalation and likely consequences would support a different
    assessment.
  limits: This assessment concerns the estimators' forecast of Soviet responses during the period covered by the estimate;
    it is not a general rule about Soviet behavior in other periods or circumstances. It does not resolve what Soviet leaders
    would judge in a particular later crisis.
