case:
  id: DR-CORPUS-NX-9aac7688-E1@v1
  title: 'Berlin Border Closure: Force or Restraint'
  status: draft
  setting: Berlin, 12–13 August 1961; the Allied powers
  decider: The Allied powers
  agent: The Allied powers
  agent_role: decide
  situation: East German troops closed the sector border between East and West Berlin. The closure physically divided families
    and cut off the livelihoods of thousands of Berliners. The Allied powers faced a choice about whether to use military
    force against the closure or limit their response to nonmilitary measures. They felt unable to respond except through
    military action. They assessed that military action probably would have led to war.
  question: 'What should the Allied powers do in response to the sector-border closure: use military force or limit their
    response to patrols and diplomatic protests?'
  options:
    O1:
      do: The Allied powers decline military force and limit response to patrols and diplomatic protests.
      move: act
      irreversible: false
    O2:
      do: The Allied powers authorize a military force response against the closed sector border.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: East German troops closed the sector border between East and West Berlin over the night of 12–13 August 1961.
  - id: F2
    kind: situation
    status: confirmed
    fact: The troops first used barbed wire and then began building the Berlin Wall.
  - id: F3
    kind: situation
    status: confirmed
    fact: The closure physically divided families.
  - id: F4
    kind: situation
    status: confirmed
    fact: The closure cut off the livelihoods of thousands of Berliners.
  - id: F5
    kind: situation
    status: assessed
    fact: The Allied powers felt unable to respond except through military action.
  - id: F6
    kind: situation
    status: assessed
    fact: Military action probably would have led to war.
  - id: F7
    kind: capability
    status: assessed
    fact: Patrols and diplomatic protests were nonmilitary response measures.
  considerations:
  - id: C1
    facts:
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The Allied powers assessed that military action probably would have led to war, a grave escalation risk that weighs
      against authorizing force.
  - id: C2
    facts:
    - F3
    - F4
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The closure divided families and cut off livelihoods, making the need to respond salient; the account does not establish
      that military action would remedy those harms.
  - id: C3
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The account links the absence of an expected major tough response to the start of Wall construction, raising concern
      that nonmilitary measures might not deter the closure's continuation.
  - id: C4
    facts:
    - F5
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The Allied powers felt that a response beyond limited measures required military action, while assessing that military
      action probably meant war; that constraint supports accepting a limited response rather than triggering a likely wider
      conflict.
  reasoning:
    read: 'This was a grave harm to Berliners, but the choice was not between harm and a cost-free remedy: the Allied powers
      assessed that military action probably would have led to war. The trap is to let the urgency of the closure obscure
      the escalation risk, while also treating a limited response as if it had no consequences.'
    weighing: The likely-war assessment is the decisive reason for O1 {C1, C4}. The suffering caused by the closure and the
      indication that the absence of a major tough response did not deter Wall construction count against a limited response
      {C2, C3}. On the account's stated balance, however, those concerns do not outweigh the assessed risk of war. The balance
      depends especially on whether military action really was likely to produce that escalation.
    tradecraft: Make the choice at the Allied policy level, state explicitly how the assessed risk of war weighs against the
      harms of the closure, and record the assumptions behind that assessment. Revisit the decision if the escalation assessment
      or the expected effect of nonmilitary measures materially changes.
    uncertainty: The account describes war as probable, not certain, and does not establish whether a different nonmilitary
      response could have deterred further construction. It also does not provide a legal rule or authority determination
      that settles the choice.
    handoff: The Allied powers must decide collectively; given the risk of war and the allied character of the decision, consultation
      among the responsible Allied political and military authorities is appropriate. The account does not identify a single
      decision-maker or specify an approval process.
    tempting_wrong:
      option: O2
      pull: Authorizing force can appear to be the only response commensurate with the severe human consequences of the closure.
      why_wrong: 'That impulse does not resolve the central risk: the Allied powers assessed that military action probably
        would have led to war.'
    rejected:
      O2: Military force was not chosen because the Allied powers assessed that it probably would have led to war.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible reassessment found that military action would not probably lead to war.
      then: O2
      why: Removing the decisive escalation concern could make force preferable in light of the severe harms and the apparent
        failure to deter further construction.
    would_not_change:
    - id: noflip1
      if: The closure continued to divide families and disrupt livelihoods, without any change in the assessed likelihood
        that military action would lead to war.
      why: Those harms are serious, but on the stated balance alone they do not displace the central risk of a wider war.
    watch_for:
    - id: watch1
      what: Whether the other side continues to interpret a limited response as evidence that no major tough reaction is expected.
      favors:
      - O2
      why: The account connects that expectation with the start of Wall construction, so evidence of continuing deterrence
        failure would increase the pressure to reconsider the response.
  lesson: When a response to a grave wrong carries a credible risk of widening conflict, compare the harm being addressed
    with the consequences of escalation rather than treating force as the only meaningful answer. A limited response still
    requires attention to whether it is failing to deter further harm.
  limits: This reasoning applies to the choice framed here and depends on the assessment that military action probably would
    have led to war. The account does not establish a legal rule, the likely effectiveness of other responses, or what course
    would be warranted if the escalation assessment changed.
