case:
  id: DR-CORPUS-NX-442703ae-E32@v1
  title: Authorization and the Conventional Alternative
  status: draft
  setting: Corps-level battle planning within a 72-hour planning horizon.
  decider: The release authority decides whether to authorize; the corps commander decides whether to request authorization.
  agent: The release authority
  agent_role: decide
  situation: A corps commander is planning an integrated battle involving close-in and follow-on forces. The commander is
    considering whether to seek authorization for nuclear use. The scenario assesses such use as advantageous, but authorization
    may not be granted in time. If release is not forthcoming, the commander must fight with conventional systems and maintain
    a strong conventional option. The plan is intended to maximize the remaining conventional power.
  question: What should the release authority do when the corps commander seeks nuclear authorization and maintains a conventional
    alternative?
  options:
    O1:
      do: The release authority authorizes the request, and the corps commander retains a conventional alternative.
      move: act
      irreversible: true
    O2:
      do: The release authority denies the request, and the corps commander retains a conventional alternative.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The corps commander treats close-in and follow-on fighting as an integrated battle.
  - id: F2
    kind: situation
    status: confirmed
    fact: The corps commander plans 72 hours into the future.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The scenario assesses early nuclear use as advantageous.
  - id: F4
    kind: authority
    status: assessed
    fact: The corps commander cannot assume authorization will be granted in time.
  - id: F5
    kind: situation
    status: confirmed
    fact: If authorization is not granted in time, the battle must be fought with conventional systems.
  - id: F6
    kind: capability
    status: confirmed
    fact: The commander must have a strong conventional option if nuclear release is not forthcoming.
  - id: F7
    kind: capability
    status: assessed
    fact: The plan described is intended to maximize the remaining conventional power.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Early nuclear use is assessed as advantageous, giving a reason to authorize rather than default to conventional-only
      fighting.
  - id: C2
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Integrated planning for the close-in and follow-on battle across a 72-hour horizon is intended to gain the initiative,
      win the fight, and do so quickly.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    - O1
    weight: strong
    why: Authorization may not arrive in time, so the commander must retain a strong conventional option. That contingency
      is necessary under either authorization decision, and the plan aims to maximize remaining conventional power.
  reasoning:
    read: This is an authorization decision within an integrated battle plan, not a choice between nuclear use and having
      no fallback. Nuclear use is assessed as advantageous, while authorization may not be timely and a strong conventional
      alternative is required.
    weighing: The assessed advantage of nuclear use and the need to plan the close-in and follow-on battle together favor
      {O1} {C1} {C2}. The possibility that authorization may not be granted in time does not displace that advantage; it makes
      the conventional alternative essential under either choice {C3}. The recommendation depends on the stated assessment
      that nuclear use is advantageous and does not establish a general rule for other circumstances.
    tradecraft: The release authority should make and document its own authorization decision, distinguish that decision from
      the commander's request, and preserve the conventional contingency rather than treating authorization as assured.
    uncertainty: The passage does not specify the release authority's legal criteria, other authorization constraints, or
      how to resolve considerations absent from the operational assessment. The recommendation is limited to the stated scenario
      assessment.
    handoff: The release authority decides whether to authorize; the corps commander remains responsible for requesting authorization
      and maintaining the conventional alternative. No additional decision-maker is identified.
    tempting_wrong:
      option: O2
      pull: Denial avoids relying on an authorization that may not arrive in time and leaves the conventional plan as the
        sole course.
      why_wrong: The possibility of non-authorization is a contingency to plan for, not a reason to discard an option assessed
        as advantageous.
    rejected:
      O2: Denial is not chosen because nuclear use is assessed as advantageous and the conventional alternative is a necessary
        fallback, not a substitute for considering authorization.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessment that nuclear use is advantageous no longer holds.
      then: O2
      why: The principal stated reason for authorization would be absent, while the need for a conventional option would remain.
    would_not_change:
    - id: noflip1
      if: The commander continues to maintain a strong conventional alternative.
      why: That contingency is required whether authorization is granted or not; on its own, it does not negate the assessment
        favoring authorization.
    watch_for: []
  lesson: When an authorization-dependent course is assessed as advantageous but authorization may not be forthcoming, preserve
    a credible alternative rather than assuming approval or treating uncertainty alone as a reason to deny. Decide on the
    merits of the request while keeping the contingency viable.
  limits: This recommendation applies only to the operational assessment and conditions in the stated scenario. It does not
    establish a legal standard for release or resolve civilian and other consequences not included in the assessment, and
    should not be generalized to materially different circumstances.
  library:
    domain: military-operational
    family: CORPUS-NX-442703ae
