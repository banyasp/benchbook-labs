case:
  id: DR-CORPUS-NX-442703ae-E85@v1
  title: The Attack Order Under Political Pressure
  status: draft
  setting: Virginia, opening days of the war; the President and a council of war.
  decider: The President
  agent: The President
  agent_role: decide
  situation: In the opening days of the war, northern politicians are pressing for an advance. The volunteers have three-month
    terms, with only a few weeks remaining. Returning them home without striking a blow is expected to carry political repercussions.
    The President has convened a council of war and must decide whether to authorize an attack.
  question: What should the President do about authorizing an attack while political pressure is high and the volunteers’
    service terms are nearly over?
  options:
    O1:
      do: The President authorizes the general to attack before the volunteers’ terms expire.
      move: act
      irreversible: false
    O2:
      do: The President declines to authorize the general to attack before the volunteers’ terms expire.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision arose in the opening days of the war.
  - id: F2
    kind: situation
    status: confirmed
    fact: Northern politicians demanded an advance toward Richmond.
  - id: F3
    kind: situation
    status: confirmed
    fact: The volunteers had three-month terms of service.
  - id: F4
    kind: situation
    status: confirmed
    fact: The volunteers had only a few weeks of service remaining.
  - id: F5
    kind: situation
    status: assessed
    fact: There would be political repercussions if the volunteers returned home without striking a blow.
  - id: F6
    kind: authority
    status: confirmed
    fact: The President convened a council of war.
  considerations:
  - id: C1
    facts:
    - F2
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The politicians' demand for an advance created pressure to act, although that pressure alone does not establish a
      military justification.
  - id: C2
    facts:
    - F3
    - F4
    equity: tempo
    favors:
    - O1
    weight: weak
    why: Only a few weeks remained in the volunteers' three-month terms, creating pressure to act before their service ended.
  - id: C3
    facts:
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The expected political repercussions of sending the volunteers home without striking a blow were the stated reason
      for acting before their terms ended.
  reasoning:
    read: 'The immediate choice was whether to authorize action before the volunteers'' service ended, with political repercussions
      expected if they went home without striking a blow. The trap is to treat political demand as proof that an attack is
      sound: the offensive principle was being misapplied, even as the President ordered an attack.'
    weighing: The stated reason for choosing {O1} is the political cost of returning the volunteers without a blow, intensified
      by their short remaining terms {C2} {C3}. The politicians' demand adds pressure {C1}, but political pressure itself
      does not establish that the attack was militarily sound; the outcome rests on the stated political consequence.
    tradecraft: Keep the authorization decision distinct from the separate question of how any attack would be conducted.
      Record the political rationale and the risk that political pressure may be mistaken for a substantive military reason.
    uncertainty: The anticipated political repercussions are an assessment, not a quantified or independently confirmed consequence.
      The excerpt gives no further evaluation of the President's decision beyond its stated political rationale and its description
      as a misapplication of the offensive principle.
    handoff: The President decides, with the council of war already convened; no other approval authority is identified.
    tempting_wrong:
      option: O2
      pull: Declining to authorize an attack could seem prudent because political pressure alone does not demonstrate that
        an attack is sound.
      why_wrong: 'It does not address the stated reason for acting: the expected political repercussions of sending the volunteers
        home without striking a blow.'
    rejected:
      O2: The President did not choose to withhold authorization, because the expected political cost of the volunteers returning
        without a blow was the stated reason to order an attack.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The volunteers had substantial service time remaining and no political repercussions were expected from their returning
        without a blow.
      then: O2
      why: The stated time pressure and political reason for authorizing an attack would be absent.
    would_not_change:
    - id: noflip1
      if: Northern politicians continued to demand an advance, but no political repercussions were expected from returning
        the volunteers without a blow.
      why: The politicians' demand alone would not preserve the stated reason for ordering the attack.
    watch_for:
    - id: watch1
      what: Whether the volunteers' terms are close to ending and whether returning them without striking a blow is expected
        to carry political repercussions.
      favors:
      - O1
      why: These are the stated grounds for acting before the service terms expire.
  lesson: A short decision window and anticipated political consequences can explain why an authority acts, but they do not
    by themselves establish that the action is substantively sound. Separate the recorded reason for acting from the merits
    of the action, and make that distinction explicit.
  limits: 'This reasoning applies to the narrow choice framed here: whether to authorize an attack before the volunteers''
    terms ended. The excerpt provides no legal standard, full assessment of military merits, or basis for assessing how any
    attack should be conducted.'
