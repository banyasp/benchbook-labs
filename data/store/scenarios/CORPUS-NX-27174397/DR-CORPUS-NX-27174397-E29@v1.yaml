case:
  id: DR-CORPUS-NX-27174397-E29@v1
  title: St. Mihiel Attack Decision
  status: draft
  setting: St. Mihiel salient, September 11, 1918, AEF staff meeting at Ligny-en-Barrois.
  decider: The AEF commander
  agent: The AEF commander
  agent_role: decide
  situation: On September 11, 1918, the AEF commander faced a decision about the planned September 12 attack on the St. Mihiel
    salient. Multiple intelligence assessments indicated that German forces were withdrawing or had begun to withdraw. Radio
    intelligence presented evidence that German stations remained in their usual positions and were active, creating a conflicting
    picture. Staff members warned that the scheduled artillery barrage might waste ammunition and urged waiting until German
    forces had withdrawn. The information available left uncertainty about whether the salient remained occupied.
  question: What should the AEF commander do about the planned barrage and attack on the St. Mihiel salient?
  options:
    O1:
      do: The AEF commander declines the planned barrage and attack on the salient.
      move: act
      irreversible: false
    O2:
      do: The AEF commander authorizes the planned barrage and attack on the salient.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The AEF commander had to decide whether and how the planned attack would proceed.
  - id: F2
    kind: situation
    status: confirmed
    fact: The American attack on the St. Mihiel salient was planned for September 12, 1918.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Other intelligence indicated that German forces were withdrawing from the salient.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Radio intelligence indicated that German stations remained in their usual positions and were active.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The radio intelligence map was the Intelligence Section's only direct evidence that German forces remained in the
      salient.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The radio intelligence evidence showed three lines of German stations in place.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Staff members considered the scheduled artillery barrage likely to waste ammunition and advised waiting to occupy
      the salient after German forces had withdrawn.
  considerations:
  - id: C1
    facts:
    - F3
    - F7
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: The withdrawal assessments made the scheduled barrage seem likely to waste ammunition, which supported waiting; this
      concern had to be weighed against the contrary radio evidence.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The radio map was the Intelligence Section's only direct evidence that German forces remained, showing three lines
      of stations still in their usual positions and active. The First Army G2 relied on this evidence to argue for the planned
      barrage.
  - id: C3
    facts:
    - F2
    - F4
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The Germans were still in the salient, and the source judges that attacking without the preparatory artillery fire
      might have cost many more American lives.
  reasoning:
    read: This was a decision under conflicting intelligence, not a settled finding that the Germans had withdrawn. The trap
      was to treat the broader withdrawal assessments as conclusive while discounting the only direct evidence that German
      stations remained in place and active.
    weighing: The risk of wasting ammunition and the assessments of withdrawal favored waiting, but the radio map showed three
      lines of stations in their usual positions and activity, evidence the First Army G2 considered decisive for proceeding.
      The account's judgment that the Germans remained in the salient, and that omitting the preparatory barrage might have
      cost more American lives, supports {O2}; the balance depended on whether the radio evidence was credible enough to outweigh
      the withdrawal assessments.
    tradecraft: Make the decision from the competing assessments and their significance, without confusing uncertainty with
      confirmation of withdrawal. Preserve a concise rationale identifying the evidence that outweighed the ammunition concern
      and the risk to American lives.
    uncertainty: 'The evidence conflicted: other intelligence indicated withdrawal, while the radio map showed stations still
      in their usual positions and active. The map was direct evidence of station presence, not certainty about the location
      of every German force.'
    handoff: The commander should hear the competing assessments from the staff and the First Army G2, whose evidence persuaded
      the group, while retaining responsibility for the decision.
    tempting_wrong:
      option: O1
      pull: Waiting appeared to avoid a barrage that might waste ammunition if the Germans had already withdrawn.
      why_wrong: It would discount the only direct evidence that German stations remained in place and active, despite the
        risk that attacking without preparatory artillery fire could cost more American lives.
    rejected:
      O1: The commander did not wait because the First Army G2 persuaded the staff that the evidence of German stations in
        place justified using the planned barrage and proceeding.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence before the decision confirmed that German forces had withdrawn and that the stations were no longer
        in their usual positions.
      then: O1
      why: That would remove the direct counterweight to the withdrawal assessments and strengthen the case for avoiding a
        potentially wasteful barrage.
    would_not_change:
    - id: noflip1
      if: Other intelligence continued to suggest withdrawal while the map still showed three lines of German stations in
        their usual positions and active.
      why: That combination was the conflict the staff faced; the source's endorsed decision was to proceed because the radio
        evidence was direct and the risk of attacking without the barrage could be greater.
    watch_for:
    - id: watch1
      what: Whether reliable confirmation emerges that the German forces have actually left the salient, rather than merely
        preparing to withdraw.
      favors:
      - O1
      why: Confirmation of departure would make the ammunition-waste concern more compelling and weaken the case for an attack
        on an occupied salient.
  lesson: When intelligence conflicts, weigh the directness and significance of each assessment rather than treating a general
    expectation as proof. A decision should account both for the mission and for the risks to one's own forces of proceeding
    without the preparation judged necessary.
  limits: This reasoning applies to the decision as the AEF staff understood it on September 11, 1918, with the evidence then
    available. It does not establish that a barrage is warranted whenever intelligence conflicts or when evidence of enemy
    presence is uncertain.
