case:
  id: DR-CORPUS-NX-27174397-E37@v1
  title: Whether to Commit the American 36th Division
  status: draft
  setting: Aisne Valley, during the Allied advance; French IV Army, XI Corps.
  decider: The commander of the XI Corps of the French IV Army
  agent: The commander of the XI Corps of the French IV Army
  agent_role: decide
  situation: A German position occupies a narrow strip of land between river bends in the Aisne Valley. Its high ground gives
    its holders a view of Allied movements and the ability to bring artillery fire on Allied forces in the valley. An Allied
    crossing of the Aisne near the position would expose the crossing force’s flank to fire. The French 73rd Division has
    twice tried to dislodge the defenders and suffered heavy losses. The American 36th Division is available for the XI Corps
    commander to commit while the Allied advance is at issue.
  question: 'What should the XI Corps commander do about the German position: commit the American 36th Division to capture
    it or withhold the division and leave the position in German hands?'
  options:
    O1:
      do: The XI Corps commander withholds the American 36th Division from capturing the German position.
      move: act
      irreversible: false
    O2:
      do: The XI Corps commander commits the American 36th Division to capture the German position.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The German position is accessible only by a narrow strip of land between river bends.
  - id: F2
    kind: capability
    status: assessed
    fact: The position’s high ground allows its holders to observe Allied troop movements in the vicinity.
  - id: F3
    kind: capability
    status: assessed
    fact: From the position, the Germans could bring artillery fire on Allied forces in the Aisne Valley.
  - id: F4
    kind: capability
    status: assessed
    fact: An Allied crossing of the Aisne near the position would expose the crossing force’s flank to German fire.
  - id: F5
    kind: situation
    status: confirmed
    fact: The French 73rd Division made two attempts to drive the Germans from the position and was thrown back with heavy
      losses.
  - id: F6
    kind: authority
    status: confirmed
    fact: The decider was the commander of the XI Corps of the French IV Army.
  - id: F7
    kind: capability
    status: confirmed
    fact: The American 36th Division was available for commitment against the position.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The position’s high ground lets its holders observe Allied movements, making it a continuing obstacle to the advance.
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Germans could call artillery fire on Allied forces in the valley; the commander’s stated judgment was that the
      position had to be taken before the advance continued.
  - id: C3
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: A nearby Allied crossing would expose the crossing force’s flank to fire from the position, adding a direct obstacle
      to continued movement.
  - id: C4
    facts:
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The two failed French attacks and heavy losses are a serious caution about the cost of another attempt, although
      the account describes the commander as frustrated and does not say those losses outweighed the position’s strategic
      threat.
  reasoning:
    read: 'The position is not merely a difficult strongpoint: from the high ground it can observe Allied movements, bring
      fire on forces in the valley, and threaten the flank of a nearby river crossing. The trap in withholding the division
      is to treat the two costly failures as the whole decision while leaving that strategic threat in place.'
    weighing: The commander’s stated reason for committing the American 36th Division was that the position had to be taken
      before the Allies continued their advance. Its observation and fire capabilities, including the danger to a crossing
      force’s flank, favor commitment; the French division’s heavy losses are a caution, but the source does not present them
      as outweighing the need to remove the threat. The balance depends on the position continuing to threaten Allied movement
      and a nearby crossing.
    tradecraft: Keep the decision record focused on the commander’s authority, the position’s stated strategic effects, the
      prior costly failures, and why the advance could not continue with the position left in place. Do not treat the decision
      to commit as proof that capture was assured.
    uncertainty: The account gives the strategic rationale and the prior losses, but does not state an expected cost for the
      36th Division’s attempt or assess its likelihood of success.
    handoff: The account places the decision with the XI Corps commander, who decided that the position must be taken and
      ordered the 36th Division to capture it; it gives no indication of a referral to another authority.
    tempting_wrong:
      option: O1
      pull: The French 73rd Division had already been thrown back twice with heavy losses, making withholding the 36th Division
        appear prudent.
      why_wrong: Withholding would leave the observation, artillery, and flank threat in place despite the commander’s stated
        judgment that the position had to be taken before the advance continued.
    rejected:
      O1: The commander did not leave the position in German hands because he judged it had to be taken before the Allied
        advance could continue.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The position no longer enabled observation of Allied movements, artillery fire on forces in the valley, or a flank
        threat to a nearby crossing.
      then: O1
      why: Without the strategic effects that made the position an obstacle to the advance, the stated basis for committing
        the division would be substantially reduced.
    - id: flip2
      if: The American 36th Division were not available for commitment.
      then: O1
      why: The source’s chosen course depends on that division being available; absent it, this choice to commit it could
        not be carried out.
    would_not_change:
    - id: noflip1
      if: The only consideration added were the already recorded two failed French attempts and their heavy losses, while
        the position’s stated strategic threats remained.
      why: Those losses are an important caution, but the commander’s recorded judgment was still that the position had to
        be taken before the advance continued.
    watch_for:
    - id: watch1
      what: Whether the position continues to threaten Allied movements, forces in the valley, or a nearby crossing.
      favors:
      - O2
      why: Those are the strategic effects that support the commander’s stated reason for taking the position.
  lesson: A decision to accept risk should be tied to the operational purpose that makes the risk necessary, not to momentum
    or frustration alone. When a position continues to threaten movement and a crossing, prior losses are a caution to weigh,
    but do not by themselves remove the stated need to address that threat.
  limits: This reasoning applies to the stated choice about whether to commit the division against a position threatening
    the Allied advance. The account does not establish a general rule about acceptable losses, likelihood of success, or the
    legal standards governing the later assault.
