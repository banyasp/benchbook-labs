case:
  id: DR-CORPUS-NX-f027f127-E1@v1
  title: Recovering an Aircraft After a Gear Malfunction
  status: draft
  setting: BO airfield, pre-dawn at approximately 0252Z, military aviation operation.
  decider: The mishap pilot
  agent: The mishap pilot
  agent_role: decide
  situation: A landing-gear door malfunction prevented the aircraft's gear from fully retracting after takeoff. The gear was
    extended in a normal configuration, and no other malfunctions were present. It was pre-dawn, and the mishap pilot was
    concerned that aircraft activity near the BO could be waking inhabitants. The assigned combat mission remained incomplete,
    leaving a choice about whether to recover the aircraft or continue the mission.
  question: What should the mishap pilot do about the aircraft and the assigned combat mission?
  options:
    O1:
      do: The mishap pilot suspends the sortie at the BO airfield and seeks further direction from the operations supervisor.
      move: ask
      irreversible: false
      to: the operations supervisor
    O2:
      do: The mishap pilot continues the assigned combat sortie in the current aircraft and retains the mission tasking.
      move: act
      irreversible: false
    O3:
      do: The mishap pilot ends the current sortie, returns to the BO airfield, and transfers to a spare aircraft.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: A landing-gear door malfunction prevented the aircraft's landing gear from being fully retracted after takeoff.
  - id: F2
    kind: situation
    status: confirmed
    fact: The mishap pilot informed the other pilot of the gear problem.
  - id: F3
    kind: capability
    status: confirmed
    fact: The landing gear was extended in a normal configuration.
  - id: F4
    kind: capability
    status: confirmed
    fact: No other malfunctions existed.
  - id: F5
    kind: situation
    status: confirmed
    fact: The assigned combat mission remained to be flown, and the mishap pilot's stated plan was to recover and move to
      a spare aircraft to launch again.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The mishap pilot was concerned that aircraft activity near the BO during the pre-dawn hour was likely waking inhabitants.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The aircraft had a landing-gear door malfunction and was to continue with the gear extended, although it was in a
      normal configuration and had no other malfunctions. This was the aircraft condition in which the pilot chose to recover
      rather than continue the assigned sortie.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The pilot's stated plan was to land as soon as possible, move to a spare aircraft, and launch again for the assigned
      combat mission. Recovery was presented as a way to resume the incomplete mission, not abandon it.
  - id: C3
    facts:
    - F6
    equity: third_party_harm
    favors:
    - O3
    weight: weak
    why: The pilot was concerned that pre-dawn aircraft activity near the airfield was waking inhabitants. This supports avoiding
      prolonged activity near them, though the stated response to that concern was to move away; it was not identified as
      the reason for the recovery plan.
  reasoning:
    read: 'This was an operational choice after a gear-door malfunction, not a record that every aircraft system had failed:
      the gear was in a normal configuration and no other malfunctions existed. The trap is to treat either the gear problem
      as proof that the mission could not continue, or the lack of other malfunctions as a reason the pilot should press on.
      The stated plan was to recover and use a spare aircraft to launch again.'
    weighing: The strongest stated reason for O3 was to recover promptly and transfer to a spare so the assigned combat mission
      could still be flown {C2}. The gear condition formed part of the circumstances for that choice, but the source does
      not say that it made the aircraft incapable of continuing {C1}. Concern about waking inhabitants was relevant to activity
      near the airfield, but is not given as the reason for ending the sortie {C3}. The balance depends in part on the stated
      availability and intended use of a spare aircraft.
    tradecraft: Make the recovery choice and its mission rationale clear to the relevant operational and airfield authorities;
      record the known aircraft condition, the plan to use a spare, and any unresolved coordination. Keep the record at the
      decision level rather than adding flight-procedure details.
    uncertainty: The available account does not report the result of the return request, whether a spare was ultimately available,
      or a comparison of the alternatives. It gives no separate legal standard or finding that the aircraft was unable to
      continue.
    handoff: The pilot made the operational choice while coordinating with the operations supervisor and the tower; the return
      request was directed to the tower. The account supports coordination, but does not indicate that the pilot deferred
      the recovery decision for further direction.
    tempting_wrong:
      option: O2
      pull: The gear was in a normal configuration and there were no other malfunctions, while the combat mission remained
        incomplete.
      why_wrong: Those facts do not displace the pilot's stated plan to recover promptly and transfer to a spare aircraft
        so the mission could be launched again.
    rejected:
      O1: The account records coordination with operational and airfield authorities, but the pilot's stated course was prompt
        recovery and transfer to a spare rather than suspending the sortie to seek further direction.
      O2: The pilot chose not to continue the assigned combat sortie in the current aircraft, instead planning to recover
        and relaunch in a spare.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A qualified operational assessment found that the current aircraft's condition was acceptable for the assigned sortie
        and no suitable spare aircraft was available.
      then: O2
      why: That would remove the stated advantage of recovering to relaunch in a spare and could make continuing the mission
        in the current aircraft the better-supported course.
    - id: flip2
      if: The pilot lacked sufficient information or authority to decide whether recovery or continuation was appropriate.
      then: O1
      why: Seeking direction would then address an unresolved operational decision rather than defer a choice the pilot had
        already made.
    would_not_change:
    - id: noflip1
      if: No other malfunctions were present.
      why: That fact alone would not erase the pilot's stated plan to recover and use a spare to resume the assigned mission.
    watch_for:
    - id: watch1
      what: Whether a spare aircraft is available for the planned relaunch.
      favors:
      - O3
      why: Availability bears directly on whether recovery can support the stated goal of getting the incomplete mission airborne
        again.
  lesson: When an aircraft has a malfunction but the source does not establish that it is wholly incapable of continuing,
    do not invent a categorical safety rule. Weigh the known condition against the stated operational plan; here, recovery
    was chosen to transfer to a spare and resume the assigned mission.
  limits: This reasoning does not establish a general rule that an aircraft with a gear malfunction must return or may continue.
    It also does not resolve cases with different aircraft assessments, mission urgency, spare-aircraft availability, or governing
    orders.
