      option_words:
        O1: 13
        O3: 11
        O2: 13
      real_option: O3
      real_to_mean_other_length: 0.85
      real_is_longest: false
      moves:
        O1: act
        O3: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O3: true
        O2: true
    equities: pilot2
verdict_tier: source-endorsed
