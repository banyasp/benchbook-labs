case:
  id: DR-CORPUS-NX-c2c8f119-E2@v1
  title: The Commission’s Assassination-Plots Inquiry
  status: draft
  setting: United States, 1975, Commission
  decider: The Commission
  agent: The Commission
  agent_role: decide
  situation: The Commission was considering whether to investigate CIA assassination plots against foreign leaders. Its members
    held opposing views about whether the inquiry should proceed. The Commission lacked time to conduct a full investigation.
    A Senate investigation into the subject was ongoing. The Commission had to decide how to handle its inquiry and the materials
    concerning it.
  question: What should the Commission do with the assassination-plots inquiry when it lacks time for a full investigation?
  options:
    O1:
      do: The Commission continues its inquiry with a full investigation of the assassination-plots question.
      move: act
      irreversible: false
    O2:
      do: The Commission discontinues its inquiry without a full investigation of the assassination-plots question.
      move: act
      irreversible: true
    O3:
      do: The Commission transfers its inquiry materials to the ongoing Senate investigation.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Commission faced the question of whether to investigate CIA assassination plots against foreign leaders.
  - id: F2
    kind: situation
    status: confirmed
    fact: One Commission member opposed investigating the plots.
  - id: F3
    kind: situation
    status: confirmed
    fact: Another Commission member supported investigating the plots.
  - id: F4
    kind: situation
    status: assessed
    fact: The pro-investigation position influenced other commissioners and became the majority view.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Commission ran out of time to conduct a full investigation of the assassination-plots question.
  - id: F6
    kind: situation
    status: confirmed
    fact: A Senate investigation into the subject was ongoing.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: strong
    why: The position that the Commission should investigate the plots influenced other commissioners and became the majority
      view, favoring continued attention to the question rather than simply abandoning it.
  - id: C2
    facts:
    - F5
    equity: tempo
    favors:
    - O3
    - O2
    weight: strong
    why: The Commission ran out of time for a full investigation. That constraint weighs against continuing as though the
      Commission could complete one, but does not by itself decide whether to transfer the materials or discontinue the inquiry.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: A Senate investigation was ongoing when the Commission lacked time to investigate fully; transferring the materials
      connected the Commission's inquiry to that ongoing investigation.
  reasoning:
    read: The Commission supported investigating the question, but lacked time to conduct a full investigation while a Senate
      investigation was ongoing. The trap is treating that constraint as either a reason to attempt an investigation the Commission
      could not finish or a reason to drop the question altogether.
    weighing: The pro-investigation view became the majority, which weighs against simply discontinuing the inquiry {C1}.
      But the Commission had run out of time for a full investigation {C2}; with a Senate investigation ongoing, transferring
      the materials was the available course that kept the inquiry connected to that work {C3}. The balance depends on the
      time constraint and the existence of that ongoing Senate investigation.
    tradecraft: Record that the Commission favored investigation but could not complete one, and document the transfer of
      its materials to the ongoing Senate investigation.
    uncertainty: The available facts establish that the Commission transferred its materials, but do not establish what the
      Senate investigation later concluded or how it used them.
    handoff: The Commission transferred the materials to the ongoing Senate investigation rather than treating its own lack
      of time as the end of the subject.
    tempting_wrong:
      option: O2
      pull: Discontinuing the inquiry would avoid implying that the Commission had time to conduct a full investigation.
      why_wrong: It would discard the inquiry despite the majority's support for investigating the question and the existence
        of an ongoing Senate investigation that could receive the materials.
    rejected:
      O1: The Commission had run out of time to conduct the full investigation that this option requires.
      O2: The Commission instead transferred the materials to the ongoing Senate investigation rather than discontinue its
        inquiry without a full investigation.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Commission had sufficient time to conduct a full investigation.
      then: O1
      why: Without the stated time constraint, continuing with the full investigation would better match the Commission majority's
        pro-investigation position.
    - id: flip2
      if: The Commission still lacked time for a full investigation, but no Senate investigation was ongoing to receive its
        materials.
      then: O2
      why: Without the available Senate handoff, the stated facts would no longer support transferring the materials to that
        investigation.
    would_not_change:
    - id: noflip1
      if: One member continued to oppose investigating the plots while the pro-investigation position remained the majority
        view.
      why: The recorded opposition did not prevent the pro-investigation view from becoming the majority; with the time constraint
        and ongoing Senate investigation unchanged, it would not alone displace the transfer choice.
    watch_for:
    - id: watch1
      what: Whether the Senate investigation remains ongoing and able to receive the Commission's materials.
      favors:
      - O3
      why: The transfer choice depends on an ongoing Senate investigation being available as the recipient.
  lesson: When an inquiry has majority support but the decision-maker lacks time to complete it, distinguish inability to
    finish from a judgment that the subject should be dropped. If a related investigation is already ongoing, transfer can
    carry the inquiry forward without claiming the original body completed its work.
  limits: This reasoning applies to the stated oversight choice and does not establish what the Senate investigation should
    conclude. It also depends on the Commission's lack of time and the existence of an ongoing Senate investigation.
  library:
    domain: intel-oversight
    family: CORPUS-NX-c2c8f119
    source: https://www.cia.gov/static/56b535e7bab42e0be46940ae48bb552a/Ronald-Reagan-Cold-War.pdf
    episode_focus: The decision point is how the Commission should handle the assassination-plots inquiry when it lacked time
      for a full investigation. Keep the focus on the oversight choice and its stated time constraint; exclude operational
      details of any plots.
