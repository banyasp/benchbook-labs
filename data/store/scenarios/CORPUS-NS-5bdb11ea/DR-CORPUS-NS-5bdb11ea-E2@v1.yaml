case:
  id: DR-CORPUS-NS-5bdb11ea-E2@v1
  title: Managing BCT Personnel Readiness
  status: draft
  setting: During regional deployments and major training events, in a BCT; Army.
  decider: The CSM
  agent: The CSM
  agent_role: decide
  situation: The BCT faces personnel demands associated with regional deployments and major training events. Personnel availability
    for training and deployment requirements is a readiness concern. Soldiers remain on station for an average of 30 months,
    depending on location and MOS, and some have more than 26 months on station. Replacement requisitions can be aligned with
    the five enlisted manning cycles. KD-complete Soldiers can pursue broadening opportunities as drill sergeants or recruiters
    while BOG requirements continue.
  question: What should the CSM do about Soldiers with more than 26 months on station while meeting regional deployment and
    training demands?
  options:
    O1:
      do: The CSM defers PCS requests and asks HRC to review Soldiers over 26 months on station before deciding on moves.
      move: ask
      irreversible: false
      to: HRC
    O2:
      do: The CSM requests PCS moves for Soldiers over 26 months on station and seeks replacement requisitions through the
        five enlisted manning cycles.
      move: act
      irreversible: false
    O3:
      do: The CSM retains Soldiers over 26 months on station in the formation and leaves future moves to HRC's population
        management.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The BCT has regional aligned force deployments.
  - id: F2
    kind: situation
    status: confirmed
    fact: Personnel availability is relevant to the BCT's training and deployment requirements.
  - id: F3
    kind: situation
    status: assessed
    fact: Soldiers remain on station for an average of 30 months, based on location and MOS.
  - id: F4
    kind: situation
    status: confirmed
    fact: Soldiers with more than 26 months on station are present in the formation.
  - id: F5
    kind: capability
    status: confirmed
    fact: Replacement requisitions can be aligned with the five enlisted manning cycles.
  - id: F6
    kind: capability
    status: confirmed
    fact: KD-complete Soldiers can broaden their experience by becoming drill sergeants or recruiters.
  - id: F7
    kind: situation
    status: confirmed
    fact: The BCT must continue to meet boots-on-ground requirements.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The CSM tied proactive personnel action to keeping people available for training and deployment requirements and
      avoiding readiness degradation.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: With Soldiers averaging 30 months on station and some beyond 26 months, requesting PCS moves in exchange for requisitions
      aligned with the five manning cycles was the stated way to avoid personnel shortfalls.
  - id: C3
    facts:
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The action also supported KD-complete Soldiers' broadening opportunities while continuing to meet boots-on-ground
      requirements.
  reasoning:
    read: This is a readiness decision about acting on Soldiers who have been on station more than 26 months, while pairing
      moves with replacement requisitions. The trap is waiting for HRC to manage the population even though personnel availability
      is already a concern for training and deployment.
    weighing: 'The strongest reasons favor O2: the CSM stated that proactive PCS requests, aligned with the five enlisted
      manning cycles, would make personnel available and prevent shortfalls that could degrade readiness. The decision also
      supported broadening opportunities for KD-complete Soldiers while BOG requirements continued. The balance depends on
      replacement requisitions being aligned so that moves do not undermine those requirements.'
    tradecraft: Identify the Soldiers over the stated time-on-station threshold, pair PCS requests with replacement requisitions
      through the five enlisted manning cycles, and track whether training, deployment, and BOG requirements remain supported.
      Record the readiness rationale and the replacement plan.
    uncertainty: The stated rationale does not describe individual circumstances, possible exceptions, or the administrative
      constraints on particular PCS requests. Those details could affect implementation without changing the source's general
      readiness rationale.
    handoff: The CSM should own the readiness judgment and initiate the requests, involving HRC as needed to process PCS moves
      and align replacements; the stated approach was not to wait for HRC to manage the formation's enlisted population.
    tempting_wrong:
      option: O1
      pull: Deferring for HRC review may seem prudent because personnel management involves the higher headquarters.
      why_wrong: The CSM rejected waiting for HRC to manage the population because doing so risked personnel shortfalls affecting
        training and deployment requirements.
    rejected:
      O1: The CSM chose proactive requests rather than deferring the readiness decision to HRC.
      O3: Retaining the Soldiers and leaving future moves to HRC would not address the stated risk of personnel availability
        degrading readiness.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Replacement requisitions could not be aligned with the five enlisted manning cycles.
      then: O1
      why: The stated readiness rationale for moving Soldiers depended on exchanging the moves for aligned requisitions; without
        that support, deferring for review would be prudent.
    - id: flip2
      if: The PCS moves would prevent the BCT from meeting boots-on-ground requirements.
      then: O1
      why: Continued BOG requirements are a constraint; if the moves threaten the ability to meet them, review before proceeding.
    would_not_change:
    - id: noflip1
      if: HRC remains involved in processing personnel actions.
      why: HRC involvement in execution alone would not defeat the CSM's stated reason for initiating requests rather than
        waiting for HRC to manage the population.
    watch_for:
    - id: watch1
      what: Whether replacement requisitions can be aligned in time to support upcoming training and deployment requirements.
      favors:
      - O2
      why: The CSM identified aligned requisitions as the means of avoiding personnel gaps.
  lesson: When personnel availability threatens training or deployment readiness, identify the affected population and pursue
    moves paired with replacements rather than defaulting to delay. Preserve other stated requirements, including BOG, and
    use development opportunities as a supporting consideration.
  limits: This reasoning applies to the described BCT readiness situation and does not establish a universal time-on-station
    rule or settle individual PCS eligibility. A specific constraint on replacement availability or BOG requirements could
    warrant review before moves proceed.
