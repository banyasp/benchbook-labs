case:
  id: DR-CORPUS-NX-d718eb11-E1@v1
  title: Timing the Arrests
  status: draft
  setting: Washington, during the Russian president's visit; U.S. intelligence and executive-branch context.
  decider: The U.S. officials responsible for the arrest decision
  agent: The U.S. officials responsible for the arrest decision
  agent_role: decide
  situation: U.S. officials are weighing when to arrest the individuals. A source wants to defect, and at least two of the
    individuals are planning a family trip to Russia. A defection while the individuals are away is assessed to mean they
    would not be caught. The Russian president is visiting Washington, and the administration is concerned about embarrassing
    him. The timing choice involves operational and political considerations.
  question: What should the U.S. officials responsible for the arrest decision do about the timing of the arrests?
  options:
    O1:
      do: The responsible U.S. officials postpone the arrests until the visiting Russian president leaves Washington.
      move: act
      irreversible: false
    O2:
      do: The responsible U.S. officials advance the arrests before the source defects or the individuals travel to Russia.
      move: act
      irreversible: true
    O3:
      do: The responsible U.S. officials pause the arrest decision while seeking diplomatic coordination with Russian counterparts.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The arrest timing decision involved operational and political considerations.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The source wanted to defect.
  - id: F3
    kind: intelligence
    status: assessed
    fact: At least two of the individuals were planning a family trip to Russia.
  - id: F4
    kind: intelligence
    status: assessed
    fact: If the source defected while the individuals were away, they would not be caught.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Russian president was visiting Washington.
  - id: F6
    kind: situation
    status: assessed
    fact: The administration did not want to embarrass the visiting Russian president.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The source wanted to defect, and if that happened while the individuals were away, they would never be caught. This
      made delay a risk to achieving the arrests.
  - id: C2
    facts:
    - F3
    - F4
    equity: tempo
    favors:
    - O2
    weight: strong
    why: At least two individuals were planning a family trip to Russia; the account treats their absence as part of the time-sensitive
      risk that they would not be caught.
  - id: C3
    facts:
    - F5
    - F6
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: The administration did not want to embarrass the visiting Russian president, a real diplomatic cost of arresting
      during the visit, but the account says the decision balanced this against the operational risks.
  reasoning:
    read: This was a timing choice under a potentially closing operational window, not simply a choice between arresting and
      avoiding diplomatic discomfort. The trap is to let concern about embarrassment obscure the stated risk that a defection
      while the individuals were away would mean they were never caught.
    weighing: The defection risk and planned travel both favor advancing the arrests {C1} {C2}; the president's visit weighs
      against doing so at that moment {C3}. The account says the arrests proceeded despite the political concern. It also
      describes coordination between the CIA director and the SVR chief to arrange a swap, but does not say that this coordination
      was the reason for the arrest timing or that it removed the diplomatic cost.
    tradecraft: Record the operational risk and diplomatic concern as distinct factors, and document why the timing decision
      gives priority to one over the other. Keep any diplomatic coordination around a swap distinct from the decision to delay
      or proceed with arrests.
    uncertainty: The account does not specify how soon the source might defect, when the planned trip would occur, or whether
      the swap was intended to reduce the embarrassment concern. Those details could affect the balance but are not provided.
    handoff: The responsible U.S. officials made the arrest-timing decision. The account identifies coordination by the CIA
      director with the SVR chief over the swap; it does not establish that this coordination was a prerequisite for the arrest
      decision.
    tempting_wrong:
      option: O1
      pull: Postponing until after the Russian president's visit would avoid acting during a moment when the administration
        feared embarrassment.
      why_wrong: 'The stated operational risk was potentially irreversible: if the source defected while the individuals were
        away, they would never be caught.'
    rejected:
      O1: The officials did not postpone until the president left because the risk of losing the opportunity to catch the
        individuals outweighed the concern about embarrassment.
      O3: The officials did not pause for diplomatic coordination before acting; the account instead describes arrests proceeding
        and coordination of a swap.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The source no longer wanted to defect and the planned trip was canceled, removing the stated risk that the individuals
        would be away and never caught.
      then: O1
      why: Without the time-sensitive operational risk, the concern about embarrassing the visiting president could reasonably
        carry greater weight.
    - id: flip2
      if: Diplomatic coordination could be completed before the individuals traveled, without increasing the risk that they
        would escape capture.
      then: O3
      why: A pause would then allow coordination without incurring the operational loss that drove the decision to proceed.
    would_not_change:
    - id: noflip1
      if: The Russian president's visit and the administration's concern about embarrassment remained, while the defection
        and travel risks also remained.
      why: The visit was already part of the balance when the arrests proceeded; by itself, it would not outweigh the stated
        risk of never catching the individuals.
    watch_for:
    - id: watch1
      what: Whether the source's defection or the individuals' travel is becoming imminent.
      favors:
      - O2
      why: The decision depends on whether delay could leave the individuals beyond reach.
  lesson: When delay may permanently foreclose a lawful and important operational outcome, weigh that risk against diplomatic
    costs rather than allowing the costs to decide the timing by default. Where possible, manage diplomatic consequences alongside
    the operational decision instead of assuming they require postponement.
  limits: This reasoning applies where the stated risk of losing the opportunity to act is credible and time-sensitive. It
    does not establish that arrests should generally proceed during a diplomatic visit, or address legal authority, arrest
    procedures, or the terms of any exchange.
  library:
    domain: operational-command
    family: CORPUS-NX-d718eb11
    source: https://www.cia.gov/resources/csi/static/d29678665ef8d8a65bef80f6deb95549/IO-Bookshelf-Jun2020.pdf
