      delay amid concern about embarrassing the visiting Russian president. The passage says the arrests proceeded and describes
      coordination of a swap; exclude surveillance methods and other operational details, which are not part of the policy
      choice.
    cues:
      option_words:
        O1: 14
        O2: 17
        O3: 15
      real_option: O2
      real_to_mean_other_length: 1.17
      real_is_longest: true
      moves:
        O1: act
        O2: act
        O3: hold
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
        O3: false
    equities: pilot2
