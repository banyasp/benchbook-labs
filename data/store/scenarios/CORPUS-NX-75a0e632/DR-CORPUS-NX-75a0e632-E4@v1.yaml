case:
  id: DR-CORPUS-NX-75a0e632-E4@v1
  title: Rescue Authorization in Tehran
  status: draft
  setting: Tehran, Iran; 1979; US government
  decider: The President of the United States
  agent: The President of the United States
  agent_role: decide
  situation: On 4 November 1979, militant Islamic students took over the US Embassy in Tehran and held 66 US personnel hostage.
    Six US State Department employees avoided capture and took refuge in homes of Canadian Embassy officers. The President
    faced a proposal to rescue the six from Iran; they had no intelligence background, and planning required extensive coordination
    between the US and Canadian governments. Failure threatened the six’s safety and posed considerable risk of worldwide
    embarrassment to both countries. Iran’s strict immigration exit controls added to the challenge.
  question: What should the President of the United States do about the proposed rescue operation for the six Americans in
    Iran?
  options:
    O1:
      do: The President defers the proposed rescue decision pending further assessment and coordination.
      move: hold
      irreversible: false
    O2:
      do: The President declines authorization for the proposed rescue operation for the six Americans.
      move: act
      irreversible: false
    O3:
      do: The President authorizes the proposed rescue operation for the six Americans.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 4 November 1979, militant Islamic students took over the US Embassy in Tehran and held 66 US personnel hostage.
  - id: F2
    kind: situation
    status: confirmed
    fact: Six US State Department employees avoided capture and took refuge in homes of Canadian Embassy officers.
  - id: F3
    kind: situation
    status: confirmed
    fact: The proposed operation was to rescue the six Americans from Iran.
  - id: F4
    kind: capability
    status: confirmed
    fact: The six Americans had no intelligence background.
  - id: F5
    kind: situation
    status: confirmed
    fact: Planning required extensive coordination within the US and Canadian Governments.
  - id: F6
    kind: situation
    status: assessed
    fact: Failure threatened the safety of the six Americans.
  - id: F7
    kind: situation
    status: assessed
    fact: Failure posed considerable risk of worldwide embarrassment to the US and Canada.
  - id: F8
    kind: situation
    status: confirmed
    fact: Iran had strict immigration exit controls.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The six employees were in refuge after avoiding capture, and failure threatened their safety. The rescue proposal
      addressed the immediate welfare of these specific people.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The proposed operation's purpose was to rescue the six; declining would leave that purpose unmet while their safety
      remained threatened.
  - id: C3
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O1
    - O2
    weight: strong
    why: Failure carried considerable risk of worldwide embarrassment to both the United States and Canada, a serious consequence
      of proceeding without adequate confidence in the plan.
  - id: C4
    facts:
    - F4
    - F5
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The six lacked intelligence backgrounds, planning required extensive coordination, and Iran's strict exit controls
      made the operation difficult. These were real challenges supporting careful assessment, though the President approved
      after options were considered.
  reasoning:
    read: This was a rescue decision involving six employees who had avoided capture, not a choice free of risk. Failure threatened
      their safety and could embarrass both governments; the employees' lack of intelligence background, coordination demands,
      and Iran's exit controls made planning difficult.
    weighing: The source records that numerous options were considered and the President approved the operation. The balance
      implicit in that outcome gives priority to rescuing the six despite substantial execution and reputational risks. The
      decision depends on a plan judged sufficiently credible after considering those challenges; the source does not set
      out a formal threshold for that judgment.
    tradecraft: At the decision level, document the assessed risks to the six and to both governments, the alternatives considered,
      the basis for judging the proposal viable, and who holds approval responsibility. Confirm the necessary intergovernmental
      coordination and establish decision points for pausing or reconsidering if key assumptions fail. Do not include sensitive
      operational methods in a general decision record.
    uncertainty: The source identifies major risks and says options were considered, but does not describe the alternatives
      in detail, the President's full rationale, or a formal risk threshold. The relative weight assigned to safety and embarrassment
      is therefore inferred from the approval and the outcome, not stated as a balancing test.
    handoff: The President held the decision, while extensive coordination between the United States and Canadian governments
      was required. The decision should therefore remain with the President and be informed by the relevant US and Canadian
      officials responsible for assessing coordination and risk.
    tempting_wrong:
      option: O1
      pull: The challenges and possible worldwide embarrassment could make waiting for further assessment seem prudent.
      why_wrong: The source records that options were considered before approval, and the safety of the six was at stake.
        It supplies no reason to assume that further delay would improve their position.
    rejected:
      O1: 'Further deferral was not chosen: after considering numerous options, the President approved the rescue despite
        the identified challenges.'
      O2: Declining was not chosen because the rescue addressed the threatened safety of the six, and the President judged
        the proposed operation worth authorizing despite the risks.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible assessment showed that proceeding would materially increase danger to the six compared with a short deferral.
      then: O1
      why: The case for authorization rests substantially on addressing the threat to the six; evidence that delay would better
        protect them could reverse that balance.
    - id: flip2
      if: Essential US-Canadian coordination could not be secured or the proposal could not be judged viable after further
        assessment.
      then: O1
      why: The source identifies extensive coordination and difficult exit controls as material challenges; unresolved obstacles
        would weaken the basis for authorization.
    - id: flip3
      if: Further assessment established that no feasible rescue could protect the six and that authorization would expose
        them to greater danger without a reasonable prospect of rescue.
      then: O2
      why: If the proposal could not serve its protective purpose and instead materially worsened the danger, declining would
        be preferable to authorizing it.
    would_not_change:
    - id: noflip1
      if: The six still lacked intelligence backgrounds, without additional evidence that this alone made the proposal unworkable.
      why: That limitation was present in the situation in which the President approved the operation; by itself it does not
        overturn the recorded outcome.
    watch_for:
    - id: watch1
      what: Whether the assessed risk of failure to the six or the risk of worldwide embarrassment changes materially as planning
        proceeds.
      favors:
      - O1
      why: A significant change could justify reassessing whether authorization remains warranted.
  lesson: When people face a serious safety threat, substantial operational and reputational risks do not by themselves require
    declining a rescue. Consider the available alternatives and whether the plan is credible, and weigh the risk of acting
    against the consequences of leaving the people in danger.
  limits: This reasoning does not establish that every proposed rescue should be authorized or that reputational risk is secondary
    in every case. It applies to the source's stated circumstances and does not supply a general legal standard or a detailed
    account of the President's risk assessment.
