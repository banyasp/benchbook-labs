case:
  id: DR-CORPUS-NX-5d553c97-E12@v1
  title: Force Decision on an Identified Target in Somalia
  status: draft
  setting: Somalia, 1 May 2008; Defense Department
  decider: The Defense Department
  agent: The Defense Department
  agent_role: decide
  situation: In Somalia on 1 May 2008, the Defense Department is considering whether to use force against an identified target.
    The target is described as a known al-Qaeda target, and that connection is the stated basis for considering force. The
    Defense Department is the apparent decision-maker. The State Department has not provided input on likely diplomatic repercussions.
    Likely diplomatic repercussions have not been assessed, and consequences for humanitarian activities have not been assessed.
  question: What should the Defense Department do about using force against the identified target?
  options:
    O1:
      do: The Defense Department requests State Department advice before deciding on force.
      move: ask
      irreversible: false
      to: The State Department
    O2:
      do: The Defense Department declines to use force against the identified target.
      move: act
      irreversible: false
    O3:
      do: The Defense Department authorizes the use of force against the identified target.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision concerns events dated 1 May 2008.
  - id: F2
    kind: situation
    status: confirmed
    fact: The events concern Somalia.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The identified target is described as a known al-Qaeda target.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The target's al-Qaeda connection is the stated basis for considering force.
  - id: F5
    kind: situation
    status: assessed
    fact: The State Department did not provide input on likely diplomatic repercussions.
  - id: F6
    kind: situation
    status: assessed
    fact: Likely diplomatic repercussions were not assessed.
  - id: F7
    kind: situation
    status: assessed
    fact: Consequences for humanitarian activities were not assessed.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The target’s described al-Qaeda connection is the stated basis for considering force, but there is no further assessment
      of the mission rationale.
  - id: C2
    facts:
    - F5
    - F6
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: Likely diplomatic repercussions were not assessed and the State Department supplied no input, leaving an identified
      policy consequence unexamined.
  - id: C3
    facts:
    - F7
    equity: humanitarian_access
    favors:
    - O1
    weight: weak
    why: Consequences for humanitarian activities were not assessed, so a potentially important effect of using force was
      left unknown.
  reasoning:
    read: The decision concerns force against a target described as a known al-Qaeda target, with that connection as the stated
      basis. The trap is treating that basis as if it also answers the separate questions about diplomatic repercussions and
      humanitarian consequences; neither was assessed.
    weighing: The target’s stated al-Qaeda connection supports the recorded decision to use force, while the missing diplomatic
      and humanitarian assessments are serious process gaps. The source records the Defense Department’s order of the strikes,
      but does not say those omissions made the use of force itself wrong or that force should have been declined. The recorded
      outcome is therefore {O3}, though the passage supplies no fuller balancing analysis.
    tradecraft: For a decision of this kind, identify the force rationale separately from diplomatic and humanitarian consequences,
      and preserve a record of which assessments were and were not made. The passage does not establish that such a record
      or assessment existed here.
    uncertainty: The target is assessed as a known al-Qaeda target, and that connection is the stated basis for considering
      force. There is no further evidence here about the target, the expected effects of force, or the likely diplomatic and
      humanitarian consequences.
    handoff: The State Department should be involved for advice on diplomatic repercussions; its lack of input is specifically
      identified. The source does not identify who should assess humanitarian consequences.
    tempting_wrong:
      option: O2
      pull: Declining force avoids acting while diplomatic and humanitarian consequences remain unassessed.
      why_wrong: The passage records the target’s al-Qaeda connection as the stated basis for considering force and records
        that force was ordered; it does not conclude that the omissions required declining force.
    rejected:
      O1: Requesting State Department advice would address the stated diplomatic gap, but the passage records the Defense
        Department ordering force and does not state that the decision was deferred pending that advice.
      O2: The passage gives no finding that force should have been declined; it records the target’s al-Qaeda connection as
        the stated basis and the Defense Department’s order to use force.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: An assessment found that using force would substantially obstruct humanitarian activities.
      then: O1
      why: That finding would make the currently unassessed humanitarian consequence concrete and could warrant obtaining
        advice before deciding.
    - id: flip2
      if: State Department advice identified serious diplomatic repercussions that needed consideration before action.
      then: O1
      why: The lack of diplomatic input and assessment is an identified gap; material advice could change the decision.
    would_not_change:
    - id: noflip1
      if: The target continued to be described as having an al-Qaeda connection, with no further information about diplomatic
        or humanitarian consequences.
      why: That repeats the stated basis for considering force but does not resolve the unassessed consequences.
    watch_for:
    - id: watch1
      what: Whether diplomatic repercussions and consequences for humanitarian activities are assessed before a comparable
        decision.
      favors:
      - O1
      why: Likely diplomatic repercussions and consequences for humanitarian activities were not assessed.
  lesson: A stated security rationale does not itself answer questions about diplomatic repercussions or humanitarian effects.
    Identify and assess those consequences separately, while distinguishing a documented decision from a fully explained judgment
    that the decision was justified.
  limits: The passage gives no detailed legal standard, evidence supporting the target assessment, or findings about the consequences
    of force. It does not establish that the omitted assessments would have changed the decision or that force should have
    been declined.
