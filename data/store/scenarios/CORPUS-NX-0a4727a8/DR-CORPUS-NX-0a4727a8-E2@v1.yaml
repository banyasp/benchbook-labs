case:
  id: DR-CORPUS-NX-0a4727a8-E2@v1
  title: Warning After a Communications Interruption
  status: draft
  setting: Soviet Far Eastern area, about 1300 on 2 August 1941, Kwantung Army Intelligence Section
  decider: The Intelligence Section
  agent: The Intelligence Section
  agent_role: decide
  situation: At about 1300 on 2 August 1941, communications in the Soviet Far Eastern area were reported suspended. The interruption
    lasted about two hours. Departures from the usual communications routine could be significant. A blackout of this kind
    might indicate an imminent Soviet move, and the cause had not yet been identified.
  question: What should the Intelligence Section do about the reported communications interruption in the Soviet Far Eastern
    area?
  options:
    O1:
      do: The Intelligence Section leaves the concerned commanders and Tokyo unalerted.
      move: act
      irreversible: false
    O2:
      do: The Intelligence Section alerts the concerned commanders and Tokyo.
      move: act
      irreversible: false
    O3:
      do: The Intelligence Section delays alerting the concerned commanders and Tokyo.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The communications interruption was reported at about 1300 hours on 2 August 1941.
  - id: F2
    kind: situation
    status: confirmed
    fact: The interruption concerned the Soviet Far Eastern area.
  - id: F3
    kind: situation
    status: confirmed
    fact: Communications in that area had been suspended for about two hours.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Changes in the usual Soviet communications routine could be significant.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A blackout of this kind might indicate an imminent Soviet move.
  - id: F6
    kind: situation
    status: confirmed
    fact: The cause of the interruption had not yet been identified when the warning decision arose.
  considerations:
  - id: C1
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: A departure from the usual communications routine could be significant, so the interruption warranted attention rather
      than dismissal as ordinary variation.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The blackout might indicate an imminent Soviet move, making a warning to the concerned commanders and Tokyo a prudent
      response to the assessed possibility.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: The cause was unidentified, so the interruption was not proof of an imminent move; that uncertainty counseled against
      presenting the assessment as confirmed.
  reasoning:
    read: This was an unexplained departure from a communications routine whose changes could matter. The trap is either to
      treat the blackout as proof of hostile action or to dismiss it because its cause is not yet known.
    weighing: The Section gave greater weight to the possibility that the blackout signaled an imminent move than to the uncertainty
      about its cause, and chose to alert the concerned commanders and Tokyo. The assessment remained a possibility, not a
      confirmed move; when the blackout was later attributed to propagation conditions, the alert was lifted.
    tradecraft: Issue the warning as a qualified assessment, distinguish the observed interruption from the possible explanation,
      and update or lift the alert when the cause is established.
    uncertainty: At the decision point, the cause was unknown and the blackout could indicate, but did not establish, an imminent
      move.
    handoff: Alert the concerned commanders and Tokyo so they can consider the warning at their respective levels; the information
      was significant enough that the Government convened an emergency conference with Imperial General Headquarters.
    tempting_wrong:
      option: O1
      pull: Avoid escalating concern on the basis of an unexplained interruption.
      why_wrong: It would leave commanders and Tokyo without warning of a change that could signal an imminent move.
    rejected:
      O1: The Section did not withhold the warning because the blackout might indicate an imminent Soviet move.
      O3: The Section did not delay because it judged the possible imminent-move signal significant enough to alert commanders
        and Tokyo.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The cause had been reliably identified as propagation conditions before the warning decision.
      then: O1
      why: With the interruption explained as benign, the stated reason for warning—its possible indication of an imminent
        move—would be substantially reduced.
    would_not_change:
    - id: noflip1
      if: The cause remained unknown and the blackout was still assessed as possibly indicating an imminent move.
      why: The source's stated assessment would continue to support warning the concerned commanders and Tokyo despite uncertainty.
    watch_for:
    - id: watch1
      what: Whether the cause of the interruption is identified and whether the unusual condition persists.
      favors:
      - O1
      why: A benign explanation can support lifting or withholding an alert, as occurred when the blackout was attributed
        to propagation conditions.
  lesson: When an unexplained change in a routine could signal an imminent threat, warn decision-makers without presenting
    the possibility as certainty. Reassess promptly as the cause becomes clearer, and lift the alert when the evidence no
    longer supports it.
  limits: This reasoning applies to a warning decision under uncertainty, not to treating the interruption as proof of hostile
    action. It does not establish a general rule that every communications interruption warrants an alert.
  library:
    domain: intel-analysis
    family: CORPUS-NX-0a4727a8
    source: https://www.cia.gov/resources/csi/static/3d97cef7df02b5aae8c989352becfccd/AntiSoviet-Ops-of-Kwantung.pdf
    episode_focus: The decision point is whether to issue a warning based on a roughly two-hour communications interruption;
      the Section chose to alert commanders and Tokyo, then lifted the alert when the interruption was attributed to propagation
      conditions. Exclude the technical means of monitoring communications.
