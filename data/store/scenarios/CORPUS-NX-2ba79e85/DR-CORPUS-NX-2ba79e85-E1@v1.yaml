case:
  id: DR-CORPUS-NX-2ba79e85-E1@v1
  title: Filling a Staffing Gap Under Time Pressure
  status: draft
  setting: Late November 1952; Chinese Communist Manchuria; CIA Third Force program.
  decider: The CIA unit chief
  agent: The CIA unit chief
  agent_role: decide
  situation: In late November 1952, the CIA unit chief faced a staffing gap in the Third Force program in Chinese Communist
    Manchuria. Two CAT personnel identified for the assignment were withdrawn four days beforehand because they lacked required
    site clearances. The unit chief had assessed that there was too little time to fully train the intended personnel. Two
    CIA personnel at the unit were potential substitutes, one with about a year at the unit and the other newly arrived. The
    staffing choice was whether to assign those personnel, defer the assignment, or hold the decision pending review of the
    clearance issue.
  question: What should the CIA unit chief do about filling the staffing gap?
  options:
    O1:
      do: The CIA unit chief should hold the staffing decision pending review of the clearance issue.
      move: hold
      irreversible: false
    O2:
      do: The CIA unit chief should prohibit assignment of the two available CIA personnel and defer the assignment.
      move: act
      irreversible: true
    O3:
      do: The CIA unit chief should authorize the two available CIA personnel to fill the staffing gap.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The CIA unit chief judged that the available time was too short to fully train the intended personnel.
  - id: F2
    kind: situation
    status: confirmed
    fact: Two CAT personnel had been identified to fill the staffing role.
  - id: F3
    kind: authority
    status: confirmed
    fact: The two CAT personnel lacked the required site clearances and were withdrawn four days before the assignment.
  - id: F4
    kind: capability
    status: confirmed
    fact: Two CIA personnel at the unit were available as potential substitutes; one had been at the unit about a year, and
      the other had arrived in the first week of November.
  - id: F5
    kind: capability
    status: confirmed
    fact: The substitute personnel received hurried preparation during the week of 24 November.
  - id: F6
    kind: situation
    status: confirmed
    fact: The assignment was scheduled for late November 1952.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: policy_compliance
    favors:
    - O1
    weight: weak
    why: The two identified CAT personnel were withdrawn because they lacked required site clearances. That makes clearance
      compliance a real constraint, although the source does not say that the clearance problem applied to the available CIA
      substitutes.
  - id: C2
    facts:
    - F1
    - F5
    equity: mission_effect
    favors:
    - O1
    - O2
    weight: strong
    why: The unit chief judged there was too little time to fully train the intended personnel, and the substitutes received
      only hurried preparation. That is a substantial readiness concern for assigning them.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Two CIA personnel were available as substitutes, and the unit chief directed them to fill the staffing breach after
      hurried preparation. The source records this staffing choice but gives little explicit explanation of why it outweighed
      the preparation concern.
  - id: C4
    facts:
    - F6
    equity: tempo
    favors:
    - O3
    weight: weak
    why: The assignment was scheduled for late November, and the unit chief filled the gap rather than deferring it. The source
      establishes the timing but does not expressly describe the cost of delay.
  reasoning:
    read: 'This was a staffing and authorization decision under limited preparation time: the identified CAT personnel could
      not be used because they lacked required site clearances, while two CIA personnel were available and were hurriedly
      prepared. The trap is to treat the clearance failure as proof that the CIA substitutes were also ineligible, or to treat
      the short preparation time as an express prohibition; neither follows from the stated facts.'
    weighing: The short preparation time weighs against assigning the substitutes, and the clearance withdrawal counsels against
      bypassing applicable clearance requirements. But the source records that the unit chief directed the two available CIA
      personnel to fill the gap. That choice favors staffing continuity and the scheduled assignment, though the source does
      not explain the balance in detail. The choice depends on the CIA substitutes being eligible under the applicable clearance
      rules and on the unit chief having authority to assign them.
    tradecraft: Before carrying out a comparable decision, confirm that the substitutes meet applicable clearance and assignment
      requirements, record the preparation shortfall and the basis for proceeding, and document any remaining readiness concerns.
      These are decision-recording safeguards, not steps attributed to the historical decision.
    uncertainty: The source does not state whether the CIA substitutes had the required clearances, what review of their eligibility
      occurred, or why the unit chief judged that hurried preparation was sufficient despite the earlier assessment that time
      was too short for full training.
    handoff: The source identifies the CIA unit chief as making the staffing decision and records no referral to a higher
      authority. Whether the decision could be made alone depends on the applicable delegation and clearance rules; unresolved
      questions about either would warrant review by the proper authority.
    tempting_wrong:
      option: O2
      pull: The preparation concern may make prohibiting the substitutes and deferring the assignment seem like the safest
        response.
      why_wrong: The source records the unit chief filling the gap with the available CIA personnel despite limited preparation;
        it does not establish that the shortfall made assignment impermissible or that no permissible substitute was available.
    rejected:
      O1: The unit chief did not hold the decision for review, but directed the available CIA personnel to fill the staffing
        gap.
      O2: The unit chief did not prohibit assignment and defer; the recorded outcome was to use the available CIA personnel.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Review showed that either CIA substitute lacked a required clearance or otherwise could not lawfully be assigned.
      then: O1
      why: The clearance problem that led to withdrawing the CAT personnel would then bear directly on the proposed substitutes,
        supporting a hold for review rather than proceeding.
    - id: flip2
      if: The applicable authority required deferral where personnel could not receive adequate preparation, and no authorized
        exception was available.
      then: O2
      why: A binding requirement would make proceeding with the hurriedly prepared substitutes impermissible.
    would_not_change:
    - id: noflip1
      if: The only established clearance problem remained that the two CAT personnel lacked required site clearances, with
        no evidence that the CIA substitutes shared that problem.
      why: The CAT personnel's ineligibility alone does not establish that the available CIA substitutes could not be assigned;
        the recorded outcome remains O3 absent further disqualifying information.
    watch_for:
    - id: watch1
      what: Confirmation of the CIA substitutes' clearance and assignment eligibility.
      favors:
      - O1
      why: A clearance or authority issue applying to the substitutes themselves would call for holding the decision pending
        review.
  lesson: A clearance defect affecting one set of personnel does not automatically disqualify different substitutes, but it
    should prompt confirmation that the substitutes are eligible. When preparation time is inadequate, weigh that concern
    against the staffing need and schedule, and make the authority and rationale for proceeding explicit.
  limits: The source records the unit chief's staffing action but provides little explanation of the underlying balance, the
    substitutes' clearance status, or the governing delegation. This reasoning should not be applied where a binding rule
    bars assignment or where the proposed substitutes' eligibility is unresolved.
