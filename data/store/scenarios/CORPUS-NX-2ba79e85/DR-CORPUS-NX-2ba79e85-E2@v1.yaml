case:
  id: DR-CORPUS-NX-2ba79e85-E2@v1
  title: Disposition of Air America Aircraft and Parts
  status: draft
  setting: Central Intelligence Agency, 9 October 1975
  decider: The Director of Central Intelligence
  agent: The Director of Central Intelligence
  agent_role: decide
  situation: Air America has received an offer of $3,850,000 from the aircraft broker OMNI Aircraft for all of its aircraft
    and parts. The assets have a total book value of $3,031,000, while Air America estimates their value at between $3.7 million
    and $4.1 million. OMNI is regarded as reputable, and Air America has had good credit business with it. The Air Advisor
    considers the sale legally permissible. The stated considerations include quick disposal of the remaining flying assets,
    funds for pending claims, and completion of that phase of the dissolution. Proposed steps include an independent evaluation,
    briefings for oversight bodies and agencies, and keeping the offer open while refining its terms.
  question: What should the Director of Central Intelligence do about OMNI Aircraft's offer to purchase Air America's aircraft
    and parts?
  options:
    O1:
      do: The Director approves the OMNI sale and authorizes an independent evaluation, oversight briefings, and further discussion
        if requested.
      move: act
      irreversible: true
    O2:
      do: The Director rejects the OMNI offer and retains the remaining aircraft and parts pending another disposition decision.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: OMNI Aircraft has offered $3,850,000 for all of Air America's aircraft and parts.
  - id: F2
    kind: situation
    status: confirmed
    fact: The offer covers 24 aircraft; the aircraft have a book value of $763,000 and the parts a book value of $2,268,000,
      for a combined book value of $3,031,000.
  - id: F3
    kind: situation
    status: assessed
    fact: Air America estimates the aircraft and parts are worth between $3.7 million and $4.1 million.
  - id: F4
    kind: situation
    status: assessed
    fact: OMNI Aircraft is considered reputable, and Air America has done good credit business with it.
  - id: F5
    kind: authority
    status: assessed
    fact: The Air Advisor considers the sale legally permissible.
  - id: F6
    kind: situation
    status: assessed
    fact: The proposed sale would quickly dispose of the remainder of Air America's flying assets.
  - id: F7
    kind: situation
    status: assessed
    fact: Funds from a sale are required to meet pending claims against Air America.
  - id: F8
    kind: situation
    status: assessed
    fact: The sale would complete the aircraft-and-parts phase of the dissolution process.
  - id: F9
    kind: situation
    status: confirmed
    fact: Proposed steps include obtaining an independent expert evaluation, briefing the Senate and House Oversight Committees
      and the Office of Management and Budget and General Services Administration, being prepared for requested audit discussions,
      and keeping the offer open while refining its terms.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The $3.85 million offer exceeds the $3.031 million book value and falls within Air America's estimated value range
      of $3.7 million to $4.1 million. OMNI is considered reputable and has had good credit business with Air America; the
      Air Advisor assesses the price as acceptable.
  - id: C2
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The Air Advisor considers the sale legally permissible, so this consideration supports proceeding, though permissibility
      alone does not require the sale.
  - id: C3
    facts:
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The sale would quickly dispose of the remaining flying assets and complete the aircraft-and-parts phase of the dissolution.
  - id: C4
    facts:
    - F7
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The sale proceeds are needed to meet pending claims against Air America.
  - id: C5
    facts:
    - F9
    equity: oversight_candor
    favors:
    - O1
    weight: weak
    why: An independent evaluation, briefings to oversight committees and relevant agencies, readiness to discuss the matter
      with GAO if requested, and continued discussion of the offer's terms provide proposed checks and accountability around
      the sale.
  reasoning:
    read: This is a proposed decision about disposing of Air America's remaining aircraft and parts, not evidence that a sale
      was completed. The offer is above book value and within the company's estimated value range, but book value alone does
      not establish whether the offer is acceptable; the proposed independent evaluation and refinement of terms matter. Legal
      permissibility supports proceeding but is not itself a command to sell.
    weighing: 'The Air Advisor''s reasons favor completing the sale: the price is considered acceptable, the disposal would
      be quick, proceeds are needed for pending claims, and the sale would complete this phase of dissolution. OMNI''s reputation
      and prior good credit business also support the transaction. These considerations favor O1, with the independent evaluation
      and oversight steps providing checks as the offer remains open and its terms are refined.'
    tradecraft: Authorize the proposed course while keeping the offer open and refining its terms. Obtain an independent expert
      evaluation, document the valuation and final terms supporting the decision, brief the Senate and House Oversight Committees
      and OMB and GSA, and be prepared to discuss the transaction with GAO if requested.
    uncertainty: The asset estimate is Air America's assessment, and the independent evaluation and refined sale terms are
      still proposed steps. The memorandum recommends proceeding but does not establish that the transaction was completed.
    handoff: The Director makes the decision. The proposed process involves an independent expert, briefings to the Senate
      and House Oversight Committees and OMB and GSA, and discussion with GAO if the Oversight Committees request it.
    tempting_wrong:
      option: O2
      pull: Rejecting the offer could seem prudent because a sale is irreversible and the assets have substantial book value.
      why_wrong: That approach gives book value undue weight despite the offer falling within Air America's estimated value
        range and the stated needs for quick disposal, funds for claims, and completion of dissolution.
    rejected:
      O2: The recommendation favors completing the sale because the price is considered acceptable and the proceeds and prompt
        disposal serve the stated claims and dissolution needs.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: An independent evaluation found that the assets were worth materially more than the offer and the refined terms
        did not address that gap.
      then: O2
      why: That would undermine the stated basis for treating the price as acceptable.
    - id: flip2
      if: A new legal assessment determined that the sale was not legally permissible.
      then: O2
      why: The recommendation to proceed depends in part on the Air Advisor's assessment that the sale is legally permissible.
    would_not_change:
    - id: noflip1
      if: The assets' book value remains below the offer while Air America's estimated value range continues to include it.
      why: The memorandum treats the offer as acceptable in light of the estimated value, not book value alone.
    watch_for:
    - id: watch1
      what: The independent expert's valuation and the final terms reached while keeping the offer open.
      favors:
      - O1
      - O2
      why: They bear on whether the price remains acceptable and support a well-founded final disposition decision.
  lesson: When a proposed asset sale is legally permissible and its price falls within the seller's estimated value range,
    weigh that value alongside the practical need to dispose of the assets and meet liabilities. A recommendation to proceed
    can be paired with independent valuation, term refinement, and oversight briefings rather than treated as proof that the
    transaction has already occurred.
  limits: This reasoning applies to the proposed sale of Air America's aircraft and parts on the stated valuation, legal assessment,
    and dissolution needs. A materially different valuation, legal assessment, or transaction purpose could alter the balance.
