case:
  id: DR-CORPUS-NX-7485fcd6-E2@v1
  title: Supervisory Transfer of an Agent
  status: draft
  setting: Paris, 1912, Okhrana
  decider: Okhrana headquarters
  agent: Okhrana headquarters
  agent_role: decide
  situation: The Paris chief is seeking to transfer an agent's supervision to a staff agent. The agent's monthly income from
    her work had been 3500 French francs, and her salary and expense allowance had been cut to 2500 francs a month after her
    services were considered less valuable than in an earlier period. The Paris chief had decided to make the transfer despite
    uncertainty about headquarters' view. The agent argued that changing case officers would have a serious psychological
    effect and that her work would suffer severely. The director at headquarters had previously ensured that the agent's preferences
    about who directed her work were honored.
  question: What should Okhrana headquarters do about the Paris chief's proposed transfer of the agent's supervision?
  options:
    O1:
      do: Headquarters transfers the agent's supervision to the staff agent.
      move: act
      irreversible: false
    O2:
      do: Headquarters retains the agent's supervision with the current case officer.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The agent's income from her work was 3500 French francs a month.
  - id: F2
    kind: situation
    status: assessed
    fact: Her services were generally considered less valuable than during the 1903–1909 period, and her salary and expense
      allowance were reduced to 2500 francs a month.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Paris chief considered the agent's accomplishments not worth the amounts paid in salary and expenses and recommended
      transferring her supervision to a staff agent.
  - id: F4
    kind: situation
    status: confirmed
    fact: In 1912, the Paris chief decided to transfer the agent to a staff agent regardless of headquarters' likely position.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The agent argued that changing case officers would have a serious psychological effect and that her work would suffer
      severely.
  - id: F6
    kind: authority
    status: confirmed
    fact: The director at headquarters had ensured that the agent's preferences about who directed her work were honored.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: The agent's services were considered less valuable than before, and the Paris chief judged her accomplishments insufficient
      to justify her pay and expenses. That supported concern about the arrangement's value, but did not by itself establish
      that changing supervision would improve it.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The agent warned that a change of case officer would seriously affect her psychologically and that her work would
      suffer severely. The prospect of harming her effectiveness weighed against the transfer.
  - id: C3
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: Headquarters had previously ensured that the agent's preferences about who directed her work were honored, supporting
      continuity with the existing arrangement.
  reasoning:
    read: The issue was whether to change supervision, not whether the agent's compensation and expenses were justified. Her
      pay and expense allowance had already been reduced after her services were considered less valuable; the separate transfer
      proposal raised the agent's asserted risk of psychological disruption and diminished work.
    weighing: The Paris chief's concern about value favored a transfer, but the pay and expense reduction already addressed
      that concern. Against it stood the agent's specific warning that changing case officers would seriously affect her and
      impair her work, together with headquarters' prior practice of honoring her preference. Headquarters ultimately retained
      the existing arrangement. The balance depended chiefly on whether the predicted disruption to her work outweighed the
      chief's assessment of her value.
    tradecraft: Record the supervision decision separately from the compensation decision, identify the evidence supporting
      each, and document why continuity or transfer better serves the work. Keep the decision at headquarters' level and omit
      operational methods.
    uncertainty: The account records headquarters' vacillation but does not explain its full deliberation or establish whether
      the agent's prediction of reduced performance was independently assessed.
    handoff: Headquarters should make the decision because it is the authority whose position the Paris chief anticipated
      and whose director had previously ensured the agent's preferences were honored. The chief's assessment should inform
      the decision, but should not substitute for headquarters' determination.
    tempting_wrong:
      option: O1
      pull: The Paris chief judged the agent's accomplishments inadequate for the salary and expenses and sought to move her
        supervision.
      why_wrong: That value concern had already led to a reduction in her compensation, while the proposed transfer carried
        a distinct, stated risk of disrupting her work.
    rejected:
      O1: Headquarters did not transfer supervision because the agent's warning of serious disruption to her work, reinforced
        by headquarters' established regard for her preference, outweighed the chief's value-based case for a transfer.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that a transfer would not seriously disrupt the agent or her work, and that the new arrangement
        would better serve the work.
      then: O1
      why: That would reduce the central stated cost of transfer and strengthen the case for acting on the chief's assessment.
    would_not_change:
    - id: noflip1
      if: The agent's compensation and expense allowance remained reduced while her supervision stayed with the current case
        officer.
      why: The compensation reduction and supervisory transfer are separate decisions; the pay adjustment alone does not establish
        a reason to transfer supervision.
    watch_for:
    - id: watch1
      what: Evidence that the proposed transfer would improve the agent's work without causing the disruption she predicted.
      favors:
      - O1
      why: That evidence would address the main stated reason for retaining the existing arrangement.
  lesson: Separate a compensation or performance-value concern from the decision to change supervision. When a change may
    seriously impair a person's work, weigh that stated risk against the organizational case for change and make the decision
    at the proper level of authority.
  limits: This reasoning applies to a supervisory change where the principal stated concern is disruption to the individual's
    work and the record contains a competing assessment of value. It does not establish that an agent's preference must always
    control or resolve a case with materially different evidence or authority.
