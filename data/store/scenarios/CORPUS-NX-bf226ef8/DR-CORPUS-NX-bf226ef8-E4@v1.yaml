case:
  id: DR-CORPUS-NX-bf226ef8-E4@v1
  title: Organizing Current-Operations and Protection Cells
  status: draft
  setting: National Training Center, during sustainment battalion main command-post organization for large-scale combat operations.
  decider: The sustainment battalion Commander
  agent: The sustainment battalion Commander
  agent_role: decide
  situation: A sustainment battalion Commander is organizing the main command post while personnel and equipment are constrained
    by the battalion's modified table of organization and equipment. A current-operations cell is meant to integrate and synchronize
    ongoing operations, but a compartmentalized staff arrangement can leave it without representatives from all warfighting
    functions. A dispersed command post has been considered as a survivability measure, while dispersal can also reduce staff
    synergy and impede command-post functions. The current-operations and protection cells each have substantial requirements
    for staff representation, communications, and situational awareness. The Commander must choose how to organize the two
    cells.
  question: What should the sustainment battalion Commander do about organizing the current-operations and protection cells
    under personnel and equipment constraints?
  options:
    O1:
      do: The Commander combines the current-operations and protection cells into one integrating cell.
      move: act
      irreversible: false
    O2:
      do: The Commander keeps the current-operations and protection cells as separate integrating cells.
      move: act
      irreversible: false
    O3:
      do: The Commander shares selected staff representatives across current-operations and protection integrating cells.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: Sustainment battalions often struggle to find the personnel and equipment required to establish all recommended
      command-post cells effectively.
  - id: F2
    kind: authority
    status: confirmed
    fact: Doctrine describes the current-operations integrating cell as the focal point for execution of operations.
  - id: F3
    kind: situation
    status: assessed
    fact: Observations at the National Training Center found that current-operations sections often lacked representatives
      from all warfighting functions, impairing staff integration.
  - id: F4
    kind: capability
    status: assessed
    fact: A stovepiped command post can plan and prepare operations, receive, analyze, and disseminate information, and prepare
      reports, but cannot adequately control operations, integrate resources, and synchronize current operations.
  - id: F5
    kind: situation
    status: assessed
    fact: Some commanders view a dispersed command post as offering survivability, but dispersing sections can impede command-post
      capability and degrade staff synergy.
  - id: F6
    kind: capability
    status: confirmed
    fact: The current-operations and protection cells each require broad staff and warfighting-function representation, available
      communications platforms, and strong situational awareness.
  - id: F7
    kind: capability
    status: assessed
    fact: The current-operations cell's personnel and equipment can also serve as the protection cell's personnel and equipment.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The current-operations cell is the focal point for executing operations, but a stovepiped staff cannot adequately
      control operations, integrate resources, and synchronize current operations. Broad staff integration is necessary to
      perform those functions.
  - id: C2
    facts:
    - F1
    - F6
    - F7
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Both cells require broad staff representation, communications, and situational awareness, while personnel and equipment
      are constrained. Using the current-operations cell's personnel and equipment for the protection cell addresses those
      competing requirements through one integrated cell.
  - id: C3
    facts:
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: Dispersal may be intended to improve survivability, but sections placed close together may not gain that protection,
      while dispersion impedes command-post capability and staff synergy.
  reasoning:
    read: 'The decision is how to meet two demanding cell requirements with constrained personnel and equipment. The trap
      is treating separate, compartmentalized staff spaces as an effective current-operations cell: that arrangement can leave
      functions working independently and unable to adequately control and synchronize operations.'
    weighing: 'Effective integration carries the greatest weight: current operations needs broad staff representation, and
      both current-operations and protection require staff, communications, and situational awareness. Since the current-operations
      personnel and equipment can also serve the protection cell, the recommendation is to combine them. The survivability
      rationale for dispersion is a counterweight, but dispersal can degrade synergy and may fail to provide protection if
      sections remain close together.'
    tradecraft: Document the personnel and equipment constraint, the staff functions and communications the combined cell
      must cover, and why combination is preferred to separate or selectively shared arrangements. Reassess if those constraints
      or the ability to provide integrated staff coverage materially change.
    uncertainty: The recommendation rests on observations and stated capability needs; it is not a binding rule or a guarantee
      that combining cells will resolve every staffing or survivability problem.
    handoff: The sustainment battalion Commander should make and document the organization decision, because the recommendation
      assigns this choice to sustainment commanders. No external approval is identified as required.
    tempting_wrong:
      option: O2
      pull: Separate cells may appear to preserve distinct functions and support a survivability rationale.
      why_wrong: Under the stated constraints, separate cells duplicate substantial requirements, and dispersing staff can
        impede command-post functions and synergy without necessarily improving survivability.
    rejected:
      O2: Separate cells were not chosen because both have substantial staff, communications, and situational-awareness requirements
        that constrained personnel and equipment make difficult to meet independently.
      O3: Sharing selected representatives was not chosen because the recommendation is to combine the cells so that the current-operations
        staff and equipment serve the protection function as well.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Personnel and equipment were sufficient to establish separate cells with broad staff representation, communications,
        and situational awareness without degrading staff synergy.
      then: O2
      why: That would reduce the resource constraint underlying the recommendation and could make separate, fully capable
        cells a reasonable choice.
    would_not_change:
    - id: noflip1
      if: The sections were dispersed only meters apart in the name of survivability.
      why: Such dispersion can defeat its survivability purpose while degrading staff synergy, and does not provide a reason
        to retain separate cells.
    - id: noflip2
      if: Personnel and equipment constraints continued to make it difficult to create all recommended command-post cells.
      why: The recommendation specifically responds to those constraints by combining the two requirement-heavy cells.
    watch_for:
    - id: watch1
      what: Whether the combined cell can provide the broad staff representation, available communications, and situational
        awareness required by both functions.
      favors:
      - O1
      why: The recommendation depends on the combined cell having the personnel and equipment needed to serve both functions
        effectively.
  lesson: When scarce personnel and equipment must support multiple integrating cells, prioritize the integration needed to
    control and synchronize operations. Combining cells can preserve broad staff, communications, and situational awareness
    across functions when separate cells would be under-resourced.
  limits: This recommendation addresses sustainment-battalion command-post organization under personnel and equipment constraints.
    It does not establish that combining cells is preferable when each can be fully staffed and equipped, or resolve the separate
    design question of command-post survivability.
