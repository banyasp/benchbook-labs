case:
  id: DR-CORPUS-NX-193c5494-E2@v1
  title: Choosing a Limited Gaza Ground Campaign
  status: draft
  setting: Gaza Strip, planned ground phase, IDF
  decider: Israeli military planners
  agent: Israeli military planners
  agent_role: decide
  situation: Israeli military planners were considering the ground phase of a campaign in Gaza. They viewed that phase as
    necessary to restore regional deterrence after the setbacks of the 2006 Second Lebanon War. Its stated goals were to reinforce
    deterrence, degrade Hamas’s capabilities, and reduce future threats from rocket fire and cross-border attacks. The planners
    feared that a prolonged operation could increase military casualties, civilian harm, and international pressure, and aimed
    to complete the campaign within seven to ten days. The choice was between a limited plan to isolate Gaza City from the
    rest of the Gaza Strip and full-scale occupation of urban centers.
  question: What should the Israeli military planners choose for the Gaza ground phase?
  options:
    O1:
      do: The Israeli military planners should approve the limited isolation plan and forego full-scale urban occupation.
      move: act
      irreversible: false
    O2:
      do: The Israeli military planners should reject the limited isolation plan and authorize full-scale urban occupation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Israeli planners believed the ground phase was necessary to restore Israel’s regional deterrence after the setbacks
      of the 2006 Second Lebanon War.
  - id: F2
    kind: situation
    status: confirmed
    fact: The stated goals of the ground phase were to reinforce deterrence, degrade Hamas’s capabilities, and reduce future
      threats from rocket fire and cross-border attacks.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Israeli planners feared that a prolonged operation would lead to rising military casualties, greater civilian harm,
      and increasing international pressure.
  - id: F4
    kind: situation
    status: confirmed
    fact: The IDF aimed to complete the ground campaign within seven to ten days.
  - id: F5
    kind: situation
    status: confirmed
    fact: The limited plan centered on isolating Gaza City from the rest of the Gaza Strip.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The plan was intended to apply direct pressure on Hamas’s leadership while avoiding full-scale occupation of urban
      centers.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The limited plan was intended to pressure Hamas’s leadership while advancing the stated goals of reinforcing deterrence,
      degrading Hamas’s capabilities, and reducing future threats.
  - id: C2
    facts:
    - F3
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Planners feared that a prolonged operation would cause greater civilian harm, and the limited plan was meant to avoid
      full-scale occupation of urban centers.
  - id: C3
    facts:
    - F3
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Planners feared military casualties would rise if the operation were prolonged, supporting a limited approach rather
      than full-scale urban occupation.
  - id: C4
    facts:
    - F3
    - F4
    equity: tempo
    favors:
    - O1
    weight: weak
    why: The seven-to-ten-day completion aim and concern about the risks of prolongation support favoring the limited plan,
      though the plan is not stated to ensure the deadline.
  reasoning:
    read: 'This is a choice about how to pursue the ground phase’s stated goals while limiting the risks planners associated
      with a prolonged operation. The trap is to equate greater breadth of occupation with better achievement of the mission:
      the limited plan was intended to pressure Hamas’s leadership without full-scale urban occupation.'
    weighing: The case for {O1} is that it was intended to pressure Hamas’s leadership and advance the ground phase’s goals
      {C1}, while avoiding the occupation associated with concerns about civilian harm and own-force casualties {C2} {C3}.
      The time limit and fear of prolongation add support, but less directly {C4}. This balance depends on the assessment
      that isolation can apply meaningful pressure and that avoiding full occupation reduces exposure to the feared costs.
    tradecraft: Record the choice as a comparison of the stated mission goals and the anticipated costs of prolongation, distinguishing
      assessed risks from certain outcomes. Revisit the choice if the underlying assessment of the limited plan’s ability
      to pressure Hamas or the expected duration and harms materially changes.
    uncertainty: The planners’ concerns are assessments, not confirmed future outcomes. The information provided does not
      establish how effectively the limited plan would pressure Hamas, whether it would meet the seven-to-ten-day aim, or
      what the actual comparative harms of full occupation would be.
    handoff: The choice is assigned to Israeli military planners, but no separate approval or referral authority is identified.
      The decision should therefore remain with the authorized planning authority; who holds that authority is unspecified.
    tempting_wrong:
      option: O2
      pull: Full-scale occupation might appear to be the more direct way to pursue the ground phase’s objectives.
      why_wrong: The stated rationale was that isolating Gaza City could pressure Hamas’s leadership while avoiding full-scale
        urban occupation, amid fears that prolongation would increase casualties and civilian harm.
    rejected:
      O2: Full-scale urban occupation was not chosen because planners sought to pressure Hamas’s leadership without undertaking
        that occupation, while limiting the risks they associated with a prolonged operation.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The planners assessed that the limited plan could not apply meaningful pressure on Hamas’s leadership or advance
        the stated ground-phase goals.
      then: O2
      why: That would remove the mission-based reason for choosing isolation and could shift the balance toward full-scale
        occupation.
    would_not_change:
    - id: noflip1
      if: The plan’s implementation details changed, but the assessment that it could pressure Hamas’s leadership while avoiding
        full-scale occupation remained the same.
      why: The stated reason for the choice rests on those decision-level aims, not on particular implementation details.
    watch_for:
    - id: watch1
      what: Updated assessments of whether the campaign could be completed within seven to ten days and whether prolongation
        would increase military casualties or civilian harm.
      favors:
      - O1
      why: Those duration and harm concerns were part of the stated rationale for keeping the ground campaign limited.
  lesson: Choose the course that can advance the stated mission while limiting foreseeable costs, rather than assuming the
    broadest action is the most effective. Treat assessed risks as reasons to weigh and monitor, not as guaranteed outcomes.
  limits: This reasoning applies to the operational choice described here and depends on the planners’ assessments of mission
    effect, duration, and harm. It does not establish that isolation is generally preferable to urban occupation or resolve
    legal questions beyond the stated decision.
