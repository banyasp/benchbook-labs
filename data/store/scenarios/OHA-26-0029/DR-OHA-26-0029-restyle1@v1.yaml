case:
  id: DR-OHA-26-0029-restyle1@v1
  title: Guideline H Drug Involvement – Access Authorization Decision [restyle]
  status: needs_review
  setting: Department of Energy, Office of Hearings & Appeals, April 2026
  decider: Presiding Administrative Judge
  agent: Presiding Administrative Judge
  agent_role: decide
  situation: The Local Security Office informed the employee that substantial doubts existed regarding his eligibility for
    a security clearance, invoking Guideline H and the Bond Amendment. The employee's urine test on 16 September 2025 returned
    positive for a marijuana metabolite after a single, home-based use on 14 September 2025. He subsequently completed a two-hour
    drug-awareness education session, attended six counseling appointments, and submitted five consecutive negative urine
    screens. His spouse and close friend testified that they were unaware of any prior drug use and support his continued
    sobriety; the friend also recalled the employee having used marijuana during his college years. The presiding Administrative
    Judge must decide whether the concerns raised by Guideline H are sufficiently mitigated to permit restoration of the employee's
    access authorization.
  question: How should the Presiding Administrative Judge rule on the employee's access authorization under Guideline H?
  options:
    O1:
      do: The Judge restores the employee's access authorization immediately and without reservation.
      move: act
      irreversible: true
    O2:
      do: The Judge refuses to restore the employee's access authorization at this time.
      move: act
      irreversible: true
    O3:
      do: The Judge suspends the decision pending further proof of long-term abstinence.
      move: hold
      irreversible: false
    O4:
      do: The Judge orders the Local Security Office to assess the employee's risk.
      move: ask
      irreversible: false
      to: Local Security Office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office warned the employee that substantial doubts existed about his eligibility, citing Guideline
      H and the Bond Amendment.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee's urine test on 16 September 2025 was positive for a marijuana metabolite.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The employee testified that he consumed marijuana only once, on 14 September 2025, while alone at home.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee finished a two-hour drug-awareness education program and six counseling sessions; the counselor reported
      no indication of future substance use.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee provided five negative urine test results dated 20 October 2025, 8 December 2025, 20 January 2026,
      23 February 2026, and 5 March 2026.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The employee's spouse and close friend testified that they had no knowledge of any prior drug use and endorse his
      abstinence.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The close friend testified that the employee had used marijuana while in college, contradicting the employee's claim
      of never having used before.
  - id: F8
    kind: authority
    status: confirmed
    fact: Guideline H of the Adjudicative Guidelines designates illegal drug use as a security concern.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Guideline H concerns remain unmitigated because the drug use was intentional, occurred under ordinary circumstances,
      and the employee's explanation does not convincingly demonstrate a low likelihood of recurrence.
  - id: C2
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment prohibits any unlawful controlled-substance user; the Judge concluded the employee's loss of self-control
      in obtaining marijuana satisfies the statutory bar.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The series of negative urine screens does not establish a continuous abstinence pattern because the detection window
      is unspecified and the record lacks evidence of sustained sobriety over time.
  - id: C4
    facts:
    - F3
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Credibility concerns—contradictory statements by the employee and divergent testimony from his friend—undermine confidence
      in his self-reporting and diminish the impact of any favorable evidence.
  reasoning:
    read: The employee's urine test on 16 September 2025 was positive for marijuana after a single use on 14 September 2025;
      the Local Security Office cited Guideline H (drug involvement) and the Bond Amendment as grounds for questioning his
      clearance eligibility.
    weighing: The Judge evaluated the four considerations above, each of which strongly supports denial. Mitigation under
      Guideline H was not satisfied (C1, C3, C4) and the Bond Amendment imposes an outright statutory bar (C2). Because the
      statutory prohibition is decisive, the balance unequivocally favors denial.
    tradecraft: The determination is recorded in the Presiding Administrative Judge's written Decision, referencing the applicable
      CFR provisions, the Adjudicative Guidelines, and the Bond Amendment, and is filed with the Office of Hearings & Appeals
      for potential appeal under 10 C.F.R. § 710.28.
    uncertainty: The only noted uncertainty concerns the limited span of the negative drug tests; the Judge deemed this insufficient
      to overcome the statutory restriction.
    handoff: The Presiding Administrative Judge acts alone, as the regulations vest the Judge with sole authority to issue
      the final determination after the hearing.
    tempting_wrong:
      option: O1
      pull: The employee's counseling, education, and subsequent negative tests could be viewed as evidence of rehabilitation.
      why_wrong: Even if rehabilitation were persuasive, the Bond Amendment's language makes any recent unlawful use a disqualifier,
        and the Judge found the employee's admission of lost self-control satisfies that bar.
    rejected:
      O1: The mitigation criteria under Guideline H were not met, and the Bond Amendment bars clearance despite remedial actions.
      O3: Deferring the decision would not resolve the statutory prohibition; the record already shows insufficient proof
        of sustained abstinence.
      O4: The Local Security Office's assessment has already been considered; additional review would not alter the statutory
        analysis.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee completed an approved drug-treatment program with a favorable medical prognosis and can demonstrate
        a continuous, verifiable abstinence record over an extended period.
      then: O1
      why: The guidelines identify such treatment and sustained abstinence as mitigating factors capable of overcoming Guideline
        H concerns.
    would_not_change:
    - id: noflip1
      if: The employee's single marijuana use is factual but he acknowledges loss of self-control.
      why: Even assuming the use was isolated, the Bond Amendment alone bars clearance.
    watch_for:
    - id: watch1
      what: Future instances where the employee furnishes long-term, medically-verified abstinence and completes a DOE-approved
        treatment program.
      favors:
      - O1
      why: Such documentation would satisfy the mitigation requirements in paragraphs (b) and (d) of Guideline H.
  lesson: Within DOE security adjudication, a recent unlawful controlled-substance use triggers the Bond Amendment's statutory
    bar, and Guideline H mitigation demands demonstrable, sustained abstinence and treatment; absent those elements, clearance
    cannot be reinstated.
  limits: This analysis is confined to controlled-substance use matters governed by 10 C.F.R. Part 710 and the Bond Amendment;
    it does not extend to other security concerns such as financial vulnerability, foreign influence, or substances not classified
    as controlled under 21 U.S.C. § 802.
