case:
  id: DR-OHA-26-0029-flip1@v1
  title: Guideline H Drug Involvement – Access Authorization Decision [flip]
  status: needs_review
  setting: Federal Energy Security Review Board, May 2026
  decider: Presiding Administrative Officer
  agent: Presiding Administrative Officer
  agent_role: decide
  situation: The Facility Security Office informed the Employee that substantial doubts existed about his eligibility for
    a security clearance, invoking Guideline H and the Bond Amendment. The Employee tested positive for a marijuana metabolite
    on 16 September 2025 after a single, home-based use on 14 September 2025. He completed a two-hour drug-awareness course,
    attended six counseling sessions, and has produced a series of negative urine screens since the incident. His spouse and
    close confidant testified that they were unaware of any prior drug use and endorse his continued sobriety, while the confidant
    also recalled the Employee's occasional marijuana use during college. The Presiding Administrative Officer must decide
    whether the concerns raised by Guideline H are mitigated and whether to reinstate the Employee's access authorization.
  question: What action should the Presiding Administrative Officer take concerning the Employee's access authorization under
    Guideline H?
  options:
    O1:
      do: Approve the restoration of the Employee's access authorization.
      move: act
      irreversible: true
    O2:
      do: Reject the request to restore the Employee's access authorization.
      move: act
      irreversible: true
    O3:
      do: Place the decision on hold pending further proof of long-term abstinence.
      move: hold
      irreversible: false
    O4:
      do: Direct the Facility Security Office to conduct an additional risk assessment.
      move: ask
      irreversible: false
      to: Local Security Office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Facility Security Office warned the Employee that substantial doubts existed about his eligibility based on
      Guideline H and the Bond Amendment.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Employee's urine sample on 16 September 2025 contained a detectable marijuana metabolite.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Employee testified that he consumed marijuana only once, on 14 September 2025, while alone at home.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual underwent a twelve‑week medication‑assisted therapy under the supervision of a physician; the doctor
      noted steady health improvement and observed no indication of relapse.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual supplied twelve successive, laboratory‑confirmed negative urine analyses dated October 20 2025; December 8 2025;
      January 20 2026; February 23 2026; March 5 2026; April 10 2026; May 15 2026; June 20 2026; July 25 2026; August 30 2026;
      September 28 2026; and October 31 2026, covering a full twelve‑month span.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Employee's spouse and close confidant testified that they were unaware of any prior drug use and support his
      continued abstinence.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The confidant testified that the Employee had experimented with marijuana during his college years, contradicting
      the Employee's claim of never having used the substance before.
  - id: F8
    kind: authority
    status: confirmed
    fact: Guideline H of the Adjudicative Guidelines designates illegal drug use as a security concern.
  - id: F9
    kind: authority
    status: confirmed
    fact: A licensed health professional issued a statement on 1 November 2025 indicating a positive health outlook after
      treatment and confirming that monitoring over the preceding year has revealed no drug use.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Guideline H concerns remain because the Employee's admission of use, coupled with contradictory testimony from his
      confidant, suggests a pattern of deception that could impair reliability.
  - id: C2
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment prohibits clearance for any individual who has used a controlled substance unlawfully; the Employee's
      admission satisfies the statutory bar.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The twelve consecutive, laboratory-verified negative urine tests demonstrate an uninterrupted twelve-month period
      of abstinence, satisfying the detection-window requirements and establishing a reliable pattern of sobriety.
  - id: C4
    facts:
    - F3
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Discrepancies between the Employee's statement and his confidant's recollection erode credibility, limiting the weight
      of supportive testimony.
  reasoning:
    read: The Employee tested positive for marijuana after a single, home-based use on 14 September 2025; the Facility Security
      Office cited Guideline H and the Bond Amendment as reasons to doubt his clearance eligibility.
    weighing: While considerations C1, C2, and C4 highlight concerns about credibility and statutory prohibition, C3 provides
      concrete, verifiable evidence of a full year of abstinence, which the guidelines treat as a strong mitigating factor.
      The weight of C3 outweighs the opposing considerations, leading to approval of restoration.
    tradecraft: The decision is recorded in the Presiding Administrative Officer's written determination, citing the relevant
      CFR provisions, the Adjudicative Guidelines, and the Bond Amendment, and is filed with the Federal Energy Security Review
      Board for potential appeal under 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty lies in interpreting the Bond Amendment's scope relative to documented sustained
      abstinence; however, the twelve-month negative test record satisfies the mitigation criteria outlined in Guideline H.
    handoff: The Presiding Administrative Officer acts alone, as the regulations confer sole authority to issue the final
      determination after the hearing.
    tempting_wrong:
      option: O2
      pull: The Employee's admission of loss of self-control and the statutory language of the Bond Amendment appear to mandate
        denial.
      why_wrong: The explicit, year-long record of negative tests and professional health endorsement demonstrate that the
        statutory bar can be waived when the mitigation requirements of Guideline H are fully met.
    rejected:
      O2: The Bond Amendment's prohibition is overridden when the employee provides documented, continuous abstinence and
        a favorable medical prognosis, as required by Guideline H mitigation.
      O3: A hold would unnecessarily delay reinstatement despite clear evidence of sustained sobriety.
      O4: An additional LSO risk assessment would duplicate analysis already incorporated into the record and would not affect
        the mitigation conclusion.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Employee fails to complete a DOE-approved treatment program or cannot produce verifiable evidence of continuous
        abstinence over an extended period.
      then: O2
      why: Under those circumstances, the Bond Amendment and Guideline H would again preclude restoration of access.
    would_not_change:
    - id: noflip1
      if: The Employee's single marijuana use is accurate but he acknowledges loss of self-control.
      why: Even assuming the use was a one-time event, the Bond Amendment alone bars clearance.
    watch_for:
    - id: watch1
      what: Future cases where the employee furnishes long-term, medically-verified abstinence and completes a DOE-approved
        treatment program.
      favors:
      - O1
      why: Such evidence would satisfy the mitigation criteria in paragraphs (b) and (d) of Guideline H.
  lesson: In DOE security adjudication, a documented, year-long record of negative drug tests combined with successful completion
    of a DOE-approved treatment program can satisfy Guideline H mitigation, allowing restoration of access despite an initial
    statutory bar under the Bond Amendment.
  limits: This analysis is limited to cases involving controlled-substance use governed by 10 C.F.R. Part 710 and the Bond
    Amendment; it does not apply to other adjudicative concerns such as financial vulnerability, foreign influence, or substances
    not classified as controlled under 21 U.S.C. § 802.
