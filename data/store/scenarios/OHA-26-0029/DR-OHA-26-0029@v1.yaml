case:
  id: DR-OHA-26-0029@v1
  title: Guideline H Drug Involvement – Access Authorization Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, April 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office notified the Individual of substantial doubt about his eligibility for a security clearance,
    citing Guideline H and the Bond Amendment. The Individual tested positive for a marijuana metabolite on September 16,
    2025, after a single use at home on September 14, 2025. He completed a two‑hour substance‑abuse education program, attended
    six counseling sessions, and submitted five negative urine drug tests after the incident. His wife and best friend testified
    that they were unaware of prior drug use and support his abstinence, while the best friend also recalled the Individual
    using marijuana in college. The Administrative Judge must determine whether the Guideline H concerns are mitigated and
    whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline H?
  options:
    O1:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending additional evidence of sustained abstinence.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge asks the Local Security Office to assess the Individual’s risk.
      move: ask
      irreversible: false
      to: Local Security Office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office notified the Individual of substantial doubt about his eligibility based on Guideline
      H and the Bond Amendment.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual tested positive for a marijuana metabolite on September 16, 2025.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Individual testified that he used marijuana only once on September 14, 2025, at home alone.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual completed a two‑hour substance‑abuse education program and six counseling sessions, and the counselor
      reported no risk of further substance use.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual provided five negative urine drug test results dated October 20, 2025; December 8, 2025; January
      20, 2026; February 23, 2026; and March 5, 2026.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual’s wife and best friend testified that they were unaware of prior drug use and support his abstinence.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The best friend testified that the Individual had used marijuana in college, contradicting his claim of never using
      before.
  - id: F8
    kind: authority
    status: confirmed
    fact: Guideline H of the Adjudicative Guidelines identifies illegal drug use as a security concern.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Guideline H concerns are not mitigated because the drug use was premeditated, occurred under ordinary stressors,
      and the judge found the individual’s explanation insufficient to show it was unlikely to recur.
  - id: C2
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment bars any unlawful user of a controlled substance; the judge concluded the individual lost self‑control
      in obtaining marijuana, satisfying the statutory prohibition.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The negative urine tests do not establish a continuous pattern of abstinence because the detection window is unknown
      and the record does not show sustained abstinence over time.
  - id: C4
    facts:
    - F3
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Credibility issues—equivocation in the individual’s testimony and contradictory statements from his best friend—undermine
      confidence in his self‑reporting and mitigate any favorable evidence.
  reasoning:
    read: The Individual tested positive for marijuana after a single use on September 14, 2025; the Local Security Office
      cited Guideline H (drug involvement) and the Bond Amendment as reasons to doubt his eligibility for a security clearance.
    weighing: The judge weighed the four considerations above, finding that each strongly supports denial. Guideline H mitigation
      was not met (C1, C3, C4) and the Bond Amendment provides an outright statutory bar (C2). Because the statutory bar is
      decisive, the balance tips unequivocally toward denial.
    tradecraft: The decision is recorded in the Administrative Judge’s written Decision, citing the relevant CFR sections,
      the Adjudicative Guidelines, and the Bond Amendment, and is filed with the Office of Hearings and Appeals for potential
      appeal under 10 C.F.R. § 710.28.
    uncertainty: The only uncertainty noted is the limited duration of the negative drug tests; however, the judge deemed
      this insufficient to overcome the statutory prohibition.
    handoff: The Administrative Judge decides alone, as the regulations grant the judge sole authority to issue the final
      determination after the hearing.
    tempting_wrong:
      option: O1
      pull: The Individual’s post‑incident counseling, education, and negative tests might suggest rehabilitation.
      why_wrong: Even if rehabilitation were convincing, the Bond Amendment’s language makes any recent unlawful use a disqualifier,
        and the judge found the individual’s own admission of lost self‑control satisfies that bar.
    rejected:
      O1: The mitigation conditions under Guideline H were not satisfied and the Bond Amendment bars clearance despite remedial
        steps.
      O3: Holding the decision pending would not address the statutory prohibition; the record already shows insufficient
        evidence of sustained abstinence.
      O4: The LSO’s assessment was already incorporated; further LSO review would not change the statutory analysis.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual completed a prescribed drug‑treatment program with a favorable medical prognosis and could demonstrate
        a continuous, verifiable pattern of abstinence over an extended period.
      then: O1
      why: The guidelines list such treatment and sustained abstinence as mitigating factors that could overcome Guideline
        H concerns.
    would_not_change:
    - id: noflip1
      if: The Individual’s single marijuana use is true but he acknowledges loss of self‑control.
      why: Even assuming the use was a one‑time event, the Bond Amendment alone bars clearance.
    watch_for:
    - id: watch1
      what: Future cases where the individual provides long‑term, medically‑verified abstinence and completes a DOE‑approved
        treatment program.
      favors:
      - O1
      why: Such evidence would satisfy the mitigation criteria in paragraph (b) and (d) of Guideline H.
  lesson: Under DOE security adjudication, a single recent unlawful use of a controlled substance triggers the Bond Amendment’s
    statutory bar, and Guideline H mitigation requires demonstrable, sustained abstinence and treatment; without those, clearance
    cannot be restored.
  limits: This analysis applies only to controlled‑substance use cases governed by 10 C.F.R. Part 710 and the Bond Amendment;
    it does not extend to other security concerns such as financial or foreign influence, nor to substances not classified
    as controlled under 21 U.S.C. § 802.
