case:
  id: DR-OHA-26-0029-addfact1@v1
  title: Guideline H Drug Involvement – Access Authorization Decision [addfact]
  status: needs_review
  setting: Department of Energy, Office of Hearings and Appeals – April 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office informed the Individual that substantial doubts existed regarding his eligibility,
    citing Guideline H and the Bond Amendment. A urine analysis on 16 September 2025 returned a positive result for a marijuana
    metabolite, which the Individual explained as stemming from a single, solitary use at home on 14 September 2025. He subsequently
    completed a two-hour substance-abuse education module and six counseling sessions, after which his counselor reported
    no indication of future drug use. Five follow-up urine screens—dated 20 October 2025, 8 December 2025, 20 January 2026,
    23 February 2026, and 5 March 2026—were all negative. Both his spouse and a close friend testified that they were unaware
    of any prior drug use and support his continued abstinence, although the friend also recalled the Individual having used
    marijuana during his college years, contradicting the Individual's claim of never having used the drug before. Guideline
    H identifies illegal drug use as a security-related concern, yet the Individual has held a Top-Secret clearance for ten
    years without any prior security violations, adjudications, or substance-abuse incidents.
  question: How should the Administrative Law Judge rule on the Individual's access authorization under Guideline H?
  options:
    O1:
      do: Restore the Individual's access authorization with an immediate order by the Judge.
      move: act
      irreversible: true
    O2:
      do: Deny the Individual's request and refuse restoration of his access authorization.
      move: act
      irreversible: true
    O3:
      do: Postpone a final ruling until further proof of sustained abstinence is submitted.
      move: hold
      irreversible: false
    O4:
      do: Require the Local Security Office to conduct a risk assessment of Individual.
      move: ask
      irreversible: false
      to: Local Security Office
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office informed the Individual that substantial doubts existed regarding his eligibility, citing
      Guideline H and the Bond Amendment.
  - id: F2
    kind: situation
    status: confirmed
    fact: A urine analysis on 16 September 2025 returned a positive result for a marijuana metabolite.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Individual testified that his only marijuana use occurred on 14 September 2025, when he smoked alone at home.
  - id: F4
    kind: situation
    status: confirmed
    fact: He completed a two-hour substance-abuse education module and attended six counseling sessions; the counselor reported
      no indication of future drug use.
  - id: F5
    kind: situation
    status: confirmed
    fact: Subsequent urine screens dated 20 October 2025, 8 December 2025, 20 January 2026, 23 February 2026, and 5 March
      2026 were all negative.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Both his spouse and his close friend testified that they were unaware of any prior drug use and that they support
      his continued abstinence.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The close friend also stated that the Individual had used marijuana during his college years, contradicting the
      Individual's claim of never having used the drug before.
  - id: F8
    kind: authority
    status: confirmed
    fact: Guideline H of the Adjudicative Guidelines designates illegal drug use as a security-related concern.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Individual has maintained a Top-Secret clearance for ten years without any prior security violations, adjudications,
      or substance-abuse incidents.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The single positive marijuana test (F2) is offset by the individual's documented five consecutive negative screens
      (F5) and the completion of a remedial education module and counseling (F4), indicating that the drug-use incident is
      an isolated lapse rather than a pattern of risk.
  - id: C2
    facts:
    - F2
    - F4
    - F5
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: While the Bond Amendment bars unlawful controlled-substance use, DOE policy permits restoration when the individual
      demonstrates sustained abstinence and successful remediation, which the record now shows.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Five consecutive negative urine tests over a six-month span (F5) constitute verifiable, continuous abstinence, satisfying
      the mitigation criteria of Guideline H.
  - id: C4
    facts:
    - F3
    - F6
    - F7
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The friend's recollection of distant college-time use (F7) does not undermine the individual's current credibility,
      especially given corroborating testimony from the spouse (F6) and a counselor's professional assessment (F4) that future
      use is unlikely.
  reasoning:
    read: The Individual's single marijuana use on 14 September 2025 (F2) was followed by a comprehensive remediation program
      (F4) and five consecutive negative drug screens through 5 March 2026 (F5). Ten years of flawless Top-Secret clearance
      (F9) further attest to his reliability.
    weighing: Each of the four original considerations now favors restoration because the record demonstrates sustained abstinence
      and successful remediation. The analyst's three strong mitigating considerations (NC1-NC3) outweigh the two weak concerns
      (NC4, NC5). Consequently, the balance of equities and statutory guidance supports restoring the Individual's access
      authorization.
    tradecraft: The Administrative Law Judge issues a written decision citing 10 C.F.R. § 710.28, the Adjudicative Guidelines
      (Guideline H), and the Bond Amendment, documenting the mitigating evidence and ordering immediate restoration of the
      Individual's access.
    uncertainty: No material uncertainty remains; the documented negative tests and counselor assessment provide concrete
      proof of continued abstinence.
    handoff: The ALJ retains sole authority to render the final determination after the hearing, per DOE regulations.
    tempting_wrong:
      option: O2
      pull: The Bond Amendment's language appears to impose an absolute bar for any recent unlawful use.
      why_wrong: DOE policy interprets the amendment as allowing restoration when the individual demonstrates sustained abstinence
        and remediation, which the record now satisfies.
    rejected:
      O3: Postponing the decision would ignore the clear, documented evidence of sustained abstinence and remediation already
        on record.
      O4: A further LSO risk assessment would be redundant; the LSO's earlier findings have been fully considered and do not
        alter the statutory analysis.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip2
      if: The Individual fails to produce any additional negative drug tests after March 2026 and the LSO issues a formal
        risk assessment indicating ongoing risk.
      then: O2
      why: Without continued proof of abstinence, the statutory concern under Guideline H and the Bond Amendment reasserts
        itself, supporting denial as in the parent scenario.
    would_not_change:
    - id: noflip1
      if: The Individual's single marijuana use is true but he acknowledges loss of self-control.
      why: Even assuming the use was a one-time event, the Bond Amendment alone bars clearance unless mitigation is proven,
        which the record now shows.
    watch_for:
    - id: watch1
      what: Future cases where the individual provides long-term, medically-verified abstinence and completes a DOE-approved
        treatment program.
      favors:
      - O1
      why: Such evidence would satisfy the mitigation criteria in paragraphs (b) and (d) of Guideline H.
  lesson: In DOE security adjudication, a single recent drug incident does not automatically preclude restoration when the
    individual demonstrates sustained abstinence, completes remediation, and has a long record of reliable clearance performance.
  limits: This analysis is limited to cases involving controlled-substance use under 10 C.F.R. Part 710 and the Bond Amendment.
    It does not address other adjudicative concerns such as financial vulnerability, foreign influence, or non-controlled
    substances.
