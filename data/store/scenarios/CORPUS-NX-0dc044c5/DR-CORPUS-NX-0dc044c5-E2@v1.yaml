case:
  id: DR-CORPUS-NX-0dc044c5-E2@v1
  title: A Stricken Vessel’s Request for Refuge
  status: draft
  setting: A stricken vessel seeks entry to a place of refuge within a coastal State’s territorial waters; the coastal State
    is making a case-by-case decision.
  decider: The coastal State
  agent: The coastal State
  agent_role: decide
  situation: A stricken vessel seeks entry to a place of refuge within the coastal State’s territorial waters. The coastal
    State must weigh the vessel’s humanitarian needs against environmental risk from the ship’s proximity to the coast. Denying
    entry or delaying a decision could increase the risk and reduce the options that remain. At this decision point, the coastal
    State has not identified a practical alternative that is lower-risk than granting refuge. The vessel’s entry is necessitated
    by distress.
  question: What should the coastal State do about the stricken vessel’s request to enter a place of refuge within its territorial
    waters?
  options:
    O1:
      do: The coastal State holds its decision on the vessel’s entry to a place of refuge within its territorial waters.
      move: hold
      irreversible: false
    O2:
      do: The coastal State grants the vessel entry to a place of refuge within its territorial waters.
      move: act
      irreversible: false
    O3:
      do: The coastal State denies the vessel entry to a place of refuge within its territorial waters.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Granting a vessel access to a place of refuge in a State’s territorial waters is primarily a political decision
      made case by case.
  - id: F2
    kind: situation
    status: confirmed
    fact: The decision balances the humanitarian needs of the stricken vessel against the environmental risk posed by the
      ship’s proximity to the coast.
  - id: F3
    kind: situation
    status: confirmed
    fact: A coastal State could increase its risk by denying a vessel the opportunity to enter a place of refuge.
  - id: F4
    kind: situation
    status: confirmed
    fact: Delaying a decision could increase risk until no options remain.
  - id: F5
    kind: authority
    status: confirmed
    fact: A vessel should be denied entry only when the coastal State can identify a practical alternative that is lower-risk
      than granting refuge.
  - id: F6
    kind: situation
    status: confirmed
    fact: At this scenario’s decision point, the coastal State has not identified a practical alternative that is lower-risk
      than granting refuge.
  - id: F7
    kind: authority
    status: confirmed
    fact: A vessel entering a foreign State’s territorial seas, archipelagic waters, or internal waters due to distress is
      generally exempt from enforcement of domestic laws violated by that entry.
  - id: F8
    kind: authority
    status: confirmed
    fact: A distressed vessel’s entry is generally not subject to the coastal State’s customs or notice-of-entry laws when
      entry is truly necessitated by distress.
  considerations:
  - id: C1
    facts:
    - F2
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The vessel’s humanitarian needs are a central part of the case-by-case balance and support granting refuge.
  - id: C2
    facts:
    - F2
    equity: third_party_harm
    favors:
    - O1
    - O3
    weight: strong
    why: The State must also account for environmental risk from the vessel’s proximity to the coast; that risk weighs against
      treating refuge as automatic.
  - id: C3
    facts:
    - F3
    - F4
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Denial could increase the State’s risk, and delay could increase risk until no options remain, so holding the decision
      is not a neutral course.
  - id: C4
    facts:
    - F5
    - F6
    equity: humanitarian_access
    favors:
    - O2
    weight: strong
    why: The guidance says to deny entry only when a practical, lower-risk alternative is identified; none has been identified
      at this decision point.
  - id: C5
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Because entry is necessitated by distress, it is generally exempt from enforcement of domestic entry-related laws,
      including customs or notice-of-entry requirements; those requirements should not be treated as a reason to deny refuge.
  reasoning:
    read: 'This is a case-by-case political decision that balances the stricken vessel’s humanitarian needs against environmental
      risk. The trap is treating denial or delay as a risk-free way to avoid coastal exposure: either may increase risk, and
      delay may leave no options.'
    weighing: Environmental risk must be considered, but the guidance says denial is appropriate only when the coastal State
      can identify a practical alternative that is lower-risk than refuge. With no such alternative identified, and with denial
      or delay capable of increasing risk, the balance favors granting entry. The balance could change if a practical lower-risk
      alternative were identified; distress-related entry is generally exempt from enforcement of domestic entry laws.
    tradecraft: Make the decision promptly and record the humanitarian and environmental considerations, the available alternatives
      considered, and why the selected course best addresses the risk on the facts at the time.
    uncertainty: The guidance supplies no numerical risk threshold or fixed outcome for every vessel; the State must make
      the case-specific balance. The stated facts establish that no practical lower-risk alternative has been identified,
      but do not quantify the competing risks.
    handoff: The coastal State is the decision-maker. The guidance characterizes the decision as political and case-specific
      but does not prescribe a referral or approval process.
    tempting_wrong:
      option: O1
      pull: Holding the decision may seem to preserve flexibility while more is considered.
      why_wrong: The guidance warns that delay can increase risk until no options remain, so holding is not a risk-free substitute
        for deciding.
    rejected:
      O1: It was not chosen because delay could increase risk and reduce the remaining options.
      O3: It was not chosen because the State has identified no practical alternative that is lower-risk than granting refuge.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The coastal State identifies a practical alternative that is lower-risk than granting refuge.
      then: O3
      why: The guidance makes such an alternative the condition for denying entry.
    would_not_change:
    - id: noflip1
      if: The vessel’s distress-related entry would otherwise violate customs or notice-of-entry laws.
      why: When entry is truly necessitated by distress, the vessel is generally exempt from enforcement of those domestic
        entry requirements; that violation alone does not displace the refuge decision’s risk balance.
    watch_for:
    - id: watch1
      what: Whether denial or delay is increasing risk or reducing the options that remain.
      favors:
      - O2
      why: The guidance identifies increased risk from denial and delay as reasons the coastal State must account for in its
        decision.
  lesson: A refuge decision requires weighing humanitarian need against environmental risk, not assuming that exclusion or
    delay reduces risk. Deny entry only when a practical alternative is identified that presents lower risk than granting
    refuge.
  limits: This reasoning applies to a stricken vessel seeking refuge in a coastal State’s waters under the stated distress
    conditions. It does not determine the outcome where the facts differ, especially where a practical, lower-risk alternative
    is identified.
