case:
  id: DR-CORPUS-NX-0dc044c5-E9@v1
  title: Assessing a Reportable Incident
  status: draft
  setting: During military operations, within a DOD component and its chain of command
  decider: The unit commander
  agent: The unit commander
  agent_role: decide
  situation: The unit commander has information about an allegation of a law-of-war violation. The commander must assess whether
    the information is credible and whether the allegation meets the threshold for a reportable incident. The assessment concerns
    whether the information is sufficiently accurate to warrant further review, not whether a violation has been established.
    The totality of the circumstances is relevant, including source reliability and any contradictory or corroborating information.
    A reporting determination must be handled through the chain of command.
  question: What should the unit commander do with the allegation after assessing the available information?
  options:
    O1:
      do: The unit commander withholds a report of the allegation and forwards a determination of insufficient credible information
        through the chain to the combatant commander.
      move: act
      irreversible: false
    O2:
      do: The unit commander reports the allegation through the chain of command to the combatant commander using operational
        incident procedures or another expeditious means.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: A reportable incident is one that a unit commander or other responsible official determines, based on credible information,
      potentially involves a war crime, another law-of-war violation, or conduct during military operations that would be
      a war crime in armed conflict.
  - id: F2
    kind: authority
    status: confirmed
    fact: The threshold is whether credible information merits further review; the commander need not determine that a potential
      violation occurred.
  - id: F3
    kind: authority
    status: confirmed
    fact: Credible information is information a reasonable military commander would believe sufficiently accurate to warrant
      further review of an alleged violation.
  - id: F4
    kind: authority
    status: confirmed
    fact: The credibility assessment considers the totality of the circumstances, including the source’s reliability, how
      the source obtained the information, and whether contradictory or corroborating information exists.
  - id: F5
    kind: situation
    status: confirmed
    fact: The unit commander has information about an alleged law-of-war violation and must assess whether it is based on
      credible information and constitutes a reportable incident.
  - id: F6
    kind: authority
    status: confirmed
    fact: Military and U.S. civilian employees, contractor personnel, and subcontractors assigned to or accompanying a DOD
      component must report reportable incidents through their chain of command, including allegations involving non-DOD personnel.
  - id: F7
    kind: authority
    status: confirmed
    fact: A unit commander must immediately report a reportable incident through the chain of command to the combatant commander
      using operational incident reporting procedures or other expeditious means.
  - id: F8
    kind: authority
    status: confirmed
    fact: If the unit commander or a superior commander determines that an allegation is not supported by credible information,
      that determination is forwarded through the chain of command to the appropriate combatant commander.
  - id: F9
    kind: authority
    status: confirmed
    fact: Military Department and Service regulations require concurrent reporting up the Service chain of command.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The reporting threshold is credible information sufficiently accurate to warrant further review of an allegation
      that potentially involves a law-of-war violation; the commander need not establish that a violation occurred.
  - id: C2
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The commander must assess credibility from the totality of the circumstances, including the source's reliability
      and how the source obtained the information, as well as contradictory or corroborating information. The selected reporting
      outcome rests on the assessment meeting the threshold.
  - id: C3
    facts:
    - F7
    - F9
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: Once an incident is reportable, the commander must report it immediately through the chain to the combatant commander
      by operational incident procedures or another expeditious means, with concurrent reporting up the Service chain as required.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: If the commander determines the allegation is not supported by credible information, the commander forwards that
      determination through the chain; that conditional route does not displace reporting when the threshold is met.
  reasoning:
    read: This is a threshold decision about whether credible information warrants further review, not a finding that a law-of-war
      violation occurred. The trap is to treat uncertainty about whether the allegation is true as enough to withhold it,
      rather than applying the stated credibility threshold.
    weighing: The controlling distinction is whether a reasonable commander would find the information sufficiently accurate
      to merit review. The totality assessment includes source reliability, how the source obtained the information, and contradictory
      or corroborating information. On the endorsed O2 path, that threshold is met, so the immediate reporting duty applies;
      if the assessment instead finds no credible support, the specified route is to forward that determination.
    tradecraft: Assess the information against the totality-of-the-circumstances factors, then transmit the report through
      the chain to the combatant commander using operational incident procedures or another expeditious means. Follow the
      concurrent Service-chain reporting requirement.
    uncertainty: The doctrine supplies the credibility factors but no particular source details or corroborating or contradictory
      evidence for this scenario. The outcome therefore depends on the commander's assessment; reporting does not resolve
      whether a violation occurred.
    handoff: The unit commander makes the credibility and reportability assessment, then sends a reportable incident through
      the chain to the combatant commander; concurrent Service-chain reporting is also required.
    tempting_wrong:
      option: O1
      pull: Withholding a report may seem appropriate when the allegation has not been proven or the information is uncertain.
      why_wrong: 'Proof of a violation is not the threshold: credible information that merits further review is enough, while
        O1 is the route only when the allegation is not supported by credible information.'
    rejected:
      O1: O1 was not chosen because the endorsed outcome applies the reportable-incident threshold and requires reporting
        when credible information warrants further review.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander determines that the allegation is not supported by credible information.
      then: O1
      why: The directive specifies forwarding that determination through the chain of command rather than reporting the allegation
        as a reportable incident.
    would_not_change:
    - id: noflip1
      if: The commander has not determined that a potential violation actually occurred, but credible information still warrants
        further review.
      why: The commander need not determine that a potential violation occurred to make the incident reportable.
    watch_for:
    - id: watch1
      what: The source's track record and how the source obtained the information.
      favors:
      - O1
      - O2
      why: These are stated credibility factors and may affect whether the information is sufficiently accurate to warrant
        further review.
    - id: watch2
      what: Contradictory or corroborating information.
      favors:
      - O1
      - O2
      why: The totality assessment expressly includes contradictory and corroborating information, which may affect whether
        the reporting threshold is met.
  lesson: Report when credible information would lead a reasonable commander to find that an allegation merits further review;
    do not wait for proof that a violation occurred. If the allegation is not supported by credible information, forward that
    determination through the chain of command.
  limits: This reasoning addresses only the initial reporting threshold and routing of the allegation. It does not decide
    the allegation's merits or prescribe a later investigation or operational response.
  library:
    domain: natsec-other
    family: CORPUS-NX-0dc044c5
    source: https://usnwc.libguides.com/ld.php?content_id=66281931
    episode_focus: 'The doctrine sets a threshold decision: report when a reasonable commander would find the information
      sufficiently accurate to warrant further review; if the allegation is not supported by credible information, forward
      that determination through the chain of command. The factors include source reliability and contradictory or corroborating
      information. Exclude the later investigation or operational response to the allegation.'
    cues:
      option_words:
        O1: 24
        O2: 23
      real_option: O2
      real_to_mean_other_length: 0.96
      real_is_longest: false
