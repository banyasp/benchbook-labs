case:
  id: DR-CORPUS-NX-d55bb147-E8@v1
  title: Weighing Strike Value Against Political Harm
  status: draft
  setting: Yemen, U.S. air-strike planning, around October 2012.
  decider: The U.S. military operational decision-maker
  agent: The U.S. military operational decision-maker
  agent_role: decide
  situation: A proposed strike against an AQAP member presents a possible way to eliminate a cadre who might otherwise be
    difficult to reach and to constrain AQAP leaders’ movement. U.S. air strikes are generally unpopular in Yemen, and civilian
    harm could undermine Yemeni authorities’ legitimacy, damage the U.S. image, and benefit AQAP. AQAP’s integration into
    local society makes harm to nearby people a persistent risk, while drone strikes have generally caused less collateral
    damage than less accurate manned aircraft. In a reported drone attack, a paramount tribal confederation shaykh’s son was
    killed, probably as an ancillary rather than principal target. The decision-maker must weigh the proposed target’s assessed
    significance against possible civilian harm and wider political effects.
  question: What should the U.S. military operational decision-maker do about authorizing the proposed strike against the
    AQAP member?
  options:
    O1:
      do: The U.S. military decision-maker requests senior review of the proposed strike against the AQAP member.
      move: ask
      irreversible: false
      to: a senior U.S. authority
    O2:
      do: The U.S. military decision-maker authorizes the proposed strike against the AQAP member.
      move: act
      irreversible: true
    O3:
      do: The U.S. military decision-maker declines authorization for the proposed strike against the AQAP member.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: U.S. strikes have made it possible to eliminate individual AQAP cadres who would otherwise be largely immune.
  - id: F2
    kind: capability
    status: assessed
    fact: Drones cause less collateral damage than would likely result from less accurate manned aircraft.
  - id: F3
    kind: situation
    status: assessed
    fact: Collateral damage from strikes may harm Yemeni authorities’ legitimacy and the United States’ image, to AQAP’s benefit.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A senior Yemeni military officer assessed that AQAP’s integration with the local population makes collateral damage
      a persistent risk.
  - id: F5
    kind: situation
    status: assessed
    fact: A paramount tribal confederation shaykh’s son was killed in a drone attack, probably as an ancillary rather than
      principal target.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The AQAP member at issue was described as insignificant, and the political cost of angering the paramount shaykh
      and alienating wider parts of the population was questioned.
  - id: F7
    kind: situation
    status: assessed
    fact: U.S. air strikes are generally unpopular in Yemen, and local sources may downplay the AQAP threat or exaggerate
      government success to avoid them.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A member of parliament argued that air strikes pave the way for al-Qaeda and terrorism and induce some people to
      join al-Qaeda; pro-Hadi media has also raised concerns that strikes cause great fear among local people.
  - id: F9
    kind: authority
    status: confirmed
    fact: U.S. planners have to assess second-order effects for each target, especially following the downstreaming of operational
      decision-making to the military.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Strikes can eliminate AQAP cadres who would otherwise be largely immune, giving authorization a direct operational
      benefit.
  - id: C2
    facts:
    - F2
    equity: third_party_harm
    favors:
    - O2
    weight: weak
    why: Drones cause less collateral damage than less accurate manned aircraft, but this is a comparative advantage, not
      an assurance that civilians will be safe.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: third_party_harm
    favors:
    - O3
    - O1
    weight: strong
    why: Civilian harm remains a risk where AQAP is integrated with the population, and it can damage Yemeni legitimacy and
      U.S. standing. The reported death of a paramount shaykh’s son makes the political cost concrete; eliminating an insignificant
      member may not justify that cost.
  - id: C4
    facts:
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O3
    - O1
    weight: strong
    why: Strikes are unpopular, may frighten local people, and may encourage support for al-Qaeda; local reporting can also
      be shaped by a desire to avoid strikes.
  - id: C5
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: weak
    why: The decision-maker must assess each target’s second-order effects, particularly as operational decisions have been
      delegated to the military. That requires a deliberate target-specific judgment, though it does not require referral
      to a higher authority.
  reasoning:
    read: This is a policy choice between the demonstrated ability to reach AQAP cadres and the danger that civilian harm
      can undermine Yemeni legitimacy, damage the U.S. image, and benefit AQAP. The trap is to treat drones’ comparative accuracy
      as eliminating civilian or political risk; civilian harm remains possible, with potential consequences for local legitimacy
      and support. The target’s significance is central, especially where eliminating an insignificant member may alienate
      a powerful shaykh and a wider population.
    weighing: Authorization draws support from the stated effectiveness of strikes against otherwise difficult-to-reach cadres
      and the lower collateral harm relative to less accurate manned aircraft {C1} {C2}. Against that stand persistent civilian
      risk, the reported death of the shaykh’s son, and public concern that strikes can aid AQAP {C3} {C4}. A target-by-target
      assessment of second-order effects is essential {C5}. The balance depends on whether the assessed value of this particular
      member is substantial enough to justify the political risk; the potential cost of eliminating an insignificant member
      is expressly questioned. The required outcome is authorization, but it is a contested judgment rather than a conclusion
      that the balance is clearly favorable.
    tradecraft: 'Make the authorization a target-specific policy judgment: record the assessed value of the target, the foreseeable
      civilian and political costs, the basis for comparing those costs with the mission benefit, and the uncertainties that
      remain. Do not treat general strike effectiveness or comparative accuracy as a substitute for that assessment.'
    uncertainty: There is no detailed estimate of the proposed target’s value or the likelihood and scale of harm in this
      particular case. The reported shaykh’s-son incident and public criticism illustrate possible costs, but do not resolve
      their likelihood for the proposed strike.
    handoff: U.S. planners must assess second-order effects, and operational decision-making has been downstreamed to the
      military. Senior referral is not stated as a requirement; the operational decision-maker should make and document the
      target-specific judgment within the authority assigned.
    tempting_wrong:
      option: O3
      pull: Declining avoids the immediate risk of civilian harm and political backlash, which are serious and may benefit
        AQAP.
      why_wrong: A blanket refusal would discount the stated ability of strikes to eliminate otherwise difficult-to-reach
        cadres. The appropriate judgment is a careful target-specific calculus, not an absolute rejection of strikes.
    rejected:
      O1: Senior review is a plausible precaution, but planners are assigned a target-specific second-order-effects calculus
        and referral to a higher authority is not required.
      O3: Declining would avoid the identified risks but would forgo the strike capability credited with eliminating otherwise
        difficult-to-reach AQAP cadres.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The target’s assessed significance is low while the foreseeable risk of alienating the shaykh and wider population
        is substantial.
      then: O3
      why: The policy assessment questions whether eliminating an insignificant member outweighs the risk of angering the
        paramount shaykh and alienating the population.
    - id: flip2
      if: The second-order assessment indicates that likely civilian or political harm would substantially undermine Yemeni
        legitimacy or benefit AQAP.
      then: O3
      why: These harms could outweigh the strike’s operational value.
    would_not_change:
    - id: noflip1
      if: The comparative advantage of drones over less accurate manned aircraft is the only additional justification offered.
      why: Lower comparative collateral damage does not remove the persistent risk of civilian harm or the possible political
        consequences.
    watch_for:
    - id: watch1
      what: Evidence that air strikes are increasing fear, opposition, or recruitment to al-Qaeda.
      favors:
      - O3
      - O1
      why: These possible downstream effects could change the target-specific balance.
  lesson: A strike’s ability to reach a difficult target and its comparative accuracy do not settle whether authorization
    is justified. Weigh the specific target’s assessed value against civilian risk and the political effects that may strengthen
    the adversary, and make that second-order assessment target by target.
  limits: This judgment concerns the policy balance described for U.S. air strikes in Yemen around October 2012; it does not
    establish a general authorization rule. It provides neither a legal standard nor a complete target assessment or quantified
    forecast of harm for the proposed strike.
