case:
  id: DR-CORPUS-NX-ed91b073-E2@v1
  title: Principal Access to Raw Collection Data
  status: draft
  setting: During policy design for the proposed PDB system for senior officials.
  decider: PDB policy designers
  agent: PDB policy designers
  agent_role: decide
  situation: PDB policy designers are considering whether principals and other designated leaders should have access to raw
    collection data. PDB items may rely on finished analysis or formal collection reports, and source information is relevant
    to recipients. The design could provide links to those finished products or provide access to raw data. Concerns include
    whether recipients can interpret raw data, manage its volume, and identify suitable information to request. Security and
    handling risks are also part of the decision.
  question: What should PDB policy designers do about principals' access to raw collection data and links to finished products?
  options:
    O1:
      do: The PDB policy designers should withhold principals' access to raw collection data in most cases and provide links
        to finished analysis or formal collection reports when PDB items rely on them.
      move: act
      irreversible: false
    O2:
      do: The PDB policy designers should disclose raw collection data to principals in most cases and provide links to finished
        analysis or formal collection reports when PDB items rely on them.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: PDB items may rely on finished analysis or formal collection reports.
  - id: F2
    kind: capability
    status: confirmed
    fact: Links to finished analysis or formal collection reports are to be available when a PDB item relies on them.
  - id: F3
    kind: situation
    status: confirmed
    fact: Providing principals and other designated leaders access to raw collection data is a considered design option.
  - id: F4
    kind: intelligence
    status: assessed
    fact: In most cases, the potential hazards of raw-data access may outweigh its benefits.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Principals may lack the context needed to interpret raw data properly.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Principals may become consumed or frustrated by the volume of information.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Principals may not understand how to request suitable data.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Raw-data access carries risks of security and handling violations.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: When an item relies on finished analysis or a formal collection report, links to that product preserve access to
      the supporting material without making raw collection the default.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Principals may lack the context needed to interpret raw data properly, creating a risk that direct access will not
      support sound understanding.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The volume of raw information may consume or frustrate recipients, who may also not know how to request suitable
      data.
  - id: C4
    facts:
    - F4
    - F8
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The overall judgment is that, in most cases, raw-data access hazards outweigh its benefits; security and handling
      violations are among those hazards.
  reasoning:
    read: 'The choice is not between source information and no source information: links to finished analysis or formal collection
      reports are available when a PDB item relies on them. The trap is treating principals'' interest in source information
      as a reason for routine access to raw collection, despite the stated risks of misinterpretation, overload, unsuitable
      requests, and security or handling violations.'
    weighing: The links in {C1} provide a route to relied-on finished products, while the comprehension and volume concerns
      in {C2} and {C3} weigh against routine raw access. The decisive consideration is the judgment in {C4} that the potential
      hazards will often outweigh the benefits. The recommendation is a default for most cases, not an absolute prohibition.
    tradecraft: Keep links to relied-on finished analysis and formal collection reports available. If considering an exception
      to the default, record why the particular benefit justifies the risks and how the recipient's need for source information
      will be met.
    uncertainty: The recommendation applies in most cases, but no exception criteria are specified, and the benefits and hazards
      are not quantified for any particular case.
    handoff: PDB policy designers can set the default; involving PDB Staff in responding to principals' follow-up questions
      is consistent with the identified value of tailoring answers to those questions.
    tempting_wrong:
      option: O2
      pull: Direct raw-data access may seem like the clearest way to meet principals' interest in source information.
      why_wrong: That approach gives insufficient weight to the risks that recipients may misinterpret the data, be overwhelmed,
        request unsuitable information, or cause security or handling violations.
    rejected:
      O2: Routine disclosure is not recommended because raw-data hazards will often outweigh the benefits, while links to
        relied-on finished products can still be provided.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C4
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A particular case established that the benefits of raw access outweigh the hazards, and that recipients can interpret
        the data, manage its volume, identify suitable information to request, and avoid security or handling violations.
      then: O2
      why: The recommendation applies in most cases; a case-specific balance in which the hazards no longer outweigh the benefits
        could support disclosure.
    would_not_change:
    - id: noflip1
      if: Principals express interest in source information, but links to the finished analysis or formal collection reports
        they need can be provided.
      why: Interest in source information alone does not displace the recommendation to avoid raw access in most cases when
        links to relied-on finished products are available.
    watch_for:
    - id: watch1
      what: Whether principals' follow-up questions can be addressed through answers tailored by PDB Staff.
      favors:
      - O1
      why: Customized answers to principals' daily PDB questions are identified as valuable, providing a way to respond to
        their questions without making raw-data access routine.
  lesson: A request for source information does not by itself require routine disclosure of raw data. Preserve access to relied-on
    finished products, and weigh direct access against recipients' ability to interpret and manage the information and the
    security and handling risks.
  limits: This reasoning addresses the proposed PDB policy default for principals' access to raw collection data. It does
    not establish a categorical prohibition or decide whether a particular exception is justified.
