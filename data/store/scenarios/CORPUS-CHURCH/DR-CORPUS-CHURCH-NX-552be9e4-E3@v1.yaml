case:
  id: DR-CORPUS-CHURCH-NX-552be9e4-E3@v1
  title: Occupation of Spanish Florida
  status: draft
  setting: Spanish Florida frontier, 1812; the War Department and federal government.
  decider: The War Department special agent on the Florida frontier.
  agent: The War Department special agent on the Florida frontier.
  agent_role: decide
  situation: Fernandina, on Amelia Island in Spanish Florida, had been a free-entry port for foreign vessels since 1808. The
    special agent invoked protection of American shipping interests as a reason to occupy the area. Federal officials were
    also considering occupation amid concern that Britain might use Florida as a base. The Spanish colonial governor opposed
    the agent’s activities. The agent reported to Washington, but the scope of his instructions did not clearly settle whether
    he had authority to order an occupation.
  question: What should the special agent do about using force to occupy Fernandina and Amelia Island, and under what authority?
  options:
    O1:
      do: The special agent declines the occupation of Fernandina and Amelia Island.
      move: act
      irreversible: false
    O2:
      do: The special agent authorizes the occupation of Fernandina and Amelia Island.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The agent worked for the War Department as a special agent on the Florida frontier.
  - id: F2
    kind: situation
    status: confirmed
    fact: Fernandina on Amelia Island had been a free-entry port for foreign vessels since 1808.
  - id: F3
    kind: situation
    status: assessed
    fact: The agent invoked protection of American shipping interests as a reason for occupation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Federal officials considered occupying Florida to prevent Britain from using it as a base.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Spanish colonial governor opposed the agent’s activities in Spanish Florida.
  - id: F6
    kind: authority
    status: assessed
    fact: The scope of the federal instructions did not clearly settle whether the agent could order an occupation.
  - id: F7
    kind: authority
    status: confirmed
    fact: Congress discussed the necessity of occupying Florida in secret session.
  considerations:
  - id: C1
    facts:
    - F1
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The agent was a War Department representative, but the scope of federal instructions did not clearly establish authority
      to order an occupation. The account treats the agent’s conduct as a commissioner as indefensible despite that federal
      role.
  - id: C2
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Preventing Britain from using Florida as a base was a federal concern, and Congress discussed occupation in secret
      session. Those facts support considering the mission, but do not establish that this agent had authority to use force.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The port’s foreign-entry status and the stated aim of protecting American shipping provide a rationale for action,
      but the account does not treat that rationale as sufficient to justify the agent’s occupation.
  - id: C4
    facts:
    - F5
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: The Spanish colonial governor opposed the agent’s activities. Proceeding with force despite that opposition heightened
      the risk of an unjustified intervention.
  reasoning:
    read: 'The decision is not simply whether protecting shipping or preventing a possible British foothold was worthwhile.
      The trap is treating a federal strategic concern, and an agent’s stated rationale, as if either settled the agent’s
      authority to occupy Spanish territory. The account does not portray the agent as a selfish private plotter: he reported
      to Washington and reflected the expansionist outlook of his era. It nevertheless judges his conduct as a government
      commissioner indefensible.'
    weighing: The shipping rationale and concern about Britain weigh in favor of considering occupation, but the account distinguishes
      those federal concerns from the agent’s unclear instructions and authority. It records that federal officials said he
      had misunderstood his instructions, and judges the conduct indefensible; the later continuation of the occupation and
      congressional outcry reinforce the account’s disapproval. On this record, the balance favors declining to use force
      unless competent federal authority clearly authorizes it. The balance depends on the distinction between federal consideration
      of occupation and a settled delegation to this agent.
    tradecraft: Do not authorize force on an ambiguous mandate. Refer the proposed occupation to the responsible federal decision-makers,
      seek an explicit decision about authority and purpose, and preserve a candid record of the instructions and the basis
      for the decision.
    uncertainty: The account leaves open how far the agent misunderstood changing policy and whether he was acting on opaque
      instructions or pursuing his own version of the government’s aims. That uncertainty does not erase its stated judgment
      that his conduct as a commissioner was indefensible.
    handoff: The agent should not decide this alone. He should refer the matter to the responsible federal officials in Washington,
      because the account describes regular reporting, unclear instructions, and a question of national policy that Congress
      itself considered.
    tempting_wrong:
      option: O2
      pull: The port’s shipping interests and concern that Britain might use Florida as a base make forceful action seem protective
        and consistent with federal interests.
      why_wrong: Those concerns do not themselves settle the agent’s authority. The account’s judgment is that the commissioner’s
        conduct was indefensible despite the federal context and the agent’s stated rationale.
    rejected:
      O2: The account rejects the occupation as carried out under the agent’s unclear instructions, judging his conduct as
        a government commissioner indefensible.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Competent federal authority issued a clear, explicit authorization to occupy, grounded in an established federal
        decision about the threat and the purpose of the action.
      then: O2
      why: 'That would address the central defect in this case: the agent’s unclear authority to convert federal concerns
        into an occupation.'
    would_not_change:
    - id: noflip1
      if: The agent repeated the shipping-protection rationale while the scope of his instructions remained unclear.
      why: A stated purpose alone would not resolve the authority problem or overcome the account’s judgment about the agent’s
        conduct.
    watch_for:
    - id: watch1
      what: Reliable evidence that Britain was moving to seize Florida as a base, presented to the responsible federal decision-makers.
      favors:
      - O2
      why: A concrete threat could strengthen the case for federal action, though it would not by itself establish this agent’s
        authority.
  lesson: A compelling national-security purpose does not itself confer authority on an agent to use force. When the mandate
    is unclear, separate the government’s policy deliberation from the agent’s delegated power and obtain a clear decision
    from the responsible authority.
  limits: This judgment concerns the agent’s occupation under the instructions and circumstances described; it does not decide
    whether the federal government could have authorized an occupation through proper channels. It is not a general rule that
    forceful action to protect shipping or prevent a foreign foothold is always unjustified.
