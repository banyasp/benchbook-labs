case:
  id: DR-CORPUS-CHURCH-NX-fdb75aa3-E8@v1
  title: 'OSO and OPC: Separate Components or Integration'
  status: draft
  setting: CIA, 1951–1952
  decider: The DCI
  agent: The DCI
  agent_role: decide
  situation: OSO and OPC remained separately administered components within the CIA, although their organizational responsibilities
    overlapped. Their relationship was marked by organizational rivalry and intense conflict at the operating level. OPC personnel
    held higher-ranking, better-paid positions than their OSO counterparts, and by June 1952 OPC had surpassed OSO in personnel
    and budget allocation. A survey and the CIA General Counsel recommended a merger, while senior OSO personnel favored placing
    OPC functions under OSO control rather than creating an integrated chain of command. The DCI had administrative control
    of OPC, and policy guidance from State and Defense was channeled through the DCI.
  question: What should the DCI do about the organizational relationship between OSO and OPC?
  options:
    O1:
      do: The DCI integrates OSO and OPC in a unified Directorate of Plans.
      move: act
      irreversible: false
    O2:
      do: The DCI combines selected divisional functions while retaining separate administrations.
      move: partial
      irreversible: false
    O3:
      do: The DCI separates OSO and OPC into independently administered components.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: OSO and OPC were separately administered components despite having related, overlapping responsibilities.
  - id: F2
    kind: situation
    status: assessed
    fact: Organizational rivalry dominated relations between OSO and OPC, and conflicts between them were intense at the operating
      level.
  - id: F3
    kind: situation
    status: confirmed
    fact: Differences in pay and mission were identified as sources of antagonism between OSO and OPC.
  - id: F4
    kind: situation
    status: confirmed
    fact: OPC personnel held higher-ranking, better-paid positions than their OSO counterparts.
  - id: F5
    kind: situation
    status: confirmed
    fact: By June 1952, OPC had surpassed OSO in personnel and budget allocation.
  - id: F6
    kind: authority
    status: confirmed
    fact: The DCI assumed administrative control of OPC, and State and Defense policy guidance was channeled through the DCI.
  - id: F7
    kind: situation
    status: confirmed
    fact: The CIA General Counsel recommended merging OSO and OPC, and a survey also advised a merger.
  - id: F8
    kind: situation
    status: assessed
    fact: Senior OSO personnel argued for placing OPC functions under OSO control and feared OSO would be engulfed by OPC.
  - id: F9
    kind: situation
    status: confirmed
    fact: The DCI was committed to an integrated structure, although senior OSO personnel disagreed about its form.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Separate administration of related responsibilities left organizational rivalry, rather than interchange, dominant
      and produced intense operating-level conflict; integration addresses the structural coordination problem.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Differences in mission and compensation fed antagonism, and OPC's greater rank, pay, personnel, and budget added
      to the imbalance. These conditions strengthened the case for addressing the relationship structurally, though the source
      does not say integration itself would resolve them.
  - id: C3
    facts:
    - F7
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The General Counsel and a survey recommended merger, and the DCI was committed to an integrated structure; this supported
      moving beyond coordination changes that left the components separately administered.
  - id: C4
    facts:
    - F8
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: Senior OSO leaders feared being engulfed and preferred OPC functions under OSO control rather than an integrated
      chain of command. That was a real concern about the form of integration, but it did not change the DCI's commitment
      to integration.
  reasoning:
    read: 'The central problem was not simply friction between two offices: related responsibilities were divided between
      separately administered components, and rivalry dominated their relationship. The trap is to treat pay and status grievances
      as the whole problem, or to assume that assigning OPC functions to OSO would answer the broader coordination problem.'
    weighing: 'The structural case for integration is strongest: the separation accompanied intense conflict, while the General
      Counsel and a survey recommended merger and the DCI favored an integrated structure {C1} {C3}. Rank, pay, and resource
      disparities contributed to antagonism but do not, on this record, establish that retaining separate administrations
      would cure it {C2}. OSO''s fear of being engulfed weighs against the chosen form, but the source records disagreement
      about form alongside support for merger in principle {C4}. The balance therefore favors O1, while depending on whether
      integration can establish a unified structure without allowing one component''s interests to dominate.'
    tradecraft: Record the coordination problem, the competing views about the form of integration, and the reasons for choosing
      a unified structure. Define reporting and decision authority clearly, consult the affected senior offices and the General
      Counsel, and review whether integration is reducing organizational rivalry rather than reproducing it under one structure.
    uncertainty: The source identifies the causes of conflict and records the decision, but does not establish that integration
      would resolve rank, pay, or resource grievances. It also records concern that OSO could be engulfed and notes that integration's
      organizational effects could be uneven.
    handoff: 'The DCI should decide the internal structure, after consulting senior OSO and OPC leadership and the General
      Counsel: the disagreement concerned the form of integration, while the DCI held administrative control of OPC and policy
      guidance from State and Defense was channeled through the DCI.'
    tempting_wrong:
      option: O2
      pull: It appears to offer compromise by combining selected functions while preserving separate administrations, addressing
        OSO's concern about being absorbed.
      why_wrong: The source describes coordination changes while the components remained separately administered, but says
        real integration at the operations level came later; a partial arrangement would leave the underlying division in
        place.
    rejected:
      O2: The source records prior coordination changes but identifies the continuing separation as part of the problem, so
        selected combinations with separate administrations were not the chosen structural remedy.
      O3: Keeping the components separately administered would preserve the arrangement associated with rivalry and intense
        conflict despite their related responsibilities.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that a unified structure would intensify the risk of OSO being engulfed, while combining
        selected functions could resolve the coordination problem and preserve effective accountability.
      then: O2
      why: That would make the concern about integration's form more consequential and support a partial structure instead.
    - id: flip2
      if: The responsibilities ceased to overlap and the rivalry attributable to separate administration no longer impaired
        coordination.
      then: O3
      why: Without the structural coordination problem, the source's main reason for integration would be substantially reduced.
    would_not_change:
    - id: noflip1
      if: The pay and rank disparities were reduced but the components remained separately administered with overlapping responsibilities
        and operating-level rivalry.
      why: The source identifies compensation as one source of antagonism, but also identifies structural separation and organizational
        rivalry as central problems.
    watch_for:
    - id: watch1
      what: Whether a unified structure gives clear authority across the components while addressing OSO's concern about being
        engulfed.
      favors:
      - O2
      why: If integration does not provide balanced, workable authority, the concern about its form becomes more weighty.
  lesson: When separately administered components have overlapping responsibilities and persistent rivalry, address the structural
    source of the conflict rather than relying on coordination measures alone. Integration still requires attention to authority
    and balance, especially when one component fears being overwhelmed.
  limits: This reasoning applies to the organizational choice described here, not to the merits of any particular intelligence
    activity. It does not establish that integration will cure compensation or resource disparities, or that integration is
    appropriate when responsibilities and authority are materially different.
