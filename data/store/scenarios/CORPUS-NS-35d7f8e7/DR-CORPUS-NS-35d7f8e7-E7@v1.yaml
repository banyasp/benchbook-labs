case:
  id: DR-CORPUS-NS-35d7f8e7-E7@v1
  title: Deadly Force During a POW Escape Attempt
  status: draft
  setting: A POW camp during an escape attempt or camp rebellion, under the rules for POWs.
  decider: The camp authority responsible for responding
  agent: The camp authority responsible for responding
  agent_role: decide
  situation: At a POW camp, an escape attempt or camp rebellion involving POWs is underway. The camp authority must decide
    whether to use deadly force or another means to stop the immediate attempt. The governing framework permits force against
    POWs in this setting. It limits deadly force to cases where no other means can immediately stop the attempt. Weapons use
    against escaping or attempting POWs is treated as an extreme measure, and appropriate warnings must precede it. The decision
    turns on whether another means can immediately stop the attempt and what warnings are appropriate in the circumstances.
  question: What should the camp authority do about using deadly force to stop the POW escape attempt or rebellion?
  options:
    O1:
      do: The camp authority authorizes deadly force only if no other means can stop the attempt immediately, with warnings.
      move: act
      irreversible: true
    O2:
      do: The camp authority prohibits deadly force and directs another means to stop the attempt.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision concerns an escape attempt or camp rebellion involving POWs.
  - id: F2
    kind: authority
    status: confirmed
    fact: Use of force against POWs during an escape attempt or camp rebellion is lawful.
  - id: F3
    kind: authority
    status: confirmed
    fact: Deadly force is authorized only when there is no other means of immediately stopping the attempt.
  - id: F4
    kind: authority
    status: confirmed
    fact: The immediate purpose of the deadly force threshold is to stop the attempt.
  - id: F5
    kind: authority
    status: confirmed
    fact: Weapons use against POWs, especially those escaping or attempting to escape, is an extreme measure.
  - id: F6
    kind: authority
    status: confirmed
    fact: Warnings appropriate to the circumstances must precede weapons use against POWs.
  considerations:
  - id: C1
    facts:
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The doctrine permits force against POWs during an escape attempt or camp rebellion, but that general permission does
      not by itself authorize deadly force.
  - id: C2
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Deadly force is authorized only when no other means can immediately stop the attempt; the decision must turn on that
      necessity threshold.
  - id: C3
    facts:
    - F5
    equity: hors_de_combat
    favors:
    - O2
    - O1
    weight: strong
    why: Weapons use against POWs, particularly escaping or attempting to escape, is an extreme measure. That requires restraint,
      while leaving room for the doctrine's narrowly conditioned authorization.
  - id: C4
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Weapons use must be preceded by warnings appropriate to the circumstances, so any authorization must preserve that
      requirement.
  reasoning:
    read: This is a decision about stopping an ongoing escape attempt or camp rebellion, not a general authorization to use
      deadly force. The trap is treating the general lawfulness of force against POWs as permission to use deadly force without
      the separate necessity threshold and warnings.
    weighing: 'The doctrine supports conditional authorization: deadly force is available only if no other means can immediately
      stop the attempt, and weapons use must be preceded by appropriate warnings. Whether that threshold is met depends on
      whether another immediate means is available; the extreme-measure characterization reinforces restraint but does not
      erase the conditional authorization.'
    tradecraft: Determine and record whether another means can immediately stop the attempt and what warnings are appropriate
      in the circumstances. Keep any authorization limited to the stated necessity condition and warning requirement; this
      does not address methods of employing force.
    uncertainty: The stated facts do not establish whether another immediate means is available or which warnings are appropriate.
      Those circumstances must be assessed before the conditional authorization can be acted on.
    handoff: The camp authority responsible for responding is the identified decision-maker. The excerpt gives no mandatory
      referral or consultation procedure, so any further handoff depends on authority or procedures outside this source.
    tempting_wrong:
      option: O2
      pull: Because weapons use is an extreme measure and warnings are required, a blanket prohibition on deadly force may
        seem safest.
      why_wrong: The doctrine does not prohibit deadly force categorically; it authorizes it when no other means can immediately
        stop the attempt, subject to appropriate prior warnings.
    rejected:
      O2: A categorical prohibition does not preserve the doctrine's authorization to use deadly force when no other means
        can immediately stop the attempt.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Another means can immediately stop the attempt.
      then: O2
      why: The stated necessity condition for deadly force would not be met.
    would_not_change:
    - id: noflip1
      if: The event is an escape attempt rather than a camp rebellion, or a camp rebellion rather than an escape attempt.
      why: The doctrine applies the same force rule to both settings.
    watch_for:
    - id: watch1
      what: Whether another means can immediately stop the attempt and what warnings are appropriate in the circumstances.
      favors:
      - O1
      why: Those circumstances determine whether the necessity threshold is met and whether the warning condition can be satisfied.
  lesson: Permission to use force does not amount to unrestricted permission to use deadly force. Apply the necessity threshold,
    and ensure warnings appropriate to the circumstances precede weapons use.
  limits: This reasoning addresses only the stated POW escape-attempt or camp-rebellion rule. It does not determine whether
    the conditions for deadly force are actually met in a particular incident or address other applicable law or procedures.
  library:
    domain: use-of-force-policy
    family: CORPUS-NS-35d7f8e7
    source: https://tile.loc.gov/storage-services/service/ll/llmlp/LOAC-Deskbook-2013/LOAC-Deskbook-2013.pdf
    episode_focus: The decision point is whether the circumstances justify deadly force rather than another means of stopping
      an escape attempt or rebellion. The doctrine sets a necessity threshold and says warnings appropriate to the circumstances
      must precede weapons use. Do not describe methods of employing force.
