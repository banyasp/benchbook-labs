        O2: 14
        O1: 18
      real_option: O1
      real_to_mean_other_length: 1.29
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The POW-use-of-force doctrine provides that deadly force is authorized “only when there is no other means of putting
  an immediate stop to the attempt,” and that warnings appropriate to the circumstances must precede weapons use.
