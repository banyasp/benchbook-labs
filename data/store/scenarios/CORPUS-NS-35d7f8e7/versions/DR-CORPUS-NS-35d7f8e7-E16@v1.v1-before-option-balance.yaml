case:
  id: DR-CORPUS-NS-35d7f8e7-E16@v1
  title: Detainee Transfers and Torture Risk
  status: draft
  setting: Afghanistan, as recently as January 2013, the United States; detainee-transfer policy.
  decider: the United States
  agent: the United States
  agent_role: decide
  situation: As recently as January 2013, a U.S. detainee-transfer decision concerned 34 Afghan units and facilities. UNAMA
    had reported widespread detainee abuse. Article 3(1) bars a State Party from expelling, returning, or extraditing a person
    to another State where substantial grounds exist for believing the person would be in danger of torture. Article 3(2)
    calls for competent authorities to consider all relevant factors, including where applicable a consistent pattern of gross,
    flagrant, or mass human-rights violations in the State concerned.
  question: What should the United States do about detainee transfers to the 34 Afghan units and facilities in view of UNAMA's
    abuse reports and the applicable torture-risk standard?
  options:
    O1:
      do: The United States suspends detainee transfers to the 34 Afghan units and facilities.
      move: act
      irreversible: false
    O2:
      do: The United States resumes detainee transfers to the 34 Afghan units and facilities.
      move: act
      irreversible: false
    O3:
      do: The United States requests updated information from UNAMA on detainee abuse in Afghanistan.
      move: ask
      irreversible: false
      to: UNAMA
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Article 3(1) prohibits a State Party from expelling a person to another State when the specified torture-risk threshold
      is met.
  - id: F2
    kind: authority
    status: confirmed
    fact: Article 3(1) also prohibits returning a person to another State when the specified torture-risk threshold is met.
  - id: F3
    kind: authority
    status: confirmed
    fact: Article 3(1) also prohibits extraditing a person to another State when the specified torture-risk threshold is met.
  - id: F4
    kind: authority
    status: confirmed
    fact: The threshold is substantial grounds for believing the person would be in danger of being subjected to torture.
  - id: F5
    kind: authority
    status: confirmed
    fact: Article 3(2) directs competent authorities to take all relevant considerations into account when determining whether
      such grounds exist.
  - id: F6
    kind: authority
    status: confirmed
    fact: Relevant considerations may include a consistent pattern of gross, flagrant, or mass human-rights violations in
      the State concerned.
  - id: F7
    kind: intelligence
    status: assessed
    fact: UNAMA reported widespread detainee abuse.
  - id: F8
    kind: situation
    status: confirmed
    fact: The transfer issue concerned 34 Afghan units and facilities.
  - id: F9
    kind: situation
    status: confirmed
    fact: The episode was as recently as January 2013.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Article 3(1) prohibits transfer when substantial grounds exist for believing a person would face danger of torture.
      The excerpt gives this risk threshold but does not say that the United States formally found it met for every transfer.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Competent authorities must consider all relevant factors, including a consistent pattern of gross, flagrant, or mass
      human-rights violations where applicable. UNAMA's report of widespread detainee abuse is a serious risk indicator, though
      the excerpt does not establish that it alone satisfies that pattern description or the individual torture-risk threshold.
  - id: C3
    facts:
    - F7
    - F8
    - F9
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The United States ceased transfers to the 34 Afghan units and facilities following UNAMA's reports of widespread
      detainee abuse; this is the stated risk-based reason for the chosen action.
  reasoning:
    read: This is a transfer decision in the face of reports of widespread detainee abuse, governed by a rule against transfer
      where substantial grounds for believing a person would face torture exist. The trap is to treat the reports either as
      automatic proof that the threshold is met for every person or as irrelevant unless that finding has already been made.
    weighing: The torture-risk threshold and the duty to consider all relevant factors weigh toward suspending transfers while
      the reported abuse presents a serious concern {C1} {C2}. The United States did suspend transfers to the 34 units and
      facilities following the reports {C3}. The excerpt does not state a finding that the threshold was met in each case,
      so the legal conclusion depends on the competent authorities' assessment of the relevant circumstances.
    tradecraft: Keep the decision focused on the reported abuse and the applicable risk threshold; record the relevant information
      and the competent authorities' assessment of all relevant considerations. Reassess if the information bearing on the
      risk changes.
    uncertainty: The excerpt does not describe individualized risk assessments, establish whether the reports amount to a
      consistent pattern of gross, flagrant, or mass violations, or state that the legal threshold was formally found met.
      It establishes the reports and the resulting suspension, not the full evidentiary basis for a threshold finding.
    handoff: The United States makes the transfer decision, with competent authorities involved in assessing whether substantial
      grounds exist and considering all relevant factors under Article 3(2).
    tempting_wrong:
      option: O2
      pull: Resuming transfers could seem reasonable if the reports have not yet been translated into a formal finding that
        the Article 3(1) threshold is met.
      why_wrong: The absence of a stated formal finding does not make the widespread-abuse reports irrelevant; Article 3(2)
        requires relevant considerations to be taken into account, and the reported abuse was the stated reason for suspending
        transfers.
    rejected:
      O2: Resuming transfers was not chosen because the reported widespread detainee abuse raised the torture-risk concern
        that led the United States to cease transfers.
      O3: Requesting updated information could inform later reassessment, but it was not the chosen response to the abuse
        reports; the United States suspended transfers.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Competent authorities, after considering all relevant factors, determine that substantial grounds for believing
        the person would face torture do not exist for the transfers at issue.
      then: O2
      why: The stated Article 3(1) prohibition is conditional on that risk threshold; a supported determination that it is
        not met could change the transfer decision.
    would_not_change:
    - id: noflip1
      if: The reports do not, by themselves, establish a consistent pattern of gross, flagrant, or mass human-rights violations.
      why: 'That alone would not resolve the transfer question: Article 3(2) calls for all relevant considerations, and Article
        3(1) states a separate torture-risk threshold.'
    watch_for:
    - id: watch1
      what: Updated information about detainee abuse bearing on whether substantial grounds for believing a person would face
        torture exist.
      favors:
      - O1
      why: Such information is relevant to the risk assessment and could reinforce the reason for maintaining the suspension.
  lesson: When transfer is barred by a torture-risk threshold, assess the risk using all relevant considerations, including
    applicable patterns of human-rights violations. Serious abuse reports warrant attention but should not be overstated as
    a conclusive individualized finding when the source does not make one.
  limits: This reasoning addresses the suspension described in the excerpt and does not establish whether the Article 3(1)
    threshold was met for every person or facility. A different record or a competent assessment that the risk has changed
    could support a different decision.
