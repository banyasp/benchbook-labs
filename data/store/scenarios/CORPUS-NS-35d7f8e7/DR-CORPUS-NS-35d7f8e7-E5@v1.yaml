case:
  id: DR-CORPUS-NS-35d7f8e7-E5@v1
  title: Protection Pending POW Status Determination
  status: draft
  setting: During an international armed conflict; military detention; an Article 5 status determination under GC III.
  decider: The competent tribunal
  agent: The competent tribunal
  agent_role: decide
  situation: The Individual has committed a belligerent act and fallen into the hands of the opposing party during an international
    armed conflict. Doubt has arisen about whether the Individual belongs to a category entitled to POW status under Article
    4 of GC III. The competent tribunal is to determine the Individual’s status. POW status carries GC III protections and
    immunity for warlike acts. The tribunal process uses three voting members and a nonvoting recorder, and the standard of
    proof is preponderance of the evidence.
  question: What should the competent tribunal do about POW protections while determining the Individual’s status?
  options:
    O1:
      do: The competent tribunal denies the Individual POW protections pending its status determination.
      move: act
      irreversible: false
    O2:
      do: The competent tribunal grants the Individual POW protections pending its status determination.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual committed a belligerent act and fell into the hands of the opposing party.
  - id: F2
    kind: situation
    status: confirmed
    fact: Doubt has arisen about whether the Individual belongs to a category enumerated in Article 4 of GC III.
  - id: F3
    kind: authority
    status: confirmed
    fact: POW status is recognized in an international armed conflict, not a non-international armed conflict.
  - id: F4
    kind: authority
    status: confirmed
    fact: In an international armed conflict, Article 4 of GC III identifies the categories of persons entitled to POW status.
  - id: F5
    kind: authority
    status: confirmed
    fact: A person whose Article 4 status is in doubt receives GC III protection until a competent tribunal determines the
      person’s status.
  - id: F6
    kind: situation
    status: confirmed
    fact: POW status carries GC III rights and protections, including immunity for warlike acts.
  - id: F7
    kind: authority
    status: confirmed
    fact: AR 190-8 provides for three voting tribunal members and one nonvoting recorder, and sets preponderance of the evidence
      as the standard of proof.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: Article 5 requires a person whose Article 4 status is in doubt to receive GC III protection until a competent tribunal
      determines status; denying protection during that period is inconsistent with the stated rule.
    rules_out:
    - O1
  - id: C2
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: POW status carries GC III rights and protections, including immunity for warlike acts, so the interim protection
      has substantial consequences for the Individual.
  - id: C3
    facts:
    - F4
    - F7
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Article 4 categories govern the status question, and AR 190-8 supplies a tribunal process and preponderance standard
      for resolving it; the pending determination does not displace Article 5's interim protection.
  reasoning:
    read: This is an international armed conflict, and the Individual has committed a belligerent act and fallen into opposing
      hands. The decision is whether to provide protection while the tribunal resolves doubt about Article 4 status, not whether
      to declare final POW status in advance.
    weighing: 'Article 5 controls the interim choice: protection continues until the competent tribunal determines status
      {C1}. That rule carries particular weight because POW protections include Convention rights and immunity for warlike
      acts {C2}. The tribunal''s Article 4 inquiry uses the stated preponderance standard, but its process does not authorize
      withholding protection while that inquiry remains pending {C3}.'
    tradecraft: Keep the interim protection decision distinct from the final status determination. Record that protection
      is being provided because status is unresolved, then document the evidence and the tribunal's determination under the
      applicable standard.
    uncertainty: The Individual's ultimate Article 4 status remains unresolved on these facts. That uncertainty is the condition
      Article 5 addresses; it does not create discretion to withhold interim protection.
    handoff: The competent tribunal should make the status determination through the prescribed tribunal process; no separate
      decision-maker is needed for the interim rule.
    tempting_wrong:
      option: O1
      pull: The tribunal has not yet established that the Individual belongs to an Article 4 category, which may make withholding
        protections seem cautious.
      why_wrong: 'Article 5 assigns the consequence of that unresolved doubt: GC III protection applies until the tribunal
        determines status.'
    rejected:
      O1: It was not chosen because Article 5 requires GC III protection while Article 4 status remains in doubt and undetermined.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The competent tribunal has determined that the Individual does not belong to an Article 4 category.
      then: O1
      why: The Article 5 interim protection lasts only until status is determined; a finding of ineligibility would end the
        basis for granting POW protections pending that determination.
    would_not_change:
    - id: noflip1
      if: The Individual lacks an identification card issued by a belligerent government.
      why: Possession of an identification card is one factor in determining POW status; before 1949, possession was a prerequisite.
    watch_for:
    - id: watch1
      what: Evidence bearing on whether the Individual belongs to an Article 4 category, including the nature of the person's
        affiliation and the applicable fighter criteria.
      favors:
      - O1
      - O2
      why: That evidence informs the final status determination, while Article 5 protection remains in place until the tribunal
        resolves the doubt.
  lesson: When a person who committed a belligerent act is in opposing hands and doubt remains about Article 4 status, provide
    GC III protection until a competent tribunal determines status. Interim protection is not a final finding of POW status.
  limits: This conclusion addresses the interim period in an international armed conflict where Article 4 status is in doubt.
    It does not decide final status, or the protections applicable in a non-international armed conflict.
  library:
    domain: natsec-other
    family: CORPUS-NS-35d7f8e7
    source: https://tile.loc.gov/storage-services/service/ll/llmlp/LOAC-Deskbook-2013/LOAC-Deskbook-2013.pdf
