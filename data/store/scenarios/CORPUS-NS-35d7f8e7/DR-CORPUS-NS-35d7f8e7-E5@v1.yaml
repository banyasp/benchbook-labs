      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: Article 5 of GC III provides that persons whose Article 4 status is in doubt enjoy Convention protection until a competent
  tribunal determines their status.
