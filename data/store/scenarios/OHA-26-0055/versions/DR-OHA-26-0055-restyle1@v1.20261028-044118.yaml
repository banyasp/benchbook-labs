case:
  id: DR-OHA-26-0055-restyle1@v1
  title: Restoration of Access Authorization under Guideline G [restyle]
  status: needs_review
  setting: DOE Office of Security Adjudications, 6 July 2026
  decider: Senior Adjudicative Officer
  agent: Senior Adjudicative Officer
  agent_role: decide
  situation: A contractor employee of the Department of Energy holds a position that requires a security clearance. The Local
    Security Office filed a Guideline G concern after the employee received an open-container citation on 24 July 2025 and
    was initially diagnosed with Alcohol Use Disorder, Moderate, by a DOE-appointed psychologist. The psychologist ordered
    an intensive outpatient program, weekly recovery meetings, and a twelve-month abstinence period. The employee testified
    that his last drink was on 10 January 2026 and submitted five consecutive negative PEth results dated 10 February, 5 March,
    9 April, 6 May, and 8 June 2026. He has attended weekly SMART Recovery sessions since 12 January 2026, completed a 25-session
    intensive outpatient program by May 2026, and remains in after-care. The DOE psychologist later revised the diagnosis
    to Alcohol Use Disorder, Mild, and assessed the employee as being in early remission with a favorable outlook.
  question: How should the Senior Adjudicative Officer rule on the employee's security clearance under Guideline G?
  options:
    O1:
      do: The Senior Adjudicative Officer denies the employee's security clearance.
      move: act
      irreversible: true
    O2:
      do: The Senior Adjudicative Officer delays the decision pending further evidence.
      move: hold
      irreversible: false
    O3:
      do: The Senior Adjudicative Officer seeks additional data from the Local Security Office.
      move: ask
      irreversible: false
    O4:
      do: The Senior Adjudicative Officer restores the employee's security clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: On 24 July 2025 the employee was cited for possessing an open alcoholic container after being stopped for a traffic
      violation.
  - id: F3
    kind: situation
    status: confirmed
    fact: A DOE psychologist, in an October 2025 evaluation, diagnosed the employee with Alcohol Use Disorder, Moderate.
  - id: F4
    kind: situation
    status: confirmed
    fact: The psychologist prescribed an intensive outpatient program, weekly support meetings, and a minimum twelve-month
      period of abstinence.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee testified that his final alcoholic drink occurred on 10 January 2026 and supplied five negative PEth
      tests dated 10 February, 5 March, 9 April, 6 May, and 8 June 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee began weekly SMART Recovery meetings on 12 January 2026 and has attended without interruption; the
      facilitator confirmed active participation.
  - id: F7
    kind: situation
    status: confirmed
    fact: The employee finished a 25-session intensive outpatient program by May 2026 and continues after-care, supported
      by a progress letter.
  - id: F8
    kind: situation
    status: confirmed
    fact: The DOE psychologist later revised the diagnosis to Alcohol Use Disorder, Mild, and concluded the employee is in
      early remission with a good prognosis.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Local Security Office raised a Guideline G security concern based on the open-container citation and the AUD
      diagnosis.
  considerations:
  - id: C1
    facts:
    - F5
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The employee supplied five consecutive negative PEth results that span the interval after his last reported drink,
      meeting the evidentiary threshold for verified abstinence.
  - id: C2
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: Completion of a 25-session intensive outpatient program and ongoing after-care satisfy the remedial requirements
      enumerated in Guideline G.
  - id: C3
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The revised mild diagnosis, early-remission status, and positive prognosis from the DOE psychologist indicate a substantially
      reduced security risk.
  - id: C4
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The Guideline G concern was triggered by the citation and original diagnosis; the employee has now fulfilled mitigating
      conditions (b) and (c) as required by the Adjudicative Guidelines.
  - id: C5
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: Although regulations impose a presumption against granting a clearance, the adjudicative balance permits reversal
      when mitigation is convincingly demonstrated.
  reasoning:
    read: The Local Security Office cited the open-container violation and an initial Moderate AUD diagnosis as a Guideline
      G security issue. Subsequent records show sustained abstinence, successful treatment completion, and a milder professional
      assessment with a favorable outlook.
    weighing: The Officer weighed the mitigating evidence against the statutory presumption favoring denial. Because the employee
      satisfied mitigating conditions (b) and (c) of Guideline G (C4) through documented abstinence (C1), treatment completion
      (C2), and a supportive clinical opinion (C3), the balance favored reinstatement. The presumption noted in C5 was acknowledged
      but did not outweigh the concrete mitigation.
    tradecraft: The decision is entered in the Senior Adjudicative Officer's written ruling, referencing the applicable CFR
      sections and Adjudicative Guidelines, and the clearance restoration is logged in the employee's security file.
    uncertainty: The principal uncertainty concerns any potential future alcohol use; the current dossier shows no evidence
      of relapse.
    handoff: The Senior Adjudicative Officer acts independently, pursuant to 10 C.F.R. § 710.7(a). No further agency action
      is required unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: The statutory presumption against clearance and the original Moderate AUD diagnosis might tempt a denial.
      why_wrong: The record explicitly demonstrates that all mitigating conditions have been met, making denial inconsistent
        with the adjudicative guidelines.
    rejected:
      O1: Denial was rejected because the employee fulfilled Guideline G mitigation criteria.
      O2: Deferring the decision was rejected; the record already contains sufficient evidence.
      O3: Requesting additional information was rejected; the existing documentation meets the required standards.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had not submitted a series of negative PEth tests confirming continuous abstinence.
      then: O1
      why: Absent documented abstinence, mitigating condition (b) of Guideline G would remain unmet, leading to denial.
    would_not_change:
    - id: noflip1
      if: The diagnosis had remained AUD Moderate rather than being revised to Mild.
      why: Even with a Moderate diagnosis, the employee still satisfied mitigating conditions (b) and (c), so reinstatement
        would still be appropriate.
    watch_for:
    - id: watch1
      what: Any future positive PEth result or other indication of relapse.
      favors:
      - O1
      why: A relapse would reactivate the Guideline G security concern and could justify revocation.
  lesson: Guideline G permits clearance restoration when an individual demonstrates sustained abstinence, completes the mandated
    treatment, and receives a professional assessment indicating early remission.
  limits: This reasoning applies only when the individual provides verifiable, continuous proof of abstinence and full compliance
    with treatment requirements. It does not extend to situations where relapse is documented or where the prescribed treatment
    duration is incomplete.
