case:
  id: DR-OHA-26-0055@v1
  title: Restoration of Access Authorization under Guideline G
  status: draft
  setting: DOE Office of Hearings and Appeals, July 6 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires an access authorization. The Local
    Security Office raised a security concern under Guideline G because the Individual was cited for an open container on
    July 24, 2025 and was diagnosed with Alcohol Use Disorder, Moderate, by a DOE psychologist. The Individual was required
    to complete an intensive outpatient program, attend weekly support meetings, and maintain abstinence for at least twelve
    months. He testified that he last consumed alcohol on January 10, 2026 and provided five consecutive negative PEth tests
    through June 2026. He has attended weekly SMART Recovery meetings since January 12, 2026 and completed a 25‑session IOP
    by May 2026, continuing in after‑care. The DOE psychologist later revised the diagnosis to Alcohol Use Disorder, Mild,
    and opined that the Individual is in early remission with a good prognosis.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge asks the Local Security Office for information.
      move: ask
      irreversible: false
    O4:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: On July 24, 2025, the Individual was cited for an open container after being stopped for speeding.
  - id: F3
    kind: situation
    status: confirmed
    fact: A DOE psychologist diagnosed the Individual with Alcohol Use Disorder, Moderate, based on an October 2025 evaluation.
  - id: F4
    kind: situation
    status: confirmed
    fact: The psychologist required the Individual to complete an intensive outpatient program, attend weekly support meetings,
      and maintain abstinence for at least twelve months.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual testified he last consumed alcohol on January 10, 2026 and provided five negative PEth tests dated
      February 10, March 5, April 9, May 6, and June 8, 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual began attending weekly SMART Recovery meetings on January 12, 2026 and has attended consistently,
      with the facilitator testifying to active participation.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual completed a 25‑session intensive outpatient program by May 2026 and continues in after‑care, with
      a letter indicating good progress.
  - id: F8
    kind: situation
    status: confirmed
    fact: The DOE psychologist revised the diagnosis to Alcohol Use Disorder, Mild, and stated the Individual is in early
      remission with a good prognosis.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline G based on the open container citation and the
      AUD diagnosis.
  considerations:
  - id: C1
    facts:
    - F5
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Individual provided five consecutive negative PEth tests covering the period after his last reported drink, satisfying
      the evidentiary standard for abstinence.
  - id: C2
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: Completion of a 25‑session intensive outpatient program and continued participation in after‑care demonstrate concrete
      remedial action required by Guideline G.
  - id: C3
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The DOE psychologist revised the diagnosis to AUD Mild, placed the Individual in early remission, and gave a good
      prognosis, indicating reduced risk.
  - id: C4
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The security concern was raised under Guideline G; the Judge applied the mitigating conditions (b) and (c) of the
      Adjudicative Guidelines, which the Individual satisfied.
  - id: C5
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: Although regulations impose a presumption against granting a clearance, the Judge’s common‑sense balancing permits
      a reversal when mitigation is proven.
  reasoning:
    read: The LSO cited an open‑container citation and an AUD Moderate diagnosis as a Guideline G security concern. The Individual
      has since shown sustained abstinence, completed treatment, and received a revised, milder diagnosis with a good prognosis.
    weighing: The Judge weighed the mitigating evidence against the statutory presumption against clearance. Because the Individual
      satisfied the specific mitigating conditions (b) and (c) of Guideline G (C4) through documented abstinence (C1), treatment
      completion (C2), and a favorable professional assessment (C3), the balance tipped toward restoration. The regulatory
      presumption (C5) was acknowledged but did not outweigh the concrete mitigation.
    tradecraft: The decision is recorded in the Administrative Judge’s Decision, citing the relevant CFR provisions and Adjudicative
      Guidelines, and the restoration order is entered into the Individual’s security file.
    uncertainty: The primary uncertainty concerns future alcohol use; however, the current record shows no indication of relapse.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.7(a). No further agency action is required
      unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: The presumption against granting a clearance and the original Moderate AUD diagnosis could suggest denial.
      why_wrong: The source explicitly found that the mitigating conditions were met, rendering denial contrary to the adjudicative
        guidelines.
    rejected:
      O1: Denial was rejected because the Individual met Guideline G mitigation criteria.
      O2: Holding the decision pending was rejected; sufficient evidence was already on record.
      O3: Requesting additional information was rejected; the record already satisfied the required standards.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had not provided a series of negative PEth tests demonstrating sustained abstinence.
      then: O1
      why: Without documented abstinence, the mitigating condition (b) of Guideline G would not be satisfied, leading to denial.
    would_not_change:
    - id: noflip1
      if: The diagnosis remained AUD Moderate rather than Mild.
      why: Even with a Moderate diagnosis, the Individual still satisfied the mitigating conditions (b) and (c), so restoration
        would still be appropriate.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or relapse indication.
      favors:
      - O1
      why: A relapse would revive the security concern under Guideline G and could justify revocation.
  lesson: Under Guideline G, an individual who demonstrates sustained abstinence, completes required treatment, and receives
    a professional assessment of early remission can mitigate alcohol‑related security concerns and have a clearance restored.
  limits: This analysis applies only when the individual provides verifiable, continuous evidence of abstinence and treatment
    compliance. It does not extend to cases where relapse is documented or where the required treatment duration is not met.
