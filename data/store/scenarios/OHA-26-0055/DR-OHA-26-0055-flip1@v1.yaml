case:
  id: DR-OHA-26-0055-flip1@v1
  title: Restoration of Access Authorization under Guideline G [flip]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, 6 July 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: An employee of a DOE contractor occupies a position that requires a security access authorization. The contractor's
    Security Office cited a security concern under Guideline G because the employee was stopped for a speeding violation on
    24 July 2025 and received an open-container citation, and because a DOE mental-health specialist had diagnosed the employee
    with Alcohol Use Disorder, Moderate, in October 2025. The specialist required the employee to enroll in an intensive outpatient
    program, attend weekly support meetings, and remain abstinent for at least twelve months. The employee testified that
    his last drink was on 10 January 2026 and submitted three PEth measurements dated 10 February, 5 March, and 9 April 2026,
    each showing detectable alcohol metabolites above the abstinence cutoff. He has attended weekly SMART-Recovery meetings
    since 12 January 2026, completed a 25-session intensive outpatient program by May 2026, and continues in after-care. The
    specialist later revised the diagnosis to Alcohol Use Disorder, Mild, and stated the employee is in early remission with
    a favorable prognosis.
  question: What action should the Administrative Judge take regarding the employee's access authorization under Guideline
    G?
  options:
    O1:
      do: The Administrative Judge denies the employee's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge requests further information from the Security Office.
      move: ask
      irreversible: false
    O4:
      do: The Administrative Judge restores the employee's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that requires a security access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: On 24 July 2025 the employee was cited for possessing an open container after being stopped for speeding.
  - id: F3
    kind: situation
    status: confirmed
    fact: A DOE mental-health specialist diagnosed the employee with Alcohol Use Disorder, Moderate, based on an October 2025
      evaluation.
  - id: F4
    kind: situation
    status: confirmed
    fact: The specialist required the employee to complete an intensive outpatient program, attend weekly support meetings,
      and stay abstinent for at least twelve months.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual testified he last consumed alcohol on January 10, 2026 and submitted three PEth measurements dated
      February 10, March 5, and April 9, 2026, each indicating detectable alcohol metabolites above the abstinence cutoff.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee began attending weekly SMART-Recovery meetings on 12 January 2026 and has attended consistently, with
      the facilitator confirming active participation.
  - id: F7
    kind: situation
    status: confirmed
    fact: The employee completed a 25-session intensive outpatient program by May 2026 and remains in after-care, with a letter
      attesting to solid progress.
  - id: F8
    kind: situation
    status: confirmed
    fact: The DOE mental-health specialist revised the diagnosis to Alcohol Use Disorder, Mild, and concluded the employee
      is in early remission with a good prognosis.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Security Office raised a security concern under Guideline G based on the open-container citation and the AUD
      diagnosis.
  considerations:
  - id: C1
    facts:
    - F5
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The PEth results demonstrate detectable alcohol metabolites, indicating the employee has not maintained the required
      period of abstinence.
  - id: C2
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: Completion of a 25-session intensive outpatient program and ongoing after-care satisfy the remedial actions prescribed
      by Guideline G.
  - id: C3
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The specialist's revised diagnosis to AUD Mild and assessment of early remission suggest a reduced risk profile.
  - id: C4
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The security concern was properly raised under Guideline G, and the employee appears to meet mitigating conditions
      (b) and (c).
  - id: C5
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Regulations impose a presumption against granting a clearance when alcohol-related concerns exist, and the lack of
      documented abstinence reinforces that presumption.
  reasoning:
    read: The Security Office flagged an open-container citation and an Alcohol Use Disorder diagnosis as a Guideline G security
      concern. The employee's PEth tests, however, reveal ongoing alcohol consumption, undermining the abstinence requirement.
    weighing: The Judge weighed the positive PEth evidence against the statutory presumption against clearance. Although the
      employee completed treatment (C2) and received a milder diagnosis (C3), the failure to demonstrate sustained abstinence
      (C1) and the regulatory presumption (C5) together outweigh the mitigating factors, leading to denial.
    tradecraft: The decision is recorded in the Administrative Judge's formal decision memorandum, citing the relevant CFR
      provisions and Adjudicative Guidelines, and the denial is entered into the employee's security file.
    uncertainty: Future testing may reveal continued abstinence, which could later support restoration, but the current record
      does not satisfy the required mitigation.
    handoff: The Administrative Judge acts alone under 10 C.F.R. § 710.7(a). No further agency action is required unless an
      appeal is filed.
    tempting_wrong:
      option: O4
      pull: The employee's treatment completion and revised diagnosis suggest a path to restoration.
      why_wrong: Without verifiable abstinence, the core mitigating condition of Guideline G is unmet, so restoring access
        would contravene the adjudicative standards.
    rejected:
      O2: Holding the decision pending is rejected because the record already contains sufficient evidence to evaluate the
        abstinence requirement.
      O3: Requesting additional information is rejected; the PEth results and treatment documentation are already on file.
      O4: Restoration is rejected because the employee has not met the abstinence condition mandated by Guideline G.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had provided a series of negative PEth tests demonstrating sustained abstinence.
      then: O4
      why: With documented abstinence, the mitigating condition (b) of Guideline G would be satisfied, making restoration
        appropriate.
    would_not_change:
    - id: noflip1
      if: The diagnosis had remained AUD Moderate rather than Mild.
      why: Even with a Moderate diagnosis, the employee would still meet the mitigating conditions (b) and (c), so restoration
        would still be justified.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or indication of relapse.
      favors:
      - O1
      why: A relapse would reactivate the security concern under Guideline G and could warrant revocation.
  lesson: Under Guideline G, an individual must provide verifiable, continuous evidence of abstinence to mitigate alcohol-related
    security concerns; without such proof, the clearance must be denied.
  limits: This analysis applies only when the record lacks documented abstinence despite treatment completion. It does not
    extend to cases where the employee demonstrates continuous sobriety or where the required treatment duration is not met.
