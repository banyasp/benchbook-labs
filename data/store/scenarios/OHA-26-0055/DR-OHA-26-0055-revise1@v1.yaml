case:
  id: DR-OHA-26-0055-revise1@v1
  title: Restoration of Access Authorization under Guideline G [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, July 6 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires an access authorization. The Local
    Security Office raised a security concern under Guideline G because the Individual was cited for an open container on
    July 24, 2025 and was diagnosed with Alcohol Use Disorder, Moderate, by a DOE psychologist. The Individual was required
    to complete an intensive outpatient program, attend weekly support meetings, and maintain abstinence for at least twelve
    months. He testified that he last consumed alcohol on January 10, 2026 and provided five consecutive negative PEth tests
    through June 2026. He has attended weekly SMART Recovery meetings since January 12, 2026 and completed a 25‑session IOP
    by May 2026, continuing in after‑care. The DOE psychologist later revised the diagnosis to Alcohol Use Disorder, Mild,
    and opined that the Individual is in early remission with a good prognosis.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge asks the Local Security Office for information.
      move: ask
      irreversible: false
    O4:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: On July 24, 2025, the Individual was cited for an open container after being stopped for speeding.
  - id: F3
    kind: situation
    status: confirmed
    fact: A DOE psychologist diagnosed the Individual with Alcohol Use Disorder, Moderate, based on an October 2025 evaluation.
  - id: F4
    kind: situation
    status: confirmed
    fact: The psychologist required the Individual to complete an intensive outpatient program, attend weekly support meetings,
      and maintain abstinence for at least twelve months.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual testified he last consumed alcohol on January 10, 2026 and provided five negative PEth tests dated
      February 10, March 5, April 9, May 6, and June 8, 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual began attending weekly SMART Recovery meetings on January 12, 2026 and has attended consistently,
      with the facilitator testifying to active participation.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual completed a 25‑session intensive outpatient program by May 2026 and continues in after‑care, with
      a letter indicating good progress.
  - id: F8
    kind: situation
    status: confirmed
    fact: The DOE psychologist revised the diagnosis to Alcohol Use Disorder, Mild, and stated the Individual is in early
      remission with a good prognosis.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline G based on the open container citation and the
      AUD diagnosis.
  considerations:
  - id: C1
    facts:
    - F5
    equity: due_process
    favors:
    - O4
    weight: weak
    why: Negative PEth tests demonstrate abstinence, but without corroborating security assessment the evidence is considered
      less decisive.
  - id: C2
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O4
    weight: weak
    why: Treatment completion is noted, yet its weight is reduced because the LSO's security assessment has not been reviewed.
  - id: C3
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: weak
    why: The psychologist's mild diagnosis is informative but not sufficient on its own to drive a restoration without LSO
      input.
  - id: C4
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O4
    weight: weak
    why: Application of mitigating conditions is acknowledged, but the adjudicative process deems the analysis incomplete
      without the LSO's perspective.
  - id: C5
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulatory presumption against granting a clearance and the lack of a formal LSO security assessment make it necessary
      to request additional information before any final action.
  reasoning:
    read: The record shows an open-container citation, an AUD diagnosis, documented abstinence, treatment completion, and
      a revised mild diagnosis, but the LSO's security assessment has not been consulted.
    weighing: While the Individual has met many mitigating criteria, the strong presumption against clearance and the absence
      of LSO input lead the adjudicative authority to prioritize obtaining that information before deciding on restoration,
      denial, or hold.
    tradecraft: The decision is entered as a request for information, citing the relevant CFR provisions and Guideline G,
      and the request is logged in the Individual's security file.
    uncertainty: Uncertainty remains about the completeness of the LSO's security perspective and any undisclosed factors
      that could affect risk assessment.
    handoff: The Administrative Judge issues the request; the LSO will respond, after which the adjudicative authority will
      make a final determination.
    tempting_wrong:
      option: O4
      pull: The strong mitigating evidence could suggest immediate restoration of the clearance.
      why_wrong: Restoring without the LSO's security assessment would bypass required verification and could overlook undisclosed
        risks.
    rejected:
      O1: Denial is rejected because the Individual has demonstrated substantial mitigation; the missing piece is the LSO's
        security view.
      O2: Holding the decision is rejected; a direct request for LSO information is a more efficient step toward resolution.
      O4: Restoration is rejected pending the LSO's input, as the adjudicative process requires that security assessment before
        final clearance action.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had provided a series of negative PEth tests demonstrating sustained abstinence.
      then: O4
      why: Documented abstinence satisfies mitigating condition (b) of Guideline G, supporting restoration if no other concerns
        arise.
    would_not_change:
    - id: noflip1
      if: The diagnosis remained AUD Moderate rather than Mild.
      why: Even with a Moderate diagnosis, the Individual still satisfied the mitigating conditions (b) and (c), so restoration
        would still be appropriate.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or relapse indication.
      favors:
      - O1
      why: A relapse would revive the security concern under Guideline G and could justify revocation.
  lesson: When mitigating evidence exists but the Local Security Office's assessment has not been obtained, the appropriate
    step is to request that information before making a final clearance decision.
  limits: This approach applies when the record contains credible mitigation but lacks the LSO's security analysis; it does
    not apply if the LSO has already provided a comprehensive assessment or if relapse is documented.
