case:
  id: DR-CORPUS-NX-8f36d289-E1@v1
  title: Defining the Commission’s Investigative Scope
  status: draft
  setting: Dallas, Texas; after November 22, 1963; the Commission
  decider: The Commission
  agent: The Commission
  agent_role: decide
  situation: The Commission faced allegations that the CIA participated in the assassination of the President in Dallas on
    November 22, 1963. One theory alleged that two private individuals acted on behalf of the CIA and personally participated.
    Another alleged that the CIA had connections with the person alleged to have carried out the assassination, another person
    associated with it, or both, and that those connections somehow led to the assassination. The Commission was established
    by Executive Order, and the scope of its investigation was at issue. A full review of the prior commission report was
    one possible scope choice. The Commission had to weigh the scope of its inquiry against the time available for its proper
    function.
  question: What should the Commission do about the scope of its investigation into allegations of CIA involvement in the
    assassination?
  options:
    O1:
      do: The Commission expands its inquiry to include a full review of the prior commission report.
      move: act
      irreversible: false
    O2:
      do: The Commission limits its inquiry to determining whether credible evidence points to CIA involvement in the assassination.
      move: act
      irreversible: false
    O3:
      do: The Commission partially reviews portions of the prior commission report relevant to the allegations.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Allegations had been made that the CIA participated in the assassination of the President in Dallas, Texas, on November
      22, 1963.
  - id: F2
    kind: intelligence
    status: assessed
    fact: One theory alleged that two private individuals personally participated in the assassination on behalf of the CIA.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Another theory alleged that the CIA had connections with the person alleged to have carried out the assassination,
      another person associated with it, or both, and that those connections somehow led to the assassination.
  - id: F4
    kind: authority
    status: confirmed
    fact: An Executive Order established the Commission.
  - id: F5
    kind: authority
    status: assessed
    fact: The Commission regarded a full review of the prior commission report as outside the scope of its Executive Order.
  - id: F6
    kind: situation
    status: assessed
    fact: The Commission regarded a full review as likely to divert time from its proper function.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Commission regarded a full review of the prior report as outside the scope of the Executive Order establishing
      it, supporting an inquiry confined to its authorized remit.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Commission considered that a full review would divert time from its proper function, weighing against expanding
      the investigation.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The allegations presented two theories of CIA involvement; the Commission's stated investigative purpose was to determine
      whether credible evidence pointed to such involvement, rather than to undertake a full review of the earlier report.
  reasoning:
    read: The Commission faced allegations framed through two theories of CIA involvement, but its decision was about the
      scope of its own inquiry, not a full reconsideration of the prior commission's work. The trap is treating the seriousness
      of the allegations as a reason, by itself, to exceed the Commission's mandate.
    weighing: The Commission treated a full report review as outside the Executive Order's scope and as likely to divert time
      from its proper function {C1} {C2}. It therefore limited the inquiry to whether credible evidence pointed to CIA involvement
      {C3}. The balance rests on the stated scope of the Order and the Commission's assessment of the time a full review would
      consume.
    tradecraft: State the inquiry's boundary as the credible-evidence question, and record that a full review was excluded
      because it was regarded as beyond the Order's scope and diverting time from the Commission's proper function.
    uncertainty: The source gives the Commission's scope assessment and rationale, but does not set out the Executive Order's
      text or assess the particular allegations and evidence.
    handoff: The Commission should make and record this scope decision within its assigned authority. The source provides
      no reason to refer the scope choice elsewhere.
    tempting_wrong:
      option: O1
      pull: A full review might appear to provide the broadest response to serious allegations.
      why_wrong: The Commission regarded a full review as outside the Order's scope and as diverting time from its proper
        function.
    rejected:
      O1: The Commission rejected a full review because it regarded that course as outside the Executive Order's scope and
        as diverting time from its proper function.
      O3: The Commission chose the narrower credible-evidence inquiry, and the source gives no reason for undertaking even
        a partial review of the prior report.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Executive Order expressly required a full review of the prior commission report.
      then: O1
      why: That would remove the stated scope objection to a full review and make expansion necessary to comply with the governing
        authority.
    would_not_change:
    - id: noflip1
      if: The same allegations remained, without a change to the Commission's authority or the time available for its proper
        function.
      why: The allegations alone would not alter the Commission's stated reasons for limiting the inquiry to the credible-evidence
        question.
    watch_for: []
  lesson: Keep an inquiry within its assigned authority and focused on the purpose for which the body was established. A broader
    review is not justified merely because allegations are serious when that review exceeds the mandate and diverts time from
    the body's proper function.
  limits: This reasoning addresses the Commission's choice of investigative scope, not whether the allegations were true or
    what the later assessment of evidence showed. It does not establish that a full or partial review would be improper when
    the governing mandate or circumstances differ.
