case:
  id: DR-CORPUS-NX-c89bd1ec-E1@v1
  title: Arnhem Planning Decision
  status: draft
  setting: Arnhem area, 1944, British planners considering Operation Market Garden.
  decider: The British planners
  agent: The British planners
  agent_role: decide
  situation: In 1944, British planners were considering Operation Market Garden. Their preferred approach was a British-spearheaded
    airborne assault. Intelligence indicated that two panzer divisions were re-equipping in the Arnhem area. The planners
    faced a decision about whether to use that intelligence to reassess the operation or proceed with their preferred assault.
  question: 'What should the British planners do about Operation Market Garden: approve and proceed with the preferred assault,
    disapprove it and reassess the operation, or hold the operation pending reassessment?'
  options:
    O1:
      do: The British planners disapprove the preferred British-spearheaded airborne assault and reassess Operation Market
        Garden.
      move: act
      irreversible: false
    O2:
      do: The British planners hold Operation Market Garden pending reassessment of the intelligence and operational prospects.
      move: hold
      irreversible: false
    O3:
      do: The British planners approve the preferred British-spearheaded airborne assault and proceed with Operation Market
        Garden.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Operation Market Garden was being planned in 1944.
  - id: F2
    kind: situation
    status: confirmed
    fact: British planners were responsible for the planning decision.
  - id: F3
    kind: situation
    status: confirmed
    fact: The planners' preferred approach was an airborne assault spearheaded by the British.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Intelligence indicated that two panzer divisions were re-equipping in the Arnhem area.
  - id: F5
    kind: situation
    status: confirmed
    fact: The intelligence was available to the planners before the operation.
  - id: F6
    kind: situation
    status: assessed
    fact: The chance of operational success was a relevant consideration in the planning decision.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Intelligence indicating two panzer divisions were re-equipping in the Arnhem area was available before the operation,
      but the planners systematically ignored it; reassessment would address that failure to account for relevant evidence.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The desire for the preferred British-spearheaded assault overwhelmed rational analysis of the chance of operational
      success. Preference for that approach was not a sound substitute for assessing its prospects.
  - id: C3
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The operation resulted in a military disaster and the defeat of the 1st Airborne Division, demonstrating the grave
      mission cost associated with proceeding without adequate rational analysis.
  reasoning:
    read: The planners had intelligence relevant to the prospects of their preferred assault, but their desire to use that
      approach displaced rational analysis. The trap was allowing commitment to a preferred plan to override evidence bearing
      on whether the operation could succeed.
    weighing: The available intelligence and the need to assess the chance of success both favor disapproving the preferred
      assault and reassessing {O1}. The disastrous outcome reinforces the importance of that assessment, though it does not
      by itself establish every detail of what a reassessment would have found. The balance depends on taking relevant intelligence
      seriously rather than letting preference decide the question.
    tradecraft: Separate the preferred course from the evidence about its prospects. Record the intelligence considered, the
      assessment of operational success, and the reasons for the decision; revisit the decision if material evidence or assumptions
      change.
    uncertainty: The passage gives no details about the intelligence's reliability, the planners' full analysis, or what a
      reassessment would have concluded. It does establish that the intelligence was available and that rational analysis
      of success was overwhelmed by the desire for the preferred approach.
    handoff: The planners held the decision responsibility. As a prudent decision practice, they should involve relevant intelligence
      and operational assessors in reassessment so the preference for the plan does not substitute for evaluating the evidence.
    tempting_wrong:
      option: O3
      pull: The planners preferred the British-spearheaded airborne assault.
      why_wrong: The passage identifies that preference as the very pressure that overwhelmed rational analysis of the chance
        of success, while relevant intelligence was ignored.
    rejected:
      O2: Holding pending reassessment avoids immediate approval, but the passage's endorsed corrective course is to disapprove
        the preferred assault and reassess the operation.
      O3: Proceeding with the preferred assault repeats the decision pattern the passage identifies as overriding rational
        analysis and leading to disaster.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A careful reassessment found the intelligence unreliable and concluded that the preferred assault had a sound prospect
        of success.
      then: O3
      why: If the evidence no longer supported concern and rational analysis supported proceeding, the basis for disapproving
        the preferred assault could change.
    would_not_change:
    - id: noflip1
      if: The planners remained strongly committed to the preferred assault, without addressing the available intelligence
        or assessing the chance of success.
      why: Preference alone is the pressure the passage identifies as having overwhelmed rational analysis; it does not answer
        the evidentiary concern.
    watch_for:
    - id: watch1
      what: Whether the intelligence indicating two panzer divisions were re-equipping in the Arnhem area is assessed rather
        than ignored.
      favors:
      - O1
      why: The passage identifies the failure to heed that intelligence as part of the planners' decision failure.
  lesson: Do not let commitment to a preferred course displace rational analysis of evidence bearing on success. When relevant
    intelligence is available, reassess before proceeding on the strength of preference alone.
  limits: This reasoning addresses the planning choice described here, not the operational conduct of the assault. The passage
    does not establish how reliable the intelligence was or what a proper reassessment would have concluded.
  library:
    domain: operational-command
    family: CORPUS-NX-c89bd1ec
    source: https://assets.publishing.service.gov.uk/media/6ac50abbd9c21d62c02267eb/AJP_5_EdB_UKNE_WEB.pdf
    episode_focus: The decision point is whether planners should heed the intelligence and reassess the operation or proceed
      with the preferred assault. The passage says they proceeded because the desire for that approach overwhelmed rational
      analysis of the chance of success; exclude operational details of how the assault was conducted.
    cues:
      option_words:
        O1: 14
        O2: 15
        O3: 15
      real_option: O1
      real_to_mean_other_length: 0.93
      real_is_longest: false
      moves:
        O1: act
        O2: hold
        O3: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
        O3: false
    equities: pilot2
verdict_tier: source-endorsed
basis: 'The passage''s assessment endorses disapproving and reassessing the operation: the planners ignored intelligence,
  and their desire for the preferred assault overwhelmed rational analysis of the chance of success.'
