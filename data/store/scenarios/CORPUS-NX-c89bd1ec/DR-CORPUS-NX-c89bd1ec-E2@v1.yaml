case:
  id: DR-CORPUS-NX-c89bd1ec-E2@v1
  title: Alternate Base Activation Decision
  status: draft
  setting: Joint Task Force decision point concerning the primary and alternate theatre logistic bases; the specific place
    and time are not stated.
  decider: The COM JTF
  agent: The COM JTF
  agent_role: decide
  situation: The primary theatre logistic base is degraded amid a high threat of ground attack, and the degradation has lasted
    for over two weeks. An alternate theatre logistic base is available and capable. The alternate base is ready for use.
    The host nation's security force is ready to provide external security at the alternate base. The COM JTF has decision
    authority concerning activation of the alternate base.
  question: What should the COM JTF do about activating the alternate theatre logistic base for JTF operations?
  options:
    O1:
      do: The COM JTF prohibits activation of the alternate theatre logistic base for JTF operations.
      move: act
      irreversible: false
    O2:
      do: The COM JTF authorizes activation of the alternate theatre logistic base for JTF operations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The primary TLB faces a high threat of ground attack.
  - id: F2
    kind: situation
    status: confirmed
    fact: The primary TLB has been degraded for over two weeks.
  - id: F3
    kind: capability
    status: confirmed
    fact: The alternate TLB is capable.
  - id: F4
    kind: capability
    status: confirmed
    fact: The alternate TLB is ready for use.
  - id: F5
    kind: capability
    status: confirmed
    fact: The host nation's security force is ready to provide external security at the alternate TLB.
  - id: F6
    kind: authority
    status: confirmed
    fact: The COM JTF has decision authority concerning activation of the alternate TLB.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The doctrine's example treats a high threat of ground attack degrading the primary base for over two weeks as the
      decision trigger for recommending activation of the alternate base.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The alternate base's capability and readiness satisfy conditions the doctrine identifies before recommending activation.
  - id: C3
    facts:
    - F5
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The doctrine identifies host-nation external security at the alternate base as a relevant condition, and that condition
      is met.
  - id: C4
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The doctrine identifies the COM JTF's authority to move forces and equipment to the alternate base as a relevant
      condition; the COM JTF has the stated decision authority.
  reasoning:
    read: 'This is a decision about whether to activate an available alternate base while the primary base has faced a high
      threat and remained degraded for over two weeks. The trap is treating the threat alone as sufficient: the doctrine''s
      recommendation also rests on alternate-base capability and readiness, host-nation external security, and the COM JTF''s
      authority.'
    weighing: The sustained degradation and high threat favor activation, and the confirmed capability, readiness, external
      security, and decision authority meet the other conditions in the doctrine's example. Taken together, these factors
      support O2 as a recommendation, not as an unconditional rule that resolves every possible circumstance. The balance
      depends on those conditions remaining valid.
    tradecraft: Before acting, confirm that the stated readiness, security, and authority conditions remain current; record
      the decision, its factual basis, and any material changes in those conditions. Keep the decision record at the level
      of whether to activate, without turning it into a movement or logistics procedure.
    uncertainty: The high threat is assessed, while the degradation duration and alternate-base conditions are confirmed.
      The specific place and time are not stated, so the record cannot establish whether circumstances have changed since
      those facts were assessed or confirmed.
    handoff: The COM JTF should make the decision because the stated authority rests with that office. The source does not
      require another approval; checking that the relevant conditions remain current is a decision-support step, not a transfer
      of authority.
    tempting_wrong:
      option: O1
      pull: Prohibiting activation may seem cautious in the face of a high threat and uncertainty about changing circumstances.
      why_wrong: On the fixed facts, the doctrine's stated conditions for recommending activation are met, and no source-stated
        reason supports prohibiting it.
    rejected:
      O1: The doctrine recommends activation when the primary base is degraded by the stated threat and the alternate base,
        its external security, and the COM JTF's authority meet the specified conditions.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The alternate base were no longer capable or ready, or host-nation external security were no longer available.
      then: O1
      why: The doctrine makes these conditions part of the basis for recommending activation; if they fail, this recommendation
        no longer supports O2.
    would_not_change:
    - id: noflip1
      if: The facts remain as stated, with no further increase in the threat or duration of degradation.
      why: The existing high threat and degradation lasting over two weeks already meet the example's stated trigger, and
        the remaining listed conditions are met.
    watch_for:
    - id: watch1
      what: Changes in the threat indicators or in the confirmed facts needed for the COM JTF's decision, especially alternate-base
        capability or readiness, external security, and decision authority.
      favors:
      - O1
      why: The doctrine calls for relevant indications and warnings and confirmed decision facts; a material change could
        undermine the conditions supporting activation.
  lesson: A doctrine-based activation recommendation should be tied to both the stated trigger and the conditions that make
    the alternative usable and authorized. Recheck those conditions when circumstances change rather than treating the initial
    recommendation as automatic.
  limits: This conclusion applies to the facts and conditions in the doctrine's Example 2; it does not establish a general
    rule for other threats, base arrangements, or authority structures. The source does not specify how to conduct the activation
    or movement.
