case:
  id: DR-CORPUS-NX-d8f57d6c-E3@v1
  title: Long-Term Disposition of a Suspect
  status: draft
  setting: U.S. national-security review; the Deputies' discussion and subsequent Presidential or operating-agency consideration.
  decider: The President or the Principal of the appropriate operating agency
  agent: The President or the Principal of the appropriate operating agency
  agent_role: decide
  situation: The long-term disposition of a suspect already in U.S. custody, or whom an agency has been authorized to take
    into custody, is under consideration. The Deputies are considering third-country custody and prosecution as disposition
    options. Whether third-country custody is feasible and consistent with U.S. national security interests is relevant to
    the available course. The President or the Principal of the appropriate operating agency may be presented with the nomination
    and agency views for a decision.
  question: What should the President or the Principal of the appropriate operating agency do about the suspect's long-term
    disposition?
  options:
    O1:
      do: The President or operating-agency Principal directs exploration of third-country custody and approves prosecution
        in a civilian court or available military commission if transfer is infeasible or inconsistent with U.S. national
        security.
      move: act
      irreversible: false
    O2:
      do: The President or operating-agency Principal directs exploration of third-country custody and rejects prosecution
        in a civilian court or available military commission if transfer is infeasible or inconsistent with U.S. national
        security.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The guidance applies to a suspect already in U.S. custody or whom a department or agency has been authorized to
      capture or take into custody.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Deputies' discussion of long-term disposition is guided by the stated principles.
  - id: F3
    kind: situation
    status: confirmed
    fact: Third-country custody options consistent with U.S. national security are to be explored whenever possible.
  - id: F4
    kind: situation
    status: confirmed
    fact: If third-country transfer is not feasible or consistent with U.S. national security interests, prosecution in a
      civilian court or, where available, a military commission is the preferred long-term disposition.
  - id: F5
    kind: situation
    status: confirmed
    fact: Where possible and consistent with the primary objective of collecting intelligence, intelligence is to be collected
      in a manner allowing its use as evidence in a criminal prosecution.
  - id: F6
    kind: authority
    status: confirmed
    fact: Additional detainees are not to be brought to the Guantanamo Bay Naval Base.
  - id: F7
    kind: authority
    status: confirmed
    fact: After the Deputies' consideration and discussion, departments and agencies submit their Principals' final positions
      within a time frame consistent with operational needs.
  - id: F8
    kind: authority
    status: confirmed
    fact: If the nominating agency continues to support action, the nomination may be presented to the President for a decision
      or provided to the Principal of the appropriate operating agency for a decision, along with any Presidential views.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The Deputies are directed to explore third-country custody whenever possible, but only where it is consistent with
      U.S. national security.
  - id: C2
    facts:
    - F2
    - F4
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: When third-country transfer is infeasible or inconsistent with national-security interests, the guidance identifies
      civilian prosecution or, where available, a military commission as the preferred long-term disposition.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Where possible, intelligence should be collected in a manner that permits its use as prosecution evidence, but only
      consistently with the primary objective of collecting intelligence.
  reasoning:
    read: This is a conditional long-term disposition decision, not a direction to choose prosecution in every case. The key
      trap is treating third-country custody as either automatically available or automatically inconsistent with national
      security; the guidance makes feasibility and security consistency the gate, then states a preferred prosecution path
      if transfer is not feasible or consistent.
    weighing: The guidance supports exploring third-country custody when feasible and consistent with national security {C1}.
      If that route is not feasible or consistent, it favors prosecution in civilian court or, where available, a military
      commission {C2}. The evidentiary value of intelligence collection supports that path only where possible and consistent
      with the primary intelligence objective {C3}. O1 tracks these conditions; the specific assessment of transfer feasibility
      and security consistency determines which disposition path applies.
    tradecraft: Assess and record whether third-country custody is feasible and consistent with U.S. national security, and
      whether a civilian court or available military commission is an applicable disposition. Preserve the stated priority
      of intelligence collection while considering, where possible, whether collected intelligence can be used as prosecution
      evidence. Do not bring additional detainees to Guantanamo. Submit final agency positions within a time frame consistent
      with operational needs.
    uncertainty: The guidance does not establish whether third-country transfer is feasible or consistent with national security
      in this case, or provide case-specific information about prosecution availability. Those assessments remain necessary
      before selecting the applicable disposition path.
    handoff: The Deputies discuss the disposition principles, after which departments and agencies submit their Principals'
      final positions within operationally consistent time limits. If the nominating agency continues to support action, the
      nomination and agency views may go to the President or to the Principal of the appropriate operating agency for a decision,
      with any Presidential views included as appropriate.
    tempting_wrong:
      option: O2
      pull: Rejecting prosecution may seem to preserve flexibility while third-country custody is explored.
      why_wrong: 'The guidance does not endorse rejecting prosecution as the fallback: if third-country transfer is infeasible
        or inconsistent with national security, it identifies prosecution as the preferred long-term disposition.'
    rejected:
      O2: It was not chosen because it rejects the prosecution path the guidance prefers when third-country transfer is infeasible
        or inconsistent with U.S. national security.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A case-specific legal and operational review establishes that neither civilian prosecution nor an available military
        commission can be pursued.
      then: O2
      why: The prosecution fallback would no longer be implementable, so the recommendation to approve that disposition would
        need to be reconsidered.
    would_not_change:
    - id: noflip1
      if: Operational pressure or a proposed alternative makes bringing additional detainees to Guantanamo seem useful.
      why: The guidance bars bringing additional detainees to that facility in all events.
    watch_for:
    - id: watch1
      what: Whether a third-country custody option is feasible and consistent with U.S. national security.
      favors:
      - O1
      why: Those conditions determine whether the third-country route is to be explored and whether the prosecution preference
        applies.
    - id: watch2
      what: Whether intelligence can be collected in a way usable as prosecution evidence without compromising the primary
        intelligence-collection objective.
      favors:
      - O1
      why: The guidance makes evidence usability conditional on both possibility and consistency with the primary intelligence
        objective.
  lesson: Explore third-country custody only when it is feasible and consistent with national security. If it is not, follow
    the stated preference for civilian prosecution or an available military commission, while preserving intelligence collection
    as the primary objective and pursuing evidentiary usability where possible.
  limits: This reasoning applies to the long-term disposition of a suspect already in U.S. custody or authorized to be taken
    into custody. It does not establish the case-specific feasibility or security implications of transfer, or resolve whether
    a prosecution forum is available.
  library:
    domain: natsec-other
    family: CORPUS-NX-d8f57d6c
    source: https://www.justice.gov/oip/foia-library/procedures_for_approving_direct_action_against_terrorist_targets/dl
    episode_focus: The guidance directs consideration of third-country custody when feasible and consistent with U.S. national
      security; if that is not feasible or consistent, it prefers prosecution in civilian court or a military commission and
      bars bringing additional detainees to Guantanamo. Keep the focus on disposition options and the stated security and
      prosecution considerations, not capture or detention techniques.
