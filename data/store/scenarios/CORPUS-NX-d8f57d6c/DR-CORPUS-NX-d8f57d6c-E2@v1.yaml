case:
  id: DR-CORPUS-NX-d8f57d6c-E2@v1
  title: Review of a Lethal-Action Nomination
  status: draft
  setting: At the interagency Deputies Committee review of a nomination under the PPG.
  decider: The Deputies Committee
  agent: The Deputies Committee
  agent_role: decide
  situation: An identified individual has been nominated for lethal action under an operational plan. The nomination package
    is to include an individual profile, an NCTC assessment, a legal assessment, and the nominating agency’s determinations
    concerning capture feasibility and the relevant government’s ability to address the threat. The Deputies must assess whether
    the individual qualifies under the policy standard, taking account of credible information that may cast doubt on that
    conclusion. They must also consider whether a response short of lethal action can minimize the threat and assess specified
    regional, international, and intelligence implications. The recommendation is part of a process in which approval authority
    rests with the Principal of the nominating agency subject to specified conditions.
  question: What should the Deputies Committee do with the nomination for lethal action?
  options:
    O1:
      do: The Deputies defer their recommendation and request further assessments from the relevant agencies.
      move: ask
      irreversible: false
      to: the relevant agencies
    O2:
      do: The Deputies recommend rejection of the nomination for lethal action.
      move: act
      irreversible: false
    O3:
      do: The Deputies recommend approval of the nomination for lethal action.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: An identified individual whose activities pose a continuing, imminent threat to U.S. persons is eligible for lethal
      action as a policy matter, consistent with the approved operational plan.
  - id: F2
    kind: authority
    status: confirmed
    fact: Lethal action requires that the individual may lawfully be targeted under existing authorities and that applicable
      operational-plan conditions are met.
  - id: F3
    kind: authority
    status: confirmed
    fact: The lethal-force preconditions include near certainty that the identified HVT is present and that non-combatants
      will not be injured or killed.
  - id: F4
    kind: authority
    status: confirmed
    fact: The lethal-force preconditions include an assessment that capture is not feasible at the time of the operation,
      that relevant governmental authorities cannot or will not effectively address the threat, and that no other reasonable
      alternatives can effectively address it.
  - id: F5
    kind: authority
    status: confirmed
    fact: The nomination profile must summarize relevant disseminated intelligence needed to determine whether the policy
      standard is met and must include inconclusive and contradictory intelligence reports where relevant.
  - id: F6
    kind: authority
    status: confirmed
    fact: Before Deputies review, the nomination package includes the nominating agency’s profile, the NCTC assessment, a
      summary of the legal assessment, and the agency’s determinations and underlying analysis concerning capture feasibility
      and the relevant government’s ability to address the threat.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Deputies must evaluate whether they can conclude with confidence that the individual meets the policy standard,
      considering credible information that may cast doubt, and whether a response short of lethal action can minimize the
      threat.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Deputies must also consider broader regional and international political interests, possible effects on intelligence
      collection or sources and methods, and the potential intelligence value of capture.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Principal of the nominating agency may not delegate approval authority and may approve only if the relevant
      Principals unanimously agree and the President has been apprised of the intention to approve.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The policy allows lethal action only for an identified HVT posing a continuing, imminent threat to U.S. persons,
      and only when the legal and operational-plan preconditions are met, including near certainty of the HVT's presence and
      no non-combatant injury or death.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    - O2
    weight: strong
    why: The Deputies must account for inconclusive or contradictory intelligence and other credible information casting doubt
      on eligibility; they should recommend approval only if they can still conclude with confidence that the standard is
      met.
  - id: C3
    facts:
    - F4
    - F7
    equity: escalation_control
    favors:
    - O1
    - O2
    weight: strong
    why: The policy requires consideration of whether a response short of lethal action can minimize the threat, and separately
      requires that no other reasonable alternative can effectively address it.
  - id: C4
    facts:
    - F8
    equity: source_protection
    favors:
    - O1
    weight: weak
    why: The Deputies must account for regional and international political interests, effects on intelligence collection
      or sources and methods, and the intelligence value capture might yield; those considerations may affect the recommendation
      but do not replace the eligibility threshold.
  - id: C5
    facts:
    - F9
    equity: chain_of_command
    favors:
    - O3
    weight: strong
    why: 'An O3 recommendation is not final approval: the nominating agency''s Principal retains nondelegable approval authority,
      subject to unanimous agreement of the relevant Principals and notice to the President.'
  reasoning:
    read: 'This is an interagency recommendation on a lethal-action nomination, not the final authorization to act. The trap
      is treating a complete nomination package as proof that the policy standard is satisfied: the Deputies must independently
      assess eligibility, take contrary information seriously, and consider whether a lesser response can minimize the threat.'
    weighing: Recommend O3 on the basis that the nomination is properly before the Deputies and the policy makes lethal action
      eligible when its threat, legal, certainty, capture, governmental-capacity, and alternatives conditions are met {C1}.
      That recommendation depends on the Deputies being able to conclude with confidence that the standard is met after considering
      credible contrary information {C2}, and on no response short of lethal action being sufficient {C3}. The required political
      and intelligence assessments remain relevant, but are considerations in the review rather than substitutes for those
      thresholds {C4}.
    tradecraft: Base the recommendation on the full profile, NCTC assessment, legal assessment, and underlying capture and
      governmental-capacity determinations; ensure relevant inconclusive and contradictory intelligence is considered. Record
      the confidence judgment, the assessment of less-than-lethal responses, and the material political and intelligence considerations.
      Keep the recommendation distinct from operational execution and final approval.
    uncertainty: The supplied facts describe what the package must contain and what the Deputies must assess; they do not
      state the package's substantive findings or whether the Deputies actually reached confidence on eligibility. O3 therefore
      rests on the stipulated outcome and is conditional on those required assessments supporting it.
    handoff: The Deputies make a recommendation, not the final approval decision. The nominating agency's Principal retains
      approval authority and may approve only if the relevant Principals unanimously agree and the President has been apprised
      {C5}.
    tempting_wrong:
      option: O1
      pull: Deferral can seem prudent because the Deputies must scrutinize contrary intelligence, alternatives, and wider
        implications.
      why_wrong: Those are required subjects of the review, not by themselves grounds to postpone it; on the stipulated outcome,
        the recommendation is O3 if the Deputies' review supports confidence that the policy conditions are met.
    rejected:
      O1: The framework calls for the Deputies to assess the submitted materials and make a recommendation; deferral is not
        selected absent an identified unresolved gap that prevents the required confidence judgment.
      O2: Rejection is not selected because the stipulated outcome is a recommendation for approval, subject to the policy
        thresholds and the Principal's separate approval conditions.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Capture becomes feasible before or after approval.
      then: O1
      why: The policy says to pursue a capture option if capture becomes feasible; among the fixed choices, deferring the
        lethal-action recommendation is the closest course while that option is pursued.
    - id: flip2
      if: Credible information prevents the Deputies from concluding with confidence that the individual meets the policy
        standard.
      then: O1
      why: The Deputies are required to consider such information, so an unresolved doubt that defeats the confidence judgment
        would make further assessment preferable to recommending approval.
    - id: flip3
      if: The legal assessment establishes that the individual may not lawfully be targeted, or an applicable lethal-force
        precondition is not met.
      then: O2
      why: Lethal action requires lawful targetability and satisfaction of applicable preconditions; a failure of those requirements
        defeats the basis for recommending it.
    would_not_change:
    - id: noflip1
      if: Capture is assessed as infeasible, but capture might have yielded valuable intelligence.
      why: The Deputies must consider the potential intelligence value of capture notwithstanding an assessment that capture
        is not currently feasible; that consideration alone does not displace the policy standard.
    watch_for:
    - id: watch1
      what: Credible contradictory or inconclusive intelligence, including information that casts doubt on whether the individual
        meets the policy standard.
      favors:
      - O1
      - O2
      why: The profile must include relevant inconclusive and contradictory intelligence, and the Deputies must take credible
        contrary information into account when deciding whether they can conclude with confidence.
  lesson: 'A lethal-action recommendation requires more than a complete nomination package: the decision-makers must be confident
    that the policy and legal conditions are met, account for credible contrary information, and consider whether a less forceful
    response can address the threat. A recommendation does not transfer or replace the final approval authority assigned to
    the nominating agency''s Principal.'
  limits: This reasoning concerns the Deputies' recommendation under this PPG process, not the final authorization or execution
    of an operation. The supplied facts do not establish the substantive findings in the nomination package, so the recommendation
    cannot be treated as an independent finding that every condition was met.
