case:
  id: DR-CORPUS-NX-d8f57d6c-E1@v1
  title: Capture Preference in Counterterrorism Policy
  status: draft
  setting: United States counterterrorism policy; time and specific institution not stated.
  decider: The United States
  agent: The United States
  agent_role: decide
  situation: A United States policy authority is setting guidance for counterterrorism proposals involving capture and lethal
    action. Capture operations are considered to offer substantial intelligence value and potential to mitigate and disrupt
    terrorist threats. The policy must address when lethal action may be proposed to prevent attacks against U.S. persons.
    Capture may remain an available preference even when prosecution or third-country custody is unavailable. The authority
    must also define how capture feasibility and other reasonable alternatives bear on proposals for lethal action.
  question: What should the United States do when setting counterterrorism guidance on capture and proposed lethal action?
  options:
    O1:
      do: The United States policy authority shall prioritize capture, assess its feasibility for each lethal-action proposal,
        and permit lethal action only when capture is infeasible and no reasonable alternative addresses the threat.
      move: act
      irreversible: false
    O2:
      do: The United States policy authority shall prioritize capture, assess its feasibility for each lethal-action proposal,
        and permit lethal action when capture is infeasible, even if reasonable alternatives remain.
      move: partial
      irreversible: false
    O3:
      do: The United States policy authority shall deprioritize capture, omit capture-feasibility assessments for lethal-action
        proposals, and permit lethal action without requiring capture infeasibility or absence of reasonable alternatives.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Capture operations offer the best opportunity for meaningful intelligence gain from counterterrorism operations.
  - id: F2
    kind: capability
    status: assessed
    fact: Capture operations can mitigate and disrupt terrorist threats.
  - id: F3
    kind: authority
    status: confirmed
    fact: United States policy prioritizes capture of terrorist suspects over lethal action.
  - id: F4
    kind: authority
    status: confirmed
    fact: A feasibility assessment of capture options is required as a component of any proposal for lethal action.
  - id: F5
    kind: authority
    status: confirmed
    fact: Lethal action to prevent terrorist attacks against U.S. persons is limited to circumstances where capture is not
      feasible and no other reasonable alternative can effectively address the threat.
  - id: F6
    kind: authority
    status: confirmed
    fact: Lethal action is not to be proposed or pursued as punishment or as a substitute for prosecution in civilian court
      or a military commission.
  - id: F7
    kind: situation
    status: confirmed
    fact: Capture is preferred even when neither prosecution nor third-country custody is available as a disposition option
      at the time.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Capture offers the best opportunity for meaningful intelligence gain and can mitigate and disrupt terrorist threats,
      supporting its priority over lethal action.
  - id: C2
    facts:
    - F3
    - F4
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: Policy prioritizes capture and requires a capture-feasibility assessment for every proposal for lethal action.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: Lethal action to prevent attacks against U.S. persons is allowed under this policy only when capture is infeasible
      and no other reasonable alternative can effectively address the threat.
    rules_out:
    - O2
    - O3
  - id: C4
    facts:
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Lethal action is not a punitive measure or a substitute for prosecution, while capture remains preferred even when
      prosecution and third-country custody are unavailable.
  reasoning:
    read: This is a policy choice about the priority and threshold for lethal-action proposals, not a choice of operational
      methods. The trap is to treat the absence of a prosecution or third-country custody option as a reason to abandon capture,
      or to treat capture infeasibility alone as sufficient to permit lethal action; the policy does neither.
    weighing: 'Capture''s intelligence value and potential to mitigate and disrupt threats support making it the preferred
      option {C1}. The policy also requires a feasibility assessment for any lethal-action proposal {C2}. The decisive limit
      is conjunctive: capture must be infeasible and no other reasonable alternative may effectively address the threat {C3}.
      The prohibition on punitive action or using lethal action as a substitute for prosecution, and the continued preference
      for capture despite unavailable disposition options, reinforce that approach {C4}.'
    tradecraft: For each proposal for lethal action, include the required capture-feasibility assessment and assess whether
      any other reasonable alternative can effectively address the threat. Keep the stated purpose within preventing terrorist
      attacks against U.S. persons, not punishment or replacing prosecution.
    uncertainty: The policy states the governing preference and conditions but does not define how feasibility or the reasonableness
      and effectiveness of alternatives are to be assessed in a particular case.
    handoff: The United States policy authority sets this guidance. No separate office or review body is identified; applying
      the guidance to a specific proposal requires the responsible policy authority to assess the stated conditions.
    tempting_wrong:
      option: O2
      pull: It preserves capture as the priority and requires a feasibility assessment, while appearing to allow a response
        once capture is infeasible.
      why_wrong: It permits lethal action even when a reasonable alternative remains effective, contrary to the policy's stated
        condition.
    rejected:
      O2: It does not require the absence of other effective reasonable alternatives before permitting lethal action.
      O3: It rejects the capture preference and required assessment and removes the conditions the policy places on lethal
        action.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The policy authority concluded that capture no longer offered the stated intelligence and threat-mitigation advantages
        and expressly chose to deprioritize capture.
      then: O3
      why: That changed policy judgment would remove the stated reasons for capture preference and support deprioritizing
        capture.
    would_not_change:
    - id: noflip1
      if: Neither prosecution nor third-country custody is available as a disposition option at the time.
      why: Capture remains preferred even in that circumstance.
    watch_for:
    - id: watch1
      what: Whether capture is feasible and whether another reasonable alternative can effectively address the threat.
      favors:
      - O1
      why: Those assessments determine whether the policy's conditions for lethal action are met.
  lesson: Prefer capture when it offers meaningful intelligence and can mitigate or disrupt threats. A proposal for lethal
    action requires a capture-feasibility assessment and is limited to cases where capture is infeasible and no other reasonable
    alternative effectively addresses the threat.
  limits: This reasoning concerns the stated United States counterterrorism policy for preventing attacks against U.S. persons.
    It does not supply case-specific findings about feasibility or alternatives, or define procedures for making those assessments.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-d8f57d6c
    source: https://www.justice.gov/oip/foia-library/procedures_for_approving_direct_action_against_terrorist_targets/dl
