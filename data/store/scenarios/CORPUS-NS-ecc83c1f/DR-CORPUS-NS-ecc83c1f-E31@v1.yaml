case:
  id: DR-CORPUS-NS-ecc83c1f-E31@v1
  title: France and the NATO Command Transition
  status: draft
  setting: Paris and the coalition command structure, March 24, 2011; the Libya operation.
  decider: The French political leadership in Paris
  agent: The French political leadership in Paris
  agent_role: decide
  situation: The Libya operation has begun under a rapidly assembled coalition arrangement, with national operations coordinated
    at Ramstein. France has accepted an ad hoc U.S.-headquartered arrangement and placed senior French officers in the Ramstein
    air operations center. French military officials assess that a French, British, or Franco-British command chain could
    manage planning and command, but Paris doubts other contributors would accept a non-U.S.-led arrangement. France is concerned
    that NATO’s political character and constraints from reluctant allies could limit the Alliance’s ability to act. Italy,
    Norway, and other allies are pressing for NATO command, while Washington is unwilling to continue leading and Britain
    does not support the French preference. The decision is whether to retain coalition command or accept NATO command while
    limiting Alliance political control and retaining direct control of French forces.
  question: What should the French political leadership in Paris do on March 24, 2011, about whether to transfer the Libya
    operation to NATO command?
  options:
    O1:
      do: The French government adopts NATO command arrangements, limits the Alliance’s political role, and retains direct
        operational control of French forces.
      move: act
      irreversible: false
    O2:
      do: The French government rejects NATO command arrangements and continues coalition command under the U.S. headquarters,
        with national operational control of French forces throughout the operation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: During the first days of the operation, the national operations were coordinated at Ramstein before the command
      arrangement evolved toward greater integration.
  - id: F2
    kind: capability
    status: assessed
    fact: Senior French military officials assessed that a French, British, or Franco-British command chain could manage planning
      and command of the operation.
  - id: F3
    kind: situation
    status: assessed
    fact: Paris doubted that other contributors would accept a non-U.S.-led command arrangement, and coalition partners had
      not supported that option.
  - id: F4
    kind: situation
    status: confirmed
    fact: Italy, Norway, and other NATO allies pressed for NATO to become the commanding structure.
  - id: F5
    kind: situation
    status: confirmed
    fact: Washington was unwilling to continue leading the coalition, and Britain did not intend to support the French view.
  - id: F6
    kind: situation
    status: assessed
    fact: France feared NATO would be perceived as too Western and that constraints from Germany and Turkey, which had been
      reluctant about the operation, would limit the Alliance’s ability to act.
  - id: F7
    kind: situation
    status: confirmed
    fact: Paris accepted an ad hoc arrangement based at Ramstein, and senior French officers joined the air operations center
      there.
  - id: F8
    kind: situation
    status: confirmed
    fact: France sought to limit the North Atlantic Council’s political role, emphasize the Contact Group as the political
      forum, and retain direct operational control of French forces.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: A French, British, or Franco-British command chain was assessed as militarily capable, but Paris doubted that contributors
      would accept a non-U.S.-led arrangement and coalition partners had not supported it. Capability alone did not make that
      alternative politically viable.
  - id: C2
    facts:
    - F4
    - F5
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: Allies pressed for NATO command while Washington was unwilling to continue leading and Britain would not support
      France’s preferred approach. Keeping the existing coalition arrangement would therefore leave the operation without
      the support needed for a continuing command structure.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: France feared that NATO’s political character and constraints from reluctant allies could limit the Alliance’s ability
      to act. This was a real concern, but it was a risk rather than an established impediment.
  - id: C4
    facts:
    - F8
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: France could accept NATO command while seeking to keep the transfer technical, emphasize the Contact Group for political
      consultation, and retain direct operational control of French forces. Those safeguards addressed some of France’s concerns
      without rejecting the command structure allies demanded.
  reasoning:
    read: 'The choice was not simply between a capable French-led structure and NATO: the French military assessment of capability
      did not resolve whether coalition contributors would accept that structure. The trap is treating France’s command capacity
      as enough to preserve the coalition arrangement when Washington would not continue leading and Britain did not support
      the French position.'
    weighing: The central reasons favoring {O1} were the lack of partner support for a non-U.S.-led alternative and the combination
      of allied pressure with Washington’s unwillingness to continue and Britain’s opposition ({C1}, {C2}). France’s concerns
      about NATO constraints weighed the other way ({C3}), but Paris sought to manage those concerns by limiting the Alliance’s
      political role and retaining direct control of French forces ({C4}). The balance depends on coalition acceptance and
      continued command support, not on military capability alone.
    tradecraft: Make the transfer explicit as a command arrangement, distinguish NATO’s use of command machinery from the
      political forum for consultation, and record the retained national control of French forces. Keep the limits and responsibilities
      clear to the participating allies.
    uncertainty: French officials feared that NATO’s political character and constraints from Germany and Turkey could limit
      the Alliance’s ability to act, but whether those concerns would in fact have prevented NATO from acting was uncertain.
      It was also uncertain whether the alternative command chain would have won coalition acceptance.
    handoff: Paris should consult the allies pressing for NATO command and the relevant NATO command authorities about the
      transfer, while using the Contact Group for the political consultations France sought to preserve. Their positions matter
      because the acceptability of the command arrangement, rather than French military capacity alone, was central to the
      choice.
    tempting_wrong:
      option: O2
      pull: French officials assessed that a French, British, or Franco-British command chain could manage the operation,
        and France feared NATO constraints.
      why_wrong: That argument gives military feasibility more weight than coalition acceptance, despite the lack of partner
        support and the absence of continued U.S. leadership.
    rejected:
      O2: Paris did not retain the coalition arrangement because allies pressed for NATO command, Washington would not continue
        leading, and Britain would not support the French preference.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Coalition contributors accepted a French, British, or Franco-British command chain and Washington remained willing
        to lead or support that arrangement.
      then: O2
      why: That would remove the central political objection to a non-NATO alternative and weaken the pressure to transfer
        command.
    - id: flip2
      if: NATO constraints from reluctant allies were shown to prevent the Alliance from acting, while a coalition command
        arrangement remained acceptable to contributors.
      then: O2
      why: The concern about NATO limiting the Alliance’s ability to act would then become a demonstrated mission impediment
        rather than a feared risk.
    would_not_change:
    - id: noflip1
      if: French military officials continued to assess that a French or Franco-British command chain could manage the operation,
        without evidence that coalition partners would accept it.
      why: Military capability alone would not resolve the political lack of support that made the alternative unviable.
    watch_for:
    - id: watch1
      what: Whether coalition partners continue to press for NATO command while Washington remains unwilling to lead and Britain
        does not back France’s preferred arrangement.
      favors:
      - O1
      why: Those conditions reinforce the reasons for accepting NATO command.
  lesson: A command structure must be politically acceptable to the contributors who need to sustain it; national capacity
    to command is not enough. When accepting an alliance structure, address political and national-control concerns through
    clear limits and consultation rather than assuming they outweigh coalition support.
  limits: This reasoning concerns the March 24, 2011 command decision and the political support available for the Libya operation.
    It does not establish that NATO command was legally required, that the feared NATO constraints materialized, or that the
    same balance applies when coalition support or command options differ.
