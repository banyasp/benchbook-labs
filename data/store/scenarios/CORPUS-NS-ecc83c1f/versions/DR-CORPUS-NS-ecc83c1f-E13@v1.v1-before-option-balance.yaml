case:
  id: DR-CORPUS-NS-ecc83c1f-E13@v1
  title: Tanker Command Authority During Libya Campaign Preparations
  status: draft
  setting: During preparations for NATO's takeover of the Libya war, U.S. command coordination in Europe over the Morón tanker
    deployment.
  decider: The principal air commanders, with the affected combatant commanders' agreement
  agent: The principal air commanders
  agent_role: decide
  situation: The United States was arranging command authority for a deploying tanker force as NATO prepared to take over
    the war. Under the usual arrangement, the Secretary of Defense would direct TRANSCOM to transfer OPCON of the tankers
    to AFRICOM. AFRICOM's air component commander had extensive air mobility experience, but AMC leaders questioned whether
    the AFRICOM and AFAFRICA staffs could handle the full responsibilities of OPCON for a large tanker force. AFRICOM's air
    operations center was partly staffed on a matrix basis, with key personnel available only part time. AMC proposed retaining
    OPCON while granting AFRICOM TACON over tanker operations, leaving logistics and personnel management with AMC and the
    parent wings. The Defense Department had issued orders directing the usual OPCON transfer, and coordination among the
    Joint Staff and affected commands was underway.
  question: What should the principal air commanders do about operational and tactical control of the deploying tanker force?
  options:
    O1:
      do: The principal air commanders should transfer tanker OPCON to AFRICOM, placing tanker operations and logistical support
        under AFRICOM.
      move: act
      irreversible: false
    O2:
      do: The principal air commanders should ask the Joint Staff and affected combatant commands to complete further coordination
        before setting tanker control.
      move: ask
      irreversible: false
      to: the Joint Staff and affected combatant commands
    O3:
      do: The principal air commanders should retain tanker OPCON at TRANSCOM, grant AFRICOM TACON over operations, and keep
        logistics and personnel management with AMC.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Under the usual doctrinal arrangement, the Secretary of Defense would direct TRANSCOM to transfer tanker OPCON to
      AFRICOM.
  - id: F2
    kind: authority
    status: confirmed
    fact: For prolonged deployments, OPCON centralizes authority over deployed units' operations and logistical support.
  - id: F3
    kind: capability
    status: assessed
    fact: AMC leaders believed AFRICOM and AFAFRICA staffs could not exercise the full responsibilities of OPCON for a large
      tanker force, particularly one funded from AMC MPA funds and manned by rapidly rotating volunteers.
  - id: F4
    kind: situation
    status: confirmed
    fact: AFRICOM's primary mission was political-military engagement in Africa, including training, humanitarian relief,
      and small-scale counterpiracy and counterterrorism activities.
  - id: F5
    kind: capability
    status: confirmed
    fact: AFRICOM's 617 AOC had 115 billets and was partly staffed on a matrix basis, leaving many key members available only
      part time.
  - id: F6
    kind: capability
    status: confirmed
    fact: The AFAFRICA commander was experienced across air mobility operations and had recently served as vice commander
      of TRANSCOM's air component.
  - id: F7
    kind: authority
    status: confirmed
    fact: AMC's proposed split would leave tanker OPCON with TRANSCOM, give AFRICOM TACON over tanker operations, and keep
      logistics and personnel management with parent wings and AMC staff.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Defense Department issued orders directing the usual OPCON transfer to AFRICOM, while TRANSCOM coordinated the
      proposed split with the Joint Staff and affected commands.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The usual doctrinal arrangement transferred OPCON to AFRICOM, and OPCON could centralize operational and logistical
      authority during a prolonged deployment.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: AMC leaders doubted that AFRICOM and AFAFRICA could manage the full responsibilities of OPCON for this force; AFRICOM's
      engagement-focused mission and partly staffed, part-time AOC reinforced that capacity concern.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The air component commander had extensive air-mobility experience, which supported confidence in her ability to direct
      tanker operations, but did not resolve the broader staff-capacity concern.
  - id: C4
    facts:
    - F7
    equity: control_integrity
    favors:
    - O3
    weight: strong
    why: The proposed split matched operational direction to AFRICOM while leaving logistics and personnel management with
      AMC and the parent wings, where AMC believed the necessary support capacity resided.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Because the Defense Department had ordered the usual OPCON transfer, the alternative arrangement required coordination
      with the Joint Staff and affected commands rather than unilateral disregard of the order.
  reasoning:
    read: This was a choice between the doctrinal default of transferring OPCON and a proposed division of authority. The
      trap is treating the default, or the air component commander's individual experience, as sufficient to answer whether
      the staffs could carry the full operational, logistical, and personnel responsibilities for this deployment.
    weighing: The doctrinal default and the air component commander's experience supported {O1} ({C1}, {C3}). The stronger
      counterweight was AMC's concern about AFRICOM's capacity, supported by its mission and AOC staffing limits ({C2}). The
      split preserved AFRICOM's direction of tanker operations while retaining logistics and personnel management with AMC
      and the parent wings ({C4}). The existing order made coordination necessary ({C5}); with the affected commands' agreement,
      the principal air commanders endorsed the split. The balance depends chiefly on the staff's capacity for full OPCON
      responsibilities, not simply on the commander's personal experience.
    tradecraft: Record the capability concern, the responsibilities each command would retain, and the affected commands'
      agreement; ensure the approved arrangement is reconciled with the existing order. This preserves a clear decision rationale
      and authority record.
    uncertainty: The staff-capacity concern was AMC leaders' assessment, while the AOC's staffing limits and mission focus
      provided supporting context. The source does not establish that the doctrinal default was legally unavailable; it records
      that the initial order was superseded after coordination.
    handoff: The principal air commanders should decide with the affected combatant commands and the Joint Staff involved,
      because the proposed split departs from the issued OPCON direction and requires coordinated agreement.
    tempting_wrong:
      option: O1
      pull: It follows the usual doctrinal arrangement and places authority with an air component commander experienced in
        air mobility.
      why_wrong: That does not answer AMC's concern that the AFRICOM and AFAFRICA staffs lacked the capacity for the full
        range of OPCON responsibilities, particularly support and personnel management.
    rejected:
      O1: The commanders did not adopt the usual OPCON transfer because the staff-capacity concern favored retaining support
        and personnel responsibilities with AMC.
      O2: 'Further coordination alone was not the final course: the affected commands agreed to the split, allowing the commanders
        to settle the authority arrangement.'
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: AFRICOM and AFAFRICA had staffs capable of exercising the full responsibilities of OPCON for a large tanker force,
        including its support and personnel demands.
      then: O1
      why: The principal reason for retaining OPCON at TRANSCOM would be substantially reduced, making the doctrinal transfer
        more persuasive.
    would_not_change:
    - id: noflip1
      if: The air component commander remained individually experienced in air mobility, while the staff-capacity concern
        remained.
      why: Individual expertise supports operational direction but does not by itself resolve the stated concern about the
        staff's ability to carry the full OPCON responsibilities.
    watch_for:
    - id: watch1
      what: Whether the AOC has the staffing and expertise needed for full-spectrum air operations, rather than relying on
        key personnel available only part time.
      favors:
      - O3
      why: Those staffing limits were a concrete basis for the concern about AFRICOM's capacity to exercise OPCON.
  lesson: A doctrinal default should be weighed against whether the receiving command can actually perform the responsibilities
    that come with the authority. When a split better matches operational direction and support capacity, coordinate it with
    the affected authorities and reconcile it with existing orders.
  limits: This reasoning applies to the described tanker command arrangement and the stated capacity concerns. It does not
    establish that a split is preferable when the receiving command has adequate staff or when governing orders and command
    agreements differ.
