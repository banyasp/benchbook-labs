case:
  id: DR-CORPUS-NX-238167d1-E46@v1
  title: Estimating the Timing of a Soviet Strike
  status: draft
  setting: Western USSR and NATO forces in Europe; time unspecified; intelligence-estimate context.
  decider: The intelligence estimators
  agent: The intelligence estimators
  agent_role: decide
  situation: The estimators are assessing a possible Soviet response to a large-scale theater nuclear strike against the western
    USSR. One possibility is that Soviet leaders would coordinate theater and intercontinental strikes. In a scenario involving
    a massive preemptive theater strike against NATO forces in Europe, available evidence is described as suggesting a simultaneous
    strike against the United States. A possible alternative is that Soviet leaders would delay the intercontinental strike
    in the hope of avoiding US retaliation. Soviet decoupling from the United States is also described as a long-term goal.
  question: What should the intelligence estimators assess about whether Soviet leaders would pair the theater strike with
    a simultaneous strike against the United States or delay the intercontinental strike?
  options:
    O1:
      do: The analysts assess that Soviet leaders would delay the intercontinental strike against the United States after
        the theater strike.
      move: act
      irreversible: false
    O2:
      do: The analysts assess that Soviet leaders would coordinate the theater strike with a simultaneous intercontinental
        strike against the United States.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The estimate considers a large-scale theater nuclear strike against the western USSR as a scenario for assessing
      a Soviet response.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The estimators judge that Soviet leaders would launch a coordinated theater and intercontinental strike in response
      to that scenario.
  - id: F3
    kind: intelligence
    status: assessed
    fact: If Soviet leaders chose a massive preemptive theater strike against NATO forces in Europe, the estimators judge
      they would also strike the United States at the same time.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Available evidence suggests that Soviet leaders would launch a preemptive strike against the United States at the
      same time as the theater strike.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Soviet leaders could choose to delay the intercontinental strike.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A possible reason for delaying the intercontinental strike would be the hope that the United States would not retaliate
      against the Soviet homeland.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Decoupling from the United States is described as a long-term Soviet goal.
  - id: F8
    kind: intelligence
    status: assessed
    fact: An alternative assessment holds that available evidence makes delay of the intercontinental strike highly unlikely.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The estimators judge that a large-scale theater nuclear strike against the western USSR would be met by a coordinated
      theater and intercontinental strike.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: For a massive preemptive theater strike against NATO, the available evidence suggests that the strike against the
      United States would occur at the same time.
  - id: C3
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Delay remains possible, with the stated possible motive that Soviet leaders might hope to avoid US retaliation against
      the Soviet homeland.
  - id: C4
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Although decoupling from the United States is a long-term Soviet goal, the alternative assessment says the available
      evidence makes delay highly unlikely.
  reasoning:
    read: This is an intelligence judgment about the likely timing of a Soviet intercontinental strike in the scenario, not
      a decision about carrying out either strike. The trap is to treat a possible delay, and its possible motive, as equally
      likely despite the assessment that the evidence makes delay highly unlikely.
    weighing: The coordinated-strike judgment and the evidence for a simultaneous strike favor {O2} ({C1}, {C2}). The possibility
      that leaders might delay in hope of avoiding US retaliation gives {O1} some weight ({C3}), but the assessment that delay
      is highly unlikely, notwithstanding the long-term decoupling goal, favors {O2} ({C4}).
    tradecraft: State the estimate as a likelihood judgment, distinguish the possible delay rationale from the assessment
      of what is likely, and preserve that uncertainty in the analytic record. Do not extend the judgment into operational
      details.
    uncertainty: The source allows that leaders could delay in the hope of avoiding US retaliation, but provides no probability
      for that possibility; it characterizes delay as highly unlikely.
    handoff: The estimators should make and document the assessment; the source identifies no separate approval authority
      or required referral.
    tempting_wrong:
      option: O1
      pull: Delay could seem plausible because Soviet leaders might hope that withholding an immediate intercontinental strike
        would avert US retaliation.
      why_wrong: That is a stated possible rationale, not the prevailing likelihood judgment; the available evidence is described
        as making delay highly unlikely.
    rejected:
      O1: The estimators do not choose delay as the main assessment because, despite its possible rationale, the available
        evidence suggests delay is highly unlikely.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessed scenario instead included Soviet leaders choosing to delay the intercontinental strike in the hope
        that the United States would not retaliate against the Soviet homeland.
      then: O1
      why: That is the source's stated possible alternative course and rationale; if it were the assessed choice rather than
        a low-likelihood possibility, delay would be the answer.
    would_not_change:
    - id: noflip1
      if: Soviet decoupling from the United States remains a long-term goal, without evidence making delay likely.
      why: The assessment explicitly places that goal alongside the judgment that delay is highly unlikely.
    watch_for:
    - id: watch1
      what: New evidence that materially changes the assessment of whether Soviet leaders would delay the intercontinental
        strike.
      favors:
      - O1
      why: The source makes the timing judgment depend on available evidence, while acknowledging delay as a possibility.
  lesson: Distinguish a possible course and its rationale from the course the evidence makes most likely. Preserve meaningful
    uncertainty, but do not let a conceivable alternative displace the source's stated likelihood judgment.
  limits: This reasoning applies to the intelligence assessment framed here and does not establish what Soviet leaders would
    actually have done. It does not assess the legality, morality, or operational conduct of either strike.
  library:
    domain: military-operational
    family: CORPUS-NX-238167d1
    source: https://www.cia.gov/resources/csi/static/a462f3d32dd7175015f67a04d33ce88d/Intentions-and-Capabilities-1.pdf
    episode_focus: In the stated scenario, the estimate judges that leaders would probably pair a massive preemptive theater
      strike against NATO with a preemptive strike against the United States, while noting a possible delay in the hope of
      avoiding US retaliation. It contrasts that rationale with evidence suggesting delay is highly unlikely. Exclude operational
      details of either strike.
    cues:
      option_words:
        O1: 19
        O2: 20
      real_option: O2
      real_to_mean_other_length: 1.05
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
