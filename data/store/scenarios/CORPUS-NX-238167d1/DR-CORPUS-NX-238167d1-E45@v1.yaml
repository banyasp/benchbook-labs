case:
  id: DR-CORPUS-NX-238167d1-E45@v1
  title: Soviet Decision Under Nuclear-War Risk
  status: draft
  setting: USSR, amid the prospect of an imminent NATO nuclear strike, Soviet leadership
  decider: The Soviet leadership
  agent: The Soviet leadership
  agent_role: decide
  situation: Soviet leaders face the prospect of an imminent NATO nuclear strike. They may believe NATO intends to use nuclear
    weapons on a limited scale that would not cause a major Pact defeat, but it is uncertain how they could determine and
    trust that assessment. A warning of a NATO nuclear strike may prompt a massive Soviet preemptive strike. Soviet leaders
    seek combat success, while avoiding unnecessary escalation and damage to the USSR may also weigh on their decision. They
    must also consider whether Soviet objectives could still be achieved.
  question: What should the Soviet leadership do about initiating a large-scale preemptive strike when faced with the prospect
    of an imminent NATO nuclear strike?
  options:
    O1:
      do: The Soviet leadership chooses to refrain from initiating a large-scale preemptive strike.
      move: act
      irreversible: false
    O2:
      do: The Soviet leadership chooses to initiate a large-scale preemptive strike.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Soviet leaders might decide against a large-scale preemptive strike if they perceive NATO's intended nuclear use
      as limited and not resulting in a major Pact defeat.
  - id: F2
    kind: intelligence
    status: assessed
    fact: It is uncertain how Soviet leaders could determine and become convinced that an imminent NATO nuclear strike would
      be limited rather than large-scale.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A warning of a NATO nuclear strike is likely to prompt a massive Soviet preemptive strike.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Soviet leadership's overriding goal is combat success rather than control of escalation.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Soviet leadership's reaction to the prospect of global nuclear war cannot be predicted.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Avoiding unnecessary escalation to theaterwide or global nuclear war could motivate Soviet restraint.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Avoiding damage to the USSR is among the factors relevant to the Soviet leadership's decision.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Soviet leadership's assessment of whether it could still achieve its objectives is among the factors relevant
      to its decision.
  considerations:
  - id: C1
    facts:
    - F1
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: If Soviet leaders believe NATO's intended nuclear use will remain limited and will not cause a major Pact defeat,
      they might decide against a large-scale preemptive strike.
  - id: C2
    facts:
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: Avoiding unnecessary escalation to theaterwide or global nuclear war could motivate restraint.
  - id: C3
    facts:
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Avoiding damage to the USSR is one factor the leadership would weigh against initiating a large-scale strike.
  - id: C4
    facts:
    - F4
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Combat success is the leadership's overriding goal, and its assessment of whether it could still achieve its objectives
      is relevant to the choice.
  - id: C5
    facts:
    - F2
    - F3
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The leadership may be unable to determine whether NATO's strike will be limited, while a warning of a NATO nuclear
      strike is likely to prompt a massive Soviet preemptive strike; this creates pressure toward O2 but does not establish
      that it is necessary.
  reasoning:
    read: The decision is whether to initiate a large-scale preemptive strike, not how to carry one out. The trap is that
      a warning may prompt a massive response even though leaders may believe NATO's intended use is limited; it remains unclear
      how they could establish and trust that belief.
    weighing: 'The balance includes a possible basis for restraint: belief in limited NATO use without a major Pact defeat,
      a desire to avoid unnecessary escalation, and concern about damage to the USSR {C1} {C2} {C3}. Against that, combat
      success is the overriding goal, so whether Soviet objectives remain achievable matters {C4}. Uncertainty about NATO''s
      intentions and the response to a warning adds pressure but does not resolve the balance {C5}. The balance depends in
      particular on the leadership''s assessment of NATO''s intended scale and whether Soviet objectives could still be achieved.'
    tradecraft: At the decision level, distinguish what is believed about NATO's intended scale from what remains uncertain,
      and make explicit how the assessment of Soviet objectives and the risk of escalation bears on the choice. Record the
      reasons for the decision without treating an uncertain estimate as certainty.
    uncertainty: It is unclear how Soviet leaders could become convinced that NATO's strike would be limited, and their reaction
      to the prospect of global nuclear war cannot be predicted. It is also uncertain whether Soviet objectives could still
      be achieved.
    handoff: The Soviet leadership is the identified decision-maker. No separate authority or required consultation is specified;
      keeping the choice at leadership level and ensuring the relevant uncertainties are made explicit is a decision-practice
      synthesis.
    tempting_wrong:
      option: O2
      pull: A warning of an imminent NATO nuclear strike is likely to prompt a massive Soviet preemptive strike, and combat
        success is the overriding goal.
      why_wrong: That pressure does not by itself show that a large-scale strike is needed to achieve Soviet objectives, and
        it discounts the stated possibility of restraint to avoid unnecessary escalation and damage to the USSR.
    rejected:
      O2: The possibility of restraint when leaders perceive NATO's intended use as limited, along with the reasons to avoid
        unnecessary escalation and damage to the USSR, weighs against an unconditional large-scale preemptive strike.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership assessed that Soviet objectives could not still be achieved without a large-scale preemptive strike.
      then: O2
      why: The prospect of achieving Soviet objectives is a factor, and combat success is the overriding goal; this condition
        would give that consideration greater weight.
    - id: flip2
      if: The leadership assessed that NATO's imminent use would be large-scale or would cause a major Pact defeat.
      then: O2
      why: The stated condition under which leaders might refrain would no longer apply, increasing the weight of the combat-success
        concern.
    would_not_change:
    - id: noflip1
      if: Leaders remain unable to determine whether NATO's intended use will be limited.
      why: That uncertainty alone does not establish that a large-scale preemptive strike is necessary.
    watch_for:
    - id: watch1
      what: Whether leaders believe NATO's intended use is limited and whether they believe Soviet objectives could still
        be achieved.
      favors:
      - O1
      - O2
      why: The perceived scale of NATO's use and the likelihood of achieving Soviet objectives are relevant to the decision.
    - id: watch2
      what: Whether a warning of NATO nuclear use is likely to trigger a massive Soviet preemptive response.
      favors:
      - O2
      why: A warning is likely to prompt such a response, although that does not establish that it is required.
  lesson: Do not treat a warning of imminent attack as proof that a large-scale preemptive response is necessary. Weigh the
    prospect of achieving the mission against the risk of unnecessary escalation and damage, while keeping uncertainty about
    the adversary's intentions visible.
  limits: This reasoning concerns the Soviet leadership's assessed choice in the prospect of an imminent NATO nuclear strike.
    It does not establish a general legal rule for preemption or determine what action would be justified under different
    facts or authorities.
