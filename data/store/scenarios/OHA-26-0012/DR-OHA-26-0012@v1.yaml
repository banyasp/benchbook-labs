case:
  id: DR-OHA-26-0012@v1
  title: Restoration of Access Authorization after Alcohol-Related Incident
  status: draft
  setting: DOE Office of Hearings and Appeals, May 5 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, employed by a DOE contractor in a position requiring a security clearance, was arrested on June
    7 2025 for driving while intoxicated, a charge later enhanced to intoxication assault with a vehicle causing serious bodily
    injury. He admitted consuming six to seven shots and two 12‑ounce beers before the incident. The Local Security Office
    raised security concerns under Guideline G (alcohol consumption) and Guideline J (criminal conduct) and referred the case
    for a hearing. A DOE contractor psychologist evaluated him in August 2025, diagnosing Alcohol Use Disorder, Mild, in early
    remission, and recommended treatment. The Individual completed an intensive outpatient program from September to November
    2025, attended counseling, and submitted seven negative PEth tests from October 2025 through March 2026. At the hearing,
    testimony was taken from the Individual, his fiancée, and the psychologist. The regulations governing access authorizations
    impose a presumption against granting or restoring a clearance and require the individual to show that restoration will
    not endanger the common defense.
  question: What should the Administrative Judge do with the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge holds the decision pending further evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge asks for an additional psychological evaluation.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: On June 7 2025 the Individual was arrested and charged with DWI, later enhanced to intoxication assault with a vehicle
      causing serious bodily injury, a 3rd‑degree felony.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual consumed six to seven shots and two 12‑ounce beers within an hour and a half before the arrest.
  - id: F4
    kind: situation
    status: assessed
    fact: A DOE contractor psychologist evaluated the Individual in August 2025 and diagnosed Alcohol Use Disorder, Mild,
      in early remission, noting no evidence of rehabilitation.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed an intensive outpatient program from September to November 2025, attended counseling, and
      submitted seven negative PEth tests from October 2025 through March 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      under Guideline G and Guideline J.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual requested an administrative hearing; testimony was taken from the Individual, his fiancée, and the
      DOE psychologist.
  - id: F8
    kind: authority
    status: confirmed
    fact: The regulations governing access authorizations impose a presumption against granting or restoring a clearance and
      require the individual to show that restoration will not endanger the common defense.
  considerations:
  - id: C1
    facts:
    - F5
    - F4
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Individual completed the intensive outpatient program, provided seven consecutive negative PEth tests, and the
      DOE Psychologist concluded he was rehabilitated, satisfying Guideline G mitigation under ¶23(d).
  - id: C2
    facts:
    - F5
    - F2
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The Individual’s criminal conduct has not recurred; he complies with bond conditions, and the psychologist’s assessment
      of successful rehabilitation meets Guideline J mitigation under ¶32(d).
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: Although Part 710 imposes a presumption against restoration, the regulations also require the individual to demonstrate
      that restoration will not endanger the common defense; the record satisfies that burden.
  - id: C4
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The DOE‑contractor psychologist’s expert opinion, based on DSM‑5‑TR criteria and PEth testing, provides reliable,
      professional evidence of remission and rehabilitation.
  reasoning:
    read: The case hinges on whether the Individual’s alcohol‑related offense and diagnosis of AUD constitute a continuing
      security risk under Guidelines G and J, or whether the documented treatment, abstinence, and professional assessments
      mitigate those concerns sufficiently to restore his clearance.
    weighing: The Administrative Judge weighed the mitigating factors listed in ¶23(b), (d) for Guideline G and ¶32(d) for
      Guideline J against the presumption against clearance. The Judge found the Individual’s completed treatment, sustained
      abstinence (seven negative PEth tests), and psychologist’s opinion of rehabilitation to outweigh the original concerns,
      concluding that restoration would not endanger the common defense and aligns with the national interest.
    tradecraft: The decision is recorded in the official OHA decision memorandum, citing the relevant CFR provisions, Adjudicative
      Guidelines paragraphs, and the evidentiary record. The restoration order is entered into the Individual’s personnel
      security file and communicated to the Local Security Office for implementation.
    uncertainty: The primary uncertainty lies in the Individual’s future alcohol use; a relapse could revive the security
      concerns. The decision therefore includes a recommendation for continued monitoring of PEth results and compliance with
      any court‑ordered conditions.
    handoff: The Administrative Judge acted alone, as authorized by 10 C.F.R. § 710.25(d)‑(g). No further agency review is
      required unless an appeal is filed under § 710.28.
    tempting_wrong:
      option: O3
      pull: The seriousness of the felony and the initial DWI could suggest a denial, especially given the statutory presumption
        against clearance.
      why_wrong: The source explicitly found that the mitigating evidence satisfied the Guidelines, and a denial would contradict
        the Judge’s own analysis and the statutory requirement to consider all favorable evidence.
    rejected:
      O1: Holding the case would ignore the clear, documented rehabilitation and would unnecessarily delay a decision the
        Judge has already justified.
      O2: An additional psychological evaluation is unnecessary because the existing psychologist’s report already meets the
        required standard and the Individual has complied with its recommendations.
      O3: Denial fails to recognize that the Individual has met the mitigation criteria under both Guidelines G and J, as
        the Judge expressly concluded.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to produce a positive PEth test or be convicted of a new alcohol‑related offense after the hearing
      then: O3
      why: A positive biomarker or new criminal conduct would demonstrate a failure to maintain abstinence and would re‑activate
        the security concerns under Guidelines G and J.
    would_not_change:
    - id: noflip1
      if: The Individual continues to abstain from alcohol and complies with all court‑ordered conditions
      why: Continued compliance sustains the mitigation findings already accepted by the Judge.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or relapse into alcohol use
      favors:
      - O3
      why: A relapse would revive the security concerns that were previously mitigated.
  lesson: When an individual demonstrates sustained abstinence, completes recommended treatment, and receives a qualified
    professional’s affirmation of rehabilitation, the security‑clearance guidelines allow for restoration despite prior alcohol‑related
    offenses. The adjudicative process must balance the statutory presumption against clearance with concrete mitigating evidence.
  limits: This reasoning applies only where the individual provides verifiable, ongoing evidence of abstinence and has completed
    the specific treatment program recommended. It does not extend to repeat offenses, lack of professional assessment, or
    situations where the individual fails to meet the documented mitigation criteria.
