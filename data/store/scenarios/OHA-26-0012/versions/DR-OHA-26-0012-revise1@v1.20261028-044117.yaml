case:
  id: DR-OHA-26-0012-revise1@v1
  title: Restoration of Access Authorization after Alcohol-Related Incident [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, May 5 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, employed by a DOE contractor in a position requiring a security clearance, was arrested on June
    7 2025 for driving while intoxicated, a charge later enhanced to intoxication assault with a vehicle causing serious bodily
    injury. He admitted consuming six to seven shots and two 12‑ounce beers before the incident. The Local Security Office
    raised security concerns under Guideline G (alcohol consumption) and Guideline J (criminal conduct) and referred the case
    for a hearing. A DOE contractor psychologist evaluated him in August 2025, diagnosing Alcohol Use Disorder, Mild, in early
    remission, and recommended treatment. The Individual completed an intensive outpatient program from September to November
    2025, attended counseling, and submitted seven negative PEth tests from October 2025 through March 2026. At the hearing,
    testimony was taken from the Individual, his fiancée, and the psychologist. The regulations governing access authorizations
    impose a presumption against granting or restoring a clearance and require the individual to show that restoration will
    not endanger the common defense.
  question: What should the Administrative Judge do with the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge holds the decision pending further evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge asks for an additional psychological evaluation.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: On June 7 2025 the Individual was arrested and charged with DWI, later enhanced to intoxication assault with a vehicle
      causing serious bodily injury, a 3rd‑degree felony.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual consumed six to seven shots and two 12‑ounce beers within an hour and a half before the arrest.
  - id: F4
    kind: situation
    status: assessed
    fact: A DOE contractor psychologist evaluated the Individual in August 2025 and diagnosed Alcohol Use Disorder, Mild,
      in early remission, noting no evidence of rehabilitation.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed an intensive outpatient program from September to November 2025, attended counseling, and
      submitted seven negative PEth tests from October 2025 through March 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      under Guideline G and Guideline J.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual requested an administrative hearing; testimony was taken from the Individual, his fiancée, and the
      DOE psychologist.
  - id: F8
    kind: authority
    status: confirmed
    fact: The regulations governing access authorizations impose a presumption against granting or restoring a clearance and
      require the individual to show that restoration will not endanger the common defense.
  considerations:
  - id: C1
    facts:
    - F5
    - F4
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Individual completed the intensive outpatient program, provided seven consecutive negative PEth tests, and the
      DOE Psychologist concluded he was rehabilitated, satisfying Guideline G mitigation under ¶23(d).
  - id: C2
    facts:
    - F5
    - F2
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The Individual’s criminal conduct has not recurred; he complies with bond conditions, and the psychologist’s assessment
      of successful rehabilitation meets Guideline J mitigation under ¶32(d).
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Although Part 710 imposes a presumption against restoration, the psychologist's own observation of "no evidence of
      rehabilitation" ({F4}) creates a material doubt that the Individual can meet the burden of showing restoration will
      not endanger the common defense; thus the record is insufficient for a definitive decision.
  - id: C4
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The DOE‑contractor psychologist’s expert opinion, based on DSM‑5‑TR criteria and PEth testing, provides reliable,
      professional evidence of remission and rehabilitation.
  reasoning:
    read: The core issue is whether the existing record—particularly the psychologist's statement that there is no evidence
      of rehabilitation—provides enough certainty to restore the clearance, or whether additional corroborating evidence is
      required before a safe determination can be made.
    weighing: The Administrative Judge now gives primary weight to the evidence-insufficiency highlighted in C3, treating
      the lack of documented rehabilitation as a bar to immediate restoration. The presumption against granting a clearance
      under Guideline G and J, combined with the unresolved question of long-term abstinence, outweighs the mitigating factors
      cited in C1, C2, and C4.
    tradecraft: The decision memorandum will note that the hearing record fails to satisfy the mitigation criteria of ¶23(d)
      and ¶32(d) because the expert assessment does not confirm rehabilitation, and therefore the Judge will issue an order
      to hold the case pending further evidence.
    uncertainty: Uncertainty remains regarding the Individual's sustained abstinence and the possibility of relapse; without
      additional objective verification, the security risk cannot be conclusively dismissed.
    handoff: The Administrative Judge acts alone under 10 C.F.R. § 710.25(d)-(g); the hold order will be communicated to the
      Local Security Office, which will monitor for any new evidence and schedule a follow-up hearing.
    tempting_wrong:
      option: O4
      pull: The documented treatment program, negative PEth tests, and psychologist's favorable opinion on remission make
        immediate restoration appear attractive.
      why_wrong: The psychologist simultaneously noted a lack of rehabilitation evidence, and the regulations require a clear
        demonstration that the individual will not endanger the common defense; proceeding without that proof would violate
        the statutory presumption against restoration.
    rejected:
      O2: 'An additional psychological evaluation would merely repeat the existing assessment and would not address the fundamental
        gap: the current report does not establish rehabilitation.'
      O3: Denial ignores the substantial mitigating steps already taken and would be disproportionate given the Individual's
        compliance with treatment and abstinence to date.
      O4: Restoration would proceed on an evidentiary record that the Judge has identified as incomplete, contravening the
        requirement to eliminate any reasonable doubt about security risk.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to produce a positive PEth test or be convicted of a new alcohol-related offense after the hearing
      then: O4
      why: A positive biomarker or new criminal conduct would demonstrate a failure to maintain abstinence and would re-activate
        the security concerns under Guidelines G and J.
    would_not_change:
    - id: noflip1
      if: The Individual continues to abstain from alcohol and complies with all court‑ordered conditions
      why: Continued compliance sustains the mitigation findings already accepted by the Judge.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or relapse into alcohol use
      favors:
      - O3
      why: A relapse would revive the security concerns that were previously mitigated.
  lesson: When the expert record contains explicit doubts about rehabilitation, the presumption against clearance prevails,
    and the adjudicator must hold the case until additional, conclusive evidence is presented.
  limits: This approach applies only where the factual record includes a qualified professional's statement that rehabilitation
    has not been demonstrated; it does not preclude restoration where clear, documented remission is established.
