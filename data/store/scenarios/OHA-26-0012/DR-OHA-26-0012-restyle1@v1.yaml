case:
  id: DR-OHA-26-0012-restyle1@v1
  title: Restoration of Access Authorization after Alcohol-Related Incident [restyle]
  status: needs_review
  setting: Energy Department Office of Hearings and Appeals, 5 May 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Employee, employed by an Energy Systems Contractor in a role that requires a security clearance, was arrested
    on 7 June 2025 for driving while intoxicated, a charge later enhanced to intoxication assault with a vehicle causing serious
    bodily injury. He admitted consuming six to seven shots and two 12-ounce beers before the incident. The Security Management
    Office raised security concerns under Guideline G (alcohol consumption) and Guideline J (criminal conduct) and referred
    the case for a hearing. A contractor-affiliated psychologist evaluated him in August 2025, diagnosing Alcohol Use Disorder,
    mild, in early remission, and recommended treatment. The Employee completed an intensive outpatient program from September
    to November 2025, attended counseling, and submitted seven negative PEth tests from October 2025 through March 2026. At
    the hearing, testimony was taken from the Employee, his partner, and the psychologist. The regulations governing access
    authorizations impose a presumption against granting or restoring a clearance and require the individual to show that
    restoration will not endanger the common defense.
  question: What action should the adjudicator take regarding the Employee's security clearance?
  options:
    O1:
      do: The adjudicator postpones a final determination pending additional documentation.
      move: hold
      irreversible: false
    O2:
      do: The adjudicator orders a supplementary mental-health assessment.
      move: ask
      irreversible: false
    O3:
      do: The adjudicator denies the request for clearance reinstatement.
      move: act
      irreversible: true
    O4:
      do: The adjudicator grants reinstatement of the clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Employee works for an Energy Systems Contractor in a role that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: On June 7 2025 the Employee was arrested and charged with DWI, later enhanced to intoxication assault with a vehicle
      causing serious bodily injury, a 3rd-degree felony.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Employee reported consuming six to seven shots of spirits and two 12-ounce beers within roughly ninety minutes
      before the arrest.
  - id: F4
    kind: situation
    status: assessed
    fact: A contractor-affiliated psychologist evaluated the Employee in August 2025, diagnosing Alcohol Use Disorder, mild,
      in early remission, and noted an absence of rehabilitative evidence.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Employee completed an intensive outpatient treatment program from September through November 2025, participated
      in counseling, and submitted seven consecutive negative PEth laboratory results spanning October 2025 to March 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Security Management Office issued a notification letter expressing substantial doubt about the Employee's eligibility
      under Guideline G (alcohol consumption) and Guideline J (criminal conduct).
  - id: F7
    kind: situation
    status: confirmed
    fact: The Employee petitioned for an administrative hearing; testimony was taken from the Employee, the Employee's partner,
      and the contractor psychologist.
  - id: F8
    kind: authority
    status: confirmed
    fact: The regulations governing access authorizations impose a presumption against granting or restoring a clearance and
      require the individual to demonstrate that restoration will not endanger the common defense.
  considerations:
  - id: C1
    facts:
    - F5
    - F4
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Employee's successful completion of the intensive outpatient program, together with seven successive negative
      PEth results, and the contractor psychologist's conclusion of rehabilitation satisfy the mitigation requirements of
      Guideline G under paragraph 23(d).
  - id: C2
    facts:
    - F5
    - F2
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The Employee has not reoffended; he remains in compliance with bond conditions, and the psychologist's assessment
      of successful rehabilitation fulfills the mitigation criteria of Guideline J under paragraph 32(d).
  - id: C3
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: Although Part 710 establishes a presumption against restoration, it also obliges the individual to show that reinstatement
      will not jeopardize the common defense; the assembled record meets that burden.
  - id: C4
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The contractor psychologist's expert opinion, grounded in DSM-5-TR criteria and corroborated by PEth testing, constitutes
      reliable professional evidence of remission and rehabilitation.
  reasoning:
    read: The adjudication centers on whether the Employee's alcohol-related offense and diagnosed AUD represent an ongoing
      security risk under Guidelines G and J, or whether the documented treatment, sustained abstinence, and professional
      assessments adequately mitigate those concerns to permit clearance reinstatement.
    weighing: The adjudicator balanced the mitigating factors enumerated in paragraph 23(b) and (d) for Guideline G and paragraph
      32(d) for Guideline J against the statutory presumption against clearance. The adjudicator concluded that the Employee's
      completed treatment, ongoing abstinence evidenced by seven negative PEth tests, and the psychologist's affirmation of
      rehabilitation outweigh the initial concerns, indicating that restoration would not threaten the common defense and
      aligns with national interests.
    tradecraft: The decision is entered in the official OHA memorandum, citing the pertinent CFR sections, adjudicative guideline
      paragraphs, and the evidentiary record. The restoration order is filed in the Employee's personnel security file and
      forwarded to the Security Management Office for execution.
    uncertainty: The principal uncertainty concerns the Employee's future alcohol consumption; a relapse would reactivate
      the security concerns. Accordingly, the decision includes a recommendation for continued PEth monitoring and adherence
      to any court-mandated conditions.
    handoff: The adjudicator acted independently, as authorized by 10 C.F.R. § 710.25(d)-(g). No further agency review is
      required unless an appeal is lodged under § 710.28.
    tempting_wrong:
      option: O3
      pull: The gravity of the felony and the original DWI might lead one to favor a denial, especially given the statutory
        presumption against clearance.
      why_wrong: The record explicitly demonstrates that the mitigating evidence satisfies the Guidelines, and a denial would
        contradict the adjudicator's own analysis and the statutory mandate to weigh favorable evidence.
    rejected:
      O1: Deferring the determination would disregard the clear, documented rehabilitation and would unnecessarily postpone
        a decision the adjudicator has already justified.
      O2: A further psychological assessment is unnecessary because the existing psychologist's report already meets the required
        standard and the Employee has complied with its recommendations.
      O3: Denial would overlook that the Employee has satisfied the mitigation criteria under both Guidelines G and J, as
        the adjudicator expressly concluded.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Employee were to produce a positive PEth result or be convicted of a new alcohol-related offense after the hearing
      then: O3
      why: A positive biomarker or new criminal conduct would indicate a failure to maintain abstinence and would reactivate
        the security concerns under Guidelines G and J.
    would_not_change:
    - id: noflip1
      if: The Employee continues to abstain from alcohol and complies with all court-ordered conditions
      why: Continued compliance sustains the mitigation findings already accepted by the adjudicator.
    watch_for:
    - id: watch1
      what: Any future positive PEth result or relapse into alcohol use
      favors:
      - O3
      why: A relapse would revive the security concerns that were previously mitigated.
  lesson: When an employee demonstrates sustained abstinence, completes the prescribed treatment, and receives a qualified
    professional's affirmation of rehabilitation, the security-clearance guidelines permit reinstatement despite prior alcohol-related
    offenses. The adjudicative process must balance the statutory presumption against clearance with concrete mitigating evidence.
  limits: This reasoning applies only where the employee supplies verifiable, ongoing evidence of abstinence and has completed
    the specific treatment program recommended. It does not extend to repeat offenses, absence of professional assessment,
    or situations where the individual fails to satisfy the documented mitigation criteria.
