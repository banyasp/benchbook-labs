case:
  id: DR-CORPUS-NX-533d302d-E5@v1
  title: Authorization of a Targeted Killing
  status: draft
  setting: U.S. executive branch and National Security Council, 2010; proposed action concerning Northern Yemen.
  decider: The President
  agent: The President
  agent_role: decide
  situation: The President faced a decision about authorizing a targeted killing in Yemen of a U.S. citizen identified as
    an AQAP leader. The National Security Council had approved the action. The subject had U.S. and UN terrorist designations,
    while the New York Police Department Counterterrorism Division assessed him as exceptionally dangerous. A central legal
    question was whether he was a belligerent or a civilian whose actions made him a legitimate target. U.S. policy also included
    an executive order prohibiting government participation in assassination.
  question: What should the President do about authorization for the targeted killing of the Individual?
  options:
    O1:
      do: The President should request legal review from the National Security Council before deciding.
      move: ask
      irreversible: false
      to: the National Security Council
    O2:
      do: The President should decline authorization for the proposed targeted killing of the Individual.
      move: act
      irreversible: false
    O3:
      do: The President should authorize the proposed targeted killing of the Individual.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The subject was a U.S. citizen.
  - id: F2
    kind: situation
    status: confirmed
    fact: The subject was identified as a leader of al-Qaeda in the Arabian Peninsula.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Treasury Department designated the subject as a global terrorist, and the subject was included on the UN Security
      Council Resolution 1267 list of terrorists.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The New York Police Department Counterterrorism Division considered the subject the most dangerous man in the world.
  - id: F5
    kind: situation
    status: assessed
    fact: The subject's status as a belligerent or a civilian who had become a legitimate target through his actions was a
      contested legal characterization.
  - id: F6
    kind: authority
    status: confirmed
    fact: Executive Order 12333 prohibited any person employed by or acting on behalf of the United States from engaging in
      or conspiring to engage in assassination, and barred any Intelligence Community agency from participating in or requesting
      activities forbidden by the order.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Constitution did not specifically mention foreign affairs or national security, leaving direction of American
      foreign policy among the matters over which the federal branches could struggle.
  - id: F8
    kind: authority
    status: confirmed
    fact: National Security Council approval was associated with the President's authorization process.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: security_risk
    favors:
    - O3
    weight: strong
    why: The subject was identified as an AQAP leader, had U.S. and UN terrorist designations, and was assessed as exceptionally
      dangerous. These facts support the counterterrorism case for authorization.
  - id: C2
    facts:
    - F1
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: strong
    why: Citizenship, the unresolved belligerent-or-civilian characterization, and the prohibition on assassination raise
      a serious legal question. The order does not establish whether this proposed targeting was lawful.
  - id: C3
    facts:
    - F7
    - F8
    equity: chain_of_command
    favors:
    - O3
    weight: weak
    why: Foreign affairs and national security are matters of interbranch contest, and presidential power in diplomacy, intelligence,
      and war has traditionally received deference. NSC approval was associated with the authorization process; the court's
      dismissal on standing and political-question grounds reflects deference to the political branches, not a ruling on the
      targeting's merits.
  reasoning:
    read: 'This is a proposed counterterrorism action against a U.S. citizen identified as an AQAP leader, with NSC approval
      associated with the President''s authorization. The trap is to treat terrorist designations as resolving the separate
      legal question: whether the subject was a belligerent or a civilian whose actions made him a legitimate target. Authorization
      was recorded, but the President''s deliberations and the precise legal authority relied upon are not detailed.'
    weighing: The threat assessment and the traditional deference to presidential authority in national-security matters support
      {O3}. Against that are the subject's citizenship, the unresolved status question, and the assassination prohibition;
      those warrant legal caution but are not presented as a binding rule that forecloses authorization. The court's procedural
      dismissal and political-question reasoning support deference to the political branches, while leaving the substantive
      legal question unsettled. The balance depends on the subject's conduct establishing legitimate target status and on
      the action falling within lawful authority—neither is fully explained here.
    tradecraft: Before acting, make the legal basis and the assessment of the subject's status explicit in the decision record;
      distinguish the terrorist designations from the legal conclusion that would make the subject targetable. Record how
      the assassination prohibition was considered and identify the limits of what the available legal review resolves.
    uncertainty: The central belligerent-or-civilian question is identified but not answered, and the precise authority relied
      upon and the President's deliberations are not described. The court did not decide the merits of the targeting claim.
    handoff: The President should involve the National Security Council and appropriate legal advisers because NSC approval
      was part of the authorization process and the subject's legal characterization was contested. The final decision remains
      with the President.
    tempting_wrong:
      option: O2
      pull: Withholding authorization may seem compelled by the subject's U.S. citizenship and the order prohibiting assassination.
      why_wrong: Authorization with NSC approval was the recorded outcome, and executive deference in national-security matters
        supports that course. Citizenship and the order are not established as categorical bars to this action, though the
        unresolved legal question remains important.
    rejected:
      O1: NSC approval was associated with the authorization process, and authorization was the recorded outcome rather than
        a further request for legal review.
      O2: The recorded outcome was authorization, supported by the counterterrorism and executive-authority considerations,
        rather than withholding authorization.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A legal assessment established that the subject remained a civilian and that his actions did not make him a legitimate
        target, or that the proposed action was prohibited assassination.
      then: O2
      why: That finding would resolve the central legal uncertainty against authorization and make the prohibition decisive.
    would_not_change:
    - id: noflip1
      if: The subject's terrorist designations were the only evidence offered to support authorization.
      why: The legal question whether he was a belligerent or a civilian made targetable by his actions would remain unanswered;
        designation alone would not settle it.
    watch_for:
    - id: watch1
      what: A legal challenge to the authorization or a substantive determination of the subject's status.
      favors:
      - O1
      - O2
      why: A lawsuit sought an injunction, and the belligerent-or-civilian characterization was a central legal question.
  lesson: In national-security decisions, threat designations and executive deference may support action, but they do not
    by themselves settle a distinct legal question about a person's status or the applicability of an assassination prohibition.
    Make the legal basis explicit, and do not mistake a procedural dismissal for a decision on the merits.
  limits: This reasoning applies to this proposed action and its unresolved legal characterization. It does not establish
    a general rule that U.S. citizens may be targeted, that terrorist designation establishes belligerent status, or that
    presidential authorization alone supplies legal authority.
