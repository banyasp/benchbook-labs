case:
  id: DR-CORPUS-NS-a7586584-E1@v1
  title: Proposed Strike Under Imminent-Threat Pressure
  status: draft
  setting: Qatar, Aug. 29, 2021, a U.S. military strike cell.
  decider: The strike cell.
  agent: The strike cell.
  agent_role: decide
  situation: The decision arose three days after 13 Americans were killed at Hamid Karzai International Airport. The evacuation
    deadline was nearing, and multiple terrorist threats were known. Ground intelligence was unavailable. The strike cell
    believed it faced an imminent threat to U.S. forces at the airport. The cell was handling multiple threat streams, and
    communication breakdowns occurred between it and supporting teams.
  question: What should the strike cell do about the proposed strike?
  options:
    O1:
      do: The strike cell declines the proposed strike.
      move: act
      irreversible: false
    O2:
      do: The strike cell authorizes the proposed strike.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Thirteen Americans had been killed at Hamid Karzai International Airport three days before the proposed strike.
  - id: F2
    kind: situation
    status: confirmed
    fact: The evacuation deadline was nearing.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Multiple terrorist threats were known as the evacuation deadline approached.
  - id: F4
    kind: capability
    status: confirmed
    fact: Ground intelligence was unavailable.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The strike cell believed it was facing an imminent threat to U.S. forces at Hamid Karzai International Airport.
  - id: F6
    kind: situation
    status: assessed
    fact: The strike cell was dealing with multiple threat streams at the same time.
  - id: F7
    kind: situation
    status: confirmed
    fact: Communication breakdowns occurred between the strike cell and supporting teams.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The strike cell believed an imminent threat to U.S. forces existed after a recent deadly attack, with further threats
      known, the deadline approaching, and no ground intelligence available. The inspector general considered the cell’s conclusion
      reasonable in light of the intelligence available at the time.
  - id: C2
    facts:
    - F5
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The review found that the strike was erroneous and killed civilians, including children. That grave harm weighs against
      proceeding on an assessment later found to have been affected by execution errors and confirmation bias.
  - id: C3
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Confirmation bias contributed to the cell’s assessment. A sincere belief in an imminent threat, especially amid multiple
      threat streams, did not by itself establish that the decision was sound.
  - id: C4
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The cell was handling multiple threat streams while communication with supporting teams had broken down. Those conditions
      weakened the basis for an irreversible decision to use force and support holding off.
  reasoning:
    read: The cell faced serious time pressure and believed U.S. forces faced an imminent threat, so proceeding had a genuine
      force-protection rationale. The trap was allowing urgency and that belief to substitute for a sufficiently reliable
      decision, when the review found confirmation bias and execution errors.
    weighing: The recent attack, known threats, and unavailable ground intelligence give substantial weight to protecting
      U.S. forces {C1}. But the review found civilian deaths and concluded that confirmation bias and execution errors contributed
      to the erroneous strike {C2} {C3}; concurrent threats and communication breakdowns further weaken the case for acting
      immediately {C4}. The Air Force inspector general found no violation of law, so the case for O1 is a judgment on the
      balance, not a claim that law categorically barred the strike. On the stipulated decision, the balance favors declining
      it.
    tradecraft: As a decision practice, pause rather than let urgency alone settle the question; record the assessed threat,
      the material uncertainty, and any unresolved communication gap. Do not treat a belief in imminence as conclusive merely
      because the circumstances are pressured.
    uncertainty: The cell lacked ground intelligence and was managing several threat streams; its belief that a threat was
      imminent was assessed, not established as fact. The later finding of errors does not mean the cell knowingly accepted
      civilian harm or that the law was violated.
    handoff: The strike cell should involve supporting teams when their information could materially clarify the decision,
      particularly given the communication breakdowns. If decision-relevant uncertainty remains unresolved, the recommended
      choice here is to decline rather than act.
    tempting_wrong:
      option: O2
      pull: A recent mass-casualty attack, further known threats, and a nearing deadline create a powerful reason to act to
        protect U.S. forces.
      why_wrong: Those pressures explain the cell’s belief but do not cure the confirmation bias and execution errors that
        the inspector general found contributed to an erroneous strike.
    rejected:
      O2: The strike is not chosen because the reviewing judgment gives greater weight to the identified decision errors and
        the civilian harm than to the pressured but mistaken threat assessment.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable, decision-relevant corroboration established an imminent threat and materially addressed the unresolved
        uncertainty.
      then: O2
      why: That would strengthen the force-protection rationale beyond the assessed belief described here and could change
        the balance.
    would_not_change:
    - id: noflip1
      if: The recent attack or the approaching deadline were the only circumstances that changed.
      why: Those pressures matter, but alone they would not resolve the weaknesses in the decision basis identified by the
        review.
    watch_for:
    - id: watch1
      what: Whether multiple threat streams and communication breakdowns leave material decision uncertainty unresolved.
      favors:
      - O1
      why: These conditions heighten the risk that urgency or confirmation bias will displace a sound decision.
  lesson: A sincere belief in an imminent threat and intense operational pressure can explain why a strike seems necessary,
    but they do not make an uncertain assessment reliable. When review identifies confirmation bias, decision errors, or unresolved
    communication problems, holding off may be the better judgment even if no legal violation is found.
  limits: This reasoning applies to a time-limited defensive strike in an urban setting, not as a general rule against strikes
    or a finding that the strike was unlawful. It does not necessarily extend to a typical over-the-horizon counterterrorism
    strike, where information is gathered over days.
  library:
    domain: military-operational
    family: CORPUS-NS-a7586584
    source: https://www.airandspaceforces.com/confirmation-bias-cited-in-erroneous-strike-that-killed-10-civilians-in-afghanistan/
    episode_focus: The decision point is whether to proceed with the strike or hold off, given the strike cell’s belief that
      it faced an imminent threat, the available intelligence, and the pressure of the evacuation period. Focus on the decision
      to use force and its stated rationale; exclude the operational details of identifying or tracking the vehicle and assessing
      the target.
    cues:
      option_words:
        O2: 7
        O1: 7
      real_option: O1
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: true
        O1: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The Air Force inspector general characterized the strike as regrettable and found that execution errors and confirmation
  bias contributed to it, while also finding no violation of law; those findings support holding off rather than proceeding.
