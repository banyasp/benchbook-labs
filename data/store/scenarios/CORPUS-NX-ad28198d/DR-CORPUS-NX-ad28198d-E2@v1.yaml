case:
  id: DR-CORPUS-NX-ad28198d-E2@v1
  title: Assigning Peacetime Psychological Operations
  status: draft
  setting: United States, November–December 1947, National Security Council
  decider: The National Security Council
  agent: The National Security Council
  agent_role: decide
  situation: The National Security Council was considering which agency should hold responsibility for peacetime psychological
    operations. The State Department had been considered for the mission, but its officials were concerned that the role could
    embarrass the Department and harm American diplomacy. The CIA had a worldwide network of operatives with experience in
    clandestine work. It also had unvouchered funds, so taking on the mission would not immediately require new congressional
    appropriations. The Director of Central Intelligence had misgivings about the CIA taking the role. The State Department
    and the military still wanted some degree of control over psychological operations.
  question: What should the National Security Council do about assigning responsibility for peacetime psychological operations?
  options:
    O1:
      do: The National Security Council assigns the peacetime psychological operations mission to the State Department.
      move: act
      irreversible: false
    O2:
      do: The National Security Council assigns the peacetime psychological operations mission to the CIA.
      move: act
      irreversible: false
    O3:
      do: The National Security Council rejects the CIA assignment and leaves the psychological operations mission unassigned.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In November 1947, the National Security Council considered assigning the peacetime psychological warfare mission
      to the State Department.
  - id: F2
    kind: situation
    status: assessed
    fact: The State Department's leadership considered that taking the role might embarrass the Department and harm American
      diplomacy.
  - id: F3
    kind: capability
    status: confirmed
    fact: The CIA had a worldwide network of operatives.
  - id: F4
    kind: capability
    status: confirmed
    fact: Many of the CIA's operatives were trained in clandestine work.
  - id: F5
    kind: capability
    status: confirmed
    fact: The CIA possessed unvouchered funds.
  - id: F6
    kind: capability
    status: confirmed
    fact: Using those funds meant there would be no immediate need to approach Congress for new appropriations.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Director of Central Intelligence had misgivings about the CIA undertaking the mission.
  - id: F8
    kind: situation
    status: confirmed
    fact: The State Department and the military wanted a degree of control over psychological operations.
  considerations:
  - id: C1
    facts:
    - F2
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The State Department leadership feared that taking the mission could embarrass the Department and harm American diplomacy,
      weighing against assigning it to State.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The CIA's worldwide network and operatives trained in clandestine work made it, in the NSC's judgment, a capable
      agency for the mission.
  - id: C3
    facts:
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: The CIA's unvouchered funds meant the mission would not immediately require new congressional appropriations.
  - id: C4
    facts:
    - F7
    - F8
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The DCI had misgivings, and State and the military wanted some degree of control. These concerns counted against
      placing responsibility solely with the CIA, although the options do not specify a shared-control arrangement.
  reasoning:
    read: 'The NSC faced both a diplomatic-fit concern and a practical assignment question: State feared the mission could
      harm American diplomacy, while the CIA already had clandestine capability and funds. The trap is treating either the
      DCI''s misgivings or other agencies'' desire for a degree of control as dispositive, rather than weighing them against
      the NSC''s stated reasons for choosing an agency.'
    weighing: 'The balance favored the CIA: State''s anticipated diplomatic embarrassment weighed against assigning the mission
      to State, and the CIA''s operative network, clandestine experience, and available unvouchered funds supported assigning
      it there. The DCI''s misgivings and the desire of State and the military for some control were counterweights, but NSC
      4-A assigned responsibility to the DCI, accountable to the NSC. The balance depended on the diplomatic concern about
      State and the CIA''s existing capacity and funding.'
    tradecraft: Record the assignment, its stated institutional rationale, and the line of accountability to the NSC. Keep
      this decision at the level of agency responsibility; do not use it to settle choices about targets or methods.
    uncertainty: The account gives the reasons for the assignment but does not establish its later effectiveness or resolve
      how State and the military's desired degree of control would work in practice.
    handoff: The NSC should make the agency assignment. It should take account of the DCI's misgivings and the views of State
      and the military, while retaining the NSC accountability line described for the decision.
    tempting_wrong:
      option: O1
      pull: State's concern that the mission could embarrass it and harm American diplomacy makes assigning the mission elsewhere
        attractive.
      why_wrong: That concern weighs against O1, and the CIA's existing clandestine capability and funds gave the NSC a stated
        practical basis for choosing O2.
    rejected:
      O1: The NSC did not assign the mission to State, whose leadership feared diplomatic harm, and instead judged the CIA
        the logical agency given its capabilities.
      O3: The NSC did not leave the mission unassigned; it determined that the CIA was the logical agency to conduct the operations.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The NSC concluded that State could undertake the mission without the feared diplomatic harm and had capability comparable
        to the CIA's.
      then: O1
      why: Those changed circumstances would weaken the stated reasons against assigning the mission to State and remove an
        important practical advantage of the CIA.
    - id: flip2
      if: The NSC concluded that no agency could responsibly take the mission under an acceptable accountability arrangement.
      then: O3
      why: If the institutional concerns could not be reconciled with assigning responsibility, leaving the mission unassigned
        could become preferable.
    would_not_change:
    - id: noflip1
      if: The DCI's misgivings remained the only additional concern, with the CIA's stated capabilities and funding unchanged.
      why: The source records the assignment as made over the DCI's misgivings, while the NSC's reasons for choosing the CIA
        remained in place.
    watch_for:
    - id: watch1
      what: Whether the desired degree of State and military control can be reconciled with the DCI's responsibility and accountability
        to the NSC.
      favors:
      - O1
      - O3
      why: If that institutional tension proves material, it could weaken the case for assigning responsibility to the CIA
        as described.
  lesson: Assign responsibility where the stated mission need and existing institutional capability best fit, while taking
    diplomatic and accountability concerns seriously. A concern that counts against one agency does not, by itself, establish
    that the mission should remain unassigned.
  limits: This reasoning concerns the 1947 agency assignment described here; it does not establish a general rule for later
    psychological operations or other agencies. It does not assess the legality or merits of particular targets, methods,
    or operations.
