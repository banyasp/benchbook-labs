case:
  id: DR-OHA-26-0052@v1
  title: Restoration of Access Authorization under Guideline G
  status: draft
  setting: DOE Office of Hearings and Appeals, July 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, holds a security clearance. In September 2025 he self‑reported an
    emergency‑room visit for alcohol‑related heart palpitations and sought treatment. A DOE psychologist diagnosed him with
    Alcohol Use Disorder, Moderate, and the Local Security Office raised a Guideline G security concern, issuing a Notification
    Letter that questioned his eligibility. The Individual subsequently completed a 12‑week outpatient treatment program,
    attended weekly therapy and Alcoholics Anonymous meetings, and provided monthly PEth test results showing negative results
    from October 2025 through June 2026, indicating nine months of sobriety. The DOE psychologist, after hearing testimony,
    revised the diagnosis to early remission and gave a very good prognosis, noting progress but that the 12‑month treatment
    benchmark had not yet been met. The Administrative Judge must determine whether the security concerns under Guideline G
    have been resolved and whether the Individual’s access authorization should be restored.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual holds a DOE access authorization as a contractor employee.
  - id: F2
    kind: situation
    status: confirmed
    fact: In September 2025 the Individual self‑reported seeking treatment after an emergency‑room visit for alcohol‑related
      heart palpitations.
  - id: F3
    kind: capability
    status: confirmed
    fact: A DOE psychologist diagnosed the Individual with Alcohol Use Disorder, Moderate, using DSM‑5‑TR criteria.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      under Guideline G.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed a 12‑week Regular Outpatient Program from September 25 2025 to December 31 2025 and has
      attended weekly after‑care therapy and AA meetings through June 2026.
  - id: F6
    kind: capability
    status: confirmed
    fact: Monthly PEth tests from September 2025 through June 2026 were negative except the September 2025 test (105 ng/mL),
      indicating nine months of sobriety.
  - id: F7
    kind: intelligence
    status: assessed
    fact: After hearing testimony, the DOE psychologist revised the diagnosis to AUD Moderate in early remission and gave
      a very good prognosis, noting progress but that the 12‑month treatment recommendation had not yet been met.
  considerations:
  - id: C1
    facts:
    - F4
    - F3
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Guideline G raises a security concern due to the Individual’s AUD diagnosis, but the regulations allow mitigation
      when evidence shows reduced risk.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Individual completed the 12‑week outpatient program, maintains weekly therapy and AA attendance, and has nine
      consecutive months of negative PEth tests, satisfying mitigating condition (c).
  - id: C3
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The DOE psychologist’s revised diagnosis to early remission and “very good” prognosis indicates the Individual’s
      current reliability and trustworthiness are no longer in doubt.
  - id: C4
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 10 C.F.R. § 710.7(a) requires the judge to determine whether granting access would endanger the common defense; the
      record shows it would not.
  - id: C5
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Mitigating condition (a) does not apply; mitigating condition (b) does not apply; mitigating condition (c) applies.
  reasoning:
    read: The case centers on whether the Individual’s past excessive alcohol use, which triggered Guideline G, has been sufficiently
      mitigated to permit restoration of his DOE access authorization.
    weighing: The Administrative Judge applied the Adjudicative Guidelines, finding that while the security concern exists,
      mitigating condition (c)—satisfactory progress in a treatment program—applies. The Judge noted the Individual’s nine‑month
      documented sobriety, completion of the ROP, and ongoing AA/therapy participation, and accepted the psychologist’s “very
      good” prognosis. Because condition (c) is met, the balance tips in favor of restoration despite the unmet 12‑month benchmark
      (condition (d) not required).
    tradecraft: The decision is recorded in the official OHA decision docket, the Individual’s clearance status is updated
      in the DOE personnel security system, and the LSO is instructed to reinstate the access authorization.
    uncertainty: The primary uncertainty is the future risk of relapse, especially around personal anniversaries noted by
      the psychologist, but the record shows sufficient current stability to meet the regulatory standard.
    handoff: The Administrative Judge decides alone, as permitted by 10 C.F.R. § 710.27(d); no further agency review is required
      unless an appeal is filed.
    tempting_wrong:
      option: O3
      pull: The presumption against granting clearances and the fact that the 12‑month treatment benchmark has not yet been
        met could tempt a denial.
      why_wrong: The source expressly states that mitigating condition (c) alone is sufficient; denying would ignore the established
        regulatory guidance.
    rejected:
      O1: Holding the decision pending additional evidence is unnecessary because the record already satisfies the required
        mitigating condition.
      O3: Denial is rejected because the Judge found that the Individual’s demonstrated progress resolves the Guideline G
        concern.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had not completed the 12‑week Regular Outpatient Program or had a positive PEth test after September 2025.
      then: O3
      why: Without satisfactory progress in a treatment program, mitigating condition (c) would not apply, leaving the Guideline G
        concern unresolved.
    - id: flip2
      if: The DOE psychologist had not revised the diagnosis to early remission and had given a poor prognosis.
      then: O3
      why: A continued diagnosis of active AUD without remission would sustain doubts about reliability and trustworthiness.
    would_not_change:
    - id: noflip1
      if: The Individual has not yet met the 12‑month treatment and abstinence benchmark (mitigating condition (d)).
      why: Mitigating condition (d) does not apply because the Individual has not yet completed a year of ROP and aftercare.
    watch_for:
    - id: watch1
      what: Any relapse or positive PEth test occurring after the decision date, especially around the anniversary of the
        brother’s death.
      favors:
      - O3
      why: A relapse would re‑activate the Guideline G concern and could justify revocation of the restored clearance.
  lesson: Under Guideline G, satisfactory progress in a documented treatment program (mitigating condition c) can resolve
    a security concern even when the full 12‑month abstinence benchmark has not yet been met. The adjudicator must weigh the
    totality of evidence—clinical opinions, objective test results, and ongoing support structures—to determine current reliability.
  limits: This reasoning applies only when the individual provides verifiable evidence of sustained sobriety and continued
    participation in treatment. It does not extend to cases lacking objective biomarkers, where relapse is documented, or
    where the psychologist’s assessment indicates ongoing impairment.
