case:
  id: DR-OHA-26-0052-revise1@v1
  title: Restoration of Access Authorization under Guideline G [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, July 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, holds a security clearance. In September 2025 he self‑reported an
    emergency‑room visit for alcohol‑related heart palpitations and sought treatment. A DOE psychologist diagnosed him with
    Alcohol Use Disorder, Moderate, and the Local Security Office raised a Guideline G security concern, issuing a Notification
    Letter that questioned his eligibility. The Individual subsequently completed a 12‑week outpatient treatment program,
    attended weekly therapy and Alcoholics Anonymous meetings, and provided monthly PEth test results showing negative results
    from October 2025 through June 2026, indicating nine months of sobriety. The DOE psychologist, after hearing testimony,
    revised the diagnosis to early remission and gave a very good prognosis, noting progress but that the 12‑month treatment
    benchmark had not yet been met. The Administrative Judge must determine whether the security concerns under Guideline G
    have been resolved and whether the Individual’s access authorization should be restored.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual holds a DOE access authorization as a contractor employee.
  - id: F2
    kind: situation
    status: confirmed
    fact: In September 2025 the Individual self‑reported seeking treatment after an emergency‑room visit for alcohol‑related
      heart palpitations.
  - id: F3
    kind: capability
    status: confirmed
    fact: A DOE psychologist diagnosed the Individual with Alcohol Use Disorder, Moderate, using DSM‑5‑TR criteria.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      under Guideline G.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed a 12‑week Regular Outpatient Program from September 25 2025 to December 31 2025 and has
      attended weekly after‑care therapy and AA meetings through June 2026.
  - id: F6
    kind: capability
    status: confirmed
    fact: Monthly PEth tests from September 2025 through June 2026 were negative except the September 2025 test (105 ng/mL),
      indicating nine months of sobriety.
  - id: F7
    kind: intelligence
    status: assessed
    fact: After hearing testimony, the DOE psychologist revised the diagnosis to AUD Moderate in early remission and gave
      a very good prognosis, noting progress but that the 12‑month treatment recommendation had not yet been met.
  considerations:
  - id: C1
    facts:
    - F4
    - F3
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Guideline G raises a security concern due to the Individual’s AUD diagnosis, but the regulations allow mitigation
      when evidence shows reduced risk.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Although the Individual completed the 12-week program and has nine months of negative PEth tests, the regulations
      require the 12-month treatment and abstinence benchmark (mitigating condition (d)) before condition (c) can justify
      restoration; without it, the security concern remains unresolved.
  - id: C3
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The DOE psychologist’s revised diagnosis to early remission and “very good” prognosis indicates the Individual’s
      current reliability and trustworthiness are no longer in doubt.
  - id: C4
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 10 C.F.R. § 710.7(a) requires the judge to determine whether granting access would endanger the common defense; the
      record shows it would not.
  - id: C5
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: Mitigating condition (a) (no criminal conduct) and (b) (no adverse adjudicative findings) are satisfied, but condition
      (c) alone is insufficient because condition (d) has not been met; thus the overall mitigation analysis leans toward
      denial.
  reasoning:
    read: The judge must decide whether the Individual's documented nine-month sobriety and early-remission diagnosis adequately
      mitigate the Guideline G security concern in the absence of the required 12-month benchmark.
    weighing: Guideline G permits restoration only when mitigating condition (c) is satisfied *and* the 12-month treatment/abstinence
      benchmark (condition (d)) is met. Because condition (d) is not satisfied, the balance of equities—national security
      versus individual rehabilitation—tips toward denial despite positive clinical indicators.
    tradecraft: The decision is entered into the OHA docket, the Individual's clearance remains suspended in the DOE personnel
      security system, and the LSO is instructed to maintain the denial pending any future evidence.
    uncertainty: Future relapse risk remains uncertain, especially given the Individual's recent personal stressors; without
      the 12-month benchmark, that risk cannot be deemed sufficiently mitigated.
    handoff: The Administrative Judge issues the final decision; the Individual may seek review under 10 C.F.R. 710.27(e)
      if desired.
    tempting_wrong:
      option: O2
      pull: The strong record of sobriety, negative PEth tests, and a favorable clinical prognosis can tempt a restoration.
      why_wrong: Regulatory guidance makes clear that without the 12-month benchmark, mitigating condition (c) cannot alone
        justify restoration; granting access would contravene the statutory duty to protect the common defense.
    rejected:
      O1: A pending decision is unnecessary because the record already demonstrates that the security concern is unresolved
        without the 12-month benchmark; waiting would only prolong uncertainty.
      O2: Restoration ignores the explicit requirement that condition (d) be satisfied, thereby undermining the integrity
        of the adjudicative process.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If the Individual had provided a continuous series of negative PEth tests covering a full 12‑month period and completed
        a year‑long after‑care program.
      then: O2
      why: Meeting both mitigating condition (c) and the 12‑month benchmark satisfies the regulatory standard for restoration.
    - id: flip2
      if: If the Individual had failed to provide any objective biomarker evidence of sobriety beyond the initial September 2025
        test.
      then: O1
      why: Lack of verifiable evidence would warrant holding the decision pending further investigation.
    would_not_change:
    - id: noflip1
      if: The Individual has not yet met the 12-month treatment and abstinence benchmark (mitigating condition (d)).
      why: Mitigating condition (d) does not apply because the Individual has not yet completed a year of ROP and aftercare.
    watch_for:
    - id: watch1
      what: Any relapse or positive PEth test occurring after the decision date, especially around the anniversary of the
        brother's death.
      favors:
      - O3
      why: A relapse would re-activate the Guideline G concern and could justify revocation of the restored clearance.
  lesson: Under Guideline G, satisfying mitigating condition (c) is insufficient without also meeting the 12-month treatment
    and abstinence benchmark; the adjudicator must ensure both are satisfied before restoring access.
  limits: This analysis applies only when the individual cannot demonstrate the full 12-month period of documented sobriety;
    cases with complete biomarker evidence and sustained after-care may be treated differently.
