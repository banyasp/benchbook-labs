case:
  id: DR-OHA-26-0052-restyle1@v1
  title: Restoration of Access Authorization under Guideline G [restyle]
  status: needs_review
  setting: Federal Energy Security Review Office, July 2026
  decider: Senior Adjudicator
  agent: Senior Adjudicator
  agent_role: decide
  situation: The Contractor, a DOE subcontractor employee with a security clearance, reported in September 2025 that he had
    visited an emergency department for heart palpitations linked to alcohol use and subsequently entered treatment. A DOE
    psychologist diagnosed him with Alcohol Use Disorder, Moderate, and the Local Security Office issued a Notification Letter
    questioning his eligibility under Guideline G. The Contractor completed a 12-week outpatient program, has attended weekly
    therapy and Alcoholics Anonymous meetings, and submitted monthly PEth test results that were negative from October 2025
    through June 2026, evidencing nine months of sobriety. After hearing testimony, the DOE psychologist revised the diagnosis
    to early remission and offered a very good prognosis, noting progress but that the 12-month treatment benchmark remains
    unmet. The Senior Adjudicator must decide whether the Guideline G concerns are resolved and whether the Contractor's clearance
    should be reinstated.
  question: What action should the Senior Adjudicator take concerning the Contractor's clearance under Guideline G?
  options:
    O1:
      do: Defer the decision pending further documentation.
      move: hold
      irreversible: false
    O2:
      do: Restore the Contractor's security clearance now.
      move: act
      irreversible: true
    O3:
      do: Deny the Contractor's security clearance request.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Contractor possesses a DOE security clearance as a subcontractor employee.
  - id: F2
    kind: situation
    status: confirmed
    fact: In September 2025 the Contractor voluntarily disclosed that he sought care after an emergency-room visit for alcohol-related
      heart palpitations.
  - id: F3
    kind: capability
    status: confirmed
    fact: A DOE psychologist applied DSM-5-TR criteria and diagnosed the Contractor with Alcohol Use Disorder, Moderate.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office sent a Notification Letter expressing substantial doubt about the Contractor's eligibility
      under Guideline G.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Contractor finished a 12-week Regular Outpatient Program from 25 September 2025 to 31 December 2025 and has
      continued weekly after-care therapy and AA meetings through June 2026.
  - id: F6
    kind: capability
    status: confirmed
    fact: Monthly PEth screenings from September 2025 through June 2026 were negative except for the September 2025 sample
      (105 ng/mL), indicating nine consecutive months of sobriety.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Following testimony, the DOE psychologist updated the diagnosis to AUD Moderate in early remission and issued a
      very good prognosis, noting progress but that the 12-month treatment recommendation has not yet been satisfied.
  considerations:
  - id: C1
    facts:
    - F4
    - F3
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Guideline G flags a security issue because of the AUD diagnosis, yet the regulations permit mitigation when the record
      shows a lowered risk.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Contractor finished the 12-week outpatient regimen, continues weekly counseling and AA participation, and has
      recorded nine successive months of negative PEth results, thereby meeting mitigating condition (c).
  - id: C3
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The psychologist's updated assessment of early remission together with a "very good" outlook suggests the individual's
      present reliability and trustworthiness are no longer questionable.
  - id: C4
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 10 C.F.R. § 710.7(a) obliges the adjudicator to assess whether granting access would jeopardize the common defense;
      the evidence indicates it would not.
  - id: C5
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Mitigating condition (a) is inapplicable; condition (b) does not fit; condition (c) is satisfied.
  reasoning:
    read: The issue before the adjudicator is whether the contractor's prior excessive alcohol consumption, which triggered
      Guideline G, has been sufficiently mitigated to allow restoration of his DOE clearance.
    weighing: Applying the Adjudicative Guidelines, the adjudicator concluded that while a security concern persists, mitigating
      condition (c)—demonstrated progress in a treatment program—applies. The record shows nine months of documented sobriety,
      completion of the Regular Outpatient Program, and ongoing AA/therapy participation, and the psychologist's "very good"
      prognosis was accepted. Because condition (c) is satisfied, the balance favors reinstatement despite the unmet 12-month
      benchmark (condition (d) is not required).
    tradecraft: The decision is entered into the official OHA docket, the Contractor's clearance status is updated in the
      DOE personnel security database, and the Local Security Office is directed to restore the clearance.
    uncertainty: The chief uncertainty concerns the potential for future relapse, especially around personal anniversaries
      noted by the psychologist, yet the current record meets the regulatory threshold for stability.
    handoff: The Senior Adjudicator decides unilaterally, as authorized by 10 C.F.R. § 710.27(d); no further agency review
      is mandated unless an appeal is filed.
    tempting_wrong:
      option: O3
      pull: The default presumption against clearance and the unmet 12-month treatment requirement could lure the adjudicator
        toward denial.
      why_wrong: Regulatory guidance explicitly permits mitigation on the basis of condition (c) alone; a denial would disregard
        that provision.
    rejected:
      O1: Deferring the decision is unnecessary because the record already fulfills the required mitigating condition.
      O3: Denial is rejected because the adjudicator concluded that the Contractor's demonstrated progress resolves the Guideline
        G concern.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Contractor had failed to complete the 12-week outpatient program or had produced a positive PEth result after
        September 2025.
      then: O3
      why: Absent documented progress in treatment, mitigating condition (c) would not be satisfied, leaving the Guideline
        G issue unresolved.
    - id: flip2
      if: The DOE psychologist had left the diagnosis as active AUD and issued an unfavorable prognosis.
      then: O3
      why: A continuing diagnosis of active disorder would sustain doubts about reliability and trustworthiness.
    would_not_change:
    - id: noflip1
      if: The Contractor has not yet satisfied the 12-month treatment and abstinence benchmark (mitigating condition (d)).
      why: Condition (d) is not triggered because the year-long ROP and after-care requirement remain unmet.
    watch_for:
    - id: watch1
      what: Any relapse or a positive PEth finding occurring after the ruling date, particularly around the anniversary of
        the brother's death.
      favors:
      - O3
      why: A relapse would reactivate the Guideline G concern and could justify revoking the reinstated clearance.
  lesson: Guideline G permits a security concern to be cleared when the individual shows satisfactory progress in a documented
    treatment program (mitigating condition c), even if the full 12-month abstinence benchmark has not yet been reached. The
    adjudicator must evaluate the totality of evidence—including clinical opinions, objective biomarkers, and ongoing support
    mechanisms—to assess current reliability.
  limits: This analysis applies only when the individual supplies verifiable proof of continued sobriety and active participation
    in treatment. It does not extend to cases lacking objective biomarker data, where relapse is documented, or where the
    psychologist's assessment indicates persistent impairment.
