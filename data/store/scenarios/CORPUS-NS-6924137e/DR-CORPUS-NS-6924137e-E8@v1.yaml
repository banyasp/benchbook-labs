case:
  id: DR-CORPUS-NS-6924137e-E8@v1
  title: Aircraft Beside the Temple of Ur
  status: draft
  setting: Iraq, at the ancient temple of Ur, during Coalition operations.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: Two Iraqi fighter aircraft are positioned next to the ancient temple of Ur, which is cultural property. The positioning
    appears intended to rely on Coalition respect for cultural-property protections to prevent an attack. The law of war allows
    attacks on the fighters and holds Iraq responsible for damage to the cultural site. There is no nearby runway, leaving
    the aircraft effectively out of service and limiting the value of destroying them. An attack could damage the temple and
    put attackers at risk. The Commander must choose whether to attack the aircraft or refrain.
  question: What should the Commander do about the Iraqi fighter aircraft positioned next to the ancient temple of Ur?
  options:
    O1:
      do: The Commander should attack the Iraqi fighter aircraft positioned beside the temple.
      move: act
      irreversible: true
    O2:
      do: The Commander should spare the Iraqi fighter aircraft positioned beside the temple.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two Iraqi fighter aircraft were positioned next to the ancient temple of Ur.
  - id: F2
    kind: situation
    status: confirmed
    fact: The temple was cultural property protected by Coalition respect for cultural-property protections.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The aircraft were positioned there in reliance on Coalition respect for cultural-property protections to prevent
      an attack.
  - id: F4
    kind: authority
    status: confirmed
    fact: The law of war allowed attacks on the fighters and held Iraq responsible for damage to the cultural site.
  - id: F5
    kind: situation
    status: confirmed
    fact: There was no nearby runway.
  - id: F6
    kind: capability
    status: assessed
    fact: The lack of a nearby runway effectively removed the aircraft from service.
  - id: F7
    kind: situation
    status: assessed
    fact: The limited military value of destroying the aircraft was weighed against the risks of damage to the temple and
      harm to attackers.
  - id: F8
    kind: situation
    status: assessed
    fact: An attack risked damage to the temple.
  - id: F9
    kind: situation
    status: assessed
    fact: An attack posed a risk to attackers.
  considerations:
  - id: C1
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The law of war allowed an attack on the fighters and placed responsibility for cultural-site damage on Iraq; this
      made an attack legally available, but did not require one.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: With no nearby runway, the aircraft were effectively out of service, limiting the military value of destroying them.
  - id: C3
    facts:
    - F2
    - F8
    equity: protected_sites
    favors:
    - O2
    weight: strong
    why: An attack risked damage to the ancient temple, a cultural site.
  - id: C4
    facts:
    - F9
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: An attack also exposed the attackers to risk.
  reasoning:
    read: 'The aircraft were positioned beside cultural property in apparent reliance on Coalition respect for its protection
      {F2} {F3}. That tactic did not make an attack legally unavailable: the law of war allowed attacks on the fighters and
      held Iraq responsible for damage to the site {F4}. The decision was therefore not resolved by the tactic alone.'
    weighing: The Commander chose not to attack because the lack of a nearby runway effectively removed the aircraft from
      service, limiting the value of their destruction {C2}. That limited value was weighed against the risk to the temple
      and the risk to attackers {C3} {C4}; the legal permission to attack did not outweigh that balance {C1}. The balance
      depends on the aircraft's military value and the risks of attack.
    tradecraft: Keep the decision focused on the aircraft's actual military value and the identified risks to the cultural
      site and attackers. Record the legal basis for treating an attack as permissible and the reasons the Commander nevertheless
      refrained.
    uncertainty: The passage gives no quantified estimate of military value or of the risks; the decision rests on the stated
      assessment that the aircraft were effectively out of service and that attack carried the identified risks.
    handoff: The Commander made the decision. The passage identifies no required referral or separate approval, so it gives
      no basis to add one.
    tempting_wrong:
      option: O1
      pull: The law allowed an attack, and the aircraft's placement appears to have exploited Coalition respect for cultural
        property.
      why_wrong: Legal permission did not make an attack necessary or require it; the Commander judged the aircraft's limited
        value insufficient to justify the risks.
    rejected:
      O1: The Commander did not attack because the aircraft's limited value, weighed against the risks to the temple and attackers,
        did not justify their destruction.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A nearby runway made the aircraft serviceable and materially increased the military value of destroying them.
      then: O1
      why: The source's reason for sparing the aircraft was their limited value relative to the risks; a materially greater
        military value could change that balance.
    - id: flip2
      if: The risks to the temple and attackers were absent while the aircraft had meaningful military value.
      then: O1
      why: Removing the stated risks while increasing the value of destruction would remove the balance that supported refraining.
    would_not_change:
    - id: noflip1
      if: The only additional information were confirmation that Iraq positioned the aircraft in reliance on Coalition respect
        for cultural-property protections, with the stated military value and risks unchanged.
      why: That tactic does not itself change the aircraft's limited value or the risks that drove the Commander's choice.
    watch_for:
    - id: watch1
      what: Updated information about whether the aircraft are effectively out of service and the military value of destroying
        them.
      favors:
      - O1
      why: A change in assessed military value could alter the balance against the stated risks.
  lesson: Legal permission to attack does not by itself settle whether an attack is warranted. Weigh the military value of
    the target against the risks to protected cultural property and to one's own personnel.
  limits: 'This reasoning concerns the stated circumstances: the law allowed an attack, the aircraft were effectively out
    of service because there was no nearby runway, and an attack risked damage to the temple and harm to attackers. It does
    not determine what to do if those legal or operational assessments change.'
  library:
    domain: military-operational
    family: CORPUS-NS-6924137e
    source: https://apps.dtic.mil/sti/pdfs/ADA391809.pdf
    episode_focus: The commander could attack the aircraft or refrain; the passage says the commander declined because the
      aircraft had little military value without a nearby runway and destruction risked damage to the temple and danger to
      attackers. Focus on the legal and proportionality judgment; exclude attack techniques.
