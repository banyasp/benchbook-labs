case:
  id: DR-CORPUS-NS-6924137e-E9@v1
  title: Hydroelectric Plant Authorization Decision
  status: draft
  setting: North Vietnam during the Linebacker I air offensive; U.S. presidential decision.
  decider: The President
  agent: The President
  agent_role: decide
  situation: During the Linebacker I air offensive, intelligence officers identified the Lang Chi hydroelectric plant as a
    target. The plant supplied most of Hanoi’s industrial and defense electricity and was considered valuable for disrupting
    electricity to military forces. It was co-located with a dam that supplied water to the plant’s turbines. Analysts estimated
    that as many as 23,000 civilians might die if collateral damage caused the dam to fail. The military presented the President
    with a proportionality question, and the President required complete assurance that the plant could be destroyed without
    the dam being breached. The commander said complete assurance was not possible and assessed a 90 percent chance of success
    without breaching the dam.
  question: What should the President do about authorizing the attack on the hydroelectric plant?
  options:
    O1:
      do: The President declines to authorize the attack on the hydroelectric plant.
      move: act
      irreversible: false
    O2:
      do: The President authorizes the attack on the hydroelectric plant.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Intelligence officers identified the Lang Chi hydroelectric plant during the Linebacker I air offensive against
      North Vietnam.
  - id: F2
    kind: situation
    status: confirmed
    fact: The plant supplied 75 percent of Hanoi’s industrial and defense electricity.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The plant was considered a valuable target for its connection to electricity used by military forces.
  - id: F4
    kind: situation
    status: confirmed
    fact: The plant was co-located with a dam that supplied water to its turbines.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Analysts estimated that as many as 23,000 civilians might die if collateral damage caused the dam to fail.
  - id: F6
    kind: situation
    status: confirmed
    fact: The military presented the President with a proportionality question weighing military benefit against civilian
      harm.
  - id: F7
    kind: authority
    status: confirmed
    fact: Before authorizing the attack, the President required complete assurance that the plant could be destroyed without
      breaching the dam.
  - id: F8
    kind: capability
    status: assessed
    fact: The commander could not give complete assurance and assessed a 90 percent chance of success without breaching the
      dam.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The plant supplied 75 percent of Hanoi’s industrial and defense electricity and was considered valuable for disrupting
      electricity used by military forces.
  - id: C2
    facts:
    - F4
    - F5
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Because the plant was co-located with the dam, collateral damage causing the dam to fail could kill as many as 23,000
      civilians.
  - id: C3
    facts:
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The President required complete assurance that the plant could be destroyed without breaching the dam, reflecting
      the gravity of the civilian risk.
  - id: C4
    facts:
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: Although complete assurance was unavailable, the commander assessed a 90 percent chance of success without breaching
      the dam; this reduced, but did not eliminate, the risk.
  reasoning:
    read: 'This was a proportionality decision: disrupting electricity used by military forces had military value, but a dam
      failure could cause catastrophic civilian loss. The central difficulty was that the President''s stated requirement
      was complete assurance, while the commander could offer only 90 percent confidence.'
    weighing: The military value favored authorization, while the potential civilian deaths and the unmet assurance requirement
      weighed against it. The President authorized the attack despite the remaining uncertainty. The source gives the 90 percent
      assessment and the outcome, but does not explain why that degree of confidence was sufficient.
    tradecraft: 'Keep the decision at the authorization level: record the military value, the estimated civilian consequences,
      the assurance requested, the confidence actually offered, and the President''s decision. Do not treat the requested
      assurance as having been achieved.'
    uncertainty: The dam's failure and resulting civilian deaths were described as a risk, not a certainty. The commander
      could not give complete assurance, and the source does not state why the President accepted less than the assurance
      he had required.
    handoff: The military presented the proportionality question and the commander's assessment; the President made the authorization
      decision. The source does not identify any further decision-maker or review.
    tempting_wrong:
      option: O1
      pull: Declining authorization is compelling because the President had required complete assurance and the possible civilian
        loss was severe.
      why_wrong: It would treat the stated assurance requirement as an absolute bar, whereas the source's recorded outcome
        is authorization after the commander reported 90 percent confidence.
    rejected:
      O1: The President did not decline; he authorized the attack after receiving the commander's 90 percent confidence assessment.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander's confidence that the dam would remain intact were materially lower than the reported 90 percent,
        with no other change in the military value or civilian-risk assessment.
      then: O1
      why: A lower prospect of avoiding dam failure would increase the already grave civilian risk and could outweigh the
        military value; this is an analytical counterfactual, not a condition stated by the source.
    would_not_change:
    - id: noflip1
      if: The commander could provide the complete assurance the President had requested while the other stated circumstances
        remained the same.
      why: That would satisfy rather than frustrate the President's stated assurance requirement, so it would not provide
        a reason to change the recorded authorization outcome.
    watch_for:
    - id: watch1
      what: Any change in the assessed likelihood that the dam would fail or in the estimated civilian consequences of failure.
      favors:
      - O1
      why: Either could alter the civilian-risk side of the proportionality judgment.
  lesson: Compare the military value of an attack with its foreseeable civilian harm, and distinguish a requested level of
    assurance from the confidence actually available. When the decision-maker proceeds despite an unmet assurance requirement,
    preserve that gap in the record rather than implying the risk was eliminated.
  limits: This reasoning applies to the source's account of this authorization decision, not to a legal finding that the attack
    was lawful or unlawful. The source does not provide a broader legal test, the President's explanation for accepting 90
    percent confidence, or later findings about the attack.
