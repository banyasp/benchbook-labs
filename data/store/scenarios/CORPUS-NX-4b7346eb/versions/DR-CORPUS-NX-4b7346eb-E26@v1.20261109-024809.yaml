case:
  id: DR-CORPUS-NX-4b7346eb-E26@v1
  title: Attack Decision in Low Visibility
  status: draft
  setting: At dawn, at sea, during a naval engagement; naval command.
  decider: The commander
  agent: The commander
  agent_role: decide
  situation: The decision point arose at dawn in a naval engagement at sea. Visibility was low, and an attack had already
    been postponed. The commander intended to close and look for the enemy; the enemy was in contact, had been lost in a rain
    squall, and had opened fire. The commander faced difficulty identifying own ships in the low visibility. The commander
    had to choose whether to proceed with or cancel the attack.
  question: 'What should the commander do about the planned attack: approve it or reject it?'
  options:
    O1:
      do: The commander rejects the planned attack.
      move: act
      irreversible: false
    O2:
      do: The commander approves the planned attack.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Visibility was low at 0620.
  - id: F2
    kind: situation
    status: confirmed
    fact: The attack was postponed at 0620.
  - id: F3
    kind: situation
    status: confirmed
    fact: At dawn, the commander intended to close and look for the enemy.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The commander was in contact with the enemy.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The enemy was lost in a rain squall.
  - id: F6
    kind: situation
    status: confirmed
    fact: The enemy had opened fire.
  - id: F7
    kind: situation
    status: assessed
    fact: The commander faced difficulty identifying own ships in low visibility.
  considerations:
  - id: C1
    facts:
    - F1
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Low visibility was the stated condition behind postponing the attack, and it remained relevant at the decision point.
  - id: C2
    facts:
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The commander faced difficulty identifying own ships in low visibility; the commander gave this as the reason for
      canceling the attack.
  - id: C3
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The attack had already been postponed because of low visibility, reinforcing that the visibility concern had not
      been resolved.
  reasoning:
    read: 'The commander was in contact with an enemy that had opened fire, but the decision was not simply whether to respond
      quickly: low visibility made it difficult to identify own ships. The trap is to let the urgency of enemy action stand
      in for resolving that identification problem.'
    weighing: The commander canceled because own ships were difficult to identify in low visibility. That concrete concern,
      also present when the attack was postponed earlier, supports {O1}; enemy contact and fire create pressure to proceed
      but do not establish that the identification difficulty has cleared. The balance would depend on whether that difficulty
      was actually resolved.
    tradecraft: Keep the decision and its stated basis in the record. Reconsider proceeding only if the identification difficulty
      is resolved; do not treat urgency alone as evidence that it is.
    uncertainty: The source gives the cancellation reason but does not specify how long the identification difficulty would
      last or what would demonstrate that it had cleared.
    handoff: The commander made the engagement decision. The source identifies no required additional approval or consultation.
    tempting_wrong:
      option: O2
      pull: The enemy was in contact and had opened fire, creating pressure to proceed.
      why_wrong: That pressure does not address the stated difficulty identifying own ships in low visibility, which was the
        commander's reason for canceling.
    rejected:
      O2: The commander did not approve the attack because own ships were difficult to identify in low visibility.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The difficulty identifying own ships in low visibility were resolved.
      then: O2
      why: That would remove the stated reason for cancellation, though the source does not say it would automatically require
        proceeding.
    would_not_change:
    - id: noflip1
      if: The enemy remained in contact and had opened fire, while the own-ship identification difficulty remained.
      why: Enemy pressure alone would not remove the commander's stated reason for canceling.
    watch_for:
    - id: watch1
      what: Whether the difficulty identifying own ships in low visibility has cleared.
      favors:
      - O1
      why: The commander identified that difficulty as the reason for canceling.
  lesson: When low visibility makes it difficult to identify own ships, do not let pressure to act substitute for resolving
    that uncertainty. Reassess the decision if the stated identification difficulty clears.
  limits: This reasoning addresses only the engagement decision under the stated visibility and identification conditions.
    It does not establish a general rule for other engagements or specify a legal threshold.
  library:
    domain: military-operational
    family: CORPUS-NX-4b7346eb
    source: https://digital-commons.usnwc.edu/cgi/viewcontent.cgi?article=1004&context=usnwc-historical-monographs
    episode_focus: The concrete choice was to proceed with or cancel the attack; the stated reason was the risk created by
      difficulty identifying own ships in low visibility. Keep the scenario at the level of the engagement decision, and exclude
      any account of attack methods or other operational details.
