case:
  id: DR-CORPUS-NX-4b7346eb-E23@v1
  title: 'Prince of Wales: Continue or Disengage'
  status: draft
  setting: Aboard Prince of Wales, at sea, at 0602:30 during the engagement.
  decider: The commanding officer of Prince of Wales
  agent: The commanding officer of Prince of Wales
  agent_role: decide
  situation: At 0553, an engagement involving Prince of Wales and Bismarck was underway. At 0600, Hood sank following an explosion,
    and only three survivors were recovered. Bismarck then shifted its engagement to Prince of Wales, where an explosion occurred.
    At 0602:30, the bridge was hit and casualties were heavy, although the captain was unhurt. Only three of the ship's ten
    main guns were in action.
  question: What should the commanding officer of Prince of Wales do about the ongoing engagement?
  options:
    O1:
      do: The commanding officer continues engaging the opposing ship and maintains the ship.
      move: act
      irreversible: false
    O2:
      do: The commanding officer disengages from the opposing ship and consolidates the ship.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The engagement involving Prince of Wales and Bismarck was underway by 0553.
  - id: F2
    kind: situation
    status: confirmed
    fact: Hood sank at 0600, within three to four minutes of an explosion.
  - id: F3
    kind: situation
    status: confirmed
    fact: Only three survivors were recovered from Hood.
  - id: F4
    kind: situation
    status: confirmed
    fact: After Hood sank, Bismarck shifted its engagement to Prince of Wales.
  - id: F5
    kind: situation
    status: confirmed
    fact: A violent explosion occurred aboard Prince of Wales.
  - id: F6
    kind: situation
    status: confirmed
    fact: At 0602:30, the bridge of Prince of Wales was hit, casualties were heavy, and the captain was unhurt.
  - id: F7
    kind: capability
    status: confirmed
    fact: Only three of Prince of Wales's ten main guns were in action.
  considerations:
  - id: C1
    facts:
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Heavy casualties after the bridge was hit made protecting the ship's personnel a substantial reason to break off.
  - id: C2
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: With only three of ten main guns in action, the ship's capacity to continue the engagement was materially reduced.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: The explosion, bridge hit, casualties, and reduced capability supported the commanding officer's stated decision
      to consolidate the ship.
  reasoning:
    read: The commanding officer faced an ongoing engagement while Prince of Wales had suffered an explosion, a bridge hit,
      heavy casualties, and sharply reduced main-gun availability. The trap is to treat continuation as the default simply
      because the engagement was already underway, rather than respond to the ship's changed condition.
    weighing: 'The stated reasons favor breaking off: casualties were heavy, and only three of ten main guns were in action
      {C1} {C2}. The ship''s damage and reduced capability also support consolidation {C3}. The balance depends on the serious
      condition of Prince of Wales at that moment; the source gives no separate reason to continue despite it.'
    tradecraft: Record the decision and its stated grounds, including the ship's condition, casualties, and available capability.
      Reassess whether those conditions have materially changed before treating the decision as a basis for any later action.
    uncertainty: The source gives the immediate damage, casualty, and capability picture but does not detail the full extent
      of damage or what alternatives were considered beyond continuing or breaking off.
    handoff: The commanding officer made the decision. No referral or consultation with a higher authority is identified;
      the immediate ship-condition judgment was made at the command level.
    tempting_wrong:
      option: O1
      pull: The engagement was already underway, and the opposing ship remained engaged.
      why_wrong: 'That does not outweigh the stated reasons for breaking off: heavy casualties and only three of ten main
        guns in action.'
    rejected:
      O1: The commanding officer did not continue the engagement because the ship's casualties and reduced capability led
        him to break off and consolidate.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Casualties were no longer heavy and the ship's main-gun capability had substantially recovered at the decision point.
      then: O1
      why: Those changes would remove the principal stated reasons for breaking off and could support continuing the engagement.
    would_not_change:
    - id: noflip1
      if: More survivors had been recovered from Hood, while Prince of Wales remained in the same condition.
      why: The stated basis for the commanding officer's decision was Prince of Wales's own casualties and reduced capability.
    watch_for:
    - id: watch1
      what: Whether Prince of Wales's casualties and operational capability materially change.
      favors:
      - O2
      why: These were the stated conditions supporting the decision to break off and consolidate.
  lesson: When a ship has suffered heavy casualties and its operational capability is substantially reduced, the decision-maker
    should reassess whether continuing remains justified rather than defaulting to the ongoing engagement. The source's decision
    favored breaking off and consolidating in light of those conditions.
  limits: This reasoning addresses the commanding officer's decision at the stated moment and rests on the reported casualties
    and capability. It does not establish a general rule for other engagements or conditions.
