case:
  id: DR-OGE-2635-303-restyle1@v1
  title: Farewell Lunch Acceptance Decision [restyle]
  status: needs_review
  setting: International Development Agency, Headquarters, Washington, DC, present day
  decider: the division chief
  agent: Ethics Advisory System
  agent_role: decide
  situation: A division chief of the International Development Agency is being reassigned from Washington, DC, to an overseas
    post. Twelve team members have organized a farewell luncheon for the chief. Each participant will pay for their own meal
    and will split the cost of the chief's portion equally among the group. Participation is understood to be voluntary, with
    no pressure on any employee to contribute. The chief must evaluate whether accepting the employee-funded luncheon complies
    with agency ethics standards. The decision hinges on the definitions of senior official, voluntary contribution, and permissible
    gift in agency policy.
  question: What action should the Ethics Advisory System recommend concerning the division chief's acceptance of the employee-funded
    luncheon?
  options:
    O1:
      do: The Ethics Advisory System requests clarification from the agency's ethics office regarding the luncheon.
      move: ask
      irreversible: false
      to: agency ethics office
    O2:
      do: The Ethics Advisory System advises the division chief to decline the employee-funded luncheon.
      move: act
      irreversible: false
    O3:
      do: The Ethics Advisory System defers the decision until additional agency guidance is received.
      move: hold
      irreversible: false
    O4:
      do: The Ethics Advisory System authorizes the division chief to accept the employee-funded luncheon.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A senior official is defined as any staff member who has authority to direct or assess the work of subordinate personnel.
  - id: F2
    kind: situation
    status: confirmed
    fact: A voluntary contribution means a gift offered of the contributor's own accord, without any duress, and in an amount
      set by the contributor themselves.
  - id: F3
    kind: situation
    status: confirmed
    fact: Twelve team members are escorting their manager to a send-off luncheon and will split the expense of the manager's
      portion evenly among the group.
  - id: F4
    kind: situation
    status: confirmed
    fact: The manager is slated for a reassignment from Washington, DC, to an overseas posting.
  - id: F5
    kind: situation
    status: confirmed
    fact: Each participant will pay for their own meal, and the manager's meal cost will be shared equally among the participants.
  - id: F6
    kind: situation
    status: confirmed
    fact: Under agency policy, the payment toward the manager's meal qualifies as a voluntary contribution.
  - id: F7
    kind: situation
    status: confirmed
    fact: The manager is an employee of the International Development Agency.
  - id: F8
    kind: authority
    status: assessed
    fact: The manager has tasked the Ethics Advisory System with determining whether to accept the luncheon.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The policy states that a voluntary contribution must be offered freely, without coercion, and in an amount chosen
      by the donor; the team's collective payment for the manager's portion satisfies that criterion.
  - id: C2
    facts:
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: A gift is allowable when it reflects market price; each participant pays for their own dish and contributes an equal
      share toward the manager's portion, which the rule classifies as a market-value transaction.
  - id: C3
    facts:
    - F1
    equity: duty_to_individual
    favors:
    - O4
    weight: weak
    why: Holding the position of senior official does not, by itself, prohibit receipt of a voluntary contribution that does
      not constitute a forbidden gift.
  - id: C4
    facts: []
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Regulation Example 1 to paragraph (f) explicitly notes that contributions from participants in a farewell luncheon
      are voluntary, thus permitting acceptance.
  reasoning:
    read: The manager is presented with a send-off luncheon financed by twelve team members. The pitfall is to view the pooled
      payment as an illicit gift, yet the regulation specifically describes such employee-determined, shared payments as voluntary
      contributions rather than prohibited gifts.
    weighing: Applying C1 and C2, the contribution fulfills both the voluntary-contribution and market-value standards, which
      the regulation deems permissible. C3 reinforces that the manager's rank does not introduce an additional ban. C4 supplies
      the direct regulatory endorsement, swinging the balance firmly toward allowing the luncheon.
    tradecraft: Document the manager's acceptance in the agency's ethics register, indicating that the contribution was voluntary
      and that each team member contributed an equal share. No additional approval is necessary.
    uncertainty: Low – the policy provides a direct answer to this circumstance.
    handoff: The Ethics Advisory System can render the decision independently; escalation to the ethics office is unnecessary
      given the clarity of the rule.
    tempting_wrong:
      option: O2
      pull: A prudent impulse to block any advantage from subordinates might result in an unwarranted ban.
      why_wrong: The regulation's example confirms that voluntary, market-value contributions are permissible, so forbidding
        them would contradict agency policy.
    rejected:
      O1: Seeking clarification is superfluous since the policy already offers a definitive answer.
      O2: Denying the luncheon would disregard the explicit example that allows voluntary contributions.
      O3: Deferring the decision introduces delay despite the absence of regulatory uncertainty.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the payment toward the manager's meal were not voluntary (for instance, if it were coerced or a fixed amount was
        imposed)
      then: O2
      why: A non-voluntary payment would constitute a prohibited gift under the agency's gift regulations.
    would_not_change:
    - id: noflip1
      if: the manager is being reassigned to an overseas post
      why: The reassignment does not alter the analysis of the voluntary contribution.
    watch_for:
    - id: watch1
      what: any sign of pressure, coercion, or a predetermined contribution amount imposed on the team members
      favors:
      - O2
      why: Such conditions would transform the payment into a non-voluntary gift.
  lesson: When team members voluntarily pool the expense of a senior official's meal, the payment is regarded as a market-value
    gift and is allowed under agency ethics regulations. The decisive test is whether the contribution is genuinely voluntary
    and set by the employees.
  limits: This analysis does not apply if the payment is coerced, if a fixed amount is mandated, or if the value surpasses
    market price. It also excludes gifts unrelated to a shared event (such as cash gifts outside a meal).
