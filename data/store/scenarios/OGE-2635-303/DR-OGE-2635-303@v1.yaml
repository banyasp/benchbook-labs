case:
  id: DR-OGE-2635-303@v1
  title: Farewell Lunch Acceptance Decision
  status: draft
  setting: Agency for International Development, Washington, DC, present
  decider: the supervisor
  agent: Ethics Assistant AI
  agent_role: decide
  situation: A supervisory employee of the Agency for International Development is being reassigned from Washington, DC, to
    a foreign duty location. Twelve subordinates have organized a farewell lunch at a restaurant for the supervisor. The subordinates
    will each pay for their own meals and will divide the cost of the supervisor's meal equally among the twelve participants.
    The arrangement is understood to be voluntary, with no pressure on any employee to contribute. The supervisor, as an official
    superior, must consider whether accepting the paid-for lunch complies with ethics regulations. The decision rests on the
    definitions of official superior, voluntary contribution, and gift in the agency's standards.
  question: What should the Ethics Assistant AI do regarding the supervisor's acceptance of the paid-for lunch?
  options:
    O1:
      do: The Ethics Assistant AI asks the agency ethics office to clarify the lunch acceptance.
      move: ask
      irreversible: false
      to: agency ethics office
    O2:
      do: The Ethics Assistant AI prohibits the supervisor from accepting the paid-for lunch.
      move: act
      irreversible: false
    O3:
      do: The Ethics Assistant AI holds the decision pending further guidance from the agency.
      move: hold
      irreversible: false
    O4:
      do: The Ethics Assistant AI permits the supervisor to accept the paid-for lunch.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An official superior is any employee whose responsibilities include directing or evaluating the performance of subordinates.
  - id: F2
    kind: situation
    status: confirmed
    fact: A voluntary contribution is a contribution given freely, without pressure or coercion, and must be made in an amount
      determined by the contributing employee.
  - id: F3
    kind: situation
    status: confirmed
    fact: Twelve subordinates are taking their supervisory employee to a farewell lunch and will divide the cost of the supervisor's
      meal equally among themselves.
  - id: F4
    kind: situation
    status: confirmed
    fact: The supervisory employee is being reassigned from Washington, DC, to a foreign duty location.
  - id: F5
    kind: situation
    status: confirmed
    fact: Each subordinate will pay for their own meal, and the supervisor's meal cost will be shared equally.
  - id: F6
    kind: situation
    status: confirmed
    fact: The contribution for the supervisor's meal is considered voluntary under the agency's definition.
  - id: F7
    kind: situation
    status: confirmed
    fact: The supervisory employee works for the Agency for International Development.
  - id: F8
    kind: authority
    status: assessed
    fact: The supervisor has delegated the decision on accepting the lunch to the Ethics Assistant AI.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The regulation defines a voluntary contribution as one given freely without pressure and in an amount determined
      by the contributor; the subordinates’ shared payment for the supervisor’s meal meets this definition.
  - id: C2
    facts:
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: A gift is permissible when the employee pays market value; each subordinate pays their own meal and an equal share
      of the supervisor’s meal, which the regulation treats as market‑value payment.
  - id: C3
    facts:
    - F1
    equity: duty_to_individual
    favors:
    - O4
    weight: weak
    why: Being an official superior does not by itself bar acceptance of a voluntary contribution that is not a prohibited
      gift.
  - id: C4
    facts: []
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The regulation’s own Example 1 to paragraph (f) states that the contribution made by those who choose to participate
      in the farewell lunch is voluntary, thereby authorizing acceptance.
  reasoning:
    read: The supervisor is offered a farewell lunch paid for by twelve subordinates. The trap is to treat the shared payment
      as an improper gift, but the regulation expressly characterizes such shared, employee‑determined payments as voluntary
      contributions, not prohibited gifts.
    weighing: Considering C1 and C2, the payment satisfies the voluntary‑contribution and market‑value criteria, which the
      regulation treats as permissible. C3 confirms that the supervisor’s status does not create a separate prohibition. C4
      provides the explicit regulatory endorsement, tipping the balance decisively toward permitting the lunch.
    tradecraft: Record the supervisor’s acceptance in the agency’s ethics log, noting that the contribution was voluntary
      and that each subordinate paid an equal share. No further clearance is required.
    uncertainty: Low – the regulation directly addresses this scenario.
    handoff: The Ethics Assistant AI may decide alone; no escalation to the ethics office is needed because the rule is clear.
    tempting_wrong:
      option: O2
      pull: A cautious instinct to forbid any benefit from subordinates could lead to an unnecessary prohibition.
      why_wrong: The regulation’s example shows that such voluntary, market‑value contributions are allowed, so prohibiting
        them would conflict with agency policy.
    rejected:
      O1: Requesting clarification is unnecessary because the regulation already provides a clear answer.
      O2: Prohibiting the lunch would ignore the explicit example that permits voluntary contributions.
      O3: Holding the decision adds delay without any regulatory ambiguity to resolve.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the contribution for the supervisor’s meal were not voluntary (e.g., coerced or predetermined amount)
      then: O2
      why: A non‑voluntary contribution would be a prohibited gift under the agency’s gift rules.
    would_not_change:
    - id: noflip1
      if: the supervisor is being reassigned abroad
      why: Reassignment does not affect the voluntary‑contribution analysis.
    watch_for:
    - id: watch1
      what: any indication of pressure, coercion, or a set contribution amount imposed on subordinates
      favors:
      - O2
      why: Such circumstances would convert the payment into a non‑voluntary gift.
  lesson: When subordinates voluntarily share the cost of a superior’s meal, the payment is treated as a market‑value gift
    and is permissible under agency ethics rules. The key test is whether the contribution is truly voluntary and employee‑determined.
  limits: This reasoning does not apply if the contribution is coerced, if a set amount is imposed, or if the value exceeds
    market price. It also does not cover gifts that are not tied to a shared event (e.g., cash gifts outside a meal).
