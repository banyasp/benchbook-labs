case:
  id: DR-CORPUS-NX-b75cac4b-E1@v1
  title: Assigning the Smart Installations Lead
  status: draft
  setting: Army installation modernization, following the December 2020 Army Installations Strategy.
  decider: Army leadership
  agent: Army leadership
  agent_role: decide
  situation: The Army is pursuing installation modernization through its 2021–2035 strategy, which assigns DCS, G-9 responsibility
    for an initial implementation plan and AMC an execution role across the Lines of Effort. Smart Installation initiatives
    continue at the garrison level, while the Army has not directed and resourced a lead for Army-wide implementation. ASA
    (IE&E) has developed strategy and initiated pilots, but is assessed as lacking the capacity to handle implementation requirements.
    AMC and IMCOM have substantial responsibilities and are assessed as lacking resources to lead Army-wide implementation
    effectively. Army Futures Command is viewed as focused on futures and innovation and better positioned and resourced for
    this kind of effort. The Army must decide whether to assign AFC the Army-wide lead or decline to do so.
  question: What should Army leadership do about assigning Army Futures Command the lead for Army-wide Smart Installations
    implementation?
  options:
    O1:
      do: Army leadership should decline to assign Army Futures Command as lead for Army-wide Smart Installations implementation.
      move: act
      irreversible: false
    O2:
      do: Army leadership should authorize Army Futures Command as lead for Army-wide Smart Installations implementation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: IMCOM coordinates and facilitates Smart Installation initiatives at the garrison level but does not formally list
      their development as a priority.
  - id: F2
    kind: capability
    status: assessed
    fact: AMC and IMCOM have extensive responsibilities and are assessed as lacking the resources to lead Army-wide Smart
      Installations implementation effectively.
  - id: F3
    kind: capability
    status: assessed
    fact: ASA (IE&E) has developed a strategy and initiated pilots but is assessed as not organized, manned, or equipped to
      handle implementation requirements.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Army Installations Strategy released in December 2020 identifies DCS, G-9 as responsible for developing the
      initial Lines of Effort implementation plan, with support from installation operations stakeholders.
  - id: F5
    kind: authority
    status: confirmed
    fact: The strategy identifies AMC as the execution lead for all Lines of Effort, responsible for an execution plan with
      metrics and associated outcomes.
  - id: F6
    kind: capability
    status: assessed
    fact: Army Futures Command is assessed as better resourced and positioned to lead Army-wide Smart Installations implementation,
      with a focus on futures, innovation, and emerging technologies.
  - id: F7
    kind: situation
    status: assessed
    fact: Smart Installation operations are expected to continue through garrison-level efforts until the Army directs and
      resources a lead.
  - id: F8
    kind: situation
    status: assessed
    fact: The professional knowledge base of Smart Installation implementation efforts is described as extremely limited,
      and lessons and best practices need to be recorded and shared.
  considerations:
  - id: C1
    facts:
    - F2
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: AMC and IMCOM have extensive responsibilities and are assessed as lacking the resources to lead Army-wide implementation
      effectively, making them poor choices to carry this additional lead role.
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: ASA (IE&E) has developed strategy and initiated pilots, but is assessed as not organized, manned, or equipped for
      the implementation requirements; strategy development alone does not supply the needed implementation capacity.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Army Futures Command is assessed as better resourced and positioned for the lead, and its focus on futures, innovation,
      and emerging technologies fits the work.
  - id: C4
    facts:
    - F1
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Without an Army-directed and resourced lead, efforts are expected to remain at garrison level, while the implementation
      knowledge base is extremely limited and lessons and best practices need to be captured and shared.
  reasoning:
    read: The Army has an installations strategy and continuing local initiatives, but the source sees a gap between those
      efforts and an Army-wide Smart Installations implementation lead. The trap is treating the existing strategy assignments
      or garrison activity as if they already fill that specific leadership gap.
    weighing: 'The balance favors {O2}: AMC and IMCOM lack capacity for the Army-wide role, ASA (IE&E) lacks implementation
      capacity, and AFC is assessed as better positioned for futures and innovation work {C1} {C2} {C3}. The expected continuation
      of local efforts and the need to build and share implementation knowledge add urgency {C4}. The source does not recommend
      displacing DCS, G-9''s initial planning responsibility or AMC''s Lines of Effort execution role; rather, its recommendation
      depends on establishing a capable lead for Smart Installations alongside those assignments.'
    tradecraft: Authorize the lead role with a clear statement of its scope and its relationship to the existing DCS, G-9
      and AMC responsibilities. Provide the resources and accountability needed for Army-wide implementation, and require
      lessons and best practices to be recorded and shared.
    uncertainty: The recommendation rests on an assessment that AFC is better resourced and positioned; the source does not
      quantify that advantage or specify the detailed allocation of authority and resources. The formal strategy's assigned
      roles also make clear coordination and accountability important.
    handoff: Army leadership should make the assignment and clarify its boundaries with DCS, G-9 and AMC, involving AFC and
      the installation stakeholders already engaged in the work. Those boundaries matter because the strategy assigns DCS,
      G-9 an initial planning role and AMC an execution role.
    tempting_wrong:
      option: O1
      pull: The strategy already assigns DCS, G-9 and AMC installation responsibilities, and garrisons are already pursuing
        initiatives.
      why_wrong: Those assignments and local efforts do not, in the source's assessment, provide a capable Army-wide Smart
        Installations lead; the source still calls for a champion and recommends AFC.
    rejected:
      O1: Declining to assign AFC leaves the identified Army-wide leadership and implementation-capacity gap unaddressed.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A review finds that AFC is not in fact better resourced or positioned for Army-wide implementation, or that it cannot
        be given a workable lead role alongside the existing strategy assignments.
      then: O1
      why: The recommendation depends on AFC's assessed comparative capacity and on an Army-directed, resourced lead being
        able to address the implementation gap.
    would_not_change:
    - id: noflip1
      if: DCS, G-9 retains responsibility for the initial Lines of Effort implementation plan and AMC retains its execution
        role.
      why: Those strategy responsibilities are compatible with the source's separate recommendation that AFC lead Smart Installations
        implementation.
    - id: noflip2
      if: Garrisons continue to run local initiatives while an Army-wide lead is being established.
      why: The source expects grassroots efforts to continue and treats their lessons as valuable, but does not regard them
        as a substitute for an Army-wide champion.
    watch_for:
    - id: watch1
      what: Whether proven garrison efforts are replicated and produce sufficient savings or process improvements to support
        more permanent Army programs.
      favors:
      - O2
      why: Successful replication could inform Army-wide adoption, while reinforcing the value of capturing and sharing implementation
        lessons.
  lesson: When a policy sets strategic goals but implementation capacity is missing, distinguish existing planning and execution
    assignments from the specific leadership gap. Assign the lead to the organization best positioned to fill that gap, while
    clarifying how it will coordinate with established responsibilities and preserve lessons for broader use.
  limits: This recommendation addresses the source's assessment of Army-wide Smart Installations leadership after the December
    2020 strategy. It does not establish a binding assignment, resolve the precise division of authority among Army organizations,
    or apply if the relative capability assessments change.
