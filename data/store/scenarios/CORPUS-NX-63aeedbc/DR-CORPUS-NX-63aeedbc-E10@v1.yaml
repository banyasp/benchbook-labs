case:
  id: DR-CORPUS-NX-63aeedbc-E10@v1
  title: Naval-History Faculty Staffing
  status: draft
  setting: The history department serving midshipmen; during the period described as the last decade and foreseeable future.
  decider: The history department
  agent: The history department
  agent_role: decide
  situation: The American Naval Heritage course is expected to remain a staple of the history department. Over the last decade,
    the department has shown declining interest in naval history while broadening its faculty into other areas of the discipline.
    The course serves 1,000 midshipmen each year in forty sections of no more than twenty-five students. Four practicing naval
    historians can reasonably cover sixteen sections. The remaining twenty-four sections, serving six hundred midshipmen,
    must be taught by non-specialists or Officers.
  question: What should the history department do about its naval-history specialist staffing while maintaining the American
    Naval Heritage course and its broader disciplinary coverage?
  options:
    O1:
      do: The history department should decrease its naval-history specialist staffing by continuing broad hiring in other
        historical specialties.
      move: act
      irreversible: false
    O2:
      do: The history department should increase its naval-history specialist staffing by replacing departing naval historians.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The American Naval Heritage course is expected to remain a staple of the history department for the foreseeable
      future.
  - id: F2
    kind: situation
    status: assessed
    fact: The department demonstrated an erosion of interest in naval history during the last decade.
  - id: F3
    kind: situation
    status: confirmed
    fact: The department consistently failed to replace departing naval historians.
  - id: F4
    kind: situation
    status: confirmed
    fact: The department broadened its faculty with specialists in other subsets of the discipline.
  - id: F5
    kind: situation
    status: confirmed
    fact: The American Naval Heritage course is offered to 1,000 midshipmen per year.
  - id: F6
    kind: situation
    status: confirmed
    fact: The course is taught in sections of no more than twenty-five students, for a total of forty sections per year.
  - id: F7
    kind: capability
    status: assessed
    fact: The four practicing naval historians in the department can reasonably cover sixteen course sections.
  - id: F8
    kind: capability
    status: assessed
    fact: The uncovered teaching load is twenty-four sections, or six hundred midshipmen, to be taught by non-specialists
      or Officers.
  considerations:
  - id: C1
    facts:
    - F4
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: The department's broadening into other areas is characterized as an understandable ecumenical direction, supporting
      continued breadth in its faculty choices.
  - id: C2
    facts:
    - F1
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The course is expected to remain a staple and serves 1,000 midshipmen in forty small sections, making its recurring
      teaching demand a significant consideration.
  - id: C3
    facts:
    - F3
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The department has not replaced departing naval historians, and its four specialists can cover only sixteen of forty
      sections; the remaining twenty-four sections go to non-specialists or Officers.
  reasoning:
    read: 'The choice is not whether to keep the American Naval Heritage course: it is expected to remain in place. The real
      tension is between continued breadth in hiring and maintaining enough naval-history specialists for a large, recurring
      course. The trap is treating the acknowledged staffing crisis as if the passage also supplied a specific staffing remedy;
      it does not.'
    weighing: The course's continuing place and the substantial specialist-coverage gap weigh toward {O2}. Against that, the
      source calls the department's ecumenical broadening understandable, which supports {O1}; the stipulated source outcome
      is {O1}. The balance depends on giving weight to disciplinary breadth despite the staffing crisis, not on any stated
      finding that the teaching gap is unimportant.
    tradecraft: As a decision practice, track specialist capacity against the course's section load and record how each hiring
      choice affects both naval-history coverage and broader disciplinary coverage. Make explicit that the twenty-four-section
      gap remains a consequence of the choice.
    uncertainty: The passage gives the staffing history and capacity figures but does not spell out a complete comparison
      of hiring alternatives, a staffing plan, or a principle for resolving the tradeoff. Its stated support for breadth is
      that the ecumenical thrust is understandable.
    handoff: The history department is the identified decider. Departmental leadership should make and document the staffing
      choice; the passage identifies no separate authority whose approval is required.
    tempting_wrong:
      option: O2
      pull: The course is permanent, and the specialists leave twenty-four sections uncovered.
      why_wrong: That concern is real, but treating the coverage gap as automatically controlling would disregard the source's
        characterization of broadening as understandable and its stipulated outcome, {O1}.
    rejected:
      O2: The source's outcome favors continued broadening, notwithstanding the staffing shortfall that would support replacing
        departing naval historians.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The course were no longer expected to remain a staple, reducing the recurring need for specialist coverage.
      then: O1
      why: Reduced continuing course demand would lessen the staffing pressure created by broadening faculty coverage into
        other areas.
    - id: flip2
      if: The department could preserve its broader disciplinary coverage while also replacing departing naval historians.
      then: O2
      why: Replacing naval historians while preserving broader coverage would address the specialist gap without sacrificing
        the department's ecumenical direction.
    would_not_change:
    - id: noflip1
      if: A short-term scheduling fluctuation occurred but the course demand and underlying specialist-capacity gap remained
        unchanged.
      why: A temporary fluctuation alone would not remove the recurring tension between broad hiring and the course's specialist
        coverage.
    watch_for:
    - id: watch1
      what: Whether the course's section load or the number of sections reasonably covered by naval-history specialists changes.
      favors:
      - O2
      why: Those measures determine whether the substantial uncovered teaching load persists or grows.
  lesson: When an institution must sustain a required course while broadening its expertise, weigh the ongoing teaching demand
    against the value of disciplinary breadth. If breadth is chosen despite a documented coverage gap, state that tradeoff
    plainly rather than implying the gap has been solved.
  limits: This reasoning addresses the history department's staffing choice only. It does not determine the quality of instruction
    by non-specialists or Officers, establish a legal staffing requirement, or address any separate Navy Department decision.
