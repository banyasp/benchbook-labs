case:
  id: DR-FARAH-2009-revise1@v1
  title: Strike Decision on Unverified Target [revise]
  status: needs_review
  setting: Gerani Village, Bala Balouk District, Farah Province, Afghanistan, 4 May 2009, U.S. military operation
  decider: ground force commander
  agent: the ground force commander
  agent_role: decide
  situation: A ground force was under direct enemy fire and awaiting a medical evacuation helicopter. A B-1B bomber observed
    a group of similarly-sized adults moving in a tactical formation behind the enemy front line. Real‑time intelligence indicated
    the group's movement matched Taliban orders to mass and re‑attack friendly forces, leading the commander to assess an
    imminent threat. The group moved into a building later identified as a mosque used by the Taliban for training and command
    functions. Neither the commander nor the bomber crew could confirm whether civilians were present in the building.
  question: What should the ground force commander do regarding the strike on the building when civilian presence cannot be
    confirmed?
  options:
    O1:
      do: The ground force commander asks the intelligence cell for more intel
      move: ask
      irreversible: false
      to: intelligence cell
    O2:
      do: The ground force commander holds fire pending further assessment
      move: hold
      irreversible: false
    O3:
      do: The ground force commander orders the bomber to strike the target
      move: act
      irreversible: true
    O4:
      do: The ground force commander orders the bomber to withhold the strike
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The ground force was under direct enemy fire and awaiting a medical evacuation helicopter.
  - id: F2
    kind: situation
    status: confirmed
    fact: The B-1B observed a group of similarly-sized adults moving in a tactical formation behind the enemy front line.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Real‑time intelligence matched the group's movement to Taliban commander instructions to mass and re‑attack.
  - id: F4
    kind: situation
    status: assessed
    fact: The building the group entered was later identified as a mosque used by the Taliban as a madrassa, barracks, and
      command node.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The commander assessed that the group presented an imminent threat to his forces.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Neither the commander nor the B-1B crew could confirm the presence or absence of civilians in the building.
  - id: F7
    kind: authority
    status: confirmed
    fact: The commander directed the B-1B to drop bombs on the building.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Later investigation found that the strike likely caused civilian casualties and did not follow all specific guidance.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The investigation concluded the strike was lawful under LOAC but the later strikes did not adhere to the controlling
      directive, likely resulting in civilian casualties.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: own_force_life
    favors:
    - O3
    weight: weak
    why: The commander judged the moving group matched Taliban orders and posed an imminent threat to friendly forces.
  - id: C2
    facts:
    - F6
    - F9
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Inability to verify civilian absence makes the safest immediate action to request further intelligence, directly
      satisfying the LOAC precautionary requirement.
  - id: C3
    facts:
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Ensuring compliance with the controlling directive requires additional ISR before any strike; requesting intel is
      the lawful step.
  - id: C4
    facts:
    - F9
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Protecting Afghan civilian lives is best achieved by obtaining more information before deciding to fire.
  - id: C5
    facts:
    - F1
    equity: tempo
    favors:
    - O3
    weight: weak
    why: Holding fire could expose the ground force to continued enemy fire while awaiting medical evacuation.
  reasoning:
    read: The commander faces an enemy-controlled building that may house civilians; current ISR cannot confirm civilian absence,
      creating legal and ethical uncertainty.
    weighing: Strong civilian-life equities (C2-C4) now point to the action that most directly reduces that uncertainty—asking
      the intelligence cell for additional ISR—while weaker force-protection equities (C1, C5) remain insufficient to override
      the precautionary duty.
    tradecraft: Document the request, specify required ISR assets (e.g., UAV, ground recon), and record the pending decision
      in the after-action report; prepare to act quickly once the intelligence cell delivers the analysis.
    uncertainty: The number and location of civilians inside the mosque remain unknown; the speed at which the enemy can re-engage
      also remains uncertain.
    handoff: The ground force commander should task the intelligence cell to obtain high-resolution imagery, signals intercepts,
      or a ground-based observation team before any kinetic decision.
    tempting_wrong:
      option: O2
      pull: The urge to avoid immediate civilian risk by simply holding fire.
      why_wrong: Holding fire does not actively reduce the intelligence gap and may allow the enemy to consolidate or launch
        a larger attack, whereas requesting intel creates a path to a lawful, informed strike.
    rejected:
      O2: Holding fire delays action without addressing the core lack of civilian-presence verification.
      O3: Striking without additional intelligence would breach the precautionary requirement and risk unlawful civilian harm.
      O4: Withholding the strike entirely abandons the opportunity to obtain the needed intelligence and later conduct a lawful
        engagement.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If additional intelligence still cannot confirm civilian absence while the enemy threat remains immediate,
      then: O2
      why: Without positive civilian clearance, the precautionary principle obliges the commander to hold fire pending further
        assessment.
    would_not_change:
    - id: noflip1
      if: The enemy continues to fire directly on friendly forces while the building remains occupied by unknown persons.
      why: The inability to verify civilian absence still overrides the threat assessment.
    watch_for:
    - id: watch1
      what: If the enemy exploits the hold‑fire period to launch a larger attack, the commander must reassess the threat‑vs‑civilian‑risk
        calculus.
      favors:
      - O3
      why: Escalation of enemy action could shift the balance toward immediate engagement.
  lesson: When civilian presence cannot be positively identified, the safest immediate step is to request further intelligence,
    preserving both legal compliance and force protection.
  limits: This guidance applies only when positive civilian identification is lacking; it does not preclude striking once
    reliable ISR confirms civilian absence or when the threat directly targets friendly forces with no feasible alternative.
