case:
  id: DR-FARAH-2009-1@v1
  title: Strike Authorization Against Unverified Target in Gerani Village
  status: draft
  setting: Gerani Village, Bala Balouk District, Farah Province, Afghanistan, 4 May 2009, during an ongoing firefight involving
    coalition ground forces and Taliban insurgents
  decider: ground force commander
  agent: ground force commander
  agent_role: decide
  situation: The ground force was engaged in direct fire with Taliban fighters in Gerani Village and was awaiting a medical
    evacuation helicopter. A B‑1B bomber observed a group of similarly‑sized adults moving tactically across difficult terrain
    behind the enemy front line. Real‑time intelligence indicated that the group's location and movement matched Taliban commander
    orders to mass for a re‑attack on coalition forces. The group moved toward a building later identified as a mosque used
    by the Taliban as a madrassa, barracks, and command node. The ground force commander judged the group to pose an imminent
    threat to his forces. Neither the commander nor the B‑1B crew could confirm whether civilians were present inside the
    building.
  question: What should the ground force commander do regarding authorizing a bomb strike on the building when civilian presence
    cannot be confirmed?
  options:
    O1:
      do: The ground force commander asks for more intelligence to verify civilian presence before deciding.
      move: ask
      irreversible: false
    O2:
      do: The ground force commander orders a limited strike with reduced munitions on the building.
      move: partial
      irreversible: false
    O3:
      do: The ground force commander authorizes the B‑1B to drop bombs on the building.
      move: act
      irreversible: true
    O4:
      do: The ground force commander withholds authorization for the B‑1B to drop bombs on the building.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The ground force was under direct enemy fire and awaiting a medical evacuation helicopter.
  - id: F2
    kind: intelligence
    status: assessed
    fact: A group of similarly‑sized adults was observed moving tactically across difficult terrain behind the enemy front
      line.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Real‑time intelligence matched the group's location and movement to Taliban commander instructions to mass for a
      re‑attack.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The building the group approached was later identified as a mosque used by the Taliban as a madrassa, barracks,
      and command node.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The ground force commander assessed that the group presented an imminent threat to his forces.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Neither the ground force commander nor the B‑1B crew could confirm the presence or absence of civilians inside the
      building.
  - id: F7
    kind: authority
    status: confirmed
    fact: Rules of engagement require distinction, proportionality, and a reasonable certainty of hostile presence before
      employing lethal force.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: Real‑time intelligence matched the group’s movement to Taliban orders to mass for a re‑attack, and the commander
      judged the group an imminent threat to his forces.
  - id: C2
    facts:
    - F2
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The group’s size, tactical movement, and the building’s known use as a Taliban madrassa, barracks and command node
      provided positive identification of hostile combatants.
  - id: C3
    facts:
    - F6
    - F7
    equity: civilian_life
    favors:
    - O3
    weight: weak
    why: The commander could not confirm the absence of civilians, and while the inability to discern civilians conflicts
      with the objective of minimizing civilian harm, the rules of engagement require only reasonable certainty of hostile
      presence.
  - id: C4
    facts:
    - F1
    - F5
    equity: tempo
    favors:
    - O3
    weight: strong
    why: The ground force was under direct fire and awaiting a medical evacuation; delaying action would increase risk to
      friendly personnel.
  - id: C5
    facts:
    - F1
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Eliminating the massing Taliban element was essential to protect the ongoing operation and enable the MEDEVAC.
  reasoning:
    read: The commander faced an immediate, fire‑engaged situation where a Taliban‑identified group was moving toward friendly
      forces and entered a building used for enemy command and training. Civilian presence could not be verified, but the
      threat to own troops was deemed imminent.
    weighing: The source balances the strong considerations of imminent threat (C1), positive hostile identification (C2),
      and mission urgency (C4, C5) against the weaker concern over unknown civilian presence (C3). Because the totality of
      circumstances satisfied LOAC requirements, the balance tips toward authorizing the strike.
    tradecraft: The commander documented the intelligence, threat assessment, and ROE compliance in the strike request, recorded
      the decision in the after‑action report, and ensured the B‑1B crew received the target authorization with the stated
      justification.
    uncertainty: It is uncertain whether civilians were present inside the building at the time of the strike.
    handoff: The decision was made by the ground force commander alone, as delegated authority for close‑air‑support in the
      engagement, with brief coordination to the B‑1B crew.
    tempting_wrong:
      option: O4
      pull: Withholding the strike could avoid potential civilian casualties.
      why_wrong: Doing so would leave the friendly force exposed to an imminent Taliban attack, jeopardizing lives and the
        mission.
    rejected:
      O1: Requesting additional intelligence would have delayed action beyond the window of imminent threat.
      O2: A limited strike with reduced munitions risked insufficiently neutralizing the hostile mass, endangering the ground
        force.
      O4: Withholding the strike would have allowed the Taliban group to re‑engage, violating the duty to protect own personnel.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: reliable intelligence confirmed the presence of civilians inside the building at the time of the strike
      then: O4
      why: Positive civilian identification would remove the reasonable certainty of hostile presence required by the ROE.
    - id: flip2
      if: the group’s movement was determined not to be directed toward friendly forces and posed no imminent threat
      then: O4
      why: Without an imminent threat, the proportionality and necessity tests would not be satisfied.
    would_not_change:
    - id: noflip1
      if: the building was later identified as a mosque used by the Taliban for command and training
      why: The hostile use of the structure validates the target regardless of its religious function.
    watch_for:
    - id: watch1
      what: any post‑strike evidence of civilian casualties
      favors:
      - O4
      why: Civilian harm would trigger a review of targeting procedures and could affect future ROE application.
  lesson: When credible, time‑critical intelligence shows an imminent hostile threat and positive identification of enemy
    combatants, LOAC permits the use of lethal force even if civilian presence cannot be fully verified, provided proportionality
    and precautionary measures are applied. However, commanders must still document the uncertainty and be prepared to reassess
    if civilian presence is later confirmed.
  limits: This reasoning applies only to close‑air‑support situations where the enemy is massing for an immediate attack on
    friendly forces and where delay would endanger those forces. It does not extend to pre‑emptive strikes lacking an imminent
    threat or to targets where reliable civilian presence can be confirmed.
