case:
  id: DR-FARAH-2009-1@v1
  title: Decision on Airstrike Against Potential Taliban Group When Civilian Presence Uncertain
  status: draft
  setting: Gerani Village, Bala Balouk District, Farah Province, Afghanistan, 4 May 2009, USCENTCOM operation
  decider: ground force commander
  agent: ground force commander
  agent_role: decide
  situation: The ground force was under direct enemy fire and awaiting a medical evacuation helicopter. A B-1B bomber observed
    a group of similarly sized adults moving tactically across difficult terrain behind the enemy front line. Real‑time intelligence
    indicated the group's location and movement matched Taliban orders to mass and re‑attack friendly forces, leading the
    commander to assess an imminent threat. The commander directed the B-1B to strike the group and a building they entered,
    despite the crew being unable to confirm whether civilians were present. Subsequent investigation found that the first
    strike caused no civilian deaths, but later strikes likely resulted in civilian casualties and did not fully follow controlling
    guidance.
  question: What should the ground force commander do regarding striking the groups assessed as massing Taliban fighters,
    including the building, when civilian presence cannot be confirmed?
  options:
    O1:
      do: The ground force commander orders the B-1B to refrain from conducting an airstrike on the identified group and building.
      move: act
      irreversible: true
    O2:
      do: The ground force commander orders a pause to obtain additional intelligence before deciding on an airstrike.
      move: hold
      irreversible: false
    O3:
      do: The ground force commander orders the B-1B to conduct an airstrike on the identified group and building.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The ground force was under direct enemy fire and awaiting a medical evacuation helicopter.
  - id: F2
    kind: situation
    status: confirmed
    fact: A B-1B bomber observed a group of similarly sized adults moving tactically across difficult terrain behind the enemy
      front line.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Intelligence confirmed that the group's location and direction matched Taliban commander instructions to mass and
      re‑attack friendly forces.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The ground force commander assessed that the group presented an imminent threat to his forces.
  - id: F5
    kind: situation
    status: confirmed
    fact: The first strike hit a building later identified as a mosque used by the Taliban; investigation found no civilian
      deaths.
  - id: F6
    kind: situation
    status: assessed
    fact: The B-1B crew could not confirm the presence or absence of civilians in the building targeted in the second strike.
  - id: F7
    kind: situation
    status: assessed
    fact: Investigation assessed that the third strike was a likely source of civilian casualties.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The later strikes did not adhere to all specific guidance and commander's intent, likely resulting in civilian casualties.
  - id: F9
    kind: authority
    status: confirmed
    fact: Law of Armed Conflict requires distinction, proportionality, and precautions to avoid civilian harm.
  - id: F10
    kind: situation
    status: confirmed
    fact: The ground force commander directed the B-1B to drop bombs on the identified group and building.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: Intelligence matched Taliban orders to mass and re‑attack, and the commander assessed an imminent threat to his forces.
  - id: C2
    facts:
    - F2
    - F3
    equity: hors_de_combat
    favors:
    - O3
    weight: strong
    why: The observed group’s size, tactical movement, and alignment with enemy command indicated they were combatants.
  - id: C3
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Law of Armed Conflict requires distinction, proportionality and precautions; the investigation found the strikes
      met those criteria.
  - id: C4
    facts:
    - F6
    equity: civilian_life
    favors:
    - O3
    weight: weak
    why: The crew could not confirm the presence or absence of civilians, creating a risk of civilian harm, but the imminent
      threat outweighed the uncertainty.
  - id: C5
    facts:
    - F8
    equity: oversight_candor
    favors:
    - O3
    weight: weak
    why: Later strikes did not fully follow the controlling directive, increasing the likelihood of civilian casualties, yet
      the overall assessment still deemed the strikes lawful.
  reasoning:
    read: The ground force was under direct enemy fire and awaiting MEDEVAC when a B‑1B tracked groups whose movement matched
      Taliban orders to mass for a re‑attack. The commander judged an imminent threat and ordered airstrikes despite lacking
      positive civilian identification.
    weighing: Credible intelligence of an imminent enemy attack (C1, C2) and compliance with LOAC (C3) outweigh the uncertainty
      about civilian presence (C4) and procedural lapses (C5). The imperative to protect friendly forces therefore justifies
      striking.
    tradecraft: The commander documented the intelligence, the threat assessment, and the decision to strike in the after‑action
      report, preserving the chain‑of‑command record and ensuring the strike was logged as a lawful CAS operation.
    uncertainty: Uncertainty existed regarding civilian presence in the targeted building; however, the imminent threat and
      lack of alternative means justified proceeding.
    handoff: The decision was made by the ground force commander, who held delegated authority for close‑air support; no higher‑level
      approval was required given the time‑critical nature of the threat.
    tempting_wrong:
      option: O1
      pull: The desire to avoid any civilian casualties could tempt the commander to refrain from striking.
      why_wrong: Refraining would have left a massing enemy force unchecked, exposing friendly troops to a likely lethal attack
        and violating the duty to protect own forces.
    rejected:
      O1: Refraining would have failed to neutralize an imminent enemy threat to the ground force.
      O2: A pause to obtain additional intelligence was not feasible given the immediate danger and the limited time before
        the enemy could re‑engage.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: reliable positive identification of civilians in the building before the strike
      then: O1
      why: The presence of protected persons would make the attack disproportionate and violate the principle of distinction.
    would_not_change:
    - id: noflip1
      if: the enemy group continued to mass and fire on friendly forces
      why: The imminent threat to own forces remains, sustaining the justification for striking.
    watch_for:
    - id: watch1
      what: future strikes conducted after sunset that do not fully apply the controlling directive
      favors:
      - O1
      why: Non‑compliance with guidance raises the risk of civilian casualties and could erode legal justification.
  lesson: When credible, time‑critical intelligence shows an imminent enemy attack, LOAC permits striking even without positive
    civilian identification, provided the commander applies all applicable guidance to minimize civilian harm.
  limits: This reasoning applies only where the commander has reliable intelligence of an imminent threat and authority to
    conduct CAS; it does not excuse strikes when civilians are positively identified or when the controlling directive is
    knowingly ignored.
