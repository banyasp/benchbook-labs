case:
  id: DR-FARAH-2009-1@v1
  title: Strike Decision on Unverified Target
  status: draft
  setting: Gerani Village, Bala Balouk District, Farah Province, Afghanistan, 4 May 2009, U.S. military operation
  decider: ground force commander
  agent: the ground force commander
  agent_role: decide
  situation: A ground force was under direct enemy fire and awaiting a medical evacuation helicopter. A B-1B bomber observed
    a group of similarly-sized adults moving in a tactical formation behind the enemy front line. Real‑time intelligence indicated
    the group's movement matched Taliban orders to mass and re‑attack friendly forces, leading the commander to assess an
    imminent threat. The group moved into a building later identified as a mosque used by the Taliban for training and command
    functions. Neither the commander nor the bomber crew could confirm whether civilians were present in the building.
  question: What should the ground force commander do regarding the strike on the building when civilian presence cannot be
    confirmed?
  options:
    O1:
      do: The ground force commander asks the intelligence cell for more intel
      move: ask
      irreversible: false
      to: intelligence cell
    O2:
      do: The ground force commander holds fire pending further assessment
      move: hold
      irreversible: false
    O3:
      do: The ground force commander orders the bomber to strike the target
      move: act
      irreversible: true
    O4:
      do: The ground force commander orders the bomber to withhold the strike
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The ground force was under direct enemy fire and awaiting a medical evacuation helicopter.
  - id: F2
    kind: situation
    status: confirmed
    fact: The B-1B observed a group of similarly-sized adults moving in a tactical formation behind the enemy front line.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Real‑time intelligence matched the group's movement to Taliban commander instructions to mass and re‑attack.
  - id: F4
    kind: situation
    status: assessed
    fact: The building the group entered was later identified as a mosque used by the Taliban as a madrassa, barracks, and
      command node.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The commander assessed that the group presented an imminent threat to his forces.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Neither the commander nor the B-1B crew could confirm the presence or absence of civilians in the building.
  - id: F7
    kind: authority
    status: confirmed
    fact: The commander directed the B-1B to drop bombs on the building.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Later investigation found that the strike likely caused civilian casualties and did not follow all specific guidance.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The investigation concluded the strike was lawful under LOAC but the later strikes did not adhere to the controlling
      directive, likely resulting in civilian casualties.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: own_force_life
    favors:
    - O3
    weight: weak
    why: The commander judged the moving group matched Taliban orders and posed an imminent threat to friendly forces.
  - id: C2
    facts:
    - F6
    - F9
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Neither the commander nor the bomber crew could positively identify the absence of civilians, violating the LOAC
      precautionary requirement.
  - id: C3
    facts:
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The investigation found the strike did not adhere to all specific guidance in the controlling directive, making civilian
      casualties likely.
  - id: C4
    facts:
    - F9
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Civilian casualties are inconsistent with the U.S. Government’s objective of providing security for the Afghan people.
  - id: C5
    facts:
    - F1
    equity: tempo
    favors:
    - O3
    weight: weak
    why: Holding fire could expose the ground force to continued enemy fire while awaiting medical evacuation.
  reasoning:
    read: The commander faced an imminent enemy threat but lacked any reliable means to confirm that civilians were not inside
      the target building. While the enemy nature of the target was clear, the inability to verify civilian absence breached
      the precautionary principle of LOAC.
    weighing: The considerations balance the strong protections for civilian life (C2, C3, C4) against the weaker arguments
      for immediate force protection (C1, C5). Because the precautionary requirement is a binding legal standard, the balance
      tips toward holding fire pending further assessment.
    tradecraft: Document the decision, note the lack of positive civilian identification, and request additional ISR or ground
      confirmation before any strike. Record the hold‑fire order in the after‑action report.
    uncertainty: Uncertainty remains about the exact number of civilians possibly present and the speed at which the enemy
      could re‑engage friendly forces.
    handoff: The commander should involve the intelligence cell to obtain further ISR and, if possible, a ground reconnaissance
      element before revisiting the strike decision.
    tempting_wrong:
      option: O3
      pull: The apparent imminent threat and the desire to protect own troops create pressure to strike.
      why_wrong: Striking without confirming civilian absence breaches LOAC precautions and the controlling directive, risking
        unlawful civilian harm.
    rejected:
      O1: Requesting more intel alone would not address the immediate need for a decision; the commander must act now.
      O3: The strike would violate the precautionary requirement because civilian presence could not be ruled out.
      O4: Withholding the strike entirely (as opposed to holding fire pending assessment) would abandon the opportunity to
        reassess once better information is obtained.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Positive identification that no civilians are present in the building.
      then: O3
      why: With civilian presence ruled out, the precautionary requirement is satisfied and the imminent threat can be lawfully
        engaged.
    would_not_change:
    - id: noflip1
      if: The enemy continues to fire directly on friendly forces while the building remains occupied by unknown persons.
      why: The inability to verify civilian absence still overrides the threat assessment.
    watch_for:
    - id: watch1
      what: If the enemy exploits the hold‑fire period to launch a larger attack, the commander must reassess the threat‑vs‑civilian‑risk
        calculus.
      favors:
      - O3
      why: Escalation of enemy action could shift the balance toward immediate engagement.
  lesson: When civilian presence cannot be positively identified, LOAC mandates holding fire and seeking additional intelligence,
    even in the face of an apparent imminent threat.
  limits: This guidance applies only to situations where positive identification of civilians is lacking; it does not preclude
    striking when reliable ISR confirms civilian absence or when the threat is directly targeting friendly forces with no
    feasible alternative.
