case:
  id: DR-FARAH-2009-flip1@v1
  title: Strike Decision on Unverified Target [flip]
  status: needs_review
  setting: Khanabad Village, Helmand Province, Afghanistan, 12 June 2010, coalition operation
  decider: company commander
  agent: the company commander
  agent_role: decide
  situation: An infantry company was taking direct fire from insurgents while a medical evacuation helicopter was inbound.
    An overhead B-2 bomber observed a formation of adult combatants moving in coordinated rows beyond the enemy front line.
    Live-time signals intelligence linked the movement to a senior Taliban commander's order to mass forces for a counter-attack.
    The formation entered a structure later identified as a mosque used by the Taliban for training and command. Neither the
    commander nor the bomber crew could initially confirm whether civilians were inside the building.
  question: What should the company commander do about striking the mosque when civilian presence cannot be positively identified?
  options:
    O1:
      do: The commander asks the analysis cell for additional intelligence now
      move: ask
      irreversible: false
      to: intelligence cell
    O2:
      do: The commander delays the strike until further assessment is completed
      move: hold
      irreversible: false
    O3:
      do: The commander orders the bomber to strike the mosque immediately
      move: act
      irreversible: true
    O4:
      do: The commander tells the bomber to withhold striking the mosque
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The company's infantry squad was taking direct fire from insurgents while a medevac helicopter was en route.
  - id: F2
    kind: situation
    status: confirmed
    fact: An overhead B-2 bomber sighted a formation of adult combatants moving in coordinated rows beyond the enemy front
      line.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Live-time signals intelligence linked the movement to a senior Taliban commander's directive to mass forces for
      a counter-attack.
  - id: F4
    kind: situation
    status: assessed
    fact: The formation entered a structure later identified as a mosque that serves as a Taliban training and command facility.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The commander judged the group to pose an immediate danger to his troops.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: 'Intelligence, confirmed: Sensor feeds and on‑site reports verified that the interior of the building held only
      armed Taliban fighters; no non‑combatant individuals were detected.'
  - id: F7
    kind: authority
    status: confirmed
    fact: He directed the bomber to release precision munitions on the mosque.
  - id: F8
    kind: intelligence
    status: assessed
    fact: 'Intelligence, assessed: Post‑strike analysis determined the structure contained exclusively combatants, confirming
      that the engagement met all precautionary requirements of the controlling directive.'
  - id: F9
    kind: intelligence
    status: assessed
    fact: 'Intelligence, assessed: The investigation concluded the strike was fully lawful under LOAC and the directive, as
      no non‑combatant presence was found in the target building.'
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: own_force_life
    favors:
    - O3
    weight: weak
    why: The observed formation matched a known Taliban counter-attack order, presenting a direct threat to the company.
  - id: C2
    facts:
    - F6
    - F9
    equity: civilian_life
    favors:
    - O3
    weight: strong
    why: Confirmed intelligence shows the interior contains only combatants and no civilians, satisfying the LOAC precautionary
      requirement.
  - id: C3
    facts:
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Post-strike assessments confirm the engagement complied with the rules of engagement and the controlling directive.
  - id: C4
    facts:
    - F9
    equity: civilian_life
    favors:
    - O3
    weight: strong
    why: Absence of civilians aligns with the mission's objective to protect the Afghan populace.
  - id: C5
    facts:
    - F1
    equity: tempo
    favors:
    - O3
    weight: weak
    why: Delaying fire would leave the squad exposed to continued hostile fire while awaiting evacuation.
  reasoning:
    read: The commander faced an immediate enemy threat but possessed reliable intelligence confirming no civilians were present,
      thereby meeting the LOAC precautionary standard.
    weighing: Strong considerations protecting civilian life now support the strike, and the force-protection arguments add
      additional weight, tipping the balance toward immediate engagement.
    tradecraft: Record the decision, cite the confirmed intelligence, and note compliance with the rules of engagement. Ensure
      after-action reporting reflects the lawful nature of the strike.
    uncertainty: Minimal uncertainty remains regarding civilian presence; the remaining risk pertains to enemy reaction after
      the strike.
    handoff: Continue to monitor ISR feeds for any unexpected civilian movement and be prepared to adjust tactics if new information
      emerges.
    tempting_wrong:
      option: O2
      pull: A desire to avoid any possible civilian harm, even when none is likely, creates pressure to pause the strike.
      why_wrong: Holding fire would unnecessarily expose friendly troops to continued enemy fire when civilian harm has been
        ruled out.
    rejected:
      O1: Simply requesting more intelligence does not resolve the immediate tactical need; the commander must act on the
        confirmed data.
      O4: Withholding the strike entirely would forfeit the opportunity to neutralize a verified combatant target.
      O2: Pausing the strike would leave the company vulnerable to an imminent attack despite clear evidence that the target
        contains only combatants.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the commander cannot obtain positive confirmation that civilians are absent from the mosque.
      then: O2
      why: Without certainty about civilian absence, the precautionary requirement would favor holding fire.
    would_not_change:
    - id: noflip1
      if: If enemy fire continues directly on friendly forces while the building remains occupied by unknown persons.
      why: The inability to verify civilian absence still overrides the threat assessment.
    watch_for:
    - id: watch1
      what: If the enemy exploits the pause to launch a larger assault, the commander must reassess the threat-vs-civilian-risk
        balance.
      favors:
      - O3
      why: Escalation of enemy action could shift the calculus toward immediate engagement.
  lesson: When reliable intelligence positively confirms that no civilians are present, LOAC permits the lawful use of force
    against a verified combatant target, even under imminent threat conditions.
  limits: This guidance applies only when positive identification of civilian absence is available; it does not authorize
    strikes when civilian presence cannot be ruled out or when alternative, less-lethal options exist.
