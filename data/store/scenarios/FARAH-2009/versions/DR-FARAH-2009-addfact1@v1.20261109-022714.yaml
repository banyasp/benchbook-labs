case:
  id: DR-FARAH-2009-addfact1@v1
  title: Strike Decision on Unverified Target [addfact]
  status: needs_review
  setting: 'Operational theater: Gerani village, Bala Balouk district, Farah province, Afghanistan – 4 May 2009 – U.S. forces
    operation'
  decider: Commander of the ground element
  agent: the commander of the ground element
  agent_role: decide
  situation: The commander's ground element was taking direct fire from hostile forces while a casualty-evacuation helicopter
    was en route. A B-1B bomber sighted a formation of adult combatants moving behind the enemy line. Real-time analysis linked
    the movement to Taliban orders to mass and launch a counter-attack, leading the commander to judge the group an imminent
    threat. The formation entered a structure later identified as a mosque that the Taliban uses as a madrassa, barracks and
    command node. Reconnaissance indicated a civilian medical clinic lies within 30 m of that mosque. Neither the commander
    nor the bomber crew could verify the presence of civilians inside. The commander subsequently instructed the bomber to
    release its ordnance on the building. Post-mission review suggested the strike probably caused civilian casualties and
    did not fully comply with specific guidance, though the review also found the attack lawful under LOAC, while later strikes
    failed to follow the controlling directive, likely resulting in civilian harm.
  question: Given the inability to confirm civilian presence, what should the commander decide about striking the mosque?
  options:
    O1:
      do: Request additional intelligence from the analysis cell promptly today
      move: ask
      irreversible: false
      to: intelligence cell
    O2:
      do: Suspend the strike until a threat assessment is completed
      move: hold
      irreversible: false
    O3:
      do: Order the bomber to strike the target as directed
      move: act
      irreversible: true
    O4:
      do: Order the bomber to withhold fire on the target
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The ground element was taking direct hostile fire while awaiting a medical evacuation helicopter.
  - id: F2
    kind: situation
    status: confirmed
    fact: A B-1B bomber sighted a group of similarly sized adults moving in a coordinated formation behind the enemy front.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Real-time intelligence correlated the group's movement with Taliban commander orders to mass forces and launch a
      counter-attack.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Reconnaissance reports placed a civilian medical clinic within 30 meters of the mosque that was being targeted.
  - id: F5
    kind: situation
    status: assessed
    fact: The structure entered by the group was later identified as a mosque serving as a Taliban madrassa, barracks, and
      command node.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The commander assessed the group as presenting an imminent threat to his forces.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Neither the commander nor the B-1B crew could confirm whether civilians were present in the building.
  - id: F8
    kind: authority
    status: confirmed
    fact: The commander instructed the B-1B to release bombs on the building.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Subsequent investigation indicated the strike likely resulted in civilian casualties and did not adhere to all specific
      guidance.
  - id: F10
    kind: intelligence
    status: assessed
    fact: The investigation concluded the strike complied with LOAC, but later strikes failed to follow the controlling directive,
      likely causing civilian casualties.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F6
    equity: own_force_life
    favors:
    - O3
    weight: weak
    why: The commander judged the moving formation matched Taliban orders and therefore constituted an imminent threat to
      friendly forces.
  - id: C2
    facts:
    - F7
    - F10
    - F4
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Neither the commander nor the bomber crew could positively confirm the absence of civilians, and the nearby medical
      clinic raises the probability of civilian casualties, violating the LOAC precautionary requirement.
  - id: C3
    facts:
    - F9
    - F10
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The post-strike investigation found the attack did not follow all elements of the controlling directive, making civilian
      harm likely despite a legal finding of compliance.
  - id: C4
    facts:
    - F10
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Civilian casualties run counter to the U.S. Government's stated aim of providing security for the Afghan population.
  - id: C5
    facts:
    - F1
    equity: tempo
    favors:
    - O3
    weight: weak
    why: Holding fire could leave the ground element exposed to continued hostile fire while a casualty-evacuation helicopter
      is en route.
  reasoning:
    read: The commander confronts a clear enemy threat but lacks reliable means to confirm that civilians are not present
      in the target building or the nearby clinic. The inability to verify civilian absence triggers the LOAC precautionary
      requirement, which outweighs the modest force-protection benefit.
    weighing: Strong considerations protecting civilian life (C2, C3, C4, NC1) dominate the weaker arguments for immediate
      force protection (C1, C5, NC2). Because the precautionary rule is a binding legal standard, the balance favors suspending
      the strike pending a thorough threat assessment.
    tradecraft: Record the hold-fire decision, note the lack of positive civilian identification, and task the intelligence
      cell with obtaining additional ISR or ground confirmation before any future engagement. Include the decision in the
      after-action report.
    uncertainty: The exact number of civilians possibly inside the mosque or the adjacent clinic remains unknown, as does
      the speed at which the enemy could re-engage the ground element.
    handoff: The commander should task the joint intelligence cell to acquire higher-resolution imagery or a ground reconnaissance
      element to verify civilian presence before revisiting the strike.
    tempting_wrong:
      option: O3
      pull: The apparent imminent enemy attack and the desire to protect own troops create pressure to strike now.
      why_wrong: Executing the strike without confirming civilian absence breaches LOAC precautionary obligations and the
        controlling directive, risking unlawful civilian harm.
    rejected:
      O1: Simply requesting more intelligence does not resolve the immediate decision; a hold-fire order is required now.
      O3: The strike would violate the precautionary requirement because civilian presence cannot be ruled out.
      O4: A complete refusal to strike eliminates the possibility of reassessing once reliable information is obtained.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Positive identification that no civilians are present in the mosque or the adjacent clinic.
      then: O3
      why: With civilian presence ruled out, the precautionary requirement is satisfied and the imminent threat can be lawfully
        engaged.
    would_not_change:
    - id: noflip1
      if: The enemy continues to fire directly on friendly forces while the building remains occupied by unknown persons.
      why: The inability to verify civilian absence still outweighs the immediate threat.
    watch_for:
    - id: watch1
      what: If the enemy exploits the hold-fire period to launch a larger coordinated attack, the commander must reassess
        the threat-vs-civilian-risk balance.
      favors:
      - O3
      why: Escalation of enemy action could shift the balance toward immediate engagement.
  lesson: When positive identification of civilians is lacking, LOAC obligates commanders to hold fire and seek additional
    intelligence, even if an enemy threat appears imminent.
  limits: This guidance applies only when civilian presence cannot be positively confirmed; it does not preclude striking
    if reliable ISR verifies civilian absence or when the threat directly targets friendly forces with no feasible alternative.
