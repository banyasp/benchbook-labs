case:
  id: DR-CORPUS-INC-CIVILIAN-CASUALTY-INCIDENT-REPORTING-NX-7cbe5573-E1@v1
  title: Assessment of Civilian-Casualty Allegations in Yemen
  status: draft
  setting: Yakla, al-Bayda, Yemen, January 28, 2017; State Department DRL assessment and recommendation
  decider: State Department DRL
  agent: State Department DRL
  agent_role: advise
  situation: Reports described civilian deaths following a U.S. operation in Yakla, Yemen, on January 28, 2017. The reported
    number of civilians killed was estimated at 15–16, and accounts also described deaths among women and children and damage
    to civilian facilities. Access to al-Bayda was limited, and Western media commonly relied on local media, medical organizations,
    NGOs, and UN officials. Local reporting could be exaggerated or biased, and the researcher who provided an account was
    outside Yemen and relied mainly on conversations and social-media sources. State DRL assessed its primary sources as reliable
    and faced a choice about whether to recommend further investigation by DOD.
  question: What should State Department DRL recommend to DOD about further investigation of the reported incident?
  options:
    O1:
      do: State DRL recommends that DOD decline further investigation of the reported incident.
      move: act
      irreversible: false
    O2:
      do: State DRL recommends that DOD investigate the reported incident further.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: An estimated 15–16 civilians were reported killed following a U.S. operation in Yakla, al-Bayda, Yemen, on January
      28, 2017.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Several reports described the death of a child and the death of a newborn after a pregnant woman was reportedly
      shot and gave birth.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A UN-OHCA-cited account reported that eight women and eight children were killed and that a school, mosque, and
      medical facility were struck.
  - id: F4
    kind: authority
    status: assessed
    fact: State had confidence in the reliability of the primary sources and recommended that DOD investigate the reported
      incident further.
  - id: F5
    kind: situation
    status: confirmed
    fact: Security challenges made Yemen difficult to access, and access to al-Bayda was limited.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Western media sources tended to rely on local media, medical organizations, NGOs, and UN officials; local Yemeni
      media could be exaggerated, biased, and influenced by political affiliations.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A U.S.-based Yemeni researcher had extensive contacts in Yemen and focused on civil society, human rights, security,
      and counterterrorism, but was not in Yemen and relied mainly on conversations and Yemeni social-media sources that could
      be biased or fueled by rumors.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The reports describe a substantial civilian death toll, including women and children, and deaths following injuries
      to a pregnant woman and her newborn. These serious allegations support further investigation, without establishing that
      every reported detail is confirmed.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: State had confidence in the reliability of the primary sources and expressly recommended that DOD investigate further.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Restricted access, potentially biased or exaggerated local reporting, and the researcher's reliance on conversations
      and social-media sources create uncertainty. These limitations caution against treating the allegations as established,
      but do not negate State's stated confidence in the primary sources or its recommendation to investigate.
  - id: C4
    facts:
    - F3
    equity: protected_sites
    favors:
    - O2
    weight: weak
    why: The cited account also alleges strikes on a school, mosque, and medical facility. Those reports add reason to investigate
      possible harm to protected or essential civilian sites, but the account alone does not establish what occurred.
  reasoning:
    read: DRL faced serious reports of civilian deaths and damage to civilian facilities, but limited access and weaknesses
      in some reporting channels meant allegations should not be treated as verified findings. The trap is to let uncertainty
      either erase the potential gravity of the reports or turn them into conclusions before investigation.
    weighing: The reported civilian harm and facility damage favor further investigation {C1} {C4}, and State's confidence
      in the primary sources and express recommendation are decisive {C2}. The reporting-environment limitations warrant caution
      about what can be concluded, but weigh less than the stated confidence supporting investigation {C3}.
    tradecraft: Recommend investigation as a means of resolving the reported incident, while keeping reported allegations
      distinct from verified findings. Record the basis for the recommendation and the stated source limitations so that later
      assessments do not overstate what is known.
    uncertainty: Security challenges made Yemen difficult to access, and access to al-Bayda was limited. Local Yemeni media
      could be exaggerated, biased, and influenced by political affiliations; the researcher was outside Yemen and relied
      mainly on conversations and social-media sources that could be biased or fueled by rumors. The incident's ultimate facts
      are not established here, and DOD's investigative results are not provided.
    handoff: DRL advises DOD, the office to which the recommendation is directed; no additional decision-maker whose approval
      is required is identified.
    tempting_wrong:
      option: O1
      pull: Limited access and reporting vulnerabilities could tempt DRL to recommend no further investigation.
      why_wrong: Those limitations counsel caution in assessing the allegations, but do not outweigh State's stated confidence
        in the primary sources and its recommendation for DOD to investigate.
    rejected:
      O1: DRL did not recommend declining investigation because it had confidence in the primary sources and recommended that
        DOD investigate the serious reported civilian harm further.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: DRL no longer had confidence in the reliability of the primary sources and there were no credible alternative reporting
        to support the allegations
      then: O1
      why: The stated basis for recommending further investigation would be substantially weakened.
    would_not_change:
    - id: noflip1
      if: Access to al-Bayda remained limited and local reporting continued to carry the described risk of bias or exaggeration
      why: Those limitations are already part of the stated assessment and do not displace the recommendation made despite
        them.
    watch_for:
    - id: watch1
      what: Whether further assessment corroborates or undermines the reported civilian deaths and damage to civilian facilities
      favors:
      - O2
      why: The allegations are serious, but their ultimate accuracy is not established; additional reliable information would
        help resolve that uncertainty.
  lesson: Serious reports of civilian harm can warrant investigation even when access is limited and reporting channels have
    known weaknesses. Preserve the distinction between a credible basis to investigate and a verified finding about what happened.
  limits: This recommendation concerns whether DOD should investigate the reported incident; it does not determine the incident's
    facts, legality, or the results of any investigation. No investigative outcome or legal analysis is provided.
  library:
    domain: intel-analysis
    family: CORPUS-INC-CIVILIAN-CASUALTY-INCIDENT-REPORTING
    source: https://assets.aclu.org/live/uploads/document/foia/DOSemailsandCIVCASreportattachment.pdf
