case:
  id: DR-CORPUS-INC-CIVILIAN-CASUALTY-INCIDENT-REPORTING-NX-dfb91357-E1@v1
  title: Estimating Noncombatant Casualties
  status: draft
  setting: USCENTCOM assessment of the assault-force casualties; place and date unstated.
  decider: The USCENTCOM assessment authority
  agent: The USCENTCOM assessment authority
  agent_role: decide
  situation: The USCENTCOM assessment authority is evaluating noncombatant casualty estimates arising from an assault. The
    assault force sustained casualties during an exchange of gunfire. Effective enemy fire came from all directions and continued
    until close air support partially suppressed it. The assault force worked in close quarters to distinguish noncombatants
    from enemy combatants. Combatants and noncombatants were intermingled, and a propane tank fire occurred during the engagement.
  question: What should the USCENTCOM assessment authority do about the noncombatant casualty estimate?
  options:
    O1:
      do: The USCENTCOM assessment authority should reject the estimate of 4 to 12 noncombatant casualties and record an alternative
        exact count.
      move: act
      irreversible: false
    O2:
      do: The USCENTCOM assessment authority should accept the estimate of 4 to 12 noncombatant casualties and record the
        exact count as indeterminable.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The assault force sustained four casualties, one fatal, in the exchange of gunfire.
  - id: F2
    kind: situation
    status: confirmed
    fact: The assault force was engaged by enemy fire from all directions.
  - id: F3
    kind: situation
    status: confirmed
    fact: Enemy fire continued until close air support partially suppressed it.
  - id: F4
    kind: situation
    status: confirmed
    fact: The assault force worked through close quarters to distinguish noncombatants from the enemy.
  - id: F5
    kind: situation
    status: confirmed
    fact: A propane tank fire occurred during the engagement.
  - id: F6
    kind: situation
    status: confirmed
    fact: Combatants were intermingled with noncombatants.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The assessment judged the exact casualty number indeterminable amid enemy fire from all directions, fire that continued
      until close air support partially suppressed it, a propane tank fire, and combatants intermingled with noncombatants.
      Recording a bounded estimate rather than an unsupported exact count preserves the stated uncertainty.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The assault force sustained four casualties, one fatal, while under effective enemy fire from all directions. These
      circumstances are part of the assessment's explanation for civilian casualties and support retaining its estimate without
      claiming greater precision than it has.
  - id: C3
    facts:
    - F4
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: The force worked in close quarters to distinguish noncombatants from enemy combatants, but combatants and noncombatants
      were intermingled. The stated effort to discriminate does not establish an exact civilian casualty count.
  - id: C4
    facts:
    - F2
    - F3
    - F5
    - F6
    equity: record_integrity
    favors:
    - O2
    weight: strong
    why: The assessment's endorsed record is a range of 4 to 12 noncombatant casualties, with the exact number indeterminable.
      Replacing that assessment with an alternative exact count would assert precision the stated reasons do not support.
  reasoning:
    read: This is an assessment of casualty numbers, not a separate judgment about how force was used. The trap is to mistake
      a bounded estimate for an exact count, or to infer from the force's effort to distinguish noncombatants that the count
      can be made exact.
    weighing: The assessment attributes civilian casualties to enemy fire from every direction, the propane tank fire, and
      combatants intermingled with noncombatants, despite the force working through close quarters to discriminate. The assault
      force's own casualties and the continued enemy fire until partial suppression further describe the engagement. Taken
      together with the assessment's finding that the exact number is indeterminable, these reasons support accepting the
      4-to-12 estimate and recording the uncertainty; the balance depends on there being no basis in this record for a more
      precise count.
    tradecraft: Record the 4-to-12 estimate and explicitly state that the exact count is indeterminable. Do not substitute
      an exact number unsupported by the assessment.
    uncertainty: The exact number of noncombatant casualties cannot be determined; the assessment gives a range of 4 to 12.
    handoff: The assessment authority's conclusion is the outcome to record. A request for the commanding general's review
      and endorsement is not itself an endorsement decision, so no separate decision by that office should be inferred.
    tempting_wrong:
      option: O1
      pull: An exact count may appear more definitive than a range.
      why_wrong: The assessment expressly judges the exact number indeterminable, and the stated engagement conditions do
        not support replacing its range with an alternative exact count.
    rejected:
      O1: The assessment did not choose an alternative exact count because it judged the exact number of noncombatant casualties
        indeterminable.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable additional evidence established an exact noncombatant casualty count.
      then: O1
      why: A supported exact count would remove the stated basis for retaining an indeterminable range and could justify recording
        an alternative exact count.
    would_not_change:
    - id: noflip1
      if: The force's effort to distinguish noncombatants from combatants were emphasized without any new evidence resolving
        the count.
      why: That effort is already part of the assessment's reasoning and does not make the exact casualty number determinable.
    watch_for:
    - id: watch1
      what: Whether additional reliable evidence narrows or resolves the casualty count.
      favors:
      - O1
      why: Evidence establishing an exact count could support replacing the estimate; absent that, the assessment's indeterminacy
        judgment remains.
  lesson: When the assessment gives a casualty range and expressly finds the exact number indeterminable, preserve both the
    estimate and its uncertainty. Do not convert a range into an exact count without evidence that supports the added precision.
  limits: This reasoning concerns the casualty estimate in this assessment only. It does not determine the legality or proportionality
    of force used, and it does not establish any separate commanding-general endorsement.
  library:
    domain: intel-analysis
    family: CORPUS-INC-CIVILIAN-CASUALTY-INCIDENT-REPORTING
