case:
  id: DR-CORPUS-INC-CIVILIAN-CASUALTY-INCIDENT-REPORTING-NS-49be4a73-E1@v1
  title: Assessment of a Reported Civilian-Casualty Incident Near Raqqah
  status: draft
  setting: Near Raqqah, Syria, July 2017, U.S.-led Coalition
  decider: U.S.-led Coalition
  agent: U.S.-led Coalition
  agent_role: decide
  situation: Civilian harm was reported in connection with an incident dated 8 March 2017 near Raqqah, Syria. The U.S.-led
    Coalition was assessing the reported civilian-casualty incident. In July 2017, the Coalition reviewed available information
    concerning the report. The assessment required a determination whether to substantiate or discount the report.
  question: What should the U.S.-led Coalition do in its July 2017 assessment of the reported civilian-casualty incident near
    Raqqah?
  options:
    O1:
      do: The U.S.-led Coalition should accept the civilian-casualty report as substantiated.
      move: act
      irreversible: false
    O2:
      do: The U.S.-led Coalition should reject the civilian-casualty report as unsubstantiated.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The incident date was 8 March 2017.
  - id: F2
    kind: situation
    status: confirmed
    fact: The incident was near Raqqah, Raqqa, Syria.
  - id: F3
    kind: situation
    status: confirmed
    fact: Civilian harm was reported in connection with the incident.
  - id: F4
    kind: situation
    status: confirmed
    fact: The report concerned civilian casualties.
  - id: F5
    kind: situation
    status: confirmed
    fact: The U.S.-led Coalition was the military actor associated with the assessment.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Coalition's civilian-casualty statement was dated 7 July 2017.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Coalition's assessment followed a review of available information.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: A report of civilian casualties warranted consideration in the assessment, but the source does not identify the report
      itself as sufficient to substantiate harm.
  - id: C2
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: After reviewing available information, the Coalition assessed that no Coalition strikes occurred in the geographic
      area corresponding to the casualty report.
  - id: C3
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The assessment's stated geographic finding was the basis for treating the report as unsubstantiated rather than attributing
      the reported casualties to Coalition action.
  reasoning:
    read: This was an assessment of a reported civilian-casualty incident dated 8 March 2017, not a decision whether to conduct
      a strike. The key issue was whether the Coalition's review connected the report to Coalition strikes in the relevant
      geographic area; the existence of the report alone did not establish that connection.
    weighing: The reported civilian harm called for assessment, but the Coalition's stated finding after reviewing available
      information was that no Coalition strikes occurred in the geographic area corresponding to the report. That finding
      supported discounting the report. The balance depends on the geographic finding; the source gives no further evidentiary
      detail or separate legal test.
    tradecraft: Record the disposition as unsubstantiated and preserve the stated geographic basis for it. Keep the reported
      allegation distinct from the assessment's finding, and do not rely on unrelated descriptions of strikes as a substitute
      for evidence about this incident.
    uncertainty: The source identifies the review's conclusion but does not describe the underlying information, review method,
      or degree of confidence.
    handoff: The Coalition made the assessment. No separate reviewer or referral is identified, so the source provides no
      basis to assign the decision to another authority.
    tempting_wrong:
      option: O1
      pull: A civilian-casualty report can create pressure to accept that harm occurred.
      why_wrong: The Coalition's stated assessment was that no Coalition strikes occurred in the geographic area corresponding
        to the report, so it discounted the report rather than substantiating it.
    rejected:
      O1: The Coalition did not substantiate the report because its review assessed that no Coalition strikes occurred in
        the corresponding geographic area.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable information established that a Coalition strike occurred in the relevant geographic area and connected
        it to the reported casualties.
      then: O1
      why: That would undermine the stated geographic basis for discounting the report and could support substantiating it.
    would_not_change: []
    watch_for: []
  lesson: A reported civilian-casualty incident should be assessed against the available information, not accepted or rejected
    solely because it was reported. When the stated basis for discounting a report is that no relevant Coalition strike occurred
    in the area, evidence changing that geographic finding may change the disposition.
  limits: This reasoning addresses only the Coalition's assessment of this reported incident and the stated geographic basis
    for its conclusion. The source does not establish a general evidentiary standard or explain the underlying review record.
