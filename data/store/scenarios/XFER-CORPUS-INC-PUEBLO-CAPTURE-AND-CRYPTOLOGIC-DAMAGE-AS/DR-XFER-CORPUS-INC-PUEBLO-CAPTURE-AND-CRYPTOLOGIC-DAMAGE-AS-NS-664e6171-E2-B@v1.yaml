case:
  id: DR-XFER-CORPUS-INC-PUEBLO-CAPTURE-AND-CRYPTOLOGIC-DAMAGE-AS-NS-664e6171-E2-B@v1
  title: Response to Stolen Badge-Issuing Records
  status: draft
  setting: Federal facility protection, March, at four high-security federal buildings and five lower-security leased offices;
    a federal protective agency.
  decider: The director of the federal protective agency
  agent: The director of the federal protective agency
  agent_role: decide
  situation: The agency has learned that master records used to issue access badges for four high-security federal buildings
    and five lower-security leased offices were stolen. Badges active from 1 through 24 March can no longer be trusted. Reissued
    badges for the leased offices have not yet been produced. At one building, floor plans and staff rosters had already been
    presumed taken in an earlier break-in, and analysts assess the badge-record loss there as incidental. Visitors can still
    enter for federal services through normal screening, which is unaffected by the badge arrangements. The director must
    decide how existing badges may be used while reissue is pending.
  question: What should the agency director do about use of existing badges while reissued badges are pending?
  options:
    O1:
      do: The agency director suspends existing badges at the high-security buildings and limits their use at the leased offices
        to minimized access pending reissue.
      move: act
      irreversible: false
    O2:
      do: The agency director permits normal badge access at the high-security buildings and leased offices while reissued
        badges are pending.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Master badge-issuing records for four high-security federal buildings were stolen.
  - id: F2
    kind: situation
    status: confirmed
    fact: Master badge-issuing records for five lower-security leased offices were stolen.
  - id: F3
    kind: situation
    status: confirmed
    fact: Badges active from 1 through 24 March can no longer be trusted.
  - id: F4
    kind: intelligence
    status: assessed
    fact: At one building, floor plans and staff rosters had been presumed taken in an earlier break-in.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Analysts assess the badge-record loss at that building as incidental because the floor plans and staff rosters were
      already presumed taken.
  - id: F6
    kind: situation
    status: confirmed
    fact: Reissued badges for the five leased offices have not yet been produced.
  - id: F7
    kind: situation
    status: confirmed
    fact: Visitors can enter for federal services through normal screening, which is unaffected by the badge arrangements.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The badge-issuing records were stolen, and badges active during the relevant period can no longer be trusted. Continuing
      normal use would leave facilities relying on badges whose integrity is uncertain.
  - id: C2
    facts:
    - F4
    - F5
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: At one building, the badge-record loss was assessed as incidental because floor plans and staff rosters were already
      presumed taken. That limits the additional exposure attributable to the badge-record loss, but does not settle how existing
      badges should be used elsewhere.
  - id: C3
    facts:
    - F2
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The leased offices are lower-security sites, and their reissued badges are not yet available. The interim choice
      is between normal use and a full stop on one hand, and minimized use pending reissue on the other.
  reasoning:
    read: 'The decision distinguishes the immediate response at high-security buildings from the interim response at lower-security
      leased offices. The central trap is treating the prior exposure at one building as the only issue: the directions also
      govern use of existing badges while replacements are pending. Visitor access for federal services continues through
      normal screening, which the badge arrangements do not affect.'
    weighing: The stolen records and the resulting lack of trust in active badges support restricting their use. The earlier
      break-in means the badge-record loss at one building was assessed as incidental, but that does not remove the need to
      address badge use at the high-security buildings. For the lower-security leased offices, their lesser significance supports
      minimizing rather than fully stopping badge use until reissued badges are available.
    tradecraft: Communicate the different directions clearly, identify which direction applies to each building or office,
      and keep minimized use in place at the leased offices until reissued badges are provided.
    uncertainty: The record identifies the actions under consideration and the assessment of incidental loss at one building,
      but does not explain the criteria used to distinguish the sites or specify exceptions to the directions.
    handoff: The agency director is responsible for the directions. The record identifies no separate approval or review role,
      so no additional handoff is supported.
    tempting_wrong:
      option: O2
      pull: Reissued badges for the leased offices were still pending, and the badge-record loss at one building was assessed
        as incidental.
      why_wrong: That assessment was limited to one building where floor plans and staff rosters were already presumed taken;
        it did not justify normal use of badges whose integrity was uncertain, and the directions distinguish the high-security
        buildings from the lower-security leased offices.
    rejected:
      O2: Normal use was not chosen because the agency director restricted use of badges whose integrity was uncertain while
        reissued badges were pending.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the master badge-issuing records had not in fact been stolen or compromised.
      then: O2
      why: Without the compromise that underlies the restrictions, the stated reason to suspend or minimize use of existing
        badges would be absent.
    would_not_change:
    - id: noflip1
      if: The floor plans and staff rosters at the one building remained presumed taken and the badge-record loss there remained
        assessed as incidental.
      why: That circumstance concerns the incremental significance of the badge-record loss at that building; it does not
        remove the need to address use of uncertain badges at the high-security buildings.
    watch_for:
    - id: watch1
      what: Whether reissued badges have been produced for the leased offices.
      favors:
      - O1
      why: The minimized-use direction was expressly pending reissue; receipt of replacement badges changes the basis for
        that interim restriction.
  lesson: When badge-issuing records are stolen, address both the exposure of past access and the risk of continued use of
    badges whose integrity is uncertain. A proportionate response can distinguish sites by security significance while restricting
    use until replacement badges are available.
  limits: This reasoning concerns the specific stolen records, assessments, and directions recorded here. It does not establish
    a general rule for other facilities, access systems, threat assessments, or authorities.
  library:
    domain: homeland security, federal facility protection
