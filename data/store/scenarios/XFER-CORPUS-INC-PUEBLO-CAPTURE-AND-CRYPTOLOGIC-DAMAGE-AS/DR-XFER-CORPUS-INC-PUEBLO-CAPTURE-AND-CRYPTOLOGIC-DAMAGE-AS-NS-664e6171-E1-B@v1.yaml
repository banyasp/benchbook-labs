case:
  id: DR-XFER-CORPUS-INC-PUEBLO-CAPTURE-AND-CRYPTOLOGIC-DAMAGE-AS-NS-664e6171-E1-B@v1
  title: An Inspection Team's Sensitive Kit
  status: draft
  setting: A declared nuclear facility in a rival state, during a treaty inspection visit; U.S. Treaty Inspection Mission.
  decider: U.S. Treaty Inspection Team Lead
  agent: U.S. Treaty Inspection Team Lead
  agent_role: decide
  situation: A U.S. treaty inspection team is preparing to visit a rival state's declared nuclear facility. The team's prescribed
    kit includes secure communications devices, associated materials, and classified references. The team lead regards the
    inspection as sensitive. Some devices are considered essential to reporting securely to U.S. authorities. Agency policy
    calls for minimizing material that could be compromised if the host seized the team's baggage. The team lead must determine
    what kit the team will carry into the visit.
  question: What should the U.S. Treaty Inspection Team Lead do with the team's prescribed secure devices and classified references
    before the inspection visit?
  options:
    O1:
      do: The team lead directs leaving the full prescribed secure kit in secure custody outside the host facility before
        the visit.
      move: act
      irreversible: false
    O2:
      do: The team lead directs leaving various secure devices and classified references in secure custody outside the host
        facility and carrying a limited kit.
      move: act
      irreversible: false
    O3:
      do: The team lead directs carrying the full prescribed secure kit into the host facility for the visit.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A U.S. treaty inspection team is preparing to visit a rival state's declared nuclear facility.
  - id: F2
    kind: situation
    status: confirmed
    fact: The prescribed team kit includes multiple secure communications devices, associated materials, and classified references.
  - id: F3
    kind: authority
    status: confirmed
    fact: The applicable treaty provisions do not specify which secure devices or classified references the inspection team
      may carry.
  - id: F4
    kind: situation
    status: assessed
    fact: The team lead regards the inspection as sensitive.
  - id: F5
    kind: capability
    status: assessed
    fact: The team lead considers some devices essential to reporting securely to U.S. authorities.
  - id: F6
    kind: authority
    status: confirmed
    fact: Agency policy calls for minimizing material that could be compromised if the host seized the team's baggage.
  considerations:
  - id: C1
    facts:
    - F4
    equity: security_risk
    favors:
    - O2
    - O1
    weight: strong
    why: The inspection's assessed sensitivity supports reducing the amount of secure material the team carries.
  - id: C2
    facts:
    - F6
    equity: source_protection
    favors:
    - O2
    - O1
    weight: strong
    why: Agency policy seeks to limit the secure material that could be compromised if the host seized the team's baggage.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: strong
    why: Some devices are considered essential to secure reporting, supporting carrying a limited kit rather than leaving
      everything behind.
  reasoning:
    read: 'This is a kit decision balancing secure reporting against the sensitive inspection''s exposure to compromise if
      the host seizes the team''s baggage. The trap is treating either concern as absolute: leaving everything behind would
      disregard devices considered essential, while carrying everything would disregard the policy of minimizing material
      at risk.'
    weighing: The inspection's sensitivity and the policy of limiting material at risk weigh against carrying the full kit
      {C1} {C2}. The assessed need for secure reporting weighs against leaving it all behind {C3}. The team lead should resolve
      that tension by leaving various items in secure custody and carrying a limited kit; the balance depends on which devices
      are essential and how much material should be exposed.
    tradecraft: 'Record the disposition and its rationale: carry only material considered essential for secure reporting,
      in light of the inspection''s sensitivity and the policy of minimizing material at risk if the host seizes the team''s
      baggage.'
    uncertainty: The stated reasons establish the balancing considerations but do not explain how each individual item was
      assessed or specify a rule for resolving future changes in need or risk.
    handoff: The U.S. Treaty Inspection Team Lead is the decision-maker. No further referral or consultation is identified
      as part of the stated rationale.
    tempting_wrong:
      option: O3
      pull: Carrying everything could appear to best preserve the team's ability to report securely.
      why_wrong: It would set aside the policy of minimizing the amount of material that could be compromised if the host
        seized the team's baggage.
    rejected:
      O1: Leaving the entire kit behind was not chosen because some devices were considered essential to secure reporting.
      O3: Carrying the entire kit was not chosen because agency policy calls for minimizing the amount of material at risk
        if the host seizes the team's baggage.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The team lead no longer considered any of the prescribed devices or materials essential to secure reporting.
      then: O1
      why: Without the stated reason for carrying any kit, leaving all of it behind could better serve the policy of minimizing
        exposure.
    - id: flip2
      if: The team lead assessed that the full prescribed kit was essential to secure reporting.
      then: O3
      why: That assessment would strengthen the reporting need that weighs against limiting the kit.
    would_not_change:
    - id: noflip1
      if: The inspection remained sensitive and some devices remained essential, but the kit included additional classified
        reference publications.
      why: The stated decision still turns on balancing essential secure reporting needs against limiting material at risk,
        not on the mere presence of supporting references.
    watch_for:
    - id: watch1
      what: A changed assessment of which devices or materials are essential to secure reporting.
      favors:
      - O1
      - O3
      why: A broader essential need could support carrying more, while a narrower need could support a more limited kit.
  lesson: When secure material is both needed for reporting and vulnerable to compromise, weigh operational necessity against
    the amount exposed. Carry what is considered essential while limiting unnecessary exposure.
  limits: This reasoning applies to the stated inspection-kit decision and its stated concerns. It does not establish a general
    rule for inspection-team equipment or resolve decisions involving different reporting needs, risks, or authority.
