case:
  id: DR-XFER-CORPUS-INC-PUEBLO-CAPTURE-AND-CRYPTOLOGIC-DAMAGE-AS-NS-664e6171-E1-A@v1
  title: An Embassy's Classified Holdings
  status: draft
  setting: Lydora, September 2024; Embassy of Norvale and Norvale Ministry of Foreign Affairs.
  decider: Regional Security Officer
  agent: Regional Security Officer
  agent_role: decide
  situation: Security conditions in Lydora's capital are deteriorating, and the embassy is continuing its work at post. The
    country team regards the post's current work as sensitive. Headquarters has asked posts to minimize holdings that could
    be compromised if a compound were overrun. The embassy holds classified material and secure terminals for its work. The
    Regional Security Officer considers some holdings essential for secure communications with headquarters. The officer must
    decide how much classified material and how many secure terminals will remain at the embassy.
  question: What should the Regional Security Officer do with the embassy's classified holdings and secure terminals while
    the post remains open?
  options:
    O1:
      do: The Regional Security Officer directs removing all classified holdings and secure terminals from the post.
      move: act
      irreversible: false
    O2:
      do: The Regional Security Officer directs removing selected classified holdings and secure terminals from the post while
        retaining a limited set.
      move: act
      irreversible: false
    O3:
      do: The Regional Security Officer directs retaining all classified holdings and secure terminals at the post.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Security conditions in Lydora's capital are deteriorating, and the embassy is continuing its work at post.
  - id: F2
    kind: situation
    status: confirmed
    fact: The embassy's holdings include classified material and secure terminals.
  - id: F3
    kind: situation
    status: confirmed
    fact: The holdings also include classified reference publications supporting the post's work.
  - id: F4
    kind: situation
    status: assessed
    fact: The country team regards the post's current work as sensitive.
  - id: F5
    kind: situation
    status: assessed
    fact: The Regional Security Officer considers some holdings essential for secure communications with headquarters.
  - id: F6
    kind: authority
    status: confirmed
    fact: Headquarters has asked posts to minimize holdings that could be compromised if a compound were overrun.
  considerations:
  - id: C1
    facts:
    - F4
    equity: security_risk
    favors:
    - O2
    - O1
    weight: strong
    why: The assessed sensitivity of the post's work supports reducing the classified holdings kept there.
  - id: C2
    facts:
    - F6
    equity: source_protection
    favors:
    - O2
    - O1
    weight: strong
    why: Headquarters has asked the post to minimize holdings that could be compromised in an overrun.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: strong
    why: Some holdings are considered essential for secure communications, supporting retention of a limited set rather than
      removing everything.
  reasoning:
    read: 'This is a holdings decision balancing secure communications against the risk of classified material being compromised
      if the compound is overrun. The trap is treating either concern as absolute: removing everything would disregard holdings
      considered essential, while retaining everything would disregard the request to minimize what could be compromised.'
    weighing: The sensitivity of the post's work and the request to limit holdings that could be compromised weigh against
      keeping the full set {C1} {C2}. The assessed need for secure communications weighs against removing everything {C3}.
      The Regional Security Officer resolves that tension by removing selected holdings and retaining a limited set; the balance
      depends on which holdings are essential and how much material should remain exposed.
    tradecraft: 'Record the disposition and its rationale: retain only holdings considered essential for secure communications,
      in light of the sensitivity of the post''s work and the request to minimize holdings that could be compromised.'
    uncertainty: The stated reasons establish the balancing considerations but do not explain how each individual holding
      was assessed or specify a rule for resolving future changes in need or risk.
    handoff: The Regional Security Officer is the decision-maker. No further referral or consultation is identified as part
      of the stated rationale.
    tempting_wrong:
      option: O3
      pull: Keeping everything could appear to best preserve secure communications with headquarters.
      why_wrong: It would set aside the request to minimize the holdings that could be compromised if the compound were overrun.
    rejected:
      O1: Removing all holdings was not chosen because some are considered essential for secure communications with headquarters.
      O3: Keeping all holdings was not chosen because headquarters has asked posts to minimize what could be compromised in
        an overrun.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Regional Security Officer no longer considered any of the embassy's holdings essential for secure communications
        with headquarters.
      then: O1
      why: Without the stated reason for retaining any holdings, removing all of them could better serve the request to minimize
        exposure.
    - id: flip2
      if: The Regional Security Officer assessed that the full set of classified holdings and secure terminals was essential
        for secure communications with headquarters.
      then: O3
      why: That assessment would strengthen the communications need that weighs against limiting the holdings.
    would_not_change:
    - id: noflip1
      if: The post's work remained sensitive and some holdings remained essential, but the holdings included additional classified
        reference publications.
      why: The stated decision still turns on balancing essential communications needs against limiting holdings that could
        be compromised, not on the mere presence of additional reference publications.
    watch_for:
    - id: watch1
      what: A changed assessment of which holdings are essential for secure communications with headquarters.
      favors:
      - O1
      - O3
      why: A broader essential need could support retaining more, while a narrower need could support a more limited set.
  lesson: When classified holdings are both needed for secure communications and vulnerable to compromise, weigh operational
    necessity against the amount exposed. Retain what is considered essential while limiting unnecessary exposure.
  limits: This reasoning applies to the stated decision about the embassy's holdings while the post remains open and to its
    stated concerns. It does not establish a general holdings rule or resolve decisions involving different communications
    needs, risks, or authority.
