case:
  id: DR-CORPUS-NX-7d97d8bb-E1@v1
  title: Telemetry Freedom and Treaty Verification
  status: draft
  setting: United States–Soviet treaty process, June 1979; SALT II.
  decider: The United States and Soviet Union, acting through their treaty leaders.
  agent: The United States and Soviet Union, acting through their treaty leaders
  agent_role: decide
  situation: The United States and Soviet Union were negotiating strategic-arms limits. An earlier interim agreement barred
    deliberate concealment measures that impeded verification of compliance, while stating that the obligation did not require
    changes to existing construction, assembly, conversion, or overhaul practices. In June 1979, the President and the Soviet
    General Secretary signed SALT II with wording clarifying that the telemetry segment formed part of the treaty. The parties
    added a common understanding concerning transmission of telemetry during testing, including encryption, subject to a treaty-compliance
    verification condition. The understanding referred to Article XV, paragraph 3, and some treaty terms remained unclear.
  question: What should the United States and Soviet Union, acting through their treaty leaders, do about the telemetry understanding
    in SALT II?
  options:
    O1:
      do: The United States and Soviet Union permit varied telemetry methods, including encryption, and permit deliberate
        denial that impedes treaty-compliance verification.
      move: act
      irreversible: true
    O2:
      do: The United States and Soviet Union permit varied telemetry methods, including encryption, but prohibit deliberate
        denial that impedes treaty-compliance verification.
      move: act
      irreversible: true
    O3:
      do: The United States and Soviet Union defer the telemetry understanding and continue negotiations over transmission
        methods and verification restrictions.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In May 1972, the President and the Soviet General Secretary signed an interim agreement on strategic offensive arms
      limitations.
  - id: F2
    kind: authority
    status: confirmed
    fact: The interim agreement barred deliberate concealment measures that impeded verification of compliance.
  - id: F3
    kind: authority
    status: confirmed
    fact: The interim agreement's verification obligation did not require changes to current construction, assembly, conversion,
      or overhaul practices.
  - id: F4
    kind: situation
    status: confirmed
    fact: In June 1979, the President and the Soviet General Secretary signed SALT II with minor wording changes clarifying
      that the telemetry segment was part of the treaty.
  - id: F5
    kind: situation
    status: confirmed
    fact: The parties added a Second Common Understanding to SALT II.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Second Common Understanding allowed each party to use various methods of transmitting telemetry during testing,
      including encryption.
  - id: F7
    kind: authority
    status: confirmed
    fact: The understanding prohibited either party from deliberately denying telemetry when that denial impeded verification
      of treaty compliance, subject to Article XV, paragraph 3.
  - id: F8
    kind: situation
    status: assessed
    fact: Some terms in the treaty language were not exactly clear.
  considerations:
  - id: C1
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: The understanding expressly prohibits deliberate denial of telemetry when it impedes verification of treaty compliance,
      subject to Article XV, paragraph 3; that rules out permitting such denial.
    rules_out:
    - O1
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The parties preserved freedom to choose transmission methods, including encryption, while drawing the restriction
      at deliberate denial that impedes verification. O2 reflects both parts of that choice.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The earlier interim agreement likewise barred deliberate concealment that impeded verification, while not requiring
      changes to specified existing practices. This supports a verification-focused restriction rather than an unrestricted
      right to obstruct verification.
  reasoning:
    read: The understanding distinguishes permission to choose telemetry transmission methods, including encryption, from
      deliberate denial that impedes verification of treaty compliance. The trap is to treat permission to encrypt as permission
      to obstruct verification, or to treat the verification restriction as a blanket ban on encryption. The understanding
      also makes its restriction subject to Article XV, paragraph 3, and some treaty terms were unclear.
    weighing: 'The controlling balance is stated in the understanding: preserve each party''s choice of transmission methods,
      but prohibit deliberate denial when it impedes verification {C1} {C2}. The earlier interim agreement reflects a similar
      verification-focused limit, with an express protection for existing practices {C3}. The balance depends on whether denial
      impedes verification and on the qualification in Article XV, paragraph 3.'
    tradecraft: Record the distinction between transmission methods and deliberate denial, and identify the treaty-compliance
      verification condition and Article XV qualification in any implementation guidance. Do not expand the agreement into
      a blanket restriction on encryption or into permission to impede verification.
    uncertainty: Some treaty terms were not exactly clear. The understanding refers to Article XV, paragraph 3, but the available
      text does not explain how that qualification applies in particular cases.
    handoff: The treaty leaders are the decision-makers reflected in the agreement. For any unresolved application of Article
      XV, paragraph 3, involve the appropriate treaty and legal advisers before treating the qualification as changing the
      stated verification restriction.
    tempting_wrong:
      option: O1
      pull: It emphasizes the express freedom to use varied transmission methods, including encryption.
      why_wrong: 'That freedom is qualified: the understanding prohibits deliberate denial when it impedes verification of
        compliance.'
    rejected:
      O1: It would permit the very deliberate denial that the understanding prohibits when it impedes verification.
      O3: The parties' stated understanding already supplies the governing balance, so deferring the understanding is not
        the endorsed outcome.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The parties expressly amended the understanding to permit deliberate denial even when it impedes verification of
        treaty compliance.
      then: O1
      why: That amendment would remove the stated restriction that makes O2 the treaty-level choice.
    - id: flip2
      if: The parties could not resolve a material question about how Article XV, paragraph 3, applies before adopting the
        understanding.
      then: O3
      why: Deferring would preserve the opportunity to settle the qualification's meaning rather than adopt an unresolved
        restriction.
    would_not_change:
    - id: noflip1
      if: A party uses encryption without deliberately denying telemetry in a way that impedes verification.
      why: The understanding expressly allows encryption and restricts deliberate denial that impedes verification, so this
        circumstance remains consistent with O2.
    watch_for:
    - id: watch1
      what: Whether clarification of the treaty terms or Article XV, paragraph 3, changes how the verification qualification
        applies.
      favors:
      - O3
      why: The terms were not exactly clear, and the understanding is expressly subject to Article XV, paragraph 3.
  lesson: Preserve the distinction between freedom to choose a method and permission to obstruct a treaty's verification condition.
    A calibrated restriction can protect verification without imposing a broader constraint than the parties stated.
  limits: This reasoning concerns the treaty-level choice in the Second Common Understanding, not the technical collection
    or analysis of telemetry. It does not resolve the meaning of Article XV, paragraph 3, or other unclear treaty terms.
  library:
    domain: intel-oversight
    family: CORPUS-NX-7d97d8bb
    source: https://media.defense.gov/2021/Jul/13/2002762040/-1/-1/0/TELINT-9-19-2016.PDF
    episode_focus: The Second Common Understanding allowed each party to use different methods of transmitting telemetry,
      including encryption, but prohibited deliberate denial when it impeded verification of treaty compliance. Treat this
      as a treaty-level choice balancing freedom over test telemetry against verification; exclude the technical means of
      collecting or analyzing telemetry.
