case:
  id: DR-CORPUS-NS-70619a3d-E14@v1
  title: NATO Campaign Continuation Decision
  status: draft
  setting: Kosovo, May 1999, NATO leadership.
  decider: NATO leaders
  agent: NATO leaders
  agent_role: decide
  situation: During NATO's air campaign, several allied governments proposed temporary bombing halts. NATO commanders regarded
    alliance cohesion as essential to success, while allied countries had differing perspectives on the war. Political constituencies
    in Italy, Greece, and Germany had significant doubts about the bombing, and limiting civilian casualties and collateral
    damage was important to limiting active opposition. In Germany, civilian casualties were politically sensitive for a coalition
    government that depended on its Green Party partner. The Greens rejected an immediate and unconditional end to the bombing
    and instead backed a limited halt. NATO leaders faced the choice of continuing the campaign, with escalation in May, or
    imposing a temporary halt.
  question: What should NATO leaders do about the proposed temporary bombing halts while pursuing settlement and preserving
    alliance cohesion?
  options:
    O1:
      do: NATO leaders temporarily halt the bombing campaign.
      move: act
      irreversible: false
    O2:
      do: NATO leaders continue bombing, escalating in May.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Several allied governments proposed temporary bombing halts.
  - id: F2
    kind: situation
    status: confirmed
    fact: Maintaining Alliance cohesion was a major objective of NATO commanders and was described as essential to eventual
      success.
  - id: F3
    kind: situation
    status: assessed
    fact: Limiting allied casualties, civilian casualties, and collateral damage was crucial to limiting active opposition
      to the war in allied countries with significant doubts about the bombing.
  - id: F4
    kind: situation
    status: confirmed
    fact: Civilian casualties were a particularly sensitive issue for the German coalition government, which depended on continued
      support from its Green Party partner.
  - id: F5
    kind: situation
    status: confirmed
    fact: On May 13, 1999, the Greens rejected a motion for an immediate and unconditional end to the bombing and adopted
      a motion calling for a limited halt by a vote of 444 to 318.
  - id: F6
    kind: situation
    status: assessed
    fact: The pressure strategy relied on the prospect of further bombing if settlement terms were refused.
  - id: F7
    kind: situation
    status: assessed
    fact: NATO's air operations were assessed as having confounded efforts by the opposing leadership to erode allied support
      for the war.
  considerations:
  - id: C1
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The pressure strategy depended on the credible prospect of further bombing if settlement terms were refused; the
      May escalation increased Milosevic's propensity to yield.
  - id: C2
    facts:
    - F2
    - F7
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Alliance cohesion was essential to success, and NATO's air operations confounded efforts to erode allied support.
      NATO maintained pressure despite proposals for temporary halts.
  - id: C3
    facts:
    - F1
    - F3
    - F4
    - F5
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Civilian and allied casualties could fuel opposition in countries already doubtful about the bombing; Germany's political
      sensitivity and allied proposals for pauses create a genuine pull toward a halt. The effect of a halt on those political
      risks is not established.
  reasoning:
    read: 'The choice is not simply between pressure and alliance cohesion: cohesion was essential to success, while allied
      doubts and civilian-casualty concerns could undermine support. The trap is to assume either that every proposed pause
      would preserve cohesion or that continuing pressure would automatically maintain it.'
    weighing: Continuing pressure is favored because alliance cohesion was a sine qua non of success, and the May escalation
      increased Milosevic's propensity to yield and made further bombing credible if settlement terms were refused {C1} {C2}.
      Political and civilian-harm concerns favor accommodation to some degree {C3}, but limiting casualties was identified
      as important to limiting opposition; a temporary halt was not established as the answer. The balance depends on pressure
      remaining credible while allied support and cohesion remain sustainable.
    tradecraft: State the settlement purpose and the alliance-cohesion rationale to allied governments, record why continued
      pressure is judged necessary, and reassess the decision as evidence about allied support, civilian harm, and settlement
      prospects changes. Keep this review at the political decision level rather than turning it into guidance on strike execution.
    uncertainty: It is unclear whether a temporary halt would have improved cohesion or whether continued pressure would have
      produced the same settlement response without the May escalation. No quantified threshold is given for when political
      opposition would outweigh the expected settlement effect.
    handoff: NATO leaders should decide with consultation among allied governments because alliance cohesion is central to
      the rationale and allied governments had proposed pauses. No separate authority is identified as able to displace the
      leaders' decision.
    tempting_wrong:
      option: O1
      pull: A temporary halt could appear to accommodate allies facing political doubts and sensitivity about civilian casualties.
      why_wrong: Maintaining pressure was credited with increasing the propensity to yield and making further bombing credible
        if settlement terms were refused.
    rejected:
      O1: A temporary halt was not chosen because NATO maintained pressure, and the May escalation strengthened the prospect
        of settlement.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Evidence showed that continued pressure was no longer improving settlement prospects and was instead making alliance
        cohesion unsustainable.
      then: O1
      why: Pressure would no longer serve the settlement objective and could gravely endanger the alliance cohesion essential
        to success, shifting the balance toward a halt.
    would_not_change:
    - id: noflip1
      if: Allied governments proposed temporary bombing halts, without additional evidence that continued pressure had ceased
        to serve settlement or was breaking alliance cohesion.
      why: NATO maintained pressure despite temporary-halt proposals; the proposals alone did not change the chosen course.
    watch_for:
    - id: watch1
      what: Whether civilian casualties and collateral damage are increasing active opposition in allied countries, especially
        where political support is already fragile.
      favors:
      - O1
      why: Limiting casualties and collateral damage was crucial to limiting active opposition.
    - id: watch2
      what: Whether continued pressure is still increasing the prospect of settlement and keeping further consequences credible
        if terms are refused.
      favors:
      - O2
      why: These are the settlement effects attributed to the May escalation.
  lesson: When alliance cohesion is essential to success, evaluate pauses not only as gestures of accommodation but also by
    whether they preserve credible leverage toward settlement. Political sensitivity and civilian-harm concerns remain important
    constraints on sustaining support and should be reassessed as the decision evolves.
  limits: This reasoning applies to the Kosovo campaign in May 1999, where continued pressure was assessed as strengthening
    the prospect of settlement. It does not establish that escalation is generally effective, lawful, or preferable to a pause
    in other circumstances.
