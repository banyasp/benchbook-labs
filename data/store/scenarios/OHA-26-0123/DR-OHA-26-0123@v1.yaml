case:
  id: DR-OHA-26-0123@v1
  title: Restoration of Security Clearance after Drug Involvement
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, October 22 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual holds a DOE security clearance and has been the subject of an administrative review. The Local
    Security Office raised security concerns under Guideline H (drug involvement) and Guideline E (personal conduct) and invoked
    the Bond Amendment to revoke the clearance. The Individual disclosed past marijuana use from 2016 to 2022 and two instances
    of psychedelic mushroom use in 2022, and asserted she stopped using any illicit substances in July 2022. In January 2026
    the Individual unintentionally consumed cookies made with cannabis butter, tested positive for marijuana metabolite, and
    immediately reported the incident to her supervisor and underwent a drug test. Subsequent drug tests in February and August
    2026 were negative, and the Individual has taken steps to avoid drug‑using associates, including ending a close friendship
    and relocating to another state. DOE regulations, 10 C.F.R. § 710, create a presumption against granting or restoring
    a security clearance. The Administrative Judge must decide whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do with the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual used marijuana recreationally from January 2016 to July 2022, about twenty‑five times in total.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual used psychedelic mushrooms twice between May 2022 and June 2022.
  - id: F3
    kind: situation
    status: confirmed
    fact: In late January 2026 the Individual unintentionally ate cookies made with cannabis butter, resulting in a positive
      marijuana metabolite test.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual immediately reported the accidental ingestion to her supervisor and was directed to undergo a drug
      test.
  - id: F5
    kind: situation
    status: confirmed
    fact: Drug tests taken in February 2026 and August 2026 were negative for marijuana metabolites.
  - id: F6
    kind: situation
    status: confirmed
    fact: Since July 2022 the Individual has not used marijuana or psychedelic mushrooms and has taken steps to avoid drug‑using
      associates, including ending a close friendship and moving to a different state.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline H, Guideline E, and invoked the Bond Amendment
      to revoke the Individual’s clearance.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations, 10 C.F.R. § 710, create a presumption against granting or restoring a security clearance.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The judge found the Individual was not an unlawful user under the Bond Amendment because the accidental ingestion
      was unintentional, she reported it immediately, and subsequent tests were negative, showing no loss of self‑control.
  - id: C2
    facts:
    - F1
    - F2
    - F6
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline H concerns are mitigated by the long elapsed time, infrequency of past use, and the Individual’s abstinence
      since 2022, satisfying mitigating factor (a).
  - id: C3
    facts:
    - F4
    - F6
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: Guideline E concerns are mitigated because the Individual promptly reported the incident, disassociated from drug‑using
      friends, and relocated to avoid future exposure, meeting mitigating factor (g).
  - id: C4
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: Although 10 C.F.R. § 710 creates a presumption against restoration, the judge applied the presumption but found the
      mitigating evidence outweighed it.
  - id: C5
    facts:
    - F5
    equity: record_integrity
    favors:
    - O3
    weight: strong
    why: Negative drug tests after the January 2026 incident demonstrate continued compliance and support the conclusion that
      the Individual is not currently using controlled substances.
  reasoning:
    read: The case hinges on whether the accidental marijuana exposure in January 2026 and the Individual’s historic drug
      use constitute a disqualifying security risk under Guideline H and Guideline E, and whether the Bond Amendment bars
      restoration.
    weighing: The Administrative Judge weighed the strong mitigating factors—unintentional ingestion, immediate self‑reporting,
      abstinence since 2022, disassociation from drug‑using contacts, and negative follow‑up tests—against the statutory presumption
      against restoration. Citing the source, the judge concluded that the concerns were resolved and that restoring the clearance
      would not endanger the common defense.
    tradecraft: The decision is recorded in the official OHA decision memorandum, cited to the relevant CFR provisions and
      Adjudicative Guidelines, and communicated to the LSO for implementation.
    uncertainty: Minimal; the record provides clear evidence of abstinence and corrective actions, leaving little doubt about
      future reliability.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.25(d)-(g).
    tempting_wrong:
      option: O1
      pull: The presumption against granting a clearance could tempt a denial.
      why_wrong: Denial would ignore the substantial mitigating evidence and the Individual’s demonstrated responsibility.
    rejected:
      O1: Denied restoration would contradict the judge’s finding that the Bond Amendment does not apply and that Guideline
        H and E concerns are mitigated.
      O2: Holding the decision pending adds no value because the record already contains sufficient evidence to resolve the
        concerns.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Evidence showed the Individual used a controlled substance after the January 2026 incident.
      then: O1
      why: Continued use would indicate loss of self‑control and re‑activate the Bond Amendment prohibition.
    would_not_change:
    - id: noflip1
      if: The Individual did not provide a signed statement of intent to abstain (mitigating factor 26(b)(3) was missing).
      why: The judge already determined that the lack of a signed statement does not prevent restoration because other mitigating
        factors were sufficient.
    watch_for:
    - id: watch1
      what: Any future positive drug test or admission of use.
      favors:
      - O1
      why: A new positive test would revive the security concerns under Guideline H and the Bond Amendment.
  lesson: When an accidental drug exposure is promptly reported and the individual demonstrates sustained abstinence, disassociation
    from drug‑using contacts, and negative follow‑up tests, the security concerns under Guideline H and E can be mitigated
    sufficiently to restore a clearance despite the statutory presumption against it.
  limits: This reasoning applies only where the ingestion was truly inadvertent, the individual has a documented record of
    abstinence, and no further drug use is discovered. It does not extend to intentional or repeated violations.
