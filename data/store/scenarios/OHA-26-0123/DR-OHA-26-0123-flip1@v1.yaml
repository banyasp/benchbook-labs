case:
  id: DR-OHA-26-0123-flip1@v1
  title: Restoration of Security Clearance after Drug Involvement [flip]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, 22 October 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The employee holds a DOE security clearance that was revoked after the Local Security Office cited Guideline
    H (drug involvement) and Guideline E (personal conduct) and invoked the Bond Amendment. The employee admitted past marijuana
    use from 2016-2022 and two instances of psychedelic mushroom consumption in 2022, claiming cessation in July 2022. In
    January 2026 the employee unintentionally consumed cannabis-infused cookies, tested positive for marijuana metabolites,
    and reported the incident immediately. Subsequent testing in February was negative, but a test in August 2026 returned
    positive. The employee has taken steps to distance herself from drug-using contacts, ending a close friendship and relocating
    to another state. DOE regulation 10 C.F.R. § 710 creates a presumption against granting or restoring a clearance. The
    Administrative Judge must decide whether to restore the employee's access authorization.
  question: What should the Administrative Judge do with the employee's access authorization?
  options:
    O1:
      do: The Administrative Judge denies restoration of the employee's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge restores the employee's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee used marijuana recreationally from January 2016 through July 2022, about twenty-five times in total.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee consumed psychedelic mushrooms on two occasions in May-June 2022.
  - id: F3
    kind: situation
    status: confirmed
    fact: In late January 2026 the employee unintentionally ate cookies containing cannabis butter, resulting in a positive
      marijuana-metabolite test.
  - id: F4
    kind: situation
    status: confirmed
    fact: She promptly informed her supervisor of the accidental ingestion and was instructed to undergo a drug test.
  - id: F5
    kind: situation
    status: confirmed
    fact: A drug test taken in August 2026 was positive for marijuana metabolites.
  - id: F6
    kind: situation
    status: confirmed
    fact: After the January 2026 incident, the Individual tested positive for marijuana metabolites in August 2026, indicating
      continued use, though she had otherwise avoided drug‑using associates.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline H (drug involvement), Guideline E (personal conduct), and applied the
      Bond Amendment to revoke the clearance.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulation 10 C.F.R. § 710 establishes a presumption against granting or restoring a security clearance.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The August 2026 positive test demonstrates that the employee continued using a controlled substance after the January
      incident, satisfying the Bond Amendment's prohibition on individuals lacking self-control.
  - id: C2
    facts:
    - F1
    - F2
    - F6
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Guideline H concerns are not mitigated because the recent positive test shows the employee has not maintained the
      required abstinence, negating mitigating factor (a).
  - id: C3
    facts:
    - F4
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Although the employee reported the January incident, the subsequent positive test undermines the credibility of her
      self-reporting and indicates ongoing conduct contrary to Guideline E.
  - id: C4
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The statutory presumption against restoration remains uncountered by sufficient mitigating evidence, so the default
      position is denial.
  - id: C5
    facts:
    - F5
    equity: record_integrity
    favors:
    - O1
    weight: strong
    why: The August 2026 positive drug test evidences current illicit use, compromising the integrity of the security record.
  reasoning:
    read: The pivotal question is whether the confirmed positive drug test in August 2026 establishes ongoing illicit use
      that triggers the Bond Amendment and renders the employee ineligible for clearance restoration.
    weighing: The Administrative Judge gave decisive weight to the August positive result, which demonstrates a breach of
      self-control and invalidates the mitigating factors previously cited. Accordingly, the presumption against restoration
      stands.
    tradecraft: The decision is recorded in the official OHA memorandum, citing the relevant CFR provisions and adjudicative
      guidelines, and forwarded to the LSO for implementation.
    uncertainty: Moderate; the positive test provides clear evidence of continued use, leaving little doubt about future reliability.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.25(d)-(g).
    tempting_wrong:
      option: O3
      pull: The narrative of accidental exposure and prior abstinence might suggest that restoration is permissible.
      why_wrong: Restoring the clearance would ignore the recent confirmed use, violating security standards and the Bond
        Amendment.
    rejected:
      O2: Holding the decision pending adds no value because the record already contains decisive evidence of ongoing use.
      O3: Restoring the clearance would conflict with the Bond Amendment and the statutory presumption against granting to
        users of controlled substances.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Evidence confirms that the employee has had no positive drug tests after the January 2026 incident.
      then: O3
      why: Absence of further use would demonstrate sustained abstinence, allowing the Bond Amendment to be inapplicable and
        supporting restoration.
    would_not_change:
    - id: noflip1
      if: The employee did not provide a signed statement of intent to abstain (mitigating factor 26(b)(3) was missing).
      why: The judge already determined that the lack of a signed statement does not prevent restoration because other mitigating
        factors were sufficient.
    watch_for:
    - id: watch1
      what: Any future positive drug test or admission of use.
      favors:
      - O1
      why: A new positive test would revive the security concerns under Guideline H and the Bond Amendment.
  lesson: When a positive drug test occurs after an alleged accidental exposure, the security concerns under Guideline H and
    Guideline E are not mitigated, and the statutory presumption against restoration prevails, leading to denial of the clearance.
  limits: This reasoning applies only where there is documented evidence of continued illicit use after the incident; it does
    not apply where the only exposure was truly accidental and no subsequent positive tests are found.
