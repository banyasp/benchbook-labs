case:
  id: DR-OHA-26-0123-revise1@v1
  title: Restoration of Security Clearance after Drug Involvement [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, October 22 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual holds a DOE security clearance and has been the subject of an administrative review. The Local
    Security Office raised security concerns under Guideline H (drug involvement) and Guideline E (personal conduct) and invoked
    the Bond Amendment to revoke the clearance. The Individual disclosed past marijuana use from 2016 to 2022 and two instances
    of psychedelic mushroom use in 2022, and asserted she stopped using any illicit substances in July 2022. In January 2026
    the Individual unintentionally consumed cookies made with cannabis butter, tested positive for marijuana metabolite, and
    immediately reported the incident to her supervisor and underwent a drug test. Subsequent drug tests in February and August
    2026 were negative, and the Individual has taken steps to avoid drug‑using associates, including ending a close friendship
    and relocating to another state. DOE regulations, 10 C.F.R. § 710, create a presumption against granting or restoring
    a security clearance. The Administrative Judge must decide whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do with the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual used marijuana recreationally from January 2016 to July 2022, about twenty‑five times in total.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual used psychedelic mushrooms twice between May 2022 and June 2022.
  - id: F3
    kind: situation
    status: confirmed
    fact: In late January 2026 the Individual unintentionally ate cookies made with cannabis butter, resulting in a positive
      marijuana metabolite test.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual immediately reported the accidental ingestion to her supervisor and was directed to undergo a drug
      test.
  - id: F5
    kind: situation
    status: confirmed
    fact: Drug tests taken in February 2026 and August 2026 were negative for marijuana metabolites.
  - id: F6
    kind: situation
    status: confirmed
    fact: Since July 2022 the Individual has not used marijuana or psychedelic mushrooms and has taken steps to avoid drug‑using
      associates, including ending a close friendship and moving to a different state.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline H, Guideline E, and invoked the Bond Amendment
      to revoke the Individual’s clearance.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations, 10 C.F.R. § 710, create a presumption against granting or restoring a security clearance.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The accidental ingestion is factual, but the strong statutory presumption and the history of drug use limit its persuasive
      force.
  - id: C2
    facts:
    - F1
    - F2
    - F6
    equity: due_process
    favors:
    - O3
    weight: weak
    why: Although past use was infrequent and dated, the mere existence of historic illicit drug behavior under Guideline
      H sustains a residual security concern.
  - id: C3
    facts:
    - F4
    - F6
    equity: duty_to_individual
    favors:
    - O3
    weight: weak
    why: Prompt reporting and relocation are positive, yet they do not erase the underlying pattern of drug involvement that
      the LSO highlighted.
  - id: C4
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: Although 10 C.F.R. § 710 creates a presumption against restoration, the judge applied the presumption but found the
      mitigating evidence outweighed it.
  - id: C5
    facts:
    - F5
    equity: record_integrity
    favors:
    - O3
    weight: strong
    why: Negative drug tests after the January 2026 incident demonstrate continued compliance and support the conclusion that
      the Individual is not currently using controlled substances.
  - id: C6
    facts:
    - F1
    - F7
    - F8
    equity: risk_to_national_security
    favors:
    - O1
    weight: strong
    why: The Individual's documented history of marijuana and psychedelic use, coupled with the LSO's formal concerns and
      the statutory presumption against restoration, indicate a continuing risk to national security that outweighs the post-incident
      mitigating actions.
  reasoning:
    read: The core issue is whether historic illicit drug use and the statutory presumption under 10 C.F.R. § 710 outweigh
      the post-incident mitigating steps.
    weighing: By treating the historic drug record and the regulatory presumption as decisive, the strong risk consideration
      (C6) dominates the weakened mitigating factors, leading to a denial of restoration.
    tradecraft: The decision is recorded in the OHA memorandum, citing the CFR presumption, the LSO's Guideline H and E findings,
      and the new risk-based analysis.
    uncertainty: Moderate, because while the record shows abstinence, the weight given to past behavior and statutory policy
      introduces a cautious stance.
    handoff: The Administrative Judge issues the final determination alone, as authorized by 10 C.F.R. § 710.25(d)-(g).
    tempting_wrong:
      option: O3
      pull: The clear abstinence and negative tests might tempt a restoration.
      why_wrong: Restoring would conflict with the statutory presumption and ignore the lingering security concerns from the
        Individual's prior drug involvement.
    rejected:
      O2: Pending further evidence is unnecessary because the existing record already demonstrates the statutory presumption
        outweighs the mitigating evidence.
      O3: Restoration would violate the presumption against granting a clearance when historic drug use and LSO concerns remain
        unresolved.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: If additional evidence emerges confirming continued abstinence and no further drug incidents.
      then: O3
      why: Such evidence could tip the balance toward restoration, but absent it the presumption and risk consideration mandate
        denial.
    would_not_change:
    - id: noflip1
      if: The Individual did not provide a signed statement of intent to abstain (mitigating factor 26(b)(3) was missing).
      why: The judge already determined that the lack of a signed statement does not prevent restoration because other mitigating
        factors were sufficient.
    watch_for:
    - id: watch1
      what: Any future positive drug test or admission of use.
      favors:
      - O1
      why: A new positive test would revive the security concerns under Guideline H and the Bond Amendment.
  lesson: When historic illicit drug use is documented and the regulatory framework imposes a strong presumption against restoration,
    that presumption can outweigh post-incident mitigating actions, leading to denial of clearance.
  limits: Applies where the individual's past drug conduct is part of the official record and the agency's statutory presumption
    remains unqualified; does not extend to cases with clear, intentional, and isolated incidents without a broader pattern.
