case:
  id: DR-CORPUS-NX-8441cf1b-E1@v1
  title: Engagement Under Weapons Tight
  status: draft
  setting: At a company position during an aircraft approach, under the battalion staff's weapons-tight WCS.
  decider: The team chief
  agent: The team chief
  agent_role: decide
  situation: At a company position, an aircraft has approached. Battalion staff has announced a weapons-tight WCS. The gunner
    initially could not visually identify the aircraft as hostile; it has since been visually identified as hostile and bears
    enemy national insignia. The team chief is at the decision point after that visual identification.
  question: What should the team chief do about engagement under the weapons-tight WCS at this point?
  options:
    O1:
      do: The team chief authorizes the gunner to engage the aircraft.
      move: act
      irreversible: true
    O2:
      do: The team chief asks the battalion staff to confirm permission before acting.
      move: ask
      irreversible: false
      to: the battalion staff
    O3:
      do: The team chief prohibits the gunner from engaging the aircraft.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An aircraft approached the company position.
  - id: F2
    kind: authority
    status: confirmed
    fact: Battalion staff announced a weapons-tight WCS.
  - id: F3
    kind: situation
    status: confirmed
    fact: At the initial decision point, the gunner could not visually identify the aircraft as hostile.
  - id: F4
    kind: authority
    status: confirmed
    fact: Under weapons tight, positive hostile identification is required before engagement.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The aircraft was later visually identified as hostile.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The aircraft bore enemy national insignia.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Weapons tight requires positive hostile identification before engagement. Once that condition is met, engagement
      is permitted under the announced constraint.
  - id: C2
    facts:
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The inability to identify the aircraft as hostile applied at the earlier decision point; the later visual identification
      changes the decision basis.
  - id: C3
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The visual identification as hostile, supported by enemy national insignia, satisfies the stated engagement criterion.
  reasoning:
    read: The decision point is after the aircraft has been visually identified as hostile, not when the gunner could not
      identify it. The trap is carrying the earlier uncertainty forward as though the identification standard still had not
      been met.
    weighing: Weapons tight bars engagement before positive hostile identification {C1}. The earlier inability to identify
      justified withholding engagement then, but the later visual identification resolves that condition {C2, C3}. On that
      basis, authorizing engagement is favored; the balance depends on the hostile identification actually having been made.
    tradecraft: Tie the authorization to the current identification finding and the weapons-tight requirement, and record
      that basis with the decision. Do not treat the prior uncertainty as either continuing after it is resolved or as permission
      to bypass the identification threshold.
    uncertainty: No remaining uncertainty is identified after the aircraft is visually identified as hostile. No separate
      unresolved condition requiring confirmation before acting is stated.
    handoff: The team chief makes the decision under the announced weapons-tight WCS. No further confirmation from battalion
      staff is indicated as necessary after positive hostile identification.
    tempting_wrong:
      option: O3
      pull: The aircraft was initially not visually identifiable as hostile, which made withholding engagement appropriate
        at that earlier point.
      why_wrong: 'The earlier uncertainty is distinct from the current situation: visual identification as hostile now meets
        the stated criterion for engagement.'
    rejected:
      O2: A further permission check is not required once visual hostile identification meets the weapons-tight criterion.
      O3: Prohibiting engagement would disregard the later positive hostile identification that satisfies the engagement criterion.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The aircraft had not been positively identified as hostile.
      then: O3
      why: Weapons tight requires positive hostile identification before engagement; when that condition is absent, engagement
        is withheld.
    would_not_change:
    - id: noflip1
      if: The earlier uncertainty remained in the record, but the aircraft had since been visually identified as hostile.
      why: The engagement decision rests on the later positive identification, which meets the criterion.
    watch_for:
    - id: watch1
      what: Whether positive visual identification as hostile has actually been established.
      favors:
      - O1
      why: That is the condition permitting engagement under weapons tight; without it, engagement is not supported.
  lesson: Under a weapons-tight constraint, do not engage until positive hostile identification is established. If that identification
    is later made, reassess the decision on the updated facts rather than letting an earlier uncertainty control the outcome.
  limits: This reasoning applies to the stated weapons-tight identification condition and the finding that the aircraft was
    visually identified as hostile. It does not resolve other rules of engagement, separate authorization requirements, or
    situations in which hostile identification remains uncertain.
