case:
  id: DR-CORPUS-NX-d5acc0f8-E1@v1
  title: Exercise Workstation Access
  status: draft
  setting: USAFRICOM exercise planning for deploying HQ staff, theater SMEs, and exercise control.
  decider: USAFRICOM
  agent: USAFRICOM
  agent_role: decide
  situation: The exercise was initially designed for each user to access the portal on a classified government computer. Supply-chain
    delays made that plan infeasible. USAFRICOM had thin client computers that could provide a virtual computer environment
    from its tactical servers. The stated security arrangement kept classified data within the virtual network, and the thin
    clients could support secret or non-classified internet protocols. Secret and nonclassified systems kiosks had been constructed,
    providing sufficient access for the exercise. USAFRICOM intended to procure enough systems in the future to replicate
    deployed-environment workstations for follow-on training units.
  question: What should USAFRICOM do about workstation access for the exercise?
  options:
    O1:
      do: USAFRICOM should approve and provide thin-client access for exercise staff.
      move: act
      irreversible: false
    O2:
      do: USAFRICOM should reject thin-client access and retain classified-computer access for exercise staff.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The exercise was initially designed for each user to access the portal using a classified government computer.
  - id: F2
    kind: situation
    status: confirmed
    fact: Significant delays in the current digital equipment supply chain made the original design infeasible.
  - id: F3
    kind: capability
    status: confirmed
    fact: USAFRICOM provided enough thin client computers for a majority of the deploying HQ staff, theater SMEs, and exercise
      control.
  - id: F4
    kind: capability
    status: confirmed
    fact: Thin clients provide a virtual computer environment from the COCOM’s tactical servers.
  - id: F5
    kind: capability
    status: confirmed
    fact: The thin-client arrangement does not allow classified data to rest outside the virtual network.
  - id: F6
    kind: capability
    status: confirmed
    fact: The thin clients are not classified and can support secret or non-classified internet protocols.
  - id: F7
    kind: situation
    status: confirmed
    fact: The thin clients require monitors and peripherals and reduce the overall secure storage requirement.
  - id: F8
    kind: situation
    status: confirmed
    fact: Secret and nonclassified systems kiosks provided sufficient access for the exercise.
  - id: F9
    kind: situation
    status: confirmed
    fact: USAFRICOM intended to procure enough systems in the future to replicate deployed-environment workstations for follow-on
      training units.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The classified-computer plan was infeasible because of significant supply-chain delays, favoring the available alternative
      over retaining a plan that could not be carried out.
  - id: C2
    facts:
    - F4
    - F5
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The thin clients use a virtual environment from tactical servers and keep classified data from resting outside the
      virtual network, addressing the central security concern in allowing access.
  - id: C3
    facts:
    - F6
    equity: classification_integrity
    favors:
    - O1
    weight: strong
    why: The clients themselves are not classified and can support secret or non-classified internet protocols, supporting
      their use for the stated access arrangement.
  - id: C4
    facts:
    - F7
    - F8
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Although the clients require monitors and peripherals, the kiosks provided sufficient access for the exercise and
      the arrangement reduced overall secure-storage requirements.
  - id: C5
    facts:
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The stated intent to procure enough systems for future training units is consistent with using the thin-client approach
      to support follow-on training.
  reasoning:
    read: 'This is an access decision under a supply constraint: the planned classified computers were not feasible, while
      the thin-client arrangement offered exercise access with classified data kept within the virtual network. The trap is
      treating the original plan as a workable default despite the stated delays, or treating the alternative as risk-free
      beyond the security properties actually described.'
    weighing: The supply-chain delays weigh strongly against retaining the original workstation plan {C1}. The stated virtual-network
      containment and the clients’ ability to support the required protocols support the thin-client arrangement {C2} {C3};
      sufficient kiosk access and reduced secure-storage requirements reinforce it despite the need for peripherals {C4}.
      Future procurement supports continuity but is not necessary to justify access for this exercise {C5}. The balance depends
      on the stated containment and whether the provided access remains sufficient.
    tradecraft: Approve the described thin-client access for the exercise and record the supply constraint, the stated security
      rationale, and the sufficiency of kiosk access as the basis. Keep the decision at the access-policy level; do not infer
      technical safeguards or approvals that are not stated.
    uncertainty: The account does not specify the applicable authorization or security-review process, nor does it assess
      risks beyond the stated data-containment arrangement. It also says the clients covered a majority of staff and that
      kiosks provided sufficient exercise access, but gives no detailed allocation information.
    handoff: USAFRICOM made the provision decision in the account. As a decision-practice measure, confirm with the responsible
      security and classification authorities that the described arrangement is authorized for the intended information and
      users; this is a prudent handoff, not a step stated as part of the source’s rationale.
    tempting_wrong:
      option: O2
      pull: Retaining classified-computer access may seem preferable because it follows the exercise’s original design.
      why_wrong: The original design was infeasible because of significant supply-chain delays, while the source gives reasons
        the alternative could provide sufficient access and keep classified data within the virtual network.
    rejected:
      O2: USAFRICOM did not retain the infeasible classified-computer plan because thin clients offered a stated means of
        access with classified data contained in the virtual network and sufficient kiosk capacity for the exercise.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The stated arrangement could not keep classified data from resting outside the virtual network.
      then: O2
      why: That would remove a central stated security reason for approving thin-client access and could make retaining classified-computer
        access preferable, subject to feasibility.
    - id: flip2
      if: The thin clients and kiosks could no longer provide sufficient access for the exercise.
      then: O2
      why: Insufficient access would undermine the stated operational reason for using the alternative, though the original
        plan’s supply-chain infeasibility would still need to be addressed.
    would_not_change:
    - id: noflip1
      if: The thin clients continue to require monitors and peripherals.
      why: That requirement is already part of the stated arrangement and does not by itself outweigh sufficient exercise
        access or the reduced secure-storage requirement.
    - id: noflip2
      if: Future procurement to replicate deployed-environment workstations remains planned rather than completed.
      why: The future procurement intent supports follow-on training but is not needed to establish that kiosks provided sufficient
        access for this exercise.
    watch_for:
    - id: watch1
      what: Whether actual exercise access remains sufficient for the staff, SMEs, and exercise control who need it.
      favors:
      - O2
      why: A change from the stated sufficient-access condition could weaken the basis for relying on thin clients.
  lesson: When the planned access method is infeasible, assess the available alternative against the actual security and access
    conditions rather than treating the original design as automatically controlling. Give weight to stated containment and
    adequate access, but do not assume unmentioned safeguards or treat a security rationale as proof that every use is authorized.
  limits: This reasoning applies to the stated exercise arrangement and its described virtual-network containment and kiosk
    capacity. It does not establish that thin clients are suitable for other information, users, systems, or exercises, or
    that any particular authorization requirement has been met.
  library:
    domain: cyber-policy
    family: CORPUS-NX-d5acc0f8
    source: https://api.army.mil/e2/c/downloads/2023/01/31/6d276787/22-667-modernization-in-army-mobilization-dec-21-public.pdf
    episode_focus: The exercise’s original workstation plan was infeasible because of supply-chain delays, so USAFRICOM provided
      thin clients; the stated benefits included keeping classified data within the virtual network and reducing secure-storage
      requirements. Treat this as a decision about information-system security and access policy, not as a technical guide
      to configuring or operating the systems.
    cues:
      option_words:
        O1: 10
        O2: 12
      real_option: O1
      real_to_mean_other_length: 0.83
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
