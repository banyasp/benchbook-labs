case:
  id: DR-CORPUS-NX-6ed5886c-E1@v1
  title: Movement in Hazardous Weather
  status: draft
  setting: The NTC, on a cold, foggy, rainy night during a brigade combat team rotation.
  decider: The brigade commander
  agent: The brigade commander
  agent_role: decide
  situation: At the NTC on a cold, foggy, rainy night, the brigade combat team has advanced slowly throughout the day while
    setting conditions for its largest combat operation of the rotation. Battalion commanders report that movement through
    the restricted terrain they occupy is too dangerous. No one has been hurt, but fog, rain, and imminent flooding in some
    areas contribute to their concerns. Some concerns may be unwarranted, while others may be grounded in local conditions.
    Stopping now risks mission failure for the team.
  question: What should the brigade commander do about movement and the mission at this point?
  options:
    O1:
      do: The brigade commander permits the brigade to continue its planned movement through restricted terrain.
      move: act
      irreversible: false
    O2:
      do: The brigade commander prohibits further movement and holds the brigade in its current position.
      move: act
      irreversible: false
    O3:
      do: The brigade commander seeks direction from the division commander and holds position as directed.
      move: ask
      irreversible: false
      to: the division commander
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision point occurs on a cold, foggy, rainy night at the NTC.
  - id: F2
    kind: situation
    status: confirmed
    fact: The brigade combat team has advanced slowly throughout the day while setting conditions for the largest combat operation
      of the rotation.
  - id: F3
    kind: situation
    status: assessed
    fact: Several battalion commanders report that movement in the restricted terrain they occupy is too dangerous.
  - id: F4
    kind: situation
    status: confirmed
    fact: No one has been hurt.
  - id: F5
    kind: situation
    status: assessed
    fact: Fog, rain, and imminent flooding in some commanders’ areas contribute to the reported danger.
  - id: F6
    kind: situation
    status: assessed
    fact: The brigade commander believes some commanders may be worried without reason.
  - id: F7
    kind: situation
    status: assessed
    fact: Stopping at this point risks mission failure for the entire team.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    - O3
    weight: strong
    why: Although nobody has been hurt and some concerns may be unwarranted, fog, rain, and imminent flooding give some commanders
      a valid basis to fear needless losses if movement continues.
  - id: C2
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Stopping risks mission failure for the team, so continued progress has a real operational pull. The commander nevertheless
      does not treat that risk as sufficient reason to disregard credible danger reports.
  - id: C3
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The source values the fact that subordinates trusted the brigade commander enough to raise a serious problem. It
      says leaders who have their subordinates' trust make better decisions, and those subordinates fight harder for leaders
      they believe have their interests in mind.
  reasoning:
    read: 'This is a judgment under uncertainty, not simply a choice between mission progress and needless risk: some commanders
      may be worried without reason, but local weather and flooding make other concerns credible. The trap is letting the
      mission risk silence subordinate reports or treating every report as equally conclusive.'
    weighing: Mission failure is a serious risk {C2}, but the source gives decisive weight to the danger of needlessly losing
      Soldiers and to the trust placed in a commander who hears and handles subordinates' concerns {C1} {C3}. Calling the
      division commander surfaced that other elements had similar concerns, and the division directed the brigade to hold
      its position and prepare to execute when weather permits. The balance depends on the reported hazards and whether weather
      permits movement.
    tradecraft: For a sound decision record, capture the commanders' reported conditions, the mission risk, the brigade commander's
      referral, the division's direction, and the condition for resuming movement. Reassess whether weather permits execution
      before moving.
    uncertainty: The commander recognizes that some concerns may be unwarranted while others are grounded in local conditions;
      the reports do not establish that every area faces the same danger.
    handoff: The brigade commander involves the division commander because other battlefield elements have raised similar
      concerns. The division commander directs the brigade to retain its position and prepare to execute when weather permits.
    tempting_wrong:
      option: O1
      pull: Stopping risks jeopardizing the mission.
      why_wrong: The source treats that risk as real but rejects pressing ahead as the answer to credible reports that Soldiers
        could be needlessly lost; doing so would also fail to handle the concerns entrusted to the brigade commander.
    rejected:
      O1: The commander does not order continued movement despite the mission risk, because some reports of danger are valid
        and needless Soldier losses are at stake.
      O2: 'The source''s endorsed course is not an uncoordinated hold by the brigade commander alone: the commander calls
        the division commander, who directs the brigade to retain its position and prepare to execute when weather permits.'
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The weather permits execution.
      then: O1
      why: The division's direction is to prepare to execute when weather permits, so that change in conditions supports resuming
        planned movement.
    - id: flip2
      if: The commander had reliable grounds to conclude that the reported hazards were not present and movement was safe.
      then: O1
      why: Without credible danger to offset the mission risk, the reason to stop and refer the decision would be substantially
        reduced.
    would_not_change:
    - id: noflip1
      if: Some commanders' concerns prove unwarranted, while other reports remain grounded in local conditions.
      why: The source itself recognizes that some concerns may be unwarranted but still treats the credible local dangers
        as reason to call the division commander.
    - id: noflip2
      if: Nobody has yet been hurt.
      why: The absence of injury does not remove the reported danger or the source's concern that Soldiers could be needlessly
        lost.
    watch_for:
    - id: watch1
      what: Whether weather conditions permit execution.
      favors:
      - O1
      why: The division directs the brigade to prepare to execute when weather permits.
  lesson: A mission risk does not justify ignoring credible reports that personnel may face needless danger. Leaders should
    make it possible for subordinates to raise problems, take those concerns seriously, and use the chain of command to resolve
    competing risks.
  limits: This reasoning concerns a command decision under uncertain weather and terrain conditions where the division commander
    was available to provide direction. It does not establish that holding is always preferable, or that movement should resume
    without regard to changed conditions.
