case:
  id: DR-CORPUS-NX-4b4b2215-E1@v1
  title: American Force Posture in the Philippines
  status: draft
  setting: The Philippines, during the JSOTF-P campaign, involving American military leadership and the diplomatic mission
    in Manila.
  decider: American military leadership
  agent: American military leadership
  agent_role: decide
  situation: The Philippine constitution prohibited foreign combat troops in the country. American forces supported the AFP
    and PNP through training, advice, and support, without engaging in direct combat. Philippine security forces were poorly
    equipped and making slow progress. A broader American role, including larger force deployments or American combat operations,
    was among the courses under consideration. American military leaders worked closely with the ambassador and Philippine
    government officials, and the counterinsurgency effort was understood to be long term.
  question: What should American military leadership do about the American force posture in the Philippines?
  options:
    O1:
      do: American military leadership should decline a larger American combat role and continue training, advice, and support.
      move: act
      irreversible: false
    O2:
      do: American military leadership should authorize a larger American combat role, including a larger force presence or
        direct combat operations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Philippine constitution prohibited foreign combat troops in the country.
  - id: F2
    kind: situation
    status: confirmed
    fact: American forces provided training, advice, and support to Philippine military and police forces, and did not engage
      in direct combat.
  - id: F3
    kind: situation
    status: confirmed
    fact: American forces supported the AFP and PNP in their fight against the Abu Sayyaf Group and Jemaah Islamiyah in the
      southern Philippines.
  - id: F4
    kind: capability
    status: assessed
    fact: The AFP and PNP were poorly equipped, and progress was slow.
  - id: F5
    kind: situation
    status: confirmed
    fact: The American military task force, the diplomatic mission, the Philippine government, the AFP, and the PNP had a
      close working relationship.
  - id: F6
    kind: authority
    status: confirmed
    fact: Because the Philippines was not an American combat zone, the ambassador was understood to be the lead American representative;
      the military task force sought the ambassador's concurrence, not approval, for American military activities, with approval
      belonging to the military chain of command.
  - id: F7
    kind: situation
    status: confirmed
    fact: The American military task force leadership met routinely with the ambassador and Philippine government officials,
      and maintained a liaison element in the diplomatic mission.
  - id: F8
    kind: situation
    status: assessed
    fact: The posture choices under consideration included deploying large numbers of American forces and conducting American
      combat operations.
  - id: F9
    kind: situation
    status: confirmed
    fact: The diplomatic mission, JSOTF-P, and the Philippine government understood the counterinsurgency effort to be a long-term
      campaign.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Philippine constitution barred foreign combat troops, and U.S. forces accordingly provided support without direct
      combat. This strongly weighs against a posture that includes U.S. combat operations, though the constitutional bar did
      not prohibit every larger U.S. presence.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: The task force worked closely with the ambassador and Philippine officials; the ambassador was the lead U.S. representative,
      and the task force sought the ambassador's concurrence while military approval remained with the chain of command. This
      favors a posture coordinated with the diplomatic mission and Philippine partners.
  - id: C3
    facts:
    - F4
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Although Philippine forces were poorly equipped and progress was slow, the campaign was understood to be long term.
      U.S. leaders resisted a rapid expansion of the American role; the slow, deliberate approach helped Philippine forces
      develop capacity and reduce the insurgent threat.
  reasoning:
    read: This was support to Philippine forces in a country whose constitution prohibited foreign combat troops, not a U.S.
      combat-zone decision. The ambassador was the lead U.S. representative, while military approval authority remained in
      the military chain of command. The trap was treating poor equipment and slow progress as a reason to take over more
      of the fight, despite the legal limit, close partnership, and long-term nature of the campaign.
    weighing: The constitutional restriction strongly counseled against direct U.S. combat, while close coordination with
      the ambassador and Philippine officials supported a restrained, partner-centered posture. Slow progress created pressure
      for more U.S. forces or combat operations, but leaders resisted that urge and the deliberate approach helped Philippine
      forces build capacity and reduce the threat. The balance depends on respecting the constitutional limit and sustaining
      a coordinated, long-term effort rather than judging the approach solely by its slow initial progress.
    tradecraft: Maintain routine coordination with the ambassador and Philippine officials, keep the diplomatic mission informed,
      and distinguish ambassadorial concurrence from military approval. Record the force-posture rationale, the relevant legal
      constraint, and how progress toward Philippine capacity and the campaign's objectives is assessed.
    uncertainty: The account gives no quantified threshold for when slow progress would justify changing posture and does
      not detail the risks or costs of the rejected alternatives. Its favorable assessment is retrospective, based on the
      eventual development of Philippine capacity and reduction of the insurgent threat.
    handoff: Decide through the military chain of command, while involving the ambassador and Philippine officials in coordination
      because the ambassador was the lead U.S. representative and the effort depended on close partnership. The ambassador's
      concurrence is not military approval.
    tempting_wrong:
      option: O2
      pull: Poorly equipped Philippine forces and slow progress could make a larger American role seem like the quickest way
        to improve results.
      why_wrong: 'Leaders resisted that urge: direct combat conflicted with the constitutional constraint, and the campaign
        was understood to be long term. Low-visibility assistance and a slow, deliberate approach enabled Philippine forces
        to build capacity and reduce the threat.'
    rejected:
      O2: American leaders did not choose a larger combat role because the constitution barred foreign combat troops and they
        judged a slow, deliberate partner-support approach more suitable to the long-term effort.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The constitutional prohibition on foreign combat troops were removed and the Philippine government requested a larger
        American combat role.
      then: O2
      why: The legal and partner constraints central to the rationale would have changed, making an expanded role a course
        to reconsider rather than one the stated circumstances ruled against.
    - id: flip2
      if: The restrained approach failed to build Philippine capacity or reduce the threat, and the constitutional and Philippine-government
        constraints on an expanded role had also changed.
      then: O2
      why: Failure of the approach's stated purpose could justify reconsidering posture, provided an expanded role were lawful
        and consistent with Philippine government expectations.
    would_not_change:
    - id: noflip1
      if: Philippine forces remained poorly equipped and progress remained slow in the circumstances described.
      why: U.S. leaders resisted a larger deployment and combat role despite those conditions, as the campaign was understood
        to be long term.
    watch_for: []
  lesson: Slow progress does not by itself warrant replacing a partner's effort with a larger outside combat role, especially
    where law limits that role and the campaign is understood to be long term. Keep the posture coordinated with the diplomatic
    mission and partner government, and assess it by whether it builds partner capacity and advances the mission.
  limits: This reasoning applies to the described constitutional restriction, partner relationship, and long-term support
    campaign. It does not establish that a larger U.S. presence is always improper or that a restrained approach is appropriate
    if legal authority, partner expectations, or the campaign's circumstances materially change.
