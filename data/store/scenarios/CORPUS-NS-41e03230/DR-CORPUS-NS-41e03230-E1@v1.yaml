case:
  id: DR-CORPUS-NS-41e03230-E1@v1
  title: Strike Authorization in Sami Ghar
  status: draft
  setting: Sami Ghar mountain region of Afghanistan, night of 16 September 2003, CJTF 180.
  decider: The strike-clearing authority, whose individual identity is not stated.
  agent: The strike-clearing authority, whose individual identity is not stated.
  agent_role: decide
  situation: In the Sami Ghar mountain region of Afghanistan, CJTF 180 was pursuing the objectives of denying the adversary
    sanctuary and countering terrorism. On the night of 16 September 2003, a target had been prioritized for a lethal strike.
    Analysis had been treated as validating the target’s viability. Civilian-harm precautions and mitigation measures had
    been undertaken, and collateral-damage requirements applied. The strike-clearing authority must choose whether to authorize
    the proposed strike or defer it.
  question: What should the strike-clearing authority do about the proposed strike against the target?
  options:
    O1:
      do: The strike-clearing authority authorizes the strike against the target.
      move: act
      irreversible: true
    O2:
      do: The strike-clearing authority declines to authorize the strike against the target.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: CJTF 180 was pursuing the objectives of denying the adversary sanctuary and countering terrorism.
  - id: F2
    kind: capability
    status: confirmed
    fact: CJTF 180 synchronized lethal and nonlethal capabilities.
  - id: F3
    kind: situation
    status: confirmed
    fact: The target had been prioritized for a lethal strike.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Analysis had validated the target’s viability.
  - id: F5
    kind: situation
    status: confirmed
    fact: Civilian precautions and measures to mitigate harm to the civilian population had been undertaken.
  - id: F6
    kind: authority
    status: confirmed
    fact: Collateral-damage requirements of United States Central Command applied to the assessment of the target area.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: CJTF 180 synchronized lethal and nonlethal capabilities in pursuit of denying sanctuary and countering terrorism;
      the source presents the attack as helping achieve that mission effect.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The target had been prioritized, and analysis was assessed as validating its viability. That validation supports
      proceeding, while remaining an assessment rather than certainty.
  - id: C3
    facts:
    - F5
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Civilian precautions and mitigation measures had been undertaken, and applicable collateral-damage requirements framed
      the assessment. These measures weigh in favor of proceeding but do not establish that civilian risk was eliminated or
      that the requirements were necessarily satisfied.
  reasoning:
    read: This is a decision about a proposed strike against a target whose viability had been assessed as validated, in support
      of a stated counterterrorism mission, with civilian precautions and applicable collateral-damage requirements in play.
      The trap is treating either mission value or later evidence of success as a substitute for assessing civilian risk and
      the applicable requirements at the time of authorization.
    weighing: The source's endorsement rests on the combination of the mission objective, the assessed validation of the target,
      and precautions to mitigate civilian harm. It later characterizes the attack as effective in disrupting adversary activity
      and helping deny sanctuary, which supports the mission rationale. That later result does not by itself establish what
      the prospective civilian risk was or whether the applicable requirements were met; authorization depends on the contemporaneous
      assessment remaining within those constraints.
    tradecraft: Record the authority for the decision, the assessed basis for target viability, the civilian-risk and mitigation
      considerations, and how the applicable requirements were applied. Reassess rather than rely on an earlier decision if
      material facts change before authorization.
    uncertainty: The source does not identify the individual who gave final clearance, state a specific residual civilian-risk
      estimate, or provide an express legal finding that all applicable requirements were satisfied. The later assessment
      of mission effect is not a substitute for those prospective judgments.
    handoff: The strike-clearing authority should decide within the authority delegated to that role. If the civilian-risk
      assessment or application of the collateral-damage requirements is unresolved, seek the appropriate command and legal
      review; the source does not identify particular reviewers.
    tempting_wrong:
      option: O2
      pull: Deferring can appear safer where a lethal strike carries civilian-harm risks.
      why_wrong: 'The source does not treat the existence of civilian risk as an automatic bar: it weighs the assessed target
        viability and mission objective alongside precautions and applicable requirements, and endorses proceeding on that
        overall account.'
    rejected:
      O2: The source's endorsed outcome was to proceed, relying on the assessed validation of the target, civilian precautions,
        and the stated mission effect.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The target's viability were no longer supported by the available assessment at the time of authorization.
      then: O2
      why: Without the assessed validation that supported proceeding in this case, the stated basis for authorizing the strike
        would be materially weakened.
    - id: flip2
      if: The contemporaneous civilian-risk assessment showed that applicable collateral-damage requirements could not be
        met.
      then: O2
      why: Mission value and mitigation measures would not justify proceeding outside the applicable constraints.
    would_not_change:
    - id: noflip1
      if: Later evidence showed that the attack had disrupted adversary activity.
      why: That evidence may support the mission rationale, but it would not by itself establish that the contemporaneous
        civilian-risk assessment and applicable requirements supported authorization.
    watch_for:
    - id: watch1
      what: Material changes in the civilian-risk picture or in the assessment supporting target viability before authorization.
      favors:
      - O2
      why: Either change could undermine the case for proceeding as it stood when the strike was considered.
  lesson: A mission objective and assessed target viability can support authorizing a strike, but they must be weighed with
    civilian-harm precautions and the applicable requirements. Later success can confirm mission effect, not replace the decision-time
    assessment.
  limits: This reasoning applies only where the target's viability is assessed as validated and civilian precautions and applicable
    collateral-damage requirements are part of the decision. The source does not establish a general rule that such measures
    alone make a strike permissible or disclose the complete contemporaneous risk assessment.
