case:
  id: DR-CORPUS-NX-6c80bcc6-E1@v1
  title: Whether to Retake Fallujah
  status: draft
  setting: Fallujah, before Iraq’s January 2005 national election; Iraqi Interim Government and coalition leadership.
  decider: Senior American and Iraqi political and military leaders
  agent: Senior American and Iraqi political and military leaders
  agent_role: decide
  situation: Fallujah’s security unit had failed to control the city, and some of its personnel had deserted or sided with
    the insurgency. The insurgency strengthened while attacks against coalition and Iraqi forces continued. Leaders considered
    whether the city could remain an insurgent safe haven as Iraq approached its first post-invasion national election. They
    were concerned that collateral damage could have political consequences, while the coalition promised humanitarian relief
    and reconstruction support for the damaged city. The proposed operation’s objectives included defeating opposition forces
    and occupying the city.
  question: What should the senior American and Iraqi political and military leaders do about whether to launch an operation
    to retake Fallujah?
  options:
    O1:
      do: The senior Iraqi and coalition leaders approve launching an operation to retake Fallujah.
      move: act
      irreversible: true
    O2:
      do: The senior Iraqi and coalition leaders reject launching an operation to retake Fallujah.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Fallujah Brigade could not control the city, and many of its personnel deserted or sided with the insurgency.
  - id: F2
    kind: situation
    status: confirmed
    fact: Over the following months, the insurgency strengthened, emboldening existing insurgents and attracting more fighters.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The insurgent leader was believed to have established a headquarters in Fallujah and to use it to plan attacks on
      coalition forces.
  - id: F4
    kind: situation
    status: confirmed
    fact: Attacks against coalition and Iraqi forces continued as Iraq prepared for its January 2005 national election.
  - id: F5
    kind: situation
    status: assessed
    fact: Leaders considered that lawlessness and continuing attacks could undermine the election and that citizens’ inability
      to participate could undermine the new government’s authority.
  - id: F6
    kind: situation
    status: confirmed
    fact: Some leaders debated an attack and were concerned about the political ramifications of collateral damage.
  - id: F7
    kind: situation
    status: confirmed
    fact: The coalition guaranteed humanitarian relief and reconstruction support for the damaged city during and following
      the battle.
  - id: F8
    kind: situation
    status: confirmed
    fact: The proposed operation’s primary objectives included defeating opposition forces and occupying the entire city.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Fallujah Brigade could not control the city, the insurgency grew, attacks continued, and the assessed insurgent
      headquarters added to the case that the city could not remain a safe haven. Retaking and occupying the city was directed
      at defeating opposition forces and removing that threat.
  - id: C2
    facts:
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Leaders considered that lawlessness and continuing attacks could undermine the election, while residents’ inability
      to participate could make the new government appear unable to exercise authority in an important city.
  - id: C3
    facts:
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Some leaders were concerned that collateral damage from an attack could have serious political ramifications; this
      was a real cost to weigh against the security and election-related purposes.
  - id: C4
    facts:
    - F6
    - F7
    equity: third_party_harm
    favors:
    - O1
    weight: weak
    why: The coalition guaranteed humanitarian relief and reconstruction support during and after the battle to address concerns
      about expected collateral damage. That commitment mitigated, but did not erase, the concern.
  reasoning:
    read: 'This was a choice between leaving a city that the Iraqi security unit could not control, with a strengthening insurgency
      and continuing attacks, and accepting the political risks of an assault. The central trap is treating collateral-damage
      concerns as either irrelevant or automatically decisive: leaders had to weigh them against the risk to election participation
      and the new government''s authority.'
    weighing: The source's balance favored retaking the city because leaders judged that Fallujah could not remain an insurgent
      and terrorist safe haven and that lawlessness could undermine the January election and the new government's authority.
      Collateral-damage concerns were substantial, but the coalition's relief and reconstruction guarantee was intended to
      address them. The balance depended on establishing political objectives and parameters and sustaining the political
      will to complete the operation.
    tradecraft: At the decision level, make the political objectives and parameters explicit, record the collateral-damage
      concern and the relief and reconstruction commitments intended to address it, and identify who is responsible for carrying
      those commitments through. Keep the decision and its rationale distinct from tactical planning.
    uncertainty: The insurgent leader's headquarters in Fallujah was believed to have been established there, rather than
      stated as certain. The election and government-authority harms were risks leaders considered, not reported outcomes.
    handoff: 'This required joint senior American and Iraqi political and military leadership: the decision implicated the
      Iraqi government''s authority and election, while the coalition was committing forces and promising relief and reconstruction
      support.'
    tempting_wrong:
      option: O2
      pull: Rejecting the operation could appear to avoid the political consequences of collateral damage.
      why_wrong: That would leave unaddressed the failed city security arrangement, strengthening insurgency, continuing attacks,
        and the risk that Fallujah's lawlessness would undermine the election and the new government's authority.
    rejected:
      O2: Leaders did not reject the operation because they judged that Fallujah could not remain an insurgent safe haven
        and that leaving the situation unresolved could undermine the election and the new government's authority.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The city were no longer an insurgent safe haven, the local security force could control it, and attacks and the
        election-related threat to government authority had abated.
      then: O2
      why: Without the security and political problems that drove the decision, the case for accepting the collateral-damage
        risk of an operation would be substantially reduced.
    - id: flip2
      if: The humanitarian relief and reconstruction commitment could not be made credible or delivered.
      then: O2
      why: A mitigation expressly used to address political concerns about collateral damage would no longer support proceeding,
        strengthening the case against the operation.
    would_not_change:
    - id: noflip1
      if: The assessed insurgent headquarters were not confirmed, but the failed city security arrangement, strengthening
        insurgency, continuing attacks, and election-related risks remained.
      why: The source's case for retaking the city rested on those broader security and political concerns as well as the
        assessed headquarters.
    watch_for:
    - id: watch1
      what: Whether the promised humanitarian relief and reconstruction support is actually provided during and after the
        battle.
      favors:
      - O1
      why: The commitment was intended to address political concerns about expected collateral damage; failure to carry it
        through would weaken that mitigation.
  lesson: When a failed security arrangement leaves a strengthening insurgency able to threaten both public safety and a government's
    political legitimacy, leaders should weigh the cost of inaction against the foreseeable harm of action. Mitigation commitments
    can help address that harm, but they do not make it disappear and must be treated as part of the decision.
  limits: This reasoning addresses the decision whether to retake Fallujah on the security, election, political-risk, and
    mitigation grounds described here. It does not establish that any particular operation or method of execution was lawful,
    proportionate, or tactically justified.
