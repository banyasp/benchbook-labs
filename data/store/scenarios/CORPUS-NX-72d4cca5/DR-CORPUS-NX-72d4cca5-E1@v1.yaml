case:
  id: DR-CORPUS-NX-72d4cca5-E1@v1
  title: Classification of Unkeyed Machines
  status: draft
  setting: Government communications-security policy; the time and specific institution are not identified.
  decider: The government
  agent: The government
  agent_role: decide
  situation: The government is considering the classification status of communication machines when they are unkeyed. Distribution
    is contemplated for relatively unprotected environments in government and key industries. Sensitive information is involved
    in those industries. The policy choice is whether the machines remain classified or are treated as unclassified while
    unkeyed.
  question: What should the government do about the classification status of the machines while they are unkeyed?
  options:
    O1:
      do: The government keeps the machines classified while unkeyed.
      move: act
      irreversible: false
    O2:
      do: The government treats the machines as unclassified while unkeyed.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The classification question concerns the machines when they are unkeyed.
  - id: F2
    kind: authority
    status: confirmed
    fact: The doctrine treated the machines as unclassified when unkeyed.
  - id: F3
    kind: situation
    status: confirmed
    fact: The stated benefit of this doctrinal treatment was easier distribution.
  - id: F4
    kind: situation
    status: confirmed
    fact: The contemplated distribution included relatively unprotected government environments.
  - id: F5
    kind: situation
    status: confirmed
    fact: Key industries were among the contemplated distribution environments.
  - id: F6
    kind: situation
    status: confirmed
    fact: Sensitive information was involved in the key industries mentioned.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Treating the machines as unclassified while unkeyed greatly facilitated their distribution, the stated benefit for
      the adopted approach.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The contemplated distribution included relatively unprotected government environments, and easier distribution to
      such environments was a benefit. This is a specific application of the stated benefit, not a separate security finding.
  - id: C3
    facts:
    - F2
    - F3
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The contemplated recipients also included key industries handling sensitive information; the unclassified-when-unkeyed
      doctrine facilitated distribution there. No separate assessment of the risks or safeguards for those industries is provided.
  reasoning:
    read: The choice concerns the classification status of the machines specifically while unkeyed. The trap is to treat the
      presence of sensitive information in recipient environments as a stated reason to reject the doctrine; the identified
      benefit is instead easier distribution, including to those environments.
    weighing: The adopted approach is supported by the stated distribution benefit {C1}, with government environments and
      key industries as the described settings {C2} {C3}. The balance depends on that benefit; no competing security assessment
      or other reason to retain classification while unkeyed is recorded.
    tradecraft: Record that the decision is limited to the machines while unkeyed and preserve the stated distribution rationale.
      Do not extend the conclusion beyond that classification question without a separate assessment.
    uncertainty: The policy rationale is provided, but the distribution benefit is not quantified and risks, safeguards, or
      alternative rationales are not described.
    handoff: The government is the decider in this frame. As a decision-practice safeguard, involve the responsible classification
      authority and relevant security officials if applying the policy to particular environments, especially those handling
      sensitive information.
    tempting_wrong:
      option: O1
      pull: Sensitive information is involved in some of the contemplated recipient industries.
      why_wrong: That fact alone is not the stated balancing rationale; the adopted unclassified-when-unkeyed treatment facilitated
        distribution to those industries.
    rejected:
      O1: Keeping the machines classified while unkeyed was not the adopted approach, which greatly facilitated distribution.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Easier distribution were no longer needed or the unclassified-when-unkeyed treatment no longer facilitated it.
      then: O1
      why: The stated justification for O2 would be absent; in this binary scenario, O1 would be favored pending another basis
        for O2.
    - id: flip2
      if: A separate, applicable determination established that unclassified status while unkeyed created a material security
        risk that outweighed the distribution benefit.
      then: O1
      why: That would introduce a countervailing consideration absent from the available rationale and could outweigh the
        distribution benefit.
    would_not_change:
    - id: noflip1
      if: The intended recipients include relatively unprotected government environments.
      why: Those environments are already among the contemplated recipients for whom easier distribution is beneficial; that
        circumstance alone does not reverse the adopted approach.
    watch_for:
    - id: watch1
      what: Whether the decision being applied is limited to the machines while unkeyed.
      favors:
      - O2
      why: The doctrinal choice is expressly bounded by that status.
  lesson: When a policy distinguishes status in a defined condition, keep the decision within that boundary. Give weight to
    the stated operational benefit, but do not invent either a security objection or a security assurance that is not provided.
  limits: This reasoning addresses only classification while the machines are unkeyed and the stated benefit of easier distribution.
    It does not resolve classification in other circumstances or assess security risks, safeguards, or the proper treatment
    of any particular recipient environment.
  library:
    domain: cyber-policy
    family: CORPUS-NX-72d4cca5
    source: https://media.defense.gov/2021/Jul/13/2002762050/-1/-1/0/CRYPTOLOGIC-QUARTERLY-2019-01.PDF
    episode_focus: The passage describes a doctrinal choice between keeping the machines classified and treating them as unclassified
      while unkeyed. The stated reason for the adopted approach was to make distribution to less-protected government and
      industry environments easier; exclude the technical design of the machines and key-distribution systems.
    cues:
      option_words:
        O1: 8
        O2: 9
      real_option: O2
      real_to_mean_other_length: 1.12
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The government’s doctrinal choice was to treat the machines as unclassified when unkeyed because this greatly facilitated
  their distribution to relatively unprotected government environments and key industries.
