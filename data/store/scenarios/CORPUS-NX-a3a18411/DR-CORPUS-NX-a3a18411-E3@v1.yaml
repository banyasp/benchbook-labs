case:
  id: DR-CORPUS-NX-a3a18411-E3@v1
  title: Swat Peace Deal and Military Response
  status: draft
  setting: Swat Valley, Pakistan, after the spring 2009 peace deal; Pakistani military
  decider: Pakistani military leadership
  agent: Pakistani military leadership
  agent_role: decide
  situation: In spring 2009, Islamabad reached a peace deal with the local Pakistani Taliban chapter TSNM in Swat. The umbrella
    insurgency’s control in Pakistan was rising, and the northwest insurgency was linked to the insurgency in Afghanistan’s
    southeast. Insurgent and terrorist groups were embedded and proliferating in Pakistan’s tribal belt, which was assessed
    as a danger to the Pakistani government. Government control over areas near and beyond the Afghanistan border was greatly
    eroded. Pakistani military leadership must choose how to respond in Swat amid reports of insurgent influence and solidarity
    among extremist groups.
  question: 'What should the Pakistani military leadership do in Swat after the spring 2009 peace deal: authorize a military
    operation, decline to authorize one, or defer the decision?'
  options:
    O1:
      do: The Pakistani military leadership authorizes a military operation in Swat.
      move: act
      irreversible: true
    O2:
      do: The Pakistani military leadership declines to authorize a military operation in Swat.
      move: act
      irreversible: false
    O3:
      do: The Pakistani military leadership defers authorization of a military operation in Swat.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Pakistan faced a virulent insurgency in its northwest that was linked to the insurgency in Afghanistan’s southeast.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Extremist Islamist groups were embedded and proliferating in Pakistan’s tribal belt and were assessed as a clear
      and present danger to the Pakistani government.
  - id: F3
    kind: situation
    status: assessed
    fact: Insurgent and terrorist groups had effectively erased any semblance of government control over and beyond areas
      near the Afghanistan border.
  - id: F4
    kind: situation
    status: confirmed
    fact: In spring 2009, Islamabad reached a peace deal with the local Pakistani Taliban chapter TSNM in Swat.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Swat peace deal was an example of the umbrella insurgency’s rising control in Pakistan.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Local, regional, and global extremist Islamist groups had developed solidarity and operational assistance that proved
      difficult to untangle.
  - id: F7
    kind: situation
    status: confirmed
    fact: Pakistan had a population of 180 million and was nuclear-armed.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: A linked insurgency, expanding extremist presence, and severely eroded government control present a serious threat
      to the state; these conditions call for an effective response.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Swat deal is characterized not as resolving the threat but as an example of the umbrella insurgency’s rising
      control, weighing against treating the deal itself as an adequate response.
  - id: C3
    facts:
    - F1
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The insurgency’s cross-border link and the difficult-to-untangle solidarity and operational assistance among extremist
      groups make the broader challenge persistent and support acting rather than assuming the problem is isolated to the
      peace deal.
  reasoning:
    read: 'This is presented as a security problem larger than a local agreement: the Swat deal is treated as evidence of
      insurgent control rising within a linked and networked insurgency. The trap is to read the existence of a peace deal
      as proof that government control has been restored; the account instead connects the deal with expanding insurgent influence.
      It supplies contextual rationale, not a direct account of the leadership’s deliberation.'
    weighing: The assessed threat and eroded government control weigh strongly toward authorizing the operation {C1}. The
      characterization of the deal as an example of rising insurgent control weighs against declining action on the assumption
      that the deal resolved the problem {C2}. The wider links among insurgent groups reinforce the need for an effective
      response, though they do not by themselves establish what the operation would achieve {C3}. On this account, the balance
      favors {O1}; it depends on the assessment that insurgent control and threat remained serious.
    tradecraft: At decision level, record the assessed threat, the evidence that the deal did not signify restored government
      control, and the reasons for authorizing or declining action. Keep the decision and its accountability distinct from
      operational planning.
    uncertainty: The account gives no direct description of the military leadership’s deliberations, alternatives considered,
      legal authority, or expected costs and benefits of the operation. It also does not establish that the operation permanently
      resolved the broader insurgency.
    handoff: The Pakistani military leadership is the decider in the fixed scenario. No required external approval or consultation
      is identified, so no additional decision-maker can be inferred.
    tempting_wrong:
      option: O2
      pull: The peace deal could appear to offer a less escalatory way to address the Swat conflict.
      why_wrong: The deal is associated with rising insurgent control rather than restored government control, so treating
        it alone as an adequate answer conflicts with the threat assessment.
    rejected:
      O2: Declining authorization was not chosen because the deal is presented as evidence of rising insurgent control amid
        a serious, linked threat.
      O3: Deferral was not chosen because the assessments of insurgent expansion and eroded government control are presented
        as grounds for the subsequent operation, not as a reason to wait.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the peace deal had durably restored government control in Swat and substantially
        reduced the insurgent threat.
      then: O2
      why: 'That would remove the central condition used to support authorization: the deal’s association with rising insurgent
        control.'
    - id: flip2
      if: The leadership could not determine whether the deal had reduced the threat or whether insurgent control was still
        rising.
      then: O3
      why: Material uncertainty about the central assessment would make deferral more appropriate than relying on the stated
        rationale for authorization.
    would_not_change:
    - id: noflip1
      if: Pakistan remained a large, nuclear-armed state, without a change in the specific Swat assessments.
      why: Those background stakes heighten the consequences, but do not by themselves reverse the rationale, which rests
        on insurgent control, threat, and links among groups.
    watch_for:
    - id: watch1
      what: Whether insurgent groups re-establish bases and networks or regain control after military success.
      favors:
      - O1
      why: Earlier military success was later wiped away as insurgents established bases in Afghanistan’s southeast and Pakistan’s
        northwest, so continuing or renewed control would sustain the case for action.
  lesson: Do not treat a peace agreement as proof that a security threat has abated when the available assessment instead
    associates it with expanding control. The decision should track the actual condition of government control and the persistence
    of linked threats, while recognizing that this contextual rationale does not establish the operation’s long-term success.
  limits: This reasoning applies to the account of Swat in 2009 and its assessment of rising insurgent control. It does not
    establish a legal basis for force, address civilian or other operational consequences, or prove that military action is
    preferable when the threat assessment or circumstances differ.
