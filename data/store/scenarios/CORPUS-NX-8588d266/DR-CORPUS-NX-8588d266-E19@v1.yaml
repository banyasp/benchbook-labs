case:
  id: DR-CORPUS-NX-8588d266-E19@v1
  title: Reprisal After an Assassination Warning
  status: draft
  setting: Early 1993, White House
  decider: The President
  agent: The President
  agent_role: decide
  situation: A former president was scheduled to visit Kuwait for an honor recognizing the 1991 Gulf War rescue. Kuwaiti security
    services warned Washington that Iraqi agents were planning to assassinate him. The President ordered precautions to protect
    him and considered reprisal options against Iraq. Officials weighed possible civilian harm and narrowed the proposed actions
    to one site, Iraqi intelligence headquarters in central Baghdad. The stated aims included protecting U.S. sovereignty,
    deterring further violence against U.S. people, sending a message to state sponsors of terrorism, and affirming expected
    conduct among nations.
  question: What should the President do about the proposed reprisal against Iraq?
  options:
    O1:
      do: The President approves a limited reprisal against Iraqi intelligence headquarters in central Baghdad.
      move: act
      irreversible: true
    O2:
      do: The President rejects a limited reprisal against Iraqi intelligence headquarters in central Baghdad.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A former president was scheduled to visit Kuwait to be honored for the country's rescue in the 1991 Gulf War.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Kuwaiti security services warned Washington that Iraqi agents were planning to assassinate the former president.
  - id: F3
    kind: situation
    status: confirmed
    fact: The President ordered precautions to protect the former president.
  - id: F4
    kind: situation
    status: confirmed
    fact: The President asked about options for reprisal against Iraq.
  - id: F5
    kind: situation
    status: confirmed
    fact: Officials weighed possible collateral damage and narrowed the proposed actions to Iraqi intelligence headquarters
      in central Baghdad.
  - id: F6
    kind: situation
    status: confirmed
    fact: The stated aims included protecting U.S. sovereignty, deterring further violence against U.S. people, sending a
      message to those engaged in state-sponsored terrorism, and affirming expected conduct among nations.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The reported assassination plot gave the President a concrete reason to consider a response to state-sponsored violence.
      The stated purposes of deterrence and protecting U.S. sovereignty support a limited reprisal, though the reprisal is
      distinct from the precautions ordered to protect the former president.
  - id: C2
    facts:
    - F5
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Officials considered possible civilian harm and narrowed the proposed action to one site. That mitigation supports
      choosing only the limited option described, not a broader response; it does not make civilian risk disappear.
  - id: C3
    facts:
    - F6
    equity: norm_reciprocity
    favors:
    - O1
    weight: strong
    why: The President’s stated rationale included sending a message to state sponsors of terrorism and affirming expected
      conduct among nations. A firm, commensurate response was presented as serving those aims.
  - id: C4
    facts:
    - F2
    - F6
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: 'Deterrence is not assured: the historical assessment of the Libya strike was that it did not curb Qadhafi’s interest
      in terrorism, and the broader challenge of deterring a loose transnational network remained unresolved. That caution
      limits confidence in reprisal as a general counterterrorism answer, but does not by itself defeat the case for a limited
      response to the reported Iraqi plot.'
  reasoning:
    read: This is a reported state-sponsored assassination plot against a former president, alongside a separate decision
      about whether to retaliate. The trap is to treat protective precautions and reprisal as interchangeable, or to assume
      that a seemingly successful limited action proves lasting deterrence.
    weighing: The President’s stated case for reprisal was protection of sovereignty, deterrence of further violence against
      U.S. people, a message to state sponsors, and affirmation of expected conduct among nations. The officials’ consideration
      of civilian harm and narrowing of the proposed action made the contemplated response limited. The historical record
      offers some support for the Iraq action’s apparent success, but the Libya experience and the unresolved problem of deterring
      transnational networks counsel against claiming that retaliation reliably prevents future terrorism. On this record,
      the stated aims and mitigation support O1, while the balance depends on the reported threat being credible and the response
      remaining limited.
    tradecraft: Keep the protective measures for the former president distinct from the reprisal decision. Record the assessed
      threat, the stated purposes, the civilian-harm concerns and how they affected the choice, and the authority relied on.
      The available account does not specify a legal test or establish that any particular legal analysis was completed.
    uncertainty: The warning was an assessment by Kuwaiti security services, not a certainty established in the given facts.
      The later absence of further intelligence about Iraqi-planned terrorist acts was treated as consistent with success,
      but does not establish that the reprisal caused deterrence. The broader record also cautions that air-power retaliation
      did not curb Qadhafi’s interest in terrorism.
    handoff: The President is the decision-maker, but the decision should be informed by relevant interagency advice. The
      account describes White House and CIA consideration of collateral damage and identifies White House coordination of
      counterterrorism as an established practice; the President should retain responsibility for the decision and its rationale.
    tempting_wrong:
      option: O2
      pull: Rejecting reprisal avoids the risks of civilian harm and avoids relying on deterrence that may not work.
      why_wrong: Those are real cautions, but the reported plot, stated deterrence aims, and narrowing of the proposal support
        a limited response rather than treating uncertainty about deterrence as a reason to reject any reprisal.
    rejected:
      O2: The President did not reject reprisal because the reported plot and the stated aims of a firm, commensurate response
        supported approving the limited action after officials considered possible civilian harm.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The assassination warning were no longer credible or were materially disconfirmed before the decision.
      then: O2
      why: The central stated basis for reprisal would be substantially weakened, while its civilian and escalation risks
        would remain.
    - id: flip2
      if: Officials could not keep the proposed response limited or could not adequately address the identified risk of civilian
        harm.
      then: O2
      why: The mitigation that supports the limited reprisal would no longer support approving the proposed action.
    would_not_change:
    - id: noflip1
      if: Deterrence remained uncertain, while the reported plot was credible and the response remained limited.
      why: Uncertainty about deterrence counsels against overstating effectiveness, but the source’s stated rationale also
        rests on sovereignty, messaging, and expected conduct among nations.
    watch_for:
    - id: watch1
      what: Evidence that a reprisal would provoke further violence or fail to deter the responsible state.
      favors:
      - O2
      why: The historical account cautions that the Libya action did not curb Qadhafi’s interest in terrorism and identifies
        deterrence as a difficult problem.
  lesson: A limited reprisal may be recommended when a credible state-sponsored threat gives it a clear protective, deterrent,
    or norm-affirming purpose, and officials have considered and reduced civilian risk. Do not mistake a favorable immediate
    result for proof of lasting deterrence; keep the rationale, authority, and limits of the action explicit.
  limits: This judgment concerns a reported plot attributed to Iraqi state agents and a proposed limited response. It does
    not establish a general rule that reprisal is lawful or effective, supply a legal test absent from the account, or resolve
    how to deter loose transnational networks.
