case:
  id: DR-CORPUS-NX-8588d266-E89@v1
  title: Bond Release Pending FBI Clearance
  status: draft
  setting: Federal immigration detention program, post-September 11; discussed in 2004.
  decider: The Attorney General
  agent: The Attorney General
  agent_role: decide
  situation: The Attorney General is considering how bond release should relate to FBI clearance for people held on immigration
    charges in the post-September 11 program. The stated concern is the high rate of flight from deportation proceedings.
    Detainees were generally held on immigration charges, but the record also included one brief detention without a valid
    immigration charge. Some people remanded to the Marshals Service were held as material witnesses.
  question: What should the Attorney General do about the timing of bond release relative to FBI clearance for individuals
    held on immigration charges?
  options:
    O1:
      do: The Attorney General holds individuals in deportation proceedings until FBI clearance before permitting release
        on bond.
      move: act
      irreversible: false
    O2:
      do: The Attorney General permits individuals in deportation proceedings to obtain release on bond before FBI clearance.
      move: act
      irreversible: false
    O3:
      do: The Attorney General asks DOJ counsel to review the bond-release policy before setting the clearance condition.
      move: ask
      irreversible: false
      to: DOJ counsel
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The policy at issue was a hold-until-cleared rule.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Attorney General attributed the policy to a high rate of flight from deportation proceedings.
  - id: F3
    kind: situation
    status: confirmed
    fact: The detainees were generally held on immigration charges.
  - id: F4
    kind: situation
    status: confirmed
    fact: One detainee was held for a short time without a valid immigration charge.
  - id: F5
    kind: situation
    status: confirmed
    fact: Some individuals were released on bond.
  - id: F6
    kind: situation
    status: confirmed
    fact: Individuals released on bond were released only after the FBI cleared them of any connection to 9/11.
  - id: F7
    kind: situation
    status: confirmed
    fact: Some people remanded to the Marshals Service were held as material witnesses.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Attorney General's stated reason for the hold-until-cleared policy was the high rate of flight from deportation
      proceedings, which supports retaining custody before bond release.
  - id: C2
    facts:
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Bond release followed FBI clearance that the individual had no connection to 9/11; the clearance condition addressed
      the concern relevant to release.
  - id: C3
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The general basis for custody was immigration charges. That supports distinguishing this policy decision from detention
      without a charge, but does not by itself establish that every clearance-related delay was lawful.
  - id: C4
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O3
    - O2
    weight: weak
    why: The brief detention without a valid immigration charge is a warning against allowing a general clearance policy to
      substitute for lawful grounds to detain an individual.
  reasoning:
    read: This is a choice about whether bond release waits for FBI clearance, not a decision about closed hearings or secrecy
      of detainee names. The stated justification is flight from deportation proceedings; the legal caution is that a clearance
      condition cannot itself supply an immigration charge.
    weighing: The Attorney General's stated flight concern supports O1, and bond release occurred only after FBI clearance.
      The general presence of immigration charges supports the policy's ordinary setting, while the brief no-charge detention
      counsels against applying it without checking individual legal authority. The source endorses O1 but does not establish
      that the clearance condition independently resolves every question about lawful custody or delay.
    tradecraft: Apply the hold only to people with a valid basis for immigration detention; keep that basis distinct from
      the FBI-clearance condition. Record the flight concern and clearance status supporting the timing of release, and separately
      flag any case lacking a valid charge for prompt legal review.
    uncertainty: The stated rationale is the high rate of flight, but the excerpt gives no rate, individual flight assessments,
      clearance timelines, or legal analysis of the condition's limits. It also records one brief detention without a valid
      immigration charge.
    handoff: The Attorney General is the decision-maker for the policy. Involving DOJ counsel to review the policy's legal
      limits and the no-valid-charge exception is prudent implementation advice, not a step stated as part of the source's
      decision.
    tempting_wrong:
      option: O2
      pull: Allowing bond before clearance avoids making clearance a prerequisite to release.
      why_wrong: It sets aside the Attorney General's stated concern that people were fleeing deportation proceedings and
        does not reflect the source's endorsed hold-until-cleared outcome.
    rejected:
      O2: It was not chosen because the Attorney General established the hold-until-cleared policy in response to the high
        rate of flight from deportation proceedings.
      O3: It was not chosen because the source presents the Attorney General as having established the policy, rather than
        deferring the decision for counsel review.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable updated evidence showed that the high rate of flight from deportation proceedings no longer applied.
      then: O2
      why: The stated reason for withholding bond release pending clearance would be materially weakened.
    - id: flip2
      if: Review showed that detention without a valid immigration charge was a recurring feature rather than a brief exception.
      then: O3
      why: The legal-authority concern would warrant counsel review before applying the clearance condition as a basis for
        continued detention.
    would_not_change:
    - id: noflip1
      if: Some people remanded to the Marshals Service were material witnesses.
      why: That status alone does not change the bond-timing choice for individuals held on immigration charges.
    watch_for:
    - id: watch1
      what: Whether current evidence continues to support the stated high rate of flight from deportation proceedings.
      favors:
      - O1
      why: The Attorney General's stated rationale for the policy depends on that concern remaining applicable.
  lesson: A stated enforcement concern can support a general custody policy, but it does not replace the need for a valid
    individual legal basis to detain. Keep the policy rationale and the legal authority for each person's detention analytically
    separate.
  limits: This reasoning addresses only bond timing relative to FBI clearance in the described post-September 11 immigration
    program. It does not decide the legality of closed hearings, name secrecy, or detention under a different legal basis.
  library:
    domain: security-clearance
    family: CORPUS-NX-8588d266
    source: https://archive.org/download/911_final_report/911_Full_Report.pdf
    episode_focus: The passage says the Attorney General established a “hold until cleared” policy because of the high rate
      of flight from deportation proceedings; it also notes that release on bond followed FBI clearance. Focus on the detention-policy
      choice, its stated rationale, and the legal safeguards or costs implicated by holding people pending clearance. Do not
      treat the separate disputes over closed hearings and detainee-name secrecy as part of this decision.
    cues:
