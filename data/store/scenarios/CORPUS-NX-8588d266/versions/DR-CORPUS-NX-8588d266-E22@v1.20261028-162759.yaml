case:
  id: DR-CORPUS-NX-8588d266-E22@v1
  title: A Time-Sensitive Strike Recommendation
  status: draft
  setting: Kandahar, December 20, 1998; an urgent teleconference of senior government principals.
  decider: The principals
  agent: The principals
  agent_role: advise
  situation: On December 20, 1998, senior officials faced a time-sensitive report that a senior al-Qaeda leader would spend
    the night at a residence in Kandahar. A proposal was before them to recommend that the President order a strike. The principals
    had doubts about the intelligence source, and several hours had passed since the last sighting. One senior military adviser
    estimated civilian deaths or injuries well above 200 and raised concern about a nearby mosque; a senior intelligence officer
    estimated about half as many casualties and did not predict mosque damage. The principals had to choose whether to recommend
    presidential action, seek further assessment, or withhold a recommendation.
  question: What should the principals do about the proposed recommendation that the President order a strike based on the
    time-sensitive report?
  options:
    O1:
      do: The principals reject a recommendation that the President order a strike at the reported location.
      move: act
      irreversible: false
    O2:
      do: The principals approve a recommendation that the President order a strike at the reported location.
      move: act
      irreversible: false
    O3:
      do: The principals request an updated intelligence assessment from intelligence officials before making a recommendation.
      move: ask
      irreversible: false
      to: intelligence officials
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: On December 18, intelligence indicated that the senior al-Qaeda leader might be traveling to Kandahar.
  - id: F2
    kind: intelligence
    status: assessed
    fact: On December 20, intelligence indicated that the senior al-Qaeda leader would spend the night at a house within the
      governor’s residence in Kandahar.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The principals had doubts about the reliability of the intelligence source.
  - id: F4
    kind: situation
    status: assessed
    fact: A senior military adviser predicted civilian deaths or injuries well above 200.
  - id: F5
    kind: situation
    status: assessed
    fact: A senior intelligence officer estimated about half the civilian harm predicted by the military adviser and did not
      predict damage to the nearby mosque.
  - id: F6
    kind: situation
    status: assessed
    fact: The senior military adviser was concerned about damage to a nearby mosque.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Military officials were concerned that several hours had passed since the last sighting and that the chance of failure
      was too great.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The principals faced sharply different estimates of civilian deaths and injuries, including a military estimate well
      above 200, and concern that a nearby mosque could be damaged. The uncertainty did not remove the potential for severe
      harm to civilians.
  - id: C2
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The principals doubted the intelligence source's reliability, weakening the basis for a consequential recommendation.
  - id: C3
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The report offered a time-sensitive opportunity to act against the senior al-Qaeda leader, but several hours had
      passed since the last sighting, leading military officials to judge the chance of failure too great.
  - id: C4
    facts:
    - F6
    equity: protected_sites
    favors:
    - O1
    weight: weak
    why: The military adviser was concerned about damage to a nearby mosque, adding a site-specific concern to the predicted
      civilian harm.
  reasoning:
    read: 'The principals had a time-sensitive report, not certain knowledge of the leader''s presence: they doubted the source,
      and the last sighting was several hours old. The trap was treating urgency as proof that the opportunity was both reliable
      and likely to succeed, or treating the lower harm estimate as eliminating the serious civilian-harm concern.'
    weighing: 'The report created a possible opportunity to act, but the principals weighed that against doubts about its
      reliability, the elapsed time and resulting risk of failure, and estimates of potentially extensive civilian harm and
      mosque damage. They decided against recommending a strike. That balance was contested: field and other lower-level officials
      believed the opportunity should have been taken despite the risks.'
    tradecraft: For a decision of this kind, make the source-reliability concern, time of last sighting, range of civilian-harm
      estimates, and mosque concern explicit in the recommendation record; distinguish what is known from what is uncertain
      rather than presenting a single estimate as settled.
    uncertainty: The source does not resolve which civilian-harm estimate was more accurate or whether the leader would still
      have been present when action could occur. The principals' concerns about source reliability and the elapsed time therefore
      remained material.
    handoff: The principals were the senior officials convened to decide whether to recommend presidential action; the President
      held the decision on whether to order it. The principals' role was to give a recommendation that reflected both the
      intelligence doubts and the civilian-harm concerns.
    tempting_wrong:
      option: O2
      pull: The report might have presented a rare opportunity, and officials in the field urged immediate action.
      why_wrong: That urgency did not resolve the principals' doubts about the source, the risk that the leader had moved,
        or the prospect of substantial civilian harm.
    rejected:
      O2: The principals did not recommend presidential action because they judged the intelligence doubts, elapsed time and
        potential civilian harm too serious in light of the chance of failure.
      O3: The principals chose against recommending a strike rather than deferring for another assessment; the source records
        no updated assessment that would have resolved the doubts within the available time.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The report were materially more reliable and current, and the expected civilian harm and mosque risk were materially
        lower.
      then: O2
      why: Those changes would strengthen the prospect of a successful opportunity while reducing the principal harms that
        led the principals to withhold a recommendation.
    would_not_change:
    - id: noflip1
      if: The casualty estimate were lower, but the source reliability doubts and the several-hour gap since the last sighting
        remained.
      why: A lower estimate alone would not resolve the principals' concerns about whether the report was reliable or whether
        the opportunity remained viable.
    watch_for:
    - id: watch1
      what: For retrospective assessment, later intelligence appeared to indicate that the leader had left before the strike
        would have occurred.
      favors:
      - O1
      why: That information bears on the failure risk, although it was not established as information available to the principals
        at the decision point.
  lesson: A time-sensitive opportunity does not make uncertain intelligence reliable or eliminate the need to weigh expected
    harm to civilians. When estimates and confidence differ, the decision should reflect that uncertainty and the risk of
    failure rather than allowing urgency alone to control.
  limits: This reasoning addresses the principals' recommendation on the information and concerns described in this episode;
    it does not establish a general rule for whether a strike is lawful or appropriate. It does not resolve what the outcome
    should be under materially different intelligence or harm assessments.
