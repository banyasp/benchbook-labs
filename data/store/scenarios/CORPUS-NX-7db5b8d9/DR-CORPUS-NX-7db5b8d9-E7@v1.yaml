case:
  id: DR-CORPUS-NX-7db5b8d9-E7@v1
  title: Civilian Boats on Lake Tanganyika
  status: draft
  setting: Albertville, during the Congo operation; CIA field activity
  decider: The officer receiving the request
  agent: The officer receiving the request
  agent_role: decide
  situation: In Albertville, Cuban pilots proposed attacks on boats crossing Lake Tanganyika. The boats were civilian. The
    pilots' case officer brought the proposal to the officer receiving the request. The pilots had not specified a standard
    for deciding which boats were suspicious. The officer receiving the request judged that the pilots likely could not provide
    such a standard even if asked. The proposal was awaiting a decision.
  question: What should the officer receiving the request do about the pilots' proposal to attack civilian boats crossing
    Lake Tanganyika?
  options:
    O1:
      do: The officer receiving the request asks the pilots for a suspicion standard before deciding on the proposed attacks.
      move: ask
      irreversible: false
      to: the pilots
    O2:
      do: The officer receiving the request authorizes the pilots to attack civilian boats crossing Lake Tanganyika.
      move: act
      irreversible: true
    O3:
      do: The officer receiving the request declines to authorize the proposed attacks on civilian boats crossing Lake Tanganyika.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision episode took place in Albertville.
  - id: F2
    kind: situation
    status: confirmed
    fact: The pilots were Cuban.
  - id: F3
    kind: situation
    status: confirmed
    fact: The pilots proposed attacks on boats.
  - id: F4
    kind: situation
    status: confirmed
    fact: The boats were civilian.
  - id: F5
    kind: situation
    status: confirmed
    fact: The boats were crossing Lake Tanganyika.
  - id: F6
    kind: situation
    status: confirmed
    fact: The pilots' case officer brought the proposal to the officer receiving the request.
  - id: F7
    kind: situation
    status: confirmed
    fact: The pilots had not specified a standard for identifying suspicious boats.
  - id: F8
    kind: capability
    status: assessed
    fact: The officer receiving the request judged that the pilots almost certainly could not specify such a standard if asked.
  - id: F9
    kind: authority
    status: assessed
    fact: The officer receiving the request regarded consultation with Leopoldville or Washington as unnecessary before responding.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: civilian_life
    favors:
    - O3
    - O1
    weight: strong
    why: The proposed attacks would be directed at civilian boats, so declining or pausing the proposal avoids authorizing
      harm to civilians without an identified basis for selecting particular boats.
  - id: C2
    facts:
    - F7
    equity: third_party_harm
    favors:
    - O3
    - O1
    weight: strong
    why: The pilots had not specified how they would distinguish suspicious boats from other civilian boats; without such
      a standard, the proposal lacked a stated basis for singling out boats for attack.
  - id: C3
    facts:
    - F7
    - F8
    equity: third_party_harm
    favors:
    - O3
    weight: strong
    why: The officer judged that the pilots almost certainly could not supply the missing standard even if asked, making a
      request for clarification unlikely to resolve the central concern.
  reasoning:
    read: This was a proposal to attack civilian boats, but the pilots had supplied no standard for deciding which boats were
      suspicious. The trap is treating the label “suspicious” as if it were a usable basis for choosing boats when no such
      basis had been stated.
    weighing: The decisive concern is that the proposal offered no way to distinguish boats that might warrant action from
      other civilian boats, and the officer believed that asking would almost certainly not produce such a standard {C1} {C2}
      {C3}. That favors refusing the proposal over either authorizing it or asking for clarification; the judgment depends
      on the officer’s assessment that the missing standard was unlikely to be supplied.
    tradecraft: State the refusal plainly and preserve the decision and its stated rationale in the appropriate record. Do
      not add an operational engagement plan or treat an undefined suspicion standard as sufficient justification.
    uncertainty: The account gives no further basis for identifying suspicious boats and does not state a legal or rules-of-engagement
      test. The officer’s view that the pilots could not provide a standard was an assessment, not a demonstrated certainty.
    handoff: The officer decided without consulting Leopoldville or Washington, regarding consultation unnecessary before
      responding. That supports an immediate refusal in this episode, not a general rule against consultation in other circumstances.
    tempting_wrong:
      option: O1
      pull: Asking the pilots for a standard could appear to be a cautious way to resolve the uncertainty before deciding.
      why_wrong: The officer judged that they almost certainly could not specify one even if asked, so clarification was unlikely
        to cure the proposal’s central defect.
    rejected:
      O1: The officer judged that asking for a suspicion standard was unlikely to produce one, so declined rather than prolonging
        the decision for an answer unlikely to resolve the concern.
      O2: The officer refused because the pilots had no stated standard for distinguishing suspicious boats and were judged
        almost certainly unable to provide one.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible, usable suspicion standard could reasonably be obtained from the pilots through clarification.
      then: O1
      why: That would weaken the officer’s stated reason that asking would be futile and make seeking the standard before
        deciding a reasonable next course, without itself establishing that an attack should be authorized.
    would_not_change:
    - id: noflip1
      if: The officer asks the pilots for a standard and they still cannot specify one.
      why: That is the very possibility the officer anticipated; the absence of a basis for distinguishing suspicious boats
        would remain.
    watch_for: []
  lesson: Do not authorize attacks on civilians when the proposal supplies no standard for distinguishing those who might
    warrant action from others. If the decision-maker reasonably judges that clarification will not provide such a standard,
    refusal is preferable to treating an undefined suspicion as sufficient.
  limits: This reasoning addresses the specific proposal and the officer’s assessment that the pilots could not state a suspicion
    standard. The account does not establish a general legal test, rules of engagement, or a rule that consultation is unnecessary
    in other cases.
