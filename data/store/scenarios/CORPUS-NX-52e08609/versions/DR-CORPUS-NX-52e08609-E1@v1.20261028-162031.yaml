case:
  id: DR-CORPUS-NX-52e08609-E1@v1
  title: The Cold War Intelligence Gap and Crew Risk
  status: draft
  setting: United States, early years of the Cold War, national policymakers and the newly established intelligence community.
  decider: National policymakers
  agent: National policymakers
  agent_role: decide
  situation: In the early Cold War, U.S. national strategy relied on massive retaliation with nuclear bombing. That strategy
    depended on information about Soviet military forces and industry, but U.S. intelligence institutions had little knowledge
    of those matters. The intelligence community also knew little about internal events in the Soviet bloc. Policymakers feared
    conflict with the Soviet bloc could erupt at any time. A proposed intelligence initiative addressed gaps concerning Soviet
    air defenses and military industries, while exposing crews to considerable risk. The choice was whether to pursue intelligence
    collection or continue national planning with the information gap.
  question: What should national policymakers do about authorizing intelligence collection concerning Soviet military capabilities
    while weighing the risk to crews?
  options:
    O1:
      do: National policymakers authorize a policy of intelligence collection concerning Soviet military capabilities.
      move: act
      irreversible: false
    O2:
      do: National policymakers decline a policy of intelligence collection concerning Soviet military capabilities.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: U.S. strategy in the early Cold War relied on massive retaliation with nuclear bombing by the Air Force.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The strategy depended on information about Soviet military forces and industry that the United States did not possess.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The newly established intelligence community knew very little about internal events in the Soviet bloc.
  - id: F4
    kind: capability
    status: confirmed
    fact: In the late 1940s, the United States had very limited intelligence about the Soviet bloc across available intelligence
      channels.
  - id: F5
    kind: situation
    status: assessed
    fact: National policymakers feared that war with the Soviet bloc could erupt at any time.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: A proposed intelligence effort was intended to address gaps concerning Soviet air defenses and military industries.
  - id: F7
    kind: situation
    status: assessed
    fact: The contemplated effort put crews' lives at considerable risk.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The national strategy relied on information about Soviet forces and industry that the United States lacked, making
      the intelligence gap consequential to the strategy.
  - id: C2
    facts:
    - F3
    - F4
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The intelligence community had little knowledge of the Soviet bloc, and the proposed effort was intended to address
      gaps concerning Soviet air defenses and military industries.
  - id: C3
    facts:
    - F5
    - F7
    equity: own_force_life
    favors:
    - O1
    - O2
    weight: strong
    why: Policymakers feared conflict could erupt at any time, but collection put crews' lives at considerable risk. They
      judged the intelligence payoff worth that potential cost, favoring O1 despite the serious concern for crew safety.
  reasoning:
    read: 'Policymakers faced a serious intelligence gap in an environment where they feared war could erupt at any time.
      The trap is treating the risk to crews as the only relevant cost: declining collection would also leave national strategy
      dependent on information the United States did not have.'
    weighing: The strategy's dependence on information about Soviet forces and industry, and the proposed effort's relevance
      to the intelligence gaps, strongly support O1 {C1} {C2}. The considerable risk to crews weighs against collection, but
      policymakers judged the intelligence payoff worth the potential cost {C3}. The balance depends on the gap's importance
      and the expected intelligence payoff being sufficient to justify the risk.
    tradecraft: At the policy level, make the expected intelligence benefit and the risk to crews explicit in the authorization
      rationale; record the assumptions supporting the judgment and revisit them if either changes. Do not treat this as an
      authorization of any particular collection method.
    uncertainty: The intelligence picture was very limited, and the contemplated risk to crews was considerable; neither the
      expected intelligence benefit nor the likelihood of harm to crews was quantified.
    handoff: The choice was assigned to national policymakers, and no separate approval body was identified. The decision
      should therefore remain at that policy level; no further referral requirement is established.
    tempting_wrong:
      option: O2
      pull: Declining collection avoids exposing crews to considerable risk.
      why_wrong: It leaves policymakers planning a strategy that depends on information about Soviet capabilities they did
        not possess, despite the perceived urgency.
    rejected:
      O2: National policymakers did not accept continued planning with the intelligence gap because they judged the intelligence
        payoff worth the potential cost to crews.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Policymakers determine that the expected intelligence payoff no longer justifies the considerable risk to crews.
      then: O2
      why: The endorsement rests on the judgment that the payoff was worth the potential cost; reversing that balance removes
        the stated basis for collection.
    - id: flip2
      if: The intelligence gap concerning the capabilities relevant to national strategy is substantially resolved without
        this policy.
      then: O2
      why: The rationale for collection is the need to address an intelligence gap on which the strategy depended.
    would_not_change:
    - id: noflip1
      if: Crews face considerable risk while the intelligence gap remains important and policymakers continue to judge the
        payoff worth the potential cost.
      why: 'This preserves the balance policymakers accepted: the intelligence payoff warrants the potential cost to crews.'
    watch_for:
    - id: watch1
      what: Whether the intelligence gap remains consequential to national strategy and whether the expected payoff still
        warrants the risk to crews.
      favors:
      - O1
      - O2
      why: Those considerations determine whether the justification for accepting the risk continues to hold.
  lesson: When national strategy depends on information that is unavailable, policymakers should weigh the consequences of
    acting under that gap against the risks of seeking the information. Considerable risk to personnel is justified only where
    the intelligence payoff is judged worth the potential cost.
  limits: This reasoning applies to the policy-level choice described, not to any particular collection method or operational
    implementation. It does not provide a legal standard, quantify the risk or payoff, or address safeguards for crews.
  library:
    domain: natsec-other
    family: CORPUS-NX-52e08609
    source: https://media.defense.gov/2021/Jul/13/2002761781/-1/-1/0/DANGEROUS_BUSINESS.PDF
