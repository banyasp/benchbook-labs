case:
  id: DR-CORPUS-NX-b16fa7a0-E1@v1
  title: Tank Troop Force-Structure Pilot
  status: draft
  setting: Army institutional decision; proposed Armored Cavalry Squadron pilot; timeframe not specified.
  decider: Army Testing and Evaluation Command, in coordination with Maneuver Center of Excellence
  agent: Army Testing and Evaluation Command, in coordination with Maneuver Center of Excellence
  agent_role: decide
  situation: An Armored Cavalry Squadron’s Tank Troop operates under an MTOE assessed as short of personnel and assets for
    its concurrent duties. The XO may be engaged in maneuver combat while also expected to perform battle tracking, logistical
    planning, and coordination with Squadron. The command post has one general-purpose AMPV, which also serves as the sole
    casualty-evacuation platform. Tanks lack organic evacuation capability, and recent CTC rotations recorded 44% dead on
    arrival and 42% died of wounds. The proposed package changes the XO’s vehicle assignment, adds a medical AMPV, and adds
    two short-range reconnaissance sUAS per platoon. A pilot could include evaluation outlines, coordination with acquisition
    and logistics commands, and a follow-on assessment after 12 months or a CTC rotation.
  question: What should the Army Testing and Evaluation Command, in coordination with the Maneuver Center of Excellence, do
    about testing the proposed Tank Troop force-structure package?
  options:
    O1:
      do: ATEC and MCoE approve the pilot, develop evaluation outlines, coordinate resources, and conduct a follow-on assessment.
      move: act
      irreversible: false
    O2:
      do: ATEC and MCoE defer the pilot and request an implementation and resource plan.
      move: ask
      irreversible: false
      to: Army acquisition and logistics commands
    O3:
      do: ATEC and MCoE reject the pilot, retain the current MTOE, and take no evaluation steps.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The current Tank Troop MTOE is assessed as lacking personnel and assets to develop the tactical situation while
      also performing medical treatment, evacuation, support, and command-and-control duties.
  - id: F2
    kind: situation
    status: assessed
    fact: A fighting XO creates internal friction and strains the roles and responsibilities of the XO and the Troop First
      Sergeant.
  - id: F3
    kind: capability
    status: assessed
    fact: When the XO is engaged in maneuver combat, the XO’s capacity for battle tracking, logistical planning, and maintaining
      the link between the Troop and Squadron is limited.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Troop command post uses one general-purpose AMPV, which is also the sole casualty-evacuation platform under
      the current MTOE.
  - id: F5
    kind: capability
    status: confirmed
    fact: Tanks lack organic evacuation capability, and recent CTC rotations recorded 44% dead on arrival and 42% died of
      wounds.
  - id: F6
    kind: capability
    status: assessed
    fact: The proposed command-post change replaces the XO’s D65 Tank with a Command Variant AMPV while retaining both headquarters
      tanks on the MTOE.
  - id: F7
    kind: capability
    status: assessed
    fact: The proposed medical change replaces one JLTV with a medical AMPV and assigns medical personnel to it.
  - id: F8
    kind: capability
    status: assessed
    fact: Each platoon would receive two short-range reconnaissance sUAS under the proposed package.
  - id: F9
    kind: situation
    status: confirmed
    fact: The proposed pilot includes developing training and evaluation outlines, coordinating with Army acquisition and
      logistics commands for resources, and conducting a follow-on assessment after 12 months or a CTC rotation.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The MTOE is assessed as short of personnel and assets for concurrent duties, and a fighting XO has limited capacity
      for battle tracking, logistical planning, and coordination with Squadron. The proposed command-post change is intended
      to improve those functions.
  - id: C2
    facts:
    - F4
    - F5
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The sole casualty-evacuation platform also serves the command post, while tanks lack organic evacuation capability
      and recent CTC rotations recorded substantial deaths on arrival and deaths of wounds. The proposed medical AMPV and
      assigned medical personnel are intended to improve casualty care and survival.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The proposed command-variant AMPV is intended to improve battlefield tracking and command and control while retaining
      both headquarters tanks, preserving the stated combat power.
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The proposed platoon-level sUAS allocation is intended to address the Tank Troop's lack of dedicated reconnaissance
      capability and improve tactical flexibility.
  - id: C5
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The recommended pilot includes evaluation outlines, resource coordination, and a follow-on assessment. That approach
      tests the package's impact before any wider implementation is considered.
  reasoning:
    read: This is an institutional choice about whether to test a proposed force-structure package, not a decision to adopt
      it Army-wide or a scenario about how to conduct reconnaissance. The trap is treating the proposal's expected benefits
      as already proven, or treating uncertainty as a reason to forgo the recommended pilot.
    weighing: The assessed command-and-control shortfall and the casualty-evacuation deficiencies weigh strongly toward testing
      the package {C1} {C2}. The proposed changes also aim to preserve headquarters tank combat power while improving command-post
      functions, and add organic reconnaissance capability {C3} {C4}. A pilot with evaluation and follow-on assessment provides
      a way to assess impact rather than assume effectiveness {C5}. The balance supports {O1}; it depends on being able to
      coordinate the resources needed to conduct a meaningful test.
    tradecraft: Define evaluation outlines for the package's stated command-and-control, casualty-evacuation, and tactical-flexibility
      aims; coordinate the required AMPV and sUAS resources with acquisition and logistics commands; and document the follow-on
      assessment after 12 months or a CTC rotation. Keep the decision recorded as approval to test, not as a finding that
      the package has already proven effective.
    uncertainty: The identified deficiencies are assessed, and the proposed changes are expected to improve capability, but
      their impact has not yet been evaluated in a pilot. Resource availability and the package's measured impact therefore
      remain unresolved.
    handoff: ATEC should decide in coordination with MCoE, as proposed, and involve Army acquisition and logistics commands
      to coordinate the additional resources needed for the pilot. The recommendation also calls for developing training and
      evaluation outlines and conducting a follow-on assessment.
    tempting_wrong:
      option: O2
      pull: Deferring for an implementation and resource plan may appear prudent because the package's effectiveness has not
        been demonstrated and additional resources are needed.
      why_wrong: The recommendation is to use a pilot and follow-on assessment to test the proposed changes, while coordinating
        with acquisition and logistics commands to secure resources; prior proof of effectiveness is not made a condition
        for testing.
    rejected:
      O2: Deferring the pilot for a separate plan was not chosen because the recommendation is to initiate the pilot and coordinate
        resources as part of carrying it out.
      O3: Rejecting the pilot would leave the identified command-and-control, evacuation, and tactical-flexibility deficiencies
        without the proposed evaluation.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The required resources could not be secured in time to conduct a meaningful pilot.
      then: O2
      why: Without the resources needed to test the proposed package, deferring to request a resource plan would be more workable
        than approving an infeasible pilot.
    - id: flip2
      if: Credible prior evaluation showed that the package did not improve the stated command-and-control, evacuation, or
        tactical-flexibility deficiencies.
      then: O3
      why: If the expected benefits were already shown not to materialize, the case for testing this package would weaken
        substantially.
    would_not_change:
    - id: noflip1
      if: The follow-on assessment is scheduled after 12 months rather than following a CTC rotation, or vice versa.
      why: The recommendation allows either assessment point; that timing choice does not change the recommendation to approve
        the pilot.
    watch_for:
    - id: watch1
      what: Whether the follow-on assessment shows improvements in command and control, casualty survival, and operational
        effectiveness.
      favors:
      - O1
      why: The recommendation calls for assessing the package's impact and makes wider implementation contingent on it being
        proven effective.
  lesson: When a source recommends a pilot to address identified capability deficiencies, distinguish authorization to test
    from adoption of the proposed changes. Tie the test to the stated deficiencies, coordinate the resources and evaluation,
    and use the results before deciding on wider implementation.
  limits: This reasoning supports testing the proposed package on the stated record; it does not establish that the changes
    are effective or that they should be adopted across all tank formations. It also does not address operational use of reconnaissance
    systems.
