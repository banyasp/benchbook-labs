case:
  id: DR-OGE-2635-304-addfact1@v1
  title: Collection for Gift on Swearing‑In or Promotion [addfact]
  status: needs_review
  setting: Federal department office, present day, operating under 5 CFR 2635.304 regulations
  decider: Agency Ethics Official
  agent: Ethics Assistant
  agent_role: advise
  situation: Staff members in a federal office are contemplating a collection to purchase a gift for their supervisor, who
    is about to be sworn into a higher-grade position. The promotion does not end the supervisory relationship, and the supervisor's
    desk is located in the same open workspace as the staff. Under 5 CFR 2635.304(c) voluntary, nominal-value contributions
    are allowed for gifts on special, infrequent occasions or for shared refreshments. Example 3 to paragraph (c) clarifies
    that collections for a gift on a swearing-in or promotion are prohibited because such events are not personal-significance
    occasions, although contributions for office refreshments to mark the event are permissible. The Agency Ethics Official
    has delegated authority to the Ethics Assistant to interpret these rules.
  question: How should the Ethics Assistant advise the staff regarding a collection for a gift to their supervisor on the
    swearing-in or promotion occasion?
  options:
    O1:
      do: Advise that the staff may proceed with a collection to purchase a gift for the supervisor on the swearing-in or
        promotion occasion.
      move: act
      irreversible: false
    O2:
      do: Advise that the staff should first obtain clarification from the Agency Ethics Official before initiating any collection.
      move: ask
      irreversible: false
    O3:
      do: Advise that the staff are prohibited from collecting contributions for a gift to the supervisor on the swearing-in
        or promotion occasion.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: 5 CFR 2635.304(c) permits voluntary, nominal-value contributions for gifts given on special, infrequent occasions,
      as well as for food or refreshments to be shared in the workplace.
  - id: F2
    kind: situation
    status: confirmed
    fact: Example 3 to paragraph (c) specifies that employees may not organize a collection for a gift to a supervising official
      on the occasion of that official's swearing-in or promotion.
  - id: F3
    kind: situation
    status: confirmed
    fact: The office's floor plan situates the supervising official's desk within the same open workspace as the employees'
      cubicles.
  - id: F4
    kind: situation
    status: confirmed
    fact: The same example allows employees to gather contributions for refreshments that will be consumed by everyone in
      the immediate office to commemorate the swearing-in or promotion.
  - id: F5
    kind: situation
    status: confirmed
    fact: A swearing-in or promotion does not terminate the supervisory relationship between employees and the official.
  - id: F6
    kind: situation
    status: confirmed
    fact: A swearing-in or promotion is not classified as a personal-significance event under paragraph (b).
  - id: F7
    kind: authority
    status: confirmed
    fact: According to 5 CFR 2635.304, collections for gifts are barred on occasions that are not special, infrequent personal-significance
      events or termination events.
  - id: F8
    kind: authority
    status: assessed
    fact: The Agency Ethics Official has delegated to the Ethics Assistant the authority to interpret and provide guidance
      on the gift-collection regulations.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Example 3 to §2635.304(c) explicitly states that subordinates may not take up a collection for a gift on the occasion
      of a superior's swearing-in or promotion, and the regulation bars such collections when the occasion is not a special,
      infrequent personal-significance event.
  - id: C2
    facts:
    - F6
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: A swearing-in or promotion does not terminate the subordinate-superior relationship and is not defined as an event
      of personal significance under paragraph (b); therefore it does not meet the exception criteria for gift collections.
  - id: C3
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: §2635.304(c) permits voluntary contributions only for gifts on special, infrequent occasions or for shared refreshments;
      a promotion is neither, so a collection for a gift is prohibited.
  - id: C4
    facts:
    - F4
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The same example allows a collection for refreshments that will be consumed by everyone in the immediate office;
      because {F3} shows the supervisor's desk is in the same open workspace, the refreshments would indeed be shared, emphasizing
      the regulatory distinction between permissible refreshments and prohibited gift collections.
  reasoning:
    read: Staff seek to raise money for a gift to their supervisor on the day of a swearing-in or promotion. The regulation
      treats such career events as ordinary, not personal-significance occasions, and Example 3 to §2635.304(c) expressly
      forbids a collection for a gift on these occasions.
    weighing: C1-C3 each point to a clear regulatory prohibition; C4 clarifies that refreshments are permissible but does
      not outweigh the bans; C5 adds a credibility concern that further supports prohibition. The cumulative balance therefore
      favors O3.
    tradecraft: The Ethics Assistant should issue a written advisory citing §2635.304(c) and Example 3, note the open-workspace
      layout ({F3}) as supporting the distinction, and file the guidance in the agency's ethics records.
    uncertainty: Minimal; the statutory language and example are unambiguous.
    handoff: Because the Agency Ethics Official has delegated interpretive authority (F8), the assistant may provide the final
      advice without further escalation.
    tempting_wrong:
      option: O1
      pull: Staff may view a modest gift as a customary token for a promotion.
      why_wrong: Even a modest gift contravenes the explicit prohibition in Example 3 to §2635.304(c); permitting it would
        breach ethics regulations.
    rejected:
      O1: The regulation's example expressly forbids a collection for a gift on a promotion occasion.
      O2: Deferring to the Ethics Official is unnecessary because the rule is clear and the assistant already holds delegated
        authority.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The occasion were a personal-significance event such as a marriage, serious illness, or the birth of a child.
      then: O1
      why: Paragraph (b) permits collections for gifts on infrequently occurring personal-significance occasions.
    would_not_change:
    - id: noflip1
      if: The collection is framed as a gift rather than as refreshments to be shared.
      why: The regulation distinguishes gifts from shared refreshments; a gift collection remains prohibited.
    watch_for:
    - id: watch1
      what: Attempts to label the gift as "refreshments" to bypass the prohibition.
      favors:
      - O3
      why: Even if labeled as refreshments, the intent is to give a personal gift, which the regulation does not allow.
  lesson: Under 5 CFR 2635.304(c), collections for gifts are permissible only on special, infrequent personal-significance
    occasions or when the supervisory relationship ends; promotions do not qualify, so such collections must be prohibited.
  limits: This analysis is confined to federal employee gift-collection rules under 5 CFR 2635.304 and does not apply to private-sector
    policies, non-federal entities, or other statutory regimes.
