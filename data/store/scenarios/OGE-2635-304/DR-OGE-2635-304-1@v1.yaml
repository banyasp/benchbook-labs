        O2: 13
      real_option: O2
      real_to_mean_other_length: 1.08
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
verdict_tier: source-endorsed
basis: The regulation states that gifts on special, infrequent occasions of personal significance are limited to those listed
  (marriage, illness, bereavement, birth, adoption, termination); birthdays are not included, and the general exception caps
  occasional gifts at $10.
