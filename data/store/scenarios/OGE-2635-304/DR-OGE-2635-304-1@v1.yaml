case:
  id: DR-OGE-2635-304-1@v1
  title: CFPB Economist Gift for Supervisor's 50th Birthday
  status: draft
  setting: Consumer Financial Protection Bureau, present day
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An economist employed by the Consumer Financial Protection Bureau overhears that the employee's supervisor will
    soon celebrate a 50th birthday. The economist wishes to present the supervisor with a bottle of wine that costs $25. The
    supervisor is the economist's official superior. The agency follows the ethics regulations at 5 C.F.R. §2635.304, which
    outline permissible gifts. Gifts on special, infrequent occasions of personal significance such as marriage, illness,
    bereavement, birth, adoption, or termination of the supervisory relationship are allowed, but birthdays are not listed
    as such occasions. General exceptions permit occasional gifts of items valued at $10 or less, or food and refreshments
    shared in the office.
  question: What should the employee do about giving the $25 bottle of wine to the supervisor for the birthday?
  options:
    O1:
      do: The employee may give the $25 bottle of wine to the supervisor.
      move: act
      irreversible: true
    O2:
      do: The employee may not give the $25 bottle of wine to the supervisor.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is an economist at the Consumer Financial Protection Bureau.
  - id: F2
    kind: situation
    status: confirmed
    fact: The supervisor is the employee's official superior.
  - id: F3
    kind: authority
    status: confirmed
    fact: §2635.304(b) permits gifts on special, infrequent occasions of personal significance such as marriage, illness,
      bereavement, birth, adoption, or termination of the supervisory relationship.
  - id: F4
    kind: authority
    status: confirmed
    fact: A 50th birthday is not considered an infrequently occurring occasion under the regulation.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee intends to give a bottle of wine costing $25 to the supervisor for the birthday.
  - id: F6
    kind: authority
    status: confirmed
    fact: General exceptions allow occasional gifts of items with an aggregate market value of $10 or less, and food or refreshments
      shared in the office; the proposed $25 wine exceeds this limit and is not food or shared refreshments.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: §2635.304(b) permits gifts only on special, infrequent occasions of personal significance such as marriage, illness,
      bereavement, birth, adoption, or termination of the supervisory relationship; a 50th birthday is not listed and therefore
      is not an allowed occasion.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The general‑exception rule in §2635.304(a)(1) limits occasional gifts to items with an aggregate market value of
      $10 or less; the proposed wine costs $25, exceeding that threshold.
  - id: C3
    facts:
    - F4
    equity: norm_reciprocity
    favors:
    - O2
    weight: strong
    why: Example 4 to paragraph (b) explicitly states that a birthday is not an infrequently occurring occasion, so a $25
      bottle of wine may not be given.
  reasoning:
    read: The economist wants to give a $25 bottle of wine for the supervisor’s 50th birthday. The regulation distinguishes
      between occasional gifts (≤$10) and gifts for special, infrequent personal occasions; birthdays are not among the listed
      qualifying occasions.
    weighing: Because both the value test (C2) and the occasion test (C1, C3) fail, the source’s own examples and rule language
      make the prohibition clear. No mitigating factor is present to lower the value or reclassify the birthday as a special
      occasion.
    tradecraft: The employee should document the decision, retain the wine for personal use, and avoid offering it to the
      supervisor. If a small token (≤$10) or a shared office treat is desired, that would be permissible under the general
      exception.
    uncertainty: Minimal; the regulation’s language and examples leave little ambiguity about birthdays and the $10 ceiling.
    handoff: The employee can decide alone; no higher‑level approval is required because the rule is self‑executing.
    tempting_wrong:
      option: O1
      pull: The desire to celebrate a personal milestone and the modest social norm of giving wine.
      why_wrong: Even a well‑intentioned gift violates the explicit $10 limit and the list of permissible occasions.
    rejected:
      O1: The gift exceeds the $10 occasional‑gift ceiling and the birthday does not qualify as a special, infrequent personal
        occasion under §2635.304(b).
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The gift’s aggregate market value is $10 or less.
      then: O1
      why: §2635.304(a)(1) allows occasional gifts of items valued at $10 or less.
    - id: flip2
      if: The occasion is one of the listed special, infrequent personal events (e.g., marriage, birth, death, retirement).
      then: O1
      why: §2635.304(b) expressly permits gifts for those occasions regardless of the $10 ceiling.
    would_not_change:
    - id: noflip1
      if: The gift is a bottle of wine for a birthday, even if the employee offers to reduce the price.
      why: Birthdays are not enumerated as qualifying occasions, and the $10 limit still applies.
    watch_for:
    - id: watch1
      what: Requests for shared refreshments in the office for the birthday celebration.
      favors:
      - O1
      why: Food and refreshments shared among several employees are permitted under the general exception.
  lesson: Gifts to an official superior must either be occasional items valued at $10 or less, or be for a special, infrequent
    personal occasion expressly listed in the regulation; birthdays do not meet the latter test.
  limits: This rule does not apply to collective contributions for office refreshments, voluntary contributions under paragraph
    (c), or gifts that are part of a recognized special occasion such as a wedding or retirement.
  library:
    domain: federal employee gifts and ethics
    family: OGE-2635-304
    source: https://www.ecfr.gov/api/versioner/v1/full/2026-10-01/title-5.xml?part=2635&subpart=C
