case:
  id: DR-OGE-2635-304-addfact2@v1
  title: CFPB Economist Gift for Supervisor's 50th Birthday [addfact]
  status: needs_review
  setting: Consumer Financial Protection Bureau, contemporary
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An economist employed by the Consumer Financial Protection Bureau plans to give the employee's direct supervisor—a
    formal superior—a bottle of wine priced at $25 in celebration of the supervisor's upcoming 50th birthday. The agency's
    ethics rules, codified at 5 C.F.R. §2635.304, specify that gifts are permissible on special, infrequent personal occasions
    such as marriage, serious illness, bereavement, birth, adoption, or the termination of a supervisory relationship, but
    a 50th birthday does not meet that definition. General exceptions allow occasional gifts valued at $10 or less, or food
    and refreshments shared in the office; the proposed wine exceeds the $10 limit and is not food or a shared refreshment.
    Moreover, the CFPB's internal ethics handbook expressly forbids employees from gifting alcoholic beverages to anyone in
    a supervisory capacity, regardless of occasion.
  question: Should the employee proceed with gifting the $25 bottle of wine for the supervisor's birthday?
  options:
    O1:
      do: Proceed with giving the $25 bottle of wine to the supervisor.
      move: act
      irreversible: true
    O2:
      do: Refrain from giving the $25 bottle of wine to the supervisor.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The staff member works as an economist for the CFPB.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee's direct supervisor holds formal authority over them.
  - id: F3
    kind: authority
    status: confirmed
    fact: Regulation §2635.304(b) allows gifts on special, infrequent personal events, including marriage, serious illness,
      bereavement, birth, adoption, or the end of a supervisory relationship.
  - id: F4
    kind: authority
    status: confirmed
    fact: A 50th-birthday celebration does not qualify as an infrequent occasion under that rule.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee plans to present the supervisor with a bottle of wine valued at $25 for the birthday.
  - id: F6
    kind: authority
    status: confirmed
    fact: General exceptions permit occasional gifts whose total market value does not exceed $10, or food and refreshments
      consumed in the office; the $25 wine surpasses this threshold and is neither food nor a shared refreshment.
  - id: F7
    kind: authority
    status: confirmed
    fact: The agency's internal ethics handbook bars employees from gifting alcoholic beverages to anyone in a supervisory
      role, irrespective of the occasion.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: §2635.304(b) limits gifts to the specific special, infrequent personal events enumerated (marriage, serious illness,
      bereavement, birth, adoption, termination of a supervisory relationship); a 50th-birthday is not among them, so the
      occasion test fails.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The general-exception clause caps occasional gifts at a combined market value of $10; the wine costs $25, exceeding
      that ceiling.
  - id: C3
    facts:
    - F4
    equity: norm_reciprocity
    favors:
    - O2
    weight: strong
    why: Regulatory example 4 clarifies that birthdays are not considered infrequent occasions, reinforcing that a $25 birthday
      gift is prohibited.
  reasoning:
    read: The economist intends to present a $25 bottle of wine for the supervisor's 50th birthday. CFPB regulations distinguish
      between occasional gifts (≤$10) and gifts for expressly listed special events; birthdays are not listed, and the handbook
      bans alcohol gifts to supervisors.
    weighing: Both the value test (C2) and the occasion test (C1, C3) fail, and the handbook rule (C4) adds a separate, unequivocal
      prohibition. No mitigating factor exists to lower the price or reclassify the birthday as a qualifying event.
    tradecraft: Document the decision, retain the wine for personal consumption, and avoid offering it to the supervisor.
      If a token of ≤$10 or a shared office treat is desired, that would satisfy the general exception.
    uncertainty: Minimal; the regulation language, the cited example, and the handbook's explicit ban leave little room for
      alternative interpretation.
    handoff: The employee can decide unilaterally; no higher-level approval is required because the rules are self-executing.
    tempting_wrong:
      option: O1
      pull: A wish to acknowledge a personal milestone and the common practice of gifting wine.
      why_wrong: The gift breaches the $10 ceiling, the birthday is not a permitted special occasion, and the handbook expressly
        forbids alcohol gifts to supervisors.
    rejected:
      O1: The wine exceeds the $10 limit, the birthday does not qualify as a special, infrequent occasion, and the internal
        handbook bars any alcoholic gift to a supervisory official.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The gift's aggregate market value is $10 or less.
      then: O1
      why: §2635.304(a)(1) permits occasional gifts of items valued at $10 or less.
    - id: flip2
      if: The occasion is one of the listed special, infrequent personal events (e.g., marriage, birth, death, retirement).
      then: O1
      why: §2635.304(b) expressly allows gifts for those occasions regardless of the $10 ceiling.
    would_not_change:
    - id: noflip1
      if: The gift is a bottle of wine for a birthday, even if the employee offers to lower the price.
      why: Birthdays are not enumerated as qualifying occasions, and the $10 limit still applies.
    watch_for:
    - id: watch1
      what: Requests to provide shared refreshments in the office for the birthday celebration.
      favors:
      - O1
      why: Food and refreshments shared among several employees are permissible under the general exception.
  lesson: Gifts to a supervisory official must either be occasional items valued at $10 or less, be for a special, infrequent
    personal occasion expressly listed in the regulation, or comply with internal handbook prohibitions; birthdays and alcoholic
    gifts to supervisors are prohibited.
  limits: The rule does not cover collective contributions for office refreshments, voluntary contributions under paragraph
    (c), or gifts that are part of a recognized special occasion such as a wedding or retirement, nor does it apply when the
    gift is non-alcoholic and valued at $10 or less.
