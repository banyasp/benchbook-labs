case:
  id: DR-OGE-2635-304-restyle1@v1
  title: CFPB Economist Gift for Supervisor's 50th Birthday [restyle]
  status: needs_review
  setting: Office of Financial Oversight, current fiscal year
  decider: the analyst
  agent: the analyst
  agent_role: decide
  situation: An economist employed by the Office of Financial Oversight learns that the analyst's manager will soon mark a
    50th birthday. The economist wishes to present the manager with a bottle of wine priced at $25. The manager is the economist's
    direct superior. The agency follows the ethics regulations at 5 C.F.R. §2635.304, which define permissible gifts. Gifts
    on special, infrequent occasions of personal significance such as marriage, illness, bereavement, birth, adoption, or
    termination of the supervisory relationship are allowed, but birthdays are not listed as such occasions. General exceptions
    permit occasional gifts of items valued at $10 or less, or food and refreshments shared in the office.
  question: Should the analyst proceed with gifting the $25 bottle of wine to the supervisor for the birthday?
  options:
    O1:
      do: Proceed with gifting the $25 bottle of wine to the supervisor.
      move: act
      irreversible: true
    O2:
      do: Refrain from gifting the $25 bottle of wine to the supervisor.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analyst works as an economist within the Office of Financial Oversight.
  - id: F2
    kind: situation
    status: confirmed
    fact: The supervisor holds direct managerial authority over the analyst.
  - id: F3
    kind: authority
    status: confirmed
    fact: Section 2635.304(b) authorizes gifts on special, infrequent personal events such as marriage, serious illness, death
      of a family member, birth, adoption, or the termination of a supervisory relationship.
  - id: F4
    kind: authority
    status: confirmed
    fact: A 50-year-old birthday does not qualify as an infrequently occurring event under the regulation.
  - id: F5
    kind: situation
    status: confirmed
    fact: The analyst plans to present a bottle of wine priced at $25 to the supervisor in celebration of the birthday.
  - id: F6
    kind: authority
    status: confirmed
    fact: The general-exception clause permits occasional gifts whose total market value does not exceed $10, or food and
      refreshments that are shared in the workplace; the proposed $25 wine exceeds the monetary ceiling and is not a shared
      consumable.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Section 2635.304(b) limits permissible gifts to those tied to special, infrequent personal events enumerated in the
      statute; because a 50th birthday is not among those events, the occasion does not satisfy the exception.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The general-exception provision in §2635.304(a)(1) caps occasional gifts at $10 in aggregate value; the intended
      wine costs $25, which breaches that cap.
  - id: C3
    facts:
    - F4
    equity: norm_reciprocity
    favors:
    - O2
    weight: strong
    why: The regulation's illustrative Example 4 to paragraph (b) explicitly states that birthdays are not considered infrequently
      occurring occasions, thereby prohibiting a $25 wine gift.
  reasoning:
    read: The analyst wishes to give a $25 bottle of wine for the supervisor's 50th birthday. The statute distinguishes between
      occasional gifts (≤$10) and gifts tied to special, infrequent personal events; birthdays are not listed among the qualifying
      events.
    weighing: Because the proposed gift fails both the monetary threshold (C2) and the qualifying-occasion test (C1, C3),
      the regulatory language and its examples clearly prohibit the transfer. No mitigating circumstance exists to lower the
      price or recharacterize the birthday as a special event.
    tradecraft: The analyst should record the decision, retain the wine for personal consumption, and avoid offering it to
      the supervisor. If a token of $10 or less, or a shared office treat, is desired, that would fall within the general
      exception.
    uncertainty: Low; the statute's wording and illustrative examples leave little room for alternative interpretation regarding
      birthdays and the $10 limit.
    handoff: The analyst may make the determination independently; no supervisory sign-off is required because the rule is
      self-executing.
    tempting_wrong:
      option: O1
      pull: The wish to acknowledge a personal milestone and the commonplace practice of gifting wine.
      why_wrong: Even a well-meaning offering breaches the $10 ceiling and the list of permissible occasions.
    rejected:
      O1: The gift surpasses the $10 occasional-gift limit and the birthday does not meet the special-occasion criteria of
        §2635.304(b).
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The wine's total market value is $10 or less.
      then: O1
      why: Section 2635.304(a)(1) authorizes occasional gifts whose aggregate value does not exceed $10.
    - id: flip2
      if: The occasion falls within one of the enumerated special, infrequent personal events (e.g., marriage, birth, death,
        retirement).
      then: O1
      why: Section 2635.304(b) expressly permits gifts for those events irrespective of the $10 ceiling.
    would_not_change:
    - id: noflip1
      if: The gift is a bottle of wine intended for a birthday, even if the price is reduced.
      why: Birthdays are not listed as qualifying events, and the $10 ceiling still applies.
    watch_for:
    - id: watch1
      what: Requests to provide shared food or drinks in the office for the birthday celebration.
      favors:
      - O1
      why: Food and refreshments that are consumed jointly by several employees are allowed under the general exception.
  lesson: Gifts to an official superior must either be occasional items valued at $10 or less, or be for a special, infrequent
    personal occasion expressly listed in the regulation; birthdays do not meet the latter test.
  limits: This rule does not apply to collective contributions for office refreshments, voluntary contributions under paragraph
    (c), or gifts that are part of a recognized special occasion such as a wedding or retirement.
