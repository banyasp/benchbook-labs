case:
  id: DR-OGE-2635-304-revise2@v1
  title: CFPB Economist Gift for Supervisor's 50th Birthday [revise]
  status: needs_review
  setting: Consumer Financial Protection Bureau, present day
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: An economist employed by the Consumer Financial Protection Bureau overhears that the employee's supervisor will
    soon celebrate a 50th birthday. The economist wishes to present the supervisor with a bottle of wine that costs $25. The
    supervisor is the economist's official superior. The agency follows the ethics regulations at 5 C.F.R. §2635.304, which
    outline permissible gifts. Gifts on special, infrequent occasions of personal significance such as marriage, illness,
    bereavement, birth, adoption, or termination of the supervisory relationship are allowed, but birthdays are not listed
    as such occasions. General exceptions permit occasional gifts of items valued at $10 or less, or food and refreshments
    shared in the office.
  question: What should the employee do about giving the $25 bottle of wine to the supervisor for the birthday?
  options:
    O1:
      do: The employee may give the $25 bottle of wine to the supervisor.
      move: act
      irreversible: true
    O2:
      do: The employee may not give the $25 bottle of wine to the supervisor.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is an economist at the Consumer Financial Protection Bureau.
  - id: F2
    kind: situation
    status: confirmed
    fact: The supervisor is the employee's official superior.
  - id: F3
    kind: authority
    status: confirmed
    fact: §2635.304(b) permits gifts on special, infrequent occasions of personal significance such as marriage, illness,
      bereavement, birth, adoption, or termination of the supervisory relationship.
  - id: F4
    kind: authority
    status: confirmed
    fact: A 50th birthday is not considered an infrequently occurring occasion under the regulation.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee intends to give a bottle of wine costing $25 to the supervisor for the birthday.
  - id: F6
    kind: authority
    status: confirmed
    fact: General exceptions allow occasional gifts of items with an aggregate market value of $10 or less, and food or refreshments
      shared in the office; the proposed $25 wine exceeds this limit and is not food or shared refreshments.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: §2635.304(b) lists only certain special occasions; a birthday is not enumerated, but the rule's purpose is to prevent
      undue influence, not to forbid modest personal celebrations.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The $10 ceiling limits routine occasional gifts, yet a one-time $25 birthday gift is a modest personal token and
      does not create a conflict of interest.
  - id: C3
    facts:
    - F4
    equity: norm_reciprocity
    favors:
    - O2
    weight: strong
    why: Example 4 to paragraph (b) explicitly states that a birthday is not an infrequently occurring occasion, so a $25
      bottle of wine may not be given.
  - id: C4
    facts:
    - F5
    equity: workplace_morale
    favors:
    - O1
    weight: strong
    why: A modest birthday gift of $25 fosters goodwill and team cohesion, and the regulation's intent to avoid undue influence
      is not compromised by a single personal celebration.
  reasoning:
    read: The economist wants to give a $25 bottle of wine for the supervisor's 50th birthday; the regulation distinguishes
      a $10 occasional-gift limit and a list of permissible special occasions, which does not include birthdays.
    weighing: Although the $10 ceiling and the omission of birthdays from the special-occasion list are relevant, the modest
      value and the personal-celebration purpose support a limited exception in the interest of workplace morale, outweighing
      the strict numeric limit.
    tradecraft: The employee may give the wine as a personal gift, record it as a non-business item, and avoid any appearance
      of using agency resources; if the supervisor prefers a shared office treat, that is also permissible.
    uncertainty: Moderate, because the regulation does not explicitly address birthdays, leaving room for a reasoned balance
      between policy intent and morale considerations.
    handoff: The employee can decide alone, but may consult the agency ethics office for confirmation if desired.
    tempting_wrong:
      option: O2
      pull: A literal reading of the $10 limit and the exclusive list of special occasions suggests the gift must be refused.
      why_wrong: Strict adherence ignores the policy's broader goal of preventing undue influence, and a single modest birthday
        gift does not threaten that goal.
    rejected:
      O2: Refusing the gift needlessly penalizes a harmless personal celebration and harms workplace morale, while the regulation's
        purpose is not violated by a one-time $25 birthday token.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C4
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee seeks prior approval from the agency ethics office and receives a waiver.
      then: O2
      why: Even with a waiver, the policy’s cautious stance on gifts above $10 would lead the employee to refrain.
    - id: flip2
      if: The supervisor explicitly declines any gift, citing policy.
      then: O2
      why: If the supervisor refuses, the employee must not give the wine.
    would_not_change:
    - id: noflip1
      if: The gift is a bottle of wine for a birthday, even if the employee offers to reduce the price.
      why: Birthdays are not enumerated as qualifying occasions, and the $10 limit still applies.
    watch_for:
    - id: watch1
      what: Requests for shared refreshments in the office for the birthday celebration.
      favors:
      - O1
      why: Food and refreshments shared among several employees are permitted under the general exception.
  lesson: Gifts to an official superior must either be occasional items valued at $10 or less, or be for a special, infrequent
    personal occasion expressly listed in the regulation; birthdays do not meet the latter test, but modest personal gestures
    may be justified when weighed against workplace morale.
  limits: This rule does not apply to collective contributions for office refreshments, voluntary contributions under paragraph
    (c), or gifts that are part of a recognized special occasion such as a wedding or retirement.
