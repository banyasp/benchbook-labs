case:
  id: DR-OGE-2635-304-2@v1
  title: Collection for Gift on Swearing‑In or Promotion
  status: draft
  setting: Federal agency office, present, under 5 CFR 2635.304 regulations
  decider: Agency Ethics Official
  agent: Ethics Assistant
  agent_role: advise
  situation: Subordinates in a federal agency wish to raise a collection to purchase a gift for their official superior who
    is being sworn in to a higher‑grade position. The occasion is a promotion within the supervisory chain, not a termination
    of the subordinate‑superior relationship. The regulation 5 CFR 2635.304(c) permits voluntary contributions for gifts on
    special, infrequent occasions or for shared refreshments. Example 3 to paragraph (c) states that collections for a gift
    on a swearing‑in or promotion are not allowed because those events are not personal‑significance occasions. The same example
    allows a collection for refreshments to be shared by the office on such occasions. The subordinates seek guidance on whether
    they may collect for the gift.
  question: What should the Ethics Assistant advise the subordinates to do regarding collecting contributions for a gift to
    their superior on the swearing‑in or promotion occasion?
  options:
    O1:
      do: The Ethics Assistant advises that subordinates may collect contributions for a gift to the superior on the swearing‑in
        or promotion occasion.
      move: act
      irreversible: false
    O2:
      do: The Ethics Assistant advises that subordinates should seek clarification from the Agency Ethics Official before
        deciding on any collection.
      move: ask
      irreversible: false
    O3:
      do: The Ethics Assistant advises that subordinates may not collect contributions for a gift to the superior on the swearing‑in
        or promotion occasion.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: 5 CFR 2635.304(c) allows voluntary contributions of nominal amounts for gifts on special, infrequent occasions or
      for food and refreshments to be shared in the office.
  - id: F2
    kind: situation
    status: confirmed
    fact: Example 3 to paragraph (c) states that subordinates may not take up a collection for a gift to an official superior
      on the occasion of the superior's swearing in or promotion.
  - id: F3
    kind: situation
    status: confirmed
    fact: The same example permits subordinates to collect contributions for refreshments to be consumed by everyone in the
      immediate office to mark the swearing‑in or promotion occasion.
  - id: F4
    kind: situation
    status: confirmed
    fact: A swearing‑in or promotion does not terminate the subordinate‑official superior relationship.
  - id: F5
    kind: situation
    status: confirmed
    fact: A swearing‑in or promotion is not an event of personal significance as defined in paragraph (b).
  - id: F6
    kind: authority
    status: confirmed
    fact: Under 5 CFR 2635.304, collections for gifts are prohibited on occasions that are not special, infrequent personal‑significance
      events or termination events.
  - id: F7
    kind: authority
    status: assessed
    fact: The Agency Ethics Official has delegated authority to the Ethics Assistant to interpret and advise on gift‑collection
      rules.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Example 3 to §2635.304(c) explicitly states that subordinates may not take up a collection for a gift on the occasion
      of a superior’s swearing‑in or promotion, and the regulation bars such collections when the occasion is not a special,
      infrequent personal‑significance event.
  - id: C2
    facts:
    - F5
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: A swearing‑in or promotion does not terminate the subordinate‑superior relationship and is not defined as an event
      of personal significance under paragraph (b); therefore it does not meet the exception criteria for gift collections.
  - id: C3
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: §2635.304(c) permits voluntary contributions only for gifts on special, infrequent occasions or for shared refreshments;
      a promotion is neither, so a collection for a gift is prohibited.
  - id: C4
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The same example allows a collection for refreshments, underscoring the regulatory distinction between gifts and
      shared food/drink; this supports the prohibition on a gift collection.
  reasoning:
    read: The subordinates want to raise money to buy a gift for their supervisor who is being sworn in to a higher‑grade
      position. The regulation treats promotions as ordinary career events, not as personal‑significance or termination occasions,
      and Example 3 to §2635.304(c) expressly bars collections for gifts on such occasions.
    weighing: Applying C1‑C3 shows that the regulation’s explicit prohibition and the definition of allowable occasions both
      point to a denial of the collection. C4 merely clarifies the permissible alternative (refreshments) and does not outweigh
      the prohibitions. The balance therefore favors O3.
    tradecraft: The Ethics Assistant should document the advice in writing, cite the specific regulation and example, and
      retain a copy in the agency’s ethics file. No collection should be initiated.
    uncertainty: Minimal; the regulatory language is clear and the example directly addresses the scenario.
    handoff: The Ethics Assistant can issue the advice directly because the Agency Ethics Official has delegated interpretive
      authority (F7). No further escalation is required.
    tempting_wrong:
      option: O1
      pull: Subordinates may feel that a modest gift is harmless and customary for a promotion.
      why_wrong: Even a modest gift violates the explicit prohibition in Example 3 to §2635.304(c); allowing it would breach
        the ethics regulations.
    rejected:
      O1: The regulation’s example expressly forbids a collection for a gift on a promotion occasion.
      O2: Deferring to the Ethics Official is unnecessary because the rule is clear and the official has already delegated
        authority to the assistant.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The occasion were a personal‑significance event such as a marriage, serious illness, or the birth of a child.
      then: O1
      why: Paragraph (b) permits collections for gifts on infrequently occurring personal‑significance occasions.
    would_not_change:
    - id: noflip1
      if: The collection is framed as a gift rather than as refreshments to be shared.
      why: The regulation distinguishes gifts from shared refreshments; a gift collection remains prohibited.
    watch_for:
    - id: watch1
      what: Attempts to label the gift as "refreshments" to bypass the prohibition.
      favors:
      - O3
      why: Even if labeled as refreshments, the intent is to give a personal gift, which the regulation does not allow.
  lesson: Under 5 CFR 2635.304(c), collections for gifts are only permissible on special, infrequent personal‑significance
    occasions or when the subordinate‑superior relationship ends; promotions do not qualify, so such collections must be prohibited.
  limits: This analysis applies solely to federal employee gift‑collection rules under 5 CFR 2635.304 and does not extend
    to non‑federal organizations, private sector gift policies, or other statutory regimes.
