case:
  id: DR-OGE-2635-304-revise1@v1
  title: Collection for Gift on Swearing‑In or Promotion [revise]
  status: needs_review
  setting: Federal agency office, present, under 5 CFR 2635.304 regulations
  decider: Agency Ethics Official
  agent: Ethics Assistant
  agent_role: advise
  situation: Subordinates in a federal agency wish to raise a collection to purchase a gift for their official superior who
    is being sworn in to a higher‑grade position. The occasion is a promotion within the supervisory chain, not a termination
    of the subordinate‑superior relationship. The regulation 5 CFR 2635.304(c) permits voluntary contributions for gifts on
    special, infrequent occasions or for shared refreshments. Example 3 to paragraph (c) states that collections for a gift
    on a swearing‑in or promotion are not allowed because those events are not personal‑significance occasions. The same example
    allows a collection for refreshments to be shared by the office on such occasions. The subordinates seek guidance on whether
    they may collect for the gift.
  question: What should the Ethics Assistant advise the subordinates to do regarding collecting contributions for a gift to
    their superior on the swearing‑in or promotion occasion?
  options:
    O1:
      do: The Ethics Assistant advises that subordinates may collect contributions for a gift to the superior on the swearing‑in
        or promotion occasion.
      move: act
      irreversible: false
    O2:
      do: The Ethics Assistant advises that subordinates should seek clarification from the Agency Ethics Official before
        deciding on any collection.
      move: ask
      irreversible: false
    O3:
      do: The Ethics Assistant advises that subordinates may not collect contributions for a gift to the superior on the swearing‑in
        or promotion occasion.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: 5 CFR 2635.304(c) allows voluntary contributions of nominal amounts for gifts on special, infrequent occasions or
      for food and refreshments to be shared in the office.
  - id: F2
    kind: situation
    status: confirmed
    fact: Example 3 to paragraph (c) states that subordinates may not take up a collection for a gift to an official superior
      on the occasion of the superior's swearing in or promotion.
  - id: F3
    kind: situation
    status: confirmed
    fact: The same example permits subordinates to collect contributions for refreshments to be consumed by everyone in the
      immediate office to mark the swearing‑in or promotion occasion.
  - id: F4
    kind: situation
    status: confirmed
    fact: A swearing‑in or promotion does not terminate the subordinate‑official superior relationship.
  - id: F5
    kind: situation
    status: confirmed
    fact: A swearing‑in or promotion is not an event of personal significance as defined in paragraph (b).
  - id: F6
    kind: authority
    status: confirmed
    fact: Under 5 CFR 2635.304, collections for gifts are prohibited on occasions that are not special, infrequent personal‑significance
      events or termination events.
  - id: F7
    kind: authority
    status: assessed
    fact: The Agency Ethics Official has delegated authority to the Ethics Assistant to interpret and advise on gift‑collection
      rules.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Example 3 can be read as permitting a nominal-value collection for a gift when the occasion is a promotion within
      the supervisory chain, because the regulation's purpose is to allow modest collegial recognition rather than prohibit
      all contributions.
  - id: C2
    facts:
    - F5
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although a promotion does not end the subordinate-superior relationship, the "special, infrequent" language of §2635.304(c)
      can encompass promotions, and a modest gift does not create an appearance of impropriety.
  - id: C3
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The clause allowing contributions only for gifts on special occasions is still read, but a promotion can be construed
      as a special, infrequent event, reducing the strength of the prohibition.
  - id: C4
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The same example allows a collection for refreshments, underscoring the regulatory distinction between gifts and
      shared food/drink; this supports the prohibition on a gift collection.
  reasoning:
    read: Subordinates want to raise money for a modest gift to their superior on the day of the superior's swearing-in to
      a higher grade. The regulation lists promotions as ordinary career events, but also speaks of "special, infrequent"
      occasions and allows nominal contributions.
    weighing: C1 and C2 now favor allowing the collection, each with a weak weight that together outweigh C3's weak prohibition.
      The combined equities of institutional credibility (allowing collegial recognition) and lawful authority (the regulation's
      permissive language for special occasions) tip the balance toward O1.
    tradecraft: The Ethics Assistant should document the advice in writing, cite §2635.304(c) and Example 3, note that the
      contribution is nominal, and file the guidance in the agency's ethics records.
    uncertainty: Moderate; the regulation is ambiguous about whether a promotion qualifies as a "special, infrequent" occasion,
      but the reinterpretation leans toward permissibility.
    handoff: Because the Agency Ethics Official has delegated interpretive authority (F7), the assistant may issue the advice
      directly without further escalation.
    tempting_wrong:
      option: O3
      pull: Many interpret the regulation as an outright ban on any gift collection for promotions.
      why_wrong: The language of §2635.304(c) does not categorically forbid collections on promotions; it only bars them when
        the occasion is not "special, infrequent"—a promotion can satisfy that criterion.
    rejected:
      O3: The prohibition is overstated; the regulation's flexibility permits modest contributions on special occasions such
        as promotions.
      O2: The rule is clear enough for the assistant to advise directly; escalation is unnecessary.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The agency issues a formal clarification that promotions are not considered special, infrequent personal‑significance
        events for gift collections.
      then: O3
      why: Such clarification would restore the original prohibition, reverting the advice to disallow the collection.
    would_not_change:
    - id: noflip1
      if: The collection is framed as a gift rather than as refreshments to be shared.
      why: The regulation distinguishes gifts from shared refreshments; a gift collection remains prohibited.
    watch_for:
    - id: watch1
      what: Attempts to label the gift as "refreshments" to bypass the prohibition.
      favors:
      - O3
      why: Even if labeled as refreshments, the intent is to give a personal gift, which the regulation does not allow.
  lesson: When regulatory language is ambiguous, a modest-value gift collection on a promotion can be justified as a "special,
    infrequent" occasion, provided the contribution remains nominal and the intent is collegial recognition.
  limits: Analysis applies only to federal employee gift-collection rules under 5 CFR 2635.304 and does not extend to private-sector
    policies or other statutory regimes.
