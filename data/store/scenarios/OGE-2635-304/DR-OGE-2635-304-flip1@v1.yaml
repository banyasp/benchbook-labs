case:
  id: DR-OGE-2635-304-flip1@v1
  title: Collection for Gift on Swearing‑In or Promotion [flip]
  status: needs_review
  setting: Regional federal office, current year, governed by 5 CFR 2635.304(c).
  decider: Agency Ethics Officer
  agent: Ethics Advisory System
  agent_role: advise
  situation: A team of staff members wants to pool money to purchase a token of appreciation for their manager, who is about
    to be sworn into a higher-grade role. The event is a promotion within the same supervisory chain, not a termination of
    the reporting relationship. Section 2635.304(c) allows voluntary, modest contributions for gifts on special, infrequent
    occasions of personal significance, and Example 3 to that paragraph now interprets a swearing-in or promotion as such
    an occasion. The staff request guidance on whether a collection for the gift is permissible.
  question: What should the Ethics Advisory System tell the staff about gathering contributions for a gift to their manager
    on the swearing-in or promotion occasion?
  options:
    O1:
      do: The Ethics Advisory System advises that staff may collect contributions for a gift to the manager on the swearing-in
        or promotion occasion.
      move: act
      irreversible: false
    O2:
      do: The Ethics Advisory System advises that staff should first obtain clarification from the Agency Ethics Officer before
        proceeding with any collection.
      move: ask
      irreversible: false
    O3:
      do: The Ethics Advisory System advises that staff may not collect contributions for a gift to the manager on the swearing-in
        or promotion occasion.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Section 2635.304(c) permits voluntary, nominal contributions for gifts on special, infrequent occasions or for food
      and drinks shared in the workplace.
  - id: F2
    kind: situation
    status: confirmed
    fact: Example 3 to paragraph (c) states that subordinates may take up a collection for a gift to an official superior
      on the occasion of the superior's swearing‑in or promotion because it qualifies as a personal‑significance event.
  - id: F3
    kind: situation
    status: confirmed
    fact: The same example allows staff to collect contributions for refreshments to be shared by everyone in the immediate
      office to mark the swearing-in or promotion occasion.
  - id: F4
    kind: situation
    status: confirmed
    fact: A swearing-in or promotion does not end the subordinate-supervisor relationship.
  - id: F5
    kind: situation
    status: confirmed
    fact: A swearing‑in or promotion is an event of personal significance, comparable to a marriage, serious illness, or the
      birth of a child, as defined in paragraph (b).
  - id: F6
    kind: authority
    status: confirmed
    fact: Under 5 CFR 2635.304, collections for gifts are prohibited on occasions that are not special, infrequent personal-significance
      events or termination events.
  - id: F7
    kind: authority
    status: assessed
    fact: The Agency Ethics Officer has delegated authority to the Ethics Advisory System to interpret and advise on gift-collection
      rules.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Example 3 now expressly permits a collection for a gift on a swearing-in or promotion because the occasion meets
      the personal-significance criterion, satisfying the regulation's allowance for such events.
  - id: C2
    facts:
    - F5
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The promotion is classified as a personal-significance event and does not terminate the reporting relationship, thereby
      fitting the exception that allows gift collections.
  - id: C3
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Section 2635.304(c) authorizes voluntary contributions for gifts on special, infrequent personal-significance occasions;
      the promotion now qualifies as such an occasion.
  - id: C4
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The example also confirms that contributions for shared refreshments are permissible, but this does not limit the
      newly allowed gift collection.
  reasoning:
    read: Staff members seek to fund a modest token for their manager's swearing-in. The updated regulatory guidance now treats
      that ceremony as a personal-significance occasion, which the regulation expressly permits for gift collections.
    weighing: C1-C3 each point to the allowance for a gift collection because the occasion meets the personal-significance
      test and the rule's language authorizes such contributions. C4 merely notes the separate allowance for refreshments
      and does not outweigh the permissive findings. Consequently, the balance supports O1.
    tradecraft: The Ethics Advisory System should issue a written advisory citing §2635.304(c) and Example 3, confirming that
      the collection complies with the rule, and retain the advice in the agency's ethics records.
    uncertainty: Low; the regulatory language and the updated example provide clear guidance.
    handoff: The advisory can be delivered directly because the Agency Ethics Officer has delegated interpretive authority
      (F7). No further referral is needed.
    tempting_wrong:
      option: O3
      pull: Some staff worry that allowing any gift might appear to exceed modesty standards.
      why_wrong: The regulation now expressly permits the collection for this personal-significance event, so prohibiting
        it would be contrary to the rule.
    rejected:
      O2: Clarification from the Ethics Officer is unnecessary; the rule is already clear and the delegated authority is in
        place.
      O3: The prohibition no longer applies because the occasion qualifies as personal-significance under the updated example.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The occasion is a routine promotion that lacks personal-significance characteristics.
      then: O3
      why: Paragraph (b) does not treat ordinary promotions as qualifying personal-significance events, so collections for
        gifts would be prohibited.
    would_not_change:
    - id: noflip1
      if: The collection is presented as a gift rather than as refreshments to be shared.
      why: The regulation distinguishes gifts from shared refreshments; a gift collection remains prohibited when the occasion
        does not meet the personal-significance test.
    watch_for:
    - id: watch1
      what: Attempts to label the gift as "refreshments" to sidestep the prohibition.
      favors:
      - O3
      why: Even if labeled as refreshments, the intended purpose is a personal gift, which the rule does not allow unless
        the occasion qualifies.
  lesson: When 5 CFR 2635.304(c) and its examples classify an event as personal-significance—such as a swearing-in or promotion—voluntary
    contributions for a gift are permissible, provided the collection remains modest and the relationship remains unchanged.
  limits: This guidance applies only to federal employee gift-collection rules under 5 CFR 2635.304. It does not cover private-sector
    policies, non-federal entities, or other statutory frameworks.
