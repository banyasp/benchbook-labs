case:
  id: DR-OGE-2635-304-restyle2@v1
  title: Collection for Gift on Swearing‑In or Promotion [restyle]
  status: needs_review
  setting: Midwest Regional Office of the Department of Transportation, present calendar year, operating under 5 CFR 2635.304
  decider: Chief Ethics Counsel
  agent: Ethics Analyst
  agent_role: advise
  situation: Several employees in a federal division are considering raising money to buy a modest token for their supervisor,
    who is slated to take an oath for a higher-grade position. The event is a promotion within the same supervisory chain,
    not a termination of the reporting relationship. Section 2635.304(c) of Title 5 permits small voluntary donations for
    gifts on special, rare occasions or for communal food and drink. Example 3 to that subsection clarifies that collections
    for a gift on an inauguration or advancement are prohibited because those events lack personal-significance status, although
    a collection for shared refreshments is allowed. The employees request guidance on whether a gift collection is permissible.
  question: How should the Ethics Analyst advise the employees about whether they may collect funds for a present to their
    supervisor in connection with the oath-taking or promotion event?
  options:
    O1:
      do: The Ethics Analyst tells the employees they may go ahead with a fundraiser for a gift to the supervisor at the oath-taking
        or promotion event.
      move: act
      irreversible: false
    O2:
      do: The Ethics Analyst recommends that the employees seek further clarification from the Chief Ethics Counsel prior
        to making any decision about a collection.
      move: ask
      irreversible: false
    O3:
      do: The Ethics Analyst informs the employees that they are prohibited from gathering contributions for a gift to the
        supervisor in connection with the oath-taking or promotion.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Section 2635.304(c) of Title 5 of the Code of Federal Regulations allows staff to make small voluntary donations
      toward gifts when the occasion is both special and rare, or alternatively for communal food and drink.
  - id: F2
    kind: situation
    status: confirmed
    fact: Example 3 to paragraph (c) states that employees may not organize a collection for a gift to a higher-ranking official
      on the occasion of the official's swearing-in or promotion.
  - id: F3
    kind: situation
    status: confirmed
    fact: Example 3 also permits employees to collect contributions for refreshments that will be shared by all members of
      the immediate work unit to commemorate the swearing-in or promotion.
  - id: F4
    kind: situation
    status: confirmed
    fact: An inauguration or advancement does not end the reporting relationship between employees and their supervisor.
  - id: F5
    kind: situation
    status: confirmed
    fact: Such ceremonies are not classified as personal-significance events under the definition in subsection (b).
  - id: F6
    kind: authority
    status: confirmed
    fact: According to 5 CFR 2635.304, fundraising for gifts is barred when the occasion fails to qualify as a special, rare
      personal-significance event or as a termination of the working relationship.
  - id: F7
    kind: authority
    status: assessed
    fact: The Chief Ethics Counsel has granted the Ethics Analyst delegated authority to interpret and provide guidance on
      the gift-collection provisions.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Example 3 to §2635.304(c) expressly prohibits staff from taking up a collection for a gift on a superior's inauguration
      or promotion, and the regulation bars such collections when the occasion lacks the special, infrequent personal-significance
      character.
  - id: C2
    facts:
    - F5
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Because an inauguration or advancement does not end the staff-supervisor relationship and is not classified as a
      personal-significance event under paragraph (b), it fails to meet the exception criteria for permissible gift collections.
  - id: C3
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: §2635.304(c) limits voluntary contributions to gifts on special, infrequent occasions or to shared refreshments;
      a promotion does not satisfy either condition, making a gift collection impermissible.
  - id: C4
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The same illustration authorizes a collection for refreshments, highlighting the regulatory distinction between gifts
      and shared food/drink, and thereby reinforcing the prohibition on a gift collection.
  reasoning:
    read: The employees intend to raise funds for a modest token for their supervisor who is being sworn into a higher-grade
      role. The regulation treats promotions as routine career milestones, not as personal-significance or termination events,
      and Example 3 to §2635.304(c) explicitly bars collections for gifts on such occasions.
    weighing: Applying C1-C3 demonstrates that the regulation's explicit prohibition and the definition of allowable occasions
      both converge on a denial of the collection. C4 merely clarifies the permissible alternative (refreshments) and does
      not outweigh the prohibitions. Consequently, the balance supports O3.
    tradecraft: The Ethics Analyst should issue the advice in a written memorandum, cite the specific regulation and illustration,
      and file a copy in the agency's ethics record. No collection should be initiated.
    uncertainty: Minimal; the regulatory language is unambiguous and the illustration directly addresses the scenario.
    handoff: The Ethics Analyst may deliver the advice directly because the Chief Ethics Counsel has delegated interpretive
      authority (F7). No further escalation is required.
    tempting_wrong:
      option: O1
      pull: Employees may feel that a modest token is a harmless tradition for a promotion.
      why_wrong: Even a modest token contravenes the explicit prohibition in Example 3 to §2635.304(c); permitting it would
        breach the ethics regulations.
    rejected:
      O1: The regulation's illustration expressly forbids a collection for a gift on a promotion occasion.
      O2: Seeking additional clarification is unnecessary because the rule is clear and the official has already delegated
        authority to the analyst.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The occasion were a personal-significance event such as a marriage, serious illness, or the birth of a child.
      then: O1
      why: Paragraph (b) permits collections for gifts on infrequently occurring personal-significance occasions.
    would_not_change:
    - id: noflip1
      if: The collection is framed as a gift rather than as refreshments.
      why: The regulation distinguishes gifts from shared refreshments; a gift collection remains prohibited.
    watch_for:
    - id: watch1
      what: Attempts to label the gift as "refreshments" to circumvent the prohibition.
      favors:
      - O3
      why: Even if labeled as refreshments, the underlying intent is to provide a personal gift, which the regulation does
        not allow.
  lesson: Under 5 CFR 2635.304(c), collections for gifts are permissible only on special, infrequent personal-significance
    occasions or when the staff-supervisor relationship ends; promotions do not meet these criteria, so such collections must
    be barred.
  limits: This analysis is confined to federal employee gift-collection rules under 5 CFR 2635.304 and does not extend to
    private-sector policies, non-federal entities, or other statutory frameworks.
