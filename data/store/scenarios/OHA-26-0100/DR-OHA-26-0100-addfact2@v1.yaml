case:
  id: DR-OHA-26-0100-addfact2@v1
  title: Resolution of Guideline J Security Concern [addfact]
  status: needs_review
  setting: Department of Energy, Office of Hearings and Appeals – 16 September 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Administrative Law Judge must decide whether the Individual has satisfactorily addressed the security concerns
    identified under Guideline J, which pertains to criminal conduct. The record shows that the Individual was arrested for
    aggravated battery on 8 September 2025 and for driving while intoxicated on 4 January 2026. She entered a no-contest plea
    to the battery charge, satisfied fines and community-service requirements, and completed probation on 29 May 2026. For
    the DWI, she accepted a plea, was placed on supervised probation, installed an ignition-interlock device, and fulfilled
    the mandated classes and community service. She has repeatedly attended alcohol-education programs, has been a regular
    participant in SMART Recovery meetings since January 2026, and submitted seven consecutive negative PEth test results
    from February through August 2026. A DOE psychologist has diagnosed her with an unspecified alcohol-related disorder,
    noting ongoing progress and recommending continued treatment and abstinence. An independent security-risk assessment performed
    by an external contractor in September 2026 found no indication that she is vulnerable to coercion, exploitation, or foreign
    influence. The Local Security Office has flagged the arrests as a Guideline J concern. The Judge's authority to grant
    or deny restoration of access authorization derives from DOE Part 710 regulations.
  question: How should the Administrative Law Judge resolve the Individual's Guideline J security concern?
  options:
    O1:
      do: The Judge denies the request to restore the Individual's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Judge postpones the decision pending additional evidence of sustained sobriety.
      move: hold
      irreversible: false
    O3:
      do: The Judge restores the Individual's access authorization immediately at this time.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual faced an arrest for aggravated battery on 8 September 2025.
  - id: F2
    kind: situation
    status: confirmed
    fact: An arrest for driving while intoxicated was recorded against the Individual on 4 January 2026.
  - id: F3
    kind: situation
    status: confirmed
    fact: She pleaded no contest to the aggravated battery charge, satisfied the imposed fines and community-service requirements,
      and concluded her probationary period on 29 May 2026.
  - id: F4
    kind: situation
    status: confirmed
    fact: Regarding the DWI, she accepted a plea, entered supervised probation, fitted an ignition-interlock system to her
      vehicle, and fulfilled the mandated educational classes and community-service duties.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A September 2026 security-risk assessment performed by an outside contractor concluded that there is no indication
      the Individual is vulnerable to coercion, exploitation, or foreign influence.
  - id: F6
    kind: situation
    status: confirmed
    fact: She has finished alcohol-education coursework, consistently participated in SMART Recovery meetings beginning January
      2026, and submitted seven back-to-back negative PEth test results covering February through August 2026.
  - id: F7
    kind: situation
    status: confirmed
    fact: A DOE psychologist identified the Individual as having an unspecified alcohol-related disorder, advising ongoing
      treatment and sustained abstinence.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Local Security Office flagged a Guideline J security concern stemming from the Individual's arrests.
  - id: F9
    kind: authority
    status: confirmed
    fact: Under DOE Part 710 regulations, the Administrative Law Judge holds the authority to determine restoration of the
      Individual's access authorization.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Full compliance with court-mandated sanctions for both the battery and the DWI—including payment of fines, completion
      of community service, probation termination, ignition-interlock installation, and required educational classes—satisfies
      mitigating factor (d) of successful rehabilitation under Guideline J.
  - id: C2
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: Seven consecutive negative PEth test results together with eight months of regular SMART Recovery attendance demonstrate
      a sustained pattern of abstinence, fulfilling mitigating condition (b) that the behavior is unlikely to recur.
  - id: C3
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The DOE psychologist concluded that the Individual no longer meets criteria for an alcohol-related disorder and offered
      a very favorable prognosis, indicating that the underlying condition has been effectively treated.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The Local Security Office correctly flagged a Guideline J concern based on the arrests, but the Adjudicative Guidelines
      allow mitigation when clear rehabilitation is documented; therefore the flag alone carries only weak weight.
  reasoning:
    read: The Local Security Office raised a Guideline J issue because of the Individual's aggravated-battery and DWI arrests.
      The Judge must weigh the derogatory information against the mitigating evidence of rehabilitation and low security risk.
    weighing: Applying the Adjudicative Guidelines, the Judge finds that (a) the Individual fully satisfied all legal penalties
      (C1), (b) she has maintained a prolonged period of sobriety and treatment engagement (C2), (c) a qualified psychologist
      determined the alcohol-related disorder is resolved (C3), and (d) an independent security-risk assessment identified
      no susceptibility to coercion or foreign influence (C5). These factors collectively satisfy mitigating factor (d) and
      outweigh the weak concern reflected in the LSO's flag (C4), allowing restoration of access.
    tradecraft: The decision is documented in a written Administrative Judge Decision, citing the relevant exhibits (probation
      records, PEth reports, SMART Recovery logs, psychologist report, and the external risk-assessment) and entered into
      the DOE personnel security system.
    uncertainty: Future conduct remains the primary uncertainty; a relapse or new arrest would revive the Guideline J concern,
      but the current record shows no such risk.
    handoff: The Administrative Law Judge acts alone under 10 C.F.R. § 710.7(a); no further agency review is required unless
      an appeal is filed.
    tempting_wrong:
      option: O1
      pull: The gravity of an aggravated-battery charge and the default presumption against granting clearances may make denial
        seem prudent.
      why_wrong: Denial would disregard the comprehensive rehabilitation record and the external assessment, contrary to the
        mitigation provisions of Guideline J.
    rejected:
      O1: Denial overlooks the full compliance, sustained abstinence, and low security-risk findings that the Guidelines require
        for mitigation.
      O2: Postponing adds no value because the record already meets all mitigating criteria; further delay would unnecessarily
        extend the Individual's loss of access.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to relapse and produce a positive PEth test or incur a new criminal offense.
      then: O1
      why: A new violation would negate mitigating factor (d) of successful rehabilitation and reactivate the Guideline J
        concern, leading to denial (O1).
    would_not_change:
    - id: noflip1
      if: The Individual has not yet completed the full term of her DWI probation.
      why: The Judge has determined that, despite the probation not being fully served, the actions to date are sufficient
        to resolve the Guideline J issue.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or arrest.
      favors:
      - O1
      why: Such evidence would indicate a recurrence of the behavior that originally raised the Guideline J concern.
  lesson: When an individual demonstrates complete compliance with legal sanctions, sustained abstinence, professional confirmation
    of recovery, and an independent assessment showing no security vulnerability, Guideline J concerns can be mitigated, permitting
    immediate restoration of access authorization.
  limits: This analysis applies only where the record provides clear, documented evidence of rehabilitation and no new derogatory
    conduct. It does not extend to cases lacking objective proof of abstinence or where the individual reoffends.
