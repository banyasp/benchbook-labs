case:
  id: DR-OHA-26-0100-2-ro2@v1
  title: Resolution of Guideline J Security Concern
  status: draft
  setting: U.S. Department of Energy Office of Hearings and Appeals, September 16, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, was arrested for Aggravated Battery in September 2025 and for Driving
    While Intoxicated in January 2026. The Local Security Office raised a security concern under Guideline J, citing these
    criminal incidents. The Individual pled no contest to the battery charge, completed all court‑ordered fines, community
    service, and was released from probation in May 2026. She also complied with DWI probation requirements, completed multiple
    alcohol‑education programs, attended SMART Recovery meetings, and submitted seven consecutive negative PEth tests. The
    DOE psychologist diagnosed an alcohol‑related disorder but later testified that the Individual no longer met DSM‑5 criteria
    and has a very good prognosis.
  question: What should the Administrative Judge decide about the Individual's security concern under Guideline J?
  options:
    O1:
      do: Deny restoration of the Individual's access authorization, concluding that the Guideline J security concern remains
        unresolved.
      move: act
      irreversible: true
    O2:
      do: Restore the Individual's access authorization, concluding that the Guideline J security concern is resolved.
      move: act
      irreversible: true
    O3:
      do: Hold the decision and request additional evidence or a follow‑up evaluation before ruling on the Guideline J concern.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with Aggravated Battery on September 8, 2025.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with DWI on January 4, 2026, with breath‑test results of 0.16/0.17 and a
      PEth level of 119 ng/mL.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline J based on the Individual's arrests.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual pled no contest to the Aggravated Battery charge, completed fines and 24 hours of community service,
      and was released from probation on May 29, 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual complied with DWI probation requirements, including an ignition interlock, alcohol‑education classes,
      and community service, and remains on supervised probation.
  - id: F6
    kind: capability
    status: confirmed
    fact: The Individual completed two employer‑sponsored alcohol‑education courses, attended SMART Recovery meetings regularly,
      and provided seven consecutive negative PEth tests from February to August 2026.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The DOE psychologist initially diagnosed the Individual with Unspecified Alcohol‑Related Disorder but later testified
      that she no longer met DSM‑5 criteria and has a very good prognosis.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employer’s Fitness for Duty program reported that the Individual complied with all program requirements and
      showed strong motivation to change.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual completed all court‑ordered fines, community service, and probation requirements for both arrests,
      demonstrating successful rehabilitation as required by mitigating factor (d) of Guideline J.
  - id: C2
    facts:
    - F6
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Since the arrests, there has been no further criminal conduct; seven consecutive negative PEth tests and continued
      abstinence show the behavior is unlikely to recur.
  - id: C3
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The DOE psychologist testified that the Individual no longer meets DSM‑5 criteria for an alcohol‑use disorder and
      has a very good prognosis, supporting the view that the security risk is mitigated.
  - id: C4
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline J permits mitigation when there is evidence of successful rehabilitation (mitigating factor d); the Judge
      applies this regulatory standard.
  reasoning:
    read: The LSO raised a Guideline J concern based on two criminal arrests. The Judge must decide whether the Individual’s
      post‑arrest conduct satisfies the mitigating conditions in the Adjudicative Guidelines.
    weighing: Applying the source’s own analysis, the Judge finds that the Individual has satisfied mitigating factor (d)
      – successful rehabilitation – through completed probation, community service, compliance with DWI conditions, and ongoing
      abstinence (C1, C2). The psychologist’s testimony (C3) further confirms reduced risk, and the regulatory framework (C4)
      authorizes a finding of mitigation. The balance therefore tips toward restoration.
    tradecraft: The decision is recorded in the Administrative Judge’s Decision, citing the specific exhibits and testimony,
      and the restoration order is entered into the Individual’s security file per 10 C.F.R. § 710.7(a).
    uncertainty: While the psychologist’s earlier diagnosis of UARD raised concern, the later testimony that criteria are
      no longer met reduces uncertainty; the primary remaining risk is future relapse, which is monitored through PEth testing.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.27(d); no further agency review is required
      unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: A strict‑presumption against granting clearances might tempt a denial despite the evidence of rehabilitation.
      why_wrong: The source explicitly states that the mitigating factors under Guideline J have been met, making denial contrary
        to the adjudicative guidelines.
    rejected:
      O1: The security concern is mitigated by successful rehabilitation and lack of recurrence, so denial is not supported.
      O3: The record is sufficient; additional evidence is unnecessary because the mitigating factors are already satisfied.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to have a positive PEth test or be arrested for a new alcohol‑related offense after the hearing
        date
      then: O1
      why: A new incident would defeat the mitigating factor of no recurrence and re‑introduce a security risk under Guideline
        J.
    would_not_change:
    - id: noflip1
      if: The DOE psychologist continued to diagnose an alcohol‑use disorder but affirmed the Individual no longer meets DSM‑5
        criteria
      why: The source already treated the diagnosis as mitigated by treatment progress, so the decision remains unchanged.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or criminal arrest
      favors:
      - O1
      why: Such evidence would indicate relapse and undermine the mitigation analysis.
  lesson: Under Guideline J, successful rehabilitation—completion of probation, community service, and demonstrated abstinence—satisfies
    mitigating factor (d) and permits restoration of a security clearance even after serious criminal conduct.
  limits: This reasoning applies only when the individual shows documented compliance with all court‑ordered conditions and
    no further offenses; it does not extend to cases where relapse or new criminal conduct occurs.
