case:
  id: DR-OHA-26-0100-2@v1
  title: Resolution of Guideline J Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, September 16, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Administrative Judge must determine whether the Individual has resolved the security concerns raised under
    Guideline J, which addresses criminal conduct. The Individual was arrested for Aggravated Battery in September 2025 and
    for DWI in January 2026. She pled no contest to the battery charge, completed fines, community service, and was released
    from probation in May 2026. For the DWI, she accepted a plea, was placed on supervised probation, installed an ignition
    interlock, and complied with required classes and community service. She has completed multiple alcohol‑education courses,
    attended SMART Recovery meetings since January 2026, and submitted seven consecutive negative PEth tests. The DOE psychologist
    diagnosed her with an unspecified alcohol‑related disorder but noted progress, and the Local Security Office cited the
    arrests as a Guideline J concern.
  question: What should the Administrative Judge do regarding the Individual’s Guideline J security concern?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s request to restore authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further sobriety evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested on September 8, 2025 for Aggravated Battery.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested on January 4, 2026 for Driving While Intoxicated.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual pled no contest to the Aggravated Battery charge, completed fines, community service, and was released
      from probation on May 29, 2026.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual took a plea for the DWI, was placed on supervised probation, installed an ignition interlock, and
      complied with required classes and community service.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed alcohol‑education courses, attended SMART Recovery meetings regularly since January 2026,
      and provided seven consecutive negative PEth tests from February to August 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The DOE psychologist diagnosed the Individual with Unspecified Alcohol‑Related Disorder and recommended continued
      treatment and abstinence.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline J based on the Individual’s arrests.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Administrative Judge has authority under the Department of Energy regulations at Part 710 to decide on restoration
      of access authorization.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The Individual complied fully with court‑ordered probation for both arrests, completing fines, community service,
      an ignition interlock, and required classes, satisfying mitigating factor (d) of successful rehabilitation under Guideline
      J.
  - id: C2
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: Seven consecutive negative PEth tests and eight months of regular SMART Recovery attendance demonstrate a clear,
      sustained pattern of abstinence, meeting mitigating condition (b) that the behavior is unlikely to recur.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The DOE psychologist concluded the Individual no longer meets DSM‑5 criteria for an alcohol‑use disorder and gave
      a “very good” prognosis, supporting the finding that the security concern is mitigated.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: While the LSO correctly raised a Guideline J concern based on the arrests, the Adjudicative Guidelines expressly
      allow mitigation when rehabilitation is evident, which the record shows.
  reasoning:
    read: The LSO cited the Individual’s two recent arrests as a criminal‑conduct concern under Guideline J. The judge must
      decide whether the mitigating factors in the Guidelines outweigh the derogatory information.
    weighing: Applying the Guidelines, the judge found that (a) the Individual has fully complied with all probation requirements
      (C1), (b) she has demonstrated a sustained period of sobriety and participation in treatment (C2), and (c) a qualified
      psychologist assessed no longer meeting disorder criteria (C3). These satisfy mitigating factor (d) – evidence of successful
      rehabilitation – and therefore resolve the Guideline J concern. The LSO’s initial concern is acknowledged but outweighed
      by the positive evidence.
    tradecraft: The decision is recorded in the Administrative Judge’s written Decision, citing the specific exhibits and
      transcript portions that support each mitigating factor, and the outcome is entered into the DOE personnel security
      database.
    uncertainty: The primary uncertainty is future conduct; a relapse could revive the concern. The record, however, shows
      no indication of imminent risk.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.7(a); no further agency review is required
      unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: The presumption against granting clearances and the seriousness of an aggravated‑battery arrest might suggest
        denial.
      why_wrong: Denial would ignore the clear mitigating evidence of rehabilitation and would be inconsistent with the Guidelines
        that prioritize demonstrated reformation.
    rejected:
      O1: Denial disregards the substantial compliance and rehabilitation evidence required by Guideline J mitigation.
      O2: Holding the decision pending adds no value; the record already satisfies the mitigating criteria.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to relapse and test positive for alcohol consumption or incur a new criminal offense.
      then: O1
      why: A new violation would negate the mitigating factor (d) of successful rehabilitation and re‑activate the Guideline
        J concern.
    would_not_change:
    - id: noflip1
      if: The Individual has not yet completed the full term of her DWI probation.
      why: The judge explicitly stated that, despite incomplete probation, the actions to date are sufficient to resolve the
        concern.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or arrest.
      favors:
      - O1
      why: Such evidence would indicate a recurrence of the behavior that originally raised the Guideline J concern.
  lesson: When an individual demonstrates full compliance with legal sanctions, sustained abstinence, and professional assessment
    of recovery, Guideline J security concerns can be mitigated, permitting restoration of access authorization. The adjudicative
    process balances the presumption against clearance with concrete evidence of rehabilitation.
  limits: This reasoning applies only where the record shows clear, documented rehabilitation and no new derogatory conduct.
    It does not extend to cases lacking objective evidence of abstinence or where the individual reoffends.
