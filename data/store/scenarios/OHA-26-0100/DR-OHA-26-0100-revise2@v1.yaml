case:
  id: DR-OHA-26-0100-revise2@v1
  title: Resolution of Guideline J Security Concern [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, September 16, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Administrative Judge must determine whether the Individual has resolved the security concerns raised under
    Guideline J, which addresses criminal conduct. The Individual was arrested for Aggravated Battery in September 2025 and
    for DWI in January 2026. She pled no contest to the battery charge, completed fines, community service, and was released
    from probation in May 2026. For the DWI, she accepted a plea, was placed on supervised probation, installed an ignition
    interlock, and complied with required classes and community service. She has completed multiple alcohol‑education courses,
    attended SMART Recovery meetings since January 2026, and submitted seven consecutive negative PEth tests. The DOE psychologist
    diagnosed her with an unspecified alcohol‑related disorder but noted progress, and the Local Security Office cited the
    arrests as a Guideline J concern.
  question: What should the Administrative Judge do regarding the Individual’s Guideline J security concern?
  options:
    O1:
      do: The Administrative Judge denies the Individual’s request to restore authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further sobriety evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested on September 8, 2025 for Aggravated Battery.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested on January 4, 2026 for Driving While Intoxicated.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual pled no contest to the Aggravated Battery charge, completed fines, community service, and was released
      from probation on May 29, 2026.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual took a plea for the DWI, was placed on supervised probation, installed an ignition interlock, and
      complied with required classes and community service.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual completed alcohol‑education courses, attended SMART Recovery meetings regularly since January 2026,
      and provided seven consecutive negative PEth tests from February to August 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The DOE psychologist diagnosed the Individual with Unspecified Alcohol‑Related Disorder and recommended continued
      treatment and abstinence.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline J based on the Individual’s arrests.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Administrative Judge has authority under the Department of Energy regulations at Part 710 to decide on restoration
      of access authorization.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Although the Individual complied with court-ordered probation, the seriousness of the aggravated-battery arrest and
      the associated violent conduct outweigh rehabilitation evidence, indicating the Guideline J security concern remains
      unresolved.
  - id: C2
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The seven consecutive negative PEth tests show abstinence but do not eliminate the risk of future violent or unsafe
      behavior, and the record lacks the long-term stability required for a full restoration.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The DOE psychologist concluded the Individual no longer meets DSM‑5 criteria for an alcohol‑use disorder and gave
      a “very good” prognosis, supporting the finding that the security concern is mitigated.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: While the LSO correctly raised a Guideline J concern based on the arrests, the Adjudicative Guidelines expressly
      allow mitigation when rehabilitation is evident, which the record shows.
  reasoning:
    read: The Local Security Office raised a Guideline J concern based on two recent arrests, one involving violent conduct.
      The Administrative Judge must weigh the seriousness of the criminal conduct against any evidence of rehabilitation.
    weighing: Applying the adjudicative guidelines, the Administrative Judge determines that the violent nature of the aggravated-battery
      charge (C1) and the limited duration of demonstrated sobriety (C2) together outweigh the mitigating factors. Consequently,
      the security concern is not resolved, leading to denial of restoration.
    tradecraft: The decision is documented in the Administrative Judge's written ruling, citing the arrest records, probation
      compliance documents, and PEth test results, and entered into the DOE personnel security system.
    uncertainty: Future conduct remains uncertain; while abstinence has been shown, the risk of recurrence of violent behavior
      cannot be ruled out given the nature of the prior offense.
    handoff: The Administrative Judge decides alone under 10 C.F.R. § 710.7(a); further agency review is only possible on
      appeal.
    tempting_wrong:
      option: O3
      pull: The extensive compliance with probation and documented abstinence might suggest restoration.
      why_wrong: Restoration would ignore the unresolved violent conduct concern and the limited evidentiary window of sobriety,
        contrary to the precautionary stance required by Guideline J.
    rejected:
      O2: Holding the decision pending adds no substantive benefit because the record already provides sufficient basis for
        a final denial.
      O3: Restoration would be premature given the serious nature of the aggravated-battery arrest and the still-emerging
        pattern of sobriety.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provides additional negative PEth tests extending six months beyond the current record.
      then: O3
      why: Extended evidence of sustained abstinence could tip the balance toward restoration.
    would_not_change:
    - id: noflip1
      if: The Individual has not yet completed the full term of her DWI probation.
      why: The Administrative Judge explicitly stated that, despite incomplete probation, the actions to date are sufficient
        to resolve the concern.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or arrest.
      favors:
      - O1
      why: Such evidence would indicate a recurrence of the behavior that originally raised the Guideline J concern.
  lesson: When a security concern involves violent conduct, compliance with probation and short-term abstinence may be insufficient;
    the seriousness of the offense can outweigh rehabilitation evidence, leading to denial of restoration.
  limits: This analysis applies to cases where the derogatory conduct includes violent offenses; it does not address situations
    where only non-violent conduct is present or where long-term, documented rehabilitation is established.
