case:
  id: DR-OHA-26-0100-restyle2@v1
  title: Resolution of Guideline G Alcohol-Related Security Concern [restyle]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, October 2026, administrative security clearance proceeding
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The employee, a DOE contractor, was arrested for aggravated battery in September 2025 after consuming one alcoholic
    drink and for a DWI in January 2026 after consuming three drinks, producing a BAC of 0.16-0.17. The Local Security Office
    raised concerns under Guideline G, citing the arrests and a psychologist's diagnosis of an Unspecified Alcohol-Related
    Disorder. Since the incidents, the employee has completed two alcohol-education courses, a twelve-week substance-cessation
    program, and regularly attends SMART Recovery meetings. She has produced seven consecutive negative PEth tests covering
    February through August 2026 and has complied with all probation requirements for both offenses. The hearing is now before
    the judge to decide whether these actions mitigate the Guideline G concerns.
  question: What should the Administrative Law Judge do regarding the employee's security concerns under Guideline G?
  options:
    O1:
      do: Find that Guideline G concerns remain unresolved and deny restoration of the employee's access clearance.
      move: act
      irreversible: true
    O2:
      do: Grant a provisional restoration, requiring monthly PEth tests and continued recovery program participation for six
        months.
      move: partial
      irreversible: false
    O3:
      do: Delay the decision and request additional evidence, such as further PEth results, before ruling on Guideline G.
      move: hold
      irreversible: false
    O4:
      do: Conclude that Guideline G concerns are fully mitigated and restore the employee's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee was taken into custody and charged with aggravated battery on 8 September 2025 after consuming a single
      alcoholic drink.
  - id: F2
    kind: situation
    status: confirmed
    fact: On 4 January 2026 the employee was arrested for driving while intoxicated after ingesting three drinks; breath analysis
      recorded a BAC of 0.16–0.17.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline G concerns based on the two arrests and a DOE psychologist's diagnosis
      of an Unspecified Alcohol-Related Disorder.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee completed an alcohol-education seminar on 12 February 2026 and a twelve-week substance-cessation class
      on 13 May 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: Since January 2026 the employee has been a regular participant in SMART Recovery meetings.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Seven successive PEth screenings conducted from 5 February 2026 through 6 August 2026 returned negative results,
      indicating no recent alcohol intake.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: A PEth test performed on 6 January 2026 was positive at 119 ng/mL, and the DOE psychologist subsequently diagnosed
      the employee with an Unspecified Alcohol-Related Disorder pursuant to DSM-5 criteria.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employee satisfied all probation conditions for the aggravated-battery case—including fines, community service,
      and was released from probation on 29 May 2026.
  - id: F9
    kind: situation
    status: confirmed
    fact: The employee remains in compliance with all DWI probation requirements, such as the ignition-interlock device, mandated
      classes, and random testing.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F9
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: The employee has recognized a problem with alcohol, completed two mandated educational programs, finished a twelve-week
      cessation course, and consistently attends SMART Recovery, thereby satisfying mitigating factor (b) of Guideline G.
  - id: C2
    facts:
    - F6
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Seven consecutive negative PEth results from February through August 2026 provide objective evidence of sustained
      abstinence, fulfilling the required pattern of modified consumption.
  - id: C3
    facts:
    - F4
    - F5
    - F9
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Completion of employer-sponsored treatment and ongoing counseling demonstrates satisfactory progress in an approved
      rehabilitation pathway, meeting mitigating factors (c) and (d).
  - id: C4
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The DOE psychologist, who originally issued the UARD diagnosis, later testified that the employee no longer meets
      DSM-5 criteria for any alcohol-use disorder, reinforcing that the security concern is mitigated.
  - id: C5
    facts:
    - F6
    - F9
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: More than six months have passed since the last alcohol-related incident without recurrence, supporting a presumption
      that the behavior will not reappear.
  reasoning:
    read: Guideline G addresses concerns that excessive alcohol use could impair judgment and reliability. The LSO highlighted
      two arrests and a UARD diagnosis. The judge must assess whether the employee's post-incident conduct eliminates doubts
      about trustworthiness.
    weighing: Applying the Adjudicative Guidelines, the judge finds that mitigating factor (b)—acknowledgment of the issue,
      concrete remedial steps, and a documented abstinence pattern—is satisfied (see {C1},{C2},{C3}). The psychologist's later
      opinion that no disorder remains ({C4}) and the elapsed time without further incidents ({C5}) further support a resolution.
      Accordingly, the balance favors restoration.
    tradecraft: Record that Guideline G concerns are resolved, cite the specific mitigating factors and supporting evidence,
      and update the employee's access authorization in the DOE security system.
    uncertainty: Low; the record is clear and the guidelines provide a direct mitigation pathway.
    handoff: The Administrative Law Judge decides unilaterally, as the determination rests on the record and the judge's discretionary
      authority under 10 C.F.R. § 710.7(a).
    tempting_wrong:
      option: O1
      pull: The earlier arrests and the psychologist's initial diagnosis could be interpreted as indicating ongoing risk.
      why_wrong: Disregarding the documented rehabilitation, negative biomarker data, and the expert's updated assessment
        would run contrary to the mitigating-factor analysis mandated by the Guidelines.
    rejected:
      O1: Given the evidence of treatment, abstinence, and expert testimony, outright denial is not justified.
      O2: A conditional restoration is unnecessary because the employee already satisfies the full mitigation criteria under
        Guideline G.
      O3: Additional evidence is superfluous; the existing record sufficiently demonstrates sustained abstinence and rehabilitation.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A PEth test administered after the hearing shows a positive result indicating renewed alcohol consumption.
      then: O1
      why: A positive biomarker would interrupt the established abstinence pattern, negating mitigating factor (b).
    would_not_change:
    - id: noflip1
      if: The employee missed a single scheduled SMART Recovery session but otherwise remained abstinent.
      why: An isolated attendance lapse does not overturn the mitigation established under factor (b).
    watch_for:
    - id: watch1
      what: Adherence to the DOE psychologist's recommendation for monthly PEth testing over the next six months.
      favors:
      - O2
      why: Failure to maintain the testing schedule could generate a new concern, making a conditional rather than full restoration
        appropriate.
  lesson: Under DOE Guideline G, an individual can fully mitigate alcohol-related security concerns by acknowledging the problem,
    completing approved treatment, maintaining documented abstinence (e.g., negative PEth results), and receiving professional
    confirmation that no disorder persists.
  limits: This analysis is limited to alcohol-related security concerns governed by the DOE Adjudicative Guidelines. It does
    not extend to other guidelines such as criminal conduct under Guideline J, nor to cases lacking objective biomarker evidence.
