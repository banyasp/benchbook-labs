case:
  id: DR-OHA-26-0100-1@v1
  title: Guideline G Alcohol Consumption Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, September 16, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, was arrested for Aggravated Battery on September 8, 2025 after consuming
    one alcoholic drink, and later arrested for Driving While Intoxicated on January 4, 2026 after consuming three drinks,
    with a breath test of 0.16/0.17 and a positive PEth result. The Local Security Office raised a security concern under
    Guideline G, citing the arrests and a diagnosis of Unspecified Alcohol-Related Disorder by a DOE psychologist. Since those
    incidents, the Individual has completed two alcohol‑education courses, attended SMART Recovery meetings regularly, engaged
    in individual counseling, and submitted seven consecutive negative PEth tests through August 2026. She also complied with
    all probation requirements for both offenses, including community service, an ignition interlock, and required classes.
    The DOE psychologist later testified that the Individual no longer meets criteria for an alcohol use disorder. The Administrative
    Judge must determine whether the security concern under Guideline G has been resolved and whether the Individual’s access
    authorization should be restored.
  question: What should the Administrative Judge do regarding the Individual’s security concern under Guideline G?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization with monitoring.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with Aggravated Battery on September 8, 2025 after consuming one alcoholic
      beverage.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with DWI on January 4, 2026 after consuming three alcoholic drinks, with
      a breath test of 0.16/0.17 and a positive PEth level of 119 ng/mL on January 6, 2026.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline G based on the arrests and a diagnosis of Unspecified
      Alcohol-Related Disorder by a DOE psychologist.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual completed an alcohol education course on February 12, 2026, a 12‑week substance cessation support
      course completed May 13, 2026, and attended SMART Recovery meetings regularly from January 2026 through July 2026.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual provided seven consecutive negative PEth test results dated February 5, 2026 through August 6, 2026.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The DOE psychologist later testified that the Individual does not meet DSM‑5 criteria for any alcohol use disorder.
  - id: F7
    kind: capability
    status: confirmed
    fact: The Individual complied with all probation requirements for the Aggravated Battery charge, completing fines, community
      service, and was released from probation on May 29, 2026.
  - id: F8
    kind: capability
    status: confirmed
    fact: The Individual complied with DWI probation requirements, including installing an ignition interlock, attending classes,
      and completing community service.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The Individual acknowledged past alcohol misuse, completed education and support courses, attended SMART Recovery,
      and provided seven consecutive negative PEth tests, satisfying mitigating factor (b) for Guideline G.
  - id: C2
    facts:
    - F5
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Objective laboratory evidence (seven negative PEth results) demonstrates a clear pattern of abstinence consistent
      with the DOE Psychologist’s recommendation.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The DOE psychologist testified that the Individual no longer meets DSM‑5 criteria for any alcohol‑use disorder, removing
      the diagnostic basis for a Guideline G concern.
  - id: C4
    facts:
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Full compliance with probation, community service, ignition‑interlock, and class requirements shows reliable behavior
      and respect for legal obligations.
  - id: C5
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline G permits mitigation when the individual demonstrates sustained abstinence and treatment, which the record
      satisfies per the Adjudicative Guidelines (§23).
  reasoning:
    read: The LSO raised a Guideline G security concern based on two alcohol‑related arrests and a diagnosis of Unspecified
      Alcohol‑Related Disorder. The Administrative Judge must decide if the Individual has remedied the concern.
    weighing: The Judge weighed the mitigating factors listed in the Adjudicative Guidelines against the derogatory information.
      Because the Individual satisfied factor (b)—acknowledgment, treatment, and documented abstinence (C1‑C3)—and complied
      with all probation terms (C4), the Judge concluded the concern was resolved, echoing the source’s language that the
      security concerns under Guideline G are mitigated.
    tradecraft: The decision is recorded in the official OHA decision, citing the relevant exhibits and testimony, and the
      restoration order is entered into the Individual’s security file.
    uncertainty: Minimal; the extensive documentary and laboratory evidence leaves little doubt about current abstinence.
    handoff: The Administrative Judge decides alone, as permitted by 10 C.F.R. §710.7(a); no further agency review is required
      unless appealed.
    tempting_wrong:
      option: O1
      pull: A residual bias against granting clearances might suggest denying restoration despite mitigation.
      why_wrong: The source explicitly found the mitigating factors sufficient; denying would contradict the adjudicative
        standards and the evidence of rehabilitation.
    rejected:
      O1: The record shows the Individual met all mitigating criteria for Guideline G, so denial is unsupported.
      O3: The source found no need for continued monitoring; the mitigation was deemed complete.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent positive PEth test or a new alcohol‑related arrest occurs.
      then: O1
      why: A relapse would demonstrate that the mitigating factor (b) is no longer satisfied, re‑establishing the security
        concern.
    would_not_change:
    - id: noflip1
      if: The Individual continues to provide negative PEth results and remains compliant with probation.
      why: The mitigating factors remain intact, so the restoration stands.
    watch_for:
    - id: watch1
      what: Any future alcohol‑related incident or positive PEth result.
      favors:
      - O1
      why: Such evidence would indicate a breach of the abstinence pattern that underlies the mitigation.
  lesson: Under Guideline G, an individual can overcome alcohol‑related security concerns by acknowledging the problem, completing
    treatment, and demonstrating sustained abstinence verified by objective testing. When these mitigating factors are met,
    the clearance can be restored.
  limits: This analysis applies only to DOE personnel security clearances governed by 10 C.F.R. Part 710 and Guideline G.
    It does not address other adjudicative guidelines, unrelated criminal conduct, or non‑DOE agencies.
