case:
  id: DR-OHA-26-0100-1@v1
  title: Resolution of Guideline G Alcohol-Related Security Concern
  status: draft
  setting: DOE Office of Hearings and Appeals, September 2026, administrative security clearance hearing
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, was arrested for aggravated battery in September 2025 after consuming
    one alcoholic drink and for a DWI in January 2026 after consuming three drinks, resulting in a BAC of 0.16/0.17. The Local
    Security Office raised security concerns under Guideline G, citing the arrests and a psychologist’s diagnosis of an Unspecified
    Alcohol-Related Disorder. Since the arrests, the Individual has completed two alcohol‑education courses, a twelve‑week
    substance‑cessation program, and regularly attended SMART Recovery meetings. She has provided seven consecutive negative
    PEth tests covering February through August 2026 and has complied with all probation requirements for both offenses. The
    hearing is underway to determine whether these actions mitigate the Guideline G concerns.
  question: What should the Administrative Judge do regarding the Individual’s security concerns under Guideline G?
  options:
    O1:
      do: Determine that the security concerns under Guideline G remain unresolved and deny restoration of the Individual’s
        access authorization.
      move: act
      irreversible: true
    O2:
      do: Grant a conditional restoration, requiring the Individual to continue monthly PEth tests and recovery program participation
        for six months.
      move: partial
      irreversible: false
    O3:
      do: Hold the decision and request additional evidence, such as further PEth tests, before ruling on Guideline G.
      move: hold
      irreversible: false
    O4:
      do: Find that the Individual has resolved the security concerns under Guideline G and restore her access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with Aggravated Battery on September 8, 2025 after consuming one alcoholic
      beverage.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with DWI on January 4, 2026 after consuming three alcoholic drinks, with
      breath test results of 0.16/0.17.
  - id: F3
    kind: situation
    status: confirmed
    fact: The LSO raised security concerns under Guideline G based on the two arrests and a DOE Psychologist’s diagnosis of
      Unspecified Alcohol‑Related Disorder.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual completed an alcohol‑education course on February 12, 2026 and a twelve‑week substance‑cessation
      support class on May 13, 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: Since January 2026, the Individual has regularly attended SMART Recovery meetings.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Seven consecutive PEth tests from February 5, 2026 through August 6, 2026 were negative, indicating no alcohol consumption.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: A PEth test taken on January 6, 2026 was positive at 119 ng/mL, and the DOE Psychologist diagnosed the Individual
      with UARD based on DSM‑5 criteria.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual completed all probation requirements for the Aggravated Battery charge, including fines, community
      service, and was released from probation on May 29, 2026.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Individual is complying with all DWI probation requirements, including an ignition interlock, classes, and random
      screenings.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F9
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: The Individual acknowledged problematic alcohol use, completed two education courses, a twelve‑week cessation program,
      and has been regularly attending SMART Recovery meetings, satisfying mitigating factor (b) for Guideline G.
  - id: C2
    facts:
    - F6
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Seven consecutive negative PEth tests from February through August 2026 objectively demonstrate sustained abstinence,
      a key element of the required pattern of modified consumption.
  - id: C3
    facts:
    - F4
    - F5
    - F9
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Completion of employer‑sponsored treatment and continued counseling shows satisfactory progress in a recognized rehabilitation
      program, meeting mitigating factor (c) and (d).
  - id: C4
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The DOE psychologist, who initially diagnosed UARD, later testified that the Individual no longer met DSM‑5 criteria
      for any alcohol‑use disorder, reinforcing that the security concern is mitigated.
  - id: C5
    facts:
    - F6
    - F9
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: More than six months have elapsed since the last alcohol‑related incident with no recurrence, supporting the presumption
      that the behavior is unlikely to recur.
  reasoning:
    read: Guideline G concerns arise from excessive alcohol consumption that may impair judgment. The LSO cited two arrests
      and a UARD diagnosis. The judge must decide whether the Individual’s post‑incident actions eliminate the doubt about
      reliability and trustworthiness.
    weighing: The judge applied the Adjudicative Guidelines, finding that mitigating factor (b) – acknowledgment of the problem,
      concrete remedial actions, and a clear abstinence pattern – is satisfied (see {C1},{C2},{C3}). The psychologist’s later
      opinion that no disorder remains ({C4}) and the passage of time without recurrence ({C5}) further support resolution.
      Consequently, the balance tips toward restoration.
    tradecraft: Record the finding that Guideline G concerns are resolved, cite the specific mitigating factors and evidence,
      and update the Individual’s access authorization status in the DOE security database.
    uncertainty: Minimal; the evidence is clear and the guidelines provide a straightforward mitigation pathway.
    handoff: The Administrative Judge decides alone, as the decision rests on the record and the judge’s discretionary judgment
      under 10 C.F.R. § 710.7(a).
    tempting_wrong:
      option: O1
      pull: The prior arrests and the psychologist’s initial diagnosis might suggest a continued risk.
      why_wrong: Ignoring the documented rehabilitation, negative biomarker results, and expert assessment would conflict
        with the mitigating‑factor analysis required by the Guidelines.
    rejected:
      O1: The security concerns are mitigated by documented treatment, abstinence, and expert testimony, so denial is unwarranted.
      O2: A conditional restoration is unnecessary because the evidence already meets the full mitigation criteria under Guideline
        G.
      O3: Additional evidence is not required; the record already contains sufficient proof of sustained abstinence and rehabilitation.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent PEth test after the hearing returns a positive result indicating renewed alcohol consumption.
      then: O1
      why: A positive biomarker would demonstrate a break in the abstinence pattern, negating mitigating factor (b).
    would_not_change:
    - id: noflip1
      if: The Individual had missed one scheduled SMART Recovery meeting but remained abstinent.
      why: Attendance irregularities alone do not overturn the established mitigation under factor (b).
    watch_for:
    - id: watch1
      what: Compliance with the DOE Psychologist’s recommendation for monthly PEth testing for six months.
      favors:
      - O2
      why: Failure to maintain the testing schedule could raise a new concern, prompting a conditional restoration instead
        of full restoration.
  lesson: Under DOE Guideline G, an individual can fully mitigate alcohol‑related security concerns by acknowledging the problem,
    completing approved treatment, maintaining documented abstinence (e.g., negative PEth tests), and receiving professional
    confirmation that no disorder persists.
  limits: This analysis applies only to alcohol‑related security concerns under the DOE Adjudicative Guidelines. It does not
    address other guidelines (e.g., criminal conduct under Guideline J) or situations lacking objective biomarker evidence.
