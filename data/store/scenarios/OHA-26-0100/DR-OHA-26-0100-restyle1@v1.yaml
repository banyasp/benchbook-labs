case:
  id: DR-OHA-26-0100-restyle1@v1
  title: Resolution of Guideline J Security Concern [restyle]
  status: needs_review
  setting: Office of Personnel Security, Department of Energy, October 3, 2026
  decider: Senior Adjudicative Officer
  agent: Senior Adjudicative Officer
  agent_role: decide
  situation: The employee, a DOE contractor, faced an aggravated-battery charge in September 2025 and a DWI charge in January
    2026. The Local Security Office filed a Guideline J security concern citing those incidents. The employee entered a no-contest
    plea to the battery charge, satisfied all fines, completed required community service, and concluded probation on 29 May
    2026. She also fulfilled DWI probation obligations, finished multiple alcohol-education programs, regularly attended SMART
    Recovery meetings, and produced seven consecutive negative PEth screens. A DOE psychologist first diagnosed an alcohol-related
    disorder but later testified that the employee no longer meets DSM-5 criteria and has a very favorable prognosis.
  question: What determination should the Senior Adjudicative Officer make regarding the employee's Guideline J security concern?
  options:
    O1:
      do: Reject the request to reinstate the employee's access authorization, concluding that the Guideline J concern remains
        unresolved.
      move: act
      irreversible: true
    O2:
      do: Pause the decision and seek additional documentation or a follow-up assessment before resolving the Guideline J
        issue.
      move: hold
      irreversible: false
    O3:
      do: Approve the reinstatement of the employee's access authorization, concluding that the Guideline J concern has been
        mitigated.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 8 September 2025, the employee was taken into custody and charged with aggravated battery.
  - id: F2
    kind: situation
    status: confirmed
    fact: On 4 January 2026, the employee was arrested for driving while intoxicated; the breath-alcohol reading was 0.16-0.17
      g/dL and a PEth assay measured 119 ng/mL.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office submitted a Guideline J security concern based on those arrests.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee entered a no-contest plea to the aggravated-battery charge, paid all fines, performed 24 hours of community
      service, and was released from probation on 29 May 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee complied with all DWI probation terms, including an ignition interlock, alcohol-education classes,
      community service, and remains under supervised probation.
  - id: F6
    kind: capability
    status: confirmed
    fact: From February through August 2026, the employee completed two employer-sponsored alcohol-education courses, attended
      SMART Recovery meetings regularly, and submitted seven consecutive negative PEth results.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A DOE psychologist initially diagnosed the employee with an unspecified alcohol-related disorder but later testified
      that she no longer satisfies DSM-5 criteria and has a very good prognosis.
  - id: F8
    kind: situation
    status: confirmed
    fact: The organization's Fitness-for-Duty program recorded full compliance with program requirements and noted strong
      personal motivation to change.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The employee satisfied every court-mandated fine, community-service obligation, and probation condition for both
      incidents, evidencing successful rehabilitation that aligns with mitigating factor (d) of Guideline J.
  - id: C2
    facts:
    - F6
    - F5
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: Since the arrests, the employee has avoided any further criminal conduct; seven consecutive negative PEth results
      and sustained abstinence indicate a low likelihood of recurrence.
  - id: C3
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: The psychologist's testimony that the employee no longer meets DSM-5 criteria for an alcohol-use disorder and enjoys
      a very good prognosis supports the conclusion that the security risk has been mitigated.
  - id: C4
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Guideline J permits mitigation when documentation demonstrates successful rehabilitation (mitigating factor d); the
      adjudicator therefore applies this regulatory provision.
  reasoning:
    read: The LSO's Guideline J concern stems from two criminal arrests. The adjudicator must determine whether the employee's
      conduct after those arrests fulfills the mitigating requirements set out in the Adjudicative Guidelines.
    weighing: Applying the source's own analysis, the adjudicator finds that the employee has satisfied mitigating factor
      (d)—successful rehabilitation—through completed probation, community service, compliance with DWI conditions, and ongoing
      abstinence (C1, C2). The psychologist's testimony (C3) further confirms reduced risk, and the regulatory framework (C4)
      authorizes a finding of mitigation. The balance therefore tips toward reinstatement.
    tradecraft: The determination is recorded in the Senior Adjudicative Officer's Decision memorandum, citing the relevant
      exhibits and testimony, and the restoration order is entered into the employee's security file pursuant to 10 C.F.R.
      § 710.7(a).
    uncertainty: Although the psychologist's earlier diagnosis raised concern, the later testimony that DSM-5 criteria are
      no longer met lessens uncertainty; the primary residual risk is potential relapse, which is being monitored through
      ongoing PEth testing.
    handoff: The Senior Adjudicative Officer decides unilaterally, as authorized by 10 C.F.R. § 710.27(d); no further agency
      review is required unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: A rigid presumption against granting clearances might tempt a denial despite the documented rehabilitation.
      why_wrong: The source explicitly states that the mitigating factors under Guideline J have been met, making denial contrary
        to the adjudicative guidelines.
    rejected:
      O1: The security concern is mitigated by successful rehabilitation and lack of recurrence, so denial is not supported.
      O2: The record is sufficient; additional evidence is unnecessary because the mitigating factors are already satisfied.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee were to produce a positive PEth result or be arrested for a new alcohol-related offense after the hearing
        date
      then: O1
      why: A new incident would defeat the mitigating factor of no recurrence and re-introduce a security risk under Guideline
        J.
    would_not_change:
    - id: noflip1
      if: The DOE psychologist continued to diagnose an alcohol-use disorder but affirmed the employee no longer meets DSM-5
        criteria
      why: The source already treated the diagnosis as mitigated by treatment progress, so the decision remains unchanged.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or criminal arrest
      favors:
      - O1
      why: Such evidence would indicate relapse and undermine the mitigation analysis.
  lesson: Under Guideline J, documented successful rehabilitation—completion of probation, community service, and verified
    abstinence—satisfies mitigating factor (d) and permits restoration of a security clearance even after serious criminal
    conduct.
  limits: This reasoning applies only when the individual demonstrates documented compliance with all court-ordered conditions
    and no further offenses; it does not extend to situations where relapse or new criminal conduct occurs.
