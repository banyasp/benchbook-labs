case:
  id: DR-OHA-26-0100-restyle3@v1
  title: Resolution of Guideline J Security Concern [restyle]
  status: needs_review
  setting: Department of Energy, Office of Personnel Security, Memorandum dated 16 September 2026
  decider: Senior Adjudicative Officer
  agent: Senior Adjudicative Officer
  agent_role: decide
  situation: The Senior Adjudicative Officer must decide whether the employee has adequately addressed the security concern
    identified under Guideline J, which pertains to criminal conduct. The employee was arrested for aggravated battery in
    September 2025 and for driving while intoxicated in January 2026. She entered a no-contest plea to the battery charge,
    satisfied fines, completed community service, and completed probation on 29 May 2026. For the DWI, she accepted a plea,
    was placed on supervised probation, installed an ignition-interlock, and fulfilled the required classes and community
    service. She has finished multiple alcohol-education courses, attended SMART Recovery meetings regularly since January
    2026, and submitted seven consecutive negative PEth tests. The DOE psychologist diagnosed her with an unspecified alcohol-related
    disorder but noted progress, and the Local Security Office cited the arrests as a Guideline J concern.
  question: What action should the Senior Adjudicative Officer take regarding the employee's Guideline J security concern?
  options:
    O1:
      do: The Senior Adjudicative Officer denies the employee's petition to reinstate clearance.
      move: act
      irreversible: true
    O2:
      do: The Senior Adjudicative Officer defers the determination pending additional proof of sobriety.
      move: hold
      irreversible: false
    O3:
      do: The Senior Adjudicative Officer reinstates the employee's access clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee was taken into custody on 8 September 2025 for aggravated battery.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee was taken into custody on 4 January 2026 for driving while intoxicated.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee entered a no-contest plea to the aggravated battery charge, satisfied all fines, performed the mandated
      community service, and completed probation on 29 May 2026.
  - id: F4
    kind: situation
    status: confirmed
    fact: Regarding the DWI, the employee pleaded guilty, was placed on supervised probation, installed a mandated ignition-interlock
      device, and fulfilled all required classes and community service.
  - id: F5
    kind: situation
    status: confirmed
    fact: From February through August 2026 the employee completed a series of alcohol-education programs, has regularly attended
      SMART Recovery sessions since January 2026, and has produced seven successive negative PEth laboratory results.
  - id: F6
    kind: situation
    status: confirmed
    fact: A DOE-affiliated psychologist diagnosed the employee with an unspecified alcohol-related disorder, noting significant
      improvement and recommending ongoing treatment and abstinence.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Local Security Office recorded a Guideline J security concern based on the employee's two recent arrests.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Senior Adjudicative Officer possesses statutory authority under DOE Part 710 to adjudicate restoration of personnel
      security clearances.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The employee satisfied every court-mandated condition for both incidents—including fines, community service, probation
      completion, ignition-interlock installation, and required coursework—thereby meeting mitigating factor (d) of demonstrated
      successful rehabilitation under Guideline J.
  - id: C2
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: Seven back-to-back negative PEth results together with eight months of consistent SMART Recovery participation provide
      compelling evidence of sustained abstinence, satisfying mitigating condition (b) that the conduct is unlikely to recur.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The DOE psychologist's assessment indicates the employee no longer fulfills DSM-5 criteria for an alcohol-use disorder
      and offers a highly favorable prognosis, reinforcing that the security concern has been mitigated.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: Although the Local Security Office correctly flagged a Guideline J issue stemming from the arrests, the Adjudicative
      Guidelines expressly permit mitigation when clear rehabilitation is documented, which the record demonstrates.
  reasoning:
    read: The Local Security Office identified the employee's two recent arrests as a criminal-conduct issue under Guideline
      J. The adjudicator must determine whether the mitigating evidence outweighs the derogatory information.
    weighing: Applying the Guidelines, the adjudicator concluded that (a) the employee has fully complied with all probation
      requirements (C1), (b) she has demonstrated a sustained period of sobriety and treatment participation (C2), and (c)
      a qualified psychologist assessed no longer meeting disorder criteria (C3). These satisfy mitigating factor (d) – evidence
      of successful rehabilitation – and therefore resolve the Guideline J concern. The Local Security Office's initial concern
      is noted but is outweighed by the positive evidence.
    tradecraft: The determination is documented in the Senior Adjudicative Officer's written decision, citing the specific
      exhibits and transcript excerpts that support each mitigating factor, and the outcome is entered into the DOE personnel
      security system.
    uncertainty: The principal uncertainty concerns future conduct; a relapse could reactivate the concern. The current record,
      however, shows no indication of imminent risk.
    handoff: The Senior Adjudicative Officer acts independently, as authorized by 10 C.F.R. § 710.7(a); no further agency
      review is required unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: The default presumption against granting clearances and the gravity of an aggravated-battery arrest might tempt
        a denial.
      why_wrong: Such a denial would disregard the substantial rehabilitation evidence and conflict with the Guidelines that
        prioritize proven reformation.
    rejected:
      O1: Denial overlooks the extensive compliance and rehabilitation documentation required for mitigation under Guideline
        J.
      O2: Deferring the decision adds no substantive benefit; the existing record already fulfills the mitigating criteria.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee were to relapse and register a positive alcohol biomarker or incur a fresh criminal charge.
      then: O1
      why: A new violation would erase the mitigating factor (d) of successful rehabilitation and reactivate the Guideline
        J concern.
    would_not_change:
    - id: noflip1
      if: The employee has not yet fulfilled the entire term of the DWI probation.
      why: The adjudicator expressly concluded that, despite the incomplete probation, the actions taken to date sufficiently
        resolve the concern.
    watch_for:
    - id: watch1
      what: Any subsequent positive PEth result or new arrest.
      favors:
      - O1
      why: Such evidence would signal a recurrence of the behavior that originally triggered the Guideline J issue.
  lesson: When an individual demonstrates full compliance with legal sanctions, sustained abstinence, and a professional assessment
    of recovery, Guideline J security concerns can be mitigated, permitting restoration of access clearance. The adjudicative
    process balances the presumption against clearance with concrete evidence of rehabilitation.
  limits: This reasoning applies only where the record shows clear, documented rehabilitation and no new derogatory conduct.
    It does not extend to cases lacking objective evidence of abstinence or where the individual reoffends.
