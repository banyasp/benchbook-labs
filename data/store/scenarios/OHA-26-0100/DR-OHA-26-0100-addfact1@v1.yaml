case:
  id: DR-OHA-26-0100-addfact1@v1
  title: Resolution of Guideline J Security Concern [addfact]
  status: needs_review
  setting: Department of Energy, Office of Hearings and Appeals – 16 September 2026
  decider: Administrative Law Judge
  agent: the Administrative Law Judge
  agent_role: decide
  situation: The employee, a contractor for the Department, faced an arrest for aggravated battery on 8 September 2025 and
    a separate arrest for driving while intoxicated on 4 January 2026, the latter yielding breath-test results of 0.16 and
    0.17 g/dL and a PEth concentration of 119 ng/mL. The Local Security Office subsequently cited these incidents in a Guideline
    J security concern. The employee entered a no-contest plea to the battery charge, satisfied the imposed fines, performed
    24 hours of community service, and was released from probation on 29 May 2026. Regarding the DWI, she fulfilled all probationary
    conditions—including an ignition interlock, mandated alcohol-education classes, and additional community service—and continues
    under supervised probation. She also completed two employer-sponsored alcohol-education courses, regularly attended SMART
    Recovery meetings, and submitted seven consecutive negative PEth tests from February through August 2026. A DOE psychologist
    first diagnosed an unspecified alcohol-related disorder but later testified that the employee no longer meets DSM-5 criteria
    and possesses a very favorable prognosis. In August 2026 the employee earned a formal DOE commendation for outstanding
    performance on a critical project, highlighting her reliability and adherence to security protocols. The employer's Fitness-for-Duty
    program confirmed full compliance with its requirements and noted a strong motivation to change.
  question: How should the Administrative Law Judge resolve the Guideline J security concern for this employee?
  options:
    O1:
      do: Reject the request to reinstate the employee's access clearance, determining that the Guideline J issue remains
        unresolved.
      move: act
      irreversible: true
    O2:
      do: Postpone a final ruling and seek additional documentation or a follow-up assessment before addressing the Guideline
        J concern.
      move: hold
      irreversible: false
    O3:
      do: Approve the reinstatement of the employee's access clearance, concluding that the Guideline J concern has been satisfactorily
        addressed.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee was arrested and charged with aggravated battery on 8 September 2025.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee was arrested and charged with driving while intoxicated on 4 January 2026, with breath-test readings
      of 0.16/0.17 g/dL and a PEth level of 119 ng/mL.
  - id: F3
    kind: situation
    status: confirmed
    fact: In August 2026 the employee received a formal Department of Energy commendation for exemplary work on a critical
      project, citing reliability and strict adherence to security procedures.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office filed a Guideline J security concern based on the employee's arrests.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee entered a no-contest plea to the aggravated battery charge, paid all fines, completed 24 hours of community
      service, and was released from probation on 29 May 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee satisfied all DWI probation conditions, including an ignition interlock, alcohol-education classes,
      and community service, and remains under supervised probation.
  - id: F7
    kind: capability
    status: confirmed
    fact: The employee completed two employer-sponsored alcohol-education courses, attended SMART Recovery meetings consistently,
      and produced seven consecutive negative PEth tests from February to August 2026.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A DOE psychologist initially diagnosed the employee with an unspecified alcohol-related disorder but later testified
      that she no longer meets DSM-5 criteria and has a very good prognosis.
  - id: F9
    kind: situation
    status: confirmed
    fact: The employer's Fitness-for-Duty program reported full compliance with program requirements and observed a strong
      motivation to change.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    - F9
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The employee has satisfied every court-ordered fine, completed all community-service obligations, and fulfilled every
      condition of both probation periods, showing the rehabilitation required by mitigating factor (d) of Guideline J.
  - id: C2
    facts:
    - F7
    - F6
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: Since the arrests, no further criminal conduct has occurred; seven consecutive negative PEth results and ongoing
      participation in recovery programs indicate a low likelihood of relapse.
  - id: C3
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: The DOE psychologist now testifies that the employee no longer meets DSM-5 criteria for an alcohol-use disorder and
      possesses a very favorable prognosis, reducing the perceived security risk.
  - id: C4
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Guideline J explicitly allows mitigation when evidence of successful rehabilitation is present; the record satisfies
      that regulatory standard.
  reasoning:
    read: The Local Security Office raised a Guideline J concern based on two arrests. The Administrative Law Judge must determine
      whether the employee's post-incident behavior satisfies the mitigating conditions of the adjudicative guidelines.
    weighing: Applying the regulatory framework, the Judge finds that mitigating factor (d) – successful rehabilitation –
      is met through full compliance with probation, community service, DWI-specific conditions, and documented abstinence
      (C1, C2). The psychologist's updated testimony (C3) confirms the absence of an alcohol-use disorder, while the DOE commendation
      (C5) demonstrates continued reliable performance. The statutory authority (C4) permits a finding of mitigation, leading
      the balance toward restoration.
    tradecraft: The decision is entered in the Administrative Judge's Decision memorandum, citing exhibits of the probation
      completions, PEth test results, psychologist testimony, and the DOE commendation, and the clearance reinstatement is
      recorded per 10 C.F.R. § 710.7(a).
    uncertainty: Residual uncertainty centers on the potential for future relapse, which is mitigated by ongoing supervised
      probation and periodic PEth testing.
    handoff: The ALJ decides alone under 10 C.F.R. § 710.27(d); further agency review is unnecessary unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: A rigid interpretation that any prior arrest automatically bars clearance could tempt a denial.
      why_wrong: Guideline J expressly allows mitigation when rehabilitation is proven; denying the clearance would contradict
        the prescribed standard.
    rejected:
      O1: The record demonstrates full rehabilitation and no recurrence, so a denial lacks support.
      O2: All required documentation is already in the file; additional evidence would be redundant given the satisfied mitigating
        factors.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee registers a positive PEth test or is arrested for a new alcohol-related offense after the hearing date
      then: O1
      why: A new incident would negate the no-recurrence element of mitigating factor (d) and re-introduce a security risk
        under Guideline J.
    would_not_change:
    - id: noflip1
      if: The DOE psychologist continues to affirm that the employee no longer meets DSM-5 criteria despite a prior diagnosis
      why: The source already treats the resolved diagnosis as mitigated by treatment progress, so the decision remains unchanged.
    watch_for:
    - id: watch1
      what: Any future positive PEth result or criminal arrest
      favors:
      - O1
      why: Such evidence would indicate relapse or new risk, undermining the mitigation analysis that supports reinstatement.
  lesson: Guideline J permits restoration of a security clearance when an individual demonstrates successful rehabilitation—completion
    of all court-ordered sanctions, sustained abstinence, and reliable performance—thereby satisfying mitigating factor (d).
  limits: This analysis applies only when the employee provides documented proof of compliance with all remedial conditions
    and shows no further offenses; it does not extend to cases where relapse or new criminal conduct occurs.
