case:
  id: DR-OHA-26-0100-flip3@v1
  title: Resolution of Guideline J Security Concern [flip]
  status: needs_review
  setting: Department of Energy Office of Personnel Security, October 3, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Administrative Judge must decide whether the employee's Guideline J security concern—stemming from recent
    criminal conduct—has been sufficiently mitigated to permit restoration of her access authorization. The employee was arrested
    for aggravated battery in September 2025 and for driving while intoxicated in January 2026. She entered a no-contest plea
    to the battery charge, satisfied all fines, completed community service, and finished probation in May 2026. For the DWI,
    she accepted a plea, served supervised probation, installed an ignition interlock, and fulfilled the required classes
    and service. Since January 2026 she has attended SMART Recovery meetings, completed several alcohol-education programs,
    and submitted seven consecutive negative PEth tests. The DOE psychologist diagnosed an unspecified alcohol-related disorder
    but noted improvement, while the Local Security Office flagged the arrests as a Guideline J issue. On September 15 2026
    the employee received a misdemeanor citation for public intoxication.
  question: Should the Administrative Judge restore the employee's access authorization under Guideline J?
  options:
    O1:
      do: The Administrative Judge denies the employee's request to reinstate authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge postpones the decision pending proof of sobriety.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge restores the employee's full access authorization immediately.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee was arrested on September 8, 2025 for aggravated battery.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee was arrested on January 4, 2026 for driving while intoxicated.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee entered a no-contest plea to the battery charge, paid fines, completed community service, and was released
      from probation on May 29, 2026.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee pleaded guilty to the DWI, served supervised probation, installed an ignition interlock, and fulfilled
      all mandated classes and community service.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee completed alcohol-education courses, attended SMART Recovery meetings regularly since January 2026,
      and provided seven consecutive negative PEth tests from February through August 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: 'F9 [situation, confirmed]: The Individual was cited for public intoxication on September 15, 2026, resulting in
      a misdemeanor citation and a brief court appearance.'
  - id: F7
    kind: situation
    status: confirmed
    fact: The DOE psychologist diagnosed the employee with an unspecified alcohol-related disorder and recommended continued
      treatment and abstinence.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Local Security Office raised a Guideline J security concern based on the employee's arrests.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Administrative Judge has authority under DOE Part 710 to decide on restoration of access authorization.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F6
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Although the employee fully satisfied court-ordered probation for the battery and DWI, the recent public-intoxication
      citation demonstrates a continued pattern of alcohol-related misconduct, undermining the rehabilitation factor required
      by Guideline J.
  - id: C2
    facts:
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The string of negative PEth tests is contradicted by the September 2026 intoxication citation, indicating that the
      employee's abstinence may not be durable enough to meet mitigating condition (b).
  - id: C3
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The psychologist's assessment of improvement remains valid, but the recent misdemeanor casts doubt on the durability
      of recovery, reducing the weight of this consideration.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The Local Security Office correctly identified a Guideline J concern; the new citation reinforces the view that mitigation
      has not yet been fully demonstrated.
  reasoning:
    read: The Local Security Office flagged the employee's two prior arrests as a criminal-conduct concern under Guideline
      J. The judge must weigh the mitigating evidence against the latest public-intoxication citation.
    weighing: Applying the adjudicative guidelines, the judge finds that while the employee complied with probation requirements
      (C1) and has documented periods of sobriety (C2), the recent misdemeanor citation demonstrates a failure to achieve
      lasting rehabilitation, outweighing the psychologist's optimistic assessment (C3). Consequently, the mitigation factors
      are insufficient to resolve the Guideline J concern, leading to denial (C1, C2, C4).
    tradecraft: The decision is entered in the Administrative Judge's written order, with citations to the relevant exhibits,
      and recorded in the DOE personnel security system.
    uncertainty: Future compliance remains uncertain; a sustained period without further alcohol-related incidents could alter
      the assessment.
    handoff: The Administrative Judge acts alone under 10 C.F.R. § 710.7(a); no additional agency review is required unless
      an appeal is filed.
    tempting_wrong:
      option: O3
      pull: The employee's extensive treatment record and prior compliance might suggest restoration.
      why_wrong: Restoring clearance despite the recent intoxication citation would conflict with Guideline J's emphasis on
        demonstrated, durable rehabilitation.
    rejected:
      O2: Holding the decision pending adds no substantive benefit because the recent citation already signals insufficient
        rehabilitation.
      O3: Restoration would ignore the clear, recent evidence of continued alcohol-related misconduct.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Since the conclusion of the supervised probation, the person has avoided any additional alcohol‑related legal infractions.
      then: O3
      why: the absence of new misconduct would re-establish confidence in sustained rehabilitation, making restoration appropriate
        again.
    would_not_change:
    - id: noflip1
      if: If the employee had completed the full term of DWI probation without incident.
      why: The judge noted that incomplete probation does not preclude a decision, but full completion would have further
        reinforced mitigation.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or additional alcohol-related citation.
      favors:
      - O1
      why: Such evidence would confirm a pattern of relapse, justifying continued denial.
  lesson: When a recent alcohol-related citation emerges despite prior compliance and treatment, the evidentiary threshold
    for mitigating a Guideline J security concern is not met, and denial of clearance is the appropriate outcome. The adjudicative
    process must give weight to the most current conduct indicators.
  limits: This analysis applies only in cases where a new alcohol-related offense or citation occurs after an initial period
    of compliance. It does not preclude restoration in situations where the record shows uninterrupted abstinence and no further
    derogatory conduct.
