case:
  id: DR-OHA-26-0100-revise1@v1
  title: Guideline G Alcohol Consumption Security Concern [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, September 16, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, was arrested for Aggravated Battery on September 8, 2025 after consuming
    one alcoholic drink, and later arrested for Driving While Intoxicated on January 4, 2026 after consuming three drinks,
    with a breath test of 0.16/0.17 and a positive PEth result. The Local Security Office raised a security concern under
    Guideline G, citing the arrests and a diagnosis of Unspecified Alcohol-Related Disorder by a DOE psychologist. Since those
    incidents, the Individual has completed two alcohol‑education courses, attended SMART Recovery meetings regularly, engaged
    in individual counseling, and submitted seven consecutive negative PEth tests through August 2026. She also complied with
    all probation requirements for both offenses, including community service, an ignition interlock, and required classes.
    The DOE psychologist later testified that the Individual no longer meets criteria for an alcohol use disorder. The Administrative
    Judge must determine whether the security concern under Guideline G has been resolved and whether the Individual’s access
    authorization should be restored.
  question: What should the Administrative Judge do regarding the Individual’s security concern under Guideline G?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization with monitoring.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with Aggravated Battery on September 8, 2025 after consuming one alcoholic
      beverage.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested and charged with DWI on January 4, 2026 after consuming three alcoholic drinks, with
      a breath test of 0.16/0.17 and a positive PEth level of 119 ng/mL on January 6, 2026.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline G based on the arrests and a diagnosis of Unspecified
      Alcohol-Related Disorder by a DOE psychologist.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual completed an alcohol education course on February 12, 2026, a 12‑week substance cessation support
      course completed May 13, 2026, and attended SMART Recovery meetings regularly from January 2026 through July 2026.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual provided seven consecutive negative PEth test results dated February 5, 2026 through August 6, 2026.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The DOE psychologist later testified that the Individual does not meet DSM‑5 criteria for any alcohol use disorder.
  - id: F7
    kind: capability
    status: confirmed
    fact: The Individual complied with all probation requirements for the Aggravated Battery charge, completing fines, community
      service, and was released from probation on May 29, 2026.
  - id: F8
    kind: capability
    status: confirmed
    fact: The Individual complied with DWI probation requirements, including installing an ignition interlock, attending classes,
      and completing community service.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The Individual completed education and testing, but the prior aggravated battery arrest creates a lingering concern
      that warrants additional oversight.
  - id: C2
    facts:
    - F5
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Seven consecutive negative PEth results show abstinence, yet laboratory evidence alone cannot fully eliminate the
      risk of future relapse.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The psychologist's testimony supports remission, but clinical judgments may not predict future behavior without continued
      observation.
  - id: C4
    facts:
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Full compliance with probation demonstrates responsibility, but does not guarantee that the Individual will not reoffend
      without a monitoring safeguard.
  - id: C5
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Guideline G permits mitigation, yet the seriousness of the underlying conduct suggests a conditional restoration
      with oversight.
  - id: C6
    facts:
    - F2
    - F3
    equity: risk_management
    favors:
    - O3
    weight: strong
    why: Given the prior alcohol-related arrests and the diagnostic concern, a monitoring regime provides a proportionate
      safeguard while recognizing the Individual's rehabilitation.
  reasoning:
    read: The LSO raised a Guideline G concern based on two alcohol-related arrests and a diagnosis of an alcohol-related
      disorder. The record now shows extensive treatment, abstinence testing, and professional testimony of remission.
    weighing: Although the mitigating factors satisfy Guideline G, the judge balances residual risk from the violent arrest
      and the DWI against the Individual's rehabilitation, concluding that restoration should be conditioned on ongoing monitoring
      to manage that risk.
    tradecraft: The decision is entered in the OHA docket, citing the new risk-management consideration and ordering periodic
      security-clearance checks and random alcohol testing.
    uncertainty: Moderate; the evidence of sustained abstinence is strong, but the prior violent conduct introduces a non-trivial
      risk that monitoring can mitigate.
    handoff: The Administrative Judge issues the final order; any appeal would follow DOE procedural regulations.
    tempting_wrong:
      option: O2
      pull: The strong evidence of rehabilitation may suggest that no further conditions are needed.
      why_wrong: Without monitoring, the agency would lack a practical mechanism to detect a possible relapse, contrary to
        the precautionary principle embodied in Guideline G.
    rejected:
      O1: Denial ignores the documented remediation and would be inconsistent with the adjudicative guidelines.
      O2: Unconditional restoration fails to address the residual risk associated with the prior violent and DWI offenses.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent positive PEth test or a new alcohol-related arrest occurs.
      then: O2
      why: A relapse would indicate that even the monitoring condition is insufficient, prompting a full restoration denial.
    would_not_change:
    - id: noflip1
      if: The Individual continues to provide negative PEth results and remains compliant with probation.
      why: The mitigating factors remain intact, so the restoration with monitoring stands.
    watch_for:
    - id: watch1
      what: Any future alcohol-related incident or positive PEth result.
      favors:
      - O1
      why: Such evidence would indicate a breach of the abstinence pattern that underlies the mitigation.
  lesson: Guideline G allows for restoration after remediation, but when the underlying conduct includes violent or high-risk
    behavior, a monitoring condition can balance rehabilitation with national-security interests.
  limits: Analysis applies to DOE personnel security clearances under 10 C.F.R. Part 710 and Guideline G; it does not extend
    to other agencies, non-security employment decisions, or unrelated criminal conduct.
