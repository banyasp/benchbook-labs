case:
  id: DR-OHA-26-0100-flip2@v1
  title: Resolution of Guideline G Alcohol-Related Security Concern [flip]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, October 2026, administrative security clearance proceeding
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The employee, a DOE contractor, faced an aggravated-battery charge in September 2025 after consuming a single
    alcoholic drink and a DWI charge in January 2026 after ingesting three drinks, resulting in a breath-alcohol level of
    roughly 0.16 g/dL. The Local Security Office cited these incidents and a DOE psychologist's diagnosis of an Unspecified
    Alcohol-Related Disorder as security concerns under Guideline G. Since the arrests, the employee completed two alcohol-education
    seminars, a twelve-week cessation program, and has been a regular participant in SMART Recovery meetings. Seven consecutive
    PEth screens from early February through early August 2026 were negative, but a follow-up PEth test on 15 September 2026
    returned 102 ng/mL, confirming alcohol use after the hearing. The hearing, held on 1 September 2026, must decide whether
    the Guideline G concerns are still outstanding.
  question: How should the Administrative Law Judge resolve the employee's security concerns under Guideline G?
  options:
    O1:
      do: Find that the Guideline G concerns remain unresolved and deny restoration of the employee's access authorization.
      move: act
      irreversible: true
    O2:
      do: Approve a conditional restoration, requiring monthly PEth testing and continued SMART Recovery participation for
        six months.
      move: partial
      irreversible: false
    O3:
      do: Postpone the decision and request additional evidence, such as further PEth results, before ruling on Guideline
        G.
      move: hold
      irreversible: false
    O4:
      do: Conclude that the Guideline G concerns have been fully mitigated and restore the employee's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee was arrested and charged with aggravated battery on 8 September 2025 after drinking one alcoholic beverage.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee was arrested and charged with a DWI on 4 January 2026 after consuming three drinks, with breath-alcohol
      readings of 0.16/0.17 g/dL.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office raised Guideline G concerns based on the two arrests and a DOE psychologist's diagnosis
      of Unspecified Alcohol-Related Disorder.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee completed an alcohol-education class on 12 February 2026 and a twelve-week substance-cessation program
      on 13 May 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: Since January 2026, the employee has consistently attended SMART Recovery meetings.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Seven consecutive PEth tests conducted from 5 February 2026 through 6 August 2026 were negative, indicating no alcohol
      intake.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: A PEth test on 6 January 2026 was positive at 119 ng/mL, and the DOE psychologist diagnosed the employee with an
      Unspecified Alcohol-Related Disorder using DSM-5 criteria.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employee satisfied all probation conditions for the aggravated-battery charge, including fines, community service,
      and was released from probation on 29 May 2026.
  - id: F9
    kind: intelligence
    status: confirmed
    fact: A subsequent phosphatidylethanol (PEth) screening performed on 15 September 2026 measured 102 ng/mL, confirming
      that the Individual had ingested alcohol after the hearing.
  - id: F10
    kind: situation
    status: confirmed
    fact: The employee is meeting all DWI probation requirements, including an ignition-interlock device, mandated classes,
      and random screenings.
  - id: F11
    kind: situation
    status: confirmed
    fact: The administrative security hearing concerning the Individual’s access authorization was held on 1 September 2026.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F10
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: The employee acknowledged problematic drinking, completed two education courses, a twelve-week cessation program,
      and has been regularly attending SMART Recovery, satisfying mitigating factor (b) of Guideline G.
  - id: C2
    facts:
    - F6
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Seven consecutive negative PEth results from February through August 2026 demonstrate a sustained abstinence pattern,
      a key requirement for mitigation.
  - id: C3
    facts:
    - F4
    - F5
    - F10
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Completion of employer-sponsored treatment and ongoing counseling indicate satisfactory progress in a recognized
      rehabilitation program, meeting mitigating factors (c) and (d).
  - id: C4
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The DOE psychologist's initial diagnosis of an alcohol-related disorder established a security concern at the outset.
  - id: C5
    facts:
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The positive PEth result on 15 September 2026 breaks the abstinence pattern, indicating renewed alcohol consumption
      and reviving the risk assessment.
  reasoning:
    read: Guideline G addresses alcohol-related behavior that could impair judgment or reliability. The LSO cited two arrests
      and a psychologist's diagnosis as concerns. The judge must assess whether the employee's post-incident conduct eliminates
      those concerns.
    weighing: While earlier evidence ({C1},{C2},{C3}) suggested mitigation, the PEth result disclosed in {F9} demonstrates
      a breach of the required abstinence pattern, reviving the security concern. Consequently, the balance now favors denial
      of restoration.
    tradecraft: Record that Guideline G concerns remain unresolved, cite the positive post-hearing PEth finding, and retain
      the denial of access authorization in the DOE security database.
    uncertainty: High, because the recent biomarker evidence re-opens the question of reliability and trustworthiness.
    handoff: The Administrative Law Judge decides alone, applying the adjudicative guidelines and exercising discretion under
      10 C.F.R. § 710.7(a).
    tempting_wrong:
      option: O4
      pull: The employee's prior treatment, negative tests, and psychologist testimony might suggest the concerns are resolved.
      why_wrong: The new positive PEth test demonstrates a relapse, invalidating the earlier mitigation analysis.
    rejected:
      O2: Conditional restoration is unnecessary because the underlying concern has re-emerged; a full denial is warranted.
      O3: Additional evidence is already present; the positive PEth result is sufficient to decide.
      O4: Restoring access would ignore the recent evidence of renewed alcohol use, contrary to Guideline G requirements.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If a post-hearing PEth screening remains negative, confirming continued abstinence, then O4 would be the appropriate
        outcome.
      then: O4
      why: A continued negative biomarker would re-establish the sustained abstinence pattern required for mitigation under
        Guideline G.
    would_not_change:
    - id: noflip1
      if: If the employee missed a single SMART Recovery session but otherwise stayed abstinent,
      why: Missing one meeting alone does not overturn the established mitigation under factor (b).
    watch_for:
    - id: watch1
      what: Ongoing compliance with the DOE psychologist's recommendation for monthly PEth testing for six months.
      favors:
      - O2
      why: Failure to maintain the testing schedule could generate a new concern, prompting a conditional rather than full
        restoration.
  lesson: A positive PEth result after a hearing nullifies previously demonstrated abstinence and re-establishes security
    concerns under DOE Guideline G, requiring denial of access until the abstinence pattern is re-established.
  limits: This analysis is limited to alcohol-related security concerns under the DOE Adjudicative Guidelines. It does not
    address other security domains (e.g., criminal conduct under Guideline J) or cases lacking objective biomarker data.
