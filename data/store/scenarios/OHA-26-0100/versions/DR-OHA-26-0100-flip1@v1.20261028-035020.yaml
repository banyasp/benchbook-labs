case:
  id: DR-OHA-26-0100-flip1@v1
  title: Resolution of Guideline J Security Concern [flip]
  status: needs_review
  setting: U.S. Department of Energy Office of Hearings and Appeals, 20 September 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Individual, employed by a DOE contractor, faced an Aggravated Battery charge in September 2025 and a DWI
    charge in January 2026. The Local Security Office cited these arrests as a Guideline J security concern. The Individual
    entered a no-contest plea to the battery charge, satisfied all fines and 24 hours of community service, and completed
    probation on 29 May 2026. For the DWI, she fulfilled ignition-interlock requirements, attended alcohol-education classes,
    performed community service, and remained on supervised probation. She also completed two employer-sponsored alcohol-education
    courses, regularly attended SMART Recovery meetings, and produced seven consecutive negative PEth screens from February
    through August 2026. However, a follow-up blood test on 5 October 2026 showed a PEth level of 132 ng/mL, indicating recent
    heavy drinking. The DOE psychologist initially diagnosed an unspecified alcohol-related disorder but later testified that
    the Individual no longer met DSM-5 criteria and has a very good prognosis. The hearing was held on 20 September 2026.
  question: How should the Administrative Law Judge resolve the Individual's Guideline J security concern?
  options:
    O1:
      do: Reject the request to reinstate the Individual's access, determining that the Guideline J security concern remains
        unresolved.
      move: act
      irreversible: true
    O2:
      do: Stay the determination and require additional documentation or a follow-up assessment before addressing the Guideline
        J issue.
      move: hold
      irreversible: false
    O3:
      do: Approve reinstatement of the Individual's access, concluding the Guideline J concern has been cleared.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 8 September 2025, the Individual was taken into custody and charged with Aggravated Battery.
  - id: F2
    kind: situation
    status: confirmed
    fact: On 4 January 2026, the Individual faced a DWI charge; breath-alcohol measurements were recorded at 0.16 and 0.17,
      and the initial PEth assay showed 119 ng/mL.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office filed a Guideline J security concern based on the two arrests.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual entered a no-contest plea to the battery allegation, satisfied the monetary penalties, completed
      a 24-hour community-service requirement, and was released from probation on 29 May 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: All DWI probation conditions were met by the Individual, including use of an ignition-interlock device, participation
      in alcohol-education classes, completion of community service, and continued supervision under probation.
  - id: F6
    kind: capability
    status: confirmed
    fact: The Individual finished two employer-sponsored alcohol-education programs, consistently attended SMART Recovery
      sessions, and produced seven back-to-back negative PEth results spanning February through August 2026.
  - id: F7
    kind: situation
    status: confirmed
    fact: A follow‑up blood analysis performed on October 5, 2026 revealed a PEth concentration of 132 ng/mL, indicating recent
      heavy alcohol consumption.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The DOE psychologist initially identified an Unspecified Alcohol-Related Disorder, but later testified that the
      Individual no longer fulfills DSM-5 criteria and possesses a very favorable prognosis.
  - id: F9
    kind: situation
    status: confirmed
    fact: The employer's Fitness-for-Duty assessment confirmed full compliance with program mandates and noted the Individual's
      strong commitment to change.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Administrative hearing was conducted on September 20, 2026.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Although the Individual completed court-ordered obligations, the recent PEth result (F7) demonstrates ongoing heavy
      alcohol use, undermining the claim of successful rehabilitation required by mitigating factor (d) of Guideline J.
  - id: C2
    facts:
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The prior streak of negative PEth tests (F6) is negated by the positive PEth finding (F7), indicating a relapse and
      raising the likelihood of future misconduct.
  - id: C3
    facts:
    - F8
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: While the psychologist testified that the Individual no longer meets DSM-5 criteria, the recent PEth level suggests
      the disorder may be re-emerging, weakening the risk-mitigation argument.
  - id: C4
    facts:
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline J requires evidence of no recurrence; the positive PEth test (F7) constitutes a recurrence of the underlying
      alcohol-related behavior, preventing the application of mitigating factor (d).
  reasoning:
    read: The LSO raised a Guideline J concern after two criminal arrests. The Judge must assess whether the Individual's
      post-arrest conduct satisfies the mitigation criteria.
    weighing: The recent PEth result (F7) shows a relapse, which defeats the rehabilitation argument advanced in the original
      analysis. Consequently, the mitigating factor (d) is not met, and the security risk remains unresolved (C1, C2, C4).
      The psychologist's later testimony (C3) is insufficient to outweigh the new evidence of heavy drinking.
    tradecraft: The decision is recorded in the Administrative Law Judge's written ruling, citing the relevant exhibits and
      the PEth result, and the denial is entered into the Individual's security file per 10 C.F.R. § 710.7(a).
    uncertainty: The positive PEth introduces uncertainty about future compliance; without a sustained period of abstinence,
      the risk of recurrence cannot be reliably discounted.
    handoff: The Administrative Law Judge decides alone, as authorized by 10 C.F.R. § 710.27(d); no further agency review
      is required unless an appeal is filed.
    tempting_wrong:
      option: O3
      pull: The record of completed education courses and prior negative PEth screens might suggest that the Individual has
        been rehabilitated.
      why_wrong: The latest positive PEth test demonstrates a breach of abstinence, violating the no-recurrence requirement
        of Guideline J and making restoration impermissible.
    rejected:
      O2: The existing evidence, particularly the recent PEth finding, already establishes a security concern; additional
        documentation would not change the risk assessment.
      O3: Restoring access would ignore the new indication of heavy alcohol consumption, contradicting the mitigation standards
        of Guideline J.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the Individual were to maintain a continued series of negative PEth results and incur no further arrests after
        the hearing date
      then: O3
      why: Sustained abstinence and absence of new criminal conduct would satisfy mitigating factor (d), allowing restoration
        under Guideline J.
    would_not_change:
    - id: noflip1
      if: If the DOE psychologist continues to affirm that the Individual no longer meets DSM-5 criteria for an alcohol-use
        disorder
      why: The psychologist's assessment alone does not override the requirement for demonstrated abstinence in the mitigation
        analysis.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or new criminal arrest
      favors:
      - O1
      why: Such evidence would indicate relapse and re-activate the security concern under Guideline J.
  lesson: Under Guideline J, a recent positive PEth test constitutes a recurrence of the underlying alcohol-related behavior,
    preventing the application of mitigating factor (d) and requiring denial of clearance restoration despite prior rehabilitation
    efforts.
  limits: This conclusion applies only when objective evidence (e.g., PEth) shows ongoing heavy alcohol use after the hearing;
    it does not preclude restoration in cases where the individual maintains documented abstinence and no further offenses.
