case:
  id: DR-OHA-26-0100-flip4@v1
  title: Guideline G Alcohol Consumption Security Concern [flip]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, 16 September 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a contractor employed by the Department of Energy, was arrested for Aggravated Battery on 8 September
    2025 after consuming a single alcoholic drink, and later arrested for Driving While Intoxicated on 4 January 2026 after
    ingesting three drinks, registering a breath-alcohol concentration of 0.16 %/0.17 % and a PEth level of 119 ng/mL on 6
    January 2026. The Local Security Office (LSO) cited these arrests and a diagnosis of Unspecified Alcohol-Related Disorder
    by a DOE-appointed psychologist to raise a security concern under Guideline G. Since then the Individual has completed
    an alcohol-education class (12 February 2026), a 12-week cessation support program (finished 13 May 2026), attended SMART
    Recovery meetings regularly through July 2026, and submitted seven consecutive negative PEth results from 5 February 2026
    through 6 August 2026. She also satisfied all probation conditions for both offenses, including community service, an
    ignition-interlock device, and required classes. However, a laboratory analysis on 20 September 2026 returned a PEth concentration
    of 97 ng/mL, exceeding the 20 ng/mL threshold that signals recent alcohol use. The DOE psychologist later testified that
    the Individual no longer meets DSM-5 criteria for any alcohol-use disorder. The Administrative Judge must decide whether
    the Guideline G concern remains unresolved and whether the Individual's access authorization should be restored.
  question: Should the Administrative Judge restore the Individual's access authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge restores the Individual's access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual's access authorization with monitoring.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 8 September 2025, after drinking a single alcoholic drink, the Individual was taken into custody and faced an
      Aggravated Battery charge.
  - id: F2
    kind: situation
    status: confirmed
    fact: A DWI arrest occurred on 4 January 2026 following the Individual's consumption of three drinks; a breath-alcohol
      measurement of 0.16 %/0.17 % and a PEth concentration of 119 ng/mL were documented on 6 January 2026.
  - id: F3
    kind: authority
    status: confirmed
    fact: Citing the two arrests and a DOE-psychologist's diagnosis of an Unspecified Alcohol-Related Disorder, the Local
      Security Office initiated a Guideline G security concern.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual finished an alcohol-education class on 12 February 2026, concluded a 12-week cessation support program
      on 13 May 2026, and maintained regular attendance at SMART Recovery gatherings from January through July 2026.
  - id: F5
    kind: capability
    status: confirmed
    fact: Seven back-to-back PEth screenings, all negative, were submitted for the period spanning 5 February 2026 to 6 August
      2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: 'F9 [situation, confirmed]: A laboratory analysis on September 20, 2026 returned a phosphatidylethanol concentration
      of 97 ng/mL, exceeding the 20 ng/mL threshold that signals recent alcohol intake.'
  - id: F7
    kind: intelligence
    status: assessed
    fact: In later testimony, the DOE psychologist affirmed that the Individual fails to satisfy DSM-5 criteria for any alcohol-use
      disorder.
  - id: F8
    kind: capability
    status: confirmed
    fact: All probation obligations tied to the Aggravated Battery charge—including payment of fines, community service, and
      related conditions—were fulfilled, leading to probation termination on 29 May 2026.
  - id: F9
    kind: capability
    status: confirmed
    fact: Compliance with DWI probation was achieved through installation of an ignition-interlock device, participation in
      mandated classes, and completion of community-service duties.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Although the Individual completed treatment and documented a period of abstinence, the recent positive PEth result
      (F6) demonstrates a relapse, breaking the sustained-abstinence requirement for mitigation under Guideline G.
  - id: C2
    facts:
    - F5
    - F6
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The earlier series of negative PEth tests (F5) is outweighed by the confirmed positive PEth on 20 September 2026
      (F6), indicating recent alcohol consumption and undermining the evidentiary basis for restoration.
  - id: C3
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The psychologist's testimony that the Individual no longer meets criteria for an alcohol-use disorder remains valid,
      but it does not alone overcome the objective evidence of recent drinking.
  - id: C4
    facts:
    - F8
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Full compliance with probation obligations shows respect for legal mandates, yet compliance does not address the
      new indication of alcohol use.
  - id: C5
    facts:
    - F3
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline G permits mitigation only when sustained abstinence is demonstrable; the positive PEth result (F6) invalidates
      the mitigation argument and sustains the security concern.
  reasoning:
    read: The LSO invoked Guideline G based on two alcohol-related arrests and a psychologist's diagnosis. A later laboratory
      finding (F6) shows recent alcohol intake, contradicting the prior record of abstinence.
    weighing: The Judge considered the mitigating factors (treatment, prior negative PEth, compliance) but gave decisive weight
      to the confirmed positive PEth result, which revokes the sustained-abstinence condition required for mitigation under
      Guideline G.
    tradecraft: The denial is entered in the official OHA decision, with exhibits documenting the positive PEth result and
      the relevant adjudicative guidance.
    uncertainty: Low; the laboratory analysis provides objective proof of recent drinking, leaving little doubt about a relapse.
    handoff: The Administrative Judge acts alone under 10 C.F.R. §710.7(a); no further agency review is required unless an
      appeal is filed.
    tempting_wrong:
      option: O2
      pull: The extensive prior treatment and compliance record might suggest granting restoration despite the recent test.
      why_wrong: Guideline G explicitly requires ongoing abstinence; the positive PEth result demonstrates a breach, making
        restoration contrary to policy.
    rejected:
      O2: The recent positive PEth (F6) shows the Individual has not maintained the abstinence required for mitigation, so
        restoration is not justified.
      O3: Monitoring would not address the fundamental violation of the abstinence condition; the security concern remains
        unresolved.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If subsequent PEth testing consistently returns negative results and no further alcohol-related incidents occur,
        the mitigation criteria would be re-established, making restoration appropriate.
      then: O2
      why: A sustained pattern of negative PEth would demonstrate that the relapse was isolated and that the Individual has
        returned to the abstinent state required by Guideline G.
    would_not_change:
    - id: noflip1
      if: The Individual continues to produce negative PEth results and remains free of alcohol-related offenses.
      why: The mitigation factors would remain satisfied, supporting a decision to restore access.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or alcohol-related legal incident.
      favors:
      - O1
      why: Such evidence would reaffirm the breach of abstinence and sustain the security concern.
  lesson: Guideline G mandates that sustained, objectively verified abstinence is essential for mitigating alcohol-related
    security concerns. A single positive PEth test after a period of negative results revives the concern and justifies denial
    of clearance restoration.
  limits: This analysis applies exclusively to DOE personnel security clearances governed by 10 C.F.R. Part 710 and Guideline
    G. It does not address other adjudicative guidelines, unrelated criminal conduct, or security determinations by non-DOE
    agencies.
