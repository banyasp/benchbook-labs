case:
  id: DR-OHA-26-0100-1@v1
  title: Guideline G Security Concern Resolution
  status: draft
  setting: DOE Office of Hearings and Appeals, September 2026, administrative security clearance hearing
  decider: Administrative Judge Erin C. Weinstock
  agent: Administrative Judge Erin C. Weinstock
  agent_role: decide
  situation: The Individual, a DOE contractor employee, required an access authorization. She was arrested for Aggravated
    Battery in September 2025 after consuming one drink and again for DWI in January 2026 after consuming three drinks, with
    a breath‑alcohol result of 0.16/0.17. The Local Security Office raised security concerns under Guideline G, citing these
    incidents and a diagnosis of Unspecified Alcohol‑Related Disorder by a DOE‑appointed psychologist. Since the arrests,
    the Individual completed two alcohol‑education courses, a twelve‑week cessation program, and has regularly attended SMART
    Recovery meetings. She also submitted seven consecutive negative PEth tests from February through August 2026 and complied
    with all probation requirements, including community service and an ignition interlock device.
  question: What should the Administrative Judge do regarding the Individual's security concern under Guideline G?
  options:
    O1:
      do: Hold the decision and require the Individual to provide additional evidence of continued abstinence, such as further
        PEth tests, before determining whether the Guideline G concerns are resolved.
      move: hold
      irreversible: false
    O2:
      do: Find that the Individual has resolved the security concerns under Guideline G and restore her access authorization.
      move: act
      irreversible: true
    O3:
      do: Find that the security concerns under Guideline G remain unresolved and deny restoration of the Individual’s access
        authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires her to hold an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: On September 8, 2025, the Individual was arrested and charged with Aggravated Battery after a physical altercation,
      having consumed one alcoholic beverage prior to the incident.
  - id: F3
    kind: situation
    status: confirmed
    fact: On January 4, 2026, the Individual was arrested and charged with DWI after a breath test showed a BAC of 0.16/0.17,
      following consumption of three alcoholic drinks earlier that day.
  - id: F4
    kind: capability
    status: assessed
    fact: A DOE‑appointed psychologist evaluated the Individual in February 2026 and diagnosed her with Unspecified Alcohol‑Related
      Disorder (UARD) under DSM‑5 criteria.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual completed two alcohol‑education/support courses, a twelve‑week substance‑cessation program, and has
      been regularly attending SMART Recovery meetings since January 2026.
  - id: F6
    kind: capability
    status: confirmed
    fact: The Individual provided seven consecutive negative PEth test results dated February through August 2026, indicating
      no significant alcohol consumption.
  - id: F7
    kind: capability
    status: confirmed
    fact: The Individual complied with all probation requirements for both arrests, including community service, an ignition
      interlock device, and was released from probation for the Aggravated Battery charge on May 29, 2026.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline G, citing the arrests and the UARD diagnosis.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual demonstrated sustained abstinence through seven consecutive negative PEth tests and completed multiple
      alcohol‑education and cessation programs, satisfying mitigating factor (b) for Guideline G.
  - id: C2
    facts:
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The DOE‑appointed psychologist, after reviewing the evidence, concluded the Individual no longer met DSM‑5 criteria
      for an alcohol use disorder, indicating reduced risk to reliability and trustworthiness.
  - id: C3
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Compliance with probation and community‑service requirements shows respect for legal obligations, supporting the
      view that the Individual’s behavior is unlikely to recur.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Regulatory guidance (10 C.F.R. §710.7(a)) requires the Judge to weigh all favorable and unfavorable evidence; the
      totality of evidence tilts toward mitigation under Guideline G.
  - id: C5
    facts:
    - F2
    - F3
    equity: norm_reciprocity
    favors:
    - O2
    weight: weak
    why: While the arrests are serious, the Individual’s acknowledgment of past misuse and proactive remediation satisfy the
      fairness principle that past errors can be forgiven when genuine rehabilitation is shown.
  reasoning:
    read: The LSO raised Guideline G concerns based on two alcohol‑related arrests and a UARD diagnosis. The Judge must decide
      whether the Individual’s post‑incident actions eliminate the risk to national security.
    weighing: The source emphasizes that mitigating factor (b) under Guideline G is met because the Individual acknowledged
      the problem, completed treatment, and provided objective proof of abstinence (seven negative PEth tests). The psychologist’s
      later opinion that she no longer meets disorder criteria further weakens the security concern. Accordingly, the balance
      of evidence favors restoration.
    tradecraft: The decision is recorded in the administrative decision document, citing the specific exhibits and testimony,
      and the restoration order is entered into the Individual’s security file.
    uncertainty: The Judge notes no lingering doubt given the objective test results and consistent treatment participation,
      but acknowledges that future alcohol use could revive the concern.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. §710.27(d), after reviewing all exhibits and
      testimony.
    tempting_wrong:
      option: O1
      pull: A cautious approach might suggest holding the decision pending further testing to ensure the abstinence trend
        continues.
      why_wrong: The source expressly finds the existing evidence sufficient under the mitigating factor, and holding would
        unnecessarily delay the Individual’s ability to perform her duties.
    rejected:
      O1: The Judge concluded the evidence already meets the required mitigation, so no further testing is needed.
      O3: The security concerns were found resolved; the Judge did not find any remaining unrebutted risk.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent PEth test after the hearing returns a positive result indicating significant alcohol consumption.
      then: O3
      why: A positive test would demonstrate a failure to maintain abstinence, negating mitigating factor (b).
    - id: flip2
      if: New credible evidence shows the Individual committed another alcohol‑related offense.
      then: O3
      why: Recurrence would show the behavior is not unlikely to repeat, undermining mitigation.
    would_not_change:
    - id: noflip1
      if: The Individual continues to provide negative PEth tests and maintains treatment participation.
      why: The existing mitigating factors remain satisfied, keeping the restoration decision stable.
    watch_for:
    - id: watch1
      what: Any future alcohol consumption detected by testing or reported incidents.
      favors:
      - O3
      why: Such evidence would re‑activate Guideline G concerns.
  lesson: Under Guideline G, a security clearance can be restored when the individual provides objective proof of sustained
    abstinence and completes recommended treatment, satisfying mitigating factor (b).
  limits: This reasoning applies only when the individual can demonstrate continuous abstinence through reliable testing and
    has completed prescribed treatment; it does not extend to cases where alcohol misuse continues or recurs.
