case:
  id: DR-OGE-2635-606-restyle1@v1
  title: Recusal Decision for Military Officer with Prospective Defense Contractor Employment [restyle]
  status: needs_review
  setting: Office of the Under Secretary for Acquisition, Department of Energy, during the employee's final six months of
    civil service
  decider: the senior ethics official vested with waiver authority under 18 U.S.C. §208(b)(1)
  agent: the senior ethics official vested with waiver authority under 18 U.S.C. §208(b)(1)
  agent_role: decide
  situation: A senior civil servant has accepted a post with a private aerospace firm that will commence six months after
    the employee separates from federal service. The employee will remain on the federal payroll for the next six months and
    is presently responsible for overseeing a procurement contract with that same firm. Under the applicable ethics regulation,
    an employee may not take part personally and substantially in a matter that has a direct and predictable impact on the
    financial interests of a prospective employer unless a written waiver is issued. No waiver has been granted. Consequently,
    the employee's ongoing participation would affect the firm's financial interests. The power to issue a waiver rests with
    an official authorized by 18 U.S.C. §208(b)(1).
  question: What course of action should the employee pursue regarding personal and substantial participation in the contract
    administration?
  options:
    O1:
      do: Continue personal and substantial participation in administering the contract.
      move: act
      irreversible: false
    O2:
      do: Refrain from personal and substantial participation in administering the contract.
      move: act
      irreversible: false
    O3:
      do: File a waiver request with the authorized ethics official.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee has secured a position with a private aerospace firm that will begin six months after separation.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee remains a federal employee for six months until separation.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee is currently involved in administering a contract with that aerospace firm.
  - id: F4
    kind: authority
    status: confirmed
    fact: §2635.606(a) bars an employee from taking part personally and substantially in a matter that directly and predictably
      affects the financial interests of a prospective employer unless a written waiver is issued.
  - id: F5
    kind: authority
    status: confirmed
    fact: A written waiver may be issued by an official authorized under 18 U.S.C. §208(b)(1).
  - id: F6
    kind: situation
    status: assessed
    fact: No written waiver has been issued to the employee.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The employee's participation would have a direct and predictable effect on the firm's financial interests.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: §2635.606(a) expressly prohibits personal and substantial involvement in any matter that directly and predictably
      influences the financial interests of a prospective employer unless a written waiver is on file.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The absence of a written waiver means the statutory exemption has not been exercised, leaving the prohibition intact.
  - id: C3
    facts:
    - F3
    - F7
    equity: protected_activity
    favors:
    - O2
    weight: strong
    why: Continuing the employee's involvement would directly and predictably affect the firm's financial interests—the very
      scenario the regulation is designed to prevent.
  - id: C4
    facts:
    - F4
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: Permitting participation without a waiver would create the appearance that agency decisions could be swayed by the
      employee's future employment prospects.
  - id: C5
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The employee may request a waiver, but the request alone does not lift the prohibition; recusal remains mandatory
      until a waiver is actually granted.
  reasoning:
    read: The employee is slated to join a firm whose contract the employee is presently overseeing. The ethics rule treats
      that prospective employment as a conflict that must be avoided unless a written waiver is in place.
    weighing: Because §2635.606(a) is unequivocal and no waiver exists (C1-C3), the balance decisively favors recusal. Although
      the employee might argue that continuity benefits the mission, the integrity of the procurement process outweighs that
      concern (C4). The only permissible path is to seek a waiver while refraining from participation (C5).
    tradecraft: The employee should immediately cease personal and substantial involvement in the contract, inform the supervisory
      chain, and submit a formal waiver request to the authorized ethics official. The recusal must be recorded in the employee's
      ethics file and reported to the contracting office.
    uncertainty: Minimal; the regulatory language is clear.
    handoff: The employee initiates the recusal decision but must engage the authorized ethics official (the waiver authority)
      to obtain any possible exemption.
    tempting_wrong:
      option: O1
      pull: Continuing involvement would preserve institutional knowledge and avoid a temporary lapse in contract oversight.
      why_wrong: It would breach the explicit prohibition of §2635.606(a) and create the appearance of bias.
    rejected:
      O1: Participation is barred by the regulation because no waiver exists.
      O3: A waiver request alone does not remove the prohibition; recusal remains required until a waiver is issued.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A written waiver is issued under the authority of 18 U.S.C. §208(b)(1)
      then: O1
      why: The waiver expressly lifts the prohibition, permitting the employee to continue participation.
    would_not_change:
    - id: noflip1
      if: The employee merely requests a waiver but none is granted
      why: Absent an actual waiver, the prohibition stays in effect.
    watch_for:
    - id: watch1
      what: The employee self-waiving or disregarding the recusal requirement
      favors:
      - O1
      why: Such conduct would violate the ethics regulation and could trigger disciplinary action.
  lesson: When a federal employee has a prospective employment arrangement that will be financially impacted by a current
    matter, participation is prohibited unless a written waiver is obtained from the authorized official.
  limits: The rule applies only to conflicts that involve direct and predictable financial effects on a prospective employer;
    it does not extend to unrelated personal interests or post-separation activities that are not tied to the specific matter.
