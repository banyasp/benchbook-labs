case:
  id: DR-OGE-2635-606@v1
  title: Recusal Decision for Military Officer with Prospective Defense Contractor Employment
  status: draft
  setting: Department of Defense, during the officer's final six months of active service
  decider: the authorized official with waiver authority under 18 U.S.C. 208(b)(1)
  agent: the authorized official with waiver authority under 18 U.S.C. 208(b)(1)
  agent_role: decide
  situation: A senior military officer has accepted a position with a defense contractor that will begin six months after
    the officer retires from active service. The officer remains employed by the Government for the next six months and is
    currently involved in administering a contract with that same defense contractor. Under the ethics regulation, participation
    in a matter that directly and predictably affects the financial interests of a prospective employer is prohibited unless
    a written waiver is issued. No waiver has been granted to the officer. The officer's continued participation would therefore
    affect the contractor's financial interests. The authority to issue a waiver resides with an official authorized by 18
    U.S.C. 208(b)(1).
  question: What should the officer do about participating personally and substantially in administering the contract?
  options:
    O1:
      do: The officer continues participating personally and substantially in administering the contract.
      move: act
      irreversible: false
    O2:
      do: The officer refrains participating personally and substantially in administering the contract.
      move: act
      irreversible: false
    O3:
      do: The officer requests a waiver from the authorized official.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The officer has accepted a job with a defense contractor that will begin six months after retirement.
  - id: F2
    kind: situation
    status: confirmed
    fact: The officer remains in Government employment for six months until retirement.
  - id: F3
    kind: situation
    status: confirmed
    fact: The officer is involved in administering a contract with that defense contractor.
  - id: F4
    kind: authority
    status: confirmed
    fact: §2635.606(a) prohibits an employee from participating personally and substantially in a matter that has a direct
      and predictable effect on the financial interests of a prospective employer unless a written waiver is issued.
  - id: F5
    kind: authority
    status: confirmed
    fact: A written waiver can be issued under the authority of 18 U.S.C. 208(b)(1).
  - id: F6
    kind: situation
    status: assessed
    fact: No written waiver has been issued to the officer.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The officer's participation would have a direct and predictable effect on the contractor's financial interests.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: §2635.606(a) expressly bars participation in a matter that directly and predictably affects the financial interests
      of a prospective employer unless a written waiver is issued.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: No written waiver has been granted; the authority to waive the prohibition has not been exercised.
  - id: C3
    facts:
    - F3
    - F7
    equity: protected_activity
    favors:
    - O2
    weight: strong
    why: The officer’s continued involvement would have a direct and predictable effect on the contractor’s financial interests,
      the very circumstance the regulation seeks to prevent.
  - id: C4
    facts:
    - F4
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: Allowing participation without a waiver would create the appearance that the agency’s decision‑making could be influenced
      by personal employment prospects.
  - id: C5
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The officer may request a waiver, but the request does not itself remove the prohibition; recusal remains required
      until a waiver is issued.
  reasoning:
    read: The officer has a pending job with the contractor whose contract he is currently administering. The regulation treats
      that future employment as a conflict that must be avoided unless a written waiver is issued.
    weighing: Because the rule in §2635.606(a) is clear and no waiver exists (C1‑C3), the balance tips decisively toward recusal.
      Even though the officer might argue mission continuity, the integrity of the procurement process outweighs that concern
      (C4). The only permissible path forward is to seek a waiver while refraining from participation (C5).
    tradecraft: The officer should immediately cease personal and substantial involvement in the contract, notify his chain
      of command, and file a formal request for a waiver with the authorized official. The recusal should be documented in
      the ethics file and reported to the contracting office.
    uncertainty: Minimal; the regulatory language is unambiguous.
    handoff: The officer makes the initial recusal decision but must involve the authorized official (the waiver authority)
      to obtain any possible exemption.
    tempting_wrong:
      option: O1
      pull: Continuing participation would preserve operational familiarity and avoid a temporary gap in contract oversight.
      why_wrong: It would violate the explicit prohibition of §2635.606(a) and risk the appearance of bias.
    rejected:
      O1: Participation is barred by the regulation because no waiver exists.
      O3: A waiver request does not itself lift the prohibition; recusal is still required until a waiver is granted.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A written waiver is issued under the authority of 18 U.S.C. 208(b)(1)
      then: O1
      why: The waiver expressly lifts the prohibition, allowing the officer to continue participation.
    would_not_change:
    - id: noflip1
      if: The officer merely requests a waiver but none is granted
      why: Without an actual waiver, the prohibition remains in force.
    watch_for:
    - id: watch1
      what: The officer self‑waiving or ignoring the recusal requirement
      favors:
      - O1
      why: Such conduct would breach the ethics regulation and could lead to disciplinary action.
  lesson: When an employee has a prospective employment arrangement that will be financially affected by a current matter,
    participation is prohibited unless a written waiver is obtained from the authorized official.
  limits: This rule applies only to conflicts involving direct and predictable financial effects on a prospective employer;
    it does not cover unrelated personal interests or post‑retirement activities that are not tied to the matter at hand.
