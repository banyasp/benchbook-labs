case:
  id: DR-OGE-2635-606-revise1@v1
  title: Recusal Decision for Military Officer with Prospective Defense Contractor Employment [revise]
  status: needs_review
  setting: Department of Defense, during the officer's final six months of active service
  decider: the authorized official with waiver authority under 18 U.S.C. 208(b)(1)
  agent: the authorized official with waiver authority under 18 U.S.C. 208(b)(1)
  agent_role: decide
  situation: A senior military officer has accepted a position with a defense contractor that will begin six months after
    the officer retires from active service. The officer remains employed by the Government for the next six months and is
    currently involved in administering a contract with that same defense contractor. Under the ethics regulation, participation
    in a matter that directly and predictably affects the financial interests of a prospective employer is prohibited unless
    a written waiver is issued. No waiver has been granted to the officer. The officer's continued participation would therefore
    affect the contractor's financial interests. The authority to issue a waiver resides with an official authorized by 18
    U.S.C. 208(b)(1).
  question: What should the officer do about participating personally and substantially in administering the contract?
  options:
    O1:
      do: The officer continues participating personally and substantially in administering the contract.
      move: act
      irreversible: false
    O2:
      do: The officer refrains participating personally and substantially in administering the contract.
      move: act
      irreversible: false
    O3:
      do: The officer requests a waiver from the authorized official.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The officer has accepted a job with a defense contractor that will begin six months after retirement.
  - id: F2
    kind: situation
    status: confirmed
    fact: The officer remains in Government employment for six months until retirement.
  - id: F3
    kind: situation
    status: confirmed
    fact: The officer is involved in administering a contract with that defense contractor.
  - id: F4
    kind: authority
    status: confirmed
    fact: §2635.606(a) prohibits an employee from participating personally and substantially in a matter that has a direct
      and predictable effect on the financial interests of a prospective employer unless a written waiver is issued.
  - id: F5
    kind: authority
    status: confirmed
    fact: A written waiver can be issued under the authority of 18 U.S.C. 208(b)(1).
  - id: F6
    kind: situation
    status: assessed
    fact: No written waiver has been issued to the officer.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The officer's participation would have a direct and predictable effect on the contractor's financial interests.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Although §2635.606(a) bars participation without a waiver, the regulation also provides a clear mechanism for seeking
      a waiver, so the prohibition alone is not determinative of the correct action.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: No written waiver has been granted; the authority to waive the prohibition has not been exercised.
  - id: C3
    facts:
    - F3
    - F7
    equity: protected_activity
    favors:
    - O2
    weight: strong
    why: The officer’s continued involvement would have a direct and predictable effect on the contractor’s financial interests,
      the very circumstance the regulation seeks to prevent.
  - id: C4
    facts:
    - F4
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: Allowing participation without a waiver would create the appearance that the agency’s decision‑making could be influenced
      by personal employment prospects.
  - id: C5
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The regulation expressly authorizes the officer to request a waiver; initiating that request is the appropriate and
      permissible step before any recusal, making the waiver request the primary recommended action.
  reasoning:
    read: The officer will soon be employed by the contractor whose contract he is presently administering; §2635.606(a) prohibits
      personal and substantial participation unless a written waiver is obtained.
    weighing: Because the rule provides a specific waiver process, the most responsible action is to activate that process.
      The prohibition (C1) is now viewed as a weak deterrent, while the authority to request a waiver (C5) carries strong
      weight, tipping the balance toward filing the request.
    tradecraft: The officer should draft a formal waiver request citing the pending employment, submit it to the authorized
      official under 18 U.S.C. 208(b)(1), and suspend personal involvement pending a decision. Documentation of the request
      and temporary recusal should be recorded in the ethics file.
    uncertainty: Moderate; the outcome of the waiver request depends on the authorized official's discretion, but the procedural
      step itself is clearly supported by the regulation.
    handoff: The officer initiates the request but the authorized official holds the final authority to grant or deny the
      waiver.
    tempting_wrong:
      option: O2
      pull: Refraining entirely avoids any appearance of conflict and requires no further action.
      why_wrong: Pure recusal leaves the contract without the officer's expertise and ignores the regulation's provision that
        a waiver request is the proper first step.
    rejected:
      O1: Continuing participation violates §2635.606(a) because no waiver exists.
      O2: Full recusal without seeking a waiver neglects the officer's duty to pursue the available remedy and may unnecessarily
        disrupt contract oversight.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: A written waiver is issued under the authority of 18 U.S.C. 208(b)(1)
      then: O2
      why: Even with a waiver, the officer should continue to refrain until the waiver is formally recorded and any conflict-mitigation
        steps are verified.
    would_not_change:
    - id: noflip1
      if: The officer merely requests a waiver but none is granted
      why: Without an actual waiver, the prohibition remains in force.
    watch_for:
    - id: watch1
      what: The officer self‑waiving or ignoring the recusal requirement
      favors:
      - O1
      why: Such conduct would breach the ethics regulation and could lead to disciplinary action.
  lesson: When a prospective employment creates a direct financial interest in a current matter, the employee should promptly
    request a waiver from the authorized official before taking any recusal action.
  limits: The rule applies only to conflicts where the employee's future employer's financial interests are directly and predictably
    affected by the current matter; it does not cover unrelated personal interests or post-retirement activities lacking such
    a direct link.
