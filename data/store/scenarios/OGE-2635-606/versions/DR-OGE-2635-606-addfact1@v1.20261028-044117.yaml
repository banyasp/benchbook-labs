case:
  id: DR-OGE-2635-606-addfact1@v1
  title: Recusal Decision for Military Officer with Prospective Defense Contractor Employment [addfact]
  status: needs_review
  setting: U.S. Department of Defense, final half-year of an officer's active duty service
  decider: the senior official empowered to grant waivers under 18 U.S.C. §208(b)(1)
  agent: the senior official empowered to grant waivers under 18 U.S.C. §208(b)(1)
  agent_role: decide
  situation: An officer nearing retirement has secured employment with a defense contractor that will commence six months
    after he leaves government service. He will remain a federal employee for the next six months and, during that period,
    is tasked with administering the contractor's contract. Section 2635.606(a) of the Standards of Conduct prohibits an employee
    from taking part personally and substantially in any matter that has a direct and predictable impact on the financial
    interests of a prospective employer unless a written waiver is issued. Such waivers may be granted only by an official
    authorized under 18 U.S.C. §208(b)(1). To date, no waiver has been provided to the officer, and his continued involvement
    would directly and predictably affect the contractor's financial interests. The agency also lacks any other staff member
    with comparable technical expertise to manage the contract.
  question: How should the officer proceed regarding his personal and substantial participation in administering the contract?
  options:
    O1:
      do: The officer continues to take personal and substantial responsibility for administering the contract.
      move: act
      irreversible: false
    O2:
      do: The officer withdraws from personal and substantial involvement in the contract's administration.
      move: act
      irreversible: false
    O3:
      do: The officer submits a request for a waiver to the authorized official.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The officer has secured employment with a defense contractor that will commence six months after his retirement.
  - id: F2
    kind: situation
    status: confirmed
    fact: He will remain a government employee for the next six months until his retirement date.
  - id: F3
    kind: situation
    status: confirmed
    fact: During this period, he is tasked with administering a contract awarded to that same contractor.
  - id: F4
    kind: authority
    status: confirmed
    fact: Section 2635.606(a) of the Standards of Conduct forbids an employee from taking part personally and substantially
      in any matter that has a direct and predictable impact on the financial interests of a prospective employer, absent
      a written waiver.
  - id: F5
    kind: authority
    status: confirmed
    fact: A written waiver may be granted by an official authorized under 18 U.S.C. §208(b)(1).
  - id: F6
    kind: situation
    status: assessed
    fact: To date, no written waiver has been provided to the officer.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Consequently, his continued involvement would directly and predictably influence the contractor's financial interests.
  - id: F8
    kind: situation
    status: confirmed
    fact: The agency currently lacks any other staff member possessing comparable technical expertise to manage the contract.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Section 2635.606(a) bars personal, substantial participation when a direct and predictable financial impact on a
      prospective employer exists, and no waiver has been issued.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Because no written waiver has been granted, the officer must seek one before any participation is permissible.
  - id: C3
    facts:
    - F3
    - F7
    equity: protected_activity
    favors:
    - O3
    weight: strong
    why: The officer's ongoing role would directly influence the contractor's financial interests, creating the very conflict
      the regulation seeks to prevent unless a waiver is secured.
  - id: C4
    facts:
    - F4
    equity: oversight_candor
    favors:
    - O3
    weight: weak
    why: Continuing without a waiver would appear to favor personal employment prospects; a waiver request demonstrates transparency
      and mitigates that perception.
  - id: C5
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The officer may formally request a waiver; the request itself does not lift the prohibition but is the required first
      action.
  - id: C6
    facts:
    - F8
    - F4
    - F6
    - F7
    equity: mission_continuity
    favors:
    - O3
    weight: strong
    why: Because no other qualified personnel are available, the agency’s ability to administer the contract would suffer
      without the officer’s expertise; a waiver request allows the agency to retain that expertise pending official approval.
  reasoning:
    read: The officer is slated to join a contractor whose contract he currently oversees; the Standards of Conduct prohibit
      such involvement absent a written waiver, yet the agency has no comparable replacement.
    weighing: The legal prohibition (C1-C3) makes participation impermissible without a waiver. The lack of alternative expertise
      (C6) creates a strong policy interest in retaining the officer's knowledge, which is best satisfied by requesting a
      waiver rather than withdrawing entirely (C4-C5). Consequently, the balanced course is to file a waiver request while
      remaining recused until approval.
    tradecraft: The officer should immediately submit a formal waiver request to the senior official authorized under 18 U.S.C.
      §208(b)(1), document the recusal, and continue to provide technical input only as permitted pending a decision.
    uncertainty: Low; the regulatory language is clear, and the staffing shortage is a factual condition.
    handoff: The officer initiates the waiver request; the authorized official decides whether to grant the exemption.
    tempting_wrong:
      option: O1
      pull: Continuing without interruption would maintain operational familiarity and avoid a temporary oversight gap.
      why_wrong: It directly violates §2635.606(a) and creates a conflict of interest.
    rejected:
      O2: Pure withdrawal would deprive the agency of essential expertise, jeopardizing contract performance; a waiver request
        better balances ethical compliance with mission needs.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: A written waiver is issued by the official authorized under 18 U.S.C. §208(b)(1)
      then: O1
      why: The waiver lifts the prohibition, allowing the officer to resume personal, substantial participation.
    - id: flip2
      if: A qualified replacement staff member becomes available to manage the contract
      then: O2
      why: With adequate expertise, the agency can afford the officer’s withdrawal, restoring the parent scenario’s preferred
        option.
    would_not_change:
    - id: noflip1
      if: The officer only submits a request and no waiver is granted
      why: Without an actual waiver, the prohibition remains in force and the officer must stay recused.
    watch_for:
    - id: watch1
      what: The officer self-waiving or ignoring the recusal requirement
      favors:
      - O1
      why: Such conduct would breach the ethics regulation and could result in disciplinary action.
  lesson: When a prospective employment conflict exists, the officer must seek a waiver before any personal, substantial involvement;
    a waiver request also addresses mission-continuity concerns when no suitable replacement is available.
  limits: The requirement to obtain a waiver applies only to conflicts where the employee's actions have a direct, predictable
    financial impact on a prospective employer and does not extend to unrelated personal interests or post-retirement activities
    lacking such a link.
