case:
  id: DR-CORPUS-NX-aa0f076d-E2@v1
  title: Poland and the Warsaw Pact Wartime Statute
  status: draft
  setting: Poland, 1980, Warsaw Pact wartime command arrangements
  decider: The Polish Party chief
  agent: The Polish Party chief
  agent_role: decide
  situation: The USSR sought to formalize Warsaw Pact command arrangements for wartime in a new statute adopted in March 1980.
    The arrangements raised concerns about national sovereignty, and Romanian objections had delayed the effort. The Polish
    General Staff had raised questions along similar lines. Poland's military role and close alignment with Moscow differed
    from Romania's more independent course.
  question: What should the Polish Party chief do about Poland's adherence to the wartime statute?
  options:
    O1:
      do: The Polish Party chief rejects Poland's adherence to the wartime statute.
      move: act
      irreversible: false
    O2:
      do: The Polish Party chief accepts Poland's adherence to the wartime statute.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The USSR sought to formalize wartime Warsaw Pact command arrangements in a new statute adopted in March 1980.
  - id: F2
    kind: situation
    status: confirmed
    fact: Romanian objections delayed the effort, with the Romanian regime viewing the statute as an unacceptable surrender
      of national sovereignty.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Romanian regime did not sign or agree to abide by the wartime statute.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Polish General Staff raised questions similar to Romania's sovereignty concerns.
  - id: F5
    kind: situation
    status: confirmed
    fact: Poland had the largest East European military force and was central to Soviet military planning for conflict in
      Europe.
  - id: F6
    kind: situation
    status: confirmed
    fact: Soviet military forces had vacated Romania in 1958.
  - id: F7
    kind: situation
    status: confirmed
    fact: Romania had pursued an independent foreign, military, and intelligence policy for two decades.
  - id: F8
    kind: situation
    status: confirmed
    fact: Poland had remained closely aligned with Moscow in foreign, military, and intelligence policy.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: 'The statute raised a genuine sovereignty concern: Romania viewed it as an unacceptable surrender of national sovereignty,
      and the Polish General Staff raised similar questions.'
  - id: C2
    facts:
    - F3
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Romania's refusal showed that a Warsaw Pact member could resist Soviet pressure, but Romania's independent policy
      and the earlier departure of Soviet forces made it a different case from Poland.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Poland's large military force and central place in Soviet planning for a European conflict made it materially more
      important to the wartime arrangements.
  - id: C4
    facts:
    - F7
    - F8
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The source contrasts Romania's long independent course with Poland's close alignment with Moscow in foreign, military,
      and intelligence policy; it cautions that Poland was not Romania.
  reasoning:
    read: This is a choice about adherence to a wartime command statute amid sovereignty concerns, not an operational command
      decision. The trap is treating Romania's refusal as a directly transferable precedent without accounting for Poland's
      different strategic role and relationship with Moscow.
    weighing: 'The sovereignty concerns and Romania''s example make rejection a real possibility {C1} {C2}. The stated contrast
      weighs toward adherence: Poland was central to Soviet military planning and remained closely aligned with Moscow, unlike
      Romania {C3} {C4}. On that contextual balance, the Polish Party chief agreed to abide by the statute; the passage does
      not provide a detailed account of his personal deliberations.'
    tradecraft: Record the sovereignty concerns and the reasons Poland's circumstances differ from Romania's, and make clear
      that the decision concerns adherence to the statute rather than operational command procedures.
    uncertainty: The passage does not set out the statute's detailed provisions or explain the Polish Party chief's personal
      rationale. It notes that a different Polish leadership might have pursued a more autonomous course, so the balance is
      sensitive to Poland's alignment and strategic position.
    handoff: The Polish Party chief held the decision. As a prudent process, consult the General Staff because it had raised
      related concerns, while leaving the adherence decision with the chief.
    tempting_wrong:
      option: O1
      pull: Romania's refusal appears to offer a precedent for protecting national sovereignty under Soviet pressure.
      why_wrong: 'Equating Poland with Romania overlooks their differences: Poland was central to Soviet planning and closely
        aligned with Moscow, whereas Romania had pursued an independent policy and Soviet forces had left.'
    rejected:
      O1: Rejection was not chosen because the stated contrast between Poland's strategic importance and close alignment,
        and Romania's distinct independence, supports Poland's adherence.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Poland had Romania's independent foreign, military, and intelligence course and was not central to Soviet military
        planning.
      then: O1
      why: Those differences are the stated reasons that Romania's refusal was not a direct model for Poland; removing them
        would substantially weaken the case for adherence.
    would_not_change:
    - id: noflip1
      if: The sovereignty objections and the Polish General Staff's questions remained, while Poland's stated strategic role
        and close alignment with Moscow were otherwise unchanged.
      why: The sovereignty concerns remain, but Poland's strategic importance and close alignment with Moscow still distinguish
        it from Romania.
    watch_for:
    - id: watch1
      what: Whether Poland's close alignment with Moscow and central place in Soviet military planning continue to characterize
        the decision context.
      favors:
      - O2
      why: Those contextual differences distinguish Poland from Romania.
  lesson: 'A precedent for resisting pressure is not automatically transferable: compare the states'' strategic roles, alignment,
    and capacity for an independent course. Acknowledge sovereignty concerns, but weigh them against the decision-maker''s
    actual context rather than treating a superficially similar case as controlling.'
  limits: This reasoning addresses the historical contrast and does not establish that the statute was lawful, that adherence
    was legally required, or that sovereignty concerns were resolved. It should not be applied to a different command arrangement
    without examining its terms and the relevant state's circumstances.
  library:
    domain: operational-command
    family: CORPUS-NX-aa0f076d
    source: https://www.cia.gov/static/aa90677342f91d48e26d15530efda944/Wartime-Statues.pdf
    episode_focus: The decision point is whether to accept wartime command arrangements that raised concerns about national
      sovereignty or to resist them; the passage identifies Poland’s acceptance and Romania’s refusal. Use the stated differences
      in alignment with Moscow and military-planning importance as context, but do not treat this as an operational command
      scenario.
    cues:
      option_words:
        O2: 11
        O1: 11
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
verdict_tier: source-endorsed
basis: Polish Party chief Edward Gierek agreed to abide by the wartime statute; the passage contrasts Poland's close alignment
  and central military role with Romania's more independent position.
