case:
  id: DR-CORPUS-INC-OPERATION-DESERT-STORM-NX-f4d2fcaf-E2@v1
  title: Response to the Iraqi Deployment Near Kuwait
  status: draft
  setting: Near the Kuwaiti border, October 1994; U.S. and allied decisionmakers.
  decider: U.S. and allied decisionmakers, not individually identified.
  agent: U.S. and allied decisionmakers
  agent_role: decide
  situation: In October 1994, tensions between Iraq and the United Nations had increased over continuing sanctions against
    Iraq. U.S. intelligence detected an Iraqi troop deployment near the Kuwaiti border involving almost 80,000 troops, including
    two elite Republican Guard divisions. The situation appeared similar to Iraq's August 1990 invasion of Kuwait. Intelligence
    warned that another invasion was possible, leaving decisionmakers to choose whether to dispatch forces to the region.
  question: What should the U.S. and allied decisionmakers do about the detected Iraqi troop deployment near the Kuwaiti border?
  options:
    O1:
      do: The U.S. and allied decisionmakers withhold forces from dispatch to the region.
      move: act
      irreversible: false
    O2:
      do: The U.S. and allied decisionmakers dispatch forces to the region.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In October 1994, tensions between Iraq and the United Nations had been increasing over continuing sanctions against
      Iraq.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: U.S. intelligence detected an Iraqi troop deployment in the vicinity of the Kuwaiti border.
  - id: F3
    kind: situation
    status: confirmed
    fact: The deployment involved almost 80,000 troops.
  - id: F4
    kind: situation
    status: confirmed
    fact: The deployment included two elite Republican Guard divisions.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The situation appeared similar to Iraq's August 1990 invasion of Kuwait.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Intelligence warned that another invasion was possible.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The large deployment, including elite Republican Guard divisions, appeared similar to the 1990 invasion, and intelligence
      warned another invasion was possible; dispatching forces was an appropriate response to that warning.
  - id: C2
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Saddam Hussein's exact intentions could not be known with certainty, but that uncertainty does not establish that
      the warning failed or justify withholding a response.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: 'Dispatching forces was appropriate and may have prevented an invasion: the warning appeared incorrect only because
      the response may have made it right.'
  reasoning:
    read: The deployment presented a credible possibility of another invasion because the situation resembled 1990 and intelligence
      warned of that possibility. The trap is to judge the warning as a failure merely because an invasion did not follow,
      without accounting for the possibility that the response prevented it.
    weighing: The resemblance to the prior invasion and the intelligence warning favor dispatch {C1}. Exact intentions cannot
      be known with certainty, but that uncertainty is not a reason to withhold action {C2}. Dispatch was appropriate and
      may have prevented the threatened outcome {C3}.
    tradecraft: Keep the decision record at the level of the assessed threat, the uncertainty about intentions, and the reason
      for dispatch; distinguish an unconfirmed prediction from evidence that a warning was mistaken.
    uncertainty: Whether Saddam Hussein intended to invade again is unresolved. The judgment does not depend on claiming certainty
      about that intention.
    handoff: The passage identifies U.S. and allied decisionmakers acting together but names no individual decider or referral
      authority; coordination with the allies is appropriate to the joint response.
    tempting_wrong:
      option: O1
      pull: Withhold forces because the warning did not culminate in an invasion and intentions could not be established with
        certainty.
      why_wrong: That reasoning mistakes a possibly prevented invasion for evidence that the warning was wrong; dispatch was
        appropriate action.
    rejected:
      O1: Withholding forces was not chosen because dispatch was appropriate and the apparently unfulfilled warning may reflect
        successful prevention.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The deployment no longer appeared comparable to the 1990 invasion and intelligence no longer assessed another invasion
        as possible.
      then: O1
      why: Without the warning and comparison that ground the rationale, its stated basis for dispatch would be absent.
    would_not_change:
    - id: noflip1
      if: The threat subsides after forces are dispatched and no invasion occurs.
      why: That outcome alone would not establish that the warning was wrong; the response may have made it appear incorrect
        by preventing the threatened event.
    watch_for: []
  lesson: Do not evaluate a warning solely by whether the predicted event occurred after a response. When the warning is credible
    and the response may have prevented the event, apparent non-occurrence does not by itself show that the warning or decision
    failed.
  limits: This reasoning addresses the specific deployment, its assessed similarity to the 1990 invasion, and the warning
    that another invasion was possible. It does not establish a general rule to dispatch forces whenever intentions are uncertain
    or assess the costs and risks of dispatch in other circumstances.
  library:
    domain: operational-command
    family: CORPUS-INC-OPERATION-DESERT-STORM
    source: https://www.marines.mil/Portals/1/Publications/MCDP%202.pdf
    episode_focus: The decision point is whether to respond to the detected deployment by dispatching forces or not, given
      the apparent similarity to Iraq’s 1990 invasion of Kuwait and the possibility of another invasion. The passage does
