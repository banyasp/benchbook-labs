case:
  id: DR-CORPUS-INC-OPERATION-DESERT-STORM-NX-ce0aec42-E1@v1
  title: Measuring Counter-SRBM Campaign Effectiveness
  status: draft
  setting: Gulf War, Coalition counter-SRBM campaign assessment
  decider: Coalition campaign assessors
  agent: Coalition campaign assessors
  agent_role: decide
  situation: Coalition campaign assessors must evaluate the effectiveness of counter-SRBM operations. Aircrews reported launcher
    kills, but the reliability of those reports is uncertain. Available imagery and limited gun-camera film raised questions
    about whether some reported kills involved launchers. Decoys and the mobile nature of the launchers made damage assessments
    difficult. Comparative figures on Iraqi operating tempo are also available, but the comparisons have significant limitations.
  question: What should Coalition campaign assessors do when choosing a measure of campaign effectiveness?
  options:
    O1:
      do: The Coalition campaign assessors adopt operating tempo as the primary campaign-effectiveness measure.
      move: act
      irreversible: false
    O2:
      do: The Coalition campaign assessors reject operating tempo as the primary campaign-effectiveness measure.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Coalition aircrews reported launcher kills.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Available imagery and limited gun-camera film indicated that many reported kills involved vehicles similar in appearance
      to launchers.
  - id: F3
    kind: situation
    status: confirmed
    fact: Iraqi use of decoys and the launchers' mobility made damage assessments extremely difficult.
  - id: F4
    kind: situation
    status: assessed
    fact: Traditional measures based on battle damage assessments provided a confused picture and might not be the most relevant
      means of assessing campaign effectiveness.
  - id: F5
    kind: situation
    status: confirmed
    fact: The impact of counter-SRBM operations on Iraqi mobile missile operating tempo was considered more quantifiable at
      the time.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A comparison between Iraqi mobile SRBM operations in the 1988 War of the Cities and the Gulf War indicated that
      Coalition efforts significantly reduced Iraq's operating tempo through destruction of launchers and related logistics
      or disruption of Iraqi operations.
  - id: F7
    kind: situation
    status: assessed
    fact: The figures suggesting a decline in Iraqi operating tempo were not conclusive, in part because Iraqi war aims differed
      between the Iran-Iraq War and DESERT STORM.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: In western Iraq, after the second week of the conflict, Iraq launched only four SCUDs per week, and launches from
      that area formed a continually diminishing percentage of total Iraqi SRBM launches.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Reported launcher kills were uncertain, and decoys and mobility made battle-damage assessments difficult; the traditional
      measure therefore gave a confused picture and might not be the most relevant measure of effectiveness.
  - id: C2
    facts:
    - F5
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Operating tempo was more quantifiable, and the comparison indicated a substantial decline in Iraqi operations; the
      particularly low and diminishing share of launches from western Iraq provided a concrete indicator of campaign impact.
  - id: C3
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The comparison was not conclusive because Iraqi war aims differed between the two conflicts, so reduced tempo should
      not be treated as definitive proof that Coalition operations caused the decline.
  reasoning:
    read: The issue is not whether reported launcher kills can be counted, but whether battle-damage assessments provide a
      reliable or relevant measure of campaign effectiveness. They do not provide a clear picture here, while operating tempo
      offers a more quantifiable indicator, though not conclusive proof of causation.
    weighing: The uncertain kill reports and difficult damage assessments favor {O1} over relying on traditional battle-damage
      measures {C1}. The operating-tempo comparison, including the low and diminishing share of launches from western Iraq,
      indicates that Coalition efforts reduced Iraqi operating tempo through destruction of launchers or related logistics,
      or disruption of operations {C2}. The different war aims limit the strength of that inference {C3}; they require qualification,
      not rejection of the more quantifiable measure.
    tradecraft: Use operating tempo as the primary measure, and record the comparison period, observed trends, and the limits
      on comparability. Separate the observed decline from any claim that Coalition operations alone caused it, and do not
      present reported launcher kills or the tempo figures as conclusive.
    uncertainty: The tempo comparison is suggestive rather than conclusive. Different Iraqi war aims across the conflicts
      complicate comparison, and the available evidence does not isolate the effects of launcher destruction, logistical losses,
      and operational disruption.
    handoff: The campaign assessors can make the measurement judgment; the stated reasoning does not require a separate approval
      authority. As a decision practice, they should have relevant analysts review the underlying figures and clearly qualify
      the resulting assessment.
    tempting_wrong:
      option: O2
      pull: Reject operating tempo as the primary measure because comparisons between the two conflicts are imperfect.
      why_wrong: The comparison's limitations are reasons for caution, but operating tempo remains more quantifiable and the
        observed decline is evidence that Coalition efforts may have reduced Iraqi operations.
    rejected:
      O2: The assessors should not reject operating tempo as the primary measure because, despite the comparison's limitations,
        it is more quantifiable than the confused battle-damage assessments and provides evidence of reduced Iraqi operations.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Further analysis showed that operating-tempo figures could not be compared meaningfully or did not indicate a decline
        associated with the campaign.
      then: O2
      why: Without a credible or relevant tempo indicator, its advantage over the confused battle-damage measure would no
        longer support adopting it as primary.
    would_not_change:
    - id: noflip1
      if: Reported launcher kills remained uncertain and decoys and mobility continued to make damage assessments difficult.
      why: Those conditions reinforce the reason for preferring the more quantifiable operating-tempo measure.
    watch_for:
    - id: watch1
      what: Whether additional assessment sustains the observed decline in operating tempo and clarifies how much it can be
        attributed to Coalition operations.
      favors:
      - O1
      why: Stronger evidence of a campaign-related decline would increase confidence in using operating tempo as the primary
        measure.
  lesson: Choose the measure that best captures the campaign's effects when traditional damage assessments are unreliable.
    Use comparative operational indicators when they are more quantifiable, but distinguish observed trends from conclusive
    causal findings and state the limits of comparison.
  limits: This reasoning concerns assessment of campaign effectiveness where reported kills and battle-damage assessments
    are uncertain and operating-tempo data are available. It does not establish that operating tempo is always the best measure
    or that the observed decline was caused solely by Coalition operations.
  library:
    domain: intel-analysis
    family: CORPUS-INC-OPERATION-DESERT-STORM
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-24.pdf
    episode_focus: The decision point is how to assess campaign effectiveness when reported launcher kills were uncertain
      and mobile launchers and decoys made damage assessments difficult. Keep the focus on the choice of assessment measure
      and its evidentiary limits; exclude decisions about selecting or striking targets.
