case:
  id: DR-CORPUS-INC-OPERATION-DESERT-STORM-NX-f4d2fcaf-E1@v1
  title: Revising the Marine Operation Plan
  status: draft
  setting: Marine operation through the Iraqi defensive belts, February 6
  decider: The Marine Force commander
  agent: The Marine Force commander
  agent_role: decide
  situation: An Iraqi division-sized ground attack at Al-Khafji from January 29 to February 1 was defeated by Coalition forces.
    Marine planners had previously perceived the Iraqi forces as capable of mounting a formidable defense. Intelligence assessments,
    participant reports, and reports from Iraqi troops who surrendered indicated weak coordination and a limited willingness
    and ability to fight effectively. An updated estimate assessed that Iraqi forces would probably be unable to defend forward
    positions effectively and that many troops might surrender once fighting began. The existing plan called for a sequential
    attack, while a revised plan proposed simultaneous attacks by two Marine divisions and assigned a significant force to
    deal with expected surrendering troops.
  question: 'What should the Marine Force commander do: retain the sequential plan or approve the revised plan?'
  options:
    O1:
      do: The Marine Force commander should reject the revised plan and retain the sequential plan for one division to follow
        the other.
      move: act
      irreversible: false
    O2:
      do: The Marine Force commander should approve the revised plan and adopt a simultaneous attack by two divisions.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Marine planners had previously perceived the Iraqi forces as capable of mounting a formidable defense.
  - id: F2
    kind: situation
    status: confirmed
    fact: An Iraqi division-sized ground attack at Al-Khafji from January 29 to February 1 was defeated by Coalition forces.
  - id: F3
    kind: capability
    status: assessed
    fact: Analysis indicated that Iraqi units were in deteriorating condition and had limited ability to coordinate between
      tactical echelons.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Marine participants described Iraqi soldiers as unmotivated, poorly trained, and unable to conduct combined arms
      operations.
  - id: F5
    kind: capability
    status: assessed
    fact: The updated estimate assessed that Iraqi forces would probably be unable to defend forward positions effectively.
  - id: F6
    kind: capability
    status: assessed
    fact: The estimate assessed that Iraqi forces could not coordinate between units, employ supporting arms, or conduct counterattacks
      with forces larger than a battalion.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Reports from Iraqi troops who surrendered reinforced the assessment that the Iraqi will to fight was weaker than
      anticipated, and the estimate indicated that infantry and artillery troops would probably surrender en masse once fighting
      began.
  - id: F8
    kind: situation
    status: confirmed
    fact: The existing plan called for a sequential attack, with one division following the other through the defensive belts.
  - id: F9
    kind: situation
    status: confirmed
    fact: The revised plan proposed simultaneous attacks by two Marine divisions and assigned a significant force to deal
      with expected surrendering Iraqi troops.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The defeat at Al-Khafji and analysis of deteriorating Iraqi units with limited coordination called the prior assessment
      of a formidable defense into question.
  - id: C2
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Participant reports and surrender reports supported the assessment that Iraqi troops were poorly prepared and less
      willing to fight than anticipated.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The updated estimate assessed that Iraqi forces would be unable to defend forward positions effectively or coordinate,
      employ supporting arms, and counterattack above battalion scale; commanders used this assessment to adopt a more aggressive
      plan.
  - id: C4
    facts:
    - F7
    - F9
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The estimate anticipated mass surrender, and the revised plan assigned a significant force to deal with surrendering
      troops.
  reasoning:
    read: The decision turned on whether the prior picture of a formidable Iraqi defense still fit the available evidence.
      The trap was allowing that earlier perception to outweigh the defeat at Al-Khafji and subsequent assessments of Iraqi
      capability and willingness to fight.
    weighing: The commander had converging indications of weak coordination, limited defensive capability, and likely mass
      surrender, which supported replacing the sequential plan with the revised plan {C1} {C2} {C3}. The expected surrender
      also informed the plan's provision for dealing with those troops {C4}. The balance depends on those assessments being
      a sound account of Iraqi capability and likely response; the commander approved the revised plan.
    tradecraft: For a comparable decision, distinguish earlier assumptions from later evidence, record which assessments support
      the choice, and identify what new information would warrant revisiting it. Keep the decision focused on the alternatives
      and their expected consequences, including the anticipated surrender.
    uncertainty: The capability and surrender judgments were estimates, not certainties. No quantified confidence level or
      contrary intelligence is provided, so the decision rests on the assessment available to the commander.
    handoff: The Marine Force commander made the plan decision, informed by intelligence assessments. No separate approval
      authority or required concurrence is identified.
    tempting_wrong:
      option: O1
      pull: Retaining the established sequential plan could seem prudent given the earlier perception that Iraqi forces could
        mount a formidable defense.
      why_wrong: That choice would preserve the earlier assumption despite the newer evidence that Iraqi forces were unlikely
        to coordinate an effective defense and might surrender in large numbers.
    rejected:
      O1: The commander did not retain the sequential plan because the updated intelligence supported a more aggressive revised
        plan and preparation for expected surrenders.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable updated assessments instead indicated that Iraqi forces could coordinate an effective defense of the forward
        positions.
      then: O1
      why: That would remove a central intelligence-based reason for replacing the sequential plan.
    - id: flip2
      if: The assessment that Iraqi forces would be unable to coordinate or respond effectively were materially undermined
        by new evidence.
      then: O1
      why: The revised plan was approved because commanders expected Iraqi forces to be unable to assess or respond effectively.
    would_not_change:
    - id: noflip1
      if: The expected number of surrendering troops remained uncertain, while the assessment of weak Iraqi defensive capability
        remained supported.
      why: Uncertainty about the scale of surrender alone would not negate the other intelligence-based reasons for the revised
        plan.
    watch_for:
    - id: watch1
      what: New evidence that Iraqi units could coordinate, employ supporting arms, or conduct effective counterattacks.
      favors:
      - O1
      why: Such evidence would conflict with the capability assessment that supported the revised plan.
  lesson: A commander should revise a plan when credible new intelligence materially changes the assessment of an adversary's
    capability and likely response. Earlier assumptions should not substitute for weighing the updated evidence and its operational
    consequences.
  limits: This reasoning applies to a plan choice in which updated intelligence changes the assessment of an adversary's capability
    and likely response. It does not establish a general rule for simultaneous attacks or address legal standards, civilian
    effects, or other facts not considered here.
