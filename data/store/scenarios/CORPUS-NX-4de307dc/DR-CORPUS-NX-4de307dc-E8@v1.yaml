case:
  id: DR-CORPUS-NX-4de307dc-E8@v1
  title: Shared Communications for PANAMAX 24
  status: draft
  setting: PANAMAX 24, SOUTHCOM; planning communications for participating service component commands.
  decider: The Executive Planning Agency (EPA)
  agent: The Executive Planning Agency (EPA)
  agent_role: decide
  situation: The EPA was determining communications requirements for participating service component commands during PANAMAX
    24. The exercise sought to improve interoperability with participating countries. IANTN could provide a shared communication
    environment for joint force commands and vetted partner personnel, while APAN supported real-time sharing of unclassified
    exercise material. APAN had relatively few user-access barriers, and its request-and-approval process was quicker than
    that of other networks. SIPRNet, NIPRNet, and JWICS were limited to U.S. personnel and offered less interoperability with
    participating countries.
  question: What should the EPA do in designating communications environments for shared multinational use during PANAMAX
    24?
  options:
    O1:
      do: The EPA declines shared multinational use and relies on U.S.-only networks for communications among U.S. personnel.
      move: act
      irreversible: false
    O2:
      do: The EPA authorizes CENTRIXS-IANTN and APAN for shared multinational use and retains U.S.-only networks for U.S.
        information.
      move: act
      irreversible: false
    O3:
      do: The EPA authorizes APAN alone for shared multinational use and retains U.S.-only networks for U.S. information.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The EPA determined communications network requirements for participating service component commands.
  - id: F2
    kind: capability
    status: confirmed
    fact: IANTN served as a shared communication environment for joint force service component commands, including vetted
      personnel from participating nations.
  - id: F3
    kind: capability
    status: confirmed
    fact: APAN supported real-time sharing of unclassified exercise products, including exercise support and simulation data.
  - id: F4
    kind: capability
    status: confirmed
    fact: APAN eliminated most user-access issues, and its request-and-approval process was quicker than that of other networks.
  - id: F5
    kind: situation
    status: confirmed
    fact: SIPRNet, NIPRNet, and JWICS were available only to U.S. personnel on a limited basis, resulting in a lower level
      of interoperability with participating countries.
  - id: F6
    kind: situation
    status: confirmed
    fact: NIPRNet carried controlled unclassified information, SIPRNet carried secret information, and JWICS carried top-secret
      information.
  - id: F7
    kind: situation
    status: confirmed
    fact: Improving interoperability with partners was a major focus of the exercise.
  - id: F8
    kind: situation
    status: confirmed
    fact: The networks limited to U.S. participants were used to test and maintain command-and-control services as part of
      standard reporting requirements.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: IANTN provided a shared environment for service-component commands and vetted partner personnel, directly supporting
      the exercise’s interoperability focus.
  - id: C2
    facts:
    - F3
    - F4
    - F7
    equity: tempo
    favors:
    - O2
    - O3
    weight: strong
    why: APAN enabled real-time sharing of unclassified exercise material, with relatively few access issues and a quicker
      request-and-approval process.
  - id: C3
    facts:
    - F5
    - F7
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: strong
    why: Relying only on U.S.-limited networks would leave participating countries with less interoperability, contrary to
      a major exercise focus.
  - id: C4
    facts:
    - F6
    - F8
    equity: classification_integrity
    favors:
    - O2
    - O3
    weight: weak
    why: The U.S.-limited networks carried information at different classification levels and continued to serve command-and-control
      testing and standard reporting; shared multinational use need not displace those networks.
  reasoning:
    read: The decision is about providing communications that enable partner participation, not replacing every network with
      one shared environment. The trap is treating APAN’s quick access as a complete substitute for IANTN’s shared role, or
      treating U.S.-only networks as adequate for the exercise’s interoperability purpose.
    weighing: The interoperability focus and IANTN’s shared role support including it in the multinational environment {C1}.
      APAN adds real-time unclassified collaboration with fewer access barriers {C2}. U.S.-only networks offered less interoperability
      {C3}, but their distinct information and reporting functions remain relevant {C4}. Together, these reasons support designating
      both IANTN and APAN while retaining the U.S.-limited networks for their stated uses; the balance depends on the exercise’s
      partner-interoperability purpose and the different roles described for these environments.
    tradecraft: 'Document the distinct purpose of each designation: IANTN for the shared joint-force environment, APAN for
      real-time unclassified exercise material, and the U.S.-limited networks for their stated U.S. information and reporting
      functions. Keep the decision at the requirements level and confirm that the designated shared uses match participating
      commands’ needs.'
    uncertainty: The stated reasons do not compare the networks’ full security properties or specify all partner-access requirements.
      They establish that IANTN included vetted partner personnel and that APAN shared unclassified material, but do not support
      broader conclusions about either network’s security.
    handoff: The EPA is the identified authority for determining communications requirements. The stated decision does not
      require referral; confirming component-command needs and the intended participation of vetted partners would help implement
      the designation faithfully.
    tempting_wrong:
      option: O3
      pull: APAN was accessible with relatively few user-access issues and had a quicker request-and-approval process.
      why_wrong: Those advantages support APAN but do not replace IANTN’s separately stated role as a shared environment for
        service-component commands and vetted partner personnel.
    rejected:
      O1: It was not chosen because relying on U.S.-only networks would provide less interoperability despite the exercise’s
        major focus on improving it.
      O3: It was not chosen because APAN’s unclassified collaboration role did not displace IANTN’s shared joint-force role.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: IANTN could no longer provide a shared environment for participating partner personnel, while APAN remained available
        for the stated unclassified sharing purpose.
      then: O3
      why: Without IANTN’s shared role, the stated basis for choosing it alongside APAN would be absent, while APAN’s unclassified
        sharing function would remain.
    - id: flip2
      if: Improving interoperability with participating countries were no longer a major purpose of the exercise.
      then: O1
      why: The source’s central stated reason for shared multinational environments would no longer apply, making reliance
        on U.S.-only networks more plausible.
    would_not_change:
    - id: noflip1
      if: APAN continued to have fewer access barriers and a quicker request-and-approval process.
      why: Those advantages support APAN but do not, by themselves, remove IANTN’s distinct shared role for the joint force
        and vetted partner personnel.
    - id: noflip2
      if: U.S.-limited networks remained necessary for the information classifications and reporting functions described.
      why: That supports retaining those networks for U.S. uses, but does not negate the stated case for shared multinational
        environments.
    watch_for:
    - id: watch1
      what: Whether participating partners remain within IANTN’s stated vetted-personnel scope.
      favors:
      - O2
      why: That condition bears on whether IANTN can continue serving its described shared role.
  lesson: When interoperability is a central purpose, select shared environments that serve the distinct collaboration needs
    described rather than assuming one accessible network can do every job. Retain separate U.S.-limited networks where their
    information and reporting functions remain distinct.
  limits: This reasoning applies to the communications roles and exercise purposes stated here; it does not establish a general
    security ranking of the networks. It also does not resolve access or classification questions beyond those described.
