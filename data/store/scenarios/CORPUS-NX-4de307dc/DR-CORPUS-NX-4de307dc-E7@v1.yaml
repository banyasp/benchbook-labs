case:
  id: DR-CORPUS-NX-4de307dc-E7@v1
  title: Trust and Partner Interoperability
  status: draft
  setting: SOUTHCOM, PMX24, MNFS headquarters network planning.
  decider: The SOUTHCOM Information Assurance team
  agent: The SOUTHCOM Information Assurance team
  agent_role: decide
  situation: For PMX24, the SOUTHCOM Information Assurance team must choose a trust posture between the DJC2 system and the
    IANTN network supporting the MNFS headquarters. The prior network vulnerability assessment identified serious management
    and oversight concerns. DJC2 is designed to integrate with other communications networks using two-way trust, which supports
    delivery of its services. The choice is between that designed approach and a more restrictive one-way trust relationship.
    The team must weigh the security concerns against the need to integrate partners and provide timely access.
  question: What should the SOUTHCOM Information Assurance team do about the trust relationship between DJC2 and IANTN for
    PMX24?
  options:
    O1:
      do: The SOUTHCOM Information Assurance team authorizes two-way trust between DJC2 and IANTN for MNFS.
      move: act
      irreversible: false
    O2:
      do: The SOUTHCOM Information Assurance team declines two-way trust and retains one-way trust between IANTN and DJC2
        for MNFS.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The PMX22 network vulnerability assessment identified numerous CENTRIXS-IANTN vulnerabilities attributed to inadequate
      network management and oversight.
  - id: F2
    kind: situation
    status: assessed
    fact: SOUTHCOM considered the vulnerabilities severe enough to change the IT support contract for PMX24.
  - id: F3
    kind: situation
    status: assessed
    fact: The newly established IT support contractor and the parties responsible for overseeing its actions faced uncertainty
      over contract interpretation and oversight authority.
  - id: F4
    kind: capability
    status: confirmed
    fact: DJC2 is designed to integrate with tactical and strategic communications networks, and its standard design establishes
      two-way trust with a joining network.
  - id: F5
    kind: capability
    status: confirmed
    fact: Two-way trust is intended to enhance delivery of the DJC2 service suite.
  - id: F6
    kind: situation
    status: assessed
    fact: Reducing delays and complexity when integrating multinational partners into the MNFS is considered critical.
  - id: F7
    kind: capability
    status: assessed
    fact: Using credentials from a program-of-record system such as DJC2 can reduce the time needed to establish an interoperable
      command post in time-sensitive situations.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The assessment identified numerous vulnerabilities linked to inadequate network management and oversight, and SOUTHCOM
      judged them serious enough to change the support contract. The recent, serious security concern supported a restrictive
      trust posture.
  - id: C2
    facts:
    - F3
    equity: control_integrity
    favors:
    - O2
    weight: weak
    why: Uncertainty about contract interpretation and who could oversee the contractor left unresolved questions about accountability
      and control, reinforcing caution while the new support arrangement was being established.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Two-way trust is the designed approach and is intended to improve delivery of DJC2 services, so declining it sacrifices
      some of the system's intended integration and functionality.
  - id: C4
    facts:
    - F6
    - F7
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Reducing delay and complexity for multinational partners is considered critical, and use of DJC2 credentials can
      shorten the time needed to establish an interoperable command post.
  reasoning:
    read: This is a security-versus-interoperability judgment, not an automatic choice between a system's standard design
      and an exception. The serious management and oversight vulnerabilities made the security concern immediate; the more
      restrictive choice, however, hindered partner integration and timely access. The trap is treating either the designed
      two-way approach or the prior assessment as conclusive by itself.
    weighing: The SOUTHCOM Information Assurance team selected one-way trust with the PMX22 vulnerabilities still fresh. That
      choice gave greater weight to the identified security and oversight concerns {C1} and the uncertainty surrounding accountability
      for the new support arrangement {C2}. The team recognized the service and integration benefits of two-way trust {C3},
      including reduced delay for partners {C4}, but those benefits did not outweigh the security concern for PMX24. The balance
      could change if confidence in oversight and security improves while the need for timely integration remains.
    tradecraft: Record the security rationale, the interoperability costs accepted, and the conditions for reconsidering the
      posture. Review those conditions jointly with the responsible communications and command authorities rather than allowing
      the exercise decision to become an unexamined standing assumption.
    uncertainty: The assessment identified serious vulnerabilities, but no breach is established here. PMX24 did not experience
      the potential loss of the common operational picture during its short duration; longer missions nevertheless carried
      that risk.
    handoff: 'The Information Assurance team should involve JCSE and the combatant command in any reconsideration: an integrated
      solution between them is necessary to establish trust relationships between accredited nodes.'
    tempting_wrong:
      option: O1
      pull: Two-way trust matches DJC2's design and supports the service delivery, partner integration, and timely access
        the MNFS needs.
      why_wrong: Those are substantial benefits, but adopting the designed approach without resolving the serious vulnerabilities
        and oversight concerns would give interoperability priority before the security concern had been addressed.
    rejected:
      O1: The team did not authorize the designed two-way trust for PMX24 because the serious, recent vulnerability and oversight
        concerns outweighed its acknowledged integration and access benefits.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The security and oversight concerns are demonstrably addressed and the responsible command and communications authorities
        establish a sufficiently assured basis for interoperable trust.
      then: O1
      why: With the principal reason for restricting trust reduced, the stated benefits of integration and timely partner
        access could carry greater weight.
    would_not_change:
    - id: noflip1
      if: The only additional argument is that DJC2 is designed to use two-way trust.
      why: The design benefit was recognized, but by itself it does not resolve the serious vulnerability and oversight concerns
        that drove the PMX24 choice.
    watch_for:
    - id: watch1
      what: Whether oversight authority and responsibility for the support arrangement become clear and effective.
      favors:
      - O1
      why: Improved accountability could reduce a concern that reinforced the restrictive choice and support reassessing the
        interoperability benefits.
  lesson: A restrictive security posture can be justified when serious vulnerabilities and unresolved oversight concerns are
    present, even if it imposes real integration and timing costs. Reassess that posture when the underlying concerns change,
    weighing security against the operational value of timely partner access.
  limits: This reasoning applies to the PMX24 trust decision in light of the vulnerabilities and oversight concerns described.
    It does not establish that one-way trust is always safer or that two-way trust is appropriate without an assessment of
    current security and oversight conditions.
