case:
  id: DR-CORPUS-NX-5e6b0201-E1@v1
  title: Opening-Campaign Air-Defense Decision
  status: draft
  setting: Azerbaijan and Armenia, October 2020, military campaign.
  decider: Azerbaijan
  agent: Azerbaijan
  agent_role: decide
  situation: At the opening of the October 2020 fighting, Azerbaijan faced Armenian air defenses consisting mostly of Soviet-era
    equipment designed for manned aircraft. Armenia had a limited number of more advanced air-defense systems, which were
    effective against uncrewed aircraft but had not yet been deployed. Those advanced systems were also vulnerable to attack.
    The decision was whether to open the campaign with attacks on Armenian air-defense capabilities, spare those capabilities,
    or choose another opening course, with reducing the air-defense threat linked to achieving local air superiority.
  question: 'What should Azerbaijan do at the opening of the campaign: attack Armenian air-defense capabilities, spare them,
    or choose another opening course?'
  options:
    O1:
      do: Azerbaijan should open the campaign by attacking Armenian air-defense capabilities.
      move: act
      irreversible: true
    O2:
      do: Azerbaijan should open the campaign with a different military course against Armenian forces.
      move: act
      irreversible: true
    O3:
      do: Azerbaijan should open the campaign by sparing Armenian air-defense capabilities.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: Most Armenian air-defense equipment was Soviet-era.
  - id: F2
    kind: capability
    status: confirmed
    fact: The Soviet-era equipment was designed for manned aircraft.
  - id: F3
    kind: capability
    status: confirmed
    fact: Armenia had a limited number of more advanced air-defense systems.
  - id: F4
    kind: capability
    status: confirmed
    fact: The more advanced Armenian air-defense systems were effective against uncrewed aircraft.
  - id: F5
    kind: situation
    status: confirmed
    fact: The more advanced Armenian air-defense systems were deployed later in the conflict.
  - id: F6
    kind: capability
    status: confirmed
    fact: The more advanced Armenian air-defense systems were vulnerable to attack.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The opening rationale was to reduce the air-defense threat. Most defenses were designed for manned aircraft, while
      the limited systems effective against uncrewed aircraft were deployed later.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The advanced defenses could threaten the campaign's air-superiority objective, but they were not yet deployed and
      were vulnerable to attack. Azerbaijan established local air superiority within a few days, supporting subsequent ground
      operations.
  - id: C3
    facts:
    - F1
    - F2
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Effective use of air and ground capabilities with fires minimized contact by maneuver forces until conditions were
      set for a successful attack. This supports reducing exposure of one's own forces, although personnel safety was not
      expressly identified as the reason.
  reasoning:
    read: 'The situation was not simply that most Armenian defenses were older: a limited number of more capable systems could
      threaten uncrewed aircraft, but had not yet been deployed. The trap is to treat the older equipment''s design as proof
      that no meaningful air-defense threat remained.'
    weighing: 'Azerbaijan''s operational rationale favors opening with attacks on air-defense capabilities: reduce that threat,
      achieve local air superiority, and thereby enable subsequent operations. Local air superiority was established within
      a few days and supported the ground campaign; effective use of air and ground capabilities with fires also minimized
      contact by maneuver forces. The balance depends on the threat posed by the more capable systems and whether reducing
      it contributes to air superiority. Civilian effects and the authority or legal standard for the attacks are not addressed.'
    tradecraft: At the decision level, record the assessed air-defense threat, the expected contribution of the chosen course
      to the mission, and material uncertainties. Separately confirm the applicable command authority and legal requirements;
      neither is provided here.
    uncertainty: The account gives no detailed assessment of the probability or cost of alternative opening courses, and does
      not establish that the opening attacks alone produced local air superiority. Civilian harm and the legal basis for the
      attacks are also unaddressed.
    handoff: Azerbaijan is identified as the decision-maker, but no approval chain or legal adviser is specified. In an actual
      decision, confirm the competent command authority and obtain the required legal review rather than infer either from
      this account.
    tempting_wrong:
      option: O3
      pull: Most Armenian air-defense equipment was Soviet-era and designed for manned aircraft.
      why_wrong: That fact alone overlooks the limited, more advanced systems that were effective against uncrewed aircraft
        and the stated objective of reducing the air-defense threat.
    rejected:
      O2: A different opening course was not chosen because the operational rationale prioritized reducing the air-defense
        threat to establish local air superiority.
      O3: Sparing the air defenses was not chosen because their suppression was treated as part of achieving local air superiority.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A sound assessment showed that attacking the air defenses would not materially reduce the threat or contribute to
        local air superiority.
      then: O2
      why: The operational rationale for O1 would no longer support that choice.
    would_not_change:
    - id: noflip1
      if: Most defenses remained older systems, while the more capable systems were limited in number and not yet deployed.
      why: Those conditions are consistent with reducing the air-defense threat at the campaign's opening.
    watch_for:
    - id: watch1
      what: Whether the more capable air-defense systems are already deployed and materially alter the opening threat assessment.
      favors:
      - O2
      why: A changed threat picture could undermine the assumptions supporting the opening-course rationale and warrant reassessment.
  lesson: When an opening course is endorsed to reduce a threat and enable a mission objective, distinguish the predominant
    capability from limited but consequential exceptions. Reassess the choice if its operational rationale no longer holds,
    and do not treat an operational rationale as proof of legal authority.
  limits: This reasoning addresses the campaign-level rationale for the opening attacks, not the lawfulness or proportionality
    of any particular attack. It does not establish that the attacks were the only way to achieve air superiority or address
    civilian effects.
