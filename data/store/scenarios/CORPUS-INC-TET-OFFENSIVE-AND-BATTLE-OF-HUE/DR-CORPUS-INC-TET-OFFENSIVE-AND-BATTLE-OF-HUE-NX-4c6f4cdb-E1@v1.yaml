case:
  id: DR-CORPUS-INC-TET-OFFENSIVE-AND-BATTLE-OF-HUE-NX-4c6f4cdb-E1@v1
  title: Force Restrictions in Old Hue
  status: draft
  setting: Old Hue’s Citadel, February 1968, under senior political leadership
  decider: Senior political leaders
  agent: Senior political leaders
  agent_role: decide
  situation: South Vietnamese and U.S. forces were fighting in Old Hue’s Citadel, a historic urban area with narrow streets
    and fortified buildings. Rules of engagement restricted force to limit collateral damage in the historic area. Enemy positions
    in the Citadel remained a military objective. The restrictions constrained the use of force against located enemy positions,
    and American lives were lost under those constraints. Military leaders assessed that heavier force was needed to destroy
    entrenched positions and save soldiers’ lives.
  question: What should the senior political leaders do about restrictions on force in the Citadel?
  options:
    O1:
      do: Senior political leaders should prohibit expanded use of force in the Citadel.
      move: act
      irreversible: false
    O2:
      do: Senior political leaders should permit expanded use of force in the Citadel.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The fighting was taking place in the historic area of Old Hue.
  - id: F2
    kind: situation
    status: confirmed
    fact: The urban area had narrow streets and multiple fortified buildings.
  - id: F3
    kind: authority
    status: confirmed
    fact: Rules of engagement restricted force to limit collateral damage in the historic areas of Old Hue.
  - id: F4
    kind: situation
    status: confirmed
    fact: The NVA’s 6th Regiment in the Citadel was a focus of the fighting.
  - id: F5
    kind: capability
    status: confirmed
    fact: The restrictions limited American forces’ ability to use overwhelming force against located enemy positions.
  - id: F6
    kind: situation
    status: confirmed
    fact: American lives were lost as a result of the restrictions.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Military leaders assessed that heavier force was needed to destroy enemy positions in urban terrain and save American
      and South Vietnamese soldiers’ lives.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: third_party_harm
    favors:
    - O1
    weight: weak
    why: The restrictions were intended to limit collateral damage in a historic urban area, a real concern that weighs against
      expanding force.
  - id: C2
    facts:
    - F5
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The restrictions constrained the ability to use force against located positions, and American lives were lost as
      a result.
  - id: C3
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Citadel enemy positions remained a military objective, and military leaders assessed that heavier force was needed
      to destroy entrenched positions and save soldiers’ lives.
  reasoning:
    read: This is a conflict between limiting collateral damage in a historic urban area and enabling forces to address entrenched
      positions while protecting soldiers. The trap is treating the restrictions’ protective purpose as sufficient by itself,
      despite the reported constraint on operations and the loss of American lives.
    weighing: The collateral-damage concern supports retaining restrictions {C1}. But the source’s decisive reasons for lifting
      them were that the restrictions limited the use of force against located positions, American lives were lost under those
      constraints, and military leaders assessed heavier force was needed to destroy entrenched positions and save soldiers’
      lives {C2} {C3}. On that balance, permit expanded use of force. The judgment depends on the military assessment of necessity;
      the account does not establish that every restriction should be removed or that civilian-harm concerns cease to matter.
    tradecraft: Record the military assessment, the reason the restrictions impede the mission and force protection, the scope
      of the change, and the authority for it. Keep applicable legal and civilian-protection obligations in view; this decision
      is not itself a general waiver of them.
    uncertainty: The account does not specify the full scope of the restrictions lifted, the expected collateral risk of relaxing
      them, or the legal analysis and authority underlying the change.
    handoff: Senior political leaders decide, informed by military leaders’ assessment of operational necessity and legal
      advisers’ review of applicable authority and constraints.
    tempting_wrong:
      option: O1
      pull: Maintaining the restrictions appears to honor their purpose of limiting collateral damage in the historic area.
      why_wrong: It would leave in place constraints that the source connects to lost American lives, despite the military
        assessment that heavier force was needed to destroy entrenched positions and save soldiers.
    rejected:
      O1: The restrictions’ protective purpose did not outweigh the assessed need to destroy entrenched positions and save
        soldiers’ lives.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A revised military assessment finds that expanded force is no longer needed to destroy the entrenched positions
        or protect soldiers.
      then: O1
      why: The source’s stated reason for lifting the restrictions would no longer support the change.
    - id: flip2
      if: A legal review concludes that the proposed expansion would violate applicable law or binding authority.
      then: O1
      why: The source does not address such a legal barrier, but a decision cannot properly authorize force beyond lawful
        authority.
    would_not_change:
    - id: noflip1
      if: The area remains historic while the assessment that heavier force is needed to destroy the positions and save soldiers
        remains unchanged.
      why: The historic setting sustains the collateral-damage concern, but by itself does not displace the source’s stated
        reasons for lifting the restrictions.
    watch_for:
    - id: watch1
      what: Whether the restrictions continue to prevent the destruction of entrenched positions and expose soldiers to loss.
      favors:
      - O2
      why: The source identifies operational constraints and the loss of American lives as reasons for lifting the restrictions.
  lesson: In urban operations, restrictions intended to limit collateral damage must be weighed against their effect on the
    mission and the lives of personnel. When leaders assess that those restrictions prevent necessary action and cost lives,
    the source’s reasoning supports relaxing them while continuing to account for civilian harm and applicable legal limits.
  limits: This conclusion concerns the described decision in Old Hue and the assessment that heavier force was needed to destroy
    entrenched positions and save soldiers’ lives. It does not establish that restrictions should always be relaxed in urban
    combat, or resolve the legality or proportionality of any particular use of force.
