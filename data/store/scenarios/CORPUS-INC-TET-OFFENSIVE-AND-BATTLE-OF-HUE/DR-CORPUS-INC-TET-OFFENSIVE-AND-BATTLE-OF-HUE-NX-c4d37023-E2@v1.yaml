case:
  id: DR-CORPUS-INC-TET-OFFENSIVE-AND-BATTLE-OF-HUE-NX-c4d37023-E2@v1
  title: Resist or Surrender Under Attack
  status: draft
  setting: A house during an attack; the military group, date, and location are not specified.
  decider: The group collectively
  agent: The group collectively
  agent_role: decide
  situation: A group is in a house during an attack. Members anticipate danger, with one participant recalling a shared sense
    that it was coming. Their radio is brand new and unmarked, while one participant believes operating Marine units have
    battered, worn-out radios. The group passes around a bottle of Drambuie, and one participant thinks it could be their
    last drink. One participant is unsure about a commitment to fight to the death, while also feeling the group needs to
    remain united. The group faces whether to resist or surrender.
  question: What should the group do when deciding whether to resist or surrender under attack?
  options:
    O1:
      do: The group surrenders rather than resisting.
      move: act
      irreversible: false
    O2:
      do: The group resists rather than surrendering.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The group is in a house during an attack.
  - id: F2
    kind: intelligence
    status: assessed
    fact: A participant recalls that the group shared a sense that danger was imminent.
  - id: F3
    kind: capability
    status: assessed
    fact: The group's PRC-25 radio was brand new and unmarked.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A participant believed operating Marine units had battered, worn-out radios.
  - id: F5
    kind: situation
    status: assessed
    fact: The group passed around a bottle of Drambuie, and each member took a drink.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A participant thought the drink might be their last.
  - id: F7
    kind: situation
    status: assessed
    fact: A participant was unsure about a commitment to fight to the death.
  - id: F8
    kind: situation
    status: assessed
    fact: A participant felt the group needed to remain united.
  considerations:
  - id: C1
    facts:
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The stated reason for the pact was that the group had to remain united; this is the clearest reason the account gives
      for resisting together.
  - id: C2
    facts:
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: One participant was unsure about promising to fight to the death. That reservation weighs against treating the pact
      as an unqualified individual preference, even though the participant felt unity was necessary.
  - id: C3
    facts:
    - F2
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The shared sense of imminent danger and the thought that the drink might be their last make the risk to the group
      salient. The account presents those stakes but does not say they changed the group's decision.
  reasoning:
    read: The group faced an attack in a house and anticipated immediate danger. It chose collective resistance through a
      pact not to surrender and to fight to the death. The key tension is that unity was the stated reason, while one participant
      was personally unsure about that final commitment. The radio comparison is context, not a stated basis for the choice.
    weighing: The account's balance favors O2 because the group made the pact and the narrator says they had to remain united.
      The participant's reservation and the prospect of death show the cost of that choice, but the account does not say those
      concerns displaced the unity rationale. This balance depends on the group's expressed need to remain united; the excerpt
      supplies no assessment of surrender prospects or formal authority.
    tradecraft: At the decision level, distinguish collective resolve from each person's individual willingness, make room
      for reservations, and record the stated reason for the choice. Do not treat the radio comparison as proof of comparative
      capability or as an authority for the decision.
    uncertainty: The excerpt is brief and gives no details about whether surrender was feasible, what orders or authority
      applied, or whether the group considered alternatives. It supports the reported choice and its unity rationale, not
      a broader legal assessment.
    handoff: The account presents the decision as collective and identifies no formal command authority. In a real decision,
      confirm who holds decision authority and involve that authority if available; the excerpt does not establish the chain
      of command.
    tempting_wrong:
      option: O1
      pull: Surrender may seem preferable given the participant's doubt and the possibility that this could be the group's
        last drink.
      why_wrong: Those are genuine stakes, but the outcome described is the group's pact to resist, with unity given as its
        reason; the excerpt does not say the group chose surrender.
    rejected:
      O1: The group did not choose surrender; it made a pact to resist because it felt it had to remain united.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The group had reliable grounds to believe a safe, feasible surrender was available and that the immediate danger
        had passed.
      then: O1
      why: That would materially change the danger and stakes underlying the pact, so unity alone would not establish a reason
        to continue resisting.
    would_not_change:
    - id: noflip1
      if: The radio remained brand new and unmarked while other operating radios were believed to be worn.
      why: The account does not state that this comparison drove the choice; on its own it would not displace the stated reason
        of unity.
    watch_for:
    - id: watch1
      what: Whether the group has a viable surrender option and whether the pact is genuinely shared despite individual reservations.
      favors:
      - O1
      why: Either fact could weaken the inference that collective unity supports the reported commitment to resist.
  lesson: A group's stated need for unity can explain a collective choice to resist, but it does not erase individual hesitation
    or the risk of death. Separate the source's reason for the choice from facts that merely show its stakes, and do not infer
    authority or feasibility from context alone.
  limits: This reasoning describes the group's reported decision and does not establish that resistance was legally required,
    that surrender was unavailable, or that the choice was the safest course. It should not be generalized to situations with
    different authority, threat, or surrender conditions.
