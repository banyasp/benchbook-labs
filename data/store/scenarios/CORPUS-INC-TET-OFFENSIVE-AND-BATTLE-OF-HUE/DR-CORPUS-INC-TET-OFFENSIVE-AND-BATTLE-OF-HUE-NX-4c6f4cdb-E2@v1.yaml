case:
  id: DR-CORPUS-INC-TET-OFFENSIVE-AND-BATTLE-OF-HUE-NX-4c6f4cdb-E2@v1
  title: Reinforcing the Effort Northwest of Hue
  status: draft
  setting: Northwest of Hue, February 15–16, overall command of the battle
  decider: The overall commander
  agent: The overall commander
  agent_role: decide
  situation: By February 11, the NVA’s 4th Regiment was assessed as largely ineffective in New Hue. The battle’s focus had
    shifted to the NVA’s 6th Regiment inside the Citadel and the 5th Regiment northwest of the city. On February 15, the overall
    commander took command of the battle. He was dissatisfied with the lack of progress northwest of the city. The decision
    is whether to reinforce the effort against the 5th Regiment or continue with the forces already committed.
  question: 'What should the overall commander do about the effort against the NVA’s 5th Regiment northwest of the city: add
    reinforcements or continue with the forces already committed?'
  options:
    O1:
      do: The Commander reinforces the effort against the NVA’s 5th Regiment with additional forces.
      move: act
      irreversible: false
    O2:
      do: The Commander withholds additional forces and continues the effort against the NVA’s 5th Regiment.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: By February 11, the NVA’s 4th Regiment was largely ineffective in New Hue.
  - id: F2
    kind: situation
    status: confirmed
    fact: The battle’s focus included the NVA’s 6th Regiment within the Citadel.
  - id: F3
    kind: situation
    status: confirmed
    fact: The battle’s focus included the NVA’s 5th Regiment northwest of the city.
  - id: F4
    kind: authority
    status: confirmed
    fact: The overall commander took command of the battle on February 15.
  - id: F5
    kind: situation
    status: assessed
    fact: The commander was dissatisfied with the lack of progress northwest of the city.
  - id: F6
    kind: situation
    status: confirmed
    fact: The decision concerned whether to reinforce the effort against the 5th Regiment or continue with the forces already
      committed.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The commander was dissatisfied with the lack of progress northwest of the city, and the decision was whether to reinforce
      that effort. The account directly connects that dissatisfaction with adding forces.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The 5th Regiment northwest of the city remained one of the battle’s stated focuses. Reinforcing that effort was consistent
      with continuing to pursue that objective.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The battle’s focus included both the 6th Regiment in the Citadel and the 5th Regiment northwest of the city. The
      account’s choice to add forces to the latter indicates that maintaining both efforts, rather than dropping the northwest
      effort, informed the response.
  reasoning:
    read: 'The decision arose because progress against the 5th Regiment northwest of the city was unsatisfactory to the overall
      commander. The trap is to treat continuing with existing forces as a neutral default: the stated concern was that the
      effort was not progressing adequately.'
    weighing: 'The clearest stated reason favors reinforcement: the commander was dissatisfied with the lack of progress,
      and the account connects that dissatisfaction with adding forces. The 5th Regiment remained a battle focus alongside
      the 6th Regiment in the Citadel, which supports continuing the northwest effort. The balance depends chiefly on the
      assessment that progress was insufficient; the account gives no separate comparison of costs or force constraints.'
    tradecraft: Record the progress assessment and the reason for choosing reinforcement, then reassess whether the effort
      is making adequate progress. This is decision practice synthesized for the scenario, not a procedure stated in the account.
    uncertainty: The account does not explain the causes of the lack of progress or discuss the costs and constraints associated
      with adding forces. The reasoning therefore supports the recorded choice, but not a broader claim that reinforcement
      is always preferable when progress is slow.
    handoff: The overall commander held the decision in the account. It identifies no required referral or consultation, so
      none can be treated as a source-stated prerequisite.
    tempting_wrong:
      option: O2
      pull: Continuing with the forces already committed could seem like the less disruptive course.
      why_wrong: That rationale is not given in the account and does not address the commander’s stated dissatisfaction with
        the lack of progress, which is the reason connected to adding forces.
    rejected:
      O2: The overall commander did not continue with only the forces already committed; the account connects dissatisfaction
        with progress to the decision to add reinforcements.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander assessed that progress northwest of the city was adequate rather than insufficient.
      then: O2
      why: The lack of progress is the account’s stated reason for adding forces; without that concern, the stated basis for
        reinforcement would be absent.
    would_not_change:
    - id: noflip1
      if: The 6th Regiment inside the Citadel remained a focus at the same time.
      why: The account identifies both regiments as focuses while describing the decision to add forces to the effort against
        the 5th Regiment.
    watch_for:
    - id: watch1
      what: Whether the commander continues to assess progress northwest of the city as inadequate.
      favors:
      - O1
      why: The account links dissatisfaction with the lack of progress to adding reinforcements.
  lesson: When the responsible commander assesses that a continuing effort is not making adequate progress, reinforcement
    may be warranted to pursue the mission objective. Make the decision turn on that assessment, while recognizing that a
    different assessment or material resource constraints could change the balance.
  limits: This reasoning applies to the decision about reinforcing the effort against the 5th Regiment, not to the conduct
    of the ensuing fighting. The account does not provide a general rule about force allocation or a full accounting of the
    costs and risks of reinforcement.
