case:
  id: DR-CORPUS-INC-TET-OFFENSIVE-AND-BATTLE-OF-HUE-NS-be8010b5-E17@v1
  title: Countryside Operations or Capital Defense
  status: draft
  setting: Saigon, January 1968, MACV headquarters in Vietnam.
  decider: The MACV commander
  agent: The MACV commander
  agent_role: decide
  situation: MACV headquarters had received indicators of shifts among Viet Cong units, but MACV and others had underestimated
    the scope and intensity of the coming offensive and remained generally unaware of its intentions and timing. A captured
    Viet Cong document called for a general offensive and uprising, including attacks on towns and cities. The MACV commander
    had received warnings of possible widespread pre-Tet action and had ordered heightened readiness. The III Corps commander
    raised alerts and assessed that local Viet Cong forces were more numerous and militarily significant than MACV believed.
    Planned countryside operations remained under consideration as concern grew about a major offensive and the security of
    Saigon.
  question: What should the MACV commander do with the planned countryside operations as indications of a major offensive
    and III Corps alerts raise concern for Saigon?
  options:
    O1:
      do: The MACV commander discontinues some planned countryside sweeps and repositions units around the capital.
      move: act
      irreversible: false
    O2:
      do: The MACV commander continues some planned countryside sweeps with assigned units.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: MACV and others greatly underestimated the scope and intensity of the coming offensive and generally lacked awareness
      of the enemy’s overall intentions and timing.
  - id: F2
    kind: intelligence
    status: assessed
    fact: By January 1968, captured documents and other indicators had persuaded MACV headquarters that major shifts were
      occurring among many Viet Cong units.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: A captured Viet Cong document called for a general offensive and uprising, including attacks on towns and cities.
  - id: F4
    kind: intelligence
    status: assessed
    fact: On January 25, the MACV commander assessed that the date appeared to be shaping up as a day for widespread pre-Tet
      offensive action.
  - id: F5
    kind: situation
    status: confirmed
    fact: On January 30, the MACV commander cancelled the Tet ceasefire for US troops and ordered intensified operations and
      maximum alert.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The III Corps commander raised alerts based in part on his professional belief that MACV was underestimating the
      number and military significance of local Viet Cong forces.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The III Corps commander and a former CORDS ambassador criticized CIA and MACV for failing to provide useful warning
      of the offensive’s magnitude or targets.
  - id: F8
    kind: situation
    status: confirmed
    fact: The III Corps commander had received orders for the 25th Division to conduct offensive sweeps in the countryside.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: MACV knew of major shifts and a call for attacks on towns and cities, yet lacked a reliable picture of the offensive’s
      scope, intentions, and timing. Continuing countryside operations without that picture risked leaving the capital less
      protected.
  - id: C2
    facts:
    - F6
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The III Corps commander raised alerts because he believed MACV was underestimating the number and military significance
      of local Viet Cong forces. That assessment supported reversing the planned countryside sweeps and increasing protection
      around Saigon.
  - id: C3
    facts:
    - F4
    - F5
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The MACV commander had assessed that widespread pre-Tet action might be imminent and had already ordered heightened
      readiness. Repositioning units around the capital was consistent with those precautions, which doubtless saved Saigon
      and the U.S. presence there from disaster.
  reasoning:
    read: 'This was a command-posture decision under serious intelligence uncertainty: indications of a broad offensive were
      accumulating, but MACV had underestimated its scale and lacked a clear account of its intentions and timing. The trap
      was to treat the absence of a complete warning as reassurance and continue the planned countryside posture despite the
      III Corps commander’s alert.'
    weighing: The captured document and other indicators raised concern, while the III Corps commander’s assessment challenged
      MACV’s estimate of local enemy strength. The precautionary reversal doubtless saved Saigon and the U.S. presence there
      from disaster. The balance favored O1 even without precise knowledge of timing or magnitude; it depended on the accumulating
      indicators and the corps commander’s alert, not on certainty about the offensive.
    tradecraft: Record the intelligence basis, the corps commander’s assessment, and the reason for changing the command posture.
      Keep the decision at the command level and reassess it as new information arrives.
    uncertainty: MACV remained generally unaware of the offensive’s overall intentions and timing and had greatly underestimated
      its scope and intensity. The precautionary move was taken despite that incomplete warning picture.
    handoff: The MACV commander should take account of the III Corps commander’s alert, since it was the stated basis for
      the reversal, while retaining responsibility for the command-level decision.
    tempting_wrong:
      option: O2
      pull: Continuing the planned countryside operations could seem reasonable because MACV lacked a dependable forecast
        of the offensive’s timing and scale.
      why_wrong: That uncertainty did not erase the captured warning, the other indicators of major shifts, or the III Corps
        commander’s concern that local enemy forces were being underestimated.
    rejected:
      O2: The MACV commander reversed the planned countryside sweeps because the accumulating indications and III Corps alerts
        made protection of Saigon the more prudent command posture.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible reassessment showed that the indicators did not signal a major offensive and that Saigon faced no elevated
        risk.
      then: O2
      why: Without the threat concern that justified the precaution, the basis for discontinuing the countryside sweeps would
        be substantially reduced.
    would_not_change:
    - id: noflip1
      if: MACV still lacked precise knowledge of the offensive’s timing or full scale.
      why: The precaution was taken despite that broader lack of awareness, on the basis of indicators and the corps commander’s
        alert.
    watch_for:
    - id: watch1
      what: Further credible indicators that enemy forces are shifting or that local Viet Cong strength has been underestimated.
      favors:
      - O1
      why: Such information would reinforce the concerns that led the MACV commander to reverse the planned posture.
  lesson: When warning is incomplete but multiple indicators and a responsible subordinate’s alert point to a serious threat,
    do not treat uncertainty as reassurance. Adjust the command posture to address the risk, and make the basis for that adjustment
    clear.
  limits: This reasoning concerns the January 1968 command-posture choice described here; it does not establish that repositioning
    is always preferable to continuing planned operations. The conclusion depends on the specific indicators, the III Corps
    commander’s alert, and the risk to Saigon.
