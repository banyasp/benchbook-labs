case:
  id: DR-CORPUS-NX-341a17bf-E3@v1
  title: Replacing Units After Accountability Failures
  status: draft
  setting: A United Nations peacekeeping operation where allegations arose, 2016, under the Security Council’s direction to
    the Secretary-General.
  decider: The Secretary-General
  agent: The Secretary-General
  agent_role: decide
  situation: Personnel of a troop- or police-contributing country are subject to allegations of sexual exploitation and abuse
    in a United Nations peacekeeping operation. The contributing country has not taken appropriate steps to investigate, has
    not held perpetrators accountable, or has not informed the Secretary-General of investigation progress or actions taken.
    The Secretary-General must decide what to do about the country’s units in the operation. Any replacement contributor must
    meet standards of conduct and discipline and appropriately address relevant allegations or confirmed acts.
  question: What should the Secretary-General do about the contributing country’s units in the United Nations peacekeeping
    operation when the required accountability steps or progress reporting have not occurred?
  options:
    O1:
      do: The Secretary-General requests investigation updates from the contributing country and defers replacing all its
        military and formed police units in the operation.
      move: ask
      irreversible: false
      to: the contributing country
    O2:
      do: The Secretary-General retains all military and formed police units of the contributing country in the operation
        without replacement by uniformed personnel from a different contributing country.
      move: act
      irreversible: false
    O3:
      do: The Secretary-General replaces all military and formed police units of the contributing country in the operation
        with uniformed personnel from a different contributing country.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Troop-contributing countries have primary responsibility to investigate allegations of sexual exploitation and abuse
      by their personnel.
  - id: F2
    kind: authority
    status: confirmed
    fact: Troop- and police-contributing countries are responsible for holding their personnel accountable, including through
      prosecution where appropriate, taking due process into account.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Security Council endorsed repatriating a particular military unit or formed police unit when there is credible
      evidence of widespread or systemic sexual exploitation and abuse by that unit.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Secretary-General is requested to replace all military units and/or formed police units of a contributing country
      when its personnel are subject to allegations and the country has not taken appropriate steps to investigate, or has
      not held perpetrators accountable or informed the Secretary-General of investigation progress or actions taken.
  - id: F5
    kind: authority
    status: confirmed
    fact: The replacement personnel are to come from a different troop- or police-contributing country, as applicable.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Secretary-General is requested to ensure that the replacement contributing country has upheld standards of conduct
      and discipline and appropriately addressed allegations against, or confirmed acts of, sexual exploitation and abuse
      by its personnel.
  - id: F7
    kind: situation
    status: confirmed
    fact: The allegations giving rise to the replacement decision arose in a United Nations peacekeeping operation.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: due_process
    favors:
    - O3
    weight: weak
    why: The contributing country has primary responsibility to investigate and to hold its personnel accountable, including
      prosecution where appropriate and with due process. Replacing its units responds to the stated failure of that accountability
      responsibility without itself deciding whether any individual is guilty.
  - id: C2
    facts:
    - F4
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: bar
    why: The Security Council requests replacement of all the contributing country’s military and/or formed police units in
      the operation when the specified investigation, accountability, or progress-reporting failures occur. The stated situation
      meets that trigger, so deferring replacement or retaining the units would not follow the requested course.
    rules_out:
    - O1
    - O2
  - id: C3
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Replacement is to be with uniformed personnel from a different contributing country, and the Secretary-General is
      to ensure that contributor has upheld conduct and discipline standards and appropriately addressed relevant allegations
      or confirmed acts.
  - id: C4
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: The resolution separately endorses repatriation of a particular unit when there is credible evidence of widespread
      or systemic abuse by that unit. That distinct condition should not be treated as an additional prerequisite to the country-wide
      replacement request triggered by the contributing country’s accountability failures.
  reasoning:
    read: This is a decision about the contributing country’s response to allegations, not a finding that the allegations
      are proven or a determination of individual guilt. The key trap is to confuse the separate widespread-or-systemic-evidence
      condition for repatriating a particular unit with the country-level replacement trigger based on failures to investigate,
      hold perpetrators accountable, or report progress.
    weighing: The stated failures activate the Security Council’s request to replace all the country’s military and/or formed
      police units, making {C2} decisive. The country’s responsibility to investigate and ensure accountability, with due
      process, gives the replacement decision its accountability context {C1}; the replacement contributor must also satisfy
      the conduct and discipline conditions {C3}. The separate unit-specific condition does not add a prerequisite to the
      country-level trigger {C4}.
    tradecraft: Record which stated accountability or reporting failure triggers the decision and the authority for replacement.
      Ensure the replacement contributor meets the stated conduct and discipline requirements and appropriately addressed
      relevant allegations or confirmed acts.
    uncertainty: The resolution does not define in these passages what counts as appropriate investigative steps or adequate
      progress reporting. The fixed situation, however, stipulates that the relevant steps or reporting have not occurred;
      the allegations themselves should not be treated as findings of guilt.
    handoff: The Secretary-General decides under the Security Council’s direction. The resolution passages identify no additional
      decision-maker whose approval is required.
    tempting_wrong:
      option: O1
      pull: Requesting updates and deferring replacement may seem like a less disruptive way to allow the contributing country
        to respond.
      why_wrong: The stated trigger includes failure to inform the Secretary-General of investigation progress or actions
        taken, and the Council requests replacement when the specified failures occur rather than deferral.
    rejected:
      O1: The resolution requests replacement when the stated accountability or reporting failures occur, rather than deferring
        replacement to seek updates.
      O2: Retaining all the country’s units would not carry out the replacement requested for the stipulated failures.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The contributing country had taken appropriate steps to investigate and had held perpetrators accountable or informed
        the Secretary-General of investigation progress or actions taken, so that the stipulated replacement trigger was no
        longer present.
      then: O1
      why: The country-level replacement request is tied to the specified failures; if those failures were no longer present,
        this basis for immediate replacement would no longer apply. Seeking or reviewing updates would then be a plausible
        course, though the resolution does not prescribe what follows compliance.
    would_not_change:
    - id: noflip1
      if: There were no credible evidence of widespread or systemic abuse by a particular unit.
      why: That would affect the separate basis for repatriating a particular unit, but would not remove the stipulated country-level
        accountability or reporting failure that triggers replacement under the other request.
    watch_for:
    - id: watch1
      what: Whether the proposed replacement contributor has upheld standards of conduct and discipline and appropriately
        addressed relevant allegations or confirmed acts.
      favors:
      - O3
      why: The resolution makes these standards part of the Secretary-General’s responsibility when arranging replacement.
  lesson: When the applicable authority ties replacement to a contributing country’s failure to investigate, ensure accountability,
    or report progress, apply that trigger rather than treating replacement as optional pending further updates. Keep the
    country-level accountability trigger distinct from any separate threshold for repatriating a particular unit, and ensure
    the replacement contributor meets the stated standards.
  limits: This reasoning concerns the specific replacement request in Security Council Resolution 2272 (2016) and the stipulated
    failures in this scenario. It does not establish individual guilt, require prosecution in every case, or mean that allegations
    alone always require country-wide replacement.
