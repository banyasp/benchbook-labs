case:
  id: DR-CORPUS-NX-e6c14241-E3@v1
  title: Command Decision Timing Under Uncertainty
  status: draft
  setting: Alliance command at any level during operations; no specific place or time is stated.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: The Commander faces a choice about when to act. The available understanding may be incomplete and imperfect,
    even as information becomes more available and faster to obtain. Waiting for more information can give unsupportive audiences
    more time. The Commander must use judgment to assess whether and when to act.
  question: What should the Commander do about whether to act promptly or wait for more information?
  options:
    O1:
      do: The Commander acts promptly on the available understanding.
      move: act
      irreversible: false
    O2:
      do: The Commander abstains from prompt action pending more information.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Timely and effective decision-making is required at all levels.
  - id: F2
    kind: authority
    status: confirmed
    fact: Mission command empowers subordinate commanders, who are best placed to make decisions, with authority to do so.
  - id: F3
    kind: situation
    status: confirmed
    fact: Timely decisions allow Alliance forces to gain and maintain the initiative.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Commanders may need to decide on incomplete and imperfect understanding.
  - id: F5
    kind: capability
    status: confirmed
    fact: Information is increasingly available and can be obtained more quickly.
  - id: F6
    kind: situation
    status: assessed
    fact: Waiting can give unsupportive audiences more time.
  - id: F7
    kind: situation
    status: assessed
    fact: It is often less risky to act quickly than to wait for more information.
  - id: F8
    kind: capability
    status: confirmed
    fact: Good judgment is required to decide when to act or not act.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Timely and effective decisions are required, and timely decisions allow Alliance forces to gain and maintain the
      initiative.
  - id: C2
    facts:
    - F2
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: weak
    why: Mission command empowers commanders best placed to decide with the authority to do so; this supports decision-making
      at the appropriate level but does not by itself determine whether to act or wait.
  - id: C3
    facts:
    - F4
    - F5
    - F8
    equity: tempo
    favors:
    - O1
    weight: weak
    why: Even as information becomes more available and faster to obtain, commanders may still have to decide on incomplete
      and imperfect understanding; judgment, not waiting for perfect information, is required.
  - id: C4
    facts:
    - F6
    - F7
    - F8
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The doctrine's general assessment is that acting quickly is often less risky than waiting for more information when
      delay gives unsupportive audiences more time, while leaving the timing decision to good judgment.
  reasoning:
    read: 'This is a timing decision under uncertainty, not a choice between acting with certainty and acting without it:
      understanding may remain incomplete even as information becomes faster and more available. The trap is to treat waiting
      for more information as automatically safer, despite the possible cost of giving unsupportive audiences more time.'
    weighing: The balance favors prompt action because timeliness preserves initiative and the doctrine says quick action
      is often less risky than waiting in these circumstances {C1} {C4}. The Commander still must judge whether the available
      understanding is sufficient and whether waiting is the right choice in the particular situation {C3} {C2}; the recommendation
      is general, not an unconditional rule to act immediately.
    tradecraft: Assess the understanding currently available and whether further delay is likely to improve the decision enough
      to justify its cost. Decide promptly whether to act or wait, and record the basis for the timing decision, the material
      uncertainty, and why any delay is warranted or not.
    uncertainty: Understanding may be incomplete and imperfect, and good judgment is required to decide when to act or not
      act. Faster access to information does not remove that uncertainty or supply a fixed decision threshold.
    handoff: The Commander should decide at the level empowered by mission command, since subordinate commanders are best
      placed to make decisions. The source does not require referral to another authority; any further involvement should
      follow the authority actually held.
    tempting_wrong:
      option: O2
      pull: Waiting may feel safer because additional information could improve understanding.
      why_wrong: That treats more information as an automatic reason to delay, overlooking the doctrine's warning that waiting
        can give unsupportive audiences more time and is often riskier than acting quickly.
    rejected:
      O2: The doctrine's general recommendation favors acting promptly because waiting for more information can increase risk
        and give unsupportive audiences more time, while still leaving the timing judgment to the Commander.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Waiting would not give unsupportive audiences more time, and the Commander reasonably judges that the additional
        information is likely to improve the decision enough to justify delay.
      then: O2
      why: The stated reason favoring prompt action would be reduced, and the source leaves room for judgment that waiting
        is the right choice.
    - id: flip2
      if: The Commander judges that acting on the current incomplete understanding would be less prudent than waiting in the
        circumstances.
      then: O2
      why: The doctrine calls for judgment about whether and when to act, rather than requiring action in every case.
    would_not_change:
    - id: noflip1
      if: Information is becoming more available and faster to obtain, but the Commander still faces incomplete and imperfect
        understanding.
      why: Greater availability and speed of information do not, by themselves, eliminate the need for judgment or establish
        that waiting is preferable.
    watch_for:
    - id: watch1
      what: Whether delay is giving unsupportive audiences more time.
      favors:
      - O1
      why: That is the specific circumstance the doctrine identifies as strengthening the case for acting quickly.
  lesson: 'Do not equate waiting for more information with safety: commanders may need to decide on incomplete understanding,
    and delay can carry its own risk. Generally favor prompt action when delay gives unsupportive audiences more time, but
    use judgment to determine whether and when to act.'
  limits: This recommendation concerns command timing under uncertainty and does not establish an unconditional duty to act
    immediately. It does not determine operational methods or replace any other applicable authority or decision standard.
