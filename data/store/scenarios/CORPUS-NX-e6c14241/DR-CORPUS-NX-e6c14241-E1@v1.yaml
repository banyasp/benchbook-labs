case:
  id: DR-CORPUS-NX-e6c14241-E1@v1
  title: Cyber Activity and the Article 5 Threshold
  status: draft
  setting: Cyberspace under the North Atlantic Treaty; the source gives no incident date.
  decider: The Alliance
  agent: The Alliance
  agent_role: decide
  situation: Campaigns under the provision can vary in character and intensity as threats evolve. Cyber activities would not
    normally constitute an attack. They could rise to that level if their effects become comparable to those of a conventional
    attack. The decision point is whether the cyber activity remains below the collective-defence threshold or is treated
    as an attack that may trigger an Article 5 response. Article 5 addresses an armed attack against one or more parties in
    Europe or North America as an attack against them all. It provides for each party to assist the party or parties attacked
    through action it deems necessary, individually and with the other parties. The provision does not specify what assistance
    members must provide in a particular incident.
  question: What should the Alliance decide about classifying cyber activity as an attack that may trigger an Article 5 response?
  options:
    O1:
      do: The Alliance rejects the attack classification when the cyber activity's effects are not comparable to a conventional
        attack and keeps it below the Article 5 threshold.
      move: act
      irreversible: false
    O2:
      do: The Alliance recognizes the cyber activity as an attack when its effects are comparable to a conventional attack
        and treats it as a potential basis for an Article 5 response.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Campaigns under the provision can vary in character and intensity depending on the evolving character of the threats.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Alliance agreed that cyberspace activities would not normally constitute an attack.
  - id: F3
    kind: situation
    status: confirmed
    fact: Cyber activities could rise to the level of an attack if their effects become comparable to those of a conventional
      attack.
  - id: F4
    kind: authority
    status: confirmed
    fact: A cyber activity reaching the level of an attack could trigger an Article 5 response.
  - id: F5
    kind: authority
    status: confirmed
    fact: Article 5 treats an armed attack against one or more parties in Europe or North America as an attack against them
      all.
  - id: F6
    kind: authority
    status: confirmed
    fact: If such an armed attack occurs, each party agrees to assist the party or parties attacked.
  - id: F7
    kind: authority
    status: confirmed
    fact: Each party's assistance may consist of such action as it deems necessary, including the use of armed force, to restore
      and maintain the security of the North Atlantic area.
  - id: F8
    kind: authority
    status: confirmed
    fact: Each party may act individually and in concert with the other parties.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The Alliance's stated default is that cyberspace activities would not normally constitute an attack, against a background
      of campaigns whose character and intensity can evolve.
  - id: C2
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The stated exception is effects comparable to those of a conventional attack; cyber activity reaching that level
      could trigger an Article 5 response.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    - F8
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: Article 5 treats an armed attack on one or more parties in Europe or North America as an attack against them all
      and provides for assistance, while leaving each party to determine the action it deems necessary.
  reasoning:
    read: The situation is a conditional classification decision, not a rule that cyber activity is always an attack or never
      an attack. The trap is to let the ordinary-case default in {F2} eclipse the stated exception in {F3}, or to treat classification
      as already deciding what assistance each party must provide.
    weighing: The ordinary default supports keeping activity below the threshold, but the Alliance's stated reason for recognizing
      an exception is comparable effects. When that condition is met, the activity may be treated as an attack and as a potential
      basis for Article 5; Article 5 supplies the collective-defence framework but leaves the particular assistance to each
      party's judgment. The balance therefore depends on whether effects are comparable to those of a conventional attack.
    tradecraft: For the decision record, state the effects-based comparison and the resulting threshold classification separately
      from any later decision about assistance. Do not infer from classification alone what particular assistance members
      must provide.
    uncertainty: The source gives no incident-specific effects, measurement method, or detailed test for comparability. It
      also does not prescribe the assistance required in a particular incident.
    handoff: The Alliance is the decider in this frame. The source identifies no required referral or separate approval process,
      so no additional decision-maker can be specified from these reasons.
    tempting_wrong:
      option: O1
      pull: Cyber activities would not normally constitute an attack.
      why_wrong: 'That default is not categorical: it overlooks the Alliance''s stated exception for effects comparable to
        those of a conventional attack.'
    rejected:
      O1: The Alliance's ordinary-case default does not justify rejecting attack classification when the stated comparable-effects
        threshold is met.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The cyber activity's effects are not comparable to those of a conventional attack.
      then: O1
      why: The source's default is that cyberspace activities would not normally constitute an attack, and its stated exception
        depends on comparable effects.
    would_not_change:
    - id: noflip1
      if: The campaign's character or intensity changes, but its effects still do not become comparable to those of a conventional
        attack.
      why: Variation as threats evolve does not replace the stated effects-based threshold.
    watch_for:
    - id: watch1
      what: Whether the cyber activity's effects become comparable to those of a conventional attack.
      favors:
      - O2
      why: The source identifies that comparison as the condition under which cyber activity could rise to attack level and
        trigger an Article 5 response.
  lesson: Do not treat cyber activity as an attack solely because it occurs in cyberspace, or rule it out solely because cyber
    activities do not normally constitute attacks. Apply the stated effects-based threshold; if effects are comparable to
    those of a conventional attack, the activity may trigger Article 5, without predetermining the assistance each party will
    provide.
  limits: This reasoning addresses only the source's general classification rule and Article 5 framework, not the facts of
    a particular incident. It supplies no detailed comparability test and does not determine particular assistance or operational
    measures.
