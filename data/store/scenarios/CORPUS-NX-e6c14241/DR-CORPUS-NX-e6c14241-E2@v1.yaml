case:
  id: DR-CORPUS-NX-e6c14241-E2@v1
  title: Response After Tailored Deterrence Fails
  status: draft
  setting: NATO, during a security campaign in the confrontation zone of the continuum of competition; time unspecified.
  decider: The Alliance
  agent: The Alliance
  agent_role: decide
  situation: In this doctrinal scenario, tailored deterrence has not contained an adversary’s malign activities. The Alliance
    faces a policy choice within the security campaign theme and the confrontation zone of the continuum of competition. The
    activities may involve threshold shifting and can undermine the security of NATO and its partners without seeking decisive
    conflict. The doctrine frames a response through crisis response operations, while allowing transition to the warfighting
    theme if necessary. The intensity or regularity of engagements, or the strategic narrative, distinguishes security activity
    from major crisis response activity under the warfighting theme.
  question: What should the Alliance do after tailored deterrence fails to contain the adversary’s malign activities?
  options:
    O1:
      do: The Alliance should impose costs on the aggressor and deny benefits from malign activities through crisis response
        operations.
      move: act
      irreversible: false
    O2:
      do: The Alliance should waive costs for the aggressor and permit benefits from malign activities through crisis response
        operations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The security campaign theme applies within the confrontation zone of the continuum of competition.
  - id: F2
    kind: situation
    status: confirmed
    fact: Sub-threshold activity is orchestrated by hostile state and non-state adversaries to undermine NATO’s and its partners’
      security, democratic integrity, public safety, reputation, or economic prosperity.
  - id: F3
    kind: situation
    status: confirmed
    fact: Sub-threshold activity does not seek decisive conflict but can alter the balance of advantage without the costs
      of armed conflict.
  - id: F4
    kind: capability
    status: confirmed
    fact: The security theme requires an agile and adaptable posture, rapid recognition and decision-making, and suitable
      policies, permissions, capabilities, and readiness.
  - id: F5
    kind: authority
    status: confirmed
    fact: If the adversary’s malign activities are not contained by tailored deterrence, the security theme calls for a response
      through crisis response operations.
  - id: F6
    kind: situation
    status: confirmed
    fact: The prescribed response imposes a cost on the aggressor and denies the aggressor any benefit from the malign activities.
  - id: F7
    kind: situation
    status: confirmed
    fact: The stated goal is to make clear where the threshold of armed conflict lies and that NATO has the understanding,
      will, and means to respond.
  - id: F8
    kind: authority
    status: confirmed
    fact: Transition to the warfighting theme is possible if necessary.
  - id: F9
    kind: situation
    status: confirmed
    fact: Successful deterrence requires a transition to peaceful forms of competition, campaign themes, and general deterrence.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Once tailored deterrence has failed to contain malign activity, the doctrine calls for crisis response operations
      that impose a cost and deny the aggressor a benefit.
  - id: C2
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The stated goal is to make clear where the armed-conflict threshold lies and that NATO has the understanding, will,
      and means to respond; imposing costs and denying benefits serves that goal.
  - id: C3
    facts:
    - F2
    - F3
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The doctrine treats sub-threshold activity as a means of undermining security and shifting the balance of advantage
      without decisive conflict, which supports responding rather than allowing the malign activity to yield benefits.
  reasoning:
    read: This is a security-campaign decision in the confrontation zone, after tailored deterrence has failed. The trap is
      to treat activity that does not seek decisive conflict as harmless or as a reason to accept its gains; the doctrine
      recognizes that such activity can still undermine security and alter the balance of advantage.
    weighing: The controlling consideration is the doctrine’s direction to respond through crisis response operations when
      tailored deterrence has not contained the activity {C1}. Imposing costs and denying benefits is also tied to the stated
      aim of clarifying the armed-conflict threshold and NATO’s resolve and capacity to respond {C2}. The sub-threshold character
      of the activity does not negate that rationale {C3}. The response must remain within the security theme’s distinction
      from major crisis response activity under the warfighting theme, with a transition to warfighting if necessary and,
      after successful deterrence, a transition back to peaceful forms of competition and general deterrence.
    tradecraft: At decision level, record the basis for finding that tailored deterrence failed, the applicable authority
      and permissions, the reason for selecting the doctrinal response, and the conditions that would require a change of
      campaign theme. Keep the decision and its rationale clear enough to support accountability and reassessment.
    uncertainty: The doctrine gives the policy direction and desired goal but does not provide case-specific evidence about
      the adversary, the expected effects of a response, or whether a transition to warfighting is necessary. Those questions
      must be assessed under the applicable authority and circumstances.
    handoff: The Alliance should act through its authorized decision authority and confirm that the applicable policies and
      permissions support the decision. The excerpt does not identify a particular office or prescribe a separate referral.
    tempting_wrong:
      option: O2
      pull: Waiving costs may appear to avoid further escalation when the adversary has not sought decisive conflict.
      why_wrong: The doctrine says that when tailored deterrence fails, the security theme responds by imposing a cost and
        denying benefits; accepting the gains would undermine the stated purpose of clarifying the threshold and NATO’s resolve.
    rejected:
      O2: It was not chosen because waiving costs and permitting benefits conflicts with the prescribed response after tailored
        deterrence fails.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A valid subsequent governing direction expressly superseded this doctrinal direction and required waiving costs
        and permitting benefits through crisis response operations.
      then: O2
      why: The outcome would then be governed by the superseding direction rather than the response prescribed in this excerpt.
    would_not_change:
    - id: noflip1
      if: The malign activity remains sub-threshold and does not seek decisive conflict.
      why: That feature alone does not remove the doctrine’s response direction once tailored deterrence has failed; the doctrine
        recognizes that such activity can still alter the balance of advantage.
    watch_for:
    - id: watch1
      what: Whether the situation makes transition to the warfighting theme necessary.
      favors:
      - O1
      why: The doctrine allows that transition if necessary, while retaining the cost-imposition and benefit-denial rationale
        for responding to malign activity.
  lesson: When tailored deterrence fails, the doctrine directs a response that imposes costs and denies benefits, including
    where malign activity remains below the threshold of decisive conflict. The response should clarify the threshold and
    NATO’s resolve while preserving the possibility of transition back to peaceful forms of competition when deterrence succeeds.
  limits: This reasoning applies to the security-campaign situation framed here and does not decide what response is appropriate
    in a different campaign theme or under a superseding authority. The excerpt does not specify case-specific assessments,
    response methods, or the circumstances that make a transition to warfighting necessary.
