case:
  id: DR-CORPUS-NX-4a01acd2-E1@v1
  title: CIA Participation in a Justice Department Intelligence Committee
  status: draft
  setting: Washington, D.C., May 1969; the CIA and Department of Justice.
  decider: The Director of Central Intelligence.
  agent: The Director of Central Intelligence
  agent_role: decide
  situation: Justice Department representatives were responsible for receiving and evaluating information used to advise the
    Attorney General and the President about when federal aid might be needed during civil disorders. The Intelligence Evaluation
    Committee was intended to coordinate and evaluate that information, but was relatively inactive. Justice Department representatives
    asked the CIA for advice on processing intelligence and requested CIA membership on the committee. The CIA liaison officer
    questioned formal participation, citing the Agency’s lack of domestic jurisdiction and the Director’s reluctance to have
    it appear deeply involved in domestic matters. The Director had also rejected an earlier suggestion to assign CIA personnel
    to a Justice Department unit because of the political implications. The liaison officer reported the meetings to the Director,
    who must decide whether the Agency should formally join the committee.
  question: What should the Director of Central Intelligence do about the Justice Department’s request for CIA membership
    on the Intelligence Evaluation Committee?
  options:
    O1:
      do: The Director denies CIA membership on the Intelligence Evaluation Committee.
      move: act
      irreversible: false
    O2:
      do: The Director permits CIA membership on the Intelligence Evaluation Committee.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Justice Department representatives said their units received and evaluated information used to advise the Attorney
      General and the President about when federal aid might be needed during civil disorders.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Intelligence Evaluation Committee was intended to coordinate and evaluate information and included representatives
      from the Justice Department, the Department of Defense, and the Secret Service; it was relatively inactive.
  - id: F3
    kind: situation
    status: confirmed
    fact: Justice Department representatives requested CIA advice on processing intelligence concerning civil disorders and
      asked the CIA liaison officer to join the Intelligence Evaluation Committee.
  - id: F4
    kind: authority
    status: assessed
    fact: The CIA liaison officer stated that the Agency had no domestic jurisdiction and that the Director was reluctant
      to have it appear deeply involved in domestic matters.
  - id: F5
    kind: situation
    status: confirmed
    fact: The CIA liaison officer reported the meetings with Justice Department representatives to the Director.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Director had rejected a suggestion to assign CIA personnel to a Justice Department unit because of the political
      implications.
  considerations:
  - id: C1
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The liaison officer identified the Agency's lack of domestic jurisdiction as a reason not to take a formal role in
      the committee.
  - id: C2
    facts:
    - F4
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The Director had rejected assigning CIA personnel to a Justice Department unit because of political implications,
      and was reluctant to have the Agency appear deeply involved in domestic matters.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The committee was relatively inactive, and Justice Department representatives requested CIA advice and membership;
      this is a reason for considering participation, but the Director did not treat it as outweighing the authority and political
      concerns.
  reasoning:
    read: This is an authority and institutional-boundary decision, not merely a request to help an inactive committee. The
      trap is to treat the committee's informality, or the possibility that CIA participation could remain hidden, as removing
      the Agency's domestic-jurisdiction and political-appearance concerns.
    weighing: The need for committee support favors participation only weakly {C3}. The officer's stated concern that the
      Agency lacked domestic jurisdiction, combined with the Director's concern about political implications and appearing
      deeply involved in domestic matters, weighs more heavily against a formal seat {C1} {C2}. The Director agreed with the
      officer and confirmed that CIA should not formally participate.
    tradecraft: State the decision as a denial of formal committee membership and preserve the stated authority and political
      rationale in the decision record. Keep any separate liaison activity within the Director's authorization; this does
      not expand the basis for formal participation.
    uncertainty: The source records the Agency's lack of domestic jurisdiction as the officer's reason, but does not set out
      a separate legal analysis or identify a formal rule governing committee membership.
    handoff: The Director decided after the liaison officer reported the meetings, and confirmed the position on formal participation.
      The source identifies no additional referral or approval as necessary.
    tempting_wrong:
      option: O2
      pull: An inactive committee and a request for CIA expertise make membership appear to be a practical way to improve
        coordination.
      why_wrong: That practical need does not answer the Director's stated concern that formal participation would exceed
        the Agency's domestic role or create political implications and an appearance of deep domestic involvement.
    rejected:
      O2: The Director declined formal participation because the Agency lacked domestic jurisdiction and he was reluctant
        to have it appear deeply involved in domestic matters.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A competent authority established domestic jurisdiction for this role and explicitly authorized formal CIA membership,
        resolving the authority concern.
      then: O2
      why: The central stated objection was the Agency's lack of domestic jurisdiction; an authoritative change to that premise
        could make formal participation permissible, subject to the political concern being addressed.
    would_not_change:
    - id: noflip1
      if: The committee remains relatively inactive and Justice Department representatives renew their request, without resolving
        the Agency's authority and political concerns.
      why: The request and committee's inactivity alone do not outweigh the Director's stated reasons against formal participation.
    watch_for:
    - id: watch1
      what: A formal clarification of the Agency's authority to participate in domestic civil-disorder evaluation.
      favors:
      - O2
      why: It could alter the jurisdictional premise that informed the Director's decision.
  lesson: A request for useful participation does not itself establish authority to take part. When formal involvement would
    cross an asserted jurisdictional boundary and create political or institutional risk, address those concerns before allowing
    membership, even if the requesting body is inactive.
  limits: This reasoning concerns formal CIA membership in this committee in the circumstances described. It does not decide
    what information or advice a separately authorized liaison may provide, or what the result would be under a different
    jurisdictional mandate.
