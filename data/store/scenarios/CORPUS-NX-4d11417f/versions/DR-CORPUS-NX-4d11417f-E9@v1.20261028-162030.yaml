case:
  id: DR-CORPUS-NX-4d11417f-E9@v1
  title: Whether to Join Efforts to Remove the Egyptian Leader
  status: draft
  setting: Washington, during efforts to remove the Egyptian leader; the White House
  decider: The U.S. official in Washington
  agent: The U.S. official in Washington
  agent_role: decide
  situation: Efforts to remove the Egyptian leader were under consideration in Washington. The U.S. official had to decide
    whether to participate and what to advise the White House. The official believed that efforts of this kind were unlikely
    to succeed when they ran against the direction of events, and that broad public support and capable alternative leadership
    were important conditions. In the Iranian precedent, the official saw broad public support, supportive elements in the
    army and power structure, and leadership able to take control. The official assessed that the Iranian option was unavailable
    in the Egyptian case.
  question: What should the U.S. official in Washington do about participation in efforts to remove the Egyptian leader, and
    what should the official advise the White House?
  options:
    O1:
      do: The official rejects efforts to remove the Egyptian leader and advises the White House to adjust to him.
      move: act
      irreversible: false
    O2:
      do: The official joins efforts to remove the Egyptian leader and advises the White House to seek a replacement.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Efforts to remove the Egyptian leader were under consideration.
  - id: F2
    kind: situation
    status: confirmed
    fact: The official was in Washington.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The official believed that such operations do not work when they go against the direction of events.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The official considered support from the vast majority of the population an important condition for such an operation.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The official considered Iran to have had support from the vast majority of its population.
  - id: F6
    kind: capability
    status: assessed
    fact: The official considered the Iranian alternative leadership better than the leadership in power and capable of taking
      control.
  - id: F7
    kind: capability
    status: assessed
    fact: The official considered the Iranian army and power structure supportive of the alternative, and described the Iranian
      monarch as gentle and reasonable at the time.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The official assessed that the Iranian option was unavailable in the Egyptian case.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The official believed operations of this kind do not work when they run against the direction of events, which weighs
      against joining efforts to remove the Egyptian leader.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Broad support from the population was treated as a necessary condition; the official saw that condition in Iran,
      but not in the Egyptian case.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Iranian precedent also depended on a capable alternative leadership and support within the army and power structure;
      those features did not make the Iranian option available in Egypt.
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The official assessed that the Iranian option simply did not exist in the Egyptian case, supporting refusal to participate
      and advice to adjust to the Egyptian leader.
  reasoning:
    read: The decision was whether to join efforts to remove the Egyptian leader or refuse and advise the White House to accept
      him. The trap is treating the Iranian precedent as a transferable model rather than as an option the official believed
      depended on conditions absent in Egypt.
    weighing: 'The official''s case against participation rested on three linked judgments: such operations fail when they
      run against events, they require broad public support, and they require capable alternative leadership with institutional
      support. Iran was thought to have those prerequisites, while the Iranian option was assessed as unavailable in Egypt;
      together those reasons favored O1 {C1} {C2} {C3} {C4}. The balance depends on the accuracy of those assessments, especially
      whether the prerequisites exist in the Egyptian case.'
    tradecraft: State the recommendation in terms of the assessed political conditions and the limits of the Iranian comparison.
      Keep the record clear about which conditions are assessments, and do not present the precedent as proof that the same
      option is available elsewhere.
    uncertainty: The reasoning depends on the official's assessments of public support, the direction of events, and the availability
      of capable alternative leadership; the provided facts do not independently verify those assessments.
    handoff: The official should convey the refusal and the recommendation to the White House, since advising the White House
      was part of the decision and the source records that advice.
    tempting_wrong:
      option: O2
      pull: The Iranian precedent could make participation seem like a proven way to replace an unwanted leader.
      why_wrong: The official treated Iran's conditions as prerequisites, not as a general recipe, and assessed that the Iranian
        option was unavailable in Egypt.
    rejected:
      O2: The official rejected participation because the operation's necessary political support and capable alternative
        leadership were not available in the Egyptian case.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The official had sound grounds to assess that the effort aligned with the direction of events and that broad public
        support, capable alternative leadership, and supportive institutions were present.
      then: O2
      why: Those conditions would remove the stated grounds for rejecting participation and could make joining the effort
        the more viable option.
    would_not_change:
    - id: noflip1
      if: An alternative leader seemed preferable, but broad public support and the ability to take control were still absent.
      why: A preferable replacement alone would not supply the political and leadership conditions the official treated as
        necessary.
    watch_for:
    - id: watch1
      what: Reliable reassessment of whether the direction of events, broad public support, and capable alternative leadership
        are present.
      favors:
      - O1
      - O2
      why: The recommendation turns on these conditions; evidence that they have changed could alter the balance.
  lesson: Do not generalize from a prior intervention without checking the conditions that the decision-maker believed made
    it viable. Where the direction of events, broad public support, and capable alternative leadership are absent, the source's
    reasoning favors declining participation and adjusting policy to the leader in power.
  limits: This reasoning concerns the official's assessment of political feasibility in this particular case. It does not
    establish a legal rule about intervention or determine whether the underlying efforts were lawful.
