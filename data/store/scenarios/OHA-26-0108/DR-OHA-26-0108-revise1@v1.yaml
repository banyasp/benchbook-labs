case:
  id: DR-OHA-26-0108-revise1@v1
  title: DOE Personnel Security Clearance – LSD Use [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, September 14 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office received reliable information that the Individual, who held a DOE access authorization,
    had microdosed LSD on six occasions between January 2025 and January 2026, including one purchase. The LSO issued a Notification
    Letter invoking Guideline H (drug involvement), Guideline J (criminal conduct), and the Bond Amendment, and scheduled
    an administrative hearing before an Administrative Judge. At the hearing, the Individual admitted the LSD use, provided
    a signed statement committing to abstain, described therapy for anxiety, and submitted a urine test that was negative
    for listed substances but did not test for LSD. Supervisors testified that the Individual’s work performance was satisfactory
    and expressed confidence in his reliability, while the Fitness for Duty psychologist reported no underlying mental health
    condition and noted progress in coping strategies. The Administrative Judge must determine whether the security concerns
    raised under Guidelines H and J have been resolved sufficiently to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge conditionally restores the Individual’s access authorization after a LSD test.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Individual held a DOE access authorization at the time of the alleged LSD use.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Individual admitted in a February 2026 Letter of Interrogatory that he microdosed LSD six times between January
      2025 and January 2026, purchased it once, and used it while holding the clearance.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office invoked Guideline H, Guideline J, and the Bond Amendment to argue that the Individual’s
      clearance should not be restored.
  - id: F4
    kind: capability
    status: assessed
    fact: The Individual provided a signed statement committing to abstain from illegal drugs, attended regular mental‑health
      therapy, and submitted a urine drug test that was negative for listed substances but did not include LSD.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Individual’s direct and second‑line supervisors testified that they observed no performance issues, consider
      him reliable, and support his continued work.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Fitness for Duty psychologist concluded there was no underlying mental‑health concern, noted substantial progress,
      and observed that no drug test for LSD had been performed.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O3
    - O2
    weight: weak
    why: The Bond Amendment bars clearance for unlawful drug users, but the weight is reduced to reflect that a conditional
      restoration with verified abstinence can satisfy the statutory purpose without permanently denying eligibility.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    equity: institutional_credibility
    favors:
    - O3
    - O2
    weight: weak
    why: Guideline H requires proven abstinence; the Individual's signed abstinence statement, therapy, and supervisor attestations
      provide a credible mitigation path, so the lack of LSD-specific testing is not decisive when a conditional test is imposed.
  - id: C3
    facts:
    - F2
    - F4
    - F5
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline J treats illegal drug purchase as criminal conduct; the conduct occurred less than a year ago, no substantial
      time has elapsed, and no evidence of rehabilitation is present, so the concern remains unresolved.
  - id: C4
    facts:
    - F2
    - F4
    - F6
    equity: record_integrity
    favors:
    - O3
    weight: strong
    why: The record provides only the Individual’s uncorroborated testimony; there is no independent verification (e.g., LSD‑specific
      testing), undermining confidence that the behavior has ceased.
  - id: C5
    facts:
    - F4
    - F5
    - F6
    equity: mitigation_success
    favors:
    - O2
    weight: strong
    why: The Individual's written commitment to abstain, ongoing mental-health therapy, and supervisor endorsements together
      demonstrate reliable mitigation that justifies conditional restoration pending an LSD-specific test.
  reasoning:
    read: The Individual admitted micro-dosing LSD while holding a DOE clearance. The LSO invoked the Bond Amendment and Guidelines
      H and J. The judge must weigh statutory prohibitions against evidence of mitigation and the possibility of conditional
      testing.
    weighing: The judge now applies {C1} with reduced weight, {C2} with reduced weight, and the new strong mitigation consideration
      {C5}. These together support a conditional restoration that satisfies the statutory and guideline aims while ensuring
      future verification.
    tradecraft: The decision is entered into the OHA docket, citing the Bond Amendment, Guidelines H and J, and the new mitigation
      analysis, and the conditional restoration is communicated to the LSO with a requirement for an LSD-specific test within
      30 days.
    uncertainty: Uncertainty remains about current drug use, but the conditional test requirement directly addresses this
      gap, allowing the decision to proceed while preserving security interests.
    handoff: The Administrative Judge retains sole authority to adjudicate the clearance, with the LSO responsible for enforcing
      the post-decision testing condition.
    tempting_wrong:
      option: O1
      pull: Unconditional restoration appears attractive given the Individual's therapy and supervisor support.
      why_wrong: Granting full restoration would ignore the Bond Amendment's prohibition on any clearance for unlawful users
        without a verified period of abstinence.
    rejected:
      O1: Unconditional restoration conflicts with the statutory ban and the need for verified abstinence.
      O3: A blanket denial overlooks the Individual's demonstrated mitigation and the ability to verify abstinence through
        testing.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C5
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: If the Individual refuses to submit the required LSD‑specific test after the conditional restoration period.
      then: O3
      why: Non‑compliance with the testing condition eliminates the mitigation basis, triggering denial of restoration.
    would_not_change:
    - id: noflip1
      if: Supervisors continue to attest to reliability but no drug-test evidence is produced.
      why: Statutory prohibition under the Bond Amendment remains unchanged.
    watch_for:
    - id: watch1
      what: Any future evidence of LSD use or a positive test.
      favors:
      - O3
      why: Recurrence would reinforce the finding of unlawful use.
  lesson: When credible mitigation exists but independent drug-testing evidence is lacking, a conditional restoration with
    a required test can satisfy both security and fairness concerns.
  limits: This approach applies only when the Individual offers documented abstinence commitments, therapy, and supervisor
    support, and when a timely LSD-specific test can be mandated; it does not extend to cases lacking any mitigation evidence.
