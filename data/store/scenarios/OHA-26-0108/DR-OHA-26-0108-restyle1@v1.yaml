case:
  id: DR-OHA-26-0108-restyle1@v1
  title: DOE Personnel Security Clearance – LSD Use [restyle]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy – 14 September 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office obtained credible intelligence indicating that the employee, who possessed a DOE security
    clearance, had engaged in micro-dosing of LSD on six separate occasions from January 2025 through January 2026, including
    a single purchase. The LSO issued a Notification Letter invoking Guideline H (drug involvement), Guideline J (criminal
    conduct), and the Bond Amendment, and set a hearing before an Administrative Law Judge. At the hearing, the employee acknowledged
    the LSD use, submitted a signed pledge to refrain from illegal drugs, described ongoing anxiety therapy, and produced
    a urine analysis that was negative for the substances listed in the test panel but did not screen for LSD. Supervisors
    testified that his job performance remained solid and expressed confidence in his dependability, while the fitness-for-duty
    psychologist reported no underlying mental-health disorder and observed progress in coping mechanisms. The Judge must
    decide whether the security concerns identified under Guidelines H and J have been adequately mitigated to permit restoration
    of the clearance.
  question: What action should the Administrative Law Judge take concerning the employee's security clearance?
  options:
    O1:
      do: Restore the employee's clearance in full, with no conditions.
      move: act
      irreversible: true
    O2:
      do: Restore the clearance conditionally, contingent upon a future LSD-specific drug test.
      move: partial
      irreversible: false
    O3:
      do: Refuse to restore the employee's clearance at this time.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: At the time of the alleged LSD use, the employee held an active DOE security clearance.
  - id: F2
    kind: intelligence
    status: assessed
    fact: In a February 2026 response to a Letter of Interrogatory, the employee admitted to micro-dosing LSD six times between
      January 2025 and January 2026, purchasing the substance on one occasion, and using it while cleared.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline H, Guideline J, and the Bond Amendment as grounds to deny restoration
      of the clearance.
  - id: F4
    kind: capability
    status: assessed
    fact: The employee provided a signed declaration promising abstinence from illegal drugs, attended regular mental-health
      counseling, and submitted a urine screen that was negative for the listed analytes but did not test for LSD.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Both the employee's direct supervisor and his second-line manager testified that they observed no performance deficiencies,
      regarded him as reliable, and endorsed his continued employment.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The fitness-for-duty psychologist concluded that there was no substantive mental-health issue, noted marked improvement,
      and pointed out that no LSD-specific testing had been performed.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Bond Amendment (50 U.S.C. § 3343(b)) prohibits granting or renewing a clearance to any individual who unlawfully
      uses a controlled substance; LSD is classified as a Schedule I drug, and the employee admitted unlawful use while holding
      a clearance.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Guideline H requires demonstrable abstinence and reliable testing as mitigation; the record lacks LSD-specific testing
      and the employee's self-report is considered insufficiently credible, leaving the security concern unmitigated.
  - id: C3
    facts:
    - F2
    - F4
    - F5
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline J treats the illegal purchase of a controlled substance as criminal conduct; the conduct occurred less
      than a year ago, no significant period of rehabilitation is evident, and thus the concern remains unresolved.
  - id: C4
    facts:
    - F2
    - F4
    - F6
    equity: record_integrity
    favors:
    - O3
    weight: strong
    why: The file contains only the employee's uncorroborated testimony; absent independent verification such as LSD-specific
      testing, confidence that the behavior has ceased is undermined.
  reasoning:
    read: The employee acknowledged recent micro-dosing of LSD, a Schedule I controlled substance, while possessing a DOE
      clearance. The LSO invoked the Bond Amendment and Adjudicative Guidelines H and J. The judge must determine whether
      the identified security concerns have been sufficiently mitigated to allow clearance restoration.
    weighing: The judge applied {C1} (statutory bar), {C2} (failure to satisfy Guideline H mitigation), {C3} (failure to satisfy
      Guideline J mitigation), and {C4} (absence of corroborating evidence). Each consideration carried a strong weight, leading
      to a cumulative conclusion that the concerns remain unresolved.
    tradecraft: The determination is entered into the official OHA docket, citing the pertinent statutes, regulations, and
      guideline sections, and the decision is transmitted to both the LSO and the employee in accordance with 10 C.F.R. §
      710.28.
    uncertainty: The chief uncertainty concerns the employee's present drug-use status, which cannot be resolved without LSD-specific
      testing; nevertheless, the statutory and regulatory framework precludes reliance on speculation.
    handoff: The Administrative Law Judge acts independently, as the authority to adjudicate eligibility resides with the
      OHA under 10 C.F.R. § 710.25.
    tempting_wrong:
      option: O2
      pull: A conditional restoration might seem equitable given the employee's therapy and supervisor endorsements.
      why_wrong: The record explicitly indicates that, without reliable LSD-specific testing and sufficient elapsed time,
        mitigation factor (b) of Guideline H is unmet, so a conditional restoration would violate both the Bond Amendment
        and the applicable Guidelines.
    rejected:
      O1: Statutory disqualification and Guideline requirements are not satisfied; granting would breach the Bond Amendment.
      O2: Mitigating factors for both Guidelines remain unmet; a conditional restoration lacks the necessary evidentiary foundation.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee furnishes a series of negative LSD-specific drug tests and documented abstinence over a substantial
        interval.
      then: O2
      why: Guideline H mitigation factor (b) would then be satisfied, permitting a conditional restoration.
    would_not_change:
    - id: noflip1
      if: Supervisors continue to attest to reliability but no LSD-specific testing is produced.
      why: The statutory prohibition under the Bond Amendment remains unchanged.
    watch_for:
    - id: watch1
      what: Any future indication of LSD use or a positive test result.
      favors:
      - O3
      why: A recurrence would reinforce the finding of unlawful use.
  lesson: When an individual admits recent unlawful use of a Schedule I substance, the Bond Amendment and Adjudicative Guidelines
    mandate denial of clearance absent clear, corroborated evidence of sustained abstinence and appropriate mitigation.
  limits: This analysis is limited to situations lacking independent drug-testing evidence of abstinence and where the conduct
    occurred within the prior year; it does not extend to cases featuring documented rehabilitation programs or a long elapsed
    period.
