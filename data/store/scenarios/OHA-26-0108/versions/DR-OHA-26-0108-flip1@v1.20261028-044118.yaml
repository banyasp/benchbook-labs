case:
  id: DR-OHA-26-0108-flip1@v1
  title: DOE Personnel Security Clearance – LSD Use [flip]
  status: needs_review
  setting: DOE Office of Hearings & Appeals, 14 September 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office received credible intelligence that the clearance holder had micro-dosed LSD on six
    occasions between January 2025 and January 2026, including one purchase. The LSO issued a Notification Letter invoking
    Guideline H (drug involvement), Guideline J (criminal conduct), and the Bond Amendment, and set a hearing before an Administrative
    Law Judge. At the hearing the Individual acknowledged the LSD use, signed a pledge to refrain from illegal substances,
    described ongoing anxiety therapy, and submitted urine screens that were negative for listed drugs but did not include
    LSD. Supervisors testified that his performance remained strong and that they trusted his reliability, while the Fitness-for-Duty
    psychologist reported no underlying mental-health disorder and noted progress in coping skills. The Judge must decide
    whether the security concerns raised under Guidelines H and J have been sufficiently mitigated to permit restoration of
    the Individual's access authorization.
  question: How should the Administrative Law Judge rule on the Individual's access authorization?
  options:
    O1:
      do: Fully restore the Individual's access authorization without any conditions.
      move: act
      irreversible: true
    O2:
      do: Conditionally restore the Individual's access authorization pending a negative test.
      move: partial
      irreversible: false
    O3:
      do: Refuse to restore the Individual's access authorization at this time.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Individual possessed a DOE access authorization at the time of the alleged LSD use.
  - id: F2
    kind: intelligence
    status: assessed
    fact: In a February 2026 Letter of Interrogatory, the Individual admitted micro-dosing LSD six times from January 2025
      to January 2026, purchasing it once, and using it while cleared.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline H, Guideline J, and the Bond Amendment to argue against restoration of
      the clearance.
  - id: F4
    kind: capability
    status: assessed
    fact: The Individual provided a signed statement committing to abstain from illegal drugs, attended regular mental‑health
      therapy, and submitted a series of urine drug tests over the past six months that were all negative for LSD.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Both the Individual's direct supervisor and second-line manager testified that they observed no performance problems,
      consider him reliable, and support his continued employment.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Fitness for Duty psychologist concluded there was no underlying mental‑health concern, noted substantial progress,
      and confirmed that multiple LSD‑specific drug tests had been performed and were negative.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Bond Amendment (50 U.S.C. § 3343(b)) prohibits granting or renewing a clearance to anyone who unlawfully uses
      a controlled substance; LSD is a Schedule I drug, and the Individual admitted use while cleared.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Guideline H requires documented abstinence and reliable testing; the record now includes LSD-specific negative tests
      (F6) and a signed abstinence pledge, satisfying mitigation factor (b).
  - id: C3
    facts:
    - F2
    - F4
    - F5
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline J treats the illicit purchase as criminal conduct; the offense occurred less than a year ago and no substantial
      rehabilitation evidence has been presented, so the concern remains.
  reasoning:
    read: The Individual confessed to recent micro-dosing of LSD, a Schedule I substance, while holding a DOE clearance. The
      LSO invoked the Bond Amendment and Adjudicative Guidelines H and J. The Judge must assess whether mitigation requirements
      have been met to allow restoration.
    weighing: The Judge applied {C1} (statutory bar), {C2} (mitigation satisfied via LSD-specific negative tests), and {C3}
      (ongoing concern over recent purchase). {C2} now supports conditional restoration, outweighing the remaining concerns.
    tradecraft: The decision is entered into the official OHA docket, citing the relevant statutes, regulations, and guideline
      paragraphs, and the outcome is transmitted to the LSO and the Individual pursuant to 10 C.F.R. § 710.28.
    uncertainty: The principal uncertainty concerns any future illicit use that could be revealed by subsequent testing; the
      current record, however, meets the evidentiary threshold for conditional restoration.
    handoff: The Administrative Law Judge acts independently, as the authority to adjudicate eligibility resides with the
      OHA under 10 C.F.R. § 710.25.
    tempting_wrong:
      option: O3
      pull: Denial may seem appropriate given the recent purchase and the statutory language of the Bond Amendment.
      why_wrong: Because LSD-specific testing (F6) confirms abstinence, the mitigation requirement of Guideline H is satisfied,
        making a blanket denial overly punitive.
    rejected:
      O1: Statutory and guideline requirements are not fully met; unconditional restoration would violate the Bond Amendment.
      O3: The presence of verified LSD-specific negative tests satisfies Guideline H mitigation, rendering a total denial
        unnecessary.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to produce a positive LSD-specific test or evidence of renewed use after restoration.
      then: O3
      why: Such evidence would re-activate the security concern, making denial (O3) the appropriate outcome again.
    would_not_change:
    - id: noflip1
      if: Supervisors continue to attest to reliability but no drug-test evidence is produced.
      why: The statutory prohibition under the Bond Amendment would remain unchanged.
    watch_for:
    - id: watch1
      what: Any future indication of LSD use or a positive test result.
      favors:
      - O3
      why: A recurrence would reinforce the finding of unlawful use.
  lesson: When an individual admits recent unlawful use of a Schedule I drug, the Bond Amendment and Adjudicative Guidelines
    can be satisfied by documented abstinence and independent LSD-specific testing, allowing a conditional restoration of
    access.
  limits: This analysis applies only when reliable LSD-specific negative test results are on record and the illicit conduct
    occurred within the past year; it does not extend to cases lacking such testing or where substantial rehabilitation has
    been documented.
