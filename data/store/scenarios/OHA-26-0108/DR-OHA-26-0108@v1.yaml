case:
  id: DR-OHA-26-0108@v1
  title: DOE Personnel Security Clearance – LSD Use
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, September 14 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office received reliable information that the Individual, who held a DOE access authorization,
    had microdosed LSD on six occasions between January 2025 and January 2026, including one purchase. The LSO issued a Notification
    Letter invoking Guideline H (drug involvement), Guideline J (criminal conduct), and the Bond Amendment, and scheduled
    an administrative hearing before an Administrative Judge. At the hearing, the Individual admitted the LSD use, provided
    a signed statement committing to abstain, described therapy for anxiety, and submitted a urine test that was negative
    for listed substances but did not test for LSD. Supervisors testified that the Individual’s work performance was satisfactory
    and expressed confidence in his reliability, while the Fitness for Duty psychologist reported no underlying mental health
    condition and noted progress in coping strategies. The Administrative Judge must determine whether the security concerns
    raised under Guidelines H and J have been resolved sufficiently to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge grants restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge conditionally restores the Individual’s access authorization after a LSD test.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Individual held a DOE access authorization at the time of the alleged LSD use.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Individual admitted in a February 2026 Letter of Interrogatory that he microdosed LSD six times between January
      2025 and January 2026, purchased it once, and used it while holding the clearance.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Local Security Office invoked Guideline H, Guideline J, and the Bond Amendment to argue that the Individual’s
      clearance should not be restored.
  - id: F4
    kind: capability
    status: assessed
    fact: The Individual provided a signed statement committing to abstain from illegal drugs, attended regular mental‑health
      therapy, and submitted a urine drug test that was negative for listed substances but did not include LSD.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Individual’s direct and second‑line supervisors testified that they observed no performance issues, consider
      him reliable, and support his continued work.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Fitness for Duty psychologist concluded there was no underlying mental‑health concern, noted substantial progress,
      and observed that no drug test for LSD had been performed.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Bond Amendment (50 U.S.C. §3343(b)) bars granting or renewing a clearance to any unlawful user of a controlled
      substance; LSD is a Schedule I drug, and the Individual admitted unlawful use while holding a clearance.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Guideline H requires mitigation such as proven abstinence and reliable testing; the record lacks LSD‑specific drug
      tests and the Individual’s self‑report is deemed not credible, so the security concern is not mitigated.
  - id: C3
    facts:
    - F2
    - F4
    - F5
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Guideline J treats illegal drug purchase as criminal conduct; the conduct occurred less than a year ago, no substantial
      time has elapsed, and no evidence of rehabilitation is present, so the concern remains unresolved.
  - id: C4
    facts:
    - F2
    - F4
    - F6
    equity: record_integrity
    favors:
    - O3
    weight: strong
    why: The record provides only the Individual’s uncorroborated testimony; there is no independent verification (e.g., LSD‑specific
      testing), undermining confidence that the behavior has ceased.
  reasoning:
    read: The Individual admitted recent micro‑dosing of LSD, a Schedule I controlled substance, while holding a DOE clearance.
      The LSO invoked the Bond Amendment and Adjudicative Guidelines H and J. The judge must decide whether the security concerns
      are sufficiently mitigated to permit restoration.
    weighing: The judge applied {C1} (statutory prohibition), {C2} (failure to meet Guideline H mitigation criteria), {C3}
      (failure to meet Guideline J mitigation criteria), and {C4} (lack of corroborating evidence). Each consideration was
      weighted strong, leading to a cumulative finding that the concerns remain unresolved.
    tradecraft: The decision is recorded in the official OHA decision docket, citing the relevant statutes, regulations, and
      guideline paragraphs, and the outcome is communicated to the LSO and the Individual per 10 C.F.R. § 710.28.
    uncertainty: The primary uncertainty is the Individual’s actual current drug use, which cannot be resolved without LSD‑specific
      testing; however, the statutory and guideline framework does not permit speculation.
    handoff: The Administrative Judge decides alone, as the authority to adjudicate eligibility rests with the OHA under 10 C.F.R. § 710.25.
    tempting_wrong:
      option: O2
      pull: A conditional restoration might appear fair given the Individual’s therapy and supervisor support.
      why_wrong: The source explicitly states that without reliable drug‑test evidence and sufficient time elapsed, the mitigating
        factor (b) for Guideline H is not met, so a conditional restoration would contravene the Bond Amendment and Guidelines.
    rejected:
      O1: The Bond Amendment and Guidelines H and J are not satisfied; granting would violate statutory disqualification.
      O2: Mitigating factors for both Guidelines are not met; a conditional restoration lacks the required evidentiary foundation.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provides a series of LSD‑specific negative drug tests and documented abstinence for a substantial
        period.
      then: O2
      why: Guideline H mitigation factor (b) would then be satisfied, allowing a conditional restoration.
    would_not_change:
    - id: noflip1
      if: Supervisors continue to attest to reliability but no drug‑test evidence is produced.
      why: Statutory prohibition under the Bond Amendment remains unchanged.
    watch_for:
    - id: watch1
      what: Any future evidence of LSD use or a positive test.
      favors:
      - O3
      why: Recurrence would reinforce the finding of unlawful use.
  lesson: When an individual admits recent unlawful use of a Schedule I substance, the Bond Amendment and Adjudicative Guidelines
    require denial of clearance unless clear, corroborated evidence of sustained abstinence and mitigation is presented.
  limits: This analysis applies only where there is no independent drug‑testing evidence of abstinence and where the conduct
    occurred within the past year; it does not extend to cases with documented rehabilitation programs or long‑elapsed time.
