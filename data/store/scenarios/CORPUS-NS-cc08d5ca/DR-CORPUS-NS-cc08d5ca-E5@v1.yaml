case:
  id: DR-CORPUS-NS-cc08d5ca-E5@v1
  title: Immediate-Engagement Authority and Risk
  status: draft
  setting: NATO ACO joint-targeting context; time not specified.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: The Commander is identified as the engagement authority. The applicable condition concerns a threat within the
    stated proximity of NATO fielded forces or key infrastructure. Under that condition, the rule calls for immediate engagement
    with any available asset. The decision carries possible high-risk considerations, including friendly fire, casualties
    caused by the threat, and diversion of assets from another mission. Such high risk may be held at the JTF level. A possible
    negative impact on the JTF’s information activities is described as medium risk that may be held at CC level.
  question: What should the Commander do under the stated proximity condition?
  options:
    O1:
      do: The Commander refers the decision to the JTF for risk review.
      move: ask
      irreversible: false
      to: the JTF
    O2:
      do: The Commander declines immediate engagement under the stated proximity condition.
      move: act
      irreversible: false
    O3:
      do: The Commander authorizes immediate engagement under the stated proximity condition.
      move: act
      irreversible: true
    O4:
      do: The Commander holds the decision pending a risk review.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Commander is identified as the engagement authority.
  - id: F2
    kind: situation
    status: confirmed
    fact: The stated condition is that a threat is within the specified proximity of NATO fielded forces or key infrastructure.
  - id: F3
    kind: authority
    status: confirmed
    fact: Under that condition, the rule calls for immediate engagement with any available asset.
  - id: F4
    kind: situation
    status: assessed
    fact: High risk could involve friendly fire.
  - id: F5
    kind: situation
    status: assessed
    fact: High risk could involve casualties caused by the threat.
  - id: F6
    kind: situation
    status: assessed
    fact: High risk could involve diverting assets from another mission.
  - id: F7
    kind: authority
    status: assessed
    fact: High risk may be held at the JTF level.
  - id: F8
    kind: situation
    status: assessed
    fact: A possible negative impact on the JTF’s information activities is described as a medium-risk consideration.
  - id: F9
    kind: authority
    status: assessed
    fact: Medium risk may be held at CC level.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The matrix identifies the Commander as engagement authority and calls for immediate engagement when the stated condition
      applies.
  - id: C2
    facts:
    - F2
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: The proximity condition concerns a threat near NATO fielded forces or key infrastructure, the context in which the
      matrix directs immediate action.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Possible friendly fire, casualties caused by the threat, or diversion of assets are high-risk considerations that
      may be held at JTF level.
  - id: C4
    facts:
    - F8
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: A possible negative impact on JTF information activities is identified as medium risk that may be held at CC level.
  reasoning:
    read: The stated proximity condition is met, and the matrix assigns the Commander engagement authority while calling for
      immediate engagement. The trap is treating the note about risk-holding levels as an instruction to defer every decision
      involving risk; the text identifies possible risk considerations and their levels, but does not say that review suspends
      the immediate-engagement rule.
    weighing: The immediate rule and the Commander’s identified authority are decisive {C1}, reinforced by the stated proximity
      condition {C2}. The possible high-risk considerations and the medium-risk information-activity impact merit attention
      {C3} {C4}, but the source does not make them prerequisites for referral or exceptions to the immediate rule. The balance
      depends on the proximity condition applying; if it does not, this particular direction does not decide the matter.
    tradecraft: At the decision level, confirm that the stated condition is the one being applied, act under the identified
      authority, and record the decision and the risk considerations that informed it. This does not add operational steps
      for carrying out an engagement.
    uncertainty: The risk examples are framed as possibilities, not as findings that any particular risk is present. The source
      does not provide a separate procedure for resolving a conflict between an immediate-engagement direction and a risk
      review.
    handoff: The Commander is the identified engagement authority. High risk may be held at JTF level and medium risk at CC
      level; those risk-holding levels do not themselves require referral before an immediate decision or transfer engagement
      authority.
    tempting_wrong:
      option: O1
      pull: The possible high-risk considerations may make referral to the JTF seem prudent.
      why_wrong: The source identifies the JTF as a possible holder of high risk, but separately directs immediate engagement
        under the proximity condition and identifies the Commander as authority; it does not state that referral is a precondition.
    rejected:
      O1: Referral is not chosen because the source does not make JTF risk review a prerequisite to the immediate direction.
      O2: Declining would not follow the matrix’s direction to engage immediately when the stated proximity condition applies.
      O4: Holding pending review would delay the immediate action the matrix directs under the stated condition.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The stated proximity condition is not met.
      then: O4
      why: The immediate-engagement direction addressed here would no longer apply; holding for clarification of the applicable
        decision rule is a cautious alternative.
    would_not_change:
    - id: noflip1
      if: The listed high-risk considerations remain possible and high risk may be held at JTF level.
      why: Those considerations warrant attention, but the source does not say that their possible presence displaces the
        immediate-engagement direction or changes the identified engagement authority.
    watch_for:
    - id: watch1
      what: Whether the decision involves possible friendly fire, casualties caused by the threat, or diversion of assets
        from another mission.
      favors:
      - O1
      why: These are examples of high-risk considerations that may be held at JTF level; their presence is relevant to risk
        accountability even though referral is not made a precondition.
  lesson: When a doctrine matrix gives a conditional direction and names the decision authority, apply that direction when
    its condition is met. Risk-holding levels inform accountability, but do not create a referral requirement unless explicitly
    made one.
  limits: This conclusion applies only when the specified proximity condition is met. It does not resolve other engagement
    conditions, legal requirements, or risk procedures.
