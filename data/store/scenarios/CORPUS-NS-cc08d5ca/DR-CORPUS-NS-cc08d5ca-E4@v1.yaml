case:
  id: DR-CORPUS-NS-cc08d5ca-E4@v1
  title: Authority for a Threat-to-ATO Decision
  status: draft
  setting: NATO Allied Command Operations, under the framework dated 26 October 2018; operational location unspecified.
  decider: The component command
  agent: The component command
  agent_role: decide
  situation: Within NATO's Allied Command Operations framework, the component command faces a hypothetical policy decision
    concerning a SAM threat to execution of the air tasking order. The matrix identifies a SAM that poses, or is expected
    soon to pose, such a threat as meeting its stated condition for engagement with any available asset. The component command
    is designated as the engagement authority, and the matrix marks the risk as high. J2 and J3 provide threat input for the
    SAM row. High risk may involve friendly fire, casualties caused by the threat, or diversion of assets from another mission,
    and such risk may be held at JTF level. The component command must decide whether to authorize or decline engagement under
    the matrix.
  question: What should the component command do when a SAM poses, or is expected soon to pose, a threat to execution of the
    air tasking order?
  options:
    O1:
      do: The component command declines engagement under the matrix.
      move: act
      irreversible: false
    O2:
      do: The component command authorizes engagement under the matrix.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A SAM that poses, or is expected soon to pose, a threat to execution of the air tasking order meets the matrix's
      stated condition.
  - id: F2
    kind: authority
    status: confirmed
    fact: Under that condition, the matrix calls for engagement with any available asset.
  - id: F3
    kind: authority
    status: confirmed
    fact: The component command is designated as engagement authority for the SAM decision.
  - id: F4
    kind: situation
    status: confirmed
    fact: The SAM row is marked high risk.
  - id: F5
    kind: situation
    status: assessed
    fact: High risk could involve friendly fire, casualties caused by the threat, or diversion of assets from another mission.
  - id: F6
    kind: authority
    status: assessed
    fact: A high level of risk may be held at JTF level.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: J2 and J3 are listed as providing threat input for the SAM row.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The matrix's stated condition is met when the SAM poses, or is expected soon to pose, a threat to execution of the
      air tasking order; for that condition it calls for engagement with any available asset.
  - id: C2
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The component command is designated as the engagement authority for this SAM decision, so authorizing engagement
      applies the assigned authority.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The high-risk marking warrants care because the stated examples include friendly fire and casualties, and high risk
      may be held at JTF level. This is a governance caution, not an express exception to the engagement direction or the
      stated component-command authority.
  - id: C4
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: J2 and J3 are listed as providing threat input for the SAM row; that input is relevant to applying the threat condition,
      although the source gives no further assessment of its content or reliability.
  reasoning:
    read: 'This is a hypothetical policy decision under a matrix condition already met: the SAM poses, or is expected soon
      to pose, a threat to execution of the air tasking order. The trap is to treat the high-risk label and the note that
      such risk may be held at JTF level as an automatic veto or transfer of authority, despite the stated designation of
      the component command.'
    weighing: The matrix directs engagement with any available asset when the stated SAM threat condition applies {C1}, and
      the component command is designated as the authority for this decision {C2}. The high-risk note warrants attention to
      risk ownership, but says that risk may be held at JTF level rather than requiring that it be; it does not displace the
      stipulated component-command designation {C3}. J2 and J3 provide threat input relevant to the condition {C4}. On these
      facts, the matrix's direction and assigned authority support O2. The balance depends on the threat condition being met
      and the stated authority remaining applicable.
    tradecraft: Record the threat condition, the applicable matrix direction, the authority relied on, and the high-risk consideration.
      Keep the rationale at policy and decision level; do not add weapon-employment details.
    uncertainty: The source does not define how soon a threat must be expected to arise or specify when high risk must be
      held at JTF level. The fixed facts resolve the authority for this decision in favor of the component command, but do
      not supply further risk-assessment criteria.
    handoff: The component command decides under its stated designation. If the command cannot confirm that the designation
      covers the decision or that it holds the applicable risk authority, it should resolve that authority question through
      the chain of command before acting; the source does not make JTF referral automatic.
    tempting_wrong:
      option: O1
      pull: The high-risk marking and the examples of friendly fire and casualties make declining engagement appear safer.
      why_wrong: Those risks warrant consideration, but high-risk holding at JTF level is possible, not mandatory, while the
        matrix directs engagement on the stated condition and the facts assign authority to the component command.
    rejected:
      O1: It was not chosen because the stated threat condition is met and the matrix calls for engagement, with the component
        command designated as the authority.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The SAM no longer poses, and is not expected soon to pose, a threat to execution of the air tasking order.
      then: O1
      why: The matrix's stated condition for engagement would no longer be met.
    would_not_change:
    - id: noflip1
      if: The SAM row remains marked high risk while the stated threat condition and component-command designation remain
        in force.
      why: High risk may be held at JTF level; that possibility alone does not negate the stated engagement direction or the
        authority specified in this scenario.
    watch_for:
    - id: watch1
      what: Whether the threat input from J2 and J3 continues to support the assessment that the SAM poses, or is expected
        soon to pose, a threat to air-tasking-order execution.
      favors:
      - O1
      why: If the threat condition is not supported, the matrix's stated basis for engagement may not apply.
  lesson: 'Apply the policy condition and the assigned decision authority together: a direction to act under a specified condition
    is not displaced merely by a risk label. Treat a note that risk may be held at a higher level as a reason to verify risk
    ownership, not as an automatic transfer of authority.'
  limits: This conclusion applies only to the hypothetical SAM condition and authority designation fixed here. It does not
    establish that the condition is met in any actual operation, resolve other legal or operational requirements, or supply
    weapon-employment guidance.
