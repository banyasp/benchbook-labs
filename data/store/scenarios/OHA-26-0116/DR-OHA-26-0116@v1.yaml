case:
  id: DR-OHA-26-0116@v1
  title: DOE Access Authorization Restoration Decision
  status: draft
  setting: Department of Energy administrative hearing, July 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual was originally granted a DOE access authorization in 2012. In September 2025 he was hospitalized
    for hallucinations and was diagnosed with psychosis. The CIA notified the DOE local security office that he had sent a
    public‑website message describing auditory hallucinations and a belief that a doctor implanted a device. The DOE security
    official reported that the Individual sought classified briefings he did not need, hand‑carried TS/SCI material to an
    unauthorized facility, and displayed paranoid behavior. A DOE psychologist diagnosed him with Substance Induced Psychotic
    Disorder, in early remission, and recommended one to two years of monitoring. The local security office issued a Notification
    Letter citing Guideline E, Guideline I, and Guideline K, noting his failure to report the hospitalization and false statements
    to the psychologist.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge partially restores the Individual’s access authorization.
      move: partial
      irreversible: true
    O2:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge postpones the decision pending additional psychological evaluation.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was first granted access authorization in 2012.
  - id: F2
    kind: situation
    status: confirmed
    fact: In September 2025 the Individual was hospitalized for hallucinations and diagnosed with psychosis.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The CIA notified the DOE local security office that the Individual sent a message via a public website describing
      auditory hallucinations and a belief that a doctor implanted a device.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Security Official reported that the Individual sought briefings on information he did not need, hand‑carried
      TS/SCI material to an unauthorized facility, and displayed paranoia.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist diagnosed the Individual with Substance Induced Psychotic Disorder, in early remission, under
      DSM‑5 criteria.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter citing Guideline E, Guideline I, and Guideline K.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual failed to report his September 2025 hospitalization to security officials as required by DOE Order 472.2A.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist recommended one to two years of monitoring before any restoration of access authorization.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Guideline I (psychological conditions) remains unresolved because the DOE Psychologist diagnosed a Substance‑Induced
      Psychotic Disorder and recommended one‑to‑two years of monitoring; the judge found the mitigating conditions under Guideline I
      not met.
  - id: C2
    facts:
    - F3
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Guideline E (personal conduct) is not mitigated; the Individual failed to report his September 2025 hospitalization
      as required and gave false statements to the DOE Psychologist, which the judge deemed intentional and significant.
  - id: C3
    facts:
    - F4
    equity: classification_integrity
    favors:
    - O2
    weight: strong
    why: Guideline K (handling protected information) is not mitigated; the Security Official reported intentional hand‑carrying
      of TS/SCI material to an unauthorized facility and seeking briefings beyond need‑to‑know, which the judge found a pattern
      of non‑compliance.
  - id: C4
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Regulatory presumption against granting or restoring a clearance (10 C.F.R. § 710.7(a) and case law) requires the
      Individual to overcome substantial doubt; the judge concluded the doubt was not overcome.
  - id: C5
    facts:
    - F5
    - F8
    equity: oversight_candor
    favors:
    - O2
    weight: strong
    why: The judge gave greater weight to the DOE Psychologist’s more cautious recommendation of one‑to‑two years monitoring,
      finding the Supervising Psychologist’s shorter timetable insufficient given the unresolved risk.
  reasoning:
    read: The Individual, once a high‑performing DOE employee, experienced a psychotic episode, failed to report it, gave
      false statements, and engaged in unauthorized handling of classified material. The LSO invoked Guidelines E, I, K, and
      the judge must decide whether the security concerns are resolved.
    weighing: Each consideration (C1‑C5) was weighed as ‘strong’ by the judge. The unresolved psychological condition (C1),
      the dishonest conduct (C2), and the mishandling of classified information (C3) together sustain substantial doubt. The
      regulatory presumption (C4) and the expert’s cautious monitoring recommendation (C5) tip the balance toward denial.
    tradecraft: The Administrative Judge issues a final decision, records the analysis in the official decision docket, and
      notifies the Individual of the denial and appeal rights per 10 C.F.R. § 710.28.
    uncertainty: Some uncertainty remains about the exact role of Kratom in the psychosis, but the judge found that uncertainty
      itself supports a more conservative stance.
    handoff: The decision is made solely by the Administrative Judge; no further agency review is required unless the Individual
      appeals.
    tempting_wrong:
      option: O3
      pull: The Individual’s strong work record and the lack of concrete evidence linking Kratom to psychosis might tempt
        a restoration.
      why_wrong: Restoring clearance would ignore the unresolved dishonesty, failure to report, and intentional mishandling
        of classified material, violating the presumption against granting.
    rejected:
      O1: Partial restoration would still leave unresolved security concerns under all three guidelines.
      O3: Full restoration ignores the substantial doubt and the judge’s finding that mitigating conditions are absent.
      O4: Postponing the decision is unnecessary; the record already contains sufficient evidence to deny.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual completes the DOE Psychologist’s recommended one‑year (or longer) monitoring period with no recurrence
        of psychotic symptoms
      then: O1
      why: A successful monitoring period would satisfy the mitigating condition of low risk of recurrence under Guideline I.
    - id: flip2
      if: the Individual provides full, truthful disclosure of all prior hospitalizations and undergoes remedial security
        training demonstrating reliable conduct
      then: O1
      why: Such conduct would meet the mitigating conditions under Guideline E and Guideline K.
    would_not_change:
    - id: noflip1
      if: the Individual continues to give contradictory statements about his hallucinations and Kratom use
      why: Ongoing dishonesty sustains substantial doubt regardless of other factors.
    watch_for:
    - id: watch1
      what: new peer‑reviewed evidence establishing a clear causal link between Kratom use and lasting psychotic episodes
      favors:
      - O3
      why: If Kratom were proven to be the sole cause and the Individual ceased use, the risk of recurrence could be deemed
        low.
  lesson: When substantial doubt exists under multiple adjudicative guidelines, the presumption against granting a clearance
    prevails; mitigation must be clearly demonstrated through documented treatment, truthful disclosure, and corrective actions.
  limits: This analysis applies only to DOE access authorizations under 10 C.F.R. Part 710 and the associated adjudicative
    guidelines; it does not address criminal liability or civil rights claims.
