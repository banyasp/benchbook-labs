case:
  id: DR-OHA-26-0116-restyle1@v1
  title: DOE Access Authorization Restoration Decision [restyle]
  status: needs_review
  setting: Department of Energy security clearance hearing, July 2026
  decider: Presiding Administrative Judge
  agent: Presiding Administrative Judge
  agent_role: decide
  situation: The employee originally received a DOE security clearance in 2012. In September 2025 he was admitted to a hospital
    for hallucinations and diagnosed with psychosis. The CIA informed the DOE local security office that he posted on a public
    website describing auditory hallucinations and asserting that a physician had implanted a device. The DOE security official
    reported that the employee pursued classified briefings he was not entitled to, personally transported TS/SCI material
    to a non-authorized site, and exhibited paranoid conduct. A DOE psychologist evaluated him, concluding he suffers from
    a Substance-Induced Psychotic Disorder, presently in early remission, and advised one to two years of monitoring. The
    local security office issued a Notification Letter citing Guidelines E, I, and K, noting his failure to disclose the hospitalization
    and the false statements made to the psychologist.
  question: What action should the Presiding Administrative Judge take regarding the employee's security clearance?
  options:
    O1:
      do: The Presiding Administrative Judge partially restores the employee's security clearance.
      move: partial
      irreversible: true
    O2:
      do: The Presiding Administrative Judge denies restoration of the employee's security clearance.
      move: act
      irreversible: true
    O3:
      do: The Presiding Administrative Judge restores the employee's security clearance.
      move: act
      irreversible: true
    O4:
      do: The Presiding Administrative Judge postpones the decision pending additional psychological evaluation.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee initially received a DOE security clearance in 2012.
  - id: F2
    kind: situation
    status: confirmed
    fact: In September 2025 the employee was admitted to a hospital for hallucinations and received a diagnosis of psychosis.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The CIA alerted the DOE local security office that the employee posted a message on a public website describing
      auditory hallucinations and asserting that a doctor had implanted a device.
  - id: F4
    kind: situation
    status: confirmed
    fact: The security official reported that the employee requested briefings on material he did not need, personally carried
      TS/SCI material to an unauthorized location, and displayed paranoid behavior.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A DOE psychologist diagnosed the employee with a Substance-Induced Psychotic Disorder, classified as early remission,
      according to DSM-5 criteria.
  - id: F6
    kind: situation
    status: confirmed
    fact: The local security office dispatched a Notification Letter referencing Guidelines E, I, and K.
  - id: F7
    kind: situation
    status: confirmed
    fact: The employee did not report his September 2025 hospitalization to security officials as required by DOE Order 472.2A.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: The DOE psychologist recommended a monitoring period of one to two years before any consideration of clearance restoration.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Guideline I (psychological conditions) remains unsettled because the DOE psychologist identified a Substance-Induced
      Psychotic Disorder and advised one-to-two years of monitoring; the judge concluded that the mitigating criteria under
      Guideline I are not satisfied.
  - id: C2
    facts:
    - F3
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Guideline E (personal conduct) is unmitigated; the employee failed to disclose his September 2025 hospitalization
      as mandated and supplied false statements to the DOE psychologist, which the judge regarded as intentional and material.
  - id: C3
    facts:
    - F4
    equity: classification_integrity
    favors:
    - O2
    weight: strong
    why: Guideline K (handling protected information) is unmitigated; the security official's report of deliberate hand-carrying
      of TS/SCI material to an unauthorized site and seeking briefings beyond need-to-know establishes a pattern of non-compliance,
      according to the judge.
  - id: C4
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Regulatory presumption against granting or restoring a clearance (10 C.F.R. § 710.7(a) and related case law) places
      the burden on the employee to overcome substantial doubt; the judge found that the doubt was not sufficiently dispelled.
  - id: C5
    facts:
    - F5
    - F8
    equity: oversight_candor
    favors:
    - O2
    weight: strong
    why: The judge accorded greater weight to the DOE psychologist's cautious recommendation of a one-to-two-year monitoring
      interval, finding the supervising psychologist's shorter timeline inadequate given the lingering risk.
  reasoning:
    read: The employee, previously a high-performing DOE staff member, suffered a psychotic episode, failed to report it,
      provided false statements, and engaged in unauthorized handling of classified material. The local security office invoked
      Guidelines E, I, K, and the judge must determine whether the security concerns have been resolved.
    weighing: Each consideration (C1-C5) was assessed as 'strong' by the judge. The unresolved psychological condition (C1),
      the dishonest conduct (C2), and the mishandling of classified information (C3) collectively sustain substantial doubt.
      The regulatory presumption (C4) and the expert's cautious monitoring recommendation (C5) together tip the balance toward
      denial.
    tradecraft: The Presiding Administrative Judge issues a final decision, records the analysis in the official docket, and
      notifies the employee of the denial and of appeal rights pursuant to 10 C.F.R. § 710.28.
    uncertainty: Some uncertainty persists regarding the precise role of Kratom in the psychosis, but the judge concluded
      that such uncertainty supports a more conservative approach.
    handoff: The decision rests solely with the Presiding Administrative Judge; no additional agency review is required unless
      the employee files an appeal.
    tempting_wrong:
      option: O3
      pull: The employee's strong performance record and the absence of definitive evidence linking Kratom to the psychotic
        episode might tempt a restoration.
      why_wrong: Restoring the clearance would disregard the unresolved dishonesty, failure to report, and intentional mishandling
        of classified material, contravening the presumption against granting.
    rejected:
      O1: A partial restoration would still leave the security concerns identified under all three guidelines unresolved.
      O3: Full restoration overlooks the substantial doubt and the judge's finding that mitigating conditions are absent.
      O4: Deferring the decision is unnecessary; the record already provides sufficient evidence to support a denial.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: the employee completes the DOE psychologist's recommended monitoring period of at least one year without any recurrence
        of psychotic symptoms
      then: O1
      why: Successful completion would satisfy the mitigating condition of low risk of recurrence under Guideline I.
    - id: flip2
      if: the employee furnishes a complete, truthful disclosure of all prior hospitalizations and completes remedial security
        training that demonstrates reliable conduct
      then: O1
      why: Such behavior would meet the mitigating conditions under Guidelines E and K.
    would_not_change:
    - id: noflip1
      if: the employee continues to provide contradictory statements concerning his hallucinations and Kratom consumption
      why: Ongoing dishonesty sustains substantial doubt regardless of other factors.
    watch_for:
    - id: watch1
      what: new peer-reviewed research establishing a definitive causal relationship between Kratom use and persistent psychotic
        episodes
      favors:
      - O3
      why: If Kratom were proven to be the sole cause and the employee ceased its use, the risk of recurrence could be judged
        low.
  lesson: When substantial doubt exists under multiple adjudicative guidelines, the presumption against granting a clearance
    prevails; mitigation must be clearly demonstrated through documented treatment, truthful disclosure, and corrective actions.
  limits: This analysis is limited to DOE security clearances governed by 10 C.F.R. Part 710 and the associated adjudicative
    guidelines; it does not address criminal liability or civil-rights claims.
