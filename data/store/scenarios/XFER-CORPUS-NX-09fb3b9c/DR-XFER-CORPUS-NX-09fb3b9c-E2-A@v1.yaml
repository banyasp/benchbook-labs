case:
  id: DR-XFER-CORPUS-NX-09fb3b9c-E2-A@v1
  title: Diverted Controlled Items
  status: draft
  setting: Export Licensing Directorate, Republic of Ardin, 2022; controlled navigation-component export licensing.
  decider: Export Licensing Directorate
  agent: Export Licensing Directorate
  agent_role: decide
  situation: The Export Licensing Directorate has issued licenses to a foreign end user for controlled navigation components,
    and pending and future licenses to that end user are under review. A trade-press investigation reports that the end user
    diverted licensed components to an unauthorized military buyer. The investigation also reports that the Directorate's
    own end-use check confirmed licensed components at an unlisted facility. The end user denies the allegations, some trade-compliance
    experts doubt the diversion account, and the end user's government calls the report unfounded. The Directorate must decide
    how to handle the licensing relationship on the record currently available.
  question: What should the Export Licensing Directorate do about pending and future licenses to the end user?
  options:
    O1:
      do: The Export Licensing Directorate should continue licensing to the end user.
      move: act
      irreversible: false
    O2:
      do: The Export Licensing Directorate should request an outside technical assessment before deciding.
      move: ask
      irreversible: false
      to: outside technical assessors
    O3:
      do: The Export Licensing Directorate should suspend licensing to the end user.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A trade-press investigation reported allegations that a licensed foreign end user diverted controlled navigation
      components to an unauthorized military buyer.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Export Licensing Directorate had issued licenses to the end user for controlled navigation components.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The trade-press investigation reported that the Directorate's own end-use check confirmed licensed components at
      an unlisted facility.
  - id: F4
    kind: situation
    status: confirmed
    fact: The end user denied the diversion allegations.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Some trade-compliance experts expressed doubt about the reported diversion account.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The end user's government called the trade-press report unfounded.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: security_risk
    favors:
    - O3
    weight: strong
    why: The Directorate's own end-use check was reported to have confirmed licensed components at an unlisted facility. If
      that finding is accurate, continuing to license the end user would leave the reported diversion concern unresolved.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The end user denied the allegations, and trade-compliance experts and the end user's government expressed skepticism.
      Those disagreements counsel against treating the allegations as uncontested, but do not themselves disprove the reported
      finding from the Directorate's own end-use check.
  - id: C3
    facts:
    - F3
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The gap between the Directorate's reported confirmation and the recorded skepticism gives a reason to seek an additional
      assessment before deciding whether to continue licensing.
  reasoning:
    read: This is a licensing decision made amid a reported diversion finding, not an uncontested finding of wrongdoing. The
      key tension is the Directorate's reported confirmation from its own end-use check versus the end user's denial and the
      skepticism expressed by trade-compliance experts and the end user's government.
    weighing: The reported confirmation concerning components licensed by the Directorate supports suspending licensing {C1}.
      The denial and skeptical views are relevant counterevidence, and could support continuing or seeking another assessment
      {C2} {C3}; they do not, on the facts given, negate the reported finding from the Directorate's own end-use check. The
      balance supports suspending licensing. It depends on whether the reported confirmation is reliable.
    tradecraft: 'Keep the decision and its record at the licensing level: distinguish the trade-press allegations from the
      reported result of the Directorate''s own end-use check, and record the denial and skeptical views rather than presenting
      the allegation as settled fact. Revisit the licensing decision if credible new evidence materially changes the assessment.'
    uncertainty: The record does not resolve the disagreement or establish the full circumstances of the components' presence
      at the unlisted facility. It reports the Directorate's confirmation while also recording denial and skepticism; the
      finding should therefore not be characterized as uncontested.
    handoff: The Export Licensing Directorate is the licensing decision-maker. Involving outside technical assessors would
      be a reasonable way to address the recorded uncertainty, but the record does not say that the Directorate sought such
      advice as part of its decision.
    tempting_wrong:
      option: O1
      pull: Continue licensing because the end user denied the allegations and trade-compliance experts and its government
        expressed skepticism.
      why_wrong: That response would give the disagreement more weight than the reported finding from the Directorate's own
        end-use check, without evidence here that the finding was disproved.
    rejected:
      O1: Continuing licensing would leave the reported finding concerning components licensed by the Directorate unresolved
        despite the reason it provides to suspend licensing.
      O2: Seeking another assessment could address uncertainty, but the reported confirmation provides a reason to suspend
        licensing on the record currently available.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable subsequent assessment established that the Directorate's reported end-use finding was mistaken.
      then: O1
      why: If the reported confirmation were disproved, the central stated reason supporting suspension would be materially
        weakened.
    would_not_change:
    - id: noflip1
      if: The end user continued to deny the allegations and the same skeptical views remained on record, without new evidence
        resolving the reported end-use finding.
      why: Those positions are already part of the contested record and do not, by themselves, disprove the Directorate's
        reported finding.
    watch_for:
    - id: watch1
      what: A credible new assessment that materially resolves whether licensed components were present at the unlisted facility.
      favors:
      - O1
      - O2
      - O3
      why: The balance turns on the reliability of the reported confirmation, while the record contains contrary views without
        resolving them.
  lesson: When a licensed end user is linked to a serious reported diversion concern, weigh the licensing authority's own
    reported end-use finding against denials and skeptical assessments without treating either side as settled merely by assertion.
    If the central finding is reliable, suspending licensing can be justified despite disagreement; new evidence that resolves
    the finding may change the decision.
  limits: The record gives no detailed explanation of the end-use check, the circumstances of the components' presence at
    the unlisted facility, or the basis for the licensing authority's assessment. This reasoning should not be extended to
    a case where the finding is disproved or where licensing is governed by additional constraints not stated here.
