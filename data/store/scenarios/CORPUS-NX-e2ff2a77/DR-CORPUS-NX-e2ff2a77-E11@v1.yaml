case:
  id: DR-CORPUS-NX-e2ff2a77-E11@v1
  title: Border Crossing Standoff
  status: draft
  setting: A disputed Bolcavian border crossing at night during a military border operation.
  decider: The field commander
  agent: The field commander
  agent_role: decide
  situation: The field commander was at a border crossing where four Arcanian vehicles had been reported. He identified the
    crossing as Bolcavian sovereign territory, while an Arcanian officer said the border was disputed and that his commander
    had directed him there. Higher command had authorized the field commander to make contact, and his orders were to restore
    the border that night. He said he wanted to avoid further deaths and a war that could destroy both homelands. Recent fighting
    had already caused deaths among his personnel and severe losses to his unit.
  question: What should the field commander do about the Arcanian presence at the border crossing?
  options:
    O1:
      do: Permit the Arcanian unit to remain at the crossing and suspend enforcement of the border order.
      move: act
      irreversible: false
    O2:
      do: Prohibit the Arcanian unit from remaining at the crossing and enforce its departure by force.
      move: act
      irreversible: true
    O3:
      do: Seek withdrawal through direct contact and state that the border order will be enforced if the unit remains.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The field commander had been told that four Arcanian vehicles were at the border crossing.
  - id: F2
    kind: situation
    status: assessed
    fact: The field commander identified the crossing as Bolcavian sovereign territory.
  - id: F3
    kind: intelligence
    status: assessed
    fact: An Arcanian officer said the border was disputed and that his commander had directed him to the location.
  - id: F4
    kind: authority
    status: confirmed
    fact: Higher command authorized the field commander to make contact with the Arcanian element.
  - id: F5
    kind: authority
    status: confirmed
    fact: The field commander's orders were to restore the border that night.
  - id: F6
    kind: situation
    status: confirmed
    fact: The field commander said he wanted to avoid further deaths and a war that could destroy both homelands.
  - id: F7
    kind: situation
    status: confirmed
    fact: Recent fighting had caused deaths among the field commander's personnel and severe losses to his unit.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: escalation_control
    favors:
    - O3
    - O1
    weight: strong
    why: The commander said he did not want further deaths or a war that could destroy both homelands, after recent fighting
      had already cost personnel and caused severe losses.
  - id: C2
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O2
    - O3
    weight: strong
    why: His orders were to restore the border that night, so simply allowing the Arcanian unit to remain would set aside
      the assigned task.
  - id: C3
    facts:
    - F3
    - F4
    equity: escalation_control
    favors:
    - O3
    weight: weak
    why: The Arcanian officer said the border was disputed and that his commander had directed him there; higher command had
      authorized contact, making a direct request to withdraw consistent with the available authority and the possibility
      of avoiding immediate force.
  reasoning:
    read: The field commander faced an Arcanian presence in territory he identified as Bolcavian, but the opposing officer
      described the border as disputed and said he had been sent there by his commander. The trap is to treat the order to
      restore the border as requiring immediate force, or to treat the wish to avoid more deaths as permission to abandon
      the order; the commander instead made withdrawal the first step and stated the consequence if the unit stayed.
    weighing: 'Avoiding more deaths and a potentially destructive war weighed against immediate force, especially after the
      recent losses. But the order to restore the border ruled against simply permitting the unit to remain. Direct contact
      offered a course that addressed both concerns: seek withdrawal, while making clear that the order would be enforced
      if the unit remained. The balance depended on whether the Arcanian unit left.'
    tradecraft: State the territorial position and the withdrawal request plainly, make the consequence of remaining clear,
      and keep the response within the order to restore the border. Record the authority, the exchange, and whether the unit
      withdrew or remained.
    uncertainty: The officer's claim that the border was disputed is not resolved in the exchange, and the excerpt ends with
      him saying he will check his maps. It does not establish whether the unit ultimately withdrew.
    handoff: The field commander could make the contact under higher command's authorization and had an order governing the
      objective. The excerpt does not indicate that he referred the immediate choice to another authority.
    tempting_wrong:
      option: O2
      pull: The order was to restore the border that night, and the commander had authority to make contact.
      why_wrong: Immediate force would bypass the direct withdrawal request even though the commander expressly wanted to
        avoid further deaths and a wider war; he made enforcement conditional on the unit remaining.
    rejected:
      O1: He did not choose to let the unit remain because that would set aside his order to restore the border that night.
      O2: He did not choose immediate force as the first step, instead seeking withdrawal while warning that the order would
        be enforced if the unit stayed.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Arcanian unit remained at the crossing after the commander returned to his vehicle.
      then: O2
      why: The commander stated that if the unit was still there, he would do his duty under the order to restore the border.
    would_not_change:
    - id: noflip1
      if: The Arcanian officer continued to say that the border was disputed and that his commander had directed him there.
      why: That claim was already part of the exchange; by itself it did not displace the field commander's order to restore
        the border or his choice to seek withdrawal first.
    watch_for:
    - id: watch1
      what: Whether the officer's map check leads the unit to withdraw.
      favors:
      - O3
      why: A withdrawal would achieve the border-restoration objective without the force the commander hoped to avoid.
  lesson: When an order must be carried out but immediate force risks avoidable deaths and escalation, seek a clear, direct
    resolution first if the authority and circumstances allow it. Make the consequence of noncompliance explicit, and let
    the response determine whether further enforcement is necessary.
  limits: This reasoning depends on the commander having authority to make contact, an applicable order to restore the border,
    and a plausible opportunity for the other unit to withdraw. It does not resolve the underlying territorial dispute or
    establish what action is lawful in a different operational or legal setting.
