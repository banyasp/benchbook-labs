case:
  id: DR-CORPUS-NX-d0b5f78d-E1@v1
  title: Redirecting the Main Effort
  status: draft
  setting: Battlefield, during fluid combat, under MCDP 1 Warfighting doctrine.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: The main effort has struck an enemy strength, while another unit has located a possible weakness. The weakness
    may be temporary, and the decision to classify a position as a strength or weakness requires judgment. An apparent weakness
    may be misleading. The Commander must decide whether to shift the main effort and redirect combat power or keep the existing
    effort in place.
  question: What should the Commander do about the designation of the main effort and the allocation of combat power?
  options:
    O1:
      do: The Commander shifts the main effort to the second unit and redirects combat power to it.
      move: act
      irreversible: false
    O2:
      do: The Commander retains the main effort with the original unit and keeps combat power assigned there.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The main effort has struck an enemy surface.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Another unit has located a gap.
  - id: F3
    kind: situation
    status: confirmed
    fact: Gaps are rarely permanent and are usually fleeting.
  - id: F4
    kind: capability
    status: confirmed
    fact: Focusing effort on enemy weakness rather than strength is described as more likely to yield decisive results and
      reduce casualties.
  - id: F5
    kind: capability
    status: confirmed
    fact: Exploiting a fleeting gap demands flexibility and speed.
  - id: F6
    kind: situation
    status: confirmed
    fact: Whether something is a surface or a gap depends on the circumstances and requires judgment.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The enemy may disguise dispositions to lure an opposing force toward an apparent gap that is actually a surface.
  - id: F8
    kind: capability
    status: confirmed
    fact: Commanders rely on subordinate initiative and flexibility to respond to opportunities rather than blindly following
      predetermined schemes.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Whether a position is a gap or a surface requires judgment, and an apparent gap may be a deception; the Commander
      should not treat the assessment as certain.
  - id: C2
    facts:
    - F2
    - F3
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Gaps are usually fleeting, and exploiting one calls for flexibility and speed, supporting a prompt shift when the
      assessed opportunity is judged genuine.
  - id: C3
    facts:
    - F1
    - F4
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The current effort has struck an enemy strength, while focusing on weakness is more likely to produce decisive results
      and reduce casualties.
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The doctrine calls for flexibility in responding to opportunities rather than adhering blindly to a predetermined
      effort; it gives the example of making the unit that found a gap the main effort and redirecting combat power to it.
  reasoning:
    read: 'The main effort has met an enemy strength, while another unit has assessed that it found a weakness. The key trap
      is treating that assessment as conclusive: what counts as a gap depends on circumstances, and an apparent gap may be
      misleading.'
    weighing: The caution in {C1} matters because the classification requires judgment, but it does not outweigh the recommendation
      to exploit a genuine opportunity before it disappears. Because gaps are usually fleeting {C2}, and concentrating on
      weakness rather than strength is more likely to yield decisive results while reducing casualties {C3}, the balance favors
      shifting the main effort and redirecting combat power {C4}. That balance depends on the Commander judging the assessed
      gap to be a real weakness rather than a disguised strength.
    tradecraft: Make the designation and allocation decision promptly, state the judgment supporting the classification, and
      record why the opportunity warrants changing the main effort. Reassess the decision if the underlying judgment changes.
    uncertainty: Gaps are rarely permanent and are usually fleeting, while an apparent gap may be a disguised enemy strength
      intended to lure an opposing force.
    handoff: The Commander makes the designation decision, relying on subordinate initiative to identify opportunities while
      retaining responsibility for judging and responding to them.
    tempting_wrong:
      option: O2
      pull: Keeping the original effort avoids acting on an uncertain assessment that could be misleading.
      why_wrong: That caution should inform the judgment, not become a reason to follow the existing effort blindly when a
        genuine, fleeting weakness offers a better opportunity.
    rejected:
      O2: The doctrine does not favor persisting with an effort against enemy strength when another unit has located a genuine
        gap that can be exploited.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Commander judges that the apparent gap is actually an enemy strength or a misleading lure.
      then: O2
      why: The reason for shifting is to exploit weakness; if the position is instead a strength, that rationale no longer
        supports the shift.
    would_not_change:
    - id: noflip1
      if: The original unit has already struck the enemy strength.
      why: That fact alone does not make continuing against the strength preferable to exploiting a genuine gap.
    watch_for:
    - id: watch1
      what: Whether the assessed weakness withstands the Commander’s contextual judgment and is not a disguised strength.
      favors:
      - O2
      why: An apparent gap may be misleading, so this uncertainty can affect whether the shift is justified.
  lesson: When a genuine weakness offers a fleeting opportunity, do not remain committed to an effort against enemy strength
    merely because it was predetermined. Use judgment to distinguish a real gap from a misleading appearance, then be flexible
    enough to redirect the effort.
  limits: This recommendation depends on the Commander’s judgment that the assessed position is a genuine gap; it does not
    establish that the assessment in this scenario is correct. It addresses the designation of the main effort and allocation
    of combat power, not the methods of finding or exploiting a position.
  library:
    domain: operational-command
    family: CORPUS-NX-d0b5f78d
    source: https://www.marines.mil/Portals/1/Publications/MCDP%201%20Warfighting%20GN.pdf
