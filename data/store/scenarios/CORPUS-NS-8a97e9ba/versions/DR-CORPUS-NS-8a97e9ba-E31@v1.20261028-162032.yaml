case:
  id: DR-CORPUS-NS-8a97e9ba-E31@v1
  title: Survivors After the Huon Gulf Battle
  status: draft
  setting: Huon Gulf, 4–5 March 1943; Allied command during the aftermath of the battle.
  decider: The Allied command issuing orders to aircrews
  agent: The Allied command issuing orders to aircrews
  agent_role: decide
  situation: The convoy had been destroyed, and Japanese survivors were in the water, in lifeboats and on rafts. Some survivors
    were aboard barges or other craft, and some continued to fire on Allied aircraft. Allied troops could face survivors who
    reached land and remained armed. The command had to decide how to treat survivors who were no longer resisting, including
    people who were shipwrecked. Article 16 of Hague Convention X concerned sick, wounded and shipwrecked people.
  question: What should the Allied command issuing orders to aircrews do about attacks on survivors in the water, distinguishing
    those still fighting from shipwrecked people who were no longer resisting?
  options:
    O1:
      do: The Allied command would prohibit attacks on survivors in the water who were not resisting.
      move: act
      irreversible: true
    O2:
      do: The Allied command would authorize attacks on survivors in the water who were not resisting.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The battle's aftermath involved survivors from the convoy in the waters of the Huon Gulf.
  - id: F2
    kind: situation
    status: confirmed
    fact: Many survivors were in lifeboats, on rafts or debris, or floating or swimming; some would have been classified as
      shipwrecked.
  - id: F3
    kind: situation
    status: confirmed
    fact: Some survivors reached barges or launches that remained afloat after the transports sank.
  - id: F4
    kind: situation
    status: confirmed
    fact: Some personnel in non-life-raft vessels continued to fire on Allied aircraft.
  - id: F5
    kind: situation
    status: confirmed
    fact: Orders were issued during 4 and 5 March for aircrews to attack survivors in the water, in lifeboats and on rafts,
      as well as any rescue vessels that appeared.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The stated rationale was that survivors reaching land could fight Allied troops if they were still armed.
  - id: F7
    kind: authority
    status: confirmed
    fact: Article 16 of Hague Convention X addressed Japanese sick, wounded and shipwrecked people.
  - id: F8
    kind: authority
    status: assessed
    fact: Strafing survivors in the water who had not attempted to continue fighting was assessed as prima facie not compliant
      with Article 16 of Hague Convention X.
  considerations:
  - id: C1
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Article 16 addressed sick, wounded and shipwrecked people, and strafing survivors who had not continued fighting
      was assessed as prima facie noncompliant with it.
  - id: C2
    facts:
    - F2
    - F7
    equity: hors_de_combat
    favors:
    - O1
    weight: strong
    why: Many survivors were in lifeboats, on rafts or debris, or floating or swimming; some would have been shipwrecked.
      Their being in distress and no longer resisting supports protecting them from attack.
  - id: C3
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Some craft could have military value, and some personnel in non-life-raft vessels continued firing. That supports
      distinguishing active resistance and military targets from nonresisting people in the water; it does not justify attacks
      on the latter.
  - id: C4
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The stated operational rationale was to prevent survivors from reaching land and fighting Allied troops if still
      armed. That concern weighs in favor of stopping combatants who continue the fight, but is conditional and does not resolve
      the treatment of nonresisting shipwrecked people.
  reasoning:
    read: The decision is not simply whether to prevent enemy forces from reinforcing on land. It is whether that operational
      aim permits attacking people who are shipwrecked and no longer resisting. The trap is treating every survivor as a continuing
      threat because some armed survivors might fight if they reached shore.
    weighing: The stated rationale for the orders was that survivors reaching land could fight Allied troops {C4}. Some craft
      had military value, and some personnel continued firing, so those cases must be distinguished from survivors who were
      not resisting {C3}. For the latter, the Article 16 concern and their shipwrecked status weigh strongly against attack
      {C1} {C2}; strafing them was assessed as prima facie noncompliant. The balance therefore favors prohibiting attacks
      on nonresisting survivors, without treating the protection as covering those who continue to fight.
    tradecraft: 'State the prohibition clearly at command level: do not attack survivors who are not resisting, while preserving
      the distinction for personnel who are actively continuing the fight. Record the legal basis and the distinction used
      to make the decision.'
    uncertainty: The assessment is stated as prima facie, not as a final adjudication of every individual case. The available
      account distinguishes some active resistance and military-value craft from nonresisting survivors but does not establish
      the status of every person or craft.
    handoff: The command should make the decision with legal advice because Article 16 and the distinction between active
      resistance and shipwrecked nonresistance are central to the assessment.
    tempting_wrong:
      option: O2
      pull: The orders were justified by the risk that still-armed survivors reaching land could fight Allied troops.
      why_wrong: That conditional threat does not make nonresisting, shipwrecked people legitimate targets; attacks on survivors
        who had not continued fighting were assessed as prima facie inconsistent with Article 16.
    rejected:
      O2: The command should not authorize attacks on survivors who are not resisting, because such attacks were assessed
        as prima facie noncompliant with Article 16.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The decision concerned personnel demonstrably continuing to fire, rather than survivors who were no longer resisting.
      then: O2
      why: Attacks on personnel in craft who continued firing could be legitimate; the decision would then concern active
        resistance, not authorization to attack nonresisting shipwrecked people.
    would_not_change:
    - id: noflip1
      if: Survivors might fight Allied troops if they reached land while still armed.
      why: That was the stated rationale for the orders, but it does not remove the Article 16 concern for survivors who were
        shipwrecked and had not continued fighting.
    watch_for:
    - id: watch1
      what: Evidence that particular survivors or personnel in craft continued firing on Allied aircraft.
      favors:
      - O2
      why: Some attacks on personnel who continued firing could be legitimate, but that does not support attacking nonresisting
        survivors as a group.
  lesson: Do not extend a valid operational concern about combatants who may resume fighting to people who are shipwrecked
    and no longer resisting. Apply the relevant protection to that group, while distinguishing those who continue to fight.
  limits: This reasoning concerns attacks on survivors in the aftermath of this battle and the assessment under Article 16
    of Hague Convention X. It does not decide the treatment of personnel who are actively continuing the fight or establish
    the status of every survivor or craft.
