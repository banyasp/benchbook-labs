case:
  id: DR-CORPUS-NS-8a97e9ba-E58@v1
  title: Warning Shots Under the Rules of Engagement
  status: draft
  setting: Outside the wire during military operations; date and service not specified.
  decider: Personnel applying the rules of engagement
  agent: Personnel applying the rules of engagement
  agent_role: decide
  situation: Personnel operating outside the wire sometimes regarded the rules of engagement as poorly suited to the tasks
    they faced. The applicable rules prohibited warning shots. In a described situation, a young child was moving toward a
    discarded hazardous item. Personnel believed a warning shot could save lives in circumstances where the apparent alternatives
    were lethal force or inaction. Lethal force was legally permitted in the described circumstances, but personnel regarded
    it as ethically unjustified. The rules of engagement were also described as permissive in many situations.
  question: What should the personnel do about force under the applicable rules of engagement in the child-hazard situation?
  options:
    O1:
      do: The personnel withhold warning shots and lethal force.
      move: act
      irreversible: false
    O2:
      do: The personnel use warning shots and withhold lethal force.
      move: act
      irreversible: true
    O3:
      do: The personnel withhold warning shots and use lethal force.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Personnel routinely operated outside the wire.
  - id: F2
    kind: situation
    status: assessed
    fact: Personnel sometimes felt the rules of engagement were inappropriate for the tasks they faced.
  - id: F3
    kind: authority
    status: confirmed
    fact: The rules of engagement prohibited warning shots.
  - id: F4
    kind: situation
    status: assessed
    fact: Personnel believed a warning shot could save lives in some circumstances.
  - id: F5
    kind: situation
    status: assessed
    fact: A described situation involved a young child moving toward a discarded hazardous item.
  - id: F6
    kind: situation
    status: assessed
    fact: In the described circumstances, lethal force was legally permitted but personnel considered it ethically unjustified.
  - id: F7
    kind: situation
    status: assessed
    fact: Personnel understood the practical alternatives in some situations as lethal force or inaction.
  - id: F8
    kind: authority
    status: assessed
    fact: The rules of engagement were permissive in many situations.
  considerations:
  - id: C1
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O1
    - O3
    weight: strong
    why: The applicable ROE prohibited warning shots, so using them meant acting contrary to the rule.
  - id: C2
    facts:
    - F4
    - F5
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Personnel believed a warning shot could save lives in the described situation involving a young child approaching
      a hazardous item.
  - id: C3
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Although lethal force was legally permitted, personnel considered using it ethically unjustified in these circumstances.
  - id: C4
    facts:
    - F3
    - F8
    equity: policy_compliance
    favors:
    - O1
    - O3
    weight: weak
    why: The rules were permissive in many situations, which cautions against treating this case as a reason to relax or disregard
      the ROE generally.
  reasoning:
    read: 'The decision is whether to use force under the applicable ROE when personnel see a child moving toward a hazardous
      item. The trap is treating the choice as only lethal force or inaction: personnel believed a warning shot could save
      lives, even though the ROE prohibited it.'
    weighing: The prohibition weighs against warning shots {C1}, and the ROE's general permissiveness counsels against turning
      this case into a general relaxation of the rules {C4}. In this particular situation, however, personnel believed a warning
      shot could save lives {C2}, while lethal force, though legally permitted, was considered ethically unjustified {C3}.
      The assessment describes deliberate subversion of the rule as necessary to do the right thing in cases where the rule
      did not make sense; the balance depends on those particular circumstances, not on a general license to disregard the
      ROE.
    tradecraft: Keep the decision confined to the immediate circumstances and distinguish the assessed ethical need from the
      fact that the ROE prohibits the option. Record the circumstances and the reason for the decision, and do not treat this
      case as authority to relax the ROE generally.
    uncertainty: The account gives the personnel's assessment and describes cases of warning shots, but does not establish
      that a warning shot would always save lives or specify a general exception to the prohibition.
    handoff: The account does not identify a separate approving authority for this decision. Where time permits, seek clarification
      through the chain of command; that is a decision-process safeguard, not a basis for assuming the ROE allowed warning
      shots.
    tempting_wrong:
      option: O3
      pull: Lethal force was legally permitted, and the ROE prohibited warning shots.
      why_wrong: 'The assessment distinguishes legal permission from ethical justification: personnel considered lethal force
        ethically unjustified in this situation and regarded the warning shot as a way to avoid it.'
    rejected:
      O1: Withholding both forms of force would avoid violating the warning-shot prohibition, but does not reflect the assessment
        that a warning shot could save lives in the described circumstances.
      O3: Using lethal force would remain within the stated legal permission, but personnel considered it ethically unjustified
        and the assessment describes warning shots in such cases as a way to do the right thing.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The child were not moving toward the hazardous item and there were no comparable immediate risk to life.
      then: O1
      why: Without the specific life-saving concern that made warning shots seem necessary, the justification for departing
        from the prohibition would no longer apply.
    - id: flip2
      if: Personnel did not reasonably believe a warning shot could save lives in the circumstances.
      then: O1
      why: The justification for using a prohibited warning shot depends on personnel believing it could avoid the ethically
        unjustified use of lethal force and save lives.
    would_not_change:
    - id: noflip1
      if: Lethal force is legally permitted under the ROE.
      why: 'Legal permission alone would not resolve the ethical concern: the described personnel still considered lethal
        force unjustified in this situation.'
    watch_for:
    - id: watch1
      what: The ROE are permissive in many situations.
      favors:
      - O1
      - O3
      why: That circumstance cautions against generalizing this case into a broader relaxation of the rules.
  lesson: A rule's prohibition matters, but legal permission to use lethal force does not by itself make that force ethically
    justified. Where personnel assess that following the rule would force an ethically unjustified outcome and a less harmful
    course could save lives, a narrow departure may be necessary—without endorsing general relaxation of the rules.
  limits: This reasoning applies to the described circumstances and the personnel's belief that a warning shot could save
    lives while lethal force was ethically unjustified. It does not establish a general exception to the ROE or apply where
    those circumstances are absent.
