case:
  id: DR-CORPUS-NX-da10c40f-E4@v1
  title: Senate Vote on Gulf Deployment Authorization
  status: draft
  setting: United States Senate, December 1990
  decider: The Senators voting on the resolution
  agent: The Senators voting on the resolution
  agent_role: decide
  situation: In December 1990, the United States Senate was considering a resolution authorizing the President to send U.S.
    troops to the Persian Gulf. For weeks before the vote, the Senate Intelligence Committee received almost daily briefings
    from Intelligence Community representatives. A senior DIA analyst principally delivered the briefings, with other Community
    representatives also involved. The briefings described Iraqi forces as the most advanced in the region and battle-tested
    by eight years of war with Iran. They warned that Iraqi forces would use chemical and biological weapons against coalition
    forces and assessed that the conflict would likely last at least six months and cause many casualties.
  question: What should the Senators do on the resolution authorizing the President to send troops to the Persian Gulf?
  options:
    O1:
      do: The Senators vote to approve the resolution authorizing the President to send troops to the Persian Gulf.
      move: act
      irreversible: false
    O2:
      do: The Senators vote to reject the resolution authorizing the President to send troops to the Persian Gulf.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Senate was voting on a resolution authorizing the President to send U.S. troops to the Persian Gulf in December
      1990.
  - id: F2
    kind: situation
    status: confirmed
    fact: For weeks before the vote, the Senate Intelligence Committee received almost daily briefings from Intelligence Community
      representatives.
  - id: F3
    kind: situation
    status: confirmed
    fact: A senior DIA analyst principally delivered the briefings, with other Intelligence Community representatives also
      involved.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The briefings characterized the Iraqi military as the most advanced in that part of the world.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The briefings characterized the Iraqi military as battle-tested by eight years of war with Iran.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The briefings warned that Iraqi forces would use chemical and biological weapons against coalition forces.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The briefings assessed that the conflict would likely last at least six months and involve many casualties.
  - id: F8
    kind: situation
    status: confirmed
    fact: The chairs of the Senate intelligence and armed services committees were among the Senators voting on the resolution.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The briefings portrayed Iraqi forces as exceptionally capable and battle-tested, giving the Senators reason to take
      the danger to coalition personnel seriously.
  - id: C2
    facts:
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The warning that Iraqi forces would use chemical and biological weapons against coalition forces weighed against
      authorizing deployment.
  - id: C3
    facts:
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The assessment of a conflict lasting at least six months with many casualties supplied a further reason to reject
      the resolution.
  reasoning:
    read: The Senators faced intelligence warnings about Iraqi military strength, chemical and biological weapons, and a long,
      casualty-heavy conflict. The trap is judging their vote only by the much shorter conflict and lower casualties that
      followed, rather than by the forecasts they had when deciding.
    weighing: 'The stated basis for the negative votes was largely the dire set of forecasts: Iraqi forces were described
      as highly capable and battle-tested, and the expected conflict threatened coalition forces with chemical and biological
      weapons, many casualties, and a duration of at least six months {C1} {C2} {C3}. The later outcome made the Senators
      feel misled and left some politically harmed, but that hindsight does not change what the briefings led them to weigh
      at the time.'
    tradecraft: As a decision practice, separate assessed forecasts from established outcomes, identify which forecasted harms
      are driving the vote, and preserve a clear record of how the briefings informed the decision.
    uncertainty: The forecasts were expressed as assessments, including that a prolonged conflict was likely; the account
      does not establish their certainty or give the Senators contrary forecasts to compare. The eventual short conflict shows
      that the predictions were not borne out, but was not information available at the vote.
    handoff: The Senators held the decision on the resolution. The committee briefings informed them, but the account identifies
      no further authority to whom the vote should have been referred.
    tempting_wrong:
      option: O1
      pull: The coalition's rapid success and relatively few American casualties make approval appear obvious in retrospect.
      why_wrong: Those outcomes were not known at the time; relying on them would substitute hindsight for the serious forecasts
        the Senators received.
    rejected:
      O1: The Senators did not approve because the briefings' warnings of Iraqi capability, chemical and biological weapons,
        and a prolonged, casualty-heavy conflict weighed against deployment.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Senators had instead received credible assessments that Iraqi forces were unlikely to use chemical or biological
        weapons and that the conflict was likely to be short with few casualties.
      then: O1
      why: Those assessments would remove or substantially reduce the principal threats that the briefings gave as reasons
        to reject authorization.
    would_not_change:
    - id: noflip1
      if: The coalition later achieved air superiority and the ground war ended quickly with relatively few American casualties.
      why: That later outcome would not alter what the Senators had been told and could reasonably consider when casting their
        votes.
    watch_for:
    - id: watch1
      what: Whether the Senators receive materially different assessments of Iraqi capability, weapons use, likely conflict
        duration, or likely casualties before voting.
      favors:
      - O1
      - O2
      why: Those were the forecasted risks the source identifies as bearing on the Senators' votes.
  lesson: Assess a decision using the information available when it is made, not solely by the outcome that follows. When
    forecasts drive a consequential vote, keep clear which assessed risks support the decision and how heavily they are being
    relied upon.
  limits: This reasoning addresses the Senators' vote in light of the forecasts described in the account. It does not resolve
    what intelligence the executive branch should have provided, nor does the account supply a general legal test for authorizing
    deployment.
