case:
  id: DR-CORPUS-NX-da10c40f-E5@v1
  title: CIA Treaty Briefing Request
  status: draft
  setting: At the time of an administration request; CIA and Members of Congress.
  decider: CIA
  agent: CIA
  agent_role: decide
  situation: The administration has asked CIA to brief undecided Members of Congress on a treaty. Implementing the treaty
    requires Congressional action. The intelligence supports the administration's position in favor of the treaty. Members
    on both sides of the aisle have encouraged undecided colleagues to obtain a CIA briefing. CIA must decide whether to provide
    the requested briefings or withhold them.
  question: What should CIA do about the administration's request to brief undecided Members of Congress on the treaty?
  options:
    O1:
      do: CIA provides treaty briefings to undecided Members of Congress.
      move: act
      irreversible: true
    O2:
      do: CIA withholds treaty briefings from undecided Members of Congress.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The administration requested that CIA provide briefings on a treaty.
  - id: F2
    kind: situation
    status: assessed
    fact: The requested audience was undecided Members of Congress.
  - id: F3
    kind: situation
    status: assessed
    fact: The briefings concerned a treaty.
  - id: F4
    kind: authority
    status: assessed
    fact: Implementing the treaty required Congressional action.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The intelligence supported the administration's position in favor of the treaty.
  - id: F6
    kind: situation
    status: assessed
    fact: Members on both sides of the aisle encouraged undecided colleagues to obtain a CIA briefing.
  considerations:
  - id: C1
    facts:
    - F6
    equity: impartiality
    favors:
    - O1
    weight: weak
    why: Members on both sides of the aisle encouraged undecided colleagues to obtain the briefing, which supports treating
      access as more than an administration-driven effort.
  - id: C2
    facts:
    - F1
    - F2
    - F5
    equity: impartiality
    favors:
    - O1
    weight: weak
    why: The briefers avoided policy prescriptions, a restraint that helped keep an intelligence briefing distinct from advocacy
      for the treaty.
  - id: C3
    facts:
    - F2
    - F5
    equity: impartiality
    favors:
    - O2
    weight: weak
    why: Because the intelligence supported the administration's position, briefing undecided Members carried a risk of appearing
      to influence the treaty vote; a Member's later remark that the initiative had produced two votes sharpened that concern.
  reasoning:
    read: This was an intelligence briefing requested while Congress had to act on a treaty, not a CIA decision on whether
      the treaty deserved approval. The trap is that accurate intelligence favoring the administration could function as political
      advocacy in the eyes of Members, even if analysts avoided recommending a policy outcome.
    weighing: CIA provided the briefings, relying on encouragement from Members across party lines and the briefers' care
      to avoid policy prescriptions. Those reasons support {O1}, while the intelligence's alignment with the administration
      and the Member's vote-counting remark raise an impartiality concern {C3}. The balance favors {O1} on the stated safeguards
      and bipartisan interest, but depends on the briefings remaining non-prescriptive rather than becoming advocacy.
    tradecraft: Keep the briefing focused on intelligence and clearly separate analytic judgments from policy preferences.
      Record the basis for access and the non-prescriptive scope, and avoid presenting the briefing as support for a vote.
    uncertainty: The account does not establish how the intelligence was presented, whether access was offered on equal terms
      to all interested Members, or whether the observed vote effect reflected the briefing's content. It records the CIA's
      stated justifications and one Member's reaction, not a formal finding about propriety.
    handoff: CIA should make the decision institutionally rather than treat the administration's request as dispositive; involving
      appropriate analytic and congressional-affairs leadership would help preserve the distinction between intelligence and
      policy advocacy.
    tempting_wrong:
      option: O2
      pull: Withholding avoids the appearance that CIA is helping the administration secure votes on a treaty.
      why_wrong: That concern matters, but withholding would discount the cross-party encouragement and the briefers' stated
        restraint without evidence in this account that they prescribed a policy outcome.
    rejected:
      O2: CIA did not withhold the briefings, relying instead on bipartisan Member interest and the briefers' avoidance of
        policy prescriptions.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Members across party lines were not encouraging undecided colleagues to seek the briefing, leaving the administration's
        request as the only stated basis for it.
      then: O2
      why: Without the cross-party interest, the concern that CIA was serving the administration's political objective would
        weigh more heavily.
    - id: flip2
      if: The briefers prescribed a policy outcome rather than limiting themselves to intelligence.
      then: O2
      why: That would remove the restraint CIA relied on to distinguish briefing from advocacy.
    would_not_change:
    - id: noflip1
      if: The intelligence continued to support the administration's position.
      why: That alignment is a reason for care, but by itself did not prevent CIA from providing briefings when Members across
        party lines sought them and analysts avoided policy prescriptions.
    watch_for:
    - id: watch1
      what: A recipient characterizes the briefing as having secured votes for one side.
      favors:
      - O2
      why: That reaction signals a risk that an ostensibly analytic briefing is being perceived as political persuasion and
        warrants renewed scrutiny of its neutrality.
  lesson: When intelligence relevant to a pending legislative choice supports the administration's position, a briefing can
    be mistaken for—or become—policy advocacy. Bipartisan interest and restraint from policy prescriptions support providing
    information, but only while the briefing remains genuinely analytic and non-prescriptive.
  limits: This reasoning addresses whether CIA should provide the requested briefings, not whether Congress should approve
    the treaty. The account does not establish a binding legal rule or resolve questions about equal access, briefing content,
    or later effects on Members' votes.
  library:
    domain: intel-oversight
    family: CORPUS-NX-da10c40f
    source: https://www.cia.gov/resources/csi/static/de4af1b9c7866e866a71c8da95be003b/sharing-secrets-with-lawmakers-congress-as-a-user-of-intelligence.pdf
    episode_focus: The administration requested briefings for undecided Members on a treaty, and the intelligence happened
      to support the administration’s position. CIA agreed to provide the briefings; the stated justifications were that Members
      across party lines were also encouraging colleagues to seek them and that analysts avoided policy prescriptions. Exclude
      the separate question of whether the treaty itself should be approved.
    cues:
      option_words:
        O2: 9
        O1: 9
      real_option: O1
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: true
    equities: pilot2
verdict_tier: source-endorsed
basis: CIA accommodated the request by agreeing to provide briefings, citing encouragement from Members on both sides of the
  aisle and the briefers' care to avoid policy prescriptions.
