case:
  id: DR-OHA-26-0118-addfact1@v1
  title: Restoration of Security Clearance for DOE Contractor [addfact]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, August 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office issued a Notification Letter raising security concerns under Guideline F (financial
    considerations) and Guideline E (personal conduct). The Individual, a DOE contractor employee in the nuclear-safety division,
    has been employed for eight years in a position that requires a security clearance. In April 2025 he deposited $11,535
    and $15,040 in cash at a casino. He also has nine credit-card accounts delinquent for more than 120 days, with balances
    totaling $64,171. His indebtedness arose in part from gambling financed with personal loans, credit-card advances, and
    withdrawals from retirement accounts. DOE determined that he provided false or misleading information about his financial
    history during the July 2025 interview and the December 2025 Letter of Interrogatories. DOE Order 472.2A requires reporting
    of financial anomalies—such as debts older than 120 days or asset infusions over $10,000—within three working days. The
    Individual failed to report a 2019 foreclosure and two settlements amounting to $120,000 received in 2021 and 2022, as
    required.
  question: How should the Administrative Law Judge rule on the Individual's access authorization?
  options:
    O1:
      do: Order the Local Security Office to conduct a further investigation.
      move: ask
      irreversible: false
    O2:
      do: Refuse to restore the Individual's security clearance authorization.
      move: act
      irreversible: true
    O3:
      do: Approve restoration of the Individual's security clearance authorization.
      move: act
      irreversible: true
    O4:
      do: Suspend the decision pending additional financial documentation from the Individual.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual works for a DOE contractor in a role that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In April 2025 the Individual made cash deposits of $11,535 and $15,040 at a casino.
  - id: F3
    kind: situation
    status: confirmed
    fact: He has nine credit-card accounts that have been delinquent for more than 120 days, with a combined balance of $64,171.
  - id: F4
    kind: situation
    status: confirmed
    fact: The indebtedness stems partly from gambling financed through personal loans, credit-card advances, and withdrawals
      from retirement accounts.
  - id: F5
    kind: intelligence
    status: assessed
    fact: DOE concluded that the Individual gave false or misleading information about his financial history during the July
      2025 interview and in the December 2025 Letter of Interrogatories.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office's Notification Letter cited security concerns under Guideline F (financial considerations)
      and Guideline E (personal conduct).
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE Order 472.2A mandates reporting of financial anomalies—such as debts older than 120 days or asset infusions
      exceeding $10,000—within three working days.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual has been employed by the contractor for eight years, serving in the nuclear-safety division.
  - id: F9
    kind: situation
    status: confirmed
    fact: He failed to report a 2019 foreclosure and two settlements totaling $120,000 received in 2021 and 2022, as required
      by DOE regulations.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Individual's cash deposits of $11,535 and $15,040 at a casino, nine delinquent credit-card accounts totalling
      $64,171, and the reliance on loans and retirement withdrawals to fund gambling reveal a pattern of living beyond his
      means, satisfying Guideline F (Financial Considerations).
  - id: C2
    facts:
    - F5
    - F6
    equity: oversight_candor
    favors:
    - O2
    weight: strong
    why: DOE's finding that the Individual supplied false or misleading statements about his financial history during the
      July 2025 interview and the December 2025 Interrogatory response meets Guideline E (Personal Conduct) because it demonstrates
      deliberate deception.
  - id: C3
    facts:
    - F7
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Failure to report the 2019 foreclosure and two settlements worth $120,000, as required by DOE Order 472.2A, breaches
      reporting obligations and reinforces the security concerns cited under both Guideline E and Guideline F.
  - id: C4
    facts:
    - F8
    equity: national_security
    favors:
    - O2
    weight: weak
    why: Eight years of service in the nuclear‑safety division does not offset the substantial financial and integrity concerns.
  reasoning:
    read: The record establishes a consistent pattern of financial vulnerability, gambling-driven debt, and intentional misrepresentation,
      all of which trigger Guideline F and Guideline E concerns about the Individual's reliability and trustworthiness.
    weighing: Applying the Adjudicative Guidelines, none of the mitigating factors listed in ¶ 20 (Guideline F) or ¶ 17 (Guideline
      E) are satisfied. The misconduct is recent, ongoing, and unremedied; false statements were not corrected voluntarily;
      and reporting failures persist, leading the balance of evidence to favor denial.
    tradecraft: The ALJ issued a formal written decision, citing the relevant sections of 10 C.F.R. § 710, the DOE Adjudicative
      Guidelines, and the specific exhibits, and concluded that the Individual's access authorization must not be restored
      under 10 C.F.R. § 710.7(a).
    uncertainty: There is no credible evidence that the Individual's gambling habit has ceased or that his financial obligations
      will be resolved without further oversight.
    handoff: The decision is final for the OHA; any further appeal must proceed under 10 C.F.R. § 710.28, leaving the ALJ
      as the ultimate authority on this matter.
    tempting_wrong:
      option: O3
      pull: The Individual has begun counseling for gambling and filed for bankruptcy, which could appear to mitigate the
        concerns.
      why_wrong: Counseling commenced only a year before the hearing and the gambling behavior remains recent and frequent;
        granting clearance would contradict the presumption against issuance and the guideline requirements.
    rejected:
      O1: An additional investigation would not alter the established facts of unresolved financial and honesty issues.
      O3: Approving clearance ignores the outstanding delinquent debts, false statements, and ongoing gambling risk identified
        under the guidelines.
      O4: Delaying the decision pending further documentation would extend a known security risk without providing new mitigating
        evidence.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual could demonstrate that all delinquent debts were fully repaid and that his gambling was an isolated,
        past incident unlikely to recur.
      then: O3
      why: If the debts were resolved and gambling proved to be a one-time lapse, the mitigating factor (a) of Guideline F
        and factor (d) of Guideline E would be satisfied, permitting restoration.
    would_not_change:
    - id: noflip1
      if: The Individual continues to rely solely on counseling without concrete proof of debt repayment or cessation of gambling.
      why: Counseling alone, initiated only a year before the hearing, does not establish that gambling will not recur, so
        the mitigating factor remains unmet.
    watch_for:
    - id: watch1
      what: Any future financial statements or reports that demonstrate compliance with DOE Order 472.2A.
      favors:
      - O2
      why: Continued non-reporting would reaffirm the security concerns and support maintaining the denial.
  lesson: When recent, frequent, and unmitigated financial irresponsibility and false reporting are present, the Adjudicative
    Guidelines require denial of clearance; mitigation must be demonstrably complete and sustained before a reversal is possible.
  limits: This analysis applies only to cases where the evidence shows ongoing, uncorrected financial and honesty issues.
    It does not extend to situations where the individual has fully resolved debts, provided truthful disclosures, and exhibited
    long-term behavioral change.
