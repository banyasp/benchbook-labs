case:
  id: DR-OHA-26-0118@v1
  title: Restoration of Security Clearance for DOE Contractor
  status: draft
  setting: DOE Office of Hearings and Appeals, August 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
    for a security clearance under Guideline F (financial considerations) and Guideline E (personal conduct). The Individual,
    a DOE contractor employee, had made large cash deposits at a casino in April 2025 and had multiple delinquent credit accounts
    exceeding 120 days, totaling over $64,000. His financial difficulties were linked to gambling funded by personal loans,
    credit card advances, and withdrawals from retirement accounts, and he provided false or misleading statements about this
    history during interviews. He also failed to report a 2019 foreclosure and two $120,000 settlements as required by DOE
    Order 472.2A. The Administrative Judge must decide whether to restore the Individual’s access authorization after a hearing
    and review of the evidence.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge asks the LSO to investigate further.
      move: ask
      irreversible: false
    O2:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge holds the decision pending further financial documentation.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual deposited $11,535 and $15,040 in cash at a casino in April 2025.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual had nine credit card accounts delinquent for more than 120 days, with balances totaling $64,171.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual’s financial debts were caused in part by gambling funded with personal loans, credit card advances,
      and retirement account withdrawals.
  - id: F5
    kind: intelligence
    status: assessed
    fact: DOE determined the Individual provided false or misleading information about his financial history in the July 2025
      interview and the December 2025 Letter of Interrogatories.
  - id: F6
    kind: situation
    status: confirmed
    fact: The LSO’s Notification Letter raised security concerns under Guideline F and Guideline E.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE Order 472.2A requires reporting of financial anomalies, including debts over 120 days and infusions of assets
      over $10,000, within three working days.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual failed to report a 2019 foreclosure and the receipt of $120,000 settlements in 2021 and 2022 to DOE
      as required.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Individual’s repeated large cash deposits at a casino, nine delinquent credit accounts totaling $64,171, and
      a pattern of borrowing to fund gambling demonstrate a failure to live within his means, triggering Guideline F (Financial
      Considerations).
  - id: C2
    facts:
    - F5
    - F6
    equity: oversight_candor
    favors:
    - O2
    weight: strong
    why: DOE determined the Individual gave false or misleading statements about his financial history in the July 2025 interview
      and the December 2025 Letter of Interrogatories, satisfying Guideline E (Personal Conduct) because of deliberate omission
      and dishonesty.
  - id: C3
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Individual failed to report a 2019 foreclosure and two $120,000 settlements as required by DOE Order 472.2A,
      a reporting breach that the LSO cited as a security concern under both Guideline E and F.
  reasoning:
    read: The record shows a pattern of financial irresponsibility, gambling‑funded debt, and repeated false statements, creating
      substantial doubt under Guideline F and Guideline E that the Individual can be trusted with classified information.
    weighing: The Administrative Judge applied the Adjudicative Guidelines and found that none of the mitigating factors listed
      in ¶ 20 (for Guideline F) or ¶ 17 (for Guideline E) were satisfied. The Individual’s conduct is recent, frequent, and
      not likely to cease; his false statements were not corrected until confronted; and his reporting failures remain unremedied.
      Consequently, the balance of the evidence weighs heavily toward denial.
    tradecraft: The Judge issued a written decision, cited the relevant CFR provisions, the Adjudicative Guidelines, and the
      specific exhibits, and recorded the finding that the access authorization should not be restored, as required by 10 C.F.R. § 710.7(a).
    uncertainty: The judge concludes that there is insufficient evidence that the Individual’s gambling habit will not recur
      and that the financial problems are not resolved.
    handoff: The decision is final for the OHA; any further appeal must follow 10 C.F.R. § 710.28, so the Judge retains sole
      responsibility for this determination.
    tempting_wrong:
      option: O3
      pull: The Individual has begun gambling‑counseling and filed for bankruptcy, which might appear to mitigate the concerns.
      why_wrong: Counseling began only a year before the hearing and the gambling behavior is recent and frequent; granting
        clearance would conflict with the presumption against issuance and the guideline requirements.
    rejected:
      O1: Further investigation would not change the factual findings that the Individual has already been found to have unresolved
        security concerns.
      O3: Granting clearance ignores the unresolved delinquent debts, false statements, and ongoing gambling risk identified
        under the guidelines.
      O4: Holding the decision pending additional documentation would prolong a security risk that the source has already
        determined is unmitigated.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual could demonstrate that all delinquent debts were resolved and that his gambling was a distant, isolated
        incident unlikely to recur.
      then: O3
      why: If the Individual could show that all delinquent debts were resolved and that his gambling was a distant, isolated
        incident unlikely to recur, the mitigating factor (a) of Guideline F and factor (d) of Guideline E would be satisfied,
        allowing clearance.
    would_not_change:
    - id: noflip1
      if: The Individual continues to rely on counseling alone without concrete evidence of debt repayment or cessation of
        gambling.
      why: Because counseling began only a year before the hearing and insufficient time has passed to determine that gambling
        will not recur, the mitigating factor is not met.
    watch_for:
    - id: watch1
      what: Any future financial statements or reporting that show compliance with DOE Order 472.2A.
      favors:
      - O2
      why: Continued non‑reporting would reaffirm the security concerns and support maintaining the denial.
  lesson: When an individual’s financial irresponsibility and false reporting are recent, frequent, and unmitigated, the Adjudicative
    Guidelines require denial of clearance; mitigation must be demonstrably complete and sustained before a reversal is possible.
  limits: This reasoning applies only where the evidence shows ongoing, uncorrected financial and honesty issues; it does
    not address cases where the individual has fully resolved debts, provided truthful disclosures, and shown long‑term behavioral
    change.
