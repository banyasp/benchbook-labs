case:
  id: DR-OHA-26-0118-flip1@v1
  title: Restoration of Security Clearance for DOE Contractor [flip]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, September 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office issued a Notification Letter expressing substantial doubt about the employee's eligibility
    for a security clearance under Guideline F (financial considerations) and Guideline E (personal conduct). The employee,
    a DOE contractor, completed a certified gambling-addiction treatment program in August 2025 and has abstained from gambling
    since. He made a single cash deposit of $26,575 at a casino in April 2025 as part of a one-time charitable fundraiser,
    after which no further casino activity was recorded. By July 2025 he settled the balances on all nine credit-card accounts,
    eliminating the $64,171 owed. His financial difficulties were partly caused by gambling financed with personal loans,
    credit-card advances, and retirement-account withdrawals, and DOE determined he gave false or misleading statements about
    this history during interviews. He also failed to report a 2019 foreclosure and two $120,000 settlements as required by
    DOE Order 472.2A. The Administrative Law Judge must decide whether to restore the employee's access authorization after
    a hearing and review of the evidence.
  question: What should the Administrative Law Judge do regarding the employee's access authorization?
  options:
    O1:
      do: Order the Local Security Office to conduct further investigation.
      move: ask
      irreversible: false
    O2:
      do: Deny the employee's request to restore his access authorization.
      move: act
      irreversible: true
    O3:
      do: Restore the employee's access authorization based on the mitigating evidence.
      move: act
      irreversible: true
    O4:
      do: Hold the decision pending additional financial documentation from the employee.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE-contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual completed a certified gambling‑addiction treatment program in August 2025 and has maintained abstinence
      from gambling activities thereafter.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual made a single combined cash deposit of $26,575 at a casino in April 2025 as part of a one‑time charitable
      fundraiser, after which no further casino transactions were recorded.
  - id: F4
    kind: situation
    status: confirmed
    fact: By July 2025 the Individual had settled the balances on all nine of his credit card accounts, bringing each account
      current and eliminating the $64,171 total owed.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee's financial difficulties were partly caused by gambling that was financed through personal loans, credit-card
      advances, and withdrawals from retirement accounts.
  - id: F6
    kind: intelligence
    status: assessed
    fact: DOE concluded that the employee provided false or misleading information about his financial history during the
      July 2025 interview and the December 2025 Letter of Interrogatories.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Notification Letter from the LSO identified security concerns under Guideline F and Guideline E.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE Order 472.2A mandates reporting of financial anomalies, such as debts over 120 days or asset infusions exceeding
      $10,000, within three working days.
  - id: F9
    kind: situation
    status: confirmed
    fact: The employee did not report a 2019 foreclosure nor the receipt of $120,000 in settlements in 2021 and 2022 to DOE
      as required.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The employee's single cash deposit was a one-time charitable contribution, and all nine credit-card balances have
      been fully paid, eliminating the $64,171 debt; together with the completed treatment program, these facts demonstrate
      financial responsibility and satisfy Guideline F.
  - id: C2
    facts:
    - F6
    - F7
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: DOE determined the employee gave false or misleading statements about his financial history, which ordinarily supports
      Guideline E (Personal Conduct).
  reasoning:
    read: The record shows that the employee has remedied the financial deficiencies that originally triggered Guideline F
      and has completed a certified gambling-addiction treatment program, eliminating the primary security concerns.
    weighing: Applying the Adjudicative Guidelines, the Administrative Law Judge finds that the mitigating factors listed
      in ¶ 20(a) for Guideline F (full debt repayment) and ¶ 17(d) for Guideline E (completed treatment and abstinence) are
      satisfied. Although prior false statements were identified, the employee's subsequent full disclosure and corrective
      actions reduce the weight of that concern.
    tradecraft: The Judge issued a written decision citing the relevant CFR provisions, the Adjudicative Guidelines, and the
      exhibits, and concluded that the balance of evidence now supports restoration of the access authorization under 10 C.F.R.
      § 710.7(a).
    uncertainty: The remaining uncertainty relates to the employee's future conduct, but the substantive remedial actions
      taken provide sufficient assurance of reliability.
    handoff: The decision is final for the OHA; any further appeal must follow 10 C.F.R. § 710.28, leaving the Judge with
      sole responsibility for this determination.
    tempting_wrong:
      option: O2
      pull: The earlier false statements and reporting failures still appear in the record.
      why_wrong: Those issues have been substantially mitigated by full debt repayment, completion of treatment, and a clear
        record of no further gambling activity; denying would ignore the demonstrated remediation.
    rejected:
      O1: Additional investigation would not uncover new facts that alter the substantive remediation already documented.
      O4: Holding the decision pending further documentation would unnecessarily extend a period of uncertainty despite the
        employee's demonstrated compliance.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: If the employee were unable to demonstrate that all delinquent debts had been fully satisfied and that the casino
        deposit was an isolated, charitable event unlikely to recur, then O2 would be the appropriate outcome.
      then: O2
      why: Without full debt repayment and a clear cessation of gambling, the mitigating factors for Guideline F and Guideline
        E would not be met.
    would_not_change:
    - id: noflip1
      if: If the employee relies solely on counseling without concrete evidence of debt repayment or cessation of gambling,
        the mitigating factor remains unmet.
      why: Counseling alone, without demonstrable financial resolution, does not satisfy the guidelines.
    watch_for:
    - id: watch1
      what: Any future financial statements or reporting that show non-compliance with DOE Order 472.2A.
      favors:
      - O2
      why: Continued non-reporting would reaffirm the security concerns and support maintaining the denial.
  lesson: When an individual's financial obligations have been fully satisfied, a gambling-addiction treatment program has
    been completed, and no further gambling activity is evident, the Adjudicative Guidelines permit restoration of clearance;
    mitigation must be concrete, documented, and sustained.
  limits: This conclusion applies only where the evidence demonstrates complete debt repayment, truthful disclosure, and sustained
    abstinence from gambling; it does not extend to cases where financial or honesty issues remain unresolved.
