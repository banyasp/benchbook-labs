case:
  id: DR-OHA-26-0118-restyle1@v1
  title: Restoration of Security Clearance for DOE Contractor [restyle]
  status: needs_review
  setting: Department of Energy, Office of Hearings & Appeals – August 2026
  decider: Presiding Administrative Law Judge
  agent: Presiding Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office issued a notification stating substantial doubt about the employee's eligibility for
    a security clearance under Guideline F (financial considerations) and Guideline E (personal conduct). The employee, a
    DOE contractor staff member, made large cash deposits at a casino in April 2025 and held multiple delinquent credit accounts
    exceeding 120 days, totaling over $64,000. His financial strain stemmed from gambling financed by personal loans, credit-card
    advances, and retirement-account withdrawals, and he supplied false or misleading statements about this history during
    interviews. He also failed to report a 2019 foreclosure and two $120,000 settlements as required by DOE Order 472.2A.
    The Judge must decide whether to restore the employee's access authorization after a hearing and review of the evidence.
  question: What action should the Presiding Administrative Law Judge take concerning the employee's access authorization?
  options:
    O1:
      do: The Judge directs the Local Security Office to conduct additional inquiry.
      move: ask
      irreversible: false
    O2:
      do: The Judge refuses to reinstate the employee's security clearance.
      move: act
      irreversible: true
    O3:
      do: The Judge grants reinstatement of the employee's clearance.
      move: act
      irreversible: true
    O4:
      do: The Judge postpones the ruling until supplemental financial records are submitted.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a Department of Energy contractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In April 2025 the employee made cash deposits of $11,535 and $15,040 at a gaming establishment.
  - id: F3
    kind: situation
    status: confirmed
    fact: He held nine credit-card accounts that were more than 120 days past due, with combined balances of $64,171.
  - id: F4
    kind: situation
    status: confirmed
    fact: His indebtedness stemmed partly from gambling financed through personal loans, credit-card advances, and withdrawals
      from his retirement accounts.
  - id: F5
    kind: intelligence
    status: assessed
    fact: DOE concluded that the employee gave false or misleading statements concerning his financial background during the
      July 2025 interview and the December 2025 Interrogatory response.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office's notification letter identified security concerns under Guideline F and Guideline E.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE Order 472.2A mandates that financial irregularities—such as debts exceeding 120 days or asset infusions above
      $10,000—be reported within three business days.
  - id: F8
    kind: situation
    status: confirmed
    fact: He did not disclose a 2019 foreclosure nor the $120,000 settlement proceeds received in 2021 and 2022, contrary
      to reporting obligations.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Repeated sizable cash deposits at a gaming venue, nine overdue credit accounts totaling $64,171, and a habit of borrowing
      to sustain gambling illustrate an inability to manage personal finances, thereby invoking Guideline F (Financial Considerations).
  - id: C2
    facts:
    - F5
    - F6
    equity: oversight_candor
    favors:
    - O2
    weight: strong
    why: DOE's finding that the employee supplied false or misleading information about his finances during the July 2025
      interview and the December 2025 Interrogatory response satisfies Guideline E (Personal Conduct) due to intentional concealment
      and deceit.
  - id: C3
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: His omission of a 2019 foreclosure and two $120,000 settlements breaches DOE Order 472.2A, a reporting violation
      the LSO flagged as a security concern under both Guideline E and Guideline F.
  reasoning:
    read: The dossier reveals a consistent pattern of fiscal irresponsibility, gambling-driven indebtedness, and repeated
      falsehoods, engendering substantial doubt under Guideline F and Guideline E regarding the employee's reliability with
      classified material.
    weighing: Applying the Adjudicative Guidelines, the Judge determined that none of the mitigating criteria in paragraph
      20 for Guideline F or paragraph 17 for Guideline E were met. The employee's behavior is recent, recurrent, and unlikely
      to abate; his false statements were only corrected under pressure; and his reporting lapses remain unresolved. Accordingly,
      the preponderance of evidence strongly favors denial.
    tradecraft: The Judge rendered a written decision, referencing the applicable CFR sections, the Adjudicative Guidelines,
      and the pertinent exhibits, and entered a finding that the clearance should not be reinstated, in accordance with 10
      C.F.R. § 710.7(a).
    uncertainty: The Judge concludes that evidence is lacking to demonstrate that the employee's gambling propensity will
      not reappear and that his financial issues remain unresolved.
    handoff: The ruling is final within the OHA; any subsequent appeal must proceed under 10 C.F.R. § 710.28, leaving the
      Judge solely accountable for this determination.
    tempting_wrong:
      option: O3
      pull: The employee has entered gambling-rehabilitation counseling and filed for bankruptcy, which could be perceived
        as mitigating the concerns.
      why_wrong: Counseling commenced merely a year before the hearing and the gambling conduct remains recent and frequent;
        restoring clearance would contravene the presumption against issuance and the applicable guideline mandates.
    rejected:
      O1: Additional inquiry would not alter the factual conclusions that the employee already exhibits unresolved security
        concerns.
      O3: Restoring clearance disregards the lingering delinquent debts, false statements, and persistent gambling risk identified
        by the guidelines.
      O4: Deferring the ruling pending further documentation would extend a security risk that the source has already deemed
        unmitigated.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee could prove that every delinquent debt has been satisfied and that his gambling episode was a remote,
        isolated occurrence unlikely to repeat.
      then: O3
      why: Should the employee demonstrate full repayment of delinquent debts and that his gambling was a remote, isolated
        event unlikely to reoccur, mitigating factor (a) of Guideline F and factor (d) of Guideline E would be satisfied,
        permitting clearance.
    would_not_change:
    - id: noflip1
      if: The employee persists in relying solely on counseling without tangible proof of debt settlement or cessation of
        gambling.
      why: Since counseling began merely a year before the hearing and insufficient time has elapsed to verify that gambling
        will not resume, the mitigating factor remains unmet.
    watch_for:
    - id: watch1
      what: Any forthcoming financial statements or reports demonstrating adherence to DOE Order 472.2A.
      favors:
      - O2
      why: Ongoing failure to report would reinforce the security concerns and bolster the case for maintaining denial.
  lesson: When an employee's fiscal irresponsibility and deceptive reporting are recent, recurrent, and unremedied, the Adjudicative
    Guidelines mandate denial of clearance; mitigation must be demonstrably complete and sustained before a reversal can be
    entertained.
  limits: This analysis applies solely where the record evidences ongoing, uncorrected financial and honesty deficiencies;
    it does not cover situations in which the employee has fully settled debts, offered truthful disclosures, and exhibited
    enduring behavioral change.
