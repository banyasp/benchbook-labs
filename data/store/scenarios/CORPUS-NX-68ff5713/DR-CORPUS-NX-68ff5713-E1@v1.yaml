case:
  id: DR-CORPUS-NX-68ff5713-E1@v1
  title: Assessing a Specialist's Interpretation
  status: draft
  setting: Departmental or national estimate, December 1955; no place is specified.
  decider: The evaluator
  agent: The evaluator
  agent_role: decide
  situation: In December 1955, a specialist skilled in interpreting symbolic evidence brings a published telegram and related
    evidence to an evaluator preparing a departmental or national estimate. The specialist concludes that the Soviet leader
    is actively engaged in destroying the collective leadership, based on an assessment of Soviet politics and the situation
    at the time. The evaluator may instead believe the leader is content to act as spokesman for a collective leadership.
    The evaluator's grounds include reports about colleagues' behavior toward the leader, official propaganda, and the leader's
    public demeanor. The evaluator must decide how to treat the specialist's interpretation within the political estimate.
  question: What should the evaluator do with the specialist's interpretation when preparing the departmental or national
    estimate?
  options:
    O1:
      do: The evaluator should reject it and offer a plausible alternative in the estimate.
      move: act
      irreversible: false
    O2:
      do: The evaluator should accept the specialist's interpretation in the estimate.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A specialist skilled in interpreting symbolic evidence presents a published telegram and related symbolic evidence
      to the evaluator.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The specialist concludes that the Soviet leader is actively engaged in destroying the collective leadership.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The specialist's conclusion draws on a concept of Soviet politics and an assessment of the particular situation
      in late 1955.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The evaluator may believe the Soviet leader is satisfied to act as spokesman for a collective leadership.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Reports indicate that the leader's colleagues show him no special deference in the presence of Western officials.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Soviet propaganda extols collective leadership and criticizes the cult of the individual.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The evaluator's grounds also include the view that the leader lacks a dictator's bearing and self-control.
  - id: F8
    kind: situation
    status: confirmed
    fact: A specialist's inference is to be fitted into the evaluator's political estimate, which may require modifying the
      evaluator's earlier views.
  - id: F9
    kind: situation
    status: confirmed
    fact: If the evaluator rejects the specialist's explanation, the evaluator should develop a plausible interpretation of
      the symbolic evidence that is consistent with the political estimate.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The specialist's conclusion rests on symbolic evidence interpreted in light of Soviet politics and the situation
      at the time. That inference must be fitted into the political estimate and may require revising the evaluator's earlier
      view; it should not simply be dismissed.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The evaluator has grounds for believing the leader is content to serve as spokesman for collective leadership, but
      must examine whether reports about colleagues, propaganda, and demeanor are adequate to sustain that belief against
      the symbolic evidence.
  - id: C3
    facts:
    - F1
    - F2
    - F9
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Rejecting the specialist's explanation is an available course only if the evaluator supplies a plausible interpretation
      of the symbolic evidence that is consistent with the political estimate.
  - id: C4
    facts:
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: If the evaluator cannot develop a plausible alternative, the existing estimate becomes less credible; the evaluator
      should then be prepared to alter it when subsequent events cast further doubt on it.
  reasoning:
    read: This is a contest between a specialist's evidence-based inference and the evaluator's existing political estimate,
      not a choice between accepting the specialist's whole political assessment and ignoring it. The trap is to treat prior
      impressions about the leader as sufficient to dismiss symbolic evidence, or to treat specialist expertise as requiring
      unexamined acceptance.
    weighing: The specialist's conclusion must be incorporated into the estimate and may warrant changing the evaluator's
      earlier view {C1}. The evaluator's cited grounds can support a different view, but their adequacy must be tested against
      the symbolic evidence {C2}. Under {O1}, rejection is defensible only with a plausible alternative interpretation consistent
      with the political estimate {C3}; lacking one makes the estimate less credible and leaves it vulnerable to revision
      {C4}.
    tradecraft: Set the specialist's inference and supporting argument against the evaluator's own grounds, assess whether
      those grounds are adequate, and state a plausible alternative interpretation if rejecting the specialist's explanation.
      Revise the political estimate if that comparison or later evidence undermines it.
    uncertainty: Beliefs about the current political situation may benefit from new evidence. The specialist's interpretation
      is not automatically controlling, but an unsupported rejection weakens the evaluator's estimate; subsequent events may
      change the balance.
    handoff: The evaluator makes the estimate, using the specialist's contribution as input rather than delegating the political
      judgment. The specialist's analysis informs the evaluator's view, while the evaluator remains responsible for fitting
      it into the overall estimate.
    tempting_wrong:
      option: O2
      pull: The specialist has particular skill in interpreting symbolic evidence, and the conclusion is supported by an argument
        grounded in the political situation.
      why_wrong: Expertise and evidence require serious consideration, but the guidance calls for fitting the specialist's
        inference into the evaluator's estimate, not automatically adopting it without weighing the evaluator's grounds.
    rejected:
      O2: The specialist's conclusion should not be adopted automatically when the evaluator can instead sustain a different
        estimate with a plausible interpretation of the symbolic evidence.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The evaluator cannot develop a plausible alternative interpretation of the symbolic evidence consistent with the
        political estimate.
      then: O2
      why: Without a plausible alternative, rejection leaves the estimate less credible; the evaluator should move toward
        revising it in light of the specialist's evidence.
    would_not_change:
    - id: noflip1
      if: The evaluator's earlier belief remains supported by reports about colleagues, official propaganda, or the leader's
        public demeanor.
      why: Those grounds still have to be tested against the symbolic evidence, and they do not excuse dismissing it without
        a plausible alternative.
    watch_for:
    - id: watch1
      what: Subsequent events that cast fresh doubt on the evaluator's estimate, such as the secret speech identified in the
        example.
      favors:
      - O2
      why: The evaluator must be prepared to alter an estimate that later events further undermine.
  lesson: Fit specialist inferences into the overall estimate rather than either dismissing them or accepting them automatically.
    If rejecting an interpretation, provide a plausible alternative consistent with the evidence; if unable to do so, recognize
    that the existing estimate has lost credibility and remain ready to revise it.
  limits: This guidance addresses how an evaluator weighs symbolic evidence within a political estimate; it does not establish
    that the specialist's conclusion is factually correct or prescribe a particular political conclusion. It does not address
    collection or communication methods.
