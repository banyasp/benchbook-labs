case:
  id: DR-CORPUS-NX-d9b8b949-E1@v1
  title: China's Korea Intervention Decision
  status: draft
  setting: Korea, August, at a Chinese Communist Party Politburo meeting
  decider: The Chinese Communist leadership
  agent: The Chinese Communist leadership
  agent_role: decide
  situation: By August, Communist leaders in the USSR, China, and Korea assessed that large-scale US intervention would lead
    to the defeat of DPRK forces. Within China, a US victory in Korea was viewed as a threat to the country. At an August
    4 Chinese Communist Party Politburo meeting, a Chinese leader stated that a US victory would threaten China. Chinese concerns
    included traditional border interests and fears shaped by previous US involvement with Chinese Nationalist forces. Preserving
    China's Communist regime was also a shared objective with the USSR. The leadership must choose whether to intervene on
    the DPRK's side or refrain from intervention.
  question: 'What should the Chinese Communist leadership do in Korea: intervene on the DPRK''s side or refrain from intervention?'
  options:
    O1:
      do: The Chinese Communist leadership intervenes in Korea to assist the DPRK.
      move: act
      irreversible: true
    O2:
      do: The Chinese Communist leadership refrains from intervening in Korea.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: By August, Communist leaders in the USSR, China, and Korea recognized that large-scale US intervention would lead
      to the defeat of DPRK forces.
  - id: F2
    kind: situation
    status: confirmed
    fact: A Chinese Communist Party Politburo meeting took place on 4 August.
  - id: F3
    kind: intelligence
    status: assessed
    fact: At the Politburo meeting, a Chinese leader assessed that a US victory in Korea would threaten China.
  - id: F4
    kind: situation
    status: assessed
    fact: Preserving China's Communist regime was an objective shared with the USSR.
  - id: F5
    kind: situation
    status: assessed
    fact: China had traditional concerns about its borders.
  - id: F6
    kind: situation
    status: assessed
    fact: Chinese fears were shaped by previous US involvement with Chinese Nationalist forces.
  considerations:
  - id: C1
    facts:
    - F3
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The leadership assessed that a US victory in Korea would threaten China, making intervention a response to a perceived
      danger to China's security.
  - id: C2
    facts:
    - F5
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Traditional concern about China's borders and fears shaped by previous US involvement with Chinese Nationalist forces
      help explain why the leadership viewed the situation as a Chinese security matter.
  - id: C3
    facts:
    - F4
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: Preserving China's Communist regime was a shared objective with the USSR, but the account treats this as qualified
      context rather than the main explanation for China's decision.
  - id: C4
    facts:
    - F1
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The leadership assessed that large-scale US intervention would defeat DPRK forces, providing the immediate context
      for deciding to assist the DPRK.
  reasoning:
    read: 'The leadership saw a US victory in Korea as a threat to China while anticipating the defeat of DPRK forces. The
      trap is to reduce the choice to Soviet direction or worldwide Communist strategy: the account attributes greater importance
      to China''s own security, border concerns, and fears shaped by earlier US involvement with Chinese Nationalist forces.'
    weighing: The perceived threat to China and the leadership's traditional border concerns support {O1} most strongly. The
      shared objective of preserving China's Communist regime also points toward intervention, but the account qualifies its
      importance and says China's motivation had more to do with its border concerns and prior US involvement than with a
      worldwide Communist strategy. The choice depends chiefly on the leadership's assessment that a US victory would threaten
      China.
    tradecraft: State the choice as a response to the leadership's assessed threat to China, and distinguish that rationale
      from the shared objective with the USSR. Record the assessment and the reasons attributed to it without adding operational
      detail.
    uncertainty: The account gives the leadership's assessment of the threat but does not specify its evidentiary basis or
      quantify uncertainty in that assessment.
    handoff: The decision is attributed to the Chinese Communist leadership at the Politburo meeting; no further referral
      or approval authority is identified.
    tempting_wrong:
      option: O2
      pull: Refraining could seem preferable if the decision is viewed chiefly as alignment with the USSR or a worldwide Communist
        strategy.
      why_wrong: That framing misses the account's stated emphasis on China's own perceived security threat, traditional border
        concerns, and fears shaped by previous US involvement.
    rejected:
      O2: The leadership did not refrain because it assessed that a US victory in Korea would threaten China and decided China
        had to assist the DPRK.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership no longer assessed that a US victory in Korea would threaten China, and the border and historical
        concerns described here did not otherwise support intervention.
      then: O2
      why: Removing the perceived Chinese security threat would remove the account's principal stated reason for intervention.
    would_not_change:
    - id: noflip1
      if: The shared objective of preserving China's Communist regime with the USSR remained, while the leadership still assessed
        a US victory as a threat to China.
      why: That shared objective alone would not displace the account's emphasis on China's own security and traditional border
        concerns.
    watch_for:
    - id: watch1
      what: Any change in the leadership's assessment of whether a US victory in Korea threatened China.
      favors:
      - O1
      why: The perceived threat to China is the central stated basis for the decision.
  lesson: When leaders assess that an outcome in a neighboring conflict threatens their own country, their stated rationale
    may turn on national security and border concerns rather than alliance alignment alone. Keep those motives distinct, and
    make clear which assessment is decisive.
  limits: This reasoning reflects the Chinese leadership's stated assessment and motives in the August decision context. It
    does not establish whether that threat assessment was accurate or provide a general rule for intervention in other conflicts.
