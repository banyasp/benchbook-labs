case:
  id: DR-CORPUS-NX-c5616246-E3@v1
  title: Revising Soviet Defense-Spending Estimates
  status: draft
  setting: CIA, 1983
  decider: CIA
  agent: CIA
  agent_role: decide
  situation: CIA had previously maintained that Soviet defense spending would continue rising at its historical rate of 4–5
    percent per year. A 1982 second look found that procurement outlays had leveled off since 1975 and that real growth in
    total defense spending had slowed. A 1981 interoffice study concluded spending would need to rise through the 1980s, and
    a subsequent review expected historical or higher growth through at least 1985. By 1983, an internal review of the physical
    estimates underlying the spending estimates had been completed, and the revised assessment indicated a procurement plateau
    since 1976 and substantially slower overall growth. Possible explanations included production delays, supply bottlenecks,
    or a decision to reduce defense spending. The proposed change faced resistance in senior CIA levels and in the Department
    of Defense amid the U.S. defense buildup.
  question: What should the CIA do about its prior rapid-growth estimates and the revised assessment of a procurement plateau?
  options:
    O1:
      do: The CIA publishes revised estimates showing a procurement plateau and slower overall spending growth.
      move: act
      irreversible: true
    O2:
      do: The CIA defers publication for another internal review of the estimates.
      move: hold
      irreversible: false
    O3:
      do: The CIA withholds revised estimates and retains its prior projections of rapid spending growth.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A 1982 second look found that Soviet military procurement outlays had leveled off since 1975 and real growth in
      total defense spending had slowed significantly.
  - id: F2
    kind: intelligence
    status: assessed
    fact: During the intervening period, CIA assessments continued to project Soviet defense spending growth at its historic
      rate of 4–5 percent per year.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A 1981 interoffice study concluded Soviet military spending would have to rise through the 1980s to support ongoing
      activities.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A subsequent review expected Soviet defense spending to grow at its historical rate through at least 1985, or faster
      if the Soviets perceived arms competition with the West to be accelerating.
  - id: F5
    kind: situation
    status: confirmed
    fact: The revised estimates followed careful internal review of the physical estimates underlying the spending estimates.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The revised assessment indicated a procurement plateau since 1976 and substantially slower growth in overall defense
      spending, largely because procurement was flat.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Possible explanations for the procurement plateau included production delays, transportation and supply bottlenecks,
      and a possible policy decision to reduce defense spending.
  - id: F8
    kind: situation
    status: confirmed
    fact: The proposed estimates encountered resistance in senior CIA levels and in the Department of Defense during the U.S.
      defense buildup.
  considerations:
  - id: C1
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The revised estimates followed careful internal review of the physical estimates underlying them, providing a reviewed
      basis for changing the assessment.
  - id: C2
    facts:
    - F1
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The evidence indicated procurement had plateaued and overall spending growth had slowed, rather than continuing at
      the previously projected pace.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Earlier assessments projected historic or faster growth, but the revised assessment differed after the underlying
      estimates were reviewed; retaining the earlier projection despite that change would leave the assessment out of step
      with the reviewed estimates.
  - id: C4
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The causes of the plateau were not settled among production delays, supply bottlenecks, or a possible policy decision,
      leaving some interpretive uncertainty; that uncertainty concerns the explanation, not the revised spending trend itself.
  reasoning:
    read: The decision is whether to update a spending estimate after the physical estimates underlying it have been reviewed
      and indicate a different trend. The trap is allowing earlier projections, or resistance to changing them, to substitute
      for the revised assessment; the cause of the plateau is uncertain, but the revised trend is the finding at issue.
    weighing: The prior estimates had rested on expectations that spending would grow at its historical rate or faster, while
      the revised assessment found a procurement plateau and slower overall growth {C2} {C3}. The careful internal review
      supports issuing the revision {C1}. Possible explanations remain unsettled, which counsels against overstating why the
      plateau occurred, but does not outweigh the reviewed estimate of the trend {C4}.
    tradecraft: State the revised trend separately from the possible explanations for it, preserve the distinction between
      assessed findings and hypotheses, and record the basis for changing the prior estimate. Do not treat resistance as evidence
      for or against the estimate.
    uncertainty: The source gives several possible causes for the plateau rather than a definitive explanation. It also records
      resistance to the revised estimates, but does not establish that this resistance changed the underlying evidence.
    handoff: The decision belongs to CIA. The completed internal review is relevant to the analytic judgment; the recorded
      resistance in senior CIA levels and the Department of Defense warrants noting disagreement, not treating that resistance
      as a substitute for evaluating the estimates.
    tempting_wrong:
      option: O3
      pull: Prior CIA assessments expected continued historic or faster growth, and the proposed revision faced resistance.
      why_wrong: Those earlier expectations do not displace the later reviewed assessment that procurement had plateaued and
        overall growth had slowed.
    rejected:
      O2: Another review was not chosen because the revised estimates had already followed careful internal review of the
        physical estimates.
      O3: Retaining the prior rapid-growth estimates was not chosen because the revised assessment found a procurement plateau
        and substantially slower overall growth.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A further review found that the physical estimates underlying the revision were unreliable or materially contradicted
        by stronger evidence.
      then: O2
      why: The stated basis for changing the estimate would then require reassessment before publication.
    - id: flip2
      if: A completed review instead substantiated continued rapid procurement growth and the historical overall spending
        trend.
      then: O3
      why: The central evidentiary basis for replacing the prior estimates would no longer hold.
    would_not_change:
    - id: noflip1
      if: The cause of the plateau remained uncertain among production delays, supply bottlenecks, or a policy decision.
      why: Uncertainty about cause would not by itself reverse the revised assessment of the spending trend.
    watch_for:
    - id: watch1
      what: Whether later evidence confirms that the plateau and slower overall growth continue.
      favors:
      - O1
      why: Confirmation would support retaining the revised trend assessment; contrary evidence could warrant renewed review.
  lesson: When a reviewed assessment changes the factual picture, update the estimate rather than preserve a prior projection
    by inertia or because the change is unwelcome. Distinguish the assessed trend from unresolved explanations for it.
  limits: This reasoning addresses whether to revise and issue spending estimates on the record described. It does not determine
    how intelligence about Soviet forces should be collected or resolve questions about the underlying causes of the plateau.
