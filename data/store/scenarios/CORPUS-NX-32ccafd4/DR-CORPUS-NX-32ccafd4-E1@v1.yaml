case:
  id: DR-CORPUS-NX-32ccafd4-E1@v1
  title: Cotton Supply and the Production Increase
  status: draft
  setting: Later that morning, during an analysts' evaluation of newly released Soviet economic data.
  decider: The analyst
  agent: An economic-analysis agent acting under the analyst's delegated authority
  agent_role: decide
  situation: An economic-analysis agent is assigned to assess the reported increase in Soviet cotton-cloth production. The
    reported increase is 7 percent, while the previous forecast was 3 percent. Data on cotton production and cotton imports
    and exports are available. Data on cotton inventories are also available.
  question: What should the economic-analysis agent do about whether available cotton supplies support the reported cotton-cloth
    production increase?
  options:
    O1:
      do: The economic-analysis agent accepts the reported increase as consistent with available cotton supplies.
      move: act
      irreversible: false
    O2:
      do: The economic-analysis agent requests additional cotton-supply data from the analysts before issuing an assessment.
      move: ask
      irreversible: false
      to: the analysts
    O3:
      do: The economic-analysis agent rejects the reported increase as consistent with available cotton supplies.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The latest Soviet economic data had been released.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The released data indicated a 7 percent increase in cotton-cloth output.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The previous cotton-cloth output forecast was a 3 percent increase.
  - id: F4
    kind: capability
    status: confirmed
    fact: The analyst retrieved data on cotton production.
  - id: F5
    kind: capability
    status: confirmed
    fact: The analyst retrieved data on cotton exports and imports.
  - id: F6
    kind: capability
    status: confirmed
    fact: The analyst retrieved data on cotton inventories.
  - id: F7
    kind: authority
    status: confirmed
    fact: The analyst delegates to the economic-analysis agent authority to make the cotton-supply consistency assessment.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The analyst compared cotton production, imports and exports, and inventories—the stated evidence used to assess whether
      supplies could support the reported increase.
  - id: C2
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    - O2
    weight: weak
    why: The 7 percent reported increase materially exceeded the 3 percent forecast, warranting examination rather than automatic
      acceptance or rejection; the comparison alone does not establish whether supplies were adequate.
  - id: C3
    facts:
    - F2
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The analyst concluded that the available cotton was sufficient to support the reported increase without substantially
      reducing inventories, directly supporting acceptance of its supply consistency.
  reasoning:
    read: The question is whether the reported output increase is consistent with available cotton supplies, not whether the
      report matches the earlier forecast. The forecast gap calls for checking the supply evidence; it does not by itself
      show the increase is implausible.
    weighing: The forecast discrepancy merits scrutiny {C2}, but the analyst retrieved and compared production, trade, and
      inventory data {C1}. The resulting assessment was that cotton supplies were sufficient without substantially reducing
      inventories {C3}, so the evidence favors {O1} over requesting more data or rejecting the increase. That balance depends
      on the supply comparison supporting the stated conclusion.
    tradecraft: 'State the supply-consistency judgment and preserve its evidentiary basis: cotton production, imports and
      exports, and inventories. Do not treat the forecast miss alone as proof of a supply shortfall.'
    uncertainty: The source gives the analyst's conclusion but no numerical supply balance or confidence level. The assessment
      should therefore be understood as the analyst's stated judgment on the data reviewed, not as a quantified certainty.
    handoff: The analyst made the supply assessment using the retrieved data; the source does not indicate that further approval
      or a request to other analysts was needed for this judgment.
    tempting_wrong:
      option: O3
      pull: The reported 7 percent increase is substantially higher than the previous 3 percent forecast.
      why_wrong: A forecast miss is a reason to examine the evidence, not evidence that cotton supplies are insufficient;
        the analyst's comparison instead found supplies adequate.
    rejected:
      O2: The analyst had retrieved and assessed the relevant production, trade, and inventory data, and the stated conclusion
        did not call for additional supply information.
      O3: The analyst concluded that available cotton could support the reported increase without substantially reducing inventories.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reassessment of the relevant supply data showed that cotton was insufficient to support the reported increase.
      then: O3
      why: A demonstrated supply shortfall would contradict the evidentiary basis for accepting the increase as supply-consistent.
    - id: flip2
      if: The supply data were materially incomplete or unreliable, preventing a sound conclusion about availability.
      then: O2
      why: Without an adequate evidentiary basis, requesting further supply data would be preferable to accepting or rejecting
        the increase on the current record.
    would_not_change:
    - id: noflip1
      if: The reported increase remained higher than the previous forecast while the production, trade, and inventory evidence
        continued to support adequate supplies.
      why: The forecast gap alone does not outweigh the supply evidence supporting the analyst's conclusion.
    watch_for: []
  lesson: A forecast divergence is a prompt to test the underlying evidence, not a reason by itself to accept or reject a
    new estimate. When the relevant supply data support the reported increase without a substantial inventory drawdown, the
    assessment should reflect that evidence.
  limits: This reasoning addresses only whether available cotton supports the reported cotton-cloth production increase. It
    does not assess other explanations for the output change, the reliability of the released data beyond the analyst's stated
    assessment, or the full economic forecast.
  library:
    domain: intel-analysis
    family: CORPUS-NX-32ccafd4
    source: https://www.cia.gov/resources/csi/static/614967995df1da808decb0e019bbe001/Computers-in-Economic-Intel.pdf
    episode_focus: The analyst assesses whether the production increase is plausible by comparing cotton production, trade,
      and inventory data, and concludes that sufficient cotton is available without substantially reducing inventories. Focus
      on this estimative judgment and its stated evidentiary basis; exclude the surrounding computer workflow and other analysts’
      separate assessments.
    cues:
