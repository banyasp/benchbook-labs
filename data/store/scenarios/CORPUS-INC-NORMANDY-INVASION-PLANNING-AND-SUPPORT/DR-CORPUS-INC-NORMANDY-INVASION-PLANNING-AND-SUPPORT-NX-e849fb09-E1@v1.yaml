case:
  id: DR-CORPUS-INC-NORMANDY-INVASION-PLANNING-AND-SUPPORT-NX-e849fb09-E1@v1
  title: Invasion-Timing Disclosure to a Senior French Leader
  status: draft
  setting: SHAEF, early March 1944, planning a cross-Channel invasion.
  decider: The Allied commander
  agent: The Allied commander
  agent_role: decide
  situation: In early March 1944, a cross-Channel invasion was planned. The Allied commander faced a decision about how much
    of the invasion timing to share with a senior French military leader. Operational security was a concern. The French leader
    outranked the heads of SOE and OSS and was regarded as equivalent to any other subordinate officer in the command. The
    available courses included sharing only the month, disclosing more precise timing, or withholding invasion timing.
  question: What should the Allied commander do about how much invasion timing to disclose to the senior French military leader?
  options:
    O1:
      do: The Allied commander withholds all invasion timing from the senior French military leader.
      move: act
      irreversible: true
    O2:
      do: The Allied commander discloses more precise invasion timing to the senior French military leader.
      move: act
      irreversible: true
    O3:
      do: The Allied commander discloses only the invasion month to the senior French military leader.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision arose in early March 1944.
  - id: F2
    kind: situation
    status: confirmed
    fact: A cross-Channel invasion was planned.
  - id: F3
    kind: situation
    status: confirmed
    fact: The timing-disclosure decision concerned a senior French military leader.
  - id: F4
    kind: situation
    status: assessed
    fact: Operational security was a consideration in deciding how much timing to disclose.
  - id: F5
    kind: authority
    status: confirmed
    fact: The French military leader outranked the head of SOE.
  - id: F6
    kind: authority
    status: confirmed
    fact: The French military leader outranked the head of OSS.
  - id: F7
    kind: authority
    status: confirmed
    fact: The French military leader was regarded as equivalent to any other subordinate officer in the command.
  considerations:
  - id: C1
    facts:
    - F4
    equity: security_risk
    favors:
    - O1
    - O3
    weight: strong
    why: Operational security was the stated reason for limiting what timing the commander shared, weighing against disclosure
      of more precise timing.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: chain_of_command
    favors:
    - O2
    - O3
    weight: weak
    why: The French leader's senior standing in the command weighs against treating him as someone from whom all timing should
      be withheld, though the source does not say that his rank entitled him to the precise date.
  - id: C3
    facts:
    - F4
    - F7
    equity: security_risk
    favors:
    - O3
    weight: strong
    why: Sharing only the month limited disclosure while still giving the senior subordinate some invasion timing; this is
      the balance reflected in the commander's choice.
  reasoning:
    read: This is a decision about the granularity of disclosure, not whether the French leader mattered to the command. The
      trap is to treat his senior standing as requiring precise timing, or to treat operational security as requiring complete
      silence; the source records a limited disclosure.
    weighing: The stated operational-security concern weighs against {O2} {C1}. The leader's command standing weighs weakly
      against {O1} {C2}. The commander balanced those considerations by sharing only the month {C3}. The balance depends on
      the operational-security concern remaining material while some disclosure is appropriate.
    tradecraft: State the security rationale and the chosen level of disclosure in the decision record. Limit disclosure to
      that level, and reassess if the security rationale or the need for disclosure materially changes.
    uncertainty: The source gives the general operational-security rationale but does not explain why the month, specifically,
      was the appropriate boundary or describe the relative risks of the other options.
    handoff: The Allied commander made the decision. The account identifies the French leader's command standing but does
      not indicate that further approval or consultation was required.
    tempting_wrong:
      option: O2
      pull: The French leader outranked the heads of SOE and OSS and was treated as equivalent to other subordinate officers.
      why_wrong: That standing does not, on the source's stated reasoning, overcome the operational-security concern or establish
        a need to disclose more precise timing.
    rejected:
      O1: Complete withholding was not chosen; the commander shared the invasion month despite the operational-security concern.
      O2: More precise timing was not chosen because operational security was the stated reason for limiting disclosure.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The circumstances made precise timing necessary for the French leader's command responsibilities and the security
        concern no longer materially weighed against that disclosure.
      then: O2
      why: With the stated security reason reduced and a concrete need for greater precision, fuller disclosure could become
        the better balance.
    would_not_change:
    - id: noflip1
      if: The French leader's relative rank and command standing remained as described, without a change in the operational-security
        concern.
      why: Those facts alone do not displace the source's stated reason for limiting timing disclosure or show that precise
        timing was required.
    watch_for:
    - id: watch1
      what: Whether the operational-security concern still weighs against more precise timing disclosure.
      favors:
      - O1
      - O3
      why: That concern is the source's stated basis for limiting disclosure.
  lesson: When a senior partner's standing supports sharing information but operational security weighs against full disclosure,
    calibrate the amount shared to the security concern rather than defaulting to either complete silence or unrestricted
    disclosure. Make clear what concern supports the chosen limit and revisit it if circumstances change.
  limits: This reasoning applies to the source's narrow timing-disclosure decision. It does not establish a general rule about
    what information a senior allied officer is entitled to receive, or how much disclosure would be appropriate under different
    security conditions.
