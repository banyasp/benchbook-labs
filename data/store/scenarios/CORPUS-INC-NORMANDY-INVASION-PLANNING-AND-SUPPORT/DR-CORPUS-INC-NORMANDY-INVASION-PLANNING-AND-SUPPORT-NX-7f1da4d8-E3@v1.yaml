case:
  id: DR-CORPUS-INC-NORMANDY-INVASION-PLANNING-AND-SUPPORT-NX-7f1da4d8-E3@v1
  title: D-Day Target Priority
  status: draft
  setting: Allied D-Day planning, spring 1944, London and the Normandy campaign
  decider: The senior Allied air commander
  agent: The senior Allied air commander
  agent_role: decide
  situation: Allied leaders were deciding whether to prioritize marshalling yards or bridge attacks in support of D-Day. Marshalling-yard
    advocates considered that target set sufficient, while EOU argued that bridge attacks could isolate the Normandy battlefield.
    The American air force and ground-force headquarters supported the bridge concept. Assessments differed about the effort
    required to make bridges unusable for several weeks, and a proposed broad test was called off after objections. A later
    limited experiment damaged several bridges, but its success was regarded as lucky and the evidence was not statistically
    robust.
  question: What should the senior Allied air commander do about the competing marshalling-yard and bridge priorities for
    isolating the Normandy battlefield?
  options:
    O1:
      do: The senior Allied air commander approves the bridge-attack priority for the Normandy campaign.
      move: act
      irreversible: false
    O2:
      do: The senior Allied air commander rejects the bridge-attack priority and approves the marshalling-yard priority.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Marshalling-yard advocates argued that attacking marshalling yards would suffice.
  - id: F2
    kind: situation
    status: assessed
    fact: EOU argued for bridge attacks to isolate the Normandy battlefield.
  - id: F3
    kind: situation
    status: confirmed
    fact: The American air force and, ultimately, the ground-force headquarters supported the bridge concept.
  - id: F4
    kind: capability
    status: assessed
    fact: Assessments differed substantially about the effort needed to make a bridge unusable for several weeks.
  - id: F5
    kind: situation
    status: confirmed
    fact: A proposed broad test of the bridge concept was called off after marshalling-yard advocates objected.
  - id: F6
    kind: situation
    status: confirmed
    fact: A later experiment on six Seine bridges badly damaged three bridges and caused a fourth to fall into the river.
  - id: F7
    kind: situation
    status: assessed
    fact: The experiment's success was characterized as a matter of luck, and the resulting evidence was hard but not statistically
      reputable.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The bridge plan was intended to isolate the Normandy battlefield; the stated strategic rationale was that it impeded
      German reinforcement, leaving forces to enter the battle piecemeal and exposed to Allied harassment.
  - id: C2
    facts:
    - F3
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: The American air force and ground-force headquarters supported the bridge concept, giving the plan backing from the
      air and ground organizations whose efforts it was intended to support.
  - id: C3
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The experiment damaged several bridges and contributed to approval, but its success was regarded as lucky and the
      evidence was not statistically robust; it supported the plan without conclusively settling the technical dispute.
  - id: C4
    facts:
    - F1
    - F4
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Marshalling-yard advocates considered their target set sufficient, estimates of the effort needed to disable bridges
      differed substantially, and the experimental evidence was limited.
  reasoning:
    read: The decision was whether to rely on marshalling yards or to pursue the bridge plan to isolate the Normandy battlefield.
      The trap is treating the experiment as either conclusive proof or worthless because it was lucky and statistically weak;
      it was relevant evidence, but not a reliable final measure of the plan's effectiveness.
    weighing: 'The bridge plan addressed the stated strategic purpose directly: isolating the battlefield and impeding German
      reinforcement, so that forces entered the battle piecemeal and faced Allied harassment. Support from the American air
      force and ground-force headquarters reinforced that rationale. The experiment contributed to approval, but its results
      were not statistically conclusive. The choice depends chiefly on whether disrupting reinforcement and isolating the
      battlefield are judged more important than the marshalling-yard advocates'' claim that their approach would suffice.'
    tradecraft: Record the competing strategic claims, the disagreement over bridge effectiveness, the limited reliability
      of the experimental evidence, and the operational rationale for the decision. Keep the decision record at that level
      and avoid presenting the experiment as more conclusive than it was.
    uncertainty: There was substantial disagreement about the effort required to disable bridges, and the successful experiment
      was regarded as lucky and not statistically reputable. The strategic rationale was supported by the subsequent impediment
      to German reinforcement, but the experiment itself did not remove uncertainty.
    handoff: The senior Allied air commander held the decision, with the American air force and ground-force headquarters
      relevant to the plan because they supported the bridge concept and the intended battlefield effect involved ground operations.
    tempting_wrong:
      option: O2
      pull: Marshalling-yard advocates considered their approach sufficient, and the bridge experiment was not statistically
        robust.
      why_wrong: 'That evidence warrants caution, not dismissal of the bridge plan''s stated strategic purpose: isolating
        the battlefield and impeding German reinforcement.'
    rejected:
      O2: The marshalling-yard priority was not chosen because the bridge plan was approved to isolate the Normandy battlefield
        and impede German reinforcement.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The available assessment showed that bridge attacks could not materially disrupt German reinforcement or isolate
        the Normandy battlefield.
      then: O2
      why: The principal strategic rationale for the bridge priority would no longer hold.
    - id: flip2
      if: Reliable evidence showed that the bridge plan could not achieve its intended effect while the marshalling-yard plan
        could.
      then: O2
      why: The choice would then turn against the bridge plan's asserted mission advantage.
    would_not_change:
    - id: noflip1
      if: The experiment remained lucky and statistically weak, while the strategic case for isolating the battlefield remained
        supported.
      why: Approval followed despite the acknowledged limitations of the experimental evidence; those limitations alone did
        not outweigh the strategic rationale.
    watch_for:
    - id: watch1
      what: Whether disruption of German reinforcement actually isolates the battlefield and forces reinforcements to arrive
        piecemeal.
      favors:
      - O1
      why: Those effects are the stated strategic rationale for the bridge priority.
  lesson: When choosing between competing target priorities, assess which option serves the stated operational purpose most
    directly. Treat favorable but weak evidence as relevant rather than conclusive, and make clear how much of the decision
    rests on strategic rationale rather than proof from a limited test.
  limits: This reasoning concerns the recorded D-Day dispute and its stated strategic objective; it does not establish a general
    rule that bridge attacks should take priority over marshalling yards. The source gives no basis here for conclusions about
    civilian effects, legal authorization, or the wider costs of either plan.
