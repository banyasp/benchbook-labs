case:
  id: DR-CORPUS-NX-c5a00e91-E4@v1
  title: Framing the Research Category
  status: draft
  setting: Tracking Terrorism class; institution and date not specified.
  decider: The professor
  agent: The professor
  agent_role: decide
  situation: In the Tracking Terrorism class, the professor is framing student research concerning countries and several pathologies.
    The term under consideration is “transit country.” The professor considers that term poorly defined and believes it covers
    too limited a subset of countries. A broader analytic category could describe physical areas by geographic, structural,
    and sociopolitical characteristics that make them useful to terrorist organizations. The professor must choose the scope
    of the category used to frame the research.
  question: What should the professor do in framing the analytic category for the class's student research?
  options:
    O1:
      do: The professor contracts the framing from broader operating areas to transit countries.
      move: act
      irreversible: false
    O2:
      do: The professor expands the framing from transit countries to broader operating areas.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Tracking Terrorism class involved student research organized into teams.
  - id: F2
    kind: situation
    status: confirmed
    fact: The research addressed countries and specific pathologies.
  - id: F3
    kind: situation
    status: confirmed
    fact: “Transit country” was the term under consideration for the analytic framing.
  - id: F4
    kind: situation
    status: assessed
    fact: The professor considered “transit country” not particularly well defined.
  - id: F5
    kind: situation
    status: assessed
    fact: The professor considered that “transit country” implied too small a subset of countries.
  - id: F6
    kind: situation
    status: assessed
    fact: The professor considered the term “transit country” too narrow to answer the question fully.
  - id: F7
    kind: situation
    status: confirmed
    fact: The broader concept describes a physical area with geographic, structural, and sociopolitical characteristics that
      make it useful for a terrorist organization to operate.
  considerations:
  - id: C1
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The professor considered “transit country” poorly defined, which weighs against retaining it as the research category.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The professor judged that the term implied a subset of countries that was too small; expanding the framing addresses
      that limitation.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The professor considered “transit country” too narrow to answer the question fully and adopted a broader concept
      covering physical areas useful for terrorist organizations to operate.
  reasoning:
    read: This is a choice about the scope and clarity of a research category, not about operationally identifying or assessing
      places. The trap is retaining a familiar label even though the professor judged it poorly defined and too narrow for
      the question.
    weighing: 'The professor''s stated reasons point toward {O2}: “transit country” was not particularly well defined, implied
      too small a subset, and was too narrow to answer the question fully {C1} {C2} {C3}. The balance depends on whether the
      broader concept captures the question the class is asking; the source gives the professor''s judgment but no separate
      validation of that concept.'
    tradecraft: State the broader category and its conceptual scope clearly, and record why the original term was rejected.
      Keep the decision at the level of analytic framing rather than adding operational criteria or procedures.
    uncertainty: The source gives the professor's rationale but does not report whether the broader category was later tested
      or how well it served the student research.
    handoff: The professor made the framing choice; the source identifies no required referral or other decision authority.
    tempting_wrong:
      option: O1
      pull: Keeping the narrower, familiar term may seem like a way to keep the research category compact.
      why_wrong: The professor judged that “transit country” was poorly defined, covered too small a subset, and could not
        answer the question fully.
    rejected:
      O1: The professor did not retain the narrower transit-country framing because it was judged poorly defined and too narrow
        to answer the question fully.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The professor had judged that “transit country” was sufficiently well defined and broad enough to answer the question
        fully.
      then: O1
      why: That would remove the stated reasons for broadening the category.
    would_not_change:
    - id: noflip1
      if: The research remained organized into student teams and still addressed countries and specific pathologies.
      why: Those features describe the research setting but do not negate the professor's stated concerns about the term's
        definition and scope.
    watch_for:
    - id: watch1
      what: Whether the broader category's stated geographic, structural, and sociopolitical scope actually fits the research
        question.
      favors:
      - O2
      why: The professor chose the broader concept to answer the question more fully; its fit is the key premise of that rationale.
  lesson: Choose an analytic category that is clear enough and broad enough to answer the question being studied. Do not preserve
    a narrower label when the decision-maker judges that it excludes relevant scope.
  limits: This reasoning supports a choice of conceptual framing only. It does not establish how places should be identified
    or assessed, nor does it establish that the broader category is appropriate for a different research question.
