case:
  id: DR-CORPUS-NX-3712a693-E1@v1
  title: Managing Surveillance Coverage During the Gulf War
  status: draft
  setting: Gulf War; US Navy; flagship command center, with coverage spanning the Red Sea–Iran–Turkey area.
  decider: the US Navy
  agent: the US Navy
  agent_role: decide
  situation: During the Gulf War, the US Navy faced a data-overload problem involving surveillance coverage. The surveillance
    systems supplied more information than the flagship command-center displays could handle. The displays were overloaded
    and locking up. The coverage decision concerned an original area spanning the Red Sea, Iran, and Turkey, with a narrower
    area covering southern Iraq, the Persian Gulf, and part of Iran as an alternative.
  question: What should the US Navy do about surveillance coverage during the Gulf War?
  options:
    O1:
      do: The US Navy narrows coverage across southern Iraq, the Persian Gulf, and part of Iran.
      move: act
      irreversible: false
    O2:
      do: The US Navy broadens coverage across the Red Sea, Iran, and Turkey.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The episode occurred during the Gulf War.
  - id: F2
    kind: situation
    status: confirmed
    fact: The US Navy encountered data overload.
  - id: F3
    kind: capability
    status: confirmed
    fact: Surveillance systems supplied more data than the flagship command-center displays could handle.
  - id: F4
    kind: situation
    status: confirmed
    fact: The flagship command-center displays were overloading.
  - id: F5
    kind: situation
    status: confirmed
    fact: The flagship command-center displays were locking up.
  - id: F6
    kind: situation
    status: confirmed
    fact: The original surveillance area spanned the Red Sea, Iran, and Turkey.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The surveillance systems supplied more information than the flagship displays could handle, supporting a reduction
      in coverage to address the stated overload.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The displays were not merely busy: they were overloading and locking up, making the existing coverage unworkable
      for the command center.'
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Navy treated reduction of the original coverage area as necessary in response to the overload and display lockups.
  reasoning:
    read: The decision was how to respond to data overload in the flagship command center, where the surveillance systems
      supplied more information than the displays could handle and the displays were overloading and locking up. The trap
      is to treat broader coverage as an unqualified benefit while overlooking that the displays could not handle the information
      supplied.
    weighing: The stated reason for reducing coverage was the overload and lockups, and the Navy considered the reduction
      necessary to address them. Those reasons favor {O1}; the passage gives no countervailing reason for keeping or expanding
      the wider area. The balance depends on whether the displays can handle the information associated with the coverage.
    tradecraft: As a decision practice, record the overload and lockups as the reason for narrowing coverage, identify the
      coverage change, and reassess if the stated capacity problem changes.
    uncertainty: The passage does not describe other alternatives, the consequences of reduced coverage, or any separate reason
      to retain wider coverage.
    handoff: The US Navy is identified as the decision-maker, but the passage does not specify an individual decision authority
      or a need for referral.
    tempting_wrong:
      option: O2
      pull: Wider surveillance coverage may seem preferable.
      why_wrong: 'That preference does not address the stated problem: the information supplied exceeded display capacity
        and the displays were locking up.'
    rejected:
      O2: The Navy did not retain or broaden the wider coverage because the displays could not handle the information and
        were overloading and locking up.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The displays could handle the information associated with the wider coverage without overloading or locking up.
      then: O2
      why: That would remove the stated reason for reducing coverage and could support retaining or broadening it.
    would_not_change:
    - id: noflip1
      if: Wider coverage were desirable but the displays still could not handle the information and were locking up.
      why: That preference alone would not resolve the source's stated overload problem.
    watch_for:
    - id: watch1
      what: Whether the displays continue to overload or lock up under the information supplied.
      favors:
      - O1
      why: Those are the stated conditions that made reducing coverage necessary.
  lesson: When information exceeds a command center's capacity and its displays overload or lock up, the source's stated response
    is to reduce coverage. Reconsider that response if the capacity problem changes; the passage supplies no separate balancing
    reason for wider coverage.
  limits: This reasoning addresses only the stated Gulf War data-overload episode and the coverage decision. It does not establish
    a general rule about surveillance scope or address consequences the passage does not discuss.
  library:
    domain: operational-command
    family: CORPUS-NX-3712a693
    source: https://www.cia.gov/resources/csi/static/bb920b27ff3b851018ddf532db83c42f/functional-model-info-warfare.pdf
    episode_focus: In the Gulf War, Aegis and E-2/E-3 systems supplied more data than the flagship command-center displays
      could handle, so the Navy reduced coverage from the Red Sea–Iran–Turkey area to southern Iraq, the Persian Gulf, and
      part of Iran. Focus on the command choice to reduce coverage and its stated reason; exclude technical details of the
      systems and any broader conclusions not stated in the passage.
