case:
  id: DR-CORPUS-NX-447762b2-E5@v1
  title: Political Power in the Soviet Union
  status: draft
  setting: The Soviet Union during the current political crisis, in a political assessment.
  decider: The assessment's analysts
  agent: The assessment's analysts
  agent_role: decide
  situation: The Soviet Union is in a transition from the old political order to an undefined new order. Neither the existing
    system nor the partially emerging system is assessed as able to cope effectively with newly mobilized popular demands
    and a deepening economic crisis. Political divisions, uncertainty about the reliability of security services, and an increasingly
    organized opposition form part of the crisis. Reformers and traditionalists have opposing goals. Hard-liners may attempt
    to remove the Soviet leader and install their own regime, particularly if they believe he is yielding their interests
    to the republics.
  question: What should the analysts conclude about the likely direction of political power in the Soviet Union, including
    the traditionalist-coup contingency?
  options:
    O1:
      do: The analysts reject the forecast that power will shift substantially to the republics unless a traditionalist coup
        blocks it.
      move: act
      irreversible: false
    O2:
      do: The analysts endorse the forecast that power will shift substantially to the republics unless a traditionalist coup
        blocks it.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Soviet Union is in transition from the old political order to an as-yet undefined new order.
  - id: F2
    kind: capability
    status: assessed
    fact: Neither the existing political system nor the partially emerging system can cope effectively with newly mobilized
      popular demands.
  - id: F3
    kind: situation
    status: assessed
    fact: The economic crisis is deepening.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The political elite is divided and lacks firm resolve.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The reliability of the security services is uncertain.
  - id: F6
    kind: situation
    status: assessed
    fact: Political opposition is increasingly mobilized and organized.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Reformers and traditionalists have diametrically opposed goals for the future.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Hard-liners may try to remove the Soviet leader and install their own regime to forestall a reformist victory; the
      danger is assessed as greater if they believe the leader is yielding their interests to the republics.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The old order and the partially emerging order cannot cope with newly mobilized demands amid a deepening economic
      crisis. The assessment characterizes this as a revolutionary transition, supporting a substantial shift in political
      power.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Elite divisions and lack of resolve, uncertainty about security-service reliability, and an increasingly organized
      opposition are assessed as conditions that could quickly sweep away the existing system and leadership.
  - id: C3
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Reformers' and traditionalists' goals are diametrically opposed, leaving little prospect that a centrist course can
      diffuse the crisis.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: A traditionalist coup is a stated contingency that could block the shift, especially if hard-liners believe the leader
      is yielding their interests to the republics. The forecast is conditional on that exception, not a claim that a shift
      is certain regardless of a coup.
  - id: C5
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The assessment concludes that time works against the traditionalists and that their position weakens the longer force
      is not used; it also concludes that even if the leader remains, his former domination will not return.
  reasoning:
    read: The analysts assess a revolutionary transition in which neither the existing order nor the emerging one can meet
      popular demands and the worsening economic crisis. The trap is to treat the leader's possible continued tenure, or a
      centrist course, as evidence that the old political balance can be restored; the assessment says his domination has
      ended and the opposing goals leave little prospect of a centrist resolution.
    weighing: 'The system''s inability to cope with demands and crisis, combined with elite divisions, uncertain security-service
      reliability, and organized opposition, supports endorsing a substantial shift of power to the republics. The hard-line
      coup is a real exception: it could block that shift, with the danger greater if hard-liners believe the leader is yielding
      their interests to the republics. The assessment''s conclusion that time works against traditionalists further supports
      the conditional forecast; it does not remove the coup contingency.'
    tradecraft: 'Record the conclusion as a conditional estimate: distinguish the expected shift from the coup exception,
      and do not present the assessment as advice to use force or carry out a coup.'
    uncertainty: The source identifies the coup as a contingency but assigns no probability to it. The forecast is therefore
      conditional, and the assessment does not specify how likely or how quickly the exception would occur.
    handoff: The analysts make the estimative judgment. No additional decision-maker or referral is identified; preserve the
      coup contingency when communicating the conclusion.
    tempting_wrong:
      option: O1
      pull: The stated possibility of a traditionalist coup could make rejection of the shift forecast seem safer.
      why_wrong: The forecast already makes the shift conditional on the coup not blocking it. Treating the contingency as
        if it erased the assessment's baseline direction would disregard the analysts' conclusion that the current system
        is doomed and traditionalists are losing ground over time.
    rejected:
      O1: The analysts did not reject the forecast; they concluded that power would shift substantially to the republics unless
        a traditionalist coup blocked it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Subsequent evidence showed that substantial power did not shift to the republics and that no traditionalist coup
        had blocked the shift.
      then: O1
      why: That would contradict the central conditional forecast on which the endorsement rests.
    would_not_change:
    - id: noflip1
      if: The Soviet leader manages to remain in office.
      why: The assessment explicitly says that even if he remains, his domination of the political system will not be resurrected.
    - id: noflip2
      if: Force is not used for a longer period.
      why: The assessment says the traditionalists' position will weaken the longer force is not used, which does not reverse
        its forecast of a shift absent a coup.
    watch_for:
    - id: watch1
      what: Hard-liners' belief that the leader is yielding their interests to the republics, and whether they attempt a coup
        that blocks the shift.
      favors:
      - O1
      why: The assessment identifies this belief as increasing the danger of a coup, the stated contingency that could block
        the forecast shift.
  lesson: In a political transition, do not infer restoration of the old balance merely from a leader's continued tenure when
    the underlying system cannot meet demands and the political forces have incompatible aims. State the expected direction
    and its exception distinctly, rather than allowing the exception to erase the conditional forecast.
  limits: This judgment is an estimate about the direction of political power in the Soviet crisis, not a prescription for
    political action or force. It does not supply probabilities, a detailed timeline, or a forecast for circumstances beyond
    the stated coup contingency.
