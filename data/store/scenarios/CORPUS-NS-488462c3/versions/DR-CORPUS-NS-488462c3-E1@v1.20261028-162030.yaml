case:
  id: DR-CORPUS-NS-488462c3-E1@v1
  title: Whether to Complete and Report a Politicization Inquiry
  status: draft
  setting: Late 2020, the Office of the Director of National Intelligence and the Intelligence Community.
  decider: The ODNI ombudsperson
  agent: The ODNI ombudsperson
  agent_role: decide
  situation: Analysts had raised concerns that political pressure was affecting the objectivity of assessments about Russian
    and Chinese election influence. They had first sought help from their managers, but almost all said they received no satisfaction.
    The inquiry had identified both pressure that could appear to compromise objectivity and incidents of willful actions
    that had the effect of politicizing intelligence. Ombudspersons from three agencies agreed that tradecraft had been violated
    as part of a broader pattern, and senior agency and Intelligence Community leaders were involved. The ombudsperson faced
    an ethical duty to address politicization alongside personal and professional risks, including pressure from the surrounding
    political environment.
  question: What should the ODNI ombudsperson do about completing the inquiry and reporting its findings to the Senate Select
    Committee on Intelligence?
  options:
    O1:
      do: The ombudsperson should complete the inquiry and submit its findings to the Senate Select Committee on Intelligence.
      move: act
      irreversible: true
    O2:
      do: The ombudsperson should discontinue the inquiry and withhold its findings from the Senate Select Committee on Intelligence.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Analysts raised concerns about politicization and loss of analytic objectivity concerning Russian and Chinese election
      influence and interference.
  - id: F2
    kind: situation
    status: confirmed
    fact: The analysts first sought help from their managers, and almost all said they received no satisfaction.
  - id: F3
    kind: situation
    status: assessed
    fact: Analysts reported that managers had acted to suppress analytic conclusions or otherwise politicize intelligence,
      and the analysts faced some risk in coming forward.
  - id: F4
    kind: situation
    status: assessed
    fact: Political pressures had sometimes created the appearance of bias or lost objectivity without necessarily reflecting
      an attempt by leaders or analysts to politicize intelligence.
  - id: F5
    kind: situation
    status: assessed
    fact: The inquiry documented incidents of willful actions that had the effect of politicizing intelligence, whatever the
      actors' motivations.
  - id: F6
    kind: situation
    status: assessed
    fact: Ombudspersons from three agencies agreed that tradecraft had been violated as part of a large-scale pattern with
      traces leading to senior ODNI levels.
  - id: F7
    kind: situation
    status: confirmed
    fact: Powerful agency and Intelligence Community leaders were involved, including officials for whom the ombudsperson
      worked.
  - id: F8
    kind: authority
    status: confirmed
    fact: The ombudsperson considered it an ethical duty to shine a light on politicization and see the inquiry through to
      its end.
  - id: F9
    kind: situation
    status: assessed
    fact: The ombudsperson considered the personal and professional consequences of addressing politicization, amid public
      and political pressure and demands for loyalty over objectivity.
  considerations:
  - id: C1
    facts:
    - F6
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The ombudsperson regarded shining a light on politicization and seeing the inquiry through as an ethical duty; the
      cross-agency ombudspersons agreed that tradecraft had been violated in a broader pattern.
  - id: C2
    facts:
    - F2
    - F3
    equity: protected_activity
    favors:
    - O1
    weight: strong
    why: Analysts had sought help through their managers without satisfaction and came forward at some risk. Completing the
      inquiry responds to their concerns rather than leaving them unaddressed.
  - id: C3
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The inquiry distinguished political pressure that could create an appearance of bias from incidents of willful actions
      that had the effect of politicizing intelligence. Reporting should preserve that distinction while addressing the documented
      conduct.
  - id: C4
    facts:
    - F7
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Senior leaders, including officials for whom the ombudsperson worked, were implicated, and pursuing the inquiry carried
      personal and professional risks amid political pressure. Those risks were real, but the ombudsperson did not treat them
      as a reason to stop.
  - id: C5
    facts:
    - F1
    - F5
    - F8
    equity: oversight_candor
    favors:
    - O1
    weight: strong
    why: The ombudsperson saw politicization as undermining national security and as contrary to the intelligence community's
      role. Completing and reporting the inquiry gives oversight a candid account of the findings.
  reasoning:
    read: 'This was not simply a disagreement over analytic judgments: political pressure sometimes created an appearance
      of lost objectivity, and the inquiry documented willful actions that had the effect of politicizing intelligence. The
      trap is to treat every appearance as proof of intentional misconduct, or to let the risk and seniority of those involved
      silence scrutiny.'
    weighing: The ethical duty to address politicization, the lack of satisfaction through managers, and the cross-agency
      finding of tradecraft violations weigh strongly toward {O1} {C1} {C2}. The findings should distinguish pressure that
      appeared to compromise objectivity from willful actions, rather than overstate what the inquiry established {C3}. Personal
      and professional risk weighs against proceeding, but the ombudsperson concluded that the duty to analysts and the national-security
      importance of objective analysis outweighed that risk {C4} {C5}.
    tradecraft: Complete the inquiry and report its findings to the Senate Select Committee on Intelligence. Keep the account
      accurate and distinguish the different kinds of pressure and conduct found, so the record supports objective analysis
      rather than political claims.
    uncertainty: Some political pressure could create the appearance of bias without an intent to politicize. That uncertainty
      calls for careful characterization, but does not negate the separately documented incidents or the broader pattern.
    handoff: The ombudsperson carried out the inquiry with a deputy and consulted across agency ombudspersons; advice from
      attorneys and former analytic ombudspeople also informed the decision. The findings were directed to the Senate Select
      Committee on Intelligence, the oversight body addressed by the memorandum.
    tempting_wrong:
      option: O2
      pull: Stopping could avoid personal and professional consequences, particularly where senior leaders were involved and
        the surrounding political environment created pressure.
      why_wrong: The ombudsperson regarded addressing politicization as an ethical duty, and stopping after analysts had received
        no satisfaction through managers would leave documented tradecraft concerns unaddressed.
    rejected:
      O2: The ombudsperson did not allow personal and professional risk or the seniority of those involved to override the
        duty to complete the inquiry and report its findings.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The inquiry no longer supported a finding of tradecraft violations or a broader pattern, and the remaining concern
        was only an appearance of bias from political pressure.
      then: O2
      why: Without substantiated conduct or a broader pattern to report, the basis for continuing this inquiry would be materially
        weaker.
    would_not_change:
    - id: noflip1
      if: The personal and professional risks to the ombudsperson remained substantial, or senior leaders remained among those
        involved.
      why: Those risks and the involvement of senior leaders were present, but the ombudsperson still considered it a duty
        to complete the inquiry.
    watch_for:
    - id: watch1
      what: Whether new information changes the distinction between pressure that created an appearance of compromised objectivity
        and willful actions that had the effect of politicizing intelligence.
      favors:
      - O2
      why: That distinction affects how much of the inquiry's basis remains, though it does not by itself erase the duty to
        report supported findings.
  lesson: When concerns about politicization remain unresolved through ordinary management channels, an oversight official
    should pursue credible findings despite personal or professional pressure. The report should distinguish appearance from
    substantiated conduct and preserve an objective, accurate account for oversight.
  limits: This reasoning applies to the oversight judgment to complete and report this inquiry, not to a conclusion that every
    instance of political pressure is intentional politicization. It does not determine findings beyond the conduct and tradecraft
    concerns described here.
  library:
    domain: intel-oversight
    family: CORPUS-NS-488462c3
    source: https://www.cia.gov/resources/csi/static/Article-Zulauf-SafeguardingObjectivityInIntelligenceAnalysis.pdf
    episode_focus: In late 2020, after analysts’ complaints were not resolved through their managers, the ombudsperson and
      deputy investigated alleged politicization and found tradecraft violations in a broader pattern. The ombudsperson weighed
      personal and professional risk against the duty to support analysts and document what needed fixing, and chose to complete
      the inquiry. Exclude the operational details of evidence gathering; the decision point is the oversight judgment to
      pursue and report the inquiry.
