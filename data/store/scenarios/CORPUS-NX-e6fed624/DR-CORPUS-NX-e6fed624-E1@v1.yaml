case:
  id: DR-CORPUS-NX-e6fed624-E1@v1
  title: Naming a Component in an Accident Report
  status: draft
  setting: Accident Investigation Board; place and time not stated.
  decider: The Accident Investigation Board President
  agent: The Accident Investigation Board President
  agent_role: decide
  situation: The Accident Investigation Board President is responsible for a report about an aircraft accident. The report
    is intended to remain unclassified and releasable. A specific failed component has a name that could be included in the
    report. A generic label such as LRU or LRU-X-1 could be used instead. The decision is whether to name the component specifically
    or use a generic label.
  question: What should the Accident Investigation Board President do about naming the component in the report?
  options:
    O1:
      do: The Board President will disclose the specific component name in the report.
      move: act
      irreversible: true
    O2:
      do: The Board President will defer publication while reviewing the component name.
      move: hold
      irreversible: false
    O3:
      do: The Board President will withhold the specific component name and use a generic label.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision concerns an accident investigation report.
  - id: F2
    kind: situation
    status: confirmed
    fact: The report is intended to remain unclassified.
  - id: F3
    kind: situation
    status: confirmed
    fact: The report is intended to be releasable.
  - id: F4
    kind: situation
    status: confirmed
    fact: The failed component has a specific name that could be used in the report.
  - id: F5
    kind: situation
    status: confirmed
    fact: LRU is an available generic label for the component.
  - id: F6
    kind: situation
    status: confirmed
    fact: LRU-X-1 is also an available generic label for the component.
  - id: F7
    kind: situation
    status: confirmed
    fact: The generic-label choice is an alternative to naming the specific component.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F7
    equity: classification_integrity
    favors:
    - O3
    weight: strong
    why: The report is intended to remain unclassified, and the Board President used a generic label in place of the specific
      component name to preserve that aim.
  - id: C2
    facts:
    - F3
    - F4
    - F7
    equity: classification_integrity
    favors:
    - O3
    weight: strong
    why: The report is also intended to be releasable; the stated reason for using a generic label is to keep the report releasable.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: classification_integrity
    favors:
    - O3
    weight: weak
    why: A generic label is an available alternative to naming the component specifically, and the Board President selected
      that approach for the report.
  reasoning:
    read: This is a reporting choice about how to identify a component, not a decision about the aircraft failure itself.
      The relevant constraint is the stated aim to keep the report unclassified and releasable; the generic label is the means
      chosen to serve that aim.
    weighing: 'The Board President''s stated reasons support O3: the generic term was used to keep the report unclassified
      and releasable {C1} {C2}. The available generic labels make that choice possible without naming the component specifically
      {C3}. The balance depends on the report continuing to have those stated classification and release aims.'
    tradecraft: Use the generic designation consistently in the report and record that it was selected to preserve the stated
      unclassified and releasable status. Any review of a proposed specific name should focus on whether its inclusion is
      compatible with those aims.
    uncertainty: It is not established whether naming the component would necessarily change the report's classification or
      release status.
    handoff: The Board President is identified as the decision-maker. There is no stated basis for requiring referral to another
      office, so no additional approval or consultation should be inferred.
    tempting_wrong:
      option: O1
      pull: Using the specific name could seem preferable because it identifies the component directly.
      why_wrong: The stated basis for the decision is to keep the report unclassified and releasable, and the generic label
        was selected to serve that purpose.
    rejected:
      O1: The Board President used a generic label rather than the specific name to keep the report unclassified and releasable.
      O2: The recorded decision is to use a generic label, and no stated need to defer publication is given.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A review established that including the specific name would not compromise the report's unclassified and releasable
        status.
      then: O1
      why: The stated reason for choosing a generic label would no longer weigh against naming the component.
    would_not_change:
    - id: noflip1
      if: The report remains intended to be unclassified and releasable, and the generic-label option remains available.
      why: Those are the aims and alternative that support the Board President's recorded choice.
    watch_for:
    - id: watch1
      what: Whether naming the component specifically would affect the report's unclassified or releasable status.
      favors:
      - O3
      why: Those are the stated aims for which the generic designation was selected.
  lesson: When a report is intended to remain unclassified and releasable, use a generic label if that is the stated means
    of preserving those aims. Do not assume that specificity is required when the decision record supports a generic designation.
  limits: This reasoning applies to the report-naming choice and the stated classification and release aims. It does not establish
    a general rule that component names must be withheld or address the technical cause of the accident.
