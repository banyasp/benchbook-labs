case:
  id: DR-CORPUS-NX-2cc1e0ea-E5@v1
  title: Whether to Create an Interagency Task Force
  status: draft
  setting: Place not specified; before 2005; TF 714 and the intelligence agencies
  decider: The commanding general of TF 714
  agent: The commanding general of TF 714
  agent_role: decide
  situation: TF 714 is highly compartmented, and it faces an operating environment dominated by AQI. Information held by intelligence
    agencies is not consistently reaching the task force. Secrecy, autonomy, and exclusiveness shape the cultures of both
    the agencies and the task force. Bringing agencies into a joint interagency task force would require voluntary participation
    and trust among the organizations. The commanding general must choose whether to preserve TF 714’s existing organizational
    model or pursue a collaborative structure with intelligence agencies.
  question: What should the commanding general of TF 714 do about the task force’s organizational model?
  options:
    O1:
      do: The commanding general declines formation of a JIATF and retains TF 714’s existing organizational model.
      move: act
      irreversible: false
    O2:
      do: The commanding general authorizes formation of a JIATF and seeks intelligence-agency participation in it.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: TF 714 is highly compartmented.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The operating environment dominated by AQI was assessed as demanding changes to secrecy, autonomy, and exclusiveness
      in the intelligence agencies and the task force.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Intelligence agencies held information the task force was not seeing.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Information sharing was incomplete among the CIA, NSA, and the task force’s operational elements.
  - id: F5
    kind: capability
    status: assessed
    fact: The commanding general was convinced that TF 714 needed a joint interagency task force.
  - id: F6
    kind: capability
    status: assessed
    fact: A joint interagency task force would require agencies to participate voluntarily in a work environment of interdependency,
      cooperation, trust, and transparency.
  - id: F7
    kind: capability
    status: assessed
    fact: Trust would require agencies to share sensitive human-intelligence information with the task force and confidence
      that it would be used appropriately.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Intelligence agencies held information the task force was not seeing, so retaining a compartmented structure would
      leave important information gaps.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Sharing was incomplete among the agencies and the task force's operational elements; a collaborative structure was
      intended to address that disconnection.
  - id: C3
    facts:
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The AQI-dominated operating environment was assessed as demanding changes to secrecy, autonomy, and exclusiveness
      across the agencies and the task force.
  - id: C4
    facts:
    - F6
    - F7
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: Collaboration depended on voluntary participation and trust, including confidence that sensitive human-intelligence
      information shared with the task force would be used appropriately. These were demanding conditions for making the JIATF
      work, not reasons to abandon it.
  reasoning:
    read: The problem is not simply that TF 714 is compartmented; intelligence agencies hold information it is not seeing,
      while the operating environment calls for less organizational separation. The trap is treating existing secrecy and
      autonomy as a reason to preserve the model, when those cultures are obstacles the proposed JIATF must overcome.
    weighing: 'The information gaps and the assessed need to change organizational cultures favor O2. Creating the JIATF would
      be demanding: agencies had to participate voluntarily, cooperate across institutional boundaries, and trust the task
      force with sensitive information. Those conditions make implementation difficult, but the commanding general judged
      that the operating environment required the collaborative structure. The balance depends on building that trust and
      ensuring information is used appropriately.'
    tradecraft: Authorize the collaborative structure, then make participation and trust-building explicit implementation
      priorities. Engage agency and task-force leadership, establish shared expectations for cooperation and appropriate use
      of sensitive information, and record participation, unresolved barriers, and steps taken to address them.
    uncertainty: The operational effects of the information gaps and the speed at which agencies would participate are not
      established. Separate legal or classification rules for information sharing are also unspecified.
    handoff: The commanding general should decide whether to pursue the JIATF and involve leadership from the intelligence
      agencies and the task force in shaping participation and trust. Voluntary cooperation across these organizations is
      necessary to make the structure work.
    tempting_wrong:
      option: O1
      pull: Keeping TF 714's existing model may seem simpler and may preserve familiar organizational boundaries.
      why_wrong: That would leave the task force without information agencies were not sharing and would retain the secrecy,
        autonomy, and exclusiveness assessed as needing change.
    rejected:
      O1: The commanding general did not preserve TF 714's existing model because intelligence gaps and the AQI operating
        environment called for a collaborative interagency structure.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Agency participation could not be obtained voluntarily or the task force could not be trusted to use sensitive information
        appropriately.
      then: O1
      why: Without the participation and trust necessary for collaboration, the proposed structure might not be operationally
        viable; this is an authored counterfactual.
    would_not_change:
    - id: noflip1
      if: Secrecy, autonomy, and exclusiveness remain entrenched at the outset.
      why: Their persistence alone would not reverse the choice; overcoming these organizational cultures was a purpose of
        the JIATF.
    watch_for:
    - id: watch1
      what: Whether agencies participate voluntarily, share information with the task force, and gain confidence that it will
        be used appropriately.
      favors:
      - O2
      why: These are necessary conditions for trust and cooperation in the JIATF.
  lesson: When a changing operating environment exposes consequential information gaps, preserving existing organizational
    boundaries may perpetuate the problem. A collaborative structure can be warranted, but it depends on voluntary participation,
    trust, and confidence in appropriate information use.
  limits: This reasoning concerns an organizational choice made in response to intelligence-sharing gaps and a changing adversary
    environment. It does not establish rules for particular collection activities, information-access decisions, or legal
    authorities not addressed here.
