case:
  id: DR-OHA-26-0088-revise1@v1
  title: Guideline G Alcohol Consumption Security Concern – Access Authorization Restoration [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, August 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is a DOE contractor employee who requires an access authorization. He has prior arrests for public
    intoxication in 2013 and a DWI in November 2025. The Local Security Office raised a security concern under Guideline G,
    citing those arrests and a psychologist’s finding of habitual binge drinking. The Individual completed an eight‑week intensive
    outpatient program, is participating in after‑care, and has provided seven consecutive negative PEth tests through August
    2026. Witnesses, including the HRP counselor and the Individual’s spouse, testified that he has not consumed alcohol since
    the DWI arrest and is compliant with treatment. The Administrative Judge must determine whether the security concerns
    are resolved and whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge partially restores the authorization with monitoring.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested for public intoxication in 2013.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual was arrested for driving while intoxicated on November 13, 2025; the charge was pending at the hearing.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline G based on the arrests and a psychologist’s
      report.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE psychologist evaluated the Individual in January 2026 and concluded he habitually and binge‑consumes alcohol.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual completed an eight‑week intensive outpatient program on March 11, 2026 and is attending after‑care.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The Individual provided seven negative PEth test results from March through August 2026.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The HRP counselor and the Individual’s spouse testified that he has not consumed alcohol since the DWI arrest and
      is compliant with treatment.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Administrative Judge has authority under 10 C.F.R. §710.7(a) to decide on granting or restoring access authorization.
  considerations:
  - id: C1
    facts:
    - F6
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: After-care participation remains a mitigating factor, but its impact is reduced given lingering concerns about alcohol
      misuse.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The series of negative PEth tests demonstrate abstinence, yet the weight is lowered to reflect the psychologist's
      residual risk assessment.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Lifestyle changes are positive, but they are considered less determinative when a habit-forming pattern was previously
      identified.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although 10 C.F.R. §710.7(a) creates a presumption against granting a clearance, the Judge may overturn that presumption
      when the record demonstrates that the security concern is resolved.
  - id: C5
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The psychologist's report of habitual binge drinking signals a lingering risk that justifies continued oversight,
      making partial restoration with monitoring the appropriate balance.
  - id: C6
    facts:
    - F5
    - F7
    equity: risk_management
    favors:
    - O4
    weight: strong
    why: The psychologist's finding of habitual binge drinking indicates residual risk, and the objective PEth record suggests
      monitoring is prudent to ensure continued abstinence.
  reasoning:
    read: The LSO raised a Guideline G concern based on past alcohol-related arrests and a psychologist's report of habitual
      binge drinking. The record now shows treatment completion, sustained abstinence, and lifestyle changes, but the psychologist
      still notes a pattern that could re-emerge.
    weighing: Mitigating conditions (c) and (d) are satisfied, yet the psychologist's lingering risk assessment and the principle
      of prudent oversight tilt the balance toward a partial restoration with monitoring. The weakened weights of C1-C3 reduce
      their dominance, while the new strong risk-management consideration (C6) and the re-oriented C5 together make O4 the
      most appropriate outcome.
    tradecraft: The decision is documented in the Administrative Judge's Decision, citing the treatment records, PEth results,
      and psychologist's report, and the partial restoration order is entered per 10 C.F.R. §710.27(d) with a monitoring plan
      attached.
    uncertainty: Future relapse remains possible despite current abstinence; the monitoring requirement addresses this uncertainty
      by providing a mechanism for rapid response if a violation occurs.
    handoff: The Administrative Judge decides alone under 10 C.F.R. §710.7(a), with the decision subject to appeal under 10
      C.F.R. §710.28.
    tempting_wrong:
      option: O3
      pull: The psychologist's original finding of habitual binge drinking and the pending DWI charge could tempt a full denial.
      why_wrong: Denial would overlook the concrete evidence of sustained abstinence, successful treatment, and the ability
        to mitigate risk through monitoring.
    rejected:
      O1: Full restoration ignores the psychologist's residual risk assessment and eliminates the safeguard of ongoing monitoring.
      O2: Holding the decision pending would unnecessarily extend the period without a clearance despite clear evidence of
        mitigation.
      O3: Denial fails to recognize that the individual has met the required mitigating conditions and that a monitored partial
        restoration adequately protects security.
  verdict:
    choice: O4
    basis: recommended
    decisive:
    - C5
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had relapsed and tested positive for alcohol during the after-care period.
      then: O3
      why: A relapse would indicate that the treatment was ineffective and that the risk to reliability persists.
    - id: flip2
      if: The Individual had failed to provide a series of consecutive negative PEth tests demonstrating continuous abstinence.
      then: O1
      why: Without objective proof of abstinence, the mitigating condition (d) would not be satisfied, and a full restoration
        would be premature.
    would_not_change:
    - id: noflip1
      if: The DWI charge remained pending at the time of the hearing.
      why: The pending charge does not, by itself, negate the mitigating evidence of treatment and abstinence, so the restoration
        decision stands.
    watch_for:
    - id: watch1
      what: Any future positive alcohol test or violation of after-care requirements.
      favors:
      - O3
      why: A new violation would re-activate Guideline G concerns and could lead to revocation of the clearance.
  lesson: When Guideline G concerns are raised, an individual can resolve them through treatment and documented abstinence,
    but a lingering risk assessment may warrant partial restoration with ongoing monitoring to safeguard security while recognizing
    rehabilitation.
  limits: This approach applies when objective evidence of sustained abstinence exists and a qualified psychologist still
    identifies residual risk; it does not extend to cases lacking verifiable testing or where relapse occurs during the monitoring
    period.
