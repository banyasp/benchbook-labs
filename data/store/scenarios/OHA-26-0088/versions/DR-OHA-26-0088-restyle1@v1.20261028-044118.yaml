case:
  id: DR-OHA-26-0088-restyle1@v1
  title: Guideline G Alcohol Consumption Security Concern – Access Authorization Restoration [restyle]
  status: needs_review
  setting: DOE Office of Hearings and Appeals – August 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The employee of a DOE contractor seeks reinstatement of a security clearance. His record includes a 2013 public
    intoxication citation and a pending DWI charge from 13 Nov 2025. The Local Security Office filed a Guideline G concern,
    referencing those incidents and a DOE psychologist's assessment of habitual binge drinking. He finished an eight-week
    intensive outpatient program on 11 Mar 2026, remains in after-care, and has produced seven successive negative PEth results
    from March through August 2026. Testimony from the HRP counselor and his spouse confirms total abstinence since the DWI
    incident and full compliance with treatment. The Administrative Judge must decide if the security issue is mitigated and
    whether to restore the clearance.
  question: How should the Administrative Judge rule on the employee's access authorization?
  options:
    O1:
      do: The Judge fully restores the employee's access authorization, ending the suspension.
      move: act
      irreversible: true
    O2:
      do: The Judge postpones the ruling, requiring additional evidence before a decision.
      move: hold
      irreversible: false
    O3:
      do: The Judge denies the employee's request to reinstate the access authorization.
      move: act
      irreversible: true
    O4:
      do: The Judge restores the authorization conditionally, imposing ongoing monitoring and reporting requirements.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that mandates a security access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: In 2013 the employee was arrested on a charge of public intoxication.
  - id: F3
    kind: situation
    status: confirmed
    fact: On 13 Nov 2025 the employee was arrested for driving while intoxicated; the charge remained pending at the time
      of the hearing.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office filed a Guideline G security concern, citing the arrests and a psychologist's evaluation.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE psychologist assessed the employee in Jan 2026 and concluded he engages in habitual binge drinking.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee completed an eight-week intensive outpatient program on 11 Mar 2026 and continues participation in
      after-care.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The employee submitted seven consecutive negative PEth test results covering March through August 2026.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Both the HRP counselor and the employee's spouse testified that he has abstained from alcohol since the DWI arrest
      and remains compliant with his treatment plan.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Administrative Judge is empowered by 10 C.F.R. §710.7(a) to grant or restore an access authorization.
  considerations:
  - id: C1
    facts:
    - F6
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Because the employee is actively engaged in after-care and the HRP counselor describes him as compliant and responsive,
      he fulfills mitigating condition (c) of Guideline G, which requires participation in counseling without relapse and
      demonstrable progress.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The seven successive negative PEth results from March-August 2026, together with documented completion of the intensive
      outpatient program, satisfy mitigating condition (d) of Guideline G, indicating successful treatment and verified abstinence.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Testimony evidences that the employee has modified his lifestyle—discontinuing participation in the pool league,
      avoiding alcohol-heavy social venues, and intending to acquire a private pool table—thereby lowering the risk to his
      reliability and trustworthiness.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: While 10 C.F.R. §710.7(a) establishes a presumption against granting a clearance, the Judge may rebut that presumption
      when the record shows the security concern has been mitigated.
  - id: C5
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Although the DOE psychologist initially concluded the employee engages in habitual binge drinking, he qualified his
      assessment by noting the employee is "progressing toward full rehabilitation," reinforcing that the security concern
      is mitigated.
  reasoning:
    read: The Local Security Office filed a Guideline G concern grounded in prior alcohol-related arrests and a psychologist's
      report of habitual binge drinking. The pivotal question is whether the employee's subsequent treatment, sustained abstinence,
      and behavioral adjustments have removed the risk to national security.
    weighing: 'Considerations C1-C3 demonstrate that the Individual satisfies conditions (c) and (d): he is in after-care,
      has no relapse history, and has provided objective evidence of abstinence. The presumption against granting noted in
      C4 is outweighed by this concrete mitigation, and the psychologist''s tempered view in C5 further confirms a low residual
      risk. Consequently, the security concern is deemed resolved.'
    tradecraft: The ruling is documented in the Administrative Judge's Decision memorandum, referencing the pertinent exhibits
      and testimony, and the restoration order is filed in the employee's security record pursuant to 10 C.F.R. §710.27(d).
    uncertainty: The chief uncertainty remains the potential for future relapse, mitigated by the continued after-care requirement
      and scheduled PEth testing.
    handoff: The Administrative Judge renders the decision independently, per 10 C.F.R. §710.7(a), though the outcome may
      be appealed under 10 C.F.R. §710.28.
    tempting_wrong:
      option: O3
      pull: The outstanding DWI charge and the psychologist's initial finding of habitual binge drinking might tempt a denial.
      why_wrong: Denial would disregard the considerable mitigating evidence of continuous abstinence, compliance with treatment,
        and lifestyle modifications that the regulations expressly permit to offset Guideline G concerns.
    rejected:
      O2: Deferring the decision would unduly postpone a clearance that the record indicates no longer poses a security risk.
      O3: Denial overlooks that the employee has satisfied the mitigating conditions needed to resolve Guideline G.
      O4: A conditional restoration is unnecessary because the evidence fulfills full mitigation; no extra monitoring beyond
        routine after-care is required.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had not supplied a sequence of consecutive negative PEth results showing continuous abstinence.
      then: O3
      why: Absent objective proof of abstinence, mitigating condition (d) would remain unmet, leaving the security concern
        unresolved.
    - id: flip2
      if: The employee had relapsed, producing a positive alcohol test during the after-care phase.
      then: O3
      why: A relapse would demonstrate that treatment failed and that the reliability risk persists.
    would_not_change:
    - id: noflip1
      if: The DWI charge stayed pending at the hearing.
      why: The pending charge alone does not outweigh the mitigating evidence of treatment and abstinence, so the restoration
        decision remains appropriate.
    watch_for:
    - id: watch1
      what: Any subsequent positive alcohol test or breach of after-care obligations.
      favors:
      - O3
      why: A new violation would reactivate Guideline G concerns and could justify revocation of the clearance.
  lesson: When a Guideline G issue is identified, an employee can fully mitigate it by completing the required treatment,
    providing documented abstinence, and showing lasting behavioral change, despite the presumption against granting a clearance.
    Objective evidence such as PEth tests and credible witness statements are pivotal in meeting the mitigating conditions.
  limits: This analysis applies only when the employee has adhered to all treatment recommendations and can furnish continuous,
    verifiable proof of abstinence. It does not extend to situations lacking objective testing or where a relapse occurs during
    the monitoring interval.
