case:
  id: DR-OHA-26-0088@v1
  title: Guideline G Alcohol Consumption Security Concern – Access Authorization Restoration
  status: draft
  setting: DOE Office of Hearings and Appeals, August 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is a DOE contractor employee who requires an access authorization. He has prior arrests for public
    intoxication in 2013 and a DWI in November 2025. The Local Security Office raised a security concern under Guideline G,
    citing those arrests and a psychologist’s finding of habitual binge drinking. The Individual completed an eight‑week intensive
    outpatient program, is participating in after‑care, and has provided seven consecutive negative PEth tests through August
    2026. Witnesses, including the HRP counselor and the Individual’s spouse, testified that he has not consumed alcohol since
    the DWI arrest and is compliant with treatment. The Administrative Judge must determine whether the security concerns
    are resolved and whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge holds the decision pending further evidence.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge partially restores the authorization with monitoring.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested for public intoxication in 2013.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual was arrested for driving while intoxicated on November 13, 2025; the charge was pending at the hearing.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office raised a security concern under Guideline G based on the arrests and a psychologist’s
      report.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE psychologist evaluated the Individual in January 2026 and concluded he habitually and binge‑consumes alcohol.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual completed an eight‑week intensive outpatient program on March 11, 2026 and is attending after‑care.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The Individual provided seven negative PEth test results from March through August 2026.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The HRP counselor and the Individual’s spouse testified that he has not consumed alcohol since the DWI arrest and
      is compliant with treatment.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Administrative Judge has authority under 10 C.F.R. §710.7(a) to decide on granting or restoring access authorization.
  considerations:
  - id: C1
    facts:
    - F6
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The Individual is participating in after‑care and has been described by the HRP counselor as compliant and responsive,
      satisfying mitigating condition (c) of Guideline G – participation in counseling with no prior relapse and satisfactory
      progress.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Seven consecutive negative PEth tests (March‑August 2026) and the Individual’s documented completion of the intensive
      outpatient program meet mitigating condition (d) – successful completion of treatment and demonstrated abstinence.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Testimony shows the Individual has altered his lifestyle (stopped attending the pool league, avoids alcohol‑laden
      social settings, and plans to purchase a private pool table), indicating reduced risk to reliability and trustworthiness.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although 10 C.F.R. §710.7(a) creates a presumption against granting a clearance, the Judge may overturn that presumption
      when the record demonstrates that the security concern is resolved.
  - id: C5
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The DOE Psychologist, while initially concluding habitual binge drinking, qualified his view by stating the Individual
      is “on his way” to full rehabilitation, supporting the finding that the concern is mitigated.
  reasoning:
    read: The LSO raised a Guideline G concern based on past alcohol‑related arrests and a psychologist’s report of habitual
      binge drinking. The core issue is whether the Individual’s subsequent treatment, abstinence, and behavioral changes
      eliminate the risk to national security.
    weighing: 'The Judge applied the mitigating conditions listed in Guideline G. Considerations C1‑C3 demonstrate that the
      Individual satisfies conditions (c) and (d): he is in after‑care, has no relapse history, and has provided objective
      evidence of abstinence. The presumption against granting (C4) is outweighed by this concrete mitigation, and the psychologist’s
      tempered opinion (C5) reinforces that the risk is now low. Consequently, the security concern is deemed resolved.'
    tradecraft: The decision is recorded in the Administrative Judge’s Decision, citing the specific exhibits and testimony,
      and the restoration order is entered into the Individual’s security file per 10 C.F.R. §710.27(d).
    uncertainty: The primary uncertainty is the possibility of future relapse, which is mitigated by the ongoing after‑care
      requirement and periodic PEth testing.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. §710.7(a), but the decision is subject to
      appeal under 10 C.F.R. §710.28.
    tempting_wrong:
      option: O3
      pull: The lingering DWI charge and the psychologist’s original finding of habitual binge drinking could tempt a denial.
      why_wrong: Denial would ignore the substantial mitigating evidence of sustained abstinence, treatment compliance, and
        lifestyle changes that the regulations expressly allow to offset Guideline G concerns.
    rejected:
      O2: Holding the decision pending would unnecessarily delay a clearance that the record shows is no longer a security
        risk.
      O3: Denial fails to recognize that the Individual has met the mitigating conditions required to resolve Guideline G.
      O4: Partial restoration is unwarranted because the evidence satisfies full mitigation; no additional monitoring beyond
        the standard after‑care is needed.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had failed to provide a series of consecutive negative PEth tests demonstrating continuous abstinence.
      then: O3
      why: Without objective proof of abstinence, the mitigating condition (d) would not be satisfied, and the security concern
        would remain unresolved.
    - id: flip2
      if: The Individual had relapsed and tested positive for alcohol during the after‑care period.
      then: O3
      why: A relapse would indicate that the treatment was ineffective and that the risk to reliability persists.
    would_not_change:
    - id: noflip1
      if: The DWI charge remained pending at the time of the hearing.
      why: The pending charge does not, by itself, negate the mitigating evidence of treatment and abstinence, so the restoration
        decision stands.
    watch_for:
    - id: watch1
      what: Any future positive alcohol test or violation of after‑care requirements.
      favors:
      - O3
      why: A new violation would re‑activate Guideline G concerns and could lead to revocation of the clearance.
  lesson: When Guideline G concerns are raised, an individual can fully resolve them by completing prescribed treatment, maintaining
    documented abstinence, and demonstrating sustained behavioral change, even in the face of a presumption against granting
    a clearance. Objective evidence (e.g., PEth tests) and credible witness testimony are decisive in satisfying the mitigating
    conditions.
  limits: This reasoning applies only where the individual has complied with all treatment recommendations and can provide
    continuous, verifiable proof of abstinence. It does not extend to cases lacking objective testing or where relapse occurs
    during the monitoring period.
