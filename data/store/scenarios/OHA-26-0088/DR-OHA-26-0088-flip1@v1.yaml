case:
  id: DR-OHA-26-0088-flip1@v1
  title: Guideline G Alcohol Consumption Security Concern – Access Authorization Restoration [flip]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, September 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The employee, a contractor for the Department of Energy, seeks restoration of his security clearance. He has
    two prior alcohol-related arrests (public intoxication in 2013 and a DWI on 13 Nov 2025). The Local Security Office filed
    a Guideline G security concern, citing the arrests and a DOE psychologist's assessment of habitual binge drinking. The
    employee completed an eight-week intensive outpatient program on 11 Mar 2026, is enrolled in after-care, and witnesses—including
    the HRP counselor and his spouse—attest to his abstinence since the DWI. The Judge must decide whether the security concern
    is resolved and whether to reinstate the clearance.
  question: What should the Administrative Judge do regarding the employee's access authorization?
  options:
    O1:
      do: Restore the employee's access authorization in full.
      move: act
      irreversible: true
    O2:
      do: Keep the matter pending pending additional evidence.
      move: hold
      irreversible: false
    O3:
      do: Deny the employee's request for access authorization.
      move: act
      irreversible: true
    O4:
      do: Restore the authorization conditionally, subject to ongoing monitoring.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: He was arrested for public intoxication in 2013.
  - id: F3
    kind: situation
    status: confirmed
    fact: He was arrested for driving while intoxicated on 13 Nov 2025; the charge remained pending at the hearing.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office filed a Guideline G concern based on the arrests and a psychologist's report.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE psychologist evaluated him in Jan 2026 and concluded he habitually engages in binge drinking.
  - id: F6
    kind: situation
    status: confirmed
    fact: He completed an eight-week intensive outpatient program on 11 Mar 2026 and is participating in after-care.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The Individual did not submit a continuous series of negative PEth test results; the available tests are intermittent
      and do not demonstrate uninterrupted abstinence.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The HRP counselor and the employee's spouse testified that he has not consumed alcohol since the DWI arrest and
      is complying with treatment.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Administrative Judge has authority under 10 C.F.R. §710.7(a) to grant or restore access authorizations.
  considerations:
  - id: C1
    facts:
    - F6
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: After-care participation and counselor testimony satisfy mitigating condition (c) of Guideline G, showing no relapse
      and satisfactory progress.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The intermittent PEth results do not establish continuous abstinence, so mitigating condition (d) is not met.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Witnesses describe lifestyle changes—cessation of pool-league participation and avoidance of alcohol-laden settings—that
      lower risk to reliability and trustworthiness.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although 10 C.F.R. §710.7(a) creates a presumption against granting, the Judge may overturn that presumption when
      the record shows the security concern is resolved.
  - id: C5
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The psychologist's assessment still characterizes the employee as a habitual binge drinker, and the qualifier "on
      his way" is insufficient without objective proof of sustained abstinence.
  reasoning:
    read: The Local Security Office raised a Guideline G concern based on two alcohol-related arrests and a psychologist's
      finding of habitual binge drinking. The central issue is whether the employee's treatment, after-care, and reported
      abstinence eliminate the reliability risk.
    weighing: Mitigating condition (c) is satisfied by after-care participation (C1). However, the lack of a continuous negative
      PEth record means condition (d) is unmet (C2). The psychologist's unchanged characterization of habitual binge drinking
      further undermines confidence (C5). Consequently, the security concern remains unresolved, leading to denial.
    tradecraft: The decision is entered in the Administrative Judge's formal decision memorandum, citing the relevant exhibits
      and testimony, and the denial is recorded in the employee's security file per 10 C.F.R. §710.27(d).
    uncertainty: Future behavior cannot be assured without continuous objective testing; the current record leaves a residual
      risk of relapse.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. §710.7(a), with the decision subject to appeal
      under 10 C.F.R. §710.28.
    tempting_wrong:
      option: O1
      pull: The employee's after-care participation and spouse testimony might tempt a full restoration.
      why_wrong: Granting clearance would ignore the critical gap in objective abstinence evidence, which the regulations
        require to satisfy Guideline G.
    rejected:
      O1: Full restoration overlooks the missing continuous PEth evidence and the psychologist's ongoing concerns.
      O2: Deferring the decision provides no resolution and unnecessarily prolongs uncertainty for both the employee and the
        agency.
      O4: Partial restoration is insufficient because the underlying objective proof of abstinence is absent; monitoring cannot
        compensate for that gap.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: He submitted a consecutive set of negative PEth screenings for each month from March to August 2026, covering the
        entire after‑care period.
      then: O1
      why: Continuous objective evidence would satisfy mitigating condition (d), allowing restoration.
    - id: flip2
      if: The employee consents to a structured monitoring program with quarterly PEth testing for the next year.
      then: O4
      why: Such monitoring would mitigate residual risk while allowing limited access.
    would_not_change:
    - id: noflip1
      if: The DWI charge remained pending at the time of the hearing.
      why: The pending charge does not, by itself, negate the mitigating evidence of treatment and abstinence, so the restoration
        decision stands.
    watch_for:
    - id: watch1
      what: Any future positive alcohol test or violation of after-care requirements.
      favors:
      - O3
      why: A new violation would re-activate Guideline G concerns and could lead to revocation of the clearance.
  lesson: When Guideline G concerns involve alcohol-related behavior, an individual must provide continuous, verifiable proof
    of abstinence—such as an uninterrupted series of negative PEth tests—to satisfy mitigating condition (d). Absent that
    objective evidence, denial of access is the appropriate outcome, even if after-care participation and witness testimony
    are favorable.
  limits: This analysis applies only when the record lacks continuous objective testing or when a psychologist's assessment
    continues to describe habitual binge drinking. It does not extend to cases where the individual can demonstrate uninterrupted
    abstinence through reliable biomarkers.
