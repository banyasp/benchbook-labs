case:
  id: DR-OHA-26-0088-addfact1@v1
  title: Guideline G Alcohol Consumption Security Concern – Access Authorization Restoration [addfact]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals – August 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The employee works for a DOE contractor in a role that requires a security access authorization. He has two prior
    arrests—public intoxication in 2013 and a DWI on 13 November 2025, the latter still pending at the hearing. The Local
    Security Office has raised a security concern under Guideline G, citing those arrests and a psychologist's assessment
    that the employee habitually binge-drinks. He completed an eight-week intensive outpatient treatment program on 11 March
    2026 and continues with after-care. Since March, he has provided seven consecutive negative PEth test results through
    August 2026. Testimony from the Human Reliability Program counselor and his spouse confirms he has abstained from alcohol
    since the DWI arrest and remains compliant with treatment. He also volunteers as a mentor for a youth robotics club in
    his community. The Administrative Law Judge holds authority under 10 C.F.R. § 710.7(a) to grant or restore the required
    access authorization.
  question: How should the Administrative Law Judge rule on the employee's access authorization?
  options:
    O1:
      do: Restore the employee's access authorization fully without conditions.
      move: act
      irreversible: true
    O2:
      do: Hold the decision pending until further evidence is submitted.
      move: hold
      irreversible: false
    O3:
      do: Deny the employee's access authorization at this time.
      move: act
      irreversible: true
    O4:
      do: Partially restore the authorization with ongoing monitoring requirements.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee is hired by a DOE contractor and holds a position that mandates a security access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: He was arrested for public intoxication in 2013.
  - id: F3
    kind: situation
    status: confirmed
    fact: He was arrested for driving while intoxicated on 13 November 2025; the charge remains pending at the hearing.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a security concern under Guideline G, referencing the arrests and a psychologist's
      report.
  - id: F5
    kind: situation
    status: confirmed
    fact: He volunteers as a mentor for a youth robotics club in his community.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A DOE psychologist evaluated him in January 2026 and concluded that he habitually engages in binge drinking.
  - id: F7
    kind: situation
    status: confirmed
    fact: He completed an eight-week intensive outpatient program on 11 March 2026 and is presently attending after-care.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: He submitted seven consecutive negative PEth test results covering March through August 2026.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The HRP counselor and his spouse testified that he has not consumed alcohol since the DWI arrest and is adhering
      to treatment.
  - id: F10
    kind: authority
    status: confirmed
    fact: The Administrative Law Judge has authority under 10 C.F.R. § 710.7(a) to decide on granting or restoring the access
      authorization.
  considerations:
  - id: C1
    facts:
    - F7
    - F9
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: The employee's ongoing after-care participation and the counselor's affirmation of his compliance demonstrate a substantial
      reduction in risk, yet the lingering nature of the DWI charge warrants continued oversight.
  - id: C2
    facts:
    - F7
    - F8
    - F9
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Seven consecutive negative PEth results (March-August 2026) together with documented treatment completion provide
      objective proof of abstinence, satisfying mitigating condition (d) but not eliminating the need for post-restoration
      monitoring.
  - id: C3
    facts:
    - F9
    equity: mission_effect
    favors:
    - O4
    weight: weak
    why: Testimony of lifestyle changes (e.g., cessation of pool-league attendance) lowers the reliability risk, though a
      modest monitoring regime remains prudent.
  - id: C4
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: 10 C.F.R. §710.7(a) permits the Judge to impose conditions on a restored authorization; the record supports a partial
      rather than unconditional grant.
  - id: C5
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O4
    weight: weak
    why: The DOE psychologist's assessment of habitual binge drinking, despite noting progress, leaves a residual relapse
      risk that justifies ongoing monitoring.
  - id: C6
    facts:
    - F5
    equity: character
    favors:
    - O4
    weight: weak
    why: Volunteer mentorship of a youth robotics club reflects responsible community involvement, supporting a less restrictive
      but still cautious approach.
  reasoning:
    read: The LSO invoked Guideline G based on two alcohol-related arrests and a psychologist's report of habitual binge drinking.
      The record now includes completed treatment, sustained abstinence, corroborating testimony, and community-service involvement.
    weighing: The Judge evaluates mitigating conditions (c) and (d) of Guideline G. Considerations C1-C3 confirm compliance
      with counseling and abstinence, but C5 highlights lingering professional concern, and C4 notes the statutory presumption
      against an unrestricted grant. Balancing these, the Judge finds that a partial restoration with monitoring best satisfies
      national-security interests while recognizing rehabilitation.
    tradecraft: The decision is entered as a Conditional Restoration Order in the ALJ's Decision memorandum, citing exhibits
      of PEth results, treatment records, and character references, and is recorded per 10 C.F.R. §710.27(d).
    uncertainty: Future relapse remains possible; the monitoring plan (periodic PEth testing and continued after-care) mitigates
      that risk.
    handoff: The ALJ acts alone under 10 C.F.R. §710.7(a); the order may be appealed under 10 C.F.R. §710.28.
    tempting_wrong:
      option: O1
      pull: The strong objective evidence of abstinence and treatment success could tempt a full, unconditional restoration.
      why_wrong: A full restoration would ignore the psychologist's lingering binge-drinking assessment and the pending DWI
        charge, both of which sustain a residual security concern.
    rejected:
      O1: Full restoration disregards the remaining risk identified by the psychologist and the unresolved legal matter.
      O2: Holding the decision pending would unnecessarily prolong a clearance that the record shows is largely mitigated.
      O3: Denial overstates the risk despite clear evidence of sustained abstinence, treatment compliance, and positive character
        factors.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had failed to provide a series of consecutive negative PEth tests demonstrating continuous abstinence.
      then: O3
      why: Without objective proof of abstinence, mitigating condition (d) would be unsatisfied, leading to denial.
    - id: flip2
      if: The employee had relapsed and tested positive for alcohol during the after-care period.
      then: O3
      why: A relapse would indicate ineffective treatment and a persisting reliability risk, justifying denial.
    - id: flip3
      if: The DOE psychologist had concluded that the employee was fully rehabilitated with no residual binge‑drinking risk.
      then: O1
      why: A definitive professional endorsement would satisfy all mitigating conditions, allowing a full restoration rather
        than a partial one.
    would_not_change:
    - id: noflip1
      if: The DWI charge remained pending at the time of the hearing.
      why: The pending charge alone does not outweigh the substantial mitigating evidence of treatment and abstinence.
    watch_for:
    - id: watch1
      what: Any future positive alcohol test or breach of after-care requirements.
      favors:
      - O3
      why: Such a violation would reactivate Guideline G concerns and could trigger revocation of the clearance.
  lesson: When Guideline G concerns are raised, partial restoration with structured monitoring can appropriately balance national-security
    imperatives and an individual's demonstrated rehabilitation. Objective abstinence evidence, treatment compliance, and
    positive character indicators support a conditional grant, while lingering professional or legal concerns justify continued
    oversight.
  limits: This approach applies only when the individual provides continuous, verifiable proof of abstinence and maintains
    participation in after-care. It does not extend to cases lacking objective testing, where professional assessments indicate
    unresolved binge-drinking risk, or where a relapse occurs during the monitoring period.
