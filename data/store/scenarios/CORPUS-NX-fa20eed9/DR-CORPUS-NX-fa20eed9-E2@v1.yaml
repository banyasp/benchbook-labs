case:
  id: DR-CORPUS-NX-fa20eed9-E2@v1
  title: Revising the Afghanistan War Plan
  status: draft
  setting: The Treaty Room in the White House, Friday afternoon, 21 September; an administration briefing on the USCENTCOM
    war plan.
  decider: The Secretary of Defense
  agent: The Secretary of Defense
  agent_role: decide
  situation: At a White House briefing, the Secretary of Defense and other senior officials considered the initial USCENTCOM
    plan for Afghanistan. The plan was conventional-force-oriented and emphasized terrorist targets. The Department of Defense
    had insufficient intelligence on Afghanistan and doubts about the reliability of the intelligence available. The plan
    was assessed as unlikely to achieve the President’s objectives, while officials feared that a weak response to the September
    11 attacks could encourage another attack. The initial proposal assigned special operations forces a supporting role ahead
    of follow-on conventional forces. A more central role supporting Afghan opposition forces was proposed, with U.S. forces
    supporting indigenous elements rather than taking the lead.
  question: What should the Secretary of Defense do with the initial USCENTCOM plan?
  options:
    O1:
      do: The Secretary of Defense rejects the initial plan and directs a revision centered on support for Afghan opposition
        forces.
      move: act
      irreversible: false
    O2:
      do: The Secretary of Defense approves the initial plan and retains its conventional-force orientation for the Afghanistan
        response.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The initial USCENTCOM plan was conventional-force-oriented.
  - id: F2
    kind: situation
    status: assessed
    fact: The plan's main emphasis was on terrorist targets.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Department of Defense had insufficient intelligence on Afghanistan and doubts about the reliability of the intelligence
      available.
  - id: F4
    kind: situation
    status: assessed
    fact: The plan was assessed as unlikely to produce the results the President sought.
  - id: F5
    kind: situation
    status: assessed
    fact: The administration feared that a less-than-impressive response to the September 11 attacks might encourage another
      terrorist strike.
  - id: F6
    kind: capability
    status: confirmed
    fact: The initial proposal assigned special operations forces a supporting role in preparation for follow-on conventional
      forces.
  - id: F7
    kind: capability
    status: confirmed
    fact: A more vigorous role for special operations forces, drawing on their ability to work with proxy forces, was proposed.
  - id: F8
    kind: situation
    status: assessed
    fact: The proposed support-to-resistance approach would have U.S. forces support indigenous elements rather than take
      the lead in defeating the Taliban.
  - id: F9
    kind: situation
    status: assessed
    fact: The proposed approach was expected to keep the U.S. force presence small and limit effort and risk.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The plan focused on terrorist targets, but intelligence on Afghanistan was insufficient and its reliability was in
      doubt. The approach was therefore assessed as unlikely to produce the results the President sought.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Officials feared that a less-than-impressive response could encourage another attack, and concluded that a clear
      break with past methods was needed. Revising the plan toward support for Afghan opposition forces was the proposed way
      to pursue strategic effects rather than retain the assessed-ineffective approach.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The initial plan limited special operations forces to a supporting role before conventional forces followed. A more
      central role working with Afghan opposition forces would support indigenous elements rather than have U.S. forces take
      the lead, while keeping the U.S. presence small and limiting effort and risk.
  reasoning:
    read: 'The decision is not simply whether to respond forcefully: the initial proposal offered a conventional-force-oriented
      response centered on terrorist targets, but its intelligence basis and likely effectiveness were in doubt. The trap
      is treating a conspicuous response as necessarily an effective one, when officials feared both an ineffective response
      and the consequences of appearing not to respond impressively.'
    weighing: The balance favors rejecting the initial plan and revising it toward a more central support role for Afghan
      opposition forces. The stated grounds are the target-focused plan's likely failure to achieve the President's objectives
      despite insufficient and potentially unreliable intelligence, the concern that a weak response could invite another
      attack, and the judgment that supporting indigenous forces could produce strategic effects while limiting the U.S. footprint
      and risks. The choice depends on whether the revised approach can achieve those effects; the stated reasons do not establish
      that the conventional approach would be preferable if its intelligence and prospects were materially different.
    tradecraft: Record why the initial plan was judged inadequate, the intelligence limitations and reliability concerns considered,
      and why the revised approach was expected to better serve the President's objectives while limiting the U.S. presence
      and risks. Keep the decision at the level of the plan's strategic orientation and assigned role.
    uncertainty: The source identifies substantial uncertainty in the intelligence available on Afghanistan and in the likely
      results of the initial plan. It does not establish that the revised approach would certainly succeed; the decision rests
      on its comparative promise and the stated limits of the initial proposal.
    handoff: The Secretary of Defense should make the decision after considering the senior civilian and military officials
      involved in the briefing, including the policy and operational assessments, because the choice turns on both the plan's
      strategic effectiveness and the limits of the available intelligence.
    tempting_wrong:
      option: O2
      pull: Keeping the conventional-force orientation may appear to offer a decisive response to the attacks and address
        the fear that a weak response could invite another strike.
      why_wrong: 'That concern did not resolve the central defect: the target-focused plan was assessed as unlikely to achieve
        the President''s objectives given inadequate and doubtful intelligence. The stated judgment was that a clear break
        with past methods was needed.'
    rejected:
      O2: The initial plan was not approved because its target-focused, conventional-force orientation was assessed as unlikely
        to produce the results the President sought under the intelligence conditions described.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable and sufficient intelligence became available and the initial plan were then assessed as likely to achieve
        the President's objectives.
      then: O2
      why: That would remove the source's central stated reason for rejecting the target-focused plan and could make retaining
        its conventional-force orientation a reasonable choice.
    would_not_change:
    - id: noflip1
      if: Officials continued to fear that a less-than-impressive response might encourage another attack, but had no reason
        to think the initial plan would achieve the President's objectives.
      why: The fear of another attack did not, on its own, cure the initial plan's assessed ineffectiveness under the intelligence
        conditions described.
    watch_for:
    - id: watch1
      what: Whether improved intelligence and reassessment show that the initial plan can achieve the President's objectives.
      favors:
      - O2
      why: The initial plan's doubtful intelligence basis and assessed inability to achieve the desired results were central
        reasons for revising it.
  lesson: Do not equate a visibly forceful response with an effective one. When a plan's intelligence basis is inadequate
    and it is assessed as unlikely to achieve its purpose, compare alternatives for strategic effectiveness and risk rather
    than retaining the plan for the sake of appearances.
  limits: This reasoning addresses the strategic choice between the two options in this scenario, not how any operation should
    be executed. It does not establish that support to opposition forces is generally preferable or that the revised approach
    would necessarily succeed.
