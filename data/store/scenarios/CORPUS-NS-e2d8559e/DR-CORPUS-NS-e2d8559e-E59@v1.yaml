basis: The Joint Chiefs of Staff policy described in the doctrine permits temporary shipboard holding pending transfer ashore;
  the doctrine's OIF example describes POWs temporarily held aboard the USS Dubuque while camps were not ready and Kuwait
  would not permit camps or POWs there.
