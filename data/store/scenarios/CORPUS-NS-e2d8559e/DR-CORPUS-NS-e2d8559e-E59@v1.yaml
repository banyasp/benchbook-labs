case:
  id: DR-CORPUS-NS-e2d8559e-E59@v1
  title: Temporary POW Detention Aboard a Naval Vessel
  status: draft
  setting: Persian Gulf, during Operation Iraqi Freedom, aboard a U.S. naval vessel
  decider: The Detaining Power
  agent: The Detaining Power
  agent_role: decide
  situation: During Operation Iraqi Freedom, the decision concerned POW detention in the Persian Gulf aboard a U.S. naval
    vessel. Land camps in Iraq were not yet ready, and Kuwait would not allow Coalition forces to establish camps there or
    bring POWs into Kuwait. The general rule required POWs to be interned on land in premises affording hygiene and healthfulness.
    The framework allowed temporary shipboard detention when operational or humanitarian needs dictated, pending a reasonable
    opportunity to transfer POWs ashore. Shipboard detention was also consistent with the land-internment rule if the ship
    provided the most appropriate living conditions for the POWs.
  question: What should the Detaining Power do about temporary detention of the POWs aboard the naval vessel?
  options:
    O1:
      do: The Detaining Power prohibits temporary detention of the POWs aboard the naval vessel and transfers them to a land
        facility.
      move: act
      irreversible: false
    O2:
      do: The Detaining Power permits temporary detention of the POWs aboard the naval vessel pending transfer to a shore
        facility.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The detention setting was a U.S. naval vessel in the Persian Gulf during Operation Iraqi Freedom.
  - id: F2
    kind: situation
    status: confirmed
    fact: POW internment camps in Iraq were not yet ready.
  - id: F3
    kind: situation
    status: confirmed
    fact: Kuwait would not allow Coalition forces to build POW camps there or bring POWs into Kuwait.
  - id: F4
    kind: authority
    status: confirmed
    fact: POWs may be interned only in premises located on land and affording guarantees of hygiene and healthfulness.
  - id: F5
    kind: authority
    status: confirmed
    fact: Temporary shipboard detention is permitted when operational or humanitarian needs dictate, pending a reasonable
      opportunity to transfer POWs to a shore facility or another vessel for evacuation ashore.
  - id: F6
    kind: authority
    status: confirmed
    fact: Limited temporary shipboard detention does not violate the land-internment requirement.
  - id: F7
    kind: authority
    status: confirmed
    fact: Shipboard detention is consistent with the land-internment rule if the ship provides the most appropriate living
      conditions for the POWs.
  considerations:
  - id: C1
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The general rule requires POW internment on land in premises affording hygiene and healthfulness; shipboard detention
      is not a substitute for ordinary land internment.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The rule permits limited shipboard detention when operational or humanitarian needs dictate, pending a reasonable
      opportunity to transfer ashore, and says this limited detention does not violate the land-internment requirement.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: 'The OIF example addresses the same practical obstacle: camps in Iraq were not ready and Kuwait would not allow camps
      or POWs there, supporting temporary detention aboard the vessel rather than requiring an unavailable shore placement.'
  - id: C4
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The shipboard exception is consistent with the land rule when the ship provides the most appropriate living conditions
      for the POWs; the actual adequacy of conditions remains a necessary consideration.
  reasoning:
    read: This is a temporary detention decision under exceptional constraints, not a decision to replace land internment
      with permanent shipboard confinement. The trap is treating the land-internment rule as absolute despite the express
      temporary exception, or treating that exception as permission to keep POWs aboard indefinitely.
    weighing: The land rule protects POWs' health and safety, but the doctrine permits temporary shipboard detention for operational
      or humanitarian needs while a reasonable opportunity for shore transfer is pending. The unready camps and Kuwait's refusal
      match the stated OIF example. O2 is supported so long as detention is genuinely temporary and the ship provides appropriate
      living conditions; the balance changes when a reasonable opportunity to transfer to suitable land premises arises.
    tradecraft: Keep any shipboard detention temporary, assess whether conditions are appropriate for the POWs' health and
      safety, and identify when a suitable shore transfer becomes reasonably available. Record the basis for the temporary
      decision and its continuation, without treating it as ordinary land internment.
    uncertainty: The authority and the OIF example support temporary detention, but the fixed facts do not establish the ship's
      actual living conditions or when a suitable shore facility would become available.
    handoff: The Detaining Power may decide under the stated framework; coordinating with those responsible for shore facilities
      would help establish when a reasonable transfer opportunity exists. The source does not identify a separate approval
      authority.
    tempting_wrong:
      option: O1
      pull: The general rule says POWs may be interned only on land.
      why_wrong: 'That rule is not absolute: the doctrine expressly permits limited temporary shipboard detention when operational
        or humanitarian needs warrant it, and its OIF example addresses the same lack of available land camps.'
    rejected:
      O1: It was not chosen because suitable land detention was not available in the described circumstances, while the doctrine
        permits temporary shipboard detention pending a reasonable opportunity to transfer ashore.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A suitable shore facility becomes available and there is a reasonable opportunity to transfer the POWs there.
      then: O1
      why: Shipboard detention is permitted pending a reasonable opportunity for transfer; once that opportunity exists, the
        temporary exception no longer supports continued detention aboard.
    - id: flip2
      if: The ship does not provide the most appropriate living conditions and suitable land premises are available.
      then: O1
      why: The doctrine treats shipboard detention as consistent with the land rule on the condition that the ship provides
        the most appropriate living conditions.
    would_not_change:
    - id: noflip1
      if: Land camps remain unavailable and Kuwait continues to refuse camps or entry, while shipboard detention remains temporary.
      why: Those constraints are the circumstances of the doctrine's OIF example supporting temporary shipboard detention;
        they do not by themselves require an unavailable land transfer.
    watch_for:
    - id: watch1
      what: Whether a suitable shore facility becomes available and a reasonable opportunity to transfer arises.
      favors:
      - O1
      why: The authority allows shipboard detention only pending a reasonable opportunity to transfer ashore.
  lesson: The land-internment rule protects POWs' health and safety, but it allows temporary shipboard detention when operational
    or humanitarian needs require it and suitable shore placement is not yet available. Keep the exception limited, ensure
    living conditions are appropriate, and transfer ashore when a reasonable opportunity arises.
  limits: This reasoning supports temporary detention in the described circumstances, not indefinite shipboard internment
    or detention aboard a vessel that fails to provide appropriate living conditions. It does not determine the legality of
    any separate detention procedures.
