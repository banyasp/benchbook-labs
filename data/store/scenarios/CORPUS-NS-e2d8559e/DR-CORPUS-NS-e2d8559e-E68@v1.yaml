case:
  id: DR-CORPUS-NS-e2d8559e-E68@v1
  title: Determining Whether Active Hostilities Have Ceased
  status: draft
  setting: After the cessation of active hostilities; the Detaining Power's POW release and repatriation process under the
    GPW.
  decider: The Detaining Power
  agent: The Detaining Power
  agent_role: decide
  situation: The Detaining Power must decide whether active hostilities have ceased for purposes of releasing and repatriating
    POWs. The relevant distinction is between a suspension that leaves open the prospect of renewed fighting and a complete
    end with no near-term likelihood of resumption. A formal peace agreement is not necessarily required. Safe and orderly
    arrangements may still be needed for repatriation.
  question: What should the Detaining Power do in deciding whether active hostilities have ceased for purposes of releasing
    and repatriating the POWs?
  options:
    O1:
      do: The Detaining Power shall withhold release and continue detaining the POWs.
      move: act
      irreversible: false
    O2:
      do: The Detaining Power shall ask the opposing party to confirm cessation.
      move: ask
      irreversible: false
      to: the opposing party
    O3:
      do: The Detaining Power shall release and repatriate the POWs without delay.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: assessed
    fact: A suspension of hostilities that leaves open the possibility of renewed fighting may not constitute cessation of
      active hostilities under Article 118.
  - id: F2
    kind: authority
    status: assessed
    fact: Cessation of active hostilities may be understood as a complete end to fighting with no clear probability of resumption
      in the near future.
  - id: F3
    kind: authority
    status: confirmed
    fact: Cessation may result from capitulation or agreement, but an agreement is not required if there is no prospect that
      hostilities will resume.
  - id: F4
    kind: authority
    status: confirmed
    fact: The GPW requires POWs to be released and repatriated without delay after the cessation of active hostilities.
  - id: F5
    kind: authority
    status: confirmed
    fact: If there is no relevant agreement, each Detaining Power must establish and execute a plan of repatriation without
      delay.
  - id: F6
    kind: situation
    status: confirmed
    fact: The parties' conduct concerning repatriation should be reasonable and broadly commensurate, though it need not be
      precisely equivalent.
  - id: F7
    kind: situation
    status: confirmed
    fact: Release without delay does not preclude practical arrangements needed for safe and orderly repatriation.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O1
    - O3
    weight: strong
    why: The threshold turns on whether fighting has completely ended with no near-term likelihood of resumption. A lull that
      leaves renewed fighting possible is not enough; if the complete-end threshold is met, Article 118's release duty is
      triggered.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: After cessation, POWs must be released and repatriated without delay. A formal agreement is not required, and absent
      a relevant agreement the Detaining Power must establish and execute its own repatriation plan.
  - id: C3
    facts:
    - F6
    equity: norm_reciprocity
    favors:
    - O2
    weight: weak
    why: The parties' conduct should be reasonable and broadly commensurate, and it may be unreasonable to expect a State
      to release all its POWs without assurance that its own personnel will also be released. This supports coordination,
      but does not require precisely equivalent conduct.
  - id: C4
    facts:
    - F4
    - F7
    equity: tempo
    favors:
    - O3
    weight: strong
    why: The requirement to act without delay allows the practical arrangements needed for safe and orderly repatriation;
      those arrangements do not displace the release duty once cessation has occurred.
  reasoning:
    read: The decisive question is whether the fighting has ended in the relevant sense, not whether a formal peace treaty
      has been signed. A temporary suspension that leaves a real prospect of renewed fighting differs from a complete end
      with no near-term likelihood of resumption. On finding that complete end, the Detaining Power should release and repatriate
      the POWs without delay.
    weighing: 'The cessation threshold matters first: if renewed fighting remains a prospect, Article 118''s post-cessation
      duty has not yet been triggered {C1}. If the threshold is met, the Convention requires prompt release, and neither a
      formal peace agreement nor an agreement specifically addressing repatriation is indispensable {C2}. Reciprocal conduct
      and assurance may inform reasonable coordination, but need not be precisely equivalent and do not justify abandoning
      the process {C3}. Safe and orderly arrangements remain compatible with acting without delay {C4}. The balance therefore
      supports {O3} once cessation in the relevant sense is found.'
    tradecraft: Record the factual basis for finding either a complete end or a continuing prospect of renewed fighting, and
      identify any relevant cessation or repatriation agreement. Do not treat the absence of a formal peace agreement, or
      the need for safe and orderly arrangements, as an independent reason to postpone release after the threshold is met.
    uncertainty: The source gives an interpretive standard, not a mechanical test for assessing the likelihood of renewed
      hostilities. The outcome depends on the circumstances bearing on whether resumption is out of the question in the near
      future; the stated facts do not supply a separate factual finding on that question.
    handoff: The Detaining Power remains responsible for its decision and its repatriation plan. It may coordinate in good
      faith with the opposing party and the ICRC to resolve impediments, but need not obtain the opposing party's confirmation
      as a precondition to applying Article 118.
    tempting_wrong:
      option: O2
      pull: Seeking the opposing party's confirmation may seem prudent when the likelihood of renewed fighting or reciprocal
        releases is uncertain.
      why_wrong: 'Confirmation is not a legal prerequisite to cessation: an agreement may establish cessation, but cessation
        may also occur without an agreement when there is no prospect of renewed hostilities. Coordination should not become
        a reason to defer the required release.'
    rejected:
      O1: Once the complete-end threshold is met, continuing detention conflicts with the requirement to release and repatriate
        POWs without delay.
      O2: The Detaining Power may coordinate with the opposing party, but asking it to confirm cessation is not a required
        condition for release and cannot replace the Detaining Power's own decision.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The circumstances show only a suspension that leaves open a prospect of renewed fighting.
      then: O1
      why: On that condition, active hostilities have not ceased in the relevant sense, so the post-cessation release duty
        is not yet triggered.
    would_not_change:
    - id: noflip1
      if: No formal peace agreement has been concluded, but there is no prospect that hostilities will resume.
      why: Cessation may occur without an agreement, and the absence of a formal peace agreement does not prevent the release
        duty from applying.
    - id: noflip2
      if: The parties' conduct is not precisely equivalent.
      why: The appropriate standard is reasonable and broadly commensurate conduct, not precise equivalence, and both parties
        must continue striving for prompt repatriation.
    watch_for:
    - id: watch1
      what: Whether the other party's conduct provides reasonable assurance and is broadly commensurate during repatriation.
      favors:
      - O2
      why: That conduct may bear on reasonable coordination and assurance, while not requiring exact equivalence or permitting
        either party to abandon the process.
  lesson: Distinguish a temporary suspension that leaves renewed fighting possible from a complete end with no near-term likelihood
    of resumption. Once cessation is found, release and repatriation must proceed without delay; agreement and safe, orderly
    arrangements do not create a general license to defer that duty.
  limits: This reasoning addresses the Article 118 cessation threshold and the duty to repatriate POWs after that threshold
    is met. It does not determine the outcome where the evidence about the prospect of renewed hostilities is materially different,
    or resolve separate questions beyond release and repatriation.
