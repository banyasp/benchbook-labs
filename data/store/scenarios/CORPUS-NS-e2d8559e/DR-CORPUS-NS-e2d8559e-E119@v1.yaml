case:
  id: DR-CORPUS-NS-e2d8559e-E119@v1
  title: Cyber-Capability Weapons Acquisition Review
  status: draft
  setting: United States Department of Defense weapons acquisition legal review; the source specifies no time.
  decider: The acquisition authority, informed by the required legal review.
  agent: The acquisition legal reviewer
  agent_role: advise
  situation: A weapon employing cyber capabilities is under acquisition review. Department of Defense policy requires legal
    review of weapons and weapon systems, while not every cyber capability qualifies as a weapon or weapons system. The reviewer
    must assess the characteristics of the weapon and whether it is per se prohibited by the law of war. The capability is
    assessed as potentially having effects that cannot be controlled in interconnected civilian systems. Novelty alone does
    not make a weapon unlawful.
  question: What should the acquisition legal reviewer advise the acquisition authority about permitting or prohibiting acquisition
    of the weapon?
  options:
    O1:
      do: The legal reviewer advises the acquisition authority to permit acquisition of the cyber-capability weapon.
      move: act
      irreversible: false
    O2:
      do: The legal reviewer advises the acquisition authority to prohibit acquisition of the cyber-capability weapon.
      move: act
      irreversible: false
    O3:
      do: The legal reviewer requests further capability information from the acquisition authority before advising on acquisition.
      move: ask
      irreversible: false
      to: the acquisition authority
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Department of Defense policy requires legal review of the acquisition of weapons or weapon systems.
  - id: F2
    kind: situation
    status: confirmed
    fact: Not all cyber capabilities constitute a weapon or weapons system.
  - id: F3
    kind: authority
    status: confirmed
    fact: Military Department regulations address which cyber capabilities require legal review.
  - id: F4
    kind: authority
    status: confirmed
    fact: The law of war does not prohibit a novel cyber weapon merely because it is novel or uses new technology.
  - id: F5
    kind: authority
    status: confirmed
    fact: The issues assessed in a legal review depend on the weapon's characteristics, and the review likely assesses whether
      it is inherently indiscriminate.
  - id: F6
    kind: authority
    status: confirmed
    fact: Weapons that cannot be directed at a specific military objective or whose effects cannot be controlled are inherently
      indiscriminate and per se unlawful under the law of armed conflict.
  - id: F7
    kind: capability
    status: assessed
    fact: Certain cyber tools could have effects that cannot be predicted or controlled in interconnected networks, and a
      destructive capability spreading uncontrollably within civilian internet systems might fall into that category.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: Legal review is required for weapons and weapon systems, but not every cyber capability qualifies; the Military Department
      regulations identify which capabilities require review. If that status is unresolved, it can warrant clarifying the
      review's applicability.
  - id: C2
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Novelty or use of new technology alone does not make a weapon unlawful, so novelty cannot independently justify prohibiting
      acquisition.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The legal review should assess the weapon's characteristics, including whether it is inherently indiscriminate; that
      is the relevant legality question here, not whether the capability is new.
  - id: C4
    facts:
    - F6
    - F7
    equity: third_party_harm
    favors:
    - O2
    weight: strong
    why: Weapons whose effects cannot be controlled are inherently indiscriminate and per se unlawful. The assessed possibility
      of uncontrolled effects in interconnected civilian systems makes that prohibition directly relevant to this acquisition
      review.
  reasoning:
    read: The issue is whether the weapon's characteristics make it inherently indiscriminate, not whether cyber technology
      is novel. The trap is treating novelty as a prohibition—or treating the possibility of uncontrolled effects in civilian
      systems as irrelevant merely because the capability is cyber-based.
    weighing: The manual says novelty alone does not make a weapon unlawful {C2}, but it directs reviewers to assess whether
      a weapon is inherently indiscriminate {C3}. A weapon whose effects cannot be controlled is per se unlawful, and the
      assessed possibility of such effects in interconnected civilian systems supports advising against acquisition {C4}.
      The recommendation depends on whether the review confirms that the weapon falls within that inherently indiscriminate
      category; the fixed assessment makes prohibition the appropriate advice on these facts.
    tradecraft: Record the legal-review determination and the characteristics that support it, distinguish the per se legality
      analysis from novelty, and give the acquisition authority a clear recommendation tied to the stated legal standard.
    uncertainty: The facts describe potentially uncontrolled effects, not a conclusive finding that the effects cannot be
      controlled. The legal consequence is clear if the weapon meets that standard; the review's assessment of the capability's
      characteristics is therefore important.
    handoff: The legal reviewer should advise the acquisition authority, which is the decider under the fixed scenario. The
      reviewer should also account for the applicable Military Department regulations when determining whether the capability
      is subject to weapons legal review.
    tempting_wrong:
      option: O1
      pull: Novel cyber capabilities are not unlawful merely because they are novel, which can make acquisition seem permissible.
      why_wrong: That point does not resolve whether this weapon is inherently indiscriminate; uncontrolled effects are a
        separate basis for per se unlawfulness.
    rejected:
      O1: Permit is not recommended because the assessed possibility of uncontrolled effects in civilian systems implicates
        the manual's inherently indiscriminate weapons prohibition.
      O3: Further information could clarify the capability's characteristics, but the facts already identify the relevant
        uncontrolled-effects concern and support advising prohibition.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The legal review establishes that the weapon's effects can be controlled and directed at a specific military objective,
        with no other per se prohibition identified.
      then: O1
      why: The stated basis for prohibition would no longer apply, although the weapon would still require review for any
        other relevant legal issues.
    would_not_change:
    - id: noflip1
      if: The weapon is novel or employs new technology.
      why: Novelty alone does not make a weapon illegal under the law of war.
    watch_for:
    - id: watch1
      what: Whether the applicable Military Department regulations require legal review of this cyber capability as a weapon
        or weapon system.
      favors:
      - O3
      why: Not every cyber capability constitutes a weapon or weapon system, and the regulations address which capabilities
        require review.
  lesson: Novelty alone does not make a weapon unlawful. Acquisition review should assess the weapon's characteristics, and
    if its effects cannot be controlled or directed at a specific military objective, it is inherently indiscriminate and
    per se unlawful.
  limits: This reasoning addresses acquisition legal review and the stated inherent-indiscrimination standard only. It does
    not decide whether every cyber capability is a weapon or weapon system, or whether a particular operation using a capability
    would comply with the law of war.
