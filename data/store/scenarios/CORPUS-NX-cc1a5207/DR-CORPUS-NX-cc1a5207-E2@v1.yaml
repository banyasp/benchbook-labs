case:
  id: DR-CORPUS-NX-cc1a5207-E2@v1
  title: Responding to Evidence of South Korea’s Nuclear Intent
  status: draft
  setting: United States, late 1970s, White House and executive branch.
  decider: The White House
  agent: The White House
  agent_role: decide
  situation: In the late 1970s, evidence emerged that South Korea intended to develop its own nuclear weapons. The evidence
    arose in the setting of a US nonproliferation law that had recently taken effect. The law followed Congress’s discovery
    that US heavy water had been used by India to make its first bomb in 1974, despite the State Department’s denial. That
    episode embarrassed the State Department, and the law passed over its objections. The executive branch did not want to
    be caught flat-footed again.
  question: What should the White House do about evidence that South Korea intends to develop its own nuclear weapons?
  options:
    O1:
      do: The White House requests further intelligence on South Korea’s nuclear-weapons intentions.
      move: ask
      irreversible: false
      to: the intelligence community
    O2:
      do: The White House permits South Korea to continue its nuclear-weapons project.
      move: act
      irreversible: false
    O3:
      do: The White House pressures South Korea to abandon its nuclear-weapons project.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: US heavy water had been used by India to make its first bomb in 1974.
  - id: F2
    kind: situation
    status: confirmed
    fact: Congress discovered the use of US heavy water despite the State Department’s denial.
  - id: F3
    kind: situation
    status: confirmed
    fact: The discovery embarrassed the State Department.
  - id: F4
    kind: authority
    status: confirmed
    fact: The discovery led to passage of the Nuclear Nonproliferation Act of 1978 over the State Department’s objections.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Nuclear Nonproliferation Act was in force when the South Korea evidence emerged.
  - id: F6
    kind: situation
    status: confirmed
    fact: The executive branch did not want to be caught flat-footed again.
  - id: F7
    kind: intelligence
    status: assessed
    fact: In the late 1970s, evidence emerged of South Korea’s intent to develop its own nuclear weapons.
  considerations:
  - id: C1
    facts:
    - F7
    equity: security_risk
    favors:
    - O3
    weight: strong
    why: Evidence of South Korea’s intent to develop nuclear weapons presented a nonproliferation concern that the White House
      acted on.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    - F4
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The India episode had exposed the State Department’s denial and led to legislation over its objections; the executive
      branch did not want to be caught flat-footed again.
  - id: C3
    facts:
    - F5
    - F7
    equity: tempo
    favors:
    - O3
    weight: weak
    why: The evidence emerged while the new nonproliferation law was in force, and the White House’s recorded response was
      prompt rather than waiting for further indications.
  reasoning:
    read: This was a policy choice about how to respond to evidence of South Korea’s nuclear-weapons intent, in a setting
      shaped by the recent law and the executive branch’s experience of being caught flat-footed over India. The trap was
      to treat the earlier denial and exposure as irrelevant, or to let a desire for more intelligence become a reason not
      to act on the evidence already available.
    weighing: The proliferation concern and the recent institutional failure favor a prompt response {C1} {C2}. The law’s
      presence and the White House’s recorded promptness support acting without delay, but the source does not say the law
      itself required pressure on South Korea {C3}. On the source’s stated balance, the White House acted on the evidence
      and pressed South Korea to abandon the project; that balance depends on the evidence being sufficiently persuasive and
      on the surrounding political context.
    tradecraft: At the decision level, make the policy judgment explicit, preserve the evidence and rationale supporting it,
      and keep intelligence and policy officials engaged in the decision. Do not present the recent law as a specific legal
      command to pressure South Korea.
    uncertainty: More and better intelligence is always desirable, while political context affects whether policymakers use
      intelligence. The available account does not specify the evidence’s reliability in detail or identify a statutory standard
      governing this particular response.
    handoff: The White House remains the decision-maker. Intelligence and policy officials should collaborate so the policy
      judgment reflects the available assessment and the relevant political context.
    tempting_wrong:
      option: O1
      pull: Requesting more intelligence can seem prudent when the decision concerns another state’s nuclear intentions.
      why_wrong: The source distinguishes a general desire for more intelligence from the central problem of whether policymakers
        use the intelligence they already have; here, the White House acted on the first indications.
    rejected:
      O1: The White House did not defer action for further intelligence; it acted promptly on the evidence that had emerged.
      O2: Permitting the project to continue would not match the White House’s recorded response to the evidence or its aim
        not to be caught flat-footed again.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The evidence were found too uncertain to support the assessment that South Korea intended to develop nuclear weapons.
      then: O1
      why: Further intelligence would then be a reasoned response to unresolved uncertainty rather than a delay in acting
        on persuasive evidence.
    would_not_change:
    - id: noflip1
      if: The White House also wanted additional intelligence while the evidence remained persuasive and the nonproliferation
        context remained the same.
      why: A general preference for more intelligence would not by itself displace the source’s emphasis on acting on the
        evidence already available.
    watch_for:
    - id: watch1
      what: Whether the political context changes how timely or convincing policymakers consider the evidence.
      favors:
      - O1
      why: The source identifies wider political context as important and notes that intelligence has sometimes been treated
        as untimely or unconvincing.
  lesson: When credible proliferation evidence emerges after a consequential failure of oversight or policy, do not let a
    general wish for more intelligence substitute for deciding whether to act on the evidence at hand. Weigh the evidence
    in its political and legislative context, while distinguishing that context from a legal requirement not established in
    the record.
  limits: This reasoning applies to the stated South Korea decision and its particular post-India context; it does not establish
    a general statutory duty to pressure states to abandon nuclear projects. A materially different evidentiary or political
    context could change how policymakers should respond.
