case:
  id: DR-XFER-CORPUS-NX-b6a7d193-E2-A@v1
  title: Threat Sharing for an International Sporting Event
  status: draft
  setting: In the months before the Harbor International Games, a fictional international sporting event, a federal coordinating
    cell is planning with ten partner security services. The Department of National Security manages a multinational releasable
    network for interoperability.
  decider: The federal coordinating cell
  agent: The federal coordinating cell
  agent_role: decide
  situation: In the months leading up to the Harbor International Games, the partners used a commercial collaboration tool
    for planning. Every partner could reach it, and it worked well for that purpose. Event security operations, as designed,
    were to run on a multinational releasable network. U.S. law-enforcement systems were closed to all but a few closely vetted
    foreign liaison officers. Partner accounts on the multinational network depended on sharing agreements and the ability
    to validate user credentials. Most partner services did not maintain a terminal for that network.
  question: What should the federal coordinating cell do about selecting a network for event security operations?
  options:
    O1:
      do: The coordinating cell rejects the multinational releasable network and approves the commercial collaboration tool
        for event security operations.
      move: act
      irreversible: false
    O2:
      do: The coordinating cell approves the multinational releasable network for event security operations.
      move: act
      irreversible: false
    O3:
      do: The coordinating cell asks partner security services to confirm eligibility before network selection.
      move: ask
      irreversible: false
      to: partner security services
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Planning and collaboration for the Harbor International Games took place on a commercial collaboration tool.
  - id: F2
    kind: capability
    status: confirmed
    fact: The commercial collaboration tool was accessible to all ten partner security services.
  - id: F3
    kind: capability
    status: confirmed
    fact: The commercial collaboration tool worked well for planning and collaboration.
  - id: F4
    kind: situation
    status: confirmed
    fact: Event security operations were designed to run on a multinational releasable network.
  - id: F5
    kind: authority
    status: confirmed
    fact: U.S. law-enforcement systems were closed to all but a few closely vetted foreign liaison officers.
  - id: F6
    kind: capability
    status: confirmed
    fact: The Department of National Security managed the multinational releasable network for interoperability.
  - id: F7
    kind: situation
    status: confirmed
    fact: Partner accounts on the multinational releasable network could be established where sharing agreements existed and
      user credentials could be validated.
  - id: F8
    kind: capability
    status: confirmed
    fact: Most partner security services did not maintain a terminal for the multinational releasable network.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Event security operations were designed to use a multinational releasable network, which the department managed for
      interoperability.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: U.S. law-enforcement systems were restricted to a few vetted foreign liaison officers, making them unsuitable for
      broad partner participation; the department-managed multinational network was the identified alternative.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The commercial tool was accessible and effective for planning, but those strengths did not make it the network intended
      for event security operations.
  - id: C4
    facts:
    - F7
    - F8
    equity: partner_relationship
    favors:
    - O3
    weight: weak
    why: Partner accounts depended on sharing agreements and credential validation, while most services lacked a terminal;
      these conditions create an access concern but do not negate the multinational network's role.
  reasoning:
    read: 'This is a choice of network for event security operations, not a judgment that the commercial tool failed: it served
      planning and collaboration well, while operations were designed to run on a multinational releasable network. The trap
      is to treat the commercial tool''s planning success as sufficient reason to use it for operations, or to overlook that
      U.S. law-enforcement systems were restricted.'
    weighing: The operational design and restrictions on U.S. law-enforcement systems support selecting the multinational
      releasable network {C1} {C2}. The commercial tool's effectiveness is relevant to planning, but not decisive for the
      operational network {C3}. The balance depends on whether partner accounts can be established under the stated agreement
      and credential-validation conditions; limited terminal availability is an access concern, not a reason given for abandoning
      the network {C4}.
    tradecraft: Record why event security operations require a multinational releasable network and why it was selected. Before
      relying on partner accounts, confirm that the applicable sharing agreements exist and that user credentials can be validated;
      do not treat planning access on the commercial tool as proof of operational-network eligibility.
    uncertainty: The stated facts do not identify which partner services meet the account conditions or how many can participate
      through the multinational network. They also do not specify whether partners without a terminal can obtain access by
      other means.
    handoff: The coordinating cell can select the network, but should coordinate with partner representatives and the authorities
      responsible for sharing agreements and credential validation, because those conditions determine which partner accounts
      can be established.
    tempting_wrong:
      option: O1
      pull: The commercial tool was accessible to every partner and worked well for planning and collaboration.
      why_wrong: Those advantages address planning and collaboration, whereas event security operations were designed to run
        on a multinational releasable network.
    rejected:
      O3: The source chose the multinational network rather than deferring network selection, while treating agreements and
        credential validation as conditions for establishing partner accounts.
      O1: The commercial tool's success for planning did not make it the network intended for event security operations.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Sharing agreements or credential validation are unavailable for enough partner services to make the selected network
        unworkable for event security operations.
      then: O3
      why: The stated conditions are prerequisites for establishing partner accounts; if they cannot be met at sufficient
        scale, the coordinating cell should defer selection to resolve partner eligibility.
    - id: flip2
      if: The event security design no longer requires operations on a multinational releasable network.
      then: O1
      why: Without that design requirement, the commercial tool's stated accessibility and effectiveness for planning could
        support reconsidering it for event security operations.
    would_not_change:
    - id: noflip1
      if: The commercial tool remains accessible and works well for planning and collaboration.
      why: Those facts alone do not change the separate requirement that event security operations, as designed, run on a
        multinational releasable network.
    watch_for:
    - id: watch1
      what: Whether partner services have a terminal for the multinational network and can meet the stated account conditions.
      favors:
      - O1
      why: Limited partner readiness could make it prudent to confirm eligibility before relying on the selected network.
  lesson: Choose the network that fits the operational design and access restrictions, rather than assuming a successful planning
    platform is suitable for event security operations. Treat partner agreements and credential validation as conditions to
    verify, and account for partner access limitations without confusing them with the network's purpose.
  limits: This reasoning applies to the stated Harbor International Games network choice and its operational design. It does
    not establish that the multinational releasable network is suitable for other events, that every partner qualifies for
    an account, or that the commercial tool is inappropriate for planning.
