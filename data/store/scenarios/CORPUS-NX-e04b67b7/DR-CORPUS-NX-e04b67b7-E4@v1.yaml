case:
  id: DR-CORPUS-NX-e04b67b7-E4@v1
  title: Diplomatic Service and Intelligence Duties
  status: draft
  setting: Belgium and Britain, during the period of Confederate activity; U.S. diplomatic service.
  decider: The U.S. administration
  agent: The U.S. administration
  agent_role: decide
  situation: The U.S. minister to Belgium was carrying out intelligence duties concerning Confederate activity in Britain.
    The administration regarded his services as active and useful for detecting traitorous proceedings. It also feared his
    approach could cause another U.S.-British crisis. The administration could determine whether those duties remained with
    the minister or were reassigned while he continued in diplomatic service.
  question: What should the U.S. administration do about the minister's intelligence duties?
  options:
    O1:
      do: The administration retains the minister's intelligence duties with him and continues his diplomatic service.
      move: act
      irreversible: false
    O2:
      do: The administration removes the minister's intelligence duties, reassigns them to the consul, and returns him to
        diplomatic service.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The official was serving as the U.S. minister to Belgium.
  - id: F2
    kind: situation
    status: confirmed
    fact: The minister was performing intelligence duties.
  - id: F3
    kind: situation
    status: confirmed
    fact: The administration described the minister's services as active.
  - id: F4
    kind: situation
    status: confirmed
    fact: The administration credited the minister's services with detecting traitorous proceedings.
  - id: F5
    kind: situation
    status: assessed
    fact: The administration feared the minister's approach could produce another U.S.-British crisis.
  - id: F6
    kind: authority
    status: confirmed
    fact: The administration had authority to assign the minister's duties and direct him to serve as a minister.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The administration recognized that the minister's intelligence services were active and useful in detecting traitorous
      proceedings, which weighed in favor of continuing his duties.
  - id: C2
    facts:
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The administration feared that the minister's approach could produce another U.S.-British crisis, so the diplomatic
      risk outweighed the value of leaving those duties with him.
  - id: C3
    facts:
    - F1
    - F2
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Reassigning the intelligence duties while returning the official to his ministerial role allowed the administration
      to separate those responsibilities rather than end his diplomatic service.
  reasoning:
    read: 'This is an administrative choice about who should hold intelligence duties, not whether the services had value:
      the administration praised their usefulness but feared the minister''s approach could provoke a diplomatic crisis. The
      trap is allowing that usefulness to obscure the distinct risk to U.S.-British relations.'
    weighing: The credited intelligence value favored retaining the duties with the minister, but the administration gave
      greater weight to the feared risk of another crisis. It chose to remove the duties, reassign them to the consul, and
      return the minister to his diplomatic role. The balance depends chiefly on the administration's assessment that the
      minister's approach risked a crisis, despite the value it acknowledged in his services.
    tradecraft: Record the acknowledged value of the services alongside the diplomatic risk that drove the decision. Make
      the reassignment and the minister's continuing diplomatic role clear in the direction implementing the decision.
    uncertainty: The stated concern is a fear that the approach could cause a crisis; the available facts give no further
      detail about the likelihood or severity of that outcome.
    handoff: The administration should make the assignment decision and direct the consul to assume the duties, consistent
      with its authority to assign duties.
    tempting_wrong:
      option: O1
      pull: The administration had praised the minister's active and useful services in detecting traitorous proceedings.
      why_wrong: That value did not resolve the administration's separate concern that his approach could produce another
        U.S.-British crisis.
    rejected:
      O1: The administration did not retain the intelligence duties with the minister because it feared his approach could
        produce another U.S.-British crisis.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The administration no longer assessed that the minister's approach could produce another U.S.-British crisis.
      then: O1
      why: Without the stated diplomatic-risk concern, the acknowledged usefulness of the minister's services could support
        retaining his duties.
    would_not_change:
    - id: noflip1
      if: The minister's services remained active and useful while the administration continued to fear a crisis.
      why: The minister's usefulness alone did not outweigh the administration's concern about the diplomatic risk.
    watch_for:
    - id: watch1
      what: Whether the administration continues to assess that the minister's approach could cause another U.S.-British crisis.
      favors:
      - O2
      why: That concern was the stated reason for removing the duties from the minister.
  lesson: Recognize operational value without treating it as decisive when the same arrangement creates a serious diplomatic
    risk. Where the administration has authority to separate responsibilities, reassignment can preserve the mission while
    reducing that risk.
  limits: This reasoning addresses an administrative decision based on a stated fear of diplomatic crisis and an acknowledged
    useful service. It does not establish a general rule about intelligence activity, its legality, or the merits of particular
    collection methods.
  library:
    domain: intel-oversight
    family: CORPUS-NX-e04b67b7
    source: https://www.cia.gov/static/44d5b357dc66ed40f2fbbd53f3bc7a29/Intelligence-in-the-Civil-War.pdf
    episode_focus: The decision was whether to rein in the minister’s intelligence activity or let it continue. The administration
      feared his approach could cause another U.S.-British crisis; exclude the underlying surveillance and agent methods.
