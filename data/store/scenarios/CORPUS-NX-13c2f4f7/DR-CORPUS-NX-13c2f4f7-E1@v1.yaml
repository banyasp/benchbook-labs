case:
  id: DR-CORPUS-NX-13c2f4f7-E1@v1
  title: Choosing Whether to Employ a Force
  status: draft
  setting: Japan, two years before February 6, 1562, military command
  decider: The general
  agent: The Commander
  agent_role: decide
  situation: In Japan, a military general faced a decision about attacking a castle. The castle was described as impregnable.
    A force of 280 Ninja associated with Koga was under consideration for the attack. The choice was whether to employ the
    force, decline its use, or defer the attack for further assessment.
  question: What should the Commander do about employing the force in the attack on the castle?
  options:
    O1:
      do: The Commander postpones the castle attack pending further assessment.
      move: hold
      irreversible: false
    O2:
      do: The Commander authorizes the force to participate in the castle attack.
      move: act
      irreversible: true
    O3:
      do: The Commander declines to employ the force in the castle attack.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision maker held the role of general.
  - id: F2
    kind: situation
    status: confirmed
    fact: The military objective was to attack a castle.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The castle was described as impregnable.
  - id: F4
    kind: capability
    status: confirmed
    fact: The force under consideration comprised 280 Ninja.
  - id: F5
    kind: situation
    status: confirmed
    fact: The force was identified as Koga Ninja.
  - id: F6
    kind: situation
    status: confirmed
    fact: The relevant service occurred two years before February 6, 1562.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The account frames the castle’s description as impregnable as the obstacle prompting the general to use the force;
      it presents employment as a way to pursue the attack objective.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: A 280-person Koga Ninja force was available for consideration. The account presents that force as a concrete means
      of addressing the stated obstacle, without giving further detail about the general’s assessment.
  - id: C3
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The account reports that the force disrupted the defenders and describes the service as later receiving the general’s
      gratitude. This supports the effectiveness of the choice in retrospect, though it is not evidence of the general’s full
      reasoning at the time.
  reasoning:
    read: This is a command decision about whether to use an available force to pursue an attack against a castle described
      as impregnable. The trap is to treat that description as either proof that attack is impossible or, conversely, as proof
      that any means of attack is justified; the account supports neither inference.
    weighing: The account links the castle’s formidable description to the decision to employ the 280 Koga Ninja, then reports
      disruption of the defenders and the general’s later gratitude. That makes O2 the choice the account presents favorably
      for mission effect. The account does not state the general’s full contemporaneous assessment, discuss alternatives in
      detail, or establish legal or civilian-risk considerations.
    tradecraft: Before authorizing, confirm the decision remains within the commander’s authority and that the objective still
      warrants action; record the information and rationale available at the decision point. Do not treat the favorable reported
      result as a substitute for documenting the basis for the original decision.
    uncertainty: The account is brief and retrospective. It does not explain what the general knew about the force’s prospects,
      what delay or refusal would have meant, or whether legal, civilian-harm, or own-force risks were assessed.
    handoff: The source records the general’s choice but does not describe consultation or referral. As a decision-practice
      safeguard, involve the appropriate legal or command authority if the commander’s authority or the permissibility of
      the attack is uncertain.
    tempting_wrong:
      option: O3
      pull: The castle is described as impregnable, which may make declining the force seem prudent.
      why_wrong: The account presents the force’s employment as overcoming the obstacle and reports a successful disruption;
        simply accepting the description as conclusive would miss the source’s favorable account of the choice.
    rejected:
      O1: The account presents the general as having employed the force and reports a favorable result, but gives no indication
        that further assessment or delay was necessary.
      O3: The account’s favorable presentation of the force’s service supports employment rather than declining it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The attack objective had ceased to be necessary or authorized before the force was committed.
      then: O3
      why: The account’s favorable basis for employing the force depends on pursuing the attack objective; without that objective,
        mission effect would not support commitment.
    - id: flip2
      if: The commander lacked authority to authorize the force or had credible information that the proposed action would
        be unlawful.
      then: O1
      why: Authority or legality concerns would warrant holding the decision for resolution rather than relying on the account’s
        favorable outcome.
    would_not_change:
    - id: noflip1
      if: The castle remained described as impregnable, with no new information changing the mission or the force’s availability.
      why: That description is already part of the account’s stated context for employing the force and does not alone defeat
        the source’s favorable presentation of O2.
    watch_for:
    - id: watch1
      what: Whether the commander has lawful authority and whether the attack remains permissible.
      favors:
      - O1
      - O3
      why: The account does not address these matters, but they could constrain or delay the choice independently of the reported
        effectiveness.
  lesson: A formidable obstacle can support considering an available means of achieving the mission, but it does not by itself
    settle whether commitment is justified. Assess authority and relevant risks at the time of decision; a favorable later
    result is not a substitute for that assessment.
  limits: The source is a brief retrospective account, not a legal or operational assessment, and it supplies no basis for
    conclusions about civilian risk, own-force risk, or the authority governing the attack. The reasoning applies only as
    a reading of the source’s favorable presentation of this historical choice.
