case:
  id: DR-CORPUS-NX-5ced0f03-E4@v1
  title: MSIC Support During the DIA Transition
  status: draft
  setting: MSIC-to-DIA transition planning, MSIC and DIA, with a proposed hardware-support transfer date of 1 January 1992.
  decider: The transition authority
  agent: The transition authority
  agent_role: decide
  situation: MSIC is transitioning into DIA. The infrastructure needed for a smooth transition is operational, and MSIC has
    an open-systems infrastructure compliant with national and DODIIS standards. The draft Strategic Plan for Automation provides
    a base for transition planning. MSIC has current external support arrangements with DAMI and AIA. The transition authority
    must address continuity of support and when hardware support responsibility should transfer. The Army's position is that
    DIA should assume hardware support responsibility on 1 January 1992.
  question: What should the transition authority do about continuity of MSIC's external support and the transfer of hardware-support
    responsibility during the transition to DIA?
  options:
    O1:
      do: The transition authority will replace current hardware support arrangements with DIA responsibility on 1 January
        1992.
      move: act
      irreversible: false
    O2:
      do: The transition authority will retain DAMI and AIA support arrangements until DIA can provide those services.
      move: act
      irreversible: false
    O3:
      do: The transition authority will ask DIA to confirm service readiness before setting the hardware-support transfer
        date.
      move: ask
      irreversible: false
      to: DIA
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: The ADP, communications, and network facilities needed for a smooth MSIC transition into DIA are in place and operational.
  - id: F2
    kind: capability
    status: confirmed
    fact: MSIC has a well-structured open-systems infrastructure.
  - id: F3
    kind: capability
    status: confirmed
    fact: MSIC's infrastructure complies with national and DODIIS standards.
  - id: F4
    kind: capability
    status: assessed
    fact: The MSIC draft Strategic Plan for Automation provides an excellent base from which to begin the transition.
  - id: F5
    kind: situation
    status: confirmed
    fact: MSIC has current external support arrangements with DAMI and AIA.
  - id: F6
    kind: situation
    status: assessed
    fact: The stated planning position is that the current operational baseline should not be disturbed.
  - id: F7
    kind: situation
    status: assessed
    fact: The stated planning position is that current external support arrangements should remain until DIA can provide those
      services.
  - id: F8
    kind: situation
    status: assessed
    fact: The Army does not concur with that position and believes DIA should assume hardware support responsibility on 1
      January 1992.
  considerations:
  - id: C1
    facts:
    - F6
    equity: critical_services
    favors:
    - O2
    weight: strong
    why: The stated planning position is to avoid disturbing the current operational baseline during the transition.
  - id: C2
    facts:
    - F5
    - F7
    equity: critical_services
    favors:
    - O2
    weight: strong
    why: The stated position is to keep the existing DAMI and AIA support arrangements in place until DIA can provide those
      services.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Army favors a specific transfer date of 1 January 1992, but the source gives no further rationale for that date.
  reasoning:
    read: The decision is about continuity of support and when responsibility should transfer, not whether the broader transition
      infrastructure is operational. The trap is treating operational infrastructure and a transition plan as proof that DIA
      can already provide the external support services.
    weighing: The stated planning position favors preserving the baseline and retaining current support until DIA can provide
      the services {C1} {C2}. The Army's proposed 1 January 1992 transfer is a recorded disagreement, but the source does
      not say DIA will be ready by then {C3}. The balance therefore depends on DIA's ability to provide the services, not
      the proposed date alone.
    tradecraft: Keep current support arrangements in place while the stated condition remains unmet. Record the basis for
      any transfer date and the evidence that DIA can provide the services; do not treat general infrastructure readiness
      as proof of service readiness.
    uncertainty: The source does not specify how DIA's ability to provide each service is to be assessed or give a date when
      that ability will be established.
    handoff: The transition authority should decide the continuity and transfer policy. In applying the stated condition,
      it would need to establish with DIA whether and when DIA can provide the relevant services.
    tempting_wrong:
      option: O1
      pull: The Army explicitly proposes 1 January 1992 as the hardware-support transfer date.
      why_wrong: That is the Army's dissenting position; the stated planning position is to retain current arrangements until
        DIA can provide the services, and the source does not establish readiness on that date.
    rejected:
      O1: The stated planning position favors retaining current support until DIA can provide the services, rather than transferring
        responsibility on the Army's proposed date.
      O3: The source's stated course is to retain current support until DIA can provide the services, rather than make a separate
        deferral decision about when to set the date.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: DIA is able to provide the relevant hardware-support services by 1 January 1992.
      then: O1
      why: The stated basis for retaining current arrangements lasts until DIA can provide the services; readiness by the
        proposed date would remove that basis for retaining them past that point.
    would_not_change:
    - id: noflip1
      if: The transition infrastructure remains operational and standards-compliant, but DIA's ability to provide the support
        services has not been established.
      why: Those facts support transition planning but do not, by themselves, satisfy the stated condition for ending current
        support arrangements.
    watch_for:
    - id: watch1
      what: Whether DIA can provide the services currently covered by the external support arrangements.
      favors:
      - O1
      why: The stated planning position makes DIA's ability to provide the services the condition for ending the current arrangements.
  lesson: During a transition, preserve existing support when the stated policy is to avoid disturbing the operational baseline
    and the successor has not yet been established as able to provide the services. A proposed transfer date is not a substitute
    for the stated readiness condition.
  limits: This reasoning addresses continuity of MSIC's external support and the timing of hardware-support responsibility
    in this transition. It does not establish readiness criteria or decide how those services should be provided.
