case:
  id: DR-CORPUS-NX-cc7f510b-E5@v1
  title: Deconfliction Near an Ongoing Joint Mission
  status: draft
  setting: X Corps area of operations, during execution of offensive operations at H-hour; X Corps and JTF-W.
  decider: X Corps
  agent: X Corps
  agent_role: decide
  situation: X Corps has received a fragmentary order to execute offensive operations at H-hour under JTF-W and unit plans,
    and execution is underway. The corps staff uses chat and email alerts to communicate relevant plan changes and coordinating
    instructions to subordinate commands. X Corps receives warning that JTF-W is executing a joint SOF mission well forward
    of the X Corps forward line of troops. The mission is ongoing, and X Corps must decide whether to restrict fires near
    it and when any restriction should end.
  question: What should X Corps do about restricting fires near the ongoing joint mission and lifting any restriction as the
    mission concludes and clears the X Corps area of operations?
  options:
    O1:
      do: X Corps should permit fires near the joint mission without a temporary restriction while the mission is underway
        or after it is complete and clear of the X Corps area of operations.
      move: act
      irreversible: false
    O2:
      do: X Corps should ask JTF-W to confirm deconfliction requirements and defer a decision on restricting fires near the
        joint mission until JTF-W responds to X Corps.
      move: ask
      irreversible: false
      to: JTF-W
    O3:
      do: X Corps should prohibit fires in a temporary area around the joint mission and lift the restriction once the mission
        is complete and clear of the X Corps area of operations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: X Corps receives a fragmentary order to execute offensive operations at H-hour.
  - id: F2
    kind: situation
    status: confirmed
    fact: The offensive operations are to be conducted in accordance with JTF-W and unit plans.
  - id: F3
    kind: capability
    status: confirmed
    fact: During execution, the X Corps staff provides chat and email alerts to subordinate commands about relevant changes
      to plans or supporting processes.
  - id: F4
    kind: situation
    status: confirmed
    fact: X Corps receives warning that JTF-W is executing a joint SOF mission.
  - id: F5
    kind: situation
    status: confirmed
    fact: The joint SOF mission is underway when X Corps receives the warning.
  - id: F6
    kind: situation
    status: confirmed
    fact: The joint mission area is well forward of the X Corps forward line of troops.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The mission is underway within the corps area, and X Corps responds by establishing a temporary no-fire area around
      it. This treats the ongoing joint mission as a reason for temporary deconfliction, though the source does not state
      a separate legal rule or explain the risk in more detail.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: X Corps uses its established alerts to notify subordinate commands about relevant changes and coordinating instructions.
      Applying that practice to the temporary restriction supports communicating the decision rather than leaving subordinates
      without an updated instruction.
  - id: C3
    facts:
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: 'The restriction is temporary: X Corps lifts it once the mission is complete and clear of the corps area, and notifies
      subordinate units. This limits the restriction to the period described rather than maintaining it afterward.'
  reasoning:
    read: This is a time-limited deconfliction decision during an ongoing joint mission, not a choice to impose a continuing
      restriction. X Corps establishes a temporary no-fire area and later lifts it when the mission is complete and clear
      of the corps area. No broader legal standard or detailed explanation of the underlying risk is stated.
    weighing: The ongoing mission and its location support the temporary restriction in {C1}; timely notice to subordinate
      commands supports carrying it out through the corps' alert process in {C2}. The stated end condition limits the restriction
      and supports lifting it when met in {C3}. The balance therefore favors {O3}, not a restriction that persists after the
      stated condition or a decision deferred without any interim restriction.
    tradecraft: Communicate the temporary restriction and its later removal to subordinate commands through chat and email
      alerts. Make the restriction's duration and the condition for lifting it clear in those notifications.
    uncertainty: The example does not specify the restriction's boundaries, a legal or rules-of-engagement standard, or whether
      JTF-W confirmation is required. It supports the temporary restriction and its stated end condition, but not broader
      claims about mandatory authority or the particular risks being managed.
    handoff: X Corps makes the decision and notifies subordinate commands. No required approval or referral to another authority
      is identified.
    tempting_wrong:
      option: O2
      pull: Seeking JTF-W confirmation may seem prudent because the mission is JTF-W's.
      why_wrong: X Corps acts on the warning by establishing a temporary restriction and notifying subordinates; that action
        is not made contingent on a JTF-W response. Deferral would leave the ongoing mission without the deconfliction measure
        used in the example.
    rejected:
      O1: It omits the temporary restriction X Corps places around the ongoing mission.
      O2: It defers rather than taking the temporary deconfliction action X Corps takes and communicating it to subordinate
        commands.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: JTF-W confirms that the joint mission requires no temporary fires restriction while it is underway.
      then: O1
      why: That would remove the deconfliction reason supporting the temporary restriction in this example.
    would_not_change:
    - id: noflip1
      if: The mission is complete and clear of the X Corps area of operations.
      why: That is the stated condition for lifting the restriction, not a reason to abandon the temporary-restriction course
        in O3.
    watch_for:
    - id: watch1
      what: Whether the mission remains ongoing or has become complete and clear of the X Corps area.
      favors:
      - O3
      why: That change in status distinguishes maintaining the temporary restriction from lifting it.
  lesson: Use a temporary deconfliction restriction when an ongoing joint mission calls for one, and communicate the change
    to affected subordinate commands. Tie removal to the stated condition that the mission is complete and clear, rather than
    leaving the restriction in place indefinitely.
  limits: The example does not establish a general legal requirement to impose a no-fire area in every joint mission or specify
    its boundaries. Its reasoning applies to the described deconfliction decision and stated end condition, not to conducting
    the mission or employing fires.
