case:
  id: DR-CORPUS-NX-ef8f7bee-E1@v1
  title: Raising DI Analytical Standards
  status: draft
  setting: CIA Directorate of Intelligence, 1993, during the DDI’s review of published analytical papers.
  decider: The DDI
  agent: The DDI
  agent_role: decide
  situation: The DDI reviewed published DI analytical papers after pre-publication review by the DDI front office had been
    discontinued. The review raised concerns about whether the papers made their reasoning clear and supported their judgments.
    CIA was under pressure to improve analytical performance following alleged intelligence failures concerning Iraq’s invasion
    of Kuwait. A proposed approach would make the assumptions underlying analytical arguments explicit through linchpin analysis.
    The approach also called for attention to changes in circumstances that could make alternative scenarios more likely.
    The DDI must decide whether to adopt a program to establish and promote these standards.
  question: What should the DDI do about adopting a program to establish and promote explicit standards for analytical argumentation?
  options:
    O1:
      do: The DDI approves a program of explicit argumentation standards, analyst workshops, tradecraft notes, performance
        tracking, recognition, and training.
      move: act
      irreversible: false
    O2:
      do: The DDI rejects a program of explicit argumentation standards, analyst workshops, tradecraft notes, performance
        tracking, recognition, and training.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: By the time the DDI took office in 1993, front-office pre-publication review of nearly all DI analytical studies
      had been discontinued.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The DDI judged that roughly one third of reviewed papers had no discernible argumentation supporting the credibility
      of their judgments.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The DDI judged that another third of the reviewed papers had flawed argumentation.
  - id: F4
    kind: situation
    status: assessed
    fact: CIA faced pressure to improve analytical performance following alleged intelligence failures concerning Iraq’s invasion
      of Kuwait.
  - id: F5
    kind: capability
    status: confirmed
    fact: The proposed linchpin approach called for explicitly stating the assumptions underlying analytical arguments.
  - id: F6
    kind: capability
    status: confirmed
    fact: The proposed approach called for greater attention to processes that alert policymakers when circumstances change
      in ways that increase the likelihood of alternative scenarios.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The DDI found that many papers either lacked discernible reasoning supporting their judgments or had flawed reasoning.
      Establishing explicit standards directly addresses this deficiency.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Pressure to improve analytical performance after alleged intelligence failures reinforced the need to improve the
      quality of analysis supporting policymakers.
  - id: C3
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Linchpin analysis makes assumptions underlying arguments explicit, while attention to changing circumstances can
      alert policymakers when alternative scenarios become more likely.
  - id: C4
    facts:
    - F1
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: With front-office pre-publication review discontinued and serious argumentation problems identified in published
      papers, systematic and transparent standards offered a way to assess whether analysts were meeting their critical-thinking
      responsibilities.
  reasoning:
    read: The problem is not simply that front-office review had ended; the DDI's review found substantial weaknesses in the
      reasoning supporting published judgments. The trap is treating the choice as whether to restore that review rather than
      whether to address the underlying deficiencies in argumentation.
    weighing: The assessed shortcomings in many papers, pressure to improve analytical performance, and an approach that explicitly
      states assumptions and attends to changes that could favor alternatives all support adopting the program {C1} {C2} {C3}.
      Put systematic, transparent standards into practice through workshops, tradecraft notes, performance tracking, recognition,
      and training. The balance favors {O1}; its continuing value depends on sustaining those practices because poorly substantiated
      analysis remained in evidence.
    tradecraft: Adopt the standards and make their use part of analyst and manager training. Track performance against the
      standards and recognize exemplary assessments; keep attention on whether arguments state their assumptions and whether
      changing circumstances could increase the likelihood of alternatives.
    uncertainty: The long-term staying power of the initiatives was not yet clear. Many analysts used variations of linchpin
      analysis and successor training carried forward the concepts, but examples of poorly substantiated analysis still appeared.
    handoff: 'The DDI is the decision-maker in this scenario. Include managers and analysts in implementation and application
      of the standards: workshops are for managers, and training is intended for analysts and managers.'
    tempting_wrong:
      option: O2
      pull: The DDI could decline a new program because front-office pre-publication review had already been discontinued
        and the long-term durability of the proposed initiatives was uncertain.
      why_wrong: 'That uncertainty does not resolve the identified problem: many reviewed papers had absent or flawed argumentation.
        Establish systematic standards and maintain continued efforts to improve analysis.'
    rejected:
      O2: The DDI did not reject the program because the review identified widespread argumentation deficiencies and the endorsed
        course was to establish systematic standards and continue efforts to improve analysis.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Sustained evaluation showed that the standards and supporting program did not improve the reasoning or reliability
        of analytical products, and that no effective adjustment was available.
      then: O2
      why: The recommendation rests on the program addressing the identified weaknesses; evidence that it did not do so would
        undermine that rationale.
    would_not_change:
    - id: noflip1
      if: Some poorly substantiated analysis continued to appear despite adoption of the standards.
      why: Poorly substantiated analysis can persist even after adoption; the appropriate response is ongoing vigilance, not
        abandonment of the initiative.
    watch_for:
    - id: watch1
      what: Whether the standards endure in practice, including whether analysts continue to use linchpin concepts and training
        continues to teach them.
      favors:
      - O1
      why: The initiatives' long-term staying power was unclear, although linchpin concepts and successor training had endured
        to that point.
  lesson: When a review finds that judgments are not supported by clear reasoning, address the quality of the argument rather
    than relying on the existence or absence of a particular review stage. Make assumptions explicit, attend to developments
    that could strengthen alternatives, and sustain monitoring and training so the standards remain in use.
  limits: This reasoning concerns an internal program to improve analytical argumentation in DI products. It does not establish
    a general requirement to adopt linchpin analysis, prescribe pre-publication review, or resolve operational intelligence-collection
    decisions.
