case:
  id: DR-CORPUS-NX-b3cb5db8-E3@v1
  title: Collective Punishment or Individual Search
  status: draft
  setting: Bohemia and Moravia, during martial law, under the Reichsprotektorate's administration.
  decider: The senior security official and the Deputy Reichsprotektor
  agent: The senior security official and the Deputy Reichsprotektor
  agent_role: decide
  situation: Martial law was in force throughout Bohemia and Moravia, with a daily curfew at sundown. Public announcements
    threatened summary execution without trial for anyone harboring or otherwise aiding the assassins. Illegal arms possession
    and approval of assassination were declared capital crimes. Mass arrests and executions had begun, but after twenty days
    the assassins had not been located. A small settlement near Kladno, fifteen miles from Prague, was at issue as officials
    considered whether to extend punishment to a population or continue a search focused on responsible individuals.
  question: What should the senior security official and the Deputy Reichsprotektor do regarding the settlement and the search
    for those responsible?
  options:
    O1:
      do: The senior security officials spare the settlement and continue the search.
      move: act
      irreversible: false
    O2:
      do: The senior security officials defer a decision on the settlement.
      move: hold
      irreversible: false
    O3:
      do: The senior security officials select the settlement for collective punishment.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Martial law was proclaimed over all Bohemia and Moravia.
  - id: F2
    kind: situation
    status: confirmed
    fact: A daily curfew at sundown was imposed throughout the land.
  - id: F3
    kind: authority
    status: confirmed
    fact: Public announcements threatened summary execution without trial for anyone harboring or otherwise aiding the assassins.
  - id: F4
    kind: authority
    status: confirmed
    fact: Illegal possession of arms and approval of assassination in principle were declared capital crimes.
  - id: F5
    kind: situation
    status: confirmed
    fact: Mass arrests and executions had begun.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: After twenty days, the assassins had not been located.
  - id: F7
    kind: situation
    status: confirmed
    fact: A small settlement near Kladno was fifteen miles from Prague.
  - id: F8
    kind: situation
    status: confirmed
    fact: The senior security official and the Deputy Reichsprotektor devised a new approach after the search failed to locate
      the assassins.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: After mass arrests and executions failed to locate the assassins, the officials devised a new approach. This failure
      was the context for choosing collective punishment, but there is no stated claim that punishing the settlement was expected
      to find those responsible.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The existing response included threats of summary execution without trial and mass executions without investigation
      or trial. Those measures describe the coercive setting; they do not establish individual responsibility by the settlement's
      population.
  - id: C3
    facts:
    - F7
    - F8
    equity: third_party_harm
    favors:
    - O1
    weight: strong
    why: The settlement was selected arbitrarily. Punishing a population rather than focusing on identified responsible individuals
      exposes people not shown to be involved to grave harm.
  - id: C4
    facts:
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The search had not located the assassins after twenty days. Collective punishment is not presented as an effective
      investigative measure or as having produced the information sought.
  reasoning:
    read: The decision followed a failed search, but the choice was to punish a population rather than proceed on evidence
      identifying responsible individuals. The trap is treating failure to find the assassins as evidence against a settlement,
      or as a reason that makes collective punishment an effective search method. The settlement was selected arbitrarily.
    weighing: The officials chose {O3} after the search failed, but no articulated evidentiary or legal basis connects the
      settlement to the assassins, and no claim states that collective punishment would locate them. The prior threats and
      executions show the coercive policy in force, not proof of responsibility. The balance would depend on an individualized
      basis for action; none is recorded. The account records the officials' choice, not a justification that resolves the
      due-process and third-party-harm concerns.
    tradecraft: As a decision-practice synthesis, separate the search objective from punitive action, record the evidence
      linking any person or place to responsibility, and require review of the legal basis before imposing severe consequences.
      Do not treat proximity or an unsuccessful search as evidence of culpability.
    uncertainty: The account gives no evidence linking the settlement or its residents to the assassins, no legal analysis
      authorizing collective punishment, and no stated rationale beyond the failed search and the officials' new approach.
    handoff: The senior security official and the Deputy Reichsprotektor were the decision-makers; consultation or referral
      is not described. As a decision-practice synthesis, a decision with grave consequences and no stated individualized
      basis should be referred for independent legal and command review rather than treated as a unilateral investigative
      choice.
    tempting_wrong:
      option: O1
      pull: Spare the settlement and continue a search focused on responsible individuals, avoiding punishment of people not
        shown to be involved.
      why_wrong: No substantive reason is given for why this course was wrong; the officials instead devised a new approach
        after the search failed.
    rejected:
      O1: The officials did not spare the settlement and continue the search; they selected it for collective punishment after
        the search failed.
      O2: The officials did not defer the decision; they devised and carried out a new approach.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable, individualized evidence established responsibility by particular persons, rather than merely implicating
        a population.
      then: O1
      why: That would support action focused on responsible individuals while avoiding unsupported collective punishment.
    would_not_change:
    - id: noflip1
      if: The search continued to fail to locate the assassins, without new evidence connecting the settlement or its residents
        to them.
      why: Search failure alone would not establish the population's responsibility or make collective punishment an effective
        investigative measure.
    watch_for:
    - id: watch1
      what: Whether credible evidence emerges that identifies particular responsible individuals.
      favors:
      - O1
      why: Individualized evidence could support a focused response rather than punishment of a population.
  lesson: A failed search does not itself establish a population's responsibility or justify collective punishment. Keep investigative
    action tied to evidence about responsible individuals, and do not confuse coercive authority or threats with proof or
    legal authorization.
  limits: This brief historical account is not a legal analysis or a full record of the officials' deliberations. It does
    not establish the governing legal standard, any evidence against residents, or a lawful basis for collective punishment.
  library:
    domain: use-of-force-policy
