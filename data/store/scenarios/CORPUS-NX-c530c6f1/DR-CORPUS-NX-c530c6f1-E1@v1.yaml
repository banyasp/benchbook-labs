case:
  id: DR-CORPUS-NX-c530c6f1-E1@v1
  title: FTO Designation Authority for Mexican Cartels
  status: draft
  setting: United States, March–April 2011, Congress and the State Department.
  decider: Congress
  agent: Congress
  agent_role: decide
  situation: In March 2011, a member of Congress from Austin was seeking to designate seven leading Mexican cartels as foreign
    terrorist organizations. A proposed House bill would permit asset freezes tied to trafficking organizations and enhanced
    criminal penalties for people aiding them. The proposed penalties would apply to organizations as well as their leaders.
    Supporters argued that cartel violence against the Mexican government, legal system, and media threatened the country's
    foundations and border security. A former federal anti-drug official assessed that cartel activity across the border was
    difficult for U.S. authorities to prosecute.
  question: What should Congress do about H.R. 1270's proposed authorization to apply FTO-related powers to qualifying Mexican
    cartels?
  options:
    O1:
      do: Congress should authorize FTO designation-related asset freezes and enhanced penalties for qualifying cartels through
        H.R. 1270.
      move: act
      irreversible: false
    O2:
      do: Congress should decline to authorize FTO designation-related asset freezes and enhanced penalties for qualifying
        cartels through H.R. 1270.
      move: act
      irreversible: false
    O3:
      do: Congress should request further review of the proposed FTO designation authority from the relevant committees before
        acting.
      move: ask
      irreversible: false
      to: the relevant congressional committees
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A member of Congress from Austin was seeking to designate seven leading Mexican cartels as foreign terrorist organizations.
  - id: F2
    kind: intelligence
    status: assessed
    fact: A former anti-drug task-force director assessed that cartel leaders operated in areas where they believed they could
      not be reached by the criminal justice system.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A former federal anti-drug official assessed that cartel members broke the law on the Mexican side of the border
      believing they would escape consequences, making cases difficult for U.S. authorities.
  - id: F4
    kind: authority
    status: confirmed
    fact: H.R. 1270, proposed in March 2011, would permit the government to freeze money tied to trafficking organizations
      and enhance criminal penalties for people aiding them.
  - id: F5
    kind: capability
    status: confirmed
    fact: The proposed penalties included large fines and prison sentences and would apply to the entire organization, not
      only its leaders.
  - id: F6
    kind: capability
    status: confirmed
    fact: FTO listing would give law enforcement authority to limit travel operations and deport involved cartel members.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A proponent assessed that violence against the Mexican government, legal system, and media threatened the foundations
      of that country and that the administration needed tools to ensure border security.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Proponents assessed that FTO designation would simplify action against cartel criminal activity and make prosecution
      more effective.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Cartel leaders were assessed to operate beyond the reach of the criminal justice system, and cross-border cartel
      activity was assessed to make cases difficult for U.S. authorities. Supporters viewed expanded enforcement authority
      as a way to address that gap.
  - id: C2
    facts:
    - F7
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Supporters assessed that violence against Mexico's government, legal system, and media threatened the country's foundations
      and that the administration needed tools to ensure border security.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The proposed authority would permit asset freezes and enhanced penalties, including penalties reaching the organization
      as a whole, as well as travel restrictions and deportation of involved members. Supporters assessed that designation
      would simplify action against cartel crime and make prosecution more effective.
  reasoning:
    read: The decision is whether to extend FTO-related enforcement powers to qualifying cartels because supporters saw cartel
      violence and cross-border impunity as threats to security and effective prosecution. The trap is treating existing criminal
      enforcement as sufficient despite the assessed difficulty of reaching cartel leaders and prosecuting cross-border conduct.
    weighing: The assessed limits on existing prosecution {C1}, the threat to Mexican institutions and border security {C2},
      and the expected enforcement and prosecution benefits {C3} together favor authorizing the proposed powers. That balance
      depends on the proponents' assessment that designation would provide useful tools and improve enforcement; the source
      offers this as a rationale, not as a measured finding of results.
    tradecraft: Record the authorization, its stated security and prosecution rationale, and that the powers apply to qualifying
      cartels. Keep the decision record focused on the legal and policy choice rather than operational coordination details.
    uncertainty: The stated case for authorization rests on assessments of cartel activity, security threats, and the likely
      effectiveness of designation; the cited material does not establish how effective the proposed powers would be in practice.
    handoff: Congress is the decision-maker on the proposed bill. Committee review is an available alternative if Congress
      considers the effectiveness or scope of the proposed authority unresolved.
    tempting_wrong:
      option: O3
      pull: Further committee review could appear prudent given the breadth of the proposed powers.
      why_wrong: The source's stated rationale supports using designation to address security threats and prosecution barriers;
        it does not identify a specific unresolved issue requiring delay.
    rejected:
      O2: Declining the authority would leave unadopted the additional tools supporters considered necessary to address cartel
        violence and difficult cross-border prosecutions.
      O3: Requesting further review would defer action despite the proponents' stated case that designation could improve
        security and prosecution.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Further review established that FTO-related powers would not provide a meaningful means to address the described
        enforcement and prosecution barriers.
      then: O3
      why: That would undermine the expected enforcement benefit central to the case for authorization and support seeking
        review before acting.
    would_not_change:
    - id: noflip1
      if: Additional evidence confirmed that cross-border cartel activity made cases difficult for U.S. authorities.
      why: That would reinforce, rather than displace, the source's reason for extending enforcement tools.
    watch_for:
    - id: watch1
      what: Evidence about whether designation would simplify action against cartel crime and make prosecution more effective.
      favors:
      - O1
      why: Those expected improvements are a central part of the stated case for authorization.
  lesson: When supporters identify a serious security threat and concrete enforcement barriers, weigh whether the proposed
    authority is expected to address them. A recommendation to authorize should remain tied to that expected benefit rather
    than treating designation itself as proof of effectiveness.
  limits: This reasoning applies to the proposed 2011 authority and the assessments described here; it does not establish
    that any particular cartel meets designation criteria or that the powers would be effective in other circumstances. The
    source does not address procedural safeguards or the effects of these powers on affected individuals.
