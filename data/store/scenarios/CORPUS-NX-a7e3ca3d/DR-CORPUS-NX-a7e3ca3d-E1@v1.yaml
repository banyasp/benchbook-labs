case:
  id: DR-CORPUS-NX-a7e3ca3d-E1@v1
  title: Duty to Warn Under Threshold Uncertainty
  status: draft
  setting: United States; time unspecified; U.S. government duty-to-warn policy
  decider: The official responsible for the duty-to-warn determination
  agent: The official responsible for the duty-to-warn determination
  agent_role: decide
  situation: The responsible official has threat information concerning an intended victim, and it is uncertain whether the
    information meets the duty-to-warn threshold. The decision concerns a case in which none of the applicable waiver justifications
    is present. The policy identifies circumstances that can justify not warning, including certain risks to U.S. or foreign-government
    personnel, sources, methods, or operations. The official must determine whether to inform the intended victim.
  question: What should the official responsible for the duty-to-warn determination do about informing the intended victim?
  options:
    O1:
      do: The responsible duty-to-warn official withholds the threat information from the intended victim.
      move: act
      irreversible: false
    O2:
      do: The responsible duty-to-warn official discloses the threat information to the intended victim.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The policy addresses cases where there is uncertainty about whether threat information meets the duty-to-warn threshold.
  - id: F2
    kind: authority
    status: confirmed
    fact: One listed justification concerns an intended victim whose risk results only from participation in an insurgency,
      insurrection, or other armed conflict.
  - id: F3
    kind: authority
    status: confirmed
    fact: A listed justification is a reasonable basis for believing the intended victim is a terrorist, direct supporter
      of terrorists, assassin, drug trafficker, or involved in violent crimes.
  - id: F4
    kind: authority
    status: confirmed
    fact: A listed justification is that attempting to warn the intended victim would unduly endanger U.S. government personnel,
      sources, methods, intelligence operations, or defense operations.
  - id: F5
    kind: authority
    status: confirmed
    fact: A listed justification concerns information acquired from a foreign government with a formal agreement or liaison
      relationship with the United States.
  - id: F6
    kind: authority
    status: confirmed
    fact: For that foreign-government information, a listed justification is that attempting to warn would unduly endanger
      that government's personnel, sources, methods, intelligence operations, or defense operations.
  - id: F7
    kind: authority
    status: confirmed
    fact: The policy lists the absence of a reasonable way to warn the intended victim as a justification.
  - id: F8
    kind: authority
    status: confirmed
    fact: When threshold uncertainty arises and none of the Section F.3 justifications is present, the policy resolves the
      issue in favor of informing the intended victim.
  considerations:
  - id: C1
    facts:
    - F1
    - F8
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: The policy expressly resolves uncertainty about the threshold in favor of informing the intended victim when no listed
      justification applies.
  - id: C2
    facts:
    - F2
    - F3
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The policy recognizes victim-specific circumstances that can justify not warning, but none is present in this case;
      those exceptions do not displace the default in favor of informing.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F7
    - F8
    equity: source_protection
    favors:
    - O2
    weight: weak
    why: The policy also recognizes operational, foreign-government-protection, and warning-feasibility grounds for not warning.
      Because none applies here, they provide no basis to depart from informing.
  reasoning:
    read: This is a threshold-uncertainty case, not a case in which a listed justification for withholding is present. The
      trap is treating uncertainty itself as a reason to withhold; the policy directs the opposite result when none of its
      waiver justifications applies.
    weighing: The threshold uncertainty is resolved in favor of informing under {C1}. The victim-related exceptions and the
      personnel, source, foreign-government, and feasibility exceptions matter only when their stated conditions apply; on
      these facts they do not counterbalance the policy's default ({C2}, {C3}). The outcome depends on the absence of every
      applicable Section F.3 justification.
    tradecraft: Apply the threshold rule and assess whether any listed waiver justification is present. Record the basis for
      finding that uncertainty remains and that no applicable justification supports withholding. These documentation steps
      are decision practice, not additional requirements stated in the cited text.
    uncertainty: The policy addresses uncertainty about whether the information meets the duty-to-warn threshold. It does
      not require certainty that the threat will materialize; the stated instruction is to resolve the threshold issue in
      favor of informing when no waiver justification is present.
    handoff: The responsible duty-to-warn official makes the determination. The cited rule identifies no additional approval
      or referral requirement.
    tempting_wrong:
      option: O1
      pull: Withholding may seem safer while the threshold remains uncertain.
      why_wrong: That treats uncertainty as a reason to withhold, although the policy resolves that uncertainty in favor of
        informing when no listed justification applies.
    rejected:
      O1: Withholding was not chosen because the policy directs the responsible official to resolve threshold uncertainty
        in favor of informing when none of the listed justifications is present.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A listed Section F.3 justification is present, such as a reasonable basis for believing the intended victim falls
        within a listed category, undue danger from warning, or no reasonable way to warn.
      then: O1
      why: A listed justification could support withholding and would remove the premise on which the default rule requires
        resolving threshold uncertainty in favor of informing.
    would_not_change:
    - id: noflip1
      if: The threshold remains uncertain and none of the listed justifications is present.
      why: That is the precise circumstance in which the directive says to resolve the issue in favor of informing.
    watch_for: []
  lesson: When a policy expressly resolves threshold uncertainty in favor of warning, uncertainty alone is not a basis for
    withholding. First determine whether a stated waiver condition applies; absent one, follow the policy's default.
  limits: This reasoning applies to the stated duty-to-warn threshold rule and the absence of its listed waiver justifications.
    It does not determine whether a waiver applies in a different case or address warning-delivery methods.
  library:
    domain: intel-oversight
    family: CORPUS-NX-a7e3ca3d
    source: https://archive.dni.gov/files/documents/ICD/ICD-191.pdf
    episode_focus: The directive resolves this stated uncertainty in favor of informing the intended victim when none of the
      listed waiver justifications is present. Focus on that policy choice and its threshold and waiver conditions; exclude
      warning-delivery methods and operational details.
    cues:
      option_words:
        O1: 12
        O2: 12
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
    equities: pilot2
