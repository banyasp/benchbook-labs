case:
  id: DR-CORPUS-NX-b8710c8d-E6@v1
  title: French Resource Commitment to Indochina
  status: draft
  setting: French-occupied Western Germany, North Africa, and north Indochina; autumn campaign planning; French authorities.
  decider: The French government
  agent: The French government
  agent_role: decide
  situation: The French have been attempting to suppress a Communist-led insurrection in Indochina since 1945. French authorities
    have plans to shift manpower and materiel from forces in French-occupied Western Germany and North Africa for an autumn
    campaign in north Indochina. They maintain that control of the China-Indochina border is necessary to prevent support
    and movement by Chinese Communists, and argue that stabilizing Indochina is important to Southeast Asian security. The
    transfer could reduce Western Union’s defense potential, weaken the effect of European recovery aid, delay France’s economic
    recovery, and affect US prestige because French forces use US-supplied equipment. A proposed government within the French
    Union has authority to establish itself, while French authorities regard military success as important to its initial
    political prospects.
  question: What should the French government do about committing manpower and materiel from French-occupied Western Germany
    and North Africa to the autumn campaign in north Indochina?
  options:
    O1:
      do: The French government authorizes the transfer of manpower and materiel from forces in French-occupied Germany and
        North Africa for the autumn campaign in north Indochina.
      move: act
      irreversible: true
    O2:
      do: The French government prohibits the transfer of manpower and materiel from forces in French-occupied Germany and
        North Africa for the autumn campaign in north Indochina.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: French authorities plan to shift manpower and materiel from forces in French-occupied Germany and North Africa for
      an autumn campaign against Communist-led rebels in north Indochina.
  - id: F2
    kind: situation
    status: assessed
    fact: The transfer of arms and equipment from French-occupied Western Germany may reduce Western Union’s defense potential.
  - id: F3
    kind: situation
    status: assessed
    fact: French military expenditure in Indochina may reduce the effectiveness of European recovery aid and delay France’s
      economic recovery.
  - id: F4
    kind: situation
    status: assessed
    fact: French use of US-made and US-supplied arms and equipment in Indochina may impair US prestige in the Far East.
  - id: F5
    kind: intelligence
    status: assessed
    fact: French authorities maintain that control of the China-Indochina border is necessary to prevent Chinese Communists
      from providing men and materiel to rebels or evading Indochina.
  - id: F6
    kind: intelligence
    status: assessed
    fact: French authorities argue that stabilizing their position in Indochina is essential to Southeast Asian security against
      Communism.
  - id: F7
    kind: authority
    status: confirmed
    fact: An agreement with a former emperor of an Indochinese state grants him authority to establish an independent government
      for Indochina within the French Union.
  - id: F8
    kind: intelligence
    status: assessed
    fact: French authorities consider substantial military success against the resistance movement necessary for the proposed
      government’s initial political success.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: French authorities regarded control of the China-Indochina border as necessary to prevent Chinese Communist support
      to the rebels or movement through Indochina.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: They argued that stabilizing their position in Indochina was essential to Southeast Asian security against Communism.
  - id: C3
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The proposed government had authority to establish itself within the French Union, and French authorities considered
      substantial military success necessary to its initial political success.
  - id: C4
    facts:
    - F2
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: Moving arms and equipment out of French-occupied Western Germany could reduce Western Union's defense potential.
  - id: C5
    facts:
    - F3
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: Military expenditure in Indochina could reduce the effectiveness of European recovery aid and delay France's economic
      recovery.
  - id: C6
    facts:
    - F4
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: Using US-made and US-supplied equipment could impair US prestige in the Far East.
  reasoning:
    read: 'This is a choice about committing resources to Indochina while accepting costs to Western European defense, French
      recovery, and US prestige. The trap is to treat either the French security rationale or those costs as the only relevant
      interest: the French also considered military success important to the proposed government''s political prospects.'
    weighing: The French rationale for O1 was that border control would impede Chinese Communist support and that stabilizing
      Indochina mattered to Southeast Asian security; they also saw substantial military success as important to the proposed
      government's initial prospects. Against that, the transfer could weaken Western Union's defense, reduce the effect of
      European recovery aid, delay French recovery, and affect US prestige. The source presents the French plan and their
      reasons, but does not expressly establish that the benefits outweigh those costs. O1 is the endorsed course here because
      it is the French authorities' stated plan and is supported by their stated security and political rationale; the balance
      depends on those assessments holding.
    tradecraft: Before authorizing the transfer, record the expected security benefit, the effect on Western Union's defense
      and French recovery, and the assumptions supporting the French assessment. Revisit the decision if those assumptions
      or the assessed costs materially change.
    uncertainty: The necessity of border control and the regional-security benefit are French assessments, not independently
      confirmed findings in this excerpt. The stated effects on Western Union, recovery, and US prestige are also potential
      consequences; the source gives no quantified comparison among them.
    handoff: The French government should decide, with defense and economic officials contributing assessments of the effects
      on Western Union's defense and French recovery. This consultation is a decision-practice recommendation.
    tempting_wrong:
      option: O2
      pull: It avoids diverting resources from Western European defense and French economic recovery, and avoids the identified
        risk to US prestige.
      why_wrong: Those are substantial costs, but choosing O2 would set aside the French authorities' stated concerns about
        the China-Indochina border, Southeast Asian security, and the proposed government's initial political prospects.
    rejected:
      O2: The French authorities' stated border-security and regional-security rationale, together with their view that military
        success mattered to the proposed government's initial prospects, supports proceeding despite the identified European,
        economic, and prestige costs.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable reassessment showed that control of the China-Indochina border was no longer necessary to prevent Chinese
        Communist support or movement.
      then: O2
      why: That would remove a central stated security rationale for committing the resources, leaving the costs to Western
        Union's defense and French recovery more decisive.
    - id: flip2
      if: The expected harm to Western Union's defense and French economic recovery were assessed to outweigh the security
        and political benefits of the Indochina commitment.
      then: O2
      why: The source identifies these as material costs; if they outweighed the stated benefits, prohibiting the transfer
        would be preferable.
    would_not_change:
    - id: noflip1
      if: The separate question of whether the US should provide public support or military aid remained unresolved.
      why: That is distinct from the French government's decision about transferring its own manpower and materiel.
    watch_for:
    - id: watch1
      what: Evidence bearing on the claimed need for control of the China-Indochina border and the claimed necessity of military
        success for the proposed government's initial political prospects.
      favors:
      - O1
      why: These are central premises in the French authorities' stated rationale for proceeding.
  lesson: A resource commitment should be assessed against both its strategic purpose and the competing defense and recovery
    costs it creates. Do not treat an asserted security rationale as proof that costs are outweighed; make the assumptions
    explicit and revisit the decision if they change.
  limits: This reasoning addresses only the French government's choice to transfer manpower and materiel for the campaign.
    It does not decide the separate question of US aid, assess the campaign's operational conduct, or establish that the French
    assessments were independently verified.
