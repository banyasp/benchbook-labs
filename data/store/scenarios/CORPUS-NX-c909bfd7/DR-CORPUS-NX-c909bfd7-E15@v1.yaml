case:
  id: DR-CORPUS-NX-c909bfd7-E15@v1
  title: Interagency Integration in Colombian Planning
  status: draft
  setting: Colombia, 2002–2006; national counterinsurgency planning and interagency coordination.
  decider: The national administration
  agent: The national administration
  agent_role: decide
  situation: The national administration is considering the role of the police and other government agencies in counterinsurgency
    planning. The military services answer to the joint command, but historically they have worked together more by courtesy
    than through unified command. That arrangement has not created insuperable problems, in part because one service has been
    dominant, although unity of command is considered important for counterinsurgency. The national police have not been integrated
    into counterinsurgency planning at the national level. Police and judicial authorities have legally distinct functions
    that are not assigned to the armed forces. At the same time, efforts to reorganize military commands have met resistance
    within the services.
  question: What should the national administration do about the role of the police and other government agencies in counterinsurgency
    planning?
  options:
    O1:
      do: The national administration separates the police and other government agencies from national counterinsurgency planning.
      move: act
      irreversible: false
    O2:
      do: The national administration integrates the police and other government agencies into national counterinsurgency
        planning.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The military services answered to the joint command but had historically functioned together more by courtesy than
      by command.
  - id: F2
    kind: situation
    status: assessed
    fact: The military services' prior way of coordinating had posed no insuperable problems, particularly given the dominance
      of one service.
  - id: F3
    kind: situation
    status: assessed
    fact: Unity of command is considered crucial to conducting counterinsurgency.
  - id: F4
    kind: situation
    status: confirmed
    fact: The national police had not been integrated at the national level into counterinsurgency planning under the prior
      administration.
  - id: F5
    kind: situation
    status: confirmed
    fact: Plans to replace service-specific divisional areas with joint operational commands met fierce resistance in parochial
      circles.
  - id: F6
    kind: authority
    status: confirmed
    fact: Police and judicial officials had functions that were not legally devolved to the armed forces.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: Prior military coordination had not caused insuperable problems, but it relied more on courtesy than command. Unity
      of command is crucial to counterinsurgency, and deeper integration is a logical development for the mission.
  - id: C2
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Integrated planning brings police and judicial authorities into operations while allowing them to perform functions
      legally not devolved to the armed forces; it does not transfer those functions to the military.
  - id: C3
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The prior absence of national police integration ended under the new administration. State involvement brought closer
      integrated efforts and greater operational flexibility.
  - id: C4
    facts:
    - F5
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: Resistance within the services and the prospect of institutional turmoil caution that integration and command reform
      may be difficult to implement. The move toward joint command remains logical for counterinsurgency.
  reasoning:
    read: The choice is whether to bring police and other government agencies into national counterinsurgency planning, not
      whether to give the armed forces functions reserved to those agencies. The trap is treating prior coordination without
      insuperable problems as proof that separation is adequate, despite the importance of unity of command and agencies'
      complementary legal roles.
    weighing: 'The balance favors integration: military coordination by courtesy was not ideal where unity of command mattered,
      and involving police and judicial authorities brought closer integrated efforts and flexibility through their distinct
      legal functions. Resistance to command reform is a real implementation difficulty, but joint command is a logical direction
      for counterinsurgency. The balance depends on coordinating agencies while respecting their separate legal authority.'
    tradecraft: Set out participating agencies' roles and legal limits, establish clear coordination and accountability, and
      record the authority for each agency's part. Review implementation to ensure planning is genuinely integrated without
      assigning one agency another's legally distinct functions.
    uncertainty: The account gives a strategic rationale and describes the direction taken, but does not specify detailed
      governance arrangements, safeguards, or costs of interagency planning.
    handoff: The national administration should decide and coordinate with the joint command, police, and relevant judicial
      and government authorities, because the choice concerns national planning and agencies with distinct functions.
    tempting_wrong:
      option: O1
      pull: The prior military arrangement had not caused insuperable problems, and command reforms faced strong internal
        resistance.
      why_wrong: Those points do not overcome the conclusion that courtesy-based coordination was not ideal for counterinsurgency
        or the rationale for including agencies with legally distinct functions.
    rejected:
      O1: Preserving national-level separation would forgo the closer integrated efforts and operational flexibility gained
        by involving police and other government agencies.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The police and judicial authorities lacked legal authority for the distinct functions that make their participation
        valuable, or could not lawfully participate in planning.
      then: O1
      why: The practical rationale for their inclusion depends on those authorities performing functions not legally devolved
        to the armed forces.
    would_not_change:
    - id: noflip1
      if: The prior courtesy-based military coordination continued to avoid insuperable problems.
      why: That condition is already part of the situation; unity of command remains crucial, and the prior arrangement remains
        less than ideal.
    watch_for:
    - id: watch1
      what: Resistance within the services to joint operational command reforms.
      favors:
      - O1
      why: Fierce resistance and anticipated turmoil could complicate implementation, even though they do not displace the
        case for integration.
  lesson: Where counterinsurgency depends on unity of effort, prior coordination that merely avoids major problems may still
    be inadequate. Integrate agencies with complementary legal functions while preserving the boundaries of each agency's
    authority.
  limits: This reasoning supports integrated planning in the described counterinsurgency setting; it does not establish that
    every agency should be integrated into every operation. It also does not authorize transferring police or judicial powers
    to the armed forces.
