case:
  id: DR-CORPUS-NSA-TONKIN-NX-2b661fb1-E2@v1
  title: Disengagement After a Reported Attack
  status: draft
  setting: At 021659, Seventh Fleet command, during a reported attack at sea.
  decider: The Seventh Fleet commander
  agent: The Seventh Fleet commander
  agent_role: decide
  situation: 'The Seventh Fleet commander is receiving a ship''s report following an attack by craft that had since retired.
    The ship reported no damage and reported that it was retiring. Aircraft attacks against craft had mixed reported results:
    one had no observed hits, while hits were observed in other attacks. One craft was reported dead in the water and burning,
    and aircraft were reported attacking another craft. The commander must choose whether to direct retirement, permit pursuit,
    or seek an updated report before deciding.'
  question: What should the Seventh Fleet commander direct the ship to do after the reported attack?
  options:
    O1:
      do: The Seventh Fleet commander permits the ship to pursue the departing craft while limiting any fire to self-defense.
      move: act
      irreversible: false
    O2:
      do: The Seventh Fleet commander directs the ship to retire, prohibits pursuit, and limits fire to self-defense.
      move: act
      irreversible: false
    O3:
      do: The Seventh Fleet commander requests an updated report from the ship and defers pursuit, limiting fire to self-defense.
      move: ask
      irreversible: false
      to: the ship
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: An attacking craft had completed its attack and retired.
  - id: F2
    kind: situation
    status: assessed
    fact: The ship reported that it had sustained no damage.
  - id: F3
    kind: situation
    status: assessed
    fact: The ship reported that it was retiring.
  - id: F4
    kind: situation
    status: assessed
    fact: No hits were observed in an aircraft attack on one craft.
  - id: F5
    kind: situation
    status: assessed
    fact: Hits were observed during other aircraft attacks.
  - id: F6
    kind: situation
    status: assessed
    fact: One craft was reported dead in the water and burning.
  - id: F7
    kind: situation
    status: assessed
    fact: Aircraft were reported attacking one craft.
  considerations:
  - id: C1
    facts:
    - F1
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The attacking craft had completed its attack and retired; the order was not to pursue it.
  - id: C2
    facts:
    - F2
    - F3
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The ship reported no damage and was already retiring, consistent with directing it to continue retiring rather than
      pursue.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    - O3
    weight: weak
    why: The reported aircraft results were mixed and attacks were ongoing. The command's direction to wait until the situation
      was clear supports restraint rather than treating those reports as a basis for pursuit.
  - id: C4
    facts:
    - F1
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Seventh Fleet command expressly directed retirement, prohibited pursuit, limited fire to self-defense, and requested
      a situation report.
  reasoning:
    read: This was a report after an attack whose craft had retired; the ship reported no damage and was retiring, while aircraft
      reports described mixed results and continuing attacks. The trap is to treat unresolved or mixed attack reports as permission
      to pursue, even though the command directed no pursuit until the situation was clear and further advice was given.
    weighing: The retired craft and the ship's undamaged, retiring status support disengagement {C1} {C2}. The mixed reports
      leave the situation unsettled, which supports restraint while a report is provided {C3}. Most decisively, the Seventh
      Fleet command gave a direct order to retire, not pursue, and use fire only in self-defense {C4}.
    tradecraft: Carry out the retirement direction, keep any fire within the stated self-defense limit, report the situation,
      and await further advice.
    uncertainty: The command treated the situation as not yet clear. The record provides no further explanation for that assessment
      or for the command's choice beyond its direction to retire, prohibit pursuit, and report.
    handoff: The Seventh Fleet commander made the decision and directed a situation report; further advice was to come through
      command. No additional decision-maker is identified.
    tempting_wrong:
      option: O1
      pull: Aircraft attacks were ongoing and some attacks had observed hits, which could tempt a decision-maker to continue
        the engagement by pursuing.
      why_wrong: That would conflict with the command's express prohibition on pursuit; the self-defense limit did not authorize
        pursuit.
    rejected:
      O1: It was not chosen because the commander expressly prohibited pursuit and ordered retirement.
      O3: It was not chosen because the commander directed retirement and prohibited pursuit immediately, while separately
        requesting a situation report.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: After receiving further advice, the commander determines the situation is clear and expressly authorizes pursuit.
      then: O1
      why: A later express command authorizing pursuit would replace the no-pursuit direction; the current order does not
        authorize pursuit.
    would_not_change:
    - id: noflip1
      if: The report that one aircraft attack had no observed hits is considered by itself, without further advice changing
        the command direction.
      why: That fact alone does not supersede the express order to retire and not pursue.
    watch_for: []
  lesson: When command directs disengagement pending clarity and further advice, do not convert mixed or continuing reports
    into permission to pursue. Keep any remaining use of force within the stated self-defense limit and report as directed.
  limits: This reasoning concerns the specific order issued in this reported situation; it does not establish a general rule
    against pursuit. A later command decision or materially changed situation could require a new assessment.
