case:
  id: DR-CORPUS-NS-6a719782-E1@v1
  title: Survivor Assistance Policy Decision
  status: draft
  setting: German U-boat command, during the Battle of the Atlantic, after the incident that prompted the order.
  decider: The German U-boat commander
  agent: The German U-boat commander
  agent_role: decide
  situation: After an incident, the German U-boat commander faced a choice about whether U-boats should continue aiding survivors
    of ships they had sunk. Before this decision, U-boats had often helped survivors. A proposed blanket rule would bar assistance
    to survivors of sunken ships. The commander's stated considerations included the view that rescue conflicted with destroying
    enemy ships and crews, and the claim that Allied bombing of German cities showed no regard for women and children.
  question: What should the German U-boat commander do about whether U-boats may continue aiding survivors of sunken ships?
  options:
    O1:
      do: The German U-boat commander prohibits U-boats from aiding survivors of sunken ships.
      move: act
      irreversible: false
    O2:
      do: The German U-boat commander permits U-boats to continue aiding survivors of sunken ships.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An incident prompted reconsideration of U-boat policy toward survivors.
  - id: F2
    kind: situation
    status: confirmed
    fact: Before this decision, U-boats had often helped survivors of ships they had sunk.
  - id: F3
    kind: situation
    status: confirmed
    fact: The decision concerned whether to continue survivor assistance or prohibit it.
  - id: F4
    kind: situation
    status: confirmed
    fact: The contemplated prohibition covered attempts to save survivors of sunken ships.
  - id: F5
    kind: situation
    status: assessed
    fact: The stated rationale treated rescue as conflicting with the demands of warfare to destroy enemy ships and their
      crews.
  - id: F6
    kind: situation
    status: assessed
    fact: The rationale invoked Allied bombing of German cities and the alleged lack of regard for women and children.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The order treated rescuing survivors as conflicting with the demands of warfare to destroy enemy ships and their
      crews.
  - id: C2
    facts:
    - F6
    equity: norm_reciprocity
    favors:
    - O1
    weight: weak
    why: The order invoked Allied bombing of German cities, alleging a lack of regard for women and children, as a reason
      to stay hard.
  - id: C3
    facts:
    - F2
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: U-boats had often aided survivors before the order, showing that continued assistance was the prior practice; the
      account does not say this practice outweighed the order's stated rationale.
  reasoning:
    read: The decision was whether to continue a prior practice of helping survivors or prohibit that aid. The order chose
      prohibition on the stated grounds of warfare and Allied conduct; the trap is to treat the later commentary on the Nuremberg
      conviction as part of the commander's rationale.
    weighing: The decisive stated reason was that rescue conflicted with destroying enemy ships and crews {C1}. The order
      also invoked the alleged lack of regard for women and children in Allied bombing {C2}. The prior practice of aiding
      survivors is relevant context {C3}, but the account records no balancing that gave it priority over the order's rationale.
    tradecraft: At the decision level, state the policy choice and its rationale clearly, and distinguish the mission-based
      rationale from the appeal to enemy conduct. Do not infer legal findings or add operational procedures absent from the
      account.
    uncertainty: The account gives the order's stated reasons but does not establish their legal validity or provide a broader
      assessment of the applicable law of armed conflict.
    handoff: The account presents this as a command-level decision and records no referral. A present-day analogue should
      obtain competent legal review before adopting a policy that bars aid to people in distress.
    tempting_wrong:
      option: O2
      pull: U-boats had often helped survivors before the decision.
      why_wrong: That history establishes the prior practice, but the order rejected continuation on the stated ground that
        rescue conflicted with the demands of warfare.
    rejected:
      O2: The order prohibited continued assistance, treating rescue as inconsistent with its stated wartime priority of destroying
        enemy ships and crews.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A governing legal rule applicable to the decision required assistance to survivors and did not permit the prohibition.
      then: O2
      why: A binding legal requirement would displace the order's stated rationale as the basis for the decision.
    would_not_change:
    - id: noflip1
      if: The prior practice of aiding survivors were the only additional fact established.
      why: That practice is relevant context, but the account still presents the command's stated wartime rationale as the
        reason for the prohibition.
    watch_for:
    - id: watch1
      what: Whether the decision-maker's stated mission rationale continues to treat rescue as conflicting with destroying
        enemy ships and crews.
      favors:
      - O1
      why: That conflict is the order's principal stated reason for prohibiting assistance.
  lesson: A policy decision should distinguish its stated grounds from surrounding history and later commentary. A prior practice
    is relevant context, but it is not a decision-maker's reason unless it was actually weighed.
  limits: This scenario captures the order's stated rationale, not an independent legal judgment about whether the prohibition
    was lawful. It does not incorporate the source's later commentary about the Nuremberg conviction.
