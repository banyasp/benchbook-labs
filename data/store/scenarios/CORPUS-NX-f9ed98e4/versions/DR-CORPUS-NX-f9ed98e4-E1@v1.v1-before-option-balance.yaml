case:
  id: DR-CORPUS-NX-f9ed98e4-E1@v1
  title: Delegating Air-Defense Engagement Authority
  status: draft
  setting: National Training Center, rotation 25-02, C/6-56 ADA BN and the higher control cell.
  decider: C/6-56 ADA BN, working with the higher control cell
  agent: C/6-56 ADA BN, working with the higher control cell
  agent_role: decide
  situation: The joint framework permits engagement authority to be delegated from the joint force commander through air-defense
    echelons to an individual fire unit, subject to operational necessity and the rules of engagement. During a National Training
    Center rotation, C/6-56 ADA BN and the higher control cell were refining the authority arrangement against division guidance
    and a scenario-generated air threat. The published division ROE addressed declared hostile status, hostile intent, hostile
    act, and autonomous engagements. The decision is whether to retain authority at brigade level or delegate some authority
    to lower echelons, and how to divide authority by threat category.
  question: What should C/6-56 ADA BN, working with the higher control cell, do about allocating engagement authority by threat
    category under the published ROE?
  options:
    O1:
      do: C/6-56 ADA BN and the higher control cell approve the split allocation, assigning rotary-wing aircraft and group
        1–2 UAS to Stout VCs and fixed-wing aircraft and group 3–5 UAS to designated brigade authorities.
      move: act
      irreversible: false
    O2:
      do: C/6-56 ADA BN and the higher control cell reject the split allocation, assigning rotary-wing aircraft and group
        1–2 UAS and fixed-wing aircraft and group 3–5 UAS to designated brigade authorities.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Engagement authority originates with the joint force commander and may be delegated to the area air defense commander
      or to an individual fire unit, depending on operational necessity and the ROE for defensive counterair operations.
  - id: F2
    kind: capability
    status: confirmed
    fact: Decentralized authority can support timely engagements by short-range air defense units protecting the force, while
      execution still requires synchronicity with the area air defense plan.
  - id: F3
    kind: authority
    status: confirmed
    fact: Engagement boundaries must account for the coordinating altitude, other airspace users, and clearance of fires,
      requiring integration across division, brigade, and higher echelons.
  - id: F4
    kind: authority
    status: confirmed
    fact: The authorized echelon may be the area, regional, or sector air defense commander, an air defense battalion fire
      direction center, or an individual fire unit.
  - id: F5
    kind: authority
    status: confirmed
    fact: Further delegation of engagement authority depends on operational necessity and the rules of engagement for defensive
      counterair operations.
  - id: F6
    kind: situation
    status: confirmed
    fact: During rotation 25-02, C/6-56 ADA BN worked with the higher control cell to refine engagement authority to meet
      training objectives and better replicate real-world application.
  - id: F7
    kind: situation
    status: confirmed
    fact: The authority refinement involved planning and coordination aligned with a scenario-generated air threat and division
      guidance.
  - id: F8
    kind: authority
    status: confirmed
    fact: The published division ROE addressed declared hostiles, hostile intent, hostile act, and autonomous engagements.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The joint framework permits further delegation to an individual fire unit when operational necessity and the defensive-counterair
      ROE support it. That gives room for the chosen allocation, but does not require this particular split.
  - id: C2
    facts:
    - F2
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The stated value of decentralized authority is that short-range air defense units can make timely engagements to
      protect the force.
  - id: C3
    facts:
    - F2
    - F3
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: Decentralized authority still needs synchronicity with the area air defense plan, and engagement boundaries must
      account for other airspace users and clearance of fires. These requirements caution against delegation without cross-echelon
      integration.
  - id: C4
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The authority refinement was undertaken to meet the rotation's training objectives and better replicate real-world
      application, using planning aligned with the scenario-generated air threat and division guidance.
  - id: C5
    facts:
    - F5
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The published ROE supplied the governing standards, including declared hostile status, hostile intent, hostile act,
      and autonomous engagements. The allocation was made under those standards; they constrain the delegation but do not
      themselves prescribe this exact category split.
  reasoning:
    read: 'This is a choice about the level of delegated authority and its distribution by threat category, not a choice to
      dispense with the ROE. The trap is treating delegation as either inherently unlawful or as unlimited: the framework
      permits it when operational necessity and ROE support it, while requiring coordination.'
    weighing: 'The source''s stated reasons favor O1: the arrangement was refined to meet training objectives and better replicate
      real-world application, and decentralized authority can support timely force protection. Those reasons operate within
      the ROE and depend on maintaining synchronicity and cross-echelon integration. The source does not give a separate explanation
      for why these particular threat categories were divided at this line.'
    tradecraft: Record the delegated authority by threat category, identify the governing ROE standards, and document how
      the arrangement aligns with division guidance and the area air defense plan. Keep the boundaries and coordination requirements
      explicit; do not treat the training allocation as authority beyond the published ROE.
    uncertainty: The source records the allocation and its training rationale, but does not explain why the exact category
      boundaries were selected or report how the arrangement performed in engagements.
    handoff: C/6-56 ADA BN should work with the higher control cell, as it did, and coordinate with the relevant higher echelons
      because the source identifies division guidance, the area air defense plan, and cross-echelon integration as relevant
      to the authority arrangement.
    tempting_wrong:
      option: O2
      pull: Keeping all authority at brigade level may seem to simplify coordination and preserve centralized control.
      why_wrong: It would discard the source's stated benefits of timely decentralized authority and the stated aim of meeting
        training objectives and better replicating real-world application, without evidence that the ROE or coordination requirements
        ruled out the split.
    rejected:
      O2: The source chose the category-based delegation to meet training objectives and better replicate real-world application,
        rather than retaining all authority at brigade level.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The applicable ROE or operational circumstances did not support further delegation to the lower echelon.
      then: O2
      why: The source makes further delegation dependent on operational necessity and the ROE; without that basis, retaining
        authority at brigade level would be the supported alternative.
    - id: flip2
      if: The coordination and engagement-boundary requirements could not be integrated with the area air defense plan and
        other airspace users.
      then: O2
      why: The source identifies synchronicity, engagement boundaries, and cross-echelon integration as necessary constraints
        on decentralized authority.
    would_not_change:
    - id: noflip1
      if: The joint force commander remains the origin of engagement authority.
      why: That fact alone does not rule out delegation; the framework expressly permits delegation when operational necessity
        and ROE support it.
    watch_for:
    - id: watch1
      what: Whether the category-based allocation remains synchronized with the area air defense plan and its engagement boundaries.
      favors:
      - O2
      why: A failure to maintain that integration would weigh against decentralized authority.
  lesson: Delegate engagement authority only within the applicable ROE and when operational necessity supports it. Decentralization
    can improve timely action, but it must remain synchronized with the broader air defense plan and cross-echelon boundaries.
  limits: This reasoning concerns allocation of engagement authority in the stated training setting. It does not establish
    that this category split is required in other operations or replace the governing ROE, division guidance, or operational
    assessment.
