case:
  id: DR-CORPUS-NS-ca1e4a5d-E14@v1
  title: Authorization Under an Incomplete Picture
  status: draft
  setting: During a military exercise near Heilbronn, Germany; the division commander is considering a squadron commander's
    request to advance.
  decider: The division commander
  agent: The division commander
  agent_role: decide
  situation: The squadron commander requests permission to continue to Heilbronn. The commander assesses that enemy forces
    there are not expecting the advance and are not postured for it. The division commander has a detailed picture of the
    near side of the Neckar River, but the far side remains unknown. The commander knows the area is defended in strength,
    though the scale of that defense is uncertain. The squadron commander views the incomplete picture as a possible opportunity
    to act.
  question: What should the division commander do about the squadron commander's request to advance to Heilbronn?
  options:
    O1:
      do: The division commander permits the squadron to advance to Heilbronn.
      move: act
      irreversible: true
    O2:
      do: The division commander prohibits the squadron from advancing to Heilbronn.
      move: act
      irreversible: false
    O3:
      do: The division commander holds the request pending a fuller assessment of the area.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The squadron commander requested permission to continue to Heilbronn.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The squadron commander assessed that enemy forces in Heilbronn were not expecting the advance and were not postured
      for it.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The squadron commander had detailed knowledge of the near side of the Neckar River, but the far side remained unknown.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The squadron commander knew the area was defended in strength, but the extent of the defense was a surprise.
  - id: F5
    kind: situation
    status: assessed
    fact: The squadron commander considered the incomplete picture sufficient to present a valid opportunity.
  - id: F6
    kind: authority
    status: confirmed
    fact: The squadron commander sought permission from the division commander, who became involved in the decision.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The squadron commander assessed that the enemy was not expecting the advance or postured for it, and regarded the
      imperfect picture as a valid opportunity. The division commander accepted the chance to exploit that advantage.
  - id: C2
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O3
    - O2
    weight: weak
    why: The far side remained unknown and the area was defended in strength; the scale of that defense surprised the squadron
      commander. Those facts made an advance risky, even though the commander considered the available picture sufficient.
  - id: C3
    facts:
    - F1
    - F2
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The request concerned an opportunity the squadron commander believed existed at that moment, while the enemy was
      not expecting the advance. Recognizing and acting on such an opportunity was important to the decision.
  - id: C4
    facts:
    - F1
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The squadron commander sought permission and the division commander became involved and made the decision, keeping
      the authorization with the responsible command level.
  reasoning:
    read: 'This was a deliberate choice to act on a promising but incomplete local picture, not a claim that the whole area
      was known. The trap was treating uncertainty as either proof that the opportunity was safe or, conversely, as a reason
      that action was impossible: the area was known to be defended, but the far side and the defense''s full scale were not
      known.'
    weighing: The division commander approved because the squadron commander judged the enemy unprepared and the opportunity
      valid despite the incomplete picture {C1} {C3}. The unknown far side and unexpectedly strong defense were real risks
      {C2}, but the account presents them as uncertainty to accept rather than reasons that outweighed the opportunity. The
      advance ultimately enabled control of the bridge and damage to the opposing force, helping the division establish its
      intended defense. The balance depended on the squadron commander's local understanding being credible enough to support
      action without a complete picture.
    tradecraft: Make clear which parts of the picture are known, which remain uncertain, and why the opportunity is time-sensitive;
      set a point to reassess if the underlying assessment changes. Record the information and assumptions supporting authorization
      and the commander's rationale. These are decision-practice safeguards, not claims about steps taken in this episode.
    uncertainty: The near side was understood in detail, but the far side was not; the area was defended in strength, and
      the actual scale exceeded the squadron commander's estimate. The squadron commander nevertheless judged the opportunity
      valid and the incomplete picture a reality of the decision.
    handoff: The division commander made the authorization decision after the squadron commander requested permission. The
      account records the division commander's involvement and approval, not a referral to another authority.
    tempting_wrong:
      option: O3
      pull: Waiting for a fuller assessment could seem prudent when the far side is unknown and the defense's scale is uncertain.
      why_wrong: 'The squadron commander''s judgment was that a perfect picture was not available or necessary: the local
        picture was sufficient to recognize a valid opportunity, and the division commander authorized acting on it.'
    rejected:
      O2: The division commander did not prohibit the advance because the squadron commander assessed that the enemy was unprepared
        and that the incomplete picture still showed a valid opportunity.
      O3: The division commander did not hold the request for a fuller assessment because the decision was to act on the opportunity
        despite an imperfect picture.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible new information removed the basis for judging that the enemy was unprepared or that an actionable opportunity
        remained.
      then: O3
      why: Without the stated opportunity, the reason for accepting the uncertainty would be substantially weakened.
    would_not_change:
    - id: noflip1
      if: The picture remained incomplete, with the far side unknown, while the squadron commander still assessed the available
        local picture as sufficient and the opportunity as valid.
      why: The rationale accepts that the picture was not perfect and does not treat incompleteness alone as a reason to refuse
        action.
    watch_for:
    - id: watch1
      what: Whether new information changes the assessment of the enemy's readiness, the extent of the defense, or the opportunity
        to act.
      favors:
      - O3
      why: A change in those assessments could undermine the basis on which the division commander accepted the risk.
  lesson: An incomplete picture need not rule out action when the available local information supports a credible, time-sensitive
    opportunity. Make the uncertainty explicit and weigh it against the consequences of letting that opportunity pass.
  limits: This reasoning concerns the authorization judgment in the described exercise, not a general rule to advance into
    an uncertain or strongly defended area. It does not establish a legal threshold or substitute for applicable orders, authority,
    or circumstances in another operation.
