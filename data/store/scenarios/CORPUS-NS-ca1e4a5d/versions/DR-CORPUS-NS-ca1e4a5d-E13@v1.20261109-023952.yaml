case:
  id: DR-CORPUS-NS-ca1e4a5d-E13@v1
  title: Launch Timing Under Incomplete Intelligence
  status: draft
  setting: Nelson Lake phase-line decision during an anticipated attack; brigade aviation command.
  decider: The brigade battle captain
  agent: The brigade battle captain
  agent_role: decide
  situation: An attack was expected and had reached the first phase line. The brigade battle captain was holding the aviation
    launch while seeking a better intelligence picture. The intended mission was to delay the opposing force farther from
    brigade positions. The available picture remained incomplete, and the attacker's movement had to be assessed without a
    perfect read.
  question: What should the brigade battle captain do about authorizing the aviation launch at this point?
  options:
    O1:
      do: The brigade battle captain declines launch pending additional intelligence.
      move: act
      irreversible: false
    O2:
      do: The brigade battle captain authorizes launch on the existing reports.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: An attack was expected.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The attack had reached the first phase line.
  - id: F3
    kind: situation
    status: assessed
    fact: The brigade battle captain was holding the launch while seeking a better intelligence picture.
  - id: F4
    kind: situation
    status: assessed
    fact: The intended mission was to delay the opposing force as far back as possible.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The available intelligence did not provide a perfect read of the situation.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The aviation commander assessed that additional information could improve situational awareness but would not make
      it perfect.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The attack had reached the first phase line, yet the launch was being held for a better picture. The aviation commander’s
      stated judgment was that action should begin before waiting for a perfect read caused further delay.
  - id: C2
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The information was incomplete, and additional information could improve awareness without making it perfect. The
      source rejects treating a perfect intelligence picture as a prerequisite for deciding.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The mission was to delay the opposing force farther from brigade positions. In the account, waiting until the next
      phase line meant the force was already in contact and the intended delay was derailed.
  reasoning:
    read: This is a time-sensitive decision under incomplete information, not a choice between acting with certainty and acting
      blindly. The trap is treating more information as if it will eventually produce a perfect read, while the opportunity
      to achieve the intended delay is passing.
    weighing: 'The aviation commander’s stated reasons favor authorizing launch on the existing reports: the attack had reached
      the first phase line, the mission depended on acting before the opposing force advanced farther, and additional information
      would not eliminate uncertainty. The account describes the eventual wait for a better read as derailing the plan. The
      balance depends on the assessed attack and the shrinking time available to achieve the mission, not on reaching an unattainable
      level of certainty.'
    tradecraft: Separate what is assessed from what remains uncertain, state why the mission is time-sensitive, and record
      the basis for acting before the picture is complete. Communicate the decision promptly through the established command
      channel.
    uncertainty: The picture remained incomplete. The source’s point is that improved situational awareness does not become
      perfect awareness; the commander must eventually make a judgment with the information available.
    handoff: The brigade battle captain is the decision-maker in this scenario. The aviation commander’s assessment can inform
      that decision, but seeking additional information should not become an unexamined reason to defer it.
    tempting_wrong:
      option: O1
      pull: Waiting may feel safer because additional intelligence could improve the picture.
      why_wrong: The source warns that pursuing a perfect read can delay action until the mission’s intended effect is no
        longer achievable, while more information still will not make the picture perfect.
    rejected:
      O1: Declining launch pending additional intelligence was not chosen because the source judges that waiting for a better
        read delayed action and derailed the intended mission.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible new information materially undermined the assessment that an attack was expected or had reached the first
        phase line.
      then: O1
      why: The case for acting now rests on the assessed attack and its progress; if those premises were materially undermined,
        the stated urgency would weaken.
    - id: flip2
      if: The intended delay could no longer be achieved and no other mission purpose justified authorizing launch.
      then: O1
      why: The decisive concern is that waiting derailed the intended mission; if that mission were already unattainable,
        that reason to launch would no longer apply.
    would_not_change:
    - id: noflip1
      if: Additional information improved situational awareness but still did not provide a perfect read.
      why: The aviation commander expressly reasoned that more information could improve awareness but would not make it perfect,
        and that decisions cannot depend on perfect intelligence.
    watch_for:
    - id: watch1
      what: Delay caused by continuing to seek a better intelligence picture as the attack advances.
      favors:
      - O2
      why: Waiting for a better read was identified as the reason action came too late for the intended delay.
  lesson: Do not make perfect intelligence the threshold for a time-sensitive decision when further information can improve
    awareness but cannot remove uncertainty. Weigh the cost of waiting against the mission’s purpose, and act on a sufficiently
    grounded assessment before delay makes that purpose unattainable.
  limits: This reasoning does not establish a general rule to launch whenever an attack is expected or to disregard new intelligence.
    It applies to the account’s assessed, time-sensitive situation and does not resolve a case in which the underlying threat
    assessment or authority to act is materially different.
