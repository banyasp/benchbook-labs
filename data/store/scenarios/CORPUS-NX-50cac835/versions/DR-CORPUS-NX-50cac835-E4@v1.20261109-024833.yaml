case:
  id: DR-CORPUS-NX-50cac835-E4@v1
  title: CORONA Launch Standdown Decision
  status: draft
  setting: CORONA, November 1959 to February 1960, CORONA program
  decider: CORONA program decision-makers; the office is not specified
  agent: CORONA program decision-makers; the office is not specified
  agent_role: decide
  situation: CORONA was facing failure causes that had not yet been identified and addressed. The decision-makers could pause
    launches or continue them. Intensive R&D was available to identify and eliminate the causes of failure. The decision concerned
    whether to use a standdown while that work was pursued.
  question: What should the CORONA program decision-makers do about launches while failure causes are being addressed?
  options:
    O1:
      do: The CORONA program decision-makers pause launches and conduct intensive R&D to identify and eliminate failure causes.
      move: act
      irreversible: false
    O2:
      do: The CORONA program decision-makers continue launches and conduct intensive R&D to identify and eliminate failure
        causes.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A standdown was in effect in CORONA.
  - id: F2
    kind: situation
    status: confirmed
    fact: The standdown period ran from November 1959 until February 1960.
  - id: F3
    kind: situation
    status: confirmed
    fact: The standdown was for intensive R&D efforts.
  - id: F4
    kind: situation
    status: confirmed
    fact: The R&D efforts were intended to identify causes of failure.
  - id: F5
    kind: situation
    status: confirmed
    fact: The R&D efforts were intended to eliminate causes of failure.
  - id: F6
    kind: situation
    status: confirmed
    fact: The failures were associated with CORONA.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The causes of CORONA failures were still to be identified, supporting a pause while that work was undertaken.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The R&D was intended not only to identify but also to eliminate failure causes, favoring a standdown while that work
      proceeded.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The chosen course was a standdown lasting from November 1959 until February 1960 for intensive R&D, indicating that
      pausing launches was the means used to pursue the stated work.
  reasoning:
    read: This is a choice between launching while failure causes remain under investigation and using a standdown for intensive
      R&D directed at identifying and eliminating those causes. The trap is treating continued launches as neutral while the
      work proceeds; the stated course instead links the standdown to that work.
    weighing: 'The stated reasons all support {O1}: the R&D was intensive and aimed both to identify and eliminate CORONA
      failure causes. The source gives no competing reason to continue launches and no separate account of the costs of pausing.
      The balance therefore depends on the unresolved failure causes and the need for the described R&D.'
    tradecraft: Record the standdown's stated purpose and review the launch decision when the R&D work has addressed that
      purpose. The source does not prescribe a review process or other implementation details.
    uncertainty: The passage gives the standdown's duration and purpose but does not explain the decision-makers' deliberations,
      identify the causes, or state whether the standdown resolved them.
    handoff: The source does not identify a separate approving office or describe a handoff. Any coordination beyond the stated
      decision and R&D purpose is not established by this passage.
    tempting_wrong:
      option: O2
      pull: Continuing launches could appear compatible with conducting R&D at the same time.
      why_wrong: The stated approach was to put a standdown in effect for intensive work on identifying and eliminating failure
        causes, rather than continue launches during that work.
    rejected:
      O2: Continuing launches was not the course used; the stated standdown allowed intensive R&D to identify and eliminate
        failure causes.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The failure causes had been identified and eliminated, so the stated need for the standdown's R&D no longer applied.
      then: O2
      why: With the stated purpose of the R&D completed, this passage would no longer supply a reason to pause launches for
        that work.
    - id: flip2
      if: Decision-makers established that launches could safely continue without interfering with the intensive R&D or leaving
        the failure causes unaddressed.
      then: O2
      why: That would remove the conflict between continuing launches and pursuing the work that motivated the standdown.
    would_not_change:
    - id: noflip1
      if: There were pressure to maintain launch activity, but the failure causes remained unidentified and the intensive
        R&D remained necessary.
      why: The source's stated rationale for the standdown would remain in place; schedule pressure alone is not addressed
        as a reason to continue.
    watch_for:
    - id: watch1
      what: Whether the R&D has identified and eliminated the failure causes.
      favors:
      - O1
      why: That is the stated purpose of the work associated with the standdown and bears on whether its rationale remains.
  lesson: When a program pauses activity to conduct intensive work aimed at identifying and eliminating failure causes, keep
    the pause in place while that work remains necessary. Reconsider continuation when the stated purpose of the pause has
    been addressed or when evidence shows the work and ongoing activity can safely coexist.
  limits: The passage does not state a legal requirement, the specific failure causes, or the costs and risks of delaying
    launches. This reasoning does not establish a general rule to suspend launches whenever failures occur.
  library:
    domain: operational-command
    family: CORPUS-NX-50cac835
    source: https://www.cia.gov/static/e2f268aab833f2b7daf95e59a90f773e/Corona-Between-the-Sun-and-the-Earth.pdf
    episode_focus: The decision point is whether to pause launches for corrective work or continue launching; the passage
      states that a standdown was used to permit intensive R&D to identify and address failure causes. Exclude the technical
      failure mechanisms and corrective procedures themselves.
