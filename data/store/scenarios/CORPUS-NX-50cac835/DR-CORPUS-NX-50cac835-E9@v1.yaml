case:
  id: DR-CORPUS-NX-50cac835-E9@v1
  title: Reviewing Access Billet Schedules
  status: draft
  setting: United States Intelligence Board, after the September 20 re-examination; location not specified.
  decider: The United States Intelligence Board
  agent: The United States Intelligence Board
  agent_role: decide
  situation: A paper before the United States Intelligence Board sets out participating agencies' needs and their functional
    responsibilities for personnel requiring access to the materials. The Secretary of Defense has approved revised billet
    schedules for Defense components, and a review following the September 20 meeting reduced the overall proposed needs.
    The review called for scrutiny of functional need and for excluding people included by position who did not require access.
    The revised Defense schedules have not been retyped and distributed, although each Defense component has its own paper
    and an annex summarizes participating agencies' needs. The Board must decide whether to approve the paper.
  question: What should the United States Intelligence Board do about the paper containing the revised billet schedules?
  options:
    O1:
      do: The United States Intelligence Board approves the paper containing the revised billet schedules.
      move: act
      irreversible: false
    O2:
      do: The United States Intelligence Board rejects the paper containing the revised billet schedules.
      move: act
      irreversible: false
    O3:
      do: The United States Intelligence Board defers action on the paper pending further agency review.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Committee on Overhead Reconnaissance submitted a memorandum explaining the United States government's needs
      for use of the materials, with annexes defining participating agencies' functional responsibilities and personnel needs.
  - id: F2
    kind: authority
    status: confirmed
    fact: A Defense representative said Defense billets would not be approved until the Secretary of Defense's approval had
      been secured.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Board's acting chair urged rigorous examination of billet needs by function and need, excluding people included
      by position who had no requirement for access.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Secretary of Defense approved revised billet schedules for Defense components.
  - id: F5
    kind: situation
    status: confirmed
    fact: The revised Defense schedules had not been retyped and distributed; each Defense component had its own paper, and
      an annex summarized participating agencies' needs.
  - id: F6
    kind: situation
    status: confirmed
    fact: Re-examination after the September 20 meeting reduced the overall billet needs from those in the referenced schedules.
  - id: F7
    kind: authority
    status: confirmed
    fact: The paper provided for approval to be sent to the White House for comment, as requested by a senior official.
  - id: F8
    kind: situation
    status: confirmed
    fact: The recommendation before the United States Intelligence Board was to approve the paper.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Defense approval had been withheld pending the Secretary of Defense's approval; the Secretary has now approved the
      revised Defense schedules.
  - id: C2
    facts:
    - F3
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The review applied scrutiny to functional need rather than access based on position alone, and re-examination reduced
      the overall proposed needs.
  - id: C3
    facts:
    - F1
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The paper sets out participating agencies' responsibilities and personnel needs; although the revised Defense schedules
      were not retyped and distributed, each component had its own paper and an annex summarized agency needs.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Approval is to be sent to the White House for comment as requested, so approval follows the stated review step rather
      than foreclosing it.
  reasoning:
    read: The decision is whether to approve a revised, function-based account of who needs access, not whether to grant access
      automatically by position. The lack of a retyped, distributed Defense schedule may invite deferral, but component papers
      and an annex summary were available; the totals themselves should not be inferred.
    weighing: The Secretary of Defense's approval addresses the stated prerequisite for Defense billets {C1}. The subsequent
      functional scrutiny and reduced overall needs support approval as a way to limit access to those with a requirement
      while retaining agency needs {C2, C3}. The balance depends on the revised schedules reflecting that scrutiny; approval
      is also followed by White House comment {C4}.
    tradecraft: Record that approval rests on functional need, the Secretary of Defense's approval, and the post-review reduction;
      do not reconstruct unreadable totals. Preserve the component papers and annex summary with the decision and send the
      approved paper for White House comment.
    uncertainty: The overall reduction is described but its amount is unreadable, and the revised Defense schedules were not
      retyped and distributed. The available information supports the recommendation but does not establish individual billet
      totals.
    handoff: The United States Intelligence Board makes the approval decision; the Secretary of Defense has approved the Defense
      schedules, and the paper is to go to the White House for comment as requested.
    tempting_wrong:
      option: O3
      pull: Deferring could seem prudent because the revised Defense schedules were not retyped and distributed.
      why_wrong: The component papers and an annex summary were available, and the recommendation was to approve the paper
        after the needs had been re-examined.
    rejected:
      O2: Rejecting would disregard the Secretary of Defense's approval and the reduced, functionally scrutinized needs that
        support the paper.
      O3: Deferral was not recommended where the component papers and annex summary were available and the re-examination
        had already reduced proposed needs.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Secretary of Defense's approval of the revised Defense schedules had not been secured.
      then: O3
      why: The Defense representative said those billets would not be approved until that approval had been secured.
    - id: flip2
      if: Further examination showed that the proposed schedules still included people by position without a functional requirement
        for access.
      then: O3
      why: On that record, the stated concern about access without need would remain unresolved and further review would be
        appropriate.
    would_not_change:
    - id: noflip1
      if: The revised Defense schedules remained unretyped, while the component papers and annex summary remained available.
      why: The lack of a retyped distribution alone would not outweigh the available agency materials and the recommendation
        to approve.
    watch_for:
    - id: watch1
      what: Whether White House comments identify a concern with the revised schedules or the stated access needs.
      favors:
      - O3
      why: The paper is to be sent for comment, and a substantive concern could warrant renewed consideration.
  lesson: Access schedules should be judged by functional need, not by position alone. Approval is supported when the required
    authority has approved the schedules and review has reduced proposed access needs; missing distribution copies do not
    by themselves defeat approval when component papers and a summary are available.
  limits: This reasoning concerns approval of the described billet schedules and does not establish who individually qualifies
    for access or what the unreadable totals were. It does not apply if required approval is absent or the functional-need
    review has not actually been completed.
