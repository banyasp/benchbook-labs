case:
  id: DR-OHA-26-0047-restyle1@v1
  title: Restoration of Access Authorization under Guideline F [restyle]
  status: needs_review
  setting: Department of Energy, Office of Hearings and Appeals – June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: An employee of a DOE contractor holds a position that requires a security clearance. The Local Security Office
    raised a Guideline F concern because of the employee's history of delinquent debts and unmet financial obligations. The
    employee submitted proof that the debts have been satisfied, that he is enrolled in a financial-coaching program, and
    that an April 2026 credit report shows all accounts current with no past-due balances. Part 710 regulations presume against
    granting or restoring a clearance and obligate the employee to demonstrate that approval would not threaten the common
    defense and security. At the hearing, the Administrative Judge must determine whether to restore the employee's access
    authorization.
  question: What action should the Administrative Judge take regarding the employee's access authorization under Guideline
    F?
  options:
    O1:
      do: The Judge restores the employee's access authorization.
      move: act
      irreversible: false
    O2:
      do: The Judge postpones the decision pending additional financial documentation.
      move: hold
      irreversible: false
    O3:
      do: The Judge denies the employee's access authorization.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office raised a Guideline F concern based on the employee's delinquent debts and a pattern of
      unmet financial obligations.
  - id: F3
    kind: situation
    status: confirmed
    fact: Around 2009 the employee filed for Chapter 7 bankruptcy, discharging roughly $150,000 of obligations.
  - id: F4
    kind: situation
    status: confirmed
    fact: In July 2025 the employee had two overdue accounts—Debt A, about $8,000 in collections, and Debt B, a $3,500 charged-off
      balance—that were later settled; Debt A was paid in full in December 2025 and a repayment schedule for Debt B was followed
      through April 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee participates in a financial-coaching program offered through the employer's employee assistance initiative
      and has worked with a certified coach to develop a budget.
  - id: F6
    kind: situation
    status: confirmed
    fact: A credit report dated April 2026 indicates the employee is current on all accounts with no past-due balances.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a notification letter asserting it possesses reliable information that creates
      substantial doubt about the employee's eligibility for a clearance.
  - id: F8
    kind: situation
    status: confirmed
    fact: Part 710 regulations establish a presumption against granting or restoring a clearance and require the individual
      to show that approval would not endanger the common defense and security.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Documentation confirms Debt A has been fully paid and Debt B remains on a current repayment schedule, while the April
      2026 credit report shows zero past-due balances, demonstrating complete resolution of the cited debts.
  - id: C2
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Active participation in the employer-sponsored financial-coaching program reflects a bona-fide effort to correct
      prior financial shortcomings, satisfying mitigating factor (c) of Guideline F.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The April 2026 credit report verifies that the employee has no outstanding past-due accounts, confirming a clean
      credit standing.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although Part 710 imposes a presumption against clearance, it also permits the individual to overcome that presumption
      by presenting adequate mitigating evidence.
  - id: C5
    facts:
    - F3
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The bankruptcy and earlier financial difficulties occurred many years ago and were largely beyond the employee's
      control, meeting mitigating factor (a) that the behavior is unlikely to recur.
  reasoning:
    read: The LSO cited a Guideline F security issue based on historic delinquent debts and a pattern of unmet financial obligations.
      The analytical pitfall is to treat any prior debt as an automatic bar, overlooking possible mitigation under the Adjudicative
      Guidelines.
    weighing: The Judge weighed the strong mitigating evidence—full settlement of Debt A, an active repayment plan for Debt
      B, a current credit report, and documented financial counseling—against the regulatory presumption against granting.
      Considerations C1-C3 together satisfy mitigating factors (c) and (d), while C5 addresses the time-elapsed factor (a).
      The weaker consideration C4 acknowledges the presumption but is outweighed by the strong mitigations, leading to a net
      finding that the employee's reliability is no longer in doubt.
    tradecraft: The decision is entered into the formal OHA decision, citing the relevant exhibits and regulatory provisions,
      and the restoration order is filed in the employee's personnel security record.
    uncertainty: Minimal; the evidence is documentary and the guidelines are explicit. The only lingering uncertainty concerns
      future financial conduct, which will be monitored through periodic reinvestigations.
    handoff: The Administrative Judge decides unilaterally, as the OHA authority, because the hearing record is complete and
      no further factual development is required.
    tempting_wrong:
      option: O3
      pull: The statutory presumption against granting a clearance may lure the judge toward denial despite the presented
        mitigations.
      why_wrong: Denial would disregard the documented remediation of the specific Guideline F concerns, contrary to the Adjudicative
        Guidelines.
    rejected:
      O2: Deferring the decision for additional paperwork is unnecessary because the record already contains sufficient evidence
        of debt settlement and counseling.
      O3: A denial conflicts with the source's determination that the employee has mitigated the Guideline F security concerns.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee failed to settle Debt A or missed scheduled payments on Debt B, leaving an outstanding balance.
      then: O3
      why: Absent proof of debt resolution, mitigating factors (c) and (d) would not be met, leaving the Guideline F issue
        unaddressed.
    - id: flip2
      if: The employee discontinued participation in the financial-coaching program and showed no improvement in budgeting.
      then: O3
      why: Loss of a demonstrated remediation effort would eliminate mitigating factor (c), undermining the conclusion that
        the security concern has been resolved.
    would_not_change:
    - id: noflip1
      if: The employee's bankruptcy remains on the credit file but dates back more than ten years.
      why: The passage of time and the circumstances of the bankruptcy satisfy mitigating factor (a); the record alone does
        not revive the security concern.
    watch_for:
    - id: watch1
      what: Any new delinquent account appearing on subsequent credit reports.
      favors:
      - O3
      why: A fresh financial lapse would signal a recurrence of the behavior that originally triggered the Guideline F concern.
  lesson: Guideline F permits restoration of a clearance when the individual shows full resolution of delinquent debts, engages
    in credible financial counseling, and maintains a current credit profile, thereby satisfying the mitigating factors outlined
    in the Adjudicative Guidelines.
  limits: This analysis applies only when the individual furnishes concrete, documented proof of debt settlement and ongoing
    remediation. It does not extend to situations where debts remain unpaid, counseling is absent, or new financial problems
    arise after the decision.
