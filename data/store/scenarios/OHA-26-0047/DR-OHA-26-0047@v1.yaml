case:
  id: DR-OHA-26-0047@v1
  title: Restoration of Access Authorization under Guideline F
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires an access authorization. The Local
    Security Office raised security concerns under Guideline F because of the Individual’s delinquent debts and a history
    of not meeting financial obligations. The Individual presented evidence that the debts have been resolved, that he is
    participating in a financial coaching program, and that his credit report from April 2026 indicates he is current on all
    accounts with no past‑due balances. The regulations governing the proceeding impose a presumption against granting or
    restoring a clearance and require the Individual to demonstrate that granting will not endanger security. At the hearing,
    the Administrative Judge must decide whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline F?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: false
    O2:
      do: The Administrative Judge holds the decision pending additional financial documentation.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline F based on the Individual’s delinquent debts
      and history of not meeting financial obligations.
  - id: F3
    kind: situation
    status: confirmed
    fact: Around 2009 the Individual filed for Chapter 7 bankruptcy, discharging approximately $150,000 of debts.
  - id: F4
    kind: situation
    status: confirmed
    fact: In July 2025 the Individual had two past‑due debts (Debt A about $8,000 in collections and Debt B $3,500 charged‑off)
      that were later settled, with Debt A paid off in December 2025 and a payment plan for Debt B with payments made through
      April 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual has been participating in a financial coaching program through his employer’s employee assistance
      program and has created a budget with a certified financial coach.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual’s credit report from April 2026 indicates he is current on all accounts with no past‑due balances.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating it possessed reliable information creating substantial
      doubt about the Individual’s eligibility for access authorization.
  - id: F8
    kind: situation
    status: confirmed
    fact: The regulations in Part 710 impose a presumption against granting or restoring a clearance and require the Individual
      to prove that granting will not endanger the common defense and security.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The Individual has fully satisfied Debt A and is adhering to a payment plan for Debt B, with documentation showing
      zero balance on Debt A and recent payments on Debt B, and a credit report confirming no current past‑due accounts.
  - id: C2
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Participation in an employer‑sponsored financial‑coaching program demonstrates a good‑faith effort to remediate past
      financial problems, satisfying mitigating factor (c) of Guideline F.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: An April 2026 credit report showed that the Individual was current on all accounts with no past‑due balances.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although Part 710 presumes against granting a clearance, the regulation also allows the individual to overcome that
      presumption by presenting sufficient mitigating evidence.
  - id: C5
    facts:
    - F3
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The bankruptcy and earlier financial distress occurred many years ago and were largely beyond the Individual’s control,
      satisfying mitigating factor (a) that the behavior is unlikely to recur.
  reasoning:
    read: The LSO raised a Guideline F security concern based on past delinquent debts and a history of unmet financial obligations.
      The trap is to assume that any past debt automatically bars a clearance, ignoring the possibility of mitigation under
      the Adjudicative Guidelines.
    weighing: The Administrative Judge weighed the strong mitigating evidence—complete resolution of Debt A, an active payment
      plan for Debt B, current credit standing, and documented financial counseling—against the regulatory presumption against
      granting. C1‑C3 collectively satisfy mitigating factors (c) and (d), and C5 addresses the time‑elapsed factor (a). The
      weak consideration C4 acknowledges the presumption but is outweighed by the strong mitigations, leading to a net finding
      that the Individual’s reliability is no longer in doubt.
    tradecraft: The decision is recorded in the formal OHA Decision, citing the specific exhibits and regulatory provisions,
      and the restoration order is entered into the Individual’s personnel security file.
    uncertainty: Minimal; the evidence is documentary and the guidelines are clear. The only residual uncertainty is future
      financial behavior, which is monitored through periodic reinvestigations.
    handoff: The Administrative Judge decides alone, as the OHA authority, because the hearing record is complete and no further
      factual development is required.
    tempting_wrong:
      option: O3
      pull: The presumption against granting a clearance could tempt the judge to deny restoration despite mitigation.
      why_wrong: Denial would ignore the clear, documented mitigation of the specific Guideline F concerns, contrary to the
        Adjudicative Guidelines.
    rejected:
      O2: Holding the decision pending additional documentation is unnecessary because the record already contains sufficient
        proof of debt resolution and counseling.
      O3: Denial is inconsistent with the source’s finding that the Individual has mitigated the security concerns under Guideline F.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual failed to resolve Debt A or missed payments on Debt B, leaving an outstanding balance.
      then: O3
      why: Without evidence of debt resolution, the mitigating factors (c) and (d) would not be satisfied, leaving the Guideline F
        concern unmitigated.
    - id: flip2
      if: The Individual discontinued participation in the financial‑coaching program and showed no budgeting improvements.
      then: O3
      why: The loss of a good‑faith remediation effort would remove mitigating factor (c), undermining the finding that the
        security concern is resolved.
    would_not_change:
    - id: noflip1
      if: The Individual’s past bankruptcy remains on his record but is over a decade old.
      why: The age and circumstances of the bankruptcy satisfy mitigating factor (a); it does not by itself re‑ignite the
        security concern.
    watch_for:
    - id: watch1
      what: Any new delinquent debt appearing on future credit reports.
      favors:
      - O3
      why: A new financial lapse would indicate a recurrence of the behavior that originally raised Guideline F concerns.
  lesson: Under Guideline F, a clearance can be restored when the individual demonstrates full resolution of delinquent debts,
    engages in credible financial counseling, and shows current credit standing, thereby satisfying the mitigating factors
    outlined in the Adjudicative Guidelines.
  limits: This reasoning applies only when the individual provides concrete, documented proof of debt resolution and ongoing
    remediation. It does not extend to cases where debts remain unpaid, where counseling is absent, or where new financial
    problems arise after the decision.
